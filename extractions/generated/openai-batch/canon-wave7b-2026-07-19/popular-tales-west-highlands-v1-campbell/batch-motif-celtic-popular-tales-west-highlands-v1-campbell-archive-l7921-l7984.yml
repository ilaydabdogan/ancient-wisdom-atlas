canonical_text:
  quote: '"plenty of fish for his first son"'
  summary: A Skye fisher named Duncan bargains with a sea-maiden, receiving fish and
    a fertility gift that produces sons, foals, and pups. His eldest son Iain later
    learns he belongs to the mermaid and leaves to avoid salt water. Iain gains aid
    from spellbound animals after dividing a horse carcass, becomes a king's herd,
    arms himself with an iron staff, and defeats cattle-stealing giants with lion
    and wolf assistance or transformation. The victories bring flying fillies, colored
    dresses, and abundant milk; a third giant episode begins at the close of the excerpt.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage identifies the tale as another version told in South Uist by Donald
    MacPhie and sets the narrated action with a poor old fisher named Duncan in Skye.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: While Duncan is fishing, a sea-maiden rises beside his boat and speaks to
    him about his lack of fish.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Duncan and the sea-maiden make a bargain: plenty of fish in exchange for
    Duncan''s first son, though Duncan says he has none at that time.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sea-maiden gives Duncan an unspecified thing to give to his wife, mare,
    and dog; the result is three sons, three foals, and three pups, and the eldest
    son is named Iain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When Iain is eighteen, he finds his mother weeping, learns that he belongs
    to the mermaid, and says he will go where there is no salt water.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Iain mounts one of the horses and comes to an old horse carcass where a lion,
    a wolf, and a Seobhag are present.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The lion asks Iain to divide the carcass; after he does so, the animals thank
    him and say they were under spells and will aid him when needed, with the narrator
    uncertain whether the wording means aid or transformation into the animals.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Iain becomes a king's herd and has a smith make iron staffs; the first two
    bend, while the third is serviceable.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: While Iain is herding in a fine grass park, a Fuath with seven heads, seven
    humps, and seven necks takes six cattle by the tails.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage parenthetically compares the Fuath's dragging cows by the tail
    with Cacus.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: Iain confronts the Fuath; either he thinks of the lion or becomes one, and
    a lion seizes the giant and puts him to earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The defeated giant offers as ransom a white filly that can go through the
    skies and a white dress; Iain cuts off the giant's heads.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the first victory, so much milk is present that carpenters must be sent
    for to make dishes for it.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: The next day, a similar giant takes eight cows, and Iain with the wolf or
    as a wolf defeats him, receives a red flying filly and a red dress, and cuts off
    the heads.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: On the third day, a still larger giant appears and begins taking nine cows.
  category: sequence
  evidence_refs:
  - ev:11
