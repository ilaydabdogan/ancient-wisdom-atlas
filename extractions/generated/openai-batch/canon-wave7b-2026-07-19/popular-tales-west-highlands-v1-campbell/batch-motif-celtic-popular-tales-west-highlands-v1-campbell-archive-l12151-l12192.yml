canonical_text:
  quote: ''
  summary: A male protagonist uses a whistle to summon an eagle, who removes him from
    a coach and fills it with dirt. The king is angered when dirt falls on him from
    the coach and orders the horse gillies hanged. The king then sends a confidential
    servant to bring the black, coal-covered bellows-blowing gillie from the smithy.
    After cleaning himself, the gillie again summons the eagle, who brings a gold
    and silver dress associated with a big giant. Dressed in it, he arrives at the
    king's palace, is received as a splendid man, tells his story, sees rival intended
    bridegrooms hanged, marries the king's big daughter, and celebrates a long wedding.
  language: English
  quote_policy: summarized
