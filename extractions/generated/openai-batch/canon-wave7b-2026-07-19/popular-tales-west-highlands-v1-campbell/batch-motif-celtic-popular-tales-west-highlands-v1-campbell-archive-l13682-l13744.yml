canonical_text:
  quote: ''
  summary: A poor man obtains fishing gear, fishes several lochs, and gives his trout
    to a poor woman. The next day he decides to go to Ireland, plucks sixteen apples,
    and uses them as stepping places across the sea until he reaches shore. He travels
    swiftly to O'Domhnuill's city and court, leaps over its top and turret, and is
    confronted by O'Domhnuill, who demands to know where he came from.
  language: English
