canonical_text:
  quote: ''
  summary: 'The narrator describes visits to Lapp camps: after a meal and a shooting
    excursion with the docker''s dog, a docker carries a newly slaughtered reindeer
    calf home. At another camp, a Lapp woman in a tent serves coffee and reindeer
    cream with a silver spoon, wears silver ornaments and blue clothing, and owns
    a bone tool for weaving ankle bands. The narrator watches children crack bones
    for marrow and dogs receive leftovers in special bowls, then notes that bones
    in a South Uist hut might resemble the remains of such a feast. The passage closes
    with a description of a cota as a pyramidal dwelling of sods and birch sticks.'
  language: English
  quote_policy: summarized
