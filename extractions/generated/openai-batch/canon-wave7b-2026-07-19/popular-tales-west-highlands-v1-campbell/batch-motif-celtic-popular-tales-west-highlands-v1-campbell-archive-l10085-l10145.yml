canonical_text:
  quote: ''
  summary: John is abandoned after being treated as dead and deprived of three bottles
    of water. A smith finds him and puts him among rusty iron, leaving him rough-skinned
    and bald. In the Green Isle, the woman John left behind bears a son and receives
    a bird that will identify the child's father by settling on his head. After failed
    tests in the Green Isle and Erin, the bird settles on the disguised John. He is
    recognized as the father and as the one who won the bottles of water. His two
    brothers receive the treatment they had intended for him, and John marries the
    daughter of the king of the Green Isle in a long, rich wedding.
  language: English
  quote_policy: summarized
