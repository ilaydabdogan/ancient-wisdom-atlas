canonical_text:
  quote: ''
  summary: In the outer tale, Conal Crovi is about to be hanged, and the king's three
    sons each offer to take his place. Conal proposes building a ship and stealing
    three black whitefaced stallions from the King of Eirinn to restore the wealth
    of Sasunn. The party reaches the palace, hides in a hogshead after the stallions
    cry out, and is discovered. Conal is bound and imprisoned in a peat corner while
    the king's sons are taken upstairs. After a feast, the king summons Conal to tell
    a tale; Conal asks for the worth of its telling, excluding his own head or a companion's
    head, and the king agrees. In the embedded tale, Conal as a young lad takes service
    as an ignorant pilot to Rome, is abandoned on an island, and meets a crying woman
    who reports the island heiress's death and imminent burial.
  language: English
  quote_policy: summarized
