candidate_motifs:
- id: motif:1
  label: Cannibal giantess defeated by mouth trick
  taxonomy_refs: []
  basis: The Carlin asks the hero to come down so she can eat him; he tells her to
    open her mouth and kills her by thrusting an iron staff down her throat.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage identifies the event plainly but does not name it as a standard
    motif.
- id: motif:2
  label: Magical grooming objects confer beauty and status
  taxonomy_refs: []
  basis: The basin makes the user beautiful, and the silver comb makes him grand;
    he later uses them before being accepted in company and marrying.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The objects' powers are stated, but no taxonomy label is supplied in the
    passage.
- id: motif:3
  label: Sea monster demands a human victim selected by lot
  taxonomy_refs:
  - sacrifice
  basis: The Draygan comes from the sea, someone must be eaten each time, and the
    lot falls on the king's daughter.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The victim-selection resembles a sacrificial offering, but the passage
    does not describe a formal sacred rite.
- id: motif:4
  label: Low-status or disguised hero rescues princess and is recognized by a bodily
    mark
  taxonomy_refs: []
  basis: The dirty herd rescues the king's daughter from the Draygan, is marked on
    the forehead, and is later identified when forced to remove his headgear.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not explicitly call the herd disguised, though his low-status
    appearance and later transformation are emphasized.
- id: motif:5
  label: Abducted spouse taken by sea-being
  taxonomy_refs:
  - stolen_beloved
  basis: The sea-maiden takes the husband at the shore and later takes the wife after
    he escapes.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The taxonomy reference is a broad fit for spouse abduction.
- id: motif:6
  label: Music compels a supernatural captor to reveal or release the swallowed person
  taxonomy_refs: []
  basis: The wife plays the harp, stops to demand her man, and the sea-maiden brings
    him up in stages from her mouth until he can escape.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage states sea-maidens are especially fond of music, but does
    not give a named motif type.
- id: motif:7
  label: Falcon shapeshift escape
  taxonomy_refs:
  - shapeshifter
  basis: The man thinks of the falcon, becomes one, and flies ashore from the sea-maiden's
