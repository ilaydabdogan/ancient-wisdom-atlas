canonical_text:
  quote: ''
  summary: A fisher's son, also called the herd, defeats the old Carlin and obtains
    magical grooming objects. He later rescues the king's daughter from a sea Draygan
    over three battles, is recognized by a mark, and marries her. A sea-maiden then
    swallows him; his wife uses harp music to recover him, but the sea-maiden takes
    her. A soothsayer reveals that the sea-maiden's soul is hidden in an egg within
    nested animals. With animal helpers and an otter coerced by the capture of her
    cubs, the hero recovers the egg, breaks it, kills the sea-maiden, rescues his
    wife, and rewards his family.
  language: English
  quote_policy: summarized
