canonical_text:
  quote: ''
  summary: The passage closes one episode in which Maol a chliobain is drowned at
    a bridge, then summarizes a fourth version in which the youngest sister Maol a
    Mhoibean chooses a little cake and a blessing, is restrained by her sisters, defeats
    the water-disturbing Bloinigain, crosses a two-hair bridge over a cataract while
    carrying her sisters, and later takes service with a king before being sent for
    the giant's gold and silver. The collector comments on possible parallels between
    the two-hair bridge, rainbows, Norse Bif-raust, and a hair-fine Moslem bridge
    to Paradise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman says she would follow Maol a chliobain over the bridge; when he stands
    on the bridge she extends a stick to him, lets it go, and he drowns in the river.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A follow-up exchange says the woman did not marry the farmer's youngest son,
    and the teller recalls something about a key hidden under a stone but not the
    rest.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies a fourth version collected by John Dewar from John
    Crawford of Lochlonghead, Arrochar, received on 2 February 1860.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the fourth version the heroine is the youngest sister, called Maol a Mhoibean;
    she chooses the little cake and the blessing, is tied to a tree and a cairn of
    stones by the others, drags them away, and follows.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A small creature named Bloinigain dirties burns when the elder sisters try
    to drink, waits while Maol a Mhoibean drinks, and is later held back and thrown
    heels over head into a pool by her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The collector notes that Bloinigain appears prominently in another story and
    suggests a possible meaning connected with fat or suet.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The giant's three red-haired polled daughters have gold paidireanan about
    their necks, while others have only strings.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The fleeing sisters reach a cataract that can only be crossed by walking on
    two hairs called the two-hair bridge; Maol a Mhoibean runs over it, returns, and
    carries her sisters across one by one.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The giant cannot cross the two-hair bridge, and he and Maol a Mhoibean exchange
    shouted words across the river before the sisters continue on.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The collector proposes that the two-hair bridge may be a double rainbow and
    compares it with the old idea of a rainbow bridge of spirits, Norse Bif-raust,
    and a hair-fine Moslem bridge to Paradise.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: The three sisters take service with the king; the youngest says she is good
    at running errands, and after a day and a year she is sent for the giant's cabhran
    of gold and cabhran of silver while the giant sleeps on the chest containing the
    treasure.
  category: sequence
  evidence_refs:
  - ev:9
