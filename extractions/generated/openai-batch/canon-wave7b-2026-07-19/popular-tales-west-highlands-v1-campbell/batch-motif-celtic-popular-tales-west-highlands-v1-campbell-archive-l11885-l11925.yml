  summary: 'The passage first gives editorial remarks about death, funerary expenditure,
    and possible passage-payment beliefs. It then begins the tale of the King of Lochlin''s
    three daughters: three giants abduct the daughters and take them into the earth
    below; a sheanachy says they can only be recovered by a ship that sails on sea
    and land; the king offers his eldest daughter in marriage to whoever builds it;
    a widow''s eldest son prepares to try, choosing a large bannock despite his mother''s
    warning about blessing and curse.'
