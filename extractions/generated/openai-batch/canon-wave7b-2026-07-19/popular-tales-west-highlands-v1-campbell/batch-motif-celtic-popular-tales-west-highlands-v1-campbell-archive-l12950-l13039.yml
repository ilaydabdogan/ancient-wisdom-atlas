canonical_text:
  quote: ''
  summary: The excerpt contains three animal fables or tale openings. In the first,
    a fox wants to eat a wren father and his eighteen sons, identifies the father
    by provoking a response about ancestral threshing skill, and then eats the whole
    family. In the second, a fox catches a cock by making him shut one eye and crow,
    but the cock escapes when he persuades the fox to open his mouth and repeat an
    ownership phrase. In the third, a wolf and a fox steal crowdie; the wolf takes
    most of it, and the fox begins a retaliatory deception by pointing to moonshine
    on ice as if it were cheese.
  language: English
