canonical_text:
  quote: ''
  summary: A man uses summoned animal helpers to recover a trout and an egg connected
    to a beast's life. He forces the beast to restore his wife, breaks or presses
    the egg, and the beast dies. Later, despite his wife's warning, he visits a dangerous
    little castle by a loch, where a flattering crone strikes him down with a magical
    implement. His brothers infer his death from withering trees and set out in succession;
    the middle brother repeats his fate, and the youngest begins to follow.
  language: English
  quote_policy: summarized
