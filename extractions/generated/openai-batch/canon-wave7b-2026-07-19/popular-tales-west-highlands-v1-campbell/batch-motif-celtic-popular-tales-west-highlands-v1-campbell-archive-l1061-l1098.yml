  quote: ''
  summary: The passage describes Gaelic oral recitation practices and several fragmentary
    heroic poems or tales. Smith reports that such poems were chanted commonly in
    his youth, and a clergyman gives a similar account of the recitation of the death
    of Cuchullin. Donald Macintyre recites a fragment about a lady questioning a messenger
    who returns from battle with heads on a withy. John Campbell, called Yellow John,
    recites another imperfectly remembered fragment involving combat with a Norway
    witch in Ireland, with names such as Fionn and Diarmaid and a description of Diarmaid's
    arms.
  language: English
