canonical_text:
  quote: ''
  summary: Maol a Chliobain is promised the farmer's youngest son if she brings back
    a giant's buck. She is caught by the giant, survives a planned punishment by pretending
    to be dead, and escapes by putting the giant's mother and other things into the
    hanging pock in her place. She takes the buck and flees. At a river the giant
    cannot cross, she answers his accusations about earlier killings and thefts, then
    tricks him into drinking the river until he bursts. Maol a Chliobain marries the
    farmer's youngest son.
  language: English
  quote_policy: summarized
