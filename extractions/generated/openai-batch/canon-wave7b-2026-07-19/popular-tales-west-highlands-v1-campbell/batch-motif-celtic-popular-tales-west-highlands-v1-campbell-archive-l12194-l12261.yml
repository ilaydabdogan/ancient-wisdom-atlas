  summary: Editorial and comparative notes for “The King of Lochlin’s Three Daughters.”
    The passage gives provenance for the tale, then lists affinities with Gaelic,
    Norse, Grimm/German, Italian, and broadly “Eastern” tale materials. It mentions
    gifted men, an underground episode, three giants with metal crowns, underground
    treasures, an Enchanted Ship that travels on sea or land, an Eagle described as
    a genius in another shape, the smith’s servant marrying the eldest princess with
    the golden crown, two younger daughters remaining unmarried, and the moral that
    the least becomes greatest.
