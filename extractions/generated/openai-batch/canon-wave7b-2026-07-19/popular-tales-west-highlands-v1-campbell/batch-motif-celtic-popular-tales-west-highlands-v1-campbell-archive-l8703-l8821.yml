canonical_text:
  quote: ''
  summary: Conall recounts being carried by a boat to an island in a loch, finding
    a trapped woman with an infant whom a giant expects to be cooked, substituting
    a corpse for the child, hiding among corpses, being discovered and put in a caldron,
    escaping with the woman's help, killing the one-eyed giant with the giant's own
    spear, and ferrying the woman and child back to dry land. The king's mother later
    identifies herself as the rescued woman and the king as the saved child, after
    which Conall receives a brown horse and treasure and returns home.
  language: English
  quote_policy: summarized
