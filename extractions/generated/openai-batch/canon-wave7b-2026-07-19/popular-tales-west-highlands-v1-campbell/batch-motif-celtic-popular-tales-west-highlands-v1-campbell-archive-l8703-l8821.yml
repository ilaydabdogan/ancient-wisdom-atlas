  text: Conall sees a chamber full of stripped corpses.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Conall ties strings to the child's foot and to a lump of corpse-flesh, puts
    the lump in the child's mouth, places the child in a basket of down, and asks
    the woman to cook the corpse instead of the child.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
