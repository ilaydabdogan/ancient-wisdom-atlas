- id: obs:5
  text: In a glen at the bottom of a chasm, Conall sees a woman holding a naked child
    on her knee and a knife in her hand.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman repeatedly tries to put the knife to the child's throat; the child
    laughs, the woman cries, and she throws the knife behind her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman says the child must be cooked for the giant or she will not see
    more of her world.
  category: speech
  evidence_refs:
