  text: Conall says his father got him a wife, he married, and then went hunting beside
    the sea.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Conall sees an island in the middle of a loch and a boat with ropes before
    and behind it and precious things inside.
  category: setting
  evidence_refs:
