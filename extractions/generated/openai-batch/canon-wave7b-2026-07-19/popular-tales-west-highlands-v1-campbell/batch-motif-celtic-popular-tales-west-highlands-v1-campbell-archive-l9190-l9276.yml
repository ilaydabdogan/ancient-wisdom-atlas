canonical_text:
  quote: ''
  summary: Conal Crovi recounts how he saved a woman and her babe from three giants
    by substituting a hanged body for the child and taking the corpse's place on the
    gallows. After suffering when a giant cuts flesh from him, he later escapes, receives
    a flaming sword from the woman, beheads the sleeping giants, exits their cave
    through a rocky passage, loads their ship with treasure, and eventually returns
    to Sasunn. A woman in the chamber identifies herself as the rescued woman and
    tells the king that he was the rescued babe, after which Conal is rewarded with
    the giant's treasure.
  language: English
  quote_policy: summarized
