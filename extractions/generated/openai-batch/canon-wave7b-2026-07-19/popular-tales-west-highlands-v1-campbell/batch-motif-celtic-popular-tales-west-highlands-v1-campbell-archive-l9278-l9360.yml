canonical_text:
  quote: ''
  summary: A collection frame identifies the tale's telling and note-taking. The tale
    begins with Connal, son of King Cruachan of Eirinn, threatened by his stepmother
    and living with his foster mother. Connal sees treasure placed in a dead bishop's
    grave, descends to take it, is trapped by his fleeing foster brothers, and later
    escapes with treasure and abandoned arms and clothing. A giant then lures men
    into a treasure hole or cave under a rock by promising gold and leaves them there
    to die. Connal is likewise abandoned in the cave among dead men and gold. The
    giant sends his own son down with a sword of light; Connal seizes the sword and
    beheads the young giant.
  language: English
  quote_policy: summarized
