- id: obs:2
  text: King Cruachan of Eirinn has a son named Connal MacRigh Cruachan; Connal's
    mother dies, and his father marries another woman who wants Connal removed so
    the kingdom will belong to her own descendants.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Connal lives in his foster mother's house and is fond of his eldest brother,
    which vexes the stepmother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bishop dies and asks that gold and silver be placed in his grave; Connal
    sees a bag of gold placed at the bishop's head and a bag of silver at his feet.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Connal proposes that his five foster brothers search for the bishop's gold;
    they hold up the flagstone while he goes down into the grave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After hearing squealing, the five foster brothers let the flagstone fall and
    flee, leaving Connal in the grave on top of the bishop.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After seven mornings, young lads open the bishop's grave, flee when Connal
    stirs, and leave arms and clothing behind; Connal rises and brings gold, arms,
    and clothing to his foster mother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A great giant near the place has gold and silver at the foot of a rock and
    promises a bag of gold to anyone who will descend in a creel.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The giant's practice is to lower people, have them fill the creel, and then
    not lower the creel again until they die in the hole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Connal goes down by rope, fills the giant's creel with gold, and is left by
    the giant in the cave among dead men and gold.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the giant cannot get another man to descend, he sends his own son into
    the hole with a sword of light so that he can see; Connal takes the sword and
    beheads the young giant.
  category: sequence
  evidence_refs:
  - ev:7
