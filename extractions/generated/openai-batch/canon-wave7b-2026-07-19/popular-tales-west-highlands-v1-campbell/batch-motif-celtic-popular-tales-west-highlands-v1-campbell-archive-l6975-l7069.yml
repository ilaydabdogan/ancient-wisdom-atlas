  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The giant's eldest daughter appears, the hero recognizes her, they play cards
    all night, and she gives him a tether for catching a little dun shaggy filly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hero is tasked with killing the great bull; the daughter gives him her
    father's bow and arrow, and the big black arrow is put into the bull's forehead
    at the house.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The hero is tasked with cleansing a seven-stall byre that has not been cleansed
    for seven years; the daughter gives him a barrow, a crook, and words to say, and
    the tools work by themselves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Three daughters put needles, pins, and little fingers through openings, and
    the hero chooses the correct items or finger by distinguishing marks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The giant says the hero has won her but will not go to Erin; the pair get
    out a barge while one daughter explains the sounds as heaven-fire and thunder.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The giant throws his black clue, making the boat sail stern foremost; the
    daughter shoots an arrow into the giant's black sole, and he lies down.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After reaching Erin, the hero goes home first; the woman stays in the barge
