canonical_text:
  quote: ''
  summary: Campbell introduces another version, titled The Daughter of Black-white
    Red. Three sons of the king of Erin see remarkable birds; the eldest vows to obtain
    the great beautiful bird and is sent through the kings of France, Spain, and Italy.
    With an old man and a green boat he reaches Black-white Red, a giant who threatens
    him and sets tasks. The giant's eldest daughter helps him with a tether, bow and
    arrow, self-working tools, recognition tests, and escape by barge. She wounds
    the pursuing giant in the sole. In Erin, the hero goes home first while she waits,
    then stays with a smith, obtains food and wine from palace servants, makes a golden
    cock and silver hen, and is invited to the dancing room during a wedding scene.
  language: English with Gaelic terms
  quote_policy: summarized
