canonical_text:
  quote: ''
  summary: 'Voorachai seeks a sequence of aids or objects so that a rod can be obtained
    and used on Meenachaig, who is said to be eating his share of fruit. Each requested
    figure or object refuses unless another is first obtained: water requires a deer,
    the deer requires a dog, the dog requires butter, the butter requires a mouse,
    and the mouse requires a cat. The passage ends when Voorachai reaches the cat.'
  language: English
