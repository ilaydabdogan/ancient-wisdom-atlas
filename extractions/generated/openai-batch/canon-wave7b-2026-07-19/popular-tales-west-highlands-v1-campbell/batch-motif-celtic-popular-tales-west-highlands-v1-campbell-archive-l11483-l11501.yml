  quote: ''
  summary: In this passage, a shoe cannot be made to fit anyone sought for the king's
    son. His mother asks in the kitchen to see the shoe. A low-status woman is mocked,
    but when the shoe is set down it jumps onto her foot. She asks what will be given
    to see the other shoe, goes to the herd's house, puts on the shoes and a gold-and-silver
    dress, returns, and marries the king's son after a minister is summoned.
