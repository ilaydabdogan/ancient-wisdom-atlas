canonical_text:
  quote: ''
  summary: A traveler or herd shares a sheep carcass among a dog, an otter, and a
    falcon, who each promise aid. He takes service with a king as a cattle herd, with
    wages tied to milk yield. After finding better grazing in a green glen, he is
    threatened by a giant claiming the cattle and pasture; with the aid of the black
    dog, he kills the giant. He enters the giant's wealthy house but takes nothing.
    The cattle then give milk and the king is pleased. Later, as grazing worsens,
    he moves the cattle farther onto giant land, where a second giant attacks and
    the herd calls on the dog; the excerpt ends mid-action.
  language: English
  quote_policy: summarized
