canonical_text:
  quote: "“Where art thou ring ?” And the ring said, “I am here.”"
  summary: Conall recounts being trapped in a manure-filled place by a one-eyed giant
    with goats. He pretends to heal the giant’s blind eye, blinds the other eye, escapes
    under a flayed buck skin, is betrayed by a speaking ring, cuts off his finger
    to cast the ring into the water, and the pursuing giant drowns. Conall then takes
    the giant’s gold and silver, returns home, and shows his missing finger as proof
    before the king.
  language: English
  quote_policy: quoted
