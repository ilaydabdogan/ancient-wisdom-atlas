canonical_text:
  quote: ''
  summary: 'The passage begins with brief Gaelic closing lines from a preceding tale,
    followed by editorial comments on versions of that tale and its Irish connections.
    A new tale then begins: a widow has one son, gives him schooling, and urges him
    to choose a trade. He refuses ordinary arts and declares he will be a thief. His
    mother repeatedly prophesies that this choice will end with him hanged at the
    Bridge of Baile Cliath in Ireland. When she goes to church and asks him to come
    and abandon his bad ways, he refuses, but says he will pursue the first art she
    hears named after the sermon.'
