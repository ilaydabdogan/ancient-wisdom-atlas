canonical_text:
  quote: ''
  summary: 'Conall Cra-Bhui recounts a youthful ordeal: while sheltering in a herd''s
    bothy with a newly calved cow, calf, and boy companion during snow, a talking
    and singing company of cats led by a one-eyed fox-coloured head bard demands rewards
    for songs. Conall successively offers the calf, the cow, and then the boy; the
    cats attack or pursue each. Conall escapes through a turf window into a wood and
    hides in a tree. The one-eyed leader finds him, a climbing cat is killed by Conall,
    and the cats cut the tree roots to bring him down. Conall cries out repeatedly;
    a priest and ten delving men arrive and fight the cats with spades until the men
    and cats are all killed. In the frame, the king says Conall''s tale has freed
    one son and invites another harder tale in exchange for another son; Conall begins
    a new account set by the sea among rocks, caves, and geos.'
  language: English
  quote_policy: summarized
