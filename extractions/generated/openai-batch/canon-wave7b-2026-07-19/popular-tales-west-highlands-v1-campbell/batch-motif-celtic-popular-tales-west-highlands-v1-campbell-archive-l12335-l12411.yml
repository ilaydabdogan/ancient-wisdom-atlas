canonical_text:
  quote: ''
  summary: In this passage, a bald rough-skinned gillie kills the giant's daughters,
    while Maol a Chliobain wakes and carries off her sisters, taking a golden cloth
    that calls out. The giant pursues her, but she crosses a river, aided by a hair
    made into a bridge, and the giant cannot follow. At a farmer's house, Maol agrees
    to obtain the giant's gold and silver combs in exchange for her eldest sister's
    marriage to the farmer's eldest son. She steals the combs and escapes across the
    river again. She then agrees to obtain the giant's glave of light for the farmer's
    middle son and her middle sister; she hides in a tree above the giant's well,
    drowns the gillie when he comes with the sword of light, takes the weapon, and
    again escapes to the river while the giant recites her deeds.
  language: English
  quote_policy: summarized
