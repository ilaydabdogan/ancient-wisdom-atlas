canonical_text:
  quote: ''
  summary: Soldiers are quartered through the country to identify households with
    pig flesh. At the wright's widow's house, soldiers eat pig flesh and sleep in
    the barn. The Shifty Lad kills them, spreads a rumor that the soldiers intend
    to murder householders in their beds, and causes people in other houses to kill
    the sleeping soldiers quartered with them. The king consults the Seanagal, who
    advises a feast and dance to expose the culprit because he will boldly ask the
    king's daughter to dance. At the dance, the Shifty Lad does so. The Seanagal marks
    him with a black dot from a vial; the Shifty Lad sees the mark in a glass, steals
    the vial, marks the Seanagal and twenty other men, and returns it. The passage
    ends as the Shifty Lad again asks the king's daughter to dance and she also has
    a vial.
  language: English
  quote_policy: summarized
