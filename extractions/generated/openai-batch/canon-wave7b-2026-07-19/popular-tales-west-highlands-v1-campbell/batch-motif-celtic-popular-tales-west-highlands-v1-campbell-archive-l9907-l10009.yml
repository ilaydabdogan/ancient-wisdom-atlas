canonical_text:
  quote: ''
  summary: An ailing king in Erin has three sons. The two elder sons set out to seek
    three bottles of water from the green Isle, and the underestimated youngest son,
    John, follows. In a night wood John meets a speaking brown bear, who feeds and
    shelters him, then carries him to giants' houses. A first giant threatens John
    but gives him hospitality when John says the brown bear sent him. The bear later
    warns John about wrestling a third giant; during the struggle John invokes the
    bear, who appears at his side. The excerpt ends before the encounter is resolved.
  language: English
  quote_policy: summarized
