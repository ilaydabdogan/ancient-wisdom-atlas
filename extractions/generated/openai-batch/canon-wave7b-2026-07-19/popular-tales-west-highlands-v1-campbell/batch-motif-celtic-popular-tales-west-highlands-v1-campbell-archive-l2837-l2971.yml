canonical_text:
  quote: ''
  summary: The introduction discusses smith figures and devil-conflict tales across
    Norse, Irish, Gaelic, and Grimm collections, then turns to magical combs in Gaelic
    and other European popular tales. It describes combs as coveted treasures of giants,
    enchanted princes, water-spirits, queens, and gifted children, and offers an explanatory
    theory linking the comb’s magical value to its rarity as a crafted object and
    to sparks produced when hair is combed.
  language: English
  quote_policy: summarized
