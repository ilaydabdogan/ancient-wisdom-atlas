canonical_text:
  quote: ''
  summary: John follows a crying group and learns they are under charms that could
    have been broken by three lads spending three nights without questions, or later
    by uprooting a tree. He returns to Dublin with his companions, then repeatedly
    visits the king's daughter. She obtains a whistle and a purse from him. He next
    uses a food-producing towel to carry both himself and the king's daughter to a
    remote island, but she escapes back to her father's house with the towel while
    he sleeps. John survives on island fruits and finds apples that alternately give
    him and remove from him a deer's head.
  language: English
  quote_policy: summarized
