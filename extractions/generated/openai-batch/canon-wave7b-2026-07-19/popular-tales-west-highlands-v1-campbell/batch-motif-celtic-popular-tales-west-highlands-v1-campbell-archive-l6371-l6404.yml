canonical_text:
  quote: ''
  summary: A shoemaker takes a woman, identified as the shadow that had driven his
    people mad and also as the giant's daughter, into his poor house. Three gentlemen
    lads seeking shoes see her beauty and offer money to marry her. She agrees to
    marry one if he brings his purse; the youth pays the shoemaker one hundred pounds
    as tocher. At night she asks him to bring water from a tumbler across the chamber,
    and he remains unable to leave while holding the vessel until morning, when she
    asks the shoemaker to take him away.
