  quote: ''
  summary: Campbell argues that West Highland prose tales show little trace of well-known
    English books, fashionable novels, or modern literary conventions. He says that
    if any book stories entered local tradition, they were popular tales from peasants
    in other countries and were adapted to local manners. He also notes similar stories
    in books beyond ordinary popular access and describes the Isle of Man as still
    Celtic despite Norse and other historical influences.
  language: English
