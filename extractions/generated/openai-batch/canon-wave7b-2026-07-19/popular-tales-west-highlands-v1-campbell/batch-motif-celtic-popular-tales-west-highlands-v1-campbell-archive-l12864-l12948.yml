canonical_text:
  quote: ''
  summary: 'The passage gives three fox fables or anecdotes: a fox tries to lure a
    cock and hen from a tree by claiming universal peace, but flees when hounds are
    mentioned; a fox trapped in a hunter''s hut burns the hunter''s possessions and
    bedding until the man moves from the exit, allowing escape; and a reported fox
    uses a bunch of heather while swimming in a loch to approach and kill wild ducks.
    Editorial notes compare the first fable to Aesop and general fable diffusion,
    and the second to Reineke Fuchs in Erse.'
  language: English
  quote_policy: summarized
