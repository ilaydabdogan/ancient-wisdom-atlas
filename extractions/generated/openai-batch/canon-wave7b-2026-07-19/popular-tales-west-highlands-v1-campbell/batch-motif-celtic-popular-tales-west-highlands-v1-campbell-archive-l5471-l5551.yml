canonical_text:
  quote: ''
  summary: The king kills the Gruagach by striking a mole with a sword, returns home
    to find his keepers bound and his wife and two horses taken by a giant, and follows
    the horses' track. On successive nights he stops at fire-sites in a green wood
    and at a grey rock, where a dog and then a hawk/falcon feed him, guard his sleep,
    and encourage his pursuit.
  language: English
