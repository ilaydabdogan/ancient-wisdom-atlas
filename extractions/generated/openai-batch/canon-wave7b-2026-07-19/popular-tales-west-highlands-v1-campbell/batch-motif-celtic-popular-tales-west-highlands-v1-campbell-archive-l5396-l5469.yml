canonical_text:
  quote: ''
  summary: 'A speaking filly advises the protagonist to take the sword of light from
    the king of the oak windows. The theft triggers pursuit by horses, including a
    white-faced black horse ridden by the king. The protagonist uses the sword to
    behead the rider, then rides the black horse home. He is later instructed how
    to face the Gruagach: make him look at the sword’s knob, then stab the mole on
    the right side of his neck, because the death of the Gruagach and his brother
    is in that sword alone.'
  language: English
  quote_policy: summarized
