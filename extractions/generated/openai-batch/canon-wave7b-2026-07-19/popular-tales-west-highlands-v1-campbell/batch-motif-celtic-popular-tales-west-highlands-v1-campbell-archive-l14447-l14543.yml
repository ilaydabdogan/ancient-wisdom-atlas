canonical_text:
  quote: "“Shake water on them and they will arise.”"
  summary: The passage opens with an instruction to heal by shaking water from a tuft
    of grass. The Ceabharnach goes to the hostile Fear Chuigeamh Mugha, whose house
    is guarded by axe-men, sword-men, and a porter. Guards who try to kill him strike
    their own comrades and kill one another; he strikes the porter and reaches the
    ruler at dinner. When the ruler reaches for his sword, his hand sticks to it and
    his seat sticks to the chair; his wife also cannot leave her place. The Ceabharnach
    then tells a poor travelling man to free them by shaking water on them. He later
    comes to Rob Mac Sheoic Mhic Lagain, who has had foot pain for seven years and
    whose town has spikes bearing the heads of failed leeches. The Ceabharnach, admitted
    as a leech, tells Rob to rise and test himself against twelve leeches; Rob becomes
    able to evade capture and catch others. Rob offers his only daughter and half
    his realm, and a wedding is ordered.
  language: English
  quote_policy: quoted
