canonical_text:
  quote: '"the soul of the beast is in the egg, and if the egg breaks, the beast is
    dead."'
  summary: A herd is recognized by the king's daughter through her ring and earrings
    and marries her. A loch beast abducts him, and she recovers him by bargaining
    with valuables. The same beast later abducts the king's daughter. The old smith
    tells the husband that the beast can be killed only by reaching an island in the
    loch, catching a white-footed hind, then the hoodie and trout that spring from
    it, and breaking the egg in the trout's mouth, where the beast's soul is kept.
    The husband crosses toward the island with animal helpers and begins the pursuit.
  language: English
  quote_policy: quoted
