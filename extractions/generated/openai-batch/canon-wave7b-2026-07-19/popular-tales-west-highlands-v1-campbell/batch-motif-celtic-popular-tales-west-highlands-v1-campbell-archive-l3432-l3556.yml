comparison_claims:
- id: claim:1
  claim: The passage supports a cautious comparison of pig and swine figures across
    Gaelic heroic lore, English nursery lore, and broader British popular lore as
    recurring important animal personages.
  claim_level: same_motif
  target: pig/swine as recurring animal figure in Gaelic and British popular lore
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The examples share animal prominence but differ greatly in genre and
    plot; the passage does not prove that they derive from one narrative source.
- id: claim:2
  claim: The passage cautiously connects Scottish Gaelic swine-and-oak traditions
