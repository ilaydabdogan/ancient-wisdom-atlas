canonical_text:
  quote: ''
  summary: 'The passage surveys several Gaelic and British traditional materials:
    a prince revived by dogs and followed by burning with grey oak; boars and pigs
    in Gaelic heroic lore, English nursery lore, and accounts of Gaulish/Druidic sacred
    groves; an oak-tree story in which a confined old man aids a prince; and a Gruagach/brownie
    on Inch who receives warm milk in a cave and guards cattle if the offering is
    maintained.'
  language: English
  quote_policy: summarized
