candidate_motifs:
- id: motif:1
  label: dead person revived by animal helpers after removal of a fatal object
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The prince is dead for three days and buried, but dogs dig him up, remove
    a thorn, and he comes alive again.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The excerpt begins after prior narrative context, so the cause of the
    thorn and the sister's role are not fully given here.
- id: motif:2
  label: punitive burning with grey oak fire
  taxonomy_refs: []
  basis: The revived prince burns his sister on a grey oak fire, and the narrator
    later says grey or green oak is fetched when a man is to be burned for an evil
    deed.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: medium
  cautions: The passage gives this as a repeated traditional detail, but does not
    fully explain its ritual or legal meaning.
- id: motif:3
  label: boar as dangerous heroic quarry and death-agent
  taxonomy_refs: []
  basis: The boar causes Diarmid's death, appears in other tales, and is repeatedly
    connected with the Feen as a hunted, torn, or eaten animal.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage summarizes several traditions rather than narrating one complete
    boar tale.
- id: motif:4
  label: wise youngest animal defeats a house-attacking predator
  taxonomy_refs:
  - wisdom
  basis: The youngest pig survives where older pigs fail and kills the fox by tricking
    him into looking into the cauldron.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The account is a compressed family-story summary, not a full tale text.
- id: motif:5
  label: sacred or tabooed swine associated with oak groves
  taxonomy_refs: []
  basis: The passage states that pigs were sacred among the Gauls, fed in Druidic
    oak groves, and that Highlanders retain a prejudice against eating pig flesh.
