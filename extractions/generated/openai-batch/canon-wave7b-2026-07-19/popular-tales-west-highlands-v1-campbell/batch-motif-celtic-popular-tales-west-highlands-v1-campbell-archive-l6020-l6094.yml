canonical_text:
  quote: ''
  summary: A king's son releases a bundle that unfolds into a castle with an orchard
    and garden. A giant offers to restore it to the bundle in exchange for the king's
    son's first son at age seven. The king's son later opens the bundle in his chosen
    place, finds a maiden in the castle, and marries her. After seven years the giant
    returns to claim the promised child. The queen tries to substitute the cook's
    son and then the butler's son, but the giant exposes each substitute by a rod
    test and kills them, then returns demanding the true son.
  language: English
  quote_policy: summarized
