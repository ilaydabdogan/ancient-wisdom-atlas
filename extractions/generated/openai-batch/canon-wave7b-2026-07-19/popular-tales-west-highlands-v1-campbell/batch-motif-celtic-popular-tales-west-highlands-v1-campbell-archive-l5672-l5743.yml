canonical_text:
  quote: the big giant had taken away his sweetheart
  summary: The passage introduces a Gairloch version of the tale, then abstracts a
    sequence in which a widow's son wins a blue filly in a card game, the filly becomes
    a woman, a giant abducts the sweetheart, and the widow's son sets out. On the
    journey he lodges at huts where a falcon, an otter, and a dog each enter with
    prey, become men, host him, and give him names to call on. He then sees a white
    house in a desert glen and his sweetheart combing her hair with a golden comb.
  language: English with Gaelic phrases
  quote_policy: quoted
