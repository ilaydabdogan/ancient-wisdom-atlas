  summary: 'The passage explains a difficulty in collecting tales: some Highland peasants
    and fishermen, especially near the Lowlands, are sensitive to ridicule, may partly
    believe the stories they tell, and fear that educated people will laugh at their
    beliefs, stories, language, and knowledge of Sgeultachd. It also notes mutual
    unfamiliarity between locals and tourists moving through Highland landscapes,
    ending with an unfinished animal comparison involving herrings and deer.'
