canonical_text:
  quote: ''
  summary: The passage describes Fionn, Diarmaid, and other Ossianic or Fenian figures
    as usually represented as Irish worthies, while many of their exploits are attached
    to places in Scotland and the Isle of Man. It gives examples involving cairns
    linked with a boar that wounded Diarmaid, a strait named for a leaping giant warrior,
    and a Manx report of an enchanted island near Port Soderick that periodically
    rises from the sea. The island is said to have been submerged by enchantment since
    the days of Fin MacCoul, its inhabitants transformed into granite, and its spell
    breakable by placing a Bible on the land during its brief emergence; no one attempts
    this for fear of the enchanter's revenge against Mona.
  language: English
  quote_policy: summarized
