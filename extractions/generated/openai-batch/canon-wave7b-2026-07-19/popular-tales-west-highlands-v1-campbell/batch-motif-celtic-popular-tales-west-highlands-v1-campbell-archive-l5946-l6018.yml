canonical_text:
  quote: ''
  summary: A king's son goes to observe a battle of creatures and birds. He intervenes
    in the final fight by killing a snake that is overcoming a black raven. The raven
    rewards him with flight over repeated sevenfold landscapes and directs him to
    the dwellings of its sister or sisters, where he receives hospitality. On the
    third morning the raven appears as a handsome lad, says he had been under spells
    and was released by meeting the king's son, gives him a bundle, and tells him
    to return by the same route without losing it until he reaches the place where
    he most wishes to dwell. Near his father's house, in a close wood, the bundle
    becomes heavy and he opens it; the passage breaks off immediately after this action
    begins.
  language: English
  quote_policy: summarized
