canonical_text:
  quote: ''
  summary: John carries two kinds of apples in a pock. Sailors secretly eat the apples
    that give them deer horns; John restores them with the other apples after the
    captain promises him the vessel and cargo. In Dublin, John gives a similar apple
    to the king's daughter, causing a deer's head and horns to appear on her. The
    king offers wealth and marriage to whoever heals her. John, dressed in torn clothes,
    gains admission, pretends to consult an empty book, makes the princess return
    a whistle taken from a poor soldier, and partly cures her with another apple.
    He then meets old comrades who do not recognize him and returns the next day,
    where the passage breaks off as he begins asking about a purse.
  language: English
  quote_policy: summarized
