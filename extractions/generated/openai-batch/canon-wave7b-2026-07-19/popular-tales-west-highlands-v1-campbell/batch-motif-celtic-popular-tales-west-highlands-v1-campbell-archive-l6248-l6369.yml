canonical_text:
  quote: ''
  summary: 'A giant discovers that his daughter and her companion have escaped and
    pursues them. The daughter directs the king''s son to take objects from the gray
    filly''s ear and throw them behind: a sloe twig becomes a blackthorn wood, a gray
    stone splinter becomes a great rock, and a bladder of water becomes a loch in
    which the giant drowns. Near the king''s son''s home, the daughter warns him that
    any kiss from man or creature will make him forget her; an old greyhound kisses
    him and he forgets. The daughter waits by a well, climbs into an oak tree, and
    is later seen indirectly through her reflection or shadow in the well by a shoemaker''s
    household.'
  language: English
  quote_policy: summarized
