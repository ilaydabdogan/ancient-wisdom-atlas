canonical_text:
  quote: ''
  summary: The passage gives the end of an animal fable in which a big fox tries to
    read writing on a horse's golden shoe and is killed, while a little fox avoids
    reading and is said to get the herrings. It then records a bee asking a mouse
    to make a house, a hill mouse envying a farm mouse, and a farm mouse replying
    that peace is better. The collector next introduces a Highland moral tale, "The
    Provost of London," with notes on oral sources, variants, and a synopsis involving
    a poor Highland lad, a great lady, military advancement, marriage, war, death,
    a son, a dream, and a three-year journey.
  language: English with embedded Scottish Gaelic phrases
  quote_policy: summarized
