  summary: 'The passage first gives Campbell''s commentary on The Tale of the Hoodie,
    suggesting possible mythological readings of the hoodie, a magical coach, and
    a comb associated with spells and antiquarian finds. It then begins The Sea-Maiden:
    a poor old fisher is offered plenty of fish by a sea-maiden in return for his
    first son. She gives grains that cause the fisher''s wife, dog, and mare to produce
    offspring and trees to grow as signs of the sons'' lives. At the appointed times,
    the fisher does not bring his son, and the sea-maiden grants extensions of four
    and then seven years.'
