canonical_text:
  quote: ''
  summary: As a seven-year term connected with the old man's son and the sea-maiden
    nears its end, the old man becomes troubled. His eldest son asks what is wrong,
    learns of the matter with the sea-maiden, and says he will not oppose his father.
    The father resists letting him go. The son asks for a strong sword, tests several
    swords until one proves suitable, and then prepares to travel with a black horse;
    a black dog is mentioned at the passage end.
