canonical_text:
  quote: ''
  summary: An unnamed man remains under the earth with a giant after sending three
    men and the king's daughters up through a hole. The three great men report to
    the king that they performed the daring deeds. After repeated periods of service,
    the giant sends the man upward on an eagle; when the eagle's food runs out, the
    man feeds it flesh from his own thigh and reaches the surface. The eagle gives
    him a whistle for summoning help. In the king's town, the man works as a smith's
    bellows lad and uses the whistle to have the eagle fetch a golden crown from above
    a giant's door.
  language: English
  quote_policy: summarized
