canonical_text:
  quote: ''
  summary: 'An unnamed woman travels by night while trying to catch her man, who is
    said to be marrying the daughter of the King of the Skies. Three spinning housewives
    give her hospitality and magical textile implements: self-cutting shears, a self-sewing
    needle, and thread that threads itself. She reaches a town where the king''s daughter
    has a wedding, uses the tools while working in the hen wife''s house, and exchanges
    the shears for permission to lie where the king''s daughter lay the previous night.'
  language: English
  quote_policy: summarized
