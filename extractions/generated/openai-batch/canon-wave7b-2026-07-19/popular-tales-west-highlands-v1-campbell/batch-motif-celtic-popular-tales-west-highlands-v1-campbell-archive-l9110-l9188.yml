canonical_text:
  quote: ''
  summary: 'A first-person speaker, later named in the frame as Conal Crovi, recounts
    being in a giant''s cave, hiding among gold and silver, being discovered by the
    giant, and killing the giant with a heated spit and sword. He then tries to use
    a creel to lift out the giant''s gold and silver, but the tie breaks and he falls.
    In the frame narrative, the King of Eirinn grants Conal''s demanded payment: a
    marriage between royal children and a black white-faced stallion as tocher. Conal
    is bound and put in the peat corner while a long wedding is held. The king then
    has him brought up again to tell how he escaped the giant''s cave, and Conal begins
    a further account of wandering below and seeing a house with a woman and child.'
  language: English
  quote_policy: summarized
