canonical_text:
  quote: ''
  summary: The Shifty Lad tricks the Black Rogue into being hoisted by a cord at a
    gallows until he dies, takes money from his pouch, is accused by the Black Rogue's
    wife, hides in a cave during pursuit, flees to Eirinn, enters a wright's household,
    and steals butter and cheese from the king's store-house after urging the wright
    and wife toward the theft.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Black Rogue says he will try the act, and the Shifty Lad tells him to
    whistle when he is tired above so he can be let down.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Black Rogue puts a cord about his neck, and the Shifty Lad draws him up
    against the gallows while giving instructions about whistling and shaking his
    legs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Black Rogue shakes his legs and kicks while suspended; the Shifty Lad
    treats this as amusement and waits for a whistle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Black Rogue does not whistle; the Shifty Lad ties the cord to the lower
    end of the gallows tree until the Black Rogue is dead.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the Black Rogue dies, the Shifty Lad takes money from his pouch and
    leaves him hanging.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the Black Rogue's house, his wife asks about her man; after questioning,
    she cries that the Shifty Lad killed his master and is a thief.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Shifty Lad flees from the accusation, hides in a cave while a chase passes
    by, stays there all night, and then flees to Eirinn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Shifty Lad reaches a wright's house, asks to be let in, says he is a good
    wright, is admitted, and begins carpentering with the wright.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After staying in the wright's house, the Shifty Lad remarks on the household's
    poverty and the nearness of the king's store-house, saying they could get plenty
    if they were smart enough.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The wright and his wife fear imprisonment if they attempt the theft, and the
    wright at first refuses to go with the Shifty Lad.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Shifty Lad takes some of the wright's tools, breaks into the king's store-house,
    steals a load of the king's butter and cheese, and brings it to the wright's house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The wright's wife is pleased with the stolen goods and wants her husband to
    go to the store-house the next night; the passage ends as the wright goes with
    the Shifty Lad.
  category: sequence
  evidence_refs:
  - ev:7
