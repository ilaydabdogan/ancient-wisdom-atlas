  summary: The narrator reflects on hearing songs and old stories in Highland and
    English social settings, then states that his work concerns visits to tellers
    of old stories. He describes audiences gathering to enjoy these stories. He then
    introduces MacPhie, an old story man in South Uist, and gives a literal description
    of MacPhie's location and house, including its peat-and-boulder construction,
    single room, doors, floor fire, chimney hole, and soot-darkened rafters.
