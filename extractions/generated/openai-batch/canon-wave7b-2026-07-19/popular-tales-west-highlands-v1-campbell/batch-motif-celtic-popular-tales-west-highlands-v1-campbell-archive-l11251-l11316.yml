  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The youngest sister receives wages including a peck of gold, a peck of silver,
    supplies used or lost, and green silk bedding.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: At midnight the dead man rises and grins repeatedly while the youngest sister
