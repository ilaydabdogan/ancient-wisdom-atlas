canonical_text:
  quote: ''
  summary: A girl works in a house where she must watch an enchanted dead man by night.
    The first two sisters fail and are killed. The youngest chooses her mother's blessing,
    shares her bannock with animals, obtains the same work, compels the dead man with
    a stick, passes through a difficult wood, receives gold, silver, and a vessel
    of cordial, and restores her two sisters to life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A girl is assigned to stay awake every night watching a dead man, the housewife's
    brother, who is under spells.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the first girl falls asleep during the watch, the mistress strikes her
    with a magic club, she dies, and she is thrown behind the midden.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The middle sister goes to seek fortune after her sister, chooses the big half
    of the bannock and her mother's curse, and the same thing happens to her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The youngest sister chooses the little bit of bannock and her mother's blessing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The youngest sister shares bannock with the sreath chuileanach, twelve puppies,
