canonical_text:
  quote: "“Then the Champion went and he set a great ladder up against the moon...”"
  summary: At the southern Earl’s court, Duradan or Dust of Dust claims skill in juggling,
    outdoes the Earl’s juggler by removing and restoring an ear, and receives payment
    to repair the failed imitation. He then performs a ladder-to-the-moon feat involving
    a hound, hare, carl, and girl, cuts off and restores heads for payment, and the
    next morning departs swiftly from a hunt toward the house of Carl MacCeochd after
    hearing a loud voice.
  language: English
  quote_policy: quoted
