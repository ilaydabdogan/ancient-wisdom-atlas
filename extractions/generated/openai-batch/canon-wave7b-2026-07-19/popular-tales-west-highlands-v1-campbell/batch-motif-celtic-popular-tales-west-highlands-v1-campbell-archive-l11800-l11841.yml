canonical_text:
  quote: ''
  summary: A rich man believes a buried crone has returned. A gillie tells him that,
    because he did not spend money on her while living, he must spend it on her dead.
    After a funeral, the gillie removes the crone from the burial cell, takes her
    burial dress or linen, carries her to a stable, and ties her corpse on a year-old
    colt. The rich man rides away on a mare, the colt follows with the corpse, and
    the man again believes the crone has returned. A second funeral is arranged, and
    the poor brother becomes as wealthy as the rich one through the funerals.
  language: English
  quote_policy: summarized
