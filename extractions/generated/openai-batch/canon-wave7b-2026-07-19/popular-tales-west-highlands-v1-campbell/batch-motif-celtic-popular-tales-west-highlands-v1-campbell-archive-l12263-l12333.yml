canonical_text:
  quote: ''
  summary: A widow's three daughters leave to seek their fortune. The two elder daughters
    choose larger food portions with their mother's curse, while the youngest chooses
    the smaller portion with her mother's blessing and receives more. The elder sisters
    try to abandon the youngest by tying her to objects, but the blessing frees her.
    The sisters reach a giant's house at night and are lodged with the giant's three
    daughters. When the giant wants water and then blood, Maol a Chliobain overhears
    his plan to kill a strange girl and swaps the neck-markers of the visiting sisters
    and the giant's daughters.
  language: English
  quote_policy: summarized
