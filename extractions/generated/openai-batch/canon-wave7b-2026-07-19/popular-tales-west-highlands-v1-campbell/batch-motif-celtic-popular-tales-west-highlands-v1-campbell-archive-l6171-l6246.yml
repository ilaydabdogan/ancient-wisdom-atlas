canonical_text:
  quote: ''
  summary: After a previous task involving a feather-thatched byre, the giant orders
    the king's son to fetch five unbroken magpie eggs from a nest atop an enormous
    fir-tree beside a loch. The giant's daughter helps by making a ladder with her
    fingers in the tree, but leaves her little finger behind. She tells the king's
    son to identify her among her sisters at the marriage by the missing finger. After
    the wedding, she warns him not to sleep because her father will kill him, and
    they flee on a blue-gray filly. She places nine pieces of apple at several points
    in and outside the house; when the giant calls, the apple pieces answer in their
    place until he realizes they are escaping.
  language: English
  quote_policy: summarized
