canonical_text:
  quote: ''
  summary: 'The opening of “The Three Soldiers” tells of a sergeant, a corporal, and
    a single soldier named John who fall behind their regiment after visiting sweethearts.
    At night they find an empty place with fire, beds, and food. Three great red girls
    come at night and later give the men magical gifts: a purse of inexhaustible gold
    and silver, a towel that produces meat, and a whistle that transports the player
    to the middle of the regiment. The passage breaks off as John says he wants to
    learn who the girls are.'
  language: English
  quote_policy: summarized
