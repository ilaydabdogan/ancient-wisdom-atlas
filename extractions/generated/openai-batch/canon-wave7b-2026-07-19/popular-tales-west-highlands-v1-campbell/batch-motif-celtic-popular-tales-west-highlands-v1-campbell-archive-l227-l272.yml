  summary: The passage describes emotional oral recitation and belief in West Highland
    tales, then summarizes traditions about the Ossianic heroes. Fionn is described
    as king of the Finn rather than king of a territory. The Finn are said to have
    been raised in Ireland and the Highlands to defend both countries, with an origin
    tradition in selected marriages of the strongest young men and women. The passage
    also notes the phrase 'Cothrom na Finne' as fair-play, discusses possible etymologies
    of Fiann/Feinn, and comments on source communities and borrowing.
