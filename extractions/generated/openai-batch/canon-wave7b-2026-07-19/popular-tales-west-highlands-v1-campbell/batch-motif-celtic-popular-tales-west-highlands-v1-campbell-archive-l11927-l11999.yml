canonical_text:
  quote: ''
  summary: A young man and his brothers try to cut wood near a river where an Uruisg
    asks for food. The elder and middle brothers refuse and fail because each felled
    tree rises again. The youngest shares his food with the Uruisg, who later provides
    him a fully equipped ship. He sails with prospective bridegrooms for the king's
    daughters, recruits three men with extraordinary abilities, locates the daughters
    and giants, descends into a great hole in a creel, and begins contests against
    giants using the helpers' abilities.
  language: English
  quote_policy: summarized
