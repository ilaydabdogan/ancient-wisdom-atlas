canonical_text:
  quote: ''
  summary: Conal Crovi tells the King of Eirinn how he was trapped in a grave after
    trying to take gold and silver buried with a dead woman. He bargains for the marriage
    of the King of Sasunn's son to the King of Eirinn's daughter, with a stallion
    as tocher, as payment for his tale. Conal is bound and thrown into a peat corner
    while a long wedding feast is held. Later the king summons him to explain how
    he escaped the grave. Conal bargains again, then tells how the grave was opened,
    how he escaped, wandered on an island, met three brothers casting lots because
    a giant had taken their sister, and was lowered in a creel through a hole to seek
    her. Below, he finds a beautiful woman winding golden thread from a silver windle.
    An editor's note comments on cave/grave wording and compares the grave-mouth incident
    with an Italian story in Boccaccio's Decameron.
  language: English
  quote_policy: summarized
