canonical_text:
  quote: ''
  summary: The Shifty Lad tricks soldiers with an old horse carrying whisky, waits
    until they are drunk and asleep, removes a body from a mast, and buries it in
    a garden where its head already lies. After the king and the Seanagal send a black
    pig to find the buried body, the Shifty Lad lures the pig's keepers inside for
    food and drink, kills and buries the pig when it finds the body, and misdirects
    the keepers so they cannot recover it.
  language: English
  quote_policy: summarized
