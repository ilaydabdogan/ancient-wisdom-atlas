canonical_text:
  quote: ''
  summary: At O'Domhnuill's court, the Champion refuses offers of meat and clothing,
    says O'Domhnuill will not have cause to look gloomily on him after he leaves,
    and is watched by five hundred Galloglasses so he will not depart except by the
    door. At dawn he announces he is going, leaps over the court and city, and a Galloglach's
    thrown plough-board kills twenty-four of O'Domhnuill's people. The Champion gives
    O'Domhnuill's tracking lad a grey weed to rub on the dead people's mouths to restore
    them, then is seen thirteen miles beyond Limerick and continues rapidly to MacSeathain,
    the southern Earl, who admits him after he names himself.
  language: English
  quote_policy: summarized
