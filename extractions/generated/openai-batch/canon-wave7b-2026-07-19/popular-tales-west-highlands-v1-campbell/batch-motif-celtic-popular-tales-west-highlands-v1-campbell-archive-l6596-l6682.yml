canonical_text:
  quote: ''
  summary: The passage gives the end of a Gaelic tale episode in which a king's son
    and a female helper flee a giant using objects from a filly's ear that become
    landscape barriers. The giant dies when an apple containing his heart is crushed.
    The helper is later reduced through household ranks, gains entrance to the king's
    wedding through promised dresses, and is recognized when a golden cock and silver
    hen recount her services. Campbell then adds provenance notes and summarizes a
    similar South Uist tale, “Mother's Blessing,” involving a lad who loses service
    to a black dog, receives help from the dog's daughter in dangerous tasks, escapes
    with magical obstacles, forgets, and faces an interrupted marriage ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king's son looks in the filly's ear, finds a bit of stone, and throws
    it; the stone becomes a mountain that the giant breaks through with hammers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A later object of water from the animal's ear becomes a fresh-water loch,
    which the giant bales out with scoops before continuing the pursuit.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The female helper gives the king's son an apple and tells him to place it
    under the filly's foot; when the filly crushes it, the giant dies because his
    heart is in the apple.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the flight, the female helper reaches the king's father's house and
    is successively made house-keeper, house-maid, kitchen-maid, and hen-wife while
    the king prepares to marry.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The porter, head waiter, and another servant court the hen-wife, promise her
    entry to the wedding and fine dresses, and each becomes stuck to a household object
    or floor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the wedding the woman produces a golden cock and a silver hen, which speak
    and recount her earlier deeds, including saving the king's life; the king then
    says he will marry her.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Campbell records provenance comments: the stable boy learned the tale from
    an old man near Lochgilphead; another reported a similar old woman''s tale near
    Dalmally in which the raven was the son of the king of Lochlin.'
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: Campbell states that a very similar story is well known in South Uist and
    that a fragment is still told in Sutherland.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the South Uist story called “Mother's Blessing,” a good lad loses seven
    years' service to a black dog with a looking-glass on every paw, sees a cave with
    stakes and heads, and is assigned tasks of cleansing a byre, catching a steed,
    and robbing a nest.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The black dog's daughter helps with the tasks by causing litter to fly out,
    giving a rusty bridle, striking the sea with a rod to make a way to an island,
    and offering her toes as a ladder.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The lad and helper ride away on the horse; things found in the horse's ear
    produce a growing wood and flowing river, and the dog is defeated but not killed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the lad receives treasure, goes home, and forgets, a proposed marriage
    is interrupted when the black dog enters smoking a pipe, forbids the ceremony,
    disputes with the priest, and silences him by whispering something.
  category: sequence
  evidence_refs:
  - ev:10
