canonical_text:
  quote: ''
  summary: A fisher's son reaches the black castle despite warnings, confronts a crone,
    and fails to kill her by decapitation when she replaces her head. After the crone
    strikes the dog with a magic club, the youth wrests the club from her, strikes
    her down, restores his two brothers with it, takes the treasure from the castle,
    and returns to the king's house. The eldest son of the fisherman is crowned king,
    and the brothers later depart home with treasure and gifts. A collector's note
    identifies the written and oral sources of the tale.
  language: English
  quote_policy: summarized
