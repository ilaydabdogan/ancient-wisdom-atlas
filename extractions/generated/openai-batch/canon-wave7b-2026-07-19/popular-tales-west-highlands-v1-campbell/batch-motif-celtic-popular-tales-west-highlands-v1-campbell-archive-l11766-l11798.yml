canonical_text:
  quote: ''
  summary: At night the poor man's gillie complains that funeral linen is going with
    the dead crone while the poor household lacks shirts. He digs up the crone, removes
    her burial clothes, carries her to the rich brother's house, and stages her first
    at the fireside and later at the dresser as if present or eating. The rich brother
    and household react fearfully, buy more funeral goods, and bury the crone again,
    while some goods remain with the poor brother.
