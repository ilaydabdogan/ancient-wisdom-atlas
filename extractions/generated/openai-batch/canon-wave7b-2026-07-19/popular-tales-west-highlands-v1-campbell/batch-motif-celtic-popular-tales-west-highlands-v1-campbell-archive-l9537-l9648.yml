canonical_text:
  quote: ''
  summary: The passage gives collection notes and comparative commentary for a fragmentary
    Gaelic tale. In a Ross-shire variant, Uisdean Mor MacIlle Phadraig rescues a woman
    and newborn in a severe winter by killing his horse and placing them inside it
    for warmth; later, when he is poor in Edinburgh, the woman and child recognize
    him and offer him shelter. The editor connects this material with Connal, the
    Black Robber, Grimm's 'The Robber and his Sons,' the Odyssey Cyclops episode,
    Sindbad, a Highland cat/witch story, Arabian Nights cave-burial episodes, and
    a Decameron grave-robbing episode.
  language: English
  quote_policy: summarized
