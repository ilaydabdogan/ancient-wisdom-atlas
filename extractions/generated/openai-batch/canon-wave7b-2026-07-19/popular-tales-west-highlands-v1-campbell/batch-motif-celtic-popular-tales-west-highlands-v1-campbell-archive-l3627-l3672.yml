  summary: An enchanted king’s son is brought to a wise woman’s house. The wise woman’s
    daughter insists on having him despite warnings that the effort will cost her
    sorrow, hair, and her right breast. A caldron rite is prepared; a serpent that
    had appeared as a shirt around the prince’s neck takes its own form and attacks
    the girl. She cuts away its hold, freeing the prince from spells. The couple marries,
    a golden breast is made for the lady, and the narrator comments on serpent symbolism
    and the recurring mystery of rushes in Highland tale material.
