canonical_text:
  quote: ''
  summary: The introduction argues that Highland tales often render royal, supernatural,
    martial, and legal situations in ordinary domestic and local terms, while also
    preserving traces of older or foreign landscapes, laws, weapons, and combat customs.
    It gives examples including a prince lovesick for a lady in a swan's-down robe,
    a dragon fight by a Highland loch, wife-purchase, binding and blood-price, warrior
    insults before combat, single combats, and analogies with Ossianic, Homeric, Moorish,
    Highland, and Fionn-cycle fighting traditions.
  language: English
  quote_policy: summarized
