  quote: ''
  summary: 'The passage gives testimonial and editorial material about the authenticity
    of Ossianic poems: a lost volume is mentioned after a ship capture; Lord Lyndoch
    is reported to have seen Gaelic manuscripts in MacPherson''s possession; MacPherson
    is described as an educated tutor; the editor criticizes Gaelic-ignorant skeptics
    through analogies to Pope, Homer, Tennyson, and Arthurian tradition; and Johnson''s
    disbelief in Gaelic poems is linked to hostile attitudes toward Highlanders.'
