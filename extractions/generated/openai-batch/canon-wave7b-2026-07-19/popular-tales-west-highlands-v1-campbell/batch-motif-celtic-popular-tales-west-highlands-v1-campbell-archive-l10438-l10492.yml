canonical_text:
  quote: ''
  summary: A soldier-healer recovers a silver-producing purse and a food-producing
    towel from the king's daughter by making her admission and cure depend on their
    return. Pieces of an apple remove her horns and restore her. He rewards and reveals
    himself to his old comrades, refuses the king's daughter's marriage, distributes
    the magical objects among the three soldiers, and leads them to the place promised
    to three girls. There they pull a tree free, releasing the three girls from spells;
    each soldier takes his own girl back to Dublin and they marry.
  language: English
  quote_policy: summarized
