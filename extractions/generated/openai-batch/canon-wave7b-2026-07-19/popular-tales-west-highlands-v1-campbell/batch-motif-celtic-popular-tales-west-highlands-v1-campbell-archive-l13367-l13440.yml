canonical_text:
  quote: ''
  summary: Opening of a tale in which a young Highland man dreams three times of the
    most beautiful woman in the world, resolves to marry only her, leaves the farm
    with money from his uncle, searches abroad, arrives poor in London, receives help
    from an old Highland woman, recognizes the dreamed woman at a window, and learns
    that she is the daughter of the Bailie of London and the old woman's foster child.
  language: English
  quote_policy: summarized
