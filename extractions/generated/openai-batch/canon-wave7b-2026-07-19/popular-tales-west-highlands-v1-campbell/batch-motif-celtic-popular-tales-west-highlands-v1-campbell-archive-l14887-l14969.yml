canonical_text:
  quote: ''
  summary: A rich tenant sends his herd to bring a wether from the mountain moor as
    a wedding gift. The Shifty Lad wagers with the Black Rogue that he can steal the
    wether from the herd's back, then uses a pair of shoes placed separately on the
    road to make the herd set down the wether and run back. The Shifty Lad steals
    the wether and later steals a kid by hiding in a wood and bleating like the lost
    wether so that the herd leaves the kid unattended.
  language: English
  quote_policy: summarized
