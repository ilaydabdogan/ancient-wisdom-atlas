canonical_text:
  quote: ''
  summary: The excerpt ends a tale in which a woman gains night access to a drugged
    man by exchanging objects, is finally heard and recognized as his wife and the
    mother of his sons, and the couple returns home after spells leave him. Campbell
    then comments on the tale’s relation to The Hoodie and on the little dog as a
    transformed or mystic dog figure. The next tale begins with a poor woman’s eldest
    daughter choosing a larger bannock with her mother’s curse, refusing to share
    it with animal and bird petitioners, receiving their curse, and then seeking service
    at a distant house.
  language: English with some Gaelic terms
  quote_policy: summarized
