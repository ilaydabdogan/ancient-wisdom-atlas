canonical_text:
  quote: ''
  summary: The passage compares tent dogs, Lapp dogs, and fairy dogs, then presents
    a Sutherland story in which a woman carrying an infant through Glen Garaig near
    Glen Odhar hears the infant, previously unable to speak, say it has seen milking
    in the dun glen by one hoary man. The woman throws down the child and finds her
    own baby in its cradle at home. The narrator then describes attributed fairy traits—milking
    deer, living underground, smith work and weaving, treasure hoards, arrows, vulnerability
    to Christian symbols, and stealing humans—and repeatedly compares these traits
    with Lapps and other outsiders perceived as supernatural.
  language: English, with quoted Scottish Gaelic verse
  quote_policy: summarized
