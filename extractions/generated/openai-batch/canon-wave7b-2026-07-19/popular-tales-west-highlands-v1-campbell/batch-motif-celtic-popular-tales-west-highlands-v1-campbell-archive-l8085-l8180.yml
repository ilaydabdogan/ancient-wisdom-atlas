canonical_text:
  quote: ''
  summary: The passage summarizes variants of The Sea-Maiden. In one, a rough youngest
    son becomes a king's herd, defeats giants, gains magical beautifying objects and
    splendid spoils, rescues a princess from a three-headed giant, exposes a false
    claimant, and marries her. It then begins another version in which a smith or
    fisher promises his son to a mermaid; the grown son sets out with an iron staff,
    feeds animal helpers, becomes a herd, and defeats giants with the wolf's aid.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hero in the first summarized version is the youngest of ten sons of a
    widow, described as black-skinned and rough, and he goes to seek his fortune.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same hero becomes a king's herd and is confronted by giants who claim
    the pasture; the fights are preceded by parley across a ditch, and the opponents
    increase in severity, ending with a mother giant.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After killing the giant opponents, the herd takes named spoils, including
    a golden comb that can make him lovely or hideous, a magic basin that makes him
    beautiful when he washes, and wonderful arms, dresses, and horses.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A king's daughter is to be given to a three-headed giant who arrives in a
    ship and sinks into the ground or sand when he leaps ashore.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The herd is asleep with his head in the princess's lap, transformed by the
    comb, basin, and spoils, and is awakened on successive days by bodily injuries
    before fighting the giant.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The herd cuts off the giant's heads on successive days; the third head reattaches
    until a hoodie advises holding cold steel on the neck until the marrow freezes,
    after which the giant is killed.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: A red-headed lad hides during the danger and claims credit, but cannot untie
    the knots binding the severed heads; the herd is later recognized by his marks,
    marries the princess, and the red-headed lad is hanged.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the next version, a smith takes the place of the old fisherman; a mermaid
    rises beside the boat, obtains a promise of the son, and sends fish.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The son in the second version remains until he is fourteen, is described as
    exceptionally big, rugged, and formidable, asks his father to avoid the shore
    or sea wind because of the mermaid, requests a staff containing nine stone weight
    of iron, and sets out to seek his fortune.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The son meets a fox, a wolf, and a hoodie eating a year-old sheep; he divides
    the sheep among them, and the creatures promise to help him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The son reaches a castle, is employed as a herd, and is sent to a park from
    which no man had ever returned alive.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: A big giant takes one of the cows; when the herd is losing the fight, he remembers
    the wolf, gains the upper position, and kills the giant. Similar events are said
    to occur on the second and third days, and a great carlan appears on the fourth
    day.
  category: sequence
  evidence_refs:
  - ev:10
