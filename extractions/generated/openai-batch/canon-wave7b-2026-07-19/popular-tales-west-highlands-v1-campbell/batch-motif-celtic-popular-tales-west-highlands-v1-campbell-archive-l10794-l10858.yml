canonical_text:
  quote: ''
  summary: After a shout from the White Pet and his company, thieves flee from a house
    to a nearby wood. The White Pet and animal companions enter, divide the thieves'
    money, and settle in their customary places. One thief returns for a candle; the
    cat claws him, the dog puts out his light with water, the White Pet strikes him,
    the bull kicks him, the cock crows, and the goose beats his legs. The frightened
    thief reports these encounters as attacks by threatening human figures. The thieves
    do not return, and the White Pet and companions keep the money and live peacefully.
  language: English
  quote_policy: summarized
