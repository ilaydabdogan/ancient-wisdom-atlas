canonical_text:
  quote: ''
  summary: The Shifty Lad creates a disturbance among cattle, steals nuts, sews the
    Black Rogue's coat to a leather hide, and causes the Black Rogue to be chased
    as if stealing the hide. While the household pursues the Black Rogue, the Shifty
    Lad steals gold, silver, and provisions. He returns with the goods and receives
    praise as the better or smarter thief; the stolen money is divided between him
    and the Black Rogue.
  language: English
  quote_policy: summarized
