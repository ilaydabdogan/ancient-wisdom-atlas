  summary: The passage surveys sacred apples and especially horses in Celtic and other
    traditions, then summarizes Gaelic tale material about magic horses, human-horse
    transformations, and water-horse legends. It describes the Each Uisge or water
    kelpie as a dreaded being associated with lochs, disguise, attacks on riders and
    damsels, and an inferred old Celtic destroying water-god.
  language: English
