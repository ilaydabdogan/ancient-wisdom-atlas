canonical_text:
  quote: ''
  summary: A herd helped by a black dog defeats a giant and is welcomed because the
    king's cattle have milk. Later, the dairymaid reports that a three-headed beast
    in a loch receives a yearly victim, and the lot has fallen on the king's daughter.
    A General is expected to rescue her and marry her, but when the beast appears
    he flees. A handsome armed youth on a black horse, accompanied by the black dog,
    arrives. He tells the princess to rouse him by placing her gold ring on his little
    finger when the beast approaches. He wakes, fights the beast with sword and dog,
    cuts off one head, and the beast disappears into the loch. The princess says the
    beast will return until the remaining heads are cut off; the youth strings the
    severed head with a withy and tells her to bring it the next day.
  language: English
  quote_policy: summarized
