canonical_text:
  quote: ''
  summary: In this excerpt, a smith is ordered to provide crowns matching those the
    king's daughters had when they were with a giant. The smith's gillie summons an
    eagle with a whistle, and the eagle brings a silver crown and a copper crown.
    The smith admits that the gillie, not he, made or obtained the crowns. The king
    sends servants with a coach to bring the dirty bellows-blowing gillie, who is
    thrown into the coach. The gillie whistles for the eagle, is rescued, and the
    coach is filled with stones that fall on the king; the first servants are hanged.
    A second summons begins before the passage breaks off.
  language: English
