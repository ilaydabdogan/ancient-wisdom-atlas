  summary: A farmer plans to kill his White Pet sheep at Christmas. The White Pet
    runs away to seek his fortune and is joined in sequence by a bull, a dog, a cat,
    a cock, and a goose, each also threatened with killing. At night the group sees
    a distant light, reaches a house, looks through the window, sees thieves counting
    money, and the White Pet proposes that each animal make its own call. The supplied
    passage ends mid-sentence.
