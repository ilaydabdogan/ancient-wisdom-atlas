canonical_text:
  quote: ''
  summary: The Shifty Lad and the Black Rogue trick a herd by imitating animal sounds
    in a wood so that the herd leaves a stot tied to a tree; the Shifty Lad steals
    it, and the thieves kill and hide it. The herd later succeeds in carrying home
    a wether under stricter instructions. The two thieves continue stealing, use cattle
    trading to make their wealth seem legitimate, and encounter a gallows on a hill.
    The Shifty Lad has the Black Rogue hoist him by a cord and then claims hanging
    is enjoyable, urging the Black Rogue to try it.
  language: English
  quote_policy: summarized
