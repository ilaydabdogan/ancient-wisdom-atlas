canonical_text:
  quote: ''
  summary: 'The passage gives several short animal fables and proverbial notes: a
    hen and cock quarrel over food; the Eagle and Wren compete to fly highest for
    kingship of birds, with the Wren winning by riding on the Eagle; ravens are linked
    with unusual knowledge and compared with Odin''s ravens; a Wren says the sea is
    lessened when he dips his beak in it; and two foxes trick a man carrying herrings
    by feigning death and stealing the fish from his creel.'
