canonical_text:
  quote: ''
  summary: 'The passage comments on an unnamed plant in border minstrelsy, the scarcity
    of direct sun and moon worship in Highland stories despite customs suggesting
    solar worship, and several Celtic or regional supernatural beings: the water-bull,
    the water-horse, and the Boobrie. The water-bull is described as a Celtic mythological
    lake-being, generally friendly to humans, with short-eared progeny and a Skye
    name, Tarbh Eithre. The Boobrie is described as a gigantic ravenous water bird
    of Argyllshire lochs, physically cormorant-like, terrifying, and associated by
    the author with evil powers.'
