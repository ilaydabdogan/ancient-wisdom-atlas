canonical_text:
  quote: ''
  summary: The Ceabharnach’s music puts O'Donull’s harpers to sleep. He refuses to
    wake them himself but tells a herdsman how to awaken them with grass dipped in
    water. He then travels to Great Seathan son of the Earl, appears as a ragged young
    man, and performs juggles involving straws and his ear. When two of Seathan’s
    lads try to imitate him for payment, one loses his fist and another his head.
    The Ceabharnach leaves and tells a threshing man that restoring the injured lads
    will make him free for life.
  language: English
  quote_policy: summarized
