canonical_text:
  quote: ''
  summary: 'A giant forces the king''s son from the castle after failed substitutes,
    tests him with speech about a rod, and gives him lethal tasks. Auburn Mary, the
    giant''s daughter, secures promises of marriage and completes the tasks through
    magic: cleaning a byre, placing bird-feathers on a barn, and catching a filly
    with an old bridle. She then arranges decoys, speaking spittle, and apples to
    delay the giant while she and the king''s son flee on the filly. During pursuit,
    water taken from the filly''s ear becomes a lake that the giant cannot cross.'
  language: English with some Scottish Gaelic phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The son of the steward is dressed in fine clothes and sent to the giant, but
    the giant treats him as he had treated the cook's son and returns angry, demanding
    the king's son under threat of destroying the castle and killing those inside.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the king's son is sent, the giant shows him a rod and questions him;
    the king's son's answers about his father's braver rod and kingly chair make the
    giant understand he has the right person.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The giant takes the king's son home and orders him to clean a byre that has
    not been cleaned for seven years, threatening to drink his blood and eat his flesh
    if he fails.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king's son cannot clean the byre because what goes out at one door comes
    back in at another.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Auburn Mary makes the king's son promise to marry her, has him arrange the
    tools, waves her hand, and the tools clean the byre by themselves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A golden apple is run from end to end of the cleaned byre without raising
    any stain.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The giant orders the barn thatched with feathers from all the birds he has
    killed, arranged as closely as feathers on a heather hen or black cock.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: After another promise, Auburn Mary uses the wind to blow the feathers straight
    into their places.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The giant brings a bright bridle and orders the king's son to catch the filly
    on the hill, but Auburn Mary uses an old black rusty bridle from the stable, and
    the filly puts her nose into it.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Auburn Mary tells the king's son that the giant will kill him that night and
    says she will save him if he promises to marry her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Auburn Mary places a wooden bench in the king's son's bed, two benches in
    her own bed, spits at several locations, sets two apples above the giant's bed,
    and then she and the king's son ride away on the filly.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the giant wakes and calls for the blood of the king's son, the spittle
    answers in place of people, and apples fall on the giant and make him sleep again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The giant rises with an axe, strikes the bench in the king's son's bed, then
    strikes the two objects in his daughter's bed, runs to the stable, and pursues
    the fugitives.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: At daybreak Auburn Mary says she feels her father's breath burning between
