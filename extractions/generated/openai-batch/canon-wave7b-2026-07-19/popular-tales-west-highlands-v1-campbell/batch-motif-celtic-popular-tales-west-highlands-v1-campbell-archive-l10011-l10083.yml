canonical_text:
  quote: ''
  summary: A giant gives John a precision task involving an eagle's ear wart. After
    John succeeds without drawing blood, the speaking eagle carries him to the Green
    Isle. John fills three bottles with well water while black dogs are absent, then
    enters a little house and finds self-renewing whisky, bread, and cheese, as well
    as a very pretty little woman. He returns on the eagle, trades the magical provisions
    to giants under conditions concerning his first sweetheart, and returns toward
    his father's house, where his two brothers plot to kill him.
  language: English
  quote_policy: summarized
