canonical_text:
  quote: '"her form altered, and she is the loveliest woman that was on earth"'
  summary: The young king of Easaidh Ruadh decides to gamble with the Gruagach carsalach
    donn despite a soothsayer’s warning. The soothsayer advises him, if he wins, to
    ask for the cropped rough-skinned maid behind the door. The king wins, refuses
    other women offered by the Gruagach, chooses the last girl presented, and when
    they leave the house her form changes into that of a very beautiful woman. The
    king returns home joyfully with her and then wants to gamble with the Gruagach
    again.
  language: English
  quote_policy: quoted
