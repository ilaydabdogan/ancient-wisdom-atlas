canonical_text:
  quote: ''
  summary: A king continues his journey after a falcon helper promises aid. At a river
    he is aided by a brown otter, who brings salmon, guards his sleep, and promises
    future help. The king reaches a rock-chasm where his wife and two horses are held
    in the giant's domain. The wife hides or places him before the horses; the horses
    attack the giant when he feeds them. The wife asks the giant where his soul is,
    and he gives successive object-locations, first the Bonnach stone and then the
    threshold, which she then sets in order.
  language: English
  quote_policy: summarized
