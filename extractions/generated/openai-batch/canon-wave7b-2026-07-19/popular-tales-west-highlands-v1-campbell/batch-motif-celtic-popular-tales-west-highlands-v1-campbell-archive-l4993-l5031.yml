canonical_text:
  quote: ''
  summary: The narrator reflects that people fight in public, national, class, and
    individual conflicts. He recounts an Irish Christmas hurling match on an iced
    lake where refreshments were brought, a sudden shout and warlike dance triggered
    a brawl, and later opposing parties fought from behind a stone wall. He then compares
    this with a Highland parish shinty match that became so heated that leaders used
    pipers to march the opposing groups away in different directions.
  language: English
