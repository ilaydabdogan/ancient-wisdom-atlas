canonical_text:
  quote: ''
  summary: The Shifty Lad avoids being identified by duplicating black facial marks
    on many men and on the Seanagal, then returning a vial to the king's daughter.
    The king offers his daughter and kingdom to the one who performed the clever acts.
    Many marked men claim the deed, so a child is given an apple to choose among them.
    The child gives the apple to the Shifty Lad twice, after which he marries the
    king's daughter. Later, on the bridge of Baile Cliabh, the Shifty Lad recalls
    his mother's prophecy that he would be hanged there, and, in sport, hangs over
    the bridge by the king's daughter's pocket napkin.
  language: English
  quote_policy: summarized
