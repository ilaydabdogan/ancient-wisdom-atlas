canonical_text:
  quote: ''
  summary: 'Opening of the tale of Conal Crovi: a king''s three sons return from learning
    in France and visit the house of the king''s tenant Conal Crobhi. After Conal
    hosts them, the eldest son states a rule assigning the goodwife, maid, and daughter
    to wait on the three brothers. Conal objects to parting from his wife, locks the
    door behind him, and orders his gillie to prepare the three best horses for departure
    with members of his household.'
  language: English
  quote_policy: summarized
