canonical_text:
  quote: ''
  summary: A cumulative Gaelic tale segment in which Moorachug/Voorachai seeks a chain
    of items and actions ending in a rod for Meenachag, who has eaten his share of
    fruit. Each helper demands something first. When water must be carried in a sieve,
    a hoodie gives the practical solution of using brown clay and moss. The chain
    is completed, but Meenachag has burst when Moorachug returns. Editorial notes
    identify the tale as a well-known children’s chain-of-cause-and-effect tale and
    compare its step-count with other cumulative tales.
  language: English
  quote_policy: summarized
