canonical_text:
  quote: ''
  summary: 'In this excerpt from “The Battle of the Birds,” a pursuer consults his
    daughter after failed attempts and continues pursuit. Small things found in a
    left ear become large obstacles: a stone becomes a crag, a seed becomes a wood,
    and a drop of water becomes a deep loch in which the giant drowns. Auburn Mary
    later appears as an unknown seamstress near a wedding where the king’s son is
    to marry another. Her golden reflection at a spring confuses servants. At the
    wedding she produces a silver hen, a golden cock, and grain from an empty bag;
    their enacted quarrel and song recall deeds done for the king’s son. The king’s
    son remembers Auburn Mary, rejects the other bride, and marries her.'
  language: English with Gaelic phrases
  quote_policy: summarized
