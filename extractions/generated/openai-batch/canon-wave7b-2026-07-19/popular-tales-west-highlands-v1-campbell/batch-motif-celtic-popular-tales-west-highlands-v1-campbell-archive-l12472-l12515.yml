  quote: ''
  summary: Editorial source notes for variants of “Maol a Chliobain.” The passage
    says the translated story was written down by Hector MacLean, summarizes a second
    Islay version from Flora Macintyre involving a heroine, her sisters, a giant,
    theft of luminous or precious objects, a sack trick, and the giant’s destruction
    by drinking a river, and begins to summarize a third version told by a young nursemaid
    at Inverary.
