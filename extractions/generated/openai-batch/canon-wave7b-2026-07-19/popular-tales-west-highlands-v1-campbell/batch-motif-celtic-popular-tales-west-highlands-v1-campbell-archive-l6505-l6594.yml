canonical_text:
  quote: ''
  summary: 'The passage summarizes an ending in which a warned man is made forgetful
    by a dog’s kiss and nearly marries a king’s daughter until his true beloved, disguised
    during her search, uses golden and silver birds to remind him. It then begins
    another Inverary version: a wren and mouse conflict expands into a battle of birds
    against mice and rats, leaving a black raven. The raven travels with a gentleman’s
    son, causes trouble at inns, gives him a forbidden book, and the man’s disobedience
    places him in a giant’s house. A red-haired giant’s daughter helps him complete
    impossible tasks, secure a gray horse, and flee; speaking apples and a twig that
    becomes a great wood delay the pursuing giant.'
  language: English
  quote_policy: summarized
