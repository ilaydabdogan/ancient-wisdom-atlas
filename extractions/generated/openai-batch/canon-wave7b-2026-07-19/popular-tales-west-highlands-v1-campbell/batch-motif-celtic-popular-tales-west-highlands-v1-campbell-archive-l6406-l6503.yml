  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: For the thatching task, the giant’s daughter uses three grains of barley,
    the birds of the air gather, and the byres are thatched quickly.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The giant’s daughter gives the widow’s son a rusty bridle, and the steed comes
