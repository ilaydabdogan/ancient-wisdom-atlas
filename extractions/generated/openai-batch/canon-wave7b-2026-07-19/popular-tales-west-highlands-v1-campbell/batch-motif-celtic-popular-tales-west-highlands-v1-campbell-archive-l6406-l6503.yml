candidate_motifs:
- id: motif:1
  label: Adhesive trap humiliates unwanted night visitors
  taxonomy_refs:
  - trickster_boundary
  basis: The latch and floor hold men in place through the night after the girl’s
    prompt, and the men leave in shame or haste.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage begins mid-episode, so the full setup and the identity or
    motive of the men are not supplied here.
- id: motif:2
  label: Recognition of a spouse at a wedding through magical bird speech
  taxonomy_refs: []
  basis: At the wedding, pigeons emerge from flame and wine; the golden pigeon recalls
    earlier services, after which the king’s son remembers and the couple marries
    a second time.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not explicitly state that the girl transforms into the
    golden pigeon; it only links the bird speech to the king’s son’s recognition.
- id: motif:3
  label: Past tasks recalled as proof of identity or obligation
  taxonomy_refs: []
  basis: The golden pigeon repeats formulas about clearing the byre, thatching the
    byre, and harrying the magpie’s nest when the silver pigeon eats the barley without
    sharing.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The earlier task episodes are referred to retrospectively in this excerpt.
