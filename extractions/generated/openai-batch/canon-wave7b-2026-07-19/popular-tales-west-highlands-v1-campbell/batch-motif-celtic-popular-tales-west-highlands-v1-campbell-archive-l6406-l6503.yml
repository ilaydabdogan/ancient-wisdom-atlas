canonical_text:
  quote: "“a flame went up out of the glass, and a golden pigeon and a silver pigeon
    sprung out of it”"
  summary: In the closing episode, men who come to the girl are held fast overnight
    by latch or floor; she gives a gold sporran to the shoemaker and goes with him
    to the castle wedding. A flame and two pigeons emerge from a wine glass; the golden
    pigeon recalls earlier services and a lost little finger, and the king’s son recognizes
    the woman and marries her again. The passage then gives collection notes and summarizes
    an Islay variant, “The Widow’s Son,” involving service to a giant, impossible
    byre tasks, help from the giant’s daughter, a magical steed, answering cakes,
    pursuit with a sword of light, and the giant’s death by a golden apple thrown
    at his vulnerable mole.
  language: English
  quote_policy: quoted
