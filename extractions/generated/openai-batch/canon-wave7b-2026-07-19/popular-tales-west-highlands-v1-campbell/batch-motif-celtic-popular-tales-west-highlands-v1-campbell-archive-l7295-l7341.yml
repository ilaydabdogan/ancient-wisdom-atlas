canonical_text:
  quote: ''
  summary: A woman at Poison Hill substitutes for a cook in preparing a wedding meal
    for the man identified as her husband, who is about to marry another woman. She
    drops a ring and a feather into his broth; after he finds them, the minister delays
    the marriage until the meal-maker is brought forward. The man identifies her as
    his married wife, his spells are lifted, and they return over Poison Hill, collect
    three sons from his sisters' houses, and go home happy. The passage closes with
    a collection note naming the recorder and reciter.
  language: English
