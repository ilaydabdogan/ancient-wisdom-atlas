canonical_text:
  quote: ''
  summary: A daughter, advised by her muime, delays marriage by asking for special
    shoes and a chest fit for sea or land. She enters the chest and is set afloat
    by her father. After landing, she is taken in through a herd and enters service
    under a cook at a king's house. On three Sundays she secretly attends sermon in
    splendid gowns, attracting the king's son. On the third Sunday a watch is set;
    she escapes through a cranny, but one shoe is retained. The king's son declares
    he will marry the woman whom the shoe fits. Others try the shoe unsuccessfully,
    while a small bird in a tree repeats a refrain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The muime advises the daughter to say she will not marry until a golden shoe
    and a silver shoe are brought, and then until a chest is brought that locks from
    outside and inside and can be on sea or land.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The daughter packs her mother's clothes and her own clothes in the chest,
    enters it, and asks her father to put it on the sea to test how it swims.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father puts the chest out on the sea, and it goes out of sight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chest comes ashore elsewhere; a herd approaches intending to break it,
    but the girl calls out and tells him to summon his father.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The herd's father comes, takes the girl to his house, and she later enters
    service under the cook at a nearby king's house.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the first Sunday, when the others go to sermon, the girl says she must
    bake bread, then secretly puts on a gown of swan down and sits opposite the king's
    son at sermon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king's son takes love for the girl at the first sermon appearance, and
    she returns before the others come home.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the second Sunday, she again says she must bake bread, puts on a gown of
    moorland canach, attends sermon, and returns before the others.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the third Sunday, she puts on the gown that stands on the ground with gold
    and silver, along with the golden shoe and the silver shoe.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A watch is set on the doors for the third Sunday; she escapes through a cranny,
    but one of her shoes is kept.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The king's son declares that he will marry whoever the retained shoe fits.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Many people try the shoe and cut off toes and heels to make it fit, but it
