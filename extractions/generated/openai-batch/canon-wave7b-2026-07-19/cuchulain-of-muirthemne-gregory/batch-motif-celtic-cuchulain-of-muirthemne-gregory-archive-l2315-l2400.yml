canonical_text:
  quote: ''
  summary: Bricriu's flattering deceit sets Fedelm, Lendabair, and Emer in rivalry.
    The three women race back toward the hall because the first to enter is said to
    become queen of the province. Their noise alarms the men, the doors are shut,
    Emer reaches the door first, and Sencha reframes the conflict as a war of words.
    Fedelm begins the verbal contest by claiming noble birth, beauty, upbringing,
    and her husband Lacgaire's martial worth.
  language: English
  quote_policy: summarized
