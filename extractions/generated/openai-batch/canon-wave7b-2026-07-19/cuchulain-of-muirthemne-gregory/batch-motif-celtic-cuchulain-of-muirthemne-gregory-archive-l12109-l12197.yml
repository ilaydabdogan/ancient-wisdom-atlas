canonical_text:
  quote: ''
  summary: A first-person battle account says that Eochaid Juil was struck by a spear
    during fighting against the people of Manannan. A brief marriage notice follows.
    Cuchulain then stays a month with Fand, leaves her, and arranges a later meeting
    at the yew at the head of Baile's strand. Emer hears of this, comes angrily with
    armed young women, and confronts Cuchulain and Fand. Cuchulain promises to protect
    Fand, argues with Emer, praises Fand as a woman from beyond the great sea, and
    Emer responds by appealing to former faithfulness and esteem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first-person speaker says he fought the people of Manannan from horseback,
    threw a spear at Eochaid Juil, heard Eochaid groan, and that this cast was said
    to have won the battle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aebgreine, daughter of Naoise and Deirdre, is said to have been given afterward
    in marriage by Manannan to the son of Eochaid Juil of the Land of Promise.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cuchulain stays one month in that country with Fand, bids her farewell, and
    agrees to meet her at Ibar Cinn Tracta, the yew at the head of Baile's strand.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Emer hears what happened, she becomes very angry, has knives prepared
    to kill the woman, and goes with fifty young girls to the appointed meeting place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Cuchulain and Laeg are playing chess and do not see the women coming; Fand
    sees them first and alerts Laeg.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fand describes the approaching women as wise, carrying sharp green knives
    in their right hands, wearing gold at their breasts, and moving like brave men
    in a chariot battle.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cuchulain tells Fand that Emer will not harm or reach her, tells Fand to come
    into the sunny seat of the chariot, and says he will defend her against many women
    of Ulster.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Cuchulain tells Emer that her shaking spear, thin knife, and gathered anger
    do not wound him, and says it would be a pity for his strength to be put down
    by a woman's strength.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Emer asks why Cuchulain dishonoured her before the women of the province,
    Ireland, and honourable people, and she appeals to his shelter and faithfulness.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Cuchulain asks why he may not have his turn in Fand's company and praises
    Fand as well-behaved, comely, high-descended, skilled, sensible, and a woman from
    beyond the waves of the great sea.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Emer says she will not refuse the woman if Cuchulain follows her, then contrasts
    what is red, new, high, common, absent, and familiar, and says she once had Cuchulain's
    esteem and would have it again if it pleased him.
  category: speech
  evidence_refs:
  - ev:10
