canonical_text:
  quote: ''
  summary: During the journey toward Emain Macha, Deirdre warns Naoise and the sons
    of Usnach. She reports a sleep-vision of headless companions, laments that no
    one can help another, sees a blood-colored cloud over Macha, and advises going
    instead to Dundealgan for Cuchulain’s protection because of Conchubar’s possible
    treachery. Naoise repeatedly refuses her advice, saying there is no fear on them.
    Deirdre recalls a cup given by Manannan and then gives a sign by which the sons
    of Usnach may know whether Conchubar intends treachery.
  language: English
  quote_policy: summarized
