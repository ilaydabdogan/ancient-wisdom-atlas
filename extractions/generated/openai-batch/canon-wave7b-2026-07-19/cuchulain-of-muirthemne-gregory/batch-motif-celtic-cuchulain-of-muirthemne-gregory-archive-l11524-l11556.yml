  quote: ''
  summary: Near Samhain, the men of Ulster gather on the plain of Muirthemne for games
    and feasting. Cuchulain refuses to begin the feast until Conall Cearnach and Lugaid
    of the Red Stripes arrive. Sencha proposes chess, poems, and games while they
    wait. A beautiful flock of birds comes down on the lake, and the women present
    long to possess them, quarrel over them, and send Levarcham to ask Cuchulain to
    get them.
