canonical_text:
  quote: ''
  summary: Men of Ulster bring the wounded Cuchulain to the five streams of Conaille
    Muirthemne, where the Sidhe put healing herbs and plants into the waters. Ailell
    and Maeve send Mac Roth to watch for Ulster forces. Mac Roth reports a single
    unarmed man in a chariot, identified by Fergus as Cethern son of Fintan. Cethern
    bursts into the camp, wounds others with an iron spit, is badly wounded himself,
    and reaches Cuchulain. Cuchulain has Laeg compel Ailell's physicians to come,
    but Cethern rejects them. Cuchulain then sends Laeg for Fingan, Conchubar's druid
    physician, who is famed for diagnosing sickness from smoke and wounds from their
    appearance. Fingan examines Cethern's wounds while Cethern and Cuchulain identify
    some of the attackers.
  language: English
  quote_policy: summarized
