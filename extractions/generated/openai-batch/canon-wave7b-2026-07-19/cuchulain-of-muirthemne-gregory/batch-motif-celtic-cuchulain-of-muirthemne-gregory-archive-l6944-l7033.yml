canonical_text:
  quote: ''
  summary: In a battle at Gerg's house, Gerg kills several opponents and brings severed
    heads inside, but is wounded. Conchubar's men break through the wall, and Brod
    throws a spear that kills Gerg and his servant. Conchubar kills many of Gerg's
    people, including Gerg's son Conn. Nuagal, Gerg's wife, laments Gerg with praise
    for his bravery, generosity, counsel, kingship, and house. Gerg's sons continue
    resisting, and Maine goes out with his companions to avenge his father-in-law.
  language: English
  quote_policy: summarized
