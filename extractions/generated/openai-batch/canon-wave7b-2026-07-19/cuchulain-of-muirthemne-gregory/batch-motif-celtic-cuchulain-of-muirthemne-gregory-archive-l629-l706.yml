canonical_text:
  quote: ''
  summary: Cuchulain and Jubair travel to a mountain cairn, view the land and notable
    strongholds of Ulster and Magh Breagh, and then go to the dun of Nechtan Sceine's
    sons. At the dun, Cuchulain reads an Ogham challenge on a pillar-stone, throws
    the stone into nearby water, sleeps in the enemy's country, and is confronted
    by Foill, who insults his youth and fighting ability. Cuchulain wakes angered
    and challenges Foill to go to the ford after fetching his armour.
  language: English
  quote_policy: summarized
