canonical_text:
  quote: ''
  summary: Deirdre says she has dreamed of three men hunting on a hill. An unnamed
    hunter decides to tell Conchubar, High King of Ulster, about Deirdre's beauty
    and location. Conchubar travels with companions to Deirdre's house, orders entry,
    sees her, falls in love, and has Deirdre and Levarcham brought to Emain Macha.
    He presses for marriage, but Deirdre obtains a delay of a year and a day and is
    given a teacher and maid companions.
  language: English
