canonical_text:
  quote: ''
  summary: Cuchulain, bound by his word to Niamh not to go out against the men of
    Ireland without her leave, is brought to Cathbad's prepared house in the Deaf
    Valley, where companions try to cheer him. The children of Calatin search Emain
    and the province by enchantment, find signs of Cuchulain in the valley, and create
    an illusion of armed battalions, battle sounds, fires, and cries to draw him out.
    Cuchulain hears the outcry and laments, but Cathbad tells him it is a deceit meant
    to destroy him. The children persist, then Badb resolves to enter the valley herself
    and speak with him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Niamh reminds Cuchulain that he gave his word not to go out to meet the men
    of Ireland without leave from her, and Cuchulain says it is right to hold to that
    word.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chariots are unyoked, the Grey of Macha and the Black Sainglain are let
    loose to graze in the valley, and the party goes to the house prepared by Cathbad.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the feast, Cuchulain is placed in the chief place, Cathbad, Geanann, and
    the poets are on his right, Niamh and the women are on his left, and musicians
    and reciters are opposite.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The three deformed, one-eyed children of Calatin come to Emain, do not find
    Cuchulain, and search for him there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The children of Calatin rise high in the air on a moaning wind made by enchantments
    and search woods, valleys, caves, and secret paths across the province.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Over Glean-na-Bodhar, the children see the Grey of Macha, the Black Sainglain,
    and Laeg beside them, and infer that Cuchulain must be in the valley.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people in the feasting-house make music, laughter, and women's voices
    in an effort to lift Cuchulain's heaviness of mind.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The children of Calatin use thistle-stalks, little fuzz-balls, and withered
    leaves, putting on them the appearance of armed troops so that the hills and places
    outside the valley seem filled with battalions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The air seems filled with battle sounds, shouts, trumpets, dreadful laughter,
    cries of wounded men, apparent fires, and the crying of women, and dread comes
    on those who hear it.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The women with Cuchulain shout back, but they cannot prevent the outcry from
    reaching him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Cuchulain says he hears the men of Ireland spoiling the province and declares
    that his fame and Ulster are lost.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Cathbad tells Cuchulain that the noise is made by the children of Calatin
    to draw him out and make an end of him, and tells him to stay.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Cuchulain stays quiet while the children of Calatin continue making battle
    noises until they tire of it.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Badb, one of Calatin's daughters, says the others should keep making fighting
