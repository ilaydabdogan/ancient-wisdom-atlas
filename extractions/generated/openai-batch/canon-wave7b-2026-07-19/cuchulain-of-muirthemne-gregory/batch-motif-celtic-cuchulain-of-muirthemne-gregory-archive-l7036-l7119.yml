canonical_text:
  quote: ''
  summary: 'The passage narrates Maine''s defense of a house or dun at Rath Ini: he
    fights Fomor warriors and individual opponents, Conchubar joins the battle, Maine
    and Cobthach hold the house overnight, a strange woman warns sleeping Maeve at
    Cruachan, Maeve and Maine''s foster-brothers mobilize aid, and at dawn the Fomor
    break through into a richly furnished house.'
  language: English
  quote_policy: summarized
