canonical_text:
  quote: ''
  summary: Cuchulain returns toward Emain with Jubair. He captures wild swans alive
    with sling-stones and has them tied to the chariot. Levarcham sees the angry chariot-fighter
    approaching with bleeding heads, bound stags, and white birds, and warns Conchubar
    that Ulster’s men may be in danger. Conchubar identifies him as the young son
    of Dechtire who crossed the boundaries that day. The people send out three fifties
    of uncovered women; the boy is ashamed, hides his face, his wildness leaves him,
    and he is received with washing water, feasting clothes, and welcome. The passage
    closes by identifying this as part of the boy deeds of Cuchulain told by Fergus
    to Ailell and Maeve during the war for the Brown Bull of Cuailgne.
  language: English
  quote_policy: summarized
