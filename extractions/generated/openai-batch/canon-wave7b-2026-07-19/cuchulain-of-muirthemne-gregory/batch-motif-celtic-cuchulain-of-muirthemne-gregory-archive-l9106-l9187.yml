  evidence_refs:
  - ev:2
- id: obs:4
  text: Cuchulain turns back without any wound on himself, the horses, or Laeg, and
    goes around the army mowing men down in revenge for the boy troop of Emain.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The next day Cuchulain stands on a hill, young, comely, shining, and without
    the cloud of his anger.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women, young girls, poets, and singers come out to look at Cuchulain; Maeve
