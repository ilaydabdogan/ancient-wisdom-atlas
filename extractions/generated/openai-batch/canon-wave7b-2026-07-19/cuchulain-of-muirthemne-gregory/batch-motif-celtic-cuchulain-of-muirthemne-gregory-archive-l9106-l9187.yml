- id: obs:2
  text: Cuchulain puts on armour and takes spears, a sword, a sharp-rimmed shield,
    and a cloak made from precious fleeces of the land of the Sidhe, brought by Manannan
    from the King of Sorcha.
  category: action
  evidence_refs:
