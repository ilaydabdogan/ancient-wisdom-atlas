    her.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The women wonder at the contrast between Cuchulain's present quietness and
    his previous terror to the army, and they ask to be lifted on shields to see him
    better.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dubthach sees his wife climbing with the other women to look at Cuchulain,
    becomes angry and jealous, and proposes that the army secretly surround Cuchulain
    while pretending to fight among themselves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Fergus kicks Dubthach away, speaks angrily against him, and warns that he
    will be repaid when the men of Ulster recover from their weakness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The army of Ireland camps at the great stone in Ross, and Maeve asks who will
    fight Cuchulain the next day; the men refuse, saying they will not go or send
    family members to death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Maeve asks Fergus to fight Cuchulain; Fergus says it is not right because
