canonical_text:
  quote: ''
  summary: Cuchulain arms himself and attacks the men of Ireland in a godlike battle-fury,
    returning unwounded with Laeg and the horses. The next day he appears calm and
    shining on a hill, drawing spectators and causing Maeve to hide behind shields.
    Dubthach becomes jealous when his wife looks at Cuchulain and proposes a deceptive
    ambush, but Fergus rebukes him. Maeve later seeks a fighter against Cuchulain;
    the men refuse, and Fergus is pressed into going to the ford, where he appeals
    to their foster relationship and asks Cuchulain to yield in exchange for a future
    retreat.
  language: English
  quote_policy: summarized
