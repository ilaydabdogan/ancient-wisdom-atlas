canonical_text:
  quote: ''
  summary: A Britain-linked raiding agreement leads Ingcel and his comrades first
    to Britain, where Ingcel's kin are killed, then to Alban and back toward Ireland
    for reciprocal spoiling. In Ireland Conaire goes to settle the quarrel of the
    two Carbres, thereby breaking bonds placed on him by the Man of the Waves. On
    the return journey Conaire and his people see signs of fighting and fire, are
    told that the king's law has broken down, take a route that breaks another bond,
    and hunt beasts later identified as the evil beasts of Cerna. The Sidhe make a
    Druid mist of smoke around him because he has begun to break his bonds. Conaire,
    afraid and seeking lodging, turns toward the house of Da Derga, whose hospitality
    he expects because of earlier gifts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker proposes that one group spoil the people of his country and then
    he will return with them to spoil the people of their country; the group agrees,
    casts lots, and the lot sends them first to Britain with Ingcel.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Britain, Ingcel and his comrades attack the house where Ingcel's father,
    mother, and seven brothers have been sent and kill them all in one night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The raiders go to Alban, carry out destruction and robbery, and then turn
    back to Ireland so Ingcel can spoil their people as they had spoiled his.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Peace in Ireland has been broken by the two Carbres, and Conaire goes to make
    peace, although doing so breaks two of the bonds placed on him by the Man of the
    Waves.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Near Usnach in Meath, Conaire and his people think they see fighting in all
    directions, armies of naked men, and the country of the Ua Neills like a cloud
    of fire around them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Conaire's people say the king's law has broken down and the country is on
    fire; after being told to go north-west, the party goes righthandways around Teamhair
    and lefthandways around Bregia, which is another breaking of his bonds.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Conaire's party meets and hunts beasts, and Conaire only learns afterwards
    that they were the evil beasts of Cerna.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Sidhe have made a Druid mist of smoke around Conaire because he has begun
    to break his bonds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Great fear comes on Conaire; uncertain which way to go, he and his people
    travel by the sea-coast toward the south by the road of Cualu, and he asks where
    they will spend the night.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mac Cecht is identified as one of Conaire's fighting men and as the keeper
    of three Fomor hostages at the king's court so that their people will not spoil
    corn or milk in Ireland during Conaire's reign.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Conaire says Da Derga of Leinster, keeper of the great Inn, is his friend;
    Conaire recounts having given him cattle, swine, cloth cloaks, weapons, brooches,
    ale, hounds in silver chains, and horses, and expects Da Derga to return hospitality
    that night.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Mac Cecht says the current road once led straight to Da Derga's house and
    describes the house as having seven doorways and seven sleeping-rooms between
    every two doorways; Conaire says they will go there with all their people.
  category: speech
  evidence_refs:
  - ev:12
