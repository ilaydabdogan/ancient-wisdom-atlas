canonical_text:
  quote: ''
  summary: A woman tells Nera that the destruction he saw was an appearance made by
    the Sidhe, warns that the Sidhe hills open at Samhain, and advises him to bring
    summer flowers as proof of his visit. Nera returns to Cruachan, later re-enters
    the hill, and Connaught forces raid it and carry off Briun's crown. Nera remains
    in the hill. The passage then tells of the Morrigu's cow, a bull-calf whose bellowing
    is interpreted as foretelling conflict between the Brown Bull of Cuailgne and
    Ailell's White-Horned bull, leading Maeve to vow that she will see the two bulls
    fight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman says that the army of the Sidhe can go out only at Samhain, when
    all the hills of the Sidhe in Ireland are opened.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman says that Nera's vision of Cruachan burned and its people destroyed
    was an appearance placed before his eyes by the host of the Sidhe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman tells Nera that, on returning, he will find his people still around
    the same great pot and that the meat has not yet been taken off the fire.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nera asks how his visit to the Hill will be believed, and the woman tells
    him to bring summer flowers; he brings wild garlic, primroses, and golden fern.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nera returns to the palace, finds his people around the same pot, tells them
    what happened, receives the sword, and remains with them for a year.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After a year, Ailell tells Nera that they are going against the Hill of the
    Sidhe and tells him to return there if he has anything to bring out.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Nera returns to the woman in the Hill, and she explains that she had carried
    loads of firing daily for the king while saying that Nera was sick.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The men of Connaught and the exiles of Ulster enter the Hill, rob it, and
    carry away the crown of Briun.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The crown of Briun is described as made by the smith of Angus, son of Umor,
    and kept in the well at Cruachan to save it from the Morrigu.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Nera is left with his people in the Hill and is said not to have come out,
    nor to come out until the end of life and time.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Morrigu brings a cow from the Hill of Cruachan to the Brown Bull of Cuailgne
    and later brings it back; its calf is then born.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The calf goes out of the Hill and bellows three times; Ailell and Fergus hear
    it while playing draughts.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: Fergus says he does not like the calf's bellowing and links it to a coming
    royal march.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Ailell's bull Finbanach, the White-Horned, meets the calf in the plain of
    Cruachan; they fight, and the calf is beaten and bellows.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Buaigle interprets the calf's bellow as saying that if the Brown Bull of Cuailgne
    fought the White-Horned, the White-Horned would be beaten through the plain of
    Ai.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: Maeve swears by her people's gods that she will not lie on feathers or drink
    ale until she sees the two bulls fighting before her.
  category: speech
  evidence_refs:
  - ev:16
