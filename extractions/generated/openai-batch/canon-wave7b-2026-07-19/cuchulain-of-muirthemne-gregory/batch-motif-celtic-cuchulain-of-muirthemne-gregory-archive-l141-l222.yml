canonical_text:
  quote: ''
  summary: The men of Ulster pursue destructive and beautiful birds across the country
    until nightfall. Seeking lodging, Fergus first finds a small poor-looking house,
    while Bricriu later sees a grand well-lighted house with a shining young man and
    a noble young woman. The young man reveals that fifty missing girls from Emain
    are in the house, with Dechtire as their mistress, and that they had changed into
    birds to bring the Ulster party there. Bricriu receives a purple cloak, decides
    to conceal the full discovery, and reports only the fine house, women, and host
    before Conchubar leads the party there.
  language: English
  quote_policy: summarized
