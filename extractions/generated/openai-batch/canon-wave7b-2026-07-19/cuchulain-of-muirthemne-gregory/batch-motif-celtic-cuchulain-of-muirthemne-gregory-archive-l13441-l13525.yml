canonical_text:
  quote: ''
  summary: Blanad pours new milk into a stream as a signal; Cuchulain follows the
    whitened stream to Curoi's dun, fights Curoi, kills him, and takes Blanad to Ulster.
    Curoi's poet Feirceirtne follows them and kills Blanad and himself by throwing
    them both from a high rock. The passage then turns to Calatin's posthumous one-eyed
    triplet daughters, whom Maeve fosters and sends through the world to learn spells
    and witchcraft for revenge against Cuchulain. They return able to create the appearance
    of battles by secret words. Maeve then summons other bereaved heirs and proposes
    assembling a great army against Cuchulain while Ulster is weakened.
  language: English
  quote_policy: summarized
