  summary: A note by W. B. Yeats explains the conversation of Cuchulain and Emer as
    an example of ancient Irish poet speech, marked by mythological allusion, coded
    periphrasis, and difficulty for those outside the tradition. The note compares
    this Irish mode with Icelandic court poetry, Greek mythological allusion in later
    verse, and symbolic religious art. It also comments on Cuchulain’s mythological
    references to landscapes, the battle of Magh Tuireadh, sow-shaped hills, the pig
    as a possible Firbolg ancestral symbol, and Maeve’s magical pigs.
  language: English
