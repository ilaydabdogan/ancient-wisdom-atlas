canonical_text:
  quote: ''
  summary: Emer reproaches the son of Riangabra and the men of Ulster for failing
    to find a cure for Cuchulain, saying that Cuchulain would have searched the world
    for a healer if other Ulster heroes were afflicted. She laments that a hostile
    hill-host and a Sidhe sleep have taken Cuchulain's courage and left him in stupor.
    Emer then goes to Emain Macha, sits by Cuchulain's bed, urges him to awaken by
    recalling Ulster's king, heroes, women, wealth, and the harshness of winter, and
    Cuchulain rises and casts off his heaviness.
  language: English
  quote_policy: summarized
