canonical_text:
  quote: ''
  summary: Maeve tries to induce Ferdiad to fight Cuchulain by offering pledges, rewards,
    sureties, jewels, her brooch, and Findabair. Ferdiad demands six securities and
    finally agrees, binding Maeve to her promises while she binds him to fight Cuchulain
    the next day. Fergus then travels by chariot to warn Cuchulain that Ferdiad, his
    friend, companion, and fellow-pupil in arms, will be his opponent. Fergus stresses
    Ferdiad's prowess and armor; Cuchulain answers that he will not draw back and
    says the fight at the ford will be told in stories.
  language: English
  quote_policy: summarized
