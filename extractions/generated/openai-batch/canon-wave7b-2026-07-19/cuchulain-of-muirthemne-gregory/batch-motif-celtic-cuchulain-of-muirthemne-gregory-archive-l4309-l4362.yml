canonical_text:
  quote: ''
  summary: After attacks at Da Derga's Inn, Conaire remains with only three companions.
    Overcome by rage, battle, and unquenched thirst, he dies. Conall, Sencha, and
    Dubthach cut their way out wounded. Conall returns to his father Amergin, who
    challenges him for surviving while his lord is dead; Conall shows his wounds.
    Mac Cecht searches through the night for water, finally fills a cup, returns to
    the inn, and finds men striking off Conaire's head.
  language: English
