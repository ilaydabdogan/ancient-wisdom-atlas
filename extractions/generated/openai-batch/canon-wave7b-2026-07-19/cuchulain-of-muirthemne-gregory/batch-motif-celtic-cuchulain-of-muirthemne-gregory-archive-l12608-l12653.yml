  quote: the prisoners of Eocho Glas came running from the hills ... and bathed themselves
    in his blood ... and they all got healing.
  summary: Cuchulain strikes down a woman, fights Cairpre Cundail to a standstill,
    is brought by Cairpre to Eocho Glas, kills Eocho with the Gae Bulg, and the harmed
    prisoners bathe in Eocho's blood and are healed. The sons of Doel Dermait are
    also healed. Cuchulain returns to Ulster with presents, tells his story at Emain
    Macha, and makes peace with Eocho Rond.
  language: English
