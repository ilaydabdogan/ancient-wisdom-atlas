canonical_text:
  quote: '"It is to me the Champion''s Portion belongs, for you see my token."'
  summary: Ailell and Maeve award Cuchulain the championship and a superior cup-token.
    At Emain Macha, Laegaire, Conall, and Cuchulain display graded cups as claims
    to the Champion's Portion. The dispute nearly becomes violent, is deferred to
    Curoi's judgment, and the three heroes travel to Curoi's fort, where Blanad hosts
    them and assigns night watches.
  language: English
