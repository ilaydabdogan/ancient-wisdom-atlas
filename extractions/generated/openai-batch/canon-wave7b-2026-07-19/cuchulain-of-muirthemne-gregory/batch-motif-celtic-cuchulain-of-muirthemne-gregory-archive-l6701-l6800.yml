canonical_text:
  quote: ''
  summary: Maine Morgor, son of Ailell and Maeve, sets out from Cruachan for his wedding
    with Ferb at Rath Ini. The passage gives an elaborate description of his three
    troops, horses, chariots, weapons, dogs, trumpeters, Druids, and harpers; recounts
    his departure from Cruachan; includes Bricriu's warning and Maine's vow to feast
    three days and nights at Gerg's house; and describes preparations at Rath Ini
    and Findchoem's admiring report to Ferb.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maine Morgor, son of Ailell and Maeve, sets out for his wedding with Ferb,
    daughter of Gerg of Rath Ini in Ulster.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maine brings three troops of young men, with fifty men in each troop.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first two troops wear shining white shirts striped with purple, carry
    gold shields, have two-edged swords with silver hilts, wear silver neck chains,
    and have neither helmets nor shoes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The third troop includes fifty reddish-brown horses and fifty white horses
    with red ears, purple-colored manes and tails, ornate bridles, gold or silver
    bits, and gold collars with bells.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bells on the horses are described as sounding as sweet as harp strings
    when the horses move.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each pair of horses has a chariot of white bronze ribbed with gold and silver,
    with purple cushions sewn with gold.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fifty fair young men ride in the chariots; each is described as the son of
    a king and queen, a hero, and a brave man of Connaught.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chariot youths wear purple cloaks, silk coats, silver shields with gold
    rims and stones, shining spears, gold-hilted swords with silver sheaths, and bronze
    goads with silver crooks.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The spears bear precious stones said to flame at night like the rays of the
    sun.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Seven greyhounds follow Maine's chariot in silver chains with gold apples
    on every chain.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Seven trumpeters, three Druids, and three harpers accompany the procession.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The party gathers at the royal house of Cruachan, goes three times around
    the lawn, says farewell to Maeve and Ailell, and sets out for Rath Ini.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Bricriu says the setting out is fine but the return may not be so fine; Maine
    answers that the journey will be heard of everywhere.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Maine gives his word that they will not return to Cruachan until they have
    feasted three days and three nights in Gerg's house.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: At Rath Ini, after messengers arrive, the people prepare Gerg's house with
    green-leaved birch branches and fresh green rushes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Ferb sends her foster-sister Findchoem to observe Maine and his companions;
    Findchoem returns and praises the approaching troop as finer, grander, and more
    beautiful than any she has seen.
  category: speech
  evidence_refs:
  - ev:9
