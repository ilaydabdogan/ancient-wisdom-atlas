canonical_text:
  quote: ''
  summary: 'Ferogain identifies a sequence of figures and objects reported by Ingcel
    inside or around the inn: Conall Cearnach with his shield and role at the seven
    doorways; Muinremar, Sencha, and Dubthach with Celthair''s Luin, a spear that
    flames before battle and must be quenched; nine Sidhe pipers who can kill but
    cannot be killed; three strange giants spared by Cuchulain and bought by Conaire;
    nine British princes and foster-brothers; and three red champions under punishment
    from the king of the Sidhe to be destroyed through the King of Teamhair. The excerpt
    ends as Ingcel begins another sighting.'
  language: English
  quote_policy: summarized
