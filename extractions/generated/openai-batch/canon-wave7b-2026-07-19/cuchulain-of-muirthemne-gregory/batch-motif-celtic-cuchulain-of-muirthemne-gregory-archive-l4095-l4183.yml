  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ingcel reports seeing a large brown man with short brown hair, a red speckled
    cloak, and a black shield with gold clasps, accompanied by two chief men with
    black swords.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: One of the chief men holds a great spear with fifty rivets, shakes it over
