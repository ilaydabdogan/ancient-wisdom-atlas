canonical_text:
  quote: ''
  summary: Cuchulain laments that he is a father who has killed his son, using images
    of homelessness, drift, and grief. Conchubar fears that Cuchulain will destroy
    the men of Ulster and sends Cathbad the Druid to bind him to fight the sea-waves
    for three days. At Baile's Strand, Cuchulain splits a white stone with his sword
    and fights the waves until he collapses, though the narration says he does not
    die there. The next section introduces enemies of Cuchulain and begins an account
    of Blanad arranging for Cuchulain to come to Curoi's dun and carry her away, with
    a white stream as signal.
  language: English
  quote_policy: summarized
