canonical_text:
  quote: ''
  summary: The passage recounts how Ness arranges for her son Conchubar to receive
    and then retain the kingship of Ulster. Later, at Dechtire's marriage feast, Dechtire
    drinks wine into which a mayfly has fallen. In sleep, Lugh of the Long Hand appears
    and says he was the mayfly; he tells Dechtire and her fifty maidens to come away,
    gives them the appearance of birds, and leads them to Brugh na Boinne, the dwelling-place
    of the Sidhe. About a year later, a great flock of birds appears at Emain Macha
    and consumes everything before it.
  language: English
  quote_policy: summarized
