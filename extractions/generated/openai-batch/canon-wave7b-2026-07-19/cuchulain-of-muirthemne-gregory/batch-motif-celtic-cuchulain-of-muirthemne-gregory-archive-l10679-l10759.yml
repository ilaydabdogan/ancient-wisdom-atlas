canonical_text:
  quote: ''
  summary: After fear spreads among the men of Ireland, Ailell proposes returning
    to Magh Ai with plunder but sends Mac Roth to watch for Ulster. Mac Roth sees
    and hears alarming signs of an approaching force, which Fergus interprets as the
    march of the men of Ulster. Fergus warns that Ulster is unstoppable once its weakness
    is gone. At Clartha, Mac Roth reports Conchubar and Celtchair approaching with
    chariots, and Maeve proposes an encircling trap to take them alive.
  language: English
  quote_policy: summarized
