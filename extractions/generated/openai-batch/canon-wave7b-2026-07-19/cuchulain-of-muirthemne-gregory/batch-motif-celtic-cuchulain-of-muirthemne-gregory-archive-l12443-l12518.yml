canonical_text:
  quote: ''
  summary: Cuchulain, with Lugaid and Laeg, encounters Finnchoem on a burial-hill;
    she declares love for him and is taken into his keeping. During the journey they
    pass three fires with outlaws, and Cuchulain kills some of them. Finnchoem's father
    Eocho Rond attacks Cuchulain with a spear, but Cuchulain returns the spear, unhorses
    him, and carries him to Cruachan. Eocho lays a threat on Cuchulain that he will
    have no rest until he discovers what drove the three sons of Doel Dermait from
    their country. At Emain, Cuchulain sees the house and ground as if on fire and
    decides he must obey. He later meets the king of Alban's son arriving by boat
    with gifts for Conchubar, becomes angry at a request for hospitality, and asks
    whether they know what drove the three sons away.
  language: English
  quote_policy: summarized
