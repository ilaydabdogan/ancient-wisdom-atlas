canonical_text:
  quote: ''
  summary: An opening speech contrasts an addressee's lack of a fitting queen with
    Cuchulain's possession of one. Cuchulain sees Fand going away with Manannan, and
    Laeg explains that Fand is going to Manannan because she was not pleasing to Cuchulain.
    Cuchulain becomes angry, withdraws southward without food or drink, and sleeps
    among the mountains. Emer reports his condition to Conchubar, who sends poets,
    skilled men, and Druids to retrieve him. The Druids enchant Cuchulain, give him
    a drink of forgetfulness, and give Emer a similar drink to erase her jealousy.
    Manannan then shakes his cloak between Cuchulain and Fand so they will never meet
    again.
  language: English
  quote_policy: summarized
