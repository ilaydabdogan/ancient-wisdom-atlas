canonical_text:
  quote: '"I am Deirdre without gladness, and I at the end of my life..."'
  summary: Deirdre laments the dead sons of Usnach, kisses Naoise's body, wanders
    to the strand, and is sheltered by a fisherman and his wife. Conchubar sends Levarcham
    to bring her back so he may make her his wife, but Deirdre refuses and asks instead
    to go to the grave of the sons of Usnach. Her complaint praises Naoise, Ardan,
    and Ainnle and compares their deaths to branches destroyed by a storm.
  language: English
  quote_policy: quoted
