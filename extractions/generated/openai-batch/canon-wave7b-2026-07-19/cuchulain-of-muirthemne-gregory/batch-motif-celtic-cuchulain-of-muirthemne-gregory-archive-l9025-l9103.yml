canonical_text:
  quote: ''
  summary: Laeg sees a shining, richly dressed man approaching through the camp, unseen
    by the Irish army. Cuchulain recognizes him as a friend from the Sidhe. The man
    is Lugh of the Long Hand, who tells Cuchulain to sleep while he keeps watch for
    three days and three nights. During Cuchulain's sleep, Lugh heals his wounds with
    Druid herbs. On waking, Cuchulain learns that the boy troop from Emain Macha fought
    the army and was destroyed. Lugh refuses to stay and fight, telling Cuchulain
    to continue the contest himself. Cuchulain orders Laeg to yoke the scythed chariot.
  language: English
  quote_policy: summarized
