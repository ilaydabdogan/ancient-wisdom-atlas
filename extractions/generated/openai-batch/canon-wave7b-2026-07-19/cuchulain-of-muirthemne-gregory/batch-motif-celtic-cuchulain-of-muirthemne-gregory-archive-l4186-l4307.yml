canonical_text:
  quote: ''
  summary: 'Ingcel reports sights inside Da Derga’s Inn: Taulchinne the juggler fails
    at his feats after a hostile gaze and warns of danger, while Conaire recalls an
    ominous dream. Ingcel then describes Conaire’s royal beauty and regalia, and Ferogain
    identifies him as the High King whose anger could hold the Inn unless drink should
    fail him. The outlaws advance; Lomna Druth breaks in first and is beheaded as
    foretold. Battle follows, the Inn is repeatedly fired and quenched, Conaire drives
    back the attackers, and the outlaws’ druids enchant him with great thirst. With
    all drink spent on the fires, Conaire sends Mac Cecht to find a drink; Mac Cecht
    leaves with Conaire’s golden cup and an iron spit, fighting through the outlaws.'
  language: English
  quote_policy: summarized
