canonical_text:
  quote: ''
  summary: At the ford, Cuchulain and Ferdiad, described as two chief champions, fight
    because of the stirring up of Aileli and Maeve. They throw weapons from morning
    to midday. Cuchulain repeatedly leaps onto Ferdiad's shield to strike him, but
    Ferdiad throws him off. Laeg taunts Cuchulain, after which Cuchulain leaps again
    and his anger brings on fiery hero-light and a godlike appearance. The close combat
    damages shields and spears, draws screams from supernatural beings, drives the
    river out of its bed, and frightens horses and camp followers. Ferdiad wounds
    Cuchulain with a sword, reddening the ford with Cuchulain's blood; Cuchulain then
    calls to Laeg for the Gae Bulg, which is sent downstream and caught with his foot.
  language: English
  quote_policy: summarized
