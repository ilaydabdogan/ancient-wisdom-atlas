canonical_text:
  quote: ''
  summary: Buan follows Cuchulain's chariot, falls, dies, and gives her name to Buan's
    Grave. Conall and Cuchulain return to Cruachan, where they are being mourned as
    dead because of Laegaire's report. Ailell fears giving judgment in the dispute
    over the Champion's Portion, while Maeve takes control, compares the warriors
    by metals, and privately gives Laegaire, Conall, and Cuchulain separate cups and
    assurances of the Championship. Cuchulain resists a summons by striking the messenger
    with a chessman, then is coaxed by Maeve's embrace and praise and receives a gold
    cup.
  language: English
  quote_policy: summarized
