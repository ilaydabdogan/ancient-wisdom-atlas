canonical_text:
  quote: ''
  summary: The passage explains a sequence of riddling place-names. It recounts an
    injured woman pursued by water, names places by animal and royal associations,
    links Ange to the Tuatha De Danaan washing horses after Magh Tuireadh, describes
    Mann making underground spells to avert cattle plague, tells how Ruad was drawn
    under the sea by nine women and later lost his son by a sea-woman, and identifies
    Tailne with Lugh's kingship feast after Magh Tuireadh.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An injured woman runs from a dun to the sea, and water follows her wherever
    she runs; successive names are given to the water or route, including Segain,
    River Segsa, Boinne, Arcait, and Marrow of the Woman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The riddle phrase 'The Boar and his Dam' is explained as the area between
    Cleitech and Fessi; Cleitech is said to mean both boar and king, while Fessi is
    named as a great sow.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cerna is explained as the place where Enna Aignech killed Cerna, king of Ana,
    on a hill and killed Cerna's steward east of that place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ange is explained as the place where the men of Dea or Tuatha De Danaan washed
    their horses after the battle of Magh Tuireadh.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mann the farmer is said to have made spells in large four-cornered underground
    chambers to keep plague away from the cattle of Ireland during the time of Bresel
    Brec.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ruad, son of Rigdond of Munster, sets out with three ships containing thirty
    men each, but the ships are stopped and held from below in the middle of the sea;
    throwing jewels and precious things into the sea does not release them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Lots are cast to choose who should enter the sea; the lot falls on Ruad, who
    leaps in, the sea closes over him, and he comes to a large plain where nine beautiful
    women meet him and confess that they stopped the ships so he would come to them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ruad stays with the nine women for nine days, receives nine vessels of gold,
    and his men remain unable to proceed because of the women's power; one woman says
    she will bear him a son and tells him to return for the child.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After seven years Ruad's party returns by another route, but sea-women come
    in a brazen ship, set the boy ashore, and the boy slips on rocks and dies; the
    women cry 'Olbine,' glossed as 'Great Crime,' giving the place-name Ailbine.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Tailne is explained as the place of a great feast given to Lugh, son of Ethlenn,
    after the battle of Magh Tuireadh, described as his wedding feast of kingship.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Forgall Manach is identified as the sister's son of Tethra, king of the Fomor,
    in connection with the phrase about the Garden of Lugh and the daughters of Tethra's
    nephew.
  category: relationship
  evidence_refs:
  - ev:10
