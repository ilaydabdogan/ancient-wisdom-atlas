canonical_text:
  quote: '"Men are being killed, women brought away, cattle brought away in Ulster."'
  summary: Sualtim warns at Emain that Ailell and Maeve are carrying off Ulster’s
    people and cattle while Cuchulain alone delays the provinces. Cathbad reacts angrily,
    but Conchubar and the men of Ulster affirm the truth of the report. Sualtim is
    accidentally beheaded when the Grey of Macha rears and his shield strikes him;
    the horse returns with the shield dragging Sualtim’s head, which repeats the warning.
    Conchubar swears by sky, earth, and sea to restore every cow and woman, summons
    Ulster, and leads the recovered host. Conchubar and Celthair kill enemy captors
    and free Ulster women. In the Irish camp, Cormac Conloingeas and Dubthach wake
    from warning dreams of imminent battle.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Sualtim goes to the Stone of the Hostages at Emain and calls out his warning
    for the third time; Cathbad asks who has been taken and who is taking them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sualtim identifies Ailell and Maeve as robbing and destroying Ulster and says
    they are taking women, little boys, cattle, and horses.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sualtim says only Cuchulain is delaying and hindering the four great provinces
    of Ireland in the gaps and passes of Conaille Muirthemne.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Cathbad is vexed at being woken and says a man who scolds at the king in this
    way has a right to be put to death; Conchubar and the men of Ulster say Sualtim
    is speaking truth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sualtim turns away in anger; the Grey of Macha rears, and the sharp edge of
    Sualtim’s shield cuts off Sualtim’s head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Grey of Macha returns to Emain dragging the shield, with Sualtim’s head
    in its hollow, and the head repeats the warning about killings, women, and cattle
    in Ulster.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Conchubar swears by the continuing order of sky, earth, and sea that he will
    bring every cow back to its shed and every woman back to her dwelling-house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Conchubar orders Finnched son of Troiglethan to call out the men of Ulster,
    and, while still affected by sleep and weakness, tells him to call both the dead
    and the living.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The men of Ulster rise out of weakness, prepare to come out with Conchubar,
    and some set out after the army of Ireland without waiting for him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Conchubar and his men leave Emain, halt at Irard Cuillenn, and are told they
    are waiting for his sons Fiachna and Fiacha, who have gone to meet his grandson
    Erc.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Conchubar refuses further delay because the men of Ireland do not yet know
    that he has risen from weakness or even that he is alive.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Conchubar, Celthair, and thirty hundred chariot-fighters meet eight times
    twenty men of Ailell and Maeve, each taking away an Ulster woman; Conchubar and
    Celthair behead the captors and free the women.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: At Sleamhain of Meath, Cormac Conloingeas and Dubthach wake from sleep and
    each says a warning dream has come, foretelling a terrible battle and a great
    clashing of shields.
  category: speech
  evidence_refs:
  - ev:9
