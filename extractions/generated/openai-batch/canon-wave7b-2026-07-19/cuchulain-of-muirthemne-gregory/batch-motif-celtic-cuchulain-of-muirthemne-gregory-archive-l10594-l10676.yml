candidate_motifs:
- id: motif:1
  label: Repeated public warning at a royal center
  taxonomy_refs: []
  basis: Sualtim repeats the alarm at Emain before Cathbad and reports the raid on
    Ulster.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage begins mid-message, so earlier repetitions are only partially
    represented in the supplied excerpt.
- id: motif:2
  label: Threatened or disregarded warning-bearer
  taxonomy_refs: []
  basis: Cathbad, angered at being awakened, responds to Sualtim’s warning by saying
    such a man deserves death, though Conchubar affirms the report.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The warning is not fully rejected, since Conchubar and the Ulster men
    immediately affirm it.
- id: motif:3
  label: Severed head continues the message
  taxonomy_refs: []
  basis: After Sualtim is beheaded, his head is carried in the shield and repeats
    the same warning to Emain.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives this as a literal event within the narrative; no external
    comparison is asserted.
- id: motif:4
  label: Royal oath by cosmic order
  taxonomy_refs:
  - royal_legitimacy
  basis: Conchubar, the king, invokes sky, earth, and sea while swearing to restore
    stolen cattle and women.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The royal_legitimacy reference is broad; the passage shows a kingly oath
    and restoration promise but does not explicitly discuss legitimacy.
- id: motif:5
  label: Return to action after weakness
  taxonomy_refs:
  - return
  basis: Conchubar and the men of Ulster are described as still affected by weakness,
