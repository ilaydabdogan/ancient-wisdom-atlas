canonical_text:
  quote: ''
  summary: Ferb laments the dead Maine Morgor and the young men of Connaught. Fiannamail,
    the innkeeper's son, arrives, learns of Maine's death, goes to seek satisfaction,
    and dies fighting Niall and his men. Ferb continues keening the dead. Donall Dearg
    arrives, is urged by Ferb to avenge Maine, vows revenge against Conchubar and
    Ulster, and is killed by Feradach. Ferb returns to Maine's body and speaks of
    grief and loss.
  language: English
  quote_policy: summarized
