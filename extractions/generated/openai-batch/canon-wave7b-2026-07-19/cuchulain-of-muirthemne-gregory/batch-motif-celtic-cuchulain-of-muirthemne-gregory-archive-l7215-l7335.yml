  evidence_refs:
  - ev:2
- id: obs:3
  text: Fiannamail asks whether Maine is living, and Ferb says it is bitter to be
    asked because Maine's last bed is there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ferb says Conchubar and Brod are the only remaining members of the Ulster
