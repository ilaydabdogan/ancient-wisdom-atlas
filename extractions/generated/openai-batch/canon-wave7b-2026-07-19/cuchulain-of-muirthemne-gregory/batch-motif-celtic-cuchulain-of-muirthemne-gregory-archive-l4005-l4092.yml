    He describes a royal house and its occupants, including Cormac Conloingeas with
    nine comrades, three young sons of the king, and another fair armed man. Ferogain
    identifies several figures and predicts slaughter; Lomna Druth urges against the
    attack and foretells severed heads, while Ingcel refuses to withdraw.
