canonical_text:
  quote: ''
  summary: Cuchulain swears he will defeat Ferdiad. Ferdiad tells his people that
    Maeve has bound him to fight Cuchulain and that he has secured sureties for Maeve's
    promises. Ferdiad's people fear one of the two warriors will die. During the night
    Ferdiad wakes, orders his driver to prepare the chariot, rejects the driver's
    warnings, and sets out for the ford. At the ford he rests on chariot skins and
    cushions. Cuchulain rises only after full daylight, Laeg has the chariot ready,
    and supernatural beings shout around Cuchulain. Ferdiad's driver hears Cuchulain
    approaching and wakes Ferdiad.
  language: English
  quote_policy: summarized
