canonical_text:
  quote: "“And this was the cause of the great war for the Brown Bull of Cuailgne.”"
  summary: Mac Roth asks Daire for the loan of the Brown Bull of Cuailgne on Maeve’s
    behalf. Daire first agrees and feasts the messengers, but drunken boasts by the
    visitors are reported to him by his steward. Offended, Daire withdraws the promise.
    Mac Roth reports the refusal to Maeve, who decides to take the bull by force and
    summons armed allies.
