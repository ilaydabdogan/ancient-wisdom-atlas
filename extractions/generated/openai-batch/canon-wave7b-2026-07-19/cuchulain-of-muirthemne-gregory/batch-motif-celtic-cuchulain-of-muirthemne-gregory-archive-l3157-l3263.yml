canonical_text:
  quote: ''
  summary: Curoi enchants the dun so that it turns at night and cannot be entered.
    Laegaire, Conall, and Cuchulain take the watch in turn. Laegaire and Conall are
    defeated by a giant shadow from the western sea. Cuchulain, on the third night,
    kills three groups of nine grey shapes, slays a great worm from the lake, defeats
    the giant shadow, leaps back over the wall, and is recognized by Blanad as triumphant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Curoi makes a spell over the dun every night so that it turns like a mill
    and no entrance can be found after sunset.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The watch is taken according to age: Laegaire first, Conall second, and Cuchulain
    third.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Laegaire sees a great shadow coming from the sea westward; it takes the shape
    of a giant reaching up to the sky, with the shining sea visible between its legs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The giant carries objects like stripped oaks or beams and throws them at Laegaire;
    Laegaire throws a spear, but neither side hits at first.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The giant reaches across three ridges, grips Laegaire, turns him in its hands,
    and throws him half dead over the wall into mud.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Conall takes the second watch, and the same events happen to him as happened
    to Laegaire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cuchulain sees nine grey shapes coming over the marsh in the moonlight, challenges
    them, kills them, and then kills two more groups of nine, making a heap of their
    heads and arms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Cuchulain hears a heavy sea-like sound from the lake and sees a great worm
    rise from the lake, lift itself over him, and move toward the dun with a mouth
    large enough to hold a house.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Cuchulain leaps to the worm's head, tears out its heart, cuts the body to
    pieces, and brings its head to the heap of skulls.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Near daybreak, the great shadow shaped like a giant comes again from the sea;
    it speaks with Cuchulain, throws beams that miss, and reaches to grip him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Cuchulain uses his salmon leap with a drawn sword against the giant, brings
    it down, and the giant says, "Life for life, Cuchulain," before vanishing.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Cuchulain tries twice and fails to leap over the fort wall, then succeeds
    through anger and courage, landing at the door of the house.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Blanad says Cuchulain's sigh is not that of a beaten man but a conqueror's
    sigh of triumph, and she knows what he has gone through that night.
  category: speech
  evidence_refs:
  - ev:11
