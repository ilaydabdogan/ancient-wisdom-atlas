canonical_text:
  quote: ''
  summary: Etarcomal returns to challenge Cuchulain, declaring he will not go back
    without Cuchulain's head. Cuchulain arms himself but says he is reluctant to fight
    someone who came under Fergus's protection. He gives Etarcomal two non-lethal
    warning strokes, first cutting the sod from under his feet and then cutting off
    his hair without drawing blood. Etarcomal still refuses to withdraw, and Cuchulain
    kills him. Fergus at first reproaches Cuchulain because Etarcomal was under his
    protection, but after hearing the chariot-driver's account he says Cuchulain is
    not to blame. Fergus drags Etarcomal's body to the camp and presents it before
    Ailell and Maeve as a warning. The next day the men of Ireland choose Natchrantal
    to go against Cuchulain; Natchrantal brings only hardened holly rods. Cuchulain,
    hunting wild birds for food, ignores him, and Natchrantal boasts that Cuchulain
    has fled. Fergus sends Fiacha to reproach Cuchulain, who answers that he does
    not wound chariot-drivers, messengers, or unarmed men, and invites Natchrantal
    to come armed the next morning.
  language: English
  quote_policy: summarized
