canonical_text:
  quote: ''
  summary: Conaire is raised among three households with foster-brothers. After King
    Eterscel dies, a bull feast at Teamhair is prepared to identify the best man for
    kingship. A white bull is killed; one man eats its meat and broth, sleeps under
    a truth charm spoken by Druids, and dreams of the future king. The dream shows
    a naked young man with a sling-stone on the road to Teamhair. Conaire, while on
    his way toward the feast, pursues white speckled birds to the sea; they shed birdskins
    and become armed men. Nemglan protects him, identifies himself as king of Conaire’s
    father’s birds, reveals a command not to cast at birds, tells Conaire he will
    be made king through the bull feast, and gives him a list of geasa. Conaire then
    sets out for Teamhair naked with a stone in his sling.
  language: English
  quote_policy: summarized
