canonical_text:
  quote: ''
  summary: Fergus refuses to visit Cuchulain unless Ailell and the others swear to
    keep their agreement. Etarcomal, the young foster-son of Maeve and Ailell, follows
    Fergus despite a warning that pride may cause misfortune. Fergus reaches Cuchulain
    between Ochain and the sea, where Laeg describes the arriving armed man. Fergus
    conveys that the men of Ireland accept Cuchulain's terms and will send one champion
    each day to fight him alone. After Fergus leaves, Etarcomal stares at Cuchulain,
    taunts him, and promises to be the first champion; his chariot-driver warns that
    he cannot defeat Cuchulain, and Etarcomal orders the chariot turned back.
  language: English
  quote_policy: summarized
