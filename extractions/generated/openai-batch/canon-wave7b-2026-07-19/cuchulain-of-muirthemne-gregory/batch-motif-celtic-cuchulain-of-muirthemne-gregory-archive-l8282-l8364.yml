- id: motif:2
  label: supernatural warning to a threatened animal
  taxonomy_refs: []
  basis: The Morrigu, identified as the War-goddess and Battle Crow, warns the Brown
    Bull that the men of Ireland will try to drive him away, and the bull withdraws
    with heifers.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No available taxonomy ref exactly matches this warning pattern.
- id: motif:3
  label: mistaken identity through royal covering
  taxonomy_refs: []
  basis: Cuchulain sees Maeve's woman wearing Maeve's golden covering, thinks she
    is Maeve, kills her, and breaks the covering.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not state that the covering was intended as a disguise.
- id: motif:4
  label: flood as obstacle to an army
  taxonomy_refs: []
  basis: The river in flood delays the army, sweeps away crossing chariots, and carries
    off Uala when he tests the depth.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: Although the passage includes a flood, it does not include renewal, so
    the available 'flood_and_renewal' taxonomy ref is not applied.
- id: motif:5
  label: landscape named from martial disgrace
  taxonomy_refs: []
  basis: When no man will face Cuchulain, Maeve makes the army cut through a mountain
    so it will remain a disgrace to Ulster; the place is named Berna Ulaid, the Gap
    of Ulster.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The explanation is etiological within the passage, but broader place-name
    tradition is not assessed here.
- id: motif:6
  label: single warrior terrifies an army
  taxonomy_refs: []
  basis: The men of Ireland fear Cuchulain, avoid going out alone, and refuse Maeve's
