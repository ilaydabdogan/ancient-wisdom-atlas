canonical_text:
  quote: ''
  summary: The passage describes Etain’s beauty and Sidhe origin, her marriage to
    King Eochaid, her abduction by Midhir and recovery, and the Sidhe revenge on Eochaid’s
    house. It then follows a female descendant who is ordered killed because she is
    not a son, spared by servants, hidden and fostered by cowherds, discovered by
    King Eterscel’s people, and visited by a bird who sheds its birdskin and appears
    as a man. The man says she will bear him a son named Conaire and that no bird
    must be killed by him.
  language: English
  quote_policy: summarized
