canonical_text:
  quote: ''
  summary: Naoise turns back at Deirdre's cry, meets and loves her, and carries her
    away with his brothers and a large company despite warnings of harm. The fugitives
    move through Ireland, face Conchubar's devices and a Druid-raised wood, then sail
    to Alban. In Scotland they enter the king's friendship, but Deirdre's beauty prompts
    concealment, discovery by the steward, a secret summons from the king, and attempts
    to have the sons of Usnach killed in battle. They survive and later dwell by Loch
    Eitche or Loch Ness in relative peace, while Naoise appears splendidly dressed
    at court.
  language: English
  quote_policy: summarized
