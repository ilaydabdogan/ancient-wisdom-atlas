- id: obs:3
  text: Angus reaches out to take the young girl's hand, but she vanishes, and in
    the morning there is no trace or news of her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the next night the young girl appears again carrying a little harp, plays
