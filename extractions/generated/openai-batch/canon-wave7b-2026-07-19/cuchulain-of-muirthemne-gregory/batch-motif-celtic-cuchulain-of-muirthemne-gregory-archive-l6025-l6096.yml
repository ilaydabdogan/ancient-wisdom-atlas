canonical_text:
  quote: ''
  summary: Angus, son of the Dagda, sees a beautiful young woman in sleep; she vanishes
    before he can touch or speak to her. She returns nightly for a year with a harp,
    then ceases coming, and Angus wastes away from love. Fergne diagnoses the sickness
    as mental lovesickness, tells Boann to search Ireland for the woman, and after
    the search fails advises consulting the Dagda and then Bodb, a Sidhe king known
    for knowledge.
  language: English
  quote_policy: summarized
