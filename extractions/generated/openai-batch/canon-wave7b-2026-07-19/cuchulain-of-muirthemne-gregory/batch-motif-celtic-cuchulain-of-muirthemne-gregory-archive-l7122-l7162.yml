canonical_text:
  quote: ''
  summary: The passage describes an ornate house filled with vessels, cups, cowhorns,
    and decorated hangings. Two armies meet and fight inside it. Cobthach kills many
    of the Fomor and defeats Berngal Brec. Maine kills Buri, enters a raging state,
    kills thirty more men, wounds Conchubar with spears, and disables Brod. Conchubar
    then kills Maine and attacks the remaining crowd until nearly all are dead; only
    Conchubar and Brod remain alive among Conchubar's party, both wounded. Conchubar
    then drives Cobthach out of the house, while Ferb approaches the place where Maine
    is.
  language: English
  quote_policy: summarized
