  summary: Cuchulain, already near death, kills a threatening druid, is mortally wounded
    by Lugaid's spear, seeks water, returns to face his enemies, ties himself to a
    pillar-stone to die standing, is defended by the Grey of Macha, and is finally
    beheaded; his falling sword cuts off Lugaid's right hand, and his head is taken
    away.
