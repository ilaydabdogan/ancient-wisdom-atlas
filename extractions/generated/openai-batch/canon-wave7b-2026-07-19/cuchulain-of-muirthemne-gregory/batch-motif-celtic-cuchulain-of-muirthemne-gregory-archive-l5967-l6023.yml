canonical_text:
  quote: ''
  summary: Cathbad curses Emain Macha so that Conchubar's descendants will not hold
    the kingdom. The curse is said to come true as Conchubar's sons die and Cormac
    Conloingeas is summoned as successor. On his journey Cormac encounters a red woman
    washing chariot gear at a ford and a girl who warns him to turn back. He lodges
    at the House of the Two Smiths, where Connaught men attack. Craiftine, jealous
    of Cormac, plays a sleepy tune on his harp, and Cormac and most of his followers
    are killed. Amergin makes Cormac's grave and mound, giving the place its name.
  language: English
  quote_policy: summarized
