canonical_text:
  quote: ''
  summary: At Bricriu's feast, the Champion's Portion is to be given to the best hero
    of Ulster. Rival claims are made for Laegaire, Conall, and Cuchulain, leading
    to armed fighting until Conchubar and Fergus intervene at Sencha's urging. Sencha
    advises dividing the portion for the night and later seeking Ailell's judgment
    at Cruachan. After the feast resumes, Bricriu watches from an upper room and begins
    trying to stir quarrels among the women, first by flattering Fedelm and promising
    precedence if she enters the hall first.
  language: English
  quote_policy: summarized
