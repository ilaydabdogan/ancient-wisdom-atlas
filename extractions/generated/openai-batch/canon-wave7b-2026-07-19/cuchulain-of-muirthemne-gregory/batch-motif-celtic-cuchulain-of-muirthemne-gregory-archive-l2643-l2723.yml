canonical_text:
  quote: ''
  summary: Laegaire is urged to go first and sets out by chariot, followed by Conall
    and other Ulster chiefs. Cuchulain remains behind performing feats for the women
    of Ulster until Laeg reproaches him and yokes his chariot. Cuchulain's horses
    carry him fast enough to catch the others before Cruachan. The troop's arrival
    shakes Cruachan and sounds like thunder without clouds. Maeve sends Findabair,
    who has bird's sight, to look from a high room; Findabair describes an approaching
    ornate chariot, its horses, and its armed rider.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Conall tells Laegaire to go first; Laegaire answers that he is good at crossing
    fords and facing spears, but asks not to be put beside chariot kings until he
    has practised difficult chariot passages and races.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Laegaire has his chariot yoked, leaps into it, and drives across a named route;
    Conall Cearnach and many chief men of Ulster follow him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cuchulain stays behind the others and amuses the women of Ulster with nine
    feats using apples, nine using spears, and nine using knives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cuchulain takes three times fifty needles from the women, throws them so that
    each needle enters the eye of another and they are joined together, then returns
    each needle to its owner.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Laeg, son of Riangabra, looks for Cuchulain, reproaches him, says the Champion's
    Portion is lost to him, and Cuchulain tells Laeg to yoke the chariot.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After Laeg rouses him, Cuchulain travels very fast with the Grey of Macha
    and the Black Sainglain drawing his chariot, and catches the others before they
    reach Cruachan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The troop's speed and noise cause Cruachan to shake, arms to fall from racks,
    and the people in the dun to tremble.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Maeve says she has never before heard thunder when there were no clouds in
    the sky.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Findabair, daughter of Ailell and Maeve, has bird's sight and goes to a sunny
    parlour over the great door of the fort to report what is coming.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Findabair reports a chariot coming over the plain and describes its matching
    fiery dappled grey horses, fine wooden and wicker chariot, silver ornaments, black
    wheels, yellow reins, and a large armed man with reddish yellow hair, a forked
    beard, a purple and gold coat, a bronze shield, a five-pronged javelin, and a
    feather cover over his head.
  category: speech
  evidence_refs:
  - ev:8
