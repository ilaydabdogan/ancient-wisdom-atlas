  quote: ''
  summary: A meeting at Teamhair seeks someone to receive the High Kingship of Ireland
    after the death of Conaire. Named rulers gather at Cairbre Niafer's court and
    exclude the men of Ulster. A bull-feast, described as the same procedure used
    when Conaire was chosen, is prepared to discover the best candidate. The dreamer
    cries out in sleep and reports seeing a young strong man with two red stripes
    sitting above the pillow of a wasting man in Emain Macha.
