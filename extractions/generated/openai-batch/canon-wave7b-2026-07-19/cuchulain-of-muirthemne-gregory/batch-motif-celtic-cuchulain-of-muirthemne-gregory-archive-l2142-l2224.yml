canonical_text:
  quote: "“That is the Champion's Portion of my house.”"
  summary: Bricriu describes an elaborate Champion's Portion and separately flatters
    Laegaire, Conall, and Cuchulain so that each may claim it. Laegaire and Cuchulain
    threaten violence over the portion, while Bricriu leaves as though he had not
    stirred up a quarrel. The Ulster company enters the feast hall, takes ordered
    places, music is played, and Bricriu is ordered by his sureties to leave the hall.
  language: English
  quote_policy: quoted
