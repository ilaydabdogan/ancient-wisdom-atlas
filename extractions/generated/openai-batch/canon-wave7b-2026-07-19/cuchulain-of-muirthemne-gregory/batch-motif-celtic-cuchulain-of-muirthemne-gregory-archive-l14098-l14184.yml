canonical_text:
  quote: ''
  summary: Cuchulain slaughters enemies on the plain of Muirthemne. Druids repeatedly
    demand his spear while threatening dishonor to him or Ulster if he refuses. Cuchulain
    throws the spear at the demanders, killing them, after which opposing warriors
    recover and throw the spear. Lugaid's throw kills Laeg, Cuchulain's chariot-driver.
    Ere's throw wounds the Grey of Macha, who departs to the grey pool of Glas-linn.
    The excerpt ends as another spear demand begins.
  language: English
  quote_policy: summarized
