canonical_text:
  quote: ''
  summary: 'Cuchulain wounds one of two birds over the sea and discovers two women
    in their place: Devorgill, who had come seeking him, and her maid. After drawing
    the stone and blood from Devorgill''s wound with his mouth, he says she cannot
    be his wife because he has drunk her blood, and gives her to Lugaid. Cuchulain
    then attacks Forgall''s stronghold, carries off Emer, her foster-sister, and treasure,
    defeats pursuers at several fords whose names are explained by the events, reaches
    Emain Macha, receives headship among the young men of Ulster, and takes Emer as
    his wife.'
  language: English
  quote_policy: summarized
