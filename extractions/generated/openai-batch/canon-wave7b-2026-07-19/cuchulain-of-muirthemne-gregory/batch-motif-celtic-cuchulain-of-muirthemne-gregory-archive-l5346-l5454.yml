canonical_text:
  quote: ''
  summary: Levarcham urges the sons of Usnach and Fergus's children to secure the
    house and defend their charge until Fergus returns. She then tells Conchubar that
    the sons of Usnach have come to him, but reports that Deirdre has lost her former
    beauty. Conchubar later sends Gelban to verify Deirdre's appearance. Gelban looks
    through an accidentally open window; Deirdre blushes and tells Naoise, who throws
    a chessman and blinds Gelban in one eye. Gelban returns and praises Deirdre's
    beauty, provoking Conchubar's jealousy. Conchubar orders an attack on the House
    of the Red Branch with fire. Fair-Haired Iollan invokes Fergus's pledge, while
    Rough-Red Buinne first fights the attackers and then accepts Conchubar's reward
    to stop. The reward-land becomes a barren mountain named for Buinne's share. Iollan
    vows not to forsake the sons of Usnach while his sword remains in his hand.
  language: English
  quote_policy: summarized
