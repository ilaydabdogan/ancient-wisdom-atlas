canonical_text:
  quote: ''
  summary: Cuchulain remains eager to rush toward battle sounds despite attempts to
    restrain him. Cathbad, Conchubar, Emer, Niamh, druids, women, poets, and musicians
    try to keep him from hearing war cries and mocking voices until enchantments are
    spent and Conall Cearnach can arrive. Conchubar proposes taking him to Glean-na-Bodhar,
    the Deaf Valley, where no outside sound can be heard. Cathbad invites him under
    bonds to a feast; Cuchulain protests that Ulster is under attack. Emer appeals
    to him, Niamh kisses him three times, and he goes sorrowfully with them into the
    valley.
  language: English
  quote_policy: summarized
