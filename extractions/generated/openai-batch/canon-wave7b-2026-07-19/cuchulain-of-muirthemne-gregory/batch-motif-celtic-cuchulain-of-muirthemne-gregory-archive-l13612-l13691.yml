canonical_text:
  quote: ''
  summary: Cuchulain is brought to Emain Macha and kept in the sunny house of the
    Red Branch, where music, feasting, and pleasant speech are used to quiet him.
    Conchubar orders Cathbad, the learned men, and the women to guard him from Maeve's
    plans and the power of Calatin's children, because Ulster's safety depends on
    him. The men of Ireland ravage Muirthemne, while the three daughters of Calatin
    come to Emain and use witchcraft to create the appearance and sounds of armies
    attacking. Cuchulain sees and hears the illusions, tries to take up his sword,
    and is restrained and warned that the sight is enchantment meant to lure him to
    death. On the next day he sees further apparitions, hears the music of the Sidhe,
    understands his time is near, and one daughter of Calatin appears as a crow and
    mocks him, urging him to go out.
  language: English
  quote_policy: summarized
