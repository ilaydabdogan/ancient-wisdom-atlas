canonical_text:
  quote: ''
  summary: In the passage, Deirdre speaks of seeing Conchubar asking for blood, Fergus
    caught in hidden lies, and herself crying. Fergus dismisses women’s dreams and
    urges acceptance of Conchubar’s friendly message. Naoise agrees to go with Fergus
    to Ireland, and Fergus promises protection. They travel to the ships and go out
    on the sea with many of their people. Deirdre looks back at Alban and laments
    leaving its harbours, plains, hills, and named places, saying she would not have
    left except that she came with Naoise.
