canonical_text:
  quote: ''
  summary: Conaire reaches Da Derga's Inn with his company and other unusual companions.
    Da Derga welcomes him. After evening, a lone woman appears at the door, gives
    a death prophecy against Conaire and his company, and asks to enter. Conaire says
    he is under bonds not to admit a lone woman after sunset, but he lets her in when
    she challenges his hospitality. Meanwhile outlaws see the great light from the
    Inn, identify it as Conaire's fire, debate the attack in terms of reciprocal spoil,
    make a cairn of stones to count future losses, and agree to send a spy.
  language: English
  quote_policy: summarized
