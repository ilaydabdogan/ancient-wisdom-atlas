- id: obs:1
  text: Unnamed observers identify a high-status travelling party, with horses of
    a good lord, as Conaire son of Eterscel and many men of Ireland.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A group brings boats to shore and lands on the strand of Furbuithe.
  category: action
  evidence_refs:
