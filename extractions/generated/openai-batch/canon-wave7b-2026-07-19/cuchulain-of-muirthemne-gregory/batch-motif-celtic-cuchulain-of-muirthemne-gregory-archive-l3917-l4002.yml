- id: obs:4
  text: Conaire and his people enter the Inn and take seats; the three Red Men and
    the Man of the Wood, a swineherd of the Sidhe with a squealing pig, sit with them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Da Derga comes to Conaire with three times fifty fighting men described as
    having long hair, short cloaks, and iron-banded blackthorn sticks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Da Derga welcomes Conaire and says there would be welcome for all the men
    of Ireland if Conaire brought them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After evening, a lone woman comes to the door of the Inn with long hair, a
    grey woollen cloak, and a mouth drawn to one side of her head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The lone woman leans against the doorpost and throws an evil eye on the king
    and the young men around him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Conaire asks the woman what she sees for them if she has Druid sight.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The woman foretells that none of Conaire's skin or flesh will escape the place
    except what birds carry away in their claws, and she asks to enter the house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Conaire says he is under bonds not to let one woman alone into the house after
    sunset and orders food from his own table to be brought to her while she stays
    elsewhere.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The woman says that if the king's hospitality is gone and he has no room for
    one lone woman, she will seek food and lodging from a better man.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Conaire orders that the woman be let in despite his bonds, and the people
    inside feel uneasy after her words.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The outlaws travel toward the Inn and stop at Leccaibcend Slebe.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The outlaws see a great light shining from the Inn through the wheels of chariots
    outside the doors.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:16
  text: Ferogain identifies the light as probably the fire of Conaire the High King
    and says he would be glad if Conaire were not there that night.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: Ingcel says Conaire's presence would be good luck for him and frames the matter
