- id: obs:5
  text: The comparison of cattle is equal except for one bull, Fionnbanach, the White-horned.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fionnbanach was calved in Maeve's herd but went into Ailell's herd and stayed
    there; the passage says he did not think it fitting to be under the rule of a
    woman.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Maeve is greatly vexed when she sees that Fionnbanach is better than any bull
    of her own, and she calls Mac Roth to find a bull as good as the White-horned
    in Ireland.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Mac Roth says Donn Cuailgne, the Brown Bull of Cuailgne, at Daire son of Fachtna's
    house, is twice as good as Fionnbanach.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Maeve instructs Mac Roth to ask Daire for a one-year loan of Donn Cuailgne,
