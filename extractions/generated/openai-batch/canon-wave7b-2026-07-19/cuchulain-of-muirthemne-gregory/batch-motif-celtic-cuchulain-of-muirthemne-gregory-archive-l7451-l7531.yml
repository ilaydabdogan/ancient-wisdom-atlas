canonical_text:
  quote: ''
  summary: Maeve and Ailell dispute rule, lineage, marriage, and relative wealth.
    They order their possessions compared; household goods, ornaments, clothing, and
    livestock are equal until Ailell's herd is found to include Fionnbanach, the White-horned
    bull, formerly calved in Maeve's herd. Maeve sends the herald Mac Roth to locate
    an equal or better bull. Mac Roth names Donn Cuailgne, the Brown Bull of Cuailgne,
    at Daire's house. Maeve instructs him to request the bull as a one-year loan with
    substantial compensation, and Mac Roth departs with nine men.
  language: English
  quote_policy: summarized
