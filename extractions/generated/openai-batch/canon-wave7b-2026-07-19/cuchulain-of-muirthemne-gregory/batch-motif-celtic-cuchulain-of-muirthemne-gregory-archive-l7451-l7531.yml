  text: Ailell says he did not take kingship through Maeve's right but through the
    right of his mother, Mata of Murrisk, daughter of Magach.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maeve says her riches are greater than Ailell's; Ailell denies this and says
    his jewels, riches, and treasure are unsurpassed in Ireland.
  category: speech
  evidence_refs:
