canonical_text:
  quote: '"it would be better for you to refuse the feast than to forsake the sons
    of Usnach."'
  summary: Deirdre laments former places and says she left only with her beloved.
    At Dun Borach, Borach greets Fergus and the sons of Usnach, then binds Fergus
    by geasa to remain for a feast. Fergus is angered because Conchubar had required
    him to send the sons of Usnach to Emain Macha immediately on arriving in Ireland.
    Fergus sends his own two sons with them instead. Deirdre advises waiting at Rechrainn
    until Fergus is free, but Naoise refuses, and Deirdre laments that Fergus has
    forsaken them for a feast and that her companions' end has come.
  language: English
  quote_policy: quoted
