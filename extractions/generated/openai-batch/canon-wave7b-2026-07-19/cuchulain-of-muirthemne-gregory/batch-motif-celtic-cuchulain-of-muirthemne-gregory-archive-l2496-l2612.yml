canonical_text:
  quote: ''
  summary: A geis binds the men of Ulster not to eat, drink, or sleep until a crooked
    house is restored. The men fail, but Cuchulain, after anger and the shining of
    his hero light, straightens it. The feast resumes; women praise their men and
    Sencha warns against word-fighting. Emer praises Cuchulain’s unique feats, Conall
    challenges him to display them, and Cuchulain refuses because he is exhausted
    from wrestling the Grey of Macha from a lake and bringing it home. Bricriu calls
    for food and drink and the feast continues for three days and nights.
  language: English
  quote_policy: summarized
