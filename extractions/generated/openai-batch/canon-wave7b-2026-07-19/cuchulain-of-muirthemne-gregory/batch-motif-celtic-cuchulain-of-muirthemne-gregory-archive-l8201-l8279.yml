canonical_text:
  quote: ''
  summary: The passage summarizes several earlier deeds of Cuchulain, then narrates
    his obstruction of the Irish army with an Ogham-inscribed oak, his river combat
    with Fraech, the Sidhe women carrying Fraech's body away, Maeve's pursuit after
    her dog is killed, and Cuchulain sparing a Connaught chariot-driver who unknowingly
    asks him for help.
