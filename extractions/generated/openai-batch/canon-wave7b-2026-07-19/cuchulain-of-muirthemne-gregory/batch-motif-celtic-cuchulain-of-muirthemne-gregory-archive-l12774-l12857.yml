canonical_text:
  quote: "“they would not come together in their lifetime, but that after their death
    they would meet, and be happy for ever after.”"
  summary: The passage frames the story of Baile and Aillinn within the arrival of
    Conall Cearnach and companions at Dundealgan. Baile and Aillinn plan a meeting
    by the sea, but a strange man brings Baile false news of Aillinn's death and a
    prophecy that the lovers will meet only after death. Baile dies at the strand.
    The same man then tells Aillinn of Baile's death; she also dies. An apple-tree
    grows from Aillinn's grave and a yew-tree from Baile's grave. Cuchulain prepares
    a feast for the arriving guests.
  language: English
  quote_policy: quoted
