canonical_text:
  quote: ''
  summary: Cuchulain and Ferdiad continue their duel. Ferdiad says Maeve, not Cuchulain,
    betrayed him, and Cuchulain laments fighting him. They choose swords, fight from
    dawn until evening, and part sorrowfully. The next morning Ferdiad goes alone
    to the ford, expecting the battle to be decided, arms himself against the Gae
    Bulg, and displays new feats. Cuchulain arrives, instructs Laeg to reproach or
    praise him as needed to strengthen his anger or courage, arms himself, and chooses
    the ford feat, which Ferdiad regrets because Cuchulain is known to defeat opponents
    with it.
  language: English
  quote_policy: summarized
