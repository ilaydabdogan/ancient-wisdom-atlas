canonical_text:
  quote: ''
  summary: Cuchulain spares Larine but gives him a lasting punishment. Later Cuchulain
    and Laeg respond to a cry and meet a red-clad woman in a chariot, who offers Cuchulain
    love and protection. When he rejects her aid, she threatens to oppose him in many
    shapes; after he attacks, she vanishes and appears as a black crow, revealing
    herself as the Morrigu. Maeve then recruits challengers against Cuchulain, including
    Long and Loch, and uses Cuchulain's beardless youth as a pretext. Cuchulain smears
    blackberry juice on his face to look bearded, and Loch agrees to fight him at
    an upper ford.
  language: English
  quote_policy: summarized
