  text: Cuchulain and Laeg hear a great cry from the north or north-west; Laeg yokes
    horses to the chariot, and they go toward the sound.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: They meet a chariot with a red horse and a woman described with red eyebrows,
    red clothing, a long red cloak, and a grey spear on her back.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The woman says she is the daughter of King Buan and has come to offer Cuchulain
    her love because she has heard of his deeds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman says she has been protecting Cuchulain and will continue to help
    him; Cuchulain rejects reliance on a woman's protection in his present work.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Cuchulain rejects her help, the woman threatens to turn her help against
    him and to come against him in all shapes, by water and by land, when he fights
    a man as good as himself.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Cuchulain leaps at the chariot with his sword; the chariot, horse, and woman
    disappear, and he sees a black crow on a branch and recognizes that the Morrigu
    had been speaking with him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Loch, son of Mofebis, refuses to fight Cuchulain at first because Cuchulain
