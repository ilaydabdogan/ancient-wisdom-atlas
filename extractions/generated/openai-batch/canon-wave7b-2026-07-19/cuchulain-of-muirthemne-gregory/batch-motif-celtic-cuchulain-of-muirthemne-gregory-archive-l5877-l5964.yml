canonical_text:
  quote: ''
  summary: Deirdre laments the deaths of the sons of Usnach, refuses comfort and return
    to Emain Macha, obtains a carpenter's knife in exchange for Naoise's gold ring,
    and kills herself by the sea. Conchubar arrives with men to take her away but
    finds her dead, laments the deaths of his sister's children and Deirdre, and the
    bodies are buried with flagstones and Ogham names. Fergus later learns that his
    pledge to the sons of Usnach was broken, attacks Conchubar's house with allies,
    burns Emain Macha, and goes to Connaught to serve Ailell and Maeve against Ulster.
  language: English
  quote_policy: summarized
