canonical_text:
  quote: ''
  summary: Cuchulain explains riddling speech about rivers, battle-fierceness, guarded
    access to a woman, and a seasonal calendar from Samhain through Oimell, Beltaine,
    and Bron Trogain. Forgall later learns that Cuchulain and Emer spoke together
    in coded language and have fallen in love. He disguises himself as a foreigner,
    goes to Emain, praises Cuchulain, and advises that he seek Scathach in Alban for
    full warrior training, intending that the dangers of the journey prevent Cuchulain's
    return. Cuchulain prepares to set out for Alban, with Laegaire Buadach and Conall
    Cearnach offering to accompany him.
  language: English
  quote_policy: summarized
