canonical_text:
  quote: ''
  summary: Cuchulain visits Emer before leaving for Alban; they exchange promises
    of fidelity. In Alban, a vision raised by Forgall separates him from Laegaire
    and Conall. Cuchulain continues alone in search of Scathach. A lion-like beast
    carries him for four days to an island at the edge of human bounds. He receives
    hospitality from a young woman and then guidance from Eochu, who gives him a wheel
    and an apple to cross the Plain of Ill-Luck. He passes a valley of monsters and
    a wild mountain, reaching Scathach's scholars, who welcome him and say Scathach
    is on an island beyond.
  language: English
  quote_policy: summarized
