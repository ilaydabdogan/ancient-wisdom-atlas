  text: An unnamed man says there is no better chance to get a great name and do great
    deeds, proposes beginning a fight by himself, and crosses the river.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The army shouts around the unnamed man; he loses courage, turns to cross back,
    makes a false leap in the deepest water, and dies after a wave comes over him.
  category: sequence
  evidence_refs:
  - ev:1
