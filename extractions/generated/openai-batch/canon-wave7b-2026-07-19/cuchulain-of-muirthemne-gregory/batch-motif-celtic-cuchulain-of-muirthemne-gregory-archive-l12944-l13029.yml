canonical_text:
  quote: ''
  summary: An unnamed man attempts a lone crossing to begin a fight and dies in the
    river. Conchubar consults the men of Ulster, waits for reinforcements, and is
    joined by named leaders including Daire of Cuailgne, who seeks satisfaction for
    his bull and herds. Conchubar arms himself and Ulster advances across the Boinne
    into battle at Rosnaree. The Gailiana press hard; a few named fighters stand while
    young, inexperienced Ulster men flee. Conall Cearnach arrives in his chariot,
    rebukes the fleeing young men, and they return with him holding green oak branches.
  language: English
  quote_policy: summarized
