canonical_text:
  quote: Let Deirdre be her name ; harm will come through her.
  summary: After Cathbad's foreknowledge, Fedlimid's wife gives birth to a girl. Cathbad
    names the child Deirdre and prophesies that her beauty will bring conflict, exile,
    bloodshed, and death. Fedlimid arranges for Levarcham to raise Deirdre in a hidden
    house among the hills, where she lives unseen until age fourteen.
  language: English
  quote_policy: quoted
