canonical_text:
  quote: ''
  summary: Two rival swineherds test their powers by enchanting one another's swine
    so that the animals become lean and weak. After both are dismissed, they appear
    as two quarrelling ravens, transform back into men, warn that deaths and lamentation
    will come because of them, and then take the shapes of water beasts in rivers.
    As huge beasts they fight in the water with fiery sword-like flames seeming to
    come from their jaws, then return to human shape and say they must take new shapes
    again. The passage ends with the beginning of Bodb's friendly visit to Ochall.
  language: English
  quote_policy: summarized
