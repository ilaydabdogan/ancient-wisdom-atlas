canonical_text:
  quote: ''
  summary: Cuchulain is told that Scathach can be reached by a dangerous bridge that
    only a proven champion can cross. The bridge changes shape and has killed many
    kings' sons. After failing three times and being mocked, Cuchulain becomes angered,
    shines with hero-light, makes the hero's salmon leap, and crosses to the island
    of Scathach's house. Uacthach, Scathach's daughter, sees him, falls in love, and
    later opens the door and advises him. Cuchulain finds Scathach teaching her sons
    under a great yew-tree and compels her, at sword-point, to take him as pupil and
    teach him her skill in arms. The passage then shifts to Lugaid son of Ros seeking
    a wife and Forgall Manach telling him of an excellent unwed maiden in his house.
  language: English
  quote_policy: summarized
