canonical_text:
  quote: ''
  summary: Bricriu prepares an ornate hall and glass-windowed sunny parlour, invites
    Conchubar and the chief men of Ulster to a feast, threatens to create lethal strife
    if they refuse, accepts safeguards set by the Ulster council, then privately approaches
    Laegaire and urges him to seek the Champion's Portion, described with wine and
    a specially fed boar.
  language: English
  quote_policy: summarized
