canonical_text:
  quote: ''
  summary: A richly dressed troop is identified as including Cormac. Maeve's forces
    camp near the fords and rest at Cruachan before the march. Maeve asks a Druid
    to prophesy whether the army will win and return safely; the Druid says Maeve
    herself will return. On her way back, Maeve sees an unidentified young woman sitting
    on the chariot shaft, holding a white-bronze sword with red-gold rings and seeming
    to weave with it. Maeve asks what she is doing, and the woman begins to answer
    that she is looking into the future.
  language: English
