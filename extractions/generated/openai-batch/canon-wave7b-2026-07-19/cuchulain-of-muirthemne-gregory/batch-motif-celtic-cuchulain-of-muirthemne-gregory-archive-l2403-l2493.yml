canonical_text:
  quote: ''
  summary: In a verbal contest over precedence, Lendabair is associated with praise
    of Conall, and Emer claims superiority for herself and for Cuchulain. After the
    women’s speeches, Laegaire and Conall break a plank from the hall wall to admit
    their wives, while Cuchulain lifts part of the house wall so that sky and stars
    are visible and Emer enters with her attendants. Cuchulain then lets the wall
    fall, shaking and damaging the house and throwing Bricriu and his wife into the
    dirt among dogs; Bricriu laments having made the feast.
  language: English
  quote_policy: summarized
