canonical_text:
  quote: ''
  summary: The Connaught-led army encamps at Cuilsilinne. Maeve reviews the host and
    praises the Gailiana, the men of Leinster, for their discipline and speed in making
    camp. Because she will not have them boasted of before or to her, she says they
    must neither march on nor stay, but receive death and destruction from her. Fergus
    vows to defend them with the Ulster men, and he proposes dispersing the Gailiana
    among the other troops so that no more than five are together. Maeve accepts.
    The next morning the chiefs organize the army by separate leaders and roads and
    choose Fergus as overall guide because of his former kingship in Ulster.
  language: English
  quote_policy: summarized
