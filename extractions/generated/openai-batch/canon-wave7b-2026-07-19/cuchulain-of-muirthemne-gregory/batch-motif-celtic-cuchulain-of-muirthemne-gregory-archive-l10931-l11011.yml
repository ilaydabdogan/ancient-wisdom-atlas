canonical_text:
  quote: ''
  summary: Mac Roth reports several arriving companies, and Fergus identifies their
    leaders and Cuchulain's men from Muirthemne. Cuchulain lies wounded, tries to
    rise when he hears Ulster gathering, is restrained, is taunted by deceptive lamenting
    women, and hears the Morrigu's night cry of battle and ravens. At daybreak he
    asks Laeg to watch events; Laeg reports cattle breaking out, and Cuchulain identifies
    the Brown Bull and heifers as the beginning of a great battle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed woman desired that her grave and mound be made where the grave
    and mound of Ere could be seen; the place is said to have changed name from the
    place of the poet Maine to the place of Acaill.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mac Roth reports a company headed by a tall, large man with soft brown hair,
    a deep grey cloak, a silver brooch, and a white shirt; Fergus identifies him as
    Eoghan, son of Durthact, king of Fernmaige and one of the twelve chief heroes
    of the Red Branch.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mac Roth reports another company, numerous and angry, led by a dreadful-looking
    man with coarse grey hair, striped clothing, and a great spear; Fergus identifies
    him as Celthair, son of Uthecar, a head of battle in Ulster.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fergus identifies Celthair's spear as the Luin and says it was brought back
    from the East by the three sons of Tuireann.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mac Roth reports the last troop as leaderless, numbering thirty hundred, finely
    equipped, but troubled and down-hearted.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fergus identifies the leaderless troop as Cuchulain's men from Muirthemne
    and says they are able by themselves to fight the whole army of Ireland.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cuchulain lies on his bed wounded; when he hears the noise of Ulster gathering
    for battle, he tries to rise and gives a shout heard by his troop and the whole
    army.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Cuchulain's people force him back onto the bed and fasten ropes over him so
    he cannot move and reopen his wounds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Two mocking women from Ailell's camp stand by Cuchulain's bed, feign lamentation,
    and tell him that the men of Ulster are beaten and that Conchubar and Fergus are
    killed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: At night the Morrigu comes like a lean grey-haired hag, shrieking between
    the armies, hopping over weapon-points, stirring up anger, and saying ravens will
    pick men's necks on the next day.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The outcry prevents Cuchulain from sleeping, and at daybreak he tells Laeg
    to look out and report everything that happens.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Laeg sees a small herd of cattle breaking out from the west of Ailell's camp,
    lads pursuing them, and lads from the Ulster army coming to attack.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Cuchulain says the small herd is the beginning of a great battle because the
    Brown Bull of Cuailgne and his heifers are in it, and he predicts that young men
    of east and west will come against one another.
  category: speech
  evidence_refs:
  - ev:10
