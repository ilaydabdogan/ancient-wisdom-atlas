canonical_text:
  quote: ''
  summary: Cuchulain is called to speak to the Grey of Macha after the horse cannot
    be brought to the chariot. The horse turns its left side to him three times and
    sheds tears of blood on his feet. The narrative says the Morrigu had unyoked and
    broken the chariot the night before to keep him from going to his death in battle.
    Cuchulain goes to Emain, refuses Emer's plea to dismount, swears to attack the
    enemy camp, and drives south while Levarcham and the queens of Emain Macha lament
    because they know he will not return.
  language: English
  quote_policy: summarized
