canonical_text:
  quote: ''
  summary: Culain laments the loss of his hound. The boy offers to rear a replacement
    hound and serve as watch-dog until then, and Cathbad names him Cuchulain, the
    Hound of Culain. Later Cathbad foretells that whoever takes arms that day will
    gain the greatest name in Ireland but have a short life. Cuchulain hears this,
    asks Conchubar for arms, receives the king's own weapons, accepts the short-life
    prophecy for lasting fame, and begins testing chariots, breaking them.
  language: English
  quote_policy: summarized
