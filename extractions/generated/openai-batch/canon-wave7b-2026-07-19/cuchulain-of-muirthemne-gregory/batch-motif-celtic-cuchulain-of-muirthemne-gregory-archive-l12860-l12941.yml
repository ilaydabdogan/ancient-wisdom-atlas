canonical_text:
  quote: ''
  summary: Conchubar calls for the aid and advice of retired fighting men, after Cuchulain
    refuses to summon them. The old men take up their old horses and chariots and
    accompany him. Conchubar marches with his own men and sea-borne allies toward
    Rosnaree, while Cuchulain remains behind to gather his own people. Cairbre Niafer
    hears of the Ulster mustering, recalls prior grievances, sends to Ailell and Maeve
    for mutual aid, and an opposing army gathers. Conchubar sends Feic to scout and
    count the enemy host from a hill by the Boinne.
  language: English
  quote_policy: summarized
