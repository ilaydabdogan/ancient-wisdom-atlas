canonical_text:
  quote: ''
  summary: Laeg is in a richly described court with horses, marvelous trees, a fountain,
    cloaks, and an ever-full mead vat. Many women welcome him. Liban brings him to
    Fand, who confirms that she sent for Cuchulain and says the battle is that day.
    Labraid arrives by chariot; Liban praises him, but he answers that battle is near
    and Eochaid Juil is formidable. Liban tells Labraid that Laeg has brought word
    Cuchulain will fight with him. Labraid sends Laeg back to urge Cuchulain to come
    quickly, and Laeg returns to Emain Macha.
  language: English
  quote_policy: summarized
