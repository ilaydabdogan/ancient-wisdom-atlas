canonical_text:
  quote: ''
  summary: Iollan declares that the sons of Usnach were under his protection; Conall
    responds by killing Fiacra. Iollan dies after calling to Naoise. Conchubar arrives
    with a large force, disowns kinship with the sons, and refuses their appeals for
    peace despite the past services they recount. Deirdre urges Naoise to defend himself.
    Conchubar's men burn the house, and Ardan, Ainnle, and Naoise each fight back
    in turn during the night. Naoise returns, Deirdre praises his success and criticizes
    trust in Conchubar, and the sons make a shield-protection for Deirdre as the excerpt
    ends.
  language: English
  quote_policy: summarized
