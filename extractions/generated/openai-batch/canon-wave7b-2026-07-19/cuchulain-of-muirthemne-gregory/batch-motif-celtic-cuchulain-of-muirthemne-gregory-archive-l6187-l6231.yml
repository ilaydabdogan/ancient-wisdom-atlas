canonical_text:
  quote: ''
  summary: Ethal reveals that Caer alternates between bird shape and her own shape,
    and that she will be seen as a swan at Loch Beul Draguin with many beautiful birds.
    Angus Og goes to the loch, calls Caer, promises not to prevent her returning to
    the water, takes swan shape himself, circles the loch with her, and flies with
    her to Brugh na Boinne. Their music makes listeners sleep for three days and nights.
    Caer remains with Angus thereafter, and friendship follows between Angus, Ailell,
    and Maeve.
  language: English
