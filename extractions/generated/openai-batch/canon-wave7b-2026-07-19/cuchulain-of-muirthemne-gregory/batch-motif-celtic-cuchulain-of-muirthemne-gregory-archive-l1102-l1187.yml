canonical_text:
  quote: ''
  summary: The passage first recounts Macha’s claim to kingship, her defeat and capture
    of the sons of Dithorba, and her command that they build a rath as Ulster’s chief
    seat. It then gives explanations for a series of riddling phrases, identifying
    them with people, foods, routes, named places, and mythic episodes involving the
    sea, the Dagda, the Tuatha De Danaan, sidhe horses, a sow-shaped apparition, Angus
    Og, Bresal the Druid, Boann, Nechtan, and a dangerous hidden well.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Macha asked for kingship; the sons of Dithorba refused to give kingship to
    a woman, and she fought and routed them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Macha later found the sons of Dithorba, took them by treachery, brought them
    to Ulster in one chain, refused to let the men of Ulster kill them, and ordered
    that they serve her by digging a rath.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Macha marked out the rath with the gold pin on her neck, and the passage says
    the name came from a brooch in Macha’s neck.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker explains that the man in whose house they slept was Ronca, Conchubar’s
    fisherman; the speaker had called him a cattle-tender because fish are described
    as the cattle of the sea.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker explains the phrase about food being the ruin of a chariot by
    saying that a foal was cooked for them, and that a horse holds up a chariot.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker identifies the phrase about two mountains of the wood with Slieve
    Fuad, Slieve Cuilinn, and the wood of Oircil between them.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker says the plain of Muirthemne once had a magic sea with a sea turtle
    that sucked men down.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Dagda came with his club of anger and sang words that made the magic sea
    ebb away at once.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The phrase about the Great Secret of the men of Dea is explained as the place
    where the Tuatha De Danaan first whispered about the gathering for the battle
    of Magh Tuireadh.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ema Nemed’s two horses were reared in a sidhe of the Tuatha De Danaan; when
    released, a bright stream burst out after them and foam covered the land for a
    long time.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The phrase about the Back of the Great Sow is explained by saying a sow-shape
    appeared on hills and heights in Ireland to the sons of Milid after a spell by
    the Tuatha De Danaan.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Valley of the Great Dam is described as lying between Angus Og of the
    Sidhe of the Brugh and Bresal the Druid, with the wife of the Smith between them.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Boinne is said to get its name from Boann, wife of Nechtan; Boann went
    to a hidden well at the bottom of the dun with Nechtan’s three cup-bearers.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: The passage says no one returned from the hidden well without blemish unless
    the three cup-bearers accompanied them; Boann went to the well in pride, said
    nothing would blemish her, and passed left-handwise around the well to mock its
    powers.
  category: sequence
  evidence_refs:
  - ev:14
