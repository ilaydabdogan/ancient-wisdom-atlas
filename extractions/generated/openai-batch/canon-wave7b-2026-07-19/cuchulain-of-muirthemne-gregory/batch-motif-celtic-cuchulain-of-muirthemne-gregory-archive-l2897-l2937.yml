canonical_text:
  quote: '"three enchanted monsters, with the shape of cats"'
  summary: The men of Ulster leave Laegaire, Conall, and Cuchulain to be judged by
    Ailell. At night the three heroes are feasted separately, and three enchanted
    cat-shaped monsters from the cave in the Sidhe hill at Cruachan are released to
    attack them. Conall and Laegaire hide in the rafters, while Cuchulain remains,
    strikes at one monster, and watches it through the night. At daybreak Ailell suggests
    awarding Cuchulain the Championship, but the other two refuse. Maeve then sends
    the heroes to Ercol and Garmna; after choosing horse food, they race, and Cuchulain
    wins.
  language: English
  quote_policy: quoted
