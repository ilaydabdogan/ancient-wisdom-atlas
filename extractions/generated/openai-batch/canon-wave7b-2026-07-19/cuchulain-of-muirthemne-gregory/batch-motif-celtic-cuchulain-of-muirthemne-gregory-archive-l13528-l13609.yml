canonical_text:
  quote: ''
  summary: In the section called Levarcham's Message, allies are summoned and the
    provinces gather at Cruachan before marching toward Ulster. Maeve leaves Fergus
    behind because she believes his presence would prevent Cuchulain's defeat. Conchubar
    hears that Ulster's borders are being destroyed and sends Levarcham to call Cuchulain
    to Emain for counsel and delay. Levarcham finds Cuchulain at Baile's Strand, between
    sea and land, failing to strike sea-birds with his sling; he takes this as a bad
    sign and is still burdened by the death of Aoife's son there. Levarcham urges
    him not to face the army alone. After Laeg also advises going to Emain, Cuchulain
    agrees; Emer sends servants, herds, and cattle north, and she and Cuchulain leave
    Dundealgan, which is emptied for the first time since Cuchulain held sway there.
  language: English
  quote_policy: summarized
