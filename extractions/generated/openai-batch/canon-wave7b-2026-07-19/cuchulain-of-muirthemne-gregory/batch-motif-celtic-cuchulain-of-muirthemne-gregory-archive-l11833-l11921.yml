canonical_text:
  quote: ''
  summary: Laeg rebukes Cuchulain for remaining on a sick-bed after being overcome
    by women from Magh Mell or the Sidhe and urges him to rise for heroic action where
    Labraid leads fighting men. Cuchulain returns to the rock, where Liban again invites
    him to her country and describes Labraid, his lake, martial prowess, wealth, horses,
    and precious house. Cuchulain refuses to go merely at a woman's request, but allows
    Laeg to go as observer. Liban and the women lead Laeg past named places, including
    the Tree of Victory; she says he will not escape unless protected by a woman.
    They cross a lake in a small copper ship to Labraid's island, hear that Labraid
    is gathering his people for battle, and enter a strange yet familiar house with
    colored beds, precious materials, a precious-stone candle, and a western door.
  language: English
  quote_policy: summarized
