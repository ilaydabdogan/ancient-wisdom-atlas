canonical_text:
  quote: ''
  summary: Conlaoch refuses to give his name or story, defeats Conall, and is then
    confronted by Cuchulain. Cuchulain asks his name and warns him, but Conlaoch says
    he is bound by a command and will not surrender the fame he has won. They fight
    until Cuchulain calls for the Gae Bulg and the flames of the hero-light appear
    about his head. Conlaoch recognizes Cuchulain as his father and diverts his own
    spear, but Cuchulain throws the Gae Bulg and mortally wounds him. Conlaoch then
    shows a ring and identifies himself as Conlaoch, son of the Hound and heir of
    Dundealgan, saying he had been bound to secrecy in Dun Scathach.
  language: English
  quote_policy: summarized
