canonical_text:
  quote: ''
  summary: After an unnamed woman dies in shame and sorrow, Conchubar orders Aithirne,
    Aithirne's two sons, and Aithirne's house destroyed. The poets of Ulster bury
    and lament Aithirne. Conchubar then falls into trouble and sickness while remembering
    the war for the Bull of Cuailgne and Maeve's raid. Cathbad the Druid is asked
    to rouse him; Conchubar explains his anger and vows vengeance on kings and great
    people or his own death. Cathbad advises delaying the expedition until winter
    has passed and allies can be gathered. Conchubar agrees to wait but vows to seek
    satisfaction at Teamhair and sends messengers to Conall Cearnach and foreign allies.
  language: English
  quote_policy: summarized
