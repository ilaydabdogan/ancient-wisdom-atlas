canonical_text:
  quote: ''
  summary: Conall answers Emer about vengeance taken for Cuchulain, including the
    display of a slain enemy's head and a tally of enemies killed. Emer laments Cuchulain,
    asks to be placed at his grave, lies beside him with her mouth to his, declares
    she will not live after him, and dies. Conall buries Emer and Cuchulain in one
    grave, raises one stone with their names in Ogham, and joins the men of Ulster
    in keening. Later, queens who loved Cuchulain see him in a Druid chariot at Emain
    Macha and hear him singing the music of the Sidhe.
  language: English
  quote_policy: summarized
