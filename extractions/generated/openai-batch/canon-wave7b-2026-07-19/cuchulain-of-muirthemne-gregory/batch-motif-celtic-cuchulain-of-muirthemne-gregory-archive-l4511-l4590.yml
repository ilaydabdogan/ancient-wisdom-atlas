canonical_text:
  quote: ''
  summary: Levarcham raises Deirdre in seclusion, teaching her knowledge while preventing
    contact with outsiders. A lost hunter, cold and hungry on a winter night, dreams
    of a Sidhe house and calls for entry by sacred invocations. Levarcham tries to
    explain the voice as birds, but Deirdre opens the door and gives the hunter shelter,
    food, and drink. The hunter remarks on Deirdre's hidden beauty and names Naoise,
    Ainnle, and Ardan as men who would not leave her hidden if they saw her.
  language: English
  quote_policy: summarized
