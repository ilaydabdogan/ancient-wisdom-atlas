canonical_text:
  quote: ''
  summary: Natchrantal seeks Cuchulain and attacks him, but Cuchulain, transformed
    in anger and unknowingly wrapped with a broken pillar-stone, withstands the attack
    and beheads him. Maeve sends part of the army northward to look for the Brown
    Bull. Cuchulain follows briefly, returns to defend his country, kills Buac with
    a spear, but other men drive the Brown Bull and heifers to the Irish camp. The
    men of Ireland attribute Cuchulain's advantage to his bronze spear and send Rae
    the satirist to demand it; Cuchulain throws it at Rae, killing him. Cur son of
    Daltach is then sent out, but the passage ends before that action continues.
  language: English
  quote_policy: summarized
