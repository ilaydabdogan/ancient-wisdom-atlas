canonical_text:
  quote: ''
  summary: Fergus, provoked by accusations against Conchubar, raises Caladcholg to
    strike three great blows against Ulster. Cormac restrains him and persuades him
    to spare the army, so Fergus cuts the tops from three hills instead. Cuchulain
    hears Conchubar's shield, breaks free despite his wounds, rushes into battle,
    compels Fergus to honor a promise to retreat, and then grants Maeve protection
    for the remnant of her army to pass westward over the ford.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speech names Conchubar as the man who killed the three sons of Usnach, banished
    Fergus, dispossessed him in Ulster, and is expected to drive him back before the
    men of Ireland.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fergus takes the sword Caladcholg in both hands and swings it over his head;
    its appearance is compared to a rainbow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cormac Conloingeas, Conchubar's son, runs to Fergus, clasps his knees, and
    asks him not to destroy the whole army of Ulster.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fergus says he cannot live through the day unless he strikes his three blows
    on the men of Ulster, but he agrees to spare the army if Conchubar goes back to
    his place in the battle.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: After Conchubar withdraws, Fergus strikes three nearby little hills, cuts
    off their tops, and the hills are said to be called the three bare hills of Meath.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cuchulain hears the scream of Conchubar's shield, the Ochain, and Laeg identifies
    Fergus as the one who struck it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cuchulain breaks the ropes around him, scatters the grass from his wounds,
    knocks the two mocking women together, finds only his broken chariot, takes a
    shaft from it, and rushes wounded into battle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Cuchulain confronts Fergus and reminds him of a promise to go back before
    Cuchulain when they meet in the great battle and Cuchulain is covered with wounds.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Fergus goes back three steps, turns with his men, and gives way before Cuchulain;
    the men of Ireland break ranks and flee westward while Ulster pursues them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: 'Maeve asks Cuchulain for a gift: that he take the remainder of her army under
    his protection and let it pass westward over the great ford; Cuchulain agrees.'
  category: speech
  evidence_refs:
  - ev:9
