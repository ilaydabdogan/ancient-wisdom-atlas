canonical_text:
  quote: ''
  summary: Forgall promises Emer to Lugaid, but Emer declares that she loves Cuchulain
    and should not be forced into marriage; Lugaid withdraws. During Cuchulain's stay
    with Scathach, war breaks out with Aoife. Scathach gives Cuchulain a sleeping
    drink to keep him from danger, but he wakes quickly, joins the fighting, and kills
    several of Aoife's champions. When Aoife challenges Scathach, Cuchulain fights
    in Scathach's place. After Aoife breaks his weapons, he distracts her by falsely
    claiming that her valued horses, chariot, and driver have fallen, then captures
    her and spares her life. Aoife makes peace with Scathach and gives her love to
    Cuchulain, with a note that sorrow later follows. On a narrow path by a sea-cliff,
    Cuchulain meets a one-eyed old hag who asks for passage; when he hangs from the
    cliff to let her pass, she kicks at his hand to make him fall into the sea, but
    he leaps up again as the excerpt ends.
  language: English
  quote_policy: summarized
