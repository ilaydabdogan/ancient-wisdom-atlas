canonical_text:
  quote: ''
  summary: The passage recounts the Morrigu's attacks on Cuchulain in animal forms
    during combat with Loch, Cuchulain's killing of Loch and granting of a warrior's
    dying request, his loneliness while facing the armies of Ireland, Maeve's breach
    of a single-combat agreement, the Morrigu's disguised return to receive healing
    through milk and blessings, and Cuchulain's terrifying hero cry that panics the
    enemy camp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female opponent appears as a white, red-eared heifer with fifty other heifers
    linked by white bronze chains and rushes into the ford; Cuchulain wounds one of
    her eyes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same opponent next takes the form of a black eel in the stream and coils
    around Cuchulain's legs; while Cuchulain frees himself and bruises her against
    a green stone, Loch wounds him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The opponent then appears as a grey wolf and seizes Cuchulain's right arm;
    Loch wounds Cuchulain again while he frees himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cuchulain uses the Gae Bulg, described as the spear Aoife had given him, and
    gives Loch a deadly wound.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Loch asks not for his life but to rise so he may fall on his face rather than
    backwards toward the men of Ireland; Cuchulain grants the request as fitting for
    a fighting man.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cuchulain becomes downhearted because he is fighting alone against the four
    provinces of Ireland and sends Laeg to tell Conchubar and the men of Ulster that
    he is tired and unaided.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Maeve sends six opponents at once, three men and three women who understand
    enchantments; Cuchulain destroys them all.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After Maeve breaks the agreement not to send more than one opponent at a time,
    Cuchulain no longer spares her men and uses his sling so effectively that no dog,
    horse, or man in the army dares face him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Morrigu comes seeking healing from Cuchulain, because the wounds he gave
    can be healed only by his own hand.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Morrigu takes the appearance of an old woman milking a cow with three
    teats; Cuchulain asks for drink, receives milk from each teat, and gives blessings
    after each drink.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After Cuchulain's blessings over the milk, the Morrigu's wounded eye and then
    all the wounds of the Great Queen are healed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The men of the four provinces make camp and walls at the Great Breach on the
    plain of Muirthemne and send the cattle southward.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Cuchulain takes his place on a hill; Laeg makes a fire for him in the evening,
    and its flame flashes on the bright weapons of the men of Ireland.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: Seeing the enemy near him, Cuchulain shakes his spears, shield, and sword
    and gives a loud hero cry that is answered by the Bocanachs, Bananachs, and witches
    of the valley.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The enemy camp mistakes the cries for an attack; in fright, the men run against
    and fight one another, and a hundred are killed that night.
  category: sequence
  evidence_refs:
  - ev:9
