canonical_text:
  quote: ''
  summary: A vision warns Conchubar that Ulster will be attacked and the Brown Bull
    of Cuailgne driven away, and that Maine Morgor is coming to wed Ferb at Rath Ini
    with a company of young men. Conchubar consults Druids, receives predictions of
    death and victory, sets out with an armed company, sees ominous signs at Rath
    Ini, and attacks as Gerg and his sons prepare to defend the place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female speaker in Conchubar's vision says Ulster will be attacked and robbed,
    and the Brown Bull of Cuailgne will be driven away.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same speech identifies Maine Morgor, son of Ailell and Maeve, as coming
    that night to wed Ferb, daughter of Gerg of Rath Ini, with three times fifty young
    men.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The vision-speaker tells Conchubar to rise because there are only three times
    fifty men against him and victory will be with him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Conchubar summons Cathbad the Druid and tells him the vision.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Cathbad says the vision means many men will die, including Maine of Connaught
    and his companions, while Conchubar will return safely with fame and victory.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Conchubar sets out with three times fifty men and several named companions;
    they carry shields, bright green spears, and heavy swords, and bring no servants
    except Conchubar's.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Within sight of Rath Ini, Conchubar's party sees a heavy cloud over it, black
    at one end, red in the middle, and green at the other end.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Imrinn the Druid interprets the cloud as a sign of fighting that night and
    death-sorrow over the house, with death prepared for a young man.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A great vat later called the Ol Guala is brought into the feasting hall full
    of wine; a silver vessel falls into it, and the wine flows over the edges in three
    waves.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Olgaeth the Druid interprets the wine-vessel incident as a sign that the vessels
    will soon be with strangers and that a son in the house is not fortunate that
    night.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Conchubar comes to the door, his companions give an attack shout around the
    dun, and Gerg with his two sons takes up arms.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Gerg tells Maine that the men of Ulster will fight first and that, if they
    fall, Maine should hold the place if he can.
  category: speech
  evidence_refs:
  - ev:12
