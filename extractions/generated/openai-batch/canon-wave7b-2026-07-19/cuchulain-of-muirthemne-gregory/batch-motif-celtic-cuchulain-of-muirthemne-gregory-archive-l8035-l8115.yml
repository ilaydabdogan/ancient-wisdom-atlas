canonical_text:
  quote: ''
  summary: After a difficult night of snow, the army crosses into Ulster. Cuchulain,
    finding the track of the army, realizes he failed to warn the border. He and Laeg
    count the invading divisions, and Cuchulain’s reckoning is praised as one of Ireland’s
    three best estimates. Cuchulain pursues the army, kills the two sons of Neara
    and their drivers, sets their heads on a four-branched tree, and sends their chariots
    back. Maeve sees the headless bodies and consults her chief men, who infer an
    Ulster force is ahead near the ford.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group cut a way through the wood for chariots with swords, and the place
    is said to be called Sleact na Gearbat, the Cut Way of the Chariots.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A great snow fell at night, making one plain of the five provinces of Ireland;
    the camp could make no shelter or food and could not tell friend from enemy until
    sunlight.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cuchulain rose later than early morning, found food and a bath of pure water
    ready, and told Laeg to make the chariot ready.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cuchulain and Laeg came to the track of the army of Ireland where it had crossed
    the border into Ulster.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cuchulain said that one watching the borders should raise a cry or warning,
    and that he had missed doing so while the men of Ireland slipped into Ulster unnoticed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Laeg answered that he had warned Cuchulain that keeping his meeting the previous
    night would bring vexation.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Laeg counted the men who had crossed; Cuchulain disputed his count, counted
    them himself, and said eighteen divisions had crossed, though the eighteenth was
    broken up among the others.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narration calls Cuchulain’s reckoning one of the three best estimates
    ever made in Ireland, alongside estimates by Lugh of the Long Hand and Angus at
    Brugh na Boinne.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Cuchulain ordered Laeg to turn the chariot toward the army and hurry the horses,
    saying he would not live through the night unless he could kill some of them that
    day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Athgowla, northward from Knowth, Cuchulain and Laeg met the two young sons
    of Neara, who had been sent ahead of Maeve’s army to see whether there was any
    hindrance before it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Cuchulain struck off the heads of the two sons of Neara and the heads of their
    chariot-drivers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Cuchulain cut down a four-branched tree, lopped and cleared it, drove it into
    the ground with one cast, and set the four severed heads on its four branches.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Cuchulain turned the horses and chariots of the dead men back toward the army.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Maeve travelled in a chariot by herself, with chariots on each side, before,
    and behind, so that sod from hooves or foam from horses’ mouths would not touch
    her clothing.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Maeve saw the two chariots returning with headless bodies in them, and her
    chariot-driver identified them as the sons of Neara who had gone ahead.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Maeve held council with her chief men, who agreed that some part of the army
