canonical_text:
  quote: '"they are only one man, for they are all members of Calatin''s body."'
  summary: After the fight between Fergus and Cuchulain ends, Ferchu the outlaw and
    twelve men attack Cuchulain hoping to win pardon from Ailell and Maeve, but Cuchulain
    kills and beheads them. The men of Ireland then choose Calatin, his twenty-seven
    sons, and Glas to fight Cuchulain. They are described as poisoned and as acting
    like one man. They throw twenty-nine spears at Cuchulain, which he catches on
    his shield, then press him down at the ford, causing him to utter his hero cry
    and the cry of a man in unequal fight.
  language: English
  quote_policy: quoted
