canonical_text:
  quote: ''
  summary: After an initial gallows action and return to Cruachan, Nera sees the palace
    apparently burning, heads on the ground, and an army entering the Hill of Cruachan.
    He follows the army into the hill, is received by a king, is sent to a welcoming
    woman, and is ordered to bring daily firewood. He stays with the woman as his
    wife. For three days he sees a blind man carrying a lame man to a well, and the
    woman explains that the king's crown is kept in the well and checked by the two
    trusted men.
  language: English
  quote_policy: summarized
