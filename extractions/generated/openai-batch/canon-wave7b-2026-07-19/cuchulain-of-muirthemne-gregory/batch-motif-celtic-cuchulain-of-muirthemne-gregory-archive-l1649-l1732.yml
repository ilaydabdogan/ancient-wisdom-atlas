canonical_text:
  quote: ''
  summary: Cuchulain kills Ess Enchenn, completes his martial training with Scathach,
    receives a prophecy of danger and early death, and sails toward Ireland. On Samhain
    night at Rechrainn he finds Devorgill left by the sea as payment to the Fomor,
    kills three Fomor men who come for her, is recognized later by the strip of her
    dress used to bind his wound, refuses the king's marriage offer, returns to Emain
    Macha, and then tries unsuccessfully for a year to see Emer at Forgall's guarded
    house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cuchulain struck off the head of Ess Enchenn, who is described as the mother
    of the last three warriors he had killed and as having come to destroy him by
    exploiting his championship rules.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cuchulain remained with Scathach until he had learned the arts of war and
    the feats of a champion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Scathach told Cuchulain future events: dangers, battles against armies, the
    scattering of enemies, renewed fame in Alban, and death in full strength after
    a short life.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cuchulain boarded a ship for Ireland with named companions including Lugaid,
    Luan, Ferbaeth, Larin, Ferdiad, and Durst.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the night of Samhain, at the island of Rechrainn, Cuchulain came from the
    ship to the strand, heard crying, and saw a young girl sitting alone.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The girl identified herself as Devorgill, daughter of the king of Rechrainn,
    and said she had been left near the sea to be taken by the Fomor in place of an
    unpaid yearly tax.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Three fierce Fomor men landed in the bay and went toward Devorgill; Cuchulain
    attacked and killed all three before they could lay hands on her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The last Fomor man wounded Cuchulain in the arm, and Devorgill tore a strip
    from her dress to bind the wound.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the king's house, some people boasted that they had saved Devorgill, because
    she had not been able to identify the rescuer in the evening dusk.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: When water was brought for washing before the feast and Cuchulain bared his
    arms, Devorgill recognized him by the strip of her dress bound around his wounded
    arm.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The king offered Devorgill to Cuchulain as wife and offered to pay her wedding
    portion; Cuchulain refused, saying he must not delay going back to Ireland.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Cuchulain returned to Emain Macha, told his story, rested, and then set out
    to look for Emer at her father's house.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Forgall and his sons had strengthened and guarded the place so well that Cuchulain
