canonical_text:
  quote: ''
  summary: Maeve divides the army and spoil into two route-groups. The narrative recalls
    Ferloga's earlier ambush-bargain with Conchubar. Ailell, suspicious of Maeve and
    Fergus, orders Ferloga to watch them; Ferloga follows them into a wood, finds
    Fergus's sword, replaces it with a wooden sword, and brings the real sword to
    Ailell. Ailell hides the weapon, quarrels with Fergus and Maeve during a chess
    game, and refuses to return it until the great battle. Cuchulain displays his
    weapons from a height, causing dread. Maeve sends Fiacha with gifts and protection
    to win Cuchulain from Conchubar's service, but Cuchulain refuses to betray his
    mother's brother and agrees only to speak with Maeve, Ailell, and Fergus the next
    day.
  language: English
  quote_policy: summarized
