canonical_text:
  quote: I would sooner meet with death than break my word
  summary: Uath proposes a reciprocal beheading bargain in the Ulster hall. Laegaire
    and Conall behead him but fail to appear for their own turns. Cuchulain keeps
    the bargain despite expecting death. Uath spares him, is revealed as Curoi testing
    the heroes through enchantments, and awards Cuchulain the Championship and Champion's
    Portion.
  language: English
  quote_policy: quoted
