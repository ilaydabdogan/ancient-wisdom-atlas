canonical_text:
  quote: ''
  summary: 'Mac Cecht gives water to Conaire after the king''s death; Conaire''s head
    speaks in praise of him. Mac Cecht carries the High King''s body to Teamhair for
    burial, returns toward Connaught, and a place is named from his grief. Ireland
    remains without a High King for many years. The next section begins the story
    of Fedlimid''s daughter: Cathbad the Druid, visiting Fedlimid, is asked about
    future knowledge and foretells by Druid signs that a daughter of Fedlimid will
    cause unprecedented bloodshed and the deaths of great heroes.'
  language: English
