canonical_text:
  quote: ''
  summary: Mac Roth reports successive Ulster troops and their leaders. Fergus identifies
    Rochad, Sencha, Aithirne, and likely Ere, adding descriptions, reputations, relationships,
    and predictions. The passage also includes a backward-looking anecdote about Aithirne
    withholding milk during fighting and a forward-looking note about Ere's later
    part in the events around Cuchulain, his death by Conall Cearnach, and Acaill's
    mourning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mac Roth reports a troop led by a handsome, tall, well-formed man with red-yellow
    hair, a red and white cloak, a white shield with gold fastenings, and a long dark-green
    spear.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ailell asks Fergus who the man is, and Fergus identifies him as Rochad, son
    of Fatheman, from Rachlainn in the North, saying that the man is himself half
    an army.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator states that this Rochad is the same Rochad whom Findabair had
    loved.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mac Roth reports another troop led by a quiet, grey-haired man wearing a dark-green
    long-woolled cloak, a white shirt, a silver belt, and carrying a bell branch at
    his shoulder.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The grey-haired man sits before King Conchubar on the hill, with his company
    sitting around him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The grey-haired man's voice while speaking and advising the king is described
    as sweeter than a three-cornered harp in a player's hand.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fergus identifies the grey-haired man as Sencha, the orator, the best-spoken
    of all men, and the peace-maker of the army of Ulster.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fergus says Sencha could pacify all the men of the world with three fair words,
    but that on this day he will give counsel of courage, strength, and battle.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mac Roth reports another troop led by a man of fine appearance and gold-like
    hair who tosses and catches a sword with an ivory hilt near the heads of people
    around him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Fergus identifies this man as Aithirne, the poet and satirist, and describes
    him as covetous.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Fergus says that Aithirne would ask a one-eyed man for his one eye.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Fergus says rivers and lakes go back when Aithirne satirizes them and rise
    when he praises them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Fergus recounts that, during fighting at Beinn Etair, Aithirne had cows in
    the fort but would not give milk to men, boys, or wounded men, leaving them without
    food or drink except clay or salt sea-water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Mac Roth reports a wild-looking troop with a young, small, red, freckled lad
    in its middle; the lad wears a silk shirt bordered with red gold, a gold-faced
    shield with a golden rim, and a small bright gold sword.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: Fergus says he does not remember leaving such a boy in Ulster, but thinks
    it may be Ere, son of Cairbre, who came without his father's leave to help his
    grandfather Conchubar, accompanied by the men of Teamhair.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Fergus says that, if his identification is true, the troop will be a drowning
    sea and that the battle will be won against Ailell by that troop and that little
    boy.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: The narrator states that this was the same Ere who later fought against Cuchulain
    at Muirthemne; some said he ended Cuchulain, while others said he ended only the
    Grey of Macha.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: The narrator states that Conall Cearnach later killed Ere in red vengeance,
