  summary: A richly armed Cuchulain and his chariot driver are described. Maeve identifies
    Cuchulain as a destructive battle threat, hears Findabair describe the close advance
    of the Ulster men, and prepares cold water and hospitality to receive them. The
    Ulster men are welcomed and feasted for three days and nights, after which Sencha
    explains that they have come for Ailell's judgment on quarrels about precedence
    and the Champion's Portion.
