canonical_text:
  quote: ''
  summary: After Bricriu's feast, Conall, Laegaire, and Cuchulain quarrel over the
    Champion's Portion. Conchubar and the chief men of Ulster intervene and direct
    them first to Cruachan for judgment by Ailell and Maeve, and then, if necessary,
    to Curoi at Slieve Mis. Curoi is described as just, hospitable, battle-skilled,
    kingly, wise in enchantments, and difficult to approach except by a brave man.
    Cuchulain proposes going first to Cruachan, then urges Conall to go first with
    his chariot and mocks Conall's horses and chariot.
  language: English
