canonical_text:
  quote: ''
  summary: Men of Connaught are received at a dun with open gates, unyoked chariots,
    baths, and a feast in the hall. During the wedding feast a violent wind shakes
    the place and knocks down weapons and tables. Ollgaeth, Maine's chief Druid, interprets
    the blast as a bad sign and advises leaving, but Maine rebukes him and the guests
    ignore the warning. The passage then shifts to Conchubar asleep at Emain, where
    he dreams of a beautiful queenlike woman who comes to his bedside and speaks.
  language: English
  quote_policy: summarized
