- id: obs:3
  text: While the feast is underway, a sudden blast of wind shakes the whole place,
    makes the hall tremble, and causes shields, spears, and tables to fall.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gerg asks Maine's Druids what meaning they can put on the blast of wind.
  category: speech
  evidence_refs:
