- id: obs:1
  text: The men of Connaught come to the dun; the gates are opened, their chariots
    are unyoked, and baths of pure water are prepared for them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The visitors are brought into the hall of heroes in the middle of the house
    and given abundant food and drink.
  category: action
  evidence_refs:
