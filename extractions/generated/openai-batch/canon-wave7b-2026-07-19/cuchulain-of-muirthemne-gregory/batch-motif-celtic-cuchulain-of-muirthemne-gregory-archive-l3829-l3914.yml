canonical_text:
  quote: ''
  summary: On the road toward the Inn, Conaire encounters Fer Coille, a dreadful one-handed,
    one-footed, one-eyed man carrying a black iron forked pole and a squealing black
    pig, followed by an ugly woman. Fer Coille greets Conaire and says he will go
    to the place where Conaire will be that night. Conaire then sees three red horsemen
    riding ahead toward Derga’s Inn. Because one of Conaire’s bonds forbids three
    Reds to go before him to the House of Red, his son Lefriflaith pursues them but
    cannot overtake them. One horseman foretells night violence and says they ride
    horses of the Sidhe and are dead though alive. Conaire says his bonds are ended
    that night and that the three Reds were sent by the Sidhe. Meanwhile Ingcel and
    Irish outlaws arrive by ship; scouts with hearing, far sight, and judgment go
    ashore and detect the coming of a king and his company.
  language: English
  quote_policy: summarized
