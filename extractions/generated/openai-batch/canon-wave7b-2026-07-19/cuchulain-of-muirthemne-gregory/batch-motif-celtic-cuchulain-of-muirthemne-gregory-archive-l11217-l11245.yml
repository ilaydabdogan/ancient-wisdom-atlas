  quote: ''
  summary: The passage introduces the Brown of Cuailgne and the White-horned of Cruachan
    Ai as enchanted bulls. It then recounts an earlier setting involving two Sidhe
    kings, Bodb of Munster and Ochall Ochne of Connaught, who moved from fighting
    to peace. Their swineherds, Friuch and Rucht, were friends, knew enchantments,
    could take every shape, and moved swine between Munster and Connaught according
    to where mast was plentiful. The excerpt closes as men of the two regions stir
    bad feeling between the swineherds.
