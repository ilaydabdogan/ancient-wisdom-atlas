canonical_text:
  quote: ''
  summary: Cethern, angered by a trick, vows to kill a man dressed similarly and kills
    Maine Andoe before being killed by the men of Ireland and lamented by his wife.
    Fintan, Cethern's father, attacks for satisfaction, negotiates a temporary truce,
    and the aftermath gives a fight its name. Rochad comes to help Cuchulain, but
    Findabair, who loves him, is used by Maeve to make him withdraw. The twelve kings
    of Munster say Maeve had promised Findabair to each of them as a war reward; their
    attack leads to seven hundred deaths. Findabair dies from shame and pity after
    hearing this. The passage closes with Iliach hearing of Ulster's devastation and
    consulting his people.
  language: English
  quote_policy: summarized
