candidate_motifs:
- id: motif:1
  label: Retaliatory oath after perceived trick
  taxonomy_refs: []
  basis: Cethern interprets the broken-sword incident as a trick and swears not to
    stop killing until he kills a man dressed similarly.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives the oath and its immediate consequence but not the full
    setup of the trick.
- id: motif:2
  label: Kin vengeance and negotiated truce
  taxonomy_refs: []
  basis: Fintan attacks to get satisfaction for his son, but after losses and the
    capture of Crimthan, he accepts a settlement and promises to stop until the last
    battle.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The truce is explicitly temporary and tied to the expected final battle.
- id: motif:3
  label: Battle named from grotesque death image
  taxonomy_refs: []
  basis: The fight receives the name Fintan's Tooth-fight after two dead enemies are
    found with their teeth fixed into one another.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is an etiological naming motif at the battle-episode level, not a
    place-name explanation.
- id: motif:4
  label: Marriage promise used as military inducement and deception
  taxonomy_refs: []
  basis: Maeve sends Findabair to divert Rochad and is said to have secretly promised
    Findabair to each of twelve kings as a reward for joining the war.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage reports the kings' claim about Maeve's promises; it does not
    provide separate confirmation beyond their statement and Findabair's later hearing
    of it.
- id: motif:5
  label: Intra-allied violence after exposed betrothal deceit
  taxonomy_refs: []
  basis: The twelve kings, angered by the repeated marriage promise, attack Maeve's
    men and Rochad; seven hundred men die before Fergus can make peace.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The attackers are described as part of Maeve's army, but the exact political
    relations among all forces are not detailed in this excerpt.
- id: motif:6
  label: Death from shame and pity after collateral slaughter
  taxonomy_refs: []
  basis: Findabair dies after learning that seven hundred men died on her account
    and that she had been promised to every one of the twelve kings.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The text states the emotional cause directly, but does not describe a
    physical mechanism beyond her heart breaking.
- id: motif:7
  label: Foretold final battle as temporal boundary
  taxonomy_refs: []
  basis: The men of Ireland fear being weakened before the foretold last battle; Fintan
    promises not to trouble them again until that battle, and Maeve's message asks
    Rochad to stay away until it.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The prophecy or foretelling itself is only mentioned, not narrated in
    this passage.
- id: motif:8
  label: Devastated homeland prompting consultation
  taxonomy_refs: []
  basis: Iliach hears that Ulster has been plundered and destroyed by the four provinces
    and consults with his people.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The scene is fragmentary at the end of the supplied passage; its outcome
    is not included.
