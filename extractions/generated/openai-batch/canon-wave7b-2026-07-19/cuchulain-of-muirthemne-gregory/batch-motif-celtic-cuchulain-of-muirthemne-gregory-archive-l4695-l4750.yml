canonical_text:
  quote: ''
  summary: Deirdre sees three men near Emain Macha, recalls a hunter's talk and her
    dream, and thinks they are the sons of Usnach, including Naoise. The brothers
    pass singing, and their song enchants hearers and increases cows' milk. Love for
    Naoise enters Deirdre, and she follows him. Ainnle and Ardan, fearing Naoise will
    take the unmarried girl from Conchubar's court, urge haste and repeatedly dismiss
    Deirdre's calls as cries of Conchubar's birds until Naoise recognizes the third
    cry as a person's voice.
  language: English
  quote_policy: summarized
