canonical_text:
  quote: ''
  summary: The passage locates Cruachan, home of Ailell and Maeve, on Magh Ai in Connaught
    and explains the plain's name through a story of Conn's Druidic conflict with
    the Sidhe. Conn raids the Sidhe and covers the province with snow; the Sidhe consult
    Dalach, who tells them to kill three hundred white cows with red ears and spread
    their livers on the plain. Dalach's spells make the livers give out heat that
    melts the snow, after which the plain is named Magh Ai, the Plain of the Livers.
    The passage then gives brief genealogies of Ailell and Maeve.
  language: English
