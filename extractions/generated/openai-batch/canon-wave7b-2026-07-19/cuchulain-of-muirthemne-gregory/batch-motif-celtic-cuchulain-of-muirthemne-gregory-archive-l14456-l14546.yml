canonical_text:
  quote: ''
  summary: Emer laments over Cuchulain's head and body, praises his beauty, generosity,
    prowess, and former tenderness, asks that his weapons be given to Conall, recalls
    a night vision of his fall and broken arms, and brings his body to Dundealgan,
    where others keen him until Conall returns from vengeance without rejoicing.
  language: English
  quote_policy: summarized
