canonical_text:
  quote: ''
  summary: On the second day of combat, Cuchulain and Ferdiad return to the ford,
    choose broad spears, and wound one another until evening. They then stop, embrace,
    share a camp arrangement, receive limited healing by charms and spells, and exchange
    portions of healing, food, and drink. The next morning Cuchulain notices Ferdiad’s
    darkened appearance and speaks with him about fear, honor, mortality, Findabair,
    and Ferdiad’s coming to fight his companion at a woman’s bidding.
  language: English
  quote_policy: summarized
