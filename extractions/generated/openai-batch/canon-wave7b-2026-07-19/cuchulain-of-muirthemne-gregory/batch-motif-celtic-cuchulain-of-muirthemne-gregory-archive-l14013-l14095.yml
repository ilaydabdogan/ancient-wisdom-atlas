canonical_text:
  quote: ''
  summary: Cuchulain, accompanied by Cathbad, comes to a ford where a young Sidhe
    woman washes blood-red clothing and keens. Cathbad interprets this as a warning
    of Cuchulain's death, but Cuchulain refuses to turn back and sends farewell messages.
    He then encounters three one-eyed hags cooking a venomous hound with charms on
    rowan rods; after eating a hound shoulder-blade given by one hag, his left hand
    and thigh lose strength. Farther on, his enemy Ere sees him approaching in a chariot
    with the Crow of Battle overhead and prepares a stratagem involving Druids asking
    for Cuchulain's spears.
  language: English
  quote_policy: summarized
