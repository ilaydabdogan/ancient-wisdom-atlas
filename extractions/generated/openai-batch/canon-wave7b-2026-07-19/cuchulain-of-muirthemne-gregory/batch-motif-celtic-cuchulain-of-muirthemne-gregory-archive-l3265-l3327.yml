  quote: a man that will keep his word
  summary: An unnamed woman says the Champion's Portion should go to Cuchulain, but
    the other champions dispute this and allege Sidhe interference. She relays Curoi's
    order that the champions return to Emain for his judgment. Later, in the Red Branch
    hall at Emain, a huge ugly stranger named Uath arrives with a great branch and
    an axe, says he seeks someone who will keep an agreement, and proposes a reciprocal
    beheading arrangement.
