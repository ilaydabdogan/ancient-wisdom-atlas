canonical_text:
  quote: he put the likeness of a dark sea about them, with hindering waves
  summary: Conchubar asks Cathbad the Druid to hinder the sons of Usnach by enchantment
    while promising them safety. Cathbad creates the appearance of a dark sea with
    waves, and the sons of Usnach are captured after their swords fall. Conchubar
    seeks someone to kill them; Maine Rough-Hand volunteers, and the three brothers
    are beheaded together with one stroke. Deirdre laments them, recalls Alban and
    an earlier episode of jealousy and reconciliation, then moves about on the lawn
    as the excerpt breaks.
  language: English
  quote_policy: quoted
