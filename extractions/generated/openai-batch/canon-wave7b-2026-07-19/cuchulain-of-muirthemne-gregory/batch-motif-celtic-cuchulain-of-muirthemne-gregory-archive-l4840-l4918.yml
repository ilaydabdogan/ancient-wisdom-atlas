canonical_text:
  quote: ''
  summary: The passage first recounts children given into Manannan's care, their education
    and marriage arrangements. It then describes Conchubar's feast at Emain Macha,
    where poets perform and the king asks what is lacking. Conchubar identifies the
    absent sons of Usnach as Ulster's great want, proposes sending for them from Alban,
    notes Naoise's geasa about who may escort him back, and tests Conall, Cuchulain,
    and Fergus as possible messengers.
  language: English
  quote_policy: summarized
