canonical_text:
  quote: ''
  summary: Setanta compels the boys to accept mutual protection and remains at Emain
    Macha under the care of Ulster's chief men. Culain the smith holds a feast for
    Conchubar. Conchubar invites Setanta after seeing him excel at games, but Setanta
    stays to finish play and promises to follow the chariot tracks. At the feast,
    Conchubar forgets Setanta is coming, and Culain releases his fierce guard hound.
    Setanta arrives with only his hurling stick and ball, kills the attacking hound,
    and is brought safely inside by Fergus. Culain grieves for the dead hound and
    tells Setanta there is no good welcome for him.
  language: English
  quote_policy: summarized
