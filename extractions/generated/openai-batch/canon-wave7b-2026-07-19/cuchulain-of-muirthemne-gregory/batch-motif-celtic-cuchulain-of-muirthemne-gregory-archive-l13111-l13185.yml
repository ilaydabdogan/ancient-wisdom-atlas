canonical_text:
  quote: ''
  summary: After Cuchulain returns from Alban, he leaves Aoife pregnant and gives
    her a gold ring as a recognition token for the child when he is old enough. Aoife
    later hears that Cuchulain has married Emer, becomes jealous and angry, and resolves
    to use her son Conlaoch for revenge. She raises Conlaoch as a king's son, has
    Scathach train him in arms and war, gives him champion's arms, and places him
    under three geasa before sending him to Ireland. Conlaoch lands at Baile's Strand
    near Dundealgan while Conchubar is holding court; Conchubar sends Cuinaire to
    ask the armed youth his name and business, but Conlaoch says he is bound not to
    tell his name.
  language: English
  quote_policy: summarized
