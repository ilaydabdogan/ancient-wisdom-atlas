canonical_text:
  quote: ''
  summary: After the war for the Bull of Cuailgne, King Conchubar is down-hearted.
    The men of Ulster seek a wife for him and bring Luain to Emain Macha, where a
    wedding and feasting restore the king’s spirits. Cuingedach and Abhartach, poet
    sons of Aithirne, desire Luain and seek her secret love. She rejects them. They
    return to Aithirne, and the three make retaliatory satires against Luain that
    bring blotches onto her face.
