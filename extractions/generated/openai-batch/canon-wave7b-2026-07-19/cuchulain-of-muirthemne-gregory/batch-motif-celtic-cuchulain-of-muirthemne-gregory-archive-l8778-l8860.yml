canonical_text:
  quote: ''
  summary: Cuchulain kills Cur with an apple while practicing martial feats. After
    further challengers are killed, Laeg learns from Lugaid that Ferbaeth, Cuchulain's
    comrade, fellow-pupil, and blood-friend, will fight him after Maeve's inducements.
    Cuchulain tries to dissuade Ferbaeth, then draws blood from his own foot to loosen
    their blood-bond and kills him with a spear. Ailell next tries to make Cuchulain
    stop fighting by offering Findabair, but uses a disguised fool in his place; Cuchulain
    recognizes and kills the fool and cuts off Findabair's plaits. Lugaid then reports
    that Larine will be sent next, persuaded by wine and the promise of Findabair.
  language: English
  quote_policy: summarized
