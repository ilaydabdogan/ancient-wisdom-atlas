canonical_text:
  quote: ''
  summary: In the Battle of Rosnaree, Conchubar calls on Conall to stop a rout. Conall
    kills three royal poets who enter the fight, draws his sword, and its sound rallies
    the nearby fighters. Cuchulain enters battle, scatters the Gailiana, and later
    challenges Cairbre Niafer to single combat. After weapons on both sides are broken
    and replaced, Cuchulain kills Cairbre with a spear-thrust and cuts off his head
    before it reaches the ground, displaying it before both armies. Sencha raises
    a peace branch, Ulster stops, Leinster falls back, Iriel pursues and slaughters
    the retreating forces, and the Ulstermen return home. The passage closes by noting
    Conchubar’s later fatal head wound, sewn with gold thread by Fintan.
  language: English
  quote_policy: summarized
