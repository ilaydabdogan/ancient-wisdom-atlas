canonical_text:
  quote: ''
  summary: Conchubar directs Fergus to bring back the sons of Usnach and binds him
    to stop at Borach's fort, where a feast will exploit Fergus's geasa. Fergus travels
    to Loch Eitche in Alba with his two sons, Cuillean, and a shield. At the harbour
    Fergus shouts three times; Naoise recognizes the shout, while Deirdre first denies
    it and then explains a vision of three birds bringing honey and taking blood.
    She interprets the vision as a deceptive peace message from Conchubar. Naoise
    dismisses her warning, Ardan greets Fergus, and Fergus begins to report Conchubar's
    oath.
  language: English
  quote_policy: summarized
