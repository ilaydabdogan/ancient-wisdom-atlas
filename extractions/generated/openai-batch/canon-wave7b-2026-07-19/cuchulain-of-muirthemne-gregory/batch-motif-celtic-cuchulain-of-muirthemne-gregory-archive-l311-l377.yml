canonical_text:
  quote: ''
  summary: At about seven years old, Setanta hears of King Conchubar's court at Emain
    Macha and asks to join the boys there. Against his mother's advice to wait for
    protection, he sets out alone with his hurling gear and weapons, performing feats
    along the way. At Emain Macha he enters the royal boys' game without leave, excels
    at hurling, and is attacked by the boy troop under Follaman. Setanta defends himself
    until Fergus brings him to Conchubar, who recognizes him as his sister Dechtire's
    son and orders that the boys give him protection. When play resumes, Setanta again
    overthrows them as the supplied passage breaks off.
  language: English
  quote_policy: summarized
