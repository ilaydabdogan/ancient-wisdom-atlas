canonical_text:
  quote: ''
  summary: Fiall leads Cuchulain to Emer and her companions. Emer and Cuchulain exchange
    blessings, then Emer questions him about his origin, lodging, food, route, and
    identity; Cuchulain answers in riddles so the companions will not understand.
    Emer replies with a figurative account of maidenhood and guarded inaccessibility,
    lists champions who protect her, warns of Forgall's power, and hears Cuchulain
    swear to make his deeds renowned while describing his fighting strength and fosterage
    by Conchubar.
  language: English
  quote_policy: summarized
