canonical_text:
  quote: ''
  summary: 'The passage closes an earlier episode in which Sidhe-like women escort
    an unnamed man to a dun and give a sorrowful cry; he is welcomed back, Ailell
    and Maeve repent, peace is made, and he is later said to die in a river as foretold.
    It then begins Nera''s adventure: at Samhain in Cruachan, after two prisoners
    have been hanged, Ailell offers a prize to anyone who will put a gad around a
    hanged man''s foot. On a dark night when dangerous things appear, Nera accepts
    the challenge for a gold-hilted sword. He does the task, and the hanged man speaks,
    praises his courage, and asks to be brought to a drink.'
  language: English
  quote_policy: summarized
