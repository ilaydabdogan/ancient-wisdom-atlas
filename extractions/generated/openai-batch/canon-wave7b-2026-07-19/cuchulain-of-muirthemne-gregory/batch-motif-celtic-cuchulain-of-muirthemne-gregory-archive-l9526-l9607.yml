canonical_text:
  quote: ''
  summary: Ferdiad's driver hears and praises the swift approach of Cuchulain in his
    chariot, repeatedly calling him a Hound of Emain, Ulster, and Battle. Ferdiad
    rebukes the driver and cites a prophecy from Ailell and Maeve that Cuchulain will
    fall by him. Cuchulain arrives at the ford; Ferdiad stands on the south side and
    Cuchulain on the north. The two exchange a strained welcome, refer to their former
    association with Scathach, Uathach, and Aoife, and then trade hostile boasts before
    combat.
  language: English
  quote_policy: summarized
