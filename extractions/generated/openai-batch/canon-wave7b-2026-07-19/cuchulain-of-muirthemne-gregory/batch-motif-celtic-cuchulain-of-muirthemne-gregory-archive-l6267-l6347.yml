canonical_text:
  quote: ''
  summary: The passage gives a brief aftermath of a defeat and beheading, then describes
    Ailell and Maeve’s seven sons named Maine. It details the royal house and dun
    of Cruachan, including its divisions, bronze, yew, oak, glass, raised royal place,
    and control rod. It identifies the Hill or Cave of Cruachan as a Sidhe dwelling
    where Midhir once brought Etain and says the Sidhe are seldom visible to living
    people. It recounts white birds and enchanted pigs emerging from the hill and
    damaging the land, including Maeve and Ailell’s failed attempt to count the pigs
    and the naming of Magh-mucrimha. It ends with Fraech coming to Cruachan to seek
    Findabair and obtaining Sidhe clothing through Boann.
  language: English
  quote_policy: summarized
