canonical_text:
  quote: ''
  summary: Conall meets the bloodied Grey of Macha, understands that Cuchulain is
    dead, and finds Cuchulain's body at the pillar-stone. He recalls a mutual promise
    of satisfaction for whichever of himself and Cuchulain died first, then follows
    Lugaid to the river Life. Lugaid, preparing to bathe, has his chariot-driver watch
    the plain; the chariot-driver reports an approaching man with a raven-and-snow-like
    appearance. Lugaid identifies the approacher as Conall Cearnach with the horse
    Dub-dearg, and explains the apparent birds and snow as sods and froth cast up
    by the horse. Conall confronts Lugaid as a debtor for killing Cuchulain. They
    fight; after Lugaid asks for one-handed combat, Conall binds one hand to his side.
    When neither gains the upper hand, Dub-dearg bites Lugaid, and Conall says his
    promise of fairness applied only to himself, not to the beast.
  language: English
  quote_policy: summarized
