canonical_text:
  quote: ''
  summary: At Cruachan, Maeve and Ailell speak after rising from their royal bed.
    Ailell praises the good wife of a good man, and Maeve answers by asserting her
    independent worth, lineage, retinue, martial ability, rejected suitors, marriage
    requirements, wedding gifts to Ailell, and equal right to tribute. Ailell denies
    that his standing depends on her and begins to answer with his own royal lineage.
  language: English
  quote_policy: summarized
