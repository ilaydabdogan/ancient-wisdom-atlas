canonical_text:
  quote: ''
  summary: Cuchulain receives help toward finding knowledge, sends the king's son
    to Emain Macha with an Ogham-marked spear, and sails with Lugaid and Laeg to a
    silver-walled island. They are welcomed by a grey king and queen, attended by
    three young girls, bathed after heated iron is placed in vats, and feasted. The
    next day a self-steering boat takes them to the island of Doel Dermait's daughter
    and Condla, whose breath raises waves. Condla and his wife welcome Cuchulain;
    the woman says the healing of the sons of Doel Dermait is foretold to come by
    Cuchulain and directs him onward. At a wall, women cutting rushes describe a dangerous
    country of seven princes and seven women with kings under their feet.
  language: English
  quote_policy: summarized
