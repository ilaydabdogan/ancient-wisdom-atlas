canonical_text:
  quote: ''
  summary: Findabair leaves Fraech a ring. Fraech asks Ailell and Maeve for their
    daughter; Ailell demands a large marriage portion and military support, which
    Fraech refuses. Ailell notices the ring and plans to destroy Fraech without public
    reproach. During a river-bathing outing, Ailell sends Fraech to fetch rowan berries
    from across the water, knowing a prophecy that Fraech will die in a river. Fraech
    fetches one branch, is sent back, and is seized by the water-worm guarding the
    tree. Findabair throws him a gold knife despite Ailell’s attempt to stop her;
    Fraech kills the monster but is deeply wounded. Ailell orders a healing bath.
    Three times fifty mourning women appear, identify Fraech as beloved of the king
    of the Sidhe of Ireland, and Fraech says the cry is that of his mother and the
    women of Boann. They take him into the Hill of Cruachan, and the passage begins
    to state that he comes out the next day whole.
  language: English
  quote_policy: summarized
