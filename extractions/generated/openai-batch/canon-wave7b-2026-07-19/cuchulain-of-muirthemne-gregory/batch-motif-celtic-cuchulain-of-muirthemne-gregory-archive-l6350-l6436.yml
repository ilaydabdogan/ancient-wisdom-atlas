canonical_text:
  quote: ''
  summary: Fraech arrives at Cruachan with a splendid retinue, musicians, lights,
    hounds, and hunting game. Ailell and Maeve welcome him; Maeve plays chess with
    him while harpers perform the Three Cries of Uaithne, associated with Boann's
    sons' birth. Food is later distributed by Lothar, under whose hand food does not
    fail. Fraech eventually meets Findabair at the river, says he came for her, and
    asks whether she will go away with him secretly; she refuses secrecy because she
    is the daughter of a king and queen.
  language: English
  quote_policy: summarized
