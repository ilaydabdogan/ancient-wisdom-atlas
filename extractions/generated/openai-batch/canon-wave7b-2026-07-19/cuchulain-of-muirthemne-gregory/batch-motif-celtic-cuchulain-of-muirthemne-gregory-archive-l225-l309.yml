canonical_text:
  quote: ''
  summary: At a lodging where Dechtire is in childbirth, Conchubar later finds her
    with a newborn child. Dechtire asks that she and the child be brought back to
    Emain Macha. Several Ulster figures claim or are proposed for the child’s upbringing.
    Morann adjudicates, assigning Conchubar, Sencha, Fergus, and Amergin particular
    roles in the child’s naming and education, and foretells the child’s future praise,
    love, vengeance, defense of fords, and battles. The child is ultimately left with
    Dechtire and Sualtim, raised on the plain of Muirthemne, and known as Setanta,
    son of Sualtim.
  language: English
  quote_policy: summarized
