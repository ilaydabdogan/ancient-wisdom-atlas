canonical_text:
  quote: ''
  summary: Maeve attempts to form the army of Ireland into a pen to trap Conchubar,
    but Conchubar breaks through, kills many, and returns to Slieve Sleamhain. Ailell
    orders a report on the gathering men of Ulster. Mac Roth watches the Ulster army
    arrive in divisions and later reports on Conchubar, Cathbad the Druid, and Rocmid
    the king's fool.
  language: English
  quote_policy: summarized
