canonical_text:
  quote: ''
  summary: After Ferdiad's death, Cuchulain stands over him and laments. He says Ferdiad
    was betrayed by the men of Ireland into fighting him, recalls their pledge with
    Scathach never to oppose one another, praises Ferdiad's appearance, wisdom, speech,
    and fighting skill, and speaks of Findabair and a brooch as inducements connected
    with the fight. Cuchulain commands Laeg to strip Ferdiad to reveal the brooch,
    then laments Ferdiad's possessions and their fellowship. He then has Laeg remove
    the Gae Bulg from Ferdiad, sees the bloodied spear and body, and recalls a former
    shared expedition under Scathach against Germain.
  language: English
  quote_policy: summarized
