canonical_text:
  quote: ''
  summary: A display of rich dress and horses is followed by the arrival of a northern
    troop and a Druid's prophecy about Connaught. Bodb challenges Connaught to provide
    a fighter against his champion Rinn; a strange champion accepts, and their three-day
    combat expands into a battle in which kings die. The two champions vanish and
    are identified as the two swineherds; they later appear as threatening shadows
    and then as eels. One eel is drunk by Daire's cow, while the other enters Maeve's
    vessel, speaks with her, and is later swallowed by one of Maeve's cows. From the
    two cows the White-horned and Brown bulls are born and ornamented by Ulster and
    Connaught.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ochall asks whether his people can match Bodb's people in dress, horses, and
    arms; they say they cannot, and he laments that their great name is lost.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A troop of men from the North arrives with black horses, gold bridle-bits,
    black-grey cloaks, gold brooches, white tunics with crimson stripes, gold coils,
    and smooth black hair; the Connaught men stand and give them their place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Druid from Britain says that, after the Connaught men make way, they will
    be under a yoke and attending on hounds and royal children forever.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After feasting, Bodb asks whether any Connaught man will fight his champion
    Rinn, whose origin is unknown; a strange champion from among the Connaught men
    accepts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Rinn and the strange champion fight for three days and three nights; armies
    and troops join the conflict, four kings are killed including Ochall, and Bodb
    returns to Slieve-na-man.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The two champions are seen no more, are known to be the two swineherds, and
    then spend two years appearing as shadows and threatening one another, frightening
    many people to death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The two become eels: one enters the river Cruind in Cuailgne and is drunk
    by a cow belonging to Daire son of Fachna; the other enters the Spring of Uaran
    Garad in Connaught and then Maeve''s bronze vessel.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Maeve looks at the colorful eel, asks about its beast-shape and her future
    rule over Connaught, and the eel answers that he is tormented, has been in many
    shapes, and advises her to take a good man to share her sway.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Maeve says she does not want a man of Connaught to get the upper hand over
    her; she later marries Ailell, and the eel is swallowed by one of Maeve's cows
    at the spring.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: From Daire's cow and Maeve's cow the two bulls, the White-horned and the Brown,
    are born; they are described as the finest ever seen in Ireland, and gold and
    silver are put on their horns by Ulster and Connaught.
  category: sequence
  evidence_refs:
  - ev:8
