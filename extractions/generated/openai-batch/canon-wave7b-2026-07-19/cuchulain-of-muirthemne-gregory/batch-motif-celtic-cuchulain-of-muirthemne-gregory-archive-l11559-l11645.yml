canonical_text:
  quote: "“there is enchantment behind these birds”"
  summary: Cuchulain is asked to get birds for the women of Ulster. He disables and
    distributes birds, leaving Eithne Inguba without a pair, then promises her the
    two most beautiful birds that will come later. Two linked birds with a red-gold
    chain appear on the lake and sing sleep-inducing music. Despite warnings of enchantment,
    Cuchulain attacks them, misses twice, then wounds one with a spear before both
    dive under water. He sleeps by a rock and sees two women in colored cloaks who
    strike him with rods until he is nearly dead. He is later brought to the Speckled
    House at Emain and remains there a year without speaking.
  language: English
  quote_policy: quoted
