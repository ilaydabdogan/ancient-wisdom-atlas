canonical_text:
  quote: ''
  summary: The passage describes the Brown Bull of Cuailgne, formerly Friuch the Munster
    swineherd, being taken into Connaught by Maeve’s messengers. His bellowing draws
    the White-horned bull, and the two bulls fight violently. Bricriu is appointed
    to observe the fight but is trampled to death. After an insult from Cormac Conloingeas,
    the Brown Bull renews the struggle and defeats the White-horned, carrying parts
    of his remains on his horns. Maeve’s sons attempt to attack the Brown Bull, but
    Fergus protects his return. The Brown Bull bellows, travels away, and at the ford
    of the Sionnan drops parts of the White-horned into the water.
  language: English
  quote_policy: summarized
