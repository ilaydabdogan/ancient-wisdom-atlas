canonical_text:
  quote: ''
  summary: The party reaches Emain Macha and is directed by Conchubar into the House
    of the Red Branch, which Deirdre has warned is a sign of treachery. Despite Deirdre's
    renewed warning, they enter, are served food and drink, and Naoise and Deirdre
    begin playing chess. Conchubar sends Levarcham to inspect Deirdre's appearance
    and declares that, if she remains beautiful, he will take her by force. Levarcham,
    who loves Deirdre, sees armed foreign men near the house, warns Naoise and Deirdre
    of treachery and kin-killing, and laments that Naoise, Ainnle, and Ardan are to
    die.
  language: English
  quote_policy: summarized
