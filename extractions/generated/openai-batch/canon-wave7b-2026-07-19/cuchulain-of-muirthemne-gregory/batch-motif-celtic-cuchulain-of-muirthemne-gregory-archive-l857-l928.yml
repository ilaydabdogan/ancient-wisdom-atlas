canonical_text:
  quote: ''
  summary: The passage introduces Cuchulain as a gifted young man at Emain Macha who
    is admired by the women of Ulster. The men of Ulster decide to seek a wife for
    him to redirect that attention and to ensure he leaves an heir. Conchubar sends
    messengers across Ireland, but they fail to find a pleasing woman. Cuchulain then
    goes in his swift chariot to court Emer, daughter of Forgall Manach, in the Garden
    of Lugh. Emer is presented as an accomplished woman with six gifts, teaching needlework
    to companions. Cuchulain arrives richly dressed, and the young women hear the
    approaching chariot before Emer sends someone to look.
  language: English
  quote_policy: summarized
