canonical_text:
  quote: ''
  summary: Fergus, made leader of the army, delays its northward movement and sends
    messengers to warn Ulster. Maeve notices and challenges him. Near the Ulster border,
    Fergus warns the army to beware Cuchulain. The Connaught host travels east and
    kills a large herd of deer, with the Gailiana killing almost all of them. Cuchulain
    and his father Sualtim, having received Fergus's warning, stop at the pillar-stone
    of Ardcullin; their horses graze on opposite sides, and Cuchulain says the Connaught
    army is near and orders Sualtim to carry a warning, though the passage ends mid-command.
  language: English
