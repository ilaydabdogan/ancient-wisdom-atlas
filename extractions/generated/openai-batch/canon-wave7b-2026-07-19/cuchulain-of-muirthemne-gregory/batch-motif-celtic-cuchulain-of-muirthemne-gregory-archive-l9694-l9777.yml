canonical_text:
  quote: each put his hands round the neck of the other, and gave him three kisses
  summary: Cuchulain and Ferdiad, former companions trained in the same martial knowledge,
    begin a formal duel at the ford. Ferdiad chooses the weapons. They fight first
    with casting weapons without drawing blood, then with straight spears until both
    are wounded. At night they stop, embrace and kiss, share camp arrangements through
    their attendants, receive healing, and exchange medicines and provisions so neither
    has an unfair advantage.
  language: English
  quote_policy: quoted
