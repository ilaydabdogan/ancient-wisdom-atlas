canonical_text:
  quote: ''
  summary: Cuchulain directs Sualtim to warn the men of Ulster to shelter away from
    the open plains, while Cuchulain himself insists on going to Teamhair to keep
    a promise to see a young woman. Before leaving, Cuchulain cuts an oak sapling,
    twists it into a ring, inscribes it in Ogham, and sets it on a pillar-stone. The
    men of Ireland find the ring; Ailell gives it to Fergus to read. The inscription
    bears Cuchulain's name and a warning not to pass the pillar-stone that night,
    under threat of revenge at sunrise. Maeve and Ailell decide to camp in the wood
    rather than go against the warning.
  language: English
  quote_policy: summarized
