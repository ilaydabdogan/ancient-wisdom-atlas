canonical_text:
  quote: ''
  summary: In the Championship of Ulster episode, Laegaire, Conall, and Cuchulain
    are sent out one by one at night to fight witches in a valley. Laegaire and Conall
    are driven back and lose items of gear. Cuchulain is initially beaten, but Laeg's
    insults rouse him to anger; he defeats the witches and takes their battle cloaks.
    The next day Ercol challenges the men and their horses. Laegaire and Conall flee
    after their horses are killed; Rathand drowns in a river that receives his name.
    The passage ends as the Grey of Macha kills Ercol's horse and Cuchulain subdues
    Ercol.
  language: English
  quote_policy: summarized
