canonical_text:
  quote: ''
  summary: Fergus urges the sons of Usnach to return to Ireland, while Deirdre argues
    that they should remain in Scotland. Naoise chooses return, valuing Ireland over
    Alban and lamenting exile. Deirdre resists the journey and reports a dream in
    which the three sons of Usnach are bound and placed in a grave by Conchubar. Naoise
    dismisses the dream, but Deirdre adds further ominous visions of dogs howling,
    Fergus separated from them, Conchubar without mercy, and named warriors weakened
    or without defensive gear.
  language: English
  quote_policy: summarized
