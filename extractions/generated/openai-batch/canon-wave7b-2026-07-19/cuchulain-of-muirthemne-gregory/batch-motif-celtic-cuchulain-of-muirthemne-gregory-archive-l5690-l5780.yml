canonical_text:
  quote: ''
  summary: Cuchulain hears Deirdre's account of the death of the sons of Usnach, grieves
    for Naoise, and is told that Maine Rough-Hand killed him. Deirdre then lies by
    the grave while it is being dug and delivers a lament for Naoise, Ainnle, and
    Ardan, praising them as a heroic triad, remembering her love for Naoise and hardships
    shared with the brothers, asking that the grave not be narrow, and saying she
    will not live long after them. She recalls betrayal through Fergus and the Red
    Branch and ends alone after the three heroes.
  language: English
  quote_policy: summarized
