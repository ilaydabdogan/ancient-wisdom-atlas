canonical_text:
  quote: ''
  summary: After Lugaid admits taking Cuchulain's head, Conall kills him and returns
    Cuchulain's head to the pillar-stone where the body lies. Levarcham brings the
    news to Emer and Emain Macha. The women lament and keen over the body. Conall
    lays the head with the body, laments Cuchulain as a fallen hero and foster-son,
    refuses burial until vengeance is taken, and rides out in rage after the remaining
    men of Ireland. Emer washes Cuchulain's head and wraps it in silk.
  language: English
  quote_policy: summarized
