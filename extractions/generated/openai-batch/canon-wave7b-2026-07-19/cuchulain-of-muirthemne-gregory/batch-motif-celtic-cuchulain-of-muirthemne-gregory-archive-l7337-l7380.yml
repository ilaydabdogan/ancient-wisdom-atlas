canonical_text:
  quote: '"This was the first blood shed in Ulster on the account of the Brown Bull
    of Cuailgne."'
  summary: A lament for a dead young man is followed by a battle in which Maeve confronts
    Conchubar, kills his two sons, is defeated and carried away by Druids. Conchubar
    plunders Gerg's dun and takes a brass vat to Emain, where it becomes known as
    the Champion's Drinking Vat. Ferb and Nuagal die of grief, a grave and Ogham-inscribed
    stone are made, Rath Ini is renamed Ferb's Mound, and the episode is marked as
    the first blood shed in Ulster because of the Brown Bull of Cuailgne.
  language: English
  quote_policy: quoted
