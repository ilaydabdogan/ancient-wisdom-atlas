canonical_text:
  quote: ''
  summary: Fedelm of the Sidhe tells Maeve she has come to see the fortune of the
    army gathering for the Brown Bull of Cuailgne. Maeve repeatedly asks how Fedelm
    sees the host; Fedelm repeatedly sees it red or crimson, then describes a young
    warrior resembling Cuchulain who will redden the host and cause many deaths. The
    passage explains Maeve's reliance on the Ulstermen's weakness as an old curse
    by an ill-treated woman and begins the story of Crunden and a silent woman who
    enters his house and performs domestic tasks.
  language: English
  quote_policy: summarized
