  text: Fedelm says she has come to see Maeve's chances and fortunes as the provinces
    of Ireland are gathered for the war for the Brown Bull of Cuailgne.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fedelm identifies herself as Fedelm of the Sidhe, of Rath Cruachan, and as
    a serving-maid belonging to Maeve's own people.
