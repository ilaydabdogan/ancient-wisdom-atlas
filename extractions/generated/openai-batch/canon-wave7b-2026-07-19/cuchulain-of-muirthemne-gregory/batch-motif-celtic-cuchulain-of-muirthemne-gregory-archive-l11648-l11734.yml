canonical_text:
  quote: ''
  summary: Cuchulain lies sick in a house with companions stationed around him. A
    manlike visitor enters, says he has come to speak with Cuchulain, speaks of Liban,
    Labraid, and Fand, promises healing, and identifies himself as Angus before vanishing.
    Cuchulain recounts a prior vision in which women struck him with rods. At Conchubar's
    advice he returns to the same rock and meets Liban, who says Fand loves him and
    that Labraid will reward him for one day's help in battle. Cuchulain says he remains
    weak and will not go until he sees Emer, so he sends Laeg to bring her word.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cuchulain is lying in a house with Laegaire between him and the wall, Conall
    Cearnach between him and the door, Lugaid beside his pillow, and Eithne Inguba
    at his feet.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A figure with the appearance of a man enters the house and sits on the side
    of Cuchulain's bed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The visitor says he has come to speak with the man lying on the bed and describes
    Cuchulain as a protection to the men of Ulster even in sickness and weakness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The visitor says that if Cuchulain accepts his friendship, what Cuchulain
    has seen in sleep will be his without help from his army.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The visitor says Liban is connected with Labraid and that Cuchulain's coming
    would bring joy to Fand.
  category: speech
