canonical_text:
  quote: ''
  summary: The passage describes a marvelous sword and recounts the sea-monster origin
    and transmission of Cuchulain's spear, the Gae Bulg. It then describes Conchubar's
    household supper rotation and compulsory Samhain feast, names learned men at his
    court, explains Morann's truth-enforcing collar, and narrates a poetic contest
    between Neidhe and Athairne over the chief poet's place. It ends with Athairne
    secretly bringing away Midhir's three cranes of churlishness and denial.
  language: English
  quote_policy: summarized
