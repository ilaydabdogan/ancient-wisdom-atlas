  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bolg, son of Buan, finds Coinchenn's bones on the strand and makes a spear
    from them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The spear passes from Bolg to the son of Jubar, then through other hands to
