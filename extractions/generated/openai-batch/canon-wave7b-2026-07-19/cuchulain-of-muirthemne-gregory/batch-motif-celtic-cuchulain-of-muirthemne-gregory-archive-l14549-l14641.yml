  quote: ''
  summary: Conall Cearnach brings severed heads and lays them on a lawn. Emer greets
    him, says he has avenged treachery against Ulster, asks that a grave be made for
    herself and Cuchulain, and questions Conall about the identities of the heads.
    Conall names several slain figures and says the heads were brought in revenge
    for Cuchulain, called the Hound of Feats. The passage ends during another unfinished
    question about a head.
