canonical_text:
  quote: ''
  summary: Laeg describes Labraid's Sidhe country as bright, truthful, musical, rich
    in gifts, and desirable for endless life, and praises Fand's beauty. Cuchulain
    is strengthened by this report and travels with Laeg by chariot to Labraid's island
    country, where Labraid, the women, and Fand welcome him. Labraid asks Cuchulain
    to inspect the opposing army. Ravens croak before the armies, which interpret
    them as announcing the angry man from Muirthemne. Cuchulain spears Eochaid Juil
    at a spring, attacks the army alone, overcomes Senach Siabartha, and continues
    killing until Labraid calls for him to stop. Laeg warns that Cuchulain's rage
    may turn on allies and asks for three vats of water to cool his heat. Fand sings
    of Cuchulain's bloody return in his chariot.
  language: English
  quote_policy: summarized
