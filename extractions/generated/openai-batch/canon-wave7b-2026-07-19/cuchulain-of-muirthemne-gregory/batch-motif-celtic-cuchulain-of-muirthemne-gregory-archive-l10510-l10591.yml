canonical_text:
  quote: ''
  summary: Iliach arms himself with old horses, an old chariot, worn weapons, and
    stones, and goes without armor against the men of Ireland for Ulster. After being
    mocked, he is welcomed by Doche and asks Doche to kill him when his strength is
    spent and to keep his sword for Laegaire Buadach. Iliach attacks with spears,
    stones, and his hands until exhausted; Doche beheads him and brings his head to
    Ailell and Maeve. Sualtim hears of Cuchulain's severe wounds, visits and laments
    over him, and is sent by Cuchulain to Emain to summon the men of Ulster. Sualtim
    rides the Grey of Macha to Emain and cries out a warning, but initially receives
    no answer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iliach says he will go out against the men of Ireland, do what he can for
    Ulster, and treats survival or death as all one to him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Iliach is equipped with two old horses, an old chariot, a rough dark iron
    shield with a silver rim, a rough grey heavy sword, two rusty blunt spears, and
    a heap of stones and rocks; he has no armor on him.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men of Ireland mock and laugh at Iliach's appearance, while Maeve says
    she would be glad if all the men of Ulster came to meet them that way.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Doche, son of Magach, welcomes Iliach and identifies himself as a comrade
    and friend of Laegaire Buadach.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Iliach asks Doche to come to him when his rage and strength are spent, to
    be the one who kills him, and to keep his sword for Laegaire Buadach.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Iliach attacks the men of Ireland first with spears, then with stones after
    the spears break, and finally with his hands when the stones are gone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Iliach has done all he can, Doche beheads him and brings the head to
    Ailell and Maeve.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Sualtim is told that Cuchulain has fought Calatin and his sons and Ferdiad
    and has received severe wounds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sualtim asks whether he hears the sky bursting, the sea going backward, the
    earth breaking up, or his son's groaning in weakness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sualtim visits Cuchulain, finds him covered with hurts and wounds, and begins
    to cry over him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Cuchulain tells Sualtim to stop crying, go to Emain, and tell the men of Ulster
    that they must come themselves and continue the war because he can no longer defend
    them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Cuchulain says his clothing cannot touch his skin, that hazel crooks hold
    it off him, that grass is laid over his wounds, and that no place on him is unhurt
    except the left hand that held his shield.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Sualtim rides the Grey of Macha toward Emain, cries out that men are being
