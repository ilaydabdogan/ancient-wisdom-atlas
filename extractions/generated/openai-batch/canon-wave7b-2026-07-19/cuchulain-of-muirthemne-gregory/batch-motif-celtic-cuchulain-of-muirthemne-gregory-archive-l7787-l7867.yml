canonical_text:
  quote: ''
  summary: Crunden's wife warns him not to mention her at a public fair. After Crunden
    boasts that she can outrun the king's horses, the king detains him and forces
    her, though close to childbirth, to race. She wins, gives birth to a boy and a
    girl at the goal, cries out in pain, and lays a generational curse of childbirth-like
    weakness on the men of Ulster, excepting Cuchulain.
  language: English
  quote_policy: summarized
