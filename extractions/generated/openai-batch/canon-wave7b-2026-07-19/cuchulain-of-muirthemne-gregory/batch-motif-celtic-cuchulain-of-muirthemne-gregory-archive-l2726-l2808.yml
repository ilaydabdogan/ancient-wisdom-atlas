  summary: Maeve and Findabair observe and interpret approaching chariots. Maeve identifies
    Laegaire as a dangerous warrior whose anger would require appeasement. Findabair
    describes another chariot, its horses, vehicle, and fair armed rider; Maeve identifies
    him as Conall Cearnach and warns of the destruction he could cause. Findabair
    then describes a third chariot with two powerful horses, one breathing fire, and
    a dark, sad rider, but the passage cuts off before the rider is named.
