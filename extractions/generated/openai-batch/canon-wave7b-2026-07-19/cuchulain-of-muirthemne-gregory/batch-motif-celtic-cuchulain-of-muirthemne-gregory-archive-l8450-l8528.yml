canonical_text:
  quote: ''
  summary: 'Maeve and Fergus meet Cuchulain at Glen Ochain; Maeve again makes offers,
    which Cuchulain refuses. After Cuchulain kills many of the men of Ireland over
    several nights, Maeve sends Mac Roth the herald with further offers. Laeg describes
    Mac Roth’s appearance and heraldic tokens. Mac Roth delivers offers, Cuchulain
    identifies himself and refuses them, then hints at the only acceptable terms:
    one man from the army must meet him in single combat each day, while the army
    may march during the fight and must halt after the fighter is killed. Maeve accepts
    this arrangement as preferable to greater losses.'
  language: English
  quote_policy: summarized
