canonical_text:
  quote: Og, son of the Dagda, is wasting away these two years with love of a woman
    he saw in his dreams
  summary: Angus Og is sick with love for a woman seen in dreams. Bodb searches Ireland
    and finds a matching girl, Caer Ormaith, among many young women by the sea. Her
    identity and parentage are learned, but she cannot be taken away. Dagda seeks
    help from Ailell and Maeve; Caer's father Ethal refuses and later says a greater
    power or enchantment is over her.
  language: English
  quote_policy: quoted
