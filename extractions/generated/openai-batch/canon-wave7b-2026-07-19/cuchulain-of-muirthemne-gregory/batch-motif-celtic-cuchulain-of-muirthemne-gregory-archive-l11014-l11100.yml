canonical_text:
  quote: ''
  summary: Laeg summons the men of Ulster in Cuchulain's name, and they rush to battle
    with weapons in hand. Conchubar restrains his own deployment until daylight, while
    Maeve sends out triadic companies and, according to one report, three unseen Sidhe
    youths in shining armour stir courage in the army. Maeve urges Fergus to fight;
    after Caladcholg, a sword from the Sidhe country, is restored to him, Fergus helps
    drive Ulster back three times, confronts Conchubar, and strikes the shield Ochain
    so that shields and the three waves of Ireland answer its cry.
  language: English
  quote_policy: summarized
