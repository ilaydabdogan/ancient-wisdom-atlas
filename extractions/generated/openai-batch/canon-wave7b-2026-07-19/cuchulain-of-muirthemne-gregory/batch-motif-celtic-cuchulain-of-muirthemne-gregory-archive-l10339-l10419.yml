canonical_text:
  quote: ''
  summary: Cethern has his wounds examined by Fingan, who identifies the kinds of
    attackers; Cuchulain names several of them, including sons of Ailell and Maeve,
    Ailell with Maine Andoe, and Maeve herself. Fingan offers Cethern a choice between
    prolonged helpless survival and a brief restoration enabling vengeance. Cuchulain
    gathers cattle from the men of Ireland for a Druid bath, in which Cethern remains
    for three days and nights before rising to take his chariot. An expelled physician
    warns the men of Ireland, who disguise a pillar-stone with Ailell's clothes and
    crown; Cethern mistakes it for Ailell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cuchulain identifies two richly dressed and armed men as Maine Athremail and
    Maine Mathremail, sons of Ailell and Maeve.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fingan examines one of Cethern's wounds and says it was made by a father and
    son; Cethern describes two large men with flaming eyes, gold bands, kingly dress,
    and gold swords.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cuchulain identifies the father-and-son pair as Ailell and his son Maine Andoe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fingan examines another wound and says it is the work of a proud woman; Cethern
    describes a pale, yellow-haired woman with a crimson cloak, gold brooch, and red
    shining spear who wounded him and received a small wound from him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cuchulain identifies the woman as Maeve, daughter of the High King of Ireland
    and Queen of Connaught.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fingan gives Cethern an unfavorable prognosis, and Cethern responds by kicking
    at him to drive him out of the house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Fingan offers Cethern a choice: remain long on his bed until the men of Ulster
    avenge him, or be made well enough after three days to spend his remaining strength
    on his enemies.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Cethern chooses the brief restoration because he does not want to leave his
    enemies after him and wants satisfaction from them himself.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Cuchulain takes cattle from the camp of the men of Ireland; their flesh, bones,
    and skins are used to make a Druid bath for Cethern.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Cethern is placed in the Druid bath for three days and three nights, then
    rises and enters his chariot to seek vengeance on the men of Ireland.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Cethern's wife londa, daughter of Eochaid, comes from the North and brings
