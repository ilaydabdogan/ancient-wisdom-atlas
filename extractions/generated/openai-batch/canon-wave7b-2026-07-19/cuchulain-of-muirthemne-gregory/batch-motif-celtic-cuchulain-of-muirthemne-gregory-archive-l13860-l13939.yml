canonical_text:
  quote: ''
  summary: Badb disguises herself first as one of Niamh's women and then as Niamh,
    separates Niamh and other women from the feast by an enchanted mist, and deceives
    Cuchulain into thinking Niamh has given him leave to go out. Cuchulain receives
    warnings from a brooch, from Cathbad and Niamh, and from the horses' refusal,
    but continues toward departure.
  language: English
