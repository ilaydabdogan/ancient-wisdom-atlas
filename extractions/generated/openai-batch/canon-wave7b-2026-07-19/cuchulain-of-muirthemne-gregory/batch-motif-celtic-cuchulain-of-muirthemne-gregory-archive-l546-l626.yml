canonical_text:
  quote: ''
  summary: Cuchulain tests and accepts Conchubar's chariot, visits the boy troop for
    good-luck wishes on the day he has taken arms, and drives toward the watchers'
    ford. At the boundary ford Conall Cearnach, the appointed champion on watch, blesses
    him but warns that he is too young for champion work. Cuchulain asks to keep the
    watch, then says he will go toward Lough Echtra to redden his arms. When Conall
    follows to protect him, Cuchulain breaks Conall's chariot yoke with a stone so
    that Conall returns to the ford. Cuchulain continues south while Jubair urges
    returning to Emain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Conchubar orders Jubair to prepare his own chariot and horses for the boy;
    the boy shakes and strains the chariot, it bears him, and he says it suits him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cuchulain refuses to let the horses graze yet and asks to drive to the boy
    troop so they can wish him good luck on the day of his taking arms.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The lads ask whether Cuchulain has taken arms; when he says yes, they wish
    him success in wounding, first killing, and spoil-winning, while regretting that
    he has left playing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cuchulain asks where the great road by Emain leads, and Jubair identifies
    it as the road to Ath-an-Foraire, the watchers' ford in Slieve Fuad.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jubair explains that a choice champion of Ulster keeps watch at the ford each
    day to fight any stranger who comes to the boundary with a challenge, and says
    Conall Cearnach is there that day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the water's edge Conall asks whether Cuchulain has taken arms, wishes triumph,
    victory, and first blood for him, but says he is too ready and not yet fit for
    champion work.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cuchulain asks Conall to leave the watch for one day so that he can keep it;
    Conall refuses because Cuchulain is not yet able to stand against trained fighting
    men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Cuchulain says he will go to the shallows of Lough Echtra to see if he can
    redden his arms on either friend or enemy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Conall says he will go with Cuchulain to care for and protect him, because
    Ulster would avenge it on Conall if he let Cuchulain go alone into a strange country.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Conall follows in his chariot; Cuchulain thinks that Conall would not let
    him do a great thing if the chance arose.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Cuchulain throws a fist-sized stone at the yoke of Conall's chariot, breaks
    it, brings the chariot down, and throws Conall sideways to the ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Conall says he will go no farther and returns to his place at the ford; Cuchulain
    says this is what he wanted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Cuchulain goes on toward Lough Echtra in the south, while Jubair advises returning
    to Emain because the carving of food is beginning there.
  category: sequence
  evidence_refs:
  - ev:7
