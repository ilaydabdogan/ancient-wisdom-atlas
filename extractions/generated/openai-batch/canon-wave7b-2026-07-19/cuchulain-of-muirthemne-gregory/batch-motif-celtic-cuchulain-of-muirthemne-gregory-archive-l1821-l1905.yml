canonical_text:
  quote: ''
  summary: The passage describes Emain Macha as Conchubar's royal and assembly center,
    details the palace and its houses, explains the storage of weapons and trophies,
    names warning and hero shields, and recounts how Cuchulain obtained a uniquely
    patterned shield from the shield-maker Mac Enge with the help of a strange man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Conchubar and the chief men of Ulster give an unnamed female referent a great
    welcome.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Emain Macha is also called Macha of the Spears and is the site of Conchubar's
    Assembly House of Ulster and chief palace.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The palace contains three houses: the Royal House, the Speckled House, and
    the House of the Red Branch.'
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Royal House is described as having three times fifty rooms, red yew walls
    with copper rivets, and Conchubar's decorated room with bronze, silver, gold birds,
    carbuncles, and tall partitions near the fire.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Conchubar has a silver rod with three golden apples, and shaking or striking
    it makes everyone in the house silent.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The House of the Red Branch keeps the heads and weapons of defeated enemies.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Speckled House keeps the swords, shields, spears, drinking-cups, and horns
    associated with the heroes of Ulster, and its name is explained by the brightness
    and colors of these objects.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The men of the Red Branch customarily seek immediate satisfaction for insults,
    even by attacking in the feasting hall, so arms are stored together in one place
    to prevent this.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Conchubar's shield Ochain, called the Moaning One, moans when Conchubar is
    in danger, and all the shields of Ulster moan in answer.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Several named shields are listed as being stored with Ochain, including shields
    associated with Conall Cearnach, Fergus, Dubthach, Laegaire, Sencha, and Celthair.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The men of the Red Branch have a law that every shield must have a different
    carved device.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: Cuchulain asks Mac Enge to make him a shield with a new device after returning
    from Scathach.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Mac Enge says he cannot make a new device because he has already used all
    his designs on the shields of the men of Ulster.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Cuchulain becomes angry and threatens Mac Enge with death, regardless of Conchubar's
    protection.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: A strange man tells Mac Enge to clear out his workshop and spread ashes a
    foot deep on the floor.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The strange man comes over the outer wall with a two-pronged fork and uses
    it to make the shield pattern in the ashes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Cuchulain receives the shield, and it is named Dubhan, the Black One.
  category: object
  evidence_refs:
  - ev:10
