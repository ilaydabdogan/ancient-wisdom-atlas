canonical_text:
  quote: ''
  summary: Fiacha rescues Cuchulain by cutting the hands from Calatin and his sons.
    Cuchulain then destroys them; one survivor reaches Ailell and Maeve's tent, says
    Fiacha's name, and dies, leading others to interpret the word as Irish for debt.
    A marked stone at the ford is noted. The men of Ireland choose Ferdiad to fight
    Cuchulain because they are closely matched and trained by the same teachers; Ferdiad
    first refuses because Cuchulain is his friend and fellow pupil, but Maeve coerces
    him with threatened satires and entices him with honor, drink, and rewards.
  language: English
  quote_policy: summarized
