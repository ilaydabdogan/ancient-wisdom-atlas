canonical_text:
  quote: ''
  summary: The Blessed One travels with Ananda and a company of monks to the Mallas'
    Sala Grove beyond the Hiranyavati, asks for a couch to be prepared between twin
    Sala trees, and lies down mindfully on his right side. The trees bloom out of
    season, heavenly flowers, sandalwood powder, music, and songs appear in reverence,
    and the Blessed One teaches that true honor is ethical practice according to the
    precepts. Upavana stands fanning him and is told to move aside; Ananda asks why.
    The Blessed One explains that gods and spirits from many world-systems have assembled
    to behold the Tathagata before his death.
  language: English
  quote_policy: summarized
