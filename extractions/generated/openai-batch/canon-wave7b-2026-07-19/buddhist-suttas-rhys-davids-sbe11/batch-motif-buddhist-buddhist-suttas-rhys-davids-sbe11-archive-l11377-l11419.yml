  summary: The passage teaches that a brother who has not abandoned passion, desire,
    attraction, thirst, fever, and craving for a body or for a form will not incline
    toward zeal, exertion, perseverance, and struggle, and therefore has not broken
    through the second or third spiritual bondage. A note relates the paragraph to
    the seventh Sawyo^ana.
