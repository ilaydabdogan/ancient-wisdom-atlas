canonical_text:
  quote: ''
  summary: A king of Magadha, intending to attack and ruin the Vaggians/Vajjians,
    sends the Brahman Vassakara, his prime minister, to the Blessed One. The envoy
    is to bow, inquire after the Blessed One's health, report the king's war plan,
    remember whatever the Blessed One predicts, and repeat it to the king. Vassakara
    obeys, has carriages prepared, leaves Rajagaha with his train, and travels toward
    Vulture's Peak. A note glosses the enemies' power as social and military rather
    than supernatural.
  language: English
  quote_policy: summarized
