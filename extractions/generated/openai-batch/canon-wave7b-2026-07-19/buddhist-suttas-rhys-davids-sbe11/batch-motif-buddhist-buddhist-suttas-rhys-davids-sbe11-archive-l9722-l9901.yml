canonical_text:
  quote: ''
  summary: Gotama questions Vāseṭṭha with a river-crossing simile, identifies five
    hindrances as veils and obstacles, argues that Brahmans versed in the Three Vedas
    cannot become united with Brahma while unlike Brahma in conduct and qualities,
    and describes their threefold wisdom as barren and destructive imagery. Vāseṭṭha
    then says he has heard Gotama knows the way to union with Brahma.
