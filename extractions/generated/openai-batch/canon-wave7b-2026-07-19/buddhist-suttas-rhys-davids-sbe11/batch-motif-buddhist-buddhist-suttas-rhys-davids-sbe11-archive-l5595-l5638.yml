canonical_text:
  quote: ''
  summary: 'A report to Ananda says that the smith''s food offering was the last meal
    eaten by the Tathagata before death, but should not be a cause of remorse. The
    passage says two food offerings are uniquely fruitful: the offering eaten before
    the Tathagata attains supreme insight, and the offering eaten before the Tathagata
    passes away in the final passing-away. The smith is said to have laid up beneficial
    karma. The Blessed One then utters a hymn on giving, self-restraint, casting off
    sinfulness, and reaching Nirvana by rooting out lust, bitterness, and delusion.'
  language: English
  quote_policy: summarized
