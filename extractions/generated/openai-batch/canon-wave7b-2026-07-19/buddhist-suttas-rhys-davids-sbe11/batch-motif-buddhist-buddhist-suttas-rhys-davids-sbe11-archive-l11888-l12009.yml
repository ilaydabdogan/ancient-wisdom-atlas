canonical_text:
  quote: How transient are all component things! Growth is their nature and decay.
  summary: Mahā Sudassana teaches Subhaddā that all compounded things are impermanent,
    arise and dissolve, and find their best state in cessation. A commentary explains
    compounds as conditioned material and mental constituents, compares them to phantom,
    mirage, and foam, and identifies cessation of the round of life with Nirvana.
    Mahā Sudassana then exhorts the multitude to give gifts, observe precepts, and
    keep sacred days, and he becomes an inheritor of the world of the gods. The Master
    closes by identifying the former characters with figures in the Buddha’s circle.
  language: English
  quote_policy: quoted
