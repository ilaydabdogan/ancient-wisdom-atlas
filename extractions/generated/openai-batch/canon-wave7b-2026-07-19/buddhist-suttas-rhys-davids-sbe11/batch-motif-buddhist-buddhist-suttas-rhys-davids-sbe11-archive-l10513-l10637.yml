canonical_text:
  quote: ''
  summary: Gotama describes a Bhikkhu pervading the whole world in all directions
    with love, then with pity, sympathy, and equanimity. Through dialogue with Vāseṭṭha,
    he argues that the Bhikkhu's freedom from household cares, anger, malice, impurity,
    and lack of self-mastery makes union with similarly described Brahma possible
    after death. Vāseṭṭha and Bharadvāja praise the teaching through images of restoration,
    revelation, guidance, and light, and take refuge in the Blessed One, the Truth,
    and the Brotherhood.
  language: English
  quote_policy: summarized
