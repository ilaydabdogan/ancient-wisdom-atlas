  text: The practitioner puts away lying, abstains from falsehood, speaks truth, remains
    faithful and trustworthy, and does not injure his fellow man by deceit.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The practitioner puts away slander, does not repeat what he hears in one place
    to raise quarrels in another, and is described as a binder together, encourager
    of friends, peacemaker, lover of peace, and speaker of words that make for peace.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The practitioner puts away bitterness of speech and harsh language, and speaks
    words described as humane, pleasant, lovely, heart-reaching, urbane, pleasing,
    and beloved.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The practitioner puts away foolish talk and vain conversation, speaks in season,
    speaks what is factual, and utters good doctrine and discipline that are profitable,
    well-grounded, well-defined, and full of wisdom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The practitioner refrains from injuring any herb or creature.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The practitioner takes one meal a day, abstains from food at night or at the
    wrong time, and abstains from dancing, singing, music, theatrical shows, garlands,
    scents, unguents, lofty couches, and large beds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The practitioner abstains from getting silver or gold, uncooked grain, raw
