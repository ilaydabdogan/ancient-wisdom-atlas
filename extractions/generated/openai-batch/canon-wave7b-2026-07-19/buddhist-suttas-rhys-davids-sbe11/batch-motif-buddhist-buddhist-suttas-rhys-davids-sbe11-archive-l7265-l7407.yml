canonical_text:
  quote: ''
  summary: 'After hearing Ananda, the Mallas of Kusiniri lament the death of the Blessed
    One. They gather perfumes, garlands, music, and garments, honor the body at the
    S&la Grove for several days, and delay cremation. On the seventh day they plan
    to carry the body south, but eight prepared chieftains cannot lift it. Anuruddha
    explains that the spirits intend a different route: north of the city, through
    the north gate and city center, out the eastern gate, to the Mallas'' shrine Maku/a-bandhana.
    The Mallas agree; heavenly Mand&rava flowers cover Kusiniri, and spirits and Mallas
    honor and carry the body to the shrine. The Mallas then ask Ananda what should
    be done with the Tathigata''s remains, and he says they should be treated as the
    remains of a king of kings.'
  language: English
  quote_policy: summarized
