  quote: ''
  summary: The passage opens Chapter III. The Blessed One goes into Vesali for alms,
    returns, eats rice, and tells Ananda to take up a mat so they may spend the day
    at a named cetiya. Ananda follows him. At the cetiya, the Blessed One sits on
    the mat, Ananda sits respectfully beside him, and the Blessed One praises Vesali
    and several cetiyas before beginning a statement about the four paths to Iddhi.
    Source notes identify a recurrence in the Samyutta Nikaya and explain the four
    paths to Iddhi.
