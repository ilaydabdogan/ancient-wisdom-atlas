canonical_text:
  quote: ''
  summary: Pukkusa and the Blessed One discuss accounts of conscious wakefulness in
    which a renunciant neither sees nor hears loud events nearby. The Blessed One
    contrasts a report involving five hundred carts with his own account of remaining
    unaware of a violent storm that killed two peasant brothers and four oxen. Pukkusa
    transfers his faith from Āḷāra Kālāma to the Blessed One, declares refuge in the
    Blessed One, the Truth, and the Brotherhood, and offers golden robes, one of which
    is assigned to Ānanda.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A reported conscious and awake lord neither saw nor heard five hundred carts
    passing close by, though his robe was sprinkled with their dust.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An observer described this as wonderful and marvellous calm among those who
    have gone forth out of the world and then expressed deep faith in Āḷāra Kālāma.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One asks Pukkusa whether it is more difficult to miss the sight
    and sound of five hundred nearby carts or to miss rain, lightning, and thunderbolts
    while conscious and awake.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pukkusa answers that missing the storm phenomena while conscious and awake
    is more difficult than missing even hundreds and thousands of carts.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Atumi, during rain, lightning, and thunderbolts, two peasant brothers and
    four oxen were killed, and a great multitude went to the place where they lay.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Blessed One says he had been at the threshing-floor entrance, walking
    up and down thinking, when a man from the crowd approached and saluted him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In dialogue with the man, the Blessed One says he was present, saw nothing,
    heard nothing, was not asleep, and was conscious.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The man admires the calm of those gone forth, declares deep faith in the Blessed
    One, and departs respectfully.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Pukkusa says he winnows and washes away his former faith in Āḷāra Kālāma and
    praises the Blessed One's words through images of setting up the fallen, revealing
    the hidden, pointing out the road, and bringing a lamp into darkness.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Pukkusa declares refuge in the Blessed One, the Truth, and the Brotherhood,
    and asks to be accepted as a disciple and true believer for life.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Pukkusa orders a man to fetch a pair of burnished cloth-of-gold robes, and
    the man brings them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Pukkusa presents the cloth-of-gold robes to the Blessed One, who tells him
