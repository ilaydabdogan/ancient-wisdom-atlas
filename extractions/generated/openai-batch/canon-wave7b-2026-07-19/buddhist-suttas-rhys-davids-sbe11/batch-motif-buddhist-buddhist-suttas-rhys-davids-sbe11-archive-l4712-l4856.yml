canonical_text:
  quote: ''
  summary: In Chapter IV, the Blessed One makes an alms round in Vesali, looks back
    at the city, declares that it will be his last sight of Vesali, and travels onward
    with Ananda and the brethren. At a village he teaches that failure to understand
    four truths has prolonged transmigration, while realizing noble conduct, meditation,
    wisdom, and freedom ends craving and renewed birth. A verse presents Gotama as
    knower and proclaimer of these truths and says that the master must die. The passage
    continues with teachings on conduct, contemplation, intelligence, further travel,
    and an announcement of four Great References at Ananda Cetiya.
  language: English
  quote_policy: summarized
