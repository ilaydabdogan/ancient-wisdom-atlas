canonical_text:
  quote: ''
  summary: Introductory commentary to the Akankheyya Sutta compares it with the Tevijja
    Sutta. It says both redirect seekers—one seeking union with the Deity through
    Vedic knowledge, the other seeking various desired things—toward upright conduct,
    earnestness, and spiritual insight. The passage presents these as leading to the
    Nirvi/za of Arahatship, and notes the Sutta’s uncertain but somewhat favorable
    stance toward mystical powers.
