canonical_text:
  quote: ''
  summary: The passage gives conditional instructions for a Bhikkhu who desires either
    heavenly no-return after destroying the five bonds or the exercise of various
    Iddhis, including multiplication, invisibility, passing through barriers, walking
    on water, sky travel, touching the sun and moon, and bodily reaching the heaven
    of Brahma. In both cases the required discipline is righteousness, inward quietude,
    contemplation, insight, and solitude. Translator notes explain opapatika and cite
    parallels in other Buddhist suttas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikkhu is conditionally described as desiring the complete destruction
    of the five Bonds, becoming an inheritor of the highest heavens, passing entirely
    away there, and never returning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prescribed discipline is to fulfil all righteousness, cultivate inward
    quietude of heart, not reject the ecstasy of contemplation, look through things,
    and be much alone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The translator's note explains opapatika as a being that appears without parental
    intervention; it also says higher devas are opapatika and that karma is the cause
    of such appearance from a Buddhist point of view.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Iddhis listed include becoming multiform from being one, becoming one
    from being multiform, becoming visible, and becoming invisible.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Iddhis listed also include passing through a wall, fence, or mountain
    as if through air; moving through solid ground as if through water; walking on
    water as if on solid ground; travelling cross-legged through the sky; touching
    the sun and moon; and bodily reaching the heaven of Brahma.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Editorial notes direct comparison with passages in the Mahaparinibbana Sutta
    and the Samanna Phala Sutta.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
