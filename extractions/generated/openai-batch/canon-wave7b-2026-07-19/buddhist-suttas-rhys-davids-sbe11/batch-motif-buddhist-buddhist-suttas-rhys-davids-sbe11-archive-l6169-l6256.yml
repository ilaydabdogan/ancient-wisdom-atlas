canonical_text:
  quote: ''
  summary: The Blessed One praises Ananda's long loving service, exhorts him toward
    freedom from sensuality, individuality, delusion, and ignorance, tells the brethren
    that past and future Arahat-Buddhas have equally devoted servitors, calls Ananda
    wise in knowing proper times for visits to the Tathagata, and compares Ananda's
    four marvellous audience-affecting qualities to those of a king of kings.
  language: English
  quote_policy: summarized
