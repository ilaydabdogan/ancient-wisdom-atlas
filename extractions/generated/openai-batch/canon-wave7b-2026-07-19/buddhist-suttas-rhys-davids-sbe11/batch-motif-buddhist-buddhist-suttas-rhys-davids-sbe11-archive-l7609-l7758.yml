canonical_text:
  quote: "“neither soot nor ash was seen : and only the bones remained behind.”"
  summary: After the Blessed One’s cremation, only bones remain. Waters from sky and
    beneath the earth, along with perfumed water brought by the Mallas of Kusinara,
    extinguish the funeral pile. The Mallas guard and honor the bones for seven days.
    Several rulers and communities request shares of the relics to build sacred cairns
    and hold feasts, but the Mallas of Kusinara refuse; Dona the Brahman then addresses
    the assembly.
  language: English
  quote_policy: quoted
