canonical_text:
  quote: ''
  summary: The passage prescribes royal funerary treatment for the Tathagata's remains,
    describes the Mallas preparing the Blessed One's body and funeral pile, recounts
    Mahakassapa learning of the death from a naked ascetic bearing a Mandarava flower,
    contrasts grieving monks with composed Arahats, records Subhadda's rejection of
    discipline and Mahakassapa's reminder of impermanence, and explains that spirits
    prevent the pyre from catching fire until Mahakassapa can salute the Blessed One's
    sacred feet.
  language: English
  quote_policy: summarized
