canonical_text:
  quote: ''
  summary: 'In this passage, the Great King of Glory receives and tests several wondrous
    treasures: an elephant that submits to control and carries him to the ocean boundary
    and back by morning meal; a sky-flying Horse Treasure named Thunder-cloud that
    likewise submits and makes the same journey; a bright eight-faceted Gem-Treasure
    whose radiance spreads widely and enables night marching as if it were daylight;
    and the initial appearance of a beautiful Woman-Treasure.'
  language: English
  quote_policy: summarized
