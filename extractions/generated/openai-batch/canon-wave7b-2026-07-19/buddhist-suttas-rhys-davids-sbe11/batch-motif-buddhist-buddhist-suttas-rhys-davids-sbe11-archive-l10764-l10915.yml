canonical_text:
  quote: ''
  summary: 'At Sāvatthi in Anātha Piṇḍika''s park, the Blessed One addresses the Bhikkhus.
    He instructs them to continue in Right Conduct, the Rules of the Order, and the
    Precepts. He then gives a series of conditional teachings: if a Bhikkhu desires
    esteem, requisites, benefit for donors or deceased relatives, mastery over inner
    obstacles, contemplative bliss, incorporeal deliverance, freedom from rebirth
    in suffering, or the first-returner attainment, he should fulfil righteousness,
    cultivate inward quietude, sustain contemplation, look through things, and live
    much alone.'
  language: English
  quote_policy: summarized
