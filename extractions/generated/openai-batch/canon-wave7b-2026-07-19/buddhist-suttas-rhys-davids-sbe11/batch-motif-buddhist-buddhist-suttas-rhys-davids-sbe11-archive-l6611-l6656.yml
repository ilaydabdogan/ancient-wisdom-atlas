canonical_text:
  quote: Void are the systems of other teachers — void of true saints.
  summary: In direct address to Subhadda, the passage states that where the Noble
    Eightfold Path is found, true saintliness of four degrees is found. It asserts
    that this doctrine and discipline alone contains that path and true saintliness,
    while other teachers' systems lack true saints. The passage urges the brethren
    to live the Right Life so the world will not be without Arahats. Translator notes
    explain Arahats as those who have reached Nirvana and list the eight right divisions
    of the Noble Path.
  language: English
  quote_policy: quoted
