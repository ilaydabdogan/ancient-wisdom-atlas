canonical_text:
  quote: Great is the fruit, great the advantage of earnest contemplation when set
    round with upright conduct.
  summary: The passage reports the Blessed One teaching the brethren about upright
    conduct, earnest contemplation, and intelligence; then traveling with Ananda and
    a large company of brethren from Rājagaha on Vultures Peak to Ambalaṭṭhikā, and
    onward to Nālandā, where he stays in Pāvārika's mango grove. A footnote explains
    the translation of samādhi and comments on the relation of samādhi, paññā, and
    sīla.
  language: English
  quote_policy: quoted
