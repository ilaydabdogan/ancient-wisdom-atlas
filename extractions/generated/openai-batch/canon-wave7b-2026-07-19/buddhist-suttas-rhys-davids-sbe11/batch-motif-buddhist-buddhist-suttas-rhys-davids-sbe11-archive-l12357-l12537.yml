  quote: ''
  summary: The passage describes wind-shaken palms producing enchanting sound in Kusavati;
    the Great King of Glory as possessor of seven precious things; the appearance
    and activation of the heavenly Wheel Treasure; the wheel-led submission of rival
    kings in the four directions; the king's ethical injunctions to those kings; the
    wheel's return to Kusavati; and the appearance of the white flying Elephant Treasure.
  language: English
  quote_policy: summarized
