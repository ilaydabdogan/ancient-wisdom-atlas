canonical_text:
  quote: ''
  summary: Gotama uses the example of a chained man unable to cross a river, then
    identifies five desirable sensory objects as a chain and bond. He says Brahmans
    versed in the Three Vedas cling to these objects and therefore cannot, after death,
    become united with Brahma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gotama asks whether a man in a chain could cross from this bank of the river
    A&ravatl to the further bank, and Vāseṭṭha answers that he could not.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage calls five things leading to lust a "chain" and a "bond" in the
    Discipline of the Noble One.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The five things are forms seen by the eye, sounds heard by the ear, odours
    smelled by the nose, tastes perceived by the tongue, and substances touched by
    the body; they are described as desirable, agreeable, pleasant, attractive, accompanied
    by lust, and causing delight.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Brahmans versed in the Three Vedas are described as clinging to the five things,
    being infatuated by them, being guilty of them, not seeing their danger, not knowing
    their unreliability, and enjoying them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says these Brahmans omit the practice of qualities that make a
    man a Brahman and adopt qualities that make men non-Brahmans.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the condition in which such Brahmans become united
    to Brahma after death, on the dissolution of the body, has no existence.
  category: sequence
  evidence_refs:
  - ev:4
