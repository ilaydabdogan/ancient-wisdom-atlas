canonical_text:
  quote: ''
  summary: The passage is translator's commentary on Buddhist reinterpretations of
    Brahman/tevijja and Brahma. It says Vedic knowledge is replaced by knowledge of
    Buddhist doctrine; Hindu gods and spirits are retained but treated as impermanent,
    subordinate beings subject to dissolution and rebirth; Brahma is included among
    such beings while also being described as a superior, devout celestial king who
    supports the Buddha in several episodes. The passage rejects describing early
    Buddhists as monotheists and says union with Brahma would only be temporary heavenly
    existence.
  language: English
  quote_policy: summarized
