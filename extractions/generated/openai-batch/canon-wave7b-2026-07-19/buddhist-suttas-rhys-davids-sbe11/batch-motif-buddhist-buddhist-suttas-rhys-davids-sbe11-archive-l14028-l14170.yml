canonical_text:
  quote: "“Thus impermanent, Ananda, are component things; thus transitory, Ananda,
    are component things.”"
  summary: The Blessed One recounts former royal possessions and the one item from
    each class that he actually used, teaches Ananda that such things have ended and
    vanished, recalls repeated burials of his body at the same spot, states that the
    Tathagata will not lay aside his body there an eighth time, and closes with a
    verse on arising and dissolution.
  language: English
  quote_policy: quoted
