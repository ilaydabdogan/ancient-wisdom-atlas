canonical_text:
  quote: vanished from this side of the river, and stood on the further bank with
    the company of the brethren.
  summary: After thanking ministers, the Blessed One departs. Followers propose naming
    the gate and ferry after Gotama. At the overflowing Ganges, people seek boats
    and rafts, but the Blessed One instantly vanishes from one bank and stands on
    the other with the brethren. Seeing the people seeking boats and rafts, he recites
    a song contrasting those who cross by a solid path with the vain world tying basket
    rafts, calling the former wise and saved.
