canonical_text:
  quote: ''
  summary: The passage argues about whether the author of the Book of the Great Decease
    intentionally omitted the First Council at Rājagaha. It notes that the author
    was describing the Buddha’s death rather than the history of the Canon or Order,
    and claims that the Subhadda incident conflicts with the Culla-vagga narrative
    of the Rājagaha Council. It also observes that the narrative could have ended
    with lamentations over the Buddha’s death, including an exclamation attributed
    to Sakka, but instead continues with cremation, relic distribution, commemorative
    feasts, and Kassapa’s arrival.
  language: English
