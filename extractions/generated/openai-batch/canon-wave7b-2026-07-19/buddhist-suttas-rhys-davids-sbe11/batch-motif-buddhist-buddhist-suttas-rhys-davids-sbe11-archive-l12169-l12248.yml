canonical_text:
  quote: ''
  summary: At Kusinira, in the Sila grove of the Mallas and between twin Sila trees,
    the Blessed One is near death. Ananda asks that he not die in this small jungle
    town but in a great city where wealthy believers can honor his remains. The Blessed
    One tells Ananda not to speak so, because the place was once the royal city Kusivati
    of King Mahi-Sudassana, a righteous king of kings who possessed the seven royal
    treasures. Kusivati is described as large, prosperous, crowded, well supplied
    with food, and comparable to the gods’ city Alakamanda.
  language: English
  quote_policy: summarized
