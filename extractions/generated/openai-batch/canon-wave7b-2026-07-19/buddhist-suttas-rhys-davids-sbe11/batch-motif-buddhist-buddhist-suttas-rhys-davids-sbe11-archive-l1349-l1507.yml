canonical_text:
  quote: ''
  summary: The passage catalogs Chinese works or translations associated with the
    Mahaparinibbana tradition, summarizes Beal's account of an alternate Great Decease
    narrative in which Buddha goes to Kusinagara, rests among Sala trees, receives
    food from Chanda, becomes ill, teaches and disputes through the night, dies at
    dawn, is honored by bending Sala trees, is cremated, and becomes the subject of
    disputes over his ashes. The passage then compares such works cautiously with
    the Pali book and discusses cremation and burial customs in Buddhist and Ceylonese
    contexts.
  language: English
