  quote: ''
  summary: 'A modern introduction discusses an argument from silence: the Mahaparinibbana-Sutta
    lacks an expected reference to post-Buddha depositions of Dhamma and Vinaya and
    to the First Council. The writer qualifies the conclusion as a strong probability
    rather than certainty, contrasts it with the Kullavagga account, and gives provisional
    dating suggestions for the texts.'
