canonical_text:
  quote: ''
  summary: 'The passage lists practices described as low arts and lying practices:
    predicting celestial, meteorological, agricultural, political, and bodily outcomes;
    drafting documents and accounts; giving medicines and composing verses; advising
    on marriage, alliances, property, spells, oracles, worship, fire-spitting, rituals,
    house rites, offerings, and medical procedures. A repeated refrain says that the
    exemplary subject refrains from seeking livelihood through such practices.'
