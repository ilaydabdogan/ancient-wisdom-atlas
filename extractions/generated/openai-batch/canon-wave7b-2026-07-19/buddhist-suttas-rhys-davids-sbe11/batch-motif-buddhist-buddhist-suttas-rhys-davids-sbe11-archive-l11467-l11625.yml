canonical_text:
  quote: ''
  summary: The passage states that a brother who remains affected by five kinds of
    spiritual barrenness and five kinds of mental or spiritual bondage cannot attain
    full growth in the doctrine and discipline, while one free from them can. It enumerates
    five barren states connected with doubt or lack of confidence in the Teacher,
    the Dhamma, the Sangha, the system of self-culture, and anger or discontent toward
    fellow-disciples. It then begins an enumeration of bondages, describing freedom
    from craving after lusts, body, and form, and from post-satiety indulgence in
    sleep, softness, and sloth. Each removal is said to incline the mind toward zeal,
    exertion, perseverance, and struggle.
  language: English
  quote_policy: summarized
