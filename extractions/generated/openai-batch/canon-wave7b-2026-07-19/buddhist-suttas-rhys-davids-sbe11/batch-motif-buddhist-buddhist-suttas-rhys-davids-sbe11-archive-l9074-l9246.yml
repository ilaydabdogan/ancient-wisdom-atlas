canonical_text:
  quote: "“which was the true path, and which the false”"
  summary: Two young Brahmans dispute which teacher’s path truly leads to union with
    Brahma. Unable to convince one another, they go to the Blessed One, Gotama, who
    is staying in a mango grove by the river. Vāseṭṭha recounts their disagreement
    and asks whether the various paths taught by different Brahman groups all lead
    to union with Brahma, comparing them to many paths near a village that meet in
    the village.
  language: English
  quote_policy: quoted
