canonical_text:
  quote: ''
  summary: The passage introduces and interprets the Buddhist discourse known as the
    foundation or inauguration of the Kingdom of Righteousness. It explains the wheel
    image as a royal chariot-wheel of Dhamma rather than a cyclic cosmological symbol,
    connects the image to earlier Vedic poetic imagery, and quotes a later poetic
    account of the Buddha's first preaching in which the personified evening, devas,
    Sakka, and innumerable beings gather to hear him. The passage also notes analogies
    with Christian Pentecost while rejecting likely borrowing.
  language: English
  quote_policy: summarized
