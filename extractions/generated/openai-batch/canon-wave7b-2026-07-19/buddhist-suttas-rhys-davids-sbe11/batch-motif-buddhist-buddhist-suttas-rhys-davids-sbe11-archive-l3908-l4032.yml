canonical_text:
  quote: "“this earth quakes and trembles and is shaken violently”"
  summary: 'The passage lists sacred events in the career of a Bodhisatta or Tathagata
    that cause a mighty earthquake: descent into the mother’s womb, leaving the womb,
    enlightenment, founding the kingdom of righteousness, rejection of remaining life,
    and final passing away. It then names eight kinds of assemblies and begins a recollection
    of entering an assembly and matching its color and voice. Translator notes discuss
    related conception legends and comparisons.'
  language: English
