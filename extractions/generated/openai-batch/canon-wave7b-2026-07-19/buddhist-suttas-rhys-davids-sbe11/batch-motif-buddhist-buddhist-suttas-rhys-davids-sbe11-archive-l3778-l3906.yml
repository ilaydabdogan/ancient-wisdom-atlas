canonical_text:
  quote: '"At the end of three months from this time the Tathagata will die !"'
  summary: Mara urges the Blessed One to pass away, arguing that the order and lay
    disciples are now trained and the religion is widespread. The Blessed One tells
    Mara that his final extinction will occur in three months. At the Capala Cetiya
    he deliberately rejects the rest of his allotted life; an earthquake and thunder
    follow. Ananda asks about the cause of the earthquake, and the Blessed One begins
    listing eight causes, including a cosmological structure of earth resting on water,
    water on wind, and wind on space, and the power of certain ascetics, Brahmans,
    gods, or fairies to shake the earth through meditation.
  language: English
  quote_policy: quoted
