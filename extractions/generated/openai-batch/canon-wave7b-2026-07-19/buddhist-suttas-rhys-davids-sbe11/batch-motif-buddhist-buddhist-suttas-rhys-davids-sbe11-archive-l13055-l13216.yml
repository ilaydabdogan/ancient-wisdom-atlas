canonical_text:
  quote: ''
  summary: Sakka instructs Vissakamma to create for the Great King of Glory a palace
    called Righteousness. Vissakamma descends from the heaven of the Thirty-Three,
    receives the king’s silent consent, and creates the palace. The passage describes
    its dimensions, precious materials, pillars, seats, staircases, chambers, couches,
    metallic palm trees, a golden palm grove, double railings, and wind-shaken bell
    networks whose music causes some inhabitants of Kusavati to dance.
  language: English
  quote_policy: summarized
