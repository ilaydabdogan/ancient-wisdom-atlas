canonical_text:
  quote: ''
  summary: The passage describes the Great King of Glory’s immense royal retinue and
    wealth, including repeated groups and possessions numbered as four and eighty
    thousand. The king regulates the attendance of his state elephants through the
    Great Adviser. After many years, the Queen of Glory decides to visit him, prepares
    the harem, has the fourfold army arranged, and goes to the Palace of Righteousness.
    The king hears the multitude, tells the queen not to enter, orders a golden couch
    placed under a golden palm grove, lies down in a calm lion-like posture, and the
    queen fears he may be dead and urges him to renew desire for his possessions and
    life.
  language: English
  quote_policy: summarized
