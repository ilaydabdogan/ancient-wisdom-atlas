canonical_text:
  quote: ''
  summary: 'The passage lists the fifth through eighth stages of deliverance, then
    recounts two encounters with Māra: first, after the Buddha''s enlightenment near
    the Nerañjarā River, when Māra urges him to die and the Buddha refuses until his
    disciples and religion are established; second, at the Cāpāla cetiya, when the
    Buddha accepts final extinction in three months and rejects the remainder of his
    allotted life. Ānanda then begs the Buddha three times to remain through the kalpa,
    but the Buddha says the time for such a request has passed and faults Ānanda for
    not understanding earlier hints that he could have remained if asked.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The fifth through eighth stages of deliverance are described as successive
    mental states involving the infinity of reason, nothingness, neither ideas nor
    absence of ideas, and cessation of both sensations and ideas.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buddha recalls resting under the shepherd's Nigrodha tree on the bank
    of the river Nerañjarā immediately after reaching the great enlightenment.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Māra, called the Evil One, comes to the Buddha and urges him to pass away
    from existence and die.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Buddha replies that he will not die until brethren, sisters, and lay disciples
    of both sexes have become trained hearers able to learn, teach, explain, and defend
    the doctrine.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Buddha also says he will not die until his pure religion has become successful,
    prosperous, widespread, popular, and well proclaimed among men.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Māra comes again to the Buddha at the Cāpāla cetiya and repeats the same request
    that he pass away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Buddha tells Māra that the final extinction of the Tathāgata will take
    place before long, at the end of three months.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator states that the Tathāgata consciously and deliberately rejected
    the remainder of his allotted term of life at the Cāpāla cetiya.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ānanda asks the Blessed One to remain during the kalpa and live on for the
    good and happiness of multitudes, out of pity for the world, and for the welfare
    of gods and men.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ānanda repeats the request three times, and the Buddha replies that the time
    for making such a request has passed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ānanda cites a saying that one who has fully developed and mastered the four
    paths to saintship could, if desired, remain in the same birth for a kalpa or
    its remaining portion, and states that the Tathāgata has mastered them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Buddha says Ānanda is at fault because he failed to understand earlier
    clear hints; if Ānanda had asked then, the Buddha would have granted the request
    on the third appeal.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Buddha recalls an earlier occasion at Rājagaha on Vulture's Peak, where
    he praised the place and spoke to Ānanda about the ability of one who had mastered
    the four paths to remain for a kalpa if desired.
  category: setting
  evidence_refs:
  - ev:8
