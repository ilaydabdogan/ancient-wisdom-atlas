canonical_text:
  quote: ''
  summary: The passage states that a brother whose mind is angry and barren toward
    fellow-disciples does not incline toward zeal, exertion, perseverance, and struggle,
    and is not free from the fifth spiritual barrenness. It then asks who has not
    broken through the five kinds of spiritual bondage, defines the first as continued
    passion, desire, attraction, thirst, fever, and craving for lusts, and begins
    a further case concerning passion for a body.
