canonical_text:
  quote: ''
  summary: The passage teaches that certain Asavas are abandoned by avoiding unsuitable
    places, paths, and bad companions, and that others are abandoned by removing arisen
    lustful, angry, malicious, or otherwise wrong thoughts. It states that Asavas
    causing vexation and distress arise for one who does not avoid or remove them,
    but do not arise for one who does.
  language: English
