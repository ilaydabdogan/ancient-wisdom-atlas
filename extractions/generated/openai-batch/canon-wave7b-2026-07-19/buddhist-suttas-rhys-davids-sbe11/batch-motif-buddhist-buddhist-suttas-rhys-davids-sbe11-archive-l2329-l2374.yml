canonical_text:
  quote: ''
  summary: 'The passage gives conditions under which the brethren may be expected
    not to decline but to prosper: kindness in action, speech, and thought; impartial
    sharing of received goods; practice of unblemished virtues productive of freedom;
    and cherishing a saving faith that leads to the destruction of sorrow. Footnotes
    explain these virtues as freeing one from craving and as untarnished by craving
    or delusion.'
  language: English
  quote_policy: summarized
