canonical_text:
  quote: ''
  summary: The passage describes reported Ceylonese Buddhist funeral customs, including
    ceremonial cremation for high-status persons, possible preservation of a body
    in a hollowed tree pending royal permission, cremation on a pyre with canopy and
    plant decorations, and later burial customs at Galle involving washing, white
    cloth, lamps, perfumes, wailing, a decorated procession, Buddhist mendicants,
    grave-circling, recitation of the Refuges, an impermanence verse, and a water-pouring
    rite. It also notes corresponding ceremonies in Burma as reported by Bishop Bigandet.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons described as of greater quality are burned with ceremony after the
    body is laid out, washed with water, covered, and carried to burning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A slower procedure cuts and hollows a tree, places the disembowelled and embalmed
    body inside with pepper, and keeps it in the house until royal command permits
    burning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a courtier's cremation is not ordered by the king, the hollowed tree containing
    the body may be put into a hole in the house floor and covered.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For cremation, the body on a bedstead or in a hollowed tree is carried on
    men's shoulders to a burning place and placed on a wood pile.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: For a very high-status person, a canopy with painted cloth, cocoa-nuts, and
    green boughs may be built over the pyre before fire is applied.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: After cremation, ashes are gathered into a sugar-loaf-like shape, the place
    is hedged against wild beasts, and herbs are sown there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Galle, relatives wash and shave the corpse, clothe it in clean white cloth,
    place it on a bedstead under a white canopy, set lamps at head and foot, and use
    perfumes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The prepared coffin is covered with black cloth; the body is placed on it
    and sprinkled with lavender or rose-water while women bow and wail.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The grave may be in a cocoa-nut tope and decorated with a cloth-and-evergreen
    canopy, tender cocoa-nut leaves, flowers, and sometimes white cloth along the
    path.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The funeral procession begins with tom-tom beaters, followed by Buddhist mendicants
    under a portable white canopy, then the coffin carried by nearest male relatives;
    females are said not to take part in this final procession.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The coffin is carried three times around the grave, placed across the pit,
    and connected by a roll of white cloth held by the Bhikkhus while the people repeat
    the Refuges three times in Pali.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Priests repeat a Pali verse on the transience of component things, and then
    water is poured from a goblet into a cup on a plate while the Unnanses chant verses
    three times.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
