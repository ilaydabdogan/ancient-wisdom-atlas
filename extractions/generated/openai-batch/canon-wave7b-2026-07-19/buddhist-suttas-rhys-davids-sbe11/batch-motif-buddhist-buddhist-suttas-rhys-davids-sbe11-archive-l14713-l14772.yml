canonical_text:
  quote: ''
  summary: A teaching describes how a Bhikkhu cultivates named factors of higher wisdom.
    Cultivation prevents Asavas from arising, and Asavas are put away by insight,
    subjugation, right use, endurance, avoidance, removal, and cultivation. The completed
    Bhikkhu has destroyed craving, rolled away fetters, ended pain, and the Bhikkhus
    rejoice in the Blessed One's words.
