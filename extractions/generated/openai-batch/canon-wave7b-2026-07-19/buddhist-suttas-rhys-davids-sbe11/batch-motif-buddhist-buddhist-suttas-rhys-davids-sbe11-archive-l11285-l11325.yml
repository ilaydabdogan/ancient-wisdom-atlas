    uncertainty, lack of confidence, and lack of faith regarding the Teacher, the
    Dhamma, the Sangha, and the system of self-culture prevent a brother''s mind from
    inclining toward zeal, exertion, perseverance, and struggle. The passage then
    begins a further item concerning anger toward fellow-disciples, but ends mid-phrase.'
