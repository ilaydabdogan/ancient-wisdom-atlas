  quote: ''
  summary: The Great King of Glory provides seasonal flowers, bathing attendants,
    and ongoing grants at lotus-ponds for the people. Brahmans and laymen bring wealth
    for the king, but he refuses it, citing his own wealth from righteous taxation
    and telling them to keep it and take more. The men then propose building a mansion
    for him, and he consents by silence. The excerpt ends as Sakka, king of the gods,
    becomes aware of thoughts in his mind.
