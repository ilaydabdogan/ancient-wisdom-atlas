canonical_text:
  quote: '"the talk of the Brihmans versed in the Three Vedas is foolish talk"'
  summary: Gotama questions Vāseṭṭha about whether Brahmans versed in the Three Vedas
    can see the sun and moon, whether they can show a way to union with them, and
    whether they can show a way to union with Brahma whom they have not seen or known.
    Vāseṭṭha agrees that they cannot. Gotama concludes that their claims are foolish
    and begins an analogy of a man longing for an unknown beautiful woman.
  language: English
