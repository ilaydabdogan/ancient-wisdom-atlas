canonical_text:
  quote: Impermanent are all component things!
  summary: After the Blessed One dies, some brethren and worldly-minded spirits lament
    violently, while Arahats and passion-free spirits remain composed by reflecting
    on impermanence. Anuruddha exhorts the brethren not to lament and sends Ananda
    to inform the Mallas of Kusinara, who are assembled in their council hall.
  language: English
  quote_policy: quoted
