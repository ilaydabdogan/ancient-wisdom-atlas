canonical_text:
  quote: ''
  summary: The Blessed One goes to Beluva with the brethren, instructs the mendicants
    to spend the rainy season around Vesali while he remains at Beluva, becomes gravely
    ill, resolves not to pass away before addressing and taking leave of the order,
    suppresses the sickness by a strong effort of will, recovers enough to sit outside
    the monastery, receives Ananda, and answers Ananda's concern by saying that he
    has taught without hidden esoteric reserve or a teacher's closed fist.
  language: English
  quote_policy: summarized
