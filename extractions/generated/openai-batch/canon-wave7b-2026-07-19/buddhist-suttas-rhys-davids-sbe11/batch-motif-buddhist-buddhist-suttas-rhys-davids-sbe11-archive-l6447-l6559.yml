canonical_text:
  quote: ''
  summary: Ananda arranges the Mallas of Kusinara by family groups so they can pay
    respects to the Blessed One before dawn. Subhadda, a non-believing mendicant,
    hears that Gotama's final passing away is imminent and seeks an audience to resolve
    his uncertainty. Ananda refuses him three times because the Blessed One is weary,
    but the Blessed One overhears, orders Ananda to admit Subhadda, and says Subhadda
    asks from desire for knowledge and will quickly understand. Subhadda enters, salutes,
    sits aside, and begins to address the Blessed One.
  language: English
