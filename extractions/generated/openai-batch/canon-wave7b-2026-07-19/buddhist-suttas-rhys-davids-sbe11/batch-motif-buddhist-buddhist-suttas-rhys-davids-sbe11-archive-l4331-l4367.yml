canonical_text:
  quote: ''
  summary: The speaker tells Ananda that the Tathagata had given a clear hint that,
    if desired, he could remain in the same birth for a kalpa or the remaining part
    of one. Ananda failed to ask him to remain for the benefit of multitudes, gods,
    and men; the speaker says a third appeal would have been granted and declares
    the fault to be Ananda's. The speaker then recalls dwelling at several places
    in Rajagaha and speaking to Ananda about the pleasantness of Rajagaha and Vultures
    Peak.
  language: English
  quote_policy: summarized
