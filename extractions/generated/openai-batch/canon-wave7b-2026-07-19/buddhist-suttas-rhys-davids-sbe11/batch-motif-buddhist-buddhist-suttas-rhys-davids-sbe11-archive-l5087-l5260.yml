canonical_text:
  quote: ''
  summary: The Blessed One, suffering after eating Cunda's food, goes toward Kusinari
    with Ananda. He rests at the foot of a tree, asks repeatedly for water, and Ananda
    finds that a recently fouled streamlet has become clear. Pukkusa, a young Mallian
    disciple of Alara Kalama, arrives, praises the calm of renunciants, and recounts
    Alara Kalama remaining conscious yet unaware while five hundred carts passed nearby.
  language: English
  quote_policy: summarized
