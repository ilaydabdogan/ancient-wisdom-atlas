canonical_text:
  quote: ''
  summary: Mah£ Kassapa comes to the Mallas' shrine at Makufe-bandhana of Kusin£r£,
    where the Blessed One's funeral pile stands. He bares one shoulder, joins his
    hands, walks reverently around the pile three times, uncovers the Blessed One's
    feet, and bows at them. Five hundred brethren repeat the same homage. When their
    homage ends, the funeral pile catches fire by itself. A translator's note compares
    the uncovering of the feet to a reported Jewish burial custom and notes one-shoulder
    robe practice among Buddhist bhikkhus in Siam and Ceylon.
