  summary: The passage says that the Tathagata could remain alive for a kalpa if he
    wished. The Blessed One gives Ananda a clear hint, but Ananda fails to ask him
    to remain, his heart being described as possessed by the Evil One. After the hint
    is repeated, the Blessed One dismisses Ananda, who withdraws to the foot of a
    tree. Mara then approaches the Blessed One and urges him to pass away from existence.
