canonical_text:
  quote: As water poured on mountain tops / Must soon descend, and reach the plain
    ; / So surely what is given here / Will reach and bless the spirits there
  summary: 'The passage describes funeral verses and rites: gifts made by the living
    are said to benefit departed spirits; relatives place the coffin in the grave;
    monks take a roll of cloth connected with the coffin; two lights are left at the
    grave; a post-funeral feast is held; after three or seven days a monk reads sacred
    passages overnight and receives white cloth and foods liked by the deceased. The
    editor explains the Mataka Danaya and Mataka Bhatta as Buddhist rites replacing
    or preserving elements of older offerings to Petas, and discusses the ritual symbolism
    of funeral cloth, early Buddhist funerary simplicity, and the later chronological
    use of the Buddha''s Parinibbana.'
  language: English with Pali and Sinhala terms
  quote_policy: quoted
