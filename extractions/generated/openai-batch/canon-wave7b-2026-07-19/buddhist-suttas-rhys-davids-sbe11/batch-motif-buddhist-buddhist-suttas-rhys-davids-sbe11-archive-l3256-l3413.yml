  evidence_refs:
  - ev:9
- id: obs:10
  text: After the meal Ambapali sits at the Blessed One's side and presents her mansion
    to the order of mendicants, of which the Buddha is chief; the Blessed One accepts
    the gift.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The discourse states that earnest contemplation has great fruit when set round
