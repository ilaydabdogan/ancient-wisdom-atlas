canonical_text:
  quote: ''
  summary: The Licchavis of Vesali arrive in ornate procession to visit the Blessed
    One at Ambapali's grove. Ambapali has already invited the Blessed One and the
    brethren for the next day's meal and refuses the Licchavis' offer to purchase
    that honor. The Blessed One compares the Licchavi company to the Tavatimsa gods,
    teaches the Licchavis, keeps his prior meal engagement, receives Ambapali's hospitality
    and her gift of a mansion to the order, teaches on conduct, contemplation, and
    intelligence, and then tells Ananda to go on to Beluva.
  language: English
  quote_policy: summarized
