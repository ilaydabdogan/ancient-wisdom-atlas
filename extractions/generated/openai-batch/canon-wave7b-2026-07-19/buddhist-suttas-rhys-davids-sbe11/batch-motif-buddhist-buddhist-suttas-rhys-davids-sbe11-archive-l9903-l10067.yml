canonical_text:
  quote: ''
  summary: In a dialogue with the young Brahman Vaseṭṭha, Gotama uses the analogy
    of a person born in Manasakata knowing its roads, then says the Tathagata knows
    Brahma, Brahma's world, and the path leading there. Vaseṭṭha asks him to show
    the way to union with Brahma. The passage then describes a Tathagata arising in
    the world, proclaiming truth, and a hearer leaving household life, taking robes,
    becoming a recluse, and practicing moral restraint, including abstention from
    killing and theft.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A comparison is made to a man born and brought up in Manasakata who would
    know the roads leading to Manasakata.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tathagata says he knows Brahma, the world of Brahma, and the path leading
    to it, as one who has entered and been born within that world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vaseṭṭha asks Gotama to show the way to a state of union with Brahma and to
    save the Brahman race.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tathagata is described as born into the world, fully enlightened, a teacher
    of gods and men, knowing the worlds above and below, and proclaiming truth to
    others.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A householder, a householder's child, or a man of inferior birth hears the
    truth, gains faith in the Tathagata, and reflects that household life is full
    of hindrances while the renounced life is free.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The hearer forsakes wealth and relatives, cuts off hair and beard, puts on
    orange-colored robes, and goes from household life into the homeless state.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: After becoming a recluse, the person lives restrained according to the Patimokkha,
    trains in precepts, guards the senses, and sustains life by pure means.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Good conduct includes abstaining from destroying life, laying aside cudgel
    and sword, and being compassionate and kind to living creatures.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Good conduct also includes abstaining from taking what is not given and taking
    only what is given.
  category: action
  evidence_refs:
  - ev:9
