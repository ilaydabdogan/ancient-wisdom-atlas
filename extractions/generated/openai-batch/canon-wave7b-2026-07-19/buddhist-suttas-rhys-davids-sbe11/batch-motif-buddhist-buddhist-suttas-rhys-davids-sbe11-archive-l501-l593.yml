canonical_text:
  quote: ''
  summary: A scholarly introduction discusses memorial burial mounds for the Buddha,
    the possible public funeral of Gotama, later beliefs about rival clans seeking
    his remains, a parable becoming associated with a miracle, and the comparison
    of the Buddha with a Cakkavatti Raja or Universal Monarch. The passage argues
    that later Buddhist narrative and works such as the Lalita Vistara were colored
    by Cakkavatti myths and related royal-heroic ideals.
  language: English
  quote_policy: summarized
