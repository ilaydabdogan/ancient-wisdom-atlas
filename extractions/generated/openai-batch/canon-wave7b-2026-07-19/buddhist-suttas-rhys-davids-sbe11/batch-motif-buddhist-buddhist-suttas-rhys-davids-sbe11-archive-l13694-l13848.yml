  summary: The Queen of Glory first urges the Great King of Glory to renew desire
    for life by recalling his many royal possessions. The king rejects this as improper
    at his final time and instructs her to speak instead of separation from all dear
    things, the sorrow of dying with longing, and the need to cast away desire for
    each class of royal property.
