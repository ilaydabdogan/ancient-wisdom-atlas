canonical_text:
  quote: ''
  summary: 'The passage lists attainments a Bhikkhu might desire: heavenly hearing,
    knowing the minds of others, remembering former births across cosmic cycles, seeing
    beings reborn according to karma, and attaining Arahatship through the destruction
    of the Asavas. Each desire is followed by the same discipline: fulfil righteousness,
    cultivate inward quietude, maintain contemplative ecstasy, look through things,
    and live much alone.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A repeated instruction says that the Bhikkhu should fulfil righteousness,
    be devoted to inward quietude of heart, not drive back contemplative ecstasy,
    look through things, and be much alone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Bhikkhu may desire to hear with a clear and heavenly ear, surpassing that
    of men, sounds that are human and celestial, far or near.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bhikkhu may desire to comprehend by his own heart the hearts of other
    beings and other men, discerning paired mental states such as passionate or calm,
    angry or peaceable, deluded or wise, concentrated or scattered, free or enslaved.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bhikkhu may desire to call to mind former temporary states, including
    many births, identities, families, castes, modes of subsistence, experiences of
    comfort or pain, and terms of life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The remembered births may extend through many aeons of destruction, renovation,
    and both destruction and renovation.
  category: setting
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The Bhikkhu may desire to see with pure and heavenly vision beings as they
    pass from one state of existence and take form in others.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that beings are base or noble, good-looking or ill-favoured,
    happy or miserable, according to the karma they inherit.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bad conduct in action, word, and thought, speaking evil of the Noble Ones,
    false doctrine, and the karma of false doctrine are linked with rebirth after
    death in an unhappy state of suffering or woe.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Good conduct in action, word, and thought, not speaking evil of the Noble
    Ones, right doctrine, and the karma of right doctrine are linked with rebirth
    after death into a happy state in heaven.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Bhikkhu may desire, through the destruction of the great evils called
    Asavas, to know, realise, and attain Arahatship, emancipation of heart, and emancipation
    of mind in this world.
  category: action
  evidence_refs:
  - ev:7
