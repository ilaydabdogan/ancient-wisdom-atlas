canonical_text:
  quote: ''
  summary: The Palace of Righteousness is described as radiantly difficult to look
    at. The Great King of Glory builds a Lotus-lake named Righteousness before it,
    with jewel and metal tiles, steps, railings, and seven rows of precious-material
    palm trees. Wind moving the palms produces sweet, intoxicating sound, to which
    some city-dwellers dance. After the palace and lake are finished, the king entertains
    esteemed Samaras and Brahmans and ascends into the palace.
  language: English
  quote_policy: summarized
