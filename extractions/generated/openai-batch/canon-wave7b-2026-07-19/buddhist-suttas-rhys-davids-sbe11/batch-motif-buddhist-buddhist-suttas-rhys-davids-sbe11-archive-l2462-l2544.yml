canonical_text:
  quote: ''
  summary: Sariputta declares strong faith that no teacher is greater or wiser than
    the Blessed One in higher wisdom. The Blessed One questions whether Sariputta
    knows the minds and attainments of Buddhas past, future, or present; Sariputta
    denies this and says he knows only the lineage of the faith. He illustrates this
    with a fortified one-gate border city and a watchman, then states that Buddhas
    attain enlightenment through abandoning faults and training in specified disciplines.
    The passage ends by noting the Blessed One’s religious talk in the Pavarika mango
    grove.
  language: English
  quote_policy: summarized
