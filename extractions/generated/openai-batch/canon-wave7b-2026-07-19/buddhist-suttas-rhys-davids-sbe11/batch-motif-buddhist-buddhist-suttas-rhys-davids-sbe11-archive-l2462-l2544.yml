    or leaving must pass through the gate.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sariputta says past Buddhas abandoned lust, ill-will, sloth, pride, doubt,
    and other weakening mental faults; trained their minds in four kinds of mental
    activity; exercised themselves in sevenfold higher wisdom; and received the full
    fruition of Enlightenment.
  category: sequence
  evidence_refs:
  - ev:5
