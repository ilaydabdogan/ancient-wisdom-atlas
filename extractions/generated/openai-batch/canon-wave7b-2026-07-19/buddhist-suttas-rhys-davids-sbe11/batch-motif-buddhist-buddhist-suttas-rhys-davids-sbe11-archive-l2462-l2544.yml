- id: obs:2
  text: The Blessed One describes Sariputta’s words as grand and bold and asks whether
    Sariputta has known the minds, conduct, doctrine, wisdom, mode of life, and salvation
    of past Arahat Buddhas.
  category: speech
  evidence_refs:
