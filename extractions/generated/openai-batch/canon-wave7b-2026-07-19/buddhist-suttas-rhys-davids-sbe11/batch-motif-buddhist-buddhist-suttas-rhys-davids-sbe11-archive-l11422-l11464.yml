canonical_text:
  quote: ''
  summary: 'The passage identifies two forms of spiritual or mental bondage for a
    monastic brother: indulging in ease after eating to satiety, and adopting the
    religious life in order to become one of the angel hosts. In both cases the mind
    does not incline toward zeal, exertion, perseverance, and struggle, and the bondage
    remains unbroken.'
