canonical_text:
  quote: '"How transient are all component things"'
  summary: The passage frames the Maha-Sudassana Sutta/Gataka as a deathbed teaching.
    The Tathagata, after recalling the deaths of Sariputta and Maha Moggallana, resolves
    to pass away at Kusinara and lies between twin Sala trees. Ananda asks that he
    not die in a small jungle township, but the Master replies that the place was
    once a great city when he was King Sudassana. The narrative then describes Queen
    Subhaddi urging the dying Maha Sudassana to desire his many cities, while he instead
    tells her to exhort him to abandon desire because his time to die has come. The
    queen, women, and courtiers lament, and the Bodisat restrains their mourning.
  language: English
  quote_policy: quoted
