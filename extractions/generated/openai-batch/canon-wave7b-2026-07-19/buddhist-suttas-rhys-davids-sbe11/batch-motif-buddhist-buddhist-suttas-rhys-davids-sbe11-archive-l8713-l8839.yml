canonical_text:
  quote: ''
  summary: The passage is an introductory note to the Tevigga Sutta. It identifies
    the sutta and its manuscript basis, summarizes its argument about two young Brahmans
    seeking union with Brahma/God, and explains that Gotama answers through Right
    Conduct and universal love rather than Vedic expertise. The translator also compares
    the Tevigga Brahmans with New Testament Scribes and Pharisees and discusses Buddhist
    reinterpretation of older religious terms.
  language: English
  quote_policy: summarized
