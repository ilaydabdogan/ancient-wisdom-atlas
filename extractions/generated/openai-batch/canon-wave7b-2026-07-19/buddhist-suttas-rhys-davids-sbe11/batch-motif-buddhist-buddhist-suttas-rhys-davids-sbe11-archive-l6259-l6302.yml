canonical_text:
  quote: ''
  summary: 'The passage praises Ananda''s wonderful qualities: visitors from the Buddhist
    community and lay devotees rejoice on seeing him and hearing him preach, while
    brethren are uneasy when he is silent. Ananda then asks the Blessed One not to
    die in a small jungle town, but in a great city where wealthy believers will honor
    the Tathagata''s remains. A note states that this section also appears nearly
    word for word in the Maha-Sudassana Sutta and compares the Maha-Sudassana Jataka.'
  language: English
  quote_policy: summarized
