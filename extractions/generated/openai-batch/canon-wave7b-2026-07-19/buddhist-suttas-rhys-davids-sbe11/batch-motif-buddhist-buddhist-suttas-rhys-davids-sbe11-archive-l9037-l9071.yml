  summary: The passage opens the Tevijja Sutta by locating the Blessed One in Kosala,
    traveling with about five hundred brethren. He arrives at the Brahman village
    called Manasakata and stays in a mango grove on the bank of the river Aciravati,
    south of the village. The passage also notes that several distinguished and wealthy
    Brahmans are staying at Manasakata.
