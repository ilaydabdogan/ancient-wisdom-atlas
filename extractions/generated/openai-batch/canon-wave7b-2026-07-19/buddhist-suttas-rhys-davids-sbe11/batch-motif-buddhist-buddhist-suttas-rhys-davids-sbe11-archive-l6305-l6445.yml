canonical_text:
  quote: ''
  summary: The Tathagata tells Ananda not to dismiss Kusinara as insignificant, because
    it was formerly Kusavati, the royal city of the righteous king Mahi-Sudassana,
    prosperous like the gods' city Alakamanda and filled with urban sounds. He sends
    Ananda to notify the Mallas that the Tathagata's final passing away will occur
    in the last watch of the night. Ananda informs the Mallas; they grieve, lament,
    and go with their families to the Sala Grove at Upavattana.
  language: English
  quote_policy: summarized
