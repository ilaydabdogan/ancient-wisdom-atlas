  evidence_refs:
  - ev:1
- id: obs:2
  text: The Tathagata says that long ago King Mahi-Sudassana was a righteous king
    of kings, lord of the four quarters, conqueror, protector of his people, and possessor
    of the seven royal treasures.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kusinara is identified as the former royal city Kusavati, measuring twelve
    leagues east-west and seven leagues north-south.
