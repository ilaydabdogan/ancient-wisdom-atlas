canonical_text:
  quote: come forth into the light
  summary: 'The passage states that a monk endowed with fifteenfold determination
    is certain to emerge into light, reach higher wisdom, and attain supreme security.
    It illustrates this certainty with a hen properly brooding eggs: the chicks are
    sure to break the shells with claws or beaks and emerge safely. A translator note
    explains that the simile turns on absolute certainty despite desire or doubt.'
  language: English
