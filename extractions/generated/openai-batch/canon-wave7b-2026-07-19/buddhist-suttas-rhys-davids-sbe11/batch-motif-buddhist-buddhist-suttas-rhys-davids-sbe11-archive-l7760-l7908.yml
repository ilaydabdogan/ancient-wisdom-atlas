canonical_text:
  quote: ''
  summary: The passage describes an appeal to avoid conflict over the Buddha's remains,
    the equal division of the remains into eight portions by Doṇa the Brahman, the
    allocation or later taking of associated relic materials, and the building of
    mounds with feasts by several groups. Closing verses summarize relic worship,
    including worship by serpent or Naga beings, gods, and kings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker urges forbearance and says that strife, wounds, and war should not
    arise over the division of the remains of the best of beings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker proposes that all should unite in harmony to make eight portions
    and that thūpas should rise widely in every land.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The assembly asks a Brahman to divide the remains of the Blessed One equally
    into eight parts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Doṇa the Brahman agrees and divides the remains of the Blessed One equally
    into eight parts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Doṇa asks for the vessel so that he can set up a sacred cairn over it and
    establish a feast in its honor; the vessel is given to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Moriyas of Pipphalivana hear that the Blessed One has died at Kusinārā
    and request a portion of the relics, saying that they too belong to the soldier
    caste.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After being told that no portion of the remains is left because all have been
    distributed, the Moriyas take away the embers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Several named communities or rulers make mounds over the remains of the Blessed
    One and hold feasts.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: Doṇa makes a mound over the vessel in which the body had been burnt and holds
    a feast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Moriyas of Pipphalivana make a mound over the embers and hold a feast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage summarizes the result as eight mounds for the remains, one for
    the vessel, and one for the embers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The closing verses describe eight measures of relics, with seven worshipped
    in India and one in Rāmagāma by kings of the serpent race.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The closing verses say that tooth relics are honored in heaven, in Gandhāra,
