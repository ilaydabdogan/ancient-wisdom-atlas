canonical_text:
  quote: ''
  summary: 'Gotama uses two analogies to question claims of Vedic Brahmans: a man
    loves an unknown woman he has never identified or seen, and another man builds
    a staircase to a mansion whose location and size he does not know. Vāseṭṭha agrees
    that such talk is foolish. Gotama applies these analogies to Brahmans who claim
    to show the way to union with Brahma though they, their pupils, predecessors,
    and even the ancient Ṛṣis have not seen or known Brahma.'
  language: English
  quote_policy: summarized
