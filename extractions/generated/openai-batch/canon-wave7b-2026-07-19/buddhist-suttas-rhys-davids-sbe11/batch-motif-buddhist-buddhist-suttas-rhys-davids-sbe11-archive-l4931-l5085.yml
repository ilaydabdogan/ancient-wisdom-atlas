canonical_text:
  quote: ''
  summary: The passage gives rules for judging reported teachings by comparison with
    scripture and the rules of the order, then narrates the Blessed One's discourse
    on conduct, contemplation, and intelligence, his journey with Ananda and the brethren
    to Pava, Aunda's invitation and meal offering, the special handling of dried boars
    flesh, and the Blessed One's ensuing severe illness borne without complaint.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A reported teaching from a brother or elder is not to be immediately praised
    or scorned.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Every word and syllable of a reported teaching is to be understood and compared
    with scripture and the rules of the order.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A teaching that does not harmonise with scripture and the rules is to be rejected,
    while one that does harmonise is to be received as the word of the Blessed One.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Blessed One teaches that upright conduct, earnest contemplation, and intelligence
    bring great fruit and that mind set round with intelligence is freed from sensuality,
    individuality, delusion, and ignorance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Blessed One tells Ananda to go to Pava; Ananda assents, and the Blessed
    One proceeds there with a great company of brethren.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Pava, the Blessed One stays in the Mango Grove of Aunda, who is described
    as a smith or worker in metals.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Aunda visits the Blessed One, salutes him, sits respectfully, hears religious
    discourse, and invites the Blessed One and the brethren to a meal the next day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Blessed One signifies consent to Aunda's invitation by silence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Aunda prepares sweet rice, cakes, and dried boars flesh, and announces that
    the meal is ready.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Blessed One asks that the dried boars flesh be served to him and that
    the sweet rice and cakes be served to the brethren.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Blessed One instructs Aunda to bury any leftover dried boars flesh in
    a hole, saying that no one except the Tathagata can assimilate that food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After eating Aunda's food, the Blessed One suffers dysentery and sharp pain
    unto death, but bears it mindful and self-possessed, without complaint.
  category: sequence
  evidence_refs:
  - ev:8
