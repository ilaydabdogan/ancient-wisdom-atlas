canonical_text:
  quote: ''
  summary: A speaker urges the Great King of Glory to abandon desire for his many
    royal possessions and not long after life. The king dies, is described as coming
    to life again in the happy world of Brahma, and his long royal career and noble
    life are summarized. The narrator then tells Ananda that he himself was the Great
    King of Glory at that time and repeats the catalogue of former possessions.
  language: English
  quote_policy: summarized
