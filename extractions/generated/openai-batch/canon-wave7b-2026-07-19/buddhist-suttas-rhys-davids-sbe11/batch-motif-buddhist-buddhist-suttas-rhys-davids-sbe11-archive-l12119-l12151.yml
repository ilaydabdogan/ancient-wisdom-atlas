  summary: The passage is translator/editorial commentary characterizing the Maha-Sudassana
    Sutta as a gorgeous poetic fairy tale about the greatest king's glory, meant to
    show that all is vanity except righteousness. It notes possible rhetorical relations
    to Vedic hymns, the Lalita Vistara, and the heavenly Jerusalem, and contrasts
    early Buddhist moral attainment with a later Northern Buddhist aim of happiness
    in a heaven of bliss.
