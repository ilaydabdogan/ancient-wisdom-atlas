  summary: A bibliographic and textual-critical passage headed “Book of the Great
    Decease. Other Books.” It lists cross-references for sections of chapters V and
    VI, states that no Sanskrit work on Gotama’s last days has yet been discovered,
    discusses several Chinese works possibly related to the Book of the Great Decease,
    cites Mr. Beal’s identifications and dating, and records the editor’s doubts about
    those identifications.
