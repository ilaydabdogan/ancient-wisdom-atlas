canonical_text:
  quote: "“there is no mention of the passage of a soul from the earth to heaven,
    no conscious identity, no continuing memory.”"
  summary: The passage is an editorial discussion of Buddhist and Christian comparison.
    It says a king and an angel may be treated as karmically continuous from a Buddhist
    point of view, but not as the same continuing soul in a Christian sense. The author
    warns against relying on Sanskrit usage to explain Pali Buddhist religious terms
    and against assuming that similarities between the Pali Pitakas and the New Testament
    imply borrowing. The passage allows cautious comparison while denying evidence
    for historical connection in the earlier texts. It ends with the heading “On Knowledge
    of the Vedas.”
