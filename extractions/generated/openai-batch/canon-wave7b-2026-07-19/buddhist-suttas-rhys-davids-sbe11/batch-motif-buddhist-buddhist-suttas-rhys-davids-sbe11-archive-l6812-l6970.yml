  summary: In Chapter VI of the Maha-parinibbana-sutta, the Blessed One gives Ananda
    and the brethren instructions for after he is gone, invites questions, gives a
    final exhortation, then enters a sequence of meditative states; Ananda says he
    is dead, and Anuruddha says he has entered a state where sensations and ideas
    have ceased.
