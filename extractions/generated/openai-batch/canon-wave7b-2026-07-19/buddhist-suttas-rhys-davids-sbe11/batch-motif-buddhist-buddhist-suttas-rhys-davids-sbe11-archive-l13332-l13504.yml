canonical_text:
  quote: ''
  summary: The Great King of Glory reflects that his greatness is the result of giving,
    self-conquest, and self-control. He enters the chamber of the Great Complex, rejects
    thoughts of lust, ill-will, and hatred, and passes through the four jhanas. He
    then enters the golden chamber, sits on a silver couch, and pervades the world
    in all directions with Love, Pity, Sympathy, and Equanimity. The passage closes
    with a catalogue of his many royal possessions, each numbered at eighty-four thousand
    and with named chief examples.
  language: English
  quote_policy: summarized
