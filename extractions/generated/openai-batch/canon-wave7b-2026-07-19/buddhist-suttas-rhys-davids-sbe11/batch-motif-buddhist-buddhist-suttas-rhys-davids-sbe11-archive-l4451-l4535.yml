canonical_text:
  quote: "“At the end of three months from this time the Tath&gata will die!”"
  summary: The Blessed One tells Ananda that all conditioned beings must dissolve
    and that the Tathagata has surrendered the remaining span of life, with final
    extinction to occur in three months. He goes with Ananda to the Mahavana and has
    the brethren near Vesali assembled in the Service Hall, where he instructs them
    to master, practise, meditate upon, and spread the truths he has taught so that
    pure religion may endure for the welfare of gods and men.
