canonical_text:
  quote: ''
  summary: 'The passage describes the royal city Kusavati as resounding with ten kinds
    of cries and as adorned with enumerated precious constructions: seven ramparts,
    four gates with seven pillars at each gate, and seven rows of palm trees with
    jeweled trunks, leaves, and fruits. Editorial notes discuss uncertainty in rendering
    some precious-substance names and propose comparison with a Sukhāvatīvyūha passage.'
  language: English
