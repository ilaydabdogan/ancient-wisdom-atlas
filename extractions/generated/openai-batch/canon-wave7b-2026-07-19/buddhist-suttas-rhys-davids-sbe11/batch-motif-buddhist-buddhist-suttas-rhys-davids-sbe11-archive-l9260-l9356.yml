canonical_text:
  quote: ''
  summary: In a dialogue with Vaseṭṭha, Gotama asks whether any Brahman versed in
    the Three Vedas, their teachers, their pupils, prior generations, or the ancient
    Rishis have seen Brahma face to face. Vaseṭṭha answers no. Gotama then argues
    that claiming to show a direct path to union with an unseen and unknown Brahma
    is foolish, and begins a simile of blind men clinging one to another.
  language: English
