canonical_text:
  quote: ''
  summary: The passage contrasts an ignorant unconverted person who is not freed from
    pain with a wise disciple trained in the doctrine of noble and good people. It
    distinguishes matters that should and should not be considered according to whether
    they cause the Asavas of Lust, Life, and Ignorance to arise and grow or to be
    prevented and put away. It then presents contemplation of suffering, its origin,
    its cessation, and the way to cessation as leading to the falling away of three
    fetters, and names these Asavas as abandoned by insight before beginning a new
    section on subjugation.
  language: English
  quote_policy: summarized
