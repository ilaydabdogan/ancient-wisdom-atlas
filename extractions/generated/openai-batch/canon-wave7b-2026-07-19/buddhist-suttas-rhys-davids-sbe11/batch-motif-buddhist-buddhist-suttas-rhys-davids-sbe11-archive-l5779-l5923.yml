canonical_text:
  quote: ''
  summary: A translator’s note comments on a commentarial image of many gods standing
    on a tiny point. The sutta passage then presents Ananda and the Blessed One discussing
    spirits mourning the Tathagata’s imminent passing, calm spirits who remember impermanence,
    four places to be visited with reverence, the heavenly rebirth of believers who
    die while journeying on pilgrimage, conduct toward women, and the handling of
    the Tathagata’s remains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A translator’s note says Buddhaghosa explains that twenty to sixty angels
    or gods could stand on the extreme point of a gimlet, and the note compares this
    to a medieval Christian discussion about angels on a needle point while also saying
    the sutta text itself does not imply such a doctrine.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spirits are described as being in front of the Tathagata, concealing him,
    and murmuring that they are prevented from beholding him in his last hour.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ananda asks what kind of spirits the Blessed One is thinking of.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Worldly-minded spirits in the sky dishevel their hair, weep, stretch out their
    arms, fall prostrate, roll in anguish, and lament that the Blessed One will soon
    die and that the Light of the world will vanish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Worldly-minded spirits on the earth tear their hair, weep, stretch out their
    arms, fall prostrate, roll in anguish, and lament that the Blessed One will soon
    pass away and that the Eye of the world will disappear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Spirits free from passion bear the event calmly and self-possessed, mindful
    of the statement that all component things are impermanent and subject to dissolution.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ananda says that in the past brethren who had spent the rainy season in different
    districts came to see the Tathagata, but after the Blessed One’s end they will
    no longer be able to receive those brethren to audience and wait upon him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'The Blessed One identifies four places that a believing man should visit
    with reverence and awe: the place of the Tathagata’s birth, the place of his supreme
    and perfect insight, the place where the kingdom of righteousness was set on foot,
    and the place of his final passing away.'
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Believers, including brethren and sisters of the order and devout lay men
    and women, are said to come to those spots and identify them by the Tathagata’s
    life events.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Those who die with believing heart while journeying on such pilgrimage are
    said to be reborn after death in the happy realms of heaven when the body dissolves.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'When Ananda asks about conduct toward women, the replies are: do not see
    them; if seen, abstain from speech; if they speak, keep wide awake.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: When Ananda asks about the Tathagata’s remains, he is told not to hinder himself
    by honoring them but to be zealous for his own good; wise believers among nobles,
    Brahmans, and heads of houses will honor the remains.
  category: speech
  evidence_refs:
  - ev:9
