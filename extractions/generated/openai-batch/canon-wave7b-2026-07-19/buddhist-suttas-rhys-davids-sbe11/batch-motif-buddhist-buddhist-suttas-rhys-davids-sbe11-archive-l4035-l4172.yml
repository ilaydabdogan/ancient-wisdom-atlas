canonical_text:
  quote: ''
  summary: 'The passage begins with the Blessed One describing how he taught assemblies
    that did not recognize him and then saw him vanish without recognizing him. He
    then addresses Ananda with enumerated doctrinal lists: eight assemblies, eight
    positions of mastery over perceived forms, and eight stages of deliverance. The
    excerpt lists several modes of seeing and mastering forms, color-form examples,
    and a meditative stage in which the idea of infinite space alone is present.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One says he used to instruct, incite, quicken, and gladden listeners
    with religious discourse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The listeners did not know him when he spoke and wondered whether the speaker
    was a man or a god.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the religious discourse, the Blessed One says he would vanish away,
    and the listeners still did not know who he was.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Blessed One says the same pattern applied to assemblies of each of the
    eight kinds and identifies them to Ananda as the eight assemblies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Blessed One announces eight positions of mastery.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The first four positions of mastery concern a man seeing external forms with
    or without the subjective idea of form; the forms are finite or boundless and
    pleasant or unpleasant, and the man masters them and knows and sees.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Later positions of mastery concern externally seen forms that are blue, yellow,
    red, and white, with examples including flowers, fine muslin of Benares, and the
    morning star.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Blessed One announces eight stages of deliverance; the first stages include
    seeing forms with the idea of form, seeing forms externally without the subjective
    idea of form, and becoming intent with the thought that it is well.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fourth stage of deliverance is described as passing beyond ideas of form,
    resistance, and distinction, thinking that all is infinite space, and remaining
    in a state where infinity of space is the only present idea.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The translator's notes relate these lists to overcoming delusion about the
    reality and permanence of seen and felt things and to a progression through deep
    meditation.
  category: other
  evidence_refs:
  - ev:8
