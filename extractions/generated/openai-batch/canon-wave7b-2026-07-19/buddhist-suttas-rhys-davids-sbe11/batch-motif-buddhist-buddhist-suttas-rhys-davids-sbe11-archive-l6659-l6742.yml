canonical_text:
  quote: "“Just as if a man were to ... bring a lamp into the darkness ... just even
    so ... has the truth been made known to me.”"
  summary: The Blessed One tells Subhadda of his renunciation and long pilgrimage
    in virtue and truth, asserts the unique presence of true saints in this discipline,
    and receives Subhadda’s praise and refuge-taking. The passage then gives the rule
    for probation of former followers of other doctrines, Subhadda’s willingness to
    undergo it, the Blessed One’s instruction to Ananda to receive Subhadda, and Subhadda’s
    remark about discipleship at the Master’s hands.
  language: English; brief Pali excerpt
