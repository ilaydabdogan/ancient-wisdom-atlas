canonical_text:
  quote: ''
  summary: The passage explains the themes of barrenness and bondage in relation to
    a Buddhist sutta. It notes an analogy with a Christian pattern of virtues producing
    fruitfulness and entry into an everlasting kingdom, but states that the analogy
    applies only to barrenness. Bondage is described as specifically Buddhist and
    is linked to fetters that must be broken on the Noble Path before Arahatship.
    The passage lists ten fetters, correlates some of them with bondages in the sutta,
    and concludes that certain bondages express the doctrine that good should be pursued
    without ulterior motive or desire for future life.
