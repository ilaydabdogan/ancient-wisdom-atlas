canonical_text:
  quote: ''
  summary: The passage reports a tradition in which Kassapa presides over an assembly
    and fixes the Vinaya with Upali and the Dhamma with Ananda. It then argues that
    the First Council story is an old invention by comparing it with an older Sutta
    about Buddha's death, Subhadda's irreverent conduct, Kassapa's response, the cremation,
    distribution of relics, festivals for the relics, and Buddha's final precepts
    about future doubts and disputes concerning the Dhamma and Vinaya.
  language: English
  quote_policy: summarized
