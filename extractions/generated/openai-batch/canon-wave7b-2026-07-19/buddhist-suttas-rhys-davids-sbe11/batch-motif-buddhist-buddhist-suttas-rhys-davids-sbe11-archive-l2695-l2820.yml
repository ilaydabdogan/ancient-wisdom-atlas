canonical_text:
  quote: ''
  summary: The Blessed One sees many fairies haunting Pataligama and asks Ananda about
    a fortress being built there. Ananda identifies Sunidha and Vassakara, ministers
    of Magadha, as the builders, and says the fortress is meant to restrain the Vajjians.
    The Blessed One says the ministers act as if they had consulted Tavatimsa angels,
    foretells Pataliputta's future prominence as a city and commercial center, and
    names fire, water, and dissension as its three dangers. The ministers invite the
    Buddha and the brethren to a meal, serve sweet rice and cakes, and afterward the
    Buddha gives verses about supporting upright men and giving gifts to local deities,
    who reciprocate honor and good fortune.
  language: English
  quote_policy: summarized
