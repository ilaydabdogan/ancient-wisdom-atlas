canonical_text:
  quote: ''
  summary: 'Ananda asks how the remains of the Tathagata should be treated. The Lord
    says they should be treated like the remains of a king of kings: wrapped in many
    layers, placed in an iron oil vessel, cremated on a perfumed funeral pile, and
    honored with a dagaba at the four crossroads. The passage names four kinds of
    persons worthy of a dagaba and explains that recollection and reverence at such
    a dagaba calm and gladden hearts and lead to heavenly rebirth after death.'
  language: English
  quote_policy: summarized
