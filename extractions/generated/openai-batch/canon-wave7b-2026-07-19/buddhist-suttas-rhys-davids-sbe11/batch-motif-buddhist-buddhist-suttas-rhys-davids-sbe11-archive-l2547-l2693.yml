canonical_text:
  quote: ''
  summary: The passage reports the Blessed One teaching on conduct, contemplation,
    intelligence, and moral consequences; traveling with Ananda and the brethren to
    Pataligama; accepting the local disciples’ rest-house invitation; giving a discourse
    on the losses of wrong-doing and gains of rectitude, including postmortem rebirth;
    and then notes Magadhan ministers building a fortress where fairies haunt plots
    of ground and influence rulers and ministers to build there.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Blessed One teaches that upright conduct, earnest contemplation, and intelligence
    have great fruit and that a mind set round with intelligence is freed from sensuality,
    individuality, delusion, and ignorance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After staying at Nalanda, the Blessed One tells Ananda to go on to Pataligama,
    and proceeds there with a great company of brethren.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Pataligama disciples invite the Blessed One to their village rest house;
    after his silent consent they prepare seats, a water-pot, and an oil lamp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the rest house the Blessed One, the brethren, and the Pataligama disciples
    wash their feet and sit in an ordered arrangement around the hall, with the Blessed
    One by the centre pillar facing east.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The Blessed One describes five losses of the wrong-doer: poverty through
    sloth, evil repute, shy and confused conduct in assemblies, anxiety at death,
    and rebirth after death into an unhappy state of suffering or woe.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'The Blessed One describes five gains of the well-doer: wealth through industry,
    good reports, confident conduct in assemblies, dying without anxiety, and rebirth
    after death into a happy state in heaven.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The religious discourse continues far into the night; the disciples are dismissed,
    depart respectfully while keeping the Blessed One on their right, and the Blessed
    One later enters his private chamber.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Sunidha and Vassakira, chief ministers of Magadha, are building a fortress
