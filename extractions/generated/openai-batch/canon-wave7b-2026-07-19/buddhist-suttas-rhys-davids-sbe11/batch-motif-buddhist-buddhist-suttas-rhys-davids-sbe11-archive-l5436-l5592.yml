canonical_text:
  quote: the colour of the skin of the Tathagata becomes clear and exceeding bright
  summary: Pukkusa robes the Blessed One and Ananda, then departs after receiving
    discourse. Ananda places burnished cloth-of-gold robes on the Blessed One and
    observes that the Buddha's body outshines them. The Blessed One explains that
    such brightness occurs on the night of supreme insight and on the night of final
    passing away, announces the place and time of his imminent passing, proceeds to
    the river Kakuttha, bathes and drinks, goes to the Mango Grove, rests on a fourfold
    robe, and instructs Ananda to prevent remorse in Cunda the smith over the last
    meal.
  language: English
  quote_policy: quoted
