canonical_text:
  quote: ''
  summary: The speaker addresses mendicants or brethren and lists repeated sets of
    conditions under which the monastic order may be expected not to decline but to
    prosper. These include concord in assemblies, adherence to established rules,
    reverence for elders, freedom from craving, solitude, avoidance of hindrances,
    faith and wisdom, sevenfold higher wisdom, and sevenfold perception. The passage
    ends by announcing another set of six conditions of welfare.
  language: English
  quote_policy: summarized
