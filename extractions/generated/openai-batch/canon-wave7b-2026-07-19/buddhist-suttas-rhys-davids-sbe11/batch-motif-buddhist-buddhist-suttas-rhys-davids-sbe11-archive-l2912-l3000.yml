canonical_text:
  quote: '"By not seeing the four Noble Truths as they really are, Long is the path
    that is traversed through many a birth"'
  summary: The Blessed One travels with Ananda and a company of brethren to Kotigama,
    teaches that failure to understand the four Noble Truths causes long wandering
    in transmigration, states that grasping them uproots craving and ends birth, gives
    a verse on the same teaching, teaches on conduct, contemplation, and intelligence,
    and then proceeds to Nadika, staying at the Brick Hall.
