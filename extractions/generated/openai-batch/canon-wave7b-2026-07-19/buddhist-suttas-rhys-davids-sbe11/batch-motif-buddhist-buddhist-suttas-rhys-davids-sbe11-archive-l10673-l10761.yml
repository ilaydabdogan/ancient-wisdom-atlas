canonical_text:
  quote: ''
  summary: 'An editorial passage discusses Buddhist beliefs in supernatural powers,
    their differing reception in southern and northern Buddhist communities, and a
    limited analogy to witchcraft in Christian history. It then compares earlier and
    later Buddhist biographical traditions about Gotama after his victory over the
    Evil One: an earlier account has him meditate on the Chain of Causation through
    three watches of the night, while later accounts assign knowledge of past births,
    present births, and causation to the three watches. The passage also notes a theory
    that Arahats and the Buddha could acquire such supernatural insight.'
  language: English
  quote_policy: summarized
