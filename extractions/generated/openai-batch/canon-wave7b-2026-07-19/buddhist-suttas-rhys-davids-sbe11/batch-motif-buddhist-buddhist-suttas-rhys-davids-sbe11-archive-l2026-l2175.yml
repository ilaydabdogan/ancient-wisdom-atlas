canonical_text:
  quote: not to decline, but to prosper
  summary: Vassakara visits the Blessed One. In conversation with Ananda and Vassakara,
    the Blessed One describes conditions by which the Vaggian confederacy may avoid
    decline and prosper, including regular assemblies, concord, adherence to ancient
    institutions, respect for elders, non-abduction of women and girls, maintenance
    of shrines and rites, and support for Arahats. Vassakara recognizes that these
    conditions make the Vaggians difficult to overcome except through diplomacy or
    breaking their alliance. After Vassakara leaves, the Blessed One has Ananda assemble
    the Brethren and announces that he will teach seven conditions for the welfare
    of a community.
  language: English
  quote_policy: quoted
