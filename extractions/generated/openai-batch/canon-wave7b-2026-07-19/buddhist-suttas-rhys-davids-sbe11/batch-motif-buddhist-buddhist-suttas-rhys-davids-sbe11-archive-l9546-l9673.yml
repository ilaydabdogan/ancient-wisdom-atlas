canonical_text:
  quote: ''
  summary: Gotama questions Vāseṭṭha about Brahmans versed in the Three Vedas who
    claim to show the way to union with Brahmā though they do not know or see Brahmā.
    He uses a simile of a man on one bank of the flooded Aciravati river calling the
    far bank to come over, and applies it to Brahmans who call on deities while omitting
    the qualities that make a true Brahman. He says such invocation will not bring
    union with Brahmā after death. A second river simile begins with a man bound tightly
    on the near bank.
  language: English
  quote_policy: summarized
