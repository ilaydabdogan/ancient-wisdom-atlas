- id: obs:3
  text: Every word and syllable of the reported teaching is to be carefully understood,
    put beside scripture, and compared with the rules of the order.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the reported teaching does not harmonise with scripture or fit the rules
    of the order, it is to be concluded not to be the word of the Blessed One and
    is to be rejected.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the reported teaching harmonises with scripture and fits the rules of the
    order, it is to be concluded to be the word of the Blessed One and is to be received
    as a Great Reference.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A brother may also claim to have heard and received a teaching face to face
