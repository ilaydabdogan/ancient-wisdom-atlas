canonical_text:
  quote: ''
  summary: The passage gives procedures called Great References for evaluating reported
    teachings. A claim said to come directly from the Blessed One, from a company
    of brethren with elders and leaders, or from learned elders is not to be praised
    or scorned immediately; every word is to be understood, compared with scripture
    and the rules of the order, and then rejected or received depending on whether
    it harmonizes with them.
  language: English
  quote_policy: summarized
