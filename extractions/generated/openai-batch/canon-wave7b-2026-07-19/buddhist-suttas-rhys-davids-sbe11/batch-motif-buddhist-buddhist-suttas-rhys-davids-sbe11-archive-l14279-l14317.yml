canonical_text:
  quote: I will teach you, O brethren, the lesson of the subjugation of all the Asavas.
  summary: The Blessed One, staying at Sāvatthi in Jetavana, addresses the brethren
    and announces a teaching on the subjugation and destruction of all the Asavas.
    He states that their destruction belongs to one who knows and sees, through wise
    consideration rather than foolish consideration. Unwise consideration causes unarisen
    Asavas to arise and arisen Asavas to increase; wise consideration has the opposite
    orientation, though the supplied passage ends mid-sentence.
