  summary: The passage is a scholarly discussion of sources and chronological arguments
    for dating the Buddha's Great Decease. It compares Ceylon chronicle calculations,
    Greek-supported dates for Asoka, a lineage of Theras, northern Buddhist traditions,
    and the Questions of Milinda, concluding that the Buddha's death should be dated
    about 420-400 B.C. and his birth about 500 B.C.
