canonical_text:
  quote: ''
  summary: Ananda asks the Blessed One about the rebirth and destiny of several deceased
    people at Nadika. The Blessed One reports varied spiritual destinies and attainments
    for named and grouped deceased devotees, then says repeated individual inquiries
    are wearisome and introduces a teaching called the Mirror of Truth by which an
    elect disciple may know freedom from woeful rebirth and assurance of final salvation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ananda goes to the Blessed One, pays him reverence, and sits beside him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ananda asks where several named people who have died at N&dika have been reborn
    and what their destiny is.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Blessed One says the brother named S&Z&a/S£L/>£a has destroyed the great
    evils, realized Arahatship, and attained emancipation of heart and mind in this
    world.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sister named Nandd/Nandi is said to have destroyed five bonds that bind
    people to this world and to have become an inheritor of the highest heavens, there
    to pass entirely away and never return.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sudatta is said to have destroyed three bonds and reduced lust, hatred, and
    delusion, becoming a Sakadagamin whose first return to this world will end sorrow.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Su^ita/Su^&ti is said to have destroyed three bonds, become converted, no
    longer be liable to rebirth in a state of suffering, and be assured of final salvation.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Kakudha, Kalinga, Nika/a, Ka/issabha, Tu#/6a, Santu/Ma, Bhadda, Subhadda,
    and more than fifty devout men of N&dika are given the same highest-heaven, no-return
    destiny as Kakudha.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: More than ninety deceased devout men of N&dika are said to have become Sakadagamins
    who will end sorrow on their first return to this world.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: More than five hundred deceased devout men of N&dika are said to have become
    converted, no longer liable to rebirth in a state of suffering, and assured of
    final salvation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Blessed One says it is not strange that a human being should die, but
    that repeated inquiries about each person are wearisome to the Buddha.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Blessed One introduces a way of truth called the Mirror of Truth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: An elect disciple possessing the Mirror of Truth may predict of himself that
    hell and rebirth as an animal, ghost, or in any place of woe are destroyed for
    him, and that he is assured of final salvation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage begins defining the Mirror of Truth as consciousness that an elect
    disciple is possessed of faith in the Buddha.
  category: speech
  evidence_refs:
  - ev:6
