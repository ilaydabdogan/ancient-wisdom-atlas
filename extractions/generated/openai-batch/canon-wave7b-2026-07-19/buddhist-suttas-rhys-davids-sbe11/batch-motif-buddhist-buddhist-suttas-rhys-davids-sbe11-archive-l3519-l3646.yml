canonical_text:
  quote: ''
  summary: In a dialogue addressed to Ananda, the Tathagata says the order is not
    dependent on him, that he is old and nearing the close of his journey, and that
    his body is like a worn-out cart kept going with care. He says bodily ease occurs
    in meditation not directed to outward or material objects. He instructs Ananda
    and the monks to be lamps and refuges to themselves, to hold the truth as lamp
    and refuge, to practice mindful contemplation of body, sensations, thoughts, reasoning,
    and feelings, and says those who do so now or after his death will reach the topmost
    Height if willing to learn.
  language: English
  quote_policy: summarized
