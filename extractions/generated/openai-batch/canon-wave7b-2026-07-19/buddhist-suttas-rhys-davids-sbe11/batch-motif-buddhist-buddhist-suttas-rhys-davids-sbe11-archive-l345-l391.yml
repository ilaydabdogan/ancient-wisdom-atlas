  quote: ''
  summary: The passage presents scholarly arguments about the relative composition
    date of the Mahā-parinibbāna-Sutta. It discusses the absence or presence of the
    Council of Rājagaha in death-of-the-Buddha narratives, states cautions about certainty,
    and says the text likely postdates the rise of Pāṭaliputta, relic worship, and
    belief in the Cakkavatti sacred-king ideal. It also notes a prophecy attributed
    to Gotama concerning Pāṭaliputta’s future greatness, found also in the Mahāvagga.
