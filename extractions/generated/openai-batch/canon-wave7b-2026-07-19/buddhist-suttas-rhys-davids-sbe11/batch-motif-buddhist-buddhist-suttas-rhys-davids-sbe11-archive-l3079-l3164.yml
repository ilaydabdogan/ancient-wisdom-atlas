  summary: The passage describes faith in the Blessed One, the Truth, and the Order;
    the “mirror of truth” by which an elect disciple may know freedom from woe rebirths
    and final salvation; a discourse on conduct, contemplation, and intelligence;
    the journey to Vesali; and an instruction on mindfulness of body and sensations
    to overcome craving.
