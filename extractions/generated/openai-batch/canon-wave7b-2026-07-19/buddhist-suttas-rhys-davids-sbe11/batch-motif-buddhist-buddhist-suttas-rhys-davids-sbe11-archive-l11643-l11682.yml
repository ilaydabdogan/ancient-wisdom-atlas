  quote: ''
  summary: The passage states that a monk whose mind inclines toward zeal, exertion,
    perseverance, and struggle becomes free from a fifth spiritual bondage. It then
    says that one free from five kinds of mental barrenness and five kinds of spiritual
    bondage can attain full growth in the doctrine and discipline, and practises four
    roads to saintship associated with will, exertion, thought, and investigation,
    each joined with earnest contemplation and struggle against sin.
