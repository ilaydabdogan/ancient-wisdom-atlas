canonical_text:
  quote: ''
  summary: 'The passage describes the Pearl among Women who appears to the Great King
    of Glory, emphasizing her divine-like beauty, pleasant conduct, and faithfulness.
    It then describes a Wonderful Treasurer, who can discover treasure and draws a
    jar of yellow gold from the Ganges to satisfy the king''s request. A Wonderful
    Adviser also appears and offers to guide the king. The passage states that the
    king possesses Seven Precious Things and begins listing Four Marvellous Gifts:
    beauty, long life, freedom from disease, and balanced internal fire that promotes
    digestion.'
  language: English
  quote_policy: summarized
