canonical_text:
  quote: ''
  summary: The passage surveys motifs in which Death is linked to a light, taper,
    brand, or candle whose extinction means the end of life. It summarizes the Grimm
    tale of Gossip Death, where Death becomes a godfather, grants his godson diagnostic
    sight, and finally knocks over the godson's life-candle. It compares this pattern
    to norns and fays as gift-givers at birth, to Nornagest and Meleager, to variants
    in which Death gives a ring or sends bodily warning signs, and to tales where
    Death is bound, including Player Jack and Sisyphos. It also notes Christianized
    associations of Death with the Devil, angels, and Michael.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a life may be connected to a light, taper, or brand,
    and that when this is wasted or quenched, death follows.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a newborn child, the norn is described as kindling a light to which the
    child's thread of life is fastened.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tale of Gossip Death is summarized as ending in a subterranean cavern
    containing thousands of lights in endless rows, identified as the lives of men.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the same tale, Death stands as godfather to a poor man's child and gives
    the godson the ability to see Death bodily when Death approaches the sick.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The godson can judge whether a patient will live or die by whether Death stands
    at the patient's feet or head.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The godson becomes a physician and sometimes turns the patient around to circumvent
    Death; in the end Death knocks over the godson's candle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage describes Death in this fable as friendly, good-natured, and indulgent
    except when fulfilling his function.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says Death's godparenthood corresponds to norns visiting the newborn
    and bestowing gifts, and to fays invited as godmothers in nursery tales.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The extinguished light is compared with the taper and brand linked to the
    lives of Nornagest and Meleager.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says older forms pictured Death not as a skeleton but in the shape
    of a living man or god.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some variants have Death give his godson a ring by which he can judge diseases.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: A tale attributed to Hugo von Trimberg has Death promise to send messengers
    before fetching his gossip, including ringing ears, eye trouble, toothache, wrinkled
    skin, and a grizzled beard.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the tale of Death and Player Jack, Player Jack binds Death to a tree by
    a spell, so that nobody dies for seven years.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage reports a parallel story in Pherekydes in which Zeus sends Death
    against Sisyphos; Sisyphos binds Death in chains, no one dies, and Hades frees
    Death.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage says the German Player Jack fable interweaves the Devil, and it
    notes the coupling of Death and the Devil.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: According to the Christian view summarized in the passage, angels receive
    the souls of the just and devils receive those of the wicked; Death is thereby
    divided into an angel-like or devil-like power.
  category: relationship
  evidence_refs:
  - ev:11
