  summary: The passage describes a class of nonhuman beings or wights as a separate
    community with some superhuman traits, able to help or harm humans, usually small
    or misshapen and often invisible. It distinguishes female and male spirits, then
    surveys the term wiht/wicht/wight across Germanic languages and compares the category
    cautiously with terms such as Latin genius and Roman minuti dii.
  language: English
