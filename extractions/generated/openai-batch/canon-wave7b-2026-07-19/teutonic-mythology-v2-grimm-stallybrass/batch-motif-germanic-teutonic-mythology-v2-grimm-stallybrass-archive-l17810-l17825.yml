canonical_text:
  quote: ''
  summary: 'The passage discusses images for the delayed arrival of the world''s end:
    a vessel made from the nail-parings of dead bodies and a mountain of eternity
    slowly enlarged by a bird. It then describes Garmr as a great underworld hound
    encountered in connection with Óðinn''s journey to Niflhel, notes a Christian
    hell-hound comparison, and compares Viðarr''s victory over a wolf by planting
    a shod foot in its jaws to Christian traditions of assaulting the hell-hound.'
