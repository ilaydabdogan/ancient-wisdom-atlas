canonical_text:
  quote: ''
  summary: 'Grimm discusses personification as the extension of personality and gender
    from gods, spirits, and humans to animals, plants, tools, days, seasons, emotions,
    and other abstractions. He connects linguistic and poetic personification with
    mythological deification, distinguishes male and female divine tendencies, and
    gives examples of elemental associations: air and fire with gods, earth and water
    with goddesses, and wind or thunder with Wuotan/Odinn, Zeus, Jupiter, Donar/Thunar/Thor,
    Loptr, Zio, and Fhol.'
  language: English
  quote_policy: summarized
