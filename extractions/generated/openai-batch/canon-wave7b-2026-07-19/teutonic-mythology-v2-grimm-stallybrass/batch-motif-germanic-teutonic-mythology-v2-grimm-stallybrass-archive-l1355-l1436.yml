  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Elbegast is described as a notorious thief able to steal eggs from under birds.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In Low German legends, dwarfs especially lay plans against pea-fields.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Jiihnde story, dwarfs steal peas while invisible through caps worn
    on their heads.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A man stretches a cord around his field at high noon; when the dwarfs creep
    under it, their caps fall off and they become visible and caught.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The captured dwarfs promise money if the man returns before sunrise; he returns
    at midnight and receives the payment.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says dwarf-kings run away with maidens to their mountains, giving
