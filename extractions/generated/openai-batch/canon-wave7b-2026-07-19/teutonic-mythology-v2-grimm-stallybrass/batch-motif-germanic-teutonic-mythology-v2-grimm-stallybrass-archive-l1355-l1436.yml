  quote: ''
  summary: The passage collects comparative notices about Holle’s hair, ritual treatment
    of elftuft or plica, mounted elves and dwarfs in medieval and Welsh materials,
    dwarf thefts, a Low German tale of invisible dwarfs trapped while stealing peas,
    and stories of dwarf- or mountain-kings taking maidens to mountains.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Holle has her long-uncleaned hair combed, and a gifted girl combs pearls and
    precious stones out of her own hair.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports ritual cures for elftuft or plica involving cutting or
    cropping hair, burial or disposal, copper money, old castle ruins, and a prohibition
    on looking back.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author says the Edda does not represent alfar or dvergar as mounted, while
    medieval poems make Elberich and Laurin ride.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Medieval examples give dwarf or elf figures small or animal-like mounts:
    a goat-like steed, a pony the size of a roe, and a white roe.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Antilois is described as richly dressed, with bells on his bridle-reins, and
    as angry with Alexander for spoiling his flower-garden.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Welsh stories cited in the passage describe very diminutive persons riding
    four abreast on small white horses no bigger than dogs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage characterizes dwarfs and elves as thievish and lists names or
