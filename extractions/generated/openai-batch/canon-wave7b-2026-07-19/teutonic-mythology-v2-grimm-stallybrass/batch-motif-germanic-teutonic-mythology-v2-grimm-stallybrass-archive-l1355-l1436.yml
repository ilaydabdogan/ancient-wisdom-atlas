comparison_claims:
- id: claim:1
  claim: The passage contrasts Eddic material, where alfar and dvergar are not represented
    as mounted, with medieval German poems that present Elberich, Laurin, Antilois,
    and a wihtel as riders.
  claim_level: visual_similarity
  target: Eddic alfar/dvergar and medieval German dwarf or elf riders
  evidence_refs:
  - ev:3
  counter_evidence_refs:
  - ev:3
  confidence: high
  limitations: This is a representation-history contrast reported by the author, not
    evidence for a single continuous narrative motif.
- id: claim:2
  claim: Welsh diminutive riders on small white horses resemble the medieval German
    pattern of diminutive supernatural riders on very small or animal-like mounts.
  claim_level: visual_similarity
  target: Welsh stories cited from Crofton Croker and German medieval dwarf-rider
    examples
  evidence_refs:
  - ev:3
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supplies a visual comparison only; it does not establish
    historical contact or common inheritance.
- id: claim:3
  claim: The Low German Jiihnde legend exemplifies the broader pattern stated in the
    passage that dwarfs raid pea-fields.
  claim_level: same_motif
  target: Low German legends of dwarfs stealing peas
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: Only one full epitomized legend is included in this excerpt, with other
