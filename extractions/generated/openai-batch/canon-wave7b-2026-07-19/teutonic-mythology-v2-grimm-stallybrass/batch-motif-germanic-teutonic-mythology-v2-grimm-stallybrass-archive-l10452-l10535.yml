canonical_text:
  quote: ''
  summary: The passage recounts a Norse narrative in which King Olafr uses Freyr’s
    temple horses, destroys idols, removes Freyr’s image, and publicly challenges
    it. Grimm then discusses consecrated horses and other divine animals in Germanic
    traditions, including their use in sacrifice, divination, deity processions, legal
    or royal display, augury by neighing, and later protective charms involving horse
    hair or foal teeth.
  language: English, with cited Old Norse and Latin phrases
  quote_policy: summarized
