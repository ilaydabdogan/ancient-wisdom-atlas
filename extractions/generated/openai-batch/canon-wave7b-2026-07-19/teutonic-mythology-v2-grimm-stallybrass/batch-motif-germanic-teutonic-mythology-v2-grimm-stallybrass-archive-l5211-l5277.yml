canonical_text:
  quote: ''
  summary: The passage surveys legends of giants or hiines living on nearby heights,
    across rivers, or across lakes, communicating and cooperating over great distances.
    Examples include giants speaking from hills, throwing axes, hatchets, hammers,
    stones, loaves, or dough, sharing ovens or tools, building chapels, leaving marked
    stones or relics, and retiring as cultivated settlement spreads. The passage also
    notes comparisons to the thundergod's hammer and to Hrungni's hein and Thur's
    hammer.
  language: English
  quote_policy: summarized
