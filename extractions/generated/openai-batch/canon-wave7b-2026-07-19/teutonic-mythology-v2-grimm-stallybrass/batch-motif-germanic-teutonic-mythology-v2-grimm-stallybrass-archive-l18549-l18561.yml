canonical_text:
  quote: ''
  summary: The passage discusses a northern burial custom in which bodies were placed
    in boats on land, explained as providing the dead with a ferry for a water-crossing
    on the journey to the underworld. It gives saga examples of Hakon arranging ship
    burials, Unnr, Asmundr with his thrall, and Geirmundr being laid in ships, then
    suggests elite dead may first have been placed in coffins before boat burial in
    a hill. It also cites Gudrun speaking of buying a ship and stone coffin, and notes
    that no such boats were known to the author from ancient Continental German barrows.
  language: English with Old Norse citations
  quote_policy: summarized
