canonical_text:
  quote: ''
  summary: 'The passage surveys Germanic and related expressions for sunset: the sun
    goes to its seat, west, bed, rest, or repose; the west is contrasted with the
    east as the place of setting. Grimm discusses euphemistic or pious avoidance of
    direct speech about sunset, compares Serbian formulae about saying the sun has
    gone to rest, and cites an Eddic saying that no one should fight in the face of
    the late-shining sister of the Moon. A footnote discusses early and late evening
    terms and links late evening with the felling of day and the stillness of night.'
  language: English with cited Germanic, Latin, and Serbian forms
  quote_policy: summarized
