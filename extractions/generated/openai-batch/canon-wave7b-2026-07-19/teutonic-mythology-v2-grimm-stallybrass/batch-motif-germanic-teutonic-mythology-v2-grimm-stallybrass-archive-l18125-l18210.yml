  text: The Old English neorxena-wong is described as apparently a field of rest and
    bliss, and the passage explicitly rejects a derivation from the norns.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Greek Elysium is described, like Valholl, as not a general abode of all the
    dead but a place for selected heroes, with blessedness tied to warrior valour.
  category: relationship
  evidence_refs:
