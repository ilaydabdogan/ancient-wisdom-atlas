  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Native song and story are said to know a blessed meadow: children falling
    into wells pass through green meadows to the house of friendly Holla.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage cites literary examples in which a person who kills himself is
    denied the meadow, and Blancheflur plays or souls gather and pick flowers in a
    flowery field associated with paradise.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Older poets are said to have imagined heaven like the earth as a green plain,
