canonical_text:
  quote: ''
  summary: The passage surveys names and images of paradise in Christian, Germanic,
    Slavic, Greek, and Latin contexts. It describes paradise as garden, field, home,
    meadow, green plain, and future renewed earth; compares Valholl with Greek Elysium
    as an afterlife for selected heroes; cites stories of wells leading through green
    meadows to Holla; and links future paradise with Idavollr and a newly green earth
    emerging from the wave.
  language: English
  quote_policy: summarized
