  summary: The passage surveys Germanic and medieval images of hell as a well or abyss,
    infernal bathing, serpent-filled punishment, and mixed Christian-heathen hell
    imagery. It then contrasts the northern Mist-world with the southern fiery Muspellsheimr,
    guarded by Surtr, and discusses Muspell/Muspilli as a Germanic term for destructive
    fire or final conflagration, with comparative notes on living visitors to Hades
    and return.
