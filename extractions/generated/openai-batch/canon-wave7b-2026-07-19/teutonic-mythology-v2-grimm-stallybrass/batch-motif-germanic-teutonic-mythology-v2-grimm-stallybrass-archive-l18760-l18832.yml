    with elvish beings appears plainly.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dwarfs moving out of Voigtland are said to have spent a whole night crossing
    the Elster.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Dwarfs departing from the Harz are described as passing over a narrow bridge
    at Neuhof, dropping toll-money into a fixed vessel while local people were not
    supposed to be present; hidden listeners heard their pit-a-pat for hours.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author connects bridge-toll with ferry-money for souls, compares an elf
    making a night passage by boat, and links a dread thread-like bridge with an iron
    sword-bridge crossed by a soul.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dead are described as receiving passage-money, a boat, and a particular
