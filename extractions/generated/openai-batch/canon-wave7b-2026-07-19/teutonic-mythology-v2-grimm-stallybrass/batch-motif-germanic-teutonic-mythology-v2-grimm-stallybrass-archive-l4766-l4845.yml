  - ev:9
  - ev:10
  confidence: high
  cautions: No supplied motif-family taxonomy exactly matches etiological landform
    creation by spilled carried material.
- id: motif:2
  label: Unfinished bridge or dam by a giant or giantess
  taxonomy_refs: []
  basis: A giant’s dam between Rügen and Pomerania remains incomplete; a Pomeranian
    giant girl and Zechiel with her sister attempt bridges across water but are interrupted
    or fail.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents local variants rather than one continuous narrative.
- id: motif:3
  label: Perforated container as origin of multiple hills
  taxonomy_refs: []
  basis: Apron holes, sack or wallet holes, and glove finger holes cause sand or earth
    to fall in repeated deposits that become hills or sandbanks.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: The containers differ by variant.
- id: motif:4
  label: Giants fear Thor or thunder
  taxonomy_refs: []
  basis: Zechiel dies after Thor begins to thunder, giants hide when they hear thunder,
    and a Gothland mountain-being avoids an event because Thor will be there.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage’s examples combine thunder, Thor’s presence, and giant fear;
    it does not develop a full Thor-giant combat narrative here.
- id: motif:5
  label: Sacred female substitutes for giantess as carrier of earth or stone
  taxonomy_refs: []
  basis: The passage says French traditions put the holy Virgin or fays in place of
    giantesses, and gives examples of the Virgin carrying earth, stones, and pillars.
  evidence_refs:
