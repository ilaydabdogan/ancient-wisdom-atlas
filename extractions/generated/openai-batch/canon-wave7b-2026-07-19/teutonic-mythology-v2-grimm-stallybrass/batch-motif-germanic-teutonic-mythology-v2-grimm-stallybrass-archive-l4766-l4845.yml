candidate_motifs:
- id: motif:1
  label: Accidental spilling of a superhuman carrier’s load creates landforms
  taxonomy_refs: []
  basis: Multiple examples explain hills, sandbanks, rocks, peninsulas, or other features
    as earth, sand, stones, or pillars leaking, falling, or being scattered from a
    giant, giantess, sacred female, or divine carrier.
  evidence_refs:
