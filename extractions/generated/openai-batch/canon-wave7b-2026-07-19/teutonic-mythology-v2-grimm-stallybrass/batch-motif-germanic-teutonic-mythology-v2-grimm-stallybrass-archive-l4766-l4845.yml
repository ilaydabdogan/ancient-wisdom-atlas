canonical_text:
  quote: ''
  summary: The passage collects legends in which giants, giantesses, the Virgin, fays,
    or Athena carry earth, sand, stones, or a mountain in aprons, sacks, gloves, or
    on the head; accidental leaks, fright, pursuit, or interruption cause the loads
    to be spilled or deposited, explaining hills, sandbanks, rocks, peninsulas, or
    sacred sites. It also notes that giants fear Thor or thunder.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A giant’s leaking apron drops earth that becomes nine hills near Rambin, later
    thirteen little hills near Gustow, and the remaining earth makes Prosnitz Hook
    and the peninsula of Drigge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same giant is angered by the remaining gap between Rügen and Pomerania,
    dies of apoplexy, and leaves the dam unfinished.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Pomeranian giant girl tries to make a bridge to Rügen by carrying sand in
    an apron; sand leaking from a hole forms Dubberworth hill, and after her mother
    threatens punishment she spills the rest, forming barren hills near Litzow.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Zechiel and her sister wish to build a bridge over the Sound; Zechiel gathers
    stones in her apron.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After being shot at by a man and frightened by Thor’s thunder, Zechiel falls
    dead and scatters stones that become large rock masses.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Giants are described as so afraid of Thor that they hide in rock clefts and
    under trees when they hear thunder.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Gothland mountain-being refuses a christening invitation after learning
    Thor would be present.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Fladsø giant fills a wallet with sand to bury Nestved; sand leaks through
    a hole and makes a string of sandbanks between Fladsø and Nestved, while the remainder
    is flung toward Nestved.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lars Krands fills his glove with sand, covers an offended farmer’s farmhouse
    and yard, and the sand leaking through five finger holes makes five hills.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Netherlands, Hillegersberg hill is attributed to sand that a giantess
    lets fall through an apron.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that similar tales are found among Teutonic peoples, Finns,
    Celts, and Greeks.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: Near Pajunde in Tawastoland, rocks are said to have been carried by giant’s
    daughters in their aprons and tossed up.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: French traditions place the holy Virgin or fays in roles otherwise occupied
    by giantesses.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Notre Dame de Clery carries earth in her apron, deposits it at two places
    while evading Judas, and oratories are built on both sites.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: In a Charente tradition, the holy Virgin carries a large stone on her head
    and four pillars in her apron; one pillar falls into Saintfront marsh.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: A Greek legend has Athena fetching a mountain from Pallene to fortify the
    Acropolis.
  category: action
  evidence_refs:
  - ev:11
