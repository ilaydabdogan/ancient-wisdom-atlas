candidate_motifs:
- id: motif:1
  label: cosmic life arising from thawing ice and heat
  taxonomy_refs:
  - chaos
  basis: The earliest life in the account comes when heat and mild air act on hardened
    ice, making the drops quicken into Ymir and later allowing the cow to arise from
    dripping ice.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: The taxonomy reference to chaos is broad; the passage specifically describes
    ice, heat, and thaw rather than an abstract chaos doctrine.
- id: motif:2
  label: primeval giant as ancestor of giants
  taxonomy_refs: []
  basis: Ymir generates beings from his body, and the text says the families of giants
    spring from this event.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No closer supplied taxonomy ref directly names this giant-progenitor motif.
- id: motif:3
  label: world made from the slain primordial giant
  taxonomy_refs: []
  basis: After Ymir is slain, his blood, flesh, bones, skull, brows, brain, and in
    one variant hair are transformed into parts of the ordered cosmos.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage describes a killing and cosmogonic use of the body, but does
    not explicitly call the act a ritual sacrifice.
