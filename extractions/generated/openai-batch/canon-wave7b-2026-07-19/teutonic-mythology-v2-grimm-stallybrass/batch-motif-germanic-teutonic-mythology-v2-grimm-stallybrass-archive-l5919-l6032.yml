canonical_text:
  quote: ''
  summary: 'The passage recounts a Norse cosmogony: heat melts primordial ice and
    gives rise to Ymir; Ymir produces giants; the cow Auðhumla nourishes Ymir and
    licks Buri out of salty ice; Borr’s sons slay Ymir, whose blood drowns most giants
    and whose body becomes the ordered world; Bergelmir and his wife survive in a
    luðr; and the gods create Askr and Embla from trees and give them life faculties.
    Authorial notes add comparisons to Zend, deluge-vessel, and cosmic-egg traditions.'
  language: English with Old Norse poetic citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sparks, flame, mild southern air, and heat act on hardened ice; the thawing
    drops quicken into life and become Ymir, also called Orgilmir by the Hrimthurses.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ymir sleeps and sweats; a man and wife grow under his left hand, and one foot
    with the other engenders a six-headed son, from whom giant families spring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A cow named Auðhumla arises from dripping ice, and four streams of milk flow
    from her udder to nourish Ymir.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Auðhumla licks salty ice-rocks, and over three days a man named Buri emerges:
    first a hand, then a head, then the whole man.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Buri’s son is Borr; Borr takes Bestla, daughter of the giant Bolthorn, and
    they beget Odin, Vili, and Ve.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Odin, Vili, and Ve slay Ymir; the blood from Ymir’s wounds drowns all giants
    except Bergelmir and his wife, who escape in a luðr and become ancestors of the
    younger giant race.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sons of Borr move Ymir’s body into the middle of Ginnungagap and make
    sea and water from his blood, earth from flesh, mountains from bones, rocks and
    crags from teeth and broken bones, and sky from the skull.
  category: action
  evidence_refs:
  - ev:6
