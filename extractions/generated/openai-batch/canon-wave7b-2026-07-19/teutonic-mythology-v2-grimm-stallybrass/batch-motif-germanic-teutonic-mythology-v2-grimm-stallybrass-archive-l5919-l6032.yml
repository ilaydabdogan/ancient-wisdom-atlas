  cautions: This is a comparative note in the passage, not the main Norse narrative,
    which uses Ymir’s body rather than an egg.
comparison_claims:
- id: claim:1
  claim: 'The author notes a functional comparison between the Norse cow Auðhumla/Buri
    episode and a Zend system in which the first man proceeds from the haunch of the
    primeval bull Kayomer: both associate a primeval bovine with the emergence of
    an early human or man.'
  claim_level: same_function
  target: 'Zend system: first man from the haunch of the primeval bull Kayomer'
  evidence_refs:
  - ev:3
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The forms differ: in the Norse account a cow licks a man from salty
    ice, while the cited Zend note has a first man proceeding from a bull’s haunch.
    The passage does not support historical contact.'
- id: claim:2
  claim: The author cautiously relates Bergelmir’s escape in a luðr to deluge accounts
    in which a rescued child floats in a cradle, because both involve survival from
    a flood-like destruction by means of a container.
  claim_level: same_motif
  target: Deluge accounts of a rescued child floating in a cradle
  evidence_refs:
  - ev:5
  - ev:12
  counter_evidence_refs:
  - ev:12
  confidence: low
  limitations: The note says the meaning of luðr is uncertain, and also says Snorri
    has a grown giant with his wife, not a child in a cradle.
- id: claim:3
  claim: The author’s note compares other cosmogonies in which heaven and earth are
    made from parts of an egg to world-formation by divided primordial material; this
    is functionally analogous to, but materially different from, the Ymir body-creation
    episode.
  claim_level: same_function
  target: Kalevala and Indian cosmic-egg creation traditions cited in the note
  evidence_refs:
  - ev:6
  - ev:8
  - ev:13
  counter_evidence_refs:
  - ev:6
  - ev:8
  confidence: low
  limitations: The Norse passage makes the world from a slain giant’s body, not from
    an egg; the comparison is authorial and limited to cosmogonic function.
