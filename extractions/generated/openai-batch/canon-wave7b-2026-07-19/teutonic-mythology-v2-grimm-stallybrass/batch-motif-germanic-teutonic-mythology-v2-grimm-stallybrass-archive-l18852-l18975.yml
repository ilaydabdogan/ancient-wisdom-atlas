canonical_text:
  quote: ''
  summary: The passage assembles medieval and older witnesses for contests over departing
    souls by angels, devils, Michael, and other beings; compares these with Norse
    and fairy traditions of soul-claiming; and introduces a chapter on Death as a
    messenger or escort rather than a killer, including Christian angels, the angel
    of death, sermons on Death as messenger, and Hel as receiver of the dead.
  language: English with Middle High German, Old High German, and Latin cited excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Angels and devils are described as flying in opposed struggle and drawing
    souls in different directions, one upward and the other downward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Michael receives a margrave's soul, and bright angels come with song and conduct
    it joyfully to heaven; other cited passages have devils striving with St. Michael
    for a soul and a king's soul being conducted by Michael.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Michael is described as taking on the office of Mercury or the Walchure and
    is cited in a Latin record as overseer of paradise and prince of souls; another
    passage introduces black, white, and pale troops that fight over souls.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Muspilli fragment says that when the soul rises and leaves the body lying,
    one host comes from heaven and another from hell, and they fight around it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage cites Jude v. 9 as telling of archangel Michael and devils striving
    for the body of Moses, and states that the champion Michael seems borrowed from
    that source.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author states that Norse OSinn, Thorr, and Freyja appropriated separate
    portions of the slain.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A superstition says the soul, after quitting the body, spends the first night
    with St. Gerdraut, the next with St. Michael, and the third in the place it has
    earned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: An Irish fairytale has spirits of the Silent Folk violently contest for three
    nights at cross-roads over which churchyard a corpse should be buried in.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Elves and dwarfs are said to steal live children and maidens, and the water-nix
    is said to keep souls of the drowned in his house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Death is presented, in the olden view described here, as one who fetches and
    escorts to the underworld, not as the being that kills; sword or sickness kills,
    while Death comes as a deity's messenger.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: In a fairytale example, the angel of death gives a child a flower-bud and
    says he will return when it blossoms.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Christian examples are cited in which angels carry the beggar's soul to Abraham's
    bosom, while loathly wights sink the rich man's soul into black hell.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Sermon examples call Death the Lord's messenger who may knock at the door
    and a general messenger who leaves no one free; another passage says Death announces
    his coming so that he may escort the person.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: Hel, the death-goddess, is described as receiving the dead man in her house
    and refusing to give him up.
  category: action
  evidence_refs:
  - ev:13
