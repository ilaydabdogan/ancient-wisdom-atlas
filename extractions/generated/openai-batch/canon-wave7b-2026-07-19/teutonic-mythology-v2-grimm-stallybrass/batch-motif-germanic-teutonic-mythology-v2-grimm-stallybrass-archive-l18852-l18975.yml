comparison_claims:
- id: claim:1
  claim: The passage treats the Geo., Brandan, Morolt, and Muspilli examples as closely
    related instances of a struggle or scramble for the soul by heavenly and infernal
    powers.
  claim_level: same_motif
  target: medieval German and related poetic descriptions of heavenly and hellish
    hosts contending for souls
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The cited passages are summarized or excerpted, and the extraction
    does not verify their wider contexts.
- id: claim:2
  claim: The passage links Michael's role as champion in the contest with Jude v.
    9 and the tradition of Michael and devils striving over Moses's body.
  claim_level: historical_contact
  target: Epistle of Jude v. 9 and the reported lost 'Anabasis Moyses' tradition
  evidence_refs:
  - ev:5
  counter_evidence_refs:
  - ev:5
  confidence: medium
  limitations: The passage says Michael seems borrowed from this tradition, but it
    separately suggests that the broader idea of soul-strife may predate Christian
    tradition.
- id: claim:3
  claim: The author cautiously compares the contest or jealousy over souls with Norse
    divine apportionment of the slain among OSinn, Thorr, and Freyja.
  claim_level: same_function
  target: Norse allocation of slain among OSinn, Thorr, and Freyja
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The author phrases this as something that may be supposed, not as demonstrated
    historical dependence.
- id: claim:4
  claim: The passage proposes that the pairing of St. Gertrude and Michael in post-mortem
    lodging can be translated back into Frowa and Wuotan or Donar as functional equivalents.
  claim_level: same_function
  target: Frowa and Wuotan or Donar as proposed equivalents of Gertrude and Michael
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: This is an interpretive reconstruction by the author and is not directly
    evidenced by a quoted mythic narrative in the passage.
- id: claim:5
  claim: The passage aligns Jewish and Christian angelic conveyance of souls with
    the older heathen view of Death and Hel as receivers or escorts of the dead.
  claim_level: same_function
  target: Jewish/Christian angels and personified Death compared with Hel or Haija
  evidence_refs:
  - ev:9
  - ev:11
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim concerns functional similarity in afterlife conduct, not
    proven common origin.
- id: claim:6
  claim: The passage groups the Irish Silent Folk, elves and dwarfs, and the water-nix
