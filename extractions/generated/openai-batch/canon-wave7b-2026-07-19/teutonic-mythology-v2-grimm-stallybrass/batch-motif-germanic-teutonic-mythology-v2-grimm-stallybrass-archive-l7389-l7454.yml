canonical_text:
  quote: ''
  summary: 'The passage surveys annual or calendrical water rites: Whitsuntide water-drinking,
    Petrarch’s report of women bathing or washing in the Rhine at Cologne on St John’s
    vigil, a Naples sea-washing custom at St John’s, and Augustine’s condemnation
    of similar St John’s sea or natural-water washing as a pagan remnant. Grimm discusses
    whether such rites were heathen, Christianized, or locally introduced through
    Christian tradition.'
  language: English with embedded Latin and Italian quotations
  quote_policy: summarized
