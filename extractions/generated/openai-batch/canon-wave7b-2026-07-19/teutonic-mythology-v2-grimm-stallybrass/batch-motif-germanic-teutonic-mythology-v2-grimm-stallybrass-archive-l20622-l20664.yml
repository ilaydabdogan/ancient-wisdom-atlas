canonical_text:
  quote: ''
  summary: The passage gathers medieval German phrases about a person’s own angel,
    then links Christian guardian-angel language with Norse and Icelandic fylgja traditions.
    It describes St. Michael becoming a baptized man’s fylgju engill, death-near persons
    seeing their fylgja, the severing of the bond at death, the attendant spirit offering
    service to another, Norwegian beliefs about the folgie appearing in animal form,
    family-attached fylgjur, and supplementary notes on good and evil angels, animals’
    angels, male-gendered angels, and friendship between guardian angels.
  language: English with embedded Middle High German and Old Norse terms
  quote_policy: summarized
