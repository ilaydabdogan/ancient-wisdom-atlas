- id: obs:1
  text: Several cited medieval German expressions refer to a person’s own angel as
    present, tending, guarding honour, separating a devil from someone, giving instruction,
    greeting, or acting as an intimate expression of the speaker’s soul.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Nialssaga cap. 101, a heathen accepts baptism only on the assurance that
    St. Michael will become his fylgju engill; cap. 23 is said to mention Gunnar’s
    fylgja.
  category: relationship
  evidence_refs:
