canonical_text:
  quote: ''
  summary: 'The passage surveys need-fire practices and explanations: fire made by
    spinning, sawing, rubbing, or wheel-and-spindle friction; ash and smoke used protectively
    or productively; Swedish, German, North English, and Mull examples; and a 1767
    Mull cattle-disease rite involving extinguished household fires, friction-made
    fire, incantation, heifer sacrifice, relit hearths, and feasting.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ashes from an engendered fire are described as being strewn over fields as
    protection against vermin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boys are described as producing fire by rapidly spinning a pointed stick,
    wound with a string, in a wooden socket.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A magic bath prescription requires fire not made with common flint-and-steel,
    but made by sawing with wood from a lightning-struck apple tree upon a wooden
    threshold, then kindling birch-fungus from that fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage explains need-fire either as fire used in a time of need or pestilence,
    or as fire elicited by thumping, rubbing, or shaking.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Sweden the fire is said to be called vrideld and gnideld, and to be produced
    by violently rubbing two pieces of wood together, sometimes using boughs of nine
    sorts of wood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Smoke from gnideld is described as salutary; fruit trees and nets fumigated
    with it are said to become more productive, and cattle are driven over such smoke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In North England, a belief is reported that an angel strikes a tree and then
    need-fire can be obtained from it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the Mull account, disease among black cattle leads people to perform an
    incantation; they carry a wheel and nine oak spindles to the top of Carnmoor and
    extinguish every fire in every house within sight of the hill.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the Mull account, the wheel is turned from east to west over the nine spindles
    until fire is produced by friction; the rite loses effect if fire is not produced
    before noon.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Mull rite fails for several days, and the failure is attributed to one
    householder who refuses to let his fires be put out.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After servants are bribed to extinguish the remaining household fires, the
    Mull participants raise the fire, sacrifice a heifer, cut the diseased part in
    pieces, and burn it while the animal is still alive.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Mull participants light their own hearths from the pile and feast on the
    remains.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: An old man from Morven is described as master of ceremonies and as speaking
    words of incantation throughout the raising of the fire.
  category: speech
  evidence_refs:
  - ev:10
