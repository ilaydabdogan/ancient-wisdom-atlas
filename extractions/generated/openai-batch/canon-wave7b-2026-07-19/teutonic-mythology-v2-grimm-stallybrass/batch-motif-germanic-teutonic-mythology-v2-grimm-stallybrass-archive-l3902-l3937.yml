  text: The passage says spirits are both drawn to humans and repelled by them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The downfall of heathenism is said to have changed the old relationship, giving
    spirits a new aspect as ministers and messengers of Satan.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some spirits, especially woodsprites, are said to take on a more savage, giant-like
    appearance; Grendel is described as bordering on giants and gods.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Wild women and female nixes are grouped with fortune-telling swan-maids, while
    elfins that present a drinking-horn are linked with the circle of valkyrs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage attributes a general beauty to female spirits and more individualized
    characteristics to male spirits.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wichtels, dwarfs, goblins, and the child-bugbear Man Ruprecht are said to
