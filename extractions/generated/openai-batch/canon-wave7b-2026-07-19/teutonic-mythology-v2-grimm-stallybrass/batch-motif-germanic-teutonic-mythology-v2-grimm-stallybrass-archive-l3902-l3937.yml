  text: These beings are said to seek renewal of their race through intermarriage
    with humankind.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: They are said to need human counsel and assistance in their affairs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Although more acquainted than humans with hidden virtues of stones and herbs,
    they ask human aid for their sick and for women in labor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: They borrow human vessels for baking and brewing and hold weddings and festivals
