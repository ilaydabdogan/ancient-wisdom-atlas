canonical_text:
  quote: ''
  summary: The passage describes changes in the perceived character of elves, nixes,
    goblins, woodsprites, and related beings after the decline of heathenism. It compares
    some female spirits with swan-maids and valkyries, contrasts female beauty with
    more individualized or comic male traits, and emphasizes that elves, nixes, and
    goblins often depend on humans for marriage, counsel, healing aid, utensils, halls,
    and questions of salvation.
  language: English
  quote_policy: summarized
literal_observations:
