canonical_text:
  quote: ''
  summary: The passage compiles Old Norse, Scandinavian folk-song, and Middle High
    German formulas about predestined events, fated death, and allotted life. It notes
    philological links between Old Norse and Middle High German destiny terms, mentions
    continuing popular fatalism, and distinguishes general destiny from personified
    fortune or weal such as Tyche, Fortuna, Welo/Wela, and Sælde. Footnotes mention
    divine and priestly knowledge of destiny and comparable Lithuanian and Letton
    fate terminology.
  language: English with quoted Old Norse, Middle High German, Swedish, Danish, Latin,
    French, Lithuanian, and Letton forms
  quote_policy: summarized
