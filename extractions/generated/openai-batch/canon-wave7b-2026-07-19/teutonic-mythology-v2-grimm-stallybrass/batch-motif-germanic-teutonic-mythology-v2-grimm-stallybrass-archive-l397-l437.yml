canonical_text:
  quote: ''
  summary: The passage discusses regional names for small elvish beings called heimchen
    or heinchen, their association with Berchta's train, and a conjectural connection
    with death and departed spirits. It then compares departed spirits in a furious
    host, Morolt's three colored troops of spirits who take charge of battle-dead
    souls, and Eddic categories of light, dusky, and black elves assigned to heaven,
    hel or hades, and Svartalfaheim. A footnote also mentions different races of elves
    contending for a corpse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Vogtland and part of East Thuringia, small elvish beings traveling
    especially in the train of Berchta are called heimchen; the name is presented
    as finer and nobler than querx or erdmannchen.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage considers the spelling heinchen and connects it conjecturally
    with Friend Hein, a name for death, and with a Low Saxon term glossed as winding-sheet.
  category: other
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:3
  text: The author describes a notion of departed spirits appearing in the furious
    host in the retinue of former gods and continuing a life of their own.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'In the hero-lay of Morolt, three troops of spirits take charge of fallen
    warriors and their souls: a white troop, a pale troop, and a black troop.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The three Morolt troops are explained in the passage as angels, kinsmen of
    the combatants coming from hades, and devils.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Norse alfar do not play a warlike part, while valkyrs
    have to do with battles; it adds that traditions and offices may have become tangled.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage aligns liosalfar with heaven, dockalfar and possibly nair with
    hel or hades, and svartalfar with Svartalfaheim.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage raises, without settling, whether dusky elves are souls of dead
    men or whether dockalfar and nair should be separated.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: A note cites different races of elves contending for a corpse.
  category: action
  evidence_refs:
  - ev:6
