canonical_text:
  quote: ''
  summary: The passage surveys Easter and Midsummer/St. John's fires in German-speaking
    regions, describing solstice naming, communal gatherings, blessing, singing, prayer,
    leaping over flames or coals, collection of wood and gifts, uses of flowers and
    herbs, health-related claims, and a few reported apotropaic or witch-related practices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Easter fires had largely been taken away from the
    people during the preceding hundred years by government action, with prohibitions
    elsewhere attributed to their unchristian character or to waste of timber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Midsummer is identified with the older term for the sun's wending or solstice,
    when the sun has reached its greatest height and must decline again; St. John's
    day is said to coincide with it.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fires are reported under names such as sunwentfeuer and related forms
    in documents and among Austrian and Bavarian peasantry.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that descriptions of Midsummer fires agree with descriptions
    of Easter fires, though with some divergences.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Gernsheim, the lighted fire is blessed by a priest; singing and prayer
    continue while it burns; after the flame goes out, children jump over the glowing
    coals, and adults formerly did the same.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: One account describes a garland of nine kinds of flowers, an open-sky fire,
    youth and poorer folk leaping over it, herbs cast into it, and lanterns decorated
    with red poppies or anemones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Nürnberg, lads beg billets of wood, carry them to the Bleacher's pond by
    the Spital-gate, make a fire, jump over it, and invite passers-by to leap for
    payment; the practice is said to keep the leapers healthy for the year.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Fulda country, boys beg for wood and other presents while singing a
    rhyme for the Johannisfeuer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Austrian Donauländchen on St. John's eve, fires are lit on hills, lads
    and lasses jump over the flames, and spectators cry out and sing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A recollection cited in the passage says that leaping over the solstice fire
    was widespread on St. John's eve and that mead was drunk over it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At Ebingen, peas boiled over the fire were kept and considered wholesome for
    bruises and wounds.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: A sermon report says that people danced and sang around Midsummer fires, and
    that one man threw a horse's head into the flame intending to force witches to
    fetch some fire for themselves.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Sebastian Frank reports a St. John's fire, wreaths of mugwort and monkshood,
    larkspur held in the hand, and a claim that looking into the fire through larkspur
    prevents sore eyes.
  category: action
  evidence_refs:
  - ev:10
