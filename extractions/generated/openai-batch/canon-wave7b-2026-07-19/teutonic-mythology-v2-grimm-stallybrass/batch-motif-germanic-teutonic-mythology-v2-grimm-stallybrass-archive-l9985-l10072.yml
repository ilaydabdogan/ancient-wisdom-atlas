canonical_text:
  quote: ''
  summary: The passage opens a chapter by presenting the heathen view of nature as
    living, speech-capable, sensation-bearing, and mutable across forms. It explains
    veneration of plants and animals as linked either to transformed higher beings
    or to close relations with gods and spirits. A footnote summarizes the Eddic Baldr
    myth in which Frigg obtains oaths from many natural beings and all creatures later
    mourn Baldr. The main section on trees describes Germanic sacred groves and trees
    dedicated to deities or spirits, protected from profane entry, stripping, or felling,
    and discusses sacred woods, sacrifices, and the term nimidas.
  language: English
  quote_policy: summarized
