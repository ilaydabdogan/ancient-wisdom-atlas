canonical_text:
  quote: ''
  summary: 'The passage surveys Germanic and related medieval traditions concerning
    giants: their names attached to plants and celestial bodies; myths in which divine
    figures place giant-related body parts in the sky; stories of giants stealing
    a hammer and cauldron; giants as a separate people dwelling in Jotunheim and mountainous
    regions; their association with stone, petrification, rock weapons, and metal
    or stone names; and the attribution of ancient buildings to giants, the devil,
    or pagans.'
  language: English
  quote_policy: summarized
