candidate_motifs:
- id: motif:1
  label: Caraway bread offends or endangers wood-wife relations
  taxonomy_refs: []
  basis: The wood-wife flees after tasting caraway bread and predicts trouble for
    the house; the passage also cites rhymes in which kümmelbrot is fatal or distressing
    to wood-folk.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage explicitly says the reason for the cumin or caraway aversion
    is unknown, so the function of the bread should not be overinterpreted.
- id: motif:2
  label: Marked or counted bread resists wood-wife taking
  taxonomy_refs: []
  basis: The passage reports pipping a loaf as a finger mark and conjectures that
    wood-wives could not carry off a pricked loaf; it also says they objected to counting.
  evidence_refs:
  - ev:3
  confidence: low
  cautions: This is framed as authorial conjecture rather than a complete narrative
    event.
- id: motif:3
  label: Gift of clothes or shoes ends nonhuman helper service
  taxonomy_refs:
  - sacred_exchange
  basis: Multiple examples show wood-mannikins, subterraneans, undergrounders, a lake-mannikin,
    and a wee washerwife leaving after humans provide clothes, coats, caps, or shoes;
    several explicitly call this being 'paid up' or 'paid off.'
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  confidence: high
  cautions: The taxonomy link to sacred_exchange is broad; the passage's own explanation
    of why garments end the relation is tentative.
- id: motif:4
  label: Nonhuman household labor reciprocated with food or meals
  taxonomy_refs:
  - sacred_exchange
  basis: The undergrounders work after receiving milk, and the lake-mannikin does
    jobs while receiving separate breakfast and dinner; other helpers perform service
    for mills or households.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: Not every example states an explicit bargain, and the passage later contrasts
    these beings with home-sprites who bargain for clothes.
- id: motif:5
  label: Faun-like wild man with tree or mountain association
  taxonomy_refs: []
  basis: The passage links solitary male wood-folk to gigantic fauns and wood-monsters,
    then identifies the salvage man with an uprooted fir-tree and Grinkenschmied in
    the mountain as wild-man or faun-like figures.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: This is a typological note rather than a full mythic episode.
