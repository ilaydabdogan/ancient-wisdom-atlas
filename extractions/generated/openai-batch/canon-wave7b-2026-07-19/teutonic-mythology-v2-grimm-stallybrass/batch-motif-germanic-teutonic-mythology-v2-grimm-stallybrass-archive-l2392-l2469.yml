canonical_text:
  quote: ''
  summary: The passage collects traditions about wood-wives, wood-mannikins, subterraneans,
    undergrounders, a lake-mannikin, and a wee washerwife. It describes bread or counting
    taboos, service rendered to human households or farms, and repeated departures
    after humans provide clothes or shoes. It closes with comparative classification
    of wood-folk alongside elves, wichtels, dwarfs, wise women, goddesses, fauns,
    wood-monsters, and wild men.
  language: English with embedded German terms and rhymes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A wood-wife tastes newly baked bread and runs off to the forest screaming.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wood-wife's rhyme says caraway or cumin bread has been baked for her and
    that it will bring the house great trouble; other cited rhymes call such bread
    the death, anxiety, or need of the wood-folk.
  category: speech
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: After the bread incident, the farmer's prosperity declines until he is impoverished.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage defines pipping a loaf as pushing a fingertip into it and reports
    the author's conjecture that wood-wives could not carry off a pricked loaf and
    therefore disliked the mark.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that wood-wives objected to counting and that the author
    does not know whether cumin disgusted them merely as an innovation or for another
    reason.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Wood-mannikins who had long served at a mill are scared away when the miller's
    men leave clothes and shoes for them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Lapohnen report, subterraneans who had done many services take new
    little coats and leave while crying that they are paid up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the smith story, undergrounders come nightly, make small metal vessels,
    consume a dish of milk, and leave after receiving red coats and caps, without
    touching the iron or returning.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Seewen farm, a lake-mannikin does jobs, is given separate meals, requires
    a precise task-giving phrase, and leaves after receiving a new coat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The wee washerwife's shoes are made by measuring footprints in flour; when
    the shoes are placed for her, she sobs, undoes her working dress arrangement,
    and leaves.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that similar tales are told of the brownie and of the first
    Wichtelmännchen story in the cited children's tales.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage says wood-folk living in groups resemble elves, wichtels, and
    dwarfs; solitary females stand nearer to wise women or goddesses, and solitary
    males to gigantic fauns and wood-monsters.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage identifies the salvage man holding an uprooted fir-tree and Grinkenschmied
    in the mountain as wild-man or faun-like figures within this comparative discussion.
  category: relationship
  evidence_refs:
  - ev:12
