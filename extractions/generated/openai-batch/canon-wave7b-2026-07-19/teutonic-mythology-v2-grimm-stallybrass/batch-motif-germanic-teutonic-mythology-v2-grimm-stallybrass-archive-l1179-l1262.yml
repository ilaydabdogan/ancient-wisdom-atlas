canonical_text:
  quote: ''
  summary: 'The passage surveys beliefs and terms about elves and dwarfs: elf breath
    and gaze causing effects on humans; knot-holes and elf-bores as elf-made openings,
    passages, viewing apertures, and summoning routes; a Småland tale of an elfmaid
    ancestress entering through a knot-hole with sunbeams, marrying, bearing children,
    and vanishing the same way; links between elves/alps and butterfly metamorphosis;
    and the invisibility of elves, dwarfs, Elberich, and mountain-cavern people through
    rings, garments, or gems.'
  language: English with cited Germanic, Danish, Latin, Old Norse, and Old French
    terms
  quote_policy: summarized
