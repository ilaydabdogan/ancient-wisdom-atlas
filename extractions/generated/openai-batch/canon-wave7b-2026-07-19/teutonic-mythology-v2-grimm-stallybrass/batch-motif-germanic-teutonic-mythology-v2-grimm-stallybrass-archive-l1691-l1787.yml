canonical_text:
  quote: ''
  summary: 'The passage catalogues attributes of elves and dwarfs: divination, prophetic
    warning, counsel, irritability, spinning and weaving, gossamer and cobweb associations,
    marvelous woven cloth, and metalworking. It gives examples from Eddic, German,
    Old French, Swiss, Scandinavian, Middle Dutch, and ancient Greek-related materials,
    including dwarf prophets, elvish spinners, mountain smiths, and cave smiths who
    work raw iron overnight for payment. It ends by introducing an uncertain named
    elvish genius attested in Middle High German poems.'
  language: English, with cited Germanic, French, Swedish, and Greek terms
  quote_policy: summarized
