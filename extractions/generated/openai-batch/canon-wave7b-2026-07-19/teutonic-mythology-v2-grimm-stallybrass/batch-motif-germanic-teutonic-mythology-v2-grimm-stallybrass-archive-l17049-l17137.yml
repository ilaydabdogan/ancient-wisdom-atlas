canonical_text:
  quote: ''
  summary: A comparative scholarly passage discusses the limited resemblance between
    an Old Norse/Eddic world-tree fable and an Eastern Barlaam and Josaphat-related
    parable, then relates Yggdrasil to Irminsul, world pillars, central orientation,
    and ash-tree traditions. It also describes Niflheimr, Hvergelmir, Nidhoggr, serpents,
    and Hel, arguing that early Germanic terms for hell indicated Hades or the death-kingdom
    rather than a place of torment.
