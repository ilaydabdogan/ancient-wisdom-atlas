canonical_text:
  quote: ''
  summary: 'The passage gathers Germanic and Scandinavian legends about giants: a
    group seeking heaven drowns after mistaking reflected sky in water for heaven;
    giants are described as an older mountain people displaced by humans; Thor defeats
    a giant through a stone-lifting test and hammer blow; numerous local legends explain
    large stones, finger marks, footprints, and body impressions in rock as traces
    of giants; and one giant-injury episode is compared to Wainamoinen.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed group traveling toward heaven reaches calm, clear water reflecting
    the sky, thinks it can enter heaven there, jumps in, and drowns.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author concludes from the collected traditions that giants were imagined
    as a people settled in mountains who gradually gave way to the human race.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says legend turns the giants’ stone weapons into a woodman’s axe
    or knife and their martial profession into baking bread.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: An ancient custom is described in which swords or knives were stuck into a
    yard tree, and a man’s strength was tested by how deeply he drove a hatchet into
    a stem.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a Swedish folktale, Thor and his henchman encounter a giant who says he
    is going to heaven to fight Thor because Thor has set his stable on fire.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Thor challenges the giant to lift a small stone that Thor has made heavy;
    the giant cannot lift it, while Thor’s servant lifts it easily.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After recognizing Thor, the giant attacks him; Thor swings his hammer and
    lays the giant prostrate.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that many German stories involve stones and hammers being
    hurled and giant fingers being imprinted on hard rock.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Examples include a Homberg giantess whose hurled stone bears finger marks,
    a Scharfenstein thrown by a giant in rage, and a Norwegian jutul’s stone flung
    across a bay with finger marks remaining.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Additional examples describe rival giants throwing quartz and granite blocks,
    combatants hurling named stones, a giantess leaving finger dents in slaty stone,
    and giants or giant maidens throwing stones in relation to churches, roads, or
    courtship.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When giants fight or pursue one another, the passage says they may leap over
    a village, cut a great toe on a church spire, and produce blood jets that form
    a pool.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Giants or their horses leave tracks in stone after leaping from cliffs, and
    a giant sitting or leaning on stone can leave the figure printed on the hard surface.
  category: action
  evidence_refs:
  - ev:8
