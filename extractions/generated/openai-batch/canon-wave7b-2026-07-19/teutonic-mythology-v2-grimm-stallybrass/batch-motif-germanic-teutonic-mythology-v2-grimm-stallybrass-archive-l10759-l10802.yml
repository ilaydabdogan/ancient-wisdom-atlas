  quote: ''
  summary: 'The passage surveys horse and ox ritual motifs: a Livonian horse-lot ordeal
    that spares Brother Theodoricus, Old Prussian reluctance to ride deity-associated
    horses, horse sacrifice and horseflesh, Kalmuk scaffolds with horse hides and
    heads oriented toward good or evil spirits, related German and classical parallels,
    ox sacrifice and royal or war use of oxen, and notes on horse prophecy and horse-ship
    or sea-born associations.'
