canonical_text:
  quote: ''
  summary: The passage surveys medieval German and related literary examples in which
    abstract qualities such as Honour, Truth, Peace, Mirth, Righteousness, Faith,
    Love, Fortune, Charity, and vices are personified. These figures leave lands,
    enter or depart from human bodies, accompany and protect persons, hover invisibly,
    lead other personified virtues, or perform actions such as spinning and weaving.
  language: English with quoted Middle High German and Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Truth and Honour are described as having gone out of the land, and a chronicler
    is cited as saying that Peace migrated into exile.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dame Honour is described as attaching herself to a hero and as being borne
    upright or carried by him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fromuot is treated as a female being who accompanies maidens for dancing,
    is called their queen-bee, enters the land in spring, then is missing and has
    fled out of Austria.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The poet imagines winning Fromuot back and bearing her on hands; another song
    says she travels sorrowfully from land to land seeking cheerful men and may visit
    prince Friderich's court.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Righteousness and her companions say they have been rejected, driven to another
    land, taken flight, and chased out of the land.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Truth and Faith quit the country; Truth slips into a parson, nests in his
    cheek, and leaves when he opens his lips; vices are summoned to creep into a judge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Love is said to visit or enter the human heart; a daughter asks whether Love
    lives on earth or hovers in the air, and the mother says Venus travels invisibly
    as a restless spirit.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Saelde and Honour become a man's companions, save him from harm, and take
    charge of him when they find him on the road; other cited passages say Honour
    resorts to a man, is in his house, or comes running with him.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Faith takes Shame, Courtesy, Chastity, Milte, and Honour with her, and the
    passage states that Faith commands and leads the other five.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Karitas is described as spinning and weaving the Saviour's tunic.
  category: action
  evidence_refs:
  - ev:9
