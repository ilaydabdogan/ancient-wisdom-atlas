canonical_text:
  quote: ''
  summary: 'The passage surveys beliefs and names connected with wind and whirlwind:
    Germanic terms for a tempest as the “wind’s bride”; explanations of whirlwinds
    as women, gods, devils, witches, fays, wood-wives, and female daemons; Polish
    tales of wounding the spirit in a whirlwind with a knife and of storm-riding punishment;
    and accounts in which wind or storm comes from the wings or form of an eagle,
    including Hraesvelgr, Garuda, Shetland lore, and a brazen eagle at Aachen.'
  language: English
  quote_policy: summarized
