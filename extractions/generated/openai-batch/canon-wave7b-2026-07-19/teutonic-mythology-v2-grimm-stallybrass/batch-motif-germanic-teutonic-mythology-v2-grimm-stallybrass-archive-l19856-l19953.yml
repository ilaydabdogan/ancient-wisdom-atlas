canonical_text:
  quote: ''
  summary: The passage recounts alternating favorable and harmful destiny-utterances
    by Oðinn and Thorr over Starkaðr, followed by judgment confirming the doom. It
    then compares this pattern to the ungracious fay, surveys Greek, Roman, Christian,
    apocryphal, and Norse examples of scales used to weigh fates, deeds, or outcomes,
    comments on late medieval star-based fate calculation, and closes with remarks
    on predetermined destiny known only obscurely or by special wisdom.
  language: English, with cited Old Norse, Greek, and Latin passages
  quote_policy: summarized
