canonical_text:
  quote: ''
  summary: The passage discusses names and images for the Pleiades or Seven-stars.
    It describes the cluster as seven, really six, larger stars near Taurus; notes
    the Greek Pleiades as daughters of Atlas and Pleione raised to the sky by Zeus;
    and surveys European popular imagery of the cluster as a hen with chickens. It
    then connects this image with nursery and folktale episodes in which nuts or eggs
    contain celestial gifts such as dresses marked with the sun, moon, and seven-stars,
    and a hen with chicks representing the Pleiades.
