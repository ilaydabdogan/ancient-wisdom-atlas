canonical_text:
  quote: ''
  summary: 'The passage discusses Germanic and Norse representations of giants: an
    eleventh-century spell involving a dummy on a hill with a child and a wound-blessing;
    Grimm’s association of sluggish or clumsy mountain-giants with later folk-tale
    giants, trolls, and devils; Norse poetic portrayals of giants as old, wise, faithful,
    and sometimes gentle; Odin’s wish to converse with the wise giant Vafthrudnir
    about ancient matters; giant rage expressed through violent acts involving rocks,
    stones, fire, water, trees, and stamping; giants chained by heroes and released
    in war; and the giant Beli slain by Freyr with his fist.'
  language: English with quoted Old/Middle German and Old Norse terms
  quote_policy: summarized
