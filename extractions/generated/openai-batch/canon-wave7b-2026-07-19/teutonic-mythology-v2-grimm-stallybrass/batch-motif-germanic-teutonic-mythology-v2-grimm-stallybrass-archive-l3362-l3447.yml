canonical_text:
  quote: ''
  summary: The passage discusses names and functions of home-sprites, goblins, and
    related beings. It distinguishes Nicolaus/Niclas from nix and Nisse, relates Niclaus/Glaus/Globes
    to roles elsewhere played by Ruprecht, and surveys house-spirit names derived
    from noises such as jumping, knocking, racketing, and tumbling. It also treats
    popel, mummart, butze/hutz, and related forms as muffled, masked, or child-frightening
    goblin figures, with notes on disguise, masks, wells, and parallel tale names
    whose names must be guessed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Nicolaus/Niclas is not derived from the High German common
    noun nix and has no connection with Nisse; it also says Niclaus, Glaus, or Globes
    can be assigned the same part elsewhere played by Ruprecht.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The spirits are described as making noises in houses: jumping softly, knocking
    at walls, racketing, and tumbling on stairs and in lofts.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several names for goblins or home-sprites are linked to noisy actions or sounds,
    including terms glossed as jumper, knocker, boisterous spirit, and thumping or
    bobbing spirit.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The popel, popelmann, and popanz are said to carry a side-meaning of a muffled
    ghost that frightens children, and are said to be seldom used of playful good-humoured
    goblins.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Popel is also explained as something that muffles itself, and the passage
    associates this notion with mask and tarnkappe.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mummart, mummel, mummelmann, and mummanz are said to express the same
    notion as poppart, with mummen or mummeln meaning to mumble or utter a muffled
    sound.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage raises a possible connection between mummart-related forms and
    mumel, a name of the watersprite, but presents this as a question.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Butze is said to have had the same meaning as mummart and poppart, and a place-name
    may refer to a well haunted by such a home-sprite.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Butze or hutz forms are linked with frightening children, biting formulae,
    masks, faces, clothes, and regional names such as hutzemann, hutzelmann, and hutzmummel.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: A footnote says that what the fairytale says of Rumpelstilt, including that
    his name has to be guessed, is told in other stories of figures such as Eisenhütel,
    Hopfenhütel, and several named dwarfs.
  category: sequence
  evidence_refs:
  - ev:5
