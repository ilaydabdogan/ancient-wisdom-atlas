canonical_text:
  quote: ''
  summary: 'The passage discusses the “child of luck” as a favorite or adopted child
    of personified Fortune/Saelde and connects this idea with Wuotan/Wish. It then
    surveys fortune-gifts and wishing-gear: Fortunatus’s purse and wishing cap, the
    cornucopia, wishing rods and flowers, dwarf-made divine artifacts in the Edda,
    self-acting weapons and food vessels, magic helmets and cloaks, and goddess ornaments
    associated with desire or fertility.'
  language: English
  quote_policy: summarized
