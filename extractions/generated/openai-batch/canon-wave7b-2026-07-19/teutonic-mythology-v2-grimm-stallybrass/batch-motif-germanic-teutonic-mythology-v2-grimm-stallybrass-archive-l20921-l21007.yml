  quote: ''
  summary: The passage catalogues personifications of air, fire, water, earth, trees,
    celestial bodies, time divisions, and seasons in Germanic and comparative traditions,
    with attention to gender, divine names, and parallels in Slavic, classical, and
    other linguistic material.
  language: English with cited Germanic, Latin, Greek, Slavic, and other terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Air and weather are associated with named female figures, with a personified
    'frau Luft,' with Kári, and with dwarfs, giants, and giantesses who raise wind,
    weather, and storm as servants of the highest god.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Loki and Logi are identified as gods of fire; Donar and Perun hurl lightning;
    Slavic Grom is thunder as a youth and Munija is lightning as a maiden.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fire is described as godlike, spoken to, and called a wood-killer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Water is represented by wave gods, a goddess, gender-variable names, water-goddesses,
    nixies, mermaids, and Odin under the name Hnikar.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Snow and Hoarfrost are treated as male, while Drifa, loose drifting snow,
    is described as a daughter of Snior.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Earth is described as necessarily female, like Terra and Tellus, and masculine
    Heaven is imagined as able to embrace her as bride.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage links some gods or divine names with mountains or rock-stone,
    including Fiorgynn, Fiorgyn, Perhunas or Fairguneis, and Hamar.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Forest worship is said to introduce deification of sacred trees, and named
    trees such as Frau Hasel, Frau Ellhorn, Frau Wacholder, and Frau Fichte are treated
    as living creatures.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Zio, like Zeus, is said to mean sky and day at first; Day is personified as
    masculine and as the son of feminine Night.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sun is pictured as female and the moon as male, while the gender of star
    names varies across Gothic, Old Norse, Old High German, Old Saxon, and Old English
    forms.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Summer and Winter are masculine in the author's Germanic material; most month
    names are masculine except Hrede and Eastre, while neuter 'year' is treated as
    lacking mythical prosopopoeia.
  category: attribute
  evidence_refs:
  - ev:8
