canonical_text:
  quote: ''
  summary: 'The passage discusses Muspilli and related apocalyptic traditions: Enoch
    and Elias oppose Antichrist, Antichrist is slain by Michael, and the Old Bavarian
    Muspilli poem depicts world-ending fire, burning mountains, social breakdown,
    and falling heavenly bodies. Grimm compares these elements with Eddic and Snorri
    accounts of Ragnarok, especially Surtr, the sons of Muspell, the gods'' battle
    against fire powers, and later Anglo-Saxon statements about Antichrist placing
    himself above heathen gods.'
  language: English
  quote_policy: summarized
