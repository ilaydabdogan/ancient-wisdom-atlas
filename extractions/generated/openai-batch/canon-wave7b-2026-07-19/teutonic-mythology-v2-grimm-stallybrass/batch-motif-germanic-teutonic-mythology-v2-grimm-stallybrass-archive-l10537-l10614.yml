canonical_text:
  quote: ''
  summary: The passage compiles comparative notices about horses as clean or helpful
    animals, horse speech and horse omens, severed horse heads used in magic and curse-stakes,
    gable horse-head carvings, and animal-head displays against pests or cattle-plague.
    It cites Persian, Norwegian, German, Scandinavian, Lower Saxon, Rhaetian, and
    Wendish examples, with some Latin and Old Norse quotations.
  language: English with quoted Latin and Old Norse
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that horse breath can set right pollution caused by swine
    breath, that the horse is a clean animal, and that a horse feeding from a laboring
    woman's apron helps her in labor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Persians chose a king by the neighing of his horse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says a Norwegian tale has a foal suckled by twelve mares, after
    which the foal talks sensibly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage connects retained wisdom in a severed head with practices of cutting
    off horse heads and setting them up.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a nursery tale, Falada's head is nailed over a gate and converses with
    the king's daughter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pliny is cited for a caterpillar remedy in which bones of a horse head are
    placed on poles in gardens.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Scandinavia, a horse head was placed on a pole with its jaws propped open
    and turned toward the direction from which a disliked person was expected to come;
    the passage calls this a neidstange or spite-stake.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Saxo passage, a severed head of a horse sacrificed to the gods is put
    on a pole, and Eric responds with words intended to turn the hostile effect back
    on the bearer.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Egils saga passage, Egill takes a hazel rod, sets a horse head on it,
    declares a niðstang against King Eirik and Queen Gunnhild, and turns the horse
    head landward.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Vatnsdæla saga passage, Jokull carves a man's head on the end of a
    stake, cuts runes with a formula, kills a mare, opens it at the breast, inserts
    the stake, and has it face Borg.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says that peasants' houses in parts of Lower Saxony, Holstein,
    and Mecklenburg have horse heads carved on gables and that the inhabitants regard
    them as roof ornaments.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The author says the gable custom may be old and may relate to a belief that
    outward-pointing heads keep mischief away from houses.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage cites a Mecklenburg report that horse heads are nailed transversely
    on roof gable-ends and are a reminiscence of sacred horses of the ancients.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage says older houses in Romanic Rhaetia have horses rushing at each
    other on gables, and the author cautions against hastily calling them Celtic symbols.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: The author states that horse-worship seems to belong equally to Celts, Teutons,
    and Slavs, while saying future research must clarify which branches were most
    attached to it.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Praetorius is cited for Wends keeping off or extirpating cattle-plagues by
    fixing the heads of mad horses and cows around their stables.
  category: action
  evidence_refs:
  - ev:11
