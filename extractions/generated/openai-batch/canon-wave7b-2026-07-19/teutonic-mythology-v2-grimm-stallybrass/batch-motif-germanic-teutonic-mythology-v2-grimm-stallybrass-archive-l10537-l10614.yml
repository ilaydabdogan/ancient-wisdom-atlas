comparison_claims:
- id: claim:1
  claim: The passage presents the Saxo, Egils saga, and Vatnsdæla saga materials as
    comparable variants of a hostile head-stake practice involving a head or carved
    head, a stake, orientation toward targets, and curse-like speech, formula, or
    runes.
  claim_level: same_motif
  target: Scandinavian niðstang/spite-stake and related curse-stake accounts
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: 'The examples vary in details: actual horse head, sacrificial horse
    head, carved human head, hazel rod, slaughtered mare, and different targets. The
    supplied passage is a secondary compilation.'
- id: claim:2
  claim: The passage treats horse-head carvings on gables in Lower Saxony, Holstein,
    Mecklenburg, and horse figures on older houses in Romanic Rhaetia as visually
    similar customs, while cautioning against securely identifying them as Celtic
    symbols.
  claim_level: visual_similarity
  target: Gable horse-head or horse-figure customs in northern Germany and Romanic
    Rhaetia
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not establish direct transmission or a single origin;
    it explicitly criticizes an over-hasty Celtic attribution.
- id: claim:3
  claim: The author groups horse-worship or horse-related sacred custom as belonging
    to Celts, Teutons, and Slavs, but frames the distribution as a question for future
    research.
  claim_level: same_function
  target: Celtic, Teutonic, and Slavic horse-worship or sacred-horse customs
