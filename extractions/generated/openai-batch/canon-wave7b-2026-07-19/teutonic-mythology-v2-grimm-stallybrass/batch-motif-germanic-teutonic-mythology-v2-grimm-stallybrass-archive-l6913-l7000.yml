candidate_motifs:
- id: motif:1
  label: Deluge followed by creation or renewal
  taxonomy_refs:
  - flood_and_renewal
  basis: The passage directly states that Indian and Teutonic traditions make the
    Deluge precede real creation and gives flood-origin accounts for peoples and tribes.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: high
  cautions: The passage is a comparative scholarly synthesis, not a single primary
    myth narrative.
- id: motif:2
  label: Flood vessel preserving survivors
  taxonomy_refs:
  - ark_vessel
  basis: The Indian account includes rishis in a ship; the Lithuanian account uses
    a nutshell as a vessel on the flood; the Welsh tale has a cradle floating with
    a child after inundation.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:9
  confidence: high
  cautions: The vessels differ greatly in scale and narrative role.
- id: motif:3
  label: Survivor pair as ancestors
  taxonomy_refs:
  - survivor_pair
  basis: One saved pair remains in the Lithuanian country and Lithuanians are said
    to descend from them; Philemon and Baucis are another rescued pair in a partial
    flood example.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The Philemon and Baucis example is not presented as ethnic ancestry in
    this passage.
- id: motif:4
  label: Flood as divine judgment on wrongdoing
  taxonomy_refs:
  - divine_judgment
  basis: Pramzimas sends water and wind against the sinful earth after seeing war
    and wrong; the Welsh tale describes sinful inhabitants who reject a messenger
    before the city is covered by water.
  evidence_refs:
  - ev:4
  - ev:9
  confidence: high
  cautions: The passage does not fully narrate the moral outcome of the Welsh tale
    beyond the city's inundation and the child's survival.
- id: motif:5
  label: Personified or divine messenger instructing survivors
