canonical_text:
  quote: ''
  summary: The passage compares Indian, Teutonic, Mosaic, Lithuanian, Greek, Biblical,
    Phrygian, and Welsh flood and creation traditions. It emphasizes deluge before
    creation in Indian and Teutonic material, relates Manus to creator figures, notes
    a fish revelation tale, gives a Lithuanian flood-origin account involving Pramzimas,
    water and wind giants, a nutshell vessel, a survivor pair, a rainbow instructor,
    and nine founding couples, and adds examples of partial floods involving Philemon
    and Baucis and a Welsh drowned city with a surviving child in a cradle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that in the Indian myth, as in the Teutonic myth, the Deluge
    precedes real creation, while in the Mosaic account Adam precedes Noah and the
    flood is not followed by a new creation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seven rishis are described as being in the ship and as divine rather than
    human, sons of Brahma, and older than the inferior gods created by Manus and their
    enemies.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Manus is described as a creator, and the passage connects his name with manushyas
    and German Mannus as names related to humankind.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that Brahma, as a fish, is caught by Manus and reveals the
    future to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A nursery tale is summarized in which a small all-powerful turbot or pike
    elevates a fisherman from poverty to high rank and returns him to poverty when
    he seeks equality with God under his wife's counsel.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Lithuanian account, Pramzimas looks from his heavenly house, sees war
    and wrong among men, and sends two giants, Waudu and Weyas, identified with water
    and wind, to devastate the sinful earth for twenty nights and days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pramzimas drops a nutshell while eating celestial nuts; it lands on the highest
    mountain, where beasts and several human pairs have taken refuge, and they climb
    into it as it drifts on the flood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Pramzimas looks down a third time, calms the storm, and makes the waters abate.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The saved people disperse, but one pair remains in the country and is presented
    as the ancestors of the Lithuanians.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: When the old survivor pair grieves, God sends the rainbow as a comforter;
    the rainbow counsels them to leap over the earth's bones.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The pair leaps nine times, and nine couples spring up as founders of the nine
    tribes of Lithuania.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that not all flood stories quoted describe a universal
    deluge, and gives Deucalion's rescue as affecting Greece alone.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: Philemon and Baucis shelter wayfaring gods, are warned by them, flee up a
    mountain, survive a rising flood, and are changed into trees.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In a Welsh folktale, a king sends a messenger to sinful city inhabitants,
    who ignore him and refuse him lodging.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The messenger spends the night in a miserable hut containing a crying child
    in a cradle, drops a glove in the cradle, and later sees the city covered by water
    while a cradle floats with both child and glove inside.
  category: sequence
  evidence_refs:
  - ev:9
