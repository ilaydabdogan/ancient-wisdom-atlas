canonical_text:
  quote: ''
  summary: The passage surveys the schrat or pilosus as a hairy daemonic being identified
    in learned sources with satyrs, incubi, dusii, and fauns. It describes household
    offerings for such sprites, an anecdote of a nocturnal hairy sprite in a smith’s
    house, a distinction between larger wood-schrats and smaller schrettels, evidence
    for cult at dedicated trees and temples, and medieval literary comparisons of
    fauns, phantoms, forest beings, smith-schrats, heroes, and supernatural unions.
  language: English with embedded Latin, Greek, Old High German, Old Norse, Old English,
    and Old French terms
  quote_policy: summarized
