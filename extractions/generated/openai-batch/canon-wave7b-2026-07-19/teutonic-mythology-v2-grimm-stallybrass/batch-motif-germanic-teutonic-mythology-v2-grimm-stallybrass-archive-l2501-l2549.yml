canonical_text:
  quote: ''
  summary: The passage discusses Grimm's conjectural interpretation of Gothic skohsl/scuohisal
    as a wood-sprite term connected with forest words and with daimonion. It links
    wood-sprites to sacred trees, forest worship, and semi-divine or human-like status.
    It then compares water-sprites as having a similar double aspect, mentioning swan-appearing
    wise-women and valkyrs, prophetic merwomen, Nerthus and Holla bathing in waters,
    and a well as the way to Holla's abode. A footnote recounts a folk-tale in which
    a wood-sprite in a forest near the Neva hews a boundary stone between Swedish
    and Moskovite lands.
  language: English
  quote_policy: summarized
