canonical_text:
  quote: ''
  summary: 'The passage compares annual and seasonal fire customs: Theodoret reports
    street pyres over which children and men leap and through which mothers pass infants;
    Roman Palilia rites for Pales include leaping over flames, driving cattle through
    embers, and kindling fire from stone and straw; similar fires are discussed in
    relation to Midsummer, Easter, needfire, new-moon prohibitions, Christian festival
    use, and possible native heathen continuities. The passage also notes water/bath
    explanations for a Slavic feast and briefly compares mythic infants placed in
    fire for immortality.'
  language: English, with Greek and Latin citations
  quote_policy: summarized
