canonical_text:
  quote: Here beetles appear as holy animals guarding gold, and themselves golden.
  summary: 'The passage collects Germanic and nearby European traditions about beetles
    and chafers: a dung-beetle sacred to Thor whose rescue atones for sins; stagbeetle
    links with thunder and fire; ceremonial reception of the first cockchafer as a
    spring harbinger; tales in which goldbeetles or horsebeetles mark hidden treasure;
    and Swedish uses of the goldbeetle as a marriage and harvest omen.'
  language: English
  quote_policy: quoted
