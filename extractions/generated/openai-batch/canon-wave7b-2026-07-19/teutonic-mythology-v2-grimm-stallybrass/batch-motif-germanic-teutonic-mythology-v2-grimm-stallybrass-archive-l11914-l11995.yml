canonical_text:
  quote: ''
  summary: 'The passage surveys Germanic and comparative traditions about dragons
    or worms: they lie on or guard gold, are old, venomous, flame-spitting, and sometimes
    winged; heroes such as Thor, Sigemund, Siegfried, Beowulf, Frotho, and Ragnar
    defeat them. It recounts Fafnir as a worm over inherited gold, Thora''s growing
    lyngorm subdued by Ragnar, and beliefs that dragon heart and blood confer knowledge
    or protection. It also notes Greek/Roman, Phaedrus, griffin, and Slavic parallels
    for treasure-guarding dragons.'
  language: English
  quote_policy: summarized
