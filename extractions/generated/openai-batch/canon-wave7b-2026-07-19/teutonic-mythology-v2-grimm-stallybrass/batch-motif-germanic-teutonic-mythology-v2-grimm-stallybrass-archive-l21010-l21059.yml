canonical_text:
  quote: ''
  summary: 'The passage discusses personification and possible deification of weapons
    and ornaments: the sword is treated as a masculine divine or heroic object associated
    with names such as Hairus/Heru/Cheru, Eor, Ares, and Sahsnot, while female ornament
    and the necklace are proposed as counterparts linked to Freyja and possibly the
    Anglo-Saxon goddess Rheda. Footnotes add related observations about horse and
    ship as precious goods, sea-horse imagery for ships, demonic sea-horses, weapon
    personifications, and an Indian personification of the sacrificial knife.'
  language: English
  quote_policy: summarized
