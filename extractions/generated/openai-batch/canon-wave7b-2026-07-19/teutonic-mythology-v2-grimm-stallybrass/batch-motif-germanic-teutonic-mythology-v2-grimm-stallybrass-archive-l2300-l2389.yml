canonical_text:
  quote: ''
  summary: The passage surveys medieval and Old Norse references to wild women, wild
    men, and wood-wives, then describes South-eastern German beliefs about small forest
    or moss folk. It lists their appearance, habits, exchanges with humans, fear of
    the wild huntsman, rewards involving gold, a tree-related death rule, and complaints
    about modern food customs.
  language: English with cited Middle High German and Old Norse terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The dwarf Karrioz is described as having a wild woman for his mother, with
    a short, hairy, strong body and bones without marrow, following his mother's stock.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists medieval and Old Norse terms for wild men and wild wood-wives,
    including references to forest or grove terminology.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: South-eastern German popular belief is said to present wild-folk, forest-folk,
    wood-folk, and moss-folk as a dwarf-kind people who live together but may appear
    singly.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: These folk are described as small, somewhat larger than elves, grey and old-looking,
    hairy, and clothed in moss.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Female wood-folk are mentioned more often; males are described as less good-natured,
    living deeper in the woods, and wearing green garments with red facings and black
    three-cornered hats.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Little wood-wives come to woodcutters, beg for or take food, and make it good
    afterward, often by giving advice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wood-wives sometimes help with kitchen work and washing, and they express
    fear of the wild huntsman who pursues them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the Saale, a bush-grandmother and her moss-maidens are reported.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wood-wives ask people who are baking to bake them a large loaf and leave it
    at a specified place; they later repay it or bring their own baking for ploughmen,
    and are offended if it is refused.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A wood-wife with a broken wheelbarrow asks for the wheel to be mended and
    pays with fallen chips that turn into gold.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A wood-wife may give a knitter a ball of thread that is never finished unwinding.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Whenever a man twists the stem of a young tree until the bark flies off, a
    wood-wife has to die.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A peasant woman nurses a crying wood-child; the child's mother gives her bark
    from the cradle, and a splinter of it becomes gold at home.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Wood-wives object to modern customs such as counting dumplings or loaves,
    pipping bread, and putting caraway or cumin seed in bread.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: A maxim in the passage warns not to shell a tree, tell a dream, or bake cumin-seed
    into bread.
  category: speech
  evidence_refs:
  - ev:10
