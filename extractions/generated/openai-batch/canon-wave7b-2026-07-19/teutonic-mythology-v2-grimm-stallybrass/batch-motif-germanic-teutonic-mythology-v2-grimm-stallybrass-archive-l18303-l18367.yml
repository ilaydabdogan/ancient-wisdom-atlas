canonical_text:
  quote: The world's destruction and its renewal succeed each other in rotation
  summary: The passage first states that destruction and renewal of the world occur
    in rotation and that spatial phenomena such as the world and its end may be personified
    as Halja, Hades, and Surtr. It then begins a chapter on souls, describing the
    soul as a feminine life-giving essence distinct from breath or spirit, and summarizes
    beliefs in the freed soul as airy, hovering, vanishing, assuming shapes, or becoming
    a flower or bird. It gives examples of a death-linked rosebud, a rosebud as a
    dead youth's soul, and plants or flowers associated with slain bodies.
  language: English
  quote_policy: quoted
