canonical_text:
  quote: ''
  summary: 'The passage discusses practices and beliefs concerning fire: attempts
    to stifle fire with worn clothing, stamped earth, or an altar-cloth; Icelandic
    saga references to earth-fire; distinctions between profaned domestic flame and
    newly generated sacred or wild fire; formal production of needfire by rubbing
    wood; early ecclesiastical notices and prohibitions; and later accounts of needfire
    rites for crops and cattle, including driving livestock through the fire.'
  language: English with Latin, German, and Old Norse terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When valuables catch fire, people are said to throw on either clothing worn
    next to the skin or earth first stamped on with the foot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rupertus Tuitiensis reports that a white altar-cloth was thrust into a fire
    to stifle it; the flame hurled it back, and the cloth remained uninjured but bore
    a red streak.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that casting clothes into fire is similar to casting clothes
    into a lake, referring back to an earlier discussion.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In an Icelandic saga example, a great horrible man rows to land in an iron
    boat, digs under a stable door, and earth-fire breaks out there at night, consuming
    every dwelling.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Flame kept among humans and propagated from one fire to another was regarded
    as unserviceable for sacred uses.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A new flame was preferred for sacred uses and was called wild fire, in contrast
    to tame or domesticated fire; the passage compares this requirement to drawing
    holy water fresh from a spring.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Heroic combat passages are cited in which wild fire is described as appearing
    from harness, helmets, or blows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Fire struck or scraped from stone is said to have a claim to freshness, but
    generation of fire from wood is described as more primitive and hallowed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Accidental wild fire arising when a carpenter drives a nail into mortised
    timbers of a new house is described as an omen of danger.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The formal kindling of flame by rubbing wood is identified as needfire, and
    the passage says its ritual can be traced back to heathen sacrifices.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Early ecclesiastical sources are cited as mentioning fire rubbed from wood
    under the name nodfyr and forbidding sacrilegious fires called niedfyr.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: In a St John Baptist's day practice, rural people pull a fence stake or pole,
    tie a rope around it, move it until it catches fire, feed the flame with straw
    and dry wood, collect the ashes, and scatter them over vegetables to drive away
    caterpillars.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: In a cattle-murrain rite, husbandmen extinguish all hearth flames, collect
    straw, water, and bushwood from every house, and use an oaken stake and tarred
    wooden roller to produce fire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The cattle-murrain needfire is enlarged with shavings, straw, heath, and bushwood;
    cattle and horses are driven through it two or three times, and variant methods
    use two stakes, greased rags, rope, or wood of nine kinds.
  category: sequence
  evidence_refs:
  - ev:8
