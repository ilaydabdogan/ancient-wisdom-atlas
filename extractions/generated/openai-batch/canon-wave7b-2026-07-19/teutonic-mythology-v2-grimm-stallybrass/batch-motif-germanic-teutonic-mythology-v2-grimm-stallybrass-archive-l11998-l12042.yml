canonical_text:
  quote: ''
  summary: The passage compares terms and traditions around dragons, adders, snakes,
    treasure, household spirits, and an uncertain Lombard worshipped being. It describes
    the zmek as a dragon-spirit that can appear as a wet bird or chicken and bring
    money; a Finnish female serpent-associated being as guardian of subterranean wealth;
    Teutonic and Slavic dragons as male treasure guardians; and the adder or unke
    as a friendly homesprite appearing as a crowned maiden with a serpent tail or
    as a fay. It then introduces traces of beetle-worship and Germanic terms for beetles
    or chafers.
  language: English, with cited Latin and Germanic lexical items
  quote_policy: summarized
