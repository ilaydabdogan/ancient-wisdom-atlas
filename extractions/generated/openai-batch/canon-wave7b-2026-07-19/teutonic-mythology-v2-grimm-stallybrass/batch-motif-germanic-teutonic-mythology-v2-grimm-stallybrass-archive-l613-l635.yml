canonical_text:
  quote: ''
  summary: A dialect tale locates the Ramsflue as a hollow rock with a small entrance.
    Strange little men live there apart from humans, eat roots and berries, bathe
    in a brook while one keeps watch, and flee into the cave when people approach.
    They are harmless and helpful. One little man helps a peasant with a load, is
    injured by a fastening pole, reassures the peasant, and applies a herb to its
    bloody finger. A footnote notes Swabian and Middle High German parallels to the
    little man's saying.
  language: Swiss German dialect / Alemannic German with editorial English context
  quote_policy: summarized
