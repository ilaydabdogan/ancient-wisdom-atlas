  text: While the load was being fastened, the little man was on the wagon arranging
    the work and the peasant was pulling on the fastening pegs or ties.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The little man did not place the rope correctly; when the peasant pulled,
