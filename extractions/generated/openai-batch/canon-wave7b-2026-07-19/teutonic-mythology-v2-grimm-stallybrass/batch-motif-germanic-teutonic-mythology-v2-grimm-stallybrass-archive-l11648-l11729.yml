canonical_text:
  quote: ''
  summary: 'The passage surveys beliefs about small birds and snakes: a Swiss house-redling/redbreast-associated
    bird is protected by a red-milk taboo and linked with covering the dead; the titmouse
    is treated as a legally protected, sacred, prophetic, and auspicious bird; snakes
    are described as awe-inspiring, connected with stories of human-snake form exchange,
    and worshipped in heathen contexts. The passage then recounts hagiographic material
    about Lombards venerating a viper image, which Barbatus obtains through Theodorada,
    melts down, and remakes into a plate and chalice for Christian sacramental use.'
  language: English with Latin and German citations
