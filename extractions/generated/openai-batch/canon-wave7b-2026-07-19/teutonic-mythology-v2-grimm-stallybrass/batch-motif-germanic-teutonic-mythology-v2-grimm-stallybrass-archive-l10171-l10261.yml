  text: Trees under which people sacrificed and on which the head or hide of a slaughtered
    beast was hung are described as sacred.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Saplings that grew on top of sacrificed animals are also treated as protected;
