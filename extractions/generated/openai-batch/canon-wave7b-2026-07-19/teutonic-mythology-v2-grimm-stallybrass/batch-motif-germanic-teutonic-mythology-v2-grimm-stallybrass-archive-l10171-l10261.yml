  quote: ''
  summary: 'The passage surveys Germanic and related traditions about hallowed trees:
    trees at sacrifice sites, saplings over sacrificed animals, sacred tree species,
    legal and folkloric protections, personified trees addressed as dames, prayers
    before taking elder wood, warning voices from trees, tree-dwelling beings, offerings
    under elder, and a cited Uppsala tree-and-fountain sacrificial setting.'
  language: English
  quote_policy: summarized
