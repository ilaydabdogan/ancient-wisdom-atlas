  text: Several names and descriptions identify the rainbow as a stave or bow, God's
    stool, a goddess's chair, Lauma's or Laima's girdle, heaven's girdle, heaven's
    bow, a weather-rod, and the thunder-god's sickle.
  category: object
  evidence_refs:
  - ev:2
