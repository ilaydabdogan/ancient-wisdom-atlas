  quote: ''
  summary: The passage surveys beliefs and names connected with the rainbow across
    several traditions, including taboos, transformation by passing under it, divine-object
    names, messenger functions, an afterlife route, and end-time signs. It then begins
    a chapter on Day and Night, summarizing an Eddic genealogy in which Night bears
    Day and both are set in the sky with horses and cars to travel around the earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage mentions danger associated with being on the rainbow, including
    a man pushed off it, and a Finnish song in which a maiden sits on the rainbow
    weaving a golden garment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Chinese superstition is reported in which pointing with a finger at the
    eastern rainbow is forbidden and is believed to cause an ulcer in the hand; the
    rainbow is also described there as a sign of unbridled lust.
  category: speech
  evidence_refs:
  - ev:1
