canonical_text:
  quote: ''
  summary: The passage surveys medieval and comparative examples of personified virtues,
    vices, and Rumour. It describes allegorical courts and forest-mountain encounters
    involving Minne, Honour, Constancy, Justice, Charity, and attendants; contrasts
    fair virtues with foul vices; and compares ancient Greek, Latin, and possible
    Eddic personifications of Rumour or divine messengers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young Minne is described with Wanhelmut as wearing checkered garments, entering
    men's and women's names in a book, and proclaiming new ways of the world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Old Minne declares hope that she will appear again among men and bring the
    false Minne to justice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dame Honour sits in judgment with Loyalty, Charity, and Manhood on her right,
    and Shame, Chastity, and Moderation on her left.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In P. Suchenwirt's narrative, the poet follows a narrow path into a forest
    where a high mountain rises to the clouds, and a dwarf at a cave mouth tells him
    of a court held nearby by dame Constancy and Justice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The poet reaches a judgment-seat where Minne appears as plaintiff, followed
    by Moderation, Chastity, Shame, and Modesty; her cause is pleaded and decided,
    and she notices the poet in hiding.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In H. Sachs's narrative, a hairy wood-wife meets the poet in a May forest
    on a moss-grown rock, guides him to dame Charity's tower, shows him the chambers,
    and brings him before Charity.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that a rock-dwelling in a wooded mountain appears to be
    an essential part of many of the narratives and associates it with a ruined castle
    and towers of named female figures.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage asks whether the companions or playmates attending dame Honour
    may derive from priestesses, ministering virgins, valkyrs, or messengers of a
    goddess.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: Personifications of vices are said to exist but to be fewer and weaker than
    personifications of virtues, with malignant daemons preferably made masculine.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that personifications of Sin and Schuld are not found in
    the cited Middle High German poets, while Schande, Untriuwe, and Unfuoge are discussed
    as possible or attested personifications or negations.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Bible Guiot example, three fair maidens named Charité, Vérité, and
    Droiture are opposed by three old and ugly ones named Traison, Ypocrisie, and
    Simonie.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Rumour is described as an ancient personification imagined as a divine messenger
    moving through the air, listening to events, and bringing tidings to the highest
    gods.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage identifies Greek Ossa and Pheme, Latin Fama, and possibly Eddic
    Gna as figures or names related to the personification of Rumour or messenger
    activity.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
- id: obs:14
  text: Gna is described as a goddess whom Frigg sends on errands to all parts of
    the world; she rides through air and sea on the steed Hofvarpnir.
  category: action
  evidence_refs:
  - ev:11
