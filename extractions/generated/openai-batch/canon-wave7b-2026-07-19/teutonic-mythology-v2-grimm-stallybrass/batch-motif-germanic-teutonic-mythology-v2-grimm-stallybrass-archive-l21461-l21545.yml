candidate_motifs:
- id: motif:1
  label: allegorical court of personified virtues
  taxonomy_refs:
  - divine_judgment
  basis: The passage repeatedly depicts personified figures such as Honour, Constancy,
    Justice, and Minne in judicial settings with judgment-seats, attendants, plaintiffs,
    and decided causes.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The courts are allegorical and literary; the passage does not state that
    all judges are deities.
- id: motif:2
  label: forest-mountain threshold encounter with supernatural guide
  taxonomy_refs:
  - mystical_quest
  - ascent
  basis: The poet follows a narrow path into a forest, approaches a mountain and cave,
    meets a dwarf informant, and in another example is guided by a wood-wife to Charity's
    tower.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage summarizes literary allegories rather than a single mythic
    quest narrative.
- id: motif:3
  label: rock-dwelling or tower of a female numinous figure
  taxonomy_refs: []
  basis: The passage states that a rock-dwelling in a wooded mountain is an essential
    feature in many narratives and associates it with the white lady and towers of
    Veleda, Menglo'S, and Brunhild.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage itself frames the pattern broadly and comparatively, not as
    one fixed myth.
- id: motif:4
  label: retinue of female attendants around a high virtue or goddess
  taxonomy_refs: []
  basis: The passage asks whether Honour's companions and playmates may go back to
    a retinue of priestesses, ministering virgins, valkyrs, or messengers of a goddess.
  evidence_refs:
  - ev:5
  confidence: uncertain
  cautions: The author presents this as a question; no direct evidence of derivation
    is provided in the passage.
- id: motif:5
  label: virtue and vice personified through contrasting appearance
  taxonomy_refs: []
  basis: The Bible Guiot example opposes fair maidens representing virtues to old
    and ugly figures representing vices, and the passage states that virtue is painted
    fair and godlike while vice is foul and fiendish.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is an allegorical literary pattern; the passage notes that vice personifications
    are fewer and weaker in the relevant antiquity.
- id: motif:6
  label: Rumour as divine aerial messenger
  taxonomy_refs: []
  basis: Rumour is described as a personified messenger sent through the air to listen
    and bring tidings to the highest gods; Greek and possible Eddic examples are discussed.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The identification of Eddic Gna with this pattern is explicitly tentative.
- id: motif:7
  label: goddess's errand-rider on a supernatural steed
  taxonomy_refs: []
  basis: Gna is sent by Frigg on errands to all parts of the world and rides through
    air and sea on Hofvarpnir.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage excerpt ends while continuing the description, so the full
    context of Gna's ride is incomplete.
