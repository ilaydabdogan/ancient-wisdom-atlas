canonical_text:
  quote: ''
  summary: The passage surveys Germanic terms such as þyrs, þurs, durs, turs, and
    hüne as names for giants, demons, wild beings, and related figures. It cites glosses
    equating them with cyclops, Orcus, Dis, daemonium, and ogre-like beings; mentions
    a fen-dwelling þyrs, the giant Thyrsis, Swiss Dürst as the Wild Hunter, and Low
    German drus/drost as devil, dolt, or giant. It then proposes an etymological link
    with dryness, thirst, wine, drunkenness, and the broader pattern of giants marked
    by inordinate eating and drinking, while adding speculative ethnic-name comparisons.
  language: English
  quote_policy: summarized
