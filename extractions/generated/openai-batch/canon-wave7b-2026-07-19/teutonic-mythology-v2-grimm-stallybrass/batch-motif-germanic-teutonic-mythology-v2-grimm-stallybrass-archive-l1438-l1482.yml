canonical_text:
  quote: ''
  summary: A farmer whose peas are eaten is advised to beat around with willow twigs
    to knock off a dwarf's cap. He catches a dwarf, releases him for a promised wagon
    of money, and goes to the dwarf's cave before sunrise after being told sunrise
    is at twelve. At the cave, dwarfs sing that the farmer does not know their sunrise
    time and give him a skinned horse instead of money; a piece of it becomes gold
    at home, and the cave and horse vanish when others seek the rest. Grimm comments
    that the before-sunrise tryst relates to dwarfs' avoidance of daylight and compares
    related Eddic, Norse, and Rumpelstilzchen material. A footnote then reports a
    Swedish account in which a man sees a beautiful she-dwarf by a mountain, catches
    her by throwing steel between her and the mountain, receives her father's consent,
    covers and christens her, and is instructed to bring wedding provisions to the
    mound or mountain.
  language: English with Low German and Swedish quoted material
  quote_policy: summarized
