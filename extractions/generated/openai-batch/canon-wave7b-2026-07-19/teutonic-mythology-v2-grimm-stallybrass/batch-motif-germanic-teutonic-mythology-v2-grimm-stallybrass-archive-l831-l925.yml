  summary: The passage surveys Germanic and nearby folk traditions about dwarfs, earth-men,
    mountain-sprites, elves, and earth-wives. These beings are associated with holes,
    caves, mountains, underground chambers, treasures, smith-work, gifts, helpful
    services, and occasional removal or guidance of humans into subterranean realms.
    It also compares names for good elves and discusses possible links between Dame
    Venus, Holda/Holle, and related hidden or subterranean female figures.
  language: English, with German and other quoted terms
  quote_policy: summarized
