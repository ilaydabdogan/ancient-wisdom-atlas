  summary: The passage surveys Germanic and related medieval uses of hell/helle/hellia
    as the abode of the dead, later as the abode of the damned. It describes hell
    as a lodging or inn, discusses hellweg as an old death-way or corpse-road, cites
    Old Norse travel to Hel by riding or driving, and summarizes Hermodr's underworld
    ride after Baldr through dark valleys to the river Gioll, a golden bridge guarded
    by Modgudr, and Hel's lower northward road and palace.
