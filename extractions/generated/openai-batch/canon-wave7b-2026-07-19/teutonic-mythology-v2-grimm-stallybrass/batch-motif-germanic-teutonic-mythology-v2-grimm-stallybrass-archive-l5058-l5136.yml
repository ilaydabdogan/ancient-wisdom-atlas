canonical_text:
  quote: ''
  summary: The passage gathers German and Finnish anecdotes in which a giant maiden
    finds a ploughman with his animals and plough, carries him to her mother, and
    is told to put him back because agricultural humans will harm or replace the giants.
    It then gathers etiological stories in which a giant, giant-like figure, or very
    large man removes a painful stone or other small irritant from a shoe or eye,
    leaving or revealing a rock, hill, or fir-cone.
