canonical_text:
  quote: ''
  summary: The passage describes Germanic and Northern European home-sprites as household
    beings who may care for animals and bring prosperity, but can also torment servants,
    spoil chores, or laugh maliciously when offended. Servants and farmers maintain
    relations with them through small food offerings, respectful speech, quiet evenings,
    and annual wages or gifts such as clothing. The Nissen and tomte are described
    with red caps, moonlight or midday appearances, musical skill, work with straw
    or hay, and attachment to particular households. The passage compares their caps,
    invisibility, treasure-guarding, bells, and music with other goblin, dwarf, Roman,
    Scandinavian, Scottish, and literary examples.
  language: English
  quote_policy: summarized
