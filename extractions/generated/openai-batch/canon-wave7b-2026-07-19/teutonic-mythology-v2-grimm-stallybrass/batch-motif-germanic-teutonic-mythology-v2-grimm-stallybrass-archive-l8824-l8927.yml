canonical_text:
  quote: ''
  summary: 'The passage surveys St. John''s or Midsummer fire customs across several
    European regions: decorated public bonfires, greenery and herbs, jumping and dancing
    around flames, charred remains taken home for protective or healing effects, a
    tree-pole bonfire in the Hautes Pyrenees, English and Scandinavian bonfires, Italian
    and shipboard examples, and notes on a burning wheel procession and the term brising.'
  language: English with quoted Latin and Germanic/Romance terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eligius is cited as forbidding solstitial observances, enclosures or processions,
    dances, booths, and diabolical songs on St. John's or other saints' feasts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In great cities such as Paris and Metz, a decorated pile of wood was set up
    in the public square before the town hall and lit by the mayor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Aix and Marseille on St. John's Day, streets and squares were cleaned,
    flowers were brought into town, houses were decked with greenery, some plants
    were thrown into the flame, young people jumped over it, and passers-by were subjected
    to fireworks or water pranks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In some villages, riders on mules and donkeys carried lighted fir branches
    in their hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In many places, people took charred brands and charcoal home because salutary
    or magical effects were supposed to come from them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Poitou, participants jumped three times around the fire with a walnut branch,
    fathers passed white mullein and walnut through the flame and nailed them over
    the cowhouse door, and old men put coal in wooden shoes as a safeguard.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Hautes Pyrenees, communes selected a tall tree on May 1, lopped and
    wedged it, kept it until June 23, dragged it to a hill or mountain, had it blessed
    by a priest, planted it upright, and set it on fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In England, Midsummer Eve fires were kept up until midnight or cock-crow,
    and youth danced around the flame wearing garlands and carrying violets.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In Denmark, St. Hans evening fires were also called street-fires and were
    lit in public streets, squares, and on hills; people avoided grass because poisonous
    plants were thought to come up that night, while wholesome plants were hung in
    houses.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In Norway, bonfires were burned by lanes to drive harm from creatures, and
    the passage notes the terms brandshat for wood burnt in fields and brising for
    the kindled fire.
  category: other
  evidence_refs:
  - ev:9
- id: obs:11
  text: The author says brising reminds him of Freyja's gleaming necklace and suggests
    possible transfer between the name of the flame and the jewel.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage reports Midsummer fires in Italy, including Orvieto legal exemptions
