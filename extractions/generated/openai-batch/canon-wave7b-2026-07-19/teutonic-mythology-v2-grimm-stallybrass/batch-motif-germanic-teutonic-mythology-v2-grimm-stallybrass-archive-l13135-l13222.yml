  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The spots or shady depressions on the full moon are said to have generated
    similar myths in several nations.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Indian example, common people see a hare in the full-moon spots, and
    Chandra, the moon god, is said to carry a hare.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Mongolian account, Buddha Sakya-muni changes himself into a hare to
