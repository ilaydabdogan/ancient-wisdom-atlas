canonical_text:
  quote: ''
  summary: The passage surveys beliefs and practices tied to lunar phases, including
    washing taboos, healing prayers, agriculture, death omens, public acts, and luck.
    It then compares explanations of full-moon spots in Indian, Mongolian, Ceylon,
    Greenlandic, and Old Norse materials, especially hare-in-the-moon traditions and
    the Old Norse account of Mani taking Bil and Hiuki from earth while they draw
    water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Servian women are described as avoiding shirt-washing at new moon because
    they say linen would become “mooned” in the water, bulge, pucker, and tear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage proposes washing by the waning moon so that stains and dirt disappear
    with the dwindling light.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author describes a “symbolical coupling of means and end,” giving examples
    in which holy water floats misfortune away and mill-wheel spray scatters sickness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A sufferer faces the waning moon and asks that pains diminish as the moon
    decreases; the sufferer may also address the new moon asking that what is seen
    increase and suffering cease.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author states that turning the face toward the moon is taken as a relic
    of heathen moon-worship.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that observation of lunar changes must have influenced
    sacrifices, casting lots, and war, and then lists lunar timing beliefs about death,
    sowing, and work.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A footnote reports bad luck for a player who turns his back to the moon and
