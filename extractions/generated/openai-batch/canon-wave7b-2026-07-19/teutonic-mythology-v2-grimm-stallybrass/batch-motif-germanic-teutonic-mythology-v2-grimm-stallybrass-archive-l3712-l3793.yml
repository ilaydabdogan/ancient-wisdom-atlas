canonical_text:
  quote: ''
  summary: 'The passage surveys home-sprites and related goblins: a barn-haunting
    sprite escapes an attempted burning by riding with the household goods; a little
    black man bought with a chest hides behind an oven and lives peaceably with the
    household; captured independent goblins offer gifts, fortune-telling, or wishes
    for release; Polish and German examples describe spirits or manikins that cannot
    easily be left behind; and hostile house-spirits appear as noisy gangs that pelt
    passers-by with stones or tiles.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A North English Brag or Barguest is described as usually ending mischievous
    frolics with a horselaugh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When people set fire to a barn in order to burn the goblin haunting it, the
    sprite is instead sitting at the back of the cart used to remove the contents.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A little black man is bought with a chest; when the chest is opened, he hops
    out and slips behind the oven.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Attempts to rout the little black man from behind the oven are fruitless,
    but he lives on good terms with the household and sometimes shows himself to them,
    though not to strangers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the black figure recalls both Scandinavian dwarfs
    and the devil.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some goblins live independently rather than in anyone's service; when caught,
    such a being may offer gifts or tell fortunes in order to be set free.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The folet in Marie de France is described as granting three wishes, and the
    captive marmennill or sea-wife is said to do the same.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Iskrzycki offers service to a noble household, signs an agreement, is seen
    to have horse's feet, and insists on serving despite the master's attempted withdrawal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Iskrzycki lives invisibly by the fireplace, performs assigned tasks, and later
    reveals that he is with the household in the carriage when they try to move away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: An alraun or gallows-mannikin is described as a semi-diabolic being carved
    from a root, small enough to be kept in a glass, and requiring bathing and nursing.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The alraun resembles the home-sprite in that it does not leave its owner and
    returns when thrown away, unless sold for less than it cost; the last purchaser
    has to keep it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'A futtermännchen follows a farmer''s attempted move: the farmer sees it washing
    its grey coat in a brook while saying they will move to the new house the next
    day.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Unfriendly spirits that take possession of a house commonly appear as a gang,
    disturb the householder's rest with riot and clatter, and throw stones from the
    roof at passers-by.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the French comedy cited, goblins racket in a house, sing and play at night,
    aim tiles at passers-by during the day, are fond of fire, and make an uproar when
    the master spits.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage says folleti pelt with stones and compares stone-throwing racketing
    sprites with devils or spectres more than with elves.
  category: relationship
  evidence_refs:
  - ev:11
