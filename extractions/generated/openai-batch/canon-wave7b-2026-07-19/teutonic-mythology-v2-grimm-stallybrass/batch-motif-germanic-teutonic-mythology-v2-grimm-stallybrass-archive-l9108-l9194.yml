  text: French Christmas log customs include the souche de Noel or trefue; at Marseille
    a large oaken log was sprinkled with wine and oil and lit by the master of the
    house; in Dauphine the chalendal was lighted on Christmas eve, sprinkled with
    wine, regarded as holy, and left to burn out undisturbed.
  category: action
  evidence_refs:
  - ev:3
