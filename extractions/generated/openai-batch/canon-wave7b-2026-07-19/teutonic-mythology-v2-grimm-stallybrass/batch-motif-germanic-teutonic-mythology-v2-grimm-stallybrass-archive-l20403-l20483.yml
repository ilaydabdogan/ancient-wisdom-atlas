  summary: 'A comparative catalogue of wishing-gear and miraculous objects: portable
    ships and hats, magic footwear and animal transport, generative rings and money-producing
    charms, treasure-opening rods and invisibility devices, Frodi''s wishing-mill,
    fortune wheels, immortalizing drinks and apples, wishing-cloths, miraculous animals,
    wishing-trees, horns and bowls of plenty, elf gifts, inexhaustible foods, miraculous
    goblets including the Grail, relic-powered objects, and wish-fulfilling stones.'
