canonical_text:
  quote: ''
  summary: 'A comparative discussion of sacred cattle and other domestic animals:
    oxen and cows are worshipped or used in sacred transport, oath, battle, creation,
    milk, adornment, and sacrifice; linguistic links between cow and earth are proposed;
    related cow and ox practices are noted among several traditions; boars and goats
    are described as holy sacrificial animals, with a giant divine boar and a Slavic
    sea-boar apparition also cited.'
  language: English with embedded Latin, Old Norse, Germanic, Sanskrit, and Greek
    terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage mentions a chariot drawn by four white oxen in Lorraine, a Cimbrian
    oath over a brazen bull, and worship of an ox at Hvitabaer and a cow at Upsal.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cows are said to have been yoked to Nerthus's car, and two milch-kine are
    compared with the ark of Jehovah.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Edda cow Audambla is said to play a major role in the origin of men and
    gods and to have been regarded by the author as a sacred beast.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: King Eysteinn of Sweden is said to have trusted in a cow called Sthiija; she
    was much worshipped, her lowing was difficult to withstand, and she was led into
    battle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: King Ogvaldr is said to have carried a sacred cow with him by sea and land
    and to have drunk her milk constantly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cow horns are described as adorned with gold, and Alpine herdsmen are said
    still to decorate cattle horns with ribbons and flowers; sacrificial oxen are
    inferred by the author to have been decorated.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that Sanskrit go can mean both cow and earth or region,
    and the author links this with Audambla, Norse creation, and cow-earth associations.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author suggests that Europa, courted by Zeus in bull shape, may have been
    thought of as a cow like Io, and that her name relates to earth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author cites cow and ox worship among Indians, Egyptians, and Romans,
    and also notes the Israelite burnt offering of an unyoked red heifer.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Boars and he-goats are described as holy sacrificial beasts; the boar is said
    to be dedicated to Freyr and goats to Thorr.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: An old song preserved by Notker describes a huge boar whose bristles are as
    high as the forest and whose tusks are twelve ells long.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A proposed reason for boar veneration is that the boar roots up the ground
    and humans learned ploughing from him.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: A Slavic tradition is cited in which, during threatened rebellion, a great
    boar with a white tusk gleaming from foam comes out of the sea near Riedergost
    and shows itself with terrible shaking.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that only domestic animals were fit for sacrifice, though
    not all domestic animals, especially not the dog.
  category: attribute
  evidence_refs:
  - ev:10
