canonical_text:
  quote: ''
  summary: The passage surveys German regional terms around pilwiz/bilwit and related
    forms, connecting some to witches, magicians, tangled hair, and a crop-cutting
    belief called bilbezschnitt or related names. It records accounts in which a malicious
    person or hilsenschnitter cuts another's ripe corn with a sickle tied to the foot
    or toe, causing the crop yield to move to the cutter. It also describes countermeasures
    using stubble, smoke, a mirror, an elderbush, and a grave, and notes variant attributions
    to human sorcerers, the devil, elvish goblins, and sickle-bearing women in Hulda's
    host.
  language: English with embedded German and Latin terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that pilwis can mean witch, and that pielweiser is glossed
    as magician and soothsayer.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Related terms are used for tangled hair, shaggy scalps, unwashed or uncombed
    children, and a curse compared to devil's child.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bilbezschnitt and variant forms denote a cutting through a field of corn,
    regarded as the work of a spirit, a witch, or the devil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A cited Bavarian law penalizes someone who acts against another person's harvest
    by malefic arts, with the offense called aranscarti.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In one account, a malicious person goes at midnight, naked, with a sickle
    tied to his foot, repeats magic spells, and passes through ripe corn so that the
    grains from his path fly into his barn and bin.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In a Vogtland report, hilsen- or hilver-schnitter go before sunrise on St.
    John's day or sometimes Walpurgis-day, with small sickles tied to their great
    toes, stepping slantwise across the field.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Vogtland hilsenschnitter are said to wear small three-cornered hats; if
    they are saluted during their walk, they must die that year.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Vogtland hilsenschnitter believe they receive half the produce of the
    field where they have reaped, and small sickle-shaped instruments are said to
    have been found in some houses after death.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: If the owner of the field gathers cut stubble and hangs it in smoke, the hilsenschnitter
    gradually wastes away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Thuringian countermeasure says to sit on an elderbush at the highest sun
    on Trinity Sunday or St. John's day, with a looking-glass on the breast, to detect
    the cutter, though the observer risks death if seen first.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The same Thuringian account says the cutter may die if he sees himself in
    the mirror on the observer's breast.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Another countermeasure requires carrying cut ears to a newly opened grave
    in silence and without bare-hand contact; if a word is spoken or sweat from the
    hand enters the grave, the thrower will die when the ears rot.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that what is imputed to human sorcerers in one place is
    elsewhere laid to the devil or to elvish goblins, who may be known by small hats.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage notes that Alberus places sickles in the hands of women travelling
    in Hulda's host.
  category: object
  evidence_refs:
  - ev:9
