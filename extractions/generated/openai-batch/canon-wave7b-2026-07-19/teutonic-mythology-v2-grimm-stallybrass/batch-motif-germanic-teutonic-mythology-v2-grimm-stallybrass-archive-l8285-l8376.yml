canonical_text:
  quote: ''
  summary: The passage compiles accounts of needfire or friction-generated fire in
    Highland, Western Island, English, Creek, Arab, Chinese, Indian, and Persian contexts.
    It describes fire made by rubbing wood or cane, the extinguishing and renewal
    of household fires, uses against cattle disease or human illness, sprinkling water
    boiled on the new fire, burning a calf against murrain, and a Creek harvest rite
    involving fasting, new clean fire, and new corn and fruits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Highlands, especially Caithness, needfire is described as a remedy
    for preternatural cattle diseases attributed to witchcraft.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A circular booth of stone or turf is erected on a small river, lake, or island,
    with a birch rafter, upright post, horizontal auger, levers, and wedges used in
    the fire-making apparatus.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men first remove all kinds of metal and then rotate the horizontal pole while
    others wedge the upright post against it until friction ignites the wood.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the needfire is procured, other fires are quenched; rekindled household
    and outbuilding fires are called sacred, and cattle are made to smell them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Martin's account calls the fire tinegin, a forced or necessity fire used as
    an antidote against plague or murrain in cattle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Martin's account, all parish fires are extinguished, and eighty-one married
    men are the required number; nine at a time rub two planks until fire is produced.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Each family receives new fire from the forced fire; water boiled over it is
    sprinkled on people infected with plague or cattle with murrain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Whitsun-morning account describes stablemen rubbing fire out of wood, boiling
    cabbage over it, and eating the cabbage in the belief that it protects against
    fever for the year.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Northamptonshire account describes a field fire and a calf being killed
    and burned to stop murrain or protect the herd when cows are diseased or calves
    sickly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Creek harvest festival account includes a three-day fast, extinguished
    house fires, a chief priest producing new clean fire by rubbing dry sticks, distribution
    of the fire to dwellings, and women bringing home new corn and fruits afterward.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'The passage lists additional friction-fire notices: Arab fire-friction woods
    named March and Aphar, one male and one female; Chinese attribution of first wood-rubbing
    fire to emperor Sui; and Indian and Persian cane turned in dry wood.'
  category: other
  evidence_refs:
  - ev:8
