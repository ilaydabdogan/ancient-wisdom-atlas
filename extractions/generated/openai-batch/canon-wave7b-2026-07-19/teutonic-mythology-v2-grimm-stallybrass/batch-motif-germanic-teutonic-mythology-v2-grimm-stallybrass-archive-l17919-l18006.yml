  text: Tahitians are reported as saying that God shakes the earth, and Lettons as
    saying that Drebkuls beats the earth and makes it tremble; the passage compares
    Greek names for Poseidon/Neptune as earth-shaker.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sky is described as both a roof over the earth and a heavenly kingdom
    where gods and blessed men dwell.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bridge of the heavenly bow and the Milky Way are said to lead into the
    heavenly kingdom.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After ordering heaven and earth, creating Ask and Embla, and assigning Midgard
    as humanity’s habitation, the gods set up Asgard as their dwelling-place at the
    center of the world.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Valhalla is described as Odin’s celebrated abode, also called Odin’s halls.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: War-maidens conduct to Odin the heroes who have fallen on the battlefield
    from the beginning of the world.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Odin adopts the fallen battlefield heroes as children; they are called sons
    by wishing/adoption and sons of the god Wish.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The usual name of the adopted heroes in Valhalla is einherjar.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Valhalla is described as covered with shields and having 540 doors, each admitting
    800 einherjar at once, for a total of 432,000.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the midst of Valhalla stands the tree Læraðr/Lærðr, whose foliage is cropped
    by the she-goat Heiðrun.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Heiðrun’s udder yields a barrelful of mead each day, enough to nourish all
    the einherjar.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The stag Eikþyrnir gnaws the branches of the tree, and water trickles from
    his horns into Hvergelmir to feed the rivers of the underworld.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Valiant men are said to aspire to and attain Valhalla after death, while evildoers
    and cowards are excluded from it.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: A life-and-death conflict with a hero could be called showing him to Walhalla.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Accounts are cited in which departed heroes are received in Valhalla; Odin
    offers Helgi shared rule, and Odin prepares benches, goblets, and wine for Eyrikr.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Helgi, after receiving joint sovereignty, imposes menial service on Hundingr,
    whom he had slain; the passage treats this as continuation of rank distinctions
    in future life.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: A king’s earthly hall where heroes carouse can also bear the name Valhöll,
    mirroring the heavenly hall.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage states that Indian mythology has a heaven for heroes and Greek
    mythology assigns heroes an elysium in the far West on the happy isles of Okeanos.
  category: other
  evidence_refs:
  - ev:12
- id: obs:19
  text: The author asserts that belief in Walhalla was common to all Teutonic nations,
