canonical_text:
  quote: ''
  summary: The passage first notes explanations of earthquakes as divine shaking or
    striking of the earth, then describes the sky as a heavenly kingdom reached by
    the rainbow bridge or Milky Way. It summarizes the Old Norse ordering of the world,
    the creation of humanity, and the establishment of Asgard at the world’s center.
    It then describes Valhalla as Odin’s hall for warriors fallen in battle, conducted
    there by valkyries, adopted as Odin’s sons, nourished by mead from a goat associated
    with the tree Læraðr, and accompanied by a stag whose horns feed underworld waters.
    The passage also describes Valhalla’s exclusion of evildoers and cowards, receptions
    of dead heroes, continuity of rank in the afterlife, earthly halls mirroring the
    heavenly hall, and comparison with Indian and Greek hero-heavens while arguing
    that belief in Walhalla was broadly Teutonic.
  language: English
  quote_policy: summarized
literal_observations:
