canonical_text:
  quote: ''
  summary: The passage introduces a chapter shift from gods, half-gods, heroes, and
    other intermediary beings to natural phenomena and primitive substances. It argues
    that elements can be treated as sacred in themselves, while also being linked
    to divine beings in mythology. It further states that religious faith does not
    originate in elemental worship, but can tolerate and absorb it; after older gods
    and household gods are abandoned, reverence for elements may persist as a durable
    remnant of heathen practice under Christian conditions.
