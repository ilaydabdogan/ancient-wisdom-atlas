canonical_text:
  quote: ''
  summary: 'The passage gathers traditions in which the cuckoo''s call is treated
    as an omen or oracle: after Midsummer it may signify dearth; in Swedish usage
    maidens count its calls to learn years until marriage and judge the direction
    of the first spring call for luck, sorrow, or butter; Goethe''s spring oracle
    has the bird tell a couple about marriage and children; Caesarius and the Renart
    poem give examples of counting cuckoo calls for years of life; Pliny treats the
    cuckoo as a seasonal time-bird for agricultural labor; and a Swiss couplet expresses
    joy at its first March song. The passage also notes a resemblance to a woodpecker
    story and a footnote about snipe divination.'
  language: English with embedded Swedish, Latin, French, and German excerpts
  quote_policy: summarized
