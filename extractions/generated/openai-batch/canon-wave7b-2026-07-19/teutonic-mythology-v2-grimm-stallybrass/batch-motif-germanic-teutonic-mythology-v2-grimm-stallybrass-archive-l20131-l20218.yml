canonical_text:
  quote: ''
  summary: The passage surveys medieval poetic expressions that personify Sælde or
    Fortune as a female power who turns toward or away from people, guides them on
    paths, opens or shuts doors, follows or deserts them, gives gifts, clothes or
    covers them, laughs on them, and is imagined through floods, households, banners,
    hoods, plants, and paths. It then notes a Wunderer tale in which Frau Scelde is
    a king's daughter with three miraculous powers, and closes by discussing the rolling
    wheel of Fortune as a classical importation associated with Fors, Tyche, and Nemesis.
  language: English with cited Middle High German, Latin, and Greek expressions
  quote_policy: summarized
