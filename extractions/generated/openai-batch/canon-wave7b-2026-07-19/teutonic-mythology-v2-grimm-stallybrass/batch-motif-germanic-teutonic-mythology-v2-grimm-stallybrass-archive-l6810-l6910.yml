canonical_text:
  quote: ''
  summary: The passage surveys flood traditions in the Old Testament, Eddic narrative,
    Assyrian Sisuthros tradition, Apamea coin imagery, Greek Deucalion legend, and
    the Indian Mahabharata story of Manus and the fish. It notes recurring features
    such as divine warning, destructive flood, survival vessel, birds, mountain landing,
    sacrifice, renewal of humanity, and covenant or divine deliverance, while cautioning
    against assuming borrowing in the Eddic case.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Jehovah makes a covenant with man and sets his bow in the cloud as the covenant
    token.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Eddic narrative as summarized here, the flood swells up from the blood
    of a slain giant whose carcass supplies material for creating all things and the
    human race.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage compares Noah's box with Bergelmi's lur, but says mountain landing,
    dove, sacrifice, and rainbow are absent from the Eddic account as presented.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Assyrian tradition, Kronos warns Sisuthros of a coming downpour; Sisuthros
    builds a ship and embarks with men and beasts.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the Assyrian rain stops, birds are sent out; they return twice, the
    second time with slime on their feet, and stay away the third time.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sisuthros leaves the vessel first with his wife, daughter, and pilot; they
    pray, sacrifice, disappear, and a voice announces that Sisuthros has been taken
    up to the gods while the rest are to propagate the human race.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Assyrian vessel is said to have lain on the mountains of Armenia down
    to recent times.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Coins of Apamea are described as showing an ark on water with a man and woman
    inside, one bird sitting on it, another bird carrying a twig, and the same pair
    standing on land with raised right hands.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Greek account, Zeus determines to destroy mankind; Prometheus prompts
    Deucalion to build an ark, which receives Deucalion and Pyrrha.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Deucalion floats for nine days and nights, lands on Parnassus, sacrifices
    to Zeus, and Deucalion and Pyrrha create a new generation by casting stones.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Plutarch's addition says Deucalion reads storm or fair weather by whether
    a released dove flies back or stays away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some Greek branches are said to have flood stories naming Ogyges and Ogygos
    as heroes, but these accounts are described as lacking epic details.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the Mahabharata summary, King Manus saves a little fish, which grows too
    large for a vessel, then for a lake, then for Ganga, and must be taken to the
    sea.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The fish foretells a fearful flood and instructs Manus to build a ship, board
    it with the seven sages, and preserve the seeds of all things.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The fish appears horned, has the ship fastened to its horn by a rope, tows
    it for many years to the summit of Himavan, and tells the survivors to moor it
    at the place called Nauhandhanam.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The fish declares itself to be Brahma, lord of created things, and says it
    has delivered Manus and the others in the shape of a fish.
  category: speech
  evidence_refs:
  - ev:9
