comparison_claims:
- id: claim:1
  claim: The passage presents Old Testament, Eddic, Assyrian, Greek, and Indian materials
    as belonging to a broad deluge pattern involving destructive water and survival
    or renewal.
  claim_level: same_motif
  target: cross-traditional deluge / flood-and-renewal narratives
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage is a comparative secondary summary; it does not establish
    a single origin or direct transmission.
- id: claim:2
  claim: The passage explicitly compares Noah's box with Bergelmi's lur, while cautioning
    that absent details such as mountain landing, dove, sacrifice, and rainbow weaken
    a borrowing explanation.
  claim_level: same_function
  target: Noah's box and Bergelmi's lur
  evidence_refs:
  - ev:2
  counter_evidence_refs:
  - ev:2
  confidence: high
  limitations: The comparison is functional and formal; the author expressly resists
    inferring borrowing from the shared vessel feature.
- id: claim:3
  claim: 'The Assyrian Sisuthros and Greek Deucalion accounts share several narrative
    functions: warned survivor, vessel, flood, bird or dove episode, mountain landfall,
    and sacrifice.'
  claim_level: same_motif
  target: Sisuthros and Deucalion flood accounts
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The actors, chronology, and renewal mechanisms differ between the accounts.
- id: claim:4
  claim: The Apamea coin imagery visually resembles ark-flood iconography through
