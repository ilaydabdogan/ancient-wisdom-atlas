candidate_motifs:
- id: motif:1
  label: deluge destruction and renewal of humanity
  taxonomy_refs:
  - flood_and_renewal
  basis: Multiple summarized traditions include a destructive flood and either propagation
    of survivors, creation of a new generation, or preservation of seeds.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:8
  confidence: high
  cautions: The Eddic section is treated by the author as structurally related but
    missing several epic details.
- id: motif:2
  label: survival vessel in the flood
  taxonomy_refs:
  - ark_vessel
  basis: The passage names or describes Noah's box, Bergelmi's lur, Sisuthros's ship,
    the Apamea ark, Deucalion's ark, and Manus's ship.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The vessels vary in form and narrative function.
- id: motif:3
  label: supernatural warning before flood
  taxonomy_refs:
  - wisdom
  basis: Kronos warns Sisuthros, Prometheus prompts Deucalion, and the fish foretells
    the flood and instructs Manus.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:8
  confidence: high
  cautions: The warning figures differ in status and role across traditions.
- id: motif:4
  label: bird reconnaissance from flood vessel
  taxonomy_refs: []
  basis: The Assyrian account sends birds three times, the Apamea coin includes two
    birds with one carrying a twig, and Plutarch's Deucalion account includes a released
    dove.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The bird motif is not reported for every flood account in the passage.
- id: motif:5
  label: mountain landing or mooring after flood
  taxonomy_refs: []
  basis: The Assyrian vessel is linked to Armenian mountains, Deucalion lands on Parnassus,
    and Manus's ship is moored on Himavan at Nauhandhanam.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:9
  confidence: high
  cautions: The mountain is a landfall or mooring place here; the passage does not
    explicitly treat it as a cosmic mountain.
- id: motif:6
  label: post-deluge sacrifice or prayer
  taxonomy_refs:
  - sacrifice
  basis: Sisuthros and his companions pray and sacrifice after leaving the vessel,
    and Deucalion sacrifices to Zeus after landing.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: This detail is not given for the Indian or Eddic summaries in this passage.
- id: motif:7
  label: survivor pair in ark and renewal imagery
  taxonomy_refs:
  - survivor_pair
  basis: The Apamea coin shows a man and woman in an ark and on land, and Deucalion
    and Pyrrha are the married pair who survive and generate a new population.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: Some traditions in the passage involve larger survivor groups, such as
    men and beasts or seven sages.
- id: motif:8
