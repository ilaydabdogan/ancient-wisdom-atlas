canonical_text:
  quote: ''
  summary: The passage describes holy brooks, lakes, rivers, and sea-waters as sacred,
    weather-working, personified, or divine. It recounts an Estonian story of Lake
    Eim leaving a polluted bed, moving through the air with its fish, and settling
    among welcoming cultivators whom it fertilizes. It also surveys comparative examples
    of river and sea personification, oath-water, river sacrifice, sacred water-bounded
    lands, and named sea deities and waves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Estonian and Lettic names are glossed as meaning a holy brook, and the
    brook is said to regulate weather; rain can be obtained by throwing something
    into it, and drowned oxen in the lake are followed by snow and frost.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A carl with blue and yellow stockings is said to come up out of the brook
    at times; the passage identifies him as the spirit of the brook.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the story of Lake Eim, wild and wicked men live on the lake's banks, do
    not cultivate the watered meadows and fields, and befoul the wave with blood from
    robbery and murder.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lake Eim mourns, calls its fish together, and mounts with them into the air;
    the brigands seek fish and hidden treasure but find only snakes, toads, and salamanders
    at the bottom.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The airborne lake is described successively as a white cloud, a white swan,
    a white ship, and a dark drifting cloud, and a voice from its waters announces
    that it is coming to dwell with harvesters.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The harvesters welcome Lake Eim if it will bedew their fields and meadows;
    it settles into a new bed, receives dikes and young trees, makes fields fertile
    and meadows green, and people dance around it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A footnote gives an origin story in which God commands the beasts to dig a
    deep broad beck and make a hill; the hare measures the land, the fox marks the
    stream's course, and God pours water into it from a golden bowl.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that Greeks and Romans personified rivers as male beings,
    depicts a bearded old man pouring a spring from an urn, and cites the struggle
    of the river Scamander with Hephaestus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that the Indian Ganges is an august deity, smaller streams
    and fountains have nymphs, and Germanic river names being feminine implies female
    watersprites.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Leiptr is singled out as a clear water by which oaths were sworn, and the
    Rhine is described through Eddic language as wise and of divine origin, with treasure
    and gold lying in its bosom.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Goths buried Alaric in a river bed by diverting and then returning the
    river, and the Franks are said to sacrifice to a river when crossing it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A meadow surrounded by sacred river water, and islands washed by the sea,
    are described as especially marked for the residence of gods.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The sea is said to contain Oegir and Ran; the waves are their daughters, nine
    waves are named in the Edda, and another sea god named Geban is mentioned.
  category: relationship
  evidence_refs:
  - ev:7
