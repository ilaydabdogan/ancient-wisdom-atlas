canonical_text:
  quote: ''
  summary: The passage surveys Germanic and neighboring traditions about water-sprites,
    including animal-shaped apparitions, male and female nix-like beings, wet-clothing
    recognition marks, seasonal rites for Russian rusalki, and the association of
    water-sprites with dance, song, music, erotic attraction, and danger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In several cited local traditions, water-related beings appear as a wild bull,
    a great horse on the water, a headless old man, or a horse-shaped water-kelpie.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The male water-sprite is described as usually solitary and may be old, long-bearded,
    many-headed, green-toothed, boy-shaped, or iron-toothed.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The female nixe is described as combing long hair, emerging beautifully from
    waves, sometimes having a fish-like tail, and when on shore appearing like a human
    woman except for wet clothing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A footnote narrative describes a pretty boy by the shore seizing a girl, making
    her scratch his head, binding her with a girdle, falling asleep, and being exposed
    by his fish-like teeth before disappearing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage notes nixes shaped as men above and horses below, and another
    water-sprite named from slit ears.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The nixe is compared in the passage to swan-maidens through betraying bodily
    or clothing signs and through the removal or detention of garments or gloves.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Among the Wends, a water-man appears in a linen smock-frock with a wet shirt
    bottom, and his grain purchases are said to predict dearth or falling prices.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Russian rusalki are described as fair maidens with green or garlanded hair
    who comb themselves by the water, bathe in lakes or rivers, and are especially
    seen during Whitsuntide.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: People are described as honoring rusalki with dance, song, garland-plaiting,
    and throwing garlands into the water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Water-sprites are said to delight in dancing, song, and music; a nixe draws
    listening youths toward herself and into the deep, and lake maidens come to human
    dances and lovers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Swedish stromkarl is associated with an alluring strain said to have eleven
    variations, only ten of which may be danced to.
  category: speech
  evidence_refs:
  - ev:9
