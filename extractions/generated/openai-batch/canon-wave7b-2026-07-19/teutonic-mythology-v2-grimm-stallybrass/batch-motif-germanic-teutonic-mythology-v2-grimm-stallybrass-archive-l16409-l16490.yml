canonical_text:
  quote: ''
  summary: 'The passage compares May and Whitsuntide customs involving disguised or
    greenery-covered figures: a dancing bear figure, an Augsburg reed-wrapped waterbird,
    a Thuringian green man or lettuce-king, a punished Whitsun-sleeper, May-crowns,
    first and last pasture animals, motley boys, decorated poles, and gift-collecting
    processions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hero called Vildifer is described as disguised in a bearskin, led by a musician,
    and made to dance to the harp in a procession.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that the figure should be understood as a dancing bear rather
    than a boar and connects it with the Danish May-feast gadehasse.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Augsburg at Whitsuntide, a lad called the waterbird is wrapped from head
    to foot in reeds and led through town by two others carrying birch-boughs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author says the waterbird's name suggests ducking in a brook or river,
    but leaves its exact seasonal or rain-related function undetermined.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Thuringia on Whit-Tuesday, villagers choose a green man or lettuce-king;
    a young peasant is escorted to the woods, covered in green bushes and boughs,
    set on a horse, and brought home in triumph.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Thuringian custom, the assembled community allows the bailiff three
    guesses to identify the person hidden in the green disguise; failure requires
    payment of beer as ransom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In some places on Whit-Sunday, the last person to drive cattle to pasture
    is wrapped in fir and birch boughs and whipped through the village while people
    cry out 'Whitsun-sleeper.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the Marks, houses are decorated with 'may,' and farm servants, horse-keepers,
    and ox-boys carry May-crowns of flowers and birch twigs to farmers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: On Whitsun morning, cows and horses are driven to fallow pasture; the first
    and last arrivals receive different decorations or names.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: In some Altmark villages, the lad associated with the first horse is named
    thau-schlepper, while the hindmost boy is made a motley boy, clothed in wild flowers,
    and led from farm to farm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some places carry a pole decorated with flowers and ribbons, called the bammel
    or pingst-kddm, and a leaf-and-flower-shrouded boy may accompany it.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: On the Dromling, boys go round with the pingst-kddm and girls with the may-bride
    while collecting gifts.
  category: action
  evidence_refs:
  - ev:8
