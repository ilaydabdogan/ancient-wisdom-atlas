    John's day as well as Easter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Russian government of Archangel, people are said to bathe in the river
    on June 23 and sprinkle kupalnitsa, identified as ranunculus acris.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that there is a widespread belief in the sacredness of
    the Easter bath and St. John's bath.
  category: other
  evidence_refs:
