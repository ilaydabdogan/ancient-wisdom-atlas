  text: When a reigning prince is about to die, a river is supposed to stop in its
    course as if indicating grief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a well runs dry, the head of the family is said to die soon after.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A spring that runs over or dries up and thereby forebodes dearth is called
    a hunger spring or hunger well; the Wossingen hunger well is said to flow abundantly
    before an unfruitful year and to produce small fish then.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Poland and Silesia, girls who have overslept matins on Easter Monday are
    said to be soused with water by lads, flogged with birch twigs, pulled from bed,
    dragged to a river, cistern, or trough filled with water, and ducked.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says the Poles use terms including smic, dyngowac, and dyngus
