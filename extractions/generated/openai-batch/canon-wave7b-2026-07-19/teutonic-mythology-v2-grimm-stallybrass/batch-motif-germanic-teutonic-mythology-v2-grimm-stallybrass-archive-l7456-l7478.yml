  summary: The passage describes lakes, springs, rivers, and wells whose changes in
    level or flow are taken as omens of death, war, dearth, or an unfruitful year.
    A footnote describes seasonal customs involving water at Easter and St. John's
    day, including sousing, ducking, splashing, river-bathing, and sprinkling a plant
    called kupalnitsa.
  language: English
  quote_policy: summarized
