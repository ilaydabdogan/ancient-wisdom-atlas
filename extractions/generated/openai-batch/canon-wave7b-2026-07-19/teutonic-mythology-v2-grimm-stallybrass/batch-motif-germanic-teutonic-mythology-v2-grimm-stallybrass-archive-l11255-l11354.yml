canonical_text:
  quote: ''
  summary: The passage surveys beliefs and literary notices concerning woodpeckers,
    magpies, sparrowhawks, and cuckoos. It describes the woodpecker as a rare beast-fable
    interlocutor, an honored bird among the Votiaks, and a guide to a river by its
    tapping. It describes magpie honor in Poitou connected with warning of wolves,
    sparrowhawks as sacred birds in Old Bohemian songs and revealers of a murder,
    and the cuckoo as a prophetic bird, herald of spring, object of seasonal poetry,
    oracle of remaining lifespan, and a man transformed into a bird as divine punishment
    for theft from the poor.
  language: English
  quote_policy: summarized
