canonical_text:
  quote: ''
  summary: The passage describes dwarfs as generally avoiding humans and being alienated
    by Christian churches, bells, forest clearing, agriculture, and ore-working machinery.
    It then recounts a Hessian Dosenberg tale in which a wichtelmann hires a farmer
    to cart invisible loads across a river, reveals a multitude of little wichtelmen
    who must leave after a thousand years, rewards the farmer with treasure, and vanishes
    with the community. The Dosenberg is also associated with a bare bewitched spot
    and a periodic blue treasure flame. A partial Low Saxon story similarly has small
    beings ask a ship-owning farmer to ferry them over the Aller for payment. A Breton
    legend tells of a man who takes treasure from a dwarf's hole and uses ashes and
    glowing embers to drive away the dwarfs who come to recover it.
  language: English with embedded German and Low Saxon terms
  quote_policy: summarized
