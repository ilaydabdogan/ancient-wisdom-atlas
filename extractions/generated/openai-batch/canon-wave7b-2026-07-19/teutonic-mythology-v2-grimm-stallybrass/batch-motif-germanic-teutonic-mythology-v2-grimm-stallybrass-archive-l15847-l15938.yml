canonical_text:
  quote: ''
  summary: The passage discusses reports that Polish idols were destroyed under King
    Miecislaus and that annual processions carried images of Marzana and Ziewonia
    to water and drowned them. It interprets Marzana/Morana as a death or winter figure
    set against Wiosna/Wesna as spring or summer, links the rite to Midlent or Laetare
    Sunday, and compares Slavic expulsion of Death with German Summerday and contests
    of Summer and Winter. Notes cite other examples of images or puppets thrown into
    rivers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dlugosz and later writers are reported as saying that King Miecislaus ordered
    all idols in the land to be broken up and burnt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In parts of Poland, people annually sang mournful songs and processed with
    images of Marzana and Ziewonia, fixed on poles or drawn on drags, to a marsh or
    river where they drowned them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The drowned images are described as receiving a last homage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage rejects a harvest-goddess explanation for Marzana and prefers
    the description of her as a death-goddess, with an added derivation connected
    to freezing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Marzana/Morana is set in opposition to Wiosna/Wesna, described as a summer
    or spring goddess.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that throwing or dipping the divine image in a stream may
    have belonged to the pagan rite itself rather than only to Christian contempt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The day for carrying Death out is identified as Laetare Sunday or Midlent
    in Poland, Bohemia, Silesia, and Lausitz, with variant dates in some places.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Bohemian and Sorbian names for the day are glossed as Death Sunday.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Rhine and Main region, Laetare is called Summerday.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that for ancient Slavs the March festival marked the beginning
    of the year and of the summer half-year, while for Germans it marked the arrival
    of summer or spring.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage contrasts the Slavic rite, where Smrt or Death is the departing
    driven-out figure, with a German festival centered on a contest between two giants,
    Summer and Winter.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Winter is described as vanquished and parallel to Smrt; Summer is described
    as victorious in the German comparison.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The custom is said to be preserved in a central belt among both Slavs and
    Germans, rather than among all Slavic or German groups.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that May-riding in Scandinavia, England, and some parts
    of northern Germany is the same thing as the Rhenish Summerday in March.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: A note reports that Vladimir, after conversion, ordered the image of Perun
    to be tied to a horse's tail, beaten, and thrown into the Dnieper; a Novgorod
    image of Perun was later thrown into the Volkhov.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: A note reports that Kali was carried about and thrown into the Ganges, and
    that Roman vestals dropped rush puppets from the Pons Sublicius into the Tiber.
  category: action
  evidence_refs:
  - ev:12
