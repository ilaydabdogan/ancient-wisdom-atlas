canonical_text:
  quote: "“they fetch goodwives, midwives, to assist she-dwarfs in labour”"
  summary: 'The passage catalogues occasions when dwarfs or related hidden beings
    seek human aid: midwives for nonhuman childbirth, men of understanding for treasure
    division or dispute settlement, and halls for weddings. It states that such favors
    are rewarded with luck-bringing jewels and that dwarfs know healing virtues in
    plants and stones. A Swedish story and a Finnish belief illustrate hidden-folk
    childbirth aid rewarded with precious metal. A Rudlieb quotation presents a captured
    dwarf defending dwarf truthfulness, health, and longevity against human deceit.'
  language: English, with Swedish and Latin excerpts
  quote_policy: quoted
