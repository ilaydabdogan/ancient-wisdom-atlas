canonical_text:
  quote: ''
  summary: The passage gives a Dorste tale in which dwarfs abduct a girl from the
    woods to become a dwarf’s bride; she escapes by making a straw decoy, covering
    herself with honey and feathers, and being mistaken for a bird. It also includes
    a Swedish hill-being marriage summary in which an archer obtains a girl from a
    hill and receives wedding gifts from her father. The prose then discusses elves
    or dwarfs stealing children from cradles and leaving changelings, with named Germanic
    parallels and a stated motive for the exchange.
  language: English with Low German and Swedish excerpts
