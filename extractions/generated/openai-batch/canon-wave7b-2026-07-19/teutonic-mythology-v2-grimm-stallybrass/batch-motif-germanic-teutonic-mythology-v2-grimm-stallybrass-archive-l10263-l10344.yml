canonical_text:
  quote: ''
  summary: 'The passage surveys traditions of spirit-haunted and sacred trees and
    plants: bleeding or speaking trees, lime-trees associated with dwarfs and enchanted
    sleep, elfin groves, Greek dryads and hamadryads bound to trees, tree spirits
    in Germanic and Slavic tales, a Celtic report of a demon-dedicated pine, and sacred
    plants named for gods or used heraldically. It closes with the Frisian seeblatt
    or water-lily as a venerated emblem and compares it with lotus traditions in Egypt,
    India, Tibet, Nepal, and a Middle Netherlandish poem about Thumbkin floating on
    a leaf.'
  language: English with cited Latin and vernacular terms
