canonical_text:
  quote: ''
  summary: 'The passage surveys sacred water traditions: springs and wells are said
    to be opened or supplied by divine or superior beings and guarded by snakes or
    dragons; German heilawac is water drawn at holy times in silence and credited
    with healing and preservation; Christian explanations connect Christmas or Epiphany
    water with Christ''s baptism and the miracle at Cana, while other German practices
    point to older heathen consecrations of water before sunrise, down-stream, and
    silently.'
