canonical_text:
  quote: ''
  summary: The passage surveys Germanic and Slavic names and glosses for schrat/schratlein-type
    beings. It describes the schrat as a wild, rough, shaggy wood-sprite, the diminutive
    schratlein/schrezlein as a household or hill spirit that may bring prosperity
    if fostered, and related local beings such as the Katzenveit and the Moravian
    seehirt. It also notes comparisons with fauns, satyrs, silvanus, Greek nymphs
    and dryads, and the attribution of matted hair to related sprites.
  language: English
  quote_policy: summarized
