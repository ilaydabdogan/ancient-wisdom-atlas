canonical_text:
  quote: ''
  summary: The passage discusses celestial imagery attached to stars, the sun, and
    the moon. Stars are described as having chairs or seats and possibly tables of
    the sky, while planets are associated with steeds and cars. The sun and moon are
    treated as the two principal stars; the moon is connected with names meaning brilliance
    or whirling wheel, and the sun is described as a wheel, wheel of fire, fair wheel,
    shield, and eye. The passage also compares the sun-as-eye idea across Persian,
    Egyptian, Greek, and Germanic materials and recounts the Eddic account of Oðinn’s
    eye left with Mimir or hidden in Mimir’s fountain.
  language: English
  quote_policy: summarized
