canonical_text:
  quote: ''
  summary: The passage compares Easter fires, Midsummer fires, needfire, and bealtine
    as European fire customs. It describes regional distribution, annual hilltop Easter
    bonfires, processions with rods, carrying fire home, a local squirrel hunt before
    the fire, and Hildesheim practices involving steel-struck Easter fire and burned
    wooden crosses. The author also proposes that northern Easter fires may derive
    from worship of the goddess Ostara/Eostre and later shift to the Christian feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that, besides needfire and bealtine, other fires are found
    almost all over Europe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes northern Easter fires from southern Midsummer fires,
    associating the former with spring and the latter with the longest day.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Easter fires are described as annual evening fires on the first or third day
    of Easter, lit on mountains and hills from straw, turf, and wood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Weser region, especially Schaumburg, a tar-barrel is tied to a straw-wrapped
    fir-tree and set on fire at night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Men, maids, and other participants dance, sing, wave hats, and throw handkerchiefs
    into the Easter fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage describes many bonfires on surrounding mountains, visible over
    many miles and blazing upward.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: In some places participants march up the hill in procession, carry white rods,
    sing Easter hymns, grasp hands, clash rods at the Hallelujah, and carry some fire
    home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Braunrode in the Harz, before the Easter fire is lit, villagers go into
    nearby woods to hunt squirrels with stones and cudgels until the animals are caught
    dead or alive.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author says documentary authority for Easter fires does not extend beyond
    the sixteenth century, but argues that the custom must be older because of its
    contrast with Midsummer fires.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author proposes tracing Easter fires to the worship of the goddess Ostara
    or Eostre and suggests that the fires were shifted to the Christian feast after
    conversion.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The author says popular mountain fires are scarcely derivable from the church
    taper lit on the same day, while also noting church Easter lights called ignis
    paschalis.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Hildesheim country, lamps on Maundy Thursday and Easter day are lit
    at a steel-struck Easter fire; people ignite oaken crosses or crossed sticks there
    and preserve them for a year, while distinguishing this fire from wild fire made
    by rubbing wood.
  category: sequence
  evidence_refs:
  - ev:10
