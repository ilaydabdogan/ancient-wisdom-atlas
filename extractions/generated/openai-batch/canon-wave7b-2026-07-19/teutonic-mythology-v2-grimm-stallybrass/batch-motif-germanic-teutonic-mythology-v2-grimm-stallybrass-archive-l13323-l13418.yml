candidate_motifs:
- id: motif:1
  label: Human figure in the moon carrying a burden
  taxonomy_refs: []
  basis: The passage repeatedly interprets lunar spots as a person carrying thorns,
    wood, or another load, and explicitly says nearly all explanations share the image
    of a human figure carrying something on the shoulder.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage is a comparative scholarly survey, not a single narrative
    episode.
- id: motif:2
  label: Celestial marks explained by theft or crime
  taxonomy_refs: []
  basis: A wood-stealer or fratricide is said to account for the moon's spots, while
    a chaff-stealer accounts for the Milky Way's streaks; a note also reports a stolen
    thornbush and confinement in the moon.
  evidence_refs:
  - ev:5
  - ev:12
  confidence: high
  cautions: The available taxonomy includes 'sacred_theft,' but the passage does not
    state that the theft itself is sacred.
- id: motif:3
  label: Biblical figures projected onto lunar markings
  taxonomy_refs: []
  basis: The passage presents Isaac and Cain as competing biblical identifications
    of the moon's spots.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: These are interpretations of visible lunar markings rather than full mythic
    narratives in the passage.
- id: motif:4
  label: Repentant holy woman as moon with tear-spots
  taxonomy_refs: []
  basis: Berthold's interpretation identifies the moon as Mary Magdalene and its spots
