comparison_claims:
- id: claim:1
  claim: 'The passage itself treats several moon-spot interpretations as variants
    of the same visual pattern: a human figure on the moon carrying a load.'
  claim_level: visual_similarity
  target: Lunar-spot interpretations involving the thorn-bearing man, Isaac, Cain,
    and other burden-bearing figures
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The shared feature is visual and structural; the moral or religious
    meanings differ among variants.
- id: claim:2
  claim: The passage compares moon spots explained by a wood-stealer or fratricide
    with Milky Way streaks explained by a chaff-stealer, indicating a shared function
    of wrongdoing as an explanation for celestial marks.
  claim_level: same_function
  target: Moon-spot and Milky-Way etiologies involving thieves or criminals
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The Milky Way story is only mentioned briefly by cross-reference, not
    narrated in the passage.
- id: claim:3
  claim: The Dutch thornbush man-in-the-moon story is presented as matching the Chaucerian
    form, especially in the stolen thornbush and confinement in the moon.
  claim_level: same_motif
  target: Dutch old story and Chaucer-related man-in-the-moon thornbush tradition
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage's footnote asserts the match but does not quote Chaucer's
    full version here.
- id: claim:4
  claim: The passage cautiously links the Carniolan Kotar story with a Norse lunar
    myth through the recurring role of water in relation to the moon.
  claim_level: same_function
  target: Norse myth involving water and Carniolan Kotar making the moon grow by pouring
    water
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The Norse myth is not summarized, so the comparison is limited to the
    presence of water.
- id: claim:5
  claim: The passage presents Midsummer fires and the Thuleans' post-long-night feast
    as functionally related celebrations of solar turning-points or the return of
    light.
  claim_level: same_function
  target: St. John's or Midsummer fires and Thule solar-return feast
  evidence_refs:
