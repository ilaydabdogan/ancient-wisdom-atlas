canonical_text:
  quote: ''
  summary: 'The passage surveys several explanations of lunar markings: a man in the
    moon with thorns, biblical identifications with Isaac or Cain, a possible forgotten
    medieval legend, and Mary Magdalene''s tears. It then turns to solar observances:
    pre-sunrise magical practices, the rising sun dispelling magic, solstice festivals
    including Midsummer fires, Thuleans climbing mountains after a long winter night
    to see the sun, and Tacitus''s account of sunset radiance and divine forms among
    the Suiones.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A song represents the man in the moon as a cold, lazy, drunken old man carrying
    thorns on a fork; the passage notes that this version says nothing about Sabbath
    desecration.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shakespeare is cited as referring to the man in the moon together with a dog
    and a bush; another Shakespeare passage has Moonshine represented with a bush
    of thorns and a lantern.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gryphius is cited as having a player who acts the moon tie a bush around his
    body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One biblical interpretation identifies the lunar spots with Isaac carrying
    wood for the sacrifice of himself on Mount Moriah.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another biblical interpretation identifies the lunar spots with Cain carrying
    thorns and offering the cheapest product of his field to the Lord.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The passage states that nearly all the listed lunar-spot explanations picture
    a human figure carrying something on the shoulder, such as a hare, pole and bucket,
    axe and thorns, or only thorns.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage compares the moon's spots explained by a wood-stealer or fratricide
    with the Milky Way's streaks explained by a chaff-stealer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Netherlandish poet of the fourteenth century is cited for dark stripes in
    the middle of the moon under unclear names, which Grimm suggests may point to
    a forgotten medieval legend.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Berthold is cited for an interpretation in which the moon is Mary Magdalene
    and the lunar spots are her tears of repentance.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says magical herbs are gathered by moonlight or before sunrise,
    and healing waters are drawn before sunrise.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The mounting sun is said to dispel magic and send spirits back to their subterranean
    abode.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The sun is said to change course twice yearly, and its turning-points were
    celebrated in ancient times; St. John's or Midsummer fires are described as a
    relic of the summer festival.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Procopius is cited for men of Thule who, after thirty-five days of night,
    climb mountain-tops to see the approaching sun and then celebrate their holiest
    feast.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Tacitus is cited for a belief among the Suiones that after sunset the sun's
    radiance pales the stars until morning, accompanied by sound, divine forms, and
    rays from heads.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: A note says that water, absent from the thornbush man-in-the-moon story, is
    essential in a Norse myth and reappears in a Carniolan story where Kotar makes
    the moon grow by pouring water.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: A Dutch note reports an old story in which the man in the moon has a thornbush
    on his back, had stolen it, cannot climb higher to heaven, and is bound or imprisoned
    in the moon.
  category: sequence
  evidence_refs:
  - ev:12
