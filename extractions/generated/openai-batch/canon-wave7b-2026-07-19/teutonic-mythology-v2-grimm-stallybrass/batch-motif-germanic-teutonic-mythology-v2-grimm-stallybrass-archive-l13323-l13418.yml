- id: motif:7
  label: Water poured to make the moon grow
  taxonomy_refs: []
  basis: A Carniolan story says Kotar, the man in the moon, makes the moon grow by
    pouring water; a note also says water is essential in a Norse myth.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The Norse myth is not described in this passage beyond the importance
    of water.
- id: motif:8
  label: Northern sunset radiance accompanied by divine apparitions
  taxonomy_refs: []
  basis: Tacitus is cited for a belief that sunset radiance over the Suiones is accompanied
