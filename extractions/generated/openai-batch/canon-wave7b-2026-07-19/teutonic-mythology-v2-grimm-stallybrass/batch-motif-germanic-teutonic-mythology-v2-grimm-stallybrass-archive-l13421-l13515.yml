- id: obs:1
  text: A story is cited in which the setting sun makes noise in the sea between Spain
    and Africa; the author cautions that similar accounts may have circulated as travellers’
    tales and only possibly belonged among Germans too.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: An Old English dialogue explains the evening redness of the sun by saying
    that the sun looks on hell.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same Old English dialogue explains the morning redness of the sun by saying
    that the sun doubts whether she may complete her commanded course over the world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Jornandes is cited for the statement that Goths under Dicenaeus knew 344 stars,
    apart from planets and zodiacal signs, running from east to west.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: A popular opinion is described in which stars are related to each individual
    as friend or foe, and the constellation shining at birth protects the person through
    life.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says fate can be foretold from dominant constellations and also
