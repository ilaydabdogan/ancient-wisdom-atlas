  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: According to the Edda as summarized here, all stars were sparks of fire from
    Muspellsheim that flew randomly until the gods assigned them seats and orbits.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Shooting stars are described as fiery threads or falling sparks and are explained
    in folk terms as trimmings of the stars’ light, like candle-snuff sparks.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Falling stars are said to be ominous; a viewer should pray, a generous girl
    may receive gold-pieces from them, and a wish made while the star-snuff is falling
    is fulfilled.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: A Lithuanian fate-myth is summarized in which a spinneress spins a newborn’s
    thread on the sky, each thread ends in a star, and at death the thread snaps and
