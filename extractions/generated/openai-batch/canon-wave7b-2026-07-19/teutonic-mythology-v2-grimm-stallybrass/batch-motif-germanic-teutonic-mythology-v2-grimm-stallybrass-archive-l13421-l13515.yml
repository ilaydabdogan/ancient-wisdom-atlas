canonical_text:
  quote: ''
  summary: The passage surveys lore about sunset, the red sun, stars, shooting stars,
    and comets. It reports a noisy sunset story, an Old English explanation of the
    sun’s redness, Gothic star knowledge, beliefs in birth stars and stellar fate,
    customs of prayer to luminaries, the Eddic origin of stars as sparks from Muspellsheim,
    folk explanations and omens of shooting stars, a Lithuanian fate-thread myth tied
    to falling stars, and comet omens of peril or royal death.
  language: English
  quote_policy: summarized
