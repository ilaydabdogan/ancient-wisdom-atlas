  quote: ''
  summary: The passage discusses cock symbolism on holy trees and church towers, then
    surveys ravens and other birds as divine messengers, scouts, prophetic speakers,
    bearers of news, transformed figures, and protected or taboo animals in Germanic
    and comparative legendary material.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The cock is described as an emblem of vigilance and as suited to a high place;
    the author suggests that cocks on church towers may have accommodated an older
    custom of tying cocks to the tops of holy trees.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The eagle is placed at the head of wildfowl and called the messenger of Jove.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In beast-fables, the raven is described as taking on parts associated with
    the wolf and the fox, combining greed and cunning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Huginn and Muninn are identified as two ravens and constant companions of
    Odin; their names are said to express thought and remembrance, and they bring
    him news of events.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Norse king, Dag, is said to have a wise sparrow that gathers news from all
    countries, and Dag avenges the sparrow's death by invasion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ravens are described in cited stories as testifying that Odin accepts an offering,
    attending a traveller all day, and escorting St. Gregory in a group of three.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the myth of king Oswald, a raven with plumage bound with gold is said to
    play an essential part and is not treated as fiendish.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage contrasts the biblical raven sent from Noah's ark with Teutonic
    poetic retellings that make the raven alight on carrion.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: King Arthur is reported as having been converted into a raven, and folk songs
    commonly use birds as messengers who carry information or errands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Birds in legends are said to converse about human destinies, foretell the
    future, reveal a cure for blindness, and discuss the impending ruin of a castle.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A wise bird in the Helgaqviða speaks and prophesies to men, but requires a
    temple and sacrifices before giving further information.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: One German story says men understand bird language after eating a white snake;
    Sigurðr understands it after Fafnir's heart-blood reaches his tongue, after which
    swallows advise him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Killing swallows is said to bring misfortune or four weeks of rain; their
    nests on houses are not to be knocked down, and the passage infers that Slavs
    let swallows build undisturbed on Rugivit's oaken statue.
  category: action
  evidence_refs:
  - ev:8
