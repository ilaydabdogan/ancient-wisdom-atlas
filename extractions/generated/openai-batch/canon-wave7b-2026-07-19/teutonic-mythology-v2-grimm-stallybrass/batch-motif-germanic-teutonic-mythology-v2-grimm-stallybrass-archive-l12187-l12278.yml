canonical_text:
  quote: ''
  summary: 'The passage surveys sacred and folkloric associations of the ladybird/chafer
    and bee: Christian names for the ladybird are interpreted as possibly replacing
    Freyja with Mary; German and English children’s songs address the ladybird amid
    images of fire, home, heaven, and family danger; children use the insect for lifespan
    divination and offer food to a goldbeetle. The bee is described as paradisal,
    pure, wise, and associated with angels, honey, divine drink, newborn feeding,
    poetic inspiration, fortune, queen-governed communities, generation from decaying
    bodies, golden Frankish grave goods, Yggdrasil’s honey-dew, and deaths by drowning
    in mead or honey vessels.'
  language: English, with German, French, Latin, Greek, and Slavic citations
  quote_policy: summarized
