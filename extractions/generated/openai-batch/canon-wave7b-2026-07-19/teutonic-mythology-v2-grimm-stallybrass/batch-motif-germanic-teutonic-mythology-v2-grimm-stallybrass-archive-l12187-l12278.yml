comparison_claims:
- id: claim:1
  claim: 'The German Marienkäfer song and the English ladybird song share a closely
    similar pattern: the insect is told to fly away because its house is on fire and
    family members or children are endangered.'
  claim_level: same_motif
  target: English ladybird children’s song
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage reports similarity of song content but does not establish
    date, route of transmission, or common origin.
- id: claim:2
  claim: The proposed Mary/Freyja substitution in ladybird names is compared by the
    author to similar replacement patterns in names of plants and stars.
  claim_level: same_function
  target: Christian replacement of earlier divine names in natural-object nomenclature
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison rests on the author’s stated analogy and etymological
    interpretation within this passage.
- id: claim:3
  claim: French divine insect names such as 'bête à dieu' and 'vache à dieu' are presented
    as linguistically comparable to Germanic sacred ladybird naming, while Spanish
    and Italian are said to lack similar forms.
  claim_level: linguistic_similarity
  target: French Romance divine names for the insect
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a brief language comparison and does not analyze
    the French forms in detail.
- id: claim:4
  claim: The Servian image of angels descending 'as the bee upon the flower' supports
    a cross-traditional association of bees with purity and heavenly movement.
  claim_level: same_function
  target: Servian lay of the rich Gavan
  evidence_refs:
