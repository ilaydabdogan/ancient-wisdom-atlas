canonical_text:
  quote: ''
  summary: 'The passage surveys German cornfield bugbears and related elvish beings:
    a goblin riding through corn, female corn spirits feared by children, Roggenmohme
    variants with threatening breasts, links to spinning punishments, a reconstruction
    of these beings as benevolent field and spindle guardians, comparisons to Robigo,
    Fro, Siegfried, Holla, Berhta, elves, and the hairy scrat/schretel spirit.'
  language: English
  quote_policy: summarized
