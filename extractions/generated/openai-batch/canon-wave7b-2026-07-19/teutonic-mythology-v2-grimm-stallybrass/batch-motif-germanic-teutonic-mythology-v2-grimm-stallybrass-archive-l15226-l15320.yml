canonical_text:
  quote: ''
  summary: The passage collects medieval German poetic examples in which May or Summer
    is personified as clothing the land with foliage and flowers, while Winter is
    personified as an enemy whose train includes Rime, Snow, and Wind. Winter and
    Rime strip flowers and leaves like plunder, and one poem preserves the name Aucholf
    for a Rime-giant. The passage explicitly compares the conflict of Summer and Winter
    with the opposition of Day and Night. It then describes old seasonal customs for
    welcoming or finding Summer/May/Spring, determined by signs such as flowers and
    birds, including a communal rite around the first violet placed on a pole.
  language: English with quoted Middle High German examples
  quote_policy: summarized
