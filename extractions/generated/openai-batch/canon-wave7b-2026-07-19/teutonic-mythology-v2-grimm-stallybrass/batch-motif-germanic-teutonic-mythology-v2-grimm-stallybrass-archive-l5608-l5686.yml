canonical_text:
  quote: ''
  summary: The passage surveys Germanic and nearby northern traditions in which giants,
    dwarfs, mermen, heroes, tricksters, and wild folk overlap. It describes petrification
    legends, anthropomorphic mountain terminology, stone-linked dwarfs and watersprites,
    hero-giant blending, Finnish and Estonian giant-trickster stories, and Gastein
    wild men who are strong, cave-dwelling, playful, and sometimes friendly household
    benefactors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stone-circles and rocks are described as explained by dances of giants or
    by wedding-folk and dancing guests being turned into stone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mountains are said to receive names from human body parts such as head, brow,
    neck, back, shoulder, knee, and foot.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The giant-legend is said to overlap with legends of dwarfs, schrats, watersprites,
    and the Scandinavian category troll.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mountain dwarfs are described as liable to transformation into stone and as
    having sprung from stone; the merman Rosmer is also described as springing or
    flying into stone.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that the idea of the giant becomes mixed with that of the
    hero, naming Strong Jack, Siegfried, and Wielant in this connection.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Soini or Kullervo is described as nicknamed Kalki, a rogue, and as committing
    destructive acts from infancy and while serving a smith.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Soini fences fields with whole fir-trees and pines wattled with snakes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After a stone is baked in his bread, Soini calls bears and wolves, who attack
    the woman and the flock.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: An Estonian giant's son, Kallewepoeg, furrows grassy lands with a wooden plough,
    after which no blade grows there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage contrasts the trickiness of Finnish giants with the rough but
    honest ways of German and Scandinavian giants.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Wild folk in the woods of the Binorenheim Mark are associated with stone seats
    and handprints on stones.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Gastein wild men are described as very long-lived; one says he saw the forest
    of Sallesen die out and revive nine times and remembers nearby mountains when
    they were much smaller.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The wild men are described as having gigantic strength, including hurling
    a ploughshare across a valley and making a house shake by leaning a staff against
    it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The wild men dwell in an inaccessible cavern; apple trees stand outside, and
    the wild men pelt passers-by with apples in fun.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: The wild men are said to be rather friendly to valley inhabitants and often
    place butter and milk before house-doors.
  category: action
  evidence_refs:
  - ev:9
