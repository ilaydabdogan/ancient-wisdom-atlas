  quote: ''
  summary: 'The passage surveys serpent traditions: a Lombard gold snake idol of uncertain
    divine reference; heroic and learned accounts of small vipers or fire-spitting
    serpents; regional names for winged or crowned snakes; and folk tales of household
    snakes that drink milk with children, wear golden crowns, guard infants, reveal
    treasures, and bring misfortune or loss of prosperity when killed.'
  language: English
  quote_policy: summarized
