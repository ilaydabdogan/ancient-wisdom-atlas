canonical_text:
  quote: ''
  summary: 'Grimm summarizes Germanic creation traditions: a giant body supplies material
    for the world, dwarfs arise in the giant flesh, mankind descends from two seashore
    trees animated by gods, and beings are ordered and contrasted as giants, gods/Aesir,
    men, and dwarfs. He then compares Scandinavian chaos concepts with Wessobrunn
    Prayer and Eddic pre-creation verses, discussing Ginnungagap, Hvergelmir, Muspell,
    Niflheim, and an inverted body-world creation pattern in which the world is used
    to make the first man.'
  language: English
  quote_policy: summarized
