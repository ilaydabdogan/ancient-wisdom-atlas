canonical_text:
  quote: ''
  summary: The passage compares customs for maintaining, extinguishing, rekindling,
    and annually renewing sacred or need-fire in Roman, Greek, Lemnian, Irish, Germanic,
    and Celtic settings. It describes fire made by friction or solar rays, fire carried
    in a sieve, annual extinction and redistribution of fire, a perpetual fire at
    Kildare, wheel and ninefold associations, and protective cattle-driving through
    seasonal flames.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When Vesta's sacred fire was extinguished, the passage says it was to be rekindled
    only by generating a pure new fire, especially by boring a plank of selected sacred-tree
    timber with a pin until sparks appeared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Roman account includes a virgin catching the newly generated fire in a
    bronze sieve and carrying it into the temple.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Plutarch is reported as saying that new fire was obtained by intercepting
    the sun's rays in prepared clay vessels rather than by friction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Greeks worshipped Hestia as the pure hearth-flame
    itself.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: On Lemnos, all fires were extinguished yearly for nine days until a ship brought
    fresh fire from Apollo's sacred hearth at Delos; the fire was then distributed
    for domestic use.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A perpetual fire was maintained in honour of St. Bridget near Kildare, enclosed
    by a wattled fence, approached only by women, and blown with bellows rather than
    the mouth.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage connects the wheel with the sun and fire, and notes nine spokes,
    nine oaken spindles, nine kinds of wood, and nine or eighty-one men in need-fire
    usages.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A yearly assize custom places a cartwheel, previously soaked for six weeks
    and three days, into a fire before judges; the banquet continues until the nave
    is consumed to ashes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some accounts place need-fire at fixed times, especially Midsummer, and describe
    cattle being driven through flames beforehand to guard them against future sickness.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A St. John's Day practice is described in which people warmed themselves by
    a blaze and need-fire sawed out of wood, leapt and ran, and drove cattle through
    it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says Celtic nations kept annual feasts at the beginning of May
    and November, with Mayday called Beltane or related spellings.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: A footnote reports a Finnish myth in which fire created by the gods falls
    on the sea in balls, is swallowed by a salmon, and is later found by people inside
    the caught fish.
  category: sequence
  evidence_refs:
  - ev:10
