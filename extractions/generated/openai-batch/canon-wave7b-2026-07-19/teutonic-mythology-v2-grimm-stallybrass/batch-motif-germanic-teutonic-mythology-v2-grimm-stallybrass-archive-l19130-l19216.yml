canonical_text:
  quote: ''
  summary: The passage collects Germanic and comparative sayings and beliefs in which
    Death is personified as one who is sent for, seizes or fetches the soul, carries
    a staff, has a road for the dead, prepares boots for the journey, appears on horseback,
    and is linked with Hel, a hel-horse, churchyard burial of a horse, plague traditions,
    and spirit-seeing dogs.
  language: English with cited German, French, Danish, Swedish, Bohemian, Old Norse,
    and related forms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A proverb says a slothful servant is a good messenger to send after Death
    because he returns slowly; versions are cited in several languages, and the author
    asks whether this servant may be connected with Ganglati and Ganglot, servants
    of Hel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Death is described as taking the soul and carrying it away, with cited expressions
    saying Death came and took a person.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Death is described as grasping a person; a similar expression is cited for
    Sleep overpowering someone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Death is described with a house, open door, building, walls, and tricks by
    which he entices humans home into his structure.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Death is said probably to carry a staff, wand, or rod like a messenger, and
    to touch with it what has fallen due to him.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Death is assigned a highway, path, or street that is levelled or cleared,
    and the dead are said to travel on it with him.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Death is described as greasing the boots of the person he comes to fetch in
    preparation for a great journey.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Death is described as mounted; he fetches away on horseback and sets the dead
    on his own horse.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A widespread folksong is summarized in which a lover who is dead and buried
    far away comes at midnight and rides off with his bride.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says Hel and her messenger were believed to have a horse, and
    cites a phrase in which a recovered sick person says he gave Death a bushel of
    oats for Death's horse.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The hel-horse is described as three-legged, going around the churchyard, and
    fetching Death; one folktale says a live horse buried in a churchyard becomes
    the walking dead-horse.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A Schleswig plague superstition says Hell rides about on a three-legged horse
    destroying men; barking and howling dogs at night are interpreted as signs that
    Hell is at the dogs.
  category: action
  evidence_refs:
  - ev:11
