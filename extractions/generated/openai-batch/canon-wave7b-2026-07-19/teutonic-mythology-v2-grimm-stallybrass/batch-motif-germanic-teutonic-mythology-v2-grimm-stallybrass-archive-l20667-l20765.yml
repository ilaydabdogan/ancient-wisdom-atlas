    of luck, fate, guardian spirits, land spirits, and personified misfortune. It
    describes hamingja, landvaettir, Dobra Sretia, Laima, Dehkla, fylgja/fetch-like
    doubles, and stories in which ill-luck is embodied, trapped, released, or transferred.
  language: English
