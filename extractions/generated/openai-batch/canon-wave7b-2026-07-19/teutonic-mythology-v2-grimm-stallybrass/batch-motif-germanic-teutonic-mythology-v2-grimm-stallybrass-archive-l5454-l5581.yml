canonical_text:
  quote: ''
  summary: The passage collects legends of giants and giantesses associated with stone
    structures, roads, cliffs, and boundary-crossing. A Courland tale explains old
    wall-stones and a large roadside stone through the strong giant Kinte and his
    white mare. Several St. Olaf traditions tell of a giantess or troll objecting
    that Olaf sails or cuts too near or through her wall; Olaf replies with a command
    that she become stone. The passage then compares these later traditions with an
    Eddic scene in which Brynhildr, traveling the hel-road, passes a giantess's stone-built
    dwelling and is challenged for going through it.
  language: English with quoted Scandinavian verse forms
  quote_policy: summarized
