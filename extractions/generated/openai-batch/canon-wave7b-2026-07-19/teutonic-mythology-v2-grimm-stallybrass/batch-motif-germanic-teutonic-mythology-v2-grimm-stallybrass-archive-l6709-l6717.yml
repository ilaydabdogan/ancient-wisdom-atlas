canonical_text:
  quote: ''
  summary: The passage reports a Muhammadan legend, cited from Wolfgang Menzel, in
    which Eve hides some of her many children from God; God distributes the goods
    and honours of the earth to the children who come to him, while the hidden children
    receive nothing and become ancestors of beggars and fakirs. The author notes lack
    of authority for the legend, compares it with a sixteenth-century German drama,
    doubts a supposed connection with an Old Norse fable, and notes a difference from
    German accounts.
