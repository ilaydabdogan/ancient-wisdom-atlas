canonical_text:
  quote: ''
  summary: 'The passage gathers Germanic and hagiographic examples about the nix and
    other water-sprites: drowned people are said to have been drawn or sucked down;
    a water spirit called Neptune hinders a rescue until an apostle is invoked; Swedish
    and German tales place drowned or well-fallen people under water-beings; charms
    using Mary, steel, or needles ward off the nix; cries and voices from waters portend
    drowning or reveal spirits'' failures; Christian blessings, crosses, relics, and
    missionary presence overcome swamp or water demons.'
  language: English, with quoted Latin, German, and Norwegian passages
  quote_policy: summarized
