canonical_text:
  quote: "“worship the inari (fox) as a tutelar god”"
  summary: The passage reports that, according to Klaproth, Japanese people worship
    Inari, identified as a fox, as a tutelary god. Small household temples are dedicated
    to him, especially among common people. People ask his advice in difficulties
    and leave rice or beans for him at night; if the food is gone by morning, they
    take it as consumed by the fox and as a good omen, while the opposite is unlucky.
    The passage adds that they regard him as a kami, explained as the soul of a good
    deceased man.
