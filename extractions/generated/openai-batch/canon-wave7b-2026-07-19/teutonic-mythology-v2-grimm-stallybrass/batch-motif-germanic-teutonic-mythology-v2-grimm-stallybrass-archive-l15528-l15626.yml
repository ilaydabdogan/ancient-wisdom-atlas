canonical_text:
  quote: ''
  summary: The passage describes German customs called the Expulsion of Death. Songs
    say Death is driven or borne away while Summer and May return. Nürnberg and regional
    practices involve carrying a coffin, puppet, straw or wooden figure, bough, or
    tree representing Death, often to water or another disposal place; variants include
    burning, village processions, protective claims for a house, fear that Death may
    chase the participants, and fertility actions involving cattle. A note compares
    the dunking or ill-treatment of Death’s image with punitive treatment of divine
    or saintly images when expectations are disappointed.
  language: English with German song fragments
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A song states that Death has been driven out and that dear Summer, May, and
    many kinds of flowers are brought again.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The source states that Death has stepped into Winter’s place and offers two
    explanations: winter nature seems dead, or a heathen name for Winter may have
    yielded to the Christian conception of Death.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Nürnberg, country lasses aged seventeen or eighteen parade through the
    town and suburbs in finery, carrying a little open coffin with a shroud and a
    puppet.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Poor children carry an open box containing a green beech bough with an upright
    stalk and an apple fixed on it as a head.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Midlent song says the participants bear Death into the water, carry him
    in and out again, bring him before the goodman’s house, ask for lard, and mention
    Death wearing a coat of mail.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sebastian Frank’s cited account describes four people holding a sheet with
    a straw puppet dressed like a dead man, tossing and catching it while moving through
    the town.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The cited account also says that at Midlent assembled youth carry a straw
    man or imp arrayed as Death into nearby villages, where some receive and feed
    them and others drive them away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that similar customs and songs occurred in Franconia, Thuringia,
    Meissen, Vogtland, Lausitz, and Silesia; some song variants drive Death out and
    say that, if not expelled, he would remain all year.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The usual object is described as a puppet or a figure of straw or wood carried
    about and then thrown into water, thrown into a bog, or burnt.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: When the figure is female it is carried by a boy, and when male it is carried
    by a girl.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: People dispute where the figure should be made and tied together; the house
    from which it is brought out is said to have no deaths that year.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: After throwing Death away, the participants flee in haste lest he rise and
    chase them; if they meet cattle on the way home, they beat the cattle with staves
    in the belief that this will make them fruitful.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: In Silesia, participants often drag around a bare fir-tree with straw chains
    as though it were a prisoner.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: A source note says the dunking does not necessarily annihilate Death, but
    makes him aware of popular dissatisfaction, and it compares this to dunking or
    ill-using deity and saint images.
  category: other
  evidence_refs:
  - ev:7
