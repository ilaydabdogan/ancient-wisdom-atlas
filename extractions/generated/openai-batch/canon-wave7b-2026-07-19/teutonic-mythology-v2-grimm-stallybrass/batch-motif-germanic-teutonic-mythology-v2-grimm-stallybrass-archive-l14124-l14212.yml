canonical_text:
  quote: Both day and night are exalted beings.
  summary: The passage discusses etymologies and poetic personifications of Day, Night,
    Sun, and Moon. It describes Day and Night as holy or exalted beings addressed
    in greetings and petitions; Norse poetic images of Day and Night with cars and
    horses; comparisons with Greek chariot-bearing luminaries and German riddling
    or spell material; and formulaic language for the sun’s rising and setting.
  language: English
  quote_policy: quoted
