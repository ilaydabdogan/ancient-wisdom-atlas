canonical_text:
  quote: ''
  summary: The passage compares European beliefs about children born with a caul or
    natural hood, including special knowledge, second sight, luck, omens from the
    caul’s color, and cauls used as legal charms. It then discusses guardian angels
    or genii as native to each person from birth, distinguishes them from later-attaching
    familiar spirits, and notes good and bad angels as well as valkyries functioning
    as guardian spirits of heroes.
  language: English with cited Latin and Germanic/Slavic terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists several names for the caul or birth covering and says that,
    among Servians, a child born with it is called vidovit, will go to the Vilas,
    and will know more than other men.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Holland, children described as born with the helmet are said to have the
    power of seeing spectres.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A foal’s birth covering is described as being hung on a high tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Midwives and old women are said to foretell good from a reddish infantile
    hood and bad from a blackish one, and such hoods are sold to advocates who think
    they receive help from them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Bohemian account describes membranes in which children are sometimes born;
    if nine, or at least five, are kept with gold and silk thread in a church for
    nine days during canonical hours and then carried to a judge or judgment, the
    bearer obtains his case.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Swedish term hamn is reported to denote a genius that follows each man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that what is essential to a guardian angel is being native
    to a person, distinguishing it from a home-sprite or familiar spirit that attaches
    to an individual but not from birth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Christian authorities are cited for angels appointed to humans, the soul being
    given to a child with an angel, and a personal angel as guardian, teacher, and
    helper.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Notker’s passage describes each person as having his own guardian or genius
    from birth, a faithful guardian-brother who protects soul and senses and reports
    hidden thoughts to God.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says the church doctrine of guardian angels became mixed with
    native superstition about guardian and attendant spirits.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Caesar of Heisterbach is cited as supposing that every person has a good and
    a bad angel seeking to bring weal or woe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Valkyries are described as, to a certain extent, guardian spirits of heroes,
    bound to them for a time; slain heroes’ angels are said to know where their souls
    should go.
  category: relationship
  evidence_refs:
  - ev:7
