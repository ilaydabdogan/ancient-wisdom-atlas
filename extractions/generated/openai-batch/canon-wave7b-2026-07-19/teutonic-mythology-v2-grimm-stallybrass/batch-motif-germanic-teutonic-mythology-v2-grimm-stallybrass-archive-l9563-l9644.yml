canonical_text:
  quote: ''
  summary: 'The passage surveys figures and beliefs associated with wind, weather,
    storm, and hail: Juno, Fro, Oðinn as Viðrir, Slavic Pogodato, Typhon, the Lettish
    Ohhipeernis, Old Norse giants and giantesses, and later human tempestarii. It
    then quotes legal and ecclesiastical material, especially Agobard, on beliefs
    that sorcerers raise storms, cloud-ships come from Magonia to carry away storm-damaged
    crops, accused people fell from such ships, hail can be redirected, and storm-making
    is cursed as the work of a tongue.'
  language: English with Latin and Old Norse citations
