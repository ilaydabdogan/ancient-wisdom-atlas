canonical_text:
  quote: ''
  summary: 'The passage surveys Midsummer or St John''s fire customs: burning herbs
    or plants to remove ill-fortune, water washing away misfortune, elite participation
    in bonfires and dances, a detailed Konz fire-wheel rite involving straw, torches,
    a downhill descent to the Moselle and a vintage omen, a similar Treves wheel custom,
    and medieval French testimony interpreting St John''s fires and wheels through
    Christian and solar symbolism.'
  language: English with cited Latin and German excerpts
