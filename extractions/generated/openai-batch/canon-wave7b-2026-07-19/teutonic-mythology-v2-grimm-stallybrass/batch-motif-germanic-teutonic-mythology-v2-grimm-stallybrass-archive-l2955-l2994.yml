canonical_text:
  quote: ''
  summary: The passage compares Grendel with Loki and Oegir, describes Grendel’s nocturnal
    attack from a marsh and his mother’s water-associated names, and describes their
    water-house as like Oegir’s dwelling. It then discusses a milder belief in the
    nix or water-man as a being who receives, shelters, or keeps the souls of drowned
    persons, with parallels to Ran, Hel, Dame Wachilt, and a story in which a peasant
    releases souls from upside-down pots so they rise through the water.
  language: English
  quote_policy: summarized
