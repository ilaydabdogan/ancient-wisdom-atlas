candidate_motifs:
- id: motif:1
  label: human or race creation from trees
  taxonomy_refs: []
  basis: Askr is linked with a tree-born man, and Hesiod is cited for Zeus forming
    the brazen race out of ash-trees.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage itself notes a possible alternative that the Hesiodic allusion
    may concern ashen shafts rather than literal tree-born humans.
- id: motif:2
  label: post-flood renewal through survivors
  taxonomy_refs:
  - flood_and_renewal
  - survivor_pair
  basis: After the deluge, Deucalion and Pyrrha produce men and women from stones;
    the passage also says the Edda has new creation after the great flood and discusses
    a saved remnant after a destructive flood.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  confidence: high
  cautions: The Eddic and Greek forms differ because the Greek survivors themselves
    perform the creating act.
- id: motif:3
  label: creation from stones
  taxonomy_refs: []
  basis: The Deucalion-Pyrrha account produces men and women from thrown stones, and
    Matthew 3:9 is cited for children raised from stones.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No matching taxonomy family for stone-creation is supplied.
- id: motif:4
  label: dwarfs emerging from a giant body and receiving form
  taxonomy_refs: []
  basis: Dwarfs breed as worms in the proto-giant's flesh and are given understanding
    and human shape, or are created from Brimir's flesh and bones.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage says the Eddic description is ambiguous and applies only to
    black elves.
- id: motif:5
  label: ordered succession of created races
  taxonomy_refs: []
  basis: 'The passage emphasizes sequences: giants, gods, then men and dwarfs in the
    Edda; dwarfs, giants, then men in the Heldenbuch appendix.'
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The order varies between the Eddic and Heldenbuch accounts.
- id: motif:6
  label: paired or opposed creation of different creature types
  taxonomy_refs:
  - duality
  basis: The footnote presents Adam and Eve producing good and bad beasts and compares
    this to Ormuzd and Ahriman in a creating match.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage says the Reinhartssage myth source could not be discovered.
- id: motif:7
  label: functional creation of races for world-order tasks
  taxonomy_refs: []
  basis: The Heldenbuch narrative assigns dwarfs to cultivate waste and mountain regions,
    giants to fight wild beasts, and heroes to aid dwarfs against disloyal giants.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage explicitly says this account gives no manner of creating.
comparison_claims:
- id: claim:1
  claim: The passage presents the Askr myth and Hesiod's ash-tree origin for the brazen
    race as a close parallel in which humans or a race are associated with ash-tree
    origin.
  claim_level: same_motif
  target: Hesiodic ash-tree origin of the brazen race
  evidence_refs:
  - ev:1
  counter_evidence_refs:
  - ev:1
  confidence: medium
  limitations: The passage itself raises the possibility that Hesiod's ash reference
    may point to ashen weapons rather than literal human creation from trees.
- id: claim:2
  claim: The passage compares the Eddic new creation after a great flood with the
    Deucalion-Pyrrha story of human renewal after the deluge.
  claim_level: same_motif
  target: Greek Deucalion and Pyrrha post-deluge stone creation
  evidence_refs:
  - ev:2
  counter_evidence_refs:
  - ev:2
  confidence: high
  limitations: The passage distinguishes the Greek version by saying the rescued people
    are themselves the actors.
- id: claim:3
  claim: The passage claims a surprising harmony between the Eddic sequence of giants,
    gods, and post-deluge men and dwarfs and a medieval theological sequence in which
    angels and devils precede the creation of the human world.
  claim_level: same_function
  target: medieval Christian theological ordering of angels, devils, heaven, earth,
    man, and creatures
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is analogical within the passage and does not demonstrate
    historical contact.
- id: claim:4
  claim: The passage compares Teutonic giants to both rebel angels and flood-destroyed
    sinful humans, especially through the pattern of a surviving figure continuing
    a race after catastrophe.
  claim_level: same_function
  target: rebel angels, sinful flood-destroyed humans, and patriarchal flood survival
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: This is the author's comparative interpretation; the passage does not
    provide an independent narrative demonstrating direct equivalence.
- id: claim:5
  claim: The passage compares the Heldenbuch appendix's three creations of dwarfs,
    giants, and men with the broader Eddic concern for a sequence of created races.
  claim_level: same_function
  target: Heldenbuch appendix fragments of cosmogony
  evidence_refs:
  - ev:4
  - ev:6
  counter_evidence_refs:
  - ev:6
  confidence: medium
  limitations: The order differs from the Eddic order, and the Heldenbuch passage
    gives no details on the manner of creation.
- id: claim:6
  claim: The passage compares a myth of Adam and Eve creating good and bad beasts
    with Parsee legend in which Ormuzd and Ahriman hold a creating match.
  claim_level: same_function
  target: Parsee Ormuzd and Ahriman creating match
  evidence_refs:
  - ev:8
  counter_evidence_refs:
  - ev:8
  confidence: low
  limitations: The passage notes that the source of the Adam-and-Eve beast-creation
    myth could not be discovered.
