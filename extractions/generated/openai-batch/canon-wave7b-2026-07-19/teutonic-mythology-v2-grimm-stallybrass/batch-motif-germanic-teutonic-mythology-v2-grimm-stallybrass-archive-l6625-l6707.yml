canonical_text:
  quote: ''
  summary: The passage surveys comparative traditions about creation from trees, stones,
    giant bodies, and flood survival. It discusses Eddic creation sequences involving
    giants, gods, men, dwarfs, Askr and Embla; compares these with Greek, Jewish,
    medieval Christian, Muhammadan, Heldenbuch, and other cited traditions; and notes
    related paired or opposed acts of creation in a footnote.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage connects the myth of Askr with Hesiod's statement that Zeus formed
    the third, brazen race out of ash-trees.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wood-wives, fays, Greek meliads, and dryads are described as having life bound
    to a particular oak or ash and not wholly detached from their material origin.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Deucalion story, after the deluge Hermes tells Deucalion to throw stones
    behind his back; Deucalion's stones become men and Pyrrha's stones become women.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that in the Edda, after the great flood comes a new creation,
    while in the Deucalion case the rescued people themselves act as creators.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage cites a Jewish saying from Matthew 3:9 that God can raise children
    to Abraham from stones.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The passage gives two Eddic accounts of dwarf origin: dwarfs breed as worms
    in the proto-giant''s flesh and are given understanding and human shape by the
    gods, or they are created from the flesh and bones of the giant Brimir.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dwarf-origin discussion is said to concern black elves only, not light
    elves, whose origin is left unknown.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states an Eddic sequence in which giants come first, gods next,
    and then, after an intervening deluge, men and dwarfs are created.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage reports a medieval theological opinion in which angels and the
    apostasy of devils precede the production of heaven, earth, man, and other creatures;
    a later flood saves a remnant of mankind.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says Teutonic giants resemble both rebel angels and sinful flood-destroyed
    men; it also contrasts deliverance for a patriarch with deliverance for a giant
    who continues his race beside men.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'A Heldenbuch appendix is described as presenting three creations: dwarfs
    first, giants next, and men last, with assigned functions for dwarfs, giants,
    and heroes.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says the Heldenbuch account does not describe the manner of creating
    the races.
  category: other
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage treats Heimdallr's threefold class arrangement as possibly a later
    act in the drama of creation and states that Askr and Embla come into existence
    together.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: A footnote reports a myth in which Adam and Eve create beasts by smiting the
    sea with rods; Adam makes good beasts and Eve bad beasts, and this is compared
    to a Parsee creating match between Ormuzd and Ahriman.
  category: action
  evidence_refs:
  - ev:8
