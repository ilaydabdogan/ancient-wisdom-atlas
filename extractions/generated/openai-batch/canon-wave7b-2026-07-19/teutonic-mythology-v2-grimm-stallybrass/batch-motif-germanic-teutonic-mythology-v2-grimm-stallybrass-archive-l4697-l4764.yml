- id: obs:3
  text: The passage gives examples of roads, enclosures, and named built forms associated
    with giants in Bavaria, Salzburg, and other cited traditions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A passage from Fergut is cited in which a black and fearful rock is connected
    with a giant cutting it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another passage from Fergut describes a brazen statue outside a door porch
    as made by a giant who formerly lived in the land.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
