  quote: ''
  summary: The passage surveys traditions that attribute massive ancient stone walls,
    roads, statues, rock formations, mountains, hills, graves, causeways, and islands
    to giants. It includes Greek, Germanic, Scandinavian, Dutch, Jutland, and Pomeranian
    examples, including stories in which land or stone is carried in an apron or dropped
    from a giant implement, producing named landforms.
  language: English with embedded French, Middle Dutch, Latin, and Germanic terms
