literal_observations:
- id: obs:1
  text: Massive ancient block structures are described as being called Cyclopean walls
    by Hellenes, while modern Greeks are said to regard the Hellenes themselves as
    giants of the old world and credit them with those structures.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ancient military roads made of large stone blocks are said to be laid to the
    account of giants and described with terms meaning giant roads or giant ways.
