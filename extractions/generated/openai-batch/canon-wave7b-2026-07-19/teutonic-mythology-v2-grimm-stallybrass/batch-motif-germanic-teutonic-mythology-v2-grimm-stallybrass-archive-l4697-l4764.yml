  text: A story from the Isle of Hven presents Grimild and Hvenild as two giant sisters
    living in Zealand.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Hven story, Hvenild carries slices of Zealand toward Schonen in her
