canonical_text:
  quote: ''
  summary: In Grimm's discussion of the nix, the passage describes water-spirit tales
    in which blood, milk, or another sign rises from water to show the outcome of
    a vengeful or compulsory act. A Westphalian legend embedded in a footnote tells
    of a sunken monastery, a smith in a lake, a hairy child taken and raised by a
    farmer, and the child's eventual return to the lake after a sword test makes the
    water red as blood.
  language: English, with Swedish and Low German/Westphalian excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that when sea-maidens stay too long at a dance, a captive
    Christian bears a child to the nix, or a water-man's child is slow to obey a call,
    a jet of blood may shoot up from the water's bed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a favourable sign, such as a jet of milk or a plate
    with an apple, was also commonly agreed upon but could be withheld.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:3
  text: The Westphalian legend locates a small lake called the Darmssen near Braumske,
    where a monastery formerly stood and went under because its monks did not live
    according to God's will.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Peasants near the lake heard hammering every night and rowed to the middle
    of the lake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The peasants found a smith sitting up to his waist in the water with a hammer,
    striking an anvil and signaling that they should bring him smithing work.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: People brought iron to the water-smith, and the ploughshares of Epe were said
    to be the best in the country.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Farmer Koatman found a hairy child on the bank; the smith called the child
    his son and told Koatman not to take him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Koatman took the hairy child home and raised him, after which the smith was
    no longer seen or heard.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: When the hairy child was twenty, he said his father had called him and that
    he must leave the farmer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The child asked the farmer to buy him a new sword, pay the price asked, and
    not bargain it down.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The child said that if blood came when he struck the water he must go, but
    if milk came he could stay.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: After the farmer bargained down the price of the first purchases, neither
    blood nor milk came from the water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: With the third sword, bought without bargaining, the water became red as blood;
    the Shaggy one plunged into the Darmssen and was not seen again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The passage says that the same sign of milk or blood coming up occurs in another
    folktale where water-nymphs are made into white-veiled nuns.
  category: sequence
  evidence_refs:
  - ev:6
