canonical_text:
  quote: ''
  summary: The passage describes Germanic home-sprites or goblins associated with
    animal forms, household spaces, dwelling-trees, domestic service, prosperity,
    invisibility, taboos, punishment of curiosity or disorder, and examples involving
    Goldeynar or Vollmar and the wolterkens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some home-sprites are associated with animal forms or animal names, including
    cat-related names and squirrel.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sprites may live in a stable, barn, cellar, or in a tree near the house.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Breaking a bough from such a dwelling-tree offends the goblin, who then departs,
    and the house's luck departs with him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says the goblin cannot abide chopping in the yard or spinning
    on a Thursday evening.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Home-sprites are described as friendly and helpful in household occupations,
    especially in the kitchen and stable.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Goldeynar is said to have lived intimately with Neveling of Hardenberg, played
    the harp, lost money at dice, called Neveling brother-in-law, admonished him,
    and exposed secret sins of clergy.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Goldeynar is described as having lean, cold, soft, frog-like hands; he could
    be felt but not seen, and after three years left without injuring anyone.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: In another account, king Vollmar had a place kept at table and a place in
    the stable for his horse; meats, oats, and hay were consumed, though only a shadow
    of man or horse was visible.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: An inquisitive man sprinkled ashes and peas in an attempt to make Vollmar
    fall and reveal footprints; Vollmar violently killed, cooked, and consumed him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the violent episode, Vollmar was no longer heard, and an inscription
    over his chamber-door predicted future ill-luck and non-reunion of the estates
    until three Hardenbergs of Hardenstein lived at once.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The wolterkens are said to be found in well-stocked houses and to wash in
    the kitchen, tend the fire, clean vessels, scrape horses, feed cattle, draw water,
    and carry it to livestock.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: At night the wolterkens may be heard on ladders or stairs, laughing, pulling
    coverlets from servants, and throwing household goods about.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage summarizes the goblin as an obliging, hardworking sprite whose
    presence brings prosperity, whose departure removes it, and who troubles lazy
    or careless workers.
  category: relationship
  evidence_refs:
  - ev:7
