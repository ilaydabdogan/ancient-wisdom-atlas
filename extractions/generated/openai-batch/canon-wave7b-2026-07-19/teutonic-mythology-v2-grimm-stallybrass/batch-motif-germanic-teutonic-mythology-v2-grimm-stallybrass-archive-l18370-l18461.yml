canonical_text:
  quote: ''
  summary: The passage surveys traditions in which the dead or the soul appear as
    flowers, shrubs, trees, birds, or doves. It includes grave-grown lilies and intertwined
    lovers’ plants, plant transformations in Greek and other folklore, the idea that
    the soul may pass into a flower through blood, and many examples of souls leaving
    the body or appearing after death as birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says white lilies grow from the graves of innocent persons put
    to death; on a maiden’s grave three lilies grow, and only her lover may pluck
    them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says flowering shrubs spring from the mounds of buried lovers
    and their branches intertwine; it also notes Swedish songs in which lilies and
    limes grow from graves.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: In the cited ballad of Fair Margaret and Sweet William, a rose grows from
    her breast and a briar from his; the plants grow to the church-top and tie together
    in a lovers’ knot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the cited Servian folksong, a green fir grows from the youth’s body and
    a red rose from the maiden’s body; the rose twines around the fir.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author describes the grave-grown flower as either a symbol or an after-product
    of the dead person’s character, and also proposes an older idea in which the soul
    passes immediately into a flower.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage connects flowers springing from blood with the idea that the soul
    has its seat in the blood and escapes as blood ebbs away.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Greek fables are summarized as telling of persecuted and slain bodies, especially
    women’s bodies, immediately assuming the form of a flower, bush, or tree, sometimes
    while life and speech continue during the transformation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Daphne and Syrinx are named as figures who change into a laurel and a reed
    while fleeing Apollo or Pan.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The plant called Wege-warte or plantain is said to have once been a woman
    who waited by the wayside for her lover.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says popular imagination pictures the soul as a bird flying out
    of a dying person’s mouth, and notes doves carved on old tombstones.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In one shipwreck example, observers on shore see the souls of the drowned
    rising from the waves toward heaven as white doves; the Eulalia legend is also
    said to have her fly to heaven in the form of a dove.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The killed little brother in the juniper-tree tale flies out of the tree as
    a bird.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says scorched birds in the underworld were souls, and that heathen
    Bohemians thought the soul left dying lips as a bird and hovered among trees until
    burial gave it rest.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Finns and Lithuanians are said to call the Milky Way the path of birds, interpreted
    in the passage as the path of souls.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage says pre-Islamic Arabs believed the blood of a murdered man became
    an accusing bird that flitted around the grave until vengeance was taken.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: Polish folk material is summarized as saying Herburt family members become
    eagles at death, first-born unmarried Pileck daughters become doves, married ones
    become owls, and Madej’s victims’ souls appear as white doves from apples while
    he confesses.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
