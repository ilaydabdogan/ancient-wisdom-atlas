- id: claim:4
  claim: The Arab accusing bird from a murdered man’s blood is comparable within the
    passage to bird-soul imagery, but with the specific function of demanding vengeance.
  claim_level: same_function
  target: Murdered-dead blood or soul appearing as an accusing bird
