comparison_claims:
- id: claim:1
  claim: The passage presents several European ballad and folksong examples as variants
    of a pattern in which plants grow from the bodies or graves of lovers and intertwine.
  claim_level: same_motif
  target: European grave-grown lovers’ plants in Uhland, Swedish songs, Fair Margaret
    and Sweet William, Tristan and Isote, and a Servian folksong
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage is a secondary comparative summary and does not prove direct
    transmission among the listed examples.
- id: claim:2
  claim: The passage compares grave-grown flowers with stories of immediate human-to-plant
    transformation, especially Greek examples such as Daphne and Syrinx.
  claim_level: same_function
  target: Greek and other human-to-plant transformation traditions
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself notes a difference between delayed grave growth
    and immediate transformation without a decaying body.
- id: claim:3
  claim: The passage treats tomb doves, shipwreck dove-souls, Eulalia’s dove-form
    ascent, Bohemian soul-birds, and similar examples as members of a soul-as-bird
    pattern.
  claim_level: same_motif
  target: Soul-as-bird or soul-as-dove traditions across Christian, Romance, Bohemian,
    Finnic, Lithuanian, and related materials
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: 'The examples differ in setting: deathbed, water, heavenward ascent,
