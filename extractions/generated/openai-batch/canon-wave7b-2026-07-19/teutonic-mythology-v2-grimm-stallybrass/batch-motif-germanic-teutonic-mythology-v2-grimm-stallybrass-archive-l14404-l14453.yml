    sun bathing in the sea and returning renewed; Germanic and related expressions
    for the sun going behind woods, hills, or into the earth; and daybreak imagined
    as an animal or bird whose claws pierce clouds or night, with an Anglo-Saxon raven
    announcing dawn.'
