canonical_text:
  quote: ''
  summary: The passage surveys Germanic and other European terms for daybreak, dawn,
    morning, evening, and twilight. It notes expressions in which dawn breaks, laughs,
    or morning sneezes; discusses old words for the first glimmer before dawn and
    for aurora; identifies a personified Tagarod/Tagerod associated with Leucothea
    and with kindled torches; and compares rising-day terminology with sinking-day
    terminology, including Apantrod/Abentrot as an evening-related giant in heroic
    legend.
  language: English
  quote_policy: summarized
