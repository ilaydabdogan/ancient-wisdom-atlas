canonical_text:
  quote: ''
  summary: The passage surveys home-sprite and Christmas-attendant figures who accompany
    gift-givers such as the infant Christ, Berhta, Mary, or saints. These attendants
    threaten or frighten disobedient children, appear under many regional names, become
    mixed with saintly figures in plays, and are compared with Scandinavian yule-buck
    customs and Greek satyric or child-frightening figures. The passage also describes
    genii, elves, dwarfs, water-sprites, home-sprites, goblins, and local spirits
    as divine assistants, shapeshifters, holders of magical tones, recipients of sacrifices,
    and prophetic beings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The infant Christ or dame Berhta is described as the real gift-giver who distributes
    favours, while attendants come with rod and sack.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The attendants threaten disobedient children with thrashing, being thrown
    into water, or having their eyes puffed out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the attendants’ pranks and roughness act as a foil
    to the gracious higher being from whom gifts proceed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The author proposes that in heathen times a divinity announcing a happy season
    may have had a merry elf or dwarf attendant at his side.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Named regional figures include Hullepupel, Hollepeter, Semper or Zember, and
    faithful Eckart, who escorts Holla.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Semper is said to cut open naughty children’s bodies and stuff them with pebbles,
    in a manner compared in the passage with Holla and Berhta.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In Christian-period Christmas plays, Christ may appear with Peter or Niclas,
    and Mary may appear with Gabriel or Joseph; Joseph may be disguised as a peasant
    and act as knecht Ruprecht.
  category: sequence
  evidence_refs:
  - ev:3
