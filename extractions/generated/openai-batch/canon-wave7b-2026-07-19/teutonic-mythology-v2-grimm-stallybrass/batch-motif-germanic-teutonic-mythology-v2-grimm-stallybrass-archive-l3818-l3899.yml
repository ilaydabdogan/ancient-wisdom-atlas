    rackets, and throws nuts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Swedish and Danish yule-lays are described as presenting Christ and certain
    saints at Christmas and replacing Ruprecht with a yule-buck, a manservant disguised
    as a goat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage says that jackpudding, fool, Klobes, Rüpel, the yule-buck, and
