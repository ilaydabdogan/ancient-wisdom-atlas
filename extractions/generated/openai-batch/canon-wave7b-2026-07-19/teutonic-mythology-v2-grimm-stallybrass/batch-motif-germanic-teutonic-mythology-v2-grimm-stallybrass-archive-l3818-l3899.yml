  text: The passage states that Nicolaus can become a ‘man Globes’ or Rupert, and
    that the benevolent bishop figure and the child-scaring ‘man’ can become mixed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Regional Christmas or attendant figures named in the passage include Grampus
