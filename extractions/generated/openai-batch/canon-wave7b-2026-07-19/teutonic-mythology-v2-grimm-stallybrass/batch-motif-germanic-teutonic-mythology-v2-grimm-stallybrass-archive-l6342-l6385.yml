canonical_text:
  quote: ''
  summary: The passage compares several medieval accounts of human creation from eight
    parts or materials. It notes shared and divergent correspondences between body
    parts and natural objects, including earth for flesh, dew for sweat, clouds for
    mind, stone for bone, grass for hair, sun for eyes, sea or water for blood, and
    other variants. It also reports a Frisian account in which God breathes holy breath
    into the mixture and creates Eve from Adam's rib, plus a footnote on a fifth French
    version of Adam's eight-part formation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Godfrey is described as educated at Bamberg and chaplain to German kings;
    the passage says he likely heard in Germany the doctrine of the eight parts and
    presented only a portion compatible with his four-elements system.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that four compositions have no direct connection with one
    another, but that they rest on a common foundation involving eight parts or divisions,
    with differing details and order.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Across the first three accounts, three correspondences recur: lime, loam,
    or earth for flesh; dew for sweat; and clouds for mind.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Middle High German and Frisian texts both give bone from stone, hair or
    locks from grass, eyes from the sun, and blood from the sea or water; the passage
    says these items do not appear in the Anglo-Saxon account.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says the Middle High German poem alone derives veins from herbs,
    while the Anglo-Saxon writer has blood from fire, tears from salt, eye colours
    from flowers, cold breath from wind, and sense from grace.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says the Frisian account alone creates hearts out of wind and
    adds that God blew holy breath into the mixture of eight materials, then created
    Eve from Adam's rib; it also notes that the Middle High German account has a related
    phrase about imparted breath.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A footnote reports a fifth version from a fifteenth-century Paris manuscript
    in which Adam is formed in the Damascene field and made from eight parts, including
    earth-slime, sea, sun, clouds, wind, stones, Holy Spirit, and the clarity of the
    world.
  category: sequence
  evidence_refs:
