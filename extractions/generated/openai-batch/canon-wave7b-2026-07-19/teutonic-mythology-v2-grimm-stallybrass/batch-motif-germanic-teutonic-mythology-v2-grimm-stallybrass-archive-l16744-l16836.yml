canonical_text:
  quote: ''
  summary: The passage surveys Germanic and related terms for world, time, age, light,
    air, earth, and water. It discusses a golden age of the gods, successive ages
    before world destruction, cross-linguistic world terminology, Midgard as a middle
    human habitation made from Ymir's eyebrows, sea-girt or ring-shaped world imagery,
    and the Eddic world-serpent encircling the earth like the ocean. It also compares
    the serpent-ocean image to Alexander's aerial view of the sea as a snake around
    the earth and notes Finnish abundance traditions in Ukko's time.
  language: English
  quote_policy: summarized
