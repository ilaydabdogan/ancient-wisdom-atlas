  summary: 'The passage catalogs Germanic and comparative traditions about giants:
    displayed giant relics, giant feats in heroic poems and folk songs, giantesses
    carrying heroes and horses, possible but scarce evidence for sacrifice or worship
    of giants, and the blending of giant terminology with names of historical peoples.'
  language: English
