canonical_text:
  quote: ''
  summary: The passage surveys customs in which first flowers, insects, and returning
    birds announce spring or summer; children and young people sing, carry animal
    or seasonal emblems, collect gifts, and in some places stage a combat between
    personified Summer and Winter in which Summer wins and Winter is stripped or scattered.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A first summer flower is described as the focus of dancing and singing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first cockchafer is said to have been fetched in with ceremonies, and
    boys are described as hunting and playing with chafers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first swallow and first stork are described as being hailed as messengers
    of spring.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Children or young people in Greek examples carry a swallow or a carved wooden
    swallow while singing and collecting food or gifts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the German and Swedish examples, the appearance of the swallow is linked
    with a coal-digging observance and a thrice-repeated shout of joy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The swallow and stork are described as sacred and inviolable creatures, and
    announcements of the stork or spring herald are linked with rewards or honour
    drinks.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The cuckoo is treated as another announcer of spring or summer, with an Old
    English song addressing it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Songs proclaiming summer by younger people are said to prevail, or to have
    prevailed, in German and Slav countries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Processional customs include carrying a wreath, doll, or animal in a basket
    and demanding gifts from house to house.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Animals named in these processions include a cock, crow, fox, and a stuffed
    wolf in the Polish coleda context.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: In some performances, two persons disguised as Summer and Winter fight until
    Summer wins.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Summer figure is clothed with ivy or singrün, while the Winter figure
    is clothed with straw or moss.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: After Winter is defeated, Winter is thrown down, stripped of wrappings, and
    the wrappings are scattered; a summer wreath or branch is then carried about.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: A note states that summer-children may sell a summer, with the promised result
    that cows give plenty of milk.
  category: relationship
  evidence_refs:
  - ev:8
