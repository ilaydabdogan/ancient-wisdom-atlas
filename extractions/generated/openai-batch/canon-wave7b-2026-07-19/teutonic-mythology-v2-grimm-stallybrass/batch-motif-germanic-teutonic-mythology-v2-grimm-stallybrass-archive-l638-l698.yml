canonical_text:
  quote: "“it was his doom to be measuring the sea until the Judgment-day”"
  summary: The passage describes a Middle Dutch Brandaen episode in which Brandan
    meets a thumb-long man floating on a leaf and endlessly measuring the sea. It
    then summarizes Swiss traditions of cave-dwelling earth-mannikins or dwarfs who
    help humans, heal themselves with herbs, conceal their feet, and withdraw after
    prying people reveal bird-like footprints. A footnote compares the floating leaf
    figure to Indian examples involving Brahma and Vishnu over cosmic waters.
  language: English with quoted Middle/Swiss German dialect material
  quote_policy: quoted
