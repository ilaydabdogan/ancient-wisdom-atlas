canonical_text:
  quote: "“The dead are left alone to commence the long and gloomy journey”"
  summary: 'The passage describes death as return to a divine parental home or to
    Wuotan/Wish, then surveys afterlife journeys: ordinary dead travel the hell-way
    without a conductor and with provisions; water powers such as Ran, water-sprites,
    and Holle retain or receive souls; heroes destined for Valholl are fetched and
    protected by valkyrs sent by Oðinn. The author then compares valkyrs and Oðinn
    with Hermes/Mercury, Charun, and Thanatos while noting functional differences.'
  language: English
  quote_policy: quoted
