canonical_text:
  quote: ''
  summary: 'The passage surveys medieval German personifications of abstractions such
    as Minne, Maze, Ere, Triuwe, Virtue, and Honour, then argues that later allegorical
    prelude scenes can preserve older mythic features: a lost poet or pilgrim in wild
    woods or mountains meets a wailing or ancient female figure near a spring or in
    a remote dwelling, receives information, and may be guided or obstructed by dwarfs,
    giants, or small wights serving wild women.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that personifications of abstract concepts were familiar
    in the 9th-10th centuries and need not have first been invented by Middle High
    German poets.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Minna or Minne is described as capable of meaning caritas, amor, and cupido;
    literary figures address Venus as Minne, and Frau Minne appears bodily and can
    be addressed in dialogue.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Personified Maze or Measure is said to cut out a garment in Tristan, and the
    passage compares Isot's figure to something made by Minne or Venus for herself
    and for Wish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Frau Ere or Lady Honour is described with attributes and places including
    a wish-rod, servants or messengers, a castle or stronghold, and a road.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says that in the 14th-15th centuries these personifications became
    excessive allegories in plots, introductions, and proems.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage describes a recurring scene in which a poet loses his way in a
    wooded wild, comes beside a murmuring spring upon a wailing wife, and receives
    advice and information.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage identifies that wailing wife scene with the apparition of a wish-wife
    or valkyr meeting a hero at a forest fount and making a covenant with him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says dwarfs or giants often intervene as servants of wild women
    and conduct someone to their dwelling by a narrow path.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: One example has a rider come to a field before a green wood, find a beautiful
    tent, and see Triuwe or Loyalty sitting under it, wringing her hands and lamenting
    that her followers have become too few.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Another example places Virtue by a steep cliff in the greenwood and her sister
    Honour on a high rock, accompanied by other personified qualities while mourning
    a count of Holland.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: A May-morning tale has the poet enter the forest, climb steep rocks to a flowery
    vale, and meet a little wight who rebukes him for trampling his lady's roses before
    explaining that Honour lives in an unscalable stronghold with five maidens.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A woman pilgrim lost in wooded mountains comes to a little blue house where
    an ancient blue-clothed dame receives her kindly and calls herself Old Minne,
    saying she still wears the colour of truth but is banished from the world.
  category: sequence
  evidence_refs:
  - ev:11
