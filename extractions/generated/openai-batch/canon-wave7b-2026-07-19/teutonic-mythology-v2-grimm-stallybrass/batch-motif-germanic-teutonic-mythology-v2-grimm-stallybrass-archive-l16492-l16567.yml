literal_observations:
- id: obs:1
  text: In some places a winning horse is fitted with a cleft stick on its head and
    encircled with flowers; the boy riding it receives garlands and a rush cap and
    must not laugh during the procession.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On White Sunday, herdboys carry white sticks to the pasture and use them to
    mark a spot where cattle may not be driven until Whitsuntide.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After marking the pasture, smaller boys name their brides to the bigger boys,
    and the names must remain secret until Whitsunday.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: On Whitmonday, one boy is disguised with petticoats, swathed in may, hung
    with flower-wreaths, crowned with flowers, called the fiistge mai, and led around
    to the houses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Girls go around with a may-bride who is covered with ribbons, has a bridal
    band trailing behind, wears a large nosegay on her head, and sings until she receives
    a gift.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some villages hold Whitmonday horse races for a displayed wreath; the person
    who takes it down both times is crowned and led into the village as May-king.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A reported Netherland custom describes the creation of a Whitsun queen, seated
