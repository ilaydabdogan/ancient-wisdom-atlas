    and other musical instruments.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In Holland at Whitsuntide, poor women carry a flower- and ribbon-decked girl
    named pinxterbloem in a little carriage and beg for money.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The same term pinxterbloem is given as a name for iris pseudacorus, which
    blooms at that season.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the Saturday before Pentecost, boys go out early with shouting and noise
    to wake lazy sleepers and tie a bundle of nettles at their doors.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A footnote says that new lads procure bones to cover the branches of an erected
    fir tree, called the gibbet of bones, whose top is adorned with a horse skull.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The author states that the approach of summer was treated as a holy tide welcomed
