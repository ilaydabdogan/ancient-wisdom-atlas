canonical_text:
  quote: ''
  summary: The passage compares several European changeling-expulsion tests in which
    an unusual domestic act, especially cooking or boiling in eggshells, causes the
    changeling to reveal great age and thereby the exchange. It then describes elves,
    dwarfs, fays, mountain-spirits, and related beings as fond of music and dance,
    leaving fairy rings or tracks, sometimes signaling fertility, luring young men
    toward mountains, and being compared with goddess, fay, and nymph traditions of
    song and dance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage begins with a brief mention of steel and needles in a cradle,
    with comparative superstition references.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Hesse example, a wichtelmann sees water boiled over fire in eggshells
    and says he is as old as the Westerwald but has never seen anything boiled in
    eggshells.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Denmark example, a pig stuffed with skin and hair is set before the
    changeling, who says he has seen the wood in Tiso young three times but never
    anything like it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Irish example, eggshells are boiled before the changeling until he
    says he has been in the world 1500 years and never seen that.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Scotch example, the mother puts twenty-four eggshells on the hearth
    and listens; the changeling says he has lived years before and after coming to
    his nurse, but never saw so many milkpans.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Breton example, the mother cooks for ten servantmen in one eggshell,
    and the changeling says he has seen the egg before the white hen and the acorn
    before the oak in Brezal wood, but never anything like this.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that in all these stories the purpose of the strange proceeding
    is to make the changeling confess his age and consequently the exchange.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says the traditions must have been widely spread in Europe and
    that elves and korred were assumed to have a different life term from humans.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that elves have a strong fondness for music and dancing
    and are seen by night treading a round on moonlit meadows, with tracks perceived
    at dawn in the dew.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage identifies the tracks of elven dancing with Danish, Swedish, and
    English terms including fairy rings and fairy green.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The sight of mountain-spirits dancing on meadows is said to betoken a fruitful
    year for men.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage describes gay seductive music and dances in Laurin's mountain
    and Venus's mountain, a small path trodden by little feet, and songs of elfins
    that lure young men up the mountain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage lists names or descriptions for elf music and dance, including
    elffrus lek, elfvelek, lialfingslag, huldresldt, albleich, and the wihtel's sound.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says a dwarf name is derived from footmarks left on grass by an
    elf roaming hills at night, and that a Breton song has dwarfs dance themselves
    out of breath.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage links elven fondness for melody and dance with higher beings,
    including the ship of Isis, Dame Holda's dwelling, Dame Venus's mountain, Celtic
    fays, and mountain-nymphs in the Hymn to Aphrodite.
  category: relationship
  evidence_refs:
  - ev:9
