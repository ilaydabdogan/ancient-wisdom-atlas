canonical_text:
  quote: ''
  summary: The passage recounts Gallus hearing hostile spirit speech, marking himself
    with the sign of Christ, and commanding the spirits to depart; Columbanus then
    summons the brethren and a phantasmal howling is heard. The author comments on
    Christian preachers confronting pagan daemons with cross, holy spell, and bells,
    notes lake-women and the affinity of mountain and water sprites, and then introduces
    male familiar home-sprites associated with houses, hearths, and many Germanic
    and comparative household-spirit names.
  language: English with Latin excerpts
  quote_policy: summarized
