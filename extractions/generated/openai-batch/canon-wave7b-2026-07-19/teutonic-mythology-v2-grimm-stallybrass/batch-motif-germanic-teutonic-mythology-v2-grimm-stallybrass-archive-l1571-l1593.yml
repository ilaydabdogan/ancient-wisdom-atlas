  quote: ''
  summary: The passage discusses dwarf stories involving honey and blood vessels,
    compares them with vessels kept by the dwarfs Fialar and Galar, recounts a comic
    tale in which a miller is tricked with honey and a supposed changeling, and gives
    a Hessian changeling tale in which a wichtel-wife steals a human infant and returns
    it only after her own child is nursed by the human mother.
  language: English with quoted German/Middle High German fragments
