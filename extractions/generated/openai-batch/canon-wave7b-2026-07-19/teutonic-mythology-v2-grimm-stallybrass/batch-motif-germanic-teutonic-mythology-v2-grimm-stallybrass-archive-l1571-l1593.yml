- id: obs:3
  text: A dwarf-house vessel appears as a tub of honey in one version and as a cask
    of “Mood” in another; the passage compares these with vessels that Fialar and
    Galar keep filled with Kvasi's blood and honey.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A foolish miller asks a girl to teach him the sweetness of love; she makes
    him lick honey all night, he empties a large jar, gets a stomach-ache, and thinks
    he is about to become a parent.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Old women summoned to assist the miller say that the child was a regular changeling
