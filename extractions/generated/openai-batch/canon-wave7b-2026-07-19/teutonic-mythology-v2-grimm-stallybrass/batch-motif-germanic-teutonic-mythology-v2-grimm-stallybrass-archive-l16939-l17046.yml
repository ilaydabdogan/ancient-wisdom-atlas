canonical_text:
  quote: ''
  summary: The passage discusses correspondences between the Eddic world-tree/Yggdrasil
    and medieval Christian interpretations of the Cross as a cosmic tree reaching
    heaven, earth, hell, and the world’s ends. It then compares this vertical tree
    image with a classical description of a tree whose crown reaches the air as deeply
    as its roots descend, and introduces an Oriental allegory from Calila and Dimna
    in which a man hangs in a well amid animals, a dragon, and dripping honey.
  language: English with quoted Middle High German, Old High German, and Latin
  quote_policy: summarized
