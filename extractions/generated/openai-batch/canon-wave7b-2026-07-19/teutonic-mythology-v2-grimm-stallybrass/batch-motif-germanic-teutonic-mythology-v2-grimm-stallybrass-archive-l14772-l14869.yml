canonical_text:
  quote: ''
  summary: Grimm collects Germanic and related poetic expressions for evening and
    nightfall, emphasizing verbs of falling, sinking, flowing, creeping, seizing,
    and carrying off. He then interprets these expressions as personifying Night as
    a hostile power in contrast with kindly Day. The passage describes Day and Night
    as engaged in perennial strife; stars herald Night just as the morning star heralds
    Day; and a Titurel twilight scene shows Night creeping on while Day withdraws
    westward, is devoured by Earth, and rises again from the east.
  language: English with German, Latin, Anglo-Saxon, and Sanskrit citations
  quote_policy: summarized
