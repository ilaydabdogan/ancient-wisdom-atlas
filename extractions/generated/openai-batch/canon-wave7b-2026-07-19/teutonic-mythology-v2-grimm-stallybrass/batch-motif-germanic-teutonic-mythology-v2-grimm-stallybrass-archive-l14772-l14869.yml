    grasps and carries off.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that many of these expressions regard Night as a hostile
    or evil power, contrasted with Day's kindly character and slow ascent above the
    mountains.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Day and Night are in perennial strife, and that Night
