canonical_text:
  quote: ''
  summary: The passage discusses magical cloaks, hats, helms, and caps associated
    with dwarfs, elves, and other superior beings; links concealment and teasing behavior
    to elvish or dwarfish deception; and describes sleep oppression, riding or bridling
    by the nightmare, and the matting or knotting of human hair and horses' manes
    by night-elves, Dame Holle, white women, and the Lithuanian aitwaras.
  language: English with quoted Germanic, Norse, Latin, and Lithuanian terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A red cloak of a dwarf is described as granting invisibility, superior strength,
    and control over the dwarf nation and their hoard.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In some examples the cap or hat alone is meant, including a Norwegian folk-tale
    term rendered as huldehat and a Hildesheim home-sprite named from the felt hat
    he wore.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage groups several old terms for helms or helmets with the idea of
    covering, masking, hiding, or concealment.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other superior beings are said to wear invisible-making garments or headgear,
    including Odin, Mercury, Wish, and Pluto or Orcus.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that dwarfs may have stood in an obscured relation to Odin,
    compared with the relation of hat-wearing pataeci, cabiri, and Dioscuri to Jupiter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage connects the ability of elves and dwarfs to conceal their form,
    along with a teasing character, with deception and disappointment for humans who
    deal with them.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A series of cited examples say that an elf or elves cheat, trick, or deceive.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Older terms for trickery are described as especially diabolic and proceeding
    from evil spirits, and elves receive disparaging epithets also compared with names
    for the devil or a monster.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Morbid oppression in sleep and dreaming is said to be attributed either to
    the devil or Satan, or to the elf, nightmare, or mar, described as shaking, riding,
    or bridling the sleeper.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The night-elf or nightmare is said to roll up the hair of humans or the manes
    and tails of horses in knots, or chew them through.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Named forms for matted or knotted hair include alpzopf, dridenzopf, wichtelzopf,
    mahrenlocke, elfblatte, marelok, elf-locks, and elvish knots.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Dame Holle is described as entangling spinning or hair and as having tangled
    hair herself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: White women are connected with carefully plaited horse hair during midnight
    rounds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Lithuanian aitwaras is said to mat the hair and is glossed as an incubus
    living behind hedges.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Some Lower Saxon names for the wichtelzopf or plica polonica are interpreted
    as meaning a tuft or tail of the goodfellow or home-spirit.
  category: other
  evidence_refs:
  - ev:8
