  summary: The passage surveys names for Orion and related celestial groups. It notes
    untranslated use of Orion, the Roman name Jugula, and many vernacular or glossarial
    names that imagine the constellation through rural tools, workers, animals, staffs,
    spears, hay, scythes, and staves. Grimm repeatedly marks uncertainty about why
    some names arose, especially the Old English/Old Saxon boar-throng and possible
    harvest associations.
