canonical_text:
  quote: ''
  summary: The passage collects Germanic and comparative examples in which wind, dew,
    hail, clouds, mist, snow, avalanches, earth, grass, burial, and bodily return
    to earth are explained through supernatural figures, animals, sacred elements,
    and ritual language.
  language: English with quoted Old Norse, Germanic, Sanskrit, Lettish, Greek, and
    Latin terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Eirikr, son of Ragnar Lodbrok, is said to bear a surname meaning a windy
    hat; whichever way he turned the hat, the desired wind would blow from that direction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A nursery tale is reported in which a man directs the weather by setting his
    hat straight or askew.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author notes an Eddic expression connected with a wind-helmet or wind-hat
    and compares it with an Old High German name.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Twenty-seven valkyries ride through the air; when their horses shake themselves,
    dew falls from the manes into deep valleys and hail falls on lofty trees, signifying
    a fruitful year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Morning dew is said to fall each day from the foaming bit of the steed Hrimfaxi,
    whose name is glossed as dew-mane.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Clouds and mists are described through folk sayings as grannies, an Old one
    putting out fire, a hare boiling, a fox bathing or brewing, and fata morgana shapes
    on the seashore.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Drifting snow or snow-clouds are compared with flying feathers in Scythian
    explanation, German popular belief, and Lettish riddles.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The snow-women Fonn, Drifa, and Mioll are said to touch one side of Holda.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Swiss popular opinion is reported as viewing avalanches as ravening beasts
    that can be checked.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage lists names of an earth goddess and states that ancient ideas
    about Terra, Gaia, Ops, Rhea, Cybele, and Ceres repeat themselves in them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The bare element of earth or mould is said to have been accounted holy; fruits
    and trees rise from it, the dead are laid in it, and decay or fire restores bodies
    to dust and ashes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Expressions for dying include sinking to earth, kissing the earth, and falling
    into the womb of terra mater; the passage also notes formulas in which touching
    earth gives strength.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: A person long absent from home kisses the earth on return; the passage also
    says that earth, like a pure stream, will not endure a malefactor, and that secrets
    were entrusted to earth, fire, and oven.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Earth covered with grass, the greensward, is said to have sacred power, with
    Sanskrit durva and Germanic turf terms given as comparanda.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: A note describes ancient tombs in which bodies crouch with head, arms, and
    legs pressed together; this is reported as probably meant to place the dead in
    a womb-like posture and to imply new birth and resurrection from mother earth.
  category: setting
  evidence_refs:
  - ev:9
