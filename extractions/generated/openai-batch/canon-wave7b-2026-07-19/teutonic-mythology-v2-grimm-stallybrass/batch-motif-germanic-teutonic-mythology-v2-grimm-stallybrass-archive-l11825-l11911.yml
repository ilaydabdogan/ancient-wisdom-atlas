  quote: ''
  summary: 'The passage surveys Germanic and comparative traditions concerning snakes:
    household snakes fed with milk, a grateful snake leaving a crown, adder crowns
    conferring invisibility and wealth, house snakes linked to death and home-spirits,
    Baltic and other serpent veneration with milk offerings, serpents as charms on
    weapons and helmets, and literary dragons or wyrms in Beowulf, Krimhild, Siegfried,
    and Fafnir traditions.'
