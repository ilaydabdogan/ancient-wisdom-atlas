canonical_text:
  quote: ''
  summary: The passage surveys water-beings including a fish-tailed singing amargygr,
    water-wives needing human midwives, a sea-maiden roaming fields at midnight, and
    the stromkarl/neck/fossegrim as a musical water-spirit. It describes offerings
    of lambs or goats to obtain musical instruction, the dangerous perfection of fiddle-playing
    through the fossegrim's guidance, and a Christianized story in which the neck
    weeps over his exclusion from salvation until children tell him that redemption
    may also be possible for him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The amargygr is described as a beautiful woman from the girdle upward and
    fish-like from the girdle downward, using sweet song to lull men to sleep.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Water-wives in labour are said to send for human assistance; a reported midwife
    is taken to a childbed in a hole in the water of the Mulda, where the water does
    not harm her and the hole appears like a fair chamber.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A maiden from the lake is said to roam through the fields at midnight.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The stromkarl is described as melodious and as lingering by mills and waterfalls;
    the Norwegian name fossegrim is connected with waterfalls.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Music attributed to the stromkarl can make household objects, old people,
    disabled people, and infants begin to dance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: People are said to have offered a black lamb to this daemonic being and to
    have received musical instruction in return.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The fossegrim entices people by music on calm dark evenings and teaches the
    fiddle or another stringed instrument to one who offers a little white he-goat
    on a Thursday evening, with head turned away, by throwing it into a northward-falling
    waterfall.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the offered animal is lean, the pupil only learns to tune the fiddle; if
    it is fat, the fossegrim guides the player's right hand until blood comes from
    the fingertips, after which the pupil can play so that trees dance and falling
    torrents stand still.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Christianity is said to forbid such offerings and to classify old water-sprites
    as diabolic, while common people retain awe toward them and believe they may someday
    share in salvation.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the story of two boys by the riverside, the neck plays a harp; when told
    he will never be saved, he weeps, throws away the harp, and sinks to the bottom.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The boys' priestly father tells them they sinned against the neck and should
    comfort him by saying he may be saved; after hearing that the Redeemer lives for
    him too, the neck joyfully resumes playing the harp.
  category: sequence
  evidence_refs:
  - ev:9
