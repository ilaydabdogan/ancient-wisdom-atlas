  quote: ''
  summary: The passage describes comparative relationships among giants, elves, dwarfs,
    and humans. Giants are characterized by bodily size, strength, material power,
    and relative stupidity; elves and dwarfs by smaller size, subtler sense, and livelier
    intellect; humans by a mediating balance between these extremes. It also states
    an order of creation—giants first, elvish nature next, humans last—and notes alliances
    between giants or dwarfs and humans, including ties with human heroes and proximity
    to schrats and woodsprites.
