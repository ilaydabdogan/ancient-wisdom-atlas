canonical_text:
  quote: ''
  summary: 'The passage describes several seasonal folk customs: an Altmark Whitsuntide
    plant-and-straw human-shaped figure placed on a cow and driven through the village;
    Swiss, Bavarian, and Styrian plays or combats in which Summer defeats or expels
    Winter; a regional discussion of the custom''s distribution and relation to Slav
    neighboring customs; and a Bohemian children''s procession in which a straw figure
    representing Death is burned while new Summer is welcomed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Altmark/Wendish villages near Salzwedel, at Whitsuntide servants and
    maids make a large human-shaped figure from fir branches, straw, and hay.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Altmark image is garlanded with field-flowers, fastened upright on a brindled
    cow, and given an alder-wood pipe in its mouth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The cow carrying the image is conducted into the village; houses are barred
    and people drive the cow from their yards until the figure falls off or breaks
    apart.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Swiss play described as Swabian in origin, Summer is acted by a man
    in a bare shirt with a ribbon-and-fruit-decorated tree and a split cudgel, while
    Winter is warmly clad and has a similar cudgel.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In that play, Summer and Winter strike each other, boast, disparage one another,
    and Winter eventually falls back and admits defeat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bavarian and Styrian variants also oppose Winter and Summer; Winter may wear
    fur or winter clothes and use snowballs, while Summer bears a green bough or green
    hats, forks, and scythes, and the action ends with Winter expelled or Summer praised.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The source frames the custom as an old festival announcing Summer by the defeat
    of Winter and surveys its regional distribution.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The source notes that the custom is especially frequent in Middle Germany
    and near Slav countries, but cautions that this does not prove Slav origin or
    importation beyond the Rhine.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Bohemia, children carry a straw man representing Death to the end of the
    village, burn him, and sing of bringing Death from the village and new Summer
    into it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A footnote says that in seventeenth-century Leipzig a straw puppet was carried
    about and immersed after the festival had become discredited.
  category: action
  evidence_refs:
  - ev:7
