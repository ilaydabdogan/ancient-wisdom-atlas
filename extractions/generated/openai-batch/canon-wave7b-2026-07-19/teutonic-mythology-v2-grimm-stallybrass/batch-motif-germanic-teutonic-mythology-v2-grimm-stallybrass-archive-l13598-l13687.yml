canonical_text:
  quote: ''
  summary: The passage surveys European and nearby names and stories for Charles's
    Wain/Great Bear, Lesser Wain, a small thill-star identified with a waggoner, and
    Orion's belt. It records waggon, bear, bugle, milkmaid, distaff, and mower names;
    a legend in which a waggoner chooses eternal driving in the sky after helping
    the Saviour; and comparative notes on Hungarian Gontzol, Greek Erichthonius, and
    Finnish personified divine celestial bodies.
  language: English
  quote_policy: summarized
