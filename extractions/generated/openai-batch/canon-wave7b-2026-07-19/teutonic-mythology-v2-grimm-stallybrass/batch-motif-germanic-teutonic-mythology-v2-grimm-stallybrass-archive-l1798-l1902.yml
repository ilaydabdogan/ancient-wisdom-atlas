canonical_text:
  quote: ''
  summary: The passage surveys forms and meanings of pilwiz, bilwit, belwit, and related
    words. It identifies belwit as a kindly home-spirit or penates, discusses Old
    English bilwit as an adjective of mildness or justice, and then describes bilwiz
    as a good genius of elvish nature. The being is said to haunt mountains, have
    a dreaded shot like an elf, tangle hair like an alp, inhabit a pilbis-tree that
    could receive offerings, and in later popular belief become a terrifying spectre
    or witch associated with hair-tangling and crop damage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists variant forms such as pilwiz, pilbiz, bilwiz, bilwitz, bilbis,
    pelewijsen, hihlweisen, belewitte, and belwit, and says the word was no longer
    understood in the 13th-14th century and was later distorted.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fifteenth-century confession book is reported to use pelewijsen as synonymous
    with witches, and later authorities gloss related forms as lamia or report beings
    associated with nocturnal visions and revealed secrets.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Belwit is identified as penates, a kindly disposed home-sprite, and a good
    household being.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Old English bilwit or bilewit is discussed as an adjective glossed as mansuetus
    or simplex and interpreted as possibly meaning aequus or justus; the passage notes
    that God is called bilewit in cited texts.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the proposed etymology is tenable, bilwiz is described as a good genius
    of elvish nature that haunts mountains, has a dreaded shot like the elf, and tangles
    or mats hair like the alp.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A cited passage describes sacrificing a child or garment to a pilbis-tree,
    explained as a tree supposed to be inhabited by the pilwiz, like trees containing
    wood-sprites and elves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'Later popular belief is said to retain the hateful side of this being: a
    tormenting and terrifying spectre that tangles hair and beard and cuts up corn,
    often appearing in female form as a sorceress or witch.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Martin von Amberg is reported to interpret pilbis as devil, and Kilian glosses
    belewitte as lamia or strix; the tradition is said to linger chiefly in Eastern
    Germany.
  category: attribute
  evidence_refs:
  - ev:8
