canonical_text:
  quote: ''
  summary: The passage surveys sacred animals in Germanic and Norse mythological material.
    It proposes several causes for animal cultus, including animal connection with
    gods, metamorphosis of higher beings into animals, and penal degradation or transmigration
    of humans into beasts. It then focuses on horses, listing divine and heroic named
    horses, runic markings on animals, legendary horses, and saga accounts of Freyfaxi
    as a horse devoted to Freyr.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that sacred animals may be connected with particular gods,
    may derive from metamorphosis of a higher being into animal shape, or may relate
    to penal degradation and transmigration of humans into beasts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boar is said to belong to Fro, while the wolf and raven are said to belong
    to Wuotan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A bear, bull, cow, or snake is listed as an animal that may in some instances
    presuppose an incarnation.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Myths of the cuckoo, woodpecker, nightingale, and similar birds are said to
    furnish tales entering largely into hero-worship.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The horse is named foremost among animals and described as noble, wise, trustworthy,
    and able to hold friendly talk with the hero, sympathize in grief, and rejoice
    in victory.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some heroes are named after the horse, horses have proper names, and Norse
    mythology assigns a separate horse with miraculous powers to nearly every god.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Odin's steed is named Sleipnir and is described as an octopod.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Horse names formed with 'faxi' include Skinfaxi, Gullfaxi, Hrimfaxi, and Freyfaxi;
    Gullfaxi belonged to the giant Hrungnir, Skinfaxi to Day, and Hrimfaxi to Night.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Arvakr and Alsvinnr are described as horses of the sun-chariot, with runes
    on Arvakr's ear and Alsvinnr's hoof; runes are also said to appear on Sleipnir's
    teeth, the bear's paw, and the wolf's claws.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Svaðilfari is described as the horse that helped the giant in building.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bajart is described as intelligent and said to be still alive in Ardennes
    forest, where he may be heard neighing every year on Midsummer day.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The track of Schimming's shoe is said to stand printed on rock.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the Vatnsdælasaga example, Freyfaxi was owned by Brandr, who is said to
    have worshipped it and was therefore called Faxabrandr.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the Hrafnkell example, Hrafnkell owned a pale-coloured horse called Freyfaxi,
    gave half of it to Freyr, loved it greatly, and vowed to kill any man who rode
    it without his permission.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Olafs Tryggvasonar saga example reports that the Trøndir had returned
    to the worship of Freyr, whose statue still stood among them, and that they refused
    to break the image.
  category: action
  evidence_refs:
  - ev:8
