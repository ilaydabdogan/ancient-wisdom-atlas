candidate_motifs:
- id: motif:1
  label: Animals attached to particular gods
  taxonomy_refs: []
  basis: 'The passage explicitly gives animal-god attachments: boar with Fro, wolf
    and raven with Wuotan, and later a horse devoted to Freyr.'
  evidence_refs:
  - ev:1
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage gives examples and a general explanation of cultus, not a
    single narrative episode.
- id: motif:2
  label: Higher being transformed into animal form
  taxonomy_refs:
  - shapeshifter
  basis: The passage states that sacred animal status may rest on metamorphosis of
    a higher being into an animal shape, with bear, bull, cow, or snake mentioned
    as possible instances.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage says the mythology may no longer preserve a full account of
    the incarnation.
- id: motif:3
  label: Penal degradation or transmigration into beast
  taxonomy_refs: []
  basis: The passage describes a lowering from god into animal and then a related
    penal degradation of man into beast, identified with the old doctrine of transmigration.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: No specific mythic narrative of an individual punished by transformation
    is supplied in this passage.
- id: motif:4
  label: Wise and miraculous named horse
  taxonomy_refs:
  - wisdom
  basis: The horse is described as wise and as a companion of heroes; Norse mythology
    assigns named horses with miraculous powers to gods, including Sleipnir and other
    named steeds.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The taxonomy reference captures the wisdom aspect, while the full passage
    pattern also includes divine ownership, naming, and miraculous traits.
- id: motif:5
  label: Consecrated horse dedicated to a deity with riding taboo
  taxonomy_refs:
  - sacred_exchange
  basis: Freyfaxi is worshipped by Brandr; Hrafnkell gives half of Freyfaxi to Freyr
