canonical_text:
  quote: ''
  summary: The passage reports that dwarfs are long-lived because of honesty, simple
    food, and knowledge of nature that lets them avoid harmful human food. It then
    recounts a hunting story in which Biorn captures a sleeping mountain-smith, refuses
    his offers of smith-work in exchange for release, receives a curse on his descendants,
    imprisons him, and loses him when he disappears on the third day. A second hunting
    story tells how Swen shoots a ring-bearing buck claimed by voices from a hill,
    is threatened by trolls, hides under roots, vows offerings to churches if God
    saves him, returns safely, and dedicates the buck's ring, horns, and hide to churches.
  language: English
  quote_policy: summarized
