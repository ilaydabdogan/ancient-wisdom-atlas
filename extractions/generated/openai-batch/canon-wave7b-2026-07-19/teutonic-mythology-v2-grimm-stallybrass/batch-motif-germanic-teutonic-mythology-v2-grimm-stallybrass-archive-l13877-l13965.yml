canonical_text:
  quote: ''
  summary: 'The passage discusses how constellations are imagined either from star
    outlines or as complete figures in individual stars or clusters, including Orion,
    the Pleiades, the Wain, and divine placement of men among stars. It then surveys
    mythic notions attached to the rainbow: the Eddic heavenly bridge Bif-rost, guarded
    by Heimdallr and destined to break at the end of the world; the Christian/Old
    Testament rainbow as covenant sign after the Deluge; folk beliefs about treasure
    and coins at the rainbow; Roman statements that the rainbow drinks water; and
    taboos or proverbs about the rainbow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage gives verbal meanings for star names: ndsh or ash as bier or
    barrow, kimeh or kima as a thick cluster of stars comparable to a sieve, and Isil
    as a foolish, ungodly, lawless giant identified with Orion.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Constellations are divided into two origins: multi-star outlines forming
    objects or beings, and single stars or clusters treated as whole figures without
    detailed shape.'
  category: other
  evidence_refs:
  - ev:2
  - ev:3
