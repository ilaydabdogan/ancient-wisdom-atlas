canonical_text:
  quote: ''
  summary: The passage reports a tradition that, on Eetberg between Brunstein and
    WibbreclitshaiTsen, where Boniface was said to have overthrown the heathen idol
    Eeto, local people held an Easter fire after sunset on Easter day. The fire was
    said to have been called bocks-thorn by men of old. The author notes uncertainty
    about why the fire bore the name of a shrub, tragacanth, and asks whether bocks-thorn
    was thrown into Easter flames as herbs were into Midsummer fire. A further note
    reports that some said the Easter candle was lit by burning-glasses or crystals.
  language: English
  quote_policy: summarized
