canonical_text:
  quote: ''
  summary: 'The passage surveys medieval and early modern names and representations
    of Death: Dance of Death/Macabre skeletons, the later German name Friend Hein
    or Hain, Death as a wood-mower or woodcutter who fells all trees, and Death as
    Strechefuss or Strechehein, the leg-stretcher of the dying.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A skeleton in Dance of Death compositions is described as aping the garb and
    gestures of the living and appearing incongruous with warm life around it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that processions and plays exhibiting such spectacles occurred
    in France during the 15th century and perhaps earlier, and connects them with
    the names chorea Machabaeorum and la danse Macabre.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Friend Hein or Hain is presented as another name of Death, later than Blicker,
    and the author says he cannot trace it back to the middle of the previous century.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author lists possible explanations for Friend Hein involving a homesprite
    name, elvish beings bordering on departed spirits, a winding-sheet term, giant
    terminology, and doubtful grove-god stories.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kaisersberg calls Death holz-meier, interpreted as wood-mower or woodcutter.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Kaisersberg's explanation, the woodcutter is common to all trees, overlooks
    no tree, and hews them all down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that Death is regarded as a forester or ranger with a right
    to fell any forest-tree, and adds that in some places the gravedigger is called
    holzmeier.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Death is called pale Strechefuss or Strechehein, explained as leg-stretcher,
    because he stretches out or loosens the limbs of the dying.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Other names or images associated with Death in the passage include Bleckezahn,
    referring to bared teeth, and Dürrhein or Klapperbein as names for a skeleton.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A footnote reports competing explanations for the term Macabre, including
    derivation from St. Macarius and three skeletons, possible relation to Maccabean
    martyrs, and possible derivation from Arabic cemetery terms.
  category: other
  evidence_refs:
  - ev:6
