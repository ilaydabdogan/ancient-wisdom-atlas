  quote: ''
  summary: The passage surveys customs and traditions concerning holy, healing, restorative,
    divinatory, and ritually honored spring water. It mentions Easter, May-day, St.
    John’s/Midsummer visits to springs; offerings, sacrifices, silence, and possible
    libations at wells; named Germanic and neighboring springs; water that repairs
    swords or bodies; the medieval fountain of youth; and a charm involving water
    and an adder bite.
  language: English with quoted medieval and Germanic terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On Easter Monday, youths and maidens go to the Hollow Rock in the mountains,
    draw cool spring water in jugs to carry home, and throw flowers into the spring
    as an offering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author identifies the Easter Monday practice as water-worship and says
    that a similar practice appears to have existed among Celts.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The rock-spring Karnant is said to make a broken sword whole again if water
    is taken from the source under the rock before daylight.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young girls in the Pyrenees country tell their fortunes in spring water on
    May-day morning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the relevant property is the ordinary efficacy of
    water as refreshing, strengthening, and re-animating, rather than only the medicinal
