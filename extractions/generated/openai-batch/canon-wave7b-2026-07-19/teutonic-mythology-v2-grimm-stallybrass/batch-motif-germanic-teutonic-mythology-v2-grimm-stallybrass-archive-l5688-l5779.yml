  quote: ''
  summary: The passage compares Germanic giant traditions with elves, dwarfs, devils,
    ogres, Cyclopes, Tartar and Indian man-eating giants, and literary giants. It
    discusses giants as woodland claimants, enemies of bells, northern dwellers, stone-hurlers,
    non-cannibal native figures, size-changing beings, and coercive literary ravagers.
  language: English
