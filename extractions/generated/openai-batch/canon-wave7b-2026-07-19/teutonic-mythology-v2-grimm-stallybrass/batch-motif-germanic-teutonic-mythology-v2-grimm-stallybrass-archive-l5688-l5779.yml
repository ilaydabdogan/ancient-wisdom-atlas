literal_observations:
- id: obs:1
  text: Elves are said to be driven away by agriculture and forest clearing, and giants
    are said to regard the woods as their own property.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A great stout trold appears when a peasant's son begins cutting a bushy pinetree
    and threatens to kill him if he cuts in the trold's wood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Giants are said to hate the ringing of bells and to sling rocks at belfries;
    Gargantua is said to carry bells away from churches.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that giant and devil are convertible terms in many tales
    and compares shared features such as many-headedness and traces left on hard stone.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The abode of giants, like that of heathens and devils in general, is said
    to be supposed in the north; examples include Freyr looking north toward Jotunheim
    and a giant in the stolen-hammer song dwelling in Nordenfjeld.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man-eating huorco or ogre is described as running into gianthood, and
    the Odyssey's stone-hurling Cyclopes are said to hanker after human flesh.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Tartar giant Depeghoz is described as draining nurses as an infant, receiving
    a daily supply of two men and five hundred sheep when grown, having his eye burned
    out by Bissat with a red-hot knife, feeling goats as they pass out, and resisting
    an arrow aimed at his breast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Lapland giant Stalo is described as one-eyed, wearing an iron garment,
    and being feared as a man-eater.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hidimbas the rakshasa is described as a misshapen, red-bearded man-eater who
    smells human flesh from afar and orders his sister Hidimba to fetch it; Hidimba
    pities and befriends the slumbering hero.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says Germanic giant-stories and the Norse iotunn do not depict
    giants as cannibals; their violence is said to consist mainly in hurling stones,
    moving mountains, and building colossal structures.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Saxo's giantess Harthgrepa is said to have the power to make herself small
    or large at pleasure.
  category: attribute
  evidence_refs:
  - ev:7
