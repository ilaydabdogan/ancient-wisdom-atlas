canonical_text:
  quote: ''
  summary: The passage describes several regional accounts of need-fire or wildfire
    rites. In these accounts, domestic fires are extinguished, new fire is produced
    by friction using wheels, stakes, ropes, or cross-bars, and livestock are driven
    through flame or embers as a precaution or remedy against cattle plague, murrain,
    or swine disease. The passage also records details such as preserving a quenched
    brand, searching for any remaining household fire if the new fire fails, ash-blackening
    by youths, use of chaste boys in one district, and a related Appenzell children's
    friction-fire game.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the fire rite, householders take a brand, quench it in a wash or swill
    tub, and place it for a time in the cattle crib.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stakes and roller used to obtain the fire may be carried away as fuel
    or kept safe after cattle have been chased three times through the flame.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A 1605 Marburg record orders fire to be produced by working a new cartwheel
    with an unused axle; the fire is kindled between gates and oxen are driven through
    it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Marburg account, each citizen extinguishes his own fire before the
    new fire is kindled and later fetches fire again from the new source.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In parts of the Mark, when swine are diseased, dry stakes are set in the ground
    before sunrise in solemn silence, hempen ropes are pulled around them until fire
    appears, and sick animals are driven through the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Lower Saxon account, the wildfire is made as a precaution against cattle
    plague; pigs, cows, and geese are driven through it in that order.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before the Lower Saxon ceremony, farmers and the parish assemble and every
    inhabitant is told to extinguish all household fire so that no spark remains in
    the village.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Lower Saxon participants walk to a hollow way, with women carrying linen
    and men carrying wood and tow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Lower Saxon apparatus uses two oaken stakes, holes stuffed with linen,
    a cross-bar, and a rope pulled by men until friction sets the linen on fire.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sparks from the friction fire are caught on tow or oakum, whirled until they
    blaze, and then passed to straw and brushwood.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the brushwood has burned down, herds are driven through the glowing
    embers one after another.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the cattle pass through, young people throw themselves on ashes and
    coals, blacken one another, and return behind the cattle as conquerors without
    washing for a long time.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: If the linen does not catch fire after long rubbing, the participants conclude
    that fire remains somewhere in the village and search houses to extinguish it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage states that the wildfire must be produced by friction and cannot
    be struck from flint and steel.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: In the Halberstadt country, the ropes of the wooden roller are pulled by two
    chaste boys.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: In Appenzell, country children play a game of rubbing a rope against a stick
    until it catches fire, called 'de tilfel hale' in the passage.
  category: action
  evidence_refs:
  - ev:8
