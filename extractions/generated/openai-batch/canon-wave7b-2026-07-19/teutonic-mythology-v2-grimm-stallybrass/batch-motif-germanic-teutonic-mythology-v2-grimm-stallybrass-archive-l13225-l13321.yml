canonical_text:
  quote: ''
  summary: 'The passage surveys interpretations of lunar spots as human figures: Scandinavian
    Bil and Hiuki or two people carrying a bucket on a pole; a Christianized man in
    the moon punished for Sabbath wood-stealing; and related German, Dutch, and English
    variants involving stolen or Sunday-labor objects visible in the moon.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes lunar spots from lunar phases and treats the spots
    as the visible basis for human figures in the moon.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: One lunar image is described as two children, or two persons in Swedish folk
    belief, carrying a pail or large bucket on a pole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bil is described as probably a girl and Hiuki as a boy; Bil is also connected
    by the passage with an asynja named alongside Sol.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Christian adaptation says the man in the moon was a wood-stealer who violated
    the holy Sabbath during church time and was transported to the moon as punishment.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In that adaptation, the man is said to be visible with an axe on his back
    and a bundle of brushwood or thornbush in his hand.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that the water-pole of the older story was transformed
    into the axe shaft and the carried pail into the thornbush, while the idea of
    theft was retained and Sunday observance emphasized.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage identifies Numbers 15:32-36 as a basis for the Sabbath stick-gathering
    element, while noting that the biblical account does not mention the moon or lunar
    spots.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Westphalian note says a man who dressed the church with thorns on Sunday
    was put into the moon with the bundle.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: An Appenzell variant says a poor man gathered wood on Sunday, was given a
    choice between burning in the sun and freezing in the moon, chose the moon, and
    is seen there with a bush on his back.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Other variants describe a broom-maker binding twigs, a woman spinning, a man
    spreading manure, or someone stealing cabbage-stumps; their corresponding objects
    are said to form the lunar spots.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Dutch and English examples include a man with stolen vegetables or a churl
    bearing a bush of thorns on his back in the moon.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
