canonical_text:
  quote: ''
  summary: 'The passage surveys rain-making and water-veneration customs: water from
    the fountain of Barenton is poured or touched to obtain rain; a Spanish image
    of the Virgin in mourning is carried for rain; Bavarian and Austrian Whitsun figures
    are covered in greenery and thrown into water; water goddesses and spirits are
    associated with wells, springs, rivers, and seas; protective gestures and offerings
    are made at waters believed to house spirits or daemons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Celtic tradition, huntsmen go to the fountain of Barenton during drought,
    scoop water in their horns, spill it on stones, and rain-clouds are said to rise
    immediately.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A later Barenton custom includes clergy, chanting, bells, banners, a parish
    procession to the spring, and the head of the commune dipping his foot crosswise
    in the fountain; rain is expected before the procession returns home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the mayor’s wetted foot or a small poured quantity
    of water stands in place of a child or larger water-pouring action, and that a
    small offering is expected to bring a larger rainfall.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Spain, during prolonged hot weather, an image of the Virgin dressed in
    mourning is solemnly escorted through villages to obtain rain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Bavaria, the last man to drive out on Whitmonday is taken to a wood, tied
    with leaves, twigs, or rushes, paraded through the village, and tumbled from his
    horse into a pond or brook as the “waterbird.”
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In Austria, village lads elect a Whitsun king, dress him in green boughs,
    blacken his face, and pitch him into a brook.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists Nerthus, Holda, swan-maidens, merminnes, water-holdes, spring-holdes,
    watermuhmes, nixies, Oegir, and Ran as beings connected with waters or the sea.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says particular rivers, brooks, pools, and springs can be consecrated
    to water beings and assigned as their abode.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Swedish vulgar opinion advises spitting three times when crossing water in
    the dark as a safeguard against evil influences.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At Mykono, before drawing water from a well, Greeks are said to salute three
    times in honor of Teloni, a fountain-sprite.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says that a thief throwing a little of stolen property into water
    is sacrificing to the water-sprite.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: A whirlpool near Vierzon is described as consecrated to daemons; anyone entering
    it is said to be caught by demonic ropes and killed.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: Gregory of Tours is cited for a lake on Mt. Helanus where a crowd of rustics
    came at a fixed time as if offering libations to the lake.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: A note reports children throwing pins into the Barenton fountain while asking
    it to laugh, with the fountain’s fay supposed to be made friendly by the gift.
  category: action
  evidence_refs:
  - ev:12
