- id: claim:2
  claim: The passage presents the Bavarian waterbird and Austrian Whitsun king duckings
    as probably preserving the same underlying rain-calling purpose, even though the
    explicit invocation of rain has disappeared.
  claim_level: same_function
  target: Whitsun ducking customs as rain-making survivals
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs:
  - ev:5
  confidence: medium
  limitations: The author notes that the current customs appear as Whitsun drollery
    at the expense of the laziest man; the rain-making function is inferred, not directly
    enacted in the described cases.
- id: claim:3
  claim: The passage compares the Spanish rain procession with the Liege procession
    and with a procession described by Petronius, while distinguishing it by the absence
    of symbolic libation.
  claim_level: same_function
  target: Liege procession and Petronius procession for rain
