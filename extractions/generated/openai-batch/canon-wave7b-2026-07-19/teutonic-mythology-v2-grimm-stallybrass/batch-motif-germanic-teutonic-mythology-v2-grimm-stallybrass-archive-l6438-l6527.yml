canonical_text:
  quote: ''
  summary: The passage discusses creation motifs in which the world is explained from
    the body of a giant or divine being, and an inverted pattern in which the human
    body is formed from natural substances. It cites a Middle High German Genesis
    paraphrase in which God forms man from lime, clay, earth, and slime and breathes
    spirit into him, then compares Norse/Teutonic body-world creation with Greek,
    Indian, Cochin-Chinese, Japanese, Ceylonese, Kalmuk, and folk-poetic examples.
  language: English, with quoted Middle High German excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Legends are described as explaining lakes and marshes by the gushing blood
    of a giant and oddly shaped rocks by a giant's ribs and marrow-bones.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts world-from-body explanations with an inverse explanation
    in which sun, mountain, tree, earth, stones, and grass are used to account for
    human body parts.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: In the Middle High German Genesis paraphrase, God uses glutinous lime, clay,
    hard lime, crumbly earth, and slime in forming the human figure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the figure is formed, God blows spirit into it; the veins fill with
    blood, earth becomes flesh, and hard lime becomes bone.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The comparative examples describe the world or parts of the cosmos as made
    from the body parts of Brahma, Zeus, the giant Banio, and a mountain-giantess.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Indian doctrine is described as inverting the macrocosm by making the sun
    enter the eye, plants enter the hair, stones enter the bones, and water enter
    the blood of created man.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Folk-poetic notes describe artificial persons or kin made from clay, gold,
    sweet substances, jewels, silk, boxwood, pearls, or stone, sometimes with animation
    or speech requested.
  category: action
  evidence_refs:
  - ev:7
