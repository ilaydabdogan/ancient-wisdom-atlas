canonical_text:
  quote: ''
  summary: The passage describes elves and dwarfs by size, beauty, hue, clothing,
    bodily deformity, and comparative names. It distinguishes light elves as beautiful
    and radiant from black elves and dwarfs as dark or misshapen, gives examples of
    very small stature measured by child-size, span, thumb, or ant-size, cites a cave
    scene involving a dwarf's wife, and notes cross-linguistic and comparative parallels
    for thumbling or dwarf figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says later accounts of dwarf creation seem to refer to the earthly
    form of black elves, not light elves.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Human bodily size is described as intermediate between giant and elf: the
    elf falls below human size as the giant rises above it.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: All elves are described as small or tiny; light elves are described as well-formed,
    symmetrical, radiant, beautiful, and wearing shining garments, while black elves
    are described as ugly and misshapen.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage cites expressions and examples that associate elvish appearance
    with exceptional female loveliness or fairness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Rudlieb example, a caught dwarf calls his wife out of a cave, and she
    appears small, very beautiful, and adorned with gold and clothing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The dwarf is described as having a repulsive hue, ill-shaped body, humped
    back, coarse clothing, and in some examples black or grey complexion.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that when elves and dwarfs were mixed together, the graceful
    figure of elves was sometimes transferred to dwarfs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage gives dwarf or dwarf-like heights ranging from a four-year-old
    child to spans, thumb length, and an ant-sized Danish trold.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage connects fairy-tale thumbling figures and several names for dwarfs
    with small body-part measures such as finger, fist, and span.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Sanskrit Balakhilyas are described as beings of thumb magnitude, sixty
    thousand of whom sprang from Brahma's hair.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage notes stories in which dwarfs' feet are deformed like the feet
    of geese or ducks, and it briefly compares this with Queen Berhta.
  category: attribute
  evidence_refs:
  - ev:7
