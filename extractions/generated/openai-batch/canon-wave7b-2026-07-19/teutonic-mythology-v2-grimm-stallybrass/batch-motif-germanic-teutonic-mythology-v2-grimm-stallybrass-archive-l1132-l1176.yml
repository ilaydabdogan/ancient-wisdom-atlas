canonical_text:
  quote: ''
  summary: The passage discusses hostile relations between elves and humans, beliefs
    about elf-shot and sickness caused by elves, inferred links between elves and
    thunderbolts, and a dwarf ferry story in which a farmer ferries little men, receives
    payment, and sees a hidden multitude by means of a dwarf's hat.
  language: English; includes a Low German excerpt with English substance supplied
    in the passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage states that a mixture of dependence on humans and mental superiority
    in elves leads to hostile relations: humans disregard elves, and elves do mischief
    and tease humans.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports an old belief that dangerous arrows were shot down from
    the air by elves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author identifies the aerial arrow belief with light elves, says it is
    not mentioned in dwarf stories, and cites an Old English formula pairing terms
    rendered as esagescot and ylfagescot.
  category: other
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The passage associates elf weapons with god-like weapons, notes that a divine
    thunderbolt is called an albgeschoss, and describes Scottish elf-arrow, elf-flint,
    or elf-bolt as a hard pointed wedge believed to be discharged by spirits.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The passage says turf cut out by lightning is supposed to be thrown up by
    spirits and that the author had inferred a lost connection between elves and the
    Thundergod; a possible forging of bolts by elves is presented conditionally.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The passage states that elves' touch or breath may bring sickness or death
    to humans and beasts, that their stroke can leave a person lost or incapable,
    and that cattle may be lamed or bewitched by them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the inserted ferry story, Hovermann, a large farmer at Offensen with a
    ship on the East Aller, is asked by two little men to ferry them and does so twice
    to an open space called Allero.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the ferry story, a dwarf asks whether the farmer wants a lump sum or payment
    per head; the farmer chooses the lump sum, and the dwarf says he would have done
    better asking per head.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the ferry story, the dwarf puts his own hat on the farmer's head, after
    which the farmer sees Allero swarming with little men who had been ferried across.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The story reports that the Hovermanns became rich, later died out, and that
    the event belonged to the old time when dwarfs were still in the world.
  category: sequence
  evidence_refs:
  - ev:10
