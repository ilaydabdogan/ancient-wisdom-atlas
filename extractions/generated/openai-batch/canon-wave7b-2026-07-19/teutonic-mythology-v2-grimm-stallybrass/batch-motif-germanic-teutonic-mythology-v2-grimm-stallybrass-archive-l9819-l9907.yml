canonical_text:
  quote: ''
  summary: 'The passage surveys ritual and legal uses of earth, turf, sod, clods,
    water, and mountains across several traditions: earth invoked in oaths, earth
    or turf used in legal ceremonies, turf described as Erda''s necklace, earth and
    water presented as submission, clods used for renunciation and land-possession
    symbolism, turf used in an Anglo-Saxon spell, and holy mountains associated with
    deities or worship.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Servian protest formula invokes earth as a helper, and a Gaelic proverb
    is presented as implying the prompt assistance of earth as well as of a priest.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A law is described in which earth or dust is taken from the four corners of
    a field and thrown by hand over the nearest kinsman as a solemn legal ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old Norse legal terminology calls the turf connected with an oath iarðar men,
    interpreted in the passage as Erda's necklace and as the greensward imagined as
    a goddess's jewelry.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that Hungarian and Slavic oath-taking could involve the swearer
    placing earth or turf on the head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Presenting earth and water is described as a token of submission, and Persian
    heralds are said to have demanded those two elements from lands to be invaded.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Landsknechts are said to have thrown a clod of earth before battle as a sign
    of renouncing life; a footnote adds that earth was thrown over a nun's arm to
    mark renunciation of earthly possessions.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Greek practice is described as using grasped sod to signify possession of
    land; in the Argo episode, Triton gives Euphamos a clod of earth, which Euphamos's
    men later drop into the sea.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: An Anglo-Saxon spell cuts four pieces of turf and adds oil, honey, yeast,
    milk from cattle, tree matter, herbs, and a spoken charm.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage mentions mixing seedcorn with earth from three kinds of fields,
    dropping three clods on a lowered coffin, and cutting out footprint-bearing sod
    for magic.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Holy mountains and hills are described as honored for the deity enthroned
    on them, with Wodan's and Thunar's hills named as examples.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A Slavic example is cited in which a high mountain associated with Nemtsi
    or Nimptch was formerly venerated by local inhabitants.
  category: setting
  evidence_refs:
  - ev:9
