canonical_text:
  quote: All through, the notion is that money, married bliss and house stores will
    thrive and grow with the growing light.
  summary: The passage surveys Germanic and comparative folk beliefs about lunar phases.
    New moon or waxing light is described as auspicious for assemblies, battle timing,
    marriage, house-building, moving, money, bodily growth, cattle weaning, and gathering
    herbs and dew. Full moon or waning light is associated with acts of severance,
    drying, felling, dissolution, and diminution, including cutting timber, mowing
    grass, stuffing beds, opening trenches, and opening veins. The passage also notes
    comparative examples from Scottish, Lithuanian, Estonian, Greek, Indian, and Demerara
    materials.
  language: English
  quote_policy: quoted
