  summary: The passage surveys Germanic and neighboring terms for giants, giantesses,
    and trolls; notes a medieval Biblical explanation tracing giants to Cain or mixed
    lineages; cites Beowulf’s derivation of Grendel’s descent from Cain; and records
    a late medieval report of heathenish worship of a being called the good Lubbe
    with animal-bone offerings on a hill and an associated idol image.
