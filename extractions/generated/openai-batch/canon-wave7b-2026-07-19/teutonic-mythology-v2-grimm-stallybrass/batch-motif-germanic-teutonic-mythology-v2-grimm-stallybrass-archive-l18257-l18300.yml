canonical_text:
  quote: ''
  summary: The passage contrasts older and newer distributions of the dead among Valholl,
    Folkvangr, Gefjon, Gimill, and Hel; discusses whether Surtr should be understood
    as a fire-world giant or as a hypothesized exalted light-god; treats Surtr's invasion
    with liberated Loki as hostile; and compares an unuttered divine figure or name
    with the unknown god, Odin's whispered word to Baldr's corpse, and an Etruscan
    nymph speaking the highest god's name into a bull's ear.
  language: English
  quote_policy: summarized
