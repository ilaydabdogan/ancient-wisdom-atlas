canonical_text:
  quote: "“to be accomplished builders is a main characteristic of giants”"
  summary: The passage contrasts giants with smithing dwarfs, presents giants and
    trolls as builders of colossal structures, recounts the Eddic giant-builder bargain
    with the gods, and compares it with German and Scandinavian tales in which a devil
    or troll builds under a wager or deadline and is defeated by trickery, cockcrow,
    or discovery of a secret name.
  language: English, with Old Norse and Scandinavian terms and names
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: German legend is said not to describe giants primarily as smiths; forging
    arms is reserved for dwarfs, with noted exceptions involving Asprian and Vade.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Old Norse smiðr can mean an artificer or builder,
    and that giants are characterized as accomplished builders of colossal old structures.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Common folk are said to see giant handmarks on nine giant-pillars near Miltenberg,
    connected with an intended bridge over the Main.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Eddic example, an iotunn offers to build the Aesir a strong castle
    in exchange for Freyja together with the sun and moon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The gods accept the offer only if the builder works without human aid, completes
    the work in one winter, and forfeits his claims if anything remains unfinished
    on the first day of summer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The builder nearly completes the work with help from the horse Svaðilfari,
    but Loki hinders him and Thor kills him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that the Eddic myth lives on in altered forms and that
    a German fairy tale puts the devil in the giant’s place.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the German tale, the devil is to build a house for a peasant and receive
    the peasant’s soul if the work is finished before the cock crows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When only one roof tile remains, the peasant imitates a cock; nearby cocks
    then crow, and the devil loses the wager.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Norrland saga, King Olaf wants to build an unparalleled church but
    fears the cost to his kingdom.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A strange man identified as a giant or troll offers to complete the church
    alone within a set time, demanding the sun and moon or St. Olaf himself as wages.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Olaf sets demanding conditions for the church, including great size, space
    for seven priests to preach at once, and flint pillars and ornaments; the building
    is nearly finished except for the roof and spire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Olaf hears a child and giant-woman inside a mountain; the giant-woman names
    the builder as Wind-and-Weather and refers to his expected return with the sun
    and moon or Olaf himself.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that discovering and naming an evil spirit brings its power
    to nothing.
  category: other
  evidence_refs:
  - ev:8
- id: obs:15
  text: Olaf calls out the builder’s name and says the spire is askew; the giant falls
    from the church roof and bursts into flintstones.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: Variant accounts name the builder Blaster, Slatt, Shalle, or Finn; Shalle
    is connected with the church at Nidaros, and Finn with the church at Lund and
    transformation into stone by St. Lawrence.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
