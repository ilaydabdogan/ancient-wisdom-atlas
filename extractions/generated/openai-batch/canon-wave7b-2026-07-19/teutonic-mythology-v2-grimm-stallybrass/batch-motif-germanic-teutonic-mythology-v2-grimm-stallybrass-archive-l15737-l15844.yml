canonical_text:
  quote: "“we have driven out Death, we bring back Summer.”"
  summary: The passage surveys Slavic and Sorbian customs in which named figures such
    as Marena, Mamurienda, or Muriena, or an idol or puppet of straw, hemp, and rags
    identified as Death, are carried out of a settlement, drowned, torn up, or thrown
    over a boundary. Songs accompanying the actions speak of removing Death and bringing
    Summer or May. Some variants add omens, stone-throwing, green twigs, decorated
    trees, torches, or processions to a height called the Todtenstein.
  language: English with embedded Slavic and German phrases
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Several songs describe carrying or removing Marena, Mamurienda, or Muriena
    and bringing new Summer or new May.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Bielsk in Podlachia, on Dead Sunday, people carry an idol of plaited hemp
    or straw through the town and drown it in a marsh or pond outside the town.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bielsk procession includes a mournful song in which Death is described
    as blowing through the wattle and seeking the whirlpool.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the Bielsk drowning, participants run home; the passage states that
    anyone who falls down will die within the year.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Upper Lausitz, Sorbs make a figure of straw and rags; the woman who had
    the last corpse supplies the shirt, and the latest bride supplies the veil and
    rags.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Upper Lausitz scarecrow is fixed on a long pole and carried away by the
    biggest and strongest young woman while others sing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Participants throw sticks and stones at the figure; the passage states that
    whoever hits Death will not die that year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The figure is either drowned in water or carried to the boundary of the next
    village and thrown over it; the neighbouring youth may throw it back, leading
    to quarrels and blows.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In some Lausitz places only women perform the Driving-out of Death; they wear
    black veils, make a straw puppet in a white shirt, give it a broom and a scythe,
    carry it to the next town’s border, and tear it up while boys pursue them with
    stones.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After tearing up the puppet in one variant, participants cut down a handsome
    tree, hang the puppet’s shirt on it, and carry it home with songs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author states that this tree is a symbol of Summer replacing Death and
    adds that decorated trees are also carried through the village by boys collecting
    gifts after Death has been driven out.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: In some places the straw man is made to peep into people’s windows; this is
    treated as an omen that Death will take someone from that house unless a money
    ransom is paid in time.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: At Königshain near Görlitz, the whole village goes with straw torches to the
    Todtenstein, lights the torches on the height, and returns singing that they have
    driven out Death and bring back Summer.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: A note reports that Esthonians on New Year’s Day make a straw idol in human
    shape named metzika, associated with protecting cattle and the frontier, and set
    it on the nearest tree.
  category: other
  evidence_refs:
  - ev:11
- id: obs:15
  text: The author concludes that the banished idol does not everywhere represent
    Winter or abstract Death; in some cases it is described as a heathen divinity
    giving way to Christianity.
  category: other
  evidence_refs:
  - ev:12
