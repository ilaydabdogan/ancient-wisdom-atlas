canonical_text:
  quote: ''
  summary: The passage discusses the identification of svartalfar with dwarfs, describes
    dwarfs as smith-like beings associated with caves and mountains, contrasts dwarf
    forging with elfin weaving, and reports reverence and offerings to elves, including
    a Kormakssaga account of a bull sacrifice and feast for elves. It also notes later
    Christian reinterpretations, comparative parallels, plant names associated with
    elves and dwarfs, and a tradition about the rapid maturation and aged appearance
    of dwarfs and the Elf-king.
  language: English
