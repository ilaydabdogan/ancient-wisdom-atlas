canonical_text:
  quote: ''
  summary: 'The passage collects customs and legends concerning sacred waters: ducking
    a lazy grass-cutter; spirits and well-nymphs; offerings and animal sacrifice to
    a lake followed by a storm; a Catalonian lake with demons where thrown objects
    raise storms and watersprites abduct a girl; lakes resisting attempts to sound
    their depths; Estonian gifts to wells; the holy Wohhanda stream, its sacred grove,
    annual cleaning, storm taboo, and a conflict over a mill built on the brook.'
  language: English with Latin quotations
