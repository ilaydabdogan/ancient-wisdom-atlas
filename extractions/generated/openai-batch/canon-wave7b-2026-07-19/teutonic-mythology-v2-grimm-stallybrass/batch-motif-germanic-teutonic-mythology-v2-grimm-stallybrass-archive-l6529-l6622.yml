canonical_text:
  quote: ''
  summary: The passage surveys comparative creation traditions. It describes a Chaldean
    cosmogony in which Belus divides darkness and heaven from earth, then his blood
    enters the ground and produces rational man. It summarizes Hesiod's account of
    Pandora made from earth and water and given speech. It compares Eddic accounts
    of Ymir's body-part offspring with Indian accounts of Brahma producing human classes
    from body parts, then adds Caribbean, Greek, and Heimdall parallels for miraculous
    births from body parts or multiple mothers. It then turns to the Eddic first human
    pair, Askr and Embla, discussing tree, wood, ash, and plant associations, comparing
    them with the Persian Meshia and Meshiane. Finally it connects Germanic founder
    legends with origins from trees, rocks, fountains, forests, and Greek expressions
    about descent from oak or rock.
  language: English with Greek and Latin terms
  quote_policy: summarized
