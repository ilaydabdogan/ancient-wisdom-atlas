- id: obs:4
  text: The passage says the Indian Manus describe Brahma producing four families
    of men from his mouth, arm, thigh, and foot, corresponding to priest, warrior,
    trader-husbandman, and servant-artisan groups.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says a Caribbean myth has Luguo, the sky, descend to earth, and
