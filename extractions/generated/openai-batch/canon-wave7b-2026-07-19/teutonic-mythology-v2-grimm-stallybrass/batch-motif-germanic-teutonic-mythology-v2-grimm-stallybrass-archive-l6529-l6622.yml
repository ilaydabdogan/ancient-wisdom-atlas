  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage lists Athena coming from Zeus's head, Dionysus from Zeus's thigh,
    and the fable of Heimdall's nine mothers as related examples of miraculous birth
    traditions.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage distinguishes earlier creations of gods and giants from the Eddic
    creation of the first human pair, and says simple material is quickened by God.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage identifies Askr with the ash-tree and states that the Edda calls
    the first pair Askr and Embla.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says the Persian figures Meshia and Meshiane are man and woman
    who grew out of plants.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says legend makes the first king of the Saxons, Aschanes or Askanius,
    grow out of the Harz rocks by a fountain-head in the forest.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage says primitive legends made first men or founders of Teutonic
