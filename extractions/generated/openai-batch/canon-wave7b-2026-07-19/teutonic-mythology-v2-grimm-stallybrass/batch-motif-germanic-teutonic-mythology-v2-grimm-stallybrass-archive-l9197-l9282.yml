canonical_text:
  quote: ''
  summary: The passage discusses a kneeling fire-health rite with cake and drink cast
    into flame; etymological and folkloric links between the oven and fire; oven prayer
    and confession in German tales; bonfires and illuminations used for joy, royal
    entry, and church processions; and air/wind/weather as living elements associated
    with spirits, Wuotan, Vishnu, and elemental giants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A described fire rite has participants bend the knee, take a bite of cake,
    drink the fire's health, and cast remaining cake or drink into the flame.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author identifies the rite as a vestige of heathen fire-worship shifted
    to a Christian feast of candle-consecration.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Germanic oven words denote a receptacle enclosing fire and
    that the word originally named fire itself; it also cites cognate fire words including
    Sanskrit Agni.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: German tales and legends are said to retain kneeling before the oven and praying
    to it; the unfortunate or persecuted resort to the oven, lament, and reveal secrets
    to it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author explains oven-prayer formulas as remnants of primitive fire-worship
    and states that the personification of the oven is connected with medieval notions
    of Orcus and hell as fiery places.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says people also complain and confess to mother earth, a stone,
    a plant, an oak, or a reed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A footnote gives examples of direct speech to the oven, including a children's
