    oven.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:8
  text: The luminous element is said to let feasts continue into night, and fires
    are described as vehicles for testifying joy.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Joy-fires, including bonfires, are said to be used without direct service
