  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says a torch-waggon could follow the king and later be set on
    fire, like the plough and wheels at the feast of St. John.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage gives examples of streets, houses, churches, and processions being
