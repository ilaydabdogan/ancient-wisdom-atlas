  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The hoopoo is described as a bird likewise thought to have received its form
    by metamorphosis.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The author says he cannot trace the story of the cuckoo and hoopoo any further.
  category: other
  evidence_refs:
  - ev:7
