canonical_text:
  quote: ''
  summary: The passage surveys Germanic and related usages in which the cuckoo or
    related words denote a fool, adulterer, bastard, rival suitor, or fiendish being.
    It notes phrases where 'cuckoo' can substitute for the devil, suggests possible
    older heathen traditions later given a diabolic coloring, and mentions a Low Saxon
    formula pairing the cuckoo with his clerk or sexton, identified as the hoopoo,
    a bird thought to have obtained its form by metamorphosis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The term gouh or gouch is cited as having the side-meaning of fool in medieval
    sources, with ON gaukr likewise glossed as an arrogant fool.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cuckoo is described as being in ill repute and as passing for an adulterer
    because it lays its eggs in other birds' nests.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Roman cuculus is said to be used in the sense of moechus, and Germanic gouch
    or gduchelin formerly meant bastard; Swiss giigsch is said to mean an unbidden
    rival suitor.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The cuckoo is said to appear as a fiendish being, or as the fiend himself,
    in sayings such as 'cuckoo knows,' 'cuckoo take him,' and 'cuckoo sent him here.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author states that the devil's name could be substituted for 'cuckoo'
    in these phrases without changing the meaning.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author interprets the diabolic coloring of these cuckoo sayings as a later
