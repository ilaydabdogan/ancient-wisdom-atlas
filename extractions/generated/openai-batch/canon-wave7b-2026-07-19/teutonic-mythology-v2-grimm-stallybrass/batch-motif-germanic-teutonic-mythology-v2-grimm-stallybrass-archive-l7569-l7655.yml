candidate_motifs:
- id: motif:1
  label: Protective water that deflects harm
  taxonomy_refs: []
  basis: The passage reports use of rebounding mill-wheel water for bathing and explicitly
    says evil and harm are expected to glance off like water from the mill-wheel.
  evidence_refs:
  - ev:1
  - ev:11
  confidence: high
  cautions: The protective meaning is reported through Grimm’s description of folk
    belief, not through a primary ritual text.
- id: motif:2
  label: Weather poured from heavenly or uncanny vessels
  taxonomy_refs: []
  basis: Rain is said to fall from bowls held by sky gods, witches pour storm and
    hail from pitchers, and a footnote reports a rain-goddess with a pitcher.
  evidence_refs:
  - ev:3
  - ev:12
  confidence: medium
  cautions: The figures and traditions mentioned are heterogeneous; the passage supports
    a vessel-weather image but not a historical relationship.
- id: motif:3
  label: Rain-making by drenching a ritual girl or child
  taxonomy_refs: []
  basis: Burchard’s charm splashes an undressed girl at a river; the Servian dodola
    and Greek pyrperuna rites douse a central girl or child with bucket or pail water
    to obtain rain.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage itself notes characteristic differences among the rites and
    rules out direct borrowing.
- id: motif:4
  label: Vegetation-covered rain-girl procession
  taxonomy_refs: []
  basis: The Servian dodola is wrapped in grass, herbs, and flowers, while the Greek
    pyrperuna is decked from head to foot with field herbs and flowers and led through
    the village.
  evidence_refs:
  - ev:7
  - ev:9
  - ev:14
  confidence: high
  cautions: The author raises, but does not resolve, whether the covering has a reason
    beyond modesty.
- id: motif:5
  label: Supplication for rain to a named divine or heavenly figure
  taxonomy_refs: []
  basis: The passage names Donar, Mary, and Elias as supplicated for rain, quotes
    a Servian rain-hymn in which doda calls to God for rain, and summarizes a Wallachian
    song asking Papaluga to send rain.
  evidence_refs:
  - ev:4
  - ev:8
  - ev:13
  confidence: medium
  cautions: The named figures belong to different ritual and textual contexts within
    the passage.
- id: motif:6
  label: Ritual action compelling or inducing rain
  taxonomy_refs: []
  basis: The author says the special charm procured rainwater and in some measure
    compelled the gods, and later explains the performance as matching poured water
    on the rain-girl to rain falling from heaven.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: medium
  cautions: The language of compulsion and symbolic association is the author’s interpretation
    of the rites.
comparison_claims:
- id: claim:1
  claim: Burchard’s rain charm, the Servian dodola, and the Modern Greek pyrperuna
    share the same rain-making function and a comparable structure involving a central
    undressed or vegetation-covered girl or child and ritual wetting.
  claim_level: same_function
  target: Burchard rain-girl charm; Servian dodola; Modern Greek pyrperuna
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:9
  - ev:10
  counter_evidence_refs:
  - ev:6
  - ev:10
  confidence: high
  limitations: The passage explicitly notes characteristic differences, says direct
    borrowing is out of the question, and states that the names dodola and pyrperuna
    remain unexplained by Greek or Slavic.
- id: claim:2
  claim: The mill-wheel rebound-water rite and the rain-girl bucket-water rite are
    compared by the author as actions in which the physical behavior of water is associated
    with the desired result.
  claim_level: same_function
  target: Mill-wheel rebound water and rain-girl bucket-water rain-making
  evidence_refs:
  - ev:1
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The connection is presented as the author’s symbolic explanation, not
    as an emic statement from participants.
- id: claim:3
  claim: The sky-god bowls, witch pitchers, and Peruvian rain-goddess pitcher share
    a visual pattern of weather or rain being released from a vessel.
  claim_level: visual_similarity
  target: Vessel-held weather in sky-god, witch, and Peruvian rain-goddess examples
  evidence_refs:
  - ev:3
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides no evidence of historical contact or shared inheritance;
    the Peruvian example appears only in a footnote summary.
- id: claim:4
  claim: The supplication to Donar, Mary, and Elias, the Servian doda’s call to God,
    and the Wallachian song to Papaluga share the function of addressing a named figure
    for rain.
  claim_level: same_function
  target: Rain supplication to Donar/Mary/Elias, God in the Servian hymn, and Papaluga
    in the Wallachian song
  evidence_refs:
  - ev:4
  - ev:8
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The addressed figures and genres differ, and the passage does not claim
    a single tradition or line of transmission.
