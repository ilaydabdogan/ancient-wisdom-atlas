canonical_text:
  quote: "“as the water from the bucket on the dodola, so is rain out of heaven to
    stream down on the earth”"
  summary: 'The passage describes protective use of water rebounding from a mill-wheel
    and several rain-making beliefs and rites: divine or witch vessels pouring weather,
    supplication to rain-granting figures, a medieval charm involving an undressed
    girl, henbane, and river water, and Servian and Modern Greek customs in which
    a vegetation-covered rain-girl is led through the community and drenched with
    water.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Women are said to go early on St. George’s Day to catch rebounding water,
    especially from a small brookmill, bathe in it, and sometimes carry it home and
    sprinkle it with broken greens; they believe evil and harm will glance off their
    bodies like water off the mill-wheel.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A warning is reported not to flick water off the hands after morning washing,
    because doing so is said to flick away the day’s luck.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rain is described as formerly believed to be let fall from bowls by gods of
    the sky; riding witches are described as believed to carry pitchers from which
    they pour storm and hail.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: In drought, the granting of rain is said to depend first on a deity, named
    as Donar, or Mary and Elias, who were supplicated; the passage then says a special
    charm was also used to procure rainwater and in some measure compel the gods.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the charm reported by Burchard of Worms, a completely undressed little
    girl is led outside the town, digs up henbane with the little finger of her right
    hand, ties it to the little toe of her right foot, is conducted by other maidens
    to the nearest river, and is splashed with water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the Burchard ceremony may have still been in use on
    the Rhine or in Hesse in the 11th century and compares it with Servian and Modern
    Greek customs while noting characteristic differences and rejecting direct borrowing.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the Servian custom, a girl called the dodola is stripped naked but wrapped
    in grass, herbs, and flowers so that her person, including her face, is not visible.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Servian dodola is escorted by other maidens from house to house; before
    each house they form a ring, the dodola stands in the middle dancing alone, and
    the goodwife empties a bucket of water over her while her companions sing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Servian rain-hymn quoted in the passage says that the doda calls to God
    so that dewy rain may fall and drench workers and those in house and stall; the
    passage says rain is expected to come at once.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the Greek custom, after a dry period, children choose one child, usually
    a poor orphan aged eight to ten, strip and deck the child with field herbs and
    flowers, call the child pyrperuna, lead the child round the village singing, and
    each housewife pours a pailful of water over the child’s head and gives the children
    a small coin.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that neither Greek nor Slavic explains the names dodola
    and pyrperuna, and gives the author’s explanation that water poured on the dodola
    corresponds to rain streaming from heaven onto the earth.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: A footnote reports a Peruvian belief in a rain-goddess sitting in the clouds
    with a pitcher of water, and a brother with thunder and lightning breaking the
    pitcher if she delays.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: A footnote summarizes a Wallachian children’s song asking Papaluga to climb
    into heaven, open its doors, and send down rain so that rye may grow.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The author compares the mill-wheel rebound sending evil flying and stream
    lustration washing away harm with the symbolic association between poured bucket-water
    and rain.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
