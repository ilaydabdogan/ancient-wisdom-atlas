canonical_text:
  quote: ''
  summary: The passage surveys flood and creation legends from British, German, Danish,
    Servian, and wider comparative contexts. It describes a British Triads flood in
    which a pair survives in a ship and repopulates the land, animal pairs aboard
    the vessel, a beaver drawn from the lake, regional German lake tales, a Servian
    divine mission to a sinful world, lakes formed from giant blood, and the author's
    caution against deriving all such narratives from the Mosaic record.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the British Triads narrative, the lake of Llion overflows, submerges all
    Britain, and drowns the people except for F'wijvan and Dwyvach.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: F'wijvan and Dwyvach escape in a naked or sailless ship and afterwards repopulate
    the land.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ship is also called the ship of Nevydd nav neivion and is said to have
    carried a male and female of every creature.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The oxen of Hu Gadarn drag the a vane, glossed as a beaver, ashore from the
    Llion lake, after which the lake has never broken out again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage lists German tales of narrower scope, including a dwarf seeking
    lodging at Ralligen, an Arendsee tale where only a husband and wife are saved,
    and tales of Seeburg and Frauensee.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Servian lay is described as involving three angels sent by God to a sinful
    world and the origin of the Plattensee or Balatino yezero.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says some lakes and pools were formed by the streaming blood of
    giants, and compares this with the destructive Deluge arising from Ymir's blood.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author states that the whole group of flood and human-creation tales cannot
    be treated simply as distortions of the Mosaic record because the tales contain
    many additions, omissions, and discrepancies.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage notes similar but different accounts among islands of the Eastern
    Archipelago, Tonga, New Zealand, Mexicans, and Caribs involving creation, the
    first human pair, a flood and deliverance, and the murder of a brother.
  category: other
  evidence_refs:
  - ev:6
