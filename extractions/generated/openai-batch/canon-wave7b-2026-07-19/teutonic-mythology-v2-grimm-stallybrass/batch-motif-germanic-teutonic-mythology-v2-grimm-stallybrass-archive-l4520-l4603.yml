canonical_text:
  quote: Their relation to gods and men is by turns friendly and hostile.
  summary: 'The passage surveys Germanic giant traditions: giants are alternately
    allies, spouses, hosts, captors, servants, and enemies of gods and human heroes;
    Thor and later heroic figures fight them; Fenja and Menja grind gold and peace
    for King Frodi; and Ymir, the first-created rime-giant, becomes the source of
    earth, water, mountain, and wood.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that giants have both friendly and hostile relations with
    gods and humans, and that Iotunheimr lies far from Asaheimr while visits occur
    in both directions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage presents some giants as resembling older nature-gods displaced
    by a younger and superior race, and names Ecke and Fasolt as examples in which
    deity may be recognized.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that giants sometimes rebel and make war on the gods, and
    that gods hurl them down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage lists multiple divine or semi-divine unions involving giants or
    giantesses, including gods married to giantesses, Odin's giantess beloved, Gefiun
    bearing sons to a giant, Borr wedding Bestla, and Loki having giant parentage
    and a giantess wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that the gods associate with Oegir the iotunn and are invited
    by him to a banquet.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The passage says that giants seek or seize divine women: Thrymr sues for
    Freyja, Thiassi carries off Idunn, and Hrungnir asks for Freyja or Sif.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage gives examples of giants serving or fighting alongside human rulers
    and heroes, including Starkadr, Asperian, Witolt, Wittich, Heime, and twelve giants
    linked with Niblunc and Schilbunc.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage identifies Thor as the chief foe of giants among the ases and
    says his hammer has crushed many giant heads.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says St. Olaf also pursues the giant race and that heathen and
    Christian heroes are united in this business.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says giants gradually become extirpated from the earth and that,
    with heroes, giant-fighting alternates with dragon-fighting.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: King Frodi has Fenja and Menja, two captive giant-maidens, as mill-maids;
    they grind gold and peace from the quern Grotti and receive only very limited
    rest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage uses German proper names such as Managold, Manigold, Fanigold,
    and Fenegold as evidence that a related myth of manigold and fanigold ground out
    by Fania and Alminia was once known in Bavaria.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ymir, also called Orgelmir in giants' language, is described as the first-created
    being, and earth, water, mountain, and wood are said to be engendered from his
    body.
  category: sequence
  evidence_refs:
