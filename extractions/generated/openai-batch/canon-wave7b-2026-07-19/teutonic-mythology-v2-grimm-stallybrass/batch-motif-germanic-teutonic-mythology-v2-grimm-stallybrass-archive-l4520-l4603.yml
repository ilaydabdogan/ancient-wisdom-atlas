comparison_claims:
- id: claim:1
  claim: The passage compares rebellious giants who make war on the gods to heaven-scaling
    Titans and to beings hurled down like devils into hell.
  claim_level: same_function
  target: Greek Titan-like divine rebels and Christian devil imagery
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is analogical within Grimm's prose and does not by itself
    establish historical contact.
- id: claim:2
  claim: The passage compares Thor's thunder-wounds against giants to Jupiter's thunder
    function.
  claim_level: same_function
  target: Jupiter as thunder-wielding opponent of giants
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports functional comparison only; it does not demonstrate
    borrowing or common origin.
- id: claim:3
  claim: The passage states that St. Olaf's pursuit of giants continues the same business
    as heathen heroic giant-fighting.
  claim_level: same_function
  target: Christian saintly giant-quelling alongside Germanic heathen heroic giant-quelling
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is limited to continuity of role or function as summarized
    in this passage.
- id: claim:4
  claim: The passage links heroic giant-fighting with dragon-fighting by saying they
    alternate with all heroes.
  claim_level: same_function
  target: heroic dragon-fighting pattern
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage indicates alternation or adjacency of heroic combats, not
    identity of giants and dragons.
- id: claim:5
  claim: The passage cautiously compares Jack the Giantkiller's deeds and equipment
    with Thor's giant-fighting and hammer, while noting the possible Welsh origin
    of the nursery tale.
  claim_level: same_function
  target: British Jack the Giantkiller tradition
  evidence_refs:
  - ev:11
  counter_evidence_refs:
  - ev:11
  confidence: low
  limitations: The passage itself presents the comparison conditionally and notes
    a possible Welsh origin, limiting any Germanic comparison.
- id: claim:6
  claim: The passage argues that German names such as Managold, Manigold, Fanigold,
    and Fenegold indicate that a form of the Grotti/Fenja-Menja gold-grinding myth
    was formerly known in Germany or Bavaria.
  claim_level: same_motif
  target: German or Bavarian reflex of the Fenja-Menja/Grotti mill myth
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The evidence given is onomastic and inferential; the passage does not
    quote a full German narrative version.
