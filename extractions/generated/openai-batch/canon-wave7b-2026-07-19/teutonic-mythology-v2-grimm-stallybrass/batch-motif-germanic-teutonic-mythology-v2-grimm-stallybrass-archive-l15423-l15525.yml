canonical_text:
  quote: Sommer 'rein, Winter 'naus!
  summary: 'The passage gives German song excerpts and ritual descriptions in which
    Summer is announced, fetched, or wakened while Winter is defeated, blinded, banished,
    or driven out. Children enact a combat with rods: one boy wrapped in straw represents
    Winter and another decked with ivy represents Summer; Winter is thrown and stripped.
    A regional wording substitutes Death for Winter as the target whose eyes are to
    be stabbed out.'
  language: English with German song excerpts
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The custom is located chiefly around the middle Rhine, the Palatinate, and
    the Odenwald between Main and Neckar.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: One song announces that Summer is present, calls for going into the garden
    and behind the hedges to wait for or wake Summer, and says that Winter has lost
    and lies as a prisoner.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several variants describe violent actions against Winter, including scratching,
    blowing, or stabbing out his eyes, sending him over the Rhine, and throwing him
    in the dirt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Violets, roses, and flowers occur in the songs in connection with fetching
    or bringing Summer.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The author states that the conception and setting are heathenish and summarizes
    the pattern as valiant Summer found, fetched, or wakened, and Winter vanquished,
    chained, beaten, blinded, and banished.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: In some places children march with white peeled rods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: One boy at the head of the band is wrapped in straw and stands for Winter;
    another is decked with ivy and stands for Summer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The two representative boys fence with poles, then wrestle, until Winter is
    thrown and his straw garment is stripped off.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the fight, when Winter is put to flight, the performers sing of driving
