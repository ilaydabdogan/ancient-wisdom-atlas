canonical_text:
  quote: There the whole of nature is but the first man gone to pieces, here man is
    put together out of the elements of nature.
  summary: The passage compares Eddic and other creation correspondences between body
    parts and world elements. It emphasizes similarities such as blood with water,
    flesh with earth, bone with stone, hair with vegetation, and brain or thoughts
    with clouds, while contrasting the Scandinavian model of the world made from a
    primordial human body with inverse accounts in which man is made from cosmic or
    natural elements. A footnote gives a Christianized elemental list for the formation
    and qualities of man.
  language: English with embedded French and Latin in a note
  quote_policy: quoted
