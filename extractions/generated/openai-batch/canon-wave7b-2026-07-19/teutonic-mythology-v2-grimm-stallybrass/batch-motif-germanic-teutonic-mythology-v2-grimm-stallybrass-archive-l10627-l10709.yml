canonical_text:
  quote: ''
  summary: 'The passage surveys beliefs and rites concerning horses and horse heads:
    horse heads are used against night-spirits and in other magical placements; Slavic
    sacred horses are described as objects of veneration and as instruments of divination
    before war or expeditions; accounts differ in spear arrangements, horse color,
    and omen criteria. Saxo’s account also reports that Svantovit was believed to
    ride a white horse by night.'
  language: English with embedded Latin source quotations
  quote_policy: summarized
literal_observations:
