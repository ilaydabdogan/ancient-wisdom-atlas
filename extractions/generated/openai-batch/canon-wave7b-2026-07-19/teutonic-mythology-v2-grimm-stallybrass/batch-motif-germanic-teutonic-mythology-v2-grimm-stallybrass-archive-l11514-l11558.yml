    gowk or cuckoo-related names.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: A verse cited from Freidank, with a parallel in Bonerius, characterizes the
    people of Gauchsberg as having wise words and foolish deeds; the passage equates
    Gauchsberg with Fools’ Mountain.
  category: attribute
  evidence_refs:
  - ev:6
