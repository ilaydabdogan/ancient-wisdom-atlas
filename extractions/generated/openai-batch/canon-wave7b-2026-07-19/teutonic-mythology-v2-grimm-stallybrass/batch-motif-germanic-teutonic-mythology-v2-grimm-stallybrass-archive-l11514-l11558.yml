canonical_text:
  quote: ''
  summary: 'The passage discusses folklore and comparative traditions about the cuckoo:
    its dangerous or deluding power, its ominous appearance in a Lombard royal episode,
    its association with Slavic divinity and Zeus’s transformation when approaching
    Hera, its presence in imagery of Zeus and Hera’s wedding, and cuckoo-named mountains
    or hills including Gauchsberg, which is linked proverbially with foolish action.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The cuckoo is described as requiring caution in speech and questions, as dangerous
    to kill without cause, as able to tease or delude people, and as often appearing
    as an evil omen.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cuckoo is reported to have flown to and settled on the top of the staff
    or spear handed to Hildeprand, king of the Lombards; prudent observers took this
    as a portent that his rule would be useless.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says a Slavic all-nourishing life-divinity took the shape of the
    cuckoo, and that Zeus transformed himself into the bird when he first approached
    Hera.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A seated figure of Hera is described with a cuckoo on her staff, and a bas-relief
    of the wedding procession of Zeus and Hera is described with a cuckoo perched
    on Zeus’s sceptre.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bird is said to have become mixed up with the most sacred wedding and
    to promise marriage and the fruit of wedlock.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mountain where Zeus and Hera came together is said to have received a
