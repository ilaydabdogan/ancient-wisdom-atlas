- id: obs:1
  text: The god Thorr finds a night's lodging in the thumb of the giant Skr;^mir's
    glove.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Skr;^mir sleeps under oaks and snores; Thorr strikes him three times with
    a hammer, and the giant describes the blows as a leaf, an acorn, and something
    dropped by birds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In a Bohemian story, the giant Scharmak sleeps under a tower that enemies
    undermine; after it falls, he complains that birds drop things on his head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the same Bohemian comparison, three men drag a large bell into an oak over
    sleeping Scharmak, cut it down on him, and he does not wake.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a German nursery-tale, millstones are dropped on a giant in a well, and
