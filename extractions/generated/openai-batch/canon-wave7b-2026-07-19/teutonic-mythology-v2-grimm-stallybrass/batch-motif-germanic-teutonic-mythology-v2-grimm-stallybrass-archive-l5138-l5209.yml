canonical_text:
  quote: ''
  summary: 'The passage gathers examples of giant scale and force: Thorr lodges in
    the thumb of Skr;^mir''s glove and strikes the sleeping giant, who treats the
    blows as minor falling objects; Bohemian and German tales show similar invulnerable
    giant sleepers; Hyrrokin moves Baldr''s funeral ship by touching it with her foot,
    with a Norwegian giantess parallel; Gargantua and a Westphalian hüne span mountains
    or hills to reach river or brook water.'
  language: English
  quote_policy: summarized
