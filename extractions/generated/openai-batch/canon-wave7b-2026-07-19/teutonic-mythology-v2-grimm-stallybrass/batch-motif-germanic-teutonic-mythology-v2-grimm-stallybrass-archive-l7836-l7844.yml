  summary: A note reports a belief that Lake Baikal is bottomless and recounts a priest
    who tried to dive into it, was frightened by lus described as dragons or sea-monsters,
    and died raving mad. A second note cites a 1644 work by Joh. Gutslaff about the
    so-called holy brook Wohhanda in Livonia and the burning of Sommerpahl mill, framed
    as Christian opposition to heathen superstition.
