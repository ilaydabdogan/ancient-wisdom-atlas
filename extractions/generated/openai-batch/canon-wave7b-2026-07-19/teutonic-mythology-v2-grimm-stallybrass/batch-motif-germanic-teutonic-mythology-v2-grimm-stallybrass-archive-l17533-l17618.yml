canonical_text:
  quote: ''
  summary: The passage analyzes the term muspilli or mudspelli as possibly denoting
    fire as wood- or tree-destroying, or alternatively as land- or world-wasting.
    It describes Surtr as a swarthy giant rather than a god, associated with fire,
    caves, and a blazing sword. It then compares Christian poetic uses of muspilli
    at the end of the world and Judgment-day with Eddic accounts in which Surtr and
    the sons of Muspell attack the gods, the world burns, mountains reel, beings flee
    or die, heaven cracks, and the Ases fight Surtr’s host at Oskopnir before the
    world ends.
  language: English, with Old Norse and Old High German terms
  quote_policy: summarized
