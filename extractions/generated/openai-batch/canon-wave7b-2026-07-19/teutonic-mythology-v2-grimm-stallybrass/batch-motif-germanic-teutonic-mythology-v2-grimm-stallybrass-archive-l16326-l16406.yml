canonical_text:
  quote: ''
  summary: The passage describes an annual Halberstadt custom of setting up and striking
    a log or wooden skittle associated with an idol's place, a procession with a bear
    and a sword-bearing boy, Polish and Slavic ideas about bringing in Summer and
    gossamer, the divine pair Lel and Polel, names for gossamer such as Mary's yarn
    and old wives' summer, and seasonal performances involving Summer and Winter champions
    or leaf-covered boys dancing like bears.
  language: English
  quote_policy: summarized
