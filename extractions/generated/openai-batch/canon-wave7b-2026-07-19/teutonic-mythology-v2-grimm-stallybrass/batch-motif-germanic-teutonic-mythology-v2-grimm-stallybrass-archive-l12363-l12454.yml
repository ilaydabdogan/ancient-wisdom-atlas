canonical_text:
  quote: ''
  summary: The passage discusses Germanic and related terms for sky, heaven, stars,
    and heavenly bodies. It notes physical and spiritual senses of heaven, compares
    Saxon terms with Greek terms, describes heaven as an all-encompassing sky, mentions
    cloud-reaching 'hills of heaven' and divine or spirit-haunted places, compares
    a shield-roofed hall with Eddic Valholl, and records poetic images of heaven as
    husband of earth, star/moon terms as 'heavenly tongue,' and heavenly bodies having
    assigned seats or resting-places.
  language: English
  quote_policy: summarized
