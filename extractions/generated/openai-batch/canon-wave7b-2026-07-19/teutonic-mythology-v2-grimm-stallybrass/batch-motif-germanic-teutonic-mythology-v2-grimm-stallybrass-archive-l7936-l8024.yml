canonical_text:
  quote: ''
  summary: The passage moves from a note on Reichenau as a holy island and unchristened
    infants, to sea imagery including the Eddic world-encircling worm and the purity
    of sea and running water. It then surveys fire as a living, hungry, addressable,
    and sometimes divine being; fire as brother of wind and sea in the Edda; the red
    cock image for incendiary fire; the great World-fire called muspell; fire reverence,
    hearth customs, offerings, and sacrifices; and traditions treating malignant fire
    as Loki, the devil, or a hostile being to be exorcised.
  language: English
  quote_policy: summarized
