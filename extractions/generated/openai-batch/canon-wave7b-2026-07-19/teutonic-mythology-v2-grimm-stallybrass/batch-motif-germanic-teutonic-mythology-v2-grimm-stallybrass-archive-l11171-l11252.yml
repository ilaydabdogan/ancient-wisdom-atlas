canonical_text:
  quote: ''
  summary: 'The passage surveys stork and woodpecker lore: Frisian stork-human metamorphoses;
    the ancient Italian sacred woodpecker associated with Mars, prophecy, guidance,
    Romulus and Remus, and Picus; a Norwegian tale in which Gertrude is changed into
    a red-capped black woodpecker after refusing food to Christ; and German/Estonian
    rainbird traditions in which a bird is punished for avoiding dirty communal work
    and must rely on rainwater, with its cry foretelling or bringing rain.'
  language: English
  quote_policy: summarized
