  quote: ''
  summary: The passage surveys names and representations of personified Death in old
    poetry and related medieval material. It lists epithets of Death, discusses the
    Reinardus figure dominus Blicero and a horse-head or bone fiddle, considers skulls
    and horse skulls as death symbols and memento mori objects, and describes the
    emergence of skeletal Death imagery. It also notes a related poetic image of the
    World as a beautiful woman whose back is covered with snakes and adders.
  language: English
  quote_policy: summarized
