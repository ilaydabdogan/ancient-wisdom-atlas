canonical_text:
  quote: ''
  summary: The passage classifies personified Death as a secondary heathen divine
    being connected with valkyrs, norns, Odin, Hel, Greek underworld figures, lesser
    spirits, Winter, and Kronos. It also notes a Heldenbuch episode in which Death
    appears as a false god, Finnish Manala and Tuonela as underworld/dead-realm entities,
    and then introduces destiny and fortune, emphasizing that even gods such as Odin/Wuotan
    and Zeus are limited by a higher order of fate, with Balder’s misfortune and Ragnarok
    as examples.
  language: English
  quote_policy: summarized
