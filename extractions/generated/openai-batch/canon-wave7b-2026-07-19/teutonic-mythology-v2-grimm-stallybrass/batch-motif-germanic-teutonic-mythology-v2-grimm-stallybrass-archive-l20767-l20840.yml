  quote: ''
  summary: A Middle High German passage presents Unseelde, Misfortune, as a companion
    who travels with a man, cannot be outrun, and rests on his neck. Grimm comments
    that this is the same pattern as a homesprite or kobold that flits with someone
    and cannot be shaken off, with personified Misfortune substituted for the kobold.
    The passage then opens a chapter on mythical personification and states that gods
    and spirits can reveal or conceal their shape, appear, and disappear.
