  summary: The passage surveys venerated stones, rocks, stone groups, and stone circles;
    sacred natural cavities in hollow stones and trees; English protective holed-stone
    practices; German tribunal, sacrificial, oath, and holy-mountain stone traditions;
    legends of stones dropped or marked by a giant or devil; petrified beings and
    sympathetic or weeping stones associated with Baldr; and a closing list of deities
    governing water, fire, air, and earth. It also contrasts Celtic and Teutonic stone
    worship and gives literary parallels for stones moved to pity or crying out.
  language: English with embedded Old Norse, Anglo-Saxon, German, Latin, Greek, and
    other citations
