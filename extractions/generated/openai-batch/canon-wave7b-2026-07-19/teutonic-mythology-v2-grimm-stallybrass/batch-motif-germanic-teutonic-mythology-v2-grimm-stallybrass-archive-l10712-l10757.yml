canonical_text:
  quote: ''
  summary: The passage discusses sacred horses associated with Slavic deities and
    possible Germanic parallels. It cites a report of Bishop Barcardus carrying away
    a sacred horse from the Lutizers, proposes that different medieval sources may
    refer to horses of Radigast at Rethra and Sviatovit at Arkona, and describes reported
    Ditmarsen traditions of white horses in holy groves used for augury, while repeatedly
    noting doubts about some local accounts.
  language: English with some Latin quotation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cited account says Barcardus, bishop of Halberstadt, entered the Lutician
    province, burned and devastated it, carried off a horse worshipped as divine at
    Rheda, and rode back to Saxony on it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author asks whether Dietmar and the Augsburg chronicler refer to the sacred
    horse of Radigast at Rethra, while Saxo and the Vita Ottonis refer to the horse
    of Sviatovit at Arkona.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that each of these gods had horses hallowed to him, and
    suggests that horses in Germany may likewise have been dedicated to several deities,
    with divination performed under similar forms.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports, but calls doubtful, an account that the Rieswold or Riesumwold
    was a holy wood where human sacrifices were offered and white horses consecrated
    to gods were maintained.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Windbergen grove is reported to have contained two white horses, one young
    and one old, fed for the god; no one was allowed to mount them, and auguries were
    taken from their neighing and leaping.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports variants speaking of ten or twenty horses in the Windbergen
    account.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: A priest is said to have stuck staves in the ground, led the bridled steed
    along, and made it leap slowly over the staves by certain processes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author notes that Neocorus says nothing about the Windbergen horse ritual
    and that the prohibition on mounting agrees with the Slavic sacred-horse accounts.
  category: other
  evidence_refs:
  - ev:5
