  summary: The passage discusses Germanic and comparative personifications of goddesses,
    godlike women, virtues, protectresses, fortune, abundance, victory, snowstorm,
    and departing virtues. It compares several figures or functions with Roman, Norse,
    Greek, and swan-wife patterns.
