literal_observations:
- id: obs:1
  text: The passage states that many goddesses and godlike women have sprung from
    moral ideas, and that a divine mother appears beside a father or grandfather under
    several forms.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists Frau Uote, Holda, Berhta, Frouwa or Freyja, Sippia, and
    Sif among divine or godlike female forms.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Folla, Fulla, or Ahundia is glossed as fulness of blessing, and Roman Copia
    is described with a horn of plenty.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Snotra is described as wise and well-behaved, and the related adjective can
    be applied to a discreet sensible woman.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vor or Wara, Syn, and Hlin are presented as protectresses; Vor is aware, Syn
    guards the doorway or provides defence, and Hlin protects people in peril.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hali or Halja is described as a sheltering goddess who hides people in the
    bosom of the underworld and is said to have originally been kind.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage argues from recurring Old Saxon and Old High German phrases that
    Fruma may once have had a personal Fruma underlying it, connected with gain, usefulness,
    and gifts of fortune.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: Salida is discussed alongside Fruma as a personification connected with what
    comes to hand or falls to one's lot.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Siguhepa is said to suit a victory-giving valkyr, while Sigrdrifa is compared
    with Victoria or Nike.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Drifa is described as a goddess of the snowstorm, and the passage says that
    in battle darts and arrows fly like snowflakes; Holda sends flakes and Wuotan
    sends arrows.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that splendour, light, shelter, deliverance, blessings,
    and especially victory proceeded from divine or superhuman female beings.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says honour, love, truth, gentleness, shame, self-control, and
