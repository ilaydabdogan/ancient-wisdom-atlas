  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Great Bear is identified with the native name waggon or wain; popular
    belief says the heavenly wain turns round noisily at dead of night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: 'A Swiss belief links the height of the heavenly wain with bread prices: low
