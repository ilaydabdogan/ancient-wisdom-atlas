canonical_text:
  quote: ''
  summary: The passage surveys Germanic and comparative names for planets, stars,
    and constellations. It notes Venus as evening and morning star, Eddic accounts
    of body parts becoming stars, and popular names and beliefs about the Great Bear
    as a heavenly waggon or wain associated variously with Wuotan/Woden, Thor, and
    Charles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author says there is no trace in the North that planets were named after
    the great gods, and that planet-names for weekdays seem to have been imported
    early from abroad.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Venus is identified as evening star and morningstar, with Old High German
    names compared to Latin vesper and lucifer.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The eveningstar is also discussed under names including a term used of a witch
    or wise-woman on a midnight journey.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Anglo-Saxons called the eveningstar the swains' star because herdsmen
    drove their herd home when it appeared.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A cited Christian comparison presents Christ as the sun and the apostles as
    eleven daystars, interpreted here as signs of the zodiac rather than simple morning
    stars.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Edda is said to relate origins of particular stars, including Orvandil's
    toe, a bright luminary that the author says may have meant the morningstar.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the Æsir slew the giant Thiassi, they had to atone to his daughter Skaði;
    Obinn took Thiassi's eyes and threw them against the sky, where they formed two
    stars.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The author interprets Thiassi's eyes as likely two nearby stars of equal size
    and brightness, perhaps the Twins, while marking the identification as uncertain.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states a connection between stars and eyes and links the toe translated
