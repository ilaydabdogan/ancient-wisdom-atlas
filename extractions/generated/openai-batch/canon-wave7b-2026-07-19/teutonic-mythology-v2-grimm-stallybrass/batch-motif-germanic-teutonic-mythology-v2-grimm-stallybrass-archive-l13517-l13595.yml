  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: The Milky Way and its relation to Irmin are mentioned as having been treated
    elsewhere.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Ursa Major, Orion, and the Pleiades are named as the three constellations
