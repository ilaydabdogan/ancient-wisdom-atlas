  summary: The passage treats the swan as mythically marked by swan-wife legend and
    by its death-song. It says the stork was held inviolable and, like swallows, served
    as a herald of spring. It then surveys older Germanic names for the stork and
    explains the element bero/boro as “bearer,” while noting uncertainty over whether
    the first element indicates luck or child-bearing.
