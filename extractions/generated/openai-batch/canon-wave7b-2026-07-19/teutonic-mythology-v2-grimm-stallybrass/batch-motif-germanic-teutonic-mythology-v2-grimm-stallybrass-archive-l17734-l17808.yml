canonical_text:
  quote: Ragnarok then is the night of the gods, which comes over all beings, even
    the highest
  summary: 'The passage compares Germanic and Christian apocalyptic material, rejects
    a simple derivation of the Eddic Ragnarok from Antichrist traditions, explains
    Ragnarok as the darkening or night of the gods, and summarizes the Eddic end-time
    sequence: hostile beings break loose, cosmic bodies are devoured or fall, monsters
    and hostile hosts advance, Bifrost is broken, and the gods enter final single
    combats.'
  language: English
  quote_policy: quoted
