canonical_text:
  quote: ''
  summary: The passage discusses the personified and divine status of Sun and Moon
    in Germanic and related sources, including Sol/Sunna as sister or companion of
    Mani, Sindgund as an escorting sister, and a poem greeting Lady Sun. It then describes
    the Sun and Moon as pursued across heaven by wolves, links eclipses with monstrous
    swallowing of the celestial orb, notes cries meant to aid or restore the eclipsed
    moon, and cites comparative forms involving Indian serpent or demon devourers
    and calendar dragons.
  language: English, with cited Latin and Germanic phrases
  quote_policy: summarized
