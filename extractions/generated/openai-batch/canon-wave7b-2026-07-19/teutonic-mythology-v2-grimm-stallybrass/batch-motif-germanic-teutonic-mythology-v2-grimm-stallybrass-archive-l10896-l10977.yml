  quote: dogs can see spirits ... and recognise an approaching god while he is yet
    hidden from the human eye
  summary: The passage surveys dog, bear, wolf, and fox lore. Dogs are described as
    perceiving spirits or hidden gods, giving omens by howling, belonging to Oðinn
    and the norns, and appearing in St. Peter-related medieval traditions and a watersprite
    spell. Bears, wolves, and foxes are described as awe-inspiring wild beasts with
    honorific names; the bear is treated as king of beasts and linked with divine
    or royal identities, winter sleep, and fable traditions. The passage also describes
    Oðinn’s wolves Geri and Freki, wolf hunting-dog imagery, Fenriswolf, and werewolf
    metamorphosis.
