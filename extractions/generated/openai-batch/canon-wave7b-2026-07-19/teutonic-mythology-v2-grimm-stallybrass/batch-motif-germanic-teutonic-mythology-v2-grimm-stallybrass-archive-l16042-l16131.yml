canonical_text:
  quote: ''
  summary: 'The passage surveys German, English, and French May customs: election
    or crowning of May rulers, bringing birch or May greenery from woods, May-waggons
    and Maypoles, decoration of churches and houses, music and dancing, and a staged
    conflict between Summer and Winter. It compares English Maypole and Lord/Lady
    of May customs with Low Saxon May-waggon and May-grave practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Hildesheim, May-riding is described as having survived until the eighteenth
    century, with a May-grave elected toward Whitsuntide.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Forest commoners were required to hew timber from seven villages to build
    the May-waggon, load loppings onto it, and use only four horses to draw it in
    the forest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A town expedition fetched the May-waggon; the burgomaster and council received
    a May-wreath from the commoners and handed it to the May-grave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The May-waggon carried sixty or seventy bundles of birch, which were delivered
    to the May-grave and distributed; monasteries, churches, steeples, and church
    floors were decorated with greenery and flowers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The May-grave entertained the commoners and was required to serve a dish of
    crabs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author states that the surviving Hildesheim custom no longer includes
    a battle with winter and argues that such a battle had existed earlier and was
    gradually omitted.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In some Holstein parishes, a young man and a girl were crowned with leaves
    and flowers, conducted with music to a tavern, and then associated with drinking
    and dancing; they were called May-grave and May-gravine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Schleswig note says cattle received a garland of beech leaves around the
    neck every Mayday and were driven home so decorated.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Swabia, children went into the wood at sunrise; boys carried silk handkerchiefs
    on staves, girls carried ribbons on boughs, and the May-king could choose his
    queen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In Gelders, decorated trees hung with tapers were set up on Mayday eve, followed
    by song and ring-dance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says May-bushes were brought into houses at Whitsuntide throughout
    Germany, though people no longer fetched or met them themselves.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: In England, Mayday participants went after midnight with horns and music to
    a nearby wood, broke boughs, decorated them with wreaths and posies, returned
    at sunrise, and set May-bushes in doors and windows.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In England, a tall cut birch called a Maypole was drawn by twenty to forty
    yoke of oxen, each with a nosegay between its horns, set up in the village, and
    danced around.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The English May festival was presided over by an elected Lord of the May with
    an associated Lady of the May.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage says that in England a fight between Summer and Winter was exhibited.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: For the Isere region of France, the passage reports a children’s May feast
    in which one child was adorned and given the title of king.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: A record of 1262 is cited concerning a right to go on the first day of May
    to collect May greenery in the woods.
  category: other
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage notes that medieval French and German narrative poems place royal
    courts at Whitsuntide and blooming Maytime, and cites Wolfram’s description of
    Arthur as a May-bearing man.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:19
  text: A footnote mentions a Lower Rhine and Westphalian May-drink made of wine and
    herbs, with woodruff not to be omitted.
  category: object
  evidence_refs:
  - ev:13
