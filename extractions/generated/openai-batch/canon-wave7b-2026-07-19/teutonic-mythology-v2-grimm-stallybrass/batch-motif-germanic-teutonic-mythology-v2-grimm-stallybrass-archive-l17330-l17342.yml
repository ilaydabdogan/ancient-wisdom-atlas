canonical_text:
  quote: the ' roots of earth and sea from above grow down ' into Tartarus ... suggests
    our Norse ashtree, whose root reaches down to Niflheim
  summary: The passage compares Greek underworld geography with Norse Niflheim. Greek
    heroes are said to sink into Hades under the earth; Tartarus is described as lower
    in the abyss, as a prison for subjugated giants, and later as a place of punishment
    for the wicked. The image of roots descending into Tartarus is likened to the
    Norse ash-tree root reaching Niflheim, and Ovid's misty Styx is said to fit the
    conception of Niflheim.
