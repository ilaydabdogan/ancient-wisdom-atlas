canonical_text:
  quote: ''
  summary: 'The excerpt surveys poetic and linguistic images for dawn and daybreak:
    day is animalized as falcon or lion, humanized as a beautiful youth or divine
    messenger, shown climbing or pressing forward from mountain tops, and described
    as driving night away. It also discusses delayed or tethered dawn, Romance words
    for daybreak meaning to prick, and dawn-related rustle, clang, and breeze imagery
    linked by the author to Wuotan/Wuomo/Woma.'
