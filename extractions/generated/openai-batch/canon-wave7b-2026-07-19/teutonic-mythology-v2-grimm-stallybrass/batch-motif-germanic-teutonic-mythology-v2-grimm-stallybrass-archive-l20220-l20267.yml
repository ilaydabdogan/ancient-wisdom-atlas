canonical_text:
  quote: ''
  summary: 'The passage gathers Latin and medieval poetic references to Fortuna''s
    wheel. It describes Fortuna''s wheel as alternating prosperity and adversity,
    raising some persons upward and lowering others. Grimm distinguishes two visual
    images: the goddess herself on the revolving wheel, and the goddess causing favoured
    and unlucky persons to ascend or descend. The passage also notes medieval terms
    for the wheel or disc of Fortune, luck, or Sælde, and footnotes parallels involving
    an old woman seated on a wheel as Fortuna and an impersonal turning wheel as an
    image of fate''s mutability.'
  language: English with quoted Latin, Middle High German, Italian, and Greek
  quote_policy: summarized
