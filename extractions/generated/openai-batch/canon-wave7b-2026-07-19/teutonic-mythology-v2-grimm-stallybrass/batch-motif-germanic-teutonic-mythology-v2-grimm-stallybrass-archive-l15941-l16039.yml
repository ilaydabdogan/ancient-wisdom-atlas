  quote: ''
  summary: 'The passage describes Germanic and Scandinavian May customs: a mounted
    pageant in which personified Summer defeats Winter, May-riding processions led
    by a May-grave, garland and maiden-selection rites, May-fire leadership customs,
    and feasting and dancing around a decorated tree. The author notes that Death
    is absent from this passage and that some Danish and Scanian forms omit the Winter
    conflict.'
