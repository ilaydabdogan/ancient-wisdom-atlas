canonical_text:
  quote: ''
  summary: 'The passage discusses meanings and poetic designations of “world,” including
    world as life, dream, sorrowful dwelling, broad earth, and dwelling-place. It
    cites Old Norse materials for nine worlds, firmaments, or heavens, and notes nonhuman
    worlds connected with the upper human world by passages. It then summarizes the
    Old Norse world-tree Yggdrasil: an ash linking heaven, earth, and hell, with three
    roots, holy springs, councils of gods and norns, Mimir at a well, holy water,
    honey-dew, and named animals including Nidhogg, Ratatoskr, an eagle, a hawk, stags,
    and snakes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says “world,” when understood as age or life, is poetically called
    a dream and is also described through terms of sorrow such as weep-dale, vale
    of tears, and house of sorrow.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage notes expressions for the world or earth as broad or wide, and
    connects breadth and brightness in discussion of Balder’s dwelling and miners’
    language for gleaming molten metal.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: When “world” or “heimr” means dwelling-place, the passage says several worlds
    may be conceived; it reports that Völuspá supposes nine worlds and nine firmaments,
    and that Snorri speaks of nine heavens.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage names the Flame-world, Dead-world, and Paradise as worlds other
    than the human upper world, and says they are more or less connected with it by
    passages.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Old Norse system is described as supposing a world-tree, Yggdrasil, an
    ash that links heaven, earth, and hell, and whose branches extend through the
    world and beyond heaven.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Yggdrasil is said to have three roots spreading in three directions: toward
    the ases in heaven, toward the hrimthurses, and toward the underworld.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'A miraculous spring is said to gush from under each root: Urdarbrunnr by
    the heaven root, Mimisbrunnr by the giants’ root, and Hvergelmir by the hell root.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says the ases and norns hold council at the Urdar-well, and that
    Mimir, described as wise and semidivine or nearly so, watches the giants’ well.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Every day the norns draw water from their well to water the ash; the water
    is called holy and said to whiten anything entering the well, while honey-dew
    trickles from the tree.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Animals are said to sit or move on Yggdrasil’s boughs and roots: an eagle,
    a squirrel, four stags, and snakes; Nidhogg lies below by Hvergelmir and gnaws
    the root, Ratatoskr runs up and down and tries to sow discord between Nidhogg
    and the eagle, and a hawk named Vedrfolnir sits between the eagle’s eyes.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
