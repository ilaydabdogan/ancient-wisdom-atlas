canonical_text:
  quote: ''
  summary: 'The passage discusses Bealtine and need-fire customs: Beal/Beil is described
    as a Celtic light deity; a Highland May Day rite includes a fire, a meal of eggs
    and milk, an oatmeal cake divided by lot, a blackened portion selecting a devoted
    person, and three leaps over flames; other notices describe passing between two
    fires for the welfare of people and cattle, extinguishing and priestly rekindling
    of fires, and comparisons with Welsh, Irish, and German seasonal fire observances.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies Beal or Beil as the name of a god and as a Celtic deity
    of light, with Welsh Beli and Old Celtic Belenus or Belinus also mentioned.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described Highland custom, young people from a hamlet meet on the moors
    on the first of May and cut a round table or trench in the green sod large enough
    for the company.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The participants kindle a fire and prepare a repast of eggs and milk, and
    they toast an oatmeal cake at the embers against a stone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After eating the custard, the participants divide the oatmeal cake into as
    many similar portions as there are people present.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: One cake portion is daubed with charcoal until black, all portions are put
    into a bonnet, and each person draws a portion while blindfolded.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The person who draws the black portion is described as the devoted person
    to be sacrificed to Baal for a productive year and is compelled to leap three
    times over the flames.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author states that an animal sacrifice was later substituted for a human
    being and that finally only a leap through fire for humans and beasts remained.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says the rite of friction is not mentioned in the Highland account,
    but associates friction with need-fire that purged pestilence.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: Cormac's account is summarized as two fires lit side by side, with passing
    unhurt between them said to be wholesome for men and cattle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A cited legal account says all fires were extinguished on that night and could
    not be rekindled until magi at Temoria built a sacrificial pyre.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage reports Leo's proposed contrast between Beal or Bael and Sighe
    or Sithich, assigning May fires to Beal and November fires to Sighe.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The author connects Beal with German Phol and notes Rhine Pfultag or Pulletag
    on the second of May.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The author asks whether German May fires were shifted after conversion to
    Easter and Midsummer, and whether German Yule or Midwinter could correspond to
    the Celtic November observance.
  category: speech
  evidence_refs:
  - ev:10
