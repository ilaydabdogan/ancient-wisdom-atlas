canonical_text:
  quote: ''
  summary: 'The passage describes Niflheimr or Niflhel as Hel''s misty underworld:
    a cold, dark, underground region centered on the fountain Hvergelmir, crossed
    by twelve rivers including Gjoll, and approached through dark valleys and forests.
    It distinguishes an older view in which the dead generally go there without explicit
    torment from a later moralized division of good and wicked souls, and then contrasts
    this with Christian fiery hell imagery.'
  language: English
  quote_policy: summarized
