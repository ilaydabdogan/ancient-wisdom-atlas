canonical_text:
  quote: ''
  summary: The passage surveys popular names and interpretations of the Pleiades,
    including hen-and-chicks, bear, seven kids, old wives, swallows, and sieve or
    flour-sifting images. It gives an origin tale in which Christ requests bread from
    a baker; the baker refuses, while the baker’s wife and six daughters secretly
    give a loaf, after which the women are set in the sky as the Seven-stars and the
    baker becomes the cuckoo. The passage also notes other star names and cautions
    that many constellation identifications, especially Biblical and eastern ones,
    are uncertain or conflicting.
  language: English
  quote_policy: summarized
