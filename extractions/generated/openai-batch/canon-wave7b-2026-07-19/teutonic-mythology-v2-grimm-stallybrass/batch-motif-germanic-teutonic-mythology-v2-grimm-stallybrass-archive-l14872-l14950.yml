  quote: Day and Night having been in the remotest antiquity both alive and divine.
  summary: The passage collects poetic images of night as dark, helmeted, and eye-like;
    argues that day and night were once treated as living and divine; discusses reckoning
    and festivals by nights, including fires and Bede's Mothers' Night; then introduces
    summer and winter as more strongly personified seasons, linked to birds' joy or
    silence and to older systems of seasonal reckoning.
