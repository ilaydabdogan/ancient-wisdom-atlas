canonical_text:
  quote: ''
  summary: The passage collects several medieval accounts of the creation of Adam
    or the human being from natural materials, including eightfold material lists,
    the addition of holy or divine breath, the creation of Eva from Adam's rib in
    one version, and a learned explanation of the human body as a microcosm formed
    from the four elements.
  language: English with embedded Latin, Old English, Old Frisian, and Middle High
    German excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A 10th-century interpolation in the Rituale ecclesiae Dunelmensis is introduced
    as the oldest version and gives a Latin text with an Old English interlinear translation.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Rituale version says Adam was made from eight pounds or weights: loam
    for flesh, fire for red and hot blood, salt for salty tears, dew for sweat, flower
    for variety of eyes, cloud for instability of mind, wind for cold breath, and
    grace or gift for human sense or thought.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The Emsig Code passage says God created the first human, Adam, from eight
    components: stone, earth, water, wind, clouds, dew, grass, and sun, each associated
    with a body part or faculty.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Emsig Code passage says God blew holy breath into Adam and then created
    Eva from Adam's rib.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The 12th-century Gospel poem says God made the human being outwardly from
    eight parts and gave him his own breath.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the 12th-century poem, clay gives flesh, dew gives sweat, stone gives bone,
    worts give veins, grass gives hair, sea gives blood, clouds give mind or mood,
    and the sun gives eyes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Godfrey of Viterbo's Pantheon explains Adam's formation from the slime of
    the earth as formation from the four elements and calls the human body a microcosm
    or minor world.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Godfrey's account maps body parts and senses to cosmic or elemental features,
    including head to heaven, eyes to two luminaries, belly to sea, feet to earth,
    sight to heavenly fire, hearing and smell to air, taste to water, and touch to
    earth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The translator's note treats the phrase 'pound of grace' or 'gift' as textually
    difficult and compares related Old English and French material about bodily ingredients,
    sea, thought, and wisdom.
  category: speech
  evidence_refs:
  - ev:5
