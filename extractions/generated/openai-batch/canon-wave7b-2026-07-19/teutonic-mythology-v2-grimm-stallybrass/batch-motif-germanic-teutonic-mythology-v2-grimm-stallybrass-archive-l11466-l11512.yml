canonical_text:
  quote: ''
  summary: 'The passage collects beliefs about the cuckoo: its singing is seasonally
    bounded, its first song gives omens about prosperity, hunger, and length of life,
    and it may cease singing or transform after Midsummer. It also reports a Slavic
    account of worship of the deity Zywie, who is said to transform into a cuckoo
    to announce life-spans, Serbian woodland omens tied to the cuckoo’s call, and
    an Eddic reference in which quern-maids may rest while the cuckoo is silent.'
  language: English with quoted German, Latin, and Slavic terms
  quote_policy: summarized
