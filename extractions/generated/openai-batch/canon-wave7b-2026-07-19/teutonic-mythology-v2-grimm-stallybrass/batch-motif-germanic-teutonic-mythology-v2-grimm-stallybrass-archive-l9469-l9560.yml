canonical_text:
  quote: ''
  summary: 'The passage surveys wind and storm imagery: winds imagined as flying or
    birdlike; Finnish and Modern Greek songs linking eagles, sparrowhawks, and Boreas
    with winds; Hraesvelgr as a corpse-eating bird or storm; folk beliefs connecting
    tempest with suicide and pestilence; tempest as a hungry giant appeased with flour;
    a Norwegian tale of the Northwind taking meal and compensating the victim; whirlwinds
    attributed to giants or spirits; and weather-spells naming Mermeut and Fasolt
    as storm authors, with Fasolt compared to Kari and Ecke/Hler/Oegir as corresponding
    storm and sea rulers under higher weather gods such as Donar and Zeus.'
  language: English
  quote_policy: summarized
