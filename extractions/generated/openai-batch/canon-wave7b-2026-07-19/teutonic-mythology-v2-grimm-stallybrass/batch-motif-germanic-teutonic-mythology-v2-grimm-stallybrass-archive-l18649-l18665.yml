canonical_text:
  quote: ''
  summary: 'The passage first reports a local statement that conveyance or escort
    of souls is imposed by turns, apparently connected with an old burden or service.
    Grimm then cites learned parallels, especially Plutarch''s account of Demetrius:
    islands near Britain are said to be deserted, some named for daimones and heroes;
    Demetrius sails to one such island with sacred, inviolable inhabitants; atmospheric
    disturbance is explained by the islanders as the departure or death of a stronger
    being. Great souls are compared to lamps whose extinction can disturb winds and
    air. The passage also reports an island where Cronus sleeps confined, guarded
    by Briareus, with many daimones attending him.'
  language: Greek and English
  quote_policy: summarized
