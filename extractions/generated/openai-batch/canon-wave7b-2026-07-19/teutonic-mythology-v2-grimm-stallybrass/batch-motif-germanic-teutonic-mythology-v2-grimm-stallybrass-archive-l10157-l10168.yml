canonical_text:
  quote: ''
  summary: 'A cited Vita Barbati passage reports a Lombard festival rite near Benevento:
    participants fulfilled vota to a tree, hung a dead animal hide in it, riders struck
    the hide with small lances while their arms were turned behind them, and a cut
    from the hide was tasted as if for the soul''s remedy. A note explains votum as
    including a votive offering, not only a vow.'
