canonical_text:
  quote: ''
  summary: The passage surveys comparative explanations and customs surrounding eclipses,
    especially the idea that a monster, demon, dragon, or other being attacks or devours
    the sun or moon. It also records noise-making rites meant to repel the attacker,
    a Mongolian myth of Arakho pursuing the luminaries, beliefs about sun and moon
    as all-seeing informants, eclipse-related protection of wells, possible moon symbols
    on boundary stones, moon-associated place names, lunar reckoning of time, and
    the influence of moon phases on undertakings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several cited groups explain eclipses as a giant, dragon, demon, or monster
    eating, devouring, laying hold of, or attacking the sun or moon.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
- id: obs:2
  text: The Lithuanian example says a demon named Tiknis or Tiklis attacks the chariot
    of the sun, producing darkness and fear among creatures; the passage adds that
    this danger is expected to prevail at the end of the world.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:3
  text: In lunar eclipses, Greenlanders are described as carrying boxes and kettles
    to rooftops and beating on them strongly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:4
  text: In the Moorish example, people run about during a solar eclipse, fire rifles
    at the sun to frighten the supposed devouring monster, and women make a loud din
    with copper vessels.
  category: action
  evidence_refs:
  - ev:6
- id: obs:5
  text: In the Mongolian myth, the gods seek to punish Arakho; the moon reveals his
    hiding place; after being dragged out and chastised, Arakho pursues the sun and
    moon, and an eclipse occurs when he grips one of them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:6
  text: The Mongolian account includes a response in which people make a tremendous
    uproar with musical and other instruments until Arakho is scared away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: The passage notes that the sun and moon are treated as beings who overlook
    the world and know secrets; it compares this with fairytales in which a seeker
    asks the sun, moon, and stars, and with Servian songs in which the moon and morningstar
    converse about human affairs.
  category: relationship
  evidence_refs:
  - ev:8
