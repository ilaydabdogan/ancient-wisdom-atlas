canonical_text:
  quote: ''
  summary: The passage describes beliefs that places, things, elements, and animals
    possess invisible powers or shades; hunters propitiate such powers with offerings
    and careful speech; animals may hear human speech at a distance; and the body
    and shade of a killed white whale require strict taboos involving work, tools,
    noise, iron, and dogs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each place, thing, and element is said to have a yu-a or mystery, human or
    semihuman in form, grotesque, and normally invisible.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shamans and especially gifted persons are described as able to perceive the
    otherwise invisible yu-a.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hunters at sea or in lonely places cast down food and water offerings before
    eating or drinking and often add propitiatory words.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An offended yu-a is said to be able to cause death, illness, or loss of hunting
    success.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Many animals are believed to hear when spoken about, even from far away.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Red and black bears are feared because disrespectful speech about them is
    said to make them watch for and kill the speaker when he next enters the mountains.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A hunter going after bears speaks of them respectfully and says he is going
    for another animal in order to deceive them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A reindeer-hunting guide reproved the narrator for speaking aloud about the
    chance of securing deer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The beaver is said to know human intentions, understand speech, and lift its
    tail when addressed by a hunter.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Hunters must carefully treat dead animal bodies so that the animals' shades
    are not offended and do not bring bad luck or death.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: For four days after a white whale is killed or taken from a net, those involved
    may not work because the shade remains with the body during that period.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: During the four-day period, the village must avoid sharp or pointed instruments
    and loud noise so the invisible whale shade is not wounded, frightened, or offended.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Cutting a white whale's body with an iron ax is said to cause death; iron
    instruments are also restricted, and wood must not be cut with an iron ax during
    the whale-hunting season.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Dogs are considered unclean and offensive to the shades of game animals; if
    a dog touches white whale bones, the hunter may lose hunting luck.
  category: relationship
  evidence_refs:
  - ev:11
