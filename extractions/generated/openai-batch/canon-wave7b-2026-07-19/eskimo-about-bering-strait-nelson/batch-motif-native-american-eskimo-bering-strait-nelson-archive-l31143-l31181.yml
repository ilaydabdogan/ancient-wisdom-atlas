canonical_text:
  quote: "“the ten dolls had become transformed into ten people”"
  summary: The passage gives two origin accounts. In one, a man and woman descend
    from the sky to Big Diomede; after remaining childless, the man makes five ivory
    and five wooden images that become ten people, ancestors of the islanders. In
    another, the first East Cape Eskimo are a man and woman who arrive by kayak from
    St Lawrence Island; their kayaks turn to stone, and from the pair come the Siberian
    Eskimo. A final note says another mutually unintelligible people once lived there
    but later left.
  language: English
  quote_policy: quoted
