  quote: ''
  summary: An ethnographic description of dolls from the Bering Strait region explains
    how female- and male-representing dolls are marked with etched facial details,
    tattooing, labrets, hair, beads, jewelry, and ivory inlays. It also describes
    a Point Hope wooden doll with a cord-operated turning head and an Unalaklit ivory
    doll representing a woman holding a child, with similar dolls showing a child
    in the hood of a woman's fur coat.
