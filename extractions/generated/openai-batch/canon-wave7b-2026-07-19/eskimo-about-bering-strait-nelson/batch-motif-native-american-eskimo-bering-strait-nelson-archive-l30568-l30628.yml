canonical_text:
  quote: ''
  summary: Chun-uh'-luk, described in relation to a former Owl state, survives along
    the shore by making a grass mantle, killing and skinning reindeer, producing fire
    from stones, making skin clothing, building a driftwood hut, killing a bear, making
    a bear-fat lamp, hanging a bearskin in the doorway, and then leaving out of loneliness
    to seek people, finding kayaks and hunting gear.
  language: English
  quote_policy: summarized
