canonical_text:
  quote: ''
  summary: 'The passage gives a technical ethnographic description of sleds around
    Bering Strait: an unshod or shoed runner practice; a Plover Bay/St Lawrence Island
    style modeled after Chukchi sleds; its driftwood runners, horn bows, lashings,
    wooden shoes, load fastening, and hauling attachments; its use with dogs or reindeer
    by different groups; and a smaller St Lawrence Island sled used to transport meat
    and blubber from a kill site to a village.'
