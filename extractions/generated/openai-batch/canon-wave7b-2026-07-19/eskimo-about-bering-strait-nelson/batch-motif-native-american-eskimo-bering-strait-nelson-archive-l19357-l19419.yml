canonical_text:
  quote: ''
  summary: 'The passage describes post-death mourning practices: a three-day period
    of vulnerability and hardening, actions to drive away or deter the dead person''s
    shade or spirit, cleansing by bathing in urine, and lower Yukon customs for rapid
    removal, contracted tying, grave-box burial, and placement of skins, coverings,
    and tools with the corpse.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the first day after a death, people near the village are described
    as soft and nerveless; by the second and third days they become harder as the
    body freezes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the evening of the second day, men in each house turn urine buckets upside
    down and thrust the bottoms into corners, the smokehole, and the doorway.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated purpose of the inverted-bucket action is to drive out the shade
    if it is in the house; the day is called “the bottom day.”
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before sleeping, each man bends a grass stem and places both ends in the ground
    in the middle of the doorway so that the spirit will fear it as a snare and go
    away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the third morning, before eating, every man, woman, and child bathes in
    urine; this is said to cleanse evil and make the flesh firm against the shade’s
    influence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the lower Yukon, people are described as averse to keeping a dead body
    in the house and place the corpse in a grave box as soon as possible.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Relatives may dress a dying person in new burial clothing so that the body
    can be removed immediately after death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After death, the body is put into a contracted sitting posture, tied with
    cords, drawn up through the smokehole, and carried to the graveyard.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the grave box is ready, the body is placed on a deerskin bed, covered
    with other deerskins or cloth, and the deceased’s small tools are placed in the
    box.
  category: action
  evidence_refs:
  - ev:7
