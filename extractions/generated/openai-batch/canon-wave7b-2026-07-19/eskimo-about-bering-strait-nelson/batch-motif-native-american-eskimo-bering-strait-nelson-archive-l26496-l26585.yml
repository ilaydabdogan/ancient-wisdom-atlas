canonical_text:
  quote: ''
  summary: The passage describes hunting masks, carved whale models, kayak fetiches,
    weasel mummies, bladders, retained fragments, and small food and water offerings
    as objects or acts connected with hunting success, control or propitiation of
    animal shades, retention of spiritual essence, and offerings to shades of upper
    and lower worlds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Point Barrow, human-face masks mounted on crescentic boards with small
    wooden right-whale models were said to be used in whale hunting, and owners refused
    to sell some of them because selling would bring bad luck.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young Malemut white-whale hunter had a wooden image inside his kayak; it
    had a semihuman face, ivory tusks and teeth, an abdominal mouth-like slit with
    ivory teeth, and held a small wooden white-whale figure.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The owner of the kayak image said he would die if he parted with it, then
    hid it ashore after it was returned to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hunting images and fetiches are described as being supposed to watch for game
    at a distance, guide hunters to game, guide spears straight, and sometimes bring
    game to the hunter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dried bodies of common weasels were worn on belts or carried in pouches by
    boys and young men and were believed to give their owners agility and hunting
    prowess.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that possession of an animal or child mummy is believed
    to give the possessor power over its shade, which becomes the possessor's servant.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hunters are described as keeping the shades of killed sea animals with their
    bladders and, after ceremonies and offerings, dismissing them back to the sea
    to reenter other animals of their kind and return to be killed again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When selling furs, seals, or garments, people are described as cutting off
    or swallowing small parts and retaining fragments in order to keep the essence
    or spirit of the whole article and obtain another of the same kind.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Small particles of food and a little water from feast distributions are said
    to convey the essence of the whole amount to shades.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: During Bladder festivals south of the lower Yukon, small amounts of food and
    water were cast to the floor and up against the roof as offerings to shades of
    the lower and upper worlds.
  category: action
  evidence_refs:
  - ev:8
