canonical_text:
  quote: ''
  summary: The passage describes Unalit numeration, including the use of words for
    numerals, counting fingers and toes, derivations of number terms from body parts,
    the expression of twenty as a completed man, later multiples of twenty as sets
    of animal paws, and four hundred as twenty sets of man's paws.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some people count to twenty in a single numeral series, while others reach
    twenty by four series of numbers from one to five.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The terms it-khakh'-tok and giikh'-tok are commonly used in counting fingers
    and toes and are also used for other objects in a transitional way toward regular
    numeral use.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The word ai'-pa can replace the usual term for two and means second or a pair;
    it is also used for one member of a pair, such as a close friend.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The term for ten is derived from a word referring to the upper half or upper
    part of the body, or to the count of the fingers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The term for twenty is derived from the word for man and is glossed as a completed
    man.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: When a person reaches twenty in counting, he may say that the man is finished;
    if asked how many fingers and toes he has counted, he replies with the word for
    twenty.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: At forty, the naming of twenties changes to terms built from cardinal numbers
    and a word for sets of animal legs and paws with toes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Four hundred combines the idea of a man with that of the animal and is analyzed
