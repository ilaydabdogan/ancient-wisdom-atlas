canonical_text:
  quote: ''
  summary: 'The passage describes several Eskimo methods for capturing ptarmigan and
    other birds: winter sinew snares and brush fences, spring decoys that exploit
    male ptarmigan territorial behavior, fine-meshed sinew nets with wooden spreaders,
    a snow-and-moss bird decoy observed near the Yukon mouth, and communal capture
    of migrating ptarmigan with salmon nets at dusk.'
  language: English
