canonical_text:
  quote: ''
  summary: Chuu-uh'-luk follows a path to a hilltop house, cautiously enters, and
    is welcomed as a brother by the armed householder. The two men describe unknown
    parentage and solitary lives. The householder shows one storehouse filled with
    furs and food and another containing dead people whom he says he killed in revenge
    for his parents. The brothers live together, with the householder hunting and
    Chuu-uh'-luk cooking. Chuu-uh'-luk later follows him to hunt, kills two reindeer
    with his hands, and carries them home. The householder becomes jealous, angry,
    and fearful, and both brothers spend the night watching one another for treachery.
  language: English
  quote_policy: summarized
