canonical_text:
  quote: ''
  summary: A group of sibling strangers at Uii-a'-shuk defeats two attacking fleets.
    In the second attack an old woman uses human bones and a spoken formula to kill
    two brothers; Ak'-chik-chu'-guk seizes her implements, kills the enemies by the
    same means, and restores his brothers. The villagers ask the siblings to leave
    and tell them to build a fire when their home village comes into sight. On the
    return journey Ak'-chik-chu'-guk refuses the instruction, and the sister, dog,
    towline, boat, and occupants turn to stone, becoming a rocky ledge, reef, and
    stony shore figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The youngest brother enters the kashim and reports that the sea is covered
    with umiaks whose paddle flashes look like falling raindrops in sunlight.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The villagers say the umiaks are from a neighboring place and that the men
    intend to kill the strangers, not the people of Uii-a'-shuk.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ak'-chik-chu'-guk tells the villagers to stay inside their houses and sends
    his brothers out to meet the enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the first battle the umiak men fail to kill or wound the brothers, while
    the brothers kill many attackers and spare one man to carry news home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A second, larger fleet arrives, identified by the villagers as friends and
    relatives of the slain men coming for blood revenge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The armed revenge warriors enter the kashim in great numbers, and two extremely
    old women enter carrying small grass baskets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: One old woman sets a finger bone before the youngest brother, strikes it with
    a human rib, says that he is dead, and the young man falls dead; she repeats the
    act with another brother, who also falls dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ak'-chik-chu'-guk cries out, seizes the old woman, crushes her hands, scatters
    finger bones from her basket, strikes them with the rib, repeats the death formula,
    and the enemies fall dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ak'-chik-chu'-guk exercises magic power and restores his brothers to life;
    the villagers then fear the number of deaths and ask the brothers to leave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Before the siblings depart with their sister, the villagers tell them to stop
    and build a large fire on the beach when their native village comes into sight.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: On the return journey the sister walks along the shore with a dog, towing
    the boat with a walrus-hide line; when home appears, she remembers the fire instruction
    and reminds her brothers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Ak'-chik-chu'-guk refuses to stop for the fire because he wishes to hurry
    home.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The sister's feet become heavy, she says they feel as if they are becoming
    stone, and she changes into stone from head to foot.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The dog, towline, boat, and boat occupants also become stone, leaving a rocky
    ledge, reef, and stony figures by the shore.
  category: sequence
  evidence_refs:
  - ev:8
