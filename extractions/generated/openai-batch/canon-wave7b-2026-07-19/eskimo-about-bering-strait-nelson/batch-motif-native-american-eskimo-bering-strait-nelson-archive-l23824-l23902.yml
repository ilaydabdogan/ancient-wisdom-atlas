canonical_text:
  quote: ''
  summary: 'A bladder-feast sequence is described: a wild-parsnip brush is made into
    a torch, a shaman performs noises at openings of the kashim, hunters carry animal
    bladders on spearshafts in a nighttime procession to a pond, open and immerse
    the bladders through a hole in the ice, and return. The following day includes
    paddle and stick rites, work and noise prohibitions to avoid offending animal
    shades, a dance, and the binding and lowering of the head shaman below the floor
    while a cord attached to him moves as if something travels away beneath the floor.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Remaining wild-parsnip stalks in the room were tied into a large bundle and
    fastened to the top of a stake like a broom or brush.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaman went onto the roof, put his head repeatedly at each corner of the
    smoke hole, and made a grunting noise like a young puppy; another person repeated
    the noise over the entrance hole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Spearshafts with bladders fastened to them were passed up through the smoke
    hole, and the owners went outside and ran with the shafts bearing their bladders.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The parsnip bundle on the stake was lit as a large torch, which the chief
    shaman carried on his shoulder while running across the snow, followed by men
    holding bladders aloft and by women, children, and old men making an uproar.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The procession reached a small pond where a square hole had been cut through
    the ice, and the shaman planted the torch upright nearby.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hunters stood by the ice hole and ripped open the bladders with a detached
    spearpoint.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hunters marched several times around the ice hole, dipping the paddle
    blade points and collapsed bladders in the water at the corners of the hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The hunters put the bladders one at a time into the water under the ice, where
    they remained, ending the ceremony before the return to the village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Soon after daybreak four men with paddles entered, moved corner to corner,
    marched around the room without paddle motions, and were greeted by a shout or
    groaning noises.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A bundle of small sticks represented hunters; one seated man passed the sticks
    singly from hand to hand while another rolled over on the floor.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: All work was prohibited in the village that day, with the explanation that
    working would cause deaths because it would offend the shades of the animals.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: When sudden noises occurred in the kashim, the men present imitated eider-duck
    notes so the shades of seals and other animals would attribute the noise to birds
    rather than people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the afternoon, men performed a drum-and-song dance with leaping and jumping
    movements like those previously described in the dance to the bladders.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: That evening the head shaman, stripped and hooded, was bound with rawhide
    cords and a noose, carried down through the floor hole into the pit, bound more
    tightly, and connected to a cord that moved as if something were traveling away
    below the floor.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
