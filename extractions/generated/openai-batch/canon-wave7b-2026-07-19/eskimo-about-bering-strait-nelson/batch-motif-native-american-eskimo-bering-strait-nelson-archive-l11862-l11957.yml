canonical_text:
  quote: ''
  summary: The passage describes fish traps, nets, floats, and seining methods used
    in several Bering Strait and Arctic coastal localities. It details construction
    of conical fish traps, seasonal trapping and freezing of fish, low-tide gathering
    by women, gill-net setup with bird-shaped marker floats, and cooperative seining
    on Kotzebue Sound.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fish trap is described as a cone-shaped basket made from spruce splints,
    spruce-root or rawhide lashings, and a conical mouthpiece fitted into the larger
    end.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Traps of this kind are used to take large quantities of blackfish in the low
    country between the Yukon and Kuskokwim rivers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the salmon season, fish trapping on the lower Yukon and nearby region
    occurs in autumn, around the time streams freeze, and fish are preserved by freezing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On Norton Sound, north gales in September and October produce very low tides,
    and women gather mussels, ascidians, and fish from exposed rocks and under large
    stones.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Gill nets are set on a line from shore, with the inner end fastened to a stone
    or stake and the outer end anchored with a stone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A wooden marker-float at the outer end of the net is commonly made in the
    form of a bird.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: An Ikogmut net float is shaped like a loon, has a long projecting neck, a
    cord hole, incised grooves for wings, and red-painted grooves with a greenish
    tint on the back.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Cape Blossom, a net owner sets a gill net by pushing the anchor stone outward
    with lashed poles; caught fish are indicated by the floats, and the net is then
    pulled in by hand.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: On Kotzebue Sound, a Malemut party uses a seine about 60 feet long, fitted
    with wooden floats, stone sinkers, stakes, poles, and rawhide lines.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Kotzebue seine is drawn along the beach by coordinated workers, producing
    large hauls when fish are running.
  category: action
  evidence_refs:
  - ev:8
