canonical_text:
  quote: ''
  summary: The passage catalogs decorated women’s housewives and their fastening rods
    from several locations around the lower Yukon, Nunivak Island, Big Lake, Cape
    Nome, Cape Vancouver, Chalitmut, and related Bering Strait-area sites. It describes
    materials, colors, stitching, beads, skin borders, and many fastening-rod forms,
    including animal-shaped, human-faced, totem-marked, double, grooved, and multi-use
    rods.
  language: English
