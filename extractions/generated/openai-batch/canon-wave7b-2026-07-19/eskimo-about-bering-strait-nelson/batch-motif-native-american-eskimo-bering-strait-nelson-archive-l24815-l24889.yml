canonical_text:
  quote: ''
  summary: The passage gives descriptive catalog entries for masks. One mask has asymmetrical
    grotesque facial features, attachments, feathers, red and black-white coloring,
    and blood-like splashes near the mouth; it is said to represent the features of
    a tunglia~k. A second flat oval mask from south of the lower Yukon represents
    a salmon and includes attached or carved images of a hair seal, a kaiak formerly
    bearing a man image, small salmon, and a semihuman face on the fish's back identified
    as the inua of the fish.
  language: English
  quote_policy: summarized
