  quote: '"We have always done so."'
  summary: The passage describes blood revenge as a sacred kin duty, including a puberty-triggered
    example of a son killing his father's murderer. It also describes public shaming
    and limited punishment for theft within the village, different standards for theft
    from outsiders, community-oriented customary morality, distrust in dealings with
    white men, and reliable repayment of trading-station credit.
  language: English
