literal_observations:
- id: obs:1
  text: An Eskimo man from near Kotzebue Sound came to St Michael in midwinter with
    a mink skin to settle a debt to a trader from the previous year, even though the
    trader could not have enforced payment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator says that some people who exerted themselves to settle debts
    with a trader might also steal from the same trader.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Within the community, a borrower who failed to return an article was not generally
    held to account, because a lender was understood to possess more than needed.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator's interpreter said he could not ask for the return of a loaned
    old pistol and had to wait for the borrower to bring it back voluntarily.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Begging is described as common chiefly among Eskimo who had considerable intercourse
    with white men, while people not accustomed to meeting white men were described
    as little addicted to begging.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: Hospitality is described as a duty toward friends from surrounding villages,
    certain strangers, and guests at festivals.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:7
  text: The passage says hospitality helps retain goodwill and protects hosts from
    evil influence that might otherwise be directed against them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Strangers are described as usually viewed with suspicion, and in ancient times
    commonly put to death.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Sledge Island, despite destitution and starvation of dogs, the headman
    and villagers urged the visitors to remain for two nights and promised to find
    food for the visitors' dogs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The headman gathered food from villagers, and women brought small fragments
    of seal meat, blubber, and fish; the visitors were lodged in the best house and
    the crowd was sent away when the visitors wanted to sleep.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: King Islanders came south because food at home was exhausted and intimidated
    more peaceable villagers into supplying them with food.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: After a knife was stolen from the narrator's box of trading goods, the headman
    sent out a small boy who returned with the knife, and the passage says everyone
