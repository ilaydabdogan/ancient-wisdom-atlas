canonical_text:
  quote: ''
  summary: 'The passage describes several games and toys from St Michael, the Lower
    Yukon, and Cape Nome: a jackstraws-like stick game, a ring-toss game involving
    prizes and exchange, a top-spinning race in the kashim, and dart-throwing games
    using targets, counters, prizes, and specialized darts.'
  language: English
  quote_policy: summarized
