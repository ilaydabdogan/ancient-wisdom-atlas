canonical_text:
  quote: ''
  summary: The passage describes preliminary and great feasts for the dead at Bazbinsky/Razbinsky
    on the lower Yukon. It states that shades are provided with food and property,
    that women conduct a preliminary feast with distribution of food and presents,
    an invitation song, and a slow dance, and that a later great festival is conducted
    by men with invited guests from surrounding villages. The witnessed festival begins
    in a crowded kashim with drummers, singers, welcoming songs, and the arrival of
    a guest from Kuskokwim river.
