canonical_text:
  quote: ''
  summary: 'Ethnographic passage recounting several episodes: a Malemut man is killed
    by a companion to prevent his revenge from provoking collective retaliation among
    Kuskokwim hosts; self-constituted headmen are described as ruling through fear
    while maintaining followers with food, clothing, and useful alliances; a Point
    Hope chief terrorizes villagers, carries a rifle, controls trading behavior, and
    responds to photography by making the photographer pose in return; a Norton Sound
    murderer ambushes sleeping hunters, kills three, cripples one survivor, and remains
    unavenged in the same village.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Malemut travelers range widely and are prudent about avoiding
    trouble while away from home.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Malemut man camping near a Kuskokwim village became enraged at a Kuskokwim
    man and went to obtain a weapon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two Malemut companions followed the enraged man, tried to dissuade him, and
    took him by the arms while continuing to argue against his plan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the enraged man would not listen, the companion on his right drew a long
    sheath knife, cut him in the abdomen, and the man died shortly afterward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The killer later said he would not have interfered among their own people,
    but that among the Kuskokwim their whole small party might have been killed if
    the companion had killed a local man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage describes some men of courage and ability gathering followers,
    ruling through fear, and confirming power by killing opponents.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Such leaders are said to keep followers friendly by supplying food during
    scarcity, giving clothing at festivals, and seeking white men's goodwill when
    useful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Point Hope, a chief who had killed four men had the village terrorized,
    and some villagers asked the captain of the Corwin to carry him away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Point Hope chief was said to always carry a rifle and was seen influencing
    villagers' acceptance of trade offers on the Corwin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Point Hope chief became nervous about being photographed, then made the
    photographer stand in the same position, looked at the image on the camera glass,
    and appeared pleased.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A Norton Sound hunting party camped in the mountains and slept side by side
    using a spruce log as a pillow.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: A man with enmity against one hunter followed the party, shot through the
    aligned heads of three sleepers, and beat the fourth with the gun.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The beaten hunter crawled back to the village, recovered after a long illness
    but remained crippled, and no one avenged the three killed men; the murderer and
    survivor lived in the same village for years.
  category: sequence
  evidence_refs:
  - ev:7
