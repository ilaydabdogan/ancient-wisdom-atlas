  quote: ''
  summary: 'The passage describes kashim and house forms around Bering Strait: a small
    low kashim with a water-filled central depression, fire pit, two lamps on carved
    human-face supports, regional variation in houses, crowded habitation at Tup-hanikwa,
    plank-floored houses at Atnuk and Nubviukhchugaluk, and the village and house
    layout at Ignituk near Cape Darby.'
