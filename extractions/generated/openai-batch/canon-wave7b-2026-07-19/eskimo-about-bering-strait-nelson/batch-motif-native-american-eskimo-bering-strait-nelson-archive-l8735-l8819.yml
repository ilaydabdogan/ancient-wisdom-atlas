canonical_text:
  quote: ''
  summary: 'The passage describes practical bird-catching and egg-gathering methods
    used in Norton Sound, Bering Strait, St Lawrence Island, Cape Thompson, and neighboring
    regions: baited throat barbs for gulls, cliff descent with seal nets for eggs,
    scoop nets for nesting murres and auklets, stuffed-skin decoys with snares, running-noose
    snares for ducks and wild fowl, and ordinary or compound slings/bolas with varied
    weights and animal markings.'
  language: English
  quote_policy: summarized
