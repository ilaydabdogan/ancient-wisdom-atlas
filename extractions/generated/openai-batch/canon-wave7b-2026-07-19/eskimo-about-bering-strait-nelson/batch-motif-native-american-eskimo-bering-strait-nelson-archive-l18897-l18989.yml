canonical_text:
  quote: ''
  summary: The passage reports episodes involving a feared headman, coercion, killing,
    retaliatory killing, fear of blood revenge, an arrested killer's plea to spare
    his brother, descriptions of leadership status and social terms, and rules for
    property, grave goods, inheritance, and support of a dead man's family among groups
    around Bering Strait and Norton Sound.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed headman made summer trading voyages by umiak to Bering Strait and
    winter sledge journeys, traveled with hangers-on, and was feared by people he
    visited.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When short of an oarsman, the headman seized a woman from Uualaklit and forced
    her aboard his umiak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The woman's crippled husband tried to detain her at the shore; the headman
    killed him with a knife, left the body, and made the trip while the wife served
    at the oar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the headman threatened his brother-in-law, the brother-in-law entered
    the headman's house at night and killed him with an ax while he slept.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The headman's grown son woke at the blow and was also struck down by his uncle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the killings, people in surrounding villages felt relieved, while the
    killer feared that relatives of the dead man might take blood revenge.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: A nephew, named Kuii'-u-gan in the passage, killed a fur trader on the Kuskokwim
    River and was arrested at St Michael; because his younger brother had been implicated,
    he repeatedly asked the arresting men to kill him but not hurt his brother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The arrested man was sent to San Francisco, sentenced to five years' imprisonment,
    and was reported to have become an industrious workman favored by prison officials.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Men aspiring to leadership tried to put themselves nearly on an equal footing
    with white men and became angry if they were not treated with greater consideration
    than others.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: From Bering Strait northward, a rich man was called an umiak owner; during
    intertribal war, the best warrior planned attacks but had no fixed authority over
    the independent fighters.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage gives terms for a person born in another village, a stranger or
    strange object, and a same-clan relative.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Among the Unalit, with exceptions not included here, whatever a man makes
    or obtains by hunting is his own.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: When a man dies, some implements and articles are placed by his grave, and
    the remainder are divided among children and other relatives; the wife often distributes
    them soon after death, but greedy blood relatives may divide them and leave little
    for the family.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Hunting implements usually pass to sons, ornaments and household articles
    to wife and daughters, and the youngest son receives the most valuable things,
    heirlooms, and the father's rifle, though an elder brother may use the rifle until
    the youngest can use it.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: When a man dies, his sons support the family if old enough; otherwise relatives
    care for them.
  category: relationship
  evidence_refs:
  - ev:9
