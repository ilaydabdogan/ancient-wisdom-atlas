  summary: The passage describes drum-frame construction and handle attachment among
    Eskimo groups around Bering Strait, including ordinary sinew or rawhide fastening,
    a northern coastal variant with an ivory splice and wooden pegs, handle notches
    and lashings, examples from Sledge Island and Cape Wankarem, common handle materials,
    and one Shaktolik walrus-ivory handle example.
