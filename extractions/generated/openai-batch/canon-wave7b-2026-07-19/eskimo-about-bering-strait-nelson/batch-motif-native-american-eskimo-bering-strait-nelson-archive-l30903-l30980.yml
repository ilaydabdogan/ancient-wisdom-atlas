    notices that the dish is held by two hands when pushed inside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The husband says he came from Unalaklit and was driven far from shore in his
    kayak by a storm before losing consciousness and reaching the same shore where
    the woman was cast.
  category: speech
  evidence_refs:
