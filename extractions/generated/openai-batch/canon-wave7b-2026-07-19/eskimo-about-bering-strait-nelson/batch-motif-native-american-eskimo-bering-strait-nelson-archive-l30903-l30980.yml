- id: obs:2
  text: The boy she brought with her becomes a youth; his foster father makes him
    a bow and arrows, after which he hunts birds and accompanies the foster father
    hunting.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The youth kills two hares; the passage states that the hares, like the animals
    and birds in that country, are coal black.
  category: attribute
  evidence_refs:
