canonical_text:
  quote: ''
  summary: A woman lives in the land of darkness, where her boy grows into a hunter.
    Her husband explains that he too was carried there by a sea storm and has since
    been fed and helped by an inua that usually takes the form of a large jellyfish.
    He shows her rooms of furs, tells her to take ear tips and beads, and sends her
    home with her boy by closing her eyes and taking four steps. She returns to bright
    sunlight and her old home; the ear tips later become full-size skins, and her
    son gains wealth and becomes a headman after she disappears.
  language: English
  quote_policy: summarized
