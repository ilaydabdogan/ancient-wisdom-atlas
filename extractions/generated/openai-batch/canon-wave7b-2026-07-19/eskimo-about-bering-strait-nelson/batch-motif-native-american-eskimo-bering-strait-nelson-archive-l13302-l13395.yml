- id: obs:3
  text: When more than three dogs are used, they are attached to the main leading
    line in pairs, with the most intelligent dog placed in front as leader.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For very heavy loads or when there are too many dogs for one team, additional
    dogs may be attached to forward stanchions on one or both sides of the sled.
  category: action
  evidence_refs:
  - ev:2
