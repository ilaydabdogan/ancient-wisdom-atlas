canonical_text:
  quote: ''
  summary: The passage describes the annual bladder feast at St Michael as a multi-day
    winter ritual timed by the moon. Men clean the kashim, villagers sing to wild
    parsnip, parsnip stalks are gathered and used in sheaves, charcoal, and torches,
    hunters bring and handle inflated animal bladders, offerings and water are placed
    before them, fire and smoke are applied, spear points are dipped in sea water,
    and the bladders are finally thrust through a hole under the sea ice while the
    community sings welcome to guests.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bladder feast is described as an annual event at St Michael, beginning
    between December 10 and 20, with the exact date depending on the moon phase.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the first day, men thoroughly clean the kashim, including the fire-pit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After dark on the first day, the village gathers on the kashim roof while
    an old man beats a drum and the people sing to wild parsnip stalks on distant
    hillsides.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the second day, four men gather wild parsnip stalks, place them outside
    the kashim entrance, bring them inside in the evening, and later the stalks are
    dried and formed into a large sheaf.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Little boys roll over and wrestle on the parsnip bundles before the stalks
    are opened and spread on the floor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the third day, a smaller parsnip sheaf is fixed on a stake in the floor
    in front of the oil lamp at the rear of the room.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each hunter brings inflated bladders of seals, whales, walrus, and white bears
    killed during the year, ties them in bunches, and hangs them on seal spears at
    the back of the room.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Small food fragments are thrown on the floor before the bladders, a water
    libation is made there, and then everyone eats.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the fourth day, hunters mark each bladder with bands and dots of paint
    made from charcoal and oil, with the charcoal usually made from wild parsnip stalks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Young men make torches from parsnip stalks and wave the flaming torches around
    the bladders so that the bladders are lightly exposed to fire and smoke.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: During the torch performance, young men and boys catch one another and force
    each person backward through the hole in the middle of the floor in a good-natured
    struggle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: On the fifth day, men remain in the kashim, no work is permitted in the village,
    and all wait for the full moon; on the first night of the waning moon the bladders
    are bundled and hung on a line.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Men make a hole in the sea ice before the village, then hunters dip spear
    points into the water, return to the kashim, stir their bladders with the spear
    points, and strike the parsnip bundle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: After the spear-and-water ceremony, hunters sing a welcome to guests while
    other villagers enter one after another and perform a short dance.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: At sunrise on the sixth day, men carry spears with bladders to the ice hole,
    kneel, tear the bladders from the spears, and thrust them one by one through the
    hole under the ice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: While the men return, old men bring the parsnip bundle from the kashim, place
    it on the sea ice, build a small driftwood fire, and the population sings welcome
    to guests.
  category: action
  evidence_refs:
  - ev:8
