canonical_text:
  quote: ''
  summary: The passage describes observed trading voyages and exchange practices around
    Bering Strait and the Alaskan Arctic coast. Umiaks arrive at St Michael and other
    coastal points carrying people, dogs, possessions, skins, hides, dried fish, oil,
    and other trade goods. Chukchi travel from Siberia by dog sled and umiak to reach
    open water and cross to the American side. Other scenes describe slow bargaining,
    a large Hotham Inlet trading camp with conical lodges and a schooner, coastal
    exchanges involving animal products and manufactured goods, and umiaks traveling
    toward or returning from trading destinations.
  language: English
