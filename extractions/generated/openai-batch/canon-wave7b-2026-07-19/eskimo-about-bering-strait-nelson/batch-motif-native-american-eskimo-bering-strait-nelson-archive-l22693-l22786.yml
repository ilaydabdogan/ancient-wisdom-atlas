canonical_text:
  quote: ''
  summary: 'The passage describes part of a mortuary feast in a kashim: seal-oil lamps
    are kept burning to light the road for shades from the land of the dead; feast
    givers enter humbly with old clothing and offerings, later change into fine garments
    and ritual accessories; drummers and feast makers sing an invitation for dead
    kin to return and receive food.'
  language: English
  quote_policy: summarized
