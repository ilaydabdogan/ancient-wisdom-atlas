canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Bering Strait bladder-feast observances:
    singing and drumming in the kashim, wild-parsnip stalk offerings where animal
    bladders are absent, taboos on work, iron tools, noise, and sexual contact, and
    the belief that slain animals'' shades or inuas remain in preserved bladders,
    are propitiated, returned under the ice to the water and sea, and reincarnated
    in unborn animals.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In December 1878 at Chifukhlugumut near the Yukon, people were celebrating
    the bladder feast inside the kashim with singing and three drums.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The songs were described as slow isougs about ancient wars and exploits of
    the singers' fathers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The kashim decorations consisted of wild-parsnip stalks fastened at the rear
    and along the side walls like screens.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Because the inland village had killed no seals or walrus and had no bladders
    to put in water, wild-parsnip stalks were placed in the kashim as offerings and
    later laid on a frozen river until spring ice carried them away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the festival no work was permitted; iron axes were tabooed, substitute
    bone or walrus-tusk tools could be used if necessary, and loud noises were forbidden.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At a Yukon village near Andreivsky in January 1881, the narrator observed
    the final dance at the close of a bladder feast held later than usual.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The bladders used in the festival were said to contain the shades or inuas
    of slain animals.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: After killing an animal, the hunter carefully removed and preserved the bladder,
    then inflated it and hung it in the kashim for the festival.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The feast was said to please, amuse, and propitiate the animal shades before
    the bladders were opened and pushed through a hole in the ice into the water.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The shade was supposed to swim out to sea, enter unborn animals of its own
    kind, become reincarnated, and make game more plentiful.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: If treated well by the hunter, the shade in its new form was said not to fear
    that hunter and to allow itself to be approached and killed again.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: St Michael Eskimo informants cited a seal killed with the same mark previously
    placed on a bladder as evidence for the reincarnation belief; hunters marked bladders
    with red or black personal or totem signs.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Aromatic smoke and red flames from resinous wild-parsnip stalks were thought
    to please animal shades and drive away uncleanness and unfavorable influence.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: During the festival men and large boys slept in the kashim, remained apart
    from women, avoided houses for fear of becoming unclean, and bathed twice daily.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Females who had reached puberty were not permitted near or under the hanging
    bladders, while immature girls were allowed to go around them freely.
  category: relationship
  evidence_refs:
  - ev:12
