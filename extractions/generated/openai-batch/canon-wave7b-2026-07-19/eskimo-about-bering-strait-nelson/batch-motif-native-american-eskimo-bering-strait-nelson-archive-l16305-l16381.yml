    with drilling or calico over the skins.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Behind the lodges were stakes where each family tied its dogs so that the
    dogs were just out of reach of each other.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The camp is identified as a summer trading camp and is said to have contained
    six to eight hundred persons.
  category: attribute
  evidence_refs:
  - ev:6
