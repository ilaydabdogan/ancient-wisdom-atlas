literal_observations:
- id: obs:1
  text: At Hotham Inlet near the head of Kotzebue Sound, on July 15, a large gathering
    of people from the Kowak and Noatak Rivers was observed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people lived in a row of conical lodges extending for more than a mile
    along a low sandy spit parallel to the shore.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The camp was arranged in parallel lines: umiaks along the beach, kaiaks about
    seventy-five yards behind them, and lodges about fifty yards behind the kaiaks.'
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
- id: obs:4
  text: Between sixty and seventy umiaks were set above high-water mark with sterns
    toward the sea, bottoms upward, and orientation toward the prevailing wind.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: More than two hundred kaiaks were supported on low trestles, with spears,
    paddles, and other equipment placed below each boat.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The kaiaks were described as long and slender, of a pattern common at Kotzebue
    Sound, and were ranged parallel to each other pointing toward the sea.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The conical lodges were framed by slender poles set in a circle, with upper
    ends meeting and held by a wooden hoop lashed to the poles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The lodge frames were about ten feet high and twelve to fifteen feet in base
