  summary: The passage describes several forms of women’s knives used by Eskimo women
    for skinning and cutting game and fish. It lists examples made from slate, fine-grain
    stone, iron, wood, ivory, rawhide cord, sealskin lashing, and wooden sheaths,
    with specimens from Kazbiusky, Kushunuk, the lower Yukon, St Michael, Kofungunugumut,
    Sifugunugumut, and St Lawrence island.
