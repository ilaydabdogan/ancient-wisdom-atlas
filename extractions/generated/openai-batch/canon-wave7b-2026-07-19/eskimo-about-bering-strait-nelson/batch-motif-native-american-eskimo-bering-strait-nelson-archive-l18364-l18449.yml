  summary: The passage recounts an attempted theft by a King Island man, the narrator's
    expulsion of him, and a village headman's night watch that prevents the man from
    reentering. It then describes varied receptions of travelers, with repeated examples
    of hospitality through invitations indoors, food offerings, assistance with sledges
    and bedding, and sharing tea or food with guests and callers.
