canonical_text:
  quote: ''
  summary: Ethnographic account of warfare among lower Yukon, Pastolik, Magemut, and
    neighboring groups, including an origin story for the war, battle practices, first-kill
    bravery rites, truces, neutrality signs, and treatment of captives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The account is attributed to an old man living near Audreivsky and was given
    in January 1881.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lower Yukon and Pastolik people fought against people of the southern
    Yukon delta, Big lake, the Kuslevak mountains, and the Magemut of the coast south
    of the Yukon mouth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The main war is said to have begun near Ikogmut when one boy accidentally
    pierced another boy's eye while playing with a bone-tip dart.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The injured boy's father destroyed both eyes of the other boy, after which
    the two fathers fought with a beaver-tooth knife and a bone bodkin and both died.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Relatives and friends took up the quarrel, the village divided, the weaker
    party left the Yukon and settled southward, and continual warfare followed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Battles usually took place in summer; victors killed males of the opposing
    side, including infants, left the dead in heaps, and commonly spared females but
    took them as slaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Young men in their first battle were given blood to drink and a small piece
    of the heart of their first killed enemy to eat in order to make them brave; a
    similar former Unalit practice at St Michael is also reported for young warriors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: During battles, the best fighters sometimes threw themselves on their backs
    and kicked their heels in the air to deride the approaching enemy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Men who had used all their arrows could stand before comrades and break incoming
    enemy arrows with spear shafts; shields were not used.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A fur coat waved on a stick served as a sign of truce, during which both sides
    rested, ate, or slept while guards watched against surprise.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A surrounded warrior without arrows might evade death by dodging and leaping,
    but could finally be killed with a warclub bearing a sharp bone or ivory spur;
    defeated parties were pursued and, if possible, exterminated.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Magemut are said to have been stronger in battle than the Yukon men; neither
    side had a recognized chief, though older men generally supervised expeditions.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: A man with relatives in the opposing party could blacken his face with charcoal,
    remain a noncombatant, and be respected as neutral by both sides, including during
    truce movement.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Magemut are said always to have carried off women after successful raids;
    the Yukon informant denied that his own people did this, though the narrator suspects
    partiality.
  category: speech
  evidence_refs:
  - ev:9
