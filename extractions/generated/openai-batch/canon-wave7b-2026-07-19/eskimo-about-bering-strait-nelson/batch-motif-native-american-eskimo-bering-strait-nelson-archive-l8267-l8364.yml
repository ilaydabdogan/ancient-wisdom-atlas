canonical_text:
  quote: ''
  summary: 'The passage describes practical trapping and netting methods used around
    Bering Strait and Norton Sound: bent-stick noose traps, wicker fish traps for
    fur-bearing animals, skin stretchers, steel traps, seasonal fur hunting, and multiple
    seal-netting methods, including autumn shore nets and winter under-ice nets at
    seal blowholes or along coastal passages.'
  language: English
  quote_policy: summarized
