  summary: The passage describes drag handles used with sealskin cord loops for hauling
    dead seals or other heavy loads over snow or ice. It catalogues examples made
    of wood, bone, ivory, or deerhorn from several Bering Strait localities, emphasizing
    cord holes, rings, links, pendants, and carvings of white bears, seals, white
    whales, whale tails, and animal heads.
