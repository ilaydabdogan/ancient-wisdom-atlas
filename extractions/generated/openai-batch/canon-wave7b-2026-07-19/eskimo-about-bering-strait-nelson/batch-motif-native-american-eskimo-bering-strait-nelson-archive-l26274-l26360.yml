canonical_text:
  quote: ''
  summary: The passage describes several shamanic weather and healing performances,
    a diagnostic practice using a cord and stick to test bodily weight, a shamanic
    prediction about an Arctic cruise, and an account of a Selawik shaman whose shade
    traveled to the land of the dead and returned through the Milky Way to revive
    his body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Sfugunugunmt a shaman wore a gut-skin shirt, was wrapped in a straw mat,
    squatted in the kashim, uttered cries, was surrounded by four men making lifting
    motions, and then predicted good weather after ventriloquial voices were heard.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: North of Cape Vancouver another shaman knelt inside the kashim entrance, rattled
    his gut-skin shirt with both hands beneath it, made cries and noises, received
    a replying voice from the passageway, and promised good weather.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Chalitmut two shamans worked over a feeble old man lying on a deerskin
    in the middle of the kashim while two men beat drums slowly at the sides of the
    room.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Chalitmut shamans wore gut-skin shirts, circled the old man with strutting
    movements, rattled their shirts, cried and hissed, knelt at his head and feet,
    and were followed by assistants making lifting and sliding hand motions before
    the old man was carried out.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In another village, a kashim entrance was closed by a straw mat and guarded
    by an old woman; inside, two naked shamans circled during incantations over a
    naked sick child lying in his mother's lap while villagers sat around the room.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Shamans south of the Yukon mouth diagnose illness by tying a cord attached
    to a stick to a patient's head or limb and lifting it; the weight of the body
    part indicates the disease and becomes lighter as the malady passes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator's interpreter refused to join an Arctic cruise because shamans
    had told him the party would never come back.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that one of the greatest feats attributed to shamans is
    visiting the land of the dead and returning, and that such accounts are heard
    in every district.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Selawik account, a shaman died and his shade traveled for two days
    along a hard beaten path formed by previous dead people while hearing earthly
    mourning.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The shaman's shade reached a great village like earthly villages and was met
    by the shades of two men, who led him into a house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Inside the house a fire burned, meat roasted on sharp sticks, living eyes
    in the meat watched the shaman, and his companions warned him not to eat the meat.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: After leaving the house, the shaman came to the Milky Way, followed it for
    a long distance, returned by it to his grave box, and came alive when his shade
    entered the box.
  category: sequence
  evidence_refs:
  - ev:10
