  quote: ''
  summary: The passage describes St. Lawrence Island village sites where inhabitants
    had died, then gives an ethnographic account of summer houses, winter houses,
    storehouses, house frames, coverings, interior pologs, and underground passageways
    built from whale bones, walrus skins, reindeer skins, driftwood, earth, stones,
    and other materials. It includes explicit comparisons to Plover Bay, Norton Sound,
    and the Siberian coast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Village sites are described with corpses on the surrounding tundra and deceased
    people still lying inside houses.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two villages at the southwestern end of St. Lawrence Island had walrus-skin
    summer houses and various winter houses.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The winter houses in the southwestern villages were framed with whale jawbones
    and ribs planted in the ground, arching inward to form an oval framework that
    supported a roof covered with earth.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The southwestern winter houses are described as small and rude because of
    scarce material, and as very similar to buildings on the northern shore of Norton
    Sound.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Elevated storehouses stood near the winter houses and were supported by four
    whale jawbones planted upright in the ground.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some summer-house frames used strips sawed from whale jaws and whale ribs
    bent toward an upright whale jawbone; a heavy hanging rock helped steady the shallowly
    planted frame.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The interiors of the summer houses measured about 20 feet in diameter and
    had reindeer-skin pologs suspended from the roof.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The exteriors of the summer houses were covered with walrus skins lashed on
    and held with stone, driftwood, and bone weights to resist frequent gales.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a large northern-shore village where all inhabitants had perished, the
    observer found similar summer houses and partly subterranean winter houses.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The northern-shore winter houses were roofed with whalebones and driftwood
    under earth and had a roofed, stockaded driftwood shelter over the outer end of
    the passageway.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: A square hole in the shelter floor gave access to an underground passageway
    2 or 3 feet high and 50 to 75 feet long; some passageways were curved.
  category: object
  evidence_refs:
  - ev:7
