literal_observations:
- id: obs:1
  text: Large oblong skin bags or satchels are described as common among the Eskimo
    for holding tools, implements, arrow and spear points, and miscellaneous accumulated
    items.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bags have slightly arched ivory or bone handles stretched lengthwise across
    the open mouth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Long, narrow wooden boxes are also used for holding tools and are often carved
    into varied forms.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Cape Darby tool bag is made from the skin of four wolverine heads with a
    tanned sealskin bottom turned hair-side inward.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Cape Darby walrus-ivory handle has thirty-four wolverine skins etched
    along its lower surface, animal-head forms at the ends, and a mostly plain upper
    surface with a groove.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: An ivory bag handle from Sledge Island has eight whale tails and numerous
