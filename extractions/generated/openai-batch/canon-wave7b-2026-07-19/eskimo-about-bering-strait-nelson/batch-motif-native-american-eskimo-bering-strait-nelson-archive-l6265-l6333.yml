  summary: The passage describes Eskimo tool bags, satchels, boxes, and bag handles,
    focusing on materials and etched or carved imagery. The examples include skin
    bags, ivory or deerhorn handles, animal-skin representations, animal heads, whales,
    bears, waterfowl, deer, and scenes of hunting, travel, boat launching, and other
    occupations.
