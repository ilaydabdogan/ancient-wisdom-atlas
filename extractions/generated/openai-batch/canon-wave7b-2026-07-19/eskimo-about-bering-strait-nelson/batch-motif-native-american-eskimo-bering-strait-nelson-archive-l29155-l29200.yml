  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: In a coast village lived a man and wife with two children, a girl and a boy.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the boy grew large enough to turn over the gravel stone, he became in
    love with his sister and repeatedly importuned her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: To avoid the boy, the sister floated into the sky and became the moon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The boy pursued his sister thereafter, became the sun, and sometimes overtakes
    and embraces her, causing an eclipse of the moon.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: After his children had gone, their father became gloomy, hated humankind,
    and went about the earth scattering disease and death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Victims of disease became the father’s food, and he later killed and ate people
    who were well.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: People threw the bodies of their dead outside the village so that the being
    might be fed without injuring the living; the bodies disappeared during the night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Powerful shamans joined together, used magic powers, and captured and bound
    the being hand and foot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Although bound and unable to move about, the being still has power to introduce
    disease and afflict mankind.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: The dead are no longer thrown out, but are tied hand and foot and placed in
    a grave box to prevent evil spirits from possessing dead bodies and giving them
    animation for evil purposes.
  category: action
  evidence_refs:
  - ev:5
