canonical_text:
  quote: ''
  summary: The passage first closes a story about harmless dwarf people seen by hunters
    on the tundra, carrying bows and arrows and disappearing into the ground. It then
    gives a St Michael tale in which a brother desires and pursues his sister; she
    rises into the sky and becomes the moon, while he becomes the sun, with lunar
    eclipses explained as moments when he overtakes and embraces her. After the children
    depart, their father becomes a disease-bringing cannibal being. People try to
    feed him with the dead, shamans bind him, and a mortuary practice of tying bodies
    hand and foot in grave boxes is explained by reference to this binding and to
    fear of evil spirits animating corpses.
  language: English
  quote_policy: summarized
