  quote: ''
  summary: In a mortuary feast, small portions of food and water are offered, and
    the spiritual essence of the whole quantity is believed to go mysteriously to
    the shades, supplying them until the next festival. Afterward the festival maker
    distributes the remaining food to those present, who eat. Songs and dances close
    the feast, and the shades are dismissed.
