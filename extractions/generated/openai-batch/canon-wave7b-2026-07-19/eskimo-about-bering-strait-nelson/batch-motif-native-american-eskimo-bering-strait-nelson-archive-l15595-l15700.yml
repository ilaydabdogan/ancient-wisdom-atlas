  text: At Bazbiusky, summer houses front a small creek, winter houses stand behind
    them, two kashims are near one end of the row, and a graveyard is immediately
    behind the kashims.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Summer houses along the Yukon up to Paimut are said to be built of heavy slabs
