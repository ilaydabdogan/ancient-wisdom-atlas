canonical_text:
  quote: ''
  summary: The passage describes the kashim as the main communal, religious, and male
    gathering house in Alaskan mainland and Bering Strait Eskimo villages. It details
    invitations and cooperative labor for building a new kashim, male seating by status,
    shamanic ceremonies, elder instruction, gender separation during rites, gift customs
    for children, strangers, and visitors, and song-and-dance delivery of invitations
    and greetings.
  language: English
  quote_policy: summarized
