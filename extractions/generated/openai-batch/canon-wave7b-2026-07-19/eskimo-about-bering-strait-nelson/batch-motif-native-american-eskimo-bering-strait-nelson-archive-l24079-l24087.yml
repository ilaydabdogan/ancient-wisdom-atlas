  quote: the kashim shall never be left entirely vacant
  summary: During the festival, the kashim must not be left empty. At Pastolik, men
    forgot this observance and went to another kashim. One returned and heard shades
    in the bladders speaking; the hanging line had come untied, and the bladders had
    moved toward the doorway as if to leave because the shades were angry at being
    neglected.
