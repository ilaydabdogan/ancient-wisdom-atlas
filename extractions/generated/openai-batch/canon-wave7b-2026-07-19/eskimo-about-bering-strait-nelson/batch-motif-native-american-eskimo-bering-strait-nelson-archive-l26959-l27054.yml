canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing mythic animals and their images among
    Eskimo communities around Bering Strait and the lower Yukon/Kuskokwim region:
    a fierce offshore sea fox; a killer-whale creature able to become a wolf, with
    a related white-whale/reindeer form interchange; and the pal-rai-yuk, a crocodile-like
    water animal painted on boats, dishes, and masks, said to live in lakes, creeks,
    and marshes, devour people and animals, appear in a Raven creation tale, and resemble
    an alligator in drawings and habits.'
  language: English
  quote_policy: summarized
