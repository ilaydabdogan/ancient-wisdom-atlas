canonical_text:
  quote: ''
  summary: In a Raven creation myth, Raven forms animals from clay, gives them life,
    explains their traits and uses to Man, creates a woman companion, teaches shelter,
    clothing, hunting, and food uses, creates a bear to make people afraid, and directs
    the rapid maturation and sibling marriage of the first children so the earth may
    be peopled.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven makes tame and wild reindeer from clay, gives them life, and their drying
    state explains their coat colors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven tells Man that tame reindeer will be scarce, while wild reindeer will
    be common and often killed by people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven says Man will be lonely and makes a young woman as his companion, using
    an image like Man and fine water grass for hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The primordial setting is described as having no mountains, constant bright
    sun, no rain, and no wind.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Raven shows the human pair how to make a bed in dry moss on a knoll, then
    sleeps nearby after drawing down his mask and taking bird form.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Raven creates pairs of sticklebacks, graylings, and blackfish in a creek and
    tells Man where some of them will live and that they will be food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Raven creates the shrew-mouse and later many insects, explaining that these
    creatures enliven the ground and earth.
  category: action
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:8
  text: Raven flies to the sky for four days and returns with a salmon for Man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Raven tells Man to use muskrat skin for clothing and to follow the beaver
    as an example for building strong houses.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The woman gives birth to a child; Raven directs care for it, Raven and Man
    rub it with clay, and the child becomes a full-grown man on the third day.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Raven creates a bear because he thinks humans need something to fear, then
    warns Man that the bear is fierce and dangerous.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Raven creates seals, explains their names and habits, and teaches Man to make
    rawhide lines and deer snares.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A later girl child is rubbed with clay after birth, walks the next day, becomes
    a full-grown woman on the third day, and marries her brother as Raven had directed.
  category: sequence
  evidence_refs:
  - ev:10
