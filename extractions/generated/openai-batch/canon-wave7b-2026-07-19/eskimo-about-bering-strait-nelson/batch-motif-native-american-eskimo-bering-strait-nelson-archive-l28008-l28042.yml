  summary: The Raven boy restores the sun, establishes day and night by making the
    sky revolve, fixes glowing grass in the sky as the morning star, returns to the
    first people, fails to return to the sky after hearing of Man, then marries and
    has descendants who become Raven people and eventually ordinary ravens.
