canonical_text:
  quote: ''
  summary: A migration legend, reported from an old man at Ikogmut and noted by Nelson
    as unverified, recounts that Eskimo groups moved westward, founded a large Yukon
    River village, quarreled, were defeated by surrounding enemies, split into three
    parties, settled in several coastal and island locations, fought Kodiak and Aleut
    attackers, attacked and burned a Goodnews Bay village, later scattered under Russian
    pressure, and eventually returned or moved along the coast. The account also explains
    later language differences as resulting from separation after an original shared
    tongue.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The legend is said to have been obtained from an old man at Ikogmut on the
    lower Yukon; the collector states that he could not verify it and that it was
    given as fact.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The account says that very long ago the Eskimo lived far from the Yukon and
    continually moved from place to place, traveling from the far east toward the
    west.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After long wandering, some of the migrants built a village on the Yukon River
    below present Ikogmut; it grew to thirty-five kashims, and ruins with pits are
    said to remain visible.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The villagers quarreled, formed two parties, and made war against each other.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: People from surrounding villages, who were said to have hated the Yukon villagers
    for their overbearing behavior, united against them.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The outside enemies defeated the divided village forces; survivors separated
    into three parties and dispersed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: One dispersed party stopped at Kushunuk near Cape Vancouver, one went to Nunivak
    Island, and one traveled to Bristol Bay and settled near present Nushagak.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kodiak island people sent a war party against the strangers near Nushagak,
    but the newcomers at Bristol Bay almost exterminated the attackers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Aleut people from Uminak Island sent another war party; this time the Yukon
    men were defeated and lost half their number.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The remaining Yukon men joined friends from Nunivak Island and attacked the
    people at Goodnews Bay, killing them and burning their village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The victors built a village in the same Goodnews Bay locality and were living
    there when Russians came to the country.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When Russians came, the Goodnews Bay people resisted for a time, then scattered,
    with some returning to Bristol Bay and others settling with their people on Nunivak
    Island.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The descendants of these people are said to have gradually returned to Goodnews
    Bay, and Bristol Bay people are said to have been moving along the coast toward
    the Kuskokwim mouth in recent years.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: During the migration from the Yukon, all of these people are said to have
    spoken one tongue; after settling in three separated places, their languages gradually
    became different, with Bristol Bay and Nunivak Island speech nearest alike.
  category: attribute
  evidence_refs:
  - ev:8
