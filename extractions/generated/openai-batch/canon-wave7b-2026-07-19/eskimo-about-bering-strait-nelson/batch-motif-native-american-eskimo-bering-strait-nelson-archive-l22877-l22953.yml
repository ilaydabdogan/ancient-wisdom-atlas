canonical_text:
  quote: ''
  summary: 'The passage describes a day of a mortuary feast in the kashim: feast givers
    replenish lamps, offer food and water before lamps for the dead, distribute food
    and gifts, sing invitations, repeat dances, perform a sunwise circular cleansing
    turn, dance at grave boxes and at the Yukon ice for drowned relatives, and distribute
    berries to children and adults. The stated explanation is that the shades of the
    dead are believed to have returned from the other world in response to invitations
    and to occupy grave boxes when not in the kashim.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Very early in the morning, feast makers enter the kashim, refill lamps with
    seal oil, and bring food including whitefish oil, dried salmon, and seal blubber.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The feast makers make offerings of small fragments before each lamp burning
    for the dead, then distribute the food among the people so that everyone breaks
    the fast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Songs of invitation are sung to the dead, and dances are performed and repeated
    during the day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Feast givers distribute large quantities of dried salmon, later more salmon
    and cranberries, and later berries and fish among adults.
  category: action
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:5
  text: At the dance conclusion, an old central drummer raises drum and stick overhead,
    calls for turning as the light goes, and turns slowly in quarter-circles with
    the sun while making a hissing noise.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: All dancers turn and stop with the drummer, make the same hissing noise, then
    stamp their feet and slap their thighs to make themselves clean.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After going outside, some dancers dance before the kashim, others dance among
    the graves before grave boxes, and four men who lost relatives by drowning dance
    on the ice of the Yukon.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the shades of the dead were believed to have returned
    from their abode in the other world in response to invitations.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the shades were believed to occupy their grave boxes
    when not in the kashim, and the grave dance showed them that relatives were taking
    part in the festival.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Seventy or eighty children gather in the kashim with small wooden dishes and
    grass bags, shout for berries, receive handfuls from women, and empty the dishes
    into their bags.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women feast givers present straw pads for skin boots and finely combed grass
    for towels.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Feast givers pour a little water on the floor before each lamp as an offering,
    then give the remainder to the namesakes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Later, men crowd two tiers of benches along the sides while women and children
    occupy the middle of the floor, leaving a narrow passage by the wall for feast
    givers to move around the lamps.
  category: setting
  evidence_refs:
  - ev:8
