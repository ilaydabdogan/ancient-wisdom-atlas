  summary: The passage describes tools used by Eskimo people around Bering Strait
    for working ivory, bone, and deerhorn, including earlier flint, stone, and tooth
    tools and later iron or steel scrapers, etching implements, wedges, and saws.
    It gives details of several saws and scoring or etching implements from Port Clarence,
    Cape Prince of Wales, Unalaklit, the Yukon district, and Cape Darby.
