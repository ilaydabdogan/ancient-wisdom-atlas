canonical_text:
  quote: ''
  summary: 'The passage describes snow knives made of deerhorn and ivory, their carved
    and etched designs, and their use by children as toys for cutting or marking hard
    snow. It also describes children making animal figures in snow and cutting them
    up in imitation of hunters killing game. Several toy images are described: white
    bear figures, a sled with dog figures, an ivory kayak model with a human head
    and sealskin float, and an ivory figure of a white bear with a man lying along
    its back, said to illustrate an occurrence in a folktale.'
  language: English
  quote_policy: summarized
