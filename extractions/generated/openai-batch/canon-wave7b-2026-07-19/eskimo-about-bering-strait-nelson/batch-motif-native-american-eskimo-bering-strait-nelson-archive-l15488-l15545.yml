literal_observations:
- id: obs:1
  text: Kashims are described as common among the Eskimo and as adopted by the adjacent
    Thine of the lower Yukon and Kuskokwim rivers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The size of a kashim varies according to the number of inhabitants in the
    village.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The material used for kashims is driftwood, including logs and poles brought
    by rivers or scattered along the coast; spruce is the most common variety mentioned.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: In construction, logs are laid in a square to a height of about 7 or 8 feet,
    then drawn inward in alternate courses toward the roof opening.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A square opening in the roof is placed over the middle of the room and forms
    a frame for a smoke hole about 2 to 2.5 feet wide.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Small kashims are covered with a heavy layer of earth; large ones may have
    crib-work around them forming a double wall filled with earth.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The central floor is usually made of close-laid hewed planks and covers about
    one-third of the room area.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Below the central planks is a pit 3 to 4 feet deep where fire is built to
    heat the room for sweat baths or occasionally in winter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that occupants' body heat usually keeps the room warm enough
    that they remain nude or partly nude much of the time, even in winter.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: The entrance includes a long, roofed, earth-covered log passage with an outer
    doorway that in summer is closed only by a bearskin curtain.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: In winter the above-ground entrance is closed, and people pass through a floor
    hole and low tunnel on hands and knees to the fire pit and then into the middle
    of the room.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: The rooms are described as 12 to 25 feet square, with a bench extending around
    the inside about 4 feet from the floor.
  category: object
  evidence_refs:
  - ev:5
