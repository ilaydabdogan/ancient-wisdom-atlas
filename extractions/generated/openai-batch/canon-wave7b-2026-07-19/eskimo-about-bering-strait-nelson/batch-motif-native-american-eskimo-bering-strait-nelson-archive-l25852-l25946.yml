canonical_text:
  quote: ''
  summary: The passage describes beliefs about shades of the dead, their road to the
    village of the dead, festival invitations and offerings through namesakes, the
    consequences of being forgotten, animal shades and animal-human transformation,
    and the Raven Father as sky-being creator who made the earth when all was covered
    with water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the road to the village of the dead, a shade is offered water in a bucket
    and must use a dipper; disobedience brings annoyance from other shades.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first child born in a village after a death may receive the dead person's
    name and represent that person in later festivals; if no child is born, a grave-box
    helper may take the name and abandon his own for that purpose.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a festival for the dead, the shade is invited by songs and by sticks bearing
    the deceased person's totem marks, and is called from the grave box to the fire
    pit under the kashim floor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Offerings of food, water, and clothing are cast on the floor for the shade,
    and a song announces the presence of the namesake, after which the shade enters
    the namesake's form.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The feast giver places a new suit of clothing on the namesake, and the passage
    states that the shade thereby becomes newly clothed; food given to the namesake
    is believed to be given to the dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the ceremony, the shade is dismissed back to the land of the dead; shades
    below the kashim floor are thought to enjoy the songs and dances with the living.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A dead person with no one to hold a festival or obtain a namesake is forgotten
    and cannot return to the festivals.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The shades of animals are believed to be formed like people, and game-animal
    shades require propitiation by offerings, feasts, and dances.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ancient animals are said to have been able to change form by pushing up the
    muzzle or beak to become people and pulling it down to become animals again.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Some animals are still claimed to possess this transformation power, but when
    they become people they are invisible except to shamans or others with mystic
    powers.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage states that this animal transformation belief is illustrated in
    raven tales and is the foundation of Eskimo mask dances.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Raven Father is credited with creating the earth and everything on it;
    he is said to have come from the sky and made the earth when everything was covered
    with water.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Raven Father often retained raven form and could change to a man by pushing
    up his beak.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: The passage says shamans still pretend to replace animals on earth by trips
    to the sky land.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The first man made on earth returned to the sky land, where shades of shamans
    and people recompensed for violent death also go; the Raven Father is believed
    still to live there.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:16
  text: People around Norton Sound place fragments of dried fish or other food on
    the tundra as offerings to the Raven Father in the sky, who gives fine weather
    in return.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: The Unalit say killing a raven angers the Raven Father and brings bad weather,
    while lower Yukon Eskimo dislike and fear ravens as evil birds.
  category: relationship
  evidence_refs:
  - ev:17
