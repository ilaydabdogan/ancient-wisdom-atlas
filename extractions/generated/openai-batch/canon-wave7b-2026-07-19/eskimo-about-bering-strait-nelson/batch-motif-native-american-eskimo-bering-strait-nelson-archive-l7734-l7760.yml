- id: obs:2
  text: Large-animal skins listed include reindeer, wolves, wolverines, bears, seals,
    and walrus; smaller-creature skins listed include fawns, hares, muskrats, marmots,
    and waterfowl.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sealskins and walrus hides are first scraped to remove adhering flesh and
    fat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After scraping, the hides are rolled hair-side inward and kept in the house
    or kashim until they sour and the hair loosens.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Small sealskins are sometimes dipped in hot water to hasten loosening of the
    hair.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hair is scraped off, and the skin is stretched on a wooden driftwood frame
    with stout cords passed through edge slits and over the side bars.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The stretched skins are scraped again and placed outside the house to dry.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After drying, the skins are removed from frames and folded into compact flat
    oblong packages for carrying or storing.
  category: sequence
  evidence_refs:
  - ev:5
