  quote: ''
  summary: The passage describes skin-dressing practices among the Eskimo about Bering
    Strait, including a gendered division of work for large and small animal skins
    and a procedure for scraping, souring, dehairing, stretching, drying, and folding
    sealskins and walrus hides.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men are described as customarily dressing skins of large animals, while women
    prepare skins of smaller creatures and sometimes assist with larger skins.
  category: relationship
  evidence_refs:
