canonical_text:
  quote: ''
  summary: The passage lists Unalit festivals around Norton Sound and St Michael,
    notes regional variation and changes after Russian and American contact, describes
    festivals to the dead, the Bladder feast, and the Great feast to the Dead, then
    gives details of the lower Yukon-Kuskokwim Inviting-in mask feast and the opening
    actions of the St Michael Asking festival.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author presents a probably incomplete list of festivals observed among
    the Unalit Eskimo of Norton Sound and says similar programs exist among other
    tribes in the region, with local variation in rites while a central idea is preserved.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that contact with Russians and Americans around St Michael
    and Norton Sound modified Eskimo customs, while older people still preserved ancient
    beliefs and observances.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some festivals are said to no longer be celebrated in the named district;
    the disuse of masks around St Michael is contrasted with continuing mask use between
    the Kuskokwim and Yukon mouths.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The festival list assigns the Asking festival to mid or late November, the
    Festival to the Dead to late November or early December, the Bladder feast to
    the December moon and sometimes January, and additional Festivals to the Dead
    after the Bladder feast and before spring fishing.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Festival to the Dead includes songs, dances, food offerings, and libations
    in honor of the dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Great feast to the Dead is described as requiring years of preparation
    and accumulated food, fur-bearing animal skins, and other valuables to honor the
    shades of deceased relatives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Inviting-in feast is identified as a mask festival observed along the
    lower Yukon and southward to the Kuskokwim, with men making masks in many shapes
    and forms.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some masks for the Inviting-in feast are described as so large that they are
    suspended from the kashim roof while the owner stands behind with the mask fastened
    to his head and moves it from side to side.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The masks are usually carved as animal heads, often totemic animals of the
    maker, and may express mythological fancies; shamans make masks representing supernatural
    or semihuman familiars.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that the object of these faces is to propitiate and honor
    the animals or beings represented, bring plenty of game in the coming year, and
    ward off evil influences.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The inuas or shades of animals are described as invited and supposed to be
    present to enjoy songs, dances, and food and drink offerings made in their honor.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the conclusion of the Inviting-in ceremonies the masks are burned; a man
    who sells his mask must replace it with about an equal amount of wood for the
    sacrificial fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Asking festival at St Michael occurs after mid-November when fish have
    left the shallow coastal water and winter stores have been gathered; the first
    night is called Tu-tu'-uk, described as a going-around.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: The visible text describes hunters and large boys in the kashim, blackening
    faces with an oil mixture, painting bodies, carrying wooden dishes, making discordant
    noise, going single file from house to house, and encountering women at home with
    tubs of berries and other food ready.
  category: action
  evidence_refs:
  - ev:6
