  quote: ''
  summary: A girl or woman initially appears as she did when alive, but after sitting
    in her father's house she loses color, wastes to skin and bone, and cannot speak.
    The next morning her namesake in the same village dies; that woman's shade goes
    to the land of the dead in the girl's place, after which the girl regains strength
    and lives for many years.
