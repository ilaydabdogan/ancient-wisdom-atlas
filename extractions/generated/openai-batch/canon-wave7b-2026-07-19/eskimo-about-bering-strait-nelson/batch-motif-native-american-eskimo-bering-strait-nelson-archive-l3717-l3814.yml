canonical_text:
  quote: ''
  summary: Ethnographic description of bead and earring practices among Eskimo groups
    around Bering Strait, including septum piercing of little girls, bead use in hair
    and clothing, ear piercing among women and men, regional variation in earring
    forms, large ivory men's earrings from the Yukon-Kuskokwim tundra, and two Kaialigamut
    examples with lead or bottle-glass inlays. A figure caption also identifies circular
    tattooing forms on two men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Little girls on the Alaskan mainland are described as commonly having the
    septum pierced and wearing one or more small beads hanging so they rest on the
    upper lip.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a girl reaches maturity, nose beads are not worn; women were observed
    using the septum hole only for small objects such as needles.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the Asiatic coast, large boys and young men were frequently seen with two
    or three beads strung on the hair and hanging over the forehead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Little girls and young women south of the lower Yukon ornament hair and clothing
    with parallel strings of beads held flat by ivory rods or pierced skin strips.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Loops of bead bands may hang from earrings over the shoulders to the breast
    or be attached to hair braids above the ears; a heavy copper ring is often attached
    to these loops.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Women commonly pierce the lobe or outer edge of the ear throughout the Eskimo
    territory visited by the observer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men, especially between the Yukon and Kuskokwim, also have pierced ears and
    wear huge earrings with strings of beads sometimes looping under the chin from
    ear to ear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Women's earrings near the Yukon and Kuskokwim show great variety and are made
    of ivory with occasional bead or other settings; less variety was observed elsewhere
    along the coast.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The richest earring ornamentation and greatest variety of forms are said to
    occur south of the lower Yukon, coinciding with elaborate carving styles on masks
    and other objects.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Men's earrings from the tundra between the Yukon mouth and lower Kuskokwim
    are very large ivory pieces, usually rectangular, with excavated fronts, rims,
    sometimes central ridges, cement-filled spaces, and shining objects set in the
    cement.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: One Kaialigamut earring specimen has black cement, six small lead squares
    on each earring, a beveled lower point, a pierced boss for bead pendants, a longer
    bead string passing under the chin, and an ivory hook cut from the same piece.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Another Kaialigamut earring specimen is similar in shape, has bottle-glass
    fragments set in the cemented outer face, and has a hook and pierced boss for
    bead strings.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: A figure caption identifies circular forms of tattooing on a Mochigme bay
    man and on a St Lawrence island young man.
  category: other
  evidence_refs:
  - ev:8
