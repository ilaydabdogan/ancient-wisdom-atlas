canonical_text:
  quote: ''
  summary: The passage describes tops, buzzes, and a toy woodpecker from the Bering
    Strait region, including their materials, construction, and forms of play. It
    notes a lower Yukon children's winter top-spinning game played on the wooden floor
    of the kashim and describes a St Michael toy woodpecker whose head can be pulled
    down and springs back by quill elasticity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A common top form is disk-shaped, thin at the edge, perforated in the center
    for a peg, and may be made of walrus ivory with a fitted wooden plug and spindle-shaped
    peg.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another kind of top is made to be spun with a guiding stick and cord, and
    is often used by men as well as boys.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the lower Yukon, children in winter spin tops on the wooden floor of the
    kashim.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the top-spinning game, each child spins a top, runs out through the long
    passage to the entrance, circles around the outside of the building, returns inside,
    and tries to arrive before the top stops spinning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The tops in the lower Yukon game are spun between the two hands with the upper
    spindle held upright between the palms.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Children also use a buzz made by stringing a doubly perforated flattened disk
    on a cord, tightening and relaxing the cord loop to make the disk twirl.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Buzzes are usually made of wood, ivory, or bone, and in recent years some
    are made of metal.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: One buzz obtained at St Michael was made from adjoining phalangeal bones of
    an animal, probably a seal, with sinew cord and short cross-sticks for grasping.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: A toy woodpecker from St Michael is made of wood and fastened to a small wooden
    spatula by a stout quill in place of legs.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The toy woodpecker's spatula is dotted with red paint to represent food.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: A string attached to the bird's beak and passing through the spatula lets
    a child pull the head down; when released, the quill's elasticity throws it up.
  category: action
  evidence_refs:
  - ev:11
