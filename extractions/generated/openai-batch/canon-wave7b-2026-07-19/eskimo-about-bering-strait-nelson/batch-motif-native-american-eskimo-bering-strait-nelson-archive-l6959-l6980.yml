  summary: The passage describes small sewing-material cases or bags commonly called
    “housewives,” used among the western Eskimo. It explains their materials, shape,
    cord-and-crosspiece fastening method, carved crosspieces, and details of one Kaialigamut
    specimen made from reindeer-ear skin and other animal skins, with colored leather
    trim, stitching, painted red lines, fur strips, and fringe.
