    center.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Old men are cited as saying that the concealed wolf pit was the commonest
    ancient trap and caught many animals.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: A sinew-spring trap uses the tension of strong twisted sinew cords to throw
