  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Port Clarence bait spit for a four-trap consists of a double-pointed bone
    spit with a notch and a second bone spit fastened against it.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Near Andreivsky, lynx snares are described as dome-shaped piles of brush with
    narrow openings leading to bait under the center; rawhide loops at the openings
    entangle and hold the animal.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: One noose snare is set over an animal path above a deep hole; a heavy stone
    attached to the snare drops when triggered, closing the noose and drawing the
    animal's neck down to the ground.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Another noose is set at the entrance to a frozen-snow tunnel with meat bait
