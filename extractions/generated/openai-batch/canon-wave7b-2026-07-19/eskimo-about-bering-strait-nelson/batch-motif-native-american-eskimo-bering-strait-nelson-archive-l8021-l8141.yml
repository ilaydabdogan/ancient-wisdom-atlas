canonical_text:
  quote: ''
  summary: 'The passage describes practical hunting and trapping methods used around
    Bering Strait: bear killing with dogs and lances; wolf and fox killing by guns,
    arrows, steel traps, and older traps; whalebone game spits that are swallowed
    and straighten inside an animal; deadfalls and bait spits; lynx snares; weighted
    noose traps; snow-tunnel nooses; concealed wolf pits near the Yukon; and sinew-spring
    lever traps with regional distribution and replacement by steel traps in some
    areas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man in the region is described as having had scalp, flesh, and one eye torn
    away by the paw stroke of one of the animals discussed in the preceding context.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bears were formerly brought to bay by dogs and killed with stone- or iron-pointed
    lances; people of the Siberian shore are said still to kill many bears in this
    old fashion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wolves are described as being killed with guns or arrows, or taken with traps;
    steel traps had been introduced by traders, while older devices were still sometimes
    used for wolves and foxes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A whalebone game spit is made from a slender double-pointed piece of bone
    that is softened, bent into folds, tied in position, dried, untied, soaked in
    oil, and wrapped in tallow, blubber, or fish-skin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The wrapped whalebone morsel is placed where wolves and foxes frequent.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: When an animal swallows the wrapped whalebone, warmth and moisture in the
    stomach cause the bone to straighten; the points pierce the animal or cause pain
    until the hunter follows and dispatches it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Figure 36 is said to show folded and extended examples of the game-spit implement
    obtained at St Michael.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Deadfalls for minks, foxes, and sometimes larger animals are made from a small
