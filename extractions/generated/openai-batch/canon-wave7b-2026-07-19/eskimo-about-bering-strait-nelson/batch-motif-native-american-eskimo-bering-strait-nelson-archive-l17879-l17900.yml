  quote: ''
  summary: 'The passage describes winter sweat baths in the kashim: men and boys periodically
    use a heated room, a pit fire beneath removable floor planks, stored urine as
    a cleansing agent, and cold water, snow, or ice water afterward to cool their
    bodies.'
  language: English
