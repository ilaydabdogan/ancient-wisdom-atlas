canonical_text:
  quote: ''
  summary: The passage describes the widespread raven mark on western Eskimo objects
    and a tattoo; summarizes beliefs and tales about Raven Father as creator, benefactor,
    sky-returning ancestor, and source of raven descendants who lost shapeshifting
    powers; records landscape features attributed to Raven Father, including a Yukon
    stone used in a fish-abundance ritual and an island made from a boot pad; notes
    Raven's poor dress and seating in tales; and reports beliefs about people and
    animals transforming, including the origin of red bears and the persistence of
    an animal's inua or shade.
  language: English
  quote_policy: summarized
