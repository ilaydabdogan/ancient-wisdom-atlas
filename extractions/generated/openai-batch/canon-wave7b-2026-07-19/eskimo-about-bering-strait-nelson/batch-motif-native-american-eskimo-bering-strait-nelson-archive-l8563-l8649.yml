  quote: ''
  summary: The passage describes several seal-scratchers and seal-handling implements,
    a white-covered kayak-sled method for approaching seals on ice, procedures for
    towing and floating killed seals, and late-summer or early-fall nets used to catch
    white whales near reefs or islets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Norton Sound wooden-handle scratcher has three claws fastened with sinew
    cords, a sinew-bound grip, and a wrist-suspension loop.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Cape Prince of Wales scratcher has a long wooden handle, three claws, carved
    sides, and a handle end shaped as a white bear's head with blue bead eyes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A St Michael scratcher has a wooden handle and four claws held by a pierced
    rawhide strip and cord lashing.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A hunter can conceal himself and a kayak sled under a white-sheeted framework,
    push it cautiously toward a seal, and then use either a rifle or a spear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After killing a seal at sea, a hunter may place a small seal in the kayak,
    while a large seal must be towed to shore or ice before being cut up and stowed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A towline may be fastened by passing cords through slits in the seal skin,
    tying the flippers, or passing a cord through a slit in the upper lip.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Small bone or ivory probes with a notch and side grooves can be used to pass
    a doubled cord between slits in the skin.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Kotzebue Sound implement for this cord-passing purpose is made of deerhorn
    with a wooden handle fastened by sinew cords and grooved for grip.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: When thin seals may sink, the hunter can make skin slits, loosen blubber from
    muscle, blow air under the skin through a hollow tube, and plug the slits to make
    the seal float.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A Sledge Island blubber-loosening probe is a long curved pointed deerhorn
    rod set into a wooden handle and lashed with spruce root.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: A Sledge Island set of eight wooden plugs is flattened oval in cross section
    and wedge-shaped, with thin rounded points and broad truncated ends.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: White whale nets are set in late August and early September near rocky islets
    or reefs.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:13
  text: White whale nets are described as similar to seal nets but with larger meshes
    and greater length and width.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: White whales enter the nets, become entangled like fish in gill nets, are
    held under water by heavy anchor stones, and drown before the hunter visits the
    net.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:15
  text: Because the white whale nets are too far from shore to observe from land,
    they are inspected daily by kayak.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: White whales may sometimes be caught in near-shore seal nets, but a school
    of whales can also tear a net to pieces and escape.
  category: sequence
  evidence_refs:
  - ev:12
