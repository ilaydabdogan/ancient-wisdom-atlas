canonical_text:
  quote: ''
  summary: The passage describes several carved masks from the lower Yukon, lower
    Kuskokwim, Paimut, and Sabotnisky areas. One crane-form mask is said to represent
    the inua of a sand-hill crane, based on a shaman-maker's account of seeing a crane
    whose breast feathers parted to reveal the inua's face. Other masks include a
    hinged elongated female countenance of unknown meaning, a grotesque mythical-being
    face of uncertain signification, and two semihuman masks identified as representations
    of a tunyhalc/tunyliak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Figure 1, plate xcvin, is described as a long, slender mask representing the
    head, neck, and beak of a sand-hill crane, with the bird's head excavated for
    a small lamp and holes near the eyes for light to shine through.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The crane mask has wooden pegs on the beak to indicate teeth and a rudely
    shaped human face on an oval form at the bird's breast; several areas are painted
    red.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The crane mask was said to represent the crane's inua, and its shaman-maker
    claimed that a crane's breast feathers parted to reveal the face of the bird's
    inua when he approached it on the tundra.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Figure 2, plate xcvin, is an elongated human countenance mask divided across
    the middle and hinged with rawhide cord so that it could move upon itself.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The elongated hinged mask has crescentic eyes and mouth, a long nose with
    nostrils pierced through the wood, a nose-ring pendant, and a carved wooden labret
    indicating that the represented face is female; its meaning is stated to be unknown.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Figure 3, plate xcvin, is a grotesque human face with a long rearward forehead
    projection, a broad crescent-shaped mouth with wooden-peg teeth, and a second
    grooved mouth-like feature along the top of the projection.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The grotesque mask in Figure 3, plate xcvin, is painted red on the front and
    upper surface, has blood splashed between the mouth and eyes, and is said to represent
    some mythical being, though its exact signification was not learned.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Figure 3, plate xcix, from Paimut, is a flattened rounded mask representing
    a grotesque semihuman countenance with multiple eyes placed on the forehead, left
    side, right cheek, and above the right-side eye.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Paimut semihuman mask has a two-part mouth bordered with wooden pegs for
    teeth, red, dull green, and white painted areas, and formerly had quill feathers
    inserted around the edge when in use.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Paimut semihuman mask is identified as representing the countenance of
    a tunyhalc.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Figure 2, plate xcix, from Sabotnisky, is a flattened mask representing a
    rude semihuman face with a round central mouth, two narrow slit-like eyeholes,
    four broad concentric grooves around the mouth, and red and white paint.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Sabotnisky semihuman mask is identified as also representing the features
    of a tunyliak.
  category: relationship
  evidence_refs:
  - ev:5
