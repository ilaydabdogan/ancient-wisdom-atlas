literal_observations:
- id: obs:1
  text: The passage says Eskimo use a commonly named crooked knife for whittling,
    carving, and finishing woodwork.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The crooked knife has a curved blade usually one to three inches long, commonly
    made from hoop iron or similar scrap, and sometimes from a cut and bent steel
    knife blade.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The handle is described as bone, horn, or wood, tapering downward to a point,
    and ranging from four to fifteen inches in length.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The crooked knife is described as the principal tool for fashioning and finishing
    many wooden objects, including boxes, dishes, trays, tubs, spear shafts, bows,
    arrows, and frames for umiaks, kayaks, sledges, and other woodwork.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The described woodworking sequence is that wood is first blocked out with
    an adze, then shaped, smoothed, and finished with the knife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: A Norton Sound specimen has its blade set in a groove near the end of the
    inner edge of the handle, spruce-root wrapping above the blade for grip, and a
    conical depression underneath indicating use as a cap for a small drillhead.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: A Nunivak Island specimen is described as especially rude, with a short thick
    iron piece wedged into a handle slot, sinew lashing holding the inner blade end,
    and a small conical depression marking use as a drillhead cap.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: A St Lawrence Island specimen has a long tapering iron blade set into a deep
    flat hole in a short wooden handle with an oval cross section and a groove for
    sinew wrapping near the blade.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Another similar knife has the blade fitted into a gore-shaped slot in the
    handle side, filled out with a thin wood strip and wrapped with sinew cord to
    hold the blade in place.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Kulwoguwiguinut specimen has a bone handle with diagonal zigzag etched lines,
    lengthwise scored straight lines, end grooves, a short straight iron blade, and
    a rawhide loop fastened at the opposite end.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Two Hotham Inlet specimens have blades fastened by iron rivets; one has grooving
    and holes for a cord attaching a leather sheath, while the other has rawhide cords
    and a wood strip arranged to improve grip, with a leather sheath attached.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: A Norton Sound specimen has a two-part handle of bone and wood joined with
    spruce-root wrapping, and a St Michael specimen has a blade held in a bone-handle
    groove with rawhide cord and three ships etched on the handle.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
