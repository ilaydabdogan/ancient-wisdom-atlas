canonical_text:
  quote: ''
  summary: 'The passage describes the Iht''-u-g-i'' mortuary feast at St Michael and
    the lower Yukon: its annual and seasonal timing, its makers, grave-side invitation
    stakes, songs calling shades from the land of the dead, their assembly under the
    kashim floor, their possession of namesakes to receive offerings, the sending
    back of shades by stamping, feast-day work taboos, concern for neglected shades,
    oil lamps for the shades, and offerings of food and water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Iht'-u-g-i' at St Michael is held yearly in late November or early December
    and is also repeated after the autumn Bladder feast and before spring salmon fishing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The feast is described as being given to make offerings of food, water, and
    clothing to shades of the recently deceased and to dead persons not yet honored
    by a great festival.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The feast makers are the nearest relatives of those who died during the preceding
    year, joined by villagers who have not given a great feast to their dead.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: On the day before the festival, the nearest male relative goes to the grave
    and plants a newly made stake with grave-specific objects on it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a man's grave the stake may bear a model seal spear, kaiak paddle, or
    umiak oar; for a woman's grave it bears a wooden dish.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The implements are marked with the dead person's totems, or the totem may
    be indicated by a wooden image of the totem animal on the stake.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The stake is described as a notification that brings the shade from the land
    of the dead to the grave, where it waits to be called into the kashim.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Before a great festival to the dead, invitation stakes and invitation songs
    are used at graves of those to be honored.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At the opening invitation song, the shades are said to come from their graves
    to the kashim and assemble in the fire pit under the floor.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the proper time the shades ascend from beneath the floor and enter and
    possess the bodies of their namesakes in the kashim.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Offerings made to namesakes are said to benefit the deceased shades and supply
    their wants in the land of the dead.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: After the offerings and songs, the shades are sent back to their abiding place
    by stamping on the floor.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: On the day of the feast no village work is permitted, and work with sharp-edged
    or pointed tools is prohibited.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The tool prohibition is explained by fear that a shade may be nearby, be injured,
    become angry, and harm people.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage states that care and generosity at these rites make the shade
    happy and comfortable.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Childless persons generally adopt a child so their shade will not be forgotten
    at the festivals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: People without someone to make offerings are said to suffer destitution in
    the other world, and neglected rites are described as a severe punishment for
    a shade.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:18
  text: At St Michael and the lower Yukon, participants bring oil lamps into the kashim
    at midday; the lamps are lit, arranged around the room, and kept burning until
    the festival ends.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: The lamps are said to light the shades on their way back to the earth and
    to provide in the land of the dead the light used in their houses.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:20
  text: An old man beats a drum in slow regular time and sings the invitation to the
    shades, accompanied by the villagers.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:21
  text: The song calls the dead to come and mentions sealskins for a tent and reindeer
    skins for a bed.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:22
  text: Feast makers take a small portion from every prepared dish and cast it on
    the floor, then pour water on the floor so it runs through the cracks.
  category: action
  evidence_refs:
  - ev:11
