literal_observations:
- id: obs:1
  text: At Cape Prince of Wales there were two villages, called the hill village and
    the spit village, separated by about 75 yards.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Cape Prince of Wales houses were made of driftwood covered with earth
    and were described as very similar to those of the Diomede Islands.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two Cape Prince of Wales villages had a standing feud; the spit village
    was described as more aggressive and was hated and feared by the other village.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The East Cape village stood on a steep slope facing the sea, had dome-shaped
    houses with small outer openings, and was compared in appearance to a cluster
    of cliff swallows' nests.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: From the anchorage, fifty-four occupied houses were counted at East Cape,
    estimated to contain more than 250 people.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: Another village of equal size lay north around the cape, but it was not visited.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The East Cape point village was built on loose granite fragments with narrow
    trails in front of many houses and sharp descents beyond.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: East Cape houses had oval stone walls, arched or open-top entrance passages,
    whale-rib frameworks, a whale jawbone support, walrus-hide coverings, lashings,
    heavy stones, and whale vertebrae used with cords.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: Inside the East Cape houses, front areas were used for storage, while rear
    areas held pologs, small skin-covered rooms where each family had its own space
    and beds stood on raised platforms.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Wood was described as scarce at East Cape, and an elevated platform for sleds
    and boats was made of whale jawbones.
  category: object
  evidence_refs:
  - ev:4
- id: obs:11
  text: Ruined houses and many pits at East Cape indicated older partly underground
    houses and earlier use of underground houses before more recent abandonment of
    that form.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: At Plover Bay, most houses were walrus-hide huts similar to those at East
    Cape, but they lacked stone base walls and used driftwood frames instead of whale
    ribs; their deer-skin polog interiors were the same.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: A few small half-underground houses of driftwood and whalebones covered with
    earth were found at Plover Bay.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: At Plover Bay a zigzag path led up the bluffs to a rock-walled shelter used
    as a lookout for whales or vessels at sea.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Plover Bay village was described as not very populous, and whisky and
