literal_observations:
- id: obs:1
  text: Fishing is described as one of the main food sources among the western Eskimo,
    using multiple methods and implements.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The coastal Norton Sound fishing season begins about late March or early April
    when spring tides force water through cracks in the ice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tomcod and sculpin remain in deep water during winter and return toward shore
    in spring, where they are caught through holes in the ice with hook and line.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In May, old men and women fish for many hours on the ice, and a photographed
    St Michael scene shows a man at a fishing hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ice fishing holes are made six to eight inches in diameter, using ice picks
    with wooden staffs and metal, reindeer-horn, ivory, or deerhorn points.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ice scoops with netted or solid bottoms are used to remove ice fragments and
    surface ice film from the fishing hole; described examples come from St Michael,
    Bering Strait, and St Lawrence Island.
  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Tomcod fishing gear includes a short pole, long line, sinker, hook with ivory
    or bone shank and iron points, line guide, and notched rod base.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The fisherman uses a slender stick to bring the hook to the surface without
    rising, throws the fish aside on the ice, strikes it to keep it from returning
    to the hole, and lowers the hook again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: No bait is used; the fish nibble at the white ivory shank and are caught by
    the repeated up-and-down motion of the hook.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tomcod are also described as extremely abundant near St Michael in autumn.
  category: sequence
  evidence_refs:
  - ev:7
