canonical_text:
  quote: ''
  summary: A large Worm and his human wife have a Worm son. The father sends the grown
    son to the middle of the earth plain to find a wife. The son uses magic to become
    small, reaches a small house where an old woman's speech shakes the earth, is
    hosted there, and marries her daughter. After four years he starts back to visit
    his parents, but a Man-worm shaman kills him. The father later finds the son's
    body near a village, hides in the villagers' spring by making himself small, and
    kills nearly all of them with magic. An old woman in the village counters with
    a charm that raises the sea and ice over the land to cover the spring; the ice
    crushes the Man-worm and frees the people from his magic.
  language: English
  quote_policy: summarized
