canonical_text:
  quote: ''
  summary: The passage describes burial boxes, grave goods, memorial posts for unrecovered
    dead, carved and furnished effigies representing specific deceased persons, annual
    offerings and clothing renewal, and related grave displays in nearby villages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Kushuimk, the dead are placed with knees drawn to the chest and wrists
    tied to the ankles before burial in drift-log boxes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tools and weapons of the deceased are placed about and upon the burial boxes
    at Kushuimk.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Tunuuuk village, three large drift-log posts representing human figures
    and several smaller posts stand in a row between the kashim and the sea.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The large posts are mostly uncarved except at the top, where each is carved
    as a human head and neck.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first large post has a fur hood, ivory-inlaid eyes and mouth, walrus-tusk
    arms and legs, hanging objects, alternating painted bands, and nearby items identified
    as a woman's workbag and clothing.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The second large post represents a man and has ivory facial features, tusk
    arms and legs, bead labrets, a bow and quiver at its base, and a box of man's
    clothing and tools behind it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Small posts near the second large post bear models of an umiak, kaiaks, nine
    hair seals, and a man in a kaiak holding a poised spear.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boat models are explained as showing that the represented person made
    and owned those boats, the nine seals as his greatest day's hunting, and the kaiak
    hunter as showing that he hunted at sea.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The third large post is old and dilapidated, has ivory mouth, eyes, and arms,
    lacks legs, and is accompanied by models of a hair seal, a reindeer, and a man
    in a kaiak with poised spear.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man represented by the third large post is said to have been a good hunter
    on land and at sea, especially at sea.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The memorial posts are said to represent people who were lost and whose bodies
    were never recovered.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The first post represents a woman buried by a landslide in the mountains,
    while the men represented by the other large posts were drowned at sea.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage reports a custom in this and neighboring villages, including villages
    about Big lake, of erecting memorial posts for people whose bodies are not recovered.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: For five years after the death, a new fur coat or cloth shirt is put on the
    figure at the time of invitation to the festival for the dead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Offerings are made to the memorial figure as though the body of the deceased
    were present in a grave box there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: The shade of the deceased is supposed to come about the village for the festival
    for the dead or at other times, and the posts are supposed to provide it with
    a resting place.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:17
  text: At several villages between Cape Vancouver and the Kuskokwim River, driftwood
    grave boxes are accompanied by guns, bows and arrows, paddles, and similar objects.
  category: object
  evidence_refs:
  - ev:9
- id: obs:18
  text: At the next village south beyond Cape Vancouver, graves on a high knoll have
    long driftwood poles nearby with an ax or gun usually fastened crosswise at the
    top.
  category: setting
  evidence_refs:
  - ev:10
