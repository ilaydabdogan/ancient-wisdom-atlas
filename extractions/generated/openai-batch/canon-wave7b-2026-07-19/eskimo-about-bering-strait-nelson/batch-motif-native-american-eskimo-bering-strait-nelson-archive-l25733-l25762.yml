  quote: The shades of the dead are believed to linger for some time in the vicinity
    of their life scenes
  summary: The passage describes reported beliefs about two or three forms of soul
    or shade, including a visible ghost-form, a sentient invisible shade destined
    for future life, a life-giving warmth that departs at death, and a less clearly
    described shade linked with the body. It also records a three-month drinking avoidance
    after a son's death, meant to prevent harmful shade impurity or emanation from
    entering water and being swallowed.
