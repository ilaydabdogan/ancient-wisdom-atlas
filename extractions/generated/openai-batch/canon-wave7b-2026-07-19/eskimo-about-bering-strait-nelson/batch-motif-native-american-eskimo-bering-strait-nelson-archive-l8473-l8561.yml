canonical_text:
  quote: ''
  summary: 'The passage describes spring seal hunting around St Michael and nearby
    Bering Strait locations: hunters leave villages with kayaks and gear, travel over
    ice and open water, ambush or stalk seals, use white fur garments and a seal-claw
    scratcher to approach sleeping seals, and catalog related knee protectors and
    scratcher specimens.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In spring, people about St Michael leave their village for hunting on the
    ice, hauling kayaks, spears, guns, and other implements on small light sledges.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When open water must be crossed, the kayak is launched, the sled is placed
    on it, and the hunter paddles across before continuing over the ice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Seals are obtained by a hunter hiding on the ice near the water and shooting
    or spearing them as they pass, or by shooting or spearing a seal asleep on the
    ice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After ice breakup, hunters make long kayak hunts among open water, floes,
    and ice cakes to find seals hauled up on the ice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A traveling party with families, dogs, and umiaks on sleds was going to the
    outer edge of St Michael island to hunt seals and planned to return by umiak after
    the ice left the coast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Small hair seals come through holes in the ice in early spring to give birth;
    hunters sometimes cover these holes with an arch of snow and spear the seals as
    they come up.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: For stalking sleeping or sunning seals, the hunter wears white bear- or white
    dog-skin knee protectors and a large matching mitten on the left arm.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The stalker lies flat behind the large fur mitten while the fur hood and mitten
    blend with the snowy surface, allowing the hunter to creep close without detection.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The hunter carries a small scratcher tipped with seal claws and scratches
    snow or ice like a seal digging a hole when the seal becomes uneasy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After reaching the seal, the hunter spears it with a detachable point attached
    to a long line and holds the line; in later years guns were commonly used for
    this kind of hunt.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: A Diomede Islands pair of white bear-skin knee protectors has a triangular
    sealskin extension and a cord running to the hunter's waist belt.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Scratchers from Point Hope, St Michael, and St Lawrence island are described
    with ivory, reindeer-horn, or wooden handles and seal claws fastened by sinew;
    one has a handle carved as a seal head.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
