  summary: The passage gives an ethnographic and technical description of kaiak forms
    around Bering Strait, including Kotzebue Sound kaiak dimensions and deck construction,
    multi-manhole kaiaks attributed to Russian traders from the Aleutian islands,
    paired kaiaks lashed for travel, cargo, sailing, trade, rest, and safety, waterproof
    manhole fittings, and reports of skilled paddlers righting capsized kaiaks.
  language: English
