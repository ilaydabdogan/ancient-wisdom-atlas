literal_observations:
- id: obs:1
  text: Cape Krusenstern and Cape Espenberg kaiaks are described by length, depth,
    and beam as examples of Kotzebue Sound kaiaks.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kotzebue Sound kaiaks are described as long, slender, sharp-pointed at both
    ends, with the manhole somewhat behind center and a flat rear deck.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A raised, curving deck surface in front of the manhole is said to throw off
    water and reduce the force of waves striking the occupant.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Kaiaks with two or three manholes are said to have been introduced along the
    Alaskan coast by Russian traders from the Aleutian islands and to be rarely used
    by natives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: For river or coastal journeys, the Eskimo frequently fasten two kaiaks side
    by side with cross-sticks lashed by rawhide cord.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A stick platform may be made across paired kaiaks to carry small loads, usually
    behind the manhole and sometimes before and behind the occupant.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Near St Michael, two lashed kaiaks were observed with a man in each, household
    goods and bedding behind them, a woman seated on the goods, and a small mast and
    gut-skin sail in front.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hunters in rough weather at sea are said to lash kaiaks together in pairs
    in order to rest or prevent accident.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At King island in stormy weather, islanders lashed kaiaks in pairs and came
    out with furs and other trade articles heaped behind the manholes.
  category: action
  evidence_refs:
  - ev:6
