  quote: ''
  summary: The passage describes forms of uncleanness and ritual removal, including
    bathing in urine, scraping oneself with a human rib at a grave, and purifying
    bladders and hunters with flames during the Bladder feast. It gives an example
    of male relatives avoiding an ill woman's house for fear of losing hunting ability.
    It then describes a grotesque wooden head with animal materials, used by a shaman
    to represent one of his tun-yliiil helpers.
