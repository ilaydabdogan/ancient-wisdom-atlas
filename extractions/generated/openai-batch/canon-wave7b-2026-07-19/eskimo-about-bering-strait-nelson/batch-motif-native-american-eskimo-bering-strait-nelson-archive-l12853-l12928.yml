canonical_text:
  quote: ''
  summary: 'Ethnographic description of pottery among Eskimo communities around Bering
    Strait: women make clay vessels by kneading and tempering clay, forming and ornamenting
    pots, drying and firing them, and using or observing varied pot forms from St
    Michael, Hotham inlet, the lower Yukon, and St Lawrence island.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The manufacture of pottery from clay is described as widely spread among the
    Eskimo communities contacted, and women are stated to be the only potters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At St Michael, tough blue clay is moistened and kneaded, then mixed with marsh
    grass blades and fine black volcanic sand from the beach.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The vessel bottom is made as a round flat layer, and the wall is built by
    carrying a thin band of clay around the edge repeatedly until the desired height
    is reached.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The vessel top is smoothed and may be left plain or slightly scalloped with
    the fingers; sides may be plain or decorated with simple incised marks made with
    a stick.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After shaping and ornamentation, the vessel is dried near a fire and then
    baked with fire built both inside and outside for one or two hours.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a summer camp at Hotham inlet, pots of two to three gallons were observed,
    some with scalloped tops, constricted outlines below the rim, and short parallel
    horizontal lines forming a band down the sides.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The passage reports only two clay-modeling efforts beyond pots and lamps:
    two rude clay dolls obtained at a village on the lower Yukon.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: St Michael earthenware specimens are described with incised dots and multiple
    incised grooves near or inside the rim.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Small St Lawrence island clay vessels were made for suspension over lamps
    using holes, whalebone strips, lugs, or cord.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some small St Lawrence island vessels are described as too small for cooking
    food and probably used for trying out seal oil for lamp use.
  category: other
  evidence_refs:
  - ev:8
