  quote: ''
  summary: The passage describes decorated masks, including a heavy mask representing
    a being that controls the supply of game and is usually represented as living
    in the moon. Shamans are said to pretend to go to this being with offerings when
    hunting has been unsuccessful. The passage also describes festival suspension
    and manipulation of heavy masks in the kashim, and a circular lower Kuskokwim
    mask with a human face, feathers, fish heads, seal heads, thumbless hands, teeth,
    and painted colors, representing the face of a tungliak.
