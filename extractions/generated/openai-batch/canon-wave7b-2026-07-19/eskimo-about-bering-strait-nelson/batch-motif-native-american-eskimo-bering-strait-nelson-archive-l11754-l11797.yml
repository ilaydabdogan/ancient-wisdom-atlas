  text: A sinker made of white ivory has three upright spines that serve as additional
    hooks and is used for tomcod and other small fish.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Large crabs are abundant in deep water from Golofnin Bay to Cape Nome and
    are caught in March and April using dead fish bait on a line lowered through holes
    in the ice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Near Cape Darby in March 1880, the observer saw many people fishing for crabs,
    including a party from Sledge Island who were camping there and living on tomcod
    and crabs after food scarcity at home.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Crab lines are fastened to small sticks set in the snow beside ice holes,
    allowing one watcher to monitor several holes and draw in the line when a crab
    moves the stick.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Small snow shelters are built beside fishing holes to protect fishermen from
    wind; they are open on one side and have crescentic bases, with some partially
    arched over.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: After coastal ice leaves Norton Sound in June, herrings arrive, spawn on seaweed
    near rocky points and bay shores, and are caught with small seines made from rawhide
    or sinew cord.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage identifies the late-June arrival of salmon as the most important
