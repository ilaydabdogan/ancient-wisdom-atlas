canonical_text:
  quote: ''
  summary: 'The passage describes fishing equipment and seasonal subsistence practices
    around Bering Strait: an ivory sinker with upright spines used for tomcod; March-April
    crab fishing through ice holes with baited lines; temporary snow shelters beside
    fishing holes; June herring spawning and seining; and the July-August salmon season,
    including women cleaning, splitting, drying, tying, storing, and selling fish.'
  language: English
  quote_policy: summarized
