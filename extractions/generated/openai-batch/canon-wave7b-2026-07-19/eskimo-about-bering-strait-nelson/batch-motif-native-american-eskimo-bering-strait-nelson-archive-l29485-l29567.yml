canonical_text:
  quote: ''
  summary: A hunter's wife is seized by a giant bird at the river and carried to a
    mountain nest. The hunter climbs to the nest, kills the young eagles, wounds the
    parent birds, and then makes fire, food offerings, and water libations for his
    wife's shade. An editorial note says the tale is believed by lower Yukon Eskimo
    and localizes the nest at an old volcanic crater. The next tale begins with a
    young woman dying, waking in her grave box, and being guided by her dead grandfather's
    shade into an afterlife village, including a house in the village of dog shades.
  language: English
  quote_policy: summarized
