canonical_text:
  quote: ''
  summary: 'The passage catalogues several lance specimens from the lower Kuskokwim,
    Anogogmut, Chalituiut, and Nunivak Island, describing their foreshafts, points,
    barbs, loops, sheaths, and fastenings. It then explains that such lances are used
    against disabled seals or walruses: a hunter paddles close, drives a detachable
    head into the animal, fits another point into the shaft, and repeats the blow.
    Points bear private marks so each hunter can reclaim his own after the animal
    is secured.'
  language: English
  quote_policy: summarized
