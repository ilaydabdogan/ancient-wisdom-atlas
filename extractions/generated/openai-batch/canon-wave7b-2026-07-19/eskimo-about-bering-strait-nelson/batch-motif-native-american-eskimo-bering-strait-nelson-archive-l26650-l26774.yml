  quote: ''
  summary: The passage describes whale-related deposits, whale-shaped charms and implements
    used in whaling, offerings to animal shades, and concepts of taboo or unclean
    places and persons whose influence can cause sickness, death, or hunting failure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cleaned white whale bones are taken to secluded seashore cliffs where dogs
    do not go and are placed with broken spear hafts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A rocky shelter near St Michael contained more than twenty white whale skulls
    and skeletons with numerous broken spear shafts, and nearby smaller deposits were
    similar.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A graphite model of a right whale from Aziak or Sledge Island is described
    as a charm used in right-whale fishing by throwing it on a cord over or across
    a whale so the cord can be drawn around the animal.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the whaling season at Cape Prince of Wales, water-bucket handles are
    carved in whale forms, ivory whale images are attached to buckets, and whale-shaped
    weights are used on cords after whales are killed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that whale images appear in winter festivals where offerings
    are made to propitiate the shades of the animals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A hollow wooden right-whale image from the Diomede Islands is used to store
    lancepoints and is said to have occult virtues that help its owner succeed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Unalit term Xu-na klukh'-tuk is applied to tabooed or feared ground associated
    with offended shades, supernatural influence, uncleanness, or places where animals
    have been killed or died.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Forbidden acts on such ground are said to bring misfortune, including sickness,
    death, or lack of success in hunting or fishing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Chopping wood with an iron ax near a beached dead white whale or near salmon
    being dressed is said to produce death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: An old man reports a case in which a man chopped a log near a woman splitting
    salmon and both died soon afterward; he attributed this to the anger of the salmon's
    inna and the ground's yn-ci.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: If people die suddenly of a strange or unusual disease, occupants may abandon
    the place, saying it is bad.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Evil influence in certain spots may be caused by witchcraft, and shamans may
    sometimes counteract it, though the danger may kill priests as well as others.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Lesser uncleanness is described as an invisible, impalpable vapor-like atmosphere
    that can attach to a person through contamination and cause sickness or bad hunting.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: A contaminated hunter is said to become unusually visible to game and lose
    success in hunting until becoming clean again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Menstruating women are considered unclean, and hunters avoid them; while bladders
    are in the kashim, hunters avoid intercourse with women to avoid offending the
    shades.
  category: action
  evidence_refs:
  - ev:9
