canonical_text:
  quote: ''
  summary: Raven finds three men who have fallen from a pea pod, leads them to land
    near the sea, creates wives and coastal plants and birds, and teaches them fire-making,
    hunting tools, kayaks, and houses. Raven also returns to the first man’s people
    and teaches or causes trees, fire-making, fish preparation, traps, and houses.
    Man and his son learn to hunt seals and reindeer, devise snares, sew skins for
    warmth, and make bows and arrows. A failed seal hunt causes Man to cry for the
    first time, and his household joins him. After mosquitoes eat deer fat, Man tells
    them to eat men, explaining why mosquitoes bite people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven reaches a pea vine and finds three men who have just fallen from a pea
    pod; he leads them in a different direction from the first man and brings them
    to firm land near the sea.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raven remains with the coast men for a long time, teaches them how to live,
    makes a wife for each man, and makes coastal plants and birds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Raven teaches the men how to make a fire drill and bow, bows and arrows, spears,
    nets, implements of the chase, kayaks, and houses of drift logs and bushes covered
    with earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Raven returns to the first man’s people, causes birch, spruce, and cottonwood
    trees to grow, and teaches fire-making, roasting fish, making fish traps, drying
    salmon, and making houses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Man and his son catch and kill a seal, make lines from its skin, and use the
    lines for deer snares; after reindeer bite the cords, the son devises a weighted
    hole-snare to hold a deer fast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After failing to catch seals, Man experiences water running from his eyes
    and involuntary cries; when he returns home, others join in the same wailing,
    and people first learn to cry.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Man tells his people to make a drilled splint bone and use deer sinew to sew
    skins on their bodies for winter warmth, following what Raven had told them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Man shows his son how to make bows and horn-tipped arrows for killing deer,
    and the son kills his first deer with them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Mosquitoes eat deer fat that the son has placed on a bush; Man tells them
