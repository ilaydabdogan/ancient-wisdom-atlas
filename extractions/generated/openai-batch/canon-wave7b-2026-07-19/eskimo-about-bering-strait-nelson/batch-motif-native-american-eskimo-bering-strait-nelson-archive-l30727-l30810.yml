canonical_text:
  quote: ''
  summary: In the village of Kiii-i'-gfm at Cape Prince of Wales, a mistreated orphan
    boy reports seeing a great ball of fire. A fiery apparition and a crawling skeleton,
    called a tunghak, enter the kashim and cause the men to crawl after it and die.
    Later, a young fisherman related to one of the dead men is pursued by the tunghak;
    a thrown frozen fish becomes alive, and thrown dogskin mittens become dogs that
    delay the apparition. After an unexplained instruction from above, a black man
    carries the young man to a fine young woman, who gives him a magic stone amulet
    against the tunghak. The young man later claims to be a shaman, is rejected by
    his father, leaves the village, and is not heard from again.
  language: English
  quote_policy: summarized
