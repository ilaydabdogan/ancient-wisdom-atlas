literal_observations:
- id: obs:1
  text: Open lamps used for burning seal oil are reported across western Alaska, the
    Bering Strait islands, and the Siberian coast; they are made from clay, soapstone,
    or other workable stone and vary in form.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Point Barrow, the narrator saw a large soapstone lamp with stone ridges,
    sunken interspaces, a symmetrical suboval outline, and one side more convex than
    the other; its owner refused to sell it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: At East Cape, Siberia, the narrator saw a stone lamp lying on a grave behind
    the village; it resembled the Point Barrow lamp in outline but lacked interior
    subdivisions.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Siberian coast stone lamp is described as suboval, deeply excavated at the
    back, sloping upward to a broad front ledge, with a central cut in a stone ridge
    for holding the wick.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: On the Diomede islands, similar lamps were in use, and an ivory child's toy
    carved in the shape of a lamp on a stool-like frame was obtained.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Hotham Inlet stone lamp is described as subtriangular, with a nearly straight
