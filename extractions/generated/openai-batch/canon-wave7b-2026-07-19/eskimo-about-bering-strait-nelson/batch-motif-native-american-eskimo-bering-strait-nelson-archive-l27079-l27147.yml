canonical_text:
  quote: ''
  summary: 'The passage describes Bering Strait, Norton Sound, lower Yukon, and Nunivak
    accounts and objects involving mythic or powerful animals: a giant bird or Thunderbird
    that seizes whales and reindeer and is said to prey on people; a remembered last
    pair of such birds nesting on a mountain; etched ivory scenes with dancing, conflict,
    Thunderbird, and man-worm figures; a sculpin called a rainmaker; quartz crystals
    valued as amulets and explained as ice cores turned to stone; a Nunivak claim
    of descent from a dog; and an ivory bear-seal composite carving used as a handle
    and identified as a mythic animal.'
  language: English
  quote_policy: summarized
