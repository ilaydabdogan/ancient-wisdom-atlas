canonical_text:
  quote: ''
  summary: The passage describes informal leadership among Alaskan Eskimo communities.
    Influence is gained through shrewdness, wisdom, age, wealth, shamanism, knowledge
    of traditions and rites, good judgment, and generosity. Headmen lack fixed authority
    but are respected and may be followed in communal decisions. Wealthy traders can
    become leaders when they redistribute food and goods, especially through festivals,
    but self-serving accumulation can lead to enforced redistribution or killing.
    Examples include Tal-ya-luk as a qualified successor to his father and A-gun-a-pai'-ak
    as a domineering trader-leader whose case is connected with killing and property
    division.
  language: English
  quote_policy: summarized
