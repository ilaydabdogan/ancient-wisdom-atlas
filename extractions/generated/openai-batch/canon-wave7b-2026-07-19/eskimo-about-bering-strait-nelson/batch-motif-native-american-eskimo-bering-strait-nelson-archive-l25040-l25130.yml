canonical_text:
  quote: ''
  summary: 'The passage describes several maskettes and a maskoid: a partly described
    maskette used in religious observances; a lower Kuskokwim semihuman wooden maskette
    with a hinged door, labret, earrings, owl feathers, an umiak scene, and hidden
    mythical faces; a lower Kuskokwim disk maskette with a distorted semihuman face
    representing tunghut supernatural beings; and a Razbinsky bird-human maskoid used
    as a finger mask by women in ceremonial dances. Several exact meanings or ceremonies
    are explicitly said to be unknown.'
  language: English
  quote_policy: summarized
