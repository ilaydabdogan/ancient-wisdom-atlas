canonical_text:
  quote: ''
  summary: Raven shows Man the sky land that Raven first made, including its small
    people, animals, clothing patterns, and a ceremonial house. Man later transmits
    the clothing patterns to people on earth. Raven warns Man about dangerous lake
    animals, describes a strange six-legged animal and how it is killed, shows him
    the Moon-dog star-hole bordered by fire-like grass used for the first fire on
    earth, carries him through the star-hole to the bottom of the sea, and changes
    him into a white bear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Where the first man lived, a large village had grown because people followed
    Raven's directions; newborn children were rubbed with clay and reached full stature
    in three days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Man asked Raven about the land Raven had made in the sky, and Raven took Man
    there in a short time.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sky land is described as a beautiful country with a better climate than
    earth, small people, many strange animals, and as the first land Raven had made.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people of the sky land wore handsome fur clothing with ornamental patterns;
    after returning, Man showed his people how to make clothes in that manner.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In a large kashim, an old man identified as the first made by Raven in the
    sky land welcomed Man as a guest from the lower land and had food brought to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Raven warned Man not to drink from lakes they might pass because animals in
    the lakes would seize and destroy him if he went near.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: In a dry lake bed, Man saw a large strange animal lying on the tips of tall
    grass without bending it; it had a long head, six legs, hair, short curved horns,
    small eyes, and a dark or blackish color.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Raven described a method for killing the strange animal: logs were placed
    beneath it so it would not sink into the earth, more logs were held over it, and
    two men beat in its skull with large clubs.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Raven identified a round hole in the sky, ringed by short grass glowing like
    fire, as a star called the Moon-dog.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Raven said his mother had taken some of the fire-like grass and he had taken
    the rest to make the first fire on earth; he said he could not make the same grass
    on earth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Raven told Man to close his eyes, carried him on his wings through the star-hole,
    and descended with him until they reached the bottom of the sea.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the sea bottom, Man could breathe, and Raven explained that the foggy appearance
    was caused by the water.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: Raven told Man that he would make new kinds of animals there and instructed
    him to lie down rather than walk about.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: After sleeping and turning over several times, Man saw that his body had long
    white hairs and long claws; Raven then said he had changed Man into a white bear.
  category: sequence
  evidence_refs:
  - ev:9
