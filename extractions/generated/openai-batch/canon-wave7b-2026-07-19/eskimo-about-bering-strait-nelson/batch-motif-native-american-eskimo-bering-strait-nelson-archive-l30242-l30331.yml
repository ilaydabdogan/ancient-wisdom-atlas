canonical_text:
  quote: ''
  summary: Ak'-chik-chu'-guk kills, dismembers, boils, and restores his brothers with
    the aid of an inua; the brothers then travel by umiak seeking their sister. At
    successive villages, hostile people try to kill them, but Ak'-chik-chu'-guk uses
    bodily magic to disable the attackers and obtain directions. They learn that their
    sister is in the next village as the wife of a powerful wicked shaman. Ak'-chik-chu'-guk
    disguises himself as a feeble old man and is carried into the village, where the
    brothers are shown a young woman in fine furs and told she is their sister; the
    youngest brother remains suspicious.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ak'-chik-chu'-guk orders his brothers to remove their clothing, cuts off each
    brother's head with a knife, and has their mother dismember and boil the bodies
    in an earthen pot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After ordering his mother to stay inside, Ak'-chik-chu'-guk restores his brothers
    to life with the aid of a powerful inua that obeys him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother places decayed fish roe and bird-skin coats into the umiak before
    the brothers begin their search for their sister.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the first hostile village, Ak'-chik-chu'-guk draws his right arm into his
    body, causing all the villagers to lose the use of their right arms until they
    promise peace.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the next hostile village, Ak'-chik-chu'-guk closes both eyes, forcing the
    villagers to do the same, and restores their sight after they promise not to injure
    the brothers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At another hostile village, Ak'-chik-chu'-guk turns his head so his face looks
    backward, causing the villagers' heads to turn backward until they give the usual
    promise.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At a further village, Ak'-chik-chu'-guk's magic forces attackers to put their
    hands behind their backs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The villagers tell the brothers that their sister is in the next village as
    the wife of a powerful wicked shaman, and they warn the brothers not to continue.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Before entering the shaman's village, Ak'-chik-chu'-guk smears his hands and
    face with decayed fish roe, puts on old bird-skin garments, and bends his body
    so that he looks like a feeble old man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The brothers carry the disguised Ak'-chik-chu'-guk into the village and tell
    the shaman that they found the old man on the shore.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The brothers are shown a young woman in fine furs and told she is their sister;
