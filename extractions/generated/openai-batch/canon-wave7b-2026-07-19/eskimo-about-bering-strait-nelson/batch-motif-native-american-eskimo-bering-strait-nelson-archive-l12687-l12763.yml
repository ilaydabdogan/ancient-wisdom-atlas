  summary: The passage records Unalit color terminology, sources of paints and dyes,
    and descriptions of small Eskimo paint boxes. The boxes store paint fragments
    and other small objects and are described in ivory or wood forms representing
    seals, salmon, a human face, and animal features, with carved, painted, inlaid,
    and hair details.
  language: English
