literal_observations:
- id: obs:1
  text: The Unalit term given for picture, image, paint, or color is recorded, and
    the passage states that fine shades of color are not differentiated, though most
    primary colors have names.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists terms for black, white, red, brown or russet, and green,
    and says other shades may be distinguished by comparison with natural objects,
    including clay-color, purple, and blue.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Coloring matter is said to come from organic, earthy, and mineral sources,
    including alder bark, white clayey earth, ocherous earths, oxide of iron, plumbago,
    charcoal, gunpowder, blood, and oxide of copper.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A dark reddish shade for tanned sealskin is obtained by soaking inner bark
    of alder in urine for a day and washing the skin with the infusion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Black paint is made from plumbago, charcoal, or gunpowder, with charcoal and
    gunpowder mixed with blood; green is obtained from oxide of copper.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Small paint boxes are used to store fragments of paint and also small articles
    such as fishhooks and spear- or arrow-points.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: An ivory paint box from Norton Sound is oblong, made mostly from one piece,
    and bears a human face in relief on one end, animal mouth and nostrils on the
    other, and a seal figure on the bottom.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A wooden box from St Michael is oval, represents the body of a seal, and has
    a smaller seal-shaped cover whose projecting head and neck serve as a handle.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: A paint box from the lower Yukon represents a salmon, with eyes, nostrils,
    mouth, gill openings, and lateral line indicated by incised lines.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Norton Sound box represents two seals, one on the back of the other, with
    inlaid bead eyes, incised nostrils and mouths, and relief fore-flippers; a somewhat
    similar Nunivak Island box represents a single seal.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Colored Cape Vancouver boxes represent seals with carved or inserted details
    and painted surfaces, including bluish flippers, red sides or bands, black lower
