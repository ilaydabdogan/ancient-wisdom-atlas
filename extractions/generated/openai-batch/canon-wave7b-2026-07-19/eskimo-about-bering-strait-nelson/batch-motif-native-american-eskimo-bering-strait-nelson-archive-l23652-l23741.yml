canonical_text:
  quote: ''
  summary: 'The passage describes stages of a Bladder Festival ceremony in the kashim:
    restrictions to avoid alarming animal shades, burning and waving wild-parsnip
    stalks, handling a sealskin bag and helmets, attaching grass to bladders, inflating
    and hanging the bag with gull feathers, presenting food dishes, ritually casting
    food toward bladders, making the bladders oscillate to signify acceptance and
    pleasure by animal shades, and repeated dances said to imitate seals and walrus.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Old men instructed that people must not stamp their feet in the kashim that
    day because animal shades were expected to be present and might be alarmed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A bunch of wild-parsnip stalks was lighted and waved flaming toward the cardinal
    points, then the charred stumps were placed at the foot of the stake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two men lighted small bundles of parsnip stalks, waved the flame about the
    bladders, carried the bundles around the room and out to the outer door, and placed
    the charred stalks under the larger bundle on the stake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A sealskin bag was brought in; the men went outside with urine buckets and
    poured urine on the bag while shouting unintelligible words, then returned and
    stripped to the waist.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sealskin bag, with four helmets attached, was lowered through the smoke
    hole by a rawhide line and hung on the stake; helmet owners removed grass from
    the helmets and tied some blades to their bunches of bladders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sealskin bag was inflated, hung by the nose on the sheaf of spears to
    which the bladders were fastened, and given a gull wing-feather on each hind flipper.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the evening the walrus skull and grass mats were placed as on the previous
    evening.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Four men entered one after another with burning parsnip stalks and food dishes,
    sliding the dishes into a corner and taking places side by side in front of the
    bladders.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: One of the four men waved a burning bunch of parsnip stalks tied with spear
    points over the food dishes, the empty water buckets, and the bladders.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The two empty buckets had contained water that symbolized the sea during the
    previous night's ceremonies.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A man made motions as though scooping food from dishes and casting it toward
    the bladders.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A man in an obscure corner pulled a line through a roof loop down to the bladders,
    causing the bladders to oscillate violently.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The oscillation of the bladders was said to indicate acceptance of the offering
    by the animal shades in the bladders.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The four men repeated the rites, drums were beaten, and the men danced in
    front of the bladders while the bladders were swung to indicate pleasure.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The dance included pecking, jerking, galloping, jumping, hopping, sidewise
    hops, and long forward jumps in time with the drums, and was said to imitate movements
    of seals and walrus.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: A half-grown girl stood beside the four dancers swaying with an undulating
    motion; later sets of dancers were accompanied by another substituted girl.
  category: action
  evidence_refs:
  - ev:10
