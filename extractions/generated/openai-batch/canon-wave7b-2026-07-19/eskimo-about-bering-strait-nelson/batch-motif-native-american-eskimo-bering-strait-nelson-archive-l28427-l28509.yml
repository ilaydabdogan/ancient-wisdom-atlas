canonical_text:
  quote: ''
  summary: Ta-ku'-ka deceives three women by promising to make them beautiful, kills
    them with boiling oil, and stages their clothing on stick crosses to look like
    standing figures. The hunter Pi-tikh'-cho-lik' returns, discovers his dead wives,
    and challenges whatever spirit, shade, man, or beast has done it. Ta-ku'-ka, hidden
    in a red bearskin and protected by stones, is mistaken for a bear; she kills him
    and eats his heart. The bearskin closes around her, and a blood-desire drives
    her to kill her sleeping children and wander destructively. The passage explains
    that red bears became savage because Ta-ku'-ka filled them with her rage, and
    it ends with her being killed by a hunter at the Kuskokwim River when an arrow
    passes through a crack in one of the stones on her side.
  language: English
  quote_policy: summarized
