  summary: The passage describes a nephrite lancet from Norton Sound, material variants
    of lancets, a method for extracting an aching tooth with deerhorn and a mallet-like
    blow, and long-handled scratchers used by men on Bering Strait islands to relieve
    skin irritation. It also describes a Sledge Island scratcher and notes a similar
    instrument in a Labrador collection.
