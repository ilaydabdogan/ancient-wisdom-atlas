- id: obs:1
  text: Old women reputed to have childbirth skill act as midwives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Unalit and some other groups, a woman confined with her first child
    was considered unclean and placed alone in a tent or other shelter for a period.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young Malemut woman with her first child was kept outside in winter in a
    snow-covered brush hut, with food passed by her husband through a small opening,
    for about two months.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A newborn is given the name of the last person who died in the village or
    of a deceased relative from another place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child becomes the namesake and representative of the dead person at the
    feast to the dead.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A child born away from the village may be named after the first object seen
    by its mother, such as a bush, plant, mountain, lake, or other natural object.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: An old person may take a new name in hope of extending life, and after such
    a change the former name is considered improper to mention.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some Malemut dislike pronouncing their own names and may ask a bystander to
    provide the information.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Female infants and young girls were formerly killed or abandoned when unwanted,
    with infants exposed naked in the graveyard and snow placed in their mouths so
    they would freeze quickly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator reports seeing a Malemut girl who had been exposed after birth
    but was found by a trader and survived after being taken back.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: An informant said a man might abandon a disliked, crying, or hard-to-feed
    girl on sea ice or tundra during a severe snowstorm.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A St Michael man said he had considered throwing away his newborn daughter
    on the tundra but did not because she was too dear to him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Childless Eskimo couples frequently adopt a child so someone will make customary
    feasts and offerings to their shades after death.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage states that Eskimo people dread dying without assurance that their
