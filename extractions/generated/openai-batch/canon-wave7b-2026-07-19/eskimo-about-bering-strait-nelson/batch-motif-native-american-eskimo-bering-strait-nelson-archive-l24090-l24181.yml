canonical_text:
  quote: ''
  summary: The passage describes the regional use of ceremonial masks among Eskimo
    communities around Bering Strait, especially the lower Yukon and Kuskokwim. It
    explains that shamans make masks representing spirits, shades, supernatural beings,
    totemic animals, and mythological beasts. It also describes beliefs about animal-human
    transformation, inner humanlike forms, double-faced masks, removable or hinged
    outer faces, and ceremonial possession or embodiment by the being represented.
  language: English
  quote_policy: summarized
