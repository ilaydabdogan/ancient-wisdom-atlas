canonical_text:
  quote: ''
  summary: 'The passage describes the Trading festival as observed at Andreivsky on
    the lower Yukon: invitations are sent through a messenger to selected hunters
    and other villagers; the host prepares requested goods and food; arriving guests
    are met on the ice by messengers, perform dances before entering the kashim, receive
    requested articles and food, and later present skins or other goods in an honor-bound
    exchange.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Trading festival is described as a celebration held at irregular intervals
    throughout the region, with the Andreivsky observance used as an example.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fur trader made the festival after receiving instruction from an old Eskimo
    and observing customary ceremonies.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Early in winter, a messenger was sent to several villages to approach selected
    hunters and tell them the trader thought they had skins of mink, otter, or other
    fur-bearing animals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The feast maker and specially invited men were called nas'kuk or “heads” during
    the festival.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Invited heads replied by naming goods they believed the trader had, such as
    powder, lead, or other desired items.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The messenger also addressed young men in the kashim and coordinated the time,
    in a certain moon, when guests could attend.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The chief nas'kuk prepared abundant food and gathered articles desired by
    the invited people before the guests approached in a body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the guests came in sight, a messenger met them on the ice of the Yukon
    and allowed them to send requests to the feast giver.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: An old woman sent word to a little girl in the trader's family that she wanted
    a reindeer skin.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two messengers ran out proclaiming their strength and saying they did not
    steal; another two later repeated the same action.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The last four messengers wore fillets made from reindeer-throat skin with
    long hairs standing up like crowns.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: When the guests neared the feast giver's house, two drums were brought out
    to them, and the guests sang and danced on the ice.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The host villagers sang and danced a welcome after the guests stopped dancing.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: The guests' dancing and singing is explicitly described as a propitiatory
    ceremony customary for strangers first entering a kashim.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: After entering the kashim and sitting down, the guests received requested
    articles from the host and food was distributed to everyone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: In the evening, the heads brought in skins or other articles; each head was
    expected to bring at least one requested skin or be shamed.
  category: action
  evidence_refs:
  - ev:8
