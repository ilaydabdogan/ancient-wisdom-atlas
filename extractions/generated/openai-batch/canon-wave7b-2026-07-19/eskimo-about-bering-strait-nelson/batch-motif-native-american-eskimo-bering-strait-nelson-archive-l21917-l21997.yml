canonical_text:
  quote: This was said to represent a wolf hunting reindeer.
  summary: The passage describes dance performances witnessed at Unalaklit and Cape
    Darby, including drum-accompanied group dances, a masked wolf-hunting-reindeer
    dance, a human-face-mask berry-picking dance, an egg-gathering dance with bird-cries,
    and a general explanation that regional festivals enliven winter, promote friendly
    exchange, and express religious observances.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: At Unalaklit, the narrator stayed overnight and was invited after dark to
    the kashim, where dances were given in his honor.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dozen young men, stripped to the waist, stood in a circle around the room
    while old men near the lamp beat a drum and sang a common dance song.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young men postured and leaped energetically, and the drummers and dancers
    appeared to compete until the dancers acknowledged defeat and sat down.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A lone young man wearing a mask representing a wolf-head stood before the
    entrance hole in the middle of the room and moved slowly with arms and body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two women came behind the wolf-masked dancer and imitated his motions in time;
    afterward they stood to either side while he moved toward each as if trying to
    grasp them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wolf-mask dance was said to represent a wolf hunting reindeer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The same man returned wearing a mask representing a human face and, with the
    two women, performed slow motions of picking berries.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Cape Darby, the entire village population was assembled in the kashim,
    and the visitors gave tobacco to the headman as an offering as strangers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Cape Darby, drumming and a chorus song of meaningless syllables accompanied
    men and women performing ordinary postures until they tired and sat down.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man and woman at Cape Darby performed a new set of motions that the narrator
    was told had been learned from people on the shore of Bering Strait.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A woman at Cape Darby imitated gathering sea-fowl eggs among rocks, with an
    accompanying song intended to represent cries of birds startled from their nests.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that festivals in the described region enliven Arctic winter,
