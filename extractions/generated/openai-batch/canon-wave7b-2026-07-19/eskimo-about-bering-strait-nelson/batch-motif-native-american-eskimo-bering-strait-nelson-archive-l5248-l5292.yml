  quote: ''
  summary: The passage describes snow beaters used by western Eskimo to remove snow
    from fur boots, clothing, and other articles. It gives materials, shapes, and
    regional examples from Sabotnisky, the lower Yukon, St Lawrence Island, Sledge
    Island, and Cape Prince of Wales, including one handle knob carved as a man's
    head.
