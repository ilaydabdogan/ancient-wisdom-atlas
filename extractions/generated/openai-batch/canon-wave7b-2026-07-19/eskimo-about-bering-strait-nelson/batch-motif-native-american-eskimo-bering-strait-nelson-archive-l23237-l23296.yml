canonical_text:
  quote: "“to arouse the shades and call them to the dance”"
  summary: The passage describes mortuary festival practices at Kushutuk and song
    preparation at Askinuk. Participants thump the floor, light lamps, enter humbly
    with new clothing, dance, stamp for cleansing, and make a food offering to the
    shades. Informants explain that the sounds summon shades from grave boxes to enjoy
    the dance and feast. A later song rehearsal is held in darkness so shades may
    listen without being driven away by light.
  language: English
