canonical_text:
  quote: ''
  summary: The passage describes three small wooden maskettes from the lower Kuskokwim
    region. One flattened maskette is painted partly slaty bluish and white, has a
    small pierced face, two splint hoops held with willow-bark lashings, represents
    a half moon, and is connected with winter religious ceremonials, though its exact
    meaning was not learned. A second maskette represents a grotesque semihuman face
    with eyes, mouth, nostril depressions, peg teeth, white feather edging, and a
    rawhide cord; its significance is unknown. A third quadrangular maskette has pierced
    eyes and crescentic mouth, with paddle-shaped sticks inserted on each side of
    the face; the description ends mid-detail.
  language: English
  quote_policy: summarized
