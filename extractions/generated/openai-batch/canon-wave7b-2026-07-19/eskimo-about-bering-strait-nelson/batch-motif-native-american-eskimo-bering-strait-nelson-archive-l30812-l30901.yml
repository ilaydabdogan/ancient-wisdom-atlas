canonical_text:
  quote: ''
  summary: A woman on Sledge Island, abused by her jealous husband, follows her mother's
    instructions involving a prepared sealskin and flees into the sea with her child.
    The sealskin becomes a floating support and carries her through storm, darkness,
    and open water to a strange dark land. There she enters a house, meets a black-faced
    man who shelters her, gives her food, clothing material, and a copper needle,
    and later marries her. Objects she gathered from the beach are eventually revealed
    to be blue beads.
  language: English
  quote_policy: summarized
literal_observations:
