  text: A man, his wife, and their little son live on Aziak or Sledge Island; the
    husband is jealous and treats his wife badly.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife tells her mother her troubles, and the mother instructs her to prepare
    a sealskin with excrement from three ptarmigans and three foxes, fill a wooden
    dish with food, and meet her husband with her child on her back.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the husband returns, he scolds the wife and threatens to beat her.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman casts the sealskin into the water and leaps after it from a low
    bluff over the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The sealskin opens out, gains a float or bladder at each corner, supports
    the woman, and carries her away from shore.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A storm arises and night hides the woman from her husband's sight.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The woman floats for several days without seeing land, uses all her food,
    and reaches a place of unbroken night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After shocks near a pebbly shore, the woman steps from the sealskin onto a
    beach of small rounded objects that sink under her feet.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman gathers two handfuls of the round beach objects into her food dish
    before walking into deep blackness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: She finds a house whose entranceway and room are lit by oil lamps and contain
    deerskins, flesh, whale and seal oil, fat feeding lamp flames, and a deerskin
    bed.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A man enters the house, says he smells strange people, and is described as
    having coal-black face and hands.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The black-faced man washes himself and the woman sees that his chest is white
    like her own.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: An unseen person places cooked flesh inside the door, and the man shares it
