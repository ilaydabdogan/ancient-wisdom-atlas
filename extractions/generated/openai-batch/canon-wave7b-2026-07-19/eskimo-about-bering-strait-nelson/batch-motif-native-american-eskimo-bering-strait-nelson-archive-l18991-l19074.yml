canonical_text:
  quote: ''
  summary: The passage describes inherited rights to productive netting places, communal
    distribution of a young hunter's first large game and of unexpected net catches,
    rules for storing and transporting net-caught seals, ownership claims over unexpected
    game, and several observations about trade, children's errands, and joking behavior.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Productive rocky points for seal and salmon nets are treated as personal property
    and passed from father to son.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a father's death, sons use inherited net places in common until all
    but one obtain new unoccupied places.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a non-owner sets a net in an owned net place, the original owner may remove
    it and set his own net.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Net places may be rented or given out on shares, with the rights holder entitled
    to half the catch.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: A young man's first deer, seal, white whale, or other large game is brought
    to the village, cut up by an old man, and divided among villagers with no portion
    left for the young hunter.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The stated reason for distributing the first large game is that the young
    hunter may later be successful in hunting.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: When a net set for one kind of game catches another, the unexpected catch
    is divided among villagers in the same way, with the explanation that more animals
    of that kind will come to the net.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Seals killed with gun or spear may be taken to the village at once, but fall
    seals caught in nets must be stored in a stone-and-log cache near the netting
    place.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If a net-caught seal carcass is taken to the village before the netting season
    ends, other seals are said to know it, become angry, and stop being taken that
    season.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: If meat is needed, a piece of flesh may be carried overland to the village
    while avoiding the shore; after the season, seal bodies may be carried to the
    village by water.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Unexpected game is treated as a kind of treasure trove and may be claimed
    by the killer even when the killer was hired for a different hunting task.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In one village near Cape Darby, villagers were offended when the narrator
    initially refused to buy their offered objects and later refused to trade with
    him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Villagers sold implements and ivory carvings for trade goods and were described
    as laughing or showing delight over the exchange.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Children near St Michael performed errands and trapped mice or shrews for
    small goods, and some engaged in practical jokes such as mimicking the narrator's
    motions.
  category: action
  evidence_refs:
  - ev:10
