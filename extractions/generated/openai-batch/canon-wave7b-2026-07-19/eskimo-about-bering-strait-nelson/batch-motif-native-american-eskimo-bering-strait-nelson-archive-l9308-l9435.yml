canonical_text:
  quote: ''
  summary: The passage catalogs Bering Strait hunting and fishing cord attachers and
    describes their mechanical use, proveniences, forms, and carved decoration. It
    includes blocks and bar-like ivory pieces used with rawhide loops, with examples
    carved as bears, seals, white whales, human or grotesque faces, an owl, a wolf,
    a hair seal, and a raven totem mark.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One block type is fastened by slipping a loop over a carved head so that it
    falls into a slot or neck and forms a firm attachment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Paimut specimen is carved so that one bear form becomes another bear form
    when turned over, with a seal-head relief placed between the legs of one bear
    and used for the cord loop.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several block specimens have human, seal, or grotesque faces on the head or
    upper surface, and some have rawhide loops inserted to show the method of attachment.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:4
  text: Other blocks have geometric or shaped heads, including diamond-shaped, almond-shaped,
    concentric-circle, oval-ridged, and beak-like forms.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A bar-like ivory cord attacher type is used to fasten the float line to the
    short loop on a detachable spearhead, using two holes and a permanent rawhide
    loop.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: Some bar-like cord attachers are made in the form of a white whale or seal.
  category: object
  evidence_refs:
  - ev:7
- id: obs:7
  text: Another cord-attacher form is a rounded upright block with two parallel holes
    and a grooved neck for a temporary loop.
  category: object
  evidence_refs:
  - ev:8
- id: obs:8
  text: Rounded upright block specimens include human and woman's countenances, labret
    holes, a fur-hood rim, a grotesque face, an owl face, a wolf-head, a hair seal,
    and a raven totem mark.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:9
  text: A Golofnin Bay attacher combines seal features at one end and on the top with
    a whale figure in relief on the lower side.
  category: relationship
  evidence_refs:
  - ev:11
