canonical_text:
  quote: ''
  summary: 'The passage describes Bering Strait Eskimo dance practices: women and
    men perform different movements, women use feather wands and festival finger-masks,
    men perform vigorous rhythmic movements to drums and songs, dances usually occur
    in the kashim during winter and festival contexts, and a stranger entering a village
    kashim for the first time makes a small offering and dances or sings to introduce
    himself. A St Michael example describes tobacco given to the headman before a
    visitor’s short dance. The passage also notes broad similarity of dances across
    Bering Sea islands and the Kuskokwim River, with local variations, and begins
    an account of a Sledge Island performance during hardship.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Both men and women take part in dances, but the passage assigns different
    typical movements to women and men.
  category: action
