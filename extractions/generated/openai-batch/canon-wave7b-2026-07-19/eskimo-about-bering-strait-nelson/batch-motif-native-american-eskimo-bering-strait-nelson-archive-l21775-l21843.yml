- id: obs:2
  text: Women keep their feet planted, sway the body, gesture slowly with hands and
    arms, keep time to the music, and commonly hold long feather wands in both hands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'During certain religious festivals, women use finger-masks: small flat wooden
    pieces with finger holes, carved as human, animal, inua, or supernatural faces,
    painted and ornamented with hair fringe and feathers.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men shift weight between feet, advance the free foot, thump the heel in time
    with drums, contort the body, gesture rhythmically, and sometimes sing or utter
    loud cries while springing side to side.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rhythmic drums and songs bring dancers to great excitement; some continue
    for hours with violent exertion until they stop from exhaustion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: With rare exceptions, dances are performed in the kashim during winter months
    from October to the end of April.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Songs and dances are practiced beforehand for great festivals, and smaller
    informal dances occur among villagers in early winter, performed for amusement
    by a few young men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A stranger entering a village kashim for the first time is expected to make
    a small offering or propitiatory gift to the headman, who divides it among the
    other old men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the offering, the stranger dances briefly and may sing a friendship
    song or a chorus song; this is said to introduce him properly and gain him the
    freedom of the kashim.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At St Michael, the narrators brought tobacco to the headman at the first autumn
    dances; he divided it among the other men, and a short Eskimo-style dance by a
    visitor was received with merriment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that dances on the islands of Bering Sea and on the banks
