  text: The tobacco used at the time described is obtained from traders and usually
    comes as natural leaf tied in small bunches called hands.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: For chewing, tobacco is cut into shreds on small boards, mixed with ashes
