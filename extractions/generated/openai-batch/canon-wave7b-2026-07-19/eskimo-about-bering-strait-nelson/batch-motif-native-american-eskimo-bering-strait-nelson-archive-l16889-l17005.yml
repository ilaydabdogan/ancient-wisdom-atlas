literal_observations:
- id: obs:1
  text: The passage states that tobacco was introduced among the Alaskan Eskimo from
    Asia by way of Bering Strait through Siberian neighbors, and that pipes with cylindrical
    bowls and wide rims came by the same route.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Both sexes use tobacco, but the passage distinguishes usual practices: women
    usually chew it or take snuff and rarely smoke, while men use it in all these
    ways.'
  category: attribute
  evidence_refs:
  - ev:2
