  quote: ''
  summary: 'The passage gives an ethnographic account of tobacco among the Alaskan
    Eskimo about Bering Strait: its stated introduction from Asia through Siberian
    neighbors, gendered methods of chewing, snuffing, and smoking, preparation of
    tobacco with tree-fungus ashes, trade in fungus and tobacco, use of quids and
    pipe-stem extract, and implements used for smoking and snuff-making.'
  language: English
