  quote: ''
  summary: Ethnographic passage describing food sources, preparation, preservation,
    and seasonal gathering among Eskimo communities around Bering Strait, including
    game and fish boiling, drying, freezing, pit storage, rendered oils, delicacies,
    eggs, berries, sorrel, and willow leaves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes the Eskimo food supply as essentially composed of game
    and fish, with large game commonly boiled in sea water for salty flavor.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Meat is sometimes kept for long periods in underground pits and may become
    semiputrid; at Point Barrow stored deer carcasses were covered with bluish fungus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Summer meat and several fish species are dried, hung on frames or strings,
    tied into bunches, packed in bundles, or placed in storehouses for future use.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Herring roe is gathered on seaweed, sometimes dried and preserved for winter,
    then boiled and eaten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Whitefish oil is rendered on the lower Kuskokwim and toward the Yukon and
    stored in bags for winter use.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fish and meat are usually boiled, though sometimes roasted over an open fire;
    winter fish may be stored frozen in grass bags and eaten raw while frozen or boiled.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: King salmon heads are buried in straw-lined, turf-covered pits until decayed,
    then kneaded in a wooden tray into a paste eaten as a favored dish by some people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Women chew reindeer back fat into a paste, mix it with snow and salmon or
    cranberries, knead it, and the compound is considered a major delicacy for guests
    and feasts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Seal, walrus, or whale blubber is stored and eaten, or rendered into oil used
    both as food and as lamp fuel.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Dried fish or other meat is dipped into oil served in a small wooden tray
    or dish, while seal oil is drunk only as a purgative.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Whitefish oil, walrus flippers, white-whale skin, seal or large-game blood
    stew, and boiled-meat soup are described as relished or choice foods.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Women gather wild-fowl eggs in spring marshes, while on islands waterfowl
    and their eggs are taken from sea-facing cliffs, and molting geese and ducks are
    speared or netted.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: In autumn women gather berries for winter storage and prepare wild sorrel
    by boiling, crushing, and fermenting it in water in the sun.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Young willow leaves are boiled and eaten.
  category: action
  evidence_refs:
  - ev:11
