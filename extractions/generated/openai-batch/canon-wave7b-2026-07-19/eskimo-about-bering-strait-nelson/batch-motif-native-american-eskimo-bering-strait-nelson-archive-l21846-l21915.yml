canonical_text:
  quote: ''
  summary: The passage describes dances performed in a kashim for visiting guests
    on Sledge Island, including opening male dances, bird-skin head ornaments, paired
    dances, a long seated women's unison dance directed by a headman, and a comparison
    with a Sabotnisky dance in which women used gestures to narrate warfare, berry
    picking, and seasonal occupations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The inhabitants were expected to feed the visitors' dogs and give a dance
    in the kashim in the visitors' honor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After dark the visitors were invited into the kashim and placed at the rear
    end of the room as a place of honor.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: About half a dozen men, including village headmen, danced in time to singing
    and drumming.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One dancer wore a brow fillet made from the head and neck skin of an Adams
    loon, with the beak projecting over the forehead.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another dancer wore a fillet made from the white breast of a murre with a
    gerfalcon wing feather standing erect over the forehead.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man and woman performed paired dance figures, followed by a boy and girl
    whose varied motions were in perfect unison.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nine women and girls sat cross-legged on a side bench, stripped to the waist,
    and performed long, complicated swaying motions with head, arms, and body in unison.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The women's light-colored bodies appeared in profile against a sooty wall
    while they moved slowly and regularly to singing and drumming.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The headman asked whether the visitor liked the dance, said several dancers
    were his wives, and then directed the singers to change songs and motion sets.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: More than twenty distinct songs and sets of motions were performed, with some
    slow and others rapid; the narrator states that the movements were conventional
    and carefully learned.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Sabotnisky, a woman used dance gestures to tell the story of her father's
    life and battles before the arrival of white men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The narrator could interpret gestures of stealthy approach and retreat, struggle,
