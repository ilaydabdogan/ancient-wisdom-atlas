canonical_text:
  quote: ''
  summary: 'The passage catalogs implements for making thread and cord: walrus-ivory,
    deerhorn, and ivory shredders; combs used for grass thread; sinew twisters with
    deer-head figures; thread reels also used as shuttles; Nunivak thread reels carved
    as half-woman, half-seal mythical beings or as seals; and an ivory sinew cord
    spinner whose revolving rod twists sinew.'
