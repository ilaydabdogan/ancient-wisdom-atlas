canonical_text:
  quote: '"the journey he had just made into the sea, following the shades of the
    seal bladders"'
  summary: 'The passage describes the close of a bladder festival: a bound shaman
    is believed to have traveled far away and later reports a sea journey after seal-bladder
    shades; the shades praise or criticize hunters. The men then undergo a heated
    midnight purification bath. The passage also records parallel observances in nearby
    kashims and villages, including bird-associated sounds and images, paddles planted
    in snow, bladders placed in a lake, noise taboos, work and travel restrictions,
    and a threatened death consequence for violation.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Men in the kashim continued drumming and singing during the shamanic performance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A groan was heard from the shaman, and he was found still bound but about
    five feet from where he had been placed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A cord fastened to the shaman's neck, with one end held by his assistant,
    had been pulled under the floor for ten or fifteen yards.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people in the kashim believed the shaman himself had drawn out the cord,
    indicating that he had traveled far away.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After being unbound, the shaman sat by the exit hole and told a long story
    of a journey into the sea following the shades of seal bladders.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The shaman said he talked with all but two of the shades and saw some bladder
    shades playing together in the water.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some shades were said to be pleased with the men who had taken them and given
    them a fine festival; others complained that hunters had treated them badly and
    had not offered enough food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The shaman named hunters and represented the bladder shades as harshly criticizing
    some of their prominent faults.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: At midnight the men stripped, the floor was removed, and a great fire was
    made in the pit until it became a bed of glowing coals and produced intense heat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The men bathed in urine retained in wooden buckets, which was said to cleanse
    them from evil influence connected with the recent presence of the shades.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: No one was permitted to leave the kashim until the bath had been taken, and
    no one was permitted to hunt or fish during the festival.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: A second kashim in the same village held a similar festival with the same
    interior arrangement, except that a wooden image of a man wrapped in eider-duck
    skin replaced a suspended gull image.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The bladders were reportedly kept in the kashim for seventeen days, with a
    different set of ceremonies each day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: At Kaialigainut, the bladders had been put into a small lake, and four kayak
    paddles stood in front of the kashim with their blades planted in the snow.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: At Kaialigainut, stamping snow from the observer's feet prompted a chorus
    of eider-duck sounds, showing that loud noise was tabooed there also.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: An old man brushed snow from the observer's fur clothing, pointed to an inflated
    sealskin hanging overhead, and asked him to move elsewhere in the room.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: Any slight noise at Kaialigainut prompted eider-duck notes, and when a dog
    entered, everyone grunted loudly until the dog left.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: At Kaialigainut, no work and no departure from the village were permitted
    until after a midnight bath; breaking the rule was believed to cause someone to
    die before another feast.
  category: sequence
  evidence_refs:
  - ev:11
