canonical_text:
  quote: ''
  summary: The passage describes hereditary family or totem marks among Eskimo communities
    near Bering Strait, including a dog ham-bone mark, a wolfskin-and-wolf door mark,
    a red bear sign adopted after a hunting feat, decorated tobacco-board signs, and
    grave-box figures indicating a reindeer-hunter relation. It then summarizes warfare
    before Russian arrival, including conflicts with Tinne and Magemut groups, ambush
    tactics against kashims, high-point village defenses, invitation songs for war
    parties, and remains of a destroyed ancient village near St Michael.
  language: English
  quote_policy: summarized
