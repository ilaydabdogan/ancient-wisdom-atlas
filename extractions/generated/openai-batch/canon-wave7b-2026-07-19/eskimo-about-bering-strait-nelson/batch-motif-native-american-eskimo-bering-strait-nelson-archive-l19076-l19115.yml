  summary: The passage describes joking, teasing, and practical jokes among young
    men and Point Hope traders; a gesture used to request whisky from people who do
    not understand the local language; a lower Yukon and southward reciprocal trading
    custom in which a first gift obligates a return of similar value until the initiator
    stops; and an anecdote about fur traders exploiting that custom to obtain furs
    and goods.
  language: English
