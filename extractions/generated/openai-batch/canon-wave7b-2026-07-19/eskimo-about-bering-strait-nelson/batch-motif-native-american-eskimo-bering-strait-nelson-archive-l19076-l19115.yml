  text: Young men on hunting excursions and in winter camp or festival settings are
    described as telling stories, joking, singing, and laughing at one another for
    being sleepy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a bladder feast, a sleepy young man answered teasing by saying he saw three
    of everything and by accusing a nearby comrade of being unable to find his mouth
