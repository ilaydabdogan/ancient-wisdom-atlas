  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Point Hope men repeatedly offered worthless articles after valuable items
    had been sold and laughed when the offers were rejected.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Point Hope men used hand and head gestures to indicate that they wanted whisky
