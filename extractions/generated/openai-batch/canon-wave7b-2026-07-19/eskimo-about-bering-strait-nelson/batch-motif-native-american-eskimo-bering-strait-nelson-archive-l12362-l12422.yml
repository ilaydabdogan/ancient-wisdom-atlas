  summary: The passage describes marlinspikes as net-making implements used for tying,
    slipping, enlarging, reducing meshes, and loosening knots. It catalogs examples
    from several Bering Strait and western Alaska locations, noting materials such
    as reindeer horn, ivory, bone, wood, rawhide, spruce root, and sinew, and describes
    decorative or representational incisions including walrus, houses, a murre head,
    whales, and hunting scenes.
