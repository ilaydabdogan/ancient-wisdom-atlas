canonical_text:
  quote: ''
  summary: Ethnographic description of marriage customs among the Unalit and neighboring
    lower Yukon-Kuskokwim peoples, including parental consent, garment presentation,
    residence after marriage, consanguineous marriage preferences, child betrothal,
    puberty impurity in child marriages, polygyny, divorce grounds, contests over
    women, bond-fellow wife-sharing, kin terms, and premarital sexual autonomy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Unalit young man who wishes to marry tells his parents, and one parent asks
    the girl's parents for consent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After consent is obtained, the suitor dresses in fine clothing, brings a new
    suit of garments to the bride's house, puts it on her, and she becomes his wife.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A newly married couple lives with parents who have no children at home; otherwise
    they establish a new or shared household.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Unalit frequently marry first cousins or more remote blood relatives,
    but brothers and sisters, including step-siblings, do not intermarry.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A stated rationale for marrying blood relatives is that a related wife is
    expected to share food fairly with her husband in famine, while a wife from another
    family is feared to favor her own survival.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The wife is described as becoming more part of the husband's family than he
    becomes of hers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: From the lower Yukon to the Kuskokwim, child betrothals are described as common
    and can involve a boy being placed with the family of a small girl to become her
    husband.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A boy may choose a family with a girl, bring clothing, implements, and a suit
    of clothes for the future bride, leave his own parents, and transfer filial duty
    to an adopted father.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In these arrangements the girl may be very young, often not over four or five
    years old, and some arrangements are made before the girl is born.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: In child marriages, when the girl reaches puberty, both she and her husband
    are considered unclean and are prohibited from work for a month.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: At the end of the month, the young husband takes presents to the kashim and
    distributes them; afterward he has the rights of other heads of families.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Men able to provide may take two or more wives; in such households the first
    wife is regarded as head of the family and has charge of the food.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: A man may discard a wife for scolding, unfaithfulness, or keeping the best
    food for herself; a woman may leave a cruel husband or one who fails to provide
    subsistence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: An old man reported that in ancient times a husband and lover quarreling over
    a woman were disarmed by neighbors and settled the matter by fists or wrestling,
    with the victor taking the woman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Two men from different villages may become bond fellows or adoptive brothers;
    during visits, each receives the use of the other's bed with the host's wife,
    and the arrangement is reciprocal.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: Because of the bond-fellow arrangement, the passage says neither family knows
    who is the father of the children, and it records kin terms used among the men,
    wives, and children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: A man may have the rights of a husband before living regularly with the woman,
    and unmarried females are described as free to decide in this regard.
  category: relationship
  evidence_refs:
  - ev:8
