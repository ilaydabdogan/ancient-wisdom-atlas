canonical_text:
  quote: ''
  summary: A girl-shade travels in the land of the dead with help from her grandfather's
    shade, crosses a river made of mourners' tears, is identified by totem marks,
    receives water and food linked to offerings from the living, learns that dying
    thoughts summon dead relatives as guides, and later returns invisibly with ancestral
    shades to a feast of the dead, where she is separated from them and recognized
    by living people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The traveler and her grandfather come to another village with a large kashim.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man-shade lies on the ground with grass growing through his joints; he can
    move but cannot rise, and the grandfather says this is punishment for pulling
    up and chewing grass stems while on earth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the girl turns to speak to her grandfather, he has disappeared, and a
    path extends ahead toward a distant village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A swift river bars the girl's way; the river is said to be made from tears
    shed on earth for the dead.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the girl weeps, straw and house-refuse float to her, stop before her,
    serve as a bridge for crossing, and vanish after she reaches the far bank.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The shades smell the girl before she arrives, crowd around her, ask who she
    is and where she comes from, and examine the totem marks on her clothing to identify
    her village and family.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The grandfather's shade comes to the girl, takes her by the hand, and leads
    her into a nearby house where an old woman, identified as her grandmother, invites
    her to sit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The grandmother tells the girl to drink only from the nearly empty tub of
    their own Yukon water and not from the tubs of water belonging to the village
    of the shades.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:9
  text: The grandmother gives the girl deer fat and says that the girl's father had
    given both the deer fat and the tub of water to the grandparents at a festival
    of the dead.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The grandmother says the grandfather became the girl's guide because the girl
    thought of him while dying; such a thought is heard in the land of shades, and
    the dead relative thought of hurries to show the new shade the road.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Two messengers are sent from the dead girl's village to invite neighboring
    villagers to the feast of the dead, and at a village they hear drums and dancers'
    feet in the kashim.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The grandfather's shade, grandmother's shade, and girl sit invisibly among
    the people, follow the messengers back, and later wait outside the kashim for
    names to be called in a clothing ceremony for namesakes of the dead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: As the shades leave the kashim, the old man pushes the girl, causing her to
    fall and lose consciousness; when she wakes alone, she waits under a burning lamp
    and sees living people come out in new clothing, but sees none of her companion
    shades.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: An old man with a stick sees the girl-shade standing with her feet raised
    above the floor, asks whether she is alive or a shade, alerts the men in the kashim,
    and by lamp light they recognize her and take her into her parents' house.
  category: sequence
  evidence_refs:
  - ev:10
