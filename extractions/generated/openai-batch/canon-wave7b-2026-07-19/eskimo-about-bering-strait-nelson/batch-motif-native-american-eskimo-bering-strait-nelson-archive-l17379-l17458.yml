  quote: ''
  summary: The passage catalogues several wooden or ivory quid boxes from Bering Strait
    communities. It describes their shapes, fitted covers or stoppers, animal and
    human-head representations, inlaid facial features, painted colors, cords, handles,
    and other construction details.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One box or lid is described with a young walrus figure forming the lid, relief
    flippers, inlaid bead eyes, and tusks made of wood and bone.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: An Askinuk specimen is an oval grotesque box with two long flipper-like projections
    and a cover representing an upturned seal head that functions as a thumb-piece.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: An Anogogmut box is egg-shaped, flattened above and below, carved mostly from
    a single piece of wood, and decorated with inlaid beads, crockery pieces, and
    a relief gored pattern.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Kulwoguwigumut box, when held cover downward, represents a grotesque porcupine
    figure with incised mouth, ivory-peg eyes and nostrils, and three round-head ivory
    pegs set in a triangle on the rear side.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A circular Kushunuk box has a stopper-like cap carved in low relief with a
    man's face, ivory-peg eyes and labrets, a crescentic mouth, and a rawhide loop
    through the cover.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A round wooden box from Sledge Island is made in two nearly equal fitting
    parts and is cracked on one side, where it is bound with a sinew cord.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: A small wooden Chalitmut box has the form of a human head, with relief-carved
    face, inlaid bead eyes and labrets, ivory pegs around the face, a fitted cover
    at the back, and red, black, and bluish paint.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Another Chalitmut box is carved as a bear's head, painted black with red mouth
    and nostrils, and has a cover arranged so that the lower jaw of the open mouth
    serves as the thumb-piece.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: An oval wooden Kushunuk quid box has neatly fitted top and bottom, incised
    grooves, a rawhide loop, inlaid round ivory pegs, bluish paint, and red grooves.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: An ivory Unalaklit quid box has four seal figures carved in relief on the
    surface, a braided grass cord handle, a wooden stopper closing the bottom, and
    a missing cover.
  category: object
  evidence_refs:
  - ev:10
