canonical_text:
  quote: ''
  summary: Doll travels along the edge of day and the sky wall, cuts covered sky openings
    in several directions, releases winds carrying reindeer, trees, rain, spray, snow,
    and ice, then closes and instructs the openings. He sees another world beyond
    a sky opening and later sees the sky arch supported by long poles at the middle
    of the earth plain. He returns to the village, lives for generations, dies, and
    is said to be the source from whom people learned mask-wearing and the custom
    of making dolls for children. A following tale introduces Yukhpuk, a strong man
    who moves part of a mountain to create the Kuslevak mountains, leaves water-filled
    footprints as lakes, and names places along the Yukon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The man and his wife stop following and go home, while Doll continues along
    a bright path to the edge of day, where the sky comes down to the earth and encloses
    the light.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the eastern sky wall, Doll sees a hole covered with gut-skin; the cover
    bulges inward from force on the other side.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Doll cuts the eastern cover loose; wind enters with live reindeer, Doll sees
    another world beyond the wall, then he closes the cover and tells the wind to
    vary between hard, light, and no blowing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At a southeastern opening, Doll cuts another cover; a gale enters bringing
    reindeer, trees, and bushes, and he closes and instructs it like the first.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a southern opening, a hot wind enters with rain and spray from a great
    sea beyond that sky hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: At a western opening, the wind brings a heavy rainstorm with sleet and ocean
    spray; at a northwestern opening, a cold blast brings snow and ice and chills
    Doll.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the northern opening, the cold is intense; when Doll cuts the cover, a
    fearful blast carries masses of snow and ice over the earth plain, and he quickly
    closes and admonishes it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the middle of the earth plain, Doll sees the sky arching overhead, supported
    by long slender poles arranged like those of a conical lodge and made of unknown
    beautiful material.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: Doll returns to the village, circles it once, enters the houses one by one,
    and enters his own home last so that the people will be his friends and care for
    him if his parents die.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Doll lives in the village for a very long time; after his foster parents die,
    other people take him in, and he lives for many generations before dying.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: People are said to have learned the custom of wearing masks from Doll, and
    after his death parents make dolls for children in imitation of the people who
    made him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A strong man named Yukhpuk lives in the Askinuk mountains near the Yukon River.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Yukhpuk picks up part of the mountains, carries it to level country, throws
    it down, and thereby makes the Kuslevak mountains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: When Yukhpuk throws down the mountain, his feet sink into the ground, leaving
    two deep pits that fill with water and become two small lakes at the mountain’s
    base.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: Yukhpuk travels up the Yukon and gives names to all the places he passes.
  category: action
  evidence_refs:
  - ev:6
