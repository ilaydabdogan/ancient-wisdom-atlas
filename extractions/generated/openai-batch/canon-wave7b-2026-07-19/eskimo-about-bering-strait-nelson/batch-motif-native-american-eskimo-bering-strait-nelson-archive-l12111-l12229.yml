canonical_text:
  quote: ''
  summary: The passage describes fish seine components and net-making implements from
    several Bering Strait and nearby Arctic localities, including stone sinkers, ivory
    or bone weights, handles, gauges, and decorated tool parts. It also describes
    an annual lamprey run on the Yukon after fall freeze-up, when people keep holes
    open in the ice and catch fish with dip-nets or cross-piece sticks, moving upstream
    until exhausted or until reaching another village. A raven totem mark on a bone
    handle, a seal-head image on a gauge handle, and a hand form compared with regional
    depictions of mythological beings are noted.
  language: English
