canonical_text:
  quote: ''
  summary: The passage reports shamanic claims of visiting the land of the dead, including
    rebirth through an unborn child and fire ordeals in which shamans are said to
    die and return. It describes one failed fire-return attempt, offerings at the
    grave of the dead shaman, a detailed staged fire ordeal involving assistants,
    a mask, a pyre, and an apparent walking-in-air display, and then discusses amulets,
    fetiches, heirlooms, and objects used for hunting success or protection.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old shaman said he had died, gone to the land of shades, remained there
    until tired, returned to earth, entered the body of an unborn child, and was born
    again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shamans in the region south of the lower Yukon and around Norton Sound claim
    a method for visiting the land of the dead by being burned to death and afterward
    returning to life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An Eskimo guide identified the grave of a shaman who had tried the fire-return
    method and failed to return after being burned to death.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The informant said many shamans caused themselves to be burned to ashes and
    then returned to life, with even their clothing showing no trace of fire.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The failed shaman’s body was said to have reappeared unharmed except for a
    small burn on one shoulder, but he did not become alive.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: People passing the failed shaman’s grave made small offerings of food and
    other things to propitiate his shade.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In a village south of the Yukon mouth, a shaman gathered villagers, said he
    wished to be burned and return for greater service to them, directed the building
    of a drift-log crib, chose two assistants, and was bound and masked.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The assistants set fire to the pyre; villagers saw the mask through smoke
    and were ordered to remain indoors until morning under threat of the anger of
    the tunyliit.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the villagers went indoors, the assistants unbound the shaman, put a
    log of wood behind the mask, and the shaman hid nearby while the mask and crib
    burned.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At daybreak the shaman took firebrands from the pyre, went onto the kashim
    roof by the smoke hole, waved a sparking firebrand over the translucent cover,
    and moved his feet so people inside said he was walking in the air over the window.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After entering the kashim, the shaman was afterward considered a great shaman.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The fire ordeal was said to give the person enduring it power to cast off
    or assume bodily form at will and to increase his other powers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Amulets and fetiches could be made of wood, stone, bone, or almost anything
    else, and their virtue could be inherent or gained through shamanic power or the
    aid of one who knows.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: An heirloom could become a fetich through great age and long possession in
    one family; such objects were handed down from father to son and were said to
    have reason and supernatural powers to aid and protect owners.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Objects used for hunting success included dried bodies of newborn infants,
    and other objects were said to protect their owners from bodily injury.
  category: object
  evidence_refs:
  - ev:8
