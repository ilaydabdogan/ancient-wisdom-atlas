  quote: ''
  summary: The passage catalogs powder chargers and powder flasks used with guns and
    in hunting, noting materials, carved animal or human forms, ornaments, stoppers,
    and imitation of trader-sold forms. It then describes right-whale hunting with
    spears and firearms, including Plover Bay use of a bomb gun learned from whalers,
    and a walrus-driving method using kayaks, shouting, and paddle strikes in shallow
    bays.
