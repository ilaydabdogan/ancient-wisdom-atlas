literal_observations:
- id: obs:1
  text: The passage describes the Eskimo of Bering Sea and the lower Yukon as fond
    of singing, with songs used in religious observances, festivals, sports, dances,
    and travel.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men are usually the singers and may chant for hours during travel by water
    or during cold sledge journeys.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One man explained night singing by saying that it made him feel warmer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some songs and dance refrains are described as series of meaningless syllables.
  category: speech
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:5
  text: Songs may be composed to preserve past occurrences, glorify events, or ridicule
    others before an assembled audience.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Shamans employ songs in incantations and during religious festivals.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Special songs are sung to shades of the dead and to various inuas, with petitions
    to prevent evil or secure successful hunting.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Songs in the kashim are usually accompanied by regular beating of tambourine-like
    drums held by old men, who often lead the singing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Songs for major religious festivals, for the dead, and for the bladder feast
    are practiced for a long period and taught a few words at a time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some songs are said to have been transmitted from ancient times from generation
    to generation, like folktales.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At a village near Cape Vancouver, a song for the feast to the dead was taught
    in the kashim after the lights were extinguished, with about twenty-five men singing
    to a single drum.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: A wailing song calls on shades of the dead to enter offerings given during
    their festival.
  category: action
  evidence_refs:
