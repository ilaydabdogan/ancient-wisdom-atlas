canonical_text:
  quote: ''
  summary: The passage describes finger rests, a seal-head cord-guiding fitting for
    a spear shaft, and several forms of bird spears used around Bering Strait. It
    details materials, point arrangements, barbs, serrations, feathering, regional
    specimens, and the use of bird spears to capture molting waterfowl and young water
    birds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two finger rests from the lower Yukon and Nunivak Island are described as
    roughly triangular and having three holes along the base for a cord.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A small curved object from Sledge Island has a seal-head on top, five holes
    along the base, and is lashed to a spear shaft to guide a cord in a different
    direction without tying a knot.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Eskimo are said to use spears for killing seals, walrus, and white whales,
    and to have several forms of spears for capturing birds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A common bird spear form has a round wooden shaft, three long rounded tapering
    points, inward-facing serrations, a triangular point arrangement, sinew lashing,
    and braided sinew cord.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bird spear examples differ in shaft length, feathering, materials such as
    deerhorn and bone, and the direction of serrations on their points.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Some bird spears from Nunivak Island and the adjacent mainland have four points,
    lack feathering, and have serrations on the inner faces of the points.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Another bird spear form has a long point of bone, ivory, or deerhorn at the
    end of the shaft and three oblique points set about one-third of the distance
    from the butt, forming a triangle.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Detailed specimens include bone, ivory, and deerhorn points; triangular, hexagonal,
    oval, or other cross sections; barbs or serrations; cormorant feathers; and rawhide
    or sinew lashings.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bird spears are used for capturing waterfowl, especially in late summer and
    fall when geese and ducks have molted wing feathers and cannot fly, and also for
    young water birds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The three prongs on the spear shaft are intended to catch a bird by the neck
    or wing if the main point misses; the spear is thrown so the shaft slides along
    the bird’s back or neck.
  category: action
  evidence_refs:
  - ev:8
