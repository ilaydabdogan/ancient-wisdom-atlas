canonical_text:
  quote: ''
  summary: The passage describes a stage of a mortuary feast in which feast givers
    display goods, clothe namesakes of deceased relatives, address the shades of the
    dead, direct them back to their burial places or river, and continue with armed
    performances, communal dancing, restrictions on leaving, a fire, a sweat bath,
    and dispersal the next morning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Large bags belonging to male and female feast makers were lowered, opened,
    and their contents displayed while the owners shouted fictitious histories of
    how the articles had been obtained.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Each bag contained several suits of fur clothing intended for the namesakes
    of the dead.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: After emptying a bag, a feast giver called for a beloved deceased relative,
    and the namesake of that relative came forward from among the people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The feast giver removed the namesake's clothing, put a complete new suit on
    the namesake, and placed the discarded clothing and bags in the namesake's arms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: As the namesake turned away, the feast giver loudly told the shade of the
    relative to return to the grave where its bones lay.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some shades were directed to circle a grave, village, or kashim before entering
    the grave; shades of drowned persons were told to return to the river.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the festival the shades of the dead were said to congregate in the
    pit under the floor of the kashim, or sometimes to be invisibly present in the
    kashim itself.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the last day the shades were believed to enter the bodies of their namesakes,
    so that clothing put on the namesakes also clothed the shades.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a relative ordered a shade to return to its burial place, it was believed
    to obey and go back wearing the essence of the new clothing.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two male namesakes received complete suits of clothing along with loaded guns,
    powder, caps, bullet pouches, and similar articles.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: After receiving their gifts, the two armed men danced, shouted, flourished
    their guns, and one declared that he would guard and protect the village from
    danger while firing toward the roof.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Namesakes later left extra garments at their homes and returned to the kashim;
    feast givers also exchanged old garments for new ones.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Old men resumed a chorus song with drums while boys and young men danced in
    the middle of the room until the middle of the night.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: No one was permitted to leave the village until the concluding dance ended,
    because leaving was considered offensive to the shades and a cause of misfortune
    for the villagers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the dance ended, a great fire was lit in the kashim, the men took a
    sweat bath, and the guests dispersed the next morning.
  category: sequence
  evidence_refs:
  - ev:8
