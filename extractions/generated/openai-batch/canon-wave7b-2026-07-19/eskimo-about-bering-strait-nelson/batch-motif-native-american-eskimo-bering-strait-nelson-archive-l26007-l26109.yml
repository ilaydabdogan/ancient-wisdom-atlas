  quote: ''
  summary: The passage describes Unalit and neighboring Bering Strait Eskimo beliefs
    about supernatural powers, including foretelling, clairvoyance, witchcraft, amulets,
    the special recurrence of the number four, a decentralized spirit world, shamanic
    authority and calling, shamanic control of tun'ghak beings, exorcistic work, shapeshifting
    spirits, and shamanic journeys to the land of the dead.
  language: English
  quote_policy: summarized
