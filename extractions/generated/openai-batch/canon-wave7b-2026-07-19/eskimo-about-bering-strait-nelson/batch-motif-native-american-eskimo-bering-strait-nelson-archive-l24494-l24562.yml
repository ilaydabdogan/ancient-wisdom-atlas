canonical_text:
  quote: ''
  summary: 'The passage describes two masks: a human-figure mask from south of the
    Yukon mouth with outstretched limbs, thumbless hands, punctured palms, feathers,
    painted details, and a face on the body identified as representing the inua of
    the being; and a lower Kuskokwim hair-seal mask with openings for facial features,
    a movable head, flippers, side doors bearing white-whale images, and a concealed
    face on the seal''s back identified as the inua.'
