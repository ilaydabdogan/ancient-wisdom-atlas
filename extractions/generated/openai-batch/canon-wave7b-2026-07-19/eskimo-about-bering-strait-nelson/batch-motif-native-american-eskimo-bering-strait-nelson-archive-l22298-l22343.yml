canonical_text:
  quote: ''
  summary: The passage describes a trading festival in which hosts sing and drum while
    guests bring skins. A leading guest is honored with a new fur coat; headmen dance
    and sing pantomimes of exploits; young men pile skins near a lamp. The host provides
    requested equivalent goods, augments a pile of valuables for distribution, entertains
    with songs and dances, and closes with food distribution. Additional notes describe
    variants involving a trader, a Malemut party dissatisfied with gifts at Unalaklit,
    and a sketch of men traveling to such a festival and being met by villagers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hosts sit at one side of the room beating drums and singing while skins are
    brought in.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The host or chief naskuk meets the first naskuk guest and puts a new fur coat
    on him as an honor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each headman throws down skins, performs a short dance to the drums, pantomimes
    an exploit of himself or his father, and sings praise of the person represented.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young men bring desired furs, sometimes more than one skin, and throw them
    into a heap near the lamp at the head of the room.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The host brings requested articles to each headman as an equivalent for furs,
    and on each return adds valuable articles near the lamp until an equivalent pile
    for the young men's furs is formed and distributed to them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the exchanges, the host entertains the guests with songs and dances,
    and the festival ends with food distribution.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the trader-led instance, the young men's skins were taken by the trader;
    when Eskimo give the festival, such skins are distributed among village young
    men who contribute to the supply of articles for guests.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Malemut party traveled to a trading festival at Unalaklit with sledges laden
    with reindeer skins, but took the skins back and returned home after dissatisfaction
    with return presents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A sketch by an Eskimo from the Kaviak peninsula showed men from Cape Prince
    of Wales traveling to such a festival and being met by villagers of the destination
    place.
  category: object
  evidence_refs:
  - ev:7
