canonical_text:
  quote: ''
  summary: The passage introduces an Unalit creation narrative from Kigiktauik, including
    its oral transmission and a water offering to the spirits of those narrated. In
    the story, the first man emerges full-grown from a beach-pea pod on an earth plain
    where no people yet exist. Raven appears, changes between bird and human form
    by means of a mask-like beak, identifies himself as maker of the vine and ground,
    leads Man to firmer high ground, brings berries for food, and creates living mountain
    sheep from molded clay images, assigning them to high cliffs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrative is said to have been related by an old Unalit man at Kigiktauik,
    who learned it from an old man; fragments and versions are reported from multiple
    Eskimo regions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prior teller from Bering Strait is said to have poured a cup of water
    on the floor after finishing the tales on the third evening and addressed the
    spirits of those narrated.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before people existed on the earth plain, the first man lay coiled in a beach-pea
    pod for four days and emerged on the fifth day as a full-grown man.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After emerging, Man examined himself, noticed the soft moving ground, and
    drank water from a small pool, which relieved discomfort in his stomach.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A raven approached, raised its beak like a mask, changed into a man, and questioned
    Man about what he was and where he came from.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Man said he came from the pea-pod, and Raven replied that he had made the
    vine and the softer ground, then led Man toward firmer high ground.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Raven identified the liquid Man had swallowed as water, then changed back
    into a bird, flew into the sky, and returned on the fourth day with two salmonberries
    and two heathberries for Man to eat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Raven molded two pieces of clay into the form of a pair of mountain sheep,
    told Man to close his eyes, and waved his wings four times over the images, after
    which they became living full-grown sheep.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Raven said the animals should live among high cliffs so that not everyone
    could kill them.
  category: speech
  evidence_refs:
  - ev:9
