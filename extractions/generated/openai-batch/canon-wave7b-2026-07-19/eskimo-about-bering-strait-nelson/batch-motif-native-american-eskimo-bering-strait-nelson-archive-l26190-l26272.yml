  quote: ''
  summary: The passage reports beliefs and rites concerning shamans who visit the
    moon, eclipses as omens or causes of disease, protective household actions during
    eclipses, interpretations of solar and lunar eclipses, and a weather-changing
    rite performed by a shaman with assistants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shamans say the man living in the moon has a very bright face, causing them
    to look downward and usually travel in pairs when approaching him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the region described, shamans claim the power to visit the moon; some accounts
    describe climbing to the moon, while one old man said he flew up to the sky like
    a bird.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After a lunar eclipse and deaths from throat disease on the lower Yukon, a
    father and son who were shamans set out to visit the man in the moon to learn
    why the disease had been sent and how to stop it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the reported journey, the older shaman became tired before reaching the
    moon; the younger shaman continued, met the angry moon man, explained his purpose,
    heard that more people would die before the disease stopped, and was allowed to
    return after his father pleaded for him from below.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another described way to reach the moon is for a man to put a slip noose around
    his neck and be dragged around the interior of the kashim until dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Two noted Yukon shamans reportedly used the noose method and told people to
    watch for their return during the next berry season.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the appointed season, villagers said one of the shamans returned partly
    out of the ground, doll-like, small, and weak, but was overlooked by children
    and went away again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Nearly all epidemic diseases are said to come from the moon, though some descend
    from the sun; a lunar eclipse is said to foretell an epidemic, prompting shamans
    to learn the cause and appease the being there.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lower Yukon inhabitants believe an unclean influence descends during an eclipse
    and can produce sickness if caught in utensils; women therefore turn pots, wooden
    buckets, and dishes upside down when an eclipse begins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After an eclipse at St Michael, the Unalit said the sun had died and come
    to life again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The duration of an eclipse is said to indicate the severity of a following
    visitation; at Paimut, people interpreted a recent lunar eclipse as foreboding
    either epidemic or war.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: During a storm at Chichifiagaumt, a paid shaman knelt in the kashim on a straw
    mat, covered himself with a gut-skin shirt except for his face, made a loud speech,
    hid his face, and made grunts, groans, and other noises.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: In the weather rite, assistants used a double cord and sticks over the shaman’s
    back, another man pantomimed lifting an invisible substance from the shaman’s
    back, the men circled the shaman with the sticks, and the shaman ended by saying
    the weather would change in two days.
  category: sequence
  evidence_refs:
  - ev:6
