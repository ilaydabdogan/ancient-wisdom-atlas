canonical_text:
  quote: ''
  summary: A woman flees her cruel husband across the winter tundra and unknowingly
    travels over the body of the giant Kin-a-g'ak'/Kin-ilk. The giant speaks to her,
    feeds her with animals he catches, warns her about his dangerous breath, shelters
    her in his beard and facial hair, and later offers protection if she returns home.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman runs from the village of Nikh'-tsi onto the snow-covered tundra because
    her husband's cruelty has become unbearable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She travels north for many days, avoids villages, exhausts her food, and eats
