  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The giant tells her to build a hut from hairs of his beard; she builds it
    near the left side of his nose from hairs of his mustache.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The giant supplies her with deer, seals, and other food, and she makes clothing
    and stores skins and furs from animals he catches.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Because the woman uses mustache hairs for firewood, the giant notices his
