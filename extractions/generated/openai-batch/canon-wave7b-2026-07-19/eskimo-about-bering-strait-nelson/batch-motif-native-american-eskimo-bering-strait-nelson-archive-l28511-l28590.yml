  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: When asked whether she wants to return home, the woman says she fears her
    husband will beat her again and that she will have no protector.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The giant promises protection, instructs her to call his name when in danger,
