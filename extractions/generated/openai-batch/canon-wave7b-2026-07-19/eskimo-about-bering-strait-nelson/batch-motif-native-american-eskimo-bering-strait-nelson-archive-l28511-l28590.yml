  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A voice from beneath her feet asks who she is and what has driven her to a
    place where human beings never come.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The voice permits her to stay but tells her not to sleep near the mouth or
