canonical_text:
  quote: ''
  summary: Nelson describes women's waist belts and belt buttons among Eskimo communities
    from the lower Kuskokwim to the Arctic coast. The passage details belts made from
    reindeer incisors, sealskin belts ornamented with brass buttons or beads, methods
    of fastening with toggles or buttons, and many belt-button forms, including animal,
    human, and one semihuman mythological carving.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A favored women's waist belt is made from reindeer incisors retained in pieces
    of lower jaw and sewn along a rawhide strap in overlapping, scale-like succession.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some belts have a double row of reindeer teeth, and the passage states that
    each set represents one reindeer, requiring a long period of hunting to accumulate
    enough teeth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other belts are made from tanned sealskin straps with close rows of brass
    buttons, or are ornamented with bead circles and lines arranged according to the
    wearer's preference.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: When worn, the belts are loose around the waist and are held by a toggle or
    button attached by cord and passed through a loop on the opposite side.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Belt buttons are made of ivory, bone, or reindeer horn and include rounded
    knobs, pierced bear or walrus teeth, hooks, flat button shapes, and forms of seals,
    walrus, birds, and men.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The illustrated belt buttons are presented as evidence of variety and carving
    skill; the described examples are ivory except where another material is specified.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Several described buttons have central holes, projections or ear-like pieces
    for cord attachment, and incised lines, circles, or dots.
  category: object
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:8
  text: Specific fasteners include carvings of a seal, a double oval with grotesque
    countenances probably representing seal faces, a white whale, and a walrus with
    flippers shown in relief.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
- id: obs:9
  text: One carving has a grotesque semihuman face, etched lines, circles, dots, and
    representations of fore and hind limbs; the passage says it represents a being
    recognized in Eskimo mythology.
  category: relationship
  evidence_refs:
  - ev:10
