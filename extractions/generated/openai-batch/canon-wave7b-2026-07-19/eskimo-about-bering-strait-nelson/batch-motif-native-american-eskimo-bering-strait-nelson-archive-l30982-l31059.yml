canonical_text:
  quote: ''
  summary: The passage recounts a Raven insulted by Sea-birds, who flies across water
    to a mountain and threatens to eat a Marmot at its burrow. The Marmot flatters
    Raven into dancing with closed eyes, escapes into its hole, and mocks Raven. A
    separate Kotzebue Sound account says shamans visit a chief in the moon to obtain
    scarce animals after offerings; another shaman reports flying to the sky, where
    downward grass, snow, lakes, and personified winds explain snowstorms, stars,
    and winds. A following note mentions Man-worm tales among Eskimo groups and carvings
    of that being.
  language: English
