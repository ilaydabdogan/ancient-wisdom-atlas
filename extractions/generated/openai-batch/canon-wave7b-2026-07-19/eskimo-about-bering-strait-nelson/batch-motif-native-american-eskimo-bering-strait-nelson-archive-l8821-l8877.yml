canonical_text:
  quote: ''
  summary: The passage describes the practical use of bolas for capturing waterfowl,
    including how the hunter wears, prepares, throws, and uses the cords to entangle
    birds. It also reports Chukchi use of bolas at Cape Wankarem and describes Yukon
    delta Eskimo communal drives of flightless waterfowl into net pounds, followed
    by large-scale killing and observed decline in waterfowl numbers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hunter searching for game wears the bolas wound around the head like a fillet,
    with the balls resting on the brow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When a flock passes overhead within about 40 or 50 yards, the hunter untwists
    the sling, holds the joined cord ends, draws the cords parallel, swings the balls
    around the head, and casts slightly in front of the flock.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: In flight, the balls first travel close together, then spread apart into a
    circle about four or five feet in diameter as the implement loses impetus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If no bird is encountered, the bolas turns and drops to earth; on reaching
    the ground, the cords are found interwoven in a network.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: If a bird is struck, the cords wrap around it and hamper its wings so that
    it falls helpless.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Cape Wankarem, Chukchi were observed capturing many eider ducks with the
    bolas.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The bolas was described as effective among flocks because of the space it
    covers, and it was used mostly on low points where waterfowl fly at certain hours.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Eskimo of the Yukon delta and adjacent low country make waterfowl drives
    on marshes in August, when adult birds have molted wing feathers and young birds
    cannot yet fly.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Salmon nets, stout braces, and stakes are arranged to form a pound with wings
    on one side.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: People form a long line across the marsh, shout, strike the ground with sticks,
    converge toward the pound wings, drive birds into the enclosure, and kill them
    with sticks.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Large numbers of downy young birds are killed and thrown away, while umiaks
    are filled with larger or adult birds.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that drives and spring egg gathering are rapidly diminishing
    waterfowl numbers in the district.
  category: other
  evidence_refs:
  - ev:10
