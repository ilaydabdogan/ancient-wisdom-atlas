canonical_text:
  quote: ''
  summary: 'Catalogue-style descriptions of several masks: a short-ear owl inua mask
    from Sabotnisky; a human face mask from south of the Yukon mouth with labrets,
    hood edging, and palraiyuk markings; a large Cape Romanzof sea-parrot mask enclosing
    the bird''s inua features in its mouth; and another large Cape Romanzof mask with
    a long upper projection, hoop, reindeer-skin hair strip, and a small human head
    at the tip.'
  language: English
  quote_policy: summarized
