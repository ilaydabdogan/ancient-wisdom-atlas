  summary: The passage describes marks and animal representations on an arrowpoint
    and on walrus-ivory spearheads. It notes an incised line-and-barb design on an
    arrowpoint, identifies its Nunivak Island provenance and Malemut maker-user, and
    describes wolf totem spearheads from Norton Sound to the Kuskokwim River, including
    carved open jaws, teeth, eyes, nostrils, ears, sockets, pegs, and bead inlays.
    Captions also identify spearheads representing an otter and an ermine.
