canonical_text:
  quote: ''
  summary: The passage describes games and toys among Eskimo communities around Bering
    Strait. It notes gambling, regional distribution of games, earlier strength contests,
    children's miniature hunting and household play, a boy with a toy sled, an old
    man making cord figures of animals, and two St Michael games involving a dart-and-spool
    target and falling wooden splints.
  language: English
  quote_policy: summarized
