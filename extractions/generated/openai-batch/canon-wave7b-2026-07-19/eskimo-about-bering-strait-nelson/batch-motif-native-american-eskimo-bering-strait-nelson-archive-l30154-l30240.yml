canonical_text:
  quote: ''
  summary: A lower Yukon Eskimo legend explains the short-ear owl as a girl changed
    by magic into a bird whose beak and face were flattened after striking a house.
    The following Sledge Island tale opens during a storm at Ktil-ul'-I-git, where
    Ak'-chik-chu'-guk, his sister, and his brothers live with their parents. The sister
    and youngest brother are sent for seawater, become separated from shore by breaking
    ice, and are lost. In spring the remaining brothers build an umiak to search,
    and Ak'-chik-chu'-guk demonstrates extraordinary power by driving the boat past
    a goose and later carrying a great rock inland as a memorial to his name.
  language: English
  quote_policy: summarized
