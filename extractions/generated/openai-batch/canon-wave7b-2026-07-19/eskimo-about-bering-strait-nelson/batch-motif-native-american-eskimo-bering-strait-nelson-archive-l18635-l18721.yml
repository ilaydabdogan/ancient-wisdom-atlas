canonical_text:
  quote: ''
  summary: The passage describes whalers giving presents to local Eskimo as fear-based
    peace offerings; Malemut conflict, feud, and killing; whisky-related violence
    and threatened blood revenge; distrust while hunting in the mountains; warnings
    against travel into Malemut country; and several umiak encounters in which people
    signal friendliness, act cautiously, or behave boisterously near vessels and landing
    places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Whalers at a wreck-prone point fear offending local people and give them presents,
    which the local Eskimo recognize as a kind of peace offering arising from fear.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the local people came aboard the Corwin, the narrator describes them
    as sulky and easily angered by contradiction.
  category: action
  evidence_refs:
  - ev:1
