    man they could in order to obtain blood revenge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Malemut are described as willing to kill one another while hunting in
    the mountains for incentives such as a gun or a few skins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hunters among the Malemut reportedly avoided going into the mountains with
