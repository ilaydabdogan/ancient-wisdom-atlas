  text: The Malemut at the head of Kotzebue Sound are described as vigorous, overbearing,
    quarrelsome, and involved in frequent bloody affrays.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Unalit and Yukon people are said to fear and hate the Malemut and describe
    them as like dogs showing their teeth and ready to fight.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Malemut are said to maintain an old feud against the Tinne, and a shaman
    was killed by them at St Michael because they said he told too many lies.
  category: action
  evidence_refs:
  - ev:2
