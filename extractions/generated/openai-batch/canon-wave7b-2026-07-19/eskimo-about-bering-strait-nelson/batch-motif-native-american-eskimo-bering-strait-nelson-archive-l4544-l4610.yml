  summary: The passage describes regional forms of dippers in Norton Sound, the lower
    Yukon, Sledge Island, Ikogmut, St Lawrence Island, and Cape Nome, including techniques
    for bending spruce strips, fastening with rootlets, fitting bottoms into grooves,
    painted decoration, and examples made from single-piece wood or Dall's sheep horn
    with ivory fittings.
  language: English
