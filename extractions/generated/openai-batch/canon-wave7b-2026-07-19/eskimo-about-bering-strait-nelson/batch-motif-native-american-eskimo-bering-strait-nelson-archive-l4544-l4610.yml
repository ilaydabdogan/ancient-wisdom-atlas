literal_observations:
- id: obs:1
  text: In Norton Sound and the lower Yukon, a common dipper form is made from a long,
    thin spruce strip, three to six inches wide, with one end shaped as a handle and
    the other thinned to a wedge-shaped point before steaming and bending.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bent wooden frame is held with paired stick clamps tied with cord or spruce
    rootlets, then holes are punched through overlapping wood, a bottom piece is fitted
    into a groove, and rootlet stitching secures the overlap.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Plate xxix figures 6 and 7 show dippers from Norton Sound and Sledge Island;
    the Sledge Island example is uncolored, while the Norton Sound example has red
    painted borders outlined with narrow black lines.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A lower Yukon dipper in plate xxix figure 8 is obovate in horizontal section
    and has raised or thickened parts that strengthen and regulate the curves of the
    vessel.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The lower Yukon dipper is steamed, bent until notches meet, clamped with short
