literal_observations:
- id: obs:1
  text: In fall, holes are made in ice where the water is clear enough to see objects
    below the surface, and fish are speared through the holes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Whitefish and pickerel are obtained in large quantities by spearing through
    ice holes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A St. Michael fish spear has a wooden shaft about six feet long, a sharp deerhorn
    central point, surrounding triangular deerhorn sidepieces, lashings, and a wooden
    crossbar.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the St. Michael spear strikes a fish with its central point, the sidepieces
    spread slightly, grasp the fish with their inner edges, and hold it while it is
    drawn from the water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Other described spear forms include barbed central points, two reindeer-horn
    points, a short-handled single-barb spear, and Nunivak Island heads with multiple
    surrounding points.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some salmon and whitefish spears from the lower Kuskokwim northward to Kotzebue
    Sound use large bone, deerhorn, or ivory points with one to three barbs and a
    cord attachment near the butt.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: For some spears, the barbed point is fitted into a long wooden shaft and tied
    to a sealskin line; after the fish is struck, the shaft detaches and the fish
    is hauled ashore by the line.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: These spears are intended for large fish in streams and tributaries, and are
    sometimes also used for spearing white whales.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lower Yukon fishers use a well-fashioned fish figure about six or seven inches
    long, suspended by sinew cords, to attract pickerel and large whitefish while
    fishing through ice holes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The fisherman dangles the fish image below the water surface and holds a spear
    ready; fish rush at the lure and are speared.
  category: sequence
  evidence_refs:
  - ev:6
