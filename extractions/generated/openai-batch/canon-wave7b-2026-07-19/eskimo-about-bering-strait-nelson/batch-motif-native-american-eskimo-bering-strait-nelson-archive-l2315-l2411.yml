literal_observations:
- id: obs:1
  text: Eskimo from the upper Kowak and Noatak rivers encountered at Hotham inlet
    are described as larger and more robust than the Yukon Tiune, speaking the Eskimo
    language and claiming to be Eskimo.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same group is said to wear labrets and practice tonsure while also using
    some clothing and lodges likened to adjacent Tiune tribes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator reports seeing coarse curly hair in one man at Hotham inlet and
    in several men and women on the Siberian coast, attributing the examples to Chukchi-Eskimo
    or Eskimo-Indian mixture.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage gives general physical traits for Eskimo in the described region,
    including small hands and feet, oval and rather flat facial outlines, and slightly
    oblique eyes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Children and young girls are described as having round faces, while angular
    characteristics are said to become prominent near manhood; women are said to age
    rapidly and few people to live to advanced age.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Malemut people and people of Kaviak peninsula and Bering Strait islands are
    described as tall, active, and well built.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Coast Eskimo are described as having short, poorly developed legs and long
    bodies with strong dorsal and lumbar muscles, attributed to time spent in the
    kaiak.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Eskimo of the Big lake district, Kaviak peninsula, and Malemut near Kotzebue
    sound are described as finely proportioned and athletic, attributed to hunting
    on open tundra or in mountains.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage reports a number of mixed-ancestry children among the Eskimo connected
    with intercourse with people from vessels and others, though their number was
    not very great.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The narrator describes a Malemut woman and two little girls sleeping on the
    deck of the Corwin in raw wind while others found it difficult to keep warm in
    heavy overcoats.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A ten-year-old boy at Norton sound was sent alone in severe cold with a sled
    and three dogs to recover lost snowshoes and returned with them after several
    hours.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Men in coastal districts are described as leading hard and perilous lives,
    with spring hunting in kaiaks sometimes resulting in being carried seaward on
    moving ice and struggling back to land.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage states that constant wetting and exposure weaken the natives,
    with consumption and rheumatic complaints common, few people reaching advanced
    age, and families rarely having more than two or three children.
  category: sequence
  evidence_refs:
  - ev:13
