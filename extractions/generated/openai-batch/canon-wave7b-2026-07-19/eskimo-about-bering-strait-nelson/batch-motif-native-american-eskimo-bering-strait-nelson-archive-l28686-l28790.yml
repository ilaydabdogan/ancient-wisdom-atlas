canonical_text:
  quote: ''
  summary: A young man called the One-who-finds-nothing repeatedly fails to find water,
    food, game, and other necessities, though others succeed. In winter he leaves
    the village, scatters his possessions, lies down, and declares that he will die
    there. A pair of Ravens come to him at sunrise; one wants to eat his eyes, while
    the mate says he is not dead because there is no burial smoke by him. The first
    Raven approaches with its beak transformed into a knife. The man snatches the
    knife and refuses to return it, rejecting an offer of game. The Raven warns him
    that he will not reach the village, coughs and falls, then flies away. As the
    man tries to return, his body contracts and bends, he becomes an old man, cannot
    walk, and dies.
  language: English
  quote_policy: summarized
