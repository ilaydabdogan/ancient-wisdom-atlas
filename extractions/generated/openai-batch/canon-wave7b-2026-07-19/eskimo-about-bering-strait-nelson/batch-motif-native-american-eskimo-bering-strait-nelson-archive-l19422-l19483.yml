  quote: ''
  summary: The passage describes mortuary practices involving a wooden grave box,
    cutting the cords binding the body so the shade may return and occupy it, four
    days of household restrictions while the shade is believed to remain nearby, precautions
    against the shade occupying places or being injured, mourning hair cutting, and
    grave boxes with a pole bearing a cup and spoon in a Yukon delta graveyard.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the body is placed in the box, the cords binding it are cut, with the
    stated reason that the shade may return, occupy the body, and move about if necessary.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Grave boxes in the described vicinity are made of hewn slabs or planks, squared
    at the ends, supported from below, and often furnished with corner posts extending
    above the box.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Relatives do not touch the body; the mortuary handling is done by others.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Housemates of the deceased must remain in their accustomed places in the house
    during the four days after death while the shade is believed to be nearby.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During this period, housemates keep fur hoods drawn over their heads to prevent
    the shade's influence from entering their heads and killing them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the body is removed, the deceased person's sleeping place is swept clean
    and piled with bags and other things so that no room remains for the shade to
    return and reoccupy it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The two persons who slept on either side of the deceased must not leave their
    places; if a place is vacant, the shade might occupy it and bring sickness or
    death to the original owner or to household inmates.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The deceased person's housemates are not permitted to go outside during the
    four days following the death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The deceased person's nearest relatives cut their hair short along the forehead
    as a sign of mourning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: During the four days that the shade is thought to remain with the body, relatives
    may not use sharp-edged or pointed instruments for fear of injuring the shade,
    making it angry, and bringing misfortune.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: An old man is reported as saying that if relatives cut anything with a sharp
    instrument during this period, it would be as though one had cut one's own shade
    and would die.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: In a Yukon delta graveyard, a newly made heavy plank grave box painted red
    was seen above an older box for a member of the same family, supported by the
    same corner posts.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: A pole erected before the grave had a cup and a spoon attached to it.
  category: object
  evidence_refs:
  - ev:5
