canonical_text:
  quote: ''
  summary: The passage describes Bering Strait Eskimo beliefs and reported practices
    concerning shamans, shades of the dead, spirit helpers, secret use of infant corpses
    and shades for power or hunting success, animal-part charms, communal fear of
    shamans, ritual instruction, and offerings to a moon-dwelling man-like being who
    controls the supply of game animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shamans are said to see shades of dead people and animals that are invisible
    to people not specially endowed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shades of people or animals frequently come when called by shamans and do
    the shamans' bidding; the shade of a dead shaman may also appear for this purpose.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A shaman among the Unalit was said to be aided by a dog with whom he could
    talk; the dog is described as a tunyhak that had taken dog form.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The yu-a is described as a common form of tungliulc and as a spirit of elements,
    places, and things.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some shamans are reported to cause the death of newborn infants, steal the
    body, dry it, and keep it in order to control the infant's shade as a strong influence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: One man was said to have stolen a dried infant body from another shaman and
    become known for remarkable powers through the aid of its shade; after his death,
    relatives burned the small mummy because they feared it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Men who are not shamans but understand such practices may secretly kill a
    newborn child, steal and dry the body, place it in a bag, and wear or carry it
    in a kayak to obtain hunting success.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The infant shade is believed to be clairvoyant, to assist its possessor in
    finding game, and to direct the spear so the animal does not escape.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Owners of dried infant bodies are described as jealous of them and try to
    keep possession secret.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Point Hope, a young shaman wore gloves with outspread sea parrot feet sewn
    on them; his companions said a bird had alighted on his hands and left its feet
    to bring salmon-fishing success.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Shamans are greatly feared, their advice is usually obeyed, and repeated failure,
    lying, or suspected witchcraft can lead to their being killed by community consent.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Festivals and attendant rites are usually carried out according to shamanic
    instructions, which are said to reveal what is acceptable to shades and tunghdt.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The moon is believed to be inhabited by a great man-like being who controls
    all animals found on earth.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: During scarcity, shamans are said to go up to the moon-being and make offerings;
    if pleased, the being gives them an animal, which they return to earth and release
    so the species becomes plentiful again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: At St Michael, the village head-man secretly made food offerings to the new
    moon and sang a long propitiatory song to the spirit thought to live there in
    order to control game supply.
  category: action
  evidence_refs:
  - ev:9
