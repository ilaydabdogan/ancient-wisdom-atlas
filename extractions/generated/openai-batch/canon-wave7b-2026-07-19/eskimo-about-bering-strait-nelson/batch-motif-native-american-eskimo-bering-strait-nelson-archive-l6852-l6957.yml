canonical_text:
  quote: ''
  summary: The passage describes a carved bucket-handle scene with seals and polar
    bears at an ice edge, then catalogs women's needle-cases from several localities.
    The cases are made of bone, ivory, wood, cartridge shells, beads, and sealskin
    cord, and are ornamented with animal forms, human/body forms, raven totem marks,
    geometric etching, and pendent ornaments. It also explains a stopperless needle-case
    mechanism using a sealskin cord.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A carved handle group is described as two seals lying on ice near their hole
    and two polar bears rising from water at the ice edge close to the seals.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women's needle-cases are described as varied in form and material, combining
    ornamental designs with practical use.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A favored lower Yukon and Kuskokwim needle-case type uses a hollow waterfowl
    wing bone, wooden fish-head and fish-tail stoppers, and incised surface patterns.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Several needle-cases from Kushunuk, Cape Vancouver, and Sabotnisky represent
    fish, and some have seal-hair tufts near the wooden head and tail.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Individual cases and stoppers include a young white whale head, a cormorant
    head, Arctic hare relief, white whales, walrus and seal heads, a right whale,
    and bears.
  category: object
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:6
  text: Some cases take human or body-related forms, including a woman's leg with
    trouser seams, a standing woman, and two inward-facing seated human figures.
  category: object
  evidence_refs:
  - ev:8
- id: obs:7
  text: Two ivory cases are described with raven totem imagery; one also has zigzag
    etchings and inlaid blue beads.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Stopperless needle-cases may use a sealskin cord through the center; needles
    are thrust into the cord, drawn into the case by pulling one end, and withdrawn
    by reverse movement.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: Pendent ornaments attached to needle-cases may include animal canine teeth,
    arrowheads, human faces, miniature belt fasteners, and animal forms; described
    examples include a reindeer's foot and a frog form.
  category: object
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: The King Island tube with seated human figures is described as much worn from
    handling and, in the author's view, probably old.
  category: attribute
  evidence_refs:
  - ev:8
