canonical_text:
  quote: ''
  summary: The passage describes several kaiak and umiak paddles and related implements
    from places around Bering Strait and the lower Kuskokwim. It records painted and
    incised markings on paddles, including bands, disks, a female phallic emblem divided
    across paired paddles, semi-human faces, and totem or ownership marks. It also
    describes a sword-shaped implement used by seal and walrus hunters and bone strips
    attached to umiak rails to protect boat coverings from oar friction.
  language: English
