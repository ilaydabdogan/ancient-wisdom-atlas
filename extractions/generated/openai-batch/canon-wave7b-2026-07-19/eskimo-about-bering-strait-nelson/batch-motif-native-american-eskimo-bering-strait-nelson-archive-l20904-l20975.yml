canonical_text:
  quote: ''
  summary: 'The passage catalogues games and contests at St Michael and nearby Bering
    Strait communities: a four-man battering-ram game in the kashim, wrestling rules
    and challenge customs, knee walking, several jumping contests, foot and boat races
    around landmarks, spear-throwing contests, and children''s use of tops across
    a regional range.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The battering-ram game is played by four men in the kashim, with two men carrying
    partners face downward on their shoulders so that the carried men's feet project
    forward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the battering-ram game, the carriers run toward each other so the carried
    men's feet meet, trying to upset the opposing pair.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wrestling is described as seizing an opponent by the arms or body to gain
    a square fall on the back, without tripping or using the feet or legs except as
    supports.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that wrestling was generally sport, but that disputed claims
    for women were sometimes settled by wrestling in ancient times.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A stranger arriving in a village was frequently challenged to wrestle with
    the local champion.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Knee walking involves young men kneeling on the plank floor of the kashim,
    holding up their feet with their hands, and walking on bare knees to outdo one
    another in endurance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: High jumping uses a stick held or fastened above the floor and gradually raised
    as young men try to leap over it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Horizontal jumping uses a starting mark and another mark on the ground or
    floor to score how far each jumper reaches.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hurdle jumping uses four umiak oars placed around the sides of the kashim
    about breast high, and contestants jump in pairs until one fails to clear an oar.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Foot racing is described as a favorite autumn sport when new ice has formed,
    with courses running around a natural object and back to the starting point.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kaiak racing begins with men side by side near shore; at a signal they paddle
    around a rock or islet and return, with the winner first to touch shore.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Umiak races are conducted in the same way as kaiak races, and hunters hold
    contests in throwing seal and walrus spears.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Children of both sexes were found using tops from Kuskokwim River to Cape
    Prince of Wales, on both mainland and islands.
  category: action
  evidence_refs:
  - ev:10
