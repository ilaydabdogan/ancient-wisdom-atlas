canonical_text:
  quote: ''
  summary: The passage describes gathering edible roots, winter food storage, the
    importance of seal nets, an example of a hunter trading a seal net for whisky,
    and a reported famine on St Lawrence Island after people missed the brief fall
    walrus migration while intoxicated. It then describes survivors, depopulated villages,
    dead bodies in houses and along the way to a graveyard, overturned food vessels,
    scattered implements, empty bottles, animal skulls, and a man who died while pushing
    a sled carrying another body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women gather bulbous grass roots, eat them boiled or raw, and also take root
    stores hidden by field mice by probing grass-covered knolls with a staff.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that people must store food for winter, but may consume
    much of their stores during midwinter festivals and then experience semi-starvation
    in early spring.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fall seal nets are described as highly important for obtaining food, lamp
    oil, other oil uses, and skins for trade.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A paddle man traded his only seal net for enough whisky to become intoxicated,
    and his family was short of food during the following winter.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The St Lawrence Island famine of 1879-1880 is reported as killing over a thousand
    people and as being attributed to whisky use.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The islanders usually obtained winter food by hunting walrus herds that passed
    through Bering Strait on the first ice and stayed near the island only briefly
    before moving south.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: After a prolonged whisky debauch, the walrus migration had passed, the island
    was closed in by ice, and over two-thirds of the population died before spring.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some survivors later came aboard the Corwin with trade articles and wanted
    rifle cartridges and more whisky.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In 1881, the Corwin visited the famine-stricken district; only one dog was
    left, and two large villages were entirely depopulated.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: At one place, about twenty-five adult bodies lay wrapped in fur blankets on
    sleeping platforms, with other bodies on the ground and outside.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: In another village, about two hundred dead people were reported; in one large
    house about fifteen bodies were stacked at one end while others lay dead in blankets
    on platforms.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: In the houses, food vessels were turned bottom-up and put away in a corner,
    while tools, implements, pots, dishes, guns, knives, axes, ammunition, empty bottles,
    walrus skulls, dog skulls, and human bodies were scattered in and around the village.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Bodies were scattered in a line toward the graveyard for half a mile inland.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The first dead had been taken farthest away, usually placed beside the sled
    that carried them, with their tools and implements nearby.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: One man lay dead behind a sled bearing the body of his friend or relative,
    apparently having died while pushing it.
  category: sequence
  evidence_refs:
  - ev:10
