canonical_text:
  quote: ''
  summary: Man and Raven return to the sky land, become angry that earth people are
    numerous and killing many animals, and punish them first with toothy reindeer
    and then by removing the sun. Earth people make offerings for temporary light.
    Raven's older brother pities them, feigns death, transforms into a leaf swallowed
    with water by Raven's wife, is born as a rapidly growing boy, obtains the hidden
    sun as a plaything, puts on raven mask and coat, and flies away with it.
  language: English
  quote_policy: summarized
