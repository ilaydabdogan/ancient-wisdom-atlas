canonical_text:
  quote: ''
  summary: The passage describes villages after a famine, with many adult bodies and
    no children's bodies found in one location, raising but not proving suspicion
    of cannibalism. The observer reports surviving families camped near a winter village
    full of bodies, notes their depression and apparent loss of customary fear of
    death places, and describes a husband interpreting the camera as a conjuring box
    that might cause the photographed women and girls to die.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bodies were found lying around the villages, and the observer states that
    many appeared to have been dragged and left by the living during the later period
    of famine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In one village, more than two hundred dead adults were found, but no bodies
    of children were found despite careful search.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The absence of children's bodies raised suspicion that children had been eaten
    by adults, but the observer states there was no positive evidence that this occurred
    in the villages described.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The observer reports learning from the Unalit that cannibalism sometimes occurred
    in ancient times during famines, while the Unalit expressed abhorrence of the
    practice.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A couple of surviving families were found living in round-top walrus-hide
    summer houses on a bluff at the northwest point of the island.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Near the survivors' camp was a winter village where about one hundred people
    lay dead, either scattered outside or lying in blankets in houses.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The surviving families consisted of about a dozen people; the adults seemed
    depressed and listless, while two little girls acted with ordinary childish liveliness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the observer shot a snow bunting, the two little girls called to him
    and ran to show him its nest on the hillside.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When asked what had become of the former inhabitants, one survivor waved toward
    the winter village and said a phrase explained as meaning that all were dead.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The observer arranged women and little girls for a photograph and focused
    the camera.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The husband of one woman asked whether all would die now, apparently taking
    the camera to be a conjuring box that could complete the famine's work.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The survivors appeared to lack the customary fear usually shown near places
    where many persons had died.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The two surviving families camped just above the village full of dead bodies
    and had to pass close to the dead when going to launch their umiak.
  category: action
  evidence_refs:
  - ev:9
