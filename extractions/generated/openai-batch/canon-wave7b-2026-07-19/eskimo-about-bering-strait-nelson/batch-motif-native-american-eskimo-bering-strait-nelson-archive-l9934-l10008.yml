canonical_text:
  quote: ''
  summary: The passage describes Eskimo use of throwing sticks to cast seal and bird
    spears, including overhand and underhand methods, surface-skimming throws, tracking
    submerged prey by bubble trails from kaiaks, mechanical grip positions on throwing
    sticks, and Unalit sizing of throwing sticks to the user's forearm with longer
    versions for white whale hunting.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eskimo hunters are described as expert at casting spears with throwing sticks,
    with small seal spears cast 30 to 50 yards with accuracy and force.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In practice throws at young waterfowl, the spear commonly struck the center
    of the water circle where a diving bird had disappeared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bird spears are generally cast overhand to strike from above, but shy or quickly
    diving birds may be targeted with an underhand throw that skims the water surface.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A surface-skimming spear could touch wave crests, raise spray, and continue
    for about 20 or 25 yards.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When spears are thrown into bunched flocks of partly fledged ducks or geese,
    two or three birds may be impaled at once on the triple points.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hunters in kaiaks can follow a seal or diving waterfowl in calm weather by
    observing lines of bubbles that mark the animal's underwater course.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator describes pursuing half-fledged eider ducks near Stuart island
    with two Eskimo companions and learning that the birds could be followed until
    they resurfaced within spear range.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: For an overhand cast, the spear shaft is placed in a groove on the throwing
    stick, rests against an ivory pin or crosspiece, and is held with the thumb, fingers,
    and finger grooves.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The orientation of the throwing-stick groove changes with the intended cast:
    upward for a direct forward cast and outward for a throw along the water surface.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Throwing sticks with side pins or three pegs require different finger placements
    to hold and support the spear.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Unalit Eskimo throwing sticks are made to a length measured from the user's
    right elbow to the tip of the outstretched forefinger.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Throwing sticks used with white whale spears are made longer by the width
    of the forefinger than those used for seal and bird spears.
  category: attribute
  evidence_refs:
  - ev:6
