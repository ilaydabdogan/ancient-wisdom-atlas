canonical_text:
  quote: ''
  summary: The passage describes a Bladder Feast ritual room containing painted poles,
    spears, animal bladders, hunting helmets, a walrus skull, and other objects. It
    records drum and song responses to a dog, noise, and imported goods, explains
    that animal shades are present in the bladders, and describes evening arrangements
    in which helmets, a skull, straw, water buckets, and the floor hole represent
    a seal-hole and sea setting used by the animal shades.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pole about ten feet long stood at the back of the room with a bundle of
    wild-parsnip stalks bound to its upper end, red and white paint along its length,
    and reindeer-skin strips fastened near its middle.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A large sheaf of seal and walrus spears hung horizontally on the left side
    of the room, with several hundred painted seal and walrus bladders attached to
    them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bladders attached to each spear belonged to that spear owner's catch or
    possession, while reindeer bladders hung separately and were not grouped with
    the seal and walrus bladders.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A pile of thirty or forty wooden hunting helmets lay beneath the wild-parsnip
    stalks and the spears and bladders; some helmets had carved ivory images, paint,
    white blotches, and female phallic symbols.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A large walrus skull stood behind the entrance hole in the floor.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: When a dog entered the room, a man beat a drum to exorcise the evil influence
    of the dog's presence until the dog was expelled.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The observer's touching of a bladder startled the men, and a similar outcry
    was raised when a loud noise occurred near the ritual objects.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When clothing and goods were brought in, drums were beaten softly and a low
    humming song was sung; when guns, steel traps, and other iron objects were brought
    in, the drumming and songs became louder.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The reason given for the drumming and singing was that the shades of the animals
    present in the bladders might not be frightened.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the evening, boys outside the kashim raised a loud outcry, and later the
    hunting helmets were arranged in a circle on the floor enclosing the walrus skull
    and stake.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A bundle of straw was thrown down through the roof hole; a man carried it
    over his head around the ring of helmets and placed it at the base of the stake.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The walrus skull was placed near the floor hole with a folded straw mat before
    it, and two small wooden buckets of water were set in front of the hole.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The water buckets symbolized the sea, and the floor hole represented a seal
    hole leading into the sea through the ice.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: No one was permitted to leave until the evening ceremonies were finished because
    the exit hole was supposed to be used by the shades of the animals and was tabooed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The men and boys put on their helmets, and grass or straw was waved over the
    head and scattered inside the former helmet circle, representing drift weeds on
    the seashore.
  category: action
  evidence_refs:
  - ev:9
