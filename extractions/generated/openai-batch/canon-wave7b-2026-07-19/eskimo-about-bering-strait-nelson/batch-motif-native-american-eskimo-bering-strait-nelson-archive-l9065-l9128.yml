  summary: An ethnographic catalog describes several large spears and harpoon-like
    implements from Sledge Island, Norton Sound, Port Clarence, St Lawrence Island,
    Chichifiagainut, Nunivak Island, and Pastolik. It records shaft lengths, lashings,
    finger-rests, detachable points, animal-head forms, ownership marking, cords,
    and floats, and notes similarities and regional variants.
  language: English
