canonical_text:
  quote: ''
  summary: 'The passage describes a Bladder Festival sequence in the kashim: participants
    arrange around a grass ring, sing and drum, perform animal and narrative pantomimes,
    make food and water offerings to shades and tunghat, conduct a midnight shamanic
    and water rite involving boys under suspended bladders, and stage an entrance
    and procession of four hooded paddle-bearing men who lift bladders, knock down
    spears, and set paddles with helmets, grass, and gull feathers outside the entrance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two young men sit in designated positions, one under spears and bladders and
    another under a large bundle of wild-parsnip stalks, with their feet resting on
    a ring of grass.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men and boys arrange themselves around the room just outside the grass circle,
    while women and girls stand behind them near the wall.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Drums beat loudly; the headman chants a few words, and the assembled participants
    repeat the refrain in alternation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Young men imitate eider notes and perform loon and murre movements, including
    motions of diving, swimming, pecking, flapping, flying away, and making bird cries.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: Additional dancers make bird movements; one dancer mimes a beaver cutting
    bushes and building a dam, and another gestures an encounter with an enemy and
    an escape.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A singer seizes two wooden buckets of water and exits through a hole in the
    floor, while men and boys run to place hunting helmets on the bundle of wild-parsnip
    stalks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man stripped to the waist enters carrying a wooden dish of food, circles
    the room with it as an offering to the shades and tunghat in the sky land, stamps
    on the floor, and then people enter bringing food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: At midnight the lights are extinguished; the shaman speaks unintelligible
    words from the roof, ends with a loud shout, enters the kashim, and the lights
    are renewed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A bucket of water is placed under the bladders; a man and three boys strip,
    with one boy placed astride the man's back and two boys stooping before the bucket.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The man tosses water upward toward the bladders so it falls on himself and
    two boys, then carries the bucket around the room while throwing water toward
    the roof as a libation to the tunghat of the air; the boys kneel and are drenched
    with cold water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A growling noise under the floor precedes the entrance of four men wearing
    fur hoods and carrying kayak paddles; they enter sequentially and occupy the four
    corners of the room.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The four paddle-bearing men march around the room several times, lift the
    bladders with their paddle blades, and knock down spears set on the walls.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: After the four men leave, people gather the fallen spears and remove their
    points; the wild-parsnip bundle is tied to a stake and the spear-and-bladder bundle
    is lowered.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Outside the kashim, the four men plant their paddles blade-down before the
    entrance, fasten hunting helmets to the tops, and attach grass representing seaweed
    and small downy gull feathers.
  category: object
  evidence_refs:
  - ev:9
