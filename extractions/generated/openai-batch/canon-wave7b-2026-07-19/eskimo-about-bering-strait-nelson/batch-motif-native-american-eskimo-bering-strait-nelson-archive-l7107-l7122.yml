canonical_text:
  quote: ''
  summary: 'The passage describes Eskimo needles and bodkins: formerly bone needles
    were used, stitch holes were pierced with bodkins or awls of bone, ivory, or deerhorn,
    and increased contact with white men introduced steel needles and iron for needle-making.
    It also notes ivory needles from St Michael used for coarse sewing such as boat
    covers, and begins mention of a small flat wooden tablet in the collection.'
