canonical_text:
  quote: ''
  summary: 'Near Pastolik, women gather a tall grass for mats, baskets, and boot pads.
    A nearly uprooted grass-stalk becomes dissatisfied and repeatedly changes form
    by wishing: first into an herb, then a small creeping plant, then a tuber-bearing
    plant, then a mouse, then an owl, and finally a young man on Sledge island who
    calls himself Chfifi-ih''-luk.'
  language: English
  quote_policy: summarized
