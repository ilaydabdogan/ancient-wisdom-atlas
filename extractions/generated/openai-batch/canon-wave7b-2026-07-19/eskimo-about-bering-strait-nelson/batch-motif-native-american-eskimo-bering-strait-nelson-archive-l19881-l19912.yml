canonical_text:
  quote: ''
  summary: The passage reports a system of totem marks and gentes among Eskimo communities
    from the Kuskokwim River northward to Bering Strait and Kotzebue Sound. It gives
    Unalit terms for devices, relatives within a gens, and wolf-related totem terms.
    It states that weapons marked with wolf or other animal totem signs are believed
    to take on some qualities of the represented animal and special fatality, and
    describes wolf signs on Malemut deerhorn-point arrows used for hunting reindeer
    on Nunivak Island.
  language: English
  quote_policy: summarized
