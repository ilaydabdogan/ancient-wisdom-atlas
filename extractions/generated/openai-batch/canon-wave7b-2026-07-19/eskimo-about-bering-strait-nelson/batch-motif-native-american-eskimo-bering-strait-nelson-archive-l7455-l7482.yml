  summary: The passage describes a sinew spinner from St. Lawrence Island, notes that
    such implements were not seen elsewhere in the visited region, and suggests the
    idea may have come from whaling ships. It then describes tools used for dressing
    and tanning skins, especially scrapers and polishers, with regional variation
    in scraper handle forms around Kuskokwim, Norton Sound, Bering Strait, and Kotzebue
    Sound.
