canonical_text:
  quote: ''
  summary: A young traveler ignores a boy's warning and enters a shaman's house guarded
    by a white bear and a red bear, killing both. Inside he finds a beautiful woman
    whose image he had seen in dreams; she mourns because the bears were her brothers.
    He marries her, later suspects her and her parents of plotting against him, kills
    her, returns to his village, and later remarries. The passage then gives an ethnographic
    note on a lower Yukon festival centered on a wooden human image placed in the
    kashim, wrapped in birch-bark, hung in a tree, consulted by shamans for hunting
    and fishing omens, and kept secretly until the following year.
  language: English
  quote_policy: summarized
