canonical_text:
  quote: ''
  summary: Raven restores Man from a bearskin state, creates a white bear from the
    bearskin and a tail-feather, explains that Man has slept four years, shows him
    dangerous and valuable sea animals, then returns him to his home shore after great
    time has passed. Man is welcomed back, made headman, and teaches what he has seen,
    while Raven refuses a place of honor and sits near the entrance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Raven waves a magic wing so that Man can speak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Man says he does not like the prospect of living on the sea while his son
    remains on shore.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Raven makes a stroke with his wings; the bearskin falls away from Man, empty,
    and Man sits up in his original form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Raven places one of his tail-feathers inside the empty bearskin as a spine,
    waves his wing over it, and a white bear arises.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Raven says Man's four turnovers correspond to four years of sleep.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A small shrew-like animal living on sea ice enters a man's boot and crawls
    over his body; if he remains still he becomes a successful hunter, but if he moves
    it burrows to his heart and kills him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Raven makes the t-mi'-kHk, described as a large slimy leathery-skinned sea
    animal with four long arms that drags men or kayaks under water and pursues victims
    on ice, shore, and through earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Raven sits on the head of a smaller animal swimming near two walrus, making
    it quiet, and identifies it as a walrus dog that accompanies walrus herds and
    kills people.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The walrus dog is described as long, slender, black-scaled, dog-headed and
    dog-toothed, four-legged, and able to kill a man with a stroke of its scaled tail.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Raven says only good hunters can kill whales and grampus, and that one kill
    can feed an entire village.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A sea fox is described as like a red fox but sea-dwelling and fierce enough
    to kill men; sea otters are described as like land otters but with finer white-tipped
    fur and scarce enough that only the best hunters capture them.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: After Man closes his eyes and holds fast to Raven, he finds himself on the
    shore near home, where a large village has replaced a few huts, his wife is very
    old, and his son is an old man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The people welcome Man, make him headman, give him the place of honor in the
    kashim, and he tells what he has seen and teaches young men; Raven refuses an
    honored seat and sits with humble people near the entrance.
  category: sequence
  evidence_refs:
  - ev:7
