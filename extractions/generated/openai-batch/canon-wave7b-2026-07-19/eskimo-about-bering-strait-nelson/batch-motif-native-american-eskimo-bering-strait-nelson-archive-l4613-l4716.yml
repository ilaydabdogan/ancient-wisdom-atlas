  summary: The passage catalogs dippers, ladles, and spoons from Bering Strait and
    nearby localities. It describes their forms, handles, painted borders, and interior
    designs, including images of seals, killer whales, a fish, a double-headed bird,
    a human figure, otter skins, unidentified mythological beings or animals, and
    a hybrid animal identified as a white whale transformed into a wolf-whale combination.
    It also notes visual similarities to masks and women’s earrings from the same
    district.
