canonical_text:
  quote: ''
  summary: The passage describes St Michael dwelling houses, including earth-covered
    log construction, sleeping platforms, seasonal entrances, storage areas, lamps,
    and a central fireplace. It then describes household storehouses and regional
    variations in storage structures, including elevated storehouses at St Michael
    and the lower Yukon, turf storehouses where timber is scarce, underground storerooms
    at Point Barrow, and raised frames for sledges and kaiaks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A typical St Michael dwelling is built from a rectangular log framework, covered
    with smaller logs or slabs and several feet of earth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Raised platforms occupy three sides of the single room and are used as sleeping
