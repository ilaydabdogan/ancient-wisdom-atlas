  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Storage areas within the house hold seal-oil bags, wooden dishes, tubs, domestic
    utensils, and food.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each family has a small saucer-shaped clay lamp burning near its platform.
  category: object
  evidence_refs:
  - ev:6
