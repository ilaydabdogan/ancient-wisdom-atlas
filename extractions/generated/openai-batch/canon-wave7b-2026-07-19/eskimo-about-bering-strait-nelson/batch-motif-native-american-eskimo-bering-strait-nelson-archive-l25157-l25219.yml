  quote: ''
  summary: 'The passage describes several finger masks: distorted semihuman facial
    masks used in ceremonial dances, one said to represent the features of a tunghtik;
    a Norton Sound ring-shaped mask said to represent a star with feathers indicating
    twinkling light and used by women in ceremonial dances; and a Big Lake double-ring
    mask with colored spots, deerskin hair, and duck feathers, also used by women
    in ceremonial dances though its signification is unknown.'
