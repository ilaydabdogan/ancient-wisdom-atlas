canonical_text:
  quote: ''
  summary: The passage describes small boxes used to store wood fungus ashes for chewing
    tobacco. It catalogs materials, closures, repairs, and regional specimens, with
    attention to decorations such as circles and dots, zigzags, raven totem marks,
    animals, hunting scenes, lodges, seal flippers, trees, boats, sledges, people,
    and a fish-headed female figure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Small boxes are used to store wood fungus ashes, which are used with chewing
    tobacco.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boxes are usually rather tubular and are made from materials including
    reindeer antler, walrus tusk, wood, bone, walrus ivory, and whalebone.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:3
  text: A Hotham inlet walrus ivory box is shaped somewhat like a reindeer hoof, has
    a cloth closure with a puckering string, and bears circles and dots around the
    upper border.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Golofnin bay walrus-tusk box has a wooden bottom, copper clamp repairs,
    sinew cord, and a rawhide-cord cover device that lets the cover be raised or closed
    without dropping it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The corded cover device is described as being in common use along the coast
    from the Yukon mouth to Kotzebue sound.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Hotham inlet antler box is divided by incised paired lines into sections
    etched with birds, mammals, boats, sledges, trees, waterfowl, and people, with
    reddish coloring rubbed into the incisions.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: On one side of the Hotham inlet antler box is an etched raven totem with a
    circle and dot in front, explained in the passage as representing raven tracks
    in snow and a mark where the raven had eaten meat.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A tall Hotham inlet walrus-ivory box shows six reindeer on one side and, on
    the other, a house with an elevated cache and a man shooting at the hindmost deer.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Zigzag border patterns and raven totem marks are described on Hotham inlet,
    Razbinsky, and Norton sound specimens.
  category: object
  evidence_refs:
  - ev:5
  - ev:9
- id: obs:10
  text: Another Hotham inlet antler box is covered with circles and dots and has a
    series of conical summer lodges etched around the middle.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: A Sledge island cylindrical specimen has scallops and ridges carved around
    its surface, a bottom fastened with wooden pins, and a wooden lid.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Nunivak island antler box represents the fore and hind nippers of a seal
    in slight relief and has circle-and-dot patterns along the sides.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: A Kotzebue sound whalebone box has etched arms and breast of a woman with
    a fish-like head and a small square piece of iron inlaid on the back.
  category: object
  evidence_refs:
  - ev:9
