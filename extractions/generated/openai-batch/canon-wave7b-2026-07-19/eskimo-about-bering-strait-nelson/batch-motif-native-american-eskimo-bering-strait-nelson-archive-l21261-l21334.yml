canonical_text:
  quote: ''
  summary: The passage describes children’s toys around Bering Strait, including girls’
    dolls, toy bedding and clothing patterned after local adult objects, and toy snow
    knives used by children of both sexes. It includes an anecdote of two girls at
    Sledge Island arranging dolls in a semicircle before visitors. It also catalogs
    snow-knife materials, shapes, carved animal heads, raven totem marks, murre-head
    reliefs, concentric-circle decoration, wooden plugs, and examples from several
    localities.
