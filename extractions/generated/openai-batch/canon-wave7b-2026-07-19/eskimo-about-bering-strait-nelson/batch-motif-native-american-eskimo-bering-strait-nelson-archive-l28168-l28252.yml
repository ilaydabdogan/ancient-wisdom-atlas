- id: obs:1
  text: A prefatory note says the tale is related either separately or together with
    the preceding legend.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After drying his clothing at a fire, Raven sees a large whale near shore and
    tells it to close its eyes and open its mouth when it comes up again.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Raven puts on his raven coat, draws down his mask, carries his fire-drill
    under his wings, and flies over the water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The whale follows Raven's instruction, and Raven flies straight down the whale's
    throat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inside the whale, Raven finds the entrance to a room with a lamp, a roof supported
    by the whale's spine, walls formed by ribs, and a tube along the backbone dripping
    oil into the lamp.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A beautiful young woman in the room is identified as the shade or inua of
    the female whale; she questions Raven, seats him, and gives him berries and oil.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Raven stays four days as the inua's guest, and she repeatedly tells him not
    to touch the tube along the roof.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the inua is absent, Raven tastes the dripping oil, eats more drops, tears
    a piece from the side of the tube, and eats it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Oil rushes into the room, the light goes out, the room rolls for four days,
    and the whale dies because Raven has torn part of a heart vessel.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the whale drifts ashore, villagers make a hole in its body, and Raven
    escapes unnoticed while they carry meat to shore.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Raven realizes he left his fire-drill behind, removes his raven mask and coat,
    becomes a young man, approaches the whale carcass, and offers to help cut it up.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When a worker finds the fire-drill inside the whale, Raven says a fire-drill
    found in a whale means many cutters will die, runs away, and the people flee.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the people flee, Raven laughs, retrieves his mask and coat, cuts up
    the whale, stores meat, thanks the shades, and then looks for a container for
    oil before seeing a mink run by.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
