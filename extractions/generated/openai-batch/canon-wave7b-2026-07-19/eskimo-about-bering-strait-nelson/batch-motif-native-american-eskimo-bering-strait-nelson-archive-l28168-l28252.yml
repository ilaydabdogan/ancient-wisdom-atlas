canonical_text:
  quote: ''
  summary: Raven enters a whale after instructing it to open its mouth, finds a room
    and the whale's female inua inside, violates her warning not to touch an oil-dripping
    tube, kills the whale by damaging a heart vessel, escapes when villagers cut into
    the stranded carcass, deceives them into fleeing by claiming a fire-drill found
    inside the whale is dangerous, and takes meat for himself before seeing a mink
    on the shore.
  language: English
  quote_policy: summarized
