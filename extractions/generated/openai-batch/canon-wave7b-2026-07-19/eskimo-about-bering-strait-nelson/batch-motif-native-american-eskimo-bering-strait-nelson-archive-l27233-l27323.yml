canonical_text:
  quote: ''
  summary: The passage catalogs carved and painted objects representing mythic or
    composite beings among Eskimo communities around Bering Strait. It describes half-human,
    half-seal beings, a walrus carving marked with the face of its inua, seal-bodied
    figures with human or semihuman heads, a white bear carrying a man, a painted
    mythical creature, sky-origin reindeer from the Raven tale visible chiefly to
    shamans, and far-northern men with tails and two faces.
  language: English
  quote_policy: summarized
