  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Shaktolik men said many other old village sites in the area had once been
    inhabited by a race of very small people who had all disappeared.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Malemut people of Kotzebue Sound reported many old village sites, many of
