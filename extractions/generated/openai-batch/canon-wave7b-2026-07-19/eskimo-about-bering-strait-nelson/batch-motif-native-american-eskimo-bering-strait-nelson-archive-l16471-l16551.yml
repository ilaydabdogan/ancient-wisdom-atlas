canonical_text:
  quote: ''
  summary: The passage records brief archaeological and oral-tradition notes about
    ancient Eskimo village ruins across the lower Yukon, St Michael Island, Whale
    Island, Norton Sound, Kotzebue Sound, and nearby regions. It describes house pits,
    kashim remains, burned villages, artifacts, local fear of excavation, traditions
    of settlements destroyed by war parties, claims about founders and former inhabitants,
    a smallpox tradition, possible underground passageways, and a report that some
    old sites were once inhabited by a vanished race of very small people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ancient Eskimo village ruins are described as common from the lower Yukon
    along the coast to Point Barrow and on the Siberian shore from East Cape toward
    Cape Waukarem.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At an old village site on southern St Michael Island, saucer-shaped pits marked
    places formerly occupied by houses.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The St Michael Island village site showed signs of burning through charred
    timbers mixed with the soil, and yielded a slate fish knife, ivory spearhead,
    bark doll, and bark toy dish.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Men from St Michael accompanying the observer became alarmed by superstitious
    feelings, causing excavation assistance at that place to stop.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The observer later learned that the St Michael Island village had been built
    by people from Pastolik who went there to fish and hunt seals before the Russians
    arrived.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: On Whale Island, ruins of a kashim and several houses were said by St Michael
    people to have been destroyed before Russian arrival by a war party from below
    the Yukon mouth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Whale Island had been partly washed away by the sea, frozen soil stopped excavation
    at about two feet, and ancient bone and ivory carvings crumbled when exposed.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Along the lower Yukon, old men attributed many destroyed-village indications
    to war parties from Askinuk and Kushunuk during a period of almost constant warfare
    before the Russians.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A site on the left bank of the Yukon below Ikogmut was said to have many house
    sites and, according to Yukon Eskimo, 35 kashims; one tradition connected its
    builders with Bristol Bay, Nunivak Island, and Kushunuk.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: One informant said part of the large Yukon village was occupied until 1848,
    when the last inhabitants died of smallpox, though the observer could not verify
    the claim.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Near Goodnews Bay, an informant described a circular pit about 75 feet in
    diameter as the former site of a very large kashim.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Near Shaktolik, Eskimo and fur traders reported an old village site, and ditch-like
