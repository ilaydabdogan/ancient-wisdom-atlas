canonical_text:
  quote: ''
  summary: 'The passage describes several Bering Strait and Arctic hunting methods:
    coordinated deer ambush, enclosure drives, rawhide deer snares, running down young
    fawns as a test of endurance, heavy reindeer killing after firearms became available,
    sheep hunting, illustrated deer-snare models and etchings, and polar bear hunting
    by ambush on sea ice.'
