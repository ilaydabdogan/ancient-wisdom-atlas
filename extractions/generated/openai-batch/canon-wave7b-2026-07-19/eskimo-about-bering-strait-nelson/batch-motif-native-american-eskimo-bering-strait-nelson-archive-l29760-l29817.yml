literal_observations:
- id: obs:1
  text: The traveler springs into a hole in the ground as a crash shakes the earth;
    he is rendered unconscious while the basket moves nearby as if searching and making
    fearful sounds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The basket is seen resting on the ground with a man’s head and shoulders sticking
    out of its top; when the young man challenges it and returns to the hole, the
    basket’s noise renders him senseless again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young man raises both hands, calls on thunder and lightning, and commands
    them to roar and flash about the basket; they obey, and the basket shaman trembles
    and falls to the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the thunder stops, the basket retreats; the young man orders thunder
    to pursue and terrify it, and the basket floats away slowly, sometimes falling
    to the ground.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At twilight the traveler reaches a village, where a boy says no one has come
    from that direction because the basket shaman destroys living things that pass
    the lake.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The boy warns that the basket man will kill the traveler unless he goes back;
    the traveler then sees a great eagle rise and fly toward him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the eagle dives, the young man strikes his breast with one hand, and
    a gerfalcon darts from his mouth into the eagle, giving him time to evade the
    eagle’s claws.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The gerfalcon is explained as coming from the strong substance given to the
    young man by the first old man on the road.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the eagle attacks again, the young man repeats the breast-striking gesture;
    an ermine springs from his mouth, attacks under the eagle’s wings, eats through
    its side, and the eagle falls dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The ermine is explained as coming from the gift of the second man with whom
    the traveler had stopped.
  category: relationship
  evidence_refs:
  - ev:8
