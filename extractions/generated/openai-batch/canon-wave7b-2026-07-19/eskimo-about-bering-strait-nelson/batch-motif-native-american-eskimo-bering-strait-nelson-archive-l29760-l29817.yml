canonical_text:
  quote: "“the basket shaman allows no living thing to pass the lake”"
  summary: A young traveler survives attacks by a basket shaman, calls thunder and
    lightning to terrify and drive it away, then reaches a village where a boy warns
    him. A great eagle attacks; the traveler releases a gerfalcon and then an ermine
    from his mouth, both linked to earlier gifts, and the ermine kills the eagle.
  language: English
