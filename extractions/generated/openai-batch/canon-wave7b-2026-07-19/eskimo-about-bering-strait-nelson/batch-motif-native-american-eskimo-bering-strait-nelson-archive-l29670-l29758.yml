canonical_text:
  quote: ''
  summary: A solitary and unusual young man from a northern village grows to manhood,
    accepts special clothing made by his mother, and departs northward with a bear
    spear in search of a wife despite his parents' grief and warnings that no one
    returns from that direction. On the way he twice encounters solitary huts where
    old men making arrows detect him without looking, know his purpose, warn him,
    and give him strengthening objects or advice. He then reaches a pond near the
    seashore, hears repeated thunderous roars that disorient him, and sees a large
    willow-root basket floating toward him through the air, producing the noise.
  language: English
  quote_policy: summarized
