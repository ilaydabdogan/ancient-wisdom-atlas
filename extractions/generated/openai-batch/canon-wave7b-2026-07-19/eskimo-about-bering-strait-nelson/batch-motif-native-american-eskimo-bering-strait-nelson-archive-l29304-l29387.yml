canonical_text:
  quote: ''
  summary: A Raven boy persuades his aunt to tell him where the light is hidden, travels
    south through darkness, finds a man near a hill where light and darkness alternate,
    steals a ball of light and a shovel, transforms into a raven to escape, and distributes
    pieces of light on his return, thereby establishing day and night and explaining
    their unequal lengths. Later he is carried across the sea on ice, marries, has
    children, dies, and his descendants become ravens who no longer change into people.
  language: English
  quote_policy: summarized
