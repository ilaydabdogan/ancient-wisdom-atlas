canonical_text:
  quote: ''
  summary: 'The passage describes mortuary practices around Bering Strait: the body
    is folded, wrapped, removed by a roof or rear opening rather than the doorway,
    placed in a grave box with bedding and personal possessions, marked with totemic
    or paternal-exploit imagery, and accompanied by offerings. It also describes post-death
    work and tool taboos meant to avoid harming or angering the shade, and reports
    an older Unalit practice of exposing the dead on the tundra before adoption of
    grave boxes, which are said to keep shades from wandering.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The body is placed in a seated, tightly flexed posture, with knees against
    the chest and hands clasping the abdomen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The body is wrapped in grass mats or deerskins and bound tightly with rawhide
    cords.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The body is usually raised out through the smoke hole and is never taken out
    by the doorway; if needed, a rear opening is made and then closed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the grave box the body is laid on one side with the deceased person's deerskin
    bed beneath it and blankets over it, then the cover is fastened down.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For a deceased man, tobacco-related objects may be placed in the box, and
    his paddle may be planted or fastened nearby so that its totem mark identifies
    the grave.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Grave boxes or boards may bear totem pictures, an animal associated with the
    father's hunting skill, or a bow if the father joined a war party.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:7
  text: A man's snowshoes, spears, bow and arrows or gun, open workbag with tools,
    and kayak frame are arranged at or near the grave.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: For a deceased woman, sewing and cutting tools may be placed in the box, while
    dishes, pots, bracelets, a deer-tooth belt, and other belongings are placed or
    hung near the grave.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the grave and belongings are arranged, relatives make small food offerings
    and pour water on the ground beside the grave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the day of a death no one in the village may work, and relatives must do
    no labor during the next three days.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Cutting with edged tools and using pointed tools are forbidden during the
    taboo period because such actions might injure the shade, angering it and causing
    sickness or death.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Relatives are also warned not to make loud or harsh noises that might startle
    or anger the shade.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The older Unalit practice reportedly exposed the dead on the tundra with weapons
    and tools beside them, laid the body on its back, and placed two sticks crossing
    over the face.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage states that the Unalit adopted grave boxes from the south and
    contrasts this with northern Malemut practice of throwing out many of their dead.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: An informant says grave boxes are better because they keep shades from wandering
    and prevent dogs from eating bodies.
  category: speech
  evidence_refs:
  - ev:9
