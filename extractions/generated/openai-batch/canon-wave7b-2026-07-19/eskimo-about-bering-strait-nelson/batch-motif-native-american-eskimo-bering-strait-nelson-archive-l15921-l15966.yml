canonical_text:
  quote: ''
  summary: 'The passage describes several Bering Strait house forms: an interior fire
    protected from draft by a stone slab and sleeping platforms; seasonal conical
    driftwood shelters between Ignituk and Cape Nome used for spring marmot snaring
    and summer salmon fishing; and north Cape Nome driftwood houses with a roof-entered
    storeroom, notched ladder, low passages, living rooms, sleeping benches, and a
    cooking room.'
