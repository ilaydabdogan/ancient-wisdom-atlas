canonical_text:
  quote: ''
  summary: 'The passage reports intergroup warfare among Eskimo communities around
    Bering Strait and nearby regions: night raids, killing and pillage, seizure of
    ornaments from bodies, display of severed heads, named conflicts and alliances,
    killing of storm-driven cross-strait travelers, a later peace agreement at Port
    Clarence, and the use of walrus-ivory and iron armor.'
  language: English
  quote_policy: summarized
