  text: In reported battles between lower Kuskokwim River people and Bristol Bay people,
    victors cut off the heads of slain enemies and placed them on sharp stakes with
    arrows through the noses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Low mounds on a flat near the northern branch of the Yukon mouth were said
