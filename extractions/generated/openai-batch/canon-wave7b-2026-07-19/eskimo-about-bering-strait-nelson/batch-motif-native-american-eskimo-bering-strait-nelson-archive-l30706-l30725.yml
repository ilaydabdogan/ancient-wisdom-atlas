canonical_text:
  quote: '"You are no more my brother."'
  summary: On a calm day, the householder and Chim-uh'-luk paddle kaiaks far out to
    sea and race back to shore. After they reach the beach together, the householder
    angrily disowns him as a brother and they separate. As they go, one changes into
    a Wolverine and the other into a Gray Wolf; they are said still to wander in the
    same country but never together.
