canonical_text:
  quote: ''
  summary: A nonmoving man is discussed by nearby figures who debate whether he is
    dead. Raven approaches, intending to take the man's eyes with a fine knife. The
    man opens his eyes slightly, watches the knife come close, snatches it, and sits
    up. Raven demands the return of his knife and offers payment in game, but the
    man refuses. Raven warns him about keeping the knife. The man gathers scattered
    things and goes back with the knife; while returning, his throat contracts, his
    back curves, his hands rest on his knees, he becomes an old man, falls face down,
    and dies.
  language: English with interlinear transliteration/glosses
