  summary: 'Ethnographic account of limited Christian influence among Eskimo communities
    near Bering Strait: ancient rites and shamanic beliefs persisted, some practices
    became more secretive under outsider pressure, metal crosses were given to encourage
    church attendance, and Greek Catholic services were interpreted through the model
    and terminology of an indigenous mask festival.'
