  quote: ''
  summary: 'The passage describes several implements: a thin whale-jawbone blade fastened
    to a wooden handle with rawhide; a wooden shovel from Ikogmut with a long flat
    blade, curved handle, red-painted surfaces, and an incised private owner mark;
    and an ice pick from Point Barrow made from a walrus tusk attached to a flat wooden
    handle with rawhide lashing, braided sinew grips, and wooden projections to prevent
    slipping.'
