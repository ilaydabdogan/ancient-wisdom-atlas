canonical_text:
  quote: ''
  summary: 'The passage describes portions of a Bering Strait Eskimo bladder festival:
    kin-based male dance sets, food offerings, handling of grass said to serve as
    beds for bladder inuas, torch and spearpoint actions said to symbolize seal killing,
    shamanic speech and animal sounds, dawn repetition of dances, purification with
    a parsnip-stalk torch, offerings to bladders, a boy placed across the entrance
    hole, communal song, and hunters fastening their owned bladders to spearshafts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sets of dancers were said to comprise men of the same kin or gens, and four
    gentes were represented by totem marks on four paddles before the door.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a dance, four dishes of food were carried around the hole in the floor,
    then their contents were distributed and eaten.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two men stripped to the waist sat on mats facing the entrance hole while hunters
    beneath the floor handed up straw or grass wisps; the recipient called each owner's
    name and the owner answered with a short speech.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speeches stated that the grass being handed up served as beds for the
    inuas of the bladders.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man broke and bound each grass wisp, passed a lighted parsnip-stalk torch
    with attached spearpoints over and around it, spoke, fell and rolled over, and
    laid the grass on the floor; the passage states that this symbolized killing seals
    with the spearpoints attached to the torch.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At midnight the lamps were extinguished, and the shaman went to the roof to
    speak to the bladders through the smoke hole, ending with sounds like seals or
    walrus surfacing and like a pup seal seeking its mother.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At four o'clock in the morning, the previous dances by sets of four men were
    repeated, and the woman dancing with each set passed unlighted parsnip stalks
    about the food before offerings to the bladder inuas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The chief shaman lit a parsnip-stalk torch and passed it close to the floor
    around the room, around dancers, and inside and around their fur coats; the stated
    purpose was purification and removal of evil influences that could bring sickness
    or bad luck to hunters.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Four men sat beneath the bladders briefly, then sat close together on the
    sleeping bench behind the spears and bladders.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A woman brought a large wooden bucket of food, passed a lighted parsnip-stalk
    torch about it, made an offering to the bladders, and stood close enough that
    the swung bladders brushed her back.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The shaman laid a boy about twelve years old, stripped to the waist, across
    the entrance hole, knelt over him, and made a low murre-like noise while a man
    beneath the floor began a song joined by the people in the kashim.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the song, hunters took the bladders they owned, fastened them about
    the heads of pointless spearshafts, and after another song laid the bladders with
    the spearshafts near the entrance hole.
  category: sequence
  evidence_refs:
  - ev:10
