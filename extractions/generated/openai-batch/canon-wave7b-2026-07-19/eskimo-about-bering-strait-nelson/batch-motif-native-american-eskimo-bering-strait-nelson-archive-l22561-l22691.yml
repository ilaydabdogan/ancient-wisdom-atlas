  quote: ''
  summary: 'The passage describes portions of a mortuary feast in a kashim: a plan
    of the ceremonial space, offerings made by distant guests, distribution of gifts,
    songs and dances by feast givers, totemic animal-skin fillets, ranked seating
    of guests by distance traveled, and the placement of lamps and spectators.'
