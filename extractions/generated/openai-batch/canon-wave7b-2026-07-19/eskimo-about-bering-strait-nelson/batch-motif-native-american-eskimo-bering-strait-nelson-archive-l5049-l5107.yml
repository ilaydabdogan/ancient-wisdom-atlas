    funnels are sometimes used for filling.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: One wooden St Michael nozzle is spoon-shaped and includes a grotesque walrus
    head with ivory tusks and eyes, hind flippers, painted fore flippers, a central
    perforation, and a stopper-like base.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some spoon-shaped nozzles have wooden stoppers attached by cords.
  category: object
  evidence_refs:
