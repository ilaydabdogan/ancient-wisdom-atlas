canonical_text:
  quote: ''
  summary: The passage describes several games around St Michael and neighboring coast
    regions, including an explanation of winter aurora as boys or shades playing a
    ball game. It then gives rules, seasons, participants, objects, and settings for
    women’s football, hand ball, hockey, a grass-ball game, rope jumping, blind-man’s
    buff, and hide and seek.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Winter northern lights are said by some people to be boys playing the game;
    others say they are shades playing with walrus skulls as balls.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women’s football is played by women in fall and winter, commonly with four
    players standing opposite each other in pairs and driving or throwing balls back
    and forth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In women’s football, a player strikes, catches, tosses, or kicks the ball
    back, and the person who misses least or has fewer dead balls on her side wins.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hand ball uses a rounded rectangular leather bag filled with sand or earth,
    with young men on one side and young women on the opposite side.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hand ball is played in May and June during long twilight nights and can last
    the entire night.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: In hand ball, a young man who has not held the ball for a long time is called
    hungry; if women intercept the ball, they catch him, rub his head with it, and
    say they will oil his head so he will not starve.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hand-ball game continues night after night during the season on top of
    a hill near St Michael, with laughter and cries heard for hours.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Hockey is played with a small ball of ivory, leather, or wood and a stick
    curved at the lower end; players divide into two parties and try to drive the
    ball across the opponents’ goal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In summer, men make a stout grass ball for the grass-ball game; sides try
    to hit opponents with the ball, and the side with the greatest number of hits
    wins.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rope jumping is a summer outdoor game using a heavy braided grass rope swung
    in a circle by two holders while a player jumps it twice and springs away without
    being touched.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Blind-man’s buff is played by young people in spring and summer; one player
    is blindfolded while others stand in a circle, shout, then move quietly to avoid
    being caught.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hide and seek is played in summer when the grass is long by men and women
    separately; a designated player hides, gives a faint cry, and the opposing side
    searches for the concealed player.
  category: action
  evidence_refs:
  - ev:9
