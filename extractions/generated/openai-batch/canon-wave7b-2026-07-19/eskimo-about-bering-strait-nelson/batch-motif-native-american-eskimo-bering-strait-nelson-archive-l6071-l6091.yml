  summary: The passage describes beaver-tooth tools used around Bering Strait as gouges,
    polishers, and knife sharpeners, with examples from Chalitmut, Port Clarence,
    and Norton Sound. It notes that such tools continued in use but were partly replaced
    by steel and iron implements.
