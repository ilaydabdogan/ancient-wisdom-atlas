canonical_text:
  quote: ''
  summary: Ethnographic passage describing the distribution, decline, and regional
    variation of labret wearing and tattooing among Eskimo communities around Bering
    Strait, with detailed descriptions of women's and men's ivory labret forms, lip
    piercings, beads, and construction variants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that labret wearing and tattooing are very general among
    Eskimo of the Alaskan mainland and islands northward from the Kuskokwim River,
    and that style and tattoo patterns vary by locality.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that labret wearing is almost lost among Eskimo of the
    Asiatic coast and St Lawrence Island; one man at St Lawrence Island had tattooed
    circles on both sides of his chin to represent labrets, and some Mechigme Bay
    people had labret holes in their lips.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that Eskimo of the Yukon and Kuskokwim nearest the Tiune
    had generally abandoned labret wearing, and that the custom was becoming obsolete
    where there was constant intercourse with whites.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: At St Michael, the author reports that very young Unalit men were seldom seen
    with pierced lips, no boys were thought to have been pierced during the author's
    residence, and many old men had ceased wearing labrets although youth-made incisions
    remained.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among Eskimo of Bering Strait and northward, where contact with whites was
    irregular, labret wearing is described as still in full force; the author states
    that increasing intercourse with civilized people would likely make the custom
    obsolete.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Southward from the Yukon mouth, labrets were not universally worn among men,
    and every village had some men and many women without them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women's labrets are described as curious sickle-shaped objects, often with
    holes in the lower border for short strings of beads; women who wore them had
    one or two holes pierced in the under lip over the middle of the chin.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The observed use of women's labrets was limited to the district between the
    Yukon and Kuskokwim rivers and Nunivak Island; the author did not see women using
    labrets elsewhere.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Askinuk, Kushunuk, and nearby places, the common women's form was a small
    flattened sickle-shaped piece of ivory with a broad base against the teeth and
    a thin flat outer tip; one common variation joined two sickle-shaped parts with
    a crosspiece.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Other women's labret forms joined the inner ends or bases of the sickle-shaped
    points, and one lower Kuskokwim specimen allowed insertion through a single central
    lower-lip orifice.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Nunivak Island women's labrets included forms with separate perforated ivory
    disks for the inner ends; another Nunivak specimen had an external bar and three
    short double strings of beads hanging over the chin.
  category: object
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Men's labrets in the district between the Yukon and Kuskokwim are described
    as small, with a curved ivory flange against the teeth, a hat-shaped projection
    through the lip, a central hole, a wooden pin, and an outer bead, stone, or lead
    piece.
  category: object
  evidence_refs:
  - ev:10
