canonical_text:
  quote: ''
  summary: The passage describes animal skins and pelts as units of trade value among
    Alaskan Eskimo groups around Bering Strait. It identifies earlier and later standard
    skins, lists coat-making bundles of smaller skins with Unalit terms, and notes
    relative values for wolf, wolverine, muskrat, and Parry's marmot pelts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mammal skins are described as the most valuable portable property among the
    Alaskan Eskimo and as a convenient standard of value.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before the arrival of Russians around the Yukon district, a full-grown land
    otter skin was considered the unit of value, and a large hair seal skin was equal
    to it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In later years, beaver skin replaced otter skin as the unit of trade value.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Other skins, furs, and trade articles are valued as a skin, or as multiples
    or fractions of a skin.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Certain small untanned skins used for coats or blouses are tied in coat-sized
    lots and sold as sets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Four reindeer fawn skins, forty Parry's marmot skins, or forty muskrat skins
    are described as sufficient quantities for a coat, with specific Unalit terms
    for each bundle.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A wolf or wolverine pelt is worth several skins in trade, while multiple muskrat
    or Parry's marmot pelts are needed to equal the value of one skin.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The listed terms are identified as Unalit, with similar terms in use among
    all Eskimo of the region.
  category: speech
  evidence_refs:
  - ev:7
