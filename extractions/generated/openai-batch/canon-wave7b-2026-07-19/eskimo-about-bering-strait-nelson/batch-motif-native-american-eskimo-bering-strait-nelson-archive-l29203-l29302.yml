canonical_text:
  quote: ''
  summary: 'A Lower Yukon tale explains the sun and moon as a girl and a boy who ascend
    into the sky, where the boy-moon eternally pursues the girl-sun and waxes and
    wanes through starvation and feeding. A second Lower Yukon origin account describes
    primordial water and ice, a man marrying a she-wolf, their boy-girl paired children
    dispersing, making peoples and languages, while melting snow forms ravines, rivers,
    and streams. A third excerpt begins a Raven light-bringing story: after the sun
    and moon are taken away, shamans fail to restore light, and a despised orphan
    boy who can become a raven by wearing a black coat asks his aunt where the luminaries
    have gone.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A village on the great river has four brothers, a sister, and a small boy
    companion of the sister; the brothers are hunters who go to sea and to the mountains.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sister wakes and finds the boy lying close to her in bed; she becomes
    angry and makes him sleep in the kashim with the men.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sister withholds ordinary food from the boy, mixes berries and deer fat,
    cuts off one of her breasts, places it in the dish, and offers it to him; he refuses
    it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the boy refuses the dish, the sister goes outside, sees a ladder and
    line leading into the sky, takes the line, and ascends.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The boy hurriedly puts on sealskin breeches and a deerskin sock, goes outside,
    sees the girl high in the sky, and climbs the ladder after her while she floats
    away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The girl becomes the sun and the boy becomes the moon; the moon pursues but
    never overtakes the sun, wanes from hunger, is fed from the dish containing the
    breast, becomes full, and then starves again.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the beginning of the land-and-people account, water covers the whole earth,
    the water is iced over, it is very cold, there are no people, and the ice grinds
    into ridges and hummocks.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man comes from the far side of the great water, stops on ice hills near
    Pikmiktalik, takes a she-wolf as wife, and has many children born in boy-and-girl
    pairs, each pair with its own language.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Each boy-girl pair is sent in a different direction; the ice hills become
    snow-covered mountains, melting snow cuts ravines and river beds, and the pairs’
    descendants establish the peoples and languages of the earth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the light-bringing excerpt, the sun and moon once give light but are taken
    away, leaving only starlight; shamans try charms but fail to restore light.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A despised orphan boy in the kashim mocks the shamans by saying he can bring
    back the light; the shamans beat him and drive him out.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The orphan boy becomes a raven when he puts on a black coat and remains in
