canonical_text:
  quote: ''
  summary: During a mortuary feast, male feast givers prepare skins and other goods,
    bring them into the kashim through the smoke hole while singing invitations to
    the dead, depreciate their value, and distribute them to guests. Women and children
    later enter for food distribution. Participants make small food offerings by lamps
    to the shades, and boys also offer crumbs. The passage explains that self-deprecation
    shows humility and is believed necessary to avoid anger from the shades and resulting
    sickness or evil. The passage ends with shouted remarks from the smoke hole and
    the lowering of a filled grass bag.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At midday, male feast givers tied skins and other articles onto long rawhide
    cords and poles outside the kashim.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The goods included deer skins, seal skins, white drilling trousers, wooden
    dishes, rabbit-skin coats, and steel fox-traps.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men and large boys gathered in the kashim, while women and children were not
    permitted there at that time.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bundles were lowered through the smoke hole, and their owners sang songs of
    invitation to the dead as the bundles were raised, lowered, and untied.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the goods were brought in, the feast givers said how easily they had
    obtained them and depreciated their value before distributing them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Interior guests received seal skins because seals were scarce for them, and
    coastal people received reindeer skins for a similar reason.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Women and children later entered, and the male feast givers brought seal,
    whale, and fish oil, reindeer fat, pilot bread, and other food into the room.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each food owner sat by his pile, stated that he had procured the food easily,
    and two of the men performed a mock quarrel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that depreciating the articles shows humility and lack
    of pride, and that failure to do this is believed to make the shades angry and
    bring sickness or other evil on the village.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:10
  text: Before food distribution, each person made a small offering by his or her
    lamp from every kind of food and from each container of oil or food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Small boys scrambled for pilot-bread fragments and then cast crumbs at the
    foot of the lamps as an offering to the shades.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Male feast givers sang a short lively song, after which people carried home
    the food that had been distributed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the food was removed, voices from the smoke hole made remarks about
    half-full or empty bags, sickness, sleeping, and stealing little, and a large
    filled grass bag was lowered.
  category: speech
  evidence_refs:
  - ev:6
