canonical_text:
  quote: ''
  summary: A woman is carried home by a storm, returns to a husband who had mourned
    her, and brings ear tips that turn into full skins. The couple obtains a son after
    the husband draws a boy shape on the woman's abdomen with an oiled feather. The
    son, Kifi-iik/Kin-iik, grows powerful but violent, is expelled by his mother,
    and later disappears after violating a prohibition against approaching the lips
    of a giant's head. The giant's breathing is said to reveal his continued existence
    through winter north winds. The next tale begins with a young man who can never
    find what he seeks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A tempest of wind and fine snow drives the woman until she sleeps; when she
    wakes she is on the ground before the houses of jSHkh'-ta.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband had mourned the woman as dead, is pleased at her return, hears
    her story, and promises not to treat her badly again.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ear tips placed in the storehouse become complete skins overnight, and the
    skins make the husband rich and a head man of the village.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the husband laments that they have no son, he tells his wife to bathe,
    dips a feather in oil, and draws the form of a boy on her abdomen; she later bears
    a son.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The boy grows rapidly, excels in strength, agility, and marksmanship, and
    is named Kifi-iik in memory of the giant.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the husband tries to beat his wife, she calls on Kin-iik, and a blast
    of wind blows the husband away; he is not seen again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: As a young man Kifi-iik is a successful hunter with a fierce temper and repeatedly
    kills companions or other people after quarrels.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Kifi-iik's mother refuses to let him live with her because his violence has
    killed or driven away friends; before leaving, he fills her storehouse with food
    and skins.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kifi-iik reaches the giant's head, and the giant allows him to stay on his
    face but warns him not to go near the lips.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kifi-iik goes through the giant's beard to the mouth, steps on the lips, and
    is hurled into the air by a blast of wind from the opening.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The giant is said still to live in the north, and his breathing is identified
    with fierce snow-drifting winter north winds.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The next tale introduces a small, ugly-faced young man who can never find
    what he seeks; after failing to find wood, he sits quietly in the kashim and drinks
    water given by someone beside him.
  category: sequence
  evidence_refs:
  - ev:10
