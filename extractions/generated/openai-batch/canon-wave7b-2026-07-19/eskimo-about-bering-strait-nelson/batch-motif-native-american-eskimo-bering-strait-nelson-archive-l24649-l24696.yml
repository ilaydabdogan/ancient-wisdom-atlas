  summary: 'The passage describes three mask objects: a flattened mask representing
    the face of a tungliak; a waterfowl inua mask with bird mandibles, side flaps,
    owl feathers, and game-animal drawings; and a sea parrot mask shown swimming and
    holding a walrus figure in its beak.'
  language: English
