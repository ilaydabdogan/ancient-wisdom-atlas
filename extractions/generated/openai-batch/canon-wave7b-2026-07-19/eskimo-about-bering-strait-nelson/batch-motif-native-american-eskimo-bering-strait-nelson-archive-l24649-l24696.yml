literal_observations:
- id: obs:1
  text: The first described object is a flattened, rounded mask with a fantastic human
    face, a short nose, and a wide crescentic mouth with upturned corners.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first mask has a deerskin band with upstanding hair, whalebone pieces
    with slender wooden appendages that move with the dancer, and parchment strips
    hanging over the eyes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first mask is painted green with dull brown spots, has red sticks on the
    whalebone ends, and is stated to represent the face of a tungliak.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The second mask has a bird-head and upper-mandible attachment above the mouth,
    a wooden peg for the lower mandible, and side strips intended to indicate doors.
  category: object
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:5
  text: The second mask has red eyebrow incisions, horned owl feathers around the
    borders, a white face and flap interiors, black bird eyes and beak, and black
    lines across the eyebrows and cheeks.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The second mask has drawings of seal, walrus, killer whale, reindeer, wolf,
    and beaver on the side flaps.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The second mask is stated to represent the inua of an unidentified species
    of waterfowl, and the author judges it was used in festivals for success in hunting.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:8
  text: The third object is a carved sea parrot mask representing the upper half of
    the bird as it would appear when swimming on the water.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The sea parrot mask has a separately made head and neck joined by a pin, and
    an upturned beak holding a wooden walrus figure with a cloth neck that lets the
    head flap while the wearer dances.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sea parrot mask is surrounded by two hoops of splints and has a strip
    of reindeer skin with long hairs attached in front of pegs.
  category: object
  evidence_refs:
  - ev:5
