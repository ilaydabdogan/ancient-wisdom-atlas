  quote: ''
  summary: 'The passage catalogs several mythic animals or beings described among
    Eskimo groups around Bering Strait and the lower Yukon: a monstrous nursing child,
    headless chest-mouthed beings, the a-mi''-kuk sea creature, the sea shrew-mouse,
    the walrus dog, an underground mammoth-bone animal, Ko''-gat of lonely lakes,
    and yu-a shades of things and elements.'
