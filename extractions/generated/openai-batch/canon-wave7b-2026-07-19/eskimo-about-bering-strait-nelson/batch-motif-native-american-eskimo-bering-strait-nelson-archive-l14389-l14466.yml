canonical_text:
  quote: ''
  summary: The passage describes traditional and contemporary trading voyages among
    Bering Strait communities and neighboring Siberian groups. It records cross-strait
    summer travel, winter sledge trading after the sea freezes, exchanges of skins
    and other goods, the role of fairs and trading vessels, and the movement of materials
    such as cloth, tobacco, jadeite, paint, dishes, seal oil, fish, and animal skins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Traditions attribute regular summer trading voyages across Bering Strait to
    the people on the coast of Bering Strait in ancient times.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Small pieces of cloth and bundles of Circassian leaf tobacco were said to
    have reached American Eskimo through trade with East Cape people and Asiatic neighbors
    before direct contact with white men.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ancient intertribal communication along the coast is described as irregular
    and uncertain because of hostility, so trading was limited to villages on friendly
    terms.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says later barriers had been broken down and active barter between
    communities had become prominent, especially between the Kuskokwim and Kotzebue
    Sound region.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: People of Bering Strait carried tame reindeer skins obtained from the Asiatic
    coast to Kotzebue Sound and the Yukon mouth, receiving fur-bearing animal skins
    in barter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Beaver and land-otter skins were highly prized for exchange with the Chukchi,
    who offered two full-size deerskins for one such skin and used the skins for coat
    trimming and trade with Russians.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: Traders from East Cape and the Diomede Islands made yearly voyages to Kotzebue
    Sound, where Eskimo of the Kowak and Noatak rivers held a summer fair.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the sea froze in winter, Eskimo who had obtained reindeer skins traveled
    with dogs and sledges along the coast to barter for furs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Malemut of Kotzebue Sound made trading trips southward to the Yukon and
    even to enemies identified as the Tinue of Koyukuk River.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage describes the Malemut as energetic, enterprising, courageous,
    domineering, and disliked by many people with whom they dealt.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Trading voyages carried beads, useful or ornamental articles, jadeite, green
    and red paint, wooden dishes, seal oil, dried fish, and animal skins from one
    locality to another.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: A Siberian squirrel skin obtained on Bering Strait was brought to the narrator
    by a Norton Sound Eskimo, and the passage infers that the skin came from interior
    Siberia.
  category: sequence
  evidence_refs:
  - ev:5
