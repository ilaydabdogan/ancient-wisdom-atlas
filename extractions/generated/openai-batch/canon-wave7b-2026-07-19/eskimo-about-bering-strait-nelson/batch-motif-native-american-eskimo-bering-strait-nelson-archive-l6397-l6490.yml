canonical_text:
  quote: ''
  summary: The passage describes several wooden tool or trinket boxes from Cape Vancouver,
    Pastolik, Kaialigamut, and Anogogniut. Several boxes are shaped or carved as seals,
    with inlaid eyes, nostrils, flippers, mouths, tails, painted grooves, rawhide
    hinges, and fasteners. Interior lid decoration includes painted human and animal
    figures, including a thunderbird grasping or seizing animals and a man in a kaiak,
    a double-headed wolf connected by a black line to a man's hand, obscene figures,
    and a private owner's mark.
  language: English
  quote_policy: summarized
