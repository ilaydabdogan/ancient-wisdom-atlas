canonical_text:
  quote: ''
  summary: 'The passage describes part of a mortuary feast: women feast givers bring
    and distribute articles, male relatives humorously display them, lines with gifts
    are drawn down through the smoke hole while mournful songs ask deceased relatives
    to return, symbolic implement models identify the occupations and sex of the dead,
    and the day ends after gifts are distributed among those present.'
  language: English
  quote_policy: summarized
