- id: obs:1
  text: Participants entered the room and took their usual places by the lamps.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women brought many small articles, including spruce gum, children's wooden
    snow knives, ladles, dishes, lashing materials, fish-trap splints, and sinew thread.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Male relatives of the women feast givers held up the articles one by one and
    made depreciative or joking remarks about them, causing laughter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The women called out the names or nicknames of intended recipients and handed
    or tossed presents to them amid loud replies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During this distribution the feast givers stood erect, described as the first
    time they did so during the ceremony.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A small stick attached to a line was lowered through the smoke hole, and a
    woman feast giver below drew in the line while singing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The song asked a brother to come back, stated loneliness, and said that a
    small present would be given.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Each woman drew down a string in the same manner and sang similar songs asking
    the return of the people for whom she mourned, while the assembled people joined
    in a mournful chorus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The articles fastened to the lines included grass mats, baskets or bags, socks,
    fishskin bags and boots, cloth, tobacco bags, wooden dishes, ladles, workbags,
    bathing caps, and tool bags.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: At the end of each line were one or more small wooden models of implements
    such as oars or paddles, described as symbolical of the occupation of the mourned
    relative and indicating the sex of the deceased.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: When these symbols appeared, the women grasped them, held them above their
    heads, and said they had searched and found only the object associated with the
    lost person.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After each line was fully drawn in, the articles were untied and placed in
    a pile before the owner, and women made excuses or mock-humble explanations for
    the number of goods gathered.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: An old woman with an arrow tied to the end of her line sang with her husband
    for their lost children, nephew, and other lost ones.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: When the women had distributed all their articles among those present, the
    day's ceremonies were complete.
  category: sequence
  evidence_refs:
  - ev:8
