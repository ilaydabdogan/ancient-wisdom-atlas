  summary: The passage describes etched ivory pipestems and pipes from Norton Sound
    and Kotzebne/Kotzebue Sound. Their decoration includes hunting scenes with whales,
    walrus, seals, game, and fish; a man shooting with bow and arrow; people dancing
    in a kashim to drum music; raven totem marks near the mouthpiece; conventional
    designs; an inlaid clock-wheel on a leaden bowl; and football.
