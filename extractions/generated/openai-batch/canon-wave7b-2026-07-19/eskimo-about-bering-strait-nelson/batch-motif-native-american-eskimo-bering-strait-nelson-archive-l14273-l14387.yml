canonical_text:
  quote: ''
  summary: The passage describes ivory and deerhorn spear or paddle guards, boat-frame
    splices, bow protectors, and kaiak cross-cords from several Bering Strait-area
    localities. Many guards are carved as animals or semihuman figures, including
    seals, white whales, white bears, a hand with seal hair, a human-like form with
    flipper hands, and a land otter. Other fittings repair or protect kaiak and umiak
    frames, especially against floating ice. Kaiak cross-cords may be ornamented with
    carved ivory beads representing inflated sealskin floats, and similar cords are
    reported from Bristol Bay to beyond Kotzebue Sound.
  language: English
  quote_policy: summarized
