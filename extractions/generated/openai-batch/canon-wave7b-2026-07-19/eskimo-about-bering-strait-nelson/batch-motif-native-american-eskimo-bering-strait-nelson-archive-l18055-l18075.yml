  quote: "“The shaman beat the drum and sang for half an hour over the boy...”"
  summary: An ethnographic observer describes a pregnant interpreter’s wife traveling
    to Sledge Island to give birth among her own people. After a rapid delivery of
    a boy, a shaman borrows a drum and an ivory white-whale carving. The father says
    the whale image is to be put in the child’s mouth to help him become a good hunter,
    and the shaman drums and sings over the child to make him courageous and manly.
    The mother later returns home carrying the child.
