canonical_text:
  quote: ''
  summary: The passage contains three narratives. In the first, a lone woman in the
    south becomes the wife of a man from the north, is seized by the headman's son,
    divided in a struggle, and remade with wooden parts into two women whose descendants
    explain differences between northern and southern women's accomplishments. In
    the second, cranes carry off a lone young woman and the event explains their autumn
    circling and cries. In the third, dwarf visitors at Pikmiktalik display a different
    sled form and, after their child's death, model burial in a grave box with goods
    and four days of mourning, practices later adopted by the villagers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many men live in the northland with no women, while a single woman is known
    to live far away in the southland; one northern young man travels south and becomes
    her husband.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The headman's son journeys south, listens at the entrance passage, waits until
    the people inside sleep, then seizes the woman by the shoulders and begins dragging
    her away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The husband catches the woman by the feet at the doorway, and the struggle
    pulls her in two, leaving the thief with the upper half and the husband with the
    lower portion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Each man replaces the missing parts of the woman's body with carved wood;
    the fitted wooden parts become alive, producing two women from one original woman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The southern woman has wooden fingers, is a poor needlewoman, and is a fine
    dancer; the northern woman has wooden legs, is expert at needlework, and is a
    poor dancer.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Each of the two women passes her characteristics to her daughters, explaining
    a stated difference between women north and south of St Michael.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In autumn, cranes preparing to go south see a beautiful young woman standing
    alone near the village and carry her upward on their wings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The cranes circle below the woman so she cannot fall, and their loud cries
    drown her calls for help; she is carried away and never seen again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The narrative says cranes have circled and cried in autumn ever since that
    event.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A small man, small woman, and child come down the river on the ice to Pikmiktalik;
    their size is described through small garments and body measurements.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The dwarf man pulls a large loaded sled, draws it up a steep bank, and lifts
    it in a feat said to require several villagers.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The dwarf child is killed by a dog; the father kills the dog, makes a grave
    box for the child with toys, and does no work for four days.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After the dwarf couple leave, the villagers adopt the crosspiece sled model
    and burial with a grave box, grave goods, and four days of mourning.
  category: sequence
  evidence_refs:
  - ev:10
