  summary: The passage describes domestic provisions stored at one side of a platform
    or in a room corner. When a meal is to be prepared, a fire is made in the middle
    of the room, food is prepared, and each woman puts portions into wooden dishes,
    carries them to the kashim, and sets them beside the husband, father, or other
    person for whom she has provided.
