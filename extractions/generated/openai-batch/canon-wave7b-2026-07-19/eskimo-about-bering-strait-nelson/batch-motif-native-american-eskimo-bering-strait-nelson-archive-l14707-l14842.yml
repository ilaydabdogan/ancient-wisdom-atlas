canonical_text:
  quote: ''
  summary: 'The passage describes Eskimo chronometry about Bering Strait: time is
    reckoned by moons named for local phenomena, occupations, animal life, food cycles,
    and ritual occasions. Years may be counted as winters, and regional lists of moon
    names are given for Unalit, lower Yukon near Mission, and communities south of
    the Yukon delta.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Time is divided by moons, and each moon is designated by a characteristic
    local phenomenon accompanying it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The moons are used to reckon time during the year and to set dates in advance
    for festivals and rites.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The year is also frequently divided into four seasons according to regular
    occupations, but this seasonal division is described as less definite and less
    regular than reckoning by moons.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Years are referred to as winters because winter is described as the most impressive
    part of the year in the high latitude setting.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Unalit terms are listed for year, moon, spring, summer, autumn, winter, long
    ago, and very long ago.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Thirteen moons are counted to a year, although the collector did not obtain
    the complete series.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Unalit moon list names months by games, seal birth, seal stalking, ptarmigan
    plumage, kayak travel, fawn hunting, goose molting, reindeer velvet shedding,
    seal net setting, winter stores, and the drum month when winter festivals begin.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Several different names may designate the same moon when different occupations
    or natural occurrences are observed in the same season.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The lower Yukon list includes moon names connected with top-spinning, running
    around the kashim, offal eating during scarcity, cold, opening house passageways,
    birds and geese coming, eggs, salmon, waterfowl molting, young geese flying, reindeer
    velvet shedding, mush ice, muskrats, and a feast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The south-of-Yukon-delta list includes moon names connected with a top game,
    a festival with feathered straw fillets, long nights, hare netting, summer doors,
    geese, whitefish, salmon, geese and swans molting, bird migration, and reindeer
    velvet shedding.
  category: sequence
  evidence_refs:
  - ev:6
