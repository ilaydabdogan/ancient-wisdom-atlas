canonical_text:
  quote: ''
  summary: The passage describes an arrow from the lower Yukon and a sequence of fish-arrow
    specimens from several Bering Strait-region localities. It details shaft materials,
    feather vanes, bone heads, barbs, sinew lashings, ivory and whalebone fastenings,
    and two detachable-point designs, including one in which the freed point leaves
    the shaft floating as a drag on a struck fish.
  language: English
