canonical_text:
  quote: ''
  summary: 'Artifact catalogue passage describing arrowshaft straighteners and related
    tools from several Bering Strait localities. The specimens are made of deerhorn,
    ivory, or wood and include carved or etched animal forms: deer or reindeer heads,
    recumbent reindeer, bear heads, a white bear head and forelegs, bead eyes, a hoof
    terminal, iron-spike horns, and incised grooves. The passage also notes wide distribution
    of a general implement type and distinguishes some Norton Sound objects used for
    straightening and setting arrowpoints.'
  language: English
  quote_policy: summarized
