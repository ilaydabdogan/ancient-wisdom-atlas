  quote: ''
  summary: The passage describes general garment forms among western Eskimo communities
    around Bering Strait, including hooded frock-like upper garments, trousers, boots,
    women's combination garments, child garments, regional ornamentation, illustrated
    East Cape examples, animal-skin materials, and broad similarities along the American
    shore.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that western Eskimo garments are similar in general plan
    to those worn farther eastward, while varying locally in pattern and ornamentation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men and women are described as wearing a frock-like upper garment put on over
    the head, often with a hood.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men's lower garments are described as trousers from hip to ankle, worn with
    deerskin or grass socks and skin boots.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women's lower garments are described as combined boots and trousers reaching
    to the waist, sometimes with an attached oil-tanned sealskin sole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: On the Diomede islands, eastern Chukchi peninsula, and St Lawrence island,
    women wear a loose-waisted combination garment with flowing sleeves, baggy trouser
    legs, and a back slit that is laced up after dressing.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Small children are described as waddling in these combination garments; very
    young children may have the sleeve and leg ends sewn up so that only the face
    is visible.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Women in the region also wear a hooded outer frock reaching between waist
    and knee, with fur hood trim and a front bib-like flap or white reindeer-skin
    gore.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: St Lawrence island garments are described as ornamented with reddish-brown
    dyed fur tassels and rows of crested auklet crests and horny bill sheaths along
    seams.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: A photographed East Cape party is said to show one woman wearing a combination
    garment fur side out, another with fur inward, and two central figures wearing
    the frock in addition.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage identifies tame reindeer skins as the main clothing material,
    with limited use of wild reindeer, occasional waterfowl skins for poorer outer
    frocks, and reindeer-skin boots with tanned sealskin soles.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the American shore, men's and women's garments are described as closely
    alike in general style over a wide area from Point Barrow to the Yukon mouth,
    including King and Sledge islands.
  category: relationship
  evidence_refs:
  - ev:6
