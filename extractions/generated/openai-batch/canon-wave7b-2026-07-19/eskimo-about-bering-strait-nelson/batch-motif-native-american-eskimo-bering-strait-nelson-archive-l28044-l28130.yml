canonical_text:
  quote: ''
  summary: Raven seeks a wife among southbound migrating birds. After several birds
    ignore him, a family of white-front geese stops. Raven ornaments himself with
    a perforated white stone, and he and the geese temporarily become human by pushing
    up their bills like masks. Raven gives the stone to the goose girl and chooses
    her as wife. They return to bird form and fly south. Raven is admired at first
    for gliding gracefully, but during the journey he becomes tired, falls behind,
    rests on the geese in the water, and explains his weakness by claiming an old
    arrowhead wound pains him.
  language: English
  quote_policy: summarized
