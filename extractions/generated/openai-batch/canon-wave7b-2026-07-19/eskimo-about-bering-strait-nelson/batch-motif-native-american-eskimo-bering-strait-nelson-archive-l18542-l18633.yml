canonical_text:
  quote: ''
  summary: The passage describes a Point Hope camp at Cape Lisburne, its boats, lodges,
    food stores, people, animals, stream, cliffs, and departure by umiak with dogs
    towing. It then gives the narrator's reports and anecdotes about pilfering, bargaining,
    ridicule, begging for gifts, and a reported looting of a whaling vessel wrecked
    by ice near Point Barrow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Cape Lisburne, the narrator found a camp of people from Point Hope with
    nine umiaks drawn up on the shore, oil bags, and pieces of walrus and whale meat
    nearby.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Conical and round-top lodges stood behind the umiaks; men and women walked
    about or sat in the sun sewing or doing other work.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator describes the people's fur clothing as ragged and marked with
    dirt and grease.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old woman in a lodge was rolling up a bed, children played with small puppies,
    and dogs moved through the camp.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A clear brook ran between the lodges into the sea, and high cliffs rose behind
    the camp.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before the visitors left, the camp was broken, supplies were loaded into umiaks,
    dogs were harnessed to towlines, and the group started up the coast while one
    person from each umiak remained on shore to drive the dogs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator states that people of the islands and shore of Bering Strait
    and Kotzebue Sound were known among trading vessels for pilfering, and reports
    that villagers of Cape Prince of Wales had taken possession of lightly crewed
    vessels and carried off desired goods.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At East Cape, Siberia, children repeatedly tried to take small objects from
    the narrator, including a handkerchief from the narrator's pocket.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Point Hope, a man demanded tobacco after a sale while concealing a small
    comb in his palm; the narrator recognized the comb as stolen from his trading
    goods, took it back, and the man's companions laughed at him when he was caught.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The narrator generalizes that the Eskimo are sensitive to ridicule and quick
    to take offense at slights.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The narrator generalizes that people in large villages could become obtrusive
    or domineering in numbers, but quiet and mild-mannered when traveling in small
    numbers among strangers.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: At Point Hope, a crowd ran to the beach calling for presents, held onto the
    visitors, asked for gloves, and some tried to steal tobacco leaves carried by
    the narrator.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The narrator reports that after a whaling vessel was crushed by ice near Point
    Barrow, local Eskimo went by dog sled to the wreck and took sails, officers' chests,
    chronometers, charts, books, food, clothing, and other articles.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:14
  text: The reported Point Barrow episode continues with the local Eskimo refusing
    to return clothes or permit the wrecked crew to take ship provisions unless paid
    in tobacco; the crew lived on seal and walrus meat while the local people ate
    provisions from the wreck.
  category: sequence
  evidence_refs:
  - ev:14
