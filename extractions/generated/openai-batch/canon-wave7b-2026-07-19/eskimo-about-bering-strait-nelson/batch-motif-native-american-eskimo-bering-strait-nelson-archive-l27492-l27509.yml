canonical_text:
  quote: earth was flooded except a very high mountain in the middle
  summary: A Norton Sound Eskimo flood legend says that in the first days seawater
    covered the earth except for the top of a very high central mountain. Some animals
    escaped by climbing the mountain, and some people survived in an umiak while catching
    fish. After the waters receded, people and animals came down, animal life was
    replenished, and the flood was said to have formed the present hollows, ridges,
    mountains, and valleys.
