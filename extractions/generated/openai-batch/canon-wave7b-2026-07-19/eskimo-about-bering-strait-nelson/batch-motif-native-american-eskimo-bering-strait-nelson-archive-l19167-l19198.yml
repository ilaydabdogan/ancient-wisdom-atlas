  summary: The passage introduces mortuary customs among the Unalit at St Michael,
    gives local terms for corpse, spirit or shade, ghost or visible shade, and grave,
    and describes mourning, dressing the dead in best or unused clothing, preparing
    a drift-log burial box behind the village, and keeping the body on a sleeping
    platform beside a continuously burning oil lamp until burial while relatives and
    friends remain nearby.
