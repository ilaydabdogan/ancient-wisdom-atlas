canonical_text:
  quote: ''
  summary: 'The passage describes three games or play practices recorded around St
    Michael and other Arctic locations: a men-only net-and-dart target game in the
    kashim with staked prizes; a throwing-sticks game using ivory pins and rods that
    also serve as sinew-preparation tools; and football games using a stuffed leather
    ball, teams, marked goals, and a variant with two close lines of players.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The net-and-dart game is identified with St Michael and is played in the kashim
    by men only.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The net-and-dart target is a small oval wooden frame with a cord-netted interior,
    hung from the roof near the summer entrance or smoke-hole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each net-and-dart player uses a long slender dart with a barbed bone or deerhorn
    point and a cord attached to the butt end for drawing it back.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the net-and-dart game, players place prize objects under the target, throw
    three darts in succession, and a player who pierces the target sufficiently may
    take an item from the prize pile.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The throwing-sticks game uses a rectangular ivory pin planted upright in the
    kashim floor and two small flat ivory rods tossed toward it by each player.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the throwing-sticks game, the player whose rod lies closest to the pin
    wins choice of the staked articles, and play continues until all articles are
    won.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The rods and pins associated with throwing sticks also serve primarily for
    preparing and twisting sinew for sinew-backed bows.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Throwing-stick sets are usually walrus ivory and may carry carved or marked
    imagery, including reindeer heads, a raven totem, circle-and-dot ornamentation,
    a mammal leg-bone joint, or a small animal head probably representing a fox.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The football ball is made of leather, stuffed with deer hair or moss, and
    rarely exceeds five or six inches in diameter.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Football is played by young men and children, usually at the end of winter
    or in spring, and the passage reports it in several regional locations.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: One football form uses two leaders who choose teams, two marked goals, a ball
    tossed midway between sides, and a rush in which each side tries to drive the
    ball across the opposing line.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Another football form begins with men in two close parallel lines whose legs
    and bodies form walls; the ball is kicked and struck until it passes through a
    line, after which all rush toward the goals.
  category: sequence
  evidence_refs:
  - ev:8
