canonical_text:
  quote: ''
  summary: The passage describes waterproof frocks made from seal intestines, with
    drawstrings at sleeves and hood, worn over other garments and fastened over a
    kaiak manhole to keep water from the wearer and boat. It also notes their strength
    and limits in rough breakers, ornamentation of seams and borders, and a women's
    variant with side flaps.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Eskimo make waterproof frocks from seal intestines that are dried, slit
    open into ribbon-like strips, and sewn horizontally into a garment shaped like
    men's fur frocks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The waterproof frocks have braided sinew drawstrings at the sleeves and hood
    so the wrist and face openings can be tightened to keep water out.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The garments are worn over other garments in wet weather on shore and at sea,
    with their most important use occurring when hunters are at sea in kaiaks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In rainy or rough weather at sea, the hunter puts on the waterproof frock,
    extends its skirt over the kaiak manhole rim, and fastens it down with a cord
    in a groove outside the rim.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the skirt cord and drawstrings are tightened, the kaiak occupant is protected
    from spray and water is prevented from entering the boat.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The garments can withstand water pressure even when the wearer is submerged
    beneath the sea, but they may tear among breakers when struck heavily from above.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Seams and borders of the waterproof garments may be ornamented with seals'
    bristles, hair-like waterfowl feathers, crested auklet mandible sheaths, black
    tanned skin strips, or woolly seal-fur fringe.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Women's versions of these garments are cut up on each side to make flaps like
    those of an ordinary frock.
  category: attribute
  evidence_refs:
  - ev:8
