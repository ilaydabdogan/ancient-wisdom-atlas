canonical_text:
  quote: ''
  summary: Ethnographic description of large skin-covered open boats used around the
    Alaskan coast, Bering Strait, Siberian coast, Norton Sound, Kotzebue Sound, and
    Yukon-adjacent regions, including local names, construction, propulsion, sails,
    maintenance, storm risks, anti-swamping features, and painted or ornamented figures
    on some boats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People of the Alaskan coast, Bering Strait islands, and Siberian coast use
    large open boats, fifteen to forty feet long, made by covering a wooden framework
    with seal skin or walrus hide.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boats are identified as umiaks; local names include u'-mi'-a~k northward
    from Norton Sound and ail'-i-jnk among the Unalit and southward.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boats vary in size and pattern according to locality and purpose.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that paddles were the older mode of propulsion, while slender-blade
    oars were later adopted in some localities and remained in use.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: Oars are usually held by rawhide lashings fastened to the boat framework,
    and steering is done with a large broad-blade paddle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Earlier improvised sails were made by sewing grass mats together and setting
    them between two long sticks in a V-shaped arrangement attached to the umiak framework.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the arrival of white men, a single mast with stays and bone or ivory
    blocks was adopted in imitation of the rigging on strangers' ships.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Later sails could be made from reindeer skin, other animal skins, sealskin,
    canvas, or drilling, and could be raised or lowered with walrus-hide cord and
    ivory or bone fittings.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The boat framework is made of shaped driftwood pieces lashed with rawhide
    cords, and the covering is tanned seal skin or walrus hide sewed into shape and
    drawn over the frame.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Seal oil is applied to the outer cover to make it temporarily impervious to
    water; boats must be hauled ashore, dried, and re-oiled to keep the skins from
    rotting.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Travel is done by day, and at night the boats are hauled onto the beach and
    turned bottom-up or onto one edge so they may dry.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Bering Strait boats are described as having less sheer than Norton Sound umiaks
    and as using sealskin side flaps in rough weather.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Bering Strait boats also carry inflated sealskin floats lashed outside under
    the rail to prevent swamping.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: Storms may drive umiaks out to sea; spray and waves can soak the covering
    and rawhide lashings until the boat collapses and the occupants drown.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: From Kotzebue Sound northward, some umiaks had a roughly painted black figure
    of a man close to the bow.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: Yukon and adjacent-region umiaks are commonly ornamented on each side with
    a mythic alligator-like animal called pcil-rai'-yuk, with its open-mouthed head
    near the bow and its tail reaching the stern.
  category: object
  evidence_refs:
  - ev:9
