canonical_text:
  quote: ''
  summary: 'The passage describes several carved wooden masks: a composite mask with
    a large grotesque semihuman face, an animal face apparently representing a seal,
    and a small human head; a red-painted mask from Sabotuisky with reindeer teeth
    and skin border; and a large slab mask with a gigantic face, labrets, arm-and-hand
    projections, teeth, feathers, and wooden images of five seals and two reindeer
    on the brow. The meanings of some masks are explicitly stated to be unknown, and
    the author notes visual similarity to Tlingit composite masks and carvings.'
  language: English
  quote_policy: summarized
