  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A Norton Sound ivory hook obtained by L. M. Turner has a forked point at one
    end and a seal head carved on the other.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: A lower Yukon boat hook uses spruce-root lashings, wooden pins, and a deerhorn
