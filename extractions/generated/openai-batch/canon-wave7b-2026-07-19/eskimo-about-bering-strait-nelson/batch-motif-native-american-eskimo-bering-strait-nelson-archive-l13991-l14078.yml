canonical_text:
  quote: ''
  summary: The passage describes boat hooks used on umiaks and kaiaks along the coast
    and islands, giving examples from Norton Sound, Golofnin Bay, Sledge Island, Unalaklit,
    Askinuk, Big Lake, St Michael, the lower Yukon, and the lower Kuskokwim. It records
    their practical uses, sizes, materials, lashings, double or forked points, etched
    geometric patterns, animal-head carvings, and a raven totem sign.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boat hooks are used by men on umiaks and kaiaks along the coast and on islands,
    with umiak hooks generally larger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Boat hooks help men in kaiaks when landing on rocky shores or ice, and pointed
    butt spurs are used to fend off ice at sea in spring and autumn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Norton Sound umiak boat hook is described as six feet long, with a bone
    point lashed by rawhide and a deerhorn spur projecting at a right angle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Golofnin Bay kaiak boat hook is described as four feet nine inches long,
    with a rounded tapering shaft and a walrus-ivory spur-like hook lashed with whalebone
    strips.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Similar hooks are said to be common from the mouth of the Kuskokwim to Kotzebue
    Sound and to bear backs covered with diagonal etched lines crossed by long horizontal
    grooves.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Taku Harbor specimen in the National Museum is made of walrus ivory and
    marked with the same described pattern.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Several ivory hooks are described with animal forms, including a seal-head,
