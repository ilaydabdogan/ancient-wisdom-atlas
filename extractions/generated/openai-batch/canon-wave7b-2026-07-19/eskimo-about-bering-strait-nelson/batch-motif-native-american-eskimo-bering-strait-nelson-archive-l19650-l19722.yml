literal_observations:
- id: obs:1
  text: At Big Lake village on the tundra between the Yukon and Kuskokwim rivers,
    small wooden figures are described as raised in honor of people whose bodies were
    lost.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many graves at Big Lake had large headboards made of hewn planks about four
    feet long placed across two upright posts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two or three wooden maskoids were pinned to the middle of the headboards;
    they represented human faces with inlaid ivory eyes and mouths.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Strings of beads hung from holes or pegs at the ears of the maskoids, and
    bead necklaces were placed below the masks.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Big Lake graveyard is described as having many maskoids and images with
    ornamentation, though the observer did not examine it thoroughly.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The observer was told that lower Kuskokwim village graveyards below Kolmakof
    Redoubt contained many remarkable carved wooden images.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: One reported carved image was roofed with wooden slabs and consisted of a
    life-size figure with a round face, narrow eye slits, and four hands.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two hands of the reported life-size figure held tin plates for votive offerings,
