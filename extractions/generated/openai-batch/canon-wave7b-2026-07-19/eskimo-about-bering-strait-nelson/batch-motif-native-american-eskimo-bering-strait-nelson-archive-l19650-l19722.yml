  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: On the lower Kuskokwim, a male shade is believed to stay with the body until
    the fifth day after death, while a female shade remains for four days.
  category: other
  evidence_refs:
  - ev:6
