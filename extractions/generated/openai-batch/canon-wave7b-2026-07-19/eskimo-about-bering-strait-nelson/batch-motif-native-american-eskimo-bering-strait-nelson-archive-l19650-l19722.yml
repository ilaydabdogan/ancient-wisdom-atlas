  quote: ''
  summary: The passage describes memorial figures, grave headboards, wooden maskoids,
    bead ornaments, and carved graveyard images in the Big Lake and lower Kuskokwim
    region. It reports one life-size four-handed carved figure with plates for votive
    offerings, notes regional distribution of such grave images, and summarizes beliefs
    about shades remaining with bodies for four or five days, during which work abstentions
    are observed.
