- id: obs:3
  text: A notch is cut in the fire stick, the drill point is inserted, and the capped
    upper end of the drill is held in the mouth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rapid drill revolution produces heat that ignites friction dust; the fire
