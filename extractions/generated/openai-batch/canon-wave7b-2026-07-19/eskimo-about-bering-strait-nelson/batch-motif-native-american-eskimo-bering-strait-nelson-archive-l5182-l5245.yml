canonical_text:
  quote: ''
  summary: The passage describes fire-making among Eskimo communities around Bering
    Strait, especially through a cord-driven friction drill used with a fire stick,
    mouthpiece cap, tinder, and related implements. It also describes regional examples
    of fire sticks, drills, cords, caps, a tinder box, the use of flint and steel
    or pyrites, and the later high value placed on traded matches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fire was obtained by rapidly working a stick with a cord on soft wood to generate
    heat by friction; the passage says this method was in common use among Eskimo
    in the visited region.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: People of the lower Yukon and southward to the Kuskokwim are described as
    especially expert in applying the friction fire-making method.
  category: attribute
  evidence_refs:
