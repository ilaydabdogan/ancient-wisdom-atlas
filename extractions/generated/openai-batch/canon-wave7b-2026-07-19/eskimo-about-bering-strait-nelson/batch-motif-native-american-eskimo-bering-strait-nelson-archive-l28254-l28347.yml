canonical_text:
  quote: ''
  summary: The passage first concludes an episode in which Mink becomes human-like,
    joins Raven, helps prepare whale products and a kashim, invites sea people to
    a feast, and assists as Raven tricks seal-guests by sticking their eyes shut with
    spruce gum and killing them with a prepared stick; one small seal escapes, and
    the episode ends with an explanation of the friendship between ravens and minks.
    The passage then begins the tale of the Red Bear, introducing the hunter Pi-tikh'-cho-lik',
    his wife Ta-ku'-ka, their abundant setting near Pikmiktalik, Ta-ku'-ka's anxiety
    over his delayed return, and his statement that he will die on the third day,
    followed by his last wishes.
