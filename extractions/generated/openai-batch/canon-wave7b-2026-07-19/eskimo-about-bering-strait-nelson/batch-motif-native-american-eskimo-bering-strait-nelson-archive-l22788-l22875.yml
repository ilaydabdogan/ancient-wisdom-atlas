canonical_text:
  quote: ''
  summary: In a mortuary feast sequence, feast givers perform drummed pantomime dances
    of walking, packing, snowshoe travel, bear movement, hunting, ice-chiseling, and
    kayaking. A closing stamping, wiping, and thigh-slapping sequence is explained
    as casting off uncleanness so offerings will be acceptable to the shades. Namesakes
    of the dead receive water and food; fish is placed by lamps as food offerings
    to the shades and water is sprinkled as a libation. Large quantities of frozen
    fish are then broken up and distributed among the people, after comic prearranged
    byplay.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The drum tempo changes from slow to fast at the start of the described dance
    sequence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two women step forward near the drummers and imitate walking with alternating
    hand motions while holding wands upright; other women perform similar or different
    pantomimes, including tying and packing objects.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two men step forward; one imitates a man walking on snowshoes, and the other
    imitates a bear walking, stopping, rising, staring, and moving with a rolling
    gait.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bear imitation is described as intentionally comic and as producing laughter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Other male feast givers pantomime daily occupations, including long-distance
    snowshoe travel among hills, killing an otter in snow, making a hole in ice with
    an ice chisel, and paddling a kaiak.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the drummers stop, dancers stamp, move their hands downward over their
    bodies as if wiping, slap their thighs, sit, and return to their places.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator is told that the wiping, stamping, and thigh-slapping gestures
    cast off uncleanness that might offend the shades and make the offerings acceptable.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The namesakes of the dead gather in the center of the room and sit in a place
    made for them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Feast givers bring wooden buckets containing frozen fish, drop fish fragments
    by lamps burning for the shades as food offerings, and give water to namesakes,
    who sprinkle it on the floor as a libation to the shades.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After namesakes eat, large quantities of frozen fish in individual piles are
    broken up and distributed among the people, with guests from the greatest distance
    receiving the most.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: A prearranged exchange of insults and angry-sounding retorts is performed
    to put the guests in good humor and causes laughter.
  category: speech
  evidence_refs:
  - ev:7
