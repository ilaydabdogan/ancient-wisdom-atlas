canonical_text:
  quote: ''
  summary: 'The passage describes several reported curing, fertility, and protective
    practices: old reindeer-incisor belts used against pain, shamanic transfer of
    sickness into a squirrel skin, sucking and removal of a small object as a cause
    of pain, avoidance of angering a dog''s inua after a bite, use of a ritually treated
    doll-like image for barrenness, and a rawhide harness worn for protection from
    blood revenge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women wear belts made of reindeer incisors attached scale-like to a rawhide
    strap; an old family belt is believed to gain curative virtue, and the painful
    part is struck with the belt end to relieve pain.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A shaman borrowed a pine squirrel skin for conjuring to cure a sick man and
    claimed to drive the sickness from the afflicted person into the squirrel skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: For local pain, a shaman sucks the skin over the painful spot and then produces
    a small bone or other object from his mouth, showing it as the cause of the trouble.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dogs are not beaten for biting people because the dog's inua is said to become
    angry and prevent the wound from healing; a father also objects to killing a dog
    that injured his child for this reason.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: For long-continued barrenness, a married woman may consult a shaman, who makes
    or has the husband make a small doll-like image, performs secret rites over it,
    and directs the woman to sleep with it under her pillow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Kaviagmut man wore a loose harness-like arrangement of round rawhide cords
    and said it was to protect him from enemies, specifically from blood revenge by
    relatives of men he had killed.
  category: object
  evidence_refs:
  - ev:6
