canonical_text:
  quote: ''
  summary: Introductory travel and fieldwork account in which Edward William Nelson
    describes his residence at St Michael, several sledge journeys through northern
    Alaska, the collection of ethnological specimens and notes, encounters with winter
    festivals and a festival commemorating the dead, and his later assignment as naturalist
    aboard a revenue-steamer expedition searching for the Jeannette.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The writer states that the work is based on collections and observations made
    during a residence of between four and five years in northern Alaska, with St
    Michael serving as headquarters for much of that time.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The writer’s official duty was to maintain meteorological observations, so
    other scientific work was done during spare moments or when company agents relieved
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On December 1, 1878, the writer left St Michael with Charles Petersen, each
    using a sledge and a team of eight dogs, and traveled through coastal and Yukon-region
    routes before Petersen turned back because of bad weather.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After Petersen turned back, the writer continued with an Eskimo companion
    to the mouth of the Kuskokwim, returned toward the Yukon, went to Paimut village,
    and then retraced the route back to St Michael.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The reconnaissance produced ethnologic specimens, notes on the people, witnessed
    winter festivals, and vocabularies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: On November 9, 1880, the writer left St Michael with a fur trader and two
    Eskimo, traveled toward Norton bay and Sledge island, but further advance was
    prevented because people in the district were near starvation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: On another 1880 journey with a fur trader, the writer crossed to the Anvik
    region, traveled along the Yukon and nearby areas, and at Kazbinsky witnessed
    a great Eskimo festival commemorating the dead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The stated main purpose of the sledge journeys was to obtain ethnological
    specimens and notes on the character and customs of the people, but limited time
    prevented extended investigation into customs and beliefs.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: At the end of June 1881, the United States revenue steamer named in the passage
    called at St Michael while traveling north in search of the missing steamer Jeannette,
    and the writer was taken aboard as naturalist.
  category: sequence
  evidence_refs:
  - ev:9
