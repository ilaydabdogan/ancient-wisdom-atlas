  summary: The passage describes winter tomcod fishing on newly formed ice, including
    windward grass-mat shelters near fishing holes and daily catch amounts. It then
    catalogs tomcod fishing outfits and regional implement variants from Cape Nome,
    Norton Sound, the American shore of Bering Strait, and St Lawrence Island, with
    rods, lines, sinkers, leaders, hooks, and materials such as whalebone, rawhide,
    ivory, iron, sinew, whale jawbone, and lead.
