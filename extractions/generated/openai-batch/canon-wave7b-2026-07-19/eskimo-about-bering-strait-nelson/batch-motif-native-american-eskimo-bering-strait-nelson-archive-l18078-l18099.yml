canonical_text:
  quote: ''
  summary: 'The passage describes puberty customs among the Maleinut and Unalit: a
    girl reaching puberty is secluded as unclean for a defined period, observes restrictions
    on movement and appearance, later bathes and receives new garments, and may then
    become marriageable. It also records a belief that an atmosphere around her can
    harm a young man''s hunting success, and that a father may hold a food festival
    to announce his daughter''s readiness for marriage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Maleinut and southward from the lower Yukon and adjacent districts,
    a girl reaching puberty is considered unclean for forty days.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: During this period she lives by herself in a corner of the house, faces the
    wall, keeps her hood over her head, and lets her hair hang disheveled over her
    eyes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: She must not go out by day and may go out only once at night when everyone
    is asleep; in summer she commonly lives in a rough shelter outside the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the end of the period she bathes, is clothed in new garments, and may be
    taken in marriage.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The same custom formerly prevailed among the Unalit, but the current Unalit
    practice described here secludes the girl behind a grass mat in a corner of the
    room for four days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: During the Unalit four-day period, the girl is said to become a woman and
    is considered unclean.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A peculiar atmosphere is supposed to surround the girl at this time, and if
    it touches a young man it makes him visible to animals he hunts and removes his
    hunting success.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: If no suitor appears after a considerable time following puberty, the father
    accumulates much food and holds a festival to announce that his daughter is ready
    for marriage.
  category: action
  evidence_refs:
  - ev:5
