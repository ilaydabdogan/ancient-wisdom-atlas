- id: obs:3
  text: In King Around, two hand-joined rings face inward, circle swiftly, and move
    toward an agreed goal; the first ring to reach it wins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Tossing on Walrus Skin, a person stands on a large walrus hide with border
    hand-holes while men on one side and women on the other jerk the stretched hide
    upward to throw the person into the air.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Tug-of-War, two sides pull through their strongest representatives gripping
