canonical_text:
  quote: ''
  summary: 'The passage describes closing and variant rites of a Bladder festival:
    hunters leap through a wild-parsnip fire, women and children extinguish the embers,
    the community circles the village, men perform sweat-bath and kashim circling
    rites, and a St Michael variant includes fire passed over bladders and hunting
    shirts, directions spoken to shades, charcoal body markings, and bladders burst
    and put under ice. A later observation at Kushunuk notes a suspended bird-shaped
    image said to represent a sea gull.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bundle of wild parsnip stalks is set on fire and produces a high, waving
    flame.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Returning men run toward the fire and leap through it one after another while
    whooping; villagers join with cries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the men pass through the flame, women and children rush into the fire
    and stamp and scatter the embers until the fire is extinguished.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Everyone forms a line and marches once around the village; sometimes two files
    march around the place in opposite directions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the kashim, men take a sweat bath, then stand nude in a circle with hands
    on the nape of the person in front, while two nude boys are placed in the middle
    of the ring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The men circle the room four times from left to right, described parenthetically
    as with the sun, while boys climb on their backs and chase one another.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the four circuits, the men slap one another on the back, jump over the
    central floor hole, and perform strength trials with handles tied to lines let
    down from the roof.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The festival ends with a rule that no work is to be done in the village during
    the next four days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In a St Michael variant just before sunrise, lit dried parsnip stalks are
    waved about the bladders and over and inside the hunters' waterproof gut-skin
    shirts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The headman passes each hunter's dried grass bundle around that hunter's bladders
    while quietly repeating directions to the shades; the owning hunter cries out
    after this is done.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Lit straws are passed over the bladders, and hunters make black paint from
    wild-parsnip charcoal and oil to stripe faces and draw a double cross on each
    person's back and chest.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Each hunter takes the spear to which his bladders were fastened, marches about
    the floor hole, puts the bladders through the hole, carries them outside, bursts
    them at a hole in the ice with a seal-claw ice scratcher, ties seal sinew to them,
    and thrusts them under the ice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: At Kushunuk, a fantastic bird-shaped image said to represent a sea gull hangs
    from the roof over the middle of the floor, with gull quill feathers for wings,
    goose skin and feathers covering the body, and a rawhide cord attachment.
  category: object
  evidence_refs:
  - ev:7
