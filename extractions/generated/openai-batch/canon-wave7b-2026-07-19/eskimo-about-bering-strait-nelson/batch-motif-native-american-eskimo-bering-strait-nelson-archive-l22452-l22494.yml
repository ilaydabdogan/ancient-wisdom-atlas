canonical_text:
  quote: ''
  summary: The passage describes the great feast to the dead among Eskimo communities
    around St Michael and the lower Yukon. A nearest relative honors a deceased person’s
    shade with food, drink, clothing, and later accumulated valuables, often through
    the deceased person’s namesake. Relatives save goods for years, schedule a great
    festival, plant invitation stakes before graves, and sing invitation songs so
    the shades will attend. Completion of the feast discharges the mourner’s duty
    to the dead unless another close relative dies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The great feast to the dead is identified by local names among the Unalit
    at St Michael and Eskimo at Ikoginut on the lower Yukon; the lower Yukon term
    is explained as meaning “throwing away” because feast makers give away everything
    during the festival.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The nearest relative of a deceased person must honor the departed shade with
    presents of food, drink, and clothing through the dead person’s namesake, and
    with small food offerings at later annual observances until the great feast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief mourner is the nearest blood relative, such as a father, son, brother,
    or other near relation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After one or two years, the chief mourner begins saving valuable articles,
    including skins, clothing, and other prized goods, for four, six, or more years.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Other people in the village also save goods, and when several decide they
    have enough, they agree on a time for the great festival during a moon in the
    following year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the next minor feast to the dead, each participating relative plants an
    invitation stake before the grave of the person he wishes to honor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The invitation stake is a slender wooden rod four to six feet high, often
    with red paint rings and a small painted wooden image of the deceased person’s
    totemic animal on top.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The invitation stake is said to notify the shade of the approaching festival;
    a song of invitation is also sung, and the shades are believed to be present and
    able to hear it.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: After observing the great festival, a person is said to have completed his
    entire duty to the shades of his dead and may stop making further feasts for them
    without shame, unless another very near relation dies.
  category: sequence
  evidence_refs:
  - ev:7
