  summary: The passage describes snow goggles used among Eskimo communities around
    Bering Strait to protect the eyes from spring snow glare and prevent snow blindness.
    It catalogs regional variations in shape, slits, nose notches, septa, visors,
    coloring, cord fastenings, and occasional human-face or mask-like carving.
