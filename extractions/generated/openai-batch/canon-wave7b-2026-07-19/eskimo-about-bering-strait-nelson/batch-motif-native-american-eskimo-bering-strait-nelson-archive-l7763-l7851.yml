  text: Small sealskins with hair removed are soaked in urine, stretched on a drying
    frame, and exposed to winter cold and dry snow to make white parchment-like leather.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Large seal and walrus gullets are treated similarly for a finer white leather,
