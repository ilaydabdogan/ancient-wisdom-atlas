  summary: 'The passage gives an ethnographic account of skin dressing and tanning
    practices: animal skins and intestines are soaked, scraped, stretched, dried,
    dyed, softened, and sewn into boots, garments, waterproof frocks, bags, roof-hole
    covers, bedding covers, and ornaments.'
