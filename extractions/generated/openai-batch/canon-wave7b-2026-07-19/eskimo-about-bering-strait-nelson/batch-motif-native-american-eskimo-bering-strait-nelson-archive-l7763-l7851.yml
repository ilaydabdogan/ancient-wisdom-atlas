  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wolf-fish skin and new-born fur-seal skin are processed into narrow strips
    used in seams, borders, tassels, and other ornament.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Reindeer skin with hair on is wetted with urine, rolled, warmed in the kashim,
    scraped, fire-dried, scraped again, rubbed with warm boiled fish eggs, worked
    by hand, and finally scraped to complete tanning.
  category: sequence
  evidence_refs:
  - ev:3
