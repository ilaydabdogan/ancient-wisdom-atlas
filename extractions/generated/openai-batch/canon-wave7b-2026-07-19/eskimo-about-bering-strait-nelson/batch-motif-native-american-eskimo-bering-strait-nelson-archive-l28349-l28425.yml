canonical_text:
  quote: ''
  summary: A dying man, Pi-tikh'-cho-lik', instructs Ta-ku'-ka to place his body in
    his kayak with clothing and hunting gear and to set food before his body for three
    evenings for his inna. After his death the food disappears each morning, and on
    the fourth morning the kayak and contents are gone. Later Ta-ku'-ka sees smoke
    from a mountain, finds three houses by the sea, watches three women sing and dance
    for an arriving kayaker, and recognizes the man as the husband she believed dead.
    After he departs the next morning, she visits the women; they admire her face
    markings and garments, and one asks to be made similarly beautiful. Ta-ku'-ka
    tells her to prepare a fire and a pot of boiling oil.
  language: English
  quote_policy: summarized
