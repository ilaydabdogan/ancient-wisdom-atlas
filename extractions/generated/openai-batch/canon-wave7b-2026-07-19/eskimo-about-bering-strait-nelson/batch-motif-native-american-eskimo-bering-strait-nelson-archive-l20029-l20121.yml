  text: The gut-skin smoke-hole cover of the kashim at Kigiktauik bore two raven signs
    close together with a red spot in front of them.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: An informant said the kashim-cover donor placed his totem sign on the cover
    and that the red spot represented a bloody mark in the snow where the raven had
    eaten meat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The informant also said that a ring was sometimes drawn before raven tracks
    on the cover to represent a seal hole in the ice.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: If a kashim-cover donor belonged to another gens or had ancestors noted for
