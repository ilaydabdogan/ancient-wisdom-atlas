canonical_text:
  quote: ''
  summary: The passage describes animal totem and related marks used on bodies, tools,
    weapons, clothing, kashim smoke-hole covers, and hunters' carried objects. It
    explains raven marks, red blood-like spots, seal-hole rings, animal and wake marks
    tied to gens or ancestral hunting success, and portable raven or gerfalcon tokens.
    It ends with the beginning of a famine-hunting account in which a hunter eats
    dog ham, carries the bone, and kills a seal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A raven mark is described on bone or ivory and as a forehead tattoo on a boy
    at Plover Bay.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Totem marks are frequently seen on carvings, weapons, implements, clothing,
