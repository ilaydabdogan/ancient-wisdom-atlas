canonical_text:
  quote: ''
  summary: 'The passage describes several Eskimo trapping devices and methods around
    Bering Strait: a bait-triggered spring spike trap for foxes, wolves, and formerly
    bears; St Lawrence Island examples of trap parts; underwater square nets for beavers
    and otters; spring nets and snares for hares and rabbits; and a bent-stick noose
    snare for Parry''s marmots, whose skins are valued for clothing and trade.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A model made by an Eskimo living at the head of Norton Sound is said to show
    the parts and operation of a trap contrivance.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spring trap includes a cylinder, crosspieces, sinew cords, an ivory or
    bone block and pin, a lever, a spike, and a bait cord.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The crosspieces and connecting cords are twisted to create strong tension,
    producing spring-like resistance in the lever.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the bait is pulled, the pin is freed and the lever springs over, driving
    the spike into the skull of the animal.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The traps are ordinarily made for killing foxes and wolves, and an informant
    said they were formerly sometimes used for bears.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A St Lawrence Island trap cylinder is described as made from whale jawbone,
