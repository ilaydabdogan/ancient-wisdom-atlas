  category: object
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Square nets are fastened below the water surface over beaver-house entrances
    so that beavers become entangled and drown; the same method is sometimes used
    for otters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hares and rabbits are snared or netted in spring among bushes, or are driven
    into fine sinew nets set in open spaces.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Parry's marmot skins are valued for light summer frocks and trade, especially
