canonical_text:
  quote: ''
  summary: The passage describes ivory, bone, or deerhorn spear and paddle guards
    used on umiaks and kaiaks around Bering Strait. Umiak lance guards support spears
    and lines during whale fishing and are often carved as white bear heads and shoulders;
    one example bears an etched “thunderbird.” Kaiak guards keep spears and paddles
    from sliding off the deck and appear in several forms, including a white whale
    tail terminal and etched shell-like ivory pieces.
