canonical_text:
  quote: ''
  summary: 'A shaman sees a woman bring a steaming dish that contains a newborn boy,
    is expelled from the sky-house scene, awakens on a mountain near his village,
    and with another shaman and his wife learns ceremonies for an annual February
    festival honoring sky inuas who replenish game through animal images. A separate
    lower Yukon narrative begins with a childless couple: the wife sends her husband
    to a solitary shining tree reached by a moonlike path of light; he cuts wood,
    carves a small boy doll, dresses it, places food and water before it, and the
    doll becomes animated, eats and drinks, then disappears along tracks leading back
    to the light path.'
  language: English
  quote_policy: summarized
