canonical_text:
  quote: ''
  summary: 'The passage describes beliefs about shades of dead people and animals
    among Eskimo groups around Bering Strait: measures to prevent dangerous return
    of a shade to a corpse, two afterlife destinations, dependence of shades on offerings
    from living relatives, a fox-shade dismissal ceremony, regional attitudes toward
    graves, and a Lower Yukon account of the shade''s journey from the grave to the
    land of shades.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In ancient practice, sinews in the arms and legs of a dead person of evil
    repute were cut to prevent the shade from returning to the body and making it
    walk at night as a ghoul.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shades of animals are said to possess nearly every attribute of human shades,
    and the inua or shade of every animal is believed to have a semihuman form.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage describes two destinations for human shades: a land of plenty
    in the sky and an underground land of the dead.'
  category: setting
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: Shades of shamans and of persons who died by accident, violence, or starvation
    are said to go to a sky land with abundant light, food, and water.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Shades of people who die from natural causes and the shades of all dead animals
    are said to go to the underground land of the dead, where animal kinds live in
    separate villages.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Human shades in the underground world depend on food, water, and clothing
    offerings made by relatives during festivals for the dead, and shades in the sky
    land can also be made happier by gifts.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Thieves, sorcerers or bad shamans, witches, and people practicing certain
    forbidden customs are described as uncomfortable after death, and evil human or
    animal shades may haunt the vicinity of their burial place.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Kigiktauik, a hunter skinned a trapped red fox, cut the tendons of its
    fore and hind legs, cut a hole at the navel, held the carcass over the kashim
    smoke hole, and the men inside shouted during the act.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The fox ceremony was explained as dismissing the fox's shade either to the
    land of the dead or back to the tundra, where it would be harmless.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Cutting the fox carcass tendons was said to prevent the shade from reentering
    the body and walking about in that form.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Dogs were not to touch or defile the fox body because this could anger the
    shade and cause misfortune for the hunter.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Razbinsky on the Yukon, graves are described as placed so close to houses
    that they form part of the village, while another report describes a Malemut avoiding
    travel past a recent grave at dusk.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: Among the lower Yukon people, a newly dead person is said to be unable to
    see or hear at first; when the body is placed in the grave box, the shade becomes
    clairvoyant and other dead people point out the road to the land of shades.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: When conscious, the shade rises in the same form and clothing as in life and
    travels a path from the grave with branches leading to villages of different animal
    shades.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The shade eventually arrives at a village, is claimed by previously deceased
    relatives, is taken to a house, and depends on offerings from living relatives.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: During the journey, the shade brings tools placed by the grave and subsists
    on grave offerings of food and water.
  category: object
  evidence_refs:
  - ev:11
- id: obs:17
  text: The passage refers to a tale about a girl returning from the land of the dead
    as connected with lower Yukon beliefs on the subject.
  category: other
  evidence_refs:
  - ev:9
