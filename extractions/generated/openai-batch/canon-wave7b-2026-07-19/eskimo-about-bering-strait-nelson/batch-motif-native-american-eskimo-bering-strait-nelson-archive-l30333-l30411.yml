canonical_text:
  quote: ''
  summary: A shaman hides the brothers' umiak and keeps their sister bound and starving.
    The shaman prepares a whalebone death trap in the kashim and kills two brothers
    in a wrestling challenge. Ak'-chik-chu'-guk sheds his coverings, appears as a
    powerful young man, kills the shaman with the same whalebone device, restores
    the two brothers to life by magic, and frees the sister. The villagers rejoice
    because they had feared the shaman, who had killed strangers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While the brothers are in the kashim, the shaman goes to the beach, unties
    the umiak lashings, rolls its framework into its cover, and hides it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At night the youngest brother goes to the shaman's house, hears a hoarse choking
    sound, opens a door, and finds his sister on the floor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sister is dressed in coarse heavy sealskins, bound hand and foot, with
    cords about her neck and tongue.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sister says the wicked shaman has kept her that way and treated her cruelly;
    her brother finds her very emaciated.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At dawn the shaman announces that it is time to kill the strangers and has
    a pit opened in the kashim floor with a sharp-edged whalebone fixed upright at
    its edge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ak'-chik-chu'-guk tells the brothers to wrestle without fear because he had
    previously killed and restored them to life, so men could not harm them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The shaman kills two brothers in succession by swinging them across the sharp
    whalebone so that their necks are cut off.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ak'-chik-chu'-guk wipes fish roe from his face and hands, tears off a bird-skin
    coat, and appears as a powerful young man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ak'-chik-chu'-guk crushes the shaman, swings him across the whalebone, and
    cuts his body apart.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The villagers express joy at the shaman's death because they had feared him
    and because he had killed every stranger who came to the village.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ak'-chik-chu'-guk sends everyone out of the kashim and, by magic, restores
    the two killed brothers to life.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The brothers release their sister and clothe her in fine new garments.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The sister recounts drifting on the ice with her brother, landing near Ufi-a'-shuk,
    and the shaman killing that brother and keeping her prisoner.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Afterward the villagers treat the brothers kindly, and the brothers make bows,
    quivers of arrows, and a stone-headed spear.
  category: sequence
  evidence_refs:
