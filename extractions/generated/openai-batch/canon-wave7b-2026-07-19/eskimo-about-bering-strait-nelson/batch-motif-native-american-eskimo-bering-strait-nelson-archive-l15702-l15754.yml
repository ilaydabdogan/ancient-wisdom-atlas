  summary: 'The passage describes several Bering Strait settlements and house forms:
    low earth-covered houses at Igiogagamut, mound-like drift-log summer houses near
    Cape Romanof, Askinuk village on a long-occupied mound with irregular passageways
    and a nearby graveyard, and kashim architecture at Askinuk and Kushunuk, including
    vertical log walls, plank floor, and men''s sleeping places or benches.'
