  quote: ''
  summary: The passage describes ice staffs used for travel. A staff distributes a
    person's weight over three points, helping them pass over weak surfaces. The staffs
    are also used in summer tundra travel over tussocks, sphagnum, moss, and semi-marshy
    ground. One staff from Cape Nome is illustrated, and a Point Barrow example is
    described as a nearly five-foot wooden staff with an ivory cap and sealskin wrist
    loop.
