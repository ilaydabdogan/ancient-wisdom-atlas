  summary: The passage describes burial boxes and graveyards at several Bering Strait
    villages. It notes a boy's body in a box with paddling implements nearby and a
    work prohibition on his father, describes elevated grave boxes with posts, ornaments,
    red paint, bone pegs, hunting figures, utensils placed with the dead, invitation
    effigies for a feast to the dead, raised display boards with animal-skin figures,
    and similar boxes at a nearby village.
