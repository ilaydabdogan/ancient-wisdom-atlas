canonical_text:
  quote: ''
  summary: Ethnographic description of labret types from Sledge Island, King Island,
    Nunivak Island, Hotham Inlet, Kotzebue Sound, Point Hope, and nearby areas; materials
    and forms include stone, lignite, walrus ivory, serpentine, jadite, nephrite,
    quartz, lead tips, bead strings, and blue beads. The passage also describes male
    post-puberty lip piercing, gradual enlargement with ivory plugs, later retention
    or display of the plugs, and incised decorative marks including a raven totem
    mark.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Similar hard-stone labrets from Sledge Island are described, and a pair of
