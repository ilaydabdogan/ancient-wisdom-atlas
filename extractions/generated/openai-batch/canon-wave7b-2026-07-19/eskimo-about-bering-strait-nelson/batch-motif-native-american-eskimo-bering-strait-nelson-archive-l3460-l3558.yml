    Island and adjacent mainland examples.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Among males, labrets are worn only after puberty, and boys' lips are not pierced
    until that period.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The lip opening is made below each corner of the mouth; a thin ivory plug
    is inserted first, followed by larger plugs until the opening reaches the desired
    size.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A man may use six to eight or ten small plugs during enlargement; afterward
    he may pierce their small ends and keep them strung on sinew, among his effects,
    or as pendants on his wife's belt or needle-case strap.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: When used as ornaments, the plugs are sometimes etched with patterns, including
    a double band of incised zigzag lines and a raven totem mark toward the larger
    end.
  category: object
  evidence_refs:
  - ev:9
