  summary: 'The passage describes Unalit graveyard placement near the village, then
    records observances after the death of a shaman at St Michael: work ceased for
    three days, the body was placed in a grave box, and men poured liquid from urine
    tubs before their doors while addressing the returning shade so that it would
    taste the bad water and leave.'
