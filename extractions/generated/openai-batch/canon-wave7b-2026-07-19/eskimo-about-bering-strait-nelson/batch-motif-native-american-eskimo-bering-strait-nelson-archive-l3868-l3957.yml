canonical_text:
  quote: ''
  summary: The passage catalogues earrings and related ornaments from several Bering
    Strait and lower Yukon/Kuskokwim localities, describing their shapes, materials,
    inlaid beads or lead, incised and concentric-circle decoration, bead-string attachments,
    and carved human, animal, seal, owl, and tunghiit/tunghdk features.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Chalitmut specimen is small and rounded, has rounded knobs at each corner,
    and has a black central spot with concentric rings and scattered dots.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Another Chalitmut set is rudely oval and has five small circles and dots arranged
    in the form of a cross on a slightly convex face.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A St Michael single earring consists of two joined circles with concentric
    rings, lead pieces set in the centers, and a lower hole for attaching a string
    of beads.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Nulukhtulogumut pair has a rounded pattern with projecting corners, a central
    half blue bead, surrounding concentric circles, and spur-like etched lines leading
    toward the corner projections.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Kaialigaimit example is rounded with a convex face set with half of a large
    amber-colored glass bead.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ornaments from between the lower Yukon and the Kuskokwim include carved features
    of men, animals, and tunghiit; they are usually oval, sometimes oblong, and one
    Chalitmut pair is square with raised central features.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Kushutuk pair is shaped to represent a small seal.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Cape Vancouver specimens include ornamentation representing a tunghdk, the
    face of a short-ear owl, a grotesque human face with woman’s braided-hair tufts,
    and seal features.
  category: object
  evidence_refs:
  - ev:8
  - ev:11
- id: obs:9
  text: Northward from St Michael to Bering Strait, the earrings are described as
    more oblong, less ornamented, and more crude in workmanship.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: A Sledge Island oblong convex-faced pair has half of a large blue bead set
    in each front, and many earrings from that island have deeply incised face-crossing
    lines while some are plain.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The only metal earrings obtained are lower Yukon copper earrings in a round
    women’s style, with concentric circles on the face and projecting knobs at the
    corners.
  category: object
  evidence_refs:
  - ev:12
- id: obs:12
  text: A St Michael pair has disk-like faces with rounded ivory pins projecting behind
    and pierced truncated tips for receiving the ends of a string of beads.
  category: object
  evidence_refs:
  - ev:13
- id: obs:13
  text: A Cape Vancouver long narrow oval pair tapers to a pierced point and bears
    a median ridge and an incised-and-dotted grotesque human face with labret holes
    below the mouth corners.
  category: object
  evidence_refs:
  - ev:14
- id: obs:14
  text: A Nulukhtulogumut broadly oval pair has a grotesque human face on the front.
  category: object
  evidence_refs:
  - ev:15
