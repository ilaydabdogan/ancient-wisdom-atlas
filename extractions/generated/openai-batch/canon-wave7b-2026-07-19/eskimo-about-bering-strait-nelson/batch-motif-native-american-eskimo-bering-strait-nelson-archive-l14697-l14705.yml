  quote: ''
  summary: The passage describes a common length measure used for items such as rawhide
    lines, nets, and cloth. Fur traders adopted the measure and called it a fathom.
    Cloth and similar trading goods are measured by holding one end at the left thumb,
    drawing the edge through the right hand across the chest under the chin, shifting
    the left hand to the right-thumb point, and repeating until the desired length
    is reached.
