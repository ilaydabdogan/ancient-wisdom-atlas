canonical_text:
  quote: ''
  summary: A central unnamed man, called in the gloss the one who finds nothing, is
    repeatedly thirsty and hungry. He is given water by someone beside him but later
    fails to find water, fails at fishing, berry-picking, goose-hunting, and seal-hunting,
    while other men bring seals. As winter comes, he bundles his poor bedding and
    tool bag, goes beyond the houses, arranges the bedding under himself, lies back,
    and says he will die there. After remaining all night without stirring, he hears
    a raven croaking at sunrise and then hears the raven's mate.
  language: English interlinear gloss with Yupik/Inuit transliteration
  quote_policy: summarized
