  quote: ''
  summary: The passage describes hunting bags, conical wooden helmets, wooden visors,
    and related ornaments used by Eskimo communities around Bering Strait. It notes
    materials, animal-skin bags, sun-glare protection during sea hunting, phallic
    paintings with unascertained religious significance, ivory animal carvings, animal-head
    visor forms, feathers, beads, teeth, and regional variations among places including
    St Michael, Kushunuk, Kaialigamut, Razbinsky, Norton Sound, and the lower Yukon.
  language: English
