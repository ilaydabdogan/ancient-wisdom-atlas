canonical_text:
  quote: ''
  summary: In an ancient large village near Paimut, two related shaman friends live.
    One marries and becomes grandfather to a newborn boy whom he kills, dries, and
    wears secretly as an amulet so that the child's imta can aid his ceremonies. The
    unmarried shaman sees the child's shade without knowing its source, then in sleep
    experiences a vision of layered sinking skies, enters a kashim in an upper-sky
    village, is warned not to eat offered food, and observes wooden animal images,
    Raven-father wing emblems, and moving hoops and rods representing the heavens,
    stars, and snowflakes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrative setting is an ancient large village below Paimut, at the foot
    of mountains, with houses extending from a river bank up a hillside.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two related young men in the village are described as noted shamans and close
    friends; one later marries.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the married shaman's daughter gives birth to a son, the grandfather
    kills the newborn, carries the body into a spruce forest, and hangs it on a tree
    until it is dried or mummified.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The old man places the dried body in a small bag, hangs it around his neck
    under his clothing, and uses it as an amulet for the services of the child's imta
    in ceremonies.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The unmarried shaman repeatedly sees the shade of a small newborn child among
    the shades that come to do his bidding, but he does not know his friend has the
    body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: While sleeping on the hillside, the unmarried shaman sees falling stars, a
    sky sinking toward him, stars as round holes, and successive sky layers through
    which he raises himself.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: After rising through the third sky, the shaman sees a kashim surrounded by
    a village like his own, with signs of a recent sweat bath and women covering the
    roof air hole and carrying food.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The shaman enters the upper kashim through an underground passageway; a man
    sitting over the main entrance calls him to sit beside him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The man beside the shaman warns him not to eat any food offered to him because
    it is not fit to eat.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The shaman sees a small wooden image beside each man in the room, representing
    different kinds of mammals, birds, and fishes.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: Pairs of long, ornamented sticks over the lamps and entrance are said to represent
    the outspread wings of the Raven father who made the world.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Two hoops with rods, feathers, and down hang from the roof and are raised
    and lowered by a cord in time with a drum; the passage says they represent the
    heavens, stars, snowflakes, and the apparent approach and retreat of the heavens.
  category: object
  evidence_refs:
  - ev:12
