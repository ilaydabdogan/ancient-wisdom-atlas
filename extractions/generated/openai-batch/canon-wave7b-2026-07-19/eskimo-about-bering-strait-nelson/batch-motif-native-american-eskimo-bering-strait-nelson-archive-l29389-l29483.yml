canonical_text:
  quote: ''
  summary: An orphan boy living with his aunt travels by kaiak to a Yukon village,
    where villagers abuse him until one man helps him return home. His aunt and he
    make a small animal image from wood, and after the aunt weeps over it and commands
    it, the image becomes a red bear that kills the abusive villagers and many others.
    The aunt later restrains the bear from harming people who had been kind to her
    and sends it away, with the tale explaining the existence of red bears. The passage
    then begins a separate thunderbird tale, describing a last pair of giant eagles
    or thunderbirds nesting on a mountain above the Yukon and carrying reindeer, fishermen,
    and canoes to feed their young.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An orphan boy lived alone with his aunt on the tundra south of the Yukon mouth
    and traveled by kaiak to find people living on the Yukon.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: At a large Yukon village, people seized the boy, broke his kaiak, removed
    his clothing, beat him, and kept mistreating him until the end of summer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: One man in the village took pity on the boy, made him a kaiak, and sent him
    homeward.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the boy returned, he appeared nearly skeletal from starvation and beating,
    and his aunt responded with pity and anger after hearing his story.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The aunt told the boy to bring wood, and together they made a small animal
    image with long teeth, sharp claws, red sides, and a white throat.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The aunt placed the image in creek water and told it to destroy everyone it
