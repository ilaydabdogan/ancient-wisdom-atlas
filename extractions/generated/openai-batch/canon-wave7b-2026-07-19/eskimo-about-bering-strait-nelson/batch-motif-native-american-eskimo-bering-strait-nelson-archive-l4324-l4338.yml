  quote: ''
  summary: The passage describes belts worn by men and boys, especially wolverine-
    or wolf-skin belts retaining claws, hair, head, nose, and tail. These belts are
    prized and are believed to convey strength and prowess like that of the animal.
    It also notes belts representing an owner’s totem animal and belts with mummified
    little weasel bodies attached in front, likewise associated with the conveyance
    of animal prowess.
