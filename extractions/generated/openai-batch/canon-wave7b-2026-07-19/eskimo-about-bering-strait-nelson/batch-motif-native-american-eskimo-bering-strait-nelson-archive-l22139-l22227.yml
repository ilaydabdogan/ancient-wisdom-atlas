canonical_text:
  quote: ''
  summary: The passage describes a festival sequence involving house-to-house food
    collection by soot-blackened visitors, a feast in the kashim, the making and use
    of a wand called ai-ya'-g'iik, messenger-mediated requests and exchanges of goods,
    temporary exchange relationships, mediated sexual requests involving an unmarried
    woman and a deerskin, respect and obligation attached to the wand, and regional
    variations including same-sex exchanges, secret requests, and miniature images
    hung on the wand.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At each house, women place food in dishes carried by the visiting group; the
    group returns to the kashim shouting and stamping, keeping faces turned toward
    the floor so they will not be recognized, while children follow and make an outcry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the visitors return to the kashim, soot is washed from their faces and
    bodies with urine; some food is given to old men, and the group sits down to a
    feast.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the next day, a chosen man makes a wand called ai-ya'-g'iik, described
    as having a slender rod-like handle and three hanging globes at the outer end.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the evening, men gather in the kashim and women remain in their houses;
    the man who prepared the wand stands in the middle of the room holding it.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Any man in the community may tell the wand-holder the name of an article he
    wants, sometimes also naming the woman from whom he wants to obtain it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The wand-bearer goes to the named woman, swings the wand's hanging globes,
    states what he has come for, receives her statement of what she wants in return,
    and reports that request back in the kashim.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After everyone has asked for something, the men go to their houses, bring
    the articles requested of them, return to the kashim, and a dance is performed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Women then bring the things asked of them, and the exchange is made through
    the messenger.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The messenger must have a blackened face and wear poor dress, such as a fishskin
    coat, with a dogskin belt whose tail is fastened behind.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: If a requested person does not possess the desired article, custom binds that
    person to obtain it after the festival and present it to the requester.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Two people who exchange presents through this procedure are considered to
    hold a temporary relationship called i-lo'-y'uk; the passage also states that
    those once made i-lo'-g'uk formerly exchanged presents each succeeding year at
    the festival.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: During the festival, a man could ask the messenger to tell an unmarried woman
    that he wished to share her bed that night; the woman could answer that he must
    bring a deerskin for the bedding, which he gives her in the kashim before remaining
    with her after the festival.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After conveying messages, the wand is hung conspicuously in the kashim until
    the festival ends; the community respects it, and refusal of requests made with
    it is considered shameful.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: 'The passage reports regional variations: in some districts presents are requested
    between people of the same sex; in another variation requests are secret until
    all meet in the kashim; on the lower Yukon and nearby southern districts, small
    images of desired objects are hung on the messenger''s wand.'
  category: other
  evidence_refs:
  - ev:10
  - ev:11
