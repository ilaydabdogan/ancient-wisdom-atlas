  quote: ''
  summary: 'The passage describes several ceremonial objects: a woman''s finger mask
    with a black face, red border, eye and mouth openings, and quills with downy plumes;
    a pear-shaped finger mask from Cape Romanzof used by women in ceremonial dances,
    decorated with reindeer skin, old-squaw duck feathers, down, and red and black
    dots; a lower Yukon maskoid representing a seal-head with rising air bubbles;
    and an eagle-feather wand used in dances.'
