canonical_text:
  quote: ''
  summary: The passage reports a Raven tale in which Raven and First Man journey in
    the sky land and a large beast haunts a grassy dry lake bed. The beast rests on
    grass tips without bending them, but after being killed by the Sky people becomes
    so heavy that logs must be placed beneath it. It is described with six legs, horns,
    thick fur, small eyes, and dark color, and the narrator identifies it as referring
    to the muskox. A following note names Tiri-mt-iik'-puk as the great eagle or Thunderbird,
    an enormous eagle whose habits vary by locality.
