  summary: A weaponless hunter on the ice avoids an approaching white bear by lying
    still and holding his breath while it sniffs him. The bear then goes toward the
    other hunter, who is killed. The next day armed villagers and the dead hunter's
    wife find the bear at the remains; the wife fires first, the group kills the bear,
    and the wife slashes its sides with a hunting knife until exhausted.
