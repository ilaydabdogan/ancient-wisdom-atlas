canonical_text:
  quote: ''
  summary: The passage describes a land-tenure system in which land is nominally held
    by the Chief, assigned without purchase through headmen to settlers, made productive
    by clearing and cultivation, inherited but not sold, and embedded in reciprocal
    labor, protection, and court-favor relations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The soil is said to belong by law to the Chief so that it may become general
    property; land cannot be bought, and submission to the chief entitles a person
    to enough land for subsistence.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Village headmen, called numzane, receive considerable tracts and apportion
    land among people under their jurisdiction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When a would-be settler wishes to settle on a reserve, the headmen accompany
    him to uncultivated land, cut the bush for him, and fix plot boundaries.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A tree, the corner of a lake, a well, or an anthill may serve as landmarks
    in the boundary-setting operation.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the new-comer clears and tills the plot, the fields and trees on it
    become his property; he may assign portions to relatives who settle near him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the settler leaves or cannot live near the original allocator, he cannot
    sell the land; it reverts to the original owner.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: If the settler dies, his wife inherits his gardens; if parents die, property
    passes to sons, who divide fields between their wives.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that real estate is hereditary but cannot be sold, and
    that a numzane who leaves the country loses rights in his occupied tract.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: Once a plot has been assigned, the allocator has no further interest in it,
    and the recipient is described as master of the land and its produce.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The narrator reports that Muzila, a petty chief, asked permission to pick
    nkanye fruit on station land that had been granted by Maphunga.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The numzane benefits from keeping protégés on his land because they cultivate
    bush, increase the population and strength of his tract, and make payments in
    labor or services.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says a chief or numzane may give better land to favorites, including
    flatterers or beer-providers, while less favored people may receive barren or
    exhausted land.
  category: relationship
  evidence_refs:
  - ev:9
