canonical_text:
  quote: ''
  summary: Zili deceives his wife into traveling by an unused path, kills and dismembers
    her under a tree, hides some remains in the tree, and carries flesh to her parents.
    A bird repeatedly sings an accusation, survives repeated destruction, follows
    him to the in-laws' hut, and guides the villagers back to the hidden remains.
    The woman's kin recognize her face and bracelets, bind Zili, and burn him with
    his relations in a hut. The supplied range then begins an editorial transition
    to a separate category of tales founded on real facts.
  language: English
  quote_policy: summarized
