  evidence_refs:
  - ev:4
- id: obs:8
  text: At the parents-in-law's village, Zili brings the flesh bundle, stays quiet
    when the bird repeats its song, and tells the parents their daughter is well and
    will come soon.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bird enters or comes near the hut, keeps singing, and the people begin
    to understand; the mother faints while roasting the flesh Zili brought.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The village men question Zili about the bird; he denies that it came with
    him, and the group sets off with the bird flying before them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bird guides them to the big tree, where a grass bundle contains the girl's
