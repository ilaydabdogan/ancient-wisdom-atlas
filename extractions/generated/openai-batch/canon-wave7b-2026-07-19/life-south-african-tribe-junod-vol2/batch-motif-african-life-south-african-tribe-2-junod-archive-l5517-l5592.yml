canonical_text:
  quote: ''
  summary: 'The passage gives examples of Native Christian comparisons: conscience
    is likened to a tree-climbing thief who serves as lookout; the words of God are
    likened to intestinal worms that remain quiet and then awaken painfully; and preachers
    are likened to messengers of mourning who must not be distracted by beer, song,
    and dance. It then describes ku pamba, a roundabout mode of expression hiding
    meanings under harmless language, and introduces Thonga folklore as comprising
    proverbs and riddles, tales, and songs, with oral tradition and ongoing song composition.'
  language: English
  quote_policy: summarized
