canonical_text:
  quote: ''
  summary: A tale recounts how an elder child disobeys his mother by eating sala fruit
    and following snake tracks, kills and eats a boa, becomes swollen and unable to
    walk, and is cured only after an unweaned youngest child fearlessly summons the
    Big Snake physician called Chicken's Wing. The snake doctor treats the patient,
    causing the revived boa and sala to emerge and return to the forest. The doctor
    accepts an old iron ring as reward and is carried home by the youngest child.
    The passage then introduces a section on ogre tales, including the opening of
    the tale of Scaly-Heart.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man has three children; the two older children go walking in the forest
    after their mother warns them not to eat sala fruit or follow snake tracks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The elder child plucks and opens a sala fruit despite the warning and beats
    the second child when he objects.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The elder child chooses to follow snake tracks despite the warning and again
    beats the second child into silence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The tracks lead to a boa; the elder child kills it, lights a fire by rubbing
    wood, cooks the boa, and eats the whole snake while the second child refuses to
    eat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After eating the boa, the elder child cannot walk and is brought home very
    ill with the help of the second child.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The parents send messengers to call the Big Snake physician called Chicken's
    Wing, but the messengers flee when the snake emerges from its hole; the mother
    also becomes frightened and runs away.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The unweaned youngest child goes alone to the snake's hole, sings to the Big
