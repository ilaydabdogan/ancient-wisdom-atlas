canonical_text:
  quote: ''
  summary: The passage classifies several Thonga ritual specialists and describes
    named magicians, their equipment, and claimed powers. It especially recounts Makasana’s
    account of countering a cloud-borne lightning bird with medicine of Heaven, and
    Nwashihandjime’s use of a decorated gnu tail in a smelling-out rite.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies shinusa as people whose principal qualification is
    detecting baloyi, and also names bone-throwers as ba-bula.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Priests called ba ku hahla are distinguished from the listed magical categories
    because their activity is described as religious rather than magical.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator says very few magicians limited themselves to medical art alone,
    and that a magician aims to combine as many branches as possible.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mankhelu is described with a forked branch, calabashes containing powerful
    drugs and sea charms, and roles including rain-maker, detector of baloyi, and
    bone-thrower.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Makasana is said to have acquired power after exorcism and to have obtained
    the drugs of his exorcist.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Makasana wore necklaces with small lizard-skin bags containing drugs against
    snake bites, charms against baloyi, and charms of Heaven, along with birds’ claws,
    a crocodile tooth, elongated hair, and a cartridge fixed on a chain as a snuff
    box.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Makasana says that at noon a small black cloud appears over his head with
    a lightning bird inside, sent by enemies and intending to kill him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Makasana says he blows medicine of Heaven toward the cloud, causing the lightning
    bird to fall near him powerless.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Makasana says he cuts the fallen lightning bird, takes parts of its heart,
    eyes, and bones, makes powder from them, makes a flute from one bone, and plays
    it during thunderstorms to conjure lightning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Nwashihandjime is described as a detector of baloyi who used a large decorated
    tail to point out a woman after a smelling-out rite.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says the mungoma’s tail is generally a gnu tail, and explains
    its use by saying a mother gnu beats her newborn with her tail to give it strength
    to walk.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says drugs hidden in the middle of the tail have revelatory virtue,
    and that the magician puts his nose among the hair before pronouncing sentence
    and beating the noyi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Nwashihandjime is said to have disappeared from his village for months and
