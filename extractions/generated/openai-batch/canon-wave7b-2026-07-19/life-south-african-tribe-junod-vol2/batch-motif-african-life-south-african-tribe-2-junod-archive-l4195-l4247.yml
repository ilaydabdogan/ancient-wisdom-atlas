canonical_text:
  quote: ''
  summary: The passage describes the introduction and local working of iron, copper,
    brass, and wire among Thonga-related communities, including trade with Godji visitors,
    Ba-Ronga exchange, Native smithing, Bvesha/Venda mining and smelting, the uncertain
    origin of iron-working, and examples of wire ornaments and utensils.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iron and other metals are said to have been first introduced in Delagoa Bay
    by Godji traders and whale fishers, identified as the first White visitors remembered
    by Natives.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ba-Ronga exchanged fowls and other domestic animals for hoes, brass bracelets,
    and copper, and forged bought copper pieces into wire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wrecked boats later supplied Native smiths with iron for making hoes, axes,
    and similar tools.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some villages had regular forges, and the chief iron supply came from the
    Transvaal Mountains, especially the Northern Zoutpansberg, where the Bvesha mined
    iron ore.
  category: setting
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Suto hoes were extensively used as currency for lobolo purposes in Thonga
    history.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Bvesha, identified by the author as a Thonga corruption of Venda, built
    furnaces in ant-hills, excavated three holes below them, and used skin bellows
    with antelope-horn outlets.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Iron ore was broken into small pieces, mixed with charcoal, melted, crushed,
    melted again, crushed again, and made into hoes, axes, and other objects.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author states that the origin and introduction date of iron in South Africa
    remain uncertain; he mentions but does not confirm possible Malemba influence
    and suggests the craft may be older.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: A young man named Philemon made a belt from twisted iron, brass, and copper
    wires bent in festoons and fastened with small metal tongues.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says Zulus and the author’s tribe manufacture large cups and egg-cups,
    fasten assagai blades with iron wire, and sometimes cover ebony sticks with steel
    and brass wire networks.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A Native expert in wire work repaired the stock of the author’s sporting gun.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Wire formerly made by Native blacksmiths was, at the time described, bought
    at Lourenco Marques or from Hindu traders.
  category: sequence
  evidence_refs:
  - ev:8
