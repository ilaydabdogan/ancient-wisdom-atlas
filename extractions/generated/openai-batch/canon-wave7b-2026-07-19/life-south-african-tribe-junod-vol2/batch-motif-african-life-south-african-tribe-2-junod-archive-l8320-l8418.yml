canonical_text:
  quote: ''
  summary: A Hare and a Baboon travel to a village. The Baboon tries to send the Hare
    away for burn medicine so that he can eat all the food, but the Hare anticipates
    the trick and secretly obtains the remedy beforehand. Later, after both have wives
    and separate villages, the Baboon disguises himself with mud to frighten the Hare's
    household and steal meat; the Hare catches and shoots him. A variant episode says
    the Baboon tries to avenge himself by cooking the Hare's excrement for him, but
    the Hare secretly discards it and eats a fowl's leg he brought with him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Baboon arranges that, if his throat is scalded while eating, the Hare
    must run back for medicine; the narrator states that this plan is meant to remove
    the Hare while the Baboon eats the food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hare suspects a trick, marks the medicinal tree with an arrow, digs up
    a root, hides it in his bag, and denies taking any roots when questioned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the meal, the Baboon cries that his throat is burned; the Hare immediately
    produces the remedy from his bag, and the Baboon becomes angry.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The failed deception causes the Baboon to lose appetite and weaken, while
    the Hare eats heartily.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After returning home, the Hare hunts for meat, while the Baboon steals the
    Hare's meat by covering himself with mud and frightening the Hare's wife and children
    away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Hare hides to watch the thief; when the Baboon takes meat from the cooking
    pot, the Hare shoots him in the stomach with an arrow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Hare later visits the injured Baboon, says he knew the Baboon stole the
    meat and that he shot him; the Baboon dies, and his wife is left in want.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In a different version, the Baboon collects the Hare's excrement and cooks
