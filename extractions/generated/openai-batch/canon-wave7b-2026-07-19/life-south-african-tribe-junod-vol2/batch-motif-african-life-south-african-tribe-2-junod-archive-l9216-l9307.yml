canonical_text:
  quote: ''
  summary: An ogre, treated as the Queen but recognized as nonhuman and hiding his
    tail, is lured by women onto matting over a hole and falls into boiling grease,
    where he confesses eating fowls and eggs. One of his eyes falls on a rubbish heap
    and grows into a gourd-plant. The maiden becomes the chief's wife and later bears
    a son as the plant produces a gourd. The gourd speaks, warns her, is nevertheless
    picked and cooked, and while she is away it places her child in the cooking pot
    and returns to the plant. The same event recurs with another child, so the chief
    moves the village, after which the misfortune ends. The passage then transitions
    to a list of moral tales and notes a similarity between two named tales.
  language: English
  quote_policy: summarized
