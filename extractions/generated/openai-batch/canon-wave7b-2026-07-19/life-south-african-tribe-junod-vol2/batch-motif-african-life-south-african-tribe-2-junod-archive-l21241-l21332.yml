canonical_text:
  quote: ''
  summary: The author concludes with a missionary argument that the South African
    tribe can avoid moral destruction through Christianity and education. Christianity
    is presented as a religion of sanctity, conversion, regeneration, supernatural
    transformation, divine fatherhood, and love between races. The passage contrasts
    Christian moral restraint with older taboos, animistic rites, magical notions,
    and fear of spirits, and ends by urging missions, schools, and social responsibility.
  language: English
  quote_policy: summarized
