canonical_text:
  quote: ''
  summary: 'The passage describes initiation procedures for diviners and medicine-men:
    ritual cooking and eating of animals with divinatory bones, tests of identifying
    named astragali, ablutions, washing of bones with vegetal substances and beer,
    transfer of a master’s bone to the initiate, planting and consecration of a forked
    branch altar, ancestor sacrifice, and later ceremonies connected with the master’s
    death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A master kills a fowl, puts collected bones into its body, cooks it, and the
    candidate eats the fowl and returns home with the bones.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The candidate buries an astragalus at the village entrance, watches passersby,
    and exhumes astragali classified by sex and age of those passing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the buried-bone procedure, the bones are said to have returned to the
    candidate.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The master orders the candidate to close his eyes, places the bones in a line,
    and requires the candidate to identify each by touch and name.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After passing the trial, the new diviner undergoes a long ablution with nkuhlu
    leaves and is initiated.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among the Nkuna, an apprentice practices away from home until he has earned
    a goat, which he brings to the master to have his bones cooked.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Nkuna rite, goat parts, a banga root, and both the master’s and apprentice’s
    sets of bones are cooked together.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The cooked contents are poured into a lihlelo basket; master and apprentice
    draw in the broth with their lips and eat the meat with their teeth without using
    their hands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage compares this handless eating to vultures, described as scenting
    meat from far away.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A vulture heart is cooked with other drugs so that the new diviner will dream
    of distant things and go straight to them.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The divinatory bones are washed with mbandjwa bark; the apprentice’s astragali
    are mixed with the master’s and must be chosen without error by name.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: If the apprentice fails the selection test, the trial may be repeated later
    with the two sets dipped in beer, the beer drunk, the bones washed and thrown,
    and the apprentice choosing again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The old diviner gives one bone from his own set to the new diviner; this bone
    is said to reign over the initiated set and to be its father and mother.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The omen shown by the transferred ruling bone affects whether the new diviner
    accepts or fears to pronounce a favorable prognostic.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The diviner is often also a medicine-man and may be taught drugs as well as
    the Word.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: The former price paid to an initiator is described as eighty hoes or a wife.
  category: object
  evidence_refs:
  - ev:11
- id: obs:17
  text: After receiving new qualifications, the new diviner has the right to plant
    a magic forked branch called shiphandje.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: The pupil must dig white sand from a deep pool and bury it in the hut where
    the forked branch will be placed.
  category: action
  evidence_refs:
  - ev:13
- id: obs:19
  text: The branch is thereafter said to be planted in the abyss; if the hut burns
    or enemies set fire to it, water will spring up and prevent the branch from being
    consumed.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:20
  text: A sacrifice is made to ancestors who transmitted drugs to the initiator, and
    psanyi from a slaughtered sheep is used to smear the branch.
  category: action
  evidence_refs:
  - ev:14
- id: obs:21
  text: A continuing relationship remains between old doctor and pupil; when the old
    doctor dies, the pupil must awaken his drugs through ceremonies removing death
    defilement.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:22
  text: The forked pole is described as the magician’s laboratory, altar, and museum,
    holding calabashes of drugs, a basket of bones, amulets, and valuables.
  category: attribute
  evidence_refs:
  - ev:16
- id: obs:23
  text: Mankhelu exposed coins at the foot of the branch during the night to inform
    his gods of his success.
  category: action
  evidence_refs:
  - ev:16
