canonical_text:
  quote: ''
  summary: 'The passage describes Thonga/Tsonga diviners and their divinatory bones:
    a hondlola rite marks passage from apprenticeship to mastership; bones are ritually
    washed at each new moon and smeared with psanyi; unsuccessful diviners may offer
    a victim to an ancestor-god so that a deceased interpreter''s spirit enters them;
    Mankhelu uses burning black grease and smoke to attract clients; women may rarely
    become bone-throwers; diviners are portrayed as sincerely attached to their bones
    and baskets despite failed predictions and occasional skepticism.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hondlola is described as a rite by which diviners pass from apprenticeship
    to mastership, enter a new condition, and acquire a special position.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At every new moon, diviners ritually wash their bones to remove the previous
    month's defilement and then smear them with psanyi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a diviner is unsuccessful in forecasts, another member of the confraternity
    may tell him to offer a victim to an ancestor-god who had been a bone-thrower
    and was believed to have given the bones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the spirit of interpretation of the deceased will
    enter the supplicant.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mankhelu kept a pellet of black grease among his bones and burned some on
    a glowing cinder with the bones arranged around it; the smoke was said to call
    people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women can become bone-throwers, but the passage says this is rare.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says diviners have confidence in the power of their bones and
    strong attachment to their divinatory basket.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Each astragalus bears a name recalling the person who gave it, the circumstance
    in which it was found, and successes in the diviner's career.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage gives examples of flexible interpretation, saying the tortoise
    in the negative position may mean black earth, death, defilement, a swept village,
    or burnt bush according to the case.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage reports failed predictions, including a forecast that a child
    would be a boy and live, while the child was a girl and died.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some people express skepticism, but the passage says they often consult again,
    though not with the same diviner.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mankhelu refused to sell the narrator either of two named items called the
    Son and the Father, and justified keeping the bones by referring to consulting
    them for a child's dysentery.
  category: speech
  evidence_refs:
  - ev:8
