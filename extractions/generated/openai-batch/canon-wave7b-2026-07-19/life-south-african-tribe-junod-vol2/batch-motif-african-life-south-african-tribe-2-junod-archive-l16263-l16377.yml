canonical_text:
  quote: ''
  summary: 'The passage describes Thonga medical and magical practices associated
    with Mankhelu and other nanga: renewal of medicines at the new year, disposal
    of contaminated old powder at a crossroads, preparation of composite plant medicines,
    named drugs with healing, protective, military, persuasive, and rain-related functions,
    gendered rules for male and female medicines including sacrificial taboos, and
    surgical treatments using plant powders and saps. The author comments on the blurred
    boundary between plant-based medicine and magic.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The renewal of drugs is said to give them new strength at the new year or
    new season, while old drugs are described as contaminated by the previous year's
    misfortunes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A nanga removes some old powder from each calabash, throws it onto a path
    at a crossroads, washes the calabashes there, and says misfortune is thrown away
    for passers-by to carry off.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: New powder is added to the remaining old powder, which is described as being
    raised by it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mankhelu combines roots, leaves, and drugs in calabashes and is described
    as claiming universal medical capacity by putting together many kinds of drugs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The drug Ntfebe is described as having three uses: enabling the trampling
    of enemies, trampling winds that spoil crops, and driving out a bad cold or wind
    that causes coughing.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Several named drugs are assigned functions against misfortune, enemies, curses,
    assagais, road obstacles, patient avoidance, disagreeable speech, and weakness
    among other drugs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Medicines taken from the sea are added to the powder and are also associated
    with Mankhelu's rain-making practice.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The passage says drugs have a sexual character: female drugs are used mainly
    for sprinkling the army and assagais, while male drugs are used for treating diseases.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: For a sacrificed she-goat, male drugs are put in the animal's mouth and smeared
    on the killing weapon; for a he-goat the reverse is required, and doing otherwise
    is taboo.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The term muri is explained as meaning tree, plant, or medicinal herb, and
    also any means for producing natural or supernatural effects on favorable or hostile
    influences.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The same shrub is described as being able to cure a cough, protect mealies,
    and rout an enemy.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sores and wounds are treated with black powder, bark powder, and saps from
    named trees or plants, including white or milky sap.
  category: action
  evidence_refs:
  - ev:10
