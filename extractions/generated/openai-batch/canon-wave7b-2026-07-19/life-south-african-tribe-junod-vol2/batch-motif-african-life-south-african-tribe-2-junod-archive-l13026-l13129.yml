literal_observations:
- id: obs:1
  text: The author states that the Thonga have not made anatomical study or post-mortem
    examination of human corpses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A riddle compares a dead man being buried with a fire of live coals, and the
    author explains that one would not touch a corpse just as one would not put a
    hand in fire.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Thonga knowledge of the human body is drawn indirectly from
    oxen, pigs, and game that they cut open.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists Thonga names for many bones and organs, while also noting
    some anatomical uncertainties or omissions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author says one term, nsiha, covers nerves, tendons, ligaments, veins,
    and arteries, and that nyimba means both uterus and pregnancy.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that the nervous system, blood formation, digestion, blood
    circulation, and the action of air upon blood are unknown in this physiology.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author says Bantu, especially Thonga, hold physiological notions that
    he calls superstitions and that these give rise to practices, rites, and purifications.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Human life is described as composed of successive periods, each with its own
    character.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The first period extends from birth to the fall of the umbilical cord; during
    it the baby is said to be in a state of contamination owing to lochia and must
    not be touched.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The nursing period is divided by presentation to the moon and by tying a cotton
    string, and the child is described as becoming increasingly aggregated to human
    society.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The child is described as under treatment, not yet a complete healthy human
    being, as water and not yet firm, threatened by disease, and required to drink
    milombyana; the hondlola ceremony and weaning close this period.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Infancy and childhood are described as bukhuna, a state of incompleteness
    with defilement, and circumcision rites are said to remove this inferior condition.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Young men and women wishing to marry must undergo ceremonies in order to pass
    from unmarried to married status.
  category: sequence
  evidence_refs:
  - ev:7
