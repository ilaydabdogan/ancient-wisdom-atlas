canonical_text:
  quote: ''
  summary: 'The passage describes an ecstatic diviner who, urged by song, searches
    for harmful witchcraft objects, marks a hut corner, and has alleged charms uncovered
    and burned. It then describes the mondjo ordeal: an intoxicating plant drink prepared
    by Shihahu specialists and administered under chiefly authority to reveal guilt,
    including testing on Mudlayi, mass drinking at a lake border, confessions, enforced
    stillness in the sun, and Mudlayi''s dance.'
  language: English, with Thonga/Ronga terms and song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A song addresses the diviner and tells him to seek for the object or influence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The diviner dances, enters an excited inspired condition, brandishes a tail,
    inhales in different directions, and runs toward a place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The assembly claps hands and sings while the diviner proceeds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The diviner enters a hut, plants his assagay in a corner, and a hole is dug
    at that spot.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dug spot reveals a small gourd full of blood, packets of objects connected
    with enchantments, and perhaps a snake.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The narrator notes that the diviner may have previously hidden the articles,
    but he carries them away as the wizards' weapons or bloods.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: The chief orders the diviner to show the objects to their owner; the articles
    are thrown before the hut occupant, and the charms and gourd are to be consumed
    by fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The mondjo ordeal is described as a chief-ordered juridical action used to
    unmask spell-casters by an ordeal supposed fatal to the guilty.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mondjo is an intoxicating plant used to prepare a beverage that is supposed
    to reveal guilt; intoxication or unconsciousness after drinking convicts the drinker.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Shihahu specialists prepare the mondjo philter, and the recipe includes
    strange ingredients, including fat or powdered bones from a deceased leper.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The brew is tested on Mudlayi, described as the bull of all wizards; if it
    intoxicates him it is successful, and if not another brew is made.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: At a general assembly by a lake, men and women drink a mouthful of mondjo;
    some confess that they are spell-casters and are placed under a tree.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The remaining people sit in a line under the noon sun and are ordered not
    to move or scratch themselves.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Mudlayi dances before the drinkers, glares at them with wide-open eyes, and
    waves a feather fixed in his hair by moving his head.
  category: action
  evidence_refs:
  - ev:10
