canonical_text:
  quote: ''
  summary: The passage summarizes stages in the historical and cultural evolution
    of the Thonga/Tsonga people, including inferred early beliefs in witchcraft, astragalomancy,
    and older mythological conceptions; migrations and settlement near Delagoa Bay;
    later clan invasions, trade, iron, agriculture, military change, language formation,
    folklore enrichment, ancestrolatry, and a notion of Heaven and an All-Father;
    Ngoni/Zulu military disruption; and early twentieth-century changes involving
    European administration, weakening taboos and ancestor-gods, Islam, and Christianity.
  language: English
  quote_policy: summarized
