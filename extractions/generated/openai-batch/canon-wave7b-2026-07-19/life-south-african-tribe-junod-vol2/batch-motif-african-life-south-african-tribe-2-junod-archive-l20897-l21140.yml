  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A fourth period is attributed to the invasion of the Ngoni army under Manukosi,
    after which clans are described as amalgamated under a Zulu conqueror and war
    replaces earlier skirmishes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Gazaland, the year is described as divided between agricultural labor and
