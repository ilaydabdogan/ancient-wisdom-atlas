- id: obs:2
  text: An early period is described as including patriarchism, clans, probable witchcraft,
    supposed astragalomancy, and mythological conceptions said to have nearly disappeared
    by the author's time.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After long migrations, the South African tribes are said to have reached their
    present abode, with the Thonga located near Delagoa Bay by the end of the fifteenth
    century.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A later period is described as beginning with clan invasions, the appearance
    of white men, trade, adoption of stuffs by women, introduction of iron, and developments
    in agriculture and military tactics.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the same later period, the Thonga language is said to be formed with
    six dialects, and folklore is said to be enriched by contributions from various
    clans.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says ancestrolatry still reigned during the later pre-1820 period,
