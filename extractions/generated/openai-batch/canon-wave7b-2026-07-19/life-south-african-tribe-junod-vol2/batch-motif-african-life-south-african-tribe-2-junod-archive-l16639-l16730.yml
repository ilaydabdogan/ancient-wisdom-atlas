canonical_text:
  quote: ''
  summary: 'The passage describes Thonga medical and purification practices: a mat-enclosed
    vapour bath called phungula/kungula used for complaints, death-related contamination,
    ritual defilement, and infertility; a cautery practice called tlbema using heated
    roots or a foot heated on a red-hot hoe; and a purification ceremony called hondlola/hondla
    after serious illness or weaning, involving goat sacrifice, prayer to gods for
    healing strength, body-rubbing with goat psanyi and drugs, divination by bones,
    and disposal of gathered particles in indicated places.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The phungula/kungula is described as a Turkish or vapour bath administered
    for certain complaints and after funeral rites to remove contamination of death.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: A circular mat enclosure is made; the patient is placed inside near a pot
    on live embers containing medicinal leaves, and a second mat covers the top like
    a small hut.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Smoke and hot vapour cause coughing and profuse perspiration; after the mats
    are removed, the patient is exposed to open air and the doctor rubs parts of the
    body with white or black powder.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The phungula is used when ritual defilement is feared or thought to have caused
    disease, including impurities connected with death, menses, and lochia.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The vapour bath is also used for married people who have not succeeded in
    having children.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: For the infertility use, a physician prepares a packet of roots, cooks it
    inside the mat enclosure, and puts drug-smeared goat flesh, especially the uterus,
    into the fire under the pot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says the medicine enters the patient by vapour or smoke; the recipients
    are described as ripening or being cooked, and cold water is poured over them
    when the mat is removed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The tlbema cautery may be performed with heated roots, but is generally done
    with a foot that transfers heat from a red-hot hoe to the affected spot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Before the foot cautery, the operator's sole is rubbed with chewed medicinal
    leaves mixed with saliva and grease, or with a fat containing drugs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The hondlola/hondla is described as a purification ceremony after cure, intended
    to remove the defilement of disease and disperse the bloods that made the patient
    sick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In adult hondlola, a goat is slaughtered, the doctor takes a piece from each
    limb, and prays to his gods for strength to cure the patient.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The goat psanyi is mixed with drugs; the patient rubs the whole body with
    it, fallen particles are gathered, and bones are consulted to decide where the
    particles must be thrown.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Possible disposal places include a hole in a tree trunk, the river, marsh
    mud, an ant's nest, or the entrance to a molehill; the physician places the gathered
    material in a broken pot or shell and closes the hole.
  category: sequence
  evidence_refs:
  - ev:8
