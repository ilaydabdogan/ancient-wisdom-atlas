canonical_text:
  quote: ''
  summary: The passage catalogs Thonga names and beliefs concerning arthropods and
    insects. It describes an earth-and-water precaution after millipede or scorpion
    stings, a locust calamity said to have been foretold by a little man fallen from
    heaven, mantis offerings and former beliefs that mantises were ancestor-god emissaries,
    speech addressed to a flying locust, lice associated with bewitchment, and limited
    knowledge of the caterpillar-butterfly relation.
  language: English
  quote_policy: summarized
