canonical_text:
  quote: ''
  summary: 'The passage describes baloyi as witches who steal crops, form armies to
    raid other regions, cross Delagoa Bay on a ladder made from nkakana seeds, and
    may be perceived as storms. It also describes nocturnal witch attacks: a noyi
    flies to an enemy, bypasses a spiritual fence with help from an accomplice, enters
    through the hut roof, and bewitches the sleeper so that only a shadow or outer
    frame remains. Further bewitching methods include pointing with the index finger
    and using a victim’s shed blood.'
  language: English
  quote_policy: summarized
