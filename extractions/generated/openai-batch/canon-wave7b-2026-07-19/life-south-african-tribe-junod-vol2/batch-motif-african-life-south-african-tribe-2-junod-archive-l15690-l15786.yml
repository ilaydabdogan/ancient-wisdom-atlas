canonical_text:
  quote: ''
  summary: 'The passage reports several practices interpreted by the author as connected
    with Heaven: a twin girl fears looking at a rainbow; Herero multiple-birth customs
    involve silence, community gifts, purification, and fines; and a Thonga-related
    nunu beetle-expulsion rite uses divination, women collectors, a twin daughter
    who silently casts insects into a lake, songs, male avoidance, and sometimes hostile
    transfer of pests to neighboring lands. The author links these phenomena to a
    mysterious heavenly power over atmosphere, fields, and human life.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female pupil identified as a twin hides her face when a rainbow appears
    after a tornado, and the explanation given is that twins dare not look at the
    rainbow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Herero, multiple birth is described as an exceptionally happy event,
    while the father and mother are required to keep complete silence under threat
    of a curse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Herero tribe members assemble with cattle, present gifts to the twins' parents,
    receive purification with powder, and the father may claim an ox from villages
    as a ransom-like payment.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The author states that a celestial power causes death or curse, with the affected
