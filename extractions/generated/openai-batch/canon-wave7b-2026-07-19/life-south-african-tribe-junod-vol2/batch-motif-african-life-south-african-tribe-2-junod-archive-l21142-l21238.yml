canonical_text:
  quote: ''
  summary: The author evaluates the development of the South African tribe, arguing
    that social and agricultural progress has occurred while religious life has remained
    comparatively static. He then describes twentieth-century civilisation as bringing
    both benefits and severe harms, warns of moral and physical decline and possible
    extinction if harmful influences continue, and discusses proposed remedies such
    as government action, moral formation, enlightenment, and compulsory work.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author says the tribe should not be described as being in utter degeneracy,
    and instead identifies slow progress in agriculture, family life, and the social
    system, often attributed to outside influences.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author says the religious domain has shown almost complete immobility,
    possibly degeneration if an older monotheistic notion has lost precision, while
    folklore has been enriched and psychic life has changed little.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that the South African tribe has undergone more change in
    the last fifty years than in the preceding centuries and expects rapid continued
    transformation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author lists benefits attributed to civilisation, including reduced famine
    through trade, better clothing, better seeds and implements, money-earning, tax-related
    work incentives, decreased polygamy, and broadened ideas through travel and town
    work.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author says civilisation's harms exceed its benefits and names losses
    of political responsibility, hierarchical respect, personal dignity, religious
    faith, and respect for taboos.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author attributes alcoholism, sexual vices, diseases, and increased criminal
    acts to civilisation's influence and says the tribe has lost its orientation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The author says the Black race possesses physical strength and prolificacy
    against these new foes, but adds that these traits may not last forever.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Mpongwe tribe in the French Congo is presented as a group disappearing
    after longer contact with debasing White influences, with a birth-rate reduced
    almost to nothing.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: The author considers possible long-term extinction if harmful influences are
    not checked, rejects segregation or removal to tropical Africa as impracticable,
    and names strong moral character with enlightenment of mind as the only remedy.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The author discusses the proposed Gospel of Work, accepts regular manual work
    as beneficial, but doubts forced labour would permanently transform the South
    African Bantu.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: A footnote says the remarks apply especially to the Thonga tribe; it states
