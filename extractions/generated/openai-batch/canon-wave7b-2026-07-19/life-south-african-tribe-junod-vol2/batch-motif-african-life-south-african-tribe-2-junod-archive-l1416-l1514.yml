  quote: ''
  summary: The passage describes varieties of cereal-based and fruit/tree-product
    intoxicating drinks, especially buputju, madleko, byala, mpheka, bukanyi, and
    buhimbi. It gives preparation sequences involving grain, yeast, water, boiling,
    fermentation, straining, storage, and serving, with notes on Nkuna and Ba-Ronga
    methods and on the mphimbi tree fruit used for buhimbi.
  language: English
  quote_policy: summarized
literal_observations:
