  text: Cereal-based intoxicating drinks are grouped under the name Kafir beer and
    vary by alcoholic strength.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Buputju and madleko are described as light beers, while byala and mpheka are
    described as strong beers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Buputju or madleko can be prepared from cooked and ground mealie material,
    Kafir corn yeast, and water, with fermentation occurring quickly enough for consumption
    after one day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the Shiluvane recipe, mealie flour is mixed with cold water, poured into
    hot water, boiled, cooled, mixed with yeast in the evening, and drunk after fermenting
    by the next day.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The passage says that more alcohol is obtained when yeast is mixed twice with
    the flour, before and after boiling.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The brewing of byala among the Nkuna is described as a nine-day procedure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the first five days of Nkuna byala brewing, Kafir corn is soaked, drained,
    covered with leaves to keep it moist, and left to sprout for yeast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Women and their relatives pound soaked mealies in mortars, prepare flour without
    removing the husks, fetch water, boil it, and combine flour, water, and yeast
    in pots.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the eighth day of the Nkuna byala process, pots are put on the fire for
    prolonged boiling, then the beer is cooled and additional yeast is added.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: If the beer has fermented and swollen by the morning of the ninth day, it
