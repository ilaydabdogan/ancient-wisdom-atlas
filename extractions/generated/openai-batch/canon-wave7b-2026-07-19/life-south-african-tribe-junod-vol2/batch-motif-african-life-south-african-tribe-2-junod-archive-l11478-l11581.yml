canonical_text:
  quote: ''
  summary: The passage describes Thonga beliefs and rites concerning drought and rainfall.
    Rain is said to come from ancestor spirits; when rains fail, sacrifices may be
    offered at ancestral graves. Other causes of drought include a wizard's magical
    obstruction and taboo events connected with miscarriage, twins, or improperly
    buried children. A quoted medicine-man explains that hidden miscarriage blood
    and a burned abortive child spoil the chief's country and stop rain. The remedy
    involves identifying the woman, cleansing the hidden place with medicine, moving
    contaminated earth to and from the river, pouring river water into the hole, and
    sprinkling medicines at boundaries, roads, and drifts so the country becomes pure
    and rain can fall.
  language: English
  quote_policy: summarized
