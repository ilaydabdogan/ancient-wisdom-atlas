canonical_text:
  quote: ''
  summary: The passage describes mbelele-related rain and purification rites among
    Nkuna, Ronga, and Maluleke groups. When the land is judged impure, a chief orders
    rites involving sacrifice, women’s processions, temporary suspension of taboos,
    collection or relocation of remains associated with abnormal births, pouring water
    on graves or reburying remains near water, and in one variant burning impurities
    at a crossroads. These actions are presented as purifying the land and enabling
    rain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Nkuna account, when bones reveal that the country is impure, the chief
    orders the mbelele, described as a mourning period for the land.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rite begins with the phokolo, described as the sacrifice of a black victim.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women assemble, remove their clothing except for grass around their loins,
    move with a peculiar skipping step, and sing a song glossed as rainfall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The women go to places where prematurely born children have been buried in
    dry ground, collect what is found in broken pots, and keep the action hidden from
    children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Water is poured on the graves in order to quench them, and the collected impurities
    are buried in mud near the river on the evening of the same day.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: During this work no man may approach; the passage says women may strike an
    imprudent man and that ordinary language and nakedness taboos are suspended for
    the day.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Ronga account, a mother of twins leads a procession of women who draw
    water and pour it on twins’ graves to secure rain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Ronga account also includes cleaning wells and, in some cases, digging
    a twin corpse out of dry ground for reburial near the river or pouring water on
    the grave.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that these actions will act on Heaven, stop the burning
    October winds, and bring rain.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: The author summarizes a belief that abnormal births, including premature children,
    twins, certain children who died before a named rite, and in some clans children
    cutting upper teeth first, have a harmful character connected with Heaven and
    can prevent rain.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The stated remedy is to bury such children in wet ground; if this was not
    done, the chief orders exhumation and burial near the river.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A note compares the mbelele rite with passage rites, emphasizing a special
    marginal mourning period marked by obscene speech and absence of clothing.
  category: other
  evidence_refs:
  - ev:6
- id: obs:13
  text: The next section says rain charms may be used when removal and reburial of
    abnormal children’s corpses does not produce rain, and it describes rain-makers
    as powerful specialists.
  category: other
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the Maluleke account, women collect bones of twins and children who were
    born dead or died at birth, add old rags, bring the impurities to crossroads,
    and burn them while singing impure songs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: In the Maluleke account, speech declares that taboos are absent for the day,
    and the smoke of the burned material is described as a religious offering after
    which the country will be pure and rain will fall.
  category: speech
  evidence_refs:
  - ev:8
