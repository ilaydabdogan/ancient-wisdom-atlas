canonical_text:
  quote: ''
  summary: The passage describes Thonga exorcism songs, songs embedded in tales and
    games, examples of ogre and animal-transformation tales, the social place of evening
    storytelling after games and riddles, the range of storytellers, a taboo against
    storytelling at noon, and a closing formula that sends the tale away to Gwamba
    and Dzabane, identified as first man and first woman among Northern clans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Serious incantations include exorcism songs performed with rattles, big tins,
    and drums close to the ears of people described as pretended possessed, in order
    to make the spirit reveal its name and come out.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Little songs are frequently introduced into tales, repeated three or four
    times, and used to embellish the narration.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: One tale-song concerns a little boy swallowed with his oxen by the ogre Nyandzumulandengela;
    from inside the monster's stomach he asks to be let out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another tale-song is the lament of a mother whose child has been stolen by
    the Baboon; she follows the animal and asks for the child back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Another ogre tale concerns suitors of pretty girls who are hyenas transformed
    into men; someone who knows their true nature forces them to appear as they really
    are by chanting their song.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the evening meal, village inhabitants gather around the fireplace for
    amusements including guessing charcoal, finger-pulling, and riddles; losers redeem
    forfeits by telling a tale.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Storytelling is described as an evening entertainment practiced throughout
    the tribe and considered one of the most refined and pleasing games.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Storytellers are described as being of all ages and both sexes, with many
    collected tales coming from adult women.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states a taboo against storytelling at noon and says that a transgressor
    will become bald.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: At the end of a tale, the storyteller concludes with words glossed as 'Run
    away, go to Gwamba and Dzabane.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Gwamba and Dzabane are said to be believed, at least among the Northern clans,
    to be the first man and the first woman.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The author supposes that the closing formula prevents the marvelous story
    from haunting hearers at night and functions as a return from fairy land to everyday
    life.
  category: other
  evidence_refs:
  - ev:10
