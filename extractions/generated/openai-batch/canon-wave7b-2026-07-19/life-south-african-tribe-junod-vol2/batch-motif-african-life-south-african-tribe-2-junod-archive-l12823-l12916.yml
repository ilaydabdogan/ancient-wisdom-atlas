canonical_text:
  quote: ''
  summary: The passage reports Thonga-related traditions about first ancestors and
    creator figures, including Ribimbi and Khudjana/Hobyana, discusses disputed explanations
    for Gwambe/Magwamba, narrates an origin-of-death myth in which a slow chameleon
    carrying a resurrection message is overtaken by a swift lizard carrying a mortality
    message, describes boys punishing chameleons because of this myth, recounts a
    tale in which Khudjana traps Ribimbi on a spoked pole and steals his food, and
    adds comparative comments about Zulu, wider African, Ba-Rotsi, and biblical parallels.
    It closes with remarks on Bantu conceptions of human races.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the clans of Maluleke and Spelonken, the passage reports a tradition in
    which the first man is Ribimbi and his son is Khudjana, whose name is transformed
    as Hobyana in Thonga phonetics.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Thonga only say Hobyana is creator of Heaven and Earth
    and the first ancestor of the race.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage gives multiple explanations of Gwambe and Magwamba and says the
    author sees no real connection between Gwambe the first man and the Ma-Gwamba.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first human beings are said to have emerged from a marsh of reeds, whose
    chief sent the Chameleon, Lumpfana, to them with a message that men would die
    but rise again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Galagala, a big lizard with a blue head, was sent with the message that
    men would die and rot; it moved quickly, passed the Chameleon, and delivered its
    message first.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: When the Chameleon arrived, men rejected its late message because they had
    already accepted the other message; the passage presents this as the reason humans
    are subject to death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says shepherds and boys tease chameleons, put tobacco into their
    mouths, and interpret this as vengeance on the chameleon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In one tale, Khudjana plants a large pole with spokes, Ribimbi climbs it,
    Khudjana removes the lower spokes, leaves Ribimbi unable to descend, and steals
    the food prepared for him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Venda-related account identifies Ribimbi or Levivi with a great rain-maker,
    protector of men, superior being or god, and possibly with Nwali or in close relation
    to Nwali.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author states that the same story is told among the Zulus, that similar
    myths occur across Africa especially among the Ba-Rotsi, and that there is a resemblance
    to the biblical story in addressing the origin of man and death.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says banhu or bantu refers to Black people and that Bantu recognize
