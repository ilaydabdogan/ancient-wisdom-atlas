canonical_text:
  quote: ''
  summary: 'The passage describes Thonga hut construction: despite rapid changes in
    dress, hut architecture is said to remain ancient. The roof is built first from
    sticks and hoops as a conical basket, then turned over and placed on a cylindrical
    wall of stakes and reeds. Men of the village help raise the roof, receive beer,
    and celebrate. The roof is then thatched with sewn bunches of grass fastened around
    the hoops.'
  language: English
  quote_policy: summarized
