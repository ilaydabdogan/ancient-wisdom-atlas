canonical_text:
  quote: ''
  summary: 'The passage describes Thonga procedures for identifying and responding
    to suspected witchcraft after serious illness or death: preliminary bone divination,
    tests using an enchanted horn or flute, public warning assemblies, smelling-out
    by questioning, confirmation by another diviner, judicial referral and ordeal,
    and the beginning of an ecstatic public divination scene.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Protective medicines may surround the village, be swallowed by inhabitants,
    or be used for inoculation; if they do not prevent serious disease, the disease
    may be treated as an evil attributed to baloyi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The patient's relatives secretly consult a diviner, who casts bones to determine
    whether the disease is due to witchcraft.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some divination bones represent baloyi, especially the astragalus of the reedbuck
    or duyker, an antelope associated in the passage with night-time movement.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: If the baloyi bone falls in a specified way near the bone representing the
    patient, or near the patient's amulets on the mat, this is taken to show that
    the disease comes from buloyi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The relatives do not dare accuse someone solely on the testimony of the bones;
    the next step is to go to a mungoma who smells out baloyi.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: In the enchanted horn procedure, suspected persons must try to pull from a
    horn a twig smeared with anti-baloyi medicine; the noyi is said to be unable to
    remove it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Among the Nkuna, a magician who has found a wizard takes the wizard's coat
    and hangs it on a tree as a trophy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: In the enchanted flute procedure, a mungoma treats a grave with drugs, gives
    a small flute to the bereaved, and instructs him to play it in the neighborhood;
    the rite is said to detect and punish the wizard by death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The rera nyiwa or ba hungwe is an assembly summoned to disclose wizards, especially
    when the chief is sick or an epidemic threatens villages.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the assembly, the headman or sub-chief announces that the bones have indicated
    an offender of a described social category and warns the hidden offender to cease
    enchantments and restore the patient to health.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: The assembled people look at each other and try to identify who is meant by
    the bones and by the speaker.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The rera nyiwa is described as a solemn warning to the baloyi of the country
    and as a measure that may prolong the chief's life.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: When the name of a noyi is desired for punishment, especially after a death,
    the mungoma proceeds to shinusa divination, which can be done by questioning or
    by ecstasy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: In questioning, the relatives of the bewitched pay the shinusa, sit in a half-circle,
    and answer his questions with the word mamoo, meaning yes in the language of hungoma.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: The diviner listens to shades of confidence in repeated mamoo responses, uses
    knowledge of disputes and hatreds, and gradually approaches the person the consulting
    party is thinking of.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: When the diviner names the culprit, he lets his tail fall and is described
    as perspiring, silent, and triumphant after the strain.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: After the first naming, relatives go to the accused person's kraal, wave branches,
    dance, and accuse him of killing them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The accused says that his side will consult its own mungoma; a second smelling-out
    scene is performed, and the second verdict is likely to confirm the first.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: After proof and counterproof, the case becomes judicial and is brought before
    the chief, who requires confirmation by the ordeal of the philter called mondjo
    before condemnation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:20
  text: In the beginning of smelling-out by ecstasy, people are assembled in the Capital;
    the diviner arrives with amulets and insignia, carries a magical tail as a whip
    and an assagay, dances, and the surrounding crowd claps and sings.
  category: action
  evidence_refs:
  - ev:9
