candidate_motifs:
- id: motif:1
  label: Illness or death attributed to witchcraft and diagnosed by divination
  taxonomy_refs: []
  basis: Serious disease or death is treated as potentially caused by baloyi, and
    relatives consult diviners to determine and identify witchcraft.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage is ethnographic description, not a mythic narrative episode.
- id: motif:2
  label: Divination bones reveal a hidden witchcraft cause
  taxonomy_refs: []
  basis: Specific bones represent baloyi and the patient, and their spatial relation
    is read as showing buloyi.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not provide the full rule system for the bone positions.
- id: motif:3
  label: Enchanted object truth-test for a suspected witch
  taxonomy_refs: []
  basis: The enchanted horn and medicine-smeared twig function as a test that the
    noyi is unable to pass.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Only one horn procedure is described; broader distribution is not established
    here.
- id: motif:4
  label: Ritual music detects and punishes a witch
  taxonomy_refs: []
  basis: A small flute given after grave treatment is played in the neighborhood and
    is said both to detect the wizard and to punish him with death.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The mechanism of detection or punishment is not further explained in the
    supplied passage.
- id: motif:5
  label: Public warning assembly pressures hidden witches to release a patient
  taxonomy_refs: []
  basis: The rera nyiwa assembly publicly warns a described but unnamed offender to
    cease enchantments and restore the patient to health.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The warning identifies social categories rather than necessarily naming
    a specific culprit.
- id: motif:6
  label: Smelling-out by prompted assent
  taxonomy_refs: []
  basis: The shinusa questions relatives who repeatedly answer mamoo; the diviner
    reads degrees of conviction and names the culprit.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage includes an author's explanation of social inference by the
    diviner.
- id: motif:7
  label: Accusation confirmed by repeated divination and ordeal
  taxonomy_refs: []
  basis: A first naming is followed by confrontation, consultation with another diviner,
    confirmation, judicial referral, and the mondjo ordeal before condemnation.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The ordeal itself is only introduced, not described in detail in this
    passage.
- id: motif:8
  label: Ecstatic diviner performs before an assembled crowd
  taxonomy_refs: []
  basis: The diviner arrives adorned with ritual objects, carries a magical tail and
    assagay, dances, and is accompanied by clapping and singing.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The supplied passage ends as the chorus is introduced, so the full ecstatic
    procedure is not included.
