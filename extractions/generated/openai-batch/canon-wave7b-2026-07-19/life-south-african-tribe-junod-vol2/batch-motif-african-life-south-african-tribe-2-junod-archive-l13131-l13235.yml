  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Spitting is described as a sign of disrespect, especially prohibited in the
    presence of people eating; phlegm is covered with sand out of disgust.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Blood is covered with sand after being shed because wizards might use it to
