  quote: ''
  summary: The passage describes Thonga beliefs about physiological defilement, especially
    menstruation, lochia, disease, death, twin birth, sexual relations, and bodily
    secretions. It explains taboos, protective acts, ritual restrictions, and purifying
    uses of ritual sexual intercourse followed by collective lustration. It also notes
    attitudes toward spitting, blood, sweat, excrement, yawning, and hiccough.
  language: English
  quote_policy: summarized
