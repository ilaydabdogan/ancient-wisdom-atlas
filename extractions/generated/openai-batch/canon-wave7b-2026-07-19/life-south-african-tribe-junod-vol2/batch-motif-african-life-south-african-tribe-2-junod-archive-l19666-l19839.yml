canonical_text:
  quote: ''
  summary: The passage records two reported bone-divination readings. In the first,
    a battle consultation divides the bones into the diviner’s side and the enemies’
    side, interpreting the arrangement as Nkuna victory and Sikororo defeat. In the
    second, Mankhelu’s bone-throwing predicts a migration of distinguished visitors;
    when no visitors arrive, he says the bones lied and reconstructs the throw that
    had promised the migration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The divinatory bones are described as falling in two lots on a plate: the
    upper portion on the diviner’s side represents his own army and victory, while
    the lower portion represents enemies and rout.'
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lower, enemy-side portion is interpreted as showing killed chiefs, Rios
    represented by a Ram astragalus, a destroyed Sikororo village, grief among women,
    broken weapons, and the death of Titus.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A ram had been sacrificed to ask the gods for victory, and its astragalus
    was added to the bones to represent Rios.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An old Sikororo chief, represented by a Ram at the bottom left, is described
    as alone, unaware of Rios’s attack, and not to be harmed by the Nkuna.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Nkuna-side portion is interpreted as showing courage, missionary help,
    the safety of the clan totem, resting ancestor-gods, effective medicine, victorious
    troops and weapons, and peaceful children, elders, and women.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author identifies the battle of 6 November 1900 as the occasion that allowed
    him to witness the consultation and related tribal customs.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: On a day of renewing his drugs, Mankhelu throws his bones and interprets them
    as promising distinguished visitors who will submit to him and increase his power.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mankhelu tells the missionary that his god Shiluvane revealed that new tenants
    would come before the tilling season, and he promises an ox if they do not come.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After months pass with no visitors arriving, Mankhelu says he will show how
    the bones lied and places sixty-two bones as they had fallen on the earlier day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The migration prophecy layout is again divided into two halves: a lower migrating
    clan and an upper village welcoming it.'
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The migration reading interprets tokens as a ruined village leaving, chiefs
    in good condition, a daughter offered in marriage, a predicted male child, dispossessed
    chiefs, and signs of foreign origin.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
