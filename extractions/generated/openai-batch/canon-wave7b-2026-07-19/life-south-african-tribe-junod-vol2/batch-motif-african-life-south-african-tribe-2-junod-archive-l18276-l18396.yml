canonical_text:
  quote: ''
  summary: The passage describes Thonga accounts of baloyi enslaving or harming victims
    through animal transformation, rare beneficial uses of baloyi power under ancestor-spirit
    sanction, and a contrast between secret criminal witchcraft and public white magic.
    It then outlines magicians' initiation, medicines, social functions, and categories
    such as medicine-men, exorcists, and mungoma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Leopard footprints were seen in a mealie garden near Shiluvane, and people
    identified them as evidence of a bewitched person sent at night under animal form
    to serve the field owner.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Baloyi are said to assemble in a hubo, choose victims overcome by ntshutshu,
    change them into leopards, hyenas, and snakes, and compel them to till fields
    or move mealie stems into baloyi gardens.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A footnote reports Maputju accounts in which some baloyi treat certain beasts
    as their property; one noyi who owned a wild boar bewitched a hunter who killed
    the boar's son.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Nkuna of Thabina claimed to have witnessed nocturnal theft and was expelled
    because people reasoned that only a noyi could know such deeds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some good baloyi are said to use power to bless fields and increase produce
    when sent by ancestor-spirits after the prayer of the luma day has been heard.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A noyi may protect a person who has acted kindly toward him and prevent other
    baloyi from harming that friend, though the passage calls such cases rare.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists stealing, killing, and enslaving as principal crimes of
    the baloyi and states that they can cause other kinds of harm.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: One complainant said a noyi uncle had deprived him of procreative power and
    intended to change his wife's offspring into a snake, hare, quail, or duyker so
    that the mother would die at birth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Magicians' power is described as perhaps not essentially different from that
    of baloyi, and some magicians boast that they are more powerful baloyi able to
    discover and baffle witches.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mathuza, a Ronga witch-doctor, is quoted as calling himself the great Noyi,
    saying that he kills, can fly, knows all the witches, and discloses them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Magicians are distinguished from wizards by acting openly in daylight, displaying
    their magical powers, wearing charms and tingoya, and smearing themselves with
