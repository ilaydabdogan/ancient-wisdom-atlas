  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Baloyi are said to use tingati, or bloods and poisons, while magicians employ
    miri, medicinal herbs or objects understood to have special powers.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: Magicians believe they possess personal powers, including double sight, and
