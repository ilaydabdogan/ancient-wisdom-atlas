canonical_text:
  quote: ''
  summary: In a Thonga tale excerpt, Hare repeatedly deceives Baboon. Hare shouts
    from an ant-hill to expose Baboon eating others' ground-nuts, causing armed people
    to arrive and Baboon to tear his trapped tail loose. Hare later has the tail cooked
    and served to Baboon, then publicly reveals at a beer-drinking that Baboon has
    eaten his own tail. Baboon plans revenge by taking Hare on a journey and trying
    to make him discard his provisions, but Hare has packed stones above his food
    and tricks Baboon into throwing away his own supplies.
  language: English
  quote_policy: summarized
