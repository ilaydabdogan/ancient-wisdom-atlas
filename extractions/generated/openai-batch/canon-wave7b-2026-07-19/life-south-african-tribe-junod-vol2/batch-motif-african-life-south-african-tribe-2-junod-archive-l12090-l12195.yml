canonical_text:
  quote: ''
  summary: The passage describes Thonga naming and classification of plants, their
    practical botanical knowledge, taboos or ritual associations involving certain
    trees, and the absence of plant worship as such. It notes a tree tied with a rag
    as an offering to ancestral spirits, the Nkanye as socially and ritually venerated
    because of beer and funeral uses, and a taboo on using fire or wood from a lightning-struck
    tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Different Vernonia species are given different Thonga names, while externally
    similar plants from different families may receive related names.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Thonga do not analyze plant anatomy but do recognize
    male and female nkanye stems and preserve male stems for fecundating female ones,
    which they believe occurs through the roots.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Explained plant names are said to derive from external characters, sounds,
    uses, food value, medicine, or practical functions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Fire or wood from a tree struck by lightning is avoided for warming and cooking
    because of fear that men may suffer from hydrocele.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A tree with a rag tied around it may be encountered; the tree is described
    as probably selected by divinatory bones as the site around which a village should
    be built.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The rag tied around the tree is described as an offering to ancestral spirits,
    comparable to a rag placed near a grave or at the door of a small hut built on
    it in cases of possession.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Nkanye is called the king of trees and is sometimes called sacred, but
    the passage says it is not sacred in itself, has no Nature spirit dwelling in
    it, and can be cut without taboo.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Nkanye is venerated because it provides national beer and because its
    branches and twigs are used in funeral contexts; the relevant restrictions are
    attributed to fear of ancestral spirits.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Plants are distinguished from animals by different verbs: plants are things
    that grow, while animals are said to become great.'
  category: other
  evidence_refs:
  - ev:7
