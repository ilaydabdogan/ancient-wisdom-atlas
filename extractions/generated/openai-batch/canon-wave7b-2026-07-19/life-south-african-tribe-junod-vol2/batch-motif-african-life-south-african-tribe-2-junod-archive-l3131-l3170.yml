canonical_text:
  quote: ''
  summary: The passage describes reactions to glass bottles and the use of beads among
    Ronga/Thonga people. Women make beadwork ornaments, including the mugangu crown
    worn by girls for beautification in love-making, necklaces, bracelets, anklets,
    heavy dancing belts, and bead-covered objects. It gives particular attention to
    the decorated tobacco pouch, made from hollow seeds and used in exchanges of snuff
    before conversation or dispute. The passage states that beads are generally ornamental
    and not ritual, except for large white beads used by people possessed by Ba-Ndjao
    spirits.
  language: English
  quote_policy: summarized
