canonical_text:
  quote: The beer is the hyena. It kills the soul!
  summary: The passage argues for prohibition of European liquor and discusses mission
    regulation of Native beer. It reports a 1908 Shiluvane Synod in which delegates
    confessed that supposedly light beer had become strong beer and described beer
    as a hyena or wild beast that kills the soul. The passage then turns to Thonga
    cattle breeding, describing cattle decline after raiding and disease, cattle ownership
    and care, early pasturing so oxen may eat dew, seasonal fodder practices, bull
    castration and breeding, bull fighting, and bull names.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The author argues that total prohibition of European liquor and similar products
    is presented as the only chance of salvation for the Natives.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes byala, described as strong beer, from buputju, described
    as light beer, while noting difficulty in drawing a clear boundary between them.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Christian congregations generally prohibit byala; some missions exclude buputju,
    while others allow it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Delegates at a 1908 Synod in Shiluvane confessed that they had deceived their
    leaders by drinking byala while calling it buputju.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The delegates described beer as a hyena and wild beast that kills the soul
    and the work of salvation, and called for a knife to cut the wild beast's throat,
    glossed by the author as strict regulations against drunkenness in the Church.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that oxen were plentiful in Thongaland before the Zulu invasion,
    were stolen and killed by Ba-Ngoni warriors, and were later reduced by cattle
    plague and Texas Fever.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Any numzane can possess a cattle kraal and may keep both his own cattle and
    neighbors' cattle entrusted to his care.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: When a numzane looks after neighbors' cows, the milk is his and, according
    to custom, he receives one of the calves.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Herding-boys are expected to take cattle to pasture early in the morning while
    dew is still on the grass, because Natives believe the dew helps fatten cattle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage describes fodder practices including sending boys to nourishing
    grasses, burning parts of the bush after grass dries, and allowing oxen into gardens
    after harvest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Most bulls are castrated, but one or two are kept in each herd for breeding;
    these breeding bulls are described as generally tame.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Boys sharpen bulls' horns, excite bulls of different herds to fight, pour
    live ants on their foreheads to irritate them, and give them names.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Several bull names are listed, and the author says many are suggested by the
    animals' coloring; he also says he has not heard Thonga cattle praise songs like
    those among the Ba-Suto.
  category: speech
  evidence_refs:
  - ev:8
