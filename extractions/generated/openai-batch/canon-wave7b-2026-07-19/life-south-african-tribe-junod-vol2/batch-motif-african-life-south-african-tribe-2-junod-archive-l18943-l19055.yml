canonical_text:
  quote: ''
  summary: 'The passage surveys Thonga divination and presages: bad and favorable
    omens, simple lots, a philter used in court, ecstatic diviners who identify hidden
    things or wizards, and Tumben’s Small Mug and Small Calabash oracles, whose efficacy
    is linked to initiation, incisions, and inoculated medicine.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Divinatory practices are described as extremely common among the Thonga, and
    the desire to know the future is said to underlie both presages and divinatory
    practices.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Presages are divided into objects that foretell bad luck and objects that
    announce favorable outcomes, especially happiness and meat.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Named bad omens include falling stars, a snail encountered on the road, cuscuta
    stem, nibonga bee, mistletoe, puff-adder, liknre snake, a long-legged bird, buwumati
    snake, and nkangu bird.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The snail on the road is said to foretell a relative’s death; the liknre snake’s
    blowing or bite is linked with becoming thin and grey; the long-legged bird foretells
    misfortune on the road.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Good-omen objects include beetles named Eccopteptera, Mutilla, and especially
    Bombolosi; Bombolosi drops to the ground and counterfeits death when touched or
    frightened.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bombolosi is explicitly called a symbol of riches and is hung on a string
    at the door or in the hair.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Pshapsha is performed with pieces of grass or sticks of different lengths,
    and the chosen longer or shorter piece determines a previously decided course
    of action.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Mondjo is described as an enchanted philter used in court procedure to obtain
    evidence, especially to discover wizards and adulterous women.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Divination by ecstasy is employed by the magician when “smelling out” wizards;
    such diviners are called shinusa.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A reported shinusa could describe an unseen goat and identify the place where
    something had been buried to test him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: In Tumben’s Small Mug method, a horn placed in a wooden mug moves to and fro
    if the diviner has guessed correctly and remains quiet if not.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In Tumben’s Small Calabash method, rags attached to the calabash move when
    the oracle agrees and stop when commanded to keep quiet.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Tumben’s divinatory power is attributed to hand incisions, inoculated medicine,
    instruction by Shitakule, and initiation; uninitiated persons cannot make the
    calabash rags or mug horn move.
  category: sequence
  evidence_refs:
  - ev:11
