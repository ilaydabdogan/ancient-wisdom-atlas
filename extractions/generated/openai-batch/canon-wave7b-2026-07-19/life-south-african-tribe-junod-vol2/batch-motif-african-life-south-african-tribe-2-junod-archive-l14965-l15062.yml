  quote: ''
  summary: The passage describes Mankhelu's battlefield mhamba using a bundle of grass
    to enact and pray for the enemy's dispersal, then explains mhamba and offerings
    as ritual means of connection with gods or ancestral spirits. It then outlines
    Thonga terms for prayer, the usual sequence of consecration, invocation, request,
    and occasional scolding or insulting of gods during crises.
