canonical_text:
  quote: ''
  summary: 'The passage classifies several Thonga religious conceptions: the nuru
    as a semi-spiritual principle of slain people or animals that can avenge killing;
    hidden virtues in natural things known or controlled by ritual specialists; occasional
    personification of sea and bush fire; Heaven/Tilo as both being and power; and
    Ancestrolatry alongside a Deistic conception of Heaven. It also notes the lack
    of temples, priests, and fixed worship days, and contrasts this with the reality
    of ancestor religion among the Thonga.'
  language: English
  quote_policy: summarized
