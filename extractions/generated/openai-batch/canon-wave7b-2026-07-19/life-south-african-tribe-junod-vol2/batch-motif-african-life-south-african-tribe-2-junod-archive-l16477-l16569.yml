  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: When internal medication does not suffice for gonorrhea or haematuria, roots
    are calcined and pulverized, mixed with ox paunch fat, rolled into a ball, placed
    on red-hot embers, and applied by exposing the affected part to heat and smoke.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Fever is said to have no special name and is called feeling one’s head or
    having the body hot.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: People with fever lie on the ground in the burning sun, wrapped in a blanket,
    to perspire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Mankhelu recommends cooking the root of Mbalatangati in a small pot and drinking
