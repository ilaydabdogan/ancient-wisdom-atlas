canonical_text:
  quote: The first two beans are used to "try the earth"
  summary: The passage describes Thonga medical treatments for haematuria, gonorrhea,
    fever, consumption, leprosy, lack of milk, sterility, and smallpox, including
    herbal drugs, boiled beans, throwing pierced beans over the shoulders, smoke and
    heat applications, inhalation through reeds, plant and animal ingredients, sexual
    restrictions, lactation remedies, fertility treatment, and inoculation against
    smallpox.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A packet for treating haematuria contains six named drugs and is boiled in
    a pot with beans before the packet is removed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The haematuria patient pierces two beans with a thorn and throws one over
    the left shoulder and one over the right shoulder, then swallows a third bean.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The two thrown beans are described as being used to “try the earth,” meaning
    to propitiate evil influences in the soil thought likely to have caused the illness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A second part of the haematuria treatment uses pounded large white tubers
    squeezed into a jar; the patient drinks this sweet medicine and the bitter packet
    broth every evening.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Dr. Kokolo’s haematuria treatment uses named plants taken as a tisane, roasted
    on a brazier, inhaled as smoke through a hollow reed, and ground as powder mixed
    with ordinary food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: For haematuria, the wife of a married male patient has to undergo the same
    treatment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Gonorrhea is treated with named plants, sometimes with Shimbyati added as
