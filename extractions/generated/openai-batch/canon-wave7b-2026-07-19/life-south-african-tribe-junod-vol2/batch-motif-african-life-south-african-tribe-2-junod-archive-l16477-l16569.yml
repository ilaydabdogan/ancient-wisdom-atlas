  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The available taxonomy includes fire as a symbol but no specific healing-smoke
    motif family.
- id: motif:4
  label: Spouse shares treatment for a patient’s illness
  taxonomy_refs: []
  basis: For haematuria, a married patient’s wife is required to undergo the same
    treatment as the patient.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states the rule but does not explain why the spouse is treated.
- id: motif:5
  label: Resemblance-based or property-based medicine
  taxonomy_refs: []
  basis: 'The passage gives rationales or ingredient choices based on perceived properties:
    gnu fat is said to dry the chest because it is dry and cannot melt, and a milky
    plant is given to a nurse without milk.'
  evidence_refs:
  - ev:5
  - ev:7
  confidence: medium
  cautions: The term describes an inferred pattern from stated examples; the passage
    itself does not name a theory of medicine.
- id: motif:6
  label: Odour-mediated restoration of animal nursing
  taxonomy_refs: []
  basis: A calf is smeared with a pleasant-smelling herb so the cow smells it and
    allows the calf to suckle.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This is an animal-care remedy, not necessarily a mythic motif.
- id: motif:7
  label: Fertility treatment through bodily closure and rite
  taxonomy_refs: []
  basis: The sterility treatment is said to close the woman so that she no longer
    has tihweti and can conceive, and it is paired with the horola or hondlola rite.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The rite is named but not described in this passage, so its ritual details
    remain unavailable here.
- id: motif:8
  label: Controlled exposure to disease matter to mitigate disease
  taxonomy_refs: []
  basis: Smallpox virus is inoculated to reduce virulence, though the passage reports
    severe outcomes and no immunity in at least one later case.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage frames this as medical practice rather than mythic narrative.
