- id: motif:2
  label: Healing through ingestion of bitter and sweet prepared medicines
  taxonomy_refs: []
  basis: The haematuria patient drinks both a bitter packet broth and a sweet tuber
    juice every evening, while other treatments also involve tisanes, roots, or prepared
    plant medicines taken with food or water.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:7
  - ev:8
  confidence: high
  cautions: The motif is descriptive and does not imply a symbolic opposition unless
