canonical_text:
  quote: ''
  summary: The passage describes family offerings at the gandjelo, a household altar
    or place of worship, including pot, grave-mug, and forked-branch forms; regular
    offerings of tobacco, cloth, and liquids; occasional offerings after dreams or
    for safe return of beer jars; a taboo on looking back after offering; and more
    formal sacrifices ordered by divinatory bones and accompanied by sacramental tsu.
  language: English
  quote_policy: summarized
