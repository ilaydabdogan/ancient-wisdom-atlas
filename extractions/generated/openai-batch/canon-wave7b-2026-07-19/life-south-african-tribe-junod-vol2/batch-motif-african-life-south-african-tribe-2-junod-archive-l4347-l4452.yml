canonical_text:
  quote: ''
  summary: 'The passage records remembered trade at Delagoa Bay and inland: early
    foreign whalefishers trading from offshore, later Moslem merchants with raised-stern
    vessels, Ba-Ronga and related groups acting as intermediaries, organized commercial
    expeditions with leaders, carriers, contracts, rewards, risks, taboos, an omen
    bird, charms, and road songs asking to return home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first remembered White traders stayed offshore, gave whale flesh to the
    Makaneta people, and were met in the Bay by Ba-Ronga on rafts made from tied tree
    stems.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The trade was called Godji; Blacks and Whites did not understand each other’s
    language but communicated by gestures, and Natives obtained metals such as brass,
    iron hoes, and copper pieces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Natives were uncertain who the first strangers were but associated the name
    Ba-Godji with English people.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Moslems are remembered as arriving with raised-stern vessels called mapangayi,
    landing, learning to speak with Natives, and beginning regular commercial exploitation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: These traders used Natives to barter ivory and skins from the interior for
    hoes, beads, clothing, and later powder and bullets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ba-Ronga of Delagoa Bay acted as intermediaries between Whites and interior
    tribes; Mpfumo-Nondwane, Mabota, and Hlanganu people are named as especially involved.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hlanganu commercial travellers were associated with an assagai used for peaceful
    travel rather than fighting, and with the idea of buying the road or paying to
    pass.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A commercial company, called mpfumba, was normally led by a ndjilashi, the
    master of the expedition; Banyans entrusted him with goods, and he found carriers
    who shared in profits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The value of entrusted goods could be represented by mealie cobs kept by both
    the Banyan and ndjilashi; the cobs could be recounted if a dispute arose.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Independent Thonga expeditions after Kimberley were abandoned because the
    Ngoni of Muzila often robbed them; trading for White men was considered safer.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Travellers were told not to take salt, sharpen assagais on the road, or pluck
    milala leaves on an outbound journey.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A crane-like bird called mampfana, named the preventer of the voyage, could
    make travellers return home if it crossed the road with wings spread, because
    it signaled danger of death.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The flesh of the mampfana bird was used in charms taken by travellers, and
    the bird was said to warn them when the road was not clean.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Road songs were sung by or about traders; one song has tired carriers asking
    their leader to let them return home and uses the image of a female elephant not
    forsaking her young.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
