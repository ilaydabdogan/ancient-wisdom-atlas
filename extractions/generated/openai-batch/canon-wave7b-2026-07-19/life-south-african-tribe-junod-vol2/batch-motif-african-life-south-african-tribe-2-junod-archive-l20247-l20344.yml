canonical_text:
  quote: ''
  summary: The passage defines Thonga yila, or taboo, as an object, act, or person
    placed under avoidance because of danger. It classifies taboos into sympathetic
    prohibitions, physiological taboos connected with defilement and life-stage transitions,
    cosmic taboos affecting rain and communal welfare, and taboos of prevision that
    forbid premature preparation for future events.
  language: English
  quote_policy: summarized
