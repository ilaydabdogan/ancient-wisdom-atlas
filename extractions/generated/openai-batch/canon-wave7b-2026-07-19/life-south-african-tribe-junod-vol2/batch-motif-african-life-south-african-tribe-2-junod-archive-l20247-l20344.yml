  text: Sympathetic taboos are described as instinctive prohibitions observed to preserve
    life and avoid suffering.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Examples of sympathetic prohibitions include not touching a burning ember
    or fire, and a little child not playing with a knife.
  category: action
