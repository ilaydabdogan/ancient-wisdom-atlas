canonical_text:
  quote: "“Do not fear, Children of Heaven.”"
  summary: 'The passage describes Thonga customs concerning twins: protective treatment
    of twins during mourning, ritual curing of their mother, an explanation of twin
    birth as death and defilement connected with Heaven, rainmaking and thunderstorm
    practices involving twins or their mother, and clan variations in which twins
    may be feared, killed, or welcomed as fortunate.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: When twins visit for mourning, a gravedigger meets them at the village entrance,
    addresses them as “Children of Heaven,” and puts ashes on their heads and fontanelles.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated reason for the ash treatment is that twins are considered feeble
    and especially liable to be affected by defilement.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The fontanelle is identified in the passage as the “extremity of the tree
    of life” and is smeared with a preventive substance.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mother of twins prostrates herself near the deceased person’s hut, at
    the wall opening made for the corpse’s exit, while the gravedigger performs a
    curing action using embers, a broken pot, water, and hand pressure around her
    belly and waist.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother’s treatment is said to cure her “inside” and to prevent internal
    troubles because she has given birth to Tilo, Heaven.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage explains the birth of twins as a death and as the worst kind of
    defilement, followed by purificatory passage rites, seclusion, and later readmission
    to society.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The cause of the defilement is identified as Heaven, and the mother of twins
    is described as having made, carried, or ascended to Heaven.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The day after the birth of twins is a day of rest, and people do not till
    the ground because they fear it would prevent rain from falling.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In a rain custom, women sent to clean wells take a mother of twins with them,
    place her in a hole in the sacred wood of Libombo, and pour water from the wells
    over her until the water reaches her breasts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage states that wetting the woman of Heaven is intended to make Heaven
    itself wet and so make rain fall; it also says graves of twins and sometimes ancestor
    graves are watered for rain.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Twins are buried in damp places, and if buried in dry ground they may be exhumed
    during drought.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: When lightning threatens, people ask a twin to help because the twin is a
    Child of Heaven and can address Heaven; the child prays for the storm to go away
    and roar far off.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The mother of twins can also help during a thunderstorm because she is said
    to have ascended to Heaven and to be able to speak with it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: 'The passage notes clan variation: some tribes put twins to death, while in
    Tembe and Maputju twins are considered fortunate and women may desire twins or
    seek fat ointment from mothers of twins.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: In Tembe and Maputju, the hut is not burned, the mother gives birth behind
    the hut, re-enters through a hole in the rear wall, and the husband is excluded
    until the day of presentation to the moon.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: When the husband is readmitted, the wife hits his legs with a stick to cure
    him; the passage identifies hitting as often one of the rites of aggregation.
  category: action
  evidence_refs:
  - ev:10
