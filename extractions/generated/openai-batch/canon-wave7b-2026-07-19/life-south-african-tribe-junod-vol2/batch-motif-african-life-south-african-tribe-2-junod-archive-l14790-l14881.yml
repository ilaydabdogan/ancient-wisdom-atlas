canonical_text:
  quote: ''
  summary: 'The passage describes Thonga conceptions of offerings: domestic animals,
    living consecrated animals, rare human sacrifice in sacred woods for rain, field
    produce, beer, tobacco, clothing, ornaments, grave wealth, medicine calabashes,
    divinatory bones, and earth used by chiefs. It argues that the material value
    given to the gods is often small, because offerings function as ritual tokens
    of remembrance and duty rather than food actually consumed by spirits, and stresses
    that correct ritual procedure and divinatory indications determine acceptability.'
  language: English
  quote_policy: summarized
