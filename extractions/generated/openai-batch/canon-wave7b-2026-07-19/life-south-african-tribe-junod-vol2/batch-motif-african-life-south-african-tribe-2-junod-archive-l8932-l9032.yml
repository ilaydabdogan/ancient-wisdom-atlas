canonical_text:
  quote: ''
  summary: A maiden traveling with an ogre avoids bathing at several ponds by saying
    relatives died there. At the final pond near Mabayi, the ogre forces a bathing
    race, reaches the far side first, steals her clothes, and leaves her only his
    skin belt. Disguised in her clothing and human form, the ogre is welcomed as Mashomo's
    daughter, while the real maiden is treated as a servant or ogre and sent to scare
    birds in the fields. She sings softly of her former gentle upbringing, hides her
    royal teeth, bathes and eats apart, and uses a magic ring to obtain clothing,
    summon dead relatives and servants to dance and mourn, and produce food.
  language: English
  quote_policy: summarized
