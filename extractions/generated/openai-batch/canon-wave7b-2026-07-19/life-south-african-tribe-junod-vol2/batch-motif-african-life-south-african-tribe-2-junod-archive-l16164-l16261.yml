canonical_text:
  quote: ''
  summary: 'The passage describes Thonga medical practice as centered on nanga, or
    Native physicians, whose knowledge is often inherited from ancestors or relatives.
    It gives examples of practitioners with differing levels of competence and specialization.
    The most prominent example, Mankhelu, is described as a leading medicine-man and
    diviner who received medical knowledge from his maternal uncle in exchange for
    oxen. Each year his household renews medicinal roots: wives gather them, bones
    are consulted to choose who cuts them, and the roots are prepared into male and
    female medicines. The whole village participates by inhaling smoke; a goat is
    sacrificed; liquid and bukanye beer extinguish the burning drugs; and Mankhelu
    prays to his gods and to the ancestor who taught him, asking that the medicines
    gain strength and attract patients and gifts.'
  language: English
  quote_policy: summarized
