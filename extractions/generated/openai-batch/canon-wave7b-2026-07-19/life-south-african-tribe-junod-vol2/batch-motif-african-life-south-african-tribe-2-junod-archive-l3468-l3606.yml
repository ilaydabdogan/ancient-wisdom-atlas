canonical_text:
  quote: ''
  summary: 'The passage describes Thonga/Ba-Ronga pottery manufacture: clay sources,
    women’s role as potters, collection and preparation of clay, hand-shaping and
    decorating pots, firing and cooling, and ritual taboos or remedies intended to
    prevent cracked pots, including an innocent child lighting the furnace and offerings
    to gods after divination when failures persist.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies useful trees and clay beds as materials used by the
    Ba-Ronga/Thonga, with clay used for pottery.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shibindji is described as having excellent clay; its people are said to supply
    the country with pottery and to be masters of the art, but the art is not hereditary
    and may be learned by anyone.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pottery among the Thonga is described as essentially women’s province.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A mother who wants new pots collects clay from marshes, carries it on her
    head, is not greeted by others, and buries the clay at the foot of a tree to keep
    it moist.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Meta prepares clay by pounding a broken old pot fragment, mixing the fragments
    with clay, water, and sand, and kneading the mixture into a soft ball.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The potter hollows and shapes the clay by hand, decorates it with simple designs,
    protects the opening during drying, turns it over, smooths the bottom, and dries
    it in a hut.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: For firing, the potter places pottery in a sand hole, covers it with wood
    or palm pith, lights a quick clear fire, lets the utensils cool, inspects them,
    smashes cracked pieces, and paints the successful pots brown.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When women collect clay, only one woman digs and gives clay to the others;
    if each digs for herself, the passage says this would bring mishap and the pots
    would break.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A successful clay digger may be described as having a lucky hand and may be
    chosen to dig again.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: After clay is buried at the foot of a tree, it is taboo to tread on that place
    while walking through the village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the firing heap is ready, the potteress calls an innocent little child
    to set fire to the furnace; if the firing succeeds, she calls the same child on
    later occasions.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: If pottery failures continue, the woman may consult the bones and, if directed,
    make an offering at the altar to gods of the father, gods of the mother, or possessing
    gods.
  category: sequence
  evidence_refs:
  - ev:9
