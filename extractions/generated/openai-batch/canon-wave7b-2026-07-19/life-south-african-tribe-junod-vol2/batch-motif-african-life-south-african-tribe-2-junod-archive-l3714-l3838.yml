canonical_text:
  quote: ''
  summary: 'The passage describes several Ronga/Thonga baskets and utensils: the prized
    ngula basket, its construction and use as a household store of wealth and seed;
    the hwama/funeko traveller''s wallet and a round variety used by magicians; the
    shihundju conical basket associated with women''s transport and hospitality customs;
    and the lihlelo/ndjewane baskets used for winnowing and gathering food plants.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ngula is presented as the most prized Ronga basket and is made through
    a laborious process involving plaited dried grass, palm-leaf binding, concentric
    pierced rings, a fitted cover, paired handles, and hinge rings.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: A well-made ngula is described as impermeable, with no visible holes, and
    the author states that it might even hold water.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ngula is kept at the far end of the hut on a low table and holds valued
    goods such as seed grain, monkey nuts, and women's adornment materials.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hwama or funeko is a square plaited palm-straw bag used by travellers,
    with a cover attached to the carrying strap so that it slides open but cannot
    be lost.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A round horned variety called shiraba or baki is said to be used by magicians
    for carrying medicines and bones.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The shihundju is a conical basket used by women to transport maize, clay,
    and manure; women balance it on their heads, and when empty it may be turned upside
    down and used as a hat.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: When women travellers arrive at a friendly village, friends remove their shihundju
    baskets and set them in small holes in the sand; the passage calls this the first
    duty of hospitality among women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The lihlelo is used by cooks for winnowing maize, while a smaller similar
    basket, the ndjewane, is used by the housewife for gathering wild cucumbers and
    herbs.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The lihlelo is made from strips of roots of a tree called nukanhklo and coated
    with reddish-brown varnish prepared from mangrove bark.
  category: attribute
  evidence_refs:
  - ev:6
