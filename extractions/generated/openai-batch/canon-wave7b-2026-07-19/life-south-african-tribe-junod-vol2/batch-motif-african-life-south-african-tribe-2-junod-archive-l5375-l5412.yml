  summary: The author discusses arithmetic instruction in missionary schools, contrasting
    pupils' reported facility with memorized English weights and measures against
    difficulty with metric reasoning and arithmetic problems. The passage concludes
    with the author's claim that, in the Bantu mind, literary ability exceeds mathematical
    ability, and it mentions Shinangana as an example whose achievements are described
    as feats of memory rather than reasoning.
