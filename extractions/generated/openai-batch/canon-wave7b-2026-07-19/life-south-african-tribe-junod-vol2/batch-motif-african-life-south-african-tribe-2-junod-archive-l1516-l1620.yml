canonical_text:
  quote: ''
  summary: The passage describes Thonga preparation and regulation of palm wine from
    milala palms, including allocation of palm forests, tapping by shell, storage
    in a hidden gandjelo pot, and a taboo against drinking from the shell. It also
    describes honey gathering, artificial bee shelters, sugar-cane alcohol, and syrup-based
    alcohol, with notes on drunkenness, quarrels, and illicit sale.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Milala palm trees grow in forests in various places and are used to make palm
    wine called hitsura or busura.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The palm forest is divided by the chief among headmen, and each headman exploits
    the milala in his apportioned region, called fashi.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Palm-wine collection involves cutting the top of the palm, later cutting it
    on a slant, and tying on a sala shell to receive the exuding liquid.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The owner of the tree empties the filled shell into a calabash; when wine
    is abundant it may be stored in a large hidden pot called gandjelo.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The word gandjelo is explained as meaning an altar or utensil in which offerings
    are placed for ancestor gods, but the passage states that the palm-wine gandjelo
    does not seem to have religious meaning.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A traveller who finds the hidden gandjelo may regard it as good luck and say
    that his god has blessed him; he is allowed to drink from it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Touching or drinking from the shikutja shell is prohibited and described as
    taboo; a stranger who does so may be tied up overnight, taunted, and fined a goat
    or hoe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Honey is classified as a drink in the passage and is collected from holes
    in old trees or rocks despite the risk of stings.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Honey collectors use burning grass, smoke, and flame to keep bees away while
    gathering honeycombs into a pot.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Broken pots placed upside-down in the bush may attract bees, and the passage
    also notes invented bee hives in one region.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: Shiwayawaya is described as a sugar-cane drink made after observing White
    people distil rum; the process includes crushing cane, extracting liquid, warming
    barrels by a hut fire overnight, removing scum, and fermentation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Where shiwayawaya is drunk, the passage says quarrels and blows follow.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Shikokiyane is prepared from Golden Syrup in empty oil cans and is sold illicitly
    in compounds, especially on Sundays, despite regulations against drunkenness.
  category: action
  evidence_refs:
  - ev:8
