canonical_text:
  quote: ''
  summary: The passage describes Thonga accounts of possession, diagnosis by divining
    bones, specialist gobela treatment schools, and exorcistic rites including palmleaf
    waving, calabash ablution with foaming water, blood-drinking, hondlola, and a
    drum performance whose place and efficacy are determined by bones and shells.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nwashinhwana fled from home, threw herself into the Bay, regained her senses
    through contact with cold water, and was then declared by the bones to have psikweni.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mholombo heard a voice calling her in a dream; the voice was identified as
    a possessing spirit that later revealed itself as a long-dead chief.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mboza returned home in good health, was lame for six months, later lost his
    appetite, and almost ceased to eat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: While gathering juncus for mat-making, Mboza said the psikweni started in
    him; he returned trembling, entered a hut, rose suddenly, attacked villagers,
    ran away, was seized, and the spirits were said to be scattered.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage lists suspicious symptoms of possession such as chest pain, irrepressible
    hiccough, extraordinary yawning, and emaciation without apparent cause, but says
    bones must be consulted for diagnosis.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: For diagnosis, the patient's amulets, called his shade, are placed on a mat
    and bones are thrown near them; a second consultation can determine which doctor
    should treat the patient.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Specialists for this disease are called gobela; the passage says they are
    not proper nanga and that rival schools use somewhat different drugs and rites.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The former remedy consisted of waving a large palmleaf in front of the patient
    to scatter the spirits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The described treatment includes four principal rites: drum performance,
    ablution in the gobo calabash, drinking of blood, and the hondlola ceremony.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the gobo rite, a root is prepared and dipped in water in a large cut calabash;
    foam is produced, and the patient washes with it or sucks and spits some foam
    toward the four winds while saying tsu.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In Mboza's case, the calabash rite came after the drum performance.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: Before the drum performance, bones are consulted to decide whether the rite
    should take place inside the hut, in the doorway, on the village square, or in
    the bush.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The four Oliva and Cypraea shells must fall exposing their crack or mouth;
    this signifies that the possessing spirits will come out, while convex sides mean
    the rite will not work.
  category: object
  evidence_refs:
  - ev:7
