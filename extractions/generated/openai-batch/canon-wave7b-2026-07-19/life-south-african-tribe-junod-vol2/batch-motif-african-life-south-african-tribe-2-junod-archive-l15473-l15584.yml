canonical_text:
  quote: '"Mbelele ! Mbelele ! Let rain fall"'
  summary: 'The passage describes rites and taboos connected with the birth of twins:
    rain-invoking water rituals, purification of the mother and twins with water,
    drugs, and sacrificial goat elements, seclusion of the mother, rules against contagion,
    a severe rite for removing twin-birth defilement, early weaning of the twins,
    and hostile treatment of twins as troublesome “children of Heaven.”'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Women in Zihlahla assemble, go in the four directions to draw water from local
    lakes and wells in old calabashes, and sing the Mbelele rain song.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother sits with the two babies in her arms while the women throw water
    over her and repeat the same refrain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The water ceremony is said to begin removing the “misfortune of twin birth
    which is a death.”
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A magician gives the father and mother a drug kept in the Matimela family,
    and the mother puts some of it in a small infant diet-drink calabash.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Ktwsen, a medicine-man pours drugs mixed with a goat-sacrifice element
    on the mother’s shoulders while she holds the babies, then pours pure water so
    she can wash herself and the children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before the Ktwsen purification, no villager may eat, and on the following
    day field work is taboo because it would prevent rain from falling.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Among the Nkuna, the mother of twins sits at the hut entrance while drug poured
    over the roof leaks through the thatch onto her, purifying both mother and hut.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the preliminary purification, the mother lives in her own shelter outside
    the village, is shut off from other inhabitants, uses her own utensils, and cooks
    for herself.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The twins see no one except their mother; each twin is assigned one breast,
    always the same breast.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A girl must be “bought” to help nurse one twin; payment removes the taboo
    and defilement connected with a girl playing with a twin.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Women fear contamination through touching the mother’s belongings or sharing
    fat with her, believing they may also incur the misfortune of giving birth to
    twins.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The mother of twins must draw water only at a selected place and keep her
    head-wreath of grass separate from those of other women to avoid contaminating
    them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that the mother of twins is considered outside society,
    like a widow, but with worse defilement.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: According to the cited account of Mboza, the mother must deceive four men
    in the bush; the men sicken or die because they have taken her defilement, and
    divinatory bones designate them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: After each performance of the purification ceremony, the mother informs her
    medicine-man, who prepares a vapour bath for her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: The mother later resides at her parents’ house, has relations with a lover,
    bears another child, and is then brought home by her husband; a new hut and new
    utensils begin ordinary family life again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The twins do not undergo the presentation to the moon, are weaned earlier
    than other children, and are then fed with goat’s milk.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: People dislike twins, throw cinders at crawling twins who approach other huts,
    drive them away, and call them “children of Heaven.”
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: Badly behaved children are compared to twins in common sayings that describe
    twins as troublesome and unmanageable.
  category: speech
  evidence_refs:
  - ev:10
