- id: obs:3
  text: In the first act, all adults of the village go out into the bush and return
    to the square halting, limping, and dragging their limbs as if suffering from
    a walking complaint.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first-act lyrics mention looking for someone to apply leeches and describe
    a cursed lumbago or complaint that prevents walking and field work.
