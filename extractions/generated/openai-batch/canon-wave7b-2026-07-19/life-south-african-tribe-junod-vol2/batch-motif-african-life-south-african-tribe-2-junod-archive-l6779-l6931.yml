canonical_text:
  quote: It is almost a theatrical production, and we might rightly call it the Shirindja
    comedy.
  summary: The passage describes a Ronge/Shirindja performance explained by Shigiyane,
    a former soloist. The song-comedy is organized into five parts. The first act
    shows adults returning from the bush as limping old people who sing of lumbago
    and a need for leeches. The second act dramatizes a son-in-law expelling his smallpox-stricken
    mother-in-law, while the daughter laments the cruelty. The third act presents
    a dialogue between Gebuza and Mahlahlane that turns into meaningless verbal play
    followed by silent dancing and contortions. The fourth act begins with all actors
    re-entering and starting hand-clapping accompaniment.
  language: English
  quote_policy: quoted
