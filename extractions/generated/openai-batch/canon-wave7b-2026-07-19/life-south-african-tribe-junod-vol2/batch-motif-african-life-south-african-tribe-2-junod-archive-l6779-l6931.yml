  evidence_refs:
  - ev:3
- id: obs:6
  text: The second act tells of a son-in-law who turns his smallpox-stricken mother-in-law
    out of his house, and she goes into the bush to die.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The daughter’s part, sung by the chorus, expresses pity at smallpox ravaging
    the face and says that kindness among relatives has ceased at Mpatshiki.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The third act introduces Gebuza, a man of Nondwane who took refuge in Shisindja,
    was beloved by Mpatshiki, was a great dancer, and was said to speak at length
    with little meaning.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Gebuza and Mahlahlane conduct a dialogue that begins with an invitation to
    dance and then becomes a sequence of largely meaningless remarks.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the unintelligible dialogue, the whole company dances in silence and
    performs various contortions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the fourth act, all actors re-enter and begin shiombtlane, a hand-clapping
