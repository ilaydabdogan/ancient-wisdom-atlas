canonical_text:
  quote: ''
  summary: Mabayi spies on a maiden who bathes, puts on beautiful clothing, dances,
    and summons food. With his niece's timing advice, he catches her and identifies
    her as Mashomo's daughter despite her denial. She explains that she hides her
    appearance with mud and skins because the ogre would kill her if he saw her in
    fine clothes. Mabayi and others then maneuver to clothe the maiden, lure the ogre
    away, and prepare a concealed hot-grease pit covered with matting and baited with
    food.
  language: English
  quote_policy: summarized
