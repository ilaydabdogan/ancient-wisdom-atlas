canonical_text:
  quote: ''
  summary: The passage discusses Thonga ideas about human-animal transformation in
    tales and magic, a feared red antelope whose road-crossing is a travel omen requiring
    a rite, and origin traditions in which first humans or tribes emerge from a reed
    or reed-marsh. It also records named first ancestors, footprints from an early
    soft earth, and Ronga ancestral names associated with fire and cooking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tales are said to contain men changed into hyenas, lions, and similar animals,
    but the passage states that such tales are treated as fictitious and that ordinary-life
    transformation is not generally accepted.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the domain of magic, magicians are described as claiming that they can
    fly in the air with an axe, transform themselves into a lightning bird, and kill
    an enemy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wizards, called baloyi, are described as especially credited with the power
    to change human beings into beasts so that they may work for them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The little red magulwe or shipeni antelope is an object of superstitious fear,
    and its astragalus bone is used in divination under the name malumbi.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: When this antelope crosses in front of a travelling party, the leader stops
    the group, goes to the crossing place, sits alone, and pours magical powder into
    the animal's footprints.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After walking for a time, the leader removes all clothing, lies naked as if
    dead, then runs through the bush ahead of the party and sits farther along the
    road; the passage says this rite prevents the antelope's misfortune.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: One origin version says the first human beings came out from the lihlanga,
    the reed; another says they came from the nhlanga, the marsh of reeds.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: In one version, one man and one woman suddenly came out from a reed which
    exploded.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In another version, men of different tribes emerged from a marsh of reeds,
    each tribe already having its own costume, implements, and customs; the Venda
    are given as an example with iron hoes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Northern clans, the first man and woman are called Gwambe and Dzabana,
    and their names are used when expelling disease or sending tales away before sleep.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Legends of old migrations mention the Road of Gwambe, where ancient people
    passed while the earth was not yet solid and left prints of feet and mortars in
    rocks near the river Hlantsabuhlalu.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the Ronga clans, the two ancestors are called Likahi hamba and Nsilambowa;
    Likahi hamba is glossed as one who brought a glowing cinder in a shell and as
    originator of fire, while Nsilambowa is glossed as one who grinds vegetables.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that, according to these Ronga names, the first human beings
    would have introduced fire and culinary art into the world.
  category: other
  evidence_refs:
  - ev:8
