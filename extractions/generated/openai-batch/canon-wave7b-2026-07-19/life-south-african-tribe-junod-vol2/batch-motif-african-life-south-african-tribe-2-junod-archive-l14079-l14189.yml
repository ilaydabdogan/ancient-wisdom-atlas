canonical_text:
  quote: ''
  summary: The passage reports a prayer to an ancestor-master of the land, describes
    Thonga beliefs about divinatory bones and ancestor-gods, gives examples of blessings
    and misfortunes attributed to those gods, and introduces means of propitiation
    through offerings, sacrifices, and a root-and-goat rite. It closes with a classification
    of offerings by social scope, sacramental status, bloodshed, and regularity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nkolele is questioned about whether his account is fact or fancy, and he answers
    that it is an undoubted fact and a great truth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A prayer addresses Mombo-wa-Ndlopfu as master of the land and recounts a succession
    in which the land is given from father to son through named descendants.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The praying speaker presents an offering and asks the ancestor for trees,
    including palm trees and trunks suitable for canoes, and asks that trunks not
    fall on and crush people cutting them in the marsh.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A set of divinatory bones is called the bula, or Word, and is cast on every
    occasion.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Thonga are described as believing that by means of the bones they know
    what their gods think and wish.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The diviner is said in most cases to think his divinatory power comes from
    a dead relative who formerly cast lots and transmitted a spirit of interpretation
    to him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says the existence of the village and clan and the welfare of
    clan members depend on the gods.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The gods are described as masters of earth, fields, trees, rain, men, children,
    and wizards, with power to kill or make alive and to enrich or make poor.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Blessings attributed to the gods include fruit-bearing trees, plentiful crops,
    a pot of palm wine, escape from battle, and rescue from drowning or injury.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Misfortunes attributed to the gods include failed rain, a falling tree, a
    crocodile bite, fever and delirium in a child, sterility, disease, and other calamities.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Other sources of misfortune, such as baloyi and Heaven, are mentioned, and
    the bones are said to show who caused the mischief.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Ancestor-gods are called the most powerful spiritual agency acting on human
    life, creating a need to propitiate them by prayers and sacrifices.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Mankhelu uses roots exposed by a swollen river because the gods are said to
    be in the earth and things found in the earth can influence them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Mankhelu cuts the roots, cooks them with goat flesh, drinks the broth, smears
    the goat-killing assagai with root powder, and uses the goat astragalus on the
    body according to paternal or maternal ancestry.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Most propitiatory rites are described as religious acts intended to influence
