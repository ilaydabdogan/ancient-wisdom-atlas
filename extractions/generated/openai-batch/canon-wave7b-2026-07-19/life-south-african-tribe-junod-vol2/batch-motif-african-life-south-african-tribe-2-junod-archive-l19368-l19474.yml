literal_observations:
- id: obs:1
  text: Pieces of tortoise shell in Mankhelu's basket designate village peace or misfortune,
    prosperity or starvation, according to how they fall.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oliva shells are explained as representing male attributes, while Cypraea
    shells are explained as corresponding to female attributes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Two abnormal nkanye stones are classed as female and male according to whether
    a woman or a man found them, and they represent the vegetal world, especially
    medicines and drugs.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: A small nkanye twig was cut by a girl of Mankhelu's village when he visited
    maternal relatives to make a sacrifice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A stone found in a crocodile stomach is said often to represent mourning or
    defilement.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A patterned 'stone of diamond' found on the road or in distant lands means
    luck, money, riches from foreign countries, or gold from the soil.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pieces of white china and a sewing-machine shuttle are cited as objects used
    by diviners to represent Whites, but they are described as newer additions, not
    old set contents.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says Mankhelu's and Spoon's explanations show remarkable uniformity,
    while also noting differences attributed to diviners' imagination.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Spoon explained the wild pig as indicating ancestor-gods or old relatives
    near becoming gods, and the duyker as indicating the wizard and the traveller.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Divinatory objects have determinate meanings but may also designate other
    objects through perceived similarity between animals and those objects.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Before throwing the bones, Mankhelu removes supernumerary objects, holds the
    bones between his hands, chews an odoriferous root, spits on them, and throws
    them on a mat while saying 'Mamoo'.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: During a consultation for others, people sit near the mat, may let the consulter
    throw the bones, answer with an assent formula, and look at the scattered bones
    to learn what has been revealed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: If the fall of the bones does not correspond to the case, the bones are thrown
    again, and the diviner may move to another place until a clear answer is obtained.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The reading examines the side on which objects fall, their direction, their
    disposition relative to one another, and relations between male and female bones.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Objects showing the convex side are described as full, standing or marching
    forward, and this is called the positive side.
  category: attribute
  evidence_refs:
  - ev:11
