canonical_text:
  quote: ''
  summary: The passage describes a Hlengwe fishing rite in which a little boy and
    girl lie quietly together under a lion skin as if married, so that fish will remain
    quiet; after fishing they are awakened, rewarded with part of the catch, praised,
    and thanked. The author connects this rite to sexual abstinence during hunting
    and fishing and to an animistic link between human behavior and animal behavior.
    The passage then summarizes meat preparation, eating animal blood, a rule for
    eating funeral sacrificial meat on the road, famine foods and famine memories,
    a reported saying that grasshoppers announce Gungunynne's armies, cases of famine-related
    cannibalism and cave ambushes, and a transition to the chapter on Thonga industry.
  language: English
  quote_policy: summarized
