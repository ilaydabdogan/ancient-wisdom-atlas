  summary: The passage records Thonga proverbial riddles and two-part enigmas, explains
    the psitekatekisana guessing game and its formulae, names collectors and informants,
    and gives examples whose explanations concern water, nature as maker of heaven
    and earth, small causes with large effects, deliberation, marriage exchange and
    loss, household disorder, debt, and comparisons between sounds and anger.
  language: English with Thonga terms and riddle formulae
  quote_policy: summarized
