- id: motif:2
  label: Totemic representation borrowed from a neighbouring tradition
  taxonomy_refs: []
  basis: The ox bone and hoof represent the Nkuna buffalo totem, but the passage explicitly
    says this custom was borrowed from the Suto-Pedi and is not normally part of Thonga
    divination.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is based on the narrator's statement within the passage and is not
    independently corroborated here.
- id: motif:3
  label: Departed spirits swallowed by earth and returning to divine life
  taxonomy_refs:
  - death_rebirth
  basis: Shikwembu, a mhala astragalus recovered from hyena dung, represents departed
    spirits; the passage compares the bone swallowed by the hyena to the dead swallowed
    by earth who come again to light and life in a new divine existence.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage presents a symbolic explanation, not a full narrative of death
    and rebirth.
- id: motif:4
  label: Rain obtained through divination, offering, and sacrifice
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The malumbi bone is watched in rain divination; a mild fall means Heaven
    is open and rain will fall, after which Mankhelu offers leaves and may sacrifice
    a black ram if required by the chief.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage describes ritual procedure and sign-reading, not a complete
    mythic story about rainmaking.
- id: motif:5
  label: Subterranean animals as signs of ancestors and death
  taxonomy_refs: []
  basis: The hyena and ant-bear bones signify ancestor-gods because the animals hide
    or dwell in holes and are linked with graves or the earth; the ant-bear also signifies
    the power of death because it digs the grave.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: This motif is inferred from repeated symbolic explanations within the
    divinatory system, not named as a motif by the passage.
- id: motif:6
  label: Predatory animal imagery for chiefly power
  taxonomy_refs: []
  basis: The chief is represented by lion, hyena, ant-bear, and malumbi imagery; the
