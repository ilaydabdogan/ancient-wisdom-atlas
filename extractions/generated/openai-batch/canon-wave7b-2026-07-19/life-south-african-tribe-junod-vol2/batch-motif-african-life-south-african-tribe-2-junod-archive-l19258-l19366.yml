canonical_text:
  quote: ''
  summary: The passage describes objects and animal bones in Mankhelu's divinatory
    set and explains the social, spiritual, and ritual meanings assigned to them.
    Ox objects are linked to a neighboring totemic custom; antelope, boar, baboon,
    lion, panther, hyena, ant-bear, and other bones represent chiefs, wives, fighters,
    wizards, medicine-men, villages, rich people, ancestor-gods, death, Heaven, enemies,
    and rain signs. A special bone found in hyena dung represents departed spirits,
    and the malumbi antelope bone is watched in rain divination, after which offerings
    or a black ram sacrifice may be made.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Mankhelu''s divinatory set includes two objects taken from an ox: a smooth
    oval bone and a decorated hoof; both are said to represent the Nkuna tribe and
    its buffalo totem.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the ox-totem objects are a custom borrowed from the
    Suto-Pedi and that bones corresponding to totems are not normally found in Thonga
    divination unless influenced by Pedi neighbours.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: After domestic animal objects, the set includes astragali and other bones
    from wild animals.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Several antelope bones are assigned social meanings: male mhala means chief,
    female mhala means the chief''s wife, male mhunti means fighting men, female mhunti
    means women of loose character, and reed buck means wizards.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A forest-dwelling antelope bone designates a chief who remains in his hut
    and avoids toil and heat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wild boar astragalus represents the medicine-man who searches for roots
    to prepare drugs, while the female wild pig represents the medicine-man's wife.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Male, female, and young baboon astragali symbolize the village because baboons
    are described as returning and not leaving their habitations permanently.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The lion phalanx represents the chief of the tribe and can also designate
    White people, while the panther astragalus represents rich people, chiefs, and
    White people who can choose their food.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The hyena astragalus has several stated meanings: counsellors, sycophants,
    parasites, wizards, ancestor-gods, and the chief himself.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The ant-bear astragalus, or in one case a claw, signifies ancestor-gods, the
    power of death, and the chief, with explanations involving holes in the earth,
    grave-digging, and the chief putting earth to his mouth in sacrifice.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The bone called Shikwembu is a worn mhala astragalus found in hyena dung and
    is said to represent the spirits of the departed.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: 'The passage explains Shikwembu by analogy: the departed have been swallowed
    by the earth as the astragalus was swallowed by the hyena, but they come again
    to light and life in a new divine existence.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The malumbi antelope astragalus represents violent things, including the chief,
    the enemy, and especially the mysterious power of Heaven.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: In rain divination, when malumbi falls in the mild position, it is interpreted
    as Heaven being open and rain about to fall; Mankhelu then presents a rain offering,
    and, if required, a black ram is sacrificed.
  category: sequence
  evidence_refs:
  - ev:10
