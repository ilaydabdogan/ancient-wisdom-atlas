canonical_text:
  quote: ''
  summary: The section argues, from the author's colonial-era viewpoint, that older
    beer-drinking customs were episodic because brewing took nine days, while colonial
    liquor commerce made daily intoxication possible. It describes rum and adulterated
    wine sales, bars around Lourenço Marques and Majlanganen, public drunkenness,
    deaths and incapacity among chiefs including Shongele, disease spread, a merchant's
    cynical statement about alcohol, and alleged economic and labor harms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage discusses alcohol use among South African Bantu/Black populations
    in rural, urban, and labor-compound settings, including Lourenço Marques, Majlanganen,
    and Johannesburg.
  category: setting
  evidence_refs:
  - ev:1
  - ev:3
  - ev:8
- id: obs:2
  text: The narrator states that beer-drinking parties were old in the tribe and that
    traditional brewing took nine days, creating intervals of sobriety between drinking
    occasions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator contrasts older intermittent drinking with places where liquor
    sale is not prohibited, saying people can buy liquor daily and become repeatedly
    intoxicated while they have money.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports German rum and later 'Vinho colonial' being sold, and
    cites E. Torre do Valle's description of the latter as an adulterated mixture
    with pungent additives and little natural wine.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A storekeeper is reported as refusing the mixture to a White customer and
    saying it was for Native customers rather than White customers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Majlanganen bars on Saturday night or Sunday, the passage describes women,
    men, and youngsters dancing on the road, falling on the ground, and spending their
    last money on drink.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports that the young chief Shongele died from delirium tremens,
    and that other chiefs and subchiefs were half drunk, unable to preside over court
    or govern, and begged visitors for brandy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator links drunkenness with sexual commerce and syphilis, citing medical
    authority for widespread contamination near Lourenço Marques and describing movement
    of disease into the interior.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A merchant in Lourenço Marques is quoted as saying that if Native people were
    given as much alcohol as they liked, they would soon be gotten rid of.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage argues that alcohol spending displaces purchases of clothing,
    better food, ploughs, livestock, and other goods, and reduces work capacity.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The passage says Johannesburg mine managers found a third of their Black workers
    intoxicated and unfit to go down into the mine, after which liquor sales in compounds
    were stopped.
  category: action
  evidence_refs:
  - ev:8
