canonical_text:
  quote: ''
  summary: 'The passage describes Thonga fishing practices: tidal and river traps
    with inauguration sharing ceremonies, rules and taboos for trap construction,
    and the communal tjeba fishing of drying lakes. It details summons, equipment,
    offerings for abundance or protection, taxation by chiefs, distribution across
    regions, and special rites when crocodiles may be present.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The nhangu is described as a triangular stick enclosure on the seashore with
    a seaward opening; the tide brings sea creatures into it and leaves them trapped
    when it retires.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who builds a nhangu pays a tax to the chief; on the inauguration day
    all inhabitants may share the first fishing, and the owner may not take fish home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The shibaba is a woven-reed trap placed along a riverbank where the tide reaches;
    its construction is governed by rules including sexual abstinence, the owner cutting
    the first reed, women not approaching the spot, and an inauguration luma ceremony.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tjeba is described as killing fish together in drying lakes at the end of
    winter, when fish are concentrated in smaller spaces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The chief orders men to make shiranga baskets from ntjangari, and a messenger
    is sent to villages with a public summons.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Male members of the tribe are expected to answer the summons; refusal brings
    blame, a mocking song, and domestic scolding with plain mealie pap.
  category: relationship
  evidence_refs:
  - ev:6
