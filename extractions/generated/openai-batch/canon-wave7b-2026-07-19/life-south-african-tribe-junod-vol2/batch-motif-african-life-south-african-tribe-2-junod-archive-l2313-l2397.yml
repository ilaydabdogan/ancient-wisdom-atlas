canonical_text:
  quote: ''
  summary: The passage describes variant Thonga/Ronga explanations of hunting rites.
    It presents lurulula as a rite protecting hunters from the dangerous vital principle
    or vengeance of slain animals, or as identification with the animal world, or
    as quieting other hippopotami and countering baloyi spirits. It then describes
    luma, a first-mouthful rite for game meat, including a hippopotamus hunter eating
    diaphragm underwater, communal eating of neck flesh with medicine, foot-smearing
    or ember use, and related taboos. It also describes the thokoyi/shimemo clan shout
    after killing a large animal and defines psinyama-nyamana as small meats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Information on animal rites is attributed to a Ronga informant from the Coast
    and to Mankhelu and Viguet of the Northern clans, with the author noting differences
    between parts of the tribe.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some animals are said to possess a vital principle or spiritual entity that
    escapes after the animal is pierced and creates danger for the hunter who killed
    it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The lurulula rite is described as taking away or washing away danger and freeing
    hunters from the vengeance of the slain animal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: For the Ronga, lurulula is described as a means of identifying the hunter
    with the animal world so that he can live in its midst without being noticed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the hippopotamus explanation, lurulula is said to quiet other hippopotami
    and overcome baloyi spirits, described as wizards who enslave beasts and use them
    as mounts at night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: Luma is described as a rite that removes a food taboo at the first mouthful
    and is necessary in the case of game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The hunter who transfixed the hippopotamus first performs luma by taking a
    piece of the diaphragm into his mouth, plunging into the river, and eating it
    under water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: After the primary hunter, his sons and village inmates perform luma with flesh
    from the hippopotamus neck, called shipelo, which is described as the place associated
    with the animal pushing mud and as the seat of its strength.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The neck flesh is mixed with mbangulwa medicine, and men, women, and children
    stand in a line and eat some of it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: A portion of the hippopotamus is set aside for the chief, the animal is heavily
    taxed, and everyone later receives flesh and performs luma by smearing the sole
    of the foot or by mixing a live ember with the meat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The stated purpose of luma is to remove the danger of eating unfamiliar meat,
    which might hate the eater and cause colics.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: Luma is stated to be necessary for elephants when eating the meat for the
    first time, but not for lions or panthers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The thokoyi or shimemo is a loud shout given when a big animal has been killed,
    calling fellow clansmen to help master and share the beast.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: The clan shout also excludes men of other clans and helps prevent fighting
    or dispute over possession of the animal; the cry differs by clan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Psinyama-nyamana is explained as a triple diminutive derived from nyama, meaning
    lesser meats from small animals.
  category: attribute
  evidence_refs:
  - ev:6
