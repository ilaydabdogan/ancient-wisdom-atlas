  summary: The passage compares Bantu funeral rites, especially the burial of Sokis,
    with a Mousterian burial from Abri du Moustier; it then discusses the relation
    between ancestral worship and belief in a Supreme Being, including Thonga uncertainty,
    Swazi and Zulu accounts of ancestor mediation, and the author's comparison with
    medieval saint veneration.
