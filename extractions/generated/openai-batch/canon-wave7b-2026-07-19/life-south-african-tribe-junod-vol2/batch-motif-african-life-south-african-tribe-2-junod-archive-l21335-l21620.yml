  quote: ''
  summary: The passage closes with an appeal that Africander expansion not ruin the
    African former occupants of South Africa. Appendix I then gives Shinangana/Sbinangand's
    chronology, spoken in 1905, in which years are remembered by principal events
    such as flights, battles, plundering, circumcision schools, births, deaths, famine,
    comet, pests, epidemics, refuge, and colonial wars. The compiler comments on the
    chronology as a feat of memory and evidence for oral tradition. Appendix II begins
    a list of Thonga botanical names with scientific equivalents.
