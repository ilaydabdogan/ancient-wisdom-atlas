canonical_text:
  quote: ''
  summary: The passage gives examples and classifications of Thonga proverbial enigmas,
    including analogical, satirical, historical, sound-based, and obscure forms. It
    discusses variant answers and cautiously compares some examples to antithetic
    proverbs of Solomon. The passage then introduces Thonga songs and describes an
    itinerant Manyisa poet who performs at a sacrificial gathering with costume, mimed
    lameness, stamping, and assagai gestures before beginning his song.
  language: English with Thonga terms and translated Thonga examples
  quote_policy: summarized
