  summary: The passage describes Thonga pre-currency barter, including exchange of
    mats or baskets for hens and pots valued by measured contents; it also describes
    replacement of a pot that breaks on first use. It then summarizes the development
    of trade at Delagoa Bay after European contact, citing Portuguese records and
    an eighteenth-century account of royal centers, merchants, dues, vessels, and
    trade goods such as ivory, gold, copper, amber, rhinoceros horns, hippopotamus
    teeth, clothing, and glassware.
