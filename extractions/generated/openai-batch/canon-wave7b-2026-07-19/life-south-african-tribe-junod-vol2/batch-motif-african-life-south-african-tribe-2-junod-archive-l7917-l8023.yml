canonical_text:
  quote: ''
  summary: The passage gives the end of a Hare tale and the start of another. Hare
    is praised after Lion is exposed and killed, then Hare wears Lion's skin, enters
    Lion's household, pretends to be ill, has livestock slaughtered, collects valuables,
    and flees. Pursuers corner him in a burrow, but he deceives them about whether
    they have hooked his leg or a tree root, and later escapes after mistaking grass
    at the entrance for enemies. Hare then tricks Grey Antelope into sewing one another
    up, causing her death until her stitches are cut and she runs away. Later Tortoise
    catches Hare at a pool; Hare promises a goat but sends Tortoise to Chameleon on
    a false debt claim, and Chameleon kills Tortoise. In the next tale, Hare sees
    the sky reflected in a pool, thinks it is a hidden country, insults Elephants,
    runs into the pool, and is caught.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lion is exposed before the villagers or subjects, does not speak, is beaten
    to death, and the Hare is thanked for cleverness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hare cuts up the Lion, wraps himself in the Lion's skin, and enters the
    Queen's hut in disguise.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While disguised, the Hare says he is ill and orders successive slaughtering
    of the Lion's oxen, goats, and sheep.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Hare asks the Queen to bring out money, a royal mat, and valuables and
    place them on the village square.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because the Lion's skin smells and attracts flies, the Hare claims he has
    sores and must seek a doctor, then takes the packed valuables, throws off the
    skin, and flees.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pursuers try to pull the Hare from a burrow with a hooked stick; when they
    hook his leg he says it is a tree root, and when they hook a real root he cries
    as if hurt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pursuers stop the burrow with grass and leave; wind blows the grass inward,
    the Hare fears enemies are still near, and finally escapes while leaving his treasure
    behind.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Hare asks Grey Antelope to sew one another up; she stitches him only partially,
    while he sews her up entirely so that she swells and dies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A woman carries the dead Antelope to the village; when the woman's husband
    cuts the stitches, the Antelope revives, runs away, and rejects the Hare as a
    friend.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The thirsty Hare enters a pool where Tortoise is in charge; Tortoise bites
    his legs, and Hare promises her a goat if she lets go.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Hare does not pay the promised goat and instead sends Tortoise to Chameleon
    with a false claim that Chameleon holds the Hare's money.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Chameleon denies having the Hare's money, blows into Tortoise's eyes, and
    Tortoise swells and dies.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the following tale opening, the Hare sees sky reflected in a pool, thinks
    it is a large country where he can hide, insults Elephants, runs into the pool,
    and is caught.
  category: sequence
  evidence_refs:
  - ev:9
