canonical_text:
  quote: ''
  summary: 'The passage describes ritual and practical uses of livestock among the
    Thonga: goat parts used in ceremonies and sacrifices, sheep associated with chiefs
    and ancestral sacrifices, pigs excluded from sacrifices, poultry housing and snake
    dangers, fowl sacrifice involving blood and attached body parts, and claims about
    the antiquity of fowls among local groups.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Goat gall bladder, astragalus, half-digested grass, and skin strips are said
    to have special roles in ceremonies and superstitious practices.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The goat gall bladder is fixed in the hair of the person honored by the slaughter,
    and the goat astragalus is tied to the wrist, ankle, or waist as protection.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Half-digested grass from the goat stomach is used in connection with invocation
    to the gods in sacrifices.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sheep are scarce, are connected in a special manner with chiefs, and their
    astragalus designates royal personages in divinatory bones.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sheep are used in national sacrifices offered to the chief's ancestors at
    the capital, and sheep skin is used to carry a child in a case called bovumba.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Pigs are described as recent in the Bantu village and are never slaughtered
    in connection with sacrifices.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fowl houses are fashioned like small huts and raised on piles to protect poultry
    from snakes at night.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: A small ground hut for a hen and brood is sealed carefully because venomous
    snakes kill many fowls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Chickens are not raised primarily for eggs; eggs are generally hatched, though
    partially formed eggs may be eaten if a hen dies from snakebite on the nest.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Fowls are extensively used as sacrificial offerings: the throat is cut, down
    from the neck is dipped in blood and brought to the mouth for the tsu rite, and
    a wing feather, claw, and beak are tied to the beneficiary''s body.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Thonga speakers assert that fowls appeared together with human beings and
    add that the Honwana had fowls.
  category: speech
  evidence_refs:
  - ev:7
