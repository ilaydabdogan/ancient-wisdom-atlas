canonical_text:
  quote: ''
  summary: In the conclusion, the author frames questions about whether South African
    Bantu may be called primitive and how they may face twentieth-century conditions.
    He proposes a cautious reconstruction based on traditions, ritual and linguistic
    survivals, and comparisons with prehistoric and ancient evidence. He reports traditions
    that remote ancestors lacked fire, discusses Mousterian evidence for fire use,
    and speculates about early subsistence, totemism, mother-right, funeral rites,
    ancestor worship, an All-Father idea, and a later period of domestication, agriculture,
    patriarchal clans, Ur-Bantu language, and taboos.
  language: English
  quote_policy: summarized
