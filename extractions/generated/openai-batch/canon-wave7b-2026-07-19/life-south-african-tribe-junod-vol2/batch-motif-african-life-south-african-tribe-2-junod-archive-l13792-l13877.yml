canonical_text:
  quote: ''
  summary: The passage recounts Libombo forest narratives in which forest beings or
    gods punish people who take fruit, wood, or animals from the forest, or intrude
    on tabooed things. A woman carries away a silent being she thinks is a child;
    villagers and magicians identify it as a god, and a sacrifice is offered at the
    forest to release her, after which she dies. A man who cuts dry wood is pelted,
    lost, and deprived of his faggots and axe. The passage also describes gods heard
    singing and dancing in the forest, and a recent report of goats in the forest
    declared to belong to the gods and to be taboo.
  language: English
  quote_policy: summarized
