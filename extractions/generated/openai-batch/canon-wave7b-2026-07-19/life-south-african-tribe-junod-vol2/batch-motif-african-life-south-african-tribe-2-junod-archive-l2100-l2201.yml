candidate_motifs:
- id: motif:1
  label: Hunter's expedition taboos and protective charms
  taxonomy_refs: []
  basis: The passage describes hunters carrying charms and observing salt and sexual
    taboos to avoid hunting failure and danger from wild animals.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: This is a passage-specific hunting pattern; no supplied taxonomy family
    directly names it.
- id: motif:2
  label: Ritual assimilation to the bush and animals
  taxonomy_refs: []
  basis: The hunter must forget home, become a man of the bush like the animals, and
    thereby not fear them nor be feared by them.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage frames this as hunting practice and taboo logic, not as formal
    transformation or shapeshifting.
- id: motif:3
  label: Thanksgiving sacrifice after a dangerous return
  taxonomy_refs:
  - sacrifice
  basis: The headman offers a hen to his gods on behalf of returning hunters, thanking
    the gods for saving them from death.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The rite is specifically a hen sacrifice tied to hunting return; broader
    sacrificial interpretation should stay limited to the stated act.
- id: motif:4
  label: Dangerous animal num or nuru requiring ritual release
  taxonomy_refs: []
  basis: The eland and ndakazi are associated with num or nuru, and the hunter must
    perform lurulula or related procedures using roots, a louse, dung, spoken cries,
    or other precautions.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage gives indigenous terms and procedures but does not define
    a universal motif category beyond these cases.
- id: motif:5
  label: Animal closes the way home
  taxonomy_refs: []
  basis: The ndakazi is named kingakaya, 'closing the way home'; if it escapes, the
    hunter may be lost in the bush and need lurulula.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is explicitly reported for the ndakazi among the Hlabi; it should
    not be generalized beyond the passage without further evidence.
- id: motif:6
  label: Child vulnerability to game-animal danger
  taxonomy_refs: []
  basis: A child may waste away if eland precautions are omitted, and children must
    be inoculated before eating eland meat.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage links this vulnerability to eland danger and prevention but
    does not elaborate a broader child-focused mythic pattern.
comparison_claims:
- id: claim:1
  claim: The headman's hen offering belongs, at a motif-family level, to sacrifice
    because it is explicitly described as a sacrifice offered to gods in thanksgiving
    for the hunters' survival.
  claim_level: same_motif
  target: sacrifice motif family
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the explicit sacrificial act and does
    not imply identity with other sacrifice traditions.
- id: claim:2
  claim: The eland and ndakazi rites share the same function of neutralizing or removing
    dangerous animal num or nuru after a kill, using a root taken near the animal's
    head or nose.
  claim_level: same_function
  target: eland post-kill rite and ndakazi post-kill rite within the passage
  evidence_refs:
  - ev:5
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The procedures differ in details; the claim concerns functional similarity
    explicitly indicated by the passage's comparison to the eland method.
- id: claim:3
  claim: Several large or notable animals in the passage are grouped by possession
    of nuru, suggesting a shared dangerous-game ritual pattern requiring lurulula
    or related precautions.
  claim_level: same_function
  target: eland, ndakazi, elephant, duyker antelope, and hippopotamus in the passage
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: Detailed procedures are given only for the eland and ndakazi in this
