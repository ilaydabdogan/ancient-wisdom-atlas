canonical_text:
  quote: ''
  summary: 'The passage describes rules and ritual precautions for hunters: charms
    and wrist inoculations, salt and sexual taboos, an ideal state of becoming a man
    of the bush, a reported lion encounter, return rites involving a hen sacrifice,
    and several procedures for dealing with dangerous game animals, especially the
    eland and ndakazi antelope, whose num or nuru can harm hunters and their families
    unless removed or neutralized.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hunters carry charms, especially a root called ndjao, and inoculate their
    wrists with tintjebe powder before or during hunting activity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The phisa is subject to expedition taboos, including the traveller's salt
    taboo; carrying salt is said to prevent him from killing game.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The hunter must abstain from sexual relations during the expedition; the passage
    says transgressors may be killed by wild animals and that sexual relations would
    heat his charms, which should remain cool.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The hunter is instructed to forget home and become a man of the bush, similar
    to the animals found there.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A prepared hunter is described as able to approach a lion eating an antelope,
    kneel, clasp his hands, ask for meat, and receive the carcass when the lion leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Returning hunters stop at the great entrance of the village, shout their mikulungwane,
    camp outside, and are greeted by the headman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The headman offers a hen in sacrifice on behalf of the hunters, thanking his
    gods for saving them from death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a hunter has been away for a long time, his wives may have borne children
    by other men; the passage states that the wives are not bound by the hunter's
    law of continence.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The eland is described as dangerous to kill and as possessing num; after killing
    it, the hunter must not walk around the body but must go to its head, take a louse
    from the forehead hair, dig up a root where the head fell, and bring both home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A medicine-man prepares a charm from the eland root and louse to lurulula
    the hunter, freeing him from the animal's num.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: If the eland treatment is omitted, the hunter may lose his head, fail to find
    the way home, or forget the hunting trip.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: When an eland has been killed while a man is bringing his wife home, he must
    make a bracelet from its skin, eat with his wife, then attach the skin to an ant-hill
    with two pegs and burn it; this is said to save the couple and protect their child.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Children must not eat eland meat before being inoculated with a preventative
    drug.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Eland saliva fallen on tracks is taboo; stepping on it is said to cause an
    invincible sleep.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage explains eland dangers by referring to a remarkable pouch of fat
    around the eland's heart called bufu.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: Among the Nkuna, the ndakazi or shidyanaman antelope must not be killed intentionally,
    or the hunter and his whole family may die.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: When the ndakazi has been killed unintentionally, its danger can be overcome
    by a spoken cry, or by digging near its nose, cutting a root said to have received
    its nuru, and handling bowel dung with that root.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: Among the Hlabi, the ndakazi is called kingakaya, glossed as closing the way
    home; a hunter throwing the assagai must cry a formula meaning that he may return
    home.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:19
  text: If the ndakazi runs away swifter than the hunter, the hunter will be lost
    in the bush because the animal has closed the way home; the hunter then needs
    lurulula whether or not the antelope was killed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:20
  text: The passage states that the elephant, duyker antelope, and hippopotamus also
    possess nuru.
  category: attribute
  evidence_refs:
  - ev:10
