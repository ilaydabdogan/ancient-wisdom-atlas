canonical_text:
  quote: ''
  summary: The passage describes Thonga/Ronga ideas about Heaven as manifested in
    storms, rain-related rites, theft detection, lightning punishment, vermin or snake
    ordeals, and heavenly beings called balungwana associated with grasshoppers, great
    rains, clouds, thunder, play, and song.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The removal of the nunu is described as a rite originating from the conception
    of Heaven and as corresponding to a Maluleke-country sacrifice connected with
    prayers to ancestor-gods against crop-destroying vermin.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The storm is described as the most characteristic manifestation of Heaven.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: After women clean wells and water the graves of twins, clouds appear, a whirlwind
    arises, and Heaven is said to thunder.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A powerful charm connected with the lightning bird is said to be made from
    the creature's flesh, feathers, and urine, and another use of this drug is tracing
    thieves.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A wronged person may threaten suspected relatives with going to the magician
    Rwagwalen/Nwagwalen, which may provoke confession.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The magician takes drugs and a large black stick associated with finding the
    bird or its urine; the stick has a notch marking the depth of the hole where Heaven
    was discovered.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The magician goes to the chief, and the chief assembles his subjects and invites
    the guilty person to confess.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: If guilt is denied, the magician goes to the theft site, treats the place
    medicinally, spreads out drugs, raises the stick, and addresses Heaven.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The address to Heaven says that Heaven has eyes seeing by night and day, reports
    stolen goods and denial, and asks Heaven to discover and consume the offenders.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the address, clouds gather, a storm breaks toward evening, lightning
    strikes the thief in his hut, and the stolen articles reappear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A guilty person may also be punished by an attack of vermin or by palm leaves
    that turn into snakes if he is guilty.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: In Khosen, people missing belongings may stand at the door of a suspected
    thief's hut during a storm, and thunder may frighten the inmate into throwing
    stolen articles outside.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that Heaven is attributed power of omniscience especially
    in the detection of theft, while the basket of bones is not consulted for that
    purpose.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: During the grasshopper outbreak, a reported belief said that two dwarfs, a
    little man and a little woman, fell from Heaven and told people not to kill the
    grasshoppers because the grasshoppers belonged to them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The grasshoppers arriving unexpectedly from above were interpreted as a manifestation
    of Heaven, like lightning, rain, twins, or the nunu.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: Balungwana are said to fall from Heaven at great rains, live in celestial
    space, return to heaven in a cloud, play when thunder sounds without rain, and
    sing during prolonged thunder.
  category: action
  evidence_refs:
  - ev:9
