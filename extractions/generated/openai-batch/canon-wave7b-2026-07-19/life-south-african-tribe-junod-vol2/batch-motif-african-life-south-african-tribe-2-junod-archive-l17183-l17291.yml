canonical_text:
  quote: Come out, spirit, you make us weep till sun-rise !
  summary: The passage describes a nocturnal exorcism for a possessed patient. Formerly
    possessed officiants, led by a gobela appointed through divining bones, gather
    at a hut with drums, rattles, tins, and songs. Their repeated music and incantations
    aim to compel the possessing spirit to reveal its name, after which it is considered
    overcome. The patient eventually enters a crisis, dances wildly, and a Zulu or
    departed-person name may be shouted as the spirit's identity.
  language: English
  quote_policy: quoted
