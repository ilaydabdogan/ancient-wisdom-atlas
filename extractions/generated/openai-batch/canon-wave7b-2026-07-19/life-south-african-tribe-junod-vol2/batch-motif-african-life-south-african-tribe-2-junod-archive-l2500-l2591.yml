canonical_text:
  quote: ''
  summary: The passage describes Thonga food taboos, distinguishes disgust-based food
    avoidance from danger-based taboo, gives two observed cases of food refusal tied
    to group or inherited identity, and introduces fishing practices, including a
    formula addressed to the hook, tobacco thrown to make the hook see, and a cosmographic
    explanation involving reflected sky and the ends of the earth.
  language: English
  quote_policy: summarized
literal_observations:
