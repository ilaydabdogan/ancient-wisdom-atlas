  text: Some animals are taboo because of their association with magicians' charms
    or because they are believed to pose bodily danger.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women are described as abstaining from some animals or animal parts because
    of feared effects on parturition; Nkuna women avoid pawed animals and eat hoofed
    animals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage distinguishes nyenya as disgust that leads to abstention from
