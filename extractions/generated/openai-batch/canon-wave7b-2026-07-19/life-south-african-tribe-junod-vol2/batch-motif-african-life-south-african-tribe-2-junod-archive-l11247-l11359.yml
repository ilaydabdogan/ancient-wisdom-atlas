canonical_text:
  quote: "“The falling stars are considered as a bad omen.”"
  summary: The passage describes Thonga conceptions of stars, falling stars, comets,
    wind, geography, earthquakes, and the rainbow. Falling stars and comets are treated
    as signs of a chief’s death; strong winds may be attributed to wizards; wind is
    lexically associated with spirit, breath, strength, and charm potency; earthquakes
    are named but only tentatively explained; and the rainbow is named as something
    that removes danger from the sky.
  language: English with Thonga/Ronga terms
  quote_policy: quoted
