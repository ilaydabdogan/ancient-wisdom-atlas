canonical_text:
  quote: ''
  summary: The passage describes hunting rites called lurulula for elephant, duyker,
    and hippopotamus; hereditary hippopotamus-hunting knowledge called butimba; drug
    inoculation for hunters; taboo sexual preparation, abstinence, wife-seclusion,
    weapons, pursuit techniques, and a post-kill crawling rite by which the hunter
    is said to take on the animal's defilement or nature so that other hippopotami
    do not notice him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For elephant hunting, the hunter formerly used tintjebe powder, pierced the
    animal's eye, mixed the powder with vitreous humour, added drugs from the trunk
    and tail ends, and used the mixture to overcome the nuru; guns are said to have
    made this lurulula unnecessary.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For a duyker, the operation includes blowing chewed ndjao root over the head,
    forehead, anus, and sides of the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a dog started a long duyker chase, the hunter cuts a hoof, notches it,
    blows ndjao into it, buries it, shows the dog the place, and the dog scratches
    it up and carries it away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The duyker lurulula is said to help both hunter and dog become more adept
    at hunting, with the hunter identifying himself with bush life and animals so
    that they are not afraid of him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Certain riverine villages have regular hippopotamus hunters who possess an
    hereditary science or art called butimba, taught by fathers to sons.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mbangulwa drug is said to give an inoculated hunter special power over
    hippopotami, but also to make him dangerous to people he beats.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Before a month-long hippopotamus expedition, the hunter has sexual relations
    with his own daughter and then abstains from sexual relations with his wives for
    the campaign.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the incestuous act, normally strongly taboo, makes
    the hunter a 'murderer' who has killed something at home and gained courage for
    great deeds on the river.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The hunter starts with his sons, blocks a drift with a canoe, and the returning
    hippopotami are attacked with assagais smeared with Strophantus poison.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The hippopotamus assagai has a blade, handle, and string arranged so that
    the handle floats as a buoy and shows the animal's direction of retreat.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: After throwing the assagai, the hunter informs his wife, who must shut herself
    in the hut, remain quiet, and neither eat, drink, nor crush mealies; her quietness
    is said to make the beast quiet.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The hunters pursue by canoe, replace the floating handle with a long palm-leaf
    nervule, spear the hippopotamus in the nostrils, and drown it by preventing it
    from closing its nose when it dives.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The hippopotamus may attack the hunters, and the passage says it may be led
    by baloyi who ride on it like men on a horse.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the hippopotamus is dragged onto the sand, the principal hunter crawls
    between its spread legs from behind and along its belly and chest as far as the
    teeth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The stated object of the post-kill hippopotamus lurulula is that the hunter
    takes on the animal's defilement, smell, or nature, so other hippopotami mistake
    him for one of themselves and he gains courage.
  category: speech
  evidence_refs:
  - ev:9
