canonical_text:
  quote: ''
  summary: The passage describes hakati divinatory cupules made from fruit stones,
    their sexed set of six pieces, their use especially by hunters, and rules for
    interpreting their direction and positive or negative position when cast. Four
    explained examples show hunting and illness prognoses. The passage then describes
    initiation for hakati practitioners and introduces divinatory bones, called nhlolo
    or bula, as a more important system associated with speech, Word, and Revelation,
    including a diviner's comparison of the bones to the Christian Bible.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hakati are described as oval fruit stones cut into two pointed cupules; six
    cupules make a set, three male and three female, with male pieces distinguished
    by larger size.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hakati pieces may be pierced and strung to hang around the neck.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says hakati are mostly employed in Hlengweland/Gaza, attributed
    to the Ndjao, and brought back by Ba-Ronga and Thonga from hunting expeditions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hakati are used mostly by hunters for directions and predictions, and sometimes
    for domestic affairs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When cast, the shells are thrown on a mat, and interpretation considers both
    their direction and whether they fall concave-side up in a negative position or
    convex-side up in a positive position.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In one hunting example, female shells indicate women at the village, a male
    shell indicates the hunter, another shell indicates the elephant, and the arrangement
    predicts that the hunter misses the elephant.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In a second hunting example, the reversed positions of hunter and elephant
    predict that the elephant will be killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In one disease example, all male and female shells are on their backs, interpreted
    as a very bad case with little or no hope.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: In another disease example, the middle shell is the patient, a lower negative
    shell is his grief, a female shell is a woman connected to the cause of disease,
    a male shell is a friend fetching a remedy, and two female shells are women laughing
    at the man.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Practitioners of hakati must be initiated by burying shells in the earth on
    the road and unearthing a male or female shell when a corresponding passer-by
    appears.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Divinatory bones are called nhlolo or bula and are presented as a major divination
    system, with bula linked by the author to speaking, Word, and Revelation.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Maselesele, a Nkuna diviner, is quoted as saying that the divinatory bones
    are better than the Christians' Bible.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The narrator says he was initiated into the art by many masters, including
    Spoon, whose set of bones was incomplete.
  category: relationship
  evidence_refs:
  - ev:10
