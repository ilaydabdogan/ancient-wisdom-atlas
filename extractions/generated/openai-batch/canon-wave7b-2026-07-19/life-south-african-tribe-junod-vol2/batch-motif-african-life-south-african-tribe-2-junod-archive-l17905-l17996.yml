canonical_text:
  quote: ''
  summary: The passage distinguishes harmful witchcraft, called Buloyi, from beneficial
    magical practice, called Bungoma. It explains the term loya, describes baloyi
    as hereditary witches whose power passes through the mother, recounts a device
    for evading ordeal by sending an unempowered substitute child, and describes baloyi
    as a feared secret society that meets spiritually at night, debates harmful actions,
    and consumes human flesh.
  language: English
  quote_policy: summarized
