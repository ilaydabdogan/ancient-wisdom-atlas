canonical_text:
  quote: ''
  summary: 'The passage describes the Thonga conception of Tilo, or Heaven, as more
    than the blue sky: an ill-defined higher power and place, desired as a place of
    rest and associated in songs with ascent by string or cord. It notes that Thonga
    do not generally state that the dead go to Heaven, though one Hlengwe account
    directs the dying to say they go to a blessed heavenly place. The passage also
    presents Tilo as an impersonal power regulating rain, storms, death, convulsions,
    and twin births, and as causing infant convulsions.'
  language: English
  quote_policy: summarized
