canonical_text:
  quote: ''
  summary: The passage describes gendered and life-stage taboos concerning cattle,
    rules for cattle care, slaughter and communal meat distribution, procedures for
    milking and curdling cow's milk, milk taboos around menstruation, confinement,
    moon presentation, and recent calving, and the care, killing, and sacrificial/religious
    use of goats among the Ba-Ronga/Thonga context described by the source.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women of childbearing age who have sexual relations are not allowed to take
    care of oxen; children or girls not yet menstruating, or unmarried girls, are
    sent to fetch dung from the oxen kraal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When oxen are sick, little girls may be entrusted with their care and may
    remain with them for as long as two months without returning home.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Oxen-breeding is described as aimed chiefly at wealth acquisition rather than
    milk, with oxen used to purchase girls, increase a family, and provide valued
    meat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Oxen are killed by piercing the heart with an assagai at marriage feasts,
    family and national gatherings, rain sacrifice, and headman-sponsored feasts;
    relatives, neighbours, and travellers may attend and share the feast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Cow milking requires the calf to suck briefly first; a boy then pulls the
    calf away, and a wild cow may be restrained by a string through its nostrils while
    milk is received in a wooden bowl.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fresh milk is poured into a calabash containing retained whey so that it curdles;
    curdled and solid forms are eaten, and separated whey is drunk by men and herd
    boys.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A woman during menstruation must not drink milk, nor during confinement or
    before her child has been presented to the moon.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Milk from the first week after a cow has calved is taboo and must not be mixed
    with other cows' milk until the calf's umbilical cord has fallen; it may be boiled
    and consumed by children.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Goat's milk is reserved for herd boys, and men do not taste it.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Goats are bred by the Ba-Ronga, generally cared for by small boys, and sometimes
    sheltered in a special hut against rain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The ritual way to kill goats is by piercing the heart; an officiating person
    stands on the animal's right, stabs the left side, and holds the left leg, though
    goats may also have their throats cut to stop them crying and attracting people
    who would share the meat.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The source states that the goat appears specially reserved for sacrifices
    and religious usages and presents this ritual use as a basis for supposing the
    goat is an ancient domestic animal among the Thonga and broadly among South African
    Bantu.
  category: other
  evidence_refs:
  - ev:12
