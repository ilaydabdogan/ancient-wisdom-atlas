- id: obs:3
  text: Large white larvae found in old decayed nkanye trunks are saved, fried in
    their own fat, and served as a valued food.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Locusts are gathered when night coolness has benumbed them; their heads, wings,
    and legs are removed, and their bodies are roasted, boiled for seasoning, or dried
    and crushed into flour.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Nkuna are said to have learned from Pedi neighbours a food practice involving
    male white ants or termites.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Boys catch smaller male white ants with glue-smeared grasses inserted into
    emergence holes, eat the heads, and use the bodies to season a meal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A larger kind of male termite is trapped by digging a hole in an ant-hill,
    placing an old pot at the bottom, and covering the hole with green branches so
    the insects fall into the pot.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'Food acceptance varies by group: the Ronga eat boa, the Nkuna dislike it,
    the tortoise is generally eaten but rejected by Mpfumu boys, and the passage distinguishes
    disgust from taboo as reasons for exclusion.'
  category: relationship
  evidence_refs:
  - ev:6
