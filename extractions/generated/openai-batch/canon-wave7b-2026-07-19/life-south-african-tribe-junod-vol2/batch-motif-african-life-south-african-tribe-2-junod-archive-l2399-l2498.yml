canonical_text:
  quote: ''
  summary: 'The passage describes foods eaten or rejected by different South African
    groups and clans: rodents, birds, caterpillars, beetle larvae, locusts, male termites,
    boa, lizard, tortoise, pork, fish, and snails. It gives practical methods for
    collecting, trapping, cooking, or seasoning with insects, and distinguishes exclusion
    from disgust (nyenya) from exclusion by taboo (yila). A footnote mentions a Pedi/Khaha
    rallying cry linked to an ancestral crossing of a swollen river on a tree trunk.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says rodents, most birds, and several kinds of caterpillars are
    eaten, including caterpillars found on the nkanye tree.
  category: object
  evidence_refs:
  - ev:1
