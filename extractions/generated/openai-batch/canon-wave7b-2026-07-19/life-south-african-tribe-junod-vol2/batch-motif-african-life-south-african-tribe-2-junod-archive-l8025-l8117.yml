  quote: ''
  summary: 'The passage recounts a sequence of Hare episodes: other animals punish
    him with mud, Hyena inadvertently enables his escape, Hare deceives Lion and Lion''s
    cubs while in service at Lion''s village, kills the cubs with a fire-jumping game,
    fabricates an enemy attack, kills Lion with a falling boulder, takes Lion''s claws,
    then marries Grey Antelope for her horns and kills her in a cooking game.'
