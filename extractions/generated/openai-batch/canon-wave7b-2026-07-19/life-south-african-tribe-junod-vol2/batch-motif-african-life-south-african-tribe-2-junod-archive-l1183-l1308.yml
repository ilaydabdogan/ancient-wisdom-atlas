  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the fire-drill method, one wooden piece is called the wife and female,
    and the other is called the husband and male.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Fire is produced by rotating the male piece rapidly in a notch in the female
