- id: obs:3
  text: A tradition among the Hlengwe is cited as showing that there was a time when
    food was not cooked.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Four trees are named as sources for producing fire by friction: bulolo, mpahla,
    nkuwa, and ntjopfa.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ntjopfa is used to light the sacred fire of nyokwekulu and is taboo for ordinary
    use or for warming oneself at its embers.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Medicine-men are the only persons described as allowed to make ntjopfa fire,
    because they have drugs to prevent disease caused by its use.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Branches of a tree struck by lightning are taboo for fire use.
  category: object
  evidence_refs:
