  summary: The passage describes Thonga food preparation, emphasizing vegetable diet,
    fire and salt, fire-making by friction with named trees, taboos surrounding certain
    fires and woods, royal control over relighting fires, household ember transfer,
    salt procurement methods, and the social value of skilled cooking.
  language: English
