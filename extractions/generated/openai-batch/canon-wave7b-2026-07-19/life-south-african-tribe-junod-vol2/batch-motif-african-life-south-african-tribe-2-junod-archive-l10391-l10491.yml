canonical_text:
  quote: ''
  summary: The passage analyzes the musical system of the Thonga from collected tunes
    and instruments. The author emphasizes provisional method, describes rhythm marked
    by instruments and dance movements, argues for a seven-interval scale supported
    by timbila and sol-fa teaching, notes intonation and accidental difficulties,
    describes major/minor usage and major-minor alternation, and explains the perceived
    sadness of many melodies through descending contours, short melodic spans, and
    repetition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that conclusions about the musical system are provisional
    and that transcription of Native tunes may be affected by the transcriber; phonograph
    records are presented as more reliable.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rhythm is described as generally well marked by accompanying instruments and
    dancer movements, including lowered arms, brandished weapons, and feet stamping
    the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author reports sudden changes in time and says binary meters such as 2/4
    and 4/4 occur more frequently than ternary meters such as 3/4 and 6/8.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The melodic system is said to be based on a seven-interval scale, and the
    timbila is described as constructed according to the ordinary scale.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Boys in Lourenco Marques, described as just from the bush, sang the scale
    after a short first lesson; the author says they did not know the names of the
    notes but were familiar with the sounds in sequence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author uses an analogy between sound sequence and the rainbow, and states
    that some color terms group yellow with red and black with dark blue.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author says some singers are more in tune than others, sometimes singing
    a third or quarter tone flat or sharp; some boys mastered the chromatic scale,
    but sharps and flats are described as generally difficult.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the people discussed know the major scale and frequently
    sing in a minor scale; timbila performance is described as using an Aeolian-type
    minor without a raised seventh.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tunes numbered 33 and 25 are cited as examples of movement between major and
    minor modes.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author classifies the collected tunes as 25 major, 10 minor, and 5 mixed
    or doubtful.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author attributes the sad impression of many melodies to a pattern in
    which the melody begins high, descends to deep notes, and often ends on the lowest
    note; short melodies and constant repetition are said to increase monotony.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A professional musician is reported as saying that the tunes are not merry
    and that there is not a single tune for dancing.
  category: speech
  evidence_refs:
  - ev:7
