candidate_motifs:
- id: motif:1
  label: Ancestor spirit becomes associated with a natural force
  taxonomy_refs: []
  basis: The passage explicitly describes Makaneta, a named ancestor god, as becoming
    confused with a natural phenomenon and as illustrating an ancestral spirit evolving
    into a Nature spirit.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is presented through the narrator's analysis of reported belief;
    the exact natural phenomenon linked to Makaneta is not further detailed in the
    supplied passage.
- id: motif:2
  label: Undersea crossing as a magician's qualification
  taxonomy_refs:
  - initiation
  basis: Magicians claim to have stayed in the sea depths, and 'crossing the sea'
    is said to operate as a diploma granting the right to exercise magical art.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage calls it a 'kind of diploma' but does not describe a formal
    initiation rite.
- id: motif:3
  label: Whale swallows and vomits sea to cause tides
  taxonomy_refs: []
  basis: The common explanation of tide is that a whale alternately swallows and vomits
    seawater.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage also notes an alternative observation-based connection with
    the moon.
- id: motif:4
  label: Silence averts misfortune from dangerous natural forces
  taxonomy_refs: []
  basis: 'Both sea and fire are said to require quiet behavior: shouting when a wave
    takes someone, or crying during bush fire, is said to make the danger worse.'
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage gives several contexts, but the mechanism is not explained
    beyond the stated rule of silence.
- id: motif:5
  label: Earth oath by placing soil in the mouth
  taxonomy_refs: []
  basis: The most solemn oath is described as taken with earth; an accused person
