canonical_text:
  quote: ''
  summary: 'The passage discusses Thonga conceptions regarding natural phenomena and
    materials: an ancestor, Makaneta, is treated as becoming confused with a natural
    phenomenon associated with the sea; the sea impresses coastal Thonga and is linked
    to magicians'' claims of undersea travel; tides are explained by a whale swallowing
    and vomiting seawater, with some attention to the moon; sea and fire are said
    to require silence in order to avoid worsening danger; stones, mountains, crystals,
    earth, oaths, relocation practices, and metals are described in religious or customary
    terms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Makaneta is identified as an ancestor of Mboza and descendant of Mawayi, and
    the passage says this ancestor god begins to be confused with a natural phenomenon
    connected to the country where he lived.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the religious fear of a deceased spirit mingles with
    awe at the roaring sea, and presents this as a point where an ancestral spirit
    evolves into a Nature spirit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sea is described as impressive to Thonga people living near it, but the
    narrator reports hearing few stories about its confines or far shore.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some magicians are said to claim that they have gone into and stayed in the
    depths of the sea; to have crossed the sea is described as a kind of professional
    diploma.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tide is commonly explained as caused by a whale that alternately swallows
    and vomits seawater.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some people connect the tide with the moon after noticing higher tides at
    full moon and at the wane.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sea is described as jealous and dangerous; when a person is taken by a
    great wave, observers are instructed not to shout or declare the person lost.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that if bystanders say, in effect, to let the wave take the
    person, the returning wave will bring that person back.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Fire is explicitly compared with the sea: during bush fire, people are told
    to put it out quietly, because making noise or crying is said to make the fire
    come straight at them.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Rikatla bush-fire anecdote, calm people save huts, while crying at
    Jeck's village is blamed for the fire leaping onto and burning huts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A note generalizes the recommendation of silence to other misfortune contexts,
    including war, hippopotamus hunting, and a child seized with convulsions owing
    to the power of tilo.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: The origin of stones is said to be unknown; Pikinini interprets visible concentric
    layers in a dolomite boulder by saying that stones also grow.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Another speaker, after seeing cliffs in the Drakensberg, says that God must
    have used all the stones in building those mountains, explaining why his sandy
    homeland lacks stones.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Crystal is described as pleasing and rare; magicians who obtain white or black
    stones carry them around the neck with animal claws, teeth, or small skin bags
    used as amulets.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: Earth is identified with the people dwelling on it and with the clan; the
    word tiko is said to mean both soil and people.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: The earth is described as the chief, and this status is said to underlie laws
    such as the chief's claim to an elephant tusk that has fallen on the earth.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: 'The most solemn oath is said to be taken with earth: an accused man may put
    earth in his mouth, say tsu, and deny knowledge of the accusation.'
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: A similar oath practice is mentioned involving sucking a piece of iron.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: After moving from one country to another, people are told to mix a little
    earth from the former country with food for several days to provide transition
    between old and new domicile.
  category: action
  evidence_refs:
  - ev:12
- id: obs:20
  text: The passage lists native metal terms for iron, copper, and white metals, and
    states that there is no word for gold.
  category: object
  evidence_refs:
  - ev:13
