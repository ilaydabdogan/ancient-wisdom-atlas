canonical_text:
  quote: ''
  summary: 'The passage reports several named forms of witchcraft: sending animals
    against enemies or crops, causing food or drink to become harmful creatures within
    the body, introducing foreign bodies or blood, compelling a victim to leave home,
    and using a power of “opening” to steal cattle, violate a hut, or harm a person.
    It concludes with a story of Nkokana, an initiate and admired dancer, who is lured
    by a voice in the woods, becomes exhausted, and dies after being “opened up” by
    a witch.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ruma is described as sending a crocodile, lion, or more often a snake to the
    place where an enemy will pass, with the result that the enemy is killed or wounded.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Examples attached to ruma include Gebuza’s nose being torn off by a hyena,
    accusations involving owls and a crocodile, and antelopes or duykers being sent
    to damage fields and sweet potatoes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mitisa is described as daytime bewitching by giving a visitor food or drink
    into which drugs have been introduced.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In mitisa, normal-seeming mealie pap or beer is said to transform after swallowing
    into a harmful beast or animal matter, such as a snake, Copris beetle, big fly,
    or animal flesh, causing suffocation, disease, or death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A treating magician attempts to remove the foreign bodies and may display
    a bone, tooth, beetle, or other objects after the patient vomits; the passage
    says such objects may have been introduced by the magician beforehand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A medicine inoculated into the tongue is said to make bewitched food reveal
    itself, including by the cracking sound of beetle elytra, so the person can spit
    it out.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Matshelwa includes foreign bodies introduced through poisoned food and also
    blood poured on a person at night in such quantity that the hut floor is wet by
    morning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ntchutchu is described as bewitching the will so that a person leaves the
    country without motive, goes to Johannesburg or elsewhere, and becomes prey to
    other baloyi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that when a boy dies in the mines, his parents may attribute
    the true authorship of death to a noyi at home who hated him and made him go by
    ntchutchu.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mpfulo is defined as the power of the baloyi to open things.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Nwayekeyeke is said to use charms and a medicated hyena tail at night to make
    villagers sleep, open cattle kraals, call out cattle, and lead the bewitched herd
    away.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: While stealing cattle, Nwayekeyeke rests on a tree because the cattle are
    irresistibly attracted by the tail, and he may offer an ox to people who see him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Other forms of mpfulo include opening a hut, moving a sleeping husband without
    waking him, and committing adultery with his wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The “great mpfulo” is described as opening a man.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Nkokana, after the end of the circumcision school and a final ceremony at
    the chief’s kraal, is called by a voice in a thick wood, follows it without finding
    anyone, returns worn out, and dies some days later.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage identifies Nkokana as having been “opened up” by the witch and
    states that this bewitching probably aims to enslave the victim and make him work
    for the noyi.
  category: relationship
  evidence_refs:
  - ev:8
