canonical_text:
  quote: The wild buffalo has been made prisoner ! On its neck a yoke has been placed.
  summary: The passage argues for a special Native curriculum in South Africa. It
    opens with an animal-yoking metaphor for the training of the Bantu mind, describes
    the spread of schooling and literacy, recounts the author's experience teaching
    at Rikatla after a Native teacher left, criticizes the use of the same school
    standards for Native and White children in Cape Colony, and notes missionary conference
    advocacy for a special Native course of instruction.
  language: English
  quote_policy: quoted
