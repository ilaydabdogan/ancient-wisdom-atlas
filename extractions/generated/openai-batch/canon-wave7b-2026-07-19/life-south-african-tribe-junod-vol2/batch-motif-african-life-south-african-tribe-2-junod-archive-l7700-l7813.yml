canonical_text:
  quote: ''
  summary: The passage introduces Thonga animal folklore and begins the tale of Nwashisisana,
    the Hare. Hare lives and farms with Grey Antelope, steals more beans than she
    does, traps her, and obtains a hoe in exchange for releasing her. He then tricks
    the Great Lizard/Varan, a guard at the chiefs' water hole, by tying the hoe to
    the Varan's tail, drinking and muddying the water, eating the Varan's ground-nuts,
    and coercing the Varan to confess responsibility. The chiefs, including Elephant
    and Lion, praise Hare and kill the Varan. Hare then takes the hoe and approaches
    Grey Antelope, who is guarding another pool.
  language: English
  quote_policy: summarized
