  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Only the guardian of the wood, described as a priest and descendant of the
    forest gods, may enter to offer sacrifices.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the Libombo wood, the narrator reports a slightly raised tumulus with remains
    of offerings, other tombs, undisturbed snakes, and broken blackened pottery from
    vessels belonging to the dead.
  category: object
  evidence_refs:
  - ev:6
