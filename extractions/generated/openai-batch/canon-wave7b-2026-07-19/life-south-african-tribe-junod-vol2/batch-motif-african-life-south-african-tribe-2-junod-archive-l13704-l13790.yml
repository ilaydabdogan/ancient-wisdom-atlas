canonical_text:
  quote: ''
  summary: 'The passage presents several coexisting ideas about the dead: an underground
    pure village of abundance, continued residence in the grave, and family life in
    sacred woods. It describes sacred woods as royal cemeteries under strict taboo,
    with ritual guardians and sacrifices. A Libombo legend tells of a woman who eats
    sala fruit near the sacred forest, finds vipers in another fruit, hears them claim
    the fruit and tree for the gods, and dies after being cursed.'
  language: English
  quote_policy: summarized
