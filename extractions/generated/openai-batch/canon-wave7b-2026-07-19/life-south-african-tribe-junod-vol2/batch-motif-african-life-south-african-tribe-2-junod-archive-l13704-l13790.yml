- id: obs:2
  text: One conception places the departed in a great white or pure village under
    the earth, where they cultivate fields, harvest abundantly, possess many cattle,
    and give from their abundance to descendants on earth.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another conception treats the grave as the deceased person's house and square,
    where mats have been unrolled, making the afterlife an exact continuation of earthly
    existence.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Two divinatory bones are said to represent the gods: an ant-bear nail or
    astragalus associated with life in the earth and night emergence, and an antelope
    astragalus that came to light after passing through a hyena.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A further conception places the gods in sacred woods, where they live in human
    form as families, including parents, married people, and children carried on mothers'
    backs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sacred woods are described as almost impenetrable thickets and cemeteries
    where ancient chiefs, especially men of royal families and former landowners,
    are buried.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The official cemeteries exclude women and uterine nephews, and burials are
    arranged in different sections according to the villages of the living.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'The sacred woods are taboo: gathering fuel, cutting trees, or letting bush
    fire enter them is prohibited.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If fire passes over a grave in the sacred wood, the responsible person must
