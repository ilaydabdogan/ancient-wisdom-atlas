canonical_text:
  quote: ''
  summary: The passage describes a witchcraft ordeal involving the potion mondjo,
    Mudlayi's trumpet and feather, visible bodily incapacitation, segregation of those
    identified as baloyi, purification of others by lake bathing and powder, restoration
    of speech with thjeke herb, confessions of cannibalism and crop-bewitching, and
    punishments for witchcraft. It also records explanations for the ordeal's effects
    and concluding remarks on beliefs about witchcraft, cannibalism, and ogre tales.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mudlayi sounds a trumpet, approaches a participant, and places a feather in
    the participant's hair over the forehead; the participant tries but cannot grasp
    the feather.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several participants in succession show symptoms called intoxication, fall,
    crawl, or cannot rise; others keep away from them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says mondjo dries the saliva of those who drink it, with stronger
    effects in those described as truly guilty; their jaws lock and they stammer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Incapacitated participants are carried together under a tree and guarded by
    the chief's counsellors, who keep friends and relations away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Participants not intoxicated are ordered to get up, run to a lake, and bathe;
    those who fall on the way or in the water are identified as baloyi, while the
    rest return and are freed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Those who successfully complete the trial receive three pinches of special
    powder: one over the right shoulder, one over the left shoulder, and one swallowed,
    to counteract defilement from the drink that contained human fat.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A tisane made from the herb called thjeke is poured into the mouths of the
    incapacitated participants, and their cheeks and bodies are rubbed with its leaves;
    their saliva returns and they revive.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After reviving, the participants speak admissions that include devouring people,
    storing flesh, hating a named person, wanting to kill him, and bewitching maize
    to stop its growth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The counsellors reprimand the confessing participants and order them to stop
    witchcraft and remove spells from cereals, threatening to kill them if they do
    not.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: An old Native informant explains the intoxication of baloyi as caused by human-flesh
    elements in the potion, saying the noyi does by day what he is accustomed to doing
    by night.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator says the drug administrator gives larger doses to those already
    suspected as baloyi and describes Mudlayi's performance as a process of hypnotisation
    producing a cataleptic-like state in some people.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage frames witchcraft as a homicide-like crime and reports punishments
    including death by hanging, impalement, drowning, flogging, banishment, and later
    fines.
  category: other
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:13
  text: The concluding remarks attribute the hold of witchcraft beliefs to animistic
    beliefs about double existence, memories or ideas of cannibalism also reflected
    in ogre tales, and intense hatred or vengeance.
  category: other
  evidence_refs:
  - ev:10
