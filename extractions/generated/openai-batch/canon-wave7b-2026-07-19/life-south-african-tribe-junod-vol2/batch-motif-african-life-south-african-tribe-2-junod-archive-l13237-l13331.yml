literal_observations:
- id: obs:1
  text: Belching is described as sometimes being taken as a result of witchcraft,
    especially when the patient grows thin; magicians also belch to display hidden
    mysterious power.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sneezing prompts others to address the sneezer with good wishes, and the sneezer
    may pray with invocations to the gods for life, sleep, safe travel, food, and
    favor.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cut hair is taboo to throw away without precaution in Tembe and Nondwane,
    because a named bird might put it in its nest and the person's hair would not
    grow anymore.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Psychic faculties are localized in organs: patience in the liver, hatred
    in the spleen, intellectual and volitional capacities in the heart, intelligence
    and eloquence in the chest, and conscience in the diaphragm.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says the Thonga believe in an independent psychic principle called
    moya, spirit, and in Konga clans bika, breath; relatives of a dying person wait
    for the departure of breath, and death is described by saying the spirit has gone.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A third name for soul is ntjhuti or shitjhuti, translated as shadow; it is
    said to apply especially to the departed soul, and many think it becomes sh Xikwembu,
    the ancestor god.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says Thonga formerly feared looking at their reflection in a pool;
    the author suggests this may relate to identifying the spiritual principle with
    the image and connects it to fear of being photographed.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: In a story, the Ronga magician Shidzabalane sleeps on the ground with a mortar
    on his chest while three women pound mealies; when one woman strikes his shadow
    with a pestle, he rises and says he had left his body and entered his shadow.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage summarizes the soul as breath, wind-like spirit, shadow, image,
    or external likeness, and states that the human being is considered double and
    capable of separating from itself on certain occasions.
  category: relationship
  evidence_refs:
  - ev:9
