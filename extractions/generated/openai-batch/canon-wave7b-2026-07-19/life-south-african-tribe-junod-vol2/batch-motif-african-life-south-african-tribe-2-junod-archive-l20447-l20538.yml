canonical_text:
  quote: ''
  summary: 'The passage distinguishes taboo from other forms of restraint among the
    described Bantu/Thonga speakers: law or custom, respect or decency, duty, and
    disgust. It gives examples involving a maternal uncle’s obligation, mixed bathing,
    and a sexual taboo affecting burial attendance. It then discusses the term fanelo,
    moral vocabulary for good and bad, conscience, and the moral function of folklore,
    where vice is punished and virtue rewarded.'
  language: English
  quote_policy: summarized
