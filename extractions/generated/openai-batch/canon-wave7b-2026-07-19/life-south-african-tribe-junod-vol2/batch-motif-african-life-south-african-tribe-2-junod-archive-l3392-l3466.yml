canonical_text:
  quote: ''
  summary: 'The passage describes features of Thonga huts: roof-crown sticks used
    to deter birds and owls, roof gaps used as household storage, comparisons with
    Zulu and Ba-Ngoni hut forms, and death-related contamination of huts and stored
    food. It also contrasts older conical huts with improvised tin sheds near Pretoria
    and improved mission-station houses.'
  language: English
  quote_policy: summarized
