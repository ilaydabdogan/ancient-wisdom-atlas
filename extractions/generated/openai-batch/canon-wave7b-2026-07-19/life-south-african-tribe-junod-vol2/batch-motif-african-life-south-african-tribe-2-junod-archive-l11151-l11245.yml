canonical_text:
  quote: ''
  summary: The passage reports Thonga/Ronga conceptions about the sun, moon, month
    names, stars, Venus, and the Pleiades. It describes a monthly race or struggle
    between sun and moon, a partially forgotten lunar month nomenclature tied to seasonal
    signs, a child presentation rite to the moon, a taboo against counting stars,
    multiple names and roles for Venus as evening and morning star, and the Pleiades
    as the named constellation announcing the tilling season.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Spoon believed that the sun and moon race each month; the new moon is weak
    like a newborn child, then grows and fights, but during waning is overtaken by
    the sun and vanquished.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states uncertainty about whether Spoon's explanation was personal
    or generally adopted, while noting that the term shwela for the last quarter appears
    to convey a similar idea.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Each new moon bears a special name, but month or moon names are said to be
    almost completely forgotten in the Southern clans and better preserved in the
    Northern clans.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage refers to a custom of presenting little children to the moon and
    telling them the name of their month.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Surviving Ba-Ronga month names are explained by seasonal or ecological signs
    such as flowering trees, antelope births, plucked almonds, ripe fruits, new mealies,
    high grass closing paths, birds in fields, abundant harvest foods, and the coming
    of winter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Stars are called tinyeleti and are said to play a remarkably small part in
    the tribe's ideas; the passage says no distinction was heard between fixed stars
    and planets.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:7
  text: Trying to count the stars is taboo; people warn the counter to keep quiet,
    and parents may tell a punished hungry child to count the stars as an image of
    sleepless distress.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Venus has several names because the evening star and morning star are not
    recognized as one and the same; the evening star is named as a meal-stealer, brilliant
    star, and moon's husband.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The morning star is lauded as herald of the day and gives the signal for warriors,
    travellers, and circumcision candidates to depart.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: One informant interprets the custom of circumcision candidates departing by
    morning star as boys leaving childhood and ignorance to enter adult life and knowledge.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Pleiades are the only constellation named in Thonga in this passage and
    are called shirimelo, the one announcing the tilling season.
  category: attribute
  evidence_refs:
  - ev:8
