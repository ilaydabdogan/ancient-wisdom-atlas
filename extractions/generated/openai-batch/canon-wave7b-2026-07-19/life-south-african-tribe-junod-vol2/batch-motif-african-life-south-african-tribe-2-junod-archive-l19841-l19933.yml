canonical_text:
  quote: ''
  summary: 'A divinatory bone-casting is interpreted as showing the arrival of noble
    strangers and the welcome they will receive in Mankhelu''s village. Specific animal
    bones, shells, stones, and objects are read as signs of wealth, medicines, gods
    giving a road, protection, village cleanliness, seasonal timing, low rivers, solid
    earth, and clear sky. In dialogue, Mankhelu explains that diviners interpret the
    bones, which are said to speak, while the power is in the diviner''s chest. The
    passage then describes how astragalomancy is publicly known but full practice
    requires initiation: a young man gathers astragali and special stones, practices
    as an apprentice, receives bracelets rather than money, and gives bracelets as
    a fee to an old practitioner to be initiated as a master.'
  language: English
  quote_policy: summarized
