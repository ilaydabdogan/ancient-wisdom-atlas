canonical_text:
  quote: ''
  summary: The passage argues that Bantu and Thonga hearers readily accept the Christian
    God because, in the author's view, the Christian concept combines a personal divine
    being with transcendent Heaven. It then distinguishes religion, magic, and science
    among South African tribes, while noting that practices often intermingle, especially
    in sacrifice, healing, exorcism, and divination.
  language: English
  quote_policy: summarized
