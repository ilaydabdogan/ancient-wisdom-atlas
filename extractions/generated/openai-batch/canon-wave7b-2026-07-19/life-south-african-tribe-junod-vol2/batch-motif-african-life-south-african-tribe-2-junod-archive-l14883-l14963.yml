  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: People wash their bodies with green liquid extracted from psanyi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A large ball of psanyi is placed on the bride’s head after the dlaya shilongo
    ceremony to remove dangers of consanguineous marriage and help her have children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Pellets of psanyi are thrown at uterine nephews after they steal the offering
