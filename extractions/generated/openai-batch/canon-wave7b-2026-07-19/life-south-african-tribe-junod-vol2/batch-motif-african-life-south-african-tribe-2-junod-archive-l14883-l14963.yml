candidate_motifs:
- id: motif:1
  label: Sacrificial offering to divine recipients
  taxonomy_refs:
  - sacrifice
  basis: The passage repeatedly describes victims, offerings, prayer, blood, psanyi,
    and rules for selecting sacrificial animals in rites directed toward gods or beneficiaries.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:10
  - ev:14
  confidence: high
  cautions: The passage is an ethnographic analysis rather than a narrative myth;
    the motif is ritual-pattern evidence.
- id: motif:2
  label: Personal substance as sacred gift before divine approach
  taxonomy_refs:
  - sacred_exchange
  basis: Saliva is described as the worshipper’s personal gift, mingled with material
    from the victim before approaching the gods to seek divine favor.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The explanation is partly the author’s supposition because the passage
    says the Natives themselves could not explain tsu.
- id: motif:3
  label: Purification from misfortune through substance from sacrificed animal
  taxonomy_refs:
  - sacrifice
  basis: Psanyi from the sacrificial animal is used to wash bodies, remove danger,
    prevent death danger, and restore peace and happiness to the family.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: No provided taxonomy ref specifically names purification; mapping is therefore
    limited to the sacrificial context.
- id: motif:4
  label: Ritual balancing by opposed sexes
  taxonomy_refs:
  - duality
  basis: The passage states that ritual stresses opposition between the sex of the
    victim and the sex of the beneficiary, with further quenching by another offering
    of another sex.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage presents a ritual rule and explanation, not a mythic duality
    narrative.
- id: motif:5
  label: Ritual tree twig as mhamba
  taxonomy_refs:
  - sacrifice
  basis: A nkanye twig used in a funeral ceremony is called mhamba even though it
    is not described as a gift to the gods; improper use of a female twig must be
    corrected with a male twig.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: low
  cautions: The available motif taxonomy has no exact category for a ritual twig;
    assigning it to sacrifice reflects only its classification as mhamba in the passage.
comparison_claims:
- id: claim:1
  claim: The passage explicitly raises but rejects a close comparison between Thonga
    sacrificial blood use and the Jewish conception of blood as containing animal
    life and covering the soul or sins of the worshipper.
  claim_level: same_function
  target: Jewish sacrificial blood as life-bearing and atoning
  evidence_refs:
  - ev:4
  - ev:5
  counter_evidence_refs:
  - ev:4
  confidence: medium
  limitations: The comparison is framed by the author and is negative for the Thonga
    case; it should not be treated as evidence of shared doctrine.
