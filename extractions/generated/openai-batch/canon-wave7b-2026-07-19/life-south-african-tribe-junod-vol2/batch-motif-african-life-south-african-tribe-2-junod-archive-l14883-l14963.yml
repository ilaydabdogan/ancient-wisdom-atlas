  text: The ritual feature called tsu consists of an emission of saliva, generally
    mixed with material from the victim such as blood-soiled neck feathers of a fowl
    or psanyi kneaded with blood from a goat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the sacrifice of bitterness, the tsu consists only of saliva and is identified
    as a true hahla.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the worshipper gives something from himself before
    approaching the gods.
  category: sequence
  evidence_refs:
