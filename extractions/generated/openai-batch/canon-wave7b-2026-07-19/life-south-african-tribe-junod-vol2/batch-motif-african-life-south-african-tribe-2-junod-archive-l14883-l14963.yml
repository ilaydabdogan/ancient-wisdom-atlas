  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The slaughtered goat is said to contribute to the restoration of peace and
    happiness to the family.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The bones of the victim receive no special use in this passage except for
