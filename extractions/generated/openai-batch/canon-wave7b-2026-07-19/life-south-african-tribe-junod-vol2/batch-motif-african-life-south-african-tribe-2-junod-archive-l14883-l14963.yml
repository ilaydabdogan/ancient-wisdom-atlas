- id: obs:4
  text: A phrase commonly pronounced at the beginning of the prayer is translated
    as “Here is the offering.”
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author says there is no sign that the Thonga had a conception like the
    Jewish idea that blood contains the life of the animal and covers the soul or
