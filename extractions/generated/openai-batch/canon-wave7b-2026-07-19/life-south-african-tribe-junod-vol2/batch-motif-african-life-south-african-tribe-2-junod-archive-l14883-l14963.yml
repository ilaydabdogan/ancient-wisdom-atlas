canonical_text:
  quote: ''
  summary: The passage analyzes Thonga sacrificial ritual terminology and materials.
    It describes tsu as an emission of saliva, sometimes mixed with blood or psanyi
    from the victim, interprets saliva as a personal gift of the worshipper, describes
    psanyi as a purifying substance used in several family rites, notes the keeping
    of certain bones or astragali for blessing, explains rules about the sex of sacrificial
    offerings, and expands the meaning of mhamba beyond ordinary gifts to include
    ritual objects, sacred collections, a priestly title, and a rainmaking flint.
  language: English
  quote_policy: summarized
