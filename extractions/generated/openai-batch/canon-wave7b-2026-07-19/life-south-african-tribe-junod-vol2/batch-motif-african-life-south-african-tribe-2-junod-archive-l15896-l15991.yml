canonical_text:
  quote: ''
  summary: The passage records beliefs about balungwana, little beings associated
    with Heaven, including a road episode in which they spit on a traveller to see
    his face, a Bilen warning that red Tecoma capensis flowers were wanted for their
    dresses, and a Ronga report of a dwarf falling on a hill before war as a presage.
    The author then comments that Thonga ideas about Heaven are vague beside clearer
    ancestor worship, compares Thonga Tilo with wider Bantu names for a Supreme Being
    or All Father, and proposes that balungwana may preserve a trace of Mulungu.
  language: English
  quote_policy: summarized
