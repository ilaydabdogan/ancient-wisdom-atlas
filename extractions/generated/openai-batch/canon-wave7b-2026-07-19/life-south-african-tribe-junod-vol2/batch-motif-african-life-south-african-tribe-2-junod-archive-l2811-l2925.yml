canonical_text:
  quote: ''
  summary: The passage describes changes in women’s and men’s clothing among Ronga,
    Thonga/Shangaan, Pedi/Suto, Ba-Ronga, Chopi, and neighboring groups. It contrasts
    earlier skin or palm-leaf garments with later cloth, beadwork, European, Indian,
    Zulu, and Chopi bark-cloth influences, and includes an authorial comparison between
    Thonga male sheath garments and ancient Egyptian representations.
  language: English
  quote_policy: summarized
