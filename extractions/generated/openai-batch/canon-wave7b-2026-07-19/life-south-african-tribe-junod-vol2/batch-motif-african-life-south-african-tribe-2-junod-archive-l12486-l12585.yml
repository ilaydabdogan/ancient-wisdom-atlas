canonical_text:
  quote: ''
  summary: 'The passage lists Thonga/Tsonga names for birds and mammals, then records
    several beliefs about animals: a brilliantly colored bird is associated with chiefs’
    feather adornment; certain birds are objects of superstition; the Nhlalala honey-bird
    guides travelers to honey in exchange for wax and may guide them again if wax
    is burned; a mole crossing the road is a bad omen; a bracelet made from the skin
    of a burrowing mole is used as medicine against Filaria; and monkeys are regarded
    as degenerate human beings who lost the habit of agricultural work.'
  language: English
  quote_policy: summarized
