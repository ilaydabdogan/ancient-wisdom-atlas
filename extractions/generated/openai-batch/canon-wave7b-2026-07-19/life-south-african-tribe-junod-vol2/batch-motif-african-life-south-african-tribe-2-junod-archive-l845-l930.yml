canonical_text:
  quote: ''
  summary: 'The passage describes agricultural work through the season: protecting
    early mealie sprouts from birds, planting crops near canals and in hollows, sowing
    after the rains, tending individually owned family plots, excluding peas because
    of taboo, using little or no fertilization, organizing communal fallow-field labor
    with beer and songs, weeding, and guarding ripening maize, sorghum, and millet
    from insects and birds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Small marsh birds called nkapa pluck out young mealie sprouts and eat the
    grain at the roots; women and children scare them away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sweet potato stems are planted on raised canal edges, and manioc is planted
