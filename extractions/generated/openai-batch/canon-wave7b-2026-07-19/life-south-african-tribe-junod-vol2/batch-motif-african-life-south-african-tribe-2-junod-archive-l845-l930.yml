  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Regular sowing begins when the rains commence; the mother has the largest
    fields, while the husband and each girl also have their own plots.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each field owner is expected to sow the principal cereals and vegetables,
