canonical_text:
  quote: ''
  summary: 'The passage describes the termination of an ancestor prayer by feeding
    part of the sacrificial victim to the officiant, then discusses Thonga conceptions
    of ancestor-gods: they are attributed omnipresence, knowledge, and power over
    descendants, yet are treated familiarly and understood as human-like, family-limited
    beings who punish neglect, hierarchy violations, and certain sexual transgressions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A uterine nephew ends the prayer by placing a portion of the sacrificial victim
    into the officiant's mouth; when the victim is a hen, the gizzard is used after
    being partly roasted.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The officiant eats the portion and is described as the first person to partake
    of the flesh of the offering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During sacrifices, participants may laugh, speak loudly, dance, sing obscene
    songs, interrupt the prayer, and insult each other about family matters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The officiant sits on a seat designated by bones and speaks monotonously while
    looking straight ahead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that an old man or woman becomes a god after death and
    enters what is called the domain of infinity.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ancestral spirits called psriamanitra are described as omnipresent, with
    no distance for them, and are compared to heaven, the sun, and the moon.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ancestor-gods are said to know what their descendants do, even if descendants
    live far away.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ancestor-gods are said to control matters in the lives of their descendants
    and to be superior to wizards in that respect.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Their power is described as limited to their own family: they watch over,
    bless, or punish descendants, but are indifferent to other people.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The gods of the royal family may be invoked on behalf of the whole country
    to give rain, but only the chief and his uncles may approach and sacrifice to
    them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage notes an exception in which gods of bitterness or of the bush
    may attack a traveler, though their own kin who failed to bury them are most exposed
    to their wrath.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The ancestor-gods are described as demanding remembrance, offerings, first
    fruits, tobacco leaves, and ground tobacco from descendants.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Neglect of the ancestor-gods is described as the main punishable sin; they
    may also punish serious hierarchy violations and may kill someone said to lose
    restraint in sexual relations.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: For the sexual transgression, people are quoted as saying that the gods will
    lead the offender into the thick bush and kill him there.
  category: speech
  evidence_refs:
  - ev:8
