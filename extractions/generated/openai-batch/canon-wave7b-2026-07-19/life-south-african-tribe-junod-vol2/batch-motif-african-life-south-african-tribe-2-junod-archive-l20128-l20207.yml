  summary: The passage explains divination by thrown bones and astragali, discussing
    ancestral involvement, the Bula or Word as an impersonal revelation, principles
    of part-for-whole and likeness, animal-human correspondences, the basket of bones
    as a model of social life, cross-cultural notes on astragalomancy and dice, and
    the author's critique of the practice's practical and moral effects.
