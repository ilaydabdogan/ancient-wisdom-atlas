canonical_text:
  quote: ''
  summary: 'The passage describes technical stages in constructing a Thonga/Ronga
    hut: layered thatching of the roof, adding an ornamental grass crown, plastering
    the interior with clay, dung, and water by women, making a palm-wood door by the
    husband or joiner, and noting door, sill, threshold, taboo, protective drugs,
    and padlocks.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The roof is made by sewing overlapping sheaves of thatch onto concentric hoops,
    producing multiple thicknesses of thatch and a rain-proof covering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A circular crown of carefully plaited grass is fastened on the top of the
    conical roof.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The crown is said to keep rain from entering at the top and to give the building
    finish, beauty, ease, and opulence.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The roof crown is removed when the occupant dies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Plastering is described as the work of the wives, while making the door is
    described as the work of the husband.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The future mistress of the hut and other women collect black or red clay,
    sometimes from marshes or ant nests, and fetch fresh dung from the cattle kraal.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Women mix clay, dung, and water inside the new hut, tread the mud with their
    feet, and plaster the interior wall with their hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After plastering, light can enter the hut only through small openings between
    the roof and top of the wall, which also allow some air circulation.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The remaining clay is used to make a hard, even floor that can later receive
    fresh black plaster coatings.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Rikatla region, Ba-Ronga doors are generally made from the wood of
    the mimale palm, using long leaf nerves cut into pieces, bored, and held together
    with transverse sticks.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The door has transverse sticks fixed into a pointed pole, forming pivots or
    hinges.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The sill is a piece of wood laid on the ground with an edge raised so that
    the door opens inward and not outward.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The principal hut of the village master has a threshold associated with protective
    drugs placed under it at the foundation of the village.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: It is taboo to sit on the principal threshold, which is said may cause disease,
    but it is not taboo to tread on it.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Padlocks are described as European in origin, and palm-wood doors occur only
    where the mimale palm grows.
  category: attribute
  evidence_refs:
  - ev:9
