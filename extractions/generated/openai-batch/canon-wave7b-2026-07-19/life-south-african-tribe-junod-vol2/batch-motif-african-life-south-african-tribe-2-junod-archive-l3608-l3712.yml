canonical_text:
  quote: ''
  summary: The passage describes a tabooed testing and purification procedure for
    fired pots; names and forms of clay vessels, pipes, and clay models; and Ba-Ronga
    basket-work using milala palm leaves, including drying, splitting, dyeing black,
    and plaiting geometric basket designs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a pot has been fired, it must be tested by an operation called ku khangula
    or kwangula.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The potteress pours a little water into the pot, washes it thoroughly, cooks
    some grains of maize in it, and throws the grains away.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The testing operation is said to remove nkwangu or nkhangu, the danger connected
    with using an untested and unpurified pot.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: People using an untested implement are said to suffer an eruption on the arms
    or even on the whole body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Giving someone food from a pot that has not been khangula is considered an
    act of hatred.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage names and describes cooking pots, smaller boilers, beer jars,
    large amphora-like beer jars, and porringers or large plates.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Shibindji clay is used for short pipes, while smoking is described as not
    seeming indigenous and snuff as the more usual tobacco use in the interior.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Children in South African tribes amuse themselves by modelling oxen, human
    beings, wheels, and waggons in clay.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A boy in Shiluvane is described as able to imitate everything he saw in clay,
    including a white lady with her hat.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Milala palm leaves are described as the chief basket material for the Ba-Ronga,
    and basket-making is described as essentially men's work.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The basket-maker dries the leaves in the sun, separates the folioles, hangs
    them in the hut, tears them from the peduncle, splits them into strips, and keeps
    the ribs for special use.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: Ronga basket makers decorate baskets with triangular and square black designs
    by plaiting dark and light straws, not by painting after manufacture.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Palm straw is dyed by soaking it in black marsh ooze, drying it, then boiling
    it with mpsabutimu leaves and water until it becomes brilliant black.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Named basket shapes are described as stereotyped forms passed from generation
    to generation.
  category: sequence
  evidence_refs:
  - ev:11
