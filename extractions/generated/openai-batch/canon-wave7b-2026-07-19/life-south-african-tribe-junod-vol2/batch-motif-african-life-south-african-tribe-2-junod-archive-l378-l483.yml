  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: At harvest time, Kafir corn is subject to the luma taboo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sorghum is extensively cultivated in several varieties, and birds are a practical
