  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before mabele seeds are sown, a sub-chief blows on them after taking a small
    piece of a root into his mouth; the root is said to keep ants away from the seeds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The treated mabele seeds are distributed among the people, who mix them with
    their own seed supply; only men of the reigning family possess the root used in
    this treatment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When sowing time comes, subjects are forbidden to sow mabele before their
    chiefs or sub-chiefs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bones are consulted for the proper time to sow; if the madjuma fall showing
