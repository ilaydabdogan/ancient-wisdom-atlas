canonical_text:
  quote: ''
  summary: 'The passage lists wild fruits and drink ingredients, describes taboos
    and ritual precautions connected with cutting large trees, and outlines the early
    agricultural year: seasonal plant signs, hoe preparation, clearing fresh land
    by cutting and burning vegetation, and cultivating marsh gardens with canals,
    decaying plant heaps, pumpkins, rice, and mealies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several wild fruits and berries are named as foods gathered from shrubs or
    trees, including pfilu, tjhopfa, bungu, and tintjole.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The muhlu or water tree bears tihlu berries, and the mphimbi bears mahimbi
    fruit; both fruits are used to prepare a drink.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says it is dangerous to cut the trunk of any large tree, and gives
    a procedure of smearing bark with drugs and burning them at the foot of a nkanye
    before cutting it for a mortar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before cutting a nkwenga or mahogany tree for a canoe, the master of the forest
    must first offer a sacrifice to ancestral spirits buried there; if this is omitted,
    the chosen tree cannot be found again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In shimutnu, the little heat in July, new shoots, leaves, and blossoms mark
    the passing of winter and the coming of summer.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the Ronga woman notices the seasonal signs, she takes her hoe to the
    hills or marshes; her husband has repaired the implement at home.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the end of August, before the rainy season, work is divided between clearing
    fresh land and cultivating marshes.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: In fresh-land clearing, the woman cuts small trees with an axe, burns larger
    stems at the base until they fall, breaks the soil with her hoe, and heaps uprooted
    weeds and bushes for drying and burning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During land clearing, certain trees such as nkanye, mphimbi, nkuhlu, and sometimes
    the mimosa parasol are spared because they provide edible fruit or useful shade.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: An old adage warns the worker not to look at rubbish heaps and imagine the
    work is already done.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: In marsh cultivation, papyrus, Typha, and reeds are cut and uprooted, small
    canals are dug to collect water, plant heaps are left to decay, and pumpkin seeds,
    rice, and mealies are sown or planted.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Makaneta people are said to have long known and practiced planting out
    rice.
  category: action
  evidence_refs:
  - ev:6
