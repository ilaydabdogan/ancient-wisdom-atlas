canonical_text:
  quote: ''
  summary: 'The passage surveys Thonga song materials: a courtship image involving
    a man with a belt of tails and a woman drawing her leg aside; a rejected lover''s
    curse that converts ordinary food and vessels into human body parts; songs of
    marital jealousy; mourning songs after burial, including call-and-response performance,
    accusations against wizards, a ''black house'' lament, and a stoic song about
    facing death; an allusion to Heaven as a power that kills and gives life; war
    songs used at deaths of important persons; and the widespread lament for the young
    chief Nwamantibyane after his capture and deportation.'
  language: English with Thonga/Zulu song excerpts
  quote_policy: summarized
