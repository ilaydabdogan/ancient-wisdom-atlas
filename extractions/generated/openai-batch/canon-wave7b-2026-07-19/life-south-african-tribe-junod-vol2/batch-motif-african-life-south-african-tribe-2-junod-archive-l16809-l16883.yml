canonical_text:
  quote: ''
  summary: 'The passage describes Thonga illness terminology and medical interpretation:
    pains are named by affected organs, moving blood and worms are described as internal
    afflictions, some diseases have technical names, nervous or psychic troubles may
    be attributed to Heaven, spirits, or winds, and one disease name is discussed
    as possibly involving robbery or seizure. The passage ends by contrasting Thonga
    diagnosis of causes with European physical examination.'
  language: English
  quote_policy: summarized
