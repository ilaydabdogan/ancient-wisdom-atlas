canonical_text:
  quote: ''
  summary: The passage describes Thonga divinatory bones and their practitioners,
    especially Maselesele and Mankhelu. It notes Maselesele's veneration for his destroyed
    bones, Mankhelu's elaborate set of sixty-four divinatory objects named Father
    and Son, his instruction of the narrator, and an enumeration of astragalus bones
    representing social categories such as subjects, chiefs, royal family members,
    and enemies. A footnote recounts a divination for imprisoned Mankhelu involving
    prayer to maternal ancestor-gods, refusal of a cow, and sacrifice of a goat whose
    astragalus entered the set.
  language: English
  quote_policy: summarized
