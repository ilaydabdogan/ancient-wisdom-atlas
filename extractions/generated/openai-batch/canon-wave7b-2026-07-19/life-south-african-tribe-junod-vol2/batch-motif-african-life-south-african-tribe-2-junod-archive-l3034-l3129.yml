canonical_text:
  quote: ''
  summary: The passage describes hair cutting, beard shaving, hair curling, ochre
    smearing, bracelets, leg ornaments, beads, and related customs among Thonga/Ronga
    groups and neighboring or trading groups. It gives special attention to nursing
    women’s tingoya hair ornaments and ochre covering, young girls’ ochre adornment,
    magicians’ adoption of feminine adornment, and the introduction of some ornaments
    through contact and trade.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Women often cut their hair, while men do so less frequently; a man cuts his
    hair when his wife dies, as a sign of mourning and taboo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In former times beards were not shaved, and people mocked beard-shavers by
    asking whether they were Angolese.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some young men let two or three forehead curls grow like horns, while others
    elongate curls and smear them with a gluey substance from the nkanye tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nursing women make tingoya by elongating small curls, smearing them with fat,
    arranging them at the temples and occiput, and covering them with ochre.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tingoya hair style is described as the characteristic ornament of nursing
    women, is praised as improving appearance, and is said also to have ritual value.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nursing women cover the body, clothing, and ntehe with ochre; this identifies
    them as nursing and is described as protection against the husband and as a sign
    that cohabitation will not occur.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports beliefs that ochre prevents bad smell, softens the ntehe,
    and makes the baby grow; it also notes children’s skin is coated with the pigment.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The passage states that ochre smearing can foster conjunctivitis and other
    diseases.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Young marriageable girls use ochre to attract attention, and a saying presents
    a pretty bird as telling girls to anoint themselves with ochre.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: A note says the Ngoni taught the Northern Thonga a more elaborate form of
    hair curling, including cylindrical chignons among Gungunyane’s queens; the Ba-Ronga
    generally did not adopt it except in some cases among chiefs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: A note says magicians adopted tingoya and ochre, like to assume the appearance
    of women, and that people suffering from Ba-Ndjao possession use ochre because
    their spirits order them to do so.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Bracelets and leg ornaments include heavy copper masindana, modern busenga,
    and mafowa made of seeds or cocoons strung on skin thongs.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: Mafowa are used for dance or war; when made from silvery Queen Moth cocoons,
    they may be filled with millet grains that rattle during dancing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Beads are described as later objects introduced by Whites in the sixteenth
    century through Portuguese trade at Delagoa Bay, exchanging glassware for gold
    and ivory.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage says glass fascinated local people because of its brightness and
    transparency, and an old song celebrates buyers returning with glittering things
    sold by Whites.
  category: speech
  evidence_refs:
  - ev:9
