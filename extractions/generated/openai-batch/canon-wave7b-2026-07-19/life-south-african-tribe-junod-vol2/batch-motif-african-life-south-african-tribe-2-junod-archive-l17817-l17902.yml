literal_observations:
- id: obs:1
  text: A disciple may found a new society of the exorcised, compete with his master,
    refuse further fees, and claim superiority.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old gobela prays at his altar to his Ngoni gods to make the rival's drugs
    ineffective; the young gobela then asks forgiveness and pays a fine to regain
    success in cures.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young gobela may succeed his master only after the master is dead.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The burial of an exorcised person is attended by other mathwazana and by disciples
    if the deceased was an exorcist.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The corpse is taboo, covered with ochre, placed in a clay-smeared grave in
    a sitting position, and made to hold the assagay or hatchet used in exorcism dances
    and songs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A bunch of shibowa, a water-growing plant, is placed on the head to cool it;
    grass from the water is also said to cool spirits so they remain in the grave
    and do not trouble people.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A small hut is built on the grave to protect the exorcised person against
    heat and fatigue.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the deceased was a master, his drugs are stored in the grave hut until
    the inheritance is adjudicated.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The most skilled follower dances on the grave while companions clap; after
    mourning he raises the drugs by burning them and may succeed the master.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author reports that possession cases like those among the Thonga occur
