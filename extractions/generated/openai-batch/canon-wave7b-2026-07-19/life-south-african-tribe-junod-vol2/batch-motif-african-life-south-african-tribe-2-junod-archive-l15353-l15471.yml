canonical_text:
  quote: ''
  summary: The passage describes Thonga conceptions of Heaven/Tilo as a power that
    kills, makes alive, causes thunder and lightning, gives shelter, grants wisdom,
    knows hidden crime, and is connected with twins, rain, defilement rites, and former
    twin-killing customs. It also summarizes songs and tales involving Heaven, including
    a girl’s ascent by string and a footnoted comparison to a Ba-Rotse spider-web
    ascent tradition.
  language: English, with Thonga/Ronga song lines and terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Heaven is described as a power that kills and makes alive, with sayings that
    Heaven loved a prosperous or rescued person and hated an unfortunate or dead person.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A dirge addresses Tshabane, says Heaven has thundered, and mentions two men
    going to throw or consult bones with reference to Heaven.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The explanation of the dirge describes a storm, downpour, lightning, a death
    attributed to Heaven striking, and men consulting bones to ward off Heaven’s strokes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the tale of the Road to Heaven, a young girl breaks her jar, fears her
    mother’s scolding, climbs her string, and goes to Heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Heaven the girl finds a village and receives a child because she is sweet
    and obedient; her cross and wicked sister repeats the attempt, but Heaven explodes,
    kills her by lightning, and her bones are blown to her parents’ house.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the Adventures of Bonawasi, Heaven gives a young Native special wisdom
    by which he overcomes the Governor of the town; the author notes possible foreign
    influence in that tale.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the story of Nwahungukuri, Heaven is credited with full knowledge of a
    hidden murder, and the passage says death was formerly more often attributed to
    Heaven.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The same power associated with lightning and death is said to preside specially
    over twin births; the mother is called Tilo, and the children are called Children
    of Heaven.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The arrival of two or three babies at once is described as a misfortune and
    defilement requiring special rites.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Formerly, one twin, usually the feebler, was killed by starvation or strangling
    and buried in a broken pot near the surface with an air hole so the spirit could
    go out and the mother could bear children again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: After twin birth, a special doctor with drugs was summoned; the mother left
    the village for a small hut behind the others, and her former hut was burned with
    her possessions.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A footnote says the ascent string may relate to a tradition among other African
    tribes, citing a Ba-Rotse account in which Leza/God went to Heaven by a spider’s
    web while humans failed to climb it.
  category: other
  evidence_refs:
  - ev:11
