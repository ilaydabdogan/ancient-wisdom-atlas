canonical_text:
  quote: "“Mahilane and the sea are one and the same thing (ntshumu mumve).”"
  summary: The passage summarizes several Thonga rain rites, including ancestor-related
    offerings, land-purification rites connected with abnormal births and twins, tjeba
    fishing, and magical sea charms. It then discusses hail customs, linguistic and
    ritual conceptions of water and rivers, taboos for river crossing, ancestor spirits
    associated with lakes and rivers, and sacrifices at Mahilane on the sea shore,
    where a sea power or ancestor-gods are invoked to wreck vessels and bring wealth.
  language: English
  quote_policy: quoted
