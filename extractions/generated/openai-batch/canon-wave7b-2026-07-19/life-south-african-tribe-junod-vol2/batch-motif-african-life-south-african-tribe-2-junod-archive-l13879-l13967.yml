canonical_text:
  quote: ''
  summary: The passage recounts several Thonga/Tsonga stories about gods or ancestral
    powers associated with snakes, sacred woods, roads, trees, and forests. A man
    dies after injuring a snake; a priest collapses after witnessing work near a sacred
    mahogany and is restored after sacrifice; a woman is struck after cutting branches
    in a sacred wood; and forest gods with their own road warn a man to move away
    after hiding his child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young people of Libombo are described as having said in their hearts that
    there were no gods before the story of Mapfindlen is recounted.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mapfindlen was walking, singing, and jumping when he unknowingly trod on and
    hurt a snake.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the night Mapfindlen saw beings against the wall that were like snakes;
    they accused him of having hurt them, and no one else saw them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A diviner attributed Mapfindlen's condition to household gods and asked whether
    he had trodden on a snake; his parents sacrificed to propitiate the gods, but
    he died.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A new road was built close to the Libombo sacred wood, and a low branch of
    a large mahogany tree over the path had to be cut.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Nkolele went to see the work at the mahogany tree; the gods told him he should
    have stayed at home, and he fell unconscious for four days, unable to eat or speak.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nkolele's eldest son offered a fowl and prayed in the sacred wood, asking
    the ancestors not to slay his father; Nkolele then got up.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Nkolele reports that the gods instructed him to obtain sacrificial animals
    and sacrifice; after his gifts, they said he had asked pardon.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A woman cut dry branches in the sacred wood of Masinge, heard an unusual voice,
    received blows, and fled home leaving her garment in the bush.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nkomuza, named as guardian of the forest, retrieved the woman's garment and
    was rewarded with a bottle of wine.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In an older story, gods were frequently seen marching in file to draw water
    from a well, using their own road; they were short, and women among them carried
    babies with the feet upward and heads downward.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After Mishimhongo built a village near the forest, the gods hid a child from
    the village and warned Mishimhongo not to remain near their road or they would
    kill him and the child.
  category: sequence
  evidence_refs:
  - ev:8
