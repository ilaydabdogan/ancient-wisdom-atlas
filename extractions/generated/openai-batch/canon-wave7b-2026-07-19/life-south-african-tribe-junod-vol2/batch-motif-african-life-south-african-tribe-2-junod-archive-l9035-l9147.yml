  evidence_refs:
  - ev:2
- id: obs:6
  text: The hidden girl comes out, embraces Mashomo's daughter, calls her her mother's
    sister, says her heart told her she was not an ogress, and asks why she suffers
    in horrid skins when she is a chief's daughter.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Mashomo's daughter tells the girl to let her go, identifies herself as Scaly-Heart,
