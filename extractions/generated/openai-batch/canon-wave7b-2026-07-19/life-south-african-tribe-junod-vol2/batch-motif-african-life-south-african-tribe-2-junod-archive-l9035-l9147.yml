  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: On the next day the girl chooses to go with the supposed ogress; the maiden
    sings, dances, orders food, and the two eat together, but the maiden does not
    explain what happened on the road.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: An ogre described as having stolen the clothes steals eggs and leftover food
