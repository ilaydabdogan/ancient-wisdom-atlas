- id: obs:4
  text: At noon the girls invite Mashomo's daughter to bathe; she refuses, and the
    chief's little niece decides to hide and spy on her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: After bathing, the royal girl puts on beautiful clothes, sings, dances, and
    is joined by female relatives who dance and weep with her.
