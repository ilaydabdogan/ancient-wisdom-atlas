canonical_text:
  quote: ''
  summary: A maiden known publicly as Scaly-Heart sings while scaring birds and secretly
    appears as a royal girl at the bathing place, where she dresses beautifully, dances,
    and is joined by weeping female relatives. Mabayi's niece spies on her, recognizes
    her as a human kinswoman rather than an ogress, and is warned not to reveal the
    secret. The niece later tells Mabayi, whose attempt to spy fails when the maiden
    notices his footprints. Meanwhile an ogre who has stolen clothes steals eggs and
    food with a long tail, deceives the villagers, is caught by a rat trap, hides
    the trapped tail, feigns stomach illness, and is partly exposed when the tail
    tip falls off before the chief.
  language: English
  quote_policy: summarized
