  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The villagers set a trap; the ogre's tail is caught in it, and he hides the
    trap under his clothes while groaning about his stomach.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The villagers find the trap missing from the place where they set it and wonder
