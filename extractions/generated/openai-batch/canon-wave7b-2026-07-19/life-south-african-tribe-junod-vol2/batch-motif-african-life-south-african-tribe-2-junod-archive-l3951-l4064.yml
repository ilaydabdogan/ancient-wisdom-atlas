canonical_text:
  quote: ''
  summary: 'The passage describes Thonga wood-carving and utensil-making: mafureira/nkuhlu
    wood, carved spoons and ladles, a spoon with a carved snake motif, single-piece
    carved wooden chains, a reported chain-and-shared-plate alliance game, a round
    vessel used by a possessed man for daily face-washing to cool his head and appease
    spirits, carved dishes, mortars, decorated calabashes, and ebony snuff boxes carried
    by chiefs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mafureira/nkuhlu tree is described as the wood used locally for wood-carving
    because its wood is soft and does not easily split or crack while drying.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Spoons are made in several sizes for serving maize or conveying food to the
    mouth when hands are ritually soiled, and even plain spoons are ornamented with
    black burnt-in designs.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: One spoon from Maputju country is described as having a carved snake as an
    ornamental motive.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Beer ladles made from one piece of wood are generally decorated with large
    black triangles; in Inhambane and Quelimane similar ladles are made from coconut
    shells with carved geometric figures.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wooden spoon-chains are carved from one piece of nkuhlu wood, and a mistake
    in carving would break the whole chain and make it useless.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The informant says spoon-chains were used by two people wanting to make an
    alliance: they put the chain over their shoulders and ate from the same plate,
    but the author adds that this was play and had no ritual value.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A nearly round decorated vessel was used by a man who had been possessed;
    he washed his face in it every day to cool his head and appease the spirits.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Large carved dishes are used for serving meat, and mortars and pestles are
    also described, with mortars often adorned with triangular carvings.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Calabashes used as bottles are shaped during growth and decorated with burnt-in
    black designs, including huts, birds, palm trees, and two warriors fighting; white
    dots are beads inserted into the bark.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Round calabash containers hold mafureira grease, are hung in the roof of the
    hut where smoke browns them, and are sometimes carved with designs by young people.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Ebony snuff boxes are carved objects that chiefs are fond of carrying.
  category: object
  evidence_refs:
  - ev:10
