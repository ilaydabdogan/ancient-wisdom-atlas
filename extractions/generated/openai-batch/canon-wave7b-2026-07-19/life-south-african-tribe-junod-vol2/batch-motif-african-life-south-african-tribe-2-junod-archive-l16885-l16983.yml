canonical_text:
  quote: ''
  summary: The passage describes Thonga conceptions of disease diagnosis, contagion,
    impurity, restricted handling of consumptives and lepers, fear of contagion through
    objects and emotional acts, sexual restrictions during illness, and the tondlola
    rite as a passage from serious illness back into social life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that disease is chiefly diagnosed by throwing bones, which
    reveal whether the cause is spirits of the gods, wizards, makhumo, defilement,
    or, less commonly, Heaven.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Consumption and leprosy are identified as especially dreaded diseases; consumption
    is attributed to makhumo, described as contamination from death or defilement
    from physiological impurity, and affected persons are ordered to eat with spoons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Sokis' death, his sister, who was carrying a child, was warned not to cry
    because the disease might jump onto the baby.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Relatives of a man who dies of consumption are forbidden to eat food he left;
    former practice burned his mealies, while later practice allowed strangers to
    buy and consume them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The widow of a consumptive is said to perform lahla khombo with strangers
    rather than with men of the village.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: For leper burials, relatives must not handle the burial; relatives-in-law
    or a friend may dig a grave near the hut, pull the corpse into it, and conduct
    no funeral ceremony while relatives remain far away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Burial implements connected with a leper may be broken deep in the forest
    or left in the hut, and the village may remove, because a relative touching an
    implement is feared to die.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lepers are not segregated from village life and may attend beer-parties, but
    they bring their own mugs rather than use utensils supplied by the host.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Possession by 'Band/ao spirits is treated as contagious through objects belonging
    to a possessed person; epilepsy is also feared, and a nurse must not see an attack
    lest the child she carries become epileptic.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Sexual relations within a village are believed to worsen the condition of
    a patient there and are forbidden during epidemics or serious illness; convalescents
    take precautions by wearing the sungi.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The tondlola rite is described as treating serious illness as a marginal period,
    with acts of separation from disease followed by feasting and resumed sexual relations
    as acts of aggregation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: For possession illness, the passage says aggregation of spirit-possessed persons
    to society amounts to an initiation.
  category: relationship
  evidence_refs:
  - ev:9
