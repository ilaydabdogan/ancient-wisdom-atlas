canonical_text:
  quote: ''
  summary: The passage recounts Hare episodes in which Hare survives a beating, removes
    water and beer from a village, later releases water and beer from a reed, receives
    chieftaincy after drowning five old women, and appears in an alternate version
    built around compensation exchanges. A famine episode follows in which Hare plants
    an elephant tusk that grows into a fruit tree, secretly eats its fruit after singing
    to it, is discovered by his son and wife, and is publicly exposed. The passage
    then introduces a section on tales called "The Wisdom of the little ones" and
    names several tale titles, ending with the heading for "The Disobedient Child
    and the Big Snake."
  language: English
  quote_policy: summarized
