- id: obs:1
  text: The text reports an expression comparing the sky after rain to a new pot from
    which the nkangu must be removed; the danger removed is said to be unspecified
    or obsolete.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lightning is called lihati and is said to be caused by a bird called ndlati.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Ba-Ronga, the same bird is called the cock of Heaven or the hen
    of Heaven, and magicians are said to determine its sex after it has fallen.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thunder is attributed either to the bird or more frequently to Heaven, with
    the expression translated as “Heaven roars.”
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Northern and Pedi-associated account, the lightning bird is described
    as green, red, black, and white, living in the mountains, preferably at river
    confluences.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Medicine-men are said to have known the bird’s hiding place and found its
    eggs in a nest floating on water.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: During a thunderstorm, the bird flies to heaven into the clouds; many may
    be present, but one dangerous bird causes death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dangerous bird rushes down, strikes a tree, hut, or person, and tears,
