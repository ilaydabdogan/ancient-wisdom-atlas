  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The magician who understands the treatment of Heaven digs at the struck spot
    and may find a gelatinous substance that later solidifies and is valued in making
    the medicine of Heaven.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: If a struck village’s magician finds and removes the foreign body, the taboo
    is removed; if not, the village must move elsewhere.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: It is taboo to warm oneself at a fire made from lightning-struck wood or to
    use that wood as fuel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Pedi Mudjumi and the Thonga Makasane are said to have possessed an enchanted
