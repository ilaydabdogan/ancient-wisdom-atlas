canonical_text:
  quote: ''
  summary: The passage describes reported Thonga, Ba-Ronga, Northern clan, and Pedi
    explanations of lightning and thunder. Lightning is linked to a bird of Heaven,
    thunder to the bird or to Heaven itself, and magical specialists are said to treat
    lightning-struck places, remove a dangerous substance, observe taboos, and avert
    storms with an enchanted flute. The passage also briefly notes an expression comparing
    the sky after rain to a new pot.
  language: English
  quote_policy: summarized
