  quote: '"to make the game forget"'
  summary: 'Ethnographic account of Thonga hunting and fishing section focused on
    big-game hunting: animals hunted, older pit traps, magical medicines applied to
    traps and weapons, a class of specialist hunters, a pre-hunting purification rite
    at the hut, departure songs, and a fowl sacrifice with food taboo.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage says hunting once supplied meat before domestic animals and was
    accompanied by customs and rites that the author describes as containing animistic
    ideas.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists elephants, hippopotami, several antelopes, giraffe, buffalo,
    and other animals as game present in or near Thonga territory.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The marindji trap is described as a large hole in the earth, covered with
    branches and filled with pointed poles on which an animal falls and is impaled.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports that Honwana used the marindji trap to kill elephants
    before they possessed iron weapons, and cooked the beast on the spot by making
    a fire around it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A hunter's wife preserves a child's afterbirth by baking it, hiding it, drying
    it, placing it between pieces of broken pot, and hanging it to the roof.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The hunter makes powder from the afterbirth, mixes it with other drugs, and
    smears it on the trap fence, arrows, or gun; the medicine is called ndžedžena
    in the passage transcription.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says the afterbirth medicine is believed to make wounded antelope
    fall at once and is important enough that a wife who loses the afterbirth must
    pay a fine of one hoe.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Iron traps may be smeared with buriba, a brownish moss growing on the roots
    of a tree called shivumbunkanye, which is also said to make game forget.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage distinguishes ordinary hunters from phisa, specialist hunters
    who have their own medicines, special ways of living, and sometimes separate villages.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mubandane undergoes a purification in which a medicine-man cooks drugs, washes
    him with froth, pours the pot contents on the roof over the hut entrance, and
    has him stoop through the entrance while water leaks onto his shoulders.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: During the hut-entry rite, the medicine-man speaks words saying that rain
    and dew may wet the hunter but everywhere will be like a hut or home, as though
    he had taken his hut with him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After purification the hunters start with rattles and special hunters' songs;
    the rite is described as protection against dangers of the bush.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A fowl is sometimes sacrificed before departure; adults are forbidden to eat
    it, while little children may eat it because they are described as quiet, meaning
    without sexual relations, so the hunting will not be spoiled.
  category: action
  evidence_refs:
  - ev:8
