canonical_text:
  quote: ''
  summary: A people living in an isolated sea-country behind a papyrus marsh are known
    for laughing only once. After seeing a neighboring army celebrate war, they ask
    their chief to assemble them for a boar hunt. Later, hearing a quail, they arm
    themselves as if against a great beast, surround it, and panic when it flies up.
    The passage then shifts to an editorial note on foreign tales and mixed Bantu,
    exotic, Asiatic/Mussulman, Portuguese, and English influences.
  language: English
  quote_policy: summarized
