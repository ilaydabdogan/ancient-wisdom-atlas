canonical_text:
  quote: ''
  summary: 'The passage describes fruit trees and fruit products in Thonga/Ba-Ronga
    agricultural life: fruit trees are spared when fields are cleared; sala, kwakwa,
    nkanye, and nkuhlu/tihuhlu provide food, drink, flour, oil, and fat; several products
    are valued during crop shortage or famine; and kwakwa stones are subject to a
    taboo because they are said to attract lightning if heaped in the open air.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fruit trees are systematically spared when fields are cleared, making cultivated
    land look like a large orchard.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sala fruit is described as a green ball that yellows when ripe, with a
    thin shell, many stones, and sweet yellowish pulp; it is considered invigorating
    and useful during crop shortage.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The kwakwa fruit is similar in shape and size to sala, turns orange-yellow
    when ripe, is not eaten uncooked, and is processed into strips that are dried
    or smoked, then pounded into flour when storehouses are empty before the new season.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sala and kwakwa are identified as species of Strychnos; the narrator states
    that they have not been known to kill anyone, though exclusive reliance on the
    fruit may cause intestinal troubles.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kwakwa stones are credited with attracting lightning, and old women say the
    stones must not be left in a heap in the open air because lightning would strike
    the village; this is explicitly called a taboo.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The nkanye tree is described as highly valued; its fruit is pressed to brew
    bukanye, and its oleaginous kernels, called mongo, are said to be food for kings.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: Mongo kernels are difficult to obtain because the stones are hard and the
    kernels small; stones are placed in prepared sockets and cracked with another
    stone, and mongo is sought in famine.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The nkuhlu/tihuhlu fruit is picked in November and December; people soften
    and suck the pulp in their mouths, then set aside the black nut, called nkampfi,
    for fat or oil uses.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Bululu and nkampfi are processed by drying, soaking, pressing, cooking, skimming,
    pounding, winnowing, and storing fats in calabashes, sala shells, or Achatina
    shells.
  category: sequence
  evidence_refs:
  - ev:9
