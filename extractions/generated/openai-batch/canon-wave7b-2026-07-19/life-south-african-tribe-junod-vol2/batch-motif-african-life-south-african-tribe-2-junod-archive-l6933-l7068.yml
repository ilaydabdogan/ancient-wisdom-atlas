canonical_text:
  quote: ''
  summary: 'The passage presents translated Thonga/Ronga song texts and ethnographic
    commentary: a festival song praising Chief Mpatshiki and invoking gods or ancestors,
    a dialogue-song mocking Gebuxa’s laziness, several categories of work songs, a
    women’s song about an overflowing lake and the hawk Mzila, carrier and sailors’
    songs used with rhythmic labor, and children’s incantatory songs to animals and
    an ox-waggon.'
  language: English with Thonga/Ronga song text
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Singers praise Chief Mpatshiki, describe a Ronge dance, and say the echo of
    their songs comes back from the gods along the villages.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator explains the festival as joyous and says the gods, identified
    probably as deceased ancestors buried near the village, join the living.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gebuxa is described as an interminable braggart who idles in the village shade
    of a nkanye tree instead of tilling his fields.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A chorus tells Gebuxa that there is a day for singing but that he is incapable
    of work, and the narrator states the moral that singing and dancing today should
    be followed by tillage tomorrow.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The narrator reports that Thonga people are fond of singing and shouting while
    working and that music and work are experienced as helpful together.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women sing songs while pounding mealies or carrying jars of beer or bukanye,
    including a song sung after an inundation about an overflowing lake and the hawk
    Mzila in the sky.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Carrier boys at Lourenço Marques use songs with a soloist while raising and
    carrying heavy loads rhythmically to a shed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A boy on the Nkomati repeats a sailors’ refrain while pushing a boat with
