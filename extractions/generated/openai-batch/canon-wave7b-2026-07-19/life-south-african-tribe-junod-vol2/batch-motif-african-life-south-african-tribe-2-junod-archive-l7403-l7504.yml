canonical_text:
  quote: ''
  summary: 'The passage discusses the variability of Thonga oral tales, especially
    the collected episodes of the Romance of the Hare. It says tales are old but continually
    transformed by narrators: words, sequence, characters, and even contents vary.
    Songs and some formulaic sentences are described as relatively fixed. The passage
    gives examples of trickster deeds moving among Hare, Small Toad, and the Zulu
    dwarf Hlakanyana; of modern objects and mission settings being inserted into tales;
    and of variants of the Zili moral tale involving spouse-killing, flesh cut into
    strips and served as meat, and a bird revealing or signaling the crime through
    song.'
  language: English
  quote_policy: summarized
