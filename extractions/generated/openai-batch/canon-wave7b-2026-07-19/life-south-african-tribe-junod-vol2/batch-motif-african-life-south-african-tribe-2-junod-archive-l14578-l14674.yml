  text: The grass from the ram's paunch is squeezed over the pot so that green liquid
    drips into it, and the blood is spread over the place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Four furrows are dug in the form of a cross, with the pot at the center and
