canonical_text:
  quote: ''
  summary: The passage describes extraordinary national offerings connected with rain,
    especially the phokolo rite involving a buried pot, a black ram, ritual fluids,
    cardinal furrows, and girls fetching water. It also describes variants involving
    graves and sacred woods, then gives an account of the Tembe and Zihlahla mhamba,
    a sacred relic made from deceased chiefs' bodily remains, its custody, ritual
    use, wartime protection, and a story in which its capture caused drought until
    it was returned through a goat cast into a boundary river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The phokolo sacrifice is performed when rain fails to fall at the right season;
    it is not performed if rain falls at the proper time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rite begins with consultation of bones and the burial of a special pot
    called phokolo just below the ground in a clean, hidden place within a dense thorn
