canonical_text:
  quote: "“The bones have given a triple revelation: they have depicted the actual
    position, shown its cause, and indicated its course and the remedy.”"
  summary: The passage describes Thonga/Tsonga divination by bones and related tokens
    for predicting rain, determining where ritual dirt should be thrown, deciding
    when to sow crops, diagnosing and treating a sick mother, and consulting an oracle
    before a battle.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A rain prediction is read from named tokens, including ram, he-goats, tortoises,
    olivae, and baboons; favorable signs indicate wet forest, dark soil, closed huts,
    and plenty, while an unfavorable Baboon sign would indicate damaging winds and
    starvation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For disposal of timbhorola, the diviner asks a location question, throws the
    bones, and repeats with another possible place until the answer is positive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The diviner’s first stated disposal question is whether the timbhorola should
    be thrown in the river; another stated possibility is an ants’ nest.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Chiefs consult the bones to know whether it is time to sow pumpkin and millet
    seeds; a specified configuration of sea-shells and ram and ewe astragali means
    sowing may begin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the sick mother case, the central She-goat sign is read as the mother lying
    sick on her back.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Antelope and red Oliva, called Malumbi, are described as looking toward the
    sick mother and as the malignant influences that put her in that state.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: An open Cypraea on the mother’s left is said to show dysentery.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father, represented by He-goat, is not entirely discouraged, points toward
    the kanye medicine, speaks with his children, goes to the bush, and returns as
    a traveler with a drug he has dug up.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The father’s action is said to keep Wild sow, an ancestor-god, from adding
    hostile influence to the existing influences.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'Several signs in the sick mother reading are unfavorable: Crocodile stones
    speak of death, little Oliva looks hostilely at the father, an open Cypraea marks
    lamentations, Ant-bear comes to dig the grave, and Gazelle and Tortoise lie on
    their backs.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that the bones reveal the present condition, the cause,
    the course, and the remedy; the case has hope if the father finds the right drug,
    but a different He-goat and Wildsow configuration would make it hopeless.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: When Sikororo’s hostile army was signaled, Mankhelu, in fear, consulted his
    bones, and the passage reports a prophecy of the victory that occurred the following
    day.
  category: action
  evidence_refs:
  - ev:9
