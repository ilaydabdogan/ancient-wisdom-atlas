canonical_text:
  quote: ''
  summary: The passage describes possession among the Thonga as a medical, religious,
    and magical condition called the disease or madness of the gods. It identifies
    the possessing spirits chiefly as Zulu and Ba-Ndjao spirits rather than Thonga
    ancestors, links them to travel, war, and migration, notes diagnostic features
    such as language-specific incantations and white beads worn in the hair, and states
    that many cases begin with an unconscious crisis.
  language: English
  quote_policy: summarized
