canonical_text:
  quote: '"crossed the sea": he enters a new life'
  summary: The passage describes a possession treatment involving drumming, medicinal
    pellets burnt under a calico covering, prayer to Ngoni spirits, interrogation
    of the possessing spirit, disclosure of names and genealogy, possession songs,
    and a gobo basin rite in which the patient’s eyes are immersed in water and the
    act is described as crossing the sea and entering a new life.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The patient is covered with a large piece of calico during a drum performance
    while medicinal pellets are burned under the calico in a broken pot of embers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first medicinal pellet is described as male and made with fat of an ox
    or he-goat; the second is female and made from fat of a she-goat; a third pellet
    is described as neither male nor female and as having the strongest expected effect.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Rwatshulu prays to Ngoni spirits or gods and asks that any swallowed snake
    or toad blocking the spirits’ exit run away and provide an egress.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the second pellet nearly burns, the patient begins trembling, women
    sing louder, and the gobela calls for the Ngoni spirit to come out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The gobela questions the dancer under the veil about identity, including whether
    the being is Zulu, Ndjao, or a hyena.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The patient answers affirmatively to being Zulu and then says, "I am Mboza";
    Mboza is identified in the passage as a Ronga who died in Kimberley years earlier.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: During a crisis the patient rises, attacks assistants, scatters them, and
    runs from the hut feeling as if spirits are beating him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage reports that in such crises a patient may throw himself into fire
    without feeling hurt, fall into catalepsy, or strike his head against wood or
    ground without feeling pain.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Tambourine performance may continue for several days, a week, or a fortnight,
    depending on the patient's nervous condition and weakened state from fasting and
    suffering.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Once a spirit discloses its name and title, it is known and can be interrogated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: A possessing spirit in Spoon’s wife says it entered the husband while he was
    seated on a stone, then left him on his return home and entered his wife.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: A possessing spirit may say it is accompanied by son and grandson, and the
    possessed person may pronounce as many as ten different names.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The gobela may ask for the father and grandfather of a possessing spirit to
    identify it by genealogy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: A spirit may demand a nturu, described as a piece of calico of a specified
    colour.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: Every possessed person is said to invent a personal song that can later provoke
    or cure crises or trances.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: The passage states that these songs are generally in Zulu and that a patient
    may use Zulu without knowing it, described as a miracle of tongues.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: In the gobo rite, the patient’s head is dipped so that at least the eyes are
    plunged into water, and the gobela tells the patient to open his eyes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The patient feels burning, sees a red field with black dots, raises his head,
    and the water falls over his face and body.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: The passage says the patient is purified, but also says the gobo rite is not
    essentially purification; it is called a kind of baptism by which the patient
    has crossed the sea and entered a new life.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:20
  text: After the gobo rite, the patient is said to be able to speak because he has
    seen everything, and the drug is called one that makes one see.
  category: attribute
  evidence_refs:
  - ev:9
