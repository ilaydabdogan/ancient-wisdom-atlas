canonical_text:
  quote: ''
  summary: The passage describes the guarding of sorghum and other crops from sparrows
    through noise, field huts, shell cords, and scarecrows; the consumption of bukanye
    beer; the harvest sequence for maize, beans, ground-nuts, sorghum, and Kafir corn;
    drying, threshing, winnowing, and storage practices; and a taboo against weaving
    a harvest basket before harvest, explained by comparing unharvested Kafir corn
    to an unborn child. It also introduces agricultural taboos connected with hierarchy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Crop watchers make noise with tin cans and other instruments to scare birds
    described as thieves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Flocks of sparrows and other birds move from one field to nearby acacias or
    mimosas and then descend on neighboring fields.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A mother and children ask the father to build a small hut in the middle of
    the field, and they stay there until the cereals ripen for harvest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In marshy Lebombo lands, a cord stretched across a field and strung with large
    snail shells is pulled so that the shells jingle and frighten birds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: Ordinary stuffed-figure scarecrows are set up in some places.
  category: object
  evidence_refs:
  - ev:1
- id: obs:6
  text: Bukanye beer is consumed from mid-January to the end of February, and the
    passage says sorghum especially needs protection from birds after bukanye.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The agricultural year ends with harvest; each person harvests their own fields
    and tries to keep the produce separate in their own storehouse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Maize ears are broken off, piled in conical baskets, and put in the storehouse;
    beans ripen later in the period called the time of beans; ground-nuts are pulled
    from the earth with their pods attached.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Men construct drying floors from mats supported by poles, and ground-nuts
    and peas are laid on them to dry in the sun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sorghum and Kafir corn are threshed on a prepared hardened and clay-smeared
    floor, beaten or lightly pounded, collected in baskets, and winnowed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The best grains are preserved for seed, and Kafir corn and sorghum are stored
    in a large ngula basket.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: It is taboo to weave the ngula before harvest, and unharvested Kafir corn
    is described as a child not yet born.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Maize is kept in raised reed storehouses with movable roofs; the storehouses
    belong to the husband although the wife has done most of the tilling and all of
    the weeding.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the Transvaal, beans, peas, and ground-nuts are packed in clay-smeared
    dula or in small storehouses hung from tree branches.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: When storehouses are full after a plentiful harvest, winter becomes a time
