canonical_text:
  quote: ''
  summary: The passage reports Thonga ideas about the origin of the world, named originator
    figures, a story that early stones were soft, an elder explanation that men originated
    from a reed, cosmological descriptions of heaven as a solid vault resting on earth,
    and differing explanations of the daily course of the sun, including emergence
    from water and a source of fire or passage under the earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A proverb or riddle answers the question of who created heaven and earth with
    “Nature,” rendered by the author as Ntumbuluku.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that Ntumbuluku comes from a verb meaning to happen or be
    formed and does not convey a clear idea of creation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some people name Rivimbi, Kudjwana, or Nwari as the originator of heaven and
    earth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rivimbi and Kudjwana are identified in the passage as Venda or Pedi names
    of the first human beings.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Nwari, also called Nwali or Myali, is described as a god of the Bi-Myii whose
    legend spread among northern Thonga clans, especially the Hlengwe and Maluleke.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the story of Nwari, stones were not yet hard when he lived, and early implements
    left impressions on rocks.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says these named personages are primarily creators of mankind.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Rangane asked his mother who made heaven and earth; she answered that it was
    Khudjwana, who had died long ago and whose burial place was unknown.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Old men answered Rangane’s question with the statement that all men originated
    from a reed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Heaven is described as an immense solid vault resting on the earth.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The point where heaven touches the earth is called bugimamusi, explained as
    a place where women can lean pestles against the vault or pound mealies kneeling
    because the vault is low.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The earth is often called libala, the great plain; the author says he heard
    no answer to what the earth itself rests on.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Some people answer the problem of the earth’s support by saying that the earth
    is infinitely prolonged downward and has no bottom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The sun is said not to be personified or worshipped.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: In the Makaneta district, people are reported to believe that the sun emerges
    from water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The post-sunrise reflection on the sea is treated as a source of light or
    “provision of fire” from which the sun emerges and renews itself every morning.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: In that explanation, the sun is cut out from the provision of fire, sticks
    to heaven, follows its course, and dies in the West; another sun comes out the
    next day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:18
  text: Other people object that there is only one sun, which passes under the earth
    and returns the next day.
  category: speech
  evidence_refs:
  - ev:8
