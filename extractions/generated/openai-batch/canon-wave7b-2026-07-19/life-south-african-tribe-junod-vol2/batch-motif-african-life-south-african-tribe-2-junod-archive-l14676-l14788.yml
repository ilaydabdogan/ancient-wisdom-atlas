canonical_text:
  quote: ''
  summary: 'The passage describes a typical ancestral sacrifice: divination by bones,
    presiding priesthood by the eldest family member, provision and killing of animal
    victims by uterine nephews, setting aside and consecrating parts of the victim,
    prayer, ritual use of psanyi, ritual removal and eating of the offering by nephews,
    and the wearing of animal parts by an individual beneficiary. It also discusses
    Thonga rules of priesthood, dream-triggered worship of deceased parents, and hereditary
    custody of clan or national sacred objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bones are consulted before the sacrifice and indicate the god addressed, the
    time, the manner, and the person by whom the sacrifice is to be made.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The officiant is ordinarily the eldest male family member, and victims are
    brought by designated or voluntary providers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Uterine nephews kill the victims: goats or sheep by piercing the heart, and
    hens by cutting the throat; in some cases a goat''s face is directed toward a
    horizon point.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the killing, uterine nephews utter cries of joy at each thrust, described
    as consenting or answering and accepting the offering on behalf of the gods; the
    crowd joins in the joy.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The victim is opened, limb portions and psanyi from the intestines are set
    aside for the gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The priest puts psanyi mixed with blood to his lips, adds saliva, and spits
    it out in the act called tsu, described as consecrating or forwarding the offering
    to the gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The priest pronounces the prayer, which may be interrupted by a family member's
    complaint.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: In certain cases of special misfortune, the priest squeezes green liquid from
    the psanyi over hearers, who rub their bodies with it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: One nephew ends the prayer by taking consecrated beer or wine, or part of
    a hen's gizzard, into his mouth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The uterine nephews steal the offering, run away, are pursued by the crowd
    throwing pellets of psanyi, and eat the portion of the gods.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: When the offering is made for a particular individual, the goat astragalus
    or parts of the hen are tied to him and worn on the left side for maternal ancestors
    or the right side for paternal gods.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Thonga are described as having no sacerdotal caste; officiating in major
    religious ceremonies is restricted to the eldest family officiant, and supplanting
    him is taboo.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: After his parents' death, a son who dreams of them worships them by pouring
    ground tobacco on his wooden pillow; this is described as the beginning of his
    religious functions.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: A clan sacred object, mhamba, or national drug of invulnerability may be entrusted
    to a hereditary custodian; the Nondwane national amulet is said to have been cared
    for by the Godhlela family.
  category: relationship
  evidence_refs:
  - ev:14
  - ev:16
