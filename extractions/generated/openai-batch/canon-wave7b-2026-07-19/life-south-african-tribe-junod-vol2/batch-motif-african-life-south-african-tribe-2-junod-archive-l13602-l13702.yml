canonical_text:
  quote: ''
  summary: 'The passage explains Thonga conceptions of ancestor-gods: deceased people
    become psagext; ancestor-gods are grouped by family, country, parental side, violent
    or improper deaths, and bush spirits; offerings and invocations are directed according
    to circumstance and divination; improperly buried or violently dead spirits are
    feared, especially in the bush.'
  language: English
  quote_policy: summarized
