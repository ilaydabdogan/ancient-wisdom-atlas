canonical_text:
  quote: ''
  summary: 'The passage describes medical practices and pharmacopoeia among the Thonga/Tsonga
    as reported by Junod: reactions to surgery, treatments for bruises, tooth extraction,
    snakebite inoculation, plant-based remedies, prepared root bundles, medicinal
    containers and amulets, purgatives, medicines for infant growth, and an analogical
    treatment using burnt parasite powder.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gungunyane is described as horrified by Dr. Liengme's amputations and body-cutting
    for cure, despite being described as having killed many Ba-Chopi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A treatment after a fall uses fire, glowing embers, heated soil, cool river
    sand, nkuhlu leaves, and the patient leaning over the treated spot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The author explicitly explains the fall treatment as an application of the
    principle that like cures like: burned soil is cooled so the bruise will not burn
    dangerously.'
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Decayed teeth are described as broken down with a piece of iron struck by
    a hammer, sometimes causing serious jaw injury.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Snakebite treatment uses powder made from a snake burnt to ashes, mixed with
    ingredients and salt, placed into incisions at joints and the front of the neck.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Children are inoculated preventatively against snake venom, and the doctor
    is said to have 'preceded the snake.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Headache treatment uses fresh bark of the nhlangula root scraped, folded in
    cloth, and applied to the forehead for half a day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Toothache treatment uses nhlangula with ndjenga, boiled into a decoction held
    in the mouth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Colic or looseness of the bowels is treated with a root bunch called shitsimbo,
    prepared by cutting roots to equal lengths, tying them with palm leaf, boiling
    them, and drinking the decoction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The pharmacopoeia illustration lists a maize-bract medicine box, shitsimbo,
    mole skin containing powdered drugs, a pill, a bracelet, timfisa amulets, and
    sungi root tied around the ankle.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Named plant prescriptions are given for dysentery, bronchitis or head cold,
    and hydrocele; hydrocele is said to be regarded as contagious through matrimonial
    relations.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: One purgative is aloe or cactus sap squeezed onto grains and stored in maize-leaf
    boxes; another is tree bark from the Nkomati valley, which Eliashib reportedly
    administered in harmful large doses.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Medicines called milombyana are said to promote the growth of newly born infants.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: When an intestinal parasite is expelled by dlanyoka, it is burned to cinders,
    powdered, and rubbed into incisions on a child's belly and loins as an inoculation
    described as like curing like.
  category: action
  evidence_refs:
  - ev:10
