canonical_text:
  quote: ''
  summary: The passage gives connected animal-tale episodes. A Hare uses a lion jawbone,
    a stake enclosure, and a dazzling mirror-covered coat to trap the animals and
    pose as king, imposing a grass-only law until a sick Lion devours him and the
    enclosure order collapses. A successor Hare is then deceived by Hen into cutting
    off his own head, after which Hen is said to be the most cunning animal. A new
    tale begins in which Hare tricks Baboon into killing his own wife while Hare spares
    his own, and later distracts Baboon with stolen ground-nuts while fixing Baboon's
    tail into a hole.
  language: English
  quote_policy: summarized
