  evidence_refs:
  - ev:1
- id: obs:3
  text: The villagers catch Baboon by his blackened, twisted-up tail stump and chop
    it off.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hare asks Grey Antelope to go sow peas; Grey Antelope refuses, saying she
    prefers wild beans, and Hare sows peas by himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Hare notices his sprouting peas disappearing, he hides in the field and
    catches Grey Antelope digging them up.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hare calls Grey Antelope a thief and demands a fine; Grey Antelope gives him
    a hoe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Hare lends the hoe to women digging clay with sticks; the last user breaks
