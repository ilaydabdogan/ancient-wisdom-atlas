  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hare gives the pot to men harvesting honey in tree-bark; the pot is broken,
    and the men give him honey after his sung demand.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hare gives honey to women pounding maize flour; the last woman finishes it
    all, and they give him dough after his sung demand.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Hare gives dough to boys herding goats; the last boy eats the last bite, and
    they give him a goat after his sung demand.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hare gives the goat to young men tending oxen; the goat is entirely eaten,
