canonical_text:
  quote: ''
  summary: 'The passage first concludes a tale in which Baboon publicly accuses Hare,
    Hare produces evidence and reverses the charge, and villagers mock and punish
    Baboon by cutting off his tail stump. It then gives the tale of Hare''s hoe: Hare
    catches Grey Antelope stealing his peas and receives a hoe as a fine. Hare successively
    lends or gives the hoe, a pot, honey, dough, a goat, and an ox to different groups;
    when each item is broken or consumed, he sings a cumulative demand that recites
    the whole chain of compensation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a village full of men playing fsbuba, Baboon arrives proudly and asks whether
    anyone has seen a person feasting on his own excrement; he identifies Hare as
    such a person.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hare holds up a one-legged fowl before the assembled people and tells his
    story, after which the crowd laughs at Baboon rather than Hare.
