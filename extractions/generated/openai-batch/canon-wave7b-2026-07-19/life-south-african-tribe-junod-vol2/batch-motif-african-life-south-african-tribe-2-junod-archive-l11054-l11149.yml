canonical_text:
  quote: ''
  summary: 'The passage describes Thonga terminology and practices concerning divisions
    of the day, eclipses, the year, light and colors, and especially the moon: lunar
    spots, new-moon acclamations, taboos, crescent omens, exorcism, lunar madness,
    and the monthly disappearance or death and renewal of the moon.'
  language: English
  quote_policy: summarized
