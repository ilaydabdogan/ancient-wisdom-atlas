  text: The day is divided into named stages from dawn through twilight, followed
    by night.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eclipses are described as not causing panics among Thonga; when warned of
    one, people are said to be more struck by White people's knowledge than afraid
    of the darkening sun or moon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The year is described as vague, beginning either at tilling or at harvesting
    first fruits, with no distinction made between solar and lunar years.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Light is glossed as that which makes things appear, and the passage lists
    several color terms and their ranges.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The moon may once have been personified, according to the author, but the
    passage says there is no current trace of worship or mythological conceptions
    connected with it.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lunar spots are described as being seen as a woman carrying a basket or a
    bundle of sticks.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the first sight of the new moon, a person shouts an acclamation naming
