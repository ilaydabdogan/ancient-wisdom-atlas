  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The new moon is important in exorcism and possession customs; every exorcist
    must undergo purification at each new moon.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage reports a belief that some persons have an attack of madness at
    the new moon, called lunar madness.
  category: attribute
  evidence_refs:
  - ev:9
