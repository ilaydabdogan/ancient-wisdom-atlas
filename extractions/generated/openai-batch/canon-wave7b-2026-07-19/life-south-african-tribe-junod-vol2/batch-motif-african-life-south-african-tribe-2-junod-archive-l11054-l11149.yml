  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The new moon is described as needing to become firm and as still tender like
    a newborn child; transgressing the taboo may bring destructive winds and hail.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'The crescent''s horns are examined: horns toward earth mean dangers have
