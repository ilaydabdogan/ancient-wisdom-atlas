  summary: The passage discusses Thonga descriptive adverbs as a rich class of expressive
    words. The author describes classroom collection of many examples, argues for
    their grammatical classification as adverbs rather than interjections or substantives,
    compares their presence across Bantu languages, and gives examples of their relation
    to sound, gesture, action, and verbal derivation.
