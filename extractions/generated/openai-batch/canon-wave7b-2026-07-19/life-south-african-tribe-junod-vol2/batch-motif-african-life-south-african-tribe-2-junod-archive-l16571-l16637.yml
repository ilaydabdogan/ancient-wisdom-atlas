canonical_text:
  quote: ''
  summary: The passage describes Thonga treatments for nervous diseases, including
    delirium, ribuhe insanity, convulsions, epilepsy, and cupping. Treatments use
    holes, decoctions, sticks, animal substances, blood, broken pots, burial in an
    ant's nest, body applications, leaves, a grass monkey effigy expelled from the
    village, and a cupping horn. The narrator explicitly compares the disease-expulsion
    effigy rite to a scapegoat rite and cites a tale in which a girl resuscitates
    a buffalo by cupping.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that nervous diseases are especially feared; melancholia
    is attributed to possession spirits, and idiocy is described as having no remedy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: For delirium, the patient enters a clay-extraction hole and is washed with
    a decoction of Mbulula khutla; a stick from the same tree is kept in the hut roof
    and placed near the patient's head at night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ribuhe is named as a form of insanity described as coming from far away with
    the winds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: For ribuhe, sbiromo root, sheep lung, and blood from the sheep's heart are
    burnt in a broken pot; the patient's head is cut so blood fills the pot, where
    it boils, becomes firm, and is burnt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The nanga buries the processed material in an ant's nest, fills the patient's
    wound with medicine, and the patient eats meat and sleeps; the cure is described
    as killing ribuhe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wutleka is said to include both convulsions of little children and epilepsy;
    children's convulsions are generally explained by the agency of Heaven.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: For epilepsy, monkey and baboon skin and stools, with pieces of lion skin,
    are roasted in a broken pot, made into powder, and applied to the patient's limbs
    and body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The epilepsy patient is laid down with Kigelia leaves on the head; sleep,
    urination, stool evacuation, and cure are listed as resulting signs.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: To confirm healing, the doctor makes a grass image of a monkey, smears it
    with the same drugs, and ties it with a long rope.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A little boy drags the dummy out of the village while other boys hit it with
    sticks and say it should go away; the boys hang it on a distant tree in the bush,
    and the disease is said to be expelled.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator summarizes about twenty prescriptions using roughly forty to
    fifty drugs in applications such as outward application, inhalation, fumigation,
    infusion, decoction, inoculation, and ingestion of carbonized or pulverized substances.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the cupping example, a cited story has a young girl resuscitate a buffalo;
    the described operation uses boiled water with roots, incisions in the temporal
    region, a horn used for suction, vapor from the boiling packet, and ointment from
    a calabash.
  category: sequence
  evidence_refs:
  - ev:8
