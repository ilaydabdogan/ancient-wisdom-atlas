canonical_text:
  quote: Music under a more or less rudimentary form, plays a great part in the Life
    of the Bantu tribe.
  summary: 'The passage introduces Thonga and neighboring Bantu musical practice and
    describes several musical instruments: shell and bone flutes, antelope-horn trumpets
    used in court bands and contests, unicord harps with calabash sounding boxes,
    and the timbila xylophone. It also describes training, judging, and proclamation
    procedures for bunanga trumpet-band contests before a chief.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Music is described as important in Bantu life; the Ba-Chopi are identified
    as especially gifted musicians, and the Thonga are described as singers and players
    whose dances are accompanied by music.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shiwaya is described as an empty shell with two holes; children sing through
    one hole and alternately open and close the other to emit a monotonous sound.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The nanga, or goatherd's flute, is made from the tibia of a goat or another
    animal, and boys play two notes on it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Other flutes include the ndjwebe, sometimes kept clean with a feather inside,
    and a reed flute called shitiringo or shithti with holes for the mouth and fingers.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tinanga are antelope-horn trumpets used in the bunanga band; ten differently
    sounding trumpets form a simo orchestra completed by large and small drums.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bunanga instruments accompany special dances at the small capital of Ronga
    clans, where the players themselves dance, march, and alter the size of their
    circle to the drumbeat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bunanga players receive training before going to the capital to play before
    the chief in a musical contest led by sub-chiefs and judged by the tinduna.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A young male herald proclaims the contest verdict while holding an axe, strikes
    the trunk of a tree, and runs away to avoid protests and insults from losing groups.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bunanga tune is described as monotonous, with dance, rhythm, and bodily
    contortions presented as more important than melody.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The gubu is a unicord harp with forms called shitjendje and nkaku, using a
    bow, string, stick, and calabash sounding box.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The timbila is described as a Bantu xylophone or native piano with ten hardwood
    keys fastened by leather straps on a curved wooden frame.
  category: object
  evidence_refs:
  - ev:8
