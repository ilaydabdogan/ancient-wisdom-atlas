- id: obs:3
  text: If the fowl flies away noisily, the exorcist interprets this as sin that has
    spoiled the medicines and leaves; if the fowl remains still, it is stabbed and
    its blood is used in hondlola friction.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the fowl is plucked, village people eat it, while the patient, the patient’s
    spouse, and the exorcist-in-chief may not eat it; after this, husband and wife
    may live together again.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: In Mboza’s case, he pays the doctor with money and beer; the doctor stirs
    medicine in a gobo calabash until it froths while invoking gods, then orders Mboza
    to eat, and Mboza kneels and swallows the froth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The exorcist mixes fat with medicinal powder, rubs Mboza’s body, cuts nails
    and a little forehead hair, and places these cuttings with medicinal powder in
    timfisa bags.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: A pellet made from crushed roots is used to rub Mboza’s body; particles fallen
    on the mat are gathered, mixed with hen blood, and rubbed on the patient again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Additional fallen particles are gathered; some go into amulet bags, and the
