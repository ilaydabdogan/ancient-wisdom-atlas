canonical_text:
  quote: ''
  summary: 'The passage describes Thonga/Tsonga hondlola rites following possession
    treatment: a fowl tests continence, animal blood and medicinal substances are
    used in ritual friction, cut nails and hair are placed in amulet bags, and a forked
    branch is installed as the new magician’s drug store and altar to possessing spirits.
    The author interprets the sequence as the last stage of initiation into the society
    of magicians, marked by rebirth language, lunar renewal comparison, prior calabash
    baptism, blood-drinking, taboos, and later protective rites against witches and
    rival magicians.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hondlola rite is described as removal of disease defilement and as necessary
    when a possessed person is considered healed.
