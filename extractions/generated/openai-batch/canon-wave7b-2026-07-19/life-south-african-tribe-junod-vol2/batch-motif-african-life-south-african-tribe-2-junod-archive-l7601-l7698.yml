canonical_text:
  quote: ''
  summary: The passage summarizes a tale in which a child, during famine, is accepted
    and fed by one wife of a headman, uses an enchanted hoe to produce a harvest,
    and later kills several groups and takes their possessions. The author then discusses
    Thonga/Bantu storytelling as repeatedly emphasizing the triumph of wisdom, smallness,
    or cleverness over brute force, including animal tricksters, despised low-status
    figures, defeated ogres, and evening storytelling by women and children as an
    indirect response to social hierarchy.
  language: English
  quote_policy: summarized
