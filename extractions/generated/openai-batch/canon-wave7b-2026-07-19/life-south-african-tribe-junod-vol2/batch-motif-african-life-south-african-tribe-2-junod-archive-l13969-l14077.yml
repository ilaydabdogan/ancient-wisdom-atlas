canonical_text:
  quote: ''
  summary: The passage describes several Thonga sacred woods associated with ancestor-gods,
    including moving ritual objects, unseen sounds, sacrifice, rain rites, animal
    and dream manifestations of ancestors, and offerings made to appease or thank
    them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sacred wood of Tlhatlha is said to contain an enormous pot that can move
    by itself, hide in grass and shrubs, and move along the graves.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pot at Tlhatlha is taboo to touch.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Portuguese campers near Tlhatlha heard nocturnal drum and trumpet noises,
    and local people warned them that gods were present, after which the camp was
    moved.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At the wood of Tembe, a priest used an anchor in a pre-sacrifice act, lifting
    it and letting it fall while saluting Tembe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: An acceptable sacrifice at Tembe was said to be signaled by a faraway trumpet-like
    sound in the woods, without any visible form.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The anchor of Tembe was said to move by itself to the Matjolo district during
    wartime when matters went badly, and this was treated as a portent of catastrophe.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sacred wood of Tiyini was said to be dangerous to enter deeply because
    a person might become lost and unable to find the way out.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the people of Matjolo needed rain, they took a young man into the Tiyini
    wood and abandoned him there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The young man abandoned in the wood was described as paralyzed, unable to
    follow those who brought him, and left to be devoured by the gods.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Those returning from the Tiyini rite were forbidden to look behind and later
    reported footprints of adults and small crawling children in the wood.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that, according to these stories, Thonga ancestor-gods
    dwell in sacred woods and live in the earth and sometimes outside it.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mankhelu’s forked magic pole bore a thorny nwabola branch said to call distant
    precious things and ancestor-gods into the hut.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The ancestor-gods passing from an old domicile near the Limpopo were said
    to be caught by the thorns and settle there to bless the people.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage says ancestor-gods more commonly reveal themselves as animals,
