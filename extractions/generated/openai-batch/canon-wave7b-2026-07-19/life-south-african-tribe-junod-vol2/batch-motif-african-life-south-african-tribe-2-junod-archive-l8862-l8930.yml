canonical_text:
  quote: ''
  summary: A chief named Mabayi arranges to marry Mashomo's daughter by paying the
    requested lobola. The bride begins the journey to her husband's home with a beloved
    young servant. Their escorts go ahead, leaving the two maidens alone. At a fig-tree,
    a ripe fig thrown by an ogre falls before them; the servant picks it up, later
    suffers stomach pain, falls, and dies. The bride mourns and buries her companion.
    The ogre descends from the tree, feigns sympathy, mimics the bride's lament, takes
    up her basket, urges her onward, and denies her accusation that he killed her
    companion.
  language: English
  quote_policy: summarized
