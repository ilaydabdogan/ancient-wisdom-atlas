canonical_text:
  quote: '"they have tilled the ground, and harvested without presenting us with any
    offerings"'
  summary: The passage recounts a tale in which the people of Mashaken neglect offerings
    to their gods and famine follows. Attempts to gather sugar cane and honey are
    supernaturally blocked. Divinatory bones direct the young girl Sabulana to sacrifice
    in the sacred wood, where assembled gods announce that the people have sinned
    by harvesting without offerings. The author then characterizes Thonga, and broadly
    Bantu, ancestrolatry as spirit-focused, family-based, hierarchical, non-idolatrous,
    largely non-moral, eudemonistic, ritualistic, and marked more by indifference
    than constant fear.
  language: English
  quote_policy: quoted
