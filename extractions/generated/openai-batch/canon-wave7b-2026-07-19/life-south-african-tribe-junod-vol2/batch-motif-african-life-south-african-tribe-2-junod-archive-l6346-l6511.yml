canonical_text:
  quote: ''
  summary: The passage surveys Thonga war songs and their associated military dance,
    introduces laudatory and hinting songs, gives an elephant-hunt song said to be
    performed by hunters over the slain animal, and then describes satirical wedding
    and affinal songs sung by women escorting or visiting a bride at her husband's
    household.
  language: English with embedded Thonga phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Named war songs are associated with military, coronation, battle-preparation,
    battle-return, and marching contexts, and are attributed to or compared among
    Mpfumo, Tembe, Maputju, Nkuna, and Ronga repertories.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old war chants are sung with a military dance involving trampling the
    ground, rhythmically brandishing assagais, moving them right and left, inclining
    them, and lowering them as if to pierce.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The laudatory song of the mlwngi is described as a branch in which court poets
    use imagination and unbounded hyperbole.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A hinting song example is said to have been performed by hunters while dancing
    on the body of an enormous beast after they had transfixed it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elephant song describes elephants marching in single file, going to drink,
    drinking among thickets, and producing smothered roars in the forest.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Later strophes describe a mother elephant calling hunters to the thickets,
    a large-eared elephant passing, and boys sharpening knives at the place where
    the elephant lies slain.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator characterizes the elephant song as a triumph song connected with
    obtaining elephant tusks and quantities of meat.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: Thonga literati are described as using round-about figurative language, especially
    for disagreeable speech or humour, and this practice is linked to satire among
    relatives-in-law.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Women escorting the bride on the wedding day sing that they will go with her
    but return to their homes; the passage explains this as an ironic statement that
    the bride is going to find trouble.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Songs accompanying the bride to her new home mention a basket of maize, a
    fan, repeated crushing of maize, and repeated plastering of the floor.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: Women visiting the newly married couple carry beer jars as presents, ridicule
    the husband and his family, sing of meat, a dragged hook, misfortune, a daughter’s
    nearness, a limping grandmother with a staff, and a cackling hen, and stop at
    the edge of the stream on arrival.
  category: sequence
  evidence_refs:
  - ev:10
