- id: obs:3
  text: The ancestor-gods are described as non-moral.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bantu law called nau is described as the interest of the clan; theft,
    blows, insults, murder, and witchcraft are condemned because they endanger society
