canonical_text:
  quote: ''
  summary: The passage is an ethnographic argument about Bantu/Thonga morality, taboo,
    and sacredness. The author claims that morality is socially and juridically grounded
    in clan interest rather than in a divine legislator; ancestor-gods are described
    as non-moral. The passage distinguishes moral restraint from taboo, notes limited
    forms of sacredness attached to the chief and elder-brother precedence, and includes
    an anecdote about an injured out-clan railway worker saved by Lois.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author characterizes the morality under discussion as lax, including advice
    that one may steal if not caught and a claim that lies are treated lightly when
    not intended to harm others.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that moral law is not considered to have been proclaimed
    by a personal, transcendental God, and that no relation is established between
