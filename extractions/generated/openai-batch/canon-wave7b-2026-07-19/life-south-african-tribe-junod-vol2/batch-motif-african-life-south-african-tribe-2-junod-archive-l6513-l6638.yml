canonical_text:
  quote: ''
  summary: The passage describes a Thonga/Tsonga song sequence in which women travel
    to the home of relatives-in-law, complain that a sister is mistreated, and use
    ritualized insults and demanding speech toward the hosts. They ask for better
    drink and food, reject fowls in favor of a goat, insult the husband, allude to
    bridewealth, and depart after eating, drinking, and dancing. The author notes
    that this rude speech is treated as appropriate for the occasion rather than as
    ordinary impoliteness.
  language: English with Thonga/Tsonga song lines
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The travellers compare themselves to heavily laden women returning from fields
    and dragging a fruit-picking hook, implying that their journey is not for pleasure.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated purpose of the journey is to visit a brother-in-law who is said
    to ill-treat their sister.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: An old woman who finds the walk tiring is encouraged with the promise of a
    fowl at the journey's end, and a song line calls the young women to drink water
    in the valley.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On reaching the home of their relatives-in-law, the visitors settle there
    and begin insulting their hosts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The visitors say the hosts refuse to lend their sister a grindstone, pestle,
    and mortar, telling her to fetch her own tools from home.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The visitors mock the mother-in-law for whispering with other village women
    and pretend that the whispers reveal a threatening plot.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The visitors ask the village head for water but specify that they want beer
    and brandy rather than well-water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: When villagers approach to salute the newcomers and large cooking pots are
    prepared, the visitors sulk and call themselves enemies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When young people catch fowls for them, the visitors reject fowl and demand
    the animal led with a string, identified in context as a goat.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'The husband receives severe insults: the visitors say he avoids them, demand
    rich fat, and call him a serpent and a dog.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The visitors also tell the husband to buy another wife from them and say his
    daughters will later bring him a dowry worth fifteen pounds.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: After eating, drinking, and dancing, the visitors leave with a line asking
    for the goat's bladder to be twined in their hair.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The author explicitly states that the rudeness is not meant as a lack of politeness
    but as behavior suited to the occasion among relatives-in-law.
  category: other
  evidence_refs:
  - ev:10
- id: obs:14
  text: The author adds that in another song bridesmaids exhort the bride not to follow
    her husband, though they do not expect her to obey that advice literally.
  category: speech
  evidence_refs:
  - ev:10
