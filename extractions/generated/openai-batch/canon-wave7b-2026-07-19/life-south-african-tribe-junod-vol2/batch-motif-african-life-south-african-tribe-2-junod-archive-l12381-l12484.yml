  summary: The passage catalogues reptiles and birds in Thonga/Tsonga ethnographic
    description, with associated beliefs about lizards, chameleons, crocodiles, tortoises,
    snakes, legendary serpents, divination, taboo objects, ancestor-spirit emissaries,
    omens, and deadly encounters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several lizard kinds are named, including a house lizard, hill lizard, small
    sand-running agama, large gecko, and a grey lizard hiding in dark places.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A grey lizard hiding in dark places is said to attach to a human breast so
    firmly that the remedy is to suckle a dog.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Herd boys throw ground tobacco into a chameleon's mouth because it is blamed
    for delaying on the road and arriving too late with a message of eternal life
    for mankind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Certain magicians use a chameleon smeared with a whitening drug to discover
    thieves; the thief is said to turn white and die if he does not confess.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Crocodiles are said to swallow a stone each year when the rains begin, so
    that their age may be known by counting the stones found in the stomach.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Crocodile stomach stones are taboo for subjects to swallow, but one treated
    stone may be swallowed by the chief to warn him of his death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tortoises are eaten and are also said to be used in divinatory art.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Snakes are generally dreaded and treated as dangerous, although the passage
    notes that many kinds are harmless.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Magicians are said to have drugs for curing snake bites, including roasted
    and powdered adder head.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Little blue snakes are considered emissaries of the ancestor spirits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Huwumati is described as an invisible lake-dwelling snake heard crying
    during rain; seeing it is a bad sign, and one man who saw it died after three
    days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Shimhemhemhe is described as a dreadful snake in dark wooded ravines on
    the Drakensberg slopes; it pursues intruders from branches and bites the top of
    the head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A man who saw the Shimhemhemhe with raised shining two-colored head and endless
    body died because seeing the snake is said to bring death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage ends by beginning a catalogue of bird names collected from pupils
    from different parts of Thongaland.
  category: other
  evidence_refs:
