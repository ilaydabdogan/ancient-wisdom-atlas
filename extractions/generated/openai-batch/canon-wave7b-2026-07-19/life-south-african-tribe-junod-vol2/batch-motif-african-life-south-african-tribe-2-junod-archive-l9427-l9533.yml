canonical_text:
  quote: THE CHILD THAT WAS CARRIED OFF BY A BABOON.
  summary: A woman takes her baby to the fields, where a baboon carries the child
    away through the trees after threatening to kill the child if the mother calls
    for help. The mother searches, laments, follows reported traces, and returns home
    with a child-shaped log hidden in the baby-carrying skin. Her husband discovers
    the log, and his kin accuse her of killing the child despite her account; she
    is expelled, with her possible killing left uncertain.
  language: English
  quote_policy: quoted
