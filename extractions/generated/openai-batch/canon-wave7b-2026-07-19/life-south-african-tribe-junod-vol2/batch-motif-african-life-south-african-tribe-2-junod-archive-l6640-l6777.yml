canonical_text:
  quote: ''
  summary: The passage describes Ronge songs and dances among Ba-Ronga and Coast clans,
    including post-harvest performances, dance training in the bush, changing repertoires,
    and several named dances. It gives a detailed arrangement for a Nondwane performance
    with drummer, girls singing refrains and clapping, men dancing, and a soloist.
    It records songs praising named dancers and a song about crossing a stream or
    river, towing boats, leaving Muhari, and going toward Ntshangane, which the author
    interprets cautiously as preserving a memory of wandering or flight.
  language: English, with transcribed Thonga/Tsonga song lines
  quote_policy: summarized
