canonical_text:
  quote: The human soul continues its existence after death when it is endowed with
    new powers which make it awesome, and to be feared.
  summary: The passage distinguishes individual poetic or personal personifications
    from collective Thonga beliefs expressed in rites and customs. It gives examples
    involving a boy scolding fruitless trees, an imagined moth-afterlife claim, and
    an informant’s description of water flows fighting. It then lists collective beliefs
    concerning ancestor spirits, possession by spirits of the dead, and wizards whose
    spirits leave the living body at night to harm others.
  language: English
  quote_policy: quoted
