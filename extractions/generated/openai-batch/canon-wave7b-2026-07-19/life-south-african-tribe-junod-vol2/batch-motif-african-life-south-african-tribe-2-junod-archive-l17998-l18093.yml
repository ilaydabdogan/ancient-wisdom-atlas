canonical_text:
  quote: '"ba busiku" - "the men of night"'
  summary: The passage describes baloyi as nocturnal witches who leave their huts
    and fly at night, sometimes appearing as will-o'-the-wisp flames. It contrasts
    Ba-Suto and Thonga explanations of whether the witch travels bodily or by a divided
    personality, recounts a narrated example in which a wife’s apparent sleeping form
    is revealed as a hyena and later returns with the hyena’s wound, and discusses
    whether witches are conscious of their night actions.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The baloyi are described as chiefly nocturnal and are sometimes called “men
    of night.”
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The baloyi are said to get out of themselves at night, fly with large wings,
    and leave their huts through the grass crown of the roof or through a closed door.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Little flying flames or will-o'-the-wisps are described as forms under which
    the baloyi go.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Ba-Suto explanation says that the wizard travels entire, soul and body,
    leaving nothing on the mat, after making the other hut inhabitants sleep heavily
    with charms.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Thonga explanation says that the noyi is only part of the personality,
    while a shadow remains on the mat; the apparent body is really a wild beast with
    which the noyi has identified.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In S. Gana’s narrated example, a father who knows witchcraft warns his son
    that the woman he wants to marry is a noyi.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the narrated example, the father tells the son that his wife has gone,
    although she appears to be sleeping in her place.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the apparent sleeping wife is wounded with an assegai, a wild-beast cry
    is heard and a hyena appears in her place, deposits faeces, and escapes howling.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The father gives the son powder to swallow so that he can see the baloyi and
    their ways and habits.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Near sunrise, the wife falls down from the top of the hut, lies sleeping,
    and has a leg wound matching the wound made in the hyena.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The narrator infers that, in the Ba-Thonga idea, the noyi’s personality is
    split into two during nightly work.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The older conception presented in the passage is that a noyi does not know
    what he is doing and is unaware of being a noyi until revealed as such.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage gives an example in which a man may have sent a crocodile to kill
