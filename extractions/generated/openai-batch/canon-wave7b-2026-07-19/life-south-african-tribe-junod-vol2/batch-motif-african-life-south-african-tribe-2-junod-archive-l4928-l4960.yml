  summary: The passage describes Bantu languages as having a noun-class system in
    which speakers assign new objects to fitting classes and form new words with classifying
    prefixes. It then describes the Bantu verb as agglutinative, with tense, mood,
    and derived meanings expressed through prefixed or suffixed verbal elements. Examples
    from verbs meaning “to see,” “to load/unload,” and “to work” illustrate passive,
    qualificative, applicative, causative, intensive, reciprocal, reflexive, reversive,
    and combined derivative forms.
