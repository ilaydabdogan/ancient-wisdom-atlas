canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Thonga agricultural taboos: first-fruits
    restrictions, feminine pumpkin restrictions, shimusi rest days, field prohibitions
    linked to rain, new moon, twins, and wizards, stringent rules around threshing
    rice and Kafir corn, a former taboo on planting foreign fruit trees, and negative
    answers to Frazer-style questions about crop deities, harvest-field ceremonies,
    and last-corn rites.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: First-fruits such as Kafir corn and bukanye are not to be enjoyed before the
    gods, chief, headman, and elder brothers have luma.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls are not allowed to walk among pumpkins, pluck pumpkin fruit, or pick
    pumpkin leaves without certain precautions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Certain days called shimusi are proclaimed by the chief or fixed by custom
    as days on which no one may till the soil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In ftwamba, after a little rain, clan members must remain at home and not
    work in the fields.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among the Nkuna, the day of the new moon is shimusi; the moon is described
    as needing to become firm, and cutting roots while it is still soft is taboo because
    it would cause strong winds and hail.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Khosen, complete rest is customary on the day after the birth of twins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Whistling in the fields after sowing and before the mealies are grown is forbidden
    because it would call the baloyi and compromise the harvest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Threshing cereals is described as work done exclusively by women, and men
    are forbidden to approach the threshing floor.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Makaneta cut rice ears, pile them in huts, dry the grain, and thresh it
    by trampling on it.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: During rice threshing, speaking to a passing woman is taboo unless she enters
    the hut and helps briefly with the work.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The passage states that if the condition of the passing woman helping is not
    fulfilled, she would take the rice and leave only husks.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:12
  text: A relative from a neighboring district should not be given part of the rice
    harvest while threshing; if she takes rice away husked, the husks must remain
    with the owners.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: 'The same rule is said to apply to Kafir corn: allowing an outside relative
    to pluck, thresh, and take ears home is said to spoil the corn.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:14
  text: When threshing Kafir corn, a visitor should first take the pestle and help
    before being spoken to.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:15
  text: Planting foreign trees such as bananas and oranges was formerly considered
    taboo.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: When Mboza planted the first mango trees in Morakwen, people told him he would
    die, had called misfortune on himself, and that other people would eat his fruit.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:17
  text: The former tree-planting taboo is explained through the sight of planted trees
    near abandoned village ruins, where people said the trees had chased away the
    master of the village.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:18
  text: The passage says there are no special ceremonies at land clearance, no deity
    animating the crops, no superstition about the last corn cut, and no special harvest-field
    ceremony.
  category: other
  evidence_refs:
  - ev:6
- id: obs:19
  text: The passage says baloyi can increase or diminish the product of fields.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:20
  text: Except for the rule of silence during rice and Kafir corn threshing, the passage
    says there are no special regulations or sexual taboos for agricultural workers.
  category: other
  evidence_refs:
  - ev:6
- id: obs:21
  text: The Makaneta used the tide that pushed back the Nkomati River to water rice
    plantations, but did not dig channels for irrigation.
  category: action
  evidence_refs:
  - ev:6
