canonical_text:
  quote: ''
  summary: A Hare repeatedly deceives other animals and people around water and cultivated
    food. He causes the Antelope to be blamed and killed, is then outwitted by the
    Tortoise during a theft of sweet potatoes, and later steals ground-nuts in King
    Lion's country before trapping Lion by tying his mane through a banyan tree while
    pretending to make him a wax crown.
  language: English
  quote_policy: summarized
