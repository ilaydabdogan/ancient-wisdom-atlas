canonical_text:
  quote: ''
  summary: The passage describes family sacrifices made in cases of illness after
    divining bones identify gods as the cause and specify the required offering. It
    details a maternal-line sacrifice for a sick child using a hen or bracelet, the
    making of a religious amulet, a Maluleke healing rite using diluted beer and a
    twig, and rites for a young man returning home, including purification from death
    contamination and a hen sacrifice at the village entrance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Divining bones are said to reveal whether disease is caused by gods rather
    than wizards or Heaven, and to indicate the required offering, place, and sometimes
    the person who must perform it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the offering is to the gods of the mother's family, the sick child's
    people go to the maternal relatives and ask the maternal uncle to perform the
    sacrifice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The described offering for the sick child may consist of a hen or an ornament
    such as a bracelet.
  category: object
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:4
  text: If the offering is a hen, the maternal uncle kills it, takes blood-soiled
    neck feathers, puts them to his mouth, spits on them, and says the ritual words.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prayer addresses the gods, asks that the child live, grow, and become
    rich, complains that the gods cause trouble, names the angry god identified by
    divination, and calls ancestors and the father's gods to the altar to share the
    offering.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the hen offering, the priest ties together a wing feather, a claw of
    the left foot, and the beak, and fastens them to the child as a religious amulet.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The amulet is placed on the left side for gods of the mother's family, while
    the passage states it would be placed on the right side for gods of the father.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the offering is a bracelet, the priest pours consecrated beer over it,
    says the prayer, and fastens the bracelet to the child's foot; the child may not
    remove or exchange it because it belongs to the gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Maluleke clan rite for a sick person, the headman uses diluted beer
    prepared for the gods and a twig of male nkanye while the patient sits near the
    altar.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Maluleke headman dips the twig into the beer, sucks it, says a formula
    corresponding to tsu, names Makhima and Mashakadzi, and asks that disease depart
    and the patient be healed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: A young man returning after a long absence cannot be received back into the
    community without special precautions if there has been a death in the kraal.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: For purification from death contamination, some provisions of the deceased
    are kept in a pot, diluted with hot water, poured between the returning man's
    two great toes, and then he rubs the toes together.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Before the returning boy enters the village, his father sits at the great
    entrance, cuts the neck of a selected hen, and throws it onto the boy's luggage.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The sacrificed hen leaps in agony; the officiant plucks out bloodstained feathers,
    pronounces tsu, and says that the son has returned safely because the gods accompanied
    him.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
