canonical_text:
  quote: ''
  summary: 'The passage describes protective and propitiatory rites followed by an
    exorcised or possessed person: medicinal roots, powders, amulets, fire rites,
    journey protections, monthly purgative purification at the new moon, necklaces
    to calm spirits, crisis episodes handled through song and dance, and offerings
    at a forked-branch altar and in daily food and drink. It also states that these
    practices create a form of individual spirit worship distinct from ancestrolatry.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain roots and pellets are said to immobilize night wizards, protect the
    exorcised, or support the success of treatment.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Protective drugs are kept as pellets or powder in reeds or calabashes, and
    the exorcised swallows a pinch and throws another on the hut fire each night.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The nightly powder rite is said to prevent enemies from entering or to make
    them prisoners.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before eating, the exorcised chews manono root as protection against poisoning
    or malefaction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before a journey, the exorcised chews ndjao root, spits on his stick, rubs
    it, and declares that the road is ready.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: An astragalus charm is worn around the neck between small amulet bags or reeds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the hondlola, a monthly purification uses a calabash decoction, which
    is drunk and then vomited after the throat is tickled with a feather.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The monthly purification is performed at every new moon and is said to maintain
    a relation between the possessed person and the moon.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A mayambatju creeper necklace is worn to calm the gods or scatter them when
    they come violently.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: During a crisis, the exorcised may become violent; people may clap, dance,
    and sing the person’s own song to calm him and dispel spirits.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage gives an example of ftwashinhwana, who in frenzy went to the bush,
    was followed by her husband, and was brought home after exhaustion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The exorcised has an altar in the hut, described as a forked branch with a
    maintained clay circle, where tobacco and snuff offerings are made.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: Before a journey, the exorcised takes leave of the Ba-Ngoni at the altar,
    asks them to guard the hut and bless the journey, and later reports the successful
    return.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Before drinking beer or eating food, the exorcised gives a little to the spirits;
    the passage calls this a daily worship and communion with spirits.
  category: action
  evidence_refs:
  - ev:10
