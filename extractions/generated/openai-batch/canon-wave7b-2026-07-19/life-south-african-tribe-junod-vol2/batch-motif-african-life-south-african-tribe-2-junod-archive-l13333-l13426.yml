canonical_text:
  quote: ''
  summary: The passage describes Thonga ideas about the soul leaving the body during
    sleep, magical theft or recovery of the spirit, fears surrounding photographs
    and likenesses, the shadow's continuation after death, rejection of bodily resurrection,
    disliked dreams and actions taken against dream realization, and a concluding
    discussion of Animism as an anthropological category.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some people believe the soul leaves the body during sleep and returns when
    the owner wakes; witches are said to unsheath themselves at night by magical power
    and bewitch people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A boy is reported as praying in the evening that his soul would return to
    him the next morning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Photographing a person is described as a dangerous form of soul-body separation;
    people fear being robbed, taken far away, and left incomplete.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Magic-lantern pictures and likenesses of dead people are described as objects
    of fear, pity, or accusation because they appear to involve ill-treatment or bringing
    the dead back to life.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wizards are said to cause death by magic charms that part soul and body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When divinatory bones identify a noyi as the cause of a dying person's illness,
    a magician shuts the accused in with the dying person and orders the return of
    the taken and hidden spirit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some magicians claim to find a stolen spirit and restore the patient to health,
    especially when a person recovers consciousness after epilepsy or another psychic
    trouble.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At death, the body is said to rot while the shadow goes away and continues
    life as a god; this continuation after death is described as the basis of ancestor
    worship.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that Thonga hearers do not understand bodily resurrection
    and answer with a formula that goat, ox, and man die and rot.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author explicitly compares Thonga ideas of future life with ancient Greek
    belief that the human soul went after death to the realm of shadows.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Dreams are generally disliked; fulfilled dreams are said to disgust people,
    and repeated dreams of a pregnant woman lead a man to consult the bones.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: If a man dreams of sexual relations with a woman, he may strike her with a
    stick, leave the stick on the ground, and depart silently to remove the obsession
    and prevent the dream from becoming reality.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The conclusion states that South African tribes are considered animistic and
    cites Tylor's definition of Animism as belief in spiritual beings, while noting
    that the term has been used imprecisely.
  category: other
  evidence_refs:
  - ev:8
