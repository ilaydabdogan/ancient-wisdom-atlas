canonical_text:
  quote: ''
  summary: 'The passage inventories the charms and regalia of a Nkuna magician and
    a Ronga gobela, then describes anti-witchcraft practices: protective medicines
    applied to village boundaries, smoke that keeps away or reveals wizards, reported
    exposure of naked female witches, and pursuit of witches flying on wings of fire.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Nkuna magician at Shiluvane wore inherited objects in his hair and on his
    body, including a brass bracelet, rings, and a necklace with a sixpence inherited
    from his father, who was also a mungoma.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same magician wore a piece of goat skin from an animal sacrificed after
    his father's death, described as a means to acquire and keep the power of his
    initiator and god.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two panther claws were fixed on the magician's head facing each other and
    were said to help him seize the wizard in the vumisa rite.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Two empty goat bladders hanging among the magician's tingoya signaled that
    he had cured patients and received goats as rewards; their sound was said to call
    more goats to him.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: The magician's charms included crocodile teeth, buffalo horn, a broken horn
    containing nulu medicine, a sea-weed root for producing gobo foam, a goat horn
    of powder for burwa disease, rishwala medicine, and a cock's spur.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Burwa is described as a strong westerly wind used by baloyi for bewitching
    through the ears; the magician treated it by rubbing the patient with a horn and
    placing it near each ear.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A Ronga gobela from Tembe traveled with two assistants while exorcising the
    possessed of the land and wore military and magical attire, including large snake
    skins and a gnu tail.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The author states that magicians have many charms and tricks and that their
    drugs are used for protection and cure, with cure mainly involving disclosure
    of the wizard.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: Village protections against baloyi include treating the fence, main entrance,
    and headman's threshold with drugs, burning powder in a little fire to revive
    the drugs, using smoke to keep wizards away, and placing daubed stones to close
    openings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mankhelu says that if a noyi enters a protected hut, the smoke can reveal
    the noyi naked and unaware; if the noyi is a woman, he calls her husband, demands
    payment for silence, beats her with a stick, and she awakens and flees home.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mboza reports a similar case in Muthiyane in which a woman was found naked
    with red, fire-like marks on both shoulders, interpreted as remnants of wings
    that magical drugs prevented her from putting back into her flesh.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some magicians are said to fight baloyi by running through the bush at night
    and catching them as they fly on wings of fire.
  category: action
  evidence_refs:
  - ev:8
