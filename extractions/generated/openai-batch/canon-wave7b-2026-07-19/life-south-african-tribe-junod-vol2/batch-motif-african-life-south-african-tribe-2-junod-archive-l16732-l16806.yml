canonical_text:
  quote: ''
  summary: 'The passage describes concluding elements of the hondlola healing rite:
    a spoken act to leave misfortune behind, a taboo on looking back, use of ant nests
    to contain ritual particles, preparation of protective amulets, resumption of
    sexual relations and social payment after cure, and examples of analogical remedies
    such as a Protea seed-pod for vertigo and a mole-skin bracelet for a parasite
    moving under the skin.'
  language: English
  quote_policy: summarized
