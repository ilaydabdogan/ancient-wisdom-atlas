canonical_text:
  quote: ''
  summary: 'The passage describes the thwaza rite in a possession cure: spirits speaking
    through a patient demand offerings; a goat is sacrificed, the patient drinks and
    vomits its blood, and the spirits are appeased and expelled. The patient is washed,
    smeared with ochre, adorned with goat parts and scented root strings, and performs
    a meat-seizing rite toward the four cardinal points. Remaining goat parts are
    used in feasting, house protection, personal adornment, and controlled disposal
    of bones. A year-long convalescent and apprentice period follows before final
    purification.'
  language: English
  quote_policy: summarized
