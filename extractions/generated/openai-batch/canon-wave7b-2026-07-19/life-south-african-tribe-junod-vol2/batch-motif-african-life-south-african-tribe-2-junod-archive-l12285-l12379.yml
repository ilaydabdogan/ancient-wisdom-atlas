canonical_text:
  quote: ''
  summary: The passage catalogs Thonga names and beliefs concerning insects, mollusks,
    fish, and amphibians. It records omens connected with certain beetles and snails,
    beliefs that wizards can use dung beetles to kill, children’s incantations before
    horned beetles, special mystery surrounding the mbonga bee and its honey, shells
    used as money safes, and a food taboo concerning a black fish and unmarried lovers.
  language: English
  quote_policy: summarized
