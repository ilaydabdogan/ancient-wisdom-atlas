canonical_text:
  quote: ''
  summary: The passage reports Mankhelu's account of a rain-making medicine obtained
    from Rivimbi/Lebibi people, linked to Lebibi as a heavenly spirit and first inventor.
    The medicine is made from marine products, placed in horns, renewed from an original
    portion, and used in rituals involving a black goat or sheep, blood, friction
    fire, prayers, smoke rising to heaven, and protective lightning-bird feathers.
    A shorter home ritual uses medicated leaves exposed to the sun. The narrator interprets
    the sea-products-and-smoke procedure as an instance of like producing like.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mankhelu says the Lebibi people descend from Lebibi, an old-time chief who
    after death went to heaven, became king of heaven, and remains as a spirit aware
    of events on earth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Lebibi is probably the same figure whom the Pedi call the
    first man.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mankhelu asserts that Lebibi is invoked to obtain rain and that Modjadji's
    rain-making power depends on him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mankhelu obtained horns full of rain-making medicine from Lebibi's successors
    after bringing riches.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The medicine ingredients are described as coming from the sea, including sea-urchins,
