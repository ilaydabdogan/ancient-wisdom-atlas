canonical_text:
  quote: ''
  summary: 'The passage describes several practices and examples related to counting,
    time reckoning, orientation, memory, and chronology among Thonga/Ronga/Djonga-speaking
    communities: a former prohibition against counting people, orientation by sun
    observation, named near-future and past days, counting hoes for lobolo, a counting-memory
    game with fruit stones, and Shinangana''s personal seventy-year chronology beginning
    with a migration before Manukosi.'
