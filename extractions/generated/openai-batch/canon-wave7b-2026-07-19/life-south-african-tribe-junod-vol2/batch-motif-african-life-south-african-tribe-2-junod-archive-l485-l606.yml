canonical_text:
  quote: "“It is taboo to plant any kind of pumpkin, before the Chief and the sub-chief.”"
  summary: The passage surveys Thonga food plants and agricultural practices, noting
    uses of beans, sweet potatoes, pumpkins, wild vegetables, tomatoes, onions, sugar
    cane, pineapple, tobacco, manioc, and wild fruits. It records specific taboos
    around the ranga pumpkin, including restrictions on girls among its leaves, hierarchical
    priority for chiefs in pumpkin planting, a reported lumbago punishment for transgression,
    and a workaround when an elder delays planting. It also describes male-only tobacco
    cultivation and the absence of deliberate tree cultivation because villages move
    frequently.
  language: English
  quote_policy: quoted
