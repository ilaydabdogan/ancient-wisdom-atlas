canonical_text:
  quote: ''
  summary: 'The passage reports Thonga and Bilene explanations and stories about White
    people: proposed meanings of balungu; a creation-era account involving Nwali,
    first ancestors, a forbidden sibling union, filial respect or disrespect, and
    a resulting condition of Black people; sayings about White superiority; beliefs
    that different Europeans come from sea, mountains, or Heaven; and a Bilene account
    of Portuguese as water-dwelling human-fish cannibals who kidnap, fatten, and cook
    captives, with a survivor aided by his gods. It ends by noting older Thonga beliefs
    that White people lived in water, saw in all directions, and kidnapped Black people.'
  language: English
  quote_policy: summarized
