- id: motif:2
  label: ancestral fault explaining present social condition
  taxonomy_refs: []
  basis: The account links disrespect by the ancestor of Blacks and a divine statement
    by Nwali to the later deterioration and hard subsistence labor of Blacks.
  evidence_refs:
