canonical_text:
  quote: The Bantu mind distributes the objects of Nature into seven or eight categories.
  summary: The passage is an expository discussion of Bantu, especially Thonga, noun
    classes. It argues that the noun-class system shows a power of classification,
    contrasts it with Indo-German gender systems, and lists classes for personal beings,
    trees, animals, fruits, organs, liquids or abstract notions, instruments, and
    actions. It also notes that animals acting as sensible beings in folk tales are
    assigned to the personal-being class.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that Bantu nouns are distributed into classes or genders
    marked by singular and plural prefixes, with seven or eight classes in the South
    Eastern group and as many as ten in Central groups.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts Bantu noun classification with Indo-German languages,
    which it describes as dividing objects into male, female, and often neuter categories;
    it says Bantu languages do not follow that sex-denoting system.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A note says Thonga has a feminine suffix ati, eti, or etsi, corresponding
    to a feminine prefix mi, and gives examples including wife, paternal aunt, female
    elephant, moon, star, water, and river names.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:4
  text: The author says he is considering the system in broad features in the living
    language and asserts that it reveals a true power of classification.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first noun class, marked by mu in the singular and ba in the plural, is
    described as the class of personal beings; examples include man, husband, and
    wife, and new objects bearing personal character are incorporated into it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says animals acting as sensible beings in folk tales are moved
    from their ordinary class into the personal-being class by prefixing a form before
    their names.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The second class is described as designating trees; almost all trees belong
    to it, newly introduced trees such as the mango are named according to that rule,
    and some other things such as wind, heat, fire, space, time, the body, and some
    organs also have its prefix.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The third class is described as the animal class, with the passage stating
    that ninety percent of animals belong to it, although some other objects also
    have its prefixes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The fourth class is described as the fruit class; new fruits such as oranges
    are incorporated into it, and the class also contains hard or shining natural
    objects, grouped things, and possibly objects conveying duality such as eyes,
    breasts, arms, and twins.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The fifth class is described as difficult to define and possibly becoming
    obsolete; the author calls it the class of organs, especially elongated organs,
    and says its primitive idea may be length.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'The sixth, seventh, and eighth classes are described as having a strong neuter
    character: the sixth designates abstract notions and also liquids, the seventh
    instruments, and the eighth actions or the infinitive verbal class.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The conclusion restates that the Thonga classify objects of nature into personal
    beings, trees, animals, fruits, organs, liquids, abstract notions, instruments,
    and actions, while other objects may be incorporated into these classes more or
    less arbitrarily.
  category: sequence
  evidence_refs:
  - ev:9
