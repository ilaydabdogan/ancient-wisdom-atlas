canonical_text:
  quote: ''
  summary: The passage explains a system of astragalomancy in which divinatory bones
    and objects are read by their falling position, side, direction, and relation
    to one another. Convex and concave falls are treated as active and passive signs;
    rarer side falls are illustrated by Mankhelu as hostile or mild bodily postures.
    Specific objects, including baboon, ancestor-god, nkanye stone, crocodile stone,
    tortoise shells, sea-shells, and assagai-related signs, are assigned meanings
    concerning health, death, village order, fertility, healing, warfare, water, and
    lamentation. The passage also notes that repeated agreement among same-sex astragali
    confirms that the oracle or “Word” speaks.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bones or astragali are marked positive when they fall on the convex side and
    negative when they fall on the concave side or on their back.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes the convex fall as active and the concave fall as passive,
    while warning that convex should not simply be called favourable or concave unfavourable.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Mankhelu demonstrates two rarer side positions: ntjumba, associated with
    hostility and anger, and minkono, associated with leaning on elbows, enjoying
    life, and not threatening others.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Baboon signs are read for the state of the village, while ancestor-god signs
    are read for the state and speech of the gods.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The nkanye stone is described as having two removed kernels that appear like
    eyes in the positive position; open eyes indicate that drugs help or cure, while
    closed eyes indicate that the medicine-man will not succeed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The crocodile stone in positive position indicates peace, village happiness,
    and no miscarriage; in negative position it indicates a crocodile hidden in water
    and danger such as starvation, death, or defilement.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tortoise-shell signs are read for village abundance and enjoyment in positive
    position, and misfortune, disorder, death, or starvation in negative position.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Female sea-shell signs are read for rivers, pregnancy, sea-borne riches, birth,
    and wreckage at sea.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Male sea-shell signs are read for assagais, men’s undertakings, and the success
    or defeat of an army.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Sea-shells showing their opening are interpreted as mouths open either to
    laugh or cry; all openings indicate lamentation, while only two or three indicate
    laughter.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the side on which the bones fall, their direction and disposition are
    used to read intentions, movements, and relations among the represented personages.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: If all or most astragali of the same sex fall in the same position, the passage
