canonical_text:
  quote: ''
  summary: The passage describes Thonga/Tsonga rites for canceling a rash oath or
    imprecation, especially between brothers, through confession, reconciliation,
    and sometimes a formal ceremony with herb decoction, a shell, tsu, speech, shell-breaking,
    and shared drinking. It also describes national offerings to the chief’s ancestors,
    including first-fruits consecration and a Maluleke crop-protection sacrifice involving
    beer, a goat, graves, and royal-family participants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A djieta is defined as a rash oath or oath with imprecation; the example given
    is a younger brother swearing never again to speak to or visit his elder brother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two brothers may remain without intercourse for years after such an oath.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When serious disease occurs in the younger brother’s village, divination by
    bones orders a sacrifice, but the younger brother cannot offer it himself because
    the elder brother must do so under the described ancestral priesthood rule.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bones are consulted again and say that the two have tied a knot which
    must be untied before sacrifice is offered.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The younger brother goes to the elder brother, confesses that he sinned in
    swearing not to return, and asks to cancel the oath by hahlela djieta.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The elder brother scolds the younger brother but eventually accepts his excuses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A more solemn reconciliation ceremony may be attended by elder family members;
    the oath-maker prepares a decoction of mudahomu herb and pours it into a sala
    shell.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The two former enemies sit in the midst of the assembled people on the bare
    ground.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The offender raises the shell, sips the decoction, spits it out with the customary
    tsu, and says the djieta arose from bitter hearts and must end so that peace can
    be made.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The offended brother takes the shell, performs the same tsu rite, says his
    anger was justified, and states that the conflict should end and the two should
    eat and drink together as friends.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The offended brother breaks the shell, after which they drink and enjoy themselves
    together.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The footnote says a djieta may also involve an oath never to enter a pool
    or river again; if the person must enter it again, he cancels the oath by addressing
    the imprecation and throwing water into the pool.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: National offerings are made at the Capital to the chief’s ancestors on behalf
    of the whole clan because the reigning family’s gods are said to control the clan.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The luma of the first fruits consecrates new produce; the gods must enjoy
    the produce first, followed by the chief and other ranks in hierarchical order.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: A taboo is directed against a person who enjoys first fruits before his superiors;
    the passage says gods deprived of their right would avenge themselves by threatening
    the harvest.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: In the Maluleke clan, when Kafir corn is threatened by vermin, the chief considers
    that his dead ancestors may be angry because he has not worshipped them well.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: For the Maluleke rite, the chief summons sons of the royal family, prepares
    beer, selects a goat for sacrifice, and participants assemble around the graves
    with sons and uterine nephews to worship, eat, and return.
  category: action
  evidence_refs:
  - ev:10
