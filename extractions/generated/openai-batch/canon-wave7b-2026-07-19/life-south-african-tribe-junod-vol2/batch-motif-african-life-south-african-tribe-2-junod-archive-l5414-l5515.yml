canonical_text:
  quote: ''
  summary: The passage describes Junod's view of Thonga eloquence and literary capacity,
    emphasizing public speech, fluency, comparison, and the use of material images
    to express spiritual teachings. Examples include a Tembe Christian comparing Jesus
    Christ to an ox slaughtered so that believers may take a shield made from its
    hide, and another evangelist comparing charity to a rope that ties a donkey to
    a tree identified with the Saviour, and to a string that secures valuable things
    in a parcel for a journey or life.
  language: English
  quote_policy: summarized
