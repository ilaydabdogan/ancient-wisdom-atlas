canonical_text:
  quote: ''
  summary: The passage describes effects attributed to exorcism and possession, including
    later divinatory or magical powers; examples involving Mholombo, Shidzabalane,
    Mboza, Sindondondo, and Khongosa; annual rites of exorcist schools for renewing
    drugs; rivalry between schools; and a failed theft of a powerful drug protected
    by charms and snakes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons described as exorcised may show nervous crises, unusual behavior,
    groaning or sudden cries, and may either recover or develop extraordinary faculties.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some exorcised persons are said to develop double sight, become diviners by
    ecstasy or bone throwing, become wonderworkers, prophets, or magicians.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mholombo is described as possessing gifts that let her discover wizards, including
    men leading a chief's wife to a marsh in order to eat her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mholombo is said to have received divinatory bones from her possessing spirit,
    prophesied missionaries' arrival, exposed a theft, and gained power to walk on
    the Nkomati river.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Shidzabalane is said to have left his body and gone to dwell in his own shadow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A powerful exorcised person who succeeds in cures may attract followers, become
    founder of a school, initiate new rites, and discover stronger drugs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each school of exorcists holds an annual winter feast at the close of harvest
    for renewal of drugs, with disciples bringing empty calabashes and offerings or
    fees.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the renewal feast, participants burn drugs in broken pots, inhale smoke
    through reeds, take froth from a basin, receive new protective medicines in calabashes,
    then dance and sing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Rivalry between schools includes testing colleagues by entering huts at night
    and stealing one another's drugs.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sindondondo disappeared for two or three years, was considered dead, then
    reappeared saying he had lived at the bottom of the sea like a fish and had received
    a powerful drug from chiefs under the water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sindondondo observed special food restrictions, kept a forked pole outside,
    and ordered a neighbor to watch over his drugs and fowls during journeys.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: A man trying to enter Sindondondo's village would find it full of enormous
    snakes surrounding the magic branch.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Khongosa crossed the Nkomati at night to steal Sindondondo's nd^und^u drug,
    but protective charms caught and imprisoned him until after sunrise.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Sindondondo addressed Khongosa as a friend, said he could shame him, then
    released him and sent him home.
  category: speech
  evidence_refs:
  - ev:8
