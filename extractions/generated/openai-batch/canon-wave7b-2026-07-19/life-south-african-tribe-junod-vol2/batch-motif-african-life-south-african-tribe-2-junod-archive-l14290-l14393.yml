canonical_text:
  quote: '"Sacrifices of Bitterness"'
  summary: 'The passage describes several Thonga/Tsonga sacrificial practices: minimal
    offerings made in misery, medicine-men''s offerings and prayers for healing or
    travel protection, regular family sacrifices at life events with taboos on sacrificial
    meat, and a Maluleke first-mealies offering to Ba-Nyai spirits understood as propitiating
    prior owners of the land.'
  language: English
  quote_policy: quoted
