canonical_text:
  quote: ''
  summary: The passage presents a Gnostic-style cosmogony in which Spirit and Light
    are sown below Heaven. Water gives rise to Wind, which stirs waves and becomes
    the source of generation. Mind or man is generated through this movement, while
    a ray of the higher Light is held in bodily darkness. Wind is identified with
    a winged serpent and with the first-born of the waters. The Logos of Light takes
    on a serpent-like or beast-like form, descends into the womb, and loosens the
    bonds on the captive perfect mind. The passage then describes washing and drinking
    the Cup of Living Water as necessary for removing the Servant-Form and putting
    on the Celestial Garment. Mead’s commentary compares the system with Orphic, Chaldaean,
    Poemandres, and Mithraic symbolism.
  language: English
  quote_policy: summarized
