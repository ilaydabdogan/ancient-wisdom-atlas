canonical_text:
  quote: ''
  summary: Mead introduces and quotes Hippolytus on a Sethian Gnostic cosmogony. The
    quoted system describes three principles—Light above, Darkness below, and pure
    Spirit between them. Light and Spirit descend into a dark watery realm, Darkness
    seeks to hold the light-spark and spirit-fragrance, and Light and Spirit seek
    to raise their mingled powers back. Contact among innumerable intelligent powers
    produces seal-like images, the forms of living creatures, and a first great configuration
    of Heaven and Earth resembling a womb with an embryo in the middle.
  language: English
  quote_policy: summarized
