  quote: ''
  summary: The passage critiques alleged golden records known only to Evemerus, distinguishes
    famous human rulers and conquerors from those who claim divine status, gives examples
    of Antigonus and Lysippus rejecting divine royal imagery, and introduces a theory
    that stories of Typhon, Osiris, and Isis concern mighty daimones with mixed natures.
    It then compares these Egyptian mythic passions with Greek mythic conflicts and
    wanderings.
