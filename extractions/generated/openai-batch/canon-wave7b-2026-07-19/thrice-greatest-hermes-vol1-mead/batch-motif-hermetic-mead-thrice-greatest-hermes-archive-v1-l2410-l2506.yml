  quote: '"Thoth or the Egyptian Hermes was the symbol of the Divine Mind"'
  summary: The passage surveys nineteenth-century opinions, especially Artaud, Deveria,
    and Menard, about the Egyptian origin and character of the Trismegistic writings.
    It reports claims that Thoth or Egyptian Hermes represents Divine Mind, incarnated
    Thought, and the living Word; that Hermetic books preserve ancient Egyptian doctrine;
    and that Hermetic literature arose from contact between Egyptian religion and
    Greek philosophy, with points of contact to Jewish and Christian writings.
