canonical_text:
  quote: "“The disciple is as it were his ka.”"
  summary: The passage discusses inner spiritual instruction in which a God or Spiritual
    Master contains and begets disciples. It then reports an Egyptian belief that
    an initiated priest of Wisdom could be an incarnation of Thoth and could be worshipped
    as Thoth after bodily death, giving Teos the Ibis as an example. It distinguishes
    an older divine Thoth from a later God-man form and notes that Petosiris and Nechepso
    present Hermes as teacher of the younger god-disciples Anubis and Asclepius, with
    a horoscope citing counsel from Hermes and Asclepius/Imouthes.
