canonical_text:
  quote: ''
  summary: The passage presents allegorical interpretations of Isis-Osiris material
    in lunar, seasonal, generative, and eclipse terms. Apis is treated as Osiris's
    animated image; the Moon is associated with Osiris, Isis, maternity, and generation;
    Horus is identified with the cosmos around the earth; and Anubis is explained
    through Nephthys, Isis, the horizon, dog symbolism, and comparison with Hecate
    and Kronos.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Apis is described as the animated image of Osiris, conceived when generative
    light from the Moon fastens on a cow in heat, and Apis's light-and-dark markings
    are said to resemble lunar configurations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the new moon of Phamenoth, a festival is kept and called the Entrance,
    or possibly Embarking, of Osiris into the Moon, and it is linked with the beginning
    of spring.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the power of Osiris is placed in the Moon, and that Isis
    both consorts with him and is the cause of his birth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Moon is called Mother of the cosmos and is said to have a male-female
    nature because it is filled and made pregnant by the Sun and also sends out generative
    principles.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Moon is said not always to overcome Typhon's destruction, but even when
    bound hand and foot it frees itself by generative power and fights through to
    Horus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Horus is identified as the cosmos surrounding the earth, not wholly exempt
    from either destruction or generation.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some interpreters make the myth a riddle of eclipses, comparing the Moon's
    entry into the earth's shadow with Osiris entering the coffin.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Moon is also said to conceal the Sun on the thirtieth of the month without
    entirely destroying him, just as Isis did not entirely destroy Typhon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Nephthys conceives Anubis and Isis adopts him; Nephthys is identified with
    what is below the earth and non-manifest, while Isis is identified with what is
    above the earth and manifest.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The horizon, as a circle common to above and below, is called Anubis and is
    likened to a dog because the dog sees by both day and night.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Anubis is said to have a power among Egyptians like Hecate among Greeks, being
    at once chthonian and olympian.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some identify Anubis with Kronos and explain the name Dog through a wordplay
    involving breeding and conceiving all things in himself.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: A mystery connected with worshippers of Anubis is described as something that
    may not be spoken of.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The dog is said to have once enjoyed high honors in Egypt, but after Cambyses
    slew Apis and cast out its carcass, only the dog approached or touched it, causing
    the dog to lose first honor among animals.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Some call the shadow of the earth into which the Moon falls and is eclipsed
    Typhon.
  category: relationship
  evidence_refs:
  - ev:9
