  summary: The passage presents excerpts attributed to Philo of Alexandria on the
    Logos as God’s Reason, the intelligible archetype of the cosmos, the instrument
    by which the sensible cosmos is made, and the divider or delimiter of undifferentiated
    essence. It also notes a comparison with a passage from The Acts of John describing
    the Logos as the delimitation of all things.
  language: English
