- id: obs:1
  text: The intelligible city is described as the reasoning of an Architect who determines
    in his mind to found a sensory city after an intelligible model.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that Moses’ account of man fashioned in the image of God
    is used to support a relation between divine image, human image, and the sensible
    cosmos.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Archetypal Seal is identified with a cosmos perceptible only to the intellect,
    the Archetypal Pattern, the Idea of ideas, and the Reason of God.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cosmos is described as a grand House or City whose cause is God, whose
    matter is the four elements, whose instrument is the Reason of God, and whose
    object is the Goodness of the Creator.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Logos is called the Likeness of God by which the whole cosmos was made.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: God’s Shadow is identified as God’s Reason or Logos, used as an instrument
    to make the cosmos and treated as the archetypal model of all else.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: God is said to have sharpened the Logos, called the Divider of all things,
