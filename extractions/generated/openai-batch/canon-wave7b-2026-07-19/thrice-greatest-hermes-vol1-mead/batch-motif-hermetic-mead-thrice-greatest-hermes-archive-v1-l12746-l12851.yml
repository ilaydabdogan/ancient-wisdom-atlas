canonical_text:
  quote: ''
  summary: 'The passage presents Philo’s allegorical readings of biblical materials
    and compares them with Plutarch’s Vision of Hades. Souls are described through
    whiteness, markings, and discolorations that correspond to purity or vice and
    can be purified. Tamar is interpreted through Sacred Marriage and Mystery-language
    as a widowed renunciant who receives divine quickening, conceives virtues, and
    gains victory. The passage then relates divine conception to cosmic creation:
    God/Demiurge as Father unites with Wisdom as Mother, who receives the divine seed
    and brings forth the Cosmos as Son.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A feminine soul or figure is described as bereft of Wisdom and lacking wise
    Reason as physician, husband, consort, father, or begetter after choosing a blameworthy
    life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Philo treats Jacob’s dream of white, spotted, ring-straked, and speckled kine
    as an allegory of souls.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The first class of souls is described as white; when the soul receives the
    Divine Seed, its first-born births are said to be spotlessly white and light-like.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Plutarch’s Vision of Hades, Thespesius has a guide who points out souls’
    colors and markings in the Unseen World.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The soul-colors in the Vision of Hades are linked to vices such as sordidness,
    selfishness, savagery, venomous nature, incontinence, malignity, and envy.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Vision of Hades passage says earth-life vice produces discolorations,
    while purification and correction remove blemishes so the soul becomes ray-like
    and uniformly colored.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Tamar is described as a widow commanded to sit in the House of the Father,
    the Saviour, abandoning association with mortal things and human pleasures.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tamar receives divine quickening, is filled with Seeds of virtue, conceives,
    labors with fair deeds, brings them forth, takes trophies from adversaries, and
    receives a palm of victory.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Demiurge who made the universe is called Father; Wisdom is called Mother;
    God implants the power of genesis in Wisdom, who receives the Seed of God and
    brings forth the Cosmos as beloved Son.
  category: relationship
  evidence_refs:
  - ev:5
