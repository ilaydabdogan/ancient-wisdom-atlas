canonical_text:
  quote: ''
  summary: The passage reports explanations of Typhon/Seth as an oppressive destructive
    force, assigns Heracles to the Sun and Hermes to the Moon, contrasts solar force
    with lunar reason and wisdom, and gives Stoic accounts of solar and lunar nourishment.
    It then presents Egyptian and Pythagorean interpretations of Osiris's death, burial,
    dismemberment, and names through lunar phases, numbers, and the Nile's measured
    risings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Typhon is called Seth by Egyptians, and the name is glossed as that which
    oppresses and constrains by force.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The destructive force described before the name Seth withers growing things,
    uses fiery heat, makes much of the earth uninhabitable, and in many places masters
    the Moon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A myth says Heracles is settled in the Sun and accompanies its revolutions,
    while Hermes does the same with the Moon.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Moon's revolutions are compared with works of reason and abundant wisdom,
    while the Sun's are compared with forceful strokes of power.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Stoics are said to teach that the Sun is kept burning and nourished from
    the sea, while springs and lakes send a sweet mild exhalation to the Moon.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Egyptian myth says the death of Osiris occurred on the seventeenth, when
    the full moon is most conspicuously full.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Pythagoreans call the seventeenth day Interception and treat the number
    as expiable because it lies between sixteen and eighteen and divides their relation
    unequally.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Twenty-eight is given as the number of years Osiris lived or reigned, and
    the same number is identified with the lights of the Moon and the days of its
    cycle.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the Burials of Osiris, a tree-trunk is cut and made into a crescent-shaped
    coffin because the Moon becomes crescent-shaped and hides when it approaches the
    Sun.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The tearing of Osiris into fourteen pieces is interpreted as referring to
    the days during which the Moon wanes from full moon to new moon.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The day when the Moon first appears after escaping the Sun's beams is called
    Imperfect Good.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Osiris is glossed as Good-doer, and another name, Omphis, is said to mean
    Benefactor.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The risings of the Nile are said to have an analogy with the lights of the
    Moon through measurements of twenty-eight, six, and fourteen cubits at different
    places.
  category: relationship
  evidence_refs:
  - ev:8
