canonical_text:
  quote: The true God is one; they who are called gods, by a misuse of the term, are
    many.
  summary: 'The passage presents Mead''s account of Philo''s Logos doctrine: Philo
    may call the Logos a “second God,” but Mead stresses that Philo remains monotheistic
    because the Logos is God''s Reason, Word, Image, Angel, Life, and Light rather
    than an independent deity. Philo''s exegesis of Genesis distinguishes the one
    true God from beings called gods by misuse, identifies the Logos as the Most Ancient
    Word, and describes intelligible Light as the source of visible heavenly lights.
    A final analogy explains that humans, unable to look directly at the transcendent
    God, perceive God through the divine Image or Logos.'
  language: English
  quote_policy: quoted
