canonical_text:
  quote: ''
  summary: 'The passage summarizes Plutarch’s view that embodied human souls can only
    dimly apprehend God through a philosophically trained mind, then reviews his survey
    of interpretations of the Osiris myth: Euhemerist, daimonic, natural-phenomenalist,
    Pythagorean-mathematical, first-principle, and agricultural vegetation explanations,
    none of which he treats as fully sufficient.'
