canonical_text:
  quote: ''
  summary: The passage discusses symbolic topography involving right and left arcs
    of a Wheel, Sphere, or Egg; considers whether the writer of the Poemandres was
    influenced by earlier symbolic traditions; summarizes an Ophite account reported
    by Origen in which the soul passes rulers, breaks through a boundary, and addresses
    a ruler in the highest sphere; describes the Fence of Fire as a circle of fire
    with a flaming sword guarding access to the Tree of Gnosis and of Life; and compares
    this with the Poemandres image of Man breaking through the seven spheres in the
    straight ascent of the initiate.
  language: English
  quote_policy: summarized
