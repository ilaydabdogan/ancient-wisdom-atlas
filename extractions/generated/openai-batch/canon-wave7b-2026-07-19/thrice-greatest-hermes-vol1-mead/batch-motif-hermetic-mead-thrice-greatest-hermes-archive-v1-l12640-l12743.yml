canonical_text:
  quote: ''
  summary: The passage presents Philo’s allegorical reading of Sarah, Isaac, Wisdom,
    Virtue, soul, intelligence, and Logos. It interprets Laughter as Joy and Isaac
    as begotten by the Lord; describes Wisdom and Virtue as giving birth to spiritual
    offspring such as wisdom, righteousness, and piety; contrasts these with false
    offspring born from empty opinions; and describes the True Reason or Logos as
    both father and husband, sowing virtues and excellent concepts into the soul or
    intelligence.
  language: English
  quote_policy: summarized
