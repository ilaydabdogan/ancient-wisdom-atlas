canonical_text:
  quote: ''
  summary: 'The passage summarizes the manuscript transmission and reception history
    of the Hermetic Corpus: Reitzenstein’s account supersedes earlier manuscript work;
    a damaged eleventh-century manuscript is said to underlie preservation of the
    Corpus; Michael Psellus circulated the writings while guarding against suspicion;
    some manuscripts omitted chapters justifying polytheism; and Renaissance humanists,
    including Pletho, Cosimo de’ Medici, Ficino, and Fra Lionardo, transmitted, translated,
    and collected the Greek text.'
  language: English
  quote_policy: summarized
