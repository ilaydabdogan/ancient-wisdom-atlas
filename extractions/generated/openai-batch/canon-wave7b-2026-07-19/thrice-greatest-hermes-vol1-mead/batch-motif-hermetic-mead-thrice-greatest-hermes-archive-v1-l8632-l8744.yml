canonical_text:
  quote: ''
  summary: The passage presents an expository account of a mystery teaching in which
    Man and Soul are described through a triple-and-one structure. Soul is said to
    animate generation, growth, and even stones. The Assyrian mystery is associated
    with Adonis or Endymion, and several divine female figures are described as loving
    or desiring Soul under those names. Aphrodite is equated with Genesis; Persephone/Kore’s
    relation to Adonis places Soul under Death; Selene’s relation to Endymion is linked
    with formal beauty and higher spaces. The Mother of the Gods and Attis are then
    used to describe separation from earthy parts and ascent toward an Essence Above.
    Editorial notes connect these episodes with a threefold classification of Soul,
    a possible lacuna between Assyrian and Phrygian material, and a comparison to
    a fourth state and to an Attis/Hilaria salvation mystery.
  language: English
  quote_policy: summarized
