  summary: The passage introduces Mead's treatment of Plutarch's essay on Isis and
    Osiris. It emphasizes the difficulty of interpreting ancient mysteries, suggests
    that Plutarch's wording may carry double meanings, contrasts Greek intellectual
    interpretation with an Egyptian mode of bodily union with the Mystery or Great
    Breath, identifies Klea as a Delphic priestess initiated into the Osiriac Mysteries,
    and cites a view that Plutarch's naturalistic identifications of Egyptian gods
    reflect Hermetic books current in his time.
