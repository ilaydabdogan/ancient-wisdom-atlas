canonical_text:
  quote: "“They said: We see fire and water, and wine and blood.”"
  summary: The passage first describes Jesus performing a rite over those who come
    to him, after which they see an indescribably vast Light and report seeing fire,
    water, wine, and blood. It then gives a “Mystic Rite of the Flame,” with invocations
    to the living God, the Light, and the Logos, asking the divine presence to enter
    the fire, reveal itself, remain present, and grant knowledge. The invoked Logos
    is described as ordering night and day, guiding a ship, holding a helm, and being
    a dragon-slayer.
  language: English
  quote_policy: quoted
