canonical_text:
  quote: ''
  summary: The passage describes an Egyptian-Hermetic path of the Just after release
    from the flesh, moving through stages of light, wisdom, second birth, life, fire,
    judgment, illumination, immortality, and union with the divine. It also discusses
    graded forms of knowledge in mystic schools, liturgical scenes of judgment and
    victorious departed souls, the initiated twice-born traversing former weakness
    while crowned with light, and a further ascent beyond earth, planets, and sun
    toward Sothis. The author concludes by asserting Egyptian Wisdom as a principal
    source of the Hermetic treatises.
  language: English
