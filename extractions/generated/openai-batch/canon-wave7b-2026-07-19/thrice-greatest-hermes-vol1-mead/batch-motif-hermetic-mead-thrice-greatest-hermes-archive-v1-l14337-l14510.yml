canonical_text:
  quote: ''
  summary: The passage summarizes Philo's account of the rational soul as image of
    the Divine and as related to the Logos, presents Abraham and Moses as examples
    for immortality, angelic equality, and return to God, and then introduces Plutarch
    as a Greek interpreter and initiate of the mysteries of Isis and Osiris who seeks
    the deeper reason behind sacred rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes the divine world-order or intelligible cosmos as all
    power, infinitely extending and infinitely powerful, with even its parts described
    as infinite.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rational soul or mind of man is said to be potentially the Intelligible
    Cosmos or Logos.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moses is said to have called the rational soul the image of the Divine and
    Invisible, impressed with the soul of God, whose signet is the Eternal Reason
    or Logos.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Abraham is presented as a type of the disciplined soul: he abandons mortal
    things, is added to the people of God, plucks the fruit of immortality, and becomes
    equal to the angels.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The angels are identified as the people or host of God and as incorporeal,
    happy souls.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: A higher degree of union is described as the Race or Kin of God, an intimate
    union of those kin to God in which they become one.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Those perfected beyond introductory discipline become natural Disciples of
    God, receive wisdom without toil, and migrate to the incorruptible and perfect
    Race.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The death of Moses is interpreted allegorically as migration by the Word or
    Logos of the Cause, by whom the cosmos was created; the same Logos brings the
    perfect man from earthly things back to God.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage frames the Logos doctrine as a central idea of Hellenistic theology
    and as an important background for Christian origins.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: Plutarch is introduced as a learned Greek who remains within Hellenic traditions
    while turning to Egypt and interpreting its message in Greek modes of thought.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Plutarch chooses the myth and mysteries of Osiris and Isis as his theme and
    is described as initiated into the Osiriaca.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The true initiate of Isis is described as one who goes beyond formal reception
    of symbolic mysteries and keeps searching into the intimate reason of things shown
