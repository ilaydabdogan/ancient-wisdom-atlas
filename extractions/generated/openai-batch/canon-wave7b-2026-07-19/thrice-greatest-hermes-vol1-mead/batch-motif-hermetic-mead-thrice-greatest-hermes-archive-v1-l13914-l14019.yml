canonical_text:
  quote: ''
  summary: The passage presents Philo’s allegorical reading of the river that gladdens
    the City of God. The river is interpreted as the Divine Reason or Logos, which
    gladdens the cosmos and the wise soul. Jerusalem is interpreted as the Sight of
    Peace and is to be sought in the peaceful contemplative soul rather than in an
    earthly city. Mead then relates this interpretation to New Jerusalem, Ogdoad,
    Pleroma, Treasure of Light, divine lights or reasons, and introduces the Logos
    as allegorical manna or heavenly food.
