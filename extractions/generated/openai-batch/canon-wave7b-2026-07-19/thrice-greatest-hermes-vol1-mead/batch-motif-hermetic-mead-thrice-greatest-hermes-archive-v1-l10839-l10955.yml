  evidence_refs:
  - ev:2
- id: obs:7
  text: Eden is identified as his brain, Paradise is considered the Man as far as
    his head, and the river from Eden or the brain is divided into four streams.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The first river, Pheison, is associated with Evilat, gold, ruby, and green
