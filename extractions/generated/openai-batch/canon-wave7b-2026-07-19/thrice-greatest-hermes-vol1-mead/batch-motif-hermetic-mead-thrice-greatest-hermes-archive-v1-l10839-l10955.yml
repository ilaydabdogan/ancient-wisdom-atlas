canonical_text:
  quote: Naas is the Serpent
  summary: The passage reports a Naassene exposition in which Naas, the Serpent, is
    honored as the moist sustaining essence of all things. It links shrines and initiations
    with Naas, interprets Eden, Paradise, and the four rivers as parts or faculties
    of a human/head figure, and connects the river with water above the firmament
    and living water.
  language: English
  quote_policy: quoted
