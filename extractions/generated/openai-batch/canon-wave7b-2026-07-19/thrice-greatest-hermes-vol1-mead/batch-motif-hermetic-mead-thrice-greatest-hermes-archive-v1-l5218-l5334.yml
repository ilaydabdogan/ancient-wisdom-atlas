  quote: For thou art I, and I am thou.
  summary: The passage gives portions of devotional or theurgic invocations to a Greco-Egyptian
    Hermes/Thoth/Agathodaimon figure. The speaker praises the deity as cosmic lord
    and possessor of Truth, asks him to enter the mind and heart, claims identity
    with him, relies on his Name for protection from serpents and unseen powers, seeks
    benefits and grace, and begins an invocation to Lord Hermes using womb/babe and
    divine food imagery. Editorial notes connect the material with Egyptian concepts
    of the divine Name, the Ogdoad, a Gospel of Eve identity formula, regeneration,
    and wisdom as heavenly food.
