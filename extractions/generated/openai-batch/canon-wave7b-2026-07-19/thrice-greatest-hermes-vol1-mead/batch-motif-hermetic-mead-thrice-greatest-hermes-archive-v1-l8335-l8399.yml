canonical_text:
  quote: This Man is male-female, and is called by them Adamas.
  summary: Mead introduces Hippolytus' hostile account of Naassene doctrine. The passage
    says the Naassenes were named from the Hebrew word for serpent, later called themselves
    Gnostics, and honored Man or Son of Man as the universal Logos. This Man is male-female
    and called Adamas. A hymn addresses Adamas in relation to Father, Mother, the
    Parents of Aeons, Heaven as city, and mighty names.
  language: English
  quote_policy: quoted
