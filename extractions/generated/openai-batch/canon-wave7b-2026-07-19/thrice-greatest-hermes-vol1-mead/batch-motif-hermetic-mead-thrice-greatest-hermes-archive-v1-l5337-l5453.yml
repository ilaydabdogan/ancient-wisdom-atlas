canonical_text:
  quote: I am thou, and thou art I.
  summary: The passage preserves ritual invocations to Hermes. The speaker claims
    knowledge of Hermes' names, forms, tree, wood, city, and true name, identifies
    with Hermes, and petitions him for favor, grace, beauty, power, and access to
    gifts. A later invocation addresses Lord Hermes as many-named, beneficent, knowing
    hidden secrets above and below the earth, inventor of incantations, and a god
    whom Horus once called upon. The speaker also claims to have performed required
    actions for a black dog-ape called lord of the nether ones.
  language: English
  quote_policy: quoted
