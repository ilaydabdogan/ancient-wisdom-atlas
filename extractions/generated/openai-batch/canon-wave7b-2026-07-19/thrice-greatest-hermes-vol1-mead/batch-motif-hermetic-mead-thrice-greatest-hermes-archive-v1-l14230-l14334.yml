canonical_text:
  quote: ''
  summary: 'The passage presents a Philonic instruction in which a Servant of God
    is taught to strive toward likeness with the cosmos and become a “little cosmos.”
    Mead then compares this with Plotinus’ contemplative exercise: the practitioner
    forms a transparent mental image of the cosmos, conceives a second sphere stripped
    of mass, space, and matter, and invokes God, who comes with his own cosmos and
    all the gods in a unity of one and many.'
  language: English
  quote_policy: summarized
