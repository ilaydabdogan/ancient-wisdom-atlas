canonical_text:
  quote: ''
  summary: The passage reports an anecdote about Ochus and the slaughter of Apis,
    rejects a Typhon-on-an-ass story as importing Judaic material, and then presents
    physical and symbolic explanations of Osiris, Isis, Typhon, the Nile, the sea,
    priestly taboos, Sais temple signs, and a Pythagorean saying about the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ochus, a Persian king, is described as blood-polluted and abominable, nicknamed
    "Ass," and as slaughtering Apis after threatening to feast on the Egyptians' Ox.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A reported account says Typhon fled from a fight on an ass for seven days
    and then begat Hierosolymus and Judaeus; the passage says this imports Judaic
    matters into the myth.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage presents a physical allegory in which Osiris united with Isis,
    identified as earth, is Neilos, while Typhon is the sea into which Neilos falls,
    vanishes, and is dispersed, except for what earth receives and uses productively.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A sacred dirge on Kronos is said to lament one born in the left-hand parts
    and dying in the right-hand parts.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Egyptians are said to map the eastern parts of the cosmos as the face, the
    northern parts as the right hand, and the southern parts as the left hand.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Nile is said to flow from the south and be consumed by the sea in the
    north, so that it is said to be born in the left hand and die in the right hand.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The priests are said to pronounce the sea expiate, call salt Typhon's foam,
    prohibit setting salt on the table, avoid greeting sailors, and write "Hate fish!"
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: 'At Sais, the temple entrance of Athena is said to have contained the sequence
    of signs: babe, old man, hawk, fish, and hippopotamus.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage interprets the Sais signs as meaning that those being born and
    dying are told that God hates shamelessness.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The passage explains babe as birth, old man as death, hawk as God, fish as
    hatred, and hippopotamus as shamelessness, adding a fable that the hippopotamus
    kills its sire and violates its dam.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage reports a Pythagorean saying that the sea is the tears of Kronos
