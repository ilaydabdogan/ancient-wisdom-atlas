- id: obs:3
  text: The law described does not place the soul at its first birth into a beast's
    nature; it implants souls into human seeds according to the degree of vision they
    previously attained.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nine ranked human life-types are listed, from wisdom-lover, lover of beauty,
    or lover of the Muses through lawful ruler, civic worker, bodily disciplinarian
    or healer, oracle or mystic-rite life, poet or copier, workman or husbandman,
    sophist or demagogue, and tyrant.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that righteous living obtains a better fate and unrighteous
