canonical_text:
  quote: ''
  summary: A Platonic account of metempsychosis describes the soul losing its wings
    and falling to Earth when weighed down by forgetfulness and wickedness. Souls
    are implanted into ranked human lives according to what they have seen; righteous
    and unrighteous lives lead to better or worse fates. Souls undergo long cycles
    before regaining wings, face judgment after life, receive correction below Earth
    or reward in Heaven, and later come to a lottery where they choose another life,
    including possible passage from human to brute life.
  language: English
  quote_policy: summarized
