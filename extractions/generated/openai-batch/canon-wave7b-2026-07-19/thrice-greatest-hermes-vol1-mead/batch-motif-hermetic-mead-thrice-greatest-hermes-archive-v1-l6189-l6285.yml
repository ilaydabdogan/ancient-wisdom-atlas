  summary: The passage presents Manetho as an Egyptian priest and learned writer whose
    works drew on temple inscriptions and priestly records. It cites Syncellus' preservation
    of a passage attributed to Manetho's Sothis, where Manetho's replies to Ptolemy
    are said to rely on monuments in the Seriadic country. These monuments are described
    as engraved by Thoth, the first Hermes, then translated after the flood and stored
    in temple books by the second Hermes, the Good Daimon's son and father of Tat.
    The passage then gives the opening of Manetho's letter to Ptolemy Philadelphus.
  language: English
