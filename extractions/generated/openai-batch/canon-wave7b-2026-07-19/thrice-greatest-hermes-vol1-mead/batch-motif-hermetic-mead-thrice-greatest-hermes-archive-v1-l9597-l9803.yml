canonical_text:
  quote: ''
  summary: The passage interprets a Cup, water and wine, hidden spiritual birth, the
    Kingdom within, Samothracian mystery-statues, the Original Man, Jesus' sayings
    about flesh, blood, and the cup, the twelve disciples and tribes, Korybas as a
    descending figure from above, and biblical images of flood, many waters, rivers,
    and fire as parts of a single mystery of Man.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A drinking-vessel or Cup is identified as the vessel in which the King drinks
    and divines, and it is said to have been found hidden in the fair seed of Benjamin.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Greek verses ask for water and wine and say that the Cup tells the speaker
    what race he must be born from while speaking silently.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Anacreon's Cup is described as speechless, as revealing a hidden mystery in
    silence, and as indicating a spiritual rather than carnal birth.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage identifies the water at the nuptials in Cana as water that Jesus
    turned into wine and calls this the beginning of signs that manifested his kingship
    or kingdom of the heavens.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Kingdom of the Heavens is said to be within, stored as a treasure, and
    compared to leaven hidden in three measures of flour.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage calls this teaching the Great Ineffable Mystery of the Samothracians
    and says it is lawful only for the perfect to know it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Samothracian Mysteries are said to hand on the tradition that Adam is
    the Man Original.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the initiation temple of the Samothracians there are said to stand two
    naked male statues with both hands raised to heaven and ithyphallic, like the
    statue of Hermes in Cyllene.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The two statues are described as images of the Man Original and of the regenerated
    spiritual man of like substance with that Man.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Quoted sayings attributed to the Saviour concern drinking his blood, eating
    his flesh, drinking the cup he drinks, and being unable to go where he goes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says Jesus knew each disciple's nature, chose twelve disciples
    from twelve tribes, spoke through them to every tribe, and that not all can receive
    preachings contrary to their nature.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Thracians dwelling around Haimos and Phrygians are said to call this Man Korybas,
    whose descent begins from the Head Above and expressive Brain and passes through
    all sources beneath, though the manner of descent is not understood.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A quoted saying states that his voice was heard but his form was not seen;
    the passage adds that his voice is heard when delegated and expressed, but the
    descended form from above is unknown and is in the earthy plasm.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Man is said to inhabit the Flood and to cry from many waters; the many
    waters are interpreted as the manifold mortal genesis of men, from which he calls
    to the Inexpressible Man to save the alone-begotten from lions.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: A saying addressed to the Man as Son, Israel, tells him not to fear because
    rivers will not engulf him and fire will not consume him.
  category: speech
  evidence_refs:
  - ev:13
