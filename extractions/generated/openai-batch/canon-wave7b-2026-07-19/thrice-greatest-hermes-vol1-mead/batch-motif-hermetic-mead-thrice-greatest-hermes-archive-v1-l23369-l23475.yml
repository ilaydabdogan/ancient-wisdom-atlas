canonical_text:
  quote: ''
  summary: The passage contrasts the simpler philosophical form of Trismegistic Gnosis
    with more elaborate apocalyptic and Ophite imagery. It summarizes an Ophite Diagram
    of unseen spaces divided into upper, middle, and lower regions, with circles associated
    with Leviathan, Behemoth, and seven ruling daimones. It also reports a post-mortem
    doctrine in which angels of light and archontic powers stand on either side of
    the soul, leading pure and evil souls to different destinations.
  language: English
  quote_policy: summarized
