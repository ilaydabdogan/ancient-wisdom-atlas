  quote: ''
  summary: The passage argues about the sources and antiquity of Trismegistic literature.
    It links Adam and the First Man tradition with ancient brick and stone monuments,
    discusses a Talmudic story of Jesus learning magic in Egypt, identifies the Seriadic
    Land with Isis and Egypt, and treats the Books of Hermes and later Trismegistic
    writings as descendants of archaic Egyptian monuments. It also discusses the epithet
    Trismegistus/Thrice-greatest and cites Martial as evidence for Roman awareness
    of the designation.
