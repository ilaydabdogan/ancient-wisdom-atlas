canonical_text:
  quote: ''
  summary: The passage surveys scholarly views on the relation of Trismegistic writings
    to Gnosticism, Christianity, Philo, Plotinus, Therapeuts, Judaism, and Paganism.
    It reports Ménard’s view of a Judaeo-Egyptian Gnosis moving between these settings,
    questions the label “Jewish Therapeuts,” summarizes a theological hierarchy with
    a supreme God, and notes Reitzenstein’s rejection of direct Jewish influence on
    the Trismegistic literature.
  language: English
  quote_policy: summarized
