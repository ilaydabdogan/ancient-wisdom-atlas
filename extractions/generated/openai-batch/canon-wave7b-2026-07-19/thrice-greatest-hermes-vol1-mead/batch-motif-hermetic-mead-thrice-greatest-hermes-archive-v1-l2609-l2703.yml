- id: obs:1
  text: The passage says the oldest Trismegistic treatises are earlier than Basilides
    and Valentinus and contain a simpler form of Gnosticism.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ménard is quoted as saying that the Hermetic books show a Judaeo-Egyptian
    Gnosis existing beside Christianity in the first century and passing from the
    school of Philo to the school of Plotinus.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage clarifies that Ménard used “Christianity” for the tendency later
    called Catholic or General Christianity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage questions the label “Jewish Therapeuts” and says Philo presented
    the Therapeuts as principally Jews, while also showing them as drawn from many
    nations and communities.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ménard’s answer to the question about the Therapeuts includes the possibilities
