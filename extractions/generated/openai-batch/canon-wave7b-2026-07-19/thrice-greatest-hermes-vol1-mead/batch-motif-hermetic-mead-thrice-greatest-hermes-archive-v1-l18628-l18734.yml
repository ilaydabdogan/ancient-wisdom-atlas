canonical_text:
  quote: ''
  summary: 'The passage describes images and rites connected with Osiris, Isis, Horus,
    the Sun, Moon, and Typhon: an ithyphallic Osiris image in a flame-coloured robe;
    rejection of assigning the sun to Typhon; hymns and festivals concerning the Eye
    of Horus and the Sun''s Staff; a winter-solstice Cow procession called the Seeking
    for Osiris; offerings and incense to the Sun; and reported identifications of
    Osiris with Sun/Sirius and Isis with Moon.'
