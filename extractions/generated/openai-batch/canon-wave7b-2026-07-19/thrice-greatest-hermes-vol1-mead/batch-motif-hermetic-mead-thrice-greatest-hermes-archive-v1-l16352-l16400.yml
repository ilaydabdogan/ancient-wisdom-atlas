canonical_text:
  quote: ''
  summary: 'The passage gives rival explanations for the many tombs of Osiris in Egypt:
    Isis either performed burial rites for each piece she found, or made images and
    distributed them to cities as if each city received the whole body, thereby gaining
    honors and obscuring the true tomb from Typhon. It also says Isis did not find
    one part of Osiris because it was cast into the River and eaten by named fishes;
    she made a counterfeit of it and consecrated the phallus, honored by an Egyptian
    festival. Editorial notes discuss a drifting chest, papyrus, a crocodile of the
    deep, a Hippolytus/Gnostic refrain about Egypt as body, and uncertainty about
    the fourteen parts of Osiris.'
  language: English
  quote_policy: summarized
