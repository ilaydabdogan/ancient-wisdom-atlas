- id: obs:1
  text: Ocean is described as flowing and ebbing, moving downward and upward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The downward flow of Ocean is associated with the birth-causing of men, while
    the upward flow toward the Wall, Palisade, and White Rock is associated with the
    birth-causing of gods.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A scriptural statement about being gods and sons of the Highest is linked
    to fleeing Egypt, passing beyond the Red Sea into the Desert, and moving from
    lower intercourse to Jerusalem Above, called the Mother of the Living.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Turning back to Egypt is glossed as returning to lower intercourse and is
    linked with dying like men; the generation below is described as subject to death,
    while birth above is superior to death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that the spiritual man is begotten from water, glossed
    as spirit, while the lower man is fleshly.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Great Jordan is described as flowing downward and preventing the sons
    of Israel from going forth from Egypt, which is glossed as the body; Jesus is
    said to turn it back and make it flow upward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports a claim that all things are not from One but from Three,
    and that the threefold claim provides proof of first principles.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'Three natures are listed: the Blessed Nature of the Blessed Man Above, Adamas;
    the Nature Below, subject to Death; and the race without a king that is born Above.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Mariam, Jothor, Sepphora, and Moses are named in the context of the race born
