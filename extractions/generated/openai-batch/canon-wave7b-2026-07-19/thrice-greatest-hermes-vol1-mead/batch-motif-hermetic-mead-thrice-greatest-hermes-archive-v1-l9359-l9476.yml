canonical_text:
  quote: ''
  summary: The passage reports an exegesis in which Ocean or Jordan flows downward
    and upward, producing lower mortal generation or upper divine/spiritual birth.
    Scriptural language about gods, Egypt, the Red Sea, the Desert, Jerusalem Above,
    flesh and spirit, and Israel’s Jordan crossing is interpreted as movement from
    lower bodily intercourse to an upper, deathless spiritual birth. It also reports
    a threefold scheme of natures and names Adamas, a kingless race born above, Mariam,
    Jothor, Sepphora, and Moses.
  language: English
  quote_policy: summarized
