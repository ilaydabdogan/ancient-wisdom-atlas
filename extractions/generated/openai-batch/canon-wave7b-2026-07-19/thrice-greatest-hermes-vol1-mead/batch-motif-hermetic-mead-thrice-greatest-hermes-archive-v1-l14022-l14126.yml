canonical_text:
  quote: ''
  summary: The passage presents Philo’s descriptions of the Divine Reason or Logos
    as the soul’s food, as dew surrounding the soul, as a coriander seed whose smallest
    part reproduces the whole, as the bread or Word given by God through Moses’ teaching,
    and as the pupil of the eye whose sight beholds all things. It also interprets
    the saying that man does not live by bread alone as nourishment by the whole Logos
    and each word proceeding from God.
  language: English
  quote_policy: summarized
