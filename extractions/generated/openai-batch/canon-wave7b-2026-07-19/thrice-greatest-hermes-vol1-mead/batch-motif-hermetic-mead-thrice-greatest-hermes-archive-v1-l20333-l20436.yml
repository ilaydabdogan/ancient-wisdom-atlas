canonical_text:
  quote: ''
  summary: 'The passage first describes Isis as continually loving, pursuing, and
    consorting with ineffable Beauty, thereby filling generated things with what is
    fair and good. It then explains daily incense offerings in sacred ceremonies and
    purifications: health is treated as closely connected with holiness; pine resin
    is used in the morning to purify heavy night air; myrrh is used at midday to disperse
    turbid exhalations; fire and fragrant woods are said to clear air and benefit
    the sick; Aristotle is cited on the health-giving effect of pleasant odors; and
    huphi is introduced as a sixteen-ingredient aromatic mixture.'
  language: English
  quote_policy: summarized
