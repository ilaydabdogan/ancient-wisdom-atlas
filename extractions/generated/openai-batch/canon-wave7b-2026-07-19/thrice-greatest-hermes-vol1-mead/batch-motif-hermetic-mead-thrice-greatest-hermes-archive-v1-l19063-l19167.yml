canonical_text:
  quote: ''
  summary: The passage interprets Isis, Osiris, Typhon, Nephthys, and Matter allegorically.
    It discusses matter as receptive but not qualityless, presents the Goddess as
    eternally joined to the First God, describes Typhon’s intrusion and Isis’s mourning
    search for Osiris’s fragments, explains divine emanations as repeatedly destroyed
    and reborn in the world, identifies Nephthys/End with the last parts of Matter,
    and derives Isis’s name from knowledgeable, prudent motion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage warns against treating Matter as a wholly soulless, qualityless,
    inert body and gives oil for perfume and gold for a statue as examples of matter
    that still has qualities.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The soul and thought of man are described as the matter of knowledge and virtue,
    to be ordered and brought into rhythm by reason.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Goddess is said to have an eternal share in the First God, to consort
    with Him, and to cling to Him out of love for the goodness and beauty around Him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Typhon steals in and lays hold of the last parts, the Goddess is described
    as seeming melancholy, mourning, and seeking relics and fragments of Osiris.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Goddess enfolds the fragments in her robes, receives them into herself
    when destroyed, hides them away, and produces and sends them forth again when
    they are born.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The reasons, ideas, and emanations of the God remain in heaven and stars,
    while those disseminated into earth, sea, plants, and animals are dissolved, destroyed,
    buried, and repeatedly reappear in births.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The myth is summarized as saying that Typhon lived with Nephthys and that
    Osiris knew her secretly.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nephthys and End are identified with the last parts of Matter and are said
    to be mainly in possession of the destructive power.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Generative and Saving One distributes weak and faint seed into the last
    parts of Matter; Typhon destroys it except for what Isis saves, nourishes, and
    compacts together by adoption.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage contrasts a generative and moving power that moves toward being
    with an annihilating and destructive power that moves toward non-being.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The name Isis is derived from hastening and coursing with knowledge, and Isis
    is called ensouled and prudent motion.
  category: attribute
  evidence_refs:
  - ev:8
