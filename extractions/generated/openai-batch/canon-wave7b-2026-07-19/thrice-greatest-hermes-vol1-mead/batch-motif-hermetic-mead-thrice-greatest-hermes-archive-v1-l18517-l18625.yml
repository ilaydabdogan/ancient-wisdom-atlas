canonical_text:
  quote: ''
  summary: The passage explains Typhon/Seth/Bebon as oppressive, hindering, disordering,
    and associated with destructive natural conditions. It assigns certain animals
    to Typhon, describes ritual and iconographic uses of the hippopotamus, crocodile,
    hawk, and snake, recounts Typhon escaping Horus by becoming a crocodile, and contrasts
    Osiris as represented by eye, sceptre, and hawk signs expressing providence, power,
    and vigilance.
  language: English
  quote_policy: summarized
