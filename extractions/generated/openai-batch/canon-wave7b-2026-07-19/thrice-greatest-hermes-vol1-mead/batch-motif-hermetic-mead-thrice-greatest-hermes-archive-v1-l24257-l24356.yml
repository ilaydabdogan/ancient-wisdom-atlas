canonical_text:
  quote: ''
  summary: The passage describes Er's vision of a cosmic spindle made of eight nested
    whorls or circles with ordered widths, colors, and motions. The spindle rests
    on Necessity; Sirens on the circles sing a single harmony; the Fates sing of past,
    present, and future and turn or touch parts of the spindle. Er and the souls arrive
    before Lachesis, where a prophet orders them, takes lots and samples of lives,
    ascends a raised place, and announces Lachesis's word.
  language: English
  quote_policy: summarized
