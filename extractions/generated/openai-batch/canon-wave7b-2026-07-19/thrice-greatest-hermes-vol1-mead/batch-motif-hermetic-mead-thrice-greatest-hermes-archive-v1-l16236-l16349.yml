canonical_text:
  quote: ''
  summary: The passage recounts Isis mourning a coffin or chest containing a dead
    male body in an Osirian context, transporting it by boat, drying a river in anger,
    and later opening the chest in solitude. A child who witnesses her grief dies
    or, in another version, falls into the river and is associated with Maneros traditions.
    A ritual display of a dead man in a small wooden coffin is explained as a feast-time
    reminder of mortality. Later, while Isis visits her son Horus, Typhon finds the
    chest by night, tears the body into fourteen pieces, and scatters them. Isis searches
    for the pieces in a papyrus skiff through marshes, where crocodiles are said not
    to harm papyrus-hull sailors because they fear or revere the goddess.
  language: English
  quote_policy: summarized
