canonical_text:
  quote: ''
  summary: 'The passage presents Philo''s interpretation of the Incorporeal Man, the
    First-born Son, and the Divine Logos. The Logos is described as the Son of God,
    the true High Priest, the cosmic bond, and one vested with the cosmos and the
    elements. God is named as father and Wisdom as mother. The passage also describes
    two temples of God: the cosmos and the rational soul.'
