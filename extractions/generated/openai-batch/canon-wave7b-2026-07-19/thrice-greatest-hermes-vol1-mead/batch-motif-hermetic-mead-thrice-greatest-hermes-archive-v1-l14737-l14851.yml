  quote: there's nothing greater for a man to get, nor more majestic for a God to
    give, than Truth.
  summary: Address to Klea argues that truth and gnosis about the gods are the highest
    blessing; divine wisdom is contrasted with material wealth and force; Isis is
    presented as wise and opposed by Typhon, who tears the Holy Reason into pieces
    before the Goddess gathers and recomposes it.
  language: English
  quote_policy: quoted
