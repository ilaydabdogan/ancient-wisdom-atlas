canonical_text:
  quote: ''
  summary: 'Mead discusses Mr Adams’s account of the spiritual inner tradition of
    Egyptian Wisdom, criticizes Adams for omitting textual references, and notes both
    Adams’s reliance on Egyptian texts and monuments and Mead’s own use of the Greek
    Trismegistic tradition. The passage describes a spiritual geography for those
    who have gone out from the body: a Holy Land divided into three regions or states—Rusta,
    Aahlu, and Ameriti—associated with initiation, illumination, and union with the
    Unseen Father. It also states that visible Egypt was conceived as the counterpart
    of an unseen world and that the Just follow a path through successive stages after
    the tomb portal is lifted.'
  language: English
  quote_policy: summarized
