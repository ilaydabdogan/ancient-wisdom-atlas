  quote: ''
  summary: The passage describes Mead's analysis of a commentary on the Anthropos
    or Man-doctrine in mystery traditions. It emphasizes a Hellenist commentator learned
    in mystery rites, identifies Osiris with the Heavenly Man and Logos, reports a
    syncretic Thoth-Osiris-Hermes doctrine, compares cup and horn imagery with Platonic
    and Trismegistic vessels, and then describes Jewish Hellenistic and Christian
    Gnostic overwritings of the material, including the Serpent of Wisdom and claims
    of Christian consummation.
  language: English
  quote_policy: summarized
