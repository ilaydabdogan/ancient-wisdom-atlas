canonical_text:
  quote: ''
  summary: The passage gives an allegorical account of Isis, Osiris, Horus, Nephthys,
    Typhon, and related rites in terms of Nile inundation, fertile earth, boundary
    lands, drought, winds, seasonal darkness, and ritual mourning. Osiris is linked
    with the Nile and water; Isis with earth; Horus with season and air; Nephthys
    with boundary land; Typhon with drought; and priestly mourning rites are connected
    with the Nile’s seasonal decline and the denudation of the land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Nile is held to be Osiris's efflux, and the part of earth covered by the
    Nile is described as Isis's body; the Nile sows and mingles with her, producing
    Horus.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Horus is identified with the season and a fair blend of air, and is said to
    have been nursed by Leto in marshes around Buto.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Watery and soaked-through earth is said to nourish exhalations that reduce
    dryness and drought.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nephthys is identified with the extremities and sea-bordering parts of the
    land, is named End, and is said to live with Typhon.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the Nile overflows beyond its ordinary boundaries into the extreme districts,
    the passage calls this the union of Osiris with Nephthys.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The springing up of plants, especially honey-clover, is presented as evidence
    of the overflow union; Typhon is said to become aware of the wrong done to his
    bed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Isis is said to have conceived Horus in lawful wedlock, while Nephthys conceived
    Anubis clandestinely.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A cited king-list tradition says Nephthys was married to Typhon and was at
    first barren; the passage interprets this, if applied to the goddess, as the sterility
    of unproductive land.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Typhon's conspiracy and despotism are identified with drought mastering and
    dispersing the moisture that generates and increases the Nile.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Ethiopian queen is interpreted as southerly winds from Ethiopia, which
    can prevent rains that swell the Nile.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: When Typhon takes possession, he scorches and forces the Nile, weakened and
    low, out into the sea.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The fabled shutting of Osiris in a coffin is interpreted as a riddle of the
    occultation and disappearance of water.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Osiris is said to disappear in the month Athyr, when the Nile sinks, the land
    is denuded, night lengthens, darkness increases, and light wanes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Priests perform melancholy rites and exhibit for four days a cow made entirely
    of gold, covered with black fine linen as mourning for the goddess; the cow is
    treated as an image of Isis and of earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: 'Four things are mourned: the Nile failing and sinking, northern winds being
    extinguished by southern winds, day becoming shorter than night, and the denudation
    of earth with trees shedding leaves.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: On the nineteenth, at night, the keepers and priests go down to the sea; the
