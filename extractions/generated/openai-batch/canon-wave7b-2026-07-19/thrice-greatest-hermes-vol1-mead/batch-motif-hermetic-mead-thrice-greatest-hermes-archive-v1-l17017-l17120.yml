canonical_text:
  quote: ''
  summary: The passage describes Isis preserving the memory of Osiris's suffering
    and her own wanderings through sacred representations that teach religion and
    console sufferers. It states that Isis and Osiris became gods from good daimones
    through virtue. It then reports identifications among Sarapis, Pluto, Isis, Persephassa,
    Osiris, and Dionysus, and narrates Ptolemy's dream-command to bring a gigantic
    statue of Pluto to Alexandria, its discovery at Sinope, secret removal, and recognition
    as Sarapis by its attributes.
