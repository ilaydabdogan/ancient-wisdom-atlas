canonical_text:
  quote: ''
  summary: The passage surveys Greek-Egyptian mystical and theurgic literature associated
    with Petosiris, Nechepso, Vettius Valens, and Trismegistic materials. It describes
    hieratic invocation for a vision of Necessity, ancient sages whose souls became
    heaven-walkers, Nechepso’s ecstatic departure from the body and guidance by a
    heavenly Voice through heaven-space, and comparisons with Trismegistic visions
    involving soul-wings, star-spheres, and Mind. It then frames these materials as
    evidence for Greek books in middle Ptolemaic times treating subjects like those
    of Trismegistic literature, and introduces Manetho as a compiler and translator
    of older records.
  language: English
  quote_policy: summarized
