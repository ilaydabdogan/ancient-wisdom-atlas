canonical_text:
  quote: ''
  summary: 'The passage interprets elements of the Ophite Diagram and related apocalyptic
    materials: it contrasts the Last Day with the initiate soul''s postmortem ascent,
    describes separation of righteous and unrighteous souls, identifies an upper region
    as celestial paradise, explains Leviathan and Behemoth as devouring or transmuting
    soul-energies, associates the Great Fish with knowledge and the whale-belly motif,
    compares traditions about Oannes, Hermes, Plato''s Vision of Er, and Pistis Sophia,
    and notes the paired male-female division of Leviathan and Behemoth within a wheel
    of necessity.'
  language: English
  quote_policy: summarized
