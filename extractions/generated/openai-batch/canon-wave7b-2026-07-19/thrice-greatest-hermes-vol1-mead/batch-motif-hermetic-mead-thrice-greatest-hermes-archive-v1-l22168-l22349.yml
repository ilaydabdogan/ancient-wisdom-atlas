canonical_text:
  quote: ''
  summary: The passage discusses the Aeon doctrine in Mithraic, Persian, Chaldaean,
    Egyptian, Hermetic, and Gnostic contexts. It describes a lion-headed, serpent-enwrapped
    Mithriac figure called Aion, identifies Mithriac Cronus with Time and with Zervan
    Akarana, surveys Aeon language in Hermes-cult prayers for Thoth, the Good Daimon,
    and Isis, and treats Abraxas as a seven-letter and 365-valued cosmic divine name
    connected with the highest God and the lion-headed Aion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cumont is reported as saying that the name of the Mithriac Aion may have been
    used for the awe-inspiring mystic figure in the sacred books of the mysteries,
    although its mystic meaning was concealed from the profane.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A footnote describes the mystic figure as having a lion's head, eagle's wings,
    brute's feet, a human body, a serpent wrapped around it, standing on a globe,
    and holding keys of life and death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says classical authorities report that the Magi used substitute
    names for the ineffable Supreme God, with Cronus serving as a general name for
    the Mystery Deity in the sense of Time.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cumont is quoted as identifying Mithriac Cronus as a personification of Time
    and as representing Zervan Akarana, Infinite Time.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports a Zervanist account in which Ormuzd and Ahriman are born
    from Zervan Akarana, who is placed by mystery adepts at the head of the celestial
    hierarchy as first principle.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The author argues that the evidence points not to a Persian origin of the
    Aeon but to a Chaldaean element dominating the Mithriac form of the Magian tradition.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that Chaldaean and Egyptian wisdom-cultures shared root
    ideas, and that Egypt had a developed idea of Eternity and Eternities, identified
    here with the Aeon and the Aeons.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says the Aeon idea may have entered Alexandrian philosophical
    thought from early Ptolemaic times and certainly by the first century B.C. and
    first century A.D.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage gives Hermes-cult examples in which Thoth is called the Aion of
