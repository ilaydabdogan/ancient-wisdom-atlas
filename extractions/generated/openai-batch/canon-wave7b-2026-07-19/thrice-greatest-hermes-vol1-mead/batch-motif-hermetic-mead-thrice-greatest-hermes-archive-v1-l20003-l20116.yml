canonical_text:
  quote: ''
  summary: The passage explains symbolic and practical reasons for Egyptian reverence
    toward animals. The asp is likened to a star. The crocodile is associated with
    tongueless silence, Divine Reason, unseen seeing, Nile inundation, egg-laying,
    and the number sixty. A footnote describes the scarab as a symbol of Khepera,
    creation, resurrection, the rising sun, and new birth. The ibis is described as
    killing dangerous reptiles, teaching medicinal evacuation by self-purging, identifying
    wholesome water for ritual purification, and suggesting an equilateral triangle
    and the gibbous moon by its form and plumage.
  language: English
  quote_policy: summarized
