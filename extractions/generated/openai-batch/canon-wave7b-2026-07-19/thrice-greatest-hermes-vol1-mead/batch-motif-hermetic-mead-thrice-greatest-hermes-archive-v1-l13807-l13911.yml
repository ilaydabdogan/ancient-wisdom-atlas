canonical_text:
  quote: ''
  summary: The passage summarizes and quotes Philo on disciples of the Divine Reason
    or Logos, the ascent toward Deity through true manhood and wisdom, the Logos as
    covenant and stable foundation, the wicked mind as swept by passions, Eden as
    Wisdom of God, and the Logos as a river flowing from Wisdom to water virtue-bearing
    plants on the sacred Mountain of the Gods. It also describes the Holy Reason as
    divided into four virtues or sources and links the image to the Psalmic river
    of God filled with water.
