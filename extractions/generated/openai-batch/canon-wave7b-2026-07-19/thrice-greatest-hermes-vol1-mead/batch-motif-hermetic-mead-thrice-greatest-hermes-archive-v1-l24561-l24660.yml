canonical_text:
  quote: they all passed on to the Plain of Forgetfulness (Lethe)
  summary: A daimon brings a soul to Clotho and Atropos so that its chosen fate is
    ratified and made irreversible. Er and the other souls pass beneath the Throne
    of Necessity to the Plain of Forgetfulness and the River Heedlessness. Souls drink
    the water, sleep, and are carried into birth; Er does not drink and wakes in his
    body on the pyre. Mead’s commentary compares the daimon’s function with Hermetic
    material and cautiously raises an Egyptian parallel for the vessel or ship of
    the soul.
  language: English
  quote_policy: quoted
