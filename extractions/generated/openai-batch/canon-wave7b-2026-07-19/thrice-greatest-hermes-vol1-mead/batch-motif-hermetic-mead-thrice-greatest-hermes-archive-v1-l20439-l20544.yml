canonical_text:
  quote: "“not compounded in a haphazard way, but with the sacred writings being read
    aloud”"
  summary: 'The passage describes the composition and use of ku''phi: aromatic ingredients
    are mixed while sacred writings are read aloud; the compound changes the air,
    induces sleep without intoxication, clarifies the dream-receptive faculty, is
    compared to Pythagorean lyre-playing before sleep, has internal and external medicinal
    uses, and is classified through a day/night contrast between solar substances
    and mixed nocturnal ingredients.'
