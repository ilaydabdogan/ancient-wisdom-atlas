canonical_text:
  quote: ''
  summary: The passage describes Egyptian and Pythagorean explanations of Typhon as
    red-skinned, ass-like, and daimonic. It lists ritual humiliations and prohibitions
    involving asses, offering cakes stamped with a tied ass, geometric assignments
    of divine powers including Typhon’s association with a fifty-six-angled figure,
    and sacrificial procedures for red oxen, including scrutiny, imprecations, decapitation,
    disposal of the head, and a sealing image of a bound man with a sword in his throat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed force or being is appeased and soothed with feasts of offerings,
    but at other festivals is dreadfully humiliated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Festival actions include rolling red-skinned men in mud and, among the Koptos
    folk, driving an ass over a precipice, with the explanation that Typhon was born
    red-skinned and ass-like.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Busiris folk and Lycopolitans do not use trumpets because their sound
    resembles the braying of an ass.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ass is described as unclean and daimonic because of its resemblance to
    Typhon.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Round cakes made for feasts of offerings in the months Payni and Phaophi are
    stamped with an image or phrase described as an ass tied.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the Feast of Offerings of the Sun, worshippers are told not to wear gold
    on the body and not to give food to an ass.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Pythagorics are said to regard Typhon as a daimonic power and to associate
    him with the fifty-sixth even measure and the fifty-six-angled regular polygon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The same Pythagorean scheme assigns the equilateral triangle, square, and
    dodecagon to named divine powers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Egyptians are said to sacrifice red oxen only after close scrutiny; an animal
    with even one black or white hair is considered unsuitable.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Unsuitable sacrificed animals are described as contrary to acceptable offerings
    and are connected with animals that have seized souls of impure and unrighteous
    men transformed into non-human bodies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: After imprecations are uttered on the head of the sacrificial victim, the
    head is cut off; formerly it was cast into the river, while in the described present
    it is given to strangers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Priests called Sealers mark the sacrificial animal with a seal showing a man
    forced down on one knee, his hands drawn behind him, and a sword in his throat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The ass’s resemblance to Typhon is further attributed to its aversion to being
    taught, its wantonness, and its skin.
  category: attribute
  evidence_refs:
  - ev:9
