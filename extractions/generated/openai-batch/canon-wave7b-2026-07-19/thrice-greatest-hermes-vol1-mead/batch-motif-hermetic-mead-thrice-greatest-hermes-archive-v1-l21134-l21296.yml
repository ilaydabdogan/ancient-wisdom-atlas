  quote: ''
  summary: The passage argues that visionary and apocalyptic experiences are shaped
    by the visionary’s inherited religious imagery. It then reviews proposed parallels
    between Hermas, Zosimus, Setme and Si-Osiri, and Crates, with special attention
    to Crates’ visions of ascent, a book-bearing Hermes, written instruction, and
    Egyptian temple imagery linked to Ptah and Isis/Venus.
  language: English
  quote_policy: summarized
