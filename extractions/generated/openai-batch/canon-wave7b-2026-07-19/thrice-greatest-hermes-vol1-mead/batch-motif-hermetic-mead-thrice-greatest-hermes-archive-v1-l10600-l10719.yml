  quote: ''
  summary: The passage presents a layered theological-mythic exposition in which an
    invisible and ineffable source is associated with the Phrygian name Amygdalos.
    From this source proceeds a generated Invisible being identified with Syriktes,
    Spirit in harmony, and the Word of God. The passage contrasts spiritual worship
    with worship tied to mountain or Jerusalem, names Father and Son, describes the
    Piper as many-named and desired by every nature, and says the Word of the Great
    Power is sealed and hidden in a cosmic Habitation rooted in the universals and
    the Boundless Point.
