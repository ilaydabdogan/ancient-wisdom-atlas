  summary: The passage contains digitization and title-page material followed by the
    opening preface to Mead's Thrice-Greatest Hermes, Vol. I. The preface presents
    the volumes as studies of Trismegistic tradition intended to help prepare materials
    for studying the origins of Christianity through historic, mythic, and mystic
    approaches. It defines mythic as inner, typical, and sacred, and mystic as pertaining
    to initiation and the mysteries, while using infancy and cradle imagery for early
    Christianity/Christendom.
