canonical_text:
  quote: ''
  summary: Mead quotes a Hermetic passage in which ignorance blinds the soul and makes
    it subject to bodily passions and strange bodies. He then introduces the Platonic
    doctrine of transmigration from the Phaedrus, describing souls following God,
    the soul’s charioteer and horses, the ascent toward the space beyond the firmament,
    partial or failed vision of true being, broken wings, the Plain of Truth, and
    the rule that souls who see true things remain unharmed until the next circuit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ignorance is named as the soul’s vice, and the soul lacking knowledge of things,
    their nature, and the Good is described as blinded by bodily passions.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ignorant soul is described as becoming a slave of bodies of strange form,
    bearing the body as a load and being ruled rather than ruling.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author frames the following Platonic material as a review of the doctrine
    of transmigration of souls from the Phaedrus, used to illuminate the preceding
    Hermetic passage.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Souls that best follow God and become like Him keep the head of the charioteer
    lifted into the space outside the firmament and are carried around with its circuit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The same souls are troubled and compelled by the horses, rising and sinking,
    and see only some of the things-that-are.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Other souls strive upward but fail to reach the goal; they are carried together,
