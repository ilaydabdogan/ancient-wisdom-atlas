  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Because of the unskillfulness of charioteers, many souls are maimed, many
    have feathers of their wings broken, and all depart without initiation in the
    sight of That-which-is, taking to the food of Opinion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Plain of Truth is associated with a Meadow where pasture suited to the
    best part of the soul grows, and this pasture nourishes the soul’s wing-power.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The law of Adrasteia states that a soul which has followed God and seen something
    of the true things will be without affliction until its next journey round, and
    always unharmed if it always does this.
  category: sequence
  evidence_refs:
  - ev:7
