canonical_text:
  quote: ''
  summary: The passage recounts how a tree trunk enclosing a coffin is made into a
    roof prop at Byblos. Isis hears of this by a daimonian voice, comes to Byblos
    grieving, gains access to the palace through the Queen’s maids, and becomes nurse
    to the royal child. She attempts to rear the child without nursing, burns away
    its mortal elements at night, and turns into a swallow circling the pillar with
    a dirge, but the Queen interrupts and the child loses immortality. Isis then reveals
    herself, claims the pillar, removes the surrounding tree material, wraps it with
    linen and sweet herbs, gives it to the royal couple, and the wood is venerated
    at Byblos.
  language: English
  quote_policy: summarized
