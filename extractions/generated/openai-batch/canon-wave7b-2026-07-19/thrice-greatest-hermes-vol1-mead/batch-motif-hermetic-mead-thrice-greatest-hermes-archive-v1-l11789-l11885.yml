canonical_text:
  quote: ''
  summary: The passage presents Philo of Alexandria as a knowledgeable witness for
    ideas relevant to Trismegistic tractates, then quotes or summarizes Philo on contemplative
    practitioners of wisdom. These people are described as present across Greek and
    non-Greek worlds, numerous in Egypt and around Alexandria, peaceful and non-retaliatory,
    contemplators of nature and celestial order, with bodies on earth but souls winged
    through aether toward the powers above. They are called citizens of the cosmos,
    associates of Wisdom and Virtue, preservers of a hidden spark of Wisdom, and renouncers
    of abundant possessions.
  language: English
  quote_policy: summarized
