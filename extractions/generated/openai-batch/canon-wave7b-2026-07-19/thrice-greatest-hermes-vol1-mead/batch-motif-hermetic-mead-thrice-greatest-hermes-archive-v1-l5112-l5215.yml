canonical_text:
  quote: ''
  summary: The passage contrasts higher Hermetic teaching with popular Hermes prayers,
    invocatory theurgy, and amulet consecration, then introduces an invocation to
    Hermes as the Good Mind. The invoked Hermes is described as of the four winds,
    life-giving through breath or spirit, possessing a hidden and unpronounceable
    name, having sun and moon as eyes, and embodying cosmic regions as head, body,
    feet, and surrounding ocean. He is also called the Good Daimon, sire of good things,
    nurse of the world, and source of stellar emanations associated with daimons,
    fortunes, and fates.
  language: English
  quote_policy: summarized
