  quote: the truly philosophic life is an initiation into the Divine Mysteries
  summary: The passage presents Philo and Mead on rare ascetic or contemplative people
    whose discipline frees the mind from bodily attachment. It surveys Greek and non-Greek
    examples of sages and virtuous communities, including the Seven Sages, Persian
    Magi, Indian Gymnosophists, Jewish Essenes, and Egyptian Therapeutae/Therapeutrides.
    It concludes that Philo treats the philosophic life as an initiation into Divine
    Mysteries and wisdom as a mystery-tradition.
