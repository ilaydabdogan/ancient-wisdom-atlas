canonical_text:
  quote: ''
  summary: Mead cites and comments on Philo of Alexandria concerning the secrecy of
    ineffable Mysteries, bodily renunciation to avoid improper seeing, hearing, speech,
    and unions, the guarding of Mysteries by the worthy, Lesser and Greater Mysteries,
    neophytes disciplining passions through logos, divine food as bread of life, and
    a noetic vision in which the Lord appears as both trinity and unity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Philo is quoted as saying that properly instructed people would prefer blindness,
    deafness, loss of tongue, or becoming eunuchs rather than see improper things,
    hear harmful words, divulge ineffable Mysteries, or rush into unlawful unions.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mead explicitly compares Philo's statements with Matthew 5:29 on cutting out
    the offending right eye and Matthew 19:12 on making oneself a eunuch for the kingdom
    of the heavens.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that virtue requires reason only, while wrongdoing requires
    bodily organs, including the organ of speech for divulging Mysteries.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mead states that Philo's repeated concern with divulging the Mysteries shows
    that Philo regarded such disclosure as a great enormity.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The 'Naked' are described as those who draw near to God, abandon the life
    of death, share in immortality, and sacrifice all to God.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Only those able to cloak and guard the ineffable Mysteries from the unworthy
    are said to be permitted to see them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Mysteries are described as divided into Lesser and Greater Mysteries,
    and in the Lesser Mysteries neophytes work on untamed and savage passions with
    reason or logos.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The preparation of divine food so that it becomes the bread of life is described
    as a mystery.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage connects the Lesser Mysteries with a doctrine of Trinity and cites
    Genesis 18:2, where three men stand by the lifted-eyed figure.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Philo distinguishes bodily eyes from the eyes of the soul or wisdom, saying
    God cannot be seen by the senses but by the soul.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The sight of the souls of the many and unrighteous is described as shut in
    and asleep, while the wise man's spiritual eyes are awake and watchful.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The wise man is described as becoming 'all eye' and seeing the Lord so that
    one vision appears as trinity and the trinity as unity.
  category: action
  evidence_refs:
  - ev:9
