canonical_text:
  quote: ''
  summary: The passage discusses Tem as an ancient Egyptian human-form manifestation
    of God and relates Young Tem to Young Thoth in Trismegistic tradition. It then
    treats I-em-hetep/Imhotep as a son of Ptah, equated by Greeks with Asclepius,
    a deity of healing, medicine, learning, funeral rites, embalming, scribal power,
    and protection of the dead. It also notes temples and inscriptions at Memphis
    and Philae describing him as life-giving, wonder-working, responsive to callers,
    a giver of sons, and the image and likeness of Thoth the Wise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tem is described as the first living Man-God known to the Egyptians, while
    Osiris is described as the first dead Man-God; Tem is said to have been represented
    in human form with a human head.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Tem was regarded as a manifestation of God in human
    form, that his worship was very ancient and widespread, and that priests united
    him with Ea under the name Ea-Tem because he was thought to share attributes with
    Ea.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Trismegistic tradition described here, Thoth holds the chief place,
    and Young Tem is said to represent Young Thoth, who succeeded to his Father after
    that Father ascended to the Gods.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Egyptian texts treat I-em-hetep, also called Imhotep, as
    a Son of Ptah and as the third member of the Memphitic Triad; the Greeks called
    him Imouthes or Imuth and equated him with Asclepius.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The name I-em-hetep is glossed as meaning “He who cometh in Peace”; the passage
    says he brought the knowledge of healing to mankind and was a god of medicine,
    study, and learning.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: As a god of learning, I-em-hetep is said to have shared some attributes of
    Thoth, taken Thoth’s place in funeral ceremonies and embalming, later absorbed
    Thoth’s duties as Scribe of the Gods, and been credited with words of power protecting
    the dead in the Underworld.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A quoted Ritual of Embalmment statement says the deceased person’s soul unites
    with I-em-hetep in the funeral valley.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The oldest shrine of I-em-hetep is said to have been near Memphis and to have
    been called the Temple of I-em-hetep, the Son of Ptah; the Greeks called it the
    Asclepieion.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Philae temple inscription under Ptolemy IV calls the god Great One, Son
    of Ptah, Creative God, life-giver, Mighty One of wonders, one who comes when called,
    giver of sons to the childless, wisest and most learned, and image and likeness
    of Thoth the Wise.
  category: attribute
  evidence_refs:
  - ev:8
