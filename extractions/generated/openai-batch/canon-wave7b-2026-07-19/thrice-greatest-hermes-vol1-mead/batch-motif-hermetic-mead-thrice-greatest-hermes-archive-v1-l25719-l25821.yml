    of hidden wisdom
  summary: The passage surveys Hermetic and Egyptian traditions in which disciples
    receive instruction, writings are addressed to King Ammon, and a wise priestly
    or divine figure instructs or presents inventions to a king. It compares this
    pattern with Petosiris and Nechepso, with royal initiation into priestly wisdom,
    with Thoth presenting inventions to Thamus, and with Osiris honoring Hermes for
    renowned inventions.
