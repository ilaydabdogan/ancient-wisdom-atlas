canonical_text:
  quote: ''
  summary: Mead quotes and comments on Plutarch's account of Thespesius being guided
    through Hades by a deceased kinsman to a chasm or crater called the Place of Lethe.
    Souls circle the vortex, whose interior resembles Bacchic caves filled with foliage,
    fragrance, revelry, and pleasure. The kinsman says it is the route by which Dionysus
    ascended and later raised Semele, but he drags Thespesius away because pleasure
    and bodily memory draw souls downward. Notes compare this with Plato, Macrobius,
    Pistis Sophia, and Hermetic passages on moist essence, including contrasting draughts
    or cups of oblivion and wisdom.
  language: English
  quote_policy: summarized
