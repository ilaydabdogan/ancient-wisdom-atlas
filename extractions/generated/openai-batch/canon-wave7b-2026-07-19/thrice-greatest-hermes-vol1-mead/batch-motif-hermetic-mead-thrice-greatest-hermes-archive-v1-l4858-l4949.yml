canonical_text:
  quote: ''
  summary: The passage describes ritual images in which the soul takes forms such
    as a lily, uraeus, and crocodile; presents the Deity as source of Light, Life,
    Love, and Joy; describes a candidate crowned after the Passage of the Sun and
    initiated from a restricted Secret Scroll; and distinguishes living initiation,
    recitation over the uninitiated dead, and later burial of chapters as talismans.
    It further explains priestly recitation over the dead as instruction for the soul's
    postmortem path.
