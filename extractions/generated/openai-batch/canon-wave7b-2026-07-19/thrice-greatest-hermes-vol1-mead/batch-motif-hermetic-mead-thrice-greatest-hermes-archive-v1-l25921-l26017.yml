    with the Christian triad James, John, and Peter, citing traditions about post-resurrection
    transmission of Gnosis and John’s role as spiritual successor. He then frames
    the Perfect Sermon’s triad as a group before a Master whose distinct qualities
    of Power, Knowledge, and Love must be harmonized into the Master’s Wisdom.
