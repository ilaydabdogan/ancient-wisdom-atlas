canonical_text:
  quote: ''
  summary: 'The passage gives natural-philosophical interpretations of Isis-Osiris
    myths: God and Moist Nature are described as generative sources; Typhon casts
    the chief part of Osiris into a river and Isis institutes a substitute rite; Apophis
    wars against Zeus, Osiris aids Zeus, and Zeus adopts Osiris as Dionysus. It also
    records Greek and Egyptian associations of Dionysus, Osiris, ivy, and names, then
    links Sirius, the Lion, and temple lion-mouth ornaments with Nile inundation.'
  language: English
  quote_policy: summarized
