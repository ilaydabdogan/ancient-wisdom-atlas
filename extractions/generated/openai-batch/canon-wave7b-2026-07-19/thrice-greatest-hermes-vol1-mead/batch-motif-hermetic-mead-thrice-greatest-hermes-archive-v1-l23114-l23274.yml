canonical_text:
  quote: ''
  summary: 'The passage compares Macrobius, Servius, and Hermes on planetary zones
    or spheres and their assigned characteristics. Macrobius is presented as transmitting
    a seven-planet scheme of faculties without inherent evil tendencies. Servius is
    presented as following a fivefold ethical scheme in which spheres are sources
    of evil tendencies. The author notes several partial parallels between Servius
    and the Hermetic sevenfold doctrine: lustfulness with lustful error, desire of
    rule with domineering arrogance, wrathfulness with unholy daring, and love of
    gain with striving for wealth by evil means. A Saturnian torpor in Servius is
    said to lack a Hermetic equivalent.'
  language: English
  quote_policy: summarized
