canonical_text:
  quote: '"from one and the same Water the Olive selects and draws Oil, and the Vine
    Wine"'
  summary: The passage presents a teaching in which all natures come to Water and
    receive what is proper to them; a blind person is urged to see the True Light
    through the speakers; Paradise contains trees, seeds, and flowing Water from which
    different trees draw different products. It then describes spiritual men choosing
    from Living Water, journeying through the True Gate identified with Jesus, completing
    a Mystery at the third Gate, and being anointed with ineffable chrism from a horn
    in contrast to Saul’s clay flask. The passage is framed polemically as part of
    a rejected or erroneous gnosis.
  language: English
  quote_policy: quoted
