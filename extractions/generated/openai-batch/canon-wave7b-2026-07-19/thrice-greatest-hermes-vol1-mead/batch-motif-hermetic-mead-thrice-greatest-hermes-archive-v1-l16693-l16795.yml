canonical_text:
  quote: ''
  summary: The passage reports astral names for the souls of Isis, Horus, and Typhon;
    describes Thebaid refusal to pay burial dues for sacred animals because Kneph
    is held immortal; summarizes and rejects euhemeristic interpretations that reduce
    gods to human rulers; gives bodily descriptions and titles for several Egyptian
    divine figures; and identifies the Greek ship Argō with the constellated bark
    of Osiris near Orion and Dog.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the soul of Isis is called Dog by the Greeks and Sothis by
    the Egyptians, the soul of Horus is called Orion, and Typhon is associated with
    Bear.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For burials of honoured animals, most Egyptians pay mutually determined dues,
    while inhabitants of the Thebaid give nothing because they believe no god is subject
    to death and call Kneph ingenerable and immortal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes an interpretation in which myths commemorate the works
    and sufferings of kings and tyrants who claimed divine reputation and later experienced
    reverses of fortune.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Egyptians are reported as describing Hermes as short-armed, Typhon as
    red-skinned, Horus as white, and Osiris as black.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Osiris is called General, Kanobus is called Pilot, and a star is said to have
    received its name from Kanobus.
  category: attribute
  evidence_refs:
  - ev:5
