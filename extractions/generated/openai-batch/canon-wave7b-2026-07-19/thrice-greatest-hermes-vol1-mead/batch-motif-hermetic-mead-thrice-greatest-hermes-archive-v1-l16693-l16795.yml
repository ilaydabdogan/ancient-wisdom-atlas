    Isis.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The authorial voice criticizes transferring divine names from heaven to earth,
    reducing divine mysteries to human deeds, and listing gods as generals, admirals,
    and kings.
  category: speech
  evidence_refs:
  - ev:7
