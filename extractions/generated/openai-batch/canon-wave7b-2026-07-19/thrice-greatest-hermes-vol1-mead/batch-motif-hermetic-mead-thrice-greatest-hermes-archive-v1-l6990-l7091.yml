  quote: ''
  summary: The passage discusses the dating and contents of a Demotic papyrus containing
    an Egyptian folk-tale cycle. It recounts Hor, son of Pa-neshe, defending Pharaoh
    against distant Ethiopian sorcery, making offerings to Thoth at Khmun, and then
    explains Thoth's title 'eight-times-great' in relation to Trismegistus, Khmun/Khemennu
    as the City of Eight/Ogdoad, a possible Celestial Nile interpretation, and a Der-el-Bahari
    inscription about One becoming Two, Four, Eight, and One again.
  language: English
  quote_policy: summarized
