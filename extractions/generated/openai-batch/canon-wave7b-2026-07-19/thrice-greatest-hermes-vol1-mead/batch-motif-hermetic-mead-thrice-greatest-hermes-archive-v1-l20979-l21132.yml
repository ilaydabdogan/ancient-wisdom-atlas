canonical_text:
  quote: ''
  summary: The passage discusses parallels between Hermas and Hermes traditions. It
    recounts Hermas being led by the Shepherd to an Arcadian, breast-like mountain
    for fuller teaching; notes Arcadia as a major Hermes cult center and as the legendary
    point from which Hermes taught Egyptians; describes Hermas as marked by Gnostic,
    Sophia, Hellenistic, and Hermetic elements; compares personified virtues and vices
    in Hermetic and Hermas materials; and cautions against overextending claims of
    direct literary dependence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Shepherd returns to Hermas and says earlier explanations were incomplete
    because of Hermas's weakness in the flesh, but that he can now explain more clearly
    after Hermas has been strengthened by the Spirit.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Shepherd takes Hermas into Arcadia to a breast-like mountain, where further
    teaching is revealed to him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author states that Arcadia was associated with the chief Hellenic cult
    of Hermes and with a legend that Hermes set out from Arcadia to teach the Egyptians.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author describes Hermas as strongly tinged with Gnostic elements and as
    one of many permutations of the Sophia-mythus.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The passage names paired sacred figures or titles: Christ and Sophia or Wisdom;
    the Son of God and his spouse or sister, the Holy Spirit; the King and Queen;
    and the Lord and the Virgin Church.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author says the visions depict mystic scenes of an allegorical drama of
    man's inner nature, called a mystery-play of all time.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The author states that what is called Gnostic includes much Hellenistic mysticism
    and therefore much that is Hermetic, while Trismegistic literature presents a
    simpler Gnosis than Christian systems technically called Gnostic.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage compares a Hermetic list of twelve vices and ten virtues with
