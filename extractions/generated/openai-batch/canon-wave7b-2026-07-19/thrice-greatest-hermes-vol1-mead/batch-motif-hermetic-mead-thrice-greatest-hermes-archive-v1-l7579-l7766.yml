canonical_text:
  quote: ''
  summary: The passage presents a prayer to Ptah from Papyrus Harris and excerpts
    an inscription describing Ptah as primordial creator, life-giver, and the heart
    and tongue of the divine circle. Creation is associated with primal water, breath,
    thought, utterance, naming, and the production of gods, beings, offerings, and
    actions. Mead’s notes compare related Egyptian hymnic ideas, including Tatenen
    symbolism, Shu and Tefnut, and a cited Hymn to Amen-Ra concerning divine duality,
    an egg, and twin gods.
  language: English
  quote_policy: summarized
