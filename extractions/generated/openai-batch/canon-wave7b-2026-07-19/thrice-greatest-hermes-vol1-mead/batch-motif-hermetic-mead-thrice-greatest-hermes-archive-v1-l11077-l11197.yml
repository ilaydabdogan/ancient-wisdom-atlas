canonical_text:
  quote: ''
  summary: A mystic hymn describes a sequence of Mind, Liquid Chaos, and Soul. The
    Soul labors under Death, passes through alternating states of light, grief, judgment,
    death, and rebirth, and wanders in a labyrinth of ills while seeking escape from
    bitter Chaos. A speaker addresses the Father, asks to be sent down with seals,
    and promises to make a path through aeons and mysteries, display divine forms,
    and transmit the secrets of the Holy Path as Gnosis. Editorial notes compare some
    images cautiously with Bacchic, Orphic, lost-sheep, and Sethian materials.
  language: English
  quote_policy: summarized
