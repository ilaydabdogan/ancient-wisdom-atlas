canonical_text:
  quote: ''
  summary: The passage presents Philo’s account of the Divine Reason or Logos as the
    fullness of divine powers. God sends forth divine words or logoi as apostles to
    aid lovers of virtue and heal diseases of the soul. These logoi are described
    as angels, light-sparks, rays, and secondary beams from the Father-Sun or Light
    of God. Philo interprets the ladder from earth to heaven as the human soul, with
    sensation as its earthly foot and pure mind as its heavenly head. The logoi move
    through the soul, raising it from mortal nature, revealing worthy sights, descending
    in pity to give help, and breathing saving breaths into souls tossed on the body
    as on a river. God walks amid thoroughly purified minds, while divine logoi brighten
    the minds of those still being washed.
  language: English
  quote_policy: summarized
