canonical_text:
  quote: ''
  summary: The passage discusses the Crater or Cup symbol through Thespesius’s vision
    of a huge cup receiving colored streams, Naassene and Gnostic interpretations
    of the Cup as a vessel connected with the Logos and ineffable mystery, and Mead’s
    argument that the symbol belongs to Orphic and Pythagorean tradition rather than
    being Plato’s invention. It then turns to the Memphite triad of Ptah, Sekhet,
    and I-em-hetep/Nefer-Tem, describing Ptah as demiurgic creator, Thoth and the
    Seven Wise Ones as planners, Sekhet as Ptah’s female counterpart and flame, and
    Nefer-Tem as a lotus-associated youthful god linked with Horus and Thoth.
  language: English
  quote_policy: summarized
