canonical_text:
  quote: ''
  summary: The passage describes Isiac discipline, purity, entry into the holy place,
    and the pursuit of gnosis of the First and Lordly One. It presents Isis as connected
    with Hermes or Prometheus in reported traditions, as wise and as a revealer of
    divine mysteries. It explains the true initiate as one who carries the purified
    logos about the gods inwardly, with sacred robes serving as signs, especially
    at death, and distinguishes true initiation from merely outward marks such as
    clothing, shaving, beard, or cloak.
  language: English
