canonical_text:
  quote: ''
  summary: The passage describes Horus being trained for a fight, answering test questions
    about filial aid and the usefulness of the horse over the lion, and being judged
    prepared by Osiris. It then narrates Thtieris coming over to Horus’s side, a serpent
    pursuing her and being cut in pieces by those around Horus, a ritual rope-cutting
    said to commemorate this, Horus’s victory after many days of fighting, and Isis
    releasing bound Typhon instead of killing him.
  language: English
  quote_policy: summarized
