canonical_text:
  quote: ''
  summary: The passage explains a lunar symbolism of the cat, then presents Plutarch's
    account of a true Logos behind the Isis-Osiris mysteries. It rejects simple identification
    of deities with natural elements, assigns Typhon to immoderate excess or deficiency,
    and describes Isis and Osiris as linked with ordered beneficent reality through
    a common Reason. It also reports, while criticizing, seasonal and agricultural
    interpretations in which Osiris is likened to buried and sprouting grain, Isis
    is pregnant and ties an amulet, Harpocrates is born near the winter solstice,
    and first-fruits and thanksgiving rites are offered.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cat is described as fabled to bring forth offspring in increasing numbers
    from one to seven, totaling twenty-eight, the number of the lights of the moon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cat's pupils are said to become full and dilate at the full moon, and
    to contract and shut out light during the moon's waning.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The human face of the cat is said to signify the intellectual and reasonable
    nature of changes connected with the moon.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker says it is not correct to identify water, sun, earth, or heaven
    as Osiris or Isis, or fire, drought, or sea as Typhon.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Typhon is assigned to a nature not subject to measure or rule because of excesses
    or insufficiencies, while what is ordered, good, and beneficent is honored as
    the work of Isis and the image, copy, and reason of Osiris.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Eudoxus is described as disbelieving and being perplexed that Isis, rather
    than Demeter, has charge of love-affairs, and Osiris, rather than Dionysus, has
    power to increase the Nile or rule over the dead.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A single Common Reason or Logos is said to ordain the gods over every domain
    of good; Osiris gives origins, and Isis receives and distributes them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A criticized group associates the mystic recitals about the gods with seasonal
    atmospheric changes and agriculture, including corn generation, sowings, and ploughings.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: That group says Osiris is buried when sown corn is hidden in the earth and
    comes to life and shows himself when it begins to sprout.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The same reported interpretation says Isis ties an amulet around her neck
    while pregnant on the sixth day of the first half of Phaophi.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Harpocrates is said in this interpretation to be brought forth about the winter
    solstice as an imperfect infant in things that sprout too early.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: First-fruits of growing lentils are offered to Harpocrates, and days of thanks
