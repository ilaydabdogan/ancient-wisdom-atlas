canonical_text:
  quote: '"we should look on the Apis as an en-formed image of the soul of Osiris"'
  summary: The passage rejects several proposed genealogies and etymologies for Isis,
    Typhon, Sarapis, Osiris, and Apis; reports a claim that Dionysus brought two oxen
    named Apis and Osiris from India to Egypt; describes a claim about Apis' coffin
    and brazen gates of Oblivion and Wailing at Memphis; records priestly teaching
    that Osiris and Apis are joined in one name and that Apis images the soul of Osiris;
    explains Amenthe as a subterrene space to which souls depart after death; and
    states that Osiris and Isis changed from good daimones into gods while Typhon's
    power is dimmed and shattered.
  language: English
  quote_policy: quoted
