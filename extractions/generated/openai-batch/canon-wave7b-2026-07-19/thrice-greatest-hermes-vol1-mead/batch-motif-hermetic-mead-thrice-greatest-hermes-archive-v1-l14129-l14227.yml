  summary: The passage explains Philo's language of abandoning lower "fathers" and
    compares it with Gospel and Pistis Sophia sayings about leaving or hating family
    for discipleship. It then notes a shared Deuteronomy quotation in Philo and the
    Temptation tradition. The passage next presents Philo's Divine Reason or Logos
    as a personified mediator, boundary, suppliant, ambassador, hostage, and herald
    of peace between God and creation, and describes the High Priest's breastplate
    and twelve stones as symbols of the Logos and as a sacred oracle.
