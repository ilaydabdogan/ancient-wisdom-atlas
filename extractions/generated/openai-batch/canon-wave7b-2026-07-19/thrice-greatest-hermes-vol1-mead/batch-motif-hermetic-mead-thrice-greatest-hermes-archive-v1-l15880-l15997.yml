canonical_text:
  quote: ''
  summary: 'The passage narrates Typhon’s plot against Osiris: while Osiris is away,
    Typhon does not revolt because Isis holds power under guard; after Osiris returns,
    Typhon gathers seventy-two men and an Ethiopian queen, makes an ornate chest secretly
    fitted to Osiris’s body, and offers it at a banquet to whoever fits it. When Osiris
    lies in it, those present seal the chest with fastenings and hot lead, carry it
    to the River, and send it into the Sea through the Tanitic mouth. The event is
    dated to the seventeenth of Athur, when the Sun is in Scorpio, in the twenty-eighth
    year of Osiris’s reign. The passage also reports a Greek identification of Osiris
    with Dionysus and begins a fragment about Pans and Satyrs near Chemmis.'
  language: English
  quote_policy: summarized
