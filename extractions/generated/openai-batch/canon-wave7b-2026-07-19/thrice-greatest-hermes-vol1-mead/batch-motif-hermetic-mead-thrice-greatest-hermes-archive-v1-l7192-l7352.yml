canonical_text:
  quote: ''
  summary: Mead discusses Philo of Byblos, Sanchuniathon, and the Books of Taaut/Thoth
    as a source for Phoenician cosmogony influenced by Egyptian tradition. The quoted
    cosmogony begins with dark mist, breath, and chaotic darkness; Spirit loves and
    interblends with its own principles, Love becomes the origin of creation, and
    from Spirit's embrace Mot is born, source of cosmic seeds and bodies. Notes connect
    the union with an egg entwined by a serpent and with spirit-matter symbolism.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage argues against treating Philo of Byblos's Phoenician cosmogony
    and history as a forgery and presents it as Phoenician story influenced by Egyptian
    tradition.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Philo says Sanchuniathon searched for first principles and carefully examined
    the Books of Taaut because Taaut first discovered letters and written records.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage equates Taaut with the Logos called Thouth by Egyptians, Thoth
    by Alexandrians, and Hermes by Greeks.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mead states that Sanchuniathon's information about the mystic beginning of
