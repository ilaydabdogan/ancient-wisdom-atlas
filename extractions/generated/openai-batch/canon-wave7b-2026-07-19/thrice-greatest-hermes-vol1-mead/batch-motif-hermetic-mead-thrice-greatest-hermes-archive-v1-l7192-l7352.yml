  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Chaos is said not to know its own creation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: From the embrace of Spirit, Mot is born; from Mot come every seed of creation
    and the birth of all cosmic bodies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A note says the union of Chaos and Ether, matter and spirit, was symbolized
    among the Phoenicians and many other nations by an egg around which a serpent
