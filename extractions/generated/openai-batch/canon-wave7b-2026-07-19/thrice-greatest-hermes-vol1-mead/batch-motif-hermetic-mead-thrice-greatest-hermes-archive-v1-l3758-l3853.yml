canonical_text:
  quote: ''
  summary: The passage discusses Thoth’s names and symbols, especially the heart,
    ibis, and dog-headed ape. It relates Thoth to knowledge, the weighing of the deceased’s
    heart, equilibrium, the equinoxes, and mediation between Horus and Set, Order
    and Chaos. It also identifies Khemennu/Hermopolis as the main seat of Thoth’s
    cult and describes its mythic high ground where Ra first rested, with a speculative
    comparison to the mountain in the Secret Sermon on the Mountain.
  language: English
  quote_policy: summarized
