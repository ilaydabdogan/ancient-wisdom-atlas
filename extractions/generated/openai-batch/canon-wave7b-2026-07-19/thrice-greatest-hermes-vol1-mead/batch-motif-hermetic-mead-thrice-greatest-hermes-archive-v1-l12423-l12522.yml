canonical_text:
  quote: ''
  summary: The passage reports Philo's allegorical treatment of biblical women as
    Virtues associated with prophets and patriarchs. Sarah, Leah, Rebecca, and Sepphora
    are described as becoming pregnant through divine action or without mortal husband,
    bringing forth for Abraham, Jacob, Isaac, and Moses. Philo then cites Jeremiah
    to describe God as House, Father, and Husband of virginity or Wisdom, sowing blessedness
    into pure virgin soil and associating with the soul so that it becomes virgin
    again.
  language: English
  quote_policy: summarized
