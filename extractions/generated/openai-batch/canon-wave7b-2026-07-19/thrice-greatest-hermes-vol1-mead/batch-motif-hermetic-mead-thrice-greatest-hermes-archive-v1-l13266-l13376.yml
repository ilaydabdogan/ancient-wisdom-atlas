canonical_text:
  quote: ''
  summary: The passage summarizes Philo on divine vision as the aim of the contemplative
    life. Those devoted to That-which-is ascend by rational faculties with Moses as
    guide, behold the divine place and its sapphire-like or firmament-like imagery,
    and seek to see God, the divine Image or Logos, and the cosmos. It then presents
    the wise as Sons of One God and describes the Logos as the first-born Reason,
    oldest angel, divine likeness, and means by which the cosmos was fashioned.
  language: English
