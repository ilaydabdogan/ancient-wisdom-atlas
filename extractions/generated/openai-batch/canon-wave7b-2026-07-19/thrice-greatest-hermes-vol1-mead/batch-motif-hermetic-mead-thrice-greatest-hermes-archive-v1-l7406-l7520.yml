canonical_text:
  quote: ''
  summary: The passage cites a tradition in which Cronus or Ammon gives Egypt to the
    god Taaut, and the Seven Sons of Sydyk, the Cabiri, with their eighth brother
    Asclepius, first record these matters by Taaut's command. Mead then argues that
    Sanchuniathon and the writer of The Shepherd drew cosmogonic accounts from the
    Books of Thoth or Egyptian mystery-tradition. He introduces the Poemandres cosmology
    as an apocalyptic vision rather than a mere literary compilation, explaining that
    apocalyptic seers use existing religious and philosophical language to express
    vision. He further states that an Egyptian prototype for the main features of
    the Poemandres cosmogenesis has been found in an inscription.
  language: English
  quote_policy: summarized
