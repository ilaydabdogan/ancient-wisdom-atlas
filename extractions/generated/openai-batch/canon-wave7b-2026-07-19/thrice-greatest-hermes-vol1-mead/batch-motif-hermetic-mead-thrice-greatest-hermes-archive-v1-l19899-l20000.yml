canonical_text:
  quote: ''
  summary: The passage describes rites in which priests respond to calamities attributed
    to an Evil Daimon/Typhon by secretly leading away venerated animals, threatening
    them, and sometimes consecrating or sacrificing them as chastisement or purification.
    It also reports a public Dog-days rite of burning living men called Typhoneian,
    notes animal assignments to Osiris or Typhon, and surveys utilitarian and symbolic
    explanations for animal honours, including the weasel as an image of the birth
    of logos and the scarab as an image of solar-cosmic motion.
  language: English
  quote_policy: summarized
