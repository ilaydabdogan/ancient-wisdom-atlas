  text: Cult and service to venerated beasts are presented as a means to appease and
    soothe an Evil Daimon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When excessive droughts, pestilent diseases, or strange mischances occur,
    priests lead away venerated beasts at dark in silence, threaten or scare one,
    and may consecrate and sacrifice it if it stops.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Goddess-of-child-bed-town, living men were reportedly burned to ashes,
    called Typhoneian, and their ashes were winnowed and scattered.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The human burning is described as public and fixed in the Dog-days, while
