  quote: ''
  summary: The passage describes intelligent lives called Zophasemin, or Overseers
    of the Heavens, fashioned in egg-like form and shining as celestial bodies. It
    then describes a primordial nebula lightening through heat, producing mists, clouds,
    downpours, and torrents; separated watery and earthy elements are displaced by
    the sun’s heat, meet again, and clash amid thunder and lightning. Great Rational
    Lives watch, while male and female beings on land and sea cower in fear. The account
    is attributed to the Cosmogony and commentaries of Taaut, and footnotes compare
    details with The Shepherd and the Watchers in the Greek Book of Enoch.
