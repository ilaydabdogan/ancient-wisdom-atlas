    my robe."'
  summary: The passage describes Egyptian kings being chosen from priests or warriors,
    with warrior-kings entering the priesthood and sharing a philosophy concealed
    in myths and riddling words. It explains sphinxes before temples as signs of divine
    wisdom wrapped in riddles. It cites an inscription on the seat of Athena, identified
    with Isis at Sais, and discusses the Egyptian name Amoun or Ammon as a hidden
    name of Zeus according to Manetho.
