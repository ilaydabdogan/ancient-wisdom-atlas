  summary: The passage summarizes Mead's discussion of Reitzenstein's reconstruction
    of a Hellenistic "God Anthropos" myth from Naassene material reported by Hippolytus.
    It describes Hippolytus's division of Naassene views, an alleged transmission
    from James to Mariamne, the claim that Naassene doctrines derive from the Mysteries
    of the Mother of the Gods, and Mead's argument that a Pagan/Hellenistic source
    was later overworked by Christian and possibly Jewish redactors.
