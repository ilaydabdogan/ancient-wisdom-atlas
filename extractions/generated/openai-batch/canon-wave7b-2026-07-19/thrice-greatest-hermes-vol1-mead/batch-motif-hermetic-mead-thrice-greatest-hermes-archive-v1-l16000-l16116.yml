  quote: ''
  summary: The passage describes Isis mourning after sensing events concerning Osiris,
    wandering in search of the chest, asking children who reveal the route by which
    Typhon’s friends sent the vessel into the sea, and the attributed Egyptian belief
    in children’s prophetic voices. It then recounts Osiris’s union with Nephthys,
    Nephthys’s exposure of the child later called Anubis, Isis finding the child with
    dogs’ help, Anubis becoming her guard and informing her that the chest reached
    Byblos and was enclosed by a growing heather-bush or tree.
