canonical_text:
  quote: God the Father sows into her His intelligible rays and divine seed
  summary: The passage collects and comments on Philonic images of God or the Father
    sowing divine seed, intelligible rays, virtues, or spiritual light-beams into
    a virgin or purified soul, Wisdom, or the wombs of souls, producing the Cosmos,
    virtues, deathless progeny, Isaac as Joy, and other good things. It also notes
    an editorial disagreement about whether this formulation was unique to Philo or
    common in Hellenistic theology.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: God is described as beyond generation and change and as sowing ideal seeds
    of immortal virgin Virtues in humans.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Conybeare is quoted as saying that Philo formulated the idea of the Word or
    ideal ordering principle of the Cosmos being born from an ever-virgin soul that
    conceives when God the Father sows intelligible rays and divine seed into her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same quoted sentence says this divine sowing begets God's only well-beloved
    son, the Cosmos.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An impure soul is described as filled with passions and vices, with children
    named as pleasures, appetites, folly, intemperance, unrighteousness, and injustice.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the impure soul becomes sterile, ceases to bear those children, or casts
    them away, it becomes a chaste virgin and, receiving Divine Seed, engenders prudence,
    courage, temperance, justice, holiness, piety, and other virtues and good dispositions.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Therapeutrides are described as longing not for mortal children but for
    deathless progeny, which only the soul in love with God can bring forth after
    the Father sows spiritual light-beams into it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The spiritual light-beams enable the soul to contemplate the laws of wisdom.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Isaac is interpreted as Joy, Laughter, and a spiritually conceived Son of
    God bestowed on peaceful souls as comfort and good cheer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wisdom is described as bringing forth the self-taught Race after the fashion
    of a mother and declaring that God is its sower.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The Servants of God are described as lawfully begotten and as commanded by
    nature to be parents: men as fathers of many sons and women as mothers of numerous
    children.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: In connection with Rachel's request to Jacob for children, Jacob is quoted
    as saying that God alone can open the wombs of souls, sow virtues in them, and
    make them pregnant and mothers of good things.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A note disputes Conybeare's claim that Philo first formulated the doctrine,
