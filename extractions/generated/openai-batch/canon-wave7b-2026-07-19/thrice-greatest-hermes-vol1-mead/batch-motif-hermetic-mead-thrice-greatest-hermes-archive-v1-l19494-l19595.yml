canonical_text:
  quote: ''
  summary: The passage argues that Isis and the gods are not local Egyptian possessions
    but divine powers known under different names by all peoples. It warns against
    reducing sacred mysteries and divine names to natural processes or material objects,
    describes true gods as mindful bestowers of abundance, presents Logos and Providence
    as universal ordering principles, and recommends Reason/Logos as a philosophical
    mystic guide for interpreting consecrated symbols, offerings, and feasts while
    avoiding both superstition and atheism.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage rejects making the gods peculiar to Egyptians by identifying them
    only with the Nile, the land watered by it, marshes, lotuses, or local god-making.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that all people have Isis and know Isis and the gods of
    her company, even if they learned Egyptian names for some of them only recently.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage warns against dissolving sacred mysteries into winds, streams,
    sowing, ploughings, passions of earth, and changes of seasons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage gives examples of saying Dionysus is wine, Hephaestus is flame,
    Persephone is a wind in the crops that is killed, and Demeter's limbs are cut
    by reapers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage compares such identifications to treating a pilot as sails, ropes,
    and anchor; a weaver as yarns and threads; and a physician as potions, honey-brew,
    and barley-water.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that transferring names of gods to things without sense or
    soul produces dangerous and atheistic notions, and that such things are destroyed
    by people according to need and use.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that a god is not mindless, soulless, or subject to the
    hand of man, and that gods are inferred from those who bestow useful things in
    perpetual abundance.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that there are not different gods for different peoples
    or regions, and compares this to sun, moon, earth, and sea being common to all
    while named differently by different peoples.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that Reason or Logos orders all things and that one Providence
    directs subordinate powers; different nations assign different honours and titles
    according to their laws.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says consecrated symbols, some obscure and some plain, guide intelligence
    toward the mysteries of the gods, but not without risk.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says some people go astray into superstitions, while others avoid
    superstition as a quagmire and fall into atheism as down a precipice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage advises taking Reason or Logos from philosophy as a mystic guide
    when meditating on things said and done, offerings, and feasts, and cites Theodorus'
    saying about words offered with the right hand and taken with the left.
  category: action
  evidence_refs:
  - ev:7
