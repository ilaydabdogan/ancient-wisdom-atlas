canonical_text:
  quote: ''
  summary: The passage summarizes a Museum inscription dated to about the eighth century
    B.C. but said to reproduce an older temple text from Ptah’s temple at Memphis.
    Its main content concerns the Osiris myth, with a distinctive Ptah doctrine inserted.
    Ptah is described as related to handicraft and to Hephaistos by Greek interpreters,
    but also as a demiurgic life-dispenser linked with heavenly and light deities.
    In the described theology, Ptah is closely related to Atum, the Supreme Deity
    or God the Father, who emanates eight deities, each being Ptah with a distinctive
    epithet; the fourth is Ptah the Great, glossed in a footnote as God of Fire and
    Mind.
  language: English
