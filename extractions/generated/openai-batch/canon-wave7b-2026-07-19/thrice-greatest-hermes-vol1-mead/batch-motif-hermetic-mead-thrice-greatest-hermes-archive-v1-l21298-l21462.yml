canonical_text:
  quote: ''
  summary: The passage argues that later Egyptian religion, Hellenistic religious
    circles, and some early Christian circles aimed at Gnosis as mystical experience
    through visions and apocalypses. It then recounts a story in which a Greek priest
    visits Abbot Olympius at Scetis, asks whether the monks receive visions from God,
    and explains their lack of visions as caused by evil or impure reasonings that
    cut them off from divine mysteries. The author interprets the story as evidence
    for the need for good and right thought, Gnosis, and proper understanding of God.
    The passage closes by discussing the possible circulation of the Poemandres from
    Egypt to Rome and the problem posed by the secrecy of the Trismegistic school.
  language: English
  quote_policy: summarized
