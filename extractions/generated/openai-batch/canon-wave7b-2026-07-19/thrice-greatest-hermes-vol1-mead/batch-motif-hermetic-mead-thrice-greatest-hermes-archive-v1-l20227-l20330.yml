canonical_text:
  quote: "“this God is ruler and king of the dead”"
  summary: The passage approves the religious honoring of animals as living portrayals
    of the Divine. It then contrasts the variegated robes of Isis, linked with many
    oppositional pairs, with the single light-like robe of Osiris, associated with
    the pure intelligible source. It describes a one-time reception and concealment
    of the Osiris robe, then relates philosophical epoptic vision to ascent beyond
    mixed opinion toward the primal simple truth. Finally, it says priests hint that
    Osiris is ruler and king of the dead, comparable to Greek Hades and Pluto, while
    correcting the idea that Osiris literally lives on or under the earth; embodied
    souls perceive him only dimly, but freed souls pass to the pure invisible realm
    where he becomes their guide and king.
  language: English
  quote_policy: quoted
