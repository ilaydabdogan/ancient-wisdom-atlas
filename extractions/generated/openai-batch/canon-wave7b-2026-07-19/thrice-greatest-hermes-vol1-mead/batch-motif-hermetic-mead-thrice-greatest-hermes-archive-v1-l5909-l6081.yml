canonical_text:
  quote: ''
  summary: The passage preserves the end of a protective ritual address and a farewell
    to a divine flame or ray, followed by a prayer for consecrating an amulet ring.
    The prayer invokes a greatest God described as world-ruler, sea-ruler, dawn-rising
    solar power, Good Daimon, hidden-name deity, life-giver, dazzling Sun, divine
    serpent, and ocean-sailing daily manifestation. Mead then comments on the serpent
    as a Logos symbol and turns to the Hellenistic development of Thoth-Hermes as
    teacher of hidden wisdom, sacred scribe, revealer, and source of Greek-Egyptian
    sacred literature. The section also notes Hermes-related statues with Maat’s feather
    or a papyrus-roll, sacred plant and Decan lore ascribed to Egyptian Hermes, and
    parallels between Petosiris-Nechepso material and Trismegistic revelatory dialogues.
  language: English
  quote_policy: summarized
