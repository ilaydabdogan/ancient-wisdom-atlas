  quote: ''
  summary: The passage surveys the Hermetic, Orphic, Platonic, Macrobian, and Proclean
    imagery of the Crater or Cup as a vortex, cosmic container, source of souls, and
    receptacle from which matter or soul proceeds and to which it returns. It links
    the Cup with the Orphic Mighty Whirlpool, the Egg or Womb of Cosmos, Chaos/Rhea,
    the River of Lethe, the Cup of Dionysus, and the Fountain of Souls.
  language: English
  quote_policy: summarized
