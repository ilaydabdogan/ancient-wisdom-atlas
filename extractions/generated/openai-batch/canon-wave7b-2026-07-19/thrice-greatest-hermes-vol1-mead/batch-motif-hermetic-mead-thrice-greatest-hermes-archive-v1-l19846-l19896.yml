  quote: ''
  summary: 'The passage reports several explanations and examples concerning Egyptian
    animal veneration: frightening foes with golden and silver wild-beast heads; a
    crafty king allegedly assigning hostile beasts to different clans to create lasting
    disagreement; local practices involving Wolf-town, Oxyrhynchus-town, and Dog-town;
    a retaliatory dog sacrifice and war; and a mythic claim that Typhon''s soul was
    divided among animals.'
