canonical_text:
  quote: ''
  summary: The passage explains a Greek term as meaning turning or circulating, links
    this to cities and to the Phrygian name Aipolos for Man, and says the Phrygians
    call Him Fruitful. It contrasts regenerated, deathless children with fleshly children
    who perish; cites Rachel and Jeremiah in relation to children, the Jerusalem Below,
    and the perfect man regenerated from water and spirit; states that gnosis of man
    and of God marks perfection; and reports that Phrygians and Athenians call Him
    a plucked green wheat-ear, with a wheat-ear shown in the silent final initiation
    at Eleusis. Mead's note compares ideas in J. and Philo concerning the soul, sterility,
    divine seed, and virtues.
  language: English
  quote_policy: summarized
