canonical_text:
  quote: ''
  summary: The passage discusses evidence for titles of Hermes in Egyptian and Greek
    sources. It notes that the Rosetta Stone calls Hermes “Great-and-Great,” considers
    Egyptian reduplicated and intensified forms that could correspond to “great, great,
    great” or “three times great,” and argues that Greek allowed the superlative form
    “thrice-greatest.” It also suggests that a higher honorific may have been reserved
    for Hermes as personified Wisdom, while the Rosetta Stone used a lesser title
    in the context of praising Ptolemy Epiphanes for justice.
  language: English
