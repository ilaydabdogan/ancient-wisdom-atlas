canonical_text:
  quote: ''
  summary: The passage presents Philo, as excerpted and discussed by Mead, using mystery-language
    for sacred teachings, purified hearing, non-disclosure to the uninitiated, inner
    preservation of divine knowledge, the Divine Spirit's presence with purified persons,
    Moses' entry into darkness as initiation, priestly blood-sprinkling as consecrating
    perfection, and the Therapeuts' ecstatic service of God compared to Bacchic or
    Corybantic initiation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacred mysteries are addressed to mystae whose ears are purified, and they
    are told not to speak of them to anyone without initiation.
  category: speech
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:2
  text: The teachings are to be stored in the heart as a treasure-house, contrasted
    with a treasury of perishable gold and silver.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The treasure is described as knowledge of the Cause, Virtue, and a third thing
    called the child of both.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Divine Spirit is said not to remain among the many, but to be present
    with those who strip themselves of things in genesis and approach God with unclothed
    and naked minds.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Moses fixes his tent outside the camp, interpreted in the passage as outside
    the whole body, makes his mind firm, and begins to worship God.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Moses enters darkness, called the unseen land, remains there, is initiated
    into the most holy mysteries, and becomes both mystes and hierophant of revelations.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Divine Spirit is described as being present with such men and guiding
    every way aright.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A ritual involving the slaughter of a second ram and the sprinkling of blood
    on portions of the priests' bodies is described as ordained for perfectioning
    and purification of chastity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ram is called the ram of perfectioning, and the priests are described
    as about to act as hierophants of mysteries appropriate to servants and ministers
    of God.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Therapeuts take up service of God through heavenly love rather than custom,
    advice, or appeal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Therapeuts are compared to those initiated into Bacchic or Corybantic
    Mysteries and are described as a-fire with God until they see the object of their
    love.
  category: relationship
  evidence_refs:
  - ev:6
