canonical_text:
  quote: ''
  summary: 'The passage catalogs several regional claims about first or primordial
    beings, including tree-like Kuretes or Korybantes, Pelasgos, Diaulos, Kabeiros,
    Alkyoneus, Garamas, Neilos as breeder of living things from Egyptian mud, Cannes,
    and Chaldaean Adam. Adam is described as Earth-produced, breathless, statue-like,
    and an image of the Man Above. Soul is then given to him so that the plasm of
    the Perfect Man may suffer and be chastened. The passage also describes Soul as
    hard to understand because it changes appearance and raises alternative origins
    for Soul: the Pre-existing One, the Self-begotten, or Streaming Chaos.'
  language: English
  quote_policy: summarized
