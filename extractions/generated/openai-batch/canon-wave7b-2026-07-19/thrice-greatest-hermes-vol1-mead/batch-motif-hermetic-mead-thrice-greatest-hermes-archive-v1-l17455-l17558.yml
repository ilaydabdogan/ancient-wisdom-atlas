canonical_text:
  quote: ''
  summary: The passage interprets Osiris as moisture, generation, seed, blackness,
    Nile fertility, and watery nourishment, while Typhon is interpreted as dry, fiery,
    pale, and hostile to moisture. It links blackness, Egypt/Chemia, the Mnevis ox,
    and seasonal fertility to moisture. It also says sun and moon travel in boats
    because they are nourished and born in the Moist, and it reports Greek identifications
    of Oceanus with Osiris, Tethys with Isis, and Dionysus/Hues with Osiris through
    watery nature and wordplay. A footnote recounts the Delphic Charila ritual involving
    a wronged orphan, famine, death by hanging, and a recurring effigy burial rite.
  language: English
  quote_policy: summarized
