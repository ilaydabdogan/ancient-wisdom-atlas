  quote: There was when naught was but Chaos and an indistinguishable mixture of unordered
    elements...
  summary: 'The passage first raises questions about possible relationships among
    early Christian mystical writers, Gnostics, the writer of Hermas, and Poemandres
    circles. It then introduces an essay on the Aeon doctrine and turns to a Clementine
    Homilies passage presenting an Orphic-style cosmogony: primordial Chaos, Homeric
    water and earth, Hesiodic Chaos, an Orphic Egg containing mixed elements, and
    a vortex in ensouled Matter or an infinite Sea that gathers the productive part
    of the elements and draws surrounding Spirit.'
  language: English
  quote_policy: quoted
