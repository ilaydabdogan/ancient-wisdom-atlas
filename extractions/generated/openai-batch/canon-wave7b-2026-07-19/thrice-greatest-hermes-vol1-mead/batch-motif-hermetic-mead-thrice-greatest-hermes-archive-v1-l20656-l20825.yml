canonical_text:
  quote: '"there entered a man of glorious appearance, in the guise of a Shepherd"'
  summary: 'Mead quotes the opening of the Pastoral Hermas: after prayer at home,
    the narrator is visited by a glorious shepherd figure with white skin, wallet,
    and staff. The visitor embraces him, declares that he has been sent by the most
    Sovereign Angel to dwell with him, identifies himself as the Shepherd into whose
    charge the narrator has been given, changes aspect, and is recognized. Mead then
    compares this scene with Poemandres, Pistis Sophia, and broader Hellenistic Good
    Shepherd symbolism.'
  language: English
  quote_policy: quoted
