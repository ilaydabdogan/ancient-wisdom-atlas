canonical_text:
  quote: Chnum was Demiurge and God of the heart.
  summary: The passage surveys a Trismegistic literary type in which Osiris and Isis
    appear as disciples. It describes Chnum/Chnubis as a southern Egyptian demiurgic
    figure, a fashioner of human beings, and father of Osiris. It then cites traditions
    in which Kouphis or Agathodaimon, the Good Daimon and Thrice-greatest, transmits
    teachings to Osiris, and compares the Agathodaimon-Osiris relation to the Poemandres-Hermes
    relation. The passage also notes links with Asclepius, Petosiris, Nechepso, alchemical
    literature, and Chaldaean cosmogenesis.
  language: English
  quote_policy: quoted
