  quote: ''
  summary: 'The passage surveys Chaldaean, Greek, Pythagorean, Aristotelian, Platonic,
    and Egyptian formulations of opposed cosmic principles: good and harmful powers,
    Zeus and Hades, Aphrodite and Ares as parents of Harmony, Heraclitus’ generative
