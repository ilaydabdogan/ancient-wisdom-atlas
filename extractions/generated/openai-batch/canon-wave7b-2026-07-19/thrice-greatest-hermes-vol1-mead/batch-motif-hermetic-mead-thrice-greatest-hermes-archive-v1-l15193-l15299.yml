canonical_text:
  quote: ''
  summary: 'The passage reports priestly explanations attributed to Eudoxus, then
    describes Egyptian sea-fish taboos: local avoidance of particular fish, priestly
    abstinence from all fish, a calendrical practice in which lay Egyptians eat broiled
    fish while priests burn fish to ashes before temple doors, and explanations involving
    Osiris and Typhon, Homeric examples, and a cosmological view of the sea as fiery,
    boundary-crossing, and corrupting.'
  language: English
  quote_policy: summarized
