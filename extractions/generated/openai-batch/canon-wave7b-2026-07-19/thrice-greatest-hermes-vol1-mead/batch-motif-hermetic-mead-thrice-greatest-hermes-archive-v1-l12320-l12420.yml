canonical_text:
  quote: ''
  summary: 'The passage reports Philo’s allegorical reading of Genesis material: Abraham
    and Sarah’s three measures of meal are interpreted as an inner-life mystery involving
    God, His two Potencies, and initiation into guarded divine mysteries. It then
    introduces Philo’s doctrine of Sacred Marriage, the union of the soul as female
    with God as male, and connects Genesis iv.1 to the spiritual birth of virtues
    and perfections rather than ordinary human childbirth.'
  language: English
  quote_policy: summarized
