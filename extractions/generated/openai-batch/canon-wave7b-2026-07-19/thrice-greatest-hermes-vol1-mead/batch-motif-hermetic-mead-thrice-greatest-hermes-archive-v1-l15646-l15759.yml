canonical_text:
  quote: ''
  summary: 'The passage warns that mythic sufferings and divine names should not be
    read literally. It gives examples: Hermes is symbolically called Dog; sunrise
    is written as a newborn babe on a lotus to indicate solar rekindling from moist
    elements; and Ochus is called Knife because of his hard and violent conduct toward
    Apis. The passage then advises philosophical interpretation of mysteries and priestly
    customs as a way to avoid impiety or superstition. It opens a mystery-myth in
    which Rhea secretly unites with Kronos, Helios curses her not to give birth in
    month or year, and Hermes conjoins with the Goddess and plays draughts against
    Selene.'
  language: English
  quote_policy: summarized
