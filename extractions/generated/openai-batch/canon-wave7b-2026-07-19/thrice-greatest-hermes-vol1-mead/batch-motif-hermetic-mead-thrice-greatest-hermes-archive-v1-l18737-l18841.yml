canonical_text:
  quote: Isis seeks it wandering and puts it together again.
  summary: The passage gives Plutarch’s allegorical explanation of Isis, Osiris, Typhon,
    Horus, Hermes, and Apollo/Elder Horus. Isis is presented as feminine Nature and
    receptive matter; Osiris’ soul is eternal while Typhon dismembers his body; Isis
    seeks and reassembles it. Horus is described as the sensible image of the intelligible
    cosmos, accused by Typhon and vindicated through Hermes as Reason or Logos. The
    birth of Apollo/Elder Horus is interpreted as an imperfect first birth before
    the manifest cosmos.
  language: English
  quote_policy: quoted
