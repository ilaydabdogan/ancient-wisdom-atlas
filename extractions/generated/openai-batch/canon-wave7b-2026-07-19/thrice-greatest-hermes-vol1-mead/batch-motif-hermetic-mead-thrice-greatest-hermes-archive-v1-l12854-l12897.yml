canonical_text:
  quote: |-
    God is That which
    transcends all things and all ideas.
  summary: The passage summarizes Philo's theology of a transcendent and ineffable
    Deity, quotes Philo on the incomprehensibility of That-which-really-is, and describes
    Deity as conceived under active and passive causative principles. The active principle
    is the Mind of the universals; the passive principle is soulless and motionless
    until ensouled by Mind and transformed into the Cosmos. The passage adds that
    commentators often take the passive principle as Matter, which the author links
    with Wisdom as Mother of the Cosmos.
  language: English
  quote_policy: quoted
