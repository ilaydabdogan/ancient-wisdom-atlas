  quote: return from body to the light of Everlasting Life restored and whole
  summary: The passage summarizes doctrines of the soul’s relation to planetary spheres.
    In one account, Mercury and the Moon activate particular soul-functions, while
    the soul descends into terrene bodies, is temporarily buried rather than annihilated,
    and may return after cleansing to everlasting life. Mead contrasts Macrobius’s
    neutral account of sphere-energies with Servius’s tradition, where planetary powers
    impart perturbing propensities to the descending soul.
