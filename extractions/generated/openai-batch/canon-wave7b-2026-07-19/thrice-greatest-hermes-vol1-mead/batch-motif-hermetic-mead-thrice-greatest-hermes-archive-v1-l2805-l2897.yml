  summary: The passage surveys scholarly opinions on the origin and dating of Trismegistic
    writings. It rejects Chambers's attempt to derive the Hermetic text from New Testament
    parallels, noting a lack of verbal plagiarism and absence of distinctive Christian
    dogmas. It then summarizes Brockhaus's dating, Scherer's article on Greek Hermes,
    and Frank Granger's more recent argument for a Christian origin of important Hermetic
    tractates.
