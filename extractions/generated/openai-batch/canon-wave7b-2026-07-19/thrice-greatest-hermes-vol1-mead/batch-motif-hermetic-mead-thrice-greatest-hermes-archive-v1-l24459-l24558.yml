canonical_text:
  quote: ''
  summary: In this portion of the Vision of Er, souls choose their next lives according
    to lots and prior experience. Named souls choose animal, human, private, or gendered
    lives; righteous and unrighteous souls pass among tame and wild forms; after choosing,
    they go to Lachesis, who assigns each the daimon it has chosen as guardian and
    fulfiller of its life.
  language: English
  quote_policy: summarized
