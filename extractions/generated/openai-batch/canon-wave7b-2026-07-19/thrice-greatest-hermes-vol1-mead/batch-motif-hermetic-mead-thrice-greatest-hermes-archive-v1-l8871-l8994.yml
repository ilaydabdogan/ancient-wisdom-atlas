  quote: ''
  summary: The passage reports interpretations of mystery teachings about a Blessed
    or Original Nature that is hidden and manifest, linked with children aged seven
    and fourteen, the Original Seed, and an ineffable Logos. It then summarizes Egyptian
    mysteries of Isis as secret rites involving the robbed member of Osiris, Osiris
    as Water, Seven-robed Nature with planetary vestures, and a scriptural saying
    about falling and rising interpreted as stellar changes moved by the Mover of
    all things.
  language: English
  quote_policy: summarized
