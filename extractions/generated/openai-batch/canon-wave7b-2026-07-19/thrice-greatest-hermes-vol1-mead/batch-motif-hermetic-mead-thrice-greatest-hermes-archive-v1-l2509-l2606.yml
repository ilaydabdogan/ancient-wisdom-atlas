canonical_text:
  quote: ''
  summary: The passage summarizes and quotes Menard on early Christianity as developing
    within a wider Greco-Asian-Egyptian intellectual environment. It describes Alexandria
    as a center of competing philosophical and moral solutions concerning evil, the
    soul, fall, redemption, and conscience. Menard presents Christianity as the victorious
    solution, treats other systems as rival forerunners rather than plagiarists, classifies
    Trismegistic treatises by Jewish, Greek, and Egyptian influences, and proposes
    Hermetic works as a link between Philo and early Gnosticism. He further associates
    The Shepherd with the Egyptian Therapeuts, contrasts the Therapeuts with the Essenians,
    and places The Sermon on the Mountain between The Shepherd and early Gnostic schools.
  language: English
  quote_policy: summarized
