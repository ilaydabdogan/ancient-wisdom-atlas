canonical_text:
  quote: ''
  summary: The passage is Mead's afterword to Plutarch's treatise on Isis and Osiris
    and a transition to a discussion of Hermas and Hermes. It presents the Osiris-Isis
    myth as an ancient Egyptian root mystery-myth, interprets Osiris, Isis, and the
    two Horoi in cosmic and microcosmic terms, cites Philo on older and younger divine
    sons, explains the author's phrase 'Christ-stage of manhood,' and notes claimed
    points of contact between the Apocalyptic Hermas and an early Trismegistic 'Shepherd
    of Men' tractate.
  language: English
  quote_policy: summarized
