canonical_text:
  quote: ''
  summary: The passage describes Horus as the perfected son who subdues but does not
    annihilate Typhon; Hermes turns Typhon’s sinews into lyre strings, interpreted
    as Logos harmonizing discord. Typhonic power is linked with earthly disturbances,
    pestilence, and lunar darkening. Typhon’s attack on the Eye of Horus is interpreted
    as lunar diminution and eclipse. A later section maps Intelligible, Matter, and
    Cosmos/Genesis to father, mother, and offspring, and further to the 3-4-5 triangle
    and Osiris, Isis, and Horus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Horus is described as the son, as horizoned or defined, and as perfect.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Horus has not utterly destroyed Typhon, but has brought Typhon’s efficacy
    and strength over to his side; a statue of Horus at Coptos is said to grasp Typhon’s
    “mrilia” in one hand.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A myth says Hermes cut out Typhon’s sinews and used them for lyre strings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage interprets the sinew-and-lyre myth as teaching that Reason or
    Logos brought the universe into harmony and made it concordant from discordant
    elements, laming rather than destroying the destructive power.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The destructive power is described as weak above but, below, as causing shakings
    and tremors in earth, droughts and tempests in air, and lightnings and thunderings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The same power is said to infect waters and winds with pestilences and to
    blur and blacken the moon’s light.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Typhon is said at times to strike the Eye of Horus, and at other times to
    take it out and swallow it; the passage explains these as the monthly diminution
    of the moon and lunar eclipse, with the sun remedying the eclipse by shining on
    the moon after it leaves the earth’s shadow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that the better and diviner nature comes from the Intelligible,
    Matter, and what Greeks call Cosmos; Plato is reported as calling the Intelligible
    Idea, Model, and Father, Matter Mother and Nurse, and their offspring Genesis.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'A 3-4-5 triangle is used as a cosmological analogy: the perpendicular side
    is compared to male, the base to female, the hypotenuse to their offspring, with
    Osiris as source, Isis as receptacle, and Horus as result.'
  category: relationship
  evidence_refs:
  - ev:6
