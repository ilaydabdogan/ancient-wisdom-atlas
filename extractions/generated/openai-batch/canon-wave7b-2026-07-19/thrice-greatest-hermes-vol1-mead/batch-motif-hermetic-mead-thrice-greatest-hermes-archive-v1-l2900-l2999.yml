  summary: The passage summarizes and critiques Granger's views on the Poemandres,
    Hermes, Gnosticism, and early Christian tradition. It reports a claim that Hermes
    passes into Christian tradition and that Greek representations of Hermes helped
    furnish the Good Shepherd motive in Christian art. It also discusses the Poemandres
    as a bridge from Greek philosophy and science to Christian thought, debates whether
    Gnosticism should be understood as Christianized Gnosis or Gnosticized Christianity,
    and notes claims about Salome, the Gospel according to the Egyptians, the Fourth
    Gospel, and Alexandrine Gnostic circles.
