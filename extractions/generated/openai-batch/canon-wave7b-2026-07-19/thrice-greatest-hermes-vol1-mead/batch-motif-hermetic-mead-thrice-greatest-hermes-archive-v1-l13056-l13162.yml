canonical_text:
  quote: ''
  summary: The passage presents Philo’s account of God, the Logos, the cosmos, time,
    and humanity. God is described as father, artificer, and governor of all, and
    as the artificer of time. The sensible cosmos is called the Younger Son of God
    and the father of time, making time God’s grandson. The older Son is identified
    with the intelligible Logos or Reason, perceptible only to mind and remaining
    with God. The Logos is described as second to God, even as a “second God,” and
    as the divine Reason through which the rational impress in the human soul is stamped,
    since the transcendent Father cannot be directly imaged by mortal beings.
  language: English
  quote_policy: summarized
