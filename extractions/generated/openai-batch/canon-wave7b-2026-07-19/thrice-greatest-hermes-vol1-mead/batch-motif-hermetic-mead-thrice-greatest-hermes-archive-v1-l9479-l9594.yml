canonical_text:
  quote: 'These are the Three More-than-mighty Words (Logoi): Kaulakau, Saulasau,
    Zeesar'
  summary: The passage describes a threefold division, the veiled speaking of the
    Greatnesses, and three named Logoi associated with above, below, and an upward-flowing
    Jordan. It then describes a male-female Man in all, called by other names such
    as three-bodied Geryones and the Heavenly Horn of Men, through whom all things
    are made and in whom Life is present. Life is identified with an ineffable race
    of perfect men, while the special cosmos is described as the “nothing” made without
    Him by a third and fourth ruler.
  language: English
