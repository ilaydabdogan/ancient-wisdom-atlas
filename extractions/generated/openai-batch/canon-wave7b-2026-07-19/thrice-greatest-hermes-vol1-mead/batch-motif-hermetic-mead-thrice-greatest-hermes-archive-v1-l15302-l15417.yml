canonical_text:
  quote: ''
  summary: The passage discusses the onion and pig taboos in Egyptian sacred practice.
    It rejects a story of Diktys drowning while trying to catch onions, explains the
    onion taboo by reference to the waning moon and bodily effects, and explains the
    sow as unholy because of lunar associations and disease linked to its milk. It
    also recounts a disputed tale of Typhon finding Osiris’s coffin while pursuing
    a pig and scattering the body, then turns to examples of Egyptian resistance to
    luxury and embrace of frugality.
  language: English
  quote_policy: summarized
