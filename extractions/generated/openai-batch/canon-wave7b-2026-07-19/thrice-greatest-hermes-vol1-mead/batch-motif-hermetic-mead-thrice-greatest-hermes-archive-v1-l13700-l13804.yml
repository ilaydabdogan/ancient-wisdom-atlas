canonical_text:
  quote: ''
  summary: The passage presents Philo’s Logos as divine Light, archetypal Word, spiritual
    sun, saviour, refuge, medicine for the soul, and a counsellor or shield for human
    beings. It also describes divine rays sent into the human mind, the Logos restored
    like a pledged garment before sunset, and the trained mind as ascending and descending,
    receiving archetypal radiance when raised.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lord is described as Light and Saviour, and as more ancient and sublime
    than the archetypal model, which is identified with His Word or Logos.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Logos is said to be symbolized among phenomena as the sun, and the Spiritual
    Sun is identified as Divine Reason and as the intelligible model of the visible
    sun.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Logos enters the earthly constitution, aids those akin or favorable to
    Virtue, provides refuge and salvation, and brings destruction to their foes, glossed
    as vices of the soul.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Logos is compared to a saving medicine for wounds and passions of the
    soul.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: God’s brilliant rays are described as sent from heaven into the mind of man
    through pity for the human race.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: While divine light abides in the soul, the given logos is to be restored like
    a pledged garment that covers shame, gives enjoyment of God’s gift, and provides
    quiet respite through a counsellor and shielder.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The trained mind is described as continually ascending and descending; when
    raised, it is bathed in archetypal immaterial rays, and when descending it is
    illumined in a lesser or different state.
  category: sequence
  evidence_refs:
  - ev:7
