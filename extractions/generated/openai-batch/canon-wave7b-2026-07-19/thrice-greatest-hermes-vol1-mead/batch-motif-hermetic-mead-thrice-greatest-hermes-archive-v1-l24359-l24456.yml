canonical_text:
  quote: ''
  summary: In a report from the invisible world, souls are told that they will choose
    their daimons and lives before another mortal birth. Lots determine the order
    of choice, many possible lives are displayed, and souls are warned that responsibility
    lies with the chooser. The first chooser selects a tyrannical life carelessly
    and later laments the evils bound up with it, while souls with hardship are described
    as choosing more cautiously.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker announces another period of mortal birth that brings death and
    says that each soul will choose its daimon rather than be assigned one by lot.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker states that each chooser must hold to the life chosen and that
    the responsibility belongs to the chooser, while God is blameless.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lots are thrown to the souls, and each soul picks up the lot that falls beside
    it, except Er, who is not permitted to do so.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Samples of lives are set on the ground before the souls in a number greater
    than those present.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The life samples include lives of animals, lives of men, lives of women, tyrannical
    lives, famous lives, obscure lives, and lives mixed with riches, poverty, disease,
    health, or intermediate conditions.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The rank of the soul is said to be conditioned by its choice of another life,
    according to the decree of Necessity.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The prophet says that even the last in turn may obtain a desirable life if
    he chooses with his mind and lives consistently.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The first chooser immediately selects the largest life of autocratic power,
    but fails to notice the fate and other evils included with it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After reconsidering his choice, the first chooser beats his breast, laments,
    and blames ill-luck, daimones, and other causes rather than himself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The first chooser is described as having come from heaven and as formerly
