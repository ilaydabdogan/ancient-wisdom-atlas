canonical_text:
  quote: ''
  summary: 'The passage describes Hermopolitan Thoth traditions: initiates ascend
    an inner mountain where a Spiritual Sun rises; Thoth heads the Company of Eight
    at Khemennu; the Hermopolitan Ogdoad is compared with other divine companies and
    Gnostic patterns; Thoth/Hermes is presented as teacher of Osiris and Isis; Thoth
    mediates conflicts between Light and Darkness; and the Temple of Thoth is called
    the House of the Net, linked to an Under World net whose names the deceased must
    learn and which the author interprets mystically as an inner condition overcome
    in spiritual rebirth.'
  language: English
  quote_policy: summarized
