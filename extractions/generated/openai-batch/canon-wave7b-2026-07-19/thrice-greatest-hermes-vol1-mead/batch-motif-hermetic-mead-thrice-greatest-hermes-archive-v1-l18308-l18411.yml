canonical_text:
  quote: ''
  summary: The passage summarizes Zoroaster's and Magian accounts of opposed divine
    powers, Oromazes and Areimanios, associated with light and darkness. It describes
    Mithres as mediator, ritual practices involving moly and wolf blood, good and
    bad plants and animals, a cosmogonic myth of created gods and an egg, and an eschatological
    sequence in which evil, famine, and pestilence end and humanity becomes happy
    and unified.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zoroaster names one power Oromazes and the other Areimanios; one is likened
    to sensible light and the other to darkness and ignorance, with Mithres placed
    between them as mediator.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says gladsome prayers are offered to one power and melancholy
    deprecations to the other.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A ritual sequence bruises a plant called moly, invokes Hades and Darkness,
    mixes the plant with the blood of a slaughtered wolf, and casts the mixture into
    a sunless place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Plants and animals are divided between the Good God and the Evil Daimon.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Dogs, birds or cocks, and hedgehogs are assigned to the Good, while water-rats
    are assigned to the Bad; killing many water-rats is called fortunate.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Oromazes is described as born from purest light and Areimanios from nether
    darkness; they are at war with one another.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Oromazes makes six gods associated with good mind, truth, good order, wisdom,
    wealth, and sweet things following fair things; Areimanios makes an equal number
    of rival figures.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Oromazes triples himself, withdraws to a distance measured by the sun and
    earth, adorns heaven with stars, and sets Sirius as warder and look-out.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Oromazes makes twenty-four other gods and places them in an egg; beings made
    by Areimanios, equal in number, pierce the egg, after which the bad is mingled
    with the good.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A fate-appointed time is said to come when Areimanios's pestilence and famine
    are ended, the earth becomes plane and level, and humans share one life, government,
    happiness, and tongue.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Theopompus reports that, according to the Magi, one god conquers and the other
    is conquered for alternating three-thousand-year periods, followed by another
    three thousand years of warfare in which each undoes the other's work.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: At the end, Hades fails, humans are happy without needing food or casting
    shadow, and the god responsible rests for a time.
  category: sequence
  evidence_refs:
  - ev:11
