  quote: ''
  summary: The passage reports a doctrine in which Man or Man Adamas is divided into
    mental, psychic, and earthy aspects; these descend into Jesus born of Mary, correspond
    to three races or churches, and are linked to gnosis of Man and God. It then gives
    a polemical claim that the myth derives from Grecian and non-Grecian initiations,
    before introducing Greek material on Earth bringing forth Man and Alalkomeneus
    rising from the Kephisian Lake as first of men.
  language: English
