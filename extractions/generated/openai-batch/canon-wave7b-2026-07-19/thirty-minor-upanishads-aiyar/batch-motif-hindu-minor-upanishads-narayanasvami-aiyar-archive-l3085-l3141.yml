canonical_text:
  quote: ''
  summary: 'Khanda I opens with Raikva asking what existed first. The Lord replies
    with a cosmogony: an initial condition beyond Sat, asat, or their combination
    gives rise to darkness, then successive elements. The totality becomes an egg
    for one divine year, splits into earth below and akas above, and reveals the infinite
    Purusha in the midst. The passage also describes the prior manifestation of Mrtyu/time/death,
    the generation of sons and Prajapatis, and the birth of social groups and celestial
    or vital powers from Purusha/Brahma''s body.'
  language: English
  quote_policy: summarized
