canonical_text:
  quote: ''
  summary: The passage describes the Jivanmukta as one who sees no difference between
    Atma and Brahman, remains even-minded under praise or blame, and is not reborn.
    It explains that the cognition “I am Brahman” destroys accumulated karma, while
    already-fructifying prarabdha is discussed through similes of ether and a discharged
    arrow. The text then describes Atma/Brahman as nondual, full, changeless, and
    beyond speech and mind; a first-person realization declares the disappearance
    of the world into the ocean of Brahman and asserts identity with the attributeless,
    quiescent self. The passage ends with a lineage of transmission from Apantaratama
    through Brahma, Ghora-Angiras, Raikva, and Rama to all beings, identifying the
    teaching as Nirvana and the Vedas.
  language: English
  quote_policy: summarized
