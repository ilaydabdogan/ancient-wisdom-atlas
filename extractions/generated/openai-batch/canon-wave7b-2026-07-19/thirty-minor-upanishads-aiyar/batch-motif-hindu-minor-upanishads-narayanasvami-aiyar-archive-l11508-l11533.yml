literal_observations:
- id: obs:1
  text: The practitioner is told to close the mouth, draw breath slowly through both
    nadis or nostrils, retain it between the heart and neck, and exhale through the
    left nostril.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says this practice destroys heat in the head and phlegm in the
    throat, removes diseases, purifies the body, increases the gastric fire, removes
    evils in the nadis, jalodara, and dhatus, and is called ujjayi kumbhaka.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The practitioner is told to draw breath through the tongue with a hissing
    sound, retain it, and slowly exhale through both nostrils.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage names this practice sitali kumbhaka and says it destroys diseases
    including gulma, pliha, consumption, bile, fever, thirst, and poison.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Seated in padma posture with belly and neck erect, the practitioner is instructed
    to close the mouth, exhale through the nostrils, and inhale rapidly up to the
