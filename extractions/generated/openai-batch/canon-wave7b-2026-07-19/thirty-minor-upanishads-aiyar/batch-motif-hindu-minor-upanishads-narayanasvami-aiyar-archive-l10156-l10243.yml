canonical_text:
  quote: ''
  summary: Nidagha asks Lord Rbhu about the characteristics of jivanmukti. Rbhu replies
    by describing seven stages of wisdom, four kinds of jivanmuktas, the division
    of pranava into A, U, M, and ardhamatra, corresponding states and essences, titles
    for practitioners at different stages, and definitions of the early stages of
    wisdom.
  language: English
  quote_policy: summarized
