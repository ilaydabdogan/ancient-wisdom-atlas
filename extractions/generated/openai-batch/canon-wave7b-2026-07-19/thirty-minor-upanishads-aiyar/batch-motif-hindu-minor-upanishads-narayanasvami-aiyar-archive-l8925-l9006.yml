canonical_text:
  quote: ''
  summary: The passage teaches that dhyanayoga and contemplation of OM destroy sins,
    dissolve subtle sound into a supreme state, and lead the yogin toward Brahman.
    It describes Atma, Purusha, Brahman, the parts of OM, breath practice, heart-lotus
    visualization, fire and churning imagery, and the final absorption of mind in
    the supreme One called the highest state of Vishnu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mountain-sized accumulation of sin is said to be destroyed by dhyanayoga.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage places nada above the seed-letter and bindu, and calls the nada-less
    condition the supreme state when nada ceases with the letter.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A yogin who treats what is above nada and anahata as highest has doubts destroyed
    and, when subtle nada is absorbed, attains stainless Brahman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A firm-minded person resting in Brahman is instructed to see all creatures
    in Atma through similes of a string in beads and hidden substances in flowers,
    milk, seeds, and quartz.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Purusha depends for existence on the external and internal
    body, and compares Atma's pervasive existence with a tree and its shadow.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The one akshara OM is to be contemplated as Brahman by those who seek emancipation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The A, U, and M parts of OM are associated with sets of worlds, elements,
    Vedas, and deities, and each part becomes absorbed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Omkara is described as having eight parts, four feet, three seats, and five
    presiding deities.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Pranava is compared to a bow, Atma to an arrow, and Brahman to the aim; the
    practitioner who aims carefully becomes one with the aim like the arrow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Omkara is said to be the cause of the Vedas, sounds, and the three worlds
    with moving and fixed beings.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The short accent of OM burns sins, the long accent is decayless and bestows
    prosperity, and pranava with the half-metre bestows salvation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Omkara is to be contemplated as Isvara, like an unshaken thumb-sized light
    in the pericarp of the lotus of the heart.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: During breath intake through the left nostril, Omkara is contemplated in the
    middle of the body surrounded by circling flames.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Brahma, Vishnu, and Rudra are named as the deities of pranayama, corresponding
    to inspiration, cessation of breath, and expiration.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Atma and pranava are compared to lower and upper arani woods, and dhyana is
    described as a churning practice through which God is seen in secret.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Practitioners are told to restrain breath with the sound of Omkara until it
    ceases completely.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: Those who regard OM as Hamsa staying in all, shining like many suns, both
    ever going and coming and motionless, are said to be freed from sin.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:18
  text: Mind, described as author of the actions of creation, preservation, and destruction
    of the three worlds, is absorbed in the supreme One; this is called the highest
