canonical_text:
  quote: ''
  summary: 'In a dialogue, Nidagha asks the venerable Rbhu to explain discrimination
    of Atma from non-Atma. Rbhu answers by describing Atma and Brahman through a series
    of negations: beyond speech, thought, concepts, name, form, body, dual categories,
    scripture-concepts, and even teacher-disciple distinctions. He says non-Atma is
    a misnomer, that Brahman alone remains, and that paired opposites such as first/second,
    truth/non-truth, bondage/emancipation, birth/death, and thou/I depend on each
    other conceptually.'
  language: English
  quote_policy: summarized
