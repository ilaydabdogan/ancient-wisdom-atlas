  quote: ''
  summary: The passage describes laya, or absorption of mind, as beyond speech and
    known through one’s own experience. It uses the simile of an actress who keeps
    attention on a pot on her head while accompanied by music, comparing this to a
    yogin who keeps the mind contemplating Brahman amid objects. It concludes by instructing
    a person seeking yoga to abandon thoughts and concentrate on nada, spiritual sound,
    with a subdued mind.
