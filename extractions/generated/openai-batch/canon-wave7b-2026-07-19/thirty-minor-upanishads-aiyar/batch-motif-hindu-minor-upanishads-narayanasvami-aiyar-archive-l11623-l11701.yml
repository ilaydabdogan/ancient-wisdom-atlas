canonical_text:
  quote: ''
  summary: The passage describes the awakening and ascent of Kundalini through the
    central channel, knots, and lotus centers by the action of breath, wind, and fire;
    transformations involving moon, sun, bodily fluids, and mind; Kundalini's union
    and dissolution in Shiva; purification of the body; analogies of illusion and
    nondual identity; and a yogic practice culminating in the highest state and final
    beatitude.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prana and apana unite with one another and go to Kundalini, which is described
    as coiled up and asleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kundalini is heated by agni and stirred by vayu, extends into the mouth of
    sushumna, pierces the Brahma-granthi, and flashes like lightning.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kundalini ascends through the Vishnu-granthi to the heart, through the Rudra-granthi
    to the middle of the eyebrows, and then to the sphere of the moon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage describes Kundalini drying moon-produced moisture in the anahata-chakra
    and describes blood changing in relation to sun and moon into bile and a pure
    phlegm-like flow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Taking in this state restrains chitta, which had been moving outward among
    sense objects; the novice attains peace and becomes devoted to Atma.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Kundalini assumes eight forms of prakrti, encircles Shiva, and dissolves itself
    in Shiva.
  category: action
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:7
  text: Rajas-sukla rises to Shiva with marut, and prana and apana become equal.
  category: action
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:8
  text: Pranas are said to flow in all things, great and small, describable and indescribable,
    like fire in gold.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The elemental body becomes deity-related, purified, reaches the ativahika
    stage, and is described as stainless and of the nature of Chit.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:10
  text: The passage compares the idea of release from wife and samsara to the conception
    of a snake in a rope, and compares the idea of man and woman to silver in mother-of-pearl.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage states that whatever appears is unreal and whatever is absorbed
    is unreal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage states that the microcosm and macrocosm are one and the same,
    and similarly links other paired terms such as linga and sutratma, substance and
    form, and self-resplendent light and Chidatma.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: S'akti named Kundalini is described as like a thread in the lotus, resplendent,
    biting at the root of the mulakanda lotus with the upper end of its hood or mouth,
    and holding its tail with its mouth.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: Kundalini is described as being in contact with the brahmarandhra hole of
    sushumna.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: A person seated in padma posture, accustomed to contraction of the anus, raises
    vayu upward with the mind intent on kumbhaka.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The blowing of vayu causes agni to flame in svadhishthana, and Kundalini pierces
    the Brahma-, Vishnu-, and Rudra-granthis and then the six lotuses.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: S'akti is happy with Shiva in the sahasrara kamala; this is called the highest
