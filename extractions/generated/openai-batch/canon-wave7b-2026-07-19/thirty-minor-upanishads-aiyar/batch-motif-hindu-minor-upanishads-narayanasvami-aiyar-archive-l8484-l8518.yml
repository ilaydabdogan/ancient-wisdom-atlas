canonical_text:
  quote: ''
  summary: S'andilya asks Atharvan why the supreme reality is called Parabrahman.
    Atharvan explains several divine names—Parabrahman, Atma, Mahesvara, and Dattatreya—and
    says the Lord offered Himself as the son of Atri and Anasuya after Atri's difficult
    penance. The passage then presents contemplation of Dattatreya's form and states
    that such contemplation frees one from sins and leads to attainment of the Spirit.
  language: English
