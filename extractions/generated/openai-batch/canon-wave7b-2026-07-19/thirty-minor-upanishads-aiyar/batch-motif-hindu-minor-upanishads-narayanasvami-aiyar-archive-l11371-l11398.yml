canonical_text:
  quote: Being freed from all states and all thoughts whatever, the yogin remains
    like one dead.
  summary: The passage describes many nadas and bindus being absorbed into the Brahma-Pranava
    sound. A yogin freed from states and thoughts is called a mukta, no longer hears
    external sounds, has a body likened to a log, transcends paired sensations and
    social opposites, and becomes of the form of the internal Brahma-Pranava sound
    when sight, prana, and chitta are stilled.
  language: English
