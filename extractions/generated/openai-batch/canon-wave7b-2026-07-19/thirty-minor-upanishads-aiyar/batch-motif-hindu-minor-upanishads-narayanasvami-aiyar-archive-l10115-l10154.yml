canonical_text:
  quote: ''
  summary: The passage teaches that mundane existence is rooted in chitta and arises
    through Atma's connection with ahankara, compares this to the reflected sun moved
    by water, emphasizes the passing away of kings and Brahmas, warns that asura nature
    can spoil wisdom, presents discriminative wisdom and correction of faults as releasing
    bondage, and contrasts atmajnana with the pursuit of siddhis, which do not help
    attain the seat of Paramatma.
  language: English
  quote_policy: summarized
