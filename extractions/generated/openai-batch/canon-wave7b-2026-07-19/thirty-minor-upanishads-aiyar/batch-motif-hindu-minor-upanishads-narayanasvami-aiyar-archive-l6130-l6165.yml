canonical_text:
  quote: ''
  summary: 'Brahma, after examining Narada''s intention to escape samsara, discloses
    a mysterious teaching said to have been previously imparted by Virat-Purusha.
    The teaching prescribes a disciplined life sequence: initiation, service to a
    qualified guru, marriage and household duties, lineage continuation, forest life
    with austerities, purification of desire, and fitness for sannyasa.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Narada prayed to Brahma; Brahma surveyed the four quarters and meditated for
    one muhurta before responding.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brahma assured himself that Narada's inquiry was truly for escaping the pain
    of samsara.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Brahma described the teaching as a very mysterious one previously imparted
    by Virat-Purusha according to the Purusha-Sukta-Upanishad.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person born in a good family and obedient to parents is instructed, after
    upanayana, to find a virtuous guru other than his father.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The aspirant is instructed to make prostrations, render useful service to
    the guru, and respectfully state his intention.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After studying all departments of knowledge and serving for twelve years,
    the aspirant is instructed to marry, under the guru's orders, a girl fit for his
    family and dear to him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The aspirant is instructed to perform householder karmas for twenty-five years,
    attain the status of a Brahmana who has performed sacrifices, and beget a son
    to perpetuate the family.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After household life, the aspirant is instructed for twenty-five years to
    bathe thrice daily, eat once in the fourth period, live alone in the forest, give
    up prior city and village wanderings, and perform forester duties without desire
    for fruit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After becoming skilled in the forty samskaras, devoid of desire, purified
    in mind, free from desire, jealousy, envy, and egoism, and having developed the
    four means of salvation, the aspirant becomes fit for sannyasa.
  category: attribute
  evidence_refs:
  - ev:6
