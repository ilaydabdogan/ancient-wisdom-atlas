canonical_text:
  quote: ''
  summary: The passage describes a divine Atma/Narayana as moving within waters, tejas,
    vayu, akas, mental faculties, unmanifest principles, death, and all creatures
    while remaining unknown to them. It then gives a lineage by which this knowledge
    is transmitted from Narayana through named recipients to all creatures, identifying
    it as the teaching of Nirvana and the Vedas. A following section describes the
    immaculate Atma as located within a cave in the body, using bodily and visual
    similes, and states that one who cognizes Atma in this way is wise.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Waters, tejas, vayu, akas, manas, buddhi, ahankara, chitta, avyakta, akshara,
    and Mrtyu are each described as His body; He moves in them, but they do not know
    Him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies this one as the Atma within all creatures, the remover
    of all sins, the Divine Deva, and the one Narayana.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The knowledge is said to pass from Narayana to Apantaratama, then to Brahma,
    Ghora-Angiras, Raikva, Rama, and finally to all creatures.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The transmitted knowledge is called the teaching of Nirvana and the teaching
    of the Vedas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Atma of all is described as immaculate and located within the cave in
    the body.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bodily seat of Atma is described as being within a body filled with fat,
    flesh, and phlegm, closely shut with shining many-coloured walls, resembling a
