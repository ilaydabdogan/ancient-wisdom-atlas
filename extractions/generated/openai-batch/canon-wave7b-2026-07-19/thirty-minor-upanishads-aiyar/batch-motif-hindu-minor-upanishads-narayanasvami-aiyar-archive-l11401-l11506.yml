canonical_text:
  quote: ''
  summary: The passage gives yogic instruction on controlling chitta through prana,
    moderate food, postures, and the movement of Kundalini/Sakti. It describes Sarasvati-chalana,
    the entry of Kundalini and prana into sushumna, disease-curing effects of shaking
    Sarasvati/Sakti, and classifications and practice of pranayama including suryabheda.
  language: English
