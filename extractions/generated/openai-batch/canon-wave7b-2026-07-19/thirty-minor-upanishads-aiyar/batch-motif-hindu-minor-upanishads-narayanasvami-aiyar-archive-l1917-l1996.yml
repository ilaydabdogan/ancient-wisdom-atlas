canonical_text:
  quote: ''
  summary: Ashvalayana asks Brahma for initiation into Brahma-vidya. Brahma teaches
    that liberation is attained through faith, devotion, meditation, yoga, and renunciation,
    not through works, progeny, or wealth. The seeker is instructed to meditate in
    the purified heart on Parameshvara with Uma. The passage identifies the supreme
    reality with many deities and cosmic principles, teaches crossing death through
    knowing that reality, uses the image of body and Om as aranis that burn ignorance
    through meditation, and describes the Jiva's states and the emanation of elements
    from the supreme source.
  language: English
  quote_policy: summarized
