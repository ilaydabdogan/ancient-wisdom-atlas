canonical_text:
  quote: ''
  summary: The passage describes the mind or inner faculty resting on differently
    colored lotus petals and producing corresponding dispositions, then passing through
    sleep, dream, dreamless sleep, turya, and turyatita. It gives yogic instructions
    involving self-control, placing manas in Atma, uniting prana and apana, contemplating
    the universe as Atma, and attaining Paramatma and emancipation. It also describes
    breath entering an inner hole and triangle where Achyuta is seen, meditation on
    elemental seed letters and pranas, the distribution of prana through nadis, and
    binding prana and apana in the cave of the lotus of the heart while uttering pranava.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage associates the inner faculty's resting on colored petals in different
    directions with specific dispositions such as sleep and laziness, hate and anger,
    harmful desire, amusement, roving or indifference, happiness and love, and amassing
    money, charity, and passion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the inner faculty stays between petals, the passage says it gets wrath
    arising from diseases connected with vayu, bile, and phlegm; when it stays in
    the middle, it knows everything, sings, dances, speaks, and is blissful.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: To remove eye pain, the inner faculty makes a circular line and sinks in the
    middle; the first line is bandhuka-colored and is followed by the state of sleep.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Within sleep is dream; within dream it experiences ideas of perception, Vedas,
    inference, possibility, sacred words, and related contents, after which fatigue
    arises.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: To remove fatigue, the inner faculty circles a second line and sinks in the
    middle; the second line is described as the color of Indragopa and is followed
    by dreamless sleep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: During dreamless sleep the thought is connected only with Paramesvara, and
    the state is described as eternal wisdom; afterward it attains the nature of the
    highest Lord, makes a third ruby-colored circle, and enters turya.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In turya there is only connection with Paramatma and attainment of eternal
    wisdom.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The instruction says to attain quiescence of buddhi with self-control, place
    manas in Atma, think of nothing else, unite prana and apana, and concentrate on
    the whole universe as Atma.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In turyatita everything appears as bliss; the practitioner is beyond pairs,
    remains while wearing the body, then attains the nature of Paramatma and emancipation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: When vayu or breath enters a great hole associated with a hall where four
    roads meet and reaches part of a well-placed triangle, Achyuta is seen.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage instructs meditation above the triangle on five bija letters of
    the elements, five pranas, their colors, and their positions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Prana is said to stay in several body locations, travel through seventy-two
    thousand nadis, stay in numerous hair-pores, remain the same everywhere, and be
    called jiva.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The practitioner is instructed to perform expiration and related breath practices,
    draw everything in gradually, bind prana and apana in the cave of the lotus of
    the heart, and utter pranava.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Sushumna is described as extending from Muladhara to the head and resembling
    the shining thread of the lotus; nada is located in the spinal column and its
    sounds are compared to the conch and peacock.
  category: object
  evidence_refs:
  - ev:9
