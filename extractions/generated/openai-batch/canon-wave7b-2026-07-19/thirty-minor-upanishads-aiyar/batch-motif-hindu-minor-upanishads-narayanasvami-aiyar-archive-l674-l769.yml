canonical_text:
  quote: ''
  summary: Sri-Rama tells Hanuman that study of the Mandukya, ten, thirty-two, or
    108 Upanishads leads to Jnana, release, and disembodied salvation; he lists the
    108 Upanishads, describes their effects, prescribes guru-mediated transmission,
    restricts the teaching to qualified recipients, cites Vidya/Saraswati asking a
    Brahmana to protect her, and begins classifying Upanishads by Vedic affiliation
    and Santi formula.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker presents Mandukya-Upanishad alone as sufficient for final emancipation,
    with study of ten, thirty-two, or 108 Upanishads prescribed if Jnana is not attained
    or made firm.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he will state the names of the Upanishads in order with their
    Santi mantras, and the passage gives a long list of 108 Upanishads.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The 108 Upanishads are described as removing three Bhavanas, conferring Jnana
    and Vairagya, and destroying three Vasanas.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Twice-born learners are instructed to learn the 108 Upanishads with Santi
    formulas from the mouth of a Guru versed in Vedic observances and study.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those learners are said to become Jivanmuktas until Prarabdha is destroyed
    and then to attain the speaker's disembodied salvation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says the science of the 108 Upanishads is occult and frees persons
    from bondage whether read with or without knowledge.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker forbids imparting the 108 Upanishads to atheists, ungrateful persons,
    those intent on vicious actions, those without devotion toward him, or those who
    lose their path in the cave of books.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The teaching is to be imparted only after examination to a serving disciple,
