canonical_text:
  quote: One who will simply stay in Atma is called a Jivanmukta.
  summary: In a dialogue, Kumara asks the great Lord to explain embodied and disembodied
    salvation. Siva replies by identifying himself with ultimate consciousness and
    defines a Jivanmukta as one who abides in Atma, realizes identity with Brahman,
    lacks egoic identification, and is free from body-identification, mental faculties,
    Maya, passion, and anger.
  language: English
  quote_policy: quoted
