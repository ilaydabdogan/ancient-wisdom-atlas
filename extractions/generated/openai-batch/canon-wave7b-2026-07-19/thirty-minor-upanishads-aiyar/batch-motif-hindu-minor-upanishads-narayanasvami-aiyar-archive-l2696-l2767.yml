canonical_text:
  quote: ''
  summary: Paingala asks Yajnavalkya about the karma and state of the wise. Yajnavalkya
    answers with teachings on moksha, the chariot analogy of self, body, intellect,
    mind, senses, and objects, the liberated person's relation to body and funeral
    rites, service to the Guru, and the non-difference of Jivatma and Paramatma through
    wisdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Paingala addresses Yajnavalkya and asks what karma and state belong to the
    wise.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yajnavalkya says that a lover of moksha with humility and other virtues enables
    twenty-one generations to cross, while a Brahmavit enables 101 generations to
    cross.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Atma is described as the rider, the body as the chariot, buddhi as the charioteer,
    manas as the reins, the organs as horses, and the objects as roads.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Atma, when associated with the sense organs and manas, is called the enjoyer;
    Narayana is said to be established in the heart.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Until prarabdha karma is worn out, the liberated person exists in the body
    as in the cast-off slough of a serpent.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: An emancipated person with such a body roves without a settled abode, like
    a moon gladdening all.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The emancipated person gives up the body in any place without distinction
    and attains salvation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Such a body is to be offered as a sacrifice to the quarters or buried underground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: For an ascetic who has attained the nature of Brahman, the passage says there
    is no pollution, fire ceremony, pinda, water ceremony, or periodical funeral ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A body already burnt by the fire of wisdom is not to be burned again, and
    no sraddha or funeral ceremony is required.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: So long as non-wisdom remains as an upadhi, one should serve the Guru and
    treat the Guru's wife and children as one treats the Guru.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A pure-minded person who has the discrimination "I am He" should concentrate
    the heart on Paramatma and obtain firm peace.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage says such a person becomes of the nature of Jyotis and is void
    of manas and buddhi.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: A Yogin content with the nectar of wisdom is said to have nothing more to
    do.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: Pratyagatma is described as all-pervading, in the body yet devoid of the body,
    and not far though difficult of attainment.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: Cognizing the 'I' as supreme and all after purifying the heart and contemplating
    Brahman is called the highest bliss.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Jivatma and Paramatma are said to be without difference, like water mixed
    with water, milk with milk, and ghee with ghee.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:18
  text: The wise man burns the bondage of karma through the fire of Brahma-jnana and
    becomes purified and non-dual.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: Atma is described as invisible like akas and vayu, within and without, and
    immovable.
  category: attribute
  evidence_refs:
  - ev:10
