canonical_text:
  quote: All these rest in Atma, and he who knows this, becomes Atma itself.
  summary: Raikva asks the Lord where all things rest. The reply gives a sequence
    of worlds resting or being woven in other worlds, ending with Sarvaloka woven
    in Atma, identified with Brahman. The passage concludes that all things rest in
    Atma and that one who knows this becomes Atma itself; this is called an exposition
    of Nirvana.
