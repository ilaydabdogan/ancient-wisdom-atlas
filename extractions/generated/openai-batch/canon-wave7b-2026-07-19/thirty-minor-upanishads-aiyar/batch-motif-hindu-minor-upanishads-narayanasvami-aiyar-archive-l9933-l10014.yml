canonical_text:
  quote: As salt dissolved in water becomes one, so if Atma and manas become identified,
    it is termed samadhi.
  summary: The passage teaches that waking and dream states do not ultimately belong
    to the changeless self; deep sleep is described as absorption and bliss. It identifies
    the realized knower with Chit and with divine names, treats worldly existence
    as dream or mind-made illusion, urges contemplation of Brahman, and describes
    dissolution of body-identification, maya, affinities, and prarabdha. It uses analogies
    of pot-space, a serpent’s cast-off slough, fire of self-knowledge, mirage water,
    eclipse of the moon of wisdom by delusion, salt dissolving in water, and the binding
    of mercury or mind. It concludes by ranking mind, prana, and laya and recommending
    laya-yoga.
  language: English
  quote_policy: quoted
