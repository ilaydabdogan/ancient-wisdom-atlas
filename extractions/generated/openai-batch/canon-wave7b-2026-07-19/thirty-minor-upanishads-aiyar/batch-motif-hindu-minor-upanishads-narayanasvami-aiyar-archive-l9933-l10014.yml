candidate_motifs:
- id: motif:1
  label: annihilation of separateness in non-dual union
  taxonomy_refs:
  - annihilation_union
  basis: The passage describes absorption of the superimposed universe, destruction
    of identification and maya, discernment of the non-dual one, and samadhi as Atma
    and manas becoming one like salt dissolved in water.
  evidence_refs:
  - ev:6
  - ev:11
  - ev:12
  - ev:17
  confidence: high
  cautions: The motif is philosophical and yogic rather than narrative; it is inferred
    from repeated explicit statements of absorption, cessation, and union.
- id: motif:2
  label: liberating wisdom destroys delusion
  taxonomy_refs:
  - wisdom
  basis: Self-knowledge is described as a fire that destroys delusive knowledge, and
    the full moon of wisdom is contrasted with the rahu of delusion.
  evidence_refs:
  - ev:10
  - ev:16
  confidence: high
  cautions: The passage presents wisdom in doctrinal and metaphorical terms, not as
    a personified wisdom figure.
- id: motif:3
  label: spiritual quest through guru, renunciation, and yoga
  taxonomy_refs:
  - mystical_quest
  - initiation
  basis: The passage says the guru’s grace enables renunciation, perception of divine
    truth, and attainment of one’s true state, and it recommends laya-yoga as the
    practice through which prana is mastered.
  evidence_refs:
  - ev:18
  - ev:22
  confidence: medium
  cautions: The passage gives instructions and hierarchy of practice but does not
    narrate an initiation episode.
- id: motif:4
  label: serpent casting off the body as nonattachment image
  taxonomy_refs:
  - serpent
  basis: The serpent’s lack of affection for its cast-off slough is used to explain
    how the wise do not identify with gross and subtle bodies.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is an explicit analogy using a serpent image, not a serpent myth
    episode.
- id: motif:5
  label: powers from binding mind or mercury
