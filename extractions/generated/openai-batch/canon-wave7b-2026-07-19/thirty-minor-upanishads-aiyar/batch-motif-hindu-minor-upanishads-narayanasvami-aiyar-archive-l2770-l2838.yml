  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the mind reaches the Unmani state, duality is said not to arise, and
    the supreme Seat is said to be attained.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that even extraordinary acts do not bring emancipation
    without the self-cognition “I am Brahman.”
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Whoever recites the Upanishad is said to become pure, receive the fruits of
