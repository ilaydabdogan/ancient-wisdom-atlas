canonical_text:
  quote: ''
  summary: The passage teaches that the inner Atma knows through wisdom; that a wise
    person at death is absorbed like space in a broken pot and attains unsupported
    wisdom-light; that meditation, truth, Tattva, and self-cognition surpass austerity
    and scriptural study; that “mine” binds while “not mine” releases; that Unmani
    removes duality and leads to the supreme Seat; that reciting the Upanishad purifies
    the reciter and others; and that the wise and Brahmanas with spiritual eyes perceive
    and praise the supreme Seat of Vishnu.
  language: English
  quote_policy: summarized
