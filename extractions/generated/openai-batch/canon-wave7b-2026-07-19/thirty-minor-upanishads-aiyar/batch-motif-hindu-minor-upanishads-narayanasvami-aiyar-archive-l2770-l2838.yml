  text: The internal Atma is said to see or know through the torch of wisdom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wise man, regardless of the place or manner of death, is said to be absorbed
    there like all-pervading akasa; Atma is compared to akasa in a broken pot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After this absorption, the wise man is said to attain an all-pervading wisdom-light
    without support.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage ranks dhyanayoga above thousand-year austerity standing on one
    leg and says thousand-year study of the Shastras does not by itself attain the
    desired end.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage instructs that the indestructible alone should be known, truth
    should be worshipped, and karmas, purity, japa, sacrifice, and pilgrimages are
    to be observed until Tattva is known.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mahatmas are said to gain salvation by remaining in the conception “I am Brahman.”
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The terms “mine” and “not mine” are given as two causes related to bondage
