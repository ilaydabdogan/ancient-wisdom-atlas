  summary: The passage describes a sequence in which subtle principles dissolve into
    darkness, and darkness becomes one with the supreme Lord; this is identified as
    the teaching of Nirvana and of the Vedas. It then describes Atma through negated
    attributes and states that Atma may be attained by six means. A person who knows
    “That” has prana absorbed in Brahman at death and attains the state of Brahman.
  language: English
