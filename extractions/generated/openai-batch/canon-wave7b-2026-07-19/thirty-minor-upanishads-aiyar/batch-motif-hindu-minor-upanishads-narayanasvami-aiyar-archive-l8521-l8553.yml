canonical_text:
  quote: ''
  summary: 'Opening of the Yogatattva-Upanishap: a speaker announces a teaching on
    yoga-truth for purified yogins. Vishnu is described as supreme Purusha and a lamp
    on the path of truth. Brahma salutes Vishnu and asks about the truth of yoga with
    eight subservients. Vishnu replies by teaching that souls are bound by maya, that
    Kaivalya is the sole path to emancipation and overcoming death, that scripture
    cannot illuminate the self-shining indescribable state, and that the jiva arises
    from a pure reality through karmic causes, with a water-bubble image beginning
    at the end of the excerpt.'
  language: English
  quote_policy: summarized
