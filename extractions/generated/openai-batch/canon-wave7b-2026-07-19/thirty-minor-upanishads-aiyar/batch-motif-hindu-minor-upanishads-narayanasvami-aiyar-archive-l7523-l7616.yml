canonical_text:
  quote: ''
  summary: The passage describes Prajna and the fourth state, Turya, identifying Turya
    with Brahman and saying it is realized only through Self-realization. Narada then
    asks Brahma about Brahma-swarupa. Brahma teaches that knowing Brahman as separate
    from oneself is bondage, while knowing Brahman as oneself is the path beyond death.
    The passage rejects several proposed cosmic causes, describes meditative seers
    beholding devatma-sakti, represents the Universal Soul through wheel and river
    images, and says the deluded jiva whirls in the wheel of Brahman until blessed
    and released through knowledge of the Lord.
  language: English
  quote_policy: summarized
