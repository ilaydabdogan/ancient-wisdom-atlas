canonical_text:
  quote: The bondage of Vasana is the [real] bondage, while the destruction of Vasana
    is salvation.
  summary: The passage teaches that Vasanas may be pure or impure, that impure Vasanas
    cause rebirth, and that the destruction and abandonment of Vasana leads to salvation.
    A speaker instructs Maruti to seek inner effulgence, give up even the desire for
    salvation, retire inward, and become firm in Samadhi. The speaker identifies the
    worshipped Reality with non-dual Brahman and gives first-person meditation formulas.
    The passage closes by citing an Rg-Veda saying about the wise seeing and praising
    the Supreme Seat of Vishnu.
