canonical_text:
  quote: ''
  summary: 'The passage defines Vedantic terms: bondage as the Self''s false identification
    with body and not-Self; moksha as freedom from that identification; avidya and
    vidya as the cause and remover of identification; the waking, dreaming, dreamless-sleep,
    and fourth states; the five sheaths; and designations such as Karta, Jiva, Kshetrajna,
    Sakshi, and Kutastha.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Atma is said to falsely superimpose the body and other not-Self things upon
    Himself, and this identification is called bondage of the Self.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moksha is defined as freedom from identification; Avidya is defined as what
    causes the identification; Vidya is defined as what removes it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the waking state, Atma enjoys gross sense objects such as sound through
    fourteen organs, with the sun and other presiding deities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the dream state, Atma experiences objects formed from Vasanas even in the
    absence of gross sense objects; the passage states this occurs through organs
    associated with Vasanas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In dreamless sleep, Atma does not experience sound and other sense objects
    because the functions of the fourteen organs have ceased and there is no special
    enjoying consciousness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Turiya is described as the state in which Atma witnesses the three other states
    while remaining uninterrupted consciousness alone.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Annamaya sheath is formed from food; the Pranamaya sheath is named when
    ten vital airs flow through it; the Manomaya sheath is named when Atma functions
    through the organs in connection with the first two sheaths.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Vijnanamaya sheath is associated with modifications such as contemplation
    and meditation, and the Anandamaya sheath is associated with self-cause Jnana
    in self-bliss, compared to a banyan tree in its seed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Karta is defined as the one possessing body and internal organs through desires
    proceeding from ideas of pleasure and pain.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Jiva is defined as a deluded one who thinks that the body obtained through
    good and bad karmas was not so obtained.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'Panchavarga is listed as five groups: Manas and its related faculties; the
    five Pranas; the three gunas; the five elements; and Dharma with Adharma.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Original Avidya is said to have the characteristics of the five groups, not
    to perish without Atma-Jnana, to appear eternal through Atma, to serve as the
    vehicle for Atma, and to be the seed of the subtle body, also called the heart-knot.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Kshetrajna is described as reflected consciousness shining in original Avidya;
    Sakshi is aware of the appearance and disappearance of knower, knowledge, and
    known while remaining unaffected and self-radiant; Kutastha is found in the Buddhi
    of creatures from Brahma down to ants.
  category: attribute
  evidence_refs:
  - ev:6
