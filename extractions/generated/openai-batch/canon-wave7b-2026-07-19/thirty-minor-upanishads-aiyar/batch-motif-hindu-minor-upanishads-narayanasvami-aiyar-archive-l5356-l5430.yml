  quote: ''
  summary: The passage classifies the body by five elements, sense and action organs,
    mental faculties, tastes, life changes, chakras, sounds, and bodily substances.
    It describes a sequence of bodily substances leading to male seminal fluid, states
    that conception occurs from the union of male and female vital substances, locates
    internal fire and related principles in the heart area, and gives a timed account
    of embryonic development from the first night through the eighth month.
