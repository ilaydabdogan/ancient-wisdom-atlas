canonical_text:
  quote: ''
  summary: The passage states that study and constant recitation of Narayana's Ashtakshara
    and related mantra bring long life, lordship, moksha, release from birth and mundane
    existence, access to Vaikuntha, destruction of sins at prescribed times of recitation,
    the fruits of all Vedic recitation, and Sayujya or absorption in Narayana's essence.
    It identifies Narayana with the all-pervading cause Purusha and Parabrahman and
    describes the heart-lotus as bright like lightning and full of vijnana.
  language: English
  quote_policy: summarized
