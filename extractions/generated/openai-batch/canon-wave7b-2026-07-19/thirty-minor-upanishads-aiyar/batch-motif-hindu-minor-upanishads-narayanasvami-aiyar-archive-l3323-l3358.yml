canonical_text:
  quote: That is Atma. It is that which should be worshipped.
  summary: 'The passage gives a series of correspondences: bodily or mental faculties
    are named as adhyatma, their objects or domains as adhibhuta, and deities or celestial
    powers as adhidaiva/adhidaivata. Nadis bind the correspondences. A repeated refrain
    identifies the inner mover within these domains, prana, vijnana, ananda, the heart-space,
    and all else as Atma, to be worshipped and free from old age, death, fear, sorrow,
    and end. The selected range ends during the buddhi correspondence and includes
    an editorial note on ordering.'
  language: English translation with Sanskrit terms
  quote_policy: quoted
