literal_observations:
- id: obs:1
  text: The passage says that one who is now father will again be son, and one who
    is now son will again be father; egos wander in birth and death like a bucket
    in a well-wheel.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists sets of three—worlds, Vedas, sandhyas, svaras, agnis, and
    gunas—and says these are placed in the three letters of OM.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that one who understands the indestructible meaning of
    the three letters has all these worlds strung by him, and calls this the Truth
    and supreme seat.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lotus is said to be situated in the heart, compared to hidden smell, ghee,
    oil, and gold; its face is downward, its stem upward, its bindu downward, and
    manas is in its centre.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The letter A expands the lotus, U opens it, M gives it nada, and the half-metre
    is silence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The person engaged in yoga obtains the supreme seat, which is compared to
    pure crystal, described as without parts, and said to destroy all sins.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The yogic process is compared to a tortoise drawing in its limbs; the practitioner
    draws in air, expels it through the nine holes of the body, and breathes upward
    and forward.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A motionless presence seen through yoga in the heart, free from turmoil and
    drawn from the nine holes, is identified as Atma alone and compared to a lamp
    in an air-tight jar.
  category: attribute
  evidence_refs:
  - ev:6
