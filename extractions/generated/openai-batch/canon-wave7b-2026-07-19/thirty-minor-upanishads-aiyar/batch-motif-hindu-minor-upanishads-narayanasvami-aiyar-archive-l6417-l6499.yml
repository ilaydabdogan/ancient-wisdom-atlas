canonical_text:
  quote: ''
  summary: The passage describes when a person in any of several life-stages may enter
    ascetic life, including ritual actions involving sacrifice, fire, or water, and
    the abandonment of tuft, holy thread, family ties, karma, Vedic study, and mantra.
    Narada asks Brahma how one without the holy thread can be a Brahmana; Brahma replies
    that the wise renouncer casts off the external thread and wears Brahman as the
    true internal thread, with knowledge as the true tuft and purifying principle.
    The passage then describes the sannyasin as having little or nothing, abandoning
    relations, possessions, and karmas, and enduring opposites.
  language: English
  quote_policy: summarized
