  summary: 'The passage gives detailed Pranayama instructions: alternate nostril breathing,
    retention, prescribed times and repetitions, bodily stages, diet, cautions, movement
    of Prana and Apana through the Sushumna, disease-removing breath practices, sahita
    and kevala kumbhaka, the arising of knowledge of kundalini, and the definition
    of Vaishnavimudra.'
