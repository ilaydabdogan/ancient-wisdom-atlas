canonical_text:
  quote: ''
  summary: The passage presents yogic and Upanishadic images of wisdom as an inner
    light or fire within the body-vessel, revealed through practice and the guru.
    It describes crossing the ocean of samsara, the involution of speech into subtle
    sound, the absorption of human and cosmic principles into the inner Self and Parabrahman,
    and the liberation of the contemplative muni beyond embodied existence.
  language: English
  quote_policy: summarized
