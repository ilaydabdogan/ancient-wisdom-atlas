canonical_text:
  quote: ''
  summary: 'The passage gives prescriptive instructions for ascetics: renouncing worldly
    and scriptural attachments, abiding in Atma, concealing personal identity, avoiding
    contact and recollection connected with women, rejecting prohibited impulses and
    actions, maintaining respectful but non-dependent conduct toward others, remaining
    unaffected by relatives'' joy or sorrow, and cultivating ascetic duties such as
    harmlessness, truth, celibacy, restraint, compassion, knowledge, yoga, and moderate
    food.'
  language: English
