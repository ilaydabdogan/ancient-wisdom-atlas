canonical_text:
  quote: ''
  summary: A philosophical discourse in the Varaha-Upanishad teaches that Atma alone
    is real, that Atma is Brahman, and that knowledge of this non-dual identity brings
    moksha and freedom from bondage. The speaker identifies himself with Brahman,
    Chidatma, the supreme Lord, Vasudeva, and a boar form; addresses Rbhu and a Devata;
    uses images of light, blindness, sun, universal deluge waters, serpent, corpse,
    and poison; and describes a Paramahamsa ascetic whose detachment leads to merger
    in the speaker.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says that the universe, jiva, Is'vara, maya, and others do not
    really exist except the speaker's full Atma, and that karma connected with darkness
    and ajnana is not fit to affect the self-resplendent Atma.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that a person who sees Atma as Brahman becomes Brahman, and
    that one who sees the visible universe as the Supreme Seat of light attains moksha
    at once.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that knowledge dispelling the idea that the body alone
    is Atma results in moksha, even if the person does not desire moksha.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Persons with spiritual eyes are said to see Brahman as the witness of the
    three states, while an ignorant person is compared to a blind man who does not
    see the shining sun.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Brahman is described as prajnana, truth, bliss, without duality and gunas,
    all-pervading, eternal, all-full, indestructible, and the only true reality.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker refers to himself as being of the form of a boar, infinite, and
    the bliss of absolute Consciousness, and asks where bondage or emancipation can
    be if non-dualism is conceived in him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that the real nature of embodied objects is absolute Consciousness
    and instructs the listener to know all moving and fixed worlds as Atma and meditate
    on them as 'It I am'.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker tells Rbhu to become 'He' and says that afterward there will be
    no experience of the world, but always the experience of wisdom of one's own true
    nature.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage says that meditating for one muhurta on Him dancing as the all-witness
    releases one from all bondage.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The speaker says, 'O Devata, you are I. I am you,' and offers prostrations
    in relation to himself and the addressed Devata as infinite Chidatma.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The speaker says the universe is filled by him as with the waters of the universal
    deluge, and that whoever gives up love of the external, internal, and body, as
    well as all associations, is merged in him.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: A Paramahamsa ascetic is described as living in the world while keeping aloof
    from human congregation as from a serpent, regarding a beautiful woman as a living
    corpse and sensual objects as poison, abandoning passion, and being no other than
    Vasudeva, the speaker himself.
  category: attribute
  evidence_refs:
  - ev:11
