canonical_text:
  quote: As camphor in fire and salt in water become absorbed, so also the mind becomes
    absorbed in the Tattva.
  summary: The passage gives yogic instructions for Khecharimudra, contemplation of
    light, Tat, OM, akas, prana, and the cessation or absorption of mind. It describes
    yoga and jnana as means for destroying chitta, ending the cycle of births and
    deaths, and attaining kaivalya.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A yogin is described with mind and breath absorbed in an internal object,
    motionless pupils, and an apparent ability to see objects outside and under him;
    this is called Khecharimudra.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The real seat of Vishnu, described as void and non-void, dawns on the practitioner
    in connection with this practice.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The practitioner fixes half-closed eyes on the tip of the nose, becomes absorbed
    in the sun and moon, and becomes conscious of a resplendent light identified as
    Tat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Merging sound in light and slightly raising the brows is said to bring the
    state of Unmani, which causes destruction of the mind; the practitioner then falls
    into yoga sleep, where time does not exist.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The text instructs placing mind in s'akti and s'akti in mind, placing Atma
    in akas and akas in Atma, reducing everything to akas, and abandoning all external
    and internal thoughts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mind's absorption in Tattva is compared to camphor absorbed in fire and
    salt absorbed in water; when mind is absorbed, kaivalya alone remains.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'For destruction of chitta, the passage names two ways: yoga, defined as repression
    of modifications of the mind, and jnana, defined as thorough inquiry into them.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The cessation of the fluctuations of the mind is said to bring the cycle of
    births and deaths to an end.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage lists religious study, good company, indifference to enjoyments,
    practice, yoga, contemplation, and firm practice of one truth as means connected
    with preventing fluctuations of prana.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Breath repression, continual non-fatiguing practice, and secluded meditation
    are said to arrest fluctuations of the mind.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage describes stopping prana through realization of the sound at the
