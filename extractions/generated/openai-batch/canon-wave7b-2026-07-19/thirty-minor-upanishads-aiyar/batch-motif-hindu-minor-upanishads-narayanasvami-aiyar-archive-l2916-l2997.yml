canonical_text:
  quote: all this universe is Atma and there is nothing but Atma.
  summary: The passage teaches that Atma alone is real, that bodily ego and superimposed
    distinctions should be given up, and that through renunciation, inquiry, contemplation,
    and samadhi the practitioner realizes Parabrahman and becomes liberated while
    living.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage instructs one to strengthen the conception of Atma and give up
    the conception of "I" in the body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: It states that all upadhis from Brahma down to a pillar are unreal.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Brahma, Vishnu, Rudra, Indra, and the whole universe are stated to be Atma.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: By expelling all objects superimposed on one's Atma, one becomes Parabrahman,
    described as full, secondless, and actionless.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says there is no difference between seer, seen, and sight, and
    that the darkness causing false perception merges in the decayless Chidatma.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Vikalpa is said to have its root in chitta, and the chitta is to be united
    with Paramatman in its Pratyagatmic state.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: One who knows Atma as unbroken bliss is said to drink the essence of bliss
    in Atma internally and externally.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage gives a sequence in which vairagya yields bodha, bodha yields
    uparati, and uparati yields shanti.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: That which has Maya as its upadhi is described as the womb of the world and
    is denoted by the word "Tat."
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: By separating the upadhis Maya and avidya from Para and Jiva, one realizes
    partless Sachchidananda Parabrahman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sravana, manana, and nididhyasana are defined as hearing, contemplative reasoning,
