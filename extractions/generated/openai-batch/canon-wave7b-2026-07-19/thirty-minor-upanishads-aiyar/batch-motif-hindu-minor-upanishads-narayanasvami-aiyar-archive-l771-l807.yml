canonical_text:
  quote: Persons desirous of emancipation... should, with presents in their hands,
    approach a Guru...
  summary: The passage lists groups of Upanishads associated with the Samaveda and
    Atharvana-Veda and their peace invocations. It then instructs seekers of emancipation
    to approach a qualified Guru with presents, study the 108 Upanishads, and continue
    studying, thinking, and reflecting on them. Through destruction of Prarabdha and
    cessation of the three bodies, they attain a state of Plenum without limiting
    adjuncts, compared to ether in a broken pot. The passage identifies this as embodied
    salvation and final emancipation, attained through the path of knowledge rather
    than ritual action or other practices.
