canonical_text:
  quote: ''
  summary: The passage addresses a second-person figure as Brahman, time, truth, all-pervading
    consciousness, and beyond attributes and named deities. It then declares the universe,
    seer and seen, elements, disciplines, scriptures, deities, bondage and salvation,
    wisdom and non-wisdom, duality and non-duality, and many other categories to resemble
    the horns of a hare. It concludes by describing the conception “I am the body”
    as mundane existence, the knot of the heart, non-wisdom, nescience, duality, sin,
    and a disease arising from desire.
  language: English
