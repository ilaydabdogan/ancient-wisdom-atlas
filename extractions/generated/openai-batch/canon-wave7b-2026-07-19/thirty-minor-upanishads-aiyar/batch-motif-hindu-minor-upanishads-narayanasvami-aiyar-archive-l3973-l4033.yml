canonical_text:
  quote: ''
  summary: The passage explains yogic disciplines by identifying breath, pratyahara,
    dharana, dhyana, and samadhi with contemplation of Brahman and Atma. It lists
    obstacles to samadhi, contrasts Brahman-oriented thought with worldly or empty
    thoughts, describes different outcomes for practitioners and merely verbal disputants,
    and concludes with discrimination dissolving cause and effect so that everything
    is seen as Brahman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Expiration, inspiration, and cessation of breath are defined through conceptions
    about the universe and the thought of being Brahman, rather than through merely
    closing the nose.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pratyahara is described as the practice through which one sees Atma in the
    objects of sense and pleases chitta through manas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Dharana is obtained by seeing Brahman wherever the mind goes, and dhyana is
    described as unsupported contemplation of being Brahman alone and as a giver of
    supreme bliss.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Samadhi is described as beginning with changelessness and then forgetting
    that state through cognition of Brahman; the practitioner’s cognition is said
    to unite with pratyag Atma, after which the King of Yogins becomes a Siddha and
    attains an inexpressible and unthinkable state.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Obstacles to samadhi are listed as absence of right inquiry, laziness, inclination
    to enjoyment, absorption in material objects, tamas, distraction, impatience,
    sweat, and absent-mindedness.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Worldly thoughts and empty thoughts are said to lead into obstacles, while
    thoughts of Brahman are said to produce fullness.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A person who abandons the purifying Brahman-vrtti is said to live in vain
    like a beast, while a person who understands and advances in it becomes blessed
    and worthy of worship by the three worlds.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Those developed through the ripening of past karmas attain the state of Brahman,
    while those who argue about Brahman without Brahman-related action and remain
    attached to the world are said to be born again and again through ignorance.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the cause ceases to exist in truth, the effect is said to perish through
    right discrimination, leaving a pure principle beyond the scope of words.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: After knowledge arises in a purified mind and firm certitude develops through
    meditation, one is instructed to reduce the visible into the invisible state,
    see everything as Brahman, and remain in bliss with understanding full of Chit.
  category: sequence
  evidence_refs:
  - ev:5
