canonical_text:
  quote: ''
  summary: 'The passage gives rules for an ideal renunciant ascetic: freedom from
    fear, egoism, attachment, ritual obligation, and worldly contact; residence with
    a guru for one year; attainment of jnana-yoga and sannyasa; wandering over the
    earth with restrained senses, non-injury, inward vision, and attention to Brahman
    or the Self. It then introduces Grandfather''s answer to Narada on ascetic observance,
    prescribing rainy-season residence, solitary wandering, restrictions on staying
    in one place, and negative analogies for food, wealth, pleasure, towns, assemblies,
    and worldly attachments.'
  language: English
  quote_policy: summarized
