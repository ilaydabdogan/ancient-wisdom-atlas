canonical_text:
  quote: ''
  summary: The passage classifies yoga into earlier taraka and later amanaska forms,
    describes internal vision and lights located between the eyebrows, above the palate,
    and in the sahasrara, defines Shambhavi mudra, lists several understandings of
    antarlakshya, and states that the jiva becomes liberated by identifying Paramatma
    as the Self and becoming one with Brahman or Paramakasha.
  language: English
  quote_policy: summarized
