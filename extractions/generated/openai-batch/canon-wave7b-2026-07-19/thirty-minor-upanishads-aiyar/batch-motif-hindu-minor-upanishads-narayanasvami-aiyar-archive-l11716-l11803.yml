canonical_text:
  quote: ''
  summary: The passage explains the rarity and secrecy of melana and the science of
    khechari, instructs a seeker to learn it from a guru through initiation, describes
    a mantra-seed with fire, water, and moon imagery, states results of recitation
    and practice, and gives a detailed bodily procedure involving the tongue, knife,
    salts, and gradual upward drawing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Practice and melana are described as not being accomplished simultaneously,
    and melana may remain unobtained even after many births.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A yogin who obtains melana from the mouth of his guru obtains siddhis, while
    one who obtains it through books and their significance attains the state of Siva
    freed from rebirth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The science is described as very difficult to master, something an ascetic
    should seek while wandering, and something to be protected rather than revealed
    indiscriminately.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The person who imparts melana or gives the science is to be regarded as Achyuta,
    and the one who teaches the practice is to be regarded as Siva.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The seeker is instructed to go to a guru able to teach divine yoga, learn
    the science khechari, and practise it carefully.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: By means of khechari science and its seed-letter, the practitioner joins with
    khechari shakti, identified parenthetically as kundalini shakti, becomes lord
    of the khecharas or devas, and lives among them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The khechari seed-letter is described as agni encircled with water, as the
    abode of khecharas, and in terms of moon-parts and letters pronounced in reverse
    order.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The text says that recitation twelve times daily prevents bodily maya even
    in sleep, and that five lakh recitations reveal the science of khechari, remove
    obstacles, please the devas, and destroy wrinkles and greyness of hair.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The practitioner is warned that without the nectarlike science he will not
    obtain siddhi, and that once he obtains it he should practise it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The bodily practice includes drawing the tongue from the root of the palate,
    cleaning impurity for seven days according to the guru’s advice, cutting the frenum
    a hair’s breadth with an oiled and cleaned sharp knife, applying powdered rock-salt
    and sea-salt, and repeating the cutting gradually for six months.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After six months the shiro-bandha at the root of the tongue is said to be
    destroyed, and the practitioner is instructed to encircle Vak-Isvari with a head-cloth
    and draw it upward until it reaches the middle of the eyebrows, the ear openings,
    and the root of the chin.
  category: sequence
  evidence_refs:
  - ev:8
