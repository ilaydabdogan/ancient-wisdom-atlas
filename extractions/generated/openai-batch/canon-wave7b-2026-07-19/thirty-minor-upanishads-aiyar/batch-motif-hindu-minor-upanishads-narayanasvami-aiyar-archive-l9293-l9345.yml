canonical_text:
  quote: ''
  summary: 'The passage closes a yogic visualization in which Atma shines in the skull,
    Purusha with shakti is seen in the Brahma-hole, the mind is absorbed, and kaivalya
    is attained through understanding a set of inner signs and Mahesvara''s seat.
    It then opens the Hamsa-Upanishad: Gautama asks Sanatkumara for Brahma-vidya;
    Sanatkumara presents a secret Hamsa teaching traced to Parvati and Siva, intended
    for a disciplined brahmacharin devoted to a guru. Hamsa is described as all-pervading
    and linked to deathlessness, followed by the beginning of a breath-raising practice
    from Muladhara and notes on Hamsa and chakras.'
  language: English
  quote_policy: summarized
