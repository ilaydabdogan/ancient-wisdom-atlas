canonical_text:
  quote: ''
  summary: The passage distinguishes Tatastha from the ego-affected jiva, treats body-identification
    as a screen to Brahman, prescribes the Hamsa-So'ham breath mantra and ascetic
    discipline, defines the true renunciant by self-control and detachment, says Brahman-knowers
    transcend caste and life-order, and describes approaching a Brahman-knowing guru
    for Vedantic learning that leads to seeing Atma in oneself.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tatastha is said to have the property of seeing, while the jiva affected by
    egoism, agency, and enjoyment is said not to be the seer.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that jiva-body identification arises through mutual abhimana
    and that the jiva's state is like a screen to Brahman, compared with pot-space
    and house-space.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Hamsa-So'ham mantra is associated with inspiration and expiration and
    is presented as a means through which self-realisation is reached.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A person who gives up body-identification, abhimana, and anger, eats moderately,
    conquers the organs, and controls the avenues of the organs is instructed to make
    the mind enter meditation.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The yogin is instructed to meditate in empty places, caves, and forests, and
    the knower of yoga is warned against feasts, sraddha sacrifices, pilgrimages,
    festivals, and crowds.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The great ascetic called tridandin is defined as one who holds firmly the
    threefold control of mind, speech, and body.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The supreme ascetic is described as begging alms-food from worthy Brahmanas
    after smoke has ceased and fire has been extinguished; an ascetic with staff and
    begging bowl but without vairagya is called degraded.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The ascetic is said not to go to a house where special alms are expected or
    to a house already visited.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A person who realizes the self-shining supreme Tattva, described as without
    body and organs and as all-witness, is said to transcend all castes and orders
    of life.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: For Brahma-jnanis, the passage states that there are no ordained or prohibited
    rules and nothing to be given up or not given up.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The aspirant is instructed to become indifferent to objects and family attachments,
    have faith in the path of salvation, approach a Brahman-knowing guru with a gift,
    satisfy the guru through service, and learn the meaning of Vedic sentences.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After becoming free of 'I' and 'mine' and attaining peace of mind, the aspirant
    sees Atma in himself; disgust with samsara gives rise to sannyasa, and the paramahamsa
    practices Brahma-jnana through Vedanta as the chief means of salvation.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
