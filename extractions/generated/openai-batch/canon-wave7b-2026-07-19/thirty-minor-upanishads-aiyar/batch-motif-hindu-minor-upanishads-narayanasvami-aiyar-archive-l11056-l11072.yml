canonical_text:
  quote: ''
  summary: Yajnavalkya asks the Purusha in the sphere of the sun to explain the fivefold
    division of akas. The reply names five forms of akas and describes several by
    darkness, deluge-fire, solar brightness, and indescribable all-pervading bliss.
    The passage states that one who cognises these becomes of their nature and that
    a yogin who does not cognise the listed chakras, adharas, lakshyas, and akas is
    a yogin only in name. A note identifies this as a reference to a secret way of
    imparting higher truth.
  language: English
  quote_policy: summarized
