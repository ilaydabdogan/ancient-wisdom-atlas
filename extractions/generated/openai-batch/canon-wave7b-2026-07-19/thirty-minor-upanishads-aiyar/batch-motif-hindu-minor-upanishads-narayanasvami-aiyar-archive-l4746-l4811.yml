canonical_text:
  quote: ''
  summary: Rbhu teaches that everything is Sachchinmaya or consciousness-being, that
    Sachchidananda is non-dual and identified with “I,” and that ordinary distinctions
    of mind, body, social order, gods, worlds, ritual acts, and temporal categories
    do not apply. The passage concludes that Brahman alone is everything, “That” is
    “I,” and the “I” is Brahman alone.
