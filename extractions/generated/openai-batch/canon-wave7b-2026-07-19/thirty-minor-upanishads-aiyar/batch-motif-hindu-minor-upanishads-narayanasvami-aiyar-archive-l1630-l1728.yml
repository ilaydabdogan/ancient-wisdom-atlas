  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Sakayanya gives a sequence in which Tapas leads to Sattwa, Sattwa to a pure
    mind, mind to Atma, and attaining Atma to liberation.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Sakayanya compares thought without modifications to fire without fuel that
