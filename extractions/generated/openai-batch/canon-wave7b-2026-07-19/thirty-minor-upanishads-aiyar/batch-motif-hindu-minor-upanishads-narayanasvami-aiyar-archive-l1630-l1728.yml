canonical_text:
  quote: ''
  summary: A king named Brhadratha renounces his kingdom, performs severe austerity
    in the forest, and seeks instruction from Sakayanya Muni concerning Atma and Sattva.
    After rejecting worldly boons and describing cosmic impermanence, bodily impurity,
    and his need for refuge, he receives teaching on sense objects, purification of
    mind, liberation, meditation in the lotus of the heart, identity with Paramatma,
    and dwelling in supreme bliss beyond social and bodily identifications.
  language: English
  quote_policy: summarized
