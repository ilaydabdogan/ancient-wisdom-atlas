canonical_text:
  quote: ''
  summary: The passage describes Devadatta or the person moving among waking, dream,
    deep sleep, and the fourth state; identifies these states with divine forms and
    bodily seats; teaches that Brahman shines beyond ordinary distinctions; locates
    devas, pranas, light, and the inner thread in the heart; and instructs the wise
    yogin to abandon merely external ritual markers in favor of Brahman and knowledge
    as the true sacred thread and tuft.
  language: English
  quote_policy: summarized
