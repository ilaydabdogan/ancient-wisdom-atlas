canonical_text:
  quote: ''
  summary: In Chapter II, the Brahmarshi S'andilya, unable to obtain knowledge of
    Brahman from the four Vedas, approaches Lord Atharvan and asks to be taught the
    science of Brahman. Atharvan defines Brahman as truth, knowledge, infinity, the
    source and absorber of the world, beyond bodily faculties and beyond speech and
    mind, knowable by knowledge and yoga. He further identifies Brahman with the non-dual
    reality and Atma, the inner soul of all beings, creator, supporter, and destroyer
    of everything, and tells S'andilya to know the worlds in Atma and not grieve.
  language: English
  quote_policy: summarized
