canonical_text:
  quote: ''
  summary: 'The passage gives prescriptive qualifications and conduct for an alms-eating
    renunciant or sannyasin: equanimity, non-injury, control of organs and mind, truthfulness,
    poverty, contentment, Vedanta study, fulfillment of debts, abandonment of family
    and ritual identifiers, minimal ascetic possessions, solitary wandering, endurance
    of insult, sense-control, Atma-centered dwelling, and rejection of identification
    with the perishable body. It connects these practices with fitness for sannyasa
    and salvation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person becomes fit to eat alms-food by keeping the same countenance when
    beaten as when worshipped, and by certainty that he is not other than non-dual,
    indestructible Brahman, also named Vasudeva.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists control of organs, control of mind, purity, truth, contentment,
    straightforwardness, poverty, non-ostentatiousness, and non-injury as qualities
    associated with kaivalya or sannyasa.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: One should take up sannyasa after becoming quiescent, practicing ten dharmas,
    studying Vedanta according to rules, and paying debts to devas, rshis, and pitrs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ten characteristics of dharma are given as courage, fortitude, control
    of the body, honesty, purity, control of inner organs, shame, knowledge, truth,
    and absence of anger.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fitness for sannyasa includes not dwelling pleasurably on past enjoyments,
    not looking forward into the future, not rejoicing in the present, controlling
    inner and outer organs, and being unaffected by pleasures and pains while alive.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Paramahamsa ascetic is prescribed two loin-cloths, one ragged cloth, and
    one staff; wearing more through desire is said to lead to raurava hell and birth
    in an animal womb.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ascetic is instructed to stitch old clean cloths into one cloth, color
    it red or ochre, wear it as an upper cloth, and possibly remain with one cloth
    or without cloth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ascetic should roam alone with the sole vision of Brahman, be free of
    desires, and may stay in one place alone during the rainy season.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ascetic should abandon family, including son and wife, as well as Vedanta,
    sacrifice, and the sacred thread, and should wander incognito.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The parivrat ascetic should give up faults such as passion, anger, pride,
    desire, and delusion, and should become one who owns nothing.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A muni is described as devoid of love and hate, regarding a clod of earth,
    stone, and gold equally, doing no injury to living creatures, and being freed
    from all.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that an ascetic associated with Atmajnana and freed from
    ostentation, egoism, injury, and tale-bearing reaches salvation.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Attraction to the senses is said to produce fault, while control of the senses
    brings perfection.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Lust is said not to be satisfied by enjoyment and is compared to fire that
    increases when oblations such as ghee are poured into it.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: A jitendriya is defined as one who does not rejoice or grieve through hearing,
    touching, eating, seeing, or smelling.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: One whose speech and mind are well controlled is said to attain the fruits
    of Vedanta.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: A Brahmana is described as fearing respect like poison, longing for disrespect
    like nectar, sleeping and moving happily despite disrespect, and causing the disrespectful
    person to perish.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:18
  text: The passage instructs endurance of cruel words, avoidance of disrespect toward
    others, non-retaliation toward anger, use of soft words even when violently pulled,
    and avoidance of untrue speech under affliction.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:19
  text: One desirous of bliss should dwell in the universe through Atma alone, intent
    on Atma, free from desires and the wish to bless others.
  category: action
  evidence_refs:
  - ev:11
- id: obs:20
  text: Fitness for salvation is linked with control of the organs, destruction of
    love and hate, and non-injury to beings.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:21
  text: The body is described as feeble, perishable, impure, made of five elements,
    with bones as pillars, nerves as strings, flesh and blood as coating, skin as
    covering, bad odor, urine and faeces, dotage, miseries, and ills.
  category: attribute
  evidence_refs:
  - ev:12
