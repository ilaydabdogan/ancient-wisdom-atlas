canonical_text:
  quote: ''
  summary: 'The passage explains bodily and ritual correspondences: humors and bile/agni
    affect health, cognition, and disorder; agni is classified into knowledge-fire,
    eye-fire, digestive fire, and ritual fires located in the body; the body is described
    as a sacrifice with Purusha, buddhi, faculties, devas, speech, life-elements,
    and death assigned ritual roles; the passage then enumerates bodily structures,
    digestion, and prana/vayu as Sutratma enabling breathing and movement.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unspecified subject is said to become fierce-eyed and debased after contact
    with earth; cleaning the eye with water removes the eye’s evil and the memory
    of birth, death, good and bad actions, and their affinities.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vayu, bile, and phlegm in proper condition produce health, while their disturbance
    generates diseases.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A proper quantity of bile enables knowing; alteration of bile changes a person
    and makes him act like a madman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bile is identified with agni, and agni influenced by karma is said to be kindled
    by vayu.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Agni is described as having three bodies, three seeds or progeny, three cities,
    three dhatus, and threefold kinds of agni; Vaisvanara is described as bodiless.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Agni is subdivided into Jnanagni, Darsanagni, and Koshthagni, associated respectively
    with mind, senses or eye, and digestion.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Dakshinagni is placed in the heart, Garhapatya in the belly, and Ahavaniya
    in the face.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the body-sacrifice, Purusha is the sacrificer, buddhi is his wife, contentment
    is the vow, mind and sense organs are sacrificial vessels, organs of action are
    instruments, devas are priests, and true individuality is the master of the sacrifice.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The body is the sacrificial place; the skull is the fire-pit; hairs are kusa
    grass; the mouth is the raised platform; passion is clarified butter; lifespan
    is the period of sacrifice; forms of sound and speech correspond to Vedic recitations;
    life, strength, and bile are sacrificial creatures; and death is the concluding
    bath.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The fires blaze in this sacrifice, the devas bless the sacrificer according
    to worldly desires, all living beings are sacrificers, and the body is said to
    be for yajna, from yajna, and changed according to yajna.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: If the yajna is continued in a changed or abused direction, it leads to an
    ocean of misery.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The body is enumerated as having sixteen side-teeth, fifteen openings, ninety-six
    digits of measure, fourteen nadi seats, 108 joints, and many tube-seats and nadis,
    with ida, pingala, sushumna, puritati, and jivata specially named.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Food is divided into urine, faeces, and sara; sara spreads through the body,
    and semen and blood are produced from food and drink.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Vayu moving as prana is called Sutratma; through it one breathes and moves,
    and without it no limb functions.
  category: relationship
  evidence_refs:
  - ev:10
