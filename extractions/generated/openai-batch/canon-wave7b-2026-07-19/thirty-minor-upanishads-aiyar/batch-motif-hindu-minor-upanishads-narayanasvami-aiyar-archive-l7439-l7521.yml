canonical_text:
  quote: |-
    Om  is  Brahman.  Know  that  the  mantra  of  the  one-syllabled
    Om  is  Pranava.
  summary: Narada asks Parameshthi, identified as Brahma, for instruction about the
    Pranava that lifts one out of samsara. Brahma teaches that Omkara is Brahman,
    classifies Pranava through several sets of forms, matras, and components, and
    describes Om as the indestructible Atma that confers salvation. The teaching then
    connects realization of Parabrahman with the fourfold Atma and its states or feet,
    including Visva/Vaisvanara, Taijasa/Hiranyagarbha, and the dreamless-sleep state.
  language: English
  quote_policy: quoted
