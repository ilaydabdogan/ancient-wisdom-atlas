  summary: The passage teaches that pains, passions, bondage, time, the worlds, embodied
    and mental principles, elements, sense qualities, states of consciousness, divine
    groups, dual pairs, and non-wisdom are products of manas. It concludes that what
    is sankalpa has no reality and that the world, guru, disciple, and related distinctions
    do not exist.
