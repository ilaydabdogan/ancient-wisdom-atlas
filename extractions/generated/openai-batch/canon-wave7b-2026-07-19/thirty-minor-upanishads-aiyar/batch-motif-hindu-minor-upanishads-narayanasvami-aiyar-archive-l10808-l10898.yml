canonical_text:
  quote: ''
  summary: The passage describes meditative perception of nested spheres of fire,
    sun, moon, and Brahmanic light; three forms of sight associated with lunar phases;
    visionary lights seen through practice; hearing the Pranava through breath control
    and shanmukhi; freedom from karma through the inner sun of consciousness; union
    with Brahman beyond sound and time; and a symbolic reinterpretation of puja actions
    as inner contemplative states.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A vast partless universe beyond Nada, Bindu, and Kala is described with nested
    spheres of agni, the sun, the nectary moon, and partless Brahma-tejas.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three kinds of sight are named ama, pratipat, and purnima, corresponding to
    closed, half-opened, and fully opened eyes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The practice of purnima sight is directed toward the tip of the nose; a deep
    darkness is then seen at the root of the palate, followed by an endless sphere
    of light identified as Brahman, Sachchidananda.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the mind is naturally absorbed in bliss, S'ambhavi occurs and is called
    Khechari; practicing it is said to give firmness of mind and vayu.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'A sequence of visionary signs is listed: star, dazzling diamond, full moon
    sphere, nine-gem brightness, midday sun sphere, and flame of fire.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In a later stage, lights or lustres of crystal, smoke, bindu, nada, kala,
    star, firefly, lamp, eye, gold, and nine gems are seen and identified as the form
    of Pranava.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The practitioner unites Prana and Apana, holds the breath in kumbhaka, fixes
    concentration at the tip of the nose, performs shanmukhi with the fingers, and
    hears the sound of Pranava, in which manas becomes absorbed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The knower is described as having no karma to perform because the sun of Chit
    in the heart does not rise or set.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: By rising above day and night through the annihilation of sound and time,
    the practitioner becomes one with Brahman and attains unmani and amanaska states.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Puja actions such as invocation, posture, water offerings, bathing, sandal,
    rice, flower, incense, lamp, food offering, circumambulation, prostration, praise,
    and dismissal are redefined as inner states of meditation, wisdom, consciousness,
    and serenity.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
