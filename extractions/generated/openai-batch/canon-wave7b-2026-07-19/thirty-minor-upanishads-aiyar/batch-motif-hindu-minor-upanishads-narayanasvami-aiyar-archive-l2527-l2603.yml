canonical_text:
  quote: Bondage is through non-inquiry and moksha through inquiry.
  summary: The passage describes Virat, Sutratma, and a being coupled with avyakta
    entering microcosmic bodies under Is'vara's orders and taking the states Vis'va,
    Taijasa, and Prajna. It explains the five avasthas of waking, dream, deep sleep,
    trance, and death; the Jiva's agency, enjoyment, karmic travel, death, and rebirth;
    and the emergence of desire for emancipation after many births, leading through
    service to a Guru and inquiry into Atma to moksha and recognition of Brahman as
    non-different from Pratyagatma.
  language: English
  quote_policy: quoted
