canonical_text:
  quote: ''
  summary: 'The passage gives rules and ideals for the paramahamsa and other ascetics:
    limited residence, wandering, meditation, non-attachment, equal vision, conduct
    without identifying signs, the rejection of bodily attachment, and preliminary
    rites before sannyasa as taught by Brahma in response to Narada.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A paramahamsa sannyasin without dualities, following pure sattva and seeing
    all equally, is identified as Narayana Himself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ascetic is instructed to limit residence in villages, towns, hamlets,
    cities, and other places, with longer residence permitted in winter.
  category: action
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: The passage states that staying in a village for two days can cause desires
    and make the ascetic fit for hell.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The ascetic should live like a harmless worm on the earth, with controlled
    mind, no settled residence, and at the end of a village where there are no persons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ascetic should roam with one cloth or no cloth, one vision of Brahman,
    no desire for objects, no condemnation of the wise, meditation, and eyes cast
    toward the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The ascetic should not roam at night, midday, or the twilight periods in empty,
    difficult, or creature-harming places.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The ascetic should regard all creatures as Self and dwell on earth like the
    blind, hunchbacked, deaf, insane, and dumb.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'Bathing rules differ by ascetic type: bahudaka and forester bathe thrice
    daily, hamsa once, and paramahamsa not at all.'
  category: other
  evidence_refs:
  - ev:3
- id: obs:9
  text: 'For the one-staff ascetic, seven things are ordained: silence, yoga-posture,
    yoga, endurance, solitariness, desirelessness, and equal vision over all.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Because bathing is not prescribed for the paramahamsa, he should abandon the
    modifications of the mind; the body is described as a collection of skin, flesh,
    blood, nerves, fat, marrow, bone, offal, urine, and phlegm.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage condemns ignorant attachment to the body and sexualized bodily
    desire as delusion, using imagery of impurity, hell, and being dead while alive.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The wise muni is described as without identifying signs, without mine-making
    and fear, quiescent, nondual, eating leaves, and meditating with a loincloth or
    no cloth.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that signs of ascetic identity are useless for moksha and
    that knowledge alone is the cause of salvation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The learned person should roam incognito without caste or order of life; angels
    become fond of him, and the Vedas are said to teach that the sign of non-identification
    is Kaivalya.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Narada asks the Grandfather about the rules of sannyasa, and Brahma replies
    that penance and eight sraddhas should be performed before atura or regular sannyasa.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: In the prescribed sraddhas, two brahmanas are to be fed in lieu of named divine
    and sage categories.
  category: action
  evidence_refs:
  - ev:8
