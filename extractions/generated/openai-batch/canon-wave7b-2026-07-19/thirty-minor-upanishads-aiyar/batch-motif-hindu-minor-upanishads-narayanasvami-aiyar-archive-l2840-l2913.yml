canonical_text:
  quote: ''
  summary: The passage describes the unborn One, Narayana, as dwelling in the cave
    of the heart and pervading elemental and mental principles. It then gives instructions
    for meditation on Brahman, abandonment of egoic identification, dissolution of
    the individual self into the supreme self, vigilance against Maya, and liberation
    through nirvikalpa samadhi.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The One Aja, described as unborn, is located in the cave of the heart within
    the body.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Earth, waters, Agni, Vayu, Akas, manas, buddhi, ahankara, chitta, avyakta,
    akshara, and mrtyu are each described as His body and as pervaded by Him without
    knowing Him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage identifies the inner soul of all creatures and purifier of sins
    as the one divine Lord Narayana.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The wise are instructed to practice deep meditation on Brahman and abandon
    recurring ideas of "I" and "mine" in the body and senses.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: One who knows himself as Pratyagatma, the witness of buddhi and its actions,
    is instructed to think "So'ham" and leave off false attribution of self.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A yogin who remains in his own Atma is said to have his mind perish after
    knowing his Atma as the Atma of all through inference, Vedas, and self-experience.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The practitioner is instructed to avoid sleep, worldly talk, and sounds, to
    think of Atma as the supreme Atma, and to shun the thought of the body.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:8
  text: Jiva-Atma is to be dissolved into Paramatma, compared to the ether of a jar
    dissolving into universal ether.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The practitioner is instructed to give up the macrocosm and microcosm like
    an impure vessel, merge the body-rooted conception of "I" into Chidatma, remove
    separateness, and become Kevala.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The universe is described as appearing in Brahman like a town in a mirror,
    and the self-effulgent One freed from ahankara is compared to a spotless moon
    becoming full after eclipse.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:11
  text: The passage gives a sequence in which extinction of actions leads to extinction
    of chitta, decay of vasanas, moksha, and Jivanmukti.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Looking upon everything in all places and times as Brahman is said to destroy
    vasanas, while carelessness in Brahmanishtha is called death by knowers of Brahman.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: Maya is said to envelop even the wise if they are careless, compared to moss
    returning to its position in a tank.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: One who attains Kaivalya during life becomes Kevala after bodily death, and
