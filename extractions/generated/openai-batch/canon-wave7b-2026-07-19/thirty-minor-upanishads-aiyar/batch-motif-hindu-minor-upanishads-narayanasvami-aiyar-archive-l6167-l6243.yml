canonical_text:
  quote: ''
  summary: Narada asks Brahma who is fit to take sannyasa. Brahma answers with eligibility
    rules, lists categories unfit for regular sannyasa and mahavakya initiation, distinguishes
    regular and atura-sannyasa, requires mantra-recitation for valid karma, prescribes
    water-sacrifice for an agnihotra householder leaving home, and describes vairagya,
    celibacy, knowledge, one staff, abandonment of thread and tuft, and alms-food
    as features of proper renunciation.
  language: English
  quote_policy: summarized
