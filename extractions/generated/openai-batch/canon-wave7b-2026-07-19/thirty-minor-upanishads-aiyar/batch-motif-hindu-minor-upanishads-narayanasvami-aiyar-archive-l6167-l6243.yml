  text: Narada addresses Brahma and asks who may take sannyasa after attaining its
    qualifications.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brahma says he will first expound qualifications for sannyasa and then state
    its rules.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Brahma lists several categories as unfit for sannyasa and unfit for initiation
    into the mahavakyas, even if they have attained vairagya.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Paramahamsa sannyasin is identified as the qualified person for sannyasa.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A parivrat is described as one who is not afraid of others and whom others
    do not fear.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: A further list of persons is described as unfit for regular sannyasa but fit
    only for atura-sannyasa.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Atura is defined as the time when prana, or life, is about to rise out of
    the body; another time is said not to confer the path of salvation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In atura-sannyasa, the wise are instructed to initiate themselves according
    to rules by reciting mantras repeatedly, and the mantras are said not to differ
    from those of regular sannyasa.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Karma is said to require mantras; action without mantra is compared to an
    offering made in ashes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: One who maintains agnihotra and leaves home for foreign places through indifference
    is instructed to perform the prajapatya sacrifice in water and then take sannyasa.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The wise man is instructed to complete karmic observances in water through
    the mind or through mantra-recitation; otherwise he becomes fallen.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: When indifference to all objects arises, people should desire sannyasa; one
    with vairagya should take sannyasa, and one without it should remain at home.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A twice-born person with desire who takes sannyasa is said to reach hell.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A celibate Brahmana who controls his tongue, sexual organ, stomach, and hand
    may become a sannyasin without undergoing marriage.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Some become sannyasins after knowing samsara as without essence and desiring
    to know the essence of God through supreme vairagya.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: Pravrtti is associated with the performance of karma, while nivrtti is associated
    with jnana.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: When the reality of eternal Parabrahman is understood, the aspirant is instructed
    to take one staff and abandon the holy thread and tuft of hair.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: After this transition, the aspirant is described as fit to eat alms-food,
    devoted to Paramatma, indifferent to what is not Paramatma, and free from desires.
  category: attribute
  evidence_refs:
  - ev:10
