  summary: The passage gives yogic instructions for dharana, dhyana, samadhi, bandhas,
    mudras, inversion, vajroli, amaroli, and rajayoga. It describes emancipation,
    absorption in Parabrahman, siddhis, voluntary transformations, conquest of time,
    immortality through nectar, a vision of Vishnu, and reversals of kinship across
    births.
