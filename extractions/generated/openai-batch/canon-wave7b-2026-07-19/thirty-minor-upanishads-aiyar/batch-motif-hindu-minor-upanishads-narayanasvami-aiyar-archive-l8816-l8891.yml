literal_observations:
- id: obs:1
  text: The practitioner is instructed to practise dharana for six ghatikas, restrain
    breath in the region of akas, and contemplate a wish-granting deity in saguna
    dhyana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nirguna dhyana is said to lead to samadhi, and restraining breath is said
    to make the wise one emancipated.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Samadhi is defined as the state in which jivatma, the lower self, and Paramatma,
    the higher self, are without difference.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the yogin desires to lay aside the body, he can become absorbed in Parabrahman
    without requiring utkranti.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the yogin keeps the body, he is said to live in all worlds with siddhis,
    become a deva, man, or yaksha by will, and take animal forms such as lion, tiger,
    elephant, or horse.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage gives bodily and breath instructions for mahabandha and mahavedha,
