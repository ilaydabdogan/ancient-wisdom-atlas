canonical_text:
  quote: The moon moves in Ida and the sun in Pingala.
  summary: The passage maps subtle bodily channels, vital airs, and digestive processes.
    It describes Sushumna, Ida, Pingala, other nadis, kundalini, the movement and
    functions of prana and other vayus, the action of internal fire and water in digestion,
    and the qualifications for beginning nadi purification.
  language: English
  quote_policy: quoted
