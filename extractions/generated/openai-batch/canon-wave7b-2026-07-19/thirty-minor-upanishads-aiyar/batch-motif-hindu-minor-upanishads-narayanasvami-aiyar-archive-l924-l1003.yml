canonical_text:
  quote: It is Manas that is the root of the tree of Samsara with its thousands of
    shoots, branches, tender leaves and fruits.
  summary: The passage teaches that destruction of Chitta or Manas has two forms connected
    with Jivanmukta and Videhamukta. It presents Manas and Sankalpa as the root of
    Samsara, prescribes quiescence, spiritual knowledge, association with the wise,
    abandonment of Vasanas, control of pranas, Dhyana, Kumbhaka, and Samadhi, and
    defines Vasana as clinging to objects through intense thought.
  language: English
  quote_policy: quoted
