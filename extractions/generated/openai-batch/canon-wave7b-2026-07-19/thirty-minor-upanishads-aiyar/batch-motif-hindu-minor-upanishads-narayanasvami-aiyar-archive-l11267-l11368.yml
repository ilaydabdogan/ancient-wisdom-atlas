canonical_text:
  quote: ''
  summary: The passage uses the rope-serpent illusion to explain ignorance and the
    disappearance of false world-perception through knowledge. It then gives yogic
    instructions for listening to internal sound through the right ear, describes
    a sequence from loud to subtle sounds, and states that concentrated attention
    on nada absorbs and controls the mind. It culminates in the cessation of sound,
    the unmani state beyond mind, and absorption in the soundless Parabrahman/Paramatma.
  language: English
  quote_policy: summarized
