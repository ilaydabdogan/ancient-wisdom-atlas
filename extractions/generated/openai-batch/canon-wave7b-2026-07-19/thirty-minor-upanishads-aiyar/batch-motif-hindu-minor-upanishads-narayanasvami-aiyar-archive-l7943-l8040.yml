canonical_text:
  quote: ''
  summary: Instructional passage on selecting a sacred grove or monastery for yoga
    practice, beginning with worship, practicing breath control through Ida and Pingala,
    visualizing lunar nectar and inner fire, purifying the nadis, meditating on Pranava
    and the letters A-U-M with goddess forms, and continuing alternate-nostril practice
    to clear Sushumna.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The instructed practitioner is told to go to a sacred grove rich in fruits,
    roots, and water, or alternatively to build a monastery in a temple, by a river,
    in a village, or in a town.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chosen place is described as pleasant, filled with natural abundance,
    resounding with Vedic chanting, and frequented by knowers of Brahman.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The monastery is to be beautiful, not too long or high, with a small door,
    smeared with cow-dung, and protected physically and by mantras.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The practitioner listens to Vedanta, worships Vinayaka, salutes the tutelary
    deity, sits on a soft seat facing east or north, and keeps head and neck erect.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The practitioner fixes his gaze on the tip of the nose, sees the sphere of
    the moon between the eyebrows, and drinks nectar flowing through the eyes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The practitioner inhales through Ida, contemplates a flaming sphere of fire
    in the belly with the seed ra, exhales through Pingala, and then reverses the
    direction.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The repeated practice is prescribed for twenty-eight months, six times per
    sitting during the three sandhyas and intervals.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:11
- id: obs:8
  text: The passage states that this practice purifies the nadis, makes the body light
    and bright, increases the gastric fire, and manifests internal sound.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Pranayama is defined as the union of Prana and Apana and as having expiration,
    inspiration, and cessation; Pranava is also identified with Pranayama.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Gayatri is visualized as a red-complexioned girl on a hamsa with a mace and
    is called the visible symbol of the letter A.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Savitri is visualized as a white young woman with a disk riding on a garuda
    and is called the visible symbol of the letter U.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sarasvap, as printed in the passage, is visualized as an aged black woman
    riding on a bull with a trident and is called the visible symbol of the letter
    M.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The single letter Pranava is described as the supreme light and the origin
    or source of A, U, and M.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The practitioner meditates on A while inhaling through Ida for sixteen matras,
    on U while retaining the breath for sixty-four matras, and on M while exhaling
    for thirty-two matras.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: A further practice for clearing Sushumna has the yogin sit in padmasana, inhale
    through one nostril, retain the breath, and exhale through the other in alternating
    order.
  category: action
  evidence_refs:
  - ev:9
