  summary: The passage ranks modes of contemplation, criticizes pilgrimage and external
    worship, contrasts ignorance with self-cognition, praises an ascetic's internal
    nondual meditation and heart-worship, describes relinquishing subject-object distinctions,
    and then presents first-person declarations identifying the self with Brahman,
    the source, the pure, the supreme, and what is beyond duality and contemplation.
