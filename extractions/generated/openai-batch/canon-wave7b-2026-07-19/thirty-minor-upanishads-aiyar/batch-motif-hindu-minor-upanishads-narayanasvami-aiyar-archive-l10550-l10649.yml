canonical_text:
  quote: ''
  summary: The passage gives yogic instructions for pranayama, kumbhaka, vayu, internal
    piercing of seats and granthis, Pranava pronunciation, and four yogic states,
    then states the purifying fruits of reciting the Upanishad and begins the Mandalabrahmana-Upanishad
    with Yajnavalkya approaching the sun's world to ask about Atma-tattva.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A calm, undistracted practitioner is instructed to practise pranayama and
    to cognise the Principle that is the cause of objects and their attributes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Expiration, inspiration, and restraint of breath are interpreted as giving
    out external objects, taking in scriptural spiritual knowledge, and keeping that
    knowledge to oneself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kumbhaka is said to raise, fill, and master the mind; Paramasiva is said to
    be within it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The practitioner checks the course of vayu, plants both hands and both feet
    on the ground, pierces four seats through vayu, and shakes Mahameru.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says the union of moon, sun, and agni should be known on account
    of nectar, and that the motion of Meru causes the devatas in its centre to move.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The practitioner pierces Brahma-granthi, Vishnu-granthi, and Rudra-granthi,
    after which piercing comes through liberation from delusion, ceremonies from various
    births, grace of gurus and devatas, and yoga practice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the mandala of Sushumna between Ida and Pingala, vayu is to be made to
    rise through Mudra-bandha.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'Short, long, and pluta pronunciations of Pranava are assigned different effects
    and destinations: bindu, brahmarandhra, and dvadasanta.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Pranava is said to remove obstacles and sins, and mantras are to be uttered
    for mantra siddhis.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: 'Four bhumikas are named: arambha, ghata, parichaya, and nishpatti; nishpatti
    includes creation and dissolution through Atma or effortless yoga by a jivanmukta.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: Whoever recites the Upanishad is said to become immaculate like agni, pure
    like vayu, freed from specified sins, and a jivanmukta.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: A wise man is said to see the supreme seat of Vishnu, and brahmanas with spiritual
    eyes open praise and illuminate that seat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Yajnavalkya goes to Adityaloka, salutes the Purusha of the sun, and asks him
    to describe Atma-tattva.
  category: action
  evidence_refs:
  - ev:5
