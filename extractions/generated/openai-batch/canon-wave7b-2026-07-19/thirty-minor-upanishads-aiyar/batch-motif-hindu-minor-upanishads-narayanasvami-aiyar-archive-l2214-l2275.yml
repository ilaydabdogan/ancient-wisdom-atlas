canonical_text:
  quote: ''
  summary: A first-person speaker declares knowledge of the secondless Atma and identification
    with non-dual Brahman. The passage uses analogies of rope and serpent, sugar in
    juice, ocean and waves, nectar and poison, sun and pot, owl and sun, clouds, and
    lamp light to describe the universe as appearance through ignorance, the self
    as blissful and changeless, and wisdom as dispelling ignorance. It ends by saying
    that one who recites the Atmabodha-Upanishad for a muhurta is not born again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says it cognizes the secondless Atma by discriminative wisdom
    and reason, while a relation between bondage and salvation is still found.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The universe is said to be gone for the speaker yet to shine as true; Brahman
    alone is described as the substratum on which the universe plays.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker compares itself to sugar permeating sugar-juice and says it is
    full in the three worlds in the form of non-dual Brahman.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: All beings, from Brahma down to a worm, are said to be fashioned in the speaker
    like bubbles and waves in the ocean.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker says it has no longing for sensual happiness and, after cognizing
    Atma, rejects what is not-Atma as an intelligent person rejects poison.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sakshi or witness that illuminates the body is said not to be destroyed
    with the body, as the sun is not destroyed when a pot is destroyed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker says there is no bondage, salvation, books, or Guru for it, because
    these shine through Maya and the speaker has crossed them and is secondless.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Vital airs and mind may fluctuate, but pains are said not to affect the speaker,
    who is by nature full of Bliss; the speaker says ignorance and egoism of actorship
    have left it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Duties, family, clan, name, beauty, and class are assigned to the gross body,
    while inertness, love, and joy are assigned to the causal body, not to the eternal
    changeless speaker.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A fool or embodied person full of Ajfiana is compared to an owl seeing darkness
    in the sun or to someone thinking there is no sun when clouds screen eyesight.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Lamp light dispelling darkness is used to state that even slight wisdom makes
    immense Ajfiana perish.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The delusion of the serpent is said not to exist in the rope in past, present,
    or future; similarly, the universe from Ahankara down to body is said not to exist
    in the non-dual One.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Whoever recites the Atmabodha-Upanishad for a muhurta is said not to be born
    again.
  category: action
  evidence_refs:
  - ev:8
