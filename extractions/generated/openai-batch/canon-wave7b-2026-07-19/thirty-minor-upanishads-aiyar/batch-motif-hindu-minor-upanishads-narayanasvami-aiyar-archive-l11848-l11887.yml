canonical_text:
  quote: ''
  summary: Chapter III gives the Melanamantra syllables, frames Brahma as speaking
    to S'ankara, and instructs a practitioner to abandon passion for objects, seek
    Niranjana, coordinate manas and S'akti, understand bindu, sushumna, vayu, and
    the six chakras, draw vayu upward into the sukha-mandala, and attain unity with
    brahmanda and the nectar of equality through samadhi.
  language: English
  quote_policy: summarized
