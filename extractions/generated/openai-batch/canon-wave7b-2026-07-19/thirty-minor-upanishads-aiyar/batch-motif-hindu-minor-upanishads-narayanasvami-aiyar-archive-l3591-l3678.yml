canonical_text:
  quote: ''
  summary: An unnamed speaker gives repeated formulas in which whatever disappears
    into a body part, faculty, deity, state, or other named term becomes that same
    term and attains a deathless, fearless, sorrowless, endless, seedless condition.
    The passage then says that one who knows this seedless state becomes seedless,
    is not born or killed, and that Atma is attained by devoted worship and disciplined
    inward concentration, culminating in seeing Atma and becoming one with the Atma
    of all.
  language: English
  quote_policy: summarized
