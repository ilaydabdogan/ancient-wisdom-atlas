canonical_text:
  quote: ''
  summary: Narada, a roaming ascetic, enters the forest of Naimisha after roaming
    all worlds. Rshis led by Shaunaka honor him and ask for the means of salvation.
    Narada describes a disciplined sequence of study, life stages, renunciation, and
    final emancipation through contemplation of Reality. When asked for the rules
    of sannyasa, he takes the Rshis to Satyaloka and asks Brahma to teach the secret
    rules of real asceticism.
  language: English
  quote_policy: summarized
