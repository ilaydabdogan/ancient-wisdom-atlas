canonical_text:
  quote: ''
  summary: 'The passage teaches that one who has attained knowledge and detachment
    has salvation in the Self. It identifies the same Atma under different names in
    waking, dreaming, and dreamless sleep, locates the states in bodily centers, and
    treats turya as indestructible. It then gives ascetic instructions: renounce desire
    for this world and higher worlds, avoid irrelevant studies and ostentatious observances,
    use knowledge as the true staff, live with minimal possessions, take alms under
    restrictions, and maintain self-restraint. It warns that a staff-bearing ascetic
    without knowledge goes to Maharaurava hells.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that observance of any other leads one to the world of
    that other, while for one who has attained knowledge-detachment, salvation is
    in the Self.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same Atma is named Vis'va in waking, Taijasa in dreaming, and Prajna in
    dreamless sleep.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The presiding agent is associated with the eyes in waking, the throat in dreaming,
    the heart in dreamless sleep, and the head in the fourth state, turya.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: One who knows turya as indestructible is instructed not to hear or see in
    waking as if in dreamless sleep; such a one is called Jivanmukta.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ascetic is instructed to have no desire for this world or a higher world
    and not to pursue books and practices foreign to the realization of Reality.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The ascetic is told to give up all, have a mental staff, use the hand as a
    vessel, have the quarters as cloth, wander like a lad, idiot, or ghost, and desire
    neither life nor death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says salvation is not obtained merely by taking a staff, shaving
    the head, disguise, or ostentatious observance; knowledge is called the true staff
    of an ekadandi.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: An ascetic who has only a wooden staff without knowledge and eats indiscriminately
    is said to go to the terrible hells called Maharaurava.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Food and cloth are to come unasked through others' will, and a man who meditates
    on the Self in dream as in waking is called foremost among Brahmavadins.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ascetic is instructed neither to grieve over what is not obtained nor
    rejoice over what is obtained, to keep the organs unattached, and to avoid being
    bound by gains received with much respect.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: For alms, the ascetic may go after the household fire is extinguished and
    all have eaten; he should use only the hand as an alms-bowl, may eat standing
    or sitting, and may sip water while eating.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Pure-minded persons are compared to the ocean in not overstepping limits,
    great ones to the sun in self-restraint, and a muni who eats with the mouth like
    a cow is said to become equal-visioned toward all beings.
  category: relationship
  evidence_refs:
  - ev:9
