canonical_text:
  quote: ''
  summary: The passage describes the all-pervading, secondless Atma as the soul of
    all and the source of the appearance of multiplicity. It teaches that meditative
    practice using Atma and Pranava as arani fire-sticks reveals the concealed deity
    in buddhi. It gives similes of hidden substances within substances, compares jiva
    to a spider moving out and back along threads, maps jiva to bodily locations during
    waking, dream, deep sleep, and turya, interprets Sandhya as union of Pratyagatma
    and Paramatma, and states that Brahmavidya reveals the all-pervading Atma and
    the unity of everything in essence.
  language: English
  quote_policy: summarized
