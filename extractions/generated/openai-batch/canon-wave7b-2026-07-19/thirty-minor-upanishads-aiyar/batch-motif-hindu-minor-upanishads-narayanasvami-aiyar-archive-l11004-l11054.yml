canonical_text:
  quote: '"This amanaska is a great secret."'
  summary: Yajnavalkya asks the Purusha in the sphere of the sun to explain amanaska
    again. The Purusha describes amanaska as a secret yogic state or path associated
    with Paramatma, Sambhavi-mudra, transcendence of dualities, destruction of senses
    and manas, absorption in Paramatma, taraka-yoga initiation through identity sentences,
    attainment of kaivalya, and direct understanding granted to the pupil.
  language: English
  quote_policy: quoted
