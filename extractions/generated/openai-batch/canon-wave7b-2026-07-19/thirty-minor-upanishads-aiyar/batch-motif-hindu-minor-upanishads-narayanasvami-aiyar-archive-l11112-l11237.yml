canonical_text:
  quote: ''
  summary: The passage explains Om as a Hamsa or bird whose syllabic parts, qualities,
    body parts, and lokas are mapped onto a vertical cosmic anatomy. It then gives
    meditative and post-mortem outcomes for concentration on Om's matras and kalas,
    culminating in Parabrahman, yogic absorption, freedom from karma, and supreme
    bliss.
  language: English
  quote_policy: summarized
