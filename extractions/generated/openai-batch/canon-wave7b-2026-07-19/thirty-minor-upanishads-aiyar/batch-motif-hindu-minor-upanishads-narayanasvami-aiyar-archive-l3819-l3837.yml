canonical_text:
  quote: ''
  summary: In a question-and-answer passage, Raikva asks the Lord what Vijnana-ghana
    burns when it goes out. The reply lists vital forces, elements, states of consciousness,
    worlds, moral categories, cosmic principles, and death as burned; death becomes
    one with the great Lord, beyond whom being and non-being are denied. The passage
    closes by calling this an exposition of Nirvana and the Vedas.
