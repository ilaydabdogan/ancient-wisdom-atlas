  quote: ''
  summary: A first-person speaker identifies with Sachchidananda, the higher Self,
    Siva, Absolute Consciousness, Sat and Chit, light, and Purushottama, while denying
    limitation by definition, measurement, organs, body, time, place, bondage, truth
    and untruth, or travel. The passage concludes that one who realizes himself thus
    is the speaker, and that whoever hears this once becomes Brahman.
