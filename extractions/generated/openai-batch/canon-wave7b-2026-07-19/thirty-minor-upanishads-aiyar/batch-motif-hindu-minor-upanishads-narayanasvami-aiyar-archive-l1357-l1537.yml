canonical_text:
  quote: '"Here there is no manyness in the least degree: all this is verily Brahman."'
  summary: A question-and-answer passage defines Iswara, Jiva, Prakriti, Paramatma,
    deity and being classes, caste, karma, knowledge, ignorance, happiness, pain,
    heaven, hell, bondage, and begins the question on Moksha. It repeatedly identifies
    apparent plurality with Brahman and treats bondage and ignorance as products of
    false attribution and thought.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Iswara is defined as Brahman which, through the power called Prakriti, creates
    the worlds, remains latent in them, and becomes ruler of intellect, senses, organs,
    Brahma, and others.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jiva is defined as Iswara under the false superimposition of the idea "I am
    the gross," taking names and forms and appearing as many Jivas through different
    karmas that originate bodies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Prakriti is defined as the Sakti or potency of Brahman, able to produce many
    varied worlds by the mere presence of Brahman.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Paramatma is defined as Brahman alone, superior to bodies and other things.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage identifies Brahman with Brahma, Vishnu, Rudra, Indra, Yama, Sun,
