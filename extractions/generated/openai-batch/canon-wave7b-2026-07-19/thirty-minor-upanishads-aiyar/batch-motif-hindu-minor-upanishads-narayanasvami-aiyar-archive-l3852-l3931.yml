canonical_text:
  quote: ''
  summary: The passage opens the Tejobindu Upanishad with instruction on supreme meditation
    upon tejo-bindu, described as the Atma of the universe seated in the heart and
    associated with Siva. It gives qualities of the disciplined practitioner, describes
    Hamsa and a subtle supreme seat of Vishnu in apophatic terms, identifies the supreme
    Brahman as beyond ordinary states and categories, and lists yoga practices interpreted
    through the cognition that all is Brahman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage instructs that supreme meditation should be upon tejo-bindu, described
    as the Atma of the universe, seated in the heart, atom-sized, pertaining to Siva,
    quiescent, gross, subtle, and beyond such qualities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The object of meditation is described as full of pains, difficult to meditate
    on, difficult to perceive, emancipated, decayless, and difficult to attain.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A qualified person is described as moderate in food, controlling anger, giving
    up love of society, subduing passions, overcoming pairs such as heat and cold,
    giving up egoism, and neither blessing nor taking from others.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hamsa is said to have three seats, and the seat is described as a great mystery,
    subtle, of the form of Soma, and the supreme seat of Vishnu.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The seat is described as having three faces, three gunas, and three dhatus,
    while also being formless, motionless, changeless, sizeless, supportless, and
    beyond speech and mind.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The indestructible seat is described as reachable only by being, beyond mind,
    difficult to perceive, emancipated, changeless, and to be meditated upon as liberated,
    eternal, permanent, and indestructible.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage identifies the object as Brahman, adhyatma, and the highest seat
    of Vishnu, and describes it as inconceivable, of the nature of Chidatma, above
    akas, void and non-void, beyond the void, and abiding in the heart.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that in this reality there is neither meditation, meditator,
    meditated, nor non-meditated, and that it is not the universe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Munis are said to realize the supreme One, while the Devas are said not to
    know it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Avarice, delusion, fear, pride, passion, anger, sin, heat, cold, hunger, thirst,
