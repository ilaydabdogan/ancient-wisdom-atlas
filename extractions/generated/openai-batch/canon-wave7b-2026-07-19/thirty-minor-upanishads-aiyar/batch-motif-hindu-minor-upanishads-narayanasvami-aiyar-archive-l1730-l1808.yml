canonical_text:
  quote: ''
  summary: Maitreya goes to Kailas and asks for initiation into the highest Tattwa.
    Mahadeva replies with teachings that internalize worship, purification, alms,
    solitude, and sannyasa through nondual knowledge, dispassion, and the union of
    the lower and higher Self.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lord Maitreya goes to Kailas, reaches it, and asks the Lord to initiate him
    into the mysteries of the highest Tattwa.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mahadeva replies that the body is a temple and that the Jiva in it is S'iva
    alone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage defines wisdom as cognition of everything as non-different from
    oneself, meditation as abstracting the mind from sensual objects, bathing as purifying
    the mind, and purification as subjugating the sensual organs.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The instructed practitioner is told to drink the nectar of Brahman, beg food
    to maintain the body, hold one thought, and live in a solitary place without a
    second.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The body is described as born from father and mother, impure, impermanent,
    disease-prone, a house of sins, and having foul matter issuing from nine holes.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: External bathing with water and earth is contrasted with real purification
    through release from 'I and mine' and through the earth and water of Jnana and
    Vairagya.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The conception of Advaita is to be taken as Bhiksha, while the conception
    of Dvaita is not to be taken in.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: A learned Sannyasi is instructed to abandon his native place and is described
    through metaphors of giving up ego, wealth, delusion, and desire as family relations
    or household ties.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The consciousness of the sun is said to shine continually in the heart's Akas
    without rising or setting, so the passage questions the need for Sandhya observance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Sannyasa is defined as the union of Jiva-Atma and Parama-Atma at the two Sandhis,
    and eligibility for it is tied to dispassion toward desires and the body.
  category: relationship
  evidence_refs:
  - ev:9
