canonical_text:
  quote: ''
  summary: The passage identifies Mouna or silence with the ineffable “That”/Brahman,
    beyond speech and mind. It describes a lonely seat pervading the universe, defines
    yogic terms such as asana, siddhasana, mulabandha, vision, and pranayama through
    meditation on or cognition of Brahman, and instructs absorption in uniform Brahman
    and vision of the world as full of Brahman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mouna, or silence, is described as a state in which speech returns with mind
    without reaching “That”; Yogins are fit to attain it, and ignorant people are
    told to worship it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage asks how “That” can be spoken of or described as the universe
    when speech returns and no word describes it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Silence is identified as what is really called “That”; children are said to
    have silence with latent words, while knowers of Brahman have silence without
    words.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: "“That” is called the lonely seat, where there is no man in the beginning,
    middle, or end, and through which the universe is fully pervaded."
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The illusion of Brahma and all other beings is said to take place within one
    twinkling of His eye.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Asana is defined as a posture in which one has easy, fatigue-free, uninterrupted
    meditation on Brahman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kala, or time, is described as endless bliss and secondless, while everything
    else is called the destroyer of happiness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Siddhasana is described as the posture in which siddhas have succeeded in
