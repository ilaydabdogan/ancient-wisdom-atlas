  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A person who has known that the parts of yoga point to one and the same Brahman
    should be absorbed in that equal or uniform Brahman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: If equality is attained, the passage compares the resulting straightness or
