canonical_text:
  quote: ''
  summary: The passage describes Atma as imperishable, worshipful, nondual, and present
    within mental functions and all else. It then identifies Narayana with sense faculties,
    objects, actions, deities, ritual elements, social relations, time, directions,
    and cosmic processes. It says the wise see and praise the supreme seat or abode
    of Vishnu. The next section begins by locating the eternal unborn one in the cave
    of the heart, with earth and waters as his body.
  language: English
  quote_policy: summarized
