canonical_text:
  quote: ''
  summary: Nidagha asks Lord Rbhu for instruction on rules for Yoga. The reply describes
    the body as composed of five elements or mandalas, explains breath and elemental
    diminution, names the upward movement of life-breath Udyana, discusses Uddiyanabandha
    and cautions for practice, lists yogic methods and their eight aids, enumerates
    yamas, niyamas, and postures, explains pranayama, and maps subtle-body locations
    including Muladhara, kanda, nadi-chakra, Sushumna, Brahmarandhra, and Kundali.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nidagha asks Lord Rbhu to enlighten him about rules to be observed in Yoga
    practice, and the Lord begins an instructional reply.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The body is said to be composed of five elements and filled with five mandalas:
    Prthivi/earth as hardness, Apas as liquidity, Tejas/fire as brightness, Vayu as
    motion, and Akas as pervasive space.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Vayu-mandala in the body is said to cause 21,600 breaths every day and
    night.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Diminution of the elemental essences is linked to bodily changes: folds in
    the body, greying hair, loss of hunger and lustre, incessant tremor, and death.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the elements diminish and Prana has no resting place in the body, it
    rises upward like birds flying in the air; this is called Udyana.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A bandha called Uddiyanabandha is connected with arresting the upward flight
    and is described as doing away with death as a lion does with an elephant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The text warns that agitation of Agni in the belly causes much pain and says
    Uddiyanabandha should not be practiced by one who is hungry or urgently needs
    to urinate or defecate.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The practitioner is instructed to eat proper and moderate food many times
    in small quantities.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Mantrayoga, Layayoga, and Hathayoga are to be practiced through mild, middling,
    and transcendental methods respectively, and each has eight aids: yama, niyama,
    asana, pranayama, pratyahara, dharana, dhyana, and samadhi.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Yama is enumerated in ten forms, including non-injury, truth, non-coveting,
    continence, compassion, straightforwardness, patience, courage, moderate eating,
    and purity.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Niyama is enumerated in ten forms, including austerity, contentment, belief
    in God or the Vedas, charity, worship of Isvara, hearing religious exposition,
    modesty, good intellect, japa, and vrata.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'Eleven postures are named: chakra, padma, kurma, mayura, kukkuta, vira, svastika,
    bhadra, simha, mukta, and gomukha; the chakra posture is described by placing
    each ankle on the opposite thigh while keeping the body erect.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Pranayama is to be practiced repeatedly in the order of inspiration, restraint
    of breath, and expiration, and it is performed through the nadis.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The body of every sentient being is said to be ninety-six digits long, with
    the bodily center or Muladhara located above the anus and below the sexual organ.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: A kanda of nadis is located above the genitals, described as oval, four digits
    high and four digits broad, surrounded by fat, flesh, bone, and blood.
  category: object
  evidence_refs:
  - ev:7
- id: obs:16
  text: Within the kanda is a nadi-chakra or wheel of nerves with twelve spokes.
  category: object
  evidence_refs:
  - ev:7
- id: obs:17
  text: Kundali, said to support the body, is located there and covers the Brahmarandhra
    of Sushumna with its face.
  category: relationship
  evidence_refs:
  - ev:7
