canonical_text:
  quote: ''
  summary: The passage redefines upavasa as the union or nearness of jivatma and Paramatma
    rather than bodily fasting, distinguishes indirect knowledge of Brahman from direct
    realization of identity with Brahman, instructs Rbhu to abandon possessiveness
    and thought, and teaches meditation on the Supreme within the heart. It describes
    the universe as arising through sankalpa, all as Chit, jiva and Isvara as evolved
    from Chidakas, maya as rejected at universal deluge, and salvation as dependent
    on discerning the secondless Brahman rather than debating jiva and Isvara.
  language: English
  quote_policy: summarized
