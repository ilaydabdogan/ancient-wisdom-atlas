canonical_text:
  quote: ''
  summary: The passage presents dialogues in which Brhaspati and Bharadvaja ask Yajnavalkya
    about Kurukshetra, Avimukta, Taraka, and mantras. Yajnavalkya identifies Avimukta
    with Kurukshetra, says Rudra initiates the departing life-breath into Taraka Brahman
    there, defines Taraka as Om-Namo-Narayanaya, explains Om and its eight subtle
    components, maps those components to divine and heroic forms, and gives salutation
    mantras to Paramatma/Narayana.
  language: English
  quote_policy: summarized
