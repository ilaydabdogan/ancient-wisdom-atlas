canonical_text:
  quote: ''
  summary: The passage classifies six kinds of sannyasins, gives their clothing, marks,
    alms practices, and renunciant rules, describes abandonment of possessions at
    sannyasa, prescribes silence and non-action, and assigns different postmortem
    worlds or Kaivalya according to ascetic class and death-moment contemplation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage names six classes of sannyasins: kutichaka, bahudaka, hamsa,
    paramahamsa, turiyatita, and avadhuta.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The kutichaka is described with a tuft of hair, holy thread, staff, bowl,
    loin-cloth, tattered cloth, worship of mother, father, and teacher, mantra utterance,
    fixed-place eating, a white vertical sect mark, and a staff.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bahudaka is described as like the kutichaka in wearing a tuft, tattered
    cloth, and marks, but as eating eight morsels of alms-food.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hamsa is described as wearing matted hair, three vertical sect marks,
    and only a bare loin-cloth, and as eating alms-food without a morsel limit.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The paramahamsa is described as lacking tuft and holy thread, begging from
    five houses in one day, having one loin-cloth and one red cloth, wearing sacred
    ashes, and having given up all.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The turiyatita is described as eating fruits with the mouth like cows, or
    begging food from three houses, and as a naked man whose bodily actions are quiescent
    like a dead body.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The avadhuta is described as without rules, taking food according to the course
    of the boa constrictor, avoiding food from ill-reputed persons and outcastes,
    and being engaged in realization of the Real.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:15
- id: obs:8
  text: If an atura-sannyasin remains alive after taking sannyasa, he is instructed
    to take up regular sannyasa.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: For the three classes from paramahamsa upward, the passage states that they
    have no waist-cord, loin-cloth, cloth, bowl, or staff, may get food from all castes,
    and should be as nature made them.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: At the time of sannyasa, the Vedas are to be recited until the mind is cleared,
    after which the waist-cord, loin-cloth, staff, cloth, bowl, and similar items
    are cast aside in water and the ascetic roams.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The ascetic is instructed to be without even a slight tattered cloth and not
    to utter anything other than Pranava, talk, or hear.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage forbids the ascetic to study logic or grammar, to talk many words,
    to converse with people through the vocal organ, or to talk in another language
    than Sanskrit.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage states that the ascetic has no worship of God, no witnessing of
    festivals, and should be free from pilgrimage.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: 'The later rule list assigns alms patterns to the classes: one house for kutichaka,
    eight morsels in eight houses for bahudaka, no limit for hamsa, the hand as vessel
    in five houses for paramahamsa, fruits eaten with the mouth like cows for turiyatita,
    and boa-constrictor-like food taking in all castes for avadhuta.'
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The ascetic is instructed not to dwell many days in one place, not to make
    prostrations, not to cross a river by swimming with the hands, not to climb a
    tree, not to enter a carriage, and not to purchase, sell, exchange, or show ostentation.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: The passage states that there is nothing for the ascetic to do, that doing
    something will make him perish, and that reflection is the only thing for which
    he is qualified.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: The passage assigns bhurloka and bhuvarloka to aturas and kutichakas, svargaloka
    to bahudakas, tapoloka to hamsas, satyaloka to paramahamsas, and Kaivalya in Atma
    to turiyatita and avadhuta.
  category: relationship
  evidence_refs:
  - ev:13
  - ev:14
- id: obs:18
  text: The passage states that whatever form one thinks of at the last death moment
    before leaving the body is attained by that person and no other.
  category: speech
  evidence_refs:
  - ev:14
