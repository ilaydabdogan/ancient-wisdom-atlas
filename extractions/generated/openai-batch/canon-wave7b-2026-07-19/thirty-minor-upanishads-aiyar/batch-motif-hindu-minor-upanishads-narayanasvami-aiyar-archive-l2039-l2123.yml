  text: 'Mind is described as having two kinds: pure and impure; association with
    desire marks the impure mind, and absence of desire marks the pure mind.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mind is said to be the cause of bondage or emancipation for human beings,
    depending on whether it is attracted to sense objects.
