canonical_text:
  quote: ''
  summary: The passage teaches that mind may be pure or impure, that desire binds
    while desirelessness leads to emancipation, and that controlled meditation on
    Atma/Brahman brings realization. It uses analogies of moon in water, ether in
    a pot, milk, ghee, churning, and fire from wood to describe the one self, knowledge,
    and self-realization. It concludes with declarations of identity with Brahman
    and Vasudeva.
  language: English
  quote_policy: summarized
