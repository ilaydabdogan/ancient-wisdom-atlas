canonical_text:
  quote: ''
  summary: The passage states that the Subala-Bija-Brahma-Upanishad should not be
    given or taught to persons lacking self-control, proper discipleship under a Guru,
    known family and conduct, and other qualifications. It should be taught to one
    with supreme devotion to the Lord and equal devotion to the Guru; then the truths
    shine in that person’s great soul. The passage closes by identifying this as an
    exposition of Nirvana and of the Vedas.
