canonical_text:
  quote: ''
  summary: The passage gives yogic instructions for kumbhaka and the three bandhas,
    describes the upward movement of apana and prana through sushumna, the heating
    of agni, the awakening of the sleeping kundalini in serpent-like form, and lists
    diseases and ten obstacles to yoga that the practitioner should abandon.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A form of kumbhaka called bhastri is said to free diseases of the throat,
    increase gastric fire, enable knowledge of kundalini, remove sins, destroy phlegm
    obstructing the mouth of brahmanadi or sushumna, and pierce three granthis or
    knots.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage names three bandhas: mulabandha, uddiyana, and jalandhara.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mulabandha is described as forcing the downward-tending apana breath upward.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When apana is raised to the sphere of agni, the flame of agni grows, is blown
    by vayu, and agni and apana mingle with prana in a heated state.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The fiery heat in the body rouses the sleeping kundalini, which hisses, becomes
    erect like a serpent, and enters the hole of brahmanadi or sushumna.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Uddiyana is performed at the end of kumbhaka and beginning of expiration;
    in it, prana goes up sushumna, and the practitioner uses a posture and bodily
    pressure to upbear a thread or nadi from the abdomen to the heart and neck.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Jalandhara is described as contraction of the neck, with the chin touching
    the breast, impeding the upward passage of vayu while prana goes through brahmanadi
    on the western tana.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage gives an increasing daily count for kumbhaka practice and says
    it should later be performed with the three bandhas, increasing by five each day.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Diseases are said to arise from behaviors such as daytime sleep, night vigils,
    excess sexual intercourse, crowds, retention of urine and faeces, unwholesome
    food, and laborious mental operation with prana; fearfully blaming yoga practice
    for disease and discontinuing it is called the first obstacle to yoga.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'The passage lists additional obstacles: doubt, carelessness, laziness, sleep,
    not leaving sense objects, erroneous perception, sensual objects, want of faith,
    and failure to attain the truth of yoga.'
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: A wise man is instructed to abandon the ten obstacles, perform pranayama daily
    with the mind fixed on Truth, and thereby have chitta and prana absorbed in sushumna,
    becoming a true yogin.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
