canonical_text:
  quote: ''
  summary: 'The passage instructs an ascetic to abandon attachment to body, kin, and
    native place; live without fixed residence, often alone; meditate on Brahma-Pranava
    and Atma; pursue vairagya, jnana, Jivanmukti, and Kaivalya. It then lists graded
    practices for six classes of ascetics: kutichaka, bahudaka, hamsa, paramahamsa,
    turyatita, and avadhuta, including baths, sect-marks, shaving, food-taking, clothing,
    worship, mantra, Pranava, and contemplative disciplines.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ascetic is instructed to slight his body like a carcass and live away
    from son, relations, and native place like a thief released from prison.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ascetic is told to take whatever comes without effort, meditate on Brahma-Pranava,
    be freed from karmas, burn up passions, and transcend the three gunas and human
    infirmities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The ascetic is assigned a pattern of temporary residence in village, town,
    sacred place, and sacred waters, and is also instructed to have no settled residence
    and dwell alone in mountain caves without falsehood.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage discourages ascetics from joining in groups, saying that three
    make a village and four make a city.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The ascetic is instructed to cultivate vairagya through jnana, know that there
    is none other than the Self, attain Jivanmukti, see Reality everywhere, and remain
    in Realization until the body falls.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'Six ascetic classes are distinguished by different baths: water baths of
    varying frequency, a mental bath, a holy-ashes bath, and wind as bath.'
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ascetic classes are distinguished by sect-marks and shaving rules, including
    vertical, horizontal, combined, holy-ashes, spot, or no sect-mark.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The classes are assigned different food-taking practices, including food in
    one place, alms, the hand as vessel, the mouth as a cow, and the boa constrictor-like
    action of taking whatever comes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The classes are assigned different clothing rules, ranging from two cloths
    to one cloth, a piece of cloth, nakedness or loin-cloth, or being as nature made
    them; deer-skin is prescribed only for hamsa and paramahamsa.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Worship and discipline vary by class: divine image worship, mental worship,
    identification with Brahman, mantras and japas, dhyana, initiation in sacred Vedic
    sentences, and different forms of Pranava practice are assigned to different classes.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: All the ascetic classes must meditate upon Atma; the aspirant after salvation
    should utter the Pranava that enables one to cross samsara and should seek Kaivalya.
  category: action
  evidence_refs:
  - ev:7
