canonical_text:
  quote: ''
  summary: The passage frames the Brahmopanishad as teaching the nature of Atma. S'aunaka
    asks Pippalada how the divine faculties are located and operate in the body-city.
    Pippalada teaches that prana, identified with Atma, exercises the power, that
    Brahman rules in the body, and uses spider, eagle, and deep-sleep examples to
    describe the relation of prana, the senses, and return to Brahman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The introductory note says the Upanishad is intended to give a clear idea
    of Atma, described as having four states of consciousness and four seats, for
    nirguna dhyana.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: S'aunaka Mahas'ala questions the holy sage Pippalada about how vak and other
    deities are located and function in the Brahmapura of the body, and about the
    owner and nature of their power.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pippalada considers the question and imparts Brahmavidya to S'aunaka.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pippalada identifies the power as prana, glossed as Atma, and says Atma is
    the life of all Devas and also their death and life.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Brahman is described as pure, nishkala, resplendent, all-pervading, shining
    in the divine Brahmapura of the body, and ruling all.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Jiva, when identifying with the indriyas, is said to rule them like a
    spider.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The spider is described as throwing out a web from a single thread from its
    body and drawing the web back into itself by the same thread.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Prana is said to draw after it the objects of its creation whenever it goes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: During sushupti, prana is said to go to its seat, Brahman, through the nadis,
    like an eagle using air to reach its abode.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Devadatta is given as an example of one who, during sushupti, does not move
    even when beaten with a stick; the passage adds that the actor does not suffer
    or enjoy.
  category: action
  evidence_refs:
  - ev:8
