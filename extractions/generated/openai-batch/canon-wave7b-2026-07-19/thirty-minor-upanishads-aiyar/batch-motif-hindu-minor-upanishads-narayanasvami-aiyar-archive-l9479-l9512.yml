canonical_text:
  quote: ''
  summary: The passage instructs the wise person who has studied scripture and known
    Brahman to abandon the scriptures, ascend the car of Om with Vishnu as charioteer
    toward Brahmaloka while worshipping Rudra, then abandon the car and attain a subtler
    state. It defines pratyahara through an image of sense objects and mind as reins
    of Atma, lists six parts of yoga, and describes purification by breath control
    and concentration. Footnotes gloss Nada, linga, pada, and tarka.
  language: English
  quote_policy: summarized
