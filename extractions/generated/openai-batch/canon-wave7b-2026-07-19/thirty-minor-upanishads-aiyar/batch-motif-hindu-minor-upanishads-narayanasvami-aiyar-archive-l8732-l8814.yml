canonical_text:
  quote: ''
  summary: The passage instructs the yogin to conceal yogic powers, continue practice
    without distraction, remember the guru’s words, and progress from the ghata state
    to the parichaya state. It describes breath and mind entering the Sushumna through
    Kundalini and then maps five elemental regions onto the body. For each region,
    a seed letter, shape, color, deity for contemplation, duration of dharana, and
    resulting mastery or protection are given. The final ether practice grants levitation,
    bliss, bodily strength, and freedom from death even during Brahma’s deluge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A yogin who constantly practices yoga attains the power to levitate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wise yogin is instructed to regard powers as obstacles to yoga, not delight
    in them, and not exercise them before others.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The yogin is told to live outwardly like a fool, idiot, or deaf man in order
    to keep powers concealed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Disciples are said to request displays of powers for the gratification of
    their own desires.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage instructs the practitioner to practice day and night, avoid useless
    company, and not forget the words of the guru.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Constant yoga practice is said to move the practitioner from the ghata state
    to the parichaya state.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: Breath, together with agni, is said to pierce Kundalini through thought, enter
    Sushumna uninterrupted, and reach a high seat with chitta and prana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage lists five elements and assigns a fivefold dharana to the body
    made of those five elements.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The earth region extends from feet to knees, is four-sided, yellow, and associated
    with the letter La; contemplation of golden four-faced Brahma there for two hours
    grants mastery over earth and protection from death through the earth element.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The water region extends from knees to anus, is semi-lunar, white, and associated
    with the letter Va; contemplation of Narayana there for two hours frees the practitioner
    from sins and removes fear or death in water.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The fire region extends from anus to heart, is triangular, red, and associated
    with the letter Ra; contemplation of Rudra there for two hours prevents burning
    even if the body enters a fire-pit.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The air region extends from heart to the middle of the eyebrows, is hexangular,
    black, and associated with the letter Ya; contemplation of omniscient Isvara there
    for two hours leads the yogin into vayu and akas and removes death through fear
    of vayu.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: The ether region extends from the center of the eyebrows to the top of the
    head, is circular, smoky, and associated with the letter Ha.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: Sadasiva is described for the ether contemplation as crystal-like, crescent-bearing,
    five-faced, ten-headed, three-eyed, armed, ornamented, joined with Uma in one
    half of his body, favor-granting, and the cause of all causes.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Practicing dharana in the ether region is said to grant levitation in ether,
    supreme bliss wherever the yogin stays, bodily strength, freedom from knowing
    death, and survival even during Brahma’s deluge.
  category: sequence
  evidence_refs:
  - ev:9
