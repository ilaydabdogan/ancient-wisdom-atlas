canonical_text:
  quote: ''
  summary: The passage gives yogic instructions on breath retention, samyama, pratyahara,
    and dharana. It describes bodily loci and mental fixations that produce freedom
    from disease, destruction of sins, knowledge of worlds, knowledge of past and
    future, knowledge of beings and minds, perception of siddhas, and other siddhis.
    It also maps body parts to deity-worlds, directions, and fourteen lokas/talas,
    then defines pratyahara and dharana through sense withdrawal, ordered bodily concentration,
    heart-space, and the five elements.
  language: English
  quote_policy: summarized
