  quote: different from It there is nothing. None, none but It ; It is I.
  summary: Kumara asks Siva to explain Chinmatra, the partless non-dual essence. Siva
    replies by identifying that essence with the visible world, existence, Self, mantra,
    action, spiritual wisdom, water, earth, sacred texts, deities, Atma, Guru, sacrifice,
    body, mind, happiness, and all relations, concluding that nothing is different
    from it.
