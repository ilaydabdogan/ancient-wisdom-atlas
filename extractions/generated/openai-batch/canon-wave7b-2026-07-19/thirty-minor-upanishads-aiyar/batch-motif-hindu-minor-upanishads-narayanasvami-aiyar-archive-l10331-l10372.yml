canonical_text:
  quote: ''
  summary: The passage distinguishes two paths to emancipation, the S'uka or bird's
    path and the Vamadeva or ant's path. The S'uka path is associated with immediate
    emancipation after the body falls away and with direct cognition of Atma through
    Vedic inquiry and samadhi. The Vamadeva path is associated with repeated rebirth,
    yoga over many lives, and gradual attainment of the supreme seat of Vishnu. The
    passage also states that one who sees all as the one Brahman has no delusion or
    sorrow, and that beings seen by Brahmavits are freed from sins of many births.
  language: English
  quote_policy: summarized
