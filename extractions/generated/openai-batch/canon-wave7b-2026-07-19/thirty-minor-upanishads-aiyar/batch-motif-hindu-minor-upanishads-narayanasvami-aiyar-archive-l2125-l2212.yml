canonical_text:
  quote: ''
  summary: The passage invokes Narayana and Om, states that mantra-recitation and
    meditation lead to Vaikuntha, the heart-lotus, nondual fearlessness, and ascent
    to a deathless Supreme Swarga, then gives first-person declarations identifying
    the self with wisdom, bliss, Atma, Sat, light, and secondless purity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening offers prostrations to Narayana, described as wearing conch, discus,
    and mace, and says a Yogi is released from rebirth through utterance of the Pranava
    Om composed of A, U, and M.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The reciter of the mantra “Om-namo-Narayanaya” is said to reach Vaikuntha,
    identified with the heart-lotus and the city of Brahman, shining like lightning
    and a lamp.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage identifies Brahmanya with the son of Devaki, Madhusudana, Pundarikaksha,
    Vishnu, and Achyuta.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person who meditates on the sole Narayana latent in all beings is said to
    become free from pains, move from duality to fearless nonduality, while one who
    sees manifoldness passes from death to death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Brahman is placed in the center of the heart-lotus and is described as the
    All, having Prajna as eye and established in Prajnana; Prajnana alone is called
    Brahman.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The meditating person leaves the world through Prajnana and the Atma, ascends,
    and attains desires in a deathless Supreme Swarga; the speaker prays for placement
    in a nectar-everflowing world where light always shines.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A first-person voice declares itself without Maya, without Ahankara, without
    the difference of universe, Jiva, and Iswara, and of the nature of vast all-full
    wisdom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The first-person voice declares itself witness, desireless, without motion,
    old age, or destruction, and a mere ocean of bliss called salvation.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The first-person voice declares itself subtle, changeless, Atma, beyond the
    three Gunas, the cause of many worlds in its stomach, Kutastha-Chaitanya, and
    of the form of Jyotis.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The first-person voice declares itself full, stainless salvation, Sat, true
    wisdom without limit, undifferentiated, all-pervading, fit to be known through
    Vedanta, fit to be worshipped, and the heart of all worlds.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The first-person voice declares itself pure, secondless, eternal, free from
    the three bodies, emancipated, latent in all, equal Atma, Supreme Truth, and Wisdom-Bliss.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: A note relates Prajna and Prajnana terminology to the Mandukya Upanishad,
    describing Prajna as the Jiva in the third state and Prajnana as special wisdom.
  category: other
  evidence_refs:
  - ev:7
