canonical_text:
  quote: ''
  summary: Narada asks Brahma to explain the practice associated with the wasp-and-worm
    analogy. Brahma instructs an ascetic in truthful speech, knowledge, detachment,
    mastery of the organs and states, repeated affirmation of identity with Brahman,
    abandonment of identification with the body, progression through waking, dreaming,
    dreamless sleep, turya, and turyatita, and contemplation of the jiva’s positions
    in the heart and the one witnessing Lord beyond qualities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Narada addresses Brahma and asks what practice was meant by the previously
    mentioned analogy of the wasp and the worm.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brahma replies that an ascetic should live with true speech, jnana-vairagya,
    and the body alone as the remaining possession.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The instruction maps jnana, vairagya, mental control, bodily control, manas,
    buddhi, tattvas, avasthas, and other categories onto body parts or bodily structures.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The waking, dreaming, dreamless sleeping, and turya states, together with
    fourteen organs, are compared to a pillar planted in mud.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The person who masters these through buddhi is compared to a boatman with
    a boat in mire and to an elephant-driver with an elephant under control.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The practitioner is instructed to regard all besides Self as illusory and
    destructible and to utter, “I am Brahman alone.”
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The practitioner is instructed to move from waking, dreaming, and dreamless
    sleeping to turya and then to turyatita.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage lists functions of fourteen organs, including eyes, ears, tongue,
    nose, vocal organ, hand, leg, anus, sexual organ, skin, buddhi, chitta, and ahankara,
    and says all these should be abandoned.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Identification with the body is compared to identification with a house; through
    it, the jiva thinks the body is itself.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The jiva is said to dwell in the body, and its position in different petals
    or parts of the heart corresponds to inclinations such as virtuous action, sleep,
    cruelty, sinful action, sport, travel, peace of mind, jnana, vairagya, and Atma-deliberation.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage enumerates waking, dreaming, dreamless sleeping, turya, and turyatita
    as avasthas or states, with turyatita described as not being the first four.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: One Lord, described as witness and without qualities, is said to appear as
    many through differences of Visva, Taijasa, Prajna, and Tatastha and to preside
    over gross, subtle, and causal states.
  category: relationship
  evidence_refs:
  - ev:7
