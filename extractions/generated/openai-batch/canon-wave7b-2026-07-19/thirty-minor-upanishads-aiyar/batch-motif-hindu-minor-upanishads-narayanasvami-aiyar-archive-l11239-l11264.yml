  quote: ''
  summary: The passage teaches that prarabdha karma remains after knowledge of the
    Self but is not felt after knowledge of truth, because the body and other things
    are unreal like dream objects after waking. It says former-birth karma does not
    affect the knower of truth because there is no rebirth for such a person. It compares
    the present body to the untrue dream body and begins a material-cause analogy
    involving clay and pot, with an editorial note defining tattvajnana and atmajnana.
