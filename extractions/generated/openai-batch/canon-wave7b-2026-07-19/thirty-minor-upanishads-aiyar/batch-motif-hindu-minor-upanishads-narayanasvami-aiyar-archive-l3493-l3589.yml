  quote: ''
  summary: Raikva asks the Lord in whom everything disappears or merges. The Lord
    answers with repeated sequences in which whatever disappears in a faculty, perceptible
    domain, deity or cosmic term, vital breath, knowledge, bliss, or turya becomes
    that same term and attains a state described as deathless, fearless, sorrowless,
    endless, and seedless.
