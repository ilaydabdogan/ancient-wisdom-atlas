  quote: ''
  summary: 'The passage classifies religious mendicants seeking moksha into four kinds:
    Kutichaka, Bahudaka, Hamsa, and Paramahamsa. It describes their food limits, ritual
    objects and attire, residence rules, practices of yoga and contemplation, non-dual
    perception, alms-taking, dwelling places, and the Paramahamsa departure from the
    body after advancement on the path of Brahman.'
