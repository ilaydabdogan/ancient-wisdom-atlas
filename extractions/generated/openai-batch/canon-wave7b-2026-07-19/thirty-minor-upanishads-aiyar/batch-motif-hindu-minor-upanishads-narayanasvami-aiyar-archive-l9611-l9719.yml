canonical_text:
  quote: ''
  summary: 'The passage first gives bodily locations and colors of the five pranas
    and states that a man whose breath exits through the head after piercing a mandala
    is not reborn. It then opens the Varaha-Upanishad: the sage Rbhu performs penance
    for twelve divine years; the Lord appears in boar form and offers a boon; Rbhu
    asks for Brahman-knowledge concerning the Lord''s nature. The boar-shaped Lord
    enumerates tattvas in groups of twenty-four, thirty-six, and ninety-six, and concludes
    that devotion to the boar-form beyond the tattvas releases ignorance and that
    knowledge of the ninety-six tattvas leads to salvation.'
  language: English
  quote_policy: summarized
