canonical_text:
  quote: ''
  summary: Paingala asks Yajnavalkya to explain the Vedic sacred sentences. Yajnavalkya
    defines the identity of Tat and Tvam, describes hearing, reflection, meditation,
    and samadhi, and links these practices to the destruction of karma and liberation.
    He then describes cosmic and embodied involution, in which elements, worlds, bodies,
    and conditioned states are absorbed into higher causes and ultimately into Paramatma.
    The passage concludes with instructions to meditate on Atma through images of
    light, sun, and lamp.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Paingala asks Yajnavalkya to give an exposition on the mahavakyas, the sacred
    sentences of the Vedas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yajnavalkya replies by naming sentences including Tattvamasi, Tvamadasi, Tvambrahmasi,
    and Ahambrahmasmi, and says one should scrutinise them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The word Tat is explained as denoting the cause of the universe, while Tvam
    is connected with the basis of the notion of I; the passage identifies their ultimate
    meaning as undifferentiated Brahman freed from Maya and Avidya.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sravana, manana, nididhyasana, and samadhi are presented as a sequence of
    inquiry, reflection, one-pointed concentration, and meditative absorption.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Samadhi is compared to a lamp in a place without wind, where the mind gives
    up the difference between meditator and meditation and takes the form of the meditated.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Modifications pertaining to Atma arise after samadhi; they cannot be directly
    known but are inferred through memory of the samadhi state.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: Myriads of karmas from the beginningless cycle of rebirths are said to be
    annihilated through the modifications pertaining to Atma.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Through proficiency in practice, a current of nectar is said to rain down
    in diverse ways, and knowers of Yoga call this samadhi dharma-megha, a cloud.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: When good and bad accumulated karmas are destroyed, the sacred sentences bring
    the practitioner face to face with the ultimate Reality, and he becomes a Jivanmukta.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Isvara wishes to produce involution in the fivefold differentiated elements
    and draws Brahma's egg and its worlds back into their cause.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'The passage describes a sequence of merging: earth into water, water into
    fire, fire into air, air into ether, ether into ahankara, ahankara into mahat,
    mahat into avyakta, and avyakta into Purusha.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Virat, Hiranyagarbha, and Isvara are said to be freed from the vehicle of
    Maya and absorbed into Paramatma.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: The gross body is said to merge into a subtle state, then a causal state,
    and finally into Kutastha-Pratyagatma.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Visva, Taijasa, and Prajna, after the extinction of their upadhi of avidya,
    are absorbed in Pratyagatma.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: The sphere of the universe is described as being burnt up by the fire of jnana
