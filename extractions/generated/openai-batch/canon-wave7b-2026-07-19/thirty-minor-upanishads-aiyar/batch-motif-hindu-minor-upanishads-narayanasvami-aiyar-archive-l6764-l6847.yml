canonical_text:
  quote: ''
  summary: A passage on sannyasa first gives a brief injunction for a consecrated
    renouncer to take up ritual items and remain firm in the observances of his order.
    In the following Upades'a V, Narada questions the Grandfather/Brahma about how
    sannyasa can be liberating from karma while still involving observances. Brahma
    replies by describing states of embodied life, the observances connected with
    karma, knowledge, and dispassion, and several classifications of renunciation.
    The passage defines types of sannyasin and concludes with a description of proper
    renunciation grounded in the conviction that created things are perishable and
    that all Atmas are not other than Brahman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After first uttering a mantra, the practitioner is instructed to take up a
    waist-cord, loin-cloth, and cloth, with achamana or sipping of water preceding
    it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The consecrated practitioner, associated with yoga, is instructed to think
    that he has done what should be done and to remain firm in the observances of
    his order of life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Narada asks the Grandfather how sannyasa can be called liberating from all
    karmas while the sannyasin is still said to observe his asrama.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Grandfather replies that the embodied jiva has waking, dreaming, dreamless
    sleep, and turya, and that Purushas subject to these states follow observances
    related to karma, jnana, and vairagya.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Narada asks about differences among orders of sannyasa and differences among
    their observances.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Brahma assents to Narada's question and states that sannyasa is truly one
    but is divided into named forms because of ajnana, inability, and non-performance
    of karmas.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage names vairagya-sannyasa, jnana-sannyasa, jnanavairagya-sannyasa,
    and karma-sannyasa as divisions of sannyasa and defines each by conditions of
    dispassion, knowledge, realization, or regular progression through life orders.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: A second classification names vidvat-sannyasa, jnana-sannyasa, vividisha-sannyasa,
    and karma-sannyasa, and further divides karma-sannyasa into causal and non-causal
    forms.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Atura-sannyasa is described as causal renunciation associated with approaching
    death, disease, or defective karmas, while regular renunciation is described as
    non-causal and undertaken when the body is strong.
  category: relationship
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: The non-causal renouncer is described as convinced that all created things
    are subject to destruction and that body and other things should be given up.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage describes all Atmas as present in many cosmic and earthly locations
    and forms, and states that they are no other than Brahman.
  category: relationship
  evidence_refs:
  - ev:10
