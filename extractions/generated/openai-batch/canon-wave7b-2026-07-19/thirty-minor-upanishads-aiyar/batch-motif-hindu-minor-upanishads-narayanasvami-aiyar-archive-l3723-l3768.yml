canonical_text:
  quote: ''
  summary: Raikva asks the Lord about the seat of Atma and how it leaves the body
    and pervades the universe. The answer describes a heart-lotus containing an ocean,
    a bird, and four nadis with different destinations or effects. One nadi leads
    through successive sheaths and cosmic principles until death becomes one with
    the supreme God, described as Nirvana. A following section says food came from
    Narayana, was cooked through several cosmic fires, became pure, and should be
    eaten only as allotted without begging.
  language: English
  quote_policy: summarized
