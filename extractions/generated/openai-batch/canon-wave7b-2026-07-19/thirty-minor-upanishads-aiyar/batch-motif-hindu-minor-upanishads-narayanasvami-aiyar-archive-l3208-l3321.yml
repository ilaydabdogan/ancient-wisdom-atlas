canonical_text:
  quote: ''
  summary: The passage describes a lotus-like inner region in the heart with openings,
    vital breaths, and channels. Atma perceives different worlds and beings when associated
    with different vital functions, sleeps in subtle sheaths and the heart-space,
    and returns to waking. The next section maps bodily faculties, their objects,
    and presiding powers through the nadis, repeatedly identifying the indwelling
    Atma as worshipful and free from old age, death, fear, sorrow, and end.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The middle of the heart contains a red fleshy mass in which there is a dahara-lotus
    with many petals, ten openings, and pranas located there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Atma is united with different vital functions or channels, it sees cities
    with rivers, divine and semi-divine beings, celestial worlds, treasures, and what
    is seen or unseen, heard or unheard, eaten or uneaten, asat or Sat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that there are ten nadis; in each are seventy-one, and
    these become 72,000 branch nadis.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Atma sleeps in the nadis it produces sound; when it sleeps in the second
    sheath it sees this world and the higher world and knows all sounds; prana protects
    the body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The nadis are described as full of blood in green, blue, yellow, red, and
    white colors, and the hita nadis are compared to a hair divided into one thousand
    parts.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The divine Atma sleeps in the akas of the heart in the supreme sheath, where
    it has no desires, dreams, deva-worlds, sacrifices, parents, relatives, thieves,
    or Brahman-slayers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Atma's body is described as tejas and of the nature of nectar or the immortal,
    and is compared to a water-lotus in sport.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Atma returns to the waking state by the same way it previously entered the
    heart.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The nadis join one place or centre with another and bind bodily faculties,
    objects, and presiding powers, such as the eye, visible objects, and the sun.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage gives repeated correspondences for ear, nose, tongue, skin, speech,
    and hand with their objects and presiding powers, and says that Atma moves within
    these, the nadis, prana, vijnana, ananda, the heart-space, and all else.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
