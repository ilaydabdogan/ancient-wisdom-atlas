  quote: ''
  summary: The passage gives an embryological account of conception, sex determination,
    parental and circumstantial influences on offspring, twin and multiple embryo
    formation, and the ninth-month embodied being's cognition of the indestructible
    Omkara through wisdom and contemplation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage assigns s'ukla to men and s'onita to women, states that each is
    powerless by itself, and says a child is born from their combination.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a son is born when the father's seed predominates,
    a daughter when the mother's seed predominates, and a eunuch when both are equal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage attributes a greater number of female births to females having
    more passion and deriving more pleasure from sexual union.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage says action corresponds to the actor's mental state and that the
    child takes after the parents' thought.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says parents with anxious minds at the time of union produce children
    described as blind, lame, hunchbacked, dwarfed, or limbless, and that conception
    during solar or lunar eclipses produces children with defective limbs.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage says bodily increase, decrease, similarities, and dissimilarities
    in children arise through the influence of time, place, action, substance, and
    enjoyment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says that from well-conducted intercourse the child is born with
    the father's form and qualities, compared to an image in a glass reflecting its
    original.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage says that when s'ukla splits into two through interaction of the
    vayu of both s'ukla and s'onita, twins of the same sex are born; when both parents'
    seminal fluids split into two, mixed male and female progeny result.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says that among humans five embryos at one pregnancy is the maximum,
    one embryo is common, two occur in some cases, and three are very rare.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage links the frequency of pouring of seminal fluid within the womb
    with bodily outcomes, including more limbs, a dried or contracted child, and sometimes
    couples.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage describes the ninth-month body as made of the five elements and
    able to sense smell, taste, and other qualities through tejas and related elements.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says the ninth-month embodied being cognizes the indestructible
    Omkara through deep wisdom and contemplation.
  category: action
  evidence_refs:
  - ev:6
