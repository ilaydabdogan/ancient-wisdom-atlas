canonical_text:
  quote: ''
  summary: 'The passage describes emanations from a great Being or Atma: classes of
    beings, mountains, herbs, trees, Rudra, Vedic knowledge, sciences, and other beings
    arise from aspects of that Being. The Atma is identified as golden effulgent light
    into which the universe is absorbed. The Self is divided into two moieties producing
    woman and man, then assumes forms to create deities, sages, other beings, animals,
    and earth. At the end, the Being becomes Vaisvanara fire, burns all objects, and
    a sequence of elemental absorption begins.'
  language: English
  quote_policy: summarized
