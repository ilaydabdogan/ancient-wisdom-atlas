canonical_text:
  quote: ''
  summary: The passage describes advanced stages of realization culminating in non-dual
    contemplation, uses images of dream, dispersing cloud, sleep, space, an empty
    pot, and a filled vessel in the ocean, defines traits of a jivanmukta, identifies
    Siva with Guru, Vedas, Lord, self, and all, and names Suka and Vamadeva as muktas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Padarthabhavana is named as the sixth stage; after practice in five stages,
    one delights in Atma, has no conception of internals or externals, and acts only
    when impelled by others.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Turya is named as the seventh stage, in which one is fixed in contemplation
    of Atma alone without the difference of the universe.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the mind is fixed on the non-dual One and duality is put down, the universe
    is seen as a dream; the universe is also compared to an autumnal cloud that disperses
    and vanishes.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sushuptipada is named as the fifth stage; in it one remains in a non-dual
    state freed from differences. Practitioners of the sixth stage have introvision
    while participating in external actions and are seen like someone sleeping when
    fatigued.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The seventh stage is also called gudhasupti and is described as a secondless
    state without fear, with consciousness almost annihilated and without sat, asat,
    self, or not-self.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The state is compared to an empty pot in akasa, void within and without, and
    to a filled vessel in the midst of an ocean, full within and without.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage instructs the hearer not to become either knower or known, to
    become Reality after all thoughts are given up, to discard seer, sight, and seen,
    and to meditate on Atma as supreme Light.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A jivanmukta is described as participating in worldly concerns while not seeing
    the universe as existing, and as having a mind-light that neither sets nor rises
    in misery or happiness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A jivanmukta is described as awake in sushupti, as having wisdom free from
    affinities to objects, and as having a heart pure like akasa.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: A jivanmukta is described as lacking the conception of being the actor, as
    unattached to material objects, as not feared by people and not afraid of people,
    and as having given up joy, anger, and fear.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A jivanmukta is described as cool among illusory objects, full Atma, having
    eradicated desires, content with the Atma of all, resting in Chinmatra, and free
    from distinctions such as universe, I, he, and thou.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage instructs entry into Sat-Brahman through the path of guru and
    Sastras and states that Siva alone is Guru, Vedas, Lord, I, and all.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Suka and Vamadeva are named as muktas; a note identifies both as Rshis.
  category: attribute
  evidence_refs:
  - ev:8
