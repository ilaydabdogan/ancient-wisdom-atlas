canonical_text:
  quote: '"I am Brahman"'
  summary: The passage instructs a renunciant to regard the body as a carcass, abandon
    ritual distinctions and possessions, wander without fixed residence, live in desolate
    or natural places, discard ascetic implements in water, eat only what comes unasked,
    remain fixed in Atmic and Brahmic contemplation, utter the Brahma-Pranava, rise
    above the three bodies, and give up the body as a sannyasin who has completed
    his work.
  language: English
  quote_policy: quoted
literal_observations:
