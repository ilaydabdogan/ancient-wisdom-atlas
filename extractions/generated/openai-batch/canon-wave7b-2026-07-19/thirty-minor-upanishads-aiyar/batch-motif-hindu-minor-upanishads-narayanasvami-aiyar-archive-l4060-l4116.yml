canonical_text:
  quote: ''
  summary: The passage repeatedly identifies all bodies, worlds, elements, deities,
    times, concepts, relations, ritual acts, and states with Chinmatra, described
    as Absolute Consciousness and the partless non-dual essence. It concludes that
    one who perceives the homogeneous, all-pervading 'I' is emancipated through spiritual
    wisdom and becomes his own Guru.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed 'it' is identified with the body, head, internal and external,
    fullness, nectar, clan, house, moon, stars, sun, holy seat, virtues, witness,
    social relations, kingship, Om, japa, meditation, heart, Jyotis, heaven, and Self.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The partless and non-dual essence is to be regarded as Chinmatra, and Chinmatra
    is called Absolute Consciousness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The whole world, the states of speaker and addressee, space, earth, water,
    air, fire, Brahma, Vishnu, Sava, and all that exists or does not exist are said
    to be Chinmatra.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Past, present, future, substance, time, knowledge, knowable, knower, speech,
    Sat, Asat, beginning, and end are all said to be Chinmatra.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Guru and disciple, seer and seen, gross body, subtle body, causal body, I
