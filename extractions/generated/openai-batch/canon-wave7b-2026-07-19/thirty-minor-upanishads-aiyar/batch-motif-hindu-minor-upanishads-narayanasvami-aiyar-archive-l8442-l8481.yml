canonical_text:
  quote: ''
  summary: S'andilya asks Atharvan how the universe arises from, exists in, and is
    absorbed in Brahman as OM. Atharvan replies by describing Supreme Brahman as imperishable
    and actionless, then describes three aspects, the relation of Mahes'vara with
    maya, the Lord's will to become many, the arising of triadic sacred forms, the
    Lord's identity with all deities and beings, and the manifest form of Dattatreya
    with Sakti.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: S'andilya questions Atharvan about how the universe arose from Brahman as
    OM, how it exists in Brahman, and how it is absorbed in Brahman.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Atharvan describes Supreme Brahman as Truth, imperishable, and actionless.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'From formless Brahman, three forms or aspects arise: nishkala, sakala, and
    sakala-nishkala.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The nishkala aspect is described as satya, vijnana, ananda, actionless, without
    impurity, omnipresent, subtle, facing every direction, undefinable, and immortal.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mahes'vara is described as black and yellow and as ruling with avidya, mulaprakrti,
    or maya, which is red, white, black, and co-existent with him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Lord wills or desires to become many and to bring forth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: From the contemplating Person whose desires are fulfilled, three letters,
    three vyahrtis, the three-footed Gayatri, three Vedas, three devas, three varnas,
    and three fires spring up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Supreme Lord is described as all-pervading, situated in the hearts of
