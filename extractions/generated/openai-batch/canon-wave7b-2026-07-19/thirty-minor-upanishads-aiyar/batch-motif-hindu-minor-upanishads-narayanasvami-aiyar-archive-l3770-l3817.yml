  quote: '"mrtyu becomes one with the Supreme"'
  summary: The passage describes the conduct of a wise renunciant seeking Atma and
    Kaivalya, emphasizing solitude, childlike harmlessness, samadhi, fearlessness,
    and immovability under harm. It then presents chains of elements, sense qualities,
    faculties, and causes, culminating in death becoming one with the Supreme, beyond
    Sat, asat, and Sat-asat, as an exposition of Nirvana and the Vedas.
