canonical_text:
  quote: ''
  summary: 'Instructional passage on Raja-yogic and Vedantic liberation: the triad
    of knower, known, and knowledge is dispelled; samadhi is distinguished from dreamless
    sleep; the universe is described as mind-created and absorbed in witness-consciousness;
    the jiva turns from worldly action toward the return path, seeks a spiritual instructor,
    realizes Brahman in the heart, negates dual distinctions, meditates on the sun''s
    sphere, and identifies all with Atma.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the triputi are dispelled, the person is described as becoming kaivalya
    jyotis, beyond bhava and abhava, full and motionless, with comparisons to an ocean
    without tides and a lamp without wind.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage distinguishes sushupti from samadhi: in sushupti the mind is
    absorbed in tamas and is not a means of salvation, while in samadhi tamasic modifications
    are rooted out and the mind rises to the nature of the Partless.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The whole universe is said to be absorbed into Sakshi-Chaitanya, and the universe
    is described as a delusion or creation of the mind and unreal as something outside
    it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The knower of Brahman is said to become one with Brahman; when sankalpa perishes,
    mukti is said to be in hand.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The text lists five avasthas: waking, dreaming, dreamless sleeping, the fourth,
    and that beyond the fourth.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The jiva engaged in the waking state is attached to the pravrtti path, participates
    in hell as the fruit of sins, and desires heaven as the fruit of virtuous actions.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The same person becomes indifferent to action-bound births, pursues the nivrtti
    path for emancipation, and takes refuge in a spiritual instructor to cross mundane
    existence.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: After giving up passion, following instruction, and acquiring four sadhanas,
    the person attains the Reality of antarlakshya in the middle of the lotus of the
    heart and begins to recognize the bliss of Brahman associated with sushupti.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The person's discrimination is expressed as the realization of being the non-dual
    One, with prior identifications through waking, dreaming, and dreamless states
    named and then superseded.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The difference between 'I' and 'That' is expelled through the thought of being
    the pure, secondless Brahman; through meditation on the sun's sphere as shining
    with himself, the person becomes one with Parabrahman and ripe for salvation.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: A mind devoid of sankalpa and similar causes of bondage is described as fit
    for salvation; the person withdraws from the outer world, regards the world as
    Atma, abandons the conception of 'I', and thinks 'I am Brahman'.
  category: sequence
  evidence_refs:
  - ev:11
