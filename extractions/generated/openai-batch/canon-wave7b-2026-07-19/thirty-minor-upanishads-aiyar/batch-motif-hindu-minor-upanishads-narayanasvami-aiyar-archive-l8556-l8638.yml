canonical_text:
  quote: ''
  summary: The passage describes the embodied jiva as arising in a body made of five
    elements and subject to happiness, misery, and stains. It teaches that moksha
    requires both yoga and jnana, that birth and death arise from ignorance and cease
    through knowledge, and that jnana reveals kaivalya. The speaker then classifies
    yoga into Mantra, Laya, Hatha, and Raja, with four shared states. It describes
    mantra practice, absorption through contemplation, Hatha yoga limbs and postures,
    early obstacles, the preparation of a clean practice monastery, the seated Padma
    posture, salutation to a tutelary deity, and alternate-nostril pranayama.
  language: English
  quote_policy: summarized
