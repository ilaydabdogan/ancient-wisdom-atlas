  quote: ''
  summary: 'The passage defines dhyina, as printed, as having saguna and nirguna forms:
    saguna is meditation of a murti, while nirguna is meditation on the reality of
    Self. It then defines Satnadhi, as printed, as the union of Jivatma and Paramatma
    without the threefold state of knower, known, and knowledge, and describes it
    as extreme bliss and pure consciousness.'
