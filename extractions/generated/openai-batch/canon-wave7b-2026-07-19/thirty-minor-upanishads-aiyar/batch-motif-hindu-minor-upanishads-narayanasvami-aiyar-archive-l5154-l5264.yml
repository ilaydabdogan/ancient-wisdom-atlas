canonical_text:
  quote: ''
  summary: The passage declares the vajrasuchi as a weapon against ignorance, then
    examines what makes someone a brahmana. It rejects identification of brahmana
    with jiva, body, caste/class, knowledge alone, karma, or virtuous action. It cites
    sages of unusual origins as evidence against caste as the criterion. It concludes
    that the true brahmana is whoever directly realizes the non-dual Atma/Brahman,
    is free from faults and passions, and meditates on Atma as Sachchidananda Brahman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker announces that he will declare the vajrasuchi, described as a
    weapon that destroys ignorance, condemns the ignorant, and praises the man of
    divine vision.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage names four castes: brahmana, kshatriya, vaisya, and sudra, and
    reports that smrtis and Vedic words declare the brahmana most important among
    them.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage asks whether brahmana means jiva, body, class, jnana, karma, or
    a doer of dharma.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The jiva is rejected as the brahmana because the jiva is said to be the same
    in many past and future bodies and in all bodies obtained through karma.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The body is rejected as the brahmana because bodies are said to be made of
    the same five elements and to share old age, death, dharma, and adharma across
    social groups.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Class is rejected as the brahmana because the passage lists great Rshis born
    from deer, grass, jackal, ant-hill, a fisherman's daughter, a hare, Urvasi, and
    a water-pot, and says many outside caste stood first among teachers of divine
    Wisdom.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jnana, karma, and virtuous action are each rejected as the brahmana, with
    examples including kshatriyas and others versed in divine Truth, karmas common
    to all beings, and kshatriyas and others who give gold.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The true brahmana is defined as whoever directly realizes and cognizes Atma,
    which is described as without a second, devoid of class and actions, and free
    from stains and changes.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Atma is described as truth, knowledge, bliss, eternity, the substratum of
    all kalpas, all-penetrating, and pervading within and without like akas.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The realized person is described as free from thirst after worldly objects,
    passions, emotion, malice, desire, delusion, pride, and egoism, and as possessing
    qualities beginning with sama.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: The conclusion says that one should meditate on Atma as Sachchidananda and
    as the non-dual Brahman.
  category: action
  evidence_refs:
  - ev:9
