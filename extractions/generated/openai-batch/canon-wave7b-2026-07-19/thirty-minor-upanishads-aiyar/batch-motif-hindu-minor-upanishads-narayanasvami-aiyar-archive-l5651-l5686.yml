canonical_text:
  quote: ''
  summary: The passage describes bodily channels, fetal nourishment, prana moving
    through the sushumna, and a yogic instruction for bringing prana to the end of
    the sushumna so that one becomes a cognizer of the Real. It presents Atma as latent,
    deathless, and witnessed within the body, explains identification with the body
    through ignorance, compares ignorance, the internal organ, and the body to seed,
    sprout, and tree, and contrasts liberation from further embodiment with the ignorant
    person's rebirth and suffering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vayu drives the current of blood into the nadis from the heart chakra or plexus.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Juicy essences from digestion enter the womb in the mother's stomach and nourish
    the child's prana through the sushumna near the child's head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sushumna is identified as the Brahma-nadi, and prana and others are said
    to be found there.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: As birth approaches, prana descends lower and settles in the heart when the
    child is born.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Through yoga, prana is to be brought from the middle of the eyebrows to the
    end of the sushumna, after which the practitioner becomes a cognizer of the Real
    like the child in the womb.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Atma is described as latent, deathless, the witness, and Purusha within the
    body, while also being enveloped by maya.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Prana, or the jiva having prana, identifies with the body because of avidya.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ajñana is called the seed, the antahkarana is called the sprout, and the body
    is called the tree.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The body-tree is described with enumerated bodily parts and substances, including
    hairs, joints, tendons, heart, tongue, bile, phlegm, sukla, and marrow.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: One should consider everything evanescent like the child in the womb stationed
    in the sushumna.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The one who does this becomes freed and gets no more body.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The ignorant man becomes subject to a cycle of rebirths and suffers in this
    body, with an image of exposure like a worm to urine and faeces.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage concludes that, knowing all this, one should be averse to worldly
    objects.
  category: speech
  evidence_refs:
  - ev:8
