canonical_text:
  quote: ''
  summary: A yoga-instruction passage describes measured alternate-nostril breath
    retention, purification of nadis, dietary and behavioral restraints, attainment
    of kevala kumbhaka, bodily signs and levitation, siddhis, sexual abstinence and
    semen preservation, OM recitation, the arambha and ghata states, and pratyahara
    in which sensory objects are regarded as Atma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A matra is defined by a hand action and a single finger snap performed at
    neither a very slow nor very rapid pace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The practitioner draws air through the left nostril for sixteen matras, retains
    it for sixty-four matras, expels it through the right nostril for thirty-two matras,
    and then repeats the process from the right nostril.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Breath cessation is prescribed four times daily at sunrise, noon, sunset,
    and midnight until eighty repetitions are reached; after about three months, purification
    of the nadis is said to occur.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Signs of purified nadis include bodily lightness, brightness of complexion,
    increase of gastric fire, leanness, and absence of bodily restlessness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The yogin is instructed to avoid several foods and activities, including salt,
    mustard, sour, hot, pungent, or bitter foods, vegetables, asafetida, fire-worship,
    women, walking, sunrise bathing, and bodily emaciation by fasting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the early stages, milk and ghee are ordained as food, and wheat, green
    pulse, and red rice are said to favor progress.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the yogin can retain breath as long as he likes, kevala kumbhaka is attained,
    and expiration and inspiration are dispensed with.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says that when kevala kumbhaka is attained, nothing in the three
    worlds is unattainable to the yogin.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: In early practice sweat, phlegm, and later sweat from increased dharana are
    described as bodily occurrences.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The yogin seated in Padma posture first moves on the earth like a frog by
    leaps, then rises from the ground, and then levitates while seated.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The yogin gains power to perform extraordinary feats and is told not to disclose
    those feats to others.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Pain does not affect the yogin; excretions and sleep diminish; tears, eye
    rheum, salivary flow, sweat, and bad mouth smell do not arise in him.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Bhuchara siddhi is said to let the yogin control creatures that tread the
    earth, and wild animals such as tigers, s'arabhas, elephants, wild bulls, and
    lions die when struck by his palm.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The yogin becomes beautiful like the god of love; females desire intercourse
    with him, but intercourse is said to cause loss of virility, so he is instructed
    to abandon copulation.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: By preserving semen, a good odor is said to pervade the yogin's body.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: Sitting in a secluded place, the yogin is instructed to repeat Pranava, OM,
    with prolonged intonation for destruction of former sins; the mantra is said to
    destroy all obstacles and sins.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The arambha state is attained through the described practice involving Pranava.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: The ghata state is described as arising through constant breath suppression
    and as a union without opposition between prana and apana, manas and buddhi, or
    jivatma and Paramatma.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:19
  text: Pratyahara is defined as drawing the organs away from sense objects during
    breath cessation.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: The yogin is instructed to consider whatever he sees, hears, smells, tastes,
    or touches as Atma.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:21
  text: Additional powers listed for the yogin include clairvoyance, clairaudience,
    rapid distant transport, great power of speech, taking any form, invisibility,
    and transmutation of iron into gold by means of his excretion.
  category: attribute
  evidence_refs:
  - ev:11
