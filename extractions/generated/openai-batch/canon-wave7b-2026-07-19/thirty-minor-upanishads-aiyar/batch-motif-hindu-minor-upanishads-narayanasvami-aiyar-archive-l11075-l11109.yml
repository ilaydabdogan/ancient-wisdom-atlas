canonical_text:
  quote: ''
  summary: The passage teaches that mind affected by worldly objects leads to bondage,
    while supportless mind in the state of unmani becomes fit for absorption in Brahman.
    It describes mind as latent within spiritual light and heart sound, as agent of
    creation, preservation, and destruction, and as absorbed in the highest seat of
    Vishnu. The practice of amanaska and samadhi leads to realization of Brahman,
    ascetic transformation, purification of others, and liberation of family generations
    from samsara.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mind influenced by worldly objects is described as liable to bondage, while
    mind not so influenced is fit for salvation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chitta that is supportless and well-ripened in unmani becomes worthy of laya,
    described as absorption in Brahman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A first-person speaker says the absorption should be learned from him, calls
    himself all-full, and says he alone is the cause of the absorption of manas.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Manas is said to be within spiritual light, and that spiritual light is said
    to be latent in the anahata heart sound.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Manas is described as the agent of creation, preservation, and destruction
    of the three worlds, and as becoming absorbed in the highest seat of Vishnu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Through the absorption of manas, one obtains a pure, secondless state in which
    difference is absent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: One who knows this teaching is said to wander in the world like a lad, an
    idiot, a demon, or a simpleton.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: By practicing amanaska, the practitioner becomes contented, consumes less
    food, has diminished urine and faeces, gains bodily strength, and becomes free
    from disease and sleep.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: With breath and eyes motionless, the practitioner realizes Brahman and attains
    the nature of bliss.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: An ascetic intent on drinking the nectar of Brahman produced by long samadhi
    becomes a paramahamsa or avadhuta.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Seeing the ascetic purifies the world, and even an illiterate person who serves
    him is freed from bondage.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The ascetic enables members of his family for one hundred and one generations,
    including mother, father, wife, and children, to cross the ocean of samsara and
    be freed.
  category: action
  evidence_refs:
  - ev:5
