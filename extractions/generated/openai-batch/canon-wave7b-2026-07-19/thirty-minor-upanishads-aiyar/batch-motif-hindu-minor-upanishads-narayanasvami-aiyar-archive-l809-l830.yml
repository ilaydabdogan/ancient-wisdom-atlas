canonical_text:
  quote: '"like the ether in the pot [after the pot is broken]"'
  summary: Hanuman asks Rama about Jivanmukti, Videhamukti, their authority, perfection,
    and object. Rama answers that bondage is connected with Chitta marked by agency
    and enjoyment; control of Chitta is Jivanmukti. Videhamukti follows the extinction
    of Prarabdha and removal of bodily vehicles, illustrated by the broken-pot ether
    image. The 108 Upanishads are named as authority, and the aim is eternal bliss,
    won through human effort, Samadhi, Vedantic study, and extinction of Vasanas.
  language: English
