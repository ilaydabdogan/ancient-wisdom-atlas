literal_observations:
- id: obs:1
  text: Moksha is defined as the annihilation of all thoughts of bondage through discrimination
    of the eternal from the non-eternal.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fit object of worship is the Guru who enables the disciple to attain Brahman,
    described as consciousness in all bodies.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The disciple is described as Brahman alone remaining after consciousness of
    the universe has been lost through Brahmic wisdom.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The learned person is one who has cognized the true form of his own consciousness
    latent in all.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The ignorant person is one who has an egoistic conception of body, caste,
    life-order, actor, enjoyer, and related identities.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Asuric or demoniacal austerity is defined as tapas that troubles the Atma
    within through practices such as mantra muttering, food abstinence, and fire worship,
    accompanied by cruel desire, hatred, pain, and hypocrisy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The demoniacal austerity is said to be performed for the purpose of acquiring
    the powers of Vishnu, Brahma, Rudra, Indra, and others.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: True tapas is described as burning the seed of deep-rooted desire for such
    powers through the fire of direct cognition that Brahman is truth and the universe
    is a myth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Paramapada is defined as the seat of eternal and emancipated Brahman, superior
    to vital airs, senses, actions, internal organs, gunas, and others, and as witness
    to all.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: What is fit to be taken in is absolute consciousness unconditioned by space,
    time, or substance; what is not fit is the thought that the universe is true and
    different from one's Self under Maya.
  category: attribute
  evidence_refs:
  - ev:9
