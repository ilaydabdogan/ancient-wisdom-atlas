canonical_text:
  quote: '"at first, this (universe) was Sat (Be-ness) only."'
  summary: In a dialogue frame, Paingala asks Yajnavalkya for initiation into the
    supreme mysteries of Kaivalya. Yajnavalkya describes primordial Sat/Brahman, the
    arising of Maya-related powers, Isvara as cause and seed of the universe, successive
    manifestations through Hiranyagarbha and Virat/Vishnu, the production of elements,
    worlds, bodies, organs, and deities, and Isvara's entry into beings, where delusion
    produces the state of Jiva and the appearance of birth and death.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Paingala served under Yajnavalkya for twelve years and asked him to initiate
    him into the supreme mysteries of Kaivalya.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yajnavalkya states that the universe was first Sat, identified as Brahman,
    described as free, changeless, true, wise, blissful, full, permanent, and one
    without a second.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mulaprakrti is described as being in Sat through several illusion-like analogies
    and as having the three gunas in equal proportions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mulaprakrti changes into Avyakta; the reflected consciousness in Avyakta is
    called Isvara-Chaitanya.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Isvara is said to control Maya, to be omniscient, and to be the original cause
    of creation, preservation, and dissolution, as well as the seed of the universe.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Isvara causes the latent universe to manifest like an unfurled painted canvas
    and makes it disappear when karmas are extinguished, with the universe latent
    in him like a wrapped painted cloth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A sequence is given in which Avarana Sakti gives rise to Vikshepa Sakti called
    Mahat; Hiranyagarbha-Chaitanya is reflected in Mahat; ahankara arises; Virat-Chaitanya
    is reflected in ahankara; and Virat becomes Vishnu, chief Purusha and protector
    of gross bodies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: From Atma arise akas, vayu, agni, apas, and prthivi in sequence.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Isvara wishes to create, converts subtle elements into gross ones by division
    and fivefold mixture, and evolves many Brahmandas, fourteen worlds for each sphere,
    and gross bodies suited to those worlds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Isvara creates pranas, organs of action, the internal organ, organs of sense,
    and the deities ruling over organs, and locates the deities in their spheres.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: By Isvara's orders the deities pervade the macrocosm, Virat creates gross
    things, and Hiranyagarbha protects subtle things; without Isvara, those located
    in their spheres cannot move or act.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Isvara pierces the Brahmanda and the Brahmarandhras in microcosmic heads,
    enters within, and makes formerly inert beings able to perform karmas.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Isvara enters microcosmic bodies with a particle of Maya, becomes deluded,
    acquires the state of Jiva, identifies with three bodies, and becomes actor and
    enjoyer, described as deluded like a water-lift or potter's wheel and as if subject
    to birth and death.
  category: sequence
  evidence_refs:
  - ev:12
