canonical_text:
  quote: ''
  summary: The passage describes the embodied fetus receiving life from the mother,
    remembering previous births while in the womb, lamenting repeated birth and death,
    vowing future spiritual practice and devotion if freed, attributing suffering
    to prior actions, passing through birth, and losing memory after contact with
    vaishnavi vayu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the body arise eight prakrtis and sixteen vikaras; the child obtains prana
    through the mother's food and drink transmitted by her nadis and is complete in
    attributes in the ninth month.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child in the womb remembers previous births, distinguishes right and wrong
    actions, and recalls many wombs, foods, breasts, places of birth, burning-grounds,
    and repeated births and deaths.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker describes suffering in the womb and across life stages, identifies
    birth as a seed of sorrow, and says it lacks nivrtti, yoga, and jnana.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker vows that if freed from the womb it will seek wisdom from a guru,
    practise Sankhya yoga, seek refuge in Mahesvara and other divine forms, perform
    penances, and worship Vishnu or Vasudeva.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker says it is burned by prior good and bad actions, formerly committed
    sins through non-belief, now reaps their fruits, and will become a believer hereafter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Jiva within the mother's womb repeatedly contemplates the miseries of
    the cycle of rebirths and becomes disgusted with material enjoyments.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The being that has entered many female wombs comes to the mouth of the womb
    seeking release, suffers pressure and delivery vayu, and after birth loses memory
    upon contact with vaishnavi vayu.
  category: sequence
  evidence_refs:
  - ev:7
