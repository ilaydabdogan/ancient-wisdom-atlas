canonical_text:
  quote: ''
  summary: 'The passage gives a prescriptive sequence for rites connected with renunciation:
    śrāddha offerings, feeding Brahmanas, shaving and bathing, fire rites, water offerings,
    casting away hair, sacred thread, cloth, and waist-cord, meditation on the Self,
    northward departure, Pranava initiation, ascetic wandering, and the taking of
    staff, cloth, and bowl under teacherly instruction.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists several śrāddha categories associated with divine beings,
    sages or humans, elements and beings, paternal ancestors, maternal ancestors,
    and the practitioner himself and his forebears.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The practitioner is instructed to perform eight śrāddhas within specified
    periods, using mantras of his śākhā.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The practitioner worships and feeds Brahmanas, offers pindas to the pitṛs,
    gives tambula and other presents, and dismisses the Brahmanas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: For remaining rites, the practitioner plucks hairs, has the head and other
    hair shaved, and has nails removed, with stated bodily exceptions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After shaving, the practitioner bathes, performs evening sandhya, utters Gayatri
    a thousand times, establishes his own fire, offers ghee, eats fried rice-powder
    three times, sips water, and maintains the fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The practitioner sits north of the fire on a deer-skin, studies Puranas without
    sleeping, bathes after the four yamas, cooks a rice oblation, and offers it in
    sixteen oblations according to the Purusha-Sukta.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Viraja-homa, the practitioner concludes with gifts of cloth, a golden
    vessel, cows, and money, then dismisses the invoked Brahma.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The practitioner draws Agni into himself, meditates upon the fire, circumambulates
    it, prostrates before it, and dismisses it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the morning the practitioner performs sandhya, utters Gayatri a thousand
    times, and worships the sun.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The practitioner enters water up to the navel, offers arghya to the guardians
    of the eight quarters, and performs a rite involving Gayatri, Savitri, vyahrti,
    and mantras spoken in high, middling, and low tones.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The practitioner sips water, drops water toward the east, plucks remaining
    hair, tears the sacred thread, and casts hair and sacred thread into water as
    an oblation with a formula sending them to the ocean.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The practitioner casts aside cloth and waist-cord in water, thinks of himself
    as an abdicator of all karmas, meditates on his own Reality, and goes northward
    with hands upraised.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: A learned sannyasin is to receive Pranava initiation from his teacher, move
    freely with the thought that there is none other than his Self, and live on fruits,
    leaves, and water in mountains, forests, and temples.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: A lover of salvation after sannyasa roams naked, enjoys Atmic bliss, avoids
    karmas, sustains life with fruits, juice, bark, leaves, roots, and water, and
    abandons the body in mountain caves while uttering Pranava.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:15
  text: An aspirant after wisdom who becomes a sannyasin walks one hundred steps and
    is then addressed by the teacher and other Brahmans, who tell him to stay, wear
    staff, cloth, and bowl, and come to the teacher to learn the meaning of the Pranava
    mantra-vakya.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: The aspirant takes up waist-cord, loin-cloth, red-coloured cloth, bowl, and
    a bamboo staff described as uninjured, equal, beautiful, and not black-spotted;
    the bowl is also taken up with a mantra preceded by Pranava.
  category: object
  evidence_refs:
  - ev:11
