canonical_text:
  quote: ''
  summary: The passage defines the Videhamukta through repeated negations and identifications
    involving Atma, Brahman, Brahmic bliss, and states beyond ordinary conceptual
    categories. It uses images of Brahman nectar, medicine, dwelling, and a car of
    Brahmic bliss, includes declarations that all is Atma and that no other exists
    beside Atma, and ends with an instruction to a six-faced addressee to know, enjoy,
    and remain in Atma in order to attain Videhamukti.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Videhamukta is described as having an Atma that is nameless, formless, illimitable,
    beyond turya, and neither auspicious nor inauspicious.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes the Videhamukta as free from bondage or freedom, guna
    or non-guna, space and time, witnessable and witness, small and great, and cognition
    of the universe or Brahman.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the Videhamukta has gone beyond the modifications of chitta,
    illumines those modifications, has an Atma without modifications, and is neither
    embodied nor disembodied.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The person is described as drinking, using as medicine, being devoted to,
    and being immersed in the juice of the nectar of Brahman.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The person is described as realizing Brahmic bliss, cognizing Siva bliss in
    Brahmic bliss, becoming one with Brahmic bliss, living in its household, and mounting
    its car.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage attributes to the person the thought that all this is of the nature
    of Atma, that nothing else exists beside Atma, and that the speaker is Atma, the
    great Atma, the supreme Atma, and Atma in the form of bliss.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says the person does not think in terms of 'this is Jivatma' and
    'that is Paramatma' and is described through paired categories that are then denied,
    including emancipated and non-emancipated, dual and non-dual, and All and non-All.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Atma is described in relation to gross, subtle, causal, and fourth bodies,
    and to the anna, prana, manas, vijnana, and ananda sheaths, while also being described
    as without the five sheaths.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Atma is described as nirvikalpa, devoid of sankalpa, of the nature of void
    through unceasing samadhi, without beginning, middle, or end, above speech and
    the three states, and with neither light nor darkness.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speaker commands the six-faced one to look only upon Atma, know it as
    one's own, enjoy one's Atma, stay in peace, wander in one's own Atma, and says
    that this will lead to Videhamukti.
  category: speech
  evidence_refs:
  - ev:6
