canonical_text:
  quote: ''
  summary: The passage declares mind, intellect, ego, bodies, time, qualities, scriptures,
    deities with limitation, creation, teacher-disciple relations, perceived objects,
    pleasure and pain, gain and loss, and sensory fields to be unreal, while the speaker
    identifies the self as the Real, Sat, Chit, and great Sadasiva. It instructs one
    to know Atma alone and practice the mantra 'I am Brahman,' which is said to remove
    sins, bondage, duality, grief, passions, ignorance, Yama's noose, and other mantras;
    it gives bliss, wisdom, and salvation, and is depicted as killing or destroying
    non-Atma in demon, hill, and asura imagery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that there is no shravana or manana in Chidatma for attaining
    salvation, and that there is nothing like or unlike the speaker and nothing within
    the speaker.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker states that manas, buddhi, aham, the three bodies, the three periods
    of time, the three gunas, heard things, the Vedas, the Sastras, limited Murtis,
    creation, tattvas, master and disciple, and the Guru's mantra are unreal.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker identifies itself as unconditioned, permanent, unborn, Real, pure,
    Chit, great Sadasiva, and Sat.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that the universe is woven warp-wise and woof-wise and is
    unreal, as are cause and non-cause, loss and gain, pain and happiness, victory
    and defeat, sense qualities, ajnana, mundane existence, and all gunas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage instructs that one should cognize one's own Atma alone and always
    practice the mantra of Atma.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mantra 'I am Brahman' is said to remove sins, destroy other mantras, remove
    Yama's noose, pains of duality, thought of difference, diseases, griefs, passions,
    anger, actions, and ignorance of Atma.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The mantra 'I am Brahman' is said to give indescribable bliss and the state
    of ajada.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The mantra is described as killing the demon of non-Atma; as a thunderbolt
    clearing the hill of not-Atma; and as a wheel destroying the asuras of not-Atma.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says there are seven crores of great mantras and vows connected
    with hundred crores of births, but one should give up all other mantras and practice
    'I am Brahman.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The practitioner of the mantra is said to obtain salvation at once, without
    doubt.
  category: sequence
  evidence_refs:
  - ev:5
