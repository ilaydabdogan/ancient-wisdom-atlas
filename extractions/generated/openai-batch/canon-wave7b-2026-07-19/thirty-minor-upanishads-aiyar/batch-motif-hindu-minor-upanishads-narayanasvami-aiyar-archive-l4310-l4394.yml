  summary: The passage defines the Jivanmukta and Videhamukta through repeated negations
    of body, ritual, cosmology, relation, time, knowledge, and duality, together with
    affirmations of identity with Brahman, Chit, Atma, and consciousness. It describes
    bliss, silence, quiescence, fearlessness, and the absence of distinctions such
    as I/thou and this/that.
