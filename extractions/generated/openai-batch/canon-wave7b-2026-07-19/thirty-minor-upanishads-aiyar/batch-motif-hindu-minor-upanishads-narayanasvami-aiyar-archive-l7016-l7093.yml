canonical_text:
  quote: ''
  summary: 'The passage gives rules for a wandering muni, ascetic, parivrajaka, jnani,
    or yogin: seeking alms, having no fixed dwelling, controlling the senses, renouncing
    ego, dualities, anger, fame, disciples, excessive books, speech, and social display,
    adopting an idiot-, child-, mute-, madman-, or cow-like harmless persona, enduring
    abuse without malice, practicing silence, tapas, meditation, knowledge, and dispassion,
    and seeing Janardana/Vishnu/Paramatma everywhere.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The instructed ascetic may seek alms from a forbidden house to a non-forbidden
    one, and should go to a house whose door is ajar rather than closed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The muni may have an uninhabited house or the foot of a tree as an abode,
    may sleep where the sun sets, and should have no fixed place.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The muni is described as having a dusty body, no fire-worship, patience, controlled
    organs, and no desire.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: One who has gone to the forest, dwells with jnana as sacrifice, masters the
    organs, and awaits death is said to be fit to be of the nature of Brahman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A muni who gives no cause for fear to beings need not fear them, and the passage
    directs absence of egoism, dualities, doubt, anger, hatred, and false speech.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person who visits sacred places, does not injure living creatures, and receives
    alms at the proper time is said to be fit to be of the nature of Brahman.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The ascetic should not associate with a forester or householder, should live
    unknown to others, should not be glad of anything, should roam like a worm according
    to the sun's direction, and should not perform works for fame, pain, or public
    benefit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The ascetic should avoid vicious books, over-disputatious reasoning, factions,
    disciples, studying many books, discourse, and commencing works.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The wise muni intent on Brahmic vision should appear to people like an idiot,
    a lad, or a mute person, should neither do nor talk, should not think of good
    or bad, should rejoice within himself, and should roam alone with controlled senses.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The jnani delights in Atma, sees all equally, plays like a child, wanders
    like an idiot, talks like a madman, and follows cow-observances by eating with
    the mouth and troubling no one.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A good jnani should endure being pushed, disregarded, slighted, beaten, hindered,
    burned, defiled, or otherwise afflicted by vicious people, and should think well
    of them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A yogin should not dwell on praise or affliction; the passage states that
    a yogin slighted by people attains a higher state in yoga.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The ascetic should act rightly through mind, speech, and body toward beings
    born from embryo, egg, and other sources, harbor no malice, give up clinging,
    and abandon passion, anger, pride, desire, delusion, and fear.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Ascetic dharma is listed as alms-food, silence, tapas, special meditation,
    jnana, and vairagya; the ascetic wears red cloth, practices dhyana-yoga, dwells
    at a tree foot, outside a village, or in a temple, and begs daily.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: After purification of mind, the ascetic may be a parivrajaka anywhere, seeing
    Janardana everywhere, being unstained like vayu, equal in happiness and pain,
    eating whatever comes, equally regarding brahmana, cow, horse, beasts, and others,
    and meditating on Vishnu as Paramatma and Is'vara.
  category: action
  evidence_refs:
  - ev:13
