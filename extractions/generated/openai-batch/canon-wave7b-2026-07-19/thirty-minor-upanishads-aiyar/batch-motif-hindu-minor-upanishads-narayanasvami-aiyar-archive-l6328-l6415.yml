canonical_text:
  quote: ''
  summary: 'The passage gives instructions for an ascetic seeking salvation: reject
    identification of the body with the Self, relinquish associations, live alone
    as a bhikshu, avoid social grouping and sensory attractions, repeat Narayana,
    meditate on Brahman, practice defined forms of restraint, withdraw the organs
    like a turtle, and become emancipated by desirelessness, non-possession, absence
    of duality, and life away from inhabited places.'
  language: English
  quote_policy: summarized
