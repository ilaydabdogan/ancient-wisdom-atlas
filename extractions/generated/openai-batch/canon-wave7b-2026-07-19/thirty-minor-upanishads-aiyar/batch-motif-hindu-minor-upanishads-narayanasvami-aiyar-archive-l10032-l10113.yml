canonical_text:
  quote: Whatever is seen and whatever is heard is no other than Brahman.
  summary: The passage gives a first-person non-dual teaching in which the speaker
    identifies with Brahman, Parabrahman, Hari, and Janardana; instructs the practice
    of silence with the formula of identity; denies birth, death, caste, body, agency,
    and plurality; and uses images of clouds and sky, sun and darkness, divine feet,
    mother-of-pearl and silver, and rope and serpent to explain unaffectedness, liberation,
    and illusion.
  language: English
  quote_policy: quoted
