canonical_text:
  quote: ''
  summary: The passage gives yogic instructions on pranayama, posture, mantra, dharana,
    tarka, samadhi, internal channels, obstacles, progressive attainments, and contemplation
    of elements, Atma, and prana. It identifies Om as Brahman and describes prana
    traveling the path of Om through internal openings called cave, hole, or wheel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pranayama is described as consisting of expiration, inspiration, and cessation
    of breath, with recitation of Gayatri, vyahrtis, Pranava, and the siras.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rechaka is described as raising vayu from the heart region, making the body
    void of vayu, and uniting the soul to the state of void.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Puraka is described as taking in vayu in a manner compared to drawing water
    through a lotus-stalk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kumbhaka is described as the absence of expiration and inspiration while the
    body remains motionless in one state.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person who has attained much quiescence is said to see forms like the blind,
    hear sounds like the deaf, and see the body like wood.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dharana is defined as merging sankalpa into Atma and contemplating Atma; tarka
    is Veda-compatible inference; samadhi is the state in which one thinks all equal.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The practitioner is instructed to sit on a kusha grass seat, protect himself
    mentally, utter ratha-mandala, assume a posture, face north, control the nostril,
    inspire, retain breath, and preserve Agni.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Om is identified as the one letter Brahman, is not to be breathed out, and
    is used as a divine mantra to remove impurity.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The practitioner is instructed to meditate beginning from the navel upward,
    give up seeing across, up, or down, and practice motionlessly without tremor.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Union in the hollow stalk called Sushumna is identified with dharana, and
    prana is said to travel through the path through which Akshara or Om goes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The path is described as passing through openings of the heart, vayu, head,
    and moksha, and these are called cave, hole, or wheel.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The yogin is instructed to avoid fear, anger, laziness, excessive sleep or
    waking, and excessive food or fasting.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Strict daily practice is said to bring spiritual wisdom in three months, sight
    of devas in four months, Brahmanishtha in five months, and Kaivalya in six months.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Earth, water, agni, vayu, and akas are assigned decreasing numbers of matras,
    while the practitioner is instructed to think on that which has no matras.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: Atma is to be united with manas and contemplated by means of Atma; prana is
    described as thirty digits long and as the seat of external pranas.
  category: relationship
  evidence_refs:
  - ev:10
