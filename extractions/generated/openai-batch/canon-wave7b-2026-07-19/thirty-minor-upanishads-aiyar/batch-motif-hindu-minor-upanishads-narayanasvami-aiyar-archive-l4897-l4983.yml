canonical_text:
  quote: All this is the result of maya. Therefore, there should be Brahma-Bhavana.
  summary: The passage presents a long series of impossible examples to deny the real
    existence of the universe, states that duality and non-duality as differentiations
    are unreal and the result of maya, instructs contemplation of identity with Brahman,
    and restricts the teaching of this science to purified, qualified recipients devoted
    to their gurus.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage describes the ultimate reality as endless, decayless, quiescent,
    and of one nature only; anything other than the self is compared to unreal things
    such as a mirage.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives many impossible conditions under which the world or universe
    would be real, including a barren woman's son, hare's horns, drinking mirage water,
    a snake conceived in a rope, reversed fire, still rivers, sky-flowers, and other
    impossibilities.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several examples involve mistaken or impossible perception, including silver
    in mother-of-pearl, a snake in a rope, dream objects appearing in the waking state,
    and a reflection arising in glass without a backing.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The text states that there is no universe in the womb of Aja, glossed as the
    unborn Brahman, and no universe in the womb of Atma.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that duality and non-duality, as results of differentiation,
    are not real, and that all this is the result of maya.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The practitioner is instructed to cultivate Brahma-Bhavana, have faith in
    Brahman when doubt arises, know 'I am Brahman,' give up the 'I,' abandon action,
    and contemplate 'I am Brahman.'
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The knot of the heart is described as the wheel of Brahman, which cuts asunder
    the knot of existence.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that body, karma, objects, actions, and the four states
    are absent, and that everything is Brahman alone.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The great science of Sankara is not to be explained to ordinary, atheist,
    faithless, ill-behaved, or evil-minded persons.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The teaching is to be given after examination to high-souled persons whose
    minds are purified by devotion to their gurus, and it is to be taught for a year
    and a half.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The passage instructs one to leave off practices recommended by other Upanishads,
    study the Tejobindu-Upanishad with delight, and says that by once studying it
    one becomes one with Brahman.
  category: action
  evidence_refs:
  - ev:4
