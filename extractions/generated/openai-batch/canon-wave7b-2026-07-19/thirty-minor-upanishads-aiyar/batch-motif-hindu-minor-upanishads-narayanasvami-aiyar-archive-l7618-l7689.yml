canonical_text:
  quote: ''
  summary: The passage teaches that meditation on Paramesvara/Brahman and knowledge
    of Atma destroy ignorance, grief, delusion, and bondage to birth and death. It
    describes Atma/Brahman as the inner, all-pervading, all-knowing reality, located
    in the cave of the heart yet beyond sensory cognition. It then describes the emancipated
    Parivrat, who wanders alone, abandons worldly ties, meditates on Reality, remains
    as Brahman, and attains the supreme abode of Vishnu from which there is no return.
  language: English
  quote_policy: summarized
