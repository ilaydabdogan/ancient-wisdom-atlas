literal_observations:
- id: obs:1
  text: A sign for a seriously sick person uses a cupped hand pressed into the flank
    while the trunk is flexed laterally, as though the hand supports a side about
    to fall over.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sign for moribund state or corpse uses a horizontal palm-up hand with the
    forefinger and little finger fully extended to represent a dead person with stiffened
    legs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A sign for forgetfulness or loss of memory involves picking at the centre
    or lobe of the ear with thumb and forefinger, described as bringing forth what
    had been put into it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another sign for forgetfulness places the hand over the brow as in deep thought,
    then moves it forward and downward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A sign for yes or all right uses loosely hooked fingers and a single vertical
    flexion from the elbow.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A sign for no or negation moves the hand downward with inward rotation while
    the fingers extend and separate.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A sign for a good person or thing uses the thumb working circularly on the
    middle and forefingers, sometimes pointing toward the referent.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Another sign for a good person or thing pats the lower breast with the flattened
    hand.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A sign for a bad person or thing points the extended forefinger and little
