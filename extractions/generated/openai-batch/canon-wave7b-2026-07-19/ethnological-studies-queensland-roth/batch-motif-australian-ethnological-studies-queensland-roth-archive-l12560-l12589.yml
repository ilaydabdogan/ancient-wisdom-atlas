literal_observations:
- id: obs:1
  text: Europeans are said to have often applied the misnomer "yam-stick" to the two-handed
    fighting-pole, which the passage states has no connection with the edible yam.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two-handed fighting-pole is used by both men and women, especially women,
    for fighting purposes only, and is not frequently met with in the Boulia District.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The fighting-pole is manufactured in the Boulia, Cloncurry, Flinders, and
    perhaps Leichhardt-Selwyn Districts, and is described as travelling little beyond
    a limited circuit.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The fighting-pole is about 4 to 4 feet 6 inches long, sometimes over 2.5 inches
    in diameter, tapered abruptly at each end, and made from hardwoods such as gidyea,
    mulga, or box.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The surface of the fighting-pole may be smoothed or longitudinally fluted,
    and incised parallel or looped bands may be added near one or both ends to reduce
    slipping.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Mitakoodi alone are said to manufacture a thinner, longer, longitudinally
    fluted, red fighting-stick called the koo-lung-a-ra, used by women only.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: For attack with the fighting-pole, one end is clasped by both hands close
    together; for defence, one hand is held at each end and the weapon is held horizontally
    above the head or vertically at the side.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The manufacture of the throwing-stick or nulla-nulla is said to be declining
    in the Boulia District, while it remains common along and north of the Leichhardt-Selwyn
    ranges; it is made from gidyea, blackened with charcoal grease, and may be about
    two feet long.
  category: object
  evidence_refs:
  - ev:8
