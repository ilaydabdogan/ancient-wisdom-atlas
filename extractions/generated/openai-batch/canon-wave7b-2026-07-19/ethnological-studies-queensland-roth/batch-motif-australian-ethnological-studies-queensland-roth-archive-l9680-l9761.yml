canonical_text:
  quote: ''
  summary: The passage describes varieties of reed and opossum-string necklaces, armlets,
    anklets, body-cords, chest ornaments made from eagle-hawk claws and shell, the
    movement of shell ornaments through named groups and districts, substitutions
    and imitations of materials, a charm sometimes worn as a chest ornament, and waist-belts
    or aprons made of hair-twine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One reed-necklace variety is made of a single belly with strengthened extremities
    looped into a tying-string; the tying-string may be made from materials such as
    moleskin or hair-twine.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A third necklace type, attributed to Kalkadoon and Mitakoodi manufacture,
    is an endless beaded string about 12 to 16 feet long, rolled into a thick loop
    with two bellies, and can also be worn as a coil around the neck.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The true opossum-string necklace has a main supporting string and numerous
    secondary hanging twists that create a fringe-like appearance from one continuous
    length.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: When opossum-string is deficient, red worsted from a blanket may be substituted
    in the necklace.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The opossum-string necklace is manufactured in the Boulia, Leichhardt-Selwyn,
    and Cloncurry districts, usually by women; it is colored red and primarily intended
    for corroborees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A larger-than-usual opossum-string necklace may be worn by women as an apron
    hanging from the hips.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Another opossum-hair necklace form was observed at Glenormiston and Roxburgh;
    one specimen used cotton threads from an old sock instead of opossum-string, with
    tying-strings made of twisted moleskin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Opossum-string armlets and anklets occur as rings; at corroboree times, feather-tufts
    may be inserted into the armlets.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the Cloncurry District, armlets are described as either single-string or
    multiple-string forms.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Body-cords of opossum-string are noted in the Boulia District; Pitta-Pitta
    leaders on fighting expeditions wear them as a loop thrown over the head and hanging
    loosely on the chest.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Chest ornaments are mainly claw and shell varieties in the described districts.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: The claw chest ornament is made from two large eagle-hawk claws fixed moon-shape-like
    into black cement; two such double-claw hoops may be attached to one neck-string.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: The eagle-hawk claw ornament is brought to Boulia from northern routes, including
    down the Georgina River and down the Burke and Wills.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: The shell ornament is a concave white shell piece cut roughly oval, about
    2 to 2.5 inches across its longer diameter, and attached to a neck-string by a
    drilled aperture or cement.
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage describes a chain of shell acquisition and movement involving
    Springvale, Diamantina Gates, Cork, the Goa of Elderslie, Mitakoodi, Woonamurra,
    Terundulli, Nouun at Mullangera, and Karunti or other people around Normanton.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: At Boulia the shell ornament is sometimes, but irregularly, worn on the forehead
    like a kangaroo-tooth ornament.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: The shell ornament is imitated by grinding and chipping pieces of broken china
    ware.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The woraka is sometimes worn as a true chest ornament, although its primary
    use is as a charm against certain illnesses.
  category: object
  evidence_refs:
  - ev:8
- id: obs:19
  text: Waist-belts and aprons are made from either human or opossum hair-twine.
  category: object
  evidence_refs:
  - ev:9
