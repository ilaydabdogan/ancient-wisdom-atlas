canonical_text:
  quote: ''
  summary: 'The passage describes several ways a doctor or medicine-man may be initiated:
    through objects or bones placed in a person by Kanmare or Mulkari, by Mo-ma, the
    ghost or shade of a departed person, by Ten-gul-a-goo-lun, a supernatural being
    with large eyes and ears, or through training at a Goa encampment involving a
    gift to a teacher, ritual death, four days in a water-hole, drying by surrounding
    fires, revival, and instruction in the bone and songs. It also describes doctors''
    objects, their power to cure or produce sickness, and the use of the munguni or
    death-bone in causing sickness or death and in retaliation.'
  language: English
  quote_policy: summarized
