canonical_text:
  quote: ''
  summary: The passage opens a chapter on the search for food and describes several
    seed-foods and plant foods in the Boulia District, including star-grass, Sporobolus
    grasses, coolibar seed, pig-weed, and nardoo. It gives practical methods of collecting,
    washing, drying, treading, winnowing, grinding, and sometimes roasting or eating
    these foods raw, with repeated mention that women prepare plant food.
  language: English
