canonical_text:
  quote: ''
  summary: The passage describes a procedure in which a medicine-man seals alleged
    blood in a bone-apparatus, the employer secretly heats it over a fire, tests an
    alleged enemy for sickness, and treats signs of illness as proof. If the wrong
    blood is believed to have been obtained, the receptacle is washed for reuse. If
    the blood is accepted as genuine, heating, burning, or rinsing the apparatus is
    said to worsen, kill, or restore the enemy. A later settlement may occur when
    both parties are believed to hold each other’s blood and wash out their respective
    mungunis. The passage also begins to describe snake-bite death as explained by
    a variation of the death-bone practice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A doctor or medicine-man places a pointer tip-down into blood in the receptacle
    of the bone-apparatus, seals it with cementing substance, and winds a connecting-string
    around it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The doctor is described as taking precautions so that no one actually sees
    what he encloses in the cylinder when sealing it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The employer and doctor leave camp after dark, go to a secluded place, kindle
    a fire, and warm the bone-apparatus over it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the secret warming, the employer returns to camp, speaks with the alleged
    assailant, watches for sickness, and treats an admission of tiredness or being
    out of sorts as proof of guilt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If no sign of sickness appears, the case is judged to involve the wrong individual’s
    blood; the receptacle is opened, rinsed, and washed in water for reuse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the blood is accepted as the required culprit’s, warming the apparatus
    is said to make the enemy sicker, destroying it in flames to make him die, and
    rinsing it in water with fat rubbed over it to put him right again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The possessor is said to have the enemy in his power but avoids killing him
    because his own blood may remain in the enemy’s possession.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: After an interval, the complainant may admit possessing the other man’s blood
    in retaliation; the parties do not fight and settle by the alleged washing and
    rinsing of their respective mungunis.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Death from snake-bite is explained through a variation of the death-bone superstition,
