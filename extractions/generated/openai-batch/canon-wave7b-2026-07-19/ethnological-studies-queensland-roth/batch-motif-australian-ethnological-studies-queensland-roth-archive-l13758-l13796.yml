canonical_text:
  quote: ''
  summary: The passage is an ethnographic report on cannibalism in North-West-Central
    Queensland. It describes limited corpse-eating after sudden death, reported child
    killings for consumption, an eyewitness account of an infant being roasted, regional
    differences in treatment of adult corpses, exposure of intertribal war dead, and
    a debated but prevented case of eating an executed man's body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that direct evidence is meagre and information is given
    reluctantly, but reports that cannibalism occurs within limitations and is becoming
    obsolete in North-West-Central Queensland.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Boulia district, portions of a child who dies suddenly without a lingering
    illness may be eaten by the parents and blood brothers and sisters only.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The stated reason for eating portions of the suddenly deceased child is that
    putting the child in a hole would make relatives think too much about the child;
    a child who had long been ill and emaciated is instead buried.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author reports evidence that, since 1885, Aboriginal children were killed
    at Noranside, Roxburgh, and Carandotta with the object of being eaten.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In more northern areas, mixed-descent infants are said to be murdered at the
    instigation of white fathers or assumed Aboriginal fathers, but the author says
    it is uncertain how often the main purpose is to provide food.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mr. Edwards is identified as an eyewitness in 1888 between Roxburgh and Carandotta;
    he saw an infant being roasted in a native oven and later saw the body opened
    and people moving toward the fat, but he stopped observing because he became sick
    and faint.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Adults who have died suddenly and are in good bodily condition may similarly
    be eaten, while old or emaciated adults are excluded in this description.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The author says adult corpse-eating is rare in the Boulia and Cloncurry districts
    at the time of writing, though older men recount many earlier instances.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the Leichhardt-Selwyn district, the Kalkadoon are reported in 1896 to eat
    any corpse, friend or foe, old or young, including bodies with visibly rotten
    flesh from venereal disease.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Elsewhere, individuals killed in intertribal warfare are left exposed where
    they fall.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: At Glenormiston in 1892, after a man was killed collectively by the tribe
    for murder, a debate was held about whether the body should be eaten; the station-manager's
    presence led to the decision not to eat it.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The author states that he knows of no North-West-Central Queensland case in
    which an adult male or female was killed solely to provide a meal.
  category: other
  evidence_refs:
  - ev:12
