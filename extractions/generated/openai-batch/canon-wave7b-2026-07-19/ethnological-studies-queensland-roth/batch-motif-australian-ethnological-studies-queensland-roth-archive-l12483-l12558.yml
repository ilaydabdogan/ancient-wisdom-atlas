    with greenish-yellow stains often visible.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wommera may bear charcoal patterns, concentric-circle engravings, or transverse
    handle-end incisions; its handle has cementing substance with a flint sharpener,
    and the opposite end has a small half-moon-shaped peg fixed with tendon and cementing
    substance.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: For spear-throwing, the wommera is clutched between fingers and held vertically;
