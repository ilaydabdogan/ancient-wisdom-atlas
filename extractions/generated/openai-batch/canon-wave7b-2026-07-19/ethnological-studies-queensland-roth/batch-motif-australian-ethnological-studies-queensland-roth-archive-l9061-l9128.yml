literal_observations:
- id: obs:1
  text: Aboriginal people in the described districts use dry heat, moist heat from
    burning gum leaves, and moisture or water soaking to bend or straighten timber
    for wooden implements.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Grease and fat from saurian or mammalian sources are applied thickly to preserve
    timber in its shaped position.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Water-bags were used to carry water over long distances where water was scarce,
    but their manufacture had declined after canvas water-bags became available.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Animal-skin water-bags are described as made from kangaroo, paddy melon, or
    opossum skins, with openings pegged and tied, repairs made with pegs and figure-of-8
    twine, hind legs tied as a strap, and the former neck serving as the mouth of
    the bag.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: For short-distance water transport, a koolamon may be carried on the head,
    with small twigs or leaves laid on the water surface to reduce spilling.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Dilly-bags are satchel-like bags that lie flat when empty and vary in shape
    from square to boat-shaped forms.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The larger dilly-bags are described as carried on the back invariably by women,
    using a cord over one shoulder and the corresponding arm to support the base.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Dilly-bag materials include introduced twine and blanket-thread, opossum string,
    human hair mixed with twine, and plant fibre; blanket threads may be sorted by
    color for patterns or the receptacle may be stained or painted red.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage names native flax and another plant called mun-ji as plant-fibre
    sources and states that the author had not observed true tree-bark fibre used
    for utensils in the area.
  category: object
  evidence_refs:
  - ev:6
