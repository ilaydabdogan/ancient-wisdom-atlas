canonical_text:
  quote: ''
  summary: 'The passage describes several fighting and fishing weapons and throwing
    devices: a quartz-tipped wommera reed-spear associated with Northern Mitakoodi,
    Kalkadoon, and Savannah manufacture; non-indigenous spears entering the area through
    exchange and barter; and forms of wommera construction, drilling, handling, decoration,
    shell hafting, and barter routes among named groups.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The yun-ba-ra wommera-spear is found among the Northern Mitakoodi, may be
    bartered to the Kalkadoon, is sometimes made by the Northern Mitakoodi, and is
    most commonly manufactured around Savannah.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The quartz-tip wommera reed-spear is described as eleven feet long or more,
    with reed-butt and gidyea shaft of about equal lengths, and a gradually tapering
    tip set with small white quartz chips fixed with beef-wood gum.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Some spears found on the northern and north-western confines are described
    as non-indigenous and entering through exchange and barter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Coolullah, hand-spears for catching fish are described with barbed prongs
    of sharpened wood or filed iron-wire, belonging to Karunti boys from the other
    side of Normanton.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Camooweal, stone and barb-tipped spears of foreign origin are said to have
    arrived from more northerly and more westerly districts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The wommera in the Boulia, Leichhardt-Selwyn, and Cloncurry districts is described
    as a thin, straight gidyea lath about two and a half feet long, three-eighths
    inch thick, and one and a half inches wide.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: As one travels north from Boulia into Kalkadoon and Mitakoodi country, the
    wommera shaft is said to become wider at the centre than at the extremities.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the Boulia District, the peg is tied through two drilled or burnt holes
    with tendon and then cemented with spinifex or beef-wood gum; outside Boulia,
    the peg is fixed without holes using tendon or twine and cement.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that the wommera, the whirler, and the chekara-shell chest-ornament
    are the only local workmanship examples in which drilling is employed.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The wommera is handled between the fore-finger and middle digit, with the
    free end clasped into the palm and the spear steadied between the fore-finger
    and thumb.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Among the Northern Mitakoodi and Northern Kalkadoon, a common but not locally
    manufactured wommera variety has a haft made of beef-wood gum, with white chekara
    shell fixed on both sides.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The shell-hafted wommera reaches the area through the Nouun tribe at Mullangera,
    who obtain shell from Karunti and other people at Normanton; the ta-poon spear
    is described as belonging originally to this wommera and being bartered with it.
  category: relationship
  evidence_refs:
  - ev:9
