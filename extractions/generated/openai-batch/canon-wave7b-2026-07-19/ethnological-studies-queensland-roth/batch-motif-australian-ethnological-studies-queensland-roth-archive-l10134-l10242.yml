canonical_text:
  quote: ''
  summary: The passage describes who may perform in corrobborees, sex-differentiated
    costume and body-painting practices, male and female costume examples from several
    districts, preparation spaces and viewing restrictions, a bough-shed green-room,
    a night fire between audience and performers, and male dance movements accompanied
    by audience percussion on boomerangs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Adults of either sex may dance; women generally perform only in daytime, and
    men joining daytime dances are grease-painted rather than blood-feathered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says each tribe appears to have particular costume designs and
    that an imported corrobboree song may bring an adopted new dress.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Blood-feathering is described as used in male costumes and never in female
    costumes.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Male costumes may include feathered head ornaments, red-ochre grease, charcoal
    spirals or bands, white feather-down attached with blood, a human-hair waist-belt,
    feather bunches, and singed leaves on wrists and ankles.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The singed leaves worn by men are said to make a rustling or crackling noise
    while dancing; women are said never to use singed leaves in their decoration.
  category: object
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: Dance leaders are not distinguished from other performers by dress.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A common female pattern uses red ochre over the body and yellow-ochre tri-linear
    markings identified as the koodija-koodija mark of boomerangs, with apron-belt
    and forehead grass-blades as ornaments.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: A female costume used especially in women-only corrobborees includes red ochre,
    white stripes in kopi, black charcoal stripes, a takale headpiece with bilbi tails,
    an apron-belt, grass-blades, and a string held between the hands.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The dancing ground is located away from the main camp; the sexes prepare in
    separate places, and no one may watch dressing unless they have previously witnessed
    that same performance.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: After dressing, performers go to a green-room; in the Boulia District this
    is a bough-shed known by local names, and at night a fire stands between audience
    and performers for illumination.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: Male dancing is described as rhythmic stamping to beats made by the audience
    on boomerangs, with additional knee movements and occasional hopping steps.
  category: action
  evidence_refs:
  - ev:10
