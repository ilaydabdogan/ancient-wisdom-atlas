canonical_text:
  quote: ''
  summary: The passage describes wound treatment and scar-making practices, contrasts
    raised decorative scars with fighting scars, records red-ochre saurian mural paintings
    near Cloncurry, reports a rock-cut circle in a cave on the Toko Ranges, mentions
    examples of drawings by Aboriginal individuals, and notes color nomenclature for
    red, yellow, blue, and black.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Cloncurry, feather-down is described as being placed on a wound to prevent
    blood from running off; after pus appears, fat is rubbed into the wound and healing
    follows.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Mitakoodi, raised dotted scars on arms are made by placing a small
    piece of charcoal on the intended mark, lighting it, and allowing it to burn the
    skin until cicatricial tissue forms after two or three days.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Raised flash-marks are said to last many years but eventually decline; older
    men are described as having less strongly elevated scars than younger people.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Male fighting scars are described as non-elevated marks on the shoulders,
    flanks, buttocks, and lower masses of flesh, associated with stone-knife duelling
    and distinguished from decorative flash-marks by size, irregularity, and asymmetry.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Mural paintings in the North-West-Central Districts are reported at two localities:
    Oorindimindi Station and a small water-hole about six miles from Cloncurry.'
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the Cloncurry-area water-hole, seven or eight red-ochre saurian figures
    are reported on granite blocks, varying from about twelve inches to over six feet
    in length.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The best-preserved large saurian figure is under an overhanging rock ledge
    and is described as holding something that could pass for a stone tomahawk; local
    Aboriginal people reportedly did not know the paintings or their signification.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A circle about eighteen inches in diameter is reported as cut into solid rock
    in a cave on the Toko Ranges in Glenormiston country.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The representation of a circle is stated to occur on ornaments and implements
    coming from, and west of, the Upper Georgina Districts.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Three first-attempt drawings are described: an adult woman’s idea of a man
    in general, a representation of a goat, and a Pitta-Pitta male’s sketch of a figure
    in the Molonga corroboree.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The tribes discussed are said to have distinct names for red and yellow ochre;
    blue is often grouped with black in naming, though visible differences are appreciated.
  category: speech
  evidence_refs:
  - ev:7
