canonical_text:
  quote: ''
  summary: The passage describes intergroup travel, meeting places, markets, and barter
    exchanges among the Yaroinga, Workia, Undekerebina or Toko people, Kalkadoon,
    Mitakoodi, and neighboring groups in north-west-central Queensland. It lists routes,
    places, goods taken to markets, and goods received in exchange.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Yaroinga have trade relations northward with the Workia, meeting them
    at Lake Nash, Austral Downs, and Camooweal.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In exchanges with the Workia, the Yaroinga receive pearl-shell, eagle-hawk
    feathers, stone-knives, large koolamons, human-hair belts, and other items in
    exchange for spears, boomerangs, European-made goods, pituri, smaller koolamons,
    emu-feathers, and other goods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Yaroinga communicate southward with the Undekerebina natives of the Toko
    Ranges, who come by direct or indirect routes and exchange pituri, opossum-twine,
    blankets, and other goods for ochre, boomerangs, stone-knives, human-hair belts,
    and other items.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Yaroinga also barter eastward with the Kalkadoon, Yellunga, and other
    groups along the Rochdale direction.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Kalkadoon travel from their highland home to several places to meet neighboring
    groups, but are said to travel only short distances outside their own country.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Georgina River markets, the Kalkadoon exchange boomerangs, stone-knives,
    hair materials, koolamons, wommera-spears, and long gidyea spears for blankets,
    twine, weapons, grindstones, ochre, bags, necklaces, and shields.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Among the Mitakoodi, whose head encampment is at Fort Constantine, five markets
    are noted, and the Mitakoodi take ochres, stone, koolamons, belts, weapons, and
    other items for barter.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Mitakoodi receive different goods at different markets, including shell-wommera
    and spear, shell chest-ornaments, fishing-nets, other wommeras and spears, forehead
    nets, flax-twine, hair belts, string waist-belts, and ochre.
  category: action
  evidence_refs:
  - ev:4
