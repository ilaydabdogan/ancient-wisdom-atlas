  quote: ''
  summary: The passage catalogs manual signs for animal terms in several named Queensland
    groups. The signs are described as iconic gestures that represent animal body
    parts, movement, traces, or uses, including toe-pads, hooves, horns, teeth, nibbling,
    spines, long snouts, bellies, burrowing toes, claw marks on tree-bark, twine made
    from opossum hair, faces, long feet, and hopping.
  language: English
  quote_policy: summarized
