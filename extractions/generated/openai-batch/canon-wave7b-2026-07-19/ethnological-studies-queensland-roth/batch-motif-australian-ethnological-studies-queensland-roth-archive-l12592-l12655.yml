canonical_text:
  quote: ''
  summary: 'The passage describes several Aboriginal fighting implements from North-West-Central
    Queensland: a tapered nulla-nulla throwing weapon; stone-knives made from flint
    flakes set in cement handles, sometimes with bark-and-string sheaths; the sources
    and exchange routes of stone-knife material; replacement of stone blades by iron
    after contact; and the former manufacture of stone tomahawks from greenstone,
    including quarrying, shaping, grinding, hafting, and local names.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The nulla-nulla is described as enlarged and tapering to a point, often incised
    with circular bands at the handle and longitudinal fluting.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Boulia District the weapon is called mor-ro, and the Mitakoodi call
    it ma-ro.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the named districts the nulla-nulla is used more as a short-distance throwing
    implement than as a close-quarter striking implement.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stone-knife consists of a chipped flint-flake blade fixed into a rounded
    or oval handle made of cementing substance.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The flint flake blade varies from about two to over six inches in length and
    has multiple facets.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The cement handle may be smoothed to fit the hand or lengthened by adding
    a piece of wood.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The stone-knife may have a sheath made of fine bark strips wound with opossum-string
    and containing inward-projecting emu feathers to protect the point.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Flint for the blades is said to be obtainable in several named northern and
    central Queensland locations, but not on the Mulligan.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Stone-knives travel from the Leichhardt-Selwyn and Upper Georgina districts
    to other groups and places for exchange and barter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In eastern portions of North-West-Central Queensland, stone blades are gradually
