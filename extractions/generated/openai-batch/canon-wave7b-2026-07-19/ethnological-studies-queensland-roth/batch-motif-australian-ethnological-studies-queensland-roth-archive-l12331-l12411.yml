canonical_text:
  quote: ''
  summary: Ethnographic passage describing several north-west-central Queensland spear
    types, including spatulate-tip hand-spears, a spatulate-tip wommera-thrown spear,
    and multiple wommera-thrown reed-spears, with local names, construction materials,
    decorative patterns, throwing methods, regional distribution, barter for reed,
    and hook attachments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hand-spear is named differently by Mitakoodi and Goa groups, and its throwing
    position is described as balanced on the palm along the thumb.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tum-ba-ra spear of the Boulia District is a hand-spear with a spatulate
    rather than gradually tapering tip; its blade may be decorated with a red sinuous
    pattern on a white background.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The spatulate-tip hand-spear is made in one piece from similar materials to
    the preceding hand-spear and follows the same transit routes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among the Mitakoodi the spatulate-tip hand-spear is called e-ra-ka-la or ji-ni-bur-i;
    the passage notes that e-ra-ka-la means “flat” in Pitta-Pitta and relates this
    to the spatulate tip.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The base of the spatulate blade may bear a graved mitre-form pattern, and
    extra-long examples were encountered that were designed for killing cattle.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The per-cha ma-ro is described as a heavy wommera-thrown spear made of three
    pieces: butt, shaft, and tip.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The per-cha ma-ro has a lightly made butt with a concavity for the wommera,
    a shaft that may be ornamented with longitudinal fluting, and a loosely fixed
    spatulate tip bearing a bound wooden hook.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The loose attachment of the per-cha ma-ro tip is explained as making extraction
    difficult after impact and preventing breakage of the butt or shaft for later
    reuse.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Per-cha ma-ro spears are said to be made in the Upper Georgina district; westwards
    the Undekerebina use them, and eastwards they occur among the Kalkadoon, who are
    said probably also to make them.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The li-bi-ja-ra is a heavy, long reed-spear of the Cloncurry District, sometimes
    over twelve feet, with a reed butt and a thin gidyea shaft joined by gum and tendon.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The li-bi-ja-ra is thrown with a wommera in one hand while the spear is supported
    on the other hand extended forward.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The ma-ba-na is a thicker, longer, heavier reed-spear of similar construction,
    now rare, originally designed for spearing cattle.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The ki-tu-ma and ja-loon are smaller and lighter varieties of the li-bi-ja-ra,
    distinguished in part by different proportions of reed butt and wooden shaft.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The water-reed used for Cloncurry District spear butts is not common locally
    and is brought from Woolgar and nearby places where it is bartered for.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: A small kun-dor-a reed-spear from the upper Burke and Wills rivers is said
    to appear identical with the ki-tu-ma or ja-loon, although the author states he
    had not personally handled it.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: One or two hooks may be attached to reed-spears; a hook is made from bush
    wood, shaped as a slightly curved tapering piece, and fixed to the spear tip with
    gum and tendon.
  category: object
  evidence_refs:
  - ev:9
