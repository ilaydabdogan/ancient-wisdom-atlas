canonical_text:
  quote: ''
  summary: 'The passage gives ethnographic notes on pituri: its seasonal arrival and
    source areas, barter routes through named districts and groups, preparation by
    roasting, wetting, mixing with burnt leaf ashes, rolling into quids, carrying
    and chewing, and comments on craving, smoking, and non-use for contaminating waterholes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pituri is described as not an article of food, arriving in Boulia around the
    beginning of March in a rough chip-like condition; the shrub flowers about January
    and the Boulia supply is obtained near Carlo on the upper Mulligan.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The plant is reported to grow farther east only in scattered patches, including
    near Glenormiston and in a gully at Cloncurry on Rifle Mountain according to Mitakoodi
    Aboriginal people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Messengers from Boulia, Marion Downs, Herbert Downs, and Roxburgh are sent
    to Ulaolinya tribes at Carlo with spears, boomerangs, blankets, nets, and red
    cloth goods for exchange or barter for pituri.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After reaching Roxburgh, Boulia, or Marion Downs, pituri may travel through
    named routes to groups and places including the Kalkadoon, Mitakoodi, Warenda,
    Tooleybuck, the Middle Diamantina, Elderslie, and Winton.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At its destination, pituri chips are roasted in ashes, wetted with water or
    with the mouth, teased with the fingers, mixed with ashes from heated and burnt
    wattle or gidyea leaves, and worked into small rolls or quids for chewing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sometimes native flax threads are added to the quid for compactness, and when
    not chewed the rolls are worn above the top of the ear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Quarmby, the Kalkadoon are said to prepare tobacco similarly to pituri,
    making a quid with gidyea leaf ashes for chewing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author states that Aboriginal people show a strong craving for pituri,
    compares it with alcohol craving among Europeans, and says drovers, station-managers,
    and others make practical and economic use of this fact.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mr. Keardon, manager of Carlo in 1895, reports that when tobacco runs out
    on the Mulligan, Aboriginal people smoke pituri in their pipes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage explicitly states that pituri is not used in these districts to
    contaminate waterholes for drugging birds or animals that drink there.
  category: action
  evidence_refs:
  - ev:5
