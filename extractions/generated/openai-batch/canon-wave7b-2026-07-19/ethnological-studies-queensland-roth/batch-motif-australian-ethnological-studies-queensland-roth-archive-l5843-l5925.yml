canonical_text:
  quote: ''
  summary: The passage defines the Auto-nym, or personal name, for the Boulia District.
    It says individual names are mostly based on physical peculiarities or natural
    objects, notes reluctance to mention deceased persons and their names, distinguishes
    women's birth names from young men's pet names and initiation names, lists male
    and female name examples with meanings, and briefly introduces a status-based
    titular name called the Clima-nym.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Boulia District, names applied to individuals are said to be based
    mostly on physical peculiarities or objects of nature.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author reports uncertainty about parent-offspring naming links because
    survivors are unwilling to mention deceased persons, their names, exploits, or
    other particulars.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women's names are given at birth and usually do not change through life, except
    when a physical defect or unusual habit becomes prominent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Young males may have pet names, but these are dropped at the first initiation
    ceremonies, when they receive permanent names.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author states that he has not met two people with the same adult individual
    names.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Male name examples include references to cutting sticks, sitting in shade,
    enduring like stone, striking with the hand, being speared, having blood, eating
    fish, chattering, raising dust, climbing trees, using a fire-stick, and not greasing
    oneself.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Female name examples include references to a pink flower, an emu-like long
    neck, a caterpillar-like slowness, mourning with white plaster, going away, a
    rapidly moving small snake, soliciting a man, running from a thrown boomerang,
    crying, skipping like a frog, not dipping feet in water, and having a good nose.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage introduces the Clima-nym as a step-ladder or titular name depending
    on an individual's social degree or status on the social ladder.
  category: relationship
  evidence_refs:
  - ev:7
