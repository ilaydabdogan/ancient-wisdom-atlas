canonical_text:
  quote: ''
  summary: 'The passage describes three reported means of causing illness or death:
    a pearl-shell plate used with horizontal and vertical passes, powders placed near
    a sleeping target, and a pointed bone-pin concealed in the ground. It also records
    named groups associated with these practices, restrictions on users, methods for
    identifying an assailant, and recovery after removal of the buried implement.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The pearl-plate is described as a flat, roughly triangular piece of pearl-shell
    with rounded angles, cementing material, and hair-twine attached at one corner.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the pearl-plate, like the death-bone, is used to account
    for forms of sickness and death that are otherwise treated as inexplicable in
    the reported belief system.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage names several groups in relation to the spread or use of the pearl-plate,
    death-powder, and bone-pin practices, including Workia, Kalkadoon, Mitakoodi,
    Yaroinga, Undekerebina, and Yellunga of Noranside.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
- id: obs:4
  text: The usual pearl-plate procedure is described as an assailant approaching at
    night, holding the implement at arm's length, and making two horizontal and two
    vertical passes toward an unconscious target.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The horizontal passes are stated to symbolize cutting the throat, and the
    vertical passes are stated to symbolize ripping up the belly-wall.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: Undekerebina performers are described as limiting the sweep of the pearl-plate
    with a forearm or with the legs, in order to avoid harming an innocent or harmless
    person.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The death-powder is described as very white-ash-like material placed near
    where a victim is sleeping, such as under a blanket, and is said in the passage
    to kill quickly.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says a performer may sprinkle the powder from a mussel-shell to
    avoid self-contact, and that the Mitakoodi also use a reddish powder with similar
    methods and design.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chi-roo-ko bone-pin is described as a short pointed emu bone or bird beak
    with gum at the base, while the Mitakoodi je-go variant is described as made from
    a human arm-bone with gum at the blunt end.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The bone-pin may be hidden underground point-up where the target has excreted
    or beneath a sleeping place; the passage connects these placements with venereal
    disease, general illness, or death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says the chi-roo-ko and je-go can be used by medical as well as
    lay persons, but never by women.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The assailant may be discovered by consulting a doctor or through a dream;
    retaliation is said to use similar means, and removal of the implement from the
    ground is followed by speedy recovery of the sick person.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The author says the exact composition of the powders was unknown to him, notes
    that a specimen near Normanton was found to be ground glass, and reports a suspicion
    linking the superstition to strychnine colored with red ochre in station stores.
  category: other
  evidence_refs:
  - ev:5
