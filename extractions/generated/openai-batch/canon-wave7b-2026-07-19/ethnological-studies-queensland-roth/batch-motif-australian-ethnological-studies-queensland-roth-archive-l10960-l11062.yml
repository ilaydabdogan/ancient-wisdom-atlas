canonical_text:
  quote: ''
  summary: 'The passage describes several recreational and ceremonial objects and
    games in North-West-Central Queensland: returning boomerang flight, toy throwing-sticks,
    the bent kun-di kun-di, whirring boards or roarers, ball games, catch-ball, and
    a stick-and-stone game. It notes materials, methods of throwing or play, local
    names, sex and age of users in some cases, and special uses of larger graved whirring
    boards in initiation and as love-charms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fighting boomerang can be thrown so as to return or come back, while the
    particular toy variety can make three or sometimes four complete gyrations, each
    lower, smaller, and reversed in direction from the preceding one.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The toy throwing-stick is described as a thin, rounded, straight stick, usually
    gidyea, with an elongately knobbed extremity and a length of about 12 to 20 inches.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The smaller toy throwing-stick is thrown upward against overhanging bushes,
    leafy branches, or foliage held by a companion, after which it shoots through
    the air knob first and travels farther.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The larger toy throwing-stick is thrown downward against a tussock or low
    bush and then shoots along or close to the ground.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The kun-di kun-di is a thick, rounded, strongly bent toy, 18 to 20 inches
    long, pointed at both ends, held convex side forward, and thrown down against
    a log or branch so that it rises and revolves in a more or less horizontal plane.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The whirler is made from flattened timber cut into a spindle shape, drilled
    at one end, attached by string to a small stick, and made to revolve rapidly so
    that its flat surface catches the wind and produces noise.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Smaller whirring boards are about 4 inches long, lack gravings, may be red-ochred,
    and are used as toys by either sex and at any age.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Larger graved whirring boards, 7 to 8 inches or more, are used at certain
    initiation ceremonies and, among the Yaroinga tribes, may be used as love-charms;
    both are said to be kept from the view of women.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: 'Three ball-games are listed: catch-ball, stick-and-stone, and spin-ball;
    the first two are identified as indigenous and the last as recently imported.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Catch-ball is played everywhere by both sexes, either singly or with sides,
    by throwing the ball and trying to intercept it before it touches the ground.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The catch-ball players’ jumping to catch the ball is compared in the passage
    to kangaroo antics, and the Kalkadoons sometimes call it kangaroo-play.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the stick-and-stone game, men in two groups, each armed with sticks, alternately
    throw a rough stone from one side to the other, and each individual tries to intercept
    it with his stick as it skips or rolls on the ground.
  category: action
  evidence_refs:
  - ev:10
