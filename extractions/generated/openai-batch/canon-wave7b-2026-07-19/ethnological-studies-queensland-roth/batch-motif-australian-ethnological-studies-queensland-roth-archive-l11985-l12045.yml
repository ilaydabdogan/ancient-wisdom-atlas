canonical_text:
  quote: ''
  summary: 'The passage lists boomerang surface or form categories as ornate, fluted,
    and plain, followed by a fragmentary terminology table. Section 240 describes
    materials and manufacture of fighting boomerangs: gidyea is named as a common
    material, with mulga and white-gum also used; timber names may give names to implements;
    a standard weapon is cut from a tree trunk, shaped with a chisel, and smoothed
    with sharp-edged flint or glass. White-gum blocks may yield two boomerangs, defects
    in shape may be corrected, and a hooked variety is cut with an adjacent branch
    or rootlet forming the hook.'
