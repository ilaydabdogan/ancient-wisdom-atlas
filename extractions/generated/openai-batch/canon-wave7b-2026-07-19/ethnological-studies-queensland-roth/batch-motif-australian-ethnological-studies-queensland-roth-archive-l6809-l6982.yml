canonical_text:
  quote: ''
  summary: The chapter introduces a sign-language among North-West-Central Queensland
    Aboriginal groups as context-dependent ideagrams. It describes uses in travel,
    war, hunting, and some initiation ceremonies; records regional distribution among
    named tribes; notes signs common across large areas; and gives examples of hand,
    head, face, and trunk gestures for ideas such as interrogation, silence, affirmation,
    negation, anger, direction, and insult.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the collected signs are better described as idea-grams, with
    each sign conjuring an idea that is modified by the context of the mute conversation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sign for a boomerang may express the object itself or actions involving
    it, such as hitting, killing, swapping, manufacturing, or stealing, depending
    on context.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sign of interrogation conveys the idea of a question, while the specific
    query depends on surrounding signs or context.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The ideagrams are described as useful for people travelling through country
    whose spoken language they do not know and for situations such as the war-path
    or the chase where silence is important.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Use of the signs is said to be strictly enforced on certain special occasions,
    including some initiation ceremonies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author reports personally proving the existence of these ideagrams across
    North-West-Central Queensland districts and also on the Middle and Upper Diamantina,
    with possible occurrence beyond those limits through walk-about travel.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Information on the sign-language was collected from named tribes occupying
    Boulia, Upper Georgina, Leichhardt-Selwyn, Cloncurry, Flinders, and Upper Diamantina
    districts.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: In notes to illustrations, a tribal abbreviation in parentheses indicates
    a sign was sought but not found; without parentheses, general use of the sign
    was confirmed.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: Many ideagrams are stated to be identical over large tracts of country, with
    examples including signs for animals, water, creek, kin, boomerang, hut, sunrise,
    interrogation, silence, anger, affirmation, and negation.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The signs express ideas relating to animals, plants, natural objects, camp
    and family relations, weapons, implements, utensils, actions, conditions, number,
    place, interrogation, and abstract notions.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: Most signs are executed with one or both hands, but some can be made with
    the head, face, trunk, or shoulders; when only one hand is needed, either right
    or left hand may be used.
  category: action
  evidence_refs:
  - ev:9
  - ev:11
- id: obs:12
  text: Examples of bodily signs include head movements for affirmation and negation,
    nostril sniffing for wild-orange smell, beard biting for anger, lip pouting for
    direction, and shoulder shrugging for doubt or interrogation.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Among the Pitta-Pitta at least, the passage describes a gesture by one woman
    toward another involving abdominal protrusion, exposure of the person, and vibration
    of knees and thighs as a serious insult.
  category: action
  evidence_refs:
  - ev:10
