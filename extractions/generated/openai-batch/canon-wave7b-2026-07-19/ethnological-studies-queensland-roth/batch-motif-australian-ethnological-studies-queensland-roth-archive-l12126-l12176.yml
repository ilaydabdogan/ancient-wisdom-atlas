canonical_text:
  quote: ''
  summary: The passage describes engraved markings on boomerangs or fighting weapons,
    including longitudinal, transverse, central, and interstitial designs. It records
    regional distributions and local names for marks associated with river banks,
    fishing nets, mountain tops, leaves, white shells, handles, animal toe-tracks,
    female ochre body markings, and a single zigzag line.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Longitudinal figures are described as invariably present, reaching from tip
    to tip, and consisting of straight lines and elongate ovals strung end to end.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Festoons are reported only on implements made in and south of the Boulia District,
    limited to the weapon edges, with interstices filled by parallel concentric lines
    representing ripples at the water's edge.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Pitta-Pitta name for the festoon water-edge design is given as nar-pi
    ming-ka-ra, translated as river-bank marks.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Shuttle-shaped ovals are filled with more or less longitudinal lines and
    receive different names: in Boulia, mountain-tops according to some authorities,
    but more generally folded fishing-net marks; in Cloncurry, leaf marks or white-shell
    marks depending on the angle of enclosed lines.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: One, two, or three strings of shuttle-shaped marks may run along the length
    of the weapon.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Transverse figures are said not to occur outside the Boulia District, and
    are limited to the extremities and center of the boomerang, though not always
    present.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Extremity transverse figures consist of one to four more or less parallel
    lines, are called handle-marks in the Boulia District, occur also on nulla-nullas
    and fighting-poles, and are primarily intended to prevent the hand from slipping.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Central transverse engravings consist of two lines placed parallel or crosswise;
    the crosswise form creates two triangles with touching apices, and enclosed spaces
    may be subdivided and filled with closely parallel lines.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that central transverse engravings do not necessarily create
    bilateral symmetry in the full design.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Interstitial figures include kangaroo and emu toe-tracks, with two and three
    digits respectively, called ma-choom-ba and kool-pa-ri marks in Pitta-Pitta.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The koodija-koodija mark represents a female flash-mark of red or yellow ochre
    smeared on the body with the three middle fingers; the passage notes that it is
    never spoken of as a snake.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The koo-ding-be-ri is described as a single zigzag line formed of circumflex
    accents, each made with two separate cuts.
  category: object
  evidence_refs:
  - ev:8
