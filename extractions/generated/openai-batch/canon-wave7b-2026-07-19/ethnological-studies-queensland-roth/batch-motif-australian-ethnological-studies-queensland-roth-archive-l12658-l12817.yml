canonical_text:
  quote: ''
  summary: The passage introduces a chapter on disease, accident, death, and cannibalism,
    then describes the death-bone apparatus used to cause sickness or death, its components
    and materials, restrictions around handling it, and accounts of how doctors learn
    to use it. One account has a doctor made by Mulkari after isolation and fasting;
    another connects doctor-power and illness to Kanmare, a supernatural water-snake
    who may point a death-bone at an unseen victim near water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The death-bone is described as a dreaded and widespread explanation for otherwise
    unaccountable sickness and death in North-West-Central Queensland and adjoining
    districts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The death-bone can be manufactured by a doctor, medicine man, or other male
    individual.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A male who finds a death-bone not his own would wash and destroy it to prevent
    it being used against him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A woman is said to fall sick if she touches or even looks at the death-bone.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The apparatus consists of a pointer connected by string to an elongated cylindrical
    receptacle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The pointer is usually made from a human forearm bone or emu bone ground to
    a tapering point; among the Kalkadoon it may be shaped like a fish-hook.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The connecting string is made of human hair, opossum twine, or both, and connects
    the pointer to the receptacle base with cementing substance.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The receptacle is generally made from human arm or shin bone, but animal bone,
    bamboo-cane, gun-barrel, or tinware may substitute when human bone is unavailable.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: When the instrument is used, the receptacle is said to enclose the victim's
    life-blood.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Boulia District, a person learns to point the death-bone by leaving
    camp for three or four days, eating only bushes, and becoming mentally disturbed
    from near-starvation.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In that condition the person sees Mulkari, who makes him a doctor by inserting
    small flints, bones, or other objects inside him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Mulkari is described as a supernatural power who makes things that Boulia
    District Aboriginal people cannot otherwise explain; he is called good and beneficent
    and is said never to kill anyone.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Other doctors obtain powers through Kanmare, described as a huge supernatural
    water-snake with a mane-like head of hair.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Kanmare is said to drown people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: In the example given, Kanmare may point a death-bone at a man fishing by the
    river, unseen and at a distance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: After the unseen pointing, the man sees the monster moving on the water surface
    at night, runs to camp, sleeps, becomes sick in the morning, worsens over several
    days, and is attended by a doctor who removes something from inside him.
  category: sequence
  evidence_refs:
  - ev:7
