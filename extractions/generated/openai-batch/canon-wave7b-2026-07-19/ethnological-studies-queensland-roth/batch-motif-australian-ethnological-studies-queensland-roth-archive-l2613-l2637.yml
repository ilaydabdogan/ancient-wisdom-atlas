canonical_text:
  quote: ''
  summary: 'The passage describes number vocabulary and counting practices: quantities
    beyond four are generally expressed as a large-number term, but higher quantities
    are demonstrated through counting fingers and toes, lowering fingers by pairs,
    and marking paired strokes in sand. The author notes a comparison to Japanese
    and English finger-counting habits and says elders use the method to count people
    in camp. The passage then lists vocabulary for counting, dividing or sharing,
    fewness, crowds or totality, possessions, and collective togetherness.'
