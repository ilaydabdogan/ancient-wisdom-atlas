canonical_text:
  quote: ''
  summary: The passage closes a description of a shelter made with a ring of earth,
    slanting sticks, grass, bushes, and sometimes bark. It then begins Chapter VII
    on personal ornamentation and decoration, describing how head hair, especially
    among males, is greased and arranged for later removal and use as hair-twine.
    It gives a sequential account of making human hair into double-twist twine with
    a barbed ming-ko stick, water in a koolamon, and thigh-twisting. It lists head
    ornaments and describes feather tufts used at rejoicing and corroborees, plus
    kangaroo or dingo knuckle-bone ornaments fixed near the temples.
  language: English
  quote_policy: summarized
