  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ming-ko is rolled between thumb and forefinger while varying hair lengths
    are sorted, arranged, and rolled by moistened fingers into a single thread, which
    is wound onto the needle; the barb prevents slipping.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Two balls of hair-twine are placed in a koolamon containing water; their strings
    are fixed to the ming-ko, twisted separately along the thigh in opposite directions,
    and wound together to make double-twist hair-twine.
  category: sequence
  evidence_refs:
  - ev:4
