canonical_text:
  quote: ''
  summary: 'Sections 283-285 describe several reported healing practices: smearing
    or drinking human blood, smearing perspiration, mention of drinking seminal fluid
    in sickness, wet-cupping by superficial incisions, application of animal fat or
    grease to wounds and aching limbs, and Mitakoodi headache poultices made from
    box-tree bark or heated leaves.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Human blood is described as being smeared over the body, trunk, limbs, and
    face for obscure affections and internal pains.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blood is removed from an apparently healthy individual, specified as never
    a woman, using a tight ligature and an incision into the posterior ulnar vein.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The collected blood is placed in a koolamon, and the donor's wound is dressed
    with fat and bound with leaves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A bundle of emu feathers is used to dab the blood over the patient from head
    to heels, after which the patient's gin or a male friend rubs it in with the hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The patient may drink some or all of the blood; if all is drunk, rubbing may
    be postponed to another occasion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that blood-smearing is in use throughout North-West-Central
    Queensland and that the Kalkadoon also cover the whole body and head with red
    ochre without rubbing.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sweat removed from under the armpits is smeared in a similar manner to blood
    and is said to be believed curative, especially in extremity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The drinking of seminal fluid in sickness is mentioned, with details deferred
    to another chapter.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Wet-cupping is described as superficial incisions made with stone knives or
    similar tools over an inflamed and painful knee or shoulder joint.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Iguana, snake, or other fat or grease, mixed with mud and dirt, is used as
    a dressing for cuts and wounds; greasing incisions is described as common.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Fat may be rubbed over tired or aching limbs as a liniment.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Among the Mitakoodi, a headache poultice is made from hammered box-tree bark
    soaked in hot water and held by hand to the affected part.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Among the same group, heated fresh leaves may be tied to the forehead for
    a similar headache purpose.
  category: action
  evidence_refs:
  - ev:7
