canonical_text:
  quote: ''
  summary: The passage describes the fifth and last night performance of a corroboree.
    Molonga is identified as the central figure and is described with red ochre, feathers,
    a back pattern, and a feather-tipped spear. Other dancers and two leaders are
    distinguished by headgear and painted or feathered features. At sunset male musicians
    begin singing, women join, performers enter one by one and make obeisance, and
    the dance begins with alternating arm postures and sung words.
