canonical_text:
  quote: ''
  summary: The passage describes reported regional procedures for using a death-bone
    or bone-apparatus, called munguni, in several north-west-central Queensland districts.
    It details how practitioners direct a pointer, receptacle, and connecting string
    toward an intended victim, sometimes with assistants, and notes variations involving
    a tree or forked stick, a cut cord, a low-toned dirge, and a shooting motion of
    the pointer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Boulia District, a single-handed doctor fixes the receptacle of the
    bone-apparatus upright in the ground and directs the pointer at the selected person.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the close-range Boulia procedure, the connecting string is held in the
    hand and is not allowed to touch the earth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the victim cannot be approached closely, a longer string is used; the
    receptacle is fixed to a stump or tree, and the pointer rests on a forked stick
    while directed as required.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The practitioner is said to prefer working alone, but may call in other medicos
    if uncertain or unsuccessful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When two or more medicine-men work the instrument, different participants
    hold the pointer, receptacle, or connecting string.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: An intimate friend of the proposed victim may secretly cut the twine during
    the performance; if the string breaks again after being retied, the intended victim
    is spared.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: If unsuccessful, the doctor returns to his employer and explains why the attempt
    to obtain the required blood was unsuccessful.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Cloncurry District, the Mitakoodi doctor uses a similar procedure,
    holding the receptacle between the knees, the string in the hand, and resting
    the pointer on a branch or stick while singing a low-toned dirge.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Upper Georgina District, the Yaroinga doctor may shoot the pointer
    along the prongs of a forked stick with the palm of one hand, while an assistant
    pulls it back by the connecting string.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Leichhardt-Selwyn District, the Kalkadoon doctor usually has another
    person help him, with one holding the pointer and the other the receptacle.
  category: relationship
  evidence_refs:
  - ev:6
