canonical_text:
  quote: ''
  summary: 'The passage describes practical hunting and food-gathering methods in
    North-West-Central Queensland: driving birds into nets, concealing hunters with
    vegetation in water, catching or noosing waterbirds, luring pelicans by imitating
    fish, tracking and digging out small mammals, climbing trees for opossums, driving
    or netting kangaroos, and spearing dingoes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men make loud noise and throw sticks or boomerangs into trees to drive roosting
    birds toward a water-hole and a fine-meshed net held by two men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hunter conceals his head, neck, and face with grass twigs and leafy boughs,
    swims to a log or snag, and catches birds that come down to drink.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Birds caught from the water are pulled under, their necks are wrung, and they
    are placed in the hunter's waist-belt.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Birds flying in mobs may be caught by throwing a light boomerang into the
    flock while it is on the wing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ducks, cranes, diver-birds, and others may be noosed with a long slender stick
    fitted with a feather-quill slip-noose.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The noosing hunter waits in the water with leafy bushes tied around his head
    and face until the bird comes within reach.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A pelican hunter sits concealed in water near a creek or water-hole and throws
    empty mussel shells onto the water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pelican is said to mistake the shells for fish jumping on the surface,
    while the hunter taps the water with his fingers to imitate splashing fish.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the pelican comes close, it is hit with a boomerang or sometimes caught
    by hand.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At night, hunters with bodies greased with ashes and heads covered with bushes
    swim silently up to sleeping pelicans and kill them with boomerangs or nullas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Birds are roasted whole, and larger birds have the skin removed by an incision
    down the back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Bandicoots, porcupines, bilbi-rats, and similar animals are tracked and dug
    out of holes in the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Opossums are caught by climbing trees, sometimes using steps cut alternately
    on the trunk.
  category: action
  evidence_refs:
