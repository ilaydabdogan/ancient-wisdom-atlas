  quote: ''
  summary: The passage describes incised marks on boomerangs and their local names
    or meanings, then gives typological, geographic, exchange-route, material, color,
    and use details for fluted, plain, and hook boomerangs in several Queensland and
    Central Australian districts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several interstitial incision marks on boomerangs are named and interpreted,
    including marks said to signify a hornet or bee, an eye, a cross-cut, a kangaroo-toe
    type, and a feather-pattern line.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The wer-koo or cross-cut mark is described as identical to a mark made on
    the thighs of near male relatives in mourning, and is also sometimes locally described
    as indicating Marion Downs at the crossing of the Hamilton and Georgina rivers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that it is exceptional to find more than two or three varieties
    of the described interstitial incisions on a boomerang at the same time.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Leichhardt-Selwyn and Cloncurry Districts, the interstitial marks are
    said to be limited to the kangaroo-toe type and the feather-pattern line.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The fluted boomerang is said not to be made at Boulia and to be associated
    especially with the Leichhardt-Selwyn and Upper Georgina Districts.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: For exchange and barter, the fluted boomerang is described as traveling up
    and down the Georgina, branching eastward to the Mitakoodi, and moving toward
    the Mulligan, Burke, Springvale, and Diamantina routes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fluted boomerang is described as red with ochre grease, made of gidyea
    or white-wood, shorter than the ornate Boulia variety, with an off-center bend,
    rounded tips, and longitudinal fluting.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A long, thin, red, fluted boomerang called the pa-run-da is manufactured at
    Bedouri, Birdsville, and on the Lower Georgina, and its route is described as
    southward down the Diamantina.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The plain boomerang is described as smoothed, blackened with charcoal, made
    of gidyea wood, and coming from the Cloncurry District.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that whether the Kalkadoon obtain the plain boomerang from
    Mitakoodi neighbors or make it themselves is doubtful, though their own name for
    it makes manufacture by them somewhat likely.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The hook boomerang is said to resemble the fluted variety in fluting and color
    and to be made chiefly in the Upper Georgina Districts by the Workia and Yaroinga.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: The hook boomerang has a backward-projecting hook or ear, about four to five
    inches long, on the convex edge at the shaft extremity, with longitudinal fluting
    continuous with the main shaft.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The hook boomerang is described as used as a fighting weapon, and the Workia
    also use it for throwing into flying mobs of flock-pigeons.
  category: action
  evidence_refs:
  - ev:8
