canonical_text:
  quote: ''
  summary: The passage describes amulets and charms made chiefly of emu feathers and
    opossum-string, their use for bodily pains, one amulet’s earlier use as a good-faith
    token for soliciting military aid, plant and clay remedies for several ailments,
    and the opening steps of a Boulia District burial procedure in which a body is
    laid on bushes over a net and enclosed with the net by means of a spear.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The min-ma, min-ta-ra, or mul-ta-ra is described as a bundle of emu feathers
    tied loosely with opossum-string or enclosed in a curved spindle-shaped net and
    tied on the body where pain occurs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Examples of min-ma placement include over the forehead for headache and over
    the belly for stomach-ache.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mundakooea is a rare flattened-spindle amulet made from emu feathers wound
    with opossum-string, coated with red-ochre grease, and sometimes enclosing a slender
    bone.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mundakooea was formerly sent to a friendly tribe as a sign of good faith
    when help was needed against a common enemy, and one privileged person in each
    camp wore it on the chest by a string around the neck.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mundakooea later came to be credited with remedial properties and was
    gradually imitated and supplanted by the more common woraka.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The woraka is described as similar to the mundakooea but usually more rounded
    or cigar-shaped, sometimes painted red or in alternating red and yellow transverse
    bands, and worn over the chest for obscure pains or cough.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The woraka could still be used for collecting aid in warfare; the Kalkadoon
    know it as u-la-ri and manufacture it, and it is believed to have been introduced
    to them by the Workia.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Blood-wood tree gum is used as powder on venereal sores and boiled with water
    for internal use.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A penny-royal species is drunk as a decoction for coughs or colds, and in
    Mitakoodi country a rosella species growing on mountains is made into a decoction
    for the same purpose.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Strongly scented plants are used for sniffing in cases of headache.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A common belief reported in the passage is that grass or shrubs growing near
    water will relieve difficult or painful micturition, with Euphorbia species often
    used.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Large clay or mud pills, one or two at a time, are prescribed for diarrhoea;
    Mitakoodi people use similar clay pellets along with gidyea and eucalyptus gum
    for similar gastric disturbances.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the described Boulia burial procedure, bushes are heaped over a net on
    the ground, the extended body is laid on the bushes, and a spear fixes the net
    so as to enclose the corpse like a net-sheet.
  category: sequence
  evidence_refs:
  - ev:8
