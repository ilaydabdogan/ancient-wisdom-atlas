  summary: The passage presents kinship nomenclature tables and explanatory notes
    for several north-west-central Queensland Aboriginal groups. It compares terms
    for children and siblings' children, describes affinal naming equivalences, and
    explains an ego-centered genealogical tree centered on a Pitta-Pitta Koopooroo
    male named Charlie. It then maps Aboriginal relationship terms to European relationship-equivalents,
    noting that identical Aboriginal terms may cover several English categories.
  language: English
