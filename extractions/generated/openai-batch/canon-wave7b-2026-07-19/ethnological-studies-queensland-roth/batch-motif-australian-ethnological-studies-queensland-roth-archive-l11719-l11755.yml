canonical_text:
  quote: ''
  summary: An illustrative ethnographic account describes how a message-stick may
    be used to request pituri through a messenger, authenticate the sender, support
    delayed payment in goods, and carry ordinary messages or private communications.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Charlie, residing at Boulia, wants pituri but cannot go himself, so he sends
    his brother Peter with a message-stick to Carlo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Peter travels by Herbert Downs and Glenormiston to the Mulligan River destination
    and presents the message-stick while saying he has come for pituri.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A first respondent asks who sent Peter, refuses because other letter-sticks
    are already waiting for pituri, and directs him to another person.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The vendor questions Peter, takes charge of the stick, and says that pituri
    can be supplied in a few days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: While waiting, Peter makes friends with a local camp brother or sister.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A dilly-bag-full of pituri is handed over with the letter-stick, and Peter
    returns to Charlie at Boulia.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After receiving the parcel, Charlie sends payment goods such as boomerangs,
    spears, and a Government blanket, together with the identical message-stick, either
    by Peter or another messenger.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The seller recognizes the stick and accepts the goods as payment for the earlier
    bag of pituri from the right party.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If payment is not received or is considered insufficient, the seller remembers
    Charlie of Boulia as unreliable and avoids future dealings with him and his friends.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The seller usually does not ask for specific exchange goods, because each
    head-encampment has its own well-known line of goods.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The letter-stick may also be sent with an ordinary message or private communication
    instead of for trade or barter.
  category: action
  evidence_refs:
  - ev:8
