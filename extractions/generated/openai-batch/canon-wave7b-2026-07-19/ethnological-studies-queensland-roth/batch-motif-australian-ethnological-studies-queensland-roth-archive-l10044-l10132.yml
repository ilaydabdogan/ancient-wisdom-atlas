canonical_text:
  quote: ''
  summary: The passage opens a chapter on recreation and describes the corrobboree
    as a singing, dancing, and accompanied performance in North-West-Central Queensland.
    It notes usual night performance, possible composition by anyone or by a “doctor,”
    occasional dream origin, amusement or pantomimic plots, avoidance of references
    to the dead, and intertribal teaching and transmission. It gives the Molonga corrobboree
    as an example of a performance spreading between camps and regions while the words
    may become unintelligible to later performers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chapter section is framed as part of a discussion of recreation, including
    corrobborees, sports, games, tales, animal lore, and other amusements.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The corrobboree is described as consisting of singing accompanied by dancing
    and other accompaniments, with certain common features across North-West-Central
    Queensland.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ordinary performance begins at sunset, may continue until sunrise, and
    can extend over three, four, or five consecutive nights; the author excludes some
    local, women-only, rain-bringing, and initiation-related performances from the
    following notes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A corrobboree may be “found” or composed by anybody, often by a “doctor,”
    and sometimes is alleged to have been found in a dream.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A corrobboree may be performed merely for amusement with little meaning beyond
    a repeated statement, or it may enact a pantomime about an individual or tribal
    event.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Examples of staged plots include climbing a tree for honey, stealing cattle
    with horns represented, tracking and shooting marauders, and rescuing a European
    by three Aboriginal people during floods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author states that he has not found songs or dances about the prowess,
    life-history, or battles of a deceased individual, and that not referring to the
    dead appears to be an understood rule among the tribes described.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Corrobborees may be taught and carried from one tribe to another, with visitors
    paid in blankets or other presents for instruction, and selected men sometimes
    sent to distant tribes to learn a performance.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A tribe may learn and sing entire corrobborees by rote in a language remote
    from its own, even when neither audience nor performers understand the words.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Molonga corrobboree is described as moving through multiple named localities
    and branching in several directions between 1893 and 1896.
  category: sequence
  evidence_refs:
  - ev:8
