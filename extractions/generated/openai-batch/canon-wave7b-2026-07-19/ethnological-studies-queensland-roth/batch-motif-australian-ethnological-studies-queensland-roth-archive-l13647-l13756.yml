canonical_text:
  quote: ''
  summary: The passage describes mourning substances and nightly grave visits; Pitta-Pitta
    terms and widowhood after an adult male death; burial treatment for offenders,
    murderers, and war dead; Mitakoodi burial, mourning, fire and food near graves,
    and death-cause diagnosis; and Upper Georgina tree-burial with later ground burial
    of bones in special cases.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Greased ashes or mud may be smeared over the whole body as external emblems
    of grief, and crying and weeping without singing may be repeated nightly near
    the grave for about a week or more.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Near relatives may go in parties to the burial-place because they are afraid
    to go singly on account of possibly seeing the deceased's Moma.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tobacco, matches, food, pituri, a pipe, and similar items may be left at the
    grave-side each night, and the departed individual may be openly told this has
    been done.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In Pitta-Pitta country, after an adult male dies, his brothers and sisters
    are called mun-na moor-ra, and his wife is known as ka-ri-ou-o as a widow for
    a year or more until another husband is found.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When an individual is killed collectively by the whole tribe as punishment,
    he is usually made to dig his own grave, and boomerangs may replace the long logs
    immediately covering the corpse.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When an assassin caught red-handed has killed someone, the slayer and the
    slain are buried together in the same grave, dug beforehand by the survivor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In open hostilities, those killed may be left on the field by enemies with
    a broken spear or boomerang nearby to show how they died.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Among the Mitakoodi of the Cloncurry District, the corpse is usually buried
    crouching with the head down, possibly enclosed in a net, covered with ti-tree
    bark, and buried under smoothed earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At night near a Mitakoodi grave, a fire may be lit a few yards away and meat
    or similar food hung on a neighbouring tree, repeated for several nights and sometimes
    during following months.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The repeated fire and food practice may continue until people believe the
    deceased has become too old or has gone away somewhere else.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Mitakoodi mourning signs include former use of gypsum by women, later mud
    or red paint by both sexes, and formerly incisions on the fronts of the thighs.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Where no visible or intelligible cause of death appears, a doctor may determine
    whether death was due to Mulkari or a counterpart, or to a human enemy with the
    munguni.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Near relatives may place a mundakooea on a small forked stick stuck upright
    on the grave at night; if it is found on the ground in the morning, this is taken
    as proof that the deceased was killed by an enemy from a distant country.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the Upper Georgina District, tree-burial is practised by building a horizontal
    platform of logs in a tree about ten or twelve feet above the ground and placing
    the corpse on it wrapped in a net.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: For special cases of important Yaroinga personages, after the flesh has rotted
    away, the bones may be removed and buried in the ground without surface markers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Gypsum is used as a mourning sign in the Upper Georgina and Leichhardt-Selwyn
    districts, while the Kalkadoons use red and yellow paint in addition.
  category: attribute
  evidence_refs:
  - ev:8
