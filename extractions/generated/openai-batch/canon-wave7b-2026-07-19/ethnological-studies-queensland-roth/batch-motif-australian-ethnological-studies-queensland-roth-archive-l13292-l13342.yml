canonical_text:
  quote: ''
  summary: The passage records several attributed causes of blindness, drowning, sudden
    disappearance, and mental disease in the Boulia and Cloncurry districts, including
    punitive human ritual action, song or spell, a supernatural water-snake, an underground
    bogie-man, and a named being associated with mental disease.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Blindness in men, when not explained by visible traumatic causes, is accounted
    as a punishment by human agency for continued assaults on married women when alone
    and unprotected in the bush.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Boulia District, the described punishment of blindness can be inflicted
    by anyone except a woman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The person whose honour has been sullied obtains two incisor teeth of a young
    opossum and ties them with twine from the same animal, one to each little finger
    on the inner side.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The prepared person enters camp, squats with chin on closed hands, and positions
    himself to see the offender without arousing suspicion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The prepared person secretly aligns with the offender's eyes and claws the
    air first toward one eye and then toward the other using the little fingers while
    the other fingers remain closed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After use, the opossum teeth and string are destroyed by fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The culprit is said to be unaware of what has been done, but later loses sight
    and becomes incurably blind.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the Cloncurry District, the Mitakoodi are said to blind a man by singing
    only, described as casting a spell over him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Boulia District, death by drowning is explained by Kanmare, a huge
    supernatural water-snake.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Before swimming across a feared large stream or river, a person may speak
    to Kanmare and state that he belongs to the country.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Crossing even one's own river with a stranger may lead to engulfment, and
    floods are said to bring Kanmare; cold water and persisting in crossing are associated
    with being caught and drowned.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Mo-ki-pi-ung-o is described as living underground in mountain fastnesses,
    resembling a blackfellow, having very long teeth, biting through a man's neck,
    dragging the victim into a pit, and eating him.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Mitakoodi are said to believe that mental disease or crankiness is caused
    by a Being known as Di-pung-un-ya.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage concludes that the preceding procedures are mostly regarded as
    punishments for wrongs committed and that death is generally regarded somewhat
    as a penalty.
  category: relationship
  evidence_refs:
  - ev:8
