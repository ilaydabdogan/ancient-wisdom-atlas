canonical_text:
  quote: ''
  summary: 'The passage describes several recreational games: a small baked spin-ball
    game with regional names and reported diffusion; a root-made skipping-rope swung
    by two players; a hidden-object sand game called "Hunt the Eye"; hide-and-seek;
    and a smoke-spiral throwing game in which light objects rise in smoke from a fire.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The spin-ball is a small round ball made from lime, ashes, sand, clay, and
    sometimes hair; it is rolled, baked smooth and hard, and may be painted with red
    or yellow ochre.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spin-ball is spun by pressing it between the fore and middle fingers on
    smooth hard ground or on a flat board, kerosene-tin sheet, or similar surface.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Men and women may play spin-ball, two or three at a time; the ball that spins
    longest wins a stake, and participants may also take sides backing individual
    players.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports that the spin-ball appears to have been introduced recently
    from the Lower Diamantina River by way of the Georgina and Bedouri; it lists several
    local names and says it was not yet known to the Mitakoodi in 1896.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A skipping-rope called too-ri too-ri is made from long roots of Bauhinia or
    big white-gum growing near the water's edge; two playmates hold it and swing it
    backwards and forwards rather than circling it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: In "Hunt the Eye," a small circular sandy space is marked out and smoothed;
    players squat around it, close their eyes at a signal, and one person hides a
    small object beneath the sand.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hidden object in "Hunt the Eye" is often the lens of a rat's, opossum's,
    or small kangaroo's eye removed after cooking, though other small objects different
    from the sand may also be used.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Players look for the hidden object by lifting pinches of sand and sifting
    it through their fingers; another version has the hider sprinkle handfuls of sand
    and drop the object while doing so.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hide-and-seek is described as common and may include up to three seekers who
    cover or shut their eyes while others hide; a whistling sound may signal defeat
    if the hidden players are not found.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In "Smoke-Spirals," a leaf, light bark, or mussel shell is thrown with a wrist
    and arm motion into smoke from a large fire so that it ascends with the smoke
    like a spiral.
  category: action
  evidence_refs:
  - ev:7
