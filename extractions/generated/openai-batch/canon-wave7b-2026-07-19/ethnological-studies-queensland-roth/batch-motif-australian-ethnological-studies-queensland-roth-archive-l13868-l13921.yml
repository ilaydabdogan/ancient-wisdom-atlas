canonical_text:
  quote: ''
  summary: 'The passage describes several reported rain-making ceremonies in north-west-central
    Queensland: a Roxburgh procedure using powdered white quartz, a constructed shed,
    an artificial waterhole, dancing, aquatic mimicry, and women pretending to shelter
    from rain; a Yaroinga night rain-corroboree with male performers and feather-and-blood
    decoration; a Kalkadoon midday performance by old men with feather-down and blood;
    and a belief among some Mitakoodi and Kalkadoon that thunder and lightning can
    be made to drive out white settlers.'
  language: English
  quote_policy: summarized
