- id: obs:2
  text: At Roxburgh, a straight-stemmed tree, often blood-wood, is surrounded by long
    saplings arranged like a bell tent to form a shed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A small cleared and scooped-out space outside the Roxburgh structure is filled
    with water to make an artificial waterhole.
  category: object
  evidence_refs:
