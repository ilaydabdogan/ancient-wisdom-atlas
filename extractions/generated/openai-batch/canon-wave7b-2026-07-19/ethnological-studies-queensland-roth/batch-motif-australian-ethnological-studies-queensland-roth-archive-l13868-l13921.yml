- id: obs:4
  text: Men come out from the shed, dance and sing around the artificial waterhole,
    and imitate aquatic birds and animals such as ducks and frogs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Women are positioned about 20 to 25 yards away; the men form a line, encircle
    them, and throw the powdered stone over them.
