canonical_text:
  quote: ''
  summary: The passage describes processing halo flax into twine by soaking, stripping,
    beating, drying, rolling, moistening, twisting, and doubling. It then describes
    dilly-bag mesh types, gendered associations of certain weaving forms, reported
    recent adoption of woven dilly-bags in the Cloncurry District from neighboring
    groups, remembered older grass or plant-fibre bags, and a bark envelope receptacle
    called wa-ra-ka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Halo flax is collected into thick bundles, tied with string, immersed in water
    for several days, and weighted with rocks or stones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fine outer skin of the flax stems is stripped, beaten, teased until soft,
    sun-dried, and rolled into skeins or bundles.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A squatting worker pulls short pieces from the skein, moistens them with the
    mouth or with water from a koolamon, places them crossways on the thigh, and rolls
    them into a composite thread.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Composite thread pieces are joined end to end; completed twine is rolled into
    balls, and two balls can be twisted in opposite directions and rolled into a double
    plait.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'Three mesh forms are named for dilly-bag weaving: the common type-pattern,
    a rarer hair-net pattern, and a twist pattern.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Use of the type-pattern throughout a bag is said to suggest manufacture by
    women, who are described as not usually weaving the other mesh forms.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The hair-net mesh is described as identical with that used in a hair-net article
    of dress, which the passage says can only be made by males.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The author observed smaller bags being made by women with an ordinary darning
    or small packing needle, but states uncertainty about what needle was used outside
    colonial influence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mitakoodi people in the Cloncurry District reportedly said that woven dilly-bags
    had appeared only recently and that their women learned to make them from Woonamurra
    and Goa neighbors.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Former grass or plant-fibre dilly-bags were remembered in the Cloncurry District
    by the name koon-ya koon-ya, though none were obtained during the author's visit.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: A wa-ra-ka bark receptacle is made from two long pieces of ti-tree bark placed
    above and below an item, with turned edges and string wound around the bundle.
  category: sequence
  evidence_refs:
  - ev:6
