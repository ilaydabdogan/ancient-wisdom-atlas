canonical_text:
  quote: ''
  summary: 'The passage describes Aboriginal exchange and travel routes in North-West-Central
    Queensland, emphasizing their role in moving goods, customs, beliefs, words, and
    corroborees between districts. It then describes letter or message sticks: their
    local names, materials, marks, non-readable token function, use with trusted oral
    messengers, and role as guarantee, safeguard, or passport.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Objects found at Boulia, including ornaments, shells, and barbed spears, prompted
    inquiry into how such items reached the camp through exchange and trade routes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Recognised trade routes and swapping-grounds are described as places where
    commodities were bartered and where comparatively large numbers of people of both
    sexes could gather.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ideas, superstitions, traditions, new words, terms, and corroborees are said
    to pass from district to district through the same communication system as trade
    goods.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Similar customs, beliefs, and corroborees are reported among tribes separated
    by distances and not directly in communication within white memory except through
    intermediaries.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Aboriginal travel or trade routes are described as potentially useful to settlers
    because only along them would there be a chance of finding water.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Undekerebina men at Glenormiston reported definite routes they had followed
    and were said to know about the Central telegraph line, which some had seen.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: When an individual cannot go to a swapping-ground, he may send a substitute
    or agent with a letter-stick to conduct business for him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage gives different local names for the letter or message stick among
    the Pitta-Pitta, Mitakoodi, and Kalkadoon.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: A message stick may be a small piece of wood of varied material, colour, shape,
    and incised pattern, or in some cases a marked twig, plain shaped wood, or rag
    bundle tied with string.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The stick is described as an individual brand or mark that may vary in shape,
    size, or design, and it does not contain a readable written communication.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The stick may act as a guarantee of good faith and sometimes as a safeguard
    or passport through otherwise hostile country.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The messenger is described as an adult man, never a woman, and usually a trusted
    person such as a brother; he carries the actual message by word of mouth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Message-stick shapes and designs are said to show traces of similarity over
    large areas; in the Boulia District they are flattened and incised only with straight
    lines.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Straight lines on the sticks may arbitrarily represent whatever the maker
    chooses, including a mountain, river, or station homestead; the back may repeat
    the design or carry decorative marks.
  category: attribute
  evidence_refs:
  - ev:7
