canonical_text:
  quote: ''
  summary: The passage describes corroboree dance movements, leaders, audience singing
    and time-beating, examples of song words and musical cadence, a fire-lit performance
    setting, and the Holonga set of corroborees, including its multi-night delivery,
    costume and implement changes, and the term Molonga as an evil-doer visible only
    to certain specialists.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dance movements vary according to implements, sticks, or other items brought
    into use; sometimes the ground is struck with the flat of the hands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Female dancers are described as using varied lower-limb movements, commonly
    knee vibration, and holding their hands on the top of the buttocks while moving
    the elbows rhythmically.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Performers may dance singly, in pairs, in Indian file, or in many other initial
    positions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The dancers are led by one or sometimes two leaders, who may be marked by
    an extra feather-tuft on the arm.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Pitta-Pitta terms, the leader is called by words meaning father or old
    man, while the remaining dancers are called children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Apart from an occasional shout or whoop, the dancers do not participate in
    the singing while dancing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The audience, including men and women, carries on the singing; in simple form
    it repeats a statement or assertion like a chant.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Pitta-Pitta songs at Boulia show variation in pronunciation and inflexion
    from ordinary everyday language.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Song examples contain brief statements or images about people sitting near
    a mountain, clean water, a hook-boomerang digging mud, grass-tops making a bough-shed,
    and dogs jumping.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The first verse of a song gives the name to the particular corroboree.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The music is described as a wail beginning with a sudden rise and ending with
    a slow prolonged fall.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The audience usually squats on the ground in rows, with men in front, women
    and children behind, and dogs scattered around; sometimes the audience is divided
    into two sex-based groups.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Both sexes sing and beat time; men strike two boomerangs together, while women
    clap their hands on their thighs or, in some districts, beat an opossum-skin pillow
    or drum.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The performance scene includes barking dogs, hand clapping, boomerang beating,
    chanting, stamping dancers, costumes, attitudes, and illumination by an intervening
    fire.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Holonga corroboree song takes upwards of five nights to complete and is
    reported with slight variations between Glenormiston and Boulia, about ninety
    miles apart.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The singers at both localities are described as singing words in a language
    of which they are entirely ignorant.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Holonga performance includes costume changes, features distinguishing
    the boss or leader, implements that are introduced and later destroyed, and different
    trunk and limb attitudes.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: The word Molonga is said to be difficult to interpret in European terms and
    to hardly correspond to the European conception of the devil.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:19
  text: Molonga is described as an evil-doer from whom mischief may be expected, invisible
    to ordinary mortals except perhaps to doctors.
  category: attribute
  evidence_refs:
  - ev:11
