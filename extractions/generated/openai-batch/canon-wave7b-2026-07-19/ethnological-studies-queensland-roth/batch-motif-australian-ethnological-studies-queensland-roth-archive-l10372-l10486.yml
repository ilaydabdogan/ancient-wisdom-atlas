canonical_text:
  quote: It is only men that dance this particular corrobboree
  summary: The passage describes beliefs about Molonga and the first-night performance
    of a Molonga corroboree. Molonga is said to conceal his tracks by tying toes and
    heels toward the knees and to punish an improperly executed performance. A dome-shaped
    bough structure called a moyerjo serves as a backstage area, storage place for
    dance implements, and boundary between male performers and women and children.
    Women are said to risk sickness or death if they trespass too close or look at
    certain sticks outside the performance. The first-night male performers and leaders
    are described with painted feather-down, human-blood adhesive, headpieces, feathers,
    leaves, and forked sticks. At sunset the audience assembles, men sound boomerangs,
    women sit behind them, and performers emerge from behind the moyerjo to dance
    and sing in set sequences.
  language: English
  quote_policy: quoted
