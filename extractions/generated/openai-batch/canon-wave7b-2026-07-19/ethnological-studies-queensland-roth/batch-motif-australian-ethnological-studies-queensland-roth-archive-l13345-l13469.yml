canonical_text:
  quote: ''
  summary: The passage describes beliefs about death and a future state, ordinary
    non-munguni ailments, detailed treatment for non-fatal snake-bite in the Boulia
    District, related Mitakoodi practices, fracture treatment, and chants or dirges
    used for curing or producing sickness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage reports that Boulia people are described as having a hazy notion
    of a corpse getting older and moving elsewhere, without dread of future punishment
    or hope of reward in another life.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Temporary ailments and accidents are described as arising from simple everyday
    causes when they occur without munguni intervention and are amenable to ordinary
    simple treatment.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Non-fatal snake-bite in the Boulia District is explicitly contrasted with
    a munguni variety of snake-bite that is said to invariably end in death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: After being bitten, the sufferer watches where the snake hides, blocks the
    hole, and notes the exact spot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bitten person ties ligatures around the bitten limb above and below the
    affected joint and, if possible, applies suction to the wound.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A gin or other mate may consult the nearest doctor; a hole is dug near the
    accident site, a fire is kindled, stones are heated, leafy boughs are sprinkled
    with water, and the bitten person lies on the smoking foliage until sweating,
    sleeping, and recovering.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When first informed, the medicine-man looks at the sky and declares that he
    can see Mulkari spitting, which he treats as indicating that the patient will
    recover if the prescribed treatment is followed.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The medicine-man digs out the snake, lets it travel a short distance, pelts
    it with stones, and during this process the snake is said to become smaller.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The medicine-man carries the reduced snake to camp, turns its skin half-way
    inside out while it is alive, throws it into water, and no layman is allowed to
    witness the process of making the snake diminish.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Infants or young children bitten by snakes are said to be unlikely to recover
    unless the performances occur quickly; Mitakoodi ordinary snake-bite treatment
    is described as similar but without the doctor’s tricks.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Fractures may be treated with rough sticks tied to a limb or, among the Mitakoodi,
    with opossum skins and twine; slings and crutches are described as unknown in
    these cases.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Chants and dirges are described as handed down by individuals and tribes,
    memorized without understanding their meaning, used to dispel stomach-ache and
    diarrhoea, and also usable for producing sickness.
  category: speech
  evidence_refs:
  - ev:10
