  quote: ''
  summary: The passage describes several waist, feather, necklace, and genital-covering
    ornaments from North-West-Central Queensland, including their materials, local
    names, bodily placement, gender and age restrictions, ceremonial contexts, and
    regional distribution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A human-hair belt is reported throughout North-West-Central Queensland and
    is named differently in the Boulia, Leichhardt-Selwyn, and Cloncurry districts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The human-hair belt is allowed to be worn by both sexes after first initiation
    ceremonies; men usually wear it continuously afterward, while women wear it at
    corroborees and other special occasions.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The human-hair belt is made from long double-plaited hair twine wound around
    the waist; it may include a wooden peg at the end, may hold objects such as a
    stone-knife or pipe, and may remain on the body for weeks or months.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Boulia District, during corroborees and other rejoicing occasions,
    certain ornaments are suspended from the hair-belt for males only.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The pingkara is a bunch of eagle-hawk feathers tied at the shafts and attached
    to the belt at the hips; the Mitakoodi are said to hang it behind in the central
    line instead.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The tilyari is a similarly bound bundle of emu feathers fixed behind so that
    it falls between the buttocks.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A larger opossum-string moonamulyari necklace is noted as sometimes worn by
    Boulia women in place of an apron.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: An opossum-rope waist-belt occurs in the Cloncurry and Flinders districts;
    it is a ring-shaped belt with a core and external strand, decorated with black
    band patterns, and its wearing differs by adult males, women, and young boys.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Phallocrypts or penis-concealers are used only by males at corroborees and
    other public rejoicings and are made either of pearl-shell or opossum string.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chekalari is a flat oval pearl-shell piece fixed to human-hair string
    and attached to the front of the belt so as to cover the privates; it is reported
    in the Leichhardt-Selwyn, Upper Georgina, and Boulia districts and is said to
    come from the Georgina River headwater country.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The koompara is an opossum-string phallocrypt made as a spiral tassel, colored
    red, hung from the front waist-belt at corroborees and public ceremonials, sometimes
    used in the hand as a fan or duster, and manufactured by males only.
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: The tinjinna is a miniature form of koompara attached to the pubic hair rather
    than the belt; at corroborees it may be painted white, which is described as the
    only occasion when an opossum-string ornament is colored otherwise than red.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage states that for both sexes the privates are covered only on special
    public occasions or near white settlements.
  category: relationship
  evidence_refs:
  - ev:11
