canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing domestic implements in North-West-Central
    Queensland: the koolamon or wooden trough, the native chisel, and native cementing
    substances. It gives materials, manufacturing sequences, carrying methods, exchange
    movement, local names, and the use of fire, water, twine, stone, iron, spinifex
    grass, beefwood gum, bark, and charcoal in making and using these objects.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage belongs to a chapter on domestic implements and utensils, fire
    sticks, yam sticks, huts, and shelters, with contents listing sections on koolamons,
    chisels, cementing substance, water-bags, fire-sticks, yam-sticks, and shelters.
  category: setting
  evidence_refs:
  - ev:1
