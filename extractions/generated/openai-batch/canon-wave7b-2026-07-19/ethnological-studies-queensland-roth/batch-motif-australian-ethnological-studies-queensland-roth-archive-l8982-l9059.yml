  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: For wood that does not split readily, a slightly bent trunk or limb is selected;
    the future concave side is burned, scooped with a chisel, steeped in water, wound
    with twine to fix the contour, and finished with a chisel.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Koolamons usually show longitudinal fluting, may be coloured red or black,
    vary greatly in size, and may be carried on the head, side, or back with cord
    and arm support.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The native chisel is described as a widely useful tool in the possession of
    Aboriginal people throughout North-West-Central Queensland and is not used for
    exchange or barter.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The chisel consists of an arc-shaped wooden handle, generally of gidyea, with
    flint-flakes fixed at the ends by cementing substance; more recent forms may replace
    one flint with iron such as shear-blade or barrel-band.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The chisel is used for cutting, shaving, and scooping, and is operated with
    both hands moving toward the operator.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage gives local-language names for the chisel or its parts in Pitta-Pitta,
    Taroinga, Mitakoodi, and Kalkadoon contexts.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: A native cementing substance is described as manufactured throughout North-West-Central
    Queensland, with a possible exception noted for the Leichhardt-Selwyn District.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Boulia and Upper Georgina districts the cementing substance is called
    kun-ti and is obtained from porcupine or spinifex grass.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Spinifex grass cement is made by gathering the plant, breaking and pounding
    it, working it on a heated flat stone, rendering its sticky matter into a brown-black
    paste, and allowing it to harden for later use.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The spinifex cement recipe is said to use no water, wax, or other ingredients;
    the hardened substance can be softened again by heat.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:15
  text: Some Kalkadoon obtain kun-ti at Buckingham Downs, where it is brought from
    the Boulia direction.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:16
  text: Mitakoodi people of the Cloncurry District can make a similar cement, and
    north of the ranges a usual cementing substance is made from beefwood gum by roasting
    it over fire, melting it onto bark, warming, beating, mixing with powdered charcoal,
    and letting it harden.
  category: sequence
  evidence_refs:
  - ev:12
