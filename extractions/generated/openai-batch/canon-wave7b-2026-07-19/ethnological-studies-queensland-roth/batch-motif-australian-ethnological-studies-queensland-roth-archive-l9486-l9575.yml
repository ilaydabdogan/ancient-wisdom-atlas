canonical_text:
  quote: ''
  summary: 'The passage describes several forms of personal ornamentation in North-West-Central
    Queensland: tooth ornaments, artificial whiskers, head-nets, forehead-nets, opossum-string
    fillets, dingo-tail fillets, cloth band-fillets, and opossum-string circlets.
    It records their materials, methods of wearing, makers, wearers, district distributions,
    red-ochre treatment, and links between certain ornaments and initiation stages.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tooth ornament is formed from two kangaroo teeth, rarely dingo teeth,
    fixed into a more or less oval-shaped base.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tooth-ornament base is made of spinifex or beef-wood cement, has an aperture
    for a small lock of forehead hair, and hangs with its tip midway between the eyebrows;
    it may also hang from a forehead band.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tooth ornament is used by both sexes at corroborees and other festive
    occasions and is manufactured by men only in specified districts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mitakoodi women and little boys wear an artificial whisker made from locks
    of hair cemented with beef-wood gum, attached near the temporal hair and hanging
    below the jaw.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The head-net is a netted cap with a circular ring at the top; its twine is
    made from flax-fibre or similar material and coated thickly with red-ochre grease.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The stated use of the head-net is to keep cultivated long hair from dangling
    into the eyes; it is manufactured by men only in the Boulia and Leichhardt-Selwyn
    Districts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A modern form of head-net is described as made by women, not necessarily worn
    only by women, and made after the mesh of a fishing net with a conical blind extremity.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The forehead-net, mi-ri mi-ri, is a spindle-shaped piece of fine netting worn
    over the forehead to keep the hair back, with strings tied behind the head.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The forehead-net may be made of human hair, flax-fibre, or opossum-twine;
    it is made by males only and can be worn by both men and women after the last
    initiation ceremony stage in the Boulia District.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The opossum-string fillet is made of four circlets of opossum-twine bound
    flat; its strands have opossum string spirally wound around a central human-hair
    core, with plant-fibre ties and red-ochre grease.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The opossum-string fillet has been observed as a necklace in the Boulia District
    and as a necklace and armlet in the Cloncurry District; it may be worn by either
    sex after the first initiation ceremony.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Boulia District, a dingo-tail may sometimes be worn over the forehead
    like a fillet and tied behind; feather-tufts may be supported under it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The band-fillet is described as not strictly aboriginal; it uses thin strips
    of linen, calico, or ribbon, often red, tied over the forehead and may hold feather-tufts
    or small wooden pegs producing a tiara-like appearance.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Opossum-string circlets occur in single and double varieties and are described
    as coloured red and greased.
  category: object
  evidence_refs:
  - ev:8
