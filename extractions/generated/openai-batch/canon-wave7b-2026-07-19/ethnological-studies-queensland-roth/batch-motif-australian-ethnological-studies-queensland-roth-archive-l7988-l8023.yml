  summary: 'The passage describes manual and bodily signs used to express locality,
    direction, place, and time: beckoning for hither, waving or arm and hand positions
    for thither, pouting lips toward a direction, forefinger sweeps for going around,
    thumb or forefinger indications for here, and a stay-where-you-are ideagram also
    used for waiting or by-and-by.'
