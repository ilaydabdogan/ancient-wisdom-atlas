  summary: The passage is a grammatical section on Pitta-Pitta locative and purposive
    relations, with example sentences involving positions around trees, creeks, hills,
    huts, persons, animals, tools, exchange goods, and effects of pituri and food.
    It is not a mythic narrative passage.
  language: English with Pitta-Pitta examples
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage explains forms for 'under, below, beneath' with persons, including
    modified first- and second-person singular pronoun forms for 'underneath me' and
    'underneath thee'.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage explains forms for 'on this side of' or 'in front of' and gives
    examples involving people sitting on this side of a creek, a kangaroo standing
    in front of a tree trunk, and a stream on this side of a mountain.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage explains forms for 'on the other side of' or 'behind' and gives
    examples involving the other side of a hill, an opossum behind a hut, sitting
    behind a person or man, men sleeping behind the top of a hill, and a creek on
    the other side of a hill.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage gives donation examples in which a father gives a spear to a doctor
    and a mother will give a dilly-bag to a girl.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage gives 'from' examples in which a spear is brought from an old
    man, a boomerang is cut from a gidyea tree, and a dilly-bag will be fetched from
    a woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage gives benefit or use examples in which a man begs food for a woman,
    grass is brought for a dog, and grease is given for use on a spear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage gives exchange examples in which a boy swaps a spear for a boomerang
    and a man exchanges a dilly-bag for pituri with a woman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage gives construction or making examples involving fetching wood
    for a hut and cutting grass for a net.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage gives physical-agency examples in which a boy catches a fish with
    a net, men strike a kangaroo with a boomerang, and a woman will hit a girl with
    a stick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage gives effect examples in which pituri causes a girl's dizziness
    and food causes the speaker to become full.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A translated exercise sentence says that a dingo's pup lives or sits in a
    tree-trunk; other translated sentences place leaves on branches, a lizard between
    two legs, a nose between two eyes, pituri underneath the addressee, and the speaker
    behind women.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Translated exercise sentences describe climbing along a tall tree-trunk, two
    kangaroos running alongside a creek, and an eagle-hawk flying or running through
    the sky.
  category: action
  evidence_refs:
  - ev:6
