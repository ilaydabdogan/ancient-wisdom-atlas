  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator states that most of the stories concern animals with human attributes
    and often explain physical peculiarities or conformations.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the water-hen and emu tale, both birds hatch eggs near each other and leave
    their nests to feed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The emu sees the water-hen's eggs, says they are large like her own, leaves
    her own nest, and sits on the water-hen's eggs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The water-hen cannot force the larger emu away, builds a fire, and throws
    ashes over the emu, browning the emu's feathers; the emu retaliates by throwing
    the water-hen into the flames, burning her legs red.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the galah-parrot and lizard tale, the lizard cuts the galah on the head
    with a chisel, causing the top-knot to rise and blood to streak the neck and breast.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The galah retaliates by sticking prickly burrs on the lizard's back, producing
    warty growths there.
  category: action
  evidence_refs:
  - ev:8
