canonical_text:
  quote: ''
  summary: The passage describes the closing portions of a corroboree performance,
    including singing, a dramatic entrance by Molonga, all-night singing for a food
    reward, a sunrise dance with a featherdown-covered wooden implement depicting
    female genitals, and the burning of performance objects. It then introduces Boulia
    District fables as stories often involving animals with human attributes and explanations
    of physical traits, followed by tales of the water-hen and emu and of the galah-parrot
    and lizard.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After dancing pauses, an evening meal is prepared, followed by musicians singing
    while performers dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Molonga appears from the darkness amid audience noise, rushes at the audience
    as if to spear them, withdraws, and advances again to feign another attack.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Singing continues through the night, with extra food offered as a reward to
    the man who continues singing until sunrise.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: At sunrise, one performer dances while swaying an oval, flat wooden implement
    covered with featherdown on both sides and intended to depict female genitals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the dance, women and children retire, and the moyerjo, head-dresses,
    forked sticks, and other sticks used over the preceding five nights are consumed
    by fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The narrator states that the traditional status of the following fables is
