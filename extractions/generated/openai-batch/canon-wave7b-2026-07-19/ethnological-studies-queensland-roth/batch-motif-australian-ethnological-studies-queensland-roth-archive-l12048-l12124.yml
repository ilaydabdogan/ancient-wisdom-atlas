  summary: The passage describes fighting boomerangs, their common pairing, their
    close-quarter use, the explanation of a hooked variety, and the manufacture, ornamentation,
    distribution, exchange, and dimensions of ornate boomerangs in North-West-Central
    Queensland.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Aboriginal person may carry one spear or shield but is said to almost invariably
    carry two boomerangs in camp or on walk-about.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two boomerangs are often kept or bartered as a pair, and two are required
    for beating time at singsongs and corroborees.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fighting boomerangs are intended for throwing at comparatively close quarters
    and cannot be made to perform the complete gyrations of come-back or toy varieties.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes the grip for throwing a boomerang and states that most
    non-hooked varieties can be used with either hand.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among Aboriginal people examined by the author for left-handedness, a marked
    proportion were left-handed, and no truly ambidextrous individual was found.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A defense against a boomerang blow is described as holding a stick, nulla-nulla,
    shield, or similar object forward and vertically, then moving it outward so the
    missile glances aside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Pitta-Pitta informants explained the hook on the hooked boomerang as a feature
    intended to catch the defending stick, swing around it, and strike the person
    attacked.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The ornate boomerang is described as always coloured black with charcoal grease
    and bearing typical gravings only on its upper convex surface.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Older engraving was done with an opossum tooth or sharp flint in a handle;
    later, iron tools made from discarded metal objects were increasingly used.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ornate boomerang is said to be manufactured across much of North-West-Central
    Queensland, except in the Upper Georgina District, and to circulate through exchange
    and barter along specified routes.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The ornate boomerang varies in length and shape; its ends may be rounded,
    oval, or angular, but the passage says no significance is attached to this finishing
    except appearance.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The upper surface of the ornate boomerang is smoothed and ornamented, while
    the under-surface may retain visible chisel marks or flutings.
  category: attribute
  evidence_refs:
  - ev:6
