canonical_text:
  quote: ''
  summary: The passage gives an ethnographic account of successive corroboree performances,
    including night sequences of singing and dancing, special body and head markings,
    dance implements, the role of leaders, repeated supper-time songs, all-night singing,
    and dawn or sunrise dances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: One corroboree implement is described as a tight roll of skin, linen, rags,
    and similar materials, wound tightly with string and about eighteen inches long.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described sequence alternates between all dancers, the leader alone, and
    all dancers without rag-sticks, with the rag-sticks stuck into the moyerjo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Musicians sing while women prepare tea, and dancing resumes after supper with
    additional songs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Singing continues through the night, and at the first sign of dawn a single
    performer dances.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The dawn performer has a wholly white face without bars and holds a singed
    leaf-bunch in each hand, raising them alternately.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: On the third night, the head-piece has charcoal ornamentation formed from
    concentric circles around a central spot between two parallel bands; the circular
    mark is named u-ron-goo-to in the passage.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the third night, the leader is distinguished by a transverse bar on the
    forehead instead of a circular patch, and by vertical trunk bands divided into
    rectangular patches.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The third-night implement is a long stick with a bunch of singed leaves and
    twigs tied at each end.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: The third-night performance begins at sunset with performers seated in a semicircle;
    they squat or stand while moving sticks through specified positions, and the sticks
    are later removed to the moyerjo.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After tea on the third night, dancing resumes, singing continues all night,
    and at sunrise the koolari punta dance is repeated with two people instead of
    one.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: On the fourth night, two leaders and other dancers are dressed alike except
    that the leaders wear feather-tufts in the armlets; the same circle design appears
    on the head-gear as on the previous night.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The fourth-night corroboree stick is between two and three feet long, made
    of grass and flax bundles, bound with human hair-twine, and sometimes decorated
    with narrow rings of feather-down.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: At sunset on the fourth night, male musicians sing, women appear, performers
    emerge from behind the moyerjo in single file with the two bosses first and last,
    and they advance while stamping rhythmically.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: On the fourth night, the performers change sticks from left to right and back,
    put sticks into the moyerjo, repeat supper-time songs, resume dancing after the
    meal, sing all night, and at sunrise perform the kurra putya dance.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
