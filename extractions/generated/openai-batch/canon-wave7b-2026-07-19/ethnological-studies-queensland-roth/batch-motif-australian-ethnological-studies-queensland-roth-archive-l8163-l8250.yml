  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage reports an alternative sickness sign imitating the taking of sweat
    from the opposite armpit and smelling it or rubbing it on affected parts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A sign can indicate sickness, lying down, or sleeping through loosely closed
