  summary: The passage lists manual signs for swimming, grasping, stealing a woman,
    eating or food, anger or intention to fight, sickness, lying down, and sleep.
    Several signs are explained as imitations of bodily actions or treatments, including
    dragging by the wrist, eating from a full hand, biting the thumb or beard, striking,
    rubbing blood on a sick person, and wrist movement for lying down or sleeping.
  language: English
