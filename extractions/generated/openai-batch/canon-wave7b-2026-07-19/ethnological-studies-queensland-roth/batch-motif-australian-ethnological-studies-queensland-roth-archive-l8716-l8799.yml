canonical_text:
  quote: ''
  summary: The passage describes several hunting and trapping methods for emus and
    Turkey Bustards in North-West-Central Queensland, including emu-net making and
    barter, alley-way net traps with hollow-log call-tubes, single and multiple concealed
    pitfalls, communal driving to water-holes, stalking with vegetation and earth
    scent-masking, dog hunting, noose use, and fire-and-smoke encirclement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The space enclosed by two emu-nets is described as over 120 feet.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mitakoodi obtain emu-nets by barter from the Kalkadoon.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In net weaving, a rolled cord on one or two twigs substitutes for a needle,
    the maker's foot substitutes for the mesh-stick, and the completed net is wound
    around a spear fixed in the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: An alley-way may be built from bushes, boughs, and saplings, with one end
    closed by an emu-net and the other end open and divergent.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hunters hide near the alley opening, imitate the emu call, rush out behind
    the approaching bird, and drive it along the alley into the net.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The emu call is imitated by blowing into a hollow log whose core has been
    burnt out; when used, the tube is held close to the ground near a slight excavation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A single deep pit is dug near fruiting vegetation, concealed with boughs,
    saplings, and sand, and later checked after a bird may have fallen in while seeking
    fruit.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A multiple-pitfall enclosure uses a circular fence with gaps, pits concealed
    at the gaps, a central concealed hole for crouching men, and call-tubes to lure
    emus toward the gaps.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a mob of emus nears a camp, men and women may surround and muster them
    like cattle, drive them to the nearest water-hole, and kill them with nulla, boomerang,
    or spear.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Mitakoodi hunter may stalk feeding emus with bushes covering him and held
    in front of him, rub earth on body areas to prevent the bird smelling him, and
    spear the emu with a heavy wommera spear.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Roxburgh and higher on the Georgina, emus may be hunted with dogs that
    make for the bird's neck.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Turkey Bustards may be caught with a grasshopper and noose on a switch by
    a hunter concealed in boughs and bushes, or surrounded by a circle of fires whose
    smoke and noise daze the birds before they are knocked over.
  category: sequence
  evidence_refs:
  - ev:8
