literal_observations:
- id: obs:1
  text: The sign for brother or sister is explained as tapping the shoulder because
    brothers and sisters were alike carried on the same parent's shoulders.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Signs for child or infant include a small circular or short vertical-like
    finger movement, tapping the protruded lips for infant babbling, tapping the abdomen
    for source of origin, and tapping the forehead with closed hand and thumb.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The forehead-tapping sign is interpreted for one's child as an idea of thinking
    all the same; its interpretation for mother-in-law is stated as not obtainable.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Doctor or medicine-man signs include pointing a bone apparatus, touching the
    back of the tongue while the mouth is open, and a two-hand gesture in which one
    hand holds a victim by the neck while the other executes imaginary damage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The tongue-touching medicine-man sign is connected with the described ability
    to remove an evil-bone by suction from an invalid's body into the medicine-man's
    mouth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Manufactured articles are said to be enumerated by ideagrams based on striking
