  category: setting
  evidence_refs:
  - ev:8
- id: obs:2
  text: The passage states that the marriage rule allows a man or woman to marry only
    specified counterpart categories described with kin terms such as sister-in-law
    or brother-in-law equivalents.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Even within otherwise marriageable categories, marriage is barred where the
    persons are true blood-cousins or certain grandparent-grandchild relations.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The author argues that the marriage rule does not by itself prevent consanguinity
