  quote: ''
  summary: The passage discusses class and nomenclature systems in Queensland Aboriginal
    ethnographic material. It describes marriage rules based on paedo-matronymic groups,
    argues that these rules do not simply prevent consanguinity, mentions a female
    entry-into-womanhood rite, and proposes that the class system regulates distribution
    of food through differentiated dietary permissions and taboos.
  language: English
  quote_policy: summarized
