canonical_text:
  quote: ''
  summary: The passage introduces Chapter IX on travel, trade, barter, and message-sticks,
    then describes the “walk-about” as a major institution often connected with trading
    and bartering. It notes recognized trade routes, instruction by elders at larger
    camps, travel along water-courses and water-holes, seasonal timing, and journey
    duration. It also describes road signs and signals, including smoke-signals, signal-fires,
    finger-posts, footprints, place names, cardinal-point terms, smoke-rings reported
    from Birdsville, and hawks that indicate camping grounds.
  language: English
  quote_policy: summarized
