canonical_text:
  quote: ''
  summary: The passage describes punishments and retaliatory rules surrounding killings
    involving wives, women’s fighting practices among Kalka-doon and Boulia groups,
    the use and handling of fighting-poles, collective enforcement against night fighting
    in camp, the influence of elders in dispute regulation, and Boulia war-painting
    practices for mutual recognition in inter-tribal warfare.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Earlier in the described context, vengeance could be taken on a whole camp,
    destroying the men while sparing women and children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who kills his own wife is described as delivering one of his own sisters
    to his late wife’s friends to be put to death, while a man who kills another man’s
    wife forfeits his own wife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A wife is described as having her brothers to look after her interests.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If two women fight and one is killed, the surviving woman pays the death penalty
    unless proper cause is shown.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Among the Kalka-doon, discarded wives may fight a more favoured wife through
    jealousy, using stones, fire-sticks, or stone-knives to mutilate the genitals.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Boulia District, women fighting among themselves are said to use smaller
    boomerangs rarely and fighting-poles generally, with no other implements or weapons.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The fighting-pole is described as a thick, heavy pole, often about four feet
    long, held at one end and swung vertically over the head from behind forwards.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the described fighting-pole encounter, one woman stoops with hands between
    her knees and receives a blow on the head; the roles then reverse, and blows alternate
    until one gives in.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A woman who raises a hand, stick, or other object to ward off a blow would
    be regarded as a coward.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A woman’s quarrel may be taken up by her mother and brothers, and a woman
    considered generally obnoxious may be collectively beaten by her fellow sisters
    while males do not interfere.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Fighting is not allowed in camp at night; the crowd enforces this rule, and
    those who want to fight must go outside and kindle fires if needed.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage says that old men and elders influence public opinion in enforcing
    domestic policy, that old age carries the highest camp status, and that there
    is no single individual chief.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Boulia warriors in inter-tribal warfare are painted alike with kopi on the
    face, limb bands, and boomerang-shaped markings so that they and their allies
    can recognize one another.
  category: attribute
  evidence_refs:
  - ev:12
  - ev:13
