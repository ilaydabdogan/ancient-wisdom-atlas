canonical_text:
  quote: ''
  summary: 'The passage describes fishing and emu-hunting techniques: groping in mud
    for cat-fish, killing and carrying fish, trapping or hunting emus by several means,
    and a detailed water-hole ambush in which hunters set an emu-net across the bird’s
    return path. It also describes the construction and named parts of Boulia district
    emu-nets using Pitta-Pitta terminology.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On parts of the Georgina River and certain creeks, Aboriginal people grope
    along the mud and transfix a kind of cat-fish with their feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A common fish-killing method is biting deeply just behind the head before
    throwing the fish onto the river bank.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fish are carried to camp by passing a thin twig through the gills and mouth;
    a short-cut shoot at the twig’s end prevents slipping.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Emus are said to be captured by nets, pit-falls, surrounding and mustering,
    tracking and spearing, or hunting with dogs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Emus generally go to a water-hole day by day along the same track, either
    early in the morning or at mid-day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hunters note the emu tracks, wait in ambush, let the bird go down to water,
    and set an emu-net behind it across the tracks while it drinks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the emu returns, hunters emerge and drive it into the net; men positioned
    nearby prevent it from leaving the path.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After the emu becomes entangled in the net, it is killed with boomerangs and
    nulla-nullas.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The described method of emu-hunting is stated to be practised throughout the
    ethnographical districts of North-West-Central Queensland.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Boulia district emu-net described includes strong terminal supports, slender
    intermediate supports, the flax-rope net, meshes, knots, and a top-string, with
    Pitta-Pitta names given for the parts.
  category: object
  evidence_refs:
  - ev:9
