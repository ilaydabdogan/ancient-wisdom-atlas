canonical_text:
  quote: ''
  summary: 'The passage describes several fishing practices in North-West-Central
    Queensland: long and small nets operated by swimmers or waders, nets obtained
    through barter, stone and movable grass dams used to drive or trap fish, poisoning
    or darkening water with plant materials, muddying shallow water, and spearing
    fish in still, running, or flood waters.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two individuals operate a long net with poles at each end, swimming it in
    arcs or straight across a stream to catch fish near a riverbank.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Miorli men on the Diamantina make these long nets,
    and that they are not brought much farther north than Marion Downs in the district
    discussed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author reports no weights or sinkers for the long net; instead, the fisherman
    holds the extremity of the side pole underwater with the big toe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Mitakoodi use a smaller net called the moo-na, usually obtained in barter
    from the Woonamurra; it is described by size, rounded sides, mesh, and sticks
    fixed along the edges.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Four or five moo-na nets are generally used at once, with each holder keeping
    two nets under water while companions circle, splash, and drive fish into them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Mitakoodi also use the bil-lin-ya net, likewise obtained from the Woonamurra,
    with two strongly curved sticks attached along the sides.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: A fisherman using the bil-lin-ya wades in shallow water and slowly gropes
    forward with the net held in front, enclosing fish as they pass through or around
    his legs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: After floods, stone dams or weirs may be built across water, with breaks through
    which water carries fish onto bough-and-grass-covered platforms; the author reports
    seeing these only in the Boulia District.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: A mali net may be placed below the breaks in a stone dam to catch fish like
    a large bag.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: In several districts, all the gins from a camp may form a movable grass-and-bush
    dam by kneeling side by side and pushing bundles forward, driving fish toward
    the banks.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Mitakoodi poison water with crushed leaves of the too-ta shrub so that
    fish rise to the surface and are knocked over by hunters.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In several districts, leafy gum-tree boughs are thrown into large water-holes;
    by the next morning the dark, strongly smelling water leaves fish panting at the
    surface and easily caught.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Muddying or puddling shallow water with the feet and striking fish with a
    stick is described as common throughout North-West-Central Queensland.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Spearing fish is reported for the Cloncurry and Flinders districts, including
    noisy splashing in still shallow water and taking position on overhanging trunks
    or branches during running water or floods.
  category: action
  evidence_refs:
  - ev:8
