canonical_text:
  quote: ''
  summary: 'The passage gives four short animal tales: an opossum deceives a spotted
    cat about seed, the cat later steals the seed, and a fight explains bodily traits;
    a laughing jackass spoils an emu hunt and is killed, explaining its later laughter;
    a snake defeats a fish and makes it carry scales and dorsal fin; and red-tit and
    brown-tit refuse food exchange, reverse advantage through emu-trapping, and fight,
    explaining bird coloration and shape.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opossum and spotted cat go in different directions to collect pap pa-seed;
    the opossum obtains seed from pods in a coolibar-tree.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The opossum falsely tells the cat the seed came from rough bushes on the ground
    and refuses to share, leaving the cat hungry.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same food-gathering and false explanation occur again on the next day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The cat later watches for an opportunity, steals the opossum's coolibar-seed
    from a koolamon, grinds, tastes, and eats it, and denies stealing it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After growling, the opossum and cat fight; the opossum has its hamstrings
    cut and a prominent heel, while the cat's fur becomes spotted with seed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Two hunters prepare silently to drive a mob of emus into a net, but a laughing
    jackass laughs and frightens the emus away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The hunters kill the laughing jackass, and the bird is said now always to
    laugh at their failure in catching emus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A snake defeats a fish in a fight and, as punishment, makes the fish carry
    the snake's skin and bones on its back, identified as scales and dorsal fin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Brown-tit invites red-tit to catch kangaroo, while red-tit says he will look
    for witooka and go to camp.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After both have successful expeditions, red-tit asks to exchange witooka for
    kangaroo-flesh, but brown-tit refuses and hides remaining kangaroo-flesh in a
    tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Brown-tit clears the ground around the tree so tracks would reveal anyone
    who stole kangaroo-flesh.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Red-tit digs pit-falls near wild-grape vines, catches emus, cooks and skins
    them, and brings emu-flesh back near the tree holding the kangaroo meat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: When brown-tit asks to exchange kangaroo for emu, red-tit refuses and says
    he might get long ears and a long tail.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Red-tit and brown-tit fight, one with an emu-leg and the other with a kangaroo-tail;
