literal_observations:
- id: obs:1
  text: Several roots are described as edible, including koo-jo or witooha, ma-hor-a
    or mungaroo, ha-re-dil-la roots, Boerhaavia root, nut-grass root, and yams.
  category: object
  evidence_refs:
  - ev:2
- id: obs:2
  text: A truffle-like fungus west of the Mulligan is described as a delicacy after
    roasting, difficult to find, and indicated by a small surface undulation.
  category: object
  evidence_refs:
  - ev:3
- id: obs:3
  text: Wild orange, emu-apple, wild-currant, vines, caper, trefoil, berries, and
    peas are described as eaten throughout North-West-Central Queensland.
  category: object
  evidence_refs:
  - ev:4
- id: obs:4
  text: Blossoms of blood-wood, Bauhinia, and ti-trees are sucked for sugar or honey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: Honey is located by watching for dung pellets near a tree butt in winter,
    observing bees entering and leaving in summer, listening for hums or buzzes at
    an opening, and tapping for a hollow core.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: Honey is obtained by removing a limb or climbing the tree by cut steps, then
    extracting the honey with a hand or stick swept around in the cavity.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Certain ants are eaten raw; an individual may stand on an ant-bed and scrape
    ants from the legs and thighs as they run up.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Small grubs and caterpillars may be eaten raw; larger tree grubs are usually
    roasted, with heads not eaten, or dried for later use; crayfish are also relished.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Freshwater mussels are roasted whole in their shells and are usually found
    by feeling for them in mud with the feet.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Frogs are dug from burrows by yam-sticks in hard ground or hands in sandy
    soil and eaten roasted.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Lizards are caught while running in grass; iguanas are dug from sloping burrows;
    crocodiles are hunted by the Workoboongo with hand-spears.
  category: action
  evidence_refs:
  - ev:10
