- id: motif:7
  label: monthly lunar emergence, sinking, death, and replacement
  taxonomy_refs:
  - seasonal_cycle
  basis: The earth-grub sends a different moon every month; each moon bores out of
    the ground, rises, sinks, and dies.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage specifies a different moon each month, so it should not be
    treated as simple resurrection of the same moon.
- id: motif:8
  label: communal corroboree marking healing and transformation
  taxonomy_refs: []
  basis: A large corroboree follows the earth-grub’s cure, with many birds and animals
    participating before the upward shift and lunar explanation.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage presents the corroboree as part of the sequence but does not
    state a separate ritual-origin explanation.
