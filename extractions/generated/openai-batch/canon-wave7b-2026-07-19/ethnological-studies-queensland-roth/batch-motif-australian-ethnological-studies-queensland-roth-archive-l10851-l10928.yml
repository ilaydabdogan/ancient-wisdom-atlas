  locator: section 207, beginning; within lines 10851-10928
  quote_or_summary: Two blackfellows, a Yunda and a Pitta-Pitta, make nets and fish
    at Booloo-Booloo; Mulkari tells them to go to another water-hole, and they approach
    Parapijori where hawks indicate a camp.
  source_text_path: texts/public-domain/aboriginal-australian/project-gutenberg/ethnological-studies-queensland-roth.md
  rights_note: Public domain source metadata; evidence summarized.
- id: ev:2
  type: summary
  locator: section 207, middle; within lines 10851-10928
  quote_or_summary: The Parapijori people grant permission to fish; the two visitors
    drive them away, take all the fish, return to Mulkari, lie about the source, and
    repeat this behavior.
  source_text_path: texts/public-domain/aboriginal-australian/project-gutenberg/ethnological-studies-queensland-roth.md
  rights_note: Public domain source metadata; evidence summarized.
- id: ev:3
  type: summary
  locator: section 207, end; within lines 10851-10928
  quote_or_summary: The Parapijori men plan to kill the two fishermen, set hook boomerangs
    point upward in the mud, hide the fish, deny catching them, and drown the two
    divers before fixing them to the boomerangs.
  source_text_path: texts/public-domain/aboriginal-australian/project-gutenberg/ethnological-studies-queensland-roth.md
  rights_note: Public domain source metadata; evidence summarized.
- id: ev:4
  type: summary
  locator: section 208; within lines 10851-10928
  quote_or_summary: A porcupine and eagle-hawk fight; the eagle-hawk sticks many spears
    into the porcupine, identified with bristles, and is punished by being made to
    eat raw meat.
  source_text_path: texts/public-domain/aboriginal-australian/project-gutenberg/ethnological-studies-queensland-roth.md
  rights_note: Public domain source metadata; evidence summarized.
- id: ev:5
  type: summary
  locator: section 209; within lines 10851-10928
  quote_or_summary: A black crow and hawk fight; the hawk knocks the crow over and
    rolls him in charcoal, explaining black plumage, and the hawk is punished by being
    made to eat putrid meat.
  source_text_path: texts/public-domain/aboriginal-australian/project-gutenberg/ethnological-studies-queensland-roth.md
  rights_note: Public domain source metadata; evidence summarized.
- id: ev:6
  type: summary
  locator: section 210; within lines 10851-10928
  quote_or_summary: A small hawk quarrels with the bower-bird, tries to steal young
    and eggs, finds grass and stones in the enclosure, and leaves a snake that kills
    the bower-bird at night.
  source_text_path: texts/public-domain/aboriginal-australian/project-gutenberg/ethnological-studies-queensland-roth.md
  rights_note: Public domain source metadata; evidence summarized.
- id: ev:7
  type: summary
  locator: section 211, injury and failed requests; within lines 10851-10928
  quote_or_summary: A blackfellow, when he was a turkey, injures his foot and ankle
    and asks a cockatoo-parrot gin, green parrot, crow, blackfellow doctor, eagle-hawk,
    moon, white-fellow doctor, and evil-one for help; all say they cannot do it.
  source_text_path: texts/public-domain/aboriginal-australian/project-gutenberg/ethnological-studies-queensland-roth.md
  rights_note: Public domain source metadata; evidence summarized.
- id: ev:8
  type: summary
  locator: section 211, cure and corroboree; within lines 10851-10928
  quote_or_summary: The earth-grub agrees to help, bores into the swollen flesh, sucks
    out putrid matter, and cures the patient; a large corroboree is then held with
    many birds and animals participating.
  source_text_path: texts/public-domain/aboriginal-australian/project-gutenberg/ethnological-studies-queensland-roth.md
  rights_note: Public domain source metadata; evidence summarized.
- id: ev:9
  type: summary
  locator: section 211, ascent and lunar explanation; within lines 10851-10928
  quote_or_summary: The turkey and earth-grub, with clouds and skies, shift upward
    while the group sings; both animals stay above, and the earth-grub sends a different
    brother, a moon, every month, which bores out of the ground, rises, sinks, and
    dies.
  source_text_path: texts/public-domain/aboriginal-australian/project-gutenberg/ethnological-studies-queensland-roth.md
  rights_note: Public domain source metadata; evidence summarized.
