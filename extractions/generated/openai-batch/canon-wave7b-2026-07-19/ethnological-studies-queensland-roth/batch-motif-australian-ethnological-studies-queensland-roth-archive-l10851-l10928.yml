canonical_text:
  quote: ''
  summary: 'The passage gives five numbered tales: two fishermen repeatedly deceive
    others and monopolize a water-hole’s fish until the local men drown them; animal
    conflicts explain porcupine bristles, crow plumage, and raw or putrid meat-eating;
    a hawk kills a bower-bird by leaving a snake in its enclosure; and an injured
    turkey is healed by an earth-grub, after which a corroboree, ascent, and monthly
    sending of moons explain the lunar cycle.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two fishermen, identified as a Yunda and a Pitta-Pitta, make nets and fish
    at Booloo-Booloo water-hole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mulkari tells the two fishermen to go to another water-hole, and they travel
    toward Parapijori, where hawks flying about indicate that someone is camped there.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Parapijori people grant permission to fish, but the two visitors drive
    the hosts away and catch all the fish for themselves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two visitors lie to Mulkari about where the fish were caught and repeat
    the same fish-taking behavior several times.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Parapijori men plan to kill the two fishermen, set hook boomerangs point
    upward in the mud under the water, catch the fish early, and hide them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After finding no fish, the two fishermen dive below the surface; the Parapijori
    men jump in, drown them, and fix them onto the hook boomerangs in the mud.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A porcupine and an eagle-hawk fight; the eagle-hawk sticks spears into the
    porcupine, identified with the porcupine’s bristles, and is punished by being
    made to eat raw meat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A black crow and a hawk fight; the hawk knocks the crow over and rolls him
    in charcoal, explaining the crow’s black plumage, and the hawk is punished by
    being made to eat putrid meat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A small hawk quarrels with a bower-bird, tries to steal the bower-bird’s young
    and eggs, finds only grass and stones in the enclosure, and leaves a snake there;
    the snake bites and kills the bower-bird at night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A blackfellow, described as formerly a turkey, badly injures his foot and
    ankle and asks several beings and doctors for aid, but each says they cannot do
    it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The earth-grub agrees to help, bites into the swollen flesh, bores into the
    diseased part, removes the putrid matter, and cures the patient.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A large corroboree is held after the cure, with many birds and animals taking
    part.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The turkey, the earth-grub, and the clouds and skies shift upward; the gathered
    party sings that their brother is going up, and the turkey and earth-grub remain
    above.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: The earth-grub sends a moon every month as a reminder of his good healing;
    the moon is described as the earth-grub’s brother, boring out of the ground, rising,
    sinking, and dying, with a different moon sent each month.
  category: sequence
  evidence_refs:
  - ev:9
