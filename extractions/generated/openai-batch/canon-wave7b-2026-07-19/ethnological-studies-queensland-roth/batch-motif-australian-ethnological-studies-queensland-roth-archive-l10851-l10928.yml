candidate_motifs:
- id: motif:1
  label: deceptive fishermen punished by underwater trap
  taxonomy_refs:
  - trickster_boundary
  basis: The two fishermen exploit fishing permission, drive away hosts, lie about
    the source of fish, repeat the act, and are then trapped and drowned by the wronged
    group.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not call the fishermen tricksters; the taxonomy link
    is functional and based on deception and boundary violation.
- id: motif:2
  label: contested water-hole fishing rights
  taxonomy_refs: []
  basis: The tale centers on access to named water-holes, permission to fish, monopolizing
    fish, and retaliation by the local group.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: No specific supplied motif-family taxonomy directly names resource access
    or fishing rights.
- id: motif:3
  label: animal trait and diet etiologies from combat
  taxonomy_refs: []
  basis: The porcupine’s bristles, crow’s black plumage, eagle-hawk’s raw meat-eating,
    and hawk’s putrid meat-eating are each explained through conflict and punishment.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The supplied taxonomy list has no general etiological-animal-traits category.
- id: motif:4
  label: revenge by snake placed in enclosure
  taxonomy_refs:
  - serpent
  basis: The small hawk leaves a snake in the bower-bird’s enclosure after failing
    to find young or eggs, and the snake kills the bower-bird.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The snake is an instrument in an animal quarrel rather than the central
    figure of a serpent myth.
- id: motif:5
  label: humble animal healer cures incurable injury
  taxonomy_refs: []
  basis: Many figures decline or cannot treat the injured turkey, but the earth-grub
    cures him by entering the diseased flesh and removing the putrid matter.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No supplied taxonomy item directly matches animal healing or medical rescue.
- id: motif:6
  label: ascent of healed patient and healer
  taxonomy_refs:
  - ascent
  basis: After the cure and corroboree, the turkey and earth-grub shift upward with
    the clouds and skies, and the gathering sings that their brother goes up.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage describes upward movement but does not present a detailed
