  claim: The lunar episode has the same function as a seasonal-cycle motif because
    it explains monthly recurrence through the sending of different moons that emerge,
    rise, sink, and die.
  claim_level: same_function
  target: seasonal_cycle motif family, specifically lunar periodicity
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: This is a functional typology only; the passage gives no basis for
    historical contact, common inheritance, or comparison with a named external text.
