canonical_text:
  quote: ''
  summary: 'The passage describes several recreation practices: throwing a leaf into
    smoke; mimicking animals and birds, including emus, kangaroos, and water-birds;
    drawing animal and bird tracks in sand and adding an oversized European boot-print;
    a coursing game using a live tethered animal released for hand recapture; and
    a Kalkadoon pit-throwing game in which a bone is slung over an emu-net into an
    excavated hole.'
  language: English
  quote_policy: summarized
