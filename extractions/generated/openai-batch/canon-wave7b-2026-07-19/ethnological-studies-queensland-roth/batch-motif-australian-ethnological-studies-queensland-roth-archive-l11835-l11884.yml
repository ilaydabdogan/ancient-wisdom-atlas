canonical_text:
  quote: ''
  summary: The passage describes post-fight adjudication by old men, elders, and a
    camp-council; retaliatory punishment when a victor is judged unjustified; escalation
    of quarrels through brothers and camp members; sanctions for homicide; delivery
    of a culprit to a slain person's partisans; a gauntlet-like ordeal with weapons;
    possible further demands for another man; and ostracism for flight from punishment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a fight between two individuals ends, old men and elders inquire into
    the rights or wrongs of the dispute.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the victor is judged to be the aggrieved party and can show sufficient
    cause, no further action is taken.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the victor's grounds are not accepted as sufficient, he must undergo the
    same mutilations from the vanquished that he inflicted; his brother is expected
    to bring him back for punishment, and flight from camp prevents return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A vanquished person judged to have justice on his side is afforded an opportunity
    to retaliate with similar injury and a similar weapon.
  category: action
  evidence_refs:
  - ev:3
  - ev:12
- id: obs:5
  text: When party feeling is high, brothers on either side may take up the quarrel,
    and men and women of the whole camp may join a general melee; efforts are made
    to prevent such escalation.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: If one combatant is killed and the survivor cannot show sufficient cause,
    the camp-council may have the survivor killed in a similar manner and require
    him to dig both his own grave and the victim's grave.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the slain person belongs to a neighbouring tribe, his friends and brothers
    may later demand the culprit, usually backed by warriors, and delivery is usually
    given.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The delivered culprit must face the onslaught of the victim's partisans single-handed;
    he may use a shield against spears or a fighting-stick against fighting-sticks,
    and may sometimes survive by accident or through gifts to ringleaders.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
  - ev:13
- id: obs:9
  text: The deceased person's friends may require another man even after the destroyer's
    death; refusal can lead to collective fighting and further deaths.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A homicide may receive private information that a party is coming after him,
    but is said to rarely try to escape; if he flees, he knows he will be ostracised
    forever.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage fragment states that, in earlier days, a party seeking satisfaction
    would surround the camp at night-time to guard against escape.
  category: action
  evidence_refs:
  - ev:11
