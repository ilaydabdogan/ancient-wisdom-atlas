canonical_text:
  quote: ''
  summary: The passage describes several hut and shelter forms in north-west-central
    Queensland, including the winter unnahudye, temporary winji-winji bough-sheds,
    doorway windbreaks, storage practices, contact-era changes in materials and hut
    form, and related hut forms named among Mitakoodi and Kalkadoon groups.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The unnahudye is described as a hut designed especially for warmth and winter
    use.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The unnahudye is made over a flat-bottomed ground excavation whose bottom
    forms the floor, with scaffolding of wundaroo and prinna, wet grass in the spaces,
    and mud covering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A wet mud ring is placed around the entrance of the unnahudye, forming an
    artificial door-frame and giving an ornamental appearance.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: A large fire is kindled inside the unnahudye in the corner opposite the door,
    and the embers are removed by sundown after the place has become warm enough for
    sleeping.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The winji-winji is described as a temporary bough-shed, lightly made of grass
    and bushes, for protection from sudden rain.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: One common winji-winji form is attached to a hut to shelter the fire usually
    kept burning outside, with people passing in and out on either side of the fire.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Another winji-winji form uses boughs and saplings resting on a naturally sloping
    tree trunk, with the trunk acting as a wundaroo.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Around Boulia, bark is said to be unusual as hut wall-covering, while European
    contact is linked to spliced timbers, rope, hides replacing mud and grass coverings,
    and the decline of the unnahudye with the use of clothes and blankets.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage reports a gradual decrease in floor depth below ground and a corresponding
    increase in hut height above ground for the unnahudye form.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Hut entrances are generally placed opposite the direction of prevailing winds,
    and a break-wind may be built on one or both sides of the doorway to protect the
    fire and people squatting nearby.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The break-wind, called wul-lo-a or yung-ko, is made of light leafy saplings
    fixed into the ground and interwoven with other saplings and grasses placed crosswise.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Occupants’ koolamons, dillybags, boomerangs, and other items may be kept on
    the ground inside or outside, or on or against the roof; spears are always stuck
    vertically into the walls with butt-ends downward.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Among the Mitakoodi in the Cloncurry District, a hut or gundi is called a
    yin-bur and is built after the same general scaffolding style as the Boulia kooroui,
    with grass filling, bark-sheet covering, heavy boughs on top, and no earth dug
    from the floor.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: In the Leichhardt-Selwyn District, the Kalkadoon wul-li-be-ri is described
    as built much like the second Boulia winji-winji, using a bent tree trunk or low
    horizontal branch against which saplings and boughs are fixed.
  category: relationship
  evidence_refs:
  - ev:8
