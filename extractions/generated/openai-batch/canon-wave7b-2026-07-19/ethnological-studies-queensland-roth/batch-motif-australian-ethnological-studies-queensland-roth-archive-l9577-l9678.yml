canonical_text:
  quote: ''
  summary: The passage describes personal ornamentation and body modifications in
    North-West-Central Queensland, including an opossum-skin spiral head band, a wooden
    cross-piece, traded handkerchief head-dress, ochre and gypsum face decoration,
    nose and ear piercing, upper-incisor avulsion, beard tying, and grass-reed necklaces
    associated with a first degree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A spiral band called kul-go by the Mitakoodi was made from a long strip of
    opossum skin cut concentrically, stretched, dried, and wound around the head;
    men and women wore it and removed it at night.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wooden cross-piece called ia-ka-le was encountered in the Boulia and Cloncurry
    Districts only at corrobboree times.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Red and other handkerchiefs, originally obtained from colonial or settled
    centres and then bartered between tribes, were folded and tied as head-dress;
    small objects could be carried under the knot, and the cloth could protect the
    back of the head and neck from sun.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: Faces could be smeared with greased yellow or red ochre or decorated with
    transverse white bands; the white material is described as burnt gypsum mixed
    with water into a hard-drying mass.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nasal septum piercing is described as practised everywhere by both sexes,
    at any time of life, voluntarily, and without special signification; nose-pins
    could be made from bird, kangaroo, or emu bone, or from reed or feather quill.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ear-holes are reported only among some older Mitakoodi men in the Cloncurry
    District; the passage says ear piercing was formerly common but is no longer done.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The two central upper incisors were knocked out among Boulia District tribes
    and among the Yaroinga by loosening the teeth and using sticks or tools to break
    them out; the passage describes the practice as voluntary, dying out, and not
    currently connected with initiation ceremonies.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: In the Boulia District the beard was sometimes tied close to its base with
    twine to make it look attractive or conspicuous, both at corrobboree time and
    on other occasions.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Necklaces in North-West-Central Queensland are described as mainly made from
    grass-reed or opossum-string; the reed necklace is manufactured everywhere, usually
    by women, and is called ko-nu-pa in several districts.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: The reed necklace is called the badge of the first degree and could later
    be worn by both males and females; its reed beads were cut with mussel shell or
    stone knife, and some beads had rings cut into them.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:10
