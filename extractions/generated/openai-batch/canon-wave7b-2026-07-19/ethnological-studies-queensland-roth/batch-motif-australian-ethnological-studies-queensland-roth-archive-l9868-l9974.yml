canonical_text:
  quote: ''
  summary: The passage describes body painting, feathering, and ornamental scarification
    among North-West-Central Queensland Aboriginal groups, including occasions for
    decoration, materials used, gender restrictions in feathering, and reported methods
    and distributions of flash-cut scars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At corroborees or for appearing conspicuously decorated, transverse and semi-lunar
    white paint bands or greased yellow and red ochre may be applied to the body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women in the Boulia District may apply a greased yellow or red tri-linear
    pattern by dabbing three fingers in paint and smearing it along limbs and across
    the trunk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The tri-linear marking is identified as koo-di-ja koo-di-ja and is said to
    occur in female corroboree decoration and in ornate boomerang ornamentation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Grease colour painting is distinguished from general smearing with fat, which
    is described as used for sickness or relief after a long journey.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Feathering of the body is described as limited to corroborees and to men only.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: White feather-down is obtained from birds, and red feather-down is made by
    dusting feathers with greased red ochre; no yellow feather-down is made.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Blood is collected and painted over a delimited body surface, after which
    pinches of feather-down are applied and held in place by coagulation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Preparation for feathering may occupy the whole day before night festivities,
    and women and children are not allowed to watch the procedure.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Flash-cuts or scars are described on trunk and limbs in both sexes, commonly
    as transverse scars from about nipple level to the navel and longitudinal cuts
    on the front of each shoulder.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Additional regional scar placements are described, including cuts on the back
    among the Mitakoodi and transverse scars on the upper arms among the Taroinga.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that flash-marks presently have no connection with initiation
    ceremonies, are optional, and are declining more rapidly among females than males.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Flash-marks are described as raised scars, initially incised with a sharpened
    flint or glass-chip along a charcoal or kopi line.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Reported methods for raising scars include rubbing pig-weed into wounds, picking
    at the wound, or applying bird or other blood to increase clot size.
  category: sequence
  evidence_refs:
  - ev:8
