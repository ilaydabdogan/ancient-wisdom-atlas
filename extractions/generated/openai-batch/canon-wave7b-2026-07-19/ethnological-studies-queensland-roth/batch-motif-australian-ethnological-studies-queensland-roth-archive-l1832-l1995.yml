canonical_text:
  quote: ''
  summary: A grammar passage for the spoken language of the Pitta-Pitta gives example
    sentences about kin giving objects, food division, hunting, hitting animals, temporal
    suffixes, conjunctions, and adjective comparison. The illustrative translations
    include a doctor stealing a wife, people returning to camp, snake striking or
    eating, travel at sunrise or sunset, and actions involving boomerangs, spears,
    dilly-bags, pituri, water, and animals.
  language: English with Pitta-Pitta examples
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sister gives a big dilly-bag to her brother, and a father is described as
    giving a boomerang to his child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Several examples involve food: asking a woman for food, dividing food, a
    fat man becoming full of food, and a fat woman giving food to a thin dog.'
  category: action
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:3
  text: 'Several examples involve animals and hunting or striking: an old man catches
    an emu with a net, an old woman hits a crow with a stone, a speaker hits a snake,
    and siblings eat a snake.'
  category: action
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:4
  text: The grammar section states that there are no prepositions specifically signifying
    time, duration, or how long, and gives suffix patterns for future, present/past,
    and after/since relations.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Temporal examples include meeting at sunset, diving at sunrise, returning
    in two or three days, and returning in a month.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
- id: obs:6
  text: One translated example states that while an old man went away, the doctor
    stole the wife.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The conjunction examples include giving a woman a dilly-bag and pituri, men
    bringing boomerangs and spears, a man returning to camp with his wife, and an
    old man sitting alongside his wife.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The comparison section explains expressions of equality, similarity, difference,
    and comparative adjectives using examples such as equally old man and woman, similar
    boomerangs or spears, different dilly-bags, and one person being better or worse
    than another.
  category: other
  evidence_refs:
  - ev:7
