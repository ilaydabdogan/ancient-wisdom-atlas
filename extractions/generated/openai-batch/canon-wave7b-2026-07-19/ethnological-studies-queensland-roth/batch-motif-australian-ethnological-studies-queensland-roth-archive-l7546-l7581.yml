literal_observations:
- id: obs:1
  text: The WitooTea plant is described as having an edible root that is slender,
    brittle, and shaped like a long radish.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The WitooTea sign imitates fingers carefully pulling the root out of the soil;
    a Ulaolinya form uses a half-extended forefinger and a thumb closed on the remaining
    fingers with similar movement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mungaroo sign imitates winnowing husks off seeds between thumb and forefinger
    by rolling one vertically on the other while moving horizontally; the movement
    is slow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The native-flax/net-making sign imitates soaked flax being rolled backward
    and forward along the front and side of the thigh, with pressure alternating between
    palm or ball of thumb and the length of the fingers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Boinji and Undekerebina people, the native-flax/net-making sign
    also includes the other hand held up with twisting digits to indicate the further
    end of newly made twine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: One pig-weed sign has the thumb and fingers holding a twig while a wrist-shaking
    movement drops seed into a koolamon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Another pig-weed sign uses the same wrist-shaking movement but holds the plant
    differently.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Two further pig-weed sign variations imitate rubbing or scraping seeds from
    a bunch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Nardoo sign has the palm of one hand, with a nardoo-stone, beating on
    and along the back of the other hand in slow measured time.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Nardoo sign represents pounding seed between two stones to crush hard
    shells.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The general seed-food sign shows grass tufts held in the hands and rapidly
    shaken so that seed falls into a koolamon below.
  category: action
  evidence_refs:
  - ev:8
