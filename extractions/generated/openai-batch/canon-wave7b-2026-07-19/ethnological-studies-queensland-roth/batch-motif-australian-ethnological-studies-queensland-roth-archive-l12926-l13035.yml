canonical_text:
  quote: ''
  summary: 'The passage describes procedures by which a sick or injured person identifies
    an alleged assailant through a friend, dream, or doctor; seeks retaliatory bone-pointing;
    undergoes a doctor''s performance of extracting a hidden object from the body;
    and learns a named enemy selected by practitioners. It also explains the bone-apparatus:
    at night, a death-bone is pointed, the victim''s blood is said to pass invisibly
    to a receptacle, and a bone, pebble, or similar object is said to pass invisibly
    into the victim''s body and cause sickness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The patient, after recovering somewhat, determines to find out who caused
    the injury.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Three stated methods for discovering the assailant are asking a friend or
    relative, seeing the culprit in a dream, and consulting a doctor.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: When a friend supplies a name, the patient may give a present to a doctor
    and ask him to point the bone at the alleged assailant.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A medicine-man may refuse the task if the alleged culprit is physically stronger
    or more influential, because he fears possible retaliation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the patient recognizes an enemy or assisting doctor in a dream, he may
    fight one or both with knife, spear, or boomerang, aiming to cripple rather than
    kill.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that the patient avoids killing because his own blood remains
    in the alleged enemy's bone-apparatus receptacle until it is rinsed out with water,
    leaving his life in danger.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: When consulted, the doctor asks where pains are marked, rubs or massages the
    affected parts, and may rinse his hands in water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The doctor may blow on the patient's chest, take water into his mouth and
    spit it out, or apply suction to the painful part.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The doctor produces a bone, pebble, flint, quartz, or similar item, usually
    into his hand or mouth, which bystanders believe he has drawn from the affected
    body part.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: After the displayed object is removed, the sick person is described as cured,
    though still endangered because his blood remains in the enemy's bone-receptacle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The consultant examines the removed object and tells the patient which rival
    doctor it belongs to, identifying who did the mischief.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The doctor consults privately with fellow-practitioners, and they collectively
    select a person as scapegoat before the doctor names that person to the patient.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The bone-apparatus procedure occurs at night while the target sleeps.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: While the death-bone is pointed, the passage says the victim's blood passes
    invisibly to the pointer and along a connecting string into a receptacle, while
    a doctor's object passes invisibly into the victim's body and causes sickness.
  category: action
  evidence_refs:
  - ev:6
