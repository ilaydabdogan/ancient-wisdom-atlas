canonical_text:
  quote: ''
  summary: The passage first gives a brief account of a galah-parrot and an opossum
    fighting with tomahawks, resulting in the parrot's red neck and breast plumage
    and the opossum's black snout mark. It then describes the return boomerang as
    a light, small, non-bartered man's toy, with notes on its shapes, coloring, ornamentation,
    manufacture, and several regional games played with it in the Boulia, Yaroinga,
    and Mitakoodi contexts.
  language: English
  quote_policy: summarized
