- id: obs:1
  text: A galah and an opossum, each with tomahawks, fight one day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fight leaves the galah with cut-open neck and breast, associated in the
    passage with red plumage, and leaves the opossum with a black mark on its snout.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The return boomerang is described as lighter and smaller than a fighting boomerang,
    with shapes ranging from a strong angle to a half-moon and with the bend in the
    centre.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The return boomerang may be cut down from a damaged or broken boomerang, may
    be smeared with charcoal, and may be ornamented with varied gravings.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The return boomerang is not a recognized article of exchange or barter, does
    not travel, is made as needed, and is described as strictly a man's toy.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Boulia District game, several men stand in file with raised arms and
    hands on the shoulders of the man in front; another player throws the boomerang
    over them, and they follow its circling movement while trying not to be hit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Among the Yaroinga on the Upper Georgina, players may form two sides, with
    a member of one team trying to hit an individual of the opposite group.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the Cloncurry District, the Mitakoodi fix a peg in the ground, and the
    player whose boomerang strikes or comes nearest to the peg when it falls is declared
    the best man.
  category: action
  evidence_refs:
  - ev:7
