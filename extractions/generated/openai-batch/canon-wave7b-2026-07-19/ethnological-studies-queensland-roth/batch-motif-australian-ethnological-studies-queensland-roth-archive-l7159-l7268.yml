canonical_text:
  quote: ''
  summary: The passage catalogs manual signs used to express ideas about birds. The
    signs represent bird kinds through wing motions, claws, beaks, bills, toes, head
    movements, locomotion, feeding actions, diving, and capture methods. Several captions
    give regional or group abbreviations for where the signs were recorded.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents a catalog of manual signs for bird referents, with each
    sign tied to a bodily feature, movement, behavior, or capture method.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: General bird signs use arm or wrist movement to represent wing beating or
    flapping.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Small hawk and large eagle-hawk signs represent predatory action by swooping
    with prey, closing claw-like fingers over quarry, or circling flight.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: Pigeon signs include a vibratile wrist and forward forearm movement, and a
    flock-pigeon sign represents turning over a net in capture with two hands holding
    a long wooden handle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: Emu signs represent toes, treading, head-and-neck nodding, and wobbling of
    the body and tail-feathers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: Turkey-bustard signs represent side-to-side rotation of the bird's head through
    wrist rotation and hand positions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: Pelican signs represent the large lower bill by cupped hands or twisted fingers,
    and one sign represents the bill ladling up water in large quantities.
  category: object
  evidence_refs:
  - ev:8
- id: obs:8
  text: Cockatoo, galah, and parrot signs indicate the beak and top-knot by flexed
    fingers that suddenly extend and separate, or by a hooked forefinger tapping the
    upper gums or incisors.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: The duck sign uses the forefinger brushed horizontally in front of the mouth,
    with reported interpretations of a flattened wide bill or capture by slip-noose.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: The black crow sign uses separated clawed fingers and swift wrist rotation
    to express digging up earth for offal or food.
  category: action
  evidence_refs:
  - ev:11
- id: obs:11
  text: Divers-birds and shags are represented as diving into water and coming out
    again.
  category: action
  evidence_refs:
  - ev:12
- id: obs:12
  text: 'Native-companion and spoon-bill signs are explicitly compared: both involve
    indicating an elongated beak by one or two fingers, while their head movements
    differ vertically and laterally.'
  category: relationship
  evidence_refs:
  - ev:13
