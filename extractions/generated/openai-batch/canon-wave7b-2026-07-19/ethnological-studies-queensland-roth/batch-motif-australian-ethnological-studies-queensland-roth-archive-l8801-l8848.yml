canonical_text:
  quote: ''
  summary: The passage describes methods for catching flock-pigeons, budgerigars,
    galah parrots, and other birds in north-west-central Queensland, including mokwari
    nets placed by artificial water-holes, concealed hunters, water carried to small
    excavations, hook-boomerangs thrown into flocks, and palisade alleyways extending
    from water-holes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Flock-pigeons along the Burke, Georgina, and other rivers are described as
    being caught in small-mesh nets called mokwari in the Pitta-Pitta language.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mokwari net has an upper edge attached to a long thin curved stick held
    by the hunter, and a longer lower edge fixed into the ground with small forked
    twigs.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: A small artificial water-hole is made near the main channel where birds usually
    alight; it is scooped by hand and fills with clear water in sandy soil.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: The hunter hides under bushes and sand, controls the net handle, and swiftly
    revolves the net over birds gathered at the artificial water-hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A similar but smaller mokwari net is used by the Mitakoodi in the Cloncurry
    District for flock-pigeons, galah parrots, and other birds.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Mitakoodi method, a small excavation is filled with water carried in
    large koolamons, and a woman refills it as it dries before retiring so birds come
    to drink.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Mitakoodi hunter remains concealed, half-hidden underground and covered
    with bushes, while waiting for the birds to come down to drink.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Mitakoodi method is said to be used especially in summer when natural
    water-channels have dried.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the head-waters of the Georgina, the Workia and Taroinga tribes bring down
    flock-pigeons by throwing a hook-boomerang into a mob of them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Green shell-back love-birds or budgerigars and other small birds are caught
    with a net and alley-way in the Boulia and Upper Georgina districts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The alley-way method uses two long divergent palisades made of bushes, saplings,
    and twigs extending from a water-hole, with part of the alley cleared of trees.
  category: object
  evidence_refs:
  - ev:5
