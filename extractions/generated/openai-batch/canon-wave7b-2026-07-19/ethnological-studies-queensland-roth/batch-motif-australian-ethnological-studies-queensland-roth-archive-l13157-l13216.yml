canonical_text:
  quote: ''
  summary: 'The passage describes several forms of harmful death-bone or munguni practice:
    a fatal snake-bite caused by a snake sealed with blood, other injuries commanded
    through captured blood, a long-distance Bedouri/Ooioopooloo form using birds to
    obtain blood, and restrictions on women’s handling of the implement while noting
    some women’s healing or indirect harmful practice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A doctor is said to seal a small snake with the required blood in an implement,
    smear the implement with fat, and allow the intended victim to leave camp.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: While away from camp, the victim may feel something at his leg or foot and
    see a snake about to bite him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The snake involved in this fatal bite is said to vanish into space rather
    than crawl away or hide like an ordinary snake.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bitten person recognizes the vanishing snake as evidence that an enemy
    has been pointing the munguni at him, believes death is certain, makes no effort
    at remedy, and dies.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: If the bitten man’s wife is present, she runs back to camp and informs a doctor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The doctor questions her about the bite, snake, and patient, then looks at
    the sky to see whether Mulkari is spitting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the doctor says Mulkari is not spitting, he tells the woman that a mortal
    has obtained her husband’s blood and that the husband cannot be saved.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: At a later time the doctor may tell the widow who caused the death, after
    which she informs her brothers and other kin, who take steps to avenge the death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Some doctors are said to talk to captured blood and command it to kill or
    injure the person from whom it came by lightning, a falling tree, a thorn in the
    foot, or disease.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: At Bedouri, the wul-loo-ka is described as a modification of the munguni that
    can act over very long distances.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: A person with a grudge may tell a white crane, blue crane, or pelican to travel
    the distance and obtain blood by pointing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The victim may see one of these birds at night and throw a stick at it, but
    the bird remains until it has obtained enough blood in the bone-apparatus receptacle
    and then flies back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: The would-be assailant may send four or five other birds to learn whether
    the intended victim is sick, avoiding use of the same bird because it might deceive
    him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Mulkari is said to have invented the wul-loo-ka method and taught both systems
    to the Ooioopooloo men; the commoner process spread through the district, but
    the wul-loo-ka secret was kept from northern neighbours.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: A woman must not handle or look upon a munguni, but may know and practice
    removal by mouth or hand of an alleged object inserted in a patient’s body and
    prolonging sickness.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: A woman is not openly allowed to join secret deliberations of male practitioners;
    if she wants another woman’s blood, she may ask her husband or brother to act.
  category: relationship
  evidence_refs:
  - ev:8
