canonical_text:
  quote: Lord ! (who dwellest) amongst the sky.
  summary: The passage is a grammar section with Pitta-Pitta examples and English
    translations. It illustrates motion with companions, departure and return, throwing
    spears or boomerangs at animals, hunting, carrying a child, stealing spears, and
    rest/location prepositions involving huts, sky, camp, mountains, creeks or streams,
    a gidyea-tree, pituri, a koolamon, an opossum, and a lizard. One translated example
    says men printed in OCR as “Bud men” will not go to heaven, glossed as sky; another
    addresses a Lord dwelling among the sky.
  language: English with Pitta-Pitta examples
  quote_policy: quoted
