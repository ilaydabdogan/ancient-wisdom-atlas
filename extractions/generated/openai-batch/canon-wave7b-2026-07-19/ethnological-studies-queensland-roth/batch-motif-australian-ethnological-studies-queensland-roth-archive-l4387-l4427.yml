literal_observations:
- id: obs:1
  text: The Leichhardt-Selwyn District is described as including the Selwyn Ranges
    and highlands drained by the Leichhardt and tributaries of the Upper Georgina,
    and as wild mountainous country watered by natural springs.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Leichhardt-Selwyn area is said to be occupied chiefly by the Kalkadoon,
    with Workoboongp, Injilinji, and Oboroondi named as messmates.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Mitakoodi are described as eastern and northern neighbours of the Kalkadoon
    and as sometimes dividing the Kalkadoon into Muntaba and Roongkari divisions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that very few words or roots are common to the Leichhardt-Selwyn
    and Cloncurry districts despite their contiguity.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Cloncurry District is described as drained by the Cloncurry River and
    branches, occupied by the Mitakoodi, and bounded by Kalkadoon and Woonamurra country.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Woonamurra are described as inhabiting the watershed of the Saxby and
    Flinders, with Nouun at Mullangera named as messmates of both Woonamurra and Mitakoodi.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Woonamurra, Mitakoodi, and Wommin are said to come to Mullangera to barter.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Elookera or Walookera are described as a small tribe in the Upper Georgina
    District using words distinct from neighbouring peoples.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Yunnalinka are described as formerly having head-quarters at Carandotta
    and as now probably extinct.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Yaroinga are described as numerous, geographically scattered, and in contact
    with the Undekerebina, with whom they are friends and messmates.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that many words in the Yaroinga and Undekerebina dialect
    lists are markedly similar.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Yaroinga are also named as messmates of the Workia, who are described
    as powerful and warlike and living north of them.
  category: relationship
  evidence_refs:
  - ev:7
