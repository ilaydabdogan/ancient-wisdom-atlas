canonical_text:
  quote: ''
  summary: The passage describes a bake-house-like cooking arrangement, two methods
    of kindling fire with sticks, the discard and timber variation of fire-sticks,
    the form and uses of the yam-stick, and the construction and rain-shelter features
    of the Boulia District kooroui hut, including its named structural parts and entrances.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bake-house-like structure is described as having a covering including hide
    and mud and being used especially for large pieces of flesh such as emu, kangaroo,
    or bullock.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Throughout North-West-Central Queensland two methods are used for kindling
    fire; the second described method is said to be commoner along the Upper Georgina.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the twirling method, a dry fixed piece of wood with a nick receives the
    sharpened end of a vertical dry stick, which is rolled rapidly between the palms
    with downward pressure until smoke and sparks appear and dry grass is blown into
    flame.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the saw-like rubbing method, a split fixed piece holds fine dry grass in
    a fork, and another angular-edged piece is rubbed along a notch until heated particles
    and sparks ignite the grass.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Fire-sticks, called Pitta-Pitta toor-kin-je, are generally discarded after
    use, made only when wanted, and not carried about for future use in these districts;
    the timber used is said to vary.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The yam-stick is a thin, rough, light stick about four feet long with a flattened
    tip, described as essentially a woman's implement for digging yams and roots,
    shifting ashes, and other domestic purposes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: 'In the Boulia District, three kinds of habitation are named: koo-rou-i, un-na-kud-ye,
    and win-ji toin-ji.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The kooroui was originally designed to withstand rain, later used more generally,
    and is usually built on high ground, hillock, or mound to help water disperse.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Kooroui construction begins with two bent saplings set into the ground at
    an angle and fixed together at their apices; these primary supports are called
    wun-da-roo, meaning backbone or vertebral column.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Secondary sticks called prin-na, glossed as legs, rest against the wundaroo,
    stand roughly parallel, and form the framework over which the hut wall is built.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The hut wall is made with light bushes, grass tussocks, sometimes a mud coating,
    and an outer layer of bushes; smaller huts enclose a more circular ground space,
    larger ones a more elliptical space.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: An entrance called te-ra is made by omitting prinna at part of one end; if
    rain beats in, the opening is covered with bushes, and larger huts may have an
    entrance at each end so either can be blocked according to the rain direction.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: The ground inside the hut is not intentionally lowered, though repeated use
    and treading may make it appear lowered.
  category: setting
  evidence_refs:
  - ev:13
