canonical_text:
  quote: ''
  summary: The passage introduces a chapter on law, order, fighting, and weapons,
    then describes dispute settlement and fighting practices among the Pitta-Pitta
    and other Boulia District groups. It describes collective punishment by a camp
    council, the escalation of private quarrels, mediation by friends and women, weapon-specific
    limits on injury, stone-knife grappling, a posture indicating defeat, women’s
    participation in frays, and pride in wounds received during fights.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chapter is framed as concerning the maintenance of law and order, fighting,
    and fighting weapons.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Pitta-Pitta and other Boulia District tribes, the passage says there
    are few old men whose opinions and wishes would otherwise be respected and enforced.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: An individual is described as having to reckon with the injured person, relatives,
    and in some cases the whole camp collectively.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The camp as a body may punish murder, incest, or promiscuous use of fighting
    implements within the camping ground; the passage describes death and probably
    digging one’s own grave in the former case, and crippling with knives in the latter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A private quarrel may begin with animated conversation, obscene language,
    a customary hand-to-mouth gesture, and the throwing of a boomerang that may be
    answered by another implement.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mutual friends or women usually attempt to separate the pair; otherwise the
    combatants may run for a spear or other handy object and throw it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A truce, when present, is described as usually temporary, and each combatant
    may have a concealed stone-knife in the waist-belt.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a feud becomes serious, both parties may move away from camp; in private-quarrel
    fighting, the passage states that there is usually no intention of killing.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'The passage states weapon-specific targets: two-handed swords aim at the
    head, spears at fleshy parts of the thighs, and stone-knives at shoulders, flanks,
    and buttocks.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In stone-knife fighting one person may grapple the other, hold him with one
    hand, stick the knife into a permitted locality, and turn the wrist to make a
    gash before removing the blade.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A Glenormiston incident in 1894 is given in which Toko Tommy was remonstrated
    with for making a cut into the back of his adversary’s knee and blamed the adversary
    for moving his leg.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Lying on the back on the ground is described as a posture in which no lawful
    stone-knife incisions can be made and as the sign that a combatant has had enough
    and gives in.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Women associated with the combatants, as well as others, may fight among themselves
    with tongues and fighting-poles while children and spectators make noise around
    the scene.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: At Glenormiston, women coming to join a fray are described as making a war-whoop,
    jumping, and knocking up dust and sand with a fighting-pole or similar object
    held between their legs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Before fighting, combatants usually remove even the small amount of clothing
    ordinarily worn, and they are described as proud of wounds received in fight.
  category: action
  evidence_refs:
  - ev:9
