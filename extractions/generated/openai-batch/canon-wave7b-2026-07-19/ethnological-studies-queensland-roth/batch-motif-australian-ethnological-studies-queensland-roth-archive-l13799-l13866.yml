canonical_text:
  quote: ''
  summary: 'Section 294 describes a Boulia District rain-making procedure attributed
    to Miorli men: construction of rain-sticks with quartz pieces, a waterhole ceremony
    with song, dance, splashing, submergence of the stick in a hollow log, later scratching
    and gypsum painting, restrictions on women seeing the object or submergence, and
    removal of the rain-stick when rain falls.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Boulia District, when rain is wanted, word is sent to Miorli men at
    Springvale or the Diamantina Gates to come and make rain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rain-making performance is carried out with a rain-stick, a song, and
    a dance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The rain-stick is made from white wood, cementing substance, three white quartz-crystal
    rain-stones, beard hair, leafy white-wood branches, and string; three or four
    sticks may be used.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: At about midday, the men go to a secluded waterhole where a hollowed log has
    already been fixed vertically into the mud.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The men enter the water, surround a central individual holding the rain-stick,
    stamp with their feet, splash water onto the rain-stick, and sing.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: After the singing, the central figure dives, attaches the rain-stick into
    the hollow log, returns to the surface, climbs onto the bank, and spits water
    obtained below onto dry land.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: If more than one rain-stick has been prepared, the waterhole performance is
    repeated with each stick in turn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: On returning to camp, participants scratch the tops of their heads and inner
    shins with a small twig while singing; using fingers directly is said to spoil
    the ceremony.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Back at camp, the participating men paint themselves with gypsum in thick
    bands on the head, face, neck, torso, shoulders, arms, and forearms.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: No woman is allowed to see the rain-stick or the ceremony of its submergence,
    though the wife of the boss rain-maker may join in the later twig-scratching.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that no special Miorli individual alone can make rain;
    any member of the tribe can learn the process and be successful when in possession
    of a piece of white quartz.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: When rain eventually falls, the rain-stick is removed from the water.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: During the 1895 floods and rains at Boulia, the inability to remove the submerged
    rain-stick was given as the reason the rain would have to run its course.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Miorli rain-makers may travel to Marion Downs and from there to Warenda, Noranside,
    Chatsworth, and other places for similar purposes.
  category: action
  evidence_refs:
  - ev:10
