- id: obs:2
  text: One Native Companion sign uses wrist flexion, with the forefinger representing
    the long-necked head and beak moving vertically down into water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another Native Companion sign uses the fore and middle fingers, with the former
    overlapped, and uses a movement similar to the preceding sign.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: One Large Spoon-bill sign uses a finger to represent the head and beak, moved
    side to side at the elbow in imitation of the bird's habit.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Another Large Spoon-bill sign places the first two fingers at the mouth and
    moves them forwards and downwards to indicate the bird's flattened beak.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Reptile ideograms for lizards and iguanas are described as using quick side-to-side
    oscillatory or vibratory movements from the elbow with a fixed wrist, indicating
    rapid speed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: One iguana sign represents a clumsy, wobbling, twisted side-to-side gait of
    the limbs in a larger variety of iguana.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Snakes in general are expressed by the forearm with a closed hand, imitating
    the animal's body and head.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: One snake sign shows the animal's head protruding from the surface while crossing
    water.
  category: action
  evidence_refs:
  - ev:8
