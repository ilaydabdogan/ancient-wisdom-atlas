canonical_text:
  quote: ''
  summary: The passage describes illustrated Queensland Aboriginal letter-sticks,
    explaining marks and conveyed messages for Figs. 326-338. The examples include
    invitations to corroborees or meeting places, requests for pituri or other goods,
    route and locality markers, moon/time markers, environmental signs for a meeting
    place, phallic or ornamental marks, colors and shapes of sticks, and a request
    for spears, boomerangs, and shields in connection with an initiation ceremony
    at a river.
  language: English
  quote_policy: summarized
