canonical_text:
  quote: ''
  summary: A grammar passage explains Pitta-Pitta reciprocal, reflexive, intransitive,
    indefinite-action, purposive, and relative-pronoun constructions. Its example
    sentences include mutual fighting, barter, self-smearing, meeting, chattering,
    eating, teaching language, avoiding a woman, resting in a hut, stopping a boy
    from climbing a tree-trunk, bringing spears, swimming in rivers and creeks, attending
    sick or delicate persons, preventing spear theft, and caring for a wife.
  language: English with Pitta-Pitta examples
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The suffix -mulle is explained as meaning reflexive or reciprocal action,
    including examples of fighting, bartering, cutting one another, chattering together,
    and meeting one another.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that adding -le to a transitive verb can form an intransitive
    expression, with examples involving eating, drinking, seeing, and a headache expression.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The suffix -ma is described as marking indefinite action, such as running
    or swimming about here and there; a regional -cha variant is noted south of Boulia.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The suffix -re is described as adding definiteness or purpose and making an
    intransitive verb transitive, with examples glossed as stealing, attending to,
    looking after, or taking care of someone.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Translated imperative examples include commands or requests to go away, eat
    a big emu, return and dine, tell a group to be quiet, teach Pitta-Pitta, give
    food, avoid a bad woman, rest in a mother's hut, prevent a boy climbing a tree-trunk,
    stop fighting, and bring spears.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Translated reciprocal and reflexive examples describe doctors fighting among
    themselves, a person breaking an arm, self-smearing with fat, bartering a spear
    for a boomerang, meeting at sunset or at two rivers, chattering in a woman's hut,
    self-hitting with a stone, and an old man and old woman hitting each other with
    boomerangs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Translated action examples describe children and pups swimming or running,
    a man dining, a woman drinking, pituri intoxication, attending a sick woman, looking
    after a delicate girl, preventing spear theft, an old man dining, and good men
    not dying.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The relative-pronoun explanation uses apposition and gives examples of a man
    taking care of his wife and a young speaker attending upon the old.
  category: speech
  evidence_refs:
  - ev:7
