  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: Beaters drive fish from the front into the enclosed space made by the nets.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The small-net method generally requires many people to assist.
  category: attribute
  evidence_refs:
  - ev:6
