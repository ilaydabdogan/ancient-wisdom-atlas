literal_observations:
- id: obs:1
  text: Snakes are sometimes found in old iguana-holes or in burrows of their own.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Aboriginal people described will eat a snake when it has been killed by
    themselves or by others.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fish are caught by various methods, with special plant-fibre nets described
    as the most general method in North-West-Central Queensland.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The nets are made from plant fibre, including native flax, and are woven on
    a pattern the author compares to European practice.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A long wooden needle without an eye is used for the net twine; in the Boulia
    District it is called ka-kum-bo-le.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: No wooden mesh is used in manufacture; loop regularity depends on the maker's
    skill.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Net mesh and net dimensions vary; smaller nets are about 6 to 12 feet long,
    and larger nets may be 50 to 80 feet long.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some nets may be decorated with alternating red and yellow ochre bands.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Longer nets are said to be less common in the described area and to be made
