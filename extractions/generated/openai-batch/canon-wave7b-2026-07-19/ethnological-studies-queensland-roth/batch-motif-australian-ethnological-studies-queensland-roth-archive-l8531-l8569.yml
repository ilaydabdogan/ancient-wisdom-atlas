  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Boulia District, smaller nets are generally used in shallow water and
    larger nets in deep water.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: When smaller nets are used together, long thin sticks are attached to their
    sides to keep them open and make them easier to handle.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Pairs of men enter the water from the river-bank with nets, successive pairs
