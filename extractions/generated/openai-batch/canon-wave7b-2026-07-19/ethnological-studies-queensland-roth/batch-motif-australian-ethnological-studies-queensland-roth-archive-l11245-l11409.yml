canonical_text:
  quote: ''
  summary: The passage describes track signals made from small sticks, grass tussocks,
    crossed boomerangs, and footprints; a Boulia practice of marking stored belongings
    with a recognizable foot imprint; the absence of evidence for tree-cut track marks
    in Boulia; extensive naming of landmarks around central camps; and the importance
    of water features in geographical naming and travel orientation.
  language: English
  quote_policy: summarized
