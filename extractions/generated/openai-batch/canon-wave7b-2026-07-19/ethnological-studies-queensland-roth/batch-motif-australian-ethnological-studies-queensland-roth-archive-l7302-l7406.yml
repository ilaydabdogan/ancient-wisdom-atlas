literal_observations:
- id: obs:1
  text: Signs for lizards and iguanas use oscillatory, vibratory, or rotating wrist
    movements to represent rapid movement or a wobbling twisting gait.
  category: action
  evidence_refs:
  - ev:2
- id: obs:2
  text: General snake signs use the fist, forearm, forefinger, hand, or arm movement
    to represent the animal’s head, body, and sinuous progression.
  category: action
  evidence_refs:
  - ev:3
- id: obs:3
  text: The water-snake sign represents the head as out of the water and revolving
    from side to side while the creature swims.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The carpet-snake sign represents a head standing erect from within coils by
    a thumb protruding between closed fingers.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The black-headed-snake sign draws attention to the black snout of the creature.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The frog sign combines a forward-and-downward thrust of the hand with extended
    and separated digits to represent a jump and webbed feet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Most fish signs use rapid side-to-side elbow movement with a fixed wrist to
    show how fish appear through ripples on the water surface.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Initial hand positions in some fish signs are described as signifying body
    parts such as the tail or fins.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: One fish-related sign represents scraping scales from a fish before eating,
    sometimes with the other hand held underneath to show the fish itself.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Another fish-related sign represents biting the back of a fish’s head to kill
    it, throwing it onto the river bank, and continuing to catch more fish in the
    water.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage notes cases where an initial hand position used for one animal
    sign is also used for another animal sign, with the final movement distinguishing
    the meaning.
  category: relationship
  evidence_refs:
  - ev:10
