canonical_text:
  quote: ''
  summary: 'The passage describes burial and mourning practices: a body is carried
    by the camp to a grave, placed face up with the head to the north, covered with
    logs, earth, bushes, and stones, and protected from dingoes and bush-fire. The
    deceased''s possessions and personal name are treated as no longer ordinary property
    or speech. Women and some men make mourning incisions on the thighs. After burial,
    mourners plaster their hair with gypsum, and nearer relatives apply yellow and
    red grease patterns and an armlet according to kinship and age categories.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The body is carried to the burial place, accompanied by the whole camp; some
    people dig the grave while others cut logs and sticks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The body is placed horizontally, face up, with the head pointing north, described
    as the orthodox direction for the body to lie.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grave is covered with longer logs over the body, shorter transverse layers,
    earth, logs, bushes, and sometimes heavy stones, with the surrounding surface
    cleared.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The logs and covering are explained as protection from dingoes disturbing
    the corpse, and the cleared space is explained as protection against bush-fire
    igniting the timber.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The deceased's goods, including boomerangs and spears, are buried with him,
    destroyed by fire, or rarely distributed among his brothers, but not his children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The deceased's personal individual name is said to die with him and is not
    to be mentioned again, especially among near relatives.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Burial normally follows almost immediately after death, or at early dawn if
    death occurs at night; the corpse is not decorated or painted.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At the grave while it is being dug, women cut the outer and anterior parts
    of their thighs with stone or glass in numerous superficial parallel incisions;
    in one locality they may first wash the thighs with their own urine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Carlo, Glenormiston, Herbert Downs, and Roxburgh, but apparently not at
    Boulia, males make a single larger and deeper cross-shaped incision on the corresponding
    part of the thigh.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After burial, the mourners return home sobbing and plaster their heads with
    lumps of gypsum or kopi, making the hair appear white; the plaster may be worn
    for differing periods, sometimes up to six months by wives mourning husbands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Only nearer relatives apply grease coloring down to the waist, with kin categories
    varying according to whether the deceased is an adult male, adult woman, or young
    child.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The body-paint pattern is made by smearing yellow grease first, scraping the
    design with clawed fingertips, adding red afterward, and tying on a tight opossum-string
    armlet.
  category: action
  evidence_refs:
  - ev:7
