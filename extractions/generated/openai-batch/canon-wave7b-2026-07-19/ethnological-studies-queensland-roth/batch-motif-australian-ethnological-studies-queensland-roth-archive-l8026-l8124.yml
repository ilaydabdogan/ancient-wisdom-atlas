canonical_text:
  quote: ''
  summary: The passage describes manual signs for sunrise, sunset, moonrise or month,
    interrogation, request, silence, commands, covering with earth, corroboree performance,
    fire-making, eating, drinking, and other simple acts. It notes variants among
    named Aboriginal groups and one comparison to a European-style interrogation shrug.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hand movements representing the sun rising above or sinking below the horizon
    are linked to meanings such as sunrise, day, to-morrow, sunset, evening, and night-time;
    substituting the moon with slower movement is linked to moonrise and month.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The sunrise/day sign is described as an outstretched cupped hand and fingers
    moved upward by slow elbow flexion to the side and back of the speaker's head,
    with noted finger-position variants among Kalkadoon, Woonamurra, and Goa groups.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sunset/night-time sign is described as an antagonistic movement and position
    to the sunrise sign, representing the sun sinking below the horizon, with the
    same named group variants as the preceding sign.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Interrogation is said to be indicated either by a European-style shrug of
    arms and shoulders or by a special arm-and-hand movement; the passage adds that
    the Pitta-Pitta word for doubt or interrogation is a reduplication of the word
    for arm.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The special interrogation sign uses loosely flexed fingers and a tossing outward
    movement of the hand from the elbow, with different finger openings at the end
    of the gesture among Kalkadoon and Pitta-Pitta.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Request or demand is represented by an outstretched arm and open hand, while
    silence is represented by movements involving the hand and mouth.
  category: action
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
- id: obs:7
  text: Commands or simple acts such as getting out of the road, running, staying
    in place, sitting down, and waiting are represented by distinct arm, hand, fist,
    or forearm movements.
  category: action
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
- id: obs:8
  text: Covering with earth is represented by a shovelling or inward-rotating gesture
    associated with covering a dead body or excreta.
  category: action
  evidence_refs:
  - ev:5
  - ev:10
- id: obs:9
  text: Corrobboree, music, and dancing are expressed by imitations of men beating
    boomerangs, women clapping hollowed hands on their thighs, raising the feet in
    a dance step, and tapping boomerangs together to keep time.
  category: action
  evidence_refs:
  - ev:5
  - ev:11
- id: obs:10
  text: Fire-making signs refer to blowing sparks and tinder or rubbing fire-sticks
    by friction; eating is represented by seed-food signs or a full hand put to the
    mouth and returned empty; the water sign is used for drinking.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage describes a sign for stealing a woman from her source-described
    lawful owners by dragging her away by the wrist.
  category: relationship
  evidence_refs:
  - ev:6
