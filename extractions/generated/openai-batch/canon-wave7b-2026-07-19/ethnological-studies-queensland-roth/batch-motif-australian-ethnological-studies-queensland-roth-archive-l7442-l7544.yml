literal_observations:
- id: obs:1
  text: The passage presents a sequence of manual ideograms for insects, honey, edible
    caterpillar, hair-louse, crayfish, and plants.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
- id: obs:2
  text: Several fly and sand-fly signs are described through finger movements that
    imitate circling flight, rapid lateral movement, catching a fly at the eye, scraping
    a biting insect, or brushing insects from the face.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mosquito signs are described as a cupped palm or thumb and forefinger quickly
    descending or pouncing on the insect.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A honey sign represents viscosity by rotating a stick or finger to prevent
    honey from dropping off.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two honey-related signs refer to obtaining honey by climbing a comb-bearing
    tree using cut nicks and by tapping a tree trunk to test whether it is hollow
    and likely to contain a sugar-bag.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Caterpillar signs include one representation of a small caterpillar and another
    showing an edible caterpillar being eaten with the head pulled off.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The hair-louse sign shows the insect being squeezed between the two thumb-nails.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The crayfish sign represents a claw by opening the forefinger and thumb apart
    from each other.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The plant section states that only plants with economic value are represented
    by signs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: Plant signs described in the passage include gathering or collecting actions
    and preparation actions before eating, such as plucking fruit, digging roots,
    rubbing husks, rolling fibre, shaking or scraping seeds, pounding, grinding, licking
    a mixture from the fingers, bundling wild-rice, and mixing or positioning pituri.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:9
