canonical_text:
  quote: ''
  summary: The passage constructs and compares Germanic divine and heroic genealogies
    involving Tvisco, Mannus, Inguio/Yngvi, Nerthus/Njorth, Freyr/Fro, Hadding, Frothi,
    Odin, and related peoples or dynasties. It discusses proposed linguistic and genealogical
    identifications, the placement of Vanir figures in heroic lines, a sacrifice to
    Freyr, a peaceful threefold Frothi, and a footnote comparing Skadi's bridegroom
    choice with a Saxo episode.
  language: English
