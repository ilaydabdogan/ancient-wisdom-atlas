- id: obs:1
  text: Herakles and Sigurðr are described as having gigantic or godlike bodily scale;
    Sigurðr’s size is illustrated by his sword fitting the height of standing corn
    and a very long hair from his horse’s tail.
  category: attribute
  evidence_refs:
  - ev:1
