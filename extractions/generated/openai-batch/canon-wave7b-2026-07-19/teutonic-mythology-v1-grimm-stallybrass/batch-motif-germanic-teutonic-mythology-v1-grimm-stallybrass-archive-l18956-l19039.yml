  quote: ''
  summary: 'The passage surveys extraordinary bodily traits of heroes in comparative
    Germanic material: giant stature, multiplied limbs, missing limbs or faculties,
    and the recurrent pattern in which a hero’s youth is marked by silence, blindness,
    lameness, stupidity, or low status before his power or identity is suddenly revealed.'
  language: English
  quote_policy: summarized
