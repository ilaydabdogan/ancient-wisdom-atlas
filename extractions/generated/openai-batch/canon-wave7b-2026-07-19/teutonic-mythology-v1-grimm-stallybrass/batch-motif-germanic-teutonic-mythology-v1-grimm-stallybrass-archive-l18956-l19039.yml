  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Thor is said to cut four of Starkaðr’s hands off.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that accumulated limbs are also a mark of the giant race
    and gives examples of three-headed heroes from Servian and Carniolan songs.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Deficiency of bodily members or faculties is listed for gods and heroes, including
    one-eyed, one-handed, lame, blind, dumb, and related conditions.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that heroes’ early years may be clouded by a defect, after
    which hidden force or brightness suddenly breaks forth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Uffo or Offa traditions are summarized in which a hero is blind, dumb, lame,
    deaf, or otherwise impaired before speaking or recovering his senses under decisive
    circumstances.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The son later called Helgi is initially silent and unnamed; after a valkyrie
    greets him by the name Helgi, he begins to speak and accepts the name.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Other examples of delayed heroic unfolding include Starkaðr, Halfdan, Dietleib,
