- id: obs:1
  text: Several heroic or ancestral figures are assigned extraordinary lifespans,
    ranging from about three hundred years to more than five hundred years or through
    several generations.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage contrasts extraordinary heroic age with figures who reach only
    an ordinary limit or die young, naming Dietrich of Bern and Otnit in that context.
