  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: At Skeningen, a marketplace figure called Thore lang is described as a giant
    or hero figure at which idolatry was formerly practiced.
  category: object
  evidence_refs:
  - ev:4
