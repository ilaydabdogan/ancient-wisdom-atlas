canonical_text:
  quote: ''
  summary: The passage surveys exceptional lifespans assigned to heroes and early
    ancestors; the weakening effect attributed to union with goddesses or superhuman
    women; heroic and divine local haunts, stone abodes, and pillars; and the belief
    that heroes sleep in mountains, caves, or springs until they return in time of
    need. It also gives examples of aged heroes withdrawing into hills with twelve
    companions.
  language: English
  quote_policy: summarized
