  quote: '"a hero is a man that in fighting against evil achieves immortal deeds"'
  summary: The passage introduces a chapter on heroes by placing the hero between
    God and man. It describes heroes as human figures with a divine spark, fighters
    against evil who win immortal deeds and divine honours, and semidei or demigods
    in whom the human element still predominates. It contrasts heroes with non-human
    intermediary beings such as angels, elves, and giants, and also notes a linguistic
    analogy in which names of gods can become or approach common nouns.
  language: English
