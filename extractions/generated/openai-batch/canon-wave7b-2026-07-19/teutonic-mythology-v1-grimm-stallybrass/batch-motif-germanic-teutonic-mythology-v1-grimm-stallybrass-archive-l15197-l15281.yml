canonical_text:
  quote: ''
  summary: The passage discusses Fulla/Folia in relation to Frigg, Freyja, Abundia,
    plenty, lunar or constellation associations, and then surveys other goddess names.
    It recounts Gerdr as Freyr's beloved and wife whose radiant beauty is seen from
    heaven, with Skirnir resolving the difficult wooing. It then treats Sif as Thor's
    wife, connected by name with kinship and peace terms, fair-haired, and associated
    with golden hair forged after Loki cuts it off; the author reports but cautions
    against an agricultural comparison with Ceres/Demeter because fuller Germanic
    evidence is lacking.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage presents Fulla/Folia/Folld/Falla as connected differently in
    different sources: sister of Frua in the Merseburg poem and handmaid to Frigg
    in Old Norse material, while still ranked among the Asynjor.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fulla/Folia is described as having a name-based office connected with abundance;
    she bestows prosperity and keeps the divine mother's chest from which gifts are
    given to mortals.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage compares Fulla/Folia with Abundia or dame Habonde and with the
    masculine plenty god Pilnitis/Pilniks adored by Lettons and Prussians.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The author suggests that Fulla/Folia may also have been thought of as the
    full moon and notes nearby references to Orion, Sunna/Sol, and Sindgund/Bindgund
    in connection with constellations.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: A footnote recounts an unnamed male entering as a fly and then as a flea,
    stinging a sleeping goddess until she shook off an ornament.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that surviving proper names, impersonal terms, and occasional
    myths may preserve evidence for additional goddesses once common across Teutonic
    peoples.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gerdr is described as Freyr's beloved and later wife; she is of giant breed
    but is reckoned among the Asynjor.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Freyr sees Gerdr from heaven as she enters a house and closes the door; the
    brightness of her arms makes air and water shine.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Freyr's wooing of Gerdr is described as much thwarted and brought to a happy
    outcome by the skill of his servant Skirnir.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author analyzes Gerdr's name through Gothic, Old High German, and Latin
    comparisons, including a comparison to Cinxia as a name of Juno.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sif is inferred from Germanic words denoting peace, friendship, and kindred;
    she is identified as Thor's wife and is interpreted as a goddess of loveliness
    and love like Frigg and Freyja.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Sif is called fair-haired; gold is called Sif's hair because Loki cut off
    her hair and a finer new growth was afterward forged from gold.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage notes that a herb, polytrichum aureum, bears the name haddr Sifjar.
  category: object
  evidence_refs:
  - ev:8
