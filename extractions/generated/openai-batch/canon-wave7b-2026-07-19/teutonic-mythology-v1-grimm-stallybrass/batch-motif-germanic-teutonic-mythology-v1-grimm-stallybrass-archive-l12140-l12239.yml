  summary: The passage discusses Saturn/Saturnus in relation to Saturday names, a
    temple or pantheon later converted by Boniface, possible Germanic and Norse identifications
    involving Loki and Satan, the Harz idol Saturn/Krodo and its image, and some Anglo-Saxon
    and Slavic comparative material.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cited German verse for Saturday names a thing called rotunda, describes
    it as a lofty temple, names the god Saturnus, and says it was thereafter for the
    honour of all devils.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the worship of Saturn is connected with a pantheon built
    in honour of all gods or devils, which Boniface converted into a church of St.
    Mary.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage lists Anglo-Saxon, English, Frisian, Dutch, Low Saxon, and Irish
    forms of Saturday as preserving Saturn's name, while French, Spanish, Italian,
    and High German forms are grouped separately.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage notes Anglo-Saxon sadere as meaning insidiator, cites a place
    name Sæteresbyrig, and mentions an Anglo-Saxon plant name glossed in relation
    to Saturn.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says ancient Franks spoke of Saturnus as a heathen god and also
    mentions Saturni dolium.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: A note says Anglo-Saxon dialogues between Saturn and Solomon are preserved
    and compares their question-and-discourse form with continental Solomon-Marculf
    dialogues and several Eddic dialogues.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says Old Norse laugardagr and related Scandinavian forms later
    meant washing or bathing day, but suggests an earlier Logadagr or Lokadagr may
    have existed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage proposes that Logi or Loki might answer to Latin Saturnus and
    says a devil-idea connected with Loki was popularly transferred to Satan and Saturn;
    it also describes Locki in Old Norse as seducer, tempter, and trapper.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says Anglo-Saxon Sæteresbyrig recalls a burg in the Harz mountains
    built to the idol Saturn, which the common people called Krodo.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage reports an image of Saturn or Krodo as a man standing on a great
    fish, holding a pot of flowers in his right hand and an upright wheel in his left,
    and contrasts this with Roman Saturn's sickle.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says some Slavic conceptions appear to overlap, citing a brazen
    simulacrum Saturni among tenth-century Slavs and Old Bohemian glosses involving
    Mercurius, Radihost, Kirt, Picus, and Saturn.
  category: relationship
  evidence_refs:
  - ev:7
