canonical_text:
  quote: ''
  summary: The passage describes Wodan/Odin as a wise, world-ruling god especially
    associated with war, battle order, fallen warriors, and victory. It compares him
    with Tyr/Ziu, Mars, and Mercury in learned sources. It then summarizes Paulus
    Diaconus’s legend in which Wodan promises victory to whichever people he first
    sees at sunrise; Frea advises the Winili women to arrange their hair like beards
    and stand with the men, causing Wodan to name them Longobards and grant them victory.
  language: English with cited Latin and Old Norse forms
  quote_policy: summarized
