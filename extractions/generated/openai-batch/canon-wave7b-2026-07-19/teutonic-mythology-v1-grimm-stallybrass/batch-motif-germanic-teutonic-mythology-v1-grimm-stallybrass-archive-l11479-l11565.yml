canonical_text:
  quote: ''
  summary: The passage introduces Heimdallr among Norse gods whose wider Germanic
    traces are difficult to establish. It describes him as a bright white god who
    guards the heavenly bridge or rainbow, dwells in Himinbjorg, has nine giantess
    mothers, possesses extraordinary sensory powers, has a gold-tufted horse and golden
    teeth, bears a powerful horn kept under a sacred tree, is linked to created beings
    as his children, and appears as Rigr in an Eddic account of the ordering of human
    classes.
  language: English
  quote_policy: summarized
