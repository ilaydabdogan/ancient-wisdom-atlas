canonical_text:
  quote: ''
  summary: The passage surveys Norns, fates, spinners, and related female fate figures
    across Germanic and neighboring traditions. It discusses birth prophecies, the
    life-thread or woven destiny image, fays and old women who spin, water-associated
    motherly divinities, Saxo's temple oracle of three nymphs, and Baltic parallels
    such as Laima and Lithuanian life-spinning goddesses.
  language: English with quoted Latin, Old English, Middle High German, and other
    cited terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Nornagestssaga resembles the Meleager story, where three
    Moirai tell Meleager's fortune at birth and Atropos fixes his life to a billet
    burning on the hearth; his mother removes the billet from the fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Modern tales are described as replacing norns or fates with Death; one tale
    of three spinners presents them as ugly old women who help but no longer predict
    and ask to be invited to the marriage and called cousins.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another cited tale has three old women who foretell without spinning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A folk-tale is said to show two maidens spinning in a cave of a mountain,
    with the Evil one chained under their table.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage recalls an Old English expression that describes Wyrd as weaving,
    and notes a Beowulf phrase where God is placed where Wyrd would have stood in
    older phraseology.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gottfried's description of Blicker of Steinach says that fays spun him as
    a wonder and cleansed him in their fountain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Saxo's account, an ancient custom consults the oracles of fates about children's
    futures; Fridlevus goes to the gods' house or temple and sees three seats occupied
    by nymphs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Saxo's first nymph grants the boy beauty and favor, the second grants excellence
    in liberality, and the third, described as ill-natured and envious, lessens the
    others' gifts by attaching parsimony to the boy's future character.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author states that the weaving of the norns and spindle of the fays indicate
    domestic motherly divinities, and connects their sudden appearances, wells, springs,
    spinning, and gifts to children with Holda, Berhta, and similar goddesses.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Lettish Laima is described as laying the sheet under a child at birth
    and determining its fortune; a phrase is cited meaning that Fate ordained it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: A Lithuanian legend describes seven goddesses who successively spin, warp,
    weave, interrupt, lengthen, cut, wash, and deliver the life-garment that becomes
    a person's winding-sheet.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A note on the Hymn to Mercury describes three winged maidens on Parnassus
    who prophesy after eating fresh divine food of honey.
  category: attribute
  evidence_refs:
  - ev:11
