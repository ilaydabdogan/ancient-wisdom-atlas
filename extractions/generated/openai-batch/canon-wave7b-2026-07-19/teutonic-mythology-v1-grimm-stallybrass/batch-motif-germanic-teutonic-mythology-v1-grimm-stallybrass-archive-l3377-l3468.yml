  summary: The passage surveys Germanic sacred-place terminology, especially alah,
    wih/weoh/vé, and haruc/hearg/hörgr. These terms are traced through place names,
    glosses, legal language, and Old English/Old Norse sources, with meanings spanning
    temple, sacred grove or wood, idol or god, altar, place of judgment, royal residence,
    and enclosed or stone-built holy site. One Old Norse hörgr is described as stone-paved
    and reddened with cattle blood, and hörgr is contrasted with hof as a holy place
    among woods and rocks versus a built temple.
