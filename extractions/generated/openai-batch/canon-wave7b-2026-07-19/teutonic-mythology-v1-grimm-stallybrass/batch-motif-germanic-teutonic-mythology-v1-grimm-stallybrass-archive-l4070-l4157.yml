  summary: The passage collects early medieval hagiographic notices about pagan fana,
    temples, groves, altars, idols, and enclosures. Several episodes describe Christian
    or Christian-aligned figures burning or profaning pagan shrines, with local worshippers
    sometimes defending the sites or retaliating. It also includes a locality with
    fanatical temples and the beginning of a travel account of Columbanus and Gallus
    in Alemannia.
