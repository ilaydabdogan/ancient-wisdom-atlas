canonical_text:
  quote: ''
  summary: The passage surveys Thor/Thunar as giant-like in some tales, as demonized
    in Christian retellings, as identified with Jupiter by writers using Roman theogony,
    and as reflected in Hildesheim and Algermissen customs where logs or skittle effigies
    representing heathen gods or Jupiter are pelted and burned.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thor/Thunar is described as throwing stones with giants and as eating and
    drinking immoderately in the Eddic Thrymsqviða and a Norwegian folktale.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old giant Thrymr is associated by name with Donar in the passage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the hobergsgubbe tale, a poor man invites the old man of the mountain to
    stand godfather to his child; the old man refuses to come when he hears that Thor
    or Tordenveir is also invited, but sends a handsome present.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that some Christian-period tales attribute odious traits
    to Thor/Donar and make him a devil-like being.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:5
  text: Finnr is said to drag Thor's statue to King Olafr, split and burn it, mix
