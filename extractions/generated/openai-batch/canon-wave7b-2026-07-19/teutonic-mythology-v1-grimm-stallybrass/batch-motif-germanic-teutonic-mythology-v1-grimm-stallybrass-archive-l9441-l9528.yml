  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage rejects the claim that Thor ate his sons and states that the Edda
    instead says Móði and Magni outlived their father.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says that writers identified the German thunder-god with Jupiter
    after becoming acquainted with Roman theogony.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Letzner reports a Hildesheim custom in which a farmer brings two large logs
    and two smaller skittle-shaped logs; youths pelt the skittles down from the logs
    and others set them up again.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: The skittles in the Hildesheim custom are explained in the passage as devilish
    heathen gods thrown down by the Saxons when they became Christian.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: In the later Algermissen custom, a farmer brings an eight-cornered log hidden
    in a sack; schoolboys dress it in a cloak and crown, call it Jupiter, throw stones
