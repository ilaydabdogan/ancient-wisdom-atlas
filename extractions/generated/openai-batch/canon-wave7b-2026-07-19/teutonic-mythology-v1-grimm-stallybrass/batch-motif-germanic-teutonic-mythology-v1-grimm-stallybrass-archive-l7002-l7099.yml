  summary: The passage collects Middle High German poetic examples in which Wunsch/Wish
    is personified, then summarizes Wish as endowed with bodily features, creative
    powers, emotions, and social relationships. Grimm interprets these formulas as
    traces of a higher being, compares their function with formulas using God and
    with an Odin anger formula, and notes one passage where Wish acts under a superior
    god.
  language: English with Middle High German examples
  quote_policy: summarized
