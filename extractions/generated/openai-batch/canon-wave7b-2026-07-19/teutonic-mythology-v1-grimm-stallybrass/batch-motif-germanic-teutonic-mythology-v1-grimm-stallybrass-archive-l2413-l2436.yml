  quote: Animal sacrifices were mainly thank-offerings, but sometimes also expiatory...
  summary: The passage describes animal sacrifice as primarily thanksgiving and sometimes
    expiation, at times replacing earlier human sacrifice. It presents sacrificial
    animals as edible offerings to gods, describes the offering as a communal banquet
    in which a portion is placed before the god and the rest consumed by the assembly,
    notes royal tasting and portions for house-spirits and dwarfs, and cites a Langobard
    case involving captive Christians and sacrificial flesh.
  language: English with Latin citations
  quote_policy: quoted
