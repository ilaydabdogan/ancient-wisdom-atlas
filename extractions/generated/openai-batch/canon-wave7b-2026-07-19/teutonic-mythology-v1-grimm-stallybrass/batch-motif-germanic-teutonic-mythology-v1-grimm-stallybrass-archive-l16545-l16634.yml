- id: obs:1
  text: Gods are described as making journeys through the world, singly or in groups
    of two or three, to inspect humanity and punish observed crimes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Examples of divine earthly visits include Mercury and OSinn appearing on earth,
    Heimdall founding three orders, Thorr visiting weddings, OSinn, Hoenir, and Loki
    traveling together, and medieval Christian figures seeking lodging.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Solitary gods are said to appear suddenly, invoked or uninvoked, to bring
    help in need; the passage gives Greek, Christian, and Lithuanian examples.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When gods descend, they are not always visible; a person may hear the god's
    car without seeing the god, and a mist may obstruct human sight.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Athene is described as visible only to Achilles in one scene and as removing
    mist from Diomed's eyes so that he can distinguish gods from humans.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Biarco cannot see Othin riding a white steed and aiding the Swedes until he
    looks through the ring formed by the arm of a spirit-seeing woman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gods may conceal their divine nature by taking the form of a human acquaintance
    or an animal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Teutonic animal transformations are described as momentary and purpose-specific;
    Othin takes snake and eagle forms, and Loki takes fly form.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage links Zeus's swan and bull forms with Leda, Io, and Europa being
    conceived as swan-maidens or kine, and mentions the egg-birth of the Dioscuri.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Indian manifestations of deity are described as a god coming down and abiding
    in flesh for a season for the salvation of mankind; Vishnu's ten incarnations
    include earlier animal forms and later human forms.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says Greek and Teutonic mythologies avoid avatara-like duration
    and seriousness, while noting that incarnation is akin to belief in heroes bodily
    descended from gods.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The author claims resemblances between Teutonic and Greek mythology and rejects
    borrowing or choice in favor of unconscious affinity, while allowing divergences.
  category: speech
  evidence_refs:
  - ev:10
