comparison_claims:
- id: claim:1
  claim: The passage presents Teutonic and Greek mythologies as sharing patterns such
    as divine journeying, transformation, sudden appearance, recognition at parting,
    and use of horses or carriages, while rejecting borrowing and attributing the
    resemblance to unconscious affinity.
  claim_level: common_inheritance
  target: Teutonic and Greek mythology
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: This is the author's comparative claim in a secondary work; the excerpt
    does not independently prove historical common inheritance.
- id: claim:2
  claim: Greek, Teutonic, Christian, and Lithuanian examples are juxtaposed as functionally
    similar cases of divine or heavenly figures appearing among humans to visit, aid,
    inspect, or seek lodging.
  claim_level: same_function
  target: Greek epic, Teutonic examples, medieval Christian legends, and Lithuanian
    Perkunos traditions
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage lists parallels but does not argue direct contact or a
    single shared narrative source.
- id: claim:3
  claim: 'Greek and Teutonic transformations are contrasted with Indian avatara: the
    former are presented as momentary or sensuously conceived transformations, while
    the latter is enduring divine embodiment in flesh for salvation.'
  claim_level: same_function
  target: Greek and Teutonic transformation compared with Indian avatara
  evidence_refs:
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The claim uses the author's evaluative distinction; it should not be
    treated as a complete account of Indian, Greek, or Teutonic traditions.
- id: claim:4
  claim: Teutonic and Greek traditions are compared under the broad motif of divine
    animal form, though the passage explains Teutonic animal transformations as momentary
    and purpose-specific and Zeus's swan or bull forms by a different mythic rationale.
  claim_level: same_motif
  target: Divine animal transformation in Teutonic and Greek mythology
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The similarity is limited to animal-form transformation; the passage
    emphasizes different narrative explanations.
