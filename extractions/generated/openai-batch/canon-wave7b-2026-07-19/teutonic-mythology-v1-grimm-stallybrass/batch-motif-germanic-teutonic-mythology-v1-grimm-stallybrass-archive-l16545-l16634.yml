canonical_text:
  quote: ''
  summary: 'The passage surveys divine appearances on earth: gods journey through
    the world to inspect and punish humans, appear suddenly to help favored people,
    may remain invisible until human sight is altered, and may conceal themselves
    in human or animal forms. It contrasts momentary Greek and Teutonic transformations
    with Indian avatara/incarnation, and closes by claiming broad resemblances between
    Teutonic and Greek mythology without borrowing.'
  language: English
  quote_policy: summarized
