canonical_text:
  quote: ''
  summary: The passage compares Germanic demon names and mythic figures associated
    with closure, bars, and boundaries, including Loki, Grendel, hellriegel, trami,
    and Utgarthaloki/Ugarthilocus. It summarizes variants in Snorri and Saxo concerning
    a journey to a distant monster ruler, notes parallels involving hair or feathers
    plucked from demonic or draconic figures, and closes with Loki's binding, his
    eventual release, and wolf-like beings that pursue or devour the moon and sun.
  language: English
  quote_policy: summarized
