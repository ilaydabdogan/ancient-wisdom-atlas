canonical_text:
  quote: ''
  summary: The passage collects medieval accounts explaining Anglo-Saxon weekday names
    through native deities. It reports Hengist and Horsa as descended from Woden,
    presents Woden/Voden as equivalent to Mercury and as the source of Wednesday,
    presents Frea/Fream as the source of Friday and sometimes as Venus, and notes
    the antiquity claimed for these names in Anglo-Saxon legend.
  language: English with embedded Latin
  quote_policy: summarized
