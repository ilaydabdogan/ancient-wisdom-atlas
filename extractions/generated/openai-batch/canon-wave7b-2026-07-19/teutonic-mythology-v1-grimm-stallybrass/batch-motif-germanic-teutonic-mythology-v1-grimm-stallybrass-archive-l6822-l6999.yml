  summary: The passage gathers Middle High German examples in which personified Wunsch/Wish
    is invoked as a maker, evaluator, chooser, curser, teacher, cleanser, and perfecter
    of bodies, persons, beauty, manners, and works. Several examples say that a child,
    Enite, knights, women, a horse, or Helena-like beauty are wholly formed according
    to Wish, with nothing omitted or defective.
