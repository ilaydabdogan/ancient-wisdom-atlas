canonical_text:
  quote: ''
  summary: The passage describes little ships hanging in some Holstein village churches,
    especially among seafaring communities, decorated with ribbons and flowers in
    spring when navigation reopens. It compares this to a Roman custom connected with
    Isis. It also describes silver ships hung in churches as vows made by voyagers
    during storms for safe arrival, citing an example from the Vita Godehardi in which
    storm-threatened mariners invoke blessed Godehard and vow a silver ship if they
    escape. A further storm-vow example is cited from Buovo d'Antona.
  language: English with Latin and Italian quotations
