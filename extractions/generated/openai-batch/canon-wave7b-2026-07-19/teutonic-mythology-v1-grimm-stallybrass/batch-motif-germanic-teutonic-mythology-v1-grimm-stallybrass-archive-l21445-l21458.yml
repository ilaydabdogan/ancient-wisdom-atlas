  summary: The passage describes samodivy as beings associated with power over elements
    or storms, compares their newborn-gifting to the Fates, recounts three samodivy
    visiting the infant Jesus with handmade garments or bands, and summarizes a story
    resembling swan-maiden tales in which Stoyan takes the clothes of bathing samodivy,
    marries the youngest Mariyka, later returns her special garments, and she flies
    away, bathes in a fountain, and recovers virginity.
