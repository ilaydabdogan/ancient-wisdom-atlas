    god with a judging and punishing Christian God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A regional rhyme addresses Hermen, tells him to strike or play, and says the
    kaiser is coming with hammer and staves to hang Hermen.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author glosses the rhyme as a challenge for Hermen to sound war-music
    with catgut, pipe, and drum while a foe approaches with maces and staves.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that the rhyme may preserve fragments of a lay first heard
    when Charles destroyed the Irmensul, while rejecting a better fit with Arminius
    and the Romans.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author says the striking and staves in the rhyme suggest the ceremony
    of carrying out the Summer.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The village name Ermschwerd is traced through earlier forms and interpreted
