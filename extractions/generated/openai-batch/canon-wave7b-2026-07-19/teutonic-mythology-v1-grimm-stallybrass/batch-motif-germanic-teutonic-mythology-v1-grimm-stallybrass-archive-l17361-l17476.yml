    meanings including public way and Irman's way.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Watlingastræt is described as both a terrestrial road and a road translated
    to the sky, identified with the Milky Way and traveled by the car of an unnamed
    heathen god.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chaucer is quoted as saying that the galaxy or Milky Way is called Watling
    Street and was burned by heat when Phaeton tried to drive his father's cart.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Complaint of Scotland is cited as calling the Milky Way or circulus lacteus
