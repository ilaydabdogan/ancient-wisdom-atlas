  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Irmineswagen is reported as a name for the constellation arctus or plaustrum
    coeleste, placed beside Wotan's wagon, Donar's wagon, and Ing's wagon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ermingestrete is listed among four English highways, and the author reconstructs
