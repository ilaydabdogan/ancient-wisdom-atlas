canonical_text:
  quote: ''
  summary: The passage discusses the identity of Irmin or Hirmin in Saxon tradition,
    especially in relation to the Irminsul pillar. It reviews Widukind's report that
    a Saxon heathen god was interpreted through classical names and images such as
    Mars, Hermes, Hercules, and Apollo. Grimm evaluates whether Irmin should be connected
    with Mars/Ziu, Mercury/Hermes, or Wodan as a warrior, and then considers whether
    Irmin may have been an ancestral demigod or eponymous hero distinct from a purely
    divine being.
  language: English with Latin and Greek terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author frames Irmin's identity as either one of the great divinities Wodan,
    Thenar, or Tin, or as a being distinct from them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Widukind is reported as saying that a heathen god was worshipped whose name
    suggested Mars, whose pillar-statue suggested Hercules, and whose place suggested
    the sun or Apollo.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that the Saxons sacrificed to a god called Hirmin or Irmin
    after victory over the Thuringians.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The name Hirmin or Irmin is said to have remained in use in the tenth century
    as an epithet applied in praise or blame to very eminent or very desperate characters.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author identifies the relevant idol as the Irminsul and says the Saxons
    set up a pillar to Irmin on the banks of the Unstrut as they did in their own
    home territory.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage characterizes the association of Hirmin, Hermes, and Mars as confused
    and says Widukind confounded images of Ares and Hermes that another annalist kept
    distinct.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wodan is said to have sometimes been translated as Mars instead of Mercurius
    and to have been given the appearance of the Roman Mars.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Arguments on behalf of Mercury include the similarity of Irmansul or Hirmensul
    to Hermes and to a Greek term for prop, stake, pole, or pillar, the placement
    of Hermes images or heads on such pillars, and medieval references of Irmen-pillars
    to Mercury.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author concludes that the Saxons appear to have worshipped a Wodan imaged
    as a warrior in Hirmin.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage raises the question whether Irmin could be a second birth or son
    of the god, or whether an ancestral hero Irmino should be distinguished from the
    god Irmin.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author states a principle that races may name themselves after a famous
    ancestor, a deified man, or a demigod, but not after a purely divine being.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that nations descend from the god through the medium of
    a demigod and name themselves after that intermediary; it also identifies Lower
    Saxony, especially Westphalia, as a chief seat of Irmin-worship.
  category: relationship
  evidence_refs:
  - ev:7
