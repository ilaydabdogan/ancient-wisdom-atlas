canonical_text:
  quote: ''
  summary: The passage compares several personifications and divine names connected
    with fear, terror, war, and hostile action across Greek, Bohemian, Germanic, and
    Norse materials. It then notes a female Hilta comparable to Bellona, Enyo, and
    Eris, and describes Tyr as son of OSinn while also linked with giants through
    his unnamed all-golden mother.
  language: English
