canonical_text:
  quote: ''
  summary: 'The passage surveys heroic and royal signs: children described as unborn
    or extracted from the mother; armed or precociously active newborns; omens at
    births and deaths of kings and heroes; divine-seeming heroic force; fiery breath;
    and heroes suckled, fed, aided, represented, or transformed in relation to animals.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists figures called unborn, including Sigurðr, Sceaf, Uni, Ulfrun,
    Hoyer, Reinhart of Dalwig, Burchardus, and Gebehardus, and connects such birth
    with exceptional destiny.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Some cited infants are cut from a dead or dying mother and survive; Reinhart
    is said to be brought to maturity in slaughtered swine, and Burchardus is wrapped
    in fresh pig fat before baptism.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage compares the extraordinary birth type with Tritogeneia springing
    from Zeus’s forehead.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hloðr is described as born with helmet, sword, and horse, which the cited
    saga explains as equipment forged and born at the time of his birth.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Finnish rune is said to speak of a child born armed; this is connected with
    a superstition about lucky children born with hood and helmet.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Balder’s brother is described as avenging when scarcely born and one night
    old, unwashed and uncombed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
