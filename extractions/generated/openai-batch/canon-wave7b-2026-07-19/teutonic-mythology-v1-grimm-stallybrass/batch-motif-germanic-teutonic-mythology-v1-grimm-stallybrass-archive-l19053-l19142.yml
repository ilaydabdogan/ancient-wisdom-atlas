candidate_motifs:
- id: motif:1
  label: Unborn or extraordinarily extracted child with exceptional destiny
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: The passage groups unborn and extracted figures and explicitly says their
    extraordinary manner of coming into the world presages a higher and mysterious
    destiny.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage is a comparative scholarly discussion, not a single continuous
    myth narrative.
- id: motif:2
  label: Birth from a divine body part
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: Tritogeneia is described as springing from Zeus’s forehead and is compared
    with extraordinary birth.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: Only one Greek example is mentioned, and the passage frames it as 'not
    unlike' rather than identical.
- id: motif:3
  label: Child born armed or with heroic equipment
  taxonomy_refs:
  - miraculous_child
  basis: Hloðr is said to be born with helmet, sword, and horse; a Finnish rune child
    is born armed; lucky children are linked with hood and helmet at birth.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage explains the Hervararsaga instance as equipment forged and
    born at the time of birth, not necessarily physically emerging with the infant.
- id: motif:4
  label: Precocious newborn avenger
  taxonomy_refs:
  - miraculous_child
  basis: Balder’s brother avenges when barely born, and the children of liten Kerstin
    immediately perform adult acts and prepare for revenge.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: Examples are drawn from multiple cited traditions and versions.
- id: motif:5
  label: Royal or heroic birth marked by natural omens
  taxonomy_refs:
  - sacred_birth
  - royal_legitimacy
  basis: The passage states that the births of beloved kings and heroes are announced
    by joyful phenomena and gives examples of doubled fertility, eagles, and holy
    mountain waters.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The Hakon example concerns election year rather than birth.
