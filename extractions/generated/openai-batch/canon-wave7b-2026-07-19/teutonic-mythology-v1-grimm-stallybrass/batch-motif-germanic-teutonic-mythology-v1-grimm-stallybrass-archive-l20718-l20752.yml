  quote: ''
  summary: The passage discusses Hildr, Gunnr, and a third name printed as Tkruffr/Thru&r
    in relation to valkyr-like war figures across Teutonic languages. It notes that
    some names become common nouns for battle, that Hildr can be spoken of as being
    awakened, that valkyrs and Odin are associated with eagles and ravens on the battlefield,
    and that a legend of Hildr magically reviving fallen warriors is preserved in
    Eddic and Old High German material.
