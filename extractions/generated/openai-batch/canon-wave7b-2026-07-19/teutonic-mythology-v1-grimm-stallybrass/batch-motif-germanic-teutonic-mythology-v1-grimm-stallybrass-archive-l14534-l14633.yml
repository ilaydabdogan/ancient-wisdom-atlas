canonical_text:
  quote: ''
  summary: The passage presents a Latin battle tradition centered on a celebrated
    day of the goddess Ziza, in which Suevian forces destroy enemy and Roman troops
    and several place-names are explained from the deaths or flight of named figures.
    It then cites later Augsburg traditions about a temple, city name, and hill associated
    with the goddess Zise/Cisa, before noting chronological contradictions in the
    account.
  language: English with Latin and German excerpts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On a day described as especially celebrated among the barbarians for the goddess
    Ziza, the citizens display festivity rather than fear.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A large group from parts of Suevia suddenly emerges from nearby woods, breaks
    into the camp, and destroys Avar's army.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Avar, wearing royal dress, is captured alive and slaughtered like cattle;
    the passage connects the place-name Criechlicsavcron with the site of his death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The townspeople attack a praetor coming to aid allies; the local leaders Habino
    and Caccus fall in the fighting, and nearby places are said to preserve their
    names.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Suevi and townspeople combine forces, break into the camp, kill the resisting
    praetor, and destroy a Roman legion; a hill-name is explained from the lost legion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Verres crosses a stream, hides in nearby marshes, and is said to give his
    name to a lake.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage reports that Augsburg tradition identified this slaughter with
    a Roman defeat under Augustus involving Varus, while naming Verres in the preceding
    account.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A later rhymed Augsburg history says the Swabians built a large temple in
    honor of the goddess Zise, worshiped her according to heathen customs, named the
    city Zisaris after her, and associated a hill called Zisiberc with the former
    temple site.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Meisterlin is said to discuss Cisa/Cizais and to report variant claims that
    her worship was connected either with people from Asia or with the Vindelici following
    Swabian customs.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The author states that the fragment contains hopeless chronological contradictions
