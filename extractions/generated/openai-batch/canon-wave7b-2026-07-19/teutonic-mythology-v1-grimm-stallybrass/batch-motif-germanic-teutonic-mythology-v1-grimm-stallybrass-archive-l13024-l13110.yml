- id: obs:3
  text: Greek ship dedications are described for Isis and Athene; at the Panathenaea
    Athene's peplos was carried by ship to the Acropolis, suspended from the mast
    as a sail, and followed by an ordered procession.
  category: sequence
  evidence_refs:
  - ev:2
