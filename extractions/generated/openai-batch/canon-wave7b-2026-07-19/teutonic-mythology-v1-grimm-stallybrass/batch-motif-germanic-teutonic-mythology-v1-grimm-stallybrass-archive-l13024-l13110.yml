canonical_text:
  quote: ''
  summary: The passage compares a Suevic goddess honored with a carried ship to Greek
    ship rites for Isis and Athene, reports early modern accounts of Isis or Frau
    Eisen as a holy woman teaching metallurgy, agriculture, bread-making, and textile
    crafts in Germany, notes votive ships and ploughs as evidence for maternal-deity
    worship, and begins an etymological discussion of Holda/Holle as a benevolent
    Germanic goddess or spirit-name contrasted with malignant unhold beings.
  language: English
  quote_policy: summarized
