  summary: The passage surveys Germanic genealogies and name-equivalences linking
    Frea/Fro/Freyr with Woden/Odin, Finn/Burr, and Njörðr. It discusses the title
    folkvaldi as equivalent to frea/fro, considers conditional Greek comparisons for
    Njörðr, and in a note argues that Njörðr and Nerthus were brother and sister and
    joint parents of Freyr and Freyja.
  language: English
