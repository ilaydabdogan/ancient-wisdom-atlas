canonical_text:
  quote: ''
  summary: The passage discusses learned identifications of Saturn with Slavic and
    Germanic names such as Sitivrat, Kirt, Krodo, and Hruodo, including objects such
    as quicksilver, lead, a sieve, a wheel, and a fish. It compares Sitivrat with
    Hindu Satyavrata and Vishnu's fish-form deluge rescue, while cautioning that these
    coincidences are insecure. The passage then introduces goddesses as divine mothers
    who visit houses and teach domestic and agricultural arts, and begins a section
    on Earth as a female, fruit-bearing mother contrasted with father sky.
  language: English
  quote_policy: summarized
