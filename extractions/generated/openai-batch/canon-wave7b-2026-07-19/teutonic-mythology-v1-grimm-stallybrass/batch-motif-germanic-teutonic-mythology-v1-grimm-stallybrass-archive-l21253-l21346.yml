canonical_text:
  quote: ''
  summary: The passage surveys wood-wives, wild women, and menni or merminne figures
    in Germanic and neighboring materials. It describes forest encounters with supernatural
    women, a fated maiden in an oak, Rauhe Els/Sigeminne carrying off Wolfdieterich
    and shedding a hairy covering after bathing, glossarial names for wood-women,
    and medieval examples of sea- or mountain-dwelling wise women who foretell, advise,
    rule, or live with female retinues. It also notes a male prophetic sea-being,
    the marmennill, and compares several figures with sirens, fays, valkyrs, Melusina,
    and Proteus.
  language: English
  quote_policy: summarized
literal_observations:
