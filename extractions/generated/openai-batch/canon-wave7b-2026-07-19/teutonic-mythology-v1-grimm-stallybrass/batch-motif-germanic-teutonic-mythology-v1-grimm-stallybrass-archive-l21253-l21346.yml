- id: obs:9
  text: The terms menni, minni, merimanni, meriminni, merminne, merwip, merfrouwe,
    and wildez wip are presented as related or overlapping names for such beings,
    with merimanni glossing sirena or scylla.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In Wigamur, a wildez wip dwells in a hollow rock of the sea and is also called
    merwip, merfrouwe, and merminne.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The three wise women of the Nibelungen are called merwip; they foretell and
