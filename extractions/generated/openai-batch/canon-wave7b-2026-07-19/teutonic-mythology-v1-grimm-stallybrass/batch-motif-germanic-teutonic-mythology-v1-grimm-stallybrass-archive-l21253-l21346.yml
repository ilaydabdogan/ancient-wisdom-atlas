  text: A huntsman in the wood starts a dark-brown maid, addresses her as a wild beast,
    and his mother does not accept her as a bride.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Spanish ballad cited, a huntsman under a lofty oak sees an infantina
    on a high branch; her hair covers the oak, and she says seven fays fated her to
    spend seven years alone on the mountain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The knight in the Spanish ballad first seeks his mother's opinion, and the
    mother refuses consent.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wolfdieterich sits by a fire in the forest at night when Rauhe Els, a shaggy
    woman, comes and carries him to her country, where she is a queen and lives on
    a high rock.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After bathing in the jungbrunnen, Rauhe Els lays aside her hairy covering
    and is named Sigeminne, described as the fairest above all lands.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A note says twelve goddesses go to a mountain, fetch the hero, tend him, and
    the loveliest wants him for a husband.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage lists glossarial names for wild women or wood-wives, including
    holzminoja, holzfrowe, and holzruna, and associates them with lamia or ulula glosses.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A note says wild women, like Graces and fays, spin and weave.
  category: action
  evidence_refs:
