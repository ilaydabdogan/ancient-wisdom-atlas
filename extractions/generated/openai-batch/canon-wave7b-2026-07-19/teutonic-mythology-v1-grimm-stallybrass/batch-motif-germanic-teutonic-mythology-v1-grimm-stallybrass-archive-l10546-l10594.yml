canonical_text:
  quote: ''
  summary: 'The passage describes traditions and scholarly comparisons concerning
    Freyr/Fro: his statue is carried through the country in a wagon with a young priestess;
    people meet the car with offerings for a fruitful year; animals, consecrated horses,
    and human victims are associated with his worship; his boar Gullinbursti draws
    his car and shines at night; boar sacrifices, boar-shaped Yule cakes, gold-hog
    customs, and possible related memories outside Scandinavia are discussed. Footnotes
    compare generative-principle or phallic worship and boar offerings in other traditions.'
  language: English
  quote_policy: summarized
