canonical_text:
  quote: ''
  summary: The passage discusses Holda or Holle in an ecclesiastical Latin notice
    and in German popular legend. It describes night-riding with a demonic or witch-like
    company, Holda as a helpful superior female being concerned with household order,
    her snow-making bed and feathers, her association with lakes, fountains, wells,
    wagons, midwinter processions, fertility, wind-riding, and the wild host.
  language: English with a Latin excerpt
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ecclesiastical notice says certain women claim they must ride on certain
    nights on beasts with a troop of demons transformed into the likeness of women,
    called Holda or unholda in the vernacular.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In popular legends and nursery tales, Frau Holda appears as a superior being
    who is kind and helpful to people and becomes cross when she notices disorder
    in household affairs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says traditions about Frau Holda are especially extensive among
    Hessians and Thuringians, and gives additional regions where the name is or is
    not known.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: When it snows, Holda is said to be making her bed so that its feathers fly;
    the passage also says she stirs up snow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Holda must be able to move through the air.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Holda is said to haunt lakes and fountains; at noon she may be seen as a fair
    white lady bathing in the flood and disappearing.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Mortals reach Holda's dwelling by passing through a well.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Holda drives about in a wagon; a peasant puts a linchpin in it, and when he
    picks up the chips they are gold.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Holda's annual progress is placed between Christmas and Twelfth-day and is
    said to bring fertility to the land.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Holda can ride on the winds, clothed in terror, and belongs to the wütende
    heer; the passage says this led to the idea that witches ride in her company.
  category: relationship
  evidence_refs:
  - ev:8
