canonical_text:
  quote: ''
  summary: The passage describes Hel/Hell as a dark underworld goddess or personification
    whose dwelling is deep beneath the earth under Yggdrasill in Niflheim/Nifihel.
    It summarizes who goes to Hel, her hungry and withholding character, lower-world
    journeys in Eddic material, Danish traditions of Hel as a plague-harbinger horse
    and wagon-rider, an Anglo-Saxon Beowulf usage where Hel receives Grendel, and
    medieval German images of Hell as hungry and open-mouthed. Footnotes and remarks
    compare Hel’s blackness and function with several classical and later dark female
    underworld or earth-associated figures.
  language: English
  quote_policy: summarized
