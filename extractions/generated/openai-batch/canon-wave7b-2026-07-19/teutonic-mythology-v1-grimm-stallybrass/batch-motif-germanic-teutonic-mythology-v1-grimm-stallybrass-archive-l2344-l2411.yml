canonical_text:
  quote: ''
  summary: 'The passage gathers Greek, Latin, legal, missionary, saga, and folk-tradition
    notices about human sacrifice among or near Germanic peoples: daily sacrifice
    by Rhadagaysus, war-captive and human sacrifices among Thulites, Heruli, Franks,
    Saxons, and Frisians, the sale of slaves for sacrifice, first-captive or first-crossing
    offerings for luck, child immurement motifs in folk-tales, and royal or royal-child
    sacrifices in extraordinary crises.'
  language: English with embedded Latin and Greek citations
  quote_policy: summarized
