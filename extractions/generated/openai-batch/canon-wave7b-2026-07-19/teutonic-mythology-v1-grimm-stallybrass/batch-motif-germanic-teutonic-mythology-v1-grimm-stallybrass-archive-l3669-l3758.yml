  quote: ''
  summary: The passage surveys evidence for sacred trees, oaks, groves, and holy woods
    in Germanic and Frankish regions, including Christian oratories and churches built
    after tree or shrine destruction, missionary commands to fell dedicated trees,
    the cutting of sacrificial woods, folk dances and processions around holy oaks,
    place-names for holy forests, and an account of a wounded Saxon brought to a sacred
    wood.
  language: English with Latin quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Christian oratory was built from the material of a previously mentioned
    tree and dedicated to St. Peter; the passage identifies the oak and the church
    built from it with the site of St. Peter's church at Fritzlar.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Vita S. Amandi, inhabitants of Gandavum are described as abandoning
    God, worshipping trees and wood as deity, and adoring shrines or idols; where
    such shrines were destroyed, monasteries or churches were built.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Rossonto near the Aronna river, a woman attributes her blindness to auguries
    and idol worship, identifies the idol as a tree dedicated to a demon, and is told
    to take an axe and cut down the tree.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among Saxons and Frisians, veneration of groves is said to have lasted longer;
    bishop Unwan of Bremen cut down woods in which inhabitants sacrificed while professing
    a false Christianity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'In Lower Saxony and Westphalia, the passage reports vestiges of holy oaks:
    young people in Minden danced a circular dance around an old oak on Easter Sunday,
    and inhabitants of Wormeln and Calenberg made an annual solemn procession to a
    holy oak.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage argues that German place-names meaning Holy Wood likely go back
    to heathen sacred groves rather than to churches in woods or medieval royal ban-forests;
    it also states that such forests could include sanctuaries for criminals.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: An account of a battle says a badly wounded Saxon, Luibertus, was secretly
    carried at night by a woman from his castle into the sacred wood Sytheri; she
    washed his wounds there, fled after being frightened by a shout, and he died there.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Documents are cited for forests with names such as Dat hillige holt, Heiligen-loh,
    and heiligenforst.
  category: setting
  evidence_refs:
  - ev:8
