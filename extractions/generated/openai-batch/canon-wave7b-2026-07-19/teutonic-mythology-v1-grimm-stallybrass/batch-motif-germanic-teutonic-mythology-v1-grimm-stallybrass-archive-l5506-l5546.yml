canonical_text:
  quote: ''
  summary: A scholarly passage assesses missionary biographies and comparative evidence
    for Germanic heathen temple and image worship, including Redbod-era restoration
    of idol cult, Willehad and Goar reports about stones, simulacra, and idolatrous
    audiences, an inference about Frisian and Scandinavian shared practices, the crafting
    of wood or stone figures, and the disappearance of Teutonic and Northern god-images.
  language: English with quoted Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Vita Bonifacii is cited as saying that, during the heathen reaction under
    King Redbod, Christian churches were devastated and the cult of idols was renewed
    with temple buildings or fanes erected.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Vita Willehadi is cited as saying that it is insane and vain to seek help
    from stones or to hope for aid from mute and deaf images.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Vita Willehadi citation, a fierce group devoted to idolatry reacts
    angrily and says the speaker should not live longer because he had spoken sacrilegiously
    against their gods.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that the Willehadi event belongs to the middle of the eighth
    century and that Anskar narrates it about a century later, while cautioning against
    dismissing his wording as mere ornament.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Vita S. Goari is cited as saying that Goar preached salvation to gentiles
    in Ripuarian territory who were devoted to the cult of simulacra and deceived
    by idol superstition.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author describes the Frisians as a transition point to the Scandinavians
    and infers, from close intercourse between the peoples, that the Frisians also
    shared temple and image worship; he adds that he can hardly imagine Fosete's Heligoland
    temple without images.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author says some facility in carving wooden figures or chiselling stone
    figures is expected from Tacitus's signa and effigies, and that stone weapons
    and implements from barrows show skill in working difficult materials.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author states that no image of a Teutonic god has survived the destructive
    effects of time and Christian zeal, and adds that Northern, Lethrian, and Upsalian
    idols are also entirely gone.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage gives a Norse technical term for such images and connects it with
    a verb meaning to cut or carve, though the excerpt's typography is unclear.
  category: other
  evidence_refs:
  - ev:8
