comparison_claims:
- id: claim:1
  claim: The passage treats the three sons of Kronos and the Norse Har-Iafnhar-Thridi
    as comparable ranked triads, while cautioning that the Wuotan-Donar-Ziu grouping
    is not the same structure.
  claim_level: same_function
  target: Greek sons of Kronos compared with Norse divine triads
  evidence_refs:
  - ev:2
  counter_evidence_refs:
  - ev:2
  confidence: medium
  limitations: The passage explicitly limits the comparison by distinguishing Wuotan,
    Donar, and Ziu from the brother-triad model.
- id: claim:2
  claim: The passage compares pagan divine offices with medieval Christian guardian-saint
    functions, saying protections, healings, and dedicated animals were carried over
    to saints.
  claim_level: historical_contact
  target: Christian guardian saints as continuations or receivers of pagan divine
    offices
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is made as a broad antiquarian synthesis; the excerpt does
    not provide individual saint case studies.
- id: claim:3
  claim: The passage presents Greek and Teutonic divine mountains and elevated residences
    as parallel settings for gods.
  claim_level: same_motif
  target: Greek Olympus, Ida, and Samos heights compared with Teutonic Sigtýsberg,
    Himinbjörg, Hlidskialf, Valholl, and Bilskirnir
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison concerns sacred residence and elevation, not necessarily
    identical cult practice.
- id: claim:4
  claim: The passage directly compares Zeus looking down from Ida with Odin looking
    from Hlidskialf as analogous divine surveillance from a height.
  claim_level: same_function
  target: Zeus on Ida and Odin on Hlidskialf
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage only states the functional similarity of observation; it
    does not claim shared origin.
- id: claim:5
  claim: The passage compares divine appearance or descent to humans with the Hindu
    concept named avatara, glossed as descensus.
  claim_level: same_function
  target: Hindu avatara as a named form of divine descent
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supplies only a terminological comparison and does not
    detail a Hindu narrative example.
- id: claim:6
  claim: The passage treats seasonal car-processions of deities as a recurring pattern
    associated with festivals and effects such as fertility, peace, war, or mischief.
  claim_level: same_motif
  target: seasonal deity processions as a motif family within the discussed pagan
