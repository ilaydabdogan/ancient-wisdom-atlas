canonical_text:
  quote: All the divinities, Greek and Norse, have offices and function assigned them.
  summary: 'The passage surveys grades, offices, residences, and relations of gods:
    divine attendants and messengers; ranks and triads; assigned functions; transfer
    of functions to saints; sacred mountain residences and vast halls; reciprocal
    relations between gods and humans; divine descent; and seasonal car-processions.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Named divine figures perform services such as cupbearing, handmaid service,
    shoemaking, serving, and errand-bearing; the passage states that these services
    do not diminish their divine nature.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage says the three sons of Kronos divide the world: Zeus receives
    the sky, Poseidon the sea, Hades hell, while the earth is shared.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage identifies ranked divine groupings: the sons of Kronos, Har-Iafnhar-Thridi,
    Wuotan-Donar-Ziu, a circle of twelve, and a distinction between old and new gods.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Greek and Norse divinities are described as having assigned offices and functions
    that define their dominion and affect their representation.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says remnants of Greek or Teutonic paganism in the Middle Ages
    connected with Christian saints, to whom protections of classes and healing of
    diseases were carried over.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Each god is said to have a pointed-out favorite residence; mountains are described
    as consecrated to Teutonic and Greek deities.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: Zeus is described as sitting apart on Olympus, having another seat on Ida,
    and looking down on human affairs; Odin is compared as doing so from Hlidskialf;
    Poseidon sits on a height in Samos.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Valholl and Bilskirnir are described as enormous dwellings; Valholl has 540
    doors and Bilskirnir has 540 floors.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Humans pray and offer to the gods, while the gods take interest in human destinies,
    watch the earth, communicate by signs and messengers, and sometimes come down
    and appear to humans.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that gods commune with each other in heavenly abodes where
