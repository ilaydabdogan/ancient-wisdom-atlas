candidate_motifs:
- id: motif:1
  label: divine attendants and messengers
  taxonomy_refs: []
  basis: The passage lists divine cupbearers, handmaids, servants, a shoemaker, and
    messengers serving other gods without loss of divinity.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage is descriptive and comparative rather than a single narrative
    episode.
- id: motif:2
  label: divine assembly for counsel and judgment
  taxonomy_refs:
  - divine_judgment
  basis: The passage opens with divine attendance at a thing, on the rokstola, and
    by Yggdrasil for counsel and judgment.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage begins mid-sentence, so the exact attending figures are not
    identifiable within the supplied excerpt.
- id: motif:3
  label: ranked divine triads and closed divine circle
  taxonomy_refs: []
  basis: The passage compares and distinguishes triads of gods and notes a close circle
    of twelve from which some gods are excluded.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage itself warns that not all triads are equivalent.
- id: motif:4
  label: cosmic-domain division among gods
  taxonomy_refs: []
  basis: The sky, sea, hell, and earth are distributed among the three sons of Kronos,
    establishing differentiated cosmic dominion.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No available taxonomy reference directly matches tripartite world allotment.
- id: motif:5
  label: succession of old and new gods
  taxonomy_refs: []
  basis: The passage says Odin and the Aesir, and Zeus with his colleagues, appear
    as upstarts who supplanted older nature gods.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives this as a broad comparative statement without narrating
    the succession.
- id: motif:6
  label: assigned divine offices and saintly continuations
  taxonomy_refs: []
  basis: Divine offices define gods' dominion, and the passage says protections, healings,
    and dedicated animals were carried over to Christian saints.
