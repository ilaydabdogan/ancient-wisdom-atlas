canonical_text:
  quote: ''
  summary: The passage compares medieval, classical, Baltic, Esthonian, Finnish, and
    Norse-Germanic traditions of praying for rain and agricultural fertility. It discusses
    Mary and saints in Christian rain processions, Jove/Zeus in Roman and Athenian
    prayers, Perkunas/Percune and Esthonian Thunder in Baltic-Finnic prayers, and
    Thor/Thunar as a weather and fertility deity associated with thunder, lightning,
    rain, fruits, agriculture, and battles with giants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A medieval procession for rain is described: priests and people marched barefoot
    and in woollen garments three times, but the rain did not come until Mary was
    included and a new procession sang a solemn salve regina, after which heavy rain
    scattered the participants.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Lithuanian holy goddess is a rain-goddess and
    adds that heathen petition for rain was probably addressed to the thunder-god
    rather than to Elias and Mary.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author says he cannot recall an Old Norse legend in which Thor bestows
    requested rain, and notes only that Thor sends stormy weather when angry.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Roman rain procession from Petronius is described as involving barefoot
    participants with loose hair and pure minds going to a hill and asking Jove for
    water, after which rain fell in bucketfuls.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: An Athenian prayer asks dear Zeus to rain upon the Athenians' fields and plains.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Lithuanian prayer addresses Percune, asks him not to strike the petitioner
    or the field, and promises a meat offering.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: An Old Prussian formula addresses Dievas Ferkunos and asks him to spare the
    speakers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: An Esthonian prayer addresses Dear or Holy Thunder, offers an ox, asks for
    help with ploughing and sowing, requests copper-red straw and golden-yellow grain,
    asks that thick black clouds be pushed elsewhere, and asks for a fruitful season,
    sweet rain, and protection of the seedfield.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage lists Esthonian and Finnic thunder names, including Picker or
    Picken, Pitkne, pitkainen, Ukko, and Esthonian Turris, with Turris said to come
    from Norse Thor.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Adam of Bremen is quoted or summarized as saying that Thor presides in the
    air and governs thunder, lightning, winds, rains, fair weather, and fruits.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says Thor's victories and battles with giants have overshadowed
    his peaceful office, but also says Thor, as Wuotan's son and Earth’s son, has
    a direct relation to agriculture.
  category: relationship
  evidence_refs:
  - ev:7
