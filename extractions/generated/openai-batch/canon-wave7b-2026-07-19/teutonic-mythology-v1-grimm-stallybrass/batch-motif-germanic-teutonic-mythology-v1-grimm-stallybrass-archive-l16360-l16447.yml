canonical_text:
  quote: ''
  summary: The passage discusses Teutonic and Greek ideas about special names or languages
    assigned to gods and humans. Grimm argues that Greek and Teutonic popular belief
    agrees in tracing obscure or archaic words to divine speech, while the Alvismal
    extends special vocabularies to other beings. The passage also compares divine
    language with divine writing or runes and notes that gods share many customs with
    humans.
  language: English
