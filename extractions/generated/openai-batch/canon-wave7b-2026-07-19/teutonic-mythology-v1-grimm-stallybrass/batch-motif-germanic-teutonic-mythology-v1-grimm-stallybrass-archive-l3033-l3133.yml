canonical_text:
  quote: ''
  summary: The passage describes banquet customs in which food and drink are set aside
    for household or divine beings, then explains minne-drinking as a ritual of remembrance
    for absent or deceased persons and for gods. It gives examples of goblets, horns,
    ale, and funeral toast cups used in such rites, and notes that the practice continued
    after conversion with Christian figures named as honorees.
  language: English
  quote_policy: summarized
