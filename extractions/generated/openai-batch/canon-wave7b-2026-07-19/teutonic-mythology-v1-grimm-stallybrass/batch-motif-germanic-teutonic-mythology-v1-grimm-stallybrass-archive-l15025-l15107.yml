canonical_text:
  quote: ''
  summary: 'The passage discusses Germanic goddess names and functions, chiefly Freyja/Frowa:
    her forsaken husband and world-wide search, golden tears, martial association
    with the slain, after-death lodging and feasting with her, sacred cats and related
    animal lore, and cautious comparisons with classical, Christian, Germanic, and
    Norse figures including Frigg/Frea.'
  language: English with cited Latin, Old Norse, German, and classical names
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fru Freke is reported among Saxon common people with duties like those attributed
    to Holda; regional forms Fruike, Fru Harke, and Fru Gode are also listed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Freyja is described as having a husband or man named Odr who forsook her;
    she searched for him through the world and among strange peoples while shedding
    tears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage identifies Saxo's Syritha as likewise going in search of Othar.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Freyja's tears are described as golden, with gold named after them; nursery
    tales are said to contain pearls and flowers wept or laughed out, and Dame Holla
    gives the gift of such tears.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Freyja is described as riding to the battlefield in a wagon drawn by two cats.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Freyja is said to share the slain with Odinn and is called owner or mistress
    of the battle-fallen or chosen.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Freyja's dwelling is named Folkvangr or Fullvangar, and her hall Sessrymnir;
    dying women are said to expect to be in her company after death.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: Thorgerdr in Egils saga refuses earthly nourishment because she expects soon
    to feast with Freyja.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Love-songs please Freyja, lovers are advised to call upon her, the cat is
    said to be sacred to her, and a wedding-weather saying refers to feeding the cat
    well.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Westphalian weasel-name froie is connected by the author with titles such
    as lady or little lady; Galinthias is cited as being turned into a weasel or cat.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage explicitly offers conditional comparisons between Frigg, Freyja,
    Freyr, Mary, and several classical figures.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage cites Paul Diaconus as evidence that the Langobards named Wodan's
    wife Frea, while the Edda calls her Frigg, and presents this as evidence for harmony
    between German and Norse mythologies.
  category: relationship
  evidence_refs:
  - ev:10
