canonical_text:
  quote: ''
  summary: 'The passage surveys sacrificial victims and ritual qualifiers in Germanic
    and comparative examples. It discusses cocks and edible game as offerings, the
    special exclusion or inclusion of certain animals, and the killing of dependents
    or animals with a dead master. It then summarizes Adam of Bremen''s account of
    the Uppsala sacrifice: a nine-year communal rite in which gifts were sent, nine
    heads from every male living creature were offered, blood placated the gods, and
    bodies of humans and dogs were suspended in a sacred grove. Grimm compares details
    with Danish Hlethra, Franks, Langobards, Reinhardus, law traditions, Eddic universal
    participation, and examples of sex- and color-marked sacrificial animals.'
  language: English with embedded Latin and Greek
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Cocks are given as sacrificial examples: Greeks offered cocks to Asklepios,
    and in Touraine a white cock was sacrificed to St. Christopher for healing a bad
    finger.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that edible game such as stags, roes, and wild boars were
    fit for sacrifice, while bears, wolves, and foxes were not used in the same way
    because they were regarded as possessing a ghostly being and receiving a kind
    of worship.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: For expiation, the passage suggests that uneatable beasts and men might be
    offered, and notes that slaves, hounds, and falcons could follow the burnt body
    of their master.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Adam of Bremen's Uppsala account is summarized as a solemnity held every nine
    years for the Swedish provinces, with kings and peoples sending gifts and Christian
    converts redeeming themselves from participation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Uppsala account, nine heads from every male living creature are offered,
    and the blood of the victims is used to placate the gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Uppsala victims' bodies are suspended in a grove near the temple; the
    grove is called sacred, its trees are said to be considered divine through the
    death or decay of victims, and dogs hang there with humans.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The author notes that the number nine is prominent in the Swedish sacrificial
    feast as in a Danish one, and that victim heads appear to be essential in comparison
    with Franks and Langobards.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says that sacrificing only the male sex of every living creature
    agrees with an episode in Reinhardus, where males of all quadrupeds and birds
    were to be slaughtered at a king's wedding, while the cock and gander escaped.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The author says that actually killing one of every species would be inconceivable
    and treats it as popular tradition, comparing it with law traditions about beheading
    all creatures present at rapine and with Eddic accounts of all animals and plants
    giving oaths or all beings weeping.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that creatures belonging to a man, including domestic animals,
    may suffer with him in cremation, sacrifice, or punishment.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage states that the color of sacrificial animals mattered, with white
