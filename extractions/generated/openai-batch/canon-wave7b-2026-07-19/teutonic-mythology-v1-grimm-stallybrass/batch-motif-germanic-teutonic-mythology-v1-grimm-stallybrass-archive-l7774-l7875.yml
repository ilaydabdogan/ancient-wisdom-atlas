- id: obs:4
  text: The passage links the line about seeing from heaven with an old belief in
    Wuotan's chair.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the lake of Steinhude, village lads are reported to go every autumn after
    harvest to a hill called Heidenhügel, light a fire, wave their hats, and cry Wauden.
  category: action
  evidence_refs:
  - ev:5
