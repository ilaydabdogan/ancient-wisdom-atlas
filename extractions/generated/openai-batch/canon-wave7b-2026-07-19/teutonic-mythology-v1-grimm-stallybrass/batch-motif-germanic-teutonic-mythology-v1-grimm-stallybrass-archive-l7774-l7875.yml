canonical_text:
  quote: ''
  summary: The passage discusses remnants of Wodan/Wuotan worship in harvest customs
    and place names. It describes verses addressed to Wold/Wod, a belief that omitting
    the rite would bring poor hay and corn crops, probable libations and corn left
    standing for the god, an autumn hilltop fire custom at Steinhude with cries of
    Wauden, and a broader interpretation of offerings to gods or other beings for
    crop protection. It also surveys place names compounded with Wodan/Odin as evidence
    for former sacred sites and regional persistence of worship.
  language: English
  quote_policy: summarized
