canonical_text:
  quote: ''
  summary: The passage compares Wodan/Odin with Indra as an air or battle-associated
    god and as a receiver of slain warriors. It surveys formulas for death as going
    to God, Odin, Valholl, or Zalmoxis, notes Christian inversion of Odin into a feared
    or cursed figure, and describes Odin’s appearance as one-eyed, broad-hatted, cloaked,
    sometimes spear-bearing, and connected with an eye pawned for a drink from Mimi’s
    fountain. It also recounts a saga image of a blind old god carrying Hading through
    the air in a cloak while a horse steps over sea-waves.
  language: English
  quote_policy: summarized
