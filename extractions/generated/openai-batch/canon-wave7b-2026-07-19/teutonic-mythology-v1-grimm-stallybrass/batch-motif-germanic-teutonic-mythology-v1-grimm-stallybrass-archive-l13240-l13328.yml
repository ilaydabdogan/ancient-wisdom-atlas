canonical_text:
  quote: ''
  summary: The passage describes Hulda/Holda/Holle as connected with a witches' ride
    or furious host, as a frightening old woman with a winter train, and as a spinning-wife
    who oversees flax, household order, seasonal work restrictions, rewards, and punishments.
    It also reports the assignment of unbaptized infants' souls to older deities and
    compares Holda's functions with motherly and spinning-associated figures such
    as Nerthus, Isis, Frigg, Mary, and several Greek goddesses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In Upper Hesse and the Westerwald, riding with Holle is described as equivalent
    to a witches' ride and is linked with the 'furious host'.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A popular belief says that the souls of infants dying unbaptized were adopted
    into the furious host and fell to Wuotan or Hulda.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hulda is described as assuming the appearance of an ugly old woman with a
    long nose, big teeth, and bristling, matted hair.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Children are frightened with Holle or her hideous train, and a muffled servitor
    is said to go about in Holle's train at the winter solstice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Holla is presented as a spinning-wife, and the cultivation of flax is assigned
    to her.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Holla rewards industrious maids with spindles and filled reels, while a slothful
    spinner's distaff may be set on fire or soiled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The girl whose spindle dropped into Holla's fountain is said to have been
    bountifully rewarded.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Christmas Holla enters the land; by Carnival she turns homeward, and spinning
    must be finished with the distaffs kept out of her sight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: If Holla finds household arrangements as they should be, she pronounces a
    blessing; otherwise she pronounces a curse.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'The passage describes winter-season work restrictions: no flax should be
    left during the twelve nights, no farm-work is done on Hulla''s Saturday in the
    Rhön mountains, and in the North no wheel or windlass should turn from Yule-day
    to New-year''s day.'
  category: sequence
  evidence_refs:
  - ev:5
