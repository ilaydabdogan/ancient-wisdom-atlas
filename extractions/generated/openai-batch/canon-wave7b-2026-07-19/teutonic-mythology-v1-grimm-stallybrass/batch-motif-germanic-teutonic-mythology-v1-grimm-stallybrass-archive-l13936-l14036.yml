canonical_text:
  quote: ''
  summary: The passage explains medieval traditions in which Herodias, associated
    with the beheading of John the Baptist, is imagined as condemned to roam with
    evil spirits and as a leader or companion of nocturnal female rides, alongside
    figures such as Diana, Holda, Perahta, and Bensozia. It cites clerical sources
    describing women who claim to ride at night on beasts, obey a nocturnal mistress,
    attend night gatherings, and serve Herodias, who is sometimes treated as a queen
    or goddess with a third part of the world or humanity allotted to her. A Latin
    poetic account adds that Herodias receives John’s severed head, tries to kiss
    it, is repelled by it, and is driven through the air, while later sitting among
    oaks and hazels from midnight until cockcrow under the name Pharaildis.
  language: English with Latin quotations
  quote_policy: summarized
