  text: The Reinhardus passage recounts Herodias or Pharaildis as desiring John the
    Baptist, after which Herod has John beheaded and the head is brought to her on
    a dish.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Reinhardus account, Herodias embraces the severed head and tries to
    kiss it, but the head flees or blows back, and she is carried through an opening
    by a blast of wind.
  category: action
  evidence_refs:
  - ev:6
