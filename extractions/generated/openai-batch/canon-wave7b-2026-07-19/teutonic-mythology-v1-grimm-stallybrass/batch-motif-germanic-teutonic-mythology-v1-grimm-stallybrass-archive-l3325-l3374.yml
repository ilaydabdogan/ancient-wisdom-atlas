canonical_text:
  quote: ''
  summary: The passage briefly notes processional practices, including Wends walking
    around budding corn with loud cries, then begins a chapter on temples and sacred
    dwelling-places. It discusses Gothic alhs as a term for temple, compares it with
    Tacitus's report of a Naharvali sacred grove, and describes a priest in female
    attire and a pair of brother-youth deities interpreted by Romans as Castor and
    Pollux, worshipped without statues. Grimm suggests Alcis/alx may denote the divine
    abode, sacred wood, or notable tree, while a translator's note questions this
    interpretation.
  language: English
  quote_policy: summarized
