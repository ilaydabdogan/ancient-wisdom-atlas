canonical_text:
  quote: ''
  summary: The passage discusses possible Germanic eponymic heroes and name traditions,
    especially a hypothetical Suevic hero Suapo/Suevo connected with a mountain. It
    then treats Vandilii/Vindili name relations and Wuotan as wanderer/wender. The
    passage cautions against overbuilding on tribal names, then turns to Tacitus's
    notices of a Germanic 'Hercules' honored in battle song, sacrifice, columns, sacred
    woods, and possible relation to Irmin/Hirmin and Roman Hercules.
  language: English with Latin and Germanic citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author asks whether the Suevi/OHG Suapa should be assumed to have an eponymous
    hero named Suevo or Suapo and perhaps an old mountain legend.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pliny and Solinus are cited for a large Scvo/Scvo mountain placed at or near
    the beginning of Germania in connection with the Ingaevones and the Sinus Codanus.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Isidore and the Lay of Anno are cited as deriving the Suevi/Swabians from
    a mountain named Suero or Sucho/Suedo, with Swabian immigrants pitching tents
    by that mountain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage notes a Low German psalm rendering of 'mons coagulatus' as 'berg
    sueuot' and mentions Sefa fioll in Helga-songs together with names such as Svafalund,
    Svafnir, and Scava.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author says Vandilii and Vindili stand in a relation comparable to other
    name pairs and connects both forms with winding and wending; Wuotan is described
    under several names as wender and wanderer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The author warns that the national names Marsi, Gambrivii, Suevi, and Vandilii
    form only a slight foundation; Tacitus connects them with Mannus but does not
    name the heroes or provide details.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tacitus is cited as saying that a Hercules was remembered among the Germans
    and sung first among brave men by those going into battle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tacitus is cited as saying that Hercules and Mars were placated with permitted
    animals, with Hercules placed before Mars in the author's discussion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tacitus is cited for a tradition of Hercules' columns by the Frisian ocean,
    and for Drusus being prevented by the ocean from inquiry into it and Hercules.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Annals are cited for a sacred wood of Hercules between the Weser and Elbe,
    and the Peutinger Table is cited for a camp of Hercules near Noviomagus.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The author interprets these notices as pointing to a demigod identified with
    Roman Hercules and lists battle-song, victims, and a consecrated wood among the
    signs of his cult.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The author connects Widukind's phrase about Hirmin's column-effigies with
    questions about plural Irminsul and whether the image had several pillars.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: The author proposes, in question form, a possible sound approximation between
    the German Irman/Irmin or Hermin names and Herakles/Hercules.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The author says that if this 'Hercules' is to be taken as one of the great
    gods, Mercury and Mars, identified by the author with Wuotan and Zio, should apparently
    be excluded; Donar/Jupiter is mentioned only as a supposition.
  category: relationship
  evidence_refs:
  - ev:11
