canonical_text:
  quote: ''
  summary: The passage discusses Wish/Wunsch as a personified or divine creative faculty
    associated with Woden/Odin. It compares Wish with Greek Charites/Gratiae, with
    Phol's meadow and well, and with other divine meads, holy wells, and crowns. It
    describes Wish or Woden as rejoicing in creatures as children and surveys Norse
    Osk-/Oski terms such as wish-maidens, a wish-stone, a fair wind, and a wish-bear
    sea-monster, while noting uncertainties about historical belief and linguistic
    evidence.
  language: English
