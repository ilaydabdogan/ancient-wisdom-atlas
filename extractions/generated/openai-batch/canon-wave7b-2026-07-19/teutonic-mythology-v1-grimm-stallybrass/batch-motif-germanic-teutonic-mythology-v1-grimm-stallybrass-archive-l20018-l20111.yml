  summary: The passage discusses travelling volur, spakonur, and norns as wise women
    who foretell fate, focusing on the Nornagest story in which two women bless a
    child, a third angry norn limits his life to a burning taper, and an elder volva
    preserves the taper. It then compares this pattern with medieval tales of travelling
    gifting sorceresses, Eddic descriptions of good and bad norns, and linguistic
    or functional parallels involving fate, parcae, Moirai, and Romance fays.
  language: English
  quote_policy: summarized
