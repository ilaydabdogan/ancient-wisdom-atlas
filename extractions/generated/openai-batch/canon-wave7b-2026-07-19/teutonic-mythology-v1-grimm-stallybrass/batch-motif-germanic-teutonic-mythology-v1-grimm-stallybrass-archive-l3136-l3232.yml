    these practices with Germanic and Norse ale/minne offerings to Wuotan/Odin and
    Thor; and notes Christian cup-blessing and later regional survivals.
  language: English with embedded Middle High German, Latin, Old Norse, Scandinavian,
    Slavic, and Finnish terms.
