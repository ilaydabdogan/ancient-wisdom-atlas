  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: One quoted Eddic strophe assigns different names for a cloud to humans, gods,
    Vanir, giants, elves, and beings in Hel.
  category: speech
  evidence_refs:
  - ev:6
