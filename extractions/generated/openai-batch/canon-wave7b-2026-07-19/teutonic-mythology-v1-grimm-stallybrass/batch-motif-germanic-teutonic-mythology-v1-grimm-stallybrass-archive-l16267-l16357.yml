literal_observations:
- id: obs:1
  text: Sleep is described in the Iliad as sitting in the shape of a song-bird on
    a fir-tree on Mount Ida and overpowering the highest of the gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Greek gods are said to go to bed at night and benefit from sleep like humans.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Norse gods are also said to sleep at night; Thor seeks night-lodging on journeys,
    while Heimdall is singled out as needing less sleep than a bird.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that the sway of sleep over the gods supports the claim
    that death also has sway, and says that Death is the brother of Sleep.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The gods are said to fall prey to diseases or wounds: Freyr is lovesick,
    Oðinn, Niorðr, and Freyr sink under sicknesses, and Aphrodite and Ares receive
    wounds that are healed.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: In a cited story, the Lord God falls sick, descends from heaven to earth to
    be cured at Arras, is entertained by minstrels and merryandrews, laughs, and is
    rid of his illness.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage compares the Arras story with tales in which sick daughters of
    kings are made to laugh, Skaði is made to laugh by Loki while mourning her father,
    and Iambe cheers the sorrowing Demeter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Passages in the Iliad and Odyssey are cited as distinguishing divine names
    from human names for the same object.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: An Eddic song is described as comparing the languages or names used by gods,
