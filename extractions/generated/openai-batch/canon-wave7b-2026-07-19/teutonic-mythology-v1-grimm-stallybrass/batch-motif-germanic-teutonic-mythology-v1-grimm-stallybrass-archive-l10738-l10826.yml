canonical_text:
  quote: ''
  summary: The passage surveys attestations and comparative interpretations of Njord,
    Freyr, Freyja, and Nerthus. It notes Freyr and Njord as sacrificial gods, connects
    Nerthus' car procession with peace and fertility, describes Njord as honored and
    associated with wealth, wind, sea, fire, waters, lakes, and the shore, and classifies
    Njord, Freyr, and Freyja among the Vanir rather than the Aesir. It also discusses
    cautious comparisons with Saturn, Dionysus, Liber, Noah, Slavic Priye, and proposed
    ethnic interpretations of the Vanir.
  language: English, with Old Norse and Germanic names/phrases
  quote_policy: summarized
