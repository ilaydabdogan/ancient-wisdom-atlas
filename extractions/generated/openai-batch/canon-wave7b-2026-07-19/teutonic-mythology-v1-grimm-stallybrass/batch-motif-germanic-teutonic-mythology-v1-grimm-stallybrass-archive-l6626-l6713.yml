canonical_text:
  quote: ''
  summary: The passage discusses a version of the Langobard naming legend in which
    women are disguised with beard-like hair, a divine voice attributed to Wodan names
    the Langobards, and victory follows. It then compares Wodan/Odin’s heavenly viewing
    place or throne, Hlidskialf, with Old Norse examples, Christian throne imagery,
    Greek high-seeing figures, and a folktale of a mortal climbing into the Lord’s
    chair in heaven.
  language: English, with Latin and Old Norse citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Huns encounter the Langobards crossing the Danube and challenge their
    entry into the territory.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Langobards instruct their women to tie the hair of their heads to their
    cheeks and chins so that they resemble men with long beards.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A voice from above says, in Latin, that these people are Langobards; the passage
    reports that the speaking deity was called Wodan.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the name is given, the Langobards ask the one who instituted the name
    to grant victory, and they overcome the Huns.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The passage notes that Frea and her advice are absent from this account, and
    that the god’s name-giving voice is heard in the air.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states a custom that a person who bestowed a name followed it
    with a gift, and interprets Wodan’s grant of victory in that light.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Wodan is described as looking down on the earth from his heavenly dwelling
    through a window.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Old Norse descriptions say Odin has a throne or high-seat named Hlidskialf,
    from which he can survey the whole world and know or hear what happens among humans.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: When Loki tried to hide, Odin saw his whereabouts from Hlidskialf.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Frigg is sometimes imagined sitting beside Odin in Hlidskialf and sharing
    the same view over the worlds.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Freyr is described as sitting in Hlidskialf, seeing over all worlds, and spying
    the beautiful Gerdr in Jotunheim.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The passage says the power of overseeing all things depends on the position
    or structure of a particular chair, and that others can enjoy the privilege by
    taking the god’s place.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: An Old Saxon Christian passage is cited in which Christ sits on a holy throne
    at God’s right hand and sees whatever the world contains.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage also mentions Zeus sitting on Ida and looking at mortal humans,
    and Helios as the eye of the sun surveying and discerning all things.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: A folktale is summarized in which a mortal admitted to heaven climbs into
    the Lord’s chair, sees a washerwoman steal two veils, and throws the Lord’s footstool
    or a chair leg down at her.
  category: sequence
  evidence_refs:
  - ev:8
