canonical_text:
  quote: ''
  summary: 'Grimm gathers classical and early medieval notices about Germanic sacred
    groves and trees: groves are described as divine dwelling places without temple
    walls or human-form images, containing cult objects, altars, animal images, sacrifice,
    and assemblies. He then cites Wilibald’s account of Boniface cutting the Geismar
    oak called robur Jovis, after which pagan onlookers reverse their curse and bless
    the Lord.'
  language: English with Latin citations
  quote_policy: summarized
