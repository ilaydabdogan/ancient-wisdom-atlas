  summary: The passage compares bodily signs of anger, radiance, and mirth in gods
    and heroic or royal figures. It states that Zeus and Donar share gestures of favour
    or anger and command avenging thunder; surveys rays, halos, head-sheen, stars,
    beams, and related celestial imagery around divine or revered heads; and discusses
    divine merriment and laughter in Greek, Norse, and other poetic examples.
  language: English
