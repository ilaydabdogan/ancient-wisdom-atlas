  summary: 'The passage is a philological and comparative discussion of the name Phol:
    medieval attestations and place-names are listed, possible links to a former sanctuary
    are considered, fire/light and white-god etymologies are proposed, and Phol is
    related cautiously to Paltar/Balder. A footnote recounts a Greek tradition in
    which Herakles receives a spring from Zeus and suggests a comparison between Herakles''
    pyre on Oeta and Balder''s pyre.'
