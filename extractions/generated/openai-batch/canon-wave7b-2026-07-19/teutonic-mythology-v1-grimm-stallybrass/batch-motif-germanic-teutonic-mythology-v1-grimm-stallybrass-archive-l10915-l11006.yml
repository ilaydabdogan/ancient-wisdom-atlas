canonical_text:
  quote: ''
  summary: The passage presents a philological and comparative discussion of Paltar/Baldr,
    weighing meanings connected with princely status, boldness, whiteness, brightness,
    day, and divine light. It mentions Nanna as Baldr's wife, Bældæg as Woden's son
    in Anglo-Saxon genealogies, Brond as Bældæg's son, Baldr's shining beauty in Snorri,
    the plant-name Baldrsbrá, possible place-names, and Baldr's heavenly abode Breiðablik.
  language: English
  quote_policy: summarized
