  quote: ''
  summary: The passage discusses Thor/Donar as a deity who drives rather than rides,
    walks to judgment and wades rivers, and is associated in folk sayings with thunder
    and lightning. It then surveys thunder as a divine act, especially as anger or
    punishment, and compares Germanic Donar with Gallic Taranis, Latin Jupiter/Tonans,
    the Christian God in medieval and vernacular expressions, and Greek Zeus as thunder-associated
    figures.
