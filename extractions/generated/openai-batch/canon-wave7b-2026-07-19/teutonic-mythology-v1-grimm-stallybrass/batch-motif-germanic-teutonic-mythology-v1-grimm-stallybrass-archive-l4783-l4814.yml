canonical_text:
  quote: ''
  summary: The passage reports a learned tradition about Jettha, an old prophetic
    woman living on the hill of Heidelberg/Jetta's Hill. She rarely appeared, answered
    counsel-seekers from a window without showing her face, and foretold the hill's
    future occupation by royal men and famous temples. The story then narrates her
    death after she goes walking near mountains and springs, where a hungry she-wolf
    with cubs attacks and tears her apart; the spring is said to be named the wolves'
    spring. Grimm's commentary questions how much is genuine tradition and compares
    the window or elevated dwelling to Veleda's tower and Brynhild's rock and tower,
    while also noting a hypothetical name echo with Old Norse Heidr.
  language: English with Latin excerpt
  quote_policy: summarized
