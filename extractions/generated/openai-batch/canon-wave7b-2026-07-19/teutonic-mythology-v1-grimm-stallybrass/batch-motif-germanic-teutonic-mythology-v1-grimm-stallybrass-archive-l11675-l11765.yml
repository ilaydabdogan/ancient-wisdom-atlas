canonical_text:
  quote: ''
  summary: The passage discusses Bragi as speaker of mythic narratives questioned
    by Oegir, then treats Oegir as an awe-inspiring sea figure of giant kind. It links
    Oegir’s name with terror and the sea, surveys the fear-inspiring helmet Oegishialmr
    and related helmets, masks, glances, swords, and shields, and cautiously compares
    these with Greek Oceanus, the aegis, and Pluto’s helmet.
  language: English
  quote_policy: summarized
