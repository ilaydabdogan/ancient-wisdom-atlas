canonical_text:
  quote: ''
  summary: Grimm weighs proposed identifications of Tacitus's Roman or Greek-named
    figures with Germanic gods and heroes. He discusses Hercules in relation to Thor/Donar,
    Sahsnot, Zio, and especially Irmin; Ulysses in relation to Odin and to Isco/Escio/Asko,
    founder traditions, and Asciburgium; and Castor and Pollux/Gemini in relation
    to the Alci or worshipped divine twins. He then remarks that early Teutonic heroic
    mythology is mostly lost and later genealogies mainly preserve links between kings,
    gods, and heroes.
  language: English with quoted Latin and Greek terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Norse Thor, like Hercules, performs many heroic deeds,
    but says those deeds could also be credited to Irmin and that Irmin and the thunder-god
    otherwise have little in common.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage notes arguments in favor of understanding Tacitus''s Hercules
    as Donar: Herakles was a son of Zeus and an enemy of giants.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author reports an earlier idea that Hercules might correspond to Sahsnot
    or Seaxneat on the basis of the name Hercules Saxanus, but rejects this because
    the inscriptions are not confined to Germany and belong more to Roman religion.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Sahsnot is more justly assigned to Zio, with whom Hercules
    cannot be connected.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The author says Irmin''s claim is better founded: as Hercules was Jupiter''s
    son, Irmin seems to have been Wodan''s son, and Irmin may have been the subject
    of battle-songs.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tacitus is summarized as reporting that some thought Ulysses wandered to the
    German ocean, came to German lands, founded and named Asciburgium on the Rhine,
    and had an altar there bearing the name of his father Laertes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage reports that some saw Odin in Odysseus and Asburg in Asciburg,
    but the author rejects these readings on contextual and linguistic grounds.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author proposes that Tacitus's Ulysses can more simply be supposed to
    have been Isco, Escio, or Asko.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage links Mannus as father of Isco with Laertes as father-name, and
    mentions traditions of the first man being created from stone or rock and Asco
    growing out of the ash tree.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that interpretatio Romana proceeded more by analogies of
    sense than by analogies of sound.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage treats Castor and Pollux/Gemini as difficult to interpret, mentions
    a place where godlike twins were worshipped, and says Germanic antiquity has many
    hero brothers but no twins with a name like Alci.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage concludes that Teutonic races probably had a developed heroic
    mythology, but surviving evidence is mostly late genealogies connecting later
    kings with ancient gods and heroes rather than detailed myths.
  category: other
  evidence_refs:
  - ev:9
