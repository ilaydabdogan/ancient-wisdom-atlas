canonical_text:
  quote: ''
  summary: 'A Latin chronicle passage describes a contested ship procession after
    ten days of rites: some townspeople urge that the ship be burned or removed, others
    carry it onward, the lord of Louvain warns against admitting it, and the people
    of Leugues close their gates. A later English commentary emphasizes clerical hostility,
    secular authorization of the procession, and the description of the ship as demonic,
    heathenish, and comparable in hostile language to ships of classical gods.'
  language: Latin and English
  quote_policy: summarized
