canonical_text:
  quote: ''
  summary: The passage discusses harvest and field-fertility customs and formulas
    connected with names such as Gode/Gaue, Erce, Earth, Herke/Harke/Hera, Nerthus,
    and the Phrygian Mother of Gods. It notes a Prignitz custom of leaving a bunch
    of ears in a field as Dame Gode's portion; Old English field-fertility addresses
    to Erce and to the earth as mother of men; reports of Frau Harke/Hera flying between
    Christmas and Epiphany, giving abundance and punishing unfinished spinning; and
    classical parallels involving earth/mother goddesses, processions, offerings,
    and the washing of the Mother of Gods.
  language: English with quoted Old English and Latin phrases
  quote_policy: summarized
