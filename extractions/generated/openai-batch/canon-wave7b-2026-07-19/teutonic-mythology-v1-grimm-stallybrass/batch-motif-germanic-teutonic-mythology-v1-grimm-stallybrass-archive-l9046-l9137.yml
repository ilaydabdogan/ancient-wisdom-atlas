canonical_text:
  quote: ''
  summary: The passage discusses Thor/Thunor/Donar and his hammer as a thunder weapon,
    legal and ritual sign, life-restoring implement, stolen object in the Eddic hammer-recovery
    myth, and later folk-song motif. It also connects the hammer with thunderbolts
    entering the earth, with curse formulas and devil/death personifications, with
    the Christian cross and Christ as thunder-lord, with serpent-slaying comparisons
    involving Leviathan and Jormungandr, and with a Neapolitan tale personifying thunder
    and lightning.
  language: English
  quote_policy: summarized
