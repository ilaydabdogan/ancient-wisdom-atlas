canonical_text:
  quote: "“Mannus however is the first hero, son of the god, and father of all men.”"
  summary: 'The passage surveys divine and heroic genealogies: Roman examples of deified
    or divinely descended figures; Mannus/Mennor as a first hero and ancestor of the
    Teutonic race; descent of Germanic branches from Mannus’s sons; and the figure
    Ing/Ingo/Yngvi, remembered in rune tradition as dwelling with the East Danes before
    crossing the sea with a wain following him, and associated in Scandinavian genealogies
    with divine and royal lines.'
  language: English with quoted Old English and Middle High German forms
  quote_policy: quoted
