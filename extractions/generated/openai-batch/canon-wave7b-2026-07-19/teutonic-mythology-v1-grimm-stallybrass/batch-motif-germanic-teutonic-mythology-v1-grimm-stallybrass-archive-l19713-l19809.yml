canonical_text:
  quote: ''
  summary: The passage discusses Germanic wise women and prophetesses, especially
    Veleda, Ganna, and Aurinia or Aliruna. It connects Veleda with Norse vala/volva
    terminology, describes her tower dwelling, prophetic and judicial functions, and
    the belief that such women traveled to houses to bless them. It then discusses
    Ganna through possible root meanings and warnings against trusting valas. It recounts
    a superhuman woman who confronts Drusus, forbids his advance, and foretells his
    death. Finally, it discusses Aurinia/Aliruna and related traditions of magical
    women, including Jornandes' account in which expelled Gothic magical women mate
    with wilderness beings and produce the Huns.
  language: English
  quote_policy: summarized
