canonical_text:
  quote: ''
  summary: 'The passage surveys sacred groves, holy woods, springs, and trees: Christian
    access to groves and springs is described as polluting; a song mentions Christians
    scaring away a holy sparrow from a grove; Tharapila is associated with birth in
    a mountain and forest and flight to Osilia; Romove is described as the Old Prussians''
    most sacred place with divine images on a holy oak and strict forest taboos; and
    a hagiographic narrative tells of an Auxerre pear tree where Germanus hung animal
    heads until Bishop Amator cut and burned the tree and cast away the trophies.'
  language: English with Latin excerpts
  quote_policy: summarized
