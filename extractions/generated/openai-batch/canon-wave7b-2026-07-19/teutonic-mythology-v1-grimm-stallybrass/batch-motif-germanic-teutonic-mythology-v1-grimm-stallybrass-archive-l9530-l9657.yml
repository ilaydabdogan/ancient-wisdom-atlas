  quote: ''
  summary: The passage discusses customs and survivals associated with Thunar/Donar,
    including stone-throwing or stoning practices, Thursday observance, taboos and
    thunder punishment, formal renunciation of Thunar, and comparison with Wuotan
    and Zeus. It then opens a chapter on Zio/Tiw/Tyr, tracing weekday names and linguistic
    correspondences with Greek, Gothic, Sanskrit, and Latin divine-name forms.
  language: English
