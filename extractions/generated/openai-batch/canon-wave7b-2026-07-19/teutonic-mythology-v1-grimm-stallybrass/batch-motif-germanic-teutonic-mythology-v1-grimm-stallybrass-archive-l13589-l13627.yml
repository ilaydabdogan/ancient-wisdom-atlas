canonical_text:
  quote: ''
  summary: On Twelfthday eve or Perchtha's night, Perchtha appears near waters and
    hills with heimchen or children, farming implements, and a broken plough or wagon.
    A traveller who helps her refuses chips as wages but later finds a gold-piece
    in his shoe. A later man who waits greedily for the encounter is wounded by Perchtha's
    hatchet. Another account says a spinning-girl laughs at Perchtha's procession
    of homeless heimchen-folk and is struck blind; a year later she unknowingly asks
    alms of Perchtha.
  language: English
  quote_policy: summarized
