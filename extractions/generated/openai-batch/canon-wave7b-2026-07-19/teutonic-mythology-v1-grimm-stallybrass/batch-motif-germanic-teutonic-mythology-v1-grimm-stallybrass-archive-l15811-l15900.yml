  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Thor is described as eating an ox and eight salmon, drinking three casks of
    mead, drinking through a horn connected with the sea, lifting the world-encircling
    snake, and striking valleys into a rocky mountain with his hammer.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage says Teutonic and Greek mythology generally do not give gods many
