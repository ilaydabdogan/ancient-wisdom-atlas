  text: The passage states that humans grow slowly, while gods attain full size and
    strength directly after birth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Themis gives nectar and ambrosia to newborn Apollo, Apollo leaves his
    swathings, sits among goddesses, begins to speak, and roams the country while
    unshorn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vali is described as one night old, unwashen and unkempt, when he goes out
    to avenge Baldr’s death on Hodr.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hermes is described as born in the early morning, playing the lute at midday,
    and driving oxen away in the evening.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Zeus is described as growing rapidly and having enough strength in his first
    years to contend with Kronos.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Magni, three nights old, throws Hrungnir’s enormous foot off Thor and says
    he would have beaten the giant dead with his fist.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that the gods have human-like shape, but larger, sometimes
    exceeding gigantic scale.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ares’ fallen body is said to cover seven roods of land, and Hera is said to
    grasp earth and sea when taking an oath.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Poseidon’s and Ares’ cries are compared to thousands of warriors, while Hera’s
