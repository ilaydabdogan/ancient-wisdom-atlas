canonical_text:
  quote: ''
  summary: The passage evaluates an Augsburg-area tradition as mixed fact and fiction
    but preserving notice of a Suevic goddess named Cisa or Zisa. It proposes that
    the place-name Cisara may derive from Cisa's altar and temple, reports an anniversary
    festival with games and merrymaking on Sept. 28, connects the season cautiously
    with harvest, notes adjacent Christian and Saxon victory festivals, and compares
    Cisa/Zisa with Tacitus's Suevic Isis, Zio or a feminine Ziu, and a Middle Dutch
    weekday name.
  language: English
  quote_policy: summarized
