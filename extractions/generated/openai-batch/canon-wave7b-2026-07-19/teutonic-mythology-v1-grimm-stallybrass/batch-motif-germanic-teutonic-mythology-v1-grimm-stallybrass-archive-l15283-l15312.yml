canonical_text:
  quote: ''
  summary: The passage discusses Germanic and Old Norse legal and religious terms
    that appear as personified goddesses or possible lost divinities. It names Syn
    as a goddess of truth and justice who protects the accused; Vor as a goddess of
    plighted faith and covenants; possible Wara and Sunia inferred from abstract words;
    Saga as a heathen goddess, daughter of Wuotan, who teaches mankind a divine art
    invented by Wuotan; and Nanna as the wife of Baldr. It also compares Vor to Roman
    Tutela and Saga to the Muse, daughter of Zeus.
  language: English
  quote_policy: summarized
