canonical_text:
  quote: ''
  summary: 'The passage surveys Perchta/Berchta traditions and related names: food
    and drink left for her; Perchta-running and other noisy youth customs; Behte as
    a mild figure; Berchtolt as a masculine counterpart or white mannikin connected
    with spinning; the white lady/Berta as a benevolent family ancestress who tends
    babies; and heroic or national Berta traditions involving spinning and a marked
    foot.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People are said to leave meat and drink standing for the female figure, and
    the author says this means a sacrifice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the mountains of Salzburg, a Perchta-running or Perchta-leaping is kept
    in honour of the terrible Percktel during the rauchnächte.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Pinzgau, young fellows called the Berchten roam in odd disguises with
    cows' bells and cracking whips; in the Gastein valley, a large procession hops
    and skips from village to village and house to house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In northern Switzerland, Bechteli day falls on January 2 or, in a stated circumstance,
    January 3, and is marked by young people's merrymakings; an older Zurich custom
    involved pressing others to take wine and was called conducting to Berchtold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that there was a masculine Bercht or Berchtolt, related
    to Wuotan as Berhta was to Freke, and that a new Swabian feminine form arose from
    this.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Alsace, bechten was performed by apprentices and journeymen running from
    one house or room to another and making a racket.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cunrat of Dankrozheim describes Behte as mild, gracious to men, and having
    a great kindred, rather than as terrible.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Berchtolt appears in Swabian legend as a white mannikin who brings spools
    to be filled with spinning.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The white lady is said to have the same meaning as names derived from forms
    signifying bright, light, or white.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The white lady usually attaches herself to particular families, keeps the
    name Berta, appears at night in snow-white garments in princely houses, rocks
    or dandles babies while nurses sleep, and acts as the family's grandmother or
    ancestress.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Several women named Berta in national traditions are said to stand connected
    with the ghostly Berhta and to have been adopted from divine legend into heroic
    legend.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Italian and French phrases about a remote past refer to the time when Berta
    or Queen Berthe spun, which the passage connects with the idea of a spinning matron.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The heroic Berta is identified as daughter of King Flower and Whiteflower,
    wife of King Pippin, mother of Charles, and called by names including Brehte.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: The heroic Berta is described in several traditions as having a large foot,
    especially one large or larger right foot, though one French account broadens
    this to both feet.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: A note compares Perchtenspringen with the Böhmerwald hexentusch, in which
