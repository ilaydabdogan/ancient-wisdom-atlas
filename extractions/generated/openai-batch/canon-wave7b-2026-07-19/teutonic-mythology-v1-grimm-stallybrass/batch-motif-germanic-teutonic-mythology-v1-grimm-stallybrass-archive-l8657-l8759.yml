canonical_text:
  quote: ''
  summary: The passage compares Germanic thunder-god material with related traditions
    about Perkuna tete, Elijah/Elias as a thunder and rain figure, Thor’s fatal combat
    with the great serpent, the Muspilli account of Elias wounded before Judgment
    Day, and Caucasian or Circassian practices involving lightning victims, goat sacrifice,
    and prayers to Elias for fertility and protection from hail. It also notes Mary’s
    association with rain invocation.
  language: English, with quoted Latin and Old High German phrases
  quote_policy: summarized
