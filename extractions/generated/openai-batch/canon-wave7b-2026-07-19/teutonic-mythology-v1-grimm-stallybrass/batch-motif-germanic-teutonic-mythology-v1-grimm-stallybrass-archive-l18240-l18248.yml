  summary: The passage discusses the epithet sveinn for Norse Sigurðr and connects
    this hero with Danish and Swedish song and tale names. It notes a Danish folk-song
    figure, Sivard snaresvend, riding Grani and accompanying to Askereia; it also
    reports that Svend Felding or Fulling drank from a horn handed by elvish beings
    and gained the strength of twelve men.
