canonical_text:
  quote: ''
  summary: The passage discusses funerary attendants and animals sent with wealthy
    dead, distinguishes these from sacrifices to gods, and surveys animal sacrifice
    with emphasis on horses, oxen, bulls, cows, and numbered sacrifices. It cites
    Germanic, Norse, Anglo-Saxon, Slavic, Finnish, Persian, Indian, and Greek comparative
    examples, including rites at Uppsala, an offering to Freyr, black cattle, and
    a bull slain after a formal duel.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that nobles and rich men at funerals could be followed
    in death by bondsmen and by domestic and hunting animals so that they might have
    their services in the other world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author distinguishes hypothetical prisoners sacrificed to gods from funerary
    attendants and argues that animals named in such a context were not meant as escorts
    for enemies or for the gods' own use.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that, at the New Year's festival under discussion, horses
    alone were probably sacrificed, while men, hounds, and cocks were added by legend.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Horse sacrifice is described as preeminent and most solemn among animal sacrifices,
    and the horse is described as specially sacred among several peoples.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage cites sources for ox, bull, goat, and cattle sacrifices among
    Alamannic, Norse, and Anglo-Saxon contexts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A footnote gives funerary examples in which servants, hawks, horses, and dogs
    are burned or buried with the dead.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage asks whether black oxen and black cows, said not to be killed
    for household use, were sacred sacrificial beasts, and reports a black bull sacrifice
    by Val. Suplit.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: During a famine in Sweden under King Domaldi, the Swedes instituted a great
    sacrifice at Uppsala, first sacrificing oxen; when these were insufficient, the
    passage says they rose to higher and higher kinds.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Freyr's temple, an old ox is led forward, verbally given to Freyr, struck,
    groans, and falls dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At a formal duel, the victor slays a large old bull, called a blot-neat, with
    the same weapons used to defeat his foe.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Greek hecatomb is explained as originally involving one hundred oxen,
    and the passage adds that Indians also had sacrifices of a hundred.
  category: attribute
  evidence_refs:
  - ev:10
