canonical_text:
  quote: the true Teutonic Donar throws wedge-shaped stones from the sky
  summary: 'The passage surveys Germanic and Norse thunder-weapon traditions: Donar
    is associated with wedge-shaped stones falling from the sky; popular belief treats
    thunderstones as buried, rising, protective, and storm-sensitive objects; Norse
    Thor possesses the hammer Mjolnir, which returns after being thrown at giants,
    is connected with lightning and thunder, was forged by dwarfs, and functions as
    a sacred consecrating sign. The passage also compares these ideas with Greek/Roman/Jovial
    thunder weapons, Jupiter’s sacred flint, and the Christian sign of the cross.'
  language: English
  quote_policy: quoted
