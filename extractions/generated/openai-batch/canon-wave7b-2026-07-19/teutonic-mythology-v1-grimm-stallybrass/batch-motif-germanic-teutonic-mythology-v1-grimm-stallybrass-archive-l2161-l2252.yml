canonical_text:
  quote: ''
  summary: The passage discusses Germanic terminology for sacrifice, its possible
    links with sorcery and consecration, and distinguishes vow from sacrifice. It
    then defines sacrifice as divine-human exchange through food, classifies offerings
    by thanksgiving, appeasement, divination, and special life occasions, contrasts
    plant and animal offerings, and cites Old Norse seasonal blót cycles for winter,
    midwinter, summer, fertility, plenty, and victory.
  language: English
  quote_policy: summarized
