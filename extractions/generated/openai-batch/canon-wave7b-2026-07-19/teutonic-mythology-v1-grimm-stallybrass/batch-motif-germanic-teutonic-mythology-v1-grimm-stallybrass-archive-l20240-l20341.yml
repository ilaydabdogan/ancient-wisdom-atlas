  quote: They were good-natured, and took special care of the children whose fates
    they foretold.
  summary: The passage describes fays who carry stones while spinning, foretell and
    care for children, enter houses by chimneys, detect a man's disguise, and punish
    him by shrinking apples into peas. It then discusses fate-spinning imagery in
    Romance, German, Norse, Roman, and Greek materials, including three fays, norns,
    Aisa, Kataklothes, Moirai, and the thread or cord of life.
