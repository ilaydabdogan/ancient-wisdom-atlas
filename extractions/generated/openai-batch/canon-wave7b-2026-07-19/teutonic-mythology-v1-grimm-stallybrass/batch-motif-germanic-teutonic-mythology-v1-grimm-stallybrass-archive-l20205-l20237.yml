canonical_text:
  quote: "“beautiful women (beles dames parees), who at a fixed time of the year seek
    a night's lodging at a house”"
  summary: 'The passage gathers examples of fays or wise women: a lady of the black
    rock whose sight leaves people glad, rich, and wise; the Franche-Comte fee Arie,
    who appears at country and harvest feasts, rewards diligent spinners, helps good
    children with fruit, nuts, and cakes, and is compared with Holda, Berhta, and
    Arianrod; and an account from Adam de la Halle in which Dame Morgue, Arsile, and
    Maglore visit a house, require silent observation, receive prepared dishes, and
    distribute gifts or penalties when Maglore finds no knife laid for her.'
  language: English with embedded French and German citations
