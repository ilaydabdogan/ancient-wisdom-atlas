canonical_text:
  quote: ''
  summary: The passage introduces a chronicle report about a ship constructed in a
    wood, placed on wheels, and drawn over land by weavers through several towns.
    The ship is received with processions and nocturnal festivities. Abbot Rodulf
    warns the townspeople not to receive it, alleging malignant spirits and predicting
    unrest and bloodshed. The weavers are compelled to haul and guard the ship; music,
    songs, and dances occur around it, and women join the dances at night.
  language: English and Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The approach of the ship was announced to towns, and towns opened their gates
    and went out to meet it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A poor rustic from Inda devised a plan against the weavers, built a ship in
    a nearby forest, fixed it on wheels, and made it movable over land.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: With permission from authorities, ropes were put over the weavers' shoulders
    so that the ship would be drawn from Inda to Aachen.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Aachen the ship was received by a large procession of both sexes; it was
    then taken by weavers to Maastricht, repaired, fitted with mast and sail, and
    led on to Tongres and Looz.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Abbot Rodulf warned people not to receive the ship, saying malignant spirits
    were drawn in it under the guise of play and that sedition, killings, fires, plunder,
    and bloodshed would follow.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The townspeople did not listen to the abbot and received the ship with zeal
    and joy; the chronicler compares their reception to the Trojans accepting the
    fatal horse.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Weavers who came late to guard the ship were threatened with proscription,
    and weavers were compelled to keep guard around the ship night and day with every
    kind of armament.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: The weavers secretly prayed to God as just judge and complained to one another
    about their humiliation and the coercion imposed on them.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Various musical sounds and shameful songs were performed before the ship,
    which the chronicler calls an abominable dwelling of malignant spirits.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The judges ruled that anyone approaching to touch the ship had to leave a
    pledge taken from the neck with the weavers unless they redeemed themselves.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Women or matrons, hearing the noise, left their beds with loose hair, some
    half-naked or wearing only a simple cloak, and joined the dances around the ship.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A crowd of both sexes is described as celebrating around the ship until midnight,
    and when the dance broke up they moved about with loud cries.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: A footnote compares the reported ship-building and transport details to other
    ship-transport stories, while noting that this ship was drawn by ropes over shoulders
    rather than carried.
  category: other
  evidence_refs:
  - ev:11
