canonical_text:
  quote: ''
  summary: The passage notes a Swedish tale of Greymantle who takes someone to heaven
    and forbids opening a lock; describes Odin/Wodan’s appearances and names; discusses
    Odin’s spear Gungnir and the victory-bestowing practice of casting a spear over
    enemies; describes Odin’s wolves and ravens, including Huginn and Muninn on his
    shoulders reporting what they see and hear; compares wolf and raven associations
    with Apollo, Mithras, Christian dove imagery, and Oswald’s raven; and identifies
    Wodan under one figure as a possible water-sprite or water-god comparable to Neptune.
  language: English
  quote_policy: summarized
