  summary: The passage compares the names and identities of Frigg/Fricg/Frikka/Frea
    and Freyja/Frouwa, arguing that their forms and meanings are close and that their
    myths were sometimes mingled. It cites prayers and mythic scenes where Frigg and
    Freyja appear together, traditions identifying Frea as Wodan's consort, weekday-name
    evidence, and narrative parallels involving gold, conjugal fidelity, and the valshamr
    attributed in different sources to Freyja or Frigg.
