  summary: The passage surveys Germanic and comparative evidence for divine images,
    paired cult figures, materials of statues, the term Irminsul/yrmensul as statue
    or pillar, and annalistic reports that Charles destroyed the Saxon Irminsul. A
    note compares accounts of idols or statues being treated as animate or acted upon
    in other traditions.
