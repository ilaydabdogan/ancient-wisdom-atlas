canonical_text:
  quote: ''
  summary: The passage recounts a legend in which Herodias loves John, is rejected
    by his severed head, and is blown into empty space. It then discusses medieval
    identifications among Herodias, Pharaildis, Frau Hilde or Hulde, the Milky Way,
    Holda, Diana, the furious host, nocturnal sorceresses, and the household-visiting
    figure Abundia or Satia. Grimm presents these as evidence for the blending of
    Christian Herodias material with native pagan female figures and nocturnal cult
    or folklore patterns.
  language: English with embedded Latin and Middle Dutch terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening female figure sits on oaks and hazel-trees until first cockcrow
    and otherwise floats through empty air.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same figure is said to love John without return; when John's head is brought
    on a charger, she tries to cover it with tears and kisses, but the head draws
    back, blows hard at her, and she is whirled into empty space forever.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage notes that church accounts of John the Baptist and Herodias do
    not resemble this story, identifying Herodias as Herod's wife and naming the daughter
    Salome.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage connects the later name Pharaildis with Middle Dutch Ver Elde
    and with Frau Hilde or Hulde, and also notes a Middle Dutch name for the Milky
    Way interpreted as Frau Hilde or Hulde's street or highway.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that, early in the Middle Ages, the Christian myth of Herodias
    became mixed with native heathen fables about Dame Holda, the furious host, and
    nightly journeys of sorceresses.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A note in the passage says that, in Lower Saxony around Celle, a certain whirlwind
    is explained by the dancing Herodias whirling in the air, while elsewhere such
    wind is attributed to the devil or to a demon.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says Diana, Herodias, and Holda stand for one another or side
    by side, and describes Diana as a lunar deity of night and a wild huntress.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage cites a life of St. Kilian in which Gozbertus considers whether
    to prefer the cult of Kilian's preached God or Diana, and says Diana was held
    in great veneration by him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage cites a medieval French authority describing a daemon under the
    pretext of a woman, accompanied by others, who is said to frequent houses and
    cellars at night and is called Satia from satiety and domina Abundia from the
    abundance she is said to provide.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The same cited account says the female beings called dominas eat and drink
    from household food and drink without diminishing it, especially if vessels are
    left uncovered or unclosed at night; if vessels are covered or closed, they do
    not eat or drink and leave the house unlucky and without satiety or abundance.
  category: sequence
  evidence_refs:
  - ev:9
