canonical_text:
  quote: ''
  summary: The passage discusses early evidence for Germanic divine images and cult
    wagons. It reports Sozomen's account of Athanaric carrying a Gothic deity's statue
    on a covered wagon to suspected Christian homes and threatening those who refused
    worship and sacrifice. Grimm compares this to covered divine vehicles in Tacitus,
    Freyr's wagon procession, field processions of covered images for fertility, and
    later or wider carriage traditions. The passage then turns to Gregory of Tours
    on Clovis and Clotilda, noting Grimm's caution about the speeches while treating
    them as evidence that Frankish gods or statues were not unknown; Clotilda's speech
    criticizes worshipped gods as sculptures of bronze, wood, or metal and as former
    humans rather than gods.
  language: English
  quote_policy: summarized
