canonical_text:
  quote: ''
  summary: The passage discusses weekday names among Germanic and neighboring peoples.
    It reports Saxo Grammaticus's argument that Norse weekday nomenclature derives
    from native gods rather than Latin gods, using the father-son relations of Othin,
    Thor, Mercury, and Jupiter to dispute direct identification. Grimm then compares
    Teutonic, Slavic, Lithuanian, Finnic, Lappish, Esthonian, Indian, and Slavic deity-name
    systems, concluding that Latin Mercurius, Jupiter, and Mars in Germanic records
    may most probably be interpreted as Wuotan, Donar, and Ziu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Saxo Grammaticus is reported as saying that Norse weekday nomenclature is
    derived from native gods and that these gods are not the same as the Latin ones.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fourth and fifth days of the week are associated with Othin and Thor in
    Norse nomenclature and with Mercury and Jupiter in Latin nomenclature.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Thor is Othin's son, Othin is Thor's father, Jupiter
    is Mercury's father, and Mercury is Jupiter's son.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the genealogical discrepancy is strong but treats it as evidence
    about how Othin and Mercury were placed on the same pedestal, with Mercury perhaps
    regarded as a Celtic divinity differing from the classical Mercury.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Saxo's remark supports an early heathen origin for weekday
    names, while also noting that Saxo could be carried away by an identity of Thor
    and Jupiter.
  category: other
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that variations in weekday names among Teutonic peoples
    show that national ideas still affected the names.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says later heathenism in Friesland and Saxony helped old names
    of Wednesday and Saturday survive, while in Upper Germany they disappeared earlier.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage highlights Alamannic and Bavarian deviation in the name of the
    third day and questions whether such divergence could have arisen from Christian
    clergy after the heathen god corresponding to Mars had become indistinct.
  category: other
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says Slavs and Lithuanians do not use planetary weekday names
    but count days, while Finns and Lapps do not count and Esthonians mostly do.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that Slavic counting begins with Monday as the first day
    after rest, making Tuesday second and Thursday fourth, unlike Latin and Icelandic
    reckoning.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage notes that Slavic names such as sreda, sereda, and srida mean
    the middle day, and compares this with High German mittewoche and Finnic keskivnjcko
    as middle or half-week terms.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage says the Wends in Lüneburg alone among Slavs show a trace of naming
    a weekday after a god, using Perendan for dies Jovis from Peren or Perun, a thunder-god.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage concludes that, in Latin records about Germany and its gods, Mercurius
    may probably be interpreted as Wuotan, Jupiter as Donar, and Mars as Ziu.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage describes German translations of weekday gods as an experiment
    on Tacitus's interpretatio Romana.
  category: other
  evidence_refs:
  - ev:7
- id: obs:15
  text: A footnote says Indian nations also name weekdays after planets and gives
    Sanskrit and Tamil forms for Wednesday related to Budhas, while distinguishing
    Budhas from the prophet Buddhas.
  category: other
  evidence_refs:
  - ev:5
- id: obs:16
  text: 'A footnote lists Slavic deities identified with Latin and Germanic weekday
    gods: Svatovit with Mars or Ziu, Radigast with Mercury or Wuotan, Perun with Jupiter
    or Donar, iafZa as golden dame with Venus or Fria, and perhaps Sitivrat with Saturn.'
  category: relationship
  evidence_refs:
  - ev:9
