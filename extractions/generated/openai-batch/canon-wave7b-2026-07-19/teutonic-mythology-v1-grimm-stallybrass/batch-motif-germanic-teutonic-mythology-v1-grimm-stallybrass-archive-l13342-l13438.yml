canonical_text:
  quote: ''
  summary: The passage discusses the name and figure of Holda/Holle, rejects deriving
    the German figure from the biblical prophetess Huldah/Olda, and adduces Norse,
    Norwegian, Danish, Icelandic, and Upper German parallels. It describes Huldra/Hulle
    as a wood or mountain wife associated with pastures, cattle, milking, music, ambiguous
    beauty, a concealed tail, child-stealing, and rule over mountain-sprites or hidden
    folk. It also introduces Berchta/Perahta as a similar or possibly identical Upper
    German figure whose name means bright or luminous but whose fearsome aspect is
    often emphasized.
  language: English
  quote_policy: summarized
