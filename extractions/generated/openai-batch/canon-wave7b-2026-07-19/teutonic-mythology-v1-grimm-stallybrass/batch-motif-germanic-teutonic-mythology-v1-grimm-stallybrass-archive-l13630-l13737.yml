canonical_text:
  quote: ''
  summary: The passage collects traditions about Perchtha/Berchte/Berche and related
    names. It describes a legend in which Perchtha restores a maid's sight by blowing
    into her eyes, mentions weeping children in her troop, reports Epiphany and winter
    household warnings that Berche or Stempe will punish children or household members,
    and discusses names such as Hildaberta, Bildaberta, Stempe, Trempe, and Fercht
    with long or iron nose.
  language: English, with quoted Middle High German verse and translations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Perchtha says she had blown a pair of lights out the previous year and will
    blow them in again; she blows into the maid's eyes, after which the maid sees
    again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage mentions weeping children who tramp along in Perchtha's great
    troop.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the mountain district about Trauenstein, children are told on the eve of
    Epiphany that naughty children will be visited by Berche, who will cut their bellies
    open.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Greasy cakes are baked on that day, and workmen say a person should grease
    the stomach well with them so that Dame Berche's knife may glance off.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: In some Franconian and Swabian places she is called Hildaberta or Bildaberta;
    with shaggy hair she walks around houses at night and tears bad boys to pieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vintler calls her Dame Precht with the long nose, and Martin of Amberg calls
    her Fercht with the iron nose.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:7
  text: A Middle High German poem places the Stempe threat after Christmas on the
    twelfth day and at supper, when a master or father tells servants and a child
    to eat fast lest the Stempe tread them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The father in the poem explains that a gruesome thing comes on whoever forgets
    to eat fast and treads that person.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author identifies Stempe as a cognomen of Berchte and relates the name
