canonical_text:
  quote: ''
  summary: 'The passage recounts Christian missionary actions at a sacred island and
    spring associated with Fosde/Fosetis: Willibrord baptizes three people there and
    violates local sacred taboos without suffering expected harm; King Eadbod casts
    lots in anger, but only one companion is selected and martyred; later Liudger
    destroys Fosetis''s shrines, builds churches, and baptizes inhabitants at the
    same bubbling spring. The passage also notes the former taboo of drawing water
    only in silence and the later name Helegland/Helgoland, with Christian evangelists
    preserving the site''s sense of sacredness.'
  language: Latin and English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The place is described as having a religious sanctity, and violators of its
    sacred things were said to be condemned by the king to a very cruel death.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Willibrord baptized three people in the spring with invocation of the Holy
    Trinity and ordered animals grazing there to be slaughtered for his followers'
    food.
  category: action
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:3
  text: The pagans who observed these actions expected the missionaries either to
    go mad or to die quickly, but when they saw no harm befall them they reported
    the event to King Eadbod.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: King Eadbod, angered by the perceived injuries to his gods, cast lots three
    times daily for three days according to his custom.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The lot did not fall on the priest or his group except for one companion,
    who was selected by lot and crowned with martyrdom.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Eadbod feared Pippin the Frank and let the evangelist go unharmed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Liudger later sought to destroy pagan shrines and wash away earlier error,
    then sailed to an island near the Frisians and Danes named Fosetesland after the
    local false god Fosde.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the island, Liudger and his companions destroyed all shrines of Fosetis,
    built churches of Christ in their place, instructed the inhabitants in the Christian
    faith, and baptized them in the bubbling spring.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The spring had a former restriction: no one previously presumed to draw water
    from it except in silence.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The island later took the name Helegland or Helgoland, and the passage says
    the evangelists conserved the existing sense of sacredness for Christianity.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Adam of Bremen is cited as describing an island in the ocean near the mouth
    of the Elbe where a monastery was built and habitation established.
  category: setting
  evidence_refs:
  - ev:8
