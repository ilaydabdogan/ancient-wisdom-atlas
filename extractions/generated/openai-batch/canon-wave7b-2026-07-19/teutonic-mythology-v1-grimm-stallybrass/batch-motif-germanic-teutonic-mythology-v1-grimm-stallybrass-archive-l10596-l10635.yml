canonical_text:
  quote: ''
  summary: 'The passage surveys boar-related Germanic material: a Christmas-eve round
    by Theoderic/Derrick with a boar that may damage farm implements left outside;
    Holda or Berhta inspecting ploughs and spindles in the same season; Aestyan boar-form
    charms connected by the author with the mater deum, Freyja, and Gullinbursti;
    and Anglo-Saxon poetic boar signs, boar-badges, and gilded boar helmet crests
    that function as auspicious or protective emblems.'
