comparison_claims:
- id: claim:1
  claim: The passage presents Nerthus, Freyr, Wuotan, and Donar as sharing a vehicle-procession
    pattern connected with peace, fruitfulness, crops, or rain.
  claim_level: same_function
  target: Germanic processional deities in covered cars or wains
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The author stresses agreement of function and form, but the evidence
    comes from different regions and notices, and the passage does not prove one uniform
    cult.
- id: claim:2
  claim: The passage says harvest prayers and rhymes addressed to Wuotan in some districts
    are in other Low German districts transferred to a goddess, exemplified by Lady
    Gaue.
  claim_level: same_function
  target: Wuotan/Wode harvest prayers and Lady Gaue harvest rhyme
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is based on the author’s comparative statement; the passage
    supplies only one Lady Gaue example and does not reproduce the full Wuotan materials.
- id: claim:3
  claim: The footnote treats the slaves swallowed after Nerthus’s secret washing as
    comparable to other incidents in which servants employed in secret work are killed.
  claim_level: same_motif
  target: Servants killed after secret work, including examples named for Alaric’s
    funeral and hidden treasure
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is brief and note-like; the passage does not give the
    full narratives of the other examples.
