  - ev:5
  confidence: medium
  cautions: The text does not explicitly call the slaves’ death a sacrifice; the taxonomy
    reference is therefore approximate.
- id: motif:5
  label: Harvest remnant offering or address to a field goddess
  taxonomy_refs:
