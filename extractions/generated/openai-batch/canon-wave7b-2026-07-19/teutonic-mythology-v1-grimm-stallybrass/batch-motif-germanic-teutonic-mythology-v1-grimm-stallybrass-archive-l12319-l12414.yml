    continuous traditional account.
- id: motif:2
  label: Seasonal procession of a veiled or covered fertility deity
  taxonomy_refs:
  - seasonal_cycle
  basis: Nerthus rides in a covered vehicle and brings festive peace; Freyr’s curtained
    car goes around Sweden in spring with prayers and feasts; Wuotan and Donar appear
