- id: motif:3
  label: Ritual peace and suspension of weapons during divine visitation
  taxonomy_refs: []
  basis: During Nerthus’s visitation, war is not begun, weapons are not taken up,
    iron is shut away, and peace and quiet are known and loved.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No available taxonomy reference directly names this peace-truce pattern.
- id: motif:4
  label: Secret purification of divine objects followed by death of attendants
  taxonomy_refs:
