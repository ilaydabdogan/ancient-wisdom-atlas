canonical_text:
  quote: ''
  summary: 'Grimm discusses Germanic earth-goddess names and relationships, especially
    Iorð and Rindr, then quotes Tacitus on Nerthus as Terra Mater: a goddess conveyed
    in a covered vehicle, accompanied by a priest, bringing festive peace, and afterward
    washed in a secluded lake where the attending slaves are swallowed. The passage
    then compares this to Freyr’s spring car procession, Wotan and Donar in wains
    invoked for crops and rain, and a Low German harvest custom addressed to Lady
    Gaue.'
  language: English with Latin quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes impersonal Germanic words for soil, dust, field,
    or earth from cases where earth appears as a personified divine figure.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Iorð is described as wife and daughter of Odin and as mother of Thor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rindr, called Rinda in Saxo, is described as another wife of Odin and mother
    of Vali; her name is linked to bark, rind, or crust of the soil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tacitus is cited as saying that named Germanic peoples worship Nerthus, identified
    as Terra Mater, and believe she intervenes in human affairs and rides among peoples.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Nerthus account, a sacred grove on an ocean island contains a dedicated
    covered vehicle that only one priest may touch.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The priest perceives the goddess present in her inner sanctuary and accompanies
    her with veneration while she is carried in a vehicle drawn by female cattle.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the goddess’s presence, the days are joyful, places are festive, war
    is not begun, weapons are not taken up, iron is shut away, and peace and quiet
    are known and loved.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After the goddess has had enough intercourse with mortals, the same priest
    returns her to the temple.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The vehicle, garments, and allegedly the divine presence itself are washed
    in a secluded lake.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Slaves assist at the secret washing and are immediately swallowed by the same
    lake.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:11
  text: A footnote compares the swallowed slaves with other cases where servants employed
    in secret work are put to death.
  category: other
  evidence_refs:
