canonical_text:
  quote: ''
  summary: The passage argues that Phol and Balder in the Merseberg spell may designate
    the same divine being, then discusses Eddic Forseti, son of Baldr and Nanna, as
    a wise judge dwelling in the shining hall Glitnir. It compares Forseti with the
    Frisian god Fosite and cites Alcuin's account of Fositesland, an island with Fosite's
    shrines, protected by strong pagan veneration and taboos concerning animals, objects,
    and spring water. A footnote mentions place-name evidence and local attributions
    of the whirlwind to the devil, Herodias, or Pfol.
  language: English with quoted Latin
  quote_policy: summarized
