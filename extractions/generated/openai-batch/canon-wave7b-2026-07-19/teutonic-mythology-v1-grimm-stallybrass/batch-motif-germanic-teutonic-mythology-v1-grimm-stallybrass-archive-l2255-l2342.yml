canonical_text:
  quote: ''
  summary: 'The passage surveys Germanic sacrificial practices: midwinter and Upsal
    blots for long life, prosperity, peace, victory, and good winter; Gutalagh accounts
    of national and smaller offerings at sacred places; later fire customs and a Gothland
    sacrificial play interpreted as survivals of sacrifice; Saxon harvest-feast traditions;
    occasional sacrifices in famine, disease, or for favor; and testimonies for human
    sacrifice among Germanic and Gothic peoples.'
  language: English with Old Norse/Gutnish, Latin, and Greek citations
  quote_policy: summarized
