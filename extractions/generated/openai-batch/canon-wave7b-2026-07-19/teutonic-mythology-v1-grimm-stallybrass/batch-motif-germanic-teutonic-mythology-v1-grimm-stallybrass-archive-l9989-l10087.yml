canonical_text:
  quote: ''
  summary: The passage discusses the runic and place-name evidence for Ear/Eor/Er
    as a divine name related to Tyr/Tiw/Zio. It links Eresburg and Ertag with the
    god, compares Zio with Zeus and Eor with Ares, rejects an Earth derivation for
    Ertag, and cites an Anglo-Saxon rune poem in which Ear is associated with death
    and the loss of earthly joys.
  language: English
  quote_policy: summarized
