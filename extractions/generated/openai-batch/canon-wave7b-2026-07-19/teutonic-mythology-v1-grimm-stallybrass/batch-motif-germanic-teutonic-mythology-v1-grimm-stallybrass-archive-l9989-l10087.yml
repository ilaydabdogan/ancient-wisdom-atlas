    no weekday is named for earth.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage mentions Eersel as a place-name and Ertac and Erdag as men's names
    connected with the god or weekday name under discussion.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The author compares Zio with Zeus as director of wars, Eor/Er/Ear with Ares,
