- id: obs:1
  text: The passage states that Anglo-Saxon and Old High German alphabets distinguish
    names such as Tir/Tyr/Tiw/Zio and Ear/Eor/Eo/Er, while also presenting Tir and
    Ear as two names for one god.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Low German evidence is said to include the Anglo-Saxon rune Ear and the Westphalian
    place-name Eresburg/Aereshurg, described as a notable seat of pagan worship near
    the Irmansul.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Eresburg is connected in the passage with Latin mons Martis and with forms
    interpreted as Eresberc, Ziesberc, Sig-tiwes-berg, and Mars' hill.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: High German evidence is said to include weekday names such as Ertag, Irtag,
    Eritag, and Erchtag for the third day of the week, contrasted with Ziestag in
    Swabian and Swiss usage.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author infers that a former boundary between Eor-worship and Zio-worship
