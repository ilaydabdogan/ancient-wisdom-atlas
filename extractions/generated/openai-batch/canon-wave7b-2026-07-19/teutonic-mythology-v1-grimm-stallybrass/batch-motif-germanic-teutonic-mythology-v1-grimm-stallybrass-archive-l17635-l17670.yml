canonical_text:
  quote: ''
  summary: 'Grimm discusses Norse traditions that he says refer to an earthly hero-path.
    He describes the Old Swedish Eriksgata, a customary royal journey in which a new
    king traveled the great highway across the country and confirmed popular privileges.
    He notes that historical kings named Erik do not explain the custom, and infers
    an early association of the royal name Erik with a god or deified king. He then
    cites the Vita Anskarii: when Christianity was proposed to King Olef around 860,
    a heathen man claimed to have been sent from the assembly of the gods who possessed
    the land. The reported divine message says the gods had long helped the people
    hold the land in prosperity in return for sacrifices and vows, but now objected
    to neglected offerings and the introduction of an alien god, demanding renewed
    sacrifices and rejection of that other cult. Footnotes add later attestations
    of the Eriksgata and distinguish individual vows from public sacrifices.'
  language: English with Latin quotation
  quote_policy: summarized
