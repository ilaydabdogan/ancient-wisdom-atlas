canonical_text:
  quote: ''
  summary: 'The passage surveys Germanic sacrificial practice as described by Grimm:
    sacrificial food was eaten by priests, people, and sometimes private offerers;
    selected animal parts could be assigned to gods and game remains hung on trees;
    whole burnt offerings and incense offerings are treated as not native to the described
    practice. It then discusses fruit, flower, milk, honey, grain, bough, garland,
    tree, cave-water, and mayflower customs as offerings or survivals in household,
    harvest, land-transfer, annual festival, and rent contexts.'
  language: English
  quote_policy: summarized
