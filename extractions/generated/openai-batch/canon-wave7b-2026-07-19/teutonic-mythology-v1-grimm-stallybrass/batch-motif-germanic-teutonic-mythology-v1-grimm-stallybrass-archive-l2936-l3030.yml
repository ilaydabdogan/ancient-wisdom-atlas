  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In Holstein, five or six apples are left on each tree at fruit-gathering so
    that the next crop will thrive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At a formal transfer of land, leafy boughs, apples, or nuts are used as earnest
    of the bargain.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage groups the crowning of a divine image, sacred tree, or sacrificed
    animal with foliage or flowers under fruit-offerings, while noting no trace of
    this in Norse sagas or the oldest documents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: On Ascension day in parts of Germany, girls twine garlands of white and red
    flowers and hang them in the dwelling-room or over cattle in the stable until
    replaced the next year.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: At Questenberg in the Harz, lads carry an oak to a castle-hill at Whitsuntide,
    set it upright, fasten a large plaited branch garland to it, shout that the garland
    hangs, dance around the tree, and renew both tree and garland yearly.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the Hollow Stone near the Meisner mountain, youths and maidens carry nosegays
