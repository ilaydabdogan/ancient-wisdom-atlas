  summary: The passage surveys glosses, heroic poems, and saga material concerning
    Iring/Iringes weg and related names. It connects textual attestations of Iring's
    way with heroic figures in the Nibelungenlied, a saga memory of Iring at a wall,
    and Grimm's broader comparison of earthly and heavenly roads, ways, and wains
    associated with pagan god-myths and with Iring or Irmin.
  language: English
