canonical_text:
  quote: ''
  summary: The passage discusses food, drink, youth, age, and power among gods. It
    compares the wine of Norse gods with Greek nectar, describes the OShroeris/Odhroerir
    drink made from Qvasir's blood and honey and associated with poetry and immortality,
    and notes that dwarfs and giants possess it before the gods. It says Qvasir was
    formed from the spittle of the Aesir and Vanir during a covenant. It also describes
    ISunn's apples, which aging gods eat to become young again, while still noting
    that gods are subject to age and growth. The passage closes with terms and Homeric
    examples for divine power expressed as ease of action.
  language: English
  quote_policy: summarized
