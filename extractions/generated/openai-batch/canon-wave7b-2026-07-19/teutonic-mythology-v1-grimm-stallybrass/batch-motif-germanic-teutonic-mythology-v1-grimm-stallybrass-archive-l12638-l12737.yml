canonical_text:
  quote: ''
  summary: 'The passage discusses several goddess names attested in inscriptions or
    classical testimony: Hludana/Hliodana, Tanfana/Tamfana, Nehalennia, and Tacitus''s
    Germanic Isis. It emphasizes uncertainty around some names, compares Hludana with
    a Norse divinity, and treats the Suebian Isis report in connection with ship-shaped
    cult symbols, the Roman navigium Isidis, and a later medieval wheeled-ship procession.'
  language: English with Latin quotations
  quote_policy: summarized
