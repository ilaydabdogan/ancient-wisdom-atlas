  quote: ''
  summary: 'The passage surveys ancient and medieval reports of Germanic women, priestesses,
    and prophetesses: women as counselors and diviners before battle, named prophetesses
    such as Veleda, Aurinia, Ganna, a pythoness-like woman, and Thiota, comparisons
    with Cassandra, British druidesses, and the Völuspá, and a description of Cimbrian
    priestesses slaughtering prisoners and prophesying.'
