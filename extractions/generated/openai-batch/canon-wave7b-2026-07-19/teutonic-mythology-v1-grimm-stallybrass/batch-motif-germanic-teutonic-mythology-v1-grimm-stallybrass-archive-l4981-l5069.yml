  summary: The passage gathers late antique and medieval Christian, legal, and narrative
    notices about Germanic practices at trees, fountains, groves, waters, stones,
    fire, sun, and moon. It argues that such notices show surviving or debased rites
    but do not prove the absence of gods in Germanic heathenism; it also notes Christian
    suppression, demonizing terminology, survival of divine names in conjuring formulas,
    and Tacitus's earlier report of gods, sacred groves, priests, and divination.
  language: English with cited Latin, Old English, and Old Norse terms
