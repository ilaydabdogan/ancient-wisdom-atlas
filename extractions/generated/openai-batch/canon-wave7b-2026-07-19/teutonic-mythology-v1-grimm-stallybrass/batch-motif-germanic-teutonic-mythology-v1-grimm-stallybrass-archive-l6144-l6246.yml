canonical_text:
  quote: ''
  summary: The passage surveys weekday names in several Germanic languages and dialects,
    noting names derived from deities or celestial bodies, contact with Graeco-Slavic
    numerical weekday terms, possible Latin Saturn influence on seventh-day names,
    the Scandinavian seventh day as bath-day, and a possible relation between the
    seven-day week and lunar phases.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A numerical name for the fifth day entered some Upper German districts through
    Graeco-Slavic influences; related Slavic forms are said to mean Friday.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The New High German sequence is listed as Sunday, Monday, Tuesday, Wednesday,
    Thursday, Friday, and Saturday or Sunday-evening.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Old Saxon weekday names are said to be missing, but the author infers Wodanes
    dag for the fourth day and probable Tiwesdag, Thunaresdag, and Friundag for the
    third, fifth, and sixth days.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Middle and New Dutch forms include Tis-/Disen- forms for the third day, Woens-/Goens-
    forms for the fourth, Donres-/Donder- forms for the fifth, Vri- forms for the
    sixth, and Sater-/Zater- forms for the seventh.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:5
  text: Old, New, and North Frisian forms are listed for the seven weekdays, including
    Tys-/Tirs- third-day forms, Werns-/Wins- fourth-day forms, Thunres-/Tongers-/Turs-
    fifth-day forms, Frig-/Fre- sixth-day forms, and Saterdei or Sunday-evening forms
    for the seventh day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: The Anglo-Saxon list gives first- and second-day names from Sun and Moon,
    followed by forms associated with Tiw, Woden, Thunor, Frige, and Sæter/Sæternes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: Old Norse, Swedish, and Danish lists include Tyr/Tis/Tirs, Odin/Ons, Thor/Tors,
    and Friday forms, while the seventh-day forms are Scandinavian variants such as
    laugardagr, lördag, and loverdag.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:8
  text: The passage states that only the seventh-day Scandinavian names depart from
    the Saxon, Frisian, and Dutch pattern, and explains Old Norse laugardagr as bath-day
    because people bathed at the end of the week.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:9
  text: A Latin poem on the battle of Fontenay is cited with the phrase Saturni dolium,
    followed by the author’s question about a devil’s bath and a translator’s note
    comparing German Blutbad, blood-bath.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The author states that Germans may have known the seven-day week from the
    four phases of lunar change and then discusses words for week/change such as Latin
    vicis and Gothic viko.
  category: relationship
  evidence_refs:
  - ev:10
