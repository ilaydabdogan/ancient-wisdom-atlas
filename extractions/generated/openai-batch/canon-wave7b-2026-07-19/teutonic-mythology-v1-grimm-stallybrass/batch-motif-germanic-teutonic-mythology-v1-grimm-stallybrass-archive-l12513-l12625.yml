canonical_text:
  quote: ''
  summary: 'The passage compares several earth or mother goddesses and related rites:
    Roman Mater deorum/Cybele is washed in the Almo stream in connection with a cart
    procession; Nerthus is said to travel through the country and then be bathed in
    a sacred lake in her wagon; Bhavani is described as similarly processed and bathed.
    The passage discusses Nerthus’s island and a Rügen black-lake legend, then turns
    to the earth-goddess names Fiorgyn and Hlodyn, Hlodyn as Thor’s mother and protectress
    of the hearth, and the Roman Fornax as a goddess of earth and fire.'
  language: English with Latin and Old Norse citations
  quote_policy: summarized
