canonical_text:
  quote: ''
  summary: 'The passage discusses Germanic terms for female beings: OHG itis, OS ides,
    AS ides, and ON dis/disir. It states that these terms can denote women generally
    but are also applied to superhuman female beings occupying a rank between goddesses
    and earthly women. The passage connects the Cheruscan place-name Idisiaviso with
    a meadow of such women and describes the Merseburg poem’s idisi as acting in battle
    by checking, hindering, and grasping at chains, withs, or wreaths. It compares
    these beings with Norse valkyr names associated with binding armies, and says
    they could both hinder and help. It then identifies the Norse disir with the same
    class of beings, describing them as sometimes protective, sometimes hostile, sometimes
    prophetic, worshipped with sacrifice, and in some cases connected with ghosts
    or dead women whose appearance portends something.'
  language: English, with cited Old High German, Old Saxon, Old English, Old Norse,
    Greek, and Latin terms
  quote_policy: summarized
