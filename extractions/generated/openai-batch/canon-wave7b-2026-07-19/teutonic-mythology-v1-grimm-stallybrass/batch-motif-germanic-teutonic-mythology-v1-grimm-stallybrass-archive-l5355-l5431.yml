  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Ratpert account places a related event at Tuggen near Lake Zurich, where
    people still sacrificed to idols, Gallus broke and submerged the idols in a nearby
    lake, and the people became angry and expelled the saints.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Brigantium, the saints found a temple formerly dedicated to Christianity
    but later polluted by demon images; they cleansed and consecrated it, removed
    statues, and placed St. Aurelia's relics there.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The author says Woden's statue may almost be inferred from Jonas's account
    of a beer-sacrifice offered to Woden.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: Ratpert's verse says the people leave a burning Jove; the author comments
