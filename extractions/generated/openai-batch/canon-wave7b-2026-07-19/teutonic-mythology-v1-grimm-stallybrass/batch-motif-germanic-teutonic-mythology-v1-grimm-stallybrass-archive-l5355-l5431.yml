canonical_text:
  quote: ''
  summary: The passage discusses accounts of Gallus and companions confronting heathen
    cult images in formerly or partly Christian settings near Lake Constance and Lake
    Zurich. It describes three statues worshipped as tutelary deities in an oratory
    of St. Aurelia, Gallus breaking images and throwing them into a lake, some conversions,
    a parallel or conflated account at Tuggen where idol-breaking provokes anger,
    and a restoration of a polluted Christian temple by replacing expelled statues
    with St. Aurelia's relics. The author also debates whether the deities were Alamannish/Germanic
    or Roman and cautiously compares names such as Woden, Jupiter/Jove, Donar, Mercury,
    and Neptune.
  language: English with Latin quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Latin account says Gallus, by order of Columbanus, taught the people, seized
    images before everyone, broke them into fragments with stones, and threw them
    into a lake; some people then converted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An oratory built in honor of St. Aurelia is described as containing three
    heathen statues against the wall.
  category: setting
  evidence_refs:
