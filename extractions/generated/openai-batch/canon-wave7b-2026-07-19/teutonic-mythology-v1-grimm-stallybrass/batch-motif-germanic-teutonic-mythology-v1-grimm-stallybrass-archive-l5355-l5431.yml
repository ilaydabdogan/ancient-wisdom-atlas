- id: obs:3
  text: The people continued to sacrifice to the three statues and did not approach
    the Christian altar; the statues were regarded as old tutelary deities.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the evangelist broke the images and threw them into Lake Constance,
    part of the heathen population turned to Christianity.
  category: sequence
  evidence_refs:
  - ev:2
