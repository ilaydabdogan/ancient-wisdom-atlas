canonical_text:
  quote: ''
  summary: 'The passage surveys Germanic sacrificial and processional customs: consecrated
    beer cauldrons and kettles, baked cakes or effigies shaped as divine or animal
    figures, rites involving anointing or punishing effigies, boar-related observances,
    minne-drinking, and the carrying of divine images or sacred objects around lands,
    fields, roads, and homes. It also compares post-conversion Christian image processions
    and field lustrations with older heathen processional practices.'
  language: English with Old Norse, Greek, and Latin citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Suevic cup filled with beer is described as a hallowed sacrificial cauldron,
    and the passage places it beside Cimbrian, Scythian, and Old Norse cauldron traditions.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Old Norse and Anglo-Saxon proper names point to kettles
    consecrated to the æsir and to Thor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author says later drinking usages and shapes of baked meeds may preserve
    ancient idol forms or sacrificial observances.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Indiculus is cited for flour simulacra, and baked animal figures are said
    to have represented revered animals or attributes of a god.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Fridthiofssaga example, women at a disa blot sit by the fire, bake
    gods, and anoint them with cloths.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A baked Baldr falls into the fire, the fat blazes up, and the house burns
    down.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A straw figure is placed before the hearth; if it brings a fine bright day
    it is anointed with butter, otherwise it is kicked from the hearth, smeared with
    dirt, and thrown into water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage treats animal color, leading the boar round, flowers, minne-drinking,
    and cake shapes as reminiscences of heathen sacrifices.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage identifies solemn carrying-about of divine images as an essential
    feature of heathen cultus, intended to let the divinity bestow its presence across
    the land.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Examples of processional divine or sacred movement include Nerthus riding
    in state, Berecynthia, Fro traveling out in spring, the sacred ship and sacred
    plough carried round, and an unknown Gothic god riding in a wagon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Fetching-in Summer or May, carrying-out Winter and Death, circuits of Holda
    and Berhta, and the march of Wuotan's host are grouped with the same processional
    idea.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: After Fro ceased to appear, the passage says Dietrich with the boar, Dietrich
    Bern, the atonement-boar, and the boar led round benches remained in related appearances
    or observances.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Public legal observances named in the passage include a newly elected king's
    progress along highways, road lustration, and beating bounds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: After conversion, church processions carried Madonna and saints' images in
    response to drought, bad crops, pestilence, war, and fire, seeking rain, fertility,
    healing, victory, or help against fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The Indiculus is cited for images carried through fields, and the Vita Marcsvidis
    passage describes an annual Pentecost circuit carrying a church patron, lustrating
    homes, collecting alms, keeping vigil, and expecting better seed growth and cessation
    of bad weather.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: A note states that boar-shaped baking was not confined to the North and mentions
    New Year's cochelins in France.
  category: relationship
  evidence_refs:
  - ev:9
