canonical_text:
  quote: ''
  summary: The passage compares Berchta or Perchtha with Holda, Holle, Werre, Herke,
    Freke, and related figures. It describes their seasonal rounds during the Twelve
    Nights, their oversight of spinning, prescribed end-of-year foods, punishments
    for omitted food or unfinished spinning, and an Oppurg tale in which a girl deceives
    Perchtha by making empty reels appear full.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author says the bad meaning predominates in stories of Berchta, while
    the good meaning predominates in those of Holda, and that a popular Christian
    view had degraded Berchta lower than Holda.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that Berchta, Holda, Herke, Freke, and related figures go
    their rounds at the same time, in the so-called twelfths between Christmas and
    New-year.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Berchta is described as having oversight of spinners like Holda and spoiling
    spinning left unfinished on the last day of the year.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Berchta’s festival is associated with traditional food, including gruel and
    fish; related examples mention herrings and oats, fish and oat-grits, and dumplings
    and herrings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Berchta misses the expected fish and dumplings, she is said to cut open
    the belly of a person who ate other food, fill it with chopped straw, and sew
    it with a ploughshare and iron chain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Voigtland account of the Werre or dame Holle says that on the holy eve of
    the high New-year she inquires whether distaffs are spun off, defiles flax if
    they are not, and rips open the body of someone who omits the required pulse dish.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Orlagau tales, Perchtha examines spinning-rooms on the night before Twelfthday,
    brings empty reels to be filled quickly, and punishes unmet demands by tangling
    and befouling flax.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Orlagau account says Perchtha cuts open the body of someone who has not
    eaten zemmali, removes other food, fills the space with hay or straw wisps and
    bricks, and sews the body with a ploughshare and chain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: At Oppurg, Perchtha is said to find a spinning-room full of merrymaking guests,
    hand in twelve empty reels through the window, and demand that they be spun full
    within an hour.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the Oppurg tale, a girl wraps tow around the empty reels and covers it
    with thread so that the reels look full; Perchtha accepts the work and leaves
    shaking her head.
  category: action
  evidence_refs:
  - ev:6
