- id: motif:2
  label: Second arrow reserved for revenge
  taxonomy_refs: []
  basis: The Wewelsflet painting shows a second arrow, and the Upper Rhine account
    explicitly explains the reserved arrow as intended to kill the coercing noble
    if the child were killed; Eindridi also declares readiness to avenge injury.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
  confidence: high
  cautions: The revenge-arrow detail is explicit in the Upper Rhine account and visual
    in the Hemming Wolf painting; the Tell passage only mentions a courageous speech
    without giving its contents.
