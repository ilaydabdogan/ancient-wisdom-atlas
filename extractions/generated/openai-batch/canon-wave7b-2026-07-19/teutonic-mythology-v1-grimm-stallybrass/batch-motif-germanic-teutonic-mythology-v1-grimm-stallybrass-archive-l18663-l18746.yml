comparison_claims:
- id: claim:1
  claim: The passage presents the Toki, Eindridi, Hemingr, Hemming Wolf, Tell, Puncher/Pimchero,
    and William of Cloudesle stories as variants of the same archer master-shot pattern,
    centered on shooting an object from a child’s head and sometimes adding a revenge-arrow
    speech.
  claim_level: same_motif
  target: Germanic, Norse, Swiss, Upper Rhine, and Northumbrian archer master-shot
    narratives
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  counter_evidence_refs:
  - ev:1
  confidence: high
  limitations: The passage itself notes that some Icelandic accounts do not include
    the bow-shot; the claim reflects the author’s comparative presentation and does
    not by itself establish historical contact.
- id: claim:2
  claim: The passage explicitly treats the Tell story as having a mythic substratum
    comparable to a preceding Upper Rhine version in which a marksman shoots a coin
    from his son’s cap and reserves a second arrow for revenge.
  claim_level: same_motif
  target: Wilhelm Tell fable compared with the Upper Rhine Puncher/Pimchero legend
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The Tell details are summarized briefly here, and the passage notes
    late chronicler evidence for Tell.
- id: claim:3
  claim: The passage proposes that the apple-shot element attached to Toki’s story
    derives from an older tradition already present in the 10th–11th centuries and
    later appearing widely across related narratives.
  claim_level: common_inheritance
  target: Older Germanic archer apple-shot tradition behind later localized versions
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  counter_evidence_refs:
