canonical_text:
  quote: ''
  summary: The passage surveys a recurring archer tale attached to Toki, Eindridi,
    Hemingr, Hemming Wolf, Wilhelm Tell, an Upper Rhine figure called Puncher/Pimchero,
    William of Cloudesle, and Aegel. It emphasizes variants in which a marksman is
    ordered or offers to shoot a small object from a boy’s head, sometimes keeping
    a second arrow for revenge if the child is harmed. The author distinguishes some
    historical elements from what he treats as mythical or legendary accretion.
  language: English; includes a Latin quoted source passage
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Icelandic accounts of Palnatoki relate his deeds but not
    the bow-shot, while agreeing with Saxo that Harald dies by Toki’s shaft.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Harald’s death by a marksman is historical, while
    the shot at the apple is mythical and attached to the narrative from an older
    tradition.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Olaf narrative, Olaf attempts to convert the heathen Eindridi and tests
    him in swimming and shooting.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Olaf requires Eindridi’s boy to be placed at the target so that a writing-tablet
    may be shot from his head without hurting him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eindridi says he is willing to attempt the shot but is also ready to avenge
    any injury; after Olaf narrowly misses the tablet, Eindridi refuses to continue
    at his mother’s and sister’s request.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Haraldr Sigurdarson tests the archer Hemingr by ordering him to shoot a hazelnut
    from Biorn’s head, and Hemingr succeeds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Holstein tale transfers the legend to Hemming Wolf, and an old Wewelsflet
    church painting shows an archer, a distant boy with an apple on his head, an arrow
    through the apple, a second arrow between the archer’s teeth, and a wolf standing
    between them.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says Wilhelm Tell, compelled by Gessler, achieved the same old
    master-shot and made a courageous speech, while also noting that chronicler evidence
    begins late and that the event is unhistorical.
  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the Upper Rhine legend, a noble places the marksman’s small son at the
    target with a coin on his cap and orders the coin to be removed by an arrow without
    dislodging the cap.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the same Upper Rhine legend, the marksman places one arrow at his collar
    and shoots the coin from the boy’s cap with another; when asked about the reserved
    arrow, he says he would have shot the noble if his son had been killed.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Northumbrian ballad, William of Cloudesle offers in the king’s presence
    to set an apple on his seven-year-old son’s head and shoot it from 120 paces;
    the arrow cleaves the apple.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage suggests that Aegel’s skill in archery would have been known to
    the Anglo-Saxons and says the whole myth shows signs of deep and wide extension.
  category: other
  evidence_refs:
  - ev:9
