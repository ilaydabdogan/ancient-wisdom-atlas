  summary: 'The passage surveys fragmentary evidence for Germanic and Norse priesthoods:
    named or collective priests, possible public ritual functions, sacrificial head
    covering, restrictions on weapons and mounts, continuity and confusion of rites
    during Christianization, and Snorri''s representation of the twelve principal
    Ases as sacrificial priests who advise on sacrifices and judgments.'
