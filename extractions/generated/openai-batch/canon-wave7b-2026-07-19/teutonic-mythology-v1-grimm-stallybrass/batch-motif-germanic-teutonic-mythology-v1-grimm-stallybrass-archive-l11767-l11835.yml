canonical_text:
  quote: ''
  summary: The passage discusses self-acting ale and divine implements, then examines
    names and identities connected with Oegir/Hler and related Germanic sea terms.
    It presents Oegir as a sea figure with nine daughters by Ran whose names apply
    to waters and waves, compares this genealogy with Greek Okeanos, interprets the
    Eider/Oegisdyr as an ocean-door or sea-outlet, and considers Fifel, Geofon/Gelan/Gefjun,
    and Hler as related or synonymous sea-divine names.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At a feast given to the gods, the ale is said to have come up of itself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage lists other self-acting mythic objects: Hephaistus''s tripods,
    Freyr''s sword that swings itself, and Thor''s Mjolnir returning of itself after
    being thrown.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The author reconstructs an Old High German name Aki or Uohi and cautiously
    connects it with Ecke, described as a giant in heroic legend.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Greek Okeanos has rivers as sons and daughters, while
    Norse Oegir has nine daughters by Ran whose names are applied to waters and waves.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Eider river is described as dividing Saxons from Northmen and is linked
    with forms such as Egidora, Agadora, Egdora, and Oegisdyr; Oegisdyr is glossed
    as ocean's door or sea-outlet.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Old English forms such as Fifelstream and Fifelwæg are said to mean the ocean,
    and Fifelcynnes eard is explained as the land of ocean-sprites; the author supposes
    Fifel may be another obsolete name of Oegir.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage groups AS Geofon, OS Gelan or Gehan, and ON Gefjun; Gefjun is
    said to be counted among the Asynior and to have borne sons to a giant, while
    Saxon Gehan is called a god.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'In the northern genealogy cited, Forniotr has three sons: Hler, whom the
    passage says is called Oegir, Logi, and Kari.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hler is presented as an older name for Oegir, and Oegir's dwelling-place is
    said to have been named Hlesey, now Laesoe in the Cattegat.
  category: setting
  evidence_refs:
  - ev:7
