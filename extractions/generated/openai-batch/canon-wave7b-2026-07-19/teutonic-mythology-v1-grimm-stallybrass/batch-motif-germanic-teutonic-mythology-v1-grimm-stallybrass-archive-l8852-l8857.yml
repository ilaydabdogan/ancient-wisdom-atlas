  summary: 'The passage summarizes Uhland''s interpretation of ON myths in his essay
    on Thorr: the conflict between a summer-god and winter-giants signifies bringing
    land under cultivation, and the rock-splitting force of the thunderbolt prepares
    hard stony soil. The interpretation is said to fit the Hrungnir and Orvandill
    sagas especially well, and some other cases less well.'
