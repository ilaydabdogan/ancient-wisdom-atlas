canonical_text:
  quote: ''
  summary: The passage discusses early Germanic divine images and cult symbols. It
    argues that full statues and temples are not clearly attested for the earliest
    period known to Roman observers, but carved or colored signs and forms were used
    as symbolic worship objects. Examples include a boat model, boar forms, animal
    images, and a covered vehicle of the Earth goddess. The passage also treats later
    image-making, ambiguous terminology for idols, temples, and divine powers, and
    reports of Saxon idol cults and visible representations of gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Roman observers would likely have noticed real statues in
    the parts of Germany known to them; instead the account is described as knowing
    only signs and forms, apparently carved and colored, used in worship as symbols
    and sometimes carried about.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A model boat is identified as a sign that betokened a god of sailing.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Boar forms are said to betoken the god to whom the boar was consecrated, and
    animal images on trees and at sacrifices are mentioned in the same discussion.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A vehicle covered with a cloth is associated with the goddess Earth and reserved
    for later discussion.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage presents the absence of statues and temples as a feature of early
    German cultus, while stating that this does not mean the gods were imagined without
    human-like form.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says attempts to fashion images of gods could have occurred at
    any period through carving, drawing, painting, or baking dough; it also says less
    accessible interior areas might have contained temples, statues, and pictures,
    and later centuries likely had images in temples.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that cult terminology can shift between meanings such as
    temple, image, rock or stone, altar, statue, false god, and shrine.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says general Latin phrases about worshipping, adoring, or destroying
    idols do not always prove that physical images are meant, since similar phrases
    can apply to shrines; cited Old High German glosses mix terms for shrines, statues,
    altars, and groves.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Reported sources concerning Saxons are summarized as saying that heathen or
    ancient Saxons served many false gods, idol cults, numina, vows, sacrifices, and
    simulacra considered gods; the passage concludes that statues are meant in the
    Lebuin material.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: A Bede passage is cited in which King Eadwine thanks his gods for the birth
    of a daughter; the passage then says subsequent materials testify to visible divine
    representations without describing them.
  category: speech
  evidence_refs:
  - ev:9
