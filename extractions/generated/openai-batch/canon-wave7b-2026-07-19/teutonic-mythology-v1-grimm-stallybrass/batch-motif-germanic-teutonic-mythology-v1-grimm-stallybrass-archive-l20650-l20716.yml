canonical_text:
  quote: ''
  summary: The passage discusses the taking of souls at death by OSinn, Freyja, or
    valkyrs; compares this with Christian angel-devil contests for souls; describes
    valkyrs as warlike riders, often nine together, with shining weapons; distinguishes
    norns, who pronounce fate and fasten threads, from valkyrs, who ride to war, decide
    battle, and conduct the fallen to heaven; and notes Skuld, Hlock, and Herfiotr
    as figures linking or comparing these categories.
  language: English with Old Norse and Latin terms
  quote_policy: summarized
