canonical_text:
  quote: ''
  summary: The passage surveys Germanic and Norse accounts of swan-maidens, swan-wives,
    prophetic bird-women, and related tales in which women possess swan-shifts, wings,
    rings, or garments that allow transformation or give others power over them. It
    compares examples from the Volundarqviða, Hromundarsaga, Saxo, Norse folktales,
    Nibelungen material, and an Old High German Wielant poem.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the swan was considered a bird of augury.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Volundarqviða account, three women sit on the shore spinning flax with
    their swan-shifts beside them, so they can fly away as swans; one is called swanhvit
    and wears swan feathers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Hromundarsaga account, Kara appears as an enchantress in a swan-shift,
    hovers above the hero, and sings.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Kara's assistance enables Helgi to conquer until he swings
    his sword too high, cuts off his lover's foot, she falls, and his luck is spent.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Saxo's account, Fridlevus hears three swans sounding in the air at night;
    they prophesy and drop a girdle bearing runes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Brynhildr is compared to a swan on the wave, and the passage asserts that
    this simile indicates a power of changing into the bird.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: In one Norse tale, a young man sees three swans land on the shore, lay down
    their bird-shifts, become maidens, bathe, resume the shifts, and fly away as swans.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the same tale, the young man later steals the youngest maiden's garment,
    takes her home, marries her, and after seven years she regains the shift and flies
    away as a swan; the husband dies soon after.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that, in another tale, a swan-hero forsakes his wife when
    she asks a forbidden question.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the St. John's night field tale, a peasant's two eldest sons fall asleep
    after hearing a hurtling in the air, while the third son later watches and sees
    three maidens fly in, lay aside their wings, and dance in the field.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The third son hides the maidens' wings under a stone and says the other two
    may have their wings back if one maiden stays to be his wife.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: One of the maidens in the field tale offers her lover a drink of water from
    a golden pitcher.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage says that, in German tradition, swan-maidens lay the swan-ring
    or swan-shift on the bank while bathing, and whoever takes it has them in his
    power.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage identifies the Nibelungen prophetic merwomen whose garments Hagene
    took away as such beings, while noting that the epic names Hadburc and Sigelint
    and describes the garments as wonderful.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: In an Old High German poem, three doves fly to a fountain, become maidens
    when they touch the ground, and Wielant removes their clothes until one agrees
    to marry him.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:16
  text: The passage states that in other tales a shift, ring, or chain thrown over
    women turns them into swans, and that incomplete recovery of human shape can leave
    the hero with a swan-wing.
  category: sequence
  evidence_refs:
  - ev:12
