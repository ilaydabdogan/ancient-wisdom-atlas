comparison_claims:
- id: claim:1
  claim: 'The passage presents Norse folktales of swan-wives as continuing a pattern
    already visible in the Volundarqviða: bird-women lay aside swan-shifts or bird-shifts
    near water and can resume bird form.'
  claim_level: same_motif
  target: Volundarqviða swan-shift women and later Norse swan-wife tales
  evidence_refs:
  - ev:2
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives narrative parallels but does not establish a specific
    line of transmission.
- id: claim:2
  claim: The passage treats Kara's swan-shift episode as a related swan-maiden or
    bird-woman form with a distinct battle-helper function.
  claim_level: same_function
  target: Hromundarsaga Kara compared with the broader swan-maiden pattern
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: Kara's role is martial and airborne rather than a garment-theft marriage
    tale.
- id: claim:3
  claim: The passage cautiously identifies the Nibelungen prophetic merwomen, whose
    garments Hagene takes, with the swan-maiden pattern.
  claim_level: same_motif
  target: Nibelungen Hadburc and Sigelint / prophetic merwomen
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage itself notes that the swan-maiden identity is not expressly
    stated in the Nibelungen material.
- id: claim:4
  claim: The passage presents the Old High German Wielant poem as a variant of the
    Volundr myth, substituting doves for swans while retaining the transformation
    and withheld-clothing marriage pattern.
  claim_level: same_motif
  target: Old High German Wielant dove-maiden episode and Volundr swan-maiden myth
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is based on the passage's summary; no original Old High
    German text is supplied here.
- id: claim:5
  claim: The passage compares the maiden's offer of water from a golden pitcher with
    actions of elfins and wish-wives elsewhere in the same work.
  claim_level: same_function
  target: Elfins and wish-wives offering drink from a golden pitcher
  evidence_refs:
