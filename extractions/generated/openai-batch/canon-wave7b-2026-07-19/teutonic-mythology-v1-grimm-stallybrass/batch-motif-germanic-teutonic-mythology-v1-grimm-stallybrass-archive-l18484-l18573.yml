canonical_text:
  quote: ''
  summary: 'The passage surveys Germanic traditions around Wate/Wada and Wielant/Weland/Volundr:
    Wate’s boat traditions; Vadi carrying Wieland through the sea to dwarf smiths;
    Wieland as master smith, swan-maiden spouse, boat-builder, winged-flight artificer,
    and lame craftsman; later smith and place-name associations; and Grimm’s comparison
    of Wieland with Greek Hephaestus, Erichthonius, Daedalus, and Icarus.'
  language: English
  quote_policy: summarized
