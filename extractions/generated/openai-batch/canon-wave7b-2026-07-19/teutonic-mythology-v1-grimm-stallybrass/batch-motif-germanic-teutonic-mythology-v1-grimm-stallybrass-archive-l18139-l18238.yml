  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Siegfried is described as having evident superhuman traces, being raised by
    the elf Regino, beloved by the valkyr Brunhild, and instructed in destiny by the
    wise man Gripir.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Siegfried wears a helmet of invisibility, is vulnerable only on one spot of
