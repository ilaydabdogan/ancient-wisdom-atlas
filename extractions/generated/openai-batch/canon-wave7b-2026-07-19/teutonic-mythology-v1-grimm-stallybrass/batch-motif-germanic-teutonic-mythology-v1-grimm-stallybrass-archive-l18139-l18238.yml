canonical_text:
  quote: ''
  summary: The passage surveys Germanic heroic names and genealogies, including Burgundian,
    Welisung/Volsung, and Gothic Amal traditions. It presents Frau Vote as an ancestress,
    connects the Welisungs with divine figures and Wuotan, describes Siegfried as
    superhuman with an elf fosterer, valkyr beloved, wise instructor, invisibility
    helmet, single vulnerable spot, Nibelung hoard, and dragon-slaying. It explicitly
    compares Siegfried's vulnerable spot to Achilles, Fafnir/Python serpent-dragon
    traditions, and Sinfiotli's childhood snake-handling to infant Hercules tested
    by serpents.
  language: English
  quote_policy: summarized
