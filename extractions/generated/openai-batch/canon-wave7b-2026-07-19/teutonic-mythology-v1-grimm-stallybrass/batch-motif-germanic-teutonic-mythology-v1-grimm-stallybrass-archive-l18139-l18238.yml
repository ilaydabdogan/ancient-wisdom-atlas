- id: obs:3
  text: 'The passage contrasts Gislahari/Giselhere traditions: in the Lex Burgundionum
    he precedes Gundahari by a generation, while the Nibelungen epic makes him Gunther''s
    younger brother and the Edda does not name him.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hagano is described as one-eyed and as 'more than heroic.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Welisungs are linked by name to a divine Valis/Vali, and their line is
    said to proceed from Wuotan to Sigi, Sigimunt, Sigifrit, and Sintarfizilo.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Anglo-Saxon Beowulf calls Sigfrit Sigemund, and that
