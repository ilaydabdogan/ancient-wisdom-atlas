canonical_text:
  quote: ''
  summary: The passage discusses Loki in relation to Logi, fire, giants, gods, and
    later devil traditions. It distinguishes Logi as a natural force of fire and Loki
    as a shifted, sly, malevolent figure still counted among the Aesir. It compares
    Loki/Logi with Greek Prometheus and Hephaestus, notes motifs of limping, laughter,
    chaining, and net-making, describes Loki's association with Odin and Hoenir in
    creative triads, and records Scandinavian folk expressions connecting Loki or
    Locke with sun, fire, ignis fatuus, Sirius, crackling fire, harmful weeds, vapours,
    moulting birds, lies, and a giant's grave.
  language: English
  quote_policy: summarized
