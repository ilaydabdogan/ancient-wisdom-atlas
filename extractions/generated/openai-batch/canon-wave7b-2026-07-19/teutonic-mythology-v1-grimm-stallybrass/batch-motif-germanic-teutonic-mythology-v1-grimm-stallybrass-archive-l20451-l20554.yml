  summary: The passage links fays, fatae, norns, and idises with fate, vaticination,
    and battle. It cites Germanic women who used lots and divination to decide whether
    battle should be joined, then describes Odin and Freyja receiving the fallen,
    Valholl as Odin's abode for battle-dead, and valkyries as half-divine armed maidens
    sent by Odin to choose the slain. It also notes a fragment about three Marys/spinning
    female figures and several linguistic or comparative parallels for valkyries.
  language: English with embedded German, Latin, Old Norse, and Old English terms
  quote_policy: summarized
