  text: The passage asks whether the German thunder-god had he-goats and she-goats
    sacrificed to him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Roman or Etruscan bidental is described as a place where lightning killed
    a man; a lamb was sacrificed there to Jupiter, and the man's body was buried rather
    than burned.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Ossetes and Circassians are described as offering a goat over a body killed
    by lightning and raising the hide on a pole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that this makes it more likely that the Langobard goat-offering
    was intended for Donar, and says hanging up hides was a Langobard rite.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Carinthia, cattle struck by lightning are considered sacred to God, and
    no one is said to dare eat them.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The note says that the boar Sæhrímnir is boiled and eaten every day and becomes
    whole again every evening.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A cited account of witches says that consumed wine, bread, and an ox are restored
    when a mistress strikes vessels, a place, or the ox's bones and hide with a golden
    rod.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The passage says legends tell of a saint reanimating a cock from its bones
    after eating it, and folk-tales tell of a magician throwing fish bones into water
    so that the fish comes alive again.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage lists examples of reanimated dismembered persons, including the
