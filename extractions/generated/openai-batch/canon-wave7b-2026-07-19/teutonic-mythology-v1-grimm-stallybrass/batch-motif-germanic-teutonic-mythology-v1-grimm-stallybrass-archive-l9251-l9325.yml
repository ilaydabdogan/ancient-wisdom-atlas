  quote: ''
  summary: 'The passage discusses evidence connected with the Germanic thunder-god:
    animal offerings and taboos around lightning-struck bodies, raised hides, and
    place-names compounded with Donar/Thor. A long note compares several accounts
    in which consumed or dismembered animals and persons are restored from bones,
    limbs, or other remains.'
