    severed heads restored to trunks.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage lists German and Scandinavian place-names compounded with the
    thunder-god's name, including villages, ways, groves, fields, a mountain, a haven,
    a wood, a cape, and a bridge.
  category: setting
  evidence_refs:
  - ev:7
