canonical_text:
  quote: ''
  summary: The passage discusses Wodan/Odin through philological associations, divine
    kinship with Vili and Ve, old Saxon royal and heroic genealogies, Wodan's relation
    to figures such as Balder, Saxnot, Hermod, and Geat/Gautr, traditions of Othin's
    absence and replacement, foreign locations attributed to him, identification with
    Roman Mercury, and the idea that gods may be omnipresent and locally marked by
    Woden-hills.
  language: English
  quote_policy: summarized
