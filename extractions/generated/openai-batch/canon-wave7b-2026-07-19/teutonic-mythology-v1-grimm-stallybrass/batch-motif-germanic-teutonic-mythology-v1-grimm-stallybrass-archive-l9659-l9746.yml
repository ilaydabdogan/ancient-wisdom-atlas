  quote: the idea of the heavenly god, i.e., a personification of the sky.
  summary: The passage compares Indo-European divine names and related words, especially
    forms connected with Dyaus, Zeus, Jupiter, Tius/Zio/Tyr, tivar, and tir. It treats
    some names as expressions of a heavenly or sky god, discusses general words for
    divinity, describes Tuisco as an earthborn ancestral god under a proposed etymology,
    and links day/light and splendor/glory with divine naming and poetic vocabulary.
  language: English
  quote_policy: quoted
