canonical_text:
  quote: ''
  summary: 'The passage catalogs marks of heroic superhuman nature: wings or winged
    equipment enabling flight; shining eyes, golden teeth, stars or flames on the
    head; animal-like bodily peculiarities; a Meroving origin legend involving a sea
    monster and inherited bristles; intelligent named horses that converse with heroes;
    and a contrast between heroes who die young and heroes who live beyond ordinary
    human limits.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage says a swan wing, swan coat, winged shoes, or other wing-cover
    marks a supernatural quality shared by heroes and gods: the power of flying.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists visible heroic marks including shining eyes, golden teeth,
    sons born with a star on the forehead, a golden star falling on the forehead,
    and the Dioscuri having a star or flame on their heads and helmets.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says some heroic forms are disfigured by animal peculiarities,
    giving examples such as Siegfried's horny skin, scaly skin, and heroes with hedgehog
    spikes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the Meroving legend summarized here, Clodio and his queen go down to the
    shore; a monster from the waves seizes and overpowers the bathing queen; she bears
    a son of singular appearance named Merovig; and his descendants inherit the peculiarity.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports that Theophanes explained Meroving names by saying the
    kings of that house had bristles down the backbone like swine, and it quotes a
    similar statement from Roland material about heroes of Meres carrying bristles
    on their backs.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage identifies one principal mark of heroes as their possession of
    intelligent horses and their ability to converse with them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says heathendom regarded horses as sacred and divine, often endowing
    them with consciousness and sympathy with human destiny; heroic horses also have
    proper names.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Examples of hero-horse conversations are given from Achilles with Xanthos
    and Balios, Karling Bayard, Wilhelm or Begon with Baucent, Skirnir with his horse,
    Gudrun with Grani, Scandinavian songs about Black, Marko with Sharats, Liakos
    with his horse, Lithuanian dainos, and Persian Rustem's fairy steed.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The passage says some heroes are carried off in the bloom of life, such as
    Achilles and Siegfried, while others attain an age beyond the human limit.
  category: sequence
  evidence_refs:
  - ev:9
