canonical_text:
  quote: ''
  summary: The passage discusses the origin legend and animal-name etymologies of
    the Welfs, including dog, whelp, wolf, blindness, and exposed animals in genealogies.
    It then treats Dietrich as a divine hero, comparing him with Wuotan/Ero as leader
    of the wild host and with Donar/Thor through fiery breath and a retained object
    in the forehead. It concludes with philological notes on the Billings/Billungs
    and related names in heroic, dwarf, and divine contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that the Welf origin legend repeatedly contains names such
    as Isenhart, Irmenintul, Welf, and Etico, and interprets welf as a whelp or young
    dog rather than wolf.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Langobardic and Swabian genealogies play on exposed dogs
    and wolves, and connects the fable of the blind Schwaben and Hessen with lineage
    from blind Welfs.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Odoacer or Otacher is said to be called Sipicho or Bicki in some versions,
    and the passage identifies Bicki with a dog-related meaning.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ediulf is described in the passage as brother to Ermenrich, while Bicki is
    described in later sagas as counsellor to Iormunrekr.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says Siegfried eclipsed the Welisungs and Dietrich eclipsed the
    Amalungs, and that epic poetry sets them against one another as mighty and unconquered.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dietrich is described as having fiery breath and as taking the place of Wuotan
    or Ero at the head of the wild host under the names Dietrichbern or Bernhard.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Dietrich is said to be wounded in the forehead by an arrow, with a piece left
    inside him, and for that reason he is called deathless.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Thor is described as retaining part of Hrungnir's stone wedge in his head
    after Groa's magic cannot loosen it; similar stones are not to be aimed because
    they make the piece in Thor's forehead stir.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says the horn-like stone was probably represented in images and
    heightened their godlike appearance.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Billings or Billungs are described as a renowned race with no longer discoverable
    mythic roots, and the passage lists related names or figures including Billingr,
    Pillunc, Billunc, Nidunc, and the goddess Bil.
  category: other
  evidence_refs:
  - ev:7
