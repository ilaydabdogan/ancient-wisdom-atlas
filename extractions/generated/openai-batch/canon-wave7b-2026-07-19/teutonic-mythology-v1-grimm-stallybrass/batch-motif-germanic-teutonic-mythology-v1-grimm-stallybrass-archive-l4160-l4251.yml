  summary: The passage assembles Latin hagiographic and historical notices about heathen
    shrines, temples, images, offerings, sacred waters, and temple destruction or
    replacement in Germanic and neighboring regions. It includes accounts of Gallus
    burning shrines and sinking offerings, Columbanus and Agilus at Luxovium, Willibrord
    at Fositesland, Willehad and Ludger in Frisian contexts, a Mars shrine place-name,
    and Grimm's conclusion about Tanfana and later fana or temples as built sanctuaries.
  language: English with Latin citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some inhabitants are described as worshipping images and idols, venerating
