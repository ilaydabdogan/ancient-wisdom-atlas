  text: Gallus burned fana where sacrifices to demons were made and submerged whatever
    offerings he found in a lake.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Columbanus sought a better place in the Vosges wilderness for a monastery
    and found Luxovium, an old fortified site with hot waters and many stone images
    or statues formerly honored by pagans with profane rites.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A later account describes Luxovium as a castrum formerly dedicated to fanatical
    cult and then ruined to the ground.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A church was built on the heathen site so that Christian altars and standards
