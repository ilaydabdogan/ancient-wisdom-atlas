  summary: The passage surveys prayer gestures, bodily postures, ritual directions,
    and collective prayer in Germanic and related Christian materials. It describes
    sea-prayer, raised or folded hands, ritual body-measuring, a nine-woman prayer
    rite with a candle, Norse invocations for divine help, Christian east-facing prayer,
    heathen north-facing prayer or sacrifice, and the idea that many voices make prayer
    more effective.
