  quote: ''
  summary: The passage discusses pigs or boars designated as sacrivus or votivus in
    Salic Law, interpreted as possible remains of Frankish heathen sacrificial practice.
    It suggests such animals may have been selected after birth, marked, and raised
    until sacrifice. A note compares this with German, French, and Dutch customs in
    which butchers lead a decorated fatted ox through the streets with music, gifts,
    and an axe-bearing butcher, described as a possible relic of an old sacrificial
    rite.
