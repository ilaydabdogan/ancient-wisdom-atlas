  quote: both are directors of war and battle, and the fame of victory proceeds from
    each of them alike.
  summary: The passage argues from etymology and divine epithets that the Teutonic
    god Zio/Tiw/Tyr held a high divine rank. It reports Tyr as Odin's son in the Edda,
    compares Tyr and Odin as war and victory deities, notes Hadu as another war-god,
    discusses -tyr epithets for Odin and Thor, and makes cautious classical comparisons
    with Zeus, Jupiter, and Mars.
