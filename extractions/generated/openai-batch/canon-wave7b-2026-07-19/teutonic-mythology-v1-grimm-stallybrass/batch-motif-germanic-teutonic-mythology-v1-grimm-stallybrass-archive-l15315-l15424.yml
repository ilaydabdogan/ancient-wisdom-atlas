canonical_text:
  quote: ''
  summary: The passage surveys Gefjon, Ran/Rahana, and Hel/Hellia. It reports Gefjon
    ploughing Zealand from Swedish soil with four giant oxen, receiving maidens who
    die virgins, and being invoked in oaths. It describes Ran as Oegir's wife, mother
    of nine daughters, and receiver of drowned people, drawing them with a net. It
    then compares Ran, Hel, and Freyja as recipients of the dead by water, land, and
    battle, and discusses Hel/Hellia as Loki's daughter, an underworld figure who
    takes and holds departed souls, and a half-black, half-human-coloured sibling
    of Fenrir and a monstrous snake.
  language: English
  quote_policy: summarized
