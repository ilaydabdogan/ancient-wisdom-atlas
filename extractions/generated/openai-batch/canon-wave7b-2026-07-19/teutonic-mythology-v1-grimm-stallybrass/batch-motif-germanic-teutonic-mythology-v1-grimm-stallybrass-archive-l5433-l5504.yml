canonical_text:
  quote: ''
  summary: 'The passage compiles reports about cult images and their treatment: Gregory
    of Tours describes a Diana statue in the Treves region and a shrine with Mars
    and Mercury near Brivatensi; Widekind reports a Saxon victory rite involving an
    eagle, altar, and classical identifications; a Corvei annal note describes idols
    at Eresburg; and Grimm notes limited evidence concerning Frisian Fosite, Wilibrord,
    and a sacred fountain. Several episodes involve Christian opposition to images,
    prayers, destruction of statues, and disposal of broken images in water.'
  language: English with Latin quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gregory’s Treves narrative describes a statue of Diana that the local unbelieving
    populace adored as if it were a god.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Christian speaker in the Treves narrative preached that Diana, images,
    and their cult were nothing, and prayed that the statue be thrown down.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same narrative says smaller figures had already been broken, and that
    the large Diana statue was pulled down with ropes after prayer and reduced to
    powder with iron hammers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Widekind’s Saxon passage says that after victory the Saxons placed an eagle
    at the eastern gate and constructed an altar of victory.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'The Saxons are described as venerating their own sacred rites according to
    ancestral error, with classical names and forms: Mars by name, Hercules in columnar
    effigy, and the Sun in place, whom the Greeks call Apollo.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The Corvei annal note says Eresburg was dedicated to two idols: Aris or Mars,
    inserted in the town walls as a ruling figure, and Ermis or Mercury, worshiped
    by those engaged in trade in market settings.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that Frisian temples seem to provide evidence for images
    of gods, but notes that the Fosite passage mentions temples of the god and Wilibrord’s
    violence against the sacred fountain, not demolition of an image.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Gregory’s Brivatensi narrative describes a great shrine near a cell built
    by a matron at the tomb of the martyr Julian, where an image of Mars and Mercury
    was worshiped on a very high column.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: During a pagan festival at the Brivatensi shrine, incense was offered, two
    boys were stirred into conflict, and one boy drew a sword against the other, who
    ran to the saint’s cell and was saved.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the pagans wished to renew offerings on the fourth day, Christian priests
    prayed to the martyr; a violent thunderstorm arose, the heathens were terrified
    and baptized, and the statues they had worshiped were broken and thrown into a
    nearby lake.
  category: sequence
  evidence_refs:
  - ev:6
