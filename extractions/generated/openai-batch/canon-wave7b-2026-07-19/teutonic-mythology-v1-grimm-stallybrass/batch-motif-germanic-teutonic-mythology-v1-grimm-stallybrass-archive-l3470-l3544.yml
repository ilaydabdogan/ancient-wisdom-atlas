canonical_text:
  quote: ''
  summary: The passage argues philologically and comparatively that early temple concepts
    among Germanic and related peoples centered on sacred woods, groves, and trees
    rather than built shrines. It describes deities dwelling in or being worshipped
    in groves, offerings made there by hunters and herdsmen, parallels from Celtic
    and Samogitian cult, and Tacitus' reports of Germanic consecrated groves and Semnones
    ritual entry into a sacred wood.
  language: English, with Latin and Greek citations
  quote_policy: summarized
