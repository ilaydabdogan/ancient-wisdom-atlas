- id: obs:1
  text: The passage identifies OHG paro and AS bearo with meanings such as lucus,
    arbor, sacred grove, or tree, and states that arae in one citation stands for
    templum.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that a temple can mean a wood, and contrasts a built, walled
    house with a holy place enclosed by self-grown trees.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the described sacred wooded place, the deity dwells veiled by foliage;
    a hunter presents killed game, and herdsmen present horses, oxen, and rams.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage cites Maximus Tyrius as saying that the Celts revere Zeus and
    that the Celtic image of Zeus is a high oak.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage cites Lasicz for the Samogitian belief that gods inhabit groves,
    and also notes a saying that gods inhabited woods.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says forest-worship was the principal conception of divine dwelling,
    while allowing that a god may haunt a mountain-top, a rock cave, or a river.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tacitus is cited as saying that Germans did not think gods should be confined
    by walls or represented in human likeness, but consecrated groves and woods and
    called the hidden sacred presence by divine names.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Tacitus is cited as saying that the Semnones and related peoples assembled
    at a set time in a sacred wood; nobody entered unless bound, and anyone who fell
    was not allowed to rise but had to roll along the ground.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage suggests that later Teutonic architecture in its boldest forms
    aimed at reproducing the soaring trees of the forest, and refers to a god imagined
    on the bowery summit of a sacred tree.
  category: relationship
  evidence_refs:
  - ev:9
