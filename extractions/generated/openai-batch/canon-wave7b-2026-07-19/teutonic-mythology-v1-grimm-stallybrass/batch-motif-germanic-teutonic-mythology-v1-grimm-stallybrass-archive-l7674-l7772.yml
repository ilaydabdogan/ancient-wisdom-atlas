canonical_text:
  quote: ''
  summary: The passage compiles Germanic harvest customs and local legends associated
    with Wode/Woden/Odin. It describes mowers invoking Woden at harvest, leaving and
    treating a final bunch of grain, arranging scythes, using repeated cries or rhymes,
    and later regional parallels. It also reports Wode as a wild hunter or galloping
    rider with horse and dogs, work taboos connected with his passage, and Scandinavian/local
    legends about Odin's horse and stones.
  language: English with Low German/German quotations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At harvest-time, mowers are said to have invoked the idol Woden for good corn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the last spot of each field, a small corner or bunch of grain was left
    unmown; the ears were tied together three times and sprinkled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mowers stood around the grain-bunch, took off their hats, set or directed
    their scythes around it, and invoked Woden three times with a rhyme asking Wode
    to fetch fodder for his horse and better corn in the next year.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: David Franck is cited as giving a similar Wode rhyme and as reporting that
    Wodel-beer was served to mowers after the rye was cut.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports taboos against weeding flax on Wodenstag and against spinning
    or leaving flax on the distaff from Christmas to Twelfth-day, with Wode's horse
    or Wode's galloping given as the reason.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wode is expressly said to ride a white horse; meadows called Onsdngarne are
    said to be where the god's horses grazed.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:8
- id: obs:7
  text: The same wild hunter is said to be heard at night in the field, especially
    in winter, with his hunting dogs.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: In the neighbourhood of Kloppenburg in Oldenburg, harvesters are said to leave
    a bunch of corn-stalks uncut in the field and dance around it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In the Schaumburg custom, harvest workers coordinate the final cutting, raise
    and plant scythes, beat the blades three times, spill some drink on the field,
    drink themselves, wave hats, cry Wold three times, and women knock crumbs from
    baskets onto the stubble.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: One Oeland story says Odin removed his horse's bit and laid it on a large
    stone, whose weight split the stone into two pieces.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Another Oeland story says Oden pierced a stone with his sword to tie his horse;
    the horse broke loose, the stone burst and rolled away, and a deep bog arose there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A granite block named Odinssten is said to have been used by warriors of old
    to whet their swords; another cited account says Odin had his horse shod and rode
    away by enormous leaps to Sweden, where a war broke out.
  category: action
  evidence_refs:
  - ev:7
