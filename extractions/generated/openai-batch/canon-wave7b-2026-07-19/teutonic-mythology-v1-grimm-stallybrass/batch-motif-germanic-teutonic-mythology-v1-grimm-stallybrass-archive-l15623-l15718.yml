canonical_text:
  quote: Plainly then the gods were not immortal by their nature
  summary: The passage compares Greek, Indian, and Germanic ideas about divine immortality
    and mortality. It treats ambrosia, nectar, and amrita as special foods or drinks
    connected with death-averting power; notes episodes where gods or divine children
    are vulnerable to death or the lower world; and contrasts Greek emphasis on divine
    eternity with Norse evidence for the death of gods, including Balder, Odin, and
    Thor.
  language: English
  quote_policy: quoted
