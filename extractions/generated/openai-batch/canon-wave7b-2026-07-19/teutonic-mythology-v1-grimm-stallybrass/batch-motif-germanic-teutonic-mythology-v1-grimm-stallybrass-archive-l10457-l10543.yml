canonical_text:
  quote: ''
  summary: The passage discusses Fro/Freyr as a sacred lordly deity whose worship
    may be inferred from names and poetic epithets; his relation to Freyja/Frowa;
    comparisons with Liber and Libera; his functions involving love, fruitfulness,
    rain, sunshine, fertility of soil, and peace; his surrender of horse and sword
    out of longing for Gerdr; and his Swedish cult status at Upsal beside Thor and
    Wodan.
