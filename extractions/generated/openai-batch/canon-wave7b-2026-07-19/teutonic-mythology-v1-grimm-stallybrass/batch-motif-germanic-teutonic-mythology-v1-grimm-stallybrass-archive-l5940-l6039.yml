canonical_text:
  quote: ''
  summary: The passage surveys medieval and early sources that equate or pair Germanic
    deities with Roman divine names, especially Wodan/Voden/Othin with Mercury, and
    Jupiter/Jove with the thunder-god or Thor. It cites reports of sacrifices, rites,
    feast-days, ritual books, Norman idols, and the author’s argument that Latin god-names
    were transferred to domestic deities, helping explain Germanic weekday names.
  language: English with embedded Latin names and phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Paulus Diaconus identifies Wodan or Gwodan with the Roman Mercury and says
    this god was worshipped by all German peoples.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jonas of Bobbio reports sacrificing Alamanns saying they wished to make an
    offering to Vodano, whom others call Mercury; a later gloss calls Vuotan Mars.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gregory of Tours names Saturn, Jupiter, Mars, and Mercury among gods adored
    by the heathen Chlodovich and also reports a bishop compelled by Chroco to sacrifice
    to demons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Widukind of Corvei names Mars and Hercules as gods of the Saxons, and the
    Corvei annal addition couples Greek and Latin forms Aris/Mars and Ermis/Mercurius.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Indiculus paganiarum lists sacred rites and feast-days for Mercury or
    Jove/Jupiter; the author connects Jove with the thunder-god, Jove's oak, and a
    sacrifice to Jove.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: An old St Albans account says books discovered during church-foundation work
    were burned; one book contained invocations and rites in which citizens especially
    invoked and worshipped the sun-god Flioc(h)um and secondarily Mercury, called
    Voden in English.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The St Albans account describes Mercury/Voden as a god of merchants, relating
    this to the citizens and compatriots being traders and shopkeepers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Saxo Grammaticus generally avoids Roman god-names and uses Othinus or Othin,
    but once uses Jupiter and a Jovial hammer where he usually has Thor; Mars in Saxo
    is said to seem to stand for Othin rather than Tyr.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ermoldus Nigellus says the Normanni worshipped Neptune for God the Father
    and Jupiter for Christ; the author supposes Neptune here means Othin and Jupiter
    means Thor.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Melis-Stoke is reported to remember that heathen Frisians worshipped Mercury.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author argues that Latin names of gods were transferred to domestic deities
    of Gaul and Germany over several centuries and that this explains the spread of
    heathen weekday nomenclature.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The author traces the seven-day week through Egypt and Alexandria and cites
    early planetary day-names such as days of Saturn, the Sun, Hermes, and Aphrodite.
  category: sequence
  evidence_refs:
  - ev:9
