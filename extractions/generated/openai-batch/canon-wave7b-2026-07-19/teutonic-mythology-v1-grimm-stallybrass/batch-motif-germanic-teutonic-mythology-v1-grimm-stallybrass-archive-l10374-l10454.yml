canonical_text:
  quote: ''
  summary: The passage opens Grimm's chapter on Fro/Freyr. It describes Freyr/Fro
    as a major Norse and Swedish god, then discusses the name as a sacred title with
    a broad sense of lordship or dominion. The passage traces cognate or related forms
    across Norse, Danish, Swedish, Gothic, Old High German, Old Saxon, Old English,
    Middle High German, modern German, and Frisian, noting Christian use for the Supreme
    Being and secular use for an earthly lord. It ends with a caution that the author
    does not mean to assert distinct worship of a god Frauja/Frouwo/Fraho among continental
    Germanic peoples in the same way Freyr was later worshipped in the North.
  language: English
  quote_policy: summarized
