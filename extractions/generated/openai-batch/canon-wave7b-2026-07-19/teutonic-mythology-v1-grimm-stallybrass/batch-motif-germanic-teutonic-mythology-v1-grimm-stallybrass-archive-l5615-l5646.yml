canonical_text:
  quote: ''
  summary: 'The passage surveys stories in which sacred or cult images act physically:
    a figure of ThorgerSr withholds and then releases a ring after an offering and
    supplication; Christian images give shoes, slippers, rings, or a casket; images
    of Mary or heathen statues accept rings and bind men to engagements; Mary or a
    magic-knowing priest restores a ring; and statues generally are said to move,
    protect, speak, weep, eat, and walk.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A figure of ThorgerSr raises or extends its hand when someone tries to take
    a ring from its arm, and the passage says the goddess is not willing to let him
    have it at first.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same man brings money, places it at the figure's feet, kneels and weeps,
    then grasps the ring again, after which the figure lets it go.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the same account is told in Foereyingasaga, cap. 23, and
    describes the trait as heathen antiquity that later passed into Christian medieval
    folk-tales.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports Christian image stories in which an image drops a ring
    or shoe as a gift to worshippers, a figure of Christ gives shoes to a poor man,
    and a saint's image gives gold slippers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A figure of Mary accepts a ring presented to it and bends its finger as a
    sign that it will keep the ring.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Two Virgin-story variants involve a young man putting a ring on a Madonna
    or on a heathen statue; the figure bends its finger, and the figures then hold
    the man to his engagement.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the Old French poem as summarized here, an image of Mary removes the ring
    from the heathen figure and restores it to the youth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Fordun's chronicle is summarized as telling of a nobleman who places a ring
    on a broken statue of Venus and recovers it with the help of a priest named Palumbus
    who understands magic.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states generally that statues may turn their faces away, stretch
    out an arm to protect, speak, laugh, weep, eat, and walk.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A painting of Mary is described in which the infant in her lap hands her a
    casket to give to a suppliant.
  category: action
  evidence_refs:
  - ev:10
