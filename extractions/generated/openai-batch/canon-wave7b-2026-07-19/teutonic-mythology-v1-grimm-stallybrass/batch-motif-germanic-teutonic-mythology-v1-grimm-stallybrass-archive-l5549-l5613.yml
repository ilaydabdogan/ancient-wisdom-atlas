canonical_text:
  quote: ''
  summary: 'The passage surveys Germanic and Norse reports of sculpted divine images:
    terminology for idols, descriptions of three god-statues at Uppsala, a golden
    statue of Othin in Saxo, heathen images associated with Harald, Norwegian temple
    images of Thor with Thorgerdr and Irpa, and smaller or placed images of Thor and
    Thorgerdr used in worship or decoration.'
