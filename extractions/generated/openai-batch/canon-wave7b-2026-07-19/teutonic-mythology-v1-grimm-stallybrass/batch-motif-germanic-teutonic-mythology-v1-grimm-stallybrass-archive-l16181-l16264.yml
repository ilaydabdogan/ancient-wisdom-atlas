canonical_text:
  quote: ''
  summary: 'The passage surveys divine vehicles and modes of movement in Germanic
    and comparative mythology: wagons, horses, ships, aerial travel, and movement
    through water. It describes divine motion as producing thunder, trembling, fire,
    and noise; also as producing flowers, herbs, and dew. It compares Greek divine
    concealment by mist with Germanic valkyries, tarnkappes, and helidhelms, and compares
    Greek and Norse divine intervention on behalf of favored heroes.'
  language: English
  quote_policy: summarized
