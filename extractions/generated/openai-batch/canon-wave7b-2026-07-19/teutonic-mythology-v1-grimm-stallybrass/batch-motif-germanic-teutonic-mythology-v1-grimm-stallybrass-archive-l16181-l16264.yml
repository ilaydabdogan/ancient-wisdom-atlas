    afterlife journey map.
- id: motif:3
  label: Divine movement causes thunder, noise, and landscape disturbance
  taxonomy_refs: []
  basis: The passage links divine driving, riding, descent, treading, and writhing
    with thunder, trembling mountains and forests, blazing earth, whirring, and quaking.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The examples are drawn from multiple traditions and sources.
- id: motif:4
  label: Divine presence produces fertility, flowers, and dew
  taxonomy_refs: []
  basis: Flowers, herbs, and dew are traced to divine footsteps, Zeus and Hera's embrace,
    valkyries' horses, and Hrimfaxi's bridle.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage groups Greek and Eddic examples under a common explanatory
    pattern.
- id: motif:5
  label: Concealing mist or invisibility protecting a favored figure
  taxonomy_refs: []
  basis: Greek gods are said to hide themselves or favorites in mist; valkyries, tarnkappes,
    and helidhelms are discussed as possible Germanic analogues with similar effect.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage explicitly says there is scarcely a trace of the Greek mist
    motif in Germanic mythology, so the Germanic comparison is limited.
- id: motif:6
  label: Divine protector of the favored hero
  taxonomy_refs:
  - divine_beloved
  basis: The passage describes valkyries and vily as favoring and shielding beloved
    heroes, Norse gods taking part with or against heroes, and Greek gods counseling
    or defending selected heroes.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage emphasizes protection
    and favor more than beloved status in all examples.
- id: motif:7
  label: Deity assumes human or battle guise
  taxonomy_refs:
  - shapeshifter
  basis: Odin assumes the figure of a charioteer, and Greek gods appear as human warriors,
    heralds, or old men when counseling or defending heroes.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage describes assumed forms, not full transformation narratives.
- id: motif:8
  label: Divine embrace linked to flourishing vegetation
  taxonomy_refs:
  - sacred_marriage
  basis: Where Zeus clasped Hera, the passage says sweet herbs, flowers, and glittering
    dewdrops appeared.
  evidence_refs:
  - ev:6
  confidence: low
  cautions: The passage does not call this a sacred marriage; the taxonomy reference
    is only a possible fit because Zeus and Hera are involved in a divine embrace.
- id: motif:9
  label: Aerial divine travel
  taxonomy_refs:
