- id: motif:2
  label: Journey to the nether world by wagon
  taxonomy_refs:
  - afterlife_journey_map
  basis: Brynhildr is specifically said to drive in her wagon to the nether world.
  evidence_refs:
  - ev:1
  confidence: low
