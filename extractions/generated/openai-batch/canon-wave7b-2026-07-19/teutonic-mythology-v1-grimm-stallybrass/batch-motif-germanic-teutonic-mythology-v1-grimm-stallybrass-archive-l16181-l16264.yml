- id: ev:4
  type: summary
  locator: lines 16206-16216
  quote_or_summary: The passage states that divine movement on earth, through air,
    or in water is vehement and noisy; Zeus or Thor's driving awakens thunder; Poseidon's
    tread shakes mountains and forests; Apollo's descent from Olympus makes bow and
