  rights_note: Public domain source; summarized evidence.
- id: ev:5
  type: summary
  locator: lines 16216-16229
  quote_or_summary: The Eddic examples include Odin riding while earth's way thundered;
    mountains crumbling and earth blazing when Odin's son rode in Jotunheim; Loki's
    wing-coat whirring; earth quaking when Skirnir came riding; and bound gods' rage
    and writhing causing tremendous effects.
  source_text_path: texts/public-domain/germanic/internet-archive/teutonic-mythology-v1-grimm-stallybrass.md
  rights_note: Public domain source; summarized evidence.
