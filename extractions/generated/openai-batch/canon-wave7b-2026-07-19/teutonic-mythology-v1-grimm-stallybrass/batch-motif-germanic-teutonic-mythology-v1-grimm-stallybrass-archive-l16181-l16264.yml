  locator: lines 16231-16240
  quote_or_summary: The passage says flowers arise where gods' feet stray; where Zeus
    clasped Hera, sweet herbs, flowers, and dewdrops appeared; valkyries' horses'
    manes shake fruitful dew on valleys; and dew falls nightly from Hrimfaxi's bridle
