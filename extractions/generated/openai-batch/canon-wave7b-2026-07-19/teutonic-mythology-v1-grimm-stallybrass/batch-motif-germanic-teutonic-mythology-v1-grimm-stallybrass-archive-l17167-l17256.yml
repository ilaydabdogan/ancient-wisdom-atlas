canonical_text:
  quote: ''
  summary: The passage discusses conjectural Germanic ancestral hero names, especially
    Istio/Izdio and Irmino/Ermino/Hermino, in relation to Tacitus’s tribal groupings.
    It treats Ermine as the third son of Mannus and links his posterity with the Herminones,
    surveys irman-/irmin- compounds, and considers whether Irminsul was merely a term
    for a great pillar or also retained reference to a divine or heroic figure. It
    also raises the possibility that Roman reports about songs of Arminius may have
    confused a historical figure with a mythical Hermino.
  language: English
  quote_policy: summarized
