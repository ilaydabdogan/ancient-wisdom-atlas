canonical_text:
  quote: ''
  summary: The passage surveys place names, plant names, weekday names, glosses, and
    rune names that Grimm interprets as evidence for the antiquity and extent of Zio/Tyr/Tiw
    worship. It then discusses the T/Tyr rune as a sacred martial sign, including
    its use in victory runes on a sword and its visual resemblance to the upright
    sign of Mars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists mountain or fortress names such as mons Martis, Mersberg,
    Eresberg, Heresburg, and Eresburch, and notes that an annal says the place was
    sacred to Ares and Hermes, identified parenthetically as Mars and Mercury.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists plant names associated with Tyr, Thor, and Mars, including
    forms for a march-violet, aconite, and mezereon, and describes one herb as magic
    and the mezereon as a poison-flower.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that place and plant names attest widespread worship of
    the god and that names for the third day of the week preserve living witness to
    him in Scandinavian, English, Swabian, and Swiss forms.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author interprets the Wessobrunn gloss “Cyuvari = Suapa” as evidence for
    Zio-worship in Swabia, reading it as connected with worshippers of Mars or Ares.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says each rune has a name and that OHG, Old Norse, and Anglo-Saxon
    rune alphabets preserve forms such as Zio, Tyr, Tiw, Tir, and Tis for the relevant
    rune.
  category: object
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: Several manuscript rune lists are cited as using Ti, Ziu, or related forms
    for T, with the author distinguishing High German and Low German forms.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:7
  text: The Vienna codex form Tyz is said to approach the author’s conjectural Gothic
    Tius, and the retention and variation of the divine name in runes are treated
    as proof of the antiquity and extent of Zio-worship.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:8
  text: The passage asks why no rune is named from Wuotan or Óðinn, although he is
    called the inventor of writing, and notes possible indirect or disputed rune-name
    links to the thunder-car god and to Freyr.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:9
  text: The T=Tyr rune is described as a highly honoured symbol and the god’s name
    as specially sacred; when victory runes are scratched on a sword, the name of
    Tyr is said to be inserted twice.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: The shape of the Tyr rune is said to resemble the upright planetary symbol
    of Mars, and an Anglo-Saxon rune poem is cited as saying that tir is a token or
    sign.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:11
  text: Poetic phrases about marking with tir are cited and interpreted as marking
    with glory, while still allowing the author to think of a heathen divine symbol
    associated with ale-cup blessing.
  category: speech
  evidence_refs:
  - ev:12
