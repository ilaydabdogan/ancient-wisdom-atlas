canonical_text:
  quote: ''
  summary: The passage collects notes and tales about Bertha, Holda, Berhta, Lucia,
    and Perchtha. It links Bertha/Holda with tangled thread and hair, notes Berhta's
    association with St. Lucia and Frau Lufz, and recounts Perchtha episodes involving
    spinning demands, wagon or plough repairs, rewards that become gold or money,
    and Perchtha's departure across the Saale with the heimchen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a notion of tangled thread and hair is associated with Bertha
    and Holda, and that de Chlungere puts knots or lumps in the unfinished yarn of
    slothful maidens.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Berhta is often represented by St. Lucia in Bavaria and German
    Bohemia, notes that Frau Lufz cuts the belly open, and cites the Lusse in Sweden
    for comparison.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Perchtha gives spools to a spinner and requires them back spun full within
    an hour; the spinner spins a few rounds on each and throws them into the brook,
    after which Perchtha seems appeased.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On Perchtha's night, a miner returning from Bucha to Konitz meets Perchtha
    at the cross-roads, and she demands that he put a wedge in her wagon.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The miner cuts and fits a wedge into Perchtha's wagon; she gives him fallen
    chips, and at home he draws gold from the pockets where he placed them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Two peasants traveling late on Perchtha's eve encounter Perchtha driving a
    wagon; she asks for a peg in the pole, supplies wood, and the man who fits it
    carries home money in his shoe.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Between Bucha and Wilhelmsdorf, Perchtha is described as queen of the heimchen;
    at her command the heimchen water men's fields while she works underground with
    her plough.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: After the people fall out with Perchtha, she decides to quit the country and
    sends notice to the ferryman at Altar village to be ready late at night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ferryman sees a tall stately dame surrounded by weeping children; she
    enters the craft while the little ones drag in a plough and other tools and lament
    leaving the region.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After crossing, Perchtha orders the boatman to return for heimchen left behind;
    she then rewards him with chips from mending the plough, and three chips become
    three gold-pieces by morning.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
