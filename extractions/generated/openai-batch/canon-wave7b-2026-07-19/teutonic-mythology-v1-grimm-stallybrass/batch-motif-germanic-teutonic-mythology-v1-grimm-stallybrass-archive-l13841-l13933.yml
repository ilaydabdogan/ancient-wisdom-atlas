canonical_text:
  quote: ''
  summary: The passage discusses Perahta/Berhta in relation to Epiphany and older
    folk belief, compares her with Holda, lists shared traits such as seasonal travel,
    wagons, gifts, spinning, penalties, and a supernatural host, and then compares
    this pattern with the Italian Befana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A figure called reine Pedauque or regina pedemicae is described as carved
    in stone on old churches and associated with a swan-maiden-like or splay foot.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage connects the relevant date with Dec. 25 or Jan. 6, the Christian
    feast of Epiphany, and notes an Old High German gloss rendering theophania as
    giperahta naht, the bright night.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Medieval documents are said to use date forms such as perchtentag and perhtennaht,
    which the author says could become personified as Bright's day or dame Bright's
    day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The author presents two hypotheses: Perhta may have arisen from calendar-name
    personification, or the bright-day analogy may have attached to an already existing
    Perhta.'
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: The author argues that Berhta's characteristics and her identity with Holda
    favor the view that both point to a heathen deity who made a Yule-season peregrination
    later connected with Christmas and New Year.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Holda and Bertha are described as driving in wagons, promoting agriculture
    and navigation, and having a sacred plough from which chips of gold fall.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Berhta is described as appearing suddenly and handing gifts in at the window.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Holda and Bertha are described as caring about spinning and weaving, requiring
    diligence and holy observance of festivals, and punishing transgressors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The souls of infant children are said to be in the host of Holda and Bertha;
    elves, dwarfs, night-hags, and enchantresses are also described as under or around
    them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Italian Befana is described as a misshapen fairy and terror to children,
    linked to Epiphany; women and children set a black, ugly rag doll in the window,
    and the figure brings presents.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author says it is more likely that both the Italian and Germanic cases
    involve older popular traditions blending with the Christian name of the day,
    rather than calendar names alone inventing supernatural beings twice.
  category: other
  evidence_refs:
  - ev:8
