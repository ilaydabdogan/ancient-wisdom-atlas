canonical_text:
  quote: ''
  summary: 'The passage first treats the reported Saxon divinity Krodo as a late and
    doubtful tradition, summarizing a fifteenth-century account in which King Charles
    overthrows an idol on the Hartesburg. It then turns to Zio/Tyr as a war and victory
    figure: battle-songs and sword-dances are connected with him, the Eddaic account
    presents Tyr as one-handed after a wolf bites off the hand he placed in its jaws
    as a pledge, and the author compares this impairment with blind fortune-distributing
    figures. A footnote gives a separate hand-in-mouth episode involving Julian and
    Mercury''s statue.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fifteenth-century chronicle is reported to say that King Charles, during
    his conquest of the East Saxons, overthrew on the Hartesburg an idol similar to
    Saturn that the people called Krodo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that the Krodo tradition has no earlier medieval authority
    and argues that the name-form lacks support in Saxon speech.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage associates battle-songs with praises of Zio and says war-dances
    may have been performed, deriving the solemn sword-dance from this context.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says the Edda presents Tyr as one-handed because a wolf bit off
    the right hand that Tyr had laid in its jaws as a pledge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Old Norse rune exposition is cited as saying under the letter T that Tyr
    is one-handed among the Æsir.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author says the rest of Teutonic legend has no trace of Tyr's one-handedness,
    except a possible comparison with Walther's one-handedness.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The author favors an explanation that Tyr appears one-handed because he can
    grant victory to only one side of the combatants.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Hadu, Plutos, and Fortuna are cited as figures painted blind because they
    distribute gifts or fortune at random.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A footnote recounts that Julian was forced to put his hand into the mouth
