  summary: The passage opens a chapter on Donar/Thunar/Thor, identifying the god with
    clouds, rain, lightning, thunder, and the lightning-bolt. It then explains several
    Germanic and Scandinavian terms for thunder as connected with the god’s wagon
    or driving, compares thunder to the rumbling of a wagon, gives Greek, Carniolan,
    and Russian peasant parallels for thunder as divine driving or related sound-making,
    and notes the Eddic title Oku-Thorr, “Waggon-Thorr,” whose wagon is drawn by two
    he-goats.
