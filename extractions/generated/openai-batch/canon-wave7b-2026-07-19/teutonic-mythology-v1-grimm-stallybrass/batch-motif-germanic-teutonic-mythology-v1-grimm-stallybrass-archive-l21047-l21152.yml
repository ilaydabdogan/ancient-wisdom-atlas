candidate_motifs:
- id: motif:1
  label: Swan-human metamorphosis
  taxonomy_refs:
  - shapeshifter
  basis: The passage describes swan-shape inherited through rings, a young man metamorphosed
    into a swan, swan-maidens, and prophetic women able to assume animal shapes.
  evidence_refs:
