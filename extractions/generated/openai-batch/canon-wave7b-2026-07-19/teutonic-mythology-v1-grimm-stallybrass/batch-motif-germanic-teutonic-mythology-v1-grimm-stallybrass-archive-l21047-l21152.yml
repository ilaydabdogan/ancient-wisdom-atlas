comparison_claims:
- id: claim:1
  claim: The passage treats the Germanic swan-wife story and French fay stories as
    variants of a shared pattern in which a supernatural woman bathing near water
    is detained when a magical object or garment is removed.
  claim_level: same_motif
  target: Germanic swan-wife and French fay/swan-maiden detention stories
  evidence_refs:
  - ev:1
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The Germanic example uses a gold chain, while the French examples use
    shifts or a wimple; the equivalence is supplied by the passage’s comparative framing.
- id: claim:2
  claim: The passage links swan-maidens with valkyries, wish-wives, and wood-wives
    through shared associations with semi-divine women, swan imagery, prophecy, and
    forest-water settings.
  claim_level: same_function
  target: Swan-maidens, valkyries, wish-wives, and wood-wives
  evidence_refs:
  - ev:5
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is based on authorial comparison and adjacency, not on a
    single narrative where all these names are interchangeable.
- id: claim:3
  claim: The passage cautiously connects Celtic Gallicenae and French fay legends
    through animal-shifting and inferred swan-metamorphosis.
  claim_level: same_motif
  target: Celtic Gallicenae and French fay swan-metamorphosis
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: low
  limitations: The passage itself uses tentative language and says omissions in French
