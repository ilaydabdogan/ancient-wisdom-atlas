  - ev:4
  - ev:6
  confidence: high
  cautions: The passage includes both explicit swan-shape and broader animal-shape
    references; not every cited figure is explicitly a swan.
- id: motif:2
  label: Detention of a supernatural woman by stolen transformation-token or garment
  taxonomy_refs:
  - stolen_beloved
  basis: A maiden cannot escape after her gold chain is taken and is married; in French
    fay stories, stolen shifts detain bathing maidens, and a missing wimple corresponds
    to a swan-shift.
  evidence_refs:
  - ev:1
  - ev:6
  confidence: high
  cautions: The taxonomy label captures the detained beloved aspect; the passage emphasizes
    magical constraint and detention more than romantic consent.
- id: motif:3
