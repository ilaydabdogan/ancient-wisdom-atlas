canonical_text:
  quote: ''
  summary: 'The passage surveys swan-maiden and related wise-woman traditions: a bathing
    maiden is detained by theft of her gold chain and bears swan-shifting children;
    swans appear as prophetic, guiding, or world-threatening figures; French fay stories
    involve stolen garments or a missing wimple; and wish-wives are linked with wood-wives
    dwelling near forest waters and sacred groves.'
  language: English
  quote_policy: summarized
