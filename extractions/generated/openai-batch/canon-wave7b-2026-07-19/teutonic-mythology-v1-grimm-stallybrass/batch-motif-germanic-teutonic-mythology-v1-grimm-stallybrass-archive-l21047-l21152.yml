  taxonomy_refs:
  - wisdom
  basis: The passage presents a prophetic bird or swan in Gudrun, a talking swan that
    escorts Lohengrin’s hero, and a soothsaying swan.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The guidance and prophecy functions are distributed across separate examples
