canonical_text:
  quote: ''
  summary: 'The passage discusses divine flight and means of supernatural travel:
    Hermes and Athene have wind-swift sandals; Freyja owns a feather-shift lent to
    Loki, with a variant involving Frigg; Loki and Athene are described in bird-form
    contexts. It then compares Greek and Teutonic divine transport, contrasting Greek
    chariots and animal-drawn vehicles with the more common riding of gods in Teutonic
    mythology, including named horses, mounted valkyrs, and goddess wagons.'
  language: English
  quote_policy: summarized
