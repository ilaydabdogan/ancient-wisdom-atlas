- id: obs:2
  text: Saxnedt and Bældæg are named as prominent sons of Woden and are said to have
    been accounted divine; other named descendants are treated as early heroes.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says these genealogies give the names of the god’s sons and grandsons
    but not their mothers or grandmothers, and that related legends are missing.
  category: other
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Volsungasaga is described as beginning with Odin as father of Sigi, while
    withholding details of the relationship; Rerir, Sigi’s son, is said to be in the
    keeping of the highest gods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Odin, under the name Bolverkr, is said to become servant to the giant Baugi
    in order to get at a divine drink kept by Suttungr and guarded by Gunnlod.
  category: action
  evidence_refs:
  - ev:3
