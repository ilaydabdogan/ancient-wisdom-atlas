canonical_text:
  quote: ''
  summary: The passage surveys Germanic and Norse genealogical traditions that derive
    heroic and royal lines from Woden/Odin or other gods. It notes missing maternal
    legends, reports Odin’s pursuit of a guarded divine drink among giants and his
    association with Gunnlod, describes divine or giant mothers such as Skadi and
    Rinda, and recounts traditions about Frogerus, Saemingr, Gauti, Sigrlami, Bous,
    Skioldr, and a son of Thor. The author compares Germanic divine ancestry with
    Greek descent from Zeus and Greek unions between gods and Titans’ daughters.
  language: English
  quote_policy: summarized
literal_observations:
