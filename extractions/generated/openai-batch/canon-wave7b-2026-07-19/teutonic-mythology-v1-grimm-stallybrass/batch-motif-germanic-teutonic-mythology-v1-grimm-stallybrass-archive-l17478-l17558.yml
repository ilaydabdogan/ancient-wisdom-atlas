    along the heavenly road as in the heavenly hunt.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Irmenfried, king of the Thuringians, is said to have asked the Saxons for
    help when oppressed by Dieterich, king of the Franks; the Saxons came and fought.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Irmenfried secretly negotiated with the Franks against the Saxons, but the
    Saxons learned of the treachery and, led by Hathugat, attacked the Thuringian
    castle and killed the Thuringians.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Irmenfried fled and later returned to Dieterich's camp by stratagem; Iring,
    Irmenfried's counsellor, was staying in that camp.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Iring, after being won over by Dieterich, killed his own lord Irmenfried;
    then, before leaving, he declared that he would avenge his master and stabbed
    Dieterich dead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Iring laid Irmenfried's body over Dieterich's, cut open a way for himself
