canonical_text:
  quote: ''
  summary: The passage discusses names and etiologies of the Milky Way as a heavenly
    road, including Greek explanations involving Phaethon and Hera's spilled milk,
    a comparative list of road/path names across languages, and a Saxon-Thuringian
    heroic narrative in which Iring kills Irmenfried, avenges him by killing Dieterich,
    cuts his way out with a sword, and gives his name to the Milky Way as Iringesstrasse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists celestial names including Arthur's house, the Hyades, Watling
    Street, the Horn, the Charlewane, and Orion with a golden sword-like weapon.
  category: object
  evidence_refs:
  - ev:1
