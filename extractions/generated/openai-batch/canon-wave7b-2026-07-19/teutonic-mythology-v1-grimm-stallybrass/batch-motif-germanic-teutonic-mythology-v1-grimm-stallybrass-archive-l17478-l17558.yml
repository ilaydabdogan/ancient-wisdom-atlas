  text: Phaethon is described as the son of a god who tried to guide his father's
    sun-chariot and burned a broad streak in the sky identified with the Milky Way.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A more common explanation given in the passage says Hera, angered when the
    infant Hermes or Herakles was put to her breast, spilled milk along the sky, producing
    the bright phenomenon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The footnote lists Milky Way names in several languages built around straw,
