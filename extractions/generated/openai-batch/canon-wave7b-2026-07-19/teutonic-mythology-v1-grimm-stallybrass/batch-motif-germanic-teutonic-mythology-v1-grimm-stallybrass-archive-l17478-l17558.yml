  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The footnote also lists names that treat the Milky Way as a path of gods,
    a path of souls, a pilgrim's path, St James's road, a road to Rome, a birdway,
    or a war road.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The footnote connects Vroneldenstraet and Pharaildis with Holda and Herodias,
