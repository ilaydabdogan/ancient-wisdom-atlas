canonical_text:
  quote: ''
  summary: The passage discusses a covered car or ship procession associated by the
    author with a forgotten goddess identified with Isis and compared with Nerthus.
    It describes weavers drawing and guarding the ship, conflict over its reception,
    and related spring ship and plough processions in Germany. Plough customs involve
    young men, maidens, a piper, water, fire, ransom, straw, and sawdust. The author
    interprets ship and plough circuits as remnants of a springtime manifestation
    of a beneficent divinity linked with fertility, agriculture, and navigation, while
    a translator’s note cautions that Tacitus does not state the functions of his
    Isis.
  language: English
  quote_policy: summarized
