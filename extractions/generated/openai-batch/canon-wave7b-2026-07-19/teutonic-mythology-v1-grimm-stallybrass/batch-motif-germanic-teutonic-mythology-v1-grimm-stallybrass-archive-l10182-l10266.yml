candidate_motifs:
- id: motif:1
  label: oath sworn by touching a weapon
  taxonomy_refs: []
  basis: The passage explicitly says Teutonic nations swore by weapons with touching
    of the weapon and cites a later formula swearing on a sword pommel.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage is a scholarly comparison and does not narrate a specific
    mythic episode for a named Germanic figure.
- id: motif:2
  label: weapon worship or identification of weapon with war god
  taxonomy_refs: []
  basis: Scythians are cited as worshipping a sword and Romans as treating a spear
    as Mars; the Roman weapon is said to be like the Scythian sword.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The claim is reported through ancient authors cited by Grimm; it is not
    an independent ritual description in the passage.
- id: motif:3
  label: hidden divine sword revealed by wounded animal
  taxonomy_refs: []
  basis: The sword of Mars is found when a shepherd follows the blood trail of a lame
    heifer that had stepped on the buried weapon.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage gives this as a cited story about Attila and the Scythian
    sword, not specifically as a Teutonic myth.
- id: motif:4
  label: divine war-weapon legitimates universal rule
  taxonomy_refs:
  - royal_legitimacy
  basis: Attila interprets the discovered sword of Mars as making him ruler of the
    whole world and granting him power over wars.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The legitimating force is Attila's interpretation in the cited narrative;
    the passage does not state a formal coronation or communal recognition.
- id: motif:5
  label: unlucky sword passed among rulers and causing death
  taxonomy_refs: []
  basis: The sword is said to degenerate into an unlucky one, pass through several
    noble or royal hands, and eventually pierce Lupoid after he is thrown from his
    horse.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage gives a tradition history rather than a complete mythic narrative;
    the causal role of the sword's bad luck is implied by the wording but not elaborated.
- id: motif:6
  label: month dedicated or named after a deity
  taxonomy_refs: []
  basis: Romulus consecrates the third month to Mars, and the Anglo-Saxon March-name
    is traced to Hrethe or possibly Hrethu.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage is philological and comparative; the Germanic divine identification
    is explicitly uncertain.
- id: motif:7
  label: warlike god accompanied by carrion animals at battle
  taxonomy_refs: []
  basis: Zio is described as a warlike blood-shedder who gladdens ravens and wolves
    following him to battlefields.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: medium
  cautions: The passage itself cautions that ravens and wolves should more properly
    be assigned to Wuotan.
comparison_claims:
- id: claim:1
  claim: The passage presents Teutonic weapon-swearing as functionally parallel to
    Scythian and Roman practices of swearing by or venerating Mars' weapon.
  claim_level: same_function
  target: Scythian and Roman weapon-oath or Mars-weapon practices
  evidence_refs:
  - ev:1
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The passage asserts similarity of practice but does not establish direct
    historical contact or common inheritance.
- id: claim:2
  claim: The passage explicitly compares the Roman framaea or hasta of Mars with the
    Scythian sword.
  claim_level: visual_similarity
  target: Roman Mars spear and Scythian sword
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: The objects are not identical in form; the comparison concerns their
    use or status as Mars-related war weapons.
- id: claim:3
  claim: The passage compares the reconstructed warlike character of Zio with Ares,
    Zeus, Wuotan, and a Servian 'old blood-shedder' figure.
  claim_level: same_function
  target: Comparative war-god pattern in Greek, Germanic, and Servian material
  evidence_refs:
  - ev:14
  - ev:15
  - ev:16
  counter_evidence_refs:
  - ev:16
  confidence: medium
  limitations: The author states that Germanic evidence for Zio's attributes is sparse
    and partly reconstructed from names and foreign poetic parallels; ravens and wolves
    are cautioned as more proper to Wuotan.
- id: claim:4
  claim: The passage cautiously compares Roman dedication of March to Mars with the
    Anglo-Saxon March-name Hrethmonath traced to Hrethe or possibly Hrethu.
  claim_level: same_function
  target: Deity-linked month naming in Roman and Anglo-Saxon traditions
  evidence_refs:
  - ev:12
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The Hrethu god explanation is explicitly only possible, and the passage
    does not prove that the Anglo-Saxon deity is Mars or Zio.
- id: claim:5
  claim: The passage rejects a linguistic connection between Latin Mars and Greek
    Ares and also rejects the proposed connection between Eresburg and Marsberg.
  claim_level: linguistic_similarity
  target: Mars/Ares and Eresburg/Marsberg etymological comparisons
  evidence_refs:
  - ev:10
  counter_evidence_refs:
  - ev:10
  confidence: high
  limitations: This is a negative comparison claim confined to the etymological proposals
    discussed in the passage.
