canonical_text:
  quote: ''
  summary: The passage discusses Zio/Tyr in relation to weapon oaths, Roman and Scythian
    worship or swearing by weapons of Mars, the legend of the Scythian sword of Mars
    found through a wounded heifer and brought to Attila, later traditions about the
    sword becoming unlucky, Roman and Anglo-Saxon month names associated with deities,
    and Grimm's cautious reconstruction of Zio as a warlike, glory-giving deity comparable
    in some traits to Ares, Zeus, Wuotan, and a Servian war figure.
  language: English, with Latin, Greek, Old English, Old High German, Old Norse, and
    other philological forms quoted
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Teutonic nations swore by their weapons and touched the weapon
    while swearing.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The passage compares Teutonic weapon-swearing with Scythian and Roman practices
    associated with Mars' spear or weapon.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:3
  text: Arnobius is cited as saying that Scythian nations worshipped a sword and Romans
    treated a spear as Mars.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Jornandes, following Priscus, is cited for a story in which a Scythian sword,
    called the sword of Mars, came into Attila's hands.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the cited story, a shepherd noticed a heifer walking lame, followed traces
    of blood, found the sword the heifer had stepped on while grazing, dug it up,
    and brought it to Attila.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Attila received the sword as a gift and judged that by Mars' sword he had
    been made ruler of the whole world and granted power over wars.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says the sword later became an unlucky sword and was passed from
    Solomon of Hungary's mother to Otto of Bavaria, then to Dedi, Henry IV, and Lupoid
    of Mersburg.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Lupoid of Mersburg is said to have been thrown by his horse and pierced by
    the same sword.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The duke of Alba is said to have dug the sword out of the earth again after
    the battle of Mühlberg.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage states that the Latin Mars is not connected with Greek Ares and
    rejects a proposed connection between Eresburg and Marsberg.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: In Roman worship of Mars, the passage notes a legend of Picus, son of Saturn,
    a wood-spirit who helped nurse Remus and Romulus.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Romulus is said to have consecrated the third month of the year to Mars, described
    as his progenitor.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Anglo-Saxons are said to have called March Hrethmonath; Bede traces the
    name to a goddess Hrethe, while the passage says other races might explain it
    by a god Hrethu.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: The passage says reconstruction of Zio's attributes rests mainly on surviving
    names, with scarcely any other clue left.
  category: other
  evidence_refs:
  - ev:14
- id: obs:15
  text: The passage characterizes Zio as valiant, fond of war, glory-giving, stern,
