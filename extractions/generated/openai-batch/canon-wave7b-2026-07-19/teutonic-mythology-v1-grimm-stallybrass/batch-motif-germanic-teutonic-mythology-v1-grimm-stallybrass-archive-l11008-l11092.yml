canonical_text:
  quote: ''
  summary: A comparative passage on Balder and related Germanic names. It discusses
    possible bright or Milky Way imagery, argues for Balder worship and myth outside
    Scandinavia, describes Höðr/Hadu as a blind strong god who shoots the fatal arrow
    at Baldr without malice and is connected with war, describes Hermodr as sent to
    Hel to request the return of his beloved brother from the underworld, and summarizes
    the Merseburg lay in which Phol/Balder and Wodan ride in a forest, Balder's foal
    is injured, several divine beings fail to heal it, and Wodan heals it by conjuration.
  language: English
  quote_policy: summarized
