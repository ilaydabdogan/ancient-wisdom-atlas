canonical_text:
  quote: ''
  summary: The passage argues that Norse mythology and the gods of the North should
    not be dismissed and may hold for wider Teutondom. It compares Teutonic religion
    with other neighboring peoples who acknowledge gods, discusses claims that German
    paganism had only nature worship, cautions that Christian reports are one-sided,
    and cites Agathias and Gregory on Alamannic and Frankish worship directed toward
    natural places, beings, and sacrifices.
  language: English, with Greek and Latin quotations
  quote_policy: summarized
