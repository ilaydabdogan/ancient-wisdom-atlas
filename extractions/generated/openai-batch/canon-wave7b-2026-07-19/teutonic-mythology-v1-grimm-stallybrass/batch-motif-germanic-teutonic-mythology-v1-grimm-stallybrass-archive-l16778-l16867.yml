canonical_text:
  quote: The heroes are epigoni of the gods, their line is descended from the gods
  summary: The passage discusses the semantic development of words for hero, then
    argues that heroic exaltation rests on bodily kinship between gods and humans.
    It gives Greek examples of heroes and royal lineages traced to divine parentage,
    then compares this pattern with Germanic material involving Tuisco, Mannus, Tiv/Zio,
    Wuotan, Donar, Earth/Gaia, and related goddess names.
  language: English
  quote_policy: quoted
