canonical_text:
  quote: ''
  summary: A comparative scholarly passage argues that early Germanic religion centered
    on veritable gods rather than fetishistic worship of elements or objects. It contrasts
    Tacitus and Caesar, discusses Roman interpretive names for Germanic gods, notes
    a Teutonic conception of the sun as female and moon as male, mentions earth and
    water deities, cites Herulian, Gothic, and Frisian evidence for multiple gods
    and temples, and states that Tacitus reports no anthropomorphic images of German
    gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Tacitus refers to Germans invoking and serving gods, including
    ancestral, penate, common, and conjugal gods, and that he applies Roman names
    to individual gods while preserving some German appellations.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage rejects the idea that the Germans merely worshipped logs and puddles
    in a stolid fetishism.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage reports Caesar''s claim that the Germans counted only visible
    and openly helpful deities: the sun, Vulcan or fire, and the moon.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Teutonic thought conceives of the sun as a female
    being and the moon as a male being.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Vulcan is similar to the Norse Loki, but also says this divinity
    has little trace in the rest of Teutondom.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage identifies deities of nourishing earth and of quickening, fish-teeming,
    ship-sustaining water as more firmly grounded than Vulcan in the Germanic evidence
    discussed.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says accounts of individual gods imply many gods and mutual relationships
    among them, and it cites Procopius as ascribing a great host of gods to the Heruli.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage reports that Jornandes presents Diceneus as instructing selected
    Gothic nobles in theology and persuading them to venerate certain numina and shrines.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports Gothic priests with citharas and white garments going
    out to meet the Macedonians, supplicating paternal gods in song so that the Macedonians
    might be repelled.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage cites the Lex Frisionum rule that a temple-breaker is immolated
    to the gods whose temples he violated.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage concludes that first-century Germanic religion rested mainly on
    gods and that later northern and central Germanic evidence still presents faded
    but recognizable gods.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states that Tacitus knows no simulacrum of German gods and no
    image moulded in human shape.
  category: object
  evidence_refs:
  - ev:8
