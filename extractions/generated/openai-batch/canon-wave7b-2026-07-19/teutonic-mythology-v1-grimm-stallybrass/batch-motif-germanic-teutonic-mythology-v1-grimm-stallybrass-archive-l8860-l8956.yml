canonical_text:
  quote: ''
  summary: The passage describes Thor/Thunar as a Germanic thunder god associated
    with showers, a sacred tree, crop prosperity, a long or red beard, divine anger,
    thunder, and storm. It cites Old Norse saga descriptions, a King Olaf episode
    in which Thor raises ill-weather by blowing into his beard, North Frisian and
    Icelandic survivals of red-thunder imagery, and philological distinctions and
    expressions for lightning and thunder, including a Prussian folk-tale image of
    a blue whip chasing the devil or giants.
