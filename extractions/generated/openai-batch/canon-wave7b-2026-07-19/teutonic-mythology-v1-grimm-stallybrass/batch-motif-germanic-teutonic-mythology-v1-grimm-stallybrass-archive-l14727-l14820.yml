canonical_text:
  quote: ''
  summary: The passage opens with a residual note that Zio, Zisa, and Isis are assigned
    to the Suevi, then begins a section on Frikka/Frigg and Frouwa/Freyja. It treats
    Frigg and Freyja as distinct but often confused Norse goddesses, explains Freyja’s
    name through Germanic words for lady or mistress, notes Old Norse honorific use
    derived from the goddess, cites the Merseburg poem for Frûa/Frowa as a goddess
    name, and identifies Frigg as daughter of Fiorgynn and wife of OSinn in Eddic
    material.
  language: English
  quote_policy: summarized
