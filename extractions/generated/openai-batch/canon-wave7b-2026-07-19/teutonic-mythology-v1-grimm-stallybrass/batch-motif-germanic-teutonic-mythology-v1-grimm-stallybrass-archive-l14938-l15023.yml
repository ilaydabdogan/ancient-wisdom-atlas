canonical_text:
  quote: ''
  summary: The passage discusses names and functions associated with Mary, Venus,
    Frigg, Freyja, Holda, Berhta, and related Indo-European divine names. It describes
    Frigg as daughter of Fiorgynn, consort of the highest god, knower of fates, patron
    of oaths, marriage, and childless supplicants; it notes English and Lower Saxon
    customs or legends preserving names such as Frigga and fru Frehe. It also describes
    Freyja as highly honoured, receiving frequent sacrifices including a boar sacrifice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Christian thinking substituted Mary for a heathen
    goddess and that names connected with Mary, Venus, Frigg, and Freyja are applied
    to plants and a constellation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mary is described as receiving the conception of highest beauty and as being
    called 'our lady' with equivalents such as frau, domina, and donna.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nursery tales are said to depict Mary setting girls to sewing and spinning
    like Holda and Berhta, and Holda's snow is compared with Mary's snow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Old Bohemian gloss gives Priye for Aphrodite, and the passage connects
    related words for love, lover, friend, or pleasing with possible identification
    as Freyja or Frigg.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage describes Prithvi as earth and Terra mater, from whom fruit and
    increase come.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Frigg is described as daughter of Fiorgynn and consort of the highest god,
    ranking above all other goddesses.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Frigg is described as knowing the fates of men, being consulted by Odin, administering
    oaths, having handmaids fulfill her behests, presiding over marriages, and being
    invoked by the childless.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage recalls unmarried maidens being yoked to a goddess's plough after
    defying her commands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a northern English seasonal procession with old dances, a leading giant
    is named Woden and his wife Frigga.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the same play, two swords are swung and clashed about a boy's neck without
    hurting him.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Lower Saxony, the common people are said to know a figure called fru Frehe
    who plays the same parts assigned elsewhere to frau Holle.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A Westphalian legend derives Freckenhorst from a shepherd Frickio, to whom
    a light appeared at night on the spot where a church was to be built.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage says the name Freckenhorst may point to a sacred hurst or grove
    of a feminine Frecka or masculine Fricko, whose site Christianity perhaps appropriated.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Freyja is described as among the most honoured goddesses, as receiving frequent
    sacrifices, and as being honoured above all other gods by Heidrek, who sacrificed
    a boar to her.
  category: action
  evidence_refs:
  - ev:9
