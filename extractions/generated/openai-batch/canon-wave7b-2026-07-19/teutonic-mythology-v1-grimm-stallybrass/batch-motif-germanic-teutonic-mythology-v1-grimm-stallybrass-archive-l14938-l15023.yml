comparison_claims:
- id: claim:1
  claim: Mary is presented as a Christian figure who functionally replaces or absorbs
    traits of a heathen goddess and shares domestic-task motifs with Holda and Berhta.
  claim_level: same_function
  target: Mary compared with a heathen goddess, Holda, and Berhta
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not identify the substituted heathen goddess by name
    in this excerpt and reports a scholarly interpretation.
- id: claim:2
  claim: Venus is described as being translated in names by Frigg, Freyja, and Mary,
    suggesting a functional or semantic overlap around beauty, ladyship, and love-goddess
    naming.
  claim_level: linguistic_similarity
  target: Venus, Frigg, Freyja, and Mary in plant and goddess names
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage notes that some Norse names may have sprung from Latin
    ones, so direction and depth of borrowing are uncertain.
- id: claim:3
  claim: The Old Bohemian Priye for Aphrodite is linked by the passage to Indo-European
    words for loving, friendship, and fertility, and may correspond to either Freyja
    or Frigg.
  claim_level: linguistic_similarity
  target: Priye/Aphrodite compared with Freyja or Frigg
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The author explicitly doubts whether to connect the name with Frigg
    or Freyja, so the identification remains unresolved.
- id: claim:4
  claim: Lower Saxon fru Frehe is said to play the same parts assigned to frau Holle,
