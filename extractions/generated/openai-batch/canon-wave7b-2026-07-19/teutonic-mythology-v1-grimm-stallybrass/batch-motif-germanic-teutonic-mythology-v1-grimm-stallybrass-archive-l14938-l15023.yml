candidate_motifs:
- id: motif:1
  label: Christian female holy figure replacing or absorbing goddess functions
  taxonomy_refs:
  - mother_goddess
  basis: Mary is said to substitute for a heathen goddess, receive attributes of beauty
    and ladyship, and perform domestic functions compared with Holda and Berhta.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage is a comparative scholarly claim rather than a primary mythic
    narrative; the unnamed heathen goddess is not identified within this excerpt.
- id: motif:2
  label: Goddess of marriage, fertility, and supplication for children
  taxonomy_refs:
  - mother_goddess
  - sacred_marriage
  basis: Frigg is described as divine mother, patroness of marriage, and a helper
    invoked by the childless; Prithvi is described as Terra mater and source of fruit
    and increase.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage groups evidence from different languages and traditions; Frigg
    and Prithvi are not presented as the same figure.
- id: motif:3
  label: Goddess with wisdom of fate
  taxonomy_refs:
  - wisdom
  basis: Frigg is said to know the fates of men and to be consulted by Odin.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not narrate a specific episode of fate-knowledge; it
    states the attribute.
- id: motif:4
  label: Oath and marriage patronage by a high goddess
  taxonomy_refs:
  - sacred_marriage
  - covenant
  basis: Frigg is said to administer oaths and preside over marriages.
  evidence_refs:
  - ev:4
