canonical_text:
  quote: ''
  summary: The passage gathers comparative notices about swan-maidens, sigewif or
    wise-women, valkyr-like woodland virgins in Saxo, and later wood-wife traditions.
    It describes supernatural women associated with forests, caves, battle fortune,
    counsel, vanishing dwellings, offerings of flax and fire, field offerings, and
    local legends about wild women and stones.
  language: English with embedded Old Norse, Old English, Latin, and German terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Swan-maidens are described as flying from the south through a murky wood to
    the seashore, staying seven years, becoming homesick, and returning to the sombre
    wood.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that almost all swan-maidens are met with in the forest
    and notes that the seven-year period agrees with a Swedish story mentioned elsewhere.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: An Old English spell addresses sigewif, tells them to sit or descend to earth,
    not to fly into the forest, and to remember the speaker's welfare.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author treats sigewif as a general designation for wise-women and says
    they are invited to the house with a promise of gifts, like norns.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Saxo's account, Hotherus is hunting, is led astray by fog, and enters a
    chamber of woodland virgins who greet him by name.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woodland virgins say that by their guidance and auspices they especially
    govern the fortune of wars, attend battles unseen, aid friends secretly, and can
    grant prosperity or inflict adversity.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After giving advice to Hotherus, the maidens and their house vanish before
    his eyes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Later, Hotherus traverses remote places and an unusual wood, finds a cave
    inhabited by the same virgins, and receives more counsel from them; they are also
    said to have given him an inseverable garment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A footnote reports a Wallachian tale in which three wood-wives are bathing
    and have their crowns taken from them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Another footnote says three nymphs prepare enchanted food for Balder with
    the spittle of snakes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author says that maids of war in Odin's heavenly company, who traverse
    air and flood, are also imagined as haunting a woodland cave.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Burcard of Worms is cited for woodland women who show themselves to lovers
    when they wish and then hide or vanish when they wish.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage lists wild wives as lamiae or funereal birds and mentions female
    figures clothed in white appearing in groves or on trees.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Vicentina Germans are said to worship a wood-wife between Christmas and
    Twelfthday; women spin flax from the distaff and throw it into the fire to propitiate
    her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the Frankenwald, three handfuls of flax are left lying in the field for
    the holzweibel or wood-wives.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: A high mountain stone called the wild woman's chairs has impressions like
    human limbs; local speech says wild folk lived there when stones were still soft,
    and later the man fled while the wife and child remained in custody until death.
  category: setting
  evidence_refs:
  - ev:11
