canonical_text:
  quote: "“As a god renews himself in a hero, so does an elder hero in a younger.”"
  summary: The passage discusses the boundary between gods, demigods, heroes, and
    giants in Germanic comparative mythology. It treats alleged bodily descent from
    gods, second births or new-births, and giant unions with gods or heroes as signs
    of older heathen hero traditions; it distinguishes this divine-heroic affinity
    from Christian euhemerist explanations of gods as deified men; and it describes
    demigods as familiar figures who mediate reverence, prayers, and oaths toward
    higher gods.
  language: English
  quote_policy: quoted
