canonical_text:
  quote: ''
  summary: The passage discusses Germanic heroic and divine genealogies involving
    Sceaf, Scild, Beaw/Beowulf, Geat, and Woden; interprets Beowulf as a bird-name
    connected with the woodpecker; compares this with Picus and Bohemian Stracec;
    and then links the Sceaf boat-arrival legend with medieval swan-knight narratives,
    swan-brothers, Welf lineage traditions, Scilfing/Skiolding names, and Giuki/Giukungar
    lineage traditions.
  language: English
  quote_policy: summarized
