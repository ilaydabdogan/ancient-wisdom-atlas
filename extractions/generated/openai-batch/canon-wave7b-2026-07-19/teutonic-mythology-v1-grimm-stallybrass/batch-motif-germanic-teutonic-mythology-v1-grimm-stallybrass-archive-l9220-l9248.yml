literal_observations:
- id: obs:1
  text: Some names of the snipe identify it with a thunder-goat, Thursday-horse, or
    heavenly goat, apparently because its sound is heard as bleating or whinnying
    in the sky.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bird is also called a weatherbird, stormbird, or rainbird, and its flight
    is said to indicate an approaching thunderstorm.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first time the bird is heard in the year, it is said to prognosticate
    human fate.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lettish and Lithuanian names for the bird correspond to thunder’s goat or
    heaven’s goat.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kannes is reported as thinking that the name Thursday-horse belongs to the
    goat itself rather than to the bird.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage connects Anglo-Saxon names for ibex, chamois, and capricorn with
    a possible Old High German correspondence, and says a wild rock-leaping creature
    would suit a god of rocks better than a tame goat.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Edda, Thor has he-goats yoked to his thunder-car.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The weather-fowl is described by turns as goat and horse, both understood
    in the passage as car-drawing beasts.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The devil is described as the modern representative of the thunder god and
    is credited with creating male and female goats.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Thor puts away the bones of his goats after they have been picked so that
    he may bring the goats to life again.
  category: sequence
  evidence_refs:
  - ev:5
