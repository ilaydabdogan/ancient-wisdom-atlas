  summary: The passage surveys names and beliefs connecting the snipe with thunder,
    sky-goats, horses, weather omens, and fate-prognostication. It compares German,
    Scandinavian, Lettish, Lithuanian, Anglo-Saxon, and Eddic material, including
    Thor’s he-goats yoked to his thunder-car and a note that Thor restores his goats
    to life from their bones.
  language: English
