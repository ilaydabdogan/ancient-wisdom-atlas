canonical_text:
  quote: ''
  summary: The passage presents a philological and comparative discussion of Germanic
    ancestral figures. It connects Buri and Borr with Norse forefathers of Odin, Vili,
    and Ve; describes Buri as a first human licked from rocks by a cow; compares Buri,
    Borr, and Odin with Tvisco, Mannus, and Inguio; argues for the reading Iscio/Isco;
    and proposes possible links between Iscio, Askr, ash-tree names, and descent suffixes
    such as -ing and -isk.
  language: English
  quote_policy: summarized
