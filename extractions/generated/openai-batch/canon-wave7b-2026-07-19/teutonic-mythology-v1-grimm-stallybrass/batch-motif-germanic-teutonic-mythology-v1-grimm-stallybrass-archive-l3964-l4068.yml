canonical_text:
  quote: ''
  summary: The passage argues that ancient worship was connected with sacred forests
    and trees, while also noting early temples, images, and sanctuaries. It cites
    examples involving animal trophies on trees interpreted as heathen sacrifice,
    Tacitus on Mother Earth in a sacred grove, the temple called Tanfanae, a strong
    pagan temple site at Isarnodori later partly retained by Christians, and a royal
    order against idols.
  language: English with Latin quotations
  quote_policy: summarized
