canonical_text:
  quote: ''
  summary: 'The passage gathers annalistic and medieval testimony about the Saxon
    Irminsul: its destruction and the removal of treasure, descriptions of it as shrine,
    grove, idol, image, and large upright wooden pillar, Saxon veneration of trees
    and springs, a possible Osning mountain-forest setting, the gloss of Irminsul
    as a universal all-sustaining column, a caution that the name itself does not
    prove dedication to one god, and a comparison with Greek Hermae associated with
    Mercury or Hermes.'
