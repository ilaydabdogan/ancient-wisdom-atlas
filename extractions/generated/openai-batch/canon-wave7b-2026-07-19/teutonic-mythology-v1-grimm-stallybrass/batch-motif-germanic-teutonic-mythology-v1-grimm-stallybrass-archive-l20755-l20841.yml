canonical_text:
  quote: ''
  summary: The passage discusses Germanic female supernatural figures associated with
    the terms Drud/trute, wise women, norns, and valkyries. It describes Drud as a
    witchlike or hobgoblin figure, recounts the wood-maiden Dhryd/Drida, lists Eddic
    valkyries as royal women and beloveds of heroes, and highlights Brynhildr, Menglod,
    Babehilt, and other shield-maidens as prophetic, protective, fiery, sleeping,
    healing, or war-associated figures. It also notes sacrifice to Menglod and nine
    virgins, valkyries’ protection of heroes, shield-maiden rescue motifs in folk-song,
    Odin’s admission of mortal maidens into the valkyr band, second-birth associations,
    and the harmful results of unions between half-goddesses and heroes.
  language: English
  quote_policy: summarized
