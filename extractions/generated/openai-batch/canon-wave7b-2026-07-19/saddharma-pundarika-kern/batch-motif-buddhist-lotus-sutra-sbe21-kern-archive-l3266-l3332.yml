canonical_text:
  quote: "“nowhere in the world a second vehicle is taught, far less a third.”"
  summary: The passage states that Buddhas and Tathagatas of the past, future, present,
    and the speaking Tathagata teach the law by able or skilful means. Their teaching
    is said to be only one Buddha-vehicle leading to omniscience and Tathagata-knowledge,
    and beings who hear it reach supreme perfect enlightenment. In times of decay,
    when beings are tainted and greedy, Tathagatas skilfully designate the one Buddha-vehicle
    as a threefold vehicle.
  language: English
  quote_policy: quoted
