canonical_text:
  quote: There is but one vehicle, .Sariputra, and that the Buddha-vehicle.
  summary: The passage warns that those who do not heed the Tathagata's call to the
    Buddha-vehicle are not recognized as disciples, Arhats, or Pratyekabuddhas. It
    criticizes false claims to Arhatship, affirms the truthfulness of the Tathagatas
    and the single Buddha-vehicle, describes five thousand unbelieving and conceited
    assembly members departing, and presents the Lord as knowing beings' dispositions
    and initiating them through varied explanations, arguments, and illustrations.
  language: English
  quote_policy: quoted
