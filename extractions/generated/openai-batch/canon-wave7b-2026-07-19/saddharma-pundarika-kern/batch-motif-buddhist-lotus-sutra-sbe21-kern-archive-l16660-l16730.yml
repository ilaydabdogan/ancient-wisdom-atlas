canonical_text:
  quote: The time of my final extinction, young man of good family, has arrived ;
    the time of my death has arrived.
  summary: Sarvasattvapriyadarsana, after saying he wishes to worship the Lord again,
    rises into the sky, approaches the Tathagata, salutes and circumambulates him,
    and praises his radiance. The Tathagata announces his final extinction, entrusts
    teaching, community, world, servitors, and relics to Sarvasattvapriyadarsana,
    instructs him to worship and distribute the relics and build many stupas, then
    enters final extinction. Sarvasattvapriyadarsana perceives the death and makes
    a sandalwood pyre; the supplied excerpt ends mid-sentence during the burning action.
  language: English
  quote_policy: quoted
