canonical_text:
  quote: ''
  summary: The speakers describe themselves as sons and heirs of the Tathagata, though
    low in disposition and formerly content with Nirvana as a fee. They say the Lord
    skilfully appoints them heirs to the treasure of the Tathagata's knowledge and
    unexpectedly gives them the jewel of omniscience. Maha-Kasyapa then begins stanzas
    expressing wonder at the leader's voice, the sudden acquisition of jewels, and
    a comparison to a young person who left his father after being misled.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tathagata is described as saying to the speakers that they are his sons.
  category: speech
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:2
  text: 'The speakers say they were oppressed by three difficulties: pain, conceptions,
    and transition or evolution.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speakers say they were disposed to what is low in the worldly whirl.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speakers say the Lord prompted them to ponder inferior laws or conditions
    compared to a heap of dirt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speakers say they practised and made efforts while seeking only Nirvana
    as their fee, and were content with the Nirvana obtained.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Lord is said to appoint the speakers as heirs to the treasure of the Tathagata's
    knowledge, while not initially telling them that the treasure would belong to
    them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The speakers say they preach and explain the knowledge of the Tathagata to
    the Bodhisattvas Mahasattvas without longing for it themselves.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Tathagata is said to know the speakers' disposition, while the speakers
    say they do not know or apprehend it themselves.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The speakers say the Lord applies the denomination of Bodhisattvas to them
    while also calling them persons of low disposition in the presence of Bodhisattvas.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The speakers say they have to rouse Bodhisattvas to Buddha-enlightenment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The speakers say they have unexpectedly obtained the jewel of omniscience
    without desiring, seeking, searching for, expecting, or requiring it.
  category: object
  evidence_refs:
  - ev:4
- id: obs:12
  text: The venerable Maha-Kasyapa utters stanzas expressing wonder, amazement, and
    rapture at hearing the leader's voice.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The stanzas say that in a short moment the group acquired a great heap of
    precious jewels that they had not been thinking of or requiring.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: The stanzas compare the situation to a young person who was seduced by foolish
