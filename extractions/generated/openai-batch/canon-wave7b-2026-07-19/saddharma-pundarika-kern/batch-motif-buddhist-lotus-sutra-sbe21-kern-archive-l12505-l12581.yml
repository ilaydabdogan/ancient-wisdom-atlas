canonical_text:
  quote: ''
  summary: The passage instructs Mañjuśrī on the third quality of a Bodhisattva Mahasattva
    who keeps and expounds the Sutra after the Tathagata's extinction in an age when
    the true law decays. Such a preacher avoids envy, falsehood, deceit, disparagement,
    and religious disputes; maintains charity toward all beings; regards Tathagatas
    as fathers and Bodhisattvas as masters; preaches without partiality; and gains
    ease, allies, auditors, and veneration for the written Sutra.
  language: English
  quote_policy: summarized
