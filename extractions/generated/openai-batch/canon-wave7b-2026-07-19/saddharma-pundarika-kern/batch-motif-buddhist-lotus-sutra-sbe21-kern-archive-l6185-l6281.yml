canonical_text:
  quote: ''
  summary: The passage presents the Lord of the world ordering Kasyapa and the speakers
    to teach the superior path to enlightenment. The speakers describe teaching Bodhisattvas
    and sons of Jina, preserving and revealing the law-treasure while feeling spiritually
    poor, limiting themselves to individual Nirvana and the void, and later realizing
    that the Master had been testing their disposition. The Lord is compared to a
    rich man who subdues low disposition and gives wealth, while the speakers compare
    their sudden realization to a poor man acquiring riches.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lord of the world enjoins Kasyapa to teach the superior path to those
    striving for the highest summit of enlightenment, a path by which they are to
    become Buddhas.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After being ordered by the Sugata, the speakers show the path to many Bodhisattvas
    of great might by means of many illustrations and proofs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sons of Jina hear the speakers, realize the eminent path to enlightenment,
    and receive a prediction that they are to become Buddhas in the world.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speakers say they preserve the law-treasure, reveal it to the sons of
    Jina, and diffuse the Buddha-treasure while still feeling poor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speakers say they fancy an individual Nirvana, do not rejoice at hearing
    of divisions of Buddha-fields, and had put aside aspiration to superior Buddha-knowledge.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speakers say they had accustomed their thoughts to the void, had been
    released from evils of the triple world, and had accomplished the command of the
    Jina.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Master of the world, called the Self-born one, waits his time, does not
    explain the real connection of things, and tests the speakers’ disposition.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Lord is described as able to apply devices at the right time and is compared
    with a rich man who tells others to subdue their low disposition and gives wealth
    to those who are subdued.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Lord of the world is said to tame his sons of low disposition and then
    impart his knowledge to them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The speakers say they have suddenly been seized with surprise, like a poor
    man who acquired riches, and have obtained a fruit under the rule of Buddha.
  category: sequence
  evidence_refs:
  - ev:9
