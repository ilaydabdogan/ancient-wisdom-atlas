canonical_text:
  quote: ''
  summary: Bodhisattvas preach the law throughout many worlds while Sakyamuni, Prabhutaratna,
    and other Tathagatas display magical power through their tongues. After a long
    duration the Tathagatas withdraw their tongues and make sounds that shake many
    Buddha-fields. Beings in those fields behold the Saha-world, hear a sky-borne
    voice announcing Sakyamuni's revelation of the Lotus of the True Law, offer homage,
    and send offerings that form a canopy of flowers above the Tathagatas.
  language: English
  quote_policy: summarized
