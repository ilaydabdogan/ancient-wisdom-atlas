  summary: The passage presents the Tathagata's law as having one essence, deliverance,
    while explaining that beings differ in disposition and stage like varied plants.
    The Tathagata alone knows their states and does not reveal complete knowledge
    suddenly. In verse, the Lord identifies himself as Dharmaraja, says he teaches
    according to capacity, and says wise persons guard the difficult mystery so the
    simple are not perplexed. A cloud simile begins but is cut off in the supplied
    passage.
