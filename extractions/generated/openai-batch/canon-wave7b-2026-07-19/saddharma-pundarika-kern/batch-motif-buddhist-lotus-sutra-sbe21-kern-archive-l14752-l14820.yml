canonical_text:
  quote: ''
  summary: 'The Lord tells Ajita/Maitreya that when the law is heard, joyfully accepted,
    and passed along until a fiftieth hearer, that fiftieth person gains merit. He
    then gives a hypothetical example: a virtuous donor gathers innumerable beings,
    gives them desired pleasures and treasures for eighty years, and later instructs
    them in the Tathagata''s law so that they quickly attain stages up to Arhatship.
    Maitreya affirms that such a donor would produce great merit.'
  language: English
  quote_policy: summarized
