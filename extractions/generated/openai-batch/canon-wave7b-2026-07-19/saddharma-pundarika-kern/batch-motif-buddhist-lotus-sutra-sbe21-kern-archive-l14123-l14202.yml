canonical_text:
  quote: ''
  summary: After the Lord expounds the duration and periods of the law, celestial
    flowers, powders, cloths, jewels, censers, drums, and umbrellas appear or descend
    from the sky, honoring innumerable Buddhas, Śākyamuni, Prabhūtaratna, Bodhisattvas,
    and the audience. Bodhisattvas praise the Buddhas, and Maitreya recites stanzas
    celebrating the unprecedented law and the spiritual attainments of beings who
    hear it.
  language: English
  quote_policy: summarized
