canonical_text:
  quote: ''
  summary: The passage describes a world-space and many Buddha-fields cleared of ordinary
    inhabitants and richly adorned. Buddhas and Tathagatas arrive with attendants,
    sit cross-legged on jewel thrones beneath jewel trees, and Sakyamuni prepares
    vast fields as one Buddha-field to make room for further Tathagatas. Tathagatas
    produced by Sakyamuni arrive from the directions, occupy the quarters, and send
    satellites with jewel flowers to salute Sakyamuni at Grzdhraku/a mountain and
    request that he open the great Stupa of jewels.
  language: English
  quote_policy: summarized
