canonical_text:
  quote: ''
  summary: Samantabhadra is presented as the ruling power behind talismanic words
    and as the source of the entrustment of the Lotus teaching to bodhisattva preachers.
    Those who write, keep, comprehend, recite, study, meditate on, remember, and treasure
    the Sutra gain merit, divine support, protection at death, and rebirth among celestial
    beings, including in Tushita where Maitreya preaches.
  language: English, with transliterated Sanskrit terms and translator notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hearer affected by the talismanic words is said to know that Samantabhadra
    is their ruling power.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bodhisattva preachers entrusted with the Lotus teaching in Jambudvipa are
    instructed to regard that entrustment as due to Samantabhadra's power and grandeur.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those who write and keep the Sutra are said to share in Samantabhadra's course
    of duty, to have planted good roots under many Buddhas, and to have their heads
    caressed by the hands of the Tathagata.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Those who write and comprehend the Sutra are said, after death, to be reborn
    among the gods of paradise; eighty-four thousand heavenly nymphs approach them,
    and they dwell among the nymphs adorned with a high crown.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The merit from writing the Dharmaparyaya is praised, and the merit from reciting,
    studying, meditating on, and remembering it is described as greater.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: One who writes the teaching with undistracted attention is said to be supported
    by the hands of a thousand Buddhas and, at death, to see another thousand Buddhas
    face to face.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The attentive writer is said not to fall into a wretched state and, after
    death, to enter the company of the Tushita gods.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: In Tushita, Maitreya resides, bears the thirty-two sublime characteristics,
    is surrounded by Bodhisattvas, is attended by heavenly nymphs, and preaches the
    law.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Wise young men and women of good family are instructed to write, recite, study,
    and keep the Lotus teaching in mind respectfully, thereby acquiring innumerable
    good qualities.
  category: action
  evidence_refs:
  - ev:8
