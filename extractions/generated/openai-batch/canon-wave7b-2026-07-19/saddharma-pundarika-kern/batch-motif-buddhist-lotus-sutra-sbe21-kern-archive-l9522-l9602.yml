canonical_text:
  quote: ''
  summary: The passage describes the qualities of a Buddha-field associated with Lord
    Dharmaprabhasa, including innumerable Bodhisattvas, disciples, a radiant aeon,
    a pure world, long-lasting true law, and stupas of precious substances. In stanzas,
    the Lord tells monks that Bodhisattvas use adaptive means by appearing as disciples
    or Pratyekabuddhas, accommodating beings of limited disposition, and bringing
    beings to maturity. The passage then praises Pur^a as a disciple who has served
    under many Buddhas, sought Buddha-knowledge, taught the pure law, ripened beings
    for the supreme Vehicle, and purified his field.
  language: English
  quote_policy: summarized
