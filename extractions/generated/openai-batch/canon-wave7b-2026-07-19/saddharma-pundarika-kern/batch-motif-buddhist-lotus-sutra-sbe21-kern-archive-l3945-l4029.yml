canonical_text:
  quote: ''
  summary: The first-person speaker addresses Śariputra, recalls seeing countless
    seekers respectfully approach, decides the time has come to reveal the excellent
    law and supreme enlightenment, and speaks in the assembly. He says the disciples
    will become Buddhas, that his law accords with former and future Jinas, and that
    this law is rare like the blossom of the glomerous fig-tree. He declares himself
    king of the law, urges enlightenment, tells selected hearers to keep the mystery,
    and describes beings in the period of five depravities as blinded and corrupt.
  language: English
  quote_policy: summarized
