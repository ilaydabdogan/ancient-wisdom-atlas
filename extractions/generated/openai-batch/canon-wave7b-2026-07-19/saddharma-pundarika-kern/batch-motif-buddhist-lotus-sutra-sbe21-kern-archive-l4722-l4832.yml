canonical_text:
  quote: "“Verily, I am the father of these beings; I must save them from this mass
    of evil”"
  summary: 'The passage explains the burning-house parable: the triple world is likened
    to a decayed house on fire, while beings suffer and yet remain absorbed in play
    and sense pleasures. The Tathagata, calling himself their father, resolves to
    save them. Rather than relying on direct display of power, he uses an able device:
    he offers three vehicles, corresponding to disciples, Pratyekabuddhas, and Bodhisattvas,
    to draw beings out of the burning triple world and toward Buddha-knowledge. Editorial
    notes also identify Buddha iconographically as a benevolent father on a lotus
    seat and compare the burning motif with the Aditta-pariyaya sermon.'
  language: English
  quote_policy: quoted
