canonical_text:
  quote: ''
  summary: Brahma-angels come from many worlds, offer bright aerial cars to the Lord
    Mahabhi^/Ia^anabhibhu, and beseech him to teach the law, preach final rest, and
    release beings. A vast chorus asks him to show the law and save tormented beings;
    the Lord silently assents. Later, aerial cars in the south-eastern quarter shine
    with unusual splendour, prompting Brahma-angels, led in speech by AdhimatrakaruTzika,
    to wonder whether a divine being or Buddha has appeared and to resolve to search
    for the cause.
  language: English
  quote_policy: summarized
