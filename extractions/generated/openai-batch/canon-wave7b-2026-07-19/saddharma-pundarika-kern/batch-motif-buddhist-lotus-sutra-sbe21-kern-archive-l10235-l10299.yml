canonical_text:
  quote: '"were it but a single stanza"'
  summary: The Lord addresses a large assembly through Bhaishajyaraja and predicts
    supreme and perfect enlightenment for those who hear, accept, keep, recite, teach,
    copy, remember, or venerate even a small part of the Dharmaparyaya. Such young
    men and women are described as prior worshippers and vow-makers before countless
    Buddhas, reborn in Jambudvipa out of compassion, and as examples of beings who
    will become Tathagatas.
  language: English
