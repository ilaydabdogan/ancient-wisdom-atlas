canonical_text:
  quote: where that son of Buddha has stayed, there I am.
  summary: The passage instructs that a sage should reflect on going to the foot of
    the tree for supreme blessed enlightenment for the benefit of the world. Wherever
    such a sage recites even one stanza of the Sutra, a splendid Stupa dedicated to
    the Buddha should be built and worshipped. The Buddha declares that such a place
    is a place where he himself has walked and sat, and that he is present where the
    son of Buddha has stayed.
  language: English
