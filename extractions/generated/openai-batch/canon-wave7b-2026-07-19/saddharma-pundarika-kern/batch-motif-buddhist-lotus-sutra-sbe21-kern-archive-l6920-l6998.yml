canonical_text:
  quote: ''
  summary: A man born blind recovers eyesight through applied remedies and then claims
    that he sees all. Seers possessing five transcendent faculties rebuke his conceit,
    saying that he has only recovered sight and still lacks wisdom. They list things
    he still cannot perceive or remember and say he mistakes darkness for light and
    light for darkness. When he asks how to gain wisdom and such qualities, they instruct
    him to live in the wilderness or mountain caves, meditate on the law, and cast
    off evil passions. He becomes an ascetic, practices one-pointedness, abandons
    worldly desires, and acquires the five transcendent faculties.
  language: English
  quote_policy: summarized
