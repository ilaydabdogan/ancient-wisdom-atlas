canonical_text:
  quote: ''
  summary: The passage instructs a wise person or Bodhisattva Mahasattva to revere
    the Buddhas, forsake pride, observe and keep the Dharmaparyaya after the Tathagata's
    extinction, live charitably, and guide beings toward acceptance and understanding.
    It states that such an expounder will be honored and protected by human and divine
    beings, and introduces a simile of a king who rewards gallant soldiers after conquest
    and war.
  language: English
  quote_policy: summarized
