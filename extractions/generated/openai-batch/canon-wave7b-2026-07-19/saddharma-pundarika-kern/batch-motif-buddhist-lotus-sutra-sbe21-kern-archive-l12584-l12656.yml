  text: The Bodhisattva resolves, having attained supreme perfect knowledge, to bend
    the mind of everyone toward the teaching and bring them to acceptance, understanding,
    and full ripeness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: Possessing the fourth quality, the expounder after the Tathagata's extinction
    is said to be unmolested and honored by monastic, lay, royal, civic, and Brahman
    groups.
  category: relationship
  evidence_refs:
  - ev:3
