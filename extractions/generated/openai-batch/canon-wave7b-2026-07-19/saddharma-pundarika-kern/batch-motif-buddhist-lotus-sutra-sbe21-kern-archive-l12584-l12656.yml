- id: obs:2
  text: Forsaking pride is said to allow escape from hindrance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: One who has heard the law should observe it constantly and strive earnestly
    for a peaceful life; many beings are said to protect him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Bodhisattva Mahasattva living after the extinction of the Tathagata and
    during destruction of the true law is described as desiring to keep the Dharmaparyaya.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bodhisattva is instructed to live as far as possible away from laymen
    and friars and to lead a life of charity.
