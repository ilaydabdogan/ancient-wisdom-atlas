  summary: The passage announces the future destiny of an unnamed disciple who will
    honor exalted Ginas with precious stupas and offerings, then in his last bodily
    existence become a compassionate Buddha named Tamalapatra^andanagandha. His life,
    teaching activity, disciples, Bodhisattvas, and the duration of his true and counterfeit
    law are described on a kalpa scale. The speaker then refers to five mighty disciples
    destined for supreme enlightenment and future self-born Gina status, with notes
    on textual variants and the inferred fifth disciple.
