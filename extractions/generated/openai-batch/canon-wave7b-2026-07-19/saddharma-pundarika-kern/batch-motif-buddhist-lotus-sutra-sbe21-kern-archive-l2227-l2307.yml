canonical_text:
  quote: "“a single beam darted by him over the world renders visible so many thousands
    of fields”"
  summary: Maitreya describes Bodhisattvas worshipping relics and adorning innumerable
    stupas, a single ray from the Buddha revealing many fields, and the assembly asking
    Mañjusvara to explain the portent. Mañjusvara answers that the Tathagata intends
    to begin a grand discourse for teaching the law, figured as rain and drum.
  language: English
  quote_policy: quoted
