canonical_text:
  quote: ''
  summary: A philological introduction argues that the Sanskrit text of Buddhist canonical
    works, especially the Northern Sutras, is likely translated from an earlier dialectal
    source. It discusses examples from the Lalita-vistara involving Mapaniya/Mapaniyapraśna
    and airapatha, weighs Pali and the Gatha idiom as possible witnesses to an older
    Buddhist scriptural language, and notes close vocabulary relations with the Satapathabrahmana
    and the mixed language of the Mahavastu.
  language: English
  quote_policy: summarized
