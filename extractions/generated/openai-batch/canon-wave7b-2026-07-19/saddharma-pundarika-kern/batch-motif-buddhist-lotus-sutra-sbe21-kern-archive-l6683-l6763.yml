  text: The speaker says he preaches the law to persons of inferior mental culture
    and to persons of superior understanding and extraordinary faculties.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After hearing the speaker, beings are said to find their determined places
