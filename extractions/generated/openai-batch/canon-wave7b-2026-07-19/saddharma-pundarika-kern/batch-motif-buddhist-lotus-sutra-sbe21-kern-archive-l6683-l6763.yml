  text: The speaker says that whether walking, standing, or sitting, he is occupied
    with proclaiming the law and does not tire of the chair he has ascended.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker compares his action to a cloud shedding water without distinction
    and says he has the same feelings toward respectable and low people, moral and
    immoral people, depraved people, rule-observers, sectarian or unsound-view holders,
    and those with sound views.
  category: attribute
  evidence_refs:
  - ev:1
