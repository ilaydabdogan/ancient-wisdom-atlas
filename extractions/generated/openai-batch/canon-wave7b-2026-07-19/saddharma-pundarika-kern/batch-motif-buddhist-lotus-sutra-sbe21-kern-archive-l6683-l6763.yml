canonical_text:
  quote: '"I spread in season the rain of the law."'
  summary: The speaker describes tireless and impartial preaching of the law. The
    passage develops a parable in which one rain or water from a cloud reaches plants
    of different sizes, while beings with different faculties receive one law in different
    ways. Spiritual categories are named as small plants, mean plants, highest plants,
    trees, and great trees.
  language: English
  quote_policy: quoted
literal_observations:
