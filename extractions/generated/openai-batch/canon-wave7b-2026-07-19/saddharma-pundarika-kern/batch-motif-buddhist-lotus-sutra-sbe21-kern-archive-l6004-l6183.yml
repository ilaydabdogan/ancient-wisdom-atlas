canonical_text:
  quote: This is my son whom I lost a long time ago.
  summary: A wealthy father mourns a son who ran away fifty years earlier. The son
    wanders poor and ill, eventually reaches the father's city and mansion, and is
    frightened by the father's wealth. The father recognizes him but does not immediately
    disclose their relationship; instead he has low-status agents offer him menial
    work, then gradually brings him into the house and builds his confidence. After
    many years, the father publicly declares him his son and heir. The passage ends
    by applying the parable to a leader who knows the low disposition of disciples
    and calls them his sons.
  language: English
  quote_policy: quoted
