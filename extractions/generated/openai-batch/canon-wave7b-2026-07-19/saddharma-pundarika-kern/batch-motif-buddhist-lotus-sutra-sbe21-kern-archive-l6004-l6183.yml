  text: The father is sorrowful because his son ran away, and he roams the country
    in search of him for fifty years.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father comes to a great city, builds a house, possesses many kinds of
    wealth and servants, is honored by citizens and villagers, and remains sorrowful
    about his son as he grows old.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The son wanders from village to village, poor and miserable, begging for food
    and clothing, sometimes receiving something and sometimes not, and his body is
    afflicted with scabs and itch.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The son reaches the town where his father lives and comes to the father's
    mansion to beg for food and clothing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wealthy father sits at the door on a throne under a canopy and is surrounded
    by many beings and trustees who handle money, bills, and loans.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The son sees the splendid mansion, thinks the man may be a king or grandee,
    fears injury or forced labor, and hurries away toward the street of the poor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The father is glad to see his son and sends messengers to fetch him; the messengers
    seize the son, who faints because he thinks they are executioners.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The father thinks the son will not trust or accept his magnificence or believe
    he is his father, and sends low-status, ill-clad persons to offer him menial work
    cleaning a putrid heap of dirt for double salary.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The son accepts the call, cleans the heap, and lives in a hovel near the mansion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The father watches him through the windows, then descends with a basket and
    dirty garments, approaches him, chides him, later conciliates him, and says that
    he is surely his son.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Little by little, the father makes the son enter the house, employs him for
    twenty years, and inspires confidence in him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The father stores gold, pearls, and crystal in the house and keeps accounts,
    while the son living outside in a hovel thinks he has no such possessions.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The father calls an assembly including the king, burghers, citizens, and merchants,
    declares the poor man to be his long-lost son, and gives him all the family property.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The poor man is surprised, remembers his former poverty, receives his father's
