canonical_text:
  quote: "“there issued a ray from within the circle of hair between the eyebrows
    of the Lord”"
  summary: In a vast assembly before the Lord, a ray issues from the circle of hair
    between his eyebrows and illuminates eighteen hundred thousand Buddha-fields in
    the eastern quarter, revealing beings in the six states, Buddhas, teachings, Bodhisattvas,
    Buddhas in final Nirvana, and jewel Stupas with relics. Maitreya wonders about
    the cause of the prodigy and resolves to ask Manjusri, whom he regards as experienced
    with former Buddhas and their signs.
  language: English
  quote_policy: quoted
