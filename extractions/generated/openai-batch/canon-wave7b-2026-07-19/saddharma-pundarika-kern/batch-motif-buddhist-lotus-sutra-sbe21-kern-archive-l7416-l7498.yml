canonical_text:
  quote: ''
  summary: The passage continues a description of a future Buddha-field where Bodhisattvas
    and innumerable disciples appear and where Mara and his followers will later receive
    the true law. The Lord then predicts that the senior Kāśyapa will become a Buddha
    after honoring many Jinas and acquiring Buddha-knowledge. Kāśyapa’s future field
    is described as pure, ordered, adorned with gold, jewel-trees, flowers, and without
    uneven ground. Three elders—Mahā-Maudgalyāyana, Subhūti, and Mahā-Kātyāyana—tremble,
    gaze at the Lord, and request a prediction of their own destiny, comparing it
    to nectar and to food received in famine but delayed.
  language: English
  quote_policy: summarized
