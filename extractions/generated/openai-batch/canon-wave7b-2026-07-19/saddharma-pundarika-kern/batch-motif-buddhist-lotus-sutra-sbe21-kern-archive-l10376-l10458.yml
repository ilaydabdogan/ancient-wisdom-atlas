canonical_text:
  quote: ''
  summary: The Lord teaches that the preacher, keeper, copier, hearer, or guardian
    of this Sutra should be honored with offerings and salutation. The preacher is
    described as sent by the Lord, acting from compassion, performing the task of
    the Tathagatas, and aiding beings toward supreme enlightenment. The passage contrasts
    merit gained by praising the Lord with greater merit gained by praising the preachers,
    and it treats reviling the guardians of the Sutra as a grave sin.
  language: English
  quote_policy: summarized
