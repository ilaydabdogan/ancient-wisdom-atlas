canonical_text:
  quote: a great earthquake and a great, sublime lustre arose simultaneously
  summary: A cosmic earthquake and radiance affect the spheres and the aerial cars
    of eastern Brahma-angels. The angels consult and wonder whether a divine being
    or Buddha has been born. They travel with celestial flowers to the western quarter,
    find the Tathagata Mahabhijnajnanabhibhu seated at the enlightenment tree while
    his sons urge him to turn the wheel of the law, and worship him with circumambulation,
    flowers, aerial cars, and praise.
  language: English
  quote_policy: quoted
