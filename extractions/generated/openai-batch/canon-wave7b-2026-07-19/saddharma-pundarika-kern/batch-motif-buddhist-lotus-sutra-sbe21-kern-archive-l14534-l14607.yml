canonical_text:
  quote: ''
  summary: The Lord tells Ajita that, after the Tathagata's complete extinction, one
    who keeps, reads, promulgates, or writes this Dharmaparyaya gains immeasurable
    merit and is treated as having performed relic-stupa worship. Such a keeper is
    described as virtuous, meditative, and moving toward enlightenment; wherever that
    person stands, sits, or walks should be treated as a Tathagata shrine or relic
    stupa. Stanzas repeat the merit and describe splendid stupas reaching to the Brahma-world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the speaker's complete extinction, a person who keeps, reads, promulgates,
    or writes the Dharmaparyaya is said not to need to build relic stupas or worship
    the congregation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A keeper who crowns the practice with alms, morality, forbearance, energy,
    meditation, or wisdom is said to produce immense, incalculable, infinite merit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The accumulation of merit is compared with the boundlessness of ether in all
    directions.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The keeper is described as worshipping Tathagata shrines, lauding the disciples,
    praising the virtues of Bodhisattvas Mahasattvas, and expounding those virtues
    to others.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The keeper is described as forbearing, moral, tolerant, modest, not jealous,
    not wrathful, devoted to meditation, and able in solving or avoiding many questions.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Such a keeper is said to make for the terrace of enlightenment and to step
    toward the foot of the tree of enlightenment in order to reach enlightenment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Where the keeper stands, sits, or walks, a shrine dedicated to the Tathagata
    should be made, and the world including the gods should call it a stupa of relics
    of the Tathagata.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The stanzas say that the keeper has paid worship and built relic stupas made
    of precious substances, high enough to come up to the Brahma-world and decorated
    with umbrellas, streamers, bells, and silk bands.
  category: object
  evidence_refs:
  - ev:6
