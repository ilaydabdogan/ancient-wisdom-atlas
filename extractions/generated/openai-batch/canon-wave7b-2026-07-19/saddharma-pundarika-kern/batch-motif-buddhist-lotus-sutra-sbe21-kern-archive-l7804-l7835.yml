canonical_text:
  quote: ''
  summary: 'The passage opens Chapter VII, titled “Ancient Devotion,” and describes
    an inconceivably remote past in which a Tathagata named Mahabhigñaganabhibhu appeared
    in the world. The Buddha explains the remoteness of that birth by a cosmic dust
    analogy: a man reduces the earth element of the whole universe to powder, carries
    atoms eastward across thousands of worlds, and deposits them one by one.'
