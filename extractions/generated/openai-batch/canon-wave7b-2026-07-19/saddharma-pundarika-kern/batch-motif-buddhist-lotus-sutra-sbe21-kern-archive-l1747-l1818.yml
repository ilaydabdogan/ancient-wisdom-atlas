canonical_text:
  quote: ''
  summary: 'The introductory passage enumerates a large assembly: named venerable
    disciples, monks, nuns led by Mahapra^apatl and Ya-s-odhara, eighty thousand Bodhisattvas
    with wisdom and non-retrogression attributes, named Bodhisattva chiefs, sixteen
    virtuous men, 6akra with gods, four rulers of the cardinal points, and the gods
    Lvara and Mahejvara with retinues.'
