canonical_text:
  quote: ''
  summary: The passage announces Ananda-Bhadra’s future Buddhahood, names his future
    Buddha-field, describes vast numbers of Bodhisattvas and beings connected with
    his teaching, and explains to newly entered Bodhisattvas that Ananda and the Lord
    had once conceived the thought of perfect enlightenment at the same instant before
    an earlier Tathagata. Ananda is described as devoted to learning, as keeper of
    the law-treasure, and as one who vowed to bring Bodhisattvas to full development.
  language: English
  quote_policy: summarized
