canonical_text:
  quote: ''
  summary: The Lord asks the monks whether they see King Subhavyuha standing in the
    sky and emitting a lion's roar; they confirm. The Lord prophesies that Subhavyuha
    will become a monk and later a Tathagata named Salendrara^a in the world Vistir^avatl.
    He then identifies the king, queen, and two princes of the earlier account with
    present Bodhisattvas, explains the queen's compassionate assumption of the role
    of wife, praises the two sons' roots of merit, and says those who cherish their
    names will be worthy of homage. While the chapter is expounded, the spiritual
    insight of eighty-four thousand beings is purified.
  language: English
  quote_policy: summarized
