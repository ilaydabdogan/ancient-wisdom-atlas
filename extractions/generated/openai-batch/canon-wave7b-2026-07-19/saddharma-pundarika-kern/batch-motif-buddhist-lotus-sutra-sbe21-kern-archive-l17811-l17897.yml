canonical_text:
  quote: ''
  summary: Verses describe dangers from beasts, snakes, thunderbolts, conflict, death,
    disaster, and calamity. In each danger, one is instructed to think of Avalokitesvara,
    whose knowledge, compassion, magical power, voice, radiance, and protective role
    are praised. Akshayamati then joyfully utters stanzas praising Avalokitesvara
    as compassionate, radiant, cloud-like, a pourer of the rain of the law, a protector,
    refuge, and worthy of adoration.
  language: English
  quote_policy: summarized
