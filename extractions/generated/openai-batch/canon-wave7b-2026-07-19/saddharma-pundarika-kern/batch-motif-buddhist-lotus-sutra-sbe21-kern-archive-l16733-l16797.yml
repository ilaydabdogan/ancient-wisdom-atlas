canonical_text:
  quote: ''
  summary: After the Tathagata's body is burned and the fire is extinguished, the
    Bodhisattva Mahasattva Sarvasattvapriyadarsana gathers the bones, mourns, places
    them in eighty-four thousand precious urns, and founds eighty-four thousand adorned
    Stupas. Seeking a still higher honor for the relics, he calls an assembly to vow
    worship, burns his own auspiciously marked arm before the Stupas, and continues
    this worship for seventy-two thousand years while instructing countless disciples.
    The assembly laments his lost arm; he tells them not to weep and invokes Buddhas
    in all directions as witnesses to a vow of truth by which his arm is to become
    as before and his body gold-colored.
  language: English
  quote_policy: summarized
