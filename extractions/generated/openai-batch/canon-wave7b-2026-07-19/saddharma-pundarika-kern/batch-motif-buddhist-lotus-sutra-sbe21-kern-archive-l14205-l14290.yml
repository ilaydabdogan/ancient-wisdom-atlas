canonical_text:
  quote: ''
  summary: 'The passage describes the effects of learning and hearing the revelation
    of the Tathagata''s life-duration: some beings approach all-knowledge, innumerable
    beings conceive superior enlightenment, and cosmic beings offer flowers, fragrance,
    cloth, music, censers, umbrellas, banners, and verses. The Lord then addresses
    Maitreya/Ajita about the great merit produced even by a single thought of trust
    in this teaching, introducing a comparison with long practice of the five perfections
    excluding wisdom.'
  language: English
  quote_policy: summarized
literal_observations:
