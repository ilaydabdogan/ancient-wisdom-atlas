canonical_text:
  quote: ''
  summary: A speaker interprets the Tathagata's lustrous ray as a miraculous foretoken
    that he will make a grand exposition of the law, noting that former Tathagatas
    emitted a similar sign. The speaker then recalls an ancient Tathagata named Candrasuryapradipa,
    who taught the law to disciples through the four Noble Truths and causal chain
    leading to Nirvana, and to Bodhisattvas through the six Perfections leading to
    omniscient knowledge.
  language: English
  quote_policy: summarized
