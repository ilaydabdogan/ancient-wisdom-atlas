canonical_text:
  quote: ''
  summary: An immense host of bodhisattvas is described as long-trained, powerful,
    and advanced in Tathagata-knowledge, meditation, and transcendent wisdom. The
    Lord says he himself has matured them from the beginning. The claim prompts concern
    that newer and future bodhisattvas may doubt or reject the teaching. Maitreya
    then addresses the Lord in verses, contrasting the Lord’s recent birth at Kapilavastu
    and enlightenment at Gaya with the ancient discipline of the newly appeared sages,
    who are said to have come after rending the earth, standing reverently with joined
    hands.
  language: English
  quote_policy: summarized
