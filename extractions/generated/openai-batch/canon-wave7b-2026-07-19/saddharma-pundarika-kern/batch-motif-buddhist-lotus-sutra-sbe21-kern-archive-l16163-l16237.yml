canonical_text:
  quote: ''
  summary: The Lord addresses Bodhisattvas and says the power of the Tathagatas and
    the virtues of this Dharmaparyaya are inconceivable and inexhaustible. He instructs
    them to keep, read, promulgate, cherish, and worship it after the Tathagata's
    complete extinction. Wherever the text is made known, studied, written, meditated
    on, expounded, or gathered into a volume, a shrine should be erected; such a place
    is to be regarded as a terrace of enlightenment and as a site connected with all
    Tathagatas' enlightenment, turning of the law-wheel, and extinction. The stanzas
    describe cosmic miraculous displays by Buddhas, including a tongue extended over
    the world, beams of light, and sounds or gestures calling the world's attention,
    all intended to encourage beings to keep the Sutra after the Sugata's extinction.
  language: English
  quote_policy: summarized
