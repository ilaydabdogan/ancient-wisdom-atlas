canonical_text:
  quote: ''
  summary: The passage first describes the future Buddhahood and pure Buddha-field
    of Punza, who will become the Buddha Dharmaprabhasa. It then narrates the thought
    of twelve hundred self-controlled Arhats who desire similar predictions, and the
    Lord foretells future enlightenment for Kaundinya and five hundred disciples under
    the shared name Samantaprabhasa.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The future figure is said to honor thousands of kotis of Buddhas, acquire
    knowledge of eminent good laws, and clean his own field.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He is described as preaching the law without timidity, using many able devices,
    and bringing many beings to ripeness for the knowledge of the all-knowing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After homage to the chiefs of men and keeping the laws, he is said to become
    a self-born Buddha named Dharmaprabhasa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: His field is described as very pure, adorned with seven precious substances,
    with an eon called Ratnavabhasa and a world called SuvLmddha.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: That world is said to contain many kotis of Bodhisattvas and an assemblage
    of many kotis of disciples, both described with advanced powers or attainments.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: All beings in the Buddha-field are described as pure, leading a spiritual
    life, arising by apparitional birth, gold-coloured, and displaying thirty-two
    signs.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The beings in that field are said to have no food except pleasure in the law
    and delight in knowledge; the field is also said to lack womankind, fear of punishment
    places, and dismal states.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The twelve hundred self-controlled Arhats inwardly feel wonder and desire
    that the Tathagata would predict each of their future destinies as he had done
    for other great disciples.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Lord knows what is occurring in the minds of those disciples and tells
    Maha-Kasyapa that he will foretell the destiny of the twelve hundred hearers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The monk Kaundinya is predicted to become a Tathagata named Samantaprabhasa
    after attending many Buddhas, and five hundred great disciples are said to reach
    perfect enlightenment with the same name.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
