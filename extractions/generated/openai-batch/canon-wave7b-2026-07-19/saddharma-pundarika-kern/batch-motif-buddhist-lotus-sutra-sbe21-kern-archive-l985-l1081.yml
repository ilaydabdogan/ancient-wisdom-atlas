canonical_text:
  quote: ''
  summary: The passage presents the Lotus Sutra as the supreme sutra for the Northern
    Church and gives a chapter-by-chapter synopsis of its opening seventeen chapters,
    including the Lord's awakening from trance, the doctrine of one vehicle behind
    apparent multiple vehicles, prophecies, parables of rescue and guidance, impartial
    care, future and past knowledge, protection of future preachers, the appearance
    of a stupa containing Prabhutaratna, bodily transformation, future preaching after
    Nirvana, rewards for religious struggle, a miraculous bodhisattva manifestation,
    and the revelation of the Buddha's immense lifespan.
  language: English
  quote_policy: summarized
