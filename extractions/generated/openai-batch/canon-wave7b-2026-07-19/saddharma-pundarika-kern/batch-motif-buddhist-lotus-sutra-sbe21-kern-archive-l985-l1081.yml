comparison_claims:
- id: claim:1
  claim: The passage itself, in an editorial note, compares the Lotus parable of plants
    and rain as an image of impartial care for all creatures with Bhagavad-gita IX.29,
    where Narayana declares equality toward all creatures and says none is hateful
    or beloved.
  claim_level: same_function
  target: Bhagavad-gita IX.29 / Narayana's declaration of equality toward all creatures
  evidence_refs:
  - ev:5
  - ev:6
  counter_evidence_refs: []
  confidence: high
  limitations: This is an explicit textual note in the supplied passage, but it supports
    functional comparison only; it does not establish historical contact, common inheritance,
    or identity of traditions.
