canonical_text:
  quote: Trust me, young men of good family, believe in the Tathagata speaking a veracious
    word.
  summary: The Lord opens the chapter on the duration of the Tathagata's life by repeatedly
    asking the Bodhisattvas to trust his truthful word. The Bodhisattva host, led
    by Maitreya, joins hands and repeatedly asks him to expound the matter. The Lord
    then begins to speak of his strong resolve and says the world, including gods,
    men, and demons, acknowledges Sakyamuni's departure from the home of the Sakyas
    and attainment of supreme enlightenment.
