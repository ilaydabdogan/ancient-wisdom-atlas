canonical_text:
  quote: ''
  summary: The passage states that Avalokite-svara moves in the Saha-world with a
    faculty of transformation. In stanzas, Altradhvaja asks Akshayamati why Avalokite-svara
    is so called. Akshayamati describes Avalokite-svara's long vow under many Buddhas
    and says that hearing, seeing, and thinking of him destroys suffering. A series
    of examples then says that thinking of Avalokite-svara saves beings from fire,
    drowning, a fall from Meru, thunderstone and thunderbolts, armed enemies, execution,
    shackles, spells, and hostile supernatural beings.
  language: English
  quote_policy: summarized
