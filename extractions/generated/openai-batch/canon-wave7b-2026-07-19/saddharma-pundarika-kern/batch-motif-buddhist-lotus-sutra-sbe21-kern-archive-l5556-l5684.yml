canonical_text:
  quote: '"We have acquired a magnificent jewel, O Lord, an incomparable jewel."'
  summary: The passage moves from an instruction to preach this Sutra to an assembly
    scene in which four senior disciples express astonishment at hearing that disciples
    may be destined for supreme perfect enlightenment. They confess that, being old
    and believing they had attained Nirvana, they had not longed for the Buddha-laws.
    They compare their unexpected gain to receiving a magnificent jewel, then begin
    a parable of a poor son separated from his wealthy father for many years and unknowingly
    arriving where the father resides.
  language: English
  quote_policy: quoted
