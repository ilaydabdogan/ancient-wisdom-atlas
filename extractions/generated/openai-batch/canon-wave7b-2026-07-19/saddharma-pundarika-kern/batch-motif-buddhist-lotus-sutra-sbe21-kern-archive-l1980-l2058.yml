canonical_text:
  quote: ''
  summary: Various human and non-human beings witness a great miracle of the Lord
    and wonder about its cause. Maitreya perceives the thoughts of the four classes
    of hearers and asks Mangusri about the miraculous shine. In verse, he describes
    a ray from the Lord’s brow, rains of flowers and sandal powder, the earth shaking,
    eighteen thousand Buddha-fields illuminated, beings visible across six states
    of existence, and Buddhas teaching the law, rest from trouble, and the vehicle
    of the Pratyekabuddhas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Goblins, Gandharvas, demons, Garudas, Kinnaras, great serpents, men, and non-human
    beings see the Lord’s great miracle and are astonished and curious about its cause.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Maitreya knows the thoughts arising in the minds of the four classes of hearers
    and speaks to Mangusri, the prince royal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Maitreya asks why the Lord has produced a wonderful miraculous shine and points
    to eighteen thousand Buddha-fields appearing beautiful and overseen by Tathagatas.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A single ray shines from between the brows, from the circle of hair, of the
    guide of men.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: An abundant rain of Mandaravas is mentioned in connection with the ray.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The gods, described as overjoyed, let fall Mañjushakas and divine fragrant
    sandal powder.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The earth is filled with splendour, the assembly is delighted, and the whole
    field shakes in six different ways.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The ray illuminates eighteen thousand Buddha-fields in the eastern quarter,
    making them appear gold-coloured.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Beings in the illuminated fields, including those in six states of existence
    and those leaving one state to be born in another, become visible along with their
    different actions and positions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Buddhas are seen revealing the essence of the law, comforting many creatures,
    and proclaiming Buddha-laws with voices, illustrations, and proofs.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: To creatures distressed by birth and old age, the Buddhas announce the bliss
    of Rest and the end of trouble; to others with strength, merit, virtue, or belief,
