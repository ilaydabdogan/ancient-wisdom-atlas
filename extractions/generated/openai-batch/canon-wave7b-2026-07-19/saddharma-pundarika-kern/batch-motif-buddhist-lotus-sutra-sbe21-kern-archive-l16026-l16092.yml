  summary: At the opening of the chapter on the transcendent power of the Tathagatas,
    vast groups of Bodhisattvas and other beings pledge to promulgate and preserve
    the Dharmaparyaya after the Tathagata's complete extinction. The Lord approves
    Vi.rish/a/£aritra. Śakyamuni and Prabhutaratna, seated together in the centre
    of the Stupa, smile, extend their tongues to the Brahma-world, emit rays, and
    from each ray emerge countless gold-coloured Bodhisattvas seated on lotus thrones.
