canonical_text:
  quote: ''
  summary: The passage announces Devadatta's future Buddhahood as the Tathagata Devaraja,
    describes the stupa that will contain his undivided body and the benefits of worshipping
    it, states benefits for future hearers of this Lotus Sutra chapter, and narrates
    Manjusri's ascent from the sea on a lotus with a manifestation of many lotus-seated
    Bodhisattvas educated by him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lord announces that Devadatta the monk will, after innumerable aeons,
    become a Tathagata named Devaraja in the world Devasopana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The future Tathagata Devaraja will preach the law, and many beings will attain
    Arhatship, Pratyekabuddhaship, or supreme perfect enlightenment through him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After Devaraja's complete extinction, his body will remain undivided as one
    mass inside a stupa of seven precious substances.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gods and humans will worship the stupa with offerings, and those who circumambulate
    or salute it will attain forms of liberation or enlightenment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A future young man or young woman of good family who hears and trusts this
    chapter will avoid rebirth in hell, among beasts, or in Yama's kingdom.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Such a future hearer will be born in Buddha-fields, hear the Sutra again,
    and appear by metamorphosis on a lotus of seven precious substances before the
    Tathagata.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Bodhisattva Prajnakuta comes from beneath the Buddha-field of Prabhutaratna
    and asks Prabhutaratna to return to their own Buddha-field.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sakyamuni tells Prajnakuta to wait and first discuss a point of law with Manjusri.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Manjusri rises from the sea, from the abode of the Naga-king Sagara, seated
    on a large centifolious lotus and surrounded by many Bodhisattvas.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Manjusri travels through the air to Grdhrakuta mountain, salutes Sakyamuni
    and Prabhutaratna, exchanges greetings with Prajnakuta, and sits apart.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Prajnakuta asks Manjusri how many beings he educated while staying in the
    sea, and Manjusri answers that they are innumerable and that a token will soon
    be seen.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Thousands of lotuses rise from the sea to the sky, each bearing Bodhisattvas
    who fly to Grdhrakuta mountain and appear like meteors.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The lotus-borne Bodhisattvas had been educated by Manjusri to supreme perfect
    enlightenment and praise the great vehicle, the six Paramitas, the vehicle of
    disciples, and the voidness of all things.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Manjusri says that while he stayed in the great ocean he educated creatures
    by all means, and Prajnakuta responds in verse by asking by whose power the innumerable
    beings were educated.
  category: speech
  evidence_refs:
  - ev:8
