canonical_text:
  quote: Under so many shapes, assumed at will, has the Bodhisattva Mahasattva Gadgadasvara
    preached this Dharmaparyaya of the Lotus of the True Law to creatures.
  summary: Gadgadasvara is described as preaching the Lotus of the True Law by assuming
    many divine, human, monastic, lay, gendered, youthful, nonhuman, and religious
    forms. He supports beings in the Saha-world and in lower states, preaches after
    metamorphosing into a woman, and teaches in other worlds without diminution of
    wisdom or magic power.
  language: English
  quote_policy: quoted
