canonical_text:
  quote: ''
  summary: The passage discusses whether the Lotus's opening distich belongs to a
    compiler or copyist, then presents the Lotus as a standard Mahayana work. It describes
    the Tathagata of the Lotus as passionless but not egoistic, contrasts Mahayana's
    universal aim of saving living creatures with early Buddhist Arahatship, and explains
    the Lotus teaching that everyone should try to become a Buddha. It outlines three
    practical Vehicles—disciples, Pratyekabuddhas, and Bodhisattvas—unified in one
    Buddha-vehicle, with notes comparing these categories to the Bhagavad-gita and
    Indian life-stage terms.
  language: English
  quote_policy: summarized
