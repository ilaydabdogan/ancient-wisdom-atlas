canonical_text:
  quote: ''
  summary: The speaker describes seeing groups of sons of the Sugata/Gina and Bodhisattvas
    who preach the law, rouse beings to enlightenment, conquer the Evil One, dwell
    in forests or caves, practice energy, morality, forbearance, meditation, charity,
    science, and wisdom, and make offerings to Ginas/Sugatas and their disciples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some sons of the principal G'ma, after developing their own self, preach the
    law to many living beings with many illustrations and reasons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some joyfully proclaim the law, rouse many Bodhisattvas, conquer the Evil
    One with his hosts and vehicles, and strike the drum of the law.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some sons of the Sugata are described as humble, calm, quiet in conduct, living
    under the command of the Sugatas, and honored by men, gods, goblins, and Titans.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some who have retired to woody thickets save creatures in the hells by emitting
    radiance from their body and rouse them to enlightenment.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some sons dwell in the forest, renounce sloth, remain actively engaged in
    walking, and strive for supreme enlightenment by energy.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some complete their course by constant purity and unbroken morality, compared
    to precious stones and jewels.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some endure abuse, censure, and threats from proud monks and try to attain
    enlightenment by forbearance.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some Bodhisattvas forsake wanton pleasures, shun unwise companions, and delight
    in intercourse with aryas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Some avoid distraction of thoughts and meditate with attentive mind in caves
    of the wilderness for thousands of ko/is of years.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Some offer food, drink, medicaments, clothing, monasteries, and gardens in
    the presence of the Ginas/Sugatas/leaders of men and their disciples.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: After making various splendid donations with joyful feelings, some rouse their
    energy to obtain enlightenment by charitableness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: Others set forth the law of quietness with many illustrations and proofs,
    preach to thousands of living beings, and seek enlightenment by wisdom while understanding
    the law of indifference.
  category: speech
  evidence_refs:
  - ev:5
