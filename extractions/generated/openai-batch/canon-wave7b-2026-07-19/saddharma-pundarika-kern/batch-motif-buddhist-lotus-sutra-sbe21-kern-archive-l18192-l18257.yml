canonical_text:
  quote: ''
  summary: A Tathagata instructs King Subhavyuha by sermon. The king transfers royal
    authority to his younger brother, then goes forth from home with his sons, queen,
    kinsmen, retinue, women, and many living beings. As an ascetic he studies and
    meditates on the Lotus of the True Law for eighty-four thousand years, attains
    a named meditation, rises into the sky, and declares that his two sons are his
    masters and true friends because their magical power turned him away from false
    doctrines and toward the Lord. The Tathagata affirms that true friends perform
    the task of a master and prepare beings for supreme enlightenment.
  language: English
  quote_policy: summarized
