canonical_text:
  quote: ''
  summary: The passage defines the proper sphere and first proper sphere of a Bodhisattva
    Mahasattva. It instructs the Bodhisattva to avoid serving, courting, or keeping
    intercourse with various social, religious, occupational, and entertainment groups,
    except to preach the law freely when they come to him. It adds rules for avoiding
    repeated or affectionate contact with females, a hermaphrodite, novices, monks,
    nuns, and young people; for entering a house alone for alms only while thinking
    of the Tathagata; and for preaching without passionate attachment or expressive
    display. It then describes the Bodhisattva as viewing all laws and things as void,
    unaltered, unchangeable, spacelike, beyond common speech, unborn, and not expressible
    in words.
  language: English
  quote_policy: summarized
