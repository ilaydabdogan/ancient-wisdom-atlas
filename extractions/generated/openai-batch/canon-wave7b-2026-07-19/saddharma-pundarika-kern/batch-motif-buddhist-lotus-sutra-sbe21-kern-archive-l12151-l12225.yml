  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Bodhisattva Mahasattva does not address or converse with novices, nuns,
    monks, young boys, or young girls, and he does not show eagerness or frequency
    in answering their addresses.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Bodhisattva Mahasattva looks upon all laws and things as void and sees
