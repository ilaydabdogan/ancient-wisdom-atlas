  text: The Bodhisattva Mahasattva is instructed not to serve, court, wait upon, visit,
    or keep intercourse with persons of another sect, persons fond of fine literature,
    adepts at worldly spells, votaries of worldly philosophy, and several occupational
    or entertainment groups, except to preach the law freely when they come to him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Bodhisattva Mahasattva is instructed not to serve or keep intercourse
    with monks, nuns, and male or female lay devotees who adhere to the vehicle of
    disciples, and not to contact them at the promenade or monastery except to preach
    freely when they come.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Bodhisattva Mahasattva is instructed not to seek repeated opportunities
    to preach to females, not to desire repeated seeing of females, not to address
