  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Bodhisattva Mahasattva is instructed not to preach the law to a hermaphrodite,
    keep intercourse with such a person, or greet such a person too friendly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Bodhisattva Mahasattva does not enter a house alone to receive alms unless
    he has the Tathagata in his thoughts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When preaching the law to females, the Bodhisattva Mahasattva does not do
