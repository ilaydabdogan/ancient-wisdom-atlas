canonical_text:
  quote: for a single moment believes in it ; this merit is endless.
  summary: The passage contrasts long meditative and virtuous practice over vast spans
    of time with the immeasurable merit of briefly believing in the duration of the
    Tathagata's life. Bodhisattvas are said not to be startled by this long life and
    to aspire to emulate Sakyamuni, who sat on the terrace of enlightenment and raised
    the lion's roar. The prose states that hearing, understanding, transmitting, writing,
    collecting, and ritually honoring this Dharmaparyaya produces merit conducive
    to Buddha-knowledge.
  language: English
  quote_policy: quoted
