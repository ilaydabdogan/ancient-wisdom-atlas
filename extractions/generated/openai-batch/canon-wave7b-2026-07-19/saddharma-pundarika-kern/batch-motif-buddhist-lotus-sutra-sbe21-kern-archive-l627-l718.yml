  summary: The passage is a textual-critical introduction comparing chapter order
    across Sanskrit and Chinese witnesses of the Saddharma-pundarika. It argues that
    chapters xxi-xxvi are later additions, identifies the Dharmaparyaya as the original
    epilogue, offers approximate dating for the older text and addenda, and discusses
    Vasubandhu's commentary and related chronological evidence.
  language: English
  quote_policy: summarized
