canonical_text:
  quote: these Bodhisattvas are my sons.
  summary: The Lord says that the Bodhisattvas have been brought to maturity by him
    alone, live as hermits, dwell in the domain of ether, seek superior knowledge,
    preach the law, and are his sons. He connects this maturation to his enlightenment
    at Gaya at the foot of a tree and to his setting in motion the wheel of the law.
    Maitreya and many Bodhisattvas are amazed and ask how, in a short span since the
    Tathagata's enlightenment, he could have matured an innumerable host who seem
    to have practiced for aeons. Maitreya compares the claim to a young man saying
    centenarians are his sons.
  language: English
  quote_policy: quoted
