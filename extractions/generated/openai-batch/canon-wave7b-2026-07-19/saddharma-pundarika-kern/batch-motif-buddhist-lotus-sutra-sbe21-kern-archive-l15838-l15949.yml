canonical_text:
  quote: ''
  summary: The passage recounts how the Bodhisattva Sadaparibhuta, near death, heard
    the Lotus of the True Law from a disembodied voice in the sky, gained perfections
    of the faculties, vowed to prolong his life, and preached the teaching. Former
    proud opponents became followers. Across vast periods he honored many Tathagatas,
    obtained and preached the same teaching, and finally attained supreme enlightenment.
    The speaking Lord identifies himself as the former Sadaparibhuta and explains
    the karmic consequences and eventual enlightenment of those who had mocked him.
    The passage closes with an exhortation to keep, read, and promulgate the Dharmaparyaya
    after the Tathagata's extinction.
  language: English
  quote_policy: summarized
