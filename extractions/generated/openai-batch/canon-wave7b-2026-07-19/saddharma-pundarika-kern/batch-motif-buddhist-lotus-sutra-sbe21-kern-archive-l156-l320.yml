canonical_text:
  quote: ''
  summary: The introduction argues that works such as the Lalita-vistara contain materials
    of different dates and sources, including older Buddhist material. It compares
    passages from the Lalita-vistara with the Mahavagga, especially verses on the
    difficulty of proclaiming profound dharma, Brahma's request involving the opening
    of the door of the deathless, and the Buddha's encounter with Upaka. The author
    repeatedly treats these parallels as literal or near-literal textual correspondences
    with shared origin despite variations.
  language: English with Pali and Sanskrit transliteration
  quote_policy: summarized
