canonical_text:
  quote: ''
  summary: Maha-Kasyapa asks why distinctions among disciples, Buddhas, and Bodhisattvas
    persist if there are not three vehicles. The Lord answers with an analogy of different
    vessels made from the same clay, says there is one Buddha-vehicle and one Nirvana,
    and begins a parable of a blind-born man and a physician who seeks four herbs
    in the Himalaya to treat him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maha-Kasyapa asks why the designations of disciples, Buddhas, and Bodhisattvas
    are still used if there are not three vehicles.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord compares the matter to a potter making different vessels from the
    same clay for different contents, including sugar, ghee, curds and milk, and impurity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Lord states that there is one vehicle, the Buddha-vehicle, and not a second
    or third vehicle.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Maha-Kasyapa asks whether beings of different dispositions who have left the
    triple world have one, two, or three Nirvanas.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Lord says Nirvana follows from understanding that all laws or things are
    equal, and that there is one Nirvana, not two or three.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Lord says he will tell a parable, stating that people of good understanding
    can grasp what is taught in parable form.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the parable, a blind-born man says there are no handsome or ugly shapes,
    no people able to see such shapes, no sun or moon, no asterisms or planets, and
    no people able to see planets.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Other persons tell the blind-born man that visible shapes, sighted people,
    the sun and moon, asterisms and planets, and people who see planets do exist,
    but he does not believe or accept what they say.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A physician who knows all diseases sees the blind-born man and reflects that
    the man's disease originates in sinful actions in former times.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'The physician classifies possible diseases as fourfold: rheumatical, cholerical,
    phlegmatical, and caused by a complication of corrupted humours.'
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The physician concludes that common drugs cannot cure the disease and identifies
    four herbs in the Himalaya, the king of mountains.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The four herbs are named Possessed-of-all-sorts-of-colours-and-flavours, Delivering-from-all-diseases,
    Delivering-from-all-poisons, and Procuring-happiness-to-those-standing-in-the-right-place.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Feeling compassion for the blind-born man, the physician devises a way to
    get to the Himalaya, searches up and down and across, and finds the four herbs.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The physician administers or prepares the herbs by chewing, pounding, mixing
    and boiling, mixing with a raw drug, piercing a vein with a lancet, and singeing
    in fire.
  category: action
  evidence_refs:
  - ev:9
