canonical_text:
  quote: ''
  summary: 'The passage describes the benefits granted to one who proclaims or writes
    the Dharmaparyaya: a perfected organ of taste, all flavors becoming divine, a
    sweet and deep preaching voice that satisfies listeners, and universal desire
    among gods, supernatural beings, humans, rulers, disciples, Pratyekabuddhas, and
    Buddhas to see and honor the preacher. The preacher is said to preach facing the
    Tathagata and to be a worthy vessel of Buddha-qualities.'
  language: English
  quote_policy: summarized
