canonical_text:
  quote: ''
  summary: 'The passage explains several analogies: passions and false theories as
    bodily humours or diseases; herbs and drugs as principles that suppress ignorance;
    recovered eyesight as the state of a disciple or Pratyekabuddha votary released
    from passion but not yet at full Nirvana; the Tathagata rousing such a disciple
    to enlightenment; the triple world seen as void and like magic, dream, mirage,
    or echo; Tathagata wisdom shining impartially like sun and moon; and a potter
    making diverse vessels from the same clay for different contents.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Attachment, aversion, and infatuation are compared to rheum, bile, and phlegm,
    and the sixty-two false theories are also treated as bodily faults or corruptions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Four herbs are compared to vanity or voidness, causelessness or purposelessness,
    unfixedness, and reaching Nirvana.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Different drugs heal different diseases; developing the named principles of
    emancipation suppresses ignorance and then the whole mass of evils.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man who recovers his eyesight is compared to a votary of the vehicle of
    the disciples and of Pratyekabuddhas.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The votary rends the ties of evil passion in the whirl of the world and is
    released from the triple world with its six states of existence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The votary may say that there are no more laws to penetrate and that he has
    reached Nirvana, but the Tathagata questions this claim and preaches to him.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:7
  text: The Lord rouses the disciple to enlightenment; after consciousness of enlightenment
    is awakened, the disciple no longer stays in the mundane whirl but has not yet
    reached Nirvana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: With true insight, the disciple views the triple world as void and resembling
    magic, dream, mirage, and echo.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that all laws and phenomena are unborn and undestroyed,
    not bound and not loose, not dark and not bright.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Lord utters stanzas comparing the rays of the sun and moon descending
    alike on good and bad people to the Tathagata's wisdom shining without partiality.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A potter makes vessels from the same clay for different contents, including
    sugar, milk, ghee, water, impurities, and curdled milk.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A vessel receives distinguishing qualities according to the substance placed
