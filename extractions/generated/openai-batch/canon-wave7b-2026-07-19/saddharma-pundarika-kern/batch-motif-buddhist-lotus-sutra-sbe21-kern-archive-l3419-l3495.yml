canonical_text:
  quote: |-
    There is, indeed, but one vehicle; there is no
    second, nor a third anywhere in the world
  summary: The speaker describes showing Nirvana and Buddha-knowledge through adapted
    means, waiting for the proper time, teaching in nine divisions according to the
    strength of creatures, revealing amplified Sutras to prepared recipients, announcing
    their future Buddhahood, and affirming that there is ultimately one vehicle rather
    than multiple final vehicles.
  language: English
  quote_policy: quoted
