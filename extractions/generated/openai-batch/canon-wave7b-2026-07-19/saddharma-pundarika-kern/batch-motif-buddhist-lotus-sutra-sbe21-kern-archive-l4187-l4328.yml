canonical_text:
  quote: ''
  summary: Sariputra recounts leaving heterodox views, fearing at first that the Buddha's
    voice might be Mara in disguise, and then becoming confident through the Buddha's
    teaching and skilful explanations. The Lord publicly declares that Sariputra has
    long been prepared for supreme enlightenment, has forgotten a former vow, and
    will be reminded through the Lotus of the True Law. He predicts that after immeasurable
    ages Sariputra will become the Tathagata Padmaprabha, whose Buddha-field Virata
    is described as pure, level, jeweled, and filled with jewel trees; Padmaprabha
    will preach by means of three vehicles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sariputra says he was formerly attached to heretical theories as a wandering
    monk and that the Lord taught him Nirvana in order to detach him from perverted
    views.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sariputra says that after freeing himself from views and reaching the laws
    of void, he thought he had become extinct, but this was not deemed true extinction.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sariputra describes complete extinction as becoming a Buddha, honored by men,
    gods, goblins, and Titans, and adorned with the thirty-two characteristic signs.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sariputra says he first heard the Lord's voice with terror because he feared
    it might be Mara, the evil one, disguised as Buddha.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sariputra says his doubt ended when Buddha-wisdom was displayed through arguments,
    reasons, illustrations, references to Buddhas of past, future, and present, and
    the account of the wheel of the law.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sariputra says the Buddha's sweet, deep, and lovely voice scattered his doubts,
    and he declares that he will become a Tathagata and manifest Buddha-wisdom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Lord announces before a public cosmic audience that Sariputra has been
    made ripe for supreme perfect enlightenment in the presence of innumerable Buddhas
    and has long followed his commandments.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Lord says Sariputra was reborn under his rule by the counsel and decree
    of the Bodhisattva, has no recollection of his former vow, and will have that
    knowledge revived through the Lotus of the True Law.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The Lord predicts that, after immeasurable aeons and after completing the
    Bodhisattva course, Sariputra will become the Tathagata named Padmaprabha.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Padmaprabha's Buddha-field, called Virata, is described as level, pleasant,
    beautiful, pure, prosperous, quiet, rich in food, full of many races of men, made
    of lapis lazuli, patterned in eight compartments with gold threads, and filled
    with jewel trees bearing blossoms and fruits of seven precious substances.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: Padmaprabha will preach the law through the instrumentality of three vehicles
