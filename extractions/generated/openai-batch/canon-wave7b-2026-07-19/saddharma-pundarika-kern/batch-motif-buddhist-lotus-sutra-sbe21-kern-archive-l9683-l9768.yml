canonical_text:
  quote: ''
  summary: The Lord utters stanzas announcing the future destiny of a disciple from
    the Ku^ina family as the Tathagata Samantaprabhasa, describes his pure field,
    bodhisattvas, lifespan, law, and later succession by five hundred similarly named
    Chiefs. The Lord then instructs Kasyapa concerning the five hundred Arhats and
    other disciples. The five hundred Arhats rejoice, salute the Lord's feet, and
    confess a fault in having thought they had already arrived.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lord utters stanzas announcing that his disciple from the Ku^ina family
    will in the future become a Tathagata and Lord of the world after an endless period,
    educating countless living beings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disciple is said to see many endless Buddhas before becoming the Gina
    Samantaprabhasa, whose field is described as thoroughly pure.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The future Buddha is described as brilliant, endowed with Buddha powers, possessing
    a far-resounding voice, attended by thousands of kotis of beings, and preaching
    supreme enlightenment.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Zealous Bodhisattvas are described as mounted on lofty aerial cars, moving,
    meditative, morally pure, and devoted to doing good.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: After hearing the law, the Bodhisattvas go to other fields to salute thousands
    of Buddhas and later return to the field of Prabhasa, the Tathagata.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sugata's lifetime is said to be sixty thousand aeons; after his complete
    extinction, the true law remains twice as long and the counterfeit three times
    as long.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: When the true law is exhausted, men and gods are said to be vexed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A complete number of five hundred Chiefs named Samantaprabha will appear in
    regular succession and share similar divisions, magical powers, Buddha-fields,
    hosts, true law, and voice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Moved by benevolence and compassion, the successive Chiefs foretell each other's
    destiny by identifying the immediate successor who will command the world as the
    current one does.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Lord instructs Kasyapa to keep the five hundred self-controlled Arhats
    and other disciples in view and to speak of the matter to the other disciples.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The five hundred Arhats, after hearing the announcement of their own future
    destiny, become joyful, approach the Lord, reverentially salute his feet with
    their heads, and confess a fault in having continually thought they had arrived.
  category: action
  evidence_refs:
  - ev:9
