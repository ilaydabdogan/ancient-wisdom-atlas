canonical_text:
  quote: ''
  summary: The passage defines the Bodhisattva's observance and proper sphere in terms
    of non-discrimination, the void and unproduced character of all laws, concentrated
    meditative steadiness, and peaceful preaching after the Tathagata's extinction.
    It instructs the preacher to avoid hostility, blame, and scandal, to receive hearers
    benevolently, and notes royal and lay support for the preacher.
  language: English
