canonical_text:
  quote: ''
  summary: The speaker contrasts beings who, through sinful deeds, fail to hear his
    name, law, or congregation with gentle beings who see him reveal the law through
    good works. He asserts his immeasurable life, limitless wisdom, and truthfulness,
    compares his method to a physician who announces his own death while alive for
    the sake of deluded sons, and presents himself as father, self-born, healer, and
    protector who teaches final rest to ignorant beings and seeks to bring them to
    enlightenment.
  language: English
  quote_policy: summarized
