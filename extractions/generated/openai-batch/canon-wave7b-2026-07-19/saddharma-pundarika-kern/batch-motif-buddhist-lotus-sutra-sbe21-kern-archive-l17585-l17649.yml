canonical_text:
  quote: ''
  summary: 'The passage describes benefits attributed to adoring the Bodhisattva Mahasattva
    Avalokitesvara: freedom from infatuation, the birth of a desired son or daughter,
    unfailing profit, and pious merit equal to worshiping a vast number of Buddhas.
    Akshayamati asks how Avalokitesvara frequents the Saha-world and preaches the
    law, and the Lord replies that in some worlds Avalokitesvara preaches to creatures
    in the shape of a Buddha.'
