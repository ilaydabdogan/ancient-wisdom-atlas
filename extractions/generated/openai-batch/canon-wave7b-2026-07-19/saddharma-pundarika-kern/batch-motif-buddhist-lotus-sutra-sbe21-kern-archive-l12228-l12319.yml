canonical_text:
  quote: ''
  summary: 'The passage gives verse instructions for the Bodhisattva Mahasattva’s
    proper sphere and peaceful conduct: he should remain retired and pure, avoid many
    kinds of social contact, answer sincere questions about the law without fear,
    avoid secluded or playful interaction when preaching to women, enter villages
    for food with another monk or by thinking of the Buddha, and keep the Sutra in
    memory.'
  language: English
  quote_policy: summarized
