canonical_text:
  quote: this Sutra, comparable to a crown jewel
  summary: A royal reward image is applied to the Buddha's disclosure of the Sutra.
    The Buddha describes himself as king of the law and physician, says the Sutra
    has been kept back as the most eminent teaching, and lists qualities and dream
    visions granted to those who keep it after his extinction.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A king gives towns, villages, ornaments, precious materials, and slaves as
    tokens of satisfaction.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the king is struck by one soldier's incomparable daring, he praises him
    and gives him the jewel from his crown.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Buddha speaks of himself as the king of the law, possessing patience and
    a large treasure of wisdom, and governing the world with justice, benignity, compassion,
    and pity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Buddha says he pronounces many Sutras when creatures are troubled and
    shows this Sutra, comparable to a crown jewel, when he recognizes creatures as
    strong.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Sutra is called the last Sutra proclaimed in the world, the most eminent
    of the Buddha's Sutras, and one formerly kept and not divulged.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Four qualities are announced for those who, after the Buddha's extinction,
    desire supreme enlightenment and perform his charge.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The wise man is described as free from vexation, trouble, and sickness, and
    as not dwelling in a miserable town.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The great Sage is said to have a pleasant look, to deserve honor as if he
    were the Tathagata, and to have little angels constantly attending him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: The man's body cannot be hurt by weapons, poison, sticks, or clods, and the
    mouth of a person who abuses him is closed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The keeper of the Sutra after the Buddha's extinction is described as a friend
    to all creatures and as going over the earth like a light that dissipates gloom.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: In sleep he sees visions shaped as Buddha, and sees monks and nuns on thrones
    proclaiming the many-sided law.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In dream he sees gods, goblins, demons, and Nagas with joined hands, and he
    expounds the eminent law to them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In dream he sees the golden-coloured Tathagata preaching to many beings; he
    stands with joined hands, glorifies the Seer, worships, reaches non-retrograding
    knowledge, and obtains magical spells.
  category: sequence
  evidence_refs:
  - ev:6
