canonical_text:
  quote: ''
  summary: In the chapter on Exertion, bodhisattvas and monks assure the Lord that
    after the Tathagata's extinction they will preserve and proclaim the Sutra despite
    future hostile beings. Gautami, the sister of the Lord's mother, appears with
    nuns and asks about her prediction to supreme enlightenment; the Lord replies
    that she has received a prediction with the whole assembly. An editorial footnote
    connects a possible count of Gautami plus six nuns with the seven Matres or Mother-goddesses
    of Indian mythology.
  language: English
  quote_policy: summarized
