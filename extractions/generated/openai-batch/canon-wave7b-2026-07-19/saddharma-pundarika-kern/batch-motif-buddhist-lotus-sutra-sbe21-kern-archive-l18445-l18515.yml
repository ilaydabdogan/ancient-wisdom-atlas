  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Samantabhadra tells the Lord that at the end of time he will protect monks
    who keep the Sutranta, care for their safety, avert blows or punishment, and destroy
    poison.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Samantabhadra says his protection will prevent Mara, Mara's retinue, and other
    snare-laying beings from surprising the preachers.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a preacher applying himself to the dharmaparyaya walks, Samantabhadra
    says he will mount a white elephant with six tusks and go with a train of Bodhisattvas
