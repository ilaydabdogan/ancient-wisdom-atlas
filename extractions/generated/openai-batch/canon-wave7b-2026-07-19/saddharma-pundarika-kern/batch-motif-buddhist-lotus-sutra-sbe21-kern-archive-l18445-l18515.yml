canonical_text:
  quote: ''
  summary: Samantabhadra tells the Lord that in the latter age he will protect monks
    and other devotees who keep or study the Lotus dharmaparyaya. He promises to ward
    off Mara, hostile beings, blows, and poison; to come mounted on a white elephant
    with six tusks, attended by Bodhisattvas; to restore forgotten words of the text;
    and to bestow meditation and talismanic spells after practitioners persevere for
    twenty-one days.
  language: English
  quote_policy: summarized
literal_observations:
