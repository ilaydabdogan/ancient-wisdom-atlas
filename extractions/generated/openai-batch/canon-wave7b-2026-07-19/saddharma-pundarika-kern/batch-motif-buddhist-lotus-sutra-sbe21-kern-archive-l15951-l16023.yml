canonical_text:
  quote: ''
  summary: The passage recounts a former Bodhisattva monk named Sadaparibhuta who
    addressed unbelieving monks and nuns without contempt, was abused for his speech,
    heard and promulgated the Sutra near the time of death, lived a very long life,
    brought others to ripeness for enlightenment, propitiated many Buddhas, and eventually
    attained enlightenment. The speaker identifies Sadaparibhuta with himself, Sakyamuni,
    and identifies former recipients of the admonition with present followers who
    will keep the Sutra after his extinction.
  language: English
