canonical_text:
  quote: ''
  summary: 'Mahapratibhana asks the Lord to show the body-frame of Prabhutaratna.
    The Lord explains Prabhutaratna''s vow: when the Lotus of the True Law is preached
    in other Buddha-fields, his stupa should be near the preaching Tathagata, and
    when the body-frame is to be shown, the Tathagata-frames made in all quarters
    should be gathered with the stupa. The Lord emits a ray from the hair-circle on
    his brow, making Buddha-fields and Buddhas in the ten directions visible. Those
    Buddhas resolve to go to the Saha-world near Sakyamuni to salute Prabhutaratna''s
    relic stupa, and the world is described as jewel-adorned.'
  language: English
  quote_policy: summarized
