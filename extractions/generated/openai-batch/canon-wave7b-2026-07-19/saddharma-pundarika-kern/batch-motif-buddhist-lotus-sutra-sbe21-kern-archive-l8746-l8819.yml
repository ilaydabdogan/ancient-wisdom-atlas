canonical_text:
  quote: ''
  summary: The passage recounts that sixteen novices fully grasp the Lord's teaching.
    The Tathagata foretells their future destiny to supreme perfect enlightenment,
    teaches the Lotus of the True Law for immense ages, and then enters a long meditative
    retirement. While he is absorbed, the sixteen novices sit on prepared royal thrones
    and expound the Lotus to the four classes, instructing vast numbers of beings
    in enlightenment. After emerging from meditation, the Tathagata occupies the seat
    of the law, praises the novices as wise transmitters of Buddha-knowledge, and
    commands that they be honored.
  language: English
  quote_policy: summarized
