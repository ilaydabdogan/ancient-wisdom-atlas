canonical_text:
  quote: ''
  summary: 'The passage describes the advantages gained by one who preaches the Sutra:
    a natural eye with eight hundred good qualities that sees the whole world from
    Avici hell to the extremity of existence, and a natural ear with twelve hundred
    good qualities that hears and discerns all sounds in the triple universe without
    being overpowered, while not yet possessing the divine eye or divine ear.'
  language: English
  quote_policy: summarized
