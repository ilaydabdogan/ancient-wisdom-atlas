canonical_text:
  quote: ''
  summary: The passage describes the Buddha-field and assembly of the Tathagata Kandravimalasuryaprabhasasri,
    including jewel trees, jewel houses, music-making angels, and the teaching of
    the Lotus of the True Law. The Bodhisattva Sarvasattvapriyadarsana practices contemplation
    for twelve thousand years, acquires the samadhi called the display of all forms,
    attributes it to the Lotus teaching, and seeks to honor the Tathagata and the
    teaching. Heavenly flowers and sandalwood essences rain down. He then decides
    that offering his own body would honor the Tathagata more than the prior magical
    display and begins ingesting fragrant substances and oil.
  language: English
  quote_policy: summarized
