canonical_text:
  quote: ''
  summary: The passage contrasts the merit of vast practice of the five perfections
    over immense aeons with the merit of a single thought of trust in the Dharma exposition
    on the Tathagata's life-span, saying the latter is beyond comparison and leads
    unfailingly to supreme enlightenment. The following stanzas describe a seeker
    practicing the five virtues, giving alms to Buddhas and disciples, supporting
    Pratyekabuddhas and Bodhisattvas, building refuges and monasteries, directing
    the mind to enlightenment, observing precepts, and cultivating forbearance.
  language: English
  quote_policy: summarized
