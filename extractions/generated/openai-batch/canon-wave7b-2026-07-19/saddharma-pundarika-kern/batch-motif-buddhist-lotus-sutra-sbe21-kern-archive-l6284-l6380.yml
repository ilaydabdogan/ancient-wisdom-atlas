canonical_text:
  quote: "“Always returning, he preaches the law”"
  summary: The speakers declare that they have obtained the fruit of previous moral
    and spiritual practice under the Leader, have become disciples and Arhats, and
    will proclaim enlightenment. They say the Lord cannot be resisted, even through
    immense bodily effort or countless charitable offerings. The Buddha is described
    as powerful, patient, a great ruler, the Gina, and the Lord of the law who returns
    to preach to conditioned beings. Translator notes add comparisons involving Bhishma,
    Arhats as ancestors, Dharmaraja/Yama, and Siva epithets.
  language: English
  quote_policy: quoted
