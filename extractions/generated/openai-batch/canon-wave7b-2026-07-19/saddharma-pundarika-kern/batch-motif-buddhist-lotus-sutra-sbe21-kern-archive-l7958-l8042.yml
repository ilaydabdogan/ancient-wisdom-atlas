canonical_text:
  quote: ''
  summary: The passage describes a continuing rain of flowers and celestial drums
    honoring the Lord until complete Nirvana or extinction. After ten intermediate
    kalpas, the Lord Mahabhi^a^anabhibhu reaches supreme perfect enlightenment. His
    sixteen sons, who had toys and amusements, leave them and go with mothers, nurses,
    a king, ministers, and many beings to honor him. They salute his feet, circumambulate
    him, join their hands, and praise him as a great physician, unmoving, tranquil,
    and intent on saving beings.
  language: English
  quote_policy: summarized
