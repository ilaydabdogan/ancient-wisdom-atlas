canonical_text:
  quote: "'All existences' (he says) 'are like a mirage'"
  summary: The passage describes the merits and bodily benefits associated with joyful
    acceptance, hearing, reading, preaching, promulgating, or encouraging others to
    hear the Sutra. In the stanzas, a hypothetical benefactor gives alms to countless
    beings for eighty years, teaches them the law upon seeing their old age and decay,
    and they become Arhats. The text states that hearing even a single stanza through
    tradition and joyfully receiving it produces still greater merit, and that exhorting
    even one creature to hear the rare Sutra produces beneficial fruit.
  language: English
