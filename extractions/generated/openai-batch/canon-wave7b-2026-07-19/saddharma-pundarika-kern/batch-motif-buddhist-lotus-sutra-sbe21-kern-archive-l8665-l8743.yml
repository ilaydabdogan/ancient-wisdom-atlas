canonical_text:
  quote: ''
  summary: During Mahabhi^a^anabhibhu's exposition of the law, vast numbers of beings
    are freed from imperfections and gain forms of knowledge and meditation. The Lord
    gives repeated expositions, the congregation grows beyond calculation, sixteen
    princes renounce home life as novices and request teaching for supreme enlightenment,
    many in the king's retinue also renounce, and after twenty thousand aeons the
    Lord reveals the Dharmaparyaya called 'the Lotus of the True Law' before the four
    classes of auditors.
  language: English
  quote_policy: summarized
