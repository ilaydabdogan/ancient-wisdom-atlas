canonical_text:
  quote: ''
  summary: The passage lists Tathagatas associated with directions and identifies
    Sakyamuni as the sixteenth Tathagata who attained supreme enlightenment at the
    centre of the Saha-world. It says innumerable beings heard the law from these
    teachers when they were novices and were initiated toward supreme enlightenment;
    the speaker identifies the present monks with beings he taught as a Bodhisattva.
    Future disciples after Sakyamuni's Nirvana will learn the Bodhisattva course,
    be born in other worlds where he dwells under different names, and hear that the
    complete Nirvana of the Tathagatas is one. The passage frames this as a device
    of the Tathagatas and describes a final gathering for teaching when the time of
    complete extinction arrives.
  language: English
  quote_policy: summarized
