canonical_text:
  quote: ''
  summary: The passage recounts Sarvasattvapriyadarsana's twelve-year preparation
    with fragrant substances and oil, his burning of his own body as worship of a
    Tathagata and the Lotus of the True Law, the cosmic brightness and praise that
    follow, the body's twelve-thousand-year blaze, and his later apparitional reappearance
    in a royal house, where he speaks to his parents about his vow and attainment.
