canonical_text:
  quote: ''
  summary: The passage explains to Sariputra that different beings seek the disciple
    vehicle, the Pratyekabuddha vehicle, or the great vehicle, each compared to boys
    escaping a burning house in hope of deer-, goat-, or bullock-drawn carts. It then
    compares a wealthy man giving one grand cart to his rescued children with the
    Tathagata, who regards all beings as his children and leads beings delivered from
    the triple world by the single Buddha-vehicle to complete Nirvana.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wise beings have faith in the Tathagata, who is called the father of the world,
    and apply themselves to his commandments.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some beings seek knowledge of the four great truths for their own complete
    Nirvana; they are described as coveting the vehicle of the disciples and are compared
    to boys fleeing the burning house for a deer-yoked cart.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Other beings seek science without a master, self-restraint, tranquillity,
    and understanding of causes and effects for their own complete Nirvana; they are
    described as coveting the vehicle of the Pratyekabuddhas and are compared to boys
    fleeing the burning house for a goat-yoked cart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other beings seek the all-knowing knowledge of Buddha and the Tathagata’s
    knowledge, powers, and freedom from hesitation for the welfare and complete Nirvana
    of all beings; they are called Bodhisattvas Mahasattvas and are compared to boys
    fleeing the burning house for a bullock-yoked cart.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the parable, a man sees that his children have escaped from the burning
    house, knows them to be safe and out of danger, and gives them one single grand
    cart from his great wealth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Tathagata sees many beings recovered from the triple world, released from
    sorrow, fear, terror, calamity, and difficulties, and having reached the bliss
    of Nirvana through his command.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Tathagata is described as possessing great wealth of knowledge, power,
    and absence of hesitation, and as considering all beings his children.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Tathagata leads beings by no other vehicle than the Buddha-vehicle and
    does not teach a separate Nirvana for each being.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Delivered beings are given lofty pleasures of the Aryas as toys for their
    amusement.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: An editorial footnote identifies the Buddha-vehicle with a one-wheeled carriage
    and compares it with a Rig-vedic three-naved wheel image and a One-footed figure
    named as Siva or Vishnu in the note.
  category: other
  evidence_refs:
  - ev:6
