  summary: Samantabhadra comes from the east with innumerable bodhisattvas and a magically
    produced retinue amid miraculous signs. He arrives in the Saha-world, approaches
    the Buddha on Grdhrakuta, salutes and circumambulates him seven times, and asks
    to hear the Lotus of the True Law from Sakyamuni. The Buddha identifies the teaching
    as an unmixed truth and begins stating conditions under which it may be entrusted
    to a female devotee; the provided passage cuts off during the list.
