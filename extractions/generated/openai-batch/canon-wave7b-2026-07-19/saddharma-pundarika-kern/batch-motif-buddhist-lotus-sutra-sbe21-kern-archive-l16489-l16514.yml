canonical_text:
  quote: ''
  summary: At the opening of the chapter on the ancient devotion of Bhaishagyaraga,
    the Bodhisattva Mahasattva Nakshatrarajasankusumitabhigha asks the Lord why the
    Bodhisattva Bhaishagyaraga pursues his course in the Saha-world despite many difficulties.
    He asks the Lord to tell part of Bhaishagyaraga's course of duty for the benefit
    and delight of the assembled beings. The Lord answers by beginning an account
    set in a remote past, when a Tathagata named Candravimalasuryaprabhasasri appeared
    in the world.
