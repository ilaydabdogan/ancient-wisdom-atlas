canonical_text:
  quote: "“Move forward the exalted, unsurpassed wheel!”"
  summary: Brahma-angels praise the Buddha Mahabhijñanabhibhu, offer him their aerial
    cars, and petition him to turn the wheel of the law. In response to the prayers
    of the Brahma-angels and his sixteen sons, he begins teaching the truths of pain,
    its origin, its suppression, the path to suppression, and the causal sequence
    of suffering and its cessation.
