- id: obs:1
  text: The passage says that after the Lord's complete extinction, agents will go
    in all directions so that creatures write, keep, meditate on, and divulge the
    Dharmaparyaya, while the Lord in another world protects, defends, and guards them.
  category: sequence
  evidence_refs:
