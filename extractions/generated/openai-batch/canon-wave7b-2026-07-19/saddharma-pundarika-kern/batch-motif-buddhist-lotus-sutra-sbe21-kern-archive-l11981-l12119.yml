canonical_text:
  quote: After thy complete extinction, in the horrible last period of the world,
    we will proclaim this sublime Sutra.
  summary: Bodhisattvas address the Lord and vow to proclaim and transmit the Sutra/Dharmaparyaya
    after his complete extinction. They describe a dreadful last period marked by
    slander, violence, false teachers, expulsion, and abuse, and they promise to endure
    these hardships as keepers of the Lord's entrusted deposit and deliverers of his
    message.
  language: English
  quote_policy: quoted
