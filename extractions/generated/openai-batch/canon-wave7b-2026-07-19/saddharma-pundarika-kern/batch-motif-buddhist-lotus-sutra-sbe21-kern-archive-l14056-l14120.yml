canonical_text:
  quote: ''
  summary: 'At the opening of the chapter, while the exposition on the duration of
    the Tathagata''s lifetime is being given, countless creatures benefit. The Lord
    addresses Bodhisattva Mahasattva Maitreya/A^ita and lists vast groups of Bodhisattvas
    Mahasattvas who, by hearing the Dharmaparyaya, obtain various attainments: acquiescence
    in the law with no origin, Dharani, unhampered view, irreversible and radiant
    wheels, reduced numbers of births before supreme perfect enlightenment, and the
    conception of the idea of supreme perfect enlightenment.'
  language: English
  quote_policy: summarized
