canonical_text:
  quote: ''
  summary: 'The passage explains a parable to Ka^yapa: the ''blind-born'' represent
    creatures trapped in the six-state whirl of worldly life through ignorance. The
    Tathagata, outside the triple world, compassionately appears in it, sees beings''
    differing dispositions with the eye of wisdom, and shows them three vehicles.
    The parable''s seers are identified with Bodhisattvas, and the great physician
    is identified with the Tathagata.'
  language: English
  quote_policy: summarized
