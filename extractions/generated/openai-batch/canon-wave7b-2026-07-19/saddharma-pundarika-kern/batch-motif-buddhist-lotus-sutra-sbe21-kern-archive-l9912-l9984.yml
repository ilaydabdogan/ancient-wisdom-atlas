canonical_text:
  quote: ''
  summary: Ananda and Rahula ask the Lord to predict their future destiny to supreme
    enlightenment, calling him their father, refuge, and protection. More than two
    thousand monks join the same wish. The Lord then predicts that Ananda will become
    a future Tathagata after venerating many Buddhas, remembering their true law,
    and bringing many Bodhisattvas to maturity; his future Buddha-field is described
    as lapis lazuli and abundant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ananda reflects on whether he and others should receive a similar prediction,
    rises from his seat, prostrates at the Lord's feet, and speaks.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rahula has the same thought and wish as Ananda, prostrates at the Lord's feet,
    and speaks.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ananda and Rahula ask for their turn and address the Lord as father, procreator,
    refuge, and protection.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speakers say that people call them the Lord's sons, the Lord's attendants,
    and keepers of the Lord's law-treasure.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: More than two thousand other monks rise, place their upper robes upon one
    shoulder, stretch joined hands toward the Lord, gaze up at him, and share the
    same wish for a prediction to supreme enlightenment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Lord tells Ananda that he will in the future become a Tathagata with the
    name Sagaravaradharabuddhivikri^tabhi^a.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before attaining supreme enlightenment, Ananda is said to honor, respect,
    venerate, and worship sixty-two kotis of Buddhas, keep their true law in memory,
    and receive the command.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ananda is said to bring an immense number of Bodhisattvas to full ripeness
    for supreme perfect enlightenment, compared with the sands of twenty Ganges.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Ananda's future Buddha-field is described as consisting of lapis lazuli and
    being superabundant; its sphere and aeon receive names, and the future Tathagata's
