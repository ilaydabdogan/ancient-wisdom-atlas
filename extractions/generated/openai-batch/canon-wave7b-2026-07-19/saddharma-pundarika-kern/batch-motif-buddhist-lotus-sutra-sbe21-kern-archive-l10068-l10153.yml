canonical_text:
  quote: ''
  summary: Ananda rejoices and remembers the true law and his former vow, declaring
    freedom from doubt and readiness for enlightenment. The Lord then predicts Rahula-Bhadra's
    future Buddhahood under the name Saptaratnapadmavikrantagamin, after honoring
    innumerable Tathagatas and repeatedly being the eldest son of Buddhas. Rahula
    is described as the Lord's eldest son, heir to the law, and one who will eventually
    attain supreme and perfect enlightenment. The Lord then turns to two thousand
    disciples who look up to him serenely.
  language: English
  quote_policy: summarized
