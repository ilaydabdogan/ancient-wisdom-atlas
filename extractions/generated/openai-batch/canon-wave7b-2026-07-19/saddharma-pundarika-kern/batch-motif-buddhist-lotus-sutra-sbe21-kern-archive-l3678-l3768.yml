  quote: ''
  summary: Verses state that even small or distracted acts connected with Buddhas,
    relics, Stupas, images, music, salutation, or hearing the name of the law lead
    beings to enlightenment. Future Buddhas are said to reveal the same skilful device
    and educate beings toward Buddha-knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men or boys make images on walls with a nail or piece of wood during lessons
    or play, by way of amusement.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those image-makers are said to have reached enlightenment, become compassionate,
    roused many Bodhisattvas, and saved many creatures.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some people offer flowers and perfumes to relics of Tathagatas, to Stupas,
    to a mound of earth, and to images of clay or images drawn on a wall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some people cause drums, conch trumpets, cymbals, lutes, tabors, reed-pipes,
    flutes, and other instruments or songs to be sounded in celebration of enlightenment
    or the Sugatas.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The passage says that people who performed various kinds of worship, even
    small acts such as sounding a single instrument, offering a single flower, or
    drawing images on a wall, will in time see many Buddhas.
  category: sequence
  evidence_refs:
  - ev:3
