canonical_text:
  quote: ''
  summary: 'The passage lists dangers from which beings are delivered when Avalokitesvara
    is implored, adored, or named: a ship cast by a gale onto the island of Giantesses,
    capital punishment, goblins and giants, fetters, armed robbers threatening a jewel-rich
    caravan, and inner impulses of passion and hatred. A translator''s note connects
    the island of Giantesses with the Karaṇḍa-vyūha tradition and Ceylon.'
  language: English
  quote_policy: summarized
