canonical_text:
  quote: ''
  summary: Mañjuśrī tells Ajita that he himself had been the Bodhisattva Varaprabha
    and Ajita had been Yasaskama in a past time. Because he has once seen a similar
    portent, he infers from the present ray that the Lord is about to expound the
    Lotus of the True Law. In verses, he recalls a remote past Buddha, Candrasuryapradipa,
    who preached the law, inspired beings and Bodhisattvas, whose eight sons renounced
    worldly life, and who entered meditation after proclaiming the Exposition of Infinity.
    Celestial flowers, unstruck heavenly drums, trembling Buddha-fields, and a ray
    from between his brows reveal many fields, beings, devotees, and Buddhas.
  language: English
  quote_policy: summarized
