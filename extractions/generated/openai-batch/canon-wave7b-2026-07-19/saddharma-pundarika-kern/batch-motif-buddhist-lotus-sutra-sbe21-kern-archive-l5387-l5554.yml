canonical_text:
  quote: ''
  summary: 'The passage lists severe rebirths, illnesses, disabilities, poverty, and
    social humiliations said to result from scorning the Sutra. It then instructs
    Sariputra not to teach this Sutra to foolish people, but to expound it to qualified
    hearers: those learned, compassionate, morally pure, devoted to enlightenment,
    respectful toward the Buddha, attached to virtuous friends, willing to live apart
    in mountain caverns, and devoted to preserving and worshipping the Sutra.'
  language: English
  quote_policy: summarized
