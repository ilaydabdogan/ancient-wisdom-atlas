canonical_text:
  quote: ''
  summary: The passage describes a Buddha-field with Bodhisattvas, innumerable disciples,
    reverent gods and men, and specified durations of the Buddha's lifetime and law.
    The Lord then announces that Maha-Katyayana will honor many Buddhas, build and
    worship great stupas after their passing, honor more Buddhas, and in his final
    bodily existence become the Tathagata Sambunada-prabhasa. His future Buddha-field
    is described as pure, jeweled, flower-strewn, free from lower or demonic beings,
    and filled with men, gods, disciples, and Bodhisattvas.
  language: English
