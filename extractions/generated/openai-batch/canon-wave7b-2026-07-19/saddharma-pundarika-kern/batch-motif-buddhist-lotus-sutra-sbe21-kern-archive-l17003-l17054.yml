canonical_text:
  quote: ''
  summary: The Tathagata describes benefits for approving and hearing the chapter
    on the ancient devotion of Bhaishagyaraga, transmits it to Nakshatraragasankusumitabhiĝna
    for preservation in Jambudvipa, likens it to medicine for suffering beings, instructs
    Bodhisattva aspirants to honor monks who keep the Sutra, and says such monks are
    moving toward enlightenment, defeating Mara, proclaiming the law, and crossing
    the ocean of existence. The exposition results in many Bodhisattvas attaining
    a spell, and Prabhutaratna approves the questioning.
  language: English
  quote_policy: summarized
