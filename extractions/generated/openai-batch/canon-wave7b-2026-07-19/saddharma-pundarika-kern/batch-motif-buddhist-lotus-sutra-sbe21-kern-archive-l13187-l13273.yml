canonical_text:
  quote: through the whole extent of the earth they emerge
  summary: An innumerable host of Bodhisattvas emerges through the earth and is established
    in ether. The assembled beings ask where these Bodhisattvas come from, who taught
    and commanded them, and what their history is. Tathagatas identified as creations
    of Sakyamuni sit around him on jewel thrones at the foot of jewel trees, and their
    attendants are told to wait for Sakyamuni's explanation to Maitreya/A^ita.
  language: English
  quote_policy: quoted
