canonical_text:
  quote: ''
  summary: The Lord discusses with monks whether calculation can reach the limits
    of worlds and immense spans of time. He says arithmetic may possibly find the
    limits of worlds with or without deposited atoms, but cannot find the limit of
    the aeons since the extinction of the Tathagata Mahabhi^a^anabhibhu. He nevertheless
    remembers that Tathagata as if his extinction had occurred today or yesterday,
    because of the knowledge and sight of the Tathagata. A stanza repeats that he
    remembers the great Seer Abhif/za^anabhibhu from many kotis of aeons ago.
  language: English
  quote_policy: summarized
