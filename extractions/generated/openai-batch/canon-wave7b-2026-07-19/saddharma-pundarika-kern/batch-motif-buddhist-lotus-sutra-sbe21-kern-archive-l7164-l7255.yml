canonical_text:
  quote: ''
  summary: 'The passage teaches that many vehicles may be spoken of, while the Buddha-vehicle
    is ultimately singular. It then presents a simile: a man born blind denies visible
    phenomena, a compassionate physician goes to the Himalaya, gathers four medicinal
    plants, applies them in several ways, and restores the man''s sight. The man then
    sees celestial bodies and recognizes his former ignorance. The passage explicitly
    compares this to beings blinded by ignorance, among whom the Tathagata appears
    as a compassionate great physician and teacher who reveals different forms of
    enlightenment according to recipients'' capacities.'
  language: English
  quote_policy: summarized
