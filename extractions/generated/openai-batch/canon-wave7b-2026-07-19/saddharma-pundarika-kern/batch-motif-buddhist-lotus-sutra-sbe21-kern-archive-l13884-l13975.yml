canonical_text:
  quote: I was not completely extinct at that time; it was but a device of mine
  summary: 'The Tathagata declares that his enlightenment and teaching extend across
    inconceivable aeons. He says that his displayed extinction is a pedagogical device:
    beings who think he is extinct worship relics, but when upright beings leave their
    bodies he assembles disciples and shows himself at Grdhrakuta. He withholds and
    reveals his proper being according to beings'' aspiration. The passage contrasts
    beings'' perception of a burning, woeful world with an everlasting Buddha-field
    filled with gods, men, gardens, palaces, gem hills, trees, music, and a rain of
    Mandara flowers.'
  language: English
  quote_policy: quoted
