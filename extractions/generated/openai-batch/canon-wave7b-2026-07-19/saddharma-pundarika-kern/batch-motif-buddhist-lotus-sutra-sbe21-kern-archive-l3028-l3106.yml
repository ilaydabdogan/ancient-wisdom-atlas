canonical_text:
  quote: ''
  summary: The passage presents doubt among the assembled audience over the Lord's
    repeated praise of the Tathagatas' skilfulness and profound law. Sariputra, also
    uncertain, asks the Lord to explain. In verse, he names the Lord's powers, emancipations,
    meditations, enlightenment, mystery, and profound words, and describes monks,
    nuns, gods, Nagas, serpents, rulers, and other beings waiting respectfully for
    clarification about the course of duty.
