canonical_text:
  quote: ''
  summary: The Lord addresses a cosmic assembly and recalls a former life as a king
    who sought the Sutra of the Lotus of the True Law for immense aeons. After practicing
    extreme generosity, ruling as King of the Law, installing his eldest son in government,
    and proclaiming his willingness to serve whoever could teach the best law, he
    became the servant-pupil of a Seer who promised to teach the Sutra. He served
    without fatigue for a millennium. The Lord then identifies himself as the former
    king and Devadatta as the former Seer and good friend who aided his attainment
    of virtues.
  language: English
  quote_policy: summarized
