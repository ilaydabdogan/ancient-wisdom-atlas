canonical_text:
  quote: ''
  summary: Sariputra joyfully addresses the Lord after hearing the law. He recalls
    his former distress at seeing Bodhisattvas destined for Buddhahood while he felt
    confined to an inferior vehicle, describes solitary reflection in natural retreat
    settings, blames his own earlier misunderstanding, and declares that he has now
    attained calm, Arhatship, law-born sonship, and release from inner burning through
    the Lord's wonderful law and voice.
  language: English
  quote_policy: summarized
