  summary: In a burning house episode, a father worries that his foolish children
    will perish because they ignore his warning. He devises a means to draw them out
    by promising various carts outside the house. The children rush out safely into
    the open air, and the father later speaks from a throne in the village square.
    Editorial notes compare prose and poetic versions and propose a twilight/Day-god
    interpretation.
