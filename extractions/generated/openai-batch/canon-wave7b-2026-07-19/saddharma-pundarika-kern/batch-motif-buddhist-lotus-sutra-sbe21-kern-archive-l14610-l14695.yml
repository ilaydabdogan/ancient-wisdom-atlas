canonical_text:
  quote: ''
  summary: The passage lists forms of honour to the Gina’s relics, then states that
    keeping, teaching, writing, assembling, and worshipping this Sutra after the Buddha’s
    extinction produces immeasurable merit. It further describes the virtues of an
    ideal keeper of the Sutra and instructs others to honour such a person as if he
    were a Tathagata.
  language: English
  quote_policy: summarized
