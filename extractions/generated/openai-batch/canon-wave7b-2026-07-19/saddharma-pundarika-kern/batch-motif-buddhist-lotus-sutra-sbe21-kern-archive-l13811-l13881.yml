canonical_text:
  quote: ''
  summary: A physician-father finds his sons sick from poison or venom. He prepares
    a remedy with the proper color, smell, and taste. Some sons with right notions
    take it and are cured, while sons with perverted notions refuse it. To induce
    them to take the medicine, the physician announces his age and nearness to death,
    leaves for another country, and has the sons informed that he has died. In grief,
    they recover right notions, recognize the remedy, take it, and are delivered from
    their illness. The physician then appears again. The Lord explains that this device
    is not falsehood and compares it to the Tathagata’s long-attained enlightenment
    and use of able devices to educate creatures.
  language: English
  quote_policy: summarized
