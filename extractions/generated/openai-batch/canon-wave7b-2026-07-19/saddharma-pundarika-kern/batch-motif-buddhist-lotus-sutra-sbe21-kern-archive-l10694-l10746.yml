canonical_text:
  quote: '"I will also send many creations."'
  summary: 'The Buddha promises aid to a courageous future preacher of the Sutra after
    his extinction: beings will honor him, creations will defend him from attacks,
    the Buddha will appear to him in lonely study and restore his memory, gods and
    goblins will keep him company, his speech and exegesis will be effective, and
    those entrusted to him will become Bodhisattvas and behold many Buddhas.'
  language: English
  quote_policy: quoted
