  summary: The Lord recounts an ancient past in which a named Tathagata appeared.
    Under that Tathagata's spiritual rule lived King Subhavyuha, Queen Vimaladatta,
    and their two sons Vimalagarbha and Vimalanetra. The sons are described as possessing
    magical power and wisdom, practicing Bodhisattva virtues, and mastering named
    meditations. The Tathagata preached the Lotus of the True Law out of compassion.
    The two princes, with joined hands, asked their mother to go hear the teaching;
    the queen begins to reply that their father favors the Brah- before the excerpt
    breaks off.
