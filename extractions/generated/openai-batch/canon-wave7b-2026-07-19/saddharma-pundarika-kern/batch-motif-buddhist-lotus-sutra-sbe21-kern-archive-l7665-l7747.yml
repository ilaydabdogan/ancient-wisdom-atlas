canonical_text:
  quote: ''
  summary: The excerpt continues an announcement of future destinies. One predicted
    figure will build and worship Stupas, become a Jina named Jambunada-prabhasa in
    a pure field, preach, and save gods and men. The Lord then announces to the monk
    assembly that Maha-Maudgalyayana will honor many Buddhas, build and worship precious
    Stupas after their expiration, and in his last bodily existence become the Tathagata
    Tamilapatracandanagandha in the Buddha-field Manobhirama, with specified adornments,
    inhabitants, lifespan, and duration of the true law.
  language: English
  quote_policy: summarized
