canonical_text:
  quote: ''
  summary: 'The Buddha addresses Sariputra, describing his lack of envy or passion,
    his marks and illumination of the world, his concern that beings will misunderstand
    direct exhortation to enlightenment, their entanglement in desire, rebirth, theories,
    and delusion, and his use of skilful means: he shows Nirvana, reveals correct
    laws, and manifests three vehicles while affirming one vehicle and one track.'
  language: English
  quote_policy: summarized
