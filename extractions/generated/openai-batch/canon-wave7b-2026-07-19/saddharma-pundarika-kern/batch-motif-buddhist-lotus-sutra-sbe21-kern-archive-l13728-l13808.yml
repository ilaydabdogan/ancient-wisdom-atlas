canonical_text:
  quote: ''
  summary: The Tathagata says he announces final extinction although he does not become
    finally extinct. He explains that this teaching prevents complacency among creatures,
    makes the appearance of Tathagatas seem rare and precious, and produces longing
    and beneficial roots. He then begins an analogous case about a skilled physician
    whose sons are poisoned while he is away and greet him when he returns.
  language: English
  quote_policy: summarized
