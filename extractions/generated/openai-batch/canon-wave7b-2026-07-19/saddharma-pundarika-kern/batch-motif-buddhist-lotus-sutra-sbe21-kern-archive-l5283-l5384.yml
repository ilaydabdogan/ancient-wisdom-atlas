canonical_text:
  quote: ''
  summary: The speaker tells Sariputra that partial emancipation is not final rest
    and that deliverance is not declared before supreme enlightenment. He presents
    this teaching as the closing word of his law, urges its preaching, describes reverent
    acceptance of the Sutra as non-regression, restricts the teaching from haughty
    or unrestrained persons, and warns that those who scorn the Sutra, the vehicle,
    or monks will pass through Avici hell and later animal rebirths.
  language: English with Sanskrit transliteration in notes
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some persons are described as emancipated from chimeras, but not wholly freed
    or at final rest.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says he does not pronounce a person delivered before that person
    has reached highest, supreme enlightenment.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker calls himself ruler of the law and says he is born in the world
    to lead beings to beatitude.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker presents this as the closing word of his law, pronounced for the
    welfare of the world including gods, and tells Sariputra to preach it in all quarters.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person who joyfully accepts and reverently receives the Sutra may be considered
    unable to slide back.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Belief in the Sutra is linked to having seen former Tathagatas, honored them,
