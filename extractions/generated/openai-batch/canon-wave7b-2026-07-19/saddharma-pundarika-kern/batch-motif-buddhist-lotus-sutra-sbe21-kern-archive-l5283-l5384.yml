  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Sariputra is said to have good will, and the other disciples are said to walk
    in the speaker's faith though each lacks individual knowledge.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker instructs Sariputra not to speak this matter to haughty persons,
    conceited persons, or Yogins who are not self-restrained.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Those who scorn the speaker's skilfulness, the fixed Buddha-rules, the vehicle,
    the Sutra, or monks are assigned dire results.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: After disappearing from among humans, such scorners are said to dwell in the
    lowest hell, Avici, for a whole kalpa and then fall lower through repeated births
    for many intermediate kalpas.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After leaving hell, such beings are said to descend to the condition of brutes,
    including dogs and jackals, and to become sport to others.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the animal condition, those averse to supreme enlightenment are described
    as blackish, spotted, covered with sores, itchy, hairless, and feeble.
  category: attribute
  evidence_refs:
  - ev:8
