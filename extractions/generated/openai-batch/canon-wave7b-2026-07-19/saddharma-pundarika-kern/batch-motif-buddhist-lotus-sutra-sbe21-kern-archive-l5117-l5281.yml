canonical_text:
  quote: "“This triple world is as dreadful as that house”"
  summary: 'The passage continues the burning-house parable: a father rescues his
    children from a burning house, they ask for promised vehicles, and he gives them
    splendid carts. The speaker then explains the parable as an allegory: the triple
    world is like the burning house, beings are like children, the speaker is their
    father and protector, the three vehicles are an able device, and the single Buddha-vehicle
    is the ultimate teaching. The passage closes with teaching on pain, desire, suppression,
    and emancipation.'
  language: English
  quote_policy: quoted
