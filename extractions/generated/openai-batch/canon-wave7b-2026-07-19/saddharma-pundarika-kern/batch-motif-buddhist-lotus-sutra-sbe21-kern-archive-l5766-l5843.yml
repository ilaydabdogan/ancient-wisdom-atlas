canonical_text:
  quote: ''
  summary: In a parable, a wealthy householder knows that a poor man is his son but
    conceals this fact. He first releases the poor man through a servant, then uses
    intermediaries to hire him for dirt-clearing work at double pay. The poor man
    works near the rich man's dwelling. The householder watches him, then removes
    his fine clothing, adopts a dirty appearance, takes a basket, and speaks to the
    son as a worker, offering continued service, extra pay, and needed supplies.
  language: English
