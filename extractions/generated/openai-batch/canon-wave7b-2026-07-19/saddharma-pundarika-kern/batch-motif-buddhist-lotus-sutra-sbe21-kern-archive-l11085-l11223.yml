canonical_text:
  quote: ''
  summary: Sakyamuni rises into the sky, opens the jeweled Stupa, and reveals the
    extinct Buddha Prabhutaratna, who praises the exposition of the Lotus of the True
    Law. The assembly honors both Buddhas with flowers; Prabhutaratna shares his throne
    with Sakyamuni. Sakyamuni raises the assembly into the sky and asks who will expound
    the Dharmaparyaya after his coming extinction. Verses describe Prabhutaratna's
    vow, Sakyamuni's many manifested Buddha-bodies, prepared worlds and seats, Buddhas
    at the foot of trees, fragrance, and the future declaration of a keeper of the
    teaching.
  language: English
  quote_policy: summarized
