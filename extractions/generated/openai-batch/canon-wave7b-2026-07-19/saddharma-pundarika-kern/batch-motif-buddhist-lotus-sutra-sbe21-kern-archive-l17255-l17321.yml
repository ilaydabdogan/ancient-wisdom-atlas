canonical_text:
  quote: ''
  summary: The passage reports a request to see Prabhutaratna's rudimentary frame;
    Sakyamuni addresses the completely extinct Prabhutaratna, who praises Gadgadasvara's
    arrival to see Sakyamuni, hear the Lotus teaching, and see Manjusri. Padmasri
    asks about Gadgadasvara's former roots of goodness, and Sakyamuni recounts Gadgadasvara's
    ancient homage to the Buddha Meghadundubhisvararaja with music and precious vessels,
    linking it to his present beauty and long service to many Buddhas.
