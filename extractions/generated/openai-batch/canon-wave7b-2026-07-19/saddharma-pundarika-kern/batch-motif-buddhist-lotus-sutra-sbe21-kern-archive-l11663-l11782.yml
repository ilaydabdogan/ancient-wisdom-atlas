canonical_text:
  quote: In the bosom of the sea I have expounded the Lotus of the True Law and no
    other Sutra.
  summary: Mangusri says that he expounded only the Lotus of the True Law in the sea.
    He identifies the eight-year-old daughter of Sagara, the Naga-king, as intelligent,
    virtuous, compassionate, and fit for supreme enlightenment. Prajñakuta objects
    that Śakyamuni attained enlightenment only after countless efforts and sacrifices.
    The daughter appears, salutes the Lord, declares her enlightenment, and later
    answers Sariputra's objection to female Buddhahood by offering a priceless gem
    to the Lord, who accepts it at once.
  language: English
  quote_policy: quoted
