canonical_text:
  quote: ''
  summary: Samantabhadra undertakes to oversee and spread the Dharmaparyaya of the
    Lotus of the True Law in Jambudvipa. Śākyamuni approves, praising Samantabhadra’s
    compassion and protection of preachers. Those who cherish Samantabhadra’s name
    and keep, hear, write, or read the scripture are described as equivalent to those
    who have seen, heard, honored, and adorned Śākyamuni, accepted his command, avoided
    worldly or immoral company, and acquired righteous qualities. A later monk keeping
    the teaching is said to be destined for the terrace of enlightenment. Translator
    notes add speculative comparisons with Śaiva, Svabhavika, and Lokayatika contexts.
  language: English
  quote_policy: summarized
