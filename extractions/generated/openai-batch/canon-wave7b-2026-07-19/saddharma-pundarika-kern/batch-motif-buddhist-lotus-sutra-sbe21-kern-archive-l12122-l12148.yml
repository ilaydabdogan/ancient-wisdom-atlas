canonical_text:
  quote: ''
  summary: At the opening of the chapter on peaceful life, the prince royal asks the
    Lord how Bodhisattvas Mahasattvas are to promulgate the Dharmaparyaya at the end
    of time. The Lord answers that such a Bodhisattva must be firm in four things,
    beginning with conduct and proper sphere. Conduct is described through patience,
    meekness, lack of rashness and envy, non-clinging to laws, seeing the real character
    of laws, and refraining from investigating and discussing those laws. The proper
    sphere begins with not serving, courting, waiting upon, or approaching kings and
    princes.
  language: English
  quote_policy: summarized
