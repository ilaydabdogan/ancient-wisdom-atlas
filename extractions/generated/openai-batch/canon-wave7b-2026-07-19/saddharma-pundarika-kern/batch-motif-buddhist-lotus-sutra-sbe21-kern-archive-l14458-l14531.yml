canonical_text:
  quote: He who after collecting this Dharmaparyaya into a volume carries it on his
    shoulder carries the Tathagata on his shoulder.
  summary: The passage describes how those with decided belief will behold the Tathagata
    teaching on Grdhrakuta within an adorned Buddha-field. It then states that after
    the Tathagata's extinction, accepting, remembering, reading, writing, carrying,
    or promulgating this Dharmaparyaya is equivalent to carrying the Tathagata, building
    and worshiping relic stupas, and building well-provisioned monasteries.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Those who most decidedly believe in the duration of the Tathagata's life will
    behold him teaching the law on Grzdhrakuta, surrounded and attended by Bodhisattvas,
    in the center of a congregation of disciples.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buddha-field in the Saha-world is described as lapis lazuli, a level plain,
    a chequered board of eight compartments with gold threads, set off with jewel
    trees, and including towers used by Bodhisattvas as abodes.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young man of good family who joyfully accepts this Dharmaparyaya after hearing
    it after the Tathagata's complete extinction is described as earnest in belief;
    one who keeps it in memory or reads it is presented as more so.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One who collects this Dharmaparyaya into a volume and carries it on the shoulder
    is said to carry the Tathagata on the shoulder.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Such a young man or young lady of good family is said to need no Stupas, monasteries,
    or gifts of medicaments and requisites to the congregation of monks.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Such a person is said to have spiritually built relic Stupas of seven precious
    substances reaching to the Brahma-world, with umbrellas, triumphal streamers,
    tinkling bells, and baskets.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage lists acts of respect to those relic Stupas, including celestial
    and earthly flowers, incense, garlands, ointments, powder, cloth, umbrellas, banners,
    flags, triumphal streamers, drums, musical instruments, castanets, songs, nautch,
    and dancing over innumerable aeons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: One who keeps, reads, writes, and promulgates the Dharmaparyaya after the
    Tathagata's extinction is said to have built large red-sandalwood monasteries
    with thirty-two pinnacles and eight stories, suitable for a thousand monks and
    provided with gardens, lodgings, food, drink, medicine, and comforts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A translator's note states that this teaching agrees with a Vedanta teaching
