canonical_text:
  quote: ''
  summary: A first-person speaker addresses Ma%\"ughosha/Mangusrl and reports seeing
    many Bodhisattvas and beings in many fields. They cultivate enlightenment through
    gifts, bodily and familial offerings, renunciation, monastic practices, wilderness
    life, mountain-cave meditation, praise, questioning about the law, and memorization
    of teaching.
  language: English
  quote_policy: summarized
