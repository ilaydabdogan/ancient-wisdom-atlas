canonical_text:
  quote: ''
  summary: An old rich householder longs for his absent son to inherit his wealth.
    A poor man seeking food and clothing approaches the rich man's house, sees his
    own father seated in great pomp, mistakes him for a king or grandee, and flees
    in fear. The rich man recognizes him as his son, sends couriers to fetch him,
    and the couriers violently seize the poor man, who cries out, fears capital punishment,
    faints, and falls to the ground; the father then reacts with dismay.
  language: English
