canonical_text:
  quote: ''
  summary: Four leading Bodhisattvas Mahasattvas at the head of a great host greet
    the Lord with joined hands and inquire about his health and about the docility
    of his creatures. The Lord answers that he is well, that the creatures are obedient,
    and that they trust and understand Buddha-knowledge because of preparation under
    ancient perfectly enlightened Buddhas. The Bodhisattvas rejoice, the Lord approves
    their congratulations, and Maitreya with an immense company of Bodhisattvas wonders
    about the host that has issued from the gaps of the earth to honor the Lord.
  language: English
  quote_policy: summarized
