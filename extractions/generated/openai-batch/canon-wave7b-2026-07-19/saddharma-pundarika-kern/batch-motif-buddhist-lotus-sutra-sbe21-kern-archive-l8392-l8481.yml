canonical_text:
  quote: ''
  summary: Brahma-angels perceive their brilliant aerial cars as a rare portent. Sudharma
    urges investigation, saying that either a god has been born or a Buddha has arisen.
    Great hosts of Brahma-angels present their cars to the Lord Mahabhi^a^anabhibhu,
    praise his rare appearance, ask him to preach the law and save beings, and the
    Lord silently assents. The same pattern is said to occur in other directions and
    in the nadir.
  language: English
  quote_policy: summarized
