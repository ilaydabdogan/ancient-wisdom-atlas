canonical_text:
  quote: The Buddha knowledge, Sariputra, is profound, difficult to understand, difficult
    to comprehend.
  summary: At the opening of Chapter II, titled “Skilfulness,” the Lord rises from
    meditation and addresses Sariputra. He states that Buddha knowledge and the mystery
    of the Tathagatas are difficult to understand, even for disciples and Pratyekabuddhas,
    because the Tathagatas have worshipped innumerable Buddhas, completed the course
    toward supreme enlightenment through countless aeons, wandered far with energy
    and marvellous qualities, and discovered difficult things.
