  evidence_refs:
  - ev:1
- id: obs:2
  text: Vaisrava^a says he will guard preachers over an extent of a hundred yojanas,
    and that young men or young ladies of good family who keep the Sutranta will be
    guarded and safe.
  category: speech
  evidence_refs:
