canonical_text:
  quote: ''
  summary: In the chapter on spells, Vaisrava^a, Virfo/^aka, and a group of giantesses
    pronounce or promise talismanic protection for preachers who keep the Sutranta.
    The passage lists hostile beings, diseases, dreams, assault, and poison from which
    such preachers are to be protected, threatens attackers with severe consequences,
    praises honoring the text with offerings, and concludes with sixty-eight thousand
    beings receiving acquiescence in the law that has no origin.
  language: English
  quote_policy: summarized
