canonical_text:
  quote: bound a priceless gem within his garment
  summary: The speakers confess that they were content with lesser knowledge. They
    tell a parable in which a friend hides a priceless gem in a man's garment; the
    man later wanders in poverty until the friend reveals the gem and tells him to
    use it. They apply the parable to the Tathagata, who had formerly raised ideas
    of omniscience and roots of goodness in them though they did not perceive it.
    The Lord now corrects their mistaken view of Nirvana and predicts their future
    supreme enlightenment.
  language: English
  quote_policy: quoted
