canonical_text:
  quote: ''
  summary: The speaker reflects that the law is lofty while creatures are ignorant.
    Brahma, Indra, other rulers and divine hosts entreat him respectfully. He hesitates
    to preach because beings may not heed the law, considers quiet extinction, then
    remembers former Buddhas and resolves to use skilfulness. Buddhas from all directions
    appear and affirm his plan to teach the highest word in three parts, so that beings
    of low inclination may eventually believe they can become Buddhas. He goes to
    Benares, preaches to five Solitaries, and says the wheel of his law begins to
    move, with the names Nirvana, Arhat, Dharma, and Sangha appearing in the world.
  language: English
  quote_policy: summarized
