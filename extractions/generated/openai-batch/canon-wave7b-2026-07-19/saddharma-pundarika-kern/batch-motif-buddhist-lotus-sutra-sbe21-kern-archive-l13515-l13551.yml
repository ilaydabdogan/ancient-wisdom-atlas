canonical_text:
  quote: ''
  summary: 'The speakers use a simile: it would be hard to believe that a young man
    of about twenty could be father to wrinkled, grey-haired centenarians. They apply
    this difficulty to the many advanced Bodhisattvas, described as wise, long-instructed,
    firm, and as sons of Sugata, asking the Lord to explain truthfully how he brought
    them to maturity and to remove doubt.'
  language: English
  quote_policy: summarized
