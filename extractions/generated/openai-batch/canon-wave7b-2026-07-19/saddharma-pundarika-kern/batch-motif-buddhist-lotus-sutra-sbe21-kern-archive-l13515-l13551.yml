- id: obs:3
  text: The speakers state that it would be difficult to believe that such aged men
    were sons of so young a man.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speakers compare their inability to conceive the matter with the case
    of numerous Bodhisattvas of good memory, excelling in wisdom, and instructed during
    thousands of kotis of aeons.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Bodhisattvas are described as firm, keenly intelligent, lovely and agreeable
    to sight, free from hesitation in decisions on the law, and praised by the Leaders
