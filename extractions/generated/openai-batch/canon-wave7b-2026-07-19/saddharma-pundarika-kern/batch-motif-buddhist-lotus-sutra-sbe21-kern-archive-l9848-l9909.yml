canonical_text:
  quote: ''
  summary: A parable tells of a wealthy friend who feeds a man and secretly ties a
    valuable jewel in his upper robe. The man forgets it, falls into poverty, and
    later is shown the jewel by the same friend, becoming joyful and wealthy. The
    speakers then apply this to their own unawareness of a former aspiration laid
    in them by the Tathagata, their contentment with little Nirvana, and their joy
    after hearing the higher teaching and prediction.
  language: English
  quote_policy: summarized
