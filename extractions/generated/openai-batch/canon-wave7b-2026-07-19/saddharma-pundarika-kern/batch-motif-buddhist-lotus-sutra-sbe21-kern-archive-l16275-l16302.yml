canonical_text:
  quote: ''
  summary: At the opening of Chapter XXI, titled “Spells,” the Bodhisattva Mahasattva
    Bhaishajyaraja makes a reverential gesture before the Lord and asks how much pious
    merit is produced by a young man or woman who preserves the Lotus of the True
    Law in memory or in a book. The Lord answers by comparing that act to honoring
    innumerable Tathagatas and declares that keeping, reading, comprehending, and
    practicing even a single stanza of this teaching produces far more pious merit.
  language: English
