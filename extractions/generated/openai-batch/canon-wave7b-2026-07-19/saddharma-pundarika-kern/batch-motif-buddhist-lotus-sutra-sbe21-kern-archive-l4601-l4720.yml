canonical_text:
  quote: The house is burning with a mass of fire.
  summary: A strong, wealthy father sees that his children are in a burning house
    and will not heed a direct warning. Knowing their desires, he promises bullock-carts,
    goat-carts, and deer-carts outside the house, so they rush out and are saved.
    He then gives all of them magnificent bullock-carts, called the greatest vehicles.
    Sariputra says this is not falsehood because it is a skilful device to save their
    lives. The Lord affirms this and says that the Tathagata is the father of the
    world, perfected in skilful means and compassion.
  language: English
  quote_policy: quoted
