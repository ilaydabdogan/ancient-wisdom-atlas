canonical_text:
  quote: guard, defence, and protection
  summary: Two Bodhisattvas offer talismanic words or spells to protect those who
    keep, preach, or preserve the Lotus of the True Law. The Lord approves the first
    spell as compassionate protection. Both spell sets are said to have been pronounced
    or approved by many Buddhas or Tathagatas, who would be offended by attacks on
    such preachers.
  language: English
  quote_policy: quoted
