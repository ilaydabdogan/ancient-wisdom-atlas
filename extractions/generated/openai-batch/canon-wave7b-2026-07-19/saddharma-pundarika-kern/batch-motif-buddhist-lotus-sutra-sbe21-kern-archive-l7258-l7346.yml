canonical_text:
  quote: There is no (real) Nirvana without all-knowingness
  summary: The passage rebukes a person’s false claim to knowledge, describes instruction
    toward transcendent wisdom and wilderness meditation, and then applies the same
    pattern to disciples who think they have reached Nirvana, saying that final Nirvana
    requires all-knowingness and associated doctrines and practices.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Great Seers, moved by compassion, tell the addressed person that he is mistaken
    and should not be proud of his knowledge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressed person is said to be unable to perceive what is happening outside
    while he remains inside his room.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The addressed person is described as unable to hear a sound five yojanas away,
    unable to discern malevolent or benevolent people, unable to go a kos without
    a beaten track, and forgetful of what happened in the womb.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that one called all-knowing possesses the five transcendent
    faculties, while pretending to be all-knowing without knowledge is called infatuation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The person is instructed to seek omniscience by attending to transcendent
    wisdom, going to the wilderness, and meditating on the pure law.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The man understands, goes to the wilderness, meditates with close attention,
    and soon acquires the five transcendent faculties.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Disciples are said to imagine that they have reached Nirvana, but the Jina
    tells them that this is a temporary repose and not final rest.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Buddhas’ statement of this dogma is described as an artifice, and the
    passage says there is no real Nirvana without all-knowingness.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage lists knowledge of the three paths of time, the six perfections,
    voidness, absence of purpose, absence of finiteness, enlightenment-related laws,
    Brahmaviharas, Sangrahas, and the dreamlike or illusory nature of phenomena.
  category: other
  evidence_refs:
  - ev:7
