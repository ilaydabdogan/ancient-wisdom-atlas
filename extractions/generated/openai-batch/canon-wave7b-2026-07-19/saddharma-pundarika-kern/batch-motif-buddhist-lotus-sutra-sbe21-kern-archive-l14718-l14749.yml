canonical_text:
  quote: ''
  summary: Maitreya asks the Lord how much merit is produced by a person who hears
    the preached Dharmaparyaya and joyfully accepts it. Maitreya repeats the question
    in verse, placing it after the extinction of the great Hero. The Lord answers
    by describing any hearer, after the complete extinction of the Tathagata, who
    joyfully accepts the preaching and then goes elsewhere with the aim of expounding
    the law as heard and understood.
