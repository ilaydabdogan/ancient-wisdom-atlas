canonical_text:
  quote: The senior Subhuti, my disciple, shall in days to come be a Buddha.
  summary: The disciples ask for a prediction to end their feeling of poverty. The
    Lord announces that Subhuti will honor many Buddhas, live a spiritual life, attain
    enlightenment, and in his last bodily existence become a Tathagata named -Sksiketu.
    His future Buddha-field, Ratnasambhava, is described as beautiful, crystalline,
    adorned with jewel-trees and flowers, inhabited by disciples and Bodhisattvas,
    and a place where he will preach from the firmament and benefit many beings.
  language: English
  quote_policy: quoted
