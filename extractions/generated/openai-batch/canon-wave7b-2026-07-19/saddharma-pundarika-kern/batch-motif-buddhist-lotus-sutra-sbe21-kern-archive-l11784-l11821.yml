canonical_text:
  quote: ''
  summary: Before the whole world and the senior priest Sariputra, the daughter of
    Sagara the Naga-king undergoes a sex transformation, manifests as a Bodhisattva,
    goes south to the spotless world Vimala, sits at the foot of a tree made of seven
    precious substances, shows enlightenment, and preaches the law with radiance.
    Beings in the Saha-world see the Lord receiving homage and preaching. Hearers
    become incapable of falling back from supreme enlightenment; Vimala and the Saha-world
    shake in six ways; many beings receive spiritual attainment or predictions of
    future enlightenment. Prajnakuta and Sariputra remain silent.
  language: English
  quote_policy: summarized
