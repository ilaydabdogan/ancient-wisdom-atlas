  summary: A verse praises the Leader of the world as unmatched and expresses a wish
    to become like him. Dharawindhara rises, performs reverential gestures, and says
    that those who hear the chapter about Avalokitesvara and his miraculous power
    of transformation must have many good roots. As the Lord expounds the chapter,
    eighty-four thousand beings in the assembly turn their minds toward supreme perfect
    enlightenment. A note glosses the term Asamasama and cites Lalita-vistara as a
    lexical parallel.
