canonical_text:
  quote: ''
  summary: The passage recounts predictions of future enlightenment for Gautami, her
    accompanying nuns, and Yasodhara; the nuns respond with praise and a vow to spread
    the Dharmaparyaya in future times and other worlds. The Lord then looks toward
    a great assembly of Bodhisattvas, who rise, join their hands, understand that
    they are being invited to make the teaching known, and answer with a lion's roar.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Six thousand nuns, described as partly perfected in discipline and partly
    not, are said to become Bodhisattvas and preachers of the law before Tathagatas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gautami is told that after completing the course of a Bodhisattva she will
    become a Tathagata named Sarvasattvapriyadarsana and will give predictions to
    the six thousand Bodhisattvas about supreme, perfect enlightenment.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Yasodhara, the nun and mother of Rahula, thinks that the Lord has not mentioned
    her name.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lord comprehends Yasodhara's thought and predicts that she will become
    a Bodhisattva, a preacher of the law, and then a Tathagata with a named future
    identity in the world Bhadra and an unlimited lifetime.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gautami with six thousand nuns and Yasodhara with four thousand nuns hear
