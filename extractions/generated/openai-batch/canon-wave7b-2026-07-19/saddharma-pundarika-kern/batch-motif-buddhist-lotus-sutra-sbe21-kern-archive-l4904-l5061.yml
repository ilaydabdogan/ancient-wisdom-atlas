canonical_text:
  quote: ''
  summary: 'The passage explains that the Tathagata uses an able device: first presenting
    three vehicles and then leading beings by one great vehicle to complete Nirvana.
    The Lord then gives stanzas describing an old, decaying, foul, creature-filled
    house that catches fire while its owner''s children remain inside absorbed in
    play. The master hears them, enters quickly to save them, and warns them about
    the house''s dangers.'
