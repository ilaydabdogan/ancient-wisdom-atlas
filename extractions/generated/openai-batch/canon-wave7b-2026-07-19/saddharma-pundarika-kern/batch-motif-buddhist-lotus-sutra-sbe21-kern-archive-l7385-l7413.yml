canonical_text:
  quote: ''
  summary: The Lord addresses the monks and announces that his disciple Kasyapa will
    honor many Buddhas, preserve their true law, and in his last bodily existence
    become a Tathagata and Arhat named Ra^miprabhasa in the world Avabhasa. The passage
    gives the durations of his life, true law, and counterfeit true law, and describes
    his future Buddha-field as pure, level, beautiful, lapis-lazuli, adorned with
    jewel-trees, and patterned like an eight-part checker-board with gold threads.
  language: English
  quote_policy: summarized
