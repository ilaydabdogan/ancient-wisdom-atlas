  quote: ''
  summary: Maitreya, perceiving doubt in himself and in a vast assembly of Bodhisattvas,
    joins his hands toward the Lord and asks in verses where the previously unseen
    Bodhisattvas have come from. The verses describe innumerable Bodhisattvas as great
    seers, wise, strong in memory, lovely in appearance, striving after enlightenment,
    and accompanied by trains or attendants repeatedly compared with the sands of
    the Ganges.
