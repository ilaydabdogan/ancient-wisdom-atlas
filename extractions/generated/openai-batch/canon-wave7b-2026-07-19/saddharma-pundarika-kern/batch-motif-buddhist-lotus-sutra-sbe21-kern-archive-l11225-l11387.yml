canonical_text:
  quote: ''
  summary: The speaker, present in a Stupa with Prabhutaratna and other Lords of the
    world, addresses young men of good family. He declares that keeping, copying,
    believing, and preaching this Sutra after his extinction is more difficult than
    cosmic-scale feats such as hurling Sumeru, shaking the universe, casting away
    earth or ether, or walking through the world-ending conflagration. The passage
    praises the future keeper or preacher of the Sutra as heroic, entrusted with leadership,
    an eye of the world, and worthy of veneration.
  language: English
  quote_policy: summarized
