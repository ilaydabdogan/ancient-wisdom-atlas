canonical_text:
  quote: ''
  summary: Avalokitesvara teaches the law by assuming many forms suited to beings
    to be converted. He is described as giving safety to those in anxiety. Akshayamati
    offers him a valuable pearl necklace as a pious decoration; after initially refusing,
    Avalokitesvara accepts it out of compassion, divides it in two, and offers the
    parts to Shakyamuni and to the jewel Stupa of Prabhutaratna.
  language: English
  quote_policy: summarized
