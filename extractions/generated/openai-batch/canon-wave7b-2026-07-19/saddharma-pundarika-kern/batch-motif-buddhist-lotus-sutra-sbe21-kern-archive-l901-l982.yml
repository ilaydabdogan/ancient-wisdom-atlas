canonical_text:
  quote: The conclusion arrived at is that the Sakyamuni of the Lotus is an ideal,
    a personification, and not a person.
  summary: The passage argues that the Lotus presents Śakya/Sakyamuni as a supreme,
    all-wise being and interprets this through Upanishadic and Bhagavad-gita notions
    of Sun, Ether, Mind, Narayana, inward consciousness, and highest Brahman. It concludes
    that the Lotus's Sakyamuni is best read as an ideal personification rather than
    an ordinary historical person, while noting later Mahayana belief in the Lord's
    earthly presence.
  language: English
  quote_policy: quoted
