canonical_text:
  quote: ''
  summary: 'The passage says that those who hear and understand this Dharmaparyaya
    are near supreme enlightenment. It illustrates this with a man digging a well
    in arid land: dry white sand indicates water is far, while moist muddy sand, drops,
    and mud-spattered workers indicate water is near. The simile is applied to Bodhisattvas
    and their relation to hearing, studying, and minding the Dharmaparyaya. The passage
    further describes the Dharmaparyaya as containing the highest mystery of the law,
    discusses reactions of fear toward it, and instructs future Bodhisattva preachers
    to enter the Tathagata''s abode, put on his robe, and sit on his pulpit, defined
    as kindness to all beings, sublime forbearance, and voidness of all things.'
  language: English
  quote_policy: summarized
