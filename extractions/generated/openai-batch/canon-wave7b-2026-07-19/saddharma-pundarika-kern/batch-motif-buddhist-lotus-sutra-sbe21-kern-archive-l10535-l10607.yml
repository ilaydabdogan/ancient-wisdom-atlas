- id: obs:9
  text: After the complete extinction of the Tathagata, in the last times, a Bodhisattva
    who sets forth the Dharmaparyaya to the four classes of hearers should first enter
    the Tathagata's abode, put on the Tathagata's robe, and occupy the Tathagata's
    pulpit.
