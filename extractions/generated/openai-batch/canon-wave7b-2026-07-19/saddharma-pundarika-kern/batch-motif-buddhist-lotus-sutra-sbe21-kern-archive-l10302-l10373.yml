canonical_text:
  quote: ''
  summary: The passage declares that anyone who keeps, honors, copies, remembers,
    or communicates even a small part of the Dharmaparyaya should be regarded as destined
    for, or like, a Tathagata. Such a preacher or keeper is to be honored with ritual
    offerings and respect, may be deemed a deputy of the Tathagata after the Tathagata's
    Nirvana, and is protected by the claim that insulting such preachers is a graver
    offense than insulting the Tathagata directly.
  language: English
  quote_policy: summarized
