  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who keeps even a single stanza of the Dharmaparyaya is to be considered
    a Tathagata and honored by the whole world, including gods.
  category: relationship
  evidence_refs:
