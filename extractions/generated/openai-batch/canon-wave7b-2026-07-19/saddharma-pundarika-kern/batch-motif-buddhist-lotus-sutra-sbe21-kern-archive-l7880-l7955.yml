canonical_text:
  quote: ''
  summary: The passage measures ancient time by an immense dust-atom analogy, says
    the Tathagata remembers beings and events from countless aeons ago, and narrates
    how the Tathagata Mahabhi^a^anabhibhu defeated Mara, remained motionless for ten
    intermediate kalpas at the terrace and tree of enlightenment, then attained supreme
    enlightenment after gods prepared a high royal throne and other gods rained flowers
    around the seat.
  language: English
  quote_policy: summarized
