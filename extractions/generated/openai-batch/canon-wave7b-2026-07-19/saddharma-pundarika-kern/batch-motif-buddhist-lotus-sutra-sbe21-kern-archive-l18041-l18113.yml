canonical_text:
  quote: ''
  summary: The queen asks the two princes to display a miracle so that their father,
    King Subhavyuha, may permit them to visit the Tathagata. The princes rise into
    the air and perform sanctioned miracles involving a sky couch, dust, alternating
    rain and fire from their bodies, changes of size, disappearance, and reappearance.
    The king is converted, asks who their master is, and learns of the Tathagata teaching
    the Lotus of the True Law at the tree of enlightenment. The princes then ask their
    mother for permission to go forth into the houseless religious life.
  language: English
  quote_policy: summarized
