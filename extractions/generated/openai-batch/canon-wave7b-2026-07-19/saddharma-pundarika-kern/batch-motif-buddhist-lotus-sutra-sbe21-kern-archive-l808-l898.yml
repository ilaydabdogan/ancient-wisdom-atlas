canonical_text:
  quote: "“Common people fancy that he enters Nirvana, but in reality he only makes
    a show of Nirvana”"
  summary: 'Kern’s introduction argues that Śakya/Śākyamuni is portrayed in the Lotus
    as more than a simple deva: he is called god of gods, is treated as beginningless
    or eternal, declares that he attained Bodhi an immense time ago, only appears
    to enter Nirvāṇa, repeatedly appears in the world, and abides on Gṛdhrakūṭa. The
    passage compares this portrayal to Nārāyaṇa/Kṛṣṇa in the Bhagavad-gītā and notes
    superhuman pauses of vast duration in the Lotus narrative.'
  language: English, with French and Sanskrit excerpts
  quote_policy: quoted
