canonical_text:
  quote: As on the surface of a mirror an image is seen, so on his body this world.
  summary: The passage describes the advantages of a religious preacher or Bodhisattva
    who keeps and teaches the Dharmaparyaya. His voice brings joy and reverence, attracts
    gods, Nagas, demons, goblins, kings, Brahma, other gods, and Buddhas. He receives
    bodily purity and perfection; on his body he sees the whole triple universe, its
    beings, holy figures, and teachings, compared to images reflected in a mirror.
  language: English
  quote_policy: quoted
