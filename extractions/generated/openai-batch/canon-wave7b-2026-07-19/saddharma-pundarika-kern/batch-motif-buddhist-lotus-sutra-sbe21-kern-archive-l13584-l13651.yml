- id: obs:1
  text: The Lord contrasts the idea of enlightenment at Gaya with his statement that
    he attained supreme, perfect enlightenment many hundreds of thousands of myriads
    of kotis of aeons ago.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord describes a hypothetical man who takes dust atoms from an immense
    number of worlds, travels eastward a vast distance, and deposits them one by one
    until the whole mass of earth is carried away.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Lord asks whether anyone could imagine, weigh, count, or determine the
    number of those worlds.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Maitreya and the host of bodhisattvas answer that the worlds are incalculable,
    countless, beyond thought, and beyond even the comprehension of disciples, Pratyekabuddhas,
    and non-retrogressive bodhisattvas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Lord states that the dust atoms in all the worlds described are fewer
