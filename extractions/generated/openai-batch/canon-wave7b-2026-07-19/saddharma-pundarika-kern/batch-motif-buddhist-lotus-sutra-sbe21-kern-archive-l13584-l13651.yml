canonical_text:
  quote: ''
  summary: The Tathagata states that his enlightenment did not merely occur at Gaya
    but was attained an incalculable number of aeons ago. He gives an analogy involving
    dust atoms carried eastward across innumerable worlds; Maitreya and the bodhisattvas
    say such worlds cannot be counted or comprehended. The Tathagata then applies
    the analogy to the duration since his enlightenment and speaks of preaching the
    law in the Saha-world and many other worlds, with reference to other Tathagatas
    such as Dipankara.
  language: English
  quote_policy: summarized
