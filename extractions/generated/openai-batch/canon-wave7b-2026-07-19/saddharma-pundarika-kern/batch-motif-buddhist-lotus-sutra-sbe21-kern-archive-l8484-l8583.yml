canonical_text:
  quote: ''
  summary: The great Brahma-angel Sikhin asks why the divine cars have become extraordinarily
    radiant and wonders whether a Buddha has appeared. Vast hosts of Brahma-angels
    mount divine aerial cars, carry celestial flowers in Mount-Sumeru-sized bags,
    travel through the four quarters to the zenith, see the Lord Mahabhigñanabhibhu,
    present their cars, and praise Buddhas as world-deliverers who open the gate of
    immortality and bring beings to the safe shore. Their hymn contrasts the Buddha's
    arrival with past ages of darkness, moral decline, evil destinies, and lack of
    the Buddha-law.
  language: English
  quote_policy: summarized
