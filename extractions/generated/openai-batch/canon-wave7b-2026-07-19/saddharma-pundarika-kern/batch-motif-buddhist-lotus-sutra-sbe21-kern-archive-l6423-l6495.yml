canonical_text:
  quote: ''
  summary: 'The passage presents an analogy in which a great rain cloud covers the
    universe and waters grasses, herbs, shrubs, and trees, which grow according to
    their own capacities. It then compares the Tathagata''s appearance and preaching
    to that cloud: he calls gods, humans, and demons, declares his wisdom and guidance,
    teaches beings according to their faculties, and leads them toward freedom, happy
    states, and the law of the all-knowing.'
  language: English
  quote_policy: summarized
