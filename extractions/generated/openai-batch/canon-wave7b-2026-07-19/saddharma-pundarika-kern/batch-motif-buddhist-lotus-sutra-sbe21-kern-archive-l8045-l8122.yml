canonical_text:
  quote: ''
  summary: A hymn says that the Lord has reached supreme enlightenment and that beings
    in a darkened world seek refuge. Sixteen princes, described as boys, praise Lord
    Mahabhi^a^wanabhibhu, the Tathagata, and urge him to preach the law and move the
    wheel of the law for the benefit of beings, gods, and men. The passage then describes
    his enlightenment as accompanied by the shaking and illumination of innumerable
    spheres in the ten directions, the lighting of dark intervals beyond sun and moon,
    mutual recognition among beings there, and the shaking and illumination of gods'
    palaces and aerial cars up to the Brahma-world.
  language: English
  quote_policy: summarized
