canonical_text:
  quote: ''
  summary: After Sarvasattvapriyadarcana makes a vow of truth, cosmic signs occur
    and his arm is restored. The passage identifies him with Bhaishagyaraga, praises
    bodily self-sacrifice and shrine-burning as producing great merit, then contrasts
    such merit and the merit of keeping even one verse of the Lotus of the True Law
    with vast material almsgiving. It also compares the Lotus to the ocean surpassing
    lesser waters and begins a Sumeru mountain comparison.
  language: English
  quote_policy: summarized
