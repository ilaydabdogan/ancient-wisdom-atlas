canonical_text:
  quote: ''
  summary: Celestial beings celebrate the Lord's renewed turning of the wheel of the
    law. Sariputra says his own doubt is gone but asks the Lord to dispel the uncertainty
    of other disciples. The Lord explains that the Tathagata teaches by able devices
    according to varied dispositions and introduces a parable. In the parable, an
    old wealthy householder has escaped an old, decaying house that has caught fire,
    while his children remain inside playing, unaware of the danger and not thinking
    of escape.
  language: English
  quote_policy: summarized
