canonical_text:
  quote: ''
  summary: The passage says that the Tathagata knows the circumstances, course, duties,
    and dispositions of beings and teaches a multifarious law directed toward superior
    enlightenment. At the opening of Chapter V, the Lord addresses Maha-Kasyapa and
    other senior disciples, praises Kasyapa for proclaiming the Tathagata's real qualities,
    and states that the Tathagata has innumerable qualities, mastery over all laws,
    unchanging institutions of law, and all-knowing wisdom. A footnote glosses “all-knowing”
    philologically.
