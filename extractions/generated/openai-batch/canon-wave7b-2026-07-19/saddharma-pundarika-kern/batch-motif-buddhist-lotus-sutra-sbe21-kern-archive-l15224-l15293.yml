canonical_text:
  quote: becomes possessed of a perfect organ of smell with eight hundred good qualities
  summary: 'The passage describes the advantages of a Bodhisattva Mahasattva who keeps,
    proclaims, studies, and writes the Dharmaparyaya: his natural ear has not become
    a divine ear, but he gains a perfected organ of smell capable of discerning odors
    throughout the triple world, including earthly beings, plants, gods, divine substances,
    and Tathagatas, without impairment or loss of memory.'
  language: English
  quote_policy: quoted
