canonical_text:
  quote: |-
    the Buddha

    comes into the world like a rain-cloud
  summary: A rain-cloud covers the sky, cools the region, and pours water equally
    over the earth. Plants of many kinds absorb the same water according to their
    capacities and produce their own blossoms and fruits. The passage then explicitly
    compares this to the Buddha appearing in the world like a rain-cloud, proclaiming
    one law impartially to all beings for deliverance and rest.
  language: English
  quote_policy: quoted
