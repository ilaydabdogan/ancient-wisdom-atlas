canonical_text:
  quote: ''
  summary: The passage recounts a prayer for the infinite-sighted one to turn the
    wheel and open the gate of immortality; his exposition of the law, Four Truths,
    causation, birth, death, and suffering; the teaching activity of sixteen princely
    sons who become novices, transmit the Lotus of the True Law, and later become
    Jinas; the narrator's claim of an ancient connection with the present audience;
    and a parable of a wise guide who leads weary travelers through a dangerous waterless
    forest and magically produces a great city for their relief.
  language: English
  quote_policy: summarized
