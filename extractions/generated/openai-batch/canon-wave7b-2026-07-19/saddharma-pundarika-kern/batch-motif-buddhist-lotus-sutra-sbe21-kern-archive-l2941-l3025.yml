canonical_text:
  quote: ''
  summary: The speaker describes the Buddha-knowledge and laws of the Sugata as beyond
    the comprehension of even immeasurable numbers of disciples, sages, Pratyekabuddhas,
    and Bodhisattvas investigating for countless aeons. He asks Sariputra to trust
    the truthful declaration of the Jina and says that by superior skilfulness he
    explains the law, delivers attached beings, and shows the three vehicles to the
    assembled followers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A whole sphere full of beings like Sariputra, even investigating together,
    would be unable to comprehend the knowledge of the Sugata.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Even if the ten points of space were full of sages and disciples who investigated
    together, they would not comprehend the full immensity of Buddha-knowledge.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Pratyekabuddhas are described hypothetically as filling the ten points of
    space, free from faults, acute in faculties, at the last stage of existence, and
    numerous as reeds and bamboos.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Even if those Pratyekabuddhas investigated a part of the speaker's superior
    laws for endless myriads of aeons, they would not find out its real meaning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bodhisattvas who had served many Buddhas and preached many sermons are imagined
    as filling the world densely as reeds and bamboos while investigating the law
    realized by the Sugata.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Even after many incalculable aeons of investigation with undivided attention
    and subtle wit, such Bodhisattvas would find the knowledge beyond their ken.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Non-retrogressing Bodhisattvas numerous as the sand of the Ganges would also
    find the knowledge beyond their ken if they investigated it with undivided attention.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker states that the laws of the Buddhas are profound, subtle, inscrutable,
    and faultless, and that he knows them as the Jinas do in the ten directions of
