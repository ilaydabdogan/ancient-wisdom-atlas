canonical_text:
  quote: "“emerged from the gaps of the earth to appear in this Saha-world”"
  summary: An innumerable host of Bodhisattvas Mahasattvas emerges from gaps in the
    earth, ascends to a sky-stupa where Prabhutaratna and Sakyamuni are seated, salutes
    the Tathagatas and manifested images, and honors them with circumambulation and
    hymns. During their homage, fifty intermediate kalpas pass, but Sakyamuni’s magical
    power makes the audience perceive the interval as one afternoon and see the Saha-world
    as filled with vast numbers of Bodhisattvas. Four chief Bodhisattvas are then
    named.
  language: English
  quote_policy: quoted
