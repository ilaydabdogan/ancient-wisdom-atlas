  summary: Introductory textual-critical passage quoting a Catalogue of the Tripiṭaka
    on divergent textual witnesses and translations of the Saddharma-puṇḍarīka. It
    reports omissions, chapter-order differences, later restorations, and comparisons
    among Kumārajīva’s version, Burnouf’s French translation, and the English version
