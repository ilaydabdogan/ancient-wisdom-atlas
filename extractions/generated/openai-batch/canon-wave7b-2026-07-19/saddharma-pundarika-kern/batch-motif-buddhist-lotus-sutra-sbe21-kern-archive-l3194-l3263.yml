canonical_text:
  quote: ''
  summary: 'Some proud members leave the assembly after imagining they had attained
    and understood what they had not. The Lord tells Sariputra that the congregation
    has been cleared and begins to expound. He says that such a discourse is rare,
    like the blossom of the glomerous fig-tree; the Tathagata uses many skilful means,
    and the law is beyond reasoning and must be learned from the Tathagata. The Buddha
    appears in the world for one lofty purpose: to show and open creatures to Tathagata-knowledge,
    establish and lead that teaching, and teach the law by the one Buddha-vehicle,
    with no second or third vehicle. The passage also refers to past Tathagatas in
    countless spheres acting for the benefit and happiness of beings.'
  language: English
  quote_policy: summarized
