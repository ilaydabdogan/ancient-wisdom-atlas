canonical_text:
  quote: ''
  summary: 'The passage describes the power of the Bodhisattva who keeps the Sutra:
    through the organ of smell, while remaining on earth, he perceives celestial flowers,
    aerial cars, heavenly places and beings, higher gods, monks, disciples, other
    Bodhisattvas, the Sugata teaching the law, and beings rejoicing in that teaching.
    The faculty is stated to be a powerful natural organ of smell, prior to the perfected
    divine faculty.'
  language: English
  quote_policy: summarized
literal_observations:
