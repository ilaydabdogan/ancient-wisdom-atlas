canonical_text:
  quote: ''
  summary: The Lord tells Ananda that two thousand monks will complete the Bodhisattva
    course, worship innumerable Buddhas, acquire the true law, and attain supreme
    enlightenment simultaneously in different worlds and Buddha-fields. They will
    share the name Ratnaketurajas, have equal Buddha-fields, congregations, extinction,
    and duration of their true law. In stanzas, the Lord says they will become Buddhas
    at the foot of an exalted tree, reveal the law in every direction, and become
    extinct. The disciples rejoice and say the prediction removes doubt and is like
    being sprinkled with nectar.
  language: English
  quote_policy: summarized
