canonical_text:
  quote: I do not contemn you, worthies. You deserve no contempt
  summary: The Lord explains harmful results for rejecting the Sutra and happy results
    for keeping and teaching it. He then recounts a remote past in which a Tathagata
    taught the law, successive Tathagatas of the same name appeared, and during a
    later fading of the law the Bodhisattva monk Sadaparibhuta repeatedly told monks,
    nuns, and lay devotees that he did not contemn them and that they would become
    Tathagatas, even when they abused him and threw objects at him.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Lord says that rejecting this Dharmaparyaya and abusing or insulting people
    who keep the Sutra leads to dire results, while keeping, reading, comprehending,
    teaching, and expounding it leads to happy results and perfection of the six faculties.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In an extremely remote past, a Tathagata named Bhishmagar^itasvarara^a appeared
    in the Eon Vinirbhoga in the world Mahasambhava.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhishmagar^itasvarara^a taught the law of the four noble truths and the chain
    of causes and effects to disciples, and taught the law connected with the six
    Perfections and omniscient knowledge to Bodhisattvas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lifetime of Bhishmagar^itasvarara^a and the periods of his true law and
    counterfeit law are described with vast measures compared to Ganges sands and
    dust-atoms.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the disappearance of the counterfeit law, many Tathagatas of the same
    name appeared in succession in Mahasambhava.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the complete extinction of the first Tathagata of that name, when the
    true law had disappeared and the counterfeit law was fading, proud monks oppressed
    the reign of the law, and a Bodhisattva monk named Sadaparibhuta was present.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sadaparibhuta was called by that name because he habitually approached monks,
    nuns, and male and female lay devotees and told them that he did not contemn them,
    that they deserved no contempt, and that they were to become Tathagatas.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sadaparibhuta is said not to have taught or studied; his repeated action was
    to approach people he saw from afar and address them with his formula of non-contempt
    and future Tathagatahood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The monks, nuns, and lay devotees became irritated and angry, abused and insulted
    Sadaparibhuta, and objected to his unasked prediction of their future enlightenment.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: For many years Sadaparibhuta was abused, but he was not angry and felt no
    malignity; when people threw a clod or stick at him, he cried out from afar that
    he did not contemn them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Because he always addressed people with the same phrase, the monks, nuns,
    and lay devotees gave him the nickname Sadaparibhuta.
  category: relationship
  evidence_refs:
  - ev:7
