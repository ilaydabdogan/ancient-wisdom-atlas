canonical_text:
  quote: ''
  summary: The passage foretells that, after completing a Bodhisattva course over
    innumerable aeons, a figure will attain supreme enlightenment as the Tathagata
    Dharmaprabhasa. It describes his Buddha-field as an even, jeweled realm with divine
    vehicles in the sky, mutual visibility between gods and humans, no places of punishment,
    apparitional birth for beings, luminous and gold-colored bodies, movement through
    the firmament, and nourishment by delight in the law and meditation.
