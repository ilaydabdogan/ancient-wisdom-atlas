canonical_text:
  quote: ''
  summary: The passage describes a series of Tathagatas bearing the same name and
    lineage, then recounts Lord A'andrasuryapradipa as a former prince with eight
    sons. The sons rule great domains but renounce royal pleasures after the Lord
    leaves home and attains enlightenment. The Lord expounds a major teaching, enters
    a tranquil meditation, and is accompanied by a rain of divine flowers, a sixfold
    shaking of the Buddha-field, an astonished assembly, and a ray issuing from between
    his eyebrows. The selected range also contains editorial notes, including one
    comparing Maitreya and Mitra.
  language: English
  quote_policy: summarized
