canonical_text:
  quote: ''
  summary: 'The passage states that there is no second vehicle or second Nirvana,
    and that the Tathagata teaches provisional Nirvana as an able device. It then
    gives a parable: a guide leads a company through a vast forest toward the Isle
    of Jewels; when the travelers become afraid and want to turn back, the guide creates
    a magic city where they rest. After they are refreshed, he makes the city disappear
    and points them onward to the Isle. The passage applies the parable to the Tathagata,
    who guides beings through the forest of evils and uses skillful teaching to prevent
    them from turning back from Buddha-knowledge.'
  language: English
  quote_policy: summarized
