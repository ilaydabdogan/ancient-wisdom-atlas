canonical_text:
  quote: ''
  summary: 'The passage develops the plant-and-rain simile: one law refreshes the
    world, while beings receive it according to capacity. Different plant sizes are
    mapped to Arhats, Pratyekabuddhas, Bodhisattvas, and radiant adepts. The preaching
    of the law is compared to cloud-water poured equally everywhere and to sun and
    moon light shining impartially on all. The speaker says he reveals Buddha-enlightenment
    at the proper time, all disciples will become Buddhas, and the apparent three
    vehicles arise from beings acting differently rather than from separate ultimate
    vehicles.'
  language: English
  quote_policy: summarized
