canonical_text:
  quote: the body of the Tathagata is, so to say, collectively deposited there.
  summary: The speaker tells Bhaishajyaraja that this Sutra or Dharmaparyaya is a
    difficult-to-accept esoteric teaching preserved by the Tathagatas. Those who believe,
    read, write, honour, and recite it after the Tathagata's extinction are described
    as blessed and protected. Places where it is preached, written, studied, recited,
    or kept are to be treated as Tathagata-shrines or Stupas, even without physical
    relics, because the Tathagata's body is said to be present there.
  language: English
  quote_policy: quoted
