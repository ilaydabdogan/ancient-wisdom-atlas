canonical_text:
  quote: ''
  summary: Bodhisattvas from other worlds ask the Lord for permission to reveal, read,
    write, and worship the Dharmaparyaya in the Saha-world after his extinction. The
    Lord says this is unnecessary because he has vast numbers of Bodhisattvas in the
    Saha-world who will preserve and proclaim it. Immediately afterward the Saha-world
    opens, and innumerable gold-colored Bodhisattvas with the thirty-two signs rise
    from below the earth, each with immense retinues described by Ganges-sand measures.
  language: English
