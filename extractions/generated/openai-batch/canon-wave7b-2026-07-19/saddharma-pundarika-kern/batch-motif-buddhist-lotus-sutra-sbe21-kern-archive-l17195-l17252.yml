canonical_text:
  quote: ''
  summary: In the chapter Gadgadasvara, Lord .Sakyamuni asks the completely extinct
    Lord Prabhutaratna to produce a token summoning the Bodhisattva Gadgadasvara to
    the Saha-world. Gadgadasvara salutes his own Tathagata, circumambulates him, vanishes
    from another world with a large Bodhisattva entourage, and arrives amid Buddha-field
    movement, lotus rain, and music. He travels through the sky on a tower of seven
    precious substances to the king of mountains, salutes the Lord, circumambulates
    him seven times, offers a pearl necklace, and relays inquiries about the Lord’s
    health, the conduct of creatures, the Evil One, and Prabhutaratna in a stupa of
    seven precious substances.
  language: English
  quote_policy: summarized
