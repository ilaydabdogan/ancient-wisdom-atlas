canonical_text:
  quote: ''
  summary: Gadgadasvara is described as manifesting forms suited to beings' conversion.
    Padmasri asks what meditation enabled Gadgadasvara to benefit so many creatures;
    Sakyamuni identifies the meditation as Sarvarupasandansana/Sarvarupasandarcana
    as printed. Many bodhisattvas obtain this meditation. Gadgadasvara worships Sakyamuni
    and Prabhutaratna's relic stupa, mounts a seven-jeweled tower amid lotus-rain
    and music, returns to his own Buddha-field with his bodhisattva entourage, and
    reports his mission to his Buddha.
  language: English
  quote_policy: summarized
