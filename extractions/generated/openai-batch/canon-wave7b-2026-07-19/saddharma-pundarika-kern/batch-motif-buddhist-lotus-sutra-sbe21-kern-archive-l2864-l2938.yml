canonical_text:
  quote: ''
  summary: The passage praises the Tathagatas' skilfulness, knowledge, powers, and
    ability to release attached beings. It states that only a Tathagata knows and
    teaches all laws as they are. In stanzas, the Lord says that such leaders cannot
    be fully known by creatures, recalls following a profound course before many Buddhas
    across aeons, and says he discovered its fruit on the terrace of enlightenment.
    The law is described as unutterable and understandable only by firm Bodhisattvas.
  language: English
  quote_policy: summarized
