  summary: The passage contrasts vast charitable merit and confirmation in Arhatship
    with the greater merit of a remote hearer who joyfully accepts even a word or
    stanza of the Dharmaparyaya. It then lists future benefits for those who go to
    hear the discourse, sit or share a seat at its preaching, or exhort another person
    to hear it, including vehicles, exalted seats, connection with Bodhisattvas, keen
    faculties, wisdom, and purity of mouth.
