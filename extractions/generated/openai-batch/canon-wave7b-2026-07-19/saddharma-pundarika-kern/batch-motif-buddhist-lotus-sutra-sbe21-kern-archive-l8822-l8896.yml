canonical_text:
  quote: ''
  summary: The passage says that those who do not reject the preaching of the young
    men will quickly gain supreme enlightenment and Tathagata-knowledge. It recounts
    the sixteen Bodhisattva novices revealing the Lotus teaching under a Lord, inspiring
    innumerable beings to follow them into mendicant life, hear the law, and propitiate
    many Buddhas. It then declares that the sixteen princes have all attained supreme
    enlightenment and now abide as Tathagatas in various directions and Buddha-fields,
    preaching to disciples and Bodhisattvas.
  language: English
  quote_policy: summarized
