  evidence_refs:
  - ev:4
- id: obs:8
  text: The stanzas identify Sariputra as the future Tathagata Padmaprabha, who will
    educate many living beings and reach supreme perfect enlightenment after honoring
    many Buddhas and developing the ten powers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The future field is described as having lapis-lazuli ground set off with gold
    threads and hundreds of jewel trees covered with blossoms and fruits.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: In his last bodily existence, the future Buddha passes through the state of
    prince royal, renounces sensual pleasures, leaves home as a wandering ascetic,
