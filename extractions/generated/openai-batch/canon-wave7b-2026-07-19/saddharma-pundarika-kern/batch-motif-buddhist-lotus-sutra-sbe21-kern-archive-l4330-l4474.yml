  text: The Bodhisattvas of that field step on jewel lotuses while walking and are
    described as having accumulated roots of goodness under many Buddhas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The future Tathagata Padmaprabha has a lifetime of twelve intermediate kalpas,
    excluding his time as a young prince; the creatures then living have lifetimes
    of eight intermediate kalpas.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:5
  text: At the end of twelve intermediate kalpas, Padmaprabha predicts the future
    enlightenment of the Bodhisattva Dhrtiparipurna and then enters complete Nirvana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Dhrtiparipurna is predicted to become a Tathagata named Padmavrishabhavikramin,
