canonical_text:
  quote: ''
  summary: The passage predicts Sariputra's future Buddhahood as Padmaprabha in a
    jewel-rich eon and Buddha-field named Virata. It describes innumerable Bodhisattvas,
    jewel lotuses, a jeweled landscape, Padmaprabha's lifespan, his prediction of
    a successor, the duration of the true law and its counterfeit, relic veneration,
    and the assembly's joyful offerings to the Lord.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A future eon is named Maharatnapratimandita because the Bodhisattvas in the
    Buddha-field are called jewels and are numerous beyond ordinary computation.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buddha-field is named Virata and is said to contain many Bodhisattvas.
  category: setting
  evidence_refs:
