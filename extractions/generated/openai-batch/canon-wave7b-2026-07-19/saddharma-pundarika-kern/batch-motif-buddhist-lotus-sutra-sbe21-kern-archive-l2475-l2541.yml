canonical_text:
  quote: ''
  summary: A past Buddha-field illumination is described to A^ita. Under the Lord
    A'andrasuryapradipa, the Bodhisattva Varaprabha receives the Dharmaparyaya called
    the Lotus of the True Law after the Lord rises from meditation. The Lord teaches
    for sixty intermediate kalpas while seated and tranquil, and the assembly listens
    without fatigue. The Lord then announces his complete Nirvana, predicts K$rlgarbha's
    future enlightenment as Vimalanetra, enters absolute Nirvana that night, and Varaprabha
    preserves and reveals the teaching for eighty intermediate kalpas. The Lord's
    eight sons become Varaprabha's pupils, are matured for enlightenment, later worship
    many Buddhas, and one pupil is described as attached to gain and praise and forgetful
    of teachings.
  language: English
  quote_policy: summarized
