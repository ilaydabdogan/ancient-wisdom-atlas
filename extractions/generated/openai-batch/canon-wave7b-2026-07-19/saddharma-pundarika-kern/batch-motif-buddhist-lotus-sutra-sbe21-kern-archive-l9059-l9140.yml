canonical_text:
  quote: "“what to you (seems) Nirvana, that is not Nirvana.”"
  summary: The passage states that apparent Nirvana for disciples and Pratyekabuddhas
    is not final Nirvana, presents the three vehicles as an able device of the Tathagatas,
    and then recounts in verse the delayed enlightenment of Abhi^a^Mnabhibhu/Anabhibhu,
    cosmic offerings, petitions to reveal the law, and Brahma-angels asking for the
    wheel of the law to be set in motion.
  language: English
  quote_policy: quoted
