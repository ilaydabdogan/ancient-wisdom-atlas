canonical_text:
  quote: ''
  summary: A young man is foretold to attain supreme holy knowledge, teach reverent
    hearers, meditate in mountain caverns, see the gold-coloured Gina, renounce worldly
    ties, seek enlightenment at a tree, turn the wheel of the law, lead beings to
    perfect rest, and finally be extinguished like a lamp when its oil is exhausted.
    The passage closes by stating the advantages of one who expounds the Sutra at
    the end of time.
  language: English
  quote_policy: summarized
