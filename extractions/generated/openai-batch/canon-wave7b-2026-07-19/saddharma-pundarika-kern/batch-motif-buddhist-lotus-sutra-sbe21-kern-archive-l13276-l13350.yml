canonical_text:
  quote: ''
  summary: The Lord tells the Bodhisattvas to be prepared and attentive because he
    will reveal the knowledge, leadership, work, sport, might, and energy of the Tathagata.
    In stanzas he asks them not to dispute and says the Tathagata's knowledge and
    laws are beyond reasoning. He then tells Maitreya/Ajita that the innumerable Bodhisattvas
    who have issued from gaps in the earth were developed, instructed, and perfected
    by him after his enlightenment. These Bodhisattvas dwell in the Saha-world below
    in the domain of the ether-element, devote themselves to study and Buddha-knowledge,
    avoid crowds, and delight in seclusion.
  language: English
  quote_policy: summarized
