canonical_text:
  quote: ''
  summary: A first-person speaker reports hearing the Buddha's law, gaining joy, and
    losing doubts. The speaker reflects in solitary settings, regrets former misunderstanding,
    recalls being drawn from wrong views by the Buddha, distinguishes a prior idea
    of Nirvana from complete Nirvana associated with future Buddhahood, briefly suspects
    Mara's deception, then accepts the Buddha's skillful teaching and resolves to
    become a Buddha who teaches others.
  language: French
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he heard the sound of the law, obtained what he had not previously
    had, felt great joy, and that the nets of doubts disappeared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Buddha's voice is described as rare and able to destroy the mental torments
    of mortals; after hearing it, the speaker is freed from grief and mental torments.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker says that when staying on mountains, in valleys, or beneath forest
    trees, whether sitting or walking, he constantly thinks about the matter and reproaches
    himself.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says, 'we too are sons of the Buddha' and that they have entered
    together into the faultless law.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage lists thirty-two golden-colored signs, ten powers, means of deliverance,
    eighty signs of beauty, eighteen non-common laws, merits, and virtues as qualities
    the speaker says he did not obtain or has lost.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaker recalls seeing the Buddha in a great multitude; the Buddha's name
    and reputation fill the ten regions and he benefits all creatures.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The speaker says he was originally attached to wrong views and was a master
    of Brahmacharis.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Buddha knew the speaker's heart, drew him out of heresy, and spoke to
    him of Nirvana.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The speaker says he completely abandoned wrong views, obtained proof in the
    law of emptiness, and then thought he had reached Nirvana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The speaker now says the previous attainment was not true Nirvana; he identifies
    complete Nirvana with becoming Buddha, having thirty-two signs, and receiving
    honor from devas, yakshas, dragons, spirits, and others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The Buddha tells the speaker in the great assembly that the speaker should
    become Buddha; after hearing this law, the speaker's doubts and regrets disappear.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: At first the speaker wonders whether a demon or Mara might have taken the
    figure of the Buddha to disturb his heart.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The Buddha uses various means, comparisons, skillful words, and speeches;
    after hearing them, the speaker's heart becomes calm like the sea and the net
    of doubts is torn.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The Buddha says that innumerable past Buddhas who obtained Nirvana, and present
    and future Buddhas, have explained this law by skillful means.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: The present Honored One is addressed as having been born, gone out from the
    family, turned the wheel of the law, and explained the true way by skillful means.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: The speaker concludes that Mara did not disguise himself as Buddha; the speaker's
    heart rejoices, doubts vanish forever, and he says he will become Buddha, be respected
    by devas, turn the unsurpassed wheel of law, and instruct bodhisattvas.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
