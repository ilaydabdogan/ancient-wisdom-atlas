canonical_text:
  quote: There are no three vehicles by any means ; there is but one vehicle in this
    world.
  summary: The passage uses images of pithlessness and echo-like insubstantiality,
    then teaches that the triple world and all laws are alike, void, without individuality,
    and not derived from an intelligent cause. One who knows this has great wisdom,
    sees the whole law, recognizes one vehicle rather than three, and understands
    Nirvana. The notes cite a comparable funeral-song image and warn that part of
    verse 80 is textually difficult.
  language: English
  quote_policy: quoted
