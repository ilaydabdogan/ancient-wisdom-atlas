canonical_text:
  quote: ''
  summary: A Buddha warns Gadgadasvara not to look down on the Saha-world despite
    its rough terrain and smaller beings. Gadgadasvara promises to go there, enters
    deep meditation without leaving his seat, and a vast mass of lotuses appears before
    Sakyamuni on the Gridhrakuta mountains. Manjusri asks about the lotuses; Sakyamuni
    identifies Gadgadasvara, arriving from an eastern Buddha-field with a vast bodhisattva
    retinue to honor him and hear the Lotus of the True Law. Manjusri then asks about
    Gadgadasvara’s merit and meditation and requests to learn it and see him.
  language: English
  quote_policy: summarized
