canonical_text:
  quote: ''
  summary: 'The passage describes the conduct of a wise preacher of the law: he answers
    questions as one possessing Buddha-knowledge, prepares himself and his teaching
    seat, preaches varied sermons to a mixed assembly, responds patiently to questions,
    teaches day and night without desiring gifts, and aims that all beings become
    Buddhas. It also states that a monk who preaches in this way after the Lord''s
    extinction will not meet trouble or violence.'
  language: English
