  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Buddhas are said to stand in all directions of space, be as numerous as the
    sand of the Ganges, be honored by gods and men, and expound superior enlightenment
    for beings' welfare.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Buddhas display various vehicles while indicating one single vehicle,
    described as the supreme place of blessed rest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Buddhas are acquainted with mortals' conduct, dispositions, previous actions,
