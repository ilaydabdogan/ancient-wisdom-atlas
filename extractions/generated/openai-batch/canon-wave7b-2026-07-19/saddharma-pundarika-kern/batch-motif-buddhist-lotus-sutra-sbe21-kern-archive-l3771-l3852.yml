canonical_text:
  quote: ''
  summary: The passage states that Tathagatas vow to lead beings to enlightenment
    and teach the law through a single vehicle while displaying varied vehicles, directions,
    and means according to beings' dispositions. The speaker describes beings trapped
    in suffering, bound by desire and sensory pleasure, and expresses compassion for
    them. The excerpt ends with the speaker recalling three weeks on the terrace of
    enlightenment, pondering while looking toward a tree described as the king of
    trees.
  language: English
  quote_policy: summarized
