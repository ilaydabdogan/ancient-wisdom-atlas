  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The leaders use knowledge to produce illustrations, arguments, reasons, and
    varied directions for creatures with varied inclinations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The first-person speaker, called the leader of the chief Jinas, says he manifests
    Buddha enlightenment and reveals the law through different means to rouse each
    creature according to character.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The speaker sees beings deficient in wisdom and conduct, lapsed into the mundane
    whirl, retained in dismal places, and plunged in renewed affliction.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Those beings are described as fettered by desire like a yak by its tail, blinded
    by sensual pleasure, and not seeking the Buddha or the law that ends pain.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: The beings remain in the six states of existence, hold to low views, suffer
    pain on pain, and the speaker feels great compassion for them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The speaker remained three full weeks on the terrace of enlightenment, searching
    and pondering, looking up to the tree and keeping the king of trees in view.
  category: sequence
  evidence_refs:
