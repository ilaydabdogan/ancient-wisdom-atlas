canonical_text:
  quote: ''
  summary: A prophecy says two young men will worship innumerable Tathagatas and preserve
    the Lotus teaching for beings attached to false doctrine. King Subhavyuha descends
    from the sky, praises the Tathagata's shining bodily marks and teaching, renounces
    false doctrine, salutes the Tathagata, rises to the sky, and with Queen Vimaladatta
    offers a pearl necklace. The necklace transforms into a four-column tower with
    a cloth-covered couch and a cross-legged Tathagata image, leading the king to
    reflect on Buddha-knowledge and the Tathagata's inconceivable qualities.
  language: English
  quote_policy: summarized
