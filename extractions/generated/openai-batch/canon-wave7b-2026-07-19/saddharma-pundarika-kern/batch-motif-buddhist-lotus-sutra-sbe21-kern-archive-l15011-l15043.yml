canonical_text:
  quote: ''
  summary: The chapter opens with the Lord addressing the Bodhisattva Satatasamitabhiyukta
    and declaring that one who keeps, reads, teaches, writes, or has written this
    Dharmaparyaya will gain numerous good qualities of the eye, ear, nose, tongue,
    body, and mind. These six organs become perfected, and through the perfected natural
    eye the practitioner sees the whole triple universe. A translator's note discusses
    the manuscript status of the phrase 'or a young lady' and compares female preachers
    with women religious figures in several other traditions.
