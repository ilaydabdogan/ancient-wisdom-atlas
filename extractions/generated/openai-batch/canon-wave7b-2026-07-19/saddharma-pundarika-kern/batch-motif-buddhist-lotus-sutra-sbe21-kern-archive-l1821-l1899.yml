canonical_text:
  quote: ''
  summary: The passage enumerates a vast assembly of gods, Naga kings, Kinnara kings,
    Gandharvas, demons, Garudas, and King Ajatasatru. The Lord, attended and worshipped
    by the four classes of hearers, expounds the Dharmaparyaya called the Great Exposition,
    sits cross-legged on the seat of the law, and enters a meditation called the station
    of the exposition of Infinity. Immediately afterward divine flowers fall over
    him and the hearers, and the whole Buddha-field shakes in six ways. Translator
    notes include philological comparisons concerning Sahampati and Sikhin.
  language: English
  quote_policy: summarized
