canonical_text:
  quote: ''
  summary: The Lord tells Bhaishajyaraja that he will support a young preacher of
    the Sutra from another world by sending created supporters and auditors, including
    monastic and lay devotees and, in the forest, divine and nonhuman beings. He will
    appear to the preacher and restore forgotten words. Stanzas then urge attentive
    hearing of the Sutra, compare progress toward Buddha-knowledge to a well-digger
    inferring water from moist sand, and instruct the preacher to preach from the
    Lord's abode, robe, and seat, identified as kindness, forbearance, and voidness,
    while patiently enduring hostility.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Lord speaks to Bhaishajyaraja about a young man of good family who preaches
    before hearers striving for the Bodhisattva vehicle.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Lord says that, while staying in another world, he will use fictitious
    creatures to make the congregation favorably disposed toward the young preacher.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Lord says he will send fictitious monks, nuns, and male and female lay
    devotees to hear the preacher's sermon and not contradict him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: If the preacher retires to the forest, the Lord says he will send gods, Nagas,
    goblins, Gandharvas, demons, Garudas, Kinnaras, and great serpents to hear him
    preach.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Lord says that from another world he will show his face to the preacher
    and cause forgotten words and syllables of the Dharmaparyaya to be remembered
    again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The stanzas instruct listeners to hear the exalted Sutra without distractedness
    and state that occasions for hearing and believing it are rare.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A simile describes a man seeking water who digs a well in an arid place and
    repeatedly finds dry white sand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the simile, dry white sand is taken as a sign that water is far away, while
    moist, smooth sand gives confidence that water is near.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The stanzas say that those who have not heard or repeatedly meditated on the
    Sutra are far from Buddha-knowledge, while those who have heard and meditated
    on it are wise and near Buddha-knowledge.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The preacher is told to enter the abode of the Gina, put on his robe, and
    sit on his seat; these are identified as kindness, forbearance, and voidness.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: If clods, sticks, pikes, abusive words, or threats fall to the preacher's
    lot, he is instructed to be patient while thinking of the Lord.
  category: speech
  evidence_refs:
  - ev:7
