- id: obs:2
  text: After rising, the stupa stood in the sky and is described as a meteoric phenomenon,
    very large, sparkling, decorated with flower terraces, arches, banners, streamers,
    jewel-garlands, hour-plates, bells, fragrant scents, and high umbrellas.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The stupa’s materials are listed as gold, silver, lapis lazuli, Musaragalva,
    emerald, red coral, and Karketana-stone.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gods of paradise strewed and covered the stupa with Mandarava and great Mandara
    flowers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A voice issued from the stupa and praised Lord Sakyamuni for expounding the
    Dharmaparyaya of the Lotus of the True Law.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The four classes of hearers were filled with gladness, rose from their seats,
    joined their hands, and remained standing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Bodhisattva Mahapratibhana asked the Lord what caused the magnificent
    stupa to appear and who caused the voice to come from it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Lord said that the proper body of the Tathagata is contained condensed
    in the stupa and that this one causes the sound to go out.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Lord identified a world called Ratnavisuddha and a Tathagata named Prabhutaratna,
    who had vowed that he would not reach supreme perfect enlightenment before hearing
    the Lotus of the True Law.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the time of his complete extinction, Prabhutaratna directed that a stupa
    of precious substances be made for the bodily frame of the Tathagata and pronounced
    a blessing concerning its later appearances.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Prabhutaratna’s blessing specified that his stupa should arise in any Buddha-field
    where the Lotus of the True Law is preached, stand in the sky above the congregation,
    and shout applause to preaching Buddhas.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Lord identifies the present apparition as the relic stupa of Prabhutaratna,
    which arose above the assembled congregation in the Saha-world and applauded while
    the Lotus was being preached.
  category: relationship
