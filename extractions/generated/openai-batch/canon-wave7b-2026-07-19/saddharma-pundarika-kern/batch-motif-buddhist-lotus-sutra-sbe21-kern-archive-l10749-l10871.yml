canonical_text:
  quote: ''
  summary: A jeweled stupa rises from the earth before the Lord and stands in the
    sky over the assembly. It is richly adorned, honored by gods with flowers, and
    emits a voice praising Sakyamuni’s preaching of the Lotus of the True Law. Mahapratibhana
    asks why the stupa and voice have appeared. The Lord explains that the stupa contains
    the condensed proper body of the former Tathagata Prabhutaratna, who vowed that
    after his extinction his stupa would arise wherever the Lotus is preached and
    applaud the preaching Buddhas.
  language: English
  quote_policy: summarized
