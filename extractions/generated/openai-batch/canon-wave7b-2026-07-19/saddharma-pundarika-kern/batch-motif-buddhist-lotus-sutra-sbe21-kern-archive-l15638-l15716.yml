canonical_text:
  quote: ''
  summary: The passage describes advantages gained by a Bodhisattva Mahasattva or
    religious preacher who keeps, teaches, writes, and reads the Dharmaparyaya after
    the Tathagata's extinction. It first describes a body on which mountains, Buddhas,
    disciples, and Bodhisattvas are seen, then describes a perfected mental organ
    that understands meanings, supports prolonged preaching, remembers sermons, reconciles
    ordinary sayings with the law, knows beings' thoughts in the six conditions of
    existence, hears the Buddha's preaching, and expounds meanings and connections.
  language: English
  quote_policy: summarized
