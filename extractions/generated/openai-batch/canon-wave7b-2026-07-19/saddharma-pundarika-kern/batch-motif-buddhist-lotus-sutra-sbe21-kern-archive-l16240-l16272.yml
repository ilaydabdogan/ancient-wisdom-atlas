  quote: ''
  summary: 'The passage lists powers or advantages attributed to one who keeps the
    Sutra: seeing and worshipping past and future Buddhas in the ten points of space,
    understanding the truth reached at the terrace of enlightenment, gaining unobstructed
    apprehension of the law, discerning the meaning and connection of Sutras even
    after the leader''s extinction, illuminating others like the sun and moon, rousing
    Bodhisattvas, and leading wise Bodhisattvas who keep the Sutra after the Buddha''s
    extinction to enlightenment.'
