canonical_text:
  quote: ''
  summary: 'The passage concludes a parable in which a guide gives weary travelers
    rest by producing a magic city, then reveals it as a device and urges them onward
    to an Isle. The speaker applies the parable to his guidance of living beings:
    provisional repose and the teaching of multiple vehicles are used to help beings,
    but there is ultimately one vehicle and the goal is the knowledge of the all-knowing
    and Buddhahood.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A guide tells a weary group to be joyful and at ease because they have reached
    the limit of the forest, giving them time to rest.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the group has rested, the guide gathers them and says that he produced
    the city by magic.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The guide says he used the device because they were fatigued and might turn
    back, and he urges them to exert energy to reach the Isle.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says he is, in the same manner, the guide and conductor of thousands
    of ko/is of living beings.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker sees creatures toiling and unable to break the shell of the egg
    of evils.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker says that after beings have enjoyed repose and been tranquillised,
    he will remind them of the misery of all things and tell them that at the stage
    of Arhat they shall reach their aim.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the addressees have become Arhats, the speaker will call them together
