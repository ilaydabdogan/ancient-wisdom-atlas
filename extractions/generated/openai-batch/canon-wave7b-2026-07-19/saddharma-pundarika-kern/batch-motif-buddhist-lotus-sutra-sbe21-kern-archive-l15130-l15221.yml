  summary: 'The passage describes the auditory advantage of a religious preacher or
    Bodhisattva who preaches the Sutra: his natural hearing becomes clear and perfect,
    allowing him to hear and distinguish sounds from humans, animals, gods, Nagas,
    spirits, hell-beings, ocean beings, heavenly beings, monks, Bodhisattvas, and
    the Buddha throughout the triple world, without being overwhelmed or beguiled.'
