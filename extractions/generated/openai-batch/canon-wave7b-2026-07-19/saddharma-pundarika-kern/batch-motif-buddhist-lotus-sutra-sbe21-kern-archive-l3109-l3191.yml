  quote: '"This knowledge is too subtle, inscrutable"'
  summary: Sariputra repeatedly asks the Lord to expound a matter or law. The Lord
    twice refuses, saying that the world including the gods would be frightened and
    that proud or unwise hearers might fall or scoff. Sariputra appeals to the readiness
    of many beings in the assembly, including beings matured in former births. After
    the third entreaty, the Lord agrees to speak. The excerpt then begins to describe
    five thousand proud monks, nuns, and lay devotees rising from their seats and
    saluting.
  language: English
