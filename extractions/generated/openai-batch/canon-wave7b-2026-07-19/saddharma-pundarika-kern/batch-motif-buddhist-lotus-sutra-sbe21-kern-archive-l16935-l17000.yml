canonical_text:
  quote: ''
  summary: The passage teaches that writing, learning, preserving, and ritually honoring
    this Lotus chapter produces immeasurable merit. It further says that a female
    who hears, penetrates, grasps, and keeps the chapter will have her last existence
    as a woman and, after death, be reborn in Sukhavati with Amitayus, seated within
    a lotus throne. The reborn Bodhisattva receives transcendent faculties, sees innumerable
    Buddhas, is praised for study and exposition of the Lotus, and has merit that
    cannot be destroyed by fire or water. The passage closes by describing victory
    over the Evil One and the battle of mundane existence.
  language: English
  quote_policy: summarized
