  quote: ''
  summary: 'The passage closes the account of Gadgadasvara with bodhisattvas gaining
    meditative and doctrinal attainments. It then opens the chapter on Avalokitesvara:
    Akshayamati asks the Lord why the bodhisattva bears that name, and the Lord answers
    that beings who hear, keep, or implore Avalokitesvara''s name are released from
    troubles, including dangers of fire and river currents. The passage ends while
    introducing a case of beings sailing on the ocean.'
