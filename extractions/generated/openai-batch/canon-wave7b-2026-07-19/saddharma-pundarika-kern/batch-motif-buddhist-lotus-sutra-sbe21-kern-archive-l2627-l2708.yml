canonical_text:
  quote: ''
  summary: A radiant ray makes vast numbers of disciples, Bodhisattvas, and meditating
    sons of the Sugatas visible. The four classes of hearers rejoice and wonder. The
    Leader of the world rises from meditation, addresses Varaprabha as wise keeper
    of the law, proclaims supreme laws for a vast duration, and Varaprabha retains
    them in memory. The Leader then announces his Nirvana that night and exhorts the
    monks to apply themselves to his lessons.
  language: English
  quote_policy: summarized
