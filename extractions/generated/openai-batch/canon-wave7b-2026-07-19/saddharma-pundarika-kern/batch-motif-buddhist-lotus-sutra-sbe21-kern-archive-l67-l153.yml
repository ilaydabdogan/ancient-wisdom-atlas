canonical_text:
  quote: It consists of a series of dialogues, brightened by the magic effects of
    a would-be supernatural scenery.
  summary: The introduction identifies the Saddharma-pundarika among nine venerated
    Dharmas, characterizes it as more dramatic than epic, describes Sakyamuni as its
    chief interlocutor, notes supernatural scenic effects and displays of the Buddha's
    wisdom and power, and discusses its classification as a Mahavaipulya Sutra. A
    footnote personifies Perfect Pragña as mother/source of enlightened beings and
    connects the beginning of the first Dharma with chaos.
  language: English
  quote_policy: quoted
