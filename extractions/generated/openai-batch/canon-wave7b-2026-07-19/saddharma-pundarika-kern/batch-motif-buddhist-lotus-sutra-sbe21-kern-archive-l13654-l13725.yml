  summary: The passage states that the Tathagata adapts names, appearances, authority,
    and teachings for the education of creatures. He declares recent enlightenment
    although he was enlightened long ago, speaks truly because he sees the triple
    world as it really is, and is described as everlasting, not actually extinct,
    though making a show of extinction.
