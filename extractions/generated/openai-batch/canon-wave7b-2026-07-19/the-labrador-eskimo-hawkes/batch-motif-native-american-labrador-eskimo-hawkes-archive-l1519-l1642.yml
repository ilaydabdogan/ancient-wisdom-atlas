canonical_text:
  quote: ''
  summary: 'The passage describes traditions and historical claims about the former
    distribution of Labrador Eskimo/Inuit groups: occupation of the north shore of
    the Gulf of St. Lawrence, displacement by Montagnais Indians aided by French firearms,
    retreat to the Strait of Belle Isle and Hamilton Inlet, stories of island ambushes,
    traditions of Newfoundland visits and Beothuk trade, and an eighteenth-century
    census of old tribal divisions later disrupted by Moravian mission settlement.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Eskimo are said to have inhabited the north shore of the Gulf of St. Lawrence
    as far west as Mingan when first discovered by the French, and to have been driven
    from that area in the early seventeenth century by Montagnais Indians supplied
    with French firearms.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After that displacement, the Eskimo retreated northeastward to the Strait
    of Belle Isle and maintained a fortified island camp until about 1760, when French
    and Indian forces attacked and routed them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Local tradition places the last battle at Battle Harbour and reports a very
    large number of Eskimo slain, though the author calls the number probably exaggerated.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports a local story in which a single Eskimo kayaker lured Indian
    bands to coastal islands; the main Eskimo body then attacked, seized their canoes,
    and killed them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Labrador island is said to have received the name Massacre Island from an
    occasion like the ambush story.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: After defeat on the south coast, the Eskimo retreated northward and established
    themselves at Hamilton Inlet, also called Ivuktoke or Eskimo Bay; a few remained
    at Sandwich Bay.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage records disagreement about whether the Labrador Eskimo had permanent
    settlements south of Hamilton Inlet, while noting fortified settlements, camps,
    burying grounds, and archaeological material as evidence for at least scattered
    population.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The author states that Eskimo in border regions preferred a screen of hunting
    territory between themselves and Indian enemies, with small bands moving cautiously
    through that zone.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports a regional tradition that Eskimo visited the northern
    coast of Newfoundland yearly and traded with the Beothuks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The author argues that Newfoundland crossings would have been more plausible
    from southern camps across the Strait of Belle Isle than from north of Hamilton
    Inlet under Atlantic Labrador ice and weather conditions.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: Lieutenant Curtis's 1773 census is cited as preserving old Labrador coastal
    tribal names and population counts totaling 1,625 persons.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the establishment of Moravian missions, the Eskimo were gathered around
    mission stations and the old tribal divisions were broken up.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: A note says Governor Palliser forbade Eskimo crossing to the Newfoundland
    side of the Strait of Belle Isle, which they had visited for wood used in harpoon
    shafts.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A footnote reports that in 1914 game near an old Eskimo camp on Coats Island
    was unusually tame, and that Eskimo parties were later placed on Nottingham and
    Southampton islands to use the game supply.
  category: setting
  evidence_refs:
  - ev:10
