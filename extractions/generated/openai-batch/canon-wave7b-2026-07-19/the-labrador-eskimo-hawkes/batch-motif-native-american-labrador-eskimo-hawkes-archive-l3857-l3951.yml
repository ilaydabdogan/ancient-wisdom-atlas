  summary: A technical ethnographic description of the Labrador umiak, including its
    distribution, the name “woman’s boat,” gendered use, regional comparisons, construction,
    steering, propulsion, sail use, and seal-skin covering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The umiak is described as abandoned on the east coast of Labrador, formerly
    used at Nachvak, and still used in Wakeham bay on the west coast of Ungava bay.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The umiak is described as a large, roomy, flat-bottomed boat able to carry
    heavy loads of people and supplies.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that these boats hardly tip over, are very seaworthy, and
    can be used for voyages of 100 to 200 miles.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The appellation “woman’s boat” is said to be less appropriate in Labrador
    and Alaska than in Greenland.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Labrador and Alaska, men are described as usually in charge of the boat,
    steering and handling the big oars, while women are passengers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Men also use the umiak to hunt large game, including whale and walrus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: 'The Labrador umiak is compared with the Alaskan type: its stem and stern
    are wider, its sides straighter, and it is said to have a more unwieldy appearance.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Labrador umiak is usually about 25 feet long, with smaller models down
    to 10 feet; it has nearly straight stem and stern, projecting gunwales, and a
    straight wooden keel.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The frame is described as made from a keel, stem and stern posts, cross-pieces,
    bottom rail, ribs, side rails, gunwale, end boards, and thwarts.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The passage says it can be hard to distinguish stem from stern in Labrador
    boats, and that the ends look usable indifferently.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Men usually stand to handle long oars; a rudder is hung over the stern and
    handled as in a whaleboat.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Labrador boats ordinarily do not use a sail; when a sail is used, it can
    be used only in a fair wind because the flat-bottomed umiak cannot beat to windward.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The cover is made from large seal skins put on green, stretched by drying,
    sewn by women with a double waterproof seam, lashed to the gunwales, and tightened
    when it becomes wet and stretches.
  category: sequence
  evidence_refs:
  - ev:6
