canonical_text:
  quote: ''
  summary: Superguksoak makes the walrus from her boots and the caribou from her breeches.
    The caribou's spots are explained as corresponding to marks on the breeches. At
    first the walrus has antlers and the caribou has tusks, but because these traits
    endanger kayaks and hunters, Superguksoak changes them. She sends the caribou
    inland and calls it when she wants it.
