canonical_text:
  quote: ''
  summary: After death, an Eskimo spirit remains near its earthly places for three
    days, then looks back at its village and travels to the nu'namiut, the people
    beneath the earth. The path to the lower world passes through a long dark tunnel
    guarded by a large dog. In the lower land, the spirit lives among relatives in
    villages resembling earthly villages. The dead depend on grave offerings for food
    and drink, and neglect leaves them hungry and naked. The lower world lacks cold
    and sleet but is dark and gloomy.
  language: English
