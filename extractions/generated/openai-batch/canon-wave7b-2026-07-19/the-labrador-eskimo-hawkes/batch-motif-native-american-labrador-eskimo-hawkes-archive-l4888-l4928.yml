canonical_text:
  quote: ''
  summary: The passage describes Labrador walrus hunting methods, seasonal walrus
    locations, older and newer weapons, and several taboos concerning the cutting
    up of walrus, whale, seal, and deer meat. It compares an Alaskan Eskimo taboo
    about cutting walrus on ice and slitting a whale's visible eye with Labrador practices
    of slitting seal eyes, and it states that Torngarsoak is offended when deer-associated
    instruments are used on whale.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Walrus hunting is described as being carried on much like whaling, especially
    when ice first breaks up and walrus herds appear on floating pans and in the water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several named Labrador and Hudson Strait places are identified as former walrus
    resorts or as places named from the former presence of walrus herds.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Walrus are said to prefer a point or bay with a shelving beach where they
    can drag themselves up easily.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Walrus were hunted by crews in an umiak, or by men in kayaks who encircled
    the herd and drove it toward shore.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A full-grown walrus is described as nearly too much for one man in a kayak
    to handle.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Older walrus-hunting weapons included larger and heavier harpoons and lances
    than those used for seal; rifles later replaced many old weapons, though a harpoon
    was often still needed to secure the game.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage reports an Alaskan Eskimo taboo that walrus must be hauled onto
    the ice for cutting up and must not be cut up in the boat.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: Because the bowhead whale is too heavy to haul up in the same way, it is cut
    up in the water, but the visible eye is slit so that it may not see the operation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage explains the preceding practice as probably involving the idea
    that the animal's inua finds it distasteful for its body to be disposed of outside
    its native element or in strange surroundings.
  category: other
  evidence_refs:
  - ev:5
- id: obs:10
  text: A Labrador trace of the same idea is reported in the practice of slitting
    the eyes of the seal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In Labrador, walrus and seal meat must not be mixed; deer meat and seal meat
    must not be mixed; whale meat is kept strictly separate from deer meat.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: Instruments used in cutting up a whale must be bound with seal thongs rather
    than sinew.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: Torngarsoak is named as the chief deity of the Labrador Eskimo and is said
