  summary: The passage describes Labrador Eskimo trousers and related garments by
    material, gendered use, locality, and neighboring-group comparison. It notes sealskin,
    dogskin, moleskin, cloth, and gutskin garments, including women's dress trousers,
    men's sealskin and dogskin trousers, dogskin garments for boys, and a kayaker's
    gutskin suit from Cape Wolstenholme.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Labrador Eskimo trousers are described as made of sealskin, dogskin, or moleskin,
    depending on locality and use.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the east coast of Labrador, cloth trousers have largely replaced the older
    sealskin type.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women's short moleskin trousers reach the top of the boots, are embroidered
    at the bottom, and are worn with white-topped boots and an embroidered ci'Vapaq
    for dress occasions.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sealskin trousers are described as ordinary wear, and men's sealskin trousers
    occur in knee-length and ankle-length forms.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The passage notes use of a long sealskin legging with a combination boot or
    shoe on the east coast of Hudson Bay, and states that Labrador Eskimo do not use
    leggings like the Alaskan Eskimo.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Ungava Bay, from Fort Chimo to Cape Wolstenholme, dogskin is highly valued
    by men for trousers because it wears longer than sealskin or reindeer.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Dogskin trousers are compared with polar bearskin trousers of other Eskimo
    tribes because long hair does not become greasy from blubber as quickly.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dogskin is also used in the Ungava Bay section for dickys for small boys.
  category: object
  evidence_refs:
  - ev:3
