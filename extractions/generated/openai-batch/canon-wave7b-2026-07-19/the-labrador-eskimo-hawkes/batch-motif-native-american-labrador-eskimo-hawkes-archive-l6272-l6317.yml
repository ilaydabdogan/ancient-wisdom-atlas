canonical_text:
  quote: ''
  summary: 'The passage describes Labrador Eskimo marriage customs: girls'' transition
    into marriageable status, visible markers of marital or sexual status, residence
    with the girl''s parents after marriage, separation and divorce practices, handling
    of women''s property, reconciliation, wife exchange, and community attitudes toward
    marital cruelty.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that first marriages often involve a large age disparity
    between the man and the girl, and that a girl of about twelve or fourteen begins
    to receive attention from unmarried hunters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At this stage, the girl changes her hair from two front braids to side plaits
    fastened at the back of the head.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The girl stops wearing the square-cut qo'lituk and begins wearing a long-tailed,
    big-hooded garment associated with married women; her chin is tattooed, and her
    behavior is described as becoming shy and bashful.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Among Mission Eskimo women of Labrador, colored ribbons mark status: pink
    for a young girl, blue for a married woman, and white for a widow. The passage
    adds that in Greenland a green ribbon marks an unmarried girl who has children.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A newly married couple usually lives with the girl's parents until they can
    establish a separate home.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: A good hunter may supply food to both sides of the house, but usually assists
    his wife's family.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Separation among young couples is described as frequent, with other partners
    sought until a harmonious arrangement is reached.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Divorce may occur when the husband tells the wife to go outside, or when the
    wife runs away with pots, household utensils, and children back to her father.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: If a wife owns large property such as a tent or boat inherited from male relatives,
    a male relative holds it in trust during marriage, and she has use of it again
    when she returns home.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Separated couples may reconcile and marry again; the narrator gives an example
    of a wife who ran away every spring but was always taken back.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: An exchange of wives is described as not binding, though it may remain if
    the new arrangement suits better.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: Some men beat wives who refuse to obey, but cruelty is disapproved by the
    community, and sometimes the woman beats the man.
  category: action
  evidence_refs:
  - ev:10
