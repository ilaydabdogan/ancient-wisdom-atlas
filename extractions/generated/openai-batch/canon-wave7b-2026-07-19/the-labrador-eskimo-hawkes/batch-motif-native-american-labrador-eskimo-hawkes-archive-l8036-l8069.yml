canonical_text:
  quote: ''
  summary: 'The passage gives several origin accounts: Torngarsoak creates the first
    man, who finds a woman and becomes ancestor of the Eskimo; puppies set adrift
    in old boots bring Indians and white people; a woman who marries a dog is cast
    into the sea by her father and her severed fingers become sea mammals; another
    version says animals arise from tree chips and dry land and vegetation appear
    after waters recede.'
  language: English
  quote_policy: summarized
