canonical_text:
  quote: ''
  summary: The passage describes post-burial shamanic communication with the dead,
    beliefs that recently dead spirits can report on welfare and hunting prospects,
    accusations of bewitchment causing death, counter-magic against hostile shamans,
    a case of illness attributed to a spirit sent into a girl's stomach, general trust
    in shamans' knowledge of the spirit world, and reported but doubted accounts of
    children killed or sacrificed at mothers' graves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After burial, the officiating shaman calls the spirit of the dead and asks
    about the dead person's welfare for the benefit of the people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Recently deceased spirits are described as being in closer relation to the
    living and as better prophets of good hunting and similar matters.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: At such post-burial occasions it may be revealed that someone bewitched the
    dead person and caused sickness and death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The person identified as the offender is killed by the dead person's relatives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Serious illness is often attributed to the machinations of a neighboring angekok,
    and the response described is to fight him with local magic.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the reported Bering Strait case, an Eskimo girl could not keep food down
    because the cause was attributed to a spirit sent by another shaman to inhabit
    her stomach.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Five local shamans were unable to overcome the spell attributed to the stranger.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Eskimo are described as believing in the power of the angekut and as saying
    they must believe those who possess knowledge of the spirit world.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Labrador Eskimo reportedly told early missionaries that they would listen
    to them if the missionaries knew more of the spirit world than their angekut.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author reports persistent tales of angekut sacrificing young children
    on their mothers' graves, with a parenthetical suggestion that the spirits may
    be joined in the other world.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The author states reluctance to believe the child-sacrifice reports and suggests
    physical necessity as an alternative explanation for child strangling after a
    mother's death when the father cannot rear the child.
  category: other
  evidence_refs:
  - ev:10
