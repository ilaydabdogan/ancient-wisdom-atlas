  summary: The passage describes former whalebone houses on the northeastern Labrador
    coast, small circular stone camping houses used as hunting blinds and temporary
    shelters, and Labrador Eskimo summer skin tents, with notes comparing these structures
    to houses or blinds in Bering Strait, Baffin Island, Tunnit contexts, Hudson Strait,
    and among Polar Eskimo.
  language: English
