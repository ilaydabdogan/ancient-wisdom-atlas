  text: Old Eskimo tribes on the northeastern coast of Labrador formerly constructed
    houses using whale bones, with stone-built sides.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the described whalebone houses, whale ribs met overhead and were overlaid
    with whale shoulder-blades to form the roof.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Two large whale jaw-bones marked the entrance way, which was a long tunnel
    connecting with the house.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that the Labrador whalebone houses are alike in detail
    with Bering Strait jaw-bone houses, that whalerib houses are also found in Baffin
    Island, and that Eskimo speakers compare them with Tunnit houses while distinguishing
    Tunnit houses by narrower ground space.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Camping houses called uyalu-'k are described as small circular rock walls,
