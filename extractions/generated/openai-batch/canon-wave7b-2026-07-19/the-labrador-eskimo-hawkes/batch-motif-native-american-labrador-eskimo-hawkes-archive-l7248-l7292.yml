canonical_text:
  quote: ''
  summary: The passage describes Labrador Eskimo beliefs and practices concerning
    individual familiar spirits embodied in portable fetishes or amulets. Such objects
    may aid hunting and other ventures, may be blamed for bad luck, can be secretly
    passed to another person, may be chastised to restore good fortune, and are thought
    to lose or regain power depending on whether they are worn. The passage also lists
    charms and amulets used against sickness, including sealskin thongs, shaman-prepared
    wooden and fur amulets, unusual objects, and bird feet.
  language: English
