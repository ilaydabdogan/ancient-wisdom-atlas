literal_observations:
- id: obs:1
  text: The bird-spear is launched with a throw-stick called miqouq, described as
    a wooden implement with a groove for the spear shaft.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Older spear specimens may have an ivory button fitting into a socket in the
    throw-stick groove; modern examples may use iron or a nail in its place.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The spear shaft is supported by three fingers, the first finger goes through
    a hole, and the thumb fits into an opposite groove.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In delivery, the forearm is drawn back nearly perpendicular while the thumb
    supports the shaft and three fingers guide its direction.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After throwing, the throw-stick is placed under a sealskin thong, and the
    paddle held in the left hand is put in motion.
  category: sequence
  evidence_refs:
  - ev:4
