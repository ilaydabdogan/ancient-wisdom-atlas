canonical_text:
  quote: ''
  summary: The passage explains that caribou once had large eyes, saw far, and were
    hard for the Eskimo to hunt. After the Eskimo asked their Torngak for help, one
    caribou became thoughtful and sewed up the corners of the caribou's eyes with
    a bone and sinew, making them tamer and easier to hunt. The story is linked to
    a loose bone in the caribou foreleg or ankle shown when the tale is told.
  language: English
  quote_policy: summarized
