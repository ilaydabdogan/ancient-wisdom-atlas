canonical_text:
  quote: ''
  summary: 'The passage describes Labrador Eskimo beliefs and practices concerning
    death: the dead continue to exist, receive grave goods and offerings, linger briefly
    as ghosts, travel to different afterlife regions depending on mode of death, communicate
    through an angekok, and require special mourning, burial, protective, and divinatory
    procedures.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Death is described as a break in life rather than the end of existence; useful
    articles are placed on graves, and rotted articles are said to have been taken
    by the shade.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes a body, a spirit, and another soul corresponding
    to bodily vitality, breath, and warmth; the vitality-soul leaves at death, while
    the spirit remains around the village for three days before departing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: During the three-day period after death, sharp instruments, loud talking,
    games, and routine labour are tabooed because the ghost is considered irritable
    and potentially harmful to the community.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The final destination of the spirit depends more on the mode of death than
    on moral conduct: some dead go to a highest heaven in the Aurora Borealis, while
    those who die ordinary deaths descend to a lower world.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dead in the Aurora Borealis heaven are described as enjoying themselves
    by playing football with a walrus head.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Labrador Eskimo visit graves and place food, tobacco, and clothing on
    them for the spirits; the passage also says Alaskan Eskimo hold feasts in which
    namesakes receive favors enjoyed by the dead through them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Spirits below communicate with living relatives through the angekok, ascending
    through his body and answering questions about welfare, advice, sickness, or disasters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A gutskin raincoat is identified as the dress of spirits and is worn by the
    angekok during ceremonies or communication with spirits.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A stick called kililxin is used to call up spirits beneath the earth; the
    passage says this is not the old way, may derive from Indians, and is performed
    by old men and old women rather than a regular angekok.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: When a relative dies, the living must weep hard; grave clothes of heavy winter
    reindeer skin are prepared, and if the patient recovers those clothes must be
    given away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Before burial, a watch is set over the corpse because the corpse is thought
    liable to overpower or harm someone; only relatives may touch it, and burial assistants
    stop the left nostril with reindeer moss to avert evil influence.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In head-lifting divination, the nearest relative passes a band around the
    corpse's head, lifts it, asks questions, and interprets lightness as a negative
    answer and heaviness as an affirmative answer.
  category: action
  evidence_refs:
  - ev:9
