  quote: ''
  summary: The passage describes the parts and uses of the Labrador Eskimo bow drill,
    older and newer tool materials, methods for making ivory, stone, and bone implements,
    and the effects of trade, missionary contact, and settler contact on Labrador
    Eskimo material culture.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The Eskimo bow drill is described as having three parts: a bow, a shaft with
    pointed drill, and a mouthpiece.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bowstring is placed around the shaft; pressure is applied to the mouthpiece;
    the bow is moved to revolve the drill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The drill is used for boring holes in umiak and kayak frames, ivory and bone
    toggles, shoeing, and for starting a fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In Labrador, iron pyrites firestones were more often used for starting fires.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: Modern drills are described as having wooden shafts and mouthpieces, while
    old-style drills had these parts made of bone.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A prong of deerhorn or a flake of quartz was used for the drill's sharp point.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The drill, whetstone, and flaker are identified as tools used in making older
    ivory, stone, and bone implements and weapons.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Flint implements were chipped into form, while slate and ivory pieces were
    bored with the drill and fractured along the bored line.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The rough shape produced by boring and splitting was smoothed with a whetstone;
    file and sandpaper later replaced the whetstone in the modern process.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author states that Eskimo people still seemed to prefer the older boring
    and splitting process to modern saws introduced by traders.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: No specimens of larger stone tools common elsewhere in Eskimo culture were
    found in Labrador, though the author infers ancient Labrador Eskimo used them.
  category: other
  evidence_refs:
  - ev:10
- id: obs:12
  text: The author says Labrador Eskimo culture had been strongly modified by long
    contact with whites.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: The southern branch is described as nearly dissipated or absorbed by white
    traders and settlers, while the northern branch is described as surviving under
    Moravian nurture.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:14
  text: The author credits Moravians with encouraging continued use of native food
    and clothing.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: The author says changes in religious and social ideas affected material culture,
    and describes east-coast Labrador culture as a hybrid Eskimo culture adapted to
    white ideas.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:16
  text: The author states that a more typical Eskimo group is not encountered until
    Hudson Strait and Bay, though trader and missionary influence is also felt there.
  category: setting
  evidence_refs:
  - ev:15
