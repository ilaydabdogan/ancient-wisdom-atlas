  summary: A great angekok walking by calm water uses his torngak to turn a dry willow
    stick into a living fish; after the fish complains of wetness and cold, he wraps
    it in seaweed, returns it to the water, tells it to be useful to all the Eskimo,
    names it trout, and explains its side stripe as the seam where the seaweed folds
    meet.
