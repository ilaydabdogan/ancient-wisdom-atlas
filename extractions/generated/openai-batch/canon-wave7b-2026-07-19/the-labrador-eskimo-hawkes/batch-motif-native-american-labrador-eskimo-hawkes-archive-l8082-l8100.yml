canonical_text:
  quote: ''
  summary: The passage describes a cosmology in which an abyss, a dangerous path,
    a hard sky dome, and a hole lead to heavenly regions. Certain spirits and the
    raven have crossed there. Sky spirits light torches identified with the aurora,
    feast, play with a walrus skull, and communicate through auroral sounds. People
    answer in whispers, and youths and small boys dance to the aurora. The sky spirits
    are called selamiut, or sky-dwellers.
