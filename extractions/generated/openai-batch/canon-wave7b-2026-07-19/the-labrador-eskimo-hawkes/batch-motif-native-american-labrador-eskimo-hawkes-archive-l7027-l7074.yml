canonical_text:
  quote: ''
  summary: The passage describes sickness as possession by an evil spirit and the
    angekok’s role in expelling it with familiar spirits, using physical treatments
    and sucking through a tube. It also describes shamanic performance, apprenticeship,
    an Alaskan hanging-and-revival episode for power, spirit speech in foreign tongues,
    Western Eskimo masks for spirit familiars, a contrast with Labrador angekut, an
    Alaskan belief about dead patients’ souls becoming servant spirits, and several
    sleight-of-hand tricks.
  language: English
  quote_policy: summarized
