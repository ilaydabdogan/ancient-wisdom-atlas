canonical_text:
  quote: ''
  summary: The passage tells of Alasuq, a small but very strong dwarf of Saglek Bay,
    who accepts a giant's kayak-race challenge, makes an enormous paddle, defeats
    the giant, and is later respected. It also includes a brief comparative note about
    a similar Baffin Island dwarf-kayaker tale. A following Adlit tale recounts the
    adoption of a starving Adlit girl named Ivaranax, her return with reindeer fat
    and a reindeer-skin coat, an Adlit attack on the village, the men's retaliatory
    pursuit, and Ivaranax's mutilation and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A giant lived in Saglek Bay, did no work, stole seals from hunters, frightened
    the people by his size and strength, and was eventually killed after being induced
    to allow himself to be bound.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Alasuq is described as a dwarf who lived alone with his mother, had lost his
    father young, supported his mother, was small but very strong, and was liked by
    the people.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The giant challenged the hunters to a kayak race around an island; the hunters
    did not dare accept, but Alasuq said he would try.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Alasuq set aside his usual paddle and made an enormous paddle, larger than
    the giant's, with hand-grip holes in the middle.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: During the race Alasuq handled the large paddle strongly, outdistanced the
