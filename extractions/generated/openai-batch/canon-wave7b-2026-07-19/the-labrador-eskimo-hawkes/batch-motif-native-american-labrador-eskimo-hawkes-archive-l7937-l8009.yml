  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the race, Alasuq lived a long time and was much respected by the people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage notes that the Baffin Island Eskimo of Cumberland Sound have a
    tale of a very strong dwarf and great kayaker who defeats two young men who taunted
    him for his small size.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: An Eskimo found a starving Adlit girl by a river while hunting, learned that
    all her relatives were dead, took her home, adopted her as a daughter, and she
    was named Ivaranax.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ivaranax asked her foster-father for reindeer fat because she was tired of
    seal meat; after he angrily told her to go to the Adlit for it, she disappeared
    and later returned wearing a reindeer-skin coat and eating reindeer fat.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:10
  text: The Adlit followed Ivaranax and attacked the village while the men were hunting,
    killing the women and children except for three who hid under a pile of skins.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: When the men returned, they found the women and children dead, made many arrows,
