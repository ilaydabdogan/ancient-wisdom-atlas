    them, and killed all the Adlit except the girl.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The men kept Ivaranax for punishment, cut off both her arms, and she ran away
    bleeding before falling dead.
  category: action
  evidence_refs:
  - ev:12
