canonical_text:
  quote: ''
  summary: The passage describes regional kayak forms, Labrador kayak construction
    materials and sequence, skin covering and waterproof clothing, paddle design,
    and comparisons of speed, sea use, and long-distance travel with Greenland, Alaskan,
    Aleutian, Indian canoe, and white canoeist examples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says kayak stem and stern shape varies by region more than umiak
    shape; the Labrador and southern Baffin Island kayak is long and heavy with a
    broad level stern and long peaked stem.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mackenzie River kayak is described as turning up in a half-moon shape
    at stem and stern, a feature also said to characterize the old East Greenland
    type.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Alaskan kayak is described as turning up at the stem, sloping down somewhat
    at the stern, and being wider and shorter than the Labrador type; its entrance
    hole is round and not raised in front like eastern types.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The kayak frame is made of driftwood, with a cover of Big seal hide or Harp
    seal skins when Big seal hide is unavailable; construction tools named are the
    adze, drill, and crooked knife.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Construction begins with two upper rim or rail sticks, which are shaped with
    adze and knife and drilled for ribs and lashings; side-pieces and ribs are then
    shaped, fitted, and secured with wooden pins.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ribs are set close together, rails are held under heavy stones to retain shape,
    cross-pieces hold rails apart, lengthwise strips run from the entrance hole to
    stern and stem, and space is left for the entrance hole.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The skin covering is sewn and placed on the kayak wet so that it tightens
    as it dries and shrinks; several women help because the sewing must be finished
    before the skins dry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Double waterproof stitching makes the kayak watertight.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: In Labrador the kayaker has a gutskin coat and trousers; a drawstring can
    draw the waterproof coat around the entrance rim, and the upward slant in front
    of the hole helps divert water.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Labrador paddle is double-bladed, 10 to 12 feet long, made of hardwood
    or spruce, tipped with ivory or bone, and used alternately on either side of the
    kayak.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage says a single Eskimo in a kayak can propel it as fast as two white
    men propel a canoe, and that the Eskimo ventures into a sea that an Indian would
    not attempt in a canoe.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Labrador Eskimo handle their long, heavy kayaks easily, but the passage
    says they do not reach the recorded expertness of Greenlanders or undertake the
    same long summer coastal kayak voyages; long trips use the umiak and more recently
    the whaleboat.
  category: relationship
  evidence_refs:
  - ev:7
