    throat, and single holes at the head and tail.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The bear-shaped cup-and-ball specimen has a prescribed order of play: initial
    throws may pierce abdomen or side holes, then the player must pierce the line
    from head to tail, and missing more than once gives place to another player.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A dice-like game uses fifteen to eighteen ivory bird images, with small images
