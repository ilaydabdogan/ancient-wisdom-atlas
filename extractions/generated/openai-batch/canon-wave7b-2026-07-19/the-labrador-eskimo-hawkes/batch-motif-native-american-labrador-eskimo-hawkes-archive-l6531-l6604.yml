  summary: 'The passage describes Labrador Eskimo games: cup-and-ball with a rabbit
    skull or ivory piece and peg; a dice-like game using ivory bird and human images;
    a dotted ivory-piece matching game compared to dominoes; and cat''s cradle played
    in winter with forms such as deer, dog, and sledge.'
