  text: Cup-and-ball is played with a rabbit skull or cone-shaped ivory piece bored
    with holes, attached by a thong to an ivory peg that is used to pierce the holes
    while the object swings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old cup-and-ball specimen has an ivory piece shaped like a bear, with holes
