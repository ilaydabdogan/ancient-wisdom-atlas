canonical_text:
  quote: ''
  summary: The passage describes traditions about the Tunnit, a gigantic former people
    associated with ruins, stone houses, graves, tools, hunting practices, intermarriage
    and conflict with the present Eskimo. It recounts traditions of their extermination
    or displacement, stories of stratagems against remaining giants, and a Nachvak
    story in which Tunnit whale hunters in skin boats are capsized and many drown.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tunnit are described as a gigantic race formerly inhabiting the northeastern
    coast of Labrador, Hudson Strait, and southern Baffin Island, with ruins of stone
    houses and graves ascribed to them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says present Eskimo traditions report that Eskimo and Tunnit once
    lived together until the Tunnit were exterminated or driven out.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: An old Nachvak Eskimo account says the Tunnit had two villages in Nachvak
    Bay, built on an exposed shore, had little knowledge of boats, stole boats or
    kayaks from the Eskimo, and that this theft began the quarrel.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Eskimo version characterizes the Tunnit as large and strong but vulnerable
    to being stalked and killed while asleep.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says the favored killing method was boring holes in Tunnit foreheads
    with an awl, and notes a drill variant in a Greenland story; two brothers are
    said to have continued the warfare until the last Tunnit was exterminated.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tunnit houses are described as built with heavy rocks, whale ribs and shoulder
    blades for roofs, and two whale jaw-bones at the entrance.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Tunnit are said not to have used bow and arrow, but to have used flint-headed
    lances and harpoons with bone or ivory heads.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage describes Tunnit skin preparation, winter clothing of untanned
    deerskins, and eating meat carried under clothing until putrid.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Tunnit are said to have hunted deer by erecting long lines of stone "men"
    in a valley and hiding behind them to lance deer as they passed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage describes Tunnit tools and lamps, including larger but less well-made
    weapons, flint harpoon heads, crystal drills, slate knives, small heating lamps,
    and larger cooking lamps.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage says the Tunnit and Eskimo intermarried until betrayal by alien
    wives was reported; a Tuneq woman who betrayed an Eskimo village to the Tunnit
    had her arms cut off, and thereafter women were not taken on either side.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage says scattered remaining Tunnit were overcome by stratagems, including
    a giant at Hebron, said to be the last Tunnit, who allowed himself to be bound
    in a snow-house and was slain by Eskimo hunters.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A Nachvak woman’s story says Tunnit in two skin boats harpooned a large whale,
    were towed around the bay, capsized while entangled or attempting rescue, and
    that most people in the water drowned.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
