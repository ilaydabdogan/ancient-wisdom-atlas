canonical_text:
  quote: ''
  summary: The passage describes a Labrador Eskimo whaling festival held after the
    discovery of a dead whale, with a large snow-house, contests, singing, dancing,
    and shamanistic performances, and described as gratitude to Torngak. It includes
    a quoted report about sacrifice on a parent's grave for afterlife reunion. It
    then describes the sculping or skinning dance, in which Simon performs a hunter
    who seeks valuable fur to win a girl, skins an apparently dead animal represented
    by a boy under a shawl, and is disappointed when the animal comes alive and the
    skin proves worthless. The dance is said by Eskimo informants to teach against
    greed.
  language: English
  quote_policy: summarized
