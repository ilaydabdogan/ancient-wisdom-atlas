candidate_motifs:
- id: motif:1
  label: post-kill head suspension after white whale
  taxonomy_refs: []
  basis: The hunter who kills a white whale must sleep with his head held off the
    platform, and the author asks whether this is connected to an older head-lifting
    ceremony.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage phrases the connection to an ancient ceremony as a question,
    not as an asserted interpretation.
- id: motif:2
  label: ritual separation of sea and land foods
  taxonomy_refs:
  - duality
  basis: The passage repeatedly separates deer or reindeer from seal, walrus from
    seal, and whale-related materials from land-animal sinew.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: medium
  cautions: The taxonomy mapping to duality is broad; the passage presents concrete
    food and hunting taboos rather than an explicit cosmological doctrine.
- id: motif:3
  label: taboo violation punished by expulsion
  taxonomy_refs: []
  basis: The George River girl who persisted in eating deer and seal meat together
    was banished in winter and prevented from returning home.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is an ethnographic anecdote rather than a mythic narrative episode.
- id: motif:4
  label: whale hunt regulated by material and household taboos
  taxonomy_refs: []
  basis: Whale hunting is controlled by restrictions on weapon bindings, rotten wood,
    and the silence and stillness of women and children while men hunt.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage does not specify a named supernatural enforcer.
- id: motif:5
  label: animal-body acts securing future game
  taxonomy_refs:
  - sacred_exchange
  basis: The passage says cutting a seal's eyeball affects other seals and that returning
    heart and liver tips to water brings more seals to the hunter later.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: Only the return of body parts to water clearly resembles exchange; no
    deity or recipient is named.
- id: motif:6
  label: contamination avoidance protecting hunting success
  taxonomy_refs: []
  basis: The passage says catamenial contamination would make a hunter visible to
    game, describes kayak restrictions, and also gives a corpse-contamination avoidance
    practice.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:8
  confidence: high
  cautions: Catamenial and death contamination are separate examples grouped by the
    ethnographic passage.
- id: motif:7
  label: wandering ghost protected by temporary taboo
  taxonomy_refs: []
  basis: For three days after a death, work and sharp-edged instruments are avoided
    because they might injure the wandering ghost.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives no journey route or extended afterlife map.
- id: motif:8
  label: sympathetic miniatures preserving larger objects
  taxonomy_refs: []
  basis: Tiny boots and small lamp or kettle models are said to preserve or extend
    the durability of the corresponding full-sized objects.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage presents these as customs or ideas, not as a narrative scene.
- id: motif:9
  label: first-catch communal sharing by young hunter
  taxonomy_refs:
  - initiation
  - sacred_exchange
  basis: A young hunter must share his first seal with everyone in the village.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage does not explicitly call this an initiation, and no reciprocal
