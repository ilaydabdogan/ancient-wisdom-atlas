canonical_text:
  quote: ''
  summary: The passage reports Labrador Eskimo practices and taboos concerning white-whale
    head-lifting, separation of sea and land foods, hunting restrictions, catamenial
    and death contamination, sympathetic objects, first-seal sharing, and omen-like
    proverbs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a man in northern Labrador kills a white whale, he must sleep the following
    night with his head off the sleeping platform, held by a band and sealskin thong
    fastened to the roof.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The text says many taboos concern separating sea and land foods and avoiding
    catamenial contamination of hunters.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Reindeer or deer meat and seal meat must not be cooked or eaten together;
    the passage also lists a seal-and-walrus restriction on the east coast of Labrador.
  category: action
  evidence_refs:
  - ev:2
  - ev:4
- id: obs:4
  text: A young girl at George River who persisted in eating deer meat and seal meat
    together was banished in winter, later found famishing by another group, and not
    allowed to return home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A weapon bound with sinew must not be used on a whale, while whaling lances
    and blubber hooks must be bound with sealskin thongs.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Weapons with rotten shafts and rotten wood must not be brought into contact
    with a whale.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage says that cutting a seal's eyeball blinds other seals and makes
    them easier to capture.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When a seal is cut up, throwing the tip of the heart and liver back into the
    water is said to make more seals come to the hunter in the future.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During whale hunts, women and children must stay indoors, silent, and motionless
    while men are out.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In a Nachvak incident, a child chased a mouse inside the iglu during a whale
    hunt, and a whale already struck by the men was consequently lost.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: During her catamenial period, a woman must not step over a kayak; she must
    go around it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A catamenial woman must wear visible markers, including an ungloved left hand
    and bared first two joints of a right-hand finger, which the passage says represent
    the cut-off joints of Sedna's hand.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: People burying a corpse must stop the left nostril with reindeer moss to avoid
    contamination from the dead.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: After a death, no work is to be done for three days, and no sharp-edged instrument
    may be used because it might injure the wandering ghost.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Tiny boots worn on the back of the a'tige during long trips are said to keep
    the owner's boots from wearing out.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: When making a soapstone lamp or kettle, a small model is made, and the larger
    object is said to last as long as the model does not crack or break.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: A young hunter must share his first seal with everyone in the village.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: The passage lists omen-like ideas and sayings connecting hardship, wishes,
    disobedience, strangely marked trapped animals, boasting, and bullying with future
    outcomes.
  category: speech
  evidence_refs:
  - ev:12
