canonical_text:
  quote: ''
  summary: Near Okkak, a marked rock is linked to a story about an abused orphan boy.
    A kind little girl secretly gives him a knife and food. The boy appeals to a man
    in the moon, who descends, beats him with a whip, and thereby makes him large
    and strong. The transformed boy returns, kills the people who mistreated him while
    sparing the girl, marries her, takes the household possessions, and becomes head
    man of the village. An embedded editorial note in the line range mentions a Baffin
    Island version of a story, but its referent is ambiguous within this excerpt.
  language: English
  quote_policy: summarized
