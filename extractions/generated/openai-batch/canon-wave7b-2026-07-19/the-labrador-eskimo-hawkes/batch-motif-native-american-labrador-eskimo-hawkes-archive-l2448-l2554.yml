    spring shoot-burning rite, native and Moravian fish-curing methods, and classification
    of Ungava salmon.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Labrador is described as having abundant berries, with nearly twenty edible
    varieties distinguished and named by the natives.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Alaska, when snow disappears and first green grasses and herbs are exposed,
    Eskimo women gather handfuls of new shoots and ceremonially burn them over a small
    fire outside the iglu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Alaskan participants say the burning of new shoots ensures growth for
    the summer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The native fish-curing method removes backbone and ribs with two cuts of an
    ulu, hangs fish on notched sticks, dries the back first and then the front, and
    produces boneless fish said to keep indefinitely.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The present fish-curing method is said to have been introduced by the Moravians
    and to resemble methods used in Scandinavia and Germany, with more attention to
    cure and cleanliness.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ungava salmon are scientifically classed as Arctic salmon, while fishermen
    regard them as part of the Labrador school; they arrive two months later and are
    said to be larger and finer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The listed bush berries include blueberry, Indian pear, dewberry, dogberry,
    squashberry, and wild cherry.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The listed creeper and plant varieties include shrub blueberry, ground blueberry,
    cracker berry, baked-apple, marsh-berry, maidenhair-berry, wild strawberry, cranberry,
    crowberry, foxberry, partridgeberry, and blackberry.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A favourite dish called ewvalik combines salmon spawn, blueberries, and seal
    fat; cranberries and blueberries are staple foods, while crowberries are eaten
    when blueberries are scarce.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The natives distinguish several varieties of blueberries and blackberries
    by colour and shape, including white forms and a pear-shaped blueberry.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The baked-apple or cloudberry blossoms soon after the snow is gone, forms
    berries by late August, and is eaten green by native children before ripening.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The cranberry is described as preservative and medicinal in relation to a
    meat-heavy diet; it is gathered just before snow covers the ground and again after
    the snow disappears in spring.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage maps berry varieties across rivers, barrens, coasts, islands,
    inlets, and northern and southern Labrador, concluding that Labrador is especially
    well supplied with berries among sub-arctic Eskimo regions.
  category: setting
  evidence_refs:
  - ev:9
