  quote: ''
  summary: The passage presents demographic estimates for Labrador Eskimo populations,
    including Moravian mission membership, family counts for the Ungava district and
    east coast of Hudson Bay, and a rounded total estimate of about 2,500 persons
    for the Labrador peninsula. It also compares these figures with earlier higher
    estimates and with an early Moravian estimate of about 3,000.
  language: English
  quote_policy: summarized
