  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The family count from Cape Chidley to Great Whale river is given as 241 families,
    divided among four coastal segments.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: Using five persons per family, the passage estimates 1,205 persons from Cape
    Chidley to Great Whale river.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage totals 1,205 persons from Cape Chidley to Great Whale river, 1,250
    mission Eskimo, 35 Karawalla Eskimo, and 5 scattered survivors south of Hamilton
    inlet, yielding 2,495 persons, rounded to 2,500 for the Labrador peninsula.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that these numbers appear small compared with early explorers'
    reports of hundreds and an eighteenth-century estimate of 30,000, but it judges
    them probably a good criterion and close to an early Moravian estimate of 3,000
    for the Labrador coast.
  category: other
