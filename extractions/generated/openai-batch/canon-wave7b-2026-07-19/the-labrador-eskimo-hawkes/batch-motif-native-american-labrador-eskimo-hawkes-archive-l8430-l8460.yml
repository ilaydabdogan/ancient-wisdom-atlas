canonical_text:
  quote: That is why he is black.
  summary: Two etiological tale units are presented. In the first, an owl and raven
    quarrel, the owl tips a lamp over the raven, and the raven is covered in soot,
    explaining his black color. In the second, children playing noisily on a cliff
    frighten away seals; an angry man wishes the cliff would fall on them, and the
    cliff does so, after which the children are changed into red-footed sea-pigeons
    dwelling below cliffs.
  language: English
  quote_policy: quoted
