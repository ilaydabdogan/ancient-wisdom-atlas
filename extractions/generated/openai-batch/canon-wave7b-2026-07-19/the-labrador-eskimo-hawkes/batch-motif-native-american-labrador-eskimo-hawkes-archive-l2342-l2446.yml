  quote: ''
  summary: 'The passage describes Labrador Eskimo land-mammal and minor-food subsistence:
    caribou hunting during migrations, meat caching and preparation, eating raw or
    boiled animal foods, blood soup, gathering eggs and birds for winter use, women''s
    collection of herbs, moss, roots, and tubers, and fish harvesting and curing.
    Footnotes compare some practices with Greenland and Alaskan Eskimo examples.'
