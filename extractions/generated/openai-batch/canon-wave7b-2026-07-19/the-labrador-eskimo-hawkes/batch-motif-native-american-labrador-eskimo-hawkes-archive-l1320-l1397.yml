canonical_text:
  quote: ''
  summary: 'A historical-ethnographic account describes Moravian missionary efforts
    among Labrador Eskimo/Inuit communities: gaining official support, helping make
    peace, seeking reservation land, founding the Nain settlement, formalizing the
    station with explanation, signatures, and gifts, encountering difficulties in
    conversion, and using mission trade stores to counter the attraction of southern
    traders.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Governor Palliser sent Haven to England to seek assistance, and Haven returned
    with other Moravian missionaries, including Christian Drachardt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Eskimo are described as pleased to meet white men who were friends and
    could speak their language; the work is said to have enabled Palliser to make
    peace with them at Chateau.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Settlement work was delayed partly because the Moravians requested 100,000
    acres of land for each settlement.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stated reason for the large land request was to establish a reservation
    to keep the Eskimo away from the influences of dissolute whites.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: In 1770 Haven, Drachardt, and Jensen led an expedition that made a settlement
    at Nain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The grant and purpose of the station were explained to the Eskimo, who were
    described as pleased that the Brethren had come to live permanently among them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Segulliak and Mikak helped prepare the way for the Moravian settlement effort.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A document was drawn up and signed by Eskimo head men, and a gift was made
    to each family.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The next year the Moravians brought a house and stores and settled into their
    work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The narrator describes the missionary task as converting Eskimo people into
    peaceful Christians and changing their customs and thought.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: One man, when asked if he believed in the Saviour, said he believed very much
    but wanted a knife at present.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The same man later took additional wives and, when questioned, said he needed
    them to man his boat.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: When missionaries spoke of the death of Christ, Eskimo listeners are said
    to have thought they were being upbraided for former murders.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Southern white traders are described as attracting Eskimo people with tobacco,
    gew-gaws, and rum, and Mikak is named among those affected.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Moravians established trade stores connected with the missions to keep
    Eskimo people at home and away from southern trader contact.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:16
  text: 'Mission trade regulations are described as strict: native products were bought
    at low prices, trade goods were sold at reasonable prices, and profits returned
    to mission work.'
  category: other
  evidence_refs:
  - ev:9
