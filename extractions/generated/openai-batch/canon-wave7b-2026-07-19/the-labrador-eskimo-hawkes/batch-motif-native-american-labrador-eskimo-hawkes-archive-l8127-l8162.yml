canonical_text:
  quote: There was once a great angekok who felt it his duty to find out... the place
    where the caribou went
  summary: An angekok, guided by his torngak, travels for two moons to discover where
    the caribou go. At sunset he sees a large turf-and-rock house guarded by the king
    of the caribou, under whom the other caribou pass. He returns and reports what
    he saw, but does not reveal the place because his torngak warned that desire to
    kill the caribou would cause him to be turned into a mouse.
  language: English
  quote_policy: quoted
