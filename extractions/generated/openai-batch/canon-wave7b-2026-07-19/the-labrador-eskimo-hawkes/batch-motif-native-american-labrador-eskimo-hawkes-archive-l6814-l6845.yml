canonical_text:
  quote: ''
  summary: The passage describes Cape Chidley/Killinek fear of Torngarsoak, visits
    by angekut and chosen men to a cave where Torngarsoak was believed to reside,
    and offerings of reindeer fat and tobacco. It then presents an ethnographic comparison
    of male and female deities among Eskimo groups, including Sedna, Torngarsoak,
    the Old Woman/Nulirah of the Sea, and Kdcak, with comments on regional variation
    and adoption of new religious ideas.
  language: English
  quote_policy: summarized
