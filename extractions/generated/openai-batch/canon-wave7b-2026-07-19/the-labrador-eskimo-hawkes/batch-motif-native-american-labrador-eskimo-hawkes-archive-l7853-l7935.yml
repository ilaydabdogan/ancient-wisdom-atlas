canonical_text:
  quote: ''
  summary: A last Tunnit giant near Hebron takes food from hunters and is feared for
    his strength. During famine he joins a hunting party after promising to follow
    its customs. The hunters tell him he must be bound in a snow-house, then attack
    and kill him while he is bound; in both versions he breaks his bonds and kills
    some attackers before dying. His wife buries him, and a large grave in Saglek
    Bay is identified as his. A second version adds that the hunters cut through the
    snow-house wall and gives different numbers of attackers and casualties.
  language: English
  quote_policy: summarized
