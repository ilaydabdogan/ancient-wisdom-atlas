canonical_text:
  quote: ''
  summary: 'The passage describes Labrador Inuit childhood play: children imitate
    adult work, girls play with dolls and miniature household items, boys practice
    with miniature hunting weapons and ice play, children show hardiness around icy
    water, and people of several ages play ball games. It also notes stories of a
    myth hero overcoming football opponents and describes parent-child relations as
    non-punitive and mutually respectful.'
  language: English
  quote_policy: summarized
