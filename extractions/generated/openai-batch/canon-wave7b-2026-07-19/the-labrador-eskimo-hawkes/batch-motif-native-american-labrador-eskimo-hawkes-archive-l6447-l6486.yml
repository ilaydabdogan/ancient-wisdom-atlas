canonical_text:
  quote: ''
  summary: 'The passage describes Labrador Inuit attitudes and practices around death:
    little fear of death itself, fear of corpses and ghosts, shamanic involvement
    when a patient is given up, preparation of grave clothes, intense communal mourning,
    a head-lifting rite to identify the cause of sickness, night-watching over the
    corpse, removal of the body through a window or wall opening rather than the doorway,
    and precautions against household contamination when death is expected.'
  language: English
  quote_policy: summarized
