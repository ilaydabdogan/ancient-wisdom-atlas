canonical_text:
  quote: ''
  summary: An Eskimo woman is scolded by her husband over boot-soles, goes to the
    shore crying, and is approached by two Adlit who take her to their home. She marries
    one of them. Later, her Adlit husband meets her former husband while hunting but
    refuses to take him to her. When travelling people later encounter an Adlit camp
    and cannot communicate, the woman serves as interpreter. She refuses to return
    to her former husband and remains with the Adlit until death.
