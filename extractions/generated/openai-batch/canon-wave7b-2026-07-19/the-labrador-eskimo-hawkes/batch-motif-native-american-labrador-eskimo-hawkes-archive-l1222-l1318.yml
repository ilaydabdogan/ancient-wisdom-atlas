canonical_text:
  quote: ''
  summary: 'The passage describes Hawkes''s account of Moravian missionary work among
    the Labrador Eskimo/Inuit: their long association with northern Labrador communities,
    their combination of missions and trading establishments, their policy of encouraging
    native food and clothing, Erhardt''s failed 1752 mission and death while trading
    with another Eskimo group, and Jens Haven''s later preparation, support, and first
    successful linguistic contact at Carpunt.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator states that the Moravian missionaries had been closely identified
    with the northern Labrador Eskimo for about 150 years and that the term Labrador
    Eskimo was commonly applied to mission Eskimo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the Moravian Missions were criticized for running trading
    establishments beside their missions, while also stating that spiritual and secular
    administration was kept separate.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator says the Moravians encouraged the Eskimo to continue eating native
    food and wearing native clothing, and credits this policy with helping keep Eskimo
    alive in the district.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Erhardt wrote of his desire to serve in Labrador; in 1752 a vessel was fitted
    out, Erhardt served as interpreter and supercargo, four missionaries accompanied
    him, and they began erecting a station at Fords bight.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Eskimo at the first station are described as friendly, pleased to meet
    a white man who could speak their language, and engaged in barter trade with the
    missionaries.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The vessel named the Hope went north for further trade, returned with news
    that Erhardt, the captain, and five crew members had been murdered after going
    ashore to trade with a strange tribe of Eskimo, and the remaining missionaries
    abandoned the station.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The narrator describes the gospel as having been sown in blood and introduces
    Jens Haven as a Labrador apostle similar to Egede of Greenland.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Jens Haven is described as a poor German carpenter who learned the Eskimo
    language in Greenland, declared his intention to the Moravian church, traveled
    to London, and received assistance from Governor Palliser.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Haven was helped to reach Labrador by Captain Cook, did not find Eskimo at
    Chateau bay, and later encountered one returning person at Carpunt.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Carpunt, Haven called out in Greenlandish, identified himself as a friend,
    asked the man to bring his countrymen, put on Greenland clothes, and was recognized
    by the arriving Eskimo as a countryman and friend.
  category: sequence
  evidence_refs:
  - ev:7
