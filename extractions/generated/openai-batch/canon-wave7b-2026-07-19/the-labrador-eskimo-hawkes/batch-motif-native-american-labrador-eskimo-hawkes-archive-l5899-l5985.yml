canonical_text:
  quote: ''
  summary: The passage compares Inuit tattoo designs with designs on ivory, skin,
    fur, and leather-applique work. It lists recurring forms such as dotted lines,
    Y-shaped designs, whale tails, concentric circles, crossed lines, diamonds, and
    parallel lines. It then focuses on a trifurcated line called the raven's foot,
    reporting its distribution, prior interpretations as a totem or protective mark,
    and an old woman's account connecting it to hanging a raven's claw on the breast
    for protection when approaching Torngarsoak's mountain-cave abode near Cape Chidley.
  language: English
  quote_policy: summarized
