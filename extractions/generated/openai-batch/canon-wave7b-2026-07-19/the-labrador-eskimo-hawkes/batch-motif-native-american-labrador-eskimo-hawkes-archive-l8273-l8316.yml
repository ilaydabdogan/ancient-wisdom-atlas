  summary: A snow-blind young man is mistreated and starved by his mother while his
    sister secretly feeds him. After learning that his mother hid his successful killing
    of a bear, he later regains his sight, hunts white whales, and takes revenge by
    tying his mother to a harpooned whale, which drags her into the sea. The story
    says she remains alive among the white whales and can be heard crying in spring.
