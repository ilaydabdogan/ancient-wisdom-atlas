canonical_text:
  quote: ''
  summary: The passage describes Labrador Eskimo preparation of caribou/deerskins,
    including scraping, washing, drying, applying a paste of deer brain, marrow, and
    flour, pulling the skin by hand, frost-drying white skins, smoking colored skins,
    and finishing smoked skins. It states that the method follows or imitates an Indian
    method and notes reduced local production where Indian-dressed deerskins can be
    obtained from Hudson's Bay Company posts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Labrador Eskimo dress and smoke caribou skins after
    the Indian method, with the described method obtained from a half-breed woman.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A scraper is made from the lower leg-bone of a deer, shaped like a spoke-shave
    blade; sometimes only the end is used for a vertical scraper.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The skin is laid on a round stick stood against a tree or another solid support
    before scraping.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The outside of the deerskin is scraped first; after the hair is cleaned off,
    the skin is washed and hung in the air to dry.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A paste made from deer brains, bone marrow, and dry flour is smeared on the
    outside of the skin, allowed to stiffen, and then the skin is pulled by two or
    three persons until dry; additional paste applications may be used for heavy skins.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A desired white skin is frost-dried outdoors in extremely cold weather, while
    a colored skin is smoked.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: For smoking, the caribou skin is sewn lengthwise into a skin-bag with a small
    neck opening; a drill or canvas neck may be attached to protect it from heat.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Strings and crosswise sticks are used to hang and hold open the sewn skin-bag
    so smoke can circulate inside it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Rotten wood placed in a pot or other receptacle is identified as making the
    best fire for smoking.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: After smoking, the skin is rolled tightly for two hours, unrolled, and hung
    by the fire to dry; care is taken to keep parts of the skin from touching during
    smoking to avoid whitish spots.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Where present Eskimo can obtain Indian-dressed deerskins from Hudson's Bay
    Company posts, they do little such work themselves; elsewhere they imitate Indian
    methods.
  category: relationship
  evidence_refs:
  - ev:5
