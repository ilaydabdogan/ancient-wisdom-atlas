literal_observations:
- id: obs:1
  text: A first Moravian attempt to convert the Eskimo ended in the massacre of missionaries;
    later stations were established at Nain in 1771, Okkak in 1776, and Hopedale in
    1782.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the end of the eighteenth century, the passage lists small resident populations
    at Nain, Hopedale, and Okkak, with separate counts of those professing Christianity.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fifty years after settlement, the station populations had increased; the passage
    attributes the increase and ingathering partly to the Brethren choosing good hunting
    sites.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hebron was begun in 1830 north of Okkak and had attracted 148 people in six
    years; by 1840 the four station populations totaled 1,034.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports that many Eskimo had deserted the coast north of Hebron
    and gone to Ungava.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: In 1842, malignant influenza killed many Eskimo at the mission stations; seals
    were scarce, starvation was feared, but the converts survived and by 1850 numbered
    1,297.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In 1855, famine and disease again visited the settlements; the seal hunt failed,
    59 people died at Hebron, and the passage says dearth was followed by an abundant
    season.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: In 1857, a Moravian visited North West River to discuss a possible station,
    but only ten Eskimo families were found surviving there, so the Mission declined
    to take up work among them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In 1857, dogs at the mission stations were attacked by a mysterious canine
    disease, wild game was also infected, and the diminished food supply was followed
    by a slight population decrease in the 1860 census.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: In 1876, whooping cough killed over 100 people out of a total population of
    1,200.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Zoar and Ramah were abandoned in 1890; later stations at Makkovik and Killinek
    were started at the southern and northern extremes of the Eskimo district and
    are said to have given the Moravians complete control of the Atlantic coast field.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Moravians retained some converts as missionary helpers and school teachers;
    the last available report cited in the passage lists forty-six native assistants
    in September 1913.
  category: relationship
  evidence_refs:
  - ev:11
