  quote: ''
  summary: 'The passage reports that Labrador Eskimo do not use star appearances for
    yearly time reckoning, but use stars as travel guides and name several larger
    constellations: the North Star as the unmoving star, Ursa Major as a reindeer,
    Ursa Minor as short ribs, the Morning Star and Evening Star as forerunners of
    day and night, and Orion as a sledge with uncertainty noted by the source.'
