  summary: The passage describes Labrador Inuit reindeer socks and boots. Reindeer
    socks are worn inside winter boots. Labrador boots are generally knee-length,
    with minor differences between men's and women's boots. A white pair of women's
    boots is described as formerly reserved for feasts and festivals and later worn
    to communion services. Materials include sealskin and, in northern Labrador, reindeer.
    The passage compares Labrador footwear forms and ornamentation with Alaskan, Central
    Eskimo, and Greenland examples.
