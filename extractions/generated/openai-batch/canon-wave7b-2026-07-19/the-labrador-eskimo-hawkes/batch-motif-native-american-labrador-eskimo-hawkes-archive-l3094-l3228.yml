  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Small mittens have fur-edged wrists, while large mittens may include an added
    wrist piece forming a gauntlet.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Common seal is used for ordinary mittens, Ranger seal for fancy long winter
    mittens, and long mitten cuffs may be trimmed with mink, muskrat, Arctic hare,
    or other fur chosen by the maker.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that no clear Labrador rule reserved certain mitten materials
    for men, and that seams are sometimes piped with red flannel.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Dogdriving mittens have waterproof palms of dressed sealskin to improve grip
    on the whip and keep the hand dry.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Deerskin mittens decorated with silk floral designs are made by Eskimo half-breeds
    on a one-piece pattern and are described as an adoption of Indian material and
    design.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Tanned caribou skin is sometimes used for mitten facing instead of waterproof
    dressed sealskin, but is described as a poor substitute; moleskin mittens with
    coloured-yarn floral designs occur in the southern district.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The waterproof mitten is used at sea to protect a kayaker’s hands from spray
    and in spring during damp weather.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Waterproof mittens follow the general plan of fur mittens, but their seams
    are double and outside rather than single and inside.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: 'The waterproof mitten pattern has three pieces: palm, thumb-and-front, and
    back; its sewing sequence includes single and double overedge seams, gathering,
    triple-stitching, turning, and an optional cuff.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The cap is made from five crown pieces, two earpieces or earflaps, and a small
    peak.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Cap earflaps are sewn so that they appear furry when lying against the crown
    and put fur next to the skin when drawn down over the ears.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The modern cap peak is described as ornamental, while an old woman reported
    that old-time caps had an inner peak that shaded the eyes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Caps are sewn from the inside and then turned, and specimens use materials
    such as foxlegs, martin, mink, muskrat, sealskin, loonskin, or mixtures of skins.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: 'Eskimo trousers are described as two types: a short, baggy knee-trouser and
    a long, tight-fitting trouser reaching the ankle.'
  category: object
  evidence_refs:
  - ev:7
- id: obs:15
  text: The trouser pattern uses leg, back, and front seams; it has no flap or other
    front opening and is held by a drawstring through the waistband.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:16
  text: Trouser tops may have a cloth strip but are usually plain, while the leg bottom
    is often ornamented with a white-skin strip visible above the boot.
  category: object
  evidence_refs:
  - ev:7
