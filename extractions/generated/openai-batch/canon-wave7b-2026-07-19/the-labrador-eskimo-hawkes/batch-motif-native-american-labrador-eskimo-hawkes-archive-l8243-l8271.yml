  quote: ''
  summary: A widowed hunter finds his house mysteriously kept in order. He hides and
    discovers a fox entering; inside he finds a beautiful woman, with a fox skin hanging
    above the lamp. She marries him. Later, when he notices a strong fox odor and
    questions her, she warns that she will leave if scolded, puts on the fox skin,
    disappears, and is never seen by him again.
