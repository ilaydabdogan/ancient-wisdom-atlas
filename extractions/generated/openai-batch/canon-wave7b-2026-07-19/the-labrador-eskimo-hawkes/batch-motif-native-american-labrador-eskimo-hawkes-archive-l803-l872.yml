canonical_text:
  quote: '"They saw a great number of skin canoes, and staves were brandished from
    their boats..."'
  summary: The passage introduces a historical sketch of the Labrador Eskimo, discussing
    the destruction of a southern branch and the missionary-supported survival of
    a northern branch. It then cites the Saga of Eric the Red on encounters between
    Northmen and Skraelings in skin canoes whose staves or paddles appeared to revolve
    with or against the sun, and interprets these descriptions as likely references
    to Eskimo kayaks and double-bladed paddles. It also notes a possible parallel
    with sunwise movement in certain Eskimo ceremonial dances and argues against identifying
    the Skraelings as Beothuk or Micmac.
  language: English
  quote_policy: quoted
