literal_observations:
- id: obs:1
  text: The passage states that nearly all Labrador Eskimo hunting on water is now
    done in the kayak, which is equipped with weapons for taking sea game.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The umiak was formerly used in whaling but is described as mostly out of existence
    except in isolated places in Ungava and on the east coast of Hudson Bay.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sealing harpoon is presented as the foremost item in the kayaker's equipment
    and is placed at the hunter's right front, with the coil of line before the hunter
    and the float behind.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sealing harpoon has a heavy wooden shaft, an ivory head, and a walrus-tusk
    foreshaft.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Parallel sealhide lines hold the foreshaft in the socket of the ivory head
    and prevent it from inclining to one side.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A plug is inserted near the balance point of the wooden shaft to prevent the
    hand from slipping.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The harpoon head fits onto the foreshaft and is kept taut by a line fastened
    through holes and secured by an ivory eye, loop, or pin arrangement.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: An old Eskimo explaining the harpoon is quoted as saying that there is a reason
    for everything.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: When game is struck, the harpoon head breaks off from the foreshaft; the animal
