canonical_text:
  quote: ''
  summary: 'The passage describes the Labrador Inuit dog-sled or ko''matik: its heavy
    construction, parts, regional variations, runners and shoes, winter runner coating,
    and the bridle systems used to fasten and manage dog teams.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Labrador dog-sled is described as heavier and more solidly built than
    the Alaskan sled because Labrador coastal travel crosses rugged country.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sled can carry large loads; old settlers reported sleds bearing a ton
    or twenty-four dressed caribou, while a thousand pounds is given as a good load.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Labrador sled lacks rear handles and a brake; it is guided by foot and
    held back by a thong attached to a rear cross-piece.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The sled is described as consisting of three main parts: two sides, cross-pieces,
    and shoes.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A long, heavy native sled is said to occur north of Nain, while south of Nain
    a shorter and narrower pattern is used.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The two sides are thick, deep, and long pieces; cross-pieces are set across
    the sides, notched at their ends, and used so loads may be lashed on.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Cross-pieces are attached to the runners with rawhide lashings through holes
    in the sides.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sled shoes are now made of iron, but whalebone or ivory shoes are preferred
    because they slip over snow with less resistance.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Older sled shoeing used small lengths of whalebone, deer antler, or walrus
    ivory, fitted with bone or wooden pegs; specimens were found in old graves and
    village sites.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: In midwinter the runners receive a warm coating of reindeer-moss paste, shaped
    like an iron rail, smoothed, and covered with a thin ice coating that is renewed
    daily.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The bridle is a long heavy trace tied to the bow of the runners; dog traces
    fasten to it with an ivory button, and the other end fastens in the harness.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'Two bridle forms are reported: a double bridle used on the east Labrador
    coast and down the Ungava coast to Fort Chimo, and a single bridle used by northern
    groups beyond Fort Chimo.'
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The double bridle allows dog traces to be untangled while the team continues
    traveling, without the driver stopping or leaving the sled.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
