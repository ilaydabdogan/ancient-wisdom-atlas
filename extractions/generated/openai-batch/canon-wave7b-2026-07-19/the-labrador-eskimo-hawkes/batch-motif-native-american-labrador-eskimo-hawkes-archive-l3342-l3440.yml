canonical_text:
  quote: The Eskimo always build "as the sun goes," i.e., from east to west
  summary: The passage gives an ethnographic description of Labrador Inuit snow-house
    use and construction, including snow selection, block cutting, spiral building,
    sunwise direction, keystone closure, interior arrangements, seasonal and regional
    dwelling variants, large winter festival houses, and a reported transfer of entrance-tunnel
    knowledge among Inuit groups.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Snow-house building is described as still practiced north of Hopedale, while
    in southern Labrador the custom had nearly died out and missionaries held contests
    to preserve it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: East Labrador Inuit, especially near Moravian stations, are described as living
    mostly in wooden huts, while using snow-houses as hunting-trip shelters; white
    travelers used native guides for building such shelters.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A builder selects a camp spot, tests a snowbank with boots or a long snow-knife,
    and prefers newly drifted hardening snow that adheres when blocks are joined.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The builder cuts an oblong trench and snow blocks of stated dimensions; the
    blocks are shaped semi-circularly with a slightly concave inner edge so they lean
    inward when set up.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The first tier forms a circle, and the builder works inside the ascending
    house, cutting further material from within the shrinking circle; one person can
    construct a house alone, though two may divide cutting, building, stamping, and
    crack-filling work.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the first round, a diagonal cut starts a spiral that winds upward in
    a decreasing curve; the weight of ascending blocks wedges earlier blocks together
    and makes the structure more solid.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The described construction proceeds east to west, phrased as building as the
    sun goes, and the remaining top opening is closed by a fitted keystone block.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: For longer stays an outer wall may be built with packed snow between it and
    the house wall; a smaller lean-to may be built by the door for dogs; the present
    Labrador snow-house is said usually to lack an entrance tunnel.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: In Ungava and on the east coast of Hudson Bay, snow-houses in winter and deerskin
    tents in summer are described as regular dwellings; Cape Chidley Inuit formerly
    used larger, more carefully made snow-houses as regular winter shelters.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Old missionary accounts report very large snow-houses used for winter festivals,
    and the author says these ceremonial houses probably corresponded to the Baffin
    Island qaggi or singing-house.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Northern Labrador snow-houses are described with side platforms, a lamp, mitten
    drier, kettle, reindeer-skin beds over willow twigs, a clear freshwater ice window,
    a frozen-snow door slab, and an uphill entrance tunnel supplying fresh air.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Rasmussen is cited for the statement that Polar or Smith Sound Inuit formerly
    built level tunnels until they learned the uphill tunnel variation from Cape York
    immigrants.
  category: relationship
  evidence_refs:
  - ev:8
