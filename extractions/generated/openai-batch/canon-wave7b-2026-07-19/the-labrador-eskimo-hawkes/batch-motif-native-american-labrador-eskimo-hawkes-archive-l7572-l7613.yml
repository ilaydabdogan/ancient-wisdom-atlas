  summary: A migration legend reports that Baffin Island groups once lived together
    near Ussualung, quarrelled, and separated, with the Iglumiut or Labrador Eskimo
    going south. The passage also describes dangerous Hudson Strait crossings by island
    chains called or interpreted as “stepping stones,” and a Cape Chidley legend in
