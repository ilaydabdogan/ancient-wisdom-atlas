canonical_text:
  quote: ''
  summary: The passage recounts George Cartwright's establishment of a Labrador trading
    post, his relations with Labrador Inuit called Eskimo in the text, episodes of
    trade and hospitality, a journey by several Inuit friends to London that ended
    in smallpox deaths, and the communal grief and reassurance shown when only Caubvick
    returned.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cartwright partnered with Lieut. Lucas, who knew Eskimo, intending peaceful
    trade with the Eskimo and cod and salmon fishing, and established a post at Cape
    Charles in 1770.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes Cartwright's journal as a frank record of daily post
    transactions and opinions about the people he encountered, and praises him for
    approaching native people in a way that won confidence.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lucas went north and returned with an Eskimo family who stayed at the post
    during winter and consumed many supplies; Cartwright later gave them a skin bag
    of seal flippers, flesh, and fat when supplies were low.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A considerable number of Eskimo appeared in the harbour the following July;
    Cartwright went alone to their island encampment after sending his people away
    and began trading with them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says Cartwright had no serious trouble with the Eskimo afterward
    and attributes this success to fair and firm treatment, preventing cheating or
    robbery, satisfying them in trade, and joining their sports and games.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: In a rhyming letter, Cartwright portrays the Eskimo as going to sea in shallops
    and whale boats, living peacefully and plentifully along the shore, keeping promises,
    and spending social days with sport and play.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Cartwright took several of his oldest Eskimo friends to London to impress
    them with the importance of the English; they were astonished by the sights but
    became homesick.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: One London visitor said there were too many houses, smoke, and people, and
    wished to return to Labrador where seals were plentiful.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The London visitors contracted smallpox, and only one woman, Caubvick, lived
    to see her old home again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: On Cartwright's return to Labrador, a large crowd gathered to greet the travelers;
    when only Caubvick appeared, many expressed grief by taking stones and beating
    their faces and heads.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Cartwright says he wept at the grief; the Eskimo then reassured him that they
    did not suspect his conduct toward their dead friends.
  category: relationship
  evidence_refs:
  - ev:9
