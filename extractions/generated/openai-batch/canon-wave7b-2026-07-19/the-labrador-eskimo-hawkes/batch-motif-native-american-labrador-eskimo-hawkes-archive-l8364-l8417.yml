canonical_text:
  quote: ''
  summary: A lame hunter, unable to keep up with other hunters, asks his torngak for
    help and kills a bear after the bear is made blind, gaining community favor. A
    second account explains a woman-shaped stone near Nachvak as an outcast woman
    who wished to become stone; a crow circles and caws three times while she is transformed,
    and people later make offerings to her.
  language: English
  quote_policy: summarized
