canonical_text:
  quote: ''
  summary: The passage describes Labrador Eskimo beliefs about the inua, the spiritual
    counterpart or thinking spirit inhabiting animals and prominent landscape features;
    it relates this idea to Alaskan masks and animal-to-human transformations. It
    then describes the Tornait as spirits, often malignant and propitiated, sometimes
    controlled by shamans. It names Torngarsoak/Tornarsuq as the great or supreme
    Torngak, discusses a legend of his origin and binding by shamans, and explains
    customs concerning bound dead, a three-day lingering period before departure to
    the spirit world, and a taboo on sharp-edged work during that interval.
  language: English
  quote_policy: summarized
