canonical_text:
  quote: ''
  summary: 'Ethnographic description of Labrador Eskimo large-game hunting: whaling
    from bays and inlets with heavy harpoons, floats, umiaks, and lances; beluga hunting
    and processing; polar bear hunting with dogs, firearms, harpoons, arrows, caves,
    snow-houses, and water tactics; and deer hunting during migration with spears
    in or near water.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eskimo of the east Labrador coast formerly hunted whales from larger bays
    and inlets, including Nachvak and Hopedale, and humpback whales are identified
    as the principal quarry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The name Hopedale is given as Ai'vil-ik, glossed as “whaling place,” and is
    said to suggest former use of the place for whaling.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Whales were struck with a heavier harpoon than the kayak harpoon; the line
    had large floats attached in bunches of three or more to impede and mark the whale's
    flight.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the wounded whale became exhausted and the umiak could approach, it
    was killed with a long-handled lance with a broad blade of bone or flint.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The divings and struggles of a wounded whale could upset the boat and cause
    catastrophe for the crew.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Beluga or white whales were shot, speared, or taken in nets at low tide, and
    provided fat, meat, hides, and export goods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Eskimo women at a northern Moravian station are described in a plate as cutting
    up white whales.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Polar bears were hunted with dogs that formed a ring around the bear and brought
    it to bay while the hunter approached and shot it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When attacked on land, the polar bear is said always to make for the nearest
