  summary: The passage introduces Labrador Eskimo mythology as a body of stories with
    mixed or complicated motives. It lists older Eskimo-stock tales, animal anecdotes,
    stories involving Tornait spirit helpers, accounts of Adlit strangers, Tunnit-related
    traditions, and local stories. It also notes possible Indian influence, uncertainty
    about whether some stories concern Indians or Tunnit, localization of a Moon Man
    story, and the author's view that Tunnit traditions may have historical significance
    in northern Labrador.
