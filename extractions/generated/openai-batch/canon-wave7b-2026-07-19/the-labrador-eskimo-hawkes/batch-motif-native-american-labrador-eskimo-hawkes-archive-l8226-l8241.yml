canonical_text:
  quote: Since you desire me, eat them.
  summary: A young girl is visited at night by an unidentified man. She marks herself
    with soot and oil to identify him, then sees a black streak on her brother's face.
    She cuts off her breasts, presents them to him, and speaks to him. Her angry brother
    chases her; she runs into the sky, he follows, and they become the sun and moon.
    The passage explains the sun's pursuit of the moon and their meeting during an
    eclipse.
