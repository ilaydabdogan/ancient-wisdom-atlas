canonical_text:
  quote: ''
  summary: 'Ethnographic account of Labrador Eskimo childbirth customs: an elder woman
    assists labor with a sealskin thong and manual pressure; a shaman may sing and
    drum to strengthen the mother; the newborn is prompted to cry, sung over, fed,
    and treated; the placenta is buried and protected; infants receive extensive family
    attention; naming customs connect children with recently deceased persons and
    vary among Labrador, East Greenland, and Alaskan Eskimo communities.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman who handles village birth cases goes to the mother's iglu carrying
    a small sealskin thong that is knotted and looped at the end.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prospective mother is made to kneel; the old woman ties the cord tightly
    around her waist, stands behind her, locks her hands in front of her, and applies
    strong downward pressure.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A shaman may assist the birth by singing and drumming to strengthen the mother,
    either from his own home or in the house where the birth occurs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that shamans sometimes try to act as midwives but usually
    fail disastrously, while cases are usually left to old women who are described
    as successful.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: After birth, the old woman picks up the infant, blows into its mouth, and
    shakes it gently until it cries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the infant cries, the old woman begins a song intended to make a boy
    a strong hunter or a girl an industrious and fruitful woman.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The umbilical cord is cut; the ends are tied with sinew and dusted with powdered
    charcoal each day until healed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The infant is put to the mother's breast; if it refuses, seal fat is placed
    in its mouth with a stick positioned to prevent choking, serving as nourishment
    and purgative.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The placenta is wrapped, buried on the beach, and kept from dogs; the author
    connects this care with concern that body parts such as hair and nail parings
    could be used for witchcraft.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Mothers are described as recovering quickly, sometimes going out the same
    day with the infant in their hood.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: In early infancy the child may sleep in a warm reindeer sack, later ride in
    the mother's hood, and eventually receive a suit with sewn-up sleeve ends and
    a moss diaper.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The infant spends time on the iglu floor among children and dogs or is carried
    outside in the hood of an older sister.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: The child is described as the pet of the family, receiving attention from
    visitors and respect from parents, with small requests gratified.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage explains the deference to children as perhaps connected with the
    namesake, at'itsi'ak, by which a child receives the name of the last person who
    died in the village.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Names are not limited by sex, and a newborn may receive several names from
    recently deceased persons before a later decision identifies the correct name.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage reports different naming procedures among East Greenland, modern
    Labrador, and Alaskan Eskimo groups, and states that a sick or old person may
    change name to deceive spirits and prolong life.
  category: sequence
  evidence_refs:
  - ev:9
