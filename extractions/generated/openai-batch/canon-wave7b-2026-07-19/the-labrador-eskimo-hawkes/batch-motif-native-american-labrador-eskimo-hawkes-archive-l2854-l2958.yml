  quote: ''
  summary: 'A technical ethnographic description of Labrador Eskimo sealskin boot
    making: tools, preparation of skin, cutting of boot parts, whitening, stitching,
    waterproof construction, shaping, smoothing, comparison with Alaskan boot bracing,
    and trail expedients.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage lists six instruments used in making sealskin boots, including
    a skin-working stick, woman's knife, cutting board, scraper, boot creaser, and
    boot stretcher.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A selected sealskin is laid on a working stick, cleaned of fat and inner film
    with the woman's knife, turned over, and scraped to remove hair.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: For white boots, damp skin is rolled, left for several days, lashed in a frame,
    and left in cold weather to frost-dry; the cold makes the skin white.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When dry, the skin is laid on a board and cut into soles, leg portions, and
    tongue or instep pieces; sometimes the leg and instep are cut in one piece.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The one-piece leg-and-instep method is described as more common in Ungava
    than on the Labrador coast.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: White boot tops are further scraped until the dark outer membrane is removed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boot is sewn using different seams and stitches, including single stitching
    for winter boots, double seams for waterproof boots, whip stitching, and the gather
    stitch called a-'l'ox.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A folded top strip forms a space for a drawstring.
  category: object
  evidence_refs:
  - ev:5
  - ev:7
- id: obs:9
  text: The Labrador boot lacks Alaskan ankle straps but has several lines of stitching
    at the back of the heel to brace the sides and keep the boot's form.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: After sewing, the boot is shaped with a boot stretcher, hung to dry, and its
    sole-seam gathers are smoothed with a boot creaser.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:8
- id: obs:11
  text: When boots are made hurriedly on the trail, a double overedge-like stitch
    may replace the triple stitch, or a false bottom may be added with a whip stitch.
  category: setting
  evidence_refs:
  - ev:9
