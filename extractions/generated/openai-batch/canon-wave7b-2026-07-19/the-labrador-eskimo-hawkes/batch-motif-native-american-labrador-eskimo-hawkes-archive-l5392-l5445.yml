  summary: The passage describes three Labrador skin-scraper types used on sealskins
    and deerskins, including forms made from reindeer scapula, deer leg bone, narwhal
    jaw, stone, wood, tin, iron, or metal. It emphasizes that bone shapes likely suggested
    useful designs later reproduced in other materials, and it contrasts older finely
    made specimens with rougher modern camp-made examples.
