canonical_text:
  quote: food belongs to everyone
  summary: The passage describes Labrador Eskimo hunting territories as open rather
    than strictly divided. Sea and inland hunting areas are treated as free for general
    use, though game taken by parties is distributed under rules. Seasonal fishing
    stations may be reused by families without becoming exclusive property. The passage
    also gives an anecdote about a Micmac man who tried to impose hunting divisions
    and was expelled.
  language: English
  quote_policy: quoted
