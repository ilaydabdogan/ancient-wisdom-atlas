  text: The Tunnit are described as strong and formidable; one named Jauranat is singled
    out, and huge stone blocks are said to remain as evidence of what they could move.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The quoted tradition says ruins of Tunnit houses occur in the country, chiefly
    on islands, and that one ancestor once had a Tunnit kayaking companion with a
    bird spear tipped with walrus tooth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A woman reported by Courtemanche spoke of a hostile foreign people in northern
