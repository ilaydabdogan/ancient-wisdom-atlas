canonical_text:
  quote: ''
  summary: 'The passage records reports about the Tunnit in Labrador: graves and objects
    near Nachvak, distinctive houses and footwear, a quoted tradition that the Tunnit
    once lived with Inuit ancestors and then fled north to Killinek, descriptions
    of their material culture and strength, a related report of hostile stone-armed
    foreigners, and scholarly discussion of whether the Tunnit were Indians, Norsemen,
    or an older Eskimo group whose stories later became mythological across wider
    Inuit regions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A bank near Nachvak is described as containing about thirty graves with pots,
    harpoons, knives, boat remains, and remains of bows and arrows.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The objects associated with the graves are described as stone pots and knives,
    flint harpoon blades and arrows, whalebone bows, and umiaks larger than present
    boats.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tunnit houses are described as having long stone passages, whale jaw-bone
    entrance posts, shoulder blades on top, stone and turf walls, and whale-rib roofs
    covered with turf.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tunnit are said not to have known how to make waterproof boots; their
    footwear is described as wrapped sealskin with a drawstring sole tied at the ankles.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A quoted tradition says Inuit ancestors and the Tunnit once lived together,
    and that the Tunnit fled north toward Killinek because they feared the people
    who drilled holes in their foreheads while they were alive.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The quoted tradition describes Tunnit bed robes and clothes as sealskins with
    blubber attached, their weapons as slate and hornstone, and their drills as crystal.
  category: object
  evidence_refs:
  - ev:6
