canonical_text:
  quote: ''
  summary: The passage describes Labrador Eskimo angekut as mediators with the spirit
    world who acquire power through apprenticeship, seclusion, fasting, and encounters
    with familiar spirits. It reports initiation ordeals, public séances with drumming
    and possession, oracular responses, expulsion of the Torngak from the house, and
    the wider duties of shamans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The angekut are described as accredited mediators between the Eskimo and the
    surrounding spirit world, combining the offices of priest, prophet, and physician
    after long apprenticeship.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who feels called to become an angekok may retire to a lonely place,
    live as a hermit, pray, and fast until a familiar spirit appears.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Torngarsoak is said to appear as a great white bear and devour the aspirant
    limb by limb; other Tornait appear in other terrible forms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Angukvaluk reported calling on a parental Torngak from the water, observing
    vapor, then seeing a man in a watery habit and reacting with fear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the ordeal, the apprentice receives some power and a promise of future
    assistance from the familiar spirit, then returns to the village and recounts
    the experience.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At a public séance, the angekok sings, shouts, beats a drum, enters a frenzy,
    and the familiar spirit’s appearance and possession are marked by cries, intensified
    drumming, and changed demeanor and speech.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Seguilak’s performance is described as involving ecstasy, singing, unintelligible
    muttering, strange gestures, foaming, convulsive movements, shrieks, and the statement
    that his Torngak had come.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: During such performances, the Eskimo present are described as lying flat on
    their faces as if dead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: While the angekok is possessed, people ask questions; Millak is described
    as invoking the Torngak, reporting answers, and invoking again if replies are
    unfavorable.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says an angekok may use connection with the Torngak to confound
    enemies in responses, but generally does not use the power for harm.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The finale of the Labrador shaman’s performance includes driving the Torngak
    out of the house with noise, a stick, stamping, and frightful sounds.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The work of an angekok includes treating the sick, officiating at ceremonies,
    determining the presence of game, foretelling or changing weather, making amulets,
    and instructing novices.
  category: action
  evidence_refs:
  - ev:11
