canonical_text:
  quote: ''
  summary: The passage describes Labrador Eskimo wood carving as paralleling ivory
    work, with wood used as a more plentiful substitute for scarce walrus ivory. It
    then describes cloth and fur decoration, including light and dark fur inserts,
    square and diamond appliqué, bead and embroidery designs, wavy-line decoration,
    diamond designs also seen in tattooing, and a simple cross design said among East
    Greenlanders to indicate flying birds.
  language: English
