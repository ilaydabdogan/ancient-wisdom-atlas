  summary: The passage describes Caubvick's refusal to cut her hair after illness,
    deaths from smallpox among her family and a boy taken by Cartwright to England,
    Cartwright's later activity at Sandwich Bay, the survival of old hunting superstitions
    among local people, and a seal-hunting custom in which pieces of the heart and
    liver are returned to the water for luck and, according to the footnote, for the
    seal's rebirth and return to hunters.
