canonical_text:
  quote: ''
  summary: The passage describes Labrador Eskimo religious ideas concerning Supergu'ksoak,
    a female deity or old woman associated with inland land animals and reindeer,
    and Tornga'rsoak, a male deity associated with water, sea animals, animal spirits,
    and shamanic initiation. It also records variant accounts involving a cavern,
    Spirit mountains, a huge white bear form, souls hunting reindeer after death,
    doll-mediated reindeer divination, and a sea-bottom old woman who controls sea
    animals and receives offerings.
  language: English
  quote_policy: summarized
