  summary: The passage explains that Labrador Eskimo designations are presented as
    locality or directional names rather than strict tribal names. It describes the
    suffix -miut as indicating people of a place, contrasts Labrador usage with Alaskan
    Eskimo tribal divisions, lists major directional/place divisions, and records
    lesser place-names obtained from two informants.
  language: English
