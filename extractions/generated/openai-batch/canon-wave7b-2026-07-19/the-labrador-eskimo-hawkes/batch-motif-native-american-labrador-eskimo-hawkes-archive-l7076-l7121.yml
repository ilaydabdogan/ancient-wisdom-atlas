canonical_text:
  quote: ''
  summary: 'The passage describes Labrador and Alaskan Eskimo divining practices:
    Toma''suk summons spirits of the dead by blindfolding a questioner and rapping
    three times with a stick; an Alaskan shaman summons a dead grandfather while wearing
    a raincoat associated with Ka''cak and sends the spirit back by stamping; Mission
    Eskimo healers are reported to rub pain away; and an older bow-string divination
    uses movement of a string as an affirmative answer.'
  language: English
  quote_policy: summarized
