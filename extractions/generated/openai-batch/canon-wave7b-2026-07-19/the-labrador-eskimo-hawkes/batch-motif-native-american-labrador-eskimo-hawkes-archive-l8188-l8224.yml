canonical_text:
  quote: ''
  summary: A Crow and a Gull fight as representatives of the Eskimo and the white
    man; the Gull wins, accounting for the white men's greater number and strength.
    In a second tale, a girl chooses a whale bone as husband; it becomes alive, marries
    her, takes her to the sea, restrains her, pursues her escape by umiak, is delayed
    by garments thrown into the water, strands near shore, is killed by her kin, and
    returns to bone.
  language: English
