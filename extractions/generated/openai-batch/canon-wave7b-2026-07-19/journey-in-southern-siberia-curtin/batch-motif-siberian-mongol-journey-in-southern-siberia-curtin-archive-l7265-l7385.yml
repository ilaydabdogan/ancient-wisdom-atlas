canonical_text:
  quote: ''
  summary: Gesir rides toward Gal Tulan Tengeri's kingdom, reaches a perilous mountain
    with his speaking steed, survives a dangerous leap, finds the Water of Life and
    Youth beneath a golden-trunked, silver-leafed aspen, and is restored with his
    horse. He transforms his horse into flint and himself into an eagle, flies to
    Gal Tulan's sky-hung yurta, prays and circumambulates until its doors open, sees
    a vast tree bearing written wisdom and religions, and asserts a recorded marriage
    agreement between divine fathers. Gal verifies the agreement in a book and agrees
    to give his daughter if she consents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gesir travels to Gal Tulan Tengeri's kingdom and stops at a bronze and silver
    square with a dark spring where no horse had drunk.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the square, Gesir waters his steed, names the thousand Heavenly Burkans,
    makes fire with a flint, and smokes from a silver pipe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gesir and his horse travel northeast to the mountain called Tiphĭn tlndir
    Hada.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The steed says it can reach the summit by running back one day's journey and
    springing upward, but failure would kill both horse and rider.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the mountain foot, Gesir sees large piles of human and horse bones and
    measures huge thigh bones against himself and his steed.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gesir and the steed weep for three days and nights before attempting the leap.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The horse leaps, catches the summit edge with hoofs and teeth, and Gesir jumps
    onto the summit before pulling the horse up by the bridle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the summit, Gesir and the horse find a spring containing the Water of Life
    and Youth at the foot of a golden-trunked, silver-leafed aspen tree with a hanging
    cup.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Gesir and his stallion eat silver leaves from the aspen and drink the water;
    later both are visibly improved.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Gesir kills a stag and hind, roasts them on large trees, sleeps three days
    and nights, and then eats the two deer, including bones.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: Gesir turns his steed into a flint, places it in his pocket, changes himself
    into Khan Herdik Shubun, an eagle, and flies to Gal Tulan Tengeri's kingdom.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Gal Tulan's yurta hangs between the cloudy sky and the first heaven and initially
    has no doors.
  category: setting
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:13
  text: Gesir prays while going around the yurta on the sun's road for three days
    and nights; afterward, the doors open on the west.
  category: action
  evidence_refs:
  - ev:10
  - ev:12
- id: obs:14
  text: A huge tree stands before Gal Tulan's yurta; heavenly birds sing on it, and
    all written wisdom and the religions of all peoples hang on its branches.
  category: object
  evidence_refs:
  - ev:11
- id: obs:15
  text: Gal Tulan gives orders to bring milk to Gesir, then questions his origin and
    identity.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: Gesir states that he was created by the thousand Heavenly Burkans, is the
    youngest son of Khan Tyurmas, and has come because their fathers made a marriage
    agreement through an exchange of wine and a bullock leg joint.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:17
  text: Gal Tulan reads Gesir's book for three days, finds the agreement recorded,
