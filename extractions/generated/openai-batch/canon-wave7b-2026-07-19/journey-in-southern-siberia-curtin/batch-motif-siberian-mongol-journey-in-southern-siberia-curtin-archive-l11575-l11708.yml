canonical_text:
  quote: ''
  summary: An elderly childless khan, Yerente, discovers that a seventy-seven-headed
    Mangathai has stolen his horses. He prepares with special clothing, arrows, spider
    oil, and a long-horned red bull, recovers the herd, defeats the Mangathai with
    the bull's help, returns home, and soon afterward his wife gives birth to a son
    and daughter. The children are named in a public feast with reciprocal gifts and
    grow with extraordinary speed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yerente is ninety-five years old, his wife Untun Duryai is sixty, and they
    live in an immense stone yurta without son or daughter.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yerente counts his herds after fourteen years and finds one light bay stallion
    and eighty-five mares missing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yerente identifies a seventy-seven-headed Mangathai at Dalantai as the thief
    who stole his horses.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Untun Duryai asks Yerente not to leave at once, but he says he must go before
    he becomes too old to travel.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Yerente dresses in bull-skin trousers, fish-skin boots, a silver belt, silk
    shuba, and sable-skin cap, and takes a quiver with ninety-five arrows.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Yerente drinks spider oil, after which he needs no food for ten years.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Yerente brings a red bull with sixty-fathom horns out of an iron storehouse
    and rides westward on its back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At a mountain beyond his boundary, Yerente finds the mares and the injured
    light bay stallion, cures the stallion, and sends the herd home.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Yerente continues on the red bull to find the Mangathai and take vengeance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Two young mounted men carrying iron staffs mock Yerente when he says he can
    tell them where their lost herd is.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Yerente ties each mocking young man to the tail of his own horse and sends
    the horses rushing homeward over the sandy steppe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: From the top of Onhoy Undir Ushin, Yerente sees a shining yurta on the horizon
    and Mangathai's black stallion with a white spot.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Mangathai's stallion calls to its master, warning that someone is on the mountain
    and that an enemy may be coming.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Mangathai says he took Yerente's horses because Yerente was old and threatens
    to tear him into pieces.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Yerente and the Mangathai fight by tearing flesh from each other with their
    fingers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The black stallion attacks the red bull, and the red bull kills the stallion
    and then kills the Mangathai with its horns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Yerente removes the dead horse's head from the bull's back after it has remained
    bitten there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Yerente refuses to take the Mangathai's property and rides home on the red
    bull.
  category: action
  evidence_refs:
  - ev:8
- id: obs:19
  text: Two days after Yerente returns, Untun Duryai gives birth to a son and a daughter.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:20
  text: Yerente gathers people, feasts them, places the infants in a cradle, and asks
    men to name them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:21
  text: A gray-haired old man from the North names the boy Sokto Khan, and a gray-haired
    old man from the South names the girl Agiii.
  category: action
  evidence_refs:
  - ev:9
- id: obs:22
  text: The name-givers, midwives, receiving women, and children receive gifts, including
    clothing, marrow bones, meat, a cane, a magic stick, and rings.
  category: object
  evidence_refs:
  - ev:9
- id: obs:23
  text: After ten days the children appear as if ten years old, and a ram's skin is
    too small for the boy's coat.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:24
  text: Untun Duryai asks Yerente to get wild-goat flesh because she is tired of common
    meat.
  category: speech
  evidence_refs:
  - ev:10
