canonical_text:
  quote: ''
  summary: The passage is an editorial note on the value, definition, and comparative
    study of folklore. It states that Buriat myth collection is small and incomplete,
    discusses the term “folk-lore,” surveys several European and Asian folklore traditions,
    and concludes by identifying the first five Mongol/Buriat myths as sacred true
    accounts of Creation, the destruction of harmful creatures, and preparation of
    the world. It names Esege Malan as Creator, Gesir Bogdo as his grandson who leaves
    heaven and is born of woman to destroy harmful creatures, the Iron Hero as a helper
    created to aid Gesir Bogdo, and Mindiu as appearing after the purified earth is
    inhabited by man.
  language: English
