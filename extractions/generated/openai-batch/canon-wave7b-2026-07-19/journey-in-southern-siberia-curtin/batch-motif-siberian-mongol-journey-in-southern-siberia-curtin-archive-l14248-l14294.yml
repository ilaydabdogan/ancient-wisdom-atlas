canonical_text:
  quote: ''
  summary: The notes describe a Mongol/Buriat rule connecting cremation of the dead
    with the cuckoo’s seasonal song, report that Mindiu Qubun taught when and how
    to burn the dead, and summarize mythic appearances of the cuckoo as a reviver
    of the dead. The passage also describes Solobung Yubun, the morning star, as a
    benevolent son of the creator who grants increase of crops and cattle when propitiated
    at dawn, and it records comparisons with Modoc, Delaware, and Yana morning-star
    traditions.
  language: English
  quote_policy: summarized
