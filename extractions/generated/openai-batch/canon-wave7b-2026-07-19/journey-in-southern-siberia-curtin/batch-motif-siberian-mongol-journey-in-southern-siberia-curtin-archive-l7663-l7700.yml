canonical_text:
  quote: ''
  summary: Gesir confronts Apha for allowing the Mangathai to torment him and threatens
    to make her work and be milked. Apha resists and wrestles or fights with him for
    extended periods. Gesir calls on the Iron Hero for aid; the Iron Hero claims Apha
    was brought by deceit and should be his wife. Apha rejects being passed from one
    wife-status to another, attacks him, and invokes Gal Tulan and Dul Tulan Tengeri.
    Ashir Bogdo joins, and the three subdue Apha, seal her in a barrel with ninety-nine
    iron hoops, and roll it into the Lateral Sea. Sangha Gohun then reminds Gesir
    that she bore him a son and sent him to the sky, without whom the Mangathai would
    still torment him. The Iron Hero states he is old enough to seek a bride, and
    Gesir permits him to go.
  language: English
  quote_policy: summarized
