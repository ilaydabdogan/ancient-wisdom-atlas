canonical_text:
  quote: ''
  summary: The passage describes a Buriat horse sacrifice at a hill with stone altars.
    Families gather at designated places marked with birch branches; milk and tarasun
    are offered to Burkans. A horse is purified between fires, sprinkled with milk,
    placed near a birch tree, and dedicated through prayers to named deities. The
    horse is restrained with ropes, killed by an incision and removal of the heart,
    and afterward the body is skinned, quartered, and its bones placed on burning
    stone altars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Offerings sent to the Burkans are said to increase greatly when they reach
    the home of the deities at the mountain and hill, where invisible dwellings are
    located.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men sent ahead prepare places for kettles, hang them over wood, and arrange
    vessels and other ceremonial items at the Hill of Sacrifice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each family has a place on the hill near one of fifteen stone altars, with
    small birch branches placed in the earth at those places.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Libations of milk, and later tarasun, are cast into the air to the Burkans
    near the birch branches.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the crowd assembles, fires are lit, and the horse is purified by being
    led between either three, nine, or twenty-seven fires.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Officiants sprinkle milk on the horse's face and hair halter, cast milk into
    the air to the gods, make a tarasun libation, and offer a prayer or petition to
    all the Burkans.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The horse is led to the right side of a small birch tree whose lower trunk
    rests on the ground and whose upper part rests on a crosspiece; the tree is called
    the foot of the place of sacrifice.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The officiating men turn with knee bending to named deities or deity groups
    and sprinkle offerings as each is named.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The deities named include the ninety western Burkans, four eastern Tuget,
    lofty clear heaven, revered pure earth, bull prince father, blessed mother mist,
    a creating great one identified as the hedgehog, creator pure heaven, Grandfather
    Bald Head, a creator of cattle, the golden Sorrel or dawn, and a goddess of the
    night heavens who creates people.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The divinities are addressed by name and in sequence; the people follow the
    officiants aloud or mentally, and each man usually prays for what he most desires.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Long ropes are tied around the horse's fetlocks; sixteen men pull the forelegs
    and hindlegs apart so that the horse falls and is held helpless.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A man with a bare right arm cuts behind the breastbone with a long sharp knife,
    reaches into the opening, seizes the horse's heart, and wrenches it free.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The first horse dies quickly after the heart is removed; the second horse
    is described as dying after a more prolonged and distressing struggle.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: After the horses die, men skin the bodies, quarter them, remove flesh from
    the bones, and place the bones on fifteen stone altars where fires are burning
    strongly.
  category: action
  evidence_refs:
  - ev:9
