canonical_text:
  quote: ''
  summary: A Mangathai beats and imprisons Sokto, then trades him to an unnamed khan
    for tarasun. The khan and his wife adopt Sokto, and Sokto reveals that his sister
    Agiii was left in a shelter. A search party finds Agiii surviving on dew and brings
    her home; the siblings grow during a nine-day feast. Sokto later dons his adoptive
    father's clothing and weapons, leaves to visit his birthplace, prays to the thousand
    Burkans, and receives a giant steed with arms and dress. He returns to the hundred-and-eight-headed
    Mangathai, binds him to a pine, kills the Mangathai's wife with an arrow, and
    destroys her prematurely born child after cutting a sky tube that had been cooling
    the child with water in a furnace. Sokto then returns toward his mother's house,
    where Uutun Duryai recognizes his voice and goes out with the seventy-five-headed
    Mangathai.
  language: English
  quote_policy: summarized
