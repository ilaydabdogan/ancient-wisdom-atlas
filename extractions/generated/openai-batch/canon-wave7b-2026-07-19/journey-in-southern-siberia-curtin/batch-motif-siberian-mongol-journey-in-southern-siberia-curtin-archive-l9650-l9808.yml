canonical_text:
  quote: gray steed with round head
  summary: The passage opens near the northern Altai after the world, earth, and water
    have become established. A wealthy, deathless khan loses his extraordinary gray
    steed. His wife Deri Sisin directs him to a birth-given book hidden under his
    midriff, which reveals the thief, the great distance to the thief's kingdom, and
    that Hunkuvai can retrieve the horse. Hunkuvai is summoned only after his wife
    Shik Shuri Nogon beats back several messengers and a stronger champion explains
    the summons. Hunkuvai accepts the khan's commission, asks for proper weapons,
    a steed, and prayers to the Burkans, and returns home stronger and resolved.
  language: English
  quote_policy: quoted
