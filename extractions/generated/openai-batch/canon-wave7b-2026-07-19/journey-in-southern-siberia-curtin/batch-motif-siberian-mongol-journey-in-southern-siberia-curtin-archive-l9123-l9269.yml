canonical_text:
  quote: ''
  summary: 'Altun returns from an underground episode, uses a dudki to transform several
    men into animals, takes their possessions, sends their sisters to his home, returns
    to his aged parents, and marries the three sisters with a nine-day feast. A new
    tale begins: Buruldai Bogdo Khan and his wife, long childless, have twin boys
    behind seventy-three curtains. The parents are stolen away in the night. The boys
    rapidly assume childhood ages, turn into squirrels, evade searchers, and later
    encounter an immense yurta where the younger brother is captured by a many-headed
    Mangathai. A merchant intoxicates the Mangathai with wine, rescues the boy, and
    adopts him. The rescued boy searches for his brother, turns into a squirrel, and
    meets the elder brother, who does not recognize him and goes to Esege Malan.'
  language: English
  quote_policy: summarized
