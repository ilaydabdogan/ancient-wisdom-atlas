canonical_text:
  quote: ''
  summary: A female figure obtains her feathers from her husband after he has drunk
    tarasun, turns into a swan, and flies out through a smoke-hole. Her daughter tries
    to stop her and blackens the swan’s legs, which explains the black legs of swans.
    The mother returns near enough to speak and instructs her daughter to make new-moon
    offerings of mare’s milk, tea, and red tobacco. The passage states that all Trans-Baikal
    Buriats came from this swan.
