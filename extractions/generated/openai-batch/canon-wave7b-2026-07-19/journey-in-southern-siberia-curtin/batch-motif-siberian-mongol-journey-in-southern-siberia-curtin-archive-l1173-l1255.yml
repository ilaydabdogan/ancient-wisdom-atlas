  quote: ''
  summary: Historical account of seventeenth-century Russian envoys, Cossack expeditions,
    tribute efforts, conflict with Buriats, fort founding, diplomatic contacts with
    Mongol rulers, the first tea brought to Russia, and Dejneff's northern sea voyage
    and survival after storm and shipwreck.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yakov Hripunoff sent Kozloff, a Cossack envoy, to invite unnamed visitors
    at the river Kan to become Russian subjects; the outcome is stated as unknown.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In 1627, expeditions under Bugor and Perfilyeff were sent respectively to
    explore the Lena River and to force Buriats to pay tribute; Perfilyeff was unsuccessful
    because the Buriats would not surrender their independence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Piotr Beketoff was sent against the Buriats on the Angara in 1628, later crossed
    toward the Lena, sailed down it, and built a fort called Yakutsk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yakutsk was later moved upriver and in 1638 became the administrative center
    of northeastern Siberia.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Vassili Starkoff was sent to the Altyn Khan at Lake Ubsa, and the khan included
    tea among presents to Michael Romanoff.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Starkoff initially refused the tea as useless and hard to carry, but accepted
    it after the khan insisted.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage says the tea taken to Moscow against the envoy's wishes soon became
    a Russian national drink.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kurbat Ivanoff and other Russians appeared on the western shore of Lake Baikal
    and Olkhon Island in 1643; in 1646 Buriats besieged Verholensk and were later
    defeated, with villages ravaged.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Ivan Pohalioff crossed Lake Baikal and, through the friendship of Turukai,
    reached Urga, after which Setsen Khan sent an embassy to Moscow the following
    year.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Barguzin was founded near eastern Lake Baikal in 1648 as a place to receive
    tribute from Buriats.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: A 1648 northern expedition with seven boats sailed eastward from the Kolyma;
    four vessels disappeared, Ankudinoff's vessel was wrecked, and a storm later separated
    the remaining vessels.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: Dejneff was carried south of the Anadyr River, is credited in the passage
    with showing a passage between the Arctic Ocean and the Pacific, built a winter
    shelter with companions, and was rescued by traders.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Aleksaiyeff and Ankudinoff are said to have perished in Kamchatka, while Dejneff's
    final fate is unknown.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: In 1650 there were conflicts between Russians and Buriats, and Yerofei Habaroff
    set out from Yakutsk, reached the Amoor, explored it, and launched a flotilla
    there.
  category: sequence
  evidence_refs:
  - ev:9
