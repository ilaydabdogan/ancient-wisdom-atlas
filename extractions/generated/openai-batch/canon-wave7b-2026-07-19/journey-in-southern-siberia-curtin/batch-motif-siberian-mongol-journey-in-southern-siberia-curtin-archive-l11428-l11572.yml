canonical_text:
  quote: ''
  summary: Altin warns three sisters, ambushes and kills the poisonous one-eyed Mogoi
    Khan as he emerges from the sea, then seeks the yellow dog for Gal Niirman/Gal
    Nurman Khan. He ascends golden stairs from a mountain to heavenly smiths, compels
    them to make restraints, climbs the dog’s mountain, transforms into a raven, and
    binds the yellow dog with aid invoked from the Burkans. He brings the dog to Gal
    Nurman, exposes the khan’s fear, secures a wedding for the next day, sends the
    dog home, and marries his bride, who already knows about events he omitted.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Altin tells the people at the pine tree to leave and save themselves, but
    they do not move.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Altin leaves his horse near the pine tree, goes on foot toward the sea with
    bow and arrow, and becomes a reed near the place where Mogoi is to emerge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Mogoi Khan comes from the roaring sea; Altin aims at Mogoi’s one eye and addresses
    the arrow before shooting.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The arrow enters Mogoi Khan’s eye, tears his head into pieces, and does not
    return because it is bloody.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After Mogoi’s defeat, Altin loses all his hair, and grass withers for a mile
    around because Mogoi is poisonous.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Altin tells the sisters that he has conquered their enemy but that he came
    to get the yellow dog for Gal Niirman Khan, not specifically to save them.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The eldest sister says she would be Altin’s wife, but since he is wooing another
    khan’s daughter she will instead be his son’s wife; she also says their father
    cannot help him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Altin rides to a mountain from which golden stairs reach the sky and ascends
    on his steed to the heavenly smiths for hoofs, chains, and fetters.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The heavenly smiths initially refuse because they work for Esege Malan; Altin
    curses them, then restores them after they agree to make what he wants.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The smiths make the requested hoops, chains, and fetters, and Altin descends
    the golden stairs on horseback.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Altin climbs the yellow dog’s mountain for five days and nights, puts his
    horse in his pocket as a flint chip, becomes a raven, and finds the dog sleeping.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Altin chants for the chains and fetters to fasten to the dog while asking
    aid of the Burkans; the restraints immediately bind the dog.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The yellow dog recognizes that only Altin could have bound him and asks to
    be freed, to go with him, and to be friends.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: On the return journey, two men tell Altin to release the dog, claiming it
    is Gal Nurman’s command; Altin orders the yellow dog to eat the two men and their
    horses.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: Gal Nurman sees the yellow dog, faints from fear, and then asks Altin to get
    rid of it because it may eat his people.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Altin says the wedding must be held the next day, feeds the dog half an ox,
    and sends it back to its mountain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Altin tells his bride about the golden stairs, heavenly smiths, restraints,
    and yellow dog; she points out that he said nothing about the three sisters and
    knows what happened with the arrow.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:18
  text: The wedding is held the next day with many people, meat, and drink, and Altin
    and his bride are at his own yurta on the fifth day.
  category: sequence
  evidence_refs:
  - ev:12
