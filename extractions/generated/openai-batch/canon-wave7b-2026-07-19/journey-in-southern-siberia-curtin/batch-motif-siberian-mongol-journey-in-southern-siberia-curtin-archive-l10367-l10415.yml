canonical_text:
  quote: ''
  summary: Khan Herdik promises future aid and vanishes. The brothers cure and rejuvenate
    Shik Shuri with bark and the Water of Life. After questioning her about their
    father, they read a book that tells of his killing by their uncle. They travel
    to the Shaman mountain, find the father's bones, recover a missing toe through
    a chain of animals, reassemble the skeleton, and restore Hunkuvai to life with
    the Water of Life and powdered bark from a red restoring larch tree. The family
    returns home and feasts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Khan Herdik thanks the brothers, promises to fly to them if war or peril threatens,
    and vanishes in the clouds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two brothers put bark in Shik Shuri's mouth and pour in the Water of Life;
    she is cured, grows young, and regains hand, foot, and eye.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shik Shuri recognizes her two sons after coming to her senses and brings them
    into the yurta.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brothers ask whether they had a father, and Shik Shuri says he was beaten
    in battle and killed when they were infants.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brothers suspect Shik Shuri is hiding something and say they will find
    their father's ashes and bones wherever they are.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Shik Shuri gives her sons their father's book, which describes his search
    for the gray steed with round head and says that their uncle killed him.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brothers saddle their two stallions, ride to Huhai Hubshi Barsam, the
    Shaman mountain, and find moss-grown bones of their father.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Huragin and Isbegin gather the bones and find that all are present except
    the great toe of the right foot.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The missing toe is traced from fox to wolf, from wolf to black bear, from
    black bear to tiger, and from tiger to lion.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The brothers kill Irbit the lion, find the father's great toe in his stomach,
    return, and attach the toe to the foot properly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The brothers sprinkle the skeleton with healing Water of Life mixed with powdered
    bark from the red restoring larch tree three times.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the first sprinkling flesh comes onto the bones; after the second Hunkuvai
    is like a sleeping man; after the third he is living and well.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Huragin and Isbegin return home with their father, and all feast for many
    days.
  category: sequence
  evidence_refs:
  - ev:7
