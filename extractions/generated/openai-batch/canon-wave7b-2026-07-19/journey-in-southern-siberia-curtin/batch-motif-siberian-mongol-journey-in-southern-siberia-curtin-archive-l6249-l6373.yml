- id: motif:2
  label: deceptive transformation of conveyances to drown opponents
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Gesir uses trees that become horses and bark that becomes boats; each conveyance
    reverts at the sea's navel and drowns the Shalmos.
