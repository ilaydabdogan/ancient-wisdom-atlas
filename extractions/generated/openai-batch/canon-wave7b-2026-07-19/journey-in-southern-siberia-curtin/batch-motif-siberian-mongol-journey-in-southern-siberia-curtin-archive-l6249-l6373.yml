canonical_text:
  quote: ''
  summary: Gesir uses magical transformations and disguises to destroy groups of Shalmos
    at the Yellow Sea, then disguises himself as an old man and traps the Mangathais
    in an ironized yurta that sinks into the earth. The passage then begins another
    tale in which two sky-dwellers dispute mastery of the cold ice sky; one fails
    to appear for the agreed battle after visiting his grandmother and becoming drunk,
    so the other takes possession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old man brings nine birch trees and places them against a hitching-post,
    where they become nine blue horses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nine Shalmos arrive on nine similar horses and ask whether there are horses
    to run against theirs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy says he is young and just born, says he does not yet know how to ride,
    and tells the Shalmos to mount his horses and try them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The nine Shalmos ride the transformed horses to the Yellow Sea; at the navel
    of the sea the horses turn back into trees, sink, and the Shalmos drown.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When three years old, Gesir Bogdo is full grown; he changes his black stallion
    and heroic outfit into a flint, pockets it, and goes away on foot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At a meeting of three roads, Gesir becomes a small deformed boy with one arm
    and hand out of his back, one leg drawn up, and sunken eyes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ninety-nine Shalmos on ninety-nine blue horses pass the deformed child; by
    magic he goes around them and reaches the Yellow Sea before them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Using his flint and tamarack bark, Gesir makes ninety-nine little boats, commands
    them to become large and strong, makes a shed, and turns himself into an old man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ninety-nine Shalmos say they are going to the Northwest Tengerin and cannot
    cross the sea on horseback; they trade their horses for the boats.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Gesir commands the boats to turn into tamarack bark chips at the navel of
    the sea; the boats move by themselves, reach that point, change, and the ninety-nine
    Shalmos drown.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Gesir returns to the old man's yurta, takes his black stallion and armor,
    and goes northwest to where three hundred and sixty Mangathais live.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Danjin Shara Mangathai is described as the greatest of the Mangathais and
    as having seventy-three heads.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Gesir turns his horse and armor into a flint again, pockets it, becomes a
    weak old man, and goes to the Mangathais' yurta.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The chief Mangathai says a dinner has come of itself; Gesir replies that he
    is an old man who paints and asks for work.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: While appearing to paint, Gesir makes the yurta iron inside and outside and
    speaks formulas about the Black Colt people increasing and the Mangathais perishing.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:16
  text: At the smoke hole, Gesir calls for thirteen enchantments and twenty-three
    iron hoops to surround the yurta.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: The Mangathais cannot escape from the iron house, and the yurta sinks until
    the smoke hole is level with the ground.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: When the chief Mangathai puts one head through the opening, Gesir crushes
    it with a seventy-pood hammer sent by his grandfather, Esege Malan.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: Gesir asks the Burkans for an iron hero to watch the yurta and crush any Mangathai
    trying to escape.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: The Mangathais are said to perish and are described as evil creatures from
    a preceding world.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:21
  text: Khan Tyurmas Tengeri and Atai Ulan Tengeri dispute which of them should be
    master of Segel Sebdik Tenger, the cold ice sky.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:22
  text: The two sky-dwellers agree to meet in three days with their forces and decide
    the question by battle.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:23
  text: Khan Tyurmas is absent from the appointed place because he has gone to his
    grandmother in the West to ask advice, has become drunk on tarasun, and has forgotten
    the contest.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:24
  text: After waiting three days, Atai Ulan takes possession of Segel Sebdik and turns
    homeward.
  category: action
  evidence_refs:
  - ev:12
