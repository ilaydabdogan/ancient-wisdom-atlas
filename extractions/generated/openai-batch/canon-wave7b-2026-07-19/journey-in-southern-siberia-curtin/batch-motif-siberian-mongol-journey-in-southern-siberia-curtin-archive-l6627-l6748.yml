canonical_text:
  quote: ''
  summary: The passage recounts Sangha Gohun's inability to leave a boy she regards
    as her husband in another form; her awakening in a splendid white stone yurta;
    her tracking the boy by silk string up a rainbow to Esege Malan; the removal of
    the rainbow from heaven; a Mangathai released from beneath an uprooted aspen;
    Gesir Bogdo's defeat of the Mangathai; and the beginning of a war expedition against
    Gal Nurman Khan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sangha Gohun repeatedly tries but cannot get away and lies down beside the
    boy, concluding that he is her husband in another form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She kneels before the boy and begs him for two days to return to his own or
    real form.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the ninth morning she wakes in a white stone yurta three stories high,
    lying on a golden couch, with plenty and splendor around her; the boy is still
    present and outwardly unchanged.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Outside the splendid yurta are thirty-three strong champions, three thousand
    warriors, and many other people.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sangha Gohun secretly ties a silk string around the boy's ankle; at midnight
    he is gone, the string reaches to the ceiling, and she sees a rainbow from the
    roof to the sky and follows him on it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The boy has gone to Esege Malan to ask for more power and riches, and Esege
    Malan angrily asks who is following him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy pushes Sangha Gohun down the rainbow; Esege Malan pulls the rainbow
    in and places it on earth, after which the passage says there has been no rainbow
    in heaven.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy beats his bride for three days and nights and says her following prevented
    him from receiving what he wanted from Esege Malan.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The thirty-three champions lead cattle and horses to water, uproot an aspen
    tree at the seashore, and a ten-headed Mangathai emerges from the hole threatening
    to eat them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The champions describe their master's ninety-nine arrows and great yellow
    bow to the Mangathai; the Mangathai offers them service like Burkans if they destroy
    those weapons.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The champions attempt to damage the weapons, fail, and falsely tell the Mangathai
    that the weapons have been destroyed.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Mangathai attacks Gesir Bogdo; Gesir says his weapons cannot be injured,
    commands an arrow to cut off the Mangathai's arm and heads, and burns and scatters
    the body after the arrow obeys.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: The champions pressure Gesir Bogdo to join a war against Gal Nurman Khan;
    after they threaten to hang themselves, he agrees, arms the force, and rides out
    with them.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: The champions fear Gal Nurman Khan and climb a high mountain to watch; Gal
    Nurman sees them, drinks tarasun, mounts a golden bay steed, rides alone toward
    Gesir Bogdo, and challenges him to single combat.
  category: sequence
  evidence_refs:
  - ev:13
