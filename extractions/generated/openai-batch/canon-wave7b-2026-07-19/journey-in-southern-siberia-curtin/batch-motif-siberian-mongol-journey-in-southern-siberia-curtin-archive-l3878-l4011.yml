canonical_text:
  quote: ''
  summary: The narrator describes Baiandai as a group of Buriat villages with a Russian
    settlement of exiles and ex-convicts, stays there while seeking Mongol folklore
    informants, finds only fragmentary material, observes the arrival and departure
    of soldiers disputing over moldy bread, and then visits the wealthy Buriat Arkokoff,
    whose household uses stored snow water from a deep reservoir for the samovar.
  language: English
  quote_policy: summarized
