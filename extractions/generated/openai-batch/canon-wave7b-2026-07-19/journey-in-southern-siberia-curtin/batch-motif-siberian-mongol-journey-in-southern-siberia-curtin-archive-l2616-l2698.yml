canonical_text:
  quote: ''
  summary: The passage describes Buriats feasting on a divine hill understood as the
    roof of a divine house, offering horse flesh, soup, and tarasun to Burkans or
    gods. The offerings are said to be multiplied when received by the gods, while
    the worshipers pray for benefits and continue their own feast. The passage then
    gives ethnographic commentary on the nearness and friendliness of gods and men
    in this ritual setting, the stability of religious forms in pastoral society,
    and a contrast between western Buriats retaining Shamanism and eastern Buriats
    becoming Buddhists.
  language: English
