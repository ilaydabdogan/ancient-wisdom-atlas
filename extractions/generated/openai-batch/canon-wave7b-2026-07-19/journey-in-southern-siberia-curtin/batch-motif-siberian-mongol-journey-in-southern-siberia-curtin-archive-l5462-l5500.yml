canonical_text:
  quote: ''
  summary: A Shaman interrupts the burial of a dead child, orders a goat to be killed
    and buried in the grave instead, and performs two nights of ritual action involving
    red-hot stones, dancing, shamaning, cockcrow, and blowing on the child. The child
    revives and speaks. The father offers wealth, but the Shaman accepts only hay,
    a hide rope, and nine copecks. The passage closes by saying this resurrection
    was the Shaman's last great act before his death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men tell the Shaman that the child is dead and begin covering the lowered
    body with earth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Shaman commands that the earth be removed, that the child be given to
    him, and that a goat be killed and buried in the grave.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Shaman carries the child home, heats six stones red hot, removes his leggings,
    dances barefoot on the stones, and shamanizes until morning while stepping over
    the dead child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At the first cockcrow after the first night, the child's blood begins to move
    and the child opens his eyes but cannot speak.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the next night the Shaman has the boy's father and mother tied to a post
    in the yurta and again dances and shamanizes until the first cockcrow while the
    child lies unmoving.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At sunrise the Shaman blows on the child's head and feet, after which the
