candidate_motifs:
- id: motif:1
  label: primordial disorder overcome by heavenly intervention
  taxonomy_refs:
  - chaos
  basis: The passage opens with confusion, disorder, and vile creatures below, followed
    by a sky council and a proposed heavenly solution.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage frames disorder morally and cosmologically but does not give
    a detailed cosmogony.
- id: motif:2
  label: heavenly hero descends to destroy evil
  taxonomy_refs:
  - hero_descent
  - culture_hero
  - divine_judgment
  basis: Gesir Bogdo is prepared or sent from heaven to earth to destroy evil creatures,
    evil spirits, bad people, Shalmo Khan, and hostile beings.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:13
  confidence: high
  cautions: The text contains two variants with different heavenly senders and some
    differing names.
- id: motif:3
  label: divine parent or grandparent commissions the hero
  taxonomy_refs:
  - divine_parent_child
  basis: Esege Malan gives Gesir equipment and aid in the first version, while Delquen
    Sagan sends his grandson Gesir Bogdo to earth in the second version.
  evidence_refs:
  - ev:3
  - ev:13
  confidence: medium
  cautions: The exact kinship relation between Esege Malan and Gesir Bogdo is not
    fully explicit in the first version as printed.
- id: motif:4
  label: hero internalizes supernatural powers before mission
  taxonomy_refs:
  - initiation
  basis: Gesir Bogdo receives the Tengeris' tricks, one hundred thousand in number,
    and swallows them before proceeding toward his earthly mission.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage describes acquisition and swallowing of powers but does not
    explicitly call it an initiation.
- id: motif:5
  label: miraculous birth through elderly mother
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: Both versions place Gesir Bogdo's birth through a sixty-year-old woman after
    multiple strange births; he speaks at birth and in the first version rapidly grows
    to adult stature.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:14
  - ev:15
  - ev:16
  confidence: high
  cautions: The variants differ in names and details of the birth signs.
- id: motif:6
  label: birth establishing the future human birth pattern
  taxonomy_refs:
  - sacred_birth
  basis: In both versions a child says that all people will thereafter be born in
    the way he is born, and the narrator affirms this became so.
  evidence_refs:
  - ev:7
  - ev:15
