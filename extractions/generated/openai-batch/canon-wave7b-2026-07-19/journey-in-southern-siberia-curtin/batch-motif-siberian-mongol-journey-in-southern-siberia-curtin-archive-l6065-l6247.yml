canonical_text:
  quote: ''
  summary: Two Buriat-Mongol versions of the Gesir Bogdo myth recount disorder and
    evil beings in an earlier world, a heavenly decision to send Gesir to earth, his
    acquisition of divine powers and heroic equipment, his miraculous birth through
    an elderly woman, his destruction of evil beings, and his continuing sleep under
    a rock until evil again increases. The second version begins a parallel account
    in which Delquen Sagan sends Gesir to earth and Gesir is born miraculously with
    signs of supernatural knowledge and equipment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first version begins with confusion, disorder, vile creatures, and Mangathais
    on the earth below.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A council in the sky is held, and Qurmus Tengeri says that a middle son can
    pacify and set aside the evil.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gesir Bogdo says he will go to earth and destroy evil creatures if the ninety-nine
    Tengeris give him all their tricks.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Tengeris give one hundred thousand tricks, and Gesir Bogdo swallows them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Gesir Bogdo receives a black steed, a hero's outfit, a lasso, a dart, a wife,
    and the wife's three daughters; he swallows what is given to him.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Otqon Tengeri is commanded to soothsay whether the three daughters should
    be given, and says they will be useful to Gesir Bogdo.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before descending, Gesir Bogdo travels in heaven for three years, looking
    down and seeing evil-doers, bad spirits, and vile creatures.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gesir Bogdo decides that he must be born in the country and wishes to enter
    the head of the sixty-year-old woman Tumun Yarigul.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the year of Gesir Bogdo's entry, Sindlei Ugugun becomes prosperous,
    his herds increase, and his grass grows well.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tumun Yarigul says she feels she will be the mother of many and hears children
    talking.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Many children are born to Tumun Yarigul in different ways and fly to the sky;
    one child states that all people will be born thereafter as he is born.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The infant identified as Gesir Bogdo is initially thin and ugly, then quickly
    changes and grows to a man's stature.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Gesir Bogdo cleans away vile things and destroys evil spirits and bad people.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Lusugtii Mangathai is the last evil spirit Gesir Bogdo kills; when held by
    the legs, he scratches the earth and ten streams gush out, forming the river Aqa.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Gesir Bogdo says he will lie down and sleep until harmful things, evil spirits,
    and bad people are again many in the world, and then he will wake and destroy
    them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage says Gesir Bogdo had three sons and six grandsons before he came
    down from the sky, and that there were formerly eighty-one tales about the nine
    descendants.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:17
  text: The tales of Gesir Bogdo's descendants had to be told in groups of nine, with
    the relator neither eating, drinking, nor sleeping during the telling.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: Gesir Bogdo is said to sleep at the Rising of the Sun under an immense flat
    rock surrounded by taiga, and his turning causes earth trembling identified by
    Buriats as his movement.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:19
  text: The second version describes an earlier world with Marat people and Mangathais
    ruled by Shalmo Khan.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:20
  text: In the second version, Delquen Sagan says Shalmo Khan and his people should
    be destroyed, a peaceful people should be created, and sends his grandson Gesir
    Bogdo to earth to be Khan.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:21
  text: In the second version, the elderly woman Sundlei Hamiagan says she feels she
    will be the mother of many children and hears them discussing how they will come
    into the world.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:22
  text: In the second version, many sons are born in different ways and go to the
    sky; after ten days Gesir Bogdo is born and says people will thereafter be born
    in his way.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:23
  text: In the second version, no knife can cut Gesir Bogdo's umbilical cord, and
    he instructs his father to use a plant from the west side of the yurta roof by
    waving it three times in the sun.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:24
  text: In the second version, the infant Gesir Bogdo tells his father about nine
    birch trees, a strong black stallion, a yellow flint from Esege Malan with magic
    power, and heroic equipment hidden in or near the yurta.
  category: speech
  evidence_refs:
  - ev:17
