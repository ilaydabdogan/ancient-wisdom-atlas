canonical_text:
  quote: ''
  summary: In the passage, an apparently old man who is later identified as Khan Sokto
    manipulates goat meat and entrails as harmful or healing food, obtains strips
    of skin and flesh from four rival bridegrooms, joins a night watch for a gray
    mare whose colts have been stolen, turns into a reed, kills a many-headed Mangathai
    that comes for the newborn colt, destroys the monster's remains, gives the rivals
    a false explanation, and finally reveals the truth and his lineage as son of Yerente
    Khan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A daughter urges her father to taste an unspecified food; after taking a spoonful
    and then a cupful, he is cured.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father calls the four bridegrooms and orders them to hunt again and bring
    entrails; the youngest daughter asks that the old man also be sent.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The four bridegrooms ridicule the old man; in the forest he kindles a fire,
    stays by it, kills a goat, and says that the entrails should be poison and the
    meat the cure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man agrees to divide the goat only if each bridegroom gives him a
    strip of skin from neck to back; they take the entrails and leave him the clean
    meat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father eats cooked entrails, becomes swollen and very sick, and is cured
    when the old man's bride persuades him to eat clean meat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The father says his big gray mare will have a colt and asks the four bridegrooms
    to watch her because three previous colts have been stolen.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old man joins the watch, leaves the cold fire-side group, turns himself
    into a reed, and watches the gray mare.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: At midnight a fifty-five-headed and fifty-horned Mangathai comes when the
    mare foals; the reed shoots and kills the Mangathai.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old man places the colt with its mother, burns the Mangathai, gathers
    ashes from its bones into ninety-seven bags, grinds the ashes, and lets the wind
    carry them away.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At dawn the four bridegrooms know nothing of the night event and are nearly
    frozen; the old man warms them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The old man demands four strips from the bridegrooms' thighs in exchange for
    telling what he saw, then gives them only a vague account of a shadow, bird, or
    something swallowing the colt.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The four bridegrooms repeat the vague account to the father-in-law and say
    they could not shoot the thing that swallowed the colt.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The old man tells the father-in-law that he obtained straps from the four
    sons-in-law and explains earlier exchanges involving meat, entrails, sickness,
    and cure.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The old man says the true night visitor was a Mangathai, that he shot and
    killed it, and that the colt is alive.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: When pressed for the truth of his name, the old man says he is Khan Sokto,
    son of Yerente Khan.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: The father-in-law summons the four bridegrooms, makes them show backs and
    thighs, and sees that the straps fit them.
  category: action
  evidence_refs:
  - ev:10
