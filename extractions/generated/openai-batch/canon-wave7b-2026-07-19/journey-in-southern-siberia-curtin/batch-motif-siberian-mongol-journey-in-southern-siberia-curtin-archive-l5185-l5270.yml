canonical_text:
  quote: ''
  summary: The passage describes ancestral spirits or flames speaking through a young
    shaman, followed by a public rite in which a novice becomes a full shaman. An
    experienced shaman conducts offerings to Burkans; birch trees, a central tree
    through the yurta smoke-hole, and rainbow-colored silk strings are arranged; nine
    assistants represent heavenly helpers; animals and libations are offered; the
    novice is purified with blood from a white goat; impure animals are smoke-purified;
    offerings, feasting, and treetop rites follow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A flame or spirit strikes the young shaman's forehead and speaks through him
    about a shaman ancestor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Additional flames may strike the young shaman, and the process may continue
    until all his shaman ancestors have spoken.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: While speaking for a dead shaman, the living shaman may tell someone present
    that a Burkan wants an offering and libation, with sickness or misfortune threatened
    if it is not given.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: When the young shaman is ready for full status, people appoint a day and invite
    an experienced shaman to conduct the ceremony with libations and offerings to
    Burkans.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fifty-four birch trees are cut from a sacred grove with permission from the
    grove's Burkan; three are large, the rest small, and they are arranged as a row,
    a pillar, a turga, and a central tree rising through the yurta smoke-hole.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Silk strings representing rainbow colors are fastened to the top of the central
    birch and tied to the highest branch of the tree called the pillar.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nine men from the young shaman's village are selected to assist and represent
    the nine Heavenly assistants of Xoxode Mergen.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The old and young shamans hold one-branched twigs representing their friendly
    Burkans, burn them, and summon the Burkans by name.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: People from the village and surrounding villages bring milk, tarasun, sheep,
    and horses for a great sacrifice.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The number of sacrificial animals must be at least nine, and if more than
    nine are offered the number must be eighteen or twenty-seven.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Milk and tarasun are sprinkled as libations on the animals before they are
    sacrificed, and assistants sprinkle milk, tea, and tarasun on the ground for the
    Burkans.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The young shaman removes his clothing, stands naked before the small birches,
    and is sprayed with blood from a white goat stabbed by the nine young men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The goat-blood rite is called ugalga, purification.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: After the goat is thrown to waiting women, they finish killing it, cook it,
    and eat the meat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Impure sacrificial animals are purified by being led through smoke from burning
    juniper.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: After sacrificed flesh is boiled, parts are offered to the gods and the rest
    is eaten; the young man is then declared a full-fledged shaman.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The feasting lasts three days and nights, and some shamans make offerings
    to the gods from the tops of trees.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:18
  text: The passage states that in old times mighty shamans could walk on the silk
