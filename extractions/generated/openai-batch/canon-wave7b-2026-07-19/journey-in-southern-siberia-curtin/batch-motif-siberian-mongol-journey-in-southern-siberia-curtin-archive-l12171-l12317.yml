canonical_text:
  quote: ''
  summary: A bride-seeking man fails a heavy-stone marriage test set by Agiii Nogun
    Duhe. Sokto continues on a journey, enters an iron yurta by transforming himself
    and his horse, kills a many-headed Mangathai, then kills the Mangathai's twenty-five-headed
    son with a returning arrow. At a three-road junction he encounters a one-eyed
    old woman whose tarasun contains worms, escapes her by trickery, blocks her thrown
    scraper with a stone mountain, and later heals Shurak Taiji Hubun, who had been
    harmed by the same witch's drink. The passage ends with Sokto reaching a meadow
    full of large frogs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed big man says he is going to Yerente Khan because he has heard Yerente
    has a daughter, Agiii Nogun Duhe, whom he wants as a wife.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nashin Huimer Hubun says he has also set out to find his bride, Geye Gohun
    Duhe, and the two travelers part with friendly wishes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Agiii says she will not marry before her brother marries, and says the suitor
    must throw a bullock-sized stone from the field to the yurta if he wants to marry
    her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The unnamed suitor lifts the stone only to his waist, lets it fall, mounts
    his steed, and returns home without speaking to anyone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sokto comes to a great iron yurta with twenty-five horse skulls on stakes
    in front of it, along with outfits, weapons, and dress.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sokto changes his horse into a flint chip, puts it in his pocket, changes
    himself into a weasel, burrows under the house, and enters through the floor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Inside the iron yurta, Sokto sees a hundred-and-eight-headed Mangathai sleeping
    with an axe near his principal head and blue and red flames quivering from his
    mouth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In weasel form, Sokto hides the axe, cuts the Mangathai's throat, exits, and
    returns to human form while the flint chip becomes the red stallion again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The red stallion warns Sokto not to boast of killing the Mangathai and says
    the place will later be a great Shaman place.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sokto meets a twenty-five-headed Mangathai on a gray stallion, who identifies
    the iron yurta as his father's yurta and vows to find whoever killed his father.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Sokto shoots an arrow behind himself with a command that it slay the twenty-five-headed
    Mangathai and his horse; the arrow kills both and returns to the quiver.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: At a place with three roads, Sokto sees a shed containing a very wrinkled
    old woman with one eye and one tooth, and she offers him tarasun in a silver goblet
    that contains many worms.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:13
  text: Sokto praises the tarasun, asks for more, requests that the old woman bring
    her pipe so he can give her tobacco, then throws the tarasun on her and rides
    away.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:14
  text: The old woman hurls a twenty-fathom tanning scraper after Sokto, falls down,
    and seven acres of land become covered with foul worms; the tarasun-covered land
    burns immediately.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Sokto creates a great stone mountain behind him; after three days and nights
    the scraper pierces the mountain, and Sokto seizes and breaks it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Sokto finds a huge light bay stallion and a young man whose flesh has nearly
    been eaten by worms; the young man says he is Shurak Taiji Hubun, son of Shur
    Galgun Khan, and that he drank the old witch's tarasun while seeking a bride.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: Sokto brings water from nine springs, washes Shurak, burns juniper from nine
    places, cures him, and the two become great friends.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: After healing Shurak, Sokto travels to a meadow with many frogs, some as large
    as a three-year-old bullock.
  category: setting
  evidence_refs:
  - ev:10
