canonical_text:
  quote: ''
  summary: Gesir Bogdo kills or has already killed several Mangathai adversaries,
    including multi-headed ones. He kills enemy horses to accompany their masters
    or burns them, instructs his wife and followers to watch while he sleeps, wakes
    to fight attackers, uses archery and wrestling, and later changes into rock when
    attacked by another Mangathai near fifty pine trees. His roar and blow are heard
    in the fifty-fifth sky by Hohodai Mergen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gesir says the slain Mangathai should have his horse to ride in the other
    world, kills the horse at the death site, and places a mountain on the Mangathai
    and horse.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gesir tells his wife to wake him if he sleeps and instructs the thirty-three
    champions and three thousand men to guard his property in groups because more
    Mangathais will come.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The guards play games instead of keeping watch.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A twenty-seven-headed Mangathai comes; Gesir knows this by magic, wakes, watches
    from a southeastern mountain, and sees the Mangathai enter a hole at the seashore
    where a silver-leafed aspen had been pulled up.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At daybreak Gesir shoots an arrow that cuts off the twenty-seven heads; the
    Mangathai's horse is overtaken, killed, and buried under a mountain with its master.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sangha Gohun sees another Mangathai, considers the dogs' behavior as an indicator
    of the fight's outcome, fears waking Gesir, and a tear falling into his right
    ear wakes him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Gesir's horse knows the Mangathai is present and runs in from the open country.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gesir and the Mangathai choose wrestling; they fight for two days, tear flesh
    from one another, and Gesir kills the fifty-three-headed Mangathai.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After killing the fifty-three-headed Mangathai, Gesir says he must sleep nine
    days and nine nights and asks Sangha Gohun to watch, not sleep, and wake him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A seventy-seven-headed Mangathai arrives while Gesir sleeps, watches from
    a mountain, and Sangha Gohun delays before waking Gesir after five days.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Gesir and the seventy-seven-headed Mangathai agree to race to opposite mountains,
    with the first arrival to shoot first; Gesir reaches his mountain first and kills
    the Mangathai with an arrow.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Gesir burns the body of the seventy-seven-headed Mangathai and burns the horse.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Another Mangathai rushes into Gesir's courtyard and says Gesir has killed
    his elder brothers.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: At the place of fifty pine trees, the Mangathai kills a male and female deer
    and roasts them on spits before a large fire; Gesir arrives, takes one spit, sits,
    and eats.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: When the Mangathai attacks with an axe, Gesir turns into hard white rock;
    the axe breaks, Gesir resumes his form, strikes the Mangathai, and roars so loudly
    that it is heard in the fifty-fifth sky.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: Hohodai Mergen, identified as Thunder, hears the blow and asks a question,
