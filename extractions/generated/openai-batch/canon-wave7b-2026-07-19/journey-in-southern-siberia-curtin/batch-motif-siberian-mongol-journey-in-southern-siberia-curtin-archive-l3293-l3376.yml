canonical_text:
  quote: ''
  summary: 'A reported cosmological argument describes atoms and ether as indestructible
    principles: aggregations form, are tested by ether, dissolve when unfit, and ether
    returns to its source with memory. The narrator then falls asleep under the night
    sky while thinking about a real heaven and dreams of an enormous telescope. A
    person invites him to look and says it shows the great center or storm center
    of the universe, a place of perfect balance, peace, and no decay, reachable only
    by perfect beings. The narrator asks whether the balance can be lost, and the
    person answers that it will remain calm and happy as long as force and matter
    last.'
  language: English
  quote_policy: summarized
