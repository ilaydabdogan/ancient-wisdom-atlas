canonical_text:
  quote: ''
  summary: After a deep hole is uncovered, a chain is forged for descent. Several
    young men fail to reach the bottom, but Altun descends, falls, is injured, and
    remains half alive for years. He learns of a healing herb from a mouse, cures
    himself, heals an eagle with living water, enters the domain of the hundred-headed
    Mangathai in disguise, recognizes his sister, learns about Water of Life and poison
    water, and faces the Mangathai, whose weapons fail against him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ninety-nine-pood rock is hurled beyond seven valleys and is found to have
    covered a deep hole.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young men decide that one of them must ask nine heavenly blacksmiths to
    make a chain long enough to reach the bottom of the hole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The nine heavenly blacksmiths make a nine-hundred-sachen chain over nine days.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Three young men descend partway on the chain, at two hundred, four hundred,
    and six hundred sachens, and each signals to be pulled up.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Altun releases his horse and tells it to wait, return home if he stays long,
    and watch the three men because they may want to kill it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Altun descends the full length of the chain, finds it one hundred sachens
    short, chooses not to climb back, drops, breaks his ribs, sinks halfway into the
    earth, and lies there for nine years.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A mouse builds a nest in Altun's clothes; after Altun crushes one of its sides,
    it eats an herb and recovers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Altun crawls for three days and nights, finds the same kind of herb, eats
    it, and is restored.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old eagle covered with sores asks Altun to bring living water from nine
    springs; after drinking it, the eagle rises and promises to come when called.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: On a flat-topped mountain Altun sees people standing thickly, with a hundred
    kettles over fires in which flesh of men and beasts is boiling for the Mangathai
    of a hundred heads.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Altun changes himself into an old withered man and tells a wife of the Mangathai
    that he is Xapmyam Yama's herdsman looking for strayed animals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: One of the Mangathai's wives recognizes Altun as her brother, says she is
    happy there, and warns him not to fight the Mangathai because he is a great wizard.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The sister tells Altun that Water of Life is on the right of the door and
    poison water on the left, and that even the odor of the poison water would kill
    him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Altun says he can change the effects of the Water of Life and poison water
    so that each acts as the other.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: A pillar inscription says that anyone wishing to fight the Mangathai should
    wait on the top of the opposite mountain.
  category: object
  evidence_refs:
  - ev:10
- id: obs:16
  text: Altun drinks the Water of Life, goes to the mountain, kills and roasts two
    goats, sees many bones of animals and people, and lies down to sleep.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Mangathai arrives with an axe, seventy wedges, and a ninety-pood hammer;
    the axe barely affects Altun, the wedges spring away toward the sky and ocean,
    and the hammer breaks and flies toward the sea.
  category: action
  evidence_refs:
  - ev:11
