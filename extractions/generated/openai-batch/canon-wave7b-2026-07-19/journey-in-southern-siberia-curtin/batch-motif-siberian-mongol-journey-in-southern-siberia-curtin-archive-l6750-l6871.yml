canonical_text:
  quote: ''
  summary: Gesir Bogdo wrestles Gal Nurman and, after divine aid is refused, kills
    him with the help of his brother Dashin Shuher. Gesir destroys Gal's household,
    disposes of Gal's wives, and burns a premature speaking infant after severing
    a tube from the sky that protected the child with water. Gesir then sleeps in
    his white stone yurta after instructing Sangha Gohun how to wake him. A seventeen-headed
    Mangathai appears; Sangha's tear accidentally wakes Gesir. Gesir survives an axe-throwing
    contest by turning into stone, then kills the Mangathai with a magically commanded
    arrow. The Mangathai's horse speaks and flees, and Gesir summons his enormous
    blue steed to pursue and catch it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gesir Bogdo removes his armor, dismounts, and wrestles Gal Nurman for three
    days and three nights, with severe bodily injury described on both sides.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two of Gesir's champions try to seize Gal Nurman's legs, and Gal kicks each
    one so that he rolls down the hill.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gesir calls on the Burkans for help, but they refuse because they are angry
    that Sangha Gohun followed him up the rainbow to the sky.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Gesir calls on his brother Dashin Shuher; Dashin comes, and the two kill Gal,
    put his body in an iron cask, roll it into the sea, and go to Gal's yurta.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: Gal Nurman has two wives; Gesir shoots an arrow at the yurta, strikes the
    younger woman, and an infant springs from her body speaking of being born three
    days early and of conquering Gesir and Dashin if he lives nine more days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Dashin asks why Gesir killed the woman, says he would have taken her as a
    wife, becomes angry, leaves Gesir, and goes up to the sky.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Gesir puts Gal's elder wife into an iron barrel and rolls the barrel into
    the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: Gesir puts the infant into furnace fires on two successive nights, and on
    each following morning finds the child alive and playing with live coals.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: On the third night Gesir sees a red and green tube descend from the sky to
    the child's navel; the tube raises the child, and a stream of water falls on him.
  category: object
  evidence_refs:
  - ev:3
- id: obs:10
  text: Gesir shoots the sky tube with an arrow, cuts it, makes a great fire, and
    burns the child to ashes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Gesir takes cattle, people, and treasures, ruins Gal Nurman's place, brings
    the people to his domain, and assigns them homes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Before sleeping in his white stone yurta, Gesir tells Sangha Gohun to wake
    him in danger by stabbing his right heel, then his right thigh, or finally by
    letting cold spring water drop into his right ear.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: A seventeen-headed Mangathai, described as the brother of a ten-headed Mangathai
    previously killed by Gesir, appears while Gesir sleeps.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: Dogs bark, watchmen and thirty-three champions raise an outcry, and Sangha
    Gohun tries to wake Gesir but decides not to stab or pour water into him because
    she fears harming or weakening him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: Sangha Gohun cries all day; at night one tear falls into Gesir's ear and wakes
    him at once.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: The Mangathai tells Gesir that each should go to a different mountain and
    hurl axes at each other; they dispute who should throw first.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: When the Mangathai's axe comes toward Gesir's head, Gesir turns himself into
    stone; the axe strikes the stone without making a hole or dent, and Gesir then
    takes his own form again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:18
  text: Gesir speaks commands to his arrow; red fire appears on the bow where the
    arrow touches, blue flames run along the bowstring, and the arrow kills the Mangathai
    and returns to Gesir's quiver.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: The Mangathai's horse speaks to Gesir, says Gesir will never kill it, refuses
    to yield, and flees southwest to the great barren steppe.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:20
  text: Gesir summons his blue steed, described as ninety-nine fathoms long; the steed
    appears, carries Gesir without a saddle, and catches the Mangathai's horse during
    the chase across valleys.
  category: sequence
  evidence_refs:
  - ev:8
