canonical_text:
  quote: ''
  summary: Gesir pursues changing remnants through animal transformations, calls on
    Thunder for hail, catches skylarks as a raven, and kills them through his horse,
    after which the Mangathai dies and is covered with a mountain. Gesir then defeats
    the ninety-nine-headed father of the Mangathais by imprisoning him in a split
    larch tree bound with hoops. Afterward Sangha Gohun bears Gesir a son, Ashir Bogdo,
    who is named in a feast ceremony. When the child walks at five months, Gesir travels
    around the world for twelve years, falls in love with the daughter of Gal Tulan
    Tengeri, returns home, and disputes with Sangha about taking this woman as a second
    wife.
  language: English
  quote_policy: summarized
