canonical_text:
  quote: ''
  summary: Travel narrative describing Buriat foodways and hospitality, haymaking
    along the road, the narrator's arrival at Alaguersk-rod to collect information
    and stories, disagreement and resistance among local informants, and the subsequent
    return journey through post stations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buriat households are described as having no regular meal hours; sheep are
    killed, boiled, eaten, and sometimes meat is dried, while special Russian foods
    are brought out for honored visitors as a reception meal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After leaving Kosostep, the narrator sees Russian and Buriat men and women
    mowing and turning grass in meadows on both sides of the road.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The district is described as having rich black soil but limited crops because
    of climate; rye and grass do well, while fruit is absent except for cultivated
    blueberries seen by the narrator.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: At Alaguersk-rod, the government building has been made ready, a samovar is
    boiling, and the official translator with twelve or fifteen Buriats is present
    to meet the narrator.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The official translator is described as a Russian exile for life, educated
    and interesting, with a worn and sad appearance; the narrator later learns he
    had been exiled after striking a superior officer.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: After tea, information and story collection begins; haymakers crowd into the
    uprava, tobacco smoke fills the room, an old man begins a story, and a young man
    interrupts and disputes his version, leaving the story unfinished.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A man from the Trans-Baikal gives the narrator important material, but a heavily
    drinking Buriat from the village tries to stop him from giving a foreigner information
    about the religion of the country.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The opposition to sharing religious information is overcome only after uproar,
    discussion, and questioning; the opposing man is silenced by neighbors and officials.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The next day, after work has gone on for a few hours, the story-teller says
    he must leave because Irkutsk merchants have sent him to hire men to fish at the
    mouth of the Angara; the narrator cannot find another useful informant.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Lazareff leaves for Kosostep, while the narrator remains overnight; the narrator
    later visits the exile's home, meets his frail wife, and promises to speak on
    the exile's behalf.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: On the following chilly morning a fire is needed; after delays the narrator
    reaches Kosostep, finds horses waiting, eats sour blueberries at the next station,
    and continues with a Russian driver.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: On the way from Hogotskaya to Baiandai, the horses are poor, and the driver
    moves a contrary side horse between the thills so that it is forced to work.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: At Baiandai, Lazareff and Vassya hear of the death of a relative's child and
    use it as a reason to hasten to Usturdi; the narrator is glad to part from Lazareff.
  category: action
  evidence_refs:
  - ev:12
