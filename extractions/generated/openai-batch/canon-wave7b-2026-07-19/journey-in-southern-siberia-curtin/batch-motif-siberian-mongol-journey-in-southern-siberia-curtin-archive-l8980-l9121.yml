  quote_or_summary: Altun questions the young Mangathai’s mother about horse tails
    and tree-tops, ties her to seventy horses’ tails so she is torn apart, brings
    her to life, then impales her on seventy tree-tops and she dies.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
