- id: ev:6
  type: summary
  locator: 9037-9050
  quote_or_summary: Altun overturns the house, takes goods and cattle, sends everything
    and the four women up by the chain at the hole, and while following them the chain
    is cut and he falls to the bottom, sinking into the earth up to his chin.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:7
  type: summary
  locator: 9051-9063
  quote_or_summary: Altun calls the eagle, who says he is in deep trouble and goes
    for living water; after Altun drinks Water of Life he is restored, and the eagle
    offers to take him out on its back after being fed meat.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:8
  type: summary
  locator: 9064-9076
  quote_or_summary: The eagle carries Altun upward but weakens; Altun cuts flesh from
    his own thigh and feeds the bird, after which the eagle falls sick and Altun revives
    it with Water of Life.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:9
  type: summary
  locator: 9077-9094
  quote_or_summary: Altun meets an old man and old woman in a hay shed disputing over
    silver coin; after he divides it, the old man gives instructions involving dudki
    cane, the hole, and transformations into skunk, magpie, and raven to reach the
    country above.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:10
  type: summary
  locator: 9095-9103
  quote_or_summary: Altun follows the dudki instructions, reaches the top, resumes
    his own form, pockets the dudki, and finds his horse on the ground with hind quarters
    gnawed by wolves.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:11
  type: summary
  locator: 9104-9114
  quote_or_summary: Three young men had tried to kill the steed and obtained nine
    wolves from Esege Malan Babai; the wolves chased and gnawed the horse, but it
    escaped back to wait near the hole for Altun or die.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:12
  type: summary
  locator: 9115-9125
  quote_or_summary: Altun brings Water of Life from Red Mountain and sprinkles his
    steed, healing it; he rides west toward Zudu’s home, changes his horse into a
    flint, changes himself into a fly, and sits at the smoke-hole.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary generated from supplied passage.
- id: ev:13
  type: summary
  locator: 9126-9121
  quote_or_summary: Altun hears Zudu’s sister ask Zudu why he threw the good man into
    the hole; Zudu replies that if she is sorry, she should go down after him, and
    scolds her.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
