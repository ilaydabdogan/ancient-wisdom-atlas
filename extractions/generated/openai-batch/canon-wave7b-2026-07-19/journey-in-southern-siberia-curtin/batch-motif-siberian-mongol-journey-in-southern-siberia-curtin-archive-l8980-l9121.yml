canonical_text:
  quote: ''
  summary: Altun defeats the Mangathai after magically exchanging life-giving and
    poisonous waters, destroys the Mangathai’s body and kin, frees the people, is
    betrayed at a chain leading upward from an underground realm, receives aid from
    an eagle and an old couple, escapes through sequential transformations, heals
    his wounded horse with Water of Life, and spies on Zudu in the form of a fly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Altun wakes, sees the Mangathai, and wrestles or fights him through an extended
    contest in which neither first overcomes the other.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the Mangathai’s request for strengthening water, Altun magically changes
    the waters so that Altun drinks Water of Life and the Mangathai drinks poison
    water; this happens more than once.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Altun eventually kills the Mangathai, tears off his heads, grinds and burns
    the body and heads, and scatters the ashes toward the ocean.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Altun gathers the people and tells them that their master is dead and that
    they are free.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Altun’s sister identifies a young Mangathai hidden under the floor and a gold
    cover, and warns that he will become dangerous if he lives; the young Mangathai
    resists ordinary fire but is burned in a furnace over nine days and nine nights.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Altun kills the young Mangathai’s mother by tying her to seventy horse tails,
    revives her after she is torn apart, and then impales her on seventy tree-tops.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Altun overturns the house, takes goods and cattle, sends possessions and four
    women up by a chain at a hole, and then falls when the chain is cut as he is near
    the top.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Altun calls an eagle, and the eagle brings living water; after drinking Water
    of Life, Altun rises from the earth and is restored.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The eagle attempts to carry Altun upward, first after eating goat meat; when
    the eagle weakens, Altun cuts flesh from his own thigh and feeds it to the bird,
    after which the eagle falls sick and Altun revives it with Water of Life.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: Altun divides silver coins between an old man and an old woman in a hay shed,
    and receives instructions involving dudki cane that will move him to the hole
    and transform him successively into a skunk, a magpie, and a raven.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Altun follows the dudki instructions, reaches the top, resumes his own form,
    and keeps the dudki.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Altun finds his horse badly gnawed; three young men had tried to kill the
    steed and obtained nine wolves from Esege Malan Babai, but the horse escaped back
    toward the hole.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: Altun brings Water of Life from Red Mountain, sprinkles the horse with it,
    and heals the horse completely.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Near Zudu’s yurta, Altun changes his horse into a flint and himself into a
    fly, sits by the smoke-hole, and hears Zudu’s sister ask why Zudu threw the good
    man down into the hole.
  category: sequence
  evidence_refs:
  - ev:12
  - ev:13
