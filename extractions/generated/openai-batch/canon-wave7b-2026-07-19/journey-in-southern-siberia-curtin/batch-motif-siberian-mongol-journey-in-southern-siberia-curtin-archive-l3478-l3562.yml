canonical_text:
  quote: ''
  summary: 'The passage gives family background for a Buriat named Muravieff and his
    Russian relatives, then narrates travel toward Olkhon: obtaining horses and wagons,
    descending swiftly toward Lake Baikal, encountering a Shaman making tarasun and
    milk offerings to drive away sickness, crossing to the island by boat, and approaching
    sacred Olkhon with a cliff bearing two visible faces.'
  language: English
  quote_policy: summarized
