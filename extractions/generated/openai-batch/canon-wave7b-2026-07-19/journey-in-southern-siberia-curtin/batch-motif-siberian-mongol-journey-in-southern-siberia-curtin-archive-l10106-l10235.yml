canonical_text:
  quote: ''
  summary: Hara Zaton kills his nephew Hunkuvai. Hunkuvai's horses escape to the sky.
    Hunkuvai's widow Shik Shuri hides her two sons under pine trees near Shaman mountain
    and deceives Zaton with burned lamb bones. Zaton eats the bones, seizes Hunkuvai's
    property, and mutilates Shik Shuri. The hidden boys, Huragin and Isbegin, grow
    rapidly, become hunters, are captured by a seventy-three-headed Mangathai, and
    are rescued when the rich childless merchant Turgubai buys them. They become strong
    youths, carve their life history on a fallen cliff, and climb Tomtoy mountain,
    where they see a valley of pots holding bullocks and spits holding impaled men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hunkuvai tells his uncle to kill him but spare his children, and Zaton kills
    Hunkuvai with an arrow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hunkuvai's stallion and the gray steed with round head tear themselves free,
    speak to Zaton, and go to the sky to the one who made them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Shik Shuri knows by magic what has happened and takes her two sons toward
    Shaman mountain, where she hides them in pits under two immense pine trees.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: After the children crawl out of the pits and suck each other's fingers, their
    mother nurses them, returns them to the holes, and vanishes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Shik Shuri kills two lambs, burns them, places their bones in a bag, sinks
    the bag in a lake, and marks the place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Shik Shuri tells Zaton that she burned the boys and hid their bones, then
    shows him the bag of bones.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Zaton grinds the bones into dust, mixes the dust with fat, cooks the mixture,
    and eats it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Zaton moves into his nephew's yurta, takes his property, puts out Shik Shuri's
    left eye, breaks her left arm and left leg, and makes her feed the courtyard dogs
    as a serving woman.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Huragin and Isbegin grow quickly under the two pine trees, make bows and arrows,
    hunt birds and rabbits, and eat them raw.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Dainjin Sharaman, a Mangathai of seventy-three heads, seizes the boys, ties
    them to pillars, cuts flesh from their thighs, and roasts the pieces for supper.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: The childless rich merchant Turgubai buys the boys from the Mangathai for
    eighty horses, takes them home, cures them, and calls them his sons.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The brothers become skilled hunters, fill the merchant's storehouses with
    game and furs, and then begin herding his cattle.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: On Tomtoy mountain the brothers throw stones and rocks over great distances,
    carry a fallen cliff home, and carve on it the history of their lives and a warning
    of vengeance against anyone who harms their new father.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: From the top of Tomtoy mountain the brothers see a long narrow valley with
    a row of pots containing bullocks and huge spits holding impaled men.
  category: setting
  evidence_refs:
  - ev:14
