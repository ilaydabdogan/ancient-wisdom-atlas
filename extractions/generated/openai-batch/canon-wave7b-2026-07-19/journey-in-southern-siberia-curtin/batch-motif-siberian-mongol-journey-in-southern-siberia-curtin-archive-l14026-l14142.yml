canonical_text:
  quote: ''
  summary: The twin sons force Agwi Nogon to reveal where their father Hodoy is held.
    They ride to Yellow Dog's kingdom, free Hodoy from a stone-covered pit, and a
    raven revives him with Water of Life. Hodoy and Yellow Dog then go against the
    Mangathai, transform into immense dogs, kill him, and impose an undying regenerative
    punishment on his wife at a larch tree where three roads meet. Hodoy recovers
    his cattle, feasts with Yellow Dog, gives him half his wealth, vows friendship,
    and has his sons named Altin Shagoy and Mungun Shagoy by an old man.
  language: English
  quote_policy: summarized
