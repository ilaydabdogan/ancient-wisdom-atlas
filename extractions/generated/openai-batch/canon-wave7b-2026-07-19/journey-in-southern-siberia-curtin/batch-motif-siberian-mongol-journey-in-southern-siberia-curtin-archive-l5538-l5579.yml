canonical_text:
  quote: ''
  summary: A man with second sight meets three dead men carrying an infant's soul
    in a small box. He tricks them by learning their fear of a thorny shipovnik bush
    and falsely claiming to fear fat meat. He seizes the box, shelters in the bush,
    eats the fat meat they throw at him, and returns the soul to the child's body,
    causing the child to revive and sneeze.
