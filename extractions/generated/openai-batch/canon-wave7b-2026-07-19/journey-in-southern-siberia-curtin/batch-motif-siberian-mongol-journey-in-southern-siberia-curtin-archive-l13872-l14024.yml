canonical_text:
  quote: ''
  summary: After a Mangathai has carried off the sister, houses, cattle, and people,
    Hodoy's wife remains in a poor yurta and gives birth to extraordinary twin sons.
    Warned that the Mangathai intends to kill them, she hides the boys on a mountain
    and deceives him with burned twin lamb bones. The boys evade seven hundred searchers,
    find a childless old couple, learn to hunt, discover imprisoned victims of a man-eating
    Mangathai, transform into bees to kill him, receive wealth, send it to their mother,
    and return to ask about their father.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A horse returns home and finds only Hodoy's wife; the sister, houses, cattle,
    and people have been taken, leaving a poor little yurta.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hodoy's wife gives birth to twins whose backs are gold and hearts are silver;
    they grow too large for a three-year-old sheep skin within three days.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mangathai learns by magic that the wife has twins and says the children
    must be killed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A magpie enters the yurta and warns the mother that the Mangathai is coming
    to kill her two children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother puts the boys and provisions on the red horse, takes them to a
    mountain, leaves them there, and returns home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mother burns twin lambs and shows their bones to the Mangathai as if they
    were the boys' bones; despite being beaten, she does not reveal where the boys
    are.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Mangathai sends seven hundred men to search for the children; the boys
    descend at night, take two saddled horses and two baskets of bomshoy from the
    sleepers, send the red horse home, and escape southward.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The brothers reach a meadow hut where a gray old man and a little old woman
    sit by the fire; the childless couple asks the boys to become their children.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The old man makes bows and arrows for the twins, and they shoot and kill many
    wild goats while herding sheep.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The boys enter a forest house against the old people's warning and find two
    hundred men, half crying and half laughing, because the Mangathai eats people
    daily.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The brothers say they do not fear the Mangathai and ask what the imprisoned
    men will give them if they kill him; the men promise half their gold and half
    their cattle.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The two boys turn into two bees, position themselves by the door, and enter
    the Mangathai's ears when he tries to come through the smoke-hole; they sting
    his brain until he dies.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The two hundred men burn the Mangathai, scatter his ashes, feast the brothers,
    and give them half their gold and cattle, which the brothers send to their mother's
    yurta.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: The brothers tell the old couple they are sons of Hodoy Khan, return to their
    mother, and ask where their father is; their mother says he was killed while away
    fighting.
  category: sequence
  evidence_refs:
  - ev:11
