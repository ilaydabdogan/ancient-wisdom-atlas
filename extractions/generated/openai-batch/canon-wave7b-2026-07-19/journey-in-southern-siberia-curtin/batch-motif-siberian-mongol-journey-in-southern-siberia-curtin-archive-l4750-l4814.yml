canonical_text:
  quote: ''
  summary: An origin account tells that Buhan Khan, a bull by day and a man by night,
    fathers a son with Khunshai Khan's daughter, steals the infant in its cradle,
    and buries it near the sea. The shaman Usihun and his wife Asihan recover the
    sealed cradle; after Usihun receives instructions from Buga Noyon Babai, ritual
    actions with a bull leg bone, a knife, and spoken questions open the cradle, and
    the child is named Bulugat. Bulugat later plays with two children from the sea;
    after they drink milk and tarasun, Usihun captures the boy, later named Uhurut,
    while the girl becomes a seal and escapes. The passage states descent lines from
    Bulugat and Uhurut. A following fragment, labeled another version of the origin
    of the Trans-Baikal Buriats, begins with a hunter seeing swans become women, stealing
    one maiden's feathers, taking her as wife, and having six children with her.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buhan Khan lives near the sea at Haugin Dalai and is a bull in the daytime
    but turns into a man at night.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Khunshai Khan lives west of the sea and has a beautiful daughter; Buhan Khan
    sees her, falls in love with her, and a son is born to them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the child is placed in a cradle, Buhan Khan steals the child, ties it
    firmly to the cradle, carries it to the edge of the sea, digs a hole with his
    hoofs, and buries the child and cradle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The shaman Usihun and his wife Asihan live by the sea, see Buhan Khan digging,
    recover the cradle after he leaves, but cannot open it because it is tightly hooped.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Usihun performs shamanic inquiry and receives instructions from Buga Noyon
    Babai to fasten a two-year-old bull's right lower leg bone to the cradle, place
    a sharp knife by it, and ask specified questions about rocking the bone or infant
    and the infant's orientation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Usihun follows the instructions, the hoops snap, the cords untie, and
    a beautiful child is found in the cradle; Usihun and Asihan rear the boy and name
    him Bulugat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: When Bulugat is four or five years old, he plays by the sea and slips away
    at night; Asihan follows and sees a boy and a girl come out of the sea to play
    with him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Usihun and Asihan set out milk and tarasun and tell Bulugat to give it to
    his playmates; the boy and girl from the sea drink, fall asleep, and Usihun catches
    the boy.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The girl from the sea slips away, turns into a seal, and springs into the
    sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Usihun names the boy from the sea Uhurut; Uhurut and Bulugat grow up together.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that all Buriats west of the Baikal descend from Bulugat
    and all Vepholensk Buriats descend from Uhurut.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the following version, a hunter sees three swans fly toward a lake, follows
    them, and sees them remove their feathers, become women, and swim away from shore.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The three swans are identified as the three daughters of Esege Malan.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The hunter steals the feathers of one swan, preventing her from flying away
    with her sisters; he catches the maiden, takes her home, and makes her his wife.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage fragment says six children had been born to the hunter and the
    captured swan maiden before the supplied text breaks off.
  category: sequence
  evidence_refs:
  - ev:9
