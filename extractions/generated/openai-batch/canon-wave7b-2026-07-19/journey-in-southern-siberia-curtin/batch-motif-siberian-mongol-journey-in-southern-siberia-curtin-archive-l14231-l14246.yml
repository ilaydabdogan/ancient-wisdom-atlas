canonical_text:
  quote: ''
  summary: 'The note compares Greek, Buryat/Mongol, and Algonkin materials: Helena
    is described as daughter of Leda and Zeus; Leda is divinized after death, unlike
    Meluk Shin, though Meluk Shin''s son receives prayers. An Algonkin Earth-maiden
    becomes a mother through the sun''s look, bears Wakos ikwe, and Wakos ikwe bears
    a benefactor or food-giver identified with warm dancing air, which is also linked
    to Mother Earth and Esege Malan.'
