canonical_text:
  quote: ''
  summary: Two brothers arm themselves, pray to the Burkans with tapers for horses,
    receive four bay horses with heroic outfits, meet their uncle Albat Mergin, and
    find their father Varhan Tulai Hubun suffering under a heavy wheel and iron spikes.
    The party binds and punishes a Mangathai woman and seven young Mangathais at a
    mountain cross-roads with eight larch trees, leaves an inscription commanding
    passers-by to cut flesh from them, overturns the Mangathai house, takes possessions,
    and returns home rejoicing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two brothers take their weapons, leave on foot, and go to the boundary of
    their father's land.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brothers hold twelve tapers while imploring the Burkans for horses for
    one day and night, then place twenty tapers on the ground and pray for three days
    and three nights.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the fourth morning, four bay horses appear near the brothers, each with
    a hero's outfit on its saddle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The brothers mount two horses, lead the other two, ride away, and meet their
    uncle on his way home.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Albat Mergin says that he has killed the sixty-three-headed Mangathai but
    has not seen Varhan Tulai Hubun; the two brothers state that Varhan is their father
    and Albat is their uncle.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Albat turns back with his nephews; they ride to the Mangathai house, follow
    tracks into a forest, and find Varhan Tulai Hubun with a heavy wheel on his head
    and eight iron spikes in his body.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Albat and his brother seize seven young Mangathais and their mother, bind
    them, and remove the wheel and spikes from Varhan.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nearby is a great broad level-topped mountain, a place where four roads cross,
    and eight immense larch trees stand at the crossing.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The young Mangathais and their mother are brought to the cross-roads, tied
    to larch trees with strong hair ropes, and nailed by heads, feet, and hands to
    the tree trunks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A barrel, a blunt knife, and dull scissors are placed by each Mangathai, and
    written words command every passer-by to cut flesh from each body, with women
    using scissors and men using knives, under threat of being nailed to a tree.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Mangathai woman and her seven sons are left at the cross-roads; the Mangathai
    house is turned bottom upward, its possessions are taken, and the party goes home
    and lives rejoicing.
  category: sequence
  evidence_refs:
  - ev:8
