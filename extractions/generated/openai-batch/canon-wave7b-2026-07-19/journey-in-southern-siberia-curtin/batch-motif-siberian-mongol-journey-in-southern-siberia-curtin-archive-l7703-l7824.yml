canonical_text:
  quote: ''
  summary: The Iron Hero finds a book inside his liver that foretells his marriage
    to the daughter of the eldest of seven noble Dongins. He prepares for a southwestward
    bride quest by transforming and storing his horse, condensing food and drink,
    and traveling in an iron car. He reaches an untouched bronze-and-silver square
    with a dark spring and declares it a future settlement. He then encounters and
    kills a twenty-five-headed Mangathai, infiltrates an iron yurta to kill a hundred-and-eight-headed
    Mangathai, desolates and conceals the place, performs a fire-and-smoke invocation
    to the Burkans, and continues until a fifty-headed Mangathai confronts him for
    killing his father and younger brother.
  language: English
  quote_policy: summarized
