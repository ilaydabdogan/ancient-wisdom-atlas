  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In 1584 Yermak sailed up the Irtish to subdue tribes, collect tribute, and
    seek Karacha, who escaped him.
  category: action
  evidence_refs:
  - ev:3
