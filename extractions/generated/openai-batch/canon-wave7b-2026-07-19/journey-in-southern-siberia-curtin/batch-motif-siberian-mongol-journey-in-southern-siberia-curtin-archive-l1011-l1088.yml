canonical_text:
  quote: ''
  summary: 'The passage narrates a sequence of late-sixteenth-century Siberian campaigns:
    Karacha deceives Yermak into sending Koltso and forty Cossacks, who are killed;
    Moscow officials arrive and suffer famine; Karacha besieges Sibir but is defeated;
    Yermak makes a final river expedition, is ambushed on a stormy night at an island,
    and dies or drowns; his body is later found by a fisherman. Russian forces temporarily
    abandon Sibir, rival local claimants enter, and Moscow sends further commanders
    who build fortifications and found Tiumen and Tobolsk.'
  language: English
  quote_policy: summarized
