canonical_text:
  quote: ''
  summary: Two brothers learn that Todai Bain Khan has been defeated by Yellow Dog,
    who demands the khan's daughters and consumes people and cattle. The brothers
    kill Yellow Dog by rolling red-hot round stones into his enormous mouth, restore
    the victims, receive Todai's daughters in marriage, punish former enemies on the
    return journey, recover sky-returned steeds, pray to the Heavenly Burkans, travel
    to White Mountain for Water of Life and red larch bark, and use them to revive
    the exhausted eagle Khan Herdik Shubun.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two brothers sit on a mountain-top and learn by magic that the people
    and cattle belong to Todai Bain Khan, who has been conquered after a three-year
    war with Yellow Dog.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Todai Bain Khan has two daughters, Altan Hurubshe and Mungun Hurubshe, and
    Yellow Dog demanded them after defeating Todai.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The brothers heat two huge round stones and plan to roll them into Yellow
    Dog's open mouth at sunrise.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yellow Dog is described as having jaws so large that the upper one touches
    the clouds and the lower one grazes the earth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: At sunrise Yellow Dog rushes with open mouth; the brothers roll the hot stones
    into his mouth, and he falls dead between mountains.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The brothers remove bullocks from pots and men from spits, including half-roasted
    and half-alive victims, and bring them to sound health.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Todai Bain Khan greets the brothers, feasts them for nine days, offers a reward,
    gives them his two daughters, and holds a nine-day wedding.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:8
  text: On the road home the brothers seize Dainjin the Mangathai, chain him, hang
    him face downward over a fire, and he dies.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Near their birthplace the brothers meet a woman with one eye, one hand, and
    one foot; she asks about Huragin and Isbegin, hears a false report of their deaths,
    and dies before them.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The brothers seize the false uncle and his family, take them to a place where
    three roads meet, nail them to seven pines, and set out instructions for passersby
    to cut flesh from them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Two steeds that had gone to the sky return from the west with riding equipment;
    the brothers pray three days and nights to the Heavenly Burkans and ride away.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The brothers travel beyond thirteen lands to the northwest to Sehir Mai, the
    White Mountain, where they take bark from the red restoring larch tree and water
    from the healing Water of Life.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Khan Herdik Shubun, the eagle, has flown for three years up the mountain and
    lies exhausted on the mountainside.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: The brothers sprinkle the eagle with Water of Life mixed with larch bark;
    he revives, circles three times, and flies to the mountain-top and higher.
  category: sequence
  evidence_refs:
  - ev:14
