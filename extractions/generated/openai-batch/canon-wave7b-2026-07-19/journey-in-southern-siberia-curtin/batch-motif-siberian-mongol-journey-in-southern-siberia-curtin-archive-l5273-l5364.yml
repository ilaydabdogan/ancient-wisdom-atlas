canonical_text:
  quote: ''
  summary: 'The passage lists Buryat traditions about shamanic powers: ascent by rainbow,
    animal transformation, intimidation of a Lama, bodily feats without injury, summoning
    of drink and birds, fire and hot-iron immunity, passage through barriers, protection
    during Russian tests, and the stated ritual duties and limits of a shaman.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fragment mentions a great birch tree outside and says this was called walking
    on the rainbow; the passage then introduces traditions about the power of shamans.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two shamans go to heaven on a real rainbow; the Heavenly Burkans become angry
    and cut the rainbow; the stronger shaman changes into a yellow, spotted eagle
    and carries his companion safely to earth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Badai changes into a gray wolf at night and goes to a house where a visiting
    Lama sees him; the wolf is invisible to others, remains until daylight, and the
    Lama leaves Usturdi that day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some shamans are said to cut open their stomachs, remove, roast, and eat their
    livers, close the wound, and be well; others thrust a haribo stick above an eye
    and leave no visible wound.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some shamans are said to remove a man's head and restore it; some stab the
    central pillar of a yurta so that tarasun flows from it by command.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A shaman can call birds of heaven to sit on his shoulders, and worms appear
    on his hands and fingers for the birds to eat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Shamans dance naked on live coals without burned feet; a half-drunk Buriat
    imitator dances briefly on coals and is burned so badly that he cannot step for
    three months.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The seven Heavenly Blacksmiths give a shaman in Usturdi power over red-hot
    iron; the same shaman whispers, spits, and makes a locked door fly open.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Some shamans can ride on horseback through two walls of a yurta without leaving
    an opening.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: In Irkutsk, Russians test shamanic power with fire and gunfire; the Burkans
    turn the fire into water for the shaman, and the shamans catch bullets in their
    hands.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says a shaman has no role in marriages and no role in deaths after
    the spirit has irreversibly left; his field includes divination with a sheep shoulder-blade,
    sacrifice, preparing Ongons, tying a ribbon on an infant cradle, and conducting
    a child's one-year feast.
  category: relationship
  evidence_refs:
  - ev:11
