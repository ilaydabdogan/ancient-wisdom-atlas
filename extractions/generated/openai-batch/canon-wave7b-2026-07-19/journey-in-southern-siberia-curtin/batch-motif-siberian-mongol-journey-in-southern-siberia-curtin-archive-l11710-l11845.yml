canonical_text:
  quote: ''
  summary: Yerente summons and rides his red stallion to hunt. The stallion warns
    him that his wife Duryai has revived a Mangathai, hidden him in the yurta, and
    prepared poisoned tarasun. Yerente is poisoned but fights the Mangathai and Duryai
    for days until Duryai uses colored barley grains to strengthen the Mangathai and
    weaken him. Yerente is killed, sealed in an iron-hooped cask, and cast into the
    Black Sea. The red stallion rescues Yerente's son Sokto and daughter, carries
    them to a mountain with the Water of Life, and keeps them there for three years.
    The children later descend; Sokto reaches a silver-shining yurta occupied by a
    hundred-and-eight-headed Mangathai and his wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The old man Yerente owns a red stallion described as ninety fathoms long,
    pasturing in the mountains with thirteen wild deer.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yerente summons the red stallion by playing a flute, equips it with silk and
    silver horse gear, and goes hunting with bow and quiver.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the third hunting day Yerente kills many goats and loads fifteen on the
    red stallion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The red stallion stops on the return journey, speaks to Yerente, and says
    it stopped for a reason.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The stallion reports that Duryai has gone to Orhoy, raised the Mangathai to
    life, hidden him behind seventy-seven closed doors, and prepared poisoned tarasun
    for Yerente.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The stallion tells Yerente to release and unbridle it himself, not to let
    his wife touch the bridle, and not to drink what she gives him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Duryai meets Yerente at the yurta and offers to take the horse, but Yerente
    refuses and releases the stallion himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Duryai serves Yerente tarasun until he is drunk, then brings another pot;
    after drinking it he becomes senseless and poison comes out as blue and red flames
    from his mouth and nostrils.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Duryai calls the Mangathai out, saying Yerente is dead, but Yerente rises
    and fights both Duryai and the Mangathai for three days and nights.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Mangathai complains to Duryai that being raised is worse than lying dead
    in peace if he must suffer again.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Duryai throws blue barley grains at the Mangathai's feet while chanting, and
    he grows stronger.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Duryai throws red barley grains at Yerente's feet while chanting, and he grows
    weak and stumbles.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the fourth day the Mangathai chokes and kills Yerente.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Duryai and the Mangathai put Yerente's body in a cask with ninety-five iron
    hoops and roll it into the Hara Dalai, the Black Sea.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Mangathai says Yerente's son and daughter must be killed because they
    may avenge their father's death.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Duryai says she cannot kill her own children, and the Mangathai says he is
    too weakened by the fight to kill them immediately.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: In the night the red stallion enters the yurta, takes Yerente's son and daughter,
    and runs south to the flat top of a high mountain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Duryai and the Mangathai pursue, but cannot overtake the red stallion, and
    the stallion saves the two children.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: The top of the mountain has the Water of Life, and the stallion gives living
    water to the children from an iron horn found by the spring.
  category: object
  evidence_refs:
  - ev:11
- id: obs:20
  text: The red stallion keeps the children on the mountain for three years.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:21
  text: During the three years, summer rain from the north covers the stallion's right
    side with moss, while heat causes hair to fall from its left side.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:22
  text: After three years, the stallion says the children are large enough and takes
    them down to the valley.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:23
  text: The children wander hand in hand and come to an open place with eighty-five
    immense pine trees and a silver-shining yurta beyond them.
  category: setting
  evidence_refs:
  - ev:12
- id: obs:24
  text: Sokto makes a shelter for his sister near the pine trees and goes alone to
    the high silver yurta.
  category: action
  evidence_refs:
  - ev:12
- id: obs:25
  text: Inside the silver yurta Sokto sees a Mangathai with a hundred and eight heads
    and the Mangathai's very tall wife.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:26
  text: The hundred-and-eight-headed Mangathai asks where Sokto comes from and says
    he must be some khan's son.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:27
  text: Sokto says people say he is the son of Yerente Khan and was taken from his
    father when an infant.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:28
  text: The hundred-and-eight-headed Mangathai says Yerente was his great enemy and
    that he has need of Sokto.
  category: speech
  evidence_refs:
  - ev:13
