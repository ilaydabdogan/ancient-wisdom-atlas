candidate_motifs:
- id: motif:1
  label: Speaking horse helper warns of hidden treachery
  taxonomy_refs:
  - wisdom
  basis: The red stallion speaks, identifies the wife's hidden plot, and gives instructions
    meant to keep Yerente and the horse from harm.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents the horse's knowledge directly but does not explain
    its source.
- id: motif:2
  label: Revived monster ally of treacherous spouse
  taxonomy_refs:
  - resurrection
  basis: Duryai raises the Mangathai to life and brings him to the yurta as part of
    a plot against Yerente.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: Only the Mangathai's revival is described; no ritual details for the resurrection
    are given.
- id: motif:3
  label: Poisoned hospitality drink
  taxonomy_refs: []
  basis: Duryai welcomes Yerente home and serves tarasun until he is drunk, then gives
    the poisoned pot that makes him senseless.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage identifies tarasun and poison but does not frame the event
    as a formal ritual.
- id: motif:4
  label: Colored grains alter strength in combat
  taxonomy_refs: []
  basis: Duryai chants and throws blue barley grains to strengthen the Mangathai,
    then red grains to weaken Yerente.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explain the color symbolism beyond the immediate
    effects.
- id: motif:5
  label: Slain father sealed and cast into water
  taxonomy_refs: []
  basis: After Yerente is killed, his body is enclosed in a cask with ninety-five
    iron hoops and rolled into the Hara Dalai.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No later recovery or return of Yerente occurs within this passage.
- id: motif:6
  label: Threatened children rescued by animal protector
  taxonomy_refs:
  - departure
  basis: The Mangathai wants the children killed as future avengers, but the red stallion
    removes them from the yurta and carries them away.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The children are rescued rather than abducted by an enemy; the text says
    the horse saves them.
- id: motif:7
  label: Mountain refuge with Water of Life
  taxonomy_refs:
  - ascent
  - miraculous_child
  basis: The horse takes the children to a high mountain where the Water of Life is
    found and sustains them there for three years.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The children are not described as being born miraculously; the motif link
    rests on their protected survival and growth.
- id: motif:8
  label: Orphaned khan's son enters monster household
  taxonomy_refs:
  - royal_legitimacy
  basis: Sokto identifies himself as Yerente Khan's son, and a multi-headed Mangathai
    recognizes Yerente as his great enemy.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The passage ends before showing the outcome of Sokto's encounter.
