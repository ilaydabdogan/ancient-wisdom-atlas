canonical_text:
  quote: ''
  summary: 'The passage recounts Muscovite and Siberian political conflicts: claims
    over Yugria and Sibir, conquest and tribute, Stroganoff land grants for frontier
    defense, Kuchum''s seizure of Sibir and later oath to Ivan, Mahmet Kul''s resistance,
    and an order to capture Yermak and other atamans.'
