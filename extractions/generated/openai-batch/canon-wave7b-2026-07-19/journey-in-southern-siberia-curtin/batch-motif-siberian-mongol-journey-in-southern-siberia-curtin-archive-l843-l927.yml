literal_observations:
- id: obs:1
  text: Vassili Skryaba was commanded to subject Yugria; Kalpak and Tekich were brought
    to Moscow, had their titles confirmed, and were assigned tribute, after which
    Ivan added Yugorski to his titles.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Northern Yugria did not accept subjection; later commanders including Prince
    Kurbski conquered it, capturing towns, people, and princes or elders.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Vassili, son of Ivan Veliki, divided northern Yugria into named regions and
    added Obdorski and Kondinski titles; the southern region later became known as
    Sibir from the native khans' capital.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ivan the Terrible used the title “Commander of all Sibir” in a letter to Edward
    VI of England.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Grigori and Yakov Stroganoff received tax-free land grants on river territories
    in return for building stockades and maintaining troops at their own expense.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kuchum captured Sibir, killed Ediger and Bekbulat, called himself Tsar of
    Sibir, subdued northern tribes, and refused to pay tribute to Moscow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kuchum later sent envoys with tribute and a request to become the Tsar's subject;
    because the first envoys could not sign, Chabukoff was sent so that Kuchum and
    his chief men could take the oath and seal the papers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Mahmet Kul opposed his people's submission to Russians, attacked those willing
    to pay tribute, captured wives and children, assaulted Chabukoff, and then fled
    when troops were preparing to attack him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Stroganoffs were authorized to build posts, use guns and cannon, enlist
    men, suppress uprisings, establish works and fisheries, cultivate land, protect
    native tribes, and bring Kuchum and his subjects to obedience.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Ivan Grozney ordered Yermak and four other atamans captured in irons for punishment;
    some robbers or Cossacks were captured and hanged, while most scattered.
  category: action
  evidence_refs:
  - ev:10
