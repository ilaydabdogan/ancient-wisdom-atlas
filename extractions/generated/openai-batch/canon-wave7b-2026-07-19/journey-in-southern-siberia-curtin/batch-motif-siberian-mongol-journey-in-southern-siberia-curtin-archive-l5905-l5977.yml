canonical_text:
  quote: ''
  summary: Esege Malan discovers a breach in his sky fortress. A wise, footless figure
    explains that Esege's four sons have caused trouble on earth and that human prayers,
    blood, and tears have risen to weaken the fortress. Esege sends his grandson Gesir
    Bogdo to earth in bird form. After flies and maggots cleanse the earth of dead
    flesh, Gesir becomes a blue bull and fights a brother who becomes a pied bull.
    Gesir becomes a stone bull beyond the Altai, then his spirit returns and creates
    heroes to fight northern enemies. A later marriage pacifies the family. The passage
    closes with a cattle-seeking dawn rite to Solobung Yubiin, the Morning Star.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Esege Malan, after ceasing to rule, builds a splendid fortress around the
    sky and finds a broken place in it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A meeting is formed with one Tengeri from each of the ninety-nine heavenly
    Tengeri provinces, but they cannot identify the cause of the breach.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Zarya Azergesha is described as wise and footless, and he refuses to attend
    because he fears being laughed at.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Esege Malan sends two invisible Shalmos to hear what Zarya Azergesha says
    when alone.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Zarya Azergesha says that Esege Malan's four sons went to earth, caused trouble,
    and that people's prayers, libations, blood, and tears rose toward heaven and
    weakened the fortress walls.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the Shalmos report Zarya's words, Esege Malan sends his grandson Gesir
    Bogdo to earth as a bird; Gesir flies for three years without landing because
    of the odor of dead bodies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Esege Malan sends flies; the flies create maggots, and the maggots eat dead
    flesh and purify the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The bird alights on the Urundashei steppe, turns into a blue bull, and bellows
    a challenge.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: One of the four brothers hears the bellow, turns into a pied bull, fights
    the blue bull, and tosses him beyond the Altai mountains.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The blue bull turns into stone; the pied bull breaks one horn against him
    and declares future enmity toward all horned cattle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The stone bull remains beyond the Altai, while Gesir Bogdo's spirit returns
    to Esege Malan and creates heroes to fight Mangathais, evil animals, and northern
    serpents.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Irgi Siiban or Irgi Suban marries Shandu Buqu Besbesh, a grandson of Irlik
    Nomun, and the family of Esege Malan is pacified.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Buriats who want many cattle sacrifice a ram at dawn, pray to Solobung Yubiin,
    and dance until daybreak for three successive nights.
  category: action
  evidence_refs:
  - ev:9
