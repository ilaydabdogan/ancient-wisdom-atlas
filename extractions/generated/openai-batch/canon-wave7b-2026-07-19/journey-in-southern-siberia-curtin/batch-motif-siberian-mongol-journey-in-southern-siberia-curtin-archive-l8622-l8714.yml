canonical_text:
  quote: ''
  summary: Ashir Bogdo transforms his horse into flint and himself into a black stone,
    enters the Mangathai's mouth, kills the Mangathai from within with weapons requested
    from Esege Malan, and frees three hundred and seventy-five people found alive
    inside a serpent within the monster. He then goes to the house of his Tengeri
    father-in-law, proves himself through an exchange of book-reading, marries the
    Tengeri's daughter after feasting in the sky, receives gifts, and returns with
    his bride in raven form to Gesir Bogdo's yurta for another feast.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ashir changes his horse into a flint chip and himself into a black stone as
    large as a stallion; the stone rolls into the Mangathai's mouth and onto his tongue.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ashir's stone hands and arms lodge in the Mangathai's throat so that the Mangathai
    can neither swallow nor spit him out; the Mangathai suffers and runs for seven
    days and seven nights.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mangathai identifies the stone as Ashir Bogdo and says Ashir is the only
    one who can beat him; he asks either to be killed or released.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the tenth day the stone has worn through the Mangathai's tongue; Ashir
    asks Esege Malan for weapons, receives them, cuts the Mangathai's lungs, and kills
    him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the Mangathai dies, Ashir takes the Mangathai's fifty-foot-wide axe
    and cuts off all his heads and cuts out his ribs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A serpent emerges from inside the Mangathai; Ashir cuts it open and finds
    three hundred and seventy-five people alive inside, with fires and cooking food.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The people found inside the serpent say they have lived there a long time,
    without spring, summer, autumn, or winter; they praise Ashir for rescuing them
    and bless his undertakings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ashir tells the rescued people to return to their former lands and says he
    has fought the Mangathai and his kin for many years while setting out to find
    his bride.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ashir kills the Mangathai's horse, mounts his own steed, and reaches the house
    of his father-in-law, one of the great Tengeri.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Tengeri asks why an earth creature has come; Ashir says he has come for
    the Tengeri's daughter. The Tengeri reads Ashir's book for three days, and Ashir
    reads the Tengeri's book for fifteen days before being allowed to see the bride.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bride questions Ashir, objects to the bad odor of earth, reads Ashir's
    book, embraces him, and says she had not been sure it was he.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Tengeri assembles the people of the sky for the wedding, and they feast
    for nine days and nights.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Before departure the bride receives from her father a gray steed ninety fathoms
    long and a silver goblet that neither sinks nor moves with the current when thrown
    into a river.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Ashir and his bride turn their horses into pieces of flint, make the presents
    small, become ravens, fly down to Gesir Bogdo's yurta, resume their own shapes,
    restore their horses and presents, and join a nine-day-and-nine-night feast assembled
    by Gesir Bogdo.
  category: sequence
  evidence_refs:
  - ev:10
