canonical_text:
  quote: ''
  summary: 'The passage describes Buriat ceremonies after childbirth: summoning a
    midwife, cutting the umbilical cord, washing and wrapping the infant, communal
    animal killing and libations to the gods, a second-day cradle and naming rite
    involving a reserved leg bone and a sex-matched child respondent, third-day distribution
    of meat if the father is wealthy, and the beginning of placenta burial near the
    mother''s bed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Just before childbirth, a receiving mother or midwife is summoned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: As soon as the child is born, the father cuts the umbilical cord with a broad
    arrow-head.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The infant is washed in warm water, wrapped in a lamb skin, and placed in
    the father's fur coat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Friends and neighbors assemble; a cow or sheep is killed and its meat cooked.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man accustomed to performing such ceremonies makes libations of meat and
    tarasun to the gods while asking for many children and increased flocks for the
    master of the house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The lower leg bone of the killed animal is reserved, boiled, stripped of meat
    on the second day, and tied to the outside right-hand side of the child's cradle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A child of the same sex as the baby stands by the cradle to answer questions
    and give the baby a name.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the example of a boy baby, the receiving mother asks three times whether
    to rock the child or the bone, and the boy answers that the child should be rocked.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The receiving mother asks three times whether to rock up or down, and the
    boy answers, “Up.”
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The baby is put into the cradle and tied in.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The receiving mother asks the child's name, and the boy repeats the name selected
    by the parents.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: On the third day, if the father is well-to-do, a second animal is killed and
    divided among distinguished villagers who were not present for the birth and naming
    ceremonies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the third day, the tomta or placenta is buried; two planks are removed
    from the floor near the mother's bed and a hole is dug.
  category: action
  evidence_refs:
  - ev:8
