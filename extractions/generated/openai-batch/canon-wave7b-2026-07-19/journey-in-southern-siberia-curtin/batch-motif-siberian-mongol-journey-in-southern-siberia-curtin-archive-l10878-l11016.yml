canonical_text:
  quote: ''
  summary: In the tale of Altin Shagoy, an elderly couple settle near a mountain and
    have a prodigious son with a gold-and-silver body. Unable to feed him, they abandon
    him on a mountain, where he appeals to the Heavenly Burkans and receives a yurta,
    people, herds, and later a prophetic book naming him as a future khan. He rescues
    his parents after a second, devouring child is born, and the sister is quieted
    by naming and cradle rites. Altin then journeys to Tiphen Ulan Hada, shapeshifts
    into a falcon and reed, finds a golden-and-silver aspen and the Water of Life,
    and seizes the bridle of his destined horse.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A seventy-year-old man and a sixty-year-old woman come to a forest at the
    foot of a mountain, clear a space, and build a yurta.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old woman gives birth to a son who is described as silver below the waist
    and gold above it.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy grows so quickly that sheep skins of increasing ages are too small
    for him within a few days.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The parents have only one cow and complain that the boy consumes too much
    milk.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At five days old, the boy speaks to his parents about their inability to nourish
    him and says a greater glutton may yet be given to them.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The parents decide to get rid of the boy; he asks that, if thrown out, he
    be taken far away to a mountain where he can ask the Heavenly Burkans for food.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The father leaves the child on the summit of a lofty mountain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The abandoned child cries, addresses the thousand Heavenly Burkans, and asks
    for food, clothing, a horse, and an outfit.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The next morning the boy wakes in a strange yurta with many people, herds
    of horses, and cattle nearby.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The parents see a beautiful yurta on the mountain and wonder at its sudden
    appearance, but they do not go up or make an offering to the Burkans.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: After nine days and nights in the yurta, the boy finds a book as large as
    a common door that has fallen through the smoke-hole.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The book states that the boy will be a great khan, gives his name as Altin
    Shagoy, describes the lands under his power, and says his people and herds are
    well.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Altin's mother later gives birth to a daughter described as a real glutton
    and terrible eater; the parents kill their only cow to feed her and suffer hunger.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Altin sends ten bullocks to his father's yurta, helps prepare meat for his
    mother, and brings his father, mother, and sister to his own yurta.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Altin reads that his sister must be named and have a cradle; after a feast
    and naming ceremony, she becomes quiet and stops crying.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: When Altin is the size of a thirteen-year-old boy, he goes on foot to Tiphen
    Ulan Hada to find his steed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Unable to climb farther, Altin turns into a falcon and flies for three days
    to the mountain summit.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: On the summit stands a golden-trunked, silver-leafed aspen tree, and the Water
    of Life gushes at its foot.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:19
  text: Altin drinks water, turns into a reed, and waits for the horse.
  category: action
  evidence_refs:
  - ev:8
- id: obs:20
  text: At midday the horse comes to drink, bearing the whole outfit of a hero.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: The horse smells a human presence and says no man except his future master
    has the right to be there.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:22
  text: Altin resumes his own form, seizes the bridle, and is dragged by the frightened
    horse for a day and a night around the mountain.
  category: action
  evidence_refs:
  - ev:9
