canonical_text:
  quote: ''
  summary: Gesir Bogdo defeats eleven multi-headed Mangathais by having champions
    push them into a ditch and cover them with stones, then builds a yurta above the
    place and feasts. Ashir Bogdo travels west to seek Nalhan Taiji, reaches a boundary
    where autumn and spring meet, encounters another bride-seeking youth, kills and
    buries a seventy-seven-headed Mangathai, and later scouts a huge black brass-roofed
    house of a seven-hundred-headed Mangathai by shapeshifting into a woodchuck. Ashir
    then enlarges himself and his horse, challenges the Mangathai, and compels him
    to dig a pit; the episode is unfinished in the supplied passage.
  language: English
  quote_policy: summarized
