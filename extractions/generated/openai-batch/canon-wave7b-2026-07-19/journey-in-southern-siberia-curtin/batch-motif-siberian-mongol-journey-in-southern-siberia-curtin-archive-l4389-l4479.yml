canonical_text:
  quote: ''
  summary: The first-person traveler is told that Manshut has been found, retrieves
    him by wagon after a tarasun drinking episode involving a Shaman, and brings him
    to Usturdi. Manshut then tells folk-tales for four days while the narrator records
    them under difficult living conditions. The passage also includes the narrator's
    descriptions of Buriat food, tea, smoking, Russian-language knowledge, lack of
    schools, payment to Manshut, departure from Usturdi, and a stop at Kuda where
    a police official is present.
  language: English
  quote_policy: summarized
