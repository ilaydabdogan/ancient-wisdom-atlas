canonical_text:
  quote: ''
  summary: Sharau is imprisoned and sentenced to die after seven days. A cat and dog,
    repaying his earlier rescue of them, travel across the sea to recover a gold ring
    from his wife, who is living with another man. The cat coerces a mouse to retrieve
    the ring from the wife’s mouth while she sleeps. On the return journey the ring
    falls into the sea, but is found inside a fish. The animals return the ring to
    Sharau before the deadline. He uses it with ritual gestures to leave the dungeon,
    summon his wife and her lover, and the khan has them executed.
  language: English
  quote_policy: summarized
