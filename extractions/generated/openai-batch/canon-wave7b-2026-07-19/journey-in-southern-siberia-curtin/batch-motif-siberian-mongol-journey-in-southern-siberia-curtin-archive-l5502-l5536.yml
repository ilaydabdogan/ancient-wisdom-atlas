canonical_text:
  quote: ''
  summary: A Buriat ghost story tells of the shaman Gaqui Guldief, who sees dead men
    dancing at night on the Kanjirevsk steppes. After he shoots one of the dead dancers
    and the dancer falls as a skull, the dead threaten punishment. The next night
    a tall strong dead man and a crowd enter Gaqui's room, eat and drink from his
    table, debate harming him, decide not to because they have eaten his food, then
    disappear. The food and drink remain undiminished though the dead have eaten.
  language: English
  quote_policy: summarized
