canonical_text:
  quote: ''
  summary: Altin prepares to leave on a bride-seeking journey. He consults his people,
    appoints a learned young man as deputy, and exchanges life-sign objects with him.
    After a communal farewell Altin rides south alone on a speaking horse. At three
    roads he shoots a yellow fox that crosses before him. A heavenly hero, Tiyil Biige
    Tengeri, descends in vengeance because the fox was his daughter and cuts Altin
    in two, carrying the upper part to the sky. Altin’s horse grieves, becomes a falcon,
    and reports to its maker, Zayasha Zayan Tengeri. A council of heavenly Burkans
    judges Tiyil and orders him to retrieve Altin’s lower body. Altin’s sister comes
    to the sky and complains about her brother’s killing.
  language: English
  quote_policy: summarized
