canonical_text:
  quote: ''
  summary: The passage describes Buriat sacred groves associated with dead Shamans
    and with Bumal Burkans. A dead Shaman’s spirit appears as invisible fire to a
    living Shaman friend, requests settlement in a grove, and the dead Shaman’s ashes
    are placed in an aperture cut into a large tree. Such groves receive offerings
    and are protected by taboos against cutting trees, mowing grass, turning sod,
    or women entering. A parallel account describes Burkan groves with similar restrictions
    and offerings, including a story in which grass-cutting near a Burkan grove brings
    an epidemic until sacrifice appeases the deity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a Shaman dies, his spirit is described as going in the form of fire to
    a Shaman friend and striking him on the forehead so that he falls down.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The flame or spirit is said to be invisible to bystanders.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After recovering, the struck Shaman says that the dead friend’s spirit has
    come for assistance, wants to settle in a grove, and has indicated the grove’s
    location.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Friends go to the named place, select one of the largest and best trees, and
    cut a small box-like aperture in it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dead Shaman’s body is burned, the ashes are placed in the tree aperture,
    and a slab is fastened across it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the ashes are deposited, the grove is regarded as sacred, and later
    Shamans of the same family may also have their ashes placed there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Passing Buriats sprinkle vodka, tarasun, or tobacco to the spirits of Shamans
    whose ashes are in the grove.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that offerings sent to the spirits are supposed to reach
    them multiplied in quantity and improved in quality.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: In a sacred Shaman grove no tree may be cut down, grass mown, or sod turned,
    and injury to a tree is expected to bring punishment by the dead Shamans’ spirits.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women are prohibited from entering a sacred Shaman grove.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Bumal Burkans are described as Burkans whose homes are in certain groves rather
    than always in lofty places.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: In Bumal Burkan groves, trees, twigs, and grass are protected from felling,
    breaking, or cutting, and passersby make offerings of tarasun or tobacco.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Near Usturdi, several Buriats who had lost faith in the ancient religion decided
    to measure land and cut grass around a Bumal Burkan grove despite warnings from
    Shamans.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Burkan is said to have punished the attempted taking of his grass and
    curtailing of his domain by sending an epidemic on the village.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: After the land was abandoned and sacrifices were made to the Burkan, the deity
    was appeased and the epidemic ended.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Some Bumal Burkans allow women to pass through their groves, while others
    are strict about this matter.
  category: attribute
  evidence_refs:
  - ev:11
