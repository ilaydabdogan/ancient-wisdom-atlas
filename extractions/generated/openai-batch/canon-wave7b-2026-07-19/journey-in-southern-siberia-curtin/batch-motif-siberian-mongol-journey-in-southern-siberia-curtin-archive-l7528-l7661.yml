  evidence_refs:
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The animal helper is a steed supplied by divine figures; broader classification
    would need comparison outside this passage.
- id: motif:6
  label: ritual restoration with spring water and juniper smoke
  taxonomy_refs: []
  basis: Ashir gathers water from nine springs and juniper leaves, washes and incenses
    Gesir, and restores him perfectly.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: Gesir is restored, but the passage does not say he died; resurrection
