candidate_motifs:
- id: motif:1
  label: hero transformed into a horse and forced to labor
  taxonomy_refs:
  - shapeshifter
  basis: Gesir turns himself into a horse, Apha's spell binds that condition, and
    the Mangathai uses him to draw a plow.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage presents the transformation literally; the taxonomy reference
    is limited to the shapeshifting element, not to the forced-labor captivity as
    a whole.
- id: motif:2
  label: betraying spouse admits monstrous adversary
  taxonomy_refs: []
  basis: Apha summons the Mangathai, opens the door for him, gives him what he asks,
    and tells him how to use and confine Gesir.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not explicitly moralize Apha's action; the label summarizes
    her observed role in the episode.
- id: motif:3
  label: heavenly council sends a divinely made rescuer
  taxonomy_refs: []
  basis: Khan Tyurmas summons the Heavenly Burkans, who deliberate, commission an
    iron hero, give him a steed, and breathe life into him so he can free Gesir.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: high
  cautions: No exact available taxonomy family corresponds to the god-forged rescuer
