canonical_text:
  quote: ''
  summary: Gesir is magically kept in horse form and forced to plow for the hundred-and-nine-headed
    Mangathai after Apha summons the monster. Ashir seeks aid from Khan Tyurmas and
    the Heavenly Burkans, who create an Iron Hero and give him an all-hearing blue
    stallion. The Iron Hero and stallion free Gesir by killing the Mangathai. Ashir
    purifies and restores Gesir with water from nine springs and juniper smoke, and
    the Mangathai's body is sealed in an iron-hooped barrel and rolled into the Gazada
    Sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gesir consents because he is in love and turns himself into a horse to graze
    in a field.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apha chants that Gesir must remain a horse and draw a plow as long as the
    hundred-and-nine-headed Mangathai lives.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Apha summons the Mangathai, and her voice reaches him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Mangathai arrives at night riding a terrible black stallion, and Apha
    opens the door and admits him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Apha tells the Mangathai that Gesir is in the field and instructs him to plow
    with Gesir by day and keep him in an iron stable by night.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Mangathai plows all day with Gesir Bogdo as a horse and then locks him
    in the iron stable.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sangha Gohun and her son go to Red Mountain, where the son places her in a
    bark box under the raised mountain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The son turns himself into a falcon and flies to Khan Tyurmas, his grandfather.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Khan Tyurmas says he will summon the thousand Heavenly Burkans to assemble
    on Dolon Odun, identified in the passage as the Great Bear.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Nine months pass while the Mangathai lives in Gesir's yurta with Apha and
    forces Gesir to draw a plow every day.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Heavenly Burkans look down and see the Mangathai beating Gesir with a
    club while plowing with him as a horse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: After nine days of counsel, the Burkans decide to make an iron hero, and sky-smiths
    forge him for nine days while chanting protections against crushing, killing,
    and weapons.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Burkans give the Iron Hero the youngest of nine blue stallions, a steed
    that hears events on earth, in the sky, and above the sky.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: The thousand Burkans breathe into the Iron Hero and give him life.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ashir and the Iron Hero travel on the all-hearing steed to Red Mountain, where
    Ashir asks his mother about his father's weapons and armor.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Sangha Gohun tells Ashir where the weapons are and warns him not to go to
    the yurta because Apha would kill him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:17
  text: The Iron Hero offers the Mangathai the blue stallion as a stronger plow animal,
    and the Mangathai eventually harnesses it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: Gesir recognizes the Iron Hero as his brother, created by the Burkans, and
    weeps without letting the Mangathai see.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:19
  text: The blue stallion breaks the plow and drags the Mangathai in circles around
    the Iron Hero.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: The Iron Hero shoots arrows into the Mangathai's body and kills him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:21
  text: Ashir brings water from nine springs and dried juniper leaves, washes Gesir,
    incenses him with juniper smoke, and restores him perfectly.
  category: action
  evidence_refs:
  - ev:11
- id: obs:22
  text: The Mangathai's body is put in a barrel with ninety-five iron hoops and rolled
