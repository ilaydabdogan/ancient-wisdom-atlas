- id: motif:7
  label: monster's body sealed and cast into water
  taxonomy_refs: []
  basis: The Mangathai's body is put into a barrel with ninety-five iron hoops and
    rolled into the Gazada Sea.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage does not state why the body is sealed or whether this prevents
    return.
- id: motif:8
  label: falcon-form journey to obtain celestial aid
  taxonomy_refs:
  - ascent
  basis: Ashir turns into a falcon and flies to Khan Tyurmas, after which the Heavenly
    Burkans are summoned to Dolon Odun, the Great Bear.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage says Ashir flies to Khan Tyurmas but does not explicitly describe
    an upward ascent; the ascent taxonomy is tentative because the aid is heavenly
