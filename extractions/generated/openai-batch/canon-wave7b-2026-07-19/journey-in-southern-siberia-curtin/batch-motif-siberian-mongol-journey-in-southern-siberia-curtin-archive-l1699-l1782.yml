canonical_text:
  quote: ''
  summary: The narrator travels through a Buriat village past chained barking dogs
    and arrives at the enclosed summer residence of his host, Mihailoff. Inside, during
    the funeral day of the host's elder son, household members sit around the central
    hearth drinking milk-distilled liquor. The host explains that Buriat custom requires
    nine days of family seclusion and that he had sent a letter telling the narrator
    not to come, but the messenger missed him because the narrator took the right-hand
    road. Since the narrator arrived unwittingly and by prior invitation, the host
    takes him to another house, orders tea, and serves food and beef while drinking
    vodka.
  language: English
  quote_policy: summarized
