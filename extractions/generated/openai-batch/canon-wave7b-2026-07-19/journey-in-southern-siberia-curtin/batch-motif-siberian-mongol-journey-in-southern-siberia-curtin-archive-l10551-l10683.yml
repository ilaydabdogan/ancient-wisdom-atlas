candidate_motifs:
- id: motif:1
  label: rescue quest for captured household
  taxonomy_refs:
  - mystical_quest
  - departure
  basis: The hitching-post message says Varhan’s people are captives, and Varhan eats,
    drinks, and goes to rescue them through a dangerous route.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  confidence: medium
  cautions: The passage presents a rescue pursuit but does not explicitly frame it
    as a formal quest or initiation.
- id: motif:2
  label: hero and horse altered into humble disguise
  taxonomy_refs:
  - shapeshifter
  basis: Varhan makes his horse into a poor gray creature and himself into a miserable
    old man before speaking with the Mangathai.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The text does not explain whether the change is magical transformation,
    disguise, or another method.
- id: motif:3
  label: deceptive encounter with monster
  taxonomy_refs:
  - trickster_boundary
  basis: Varhan approaches the Mangathai in altered form, falsely identifies himself
    as a herdsman, and claims Varhan has already been killed.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage supports deception, but it does not label Varhan as a trickster.
- id: motif:4
  label: life hidden in birds inside a stone and box
  taxonomy_refs: []
  basis: The Mangathai gives Varhan a stone; inside it is a box with sixteen birds.
    After Varhan kills the remaining birds, he finds the Mangathai dead.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage implies a life-link between the birds and the Mangathai but
    does not explicitly define the birds as a soul or life-token.
- id: motif:5
  label: total destruction of monster’s remains
  taxonomy_refs: []
  basis: Varhan burns the Mangathai’s body, grinds the larger bones, turns all into
    ashes, and scatters the ashes everywhere.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No available taxonomy family exactly matches this literal destruction
    sequence.
- id: motif:6
  label: repeated killing and revival as punishment
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The Mangathai’s wife is killed, brought to life again, torn apart, restored
    again, and impaled a second time.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The deaths and revivals function as punishment rather than salvific resurrection.
- id: motif:7
  label: death-resistant monstrous child
  taxonomy_refs:
  - miraculous_child
  basis: The Mangathai’s infant son cannot be killed by being thrown into corners
    and is comfortable in a fire pit, playing with hot coals.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage does not describe the child’s birth; the taxonomy link rests
    on the child’s supernatural resistance.
- id: motif:8
  label: divine counsel for confinement and destruction
  taxonomy_refs:
  - wisdom
  basis: Varhan consults the thousand Burkans, who give chains and detailed instructions
    for chaining the child and using nested ice-packed houses during nine days of
    heat.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage reports counsel and instructions, but does not explicitly
    present a doctrinal wisdom teaching.
