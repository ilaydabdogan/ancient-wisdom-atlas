canonical_text:
  quote: ''
  summary: Varhan Tulai defeats a fool, returns home to find his household taken captive
    by a hundred-and-eight-headed Mangathai, disguises himself and his horse, deceives
    the Mangathai, destroys birds hidden inside a stone and box, frees captive kin,
    destroys the Mangathai’s body, repeatedly kills and revives the Mangathai’s wife
    as punishment, and seeks divine advice for killing the Mangathai’s fire-resistant
    infant son.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Varhan seizes the fool, throws him over seven mountain ranges, and the fool
    sinks eighty fathoms through the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Varhan returns to his hut by the spring, takes Shandagan Sagai and her property,
    and goes home.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At Varhan’s home, the yurta and cattle are gone; only one black raven, one
    yellow fox, and a hitching-post remain.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Words on the hitching-post say that provisions are buried beneath it and that
    Varhan’s people have been taken captive by a hundred-and-eight-headed Mangathai.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Varhan eats and drinks the hidden provisions and then goes to rescue his people.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Varhan travels past a bottomless swamp and a dense forest.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Beyond the forest, Varhan sees his brother’s stallion with one eye out and
    a broken leg.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: Varhan changes his own horse into a poor little gray creature and himself
    into a miserable starving old man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Varhan sees herds belonging to his brother and kills two wolves that run up
    to fight two dogs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Varhan meets four young men on red horses with iron whips and, by waving his
    whip three times, fetters the horses and ties the men to their saddles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: In disguise, Varhan tells the Mangathai that he is one of Tudai Khan’s herdsmen
    and that Varhan Tulai was killed by the perfect fool.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Mangathai spits out a big stone and gives it to the disguised Varhan as
    a protective object.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Varhan breaks the stone against a tree and finds a tin-covered box containing
    sixteen little birds; he kills thirteen and keeps three.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: In the Mangathai’s yurta, the Mangathai’s wife has Varhan’s brother on one
    knee and Deri Sisin, Albat’s wife, on the other.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: Varhan asks why the woman made his brother and his brother’s wife servants,
    then binds her with a horsehair rope.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: While going to the Mangathai, Varhan squeezes the three remaining birds to
    death and then finds the Mangathai dead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Varhan burns the Mangathai’s body, grinds the larger bones in a wooden mill,
    turns everything into ashes, and scatters the ashes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: Varhan impales the Mangathai’s wife, brings her back to life, has seventy
    horses tear her into seventy pieces, restores her again, and impales her once
    more.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: Varhan finds an infant son of the Mangathai in an iron cradle and cannot kill
    him by throwing him into three corners of the chamber.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:20
  text: The infant son of the Mangathai is thrown into a deep fire pit but says it
    is pleasant and plays with the hot coals.
  category: action
  evidence_refs:
  - ev:11
- id: obs:21
  text: Varhan consults the thousand Burkans, who give him four chains and instructions
    involving four trees, nested wooden, iron, and lead houses, ice packing, and nine
    days of dreadful heat.
  category: speech
  evidence_refs:
  - ev:12
