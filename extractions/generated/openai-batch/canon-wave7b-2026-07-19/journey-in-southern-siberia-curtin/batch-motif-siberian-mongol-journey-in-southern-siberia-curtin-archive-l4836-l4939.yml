canonical_text:
  quote: ''
  summary: 'The passage describes Buriat sickness rites: a shaman is summoned, burns
    a sheep shoulder-blade to identify which Burkan has been angered, and prescribes
    offerings or animal sacrifice. It details the sacrifice, including killing the
    animal, displaying its skin on a pole facing the Burkan''s mountain or dwelling
    place, offering and eating the meat, and an alternate method involving burned
    organs and bones in a bag on a pole. It also describes pain treatments, repeated
    sacrifices, sickness caused by light and dark Burkans, punishment for oaths or
    killing sacred birds, and sacred or punitive bird associations involving the white-headed
    eagle, swan, and vultures. Final supplied lines include non-narrative OCR/layout
    fragments.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When someone is sick, a shaman is sent for immediately.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The shaman burns a sheep shoulder-blade until it is white and reads the cracks
    to learn what the sick person has done to anger a Burkan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After identifying the Burkan associated with the sickness, the shaman determines
    what offering or sacrifice is needed for appeasement.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: A slight illness may require tarasun, while serious sickness requires tarasun
    plus an animal sacrifice.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Different Burkans require different sacrificial animals, including black or
    white rams, black or white goats, bulls, or horses.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The shaman kills the sacrificial animal by cutting into the breast and pulling
    out the heart.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The animal skin is fastened to a pole with the head facing the mountain, hill,
    or place believed to be the home of the Burkan causing the sickness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Pieces of cooked flesh are offered to the Burkan by throwing them into the
    air or burning them; the remainder is eaten by the family and helpers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: During the ceremony tarasun is used freely and the shaman murmurs words and
    prayers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: A second sacrificial method burns the liver, gall, and intestines, breaks
    the bones, and places remains in a bag on a pole until it rots and falls.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: For localized pain, the shaman applies spittle and prays to the Burkan; sometimes
    he touches the tongue with red-hot iron or pours hot water over the body.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: If the sick person does not recover after the first sacrifice, additional
    sacrifices may be made until recovery or death.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Both light and dark Burkans can cause sickness; sickness from a light Burkan
    is described as punishment for an oath or for killing a sacred bird.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Killing a sacred bird is said to be a great sin, and if the killer is not
    punished his children may be punished.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Berkut, the white-headed eagle, is sacred and is described as created and
    adopted as a son by Ejin, the god of Olkhon.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:16
  text: Ejin is described as a son of Fiery Heaven and as a brother of Dalai Lama,
    who is also a son of Fiery Heaven.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: The swan is called sacred; vultures are not sacred but are said to be sent
    by Burkans to locate people they are about to punish.
  category: relationship
  evidence_refs:
  - ev:10
