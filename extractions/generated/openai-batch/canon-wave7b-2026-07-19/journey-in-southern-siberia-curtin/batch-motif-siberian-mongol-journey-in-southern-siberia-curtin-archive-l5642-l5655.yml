canonical_text:
  quote: ''
  summary: The passage describes restrictions and rites connected with sacred groves
    of shamans. Women are barred from the groves and punished for stepping on the
    land. A sacred grove of Bumal Burkan may stand on a hilltop between villages near
    a road. After a death in one village, no one may pass the grove for three days;
    afterward the first man to pass must purify himself with smoke from burning dry
    juniper, and his horse must be purified in the same way.
