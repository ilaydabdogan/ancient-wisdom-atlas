canonical_text:
  quote: ''
  summary: Esh goes up to Esege Malan's sky dwelling. Esege's three daughters, who
    can become swans, laugh at Esh despite their father's warning that he is lame,
    hairy, and wise. Esh leaves angrily and descends to earth while two invisible
    Shalmos follow him for Esege. On earth, cattle and horses flee from him or from
    the named figure Zarya, and curses are pronounced explaining their later restraints
    and tack. Esh then complains that Esege gave away the sun and moon and reveals
    that Esege should ask Mother Earth for the hot dancing air of summer and echo,
    gifts she would grant but be unable to produce. The Shalmos report this. Esege
    visits Mother Earth, asks for those gifts, and when she cannot get them, declares
    that the sun and moon will remain in the sky while the hot dancing air and echo
    remain with Mother Earth.
  language: English
  quote_policy: summarized
