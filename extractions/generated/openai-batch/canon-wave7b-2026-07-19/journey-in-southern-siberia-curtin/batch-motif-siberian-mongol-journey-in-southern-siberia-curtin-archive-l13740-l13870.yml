canonical_text:
  quote: ''
  summary: Hodoy Shon Mergen Khan builds a splendid golden and silver yurta and a
    separate yurta for his beloved unnamed sister. A deceitful Mangathai mother tries
    to arrange the sister's marriage to her hundred-and-eight-headed son, then tricks
    the sister into eating a swelling plant and saying that only Yellow Dog's liver
    can cure her. Hodoy travels toward Yellow Dog's distant land, shapeshifting and
    relying on his red horse to cross a sky-touching mountain and other obstacles.
    Yellow Dog uses magic to draw Hodoy near, overcomes him, spares him because of
    their friendship, places him in a deep pit with living water, and sends Hodoy's
    belongings away on the horse for any children he may have.
  language: English
  quote_policy: summarized
