  locator: 13839-13847
  quote_or_summary: At Yellow Dog's boundary, Yellow Dog calls and draws them by magic;
    the horse plants its feet in the earth and resists.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; concise summary.
- id: ev:14
  type: summary
  locator: 13847-13852
  quote_or_summary: The drawing power tears at Hodoy's clothes; Hodoy rises to the
    sky, receives nails from seven sky smiths, and nails his skirts to the saddle.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; concise summary.
- id: ev:15
  type: summary
  locator: 13853-13860
  quote_or_summary: Yellow Dog howls; the nails are pulled out, forest trees fall,
    the horse can no longer resist, and Hodoy sees Yellow Dog's mouth with upper jaw
    at the sky and lower jaw on earth.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; concise summary.
- id: ev:16
  type: summary
  locator: 13860-13863
  quote_or_summary: Hodoy is pulled from the horse into Yellow Dog's mouth and braces
    himself by holding an upper tooth and pushing a lower tooth with his foot.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; concise summary.
- id: ev:17
  type: quote
  locator: 13864-13866
  quote_or_summary: '"We were friends, thou and I; for that reason I will leave thee
    alive."'
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; short quotation.
- id: ev:18
  type: summary
  locator: 13867-13872
  quote_or_summary: Yellow Dog places Hodoy in a deep pit, pours living water on him
    to keep him alive, tells him to remain until a son rescues him, and covers the
    pit with a heavy stone.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; concise summary.
- id: ev:19
  type: summary
  locator: 13873-13876
  quote_or_summary: Yellow Dog puts Hodoy's things on the horse and tells it to carry
    them to any sons or daughters of Hodoy.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; concise summary.
