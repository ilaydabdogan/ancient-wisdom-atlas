canonical_text:
  quote: ''
  summary: After Sokto is restored to youthful form, a khan makes the wedding conditional
    on obtaining Yellow Dog. Sokto consults his horse, ascends to the sky, receives
    heavenly smith-forged restraints, captures Yellow Dog near the Frozen Ocean, and
    brings him to the khan. Yellow Dog is fed, promises ten years of friendship, and
    returns home. Sokto marries and returns with his wife. Later Narin Huimer Hubun
    serves Sokto for three years in order to marry Sokto's sister, who receives a
    horse and leaves with him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The khan rejects men who cut up their own bodies as sons-in-law and drives
    them away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A feast lasting nine days and nights is held after Sokto is young and has
    his own form.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The khan says the wedding will occur only if Sokto gets Yellow Dog near Gazada
    Dalai.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bride tells Sokto that no hero can get Yellow Dog and that many who went
    for it did not return.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sokto says he will not go home but will make the trial for Yellow Dog despite
    not knowing whether he will die or return.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sokto consults his horse, and the horse tells him to go to the sky, speak
    to Esege Malan, and seek help from the seven heavenly smiths.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sokto makes his horse into a flint chip and goes to the sky as a gray falcon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Esege Malan orders seven smiths to make an immense neck-chain, heavy foot-fetters,
    and two iron mouth-hoops for Yellow Dog.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: From the sky Sokto sees Yellow Dog by the Frozen Ocean and throws the chain,
    fetters, and hoops with a conditional victory chant; the implements capture the
    dog.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Yellow Dog says no magic in the world had previously harmed him and identifies
    Sokto as a great hero able to bind him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The chain becomes looser, the fetters drop, and the hoops loosen; Sokto leads
    Yellow Dog to his father-in-law's yurta and ties him to the hitching-post.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The khan says such a dog is not needed and tells Sokto to take it back.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Yellow Dog asks to be fed, promises ten years of friendship and aid to Sokto,
    eats a whole ox, and returns to the edge of the Frozen Ocean.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: At Sokto's wedding, people feast nine days and nine nights, and the bride
    receives a very large bay horse with a silver saddle and silk housings.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: 'Sokto ties a large larch tree to his horse''s tail as a travel signal: a
    halt means smoking, and a circuit with the tree means a night camp.'
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Sokto reaches home in nine days, waits for the following company, and then
    hosts another feast for nine days and nights.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: Narin Huimer Hubun asks for Sokto's sister and says Esege Malan said he was
    to have her as wife; Sokto requires him to remain three years and help count people
    and herds.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:18
  text: After three years, Narin Huimer Hubun receives his own yurta and a wedding
    is held; ravens, magpies, and the whole world eat and are glad.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:19
  text: Sokto's sister asks for a present; Sokto gives her a trained bay horse and
    thanks her for caring for his yurta during his twelve years of struggle.
  category: sequence
  evidence_refs:
  - ev:14
