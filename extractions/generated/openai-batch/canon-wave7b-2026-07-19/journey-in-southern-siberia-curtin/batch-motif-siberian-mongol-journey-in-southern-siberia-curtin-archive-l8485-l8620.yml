canonical_text:
  quote: ''
  summary: Ashir Bogdo tricks and kills a Mangathai in a pit, then continues his journey
    and fights a three-hundred-headed Mangathai. Ashir discovers that this Mangathai’s
    life is kept by an aunt in the southeastern sky, transforms himself to reach her,
    kills her, and takes thirteen woodcocks from a golden box. Meanwhile the Mangathai
    impersonates Ashir and obtains Ashir’s life from Esege Malan, but Ehe Ureng Ibi
    exposes the deception; Hohodai destroys the Mangathai, and Shalmos retrieve Ashir’s
    life. Ashir crushes the woodcocks and then meets an even larger thousand-headed
    Mangathai whose breath draws him toward its mouth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ashir orders the Mangathai’s wife into a bucket, lowers her to measure the
    pit, has tools sent up, then raises the Mangathai almost to the top before cutting
    the rope so that the bucket falls and kills him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Mangathai’s wife says Ashir had planned the killing, had acted cunningly
    and kindly toward her, and that she might have fought and conquered him if she
    had remained above.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ashir fills the hole with immense stones, turns the iron yurta bottom upward,
    takes the Mangathai’s property, and sends it to his father’s yurta.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ashir meets a Mangathai with three hundred heads and thirty horns who says
    Ashir has killed his father and brother and promises repayment.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ashir and the three-hundred-headed Mangathai wrestle for twelve days and nights
    until their flesh is torn, while ravens from three directions call for flesh.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: During an archery contest setup on opposite mountains, Ashir kills two wild
    goats, roasts them by a fire, and the Mangathai attempts to use an eighty-fathom-broad
    axe, which Ashir’s magic power stops halfway.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ashir reads in his book and learns that the Mangathai was made by Galta Ulan
    Tengeri and that the Mangathai’s life is kept by an aunt in the southeastern sky.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ashir turns his horse into a flint, puts it in his pocket, turns himself into
    a falcon, and flies nine days and nights to the aunt’s house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The aunt lives in a white yurta, has one tooth and one eye, gives the false
    Mangathai her breast, and is killed after Ashir draws life from her.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ashir finds a golden box, breaks it open, finds thirteen woodcocks inside,
    catches them, and carries them away.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Mangathai disguises himself as Ashir, asks Esege Malan for strength and
    life, and receives Ashir’s life before Ehe Ureng Ibi identifies the deception
    by noting the eyes and directing Esege to look with a glass.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hohodai sends bloody rain, hail, and jagged lightning against the Mangathai,
    and two Shalmos turn into ravens to retrieve Ashir’s life for Esege Malan.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: After waiting on the mountain, Ashir crushes the thirteen woodcocks and meets
    a thousand-headed Mangathai whose main jaws reach from earth to sky and whose
    breath draws horse and rider toward its mouth.
  category: sequence
  evidence_refs:
  - ev:10
