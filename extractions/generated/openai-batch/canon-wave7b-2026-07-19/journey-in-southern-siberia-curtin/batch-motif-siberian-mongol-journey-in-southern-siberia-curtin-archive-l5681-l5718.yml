canonical_text:
  quote: ''
  summary: The passage describes Delquen Sagan Burkan, also called Esege Malan, as
    the highest being containing three spirits. It gives divine derivations from these
    spirits, names Sagade Ugugun's eldest son and daughter, describes prayers and
    sacrifices for cattle, grass, health, rain, crops, and children, and outlines
    a child-seeking yurt rite using tarasun, a hair rope, wooden playthings, a tall
    birch tree, swamp sods, and a prepared cradle. It also states which divine beings
    do and do not receive pictures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Delquen Sagan Burkan, World White God, is identified as the highest existence
    in the universe and is also called Esege Malan.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Three spirits are said to be in Delquen Sagan Burkan: Baronye Tabin Tabung
    Tengeri, Zum Dishin Dirltin Tengeri, and Sagade Ugugun.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The first spirit gives rise to fifty-five Tengeris, the second to forty-four
    Tengeris, and the third has seven sons and seven daughters.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Prayers and sacrifices are offered to the Heavenly Burkans and to the Highest
    Existence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: People ask the World White Burkan for cattle, grass, and health, and ask the
    three spirits, especially Sagade Ugugun, for rain, good crops, and children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: For a child request, people offer Sagade Ugugun twenty pots of tarasun, pray
    in the yurta, tie a hair rope around the four posts, and hang wooden rattles or
    playthings on the rope.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wooden playthings are said to persuade the child to come.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A tall birch tree is brought from the forest and placed in the middle of the
    yurta so that its top comes out through the smoke hole.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Three sods of earth from a swamp are placed at the roots of the birch tree.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Prayers are supposed to go up the birch tree to the Heavenly Burkans.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: After the offering and prayers, a cradle and its belongings are prepared for
    the coming new child.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: No pictures are made of the Highest Being or of the first and second spirits,
    while pictures are made of Sagade Ugugun, his wife, his eldest son, and his eldest
    daughter.
  category: attribute
  evidence_refs:
  - ev:6
