canonical_text:
  quote: ''
  summary: The passage describes a Buriat horse-sacrifice sequence in which horse
    flesh is cooked, small portions of meat and soup are offered on altar fires before
    fifteen stone altars, a collective invocation asks deities and spirits for prosperity
    and protection, the participants eat by families, vultures appear and are explained
    by Vassya in relation to narratives about Burkans, and the rite ends when boys
    burn planted family twigs and leftovers are handled under a taboo against dogs
    or cats eating them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iron kettles were set over briskly blazing fires while horse flesh was cooked.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men sat in groups along a hillslope from the highest altar down to the fifteenth
    altar near the foot of the eminence.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Groups sat near vessels of tarasun and drank from them while the meat cooked.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Small bits of cooked meat and soup from kettles were thrown onto the blazing
    altar fires where bones were burning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the flesh of the nine horses was ready, the company stood before fifteen
    altars, moved toward and away from them, and threw soup and meat on the fires
    while invoking deities.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The invocation asks for blessing, cattle, a son, rain, grass, grain, protection
    from wolves and sharp stones, favorable nearness of bright spirits and Burkans,
    and personal help such as courage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The invocation is said to be repeated by all, after which each person adds
    what seems good to him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the prayer, the company sat by families, ate horse flesh, and drank
    tarasun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: During the throwing of meat onto the altars, many vultures flew back and forth
    over the hill, swooped near, and caught pieces of meat thrown toward them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vassya said the vultures were not regarded as divine in the full sense, but
    that some narratives represent vultures as rushing before Burkans as they travel.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Vassya said the vultures might indicate that masters of the opposite mountain
    were present, either there or on the hill where the observers stood.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: After the eating and drinking, boys pulled up planted twigs or little branches
    from each family's designated place and threw them on the fire to indicate that
    the sacrifice had ended.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Remaining soup or meat was taken home or carefully burned; the passage says
    it must not be eaten by cats or dogs because that would be desecration followed
