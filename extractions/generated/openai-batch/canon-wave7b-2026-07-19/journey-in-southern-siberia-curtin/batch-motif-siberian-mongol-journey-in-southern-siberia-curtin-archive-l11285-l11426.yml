canonical_text:
  quote: ''
  summary: 'Altin is restored by heavenly smiths and the Burkans, then sent toward
    his father-in-law with instructions about a mountain, golden aspen, Water of Life,
    and wisdom-giving cuckoo. At Gal Nurman''s sky-reaching yurta, Altin passes seventy-seven
    iron doors to meet the destined bride, whose small book confirms the marriage.
    Gal Nurman then sets a bridegroom task: Altin must bring a yellow dog from a distant
    mountain. On the way, Altin reaches the Black Sea and finds three daughters of
    Khan Herdik Shubun threatened by Mogoi Khan, a two-headed being with a vulnerable
    moon-sized eye.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tiyil Biige takes Altin's two parts to the heavenly smiths, who work seven
    days and nights to bring him back to his right form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The heavenly smiths cannot restore Altin's breath; the thousand Burkans restore
    breath and start life anew in him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Altin commands his sister to go home, and she turns into a raven and flies
    to earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Burkans tell Altin that near his father-in-law's yurta, on a very high
    mountain, stands a golden aspen with Water of Life at its foot and a white cuckoo
    at its top.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The white cuckoo is said to know what is done and planned in the sky, to bring
    the dead to life, to give riches to poor people, and to possess immense wisdom.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Altin reaches the mountain by golden stairs, drinks the water, gives some
    to his horse, and eats silver aspen leaves that prevent hunger and cold.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Gal Nurman's yurta is described as a mile long, enormous, and so high that
    its roof touches the sky.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: Gal Nurman challenges Altin's uninvited arrival; Altin answers that Gal's
    daughter is to be his wife by decision of the Heavenly Burkans.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Altin kicks open seventy-seven strong iron doors and reaches a very beautiful
    maiden who shines like the sun by day and moon by night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The maiden reads a small book kept in her bosom and finds that she is to marry
    Altin Shagoy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Gal Nurman says Altin may take the daughter only if he brings back a yellow
    dog from a distant mountain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The bride warns that many bridegrooms have died trying to bring the yellow
    dog and says her magic can help Altin live without sleeping.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: 'At the Black Sea near a single great pine tree, Altin finds three beautiful
    maidens: one crying, one laughing, and one singing.'
  category: setting
  evidence_refs:
  - ev:9
- id: obs:14
  text: The maidens say they are daughters of Khan Herdik Shubun, whose wings were
    broken by Mogoi Khan after a three-year war.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The maidens say Mogoi Khan lives in the Black Sea, emerges with the sea roaring
    and raging, has two heads and one moon-sized eye, and can be killed by an arrow
    in that eye, though returning blood would kill the archer.
  category: speech
  evidence_refs:
  - ev:10
