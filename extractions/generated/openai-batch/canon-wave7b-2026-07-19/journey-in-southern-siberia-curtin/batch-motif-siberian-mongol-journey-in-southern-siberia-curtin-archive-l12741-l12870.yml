canonical_text:
  quote: ''
  summary: Alamaldjin Bogdo and his twin sister Hanhai are born to elderly parents.
    Alamaldjin grows rapidly, becomes wise and famous, builds an enormous silver-and-gold
    yurta, and is made khan. After his uncles report that some cattle suffer from
    poor pasture, he agrees to seek new pastures. He summons his extraordinary brown
    steed from Altai Deda, where the horse has lived with thirteen deer. The horse
    leaves a mass of hair as protection and comfort for the deer. Alamaldjin prepares
    the horse through three ordeals, equips himself, drinks worms to avoid needing
    food, and rides away. At the edge of the earth he reaches an immense iron building,
    disguises himself and the horse, breaks into the building, and encounters a hundred-and-fifty-headed
    Mangathai whose right eye is wounded by an arrow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Alamaldjin Bogdo and Hanhai are described as twins born in Iryil to a seventy-five-year-old
    father and a sixty-year-old mother.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the twins' birth, the father holds a three-day feast; an old man names
    the boy and an old woman names the girl, each receiving a marrow bone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Alamaldjin grows so large in ten days that the skin of a ten-year-old sheep
    is not big enough for him; at three years old he learns to reckon and says during
    play that he will be khan.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: At eleven, Alamaldjin has stone quarried and builds a vast yurta with a silver
    roof, thousands of windows, silver exterior, gold interior, and seventy-seven
    large chambers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At seventeen, Alamaldjin is described as wise and famous, and the people make
    him khan.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Alamaldjin asks his two uncles to count his herds; after counting, they find
    the front cattle thin and uneasy and the rear cattle fat and satisfied.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The uncles advise Alamaldjin to choose other pastures; when he initially refuses
    and the uncles threaten to hang themselves, he stops them and says he will search
    for new pastures.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Alamaldjin has a brown steed ninety fathoms long, with ears nine ells high,
    pasturing in Altai Deda with thirteen wild deer.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The uncles fail to bring the horse because they are frightened at the sight
    of him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Alamaldjin summons the horse by whistle; the thirteen deer want to accompany
    the horse though they fear loss, and they do not want him to leave the beautiful
    mountain place.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The horse tells the deer that if he perishes the water will dry and the grass
    will wither, but if he is well all will remain as it is.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The horse rolls, sheds a large mass of hair, and tells the deer to hide under
    it if enemies come and to smell it if they grieve for him.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Alamaldjin leaves the summoned horse tied for three days without food and
    only spring water, then three days on sand, then three days on ice as preparation.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Alamaldjin saddles the horse with silk and silver, dresses in elaborate clothing,
    takes a bow and ninety-five arrows, drinks worms so he will not need to eat for
    twenty-five days, and rides away.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Alamaldjin rides into another country and sees, at the edge of the earth,
    an immense iron building rising to the sky.
  category: setting
  evidence_refs:
  - ev:15
- id: obs:16
  text: Alamaldjin makes his horse small and wretched and makes himself old and wrinkled,
    appearing as a Shaman.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: Unable to find a door, Alamaldjin breaks into the southwest corner of the
    iron building.
  category: action
  evidence_refs:
  - ev:17
- id: obs:18
  text: Inside the building is a Mangathai with one hundred and fifty heads; the Mangathai
    challenges the intruder.
  category: attribute
  evidence_refs:
  - ev:18
- id: obs:19
  text: The Mangathai begins sharpening a very broad axe, but throws it aside after
    hearing the intruder is a Shaman; his right eye has been injured by an arrow.
  category: sequence
  evidence_refs:
  - ev:19
