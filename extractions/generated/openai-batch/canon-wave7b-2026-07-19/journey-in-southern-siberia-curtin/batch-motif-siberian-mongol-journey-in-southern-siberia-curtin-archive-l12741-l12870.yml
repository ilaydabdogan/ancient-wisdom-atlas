candidate_motifs:
- id: motif:1
  label: twin sibling birth
  taxonomy_refs:
  - sacred_twins
  - sibling_pair
  basis: The passage identifies Alamaldjin and Hanhai as twin siblings born together
    and separately named after birth.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not describe Hanhai's later actions in this excerpt,
    so the twin motif is present mainly at birth and naming.
- id: motif:2
  label: miraculous or precocious child destined for rule
  taxonomy_refs:
  - miraculous_child
  - royal_legitimacy
  basis: Alamaldjin grows beyond ordinary scale, learns reckoning at three, says he
    will be khan, and is made khan at seventeen because he is wise and famous.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage states extraordinary growth and precocity but does not explicitly
    call the birth divine.
- id: motif:3
  label: monumental royal dwelling as sign of splendor
  taxonomy_refs:
  - royal_legitimacy
  basis: At eleven, Alamaldjin builds a vast silver-and-gold yurta with many windows
    and chambers, and later lives in splendor with cattle, people, and fine roads.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The dwelling supports royal status in the narrative, but no explicit coronation
    ritual is attached to the building.
- id: motif:4
  label: quest departure to remedy failing pasture
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: After the uncles report suffering cattle and advise new pasture, Alamaldjin
    agrees to search for new pastures and rides into another country.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:14
  - ev:15
  confidence: high
  cautions: The stated goal is practical herding need; the later encounter at the
    edge of the earth gives it a broader quest-like shape.
- id: motif:5
  label: supernormal horse companion summoned from a remote mountain place
  taxonomy_refs: []
  basis: Alamaldjin owns an enormous steed pasturing in Altai Deda; the horse comes
    at his whistle after living with thirteen deer.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: high
  cautions: No available taxonomy reference directly names the supernatural steed
