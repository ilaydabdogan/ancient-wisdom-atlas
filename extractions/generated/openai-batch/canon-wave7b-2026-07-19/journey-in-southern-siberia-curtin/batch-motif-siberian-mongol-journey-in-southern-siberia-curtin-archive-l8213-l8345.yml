candidate_motifs:
- id: motif:1
  label: brothers revealed during combat
  taxonomy_refs:
  - sibling_pair
  basis: The two combatants wrestle violently until the Burkans send a written message
    saying they are brothers, after which they reconcile.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage identifies brotherhood explicitly, but does not provide their
    earlier origin beyond creation by the Burkans.
- id: motif:2
  label: divinely disclosed kinship
  taxonomy_refs:
  - divine_parent_child
  - sibling_pair
  basis: The Heavenly Burkans say they made both fighters and send a message identifying
    them as brothers.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The Burkans are described as makers rather than biological parents; the
    divine-parent-child taxonomy is therefore only partially supported.
- id: motif:3
  label: disguised hero avoids lethal or impossible bride tests
  taxonomy_refs:
  - shapeshifter
  - initiation
  basis: The Iron Hero says he came as an old man because the khan would have killed
    him or given impossible tasks if he came as a young man; the bride says she made
    difficulties to test him.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage supports disguise and testing, but does not describe all earlier
    tests within this line range.
- id: motif:4
  label: testing bride controls obstacles for the suitor
  taxonomy_refs:
  - divine_beloved
  - initiation
  basis: The bride says she created many of the difficulties to test whether the Iron
    Hero could overcome them.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The bride is not explicitly called divine in this passage, though her
    radiance and hidden knowledge are emphasized.
- id: motif:5
  label: healing through restoration of torn body part
  taxonomy_refs:
  - death_rebirth
  basis: Each fighter pulls out a rib; after reconciliation, each returns the other's
    rib, replaces it, and both become well.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The episode involves severe injury and restoration rather than actual
    death and rebirth.
- id: motif:6
  label: radiant bride associated with sun and moon imagery
