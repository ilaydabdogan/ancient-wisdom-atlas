canonical_text:
  quote: ''
  summary: Milen Buhe confronts the old-man form of the Iron Hero after the khan promises
    his daughter if the old man is killed. The two wrestle until each pulls out the
    other's rib. The Heavenly Burkans send a written message revealing that they are
    brothers, after which the fighters restore each other's ribs and reconcile. Milen
    Buhe presents the Iron Hero to the khan, and the khan gives his daughter to him.
    The bride reveals that she created many tests for the Iron Hero, and a wedding
    feast follows. The bride receives several magical gifts from her mother and uncles.
    The Iron Hero then leads the company toward his home, marking the road with a
    larch tree, and all drink from the Water of Life and Youth on Red Mountain before
    descending by a road known only to the bride.
  language: English
  quote_policy: summarized
