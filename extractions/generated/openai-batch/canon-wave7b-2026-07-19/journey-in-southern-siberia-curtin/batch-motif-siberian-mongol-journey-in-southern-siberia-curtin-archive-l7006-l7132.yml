canonical_text:
  quote: ''
  summary: Gesir is aided by nine heavenly sons who destroy a Mangathai with lightning.
    A young Mangathai arrives and challenges Gesir. After wrestling without victory,
    the two learn by magic where each other's lives are kept outside their bodies.
    Gesir retrieves a life-bearing feather from a sacred bird on a remote mountain
    tree, wounds and is wounded by the Mangathai, then impersonates the Mangathai
    to obtain the second life from the Mangathai's grandmother at the Milk Sea. The
    life-bearing woodcocks escape from a box; Gesir kills most of them, while one
    becomes millet whose grains each hold the Mangathai's second life.
  language: English
  quote_policy: summarized
