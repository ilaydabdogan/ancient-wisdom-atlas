canonical_text:
  quote: ''
  summary: 'The passage describes Buriat funerary customs: the deceased is dressed,
    the face covered, work is avoided on the death day, the body is kept briefly before
    burial or burning, and grave goods, money, meat, tarasun, and personal articles
    are placed in the coffin. Family and friends share meat and tarasun, pour drink
    for the dead by name, and serve refreshments for three days because the spirit
    remains among them and partakes. The spirit is described as body-shaped but invisible
    except to those with second sight; it sadly tests whether it still has material
    form by seeking footprints in ashes, provoking a dog to bark, and taking the spirit
    of a cup unnoticed during tea.'
  language: English
  quote_policy: summarized
