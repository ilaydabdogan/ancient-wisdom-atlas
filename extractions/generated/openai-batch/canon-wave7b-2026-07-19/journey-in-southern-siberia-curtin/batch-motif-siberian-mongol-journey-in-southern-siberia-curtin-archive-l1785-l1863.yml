canonical_text:
  quote: ''
  summary: After a meal and tea, Mihailoff becomes warmly disposed toward the narrator,
    offers lodging at his son's house in Usturdi, and shows him private household
    gods kept in the yurta. The narrator then travels toward Usturdi with an intoxicated
    driver whose horses rear, plunge forward at high speed, cross a shallow river,
    and are described through a simile of metamorphosed men pursued by vengeance.
    The party reaches Usturdi, passes a church and bridge, and waits at the fenced
    gate of Vassili's house until Vassili opens it after learning of the father's
    letter.
  language: English
  quote_policy: summarized
