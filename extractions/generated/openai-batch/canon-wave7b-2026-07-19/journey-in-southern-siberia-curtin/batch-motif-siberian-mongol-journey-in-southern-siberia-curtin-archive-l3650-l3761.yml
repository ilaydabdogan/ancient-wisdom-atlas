canonical_text:
  quote: ''
  summary: The narrator describes a stay on Olkhon, efforts to find people who know
    Buriat religion, customs, and old lore, failure to obtain useful information,
    expulsion from a prayer house by a Russian caretaker, hospitality from a young
    Buriat couple, recollections that earlier generations knew more, departure from
    Seven Pines, crossing the Baikal, and subsequent mainland travel.
  language: English
  quote_policy: summarized
