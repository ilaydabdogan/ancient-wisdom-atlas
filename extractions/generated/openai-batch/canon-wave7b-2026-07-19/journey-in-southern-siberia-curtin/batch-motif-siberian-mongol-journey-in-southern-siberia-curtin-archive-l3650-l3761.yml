- id: obs:1
  text: After arriving on Olkhon, the narrator seeks information about local religion
    and customs; the golovar of Kutul returns to the mainland after sending for a
    knowledgeable man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The expected story-teller is absent because he has gone to the Angara to fish;
    Ilbik Urbashkin, a starosta of the Abazai clan's second division, arrives instead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The narrator sends for men supposed to know stories, but they provide no valuable
    information.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The narrator sleeps in a little prayer house for two nights, then is forced
    out by a Russian caretaker who says the church has been desecrated by being used
    as lodging.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A young Buriat and his wife provide the narrator with a one-room house and
    repeated practical hospitality; the narrator later rewards them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the Olkhon starosta questions a crowd, men answer that fathers or grandfathers
    knew the old lore, while they themselves had not learned it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The narrator decides to leave Olkhon; Lazareff urges a visit to mainland relatives
    said to know the old Buriats, and the party leaves Seven Pines on August 13.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: At the Baikal, a young girl helps load wagons onto a boat and later rows.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Looking back at the rock faces, the narrator imagines them satisfied and glad
