canonical_text:
  quote: ''
  summary: Alamaldjin deceives and blinds a Mangathai, escapes by shapeshifting, captures
    the Mangathai's magic axe, is later poisoned by his uncles, and is buried by his
    sister Hanhai. Hanhai learns from a book about Water of Life beneath a golden
    aspen in an impassable swamp, travels there in transformed forms, obtains the
    water and the cuckoo helper, prays to the Heavenly Burkans, and recovers her brother's
    body, though a fox has taken one shoulder-blade.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Mangathai asks Alamaldjin to tie him down with a ninety-fathom hair rope
    so he will not move during the promised cure.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Alamaldjin melts lead in a pot at the central fire and pours the molten lead
    into the Mangathai's sound eye.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Alamaldjin breaks through three iron doors and escapes; he becomes a flea
    and hides on a yellow goat's ear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The yellow goat butts the Mangathai; after the Mangathai throws the goat over
    a high iron enclosure, the flea becomes Alamaldjin outside the wall.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Mangathai throws an axe at Alamaldjin as a false reward, but the axe misses;
    Alamaldjin places it in another yurta wall and commands it to keep the Mangathai
    inside.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that all of the Mangathai's magic and strength were in
    the axe.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Alamaldjin's two uncles meet him at Red Mountain with a feast after learning
    that he has conquered the Mangathai.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Alamaldjin drinks poisoned tarasun given by his uncles, falls to the ground,
    and blue and red flames come from his nostrils.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Alamaldjin's horse refuses to yield to the uncles, runs home, and tells Hanhai
    that her brother is dead at the boundary because the two uncles killed him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Hanhai finds her brother's body, wraps it in silk cloths, buries it at the
    foot of Red Mountain, and reads his book at home.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The book says that at the opposite end of the earth there is an impassable
    swamp, a golden aspen with silver leaves, Water of Life at the tree's foot, and
    a cuckoo on the tree top that can help travelers.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Hanhai puts on her brother's dress, takes his weapons, rides his steed, changes
    the horse into a flint chip, puts it in her pocket, and changes herself into a
    raven.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Hanhai reaches the Water of Life, drinks it, fills a small keg, changes into
    a reed, catches the cuckoo, and the cuckoo agrees to go with her to save Alamaldjin.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: After Hanhai returns to the burial place, she takes her own form, prays to
    the Heavenly Burkans for three days, and on the third day the ground opens so
    she can draw out the body.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The recovered body is intact except for the right shoulder-blade, which a
    fox has carried off; Hanhai follows the fox's trail to Shara Dalai and finds the
    fox with the shoulder-blade in her mouth.
  category: sequence
  evidence_refs:
  - ev:15
