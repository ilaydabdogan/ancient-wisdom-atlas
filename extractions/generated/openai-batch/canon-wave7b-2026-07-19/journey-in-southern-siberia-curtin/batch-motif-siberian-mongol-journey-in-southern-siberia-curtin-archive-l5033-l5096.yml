canonical_text:
  quote: The horse has gone to its master and is ready for use.
  summary: 'The passage describes Buriat funerary customs: removing and transporting
    the corpse, grave preparation, killing and marking the deceased man’s horse, remembrance
    rites, beliefs about invisible settlements and ghost garments of the dead, spirit
    shape-taking, and a shamanic invitation meant to call a departing soul back to
    the body.'
  language: English
  quote_policy: quoted
