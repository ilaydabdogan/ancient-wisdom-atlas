canonical_text:
  quote: his spirit would enter the body of a woman on earth, and be born again.
  summary: Gesir Bogdo, youngest son of Khan Tyurmas, casts Atai Ulan from the sky
    to earth. Atai becomes destructive spirits. The heavenly Burkans require Gesir
    to go to earth and destroy them. Gesir arranges for Death to take his body while
    his spirit descends in bird form, enters an elderly woman, returns briefly to
    the heavenly Burkans to request aid, then re-enters the woman and is born as an
    ugly deformed boy after three daughters are born and fly away as ravens. The newborn
    speaks after three days and kills two visiting young men by striking from his
    cradle.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Gesir Bogdo, described as the four-year-old youngest son of Khan Tyurmas,
    saddles his father's horse, wears his father's clothes, takes weapons, and rides
    to war against Atai Ulan.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gesir thrusts a spear into Atai Ulan's right side, unhorses him, and casts
    him from the sky to the earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After falling to earth, Atai Ulan turns into Mangathais and evil Shalmos,
    described as spirits that sow dissensions and disputes and destroy people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The thousand Burkans assemble on Dolon Odun, identified in the passage as
    the Great Bear or seven stars, to decide how to stop the evil spirits arising
    from Atai Ulan.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Dashin Shuher refuses to go to earth and says that Gesir Bogdo, who overthrew
    Atai Ulan, should go instead.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Burkans ask Gesir why he hurled Atai Ulan down to earth rather than crushing
    or killing him in the sky, and they command him to destroy the Mangathais and
    Shalmos.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Gesir says he cannot go to earth in his present form and asks that Death be
    sent to him, with instructions for preserving his body seated on a throne with
    a table and a paper at its left hand.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Gesir states that, after his body is cared for, his spirit will enter the
    body of a woman on earth and be born again.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Gesir's three sisters are to descend to earth with him.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: After Death comes and Gesir's body is cared for, Gesir's spirit becomes a
    raven, his sisters become cuckoos, and the four fly down and circle the world
    below.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The four spirits find a poor yurta at the upper end of Orhe Yalga, where a
    seventy-year-old man and his sixty-year-old wife live.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: The spirits of Gesir and his sisters enter the elderly woman.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: After six months, Gesir tells his earthly mother to remove her cap; when she
    does, he flies out through her head and ascends to the thousand Heavenly Burkans.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Gesir tells the Burkans he has found a yurta, father, and mother, and asks
    them to send thirty-three strong champions, three thousand warriors, cattle, and
    other requested aid when he is born.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Gesir returns to earth and enters the woman a second time; the old couple,
    frightened, think evil Shalmos may be playing with them.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: The woman gives birth first to three beautiful daughters, who turn into ravens,
    fly out through the smoke hole, and go up to the sky.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: A son is born after the daughters; he is described as ugly, with crooked feet
    and twisted arms behind his back, and as looking more like a frog than a boy.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:18
  text: The boy speaks after three days and instructs his parents how to place him
    in a cradle before sunrise so that two men will come and he can kill them.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:19
  text: At sunrise two young men enter, ask about the crying child in the cradle,
    and offer to straighten him; when they receive the child, he stretches, strikes
    out, crushes, and kills them both.
  category: action
  evidence_refs:
  - ev:16
- id: obs:20
  text: The child predicts that two more young men will come the next day and says
    he will kill them in the same way.
  category: speech
  evidence_refs:
  - ev:17
