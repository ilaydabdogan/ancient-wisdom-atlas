    with a table and paper, and that his spirit then enter a woman on earth and be
    born again.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
- id: ev:7
  type: summary
  locator: 6421-6422
  quote_or_summary: Gesir Bogdo's three sisters are to go down to earth with him.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
- id: ev:8
  type: summary
  locator: 6423-6429
  quote_or_summary: After Death comes and Gesir's body is cared for, Gesir's spirit
    becomes a raven, his sisters become cuckoos, and the four fly down and circle
    the world below.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
- id: ev:9
  type: summary
  locator: 6429-6435
  quote_or_summary: The four find a poor yurta in Orhe Yalga, Entering Valley, inhabited
    by a seventy-year-old man and his sixty-year-old wife; the spirits enter the woman.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
- id: ev:10
  type: summary
  locator: 6436-6443
  quote_or_summary: After six months, Gesir tells his earthly mother to remove her
    cap; when she does, he flies out through her head and rises to the thousand Heavenly
    Burkans.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
- id: ev:11
  type: summary
  locator: 6444-6452
  quote_or_summary: Gesir tells the Burkans he has found a yurta, father, and mother,
    and asks that when he is born they send thirty-three champions, three thousand
    warriors, cattle, and other aid and protection.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
- id: ev:12
  type: summary
  locator: 6453-6460
  quote_or_summary: Gesir returns to earth and enters the woman a second time; the
    frightened old couple advise against removing the cap and think evil Shalmos may
    be trifling with them.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
- id: ev:13
  type: summary
  locator: 6461-6469
  quote_or_summary: About ten months after the first visitation, the woman gives birth
    to three beautiful daughters who turn to ravens, fly out through the smoke hole,
    and go up to the sky.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
- id: ev:14
  type: summary
  locator: 6470-6478
  quote_or_summary: A son is born next; he is ugly, with crooked feet and twisted
    arms behind his back, and is said to look more like a frog than a boy.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
- id: ev:15
  type: summary
  locator: 6479-6491
  quote_or_summary: After three days the boy speaks, instructing his parents to place
    him in a cradle before sunrise and tell two coming men that they do not know whether
    he is a child or an ugly creature, so that he can kill the men when they approach.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
- id: ev:16
  type: summary
  locator: 6492-6499
  quote_or_summary: At sunrise two young men enter, ask about the crying child, offer
    to cure or straighten him, receive him from the old couple, and are crushed and
    killed when the boy stretches and strikes out.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
- id: ev:17
  type: summary
  locator: 6500-6501
  quote_or_summary: The child says that on the following day two young men will come
    with the same questions and that he will kill them as he killed the first two.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source metadata; summarized.
