canonical_text:
  quote: ''
  summary: On the narrator's birthday, he hires a troika and travels to find Manshut.
    He passes the Hill of Sacrifice, reaches villages near Manshut's employer, receives
    little information, and is guided by a drunken red-nosed man. At Manshut's house,
    an old woman and other elderly women give conflicting accounts, and the narrator
    searches the house without finding him. A Russian-Buriat man says Manshut's employer
    has much grass to cut and will not let the old man go to Usturdi. The narrator,
    driver, and guide set out toward the hayfield after a dispute about crossing the
    river. They stop at a closed dram shop, where two children refuse to open the
    door despite the guide's demands. The passage then breaks off into fragmentary
    OCR/image debris.
  language: English
  quote_policy: summarized
