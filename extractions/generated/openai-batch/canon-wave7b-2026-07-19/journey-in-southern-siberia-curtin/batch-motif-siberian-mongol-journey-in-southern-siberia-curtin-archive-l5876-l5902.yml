canonical_text:
  quote: ''
  summary: 'The passage introduces the story of Gesir Bogdo as originating in the
    sky. It describes sky people who existed before humans, with Esege Malan as their
    oldest and chief figure. Esege Malan has nine sons: four elder sons and four younger
    sons dispute succession, while the powerful middle son Mahai Danjin supports the
    younger group. Mahai Danjin sends the four elder brothers down to earth beyond
    the Frozen Ocean, where they create harmful beings including Mangathais, serpents,
    and savage dogs. Their actions bring evil and disorder to the earth for many thousands
    of years.'
  language: English
