candidate_motifs:
- id: motif:1
  label: compassionate rescue of animals followed by animal aid
  taxonomy_refs:
  - sacred_exchange
  basis: Sharau buys animals that are being taken away to be killed; the saved dog
    later helps him by giving a magic ring and instructions.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage explicitly shows repayment by the dog only; the cat does not
    return within this passage. The taxonomy reference is approximate because the
    exchange is not formally ritualized.
- id: motif:2
  label: impossible bridal task completed by magical help
  taxonomy_refs:
  - sacred_marriage
  basis: Sazrai Khan conditions the marriage on building a silver bridge under threat
    of death, and Sharau fulfills the task overnight through the dog-given ring.
  evidence_refs:
  - ev:9
  - ev:12
  - ev:13
  - ev:15
  confidence: high
  cautions: The marriage follows the task, but the passage does not frame it as a
    divine or cosmic marriage.
- id: motif:3
  label: magic ring activated by gesture and spoken wish
  taxonomy_refs: []
  basis: The ring's power is activated by looking at the sun, making three hand-circles
    while turning, and saying the desired result; it produces the bridge and later
    transports Sarung-gohung.
  evidence_refs:
  - ev:12
  - ev:18
  - ev:20
  confidence: high
  cautions: No available taxonomy reference directly names magic rings or wish-granting
    objects.
- id: motif:4
  label: secret magical object revealed after persistent questioning
  taxonomy_refs:
  - forbidden_knowledge
  basis: Sharau hides the ring and refuses to explain it, but Sarung-gohung questions
    and teases him until he tells her its power and later gives it to her.
  evidence_refs:
  - ev:17
  - ev:18
  - ev:19
  confidence: medium
  cautions: The passage does not explicitly call the knowledge forbidden; the taxonomy
    reference is based on concealment and pressured disclosure.
- id: motif:5
  label: wife departs to distant lover using husband's magic object
  taxonomy_refs:
  - departure
  basis: Sarung-gohung obtains the ring, has a lover beyond the sea, and uses the
    ring to go to him while Sharau sleeps.
  evidence_refs:
  - ev:19
  - ev:20
  confidence: high
  cautions: Available taxonomy includes 'stolen_beloved,' but the passage describes
    the wife departing to her lover rather than being abducted, so that reference
    is not used.
- id: motif:6
  label: wrongly endangered husband after wife's disappearance
  taxonomy_refs:
  - divine_judgment
  basis: After Sarung-gohung disappears, Sazrai Khan accuses Sharau of having killed
    her, imprisons him, and threatens to behead him unless she returns.
  evidence_refs:
  - ev:21
  - ev:22
  confidence: low
  cautions: The khan's punishment is legal or royal rather than explicitly divine;
    the taxonomy reference is therefore only approximate.
