canonical_text:
  quote: ''
  summary: After a brief closing line from a prior tale, the passage introduces Sharau,
    a young man who leaves home with money from his mother. He spends the money saving
    a cat and then a dog from being killed, lies to his mother that he bought grain,
    and asks to marry Sarung-gohung, daughter of Sazrai Khan. The khan demands that
    Sharau build a silver bridge or lose his head. Sharau flees, meets the rescued
    dog, receives a magic ring, and uses it to make the bridge overnight. After the
    wedding, Sarung-gohung learns the ring's secret, obtains it from Sharau, and uses
    it to go to her lover beyond the sea. Sazrai Khan imprisons Sharau and threatens
    execution if the daughter does not return within seven days.
  language: English
  quote_policy: summarized
