canonical_text:
  quote: ''
  summary: The narrator photographs Andrei Mihailovitch's Ongons, described as gods
    protecting house and property. Home Ongons hang high in a house corner; property
    Ongons are kept in boxes with images and animal skins. Field Ongons are kept in
    small boxes within hewn pillars. Andrei handles the images carefully, uses burning
    juniper smoke to purify the box, returns tobacco and images, and replaces the
    box in the pillar. The passage also states that a Buriat man must set up such
    a pillar after marriage with shamanic assistance, and that after a man's death
    the Ongon box is hung high on a forest tree while the carrier must not look back.
  language: English
  quote_policy: summarized
