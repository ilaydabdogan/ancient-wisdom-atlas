  quote: ''
  summary: The passage lists Buriat sacrifices and offerings to the fifty-five Tengeris,
    the forty-four Tengeris, and named heavenly spirits. It describes Qoqodai Megun
    Qubin’s sons and daughters riding gray steeds across the sky to make thunder,
    identifies offerings of tarasun, animals, and skins, and notes mountain dwellings
    and spring worship connected with certain divine descendants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Every man with the means is said to owe three sacrifices in his life to the
    fifty-five Tengeris, with offerings including fifty-five pots of tarasun and specified
    virgin animals.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Qoqodai Megun Qubin is identified as the eldest of the fifty-five Tengeris
    and receives frequent sacrifices, while the other fifty-four are mentioned with
    him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Qoqodai Megun Qubin has nine sons and nine daughters; the eighteen children
    have eighteen gray steeds and make thunder by racing and galloping over the sky.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the forty-four Tengeris from Ziini Dishin, seven are singled out as
    very important and named.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sagade Ugugun, Sanqaliri Qateri, and their eldest son and daughter receive
    a sacrifice of a fat harmless ram, prayers, and tarasun libations.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Buriats worship Biiir Sagan Ugugun, described as a heavenly spirit and son
    of Bulage Ijiri, together with his wife Qwir Sagan Qamagan, using offerings of
    tarasun and virgin ewes.
  category: action
  evidence_refs:
  - ev:6
