canonical_text:
  quote: ''
  summary: Hanhai helps Khan Herdik by killing the two-headed Mogoi Khan at a vulnerable
    white spot and receives a quill. The quill proves too heavy or powerful for Gazar
    Bain Khan's yurta and is returned by a commanded arrow. At the wedding, Shorgo
    the female Shaman repeatedly accuses Hanhai, acting as bridegroom, of being a
    woman. Hanhai passes wrestling and swimming tests with help from her horse, then
    uses a conjured gray wolf to distract the people and places Shorgo headfirst into
    a barrel of sour milk.
  language: English
  quote_policy: summarized
