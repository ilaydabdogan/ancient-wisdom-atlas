canonical_text:
  quote: ''
  summary: The narrator stays in an upper part of a house with a balcony, takes tea
    and supper, and speaks with Vassili, a young Buriat student knowledgeable about
    Buriat customs and beliefs. The next morning the narrator observes cattle, sheep,
    and a mounted party of Buriats from the balcony. He describes the deceptive rapidity
    of Mongol saddle horses, recalls a similar impression from pacing camels near
    Assuan, and reflects on the historical importance and endurance of the Mongol
    horse.
  language: English
