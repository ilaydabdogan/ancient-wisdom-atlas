canonical_text:
  quote: ''
  summary: Two brothers recognize one another by a shared birth-mark, receive names,
    weapons, and horses, leave their foster merchant to search for their abducted
    parents, defeat hostile khan's sons by magic arrows, find their mutilated parents
    in a guarded yurta, heal them with the Water of Life, restore the family home
    by magic, and bring their foster household to live with them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The elder boy says that he and his brother share a birth-mark under the left
    shoulder; when the same mark is found on the being referred to as a squirrel,
    the two brothers embrace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The merchant flogs seven hundred men for failing to find one boy and then
    losing the other; after the brothers are found, he assigns them to herd cattle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The brothers neglect the herd, causing the calves to take all the milk; the
    merchant's wife prevents him from flogging them, and the boys explain their absence
    by saying they wrestled with Khan Laraja Mina's son and later went to the sky
    for bows and arrows.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After seven days, the ninety Heavenly Blacksmiths have bows and quivers of
    arrows ready for the brothers, and the merchant gives a feast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: An old man eats the butter and meat set out by the merchant and names the
    elder boy Altin Gorye and the younger Mungun Gorye.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The people give each brother an unusually large stallion; the brothers then
    prepare to travel until they find their father and mother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brothers tell the merchant that they will search for their own father
    and mother but will not forget him even if they live a thousand years.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: At their birthplace, the brothers find the place ruined except for a hitching-post
    bearing their father's message that the parents have been taken by Bugii Curte
    Zulut; the message also points them to food, arsa, and travel instructions.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: After three days of travel, the brothers meet two sons of a khan who know
    of their coming by magic and choose to meet them with war.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the arrow contest, the brothers catch the khan's sons' arrows by magic,
    command their own arrows not to yield to magic, kill both opponents, and burn
    the men and their horses.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The brothers question the wives and children of the dead men about their stolen
    parents; the women deny knowledge and laugh among themselves after the brothers
    leave.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The brothers travel west to a beautiful closed and guarded yurta that opens
    at their command; inside they find their father and mother missing their right
    eyes, hands, and feet, and the parents do not recognize them.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: The father says his home was in the opposite land, that he was once eldest
    of thirteen khans and knew many languages, and that two sons were born to him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The brothers identify themselves as the sons taken from the parents while
    sleeping behind seventy-three curtains, say a merchant reared them, and announce
    that they will get the Water of Life to heal the parents.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The brothers bring a vial of the Water of Life, restore their parents' eyes,
    hands, feet, and strength, take the parents and property home, and magically make
    the ruined yurta large and beautiful.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:16
  text: The brothers return to the merchant; he gives a seven-day-and-seven-night
    feast, recalls rescuing and searching for them, and he and his wife go with them
    to the father's home with wagons of gold and treasures.
  category: sequence
  evidence_refs:
  - ev:10
