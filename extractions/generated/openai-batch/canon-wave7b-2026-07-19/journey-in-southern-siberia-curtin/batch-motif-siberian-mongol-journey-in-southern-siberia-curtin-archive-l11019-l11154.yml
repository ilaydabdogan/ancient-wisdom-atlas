canonical_text:
  quote: '"If one puts a cup of milk on the fire I can run three times around the
    world before it boils."'
  summary: Altin mounts a powerful horse, which proves magically swift and carries
    him safely from a flat-topped red mountain back to his home. His family reacts
    to the horse's size. Altin counts his herds, discovers a missing colt, follows
    a trail to three brothers, and challenges them. At Open White Steppe, where five
    large pines stand, the brothers attempt to shoot him while he sleeps, but he is
    stone when asleep. Altin defeats the brothers in wrestling, burns their bodies
    with uprooted pines, overturns their yurta, and returns with people, property,
    cattle, and three horses. He then announces that he will seek a bride; after three
    days of reading, his book names Gal Niirman Khan of the far South and his daughter
    Gagurai Nugun as the bride.
  language: English
  quote_policy: quoted
