canonical_text:
  quote: ''
  summary: 'The passage describes the household production of tarasun from sour milk:
    sour milk is placed in a sealed iron pot over a slow central fire, distillate
    runs through a pipe into a tub, and stronger liquor is produced by repeated distillation.
    It also describes storage of milk barrels and the use of arsa, the hardened residue
    left after distillation.'
  language: English
  quote_policy: summarized
