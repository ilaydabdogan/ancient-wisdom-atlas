canonical_text:
  quote: ''
  summary: The narrator describes efforts in Usturdi to locate Buriat men who could
    recount ancient myths and explain customs. Two old men provide brief information
    and one story concerning Esege Malan/Father Bald Head and Ehe Tazar/Mother Earth;
    later Manshut tells three named stories but leaves. The passage then shifts to
    an observation of Russian convicts and political prisoners passing through Usturdi
    under soldier guard, halting to cook tea, and continuing toward the Lena River
    and Yakut country.
  language: English
  quote_policy: summarized
