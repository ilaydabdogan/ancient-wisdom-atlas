canonical_text:
  quote: ''
  summary: The passage introduces the Tailgan, or Horse Sacrifice, held on Uher hill
    by divisions of the Ashekhabat clan. It describes the hill altars, the clan founder
    and his seven sons sacrificing there to hill and mountain Burkans, the later migration
    of five sons whose descendants sacrifice at Baganteng, and the morning preparations
    and preliminary sprinkling of milk and tarasun to the Burkans with requests for
    a good Tailgan and prosperity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tailgan, or Horse Sacrifice, takes place on a hill called Uher, about
    seven miles from Usturdi.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fifteen large stone altars have been built on Uher hill.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The sacrifice is made by the first and second division of the clan Ashekhabat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In the mythological past the clan founder lived at Baganteng and had seven
    sons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The clan founder and his seven sons sacrificed on Uher hill to the Burkans
    of the hill and of the opposite mountain; the chief of the latter is Malan Noyon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Five of the seven sons went beyond the Baikal, and their descendants still
    make sacrifice to Baganteng, the place where the clan originated and where the
    founder's tomta is.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The descendants beyond the Baikal are said to have forgotten Uher and its
    divinities long ago.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the morning of the ceremony, clan families send men to Uher with vessels,
    tarasun, milk, tea, twigs, trees, bushes, and other needed sacrificial supplies.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The two liquids drunk are tarasun and a liquid called “the white,” usually
    milk; milk with tea is also given to those who prefer it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The men sent in advance stop about halfway on the road to Uher and sprinkle
    milk and tarasun to the Burkans of the hill, the mountain, and all Burkans that
    may exist.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: While sprinkling the liquids, the advance men ask first for a good Tailgan
    and then for success and prosperity for those who make the sacrifice.
  category: speech
  evidence_refs:
  - ev:6
