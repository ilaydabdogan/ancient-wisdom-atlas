canonical_text:
  quote: Water of Life, Youth, and Health
  summary: Hanhai makes her horse into a flint chip, changes animal forms to ascend
    a mountain, finds life-giving water, and then rides to Gazar Bain Khan’s house
    under the name Alamaldjin Bogdo to ask for Nalhan Taiji. Nalhan chooses Hanhai
    from among four suitors, but Hanhai leaves because of an enchanted-horse condition.
    Gazar then requires a quill from Khan Herdik’s wing. Hanhai learns Herdik is fighting
    Mogoi Khan near the Icy Ocean, and agrees to help Herdik, changing into an eagle.
  language: English
  quote_policy: quoted
