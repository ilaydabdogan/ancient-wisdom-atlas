canonical_text:
  quote: ''
  summary: The Iron Hero is instructed by his stallion, reaches Red Mountain where
    many beings die trying to climb, ascends by changing animal forms, releases the
    Water of Life and Youth to revive people and horses, then approaches his father-in-law’s
    sky-touching yurt in the disguise of a diseased old man. He confronts seven rival
    suitors, proves impossible to remove, drives them away, soils the yurt, and leaves
    before two summoned heroes arrive.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The stallion tells the Iron Hero that it would have been a sin not to touch
    the water, because living people must touch things as they pass them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Iron Hero acknowledges that he did not know this, turns the stallion into
    flint again, and continues journeying while pushing his car.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Red Mountain the Iron Hero sees hills of human bones, beast bones, flesh,
    and a stream of blood, with blind, lame, handless, footless, rich, poor, great,
    and small people trying to climb.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those attempting to climb Red Mountain fall back, lose flesh while climbing
    and falling, and perish when they fall.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Iron Hero looks at the bones and the people and weeps for three days and
    three nights; when changed back from flint, the steed also weeps.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Iron Hero turns his steed and car into flint, carries them, changes himself
    into a skunk, then a squirrel, then a falcon, and reaches the top of the mountain
    after great effort.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the top of the mountain the Iron Hero falls and lies without moving for
    three days and three nights, then revives.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Iron Hero finds an immense iron barrel with ninety-nine hoops, fills it
    with the Water of Life and of Youth, and rolls it down the mountain.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The barrel breaks, the water runs out in a broad stream, and the people and
    horses at the foot of the mountain come to life.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: An old man asks all the Burkans to prosper the Iron Hero and gives a long-life
    blessing.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: From Red Mountain the Iron Hero sees an enormous white yurt at the horizon
    that touches the sky and is identified as the yurt of his father-in-law.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: On a brass and iron hill untouched by human feet, the Iron Hero magically
    makes himself old, sick, wretched, malodorous, and covered with sores, and makes
    his car worn and battered.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the courtyard of the yurt stands a pillar with branches and ninety-six
    hitching rings; seven differently colored horses are tied there, with each rider’s
    arms on its saddle.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: The riders of the seven horses are suitors for the maiden whom the Iron Hero
    wishes to marry.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The disguised Iron Hero enters over silver stairs and through golden doors
    and greets the khan as father-in-law.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The khan rejects the old man’s greeting and says that whichever of the seven
    suitors throws him out will get his daughter.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: One suitor, then all seven, try to lift the old man but cannot move him from
    the floor.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: The old man pushes the seven suitors away, hurls them in different directions,
    and they flee the courtyard on their horses.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: The old man moves through the chambers, sitting down in them and soiling floors
    and seats; the khan cannot frighten, entice, or drive him out.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: The khan sends for two heroes from the southwest, requiring a three-day ride
    to reach them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:21
  text: After five days the old man takes his car to the Iron and Silver Square on
    the hilltop, makes a fire, and sleeps quietly.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:22
  text: The two heroes arrive after the old man has left; the khan reports that fifteen
    women are washing the rooms and that the old man has gone northeast with his car.
  category: sequence
  evidence_refs:
  - ev:10
