candidate_motifs:
- id: motif:1
  label: Deadly mountain ascent to reach life-giving water
  taxonomy_refs:
  - ascent
  - mystical_quest
  basis: The Iron Hero reaches a mountain where others die climbing, then ascends
    through successive animal forms and obtains the Water of Life and Youth at the
    top.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage does not explicitly state that the mountain is cosmic or an
    afterlife realm; those broader classifications are not assigned.
- id: motif:2
  label: Resurrection by released Water of Life and Youth
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: When the iron barrel breaks, the Water of Life and Youth flows down and the
    people and horses at the foot of the mountain come to life.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The revival is described for the people and horses at Red Mountain only;
    no general doctrine of resurrection is stated.
- id: motif:3
  label: Heroic shapeshifting to overcome an impossible ascent
  taxonomy_refs:
  - shapeshifter
  basis: The Iron Hero becomes a skunk, then a squirrel, then a falcon while climbing
    and flying toward the mountain top.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The transformations are described as actions of the hero; the mechanism
    beyond his power is not explained in this excerpt.
- id: motif:4
  label: Repulsive disguise of a suitor at the bride’s household
  taxonomy_refs: []
  basis: Before approaching his father-in-law’s yurt, the Iron Hero magically makes
    himself old, sick, wretched, malodorous, and covered with sores, then enters among
    the bride’s father and rival suitors.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage does not explicitly state the strategic purpose of the disguise,
    though it immediately precedes the encounter with the suitors.
- id: motif:5
  label: Immovable disguised hero defeats rival suitors
  taxonomy_refs: []
  basis: The khan offers his daughter to the suitor who can throw the old man out,
    but neither one suitor nor all seven can move him, and he hurls them away.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No explicit trial formula is named; the motif is inferred from the described
    contest.
- id: motif:6
  label: Bride quest with multiple rival suitors at the father-in-law’s court
  taxonomy_refs: []
  basis: The seven horse riders are suitors for the maiden whom the Iron Hero wishes
    to marry, and her father links possession of the daughter to the contest of expelling
    the old man.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The larger bride-quest context is only partially included in this passage.
