    broader theological explanation of resurrection.
- id: claim:2
  claim: 'The Red Mountain episode fits an ascent-quest pattern: a hero must reach
    a deadly height by extraordinary means and returns life-giving benefit to those
    below.'
  claim_level: same_function
  target: ascent / mystical_quest motif family
  evidence_refs:
