canonical_text:
  quote: ''
  summary: The passage surveys fur trade, tribute, and Novgorod expeditions around
    the Ural region and Yugria. It includes a Chronicle account in which people of
    Yugria are enclosed behind sky-touching mountains and a bronze gate by Alexander
    of Macedon with divine aid, and another account in which clouds touching the earth
    release fur-bearing animals and reindeer. The author explicitly compares the cloud-animal
    tale to Pacific coast and Klamath River traditions of animals coming from the
    sky.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes fur as the chief valuable article of commerce and says
    regions east of the Ural mountains were richer in high-quality furs and also had
    gold and silver.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Novgorod expedition in 1032 set out for the "Iron Gates," identified as
    a Ural pass, but failed; only a few returned and most perished.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The quoted Chronicle account describes people in Yugria as shut in by sky-touching
    mountains with a small gate or opening through which they sometimes look out and
    speak, though outsiders do not understand them.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Chronicle account says that if someone shows a knife or axe to the enclosed
    people, they offer furs in exchange.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Chronicle account says Alexander of Macedon confined the Yugrians after
    seeing practices described as unclean; it says he asked the Lord, the mountains
    closed in, and a bronze gate remained that fire could not burn and iron could
    not cut.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Another Chronicle note says old men who had gone to Yugria saw clouds touch
    the earth, after which fur-bearing animals and reindeer came out and rushed away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author states that the cloud-animal tales are like tales from Pacific
    coast Indians and Klamath River tribes about animals coming from the sky, and
    identifies the Chronicle account as a Siberian myth-tale reported through Russian
    mediation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The later historical sequence says Yugria paid tribute to Novgorod, expeditions
    reached the Ob River and the Frozen Ocean, Tohtamish was murdered at Sibir, and
    a later Novgorod expedition to Yugria failed.
  category: sequence
  evidence_refs:
  - ev:6
