canonical_text:
  quote: ''
  summary: 'The passage recounts Russian expansion in Siberia from the late sixteenth
    to early seventeenth century: the founding and capture of towns, exile practices,
    the defeat of Kuchum, Romanoff exiles and genealogy, Tomsk and Yakutsk-area descriptions,
    Cyprian''s gathering of Yermak traditions, and the first Russian acquaintance
    with the Buriats.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Chulkoff induced Seidyak, Uzaz Makmen, and Karacha to visit Tobolsk, seized
    them, sent them to Moscow, and then captured Sibir; the inhabitants fled and the
    place was not reoccupied.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Russians advanced eastward; most native tribes submitted without struggle,
    and the Russian government built forts that later became towns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In 1590 colonists were first sent to Siberia, Tobolsk became the chief administrative
    center, and Pelym was identified as the first Siberian place to which exiles were
    sentenced.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Many people of Uglitch were exiled, and a church bell from Uglitch was sent
    to Tobolsk after it had sounded an alarm when the Tsar's son was killed.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Beriozoff, Surgut, Tara, Obdorsk, and other towns were founded, and commerce
    began to flourish.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Prince Masalski and Ivan Voyekoff set out with one thousand men to punish
    Kuchum, defeated him, and sent members of his family to Moscow; Kuchum fled and
    was later killed by the Nogai Tartars.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ivan and Vassili Romanoff were exiled to Pelym; their brother Fedor avoided
    exile by becoming the monk Philaret, while his wife took the veil as Martha, and
    Michael Romanoff is described as descending from them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tomsk was founded in 1604 and is described as an educational and religious
    center with severe cold and a river frozen for about half the year.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Yakuts were reported as living on the Lena River; Martynoff entered the
    Lena by the Vilyno, imposed tribute on them, and the Yakutsk Territory is described
    as mineral-rich and a destination for convict mine labor.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Cyprian, the first archbishop to Siberia, sought survivors of Yermak's forces
    and wrote down their accounts of Yermak's expeditions and conquests, which became
    the basis of Siberian chronicles.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: In 1622 the Russians first became acquainted with the Buriats.
  category: relationship
  evidence_refs:
  - ev:10
