canonical_text:
  quote: ''
  summary: 'The passage lists three house ongons: a birch wheel with an image of the
    ancient holy Shaman Tumur Shin Qulain Sejin Bara and associated goat and food
    offerings; a black felt image-group representing Sagade Ugugun, his wife, children,
    and a requested infant, with meat offerings; and a long felt object containing
    three virgin sisters, consecrated by a Shaman with offerings, through whom people
    petition the World White God/Esege Malan for prosperity.'
