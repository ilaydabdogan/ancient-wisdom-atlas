canonical_text:
  quote: ''
  summary: The passage first notes a fiery or lightning-like mythic steed compared
    with Hungarian and Irish examples. It then describes “bringing to life” as common
    in Mongol mythology and compares Mongol restoration of skeletons or a dead hero
    with Gaelic, Iroquois, Yana, and Modoc methods for reviving the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mythic steed is described in connection with glowing coals and is compared
    with Hungarian myths in which the steed is identified with lightning.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A steed of this kind carries Cahal, son of King Conor, to Striker’s castle,
    a place unreachable by ship.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Mongol examples, a hero sprinkles skeletons and piles of dry bones with
    Water of Life from a spring near a silver-leafed aspen tree; the bones reconnect,
    take on flesh, and the restored men bless the benefactor.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the Mongol hero himself is killed, restoration is described as more difficult
    and may require several days of prayer by a wife, sister, or friend to the Heavenly
    Burkans.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The cuckoo assists in restoring a dead hero by singing around the body from
    the feet to the head three times; flesh appears, breath enters, and the hero springs
    up.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In Gaelic examples, bones or dust are gathered and struck with a rod of enchantment
    or Druidic switch, after which the hero rises well and strong.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Iroquois examples, a hero threatens a heap of bones with a hickory tree
    and commands them to rise; the bones arrange themselves, take flesh, and the restored
    multitude return home.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Yana examples include restoring life by kicking or turning over a corpse with
    the foot, boiling one hair or the heart, or striking with a twig from a red rosebush.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In a Modoc example, the morning star calls to a long-dead hero and tells him
    to rise up.
  category: speech
  evidence_refs:
  - ev:7
