  summary: 'The passage gives a historical overview linking Mongol rule in India and
    Russia with a third history: western Mongols or Turks fleeing Jinghis Khan, settling
    in Asia Minor, and becoming the Ottomans. It identifies the mountain region south
    of Lake Baikal as the birthplace of a Mongol historical mystery and the origin
    region of Jinghis Khan''s family, then outlines early Russian and Novgorodian
    knowledge of Siberia, especially through homage to the Grand Khan and the fur
    trade.'
