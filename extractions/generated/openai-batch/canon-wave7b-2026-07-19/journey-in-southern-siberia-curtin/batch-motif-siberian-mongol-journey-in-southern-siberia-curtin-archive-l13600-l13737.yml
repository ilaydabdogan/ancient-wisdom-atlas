canonical_text:
  quote: ''
  summary: Hanhai uses a stallion and concealed nails to unsettle Shorgo the Shaman
    and a bridegroom, resumes a wedding, receives magical wedding gifts for the bride,
    opens a hidden kingdom, retrieves her brother Alamaldjin’s skeleton from Red Mountain,
    and stages it before the bride. The bride Nalhun or Nalhan Taiji revives Alamaldjin
    through ritual actions using juniper, fire, a silver goblet, and a magic kerchief.
    Hanhai later disguises herself as a fly and hare, reveals herself to her brother
    after conflict with his wife, recounts her suffering, and receives a white stone
    yurta with a silver roof.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hanhai mounts a stallion after putting nails into her boot heels and uses
    a heel-nail to make the horse spring aside, throwing the old woman and the bridegroom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Shaman’s three daughters cry because they think the khan’s son-in-law
    has been killed, while saying they could outlive their mother’s loss.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bridegroom recovers from a faint, and Hanhai returns to the khan’s yurta
    and asks for the wedding to proceed immediately.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wedding lasts nine days and nine nights; the bride receives a huge horse,
    a silver goblet, and a silk magic kerchief said to revive a dead man and enrich
    a poor man.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hanhai fastens a larch tree to her horse’s tail and rides ahead to mark places
    for rest, refreshment, smoking, and night camps.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Near her hidden kingdom, Hanhai tells the young wife to follow her trail,
    removes the iron walls at the boundary, and the silver dome, grass, and forest
    vanish.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hanhai goes to her brother’s grave at Red Mountain, takes his remaining skeleton
    home, places the bones on the yurta floor near the door, turns into a fly, and
    waits.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The bride sees the skeleton, is frightened, and performs a ritual with three
    steps over the bones, burning juniper in the silver goblet, three circuits, fire
    and coals, and three waves of the kerchief.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the third wave of the kerchief, Alamaldjin springs up, says he has slept
    long, and commands a feast that lasts nine days and nine nights.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Hanhai leaves the yurta as a fly, becomes a hare in the forest, is caught
    alive in Alamaldjin’s trap, and is taken to the yurta as a pet.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The hare follows Nalhan Taiji; after she wounds it with pincers, Alamaldjin
    beats his wife and says he will not permit the hare to be tormented.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The hare turns into a woman, addresses Alamaldjin as brother, says she has
    suffered from his folly, and tells the whole story including that he had died
    twice.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Hanhai asks Alamaldjin not to place her far away and to make her a white stone
    yurta with a silver roof; he builds it, and she lives there thereafter.
  category: sequence
  evidence_refs:
  - ev:12
