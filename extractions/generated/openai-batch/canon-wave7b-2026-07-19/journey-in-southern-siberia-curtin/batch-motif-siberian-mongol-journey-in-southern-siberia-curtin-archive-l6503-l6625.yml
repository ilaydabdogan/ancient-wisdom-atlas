canonical_text:
  quote: ''
  summary: A supernatural child defeats hostile Shalmos by taking their tongues, then
    has himself placed by the roadside where he transforms dangerous ravens and a
    giant mosquito into weaker present-day forms. He later goes to a khan's wedding,
    appears as a splendid rider, wins and steals the bride Sangha Gohun, returns home,
    resumes the form of a poor stumbling child in goat skin, and Sangha is magically
    kept near his parents' yurta despite attempts to leave.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two unnamed men come in the same way as prior figures in the larger narrative,
    ask the same questions, and are killed; the excerpt does not specify the earlier
    manner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The child tells his caretakers that six Shalmos will come and instructs them
    to present him as a crying infant with a tongue ailment needing cure.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Six Shalmos arrive in the form of young men; when each tries to cure the infant,
    the child draws out and swallows his tongue, leaving all six speechless.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The child orders his mother to fill a sucking bottle with milk, place it in
    the cradle, and leave him by the roadside from sunrise until sunset.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Two ravens with iron beaks and iron claws plan to pick out the boy's eyes;
    he removes their iron beaks and claws, gives them bone ones, and makes them small
    and weak like ravens of the present.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: On a second roadside exposure, a bullock-sized mosquito with a bone sting
    and hard bone legs plans to suck the boy's blood; the boy seizes its sting, breaks
    it into bits, and makes it tiny and weak like a present-day mosquito.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The boy announces that he will attend Sazgai Bain Khan's wedding for Sangha
    Gohun, claiming that the khan's daughter is to take him as bridegroom; his parents
    object because he is too small to walk safely.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: After putting on goat skin and leaving sight, the boy calls on the thousand
    Burkans to send his steed; a huge steed, riding gear, and fine clothing appear,
    and Gesir Bogdo rides to Sazgai Bain Khan's house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At the wedding Gesir Bogdo dances beautifully, attracts admiration, pays attention
    to Sangha Gohun, and after she falls in love with him he steals her at midnight
    and rides homeward.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Near home he directs Sangha Gohun to go ahead, releases the steed, puts on
    the old goat skin, becomes a stumbling little boy again, and toddles toward the
    yurta.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Sangha Gohun laments the poor yurta and tries to return to her father, but
    after traveling all day she finds herself back by the same yurta and is held there
    by magic.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
