canonical_text:
  quote: ''
  summary: An aged childless khan, Buruldai Bogdo, laments that he has no child to
    ride a wondrous colt. His wife sends him to seven Lamas, and the youngest says
    a child is already at his yurt. A son is born with an uncuttable umbilical cord;
    a horse and hair from the wondrous colt enable the child to stand. The boy grows
    with extraordinary speed, kills a wolf, later learns that a newborn sister was
    stolen through the smoke hole, and petitions Esege Malan for a wise horse and
    arms. After offerings on the way to Red Mountain, he obtains and masters a horse
    that tests him. Searching for his sister, he meets three mounted young men, each
    also seeking an infant sister, and the four conclude the sisters are beneath a
    great rock.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Buruldai Bogdo is described as a seventy-year-old khan; his wife is sixty,
    and they have no children.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The khan takes a book out of his head, reads that he has not counted his cattle
    for fifteen years, and sets out to count them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: He finds cattle that have not increased and have little water, then sees a
    mare's colt that seems as big as a mountain and laments that he has no child to
    ride it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: His wife says she still hopes to have a son or daughter and tells him to go
    beyond the mountain to the seven Lamas for soothsaying.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The khan reaches a great square yurt with no visible door; after he backs
    up and kicks the wall, seventy doors open.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the khan begs for three days, the youngest Lama says that the khan wants
    children and that a child is already at his yurt.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: A son has been born, but neither knife nor axe can cut the umbilical cord;
    hair from the wondrous colt is tied to the child, the khan's horse pulls, and
    the child stands up.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The boy grows so quickly that after seven days the skin of a seven-year-old
    sheep cannot cover him; at ten months he herds sheep and kills a wolf with a bow
    and arrow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The boy builds a yurt in an open meadow, lies down to sleep for seven months,
    is awakened in the fourth month by his mother, and learns that a sister was born
    and stolen through the smoke hole.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The boy asks his father to write a petition to Esege Malan for a horse; the
    reply says that horse and arms are on the flat top of Red Mountain.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The boy takes three casks of tarasun and three sheep, makes libations, eats
    and drinks, and goes to Red Mountain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A horse at the edge of the sky says the boy should shoot it in the heart;
    the arrow passes through without drawing blood, and the horse recognizes him as
    master.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The horse runs for thirty days trying to throw the boy, then says it was testing
    his strength and will serve faithfully.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: While searching for his sister, the boy follows a trail to a rock, offers
    tobacco to the gods, and meets three young men from different directions, each
    seeking an infant sister.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The four seekers hold a council and decide that their sisters must be somewhere
    under the great rock; one young man tells another to raise the rock.
  category: action
  evidence_refs:
  - ev:11
