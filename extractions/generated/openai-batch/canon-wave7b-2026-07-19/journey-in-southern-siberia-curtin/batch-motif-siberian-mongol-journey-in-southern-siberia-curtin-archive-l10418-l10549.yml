- id: ev:4
  type: summary
  locator: lines 10447-10451
  quote_or_summary: Varhan cuts open his forehead, removes a book, and reads that
    Shandagan Sagai, daughter of Esege Malan, is the most beautiful woman in the world
    and is to be his bride.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:5
  type: summary
  locator: lines 10452-10459
  quote_or_summary: Beyond a mountain a milk-white mare with thirteen asses has a
    ninety-fathom dark gray colt following her; Varhan brings the colt home, feeds
    it for thirty days, saddles it, and sets out toward the sky to find Shandagan
    Sagai's yurt.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:6
  type: summary
  locator: lines 10460-10466
  quote_or_summary: When the horse tires, Varhan turns it into flint and carries it,
    makes himself a wolf, later resumes his form, rides the colt again, and reaches
    the opening called Sinbur Ulai Tolgai, the door through the highest point in the
    sky.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:7
  type: summary
  locator: lines 10467-10474
  quote_or_summary: On the other side of the sky door Varhan sees an immense splendid
    yurt reaching a second sky, enters it, and finds Shandagan Sagai in the seventy-fifth
    chamber.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:8
  type: summary
  locator: lines 10475-10482
  quote_or_summary: Varhan tells Shandagan Sagai he is the son of Galtun Umri and
    is seeking Agin Nogon; she makes tea in a silver kettle, he rests his head on
    her knees, she searches his hair, he sleeps, and she screams.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:9
  type: summary
  locator: lines 10483-10491
  quote_or_summary: Varhan closes the yurt's seventy-five doors and ninety-five chambers,
    makes the house as small as a little box, puts it on his horse, and races away
    with Shandagan Sagai inside.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:10
  type: summary
  locator: lines 10492-10500
  quote_or_summary: Esege Malan's three invisible Shalmos watch everywhere, see that
    the house, daughter, and goods are gone, and report this to him.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:11
  type: summary
  locator: lines 10501-10513
  quote_or_summary: Esege Malan sees Varhan stealing his daughter away, summons a
    perfect fool to pursue and kill him, and sends three hundred champions with clubs,
    three hundred with hammers, and three hundred with sharp swords to help.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:12
  type: summary
  locator: lines 10514-10521
  quote_or_summary: As the fool and champions gain on Varhan, Varhan rises into the
    air with his horse; the fool also flies but tells the nine hundred helpers to
    stay behind.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:13
  type: summary
  locator: lines 10522-10526
  quote_or_summary: The helpers spend the night where they are left; they burn the
    surrounding forest, their horses eat all the grass, and the passage says nothing
    has grown there since.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:14
  type: summary
  locator: lines 10527-10535
  quote_or_summary: When the fool nearly catches him, Varhan turns himself into an
    old man near a spring of pure water, with a hut and Shandagan Sagai inside; he
    wears a girdle of inner larch bark and appears very poor.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:15
  type: summary
  locator: lines 10536-10542
  quote_or_summary: The fool is not misled and asks what kind of man steals another's
    daughter, house, and goods, and what right he had to do this.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summary based on supplied passage.
- id: ev:16
  type: summary
  locator: lines 10543-10549
  quote_or_summary: Varhan and the fool fight for nine days; the fool throws Varhan
    over three mountain ranges and mocks him, after which Varhan rises angrily from
    the earth and overturns one hundred and fifty acres around him.
