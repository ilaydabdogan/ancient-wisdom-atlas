canonical_text:
  quote: ''
  summary: The passage introduces Varhan Tulai Hubun and his elder brother Albat Mergin
    Hubun. After contests of strength and archery, Varhan learns from a book taken
    from his own forehead that Shandagan Sagai, daughter of Esege Malan, is to be
    his bride. He takes a dark gray colt, rides toward the sky, shapeshifts, enters
    a great heavenly yurt, deceives Shandagan, shrinks the yurt, and carries her away
    inside it. Esege Malan's invisible spirits report the theft, and a powerful fool
    with nine hundred armed helpers pursues Varhan. Varhan uses flight and disguise,
    but the fool confronts him; they fight for nine days, and Varhan rises in anger
    from the earth, overturning a large area.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The tale begins with two brothers: the elder is Albat Mergin Hubun, married
    to Deri Sisin, and the younger is Varhan Tulai Hubun, unmarried.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Varhan proposes that the brothers test which of them is stronger.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the shore of the Yellow Sea, the elder brother lifts a stallion-sized stone
    to his girdle and sinks waist-deep, while Varhan sways the stone three times and
    throws it into the sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In an archery test, Albat Mergin's arrow kills a hundred-and-eight-headed,
    thirteen-horned Mangathai by chance, while Varhan's arrow kills two elks beyond
    the twenty-third mountain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Albat Mergin states that Varhan has conquered and may not continue living
    as before.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Varhan cuts open his forehead, removes a book, and reads in it that Shandagan
    Sagai, daughter of Esege Malan, is the most beautiful woman in the world and is
    to be his bride.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Beyond a mountain, a milk-white mare pastures with thirteen asses, and a ninety-fathom
    dark gray colt follows her; Varhan leads the colt home, feeds it for thirty days,
    saddles it, and starts toward the sky.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When his horse becomes tired, Varhan turns it into flint, puts the flint in
    his pocket, turns himself into a wolf, travels until tired, then resumes his own
    form and rides again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Varhan reaches an opening described as the door through the highest point
    in the sky, called Sinbur Ulai Tolgai.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: Beyond the sky door, Varhan finds an immense yurt reaching up to a second
    sky and locates Shandagan Sagai in its seventy-fifth chamber.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Varhan tells Shandagan Sagai that he is the son of Galtun Umri and is seeking
    a bride named Agin Nogon; she makes tea from a silver kettle, and they drink together.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Varhan puts his head on Shandagan Sagai's knees and asks her to look in his
    hair; he falls asleep while she searches his hair, and she suddenly screams.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the scream, Varhan shuts the yurt's seventy-five doors and ninety-five
    chambers, makes the house as small as a little box, puts it on his horse, and
    rides away with Shandagan Sagai inside.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Three invisible Shalmos in Esege Malan's service see that the house, daughter,
    and goods are gone and report this to him.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Esege Malan sees Varhan taking his daughter away and commissions a perfect
    fool to overtake, catch, kill him, and bring back the daughter.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: 'Esege Malan sends nine hundred armed helpers with the fool: three hundred
    with clubs, three hundred with hammers, and three hundred with sharp swords.'
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: When the pursuers gain on him, Varhan rises into the air with his horse; the
    fool also flies and leaves the nine hundred helpers behind.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: During the night, the helpers burn all the trees in the surrounding forest,
    their horses eat all the grass, and the tale says nothing has grown there since.
  category: action
  evidence_refs:
  - ev:13
- id: obs:19
  text: Varhan changes into an old poor man near a spring of pure water, with a hut
    and Shandagan Sagai as a woman sitting inside, but the fool is not deceived.
  category: action
  evidence_refs:
  - ev:14
  - ev:15
- id: obs:20
  text: The fool accuses Varhan of stealing another's daughter, house, and goods,
    and asks what right he had to do it.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:21
  text: Varhan and the fool fight for nine days; the fool throws Varhan over three
    mountain ranges, and after being mocked, Varhan rises angrily from the earth and
    overturns one hundred and fifty acres around him.
  category: sequence
  evidence_refs:
  - ev:16
