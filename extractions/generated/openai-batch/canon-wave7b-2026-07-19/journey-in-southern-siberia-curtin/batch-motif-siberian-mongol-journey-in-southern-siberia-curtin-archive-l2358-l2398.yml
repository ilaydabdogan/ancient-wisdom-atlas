  summary: The first-person traveler reaches Usturdi, pauses collecting work to study
    the language, and prepares for the Horse Sacrifice set for August 2. The passage
    describes the ceremony as a Mongol survival still visible in Buriat country. Andrei
    Mihailovitch gives departure advice that would delay the narrator, but the narrator
    leaves soon after him. The driver delays by stopping for milk and going slowly.
    At the Hill of Sacrifice, seven of nine horses have already been sacrificed; two
    white mares remain, and their deaths are observed.
