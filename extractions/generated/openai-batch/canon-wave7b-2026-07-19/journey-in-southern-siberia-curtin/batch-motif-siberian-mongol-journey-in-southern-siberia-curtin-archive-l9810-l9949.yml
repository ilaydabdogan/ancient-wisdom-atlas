candidate_motifs:
- id: motif:1
  label: Impossible quest journey completed by a miraculous horse
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: The road is described as taking a lifetime or more, yet Hunkuvai's stallion
    carries him the whole way in one day.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives the journey's difficulty and the horse's speed, but
    does not name the journey as an initiation or quest in abstract terms.
- id: motif:2
  label: Steed transformation into a small object
  taxonomy_refs:
  - shapeshifter
  basis: Hunkuvai turns the stallion into a flint chip for the night.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Only this transformation is stated; the mechanism is not explained.
- id: motif:3
  label: Combat of evenly matched superhuman champions
  taxonomy_refs: []
  basis: Hunkuvai and Timur Shi wrestle for three weeks, cannot free themselves from
    one another, and survive later lethal attacks.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: No supplied taxonomy family directly names this duel pattern.
- id: motif:4
  label: Divine intervention unable to kill heroes
  taxonomy_refs: []
  basis: The Burkans send Iron Bull and Hohodai; Iron Bull is injured, and the thunderbolt
    separates but does not kill the combatants.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage presents intervention rather than judgment; no stronger taxonomy
    mapping is assigned.
- id: motif:5
  label: Dismemberment followed by reconstitution through animal transformation
  taxonomy_refs:
  - death_rebirth
  - shapeshifter
  basis: Hunkuvai is cut into seven pieces and covered by mountains; the pieces become
    seven wild bulls and then Hunkuvai again.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not state that Hunkuvai dies, only that he is cut apart
    and restored.
- id: motif:6
  label: External life hidden in distant animals
  taxonomy_refs: []
  basis: Hunkuvai's life is said to be in a black bear, while Timur Shi's life is
    said to be in thirteen skylarks under a stone on Sehir Mai.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage reports the locations of the lives but does not narrate the
    destruction of either life-container in this excerpt.
- id: motif:7
  label: Impossible mountain ascent aided by supernatural steed
  taxonomy_refs:
  - ascent
  - mystical_quest
  basis: Sehir Mai is unreachable by men; the stallion devises and performs a leap
    to the summit with Hunkuvai's assistance.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The ascent is physical and heroic; any broader spiritual reading would
    require evidence outside this passage.
- id: motif:8
  label: Water of Life on a mountain summit
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The Water of Life is found on the summit of Sehir Mai, drunk by Hunkuvai
    and the horse, and then used to bring dead men to life.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The text does not explain the origin of the water or its full range of
    powers.
- id: motif:9
  label: Revival of bones by sprinkling life-giving water
  taxonomy_refs:
  - resurrection
  basis: Hunkuvai scatters Water of Life on bones at the foot of Sehir Mai, and the
    men become alive again.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The revived men are not individually named, and the passage only states
    their collective restoration.
