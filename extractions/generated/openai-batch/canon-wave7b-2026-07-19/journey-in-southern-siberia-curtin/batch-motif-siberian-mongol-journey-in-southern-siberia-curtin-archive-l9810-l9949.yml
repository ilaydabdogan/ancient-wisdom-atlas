canonical_text:
  quote: ''
  summary: Hunkuvai rides a miraculous stallion to challenge Timur Shi. The two heroes
    wrestle and shoot arrows at one another; divine figures fail to kill them. Hunkuvai
    is dismembered and reconstituted, while Timur Shi is wounded and recovers. The
    opponents discuss where their lives are hidden. Guided by his horse, Hunkuvai
    ascends the white mountain Sehir Mai, drinks the Water of Life, carries some in
    his hollow whip handle, and revives the dead men whose bones lie at the mountain
    foot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A stallion appears in the courtyard with a hero's full outfit on its saddle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The khan and the people come to Hunkuvai's yurta, pray to the Burkans, and
    ask for success before the journey.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: People say the road is so long that a child would age to sixty before finishing
    it, and an adult would die while traveling.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hunkuvai's stallion covers sixty paces with each step, increases its stride,
    and completes the journey in one day.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: After being refused lodging at Timur Shi's yurta, Hunkuvai turns his stallion
    into a flint chip and spends the night in a neighboring forest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hunkuvai and Timur Shi wrestle on a high place for three weeks, severely wounding
    each other.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dust and blood from the wrestling make the sun and moon appear red, and
    neither combatant can free himself from the other.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The thousand Burkans send Iron Bull to separate the two champions, but Iron
