  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hohodai tries to kill both heroes with a thunderbolt; the thunderbolt separates
    them but does not kill them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The heroes rest, greet each other, smoke, and agree to shoot arrows from opposite
    mountains.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Timur Shi's arrow cuts Hunkuvai into seven pieces and covers each piece with
    a mountain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The seven pieces of Hunkuvai become seven raging wild bulls, break out from
    under the mountains, and become Hunkuvai again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Hunkuvai's arrow breaks Timur Shi's right forearm and spinal column, but Timur
    Shi rises well and strong again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Timur Shi says Hunkuvai's life is in a black bear beyond the third valley
    on the fourth mountain.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: The stallion says Timur Shi's life is in thirteen skylarks under a flat round
