canonical_text:
  quote: ''
  summary: The Iron Hero fights the Mangathai, survives a weapon contest by transforming
    into stone, kills the Mangathai with a commanded arrow, captures and kills the
    Mangathai's steed, then travels through extreme cold and heat, a regenerating
    forest, a serpent-filled valley, and two lakes including a poison lake.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Iron Hero and the Mangathai fight physically for three days and nights
    without either conquering the other, and their struggle changes hills into valleys
    and valleys into hills.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The two opponents agree to hurl weapons from opposite mountains, with the
    Mangathai on the western border of the sky and the Iron Hero on the eastern border.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Before the Mangathai's axe reaches him, the Iron Hero turns into a jade stone;
    the axe hits the stone but cannot harm it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Iron Hero resumes his own form, takes the Mangathai's axe, and commands
    his arrow to enter the enemy's body, damage organs and bones, and return.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The arrow performs the commanded actions and returns to the quiver.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Mangathai's black steed speaks, says its mother is in the Milk Sea and
    its father is on a high mountain, and flees.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Iron Hero turns a flint into his blue stallion of the sky, and the blue
    stallion pursues and brings back the Mangathai's black steed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Iron Hero kills the black steed with the Mangathai's axe, places a hill
    on the dead Mangathai and another on the dead steed, and puts the blue stallion
    into his breast as a flint.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Iron Hero travels through a cold land while saying it is hot, then through
    a hot land while saying it is cold and that he is almost frozen.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In a dense forest, a broad axe granted after he begs the thousand Burkans
    does not solve the obstacle because the trees cut by day grow back at night.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Iron Hero commands his arrow to cut a broad road through the forest; the
    cut trees do not grow again, and he passes through easily.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Iron Hero sees a broad valley full of serpents, and the serpents say they
    must not let him pass over, under, or through them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Iron Hero turns his car into a flint, turns himself into a yellow, spotted
    serpent, passes through the valley three times to avoid suspicion, exits, restores
    the car, and becomes himself again.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: After realizing that the Iron Hero has passed through them, the serpents become
    angry, bite one another, and fight, with some killed and others themselves bitten
    to death.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: At two lakes, the second of which is poisonous, the blue stallion advises
    going back one day's journey and then jumps over both lakes while carrying the
    Iron Hero.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The end of the blue stallion's tail and the tips of its hind hoofs touch the
    poison water and fall off; the Iron Hero whips and reproaches the horse for not
    clearing the lake completely.
  category: sequence
  evidence_refs:
  - ev:9
