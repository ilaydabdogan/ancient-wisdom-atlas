canonical_text:
  quote: ''
  summary: Sokto crosses frog and snake meadows by disguising himself and his horse,
    overcomes a sky-reaching mountain with help from his speaking stallion and a magic
    tail hair, drinks the Water of Life beneath a precious aspen tree, arrives at
    his father-in-law's yurta disguised as an old man, is chosen by the youngest daughter
    through a marrow-bone bride-choice rite, and during a hunting episode makes goat
    flesh poisonous while the entrails remain curative.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sokto turns his horse into a flint chip and himself into a large black frog
    before crossing a frog-covered meadow over nine days and nights.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The snakes of a second meadow warn one another not to let the traveler pass
    and threaten snakes that allow him through.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sokto turns his horse into a flint chip and himself into a snake, spends seven
    days and nights among the snakes, passes unobserved, and becomes a man again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sokto reaches a mountain that touches the sky, finds large horse and human
    bones at its foot, and weeps for nine days and nights.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The stallion tells Sokto to take a magic hair from its tail, put it under
    his arm, and hold firmly while the horse leaps toward the mountain top.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Sokto throws the hair in front of the horse, the stone at the mountain
    edge disappears and a level road, valley, and forest appear ahead.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the mountain top there is a golden-trunked, silver-leafed aspen tree, the
    Water of Life at its foot, and a silver cup hanging from a branch.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sokto drinks from the Water of Life, gives water to his horse, rests, and
    afterward both he and the horse are stronger.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the boundary of his father-in-law's lands, Sokto makes his horse gray and
    lean and makes himself look decrepit, old, wretched, and white-bearded.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Five splendid young men have come to get brides; the disguised Sokto enters
    the yurta and is mocked by them.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The khan gives his daughters marrow bones to present to chosen bridegrooms;
    four daughters choose four young strangers, while the youngest throws her bone
    toward the old man.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The khan gives fine yurtas to the four young strangers but gives the disguised
    old man and his bride a shed made of hay.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The khan asks the four sons-in-law to kill wild goats; the old man's bride
    asks that her husband also be sent to hunt.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: During the hunt Sokto makes his horse lame, kills one goat after the others
    find no game, and declares the goat's body poison except for the entrails, which
    are the cure.
  category: action
  evidence_refs:
  - ev:12
- id: obs:15
  text: The four young men take the goat flesh to the khan; the bride cooks the entrails
    and finds the khan sick, swollen, and angry after eating meat.
  category: sequence
  evidence_refs:
  - ev:13
