canonical_text:
  quote: ''
  summary: 'The passage presents three philosophical groups addressing spirit and
    existence: one treats spirit as inherent in matter and transient with organisms,
    one believes in a soul distinct from the body, and one links the atom with an
    all-pervading ether identified as spirit. It describes the atom as deathless and
    present everywhere, and the ether as accompanying and supporting atomic aggregation,
    with increasing complexity producing increasing mentality up to cosmic mind.'
