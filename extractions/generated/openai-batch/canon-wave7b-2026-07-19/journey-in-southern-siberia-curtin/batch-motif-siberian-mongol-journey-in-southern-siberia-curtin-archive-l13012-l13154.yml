canonical_text:
  quote: ''
  summary: Hanhai recovers Alamaldjin's shoulder-blade from a fox, restores it to
    his body, pours Water of Life on him, and the cuckoo's song accompanies his revival.
    Alamaldjin soon hunts and is killed by the wife of a Mangathai. Hanhai takes his
    clothing and steed, assumes a male form, tricks and kills the Mangathai woman,
    burns her and her horse, gathers Alamaldjin's severed body, prays to the Heavenly
    Burkans at Red Mountain, and buries him securely. A book reveals that Nalhan Taiji
    Basagan, daughter of Gazar Bain Khan in the west, is the only one who can raise
    him a second time and must marry him. Hanhai disguises herself, encloses her brother's
    country within an iron wall and silver dome hidden under earth, then rides west.
    She reaches a white stone yurta marked by ninety horse skulls and ninety outfits,
    turns her horse into a flint chip and herself into a skunk, enters beneath the
    yurta, and sees a sleeping Mangathai with seven hundred heads and seventy horns.
  language: English
  quote_policy: summarized
