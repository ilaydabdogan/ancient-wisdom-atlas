- id: obs:8
  text: The Mangathai woman distracts Alamaldjin by telling him to look behind him,
    strikes the back of his neck, and his head and body fall on opposite sides of
    the horse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Alamaldjin's horse returns to the hitching-post, neighs loudly, and tells
    Hanhai that the Mangathai's wife has killed her brother in his forest.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Hanhai puts on her brother's dress, mounts his steed, rides to the Mangathai
