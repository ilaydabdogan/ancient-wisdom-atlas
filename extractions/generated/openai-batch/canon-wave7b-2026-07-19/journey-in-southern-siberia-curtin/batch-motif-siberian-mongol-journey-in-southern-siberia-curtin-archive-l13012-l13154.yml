candidate_motifs:
- id: motif:1
  label: Resurrection through restored body parts, life-water, and animal song
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: Alamaldjin is restored after Hanhai replaces his shoulder-blade, pours Water
    of Life on him, and the cuckoo sings along his body until he rises well.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage describes one successful revival and a later promised second
    raising, but does not explain the metaphysics of the Water of Life or the cuckoo's
    song.
- id: motif:2
  label: Devoted sibling rescues and avenges a slain brother
  taxonomy_refs:
  - sibling_pair
  basis: Hanhai restores Alamaldjin, avenges his second death by killing the Mangathai
    woman, buries him, and undertakes the westward search for the only person able
    to raise him again.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  - ev:10
  - ev:13
  - ev:14
  - ev:17
  confidence: high
  cautions: The supplied passage presents them as brother and sister; the locator
    label mentions a twin sister, but the extracted evidence here uses only the passage's
    sibling actions.
- id: motif:3
  label: Animal helper who guards, revives, and promises aid
  taxonomy_refs: []
  basis: The cuckoo guards Alamaldjin, sings during his restoration, is honored at
    home, and promises help whenever need comes.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives the helper role but does not identify the cuckoo as
    divine or explain why its song has power.
- id: motif:4
  label: Shape-shifting and boundary-crossing disguise
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Hanhai changes into a man to deceive the Mangathai woman, later turns her
    horse into a flint chip and herself into a skunk to enter the white stone yurta
    from below.
  evidence_refs:
  - ev:9
  - ev:19
  confidence: high
  cautions: The transformations are literal magical actions in the passage; broader
    symbolic meanings are not specified.
- id: motif:5
  label: Enemy's deception reversed against the deceiver
  taxonomy_refs:
  - trickster_boundary
  basis: The Mangathai woman kills Alamaldjin by making him look behind him; Hanhai
    later uses a similar look-behind ruse against her and decapitates her.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: high
  cautions: This is a local narrative pattern in the episode; no external comparison
