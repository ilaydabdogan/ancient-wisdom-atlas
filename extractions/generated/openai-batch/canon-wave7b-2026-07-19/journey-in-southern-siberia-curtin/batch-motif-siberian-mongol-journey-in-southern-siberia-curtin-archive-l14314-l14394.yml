canonical_text:
  quote: ''
  summary: Notes on Buriat burial belief state that a spirit remains near the body
    for three days and that a dead mother's spirit may hover in mountains and return
    home. The passage then compares a Cherokee belief about a reluctant dead spirit
    journeying west. Further notes discuss the widespread motif of a person's life,
    death, or heart existing apart from the body in Mongol, Buriat, Keltic, Slav,
    Russian, Bengali, Norse, and North American Indian materials. Final notes compare
    Buriat heroic battles that reshape the ground with Gaelic heroic battles, and
    contrast these with Indian myths where supremacy is decided by trials and beheading
    of the loser.
  language: English
  quote_policy: summarized
