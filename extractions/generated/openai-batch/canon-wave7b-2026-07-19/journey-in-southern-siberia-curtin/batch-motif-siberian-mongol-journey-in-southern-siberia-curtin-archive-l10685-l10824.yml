canonical_text:
  quote: ''
  summary: Varhan survives in a lead house while the Burkans destroy a Mangathai child
    with heat. Varhan later journeys toward the sky, is struck down by thunder at
    Esege Malan's command, and the sun and moon fall with him, darkening the world.
    Failed attempts to raise the luminaries lead a wise Burkan to demand Varhan's
    revival and the return of Shandagan Sagai. An eagle carries the Water of Youth
    and Life, revives Varhan, and the sun and moon return. After a wedding feast,
    Varhan sleeps and is stolen by a Mangathai woman. His brother fights a sixty-three-headed
    Mangathai for seven years while Varhan's two sons are born, grow rapidly, become
    marksmen, learn that their father was taken, and force their mother to reveal
    the truth.
  language: English
  quote_policy: summarized
