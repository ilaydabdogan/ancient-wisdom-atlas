  locator: 10691-10696
  quote_or_summary: After nine days Varhan and his brother emerge, burn the Mangathai
    child's body, scatter ashes, take cattle and wealth, and return home; Varhan's
    wife has fled to her father, Esege Malan.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: 10697-10705
  quote_or_summary: On Varhan's second journey to the sky, Esege Malan orders Hohodai
    Mergen to strike him with a thunderbolt; Varhan falls to earth, the sun and moon
    fall with him, and darkness comes everywhere.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 10706-10712
  quote_or_summary: The thousand Burkans tell Esege Malan to send messengers to bring
    back the sun and moon; three hundred heroes with horses and crowbars fail to raise
    them.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 10713-10720
  quote_or_summary: Esege Malan sends seven heavenly smiths with forges and the heroes
    with ninety-pood hammers; they work for a month but accomplish nothing, and darkness
    remains everywhere.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 10721-10728
  quote_or_summary: The Burkans send the wise old Burkan Zarya Azergesha, the hedgehog,
    who tells Esege Malan to bring Varhan to life and give Shandagan Sagai to him
    rather than leave sky and earth in darkness because of his daughter.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 10729-10737
  quote_or_summary: Esege Malan agrees to give his daughter and commands Herdik Shubun,
    the eagle, to take her and a bottle of the Water of Youth and Life to the thunderbolt
    site and pour the water on Varhan's body.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 10738-10741
  quote_or_summary: Khan Herdik obeys; Varhan springs up alive and well, and the sun
    and moon rise to their places in the sky.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 10742-10745
  quote_or_summary: Varhan goes home with his wife, gathers the people, kills sheep
    and cattle, and makes a grand wedding-feast.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 10746-10752
  quote_or_summary: Varhan tells his wife he is tired and wants to sleep four days
    and four nights; she should not rouse him unless evil people come, in which case
    she should strike his left thigh with her fist.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 10753-10764
  quote_or_summary: A Mangathai woman claims to be a neighbor afraid of the dogs and
    is let in; Shandagan serves her tea and honey and leaves briefly, while Varhan
    sleeps behind seven curtains; when Shandagan returns, both the woman and Varhan
    are gone.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: 10765-10770
  quote_or_summary: Albat Mergin follows the woman's trail until he meets a sixty-three-headed
    Mangathai and fights it for seven years; during those years Varhan's wife has
    two sons, Altin Shagoy and Murgun Shagoy.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: 10771-10780
  quote_or_summary: The boys grow very fast; at nine days old a ten-year-old ram's
    skin cannot make either a coat, and they become exceptional hunters and marksmen
    able to hit a mark three versts away.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 10781-10793
  quote_or_summary: After youths ask why the brothers do not rescue their father from
    the Mangathai, the brothers ask their mother whether Varhan was carried off and
    was their father; she answers that he died before they were born, but they do
    not believe her.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: 10794-10811
  quote_or_summary: The brothers plan to lure their mother with false alarms about
    calves sucking the cows dry and water boiling over, then hold her hands in hot
    water until she reveals where their father is.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: 10812-10824
  quote_or_summary: The brothers carry out the plan, seize Shandagan Sagai's hands,
    and hold them in hot water; after an angry first answer, she tells them everything
    because the water is very hot.
  source_text_path: texts/public-domain/buryat-mongol/project-gutenberg/journey-in-southern-siberia-curtin.md
  rights_note: Public domain source; summarized.
