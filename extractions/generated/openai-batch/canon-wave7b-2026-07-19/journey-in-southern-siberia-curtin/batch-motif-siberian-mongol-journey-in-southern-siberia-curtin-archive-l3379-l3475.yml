  text: The narrator wakes while the carriage is jolting and asks where they are;
    the driver answers that they are at Kosaya Steppe, or Crooked Prairie.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At Crooked Prairie the carriage stops before a large gate, enters the yard
    of the People's House after the bell is rung, and the building staff receive the
    traveler.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The People's House has stale air because the windows have not been opened;
    the windows are opened, breakfast is prepared, and a samovar is brought.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vassya and Lazareff are found sleeping in a carriage in the courtyard; after
    they wake, Vassya chooses to remain at Crooked Prairie while the narrator continues
    to Elantsin.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: At Elantsin the narrator is told that horses cannot be obtained until the
