  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Although horses are promised early, the travelers do not start until almost
    noon; the road is rough and dusty.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: As the travelers approach the lake, low unwooded hills with stony summits
