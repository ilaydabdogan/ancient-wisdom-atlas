canonical_text:
  quote: They traveled in the sky till above the mountain where the Water of Youth
    and Life was, and the golden-trunked, silver-leafed aspen tree.
  summary: Gesir Bogdo fulfills marriage-payment conditions by obtaining weapons from
    sky-smiths and gold from his father, marries Gal Tulan's daughter amid long feasts,
    departs with her and her magic cup, travels through the sky to a mountain with
    life-giving water and a precious aspen, and returns to his white stone yurta where
    household conflict leads the new wife to set a horse-transformation condition.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Gesir Bogdo goes to Gal's daughter in the seventy-seventh chamber; she serves
    him sweet milk, curds, and the film of boiled milk, and they eat together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gesir spends the night on a bed described as made of otter and covered with
    a soft sable quilt.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gal Tulan states that the marriage agreement requires Gesir's father to give
    a cart-load of gold and the arms and armor of a warrior.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Gesir goes west and upward to the region of the fifty-five Tengeris, where
    seven sky-smiths are to make warrior arms and armor for him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gesir asks Khan Tyurmas for gold, and Khan Tyurmas gives it because the time
    is short.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gesir pulls a tree up by the roots and ties it to his horse's tail so the
    man carrying the gold can follow the trail it makes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gal Tulan receives the weapons and armor before the gold arrives, and Gesir
    says the gold will arrive before the wedding ends.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gal Tulan invites the thousand Burkans; the Burkans and people dance, eat,
    and drink for nine days, and the load of gold arrives during the feast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: For the departure, a horse for the bride is brought; it is described as ninety
    fathoms long, with ears nine ells high, bay-colored, and bearing a star on the
    forehead.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The bride receives golden scissors from her mother and a silver magic cup
    from her brother.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The silver magic cup has the stated power to draw everything within thirty
    versts toward the bride when she holds it in her right hand and sweeps it toward
    herself.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The bride uses the magic cup and commands everything present to follow; her
    father, mother, yurta, and everything else begin to go with Gesir and the bride.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: 'When the bride looks back after her father''s calls, portions of what is
    following remain behind: first one third, then another third.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Gesir, the bride, and the following company travel in the sky to a mountain
    where the Water of Youth and Life and a golden-trunked, silver-leafed aspen tree
    are located.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: They descend from the sky on a silver stairway, described as looking like
    a ray of sunlight, bringing people, cattle, and herds down to the mountain.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: At Gesir's great white stone yurta, his wife and son are waiting; the son
    asks whether the new bride is for him, and Gesir says she is for himself.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:17
  text: After the people arrive, Gesir holds another wedding feast for nine days and
    nights, then sends the guests back while the cattle remain with him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:18
  text: The old wife quarrels with Gesir and the bride, and the young wife says she
    would rather be with the hundred and nine headed Mangathai than remain in the
    yurta.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:19
  text: The young wife agrees to remain only if Gesir turns into a six-year-old horse
    and eats grass in the field for one day.
  category: speech
  evidence_refs:
  - ev:11
