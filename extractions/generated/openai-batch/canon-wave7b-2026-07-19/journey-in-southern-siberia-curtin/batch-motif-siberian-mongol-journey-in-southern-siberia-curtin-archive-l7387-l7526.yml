candidate_motifs:
- id: motif:1
  label: Mythic marriage exchange with bride-price and feasts
  taxonomy_refs:
  - sacred_exchange
  - sacred_marriage
  basis: The passage centers on fulfillment of marriage terms through gold and warrior
    equipment, followed by repeated nine-day wedding feasts and departure gifts.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  - ev:10
  confidence: medium
  cautions: The passage gives a literal wedding and exchange; the taxonomy label sacred_marriage
    is an interpretive fit and should be reviewed.
- id: motif:2
  label: Ascent to sky craftsmen and descent from the sky
  taxonomy_refs:
  - ascent
  basis: Gesir travels upward to the region of the fifty-five Tengeris to obtain forged
    arms, and later the party descends from the sky by a silver stairway.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: high
  cautions: The passage does not state an initiation or salvific purpose for the sky
    travel.
- id: motif:3
  label: Departure with magical removal and loss after looking back
  taxonomy_refs:
  - departure
  basis: The bride uses the magic cup to make her household and belongings follow
    as she departs; after she looks back, parts of what follows remain behind.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: No explicit prohibition against looking back is stated; the loss occurs
    after the father's calls and the bride's backward glances.
- id: motif:4
  label: Life-giving water and precious tree on a mountain
  taxonomy_refs:
  - cosmic_mountain
  - sacred_tree_axis
  basis: The sky journey reaches a mountain where the Water of Youth and Life and
    a golden-trunked, silver-leafed aspen tree are located.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage names and locates the water and tree but does not show their
    use or explicitly identify the mountain as a world center.
- id: motif:5
  label: Conditional animal transformation requested by bride
  taxonomy_refs:
  - shapeshifter
  basis: The young wife says she will stay with Gesir only if he turns into a six-year-old
    horse and grazes in the field for one day.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage ends with the condition; it does not show whether Gesir actually
    transforms.
- id: motif:6
  label: Supernatural forging of warrior equipment
  taxonomy_refs: []
  basis: Gesir obtains arms and armor from the seven smiths of the sky to satisfy
    the marriage agreement.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: medium
  cautions: No supplied taxonomy reference directly names sky-forging or supernatural
