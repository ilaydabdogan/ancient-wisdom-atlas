canonical_text:
  quote: ''
  summary: Hanhai, acting as or becoming Alamaldjin Bogdo, travels through Mangathai
    territory and defeats several multi-headed Mangathai by magic axe, commanded arrows,
    wrestling, tree confinement, transformation, and burning. She creates and marks
    a sacred forest, crosses between poison and fresh-water seas by changing forms,
    and arrives at a high mountain surrounded by deformed living people, dead bodies,
    bones, and failed climbers.
  language: English
  quote_policy: summarized
