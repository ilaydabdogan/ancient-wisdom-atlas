canonical_text:
  quote: "“that tree or clump of trees to be sacred”"
  summary: The passage describes how shamans may declare beautiful trees or groves
    sacred because Burkans or spirits of dead shamans might favor them. Buriats avoid
    cutting such trees, believing some belong to a Burkan. Cutting a sacred tree may
    cause illness or death. In an example near Usturdi, a Buriat cuts a beautiful
    pine, falls ill, and a shaman divines from a charred sheep shoulder bone that
    the tree belonged to an unidentified Burkan; offerings fail, and the man dies.
  language: English
