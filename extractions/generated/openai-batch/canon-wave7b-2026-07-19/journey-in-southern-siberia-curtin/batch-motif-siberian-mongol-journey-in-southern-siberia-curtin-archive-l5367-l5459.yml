canonical_text:
  quote: ''
  summary: An old Shaman of Olzoni, said to be able to raise the dead, encounters
    Minga Nudite Mila, or Thousand Eyes, after local cattle have been destroyed. When
    his shaman brothers refuse to help, he prepares at home, appears to sleep, and
    in reality rides toward the Angara. From a mountain he sees Minga driving cattle
    over a silver-and-gold bridge. The Shaman becomes a bee, miniaturizes his axe,
    cuts the bridge, and then uses his shaman's gold ring to raise wind and rain.
    Minga swears not to return to Olzoni or kill people or destroy cattle. The Shaman
    returns to his sleeping body, and cattle are no longer stolen; the passage then
    begins a new episode with men burying a dead child.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The story is set in Olzoni and describes an old Shaman, seventy-five years
    old at the time of the event, who was said to be able to raise the dead.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old Shaman visits a neighboring village, where people feast with him for
    three days after killing and roasting sheep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the way home, the Shaman meets three hundred horned cattle, a woman riding
    a red ox and holding an infant, and a large-headed man riding an enormous gray
    stallion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The large-headed man denies being a flesh merchant and identifies himself
    as Minga Nudite Mila, or Thousand Eyes, saying he has destroyed all cattle in
    the surrounding country.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Shaman returns home and finds that none of his cows, sheep, or horses
    remain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Shaman asks his five shaman brothers to pursue Minga Nudite Mila, but
    they say he would not yield because he is subject to no one.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Preparing to act alone, the Shaman makes and drinks tarasun, places his axe
    under his pillow, ties his horse to a post in the yurta, and tells his wife not
    to release the horse or wake him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Shaman and his horse appear to be asleep, but the passage says only their
    bodies are quiet and that in reality the Shaman is riding swiftly toward the Angara.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: From Torkoi Tonkoi mountain, the Shaman sees that Minga Mila has made a bridge
    across the Angara, half silver and half gold, and is beginning to drive cattle
    over it.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Shaman transforms into a bee, makes his axe equally small, flies under
    the bridge, and cuts the pillars so the bridge breaks in two.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The cattle and the woman on the red ox fall into the Angara; Minga Mila also
    falls but does not sink, and he and his gray stallion remain in the water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Shaman throws his gold shaman's ring toward heaven, producing three days
    of dreadful wind followed by three days of strong rain.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: During and after the storm, Minga Mila is driven back and forth on the water;
    his horse loses its hoofs, and after the storm the hoofs return from the river
    and go back onto the horse's feet.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Minga Mila swears a great oath not to go to Olzoni, not to kill people, and
    not to destroy cattle; he invokes the loss of his thousand eyes and the cutting
    of his body if he breaks the oath.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Shaman returns home, rises from the bed where his wife thought he was
    sleeping, unties his horse, and drives it to pasture.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: After this event, the cattle of Olzoni are never stolen again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: About a year later, while traveling to visit friends in Olzonski-Rod, the
    Shaman comes upon three men burying a dead child.
  category: sequence
  evidence_refs:
  - ev:10
