canonical_text:
  quote: ''
  summary: 'The passage describes Buriat marriage customs: the bride''s formal possession
    of household milk and responsibility for tarasun; Balagausk rites involving an
    arrow announcement, meat thrown to village boys, a rapid horseback arrival, covered
    entry to a bed and chair, and a bell hung near the door; post-ceremony visits,
    name-avoidance rules, and playful coughing; a second-day crying and hair-sewing
    rite with a close girlhood friend; and a prohibition on a pregnant bride bowing
    to Ongons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Taking her place at the milk barrel concludes the marriage ceremony and denotes
    that the bride takes formal possession of the milk of the house.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After this act, the bride is described as mistress of the milk; others must
    go to her for it, and making or causing tarasun to be made is her business.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the Balagausk ceremony, a man with a large arrow goes ahead of the bride's
    party, sticks the arrow into a pillar in front of the new home, and announces
    that the bride's party is coming.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the bride's party is near the house, an appointed man throws meat from
    the second joint of a cow, sheep, or horse to village boys who wait to catch it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bride may leave her father's house on horseback or in a wagon, but she
    always approaches the new home on horseback, rides at full gallop, is taken from
    the horse, and is led with covered head and face to a bed and chair.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the faster this arrival and seating are accomplished,
    the greater the bride's good luck will be.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The bride's horse is ornamented with a bell, which is removed, rung, and hung
    on the western post near the door.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the day after the ceremony, women of the village visit the bride; she must
    meet them wearing a cap and handkerchief, must refer to certain persons by relationship
    rather than by name, and the visitors cough outside the door for fun and to confuse
    her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: On the second day of the marriage ceremony, the bride cries with girl friends,
    lies down with her closest friend, and the two sew a tress of each one's hair
    to the other's shoulder.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the hair-sewing, the two clasp each other while girls and boys try to
    pull them apart amid laughter and screaming; the ceremony is explained as showing
    that the married woman will be true to her girlhood friends.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: If a bride is pregnant, she is not permitted to bow down to the Ongons, because
    such an act would bring misfortune to the whole community.
  category: other
  evidence_refs:
  - ev:8
