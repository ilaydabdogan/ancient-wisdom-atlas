canonical_text:
  quote: ''
  summary: Sokto punishes a Mangathai and a woman at a crossroads, returns to his
    father's holdings, releases a red bull, retrieves Yerente's bones from a cask
    in the Black Sea, revives him with waters, juniper incense, and Water of Life,
    reunites the household, moves buildings to the boundary by prayer, reads a book
    of life from his liver to identify his bride, prepares his horse, exchanges life-signs
    with his sister Aglii, and departs with communal blessing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sokto takes the Mangathai and a woman to a place where three roads meet, with
    a pine on one side and a larch on the other.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sokto nails the Mangathai to the larch with ninety-five spikes and the woman
    to the pine with ninety-five spikes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sokto leaves casks, a dull knife, and blunt scissors and writes instructions
    that passers-by must cut flesh from the two captives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sokto overturns the Mangathai's yurta, drives away the cattle, and returns
    to his father's yurta and birthplace.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A red bull is confined in an iron storehouse and thanks Sokto when he is released
    to graze.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sokto goes to Hara Dalai, the Black Sea, where his father's body is in a cask,
    and changes himself into a large fish.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Sokto addresses a larger fish, the sea storms three times in three days
    and throws the cask out of the water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sokto opens the cask, finds bones, washes them with water from nine springs,
    burns juniper from nine places, and washes the bones with Water of Life for three
    nights.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Yerente becomes alive and as well as before.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The red stallion reproaches Yerente, seizes him by the neck, and shakes him
    three times.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: After Sokto prays to the Heavenly Burkans from evening until midnight, every
    building is found on the boundary the next morning.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sokto opens his midriff, finds a book in his liver, reads it for three days
    and nights, and learns that Goye Gohun Dune is his bride.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Sokto strengthens the red stallion's hoofs by keeping him three days and nights
    on ice and then three days and nights on sand.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: 'Sokto gives Aglii signs of his condition: a golden-trunked aspen with silver
