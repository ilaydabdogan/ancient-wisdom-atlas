candidate_motifs:
- id: motif:1
  label: Life located outside the body in animals
  taxonomy_refs: []
  basis: The passage says Hunkuvai's own life was in a black bear, and Timur Shi dies
    immediately after Hunkuvai strangles the three skylarks that Timur Shi calls sacred.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage explicitly states Hunkuvai's life is in the black bear, but
    it does not explicitly say Timur Shi's life is in the skylarks; that link is inferred
    from the immediate sequence.
- id: motif:2
  label: Quest object hidden under a sealed stone
  taxonomy_refs:
  - mystical_quest
  basis: Hunkuvai must overcome the great flat round stone before he can access the
    skylarks beneath it.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The larger quest context is outside this excerpt; the passage gives the
    action but not the full prior instructions.
- id: motif:3
  label: Obstacle broken by fire, rain, and divine aid
  taxonomy_refs:
  - mystical_quest
  basis: Hunkuvai heats the stone red hot with fire and asks the thousand Burkans
    for rain; when rain comes, the stone splits.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents the successful action literally; any broader cosmological
    interpretation would require additional context.
- id: motif:4
  label: Restorative Water of Life
  taxonomy_refs:
  - death_rebirth
  basis: Hunkuvai keeps Water of Life in his whip handle and gives it to the barely
    living gray steed, after which he leads the steed out.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The horse is described as barely living, not dead, so this is restorative
    rather than an explicit resurrection.
- id: motif:5
  label: Return with rescued steed, wealth, and followers
  taxonomy_refs:
  - return
  basis: After defeating Timur Shi, Hunkuvai takes the gray steed, wealth, flocks,
