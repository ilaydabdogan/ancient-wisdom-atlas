canonical_text:
  quote: ''
  summary: Hunkuvai splits a great round stone with fire and divinely sent rain, obtains
    skylarks and Water of Life, kills sacred skylarks that cause Timur Shi to die,
    burns Timur's remains, rescues the gray steed with round head, and returns with
    spoils. Meanwhile Hunkuvai's uncle Hara Zaton plots to seize power, deceives Shik
    Shuri about danger to her newborn twin sons, and later poisons Hunkuvai during
    a holy-mountain libation feast. Hunkuvai falls lifeless with colored flames from
    his nostrils; on the third day he raises his head while Hara Zaton waits with
    a drawn bow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hunkuvai cannot lift the great flat round stone, heats it with fire until
    red hot, asks the thousand Burkans for rain, and the rain splits the stone into
    four pieces.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the stone splits, Hunkuvai lifts one piece, catches thirteen skylarks,
    kills ten, puts three in his pocket, and refills his whip handle with the Water
    of Life.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hunkuvai goes toward the fourth mountain, where the passage says his own life
    was in a black bear, and he knows Timur Shi is going there.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Near the mountain Hunkuvai sees a light and finds Timur Shi lying with his
    back toward a fire; Timur Shi says he is sick and asks Hunkuvai where he has been
    and what he has done.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Timur Shi says the skylarks are sacred and asks for them; Hunkuvai stretches
    out his hand while strangling the three skylarks, and Timur Shi immediately drops
    dead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Hunkuvai piles wood, burns Timur Shi Bain Khan, breaks his larger bones fine,
    and scatters the remains to the winds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hunkuvai searches Timur Shi's yurta and eventually finds the gray steed with
    round head in a stable made of three iron walls, one within another.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The gray steed can hardly stand and is barely living; Hunkuvai gives it Water
    of Life from his whip handle and leads it out of the iron stable.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hunkuvai takes Timur Shi's silver, gold, flocks, cattle, thirty-three heroes,
    and people, sends them toward his own yurta, and returns home by magic while leading
    the gray steed and riding his own stallion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: On the way home Hunkuvai rests at the great Shaman place Huhai Hubshi.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: While Hunkuvai is returning, Shik Shuri gives birth to twins named Huragin
    and Isbegin.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Hara Zaton, whom Hunkuvai had left to manage matters in his absence, had hoped
    Hunkuvai would not return and that he himself would manage and possess everything.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Hara Zaton prepares concentrated tarasun and meat, including portions mixed
    with strong poison, and carries them in saddlebags.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Hara Zaton tells Shik Shuri that Hunkuvai seems to have been killed and that
    enemies are coming, and he asks for the two little boys so he can hide them in
    safety.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Shik Shuri says the boys are in the cradle and only three days old, and asks
    to keep them until the next day; Hara Zaton threatens to kill her if she feeds
    them badly or hides them while he is gone.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Hara Zaton rides to the Shaman Mountain, where he meets Hunkuvai, greets him,
    and stretches out his hand; Hunkuvai does not take it.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:17
  text: Hara Zaton tells Hunkuvai that two sons have been born to him and argues that
    passing a holy mountain without pouring a libation would be a sin; Hunkuvai stops
    because of his sons.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: Hara Zaton embraces and kisses Hunkuvai; they pour a libation of good tarasun
    and eat and drink, while Hara Zaton drinks very little and only pretends to drink.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: Hara Zaton brings the poisoned meat and drink; Hunkuvai eats and drinks, drops
    down without life or motion, and colored flames come from his nostrils.
  category: action
  evidence_refs:
  - ev:11
- id: obs:20
  text: Hara Zaton sits at a distance with a drawn bow, ready to shoot if Hunkuvai
    revives; on the third day Hunkuvai raises his head somewhat and sees him waiting
    with the bow.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
