canonical_text:
  quote: ''
  summary: The narrator prepares to leave Hogotskaya for Olkhon, receives goodwill
    and practical assistance from the district chief, and begins a night journey with
    Vassya and Lazareff. The party travels by three-horse carriages through ridges,
    valleys, woodland, meadows, and station stops. The narrator reflects on the pleasures
    and hardships of travel, especially the role of purpose and human conduct, then
    departs alone toward Kosaya under a moonless, starry sky while the companions
    wait for horses.
  language: English
  quote_policy: summarized
