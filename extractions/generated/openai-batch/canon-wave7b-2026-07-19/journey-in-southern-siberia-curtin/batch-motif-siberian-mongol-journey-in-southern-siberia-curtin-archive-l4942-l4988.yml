canonical_text:
  quote: ''
  summary: 'The passage describes Buriat rules concerning the white-headed eagle and
    sacrifice to eagle ancestors, then describes funerary practices: usual cremation,
    occasional coffin burial called Russian burial, winter storage of bodies in a
    forest structure until the first cuckoo call, killing of the horse that conveyed
    the body, burning of grave goods, and the absence of a shaman at the cremation
    ceremony.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A white-headed eagle is not permitted to be killed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If an eagle alights on and scratches a sheep or lamb, the owner kills that
    animal immediately.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Buriats are said not to sacrifice to the eagle itself, but to its ancestors,
    called the ancients of eagles.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The eagle ancestors are represented in some cases as people and in other cases
    as birds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Buriats usually burn their dead, though they sometimes use a coffin-and-ground
    burial called Russian burial.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: For an autumn or winter death, the body is placed on a sled and drawn by the
    deceased person's most valued horse to a secluded forest place.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: At the forest place, a house of fallen trees and boughs is built around the
    body and encircled with log walls to keep animals out.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The horse that drew the body is led away a short distance, killed with an
    axe blow to the head, and left for wolves to devour.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: If the deceased person lacked a horse but had a cow, the cow is sold and a
    horse is bought; if no horse can be bought, the body is carried on a stretcher.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Other persons who die during winter may be placed in the same forest house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Winter bodies remain in the forest house until the first cuckoo calls, about
    the ninth of May.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Relatives and friends then assemble and burn the unopened house to the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Persons who die during the summer are carried to the forest, placed on a funeral
    pile, and burned immediately; the horse is killed as in the winter rite.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ornaments, valued trinkets, and best garments are often burned with the dead,
    while ordinary garments are left to heirs.
  category: object
  evidence_refs:
  - ev:9
- id: obs:15
  text: A shaman does not officiate at the cremation ceremony, which is conducted
    as quietly as possible.
  category: action
  evidence_refs:
  - ev:10
