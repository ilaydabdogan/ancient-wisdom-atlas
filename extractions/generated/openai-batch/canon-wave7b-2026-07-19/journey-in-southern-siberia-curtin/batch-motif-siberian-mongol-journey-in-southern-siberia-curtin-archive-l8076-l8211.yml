canonical_text:
  quote: ''
  summary: Two heroes find the Iron Hero in the form of a wounded old man, fight him
    for nine days, imprison him in an iron barrel, and roll him into the Black Misty
    Sea. A white cuckoo and ninety mad wolves rescue and restore him from a skeleton.
    The Iron Hero resumes his old-man form, returns to the khan to claim the khan's
    daughter, disrupts the wedding arranged with another hero, soils the chamber with
    milk, and causes the khan to summon Milen Buhe to fight him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The two heroes follow the khan's direction to a hilltop square and find the
    old man asleep and snoring.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man says his sores came from a venomous yellow serpent and that his
    boils came from being struck by Hohodai Mergen, identified parenthetically as
    thunder.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The heroes say the old man's life hangs on a red silk thread and threaten
    to break his back and pull off his head.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old man and the two heroes wrestle for nine days and nights, making holes
    and dust where feet press and tearing flesh from one another while crows gather
    and comment.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the tenth day the old man becomes powerless; the heroes put him in an iron
    barrel with ninety-five hoops and roll him into the Black Misty Sea.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Before fainting, the old man says a white cuckoo as large as a horse's head
    and ninety mad wolves will come to save him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After three days and nights the cuckoo and wolves reach the Black Misty Sea;
    the cuckoo flies along the shore three times singing, after which the sea vanishes
    into the earth and nearby grass withers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The wolves gnaw off the ninety-five hoops, the cask falls apart, and the Iron
    Hero's skeleton is carried to the cuckoo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The cuckoo sings from the Iron Hero's feet to his head three times; flesh
    returns, he nearly breathes, and then he springs up alive.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Iron Hero says he avoids going to the khan in his youthful real form because
    the khan would assign deadly tasks, and he says his bride knows what he is doing.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Iron Hero returns to the khan for the daughter while a wedding is being
    held for her and the younger of the two heroes; the two heroes flee when they
    see him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the khan's order the old man is given milk in a dog trough; he raises it
    as if to drink and lets the milk run over himself and onto the chamber floor.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The khan sends for Milen Buhe, promising his daughter if Milen conquers the
    old man, whom the khan describes as a terrible wizard.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Before Milen Buhe reaches the khan's yurta, the old man goes with his car
    to the Bronze and Silver Square on the hilltop and falls asleep as before.
  category: sequence
  evidence_refs:
  - ev:11
