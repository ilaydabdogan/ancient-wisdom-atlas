canonical_text:
  quote: ''
  summary: 'The passage recounts the origin of Buriat shamans: a spirit associated
    with the fifty-five Tengeris enters a hailstone swallowed by the thirteen-year-old
    Meluk Shin, who bears Mindhi/Qolongoto Ubugun. Mindhi establishes Buriat religion,
    consecrates the first shamans, and commands prayer to heavenly spirits. Later
    sections describe inherited and direct shamanic selection by Burkans, nocturnal
    spirit-journeys to Burkan mansions for instruction, initiation blows to the forehead,
    libations and offerings, trials, and birch-stick actions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the fifty-five Tengeris came from a named primordial divine
    context involving Baronye Tabin Tabling Tengeri and Delquen Sagan Burkan/Esege
    Malan.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The spirit of one of the fifty-five Tengeris entered a hailstone, fell to
    earth, and was swallowed by Meluk Shin, a girl thirteen years old.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After swallowing the hailstone, Meluk Shin became a mother and bore Qolongoto
    Ubugun, also called Mindhi Qiibun Iryil Noyon Tunkoi, who lived three hundred
    years.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Mindhi established the Buriat religion, gave the Buriats their prayers, and
    told them of their gods; the collector adds a translator's Christian comparison
    for Mindiu.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mindhi chose and consecrated the first one hundred seventy-six Shamans, ninety-nine
    male and seventy-seven female, and was said in a sense to be the first Shaman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mindhi commanded prayer to heavenly spirits, but the passage says later shamans
    sometimes pray to spirits of dead shamans and to Bumal Burkans.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Mindhi's portrait is always made of skunk skin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage distinguishes shamans made directly by Burkans from shamans whose
    right is inherited through the male or female family branch.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A child or young person with inherited right is acceptable when a dead shaman
    relative comes during sleep, takes the person's spirit to Earthly and Heavenly
    Burkans, and the Burkans show and instruct the spirit in their mansions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: For someone selected directly, the spirit of a shaman who died within four
    or five years comes at night, conducts the person's spirit to the Burkans, and
    the spirit returns to the body in the morning.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the education is finished, the spirit of the Shaman appears in the form
    of a flame, strikes the student heavily on the forehead, and the student falls
    to the ground.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After the forehead blow, people raise the student, and tarasun is sprinkled
