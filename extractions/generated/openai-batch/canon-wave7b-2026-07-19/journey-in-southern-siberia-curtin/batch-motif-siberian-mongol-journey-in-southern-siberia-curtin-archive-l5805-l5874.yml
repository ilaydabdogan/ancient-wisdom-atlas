canonical_text:
  quote: ''
  summary: The passage describes outside Ongon bags containing skins, tin images,
    and cloth figures representing shamanic or divine figures petitioned for crops,
    rain, cattle affairs, healing, and other needs. It then recounts a creation account
    in which Esege Malan and his wife exist at the beginning; Esege makes the sun
    and moon from moisture squeezed from earth, creates living things and plants,
    divides the world into East and West, and assigns it to strict higher gods. The
    passage also describes divine punishment, bird or swan gods of the Southwest,
    seasonal offerings, and an intermediate order of Burkans.
  language: English
  quote_policy: summarized
