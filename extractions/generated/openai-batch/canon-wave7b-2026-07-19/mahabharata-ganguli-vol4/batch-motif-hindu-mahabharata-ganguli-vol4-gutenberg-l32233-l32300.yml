canonical_text:
  quote: '"Do thou worship the deities duly by performing the horse-sacrifice with
    profuse gifts."'
  summary: The Pandavas enter Hastinapura with the Vrishnis, honor Dhritarashtra,
    Gandhari, Kunti, Vidura, and others, and later receive Vyasa. Yudhishthira asks
    Vyasa for permission to devote brought treasure to the horse-sacrifice. Vyasa
    grants permission and says the sacrifice cleanses sins. Yudhishthira then addresses
    Krishna/Vasudeva with praise and asks him to undergo initiation and perform the
    sacrifice; Krishna instead approves Yudhishthira’s performance of the rite and
    offers to carry out any appointed task.
  language: English
  quote_policy: quoted
