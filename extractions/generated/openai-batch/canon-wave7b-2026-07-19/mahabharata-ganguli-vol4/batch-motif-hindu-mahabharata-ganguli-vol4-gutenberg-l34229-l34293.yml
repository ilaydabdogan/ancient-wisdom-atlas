canonical_text:
  quote: ''
  summary: Rishis praise lawful, non-injurious sacrifice and speak to Agastya about
    sacrificial rites. Purandara responds to Agastya's penances with timely rain until
    the sacrifice is completed. Janamejaya then asks about a golden-headed mongoose
    with a human voice. Vaisampayana explains that Jamadagni was tested when Dharma,
    in the form of Anger, spoiled milk set aside for a Sraddha. Jamadagni remained
    forgiving, Anger was cursed by the Pitris into mongoose form, and the curse ended
    after the mongoose censured Yudhishthira's sacrifice by referring to powdered
    barley.
  language: English
  quote_policy: summarized
