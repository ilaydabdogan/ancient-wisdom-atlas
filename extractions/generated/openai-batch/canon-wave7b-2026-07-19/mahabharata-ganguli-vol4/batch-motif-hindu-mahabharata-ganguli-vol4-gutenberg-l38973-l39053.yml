canonical_text:
  quote: '"Wonderful is the course of fate!"'
  summary: After the people leave Dwaraka, the ocean floods the city. Arjuna escorts
    the Vrishni women and other survivors, but raiders attack the procession. Arjuna’s
    former martial power and celestial weapons fail, many women are taken, and he
    attributes the disaster to destiny. He resettles the remaining Vrishnis, some
    widows enter the forest or ascend the funeral pyre, and Arjuna goes tearfully
    to Vyasa’s retreat.
  language: English
  quote_policy: quoted
