canonical_text:
  quote: Do thou accept a boon from me.
  summary: 'Chyavana offers Kusika a boon and asks him to state his doubt. Kusika
    asks Chyavana to explain the purpose behind a series of puzzling acts: staying
    in his palace, sleeping immobile for twenty-one days twice, leaving silently,
    becoming invisible and visible again, going out after being oiled for a bath,
    consuming collected food with fire, riding through the city on a car, giving away
    wealth, showing a Yoga-created forest and golden jeweled mansions, and making
    those wonders vanish.'
  language: English
  quote_policy: quoted
