canonical_text:
  quote: ''
  summary: Bhangaswana, formerly a king but now living as an ascetic woman, laments
    the deaths of two hundred sons. Indra, disguised as a Brahmana, questions her
    and then reveals himself as the deity offended by a prior sacrifice that did not
    honor him. After Bhangaswana asks pardon, Indra offers to revive either the sons
    begotten in Bhangaswana's male state or the sons borne in the female state. Bhangaswana
    chooses the latter, citing greater affection as a woman. Indra revives all the
    children and offers a further choice between male and female status. Bhangaswana
    chooses to remain a woman, and Indra assents and returns to heaven.
  language: English
  quote_policy: summarized
