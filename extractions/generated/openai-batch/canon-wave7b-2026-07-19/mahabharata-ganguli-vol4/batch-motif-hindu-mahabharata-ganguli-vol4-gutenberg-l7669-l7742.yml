canonical_text:
  quote: ''
  summary: A first-person speaker recalls forcibly bringing two maidens for Vichitravirya
    and then recounts legal and moral instruction from Valhika and Prince Satyavat
    on whether marriage is established by dowry, sale, guardianly gift, hand-taking,
    or formal rites. The passage culminates in ritual prescriptions involving gift
    with water, the seventh step, fire, and circumambulation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person speaker says he defeated the Magadhas, Kasis, and Kosalas
    and brought away two maidens by force for Vichitravirya.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One of the two maidens was wedded with due rites; the other was not formally
    wedded because the dowry was considered to have been paid in the form of valour.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Valhika said the maiden who had not been wedded with due rites should be set
    free, and she was recommended to Vichitravirya for marriage according to due rites.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first-person speaker sought opinions and repeatedly asked to know the
    practices of righteous people concerning marriage.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Valhika states that the husband-wife status arises from actual bestowal or
    taking of the maiden's hand with due rites, not merely from gift and acceptance
    of dowry.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Valhika rejects the sale or purchase of wives and says a father should not
    sell his daughter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A group asks Prince Satyavat whether another person may marry a maiden if
    a dowry-giver dies before the marriage occurs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Satyavat answers that the maiden's kinsmen should bestow her on an eligible
    person and that the righteous disregard the dowry-giver in this matter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Satyavat reports that some allow a virgin-widow to unite with the husband's
    younger brother or another relation, or to practice penances, while others deny
    that this practice is scripturally ordained.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Satyavat says that even after a maiden's hand has been promised and initial
    rites performed, she may be bestowed on another; the giver incurs falsehood, but
    wife-status is not injured.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that marriage mantras accomplish their object at the seventh
    step, that the maiden becomes wife of the one to whom she is gifted with water,
    and that the wedding should occur in the presence of fire with due rites and circumambulation.
  category: sequence
  evidence_refs:
  - ev:7
