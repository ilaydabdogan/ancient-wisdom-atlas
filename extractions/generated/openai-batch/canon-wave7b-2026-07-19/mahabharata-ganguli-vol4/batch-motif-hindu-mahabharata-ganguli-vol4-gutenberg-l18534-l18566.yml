canonical_text:
  quote: ''
  summary: Vayu teaches ritual duties and transgressions. He describes rainy-season
    offerings to Pitris, a Brahmana, and the sacred fire, and states their merit.
    He warns against allowing a Sudra to ignite a sacrificial fire or allowing incompetent
    women to assist at Sraddha rites, gives consequences for such sin, and prescribes
    fasting and cow-substance libations as expiation, leading to restored acceptance
    by deities and Pitris and eventual heaven.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vayu says he will recite duties that bring happiness to mankind and also certain
    transgressions with their secret causes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man is described as offering sesame and water to the Pitris during the four
    months of the rainy season and giving food to a Brahmana versed in duties.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same observant man pours libations on the sacred fire, offers rice boiled
    in sugared milk, and gives lamps in honour of the Pitris with sesame and water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that such observance with faith and concentrated attention
    acquires merits equal to a hundred animal sacrifices to the deities.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man who approves a Sudra igniting the fire for libations, or permits incompetent
    women to assist at Sraddhas and other rites, becomes stained with sin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The three sacrificial fires become enraged with the transgressor.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The transgressor is said to be born as a Sudra in his next life, and his Pitris
    and the deities are never gratified with him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The prescribed expiation is to fast for three days and pour on the sacred
    fire a libation of cow urine mixed with cowdung, milk, and ghee.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After a full year the deities accept the offerings of the expiated man, and
    his Pitris become gratified when Sraddha is performed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Men who avoid the transgressions or perform the expiations after committing
    them are said to attain heaven when they leave the world.
  category: sequence
  evidence_refs:
  - ev:6
