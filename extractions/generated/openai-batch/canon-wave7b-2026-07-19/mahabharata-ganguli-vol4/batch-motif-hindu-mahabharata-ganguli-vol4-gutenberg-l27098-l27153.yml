canonical_text:
  quote: ''
  summary: Yudhishthira asks how a king gained power and wealth. Vyasa answers by
    recounting rivalries among divine and priestly figures, Samvarta's ascetic withdrawal,
    Indra's appointment of Vrihaspati as priest, the power and bodily ascent of Karandhama,
    the royal succession to Avikshit and Marutta, and Indra's attempt to prevent Vrihaspati
    from serving Marutta. Vrihaspati refuses to leave Indra's service for a mortal
    king, after which Indra is pleased and returns home.
  language: English
  quote_policy: summarized
