  quote: ''
  summary: Bhishma instructs Yudhishthira on the highest forms of gift-giving, aid
    to distressed persons, reverence toward Brahmanas and other self-controlled recipients,
    and the ritual merit of gifts. He describes giving as sin-cleansing, as a sacrifice
    with Dakshina, and as a means of satisfying obligations to deities and ancestors.
  language: English
