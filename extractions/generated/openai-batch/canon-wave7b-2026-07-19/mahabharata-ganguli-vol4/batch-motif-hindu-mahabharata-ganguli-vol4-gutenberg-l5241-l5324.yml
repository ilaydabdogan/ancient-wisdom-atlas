canonical_text:
  quote: ''
  summary: Bhishma instructs Yudhishthira on recipients of gifts that produce great
    merit, especially impoverished, dispossessed, vow-observant, or needy Brahmanas.
    He then lists acts said to lead to hell, including falsehood except in limited
    protective cases, sexual wrongdoing, theft, destruction of public resources, cheating
    vulnerable women, social disruption, irreverence toward the Vedas, vow-breaking,
    usury, gambling, slaughter, neglect of household and ritual obligations, improper
    livelihoods, and obstruction of Brahmanas, cows, and maidens.
  language: English
  quote_policy: summarized
