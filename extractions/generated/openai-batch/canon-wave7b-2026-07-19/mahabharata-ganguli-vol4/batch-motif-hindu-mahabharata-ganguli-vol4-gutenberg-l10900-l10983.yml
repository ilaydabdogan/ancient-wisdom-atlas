canonical_text:
  quote: ''
  summary: Nachiketa recounts Yama's teaching on gifts of kine and substitute cow-gifts
    made from ghee, sesame seeds, or water. Yama describes heavenly rivers and regions
    gained by such gifts, prescribes proper recipients, vows, and timing, and praises
    kine as world-sustaining, sin-cleansing, and comparable to sun-rays.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nachiketa asks Vaivaswata/Yama what substitute objects can be given when actual
    kine are not available, so that givers may attain the regions reserved for cow-givers.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yama says that giving a cow made of ghee, while observing a vow, grants access
    to rivers of ghee that approach the giver like an affectionate mother approaching
    a child.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yama says that giving a cow made of sesame seeds enables the giver, with that
    cow's assistance, to pass over calamities and later enjoy rivers of milk.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yama says that giving a cow made of water leads to happy regions and to a
    cool, transparent, wish-fulfilling river of water.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Nachiketa identifies himself as Yama's guest and says that his earlier curse
    became a blessing because it allowed him to see the king of the dead and the rewards
    of gifts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Nachiketa resolves to practise the duty of gift without doubt about its rewards.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yama instructs that gifts should be made to deserving persons when time and
    place are suitable, and he especially urges gifts of kine.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: High-souled persons of old are described as making gifts of kine, purifying
    their souls, attaining heaven, and shining with effulgence.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: On Kamyashtami, a properly acquired cow should be given to eligible Brahmanas,
    followed by ten days of subsisting only on cow milk, dung, and urine.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: 'Different gifts involving kine are assigned distinct rewards: a bull equals
    the divine vow, a pair of kine brings mastery of the Vedas, vehicles yoked with
    kine bring merit of sacred-water baths, and a Kapila cow cleanses sins.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Kine are said to yield milk, rescue all worlds from calamity, and produce
    the food on which creatures subsist.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: A person who knows the service of kine yet has no affection for them is called
    a sinner certain to sink in hell.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Even a single properly given cow that bears good calves is said to approach
    the donor in heaven as a sacred, wish-fulfilling river of water.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:14
  text: Kine are compared to the rays of the sun, and the giver of a cow is said to
    shine like a second sun.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:15
  text: A disciple is instructed to select a preceptor in the matter of making gifts
    of kine, and an eligible Brahmana should be chosen to receive a legitimately acquired
    cow.
  category: action
  evidence_refs:
  - ev:13
