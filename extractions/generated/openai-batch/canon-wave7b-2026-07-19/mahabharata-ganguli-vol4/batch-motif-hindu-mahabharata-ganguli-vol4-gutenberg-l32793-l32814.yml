canonical_text:
  quote: ''
  summary: Dussala asks Dhananjaya to spare a bereaved child and restrain his wrath.
    Dhananjaya grieves, blames Duryodhana for the slaughter of his kin, comforts Dussala,
    and becomes inclined to peace. Dussala orders her warriors to stop fighting and
    returns home. Arjuna then follows the sacrificial horse as it wanders through
    realms, in a simile comparing him to the divine wielder of Pinaka pursuing a deer
    through the firmament, until the horse reaches Manipura.
  language: English
