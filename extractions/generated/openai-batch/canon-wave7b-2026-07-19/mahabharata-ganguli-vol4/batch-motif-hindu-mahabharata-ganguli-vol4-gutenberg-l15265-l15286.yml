  quote: ''
  summary: Yudhishthira asks Bhishma to explain the highest penances. Bhishma answers
    that felicity corresponds to the penance performed and says abstention from food
    is supreme. He introduces an ancient discourse in which Brahman asks Bhagiratha
    how he reached an extremely difficult region beyond those of deities, kine, and
    Rishis, since even divine and human beings cannot reach it without severe austerities.
