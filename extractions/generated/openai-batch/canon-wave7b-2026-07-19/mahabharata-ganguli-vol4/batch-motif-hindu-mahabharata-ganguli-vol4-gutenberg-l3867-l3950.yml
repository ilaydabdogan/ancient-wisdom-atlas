canonical_text:
  quote: ''
  summary: A hymnic sequence addresses a deity in the second person, enumerating attributes,
    forms, possessions, acts, and cosmic identifications. The deity is described as
    lord of luminaries, protector of devotees and Yogins, conqueror of desire, ascetic,
    dancer, bearer of a bull standard and trident, master of deities and Asuras, upholder
    and life-giver, embodiment of scriptures and mantras, root of the world tree,
    source of time, form of death, slayer of an elephant-form Asura attacking Varanasi,
    and giver of results according to merit.
  language: English
  quote_policy: summarized
