canonical_text:
  quote: ''
  summary: Maheswara praises Hari, also called Krishna and Govinda, as supreme, cosmic,
    creator and destroyer, abode and source of gods, luminaries, Rishis, and worlds.
    He says Hari will take human birth in Manu's righteous lineage, eventually in
    the Yadu line as Vasudeva, for the purposes of the deities, and will defeat enemies
    and liberate imprisoned kings.
  language: English
  quote_policy: summarized
