canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma how a maiden's father or kinsmen should act if
    dowry has been given for her and the giver departs. Bhishma replies with rules
    about maintaining the maiden, return or non-return of dowry, her relation to the
    absent giver, and scriptural limits on remarriage. He cites Savitri's self-choice
    of a husband as a disputed precedent, then invokes Sukratu of Janaka's line, scriptural
    authority, righteous usage, and the subtle relation of husband and wife. Yudhishthira
    then asks about inheritance when men have daughters, asserting that a daughter
    should be regarded like a son in relation to her father.
  language: English
  quote_policy: summarized
