  quote: ''
  summary: 'The footnotes explain that a person becomes righteous or unrighteous through
    personal deeds or by inducing or helping others to act. They distinguish eternal
    and non-eternal results of righteousness: nishkama righteousness leads to Brahma,
    while sakama righteousness leads to heaven and felicity, which are not eternal.'
