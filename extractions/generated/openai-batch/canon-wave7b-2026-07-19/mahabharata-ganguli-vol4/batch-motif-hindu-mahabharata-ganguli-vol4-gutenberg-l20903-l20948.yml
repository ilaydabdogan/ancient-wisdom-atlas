canonical_text:
  quote: Thou art identical with Eternal Brahma.
  summary: Narada describes storm, rain, darkness, and the disappearance of Mahadeva's
    ghostly attendants after Mahadeva's speech on a sacred celestial mountain. The
    Rishis are amazed, recall a former wonder of Mahadeva, and identify Krishna with
    Eternal Brahma. Bhishma then reports that Krishna honors the Rishis, who praise
    his manifested sight, acknowledge his omniscience, disclose the mystery to please
    him, take leave, and bless him with a future son of great power.
  language: English
  quote_policy: quoted
