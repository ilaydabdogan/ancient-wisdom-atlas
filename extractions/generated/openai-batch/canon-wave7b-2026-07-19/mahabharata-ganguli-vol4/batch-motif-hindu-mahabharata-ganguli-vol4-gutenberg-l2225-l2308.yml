canonical_text:
  quote: I solicit boons from that great Deity named Siva
  summary: Upamanyu, speaking to Indra under several epithets, declares that he seeks
    boons from Siva/Mahadeva. He praises Siva as beyond categories, as Supreme Soul,
    source of knowledge and power, creator of Brahma, the primeval egg, elements,
    gods, sacrifice, cosmic regions, and beings. The passage also presents Siva as
    pervading the worlds and mountains, empowering or chastising beings, producing
    a golden mountain from seed poured on fire, sharing half his body with his spouse,
    subduing Kama, and sporting in the crematorium with ghosts and spirits.
  language: English
  quote_policy: quoted
