canonical_text:
  quote: ''
  summary: Yudhishthira is initiated for the horse-sacrifice, the sacrificial horse
    is released according to scriptural injunctions, and Arjuna prepares to follow
    it with Gandiva. The people of Hastinapore gather, bless Arjuna's departure, and
    anticipate his safe return. The horse roams across the Earth, and many battles
    arise between Arjuna and various kings and peoples.
  language: English
  quote_policy: summarized
