canonical_text:
  quote: ''
  summary: A didactic passage condemns unnecessary meat-eating and distributes responsibility
    for slaughter among killers, buyers, arrangers, approvers, cooks, and eaters.
    It distinguishes Vedic, mantra-sanctified sacrificial meat from flesh obtained
    by useless slaughter, cites Manu, narrates Vasu's fall after declaring flesh edible,
    explains Agastya's dedication of wild deer to the deities, praises abstention
    from meat during Karttika and the rainy months, and lists ancient kings who abstained
    from flesh, with an added maxim on truth and Harischandra's heavenly status.
  language: English
  quote_policy: summarized
