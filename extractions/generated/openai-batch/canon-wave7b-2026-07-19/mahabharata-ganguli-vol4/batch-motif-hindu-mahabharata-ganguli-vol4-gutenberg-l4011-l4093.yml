canonical_text:
  quote: ''
  summary: 'A hymn addresses a divine being through a sequence of epithets: source
    and knower of the Vedas, origin from post-dissolution waters, bearer of Ganga,
    husband of Uma, wielder of Pinaka, incarnating protector, and source/refuge/guide
    of gods and Asuras. The passage also identifies the addressee with cosmic time,
    parentage, the universe-tree’s support, doors to heaven and emancipation, and
    Nirvana.'
