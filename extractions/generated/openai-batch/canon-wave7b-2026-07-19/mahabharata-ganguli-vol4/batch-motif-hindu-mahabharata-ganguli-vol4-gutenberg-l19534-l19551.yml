  summary: A holy speaker answers Uma about the duties of Brahmanas and the regenerate
    order, emphasizing fasting or sense-restraint, Brahmacharya, vows, investiture
    with the sacred thread, reverence for preceptors and deities, and study of the
    Vedas as the source of piety. Uma replies that her doubts remain and asks for
    a fuller explanation of the duties of the four orders of men.
