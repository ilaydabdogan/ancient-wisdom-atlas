canonical_text:
  quote: I am Maghavat. I came to the world of human beings, for seizing this elephant.
  summary: In a dialogue with Gautama, the speaker called Dhritarashtra describes
    regions reached by donors of kine, lifelong vow-keepers, and pilgrims to sacred
    waters. Gautama declares that he will pursue him even to Brahman's passion-free
    abode to recover an elephant. Gautama then recognizes the speaker as Maghavat/Sakra,
    the deity of a hundred sacrifices. Gautama asks that the white young elephant,
    raised by him as a child, be released. The deity restores the elephant, praises
    Gautama's recognition, and takes Gautama and the elephant to heaven. Bhishma adds
    that hearing or reciting this history leads after death to Brahman's region.
  language: English
  quote_policy: quoted
