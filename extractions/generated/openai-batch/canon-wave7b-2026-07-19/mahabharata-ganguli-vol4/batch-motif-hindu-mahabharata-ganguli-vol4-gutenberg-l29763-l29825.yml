canonical_text:
  quote: ''
  summary: Brahma explains that Goodness, Passion, and Darkness are inseparable qualities
    whose relative predominance varies among beings and circumstances. He maps Goodness
    upward, Passion to the middle, and Darkness downward; interprets sun, heat, and
    eclipse through the three qualities; describes many domains as threefold; and
    says that one who knows the unmanifest and the qualities is liberated and enjoys
    absolute happiness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Brahma says the qualities cannot be declared completely separate and are seen
    in union, attached to and dependent on one another.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The three qualities are said to journey together, move collectively, and act
    in bodies whether with cause or without cause.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage describes different proportions of Darkness, Passion, and Goodness
    in lower creatures, creatures of middle course, and creatures of upward courses.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Goodness is called the spring of the modifications of the senses and the great
    enlightener, with no duty described as higher than Goodness.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those abiding in Goodness proceed upward; those abiding in Passion remain
    in the middle; those abiding in Darkness sink downward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Darkness is associated with the Sudra, Passion with the Kshatriya, and Goodness
    with the Brahmana in a threefold ordering.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The rising sun is used as an illustration: men of evil deeds feel fear, travellers
    suffer heat, sun or light represents Goodness, heat represents Passion, and eclipse
    or shading represents Darkness.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Day, night, fortnights, months, years, seasons, conjunctions, gifts, sacrifice,
    worlds, deities, knowledge, path or end, time, aims, and vital airs are described
    as threefold or fraught with the three qualities.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: Every object in the world is said to be fraught with the three qualities,
    which act by turns in all things and circumstances in an unmanifest form.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The unmanifest is described as consisting of the three qualities and is given
    many names, including darkness, holy, unborn, womb, Nature, Pradhana, production,
    absorption, existent, and non-existent.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: A person who accurately knows the names of the unmanifest, the qualities,
    and their operations is said to become freed from the body, liberated from the
    qualities, and to enjoy absolute happiness.
  category: sequence
  evidence_refs:
  - ev:7
