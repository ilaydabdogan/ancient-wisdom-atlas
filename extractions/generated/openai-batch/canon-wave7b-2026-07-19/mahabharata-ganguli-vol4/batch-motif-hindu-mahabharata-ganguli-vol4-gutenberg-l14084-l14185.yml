canonical_text:
  quote: ''
  summary: Bhishma recounts an old episode concerning oaths during a sojourn to sacred
    waters. A group of Rishis and royal sages, led by Indra, travel to sacred waters,
    bathe for purification, and gather lotus stalks at Brahmasara. Agastya discovers
    that the stalks he had extracted are missing, accuses the group, laments the approach
    of unrighteousness, and says he should go to heaven before moral disorder spreads.
    The others deny stealing the stalks and begin swearing frightful self-imprecatory
    oaths against whoever took them.
  language: English
  quote_policy: summarized
