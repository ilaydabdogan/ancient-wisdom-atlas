canonical_text:
  quote: ''
  summary: The passage recounts Bhrigu's prediction that Yudhishthira will free Nahusha
    from a curse; Nahusha's fall from heavenly sovereignty, rescue, and ascent; Brahman's
    restoration of Indra as heavenly sovereign; and a concluding teaching that householders
    who give lights in the evening gain celestial sight, radiance, beauty, and strength
    after death.
  language: English
