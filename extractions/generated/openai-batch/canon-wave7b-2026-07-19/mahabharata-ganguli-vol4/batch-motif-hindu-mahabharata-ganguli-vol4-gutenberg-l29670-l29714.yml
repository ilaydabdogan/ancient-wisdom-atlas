canonical_text:
  quote: ''
  summary: Brahma declares the qualities belonging to Passion, listing many actions,
    emotions, social practices, ritual acts, and worldly attachments. He says that
    people driven by desire and devoted to Religion, Wealth, and Pleasure are enveloped
    by Passion, take downward courses, are repeatedly reborn, and pursue pleasures
    and fruits in this world and the hereafter. He concludes that one who understands
    these qualities can free himself from them.
  language: English
  quote_policy: summarized
