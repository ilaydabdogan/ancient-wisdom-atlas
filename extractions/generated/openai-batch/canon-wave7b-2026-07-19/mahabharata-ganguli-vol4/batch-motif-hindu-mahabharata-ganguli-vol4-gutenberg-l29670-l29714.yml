  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The list of Passion includes commercial, violent, social, and verbal acts
    such as buying and selling, cutting or piercing, cruelty, fault-finding, false
    speech, vain gifts, praise, dispraise, service, desire, possessions, grief, vows,
    and charity.
  category: attribute
  evidence_refs:
