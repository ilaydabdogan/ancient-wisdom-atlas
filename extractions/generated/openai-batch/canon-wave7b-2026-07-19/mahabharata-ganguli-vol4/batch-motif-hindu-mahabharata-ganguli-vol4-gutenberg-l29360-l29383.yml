canonical_text:
  quote: The path is traversable with the aid of the understanding and not of this
    body.
  summary: A Brahmana addresses a lady who has censured him. He describes himself
    as Vedic, emancipated, observant of vows, and not reducible to visible good and
    bad acts. He claims to pervade all existence and to be the destroyer of creatures,
    compares this to fire destroying wood, and identifies knowledge of unity with
    the universe as his wealth. He teaches that one knowledge is reached through different
    modes and symbols, likens attainment of the one entity to rivers entering the
    ocean, and reassures the lady about the hereafter by directing her heart toward
    the real entity and his soul.
  language: English
  quote_policy: quoted
