canonical_text:
  quote: ''
  summary: A teacher addresses a king and lists karmic consequences for stealing various
    goods, for killing, and for betraying trust. Offenders are said to be reborn as
    specific animals or beings, undergo suffering for specified periods, and eventually
    regain human birth after demerit is exhausted. The passage also states rewards
    for abstaining from sin, describes corresponding births for women offenders, and
    attributes the teaching to Brahman speaking among celestial Rishis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stealing textiles, colouring matter, unguents, or perfumes is said to produce
    rebirth as particular birds or animals, including parrot, duck, crane, sheep,
    hare, peacock, Jivajivaka bird, and mole.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mole rebirth is described as lasting fifteen years, after which the offender
    regains human status when the demerit is exhausted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Stealing milk is said to produce rebirth as a crane, and stealing oil is said
    to produce rebirth as an animal subsisting upon oil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An armed person who kills an unarmed person for wealth or hostility is said
    to be reborn successively as an ass, deer, fish, beast of prey, and pard before
    regaining human status.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the violent killer’s sequence, the ass and deer forms die by weapon, and
    the fish form dies after being dragged up in a net.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man who kills a woman is said to go to the regions of Yama, suffer diverse
    pains, pass through twenty-one transformations, and then be born as vermin for
    twenty years before regaining human status.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Stealing food, paddy, food mixed with sesame cakes, ghee, fish, or salt is
    said to result in rebirth as bee, cat, mouse, gallinule, crow, or mimicking bird
    respectively.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A person who misappropriates something deposited with him in confidence is
    said to have a shortened lifespan, be reborn among fishes, regain human form,
    and remain short-lived.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
