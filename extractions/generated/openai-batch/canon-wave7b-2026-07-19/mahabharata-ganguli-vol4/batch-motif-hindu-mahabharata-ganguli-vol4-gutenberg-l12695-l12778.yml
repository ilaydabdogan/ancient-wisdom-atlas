canonical_text:
  quote: The puissant Lord of all then poured libations himself into his own self.
  summary: Vasishtha recounts a history called Brahmadarsana. Rudra, in the form of
    Varuna, performs a sacrifice attended by deities, sages, embodied ritual formulae,
    and embodied sacred texts. Mahadeva/Siva is described as holding sacred knowledge
    and as identical with cosmic regions and multiple deities. At the sacrifice, Brahman's
    seed is placed into the sacrificial fire as an offering, generating classes of
    creatures and named sages. Agni's body and fire-elements are then mapped to deities,
    measures of time, and celestial bodies.
  language: English
  quote_policy: quoted
