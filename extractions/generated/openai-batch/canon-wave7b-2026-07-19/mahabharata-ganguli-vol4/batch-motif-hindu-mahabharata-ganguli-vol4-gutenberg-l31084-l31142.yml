canonical_text:
  quote: ''
  summary: Utanka asks Krishna for access to water whenever he needs it in the desert.
    Later, thirsty in the desert, he thinks of Krishna and encounters a fierce Chandala
    hunter with dogs, who offers water that appears to issue from his urinary organs.
    Utanka refuses. Krishna later explains that the hunter was Indra in disguise offering
    nectar as water, and that Utanka lost the gift by rejecting the form. Krishna
    then grants that water-bearing clouds will arise in the desert for Utanka, becoming
    known as Utanka-clouds.
  language: English
  quote_policy: summarized
