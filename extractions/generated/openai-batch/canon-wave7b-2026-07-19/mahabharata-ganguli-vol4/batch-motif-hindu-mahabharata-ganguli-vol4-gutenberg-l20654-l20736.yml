canonical_text:
  quote: The husband is the god which women have. The husband is their friend. The
    husband is their high refuge.
  summary: 'Uma gives an extended discourse on women’s duties within marriage: a wife
    becomes her husband’s associate in righteous deeds at the nuptial fire, should
    serve and revere her husband, maintain household ritual duties, feed dependants
    and guests, honour elders and Brahmanas, and thereby share in her husband’s merit.
    Narada then reports that Mahadeva applauds Uma and dismisses the assembled beings.'
  language: English
  quote_policy: quoted
