canonical_text:
  quote: ''
  summary: The deities ask Brahman to rescue them from Taraka, an Asura protected
    by boons. Brahman ordains Taraka's destruction and explains that Agni, not affected
    by Uma's curse against divine offspring, will produce a son through energy associated
    with Rudra's seed and Ganga; this son will kill Taraka with an unerring dart.
    The gods and Rishis search for the hidden Agni. A frog reveals that Agni is in
    the nether regions under the waters, and Agni curses the frog race to lose taste;
    the gods then favor the frogs.
  language: English
  quote_policy: summarized
