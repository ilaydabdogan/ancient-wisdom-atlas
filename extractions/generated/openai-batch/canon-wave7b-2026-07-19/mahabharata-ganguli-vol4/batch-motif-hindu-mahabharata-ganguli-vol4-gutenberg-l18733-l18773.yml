canonical_text:
  quote: ''
  summary: Bhishma narrates that deities, Pitris, and Rishis ask the Pramathas what
    makes humans vulnerable to their affliction and what prevents such spirits or
    Rakshasas from overpowering human habitations. The Pramathas list forms of impurity
    and improper conduct that make humans susceptible, then list substances, animals,
    household objects, sacred fire, sacrificial smoke, and abstention from meat as
    protections.
  language: English
  quote_policy: summarized
