canonical_text:
  quote: "“this rite that thou hast conceived, is a sacrifice in honour of the Pitris.”"
  summary: Bhishma recounts the origin of the Sraddha rite through a genealogy from
    the Self-born Brahman to Atri, Dattatreya, Nimi, and Srimat. After Srimat dies,
    Nimi grieves and arranges offerings, Brahmanas, Kusa grass, and rice cakes for
    his dead son. Fearing he has invented an unauthorized rite, Nimi summons Atri
    by thought. Atri consoles him, identifies the rite as a sacrifice for the Pitris
    ordained by the Self-born, and describes ritual elements including sacred fire,
    mantras, libations, deities who receive shares, praise of Earth and Varuna, the
    seven Pitris, the Viswedevas, and some items not to be offered.
  language: English
  quote_policy: quoted
