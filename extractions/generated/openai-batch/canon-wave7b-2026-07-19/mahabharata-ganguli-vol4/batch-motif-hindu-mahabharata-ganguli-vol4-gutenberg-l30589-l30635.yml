canonical_text:
  quote: ''
  summary: 'A didactic passage explains the unmanifest, great soul, egoism, elements,
    and sense-objects through the language of seed and product. It classifies the
    five elements by sensory qualities: space, wind, light, water, and earth. It then
    lists varieties of smell, taste, colour, touch, and sound, and closes with a hierarchy
    from space upward through egoism, understanding, soul, Unmanifest, and Purusha,
    stating that one who knows these relations attains the Unfading Soul.'
  language: English
  quote_policy: summarized
