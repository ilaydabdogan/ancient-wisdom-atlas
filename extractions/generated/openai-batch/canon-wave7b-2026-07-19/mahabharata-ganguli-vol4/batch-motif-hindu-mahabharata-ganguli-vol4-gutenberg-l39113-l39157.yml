canonical_text:
  quote: '"The time has come for your departure from the world."'
  summary: Vyasa tells Arjuna that the Vrishni and Andhaka warriors were destroyed
    by a Brahmana's curse according to destiny; Krishna permitted it, completed the
    work of lightening Earth's burden, cast off his human body, and attained his own
    high seat. Vyasa says the Pandavas have completed the gods' work, that Time governs
    prosperity, adversity, power, and loss, and that Arjuna's weapons have returned
    to their source until their appointed time. Arjuna then returns to Hastinapura
    and reports the Vrishni events to Yudhishthira.
  language: English
  quote_policy: quoted
