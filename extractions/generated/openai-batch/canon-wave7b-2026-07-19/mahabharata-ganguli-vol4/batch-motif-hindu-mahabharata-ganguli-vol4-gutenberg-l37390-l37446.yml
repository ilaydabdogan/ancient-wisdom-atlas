canonical_text:
  quote: ''
  summary: Kunti tells Vyasa how the ascetic Durvasas gave her a mantra for summoning
    deities. In girlish curiosity she summoned the sun deity, who came before her,
    threatened not to depart fruitlessly, and granted her a son like himself. Kunti
    secretly bore Karna, cast him into the waters to preserve her father's honor,
    and later asks to behold him. Vyasa answers that she bears no fault and explains
    divine modes of procreation.
  language: English
