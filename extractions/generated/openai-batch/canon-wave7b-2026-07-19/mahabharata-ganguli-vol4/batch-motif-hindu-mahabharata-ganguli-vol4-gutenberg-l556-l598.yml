  claim: The passage explicitly contrasts Viswamitra's successful attainment of Brahmana
    status with Matanga's failed attempt despite austerities, making both figures
    part of a shared question about whether spiritual status can overcome birth status.
  claim_level: same_function
  target: Matanga's failed attainment of Brahmanahood despite austerities
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is internal to Yudhishthira's question; details of Matanga's
    story are not present in this passage.
