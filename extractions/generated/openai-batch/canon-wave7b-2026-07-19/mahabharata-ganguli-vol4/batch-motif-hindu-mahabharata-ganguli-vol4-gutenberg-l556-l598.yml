  quote: How without casting off his corporeal frame and taking another tenement of
    flesh could he become a Brahmana?
  summary: Yudhishthira asks how Viswamitra, though born a Kshatriya, attained Brahmana
    status. He lists Viswamitra's ascetic feats, curses, rescues, sacred rivers, heavenly
    placement, and contrasts his success with Matanga's failure to attain Brahmanahood.
  language: English
  quote_policy: quoted
