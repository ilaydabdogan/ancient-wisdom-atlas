candidate_motifs:
- id: motif:1
  label: attainment of Brahmana status across birth category through austerity
  taxonomy_refs: []
  basis: The central question asks how Viswamitra, born a Kshatriya, became a Brahmana,
    with his austerities and achievements cited as relevant background.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:10
  confidence: high
  cautions: The passage poses the question and lists achievements but does not yet
    narrate the full process of attainment.
- id: motif:2
  label: ascetic power produces destruction, beings, and curses
  taxonomy_refs: []
  basis: Viswamitra's austerities destroy Vasishtha's sons, his anger creates Rakshasas,
    and his curses or pleasure alter the fates of several figures.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage attributes several powers to Viswamitra but presents them
    as a catalogue rather than a single continuous episode.
- id: motif:3
  label: human victim rescued from sacrificial killing
  taxonomy_refs:
  - sacrifice
  basis: Sunasepha is described as having been sought to be slain as an animal in
    Amvarisha's great sacrifice and delivered through Viswamitra.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Only a brief allusion to the sacrificial rescue is included in this passage.
- id: motif:4
  label: curse changes social status or bodily form
  taxonomy_refs: []
  basis: The fifty brothers become Chandalas by curse, Trisanku becomes a Chandala
    by Vasishtha's curse, and Rambha is cursed into a rock.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: The transformations are caused by curses from sages or ascetics; the passage
    does not frame them as divine judgment.
- id: motif:5
  label: heavenly translation of an outcast suspended between realms
  taxonomy_refs:
  - ascent
  basis: Trisanku, after becoming a Chandala and being suspended head downwards in
    the lower regions, is translated to heaven at Viswamitra's pleasure.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The text gives the event in summary form and does not detail the mechanics
    of the ascent.
- id: motif:6
  label: sacred river as site of release and naming
  taxonomy_refs: []
  basis: Vasishtha binds himself with creepers, enters a river, rises released from
    his bonds, and the river is thereafter named Vipasa.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage gives an etiological explanation for the river name but does
    not elaborate the broader river myth.
- id: motif:7
  label: astral placement of a sage among celestial figures
  taxonomy_refs:
  - ascent
  basis: Viswamitra is said to shed lustre in the northern firmament among the seven
    regenerate Rishis and Dhruva.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage states a celestial position but does not explicitly narrate
    the ascent to that position.
