canonical_text:
  quote: ''
  summary: The speaker instructs Yudhishthira on eligibility for Brahmanas invited
    to Sraddha rites, acceptable and unacceptable conduct and wealth, ritual utterances
    and timing for rites involving deities and Pitris, order-specific rites and girdles,
    and sins linked to falsehood or improper ritual eating.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he will describe which Brahmanas are ordained for acts honoring
    deities and Pitris and who may give or receive gifts in Sraddhas.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brahmanas observing rites, possessing merit, knowing the Gayatri, following
    ordinary Brahmana duties, living by agriculture, or being wellborn despite fighting
    for others are described as eligible for invitation to Sraddhas.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Brahmana who lives by trade is said to be discarded even if he possesses
    merit.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Daily libations on the sacred fire, settled residence, not being a thief,
    hospitality to guests, reciting Savitri three times daily, living by charity or
    alms, and absence of pride or disputation are given as qualifying traits.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some faulted persons, including those who acquired wealth by foul or cruel
    means, are said to become worthy through offerings to deities, Soma, adoration
    of deities, or hospitality.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wealth gained by sale of Vedic lore, earned by a woman, or gained by meanness
    is prohibited for gifts to Brahmanas or offerings to Pitris.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The stated time for Sraddha depends on having a good Brahmana, curds, ghee,
    the new moon day, and meat of wild animals such as deer.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Completion utterances differ by social order and include Swadha, a prayer
    for the Pitris’ gratification, a declaration of inexhaustibility, Swasti, Om,
    and other formulae.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Jatakarma rites for the three regenerate orders are to be performed with mantras,
    and different girdle materials are prescribed for Brahmana, Kshatriya, and Vaisya.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Falsehood and eating improperly after invitations, without ablutions, or during
    impurity from birth or death are associated with specified sins.
  category: sequence
  evidence_refs:
  - ev:9
