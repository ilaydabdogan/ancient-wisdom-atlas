canonical_text:
  quote: ''
  summary: The opening of the Mausala-parva recounts ominous natural and celestial
    portents, Yudhishthira’s news of the Vrishni destruction, and Vaishampayana’s
    explanation that the disaster arose after Vrishni youths disguised Samva as a
    woman and tried to deceive visiting ascetics. The ascetics foretold that Samva
    would bring forth an iron bolt that would destroy the Vrishnis and Andhakas. Krishna
    accepted the event as destined. Samva then produced the iron bolt; Ugrasena had
    it ground to powder and cast into the sea, and authorities prohibited wine and
    intoxicants.
  language: English
  quote_policy: summarized
