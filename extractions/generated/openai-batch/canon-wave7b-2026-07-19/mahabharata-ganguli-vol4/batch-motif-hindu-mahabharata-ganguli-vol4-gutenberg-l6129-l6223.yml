canonical_text:
  quote: '"Let me be possessed of the power of assuming any form at will, and journeying
    through the skies"'
  summary: Bhishma recounts how Matanga, advised by Indra that he cannot attain Brahmana
    status, persists in severe austerities at Prayaga and Gaya. Indra again denies
    that boon, explains the exalted and birth-bound status of Brahmanas, and offers
    another boon. Matanga asks for shapeshifting, sky-travel, pleasures, worship from
    Brahmanas and Kshatriyas, and lasting fame. Indra grants him fame, worship by
    women, and a high posthumous place.
  language: English
