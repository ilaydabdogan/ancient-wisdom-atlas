canonical_text:
  quote: ''
  summary: Samvarta questions Marutta about how he learned of him and threatens punishment
    for falsehood. Marutta says Narada directed him and then entered the fire. Samvarta
    tests and rebukes Marutta, explains his conflict with his brother Vrihaspati,
    and says Vrihaspati serves Indra. Marutta recounts Vrihaspati's refusal to officiate
    because of Indra, and asks Samvarta to perform a sacrifice by which he may surpass
    Indra. Samvarta warns that Indra and Vrihaspati may be angered and demands steadfastness,
    threatening destruction if Marutta abandons him. Marutta swears not to forsake
    him, and Samvarta promises to perform the sacrifice and make Marutta equal to
    Sakra.
  language: English
  quote_policy: summarized
