canonical_text:
  quote: kine became the refuge of the world
  summary: Vasishtha explains that primordial kine performed long austerities, received
    boons from Brahman, became sacred and purifying, and that gifts of various cows
    and bulls lead donors to specific divine regions, heavenly enjoyment, and later
    favorable human rebirth.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Vasishtha speaks the teaching in direct discourse.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kine created in a former age practiced severe penances for one hundred thousand
    years in order to gain pre-eminence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The kine resolved that they would become the best kind of Dakshina in sacrifices
    and would not be stained by fault.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The kine state that bathing in water mixed with their dung will sanctify people,
    and that deities and men will use their dung for purification.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The kine state that those who give them away will attain regions of happiness
    belonging to the kine.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Brahman appears at the conclusion of the kine’s austerities and grants the
    boons they sought.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After receiving the boons, the kine are described as mothers of the past and
    future, highly blessed, sacred, foremost, and the refuge of the world.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: People are instructed to bow every morning to kine, with prosperity as the
    stated consequence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage lists gifts of cows of different colors, commonly with calves,
    milk, cloth, ornaments, or milking vessels, and connects each gift with a divine
    or ancestral region.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: A habitual giver of kine is said to pierce the clouds on a solar-effulgent
    car, go to Heaven, and shine there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In Heaven, the habitual giver is received and served by celestial damsels
    with music and ornaments.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The giver remains in Heaven for as many years as there are hairs on the bodies
    of the given kine, then falls from Heaven and is born in a superior human family.
  category: sequence
  evidence_refs:
  - ev:7
