canonical_text:
  quote: ''
  summary: Narada instructs Yudhishthira on the supreme value of giving food. He says
    all beings, life-breaths, social duties, sacrifices, religion, wealth, health,
    the Vedas, and the elements depend on food. Food given to Brahmanas, guests, travelers,
    mendicants, Sudras, Chandalas, or even a dog is said to produce merit, prosperity,
    happiness here and hereafter, heavenly residence, descendants, wealth, strength,
    beauty, and abundance. The passage also describes ancestral expectation of food
    offerings and begins a cosmological account of water moved by wind, clouds, Sakra,
    and the Sun.
  language: English
  quote_policy: summarized
