canonical_text:
  quote: ''
  summary: Footnotes explain names and attributes of Mahadeva and related figures.
    The notes describe Jiva carrying the seed of acts and moving between worlds; the
    soul as rider and body as car; Ganesa as Mahadeva's son and the Ganas as attendants;
    Mahadeva's nudity or space-covering form; Ganga being absorbed by Mahadeva's matted
    locks; unstruck sound as unmanifest Brahman; a cosmic destruction in which all
    becomes water and Markandeya sees boy Mahavishnu under a banyan; Mahadeva as embodying
    life stages and appearing in the heart; Vishnu binding Vali; world-upholding beings
    such as directional elephants and Sesha; and the body as a pit into which the
    soul falls.
  language: English
  quote_policy: summarized
