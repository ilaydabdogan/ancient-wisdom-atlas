canonical_text:
  quote: ''
  summary: Bhishma reports Madhava's praise of the goddess Earth and instructs the
    royal listener to worship superior Brahmanas. In Section XXXV, Bhishma describes
    Brahmanas as inherently worthy of honor, as ritual mediators for the deities,
    as sources of blessing or curse, and as beings whose duties were ordained by Brahma.
    The passage emphasizes Vedic study, penance, vows, offerings, Brahmana power,
    the effects of Brahmana wrath and grace on social and cosmic groups, and the need
    for Kshatriya rulers to cultivate Brahmana goodwill.
  language: English
  quote_policy: summarized
