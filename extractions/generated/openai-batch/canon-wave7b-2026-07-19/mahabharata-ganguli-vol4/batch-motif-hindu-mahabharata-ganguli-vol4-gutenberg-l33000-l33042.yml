canonical_text:
  quote: ''
  summary: Vaisampayana narrates that the king of Manipura and his mother grieve,
    while Ulupi summons a serpent-associated gem capable of reviving the dead. Ulupi
    explains that the apparent defeat was an illusion and a test connected to Jishnu/Dhananjaya.
    Vabhruvahana places the gem on his father’s breast, Jishnu revives, celestial
    omens occur, and Dhananjaya embraces Vabhruvahana before asking why Ulupi and
    the mother are present on the battlefield.
  language: English
  quote_policy: summarized
