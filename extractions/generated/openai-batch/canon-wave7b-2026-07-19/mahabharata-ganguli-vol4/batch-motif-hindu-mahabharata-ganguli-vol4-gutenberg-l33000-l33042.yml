  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the revival, Vabhruvahana worshipped his father with reverence.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When Jishnu awoke from the slumber of death with signs of life, celestial
