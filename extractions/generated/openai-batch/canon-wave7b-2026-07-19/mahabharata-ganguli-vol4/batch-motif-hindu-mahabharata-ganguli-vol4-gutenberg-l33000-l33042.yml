- id: obs:1
  text: The king of Manipura, afflicted with grief and accompanied by his mother,
    sat down intending to starve himself to death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ulupi thought of a gem described as having the virtue of reviving a dead man
    and as the great refuge of the snakes; the gem came there.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ulupi, described as the daughter of the prince of snakes, took up the gem
    and addressed the king of Manipura as her son.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Ulupi said that Jishnu had not truly been vanquished, that she had exhibited
