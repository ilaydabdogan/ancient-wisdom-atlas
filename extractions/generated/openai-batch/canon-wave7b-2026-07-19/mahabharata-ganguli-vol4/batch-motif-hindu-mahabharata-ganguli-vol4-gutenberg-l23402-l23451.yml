canonical_text:
  quote: ''
  summary: Bhishma instructs Yudhishthira on Righteousness, saying it is ultimately
    one though viewed in three ways. He identifies abstention from injury, truth,
    forgiveness, and liberality as eternal Righteousness; urges reverence and hospitality
    toward Brahmanas; and explains that those who hate Righteousness go to Hell, while
    those who observe it attain heaven or the regions of the deities. Yudhishthira
    asks for the marks of the wicked and the good.
  language: English
