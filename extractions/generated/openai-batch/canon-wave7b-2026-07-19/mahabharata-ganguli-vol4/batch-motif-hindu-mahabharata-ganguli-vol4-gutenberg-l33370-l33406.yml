canonical_text:
  quote: ''
  summary: 'Vaisampayana describes the commencement and performance of Yudhishthira''s
    great sacrifice: dialecticians debate, invited kings inspect lavish golden preparations
    made by Bhimasena, sacrificial stakes and many animals and plants are gathered,
    vast quantities of food and dairy are prepared, Brahmanas and others are fed,
    drums and cymbals sound repeatedly, and people from across Jamvudwipa assemble
    while food and drink are distributed.'
  language: English
  quote_policy: summarized
