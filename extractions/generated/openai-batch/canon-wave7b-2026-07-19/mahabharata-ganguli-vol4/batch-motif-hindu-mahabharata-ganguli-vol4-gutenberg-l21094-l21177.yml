canonical_text:
  quote: ''
  summary: Bhishma instructs a king to worship, meditate on, sacrifice to, and hymn
    Vasudeva/Vishnu through his thousand names. The passage presents Vishnu as supreme
    lord, refuge, father, cosmic origin, universal support, and receptacle at dissolution,
    then begins enumerating divine names and attributes including creator, destroyer,
    witness, yogic guide, lion-headed form, source of elements, solar-disc presence,
    navel lotus, Ananta-like support, lord of Lakshmi, slayer of Madhu, rider on Garuda,
    cosmic seed, time, snake, bull, and boar imagery.
  language: English
  quote_policy: summarized
