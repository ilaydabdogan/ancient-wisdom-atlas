canonical_text:
  quote: ''
  summary: A Brahmana describes non-attachment to sense objects and recites an ancient
    discourse between a Yati and an Adhwaryu at an animal sacrifice. The Yati censures
    the killing as destruction of life and argues for abstention from cruelty. The
    Adhwaryu defends the sacrifice by appeal to scripture and elemental dissolution,
    then challenges the Yati that ordinary sensory life also involves life-taking.
    The Yati distinguishes the destructible from the indestructible Atman and describes
    liberation beyond duality, expectation, possessiveness, and fear. The Adhwaryu
    praises the Yati's understanding, and the Brahmana concludes with a statement
    about subtle Emancipation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Brahmana says that he does not smell, taste, see colours, touch, hear
    diverse sounds, or entertain purposes, and attributes desire and aversion to Nature.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brahmana says he is not attached through desire, wrath, decrepitude, or
    death, and compares non-taint to a drop of water on lotus leaves.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Brahmana introduces an ancient story of a discourse between an Adhwaryu
    and a Yati.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a sacrificial ceremony, an animal has been sprinkled with water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Yati censures the sacrificial act by saying that it is destruction of
    life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Adhwaryu replies that the goat will not be destroyed and that the sacrificed
    animal receives great good if the Vedic declaration is true.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Adhwaryu says the animal's earth part goes to earth, its water-born part
    enters water, its eye enters the sun, its ear enters the horizons, and its life-winds
    enter the sky.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Yati asks why the sacrificer needs the rite if the sacrifice is for the
    goat's benefit, and says the goat's brother, father, mother, and friend should
    approve it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Yati states that abstention from cruelty is the foremost duty and frames
    the proposition as no slaughter of living creatures.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Adhwaryu argues that the Yati enjoys smell, taste, colour, touch, sound,
    and thought, and therefore does not entirely abstain from taking life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Yati distinguishes the Indestructible and Destructible as a double manifestation
    of the soul and says the Atman is above the listed forms and without duality and
    hope.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Yati says that one freed from existent objects, pairs of opposites, expectation,
    possessiveness, and surrounding conditions has no fear from any source.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Adhwaryu says his understanding shines with light after hearing the Yati's
    opinion and says he performs rites with Mantras without fault.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Yati remains silent, the Adhwaryu proceeds with the great sacrifice, and
    the Brahmana connects the conclusion to subtle Emancipation understood by Brahmanas.
  category: sequence
  evidence_refs:
  - ev:9
