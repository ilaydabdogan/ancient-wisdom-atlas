literal_observations:
- id: obs:1
  text: Jayadratha is described as having played only a minor part in Abhimanyu's
    slaying by guarding the entrance of the array, while also being remembered for
    an attempted abduction of Draupadi.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gifts at Sraddhas, marriages, and auspicious rites are described as being
    gathered together, dedicated with mantras, and distributed to individually called
    guests by named functionaries.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each gift indicated by Dhritarashtra was multiplied ten times at Yudhishthira's
    command.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gandhari is said to have kept her eyes bandaged from the days of her marriage
    because Dhritarashtra was blind.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Because Dhritarashtra was Pandu's elder brother, Kunti is said to regard Dhritarashtra
    as Pandu's father, and Gandhari as Kunti's mother-in-law.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Great gifts such as elephants, horses, cars, vehicles, and boats are said
    to bring merit to the giver and possible demerit to the receiver unless the receiver
    has exceptional energy.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Yudhishthira and Vidura are both identified with Dharma; when Vidura left
    his human body, he entered Yudhishthira's body, strengthening him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Brahmana's curse is said to reduce his penances, and Mandavya's curse forced
    Dharma to accept minority or non-age as a plea in punishment for offences.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Dharana and Dhyana are identified as stages of Yoga, one involving fixing
    the mind on one thing and the other abstracting the mind from surrounding objects.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Anima and Laghima are named as capacities such as becoming minute and subtle.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Certain beings are described as having been incarnated as human beings, fighting
    one another, and dying with respect to their human existence.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The religion of Nivritti is described as abstention from acts and as superior,
    while acts of Pravritti lead the soul into embodiment and experiences of happiness
    or misery.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The soul is compared to a mirror, while pleasure and pain are compared to
    reflections that appear and vanish without modifying the mirror.
  category: other
  evidence_refs:
  - ev:13
- id: obs:14
  text: The man of wisdom who has exhausted his acts is said to be freed from the
