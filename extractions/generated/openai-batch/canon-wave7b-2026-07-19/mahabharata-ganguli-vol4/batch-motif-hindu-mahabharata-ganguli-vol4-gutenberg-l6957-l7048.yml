canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to explain the disposition of women. Bhishma
    cites an old exchange in which Narada questions the Apsara Panchachuda. Panchachuda
    reluctantly offers a strongly negative catalogue of alleged female faults, compares
    women’s desires to insatiable cosmic forces, lists dangerous entities as united
    in women, and links those traits to creation.
  language: English
  quote_policy: summarized
