canonical_text:
  quote: There is no gift that is equal to a gift of earth.
  summary: Bhishma reports Vrihaspati's reply to Sakra on the merits of gifting earth.
    The speech praises land donation to deserving Brahmanas as an unequalled gift,
    a form of sacrifice, a means of removing sin and rescuing ancestors, and a source
    of heavenly reward. It warns that revoking a land gift brings hell, Varuna's noose,
    and destruction of generations. It closes with maxims on the gift of earth, the
    mother, truth, and given wealth.
  language: English
  quote_policy: quoted
