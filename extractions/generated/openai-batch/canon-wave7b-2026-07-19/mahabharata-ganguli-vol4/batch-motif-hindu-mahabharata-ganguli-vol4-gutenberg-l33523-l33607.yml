canonical_text:
  quote: ''
  summary: The passage describes the reception of the Manipura prince and the two
    women Chitrangada and Ulupi in the Pandava palace, followed by Vyasa instructing
    Yudhishthira to begin a richly endowed Horse-sacrifice. Yudhishthira undergoes
    initiation; priests perform the rites, Bhima distributes food, sacrificial stakes
    and a golden altar-bird are prepared, and animals including the chief horse are
    tied for sacrifice.
  language: English
  quote_policy: summarized
