canonical_text:
  quote: ''
  summary: Utanka obtains a royal sign from Saudasa and receives Madayanti's jewelled
    ear-rings. Saudasa explains his danger and dependence on Brahmanas, warns Utanka
    not to return to him, and says returning would mean death. Utanka travels toward
    Ahalya at Gautama's retreat with the ear-rings bound in a black deer-skin. While
    he climbs a Vilwa tree to gather fruit, falling fruit loosens the knot and the
    deer-skin falls. A snake of Airavata's race takes the ear-rings into an anthill.
    Utanka angrily digs for thirty-five days toward the subterranean regions of the
    Nagas, distressing the goddess Earth. The thunder-armed chief of celestials, disguised
    as a Brahmana, arrives and tells him the purpose cannot be achieved with a walking
    staff. Utanka vows to die if he cannot recover the ear-rings from the Nagas.
  language: English
  quote_policy: summarized
