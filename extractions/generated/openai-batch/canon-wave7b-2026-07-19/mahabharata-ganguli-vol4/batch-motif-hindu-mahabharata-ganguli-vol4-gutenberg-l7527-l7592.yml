canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about marriage as a root duty and about the proper
    person to receive a daughter in marriage. Bhishma explains criteria for choosing
    a bridegroom, names several marriage forms, distinguishes righteous from unrighteous
    forms, gives rules about wives by social order, condemns some unions, describes
    eligibility and timing rules for girls, and cites Manu. Yudhishthira then asks
    whose wife the girl becomes when rival acts such as dower, promised dower, threatened
    abduction, display of wealth, or ritual hand-taking occur.
  language: English
  quote_policy: summarized
