canonical_text:
  quote: ''
  summary: The passage states that subjects may collectively slay a king who plunders
    and fails to protect them; it assigns a share of subjects' sins to an unprotecting
    king and a share of their merits to a protecting king; it instructs Yudhishthira
    to rule so that subjects and allies seek him as refuge, using analogies of rain,
    a large tree, Kuvera, and Indra.
  language: English
  quote_policy: summarized
