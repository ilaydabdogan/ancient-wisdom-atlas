  summary: Yudhishthira asks Bhishma whether conciliation or gifts are more effective.
    Bhishma answers that different people are gratified by different means and introduces
    an ancient narrative in which an intelligent Brahmana, seized in a lonely forest
    by a Rakshasa who intends to eat him, remains composed and attempts conciliation.
    The Rakshasa asks why he is pale and lean, and the Brahmana prepares to answer.
