canonical_text:
  quote: A thousand horse sacrifices and Truth were once weighed in the balance. It
    was seen that Truth weighed heavier than a thousand horse-sacrifices.
  summary: Bhishma instructs the king on the rewards of vows, Niyamas, Vedic study,
    self-restraint, social and ascetic duties, many kinds of heroism, and Truth. The
    passage repeatedly states that such practices lead to heaven, Brahma's region,
    or superior regions of felicity, and it gives special priority to self-restraint
    and Truth over gifts and sacrifices.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bhishma says that one who completes a Vrata according to scripture obtains
    eternal regions of felicity, and that the fruits of Niyamas and Vedic study appear
    in this world and hereafter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Self-restrained persons are described as happy everywhere, enjoying felicity
    from the subjugation of desire, able to go where they wish, defeat foes, and obtain
    what they seek.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bhishma states that self-restraint is superior to gift because wrath can destroy
    the merit of a gift, whereas a self-restrained person does not yield to wrath.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes many invisible places in heaven belonging to Rishis,
    where persons leaving this world become transformed into deities; great Rishis
    reach such places through self-restraint.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: A preceptor who teaches the Vedas and duly worships fire is said to enjoy
    inexhaustible felicity in Brahma's region, and one who teaches righteous disciples
    attains honours in heaven.
  category: sequence
  evidence_refs:
  - ev:3
