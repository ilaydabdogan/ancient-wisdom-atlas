canonical_text:
  quote: ''
  summary: Vaisampayana narrates that the sacrificial horse reaches Rajagriha while
    Arjuna follows it. Meghasandhi, the young ruler of Magadha and son of Sahadeva,
    challenges Arjuna for the horse. Arjuna defeats him by disabling his chariot,
    weapons, and driver, but spares him according to Yudhishthira's command not to
    kill opposing kings. Meghasandhi accepts defeat, worships Arjuna and the horse,
    and is invited to Yudhishthira's Horse-sacrifice. The horse then proceeds along
    the sea-coast through several regions while Arjuna defeats further armies.
  language: English
  quote_policy: summarized
