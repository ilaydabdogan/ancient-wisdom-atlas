canonical_text:
  quote: ''
  summary: Vyasa tells Yudhishthira that action is divinely impelled and that sin
    can be removed through penance, sacrifice, gifts, austerities, and charity. He
    urges Yudhishthira to perform royal sacrifices, including the horse-sacrifice,
    citing Rama and Bharata as precedents. Yudhishthira objects that war has emptied
    the treasury and left the surviving princes wounded and suffering. Vyasa replies
    that the exhausted treasury can be restored by gold in Himavat left by Brahmanas
    at Marutta's sacrifice, prompting Yudhishthira to ask about Marutta.
  language: English
  quote_policy: summarized
