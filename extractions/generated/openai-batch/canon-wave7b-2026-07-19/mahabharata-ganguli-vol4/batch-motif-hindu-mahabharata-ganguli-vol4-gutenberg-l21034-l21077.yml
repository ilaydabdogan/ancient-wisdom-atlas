  summary: Bhishma’s discourse links royal chastisement with righteousness, recommends
    reverent worship of Mahadeva following the Sankara-Uma discourse and Narada’s
    command, recalls sacred events on Himavat and long austerities of Vasudeva and
    Dhananjaya at Vadari, praises Vasudeva’s childhood slaying of Kansa, blames Duryodhana
    and his allies for the ruin of the Kurus, and describes the assembled kings and
    Rishis reverently approving Bhishma’s words.
