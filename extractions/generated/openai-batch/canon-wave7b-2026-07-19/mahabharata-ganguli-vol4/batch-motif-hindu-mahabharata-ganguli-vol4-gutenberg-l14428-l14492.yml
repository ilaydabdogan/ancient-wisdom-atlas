canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the duties of household life and worldly
    prosperity. Bhishma answers by recounting Vasudeva's question to the goddess Earth.
    Earth prescribes worship, sacrifices, offerings to deities, ancestors, Rishis,
    humans, guests, Brahmanas, animals, and other beings, concluding that proper householder
    duties bring blessings, fame, and heaven after death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks Bhishma to relate the duties of the household mode and what
    a person should do to attain prosperity in this world.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma frames his answer as an old story in which Vasudeva questions the
    goddess Earth about the same topic.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The goddess Earth says that a householder should worship Rishis, deities,
    Pitris, and men, and should perform sacrifices.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The householder is instructed to attend daily to the sacred fire and sacrificial
    offerings, including oblations of food, water, fruits, roots, boiled rice, and
    clarified butter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Offerings are assigned to named deities and beings according to regions and
    places such as the southern, western, northern, north-eastern, and eastern regions,
    the homestead, the entrance, the interior of the house, open air, and night.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The householder is told to make offerings to Brahmanas, ancestors, Viswedevas,
    guests, preceptor, father, friend, king, priest, father-in-law, and Snataka Brahmanas,
    and to eat last after feeding others.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Food should be offered on the ground in the morning and evening to dogs, Swapachas,
    and birds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The performance of these ceremonies with an unclouded mind is said to bring
    the blessings of the Rishis in this world and heavenly regions after death; Bhishma
    tells Yudhishthira to act in the same way for fame and heaven.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
