canonical_text:
  quote: ''
  summary: Vasudeva reports that a Brahmana, after touching a sage's feet, asked difficult
    questions. Kasyapa's questions concern bodily dissolution, acquiring another body,
    repeated painful rebirth, emancipation, Jiva's relation to Prakriti and Brahman,
    and the fruits and persistence of good and bad acts. The Brahmana says an emancipated
    sage answered the questions in sequence.
