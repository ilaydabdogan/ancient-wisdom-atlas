  text: Yudhishthira is said to ask which conjunctions should be used for making particular
    gifts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The notes describe Sraddha with sesame, giving a residential house to a Brahmana,
    and a royal fee payable to the owner of the earth on which a Sraddha is performed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A ritual principle is stated that one need not dedicate to deities food different
    from what one eats oneself; examples include Rama offering fruits to the Pitris
    and Pisachas dedicating carrion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The notes describe roadside resting places in Vaisakha where cool drinking
    water, soaked oats, and raw sugar are distributed to travellers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Giving lamps is explained as placing lighted lamps in dark public places such
    as roads and ghats.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kine are said to produce food by aiding tillage and sacrifices; ghee burnt
    in sacrificial fire sustains under-deities, who send rain and cause crops to grow.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The notes state that a preceptor should be sought before pious acts, including
    gifts of kine.
  category: action
  evidence_refs:
  - ev:7
