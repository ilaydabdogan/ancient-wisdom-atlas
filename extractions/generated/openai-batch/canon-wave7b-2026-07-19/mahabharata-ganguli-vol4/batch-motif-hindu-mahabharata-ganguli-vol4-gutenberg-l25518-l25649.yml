  text: A note identifies one utterance as the declaration of the earth herself.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes state that tastes inhere in earth or soil, which produces different-tasting
    things such as sugarcane and tamarind.
  category: attribute
  evidence_refs:
  - ev:1
