canonical_text:
  quote: ''
  summary: The passage praises Ganga as a sacred stream whose sight, touch, drinking,
    bathing, and worship cleanse sin, rescue ancestors and descendants, and lead beings
    to Heaven. It describes offerings of water to Pitris and deities, end-of-life
    remembrance or residence beside Ganga, her descent from the firmament onto Maheswara's
    head, her three courses through Earth, Heaven, and Patala, her bearing of Sagara's
    ash-reduced sons to Heaven, and her identity as universal refuge and auspicious
    divine power.
  language: English
  quote_policy: summarized
