canonical_text:
  quote: ''
  summary: Yudhishthira approaches Bhishma on his bed of arrows and asks how one gains
    beauty, prosperity, agreeable disposition, religious merit, wealth, pleasure,
    and happiness. Bhishma answers by prescribing the Chandravrata, a vow begun in
    Margasirsha when the moon and a sequence of asterisms are mapped to bodily parts.
    Upon completing the vow, one gives ghee to Veda-knowing Brahmanas; the stated
    fruit is knowledge and fullness like the full moon.
  language: English
