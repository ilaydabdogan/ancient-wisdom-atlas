canonical_text:
  quote: ''
  summary: Bhishma introduces an old account of how Viswamitra attained the status
    of a Brahmana Rishi, then recounts a royal genealogy leading to King Gadhi. Gadhi,
    childless and desiring a son, goes to the forest, where a daughter, Satyavati,
    is born. The ascetic Richika seeks Satyavati's hand, but Gadhi, thinking him poor,
    requires a marriage dower of a thousand extraordinary horses.
  language: English
  quote_policy: summarized
