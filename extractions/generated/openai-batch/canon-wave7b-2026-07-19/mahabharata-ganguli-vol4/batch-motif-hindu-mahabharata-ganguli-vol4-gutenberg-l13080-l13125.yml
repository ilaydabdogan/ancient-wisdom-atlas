canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma which offerings dedicated to the Pitris become
    inexhaustible or eternal. Bhishma answers by listing foods and ritual substances
    suitable for Sraddha, their periods of ancestral gratification, and specific foods,
    times, and places that make offerings inexhaustible, including sesame, certain
    meats, payasa with ghee, Magha timing, elephant shadow, and the banian at Gaya.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks what object, Havi, or presentation dedicated to the Pitris
    becomes inexhaustible, lasting, or eternal.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma says he will describe Havis regarded as suitable for Sraddha and the
    fruits attached to each.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sesame seeds, rice, barley, Masha, water, roots, and fruits offered at Sraddha
    are said to gratify the Pitris for one month.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Manu is cited as saying that a Sraddha performed with copious sesame becomes
    inexhaustible, and sesame seeds are called the best of all foods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A sequence of fish, meats, beef, and payasa mixed with ghee is assigned increasing
    durations of Pitri gratification, from two months up to a year.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vadhrinasa meat is said to gratify the Pitris for twelve years, while rhinoceros
    flesh on death-anniversary lunar days, Kalasaka, Kanchana petals, and goat meat
    are said to become inexhaustible.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Verses attributed to the Pitris and communicated by Sanatkumara prescribe
    payasa with ghee on the thirteenth day under Magha during the Sun's southward
    course, and also goat meat or Kanchana petals under Magha.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The same instruction includes offering payasa with ghee on a spot covered
    by the shadow of an elephant.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Many sons are desired so that one may go to Gaya, where a banian celebrated
    over all worlds makes offerings under its branches inexhaustible.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Even a little water, roots, fruits, meat, and rice mixed with honey becomes
    inexhaustible when offered on the anniversary of the day of death.
  category: object
  evidence_refs:
  - ev:8
