literal_observations:
- id: obs:1
  text: A person described as wise is instructed to marry an auspicious, mature maiden
    from a high family, beget children, send sons to a preceptor, marry daughters
    to respectable intelligent youths, and provide sons with inheritance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before acts honoring the Pitris or deities, the instructed person should bathe
    by dipping the head in water.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Sraddha is not to be performed under the constellation of one's nativity,
    under either Bhadrapada, under Krittika, or under constellations described as
    fierce, hostile, or forbidden by astrology treatises.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that facing east or north while being shaved leads to long
    life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Calumny of others and self-reproach are both described as sinful and are to
    be avoided.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage lists categories of women whom the instructed person should not
    marry or have sexual congress with, including women described by bodily condition,
    kinship, illness, age, status, or prior obligation.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The instructed person should carefully ignite fire before performing acts
    ordained in the Vedas or declared by the Brahmanas.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women and spouses are to be protected and not injured.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Malice, day sleep, sleeping after sunrise or at twilight, adultery, and remaining
    impure after shaving are said to shorten life.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: At evening twilight, the instructed person should refrain from Veda recitation,
    eating, and bathing, collect the senses for meditation, and bathe before worshiping
    deities or saluting the preceptor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: A person should not attend a sacrifice unless invited, except to observe how
    the sacrifice is conducted; uninvited attendance for another purpose may shorten
    life if proper worship is not received.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The instructed person should not journey alone to foreign parts or proceed
    alone anywhere at night, and should return home before evening.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The commands of mother, father, and preceptor are to be obeyed without judging
    whether they are beneficial.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: The king is instructed to study the Vedas, the science of arms, riding elephants,
    horses, and war-chariots, reasoning, words, Gandharva knowledge, the sixty-four
    Kalas, Puranas, Itihasas, and lives of high-souled persons.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: A king who attends to these forms of training and protects his subjects is
    described as happy, unconquerable by foes, able to sway servants and kinsmen,
    and free from loss.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: The passage instructs avoidance of a spouse during her functional period,
    permits companionship on the fourth day after the purification bath, and links
    intercourse on the fifth or sixth day with begetting a daughter or son respectively.
  category: sequence
  evidence_refs:
  - ev:7
