canonical_text:
  quote: With vital seed drawn up and mind concentrated, one that is thus devoted
    succeeds in conquering Heaven. Having attained to the highest seat, he has not
    to return to birth.
  summary: Brahma gives prescriptive instructions for disciplined life as a Brahmacharin,
    then as a forest ascetic, and then as an emancipation-seeking mendicant. The passage
    emphasizes study, restraint, ritual offerings, non-harm, hospitality, minimal
    food, seclusion, purity, and vows leading to Heaven or Emancipation.
  language: English
  quote_policy: quoted
