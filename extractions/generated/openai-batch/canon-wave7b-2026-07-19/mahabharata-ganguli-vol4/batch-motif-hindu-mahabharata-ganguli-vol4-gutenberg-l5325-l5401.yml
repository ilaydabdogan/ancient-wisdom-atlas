  summary: A speaker lists actions that lead people to hell, then addresses Yudhishthira
    and lists actions, virtues, gifts, public works, restraint, and rites that lead
    people to heaven. The passage closes by identifying the teaching as concerning
    rites for deities and Pitris, ordinances about gifts, and the views of ancient
    Rishis.
