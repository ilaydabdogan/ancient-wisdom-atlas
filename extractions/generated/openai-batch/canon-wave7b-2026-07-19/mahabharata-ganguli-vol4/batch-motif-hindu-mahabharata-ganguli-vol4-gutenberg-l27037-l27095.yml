canonical_text:
  quote: ''
  summary: Yudhishthira asks Vyasa to recount the history of the royal sage Marutta.
    Vyasa gives a royal genealogy from Manu through Ikshwaku and later kings, describes
    the removal of the oppressive Khaninetra and the installation of Suvarcha, recounts
    Suvarcha's virtue, impoverishment, miraculous acquisition of forces, and naming
    as Karandhama, then describes Avikshit’s virtues and sacrifices and Marutta’s
    golden sacrifice at Mount Meru north of Himavat.
  language: English
  quote_policy: summarized
