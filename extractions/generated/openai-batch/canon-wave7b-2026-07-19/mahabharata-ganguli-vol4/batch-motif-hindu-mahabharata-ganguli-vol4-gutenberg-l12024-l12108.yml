canonical_text:
  quote: ''
  summary: Yudhishthira asks why cow dung is endowed with Sree. Bhishma answers by
    narrating an old conversation in which the goddess Sri enters a herd of kine,
    asks to dwell among them, is first refused because she is considered fickle, then
    seeks their protection. The kine grant her residence in their urine and dung,
    declaring both sacred; Sri accepts the compact and disappears. Bhishma presents
    this as the explanation of the glory of cow dung.
  language: English
  quote_policy: summarized
