canonical_text:
  quote: '"this great sacrifice is not equal to a prastha of powdered barley"'
  summary: At the close of Yudhishthira's great horse-sacrifice, after gifts and honors
    have been distributed, a blue-eyed mongoose with half its body turned to gold
    appears and declares that the sacrifice is not equal in merit to a small gift
    of powdered barley once given by a Brahmana of Kurukshetra observing the Unccha
    vow. Questioned by Brahmanas, the mongoose says it witnessed the incident, that
    the Brahmana and his family attained Heaven, and that the incident changed half
    of the mongoose's body into gold.
  language: English
  quote_policy: quoted
