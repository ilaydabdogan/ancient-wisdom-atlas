canonical_text:
  quote: ''
  summary: Dhritarashtra tells Yudhishthira that Vidura is alive in the forest, practicing
    severe austerities. Yudhishthira pursues Vidura into the deep forest and finds
    him emaciated, naked, motionless, and leaning against a tree. Vidura fixes his
    gaze on Yudhishthira and, by Yoga-power, enters Yudhishthira’s body limb by limb,
    uniting his life-breaths and senses with those of the king; Vidura’s former body
    remains lifeless against the tree. Yudhishthira feels strengthened and remembers
    his state before birth. When Yudhishthira wishes to cremate Vidura’s body, an
    invisible voice forbids cremation, declaring Vidura to be the eternal deity of
    Righteousness and connected with Yudhishthira’s own body. Yudhishthira reports
    the event to Dhritarashtra; Dhritarashtra offers him water, roots, and fruits,
    which Yudhishthira accepts, and the group spends the night under a tree.
  language: English
  quote_policy: summarized
