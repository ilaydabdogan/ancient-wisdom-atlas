  summary: A Brahmana introduces an ancient dialogue in which Devamata asks Narada
    which vital wind first arises in a creature at birth. Narada answers with a teaching
    on the five life-winds, reproductive union, pleasure and desire, Agni as fire
    and deity, sacrificial oblation, paired principles, and tranquillity as eternal
    Brahman.
