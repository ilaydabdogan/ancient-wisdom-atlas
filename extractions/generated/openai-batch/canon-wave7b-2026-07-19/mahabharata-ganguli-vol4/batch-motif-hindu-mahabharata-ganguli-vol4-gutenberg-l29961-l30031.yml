canonical_text:
  quote: ''
  summary: 'A teacher expounds Adhyatma doctrine: beings born of wombs, action as
    sacrifice, gifts, and study, and knowledge that frees from sin. The passage describes
    renunciation, withdrawal of desires like a tortoise, repression of senses, the
    blazing of an inner Adhyatma fire, contemplation of all entities in the heart,
    the body as composed of elements and as the revolving wheel of Time and an ocean
    of delusion, and the crossing of a river of senses and mental inclinations to
    behold the Highest and attain Infinity.'
  language: English
  quote_policy: summarized
