canonical_text:
  quote: ''
  summary: Bhishma restrains his life-breaths through Yoga; they pierce the crown
    of his head and rise heavenward, followed by celestial signs. The Pandavas, Vidura,
    Dhritarashtra, and other Kurus perform his funeral rites and offer water at the
    sacred Bhagirathi. Ganga rises from the river, laments her son, and is consoled
    by Krishna and Vyasa, who affirm Bhishma's divine origin as a Vasu and his ascent
    to heaven.
  language: English
  quote_policy: summarized
