  text: Yudhishthira asks Bhishma to explain how Rama, son of Jamadagni, was born
    with irresistible prowess and why one born in a race of regenerate Rishis became
    a follower of Kshatriya practices.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yudhishthira also asks how a son of the Kusika race, born Kshatriya, became
    a Brahmana, and why the changes affected grandsons rather than sons in both lineages.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bhishma answers by citing an old history of discourse between Chyavana and
