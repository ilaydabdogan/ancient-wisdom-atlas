canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to explain the birth and lineage anomalies of
    Rama, Jamadagni's son, and a Kusika-line figure becoming a Brahmana. Bhishma introduces
    an old history in which the ascetic Chyavana foresees a stain on his race connected
    with Kshatriya practice, desires to consume the Kusika race, and visits King Kusika.
    Kusika receives Chyavana with ritual hospitality and offers him wealth, kingdom,
    cattle, sacrificial goods, palace, and rule over the earth.
  language: English
  quote_policy: summarized
