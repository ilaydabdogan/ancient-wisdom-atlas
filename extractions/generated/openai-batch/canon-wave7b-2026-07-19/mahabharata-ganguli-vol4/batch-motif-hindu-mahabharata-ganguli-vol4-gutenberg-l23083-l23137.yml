canonical_text:
  quote: ''
  summary: A Brahmana identified as the Rishi Durvasa is pleased with Krishna and
    Rukmini after they follow him while smeared with frumenty. He praises Krishna
    for subduing wrath, grants blessings of popularity, fame, restored possessions,
    and protection from death in the body parts smeared with frumenty, while noting
    the unsmeared soles of Krishna's feet. He grants Rukmini fame, lasting beauty,
    fragrance, chief status among spouses, and future inseparable companionship with
    Krishna. Durvasa instructs Krishna to maintain this disposition toward Brahmanas
    and disappears. Krishna adopts a vow of silent mantra practice, resolves to obey
    Brahmanas, finds destroyed household articles restored, and later counsels worship
    of Brahmanas with gifts.
  language: English
  quote_policy: summarized
