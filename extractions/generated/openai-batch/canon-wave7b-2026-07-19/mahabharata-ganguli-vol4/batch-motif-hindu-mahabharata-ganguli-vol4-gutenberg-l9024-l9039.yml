  summary: A holy Brahmana, pleased with King Kusika and declaring him sinless, asks
    leave to depart and offers a boon. Kusika replies that surviving the holy one's
    presence, which he compares to being in fire, and saving his race from destruction
    are already the best boons; he then asks the Brahmana to explain doubts in his
    mind.
