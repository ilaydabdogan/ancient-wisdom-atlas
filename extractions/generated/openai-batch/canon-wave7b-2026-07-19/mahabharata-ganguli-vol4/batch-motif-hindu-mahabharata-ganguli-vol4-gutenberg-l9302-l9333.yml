canonical_text:
  quote: ''
  summary: The passage lists rewards obtained by giving particular objects and comforts
    to Brahmanas, including umbrellas, shoes, cloths, scents, plants, food, houses,
    and beds. It also says that one who dies heroically in battle attains an unsurpassed
    end. Yudhishthira accepts his grandfather’s teaching and asks the other Pandavas
    to have faith in it; they and Draupadi agree.
  language: English
  quote_policy: summarized
