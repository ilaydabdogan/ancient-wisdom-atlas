canonical_text:
  quote: '"stood for a hundred years on one foot"'
  summary: Bhishma recounts that Matanga, despite Indra's counsel, continues austerity
    by standing on one foot for a hundred years. Indra returns and tells him that
    Brahmana status is unattainable for him and that seeking it through penance will
    bring destruction. Indra describes a long sequence of rebirths from brute life
    through human and social orders toward higher Brahmana births, with immense durations
    and multipliers. He adds that moral conditions such as desire, aversion, vanity,
    and evil speech can cause a fall from high status, and tells Matanga to ask for
    another boon.
  language: English
  quote_policy: quoted
