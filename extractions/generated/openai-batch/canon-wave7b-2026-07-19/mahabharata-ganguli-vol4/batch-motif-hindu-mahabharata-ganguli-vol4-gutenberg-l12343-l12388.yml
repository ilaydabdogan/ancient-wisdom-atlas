canonical_text:
  quote: gold is of the essence of Fire and Soma
  summary: Rishis and Vasishtha explain to Rama that gold is a supreme cleansing gift.
    They describe gold as born from Agni/Fire, as connected with Fire and Soma, as
    superior to other gifts, and as equivalent to giving all deities because Agni
    is all deities in one.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Rishis say that a mortal who has sinned may be cleansed by gifts of kine,
    earth, and wealth, and they introduce another gift regarded as a great cleanser.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Rishis identify the excellent cleansing article as the offspring of Fire
    and say that after Agni burnt the world, gold of bright complexion sprang from
    his seed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vasishtha addresses Rama and says he will explain how gold, having the splendour
    of fire, came into existence and acquired superior attributes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vasishtha states that gold is of the essence of Fire and Soma.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Vasishtha lists correspondences between gift objects and divine beings or
    regions, including goat with Fire, sheep with Varuna, horse with Surya, elephants
    with Nagas, buffaloes with Asuras, cocks and boars with Rakshasas, and earth with
    sacrifice, kine, water, and Soma.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A mass of energy found by churning the entire universe is identified as gold,
    and gold is said to be superior to the previously named objects.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Deities, Gandharvas, Uragas, Rakshasas, human beings, and Pisachas are said
    to hold gold carefully and to shine with gold made into crowns, armlets, and ornaments.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Gold is described as the most cleansing of cleansing things, the highest gift,
    an eternal cleanser, and the best Dakshina.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Those who give gold are said to be givers of all things and givers of deities,
