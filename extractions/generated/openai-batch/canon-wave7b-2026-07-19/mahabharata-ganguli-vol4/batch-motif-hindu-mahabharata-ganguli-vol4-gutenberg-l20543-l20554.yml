  quote: Maheswara said, "Through the Vedas, the limits have been assigned of all
    the acts of human beings."
  summary: Maheswara teaches a goddess that the Vedas set the limits of human action.
    Those who follow Vedic authority become devoted to vows in later lives, while
    those who mistake unrighteousness for righteousness lose vows, transgress restraints,
    neglect Homa and sacred mantras, and are regarded as Brahmarakshasas.
