canonical_text:
  quote: ''
  summary: Translator and commentator notes explain doctrines and images concerning
    the body as Not-self, Righteousness accompanying beings after death, rebirth and
    karmic consequences, hell-like punishments, non-injury, gifts of food and water,
    union with Brahma, the worm's recollection of a past life through a sage's sight,
    and the results of pleasure, austerity, and holy sight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person lacking much learning is described as liable to improper acts done
    for the body and senses rather than for oneself; the body and senses are identified
    in the note as the Not-self.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When certain entities leave the body, they are said to be accompanied by Righteousness.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Animals and birds are identified as intermediate beings between deities and
    human beings.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Brahma-Rakshasa is defined as a Rakshasa belonging by birth to the regenerate
    order.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: An unnamed sufferer is described as repeatedly struck with clubs, hammers,
    and mallets, impaled, confined with fiery vessels, dragged through forests of
    sword-blades, made to walk on heated sand, and rubbed against thorny Salmali trees.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A day in which no gift of food is made is called sterile or lost.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: Desire, anger, and implied cupidity are described as being divided into very
    small parts and cast off from oneself to others.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A person who becomes identified with Brahma is described as leaving no trace
    behind, while deities are described as desiring a fixed abode such as heaven or
    another felicitous place.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The note states that one should consider how one would feel if another refused
    one's own solicitation before refusing another's solicitation.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Slaughter is said to create guilt whether committed directly, incited in others,
    or mentally committed.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Abstention from injury is described as making one a giver of life-breaths;
    the assurance of never injuring creatures is described as the sacrificial present
    of universal compassion.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: 'The word for flesh is explained through a reciprocal formula: because he
    eats me, I shall eat him.'
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The note states that consequences of injury are suffered by the doer, and
