canonical_text:
  quote: ''
  summary: The deities address frogs who have been deprived of tongues through Agni's
    curse, granting them limited speech and night wandering. The gods search for Agni.
    An elephant reveals Agni in the Aswattha tree, after which Agni curses elephants
    and moves into the Sami tree; the gods give elephants compensating abilities.
    A parrot reveals Agni's new abode in the Sami, is cursed with impaired speech,
    and then receives a partial blessing. The gods make Sami wood sacred fuel for
    producing fire in rites, and the passage explains hot mountain springs as waters
    heated by Agni. The deities and a great Rishi ask Agni to undertake a task, and
    Agni agrees.
  language: English
  quote_policy: summarized
