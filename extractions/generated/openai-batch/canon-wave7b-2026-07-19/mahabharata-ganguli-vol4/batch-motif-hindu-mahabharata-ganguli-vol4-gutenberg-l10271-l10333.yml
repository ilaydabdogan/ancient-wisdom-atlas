canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the merits of gifting sandals and then
    asks again about gifts of sesame, land, kine, and food. Bhishma describes rewards
    for gifting sandals, then explains the origin, ritual use, and merit of sesame
    seeds. He also recounts deities asking the Self-born Brahman for lawfully granted
    earth on which to perform a sacrifice, and Brahman agreeing to give it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks what merit belongs to a person who gives sandals to a Brahmana
    whose feet are burning from hot sand while walking.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma says the giver of sandals protects Brahmanas' feet, crushes thorns,
    and gets over every kind of difficulty.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhishma says splendid gold and silver vehicles drawn by mules approach the
    giver of sandals, and that gifting sandals is said to equal the merit of gifting
    a vehicle with trained steeds.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Yudhishthira asks Bhishma to tell again the merits attached to gifts of sesame,
    land, kine, and food.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bhishma says sesame seeds were created by the Self-born Brahman as the best
    food for the Pitris, and that gifts of sesame greatly gladden them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Bhishma says the person who gives sesame seeds in the month of Magha to Brahmanas
    does not have to visit hell, and that offering sesame seeds to the Pitris is regarded
    as worshipping the deities at all sacrifices.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Bhishma states that a Sraddha should not be performed with offerings of sesame
    seeds without cherishing some purpose.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bhishma says sesame seeds sprang from the limbs of the great Rishi Kasyapa
    and are regarded as highly efficacious gifts that bestow prosperity and beauty
    and cleanse sin.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bhishma names Apastamva, Kankha, Likhita, and Gautama as having ascended to
    heaven by making gifts of sesame seeds.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Bhishma says Brahmanas who make Homa with sesame, abstain from sexual intercourse,
    and observe the religion of Pravritti are regarded as equal in purity and efficacy
    to bovine Havi.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Bhishma recounts that when clarified butter was once unavailable, Rishi Kusika
    made sesame offerings to his three sacrificial fires and attained an excellent
    end.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: The deities, desiring to perform a sacrifice on earth, go to the Self-born
    Brahman and ask him for a piece of auspicious earth.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The deities say that a person who has not lawfully obtained the earth for
