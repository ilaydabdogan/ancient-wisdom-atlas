canonical_text:
  quote: ''
  summary: Vaisampayana narrates a battle between Arjuna and Vajradatta. Vajradatta
    seeks to avenge his father Bhagadatta and drives an elephant against Arjuna. Arjuna
    checks the elephant with arrows, fells it with a fiery shaft, and then spares
    Vajradatta under Yudhishthira’s instruction to disable opponents rather than kill
    them and to invite them to Yudhishthira’s horse-sacrifice.
  language: English
  quote_policy: summarized
