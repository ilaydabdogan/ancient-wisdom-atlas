canonical_text:
  quote: ''
  summary: The section opens with an invocation. Vaisampayana narrates that after
    Dhritarashtra offers water libations for Bhishma, Yudhishthira collapses in grief
    on the bank of the Ganga. Krishna prompts Bhima to lift him, and the Pandavas
    gather around. Dhritarashtra urges Yudhishthira to rise and rule, says he and
    Gandhari are the ones who should mourn their hundred sons, and recalls that he
    ignored Vidura’s wise warning about Duryodhana, leading to the destruction of
    his line and his present sorrow.
  language: English
  quote_policy: summarized
