canonical_text:
  quote: Kine have been said to be the limbs of sacrifice. They represent sacrifice
    itself
  summary: Bhishma praises gifts of cows and cow products as foundational to sacrifice
    and purification. He recounts an ancient dialogue in which Indra asks Brahman
    why cows dwell in a region higher than the gods. Brahman explains the sacrificial,
    agricultural, and sustaining roles of cows, then narrates the severe austerities
    of Aditi and Surabhi; Surabhi refuses personal boons, and Brahman grants her immortality
    and a region above the three worlds.
  language: English
  quote_policy: quoted
