    to sanctify seven miles around him.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: An unqualified person taking the foremost seat at a Sraddha is said to take
    the sins of all who sit in the line.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
