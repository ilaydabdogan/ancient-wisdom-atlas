  evidence_refs:
  - ev:6
- id: obs:10
  text: A Sraddha performed merely to feed friends or gather relatives is said not
    to gratify the deities and Pitris and to fail in ascent to heaven or the path
    of the deities.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sraddha offerings are said to be proper for those who are neither friends
    nor foes but neutral.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Offerings eaten by an unworthy person are compared to seed sown on sterile
