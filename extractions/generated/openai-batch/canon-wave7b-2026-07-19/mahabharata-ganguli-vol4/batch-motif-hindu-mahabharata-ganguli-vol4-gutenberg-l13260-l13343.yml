  text: The passage lists ritual and textual qualifications, including knowledge of
    Nachiketas, five sacrificial fires, Suparnas, Vedic Angas, Chhandas, Jeshtha Saman,
    teacher ancestry, and proper household conduct.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Persons marked by Atharva-siras recitation, Brahmacharya, vows, truth, bathing
    at tirthas, sacrificial completion, freedom from wrath, forgiveness, self-restraint,
    and concern for all creatures should be invited to Sraddhas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gifts made to the qualified invitees are said to become inexhaustible.
