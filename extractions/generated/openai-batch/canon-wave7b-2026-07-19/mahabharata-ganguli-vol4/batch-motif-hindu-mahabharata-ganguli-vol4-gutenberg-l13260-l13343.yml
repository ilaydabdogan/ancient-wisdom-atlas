canonical_text:
  quote: ''
  summary: An unnamed instructor tells an addressed king which Brahmanas and ascetics
    should be regarded as sanctifiers of a ritual line and invited to Sraddha rites.
    The passage lists qualifications based on Vedic learning, vows, self-restraint,
    ritual knowledge, pilgrimage bathing, truthfulness, and proper conduct. It warns
    that unqualified recipients, friend-based feasting, or exchange of offerings render
    Sraddha offerings fruitless, fail to gratify deities and Pitris, and obstruct
    ascent to heaven.
  language: English
  quote_policy: summarized
