canonical_text:
  quote: ''
  summary: A lady speaks at length about desire, claiming that women favor the deity
    of desire over other deities and that desire can override family bonds. Bhishma
    narrates that a Rishi, seeking to know the faults of women, asks her to stop and
    asks what he should do. She invites him to stay; he agrees. Seeing her aged and
    ugly, he privately wonders whether she is the goddess of the palace or under a
    curse, but he does not immediately investigate. At evening she offers service,
    and he requests water for ablutions before prayer with restrained senses.
  language: English
  quote_policy: summarized
