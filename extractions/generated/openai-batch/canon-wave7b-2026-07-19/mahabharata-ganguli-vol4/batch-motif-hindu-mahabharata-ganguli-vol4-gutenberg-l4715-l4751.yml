- id: obs:3
  text: The lady says that under the influence of desire women disregard family relations
    such as parents, brothers, husbands, sons, and brothers-in-law.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The lady compares the destruction of family by desire to rivers eating away
