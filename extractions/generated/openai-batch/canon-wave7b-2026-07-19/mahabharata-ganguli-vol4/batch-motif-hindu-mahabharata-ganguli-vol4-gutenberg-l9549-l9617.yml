canonical_text:
  quote: "“This sacrifice which is constituted by gift is distinguished above all
    other sacrifices.”"
  summary: Yudhishthira asks Bhishma whether a gift is more meritorious when made
    to an equally qualified Brahmana who solicits or to one who does not. Bhishma
    answers that a gift to an unsoliciting, contented Brahmana yields greater merit,
    while also commending compassionate giving to those who solicit. He instructs
    Yudhishthira to seek out impoverished but nonbegging Brahmanas, honor and feed
    them, support their households, feed Brahmacharins, and treat charitable giving
    as a sacrifice that gratifies deities, ancestors, Brahmanas, and sacrificial fires.
  language: English
  quote_policy: quoted
