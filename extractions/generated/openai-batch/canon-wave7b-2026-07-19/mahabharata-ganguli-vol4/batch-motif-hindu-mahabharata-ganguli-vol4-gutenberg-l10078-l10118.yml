canonical_text:
  quote: ''
  summary: The passage describes clouds moistening Earth, crops arising, food becoming
    the source of bodily substances and vital seed, and living creatures springing
    from that seed. Agni and Soma are named as body-internal agents maintaining the
    vital seed. A man who gives food to a supplicant is said to contribute life and
    energy to creatures. Bhishma, citing Narada, urges the king to make gifts of food,
    especially to deserving Brahmanas with rites, and describes resplendent heavenly
    regions, mansions, wish-fulfilling trees, water features, conveyances, mountains
    of food, rivers of milk, and hills of rice reserved for food-givers.
  language: English
  quote_policy: summarized
