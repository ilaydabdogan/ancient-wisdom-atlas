canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma about the origin and purpose of giving umbrellas
    and sandals at obsequial and other religious rites. Bhishma begins an origin account
    involving Jamadagni, Renuka, and Surya: Renuka is scorched by the sun while retrieving
    Jamadagni''s arrows, Jamadagni threatens to destroy the sun, and Surya appears
    in the guise of a Brahmana to explain the sun''s role in drawing moisture, producing
    rain, and sustaining food and human rites.'
  language: English
  quote_policy: summarized
