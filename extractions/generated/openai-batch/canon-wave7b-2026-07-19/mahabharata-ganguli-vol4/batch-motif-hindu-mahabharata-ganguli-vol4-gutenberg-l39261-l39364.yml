canonical_text:
  quote: ''
  summary: The Pandavas reach red waters, where the embodied deity of fire blocks
    their way and tells Arjuna to return the celestial bow Gandiva and its quivers
    to Varuna by casting them into the waters. The brothers continue their yogic journey
    around the earth, see Dwaraka covered by the ocean, travel north past Himavat
    and a desert toward Meru, and then Draupadi/Yajnaseni, Sahadeva, Nakula, Arjuna,
    and Bhima fall one by one. Yudhishthira explains each fall as the result of a
    specific fault, and continues onward without looking back, accompanied only by
    a dog.
  language: English
  quote_policy: summarized
