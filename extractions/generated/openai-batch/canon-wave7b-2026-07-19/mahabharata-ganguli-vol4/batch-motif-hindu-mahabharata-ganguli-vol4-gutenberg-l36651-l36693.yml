canonical_text:
  quote: ''
  summary: Dhritarashtra, following Vidura's advice, resides by the sacred Bhagirathi,
    receives visitors, bathes and performs rites with Gandhari and others, offers
    libations into sacrificial fire, travels to Kurukshetra, visits Satayupa and Vyasa,
    receives initiation into the forest mode of life, and begins severe ascetic penances
    with Gandhari, Kunti, Vidura, Sanjaya, and followers.
  language: English
  quote_policy: summarized
