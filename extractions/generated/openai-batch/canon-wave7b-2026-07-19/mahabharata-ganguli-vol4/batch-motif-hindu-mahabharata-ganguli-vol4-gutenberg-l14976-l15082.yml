canonical_text:
  quote: ''
  summary: Yudhishthira asks whether pious people attain the same region after death
    or differ in status. Bhishma answers that different deeds lead to different postmortem
    regions and introduces an old discourse between Gautama and Vasava. Gautama compassionately
    raises an orphaned elephant as a son. Indra, disguised as king Dhritarashtra,
    seizes the grown elephant. Gautama protests, refuses wealth in exchange, and repeatedly
    declares that he will pursue the king into various afterlife regions to recover
    the elephant. Dhritarashtra describes the kinds of persons who go to each region
    and insists that he will go to a higher one.
  language: English
  quote_policy: summarized
