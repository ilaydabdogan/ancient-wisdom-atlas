canonical_text:
  quote: Having cast off the status of a worm and taken birth as a Kshatriya... began
    to undergo severe austerities.
  summary: Bhishma recounts that a being formerly a worm is reborn as a Kshatriya,
    remembers earlier transformations, and begins austerities. Vyasa instructs him
    that the proper penance for a Kshatriya is righteous protection of creatures and
    subjects. By following this counsel, he is reborn as a Brahmana, continues in
    righteousness, performs extensive sacrifices, and ultimately obtains residence
    in Brahman's region and the highest status. Bhishma applies the lesson to the
    fallen Kshatriyas of Kurukshetra, saying they have attained a meritorious end
    and should not be mourned.
  language: English
  quote_policy: quoted
