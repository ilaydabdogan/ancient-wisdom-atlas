canonical_text:
  quote: ''
  summary: The Grandsire answers Indra about kine, describing invisible regions of
    kine that are accessible to the righteous and unseen by the wicked. These regions
    suspend time and lack decay, evil, disease, weakness, and fire. Kine there fulfill
    desires and move at will amid waters, forests, mansions, hills, and other delights.
    The passage then lists moral qualities required to attain or see the region and
    explains the religious merit produced by gifts of cows acquired in different ways
    and given by persons of different social classes.
  language: English
  quote_policy: summarized
