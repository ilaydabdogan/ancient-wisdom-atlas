- id: obs:1
  text: The Grandsire speaks to Sakra/Indra in response to questions concerning kine
    and their gift.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says there are regions invisible even to Indra but seen by the
    Grandsire and by chaste women attached to one husband.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rishis, righteous Brahmanas, and vow-observant men are said to reach or behold
    those regions through righteousness, piety, cleansed minds, and temporary emancipation
    from bodily consciousness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In those regions, the course of Time is suspended, and decrepitude, omnipresent
    Fire, evil, disease, and weakness are absent.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The kine living there obtain the fruition of every desire, move at will, and
    enjoy wishes as they arise.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The region contains lakes, tanks, rivers, forests, mansions, hills, and delightful
    objects.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: People described as forgiving, enduring, affectionate to all things, obedient
    to preceptors, and free from pride repair to these regions of supreme felicity.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A person who abstains from flesh, has a cleansed heart, honors parents, is
    truthful, serves Brahmanas and preceptors, avoids anger toward kine and Brahmanas,
    gives gifts, forgives, is self-restrained, reveres deities, is hospitable, and
    has compassion attains the eternal region of kine.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Persons described as adulterers, slayers of preceptors or Brahmanas, false
    speakers, quarrelers, enemies of Brahmanas, injurers of friends, guileful, ungrateful,
    cheats, crooked in conduct, or disregarding religion cannot see or attain the
    region of kine.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A person who gives cows acquired by inheritance or lawful wealth attains many
    inexhaustible regions of felicity.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: A cow acquired by dice, ancestral share, or gift may produce merit when given,
    with the passage specifying felicity for ten thousand celestial years in the dice-acquired
    case and eternal beatitude in the re-gifted case when given with a pure heart.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage instructs that improper speech should not be addressed to a Brahmana,
    injury should not be done to a cow even in thought, conduct should imitate the
    cow, and compassion should be shown toward the cow.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: For a person devoted to truth, a single cow given away becomes equal to a
    thousand kine; further numerical equivalents are given for gifts by Kshatriya,
    Vaisya, and Sudra donors.
  category: sequence
  evidence_refs:
  - ev:11
