canonical_text:
  quote: ''
  summary: The Rishi commands the king and queen to bear him through the city in a
    car, promises unrestricted gifts to those who approach, and has the king order
    his servants to distribute whatever the ascetic requests. Wealth and royal attendants
    follow the car. The city grieves as the Rishi strikes the weakened, fasting royal
    couple with a sharp goad; they continue without visible agitation, become bloodied,
    and are praised by citizens for endurance while the citizens fear the Rishi's
    curse and power of penance.
  language: English
  quote_policy: summarized
