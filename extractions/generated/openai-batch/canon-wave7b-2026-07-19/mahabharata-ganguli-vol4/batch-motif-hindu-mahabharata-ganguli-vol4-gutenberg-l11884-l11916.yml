canonical_text:
  quote: Kine are the foremost of all objects.
  summary: Yudhishthira asks Bhishma to identify the most sacred and sanctifying object.
    Bhishma answers that kine are supreme, sacred, rescuing, and sustaining through
    milk and Havi; gifts of kine bring Heaven and higher regions. He then introduces
    an old discourse in which Suka asks Vyasa about the foremost sacrifice, the sacred
    act leading to the highest region, and the foundation of sacrifice.
  language: English
  quote_policy: quoted
