- id: obs:3
  text: The rewarded person is crowned, adorned with gold ornaments, smeared with
    celestial sandal paste, garlanded with celestial wreaths, and roves celestial
    regions through the grace of deities.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The rewarded person receives high honors in Heaven for many years and sports
    with Indra in Indra's abode for 21,000 years.
