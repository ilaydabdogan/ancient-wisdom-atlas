canonical_text:
  quote: ''
  summary: 'The passage describes rewards associated with reaching a stage of Bharata
    recitation and gratifying Brahmanas: a richly adorned celestial car, heavenly
    ornaments, travel through celestial regions, honor in Heaven, sport in Indra''s
    abode, and access to the regions of several deities including Vishnu. It then
    prescribes gifts, foods, and honors to be given to Brahmanas, Kshatriyas, and
    the reciter at particular parvas and at the conclusion of the Harivansa.'
  language: English
  quote_policy: summarized
