canonical_text:
  quote: ''
  summary: Dhritarashtra instructs Yudhishthira on royal policy concerning war and
    peace, including assessment of strength, use of allies, spies, armies, timing,
    battlefield arrays, and conciliation. He concludes that a king who rules subjects
    righteously becomes beloved and gains heavenly merit equal to that of a hundred
    horse-sacrifices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dhritarashtra addresses Yudhishthira and tells him to reflect on war and peace,
    whose means and circumstances vary.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is instructed to reflect calmly on his own strength and weakness
    and not to march suddenly against a foe with contented, healthy, intelligent soldiers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker advises marching against a foe lacking contented and healthy combatants,
    retiring to a strong position after victory, creating calamities and dissension
    among the foe's allies, and weakening the foe's forces.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A king who marches against a foe should consider kinds of strength, his own
    strength, and his enemy's strength; only one with alacrity, discipline, and strong
    counsel should march.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The king is told to provide himself with powers of wealth, allies, foresters,
    paid soldiery, and mechanical and trading classes; allies and wealth are described
    as superior, and spies as often equal in efficacy to other powers.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Calamities affecting rulers are described as manifold and should be counted
    by type and met through conciliation and other known means.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before marching, the king should consider time, place, collected forces, his
    own merits, and the cheerfulness and health of his warriors.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The army is figured as a river with quivers as stones, steeds and cars as
    current, standards as trees on the banks, and foot-soldiers and elephants as mire.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Battle arrays called Sakata, Padma, and Vijra are named as formations to be
    used against the enemy according to the science known to Usanas.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The king should learn the enemy's strength through spies, examine his own
    strength, gratify his army, send his strongest warriors, ascertain the state of
    his kingdom, and use conciliation or other means.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
