canonical_text:
  quote: ''
  summary: Bhishma explains ordinances and mythic rationale for Sraddha rites to the
    Pitris. Excessive offerings cause the Pitris and deities distress, so they consult
    Soma and then the Self-born on Meru. Agni agrees to share the offerings with the
    Pitris so they can digest them, establishing the rule that fire receives the first
    share and protects the rite from Rakshasas. The passage then lists ritual order,
    mantras, exclusions, water oblations at rivers, New-moon offerings, benefits for
    descendants, and the freeing of deceased kin from misery.
  language: English
  quote_policy: summarized
