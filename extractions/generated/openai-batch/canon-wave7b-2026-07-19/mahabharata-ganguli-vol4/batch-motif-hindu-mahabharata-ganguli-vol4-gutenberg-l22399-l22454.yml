canonical_text:
  quote: ''
  summary: The god of wind tells king Arjuna that Brahmanas are superior and unconquerable,
    giving examples of Brahmana power over Earth, waters, Wind, Purandara, Ocean,
    Agni, Sagara's sons, kingdoms, and Kshatriyas. He then links Agni and sacrifice
    to Brahmana status, identifies Brahman as creator, disputes the claim that Brahman
    was born from an Egg, and says Arjuna remained silent.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The god of wind addresses a king called Arjuna and states that Brahmanas are
    superior to all beings the king has named.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Earth is said to have rivaled the king of the Angas, forsaken her character
    as Earth, and been paralyzed or destroyed by Kasyapa.
  category: action
  evidence_refs:
