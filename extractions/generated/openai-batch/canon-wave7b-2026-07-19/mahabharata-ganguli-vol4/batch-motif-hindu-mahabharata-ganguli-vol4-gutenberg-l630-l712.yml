canonical_text:
  quote: there arose from the waters of Ganga thousand high-mettled horses
  summary: Bhishma recounts how Richika obtained a thousand extraordinary horses from
    Varuna and gave them to Gadhi as marriage-dower for Gadhi's daughter Satyavati.
    Richika later prescribed consecrated offerings and tree-embracing rites so that
    Satyavati and her mother would bear sons, but the women exchanged the assigned
    offerings and trees. Richika explained that this reversed the intended Brahmana
    and Kshatriya energies. Satyavati pleaded that the fierce Kshatriya nature fall
    to her grandson rather than her son; Jamadagni was born to her, and Viswamitra
    was born to Gadhi's wife and later attained Brahmana status.
  language: English
  quote_policy: quoted
