canonical_text:
  quote: ''
  summary: In Heaven, Yudhishthira beholds the princess of Panchala. Indra identifies
    her as Sree, born as Drupada's daughter without a mother's womb and created by
    the wielder of the trident. Indra also identifies Draupadi's sons as Gandharvas
    and points out deceased kin, teachers, and warriors in divine company. Janamejaya
    then asks how long such heroes remain in Heaven and what end they reach when their
    acts end; Vaishampayana begins to answer by invoking a divine mystery taught by
    Vyasa.
  language: English
  quote_policy: summarized
