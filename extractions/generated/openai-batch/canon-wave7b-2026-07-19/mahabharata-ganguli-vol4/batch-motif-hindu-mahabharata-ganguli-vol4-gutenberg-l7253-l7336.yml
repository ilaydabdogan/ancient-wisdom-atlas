canonical_text:
  quote: ''
  summary: Vipula protects his preceptor's wife Ruchi by dwelling within and restraining
    her body and senses through Yoga-powers. Indra enters the ascetic's asylum in
    a beautiful form and attempts to address and entice her. Vipula restrains Ruchi's
    movements and speech, is discovered by Indra through spiritual sight, returns
    to his own body, and rebukes Indra by recalling Gautama's former curse and warning
    him against offending Brahmanas and ascetics.
  language: English
  quote_policy: summarized
