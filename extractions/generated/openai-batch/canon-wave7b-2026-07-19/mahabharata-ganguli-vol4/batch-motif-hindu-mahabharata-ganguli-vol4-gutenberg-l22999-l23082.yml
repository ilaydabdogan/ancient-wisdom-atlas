canonical_text:
  quote: ''
  summary: Vasudeva tells a king how his son Pradyumna once asked about the merit
    and power of worshipping Brahmanas. Vasudeva replies that Brahmanas should be
    gratified for worldly aims, emancipation, healing, and rites, and that their anger
    is dangerous. He then recounts hosting the volatile Brahmana Durvasa, who demanded
    hospitality, behaved unpredictably, burned furnishings and attendants, required
    Krishna and Rukmini to smear themselves with frumenty, yoked Rukmini to a car,
    struck her, and provoked the angry amazement of the Dasarhas.
  language: English
  quote_policy: summarized
