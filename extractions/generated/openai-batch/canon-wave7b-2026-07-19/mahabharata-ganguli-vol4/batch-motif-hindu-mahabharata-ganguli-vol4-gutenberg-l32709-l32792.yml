  quote: ''
  summary: Arjuna faces the Saindhava warriors during the sacrificial-horse campaign,
    remembers Yudhishthira's command to vanquish rather than kill, and offers to spare
    those who submit. After renewed fighting, Dussala arrives with her infant grandson,
    explains the death of Suratha from grief, and pleads for mercy and peace for the
    child and the Saindhava warriors.
