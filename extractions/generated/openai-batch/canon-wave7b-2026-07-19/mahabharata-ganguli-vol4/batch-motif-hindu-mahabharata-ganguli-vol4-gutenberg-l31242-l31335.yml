canonical_text:
  quote: ''
  summary: 'Ahalya tells Gautama that she has unknowingly sent Utanka on a dangerous
    task, and Gautama grants that Utanka will not incur danger through his grace.
    Utanka then meets King Saudasa in a deserted forest. Saudasa, frightening in form
    and hungry at the sixth hour, threatens to eat him, but Utanka argues that one
    acting for a preceptor should not be harmed. Utanka proposes a compact: he will
    obtain the object needed for his preceptor and return to Saudasa’s power afterward.
    He asks for the jewelled earrings worn by Saudasa’s queen. Saudasa directs him
    to ask Queen Madayanti at a fountain. Madayanti asks for a sign from her husband
    and describes the earrings as celestial, coveted by deities, Yakshas, Rishis,
    Nagas, and Rakshasas, able to produce gold, shine at night, protect the wearer,
    and change size according to the wearer.'
  language: English
  quote_policy: summarized
