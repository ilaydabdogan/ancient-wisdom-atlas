canonical_text:
  quote: ''
  summary: Yudhishthira gives bulls and kine to Brahmanas as sacrificial gifts. Bhishma
    then recounts how King Saudasa asked Vasishtha what sacred recitation brings high
    merit. Vasishtha, after reverencing kine, teaches that kine are sources of blessing,
    sacrifice, prosperity, and protection, and prescribes gifts, recitations, reverence,
    and ritual uses of cow products.
