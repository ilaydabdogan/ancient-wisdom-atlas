canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to recount Mahadeva's names and power. Bhishma
    says he is unable to describe Mahadeva fully, praises Mahadeva as supreme and
    difficult to know, and says Krishna/Vasudeva is qualified to speak because of
    his devotion and penances to Siva. Bhishma asks Vasudeva to recite Mahadeva's
    thousand names, recalling Rishi Tandi's earlier recitation before Brahma. Vasudeva
    acknowledges that gods and seers cannot fully comprehend Mahadeva, says he will
    recite some attributes, purifies himself by touching water, and begins.
  language: English
  quote_policy: summarized
