- id: obs:1
  text: Yudhishthira asks Bhishma to tell the names and puissance of Maheshwara, described
    with names including Isa, Sambhu, Vabhru, and as having the universe for his form
    and as cause of origin and dissolution.
  category: speech
  evidence_refs:
  - ev:1
