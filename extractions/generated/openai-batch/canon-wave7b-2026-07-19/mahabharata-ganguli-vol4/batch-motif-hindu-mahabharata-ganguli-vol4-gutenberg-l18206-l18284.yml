canonical_text:
  quote: ''
  summary: 'A sequence of divine and ancestral speakers describes rites and prohibitions:
    water-bathing with remembrance of sacred places, fasting and cow-reverence, food
    and anointing rites involving banian roots, oil, paddy, and milk, mountain austerity
    before fire and sun, offences against Sun, Wind, Fire, and kine with their consequences,
    and offerings to the Pitris involving blue bulls, sesame-water, lamps, and offspring.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sakra instructs that a person should think of Kurukshetra, Gaya, Ganga, Prabhasa,
    and Pushkara lakes and dip the head in water for cleansing from sin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sakra also prescribes bathing for three successive days, fasting daily, touching
    a cow's back, and bowing the head to the cow's tail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vidyutprabha describes a rite using astringent powder from hanging banian
    roots, Priyangu oil, Shashtika paddy, and milk, with cleansing from sins as its
    stated effect.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vidyutprabha says the rite was a mystery discovered by Rishis through meditation
    and heard from Vrihaspati in the presence of Mahadeva.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: An ascetic practice is described in which a person ascends a mountain, stands
    on one foot with raised joined arms, abstains from food, and looks at a blazing
    fire while heated by the sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The mountain austerity is said to bring merits of severe penances, rewards
    of fasts, cleansing from sins, and lasting splendour.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Sakra asks Vrihaspati to discourse on religious mysteries, happiness-producing
    practices for humans, and faults humans commit.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Vrihaspati lists faults involving passing urine facing the sun, failing to
    revere the wind, failing to pour libations on blazing fire, and milking a cow
    whose calf is very young for maximum milk.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sun, Wind, Fire as bearer of sacrificial oblations, and kine as mothers of
    all creatures are said to have been created by the Self-born for rescuing all
    worlds.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Vrihaspati gives consequences for the listed faults: long infamy, premature
    loss of children in the womb, fire refusing libations, and failure or shrinkage
    of lineage.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Deities, Maruts, and Rishis ask the Pitris what human acts gratify them, what
    gifts become inexhaustible for the deceased, and how humans become free from debt
    to the Pitris.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Pitris prescribe setting free blue bulls, giving sesame seeds and water
    on the new moon, lighting lamps in the rainy season, and begetting offspring.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Pitris say these acts free humans from debt to the Pitris, yield inexhaustible
    gratification, and allow offspring to rescue deceased ancestors from miserable
    Hell.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Vriddha-Gargya reacts with wonder and asks about the merits of freeing blue
    bulls, giving lamps in the rains, and giving water with sesame seeds.
  category: speech
  evidence_refs:
  - ev:9
