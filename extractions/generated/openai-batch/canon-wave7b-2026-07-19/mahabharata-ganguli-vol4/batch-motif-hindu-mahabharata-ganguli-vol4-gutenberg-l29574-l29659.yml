canonical_text:
  quote: ''
  summary: Brahma explains an embodied aggregate as a nine-portal city governed by
    Mind, Understanding, the three Nadis, and the three qualities of Darkness, Passion,
    and Goodness. He describes the attributes of the qualities, especially Darkness,
    and links sinful conduct to downward rebirths, hell, and lower forms of life.
    He then states that beings can improve and ascend through purificatory rites,
    higher births, and eventual access to Heaven, while warning that attachment to
    desire causes delusion even among sages and deities.
  language: English
  quote_policy: summarized
