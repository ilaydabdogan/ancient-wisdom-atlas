canonical_text:
  quote: Make a journey to the sacred North. Thou wilt see many things there!
  summary: Yudhishthira asks Bhishma about the origin and meaning of joint marital
    duties and raises doubts about whether such union survives death. Bhishma answers
    by introducing an old narrative about Ashtavakra, who seeks Vadanya’s daughter
    Suprabha in marriage and is commanded to journey north through sacred mountain
    regions associated with Mahadeva and Uma, then to worship an aged female ascetic
    before returning to marry.
  language: English
  quote_policy: quoted
