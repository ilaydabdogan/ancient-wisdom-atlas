canonical_text:
  quote: ''
  summary: 'The Pitris explain ordinances for Sraddha offerings: three rice-balls
    are consigned respectively to water, the spouse, and fire, producing gratification
    of deities and ancestors, progeny, wealth, and fulfilled wishes. They also prescribe
    purity and abstinence for the officiating or eating Brahmana. A later scene introduces
    the Rishi Vidyutprabha asking Sakra about the sin of killing creatures and its
    remedy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pitris warn that a man who has sexual congress on the day he performs
    or eats at a Sraddha causes his Pitris to lie for a month on his vital seed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage assigns the first Sraddha rice-ball to water, the second to a
    wife or spouse to eat, and the third to blazing fire.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Pitris say that correct observance gratifies them, keeps them cheerful,
    increases progeny, and brings inexhaustible wealth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The celestial messenger asks how the rice-balls consigned to water, spouse,
    and fire reach, gratify, or rescue the Pitris and deities.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The explanation of the rice-balls is described as a mystery known with certainty
    only to Markandeya, with Vyasa named as the source from whom the explanation was
    heard.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The rice-ball consigned to water is said to gratify the deity of the moon,
