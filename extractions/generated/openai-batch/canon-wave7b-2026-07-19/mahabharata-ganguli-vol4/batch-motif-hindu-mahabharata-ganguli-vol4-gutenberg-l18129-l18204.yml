  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The second rice-ball is eaten by the spouse, and the Pitris, desiring progeny,
    confer children on the woman of the house.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The rice-ball cast into blazing fire gratifies the Pitris, who grant the fruition
    of wishes to the offerer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Brahmana who acts as Ritwik at a Sraddha is said to become the Pitri of
    the performer and must abstain from sexual intercourse; a Brahmana who eats at
    the Sraddha should bathe, remain pure, and avoid injury or evil that day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Vidyutprabha asks Sakra what remedy exists for the heavy sin incurred when
