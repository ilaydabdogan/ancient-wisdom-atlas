canonical_text:
  quote: ''
  summary: Vaisampayana describes Yudhishthira ordering a royal and military procession
    to depart toward Dhritarashtra's forest retreat. The procession includes troops,
    heroes, citizens, royal women, vehicles, animals, music, praise-singers, a white
    umbrella, and gifts of wealth. After slow travel through river and lake country,
    Yudhishthira reaches Kurukshetra, crosses the sacred Yamuna, sees the retreat
    of a royal sage and Dhritarashtra, and the company enters the forest joyfully.
  language: English
  quote_policy: summarized
