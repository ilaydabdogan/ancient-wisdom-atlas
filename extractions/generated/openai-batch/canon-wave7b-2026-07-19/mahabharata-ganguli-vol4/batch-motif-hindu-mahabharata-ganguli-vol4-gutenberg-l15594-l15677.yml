  quote: ''
  summary: The passage gives prescriptive rules for conduct involving hospitality,
    respect for elders and preceptors, purity and impurity, bathing, clothing, eating,
    ritual study, bodily functions, calendrical sexual restraint, and avoidance of
    insulting Brahmanas, Kshatriyas, and snakes. It cites an old gatha attributed
    to Yama about the dangers of studying the Vedas at forbidden or impure times.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Guests and old men are to be saluted, elders are to be given seats by hand,
    and an elder on the road is to be followed rather than preceded.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives prohibitions concerning broken seats, broken vessels, nudity
    while eating, bathing, or sleeping, touching food remnants, and handling another
    person's head or hair.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The head is described as the place where life-breaths are concentrated, and
    several restrictions concern touching, striking, scratching, or repeatedly dipping
    the head in water.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Vedic teaching or study is forbidden during impurity or other forbidden conditions
    such as storms or bad odors; an old gatha attributed to Yama warns that such study
    causes loss of the Vedas and shortened life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Calls of nature are regulated by direction and by avoidance of the sun, blazing
    fire, cows, regenerate persons, and roads.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A person desiring long life is told not to disregard or insult Brahmanas,
    Kshatriyas, or snakes, each of which is described as possessing destructive power.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The snake is said to burn its victim with a glance when angry, the Kshatriya
    to burn the object of wrath with energy, and the Brahmana to destroy the object
    of wrath and the whole race by thought.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Disputation with one's preceptor is prohibited; an angry preceptor is to be
    pacified with honor, and even a wrong preceptor is to be followed and honored.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The remnants of dishes and plates, foot-washing, and calls of nature are to
    be kept at a distance from one's habitation.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage regulates garlands, colors of flowers, gold garlands, perfumes,
    garments for different activities, unguents, fasting, and abstinence from sexual
    congress on full-moon and new-moon days.
  category: object
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Eating rules include avoiding a shared plate, food prepared by a woman in
