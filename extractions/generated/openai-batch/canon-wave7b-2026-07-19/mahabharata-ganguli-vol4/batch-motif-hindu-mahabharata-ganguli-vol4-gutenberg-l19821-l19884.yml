canonical_text:
  quote: ''
  summary: Uma asks Sankara/Maheswara about the sacred ordinances of forest recluses.
    Maheswara describes their forest dwellings, vows, ablutions, fire rites, sacrifices,
    Yoga postures, austerities amid natural elements, sparse food and possessions,
    discipleship under a preceptor, and attainment of sacred regions. Uma then asks
    about another class of Munis associated with scriptures of ascetic success, including
    some who act without fixed practices and some who have wives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Uma describes forest recluses as living near springs, fountains, rivers, streams,
    hills, mountains, woods, forests, and sacred places full of fruits and roots.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Uma asks Sankara to tell her the sacred ordinances followed by forest recluses,
    whom she says depend on themselves for bodily protection.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Maheswara tells Uma to listen with concentrated attention to the duties of
    forest recluses who observe rigid vows and live in woods and forests.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The recluses are said to perform ablutions three times a day, worship the
    Pitris and deities, pour libations on the sacred fire, and perform Ishti-homa
    rites.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Their subsistence includes Nivara-paddy grains, fruits, roots, and oil pressed
    from Inguda and castor seeds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: After Yoga practice and ascetic success, they are to be freed from lust and
    wrath, sit in Virasana, reside in places inaccessible to cowards, practice Manduka
    Yoga, sit among four fires with the sun overhead, lie on rocks or earth, and expose
    themselves to cold, water, and fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some subsist on water, air, or moss; some use stones or their teeth for husking
    grain; they keep no utensils; and some wear rags, tree bark, or deer-skins.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Forest recluses are described as remaining, wandering, and living in woods
    and forests, and as living as disciples after obtaining a preceptor.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Their duties include Homa, the five sacrifices, Vedic rules for distributing
    the fivefold sacrifices, Chaturmasya, Paurnamasya, and daily sacrifices.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The recluses are described as dissociated from wives, free from attachment,
    cleansed from sin, and devoted to the three fires.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: The sacrificial ladle and water-vessel are described as the chief wealth of
    the forest recluses.
  category: object
  evidence_refs:
  - ev:7
- id: obs:12
  text: Maheswara says these Munis attain the highest end, the sacred region of Brahman,
    or the eternal region of Soma.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Uma asks about Munis who follow scriptures treating ascetic success, noting
    that some live and act as they like while others have wives.
  category: speech
  evidence_refs:
  - ev:8
