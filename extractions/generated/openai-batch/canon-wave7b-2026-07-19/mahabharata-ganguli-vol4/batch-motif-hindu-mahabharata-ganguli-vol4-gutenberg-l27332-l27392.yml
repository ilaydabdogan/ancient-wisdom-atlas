canonical_text:
  quote: ''
  summary: Samvarta describes the Himalayan peak Munjaban as the residence of Mahadeva
    with Uma, surrounded and worshipped by many divine and spirit beings. The mountain
    has extraordinary conditions, including freedom from hunger, thirst, aging, death,
    and fear, and contains gold mines guarded by Kuvera's attendants. Samvarta instructs
    Marutta to propitiate Mahadeva there to obtain gold for a sacrifice. Marutta follows
    the instruction, gold vessels are made, and Vrihaspati becomes distressed at Marutta's
    prosperity and Samvarta's success.
  language: English
  quote_policy: summarized
