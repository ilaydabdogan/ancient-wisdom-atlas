canonical_text:
  quote: ''
  summary: Sukra instructs the ruler of the Daityas/Asuras on the origins and classes
    of herbs, flowers, incense, and the beginning of a discussion of lights. The passage
    classifies substances as auspicious or inauspicious, assigns particular flowers
    and incenses to deities and other beings, and describes the reciprocal effects
    of proper or improper offerings.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sukra is the speaker and addresses a ruler or prince of the Daityas/Asuras.
  category: speech
  evidence_refs:
  - ev:1
  - ev:3
  - ev:8
- id: obs:2
  text: Penance is said to have arisen first, Dharma afterward, and many creepers
    and herbs in the interval; Soma is named as lord of all the creepers and herbs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Creepers and herbs are divided into Amrita, Poison, and a third class that
    is neither; Amrita is associated with immediate mental gratification, while Poison
    is associated with mental torture through odor.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Flowers are said to gladden the mind, confer prosperity, and gratify deities
    when offered by a pure worshipper.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Flowers are classified by source, including wild growth, habitation-grown
    trees, cultivated trees, mountains, thornless trees, and prickly trees, as well
    as by fragrance, form, and taste.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Different flowers or garlands are assigned to different recipients, including
    deities, Asuras, Rakshasas, Uragas or Nagas, Yakshas, Gandharvas, human beings,
    and Pitris.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Red, black, keen-scented, prickly, thorny, or painful flowers are associated
    with incantations for injuring foes and with offerings to evil spirits and unearthly
    beings.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Flowers from cemeteries, crematoria, or places dedicated to deities are prohibited
    for marriage rites, prosperity rites, and secret pleasure rites.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The passage distinguishes recipients by the sensory mode through which they
    are gratified: deities by scent, Yakshas and Rakshasas by sight, Nagas by touch,
    and human beings by scent, sight, and touch together.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Incenses are classified as auspicious or inauspicious, as exudations, fragrant
    wood set on fire, or artificial mixtures, and as agreeable or disagreeable in
    scent.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Specific exudations and incenses are assigned to deities, Yakshas, Rakshasas,
