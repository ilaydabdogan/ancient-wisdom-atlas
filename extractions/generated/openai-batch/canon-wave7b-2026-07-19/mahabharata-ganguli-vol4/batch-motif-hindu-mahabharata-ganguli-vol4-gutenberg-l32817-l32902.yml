canonical_text:
  quote: '"The battle that took place between sire and son was incomparable."'
  summary: Vabhruvahana, ruler of Manipura and son of Arjuna, first approaches Arjuna
    peacefully, but Arjuna rebukes him for failing to fight the protector of Yudhishthira's
    sacrificial horse. Ulupi, daughter of the Snake-king, emerges through the Earth
    and urges Vabhruvahana to fight his father. Vabhruvahana arms himself, seizes
    the sacrificial steed, and battles Arjuna. After exchanges of arrows, Vabhruvahana
    pierces Arjuna in the breast, and Arjuna falls in a swoon. Vabhruvahana also falls
    unconscious from exertion and grief, and Chitrangada goes to the battlefield after
    hearing the news.
  language: English
  quote_policy: quoted
