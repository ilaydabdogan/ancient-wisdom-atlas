canonical_text:
  quote: ''
  summary: Agni and Brahman each claim divine parentage over offspring arising in
    connection with a sacrifice. The deities petition Brahman, after which Mahadeva
    in Varuna form receives Bhrigu, Angiras is assigned to Agni, and Kavi is taken
    by Brahman. The passage then traces the descendants of Bhrigu, Angiras, and Kavi
    as progenitors who people the world, receive divine sanction, and are associated
    with creation after universal destruction. It closes by identifying Agni with
    several divine names and describing gold as Agni's offspring and a substitute
    for fire in sacrifice; the final supplied line is incomplete.
  language: English
  quote_policy: summarized
