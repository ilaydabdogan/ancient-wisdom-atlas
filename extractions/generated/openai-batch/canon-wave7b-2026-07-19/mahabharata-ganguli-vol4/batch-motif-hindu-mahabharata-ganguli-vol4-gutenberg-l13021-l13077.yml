  text: Bhishma describes the Sraddha ritual as auspicious, praiseworthy, productive
    of fame and progeny, and regarded as a sacrifice in honor of the Pitris.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhishma states that gods, Asuras, human beings, Gandharvas, Uragas, Rakshasas,
    Pisachas, and Kinnaras should worship the Pitris.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says people worship the Pitris first and gratify the deities afterward.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that deceased grandsires are gratified by Sraddha on any
    day, while also mentioning a special rule for performing Sraddha for the Pitris
