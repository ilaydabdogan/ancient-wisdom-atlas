canonical_text:
  quote: ''
  summary: Yudhishthira asks for instruction on the ordinances of Sraddha for deceased
    ancestors. Bhishma explains that Sraddha is an auspicious rite, a sacrifice in
    honor of the Pitris, and then lists rules and fruits associated with performing
    it on particular lunar days, emphasizing the new moon, the dark fortnight, and
    the afternoon as especially appropriate times.
  language: English
  quote_policy: summarized
