  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bhishma lists benefits associated with performing Sraddha on the first through
    thirteenth days of the lighted fortnight, including spouses, daughters, steeds,
    smaller animals, sons, splendor, fame, trade profit, livestock, cows, clothes,
    utensils, sons with Brahma splendor, silver and gold articles, and eminence over
    kinsmen.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Performing Sraddha on the fourteenth day is said to be connected with the
    death of young men in the family and entanglement in war.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Performing Sraddha on the new moon day is said to bring the fruition of every
    wish.
  category: sequence
  evidence_refs:
  - ev:5
