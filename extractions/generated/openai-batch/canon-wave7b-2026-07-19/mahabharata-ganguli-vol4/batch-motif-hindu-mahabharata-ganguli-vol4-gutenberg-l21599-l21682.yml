canonical_text:
  quote: ''
  summary: A sequence of epithets describes a central divine figure as destroyer,
    creator, refuge, knower, preserver, and source of prosperity. The passage includes
    allusions to a horned fish form saving Manu at the universal deluge, a Boar form,
    a dwarf born from Aditi who beguiled Vali, a sky-reaching form at Vali's sacrifice,
    weapons and emblems, renunciation, post-dissolution sleep on Sesha, and Lakshmi
    dwelling with and choosing the deity.
  language: English
  quote_policy: summarized
