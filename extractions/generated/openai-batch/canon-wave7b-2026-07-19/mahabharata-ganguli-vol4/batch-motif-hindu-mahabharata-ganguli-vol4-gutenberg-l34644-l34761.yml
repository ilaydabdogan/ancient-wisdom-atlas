canonical_text:
  quote: ''
  summary: 'Translator/editor footnotes explain allegorical and doctrinal readings:
    restraining senses and mind as an inner sacrifice, Narayana as Veda or Soul, seven
    trees as senses and inner faculties, Yoga and initiation as sensory extinction
    or repudiation, freedom through knowledge, Kshatriyas fleeing Rama and losing
    status, and Janaka’s mastery of sensations and preference for knowledge over sovereignty.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the senses and mind should be restrained, and their objects
    should be offered as libations on the sacred fire of the Soul within the body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports an interpretation in which Narayana stands for either
    the Veda or the Soul, and animals formerly offered to Narayana are explained as
    the senses offered as sacrifices.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note states that the same figure is both preceptor and disciple, concluding
    that no other guru exists.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The seven large trees are identified with the five senses, the mind, and the
    understanding; their fruits are pleasures and pains; their guests are the powers
    of the senses; and the hermitages are the trees themselves.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The seven forms of Yoga are explained as extinctions of the seven senses,
    and the seven forms of initiation as repudiations of the actions of those senses.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The life-winds, tongue and other organs, mind, goodness, and passion are presented
