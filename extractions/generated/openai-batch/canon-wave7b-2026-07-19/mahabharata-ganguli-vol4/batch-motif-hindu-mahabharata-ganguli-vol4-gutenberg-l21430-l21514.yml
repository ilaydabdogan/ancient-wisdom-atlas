- id: obs:8
  text: Prosperity is said to sit always on the praised figure's breast.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The praised figure is said to cause creation to start, agitate Prakriti and
    Purusha, be the material and agentive cause of the universe, and ordain variety
    in the universe.
  category: action
  evidence_refs:
  - ev:11
- id: obs:10
  text: All things are said to rest on the praised figure and to reside or merge in
