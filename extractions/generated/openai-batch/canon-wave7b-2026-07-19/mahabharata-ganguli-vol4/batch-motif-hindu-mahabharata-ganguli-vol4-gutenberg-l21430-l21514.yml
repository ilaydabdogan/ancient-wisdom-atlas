canonical_text:
  quote: ''
  summary: A litany of epithets praises a divine male figure as sustainer of the universe,
    source and material cause of creation, recipient of sacrifice, guide to emancipation,
    repeated earthly rescuer, and bearer of lotus, Garuda, cord, mountain, water,
    fire, dissolution, and golden-egg imagery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The praised figure is said to show grace to worshippers, give boons to petitioners,
    and be the foremost object of worship.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:2
  text: The praised figure is described as holding the universe, upholding the Earth,
    bearing the burden of the universe, and upholding the Earth in the form of mountains.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:10
- id: obs:3
  text: The praised figure is identified as the younger brother of Vasava in the form
    of Upendra or the dwarf, as the son of Vasudeva, as an offspring of Sura's race,
    and as Krishna bound by Yasoda with a cord.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
  - ev:9
- id: obs:4
  text: The praised figure is associated with waters, nectar, winds, and the ocean
    of life or the world.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The praised figure holds a lotus, has lotus-like eyes, has a primeval lotus
    springing from his navel or is seated on a lotus, and is adored as seated in a
    lotus of the heart.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
