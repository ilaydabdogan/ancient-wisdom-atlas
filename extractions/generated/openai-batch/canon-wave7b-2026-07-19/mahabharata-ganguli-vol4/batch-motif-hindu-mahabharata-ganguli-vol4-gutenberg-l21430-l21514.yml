  category: relationship
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:11
  text: The praised figure is said to be the faultless Path and to lead Jiva to Emancipation.
  category: action
  evidence_refs:
  - ev:13
- id: obs:12
  text: The praised figure is said to join disunited elements at creation and to create
