canonical_text:
  quote: ''
  summary: Bhishma recounts how Vipula, after severe penances and pride in his accomplishment,
    is sent by Devasarman to obtain celestial flowers desired by Ruchi's sister. On
    his way with the flowers, Vipula sees a disputing couple and then six dice players,
    each group swearing that wrongdoing will bring the same next-world end reserved
    for Vipula. Disturbed, Vipula recalls that he had entered his preceptor's wife's
    body while protecting her from Indra but had not told his preceptor the truth;
    he then gives the flowers to his preceptor and worships him.
  language: English
  quote_policy: summarized
