  text: The passage repeatedly refers to a single masculine divine figure as “He”
    and says all creatures dwell in him, the universe is spread out in him, and all
    things rest in him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The figure is described as an indestructible and unchanging seed, a great
    cause, without birth, and beyond birth and destruction.
  category: attribute
  evidence_refs:
