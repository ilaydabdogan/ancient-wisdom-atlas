  - ev:2
  - ev:7
- id: obs:3
  text: 'The figure is identified with sacrifice: he is the embodiment of all sacrifices,
    is adored in sacrifices and rites, is connected with animal offerings, gives gifts
    in sacrifice, and drinks Soma in sacrifice.'
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
- id: obs:4
  text: The figure is described as refuge for seekers of emancipation, as one who
