canonical_text:
  quote: ''
  summary: The passage is a sequence of epithets for a masculine divine figure. It
    describes him as omnipresent, the ground in whom creatures and the universe rest,
    unborn and indestructible, the embodiment of sacrifice and knowledge, refuge of
    those seeking emancipation, protector of righteousness, universal father and nourisher,
    present in many forms including Krishna, the Sun, Soma, a vast Boar or Rama, and
    as lying on waters after universal dissolution.
  language: English
  quote_policy: summarized
literal_observations:
