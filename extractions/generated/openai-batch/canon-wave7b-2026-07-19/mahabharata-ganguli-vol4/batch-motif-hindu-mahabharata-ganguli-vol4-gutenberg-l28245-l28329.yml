canonical_text:
  quote: ''
  summary: A Brahmana teaches that good and bad acts follow the Jiva through repeated
    embodiments, produce corresponding results, and condition entry into the womb.
    He describes the Jiva animating the fetus through mind and Prana, lists righteous
    conduct that leads toward emancipation, recounts Brahma's creation of the worlds
    and Pradhana, distinguishes destructible and indestructible principles, and states
    that insight enables one to cross the ocean of worldly migration and seek the
    supreme indestructible seat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker states that good and bad acts done by a Jiva are not destroyed
    and produce corresponding fruits in body after body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage compares merit and sin to fruit or crop production: merit with
    a pure heart yields felicity, and sin with a sinful heart yields misery.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Jiva is described as entering the womb equipped with its acts and overwhelmed
    with lust and wrath; vital seed mixed with blood becomes the field of the Jiva
    according to acts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Jiva enters the limbs of the fetus part by part, accepts the attribute
    of mind, resides in regions belonging to Prana, supports life, and the fetus begins
    to move its limbs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage uses analogies of liquefied iron taking a mould, fire heating
    iron, and a lamp revealing things in a room to describe the Jiva and mind in the
    fetus and body.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Former acts are said to be enjoyed or endured, exhausted through that experience,
    and followed by the accumulation of other acts until knowledge leading to Emancipation
    is acquired.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The conduct of the good is described through practices including gifts, austerity,
    Brahmacharya, self-restraint, tranquility, compassion, non-cruelty, non-appropriation,
    service to parents, honoring deities and guests, worship of preceptors, pity,
    purity, and restraint of the organs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Yogin is described as emancipated and distinguished above the good; righteous
    action on every occasion leads after a long time to deliverance from the world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Brahma, called the Grandsire, first formed a body of his own and then created
    the three worlds of mobile and immobile creatures; he also created Pradhana, described
    as the material cause of embodied creatures.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The visible is called destructible or Kshara, while the other is called immortal,
    indestructible, Para, and Akshara; the passage characterizes the whole, for each
    Purusha, as duality among these three.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Grandsire is said to have ordained a time limit for bodily acceptance,
    migrations among diverse creatures, and return or rebirth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A person who regards pleasure and pain as inconstant, the body as an unholy
    conglomeration, and pleasure as bound with pain is said to cross the terrible
    ocean of worldly migration.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The speaker promises instruction concerning excellent knowledge of the indestructible
    seat.
  category: speech
  evidence_refs:
  - ev:8
