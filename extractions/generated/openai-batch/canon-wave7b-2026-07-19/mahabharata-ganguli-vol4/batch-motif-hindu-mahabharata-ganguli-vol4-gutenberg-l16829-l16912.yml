canonical_text:
  quote: ''
  summary: The passage gives a didactic catalogue of posthumous consequences for specific
    wrong acts. Various sins, including breach of trust, theft, sexual misconduct,
    ritual neglect, disregard of an elder brother, mixed-caste sexual acts, and ingratitude,
    lead to rebirth in animal, bird, insect, worm, or other degraded forms. The ungrateful
    person is additionally described as going to the regions of Yama, suffering torments
    from Yama's messengers, and then undergoing further degraded rebirths before eventual
    return toward human or near-human existence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person characterized by malice is said to be reborn as a Sarngaka after
    death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person guilty of breach of trust is said to be reborn successively as a
    fish, deer, goat, and worm before regaining human status.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person who steals many kinds of grain is said to be reborn as a mouse, then
    as a hog that dies of disease, then as a dog for five years, before regaining
    human status.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Adultery with another man's spouse is followed by rebirths as wolf, dog, jackal,
    vulture, snake, Kanka, and crane.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sexual congress with a brother's spouse is assigned rebirth as a male Kokila
    for a year; sexual congress with the wife of a friend, preceptor, or king is assigned
    a longer sequence through hog, wolf, cat, cock, ant, worm, and vile worm before
    return to humanity.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Obstructing a wedding, sacrifice, or gift leads to birth as a vile worm for
    fifteen years; attempting to bestow an already-married daughter on a second husband
    leads to birth among vile worms for thirteen years.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Eating without rites for deities or Pitris, and without water oblations to
    Rishis and Pitris, leads to rebirth as a crow for a hundred years, then as a cock,
    then as a snake for a month, before return to humanity.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Disregarding an eldest brother is followed by rebirth in the order of cranes
    for two years before return to humanity.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Sudra who has sexual intercourse with a Brahmana woman is said to be reborn
    as a hog that dies of disease, then as a dog before return to humanity; a Sudra
    who begets offspring on a Brahmana woman is said to be reborn as a mouse.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ungrateful person goes to the regions of Yama and receives painful treatment
    from Yama's messengers using implements and places of torment.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After suffering in Yama's regions, the ungrateful person returns to the world
    as vile vermin, then enters the womb and dies before birth, enters the womb a
    hundred times, is born in an intermediate order between man and inanimate nature,
    and finally is said to be reborn as a hairless tortoise after much misery.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Specific thefts of curds, raw fish, honey, fruits, roots, cakes, Nishpava,
