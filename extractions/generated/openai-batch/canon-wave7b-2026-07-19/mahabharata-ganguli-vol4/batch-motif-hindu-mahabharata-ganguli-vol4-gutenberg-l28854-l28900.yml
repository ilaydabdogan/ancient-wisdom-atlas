canonical_text:
  quote: The sacrifice constituted by Yoga is going on as regards myself.
  summary: 'A Brahmana explains the Chaturhotra sacrifice as an inner and cosmic scheme:
    agent, instrument, action, and Emancipation are four priests; faculties, objects,
    and agents are arranged in sevenfold sets; learned restraint turns sensory and
    mental acts into offerings into the inner fire of the Soul; the yoga sacrifice
    is described through Vedic ritual roles and components; Narayana is identified
    as the soul of all.'
  language: English
  quote_policy: quoted
