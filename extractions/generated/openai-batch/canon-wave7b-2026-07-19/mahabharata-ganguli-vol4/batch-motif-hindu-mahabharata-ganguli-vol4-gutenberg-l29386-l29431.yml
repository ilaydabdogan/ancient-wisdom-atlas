canonical_text:
  quote: From this is produced the fire of knowledge.
  summary: The Brahmana's wife asks how knowledge may be acquired. The Brahmana explains
    knowledge through an Arani fire-making image, describes Kshetrajna as without
    symbols or qualities, and says purified understanding and practice lead to the
    highest. Krishna then tells Arjuna that the Brahmana is his mind, the wife is
    his understanding, and Kshetrajna is Krishna himself.
  language: English
  quote_policy: quoted
