canonical_text:
  quote: ''
  summary: Janamejaya asks Vaisampayana what conversation occurred between Krishna
    and Arjuna after the war. Vaisampayana describes Arjuna and Krishna in a heaven-like
    palace. Arjuna says he has forgotten Krishna's earlier battlefield teaching and
    asks for renewed instruction before Krishna returns to Dwaraka. Krishna says he
    cannot repeat the prior discourse in detail, but will narrate an old history on
    the same topic. Within that framed account, a heavenly Brahmana tells of Kasyapa
    approaching an accomplished Brahmana sage, serving him as a disciple, and eliciting
    instruction on Moksha and related truths.
  language: English
  quote_policy: summarized
