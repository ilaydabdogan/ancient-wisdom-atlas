canonical_text:
  quote: ''
  summary: A didactic dialogue contrasts harmful conduct toward creatures with compassion,
    describes corresponding afterlife and rebirth outcomes, and has Uma ask Maheswara
    about the karmic causes of wisdom, folly, blindness, disease, impotence, and differing
    religious dispositions. Maheswara answers that inquiry with learned Brahmanas
    and good conduct lead to Heaven and intelligent rebirth, while certain acts of
    cruelty or sexual transgression lead to bodily afflictions in a later birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who uses deceit to slay or vex living creatures and pursues animals
    so that they tremble is said to sink into Hell and later be born in a low, wretched,
    impeded human family.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A compassionate person looks on all creatures with a friendly vision, behaves
    toward them as a father, controls passions and limbs, and does not injure them
    with cords, clubs, clods, brick-bats, or weapons.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The compassionate non-harming person is said to ascend to Heaven, live like
    a god in a celestial mansion, and later be reborn without fear, difficulty, distressing
    labor, or anxiety.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Uma asks why some people possess science, knowledge, learning, wisdom, and
    progeny, while others are foolish or have distorted vision, congenital blindness,
    disease, affliction, or impotence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Maheswara says that people who inquire about benefit and detriment from Veda-learned
    Brahmanas, avoid evil, and perform good deeds ascend to Heaven and are later reborn
    with great intelligence.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Maheswara says that men who look wickedly upon other men's wedded spouses
    are reborn with congenital blindness.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Maheswara says that men who look upon naked women out of desire are reborn
    to spend their lives in continuous disease.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Maheswara says that men who have sexual intercourse with women of different
    orders are reborn destitute of virility.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Maheswara says that men who cause animals to be slain, violate the beds of
    preceptors, or engage in promiscuous sexual intercourse are reborn without virile
    power.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Uma asks which acts are faulty or faultless and which acts lead a person to
    the highest good.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Maheswara says that a person seeking righteousness and higher virtues who
    questions Brahmanas about the path to his highest good ascends to Heaven and is
    later reborn with intelligence, memory, and great wisdom.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Uma asks why people differ in religious disposition, including hatred of righteousness,
    avoidance of Veda-knowing Brahmanas, observance or neglect of vows, performance
    of Sraddhas, Rakshasa-like conduct, devotion to sacrifices, and neglect of Homa.
  category: speech
  evidence_refs:
  - ev:9
