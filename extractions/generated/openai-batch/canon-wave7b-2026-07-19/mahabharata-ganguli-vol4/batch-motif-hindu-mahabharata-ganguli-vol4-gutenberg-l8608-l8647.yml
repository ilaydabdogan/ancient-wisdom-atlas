canonical_text:
  quote: ''
  summary: The Nishadas address Chyavana, invoke friendship formed through brief speech,
    praise him through fire imagery, surrender themselves, and ask him to take back
    a cow. Chyavana accepts the cow, speaks of the consuming power of certain eyes,
    and tells the fishermen that they are freed from sin and should go to heaven with
    the fish they caught. Bhishma narrates that the fishermen and fish proceed to
    heaven through the Rishi's energy and words. King Nahusha witnesses the ascent,
    receives boons from Chyavana and the cow-born Rishi, especially steadiness in
    virtue, and returns to his city. Bhishma closes by naming affection, the blessedness
    of kine, and true righteousness as the topics discussed.
  language: English
  quote_policy: summarized
