canonical_text:
  quote: "“I am all this.”"
  summary: Brahma describes Mahat, first produced, as Egoism when it arises as “I.”
    Egoism is presented as the source and creator of creatures, deities, mind, and
    the three worlds; it supports consciousness, causes change and movement, and illuminates
    the universe by its own light. The passage also mentions sages who attain an eternal
    world through knowledge and meditation on the soul, Vedic study, and sacrifices.
