canonical_text:
  quote: ''
  summary: Bhishma reports a dialogue in which Indra asks Vishnu what acts gratify
    him. Vishnu answers with rules of reverence toward Brahmanas, sacred sights, and
    worship of objects and beings he identifies with his own forms. Further speakers
    give ritual instructions about dawn contact with sacred substances, copper vessels
    for vows and offerings, ancestor rites, and the duties of hospitality.
  language: English
  quote_policy: summarized
