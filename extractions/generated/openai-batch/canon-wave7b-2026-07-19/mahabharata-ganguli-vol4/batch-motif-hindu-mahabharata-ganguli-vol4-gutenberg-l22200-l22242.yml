canonical_text:
  quote: ''
  summary: The passage describes the Savitri Mantras as sacred recitations that protect
    places and reciters from dangers, promote welfare and fertility, and should be
    recited on journeys and at homecomings. The speaker links the mantras to Parasara,
    Sakra, the Rishis, royal lineages, and Brahman, recounts their use before battle,
    and compares the merit of gifting gold-horned cattle to a learned Brahmana with
    daily recitation of the Bharata story. It also assigns benefits to reciting or
    honoring names such as Bhrigu, Vasishtha, Raghu, and the Aswins.
  language: English
  quote_policy: summarized
