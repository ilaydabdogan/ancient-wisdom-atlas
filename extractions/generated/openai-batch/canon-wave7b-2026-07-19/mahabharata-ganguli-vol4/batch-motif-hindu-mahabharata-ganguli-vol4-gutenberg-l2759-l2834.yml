canonical_text:
  quote: ''
  summary: Vishnu, addressed as Krishna, recounts receiving initiation from a Brahmana,
    performing severe ascetic observances, and beholding Mahadeva with Uma in a radiant
    cloud. Mahadeva appears with weapons and ascetic emblems while Rudras, gods, cosmic
    beings, personified ritual elements, rivers, snakes, mountains, and other beings
    praise or bow to him. Mahadeva addresses Krishna with favor, and Uma is gratified
    after Krishna bows.
  language: English
  quote_policy: summarized
