  text: Eight days pass in conversation about Mahadeva before the initiation occurs
    on the eighth day.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker undergoes Diksha at the hands of a Brahmana, receives a staff,
    is shaved, carries Kusa grass, wears rags, rubs himself with ghee, and wears a
    Munja grass cord.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'The speaker practices month-by-month austerities: living on fruits, then
    water, then air alone, while standing on one foot with raised arms and foregoing
