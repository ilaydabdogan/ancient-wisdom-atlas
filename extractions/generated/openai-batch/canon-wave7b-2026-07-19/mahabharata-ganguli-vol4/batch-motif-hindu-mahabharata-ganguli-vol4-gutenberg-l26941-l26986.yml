canonical_text:
  quote: ''
  summary: Krishna counsels Yudhishthira to abandon grief, perform sacrifices and
    offerings, honor gods, ancestors, guests, priests, and the destitute, and rule
    according to Kshatriya duty. Yudhishthira asks to withdraw to an ascetic retreat
    because he feels sin and unrest after killing his grandfather and Karna. Vyasa
    admonishes him, reminding him of Kshatriya duties, salvation doctrine, expiation,
    royal virtues, and gifts.
  language: English
  quote_policy: summarized
