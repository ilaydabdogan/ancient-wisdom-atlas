canonical_text:
  quote: ''
  summary: The Pandavas and their followers approach Dhritarashtra's sacred forest
    retreat on foot in humility. They learn that the old king and the elder women
    have gone to the Yamuna for ablutions and water. Sahadeva reunites tearfully with
    Pritha, and the Pandavas honor Dhritarashtra, Gandhari, and their mother, taking
    the water jars from them. Yudhishthira presents the gathered people to the old
    king, who is filled with joy and returns to his forest retreat amid a vast crowd.
  language: English
