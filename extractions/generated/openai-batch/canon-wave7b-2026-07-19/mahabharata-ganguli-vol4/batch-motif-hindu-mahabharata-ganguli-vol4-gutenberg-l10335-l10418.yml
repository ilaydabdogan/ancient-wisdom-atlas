    slaughtered animals.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that kine no longer form animals fit for sacrifice and
    now constitute animals fit for gift.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage equates gifts of cows with gifts of nectar, sacrificial libation,
