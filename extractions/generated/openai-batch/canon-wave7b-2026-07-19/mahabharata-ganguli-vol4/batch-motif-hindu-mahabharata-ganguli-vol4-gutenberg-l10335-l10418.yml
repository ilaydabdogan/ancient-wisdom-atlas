canonical_text:
  quote: "“The very chief of the deities had said that the milk of kine is nectar.”"
  summary: The passage describes deities performing a sacrifice on Himavat and attaching
    sacrificial merit to gifts of earth. It then gives rules and rewards for gifts
    of land, houses, cow-sheds, and cows, including warnings about improper gifts.
    Kine are described as divinely valued, beneficial to humans, no longer fit for
    sacrifice, and especially fit for gifts.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The deities say their wishes have been fulfilled, announce that they will
    perform a sacrifice there with large Dakshina, and say that Munis should always
    adore the piece of earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Agastya, Kanwa, Bhrigu, Atri, Vrishakapi, Asita, and Devala come to the place,
    and the deities complete a sacrifice on Himavat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After completing the sacrifice on Himavat, the deities attach a sixth part
    of the merit arising from their sacrifice to the gift of earth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that gifts of earth, a residential house, a Brahmana’s
    residence in one’s house, a shed for kine, arable earth, and mineral-bearing earth
    bring specified benefits to the giver or the giver’s lineage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage lists kinds of earth that should not be given, states that Sraddha
    on another person’s land becomes futile, and says that Pinda offered on duly purchased
    earth becomes inexhaustible.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Forests, mountains, rivers, and Tirthas are said to have no owners, so earth
    need not be purchased there for Sraddhas.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kine are said to be superior to ascetics; Mahadeva performed penance in their
