  summary: Bhishma instructs Yudhishthira on birth, conduct, lineage, and the legal
    classification of sons. He says disposition and actions reveal origin, lists several
    categories of sons, defines mixed-order offspring, and answers a question about
    whether paternity follows seed or the household/spouse in which the child is born.
