canonical_text:
  quote: ''
  summary: Jara the hunter mistakes Keshava lying in Yoga for a deer and wounds him
    in the heel; Keshava comforts the frightened hunter and ascends in splendor to
    Heaven and his own region, where gods and celestial beings receive and worship
    him. Daruka reports the destruction of the Vrishnis to the Pandavas. Arjuna goes
    to Dwaraka, sees the bereft city and Krishna's grieving women, and mourns with
    Satya and Rukmini before comforting them. He then sees his uncle Anakadundubhi
    grieving for his lost kin.
  language: English
  quote_policy: summarized
