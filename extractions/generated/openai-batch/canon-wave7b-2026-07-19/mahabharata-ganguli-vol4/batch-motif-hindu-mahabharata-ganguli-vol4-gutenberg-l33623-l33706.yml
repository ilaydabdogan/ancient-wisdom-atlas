canonical_text:
  quote: ''
  summary: 'The passage describes the completion of Yudhishthira''s Horse-sacrifice:
    the horse is ritually cut up and offered, Draupadi sits near the divided animal,
    the king and his brothers smell purifying smoke, and the limbs are placed in the
    fire. Yudhishthira gives the Earth to Vyasa and the Brahmanas as the prescribed
    sacrificial fee, but Vyasa returns it and asks for gold instead. After a heavenly
    voice praises the king, Yudhishthira gives vast wealth, which is distributed among
    priests, Brahmanas, other social groups, Kunti, invited kings, and allied rulers.
    The sacrifice ends with purification, royal gifts, restoration of a kingdom to
    Dussala''s infant grandson, and the dismissal of honored guests.'
  language: English
  quote_policy: summarized
