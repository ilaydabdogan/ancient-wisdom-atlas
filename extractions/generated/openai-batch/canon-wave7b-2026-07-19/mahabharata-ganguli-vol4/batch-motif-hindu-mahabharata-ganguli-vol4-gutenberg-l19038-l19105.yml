canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma whether charity or devotion is better. Bhishma
    answers by listing rishis, kings, and householders who attained heaven, celestial
    regions, eternal bliss, fame, or blessed regions through gifts, penances, teaching,
    sacrifice, proper punishment, marriage-gifts, and preservation of creatures during
    drought. He concludes that such figures attained heavenly regions by charities,
    sacrifices, and offspring, and postpones further discussion until morning.
  language: English
  quote_policy: summarized
