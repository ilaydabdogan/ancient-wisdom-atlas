canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma whether knowledge, penances, or gifts are superior.
    Bhishma answers by recounting an old conversation between Maitreya and the Island-born
    Krishna, Vyasa. Vyasa, after receiving hospitality from Maitreya, praises sincere
    gifts of water and food and argues that gift-giving surpasses sacred ablutions,
    Vedic vows, and other rites, while also classifying righteous, sinful, and indifferent
    conduct.
  language: English
  quote_policy: summarized
