canonical_text:
  quote: ''
  summary: An emancipated sage explains how a being approaches death, how bodily winds,
    heat, vital breaths, and the five elements participate in the dissolution of the
    body, how Jiva leaves the body surrounded by its acts, and how creatures experience
    karmic destinations including hell and luminous celestial regions before further
    change.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sage says that when acts capable of prolonging life and fame are exhausted,
    the embodied Jiva begins conduct hostile to life and health, including irregular
    or harmful eating, excess, abstention, incompatible food, excessive exercise or
    sexual pleasure, suppression of bodily urges, and daytime sleep.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes disease ending in death as arising from excited bodily
    faults and harmful or unnatural conduct.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Violent Wind and excited bodily heat are said to reach through the body, restrain
    vital breaths, pierce vital parts, and cause Jiva great pain as it leaves the
    mortal body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The pain of casting off bodies is compared with the pain of entering the womb
    or issuing from it, including distress from womb waters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A bodily wind excited through cold dissolves the compound body into the five
    primal elements, and the wind in Prana and Apana rushes upward and leaves the
    embodied creature.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the vital wind leaves, the person is described as breathless, without
    heat, breath, beauty, and consciousness, and no longer perceiving objects through
    the sensory ducts.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: When vital parts are pierced, Jiva rises, enters the heart, restrains animation,
    and the creature’s knowledge is overwhelmed by darkness.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Jiva exits quickly with a long painful breath and causes the inanimate body
    to tremble.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After separation from the body, Jiva is surrounded by its acts and equipped
    with both auspicious merit and sins.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Brahmanas with scriptural knowledge and persons with spiritual vision are
    said to discern Jiva’s merit or non-merit and to see Jiva leaving the body, being
    reborn, and entering the womb.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:11
  text: The passage states that Jiva has three regions assigned to it and calls this
    world the field of action where creatures receive fruits of good and bad acts.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: Evil-doers are said to attain Hell, described as a difficult-to-escape condition
    of great misery in which creatures sink head downward and are cooked.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:13
  text: Righteous regions are identified as stellar worlds, the lunar disc, and the
    solar disc; creatures ascend from this world to these regions and fall away again
    when their merit is exhausted.
  category: setting
  evidence_refs:
  - ev:8
