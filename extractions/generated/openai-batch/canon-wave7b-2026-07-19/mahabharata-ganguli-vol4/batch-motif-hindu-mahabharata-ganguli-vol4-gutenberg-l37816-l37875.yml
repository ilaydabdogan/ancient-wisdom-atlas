canonical_text:
  quote: ''
  summary: Yudhishthira grieves at leaving Dhritarashtra, Gandhari, and Kunti in their
    ascetic retreat, while acknowledging the supremacy of penance. Sahadeva wishes
    to remain and serve his mother and elders, but Kunti commands the sons to depart
    so that the elders' penances will not be obstructed. Dhritarashtra, Gandhari,
    and Kunti bless and dismiss the Pandavas and the women of the Kaurava household,
    after which Yudhishthira's party sets out for Hastinapura.
  language: English
  quote_policy: summarized
