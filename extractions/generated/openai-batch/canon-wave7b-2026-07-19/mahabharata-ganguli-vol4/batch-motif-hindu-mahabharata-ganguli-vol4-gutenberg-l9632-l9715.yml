canonical_text:
  quote: Sacrifices should never be performed with wealth acquired by severity and
    extortion.
  summary: 'Bhishma instructs Yudhishthira on royal duties: Kshatriyas are cleansed
    by sacrifice and gifts, especially gifts to worthy Brahmanas; a king should support
    Brahmanas, servants, subjects, and vulnerable people; sacrifices should be funded
    only by wealth willingly given by prosperous, unpersecuted subjects; taking from
    the poor, helpless, drought-stricken, or grieving is condemned; hunger and abduction
    within a kingdom bring sin, reproach, and adversity upon the king.'
  language: English
  quote_policy: quoted
