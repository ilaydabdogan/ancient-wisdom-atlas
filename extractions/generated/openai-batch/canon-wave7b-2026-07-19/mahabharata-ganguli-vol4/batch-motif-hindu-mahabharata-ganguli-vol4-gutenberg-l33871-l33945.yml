  quote: ''
  summary: A Brahmana host observing the Unccha vow and his family repeatedly offer
    their own portions of powdered barley to a hungry Brahmana guest. The son and
    daughter-in-law argue that surrendering their shares is religiously meritorious,
    grounded in filial duty, service to elders, and hoped-for regions of happiness;
    the father/host hesitates because each giver is weakened by hunger.
  language: English
