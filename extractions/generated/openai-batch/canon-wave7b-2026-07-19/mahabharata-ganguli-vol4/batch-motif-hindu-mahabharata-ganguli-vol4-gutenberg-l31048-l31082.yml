canonical_text:
  quote: ''
  summary: Utanka addresses Janarddana/Krishna as creator of the universe and asks
    to see his sovereign form. Krishna shows him the eternal Vaishnava universal form,
    filling all space, with faces on every side and radiance like a blazing fire of
    a thousand suns. Utanka praises the cosmic form as pervading earth, firmament,
    the space between, and all directions, then asks Krishna to withdraw it and appear
    in human form. Krishna tells Utanka to ask for a boon; Utanka says the vision
    itself is enough, but Krishna replies that the sight of his form cannot be fruitless.
  language: English
  quote_policy: summarized
