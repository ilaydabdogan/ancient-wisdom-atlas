canonical_text:
  quote: I shall retire into the woods, clad in rags and barks.
  summary: Dhritarashtra asks Yudhishthira for permission to withdraw with Gandhari
    into the forest, transfer sovereignty in accordance with old-age custom, and practice
    austerities. Yudhishthira grieves, offers to relinquish the kingdom or follow
    him, and later revives the weakened Dhritarashtra with cold water after he nearly
    loses consciousness while leaning on Gandhari.
  language: English
  quote_policy: quoted
