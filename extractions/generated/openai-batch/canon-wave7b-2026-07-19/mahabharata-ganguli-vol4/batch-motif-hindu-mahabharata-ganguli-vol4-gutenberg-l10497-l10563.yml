  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Yama says he cannot know the exact period of a life ordained by Time, cannot
    allow residence there before Time urges it, and takes note of acts of righteousness
    or otherwise performed in the world.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Brahmana asks Yama which acts earn great merit, calling Yama an authority
    in the three worlds.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Yama teaches that gifts of sesame are superior, produce everlasting merit,
    may fulfill wishes, are praised at Sraddhas, and should be made to Brahmanas according
    to rites, including on the full moon of Vaisakha.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Yama teaches that gifts of water, resting places for drinking water, and the
    excavation of tanks, lakes, and wells are acts of great merit, and that water
    for drinking should especially be given after one has eaten.
  category: speech
  evidence_refs:
  - ev:10
