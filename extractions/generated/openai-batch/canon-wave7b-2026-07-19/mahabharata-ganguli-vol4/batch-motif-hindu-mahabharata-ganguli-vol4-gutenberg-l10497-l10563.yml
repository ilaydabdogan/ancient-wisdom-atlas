canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the merits of gifts such as sesame, lamps,
    food, and robes. Bhishma recounts an ancient discourse between a Brahmana and
    Yama. Yama sends a fearsome messenger to bring Sarmin, but the messenger brings
    a similar Brahmana by mistake. Yama honors the Brahmana, orders him returned,
    explains that lifespan is governed by Time, and teaches that gifts of sesame and
    water, including water stations and wells, bring great merit.
  language: English
  quote_policy: summarized
