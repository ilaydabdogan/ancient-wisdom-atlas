canonical_text:
  quote: ''
  summary: Vyasa recounts how king Marutta, preparing a great sacrifice, asks Vrihaspati
    to officiate but is refused because Vrihaspati has committed himself to Indra
    and the Immortals. Distressed, Marutta meets Narada, who directs him to seek Samvarta
    in Varanasi. Narada gives a corpse-at-the-gate method for recognizing Samvarta.
    Marutta follows the instructions, identifies Samvarta, follows him with clasped
    hands, and endures being covered with mud, ashes, phlegm, and spittle until Samvarta
    rests under a sacred fig tree.
  language: English
  quote_policy: summarized
