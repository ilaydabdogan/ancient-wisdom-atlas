canonical_text:
  quote: The son is even as one's own self, and the daughter is like unto the son.
  summary: Bhishma teaches rules about daughters, sons, daughter's sons, inheritance,
    and ancestral offerings. He condemns selling a daughter or son, treats bride-price
    as a form of sale, cites Yama on hell punishment for such acts, and condemns forced
    seizure or intercourse with a maiden as sinful.
  language: English
  quote_policy: quoted
