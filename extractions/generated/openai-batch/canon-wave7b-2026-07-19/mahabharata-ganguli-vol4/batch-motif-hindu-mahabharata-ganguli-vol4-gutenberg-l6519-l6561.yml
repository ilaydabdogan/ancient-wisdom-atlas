  quote: began to cut off his own flesh and weigh it in a balance against the pigeon
  summary: A king offers his own flesh, and then his whole body, to balance a pigeon
    on a scale. Cosmic and palace disturbances accompany the act. Celestial beings
    witness and honor him with nectar, flowers, music, dance, and a heavenly car.
    The narrative presents Sivi/Vrishadarbha as a righteous royal sage who attains
    eternal Heaven and instructs Yudhishthira to protect seekers of refuge.
