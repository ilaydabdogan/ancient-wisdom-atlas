canonical_text:
  quote: ''
  summary: A Brahmana recounts an ancient discourse between Kartaviryya-Arjuna and
    the Ocean. The thousand-armed king conquers the earth and shoots arrows into the
    sea; the Ocean asks him to stop because creatures sheltered in it are being killed.
    When the king demands the name of an equal opponent, the Ocean points him to Jamadagni's
    son, Rama. The king goes to Rama's retreat and acts hostilely. Rama's power blazes
    forth; he kills the thousand-armed king with a battle-axe, defeats the king's
    attacking kinsmen, and terrifies Kshatriyas. The passage then describes social
    consequences for fleeing Kshatriyas and named groups, repeated destruction of
    renewed Kshatriya lineages twenty-one times, and admonitions from a heavenly voice
    and ancestral Pitris telling Rama to desist.
  language: English
  quote_policy: summarized
