  text: The Brahmana says Apana becomes lord over Prana and restrains it, and that
    mind is dependent upon Prana, not Prana upon mind.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Word and Mind go to the Soul of matter and ask which of them is superior;
