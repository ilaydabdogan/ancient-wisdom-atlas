canonical_text:
  quote: ''
  summary: A Brahmana explains an internal sacrificial scheme in which bodily faculties,
    sense-objects, and cosmic or divine powers correspond to priests, libations, fuel,
    ladle, and fires. The Brahmana's wife questions the relation of Word, Mind, Prana,
    and dreamless sleep. The Brahmana answers with teachings about Prana and Apana,
    a dispute between Word and Mind before the Soul of matter, two forms of mind,
    and the goddess Word moving through the breaths. He distinguishes uttered and
    unuttered Word, comparing the latter to a cow yielding meanings and the Eternal.
  language: English
  quote_policy: summarized
