  - ev:6
- id: obs:10
  text: Word tells Mind that she yields to Mind the fruition of all desires.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'The Brahmana distinguishes two minds: an immovable mind belonging with him
    and a movable mind in the dominion of Word as Mantra, letter, or voice.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The goddess Word is said to dwell between Prana and Apana, to sink into Apana,
    to run to Prajapati, and to be fostered again by Prana.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Word is described as flowing both with utterance and without utterance, and
