    Vishnu, Indra, Prajapati, and Mitra, are identified as sacrificial fires.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The objects of the senses are described as fuel cast into the fires; mind
    is described as the ladle; and good and bad acts are described as the sacrificer's
