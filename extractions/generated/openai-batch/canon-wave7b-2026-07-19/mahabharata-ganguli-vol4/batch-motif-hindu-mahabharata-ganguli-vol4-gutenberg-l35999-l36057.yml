  summary: Yudhishthira promises to follow Dhritarashtra's instruction and notes that
    other guides have departed or will accompany Dhritarashtra to the forest. Dhritarashtra
    discusses forest retirement with Gandhari, seeks Yudhishthira's permission, plans
    gifts connected with his sons' Preta status, summons the people, and publicly
    asks permission to retire into the woods with Gandhari. The assembled residents
    lament.
