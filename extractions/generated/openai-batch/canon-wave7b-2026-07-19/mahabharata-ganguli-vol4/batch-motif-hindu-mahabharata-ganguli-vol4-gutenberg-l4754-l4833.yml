canonical_text:
  quote: ''
  summary: Bhishma narrates that a lady serves the Rishi Ashtavakra with oil, washing,
    food, and a bed. During the ablutions the whole night passes unnoticed, and while
    eating a little of her delicious food the day passes. At midnight she leaves her
    bed and approaches Ashtavakra, who refuses sexual congress and argues from self-restraint
    and social rules about women’s dependence. She claims to be her own mistress,
    offers herself in marriage, and says she has kept a vow of Brahmacharyya from
    maidenhood. Ashtavakra wonders whether accepting her would oppose the wishes of
    Rishi Vadanya, observes her present beautiful maiden form after apparent decrepitude,
    and resolves not to abandon self-restraint, contentment, and truth.
  language: English
  quote_policy: summarized
