canonical_text:
  quote: Verily, he who performs these acts with faith, becomes freed from the debt
    he owes to the Pitris.
  summary: The Pitris describe the merits of releasing a blue bull, giving lamps during
    the rainy season, offering sesame, water, honey, and a copper vessel at new moon,
    and giving the Pinda. These acts gratify or benefit the Pitris, lead to Soma’s
    region, bring brightness and descendants, and free the performer from ancestral
    debt.
  language: English
  quote_policy: quoted
