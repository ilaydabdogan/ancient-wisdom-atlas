canonical_text:
  quote: ''
  summary: Krishna enters an ascetic asylum on Himavat where sages practice severe
    vows and natural enemies live peacefully together. He meets the sage Upamanyu,
    who tells him to perform penance to Isana/Mahadeva in order to obtain a son. Upamanyu
    describes Mahadeva as dwelling there with his spouse, as the source of energies
    and penances, and as a deity who grants extraordinary boons, weapons, sovereignty,
    and creative power to gods, Danavas, and Asuras.
  language: English
  quote_policy: summarized
