canonical_text:
  quote: Siva being our highest refuge.
  summary: A mother describes forest ascetic life to her child, explains that desired
    goods such as milk and robes come through the grace of Siva/Sankara, and urges
    devotion to him. The child asks how Mahadeva may be known, pleased, located, and
    seen. The mother responds affectionately, saying Mahadeva is hard for uncleansed
    souls to know, has many forms and residences, dwells in the hearts of all creatures,
    and may show himself to worshippers through compassion.
  language: English
  quote_policy: quoted
