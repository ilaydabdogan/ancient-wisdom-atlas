canonical_text:
  quote: ''
  summary: Bhishma recounts the birth of Kumara/Kartikeya/Skanda from the fiery seed
    associated with Agni and Rudra. The six Krittikas bear divided portions of the
    energy, give birth simultaneously, and the six portions unite into one child.
    Earth receives the child from a heap of gold; he grows in a forest of reeds, is
    nursed by the Krittikas, visited and gifted by divine beings, invested as commander
    of the celestial forces, and slays the Asura Taraka. The passage closes by explaining
    gold as born from Agni’s energy with Kartikeya and recommending gifts of gold
    as purifying and meritorious.
  language: English
  quote_policy: summarized
