canonical_text:
  quote: ''
  summary: Vyasa tells Gandhari and other bereaved relatives that they will behold
    their dead kin that night. He explains that many of the slain at Kurukshetra were
    portions of deities or other celestial beings who had taken human birth to accomplish
    divine purposes and had returned to heaven. He directs the assembly to the Bhagirathi/Ganga,
    where they wait, bathe in the sacred stream, and perform evening rites before
    the anticipated night encounter with the deceased princes.
  language: English
  quote_policy: summarized
