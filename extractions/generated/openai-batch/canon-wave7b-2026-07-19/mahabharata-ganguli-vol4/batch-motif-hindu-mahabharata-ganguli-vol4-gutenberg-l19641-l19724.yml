canonical_text:
  quote: ''
  summary: Maheswara instructs a goddess on religious duties. He describes Brahma's
    creation of Brahmanas, the hierarchy of Veda, Smriti, and righteous practice,
    the acts and qualities expected of Brahmanas, the householder's duties of sacrifice,
    gift-giving, hospitality, and righteous wealth use, and the Nivritti path of renunciation,
    detachment, Yoga, and emancipation through absorption in Brahman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maheswara says Creator Brahma created Brahmanas to rescue all the worlds and
    calls them gods on earth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage lists three eternal religions: that of the Vedas, that of the
    Smritis, and that based on the practices of those regarded as righteous.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Brahmana is associated with the three Vedas, gifts, study, sacrifice,
    transcendence of lust, wrath, and covetousness, friendship toward creatures, and
    six declared acts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The six acts of Brahmanas are sacrifice, officiating at sacrifices, giving
    gifts, accepting gifts, teaching, and study.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A righteous householder performs five sacrifices, speaks truthfully, avoids
    malice, gives gifts, honors guests, keeps a clean abode, uses gentle words, and
    eats after family and dependants are satisfied.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Hospitality is described through washing water, Arghya, seats, beds, lamps,
    shelter, morning food service, formal dismissal, and escorting the guest a little
    way.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The householder's religion is identified with Pravritti, and the householder
    is told to make gifts, perform sacrifices, acquire wealth righteously, and divide
    wealth into three portions.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The duties of the Sudra are stated to consist in pursuit of the aggregate
    of three.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Religion of Nivritti is described as different from the householder's
    path and as existing for emancipation from rebirth by absorption into Brahman.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A follower of Nivritti is told to practice compassion, avoid staying in one
    place more than one day, and release attachment to habitation, vessels, clothing,
    seats, sticks, beds, fire, and chambers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Nivritti follower is described as devoted to the soul, Supreme Brahman,
    Yoga, and Sankhya, and as using the foot of a tree, empty abodes, and river banks
    as resting places.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Nivritti follower merges his own soul into the Supreme Soul, may stand
    still like wood while abstaining from food, or may wander devoted to Yoga.
  category: action
  evidence_refs:
  - ev:9
