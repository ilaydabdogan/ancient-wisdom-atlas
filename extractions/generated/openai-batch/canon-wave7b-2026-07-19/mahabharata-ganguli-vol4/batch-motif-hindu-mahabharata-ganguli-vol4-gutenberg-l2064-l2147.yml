canonical_text:
  quote: ''
  summary: A speaker reports her mother’s praise of Bhava/Mahadeva, describing him
    as assuming divine, human, animal, ghostly, natural, ritual, ascetic, and yogic
    forms. He is described as destroyer, foundation, soul of beings, weapon-bearer,
    serpent-adorned, present in sacrifice and yoga, formless, and without beginning
    or end.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mother says Bhava assumes the forms of major deities, celestial classes,
    men and women, Pretas and Pisachas, Kiratas and Savaras, aquatic animals, forest-dwellers,
    tortoises, fishes, conches, and coral sprouts used as ornaments.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mahadeva is said to assume forms of Yakshas, Rakshasas, snakes, Daityas, Danavas,
    hole-dwelling creatures, wild animals, birds, lizards, storks, cranes, vultures,
    Chakravakas, Chasas, mountains, cattle, elephants, horses, camels, asses, goats,
    leopards, and other animals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: He sometimes appears six-faced, multifaced, three-eyed, many-headed, and with
    innumerable legs, stomachs, faces, arms, and sides.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: He sometimes appears surrounded by innumerable spirits and ghosts and assumes
    forms of Rishis, Gandharvas, Siddhas, and Charanas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: He sometimes appears ash-white and adorned with a half-moon on the forehead;
    he is also called Sarva.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: He is described as the destroyer of all creatures and as the common foundation
    on which all creatures rest.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mahadeva is described as the soul of all creatures, pervading all things,
    dwelling in the hearts of all creatures, and knowing the desires and objects of
    worship of his devotees.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: He sometimes rejoices, becomes wrathful, utters the syllable Hum loudly, and
    arms himself with a discus, trident, mace, heavy mullets, scimitar, or battle
    axe.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: He assumes the form of Sesha, who sustains the world on his head, and wears
    snakes as belt, ear-rings, and sacred thread; an elephant skin forms his upper
    garment.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: He sometimes laughs, sings, dances, plays musical instruments, wanders over
    crematoria, yawns, cries, causes others to cry, appears mad or intoxicated, and
    speaks sweetly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: He sometimes recites sacred Mantras and becomes the deity of those Mantras;
    he performs penances and becomes the deity worshipped through those penances.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: He sometimes gives gifts and receives gifts, disposes himself in Yoga, and
    becomes the object of others’ Yoga contemplation.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: He may be seen, or not seen, on the sacrificial platform, in the sacrificial
    stake, in the cow-pen, or in the fire; he may be seen as a boy or as an old man.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:14
  text: He is described as long-haired, naked with the horizon for garments, terrible-eyed,
    fair, darkish, dark, pale, smoke-coloured, and red.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: He is described as having empty space for a covering and as covering all things.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: He is described as formless, one, indivisible, a conjurer of illusions, cause
    of actions and destructive operations, assuming the form of Hiranyagarbha, without
    beginning, end, or birth, living in the heart, and identified with prana, mind,
    Jiva, Yoga, Yoga-contemplation, and the Supreme Soul.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: Near the end of the passage he is again described as playing musical instruments
    and as a vocalist, with references to many eyes and mouths before the supplied
    text breaks off.
  category: attribute
  evidence_refs:
  - ev:10
