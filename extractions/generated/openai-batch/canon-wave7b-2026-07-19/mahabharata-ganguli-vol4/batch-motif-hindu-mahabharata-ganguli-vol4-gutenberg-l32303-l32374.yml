canonical_text:
  quote: ''
  summary: Yudhishthira asks Vyasa to initiate him for a sacrifice. Vyasa fixes the
    ritual time, directs preparation of materials, and orders a worthy horse to be
    selected and released to wander the earth. Yudhishthira asks who will guard the
    horse; Vyasa names Arjuna and assigns other duties to Bhima, Nakula, and Sahadeva.
    Yudhishthira instructs Arjuna to protect the horse while avoiding unnecessary
    battles and inviting kings to the sacrifice.
  language: English
  quote_policy: summarized
