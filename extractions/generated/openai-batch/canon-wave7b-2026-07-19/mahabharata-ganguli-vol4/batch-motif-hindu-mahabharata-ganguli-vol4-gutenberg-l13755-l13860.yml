canonical_text:
  quote: ''
  summary: Vrishadarbhi sends the Rakshasi Yatudhani to follow the seven Rishis and
    companions, learn the meanings of their names, and kill them. The hungry Rishis
    meet a well-fed mendicant with a dog and comment on his prosperity. Later they
    find a lotus-filled lake guarded by Yatudhani, who allows them to gather lotus
    stalks only if each gives his name. Atri explains his name in terms of cleansing
    sin and constant Vedic study; Yatudhani says she cannot comprehend the explanation
    and lets him enter the tank. Vasishtha begins to explain his name.
  language: English
  quote_policy: summarized
