canonical_text:
  quote: ''
  summary: Upamanyu recounts that Tandi praised Mahadeva, who was accompanied by Uma.
    Siva, pleased, granted Tandi boons including endurance, freedom from sorrow, fame,
    energy, spiritual knowledge, and future distinction for Tandi's son. Tandi asked
    that his devotion remain steady. After receiving worship, the deity disappeared
    with his followers. Tandi later came to Upamanyu and transmitted celebrated names
    of Mahadeva, said to derive from Brahma and to be known only through grace.
  language: English
  quote_policy: summarized
