canonical_text:
  quote: ''
  summary: 'Vaisampayana reports that after Vyasa''s speech, Krishna comforts an afflicted
    bereaved king and teaches that crookedness leads to destruction while rectitude
    leads to Brahman. Krishna says the king has not yet overcome inner enemies and
    recounts the ancient war of Indra and Vritra: Vritra successively overwhelms earth,
    waters, luminous matter, air, ether, and finally Indra''s own body, taking away
    their properties. Indra repeatedly strikes Vritra with the thunderbolt and, after
    Vasishtha comforts him, slays Vritra inside his body with an invisible thunderbolt.
    Krishna says this religious mystery was transmitted from Sakra to sages and then
    to him.'
  language: English
  quote_policy: summarized
