canonical_text:
  quote: "“Thy sire got back his life-breaths, O king. The child began to move according
    to his energy and might.”"
  summary: After Krishna withdraws the Brahma-weapon from the laying-in room, the
    infant heir revives and Rakshasas are driven out or destroyed. Women, Brahmanas,
    bards, and others praise Krishna and utter blessings. Uttara salutes Krishna with
    the child, Krishna and Vrishni chiefs give gems, and Krishna names the child Parikshit
    because the race was nearly extinct. Later the Pandavas return with wealth, and
    the city is decorated with worship, music, and public rejoicing.
  language: English
  quote_policy: quoted
