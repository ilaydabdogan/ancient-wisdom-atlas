canonical_text:
  quote: like the all-destroying Yuga-fire
  summary: Uma witnesses a fire associated with Mahadeva's third eye consume the Himavat
    mountains; frightened animals seek Hara's protection. Uma appeals to Maheswara,
    who restores Himavat and explains that he created the third eye when Uma had covered
    his eyes and the universe became dark. Uma then asks further questions about Maheswara's
    faces, hair, blue throat, Pinaka, and ascetic form.
  language: English
