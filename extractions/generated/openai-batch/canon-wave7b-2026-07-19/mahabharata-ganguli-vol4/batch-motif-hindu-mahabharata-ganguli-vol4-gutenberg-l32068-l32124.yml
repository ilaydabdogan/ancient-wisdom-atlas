canonical_text:
  quote: '"Do thou revive this child of mine that has been consumed by the weapon
    of Drona''s son."'
  summary: Krishna consents to a request and enters a sanctified lying-in room prepared
    with ritual and protective objects, attendants, physicians, and articles destructive
    of Rakshasas. Draupadi announces him to Virata's daughter. The grieving mother
    laments that Abhimanyu and she have been deprived of their child, says the child
    in the womb was destroyed by Drona's son's Brahma-weapon, petitions Krishna to
    revive him, and declares that she will give up her life if the child does not
    return.
  language: English
  quote_policy: quoted
