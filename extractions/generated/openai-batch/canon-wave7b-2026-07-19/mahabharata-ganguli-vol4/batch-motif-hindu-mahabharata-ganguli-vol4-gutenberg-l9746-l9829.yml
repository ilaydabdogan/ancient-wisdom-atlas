canonical_text:
  quote: ''
  summary: Bhishma tells Yudhishthira that the gift of earth is the highest gift.
    Earth is described as indestructible, nourishing, prosperous, and personified
    as a mighty goddess named Priyadatta. Donating land to worthy recipients, especially
    Brahmanas and the destitute, is said to produce prosperity, royal status in rebirth,
    purification from sin, protection from death and punishment powers, gratification
    of ancestors and deities, and merit comparable to sacrifice. The passage ends
    by introducing an ancient-history verse and Jamadagni's son Rama, but the sentence
    is incomplete in the supplied excerpt.
  language: English
  quote_policy: summarized
