canonical_text:
  quote: ''
  summary: Vasudeva laments the destruction of the Vrishnis, attributes it to a curse,
    and says Krishna allowed the calamity rather than falsify the words of Gandhari
    and the Rishis. He reports Krishna’s instructions that Arjuna will come, protect
    the women and children, perform funeral rites, and leave before Dwaravati is swallowed
    by the ocean. Vasudeva renounces life and entrusts the kingdom, wealth, women,
    and children to Arjuna. Arjuna declares that the time for departure has come,
    gathers the civic leaders in Sudharma, orders evacuation, announces Vajra as king
    at Shakraprastha, and sets departure for the seventh day at sunrise.
  language: English
  quote_policy: summarized
