canonical_text:
  quote: ''
  summary: Sauti frames Janamejaya’s question to Vaisampayana about how dead persons
    whose bodies have been destroyed can reappear in the same forms. Vaisampayana
    answers with a doctrine of enduring acts, bodies and features born from acts,
    eternal primal elements and soul, the distinction between body and self, and sacrificial
    passage to the next world under the deities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Janamejaya is pleased by a story about the reappearance and departure of his
    forefathers and asks how destroyed bodies can reappear in the same forms.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vaisampayana states that acts are never destroyed without their consequences
    being experienced and that bodies and features are born of acts.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage links acts with pleasure, pain, and consequences experienced mentally
    or bodily according to the kind of act.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:4
  text: The primal elements and the soul are described as eternal, and the soul is
    said not to be destroyed or modified by pleasure and pain.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The soul’s lack of modification is compared to the reflection of creatures
    in a mirror.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Life-breaths and senses of embodied creatures are said to exist eternally
