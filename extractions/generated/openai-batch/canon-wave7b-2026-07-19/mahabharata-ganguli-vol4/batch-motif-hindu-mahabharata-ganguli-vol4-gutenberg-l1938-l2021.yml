canonical_text:
  quote: ''
  summary: 'The passage gives a series of examples in which Mahadeva/Rudra is gratified
    by sacrifice, adoration, or austerity and grants boons such as sons, fame, authorship,
    sovereignty, restored waters, or freedom from aging and death. It then begins
    a first-person recollection by the son of Vyaghrapada: as a child he sees milk
    likened to Amrita, asks his mother for milk, recognizes her whitened rice-water
    substitute as not milk, and hears her explanation of the austere poverty of forest
    ascetics.'
  language: English
  quote_policy: summarized
