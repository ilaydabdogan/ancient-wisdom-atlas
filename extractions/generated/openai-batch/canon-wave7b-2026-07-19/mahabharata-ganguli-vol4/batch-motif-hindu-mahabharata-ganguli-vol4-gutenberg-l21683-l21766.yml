canonical_text:
  quote: ''
  summary: The passage is a hymnic catalogue of epithets for a central divine figure
    repeatedly called “He.” It describes him as cosmic maintainer, omniscient and
    transcendent, embodied in named forms such as Rama and Arjuna or Nara, slayer
    of Kalanemi and Kesi, lord of deities and the three worlds, wish-granter, knower
    of Vedas and ritual acts, identical with sacrifice, Japa, hymn, Vasuki, and Kuvera,
    dwelling in all beings and containing all beings, causing beings to merge at emancipation,
    and manifesting as one, many, universal, formless, and hundred-formed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The central figure is said to maintain entities in their places and orbits
    and to behold the whole universe as an Amlaka in his palm.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The central figure is described as taking the form of Rama, lying on bare
    ground in that form, and adorning the earth through incarnations.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The central figure is called a water-pot because all things reside within
    him, and he is said to cleanse those who hear of him.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The central figure is called the slayer of Kalanemi and Kesi, the lord of
    all deities, the soul and master of the three worlds, and the destroyer of all
    things at universal dissolution.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The central figure is described as the deity from whom desires are sought
    and as one who grants wishes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The central figure is described as knowing Srutis, Smritis, the Vedas, and
    everything in the universe, and as creator and promulgator of all kinds of learning.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:9
- id: obs:7
  text: The central figure is described as foremost object of recitation, sacrifice,
    the Vedas, and religious acts, and also as sacrifice, Japa, offering, hymn, hymning,
    and the person who hymns.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:8
  text: The central figure is said to have footsteps covering vast areas and to be
    identical with Vasuki, king of the snakes.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The central figure is described as having gold for his vital seed, giving
    wealth in identity with Kuvera, taking wealth from the Asuras, and being the son
    of Vasudeva.
  category: relationship
  evidence_refs:
  - ev:9
  - ev:15
- id: obs:10
  text: The passage says all creatures dwell in the central figure, that his mind
    dwells in all things, and that he removes sins from those who seek refuge in him.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage says the central figure is one entity, displays himself in diverse
    forms, overwhelms the universe with Maya, and receives foremost beings when they
    merge at emancipation.
  category: attribute
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:12
  text: The central figure is described as universal in form, vast in form, blazing
    with energy, without form, of diverse forms, of a hundred forms, and of a hundred
    faces.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:13
  text: The central figure is described as one and many, as the highest refuge, as
    one who confines Jiva within material causes, and as one born in the race of Madhu.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:14
  text: The passage places the central figure in the woods of Brinda on the banks
    of the Yamuna, where he sports in joy.
  category: setting
  evidence_refs:
  - ev:11
