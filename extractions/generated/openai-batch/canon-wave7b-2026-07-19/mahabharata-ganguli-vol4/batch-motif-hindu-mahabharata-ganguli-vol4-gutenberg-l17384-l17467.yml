canonical_text:
  quote: Abstention from cruelty is the highest Religion.
  summary: Bhishma answers a royal warrior about flesh eating. He acknowledges flesh
    as tasty and strengthening, but teaches that compassion and abstention from cruelty
    have supreme merit. He recognizes Vedic sacrificial flesh and Kshatriya hunting
    as exceptions, describes reciprocal consequences for killing and eating, refers
    to suffering in the womb and in Kumbhipaka hell, and praises the gift of life
    and freedom from fear.
  language: English
  quote_policy: quoted
