  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma states that great merit attaches to those who abstain from flesh.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person who seeks to increase his own flesh by the flesh of another living
    creature is described as mean and cruel, and life is said to be dear to every
    creature.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Eating flesh sanctified according to Vedic ordinances is said to incur no
    fault, while eating flesh in another way is described as Rakshasa practice.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: For Kshatriyas, eating flesh acquired by prowess is said not to incur fault;
    Agastya is said to have dedicated wilderness deer to the deities and the Pitris.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Hunting is described as involving equal risk for the hunter and the hunted,
