  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: All creatures are said to protect the compassionate person, and snakes, wild
    animals, Pisachas, and Rakshasas are said not to slay him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Freeing others from fear is said to free oneself from fear, and no gift is
    said to be superior to the gift of life.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Creatures are described as suffering death, uterine existence, repeated birth,
