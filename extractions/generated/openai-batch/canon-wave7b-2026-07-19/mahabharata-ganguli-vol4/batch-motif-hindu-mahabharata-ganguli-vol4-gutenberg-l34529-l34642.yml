  quote: ''
  summary: Translator’s footnotes explain mystical and philosophical readings concerning
    Avimukta, subtle ducts, life-breaths, penance, internal sacrifice, the relation
    of heart, mind, mouth, word, Prana, senses, Soul, and the qualities of fire. One
    note explicitly compares the primacy of word in creation with Mosaic Genesis.
  language: English
