literal_observations:
- id: obs:1
  text: A seat called Avimukta is located between the eyebrows and the nose; the same
    region is described as a place where Brahman is seated, Ida and Pingala meet,
    and Vayu is present.
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: Nilakantha interprets Soma as the Ida duct and Agni as the Pingala duct.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Worldly life is described as regulated by life-breaths that are attached to
    the Soul; Udana controls the breaths and is controlled by penance.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Penance is said to destroy the round of rebirths and lead to absorption into
    Brahman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those who renounce sensuous objects are said to be able to create them when
    they wish; one who casts off smell can create earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sense organs are identified with Hotris, their perceptions and functions
    with libations, points and wind with sacred fires, and the objects of the senses
    with fuel cast into the fires.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The heart is identified with the Garhapatya fire; from it arises the Ahavaniya
    fire, identified with mind, and food or fire poured into the mouth develops into
    speech or word.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Word is described as arising first, after which mind sets itself upon word
    with a desire for creation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In dreamless slumber the mind is described as disappearing, while Prana continues
    to exist without apprehending objects.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: A note discusses whether the speaker is the Brahmana, Mind, or Jiva, and states
    that the external world is spoken of as a manifestation of mind while mind depends
    on word or scriptures.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Senses say that without themselves and without their objects, enjoyments
    cannot occur.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: 'Different portions of fire are mapped to qualities: smoke to Darkness, ashes
    to Passion, and the blazing flame receiving oblation to Goodness.'
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: The passage states that the Senses enjoy and not the Soul, and that the unlearned
    ignorantly identify themselves with things they are not.
  category: relationship
  evidence_refs:
  - ev:12
