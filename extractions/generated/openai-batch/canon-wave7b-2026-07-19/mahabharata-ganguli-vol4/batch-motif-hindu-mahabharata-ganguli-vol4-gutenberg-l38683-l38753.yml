canonical_text:
  quote: ''
  summary: Keshava finds Rama in a solitary forest place, sends Daruka to summon Arjuna,
    and sends Vabhru to protect the women, but Vabhru is killed by the cursed iron-bolt.
    Krishna entrusts the women to his father and reassures them that Arjuna will come.
    Returning to the forest, he sees Rama in Yoga as a white thousand-headed Naga
    leaves the human body and is received by Ocean, celestial snakes, and sacred Rivers.
    Krishna then recalls prior words by Gandhari and Durvasas, concludes that his
    own hour of departure has come, restrains his senses, speech, and mind, and lies
    down in high Yoga.
  language: English
  quote_policy: summarized
