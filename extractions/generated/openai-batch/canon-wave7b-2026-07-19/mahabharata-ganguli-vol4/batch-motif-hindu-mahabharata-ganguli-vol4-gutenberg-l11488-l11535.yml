canonical_text:
  quote: ''
  summary: The passage teaches that sacrifices and gifts of kine made according to
    ritual bring superior heavenly regions and great merit, while the ritual should
    not be disclosed to unqualified or faithless persons. It lists righteous kings
    who attained heaven through such gifts, then reports that Yudhishthira followed
    Bhishma's instruction by giving kine, adopting austerities, worshipping kine,
    and no longer yoking them to his vehicles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who performs sacrifice and gives kine according to the prescribed
    ritual attains superior regions, while a person unacquainted with the ritual does
    not attain them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Giving a single cow that yields abundant milk is said to confer merit equivalent
    to giving all desirable things on earth, and the gift of superior oxen is said
    to have still greater merit than the gift of kine.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ritual teaching is described as a mystery that should not be taught to
    one who is not a disciple, lacks vows or faith, has crooked understanding, or
    is sinful and atheistic, because imparting it to such persons would lead to evil.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A series of righteous monarchs is named as having attained heavenly felicity
    or Heaven through gifts of kine made according to ritual instruction.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bhishma instructs Yudhishthira to remember Vrihaspati's instructions and to
    give good kine to foremost Brahmanas after obtaining the Kuru kingdom.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Vaisampayana says that Yudhishthira did what Bhishma wished and remembered
    the religion that the preceptor of the deities had imparted to Mandhatri.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Yudhishthira began to make continual gifts of kine, lived on barley grains
    and cowdung as food and drink, slept on the bare earth, and is described as restrained
    and bull-like in conduct.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Yudhishthira became attentive to kine, worshipped and praised them, stopped
    yoking kine to his vehicles, and used horse-drawn cars when traveling.
  category: action
  evidence_refs:
  - ev:8
