canonical_text:
  quote: ''
  summary: Lomasa teaches rules concerning prohibited sexual conduct and appropriation
    of Brahmana property, the reaction of the Pitris to such conduct, obedience to
    preceptors and seniors, and the merits of recurring gifts and offerings involving
    ghee, Akshata, sesame, water, honey, lamps, Krisara, and ritual vessels. The passage
    compares some gifts to sacrificial merits and calls the teaching an ancient ordinance
    laid down by Rishis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lomasa says the Pitris of men who resort to others' wives become disappointed
    when the time for Sraddhas comes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage groups resorting to others' wives, sexual union with a barren
    woman, and appropriating what belongs to a Brahmana as equally sinful acts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Pitris of such people are said to cut them off, and their offerings fail
    to gratify the deities and the Pitris.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Lomasa says that one should faithfully do the bidding of one's preceptor and
    other seniors.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Monthly gifts of ghee and Akshata to Brahmanas on the twelfth lunar day and
    the full moon are said to increase Soma and the Ocean, to receive a fourth part
    of Horse-sacrifice merit from Vasava, and to bring fulfillment of wishes from
    Soma.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the age of Kali, a person is instructed to rise at dawn, bathe, wear white
    robes, concentrate attention, give sesame-filled vessels to Brahmanas, offer water
    with sesame and honey to the Pitris, and give lamps and Krisara.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Gifts of copper and brass vessels filled with sesame seeds are said to yield
    merits regarded by the deities as equal to those gained by gifts of kine, gifts
    of land, and the Agnishtoma sacrifice with Dakshina.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Water with sesame seeds is said to give eternal gratification to the Pitris,
    and lamps and Krisara are said to please the grandsires.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The teaching is described as an ancient ordinance laid down by the Rishis
    and applauded by both Pitris and deities in their regions.
  category: attribute
  evidence_refs:
  - ev:5
