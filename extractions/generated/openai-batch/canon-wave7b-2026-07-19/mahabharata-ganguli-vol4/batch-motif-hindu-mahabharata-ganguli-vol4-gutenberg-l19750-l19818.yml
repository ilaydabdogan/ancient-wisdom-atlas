canonical_text:
  quote: ''
  summary: A holy speaker explains the religion and practices of ascetic Rishis, including
    named groups such as the Phenapas, Valkhilyas, Chakracharas, Samprakshalas, Asmkuttas,
    and Dantolukhalas. The passage describes their origins, celestial residences,
    modes of subsistence, sacrificial duties, austerities, and ethical discipline.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says he will recite the high religion of ascetics and the duties
    of the Phenapas.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Brahma drank nectar-like water that had flowed in heaven from a great sacrifice,
    and the froth of that water became auspicious and connected with his nature.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Phenapas are Rishis who subsist on the froth that issued from the sacrificial
    water.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Valkhilyas are ascetics who reside in the solar disc, follow an Unchha
    or bird-like mode of subsistence, wear deer-skins or tree-bark, and are as large
    as a digit of the thumb.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Valkhilyas practice penance, are regarded as equal to the gods, exist
    for the purposes of the gods, and blaze with effulgence after burning off their
    sins.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Chakracharas live in the region of Soma and subsist by drinking the rays
    of Soma.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Samprakshalas, Asmkuttas, and Dantolukhalas live near Soma-drinking deities
    and flame-drinking beings; with spouses and controlled passions, they also subsist
    on Soma rays.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Some ascetic groups pour clarified butter on the sacred fire, adore the Pitris,
    and perform sacrifices.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The religion of the Rishis is associated with houselessness, freedom to rove
    through regions, subjugation of passions, knowledge of the Soul, and conquest
    of lust and wrath.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Prescribed duties include fire libations, Dharmaratri, Soma-sacrifice, special
    knowledge, sacrificial presents, daily sacrifices, worship of Pitris and deities,
    and hospitality.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Additional practices include abstaining from luxurious foods made from cow's
    milk, tranquillity, lying on rocks or earth, Yoga, eating potherbs and tree leaves,
    and subsisting on fruits, roots, wind, water, and moss.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A person devoted to truth and tranquillity should eat remaining food only
    after household cooking, eating, serving, and street mendicancy have ceased, if
    no guest has arrived.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The ideal practitioner should avoid arrogance, pride, cheerlessness, discontent,
    and wonder, behave equally toward friends and foes, and be friendly toward all
    creatures.
  category: attribute
  evidence_refs:
  - ev:8
