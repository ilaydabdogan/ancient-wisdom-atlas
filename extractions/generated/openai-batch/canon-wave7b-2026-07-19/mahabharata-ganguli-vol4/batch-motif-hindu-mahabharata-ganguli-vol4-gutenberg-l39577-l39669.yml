canonical_text:
  quote: What is Heaven to me if I am dissociated from my brothers?
  summary: Yudhishthira tells the deities that heaven is meaningless to him without
    Karna, his brothers, kin, and the Princess of Panchala. The gods permit him to
    go, and a celestial messenger leads him through a dark, foul, punitive region
    with corpses, fire, boiling water, sword-leaved trees, heated sand, iron objects,
    boiling oil, and tortures for sinful men. When Yudhishthira turns back, suffering
    voices beg him to remain because his presence brings a fragrant breeze and relief
    from torment; moved by compassion, he stands still.
  language: English
  quote_policy: quoted
