canonical_text:
  quote: "“there is nothing that is unattainable to one that is devoted to kine.”"
  summary: The passage describes Surabhi’s regions or Goloka as wish-granting and
    free from death, decay, fire, and ill luck. It says Goloka is attained through
    celibacy, penance, truth, self-restraint, gifts, righteous deeds, sacred waters,
    and austerities. After hearing Brahman, Sakra begins daily worship of kine. Bhishma
    then tells Yudhishthira that reciting this account in ritual contexts benefits
    ancestors and that devotion to kine grants desired sons, daughters, wealth, merit,
    knowledge, and felicity.
  language: English
  quote_policy: quoted
