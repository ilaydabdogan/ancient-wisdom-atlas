canonical_text:
  quote: ''
  summary: Bhishma introduces an old narrative about Bhangaswana and Sakra. Bhangaswana,
    a righteous but childless king, performs the Agnishtuta sacrifice for offspring,
    a rite said to honor fire alone and to be disliked by Indra. Indra seeks a fault
    in the king but finds none; later, during a hunt, he stupefies the king, who wanders
    thirsty and finds a lake. After watering his horse and bathing, Bhangaswana is
    transformed into a woman. Returning in shame and confusion, the transformed monarch
    tells family and subjects what occurred, gives the kingdom to the sons already
    born, and goes to the forest. There, at an ascetic’s asylum, she bears another
    hundred sons and brings them to the first sons, asking all to share the kingdom
    as brothers. Indra, angry that the transformation has benefited Bhangaswana, takes
    the form of a Brahmana and incites division between the two groups of princes
    by comparing them to the deities and Asuras, who quarreled despite a common father.
    The passage ends as the princes engage in battle.
  language: English
  quote_policy: summarized
