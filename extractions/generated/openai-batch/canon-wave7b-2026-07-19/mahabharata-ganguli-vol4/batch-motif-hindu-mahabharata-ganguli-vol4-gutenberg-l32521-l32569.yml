canonical_text:
  quote: ''
  summary: A sacrificial horse enters Pragjyotisha. Vajradatta, son of Bhagadatta,
    seizes or detains it, but Arjuna attacks with Gandiva and forces him to release
    it. Vajradatta returns armored on a war elephant with royal insignia and challenges
    Arjuna. The two exchange arrows; Arjuna cuts down Vajradatta's shafts, wounds
    Vajradatta, and finally pierces the elephant with arrows described through fire
    and snake imagery, causing it to bleed heavily.
  language: English
  quote_policy: summarized
