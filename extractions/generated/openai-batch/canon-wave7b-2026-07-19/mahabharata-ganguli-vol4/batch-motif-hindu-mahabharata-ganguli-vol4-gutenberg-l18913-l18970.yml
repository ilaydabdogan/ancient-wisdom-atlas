canonical_text:
  quote: ''
  summary: Yudhishthira asks from whom members of the four varnas may accept food.
    Bhishma answers with rules for acceptable and forbidden food givers, describes
    occupational duties, classifies certain occupations and conduct as defiling, and
    states consequences for accepting forbidden food, including pollution, disease,
    loss, degraded status, and unfavorable birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks which persons may provide food to Brahmanas, Kshatriyas,
    Vaisyas, and Sudras.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma says a Brahmana may take food from a Brahmana, Kshatriya, or Vaisya,
    but not from a Sudra.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhishma says a Kshatriya may take food from a Brahmana, Kshatriya, or Vaisya,
    while avoiding food from Sudras described as addicted to evil ways and indiscriminate
    eating.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhishma says Brahmanas and Kshatriyas may eat food from Vaisyas who tend the
    sacred fire daily, have faultless character, and perform the Chaturmasya vow.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Taking food from a Sudra is described through images of earth's abomination,
    human excretions, and the filth of the world.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Service to a Sudra is said to doom a Brahmana, Kshatriya, or Vaisya to perdition
    even if religious rites are performed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Bhishma states duties for Brahmanas, Kshatriyas, and Vaisyas, and identifies
    agriculture, cattle-breeding, and trade as legitimate Vaisya work.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A person abandoning his own occupation for that of a Sudra is to be considered
    a Sudra; certain occupations are also said to be considered Sudra-like.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Those who partake of food at ceremonies in a Sudra's house are said to suffer
    calamity, lose family, strength, and energy, and descend to the status of animals
    and dogs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Food from a physician, harlot, skilled mechanic, or generally censured person
    is compared to excrement, urine, blood, or a pool of blood.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Accepting food when slighted by the giver is said to lead to disease and extinction
    of one's race.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Accepting food from a city warder, grave sinners, a eunuch, an ungrateful
    person, or a misappropriator is linked to degraded status, Rakshasas, or birth
    among the Savaras.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Bhishma concludes that he has recited the persons from whom food may and may
    not be accepted.
  category: speech
  evidence_refs:
  - ev:11
