canonical_text:
  quote: ''
  summary: In the Kuru kingdom, public cordiality between Yudhishthira and Dhritarashtra
    conceals continuing hostility involving Bhima. Bhima secretly troubles Dhritarashtra
    and openly boasts of killing Dhritarashtra's sons, causing the old king deep grief.
    Dhritarashtra later confesses responsibility for the destruction of the Kurus,
    says he ignored wise counsel because of attachment to Duryodhana, and describes
    secret ascetic vows, fasting, ritual recitation, gifts, and Sraddhas performed
    in repentance with Gandhari observing similar austerities.
  language: English
  quote_policy: summarized
