canonical_text:
  quote: ''
  summary: The passage recounts the posthumous destinations of major Mahabharata figures,
    including entry into deities, heavenly regions, or other divine states; describes
    Ananta/Balarama supporting the Earth from below and Vasudeva/Krishna entering
    Narayana; narrates the ascent of Vasudeva's wives after plunging into the Sarasvati;
    closes Janamejaya's snake sacrifice with Astika's rescue of the snakes; and praises
    the Mahabharata as a sacred history whose recitation or hearing removes sins and
    grants heavenly and liberating benefits.
