canonical_text:
  quote: I do not see any branch of knowledge on Earth or Heaven that is capable of
    being mastered by any unaided individual.
  summary: Uma, asked by Sankara about the duties of women, seeks the opinions of
    the sacred rivers before answering. Ganga is selected to reply, praises Uma, and
    states that even a competent person is wise to ask knowledgeable others rather
    than rely on pride. Uma is then honored and begins her discourse on women's duties.
