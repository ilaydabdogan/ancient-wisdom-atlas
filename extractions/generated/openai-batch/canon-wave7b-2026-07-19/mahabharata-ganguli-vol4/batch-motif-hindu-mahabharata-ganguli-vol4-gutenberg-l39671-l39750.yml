canonical_text:
  quote: ''
  summary: Yudhishthira hears painful voices in a hellish region identify themselves
    as his kin and allies. Troubled by the apparent suffering of the righteous and
    prosperity of Suyodhana, he refuses to leave while his brothers are comforted
    by his presence. A celestial messenger reports this to Indra. The gods and embodied
    Dharma arrive; the hellish darkness, torments, Vaitarani river, thorny Salmali,
    iron jars, rocks, and corpses vanish, and a pleasant breeze arises. Indra explains
    that the vision of Hell was an illusion and a reciprocal consequence of Yudhishthira's
    deceptive words to Drona; the companions have been cleansed and have attained
    Heaven.
  language: English
  quote_policy: summarized
