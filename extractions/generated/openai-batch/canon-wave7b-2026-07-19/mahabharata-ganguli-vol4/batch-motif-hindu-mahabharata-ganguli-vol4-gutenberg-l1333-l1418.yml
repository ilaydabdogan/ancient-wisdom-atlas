canonical_text:
  quote: ''
  summary: 'Bhishma recounts to Yudhishthira a story in which a priest asks why a
    king laughs at him during ritual occasions. The king says he remembers their former
    births: the king had been a Sudra practicing penances, while the priest had been
    an austere Rishi who instructed him in rites for the ancestors. The king says
    that this instruction caused the Rishi to be reborn as a priest and the former
    Sudra as a king. The priest then leaves his office, gives gifts, visits sacred
    waters, performs vows and penances, and attains success. Bhishma draws a lesson
    about the danger of improper instruction and speech.'
  language: English
  quote_policy: summarized
