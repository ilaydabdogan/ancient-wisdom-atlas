canonical_text:
  quote: ''
  summary: Yudhishthira orders Bhimasena, with the twins, to honour kings arriving
    for his sacrifice. Krishna arrives with the Vrishnis and other companions and
    is reverentially received. Krishna reports that an agent from Dwaraka has seen
    Arjuna, weakened by many battles and near at hand. Through Krishna, Arjuna asks
    Yudhishthira to honour the assembled kings, prevent carnage like that connected
    with the Arghya at the Rajasuya sacrifice, and especially honour Vabhruvahana,
    ruler of Manipura and Arjuna's son. Yudhishthira approves the message.
  language: English
  quote_policy: summarized
