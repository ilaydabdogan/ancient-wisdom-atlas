canonical_text:
  quote: '"Be thou transformed into a snake!"'
  summary: Yudhishthira asks Bhishma about the merits of offerings such as incense,
    lights, and Vali. Bhishma introduces an old narrative about Nahusha, who gained
    sovereignty in Heaven through good deeds, continued ritual observances there,
    then became proud, ceased those acts, and forced Rishis to bear him. Agastya and
    Bhrigu discuss Nahusha's boons and oppressive conduct. Bhrigu announces that Nahusha
    will insult Agastya, be cursed into a snake, fall from Indra's position to earth,
    and that the true Indra will be restored.
  language: English
  quote_policy: quoted
