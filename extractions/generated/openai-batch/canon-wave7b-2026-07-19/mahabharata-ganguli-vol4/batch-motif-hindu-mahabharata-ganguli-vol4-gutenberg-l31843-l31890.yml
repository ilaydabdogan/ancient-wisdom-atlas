canonical_text:
  quote: ''
  summary: Vaisampayana narrates Yudhishthira's cheerful expedition with troops, priests,
    animals, and attendants. The host travels through varied terrain to mountains
    where buried wealth lies. Yudhishthira establishes an auspicious camp, places
    Brahmanas and his priest Agnivesya in prominent ritual positions, and asks the
    Brahmanas to choose the proper time and actions. They declare the day and constellation
    auspicious, prescribe fasting on water, and the Pandavas spend the night fasting
    on Kusa grass while hearing learned discourses.
  language: English
  quote_policy: summarized
