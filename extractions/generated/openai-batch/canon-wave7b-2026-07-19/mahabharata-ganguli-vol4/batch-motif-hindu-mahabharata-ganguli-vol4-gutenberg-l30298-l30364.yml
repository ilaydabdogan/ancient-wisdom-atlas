canonical_text:
  quote: ''
  summary: Didactic passage prescribing restrained acquisition, non-possession, sharing,
    non-injury, homelessness, equal conduct toward creatures, sense-withdrawal, freedom
    from egoism and attachment, knowledge of the self/Purusha, piety, and one-pointed
    meditation at death as leading to Heaven, Emancipation, escape from death, and
    the highest goal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The practitioner is instructed to eat only food obtained by righteous means
    and to accept only food and clothing, in no greater amount than can be eaten.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage tells the wise person to avoid accepting gifts, making gifts,
    appropriating another's property, and taking anything without being asked, while
    also sharing with others because creatures are helpless.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The practitioner may take unowned earth, water, pebbles, leaves, flowers,
    and fruits as they come when needed for an act.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The practitioner is told not to live by artisan occupation, covet gold, hate,
    teach an unwilling learner, keep belongings, or engage in controversies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The practitioner should reject objects, be content with little, wander homeless,
    and maintain equal behavior toward mobile and immobile creatures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage requires that one neither annoy another being nor be annoyed with
    another; the person trusted by all creatures is called foremost among those who
    understand Emancipation.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The practitioner should not dwell on the past, should not be anxious about
    the future, should disregard the present, and should avoid wrongdoing or defilement
    by eye, mind, or speech.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage compares sense-withdrawal to a tortoise withdrawing its limbs
    and instructs the practitioner to attenuate senses and mind and cultivate peaceful
    understanding.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The practitioner is instructed to be free from pairs of opposites, mineness,
    egoism, expectations, qualities, attachments, dependence, acquisition, and protection
    of possessions.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: The one attached to the self and comprehending all topics is said to become
    emancipated.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The self is described as lacking bodily parts and sensory qualities, being
    absolute, untainted, stable, divine, and residing in all creatures; those who
    perceive it escape death.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The attainment is said not to be reached by understanding, senses, deities,
    Vedas, sacrifices, blissful regions, penance, or vows, and is described as without
    comprehension of symbols.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The learned person in domestic life should practice knowledge-conformable
    piety without fault-finding, even adopting conduct that may cause others to disrespect
    him; such a person is called foremost of ascetics.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: By comprehending the senses, sense-objects, five great elements, mind, understanding,
    egoism, the unmanifest, and Purusha through correct inferences, one attains Heaven
    released from bonds.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: At the end of life, the person conversant with truth should meditate on one
    point; depending on none, freed from attachments like wind in space, he attains
    Emancipation and the highest goal.
  category: sequence
  evidence_refs:
  - ev:11
