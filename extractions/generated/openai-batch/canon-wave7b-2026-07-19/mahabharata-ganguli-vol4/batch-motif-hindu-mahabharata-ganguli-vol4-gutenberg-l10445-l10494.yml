canonical_text:
  quote: A man, by making a gift of food, really makes a gift of life itself.
  summary: 'Yudhishthira asks Bhishma about the merits of gifts of drink. Bhishma
    teaches that gifts of food and drink have unsurpassed merit: food sustains living
    beings and is equivalent to giving life, while water is the source of Soma, nectar,
    milk, herbs, food, and the nourishment of gods, Nagas, Pitris, animals, and humans.
    He concludes that the giver of water gains prosperity, fame, long life, cleansing
    from sin, heaven, and inexhaustible bliss.'
  language: English
  quote_policy: quoted
