canonical_text:
  quote: ''
  summary: The passage concludes a praise-hymn to Mahadeva, describing its power to
    purify, grant Brahman, Emancipation, heaven, contentment, long life, protection,
    and ritual merit. It recounts a chain of transmission for the secret hymn from
    Brahma through gods and sages to the present speaker and Krishna. Krishna then
    tells Partha that a disciplined person who recites it for a year receives the
    fruits of a horse-sacrifice and is protected from harmful beings and snakes.
  language: English
  quote_policy: summarized
