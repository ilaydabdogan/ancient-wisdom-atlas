canonical_text:
  quote: '"my heart becomes filled with grief"'
  summary: Yudhishthira tells Bhishma that he is stupefied and grieved by the destruction
    of many kings and men after the conquest of the earth. He laments the women deprived
    of male kin, fears that the slayers of their Kuru kinsmen will sink head-downward
    into hell, and asks for instruction in severe penance. Vaisampayana then narrates
    that Bhishma reflected and replied.
