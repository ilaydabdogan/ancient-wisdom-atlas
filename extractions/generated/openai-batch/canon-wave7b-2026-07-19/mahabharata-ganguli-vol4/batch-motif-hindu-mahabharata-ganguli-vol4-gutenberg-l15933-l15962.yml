  quote: ''
  summary: Yudhishthira asks Bhishma about the observance of fasts among all social
    orders, the merit and purification gained by fasting, the attainment of heaven,
    and what gifts or duties should follow a fast. Vaisampayana frames the exchange.
    Bhishma replies that he once asked the Rishi Angiras the same questions and that
    Angiras, described as sprung from sacrificial fire, answered concerning fasts
    according to ordinance.
