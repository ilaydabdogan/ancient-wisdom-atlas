canonical_text:
  quote: ''
  summary: Yudhishthira asks how Nahusha fell from divine sovereignty. Bhishma recounts
    that Nahusha initially observed proper offerings and rites after becoming sovereign
    of the deities, but later neglected them and declined in energy. Nahusha yoked
    Agastya to his vehicle, while Bhrigu concealed himself in Agastya's matted locks.
    When Nahusha struck Agastya on the head with his left foot, Bhrigu cursed him
    to fall to earth transformed into a snake. Nahusha retained memory because of
    prior merits and later sought relief from the curse, with Agastya interceding
    and Bhrigu showing compassion.
  language: English
  quote_policy: summarized
