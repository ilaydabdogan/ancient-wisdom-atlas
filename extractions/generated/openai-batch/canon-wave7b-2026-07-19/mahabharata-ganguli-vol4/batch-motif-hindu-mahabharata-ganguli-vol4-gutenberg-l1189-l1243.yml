canonical_text:
  quote: ''
  summary: 'Yudhisthira asks whether one incurs fault by instructing a person of low
    birth. Bhishma answers by introducing an old account set in a sacred Himalayan
    asylum: a compassionate Sudra, honored by ascetics, asks the Kulapati for religious
    instruction and initiation into renunciation. The Kulapati refuses renunciant
    marks for a Sudra but permits him to remain as a servant, promising high felicity
    through service.'
  language: English
  quote_policy: summarized
