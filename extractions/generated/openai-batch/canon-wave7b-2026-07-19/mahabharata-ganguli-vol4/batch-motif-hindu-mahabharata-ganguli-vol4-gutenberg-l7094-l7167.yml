canonical_text:
  quote: ''
  summary: Bhishma tells a king that he will recount the old story of Vipula and the
    creation of women by Brahman. He describes women through images of fire, illusion,
    poison, razor edge, and snake; says the deities were alarmed by human progress
    toward divine status; and narrates Brahman's creation of women through an Atharvan
    rite. He then introduces Devasarman, his beautiful wife Ruchi, Indra's desire
    for her, and Devasarman's commission to his disciple Vipula to guard Ruchi while
    he performs a sacrifice, warning that Indra assumes disguises.
  language: English
  quote_policy: summarized
