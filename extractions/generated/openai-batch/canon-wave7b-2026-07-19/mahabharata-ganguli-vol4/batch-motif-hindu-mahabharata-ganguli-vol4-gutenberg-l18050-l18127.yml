canonical_text:
  quote: ''
  summary: The passage closes a brief episode in which a Rakshasa honors and releases
    a learned Brahmana, then opens a discourse in which Yudhishthira asks Bhishma
    about duty, gifts, and conduct. Bhishma frames the teaching as sacred mysteries
    formerly taught by Vyasa and known by Yama through vows and Yoga. He describes
    religious knowledge concerning deities, Pitris, Rishis, gifts, sacrifices, Sraddha
    rites, guests, purity, heaven, and a celestial messenger's questions before Indra's
    assembly about Sraddha restrictions and three rice-balls.
  language: English
  quote_policy: summarized
