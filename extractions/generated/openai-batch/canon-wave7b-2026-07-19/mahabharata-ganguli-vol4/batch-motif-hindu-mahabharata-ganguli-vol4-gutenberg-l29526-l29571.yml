  quote: '"That path has constantly been trod over by men possessed of wisdom in order
    to achieve an identity with Brahman."'
  summary: Brahma teaches that creatures arise from Truth and live through action.
    He describes Truth, Religion, and four modes or steps of life as paths leading
    toward the highest seat, Adhyatma, and identity with Brahman. He also lists the
    elements of creation and says that accurate knowledge of elements, qualities,
    and deities frees a person from sin, bonds, and delusion.
