canonical_text:
  quote: ''
  summary: Yudhishthira asks Krishna why Arjuna continually suffers hardship despite
    auspicious bodily marks. Krishna attributes this to Arjuna's slightly high cheek
    bones. Draupadi reacts angrily at any fault being ascribed to Arjuna. News arrives
    that Arjuna is returning after following the horse and defeating kings; he is
    praised by citizens, received by elders and companions, and rests after his ordeal.
    Vabhruvahan arrives with Chitrangada and Ulupi and is honored.
  language: English
  quote_policy: summarized
