  text: Yudhishthira asks Krishna to explain why Arjuna is continually separated from
    ease and comfort, and whether a bodily sign causes his misery.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Krishna says he sees no censurable feature in Arjuna except cheek bones that
    are a little too high, and says this is why Arjuna is always on the road and unhappy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Draupadi looks angrily and askance at Krishna because she cannot bear a fault
    being ascribed to Arjuna; Krishna approves the reaction as an indication of love
