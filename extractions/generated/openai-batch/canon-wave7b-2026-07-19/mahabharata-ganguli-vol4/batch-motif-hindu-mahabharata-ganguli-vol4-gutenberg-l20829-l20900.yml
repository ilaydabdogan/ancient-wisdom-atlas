canonical_text:
  quote: ''
  summary: The passage foretells Jarasandha's power and a Dwaraka ruler's universal
    protection, then instructs ascetics to worship Vasudeva/Krishna as identical in
    divine significance with Brahma and the speaker. It describes Vasudeva as refuge,
    source of merit, creator of Rishis, and reciprocal recipient of worship. It also
    describes Vala/Rama/Ananta/Sesha, the plough-bearing elder brother, with a golden
    palmyra standard, serpent canopy, immeasurable extent, and earth-supporting function.
  language: English
  quote_policy: summarized
