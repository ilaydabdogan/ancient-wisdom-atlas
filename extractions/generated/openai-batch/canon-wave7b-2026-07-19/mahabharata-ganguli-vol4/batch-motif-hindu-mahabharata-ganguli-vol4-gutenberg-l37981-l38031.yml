  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yudhishthira says the deity of fire was formerly gratified at Khandava by
    Arjuna, had come to Arjuna in the guise of a Brahmana to solicit a favor, and
    now burned the mother of Arjuna.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yudhishthira laments that his father, a royal sage of Kuru's race practicing
    penances, died by contact with an unsanctified fire although mantra-sanctified
    fires were present in the forest.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Yudhishthira imagines Pritha/Kunti trembling, surrounded by the conflagration,
