canonical_text:
  quote: ''
  summary: Yudhishthira laments that a royal ascetic, Gandhari, and Pritha/Kunti died
    in a forest fire after renouncing royal prosperity. He contrasts former royal
    splendor with burned death, accuses the deity of fire of ingratitude after Arjuna's
    earlier aid at Khandava, grieves that the king died by unsanctified fire, imagines
    Kunti calling for her sons, and the assembled Pandavas and others weep in the
    palace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira says a high-souled monarch, son of Vichitraviryya, was engaged
    in austere penances and was burned to death in a forest conflagration despite
    living kinsmen, many sons, and great strength.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yudhishthira contrasts the king's former royal treatment with his posthumous
    condition, saying he had once been fanned by women and awakened by bards but after
    burning was fanned by vultures and lay on bare ground.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yudhishthira says Gandhari, deprived of her children, observed the same vows
    as her husband and attained the same regions as he did.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yudhishthira says Pritha/Kunti abandoned the blazing prosperity of her sons,
    desired to live in the woods, and was burnt to death like a helpless creature.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yudhishthira denounces sovereignty, prowess, and Kshatriya practices, and
