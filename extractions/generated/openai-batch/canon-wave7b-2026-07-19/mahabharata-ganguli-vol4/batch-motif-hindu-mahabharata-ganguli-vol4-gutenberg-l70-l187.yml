canonical_text:
  quote: ''
  summary: 'Yudhishthira laments before the wounded Bhishma, blaming himself for war-deaths
    and asking for instruction that may cleanse his sin. Bhishma replies by questioning
    personal causation and begins an ancient story: Gautami’s son has died from a
    serpent bite; the fowler Arjunaka captures the serpent and urges its destruction,
    while Gautami repeatedly argues for release, forgiveness, compassion, predestination,
    and avoidance of sin. The fowler counters that killing the serpent would assuage
    grief and produce merit, comparing it to sacrificial killing and the killing of
    an enemy.'
  language: English
  quote_policy: summarized
