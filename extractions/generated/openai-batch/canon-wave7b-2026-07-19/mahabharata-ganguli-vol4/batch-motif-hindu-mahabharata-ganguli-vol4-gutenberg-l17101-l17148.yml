canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma how a person who has injured others in word,
    thought, and deed may be cleansed from misery. Bhishma answers that compassion
    or abstention from injury has four required parts, that all religions are comprehended
    in compassion, and that injury and meat-eating implicate mind, speech, and action.
    He condemns attachment to meat and praises earlier righteous men who gave their
    own flesh to protect other creatures and attained heaven.
  language: English
  quote_policy: summarized
