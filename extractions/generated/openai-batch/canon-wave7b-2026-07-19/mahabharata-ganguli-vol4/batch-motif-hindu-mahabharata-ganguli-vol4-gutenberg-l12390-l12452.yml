canonical_text:
  quote: ''
  summary: Vasishtha recounts a Purana account attributed to Prajapati. After Rudra's
    wedding with Uma on Himavat, the deities fear that their union and offspring would
    burn or consume the worlds, and they ask Rudra to restrain his seed. Rudra agrees
    and draws up his vital seed, while Uma curses the deities with childlessness for
    blocking her issue. The Fire deity was absent from the curse. A small amount of
    Rudra's seed falls to earth, enters blazing fire, and grows. The passage then
    states that Taraka afflicts the deities and that the deities and Rishis seek Brahman's
    protection.
  language: English
  quote_policy: summarized
