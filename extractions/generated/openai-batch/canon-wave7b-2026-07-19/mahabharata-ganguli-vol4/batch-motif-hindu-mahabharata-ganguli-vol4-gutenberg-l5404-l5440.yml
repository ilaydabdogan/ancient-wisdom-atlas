canonical_text:
  quote: ''
  summary: 'Yudhishthira asks how a person may become guilty of Brahmanicide without
    actually killing a Brahmana. Bhishma answers by recounting what Vyasa taught him:
    several non-homicidal acts are counted as Brahmanicide, including refusing promised
    alms to a righteous Brahmana, destroying a Veda-learned Brahmana''s livelihood,
    obstructing thirsty kine, faulting the Srutis without study, withholding an accomplished
    daughter from a suitable bridegroom, causing deep grief to Brahmanas, robbing
    vulnerable persons, and setting fire to ascetic retreats or settlements.'
  language: English
  quote_policy: summarized
