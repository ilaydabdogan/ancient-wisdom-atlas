canonical_text:
  quote: ''
  summary: A divine speaker addresses a goddess or lady and lists ascetic vows, Diksha
    practices, restricted diets, bodily austerities, and forms of renunciation, each
    paired with rewards such as heaven, companionship with celestial or serpent beings,
    royal rebirth, named divine regions, or a heroic heavenly path.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says that people who observe fasts, restrain their senses, avoid
    injury, and speak truth ascend to Heaven and enjoy felicity with Gandharvas.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A righteous-souled man who lies in the Manduka-Yoga attitude and performs
    meritorious acts after Diksha enjoys the next world in the company of Nagas.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several forms of subsistence are described, including eating grass or vegetables
    fallen from deer mouths, moss, fallen leaves, air, water, fruits, and roots; these
    are linked to Amaravati, a high place, Yaksha affluence, and Apsara companionship.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Enduring the five fires in summer for two and ten years leads to becoming
    a king in the next life; food vows and penances for two and twelve years lead
    to rulership of earth.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sitting and lying on bare ground under the sky, observing Diksha duties, and
    casting off the body by abstaining from food lead to Heaven and rewards such as
    vehicles, beds, and bright mansions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: After living self-dependently and observing Diksha duties, casting off the
    body on the great ocean leads to Varuna's regions; piercing one's own feet with
    a sharp stone leads to the Guhyakas' region.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Cultivating the self, overcoming pairs of opposites, detachment, and mental
    observance after Diksha lead to Heaven with deities as companions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Casting off the body on fire as an oblation to the deities leads to the regions
    of Brahman and high respect there.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A regenerate man who completes Diksha, subdues his senses, renounces possessiveness,
    sets out unclothed, places his sacred fire on a tree, and follows the path and
    manner of heroes attains the end reserved for heroes.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The heroic practitioner reaches the eternal region of Sakra, enjoys fulfilled
    wishes, celestial garlands and perfumes, divine companionship, eternal happiness,
    and a car that moves according to the rider's will.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
