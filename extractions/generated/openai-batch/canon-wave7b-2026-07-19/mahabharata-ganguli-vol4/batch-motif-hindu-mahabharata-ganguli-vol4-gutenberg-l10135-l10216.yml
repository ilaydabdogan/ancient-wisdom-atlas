  summary: Narada instructs a blessed lady on gifts to Brahmanas and other worthy
    recipients under named constellations and conjunctions. Specific offerings, often
    accompanied by fasting or restraint, are paired with results such as heaven, prosperity,
    fame, favourable rebirth, rescue from hell, gratification of the Pitris, companionship
    of Apsaras, and wish-fulfilling rewards.
