canonical_text:
  quote: ''
  summary: Angiras instructs a royal addressee about prescribed fasts. The passage
    distinguishes fasting durations for social groups, lists lunar-day and month-long
    one-meal observances, assigns worldly and spiritual rewards, equates some fasting
    disciplines with sacrificial merit, and describes ascent to heavenly regions followed
    by return to earth after merit is exhausted. The supplied passage ends mid-sentence
    while introducing another one-year fasting rule.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Angiras says Brahmanas and Kshatriyas may observe fasts of one, two, or three
    nights, while Vaisyas and Sudras are generally prescribed a single night and are
    not assigned three-night fasts.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fasting or sacrificial observance on specified lunar days is linked with qualities
    or benefits such as forgiveness, beauty, scriptural knowledge, feeding Brahmanas,
    freedom from maladies, and energy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Month-long one-meal observances across named months are each paired with stated
    results, including prosperity, grain, wealth, good fortune, high birth, social
    eminence, animals, vehicles, progeny, heroism, spouses, and fame.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Taking rice at the end of every fortnight is said to yield many kine, large
    progeny, and long life; a three-night monthly fast practiced for twelve years
    is said to yield supremacy among kin and associates.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A six-year regimen includes eating in the forenoon and after evening, abstaining
    from intake in the interval, showing compassion to all creatures, and pouring
    clarified-butter libations on the sacred fire; it is said to earn Agnishtoma-sacrifice
    merit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A meritorious practitioner is said to attain the region of the Apsaras, dwell
    with a thousand beautiful damsels, ride a melted-gold-colored car, receive honors
    in the region of Brahma, and then return to earth after the merit is exhausted.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A one-year practice of eating only one meal per day is said to earn Atiratra-sacrifice
    merit; after death the practitioner ascends to heaven, receives honors, and later
    returns to earth when the merit is exhausted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage ends while beginning another one-year rule involving three days
    of fasting, eating on every fourth day, abstaining from injury, and truthfulness
    of speech.
  category: sequence
  evidence_refs:
  - ev:8
