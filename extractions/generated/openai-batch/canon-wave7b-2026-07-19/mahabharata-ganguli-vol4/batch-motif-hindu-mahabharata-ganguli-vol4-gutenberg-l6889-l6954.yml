canonical_text:
  quote: All these are equal.
  summary: Yudhishthira asks Bhishma which kind of person is best as a recipient of
    gifts. Bhishma answers that several recipient types are equal, warns not to harm
    dependants through giving, distinguishes worthy from unworthy recipients by conduct
    and relation to scripture, and closes with the ordered debts of a householder
    to deities, Rishis, Pitris, Brahmanas, and guests.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: 'Yudhishthira asks which of three persons should be regarded as the best recipient
    of gifts: a stranger, a person long known and living with the giver, or one who
    comes from a long distance.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma says the three recipient types are equal, and says eligibility may
    include soliciting alms for sacrifices, preceptor's fee, or family maintenance,
    or wandering without solicitation and accepting what is given.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhishma states that gifts should be made without afflicting the giver's dependants,
    and says that afflicting dependants afflicts oneself.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Yudhishthira says gifts should be made without afflicting anyone or violating
    scripture, and asks how to ascertain a proper recipient so that the gift itself
    does not grieve.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Bhishma says that a Ritwik, Purohita, preceptor, Acharya, disciple, relative
    by marriage, or kinsman should be respected and worshipped if learned and free
    from malice.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Bhishma lists qualities of a proper recipient: absence of wrath, truthfulness,
    abstention from injury, sincerity, peaceful conduct, absence of pride, modesty,
    renunciation, self-restraint, tranquillity or contentment, and no wicked acts.'
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bhishma says persons who deny Vedic authority, disregard scripture, approve
    breaches of restraint, engage in vain disputation, censure others, suspect all
    persons, lack judgment, or speak bitterly are not worthy of gifts; such a person
    is compared to a barking, biting dog.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Bhishma says a householder pays debts to deities through sacrifices, to Rishis
    through Vedic study, to Pitris through children, to Brahmanas through presents,
    and to guests through feeding them.
  category: action
  evidence_refs:
  - ev:8
