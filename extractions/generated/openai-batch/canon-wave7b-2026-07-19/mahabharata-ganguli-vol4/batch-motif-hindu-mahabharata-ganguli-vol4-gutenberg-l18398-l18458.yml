canonical_text:
  quote: ''
  summary: Agni describes the demerits of raising a foot against a cow, a Brahmana,
    or blazing fire. Viswamitra gives a timed Pitri-offering rite with multiplied
    Sraddha merit. The kine teach a cow-adoration mantra and its rewards. Bhishma
    narrates the seven Rishis asking Brahman how the poor may gain sacrificial merit,
    and Brahman prescribes a lunar observance that grants the merit of great sacrifices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Agni says that a man who lifts his feet to strike a cow, a highly blessed
    Brahmana, or blazing fire becomes infamous; his Pitris fear, the deities are dissatisfied,
    Fire refuses his libations, and he rots in hell for a hundred lives without rescue.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Agni concludes that a faithful person desiring good should never touch a cow,
    a high-energy Brahmana, or blazing fire with the feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Viswamitra prescribes offering the Pitris rice boiled in sugared milk while
    facing south at noontide in the shade of an elephant in Bhadrapada under the constellation
    Magha.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Viswamitra says the person who makes that offering is regarded as performing
    a great Sraddha each year for thirteen successive years.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The kine say that a person becomes cleansed of sins by adoring a cow with
    mantras addressing her as Vahula, Samanga, fearless, forgiving, auspicious, friend,
    and source of plenty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The cow-adoration mantra says the cow was present with her calf in Indra's
    sacrifice, took station in the firmament and path of Agni, and was adored by deities
    with Narada among them as Sarvamsaha.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The kine say that the cow-adorer attains the region of Purandara, acquires
    the merits of kine and the splendour of Chandramas, is freed from sin, fear, and
    grief, and finally resides in Indra's happy region.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Bhishma says the seven Rishis, led by Vasishtha, rose, circumambulated the
    Lotus-born Brahman, and stood around him with joined hands.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Vasishtha asks Brahman how righteous men who lack worldly goods may acquire
    the merits attached to sacrifices.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Brahman prescribes that in the lighted fortnight of Pausha under Rohini, one
    should bathe, lie under the open sky, wear a single garment, maintain faith and
    concentration, and drink the rays of the moon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Brahman says this lunar observance grants the merits attached to the performance
    of great sacrifices.
  category: relationship
  evidence_refs:
  - ev:5
