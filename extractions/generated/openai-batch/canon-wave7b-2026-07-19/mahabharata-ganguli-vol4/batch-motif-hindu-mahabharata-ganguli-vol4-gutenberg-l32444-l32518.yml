canonical_text:
  quote: ''
  summary: Vaisampayana narrates a battle in which Trigarta warriors try to capture
    the sacrificial horse. Arjuna warns them and fights while remembering Yudhishthira's
    order not to slay certain Kshatriyas. He defeats several Trigarta leaders, is
    wounded by Dhritavarman so that his bow Gandiva falls, resumes combat in anger,
    routs the Trigartas, and accepts their submission and dominion.
