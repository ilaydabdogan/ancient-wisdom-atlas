canonical_text:
  quote: ''
  summary: A fowler accuses a serpent and Mrityu of causing a child's death. Mrityu
    attributes their action to Kala. Kala appears and teaches that the child's own
    Karma is the true cause. Gautami accepts this explanation and asks that the serpent
    be released. Bhishma applies the lesson to Yudhishthira's grief over the war,
    saying heaven, hell, and death arise from one's own Karma and from acts of Kala.
  language: English
  quote_policy: summarized
