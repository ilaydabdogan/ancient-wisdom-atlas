canonical_text:
  quote: ''
  summary: Dhritarashtra receives sight through a Rishi's grace and sees his sons.
    Janamejaya asks Vyasa to show him his deceased father Parikshit. Vyasa brings
    Parikshit from the other world or Heaven in his former form, along with Samika
    and Sringin. Janamejaya completes the final bath of his sacrifice, pours sacred
    water on his father and himself, and says the sight has dispelled his sorrow.
    Astika interprets the sacrifice, mentions the snakes consumed and Takshaka's escape,
    and says Janamejaya has gained merit and release from grief.
  language: English
  quote_policy: summarized
