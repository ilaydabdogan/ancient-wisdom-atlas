canonical_text:
  quote: ''
  summary: 'Yudhishthira questions Bhishma about disputed sonship: whether a son belongs
    to the seed-giver, the husband of the mother, or the one who owns and rears him.
    Bhishma answers with rules about biological begetting, the husband as owner of
    the ''soil,'' abandoned children made into sons by rearing, and the purificatory
    and marriage rites appropriate to such sons and other irregular birth categories.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage is framed as a dialogue in which Yudhishthira asks and Bhishma
    answers questions about sonship and ritual status.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
- id: obs:2
  text: Yudhishthira asks how the husband of a woman who gives birth derives a right
    to the son when the son has sprung from another's seed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bhishma states that a man who begets a son and then abandons him cannot be
    regarded as that son's sire, because vital seed alone does not create sonship.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bhishma states that when a man marries a girl already pregnant, the child
    born from that spouse belongs to the husband, and the seed-giver has no right
    to the child.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bhishma says that a son born in one man's 'soil' but begotten by another may
    show the marks of the actual begetter and be recognized by sight.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: A 'made son' is defined as a child cast off on the road by his father and
    mother, taken up and reared by another person who cannot find the parents after
    searching.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The abandoned child becomes owned by the person who brings him up and is regarded
    as belonging to that person's order.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Purificatory rites for such a son are to follow the usage, race, and kinsmen
    of the rearer when the true mother's order cannot be ascertained.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The girl bestowed in marriage on such a son should be selected according to
    the rearer's order when the mother's order is unknown.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bhishma describes sons born of a maiden or conceived before marriage but born
    after marriage as disgraceful and degraded, while still assigning them the same
    purificatory rites as lawful sons of their orders.
  category: attribute
  evidence_refs:
  - ev:5
