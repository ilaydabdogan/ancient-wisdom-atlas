  quote: ''
  summary: Vaisampayana narrates a battle in which surviving Saindhava Kshatriyas
    seize a sacrificial horse and attack Arjuna. Arjuna is encircled and overwhelmed
    by arrows, cosmic omens appear, and he briefly loses consciousness. Deities and
    Rishis offer benedictions and recitations for his welfare. Arjuna’s power returns;
    he draws Gandiva and routs the Saindhava force with showers of arrows.
