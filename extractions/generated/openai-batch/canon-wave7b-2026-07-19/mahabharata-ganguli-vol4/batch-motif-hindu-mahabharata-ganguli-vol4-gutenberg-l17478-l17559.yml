canonical_text:
  quote: Death is felt by all creatures to be fraught with pain. Life is an acquisition
    difficult to make.
  summary: Yudhishthira asks Bhishma about the fate of those who give up life in battle.
    Bhishma replies by beginning an old narrative in which Vyasa encounters a frightened
    worm fleeing an approaching car. The worm explains its fear of death, its attachment
    to life, and its memory of a former human birth as a wealthy Sudra marked by cruelty
    and neglect of duty, except for reverence to its mother and hospitality to a Brahmana
    guest.
  language: English
  quote_policy: quoted
