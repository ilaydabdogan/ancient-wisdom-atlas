canonical_text:
  quote: ''
  summary: Bhishma recounts how King Nahusha approaches the sage Chyavana, who requires
    that fishers be paid a fair price for him along with their fish. Monetary and
    royal payments are rejected as inadequate. A cow-born ascetic advises that a cow
    should be treated as the sage's value, because Brahmanas and cows are invaluable.
    Chyavana accepts the cow price and praises kine as auspicious, sacrificially central,
    prosperous, sin-cleansing, heavenly, and wish-granting.
  language: English
  quote_policy: summarized
