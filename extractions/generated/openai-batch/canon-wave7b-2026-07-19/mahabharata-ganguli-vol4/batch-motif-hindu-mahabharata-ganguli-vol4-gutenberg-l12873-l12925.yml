canonical_text:
  quote: It has been said that gold is identical with Agni.
  summary: The passage describes libations and gifts centered on gold, identifies
    gold with Agni and derives gold from Agni, lists ritual times and rewards for
    giving gold, recounts Kartikeya's appointment as commander of the celestial forces
    and his slaying of Taraka and other Asuras, and frames the teaching through Vasishtha,
    Bhishma, Jamadagni's son, and Yudhishthira.
  language: English
  quote_policy: quoted
