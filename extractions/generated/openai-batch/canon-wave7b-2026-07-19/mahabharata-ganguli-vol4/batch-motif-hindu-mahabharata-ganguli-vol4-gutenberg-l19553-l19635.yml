canonical_text:
  quote: ''
  summary: Maheswara instructs a goddess on the duties of the four social orders.
    He describes Brahmana study and householder observances, including sacred fires,
    offerings, hospitality, and Vighasa; Kshatriya duties of protection, judgment,
    punishment, sacrifice, and battle; Vaisya duties of cattle-keeping, agriculture,
    trade, hospitality, and giving; and Sudra duties of service, truthfulness, sense-control,
    hospitality, and worship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maheswara speaks to a goddess and frames the passage as an answer about duties
    belonging to the four orders.
  category: speech
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:2
  text: The Brahmana's duties include hearing religious mysteries, observing Vedic
    vows, tending the sacred fire, serving the preceptor's business, mendicancy, wearing
    the sacred thread, Vedic recitation, and Brahmacharya.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After study, the Brahmana is to leave the preceptor's abode with permission,
    return to the father's house, marry a suitable wife, avoid food prepared by a
    Sudra, and maintain fasts and Brahmacharya practices.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The householder is to maintain domestic fire, study the Vedas, pour libations
    to Pitris and deities, control the senses, serve gods, guests, and dependants
    before eating, and be abstemious, truthful, and pure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Householder duties also include attending to guests, keeping three sacrificial
    fires, performing Ishti sacrifices, dedicating animals according to ordinance,
    and abstaining from injury to all creatures.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Vighasa is defined as the food remaining after gods, guests, and dependants
    have been served, and the regenerate householder is to eat after family, servants,
    and other dependants.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the householder's life, husband and wife should have equal conduct; the
    householder should make daily offerings to domestic deities and keep the house
    rubbed with cowdung and water and fumigated by clarified-butter smoke from the
    sacred fire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Kshatriya's duty is said to be protection of all creatures, and a righteous
    king gains a fixed share of his subjects' merits and future regions of felicity
    through protection.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Kingly duties include self-restraint, Vedic study, fire libations, gifts,
    sacred thread, sacrifices, religious rites, support of dependants, punishment
    according to offence, judging disputes, truthfulness, aid to the distressed, and
    battlefield death for kine and Brahmanas.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Vaisya duties include cattle-keeping, agriculture, libations on the sacred
    fire, gifts, study, trade, righteousness, hospitality, peacefulness, self-restraint,
    welcoming Brahmanas, renunciation in favor of Brahmanas, and avoiding the sale
    of specified goods.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Sudra's high duty is service to the three regenerate classes; a truthful,
    self-controlled, hospitable, righteous Sudra who worships deities and Brahmanas
    gains merit and desirable rewards.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The householder duties are said to uphold the world and to flow from righteous
    Brahmanas who live domestically.
  category: relationship
  evidence_refs:
  - ev:4
