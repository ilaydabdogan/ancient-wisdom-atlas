canonical_text:
  quote: ''
  summary: Vaisampayana narrates that the Pandavas spend a night in an ascetic retreat,
    Yudhishthira surveys the retreat with his attendants, sees sacrificial fires,
    ascetics, animals, birds, and Vedic recitation, gives ritual and household goods
    to ascetics, and then returns to Dhritarashtra. Yudhishthira and his brothers
    salute Dhritarashtra, and later great Rishis, including Satayupa and Vyasa with
    disciples, arrive and are honored before taking seats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The night in the ascetic retreat is marked by auspicious constellations, conversation
    about morality and wealth, and citations from the Srutis; the Pandavas sleep near
    their mother on the bare ground after eating Dhritarashtra's food.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After morning acts, Yudhishthira surveys the retreat with his brothers, household
    ladies, servants, and priest, acting under Dhritarashtra's command.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yudhishthira sees many sacrificial altars with sacred fires, ascetics, completed
    oblations, libations for deities, forest fruits and roots, flowers, and smoke
    from clarified butter.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The retreat contains ascetics and lay brethren, fearless deer, many birds,
    birdsong, Vedic hymn-chanting by learned Brahmanas, and heaps of gathered fruits
    and roots.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yudhishthira gives the ascetics gold or copper jars, deer-skins, blankets,
    wooden sacrificial ladles, Kamandalus, wooden platters, pots, pans, iron vessels,
    and cups.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Yudhishthira returns to Dhritarashtra and sees Gandhari beside him and Kunti
    seated nearby with humility; he salutes Dhritarashtra, receives permission to
    sit, and sits on a Kusa-grass mat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The other sons of Pandu, including Bhima, salute Dhritarashtra, touch his
    feet, and sit after receiving his permission.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Rishis including Satayupa arrive, followed by Vyasa with numerous disciples;
    Dhritarashtra, Yudhishthira, Bhimasena, and others rise, advance, and salute the
    guests.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Vyasa tells Dhritarashtra to be seated, then takes a reserved seat made of
