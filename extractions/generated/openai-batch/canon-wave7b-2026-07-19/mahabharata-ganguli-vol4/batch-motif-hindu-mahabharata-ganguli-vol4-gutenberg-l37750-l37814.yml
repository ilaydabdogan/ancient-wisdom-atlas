canonical_text:
  quote: ''
  summary: Janamejaya asks what Dhritarashtra and Yudhishthira did after seeing the
    departed sons and grandsons. Vaisampayana narrates that Dhritarashtra, freed from
    grief by the sight, returned to his retreat. Vyasa counsels him not to sorrow
    and to dismiss Yudhishthira back to his kingdom. Dhritarashtra tells Yudhishthira
    that his purpose has been fulfilled, asks permission to undertake sterner penances,
    and urges him to return to rule and preserve the ancestral line. Yudhishthira
    wishes to remain serving Dhritarashtra and the two mothers, but Gandhari tells
    him to obey and depart because the Kuru race and ancestral rites depend on him.
  language: English
  quote_policy: summarized
