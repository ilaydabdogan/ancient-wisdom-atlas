canonical_text:
  quote: ''
  summary: 'A Brahmana describes emancipation through absorption, non-attachment,
    equality toward opposites, restraint, and abandonment of ego and desire. He then
    introduces Yoga: withdrawing the senses and concentrating the mind allow the practitioner
    to behold the soul and the Supreme Soul within. Images include the universe as
    an Aswattha tree, cessation like an unfed fire, and the soul as fibrous pith extracted
    from Saccharum Munja. The realized yogin is described as beyond fear, death, weapons,
    and ordinary bodily limitation, and as attaining Brahma.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Brahmana says that one who becomes absorbed in the one receptacle, ceases
    to think even of separate existence, and casts off things successively crosses
    his bonds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The emancipated person is described as friendly to all, enduring, tranquil,
    sense-conquered, free from fear and wrath, restrained, pure, free from vanity,
    and without egoism.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The emancipated person looks equally on life and death, pleasure and pain,
    gain and loss, and agreeable and disagreeable things.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says emancipation involves not coveting what belongs to others,
    disregarding no one, transcending pairs of opposites, and being free from attachment.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage describes an emancipated person as having no enemy, kinsman, or
    child, and as casting off religion, wealth, pleasure, desire, cupidity, merit,
    and demerit.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
