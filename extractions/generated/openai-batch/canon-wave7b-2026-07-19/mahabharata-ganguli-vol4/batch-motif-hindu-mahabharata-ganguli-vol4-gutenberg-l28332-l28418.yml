    the attributes of the five elements, form, and cause.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Abandoning purposes related to body and mind is said to lead gradually to
    cessation of separate existence, compared with a fire without fuel.
  category: sequence
  evidence_refs:
