  - ev:15
  - ev:16
  confidence: high
  cautions: The available taxonomy has no exact 'conquest of death through hospitality'
    category; 'wisdom' is only an approximate family reference.
- id: motif:2
  label: divine suitor marries mortal princess
  taxonomy_refs:
  - sacred_marriage
  - divine_beloved
  basis: Agni, a deity, seeks and marries Duryodhana's daughter Sudarsana according
    to Vedic rites.
  evidence_refs:
  - ev:5
  - ev:9
  - ev:12
  confidence: high
  cautions: The passage emphasizes ritual marriage and divine desire rather than a
    developed romance.
- id: motif:3
  label: deity appears in disguise to request marriage
  taxonomy_refs:
  - shapeshifter
  basis: Agni takes the shape of a Brahmana when seeking Sudarsana's hand from the
    king.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: Only a single disguise is described; the passage does not dwell on transformation
    beyond the marriage request.
- id: motif:4
  label: withdrawal of sacrificial fire after refusal
  taxonomy_refs:
  - sacrifice
  basis: After the king refuses the disguised Agni's request, Agni vanishes from the
    great sacrifice, creating a ritual crisis.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage presents the withdrawal as connected to Agni's request, but
    does not explicitly label it punishment.
- id: motif:5
  label: marriage dower as divine presence in a place
  taxonomy_refs:
  - sacred_exchange
  basis: Duryodhana asks Agni, as marriage dower, to remain always with them in Mahismati;
    Agni agrees, explaining his continued presence there.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The exchange is specifically a marriage dower and local etiology, not
    a general covenant.
- id: motif:6
  label: child born of deity and human princess
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  - miraculous_child
  basis: A son named Sudarsana is born from Agni and the princess Sudarsana and is
    attributed exceptional beauty and early knowledge of Brahma.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The birth is divine-parental but not described with an elaborate miracle
    sequence.
- id: motif:7
  label: exceptional hospitality as supreme household virtue
  taxonomy_refs:
  - sacred_exchange
  basis: Sudarsana instructs Oghavati that householders have no higher virtue than
    hospitality to guests, even requiring extreme personal offering.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The passage excerpt ends mid-instruction, so the narrative consequences
    of the vow are not included here.
- id: motif:8
  label: sacred river as mother of an exceptional daughter
  taxonomy_refs:
  - mother_goddess
  basis: The celestial river Narmada courts Duryodhana and bears him the exceptionally
