canonical_text:
  quote: ''
  summary: Bhishma introduces an ancient history about a householder conquering Death
    through virtue. A royal lineage from Manu and Ikshwaku leads to Duryodhana of
    Mahismati. The river Narmada becomes connected with Duryodhana and bears him the
    daughter Sudarsana. Agni seeks Sudarsana in the form of a Brahmana; when refused,
    he disappears from a sacrifice. After Agni reveals his desire, Duryodhana gives
    Sudarsana to him and obtains the boon that Agni remain in Mahismati. Sudarsana
    and Agni have a son also named Sudarsana, who later marries Oghavati and vows
    to conquer Death through the duties of a householder, especially hospitality to
    guests.
  language: English
  quote_policy: summarized
