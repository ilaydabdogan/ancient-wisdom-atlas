canonical_text:
  quote: ''
  summary: Footnotes explain rules and commentary concerning marriage promises, completion
    of marriage by wedding rites, circumambulation and water-gift ritual, eligibility
    of husbands, restrictions on self-choice, inheritance and paternity rules, caste/order
    duties, named abduction examples, and the relation between Yudhishthira's question
    and Bhishma's answer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes state that wife-status does not arise merely from a promise, but
    from actual wedding; a marriage becomes complete when kinsmen meet, use due rites,
    and declare the girl to be a man's wife.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes distinguish cases in which the giver of a girl incurs sin or fault
    after a promise, and advise against bestowing a daughter upon an ineligible person.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Circumambulation is described as an important marriage rite: the girl is
    borne around the bridegroom by kinsmen, and gifts are made with water sprinkled
    by means of Kusa grass.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The notes say Savitri's act at her sire's bidding was not against duty or
    morality, and then describe restrictions against desire-led marriage and against
    permitting the maiden to choose for herself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A maiden's acceptance of ornaments is said not to convert the transaction
    into a sale.
  category: object
  evidence_refs:
  - ev:6
- id: obs:6
  text: The notes describe property division and inheritance shares involving daughters,
    sons, spouses, and children.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:6
- id: obs:7
  text: A note states that if a Brahmana disregards a wife of his own order and prefers
    wives of other orders, he incurs a stated liability of being regarded as a Chandala
    numbered among Brahmanas.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The notes state that each order was created for sacrifice, that the Sudra's
    sacrifice is by serving the three other orders, and that certain groups have no
    investiture with the sacred thread.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The notes include a caste-status claim that one of low birth remains low in
    disposition and that scriptural study cannot raise such a person.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The notes state that a son begotten upon a maiden by one who does not become
    her husband, and born after her marriage, is regarded as belonging to the husband
    unless the begetter wishes to have and rear him.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The final note says that the objects of Yudhishthira's question become clear
    from Bhishma's answer.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The notes say that the cases of Krishna abducting Rukmini and Arjuna abducting
    Subhadra are excluded from a denunciation concerning consent obtained by force.
  category: relationship
  evidence_refs:
  - ev:5
