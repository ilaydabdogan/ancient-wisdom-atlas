canonical_text:
  quote: ''
  summary: A prescriptive passage gives rules for eating, hospitality, sharing food,
    washing and purification with water, bodily loci for rites, avoidance of harmful
    speech and improper contact, sexual prohibitions, ancestor and deity worship,
    household care obligations, interpretation of certain animals as auspicious or
    inauspicious, and twilight or night restrictions. Several observances are said
    to bring long life, fame, or social standing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage prescribes eating once in the morning and once in the evening,
    avoiding food with hair, food at an enemy's Sraddha, eating noisily, eating while
    standing, eating uncovered, or placing food on bare ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A guest is to be offered water and food before the host eats; a person who
    eats with friends without sharing is described as eating poison.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage forbids offering remnants of certain drinks and foods to others
    and warns against eating doubtful food or drinking curds at the end of a meal.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: After a meal, the instructed person is told to wash the mouth, face, sense
    organs, navel, and hands with water, dip the right toe in water, touch the crown
    of the head, and then touch fire.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Specific regions of the hand are identified as sacred places for Brahma, deities,
    and Pitri rites.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage forbids calumny, disagreeable speech, provoking others' wrath,
    and contact or conversation with a person who has fallen from his order.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage lists prohibited sexual relations and says that avoiding them
    leads to long life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: For purification before religious acts, the passage prescribes repeated washing
    of the lips, washing of the sense organs, sprinkling the body with water, achamana
    with water on the Brahmatirtha, and worship of the Pitris and deities.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old kinsman or poor friend is to be established in the house and cared
    for as a family member, with fame and long life stated as results.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Pigeons and parrots in the house are described as blessed or calamity-dispelling,
    while fireflies, vultures, wood-pigeons, bees, and ospreys entering or residing
    in a house are treated as evil omens requiring propitiation of deities.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage instructs one to keep the secrets of high-souled men, avoid forbidden
    sexual associations, provide for friends, Brahmanas, and those seeking protection,
    and live in a house made with the aid of a Brahmana and a skilled engineer.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At evening twilight and night, the passage restricts sleeping, study, eating,
    Pitri rites, use of remnants or worship flowers, and excessive night-time feeding
    of guests or oneself.
  category: sequence
  evidence_refs:
  - ev:8
