canonical_text:
  quote: '"The gift of drink, O chief of men, is superior to every other gift."'
  summary: Yudhishthira asks Bhishma about the rewards attached to digging tanks and
    planting trees. Bhishma teaches that water tanks benefit many beings, yield sacrificial
    and otherworldly merit, and make the gift of drink especially meritorious. He
    then teaches that planting trees brings fame, heavenly reward, lineage rescue,
    and benefits to deities, ancestors, guests, and many classes of beings.
  language: English
  quote_policy: quoted
