canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma what expiations a Brahmana should perform after
    accepting various foods, gifts, offerings to gods, or oblations to ancestors.
    Bhishma answers with a catalogue of item-specific and context-specific purifications,
    including fire oblations, recitation of Savitri or Gayatri, fasting, bathing or
    ablutions, giving clarified butter to Brahmanas, and rites for dining in death-related
    or cross-class contexts.
  language: English
  quote_policy: summarized
