canonical_text:
  quote: It is by conduct that one acquires longevity, and it is by conduct that one
    acquires wealth and prosperity.
  summary: Bhishma explains that proper conduct, prayer, purity, restraint, right
    speech, and observance of duties are linked with longevity, prosperity, fame,
    and better afterlife outcomes, while improper conduct, adultery, ritual neglect,
    and cruel speech are linked with short life, Hell, or injury to others.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bhishma says he will explain the reasons for short life, longevity, fame,
    wealth, prosperity, and beneficial living.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Conduct is presented as the means by which one acquires longevity, wealth,
    prosperity, and fame; improper or wicked conduct is presented as incompatible
    with long life.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: People described as atheists, inactive in prescribed acts, disobedient to
    preceptors, scripturally transgressive, ignorant or neglectful of duties, wicked,
    improperly behaved, or sexually unrestrained are said to become short-lived; some
    are said to go to Hell hereafter.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: People who practice propriety and righteousness, have faith, are free from
    malice and wrath, speak truthfully, and injure no creature are said to live for
    a hundred years.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Breaking small clods, tearing up grass underfoot, biting off nails, impurity,
    and restlessness are listed as behaviors that prevent long life.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The daily sequence prescribed includes rising at Brahma Muhurta, thinking
    of religion and profit, washing face and mouth, joining hands reverently, and
    saying morning prayers; evening prayers are also prescribed with restrained speech.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage forbids looking at the rising sun, setting sun, eclipsed sun,
    the sun's image in water, or the sun at the meridian.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Rishis are said to have attained longevity by regularly adoring the two
    twilights.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A righteous king is instructed to set Brahmanas who do not say prayers at
    the two twilights to acts ordained for Sudras.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sexual congress with other people's wives is said to shorten life, and an
    adulterer is said to dwell in Hell for thousands of years measured by the pores
    on the women's bodies.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Forenoon conduct includes dressing the hair, applying collyrium to the eyes,
    washing the teeth, and worshipping the deities.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Travel conduct includes avoiding journeys at certain times or with certain
    companions, yielding the road to specified persons and beings, walking around
    a known large tree, and walking around a four-road junction.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage prescribes avoidance of another person's sandals or clothes, observance
