canonical_text:
  quote: ''
  summary: Gautami refuses to have a serpent killed after it has caused her son's
    death, arguing that killing it will not restore the child and that release may
    earn merit. The fowler Arjunaka repeatedly urges killing the serpent and invokes
    mythic precedents. The bound serpent speaks in a human voice and argues that Mrityu
    sent it and that it acted without independent will. The fowler and serpent debate
    causation and blame through analogies. Mrityu appears, says he too was guided
    by Kala, and describes all beings and acts as influenced by Kala. The serpent
    then asks Arjunaka not to torment it by binding it with a cord.
  language: English
  quote_policy: summarized
