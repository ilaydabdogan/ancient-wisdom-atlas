  evidence_refs:
  - ev:6
- id: obs:11
  text: The addressed figure is described with cloud-like complexion and splendor,
    as beyond description by names, and as having a unique form with no comparison
    in the universe.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The addressed figure is adorned with a half-moon, gems, eight flowers, and
    red garland and robes; he is also described as having fiery mouth and eyes and
    as being of the form of fire.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: The addressed figure ranges through the firmament, resides in pasture lands
