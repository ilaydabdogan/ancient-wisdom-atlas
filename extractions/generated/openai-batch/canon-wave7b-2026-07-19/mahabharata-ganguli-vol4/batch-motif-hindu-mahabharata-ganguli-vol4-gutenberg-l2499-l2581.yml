  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The addressed figure is described as dark and fair, half yellow and half white,
    half male and half female, and both male and female.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The addressed figure is said to have a bull as vehicle, to ride on the foremost
    of elephants, and to go to places unapproachable by others.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Ganas are said to sing the addressed figure's praises, and the addressed
