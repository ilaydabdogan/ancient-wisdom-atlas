canonical_text:
  quote: ''
  summary: Upamanyu reports reciting a hymn of salutations to Mahadeva. The hymn addresses
    Mahadeva as refuge, as assuming Sakra's form, as armed and adorned in many ways,
    as solar, lunar, fiery, earthly, windy, and cosmic, as both male and female and
    beyond sex, as associated with Ganas, sacrifice, healing, creation, and sovereignty
    over celestials and the universe.
  language: English
  quote_policy: summarized
literal_observations:
