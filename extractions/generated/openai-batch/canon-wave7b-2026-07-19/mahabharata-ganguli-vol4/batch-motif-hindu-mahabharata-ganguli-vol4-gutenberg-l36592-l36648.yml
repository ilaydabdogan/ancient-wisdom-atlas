canonical_text:
  quote: ''
  summary: Kunti remains resolved to go into the woods despite attempts by the Pandavas,
    Dhritarashtra, and Gandhari to persuade her to return. The Pandavas and the women
    of the household lament and return to Hastinapura, which becomes sorrowful. Dhritarashtra's
    party reaches the bank of the Bhagirathi, performs sacred-fire rites and evening
    worship, sleeps on beds of Kusa grass while Brahmanas chant hymns, and continues
    the forest journey after morning libations.
  language: English
  quote_policy: summarized
