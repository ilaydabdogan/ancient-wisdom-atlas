  quote: As soon as Mahadeva's eyes were thus covered, all the regions became dark
  summary: Narada describes Mahadeva performing penance on the sacred mountains of
    Himavat amid divine, ascetic, and ghostly beings. Uma arrives with a female retinue
    and a jar of sacred waters, playfully covers Mahadeva's eyes, and the universe
    becomes dark and fearful until a blazing flame and third eye appear from his forehead.
  language: English
