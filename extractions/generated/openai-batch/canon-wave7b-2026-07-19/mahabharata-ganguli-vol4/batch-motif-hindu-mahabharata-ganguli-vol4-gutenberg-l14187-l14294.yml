canonical_text:
  quote: ''
  summary: A sequence of Rishis, royal sages, and other speakers pronounce oaths and
    imprecations upon whoever has stolen Agastya's lotus-stalks. Indra instead gives
    the supposed thief blessings and merit, leading Agastya to identify him as the
    taker. Indra explains that he removed the stalks to hear the assembled sages recite
    duties, returns them, and asks forgiveness. Agastya accepts them back, the ascetics
    proceed to sacred waters for ablutions, and the passage closes with benefits promised
    to readers or students of the narrative.
  language: English
  quote_policy: summarized
