canonical_text:
  quote: ''
  summary: 'The passage describes graded fasts and their promised results: acquisition
    of sacrificial merit, ascent to heaven, celestial vehicles, long periods of heavenly
    enjoyment, attendants, music, removal of sin, fulfilled wishes, and the superiority
    of fasting as penance. It cites Angiras and several Rishis as authorities or examples,
    and says that reading or hearing the ordinances frees one from sin and other faults.'
