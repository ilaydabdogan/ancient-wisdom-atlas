canonical_text:
  quote: ''
  summary: Indra speaks to Agni about his power over foes and past punishments of
    hostile beings. Agni responds by recalling how the Brahmana sage Chyavana, during
    Saryati's sacrifice involving the Aswins and a Soma offering, resisted Indra's
    thunderbolt, created the terrifying Asura Mada, and forced Indra to seek protection.
    Agni concludes that Brahmanas are more powerful than Kshatriyas and says he will
    not oppose Samvarta.
  language: English
  quote_policy: summarized
