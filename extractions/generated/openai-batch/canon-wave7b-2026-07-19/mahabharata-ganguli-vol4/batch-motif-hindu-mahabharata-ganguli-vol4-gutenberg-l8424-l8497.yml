canonical_text:
  quote: '"I shall either die with these fishes or do ye sell me with them."'
  summary: Yudhishthira asks Bhishma about compassion, sympathy arising from companionship,
    and the blessedness of kine. Bhishma begins an ancient narrative in which the
    Rishi Chyavana undertakes a long water-dwelling vow at the confluence of the Ganga
    and Yamuna. Fishermen cast a large net, drag up Chyavana together with fish and
    aquatic animals, and then bow to him in fear. Seeing the fish die after being
    dragged onto land, Chyavana is moved with compassion and says he will not abandon
    them, asking either to die with them or be sold with them.
  language: English
  quote_policy: quoted
