canonical_text:
  quote: ''
  summary: Dhritarashtra sends Vidura to ask Yudhishthira for wealth to perform Sraddha
    rites for slain kin and associates before retiring to the woods. Yudhishthira
    and Arjuna approve, while Bhima objects because he remembers Duryodhana's wrongs,
    the exile, and the dice game. Arjuna urges permission on grounds of duty and the
    reversal brought by Time; Yudhishthira rebukes Bhima and tells him to be silent.
  language: English
  quote_policy: summarized
