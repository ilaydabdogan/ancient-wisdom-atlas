  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says a woman is protected by her sire in childhood, by her husband
    in youth, and by her sons in old age, and that she does not deserve freedom at
    any period of life.
  category: relationship
  evidence_refs:
  - ev:9
