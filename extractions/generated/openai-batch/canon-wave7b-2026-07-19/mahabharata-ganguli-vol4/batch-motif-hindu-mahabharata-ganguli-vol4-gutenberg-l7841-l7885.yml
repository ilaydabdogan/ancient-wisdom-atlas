canonical_text:
  quote: ''
  summary: Bhishma addresses a king and cites ancient authorities concerning marriage,
    women, household prosperity, protection, and duty. The passage says a maiden is
    not sold when her kin take no dowry; she should be respected, kindly treated,
    and adorned by her kin. It links respect for women with divine joy, fruitful acts,
    offspring, social order, prosperity, and heaven, while linking women's grief and
    curses with household ruin. It cites Manu and a princess of Janaka's house as
    authorities for women being protected by male relatives, serving husbands, and
    being identified with prosperity.
  language: English
  quote_policy: summarized
