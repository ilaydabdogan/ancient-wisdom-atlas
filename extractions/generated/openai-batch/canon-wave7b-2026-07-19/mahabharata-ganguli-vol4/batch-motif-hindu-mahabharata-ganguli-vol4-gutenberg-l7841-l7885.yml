  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Manu is said to have made women over to the care and protection of men on
    the eve of his departure for Heaven, giving several characterizations of women
    and then saying women deserve honour.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Men are told to honour, serve, worship, and bend their wills before women;
