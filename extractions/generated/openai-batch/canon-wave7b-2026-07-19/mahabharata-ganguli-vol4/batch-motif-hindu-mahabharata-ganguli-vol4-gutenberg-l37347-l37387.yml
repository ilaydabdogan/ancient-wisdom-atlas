canonical_text:
  quote: ''
  summary: After renewed lamentation among the Kuru women, Gandhari petitions Vyasa
    to use his ascetic power to show Dhritarashtra his dead children in the other
    world and to relieve the grief of the royal family. Kunti then privately thinks
    of her secret-born son with solar effulgence, and Vyasa perceives her grief and
    invites her to speak.
  language: English
