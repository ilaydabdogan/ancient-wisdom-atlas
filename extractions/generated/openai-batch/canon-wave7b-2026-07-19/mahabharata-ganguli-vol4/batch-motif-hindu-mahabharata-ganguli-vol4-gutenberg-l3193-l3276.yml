canonical_text:
  quote: This is the highest Mystery.
  summary: Upamanyu tells Krishna that he will recite sacred names and a hymn of Mahadeva.
    He presents the names as Vedic, Brahma-derived, associated with Rishis and Tandi,
    restricted to faithful devotees, purifying of sin, salvific at death, and transmitted
    from Brahma's region through heaven to Earth.
  language: English
  quote_policy: quoted
