  quote: ''
  summary: 'The passage consists of translator/commentator notes explaining doctrinal
    and ritual terms: the body as the wheel of Time and ocean of delusion, Prakriti
    as source of identity-knowledge, hierarchical statements about Brahman and Vishnu,
    wheel imagery for household attachment, student and ascetic life rules, ritual
    food offerings, and the path toward knowledge of the self through piety and yoga.'
  language: English
  quote_policy: summarized
