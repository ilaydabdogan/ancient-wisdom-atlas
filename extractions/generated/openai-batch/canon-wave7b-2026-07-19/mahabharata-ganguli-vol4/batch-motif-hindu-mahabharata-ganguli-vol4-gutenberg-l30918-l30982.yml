canonical_text:
  quote: It is impossible to transgress destiny by either intelligence or might.
  summary: Krishna departs for Dwaraka after affectionate farewells from the Bharata
    princes and Arjuna. Auspicious phenomena accompany his car. In a water-poor desert
    he meets the ascetic Utanka, who asks whether Krishna has reconciled the Kurus
    and Pandavas. Krishna reports that he tried for peace, failed, and that most of
    the Kauravas and their kin have died, leaving only the five Pandavas. Utanka angrily
    threatens to curse Krishna for not preventing the destruction. Krishna asks Utanka
    to hear his explanation and teaching about the soul before uttering a curse, warning
    that Utanka's penances should not be wasted.
  language: English
  quote_policy: quoted
