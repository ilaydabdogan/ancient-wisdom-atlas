canonical_text:
  quote: ''
  summary: After consoling words from a celestial Rishi cheer Dhritarashtra and the
    assembly, the narrative describes the sorrow in Hastinapura after Dhritarashtra's
    retirement to the forest. Citizens and Brahmanas wonder how the aged blind king,
    Gandhari, Kunti/Pritha, Vidura, and the son of Gavalgani will live in the woods.
    The Pandavas grieve for their mother and elders, lose pleasure in sovereignty
    and study, and remember the slaughter of Abhimanyu, Karna, Draupadi's sons, and
    other friends. Draupadi and Subhadra are bereaved, while the sight of Parikshit
    sustains the elders' lives.
  language: English
  quote_policy: summarized
