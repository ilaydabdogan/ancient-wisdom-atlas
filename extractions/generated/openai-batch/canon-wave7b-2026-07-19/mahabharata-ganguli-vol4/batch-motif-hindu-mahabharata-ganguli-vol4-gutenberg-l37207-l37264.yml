canonical_text:
  quote: ''
  summary: Vaisampayana narrates that, after the Pandavas sit down, Vyasa questions
    Dhritarashtra about his forest life, penances, grief, purity of mind, and the
    conduct of Gandhari and Kunti. Vyasa then explains Vidura’s identity with Dharma,
    Dharma’s relation to Yudhishthira, Vidura’s entry into Yudhishthira, and promises
    to show Dhritarashtra an unprecedented ascetic feat to dispel his doubts.
  language: English
  quote_policy: summarized
