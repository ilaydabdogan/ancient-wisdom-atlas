  summary: Rishis ask which duty is best, noting many contradictory doctrines and
    practices among deities and Brahmanas. They say their understanding is confused
    and ask the foremost deity to declare what is good and the cause of the connection
    between Kshetrajna and Nature. The creator of the worlds answers their question.
