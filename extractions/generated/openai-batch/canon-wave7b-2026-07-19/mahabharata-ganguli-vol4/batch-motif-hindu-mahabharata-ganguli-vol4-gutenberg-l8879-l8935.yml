canonical_text:
  quote: ''
  summary: Chyavana, a Rishi of Bhrigu's line, gives away wealth from Kusika's treasury
    while the king remains compliant. Delighted by the royal couple's conduct, Chyavana
    unharnesses them, heals their goad wounds and fatigue, offers a boon, and tells
    them to return to the Ganga bank the next day. Kusika reports that he and his
    wife are free of anger, restored to youth and beauty, and healed by the Rishi's
    grace. The king returns to his city and later Chyavana transforms the Ganga-side
    wood into a jewel-filled retreat through Yoga-power.
  language: English
  quote_policy: summarized
