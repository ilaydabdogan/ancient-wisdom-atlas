canonical_text:
  quote: ''
  summary: 'Skanda declares two religious duties: a three-day body-smearing with earth
    taken from the horns of a blue bull followed by ablution, and a full-moon offering
    of cooked food mixed with honey in a copper vessel to the rising moon. Vishnu
    describes the merits of hearing, reading, and reciting such religious mysteries.
    Bhishma identifies the teachings as divine mysteries promulgated by Vyasa, declares
    their value, and restricts their transmission to qualified hearers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Skanda instructs that a person should take a little earth from the horns of
    a blue-complexioned bull, smear the body with it for three days, and then perform
    ablutions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The blue-bull earth and ablution act is said to wash away stains and evil,
    lead to sovereign sway hereafter, and make the person celebrated for heroism in
    repeated births.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Skanda instructs that cooked food mixed with honey should be placed in a copper
    vessel and offered as Vali to the rising full moon on the evening of the full-moon
    day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sadhyas, Rudras, Adityas, Viswedevas, twin Aswins, Maruts, and Vasus accept
    the full-moon offering, and Soma and the ocean are said to increase by it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vishnu says that a faithful, attentive, and non-malicious listener to mysteries
    of religion and duty preserved by deities and Rishis does not succumb to evil
    and becomes free from fear.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vishnu says that reading, reciting, or hearing the sections on auspicious
    duties and their mysteries grants the merits of actual performance and prevents
    sin and faults from overpowering the person.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Vishnu says that the deities and Pitris consume inexhaustible Havya and Kavya
    from such a person, and that full- or new-moon recitation to foremost Brahmanas
    grants steadiness in duty, beauty, prosperity, favor from Rishis, deities, and
    Pitris, and cleansing from non-heinous sins.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Bhishma says these teachings are mysteries of religion and duty dwelling in
    the breasts of the deities, respected by the gods, promulgated by Vyasa, and declared
    by him for the king's benefit.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bhishma says this knowledge is worth more than the earth filled with riches
    and should not be imparted to people described as faithless, atheistic, fallen
