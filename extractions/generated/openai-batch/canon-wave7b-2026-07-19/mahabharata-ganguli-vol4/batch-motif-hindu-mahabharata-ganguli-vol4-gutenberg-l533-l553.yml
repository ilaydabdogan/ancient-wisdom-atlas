canonical_text:
  quote: to a householder there is no higher divinity than the guest
  summary: Bhishma concludes an account in which Vasava approaches a Brahmana after
    Death and many cosmic and mental powers have been conquered. He teaches that a
    guest is the highest divinity for a householder, that honoring a guest brings
    extraordinary merit, and that failure to honor a deserving guest causes loss of
    virtue and acquisition of sin. He says the story of Sudarsana and the householder’s
    conquest of Death grants fame, longevity, removal of evil, and blessed regions
    to those who hear or recite it.
  language: English
  quote_policy: quoted
