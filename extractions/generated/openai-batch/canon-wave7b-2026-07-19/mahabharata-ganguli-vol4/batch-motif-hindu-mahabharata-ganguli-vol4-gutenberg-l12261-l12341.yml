canonical_text:
  quote: ''
  summary: Bhishma recounts performing Santanu's Sraddha at Gangadwara, where an adorned
    arm rises from the earth through Kusa grass. He refuses to place the obsequial
    cake in the visible hand and instead follows the scriptural rule of placing it
    on Kusa grass. The Pitris later appear in a dream, praise his adherence to scripture,
    and instruct him to make gifts of gold, which they describe as cleansing for ancestors
    and descendants. Bhishma then introduces an old account of Rama, son of Jamadagni,
    who after exterminating the Kshatriyas repeatedly performs a Horse-sacrifice but
    still seeks further purification from sages, deities, and named Rishis.
  language: English
  quote_policy: summarized
