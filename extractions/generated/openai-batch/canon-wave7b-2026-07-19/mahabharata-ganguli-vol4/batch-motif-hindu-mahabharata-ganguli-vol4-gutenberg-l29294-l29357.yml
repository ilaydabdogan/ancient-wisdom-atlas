canonical_text:
  quote: Even this body is not mine, or the whole Earth is mine.
  summary: A Brahmana recounts an old discourse in which King Janaka tries to banish
    a Brahmana. The Brahmana asks Janaka to define the borders of his dominion. Janaka
    reflects that he cannot find anything that is truly his, yet through non-desire
    and mastery of senses he can also say that all is under his dominion. The Brahmana
    reveals himself as Dharma, saying he came to examine Janaka and praising him with
    the image of an irreversible wheel.
  language: English
  quote_policy: quoted
