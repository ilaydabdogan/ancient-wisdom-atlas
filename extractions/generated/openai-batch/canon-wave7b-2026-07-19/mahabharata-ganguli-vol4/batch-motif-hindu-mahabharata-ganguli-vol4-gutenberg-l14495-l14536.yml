  summary: In a framed dialogue, Yudhishthira asks Bhishma about the gift of light,
    its origin, and its merits. Bhishma introduces an old narrative in which Suvarna
    asks Manu about worship of deities with flowers and scents. Manu then introduces
    another old discourse in which Sukra visits Vali, who asks about the merit of
    giving flowers, incense, and lamps.
