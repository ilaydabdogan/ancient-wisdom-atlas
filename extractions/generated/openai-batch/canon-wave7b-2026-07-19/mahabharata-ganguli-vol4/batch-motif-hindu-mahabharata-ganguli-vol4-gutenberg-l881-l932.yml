canonical_text:
  quote: ''
  summary: An unnamed speaker gives a series of ancient examples in which named kings,
    sages, warriors, and the Pandavas rise, fall, are transformed, are checked by
    gods, or regain status according to deeds, curses, intercession, truthfulness,
    or valor. The speaker then argues that destiny is effective only when joined to
    individual exertion, using images of fire fanned by wind and a lamp extinguished
    when oil diminishes, and concludes that heaven is attained through the combined
    aid of destiny and exertion.
  language: English
  quote_policy: summarized
