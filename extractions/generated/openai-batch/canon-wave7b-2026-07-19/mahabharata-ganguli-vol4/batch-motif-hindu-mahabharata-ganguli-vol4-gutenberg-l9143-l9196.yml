canonical_text:
  quote: ''
  summary: Chyavana tells king Kusika why he had come to exterminate Kusika's race,
    then foretells a destined conflict between the Kshatriyas and the Bhargavas, the
    rise of Urva with world-consuming wrath, the transmission of martial science through
    Richika to Jamadagni, and a marriage and exchange of descendants linking the Bhrigu
    and Kusika lines. Kusika asks that his race attain Brahmanahood and righteousness;
    Chyavana grants the boon, and Bhishma states that the births of Rama and Viswamitra
    occurred as foretold.
  language: English
  quote_policy: summarized
