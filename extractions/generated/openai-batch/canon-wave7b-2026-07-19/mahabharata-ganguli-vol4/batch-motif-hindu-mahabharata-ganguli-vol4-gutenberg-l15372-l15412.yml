canonical_text:
  quote: In my opinion, there is no penance higher than fast.
  summary: King Bhagiratha recounts gifts, sacrifices, and vows, but says that his
    attainment of a region of superior felicity came through the vow of fast. The
    vow had been kept secret by Indra, learned by Sukra/Usanas through spiritual sight,
    and made known to the universe. Bhishma then tells Yudhishthira to observe fasting
    and to honor Brahmanas.
  language: English
  quote_policy: quoted
