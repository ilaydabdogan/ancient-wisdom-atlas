canonical_text:
  quote: ''
  summary: 'A hymn addresses a deity through a series of identifications and attributes:
    cosmic devourer, seed and pervader of the universe, sacrifice, oceanic fire, wind
    and fire, time, life-stages, inner presence in creatures, dissolver and liberator,
    phallic emblem, wanderer, serpent/Sesha, cave-dweller, Guha, Durvasas, Vasava,
    Himavat, judge of karmic joy and grief, bearer of snake garments, and giver of
    wishes.'
  language: English
  quote_policy: summarized
