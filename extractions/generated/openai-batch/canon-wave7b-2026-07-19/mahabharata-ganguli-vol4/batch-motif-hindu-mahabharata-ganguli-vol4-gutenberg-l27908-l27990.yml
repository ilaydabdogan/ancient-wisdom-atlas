canonical_text:
  quote: ''
  summary: Janamejaya asks what Vasudeva and Dhananjaya did after the Pandavas recovered
    and pacified their kingdom. Vaisampayana narrates that Krishna and Arjuna spent
    time in pleasure, sacred travel, remembrance of war, and recitation. Krishna consoles
    the bereaved Arjuna, praises Yudhishthira's righteous sovereignty, and asks Arjuna
    to announce his intended return to Dwaravati. Arjuna sorrowfully assents.
  language: English
  quote_policy: summarized
