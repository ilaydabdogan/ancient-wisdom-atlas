canonical_text:
  quote: ''
  summary: A series of named ascetics and women pronounce conditional imprecations
    against whoever stole the lotus-stalks. Sunahsakha instead pronounces a desirable
    result for the remover, leading the Rishis to identify him as the one who took
    them. Sunahsakha admits causing the disappearance to test and protect them, says
    he slew the fire-born Yatudhani sent by king Vrishadarbhi, reveals himself as
    Vasava, and announces that the ascetics have won eternal regions because they
    are free from cupidity.
  language: English
  quote_policy: summarized
