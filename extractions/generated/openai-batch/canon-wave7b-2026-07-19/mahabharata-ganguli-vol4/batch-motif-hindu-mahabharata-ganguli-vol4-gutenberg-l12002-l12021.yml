canonical_text:
  quote: ''
  summary: The passage says that qualified teachers should impart the Gomati Mantras
    to disciples only amid sacred fires, cows, or assemblies of Brahmanas. It prescribes
    a three-night fast for receiving knowledge of their meaning and states that worship
    of these mantras can grant desires such as a son, wealth, or a good husband. It
    further says that gratified cows can grant every wish, are essential to sacrifices,
    and are unsurpassed. Bhishma then says that Suka began worshipping cows daily
    after being instructed by his sire, and he exhorts his listener to do likewise.
  language: English
  quote_policy: summarized
