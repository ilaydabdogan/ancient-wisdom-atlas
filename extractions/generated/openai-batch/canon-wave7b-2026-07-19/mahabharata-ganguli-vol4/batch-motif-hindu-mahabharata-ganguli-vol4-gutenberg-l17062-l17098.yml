canonical_text:
  quote: One should never do that to another which one regards as injurious to one's
    own self.
  summary: Yudhishthira asks Vrihaspati which among six religious practices has the
    greatest merit. Vrihaspati answers that all six are meritorious, but teaches that
    universal compassion, control of lust, wrath, and cupidity, non-injury, and judging
    others' experiences by reference to oneself constitute righteousness and the highest
    good. He adds that injury and cherishing return upon the doer. Vaisampayana then
    reports that Vrihaspati ascended upward to Heaven.
  language: English
  quote_policy: quoted
