canonical_text:
  quote: ''
  summary: 'After Vasudeva stops speaking, the Island-born Krishna urges Yudhishthira
    to recite a hymn of the thousand and eight names of Mahadeva, explaining that
    he once used the same hymn during austerities on Meru to obtain a son and fulfillment
    of wishes. A series of Rishis then recount benefits received from Mahadeva/Bhava/Sarva/Isana:
    Kapila received liberating knowledge; Charusirsha received a hundred sons born
    without the intervention of woman; Valmiki and Jamadagni''s son were cleansed
    of Brahmanicide; Jamadagni''s son also received weapons and invincibility; Viswamitra
    gained Brahmana status; Asita-Devala had lost merit restored; and Gritsamada,
    cursed by Vasishtha into deer-form after faulty ritual recitation, sought Maheswara
    and received health, immortality, freedom from grief, preserved friendship with
    Indra, and increased sacrifices.'
  language: English
  quote_policy: summarized
