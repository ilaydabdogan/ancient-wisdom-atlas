canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma why sons born to a Brahmana father by wives
    of different orders receive unequal shares, and how a son of a Sudra woman can
    receive a tenth when declared disentitled. Bhishma answers by setting out ranked
    household and inheritance rules: the Brahmana wife is foremost and should attend
    to the husband''s ritual and personal needs; the son of the Brahmana wife outranks
    sons of Kshatriya and Vaisya wives; and the Kshatriya''s royal and protective
    function gives the son of a Kshatriya wife precedence over the son of a Vaisya
    mother. Yudhishthira then asks for rules applying to others.'
  language: English
  quote_policy: summarized
