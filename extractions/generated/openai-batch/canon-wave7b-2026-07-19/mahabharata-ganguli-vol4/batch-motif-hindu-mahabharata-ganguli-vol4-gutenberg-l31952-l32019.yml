canonical_text:
  quote: The royal Parikshit... lay still and motionless, for life he had not.
  summary: Krishna/Vasudeva returns to the Kuru capital with Vrishni companions at
    the time fixed for the horse-sacrifice. During his stay, Parikshit is born dead
    after being afflicted by Aswatthaman's Brahma weapon. Kunti, accompanied by grieving
    women of the Pandava household, appeals to Krishna as protector of Pandu's race
    and asks him to fulfill his vow to revive the child. She stresses that the Pandavas'
    lineage, funerary offerings, and Abhimanyu's words about his son's future depend
    on the child. Kunti and the women fall to the earth in grief, and Krishna raises
    and comforts her.
  language: English
  quote_policy: quoted
