canonical_text:
  quote: ''
  summary: Arjuna follows the sacrificial horse as it turns back. Yudhishthira learns
    of Arjuna's safe return and, at an auspicious time in Magha, orders Bhima to arrange
    a site for the Horse-sacrifice. Bhima selects and prepares a splendid sacrificial
    compound with residences for kings, Brahmanas, and other guests. Kings, Brahmanas,
    Munis, disciples, engineers, and attendants gather; Yudhishthira provides hospitality
    and rejoices when the arrangements are complete.
  language: English
  quote_policy: summarized
