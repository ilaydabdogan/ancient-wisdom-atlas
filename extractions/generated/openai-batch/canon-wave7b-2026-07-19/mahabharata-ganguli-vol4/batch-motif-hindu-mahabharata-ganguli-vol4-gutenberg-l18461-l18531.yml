canonical_text:
  quote: ''
  summary: Named speakers give ritual and household prescriptions concerning lunar
    offerings, sacred fire, tree and tooth-brush taboos, household disorder, fertility
    observance under a tree, hospitality, Sraddha purity, inauspicious domestic objects,
    and the superiority of purity of heart over large sacrifices or austerities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the full moon, a person is instructed to face the bright orb and offer
    a palmful of water and Akshata, rice-grains with ghee; the act is equated with
    adoring sacred fire and pouring libations on the three principal fires.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cutting a large tree, killing even a single leaf, or chewing a tooth-brush
    on the new moon is described as sinful or injurious to the moon deity, and as
    causing deities and Pitris to reject or resent the person's offerings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A house with scattered vessels, seats, and beds, and in which women are beaten,
    is described as sinful; deities and Pitris leave it without accepting offerings.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man who stands every night for a full year under a Karanjaka tree with a
    lamp and Suvarchala roots in hand is said to have increasing offspring.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hospitality to guests, giving lamps in a sacrifice hall, avoiding day sleep
    and flesh or food, not injuring cows and Brahmanas, and reciting names of sacred
    waters are presented as duties producing inexhaustible merit when practiced with
    faith.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Sraddha and other rites, the sight or nearness of specified ritually impure
    women is said to prevent divine acceptance and ancestral gratification; white
    raiment, bodily and mental purity, Brahmana benedictions, and recitation of the
    Bharata are prescribed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Broken utensils, broken bedsteads, cocks, dogs, and trees growing inside dwellings
    are identified as inauspicious; Kali is said to be in a broken utensil, loss of
    wealth in a broken bedstead, and snakes and scorpions under tree roots.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: A person without a pure heart is said to go to Hell despite great sacrifices
    or austerities, while a poor Brahmana who gives a small amount of powdered barley
    with a pure heart attains the region of Brahman.
  category: relationship
  evidence_refs:
  - ev:8
