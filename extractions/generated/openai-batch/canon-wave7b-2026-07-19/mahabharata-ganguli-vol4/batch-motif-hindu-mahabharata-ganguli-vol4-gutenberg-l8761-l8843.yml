canonical_text:
  quote: ''
  summary: 'Bhishma narrates an episode in which the Rishi Chyavana repeatedly makes
    severe and strange demands of King Kusika and his queen. The couple continue to
    serve him without anger: pressing his feet through another long sleep, rubbing
    him with oil for a bath, offering elaborate food, remaining calm when he burns
    the offerings, and finally agreeing to yoke themselves to a battle-car to bear
    him where he commands.'
  language: English
  quote_policy: summarized
