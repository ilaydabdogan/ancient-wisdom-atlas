canonical_text:
  quote: ''
  summary: Vaisampayana recounts a former sacrifice of Sakra in which animals were
    to be slaughtered. Compassionate Rishis object that animal slaughter is not righteous
    sacrifice and propose seeds of grain kept for three years. Sakra rejects their
    words, a dispute arises over sacrifice with living creatures versus immobile objects,
    and king Vasu gives a careless false answer, after which he enters the nether
    regions. The passage then teaches that gifts and sacrifices made with unrighteous
    wealth fail, while lawful modest gifts, compassion, truth, ascetic discipline,
    and other virtues lead to merit and Heaven.
  language: English
  quote_policy: summarized
