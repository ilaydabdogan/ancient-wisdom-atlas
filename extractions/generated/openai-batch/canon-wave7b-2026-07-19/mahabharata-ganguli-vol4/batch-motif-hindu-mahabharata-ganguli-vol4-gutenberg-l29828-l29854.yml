canonical_text:
  quote: ''
  summary: Brahma describes Mahat, the Great Soul, as springing first from the unmanifest
    and as the source of qualities. He identifies this principle by names including
    Intelligence, Vishnu, Jishnu, Sambhu, Understanding, and related faculties. The
    Being is described as omnipresent, indwelling in all hearts, effulgent, undecaying,
    and the highest goal. Knowledge of this Being frees a learned person from delusion,
    while disciplined yogic practitioners free from attachment attain Greatness and
    transcend ordinary understanding.
  language: English
  quote_policy: summarized
