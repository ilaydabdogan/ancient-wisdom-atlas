    of perception, fame, courage, and memory.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Knowing this teaching is said to prevent a learned Brahmana from encountering
    delusion, and understanding the Great Soul is said to free a person from delusion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Being is described as having hands, feet, and ears on every side and as
    pervading everything in the universe.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
