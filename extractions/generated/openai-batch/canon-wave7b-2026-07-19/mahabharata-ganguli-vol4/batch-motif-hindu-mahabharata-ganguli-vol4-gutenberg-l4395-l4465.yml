canonical_text:
  quote: ''
  summary: 'Vasudeva recounts Upamanyu’s teaching that impure persons cannot attain
    Isana, while purified devotees of the Supreme Deity, Rudra, Bhava, Siva, or Mahadeva
    are freed from sin, gain heaven, fearlessness, and emancipation from rebirth.
    Krishna or Vishnu then addresses Yudhishthira with a long hymn-like catalogue
    of deities, cosmic forces, scriptures, sacrifices, beings, qualities, and philosophies
    said to spring from a creator or subtle Brahma. The passage concludes by describing
    the rewards of reciting the hymn: sacrificial merit, caste-specific benefits,
    purification from sin, devotion to Rudra, and long residence in heaven.'
  language: English
  quote_policy: summarized
