canonical_text:
  quote: ''
  summary: Bhishma narrates Devasarman's explanation to Vipula that the two and six
    figures Vipula saw were Day and Night and the six Seasons, cosmic witnesses who
    know hidden deeds. Devasarman says Vipula hid part of the truth but had not sinned
    in protecting Ruchi, and he ascends to heaven with Ruchi and Vipula. Bhishma frames
    the tale as one earlier told by Markandeya on the Ganga and follows it with a
    didactic discourse about protecting women, contrasting virtuous women with sinful
    women.
  language: English
  quote_policy: summarized
