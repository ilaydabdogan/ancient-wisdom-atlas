canonical_text:
  quote: ''
  summary: Utanka asks Kesava to teach faultless Adhyatma. Vasudeva replies by identifying
    himself as the source, refuge, and indwelling soul of beings and categories of
    existence; as identical with Vedic duty, Om, and sacrificial elements; as the
    parent of Dharma; and as one who takes birth in diverse forms to uphold Righteousness.
    He also recounts his human appeal to the Kauravas, their refusal, their righteous
    death in battle, and the Pandavas' fame.
  language: English
  quote_policy: summarized
