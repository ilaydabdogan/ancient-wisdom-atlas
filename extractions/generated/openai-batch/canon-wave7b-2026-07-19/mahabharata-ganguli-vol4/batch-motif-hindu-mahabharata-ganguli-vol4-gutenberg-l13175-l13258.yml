canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma what kind of Brahmanas should receive offerings
    at Sraddhas. Bhishma answers with rules for examining Brahmanas, excluding those
    who pollute the ritual line, and describing consequences when offerings are given
    to improper recipients: offerings are diverted to Rakshasas, Asuras, or Pisachas,
    become defiled substances, fail to bear fruit, or harm the Pitris. He also prescribes
    concealing or hedging the Sraddha place and strewing sesame seeds to protect the
    offerings.'
  language: English
  quote_policy: summarized
