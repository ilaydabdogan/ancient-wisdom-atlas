canonical_text:
  quote: ''
  summary: A king offers ascetics extensive gifts of animals, food, villages, and
    jewels, but the Rishis reject royal gifts as spiritually dangerous. The king's
    ministers then try to induce acceptance by hiding gold in figs, which Atri detects
    and refuses. Named ascetics give teachings against cupidity and in favor of righteousness
    and non-acceptance. After the Rishis leave, the king becomes angry, performs a
    rite with ghee and mantras on his sacred fire, and a terrifying form named Yatudhani
    arises and asks what she should do.
  language: English
  quote_policy: summarized
