canonical_text:
  quote: ''
  summary: Maheswara tells the goddess that generous hospitality, public benefactions,
    gifts, humility, reverence toward worthy persons, and kind speech lead to Heaven
    and favorable human rebirths after merit is exhausted. Refusal to give, cupidity,
    arrogance toward preceptors and seniors, and humiliating the worthy lead to Hell
    and then impoverished or low human rebirths. The passage begins a further warning
    about fierce persons who injure beings, but the excerpt breaks off before the
    consequence is stated.
  language: English
  quote_policy: summarized
