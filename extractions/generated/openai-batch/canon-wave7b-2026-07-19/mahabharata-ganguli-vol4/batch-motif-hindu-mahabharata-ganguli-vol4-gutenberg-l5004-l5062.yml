canonical_text:
  quote: ''
  summary: Bhishma answers Yudhishthira’s questions about righteousness, life conduct,
    and worthy recipients of gifts. He praises abstention, self-restraint, and renunciation;
    gives rules about wealth, righteousness, pleasure, and nonattachment; lists grave
    offences; and describes the qualities of Brahmanas to whom gifts should be made,
    including the merit and next-world benefit of such giving.
