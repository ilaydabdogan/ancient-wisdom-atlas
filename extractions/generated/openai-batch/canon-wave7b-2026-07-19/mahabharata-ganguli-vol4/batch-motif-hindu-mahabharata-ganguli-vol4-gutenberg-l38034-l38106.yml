canonical_text:
  quote: ''
  summary: Narada explains that Dhritarashtra died on the banks of Ganga after his
    own sacred sacrificial fire, abandoned in the forest, spread into a conflagration.
    He tells Yudhishthira to perform water rites. Yudhishthira, his brothers, household
    women, and many inhabitants go to Ganga, offer water oblations for Dhritarashtra,
    Gandhari, and Pritha/Kunti, arrange cremation rites, and later perform Sraddhas
    with abundant gifts. Narada comforts Yudhishthira and departs; the Asramavasika
    Parvan concludes with an instruction to hear the section and feed Brahmanas.
  language: English
  quote_policy: summarized
