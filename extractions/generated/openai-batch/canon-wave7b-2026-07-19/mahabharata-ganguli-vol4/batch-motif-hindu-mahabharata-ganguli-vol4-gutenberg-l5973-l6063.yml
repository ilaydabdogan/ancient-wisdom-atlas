canonical_text:
  quote: ''
  summary: The passage closes a praise of Ganga by saying that hearing or reciting
    it cleanses sin. Yudhishthira then asks Bhishma how a Kshatriya, Vaisya, or Sudra
    might acquire the status of a Brahmana. Bhishma replies that Brahmana status cannot
    be acquired by the other three orders in a single life, but only after many births,
    and cites the old story of Matanga and a she-ass. Matanga, raised with Brahmana
    rites, is sent to collect sacrificial requisites. When a young ass drawing his
    car turns toward its mother, Matanga strikes it. The she-ass rebukes him, calls
    him a Chandala, and reveals that he was begotten by a Sudra barber upon a Brahmana
    woman. Matanga returns home, resolves to perform severe penances to gain Brahmana
    status, goes to the forest, and through austerity troubles the deities. Indra
    appears and offers boons; Matanga asks for Brahmana status.
  language: English
  quote_policy: summarized
