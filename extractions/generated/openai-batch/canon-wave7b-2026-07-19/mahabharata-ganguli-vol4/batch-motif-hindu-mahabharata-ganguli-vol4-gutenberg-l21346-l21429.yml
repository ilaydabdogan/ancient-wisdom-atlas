  quote: ''
  summary: The passage is a sequence of epithets for an unnamed supreme divine figure
    addressed as “He.” It describes him as concealed from worldly persons, regulator
    of time and the Yugas, conveyor of sacrificial libations, upholder and rescuer
    of Earth, supporter and dissolver of the universe, refuge in the waters, giver
    of success and desires, source and teacher of the Veda, protector of worshippers,
    punisher of foes and the unrighteous, multiform manifestation, and wielder of
    illusion.
  language: English
  quote_policy: summarized
