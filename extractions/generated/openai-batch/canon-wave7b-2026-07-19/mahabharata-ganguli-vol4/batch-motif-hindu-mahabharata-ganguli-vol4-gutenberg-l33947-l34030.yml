canonical_text:
  quote: ''
  summary: A Brahmana gives his daughter-in-law's share of barley to a guest. The
    guest, revealed as the deity of Righteousness in human form, praises the gift,
    reports celestial acclaim, teaches that lawful and devoted gifts surpass large
    sacrifices, and summons the Brahmana and his family to Heaven in a celestial car.
    After their ascent, a first-person narrator emerges from a hole amid traces of
    the barley, water, and celestial flowers.
  language: English
  quote_policy: summarized
