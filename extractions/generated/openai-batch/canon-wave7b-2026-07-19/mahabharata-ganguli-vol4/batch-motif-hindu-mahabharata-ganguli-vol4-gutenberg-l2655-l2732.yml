canonical_text:
  quote: ''
  summary: Siva, pleased with Upamanyu's devotion after testing him, offers boons.
    Upamanyu praises Siva as supreme source of Brahma, Vishnu, and Rudra, and as the
    one who withdraws the universe at cosmic dissolution. Upamanyu asks for enduring
    devotion, knowledge of time, milk-food for his circle, and Siva's presence at
    his retreat. Siva grants freedom from misery, youth, knowledge, an appearing ocean
    of milk, eternal devotion, future companionship, divine presence, and then disappears.
    Upamanyu tells Krishna that the celestial beings and abundant all-season vegetation
    at the retreat exist through Siva's grace.
  language: English
  quote_policy: summarized
