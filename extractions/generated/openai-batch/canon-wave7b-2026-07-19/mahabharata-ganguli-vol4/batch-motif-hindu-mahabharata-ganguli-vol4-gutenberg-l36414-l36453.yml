canonical_text:
  quote: ''
  summary: Dhritarashtra fixes the time of his departure for the woods, summons the
    Pandavas, has rites performed, takes up his daily worshipped fire, changes into
    deer-skins and bark, honors his mansion and servants, and leaves. The Pandavas,
    royal women, named followers, and citizens grieve publicly; Kunti supports Gandhari,
    and Dhritarashtra walks behind Gandhari with his hand on her shoulder. The citizens'
    distress is compared to their earlier distress at the Pandavas' departure after
    the dice defeat.
  language: English
  quote_policy: summarized
