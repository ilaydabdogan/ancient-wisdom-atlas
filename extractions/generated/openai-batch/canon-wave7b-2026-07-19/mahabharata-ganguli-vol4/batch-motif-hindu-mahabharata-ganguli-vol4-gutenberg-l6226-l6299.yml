canonical_text:
  quote: ''
  summary: 'Yudhishthira asks Bhishma how Vitahavya, a king, came to acquire Brahmana
    status. Bhishma begins a dynastic account: from Manu and Saryati came Haihaya,
    also called Vitahavya, whose hundred warrior sons repeatedly attacked Kasi. They
    slew Haryyaswa, defeated Sudeva, and later fought Divodasa, who had fortified
    Baranasi at Indra''s command. After a thousand-day battle Divodasa lost his army
    and treasury, fled to the retreat of the sage Bharadwaja, and sought protection,
    saying that Vitahavya''s sons had destroyed his house.'
  language: English
  quote_policy: summarized
