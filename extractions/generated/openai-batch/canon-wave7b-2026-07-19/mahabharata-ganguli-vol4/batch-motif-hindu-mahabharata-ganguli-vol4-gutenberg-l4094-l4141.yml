canonical_text:
  quote: Thou art he into whom the universe enters (when it is dissolved).
  summary: 'A hymn addresses a divine being through repeated identifications: transcendent,
    self-born, ruler of deities and Asuras, cosmic totality, recipient of sacrifice,
    wielder and source of weapons, Guha, Saturn, Kuvera, Brahman, lord of mountains
    and animals, rescuer from death through Emancipation, patron of vows, and refuge
    of devotees.'
