canonical_text:
  quote: There is no gift more sacred than the gift of kine.
  summary: Vasishtha praises kine as sources of milk and ghee, instructs daily recitation
    of cow-related mantras after touching water, and describes the merit and afterlife
    rewards of gifting cows. He calls cows sacred, universal mothers, refuges of the
    universe, and supports of sacrifice. Bhishma then says that king Saudasa accepted
    the teaching, gave many cows to Brahmanas, and attained felicity after death.
  language: English
  quote_policy: quoted
