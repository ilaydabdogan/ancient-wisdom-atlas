- id: obs:1
  text: Vasishtha says kine yield milk and ghee, are sources of ghee, and are imagined
    as surrounding him on every side.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'A daily practice is prescribed: after purifying oneself by touching water,
    one should recite the mantras morning and evening to be cleansed of sins committed
    during the day.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Givers of a thousand kine are said to proceed after death to regions of Gandharvas
    and Apsaras with golden mansions, the celestial Ganga, and rivers whose water
    is milk with cheese and curds as mire or moss.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Giving hundreds of thousands of kine according to scriptural ritual is said
    to bring prosperity, heavenly honours, and felicity for paternal and maternal
    ancestors to the tenth degree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kine are described as sacred, foremost in the world, refuge of the universe,
    mothers of the deities, and proper objects for dedication in sacrifices.
  category: attribute
  evidence_refs:
  - ev:3
