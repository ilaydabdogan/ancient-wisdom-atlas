canonical_text:
  quote: ''
  summary: Sudarsana instructs Oghavati never to disregard a guest. While Sudarsana
    is away, a Brahmana asks Oghavati for hospitality and specifically demands her
    person. She remembers her husband's command and complies despite shame. Sudarsana
    returns, hears the Brahmana's explanation, refuses jealousy or anger, and declares
    that his life, wife, and possessions are dedicated to guests. A voice confirms
    his truthfulness. The Brahmana reveals himself as Dharma, says he came to test
    Sudarsana, declares that Sudarsana has conquered Mrityu, affirms Oghavati's chastity,
    and foretells her partial transformation into the river Oghavati and Sudarsana's
    attainment of higher worlds in his body.
  language: English
  quote_policy: summarized
