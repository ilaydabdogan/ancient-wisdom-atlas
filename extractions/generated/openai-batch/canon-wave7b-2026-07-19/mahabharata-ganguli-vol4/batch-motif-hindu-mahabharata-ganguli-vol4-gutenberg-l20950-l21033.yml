canonical_text:
  quote: Know that Krishna Himself, otherwise called Hari, is that Time with blood-red
    eyes and with club in hand.
  summary: Bhishma recounts the departure of Rishis, Narayana's return to Dwaraka,
    the birth of Rukmini's son identified with Kama, and then praises Krishna as supreme,
    protector of the Pandavas, source of victory, destroyer in battle, and identical
    with Time. He advises the addressed king not to grieve, to remember the teachings,
    practice duty, protect subjects, and attain heaven.
  language: English
  quote_policy: quoted
