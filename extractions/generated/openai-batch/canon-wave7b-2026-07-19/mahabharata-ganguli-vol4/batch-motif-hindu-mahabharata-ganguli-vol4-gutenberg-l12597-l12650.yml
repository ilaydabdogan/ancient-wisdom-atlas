canonical_text:
  quote: ''
  summary: The deities ask Agni/Pavaka to rescue them from the Asura Taraka by begetting
    a heroic son endowed with Agni's energy. Agni agrees, unites spiritually with
    Ganga, and causes her to conceive. Ganga becomes distressed and unable to bear
    the fiery seed, especially after an unnamed Asura roars. She tells Agni she must
    cast it off and states that their union was not bodily. Although Agni urges her
    to bear the foetus, she casts the blazing seed onto Meru; Agni then asks about
    the foetus's condition, form, complexion, and energy.
  language: English
  quote_policy: summarized
