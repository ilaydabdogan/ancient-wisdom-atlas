canonical_text:
  quote: ''
  summary: Vaisampayana narrates that the Pandavas, overwhelmed by grief and anxious
    for Kunti, Dhritarashtra, and Gandhari in the forest, resolve to visit them. Sahadeva
    and Draupadi urge the journey, and Yudhishthira orders a large, well-supplied
    royal procession toward the ascetic retreats before setting out with women, old
    men, and citizens.
  language: English
  quote_policy: summarized
