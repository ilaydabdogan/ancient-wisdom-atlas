- id: obs:1
  text: The Pandavas are described as deeply afflicted by grief and neglecting their
    kingly offices in the capital.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Pandavas speak anxiously about their mother Kunti serving Dhritarashtra
    and Gandhari in the woods.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Dhritarashtra is described as a king whose sons have been slain, without refuge,
    living with his wife in woods haunted by beasts of prey; Gandhari is described
    as following her blind lord there.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sahadeva bows to the king and says the time has come for a sojourn to the
    woods; he describes Kunti as practicing penances with matted locks, severe austerities,
    and sleeping on blades of Kusa and Kasa.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Draupadi asks when she may see Pritha/Kunti again and says the ladies of the
    royal house are ready for the journey to behold Kunti, Gandhari, and her father-in-law.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yudhishthira commands leaders to prepare an army with cars and elephants,
    conveyances, closed litters, granaries, wardrobes, treasuries, mechanics, and
    personnel for the road to the ascetic retreats on Kurukshetra.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yudhishthira allows citizens to accompany the journey, orders food supplies
    and resting structures, departs in the morning with women and old men, waits five
    days for citizens, and then proceeds toward the forest.
  category: sequence
  evidence_refs:
  - ev:6
