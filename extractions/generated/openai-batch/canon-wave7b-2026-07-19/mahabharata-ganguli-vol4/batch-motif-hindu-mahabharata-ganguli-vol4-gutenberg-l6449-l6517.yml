canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the merit of granting protection to creatures
    that seek refuge. Bhishma recounts an old story in which a pigeon pursued by a
    hawk takes shelter in King Vrishadarbha's lap. The king vows to protect the pigeon,
    even at the cost of his kingdom or life. The hawk argues that the pigeon is its
    ordained food and that the king should also consider the hawk's hunger. The king
    offers other animals as food, but the hawk refuses and asks for flesh from the
    king's own body equal in weight to the pigeon.
  language: English
  quote_policy: summarized
