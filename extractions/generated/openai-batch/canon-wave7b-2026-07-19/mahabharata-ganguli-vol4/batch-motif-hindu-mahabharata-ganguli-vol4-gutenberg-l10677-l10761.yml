canonical_text:
  quote: ''
  summary: Bhishma recounts the story of King Nriga, who became a huge lizard in a
    covered well after an unresolved wrongful transfer of a Brahmana's cow. Young
    Yadus discover the lizard while looking for water and bring Krishna, who rescues
    it. Nriga explains his accidental fault, Yama's afterlife judgment, his thousand-year
    punishment, and his rescue by Krishna. With Krishna's permission, Nriga ascends
    to heaven in a celestial car, and Vasudeva states a warning against taking Brahmana
    property.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma introduces the narrative as a calamity that befell King Nriga because
    of spoliation of something belonging to a Brahmana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young men of Yadu's race search for water and find a large well covered with
    grass and creepers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After clearing the well mouth, the young men see a very large lizard inside
    the well and fail to rescue it with cords and leathern tongs.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young men report the lizard to Krishna, and Krishna goes to the well,
    takes out the lizard, and asks who it is.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The lizard says it is identical with the soul of King Nriga, who had performed
    many sacrifices.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Krishna asks why Nriga came to such distress despite many righteous acts and
    many gifts of cattle to Brahmanas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nriga says that a cow belonging to a Brahmana who worshipped his domestic
    fire escaped into Nriga's herd and was unknowingly given by Nriga to another Brahmana.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The original owner and the recipient both dispute over the cow and come before
    Nriga, one identifying him as the giver and the other accusing him of robbery.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Brahmana recipient refuses to return the cow because it suits his household,
    yields sweet milk, and nourishes his recently weaned child.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The original owner refuses substitutes including many cattle, gold, silver,
    horses, and cars, and demands the same cow.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: After death, Nriga is taken before Yama, who says that Nriga committed a small
    unconscious sin by not rigidly keeping his oath to protect others' property and
    by taking what belonged to a Brahmana.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Nriga chooses to undergo punishment before enjoying later happiness.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Nriga falls to earth head-down into the well, becomes a creature of an intermediate
    order, and retains memory.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Yama declares that Janardana, son of Vasudeva, will rescue Nriga after a thousand
    years and that Nriga will then attain regions of inexhaustible felicity acquired
    by righteous acts.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: After Krishna rescues him, Nriga asks permission to ascend to heaven; Krishna
    permits him, and Nriga bows, mounts a celestial car, and proceeds to heaven.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: Vasudeva recites that no one should consciously appropriate anything belonging
    to a Brahmana, and that the property of a Brahmana destroys the taker as the Brahmana's
    cow destroyed Nriga.
  category: speech
  evidence_refs:
  - ev:9
