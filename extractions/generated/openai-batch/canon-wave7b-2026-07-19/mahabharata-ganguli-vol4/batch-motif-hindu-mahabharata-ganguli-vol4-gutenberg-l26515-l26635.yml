  summary: A series of footnotes explains ascetic classifications and practices, forest
    austerity, birth and caste status, food-related rebirth consequences, social hierarchy,
    sacred rivers and waters, Gauri as Earth, Parvati and Siva in discourse, marriage
    as pious union, Vishnu as Trivikrama, hidden divine knowledge, the wish for Krishna
    to have a superior son, royal punishment, Nara-Narayana penance on Himavat, and
    recurring creation and destruction.
