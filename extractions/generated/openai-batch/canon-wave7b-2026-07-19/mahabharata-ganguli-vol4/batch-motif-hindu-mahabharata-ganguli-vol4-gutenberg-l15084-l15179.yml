canonical_text:
  quote: ''
  summary: In a dialogue, Gautama tells Dhritarashtra that if he goes to a series
    of beautiful and exalted regions, Gautama will follow him and force him to yield
    an elephant. Dhritarashtra answers by describing the kinds of ethical, ascetic,
    learned, generous, sacrificial, or royal persons who attain each region, repeatedly
    saying that he will proceed to a higher region and not to the named one. The passage
    moves through Uttara-Kurus, Soma's abode, regions near the Sun deity, Varuna's
    abode, Indra's regions, Prajapati regions, and finally the regions of kine.
  language: English
  quote_policy: summarized
