canonical_text:
  quote: By that path Utanka entered the world of Nagas.
  summary: Indra empowers Utanka’s walking staff with thunder, opening the Earth to
    the Naga regions. Utanka enters the splendid Naga world seeking earrings, encounters
    a black steed revealed as Jatavedas, the deity of fire, and follows its instruction.
    Fire and smoke terrify the Nagas, who honor Utanka and return the earrings. Utanka
    returns to Gautama’s asylum and gives them to his preceptor’s wife.
  language: English
  quote_policy: quoted
