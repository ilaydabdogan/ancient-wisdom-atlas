canonical_text:
  quote: ''
  summary: Bhishma reports a chain of teachings on meritorious gifts. Narada's discourse
    is transmitted through Devaki, and Bhishma then cites Atri, Harischandra, Manu,
    and Sandilya on gifts such as gold, drink and waterworks, ghee, food mixed with
    ghee, jars of water, firewood, umbrellas, and cars, together with the rewards
    or protections these gifts bring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma says Narada discoursed to Devaki on what gifts should be made under
    what constellations, and Devaki then recited it to her daughters-in-law, the spouses
    of Krishna.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma introduces Atri, described as the son of the Grandsire Brahman, as
    saying that those who give gold give everything in the world.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: King Harischandra is cited as saying that a gift of gold cleanses sin, leads
    to long life, and produces inexhaustible merit for the Pitris.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Manu is cited as saying that a gift of drink is the best gift and that a person
    should cause wells, tanks, and lakes to be excavated.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says a well full of water, used by diverse creatures, removes
    half the excavator's sinful acts; a water source used by kine, Brahmanas, and
    righteous people rescues the donor's race from hell and sin.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ghee is said to gratify several deities, possess medicinal virtues, be a high
    requisite for sacrifice, and produce superior merit when given to Brahmanas.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A person who gives ghee to Brahmanas in the month of Aswin is said to receive
    personal beauty from the twin Aswins.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says Rakshasas never invade the abode of one who gives Brahmanas
    Payasa mixed with ghee.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A person who gives Brahmanas jars filled with water is said never to die of
    thirst, to obtain necessities in abundance, and to avoid calamity or distress.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A devout and restrained giver to foremost Brahmanas is said to take a sixth
    part of the merits won by the Brahmanas through penances.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A person who gives firewood to Brahmanas for cooking and warmth is said to
    gain success, splendour over enemies, the pleasure of the deity of fire, preservation
    of cattle, and victory in battle.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: A gift of an umbrella is said to bring children, prosperity, freedom from
    eye-disease, sacrificial merit, and release from difficulties during summer or
    rains.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Rishi Sandilya is cited as saying that the gift of a car is the best of all
    gifts.
  category: speech
  evidence_refs:
  - ev:10
