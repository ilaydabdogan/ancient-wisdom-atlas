canonical_text:
  quote: a gift that is made to a dancer or a singer or a Dakshina presented to a
    lying or deceitful person, produces no merit.
  summary: The passage teaches that ritual gifts and Sraddha offerings give no merit
    or become destructive when given to improper or deceitful recipients. It defines
    worthy Brahmanas as those aligned with Rishi-prescribed duties, Vedic study, knowledge,
    penance, and acts, and says Sraddha offerings should be given to such learned
    Brahmanas rather than to calumniators or false Brahmanas.
  language: English
