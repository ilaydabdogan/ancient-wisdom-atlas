canonical_text:
  quote: ''
  summary: The passage lists articles that should not be offered at Sraddhas, including
    certain meats, plants, salts, sprouts, fruits, and items contaminated by spittle
    or tears. It states that Sudarsana should not be included in offerings to the
    Pitris or deities and that Havi mixed with it is unacceptable to the Pitris. It
    also lists persons and groups who should be excluded from the place of a Sraddha.
    The teaching is framed as words once spoken by Atri to Rishi Nimi before Atri
    returned to the Grandsire's heavenly assembly.
  language: English
  quote_policy: summarized
