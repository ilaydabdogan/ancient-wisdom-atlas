canonical_text:
  quote: ''
  summary: A sequence of translator/commentarial footnotes explains ritual prohibitions,
    ritual impurity after shaving, teacher and parent hierarchies, ornaments, mythic
    numbers, dark-complexioned women, human sacrifice, equivalence of fasts and sacrifices,
    the meaning of Tirtha as sacred water, Manasa as a figurative image of the Soul,
    and merit freeing ancestors and descendants in the next world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nilakantha interprets one verse as forbidding the killing of birds at night
    and after they have been fed and adopted; an alternative reading takes the relevant
    word as hair and nails.
