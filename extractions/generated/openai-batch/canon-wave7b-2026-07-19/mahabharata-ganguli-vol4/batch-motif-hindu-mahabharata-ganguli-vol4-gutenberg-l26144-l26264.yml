    hierarchy of reverence, with the mother described as equal to the whole earth.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The birth received from parents is described as subject to death, while birth
    from the preceptor is described as true regeneration, unfading, and immortal.
  category: relationship
  evidence_refs:
  - ev:3
