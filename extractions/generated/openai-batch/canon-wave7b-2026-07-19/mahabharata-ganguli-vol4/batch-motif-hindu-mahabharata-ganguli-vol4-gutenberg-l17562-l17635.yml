canonical_text:
  quote: ''
  summary: Vyasa tells a worm that its present birth resulted from evil acts but that
    merit remains possible through the power of ascetic penance and reverent contact
    with him. The worm stays on the road and is killed by a vehicle, then is reborn
    through multiple animal and social states until becoming a Kshatriya prince. The
    prince returns to Vyasa, recounts his transformations, worships him, and describes
    his royal status. Vyasa explains the prince's remaining former-life sin and foretells
    further ascent to Brahmana status, heaven, and beatitude if he dies in battle
    for kine or Brahmanas and follows righteous conduct.
  language: English
  quote_policy: summarized
