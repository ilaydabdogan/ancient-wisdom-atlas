canonical_text:
  quote: ''
  summary: 'Bhishma reports the god of wind narrating to Arjuna two feats of Brahmana
    seers: Atri rescues the gods in battle after Rahu wounds Surya and Soma by assuming
    luminary forms, dispelling darkness, and burning the Asuras; Chyavana then confronts
    Indra over admitting the twin Aswins to drink Soma in sacrifice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma says Arjuna remained silent while the god of wind addressed him and
    began narrating Atri's achievement.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During a battle between gods and Danavas in the dark, Rahu pierced both Surya
    and Soma with arrows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gods were overwhelmed by darkness, struck by Asuras, and began to lose
    strength.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods saw Atri engaged in austerities and asked him to rescue them from
    fear after Soma and Surya had been pierced.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The gods asked Atri to become Chandramas and the sun and to slay the enemies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Atri assumed the form of Soma and the forms of the luminaries, shining over
    the battlefield through the power of his penances.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Atri made the universe bright, dispelled darkness, subjugated and burned the
    Asuras, and the gods killed the enemies while protected by his energy.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Atri is described as aided by sacred fire, as a silent reciter of Mantras,
    as clad in deer-skins, and as subsisting on fruits.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: After recounting Atri's feat, the god of wind asks whether any Kshatriya is
    superior to that regenerate Rishi; Arjuna remains silent.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The god of wind introduces Chyavana's feat, saying Chyavana had made a promise
    to the twin Aswins and told Indra to make them Soma drinkers with the other deities.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Indra refuses, saying the Aswins have been cast away, are not admitted to
    the sacrificial circle, are not numbered with the deities, and should not drink
    Soma with him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Chyavana states that the twin Aswins shall drink Soma with the gods, says
