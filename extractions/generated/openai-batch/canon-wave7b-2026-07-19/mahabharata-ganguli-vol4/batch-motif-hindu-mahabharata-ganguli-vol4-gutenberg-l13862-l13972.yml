canonical_text:
  quote: ''
  summary: A Yatudhani hears a series of ascetics and companions explain the etymologies
    of their names, repeatedly declares the explanations incomprehensible, and orders
    each speaker to plunge into a lotus lake. Sunahsakha refuses to provide a comparable
    etymological explanation, is asked to repeat his name, and strikes the Yatudhani
    with a triple stick, reducing the Rakshasi to ashes. The Rishis gather lotuses
    and lotus-stalks, return to the lake to offer water oblations to the Pitris, and
    then find the gathered lotus-stalks missing. They suspect one another and agree
    to swear oaths of innocence; Atri begins an oath against the thief.
  language: English
  quote_policy: summarized
