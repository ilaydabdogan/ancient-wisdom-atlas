canonical_text:
  quote: ''
  summary: Brahmanas advise Yudhishthira to make offerings to Mahadeva before seeking
    their object. Yudhishthira has Dhaumya perform rites with fire, food, flowers,
    and mantras for Mahadeva, his attendants, Kuvera, Manibhadra, Yakshas, and other
    beings. After further worship, blessings, and gifts to Brahmanas, Yudhishthira
    excavates a buried treasure, loads it onto many animals, vehicles, and people,
    worships Siva again, and returns toward the capital.
  language: English
  quote_policy: summarized
