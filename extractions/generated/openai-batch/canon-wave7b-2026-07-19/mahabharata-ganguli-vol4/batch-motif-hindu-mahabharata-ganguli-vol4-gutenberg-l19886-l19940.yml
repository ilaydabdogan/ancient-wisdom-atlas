canonical_text:
  quote: ''
  summary: Mahadeva instructs Uma about the outward signs and duties of recluses,
    especially wedded forest recluses. He lists ablutions, Homa with wilderness offerings,
    yoga, restraint, sincerity, harmlessness, compassion, forgiveness, and control
    of wrath as means of righteousness and divine reward. Uma then asks how ascetics,
    wealthy rulers, destitute people, and forest dwellers attain high rewards and
    an eternal place.
  language: English
  quote_policy: summarized
