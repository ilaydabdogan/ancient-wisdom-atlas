canonical_text:
  quote: ''
  summary: Vyasa recounts how Sakra directed the gods to prepare a grand sacrificial
    assembly for king Marutta. Indra declared that the gods and Marutta's ancestors
    were gratified, prescribed further offerings, and participated in the sacrifice.
    Samvarta offered clarified butter to the fire with hymns; Sakra and the gods drank
    Soma and departed pleased. Marutta distributed gold to Brahmanas, returned to
    rule, and Vyasa urged the prince to collect that gold for his own sacrifice. Yudhishthira
    was pleased and consulted his ministers.
  language: English
  quote_policy: summarized
