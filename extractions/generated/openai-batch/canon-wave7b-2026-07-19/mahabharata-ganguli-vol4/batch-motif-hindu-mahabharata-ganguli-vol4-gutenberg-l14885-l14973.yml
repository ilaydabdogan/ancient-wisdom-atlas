canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma where those who steal or misappropriate Brahmana
    property go. Bhishma recounts a dialogue in which a royal-order person questions
    a Chandala about his fear of milk-spots. The Chandala explains that stolen Brahmana
    cows and their milk caused ritual contamination, hell, degraded rebirth, and other
    punishments. Remembering previous lives, he asks how to attain emancipation. The
    royal-order person says he can do so only by giving up his life for a Brahmana
    in battle. Bhishma says the Chandala does this while protecting Brahmana wealth
    and attains a desirable end.
  language: English
  quote_policy: summarized
