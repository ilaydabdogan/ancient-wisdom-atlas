canonical_text:
  quote: ''
  summary: Vaisampayana narrates Dhritarashtra's public departure from the city toward
    the forest. Vidura and Sanjaya intend to accompany him, while Kripa and Yuyutsu
    are left with Yudhishthira. Kunti refuses Yudhishthira's request to return to
    the city, takes hold of Gandhari, instructs Yudhishthira to care for Sahadeva,
    Karna's memory, Draupadi, and his brothers, and declares her intention to live
    in the woods in penance and service. Yudhishthira and Bhima plead with her, but
    she continues, followed by grieving family members.
  language: English
  quote_policy: summarized
