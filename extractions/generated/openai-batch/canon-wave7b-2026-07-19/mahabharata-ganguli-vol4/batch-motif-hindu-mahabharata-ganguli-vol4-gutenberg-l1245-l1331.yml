canonical_text:
  quote: ''
  summary: Bhishma narrates how a Sudra adopts ascetic practices, receives instruction
    from a Rishi in rites for the Pitris, dies and is reborn in a royal family. The
    Rishi also dies and is reborn in a priestly family. The reborn Sudra becomes king,
    appoints the reborn Rishi as priest, repeatedly laughs at him during rites, and
    the priest asks for a boon requiring truthful explanation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sudra leaves the earlier asylum, builds a hut of twigs and leaves, prepares
    a sacrificial platform, a sleeping place, and platforms for deities.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sudra follows rigid vows, abstains from speech, bathes three times daily,
    offers sacrifices and libations on the sacrificial fire, worships deities, restrains
    desires, and lives on fruits and roots.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Sudra welcomes and entertains guests at his retreat with herbs and fruits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Rishi comes to the Sudra's retreat repeatedly to see him and is welcomed
    and worshipped by the Sudra.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sudra asks the Rishi to instruct him in rites ordained for the Pitris
    and brings water, Kusa grass, herbs, fruits, a sacred seat, and the Vrishi seat.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: The Rishi corrects the orientation of the Vrishi and directs the Sudra in
    the details of the Sraddha rite, including Kusa grass, Arghyas, libations, and
    food offerings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After long penance, the Sudra dies in the woods and, because of the merit
    acquired, is reborn in the family of a great king.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Rishi dies and is reborn in a priestly family; both reborn figures grow
    and acquire learning, and the reborn Rishi becomes skilled in Vedic and ritual
    subjects.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The reborn Sudra, now a prince, performs his father's last rites, is installed
    by the subjects on the paternal throne, appoints the reborn Rishi as priest, and
    rules righteously.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king repeatedly smiles or laughs at the priest when receiving benedictions
    and during religious rites, causing the priest to become angry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: In private, the priest asks the king for one boon; the king offers many, and
    the priest asks him to swear that he will tell the truth.
  category: speech
  evidence_refs:
  - ev:8
