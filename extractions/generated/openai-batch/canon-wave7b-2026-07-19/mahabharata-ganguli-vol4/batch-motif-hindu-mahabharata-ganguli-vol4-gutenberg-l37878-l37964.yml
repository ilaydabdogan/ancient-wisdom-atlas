canonical_text:
  quote: ''
  summary: Narada visits Yudhishthira and reports the death of Dhritarashtra, Gandhari,
    and Kunti in the forest. Dhritarashtra had gone to Gangadwara with his sacred
    fire, Gandhari, Kunti, Sanjaya, and ritual assistants, and had undertaken severe
    ascetic practice. A forest fire arose after he bathed in the Ganga. Too emaciated
    to move, Dhritarashtra instructed Sanjaya to escape while he and the two queens
    accepted death by fire as an ascetic end. They sat facing east in concentration
    and were overtaken by the conflagration; Sanjaya escaped and later departed toward
    Himavat.
  language: English
  quote_policy: summarized
