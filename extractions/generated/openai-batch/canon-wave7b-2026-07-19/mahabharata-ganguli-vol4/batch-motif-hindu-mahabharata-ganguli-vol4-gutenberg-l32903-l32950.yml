canonical_text:
  quote: I solicit thee, do thou revive that hero.
  summary: Chitrangada, grieving over her slain husband Arjuna, confronts Ulupi, daughter
    of the snake chief and co-wife of Arjuna. She accuses Ulupi of causing Arjuna
    to be killed by Chitrangada's young son, asks Ulupi to revive him, addresses the
    fallen Arjuna, points to Yudhishthira's sacrificial steed, and vows to sit in
    Praya and cast off her life-breaths if Ulupi does not restore him.
  language: English
  quote_policy: quoted
