  quote: ''
  summary: 'The passage consists of translator footnotes explaining ritual, ethical,
    and mythic details: sacrificial offerings from Earth and Cow sustain deities;
    Asuras weaken deities by afflicting Earth and killing kine; Ganga has courses
    in heaven, earth, and the nether regions; Sagara’s sixty thousand sons were reduced
    to ashes by Kapila’s curse; Bhagiratha brought Ganga down from heaven for their
    redemption; human sacrifice, oral Vedic transmission, and other ritual rewards
    are also noted.'
