canonical_text:
  quote: ''
  summary: Janamejaya asks what penances empowered Utanka to contemplate cursing Vishnu.
    Vaisampayana recounts Utanka's severe devotion to his preceptor Gautama, his unrecognized
    aging during long service, the supernatural force of his tears, Gautama's permission
    and boon of restored youth, Utanka's marriage to Gautama's daughter, and Ahalya's
    request that Utanka bring celestial earrings worn by Saudasa's wife. Utanka departs
    toward Saudasa, a king cursed by Vasishtha to become a cannibal, and Gautama warns
    of danger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Janamejaya asks what penances Utanka possessed that made him wish to denounce
    a curse upon Vishnu, described as the source of all puissance.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Vaisampayana describes Utanka as austere, energetic, devoted to his preceptor,
    and abstaining from worship of anyone else.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gautama is pleased with Utanka's self-restraint, purity of behavior, prowess,
    and services, and delays permitting him to leave while many other disciples depart.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Utanka grows old without noticing it, fetches a heavy load of fuel for his
    preceptor, and sees a silver-white matted lock fall with the load.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On seeing the white lock as a sign of old age, Utanka laments loudly from
    sorrow.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Gautama's command, Gautama's daughter tries to hold Utanka's tears in her
    hands, but the tears seem to burn her and she throws them down.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Earth is said to be unable to hold Utanka's tear-drops.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Utanka tells Gautama that his mind and heart have been wholly devoted to him,
    that a hundred years have passed, and that junior disciples have been allowed
    to depart before him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Gautama says love for Utanka and Utanka's service caused the long delay, and
