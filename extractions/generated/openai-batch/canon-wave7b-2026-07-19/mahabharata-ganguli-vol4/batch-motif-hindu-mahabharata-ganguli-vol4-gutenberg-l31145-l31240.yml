- id: obs:10
  text: Utanka asks what he should present to his preceptor before leaving.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Gautama says the preceptor's gratification is the final fee, expresses satisfaction
    with Utanka, and offers his daughter as wife if Utanka becomes a youth of sixteen
    years.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: At Gautama's words, Utanka becomes young again and accepts Gautama's daughter
    as wife.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Utanka asks Ahalya what final fee he should give for his preceptor and says
