  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: A fallen Brahmana who does not attain the region of Brahmana is said to sink
    into Hell and be born as a Sudra in the next birth.
  category: sequence
  evidence_refs:
