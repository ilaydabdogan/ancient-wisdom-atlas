canonical_text:
  quote: ''
  summary: An unnamed illustrious speaker addresses a goddess on the difficulty of
    attaining and preserving Brahmana status. The passage describes birth and conduct
    as determinants of varna status, warns that evil acts, interdicted foods, and
    serious transgressions cause fall from Brahmanahood, and states that conduct can
    lead to rebirth in another order. It also gives duties by which a Sudra or Vaisya
    may seek a higher status in a future life.
  language: English
  quote_policy: summarized
