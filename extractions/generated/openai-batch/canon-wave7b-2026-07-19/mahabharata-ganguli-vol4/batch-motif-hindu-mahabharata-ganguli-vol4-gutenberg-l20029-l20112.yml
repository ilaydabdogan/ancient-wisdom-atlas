  text: Persons born as Kshatriya or Vaisya who practice Brahmana duties are said
    to become Brahmanas in the next life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Brahmana who abandons Brahmana duties for duties assigned to Kshatriyas,
