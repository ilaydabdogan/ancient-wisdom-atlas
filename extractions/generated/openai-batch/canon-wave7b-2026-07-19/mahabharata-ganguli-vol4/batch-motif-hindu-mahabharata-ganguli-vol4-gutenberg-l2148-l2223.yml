canonical_text:
  quote: ''
  summary: A mother tells her son to adore Mahadeva. The speaker undertakes prolonged
    austerities for Sankara. Mahadeva, wishing to test whether the speaker is devoted
    to him alone, appears in the form of Sakra/Indra with divine attendants and offers
    a boon. The speaker refuses any boon from Sakra or other deities, declaring exclusive
    devotion to Mahadeva/Hara above sovereignty, heaven, Brahma's region, emancipation,
    and favorable rebirth. Indra then asks for a reason for the existence of a Supreme
    Being as cause of all causes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment attributes three mouths and many mouths to an unnamed
    'he' immediately before the instruction to devote oneself to him and adore Mahadeva.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother tells her son to set his heart on Mahadeva, depend on him, take
    him as refuge, and adore him to obtain the fruition of wishes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After hearing his mother, the speaker directs his devotion only to Mahadeva
    and applies himself to severe penances for Sankara.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The penance sequence includes standing on the left toe for one thousand years,
    then subsisting on fruits, fallen leaves, water only, and air alone for successive
    long periods.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mahadeva becomes gratified and appears before the speaker in the form of Sakra,
    surrounded by deities, in order to ascertain whether the speaker is devoted to
    him alone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sakra-form has a thousand eyes, carries a thunderbolt, rides a white four-tusked
    elephant, wears royal ornaments, is shaded by a white umbrella, and is attended
    by Apsaras and Gandharvas.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Sakra-form offers the speaker any desired boon, but the speaker is not
    pleased by the offer.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The speaker says he desires no boon from Sakra or any other deity and will
    ask boons only from Mahadeva.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The speaker says he would become a worm, a tree, an insect, a dog, or be born
    among Chandalas if connected with Hara's command or devotion, and he rejects sovereignty
    of the three worlds, heaven, Brahma's region, and emancipation if not given by
    Mahadeva.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
- id: obs:10
  text: The speaker describes devotion to Hara as Amrita that frees one from fear
    of the world and says that in the Kali Yuga one should not pass a moment without
    setting the heart on Mahadeva.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The speaker calls Rudra the root or original cause of everything real and
    unreal in the three worlds and says he will devote himself to Bhava in future
    rebirths.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Indra asks what reason can be assigned for the existence of a Supreme Being
    or for that Being's status as cause of all causes.
  category: speech
  evidence_refs:
  - ev:9
