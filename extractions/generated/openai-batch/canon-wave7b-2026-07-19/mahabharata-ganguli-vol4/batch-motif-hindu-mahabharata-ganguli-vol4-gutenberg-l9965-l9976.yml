canonical_text:
  quote: ''
  summary: Bhishma says that Vasava, after hearing words from the son of Angiras,
    gave him the whole earth with its jewels, gems, and diverse wealth. Bhishma adds
    that verses on the merit of gifts of earth should be recited at Sraddha rites
    so that Rakshasas and Asuras cannot take any share of the offerings, and the offerings
    to the Pitris become inexhaustible. Learned persons should recite these verses
    before invited Brahmanas while they eat. Bhishma calls the gift of earth the foremost
    of gifts.
  language: English
  quote_policy: summarized
