canonical_text:
  quote: Kine are possessed of great power. They are givers of boons.
  summary: Maheswara instructs listeners on mysteries of religion and duty, especially
    the merit of feeding and worshipping kine. He describes kine as sacred, cosmically
    sustaining, boon-giving beings, recalls his approval of them and Brahman's solicitation
    on their behalf, and explains the bull device on his standard.
