canonical_text:
  quote: ''
  summary: Bhishma narrates that King Kusika and his wife go to the forest residence
    selected by the Rishi Chyavana. There Kusika sees a golden jewel-columned palace,
    abundant trees, waters, food, birds, animals, Apsaras, Gandharvas, music, and
    sacred instruction. The king questions whether the sight is dream, mental aberration,
    reality, heaven, Uttara-Kurus, or Amaravati. Chyavana appears in the palace, disappears
    with his bed, reappears on a Kusa-grass mat reciting Mantras, and by Yoga-power
    makes the whole vision vanish, leaving the Ganga bank as before. Kusika praises
    the power of penance, and Chyavana declares that the king has mastered his senses
    and survived the ordeal prepared for him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the night passed, King Kusika performed morning rites and went with
    his wife to the wood chosen by the Rishi for residence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kusika saw a palatial mansion made entirely of gold, with a thousand columns
    made of gems and precious stones and signs of celestial design.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The place included hills, valleys, lotus lakes, mansions, gateways, arches,
    grassy open spaces, many flowering trees, tanks of cool, warm, or hot water, costly
    seats and beds, and prepared food.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king saw many birds and animals, Apsaras, Gandharvas with their spouses,
    and heard vocal music, sacred instruction, and geese in the lakes.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sights appeared and disappeared, and Kusika wondered whether he was seeing
    a dream, mental aberration, reality, heaven, Uttara-Kurus, or Amaravati.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Kusika and his wife approached Chyavana as he lay on a costly bed in the golden
    palace, but Chyavana vanished with the bed and then appeared elsewhere seated
    on a Kusa-grass mat, mentally reciting high Mantras.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: By Yoga-power Chyavana stupefied the king; the wood, Apsaras, Gandharvas,
    and beautiful trees disappeared, and the bank of the Ganga returned to its old
    aspect with Kusa grass and ant-hills.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Kusika told his wife that the sights were due to Chyavana’s grace and penance,
    and said that penance can surpass sovereignty, achieve emancipation, and create
    other worlds.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Chyavana knew the king’s thoughts, summoned the king and queen, received their
    worship, blessed them, and said Kusika had subdued the senses and mind and emerged
    unharmed from the ordeal prepared for him.
  category: sequence
  evidence_refs:
  - ev:9
