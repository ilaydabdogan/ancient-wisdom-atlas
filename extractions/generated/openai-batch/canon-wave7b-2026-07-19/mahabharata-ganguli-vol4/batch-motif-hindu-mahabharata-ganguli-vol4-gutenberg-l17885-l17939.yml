canonical_text:
  quote: That woman who with concentrated attention, adheres to this path of duty,
    becomes the recipient of considerable honours in heaven like a second Arundhati.
  summary: Yudhishthira asks Bhishma about the conduct of good and chaste women. Bhishma
    recounts how Sumana questioned Sandili in heaven about the conduct by which Sandili
    attained celestial happiness. Sandili answers that her attainment came not from
    external ascetic signs but from devotion to her husband, worship of deities, Pitris,
    and Brahmanas, service to in-laws, careful household conduct, restraint during
    her husband's absence, secrecy, cleanliness, and other domestic duties. Bhishma
    concludes that Sandili disappeared and that reading the narrative on full and
    new moon days brings heaven and felicity in Nandana.
  language: English
  quote_policy: quoted
