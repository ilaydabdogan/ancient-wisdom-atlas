canonical_text:
  quote: ''
  summary: A hymn addresses Bhava/Maheswara/Isana/Mahadeva as the supreme object of
    knowledge, the liberating end of yogic, Vedic, ritual, penitential, renunciant,
    and knowledge paths, the door of the divine and ancestral paths, the source and
    recipient of sacrifice, and the cosmic totality including time, directions, celestial
    bodies, death, and ontological principles. The passage concludes that Tandi praised
    Isana and sang the high Brahman once sung by the Creator in honor of Mahadeva.
  language: English
  quote_policy: summarized
