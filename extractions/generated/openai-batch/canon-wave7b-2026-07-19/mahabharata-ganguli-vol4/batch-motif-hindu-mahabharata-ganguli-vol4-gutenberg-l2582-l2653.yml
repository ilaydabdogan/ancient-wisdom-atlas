  text: The speaker identifies the deity with universal and supreme forms, including
    the universe, the heart of everything, Purusha, Meru among mountains, the Moon
    among luminaries, Garuda among birds, Ananta among snakes, Moksha among ends,
    and Kala the destroyer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker asks the deity for refuge and pardon, saying he was stupefied
