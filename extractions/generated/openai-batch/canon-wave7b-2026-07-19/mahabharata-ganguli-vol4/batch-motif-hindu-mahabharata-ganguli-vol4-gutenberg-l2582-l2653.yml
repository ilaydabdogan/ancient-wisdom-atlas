  text: The speaker salutes the addressed deity with destructive and victorious epithets,
    including tearing away a head of Brahma, slaying Mahisha, destroying the Asuras'
    triple city, Daksha's sacrifice, Kama's body, Bhaga, and Andhaka.
  category: speech
  evidence_refs:
  - ev:1
