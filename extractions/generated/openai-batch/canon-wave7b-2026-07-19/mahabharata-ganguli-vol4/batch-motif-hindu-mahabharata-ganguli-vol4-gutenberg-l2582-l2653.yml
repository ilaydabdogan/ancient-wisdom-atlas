canonical_text:
  quote: '"Behold, ye deities, the devotion of the high-souled Upamanyu."'
  summary: The speaker hymns Isana/Mahadeva with many epithets, identifying him with
    supreme beings and foremost members of many classes. The speaker asks pardon for
    failing to offer Arghya because of the deity's disguise, then offers water and
    Arghya and surrenders. Auspicious celestial signs occur. Mahadeva, accompanied
    by his spouse and marked by the bull, praises Upamanyu's devotion before the assembled
    deities, who ask that Upamanyu obtain all his desires.
  language: English
  quote_policy: quoted
