canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Yudhishthira, consoled by sages and companions
    after the deaths of kinsmen and friends, performs obsequial rites, honors Brahmanas
    and gods, regains sovereignty, asks the sages for help with a sacrifice and a
    safe journey to the Himalayas, and is directed by them to go there with Krishna
    and Arjuna. The sages vanish; the Pandavas continue funeral rites for fallen heroes,
    give wealth to Brahmanas, enter Hastina Nagar with Dhritarashtra, and Yudhishthira
    administers the earth with his brothers.
  language: English
  quote_policy: summarized
