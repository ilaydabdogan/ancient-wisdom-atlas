  quote: let these all, named and unnamed, rescue and cleanse us!
  summary: Bhishma teaches that the recitation of names of deities, sacred places,
    rivers, mountains, and Rishis at prescribed times cleanses sins, averts fear and
    undesirable rebirth, and then enumerates many divine beings, sacred geographies,
    and sages by region.
  language: English
  quote_policy: quoted
