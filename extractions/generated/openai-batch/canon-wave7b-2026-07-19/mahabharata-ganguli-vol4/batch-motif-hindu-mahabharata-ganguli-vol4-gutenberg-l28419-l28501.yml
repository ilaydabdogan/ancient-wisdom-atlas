canonical_text:
  quote: ''
  summary: A layered discourse on emancipation teaches meditation on Brahman inside
    and outside the body, answers questions about digestion, embodiment, and Jiva,
    describes the Soul as knowable only by the mind, and concludes with Vasudeva telling
    Arjuna that this secret teaching leads to Brahman, immortality, and happiness
    through renunciation and yoga.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The teaching directs one to restrain the senses in a silent, uninhabited forest
    and meditate on the universal Brahman both outside and inside the body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The meditation includes attention to bodily parts such as teeth, palate, tongue,
    throat, neck, heart, and ligatures of the heart.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A disciple asks the Brahmana questions about digestion, transformation of
    food into bodily substances, bodily growth, exhalation and inhalation, the Soul's
    dwelling in the body, and Jiva's relation to embodiment.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Brahmana answers that the seeker should place the mind within the body,
    restrain the senses, and seek after the Soul without heedlessness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Soul is described as not seizable by the eye or senses and visible only
    with the lamp of the mind.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The great Soul is described as having hands, feet, and ears on all sides and
    as pervading all things in the world.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Jiva is said to behold the Soul as extracted from the body, like the stalk
    from a blade of Saccharum Munja, and then to behold Brahma free from attributes.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The disciple leaves after the Brahmana says the mystery has been declared
    and asks permission to depart.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Vasudeva says the Brahmana disappeared after relating the religion of Emancipation.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Vasudeva tells the son of Pritha that the teaching is a great mystery, difficult
    to comprehend for the confused or unpurified, and not previously heard by other
    humans in the world.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The goal is described as eternal Brahman, where one casts off the body, attains
    immortality, and becomes happy.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage states that through this religion, even persons of sinful birth,
    including women, Vaisyas, and Sudras, attain the highest goal, and that yoga comes
    through six months of constant practice.
  category: speech
  evidence_refs:
  - ev:12
  - ev:13
