canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the fruits of good deeds. Bhishma presents
    a Rishi doctrine of karmic fruition after death and in succeeding lives, describes
    the soul and senses as witnesses, lists forms of hospitality, sacrifice, austerity,
    truthfulness, charity, non-injury, and study with their corresponding rewards,
    and concludes with similes for karma and teachings on honoring father, mother,
    and preceptor. Vaisampayana reports the Kuru princes' pleased wonder and adds
    a warning that false speech produces sin and evil results.
  language: English
  quote_policy: summarized
