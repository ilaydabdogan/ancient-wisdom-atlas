canonical_text:
  quote: ''
  summary: Bhishma recounts that Brahman instructs the deities to send Renuka to question
    the world-upholding elephants about religion and duty. Renuka asks them, and the
    eight elephants in the eight quarters prescribe offerings of treacle, rice, raw
    sugar, flowers, blue cloths, and unguents on an ant-hill, with mantras invoking
    Nagas and snakes and asking for strength like Narayana's when he raised the submerged
    Earth. The elephants say such offerings please nether-region beings and ease the
    burden of upholding the Earth, and that year-long observance grants great merit.
    Deities, Pitris, and Rishis applaud Renuka.
  language: English
  quote_policy: summarized
