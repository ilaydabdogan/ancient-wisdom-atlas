canonical_text:
  quote: ''
  summary: 'The footnotes explain textual and theological points concerning Mahadeva:
    all animate and inanimate existences flowing from Maheswara for Jiva; an allusion
    in which Mahadeva''s seed falls on blazing fire and becomes a mountain of gold;
    the half-male, half-female Hara-Gauri form with Uma or Parvati; the Ganas; material
    sacrifice contrasted with mental sacrifice; a cloud image with lightning or thunder-fire
    as eyes; yogic powers and restraint; boons to Krishna; and Ganga''s cleansing
    power.'
  language: English
  quote_policy: summarized
