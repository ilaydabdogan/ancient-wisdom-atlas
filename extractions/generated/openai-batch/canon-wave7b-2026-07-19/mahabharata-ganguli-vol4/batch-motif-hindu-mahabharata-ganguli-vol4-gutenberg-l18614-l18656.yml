canonical_text:
  quote: '"We desire to hear from thee the mysteries of duty and religion."'
  summary: Bhishma narrates that assembled Rishis, Pitris, and deities ask Arundhati
    to explain hidden duties. Arundhati teaches rules about who may receive sacred
    instruction, praises the merit of gratifying a guest, describes a dawn ritual
    involving water, Kusa grass, a cow-pen, and a cow's horns, and is then applauded
    and blessed by Brahman.
  language: English
  quote_policy: quoted
