canonical_text:
  quote: Righteousness is fraught with victory.
  summary: Bhishma teaches that good and evil acts bear corresponding consequences,
    that Time moves creatures toward righteous or unrighteous acts and dispenses felicity
    or misery, and that desireless Righteousness is eternal while reward-seeking righteousness
    leads only to non-eternal heaven. He also states that all human bodies share the
    five primal elements, souls are equal in nature, and moral disposition reappears
    after dissolution in a next life.
  language: English
  quote_policy: quoted
