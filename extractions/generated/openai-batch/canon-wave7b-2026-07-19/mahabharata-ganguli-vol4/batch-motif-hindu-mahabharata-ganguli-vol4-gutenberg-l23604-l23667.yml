- id: obs:2
  text: Time is described as entering the understandings of all creatures, setting
    them to righteous or unrighteous acts, and conferring felicity or misery upon
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Faith in Righteousness is presented as an indication of wisdom, and one who
    knows what should and should not be done is urged to accomplish what is right.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Righteous people are said to care for their souls in this life so that in
    later lives they may avoid birth with Passion predominating.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Righteousness is described as pure, protected by Time, untouched by Unrighteousness,
