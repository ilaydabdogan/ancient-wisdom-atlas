canonical_text:
  quote: Kine are the mothers of all creatures.
  summary: Yudhishthira asks Bhishma to explain rules about gifts, especially gifts
    of earth and other meritorious gifts. Bhishma teaches that gifts of kine, earth,
    and Vedic knowledge yield equal merit; he praises kine as sacred, protective,
    auspicious, and purifying, and gives rules about proper treatment of cows and
    bullocks. Yudhishthira asks which cows and recipients are fit for gifts, and Bhishma
    describes unworthy recipients, worthy Brahmanas, and the merits and dangers connected
    with giving, sustaining, or robbing Brahmanas.
  language: English
  quote_policy: quoted
