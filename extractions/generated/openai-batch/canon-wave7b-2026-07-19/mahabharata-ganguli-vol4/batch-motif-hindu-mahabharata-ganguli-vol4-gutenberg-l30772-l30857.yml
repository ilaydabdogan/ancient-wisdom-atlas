canonical_text:
  quote: Having obtained thee for our raft we have crossed the Kuru ocean.
  summary: Krishna and Arjuna travel by chariot toward the city named after the elephant.
    During the journey Arjuna praises Krishna as the source, protector, and cosmic
    ground of beings, attributes the Pandavas' victory to him, and approves Krishna's
    intended departure to Dwaraka. They arrive at Dhritarashtra's palace, honor elders
    and kin, pass the night, and in the morning go to Yudhishthira's chamber.
  language: English
  quote_policy: quoted
