canonical_text:
  quote: rot in hell for as many years as there are hairs on the body of the cow so
    slain
  summary: Indra asks the Grandsire about the fate of one who steals or sells a cow.
    The Grandsire describes hellish punishment for cow theft, slaughter, eating, selling,
    and permitting slaughter; mixed reward and punishment for gifting a stolen cow;
    the merit of gifting kine with gold Dakshina; the rescue of ancestors and descendants
    through such gifts; and the purifying power of gold. Bhishma then recounts a lineage
    of transmission from the Grandsire to Indra, Dasaratha, Rama, Lakshmana, Rishis,
    kings, his own preceptor, and himself, adding a reward for Brahmanas who recite
    the teaching.
  language: English
  quote_policy: quoted
