canonical_text:
  quote: ''
  summary: Bhishma reports a holy guest’s reply to Maitreya. The holy one praises
    Maitreya’s knowledge, commends gifts, penances, Vedic learning, and righteous
    household conduct, explains that actions determine future regions, compares purification
    by gifts and penances to water washing filth and fire dispelling darkness, then
    blesses Maitreya and departs while Maitreya reverently circumambulates and blesses
    him in return.
  language: English
  quote_policy: summarized
