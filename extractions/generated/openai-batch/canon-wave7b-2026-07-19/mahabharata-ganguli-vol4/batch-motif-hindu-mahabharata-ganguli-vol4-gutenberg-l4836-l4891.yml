canonical_text:
  quote: This trial was devised by me, O sinless one, for testing thee aright.
  summary: Yudhishthira asks how Ashtavakra returned from the lady. Bhishma recounts
    that Ashtavakra questioned her about her change of form. The lady says she tested
    him, identifies herself as the embodiment of the Northern point of the compass,
    says Vadanya sent him so she could instruct him, and permits him to return safely.
    Ashtavakra returns, reports his northern encounter with a superior goddess to
    Vadanya, and marries Vadanya's daughter according to rites.
  language: English
  quote_policy: quoted
