  quote: ''
  summary: Yudhishthira asks an addressed Kuru elder or king why men and women attach
    themselves to each other under divine illusion, then frames a series of questions
    and assertions about women, deception, illusion, policy, truth and falsehood,
    emotional influence over men, and the possibility of restraining women within
    scriptural bounds.
