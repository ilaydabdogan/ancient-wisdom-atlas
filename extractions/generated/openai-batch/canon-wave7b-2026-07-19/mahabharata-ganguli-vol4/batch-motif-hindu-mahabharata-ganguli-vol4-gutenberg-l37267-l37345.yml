canonical_text:
  quote: ''
  summary: Janamejaya asks Vaisampayana about the wonderful feat Vyasa performed after
    Dhritarashtra had gone to the forest and the Pandavas were staying in the ascetic
    retreat. Vaisampayana narrates that the Pandavas lived there about a month, Vyasa
    and other sages or celestial figures assembled, Yudhishthira honored them, and
    Vyasa offered Dhritarashtra a boon through the power of his penances. Dhritarashtra
    replies by describing his grief over his sons, the devastation caused by his wicked
    son, and his anguish about the fate of those killed in battle.
  language: English
  quote_policy: summarized
