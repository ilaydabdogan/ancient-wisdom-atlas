canonical_text:
  quote: ''
  summary: Janamejaya asks what the Pandavas did after the slaughter of the Vrishnis
    and Andhakas and Krishna's ascension. Vaishampayana narrates that Yudhishthira
    attributes events to Time, resolves with his brothers to leave the world, arranges
    succession, performs rites for deceased kinsmen and Krishna, adopts bark garments,
    casts the sacred fires into water, and departs eastward with his brothers, Draupadi,
    and a dog.
  language: English
  quote_policy: summarized
