canonical_text:
  quote: ''
  summary: Bhishma teaches that Brahmanas should be worshipped, protected, fed, and
    honored with gifts, because kingdom welfare, sacrificial efficacy, ancestral and
    divine satisfaction, victory, prosperity, and purification are said to depend
    on them. An embedded dialogue has Vasudeva ask Earth how a householder can cleanse
    sins; Earth answers that service to Brahmanas destroys impurities and brings prosperity,
    fame, knowledge, and power. The passage also cites examples of Brahmana power
    overcoming Kshatriya force and altering Indra's marks into eyes.
  language: English
  quote_policy: summarized
