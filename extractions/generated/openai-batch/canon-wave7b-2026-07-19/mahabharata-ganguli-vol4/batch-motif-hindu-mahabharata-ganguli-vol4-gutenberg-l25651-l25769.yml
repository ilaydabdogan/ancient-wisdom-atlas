  text: The passage notes that scriptural formulas or mantras are uttered when giving
    kine and that merit attaches to the gift of an actual cow as the recipient returns
    home and uses the cow for domestic religious and social duties.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: On a particular Ashtami known as Kamya or Goshtha, kine are worshipped with
