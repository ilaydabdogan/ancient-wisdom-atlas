canonical_text:
  quote: ''
  summary: Vaisampayana narrates that Bhishma, overthrown by Arjuna and lying on a
    bed of arrows while awaiting the auspicious time to leave his body, receives Yudhishthira,
    the Pandavas, and many great Rishis. The Rishis are worshipped, converse about
    Bhishma, and then vanish; the Pandavas see the directions shine from the power
    of their penances. Yudhishthira then asks Bhishma which lands, retreats, mountains,
    and rivers are most sacred. Bhishma answers by introducing an old narrative in
    which a householder Brahmana observing the Sila vow asks the same question of
    an ascetically successful Rishi who had traveled over the earth.
  language: English
  quote_policy: summarized
