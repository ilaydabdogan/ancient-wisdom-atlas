canonical_text:
  quote: Let this tree revive.
  summary: Yudhishthira asks Bhishma about compassion and devout conduct. Bhishma
    tells of a parrot named Suka who remains with a poisoned, withered tree that had
    sheltered him since birth. Indra, disguised as a Brahmana, questions the parrot,
    then rewards his compassion by reviving the tree with nectar and later granting
    him companionship with Sakra.
  language: English
  quote_policy: quoted
