- id: obs:1
  text: Yudhishthira asks Bhishma to describe the merits of compassion and the characteristics
    of devout men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma introduces an ancient legend of Vasava and the high-minded Suka as
    an illustration.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A fowler shoots a poisoned arrow at antelopes, but the arrow misses and pierces
    a mighty forest-tree, which withers and sheds leaves and fruits.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A parrot that had lived in a hollow of the tree all his life does not leave
    the tree; he remains motionless, without food, silent, and sorrowful, and withers
    with it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Indra wonders at the parrot’s conduct, assumes the shape of a Brahmana, descends
    to earth, and asks why the parrot does not leave the withered tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The parrot recognizes Indra by the merit of his austere penances.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Indra notes that the forest contains many other suitable trees and advises
    the parrot to abandon the dead and useless tree.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The parrot explains that he was born in the tree, acquired his good traits
    there, and was protected there in infancy, and says he cannot forsake what once
    supported his life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Indra is pleased, offers a boon, and the parrot asks that the tree revive;
    Indra has the tree sprinkled with nectar, and it becomes replenished and splendid.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Bhishma says the parrot obtained companionship with Sakra by virtue of compassion
    and uses the story to teach the value of communion with the pious.
  category: speech
  evidence_refs:
  - ev:8
