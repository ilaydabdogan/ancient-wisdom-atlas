canonical_text:
  quote: ''
  summary: An unnamed speaker instructs Bharata/the son of Kunti on the merit of giving
    food. The passage presents food-giving as superior to other gifts, cites King
    Rantideva as attaining heaven through gifts of food, states that food is the source
    of life and strength, prescribes dedication of food to deities, and promises felicity,
    purification from sin, and passage through difficulties for those who give food
    to the hungry, righteous, guests, or during the bright fortnight of Kartika.
