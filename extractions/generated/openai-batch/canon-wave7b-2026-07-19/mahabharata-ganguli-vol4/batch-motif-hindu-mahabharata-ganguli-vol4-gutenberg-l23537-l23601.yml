canonical_text:
  quote: ''
  summary: The passage first warns against practicing righteousness for display or
    reward, and advises reverence for deities, service to the preceptor, and gifts
    to deserving persons for benefit in the hereafter. Yudhishthira then argues that
    wealth, learning, exertion, and even death are governed by fortune and the proper
    time rather than by effort alone. Bhishma replies that one should practice austerities
    when wealth is not gained, give gifts, serve the venerable, avoid cruelty and
    injury, cultivate purity and sweet speech, and understand happiness and woe as
    caused by acts and Nature.
