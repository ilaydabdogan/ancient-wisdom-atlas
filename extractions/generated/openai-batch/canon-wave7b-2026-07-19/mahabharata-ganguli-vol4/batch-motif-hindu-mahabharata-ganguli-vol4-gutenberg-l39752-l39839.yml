canonical_text:
  quote: ''
  summary: Yudhishthira is told that Karna, his brothers, and allied kings have attained
    their proper heavenly places. Dharma reveals that Yudhishthira's vision of Hell
    was a test and an illusion, and that his relatives were not destined for prolonged
    Hell. Yudhishthira bathes in the Heavenly Ganga, casts off his human body, assumes
    a celestial form, and proceeds to behold Krishna, Arjuna, Karna, Bhima, Nakula,
    and Sahadeva in their celestial states.
  language: English
  quote_policy: summarized
