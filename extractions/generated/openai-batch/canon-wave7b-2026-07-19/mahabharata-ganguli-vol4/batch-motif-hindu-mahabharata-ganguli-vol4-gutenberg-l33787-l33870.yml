canonical_text:
  quote: ''
  summary: The Mongoose narrates a story about a Brahmana at Kurukshetra who lives
    by the Unccha vow with his wife, son, and daughter-in-law. During a famine the
    household obtains a small quantity of barley, prepares it as Saktu, performs rites,
    and divides it into small shares. A hungry guest arrives, is ritually welcomed,
    and eats the host’s share without being satisfied. The wife offers her own share
    for the guest, while the husband objects because she is weak with hunger and he
    regards the protection of the wife as a duty. The wife replies by emphasizing
    the religious unity of husband and wife and again asks that her share be given
    to the guest. The excerpt ends mid-speech.
  language: English
  quote_policy: summarized
