canonical_text:
  quote: ''
  summary: Arjuna witnesses Vasudeva's death and oversees funeral rites, including
    mourning by wives and citizens, the bearing of ritual objects, the burning of
    the body and four wives on the pyre, water oblations, rites for the slaughtered
    Vrishnis and the bodies of Rama and Vasudeva, and a seventh-day departure of widows,
    survivors, citizens, warriors, and Vajra under Arjuna's escort.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After being addressed by Pritha's son, the people hastened preparations for
    safety, while Arjuna spent the night in Keshava's mansion and was overcome by
    grief and stupefaction.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At dawn, Vasudeva attained the highest goal through Yoga, and loud wailing
    was heard in his mansion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women in the mansion were described as weeping, dishevelled, divested of ornaments
    and floral wreaths, beating their breasts, and lamenting.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Devaki, Bhadra, Rohini, and Madira threw themselves on the bodies of their
    lord.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Arjuna caused his uncle's body to be carried on a costly shoulder-borne vehicle,
    followed by citizens of Dwaraka and people of the provinces.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An umbrella associated with a horse-sacrifice and the blazing fires worshipped
    daily by the deceased were borne before the funeral vehicle, with attending priests.
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The body was followed by wives in ornaments and by thousands of women and
    daughters-in-law, and last rites were performed at a place agreeable to the deceased
    in life.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Four wives ascended the funeral pyre, were consumed with their lord's body,
    and were said to attain the same regions of felicity as he did.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Arjuna burned the body with scents and perfumed wood while the pyre blazed,
