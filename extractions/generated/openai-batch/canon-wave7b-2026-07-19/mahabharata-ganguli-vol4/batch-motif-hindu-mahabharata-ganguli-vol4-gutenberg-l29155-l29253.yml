canonical_text:
  quote: ''
  summary: A framed teaching recounts the royal sage Alarka, who conquers the earth
    and then turns toward what is subtle while seated at a tree root. He proposes
    to shoot arrows at his mind, sense-organs, and understanding, but each warns that
    such arrows would only pierce his own vital parts. After severe penances fail
    to provide weapons against these seven, Alarka reflects, practices Yoga, enters
    his soul, subdues the senses with one arrow, and declares Yoga higher than external
    acts and sovereignty. The tale is applied as advice to Rama, Jamadagni's son,
    to cease slaying Kshatriyas and practice austerities.
  language: English
  quote_policy: summarized
