canonical_text:
  quote: ''
  summary: Yama reports Chitragupta's teaching on duties and their afterlife effects.
    The passage states that piety and sin are not lost, that acts are conveyed to
    the sun, and that the sun witnesses a mortal's deeds in the region of the dead.
    It recommends gifts of water, lamps, sandals, umbrellas, and a Kapila cow, and
    describes corresponding benefits in the next world, including water, light, shade,
    freedom from distress, and relief from painful conditions. Surya endorses the
    teaching and names five classes of grave sinners who have no escape and rot in
    hell.
  language: English
  quote_policy: summarized
