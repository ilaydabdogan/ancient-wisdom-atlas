    mental recollection, or bodily renunciation produce purification, sacrificial
    merit, heavenly destinations, future births, or access to Brahman.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bathing at Prayaga with restrained soul and vows in Magha cleanses sins and
    leads to heaven; bathing at tirthas of the Maruts, Pitris, and Vaivaswata also
    cleanses sins.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bathing at Brahmasaras and the Bhagirathi with daily oblations to the Pitris
    for a month while fasting leads to the region of Soma; bathing at Utpataka and
    Ashtavakra with twelve days of water oblations while fasting gives the merit of
    a Horse-sacrifice.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Baths at Asmaprishtha, Niravinda mountains, and Kraunchapadi in Gaya cleanse
    one, two, and three offences of Brahmanicide respectively.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Different sacred baths are said to grant water for the next world, residence
    in a city connected with Agni's daughter in a next birth, identification with
    Brahma, and access to Indra's Nandana gardens attended by Apsaras.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Some rites are tied to specific calendrical moments or durations, including
    the full moon of Kartika, the new moon, one night, three days, twelve days, a
    fortnight, and a month.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
- id: obs:6
  text: Bathing, fasting, exposure to heat, subsisting on potherbs, wearing rags,
    and penances at named tirthas produce stated results such as cleansing sins, ascetic
    success, royal rebirth, and the obtaining of spouses.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: Residence beside Kanya-hrada is said to prevent going to Yama's regions and
    to lead instead to celestial felicity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Seeing the image of Nandiswara cleanses all sins, and bathing in Swargamarga
