candidate_motifs:
- id: motif:1
  label: fated clan self-destruction
  taxonomy_refs:
  - chaos
  basis: The passage repeatedly states that the hour had come, the groups were urged
    by fate or Time, and sons and fathers killed one another in a destructive melee.
  evidence_refs:
  - ev:7
  - ev:10
  - ev:11
  confidence: high
  cautions: The taxonomy term 'chaos' is broad; the passage concerns social and dynastic
    destruction rather than primordial cosmic chaos.
- id: motif:2
  label: curse transforms ordinary matter into lethal weapons
  taxonomy_refs:
  - divine_judgment
  basis: Every blade of Eraka grass becomes a terrible iron thunderbolt-like bolt,
    and this is explicitly attributed to a Brahmana curse.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage attributes the event to a Brahmana curse but does not explicitly
    call it divine judgment.
- id: motif:3
  label: departure from the world before catastrophe
  taxonomy_refs:
  - departure
  basis: Uddhava takes leave for a great journey while Krishna knows the Vrishni destruction
    is near and does not prevent him.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The exact destination or metaphysical nature of Uddhava's journey is not
    described in this passage beyond departure from the world and splendour in the
    welkin.
- id: motif:4
  label: intoxicated sacrilege preceding destruction
  taxonomy_refs:
  - chaos
  basis: The clans mix wine with food cooked for Brahmanas, give it to monkeys and
    apes, then engage in drinking revels that lead into quarrel and slaughter.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly state that the food act causes the destruction;
    it presents it as part of the revels before the fatal quarrel.
- id: motif:5
  label: kin-slaying in terminal melee
  taxonomy_refs:
  - chaos
  basis: The passage states that son killed sire and sire killed son while the clans,
    intoxicated and fated, fell upon one another.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: This is a specific social-collapse motif; broader classification under
    'chaos' should be reviewed.
- id: motif:6
  label: fire image for mass destruction
  taxonomy_refs:
  - world_destroying_fire
  basis: The Kukuras and Andhakas are compared to insects rushing at a blazing fire
    during their destruction.
  evidence_refs:
  - ev:11
  confidence: low
  cautions: The fire is a simile within the battle scene, not an actual world-destroying
    fire.
