canonical_text:
  quote: ''
  summary: Uddhava departs on a great journey as Krishna knows the destruction of
    the Vrishnis is near. At Prabhasa the Vrishnis and Andhakas drink wine, quarrel
    over past acts, and Satyaki kills Kritavarma. The clans attack one another; Eraka
    grass becomes iron thunderbolt-like weapons through a Brahmana curse. Krishna
    witnesses and then joins the slaughter, exterminating the Vrishnis and Andhakas
    after several of his kin are slain.
  language: English
  quote_policy: summarized
