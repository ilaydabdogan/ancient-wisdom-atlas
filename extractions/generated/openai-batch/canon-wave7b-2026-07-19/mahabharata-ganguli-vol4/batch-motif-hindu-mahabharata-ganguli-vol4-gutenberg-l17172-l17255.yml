canonical_text:
  quote: ''
  summary: Bhishma teaches Yudhishthira the merit of abstaining from meat and injury.
    He cites Manu, Narada, Vrihaspati, Markandeya, and groups of Rishis as authorities,
    equates abstention with great sacrifices, gifts, and austerities, and says that
    non-injury grants fearlessness and confidence among creatures while meat-eating
    and slaughter bring sin, anxiety, shortened life, and unfavorable rebirth.
  language: English
