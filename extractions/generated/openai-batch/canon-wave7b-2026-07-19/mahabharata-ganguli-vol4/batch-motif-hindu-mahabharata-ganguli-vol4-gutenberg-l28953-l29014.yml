canonical_text:
  quote: ''
  summary: A Brahmana tells his wife that he has crossed the dangerous fastness of
    the world and entered the forest of Brahman. In response to her questions, he
    describes this forest through paradoxes, sevenfold arrangements, trees, fruits,
    guests, fire, senses, emancipation, Rishis, females, rivers, mountains, sacrifice,
    tranquillity, self-merging, and attainment of Brahman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Brahmana says he has crossed an impassable fastness identified parenthetically
    as the world and has entered the extensive forest of Brahman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fastness is described with dangers and discomforts, including gadflies
    and mosquitoes, cold and heat, darkness, reptiles, a danger on the road, and robbers.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife of the Brahmana asks where the forest is and asks about its trees,
    rivers, mountains, hills, and extent.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Brahmana says that nothing is separate from the forest and that entering
    it allows regenerate persons to transcend joy and sorrow and be free from mutual
    fear with creatures.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The forest is said to contain seven large trees, seven fruits, seven guests,
    seven hermitages, seven forms of Yoga concentration, and seven forms of initiation.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Trees in the forest are described as producing flowers and fruits with different
    numbers and kinds of colours and fragrances.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: A single fire is described as having a good mind; the five senses are its
    fuel, and seven forms of Emancipation are linked with seven forms of initiation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Great Rishis accept hospitality in the forest; after being worshipped, they
    become annihilated, and another forest shines forth.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the second forest, Intelligence is the tree, Emancipation is the fruit,
    Tranquillity is the shade, knowledge is the resting house, contentment is the
    water, and the Kshetrajna is the sun.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Seven females dwell there with faces downwards, effulgence, and the cause
    of generations, and they take up tastes from creatures.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Seven Rishis, with Vasishtha foremost, dwell in and emerge from the same place,
    and seven qualities follow it like rays following the sun.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Hills, mountains, rivers, streams, waters born of Brahma, and a confluence
    of streams at a secluded place for sacrifice are said to exist there.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: Those contented with their own souls proceed to the Grandsire, while those
    with reduced wishes and sins burnt by penances merge in their souls and attain
    Brahman.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
