  quote: ''
  summary: A litany of divine epithets praises a figure as upholder of worlds, possessor
    and source of sacred knowledge, sacrificially born, recipient of simple offerings,
    cosmic creator and sustainer, solar and fiery manifestation, tree of the world,
    protector of seekers and Yogins, warrior, and executor of chastisement.
  language: English
  quote_policy: summarized
