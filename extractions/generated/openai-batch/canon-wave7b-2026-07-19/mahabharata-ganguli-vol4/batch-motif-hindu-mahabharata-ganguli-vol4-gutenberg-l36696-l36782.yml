  text: Narada, Parvata, Devala, Vyasa, Satayupa, and other ascetics come to see king
    Dhritarashtra; Kunti worships them, and the Rishis speak with Dhritarashtra about
    religion and righteousness.
  category: sequence
  evidence_refs:
  - ev:1
