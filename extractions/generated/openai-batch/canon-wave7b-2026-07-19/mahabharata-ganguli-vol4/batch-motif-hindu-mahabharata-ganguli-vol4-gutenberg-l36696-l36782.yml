canonical_text:
  quote: ''
  summary: Ascetics visit Dhritarashtra in the forest. Narada recounts earlier kings
    who gained heavenly regions through renunciation and austerities, predicts future
    afterlife outcomes for Dhritarashtra, Gandhari, Kunti, Vidura, and Sanjaya, and
    then answers Satayupa’s question by declaring Dhritarashtra’s remaining lifespan
    and future passage with Gandhari to Kuvera’s regions.
  language: English
  quote_policy: summarized
