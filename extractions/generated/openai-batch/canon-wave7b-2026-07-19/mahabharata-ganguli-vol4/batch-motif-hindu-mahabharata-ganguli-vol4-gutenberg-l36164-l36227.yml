canonical_text:
  quote: ''
  summary: A Brahmana consoles Dhritarashtra by attributing the destruction of the
    Kurus to destiny rather than to Duryodhana or other human agents. He absolves
    Dhritarashtra's son, wishes him heroic heavenly regions, exhorts Dhritarashtra
    to follow Vedic duties, and praises Yudhishthira and the Pandavas as righteous
    protectors of the people. The assembly approves the speech, and Dhritarashtra
    honors and dismisses his subjects before entering his mansion with Gandhari.
  language: English
  quote_policy: summarized
