canonical_text:
  quote: ''
  summary: Brahma answers by reporting a teaching from a preceptor to a disciple.
    The passage praises non-harming and knowledge, describes moral consequences such
    as Hell and repeated birth, distinguishes Purusha/Kshetrajna from Nature, and
    uses images of a lotus leaf and water, a light with oil and wick, road travel,
    a car, a mountain, and a boat crossing water to explain spiritual progress, right
    means, detachment, and cosmological development from the unmanifest Pradhana.
  language: English
  quote_policy: summarized
