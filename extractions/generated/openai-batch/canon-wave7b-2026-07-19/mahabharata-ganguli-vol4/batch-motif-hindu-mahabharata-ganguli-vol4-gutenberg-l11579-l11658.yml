canonical_text:
  quote: ''
  summary: Bhishma recounts an old account of the origin of kine. Brahman commands
    Daksha to create creatures; Daksha creates food first, then creatures seek sustenance
    from him. After drinking nectar, Daksha emits a fragrant eructation that becomes
    the cow Surabhi, whose daughters become Kapila kine and sources of milk for the
    worlds. Milk froth from calves falls on Mahadeva, who in anger looks at the kine
    with his third eye and alters their colors; some escape to the region of Soma
    unchanged. Daksha declares cow milk and its froth pure, compares it to substances
    that cannot be polluted, and says kine will support the worlds through milk and
    ghee. Daksha then gives Mahadeva a bull and kine, leading Mahadeva to make the
    bull his vehicle and banner and to become lord of animals and master of kine.
    The passage concludes by praising Kapila kine, cow-giving, and the merit of reciting
    the origin of kine.
  language: English
  quote_policy: summarized
