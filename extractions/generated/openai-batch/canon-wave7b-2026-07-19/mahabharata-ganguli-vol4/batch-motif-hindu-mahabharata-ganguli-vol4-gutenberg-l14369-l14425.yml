canonical_text:
  quote: This custom of giving umbrellas and shoes was introduced by Surya!
  summary: Yudhishthira asks what Jamadagni did after Surya pleaded with him. Bhishma
    narrates that Surya, disguised as a Brahmana, supplicated the angry sage. Jamadagni
    recognized him, threatened to pierce him at midday, but then granted protection
    when Surya sought refuge. Jamadagni asked for a remedy for people afflicted by
    the sun's rays. Surya gave an umbrella and sandals, establishing their ritual
    donation. Bhishma explains the religious merit and heavenly reward attached to
    giving umbrellas and shoes to Brahmanas.
  language: English
  quote_policy: quoted
