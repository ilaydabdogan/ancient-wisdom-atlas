canonical_text:
  quote: ''
  summary: The passage opens with a reference to a mystery concerning changes between
    Sudra and Brahmana status. In Section CXLIV, Uma asks the god of gods about duties
    and derelictions, saying that thought, word, and deed bind and free human beings,
    and asks what conduct leads to heaven. Maheswara answers with ethical prescriptions
    concerning truth, non-injury, compassion, restraint, righteous wealth, sexual
    propriety, charity, penance, and purity. Uma then asks which words bind and free
    a person, and Maheswara describes truthful, gentle, non-deceitful, non-harsh,
    agreeable speech as the path to heaven. The passage ends as Uma asks about mental
    acts that enchain a person.
  language: English
  quote_policy: summarized
