    falsehood, existence, and non-existence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Tandi says he has been rewarded by seeing the deity’s form and that devotion
    acquired over innumerable lives caused the deity to show itself to him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Brahman is said to be concealed in the cave of the heart and difficult for
    gods, Asuras, and ascetics to behold or know.
  category: setting
  evidence_refs:
  - ev:5
  - ev:8
- id: obs:11
  text: The addressed figure is said to make, bear, and enjoy a body and to be the
    refuge of embodied creatures and beings with life-breaths.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: The addressed figure gives creatures their ends, whether happiness or misery,
