  text: Tandi speaks in direct address to a figure he salutes as holiest, refuge of
    all, supreme Truth, and giver of blessings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressed figure is said to give Nirvana, which Yatis strive for because
