canonical_text:
  quote: ''
  summary: Tandi speaks a hymn to an addressed supreme deity, praising it as refuge,
    giver of Nirvana, source and support of all things, identical with cosmic principles,
    gods, elements, Brahman, and the goal of yogic and philosophical seekers. The
    passage emphasizes knowledge of the deity within the heart, freedom from rebirth,
    divine vision gained through devotion, and the deity’s concealment in the cave
    of the heart from gods, Asuras, ascetics, and humans.
  language: English
  quote_policy: summarized
