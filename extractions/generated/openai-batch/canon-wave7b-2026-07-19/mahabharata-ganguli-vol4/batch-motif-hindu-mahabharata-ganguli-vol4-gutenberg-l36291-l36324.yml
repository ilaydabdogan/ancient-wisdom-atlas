canonical_text:
  quote: ''
  summary: Arjuna counsels Bhima to honor Dhritarashtra and to remember benefits rather
    than wrongs. Yudhishthira instructs Vidura to tell Dhritarashtra that he may use
    Yudhishthira's wealth for funeral rites, gifts, and obligations to his sons and
    benefactors. Bhima shows anger toward Arjuna, and Yudhishthira asks that Dhritarashtra
    not be angry with Bhima, citing Bhima's hardships in the woods. Yudhishthira declares
    his wealth, Arjuna's wealth, and even his own body to be at Dhritarashtra's disposal.
  language: English
