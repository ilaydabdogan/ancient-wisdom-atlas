canonical_text:
  quote: ''
  summary: Bhishma narrates a dialogue in which Maitreya, with Vyasa's permission,
    praises Vyasa's teaching on gifts and explains the status and function of learned
    Brahmanas. Maitreya states that gifts made to qualified Brahmanas produce merit,
    while food accepted by ignorant or unworthy recipients fails or causes harm. He
    presents giver and acceptor as mutually dependent and describes learned, disciplined
    men as guides to heaven and bearers of sacrifice.
  language: English
  quote_policy: summarized
