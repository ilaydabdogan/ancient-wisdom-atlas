canonical_text:
  quote: He sometimes manifests himself singly; sometimes divides himself into two
    portions; and sometimes exhibits himself in many, a hundred thousand forms.
  summary: A first-person speaker says that Durvasa, born as a Brahmana, resided in
    the speaker's house at Dwaravati and performed difficult mischief that the speaker
    endured. The passage then identifies Durvasa with Rudra, Shiva, Agni, Sarva, Indra,
    Vayu, the Aswins, lightning, lunar and solar deities, Varuna, Time, Death, day
    and night, seasons, twilights, the year, creator figures, Viswakarma, and directions.
    He is described as universal, immeasurable, capable of appearing as one, two,
    or many forms, equivalent to Mahadeva, unborn, and inexhaustible in merit.
