canonical_text:
  quote: I never approach one that is another's spouse.
  summary: A Rishi, later named Ashtavakra, sees a splendid gold-and-gem mansion in
    a jewel-filled landscape with the Mandakini river. He asks for shelter as a guest,
    is met by seven beautiful maidens, controls his disturbed mind, and enters. An
    ornamented old woman remains with him, approaches him at night, embraces him,
    solicits sexual union, and offers wealth and pleasures. Ashtavakra refuses relations
    with another man's wife and says he seeks lawful wedlock for offspring and future
    felicity.
  language: English
  quote_policy: quoted
