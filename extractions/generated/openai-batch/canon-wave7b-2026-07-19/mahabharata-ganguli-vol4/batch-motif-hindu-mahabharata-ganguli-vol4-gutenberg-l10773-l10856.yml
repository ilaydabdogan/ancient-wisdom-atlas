canonical_text:
  quote: ''
  summary: Bhishma recounts an old discourse in which the Rishi Uddalaki sends his
    son Nachiketa to fetch ritual articles from a riverside. The articles have been
    washed away, and Uddalaki, angered, curses Nachiketa to meet Yama. Nachiketa falls
    lifeless, then revives under his grieving father's tears. He reports visiting
    Yama's radiant realm, being honored there, and being shown the prosperous regions
    reserved for righteous persons, including mansions, waters, wish-granting trees,
    rivers of milk, and hills of ghee. Yama explains that these enjoyments are for
    righteous gift-givers, especially those who give kine properly.
  language: English
  quote_policy: summarized
