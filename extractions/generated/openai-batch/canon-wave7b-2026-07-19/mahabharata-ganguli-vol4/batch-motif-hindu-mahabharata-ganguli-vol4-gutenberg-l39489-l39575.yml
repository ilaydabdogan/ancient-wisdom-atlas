canonical_text:
  quote: This is Heaven, O lord of men. There can be no enmities here.
  summary: At the opening of Book 18, Janamejaya asks what regions were attained by
    the Pandavas and the sons of Dhritarashtra. Vaishampayana narrates that Yudhishthira,
    arriving in Heaven, sees Duryodhana honored and radiant among divine beings. Yudhishthira
    angrily refuses to share felicity with him and asks to go where his brothers are.
    Narada explains that enmities cease in Heaven and that Duryodhana attained the
    heroes' region through warrior conduct and death in battle. Yudhishthira then
    asks where his brothers and other slain Kshatriya heroes are, saying he does not
    see them there.
  language: English
  quote_policy: quoted
