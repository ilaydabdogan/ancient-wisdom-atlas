canonical_text:
  quote: ''
  summary: Devasarman warns Vipula that Indra can assume innumerable forms, become
    invisible, and even become wind, and commands him to guard Devasarman's spouse
    while Devasarman goes to perform a sacrifice. Vipula reasons that ordinary physical
    protection cannot bar such a being, resolves to enter the woman's body by Yoga-power
    without passion or physical contact, and then enters through a joined gaze in
    subtle form, remaining invisibly within her.
  language: English
  quote_policy: summarized
