  quote: ''
  summary: A hymn addresses a deity identified among many titles as Rudra, Supreme
    Brahman, universal cause and destroyer, wielder of many weapons and ritual objects,
    bearer of matted locks that received the Ganga, slayer of demons, dancer, lord
    of spirits, dweller on Kailasa, destroyer of sacrifices, world tree/banian, and
    sleeper on a leaf after cosmic dissolution in an expanse of water.
  language: English
  quote_policy: summarized
