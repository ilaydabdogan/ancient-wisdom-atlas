canonical_text:
  quote: To do good to the Brahmanas is the most sacred of all sacred acts.
  summary: Yudhishthira asks Bhishma who deserves worship and what is beneficial in
    this world and hereafter. Bhishma praises learned, self-controlled Brahmanas;
    commends gifts and reverence offered to them; states his own devotion to them;
    links that devotion with relief from pain and future felicity; and teaches that
    Kshatriyas should protect Brahmanas, the Vedas, and Brahmana households. He also
    describes Brahmanas as gentle and righteous but dangerous when angered through
    the power of penance.
  language: English
  quote_policy: quoted
