  quote: '"those ordinances...are regarded as equal to Sacrifices"'
  summary: Bhishma tells Yudhishthira about ordinances first promulgated by Angiras
    concerning meritorious fasts. The passage lists graded fasting practices, often
    joined with fire libations, restraint, truthfulness, non-injury, reverence, and
    worship, and describes the sacrificial merits and celestial rewards attached to
    each practice.
