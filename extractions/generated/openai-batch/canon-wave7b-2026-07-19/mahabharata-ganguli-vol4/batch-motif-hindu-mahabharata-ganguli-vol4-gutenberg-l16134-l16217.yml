  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A man who takes one meal in the forenoon and one at night for six years, abstains
    from injury, and pours daily libations on the sacred fire is said to attain success
    and a residence in Prajapati's region.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man who confines himself to one meal every day for three years and observes
    sexual restraint is said to gain the merit of the Agnishtoma sacrifice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Truthful speech, gifts, reverencing Brahmanas, avoiding malice, forgiveness,
    self-restraint, and conquering wrath are listed as practices leading to the highest
    end.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A year-long practice of fasting for a day and eating one meal on the second
    day, with daily fire libations and rising before sunrise, is said to bring Agnishtoma
    merit and residence in Indra's region.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Eating one meal every third day for a year, with daily attention to the sacred
    fire and waking before sunrise, is said to bring Atiratra merit and residence
    in the region of the seven celestial Rishis.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Fasting three days and eating on the fourth, with daily fire libations, is
    said to bring Vajapeya merit and residence in Indra's region.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fasting four days and eating on the fifth, joined with daily fire libations,
    truthfulness, reverence for Brahmanas, non-injury, and avoidance of malice and
    sin, is said to bring Vajapeya merit and a white mansion.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Fasting five days and eating on the sixth, with fire libations, three daily
    ablutions, prayers, worship, Brahmacharya, and absence of malice, is said to bring
    Gomedha merit and residence in Brahma's region.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Fasting six days and eating on the seventh, with silence, Brahmacharya, and
    abstention from flowers, unguents, honey, and meat, is said to lead to the regions
    of the Maruts and Indra.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Fasting seven days and eating on the eighth, with forgiveness, daily fire
