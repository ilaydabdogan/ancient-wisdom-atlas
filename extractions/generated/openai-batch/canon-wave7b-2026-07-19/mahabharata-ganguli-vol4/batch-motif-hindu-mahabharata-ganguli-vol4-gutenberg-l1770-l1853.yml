- id: obs:1
  text: Vasudeva addresses Brahmanas, Yudhishthira, and Ganga's son, saying he will
    relate names applied to Kaparddin and how he once obtained a difficult sight of
    that deity for the sake of Samva through Yoga-abstraction.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Jamvavati, after seeing sons born to Rukmini, asks Vasudeva to grant her a
    heroic, handsome, sinless son like himself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jamvavati states that Vasudeva had previously observed a twelve-year vow,
    purified himself, adored Mahadeva, and then begot sons upon Rukmini.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vasudeva asks Jamvavati's permission to leave, and she blesses him by invoking
    many divine, cosmic, ritual, ancestral, planetary, calendrical, and natural powers
    for his protection.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vasudeva informs and takes leave of his parents, the king, Ahuka, Gada, and
