canonical_text:
  quote: ''
  summary: Vasudeva recounts to Brahmanas, Yudhishthira, and Ganga's son how Jamvavati
    asked him for a heroic son, citing his earlier twelve-year worship of Mahadeva
    before Rukmini's sons were born. After receiving blessings and permission from
    Jamvavati and kin, he summons Garuda, travels to Himavat, and beholds Upamanyu's
    ascetic retreat, described with forests, animals, sacrificial ashes, sacred fires,
    Ganga, and ascetics practicing varied austerities.
  language: English
  quote_policy: summarized
