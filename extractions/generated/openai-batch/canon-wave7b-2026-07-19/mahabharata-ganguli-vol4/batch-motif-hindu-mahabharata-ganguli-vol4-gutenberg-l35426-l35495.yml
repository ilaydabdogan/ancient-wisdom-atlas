canonical_text:
  quote: King Dhritarashtra should be honoured both by myself and you all.
  summary: Vaisampayana describes Yudhishthira and the Pandavas honoring and obeying
    the old king Dhritarashtra after the war. Dhritarashtra and Gandhari perform rites
    and gifts for their slain kin, while Yudhishthira shows forbearance toward past
    wrongs. Dhritarashtra responds with affection and daily blessings for the Pandavas,
    though Bhima reverences him only outwardly and unwillingly.
  language: English
  quote_policy: quoted
