canonical_text:
  quote: ''
  summary: The passage concludes an instruction on clarity, tranquillity, detachment,
    knowledge, and emancipation. Brahma's teaching is said to bring sages to felicitous
    regions. Vasudeva states that the pupil who followed the preceptor attained Emancipation,
    then explains to Arjuna that he himself is the preceptor and the mind is the pupil.
    He urges Arjuna to practice the teaching of the Soul, recalls that he formerly
    taught the same religion at the hour of battle, and expresses a wish to see his
    father. Arjuna proposes traveling to the elephant-named city to meet Yudhishthira
    before Krishna returns to his own city.
  language: English
  quote_policy: summarized
