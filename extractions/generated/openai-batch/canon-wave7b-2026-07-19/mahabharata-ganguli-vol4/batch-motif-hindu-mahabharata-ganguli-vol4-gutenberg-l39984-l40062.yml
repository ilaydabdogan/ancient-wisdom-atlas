canonical_text:
  quote: That which occurs here occurs elsewhere. That which does not occur here occurs
    nowhere else.
  summary: The passage praises the Mahabharata, also called Jaya, as a sacred history
    whose hearing and recitation bring emancipation, heaven, victory, blessed offspring,
    merit, success, and cleansing of sin. It describes Vyasa, the Island-born Krishna,
    as compiler of the Bharata and assigns portions of a larger compilation to gods,
    Pitris, Yakshas, and humans. It names different reciters for gods, Pitris, Rakshasas
    and Yakshas, and human beings; gives moral verses on impermanence and righteousness;
    compares the Bharata to the ocean, Himavat, and nectar; records Janamejaya’s question
    about rites for listening; and begins Vaishampayana’s reply that deities came
    to earth, completed their task, ascended to heaven, and that the Bharata contains
    births of rishis and deities and the whole universe of beings and entities.
  language: English
  quote_policy: quoted
