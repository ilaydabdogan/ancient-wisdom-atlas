canonical_text:
  quote: ''
  summary: The passage gives instructions for hearing and reciting the Bharata, including
    purification, gifts and Sraddha offerings, qualifications for the listener and
    reciter, invocations before recitation, and graded heavenly rewards associated
    with reaching successive Paranas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hearing the names and achievements of the celebrated persons in the history
    is said to cleanse even terrible sins, and one who hears the history from beginning
    to end should make Sraddha offerings to those persons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hearer is instructed to give Brahmanas gifts according to ability, including
    gems, kine, milking vessels, maidens, conveyances, mansions, land, cloths, animals,
    beds, cars, valuable household wealth, and even self, wives, and children.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person desiring to hear the Bharata should do so without doubt, with cheerfulness
    and joy, while making gifts with devotion as the recitation proceeds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage prescribes qualities for the listener and for the appointed reciter,
    emphasizing truthfulness, purity, self-restraint, faith, learning, white robes,
    freedom from malice, and control of passions.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The reciter should sit at ease, recite attentively with proper pace, voice,
    intonation, accent, emphasis, and articulation, and should bow to Narayana, Nara,
    and Sarasvati before uttering the word Jaya.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: At the first Parana, the hearer who gratifies Brahmanas with gifts obtains
    the fruits of the Agnishtoma sacrifice and proceeds to Heaven in a celestial car
    attended by Apsaras and accompanied by deities.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: At the second Parana, the hearer obtains the fruits of the Atiratra vow, ascends
    a gem-made celestial car, and receives high honours in Heaven; at the third Parana,
    he obtains the fruits of the Dwadasaha vow and dwells in Heaven for myriads of
    years.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: At the fourth through seventh Paranas, the hearer receives increasing fruits
    associated with the Vajapeya sacrifice and ascends radiant or gem-decked celestial
    cars, including cars compared to the rising sun, blazing fire, and the summit
    of Kailasa, and roves through regions of felicity.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: At the eighth Parana, the hearer gains the fruits of the Rajasuya sacrifice
    and ascends a moonlike car with white steeds, attended by beautiful women; at
    the ninth Parana, he gains the fruits of the Horse-sacrifice and rides a gold-and-lapis
    car with Apsaras, Gandharvas, and other celestials.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
