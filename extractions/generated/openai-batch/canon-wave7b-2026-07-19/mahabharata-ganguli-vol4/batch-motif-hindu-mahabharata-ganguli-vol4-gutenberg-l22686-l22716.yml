canonical_text:
  quote: ''
  summary: Chyavana performs a rite for the Aswins, stupefies the gods with mantras,
    paralyzes Indra when he attacks, creates the Asura Mada from sacrificial libations,
    compels Indra’s submission so the Aswins may drink Soma with the gods, and then
    assigns Mada to reside in dice, hunting, drinking, and women.
  language: English
  quote_policy: summarized
