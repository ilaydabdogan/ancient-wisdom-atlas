  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: Maheswara says he finds no spot more sacred than the crematorium and that
    it pleases him as an abode.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Maheswara says ghostly beings are his companions, love such places, and that
