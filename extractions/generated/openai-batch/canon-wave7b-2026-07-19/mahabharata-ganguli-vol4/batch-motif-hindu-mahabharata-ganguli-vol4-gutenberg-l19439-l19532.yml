canonical_text:
  quote: ''
  summary: In a dialogue with Uma, Maheswara explains the origin and functions of
    his four faces, his blue throat, the bull as his vehicle and banner-emblem, and
    his preference for the crematorium as a sacred abode with ghostly companions.
    Uma then asks about Religion or Duty, and Maheswara begins to enumerate ethical
    duties, especially for householders, before she asks about duties of the four
    orders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A blessed woman named Tilottama is said to have been created by Brahman from
    grains of beauty taken from every beautiful object in the universe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tilottama came to Maheswara ostensibly to circumambulate him but is described
    as being impelled by a desire to tempt him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: As Tilottama turned in different directions, a new face of Maheswara appeared,
    and he says he became four-faced through Yoga-puissance.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Maheswara assigns distinct directional functions to his faces: east for sovereignty,
    north for sporting with Uma, west for ordaining happiness, and south for destroying
    creatures.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Maheswara describes himself as a Brahmacharin with matted locks and says the
    bow Pinaka is always in his hand for accomplishing the purposes of the deities.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Indra hurled a thunderbolt at Maheswara, scorching his throat; Maheswara explains
    this as the reason he is blue-throated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Brahma created the celestial cow Surabhi, and many milk-giving kine sprang
    from her.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Froth from a calf’s mouth fell on Maheswara; in anger he scorched the kine,
    after which they became diversified in hue.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Brahma pacified Maheswara and gave him the bull both as a vehicle and as a
    device on his banner.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Uma describes the crematorium as filled with hair, bones, vultures, jackals,
