canonical_text:
  quote: ''
  summary: 'Dhritarashtra returns to his palace with Gandhari and attendants, performs
    rites, eats, and later addresses Yudhishthira. He instructs him on righteous kingship:
    honoring learned elders, restraining the senses, appointing tested ministers,
    using spies, protecting fortifications and the royal person, guarding counsel,
    administering justice, supervising officials, and ordering the royal day.'
  language: English
  quote_policy: summarized
