  summary: The passage lists many principal kings and states that a person who, with
    purity and attention, recites their names at dawn and at the two twilights gains
    religious merit. The person is instructed to praise deities, celestial Rishis,
    and royal sages, and to ask that these lords of creation ordain growth, long life,
    fame, freedom from calamity and sin, victory, and an auspicious end.
