canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about fasting Brahmanas, vow violation, penance,
    ritual leftovers, hospitality, and the difference between giver and receiver.
    Bhishma answers with rules about vows, restraint, food, gifts, afterlife rewards
    and punishments, and begins an old history in which the seven Rishis, with associated
    household figures named, wander during a severe drought and cook the body of a
    dead prince before King Saivya comes upon them.
  language: English
  quote_policy: summarized
