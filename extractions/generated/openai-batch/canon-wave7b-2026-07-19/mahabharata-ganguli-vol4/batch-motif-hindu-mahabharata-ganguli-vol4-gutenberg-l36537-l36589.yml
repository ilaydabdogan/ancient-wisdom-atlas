canonical_text:
  quote: ''
  summary: Kunti explains that she once stirred the Pandavas to courage after their
    kingdom and Draupadi were lost at dice. She recalls Draupadi's public humiliation
    by Dussasana, says she used the words of Vidula to preserve the Pandava line and
    its fame, rejects any desire for the kingdom won by her sons, and declares her
    wish to serve her elders in the woods and practice penance while Yudhishthira
    and his brothers return to righteousness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kunti says that when the Pandavas were cheerless after their kingdom was wrested
    from them by dice and they were dominated by kinsmen, she instilled courage and
    high thoughts into them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kunti states that she encouraged the sons of Pandu so that they and their
    fame would not be lost and so that they would not live in dependency on others.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kunti names Yudhishthira, Bhima, Vijaya, Nakula, and Sahadeva as particular
    sons whose courage, strength, or endurance she sought to preserve.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kunti recalls that Draupadi had been won at dice, treated as if enslaved,
    dragged in the public hall by Dussasana, and made to lament for a protector.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kunti says she was deprived of her senses when Draupadi was dragged by her
    locks by Dussasana.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kunti says she recited the words of Vidula to enhance the Pandavas' energy
