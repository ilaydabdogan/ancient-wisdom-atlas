canonical_text:
  quote: ''
  summary: Janamejaya asks about Heaven as the fruit of wealth lawfully acquired and
    given. Vaisampayana answers with an old narrative of Agastya's twelve-year sacrifice.
    Indra withholds rain during the sacrifice, causing the gathered Rishis to worry
    about food. Agastya declares that, if rain does not fall, he can perform mental
    or touch sacrifices, continue his seed-sacrifice, transform himself into Indra
    to sustain creatures, create another order of things, and summon wealth, celestial
    beings, Heaven, and Dharma. After he speaks, his wishes occur through the power
    of his penances, and the Rishis rejoice.
  language: English
  quote_policy: summarized
