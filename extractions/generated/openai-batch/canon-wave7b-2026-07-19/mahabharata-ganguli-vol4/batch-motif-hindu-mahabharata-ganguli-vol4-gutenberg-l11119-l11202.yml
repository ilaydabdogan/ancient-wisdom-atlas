canonical_text:
  quote: ''
  summary: The passage teaches the merit attached to revering cows and making gifts
    of cows to Brahmanas. It describes qualifications of donors and recipients, differing
    results by social class, gifts made after austerity or self-sacrifice, substitute
    gifts of a sesame cow, proper times and objects of gift, and ritual procedures
    involving fasting on water, sleeping on bare earth, calves, and cow products.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A virtuous person who gives a milk-yielding cow to a Brahmana according to
    proper rites is said to attain great merit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who studies the Vedas, reveres cows, rejoices at seeing them, and
    bows to them from birth is said to acquire merit comparable to the Rajasuya sacrifice
    and gifts of heaps of gold.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person who feeds cows before eating for a full year is said to win the merit
    of gifting a thousand cows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person who eats once daily and gives the other meal to cows is said to enjoy
    ten years of unlimited felicity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person who saves a meal in order to buy and gift a cow is said to gain merit
    measured by the number of hairs on that cow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage assigns different amounts of merit for the same cow-gift conduct
    to Kshatriyas, Vaisyas, and Sudras.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A person who sells himself, buys cows with the proceeds, and gives them to
    Brahmanas is said to enjoy heavenly felicity for as long as cows are seen on earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Gifting cows acquired in battle is said to yield the same merit as gifting
    cows bought with the proceeds of selling oneself.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the absence of cows, a restrained person may give a cow made of sesame
    seeds and is said to be rescued from calamity by it.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that the merit of a cow gift depends on deserving recipients,
    proper time, the kind of cow, and the ritual performed.
  category: other
  evidence_refs:
  - ev:9
- id: obs:11
  text: Cows should not be given to a recipient whose abode would expose them to suffering
    from fire or the sun.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: A proper recipient is described as learned in the Vedas, pure in lineage,
    tranquil, sacrificially devoted, sin-fearing, knowledgeable, compassionate toward
    cows, mild, protective, and lacking assigned sustenance.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: Proper objects of gift include cows acquired as honoraria for knowledge, by
    exchange, by prowess in arms, as marriage-dower, by rescue from danger, or through
    transfer from an owner unable to maintain them.
  category: object
  evidence_refs:
  - ev:11
- id: obs:14
  text: Strong-bodied cows with good dispositions and agreeable fragrance are praised
    as gifts.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:15
  text: The passage says that as Ganga is foremost among streams, a Kapila cow is
    foremost among bovine animals.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:16
  text: Before gifting cows, one should abstain from food, live on water for three
    nights, sleep on bare earth, and gratify Brahmanas with other presents.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: Gifted cows should be free from vice and accompanied by healthy unweaned calves;
    after gifting, the giver should live for three days on products of the cow.
  category: sequence
  evidence_refs:
  - ev:13
