canonical_text:
  quote: ''
  summary: Arjuna questions Ulupi about her motives after Vabhruvahana has overcome
    him. Ulupi explains that she arranged the encounter to free Arjuna from a curse
    laid by the Vasus, with Ganga's assent, because of his unrighteous role in Bhishma's
    fall. The Vasus had declared that Arjuna's son, the ruler of Manipura, would cast
    him down in battle and thereby release him from the curse. Arjuna accepts Ulupi's
    explanation, invites Vabhruvahana and his household to Yudhishthira's Horse-sacrifice,
    and then departs because his vow requires him to follow the sacrificial horse.
  language: English
  quote_policy: summarized
