canonical_text:
  quote: ''
  summary: Bhishma narrates that Bharadwaja reassures Divodasa and undertakes a sacrifice
    so that Divodasa may obtain a son capable of defeating Vitahavya's party. Pratarddana
    is born as a result, immediately matures, masters the Vedas and arms, and is filled
    with energy through Bharadwaja's yogic power. Armed and radiant, he comes before
    Divodasa, who installs him as heir and commands him to attack the sons of Vitahavya.
    Pratarddana crosses the Ganga in his car and advances toward the Vitahavyas' city.
  language: English
