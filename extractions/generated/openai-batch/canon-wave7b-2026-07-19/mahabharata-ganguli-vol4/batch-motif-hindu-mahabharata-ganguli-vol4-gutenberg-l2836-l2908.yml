    Pavaka, Havi, and other sacrificial requisites.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Desire, wrath, fear, cupidity, pride, stupefaction, malice, pains, and diseases
    are called Mahadeva's children; acts, joy and sorrow, ignorance, mind, puissance,
    and eternity are also identified with him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Mahadeva is said to reside in the hearts of all creatures, with arms and feet
    extending everywhere, eyes, head, and face everywhere, and hearing everywhere
    while pervading all things.
  category: attribute
  evidence_refs:
  - ev:4
