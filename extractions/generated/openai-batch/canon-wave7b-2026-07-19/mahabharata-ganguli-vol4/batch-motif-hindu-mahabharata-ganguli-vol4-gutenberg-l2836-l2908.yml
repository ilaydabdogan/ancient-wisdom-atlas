canonical_text:
  quote: I saluted Mahadeva
  summary: Vishnu recounts a hymn to Mahadeva, identifying him with cosmic origin,
    deities, sacrifice, inner self, knowledge, and all-pervading presence. The universe
    and many classes of beings approve and bow; celestial flowers and winds appear.
    Sankara recognizes Krishna's devotion and offers him eight boons.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Vishnu says he saluted Mahadeva and addressed him as the eternal origin of
    all things, Lord of the Vedas, creator of the triple world, and source of all
    mobile and immobile beings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mahadeva is described as superior to senses, mind, vital breaths, sacrificial
