  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says Brahmanas can make a non-deity into a deity, remove deity
    status, make someone a king, or cause someone to fail.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Persons who calumniate Brahmanas are said to meet destruction; those praised
    by Brahmanas prosper, while those censured and cast off soon meet discomfiture.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Several Kshatriya tribes are said to have become degraded to the status of
