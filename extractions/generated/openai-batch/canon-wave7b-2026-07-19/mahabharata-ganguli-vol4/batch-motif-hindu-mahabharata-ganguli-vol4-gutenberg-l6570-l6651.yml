canonical_text:
  quote: ''
  summary: Bhishma instructs a king that honoring Brahmanas is the foremost royal
    duty. He describes Brahmanas as worthy of reverence, diverse in conduct and occupation,
    powerful through will, incantation, and penance, older than many classes of beings,
    able to confer or remove divine and royal status, and dangerous to slander or
    harm.
  language: English
  quote_policy: summarized
