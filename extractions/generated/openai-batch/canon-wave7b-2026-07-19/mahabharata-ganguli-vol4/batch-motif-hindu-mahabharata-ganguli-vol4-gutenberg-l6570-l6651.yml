  text: Bhishma says that worship of Brahmanas is the foremost act prescribed for
    a duly installed king seeking happiness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king is told to worship learned and righteous Brahmanas with bows, comforting
    speech, and gifts, and to protect and cherish them as he protects himself or his
    children.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that when such Brahmanas are free from anxiety, the whole
    kingdom becomes beautiful, and they should be honored like sires and grandsires.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that enraged Brahmanas can consume an entire kingdom to
