canonical_text:
  quote: ''
  summary: Vidura reports to Dhritarashtra that Yudhishthira and Arjuna have placed
    their wealth, lives, and authority at Dhritarashtra's disposal. Bhima, though
    remembering past sufferings, has been persuaded toward cordiality, and Yudhishthira
    asks that he be forgiven. Yudhishthira and Arjuna authorize Dhritarashtra to distribute
    wealth for the obsequial rites of his sons, including gifts to Brahmanas and the
    distressed, construction of food pavilions, water reservoirs for cattle, and other
    works of merit. Dhritarashtra is pleased and resolves to make large presents on
    the Kartika full moon.
  language: English
  quote_policy: summarized
