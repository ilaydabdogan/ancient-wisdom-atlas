canonical_text:
  quote: ''
  summary: Bhishma reports that the god of wind speaks to King Arjuna about the greatness
    of the Brahmana Rishis Agastya and Vasishtha. In the first exemplum, defeated
    gods seek Agastya's aid against Danavas; Agastya burns many Danavas by his ascetic
    energy but refuses to consume those under the earth lest his penances diminish.
    In the second exemplum, gods performing sacrifice are attacked by Khalin Danavas
    who revive through lake waters; Indra seeks Vasishtha, who burns the Khalins and
    brings Ganga to pierce the lake and flow as Sarayu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: King Arjuna remains silent when addressed, and the god of wind continues speaking
    to him through Bhishma's reported narration.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Asuras or Danavas subjugate the deities, seize the sacrifices of the gods,
    misappropriate the Swadha of the Pitris, and suspend human religious acts and
    observances.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The defeated deities meet Agastya, salute him, describe their defeat and loss
    of prosperity, and ask him to rescue them from fear.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Agastya becomes incensed, blazes forth like a fire of universal dissolution,
    and his rays burn Danavas so that thousands fall from the sky and others flee
    south.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Danavas located with King Vali in the nether regions or in the bowels of the
    earth are not burned; Vali is performing a horse-sacrifice there.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the gods ask Agastya to destroy the Asuras beneath the earth, Agastya
    says he is able to do so but declines because such exertion would diminish his
    penances.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Vasishtha episode, the deities perform a sacrifice on the shores of
    Lake Vaikhanasa and make Vasishtha their priest in imagination.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Khalin Danavas are described as mountain-sized; when disabled or slain,
    they are plunged into the waters of Manasa lake and immediately return to vigor
    and life because of a boon of the Grandsire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Khalins take mountain summits, maces, and trees, agitate the lake waters
    until they swell, and rush against ten thousand deities.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The afflicted gods seek Vasava's protection; Vasava or Sakra is also afflicted
    and then seeks Vasishtha's protection.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Vasishtha assures the gods, burns the Khalin Danavas without exertion by putting
    forth his energy, and rescues the denizens of heaven.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Vasishtha brings the River Ganga from Kailasa; Ganga pierces through the lake
    waters and flows under the name Sarayu.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The narration closes by asking whether any Kshatriya could surpass the Brahmana
    Vasishtha.
  category: speech
  evidence_refs:
  - ev:9
