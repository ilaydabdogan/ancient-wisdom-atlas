canonical_text:
  quote: ''
  summary: Indra threatens king Marutta with his thunderbolt unless Marutta accepts
    Vrihaspati as priest. Dhritarashtra the Gandharva carries the message. Marutta
    refuses to abandon Samvarta, seeks Samvarta's protection when Indra's storm approaches,
    and asks that Indra and the gods come to the sacrifice. Samvarta uses incantations
    to neutralize the threat and attract Indra. Indra arrives with the gods, drinks
    Soma, accepts honor, and says his resentment is gone.
  language: English
  quote_policy: summarized
