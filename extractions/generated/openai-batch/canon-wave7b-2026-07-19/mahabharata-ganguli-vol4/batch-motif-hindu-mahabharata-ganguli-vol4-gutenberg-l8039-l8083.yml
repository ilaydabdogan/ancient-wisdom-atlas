canonical_text:
  quote: ''
  summary: Bhishma instructs Yudhisthira on ordained spouses and inheritance shares
    for Kshatriyas, Vaisyas, and Sudras, including restrictions on sons of Sudra wives,
    equal sharing among sons of same-order wives, the eldest son's extra share, and
    the authority of the Self-born and Kasyapa for these rules.
  language: English
  quote_policy: summarized
