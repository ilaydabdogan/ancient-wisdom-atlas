  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Among equal-status children, elder sons are said to precede younger sons in
    marriage and in the order of shares received.
  category: sequence
  evidence_refs:
  - ev:6
