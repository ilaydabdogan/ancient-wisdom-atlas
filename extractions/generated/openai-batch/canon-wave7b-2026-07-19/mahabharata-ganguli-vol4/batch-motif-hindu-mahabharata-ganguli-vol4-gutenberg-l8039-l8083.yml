- id: obs:2
  text: For a Kshatriya, two wives are described as ordained; a third wife from the
    Sudra order is said to be practiced but not scripturally sanctioned.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'A Kshatriya''s property is divided into eight shares: four for the son of
    the Kshatriya wife, three for the son of the Vaisya wife, and one for the son
    of the Sudra wife if the father gives it.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For a Vaisya, one wife is described as ordained; a second wife from the Sudra
    order is said to be practiced but not scripturally sanctioned.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'A Vaisya''s wealth is divided into five portions: four for the son of the
    Vaisya wife and one for the son of the Sudra wife only if the father gives it.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: A son begotten on a Sudra wife by a man of one of the three higher orders
    is described as disentitled to any share of the father's wealth unless specifically
    given in the preceding cases.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
- id: obs:7
  text: A Sudra is said to have only one wife from his own order; any number of sons
    by that wife share equally in the wealth left behind.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Children born from a spouse of the husband's own order are said to share equally,
    though the eldest son receives one additional share consisting of the best things
    of the father.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the law of inheritance was declared by the Self-born
