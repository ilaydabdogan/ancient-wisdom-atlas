canonical_text:
  quote: ''
  summary: Bhishma tells Yudhishthira about optional Sraddha rites to be performed
    under different constellations, said to have first been taught by Yama to king
    Sasavindu. The passage lists named constellations and the benefits obtained by
    performing Sraddha under each, including children, energy, fame, wealth, knowledge,
    sovereignty, longevity, heavenly ascent, and other outcomes. Sasavindu follows
    the ordinances and rules the whole earth.
  language: English
  quote_policy: summarized
