canonical_text:
  quote: Krishna, has, with Rama, cast off his body and ascended to Heaven.
  summary: Arjuna approaches Vyasa in grief. Vyasa questions him about possible causes
    of dejection. Arjuna reports that Krishna and Rama have left their bodies and
    ascended, that the Vrishni, Bhoja, and Andhaka heroes destroyed one another at
    Prabhasa through curse-born weapons and Eraka grass, and that Abhiras carried
    away Vrishni women while Arjuna found his bow, weapons, and strength failing.
    He laments Krishna's absence and asks Vyasa what is good for him now.
  language: English
  quote_policy: quoted
