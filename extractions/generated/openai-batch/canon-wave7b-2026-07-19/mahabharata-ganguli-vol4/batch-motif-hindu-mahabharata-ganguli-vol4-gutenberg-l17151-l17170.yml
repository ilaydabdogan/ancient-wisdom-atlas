canonical_text:
  quote: ''
  summary: Yudhishthira asks how the doctrine that abstention from injury is the highest
    religion can be reconciled with meat offerings in Sraddhas performed for the Pitris.
    He states that meat cannot be obtained without killing a living creature and asks
    for a detailed account of the faults and merits connected with eating, killing,
    procuring, and offering meat, as well as conduct leading to longevity, strength,
    faultless limbs, and auspicious bodily signs.
