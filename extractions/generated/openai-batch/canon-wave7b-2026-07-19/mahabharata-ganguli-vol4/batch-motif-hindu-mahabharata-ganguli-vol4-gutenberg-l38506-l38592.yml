canonical_text:
  quote: "“the embodied form of Time (death) every day wandered about their houses”"
  summary: Vaishampayana narrates that Time or Death appears among the Vrishnis and
    Andhakas while numerous ominous disturbances occur in homes, animals, ritual life,
    celestial signs, dreams, and heroic emblems. Krishna interprets the calendrical
    omen as resembling the time of the great Bharata battle and as fulfilling Gandhari’s
    words, then commands the Yadavas to go on pilgrimage to the sacred waters at the
    sea-coast. Further dreams and supernatural removals of weapons, car, and standards
    precede the Yadavas’ departure to Prabhasa with their families and provisions.
  language: English
  quote_policy: quoted
