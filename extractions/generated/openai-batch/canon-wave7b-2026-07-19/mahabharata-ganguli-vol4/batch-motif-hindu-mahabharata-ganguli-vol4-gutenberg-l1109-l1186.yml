canonical_text:
  quote: ''
  summary: Yudhisthira asks Bhishma what becomes of those who promise gifts to Brahmanas
    but fail to give them. Bhishma answers that such failure makes hopes and religious
    acts fruitless, cites an old narrative of a jackal and an ape reborn after moral
    faults involving Brahmanas, and concludes with warnings and praise concerning
    gifts, Brahmanas, and future reward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhisthira asks Bhishma about men who promise gifts to Brahmanas but do not
    give them, and asks what duties apply in that matter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma says that a person who promises and does not give will see hopes become
    fruitless, and that the person's good acts, libations, gifts, and penances become
    fruitless.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Bhishma reports an opinion that such a person may be cleansed by giving away
    a thousand horses with dark-hued ears.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bhishma introduces an old narrative about a jackal and an ape who had formerly
    been human friends and after death became those animal forms.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The ape sees the jackal eating a putrid animal carcass in a crematorium and
    asks what former sin led to that condition.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The jackal says that in a former life he promised to give to a Brahmana but
    did not make the gift, and that this sin caused his present wretched existence
    and food.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The ape says that in a former life he appropriated fruits belonging to Brahmanas
    and therefore became an ape.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The ape states a rule that one should not appropriate what belongs to Brahmanas,
    should avoid disputes with them, and should make promised gifts to them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bhishma says he heard this teaching from his preceptor and from Krishna while
    they discoursed on Brahmanas.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Bhishma says that a Brahmana whose expectation has been raised is like a blazing
    fire, and that a man on whom such a Brahmana casts his eye is consumed like straw
    by fire.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Bhishma says that a gratified Brahmana benefits a king like a physician and
    maintains the king's descendants, animals, relatives, officers, city, and provinces.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Bhishma says that keeping a promise to a Brahmana helps one attain a respectable
    or happy next birth, and that gifts to Brahmanas lead to the highest heaven and
    support the deities and pitris.
  category: speech
  evidence_refs:
  - ev:11
