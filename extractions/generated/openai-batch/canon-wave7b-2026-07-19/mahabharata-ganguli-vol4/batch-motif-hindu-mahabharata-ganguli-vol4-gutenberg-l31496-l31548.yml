canonical_text:
  quote: "“Raivataka presented a most charming prospect like Meru with all his jewels
    and gems.”"
  summary: Janamejaya asks what Govinda did after granting a boon to Utanka. Vaisampayana
    narrates that Govinda/Krishna, accompanied by Satyaki, travels to Dwaraka during
    the festival of Raivataka. The Raivataka hill is lavishly adorned with gems, garlands,
    lamps, flags, music, shops, food, wine, gifts, sacred abodes, and celebrating
    people. Krishna is welcomed by his kin, salutes his parents, rests, and recounts
    the chief incidents of the great battle.
  language: English
  quote_policy: quoted
