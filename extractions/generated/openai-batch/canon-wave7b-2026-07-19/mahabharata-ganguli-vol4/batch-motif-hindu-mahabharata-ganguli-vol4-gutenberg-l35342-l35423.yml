canonical_text:
  quote: ''
  summary: The passage opens Book 15 with an invocation, then frames Janamejaya's
    question about how the Pandavas treated Dhritarashtra and Gandhari after regaining
    the kingdom. Vaisampayana answers that the Pandavas ruled while placing Dhritarashtra
    at their head, honoring and serving him and Gandhari with deference, gifts, counsel,
    and household attendance. Dhritarashtra retains acts of royal authority, while
    Bhimasena remains an exception because he remembers the wrongs arising from the
    dice match.
  language: English
  quote_policy: summarized
