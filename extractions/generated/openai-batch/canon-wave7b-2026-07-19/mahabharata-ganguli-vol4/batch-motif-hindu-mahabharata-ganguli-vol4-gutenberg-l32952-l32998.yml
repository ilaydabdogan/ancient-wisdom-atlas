canonical_text:
  quote: ''
  summary: Vaisampayana narrates a battlefield scene in which a grieving queen sits
    beside her fallen husband while Vabhruvahana regains consciousness. Vabhruvahana
    laments that he has slain his father Arjuna/Dhananjaya in battle, asks Brahmanas
    for expiation, proposes severe penance, speaks of following his father in death,
    touches water, invokes witnesses, and vows to starve himself unless his father
    rises again.
  language: English
  quote_policy: summarized
