  quote: ''
  summary: The passage catalogs a sequence of year-long fasting observances in which
    a man fasts for increasing numbers of days and then eats ghee or a single meal
    on the following day. These practices, often joined with libations on a sacred
    fire and ethical restraints, lead to residence in regions of named deities, cosmic
    vision, celestial vehicles, attendants such as Apsaras and Gandharvas, nectar
    or ambrosia, and very long periods of happiness.
