canonical_text:
  quote: ''
  summary: Janamejaya asks how Yudhishthira obtained the wealth buried in the Earth
    by Marutta. Vaisampayana narrates that Yudhishthira summoned his brothers, recalled
    the counsel of Krishna, Vyasa, Bhishma, and Govinda, and asked how the treasure
    should be brought. Bhima approved the plan, saying the wealth would enable the
    sacrifice and that the Pandavas should worship Girisa/Maheswara so that the Kinnaras
    guarding the treasure would yield. The Pandavas resolved to go, marched under
    the Dhruba constellation/day, received blessings, worshipped Maheswara with offerings,
    bowed to Brahmanas, took permission from elders, left Yuyutsu in the capital,
    and set out.
  language: English
  quote_policy: summarized
