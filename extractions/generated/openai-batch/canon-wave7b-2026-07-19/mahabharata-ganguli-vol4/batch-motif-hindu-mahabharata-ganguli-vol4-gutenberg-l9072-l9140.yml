  text: Chyavana ascended a car and told Kusika and his wife to bear him; Kusika obeyed
    without scruple.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Chyavana says gifts of wealth also failed to provoke Kusika's anger.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Chyavana says he created a forest by Yoga power so Kusika and his queen could
    see a foretaste of heaven while still in earthly bodies.
  category: setting
  evidence_refs:
