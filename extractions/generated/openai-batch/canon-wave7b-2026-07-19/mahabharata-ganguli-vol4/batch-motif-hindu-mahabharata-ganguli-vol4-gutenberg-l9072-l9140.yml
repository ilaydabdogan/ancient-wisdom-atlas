  text: Chyavana says he knew Kusika desired Brahmana status and the merit of penances,
    even above earthly or heavenly sovereignty.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Chyavana predicts that a Brahmana named after Kusika will arise from him and
