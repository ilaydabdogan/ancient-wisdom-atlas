  text: Chyavana says he heard the Grandsire Brahman speak at an assembly of deities
    about a future contention between Brahmana and Kshatriya energy and an intermixture
    in Brahman's race.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chyavana says he came to Kusika's palace resolved to exterminate Kusika's
    race and consume his descendants to ashes.
