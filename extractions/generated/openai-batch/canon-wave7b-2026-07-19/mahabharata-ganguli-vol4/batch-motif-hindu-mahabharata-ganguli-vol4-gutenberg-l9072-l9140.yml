canonical_text:
  quote: ''
  summary: Chyavana explains to King Kusika that he came after hearing Brahman's prophecy
    about Brahmana and Kshatriya energies and initially intended to destroy Kusika's
    line. He describes a series of tests meant to provoke anger or fault in Kusika
    and his wife. Because they remained obedient and unangered, Chyavana created a
    Yoga-made forest giving them a foretaste of heaven, disclosed Kusika's desire
    for Brahmana status in his lineage, and prophesied that a future descendant would
    attain Brahmanahood and ascetic power. Kusika asks for that boon.
  language: English
  quote_policy: summarized
