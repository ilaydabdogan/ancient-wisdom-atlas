canonical_text:
  quote: meeting between the hallowed dead and living human beings
  summary: Vaisampayana recounts a night in which warriors and relatives meet joyfully,
    abandon enmity, and are reconciled. The departed then disappear by plunging into
    the sacred Bhagirathi and proceed to various divine regions. Vyasa instructs widowed
    Kshatriya women who wish to attain their husbands' regions to enter the river;
    they shed mortal bodies, gain celestial forms, and join their husbands. The passage
    ends by promising benefits to those who hear or recite the narrative.
  language: English
  quote_policy: quoted
