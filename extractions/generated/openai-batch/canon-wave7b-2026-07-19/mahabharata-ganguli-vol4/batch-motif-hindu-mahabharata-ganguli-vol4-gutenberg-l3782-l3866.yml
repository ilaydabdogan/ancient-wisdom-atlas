canonical_text:
  quote: Thou art the sovereign of the entire universe.
  summary: A hymnic catalogue addresses a divine addressee as invisible yet knowable,
    omniscient, sovereign, present in many gods and cosmic beings, beyond attributes,
    source and container of creatures, associated with mountains, waters, trees, fire,
    wind, animals, protection, yoga, food, life-breaths, and the fruits of righteousness
    and sin.
  language: English
  quote_policy: quoted
