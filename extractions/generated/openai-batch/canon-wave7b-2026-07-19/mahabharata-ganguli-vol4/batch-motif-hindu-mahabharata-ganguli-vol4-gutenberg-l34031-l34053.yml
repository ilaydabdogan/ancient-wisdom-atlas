canonical_text:
  quote: This great sacrifice however, is not equal to those grains.
  summary: A mongoose explains that a truthful Brahmana's gift of powdered barley
    and penances made half its body golden, while the Kuru king's great Horse-sacrifice
    did not complete the transformation. The mongoose declares the barley gift superior
    to the sacrifice and disappears. Vaisampayana then tells the king not to overvalue
    sacrifice, since penance, non-injury, truthfulness, gifts, and other virtues equal
    sacrifice in merit.
  language: English
  quote_policy: quoted
