canonical_text:
  quote: ''
  summary: Krishna recounts bowing joyfully to Sankara/Mahadeva and asking for boons.
    Sankara grants the requests. Uma, described as mother of the universe and spouse
    of Sarva, says Mahadeva has granted Krishna a son named Samva and offers eight
    further boons. Krishna requests blessings involving Brahmanas, parents, sons,
    enjoyments, family love, peace, and skill. Uma affirms and grants additional prosperity,
    affection, beauty, wives, and daily hospitality. The god and goddess disappear
    with their Ganas, and Upamanyu praises Sarva as unequalled.
  language: English
  quote_policy: summarized
