canonical_text:
  quote: ''
  summary: Yudhishthira asks about conduct leading to heaven or hell, what accompanies
    a person after death, and how rebirth, conception, and embodiment occur. Bhishma
    directs him to Vrihaspati, who arrives from the firmament and teaches that kin
    abandon the dead body, while Righteousness alone follows the deceased. Vrihaspati
    describes cosmic witnesses to merit and demerit, the Jiva attaining another body,
    and the role of elements, vital seed, and male-female union in conception and
    bodily growth.
  language: English
  quote_policy: summarized
