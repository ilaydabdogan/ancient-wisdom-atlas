candidate_motifs:
- id: motif:1
  label: Sacred cattle as refuge, merit, and purifier
  taxonomy_refs: []
  basis: Kine are repeatedly described as the stay and refuge of creatures, embodiments
    of merit, sacred, sanctifying, and efficacious cleansers.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:12
  confidence: high
  cautions: This is a passage-internal motif label; no external taxonomy reference
    is assigned.
- id: motif:2
  label: Divine boon grants animal attribute
  taxonomy_refs: []
  basis: Formerly hornless kine adore Brahman and receive what they desire, after
    which their horns grow.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The transformation is limited to the acquisition of horns and is not treated
    as general shapeshifting.
- id: motif:3
  label: Gift of sacred cattle earns heavenly reward
  taxonomy_refs:
  - sacred_exchange
  - afterlife_journey_map
  basis: Givers of kine are praised as righteous and are said to attain the sacred
    region of kine, a richly described place of beauty, abundance, and enjoyment.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage describes attainment of a region, not a detailed journey itinerary.
- id: motif:4
  label: Paradisal jeweled landscape for the righteous
  taxonomy_refs:
  - afterlife_journey_map
  basis: The region contains gem soil, gold sand, shining waters, lotus lakes, jeweled
    and golden trees and mountains, fragrant flowers, sweet fruits, beautiful vehicles,
    music, and dance.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The paradisal landscape is specifically tied here to the reward for gifting
    kine.
- id: motif:5
  label: Reverent care of sacred animals confers boons
  taxonomy_refs:
  - sacred_exchange
  basis: Serving kine with reverence and humility and avoiding injury to them is said
    to bring boons and felicity from gratified kine.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The exchange is devotional and ethical rather than a single commercial
    transaction.
- id: motif:6
  label: Purification through cow-derived substances and ghee-fire rite
  taxonomy_refs:
  - sacrifice
  basis: The passage prescribes drinking cow urine, milk, and ghee; bearing ghee on
    the head; pouring ghee on sacred fire; giving and eating ghee; and using cow-dung
    barley gruel for expiation.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The rite combines austerity, offering, gift, and diet; it should not be
    reduced to fire sacrifice alone.
- id: motif:7
  label: Expiation restores lost divine status
  taxonomy_refs: []
  basis: After defeat by Daityas, the deities practice the stated expiation and regain
    their position, strength, and success.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The restoration is not described as death and resurrection; it is a return
    of status and power.
- id: motif:8
  label: Mantra recitation for purification and cow veneration
  taxonomy_refs: []
  basis: The passage prescribes Prajapati-declared mantras concerning kine and mental
    recitation of Gomati mantras after touching pure water while living among kine.
  evidence_refs:
  - ev:6
  - ev:12
  confidence: medium
  cautions: The specific ritual details are only partially present because the supplied
    passage ends mid-sentence.
