canonical_text:
  quote: ''
  summary: Vyasa teaches Yudhishthira about the sanctity of kine, their acquisition
    of horns through adoration of Brahman, the merit of gifting and serving them,
    the paradisal region attained by givers of kine, and several rites of purification
    involving cow products, ghee, fire, Brahmanas, mantras, and pure water. The passage
    also says deities once practiced a cow-dung barley-gruel expiation after defeat
    by Daityas and thereby regained divine status and strength.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vyasa says that kine are the stay and refuge of all creatures, embodiments
    of merit, sacred, and sanctifiers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that kine were formerly hornless.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: For the purpose of obtaining horns, the kine adored the eternal and puissant
    Brahman while sitting in praya.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Brahman granted each cow what it desired, after which their horns grew and
    they appeared in diverse colors with horns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Kine are described as auspicious, as yielders of Havya and Kavya, and as excellent
    embodiments of merit and energy.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage praises the gift of kine and says that people who give kine without
    pride are righteous and attain the sacred region of kine.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sacred region of kine is described as having sweet-fruit trees, excellent
    flowers, gem soil, gold sands, favorable qualities of every season, and no mire
    or dust.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The region includes resplendent streams, lotus-bearing lakes, jewels, gems,
    gold, flowering forests, and creepers.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The region has trees, hills, eminences, and mountains made of or decked with
    gold, jewels, and gems; some trees display the splendor of fire.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Righteous persons sport in that region in joy, free from grief and wrath,
    with the fruition of every wish, and move about on beautiful vehicles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bands of Apsaras amuse the righteous persons in that region with music and
    dance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The regions attained by givers of kine are said to have Pushan and the Maruts
    as their lords, and the cow-giver is said to attain affluence like Varuna.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage instructs one to recite mantras declared by Prajapati in respect
    of kine.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Serving kine with reverence and humility is said to obtain invaluable boons
    from gratified kine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage instructs that one should not injure kine, should confer happiness
    on them, and should worship them with bows of the head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: 'A ritual sequence is given: drink hot cow urine for three days, hot cow milk
    for three days, hot ghee for three days, and then subsist on air for three days.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Ghee is described as a most sacred thing and is to be borne on the head after
    the stated sequence.
  category: object
  evidence_refs:
  - ev:8
- id: obs:18
  text: The passage instructs one to pour ghee libations on sacred fire, give ghee
    so that a Brahmana utters benedictions, eat ghee, and give ghee.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: Subsisting for a month on barley gruel picked from cow dung is said to cleanse
    sins as grave as the slaughter of a Brahmana.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: After defeat by the Daityas, the deities practiced the expiation and regained
    divine position, strength, and success.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:21
  text: The passage says that gifts of kine to Brahmanas lead to Heaven and that Gomati
    mantras should be mentally recited after touching pure water while living among
    kine.
  category: action
  evidence_refs:
  - ev:12
