canonical_text:
  quote: ''
  summary: After Vipula rebukes Sakra, Sakra becomes invisible and departs in shame.
    Devasarman returns from completing a sacrifice; Vipula returns Devasarman's protected
    wife to him, salutes his preceptor, and reports Sakra's actions. Devasarman praises
    Vipula's conduct, devotion, penances, observances, and virtue, and grants him
    a boon that he will never fall away from righteousness. Vipula departs to practice
    severe austerities, while Devasarman and his wife dwell fearlessly in solitary
    woods.
