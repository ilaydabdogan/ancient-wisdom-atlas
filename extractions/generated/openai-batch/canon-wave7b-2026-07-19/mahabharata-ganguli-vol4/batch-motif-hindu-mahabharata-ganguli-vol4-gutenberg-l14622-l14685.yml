canonical_text:
  quote: ''
  summary: The passage gives prescriptive teaching on donating lights, avoiding darkness
    and hell, and the benefits or penalties attached to the use, theft, or extinguishing
    of lights. It then explains Vali food offerings to deities, Yakshas, Rakshasas,
    Nagas, spirits, guests, the homeless, Brahmanas, children, Pitris, and household
    deities, including specific suitable offerings and reciprocal blessings. It closes
    with a chain of transmission from Kavi of Bhrigu's race to Vali, Manu, Suvarna,
    Narada, and the present speaker.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Light is described as having upward motion and as energy; the gift of light
    is said to enhance human energy.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hell named Andhatamas and the sun's southward course are associated with
    darkness; giving lights during the sun's northward course is recommended for escaping
    those forms of darkness.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Offered lights are said to have given deities beauty, energy, and resplendence,
    while Rakshasas are said to have opposite attributes through abstention from such
    an act.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage forbids stealing or extinguishing lights given by others and says
    that a light-thief becomes blind, gropes through darkness in the next world, and
    lacks resplendence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lights burning ghee are ranked as best; fat, marrow, and juice from bones
    of creatures are rejected as light fuel for one seeking advancement and prosperity.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Lights are recommended at mountain descents, forest roads, inaccessible regions,
    sacred trees within human settlements, and street crossings.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The giver of lights is said to illumine his race, attain purity and effulgence,
    and after death reach companionship with luminous bodies in the firmament.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Vali offerings are described as being made to deities, Yakshas, Uragas, human
    beings, spirits, and Rakshasas.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Those who eat without first serving Brahmanas, deities, guests, and children
    are identified as Rakshasas.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Food offerings by householders are said to support deities, Pitris, Yakshas,
    Rakshasas, Pannagas, guests, and homeless persons, and the gratified recipients
    return longevity, fame, and wealth to the offerer.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'Different offerings are assigned to different recipient classes: clean food
    with milk, curds, flowers for deities; blood, meat, wines, spirits, and fried
    paddy for Yakshas and Rakshasas; lotuses and Utpalas for Nagas; sesame seeds boiled
    in raw sugar for spirits and other unearthly beings.'
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: The first portion of food is to be offered to deities before eating; household
    deities are said to make a house blaze with beauty.
  category: action
  evidence_refs:
  - ev:7
