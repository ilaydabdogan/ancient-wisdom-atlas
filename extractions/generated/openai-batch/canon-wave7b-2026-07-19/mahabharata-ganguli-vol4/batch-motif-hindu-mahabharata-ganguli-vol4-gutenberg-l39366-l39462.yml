canonical_text:
  quote: ''
  summary: Shakra invites Yudhishthira to ascend to Heaven in a celestial car. Yudhishthira
    first asks that his fallen brothers and Draupadi accompany him, then refuses to
    abandon a devoted dog despite repeated heavenly inducements. The dog transforms
    into Dharma, who praises Yudhishthira's compassion and confirms his heavenly reward.
    Yudhishthira ascends to Heaven in his own body among the gods, while Narada praises
    the uniqueness of this achievement; Yudhishthira still asks to go where his brothers
    are.
  language: English
  quote_policy: summarized
