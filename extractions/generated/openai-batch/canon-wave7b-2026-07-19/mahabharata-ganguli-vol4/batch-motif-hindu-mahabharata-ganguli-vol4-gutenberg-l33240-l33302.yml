canonical_text:
  quote: ''
  summary: Vaisampayana narrates that the son of Sakuni leads Gandhara forces against
    Arjuna and the sacrificial horse. The Gandharas reject peaceful words, surround
    the steed, and are routed by Arjuna. Arjuna warns the Gandhara ruler that he does
    not intend to kill kings under Yudhishthira's command, demonstrates this by cutting
    off the ruler's head-gear rather than his head, and later receives the ruler's
    mother and ministers with an Arghya. Arjuna honors the mother, spares the ruler
    for the sake of Gandhari and Dhritarashtra, orders hostilities to cease, and invites
    him to Yudhishthira's Horse-sacrifice at the full moon of Chaitra.
  language: English
  quote_policy: summarized
