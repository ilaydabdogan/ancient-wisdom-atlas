canonical_text:
  quote: ''
  summary: A series of speakers recounts boons granted by Mahadeva/Maheswara after
    penance, sacrifice, desire, or adoration. The boons include invincibility, devotion,
    sovereignty attributes, knowledge of Time, sons and long life, a remarkable son,
    release from unjust impalement, heavenly felicity, and freedom from death for
    Galava and his parents. Yudhishthira is amazed after hearing these accounts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Krishna says Mahadeva was gratified by his penances and granted him boons
    including dearness to all persons, invincibility in battle, and energy equal to
    Fire.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Krishna says that in a former incarnation he adored Mahadeva on Manimantha
    mountain for millions of years and asked that his devotion to Mahadeva remain
    unchanged.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Jaigishavya says Mahadeva found him in Varanasi and conferred the eight attributes
    of sovereignty on him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Garga says that after his mental sacrifice on the banks of the Saraswati,
    the great God bestowed knowledge of Time with sixty-four branches, a thousand
    Veda-knowing sons, and long lives.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Parasara says he desired a son with ascetic merit, superior energy, Yoga,
    fame, Vedic devotion, and compassion; Maheswara promised him a son named Krishna
    with specified future roles and immortality.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mandavya says he was wrongly suspected of theft and impaled, then adored Mahadeva,
    who promised release from impalement, freedom from pain, disease, and affliction,
    access to sacred waters, and heavenly felicity after bodily dissolution.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In Mandavya's account, Maheswara is described as having a bull for his vehicle,
    unrivalled splendour, animal skin clothing, and associates.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Galava says he studied under Viswamitra and returned home; his widowed mother
    lamented that his father would not see him after his studies.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Galava says he worshipped Maheswara, received a promise that his father, mother,
    and he would be freed from death, and then returned home and saw his father coming
    out after daily sacrifice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Vaisampayana says Yudhishthira became amazed after hearing the ascetics recite
    Mahadeva's marvellous feats, and Krishna spoke again to him.
  category: sequence
  evidence_refs:
  - ev:7
