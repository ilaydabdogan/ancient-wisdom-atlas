canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma where the goddess of prosperity resides. Bhishma
    recounts Rukmini asking Sree whom she favors and avoids. Sree answers with lists
    of personal virtues, vices, women’s conduct, ritual households, natural places,
    social orders, and finally Narayana as her stable dwelling.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yudhishthira asks Bhishma to identify the kind of man or woman in whom the
    goddess of prosperity always resides.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bhishma frames his answer as a narrated event in which Rukmini questions the
    goddess of prosperity in the presence of Devaki's son.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The goddess of prosperity is described as blazing with beauty, lotus-complexioned,
    and moon-faced.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sree says she resides with eloquent, active, attentive, controlled, grateful,
    deity-worshipping, high-minded persons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sree says she does not reside with inattentive, unbelieving, lustful, ungrateful,
    impure, harsh-speaking, thieving, malicious, weak, irritable, wrathful, or hypocritical
    persons.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sree says she resides with people who observe their order's duties, know righteousness,
    serve the aged, control passions, have cleansed souls, practice forgiveness, and
    act promptly.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Sree distinguishes women she favors, including forgiving, self-restrained,
    truthful, sincere, deity-worshipping, husband-devoted, well-behaved, ornamented,
    well-clothed, accomplished women.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Sree distinguishes women she avoids, including those neglecting household
    furniture and provisions, opposing their husbands' wishes, immodest visitors of
    others' houses, unclean, impatient, quarrelsome, and given to sleep or lying down.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Sree says she resides in conveyances and draft animals, maidens, ornaments,
    good garments, sacrifices, rain-clouds, full-blown lotuses, autumn stars, elephants,
    cow pens, good seats, lotus lakes, rivers, bulls, kings, thrones, and good men.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Sree says she resides in a house where libations are poured on sacrificial
    fire and kine, Brahmanas, and deities are worshipped, and where offerings are
    made to deities at the proper time.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Sree says she resides in Brahmanas studying the Vedas, Kshatriyas observing
    righteousness, Vaisyas devoted to cultivation, and Sudras serving the three upper
