  text: Dhritarashtra tells Yudhishthira to ascertain the Mandalas belonging to himself,
    foes, neutrals, those equally disposed, Atatayins, allies, and allies of foes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ministers, provincial people, fort garrisons, and forces are named as concerns
    of kings that may be tampered with.
  category: object
