canonical_text:
  quote: ''
  summary: 'Dhritarashtra instructs Yudhishthira on royal statecraft: discerning political
    mandalas, guarding state elements, choosing war or peace by relative strength,
    managing treaties and hostages, protecting vulnerable subjects, dealing with chieftains
    and stronger or weaker kings, and, if overwhelmed, sacrificing resources and life
    to attain release from sorrow.'
  language: English
  quote_policy: summarized
