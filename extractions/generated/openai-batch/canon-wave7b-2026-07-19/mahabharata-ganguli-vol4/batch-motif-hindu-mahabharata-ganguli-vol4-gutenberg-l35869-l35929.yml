  text: The six incidents are listed as peace, war, march, halt, sowing dissensions,
    and conciliation.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A king is instructed to wage war when his own side is strong and the foe is
    weak, and to seek peace when the enemy is strong and his own side is weak.
  category: sequence
  evidence_refs:
  - ev:3
