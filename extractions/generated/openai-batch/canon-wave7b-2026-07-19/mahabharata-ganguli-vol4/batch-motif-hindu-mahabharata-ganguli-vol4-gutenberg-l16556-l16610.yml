canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma about the highest fruit of fasts. Bhishma answers
    with a teaching attributed to the Self-born, listing monthly twelfth-day fasts
    in which Krishna is worshipped under different names; each observance is said
    to yield the merit of a major sacrifice or other benefits such as purification,
    heavenly regions, joy with Apsaras, a heavenly car, wealth, memory of past births,
    or identity with the deity. The vow concludes with feeding Brahmanas or giving
    ghee, and Vishnu is cited as saying no fast has superior merit.
  language: English
  quote_policy: summarized
