canonical_text:
  quote: The fire that issued from my mouth and that resembles the all-consuming Yuga-fire
    in splendour
  summary: Vasudeva explains to assembled ascetics that a fire issued from his mouth
    during ascetic vows, scorched a mountain, traveled to the Grandsire, and returned
    after a prophecy that half the energy of a bull-bannered great god would be born
    as his son. Vasudeva then asks the ascetics for a wondrous account, and they appoint
    Narada to narrate an incident on Himavat witnessed during pilgrimage.
  language: English
  quote_policy: quoted
