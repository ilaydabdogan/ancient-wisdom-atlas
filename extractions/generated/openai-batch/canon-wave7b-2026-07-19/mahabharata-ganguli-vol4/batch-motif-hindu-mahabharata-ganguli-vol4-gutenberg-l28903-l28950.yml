canonical_text:
  quote: ''
  summary: The Brahmana teaches that a single inner ruler, preceptor, kinsman, dispeller,
    and enemy resides in the heart. He recounts an ancient story in which the Lord
    of all creatures instructs snakes, deities, Rishis, and Asuras with the single
    syllable Om; each group then adopts a different disposition. The passage closes
    by describing conduct, self-restraint, Brahmacharya, and refuge in Brahman.
  language: English
  quote_policy: summarized
