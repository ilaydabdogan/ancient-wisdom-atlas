canonical_text:
  quote: The time has now arrived, when thou must fight the battle which each must
    fight single-handed with his mind.
  summary: Vasudeva explains physical and mental ailments, bodily humours, and mental
    attributes as matters of balance. He tells the royal addressee not to dwell on
    past sorrows and humiliations, but to undertake a solitary struggle against his
    own mind and then administer the kingdom with wisdom.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Vasudeva says there are two kinds of ailments, physical and mental, produced
    through mutual action of body and mind.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage names cold, warm, and windy humours for the body, and Sattwa,
    Rajas, and Tamas as attributes of the soul; due proportion indicates health, while
    preponderance calls for remedy.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Happiness and sorrow are described as states that can overcome one another,
    and people are said to recall one state while experiencing the other.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The addressee is told that he does not desire to recall either sorrows or
    happiness, and may be overpowered by innate nature or delusion of sorrow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vasudeva lists painful past events, including Krishna in the assembly, departure
    and exile, forest wandering, affliction from Jatasura, a fight with Chitrasena,
    troubles from the Saindhavas, Kichaka kicking Draupadi, and fights involving Drona
    and Bhishma.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The addressee is told that the time has arrived to fight a single-handed battle
    with his mind and to carry on the struggle by abstraction and his own Karma.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The inner battle is said to require no missiles, friends, or attendants; defeat
    in it would lead to a wretched plight, while knowing and acting accordingly leads
    to success.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The addressee is instructed to know the wisdom and destiny of creatures, follow
    ancestral conduct, and administer the kingdom.
  category: action
  evidence_refs:
  - ev:7
