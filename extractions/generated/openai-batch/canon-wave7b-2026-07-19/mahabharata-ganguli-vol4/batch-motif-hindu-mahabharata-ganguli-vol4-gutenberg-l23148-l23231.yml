canonical_text:
  quote: ''
  summary: Vasudeva says he will recite the Sata-rudriya connected with Kapardin/Sankara.
    The passage praises Mahadeva as supreme creator and describes his terrible battle
    power. It recounts his wrath at Daksha's sacrifice, the cosmic disturbance that
    follows, the wounding of Bhaga and Pushan, the gods' propitiation through Sata-rudriya
    praise, and the restoration of the sacrifice. It then recounts Rudra destroying
    the Asuras' three aerial cities with a composite divine weapon. Finally, Mahadeva
    appears as a child on Parvati's lap, paralyzes Indra's thunderbolt-bearing arm
    when attacked, and is recognized by Brahma.
  language: English
  quote_policy: summarized
