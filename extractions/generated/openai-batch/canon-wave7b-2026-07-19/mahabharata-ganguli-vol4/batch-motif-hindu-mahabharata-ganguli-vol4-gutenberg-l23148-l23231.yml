- id: motif:2
  label: Wrathful deity disrupts and restores sacrifice
  taxonomy_refs:
  - sacrifice
  basis: Bhava pierces the embodied sacrifice after Daksha's slight, and the sacrifice
    is later reunited and healed after Rudra is praised and gratified.
  evidence_refs:
  - ev:4
  - ev:5
