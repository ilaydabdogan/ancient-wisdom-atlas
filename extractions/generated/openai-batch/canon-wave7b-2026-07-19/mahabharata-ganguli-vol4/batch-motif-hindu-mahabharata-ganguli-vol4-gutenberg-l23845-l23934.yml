canonical_text:
  quote: ''
  summary: After recovering the kingdom, Yudhishthira is installed as king, consoles
    bereaved women, and prepares for Bhishma's appointed time of departure. When the
    sun begins its northward course, he goes with kin, counselors, priests, cremation
    materials, and Bhishma's sacrificial fires to the place where Bhishma lies on
    a bed of arrows. Bhishma opens his eyes, notes the calendrical moment and the
    time he has lain on the arrows, and counsels Dhritarashtra not to grieve for his
    fallen sons.
  language: English
  quote_policy: summarized
