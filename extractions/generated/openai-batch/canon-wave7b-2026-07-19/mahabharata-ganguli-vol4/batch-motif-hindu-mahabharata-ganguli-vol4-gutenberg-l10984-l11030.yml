canonical_text:
  quote: ''
  summary: A fragmentary ending has Yama, the judge of the dead, bless or affirm the
    merit of gifts and permit a speaker to leave his dominions. In Section LXXII,
    Yudhishthira asks Bhishma for details about the regions reserved for givers of
    kine, recalling Nachiketa, Nriga's lizard-form affliction, and Krishna's rescue
    of Nriga. Bhishma introduces an old discourse between the lotus-born Grandsire
    and Sakra. Sakra asks why residents of the region of kine outshine heaven's denizens
    and asks about the fruits, duration, equivalences, substitutions, and Dakshina
    connected with gifts of kine.
  language: English
