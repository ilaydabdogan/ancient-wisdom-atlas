canonical_text:
  quote: ''
  summary: A successful Rishi instructs a learned Brahmana on the supreme sanctity
    of Bhagirathi/Ganga. The passage states that dwelling by, bathing in, drinking,
    seeing, touching, or otherwise using Ganga water produces merit, removes sins,
    grants heavenly status, rescues sinners from hell, and surpasses many sacrifices
    and austerities. It also describes Ganga through comparisons with cosmic, ritual,
    and celestial goods and ends with imagery of her banks, birds, waters, and pastures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker states that countries, provinces, retreats, and mountains through
    which or beside which Bhagirathi flows should be regarded as foremost in sanctity.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Living beside Bhagirathi and bathing in her waters are said to attain the
    same end otherwise reached by penance, Brahmacharyya, sacrifices, or renunciation.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Creatures whose bodies are sprinkled with Ganga water or whose bones lie in
    her channel are described as not falling away from heaven; a person is respected
    in heaven while his bones remain in the channel.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: People who use Ganga water in their acts, and people who turn to residence
    beside Ganga after earlier sins, are said to ascend to heaven or attain a superior
    end.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Bathing in Ganga, drinking Ganga water, or living beside Ganga is repeatedly
