  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: For sinful people, Ganga is called fame, protection, rescue, refuge, and cover;
    sinners about to sink into hell are described as rescued by Ganga if they seek
    her aid later in life.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Daily plungers into Ganga are said to become equal to great Munis and deities,
    and sinful people who dwell beside Ganga are said to become righteous and good.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ganga water is compared to Amrita for deities, Swadha for Pitris, and Sudha
