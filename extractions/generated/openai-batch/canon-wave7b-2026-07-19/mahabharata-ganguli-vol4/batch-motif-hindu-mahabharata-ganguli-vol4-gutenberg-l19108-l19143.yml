canonical_text:
  quote: Gifts, therefore, should be known to be of five kinds.
  summary: 'Yudhishthira asks Bhishma to explain the kinds, fruits, reasons, and proper
    recipients of gifts. Bhishma teaches that gifts are of five kinds, distinguished
    by motive: desire of merit, desire of profit, fear, free choice, and pity. He
    gives recipient examples for each and concludes that gifts increase merit and
    fame and should be made according to one''s power.'
  language: English
  quote_policy: quoted
