canonical_text:
  quote: '"The Kshatriya, assisted by the Brahmana rules all creatures!"'
  summary: 'Yudhishthira asks Bhishma about the reward attached to worshipping Brahmanas.
    Bhishma answers by citing an old narrative concerning Pavana and Arjuna: Kartavirya
    Arjuna, a world-ruling Haihaya king, gives wealth to the Rishi Dattatreya and
    receives boons, including a thousand arms in battle. After boasting of his power,
    he is corrected by an invisible voice asserting Brahmana superiority. Arjuna disputes
    this and threatens to subordinate Brahmanas. The wind god then warns him from
    the sky to bow to Brahmanas and avoid harming them; Arjuna asks what kind of being
    a superior Brahmana is.'
  language: English
  quote_policy: quoted
