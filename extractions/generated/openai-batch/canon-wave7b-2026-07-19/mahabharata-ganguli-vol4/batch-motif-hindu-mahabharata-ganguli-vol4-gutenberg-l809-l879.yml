canonical_text:
  quote: ''
  summary: Yudhishthira asks whether Exertion or Destiny is more powerful. Bhishma
    answers by recounting an ancient dialogue in which Vasishtha asks Brahma about
    karma acquired in the present life and karma from previous lives. Brahma teaches
    that destiny alone is ineffective without exertion, using seed, soil, fruit, and
    harvest imagery, and argues that beings, prosperity, celestial status, and righteousness
    depend upon action.
  language: English
  quote_policy: summarized
