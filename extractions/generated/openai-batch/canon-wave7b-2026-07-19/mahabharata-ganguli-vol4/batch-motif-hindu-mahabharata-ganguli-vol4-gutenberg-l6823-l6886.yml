canonical_text:
  quote: ''
  summary: Bhishma recounts to Yudhishthira an old discourse in which Sakra, disguised
    as an ascetic, asks the Asura Samvara how he became foremost among his race. Samvara
    attributes his superiority to reverence for Brahmanas, obedience to their scriptural
    instruction, and humility before their speech. He recounts Soma's teaching that
    Brahmanas gain success through penance and speech, while kings rely on arms. The
    passage ends by saying Sakra adopted worship of Brahmanas and thereby obtained
    chiefdom among the deities.
  language: English
  quote_policy: summarized
