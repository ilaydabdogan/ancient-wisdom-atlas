  quote: ''
  summary: Bhishma describes the divine creation of the four orders and their duties
    for sacrifice, then gives rules for marriage, offspring status, mixed classes,
    occupational duties, and social exclusion arising from unions across orders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bhishma says that, at the beginning, the Lord of all creatures created the
    four orders and their duties for the sake of sacrifice.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Brahmana is described as able to take four wives, with sons from some wives
    sharing his status and sons from Vaisya or Sudra wives treated as inferior and
    maternally determined in status.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The son of a Brahmana and Sudra wife is called Parasara and is assigned service
    to his father’s race and family.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A Kshatriya, Vaisya, and Sudra are each given different permitted numbers
    of wives, and sons from those unions receive specified statuses including Ugra
    and Sudra.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that a son born from a lower-order man and a superior-order
    woman is outside the four pure orders and censured by them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Named mixed-status sons include Suta, Vaidehaka, Chandala, Vandi or Magadha,
    Nishada, and Ayogava, each with assigned duties or attributes.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: A Chandala is described as born from a Sudra man and Brahmana woman, fierce
    in disposition, living on the outskirts of cities and towns, and assigned the
    duty of public executioner.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: An Ayogava is associated with the duty of a Takshan or carpenter, and Brahmanas
    are told not to accept gifts from such a person.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mixed castes are said to produce children of their own status when marrying
