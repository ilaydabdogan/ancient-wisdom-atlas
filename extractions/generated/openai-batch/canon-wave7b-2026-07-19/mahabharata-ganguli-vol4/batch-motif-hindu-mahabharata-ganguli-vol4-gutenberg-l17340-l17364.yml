canonical_text:
  quote: ''
  summary: The passage describes religious merit associated with abstention from injury,
    meat, honey, and wine; it states that practitioners attain heaven, avoid hell,
    become purified from sin, overcome calamity and illness, avoid animal or bird
    rebirth, and gain human beauty, prosperity, fame, and felicity. The speaker closes
    by saying the subject of abstention from meat and the ordinances of Pravritti
    and Nivritti framed by the Rishis have been explained.
  language: English
