  text: Righteous men who abstain from honey, meat, and wine from birth are regarded
    as Munis.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person who practices abstention from meat or recites it for others to hear
    is said never to go to hell, even if otherwise wicked in conduct.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Reading or hearing sacred ordinances about abstention from meat is said to
