  quote: ''
  summary: Dhritarashtra questions Yudhishthira about the welfare of his kingdom,
    righteous kingship, ritual obligations, social duties, and royal fame. Yudhishthira
    then asks about Dhritarashtra’s peace, his mother’s service in the woods, the
    austerities and grief of an unnamed elder queen, and the whereabouts or welfare
    of Vidura and Sanjaya.
  language: English
  quote_policy: summarized
