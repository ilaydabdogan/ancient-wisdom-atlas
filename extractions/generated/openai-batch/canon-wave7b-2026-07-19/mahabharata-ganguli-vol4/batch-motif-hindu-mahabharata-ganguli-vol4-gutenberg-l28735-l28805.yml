canonical_text:
  quote: Prana and Apana and Udana and Samana and Vyana are the five sacrificing priests.
  summary: The Brahmana explains to his wife why five life-breaths are called the
    five sacrificing priests. The five life-winds each claim precedence by asserting
    that all life-breaths cease or move with them. Brahma rules that none is superior,
    that each has special attributes, and that they should uphold one another.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Brahmana introduces an ancient story about the institution of five sacrificing
    priests and identifies them as Prana, Apana, Udana, Samana, and Vyana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brahmana's wife says her former conviction was that there are seven sacrificing
    priests and asks how the number is five.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Brahmana describes a sequence in which wind nursed by Prana takes birth
    in Apana, then develops through Vyana, Udana, and Samana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The beings ask the first-born Grandsire to say which one among them is foremost
    and will be their chief.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Grandsire states that the foremost one is the one whose extinction makes
    all life-breaths extinct and whose movement makes them move.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Prana, Apana, Vyana, Samana, and Udana each in turn claim to be foremost and
    speak of going into extinction and moving again.
  category: sequence
  evidence_refs:
  - ev:5
