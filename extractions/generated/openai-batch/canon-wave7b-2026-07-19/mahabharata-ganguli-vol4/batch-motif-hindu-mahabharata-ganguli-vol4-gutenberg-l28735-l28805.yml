  category: relationship
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
- id: obs:8
  text: Brahma tells the assembled life-winds that none is superior to the others
    and that all are foremost in their own spheres.
  category: speech
  evidence_refs:
  - ev:9
