canonical_text:
  quote: ''
  summary: Indra asks Vrihaspati why he is distressed. Vrihaspati explains that King
    Marutta will perform a great sacrifice with Samvarta as priest and asks Indra
    to restrain them. Indra sends Agni as messenger to present Vrihaspati as Marutta's
    priest, promising immortality and celestial gains. Marutta refuses, affirming
    Samvarta as his priest. Samvarta threatens to burn Agni if he returns. Agni reports
    back to Indra, who orders a renewed threat with the thunderbolt, but Agni hesitates
    out of fear of Samvarta.
  language: English
  quote_policy: summarized
