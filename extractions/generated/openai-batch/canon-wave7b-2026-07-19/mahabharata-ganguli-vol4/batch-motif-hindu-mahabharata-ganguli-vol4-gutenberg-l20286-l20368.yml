canonical_text:
  quote: '"Endued with merit that arises from mental acts, O goddess, one ascends
    to Heaven."'
  summary: 'Maheswara teaches Uma that mental and ethical conduct bears consequences:
    virtuous restraint, compassion, truthfulness, justice, and devotion lead to Heaven,
    while cruelty, violence, and lack of compassion lead to Hell, short life, and
    suffering. Uma asks why humans differ in lifespan, fortune, birth, appearance,
    wisdom, and pain, and Maheswara answers by describing the fruits of acts, especially
    the consequences of killing or abstaining from harm.'
  language: English
  quote_policy: quoted
