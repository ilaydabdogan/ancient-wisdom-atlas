canonical_text:
  quote: Hearing of the exit of Dhritarashtra from this world, the high-souled Pandavas
    all gave way to great grief.
  summary: Vaisampayana reports that, after hearing of Dhritarashtra's death, the
    Pandavas, the palace women, and the citizens lament. Yudhishthira raises his arms,
    weeps while thinking of his mother Pritha, and then restrains his tears to speak.
    The people grieve that Dhritarashtra, childless in old age, and Gandhari have
    been burnt to death.
  language: English
  quote_policy: quoted
