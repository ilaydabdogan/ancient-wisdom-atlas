canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma who deserves worship, bowing, and faultless conduct.
    Bhishma answers by praising Brahmanas as deserving reverence, as upholders and
    guides of the worlds, as sacrificial and ancestral mediators, as possessors of
    ascetic knowledge, and as beings whose sacred status persists regardless of learning
    or conduct, illustrated through comparisons to fire and clarified butter.
  language: English
  quote_policy: summarized
