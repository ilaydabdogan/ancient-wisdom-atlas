canonical_text:
  quote: The topic is the object that creatures obtain after death as the rewards
    of particular acts or courses of conduct they follow.
  summary: Bhishma explains to the addressed king a catalogue of postmortem and worldly
    rewards produced by penances, vows, austerities, truthful conduct, non-injury,
    worship, sacrifices, and gifts, with special emphasis on gifts of cows, land,
    food, houses, and gold.
  language: English
  quote_policy: quoted
