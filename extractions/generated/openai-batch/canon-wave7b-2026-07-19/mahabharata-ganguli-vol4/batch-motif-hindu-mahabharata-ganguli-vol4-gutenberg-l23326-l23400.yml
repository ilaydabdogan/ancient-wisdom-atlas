canonical_text:
  quote: ''
  summary: Vaisampayana narrates that after Krishna speaks, Yudhishthira asks Bhishma
    whether direct perception or scripture is authoritative. Bhishma critiques exclusive
    reliance on perception or inference, says Brahman is understood through prolonged
    yoga, and advises approaching scripture-cleansed good persons for resolution of
    doubt. Yudhishthira remains perplexed and compares his search for certainty to
    seeking a way across an ocean whose farther shore he cannot see.
  language: English
  quote_policy: summarized
