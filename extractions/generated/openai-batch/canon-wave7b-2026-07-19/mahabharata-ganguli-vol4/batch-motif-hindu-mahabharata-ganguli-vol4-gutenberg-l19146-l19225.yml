canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma to instruct him and his brothers on religion,
    profit, and felicity. Bhishma begins a narrative about Vishnu/Krishna. Krishna
    observes a twelve-year vow; sages and ascetics come to see him and are received
    with divine-level hospitality. A fire identified with Narayana’s energy emerges
    from Krishna’s mouth, burns a mountain and its living beings, then returns to
    Vishnu and touches his feet. Krishna restores the mountain by a benign look. The
    sages are amazed and ask Krishna to resolve their doubt about the fire, praising
    him as creator, destroyer, seasons, parent, master, and origin of all creatures.
  language: English
  quote_policy: summarized
