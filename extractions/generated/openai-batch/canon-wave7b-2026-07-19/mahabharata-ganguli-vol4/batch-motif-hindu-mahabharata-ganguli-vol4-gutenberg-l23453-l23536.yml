canonical_text:
  quote: ''
  summary: Bhishma addresses a monarch with a catalogue of conduct distinguishing
    good or righteous persons from wicked or sinful persons. The passage covers bodily
    propriety, reverence, hospitality, regulated eating and sexual conduct, worship
    of Brahmanas, kine, deities, ancestors, and planets, respect for preceptors and
    elders, restraint of speech, mind, and senses, blessings, etiquette of address,
    and the confession and expiation of sin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker contrasts wicked persons, described as evil in practice, ungovernable,
    and foul-mouthed, with good persons whose acts indicate good conduct.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Righteous persons are instructed not to answer the calls of nature on public
    roads, in cow-pens, or in paddy fields; they feed five before eating, avoid talking
    while eating, and do not sleep with wet hands.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Righteous persons circumambulate a blazing fire, a bull, an image of a deity,
    a cow-pen, a crossroads, and an old virtuous Brahmana, and yield the way to elders,
    burdened persons, ladies, officials, Brahmanas, kine, and kings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A good man protects guests, servants, dependents, relatives, and seekers of
    protection, and greets them politely.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Morning and evening are named as the two proper food times; abstaining during
    the interval is described as a fast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states rules for sexual conduct after a woman's functional period
    and describes observance of Brahmacharya as approaching one's spouse only at that
    time.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Amrita, Brahmanas, and kine are described as equal, and Brahmanas and kine
    are to be worshipped with due rites.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Meat from animals slain in sacrifices with Yajur Veda Tantras is permitted,
    while flesh from the backbone or from animals not slain in sacrifice is to be
    avoided.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: One should not let a guest go without food; after study one should give Dakshina
    to the preceptor; the preceptor and elders should be honored.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage names preceptors as the foremost Tirthas, the heart as the foremost
    sacred object, knowledge as the foremost object of search, and contentment as
    the foremost happiness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage instructs listening to aged counsellors, using the right hand
    for Vedic reading and eating, controlling speech, mind, and senses, offering Ashtaka
    Sraddha foods to Pitris, deities, and Planets, blessing the ill or sneezing, and
    avoiding overly familiar address to eminent persons.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The sinful person's heart is said to proclaim sins; concealed sin grows and
    brings destruction or miserable birth, while righteousness, expiation, and confession
    before good persons destroy sin.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
- id: obs:13
  text: The passage says that stored wealth may pass to another owner after the owner's
    death and that the mind of every creature is the true test of Righteousness.
  category: other
  evidence_refs:
  - ev:9
