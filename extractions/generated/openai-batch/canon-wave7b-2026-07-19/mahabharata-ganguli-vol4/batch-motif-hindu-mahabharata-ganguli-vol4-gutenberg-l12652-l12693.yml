canonical_text:
  quote: ''
  summary: Ganga describes a golden, radiant foetus or child whose splendour illuminates
    mountains, rivers, springs, and the three worlds. After Ganga disappears, Pavaka
    departs, and the text explains names given to the fire deity, Earth, and the child.
    The foetus, linked with Pavaka, Ganga, Earth, Rudra, and the reed forest, grows
    into a wonderful form and is reared by the presiding goddess of Krittika, receiving
    the names Kartikeya, Skanda, and Guha. The passage then gives an origin and sacral
    valuation of gold as the offspring of blazing fire and as having the essence of
    Agni and Soma.
  language: English
  quote_policy: summarized
