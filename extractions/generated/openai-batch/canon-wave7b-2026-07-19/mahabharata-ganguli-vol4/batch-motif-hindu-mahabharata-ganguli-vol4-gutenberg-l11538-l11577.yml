canonical_text:
  quote: "“Verily, as Ganga is the foremost of all rivers, even so is a Kapila cow
    the foremost of all kine.”"
  summary: Vaisampayana narrates that Yudhishthira again asks Bhishma about the merits
    of giving kine. Bhishma teaches that giving a suitable cow with a calf to a Brahmana
    cleanses sins and prevents entry into sunless hell-regions, while giving an unfit,
    diseased, or distress-causing cow leads to dark Hell. He praises strong, well-behaved
    young kine and says the Kapila cow is foremost among kine as Ganga is foremost
    among rivers. Yudhishthira asks why the Kapila cow is especially distinguished.
  language: English
  quote_policy: quoted
