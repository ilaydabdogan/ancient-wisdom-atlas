canonical_text:
  quote: ''
  summary: Vasudeva instructs Yudhishthira that salvation is gained by abandoning
    attachment and desire rather than merely giving up external possessions. He identifies
    possessiveness with Mrityu and non-possessiveness with Saswatam/Brahman, describes
    an unseen conflict of these principles within all beings, quotes the Kamagita
    in which personified Kama resists destruction through religious and ascetic practices,
    and counsels redirecting desire toward virtue, performing sacrifices, and not
    grieving for those slain in battle.
  language: English
  quote_policy: summarized
