canonical_text:
  quote: "“Half of my body is made up of half thy body.”"
  summary: Narada reports that Mahadeva asks Uma, his spouse, to speak authoritatively
    on the duties of women. Mahadeva praises Uma’s knowledge, virtue, asceticism,
    equality with him, and bodily complementarity with him. Uma replies that she will
    consult sacred female rivers, including Saraswati and Ganga, before discoursing
    on the topic.
  language: English
  quote_policy: quoted
