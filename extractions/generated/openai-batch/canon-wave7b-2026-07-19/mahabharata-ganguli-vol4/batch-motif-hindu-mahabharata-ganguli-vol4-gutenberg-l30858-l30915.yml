canonical_text:
  quote: ''
  summary: At Yudhishthira's court, Arjuna asks permission for Vasudeva/Krishna to
    return to Dwaravati and see his family. Yudhishthira grants leave, instructs him
    to honor relatives, asks him to return for the horse-sacrifice, and offers wealth.
    Vasudeva replies that Yudhishthira owns all wealth and the Earth. Krishna honors
    Kunti, departs by chariot with Subhadra, is escorted by companions, sends most
    of them back, and continues toward the Anarttas with Satyaki and Daraka.
  language: English
  quote_policy: summarized
