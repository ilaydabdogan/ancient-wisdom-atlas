canonical_text:
  quote: ''
  summary: Vasudeva cites an ancient discourse between a Brahmana and his wife. The
    wife asks what region she will attain through a husband who has cast off religious
    acts. The Brahmana replies by contrasting visible ritual action with knowledge,
    describing an inner seat in the body, the life-breaths, and an internal sacrificial
    fire called Vaiswanara with seven flames, tongues, fuels, priests, fires, libations,
    and wombs. The teaching culminates in a sevenfold account of creation, dissolution,
    and fullness with light.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Vasudeva introduces the passage as an ancient narrative of a discourse between
    a married couple.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brahmana's spouse sees her husband seated in seclusion and asks what region
    or goal she will attain through him, since she has heard that a wife attains the
    regions acquired by her husband.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Brahmana answers that visible acts are performed by people devoted to
    acts, while those without knowledge store delusion through acts.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Brahmana says that action by act, mind, or speech exists in all beings
    from birth until another form is attained.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Brahmana says he has turned away from paths of action characterized by
    visible ritual objects and has perceived a seat in the body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The inner seat is described as the place where Brahma, Soma with Agni, and
    Vayu are present, and as the seat for which Yoga-concentrated beings worship the
    Indestructible.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The seat or principle is said to be beyond smell, taste, touch, sight, and
    hearing, attainable by mind, and the source and support of the universe.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The life-breaths Prana, Apana, Samana, Vyana, and Udana are said to flow from
    that principle and re-enter it.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: A fire called Vaiswanara, made of seven flames, is said to blaze amid the
    life-breaths within the body.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The nose, tongue, eye, skin, ear, mind, and understanding are identified as
    the seven tongues of Vaiswanara's flame.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Objects of smell, drinking, sight, touch, hearing, thought, and understanding
    are described as seven kinds of fuel, and the corresponding faculties are described
    as seven officiating priests.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Learned sacrificers are described as casting seven libations in seven ways
    in seven fires.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Earth, Wind, Ether, Water, Light, Mind, and Understanding are called seven
    wombs.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Attributes are said to enter the attribute born of fire, dwell there, become
    reborn in their respective wombs, and remain absorbed during dissolution.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Smell, taste, colour, touch, sound, doubt, and resolution are said to be produced
    from the same source, and this is called sevenfold creation.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The teaching ends by saying that through three full and final libations, the
    full become full with light.
  category: speech
  evidence_refs:
  - ev:8
