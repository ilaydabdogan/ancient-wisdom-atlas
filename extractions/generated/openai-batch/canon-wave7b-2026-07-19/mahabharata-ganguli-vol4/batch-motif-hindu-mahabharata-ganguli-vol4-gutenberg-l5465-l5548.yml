canonical_text:
  quote: ''
  summary: Angiras lists many sacred rivers, lakes, confluences, retreats, forests,
    mountains, waterfalls, and tirthas. He states that bathing, fasting, observing
    vows, maintaining purity, and offering water oblations to ancestors at these places
    cleanse sins and grant merits, heavenly ascent, contact with deities, access to
    Apsara or Gandharva regions, supernatural abilities, fame, beauty, royal prosperity,
    or release from rebirth.
  language: English
  quote_policy: summarized
