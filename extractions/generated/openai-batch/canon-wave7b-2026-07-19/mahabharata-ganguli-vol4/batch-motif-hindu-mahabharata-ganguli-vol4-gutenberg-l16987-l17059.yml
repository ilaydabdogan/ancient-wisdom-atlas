canonical_text:
  quote: Food is the life-breath of men.
  summary: Yudhishthira asks Vrihaspati about the end of righteousness and the acts
    by which people attain auspicious outcomes in this world and heaven. Vrihaspati
    teaches that repentance, contemplation of the deity, confession before duty-knowing
    Brahmanas, and especially lawful gifts of food to Brahmanas cleanse sin, produce
    merit, lead to heaven or felicity, and prevent hell or rebirth. Food is praised
    as the support and refuge of living beings.
  language: English
  quote_policy: quoted
