canonical_text:
  quote: Verily, conduct is the only ground.
  summary: A didactic passage prescribes disciplined householder, ritual, and social
    conduct for Vaisyas, Kshatriyas, Sudras, and Brahmanas. It states that good conduct
    and ritual observance can lead to higher birth or Brahmana status, while wicked
    conduct can cause a Brahmana to fall. It emphasizes conduct over birth, rites,
    learning, or offspring, cites Brahma on the four orders as classification, and
    uses a field-and-seed image for next-world recompense.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A Vaisya is instructed to control the senses, honor Brahmanas, seek welfare
    for all orders, eat only after family, dependants, and guests have been served,
    adore deities in Agnihotra, pour libations, and worship the three fires.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that such a Vaisya of pure conduct takes birth in the next
    life in a high Kshatriya family, and that a Kshatriya observing rites and vows
    becomes an honored Brahmana in a later life.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: A Kshatriya is instructed to make gifts, perform sacrifices with Dakshinas,
    study the Vedas, protect subjects, punish righteously, fast, control the soul,
    sleep on Kusa grass in the fire chamber, worship Pitris, gods, and guests, and
    offer Agnihotra libations morning, noon, and evening.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The Kshatriya is told he may cast off his life-breath in battle for the benefit
    of kine and Brahmanas, or enter the triple fires sanctified with Mantras and cast
    off his body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that a wicked Brahmana who observes no distinction in food
    falls from Brahmanahood and becomes a Sudra, while a Sudra purified by good deeds
    and sense-control deserves reverent service as a Brahmana.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage explicitly states that neither birth, purificatory rites, learning,
    nor offspring confer regenerate status, and that conduct is the ground.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Brahma is said to have declared that the division of human beings into four
    birth-based orders is for classification.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Brahmana is described as a moving field; one who plants seeds in that field
    reaps the crop in the next world.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: A Brahmana seeking his own good is instructed to live on food remaining after
    feeding others, follow righteousness, study the Samhitas and Vedas without using
    such study as subsistence, worship the sacred fire, and protect Brahmana status
    by avoiding specified contacts and gifts.
  category: action
  evidence_refs:
  - ev:6
