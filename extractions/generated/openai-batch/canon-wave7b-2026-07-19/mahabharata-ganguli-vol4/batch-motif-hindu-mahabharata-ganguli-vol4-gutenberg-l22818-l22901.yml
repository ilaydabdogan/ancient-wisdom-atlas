canonical_text:
  quote: ''
  summary: Bhishma, near death and with his faculties failing, directs the addressed
    king to learn from Krishna. He praises Krishna as creator, protector, destroyer,
    source of cosmic order, embodiment of many deities and rites, the Boar who raised
    the submerged Earth, the source of Brahma from a lotus in his navel, the lifter
    of Govardhana, the cause of Vasishtha’s jar-birth, the one who covered the worlds
    in three steps, the solar regulator of time, and the Agni-form that consumed herbs
    in Khandava forest.
  language: English
  quote_policy: summarized
