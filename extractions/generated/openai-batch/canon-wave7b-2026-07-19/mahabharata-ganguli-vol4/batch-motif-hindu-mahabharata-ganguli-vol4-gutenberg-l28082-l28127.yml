canonical_text:
  quote: I have repeatedly undergone death and rebirth.
  summary: A successful ascetic tells Kasyapa that karmic acts lead beings to varied
    destinations, including heaven, but no residence is eternal. He recounts many
    past births, sufferings, falls into hell, and tortures in Yama's domains. Overwhelmed
    by sorrow, he took refuge in the Formless, renounced worldly joys and sorrows,
    practiced a path of tranquility, and expects no return to mortal life, proceeding
    instead to Satyaloka and absorption into Brahman. He then invites Kasyapa to ask
    what is beneficial.
  language: English
  quote_policy: quoted
