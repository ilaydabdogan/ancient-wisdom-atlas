canonical_text:
  quote: '"That man whose limbs only are wet with water is not regarded as one that
    is washed."'
  summary: Yudhishthira asks Bhishma to identify the foremost Tirtha. Bhishma teaches
    that the mental Tirtha called Manasa, grounded in truth and understanding, purifies
    through virtues, self-denial, knowledge, and conduct. He also acknowledges earthly
    sacred places and waters whose rites wash away sins, and says that purity from
    both inner and outer Tirthas is best.
