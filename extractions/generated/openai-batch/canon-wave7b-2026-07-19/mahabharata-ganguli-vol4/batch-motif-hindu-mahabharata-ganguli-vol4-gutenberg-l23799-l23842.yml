canonical_text:
  quote: ''
  summary: Janamejaya asks what Yudhishthira did after hearing Bhishma’s teachings.
    Vaisampayana narrates that, after Bhishma falls silent, Vyasa asks Bhishma to
    dismiss the restored Yudhishthira. Bhishma instructs Yudhishthira to return to
    the city, perform sacrifices and gifts, uphold Kshatriya duties, honor ancestors,
    deities, subjects, and well-wishers, and return when Bhishma’s chosen time to
    leave his body arrives at the sun’s northward turn. Yudhishthira accepts, salutes
    Bhishma, and enters the city with elders, relatives, sages, Krishna, citizens,
    and counsellors.
  language: English
  quote_policy: summarized
