canonical_text:
  quote: The Bharata is cleansing and sacred.
  summary: The passage prescribes rites for reciting, honoring, and worshipping the
    Mahabharata, including feeding Brahmanas, giving gifts to the reciter, offering
    worship to the text, and performing Homa. It praises the Bharata as sacred, salvific,
    equivalent in merit to sacrifices and other scriptural listening, and capable
    of destroying sins, granting prosperity, aiding fertility, rescuing ancestors,
    and bringing devotees to the status or region of Vishnu.
  language: English
  quote_policy: quoted
