canonical_text:
  quote: Vyasa ... summoned all the deceased warriors ... Then those kings ... arose
    by thousands from the waters of the Bhagirathi.
  summary: At night, after rites, Dhritarashtra, the Pandavas, Rishis, Gandhari, royal
    women, citizens, and provincial inhabitants gather near Vyasa. Vyasa bathes in
    the sacred Bhagirathi and summons the deceased warriors from both sides of the
    war. The dead kings and troops arise from the waters in resplendent form, wearing
    battle emblems and celestial adornments, free from hostility. Gandharvas, bards,
    and Apsaras attend them. Vyasa grants Dhritarashtra celestial vision, and Gandhari
    sees her slain children and others killed in battle. The assembly beholds the
    wondrous scene with amazement, and Dhritarashtra rejoices.
  language: English
  quote_policy: quoted
