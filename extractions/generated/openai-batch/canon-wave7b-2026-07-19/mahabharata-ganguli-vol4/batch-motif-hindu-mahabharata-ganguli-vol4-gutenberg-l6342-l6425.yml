canonical_text:
  quote: ''
  summary: Narada tells Govinda/Krishna that he worships Brahmanas, regenerate persons,
    and Rishis marked by Vedic study, austerity, sacrifice, truth, self-restraint,
    compassion, hospitality, renunciation, and obedience to preceptors. He advises
    Krishna to worship such persons daily, saying that they confer happiness and help
    devotees cross calamities and obstacles.
  language: English
  quote_policy: summarized
