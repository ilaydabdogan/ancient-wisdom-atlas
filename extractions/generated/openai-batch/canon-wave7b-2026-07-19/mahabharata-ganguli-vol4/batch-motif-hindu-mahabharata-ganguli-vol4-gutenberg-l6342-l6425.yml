- id: obs:1
  text: Narada addresses Govinda and says he will explain whom he worships.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Narada says he worships Brahmanas who worship Varuna, Vayu, Aditya, Parjanya,
    Fire, Sthanu, Skanda, Lakshmi, Vishnu, the lord of speech, Chandramas, the Waters,
    Earth, Saraswati, and other Brahmanas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The worshipped Brahmanas are described as endowed with penances, conversant
    with the Vedas, devoted to Vedic study, and possessed of high worth.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Some revered persons are described as free from boastfulness, performing rites
    for deities on an empty stomach, content with what they have, and endowed with
    forgiveness.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some are performers of sacrifices, self-restrained, masters of their senses,
    devoted to truth and righteousness, and givers of land and kine to good Brahmanas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Some dwell in forests, subsist on fruits and roots, do not store anything
    for the next day, and observe rites laid down in scripture.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Some feed and cherish servants, are hospitable to guests, and eat only remnants
    of offerings made to deities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Some are described as strengthened by Vedic study, eloquent in scriptural
    discourse, observant of Brahmacharyya, officiants at others' sacrifices, and teachers
    of disciples.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Some are compassionate toward all creatures and study the Vedas until noon.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Some seek the grace of preceptors, work to acquire the Vedas, keep vows, obey
    preceptors and seniors, and are free from malice and envy.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Some practice taciturnity, possess knowledge of Brahman, are firm in truth,
    and offer libations of clarified butter and oblations of meat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Some subsist on alms, are emaciated for want of food and drink, have lived
    in preceptors' abodes, and are poor and averse to enjoyments.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: Some have no affection for earthly things, no quarrels, no clothing, no wants,
