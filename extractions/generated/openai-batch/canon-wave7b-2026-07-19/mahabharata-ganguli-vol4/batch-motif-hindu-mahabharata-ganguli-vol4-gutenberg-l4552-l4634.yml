canonical_text:
  quote: ''
  summary: Bhishma narrates Ashtavakra’s northward journey through sacred mountain
    and river regions. Ashtavakra performs ablutions, oblations, homa fire worship,
    and rites to Rudra and Uma, then reaches the realm of Kuvera/Vaisravana, where
    he is received with hospitality and entertained by Apsaras and Gandharvas. After
    unknowingly spending a celestial year there, he departs northward, crosses great
    mountains, reveres Mahadeva’s holy abode, and proceeds toward a delightful forest
    and hermitage. The supplied passage ends mid-sentence.
  language: English
  quote_policy: summarized
