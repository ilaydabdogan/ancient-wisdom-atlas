canonical_text:
  quote: ''
  summary: Chyavana tells King Kusika that he does not desire the king's possessions
    but wishes to undertake a vow during which the king and queen must serve him.
    The royal couple receive him in the palace, provide food, and obey his command
    to stay awake and press his feet while he sleeps. Chyavana sleeps without moving
    for twenty-one days while the king and queen fast and serve him. When he rises,
    he leaves without speaking, disappears by Yoga-power, and the distressed royal
    couple begin searching for him.
  language: English
