canonical_text:
  quote: ''
  summary: Vrihaspati teaches that the Jiva is born according to its acts, experiences
    woe, death, and rebirth, and may go to the dominions of Yama. The passage describes
    varied regions of Yama and catalogs specific moral, ritual, familial, and social
    offenses that result in sequences of animal, spirit, or other non-human births
    before eventual restoration to human or Brahmana status.
  language: English
