canonical_text:
  quote: ''
  summary: Yudhishthira questions Bhishma about proper recipients of gifts, purity
    in giving, deity and ancestor rites, the qualifications of Brahmanas, Sraddha
    offerings, and the signs of righteousness. Bhishma answers with rules and cites
    statements attributed to Earth, Kasyapa, Agni, and Markandeya, including images
    of sin dissolving in the ocean, conduct outweighing learning and birth, destructive
    speech causing loss of righteousness, and Truth outweighing many Horse-sacrifices.
    The passage also states afterlife misery for gifts made to hypocritical or improper
    recipients.
  language: English
  quote_policy: summarized
