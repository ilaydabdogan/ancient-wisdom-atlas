canonical_text:
  quote: ''
  summary: Bhishma instructs the king about a mantra declared by Vyasa and ordained
    by Savitri. He says that hearing or reciting it cleanses sin and grants long life,
    prosperity, fulfilled wishes, and felicity. The passage then gives an invocatory
    catalogue of sages, deities, divine collectives, cosmic beings, natural features,
    and ritual priestly seers. It states that invisible divine witnesses observe sacrifices,
    gifts, good deeds, and good and bad acts, and that reciting certain names grants
    benefits including heavenly regions and ascent to Indra's region.
  language: English
  quote_policy: summarized
