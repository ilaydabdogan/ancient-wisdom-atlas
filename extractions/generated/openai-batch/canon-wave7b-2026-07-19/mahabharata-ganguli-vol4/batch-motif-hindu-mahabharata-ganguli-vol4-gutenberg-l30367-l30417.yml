canonical_text:
  quote: ''
  summary: Brahma teaches that renunciation, knowledge, penance, Vedic understanding,
    tranquility, and freedom from desire, egoism, and opposites lead to seeing or
    attaining Brahman and to emancipation. The passage describes Brahman as supreme,
    eternal, beyond qualities and opposites, and presents an allegory of an eternal
    tree of Brahman that supports all creatures and is cut by knowledge of truth as
    a sword. It also mentions two immutable friendly birds, another called the Intelligent,
    and the release of the inner self when it knows what is above nature and understands
    Kshetra.
  language: English
  quote_policy: summarized
