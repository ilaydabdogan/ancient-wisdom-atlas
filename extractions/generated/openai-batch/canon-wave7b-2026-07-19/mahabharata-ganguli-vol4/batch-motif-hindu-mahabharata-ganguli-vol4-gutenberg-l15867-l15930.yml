canonical_text:
  quote: ''
  summary: Yudhishthira asks Bhishma how elder and younger brothers should behave
    toward one another. Bhishma gives a didactic answer on the eldest brother's duties,
    correction of younger brothers, dangers of dissension, inheritance consequences
    for wicked conduct, the hierarchy of teachers and parents, the mother’s supreme
    reverence, the eldest brother as father after the father’s death, the Acharya’s
    true birth, and mother-like status of the eldest sister and eldest brother’s wife.
  language: English
  quote_policy: summarized
