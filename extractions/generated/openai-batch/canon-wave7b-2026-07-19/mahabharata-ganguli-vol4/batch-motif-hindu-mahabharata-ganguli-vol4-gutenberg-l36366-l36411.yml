canonical_text:
  quote: ''
  summary: Vaisampayana recounts that Dhritarashtra, pleased after Vidura's address
    and with the acts of Yudhishthira and Jishnu, arranges a large Śrāddha or Gift-sacrifice.
    He invites Brahmanas and Rishis, prepares food, drink, wealth, animals, vehicles,
    clothing, jewels, fields, villages, and other gifts, and distributes them for
    the advancement of the dead while naming Bhishma, Drona, Duryodhana, and others.
    With Yudhishthira's approval, gifts are enlarged and guests are fed abundantly.
    The passage compares Dhritarashtra's generosity to clouds and an ocean, and says
    that after ten days he is freed from debts to his sons and grandsons.
  language: English
  quote_policy: summarized
