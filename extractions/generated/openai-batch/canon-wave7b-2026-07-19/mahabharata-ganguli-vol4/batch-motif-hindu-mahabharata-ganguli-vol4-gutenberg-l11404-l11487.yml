canonical_text:
  quote: The cow is my mother. The bull is my sire.
  summary: 'Bhishma explains, through Vrihaspati’s instruction to king Mandhatri,
    the ritual for gifting cows: the donor honors Brahmanas, enters the cow-fold,
    recites formulas identifying the cow as mother and bull as father, spends the
    night with the cattle, gives a cow with calf and bull at sunrise, and receives
    merit, purification, prosperity, and heavenly reward. The passage also explains
    substitute gifts and post-gift vows involving cow products.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Bhishma states that no gift has higher merit than the gift of kine and that
    a lawfully acquired cow given away rescues the giver’s whole race.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ritual for giving kine is described as primeval and beneficial to righteous
    persons and all creatures.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: King Mandhatri, uncertain about the ritual for giving kine, asks Vrihaspati
    for an explanation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vrihaspati instructs that the giver should observe restraints, honor Brahmanas
    on the previous day, appoint the time of gift, and use kine of the Rohini class.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The giver enters the cow-fold, addresses the kine with prescribed words, and
    recites formulas calling the cow mother, the bull sire, and the cow a refuge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The giver spends the night in the fold, does not restrain the cows, lies on
    bare earth, and is said to become cleansed of sins by becoming similar to the
    kine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: At sunrise the giver gives away a cow accompanied by her calf and a bull;
    heaven is stated as the reward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The mantras describe kine as connected with strength, wisdom, sacrifice-achieved
    immortality, energy, earthly prosperity, the course of the universe, extension
    of race, destruction of sins, and the natures of Surya and Soma.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says the five products of the cow may be used in relation to wasting
    diseases and freedom from the body, and it asks the kine to appoint a desirable
    end for the speaker.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The giver says that by giving the kine away he gives himself away; the recipient
    answers that the kine no longer belong to the giver and should prosper both giver
    and receiver.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage treats the usual value of a cow, cloths, and gold as substitute
    gifts for a cow, each with specified formulas and heavenly rewards.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: After giving a cow, the giver is instructed to adopt the vaccine vow, spend
    nights with kine, and at a later observance subsist on milk, urine, and dung of
    the cow.
  category: sequence
  evidence_refs:
  - ev:11
