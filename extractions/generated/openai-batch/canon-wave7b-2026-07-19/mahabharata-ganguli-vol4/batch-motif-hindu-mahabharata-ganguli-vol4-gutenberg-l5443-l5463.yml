  summary: Yudhishthira asks Bhishma to describe the sacred waters on earth and their
    merit. Bhishma replies that Angiras once enumerated them and says listening to
    the account brings merit. Bhishma then frames an earlier exchange in which Gautama
    approached Angiras in a forest and asked about the merits, including otherworldly
    merits, gained by bathing in sacred waters and shrines.
