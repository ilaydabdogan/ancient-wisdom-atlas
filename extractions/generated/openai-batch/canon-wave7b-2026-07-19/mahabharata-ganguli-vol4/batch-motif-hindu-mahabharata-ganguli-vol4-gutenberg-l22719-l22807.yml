canonical_text:
  quote: ''
  summary: Bhishma reports the god of wind recounting to Arjuna how the gods, deprived
    of heaven by the Kapas and of earth by Chyavana, sought Brahman's aid. Brahman
    directed them to seek the Brahmanas, who undertook a rite against the Kapas. The
    Kapas' messenger Dhanin argued that the Kapas were righteous and Veda-knowing,
    but the Brahmanas persisted. When the armed Kapas advanced, the Brahmanas created
    blazing fires by Vedic mantras, destroying them. Narada informed the gods that
    the Brahmanas had truly defeated the foes; the gods rejoiced and gained increased
    power and immortality. Arjuna then affirmed his devotion to Brahmanas, and the
    god of wind instructed him to protect them while warning of future danger from
    the race of Bhrigu.
  language: English
  quote_policy: summarized
