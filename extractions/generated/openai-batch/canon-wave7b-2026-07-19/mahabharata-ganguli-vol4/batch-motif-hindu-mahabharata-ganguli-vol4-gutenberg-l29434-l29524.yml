  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The preceptor describes a great tree whose seed-sprout is the unmanifest,
    trunk is understanding, branches are high consciousness of self, twig-cells are
    the senses, flower-buds are the five great elements, and seed is Brahman.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The preceptor says that cutting topics with the sharp sword of knowledge leads
    one to immortality and casts off birth and death.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A group of named Rishis assemble, travel over all paths, become tired with
    acts, and proceed to the region of the Grandsire with the sage son of Angiras
    at their head.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Rishis behold Brahma, bow to him, and ask questions about good conduct,
