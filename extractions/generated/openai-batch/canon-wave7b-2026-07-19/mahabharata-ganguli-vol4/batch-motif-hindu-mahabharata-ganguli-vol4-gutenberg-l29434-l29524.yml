canonical_text:
  quote: ''
  summary: Arjuna asks Vasudeva to expound Brahma. Vasudeva recounts an old discourse
    in which a devoted disciple questions a Brahmana preceptor about the highest good,
    truth, penance, sin, happiness, auspicious paths, life, and Emancipation. The
    preceptor teaches that knowledge and renunciation are supreme, describes liberation
    through knowledge of the soul and freedom from possessiveness, gives an image
    of a great cosmic tree to be cut with the sword of knowledge, and introduces an
    earlier gathering of Rishis who asked Brahma about conduct, sin, paths, destruction,
    Emancipation, birth, and death.
  language: English
  quote_policy: summarized
