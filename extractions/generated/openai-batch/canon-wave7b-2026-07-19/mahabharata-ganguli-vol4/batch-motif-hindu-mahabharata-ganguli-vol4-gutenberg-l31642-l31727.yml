canonical_text:
  quote: ''
  summary: Krishna recounts the Bharata battle to his father Vasudeva but omits Abhimanyu’s
    death to spare him grief. Subhadra notices the omission, asks for her son’s death
    to be narrated, and collapses; Vasudeva also faints and then laments. Krishna
    describes Abhimanyu as facing battle bravely, surrounded after Arjuna was drawn
    away, and finally killed by Dussasana’s son after slaying many foes. Krishna and
    Kunti console the bereaved by saying Abhimanyu has attained heaven or the highest
    goal; Kunti points to pregnant Uttara as bearing Abhimanyu’s future son and arranges
    funeral rites and gifts to Brahmanas.
  language: English
  quote_policy: summarized
