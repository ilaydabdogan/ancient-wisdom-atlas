canonical_text:
  quote: ''
  summary: A speaker addresses Indra and declares Maheswara/Mahadeva to be the original
    cause of all things, beyond action and attributes yet also containing opposites.
    The speaker argues that Mahadeva's form contains signs of both sexes and that
    all beings bear marks of Mahadeva and Uma. The speaker seeks emancipation and
    boons only from Mahadeva. Immediately afterward, a celestial elephant seen by
    the speaker is transformed into a splendid white bull.
  language: English
  quote_policy: summarized
