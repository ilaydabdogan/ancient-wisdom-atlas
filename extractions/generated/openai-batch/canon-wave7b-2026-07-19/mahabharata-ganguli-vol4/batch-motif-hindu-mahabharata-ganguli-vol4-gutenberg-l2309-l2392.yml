  evidence_refs:
  - ev:1
- id: obs:2
  text: Maheswara is said to be worshipped by Yogins, Rishis, Gandharvas, Siddhas,
    deities, and Asuras, while the fruits of action cannot touch him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Maheswara is described through paired or opposing qualities: gross and subtle,
    with attributes and without attributes, knowledge and ignorance, righteousness
    and unrighteousness.'
  category: attribute
  evidence_refs:
  - ev:2
