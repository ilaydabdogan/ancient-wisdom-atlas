canonical_text:
  quote: '"Phee ! phee !" -- "Go down, sink !"'
  summary: 'The passage describes post-battle treatment of slayers: smoke inhalation,
    boiling milk on embers, ritual utterances, rubbing the body with milk, making
    tintebe amulet bags from powdered embers, completing purification by disposing
    of old implements and garments, chewing and spitting a root toward the sun, and
    wearing warrior trophies such as horns and burnt-wood necklaces.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Items are placed in a broken pot, roasted, and the participants inhale the
    smoke.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cow's milk is poured into the pot on the embers; when it boils, participants
    put their fingers into it, pass them across their lips, and emit the sacramental
    utterance "tsu."
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Participants say "Phee! phee!," glossed in the passage as "go down, sink,"
    with an explanation that the enemy should go deep into the earth and not return
    to torment the speaker.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The last part of the treatment is rubbing the biceps, legs, and whole body
    with the milk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The medicinal embers are collected, reduced to powder, and put into small
    skin bags called tintebe, which the slayer wears around the neck.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The tintebe can be used at bukanye time to season the first calabash drunk,
    and the passage says they prevent the slayers from attacking their own people
    under the influence of drink and help in future battles.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the battlefield, warriors who have just shed blood receive a preventive
    dose of medicine from those who have killed on previous occasions and wear tintebe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: After final purification, the implements used by the slayers and their old
    garments are tied together, hung by a string to a tree at some distance from the
    capital, and left to rot.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After returning home, slayers chew monungwane root morning and evening and
    spit it toward the rising or setting sun with the same exclamation; the root is
    tied to the assagay.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the weeks after battle, heroes wear tintebe and miluru amulets, and conquerors
    may wear trophies such as pierced antelope or goat horns and necklaces or bandoleers
    made of notched, burnt wood.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author recalls Matjolo warriors returning from an expedition in February
    1895 and displaying themselves at Lourenço Marques.
  category: setting
  evidence_refs:
  - ev:7
