canonical_text:
  quote: ''
  summary: 'The passage describes Northern clan forms of the Great Mourning: smoke
    inhalation medicines, restrictions on grave-diggers and mourners, offerings at
    the grave, food purification by medicinal porridge, a later food-purifying rite
    for returning relatives, body-strengthening and walking-related purification,
    hair washing and shaving, and a concluding sprinkling rite. It also introduces
    sexual purification rites as a separate topic.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Northern clans are described as having the same elements of the Great
    Mourning as the Ronga clans, but in another form.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When mourning lamentations begin, grave-diggers send men to fetch tinyele,
    bits of elephant-foot sole skin, which are burned with cock dung on charcoal;
    mourners inhale the smoke through reeds, and eating or snuffing before inhalation
    is taboo.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the first night, everyone sleeps in the open, grave-diggers avoid using
    mats and cover themselves with grass, and sexual relations between married people
    are suspended.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Visitors to the mourning go to the grave with a small basket of mealies, spread
    the mealies over the grave, address the dead, and the act is identified as a mhamba
    offering.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The doctor burns powders and bark in broken pots, and mourners inhale the
    smoke through reeds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The doctor cooks mealie pap with a drug to make medicinal porridge; grave-diggers
    first mime eating by throwing some over their shoulders, then eat it, and the
    master of the mourning performs the ceremony for all present and for later visitors
    before they may eat in the village.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: For a returning relative after the Great Mourning, the mafularela rite uses
    a wooden spoon with water, salt, and a glowing cinder; the officiant kneels with
    her back turned, passes the spoon around her waist from left to right, then gives
    the relative the liquid to drink to remove the yila of the food.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that if mafularela is not performed, the food would cause
    disease or death to the returning relative.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In nganganya, a gonwa bulb mixed with medicine is warmed on a heated stone;
    infants receive the substance through a gesture from umbilicus around the waist
    to the spine, while adults receive a hand motion from knee to toes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The adult maganyo rite is explicitly connected by the passage with walking,
    standing upright, health, and strength.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'Hair cutting among the Hlabi is described as medicinal: the physician washes
    the deceased wife’s head with water and purifying powder in a broken pot, cuts
    her hair, and others wash and shave each other; the hair is thrown into the bush,
    not onto the grave.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The Great Mourning is concluded by phunga, a sprinkling rite in which the
    doctor sprinkles people with water while it is still boiling, then uses fresh
    water to sprinkle doors and the rear parts of ox and goat kraals.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Pigs are explicitly excluded from the described Bantu ritual context in the
    exchange with Viguet.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: The following section introduces sexual rites of purification and characterizes
    them as earnest rites directed toward purity as conceived in the described society.
  category: other
  evidence_refs:
  - ev:10
