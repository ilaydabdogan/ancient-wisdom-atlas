canonical_text:
  quote: ''
  summary: 'The passage describes causes for moving or abandoning a Thonga village,
    including fear of witchcraft, death of the headman, lightning striking the village,
    exhausted gardens, and desire to change place. It then outlines Northern-clan
    rites for founding a new village: the headman selects possible sites by bringing
    twigs from trees, divinatory bones help choose the site, the headman and principal
    wife go to the chosen place, leave the old village permanently, have sexual relations
    there, tie tufts of living grass, and the old village members step on the grass.
    A moving period follows, governed by taboos against sexual relations and washing.'
  language: English
  quote_policy: summarized
