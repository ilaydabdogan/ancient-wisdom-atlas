canonical_text:
  quote: ''
  summary: 'The passage describes the spatial organization of a Thonga/Ronga village:
    the headman, wives, kin, possible protected stranger, youth huts, yards, hearths,
    bride-related yard construction, storytelling in domestic yards, refuse and storage
    areas, ash-heaps used in rites, and features of the hut interior including threshold,
    fire, sleeping places, and storage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The headman and his wives occupy the back of the village, while younger brothers
    and other kin occupy side or nearby huts.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A stranger may ask permission to live under the headman's protection and must
    perform hlamba ndjaka with all inhabitants to be received into the community's
    mystic unity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Unmarried boys sleep in the lao near the entrance and guard the door at night
    where this is customary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Girls live in the nhangu, which is sometimes built behind the mothers' huts
    so that they are watched more effectively.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The village squares and the yards in front of huts are generally kept clean
    or well swept.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Each yard has a central fireplace made with broken pots or hard clay, where
    the mistress of the hut cooks food.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The older form of the yard enclosure is described as a circular wall made
    of poles or tree trunks; reed and square enclosures are described as more modern.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the day of hloma, bride-maids and female relatives bring the bride, build
    a woodpile, and in Northern clans erect a new ndangu called tsandana.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The tsandana lets people know that a bride is in the yard working for her
    mother-in-law.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Women tell the tribe's folk-tales in the ndangu to children and to each other
    while cooking or after the evening meal.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The region between the huts and the fence contains old baskets, broken pots,
    chicken houses, ash-heaps, storehouses, and pig kraals.
  category: setting
  evidence_refs:
  - ev:7
  - ev:9
- id: obs:12
  text: Ash-heaps called tala are said to play a part in certain rites and to represent,
    as the author says, a place of desolation and sorrow.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Behind the huts, refuse and disused items may lie about, though pineapples,
    tobacco, chili-pepper, pumpkin plants, and flowers may also be present.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:14
  text: The hut opening can be small enough to require crawling, and in any case a
    person must stoop low to enter.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: Stepping over the threshold is not generally taboo, but the headman's threshold
    is taboo to sit on because it has been treated with medicines believed capable
    of harm or death.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: An interior fireplace is located in a raised circle in the hut floor and may
    be used for winter fire or rainy-weather cooking.
  category: object
  evidence_refs:
  - ev:12
- id: obs:17
  text: Glowing embers may remain at night, and babies are said to have died after
    falling into the fire while their mothers slept.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: The wife has a sleeping place on the left and the husband on the right, though
    both often sleep together on the right except during tabooed periods.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:19
  text: The back of the hut contains a big basket for clothing and seeds, while the
    roof and walls hold or display seed heads, weapons, sticks, drawings, and chromos.
  category: object
  evidence_refs:
  - ev:14
