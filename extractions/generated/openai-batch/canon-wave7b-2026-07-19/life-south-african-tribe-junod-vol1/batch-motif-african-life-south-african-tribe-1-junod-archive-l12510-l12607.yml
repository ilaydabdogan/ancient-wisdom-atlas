canonical_text:
  quote: ''
  summary: 'The passage describes Thonga village etiquette: hierarchy grounded partly
    in the elder''s religious role, respectful forms of address and name avoidance,
    formal greetings by time or situation, hand gestures, gift-thanking conventions,
    adoption or rejection of European-style handshaking and kissing, a wife''s food
    presentation to a returning husband, and initial rules for receiving strangers
    in a village.'
