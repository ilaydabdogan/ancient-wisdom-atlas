canonical_text:
  quote: ''
  summary: The passage presents missionary debates over how polygamist men and their
    wives should be treated in relation to Christian baptism, church membership, separation
    of spouses, lobola, retention of one wife, and care or remarriage of cast-off
    wives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Missionaries described in the passage agree that polygamy is incompatible
    with the Christian moral and family ideal, and that a polygamist may still be
    accepted as an inquirer and candidate for baptism.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage distinguishes four missionary positions on admitting a polygamist
    to full church membership by baptism: latitudinarian, idealistic, extreme, and
    midway.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The latitudinarian position attributed to Bishop Colenso opposes enforced
    separation, notes existing marriages according to local practice, raises concern
    for wives and children, invokes biblical figures with many wives, and would admit
    polygamists of old standing to communion while excluding them from church offices.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The idealistic position accepts a promise that the husband and extra wives
    will cease conjugal relations while separated spouses remain in the husband's
    village and receive care, but the author considers this practically dangerous.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The extreme position may require total separation, a far-away domicile for
    separated wives, and reclaiming lobola oxen to break remaining ties, though the
    author rejects this as a general rule.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The midway course keeps polygamists from baptism while accepting them as candidates
    under Christian instruction until they can accept the law of Christ; wives of
    polygamists may receive baptism if deserving because they cannot separate themselves
    from the polygamic family.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: No fixed rule is given for which wife should be retained; each case is to
    be judged by Christian principles and by benefit to others rather than to the
    husband.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'Cast-off wives are not to be rejected: they should return to their parents,
    be helped toward remarriage, and may receive clothing for themselves and their
    children from the former husband.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that, among the Bantu, the wife provides the food for the
    family.
  category: attribute
  evidence_refs:
  - ev:8
