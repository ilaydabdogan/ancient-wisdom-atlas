canonical_text:
  quote: ''
  summary: The passage describes the Thonga village headman's authority over younger
    kin and children, his limited power to command labour, his presidency over village
    discussions, family liability for debts and claims, procedures for deposing an
    incapable headman, and fraternal succession to headmanship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The headman has authority over younger brothers and children, including possible
    confiscation of money from someone addicted to drinking and ruining property,
    but the passage says this authority must not be overstepped.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Younger brothers retain the right to make contracts, especially lobola contracts,
    and may leave to found their own villages if the numzane restricts their liberty
    too much.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A successful headman is described as one who keeps the whole family together
    to general satisfaction.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The headman may impose statute labour for rebuilding the oxen kraal or clearing
    weeds from the hubo, but he should not demand too much and should feast the workers
    afterward with beer or meat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Village discussions may occur indoors for secret matters, on the central square
    or hubo for public matters, or before the chief's hubo at the capital if local
    agreement fails.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The hubo is described both as the central square and as the council of village
    men summoned by the headman to settle matters.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Women are excluded from village discussions, though a husband may consult
    a sensible and discreet wife privately; a man who changes an agreed position after
    speaking with his wife may be blamed for spoiling the village.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The headman is treated as responsible for claims against subordinates, and
    creditors of a younger brother may approach the numzane, who may urge payment
    or help with a loan.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Children are expected to pay debts of deceased parents because authorities
    hold them responsible, with different rules for lobola debt, adultery fines, and
    compensation when a father has been condemned as a wizard.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author states that these rules illustrate communism of family life and
    family property under the headman's supervision.
  category: other
  evidence_refs:
  - ev:5
- id: obs:11
  text: If a numzane is unable to govern, a family council of old relatives, especially
    paternal uncles, may depose him and proclaim a younger brother in his place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Succession to headmanship passes from the elder brother to the second brother
    and onward; the elder's son cannot become headman until all paternal uncles are
    dead.
  category: sequence
  evidence_refs:
  - ev:7
