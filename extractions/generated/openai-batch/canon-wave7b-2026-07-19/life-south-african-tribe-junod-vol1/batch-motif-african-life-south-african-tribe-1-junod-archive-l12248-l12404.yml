canonical_text:
  quote: ''
  summary: The passage describes a saliva battle game requiring blackish hemp saliva,
    a parental cure for excessive hemp-smoking by secretly feeding pipe soot three
    times, and the apparatus, comparative framing, and detailed rules of the Thonga
    tshuba game, including capture, killing holes, victory, and disputes over rules.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the saliva battle, a player notices a gate in the opposing barrier, carries
    a blow-pipe across the field while squirting, passes through the opening, draws
    a line, and destroys part of the opponent’s fortification.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young men and men of ripe age are described as taking great delight in saliva
    battles.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The required saliva for the game is blackish nljutju saliva produced by hemp,
    not ordinary white saliva called matjdfula or matjafula.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: A player who supplements blackish saliva with white saliva may be disqualified;
    the opponent may seize his forehead, force him to lift his head, and stop his
    attack.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A dispute over white saliva may lead to quarrels or blows, but the episode
    is said to end in cordial laughter after the hemp-pipe falls down.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Parents of young men addicted to hemp-smoking break the pipe, take soot from
    inside it, and secretly mix a little of that soot with the young man’s food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When the soot-feeding cure has been performed three times, it is said to fill
    the young man with disgust for hemp.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The narrator identifies this cure with the principle expressed as “Similia
    similibus curantur” and says the same medical principle will recur in Thonga superstitions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Tshuba is described as a widespread game and, through Stewart Culin’s report,
    as a variety of mancala found or played in many regions.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the elementary two-player form of tshuba, each player digs two rows of
    four small holes, squats behind them, and faces the other player, making sixteen
    holes total.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: Each hole begins with two stones, either real stones or fruit stones, with
    kanye fruit stones and grey shining shrub seeds mentioned as common or preferred
    materials.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: The diagrammed rules give fixed courses through the holes for player A and
    player B.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: A tshuba move involves taking stones from one hole and distributing them one
    at a time into following holes until the last stone reaches an empty hole.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: When the last stone reaches an empty hole, a player can win by taking the
    enemy’s stones in opposite holes; the appropriation is called ku tha.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: After a successful capture, the player may also take the contents of another
    hole, described as killing the hole, dlaya.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: In the example sequence, B eventually takes A’s last stone, so A is beaten
    and B has vanquished him.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: Men sometimes spend half the day stooping over tshuba, talking animatedly
    and sometimes fighting when they think a rule has been transgressed.
  category: action
  evidence_refs:
  - ev:7
