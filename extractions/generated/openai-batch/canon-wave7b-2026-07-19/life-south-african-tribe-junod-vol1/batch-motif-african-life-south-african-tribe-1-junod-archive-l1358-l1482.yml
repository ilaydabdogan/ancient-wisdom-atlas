canonical_text:
  quote: ''
  summary: 'Ethnographic description of childbirth among the Thonga/Tsonga: the father
    summons midwives; the mother gives birth in a secluded back-of-hut place called
    a nest; labor involves taboos and exclusions; the umbilical cord, placenta, washing
    water, and confinement are handled according to prescribed rules; the child is
    named through several possible practices, including chief names, ancestral names
    confirmed by divination, or a name given by a person who then forms a special
    relationship with the child.'
  language: English with Thonga terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When childbirth begins, the father sends word to neighborhood midwives, who
    come at once.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The delivery place is generally at the back of the mother’s hut, enclosed
    with mats if bush cover is not sufficient, and is called fukwen or busaken, glossed
    as the nest.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A large wooden mortar is given to the birthing woman to lean against during
    labor pains.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the birth is difficult, divinatory bones may be consulted and the woman
    may be moved to another place.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Midwives may manipulate or knead the mother to expel the child and after-birth,
    and the passage states that this can severely hurt her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: During labor the mother is forbidden to eat or drink; the stated explanation
    is that doing so would kill the child.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Men and girls must not attend the birth; a newly married woman may enter to
    be taught; the mother’s female relatives, including her sisters and mother, are
    excluded until after a smooth birth is known.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: After birth, the umbilical cord is tied, cut near the navel, anointed with
    fat, and cared for until it falls off, which marks the end of confinement.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The placenta is anxiously awaited, called the child’s house, and buried deep
    behind the hut or inside the house to prevent dogs from unearthing it, which is
    taboo.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The newborn is washed with water, and that water is thrown away as polluted
    by birth blood and taboo.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The child may receive a chief’s name, an ancestral name, or a name selected
    after divinatory bones give a favorable indication.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A friend, family associate, or traveller may give his own name to the newborn,
    creating a special relationship involving later presents and visits.
  category: relationship
  evidence_refs:
  - ev:9
