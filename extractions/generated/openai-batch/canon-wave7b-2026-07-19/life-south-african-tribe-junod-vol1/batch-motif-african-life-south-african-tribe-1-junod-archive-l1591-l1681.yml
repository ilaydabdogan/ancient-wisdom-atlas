canonical_text:
  quote: ''
  summary: The passage describes Thonga postpartum seclusion, food and medicine for
    the mother and child, taboos around entry and contact, the ending of confinement
    after the umbilical cord falls, a clay-smearing cleansing of the hut, and a broken-pot
    fumigation rite in which animal-skin smoke and ointment protect the child before
    it can go outside.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A postpartum food is cooked in a special pot and eaten with a special spoon;
    its stated purposes are to expel unclean birth blood and stimulate milk production.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the end of the seclusion period, the special pot and spoon are fastened
    inside over the entrance of the hut.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'A fowl is killed during the first days after birth: a hen for a girl child
    and a cock for a boy child; medicinal powder is added to the broth, and the mother
    and husband eat portions of it.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The delivered woman is attended by her own mother, who is summoned after the
    birth and helps her feed the child.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The child's umbilical cord is anointed daily, and the child begins to take
    the breast and drink milombyana medicine.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The husband is excluded from the hut, not because he is considered unclean,
    but because the wife's lochia is considered dangerous to him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Married people or sexually active adults are excluded from touching the newborn,
    while young girls may enter the hut but must not kiss the baby during the first
    days.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The newborn is described as not yet firm and as only water; kissing becomes
    allowed later when the child laughs and plays.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the umbilical cord has fallen off normally, the confinement period ends
    and is marked by two rites.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
- id: obs:10
  text: The delivered woman's mother smears the hut floor with clay, which is described
    as a cleansing act that ends a marginal period and permits others to enter the
    hut.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A family doctor performs the broken-pot rite on the threshold by burning pieces
    of skin from many wild animals, including dangerous snakes, and exposing the child
    to the smoke.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The child's crying, sneezing, and coughing during fumigation are described
    as the desired result.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The doctor grinds the remaining burned skin, mixes it with tihuhlu grease,
    and rubs the ointment over the child's body, especially the joints, while extending
    them gently to assist growth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The fumigation and manipulation are intended as prevention against external
    dangers represented by beasts of the bush, so the child can go out and cross wild-beast
    footprints without harm.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The remaining powder is placed in a small reed closed at both ends, and the
    mother carries it during the nursing period to continue the treatment.
  category: object
  evidence_refs:
  - ev:8
