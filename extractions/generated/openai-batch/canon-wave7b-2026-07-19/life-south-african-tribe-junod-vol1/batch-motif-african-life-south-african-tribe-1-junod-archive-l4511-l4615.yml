candidate_motifs:
- id: motif:1
  label: Bridewealth transfer through cattle and reciprocal gifts
  taxonomy_refs:
  - sacred_exchange
  basis: The passage centers on lobola cattle, further oxen, a goat, shillings, meat
    portions, and sovereign presents as structured exchanges between the bride's and
    husband's families.
  evidence_refs:
  - ev:1
