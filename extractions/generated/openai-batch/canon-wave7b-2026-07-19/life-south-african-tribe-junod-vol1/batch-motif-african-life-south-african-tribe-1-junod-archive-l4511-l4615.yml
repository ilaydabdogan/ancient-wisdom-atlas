  - ev:4
  - ev:5
  confidence: medium
  cautions: The taxonomy reference is broad; the passage describes an ethnographic
    marriage-payment process rather than a mythic exchange episode.
- id: motif:2
  label: Threshold reluctance and compensated entry
  taxonomy_refs: []
  basis: At the later beer visit, the bride's party remains outside and retreats when
    invited; the bride does not put down her pot and is induced by a goat and shillings
    to enter, sit, wash, and eat.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No wider comparative claim is made from the passage alone.
- id: motif:3
  label: Ancestor-addressed sacrifice before bride's departure
  taxonomy_refs:
  - sacrifice
  basis: On the morning before the bride leaves, her father kills a fowl, makes a
    sacrifice, tells the ancestors his daughter is going to be married, and prays
    for her.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not specify details beyond the fowl sacrifice and prayer.
- id: motif:4
  label: Bride's departure from natal home to husband's kraal
  taxonomy_refs:
  - departure
  basis: The departure of the new wife to the husband's kraal is delayed until full
    lobola is paid, then occurs with trousseau, female accompaniment, and a father's
    sacrifice.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The taxonomy term is literal here; no heroic or mythic departure is implied
    by the passage.
- id: motif:5
  label: Ritualized degradation and protective speech at bride transfer
  taxonomy_refs: []
  basis: The ntjumi's harsh speech calls the bride a dog and witch and anticipates
    accusations, while the husband's side replies that they will try to protect her
    if the husband is too hard on her; old women also warn her of harsh treatment.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: This is a social-ritual speech pattern in the ethnographic account; interpretation
    of its function needs human review.
- id: motif:6
  label: Affinal insult exchange between women
  taxonomy_refs: []
  basis: Women of the two families exchange insults, alternating praise of their own
    side and criticism of the other, including the claim that the bride's people have
    come to cut the groom's tail and make him a man.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No taxonomy reference is assigned because the passage itself does not
    connect this exchange to a broader motif family.
- id: motif:7
  label: Washing and ablutional framing of marriage exchange
  taxonomy_refs: []
  basis: The sequence includes beer named as washing the hoofs of the oxen, water
