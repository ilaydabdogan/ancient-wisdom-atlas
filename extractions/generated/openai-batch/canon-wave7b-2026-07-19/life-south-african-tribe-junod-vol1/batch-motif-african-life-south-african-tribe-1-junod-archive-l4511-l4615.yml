canonical_text:
  quote: ''
  summary: 'The passage describes successive Thonga marriage procedures: lobola cattle
    are brought and inspected amid a sham-fight and feasting; a later beer visit involves
    threshold reluctance and further gifts; meat portions are sent to specified bride
    kin; completion of payment precedes the bride''s departure with trousseau, sacrifice
    to ancestors, speeches, feasting, and ritualized exchanges of insults between
    women of the two families.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Beer is prepared in the girl's village after a nine-day interval before the
    lobola act.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The suitor's family arrives driving fifteen cattle described as the lobola
    money, and a sham-fight takes place as some participants push the oxen forward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A hut is reserved for the great mukonwana, identified as the man who married
    the fiance's sister and whose oxen are being used to buy the bride.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The official remittance of lobola is mediated by two ntjumi, after which male
    relations of the bride inspect and criticize the cattle while the other side praises
    them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Two oxen are killed for the feast; dancing and singing continue through the
    afternoon, and girls tie knots of grass where they part from the visitors.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A month later, the fiancee and women of her family bring pots of beer to the
    husband's village, remain outside, retreat when invited in, and enter only after
    urging.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The fiancee keeps carrying her pot until the suitor brings a goat, and shillings
    are given to induce her to enter the hut, sit down, wash her hands, and eat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: An ox is killed and its meat portions are allocated to the bride's father,
    mother, and maternal uncle; the heart and liver are skewered and set before the
    bride's father's hut as a notification from the husband's people.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: If the full lobola has not been paid, the bride's father delays her departure;
    the husband later brings the remaining oxen and gives a sovereign to each parent
    as a present called his spitting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The bride's trousseau consists of mats, spoons, pots, a wooden platter, a
    pestle and mortar, and a hoe provided by the maternal uncle.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Female relations exhort the bride to obedience and accompany her to the husband's
    village; the men do not go except for the bride family's ntjumi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Before the departure, the bride's father kills a fowl and makes a sacrifice
    to his ancestors, telling them that his daughter is going to be married and praying
    for her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: On arrival, the bride family's ntjumi speaks roughly to the husband and his
    assembled relatives, calling the bride their dog and referring to accusations
    of laziness, lovers, witchcraft, and a magic philter.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The husband's side responds that they will beat her but will try to deliver
    or protect her if the husband is too hard on her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Women cut shigiyane logs and fill pots with water while the feast continues;
    another ox is killed by the husband and the married pair sit on a mat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: Old women tell the bride she has been a good girl but will be treated as a
    slave and must accept hardship because her kin have eaten the husband's people's
    oxen.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: Women of the two families exchange insults; the bride's aunt praises the bride
    and insults the husband's people, while a woman of the other side criticizes the
    bride, and the aunt answers by calling the son formerly a wild beast whose tail
    they came to cut.
  category: speech
  evidence_refs:
  - ev:8
