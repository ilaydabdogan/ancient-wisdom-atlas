- id: obs:3
  text: Komatan objected to the return of the money, called it family property, and
    claimed the £20.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: After Hlangabeza died, Muhambi was identified as his heir because he was his
    makwabu, a first cousin on the paternal side.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Muhambi refused the inheritance, saying it was taboo for him as a Christian.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Komatan took Hlangabeza's first wife not as a wife, but because she had children
