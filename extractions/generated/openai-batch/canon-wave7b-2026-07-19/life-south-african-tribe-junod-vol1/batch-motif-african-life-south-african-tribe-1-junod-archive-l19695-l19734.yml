canonical_text:
  quote: ''
  summary: An ethnographic case describes Mboza and Muhambi attempting to reject lobolo
    money on Christian grounds, Komatan asserting that the money is family property,
    Muhambi refusing inheritance after Hlangabeza's death, Komatan using kinship and
    lobolo claims to keep wives and children connected to the Masuluke family, and
    a woman appealing over a child-weaning rite that requires a husband. The narrator
    concludes that the case illustrates the difficulties of suppressing lobola during
    a transitional period.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mboza and Muhambi, after being told that a Christian should not accept lobolo
    money, decided to return the money to Moses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Muhambi went to Johannesburg to earn the lobolo due to Phulan.
  category: action
  evidence_refs:
