  text: The woman's child needed to be weaned through a rite in which the husband
    must take part.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The woman complained to Mboza and Muhambi that she had no husband to clothe
    her, pay hut-tax, or repair her house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:12
  text: Muhambi said he could not take the woman as wife because he had married Ntshelebeti
    and Christians could not take many wives.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:13
  text: Muhambi told the woman she was free, while Mboza added that they were not
    sending her to commit sin and told her to think the matter over.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:14
  text: The narrator states that the case shows the complexity of lobola and the difficulties
