canonical_text:
  quote: ''
  summary: The passage lists bukonwana taboos connected with lobola, visits to parents-in-law,
    marriage preparation, food, and honey. It then explains that these taboos become
    less severe as affinal relations stabilize, framing marriage as a contract between
    two family groups marked at first by danger, fear, and mistrust.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If a lobola ox is frightened by the arrival shouts and sham-fight and runs
    home, the ox is taboo and is said to have perceived something wrong.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: An ox without horns or with abortive horns is taboo for lobola; the passage
    says the bride's family will not accept it because relations with relatives-in-law
    would lack tenderness.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: If rain falls on hoes while they are being carried as lobola, the wet lobola
    is taboo and is said to spoil the new relations and hinder marriage.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A fiancé going bukwen must not bring leaf tobacco, but may bring ground tobacco;
    after marriage, leaf tobacco becomes allowable.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A son-in-law staying with parents-in-law must not eat zebra or reedbuck meat;
    the passage also extends related concerns to giraffe and sheep, citing traits
    such as two colours, lack of horns, long bowels, and the reedbuck's cry.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When women accompany someone to the fiancée's parents to bring beer, a jug
    falling to the ground is taboo and requires returning home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Building a wife's hut before marriage or preparing a child's skin before birth
    is forbidden and is said to bring misfortune, including loss of the wife or abnormal
    birth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After marriage, husband and wife must avoid eating honey together for a year
    until she has had a child; the bride may eat honey at her parents' home, while
    the husband must conceal any honey eaten in the bush.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The honey taboo is explained through associations that honey flows, the bride
    is also sweet, and bees fly away after eating honey; the wife is correspondingly
    feared to leave.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that bukonwana taboos decrease in severity over time, and
    that strained relations between son-in-law and wife's mother become easier.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage explains marriage as a contract between two groups whose early
    affinal relation is dangerous and mistrustful, especially because lobola ties
    the groups' interests together.
  category: relationship
  evidence_refs:
  - ev:10
