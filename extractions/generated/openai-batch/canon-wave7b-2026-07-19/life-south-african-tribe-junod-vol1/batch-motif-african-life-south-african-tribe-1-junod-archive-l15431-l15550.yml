canonical_text:
  quote: ''
  summary: 'The passage describes the Thonga mbongi or herald at court: he claims
    the soldiers'' meat share, can rebuke or insult the chief, sings praise at coronations,
    and is rewarded. It then gives Mawewe''s praise song for Muhlaba of the Nkuna
    clan, including animal, feather, storm, water, war, and succession imagery, and
    the author''s comparison of the mbongi to a poet laureate.'
  language: English
  quote_policy: summarized
