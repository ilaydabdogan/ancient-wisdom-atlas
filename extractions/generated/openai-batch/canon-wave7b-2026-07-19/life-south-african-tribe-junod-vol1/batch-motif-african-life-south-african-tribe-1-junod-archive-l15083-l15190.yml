canonical_text:
  quote: ''
  summary: 'The passage describes customs surrounding the death of a chief: seclusion
    in old age, a year of secrecy after death, night burial, concealment of the grave,
    stated political reasons for secrecy, public mourning after the year, ritual recognition
    of the heir, and notes on royal wives, succession, and rare female chieftainship
    among the Thonga.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An aged chief no longer comes out of the royal hut, and counsellors manage
    affairs in his place.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief's death is to remain unknown for a whole year before being publicly
    announced.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The chief is buried at night without lamentations; his wives and grave-diggers
    undergo purification and vapour baths in secret.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fire of the royal hut is not kindled in the usual ritual manner but is
    kept burning throughout the year of secrecy.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Only selected persons, including government officials, the heir, and counsellors,
    are formally told of the death; a special hut is used to maintain the pretense
    that the chief is ill and still consulted.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The stated reasons for silence are to prevent enemies from attacking during
    confusion and to give counsellors time to prepare the new chief's installation
    and avoid bloody contests.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chief's grave is dug secretly in the sacred wood; in some groups the tumulus
    is levelled so that no visible sign remains.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The concealed grave is said to prevent enemies from exhuming the corpse and
    cutting off body parts for powerful war-charms.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the year of secrecy, people come to the capital clan by clan, sound
    antelope-horn trumpets, and bring an ox or a goat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The animals are slaughtered, and their bladders are presented to the heir,
    who pins them into his hair so warriors can recognize the future chief.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mourning signs include shaven heads, removal of the war crown by adult men,
    and wearing malopa blue cloth; grief is described as limited and followed by dances
    and condolences.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Among the Nkuna, the proclamation of a chief's death is made on the same day
    as the installation of the successor.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: One royal wife is described as the 'wife of the country,' bought with the
    people's money, and her son is the heir, though she is not necessarily the great
    wife.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: Women are rarely called to chieftainship among the Thonga, in contrast to
    the Ba-Pedi or Transvaal Ba-Suto, who are said to have had many reigning queens.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: An informant reports that an exceptionally heavy crop of miphimbi fruit was
    interpreted by some as a sign that the chief had died and had sent the plentiful
    supply.
  category: speech
  evidence_refs:
  - ev:3
