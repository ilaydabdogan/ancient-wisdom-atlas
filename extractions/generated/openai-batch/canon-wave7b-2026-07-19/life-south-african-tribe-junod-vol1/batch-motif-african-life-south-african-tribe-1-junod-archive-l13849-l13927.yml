  quote: the life of the nation is sustained through its chief
  summary: The passage describes the Thonga/Ronga chief as outwardly modest but socially
    and ritually sacred. It records images that present the chief as the source of
    communal life, fertility, protection, war leadership, and law, and it notes practices
    of distance, acclamation, taboo touch, and magical medicines associated with the
    royal body.
  language: English
