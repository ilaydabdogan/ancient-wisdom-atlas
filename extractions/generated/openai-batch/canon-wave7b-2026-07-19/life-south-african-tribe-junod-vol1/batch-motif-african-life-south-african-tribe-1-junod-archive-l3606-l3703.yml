canonical_text:
  quote: ''
  summary: 'Ethnographic passage describing Thonga male puberty customs: first seminal
    emission as entry into adulthood and the idiom of drinking nkanye; washing or
    a Mpfumo broken-pot medicine rite; adolescent clothing; ear piercing or cutting
    with healing taboos; and the subsequent gangisa courtship practice, including
    gifts, sexual permission for unmarried youths, pregnancy consequences, and condemnation
    of excess.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young man who first notices a seminal emission is said to have become an
    adult and to have drunk the nkanye.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The nkanye is identified as the tree from which bukanye is made for the new-year
    feast; drinking nkanye is described as a euphemism for entering puberty.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: One account says the lad must wash early in the morning; another says that
    in the Mpfumo clan a family doctor prepares medicine in a broken pot and the boy
    eats some and rubs all his joints with it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The medicine is said to strengthen the boy so that he will not be overcome
    by girls when he has relations with them; the rite is described as very similar
    to a broken-pot rite performed for infants and connected with gangisa.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: At puberty the boy begins to wear shifado clothing; older mbayi clothing is
    also described, and shifado is valued as protection from earth contact, ants,
    and as an aid to continence.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Boys who do not wear the shifado are blamed and accused of being ba-nato,
    a term connected in the passage with magical medicine used for immoral night-time
    adultery.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ear piercing also occurs at this period, either by piercing the lower lobe
    with a thorn or by cutting it with a knife; the thorn method is called old Thonga
    custom, while the knife method is attributed to Zulu-Ngoni practice adopted by
    Thonga men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A lad without pierced ears is mocked by comrades as a coward, with a taunt
    that his large unpierced ear could hold porridge.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Before the ear operation the boy bites the nd/ao reed root, described as a
    means of strengthening virile force; the doctor places a reed in the hole and
    washes the wound daily.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Until the ear heals, the lad must eat without salt, avoid eating porridge
    in other kraals, and keep away from girls; after healing he replaces the hard
    reed with a white object.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Tattooing and tooth pointing are mentioned as related customs, with tattooing
    described as disappearing and preserved mainly by women; the ceremonies are said
    to have been more taboo-marked formerly than at present.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: After puberty rites the boy is considered grown and allowed to practise gangisa,
    in which boys ask girls to choose one of them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A special blue cotton print called gangisa ntombi is offered by a lover to
    the girl of his choice to obtain her favour.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: When a girl has chosen, her boy plays with her as husband and wife; later
    relations may be sexual, unmarried girls must not become pregnant, and pregnancy
    can lead the girl's parents to demand marriage payment from the lover.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Excesses in gangisa are condemned; the boy may be called an adulterer and
    the girl is said to risk losing her head.
  category: speech
  evidence_refs:
  - ev:8
