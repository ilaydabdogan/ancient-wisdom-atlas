canonical_text:
  quote: ''
  summary: The passage describes changing media for Thonga lobola, from oxen to hoes
    and then money, and explains lobola as a compensatory transfer between kin groups
    when a woman moves from one family group to another through marriage ceremonies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Oxen are described as a long-used medium for lobola and as the regular means
    of obtaining a wife according to some accounts of the eighteenth century.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Manukosi appropriated cattle in 1820, the Thonga are said to have used
    beads and hoes instead of cattle.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Nkuna, after emigrating into the Transvaal in 1835, are described as paying
    lobola in oxen, with a father claiming ten oxen for his daughter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pedi bride payments are described as lower, two or three oxen, and this difference
    is given as one reason the Pedi and Thonga did not intermarry.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Technical expressions for lobola refer to herds, eating oxen, and a woman
    associated with the oxen given for a wife.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Hoes are described as widely used for lobola from about 1840 to 1870, together
    with oxen when available.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says the pound sterling and gold coin later became current in
    lobola as Thonga men worked in Pietermaritzburg, Kimberley, and Johannesburg.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Chiefs initially fixed lobola money at eight pounds, but parents later demanded
    higher sums, including ten guineas, twenty pounds, thirty pounds, or regional
    averages around eighteen to twenty-five pounds.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage distinguishes lobola obtained from a sister's marriage from acquired
    lobola earned by a boy through wage work.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Earned lobola is said to allow some boys without sisters to marry, and even
    to imagine marrying several wives.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The author explains lobola as compensation from one group to another, restoring
    equilibrium after one group gains a new member and another group loses one.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The wife is described as keeping her clan name while becoming aggregated to
    the new family through marriage ceremonies.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: The wife and her future children are described as collectively owned by the
    new family group, not as the individual property of one man.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: The woman's whole family, especially male members, are described as participating
    in the marriage ceremonies when lobola is brought by the bridegroom.
  category: action
  evidence_refs:
  - ev:14
