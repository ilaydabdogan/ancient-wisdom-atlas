canonical_text:
  quote: ''
  summary: 'The passage describes several Thonga/Tsonga marriage-related ceremonies:
    a returning fiancé has a symbolic thorn removed from his hair; in Nondwane a bride
    is captured from the bush, brought to her husband''s home with mourning songs,
    veiled, and later unveiled; in Maputju the bride''s companions bargain for money
    at thresholds, build a wood pile, hide the bride, and stage a snuff-offering followed
    by flight and return; and in the northern Nkuna clans betrothal and lobolo negotiations
    are conducted through go-betweens, followed by a reciprocal fiancée''s visit and
    feast.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fiancé may go to work in the mines during the betrothal period, probably
    to complete his lobolo, and a return ceremony called hlomula mutwa is then performed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the return ceremony, a long white thorn made of bone is placed in the fiancé's
    hair and the fiancée's shangwane removes it; the passage explains this as removing
    fatigue, suffering, and wounding thorns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Nondwane, girls accompany the new bride, go to the bush where she has fled,
    capture her, and bring her to her husband with mourning songs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Nondwane bridal songs warn the bride about a jealous husband and about
    future accusations of stealing and bewitching.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Nondwane bride covers her head, weeps, sits at the door of her husband's
    mother's hut, and withdraws when her husband sits near her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Men of the husband's village urge the bride to come near him, and the husband's
    aunts try to remove her veil; two days later they give her sixpence to remove
    the clothing covering her breast.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In Maputju, when the marriage procession is heard approaching, the new husband's
    friends meet it, but the bride's companions refuse to approach the village until
    money is given at several places and for unloading logs and beer pots.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the wood pile is arranged, women dance behind it and hide the bride
    while the husband and his friends sit on the other side.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The shangwane puts tobacco in the bride's hand; the bride kneels at a distance
    and offers snuff to her husband, then throws the remaining snuff into his eyes
    when he comes close.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The bride runs away, pursued by the husband's friends; if she grasps a tuft
    of grass outside the village, no one dares catch her, and more money is needed
    before she releases it and reenters the village.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: For the Nkuna betrothal visit, the suitor arrives with his shangwane and an
    old man acting as official representative or go-between, called ntjumi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The girl's father asks whether she consents; if inclined to agree, she asks
    to speak with the boy, and the parties are shown into the hut of the girl's mother
    with their shangwane.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the Nkuna lobolo discussion, two ntjumi move between separate huts, relaying
    questions and answers so that the two parties do not see each other during the
    debate about money.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:14
  text: Before the lobola feast, the fiancée and her friends return the visit to the
    young men's village; her mother has warned her to be cautious, beer is prepared,
    and a goat called the feather is killed for them.
  category: sequence
  evidence_refs:
  - ev:10
