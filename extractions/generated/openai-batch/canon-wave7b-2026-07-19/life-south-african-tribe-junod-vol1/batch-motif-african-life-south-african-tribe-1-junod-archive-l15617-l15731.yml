canonical_text:
  quote: ''
  summary: The passage describes Thonga court customs and royal paraphernalia, especially
    the big drum, its construction, taboos, reported hidden contents, and uses for
    announcing deaths, danger, war summons, and dances. It also describes the bunanga
    horn orchestra, the smaller drum called the big drum's son, the shipalapala assembly
    trumpet used by relay through sub-chief villages, and a rule for strangers visiting
    the capital.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Royal paraphernalia in Thonga courts are described as modest, with additional
    court objects including the big drum, the bunanga, and the shipalapala.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The big drum is found in every capital and sometimes in sub-chief villages.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The big drum is made from a hollowed stem with skin stretched over the opening;
    the skin may be from elephant ear, buffalo, ox, or antelope.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The big drum is subject to taboos: if the skin cracks, looking inside is
    prohibited, and the mystery associated with it must not be disclosed.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: People say a bullet is introduced into the big drum when it is made; in Shiluvane
    it was claimed that the skull of the hostile chief Sikororo had been put into
    the drum.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A special individual is summoned to repair the big drum and receives a fowl
    as reward.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The big drum is beaten to announce a great fatality, especially the death
    of a chief, the publication of mourning, an approaching inundation, or a bush
    fire threatening the capital.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The big drum is beaten to summon warriors to the capital in case of imminent
    war.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The big drum leads a special dance at the capital during winter after the
    harvest, when the country is described as happy and prosperous.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The smaller drum, shikolombane, accompanies the big drum and is called the
    big drum's son.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The bunanga is a royal-clan band made of larger antelope horns or trumpets
    pierced to produce different tones.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The bunanga orchestra is described as composed of ten instruments made by
    specialists; playing them is described as an art.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: During bunanga performance, players stand around the two drumbeaters, move
