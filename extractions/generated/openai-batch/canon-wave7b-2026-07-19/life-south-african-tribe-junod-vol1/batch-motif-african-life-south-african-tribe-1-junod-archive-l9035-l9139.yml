canonical_text:
  quote: ''
  summary: The passage explains Thonga affinal kinship terms and etiquette, especially
    bukonwana and mukonwana relations on the wife’s side. It describes respect, fear,
    avoidance, greeting forms, name avoidance, and village or hut protocols involving
    a mother-in-law and a son-in-law. It compares related Zulu mother-in-law avoidance
    customs. It also describes the 'great mukonwana,' a woman connected through lobola
    oxen, whose relation to the husband’s family can create avoidance behavior and
    possible marriage consequences if bridewealth must be reclaimed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mboza addresses Nsabula by several terms, including nsati, nkata, nkosikaqi,
    mamana, and ntjibeli.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the relevant moral relation includes limited tenderness and
    intimacy, with love mixed with respect and fear because a wife’s quarrel and return
    home could disturb affinal relations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bukonwana denotes both relationship on the wife’s side and, in a local sense,
    the village of the parents-in-law.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mukonwana is applied to the wife’s mother, father, elder siblings, and certain
    women lobola’d by the brother-in-law with the husband’s bridewealth payment.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Younger brothers and sisters of the wife are called balamo or tinamu, and
    the passage contrasts this relation’s ease and liberty with the respect and fear
    of mukonwana.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nwingi, nhombe, and bakhotikulobye are named as additional reciprocal marriage-relationship
    terms.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The wife’s mother is described as the principal mukonwana, especially in the
    first years of married life and particularly in northern clans.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: In a road encounter with the mother-in-law or related mukonwana women, both
    parties leave the road, enter the bush on the right side, sit according to gendered
    posture, and salute with hand-clapping gestures.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the mother-in-law’s village, balamo girls may play with the visitor and
    lead him to the mother-in-law’s hut; the mother-in-law sits outside, greets him
    without seeing him, and avoids pronouncing his name.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says that among Zulu people respect toward the mother-in-law is
    still greater, including discarding food in the mouth, covering the face with
    a shield, and avoiding her name.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Abraham Mabanyisi explains the respect toward the mother-in-law by saying
    that a man will never marry her and that such a thing has never been seen.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The great mukonwana is described as the wife of the brother-in-law, obtained
    through the husband’s oxen; in the example, Maphunga is bought by Mahangale with
    the payment made by Mboza for Nsabula.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The great mukonwana avoids the man on the path, avoids entering the same boat
    when crossing a river if possible, and reluctantly provides food by placing it
    in the hut when he is away.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage explains that because the great mukonwana was obtained with the
    man’s oxen, a dependency relation exists; if the original marriage fails, the
    oxen may be claimed, potentially annulling another marriage or transferring the
    woman as wife.
  category: sequence
  evidence_refs:
  - ev:10
