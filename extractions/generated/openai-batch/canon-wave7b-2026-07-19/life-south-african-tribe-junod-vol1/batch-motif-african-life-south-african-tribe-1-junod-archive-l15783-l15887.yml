canonical_text:
  quote: ''
  summary: 'The passage describes the Thonga chief''s tribunal: authority is concentrated
    in the chief, assisted by counsellors; laws and decisions are made through council
    discussion rather than voting; a lobolo payment limit is announced through sub-chiefs;
    disagreement can be settled by the chief''s decisive ruling; formal audiences
    use intermediaries and witnesses; judicial authority rests in unwritten custom
    interpreted by elders and counsellors, while discussion in the hubo is broadly
    open to competent speakers.'
  language: English
  quote_policy: summarized
