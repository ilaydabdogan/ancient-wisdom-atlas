comparison_claims:
- id: claim:1
  claim: The passage states that Zulu are said to have customs like the Pedi concerning
    the treatment and use of enemy corpses.
  claim_level: same_function
  target: Zulu and Pedi enemy-corpse customs
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: The wording is secondhand, and the author immediately states he cannot
    guarantee the extent of the customs among all Thonga clans.
- id: claim:2
  claim: The passage compares Ba-Pedi and Thonga practice by saying corpse mutilation
    is carried out more completely among the Ba-Pedi than among the Thonga.
  claim_level: same_function
  target: Ba-Pedi and Thonga treatment of enemy corpses
  evidence_refs:
  - ev:7
  counter_evidence_refs:
  - ev:12
  confidence: medium
  limitations: The comparison is limited to degree of completeness and is qualified
    elsewhere by uncertainty about clan variation.
- id: claim:3
  claim: The footnote cautiously links war-medicine use of enemy flesh with anthropophagy
    among hostile clans, especially the Fan of the Congo, as a possible ritual and
    military pattern.
  claim_level: archetypal_reading
  target: anthropophagy among hostile clans and Fan of the Congo
  evidence_refs:
  - ev:16
  counter_evidence_refs: []
  confidence: low
  limitations: The author presents the explanation as speculation and reports the
    Fan example secondhand.
