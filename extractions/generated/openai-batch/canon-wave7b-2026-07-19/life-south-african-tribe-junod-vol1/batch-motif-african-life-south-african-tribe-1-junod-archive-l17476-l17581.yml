canonical_text:
  quote: ''
  summary: The passage describes victorious warriors returning to the chief with songs
    and a circle dance, the public naming and praise of killers and their witnesses,
    and practices concerning enemy corpses, including trophy-taking, mutilation, and
    the use of body parts in war, agricultural, metalworking, and hunting medicines.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After victory, regiments return to the chief's village, sing hubu songs, form
    the mukhumbi, and dance.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Counsellors report the course of fighting to the chief and name those who
    killed enemies, struck the first blow, and transfixed the arm or leg.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The named heroes and bahlomuri dance before the chief and receive applause
    as important men and saviours of the chief.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A man who has slain an enemy gains the right to perform the war dance before
    the chief.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The slayer removes garments from the dead body, and in the case of a Pedi
    enemy may take the nsindo as proof of having killed a man.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A second and third warrior may pierce the dying or dead enemy's arm and leg;
    they are described as witnesses to the first man and gain an equal right to dance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A fourth man who stabs the dead body receives no glory.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Enemy corpses may be ripped open, disembowelled, cut into pieces, and used
    by medicine men to prepare charms.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The passage says enemy flesh and blood killed in battle are regarded as highly
    efficacious charm materials and are used to make a drug called murumelo.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The medicine is used on seeds and treated leaves at field corners to ensure
    a good harvest.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Blacksmiths mix the medicine with mineral ore to strengthen iron and avoid
    obtaining only slag.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Hunters use powder from tendons and bones with their own blood, smoke their
    weapons, and rub incisions with the powder so that they can aim straight.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Powder from tendons of slain enemies is spread on paths in future wars so
    that enemies walking on it will become unable to walk and be killed easily.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: Nkuna magicians are said to have taken back tendons from slain enemies, smeared
    them with medulla, and hung them on warriors' shields.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: The passage states that seeing those shields was expected to make enemies
    terror-stricken.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:16
  text: The author states that preserving and mixing part of the body with war medicine
    is based on the idea that eating enemy flesh absorbs enemy strength and prevents
    further harm.
  category: other
  evidence_refs:
  - ev:14
- id: obs:17
  text: The author says certain clan medicines contain a little human flesh and are
