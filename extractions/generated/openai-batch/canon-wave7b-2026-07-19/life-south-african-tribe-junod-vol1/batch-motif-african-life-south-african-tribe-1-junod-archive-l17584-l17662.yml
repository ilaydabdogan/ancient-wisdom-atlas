canonical_text:
  quote: ''
  summary: 'The passage describes the danger believed to follow killing an enemy:
    the spirit or influence called nuru may haunt the slayer, cause illness, madness,
    swollen eyes, giddiness, and bloodlust. Slayers undergo taboos and purification
    at the capital, using old clothes, special eating utensils, cold food, abstinence,
    and medicine to remove their defilement or blackness. A story is added in which
    boys who played with a human skull became afflicted by nuru and were treated by
    a specialist.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Killing an enemy in battle is said to bring great glory to the slayers, but
    also great danger.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The danger is identified as the mysterious and deadly influence of the nuru,
    described as the spirit of the slain seeking revenge on the slayer.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The nuru is said to haunt the slayer and may cause insanity, swollen and inflamed
    eyes, giddiness, and violent attacks on family members with an assagay.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Slayers are required to undergo a special medication described as taking away
    the nuru of their expedition.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that nuru is feared not only in slain enemies but also
    in connection with any human corpse and even dead animals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the reported story, boys rolled and beat a white skull found under a fig-tree;
    afterward they became delirious and their eyes swelled and exuded matter.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: A medicine-man experienced in treating nuru summoned the afflicted boys to
    his village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Slayers remain for some days at the capital, are taboo, wear old clothes,
    eat with special spoons and plates or broken pots, and are forbidden to drink
    water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The slayers’ hands and bodies are described as hot, defiled, and black; hot
    meat or food is said to make the defilement enter them or make them swell internally.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Sexual relations are forbidden to the slayers during the period of treatment,
    and they must not go home to their wives.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A medicine-man purifies the slayers by removing their blackness.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: One described treatment involves seeds, drugs, goat psanyi, and a broken pot;
    the ingredients are roasted, the slayers inhale the smoke, put their hands into
    the mixture, and rub their limbs and joints.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: For murder in a scuffle, the passage says the murderer may drink a little
    of his own urine and rub his forehead with it as a substitute treatment.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The passage states that nuru is less feared when killing occurs from a distance,
    such as with a gun.
  category: relationship
  evidence_refs:
  - ev:14
