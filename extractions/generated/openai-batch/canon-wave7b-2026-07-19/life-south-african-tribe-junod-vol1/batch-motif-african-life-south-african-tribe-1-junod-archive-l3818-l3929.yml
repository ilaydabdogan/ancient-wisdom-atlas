canonical_text:
  quote: ''
  summary: The passage describes Thonga and Ba-Ronga marriage customs, including age
    expectations for marriage, love charms for unsuccessful suitors or unmarried girls,
    a goat-based rite performed by the doctor Mankhelu to remove impurity connected
    with singleness, and the opening of Mpfumo betrothal procedure in which a young
    man with lobola cattle visits villages with friends to inspect prospective brides.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that, according to an older Thonga idea, a boy should think
    of marriage only when fully grown, though boys are said to marry earlier in the
    present generation.
  category: sequence
  evidence_refs:
  - ev:1
