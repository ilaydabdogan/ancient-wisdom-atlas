canonical_text:
  quote: ''
  summary: The passage interprets Thonga/Bantu first-fruits rites as religious offerings,
    hierarchical precedence, and seasonal transition. It then describes chiefly authority,
    taxation, and tribute in crops, beer, hunted animals, ivory, and objects found
    in crocodiles, grounding the chief's claims in divine status and identification
    with the soil.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The luma first-fruits rites are described as religious in origin: people
    should not enjoy produce before giving a portion to their gods.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gods are described as making cereals grow and as having power over wizards
    who bewitch fields.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A subject must not precede the chief, nor a younger brother the elder, in
    use of the new harvest; such precedence is said to be against order and dangerous
    to authority.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The text describes a passage from one year to another and from last year's
    food to this year's food at harvest.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the luma of bukanye, the passage notes a marginal period of general licence,
    a first mouthful marking aggregation to the new period, and protective magical
    powder.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The chief governs and commands; the subject obeys and follows the chief.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: When a man leaves one clan for another, he makes submission by telling the
    chief he wants to pay the tax.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The chief is described as the son of the gods, sharing their lordship, and
    as identical with the soil or earth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chief taxes subjects through harvest portions, portions of wild animals,
