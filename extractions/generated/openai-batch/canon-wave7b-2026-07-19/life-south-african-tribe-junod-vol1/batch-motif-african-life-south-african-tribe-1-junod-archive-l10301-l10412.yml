canonical_text:
  quote: Father-right rests on the lobola.
  summary: 'The passage discusses lobola as a marital transfer among the Thonga/Tsonga:
    it is compared to similar bridewealth institutions, presented as grounding paternal
    rights over children and marital legitimacy, then criticized for placing women
    under family and husband control, creating divorce repayment disputes, and straining
    relations between affinal groups.'
  language: English
  quote_policy: quoted
