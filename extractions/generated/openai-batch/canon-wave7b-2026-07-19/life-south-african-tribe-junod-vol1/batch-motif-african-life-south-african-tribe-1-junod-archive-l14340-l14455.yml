canonical_text:
  quote: ''
  summary: The passage describes luma first-fruits observances among Ba-Thonga/Ronga
    groups, including less religious rites for almonds and Strychnos paste, a formal
    Kafir corn rite involving the chief, royal powder, and offerings to ancestor spirits,
    rules about ranked participation and exclusion, and the opening context for the
    bukanye national feast when nkanye fruit ripens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the law of luma formerly applied to many foods, is now observed
    unevenly, and is strongly enforced for black Kafir corn and bukanye in four named
    clans; it also reports a contrasting Zulu and Swazi practice concerning maize
    and Kafir corn.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sub-chief named Habele confronted a boy eating mafureira almonds before
    the authorized luma, scolded the parents, and required them to pay a fine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the almond luma, almonds are softened in water in a small calabash, powder
    of nyokwekulu is added, the headman eats first and then distributes them, and
    participants suck the almonds and rub their faces with the uneaten part.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The almond luma is explicitly described as having no religious act.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: For the Strychnos paste, the chief sends a little paste to each village with
    a formula that it should be the first bite swallowed because the new year has
    come; no powder is used for it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the magical drug is used when the luma of pumpkin
    leaves takes place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the official Kafir corn luma, the great wife of the chief grinds the first
    grains, cooks the flour, and adds royal powder kept in a calabash to make shimhimbi.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The chief offers a little of the prepared Kafir corn food to ancestor spirits
    at the main entrance of the royal kraal and prays that the new year has come,
    that the gods should luma first, and that corn should support bodies and become
    plentiful.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'After the ancestor offering, people luma in a fixed order: chief, sub-chiefs,
    counsellors, warriors who have killed enemies, and headmen summoned to the capital.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: If a headman cannot come because of illness, his younger brother brings shimhimbi
    to him in a leaf, and the elder eats before the other brothers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Women do not eat the magic powder, and strangers, including settled strangers,
    have their own medicine and luma but must not luma before the chief of the country.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The bukanye luma is described as the most characteristic first-fruits ceremony
    and as a great national feast.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:13
  text: The nkanye tree, kanye fruit, and bukanye drink are distinguished by name;
    the fruit ripens and falls in January, and principal men approach the chief to
    say that the time has come to luma.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
