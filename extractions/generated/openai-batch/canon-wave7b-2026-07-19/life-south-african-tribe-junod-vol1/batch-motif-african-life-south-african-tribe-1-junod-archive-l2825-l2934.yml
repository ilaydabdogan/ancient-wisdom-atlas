- id: obs:3
  text: The circumcision school is held every fourth or fifth year; boys aged ten
    to sixteen are sent by parents, and uncircumcised adults can be compelled to attend.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The opening is set for a winter month when the morning star appears; Ngongomela,
    Venus, is described as preceding the sun and leading the boys to new life from
    darkness to light.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Candidates gather in the capital; the chief and council of headmen arrange
    and supervise the school, older circumcised boys serve as shepherds, a lodge is
    built outside the village, and women bring food daily.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: At dawn, when Ngongomela rises, the uncircumcised group goes from the inhabited
    world to the wilderness and the lodge; the text calls this the first separation
    rite.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: On the road the candidates smell smoke from a scented-wood fire and must jump
    over the firebrand in a rite called Tlula ritsa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Near the lodge, the candidates hear song, drums, and antelope horns; the words
    of the song are withheld from them because they would frighten them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Eight candidates are chosen, given assagais, pushed between two rows of singers
    holding sticks, and whipped as they run the gauntlet.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the gauntlet, the candidates are caught, stripped of clothing, have
    their hair cut, and are seated on eight stones near the entrance at a place called
    the place of the crocodile, facing eight Lion-men.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: Each seated boy is struck from behind and turns toward a laughing shepherd;
