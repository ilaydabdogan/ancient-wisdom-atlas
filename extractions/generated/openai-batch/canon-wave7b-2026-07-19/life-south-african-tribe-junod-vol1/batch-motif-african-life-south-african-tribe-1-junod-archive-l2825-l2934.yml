  quote: '"The boy has crossed (wela, like a boat across a river)"'
  summary: The passage frames Thonga circumcision as a rite of passage, then describes
    the organization of the circumcision school, the boys' separation from the village,
    threshold rites including jumping over a firebrand, a gauntlet, stripping and
    hair cutting, the circumcision operation, wound treatment, and the beginning of
    three months' seclusion in the sungi.
  language: English
  quote_policy: quoted
