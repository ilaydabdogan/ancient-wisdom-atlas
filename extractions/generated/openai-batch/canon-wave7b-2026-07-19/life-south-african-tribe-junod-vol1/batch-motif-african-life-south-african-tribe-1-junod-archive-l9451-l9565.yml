- id: obs:3
  text: At Shiluvane, the Nkuna clan of the Thonga and the Khaha clan of the Pedi
    are described as allied neighboring groups that had not intermarried, despite
    bilingual ability; reported explanations concern judgments about each other's
    customs and sexual morality.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The author organizes exogamic rules into four categories: absolute prohibition,
