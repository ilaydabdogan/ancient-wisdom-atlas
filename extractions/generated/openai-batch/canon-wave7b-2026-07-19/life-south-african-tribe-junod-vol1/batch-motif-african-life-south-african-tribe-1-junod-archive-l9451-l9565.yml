canonical_text:
  quote: ''
  summary: 'The passage describes Thonga marriage rules: general tribe/clan endogamy
    and family exogamy; local refusal of Nkuna Thonga and Khaha Pedi intermarriage;
    categories of prohibited and permitted marriages; severe paternal-line taboos,
    maternal-line restrictions, exceptions and conditions; and proposed reasons including
    consanguinity, incompatibility of blood and marriage relationship, and lobola
    obligations.'
  language: English
  quote_policy: summarized
