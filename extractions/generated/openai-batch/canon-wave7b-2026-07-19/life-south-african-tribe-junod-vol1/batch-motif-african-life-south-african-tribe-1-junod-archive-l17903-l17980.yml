  quote: ''
  summary: The passage argues that mission work and conversion create a divide between
    Christian converts and non-Christian tribal society, weakening tribal life. It
    predicts the continued loss of clan political cohesion and treats the disappearance
    of political responsibility as a serious loss. The author contrasts older chiefly
    councils with urban assemblies, assigns responsibility to White colonial interference,
    and considers Native franchise in Cape Colony as a possible way to preserve or
    restore political responsibility.
