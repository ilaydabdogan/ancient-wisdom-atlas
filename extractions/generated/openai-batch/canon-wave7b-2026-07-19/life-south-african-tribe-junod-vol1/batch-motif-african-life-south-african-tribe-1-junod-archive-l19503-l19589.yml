canonical_text:
  quote: '"it was a case of marriage by theft (tlhuba)"'
  summary: The passage recounts Gidhlana's troubled lobola marriage to Khandlela,
    her return to her father Ngwetsa, a proposal connected with Gudu, her abduction
    to Muzila's village, retaliation and compensation by her natal kin, the return
    of lobola money through a chain of projected marriages, Gudu's later marriage
    to her, deferred compensation through Shaputa, and Gidhlana's death from leprosy
    followed by nonattendance at her burial by her natal family.
  language: English
  quote_policy: quoted
