  claim: The Nondwane, Ba-Nkuna, and Mapulju rites share the function of preparing
    warriors for combat through war-medicine administration.
  claim_level: same_function
  target: Nondwane, Ba-Nkuna, and Mapulju war-medicine rites in this passage
  evidence_refs:
  - ev:2
