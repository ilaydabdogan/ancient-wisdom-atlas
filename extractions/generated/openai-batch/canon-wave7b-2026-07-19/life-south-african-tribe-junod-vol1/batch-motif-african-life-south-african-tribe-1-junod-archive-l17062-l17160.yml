  - ev:4
  - ev:6
  - ev:8
  - ev:11
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: 'The shared function is evident, but the techniques differ: potion
    and branch crossing, sprinkling, medicated meat, and emetic treatment.'
- id: claim:2
  claim: The Ba-Nkuna and Mapulju examples both use a warrior circle as part of the
    war-medicine preparation.
  claim_level: visual_similarity
  target: Ba-Nkuna mukhumbi and Mapulju mustered circle
  evidence_refs:
  - ev:5
