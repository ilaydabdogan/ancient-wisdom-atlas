canonical_text:
  quote: ''
  summary: 'The passage describes several pre-battle war-medicine rites among Nondwane,
    Ba-Nkuna, and Mapulju groups: warriors assemble, receive or ingest medicated substances,
    pass through or stand within ritual formations, are sprinkled or fed, and are
    described as gaining valour, losing fear, or becoming prepared to kill.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Nondwane army assembled at Nkanyen on the bank of the Nkomati before the
    battle of Morakwene.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A magician prepared a frothing medicine with two young girls as assistants
    while soldiers stood in a semi-circle holding their assagais level with their
    heads.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A ntshopfa branch was laid across the road; each battalion came forward, and
    each man jumped over the branch, took medicine into his mouth, spat it out, and
    pronounced the sacramental sound described as tsu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the medicine was finished, the doctor told the warriors that he had
    given them his strength and instructed them to go and slay.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Nondwane warriors crossed the river at night, kept strict silence for
    a long time, and then were said to feel that valour had taken possession of them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Ba-Nkuna in time of peace, a chief kills a black ox; the army is
    sprinkled and eats the ox flesh to make the country ready for danger.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When war is at hand among the Ba-Nkuna, the great medicine of the country
    is mixed with sheep psanyi and white sand from the river.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: During the night, the mukhumbi is formed, and the men sit in silence with
    heads bowed over knees and eyes closed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: An old queen, described as no longer having sexual relations and as naked,
    enters the circle, dips a leafy branch into the infusion, and sprinkles warriors
    inside and outside the circle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The old queen mutters commands to kill enemies, break their pots, kill their
    dogs, catch their chief, and bring named persons.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The warriors tremble, pray quietly to their gods for help, and do not dare
    to raise their eyes because they believe they would die.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that the officiating woman must be old, sexually inactive,
    and quiet, otherwise the assagais or masculine weapons would lose strength or
    become blind.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: In Mapulju, a comparable medicine is called the medicine of hatred and is
    described as dispelling natural feeling and enabling a man to kill another man.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: For the Mapulju rite, the chief has water drawn and ingredients gathered,
    then retires for a month to prepare the medicine with a knowledgeable magician.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: A bull is brought before assembled soldiers; the chief strikes it, unarmed
    men catch and throw it down, and the chief kills it with an axe.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The bull flesh is cut into strips, cooked in a large battered pot, stirred
    with assagais, and mixed with the medicine of hatred.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Commander-in-Chief mixes meat with scraped bone dust from a finger of
    a hostile petty chief killed in battle; the passage says this is to remove remorse
    or conscience.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: The Commander-in-Chief throws the treated meat into soldiers' mouths; they
    must receive it between the teeth and not touch it with their hands, while children
    collect meat that falls.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: On the following day the army goes to a lake, swallows an emetic from the
    water, vomits the previous day's meat, and the passage says fear is thrown up
    while valour remains.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:20
  text: After the emetic rite, regiments rush toward the chief on a hill, surround
    him, and ask to be sent quickly to fight and kill.
  category: action
  evidence_refs:
  - ev:12
