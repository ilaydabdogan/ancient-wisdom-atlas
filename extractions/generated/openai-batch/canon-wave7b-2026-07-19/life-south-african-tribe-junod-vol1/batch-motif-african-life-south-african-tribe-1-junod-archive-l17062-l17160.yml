candidate_motifs:
- id: motif:1
  label: pre-battle medicine conferring valour
  taxonomy_refs: []
  basis: Across the described rites, warriors receive medicine by mouth, sprinkling,
    food, or emetic treatment, and the passage links these actions with strength,
    valour, readiness, and the ability to kill.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:8
  - ev:11
  - ev:12
  confidence: high
  cautions: This is a passage-level motif candidate; the passage presents ethnographic
    rites rather than a narrative myth episode.
- id: motif:2
  label: animal killing and communal ingestion for war readiness
  taxonomy_refs:
  - sacrifice
  basis: The Ba-Nkuna chief kills a black ox whose flesh the army eats, and the Mapulju
    chief kills a bull whose flesh is cooked with medicine and fed to soldiers.
  evidence_refs:
  - ev:4
  - ev:10
  - ev:11
  confidence: medium
  cautions: The passage describes ritual killing and ingestion, but does not explicitly
    call the animal killings offerings to a deity.
- id: motif:3
  label: threshold passage before battle
  taxonomy_refs: []
  basis: The Nondwane rite includes jumping over a ntshopfa branch laid across the
    road and later crossing a river at night before warriors are said to feel valour.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage does not explicitly interpret the branch or river as symbolic
    thresholds; this is a pattern inferred from the described sequence.
- id: motif:4
  label: removal of fear or conscience through ingestion and vomiting
  taxonomy_refs: []
  basis: The Mapulju rite uses meat mixed with medicine and human bone dust to remove
    conscience, followed by a lake emetic through which fear is said to be vomited
    while valour remains.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The interpretation is partly explicit in the passage's own explanation
    of the rite.
- id: motif:5
  label: sexually restricted female officiant preserving weapon power
  taxonomy_refs: []
  basis: The Ba-Nkuna sprinkling rite requires an old sexually inactive woman; the
    passage states that otherwise assagais or masculine weapons would lose strength
    or sight.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The motif is specific to this described martial ritual and should not
    be generalized beyond the passage without further evidence.
- id: motif:6
  label: warrior circle in silence before violent action
  taxonomy_refs: []
  basis: Warriors form semi-circles or circles, sit or stand in silence, and receive
    treatment before commands or requests to kill.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:6
  - ev:11
  - ev:12
  confidence: medium
  cautions: Circle formations vary across the examples, and the passage does not assign
    one uniform meaning to all of them.
