  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that a father seldom obliges his daughter to accept a husband
    she dislikes, except in cases of debts.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: If all parties are satisfied, the buta or betrothal is concluded; the messenger
    is feasted and gives a shihlengwe present to the girl's parents.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The fiancé and fiancée each choose a shangwane, who must help them during
    the ceremonies.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bridegroom gathers his shangwane, several friends, and a little lad; they
    bathe, dress in fine attire and ornaments, take small shields, and eat before
    starting.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: After sunset the visiting party sits outside the gate and coughs to announce
    arrival; the hosts invite them in, while the visitors initially refuse before
    entering.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Girls take the visitors' sticks and miniature shields into the prepared hut;
    mats are unrolled, and the visitors finally sit after further entreaty.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The fiancée's parents and the visitors exchange news and health greetings;
    food is brought, refused at first, and eventually accepted.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: At night the old people retire, the young girls remain with the young men
    according to shigango custom, and the fiancée hides behind her friends and does
    not take part.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the morning the young men bathe; girls fetch water, throw it down the visitors'
    backs, the boys wash, and the girls anoint them with fat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: When the visitors ask to take leave, the older hosts send word that they should
    spend another night, and the second night is spent like the first.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: On the third day the young men leave, the young girls accompany them, and
    at parting boys and girls tie high grasses on the veldt; the passage says passers-by
    will know lovers parted there.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: At parting the young people arrange that the girls will return the visit after
    a week or two.
  category: sequence
  evidence_refs:
  - ev:8
