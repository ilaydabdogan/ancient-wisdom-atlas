canonical_text:
  quote: boys and girls tie together high standing grasses on the veldt
  summary: 'The passage describes Thonga/Tsonga betrothal procedures: a suitor asks
    his parents to send a messenger, the prospective bride is asked for consent, a
    gift and feast confirm the arrangement, and ceremonial betrothal visits follow.
    During the visit, companions assist the couple, hospitality is offered through
    formal refusals and insistence, young people spend the nights together according
    to custom, visitors are washed and anointed, and at parting the young people tie
    grasses as a sign that lovers separated there.'
  language: English
  quote_policy: quoted
