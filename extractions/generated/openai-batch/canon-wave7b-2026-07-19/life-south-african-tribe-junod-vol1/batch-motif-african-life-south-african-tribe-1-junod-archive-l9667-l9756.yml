    relationship being revived and strengthened by the new marriage relationship.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In marriage with the great mukonwana, the rite is performed and the wedding
    pair are covered with a goat's skin, which is called the cat and is said to scratch
    away the bukofiwana preventing the marriage.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Relatives from the eighth degree may marry unconditionally, but marriages
    into a too distant clan are discouraged because of possible disputes over wife,
    oxen, cattle, and fighting.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Some recommended marriages are based on a right of pre-emption, especially
    over a man's proper tinamu, including his wife's younger sisters or daughters
    of his wife's brother; the right is not absolute if he is not a good husband.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Marriage to relatives on the mother's side is recommended when the woman is
    not too near a relative, though the text notes a practical risk that related wives
    may all leave together after a quarrel.
  category: relationship
  evidence_refs:
  - ev:9
