canonical_text:
  quote: The aim of the dlaya shibongo is to lawfully kill one kind of relationship
    and to replace it by another, because the two are not compatible.
  summary: 'The passage describes Ronga/Thonga marriage rites and rules: a ritual
    involving payments, goat sacrifice, prayer to the gods, public removal of shame,
    exhortation of the bride, communal meat consumption, and taboo removal; it also
    explains permitted and recommended marriages, including preferential claims and
    inheritance-related marriage rights.'
  language: English
  quote_policy: quoted
literal_observations:
