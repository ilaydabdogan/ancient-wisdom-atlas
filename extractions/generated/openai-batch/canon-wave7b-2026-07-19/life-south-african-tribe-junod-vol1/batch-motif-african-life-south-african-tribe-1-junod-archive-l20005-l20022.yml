  summary: Latin ethnographic notes describe men seeking medicines for procreation
    and sexual vigor, preparations involving goat testicles, herbs, and beer, rules
    for sleeping arrangements among wives, and a powder made from a male organ that
    is applied to warriors' wrists and weapons to improve weapon accuracy.
  language: Latin
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men seeking medicine to procreate children confessed to the doctor that they
    had intercourse every night with three or four wives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A report concerning some monogamous households says a wife became so fatigued
    that she went out at night to work in order to escape her husband.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the doctor urged five days of complete abstinence from intercourse, the
    men could not agree to it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says certain remedies are used either to arouse sexual desire
    or to make wives pregnant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: One preparation consists of cut testicles of a he-goat, an animal said not
    to tire, mixed with many herbs, cooked, and eaten by the man.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A second preparation uses other collected herbs placed into beer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The effect is said to be so great that a man with no more than two wives is
    warned not to use it, lest he have intercourse with other men's wives.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Chaste men at Mpfumo are described as sleeping in their own house and sometimes
    calling the wife they desire.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Many men are described as spending one month in each wife's house in turn
    to prevent discord among wives.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A powder made from a veretrum is said to have a marvelous effect when sprinkled
    on warriors' wrists, giving them such skill that they throw no weapon in vain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Weapons called assagaies are also smeared with the powder.
  category: action
  evidence_refs:
  - ev:5
