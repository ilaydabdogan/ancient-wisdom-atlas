canonical_text:
  quote: ''
  summary: The passage criticizes Native tribunals for accepting witchcraft accusations,
    proposes administrative rules against buloyi cases and divinatory evidence, and
    then describes court-relevant insults, an ordeal by mondjo philtre, theft and
    property norms, signs distinguishing permitted mealie-taking from theft, anti-theft
    magic, tracking by footprints, and fines imposed through chiefs or courts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator says chiefs who accept witchcraft accusations should be punished
    when they have been told that the White Government does not allow such cases to
    be judged locally.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator explicitly compares local witchcraft prosecutions to the actions
    of European forefathers 300 years earlier, who tortured and burned suspected witches.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Proposed administrative directions state that buloyi is not recognized under
    penal law, chiefs may not try buloyi cases, plaintiffs are to be reprimanded,
    mungoma are to be fined, and divinatory bones are not to be accepted as evidence.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ordinary exchange of insults is said not to bring a judicial case unless accompanied
    by assault and bruises.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Using a stick to push human blood, spittle, or excrement toward a child’s
    mouth is described as a very serious insult judged before courts and fined at
    the value of a whole lobola.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In one reported case, a woman accused of giving a child a butterfly to eat
    denied the act, chose to drink the mondjo philtre, became intoxicated, and was
    fined because intoxication was taken as proof of culpability.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Pointing at someone with the index finger is described as a grave insult with
    possible judicial consequences because it is closely related to buloyi.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Theft is said to be condemned because it makes normal social life impossible,
    and the passage links property rights to labor performed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: A traveler-friend may take a cob from another person’s garden by uprooting
    the stalk, placing it by the road or against a tree, and drawing a line from the
    original spot to the place where it was set down.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A thief is distinguished from the permitted traveler because the thief breaks
    off the cob hastily and would not draw the identifying line.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some people smear mealie stalks with magical drugs and say a thief’s hand
    will be caught by the plant, although the passage says these means do not always
    operate.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When a thief is caught in the act, penalties can include seizure of the thief’s
    field and a fine; if the matter reaches court, the fine increases and the chief
    keeps one ox.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Store huts are positioned in fields or nearby bush with smoothed sand around
    them so that a thief’s tracks can be seen and followed by trackers.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:14
  text: Trackers may identify a thief from footprints, stride, or other marks and
    may follow the tracks to the thief’s village and hut.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: If detectives cannot trace a thief, they say that a thief will steal again
    and can be caught another time.
  category: speech
  evidence_refs:
  - ev:11
