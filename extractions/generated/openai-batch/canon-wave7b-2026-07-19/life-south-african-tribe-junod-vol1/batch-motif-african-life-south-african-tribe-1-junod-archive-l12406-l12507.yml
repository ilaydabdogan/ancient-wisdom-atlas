canonical_text:
  quote: ''
  summary: 'The passage describes Thonga village amusements: the tshuba board game
    with holes and stones, its terminology of luck, killing, hunting, and fighting;
    its popularity among men; evening games and storytelling practices; a taboo against
    midday tale-telling; a charcoal guessing game; riddles as an intellectual duel;
    and tales involving a bogey man, tricking animals, and a younger brother who saves
    his elders.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tshuba can be played with different numbers of holes, including 4, 8, 10,
    16, or 22; the passage gives a worked example with two players and sixteen holes.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the tshuba example, players move stones around prescribed rows of holes,
    pick up opposing stones, shout an imitation gun-noise, and describe some moves
    as killing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Specific stone configurations have named values, including tshonga for a single
    stone, mbiri for two stones, mpalati as bad luck, main as luck, and muhaha for
    a poor win.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tshuba speech uses travel, hunting, and combat language, including sleeping
    on the road, going to kill meat, the fight being hot, capturing warriors, and
    catching women.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that tshuba became a strong passion among men and that
    some Christian villages prohibited it because men were neglecting work.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Evening storytelling is described as taking place after daily work, especially
    when the moon shines, with people gathering at a fireside rather than on the village
    square.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: It is said to be taboo to tell tales at midday, and baldness is jokingly attributed
    to people who have broken that rule.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: In the charcoal guessing game, two sides face each other, women on one side
    and men on the other, while a hidden piece of charcoal is guessed from closed
    hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The charcoal game ends by finger-cracking; those beaten make faces at the
    victors, who must remain serious or lose their victory.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Riddle exchanges are described as simple or antiphonic, and as an intellectual
    fight in which the losing side must tell tales as a forfeit.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A renowned woman storyteller may hold the company under the charm of her tale,
    and children react with fear, laughter, or approval to different tale episodes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The named tale figures include a bogey man, the Hare, the frog Shinana, a
    despised younger brother, and the younger brother’s elders.
  category: object
  evidence_refs:
  - ev:8
