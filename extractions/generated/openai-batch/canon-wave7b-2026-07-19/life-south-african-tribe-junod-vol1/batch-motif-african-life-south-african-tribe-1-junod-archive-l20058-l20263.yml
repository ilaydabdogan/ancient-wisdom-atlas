canonical_text:
  quote: ''
  summary: A table-of-contents passage outlines the first part of the volume, organized
    around the life of the individual. It lists stages and rites for a man from birth
    to death, including infancy, childhood, puberty/circumcision, marriage, mature
    age, old age, and death, and then lists stages and rites for a woman from birth
    to death, including girls' games, nubility customs, marriage and conjugal life,
    widowhood, old age, and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage organizes the first part under the heading 'The Life of the Individual'
    and divides it into chapters on the evolution of a man and the evolution of a
    woman from birth to death.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:8
- id: obs:2
  text: The infancy section lists the day of birth, a first-week confinement period,
    nursing, diet during nursing, dentition, presentation to the moon, tying of a
    cotton string, and weaning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The childhood section lists boys' activities including herding goats, stealing,
    catching game, learning the science of the bush, and games.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The male puberty section lists circumcision rites and divides them into separation
    rites, marginal rites, and aggregation rites.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The marginal rites of circumcision include the sungi lodge, sexual and language
    taboos, trials, and the teaching of formulae.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The aggregation rites of circumcision include the Mulagaru pole, the Mayiwayiwana
    dance, the last day, and the Chameleon procession.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The marriage section lists love charms, betrothal, betrothal visits, taboos,
    a lobola feast, an assault of the village, counting of the lobolo, a wedding procession,
    a religious act, a symbolical belt, a tlhoma feast, customs of other clans, and
    marriage by abduction.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The mature-age section lists the Bantu ideal and the fixation of the wax crown.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The death section lists last days, grave, burial, Great Mourning, sexual rites
    of purification, familial mourning rites, various cases of death, and a conclusion
    regarding death and funerals.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The woman's life-cycle chapter lists girls' games, nubility customs, the khomba
    rite, tattooing, pointing the teeth, the milebe custom, marriage and conjugal
    life, feminine taboos, pregnancy and miscarriage, parturition, loss of children,
    adultery, divorce, widowhood, old age, and death.
  category: sequence
  evidence_refs:
  - ev:8
