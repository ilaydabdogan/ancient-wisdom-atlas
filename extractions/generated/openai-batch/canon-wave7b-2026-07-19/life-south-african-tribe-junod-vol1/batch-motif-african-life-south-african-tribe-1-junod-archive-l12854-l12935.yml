canonical_text:
  quote: ''
  summary: The passage describes Thonga clan organization through two examples, the
    Nkuna and Mazwaya. It presents clans as traceable to patriarchal families but
    shaped by migration, conquest, branch formation, succession disputes, hierarchical
    taboos, and the incorporation of immigrant groups. Named districts or provinces
    are called “doors,” petty chiefs found houses and bear laudatory names, and mixed
    populations may remain identified with a ruling clan name.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that the actual clan can be directly traced from the patriarchal
    family and introduces the Nkuna and Mazwaya as examples of clan composition.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Nkuna clan migrated from the confluence of the Oliphant and Limpopo to
    the Leydsdorp area around 1835; the author links its relative purity of descent
    to disturbed history and repeated migrations.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Nkuna descent line is given through Nkuna, Shitlhelana, Rinono, and Rinono’s
    sons; one son founded the current royal family, from which the chief Muhlaba descends.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Descendants of other sons of Rinono form named “doors” of the clan, each district
    being under a petty chief; the passage describes the nation as an enlarged family.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In Nondwane, the land was first occupied by the Mahlangwan, Honwana, and Nkumba
    clans, then later by Lebombo’s invading or settling group; the original clans
    submitted and mixed with them.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Mazwaya later conquered the whole country and placed relatives and sons
    in different parts of the land as petty chiefs while retaining old Lebombo chiefs
    as counsellors.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Many Mazwaya doors or provinces were formed; petty chiefs founded houses and
    had laudatory names, and several Mazwaya branches are listed.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Succession disorders led the main Mazwaya branch to lose paramount power;
    kingship passed among branches, while hierarchical order made it taboo to place
    a younger branch over the Masinga in their own jurisdiction.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Immigrants often settled in the country by asking Mazwaya chiefs and headmen
    to receive them; the passage says Thonga may leave their clan because they want
    change or because a witchcraft accusation has caused flight.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Rikatla examples show non-Mazwaya headmen and villages under a Mazwaya district
    chief; despite a mixed population, the estuary country continued to be called
    “At Mazwaya’s.”
  category: relationship
  evidence_refs:
  - ev:10
