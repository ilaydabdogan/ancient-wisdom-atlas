literal_observations:
- id: obs:1
  text: Among Thonga clans the death of a chief is said to be kept secret for a year
    or more; among the Nkuna, official mourning for the deceased occurs on the same
    day as the successor's coronation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Regiments of the army and warrior delegates from foreign clans are summoned
    for the Nkuna mourning and coronation sequence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A herald calls for silence, the new chief comes out of a hut and stands alone
    in the circle, and the herald identifies him to the warriors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The warriors ask for the chief's new name; the example given is Shikuna adopting
    the name Muhlaba Dabuka, said to be borrowed from a Ngoni chief of Bilen.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The proclamation includes an invitation for anyone opposing the coronation
    to state it; the Masakomo family leaves in anger in the example described.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: If the chief is still a child, he is carried on a shield or placed on a hut
    roof so that everyone can see him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: In the Ronga procedure, sacrifices are first made to the gods requesting that
    the ceremony pass quietly and without quarrelling; invitations are then sent to
    friendly surrounding kingdoms.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Foreign warrior contingents assemble and first go to the Mpfumo Counsellor,
    who receives and feeds them while they wait for the day of coronation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: After foreign contingents arrive, the Mpfumo army assembles and marches with
    them to the capital.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The royal family council, composed of uncles and older relatives of the new
    chief, meets in a separate hut and states that a new chief must be installed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Warriors form a large circle in an open space; an opening is left for the
    bodyguard to enter with the new chief hidden among them.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:12
  text: The hidden chief wears full military uniform and accoutrements, including
    ostrich feathers and strands of cow-tail hair on his limbs.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: A specially appointed bearer raises the young chief on his shoulders before
    the assembled armies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Counsellors, secondary chiefs, and young men of the Royal Family accompany
    the bearer around the inner side of the warrior circle while shouting that this
    is the chief and that there is no other.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: Battalions reply to the shouts with the royal salute, after which the gila
    war dance begins.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:16
  text: Heroes of the army and young men of royal blood rush into the enclosure, brandish
    weapons, jump, imitate battlefield prowess, and simulate transfixing enemies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: A murmuring cry from the whole army ends the jumping; the warriors reform
    into line and make their shields touch, forming an unbroken circle.
  category: sequence
  evidence_refs:
  - ev:6
