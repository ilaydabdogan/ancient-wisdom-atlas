canonical_text:
  quote: Behold the chief! Kill him! Kill him! There is no other than he!
  summary: 'The passage describes Nkuna and Ronga procedures for installing a new
    Thonga chief: secrecy and mourning after a chief''s death, summoning warriors
    and foreign delegates, public proclamation or elevation of the successor, challenge
    to opponents, sacrifices for a peaceful ceremony, royal salute, war dance, and
    a shield circle.'
  language: English
