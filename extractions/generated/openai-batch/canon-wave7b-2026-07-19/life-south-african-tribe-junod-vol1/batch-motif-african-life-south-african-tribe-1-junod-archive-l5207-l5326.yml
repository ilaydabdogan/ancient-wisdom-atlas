canonical_text:
  quote: ''
  summary: 'The passage describes Thonga/Tsonga mortuary procedures: announcing a
    death to relatives, ritually informing absent kin with burning grass, digging
    a grave conceived as a double structure with a square and hut, interpreting grave
    collapse as divination, assigning married grave-diggers to handle death defilement,
    carrying the corpse through a wall opening rather than the door, and placing the
    corpse with a sacred-tree pillow facing the direction from which the ancestors
    came.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young people are sent to relatives to announce the death, and an absent relation
    is informed by lighting grass, throwing it toward the absent person, and speaking
    a protective message.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The grave is dug behind the deceased's hut, in the surrounding forest, or
    in the sacred wood if the deceased belonged to the elder branch as a guardian
    of the forest.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A tree is sought near the grave so that some belongings of the deceased, which
    are to be kept but purified, can be hung on it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The grave is described as double: an upper large hole called the square and
    a lower circular or ovoid side excavation called the deceased''s hut.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The deceased is said to dwell in the lower hut and come out to sit on the
    underground square as he did while living in the village.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In some northern clans, the grave may be smeared with river mud, a reed may
    be placed beside the corpse, and water-grown grass may be spread at the bottom.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the grave vault falls in when mourners inspect it, the event is treated
    as a bad sign caused by the presence of a bewitcher or someone guilty of matlulana
    against the deceased.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The grave is explicitly called a mondjo, a magical means of divination.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The diggers are usually two married near relatives: the master of mourning,
    associated with the head, and a younger relative, associated with the feet.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Marriage is said to be required for grave-diggers because only married people
    can rid themselves of death defilement through the later rite called lahla khombo.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The corpse is wrapped in rugs and a mat, and burial generally waits until
    sunset.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The corpse is taken out through a hole bored in the right wall of the hut,
    not through the door, and it leaves head first.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The burial procession moves slowly and silently, and some participants close
    their noses with scented leaves to avoid the smell of death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: A piece of nkanye, identified as a sacred tree, is placed at the head position
    in the grave to serve as a pillow.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: The corpse is laid on the left side with its head on the pillow, oriented
    toward the cardinal direction from which the ancestors came.
  category: action
  evidence_refs:
  - ev:8
