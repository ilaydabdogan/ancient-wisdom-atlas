canonical_text:
  quote: ''
  summary: 'The passage recounts local warfare, raids, and battles involving named
    chiefs and yimpis, including a dawn invasion of the Shiluvane valley with a shouted
    war cry, the reported use of slain warriors'' flesh as magical charms, and conflicting
    reports about Rios''s corpse or skull. It then describes Nwamantibyane''s position
    during the 1894 war: his hesitation before war, pressure from young warriors,
    capture of prisoners, the killing of one captive followed by dancing, and a second
    captor''s frustrated demand to kill Tandane so that he could dance.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Maphephe was defeated in the Maharimane valley by the united yimpis of Sekhukhukhu
    and Nwanamohube, then fled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After seeking refuge with Maaghe in the Bokhaha valley, Maphephe organized
    a raid into Masume's territory.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rios avenged his friends by burning villages of Muhlaba and killing pigs;
    a later battle involved the armies of Maaghe and Muhlaba against those of Sikororo
    and Masume.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A party of Hollanders volunteered to come to Shiluvane to save women and children
    in danger, stayed for two days, and then departed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A confederation of yimpis under Sikororo and allied forces invaded the Shiluvane
    valley at dawn, burning huts, firing rifles, and shouting a cry glossed as 'Wind!
    Wind!'
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The invaders crossed the Moudi rivulet, but fled after the allied chiefs and
    their few men rushed to meet them; the passage says they mistook Christian Natives
    dressed like Europeans for the Hollanders.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: About forty invading warriors were left dead on the battlefield.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The flesh of the dead warriors is said to have supplied Zoutpansberg magicians
    with powerful charms.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Rios was killed; the passage reports one version in which his corpse was redeemed
    for ten guineas and another in which his skull was put in Maaghe's great drum.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: Nwamantibyane assembled his army but hesitated, with counsellors restraining
    him while young men demanded men to slaughter and called him a coward.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A small yimpi sent to reconnoitre made prisoners, stole Swiss Mission oxen,
    and brought captives and spoil to Nwamantibyane.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: One captor received permission to kill a Mabota passer-by, killed him in cold
    blood, and returned to dance before the chief.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: A Nwamba man asked to kill Tandane, refused compensation in stolen oxen, and
    said he wanted his man to kill so that he could dance; Nwamantibyane used force
    to silence him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Tandane returned with a letter from Nwamantibyane to the Portuguese Governor,
    but the Governor's reply was intercepted and the war continued.
  category: sequence
  evidence_refs:
  - ev:8
