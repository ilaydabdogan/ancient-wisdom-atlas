canonical_text:
  quote: ''
  summary: The passage describes a hard law requiring a mother to nurse her child
    through three ploughing seasons. If conception occurs before weaning, parents
    may hasten the ceremony, but elders judge this severely. If the child becomes
    sick, the husband may be blamed by the mother's parents, and a wife forced to
    transgress the law may report the matter to her husband's father. The author says
    such transgression is rare and children are usually spaced by two and a half or
    three years.
