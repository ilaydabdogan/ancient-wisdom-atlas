canonical_text:
  quote: ''
  summary: 'The passage describes several weapons and martial objects: Thonga hatchets
    with different blade forms, large knives, a dagger attributed to the Ba-Ndjao
    and similar knives made by Ba-Pedi, the assagai, the Thonga ox-hide shield with
    a pivoting stick structure, and the later use of guns by the Ba-Ronga. It also
    includes an incident illustrating an assagai wound and comparisons to Zulu shields,
    Chaka army shield colors, and Malagasy firearm practice.'
  language: English
  quote_policy: summarized
