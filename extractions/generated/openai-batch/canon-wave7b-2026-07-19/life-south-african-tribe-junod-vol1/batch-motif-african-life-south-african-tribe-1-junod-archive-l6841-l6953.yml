canonical_text:
  quote: ''
  summary: The passage describes girls’ tattooing, including triangular and square
    patterns, ochre, cutting, blood, clan variation, a week of hiding, congratulation
    by a boy with a fowl, and temporary food taboos. It then describes teeth pointing,
    the milebe custom, and conditions of marriage, including beauty ideals, lobolo,
    family reputation, love charms, self-proposal, abduction terminology, and the
    statement that marriage and childbearing are the expected career for Thonga women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tattooing operation is described as painful; girls sometimes cry and may
    be forced to submit to it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ordinary tattoo design includes triangles on the shoulders and under the
    breasts, with un-tattooed square spaces on the back and around the navel, and
    additional triangles forming a conical or pyramid-like shape between the breasts.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The tattoo design is drawn with ochre; the skin is lifted with a small iron
    hook, cut with a razor, and the oozing blood is stopped with ochre spread on the
    wounds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'Tattoo patterns vary by clan: the passage contrasts Nondwane, Nkuna, and
    Maputju examples.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A freshly tattooed girl hides for a week and then shows herself to her boy,
    who kills a fowl for her and congratulates her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The healing time after tattooing is treated as a disease or marginal period;
    salt in food and eating food in another village are prohibited, and girls prepare
    with a special food said to soften the belly skin.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The source author says the tattooing rules suggest an earlier ritual value,
    while the informant Mboza says it is not a regular taboo but a country custom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The pointing of girls’ incisive teeth is described as a declining custom;
    after the operation girls keep the mouth closed for two or three days.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The milebe custom is described as widespread in South Africa and still practiced
    in named regions and groups, though discontinued among most Ronga clans.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: Marriage conditions include suitors’ beauty preferences, fathers’ concern
    with lobolo payment, parents’ concern with work capacity, and fear of a family
    witchcraft blot.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: If a husband is slow to appear, a girl may seek love charms from a doctor;
    if that fails, she may make proposals to a man, after which he is described as
    having taken her in marriage by abduction and must pay lobolo.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that marriage and childbearing are the only career available
    to a Thonga woman in this context, leading into special feminine taboos.
  category: other
  evidence_refs:
  - ev:8
