canonical_text:
  quote: ''
  summary: 'The passage reports burial and post-burial customs among several southern
    African groups: corpse removal through a doorway, treatment of the dead person''s
    hut, corpse positioning, exclusion or destruction of certain grave goods, preservation
    and purification of valuable goods, beer offerings for the dead, seeds placed
    in the grave, and a small hut built on the grave of Sokis, an exorcist. It also
    includes a brief Swiss comparative note about carrying a corpse out feet first.'
  language: English
  quote_policy: summarized
