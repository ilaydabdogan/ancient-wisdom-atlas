  evidence_refs:
  - ev:7
- id: obs:10
  text: Old earthen pots are broken on the grave, with the stated reason of showing
    anger against death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A mug may be placed on the grave with its bottom pierced so that beer offerings
    can later be poured into it for the dead.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Perishable belongings are said to die with the deceased and are called his
    filth; in some Northern clans such objects are burnt.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Iron, copper, and brass are not to be buried with the corpse; the passage
