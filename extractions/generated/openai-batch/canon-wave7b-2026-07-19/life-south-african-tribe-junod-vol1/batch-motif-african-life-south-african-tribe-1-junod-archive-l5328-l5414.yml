  text: In the Hlabi clans, the corpse is carried through the door while plaster on
    both sides of the door is beaten down and later repaired.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Northern clans, the deceased person's hut is described as less strongly
