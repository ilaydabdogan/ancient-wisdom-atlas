- id: obs:4
  text: The Ba-Ngoni are described as placing their dead in the grave in a sitting
    position with a knife in the hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage contrasts the Ba-Ngoni sitting corpse posture with a reclined
    corpse position attributed to the Ba-Ronga.
  category: relationship
  evidence_refs:
