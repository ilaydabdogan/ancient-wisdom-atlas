  quote: Their life was in the cat.
  summary: The passage discusses Nkuna animal laudatory names and possible borrowed
    totemism, recounts the tale of Titishan in which a family's life is bound to a
    cat whose death destroys the clan, and describes a taboo on killing or eating
    the Shidyanaman antelope with a spoken formula for accidental killing.
  language: English
  quote_policy: quoted
