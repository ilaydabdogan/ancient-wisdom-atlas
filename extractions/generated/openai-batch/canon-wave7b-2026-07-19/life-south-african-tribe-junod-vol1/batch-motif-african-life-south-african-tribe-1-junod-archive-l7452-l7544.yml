canonical_text:
  quote: ''
  summary: The passage describes secret mourning rites for a widow, including a road
    taboo, an incision, smoke from a small fire, removal and return of clothing, a
    crossing of the deceased husband’s hut through a corpse-hole, subsequent widowhood
    restrictions and purifications, and a later gathering to determine the widows’
    future husbands. A footnote says widowers undergo similar rites after losing a
    first wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mourning women’s company occupies the main road, and others are warned not
    to approach or see the rites.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: One widow makes an incision on the new member in the left inguinal region;
    flowing blood is treated as a good sign and lack of flow as a bad omen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A small fire is lit from dry grass taken from the deceased’s roof; cock excrement
    is thrown into it, and the widow exposes both hands to the smoke.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that the rites are similar to first circumcision rites
    and calls them initiation rites marking passage from one condition into another.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the road rite, the widow’s clothing is removed, a reed or palm thread
    with broad leaves is tied around her waist, and she is brought home surrounded
    by other widows.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Men are warned to leave the road because they are not allowed to see the procession.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The widow enters the hut of the great wife through the door, cries out to
    her husband, and exits through the hole made in the wall for carrying the corpse
    to the grave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The widow’s old clothing, washed in the pool, is returned to her behind the
    hut and worn again for two days.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: A small provisional hut is built before the mortuary hut, where the great
    wife stays during widowhood; the space between huts is partly taboo and holds
    possessions of the deceased.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Widows participate in purifying acts, including vapour baths and sprinkling
    on the fifth day; the first wife receives stronger medicinal smoke than inferior
    wives.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Widows wear malopa and eat with spoons during the year of widowhood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A later gathering provisionally fixes the widows’ future, with the deceased’s
    sisters leading discussion about new husbands.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: If the deceased had at least five wives, the passage gives an order in which
    wives may be assigned to brothers, a sister’s son, and a son of the deceased.
  category: relationship
  evidence_refs:
  - ev:10
