canonical_text:
  quote: ''
  summary: The passage interprets Thonga marriage ceremonies as rites of passage involving
    separation from one status, family, or village and aggregation into another. It
    lists bride-separation actions, collective feasting, acts of civility, mutual
    reserve between affinal groups, changes among Christian converts, the replacement
    of ancestor sacrifice by Christian blessing, residence rules, and several practices
    said to be absent.
  language: English
  quote_policy: summarized
