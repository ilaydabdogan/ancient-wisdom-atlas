canonical_text:
  quote: '"Hosi a yi faneli ku bona ntukulu", a chief must never see his grandson.'
  summary: 'Ethnographic account of Ronga chiefly succession: the principal wife’s
    pregnancy and a male heir’s birth are concealed; the child is guarded, ritually
    protected, later transferred to the capital by divinatory sanction, initiated
    at puberty, and restricted from official marriage until after his father’s death
    so the reigning chief does not see the next royal grandson.'
  language: English with Thonga terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The principal wife of a reigning chief, called the wife of the country, is
    sent away from the capital under pretext of illness when she is expected to bear
    an heir, and the pregnancy is not to be spoken of publicly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the infant is a boy, the fact is kept secret; renowned royal doctors attend
    the birth and prepare milombyana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother covers the child with cloth and may dress the boy in girl’s clothing;
    declaring aloud that the child will be a chief, or using male clothing, is described
    as dangerous, taboo, and unlucky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The royal offspring grows unrecognized; the mother returns to the capital
    while the child remains in the village where he was born.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Specially appointed persons watch over the child and report his wellbeing
    to his father; playmates are taught to respect him and he is surrounded by a miniature
    court with favourites and counsellors.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The child and his companions play at court and soldiers, waging play-war against
    wasps and boys from adjoining villages.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At boyhood, bones are consulted and sacrifices offered to determine from the
    gods whether the boy should be taken to the capital; dice declare the propitious
    time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The transfer to the father and capital is marked by a feast, slaughtered animals,
    sacrifice to proclaim the heir’s return to the gods, and a goat astragalus tied
    to the boy’s ankle as a protective amulet.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: At puberty the boy undergoes the usual ceremonial rites, and principal doctors
    treat him so that he may be a man.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Older comrades are attached to the youth to prevent sexual excesses; he lives
    in relative continence while sharing the play and work of boys of his age.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: While his father is living, the young heir may not be officially married;
    any previous wives are morganatic and their children have no right to royalty.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A royal precept states that a chief must never see his grandson, meaning the
    grandson who would eventually succeed in the royal line.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: 'The Ba-Ngoni of Gungunyane are said to have the same custom but a different
    arrangement: a married eldest son loses succession and a younger son without children
    inherits, leading to jealousy and civil war.'
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: As an exception, a very old chief may pay lobolo for his son’s official wife,
    who will be considered the wife of the country.
  category: action
  evidence_refs:
  - ev:10
