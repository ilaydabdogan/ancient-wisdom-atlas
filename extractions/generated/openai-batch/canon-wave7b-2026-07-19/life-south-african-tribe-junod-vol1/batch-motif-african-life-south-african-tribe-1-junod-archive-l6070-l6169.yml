canonical_text:
  quote: ''
  summary: During a mourning ceremony after the deceased's hut has been crushed down,
    the men wash, the family assembles around the hut area, and kin of the deceased
    slaughter fowls and a goat described as offerings. Women give piercing cries,
    mourners dance and sing sexually explicit taboo songs, and the source explains
    this conduct as proper to the mourning period and to a marginal phase of life.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the operation, the men were satisfied that mourning had not overcome
    them, and they washed their hands and faces with water brought in pots.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Family members, including women, assembled near the crushed hut and the first
    widow's small hut; groups were arranged by age, gender, and kin category, leaving
    a wide place for dancing.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fenis, the brother of the deceased, brought a young goat, and two hens with
    a cock were also provided, making two male and two female offerings.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Branches covered with leaves were spread before the heaps of poles.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The batukulu killed the fowls by holding their legs and heads and cutting
    their necks; women emitted piercing cries at each cut, and people laughed as the
    fowls jumped before dying.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: One batukulu lifted the goat and stabbed it under the shoulders; the goat's
    face was turned toward the North, women cried out, and the source states that
    it was necessary for a victim to cry.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The killing of the goat took a long time, and the sacrificer's wife came to
    help him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: While the batukulu and old men cut up the victims and emptied the bowels,
    other mourners began to sing and dance.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: An elderly woman sang in the middle of the dance space and performed a sexually
    explicit thigh or womb dance; other women clapped and beat drums, while men lowered
    their eyes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The song words described an adulterous woman going at night from one hut to
    another, and another old woman later performed similar words and movements.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The source reports that, in Thonga opinion, taboo songs are specially appropriate
    during mourning, and that mourning is a marginal period marked by sexual prohibition
    alongside obscene words and gestures.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a note, the source supposes that the goat may have faced North so its cry
    would call ancestor spirits to the sacrifice.
  category: other
  evidence_refs:
  - ev:5
