canonical_text:
  quote: ''
  summary: 'The passage describes the closing day of boys'' circumcision seclusion:
    a sleepless night trial, burning of ritual remains and the seclusion establishment,
    running to water without looking back, washing and re-clothing, instruction in
    adult conduct and ritual secrecy, and public reintegration through a chameleon-like
    procession, recognition by female kin, gift exchange, new names, praise, and final
    return home.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the final night the boys are not allowed to sleep, stab the Elephant,
    and repeat formulae until morning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Manyabe collects remaining bits of skin from circumcision, burns them,
    makes powder, and smears the mulagaru pole with it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Masks and grass mats are thrown on the roof of the shed before the troop is
    directed toward a pool at dawn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The circumcised boys are made to run to the pool without looking backward;
    the passage says looking back would lead to pierced eyes and permanent blindness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Men set fire to the establishment, and the passage states that childhood filth
    and ignorance are burned in the conflagration.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boys enter the water, wash away white clay, cut their hair, anoint themselves
    with ochre, and put on new clothing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The father of the circumcision tells the boys they are no longer shuburu,
    should behave like men, and must not pronounce or reveal the formulae or songs
    of the sungi.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women bring porridge with sauce, and shepherds are no longer allowed to use
    insulting words when receiving pots from them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: In the chameleon procession the initiated are covered with ochre, walk on
    mats so their feet do not touch dust, bow down, and imitate the gait of the chameleon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mothers and sisters search for and recognize their boys; a woman gives a small
    present and kisses the boy, and the boy rises, strikes her shoulder, and utters
    his new name.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After the boy gives his new name, the mother dances and sings his praises.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The procession is repeated in villages of main headmen until the ochre is
    removed and the initiated return home definitively.
  category: sequence
  evidence_refs:
  - ev:8
