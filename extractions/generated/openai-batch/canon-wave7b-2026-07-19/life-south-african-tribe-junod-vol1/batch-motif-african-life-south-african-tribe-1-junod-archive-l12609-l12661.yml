canonical_text:
  quote: ''
  summary: The passage describes Thonga hospitality toward travelers, including lodging,
    food when available, and a formal news-exchange ceremony called djungulisana.
    It notes changes caused by young men returning from towns, limits of compassion
    toward outsiders from other clans, a case in which Lois nursed an injured boy,
    former taboos involving sandals in the village square and sitting above the ground,
    and the absence among the Ronga of offering a concubine to passers-by.
  language: English
  quote_policy: summarized
