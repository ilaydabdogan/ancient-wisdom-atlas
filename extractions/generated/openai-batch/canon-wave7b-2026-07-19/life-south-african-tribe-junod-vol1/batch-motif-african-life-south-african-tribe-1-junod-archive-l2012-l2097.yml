canonical_text:
  quote: ''
  summary: 'The passage describes Thonga/Tsonga infant customs following birth: restrictions
    before the yandla, a playful growth-blessing called kulakulisa, and a preventive
    therapeutic rite called biyeketa or hungulo dja milombo involving an enclosure,
    fire, boiling medicines, steam and smoke, scarification, medicinal powder, water,
    spitting, and prayers to ancestral spirits. It also notes payments to the physician
    and a Christian-convert adaptation of the prayer.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before the yandla, the father was not allowed to take the child in his arms,
    but after it he may do so.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the yandla, it becomes permissible to push the child gently by the elbows
    and sing consoling songs when the child cries.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In kulakulisa, a family friend from afar takes the newborn child in his arms,
    throws the child up, and speaks a growth wish naming Johannesburg as a destination.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage describes kulakulisa as a minor, more playful custom and says
    it is not taboed like the yandla.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The biyeketa is performed twice a month in the afternoon, at new moon and
    full moon, by the family doctor at the baby's kraal.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: For the biyeketa, the doctor lights a fire before the hut door and boils medicines
    with water in a pot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A mhula pill, made of paunch fat mixed with medicinal powder, is laid on embers
    beside the pot.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: A mat is set upright to form a small round enclosure, and mother and baby
    enter it under a cotton cloth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mother and baby expose themselves to steam from the pot and smoke from the
    mhula until they perspire, then emerge from the vapor bath.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The doctor scarifies mother and child at several body points and introduces
    medicinal powder into the small wounds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Behind the hut, the mother pours some of the decoction into the doctor's hands;
    he spits into it, makes the sound tsu, and throws it on the child.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The mother rubs the child's whole body with the treated water while the doctor
    prays to his gods, identified as ancestral spirits.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:13
  text: The doctor's prayer asks that the child grow, become a man through the medicine,
    have good perspiration, be freed of impurity, play well, and be protected from
    disease.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The biyeketa is also called the bath for infantile diseases and is described
    as preventive rather than curative.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Neglecting the biyeketa is described as taboo and important for the child's
