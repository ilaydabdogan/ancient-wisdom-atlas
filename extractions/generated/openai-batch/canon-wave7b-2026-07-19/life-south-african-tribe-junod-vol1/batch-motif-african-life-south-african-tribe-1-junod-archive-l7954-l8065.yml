canonical_text:
  quote: ''
  summary: The passage describes the status of old women, their ritual permissions,
    their continuing attachment to fields, and the mahloko mourning ceremony when
    a woman dies in her prime. It recounts possible replacement marriage, lobolo or
    herd claims, suspicion of witchcraft, mediation by the ntukulu, destruction of
    the deceased woman's hut and belongings, sacrifice, prayer to the deceased and
    ancestors, and the transition from mourning to rejoicing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An old woman who has left the childbearing sexual community is allowed ritual
    privileges taboo to women still capable of childbearing.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the black ram is sacrificed for rain, only old women and small girls
    are allowed to eat the victim's flesh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Old and decrepit women may be despised as burdens, but a vigorous Thonga woman
    continues going to her field and tilling with her hoe until death.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mahloko occurs when a woman in her prime dies, and her parents describe the
    deceased as their 'head'.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the two families are friendly, the parents of the deceased may bring a
    little girl to replace the deceased wife, with a new contract and lobolo payment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the deceased wife had not been fully paid for, her parents may come at
    the end of mourning to claim the herd.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brothers of a woman who died before her expected time may suspect that
    the husband's family or co-wives bewitched her.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The visiting mourners assemble, throw bones to determine speakers and money
    matters, drive a goat before them, sit outside the village, and refuse initial
    greeting gifts.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The ntukulu mediates between the families, declares that his father has not
    killed or eaten his mother, throws sand at the visitors, and weeps until they
    agree to enter the village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: In front of the mortuary hut, the deceased wife's belongings are piled up;
    her brothers break them, remove the roof, and throw the roof and wall plaster
    into the bush.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A sacrifice is performed amid the ruins of the hut while women from both families
    exchange accusations and denials about the deceased woman's death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The elder brother prays to the deceased woman, asking her to go in peace,
    not be angry, call named dead kin, and give good sleep and good health.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The batukulu appropriate the offering, and the mourning ends in laughter,
    dancing, drinking, and neighbourly rejoicing.
  category: sequence
  evidence_refs:
  - ev:10
