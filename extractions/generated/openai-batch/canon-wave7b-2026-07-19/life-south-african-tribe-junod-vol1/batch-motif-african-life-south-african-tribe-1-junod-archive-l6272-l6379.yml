candidate_motifs:
- id: motif:1
  label: mourning assembly establishes succession and inheritance
  taxonomy_refs: []
  basis: The passage links family gatherings in the final mourning period with proclaiming
    the new village master and distributing inheritance.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The account says the author cannot fully vouch for the exact two-gathering
    sequence.
- id: motif:2
  label: ritual beer feast thanking grave-diggers
  taxonomy_refs: []
  basis: Widows host the grave-diggers at the beer of the hyenas a month after burial
    as thanks for their services.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The hyena explanation is local and literal in the passage; broader symbolism
    should not be inferred without more evidence.
- id: motif:3
  label: reciprocal mourning exchange with animal sacrifice
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: Relatives bring goats or money and receive equivalent return gifts, and animals
    are killed with a sacrifice offered during the mourning gathering.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The taxonomy labels are broad; the passage describes a specific mourning
    exchange rather than an abstract mythic exchange.
- id: motif:4
  label: mourning purification and removal of death pollution
  taxonomy_refs: []
  basis: The passage describes hut taboo ending, repairing the hut, psanyi application,
    steam baths, sprinklings, and cases where no purification occurs because there
    is said to be no contagion.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:9
  - ev:11
  confidence: high
  cautions: The term death pollution is an analytic label; the passage uses terms
    such as taboo, purification, and contagion.
- id: motif:5
  label: deceased treated as god and petitioned
  taxonomy_refs: []
  basis: Viguet is cited as saying the deceased is first treated as a god and prayed
    to to keep, bless, and increase the village.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives this as Viguet’s account; it should be reviewed against
    the wider ethnographic context before generalizing.
- id: motif:6
  label: substitute burial for absent dead using personal belongings
  taxonomy_refs: []
  basis: For a man who dies far from home, relatives bury his mats and clothing in
    a grave, and the passage says these objects are himself.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not describe an afterlife journey or resurrection; it
    only describes substitute burial practice.
- id: motif:7
  label: grave sacrifice with fowl for absent burial
  taxonomy_refs:
  - sacrifice
  basis: A sacrifice is made over the grave by throwing a fowl on it in the case of
    a man who died far away.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The use of the fowl is specific to this rite and not enough to infer a
    wider bird symbolism.
- id: motif:8
  label: burning as disposal of belongings or dangerous corpse
  taxonomy_refs: []
  basis: Northern clans burn belongings of a man who died far away, and Maluleke and
    Hlengwe burn an unknown stranger’s corpse until danger is said to have departed.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The available motif taxonomy includes fire only as a symbol and world-destroying
    fire as a motif, which is not supported here.
- id: motif:9
  label: avoidance of corpse contact in stranger burial
  taxonomy_refs: []
  basis: An unknown stranger’s corpse is dragged by rope into a grave, and the men
    do not touch it.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage attributes the lack of purification to absence of contagion
    but gives limited explanation for the no-touch procedure.
- id: motif:10
  label: taboo dwelling as burial place for leper
  taxonomy_refs: []
  basis: The footnote says the hut of a leper is irremediably tabooed because the
    sufferer is buried in it and the roof crushed over him.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: This is a special case mentioned in a note rather than the main mourning
    sequence.
comparison_claims:
- id: claim:1
  claim: 'The northern-clan account is explicitly contrasted with the Ba-Ronga: batukulu
    take the gods’ portion in the northern rite, whereas among the Ba-Ronga the same
    kind of portion is said to be stolen.'
  claim_level: same_function
  target: Ba-Ronga treatment of the sacrificial portion for the gods
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives only a brief contrast and does not describe the Ba-Ronga
    rite in detail here.
- id: claim:2
  claim: 'The passage compares two local treatments of an unknown stranger corpse:
    burial without touch in a Thonga village and burning among Maluleke and Hlengwe;
    both dispose of the corpse while managing danger or contagion.'
  claim_level: same_function
  target: Maluleke and Hlengwe burning of an unknown stranger corpse
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The practices differ materially, and the text provides only a short
    explanation of danger departing after the explosion.
- id: claim:3
  claim: The passage explicitly compares Matjuwa before a deceased person’s name with
    French feu and English late.
  claim_level: linguistic_similarity
  target: French feu and English late as terms before names of the dead
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: This is a lexical comparison, not evidence for shared ritual origin.
