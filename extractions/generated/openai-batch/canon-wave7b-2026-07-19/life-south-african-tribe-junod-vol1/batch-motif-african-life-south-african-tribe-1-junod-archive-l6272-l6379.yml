- id: ev:8
  type: summary
  locator: lines 6337-6351
  quote_or_summary: For a man who dies far from home, ceremonies wait for confirmation;
    relatives assemble, dig a grave, bury his mats and clothing, and make a sacrifice
    by throwing a fowl on the grave; the passage says the soiled belongings are himself.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 6351-6358
  quote_or_summary: The widow eats with her hands until the burial, even if death
    happened long before, and uses a spoon only after burial; steam baths, sprinkling,
    singing, dancing, and condolence visits follow as in ordinary mourning.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: lines 6359-6364
  quote_or_summary: In northern clans, belongings of a man who dies far away are burnt
    and purifying sprinklings are performed; the same applies to relatives who die
    accidentally and whose corpses have not been buried, such as those killed by wild
    beasts or in battle.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: lines 6365-6379
  quote_or_summary: An unknown stranger in a Thonga village is buried by grown men
    who drag the corpse into a hole with a rope and do not touch it; no purification
    is performed. Among Maluleke and Hlengwe, such a corpse is burnt and watchers
    remain until an explosion shows danger has departed.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:12
