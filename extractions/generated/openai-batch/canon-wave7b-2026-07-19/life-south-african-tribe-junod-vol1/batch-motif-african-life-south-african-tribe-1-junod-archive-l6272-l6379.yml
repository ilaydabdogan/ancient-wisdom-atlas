    a god and prayed to to keep, bless, and increase the village; batukulu then take
    the portion set aside for the gods, apparently not by theft as among the Ba-Ronga.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
