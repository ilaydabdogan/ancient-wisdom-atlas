canonical_text:
  quote: ''
  summary: 'The passage describes Thonga/Tsonga mourning and death rites, especially
    northern clan practices: post-mourning gatherings for succession and inheritance,
    beer feasts for grave-diggers and mourners, reciprocal offerings and sacrifices,
    treatment of the deceased as a god, substitute rites for persons who die far away,
    burning of belongings in some cases, and special handling of strangers, accidental
    deaths, and lepers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two family gatherings in the last mourning period are said to include proclamation
    of the new master of the village and distribution of inheritance, including livestock
    and the wives of the deceased.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A month after burial, widows invite the grave-diggers to a beer feast called
    the beer of the hyenas, a name explained by the fact that hyenas also dig graves;
    the feast is presented as thanks.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the northern clans, the hut is not taboo after the five days of Great Mourning;
    doorpost plaster is repaired and a new crown is put on the hut when it again has
    an owner.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The feast of closing the hut is replaced by the beer of the mourning, to which
    relatives bring goats or money to the master of the mourning, who returns an equivalent
    gift; animals are then killed according to rule.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the sacrifice, men sit on one side and women on the other; the maternal
    uncle takes psanyi, squeezes it over the participants while praying or insulting
    the gods, and all rub their chests with the green liquid.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: According to the cited informant Viguet, this is the first occasion on which
    the deceased is treated as a god and prayed to for protection, blessing, and increase.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The batukulu take the part of the victim set aside for the gods; the text
    states that in the northern case this does not appear to be theft, unlike what
    is reported among the Ba-Ronga.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If a man dies far away from home, ceremonies wait until the news is confirmed;
    relatives assemble, dig a grave, and bury his mats and clothing in it.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage states that the dead man’s everyday objects, soiled by his body,
    are himself.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: For the far-away death rite, a fowl is thrown on the grave as a sacrifice;
    the widow eats with her hands until the burial and uses a spoon only afterward.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: In the northern clans, belongings of a man who dies far away are burnt, and
    purifying sprinklings are performed; the same is done for accidental deaths where
    corpses have not been buried.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: When an unknown stranger dies in a Thonga village, grown men dig a hole, drag
    the corpse in with a rope, avoid touching it, and perform no purification; among
    Maluleke and Hlengwe, such a corpse is burnt and watchers remain until an explosion
    signals that danger has departed.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The hut of a leper alone is described as irremediably tabooed because the
    sufferer is buried in it; the body is pushed into a hole with sticks and the roof
    is crushed down over him.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The deceased person’s name is often preceded by the word Matjuwa, compared
    in the passage to French feu and English late.
  category: speech
  evidence_refs:
  - ev:7
