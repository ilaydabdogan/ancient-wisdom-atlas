canonical_text:
  quote: ''
  summary: The passage describes the layout, personnel, taboos, special language,
    and daily practices of a Thonga circumcision lodge, including secrecy, restricted
    access, ritual roles, sexual prohibitions, permitted obscene speech, body-smearing
    with white clay, and actions meant to mark candidates as newly initiated men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sungi is enclosed by a high thorn fence, and the passage states that what
    occurs inside must be kept secret from uninitiated persons, especially women.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The entrance is prolonged into an avenue, and access continues between twelve
    poles arranged in pairs; inmates and circumcised visitors follow different prescribed
    routes.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The central court contains a long stone fireplace called the Elephant, around
    which boys sit while warming the right hip.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The chief's uterine nephew, called the Hwatye, has precedence in the rites,
    is first circumcised, and sits on a special stone with the others behind him.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tables made of reed hurdles near the fireside are used for serving the boys'
    daily porridge.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The central court has two rough square sheds, one for shepherds and men and
    one for the circumcised; additional huts, a Mulagaru pole site, and a place of
    formulae are also described.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A tree sometimes grows in the place of formulae, and the instructor climbs
    it to give teaching.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The lodge inmates are described as candidates, shepherds, and adult men who
    form a council overseeing the school.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The father and mother of the Ngoma are two men specially in charge of the
    school, and the father keeps discipline and administers punishment.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Manyabe is the great doctor of the school; he pours charms on the fence
    to protect the lodge and may administer medicine to boys who are ill or whose
    wounds do not heal properly.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The whole sungi is taboo to uninitiated persons, especially women, and the
    passage states that a woman who sees the shondlo leaves must be killed.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sexual intercourse is prohibited to all inmates, and breaking this rule is
    said to kill the circumcised.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: Obscene language is permitted and recommended in specified contexts, including
    formulae, food delivery, and songs sung by mothers while pounding mealies.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:14
  text: Special archaic or foreign expressions and substitute terms are used during
    the school for orders and ritual actions.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage says the marginal-period rites are intended to make candidates
    feel they are new men and to submit to the trials of initiation.
  category: other
  evidence_refs:
  - ev:10
- id: obs:16
  text: Every morning the candidates smear their bodies with white clay and are described
    as shining, having abandoned the darkness of childhood.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: After eating, the candidates pick up fallen crumbs, throw them into a pit
    near the fence, and shout the name of an uncircumcised boy in disdain to mark
    their new position.
  category: sequence
  evidence_refs:
  - ev:11
