canonical_text:
  quote: ''
  summary: The passage describes Thonga postpartum taboos, milk restrictions before
    presentation to the moon, mourning and purification after infant death, special
    protective rules for a woman who has lost several children, two child-protection
    rites called kunga and ringela bovumba, and local definitions of adultery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman suffering from shilumi must not enter the hut of a confined mother
    unless visitor and patient exchange girdles to prevent contagion and remove yila.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mother is forbidden to drink milk from the birth of the child until the
    child is presented to the moon; afterward she may drink only milk from cows that
    have calved many times.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A woman who loses an infant is described as contaminated with the defilement
    of death and must bury the infant herself without help from her husband.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After losing an infant, the mother kneels behind the hut and expresses her
    own milk onto the ground until secretion stops; her milk is treated as polluted
    and must not fall in gardens.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Until she is put right again, the bereaved mother avoids crossing fields and
    going to storehouses, eats with a spoon, and is under a ban on sexual relations.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: When later menses occur and she informs her husband, he purifies her in the
    same way as widows by buying new clothing, after which she resumes ordinary living.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: For a child not yet of age, the woman alone wears mourning clothing; the husband
    may grieve and accuse his wife of witchcraft, an accusation said likely to lead
    to divorce.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A woman who has lost three or four children is considered to be in a special
    state called bovumba, with rules governing a later child.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A child born after several elder siblings have died must be carried in a sheep-skin
    ntehe, may be dressed in clothing of the opposite sex, has the mother's breast
    smeared with medicine, and may be weaned early and taken to the grandmother.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The kunga rite requires visitors to present gifts to mother and child before
    the mother speaks; poor old women may place a bit of grass in her hair, and bracelets
    are attached to the ntehe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the ringela bovumba rite, a living child is taken to the mother's parents,
    buried in an ash-heap up to the neck, pelted with maize grains, dug up, washed,
    smeared with ochre, and brought home to stop the deaths of children.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage defines true adultery for a Thonga man as relations with a married
    woman; relations with an unmarried girl have consequences only if she conceives,
    in which case he is forced to marry her.
  category: relationship
  evidence_refs:
  - ev:10
