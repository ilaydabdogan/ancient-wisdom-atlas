canonical_text:
  quote: ''
  summary: 'The passage describes rites and taboos for moving or founding a Thonga/Ronga
    village: the headman ritually inaugurates the new site with his principal wife;
    inhabitants move roofs and build provisional huts; men and women observe sleeping
    restrictions while the village is still in buhlapfa; the main entrance is constructed
    with planted and buried branches and drugs; sexual rites, hand-washing, burning
    of dried grass, sprinkling of the fence, sacrifice of a hen, and placement of
    a feather are used to protect and ''tie'' the village. The passage also notes
    taboos during construction and that similar laws apply to secondary or newly founded
    villages.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the first night at the new spot, the headman has sexual relations with
    his principal wife, described as possessing the tree and the village; if someone
    precedes him sexually, that person is guilty of having preceded the village, and
    the old village becomes taboo for the headman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The inhabitants move the roofs, with the roof of the principal wife's hut
    transported first; obscene songs accompany the moving of a whole village but not
    the transport of a single hut.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The following day, two huts are erected, one for men and one for women, because
    they must not sleep together while the village is still described as in the bush,
    in buhlapfa, and not yet firm.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Breaking the sleeping restriction is said to cause havoc to the headman, and
    divination by bones would reveal that he had been preceded as regards the village.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before men sleep in the huts, the fence and main entrance must be prepared.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: For the main entrance, men clear a road through the village, gather the dried
    plants in heaps, and the headman, on the medicine man's advice, plants two vigorous
    tree branches on either side of the entrance.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A third branch, from the ndjopfa tree, is buried across the gate and smeared
    with special drugs to prevent witches and people with bad words from thinking
    about and spoiling the village.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the evening after the entrance work, the headman and principal wife have
    intercourse in their hut; before dawn they wash their hands at the main entrance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports a variant at Manyisa, associated with Djonga customs,
    in which all couples have relations one after another according to precedence,
    and an absent elder brother must undergo special treatment to avoid consequences
    of being unlawfully preceded.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: After the sexual rite, dried grass is burned in front of the main hut; the
    headman throws a medicinal pill into the fire to give the village to his people,
    and the people warm themselves and burn other heaps of dried grass.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The medicine man sprinkles the fence with drugs against bush fires, wizards,
    and disease, walks around the fence speaking a protective formula, and hangs the
    sprinkling branch on a pole of the main entrance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The medicine man sacrifices with a hen, invokes his gods as the source of
    his ritual knowledge, and places a feather from the hen's right wing at the main
    entrance or inside the main hut; the act is called tying the village.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ronga buhlapfa taboos include not lighting a fire in the village before it
    is fully built, cooking outside the fence, and prohibitions on crushing mealies,
    dancing, and whistling.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The same law of tying the village is observed when a headman builds a second
    village for one of his wives or when a younger brother or son founds a village
    for himself.
  category: relationship
  evidence_refs:
  - ev:10
  - ev:11
