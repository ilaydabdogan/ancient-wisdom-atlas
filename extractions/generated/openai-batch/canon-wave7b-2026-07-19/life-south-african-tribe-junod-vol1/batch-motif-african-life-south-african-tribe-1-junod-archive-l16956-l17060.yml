canonical_text:
  quote: ''
  summary: The passage describes Thonga/Ronga war-dance forms in a warrior circle,
    especially the gila/giya as a dramatic representation of past killing in battle.
    Individual performers stamp, brandish weapons, enact attacks, and receive songs
    and shouts of encouragement, including lion imagery. The performance excites martial
    feeling and leads young men to seek the chief’s permission to fight. The excerpt
    then describes war-medicine prepared by a ritual specialist and sprinkled on the
    army to create a conviction of battlefield invulnerability, with a stated condition
    that the charm fails if a warrior turns his back to the foe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The guba is described as a kind of war dance involving head movements, hand
    gestures, slow foot motions, and movement within or across a warrior circle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gila or giya is described as the true war-dance and as a representation
    of deeds of valour by warriors who have killed an enemy in battle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An elderly man detaches from the circle, stamps the ground in cadence, brandishes
    weapons, perspires, speaks Zulu words, and is interrupted or encouraged by shouting
    from the throng.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A young man springs into the circle, jumps like an antelope, holds his assagai,
    gestures as though transfixing an invisible enemy, and is accompanied by a song
    composed to glorify his deed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The young performer may be greeted with a lion shout comparing him to a lion
    returning to its forest, which no one will dare to attack.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Mankhelu states that at such a moment young men’s hearts tremble, their hair
    stands on end, and an extraordinary war spirit comes over them.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that patriotic choruses and dramatic representations excite
    fighting instincts, and that young men may dance to the chief asking permission
    to go forth and kill enemies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The chief is described as being thought to hold the lives of enemies in his
    hands, so that warriors cannot proceed without his permission.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: When the decision to fight has been made, a magic treatment is administered
    to render warriors invulnerable.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The chief doctor prepares medicine in a large dish with sliced leaves and
    roots, stirs the decoction, and sprinkles the whole army while it is formed in
    a circle.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the sprinkling, warriors are said to believe bullets will be deflected,
    flatten against the body, or fall harmlessly; the charm is said to be broken if
    the warrior turns his back to the foe.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Informants told the author that some men hit by grapeshot later regained consciousness
    and extracted bullets embedded in their skin.
  category: sequence
  evidence_refs:
  - ev:10
