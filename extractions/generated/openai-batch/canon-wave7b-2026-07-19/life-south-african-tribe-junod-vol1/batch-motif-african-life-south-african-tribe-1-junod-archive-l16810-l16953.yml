canonical_text:
  quote: ''
  summary: 'The passage describes Thonga/Ronga war songs called guba. It gives examples
    associated with Mpfumo, Nondwane, Nkuna, Maputju, and Tembe groups, including
    songs of defiance, cattle loss, the giraffe image, chiefly orders, spears, standing
    fast, and Muwai''s coronation at daybreak. It also describes performance practice:
    a soloist dances in the middle of a warrior circle, the chorus stamps, strikes
    shields with assagais, brandishes weapons, and stops at the war-induna''s signal
    before the war dance.'
  language: English with cited Zulu, Ronga, and Thonga song texts
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The performance of war songs is called guba, and the Zihlahla national song
    is said to be used both for coronation and for battle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Mpfumo war song addresses Nwayeye, saying that he takes the country and
    slays people; the narrator explains that the song preserves the memory of Nwayeye's
    failure and extols the Mpfumo royal family.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another Mpfumo song invites the people of the enemy country to come and be
    seen, and the narrator identifies it as a defiance hurled at adversaries.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Nondwane warriors sing a song mentioning being killed and 'our oxen'; the
