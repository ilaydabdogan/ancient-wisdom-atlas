canonical_text:
  quote: ''
  summary: 'The passage describes post-death taboos and cleansing rites among Thonga/Ronga-related
    communities: returning relatives must be purified before entering the village;
    the deceased''s gardens are ritually illuminated; visitors make mourning visits
    at the grave, bring gifts, eat, drink, dance, and sing; a closing sprinkling rite
    purifies mourners, weapons, village structures, and belongings; and mourners wear
    plant, cloth, or goat-skin tokens afterward, with a noted Northern-clan variation
    for later visitors.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Relatives who were absent at the death must perform a ceremony before entering
    the village or eating there, and the taboo is stated to apply to relatives rather
    than to unrelated people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One variant rite uses light beer made with the deceased's mealies; the person
    takes one mouthful and spits it to the right, then takes a second mouthful and
    spits it to the left before drinking.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The deceased's gardens are purified by widows and female relatives who carry
    an old empty shikutja, set it on fire, and illuminate the fields.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: During official mourning visits, visitors enter the village, women lament,
    the group is led to the grave, and they walk around it while crying and taking
    leave of the deceased.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mourning visitors bring presents such as money, a hen, a goat, light beer,
    a mat, or mourning cloth, and the inhabitants receive them with mats and hospitality.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mourning gatherings include eating, drinking, dancing, war songs, ordinary
    dancing songs, and songs addressed to wizards believed to have bewitched the deceased.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the closing day of sprinkling, the doctor sprinkles a boiling medicinal
    decoction over women, children, and men with a leafy branch.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Men stand holding assagais and sticks and gesture as if striking enemies;
    the passage states that joining the army would have been taboo before purification,
    and absent men's sticks may be brought to be purified.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After sprinkling people, the doctor sprinkles the village, huts, doors, roofs,
    fence, and the deceased's belongings, after which the passage says material things
    in the village are pure and may be removed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the rite, visitors depart wearing mourning markers such as malopa, palm-leaf
    strings, white handkerchiefs, goat-skin bracelets, or goat-skin strings, depending
    on group and role.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: A noted Northern-clan variation keeps some of the mixture for sprinkling visitors
    during following days because they have not yet been cleansed for the village's
    things.
  category: action
  evidence_refs:
  - ev:8
