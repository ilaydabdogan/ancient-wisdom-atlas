canonical_text:
  quote: ''
  summary: The passage describes ku tlhuba, an irregular way of taking a wife when
    lobola cannot be paid, including flight to maternal relatives, later attempts
    to regularize the union, and consequences for children if lobola is unpaid. It
    then summarizes Thonga marriage rites as betrothal, lobola, and bride-transfer,
    interpreting lobola as compensation between kin groups and explaining bride-flight,
    insults, and sham fighting as ways to display the bride’s value and the loss to
    her family.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes legal marriage, called ku teka or ku lobola, from
    another way of getting a wife called ku tlhuba.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man without resources for lobola may send a friend to propose a rendezvous
    in the bush to the desired girl.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the girl agrees, she meets the young man, they have relations, and they
    run to relatives of the girl’s mother, often the maternal uncle’s village.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mother’s family is described as more lenient than the father’s family
    because it has no right to the lobolo.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The girl’s parents search for her and may let her remain if she is determined
    to stay with the man, while lamenting shame and misfortune.
  category: action
  evidence_refs:
  - ev:1
- id: obs:6
  text: The irregular union is said rarely to remain unregularized in the earlier
    state of the tribe; the man may try to collect lobolo.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: To begin regularizing the union, the man may leave a sovereign, goat, or cock
    at the threshold of the girl’s mother’s hut, or hang a half-sovereign on a goat
    and salt its lips, then loudly announce that his clan has stolen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: After being recognized outside the fence, the man runs away and may later
    bring more presents until he has paid lobola for his wife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:9
  text: If the regular payment is not made, the first girl born from the union is
    said to become the lobolo, and the children legally belong to the girl’s family.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:10
  text: If the woman taken by tlhuba stays at once in the irregular husband’s village,
    her parents may go as enemies, descend on the village, kill a pig, and threaten
    to take furniture.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: Men of the husband’s village may intercede, and the lobolo is eventually paid.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: 'The passage identifies three main stages in Thonga marriage customs: buta
    or betrothal, lobola or remittance of agreed purchase money, and hloma or taking
    the bride to the husband’s home.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: Marriage is described as a community affair and a contract between the husband’s
    family and the wife’s family.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Lobola is explained as compensation for the wife’s family, which loses a member,
    allowing that group to acquire another member and maintain balance.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: The bride’s flight, delays, and reserve are presented as rites showing that
    she is precious to her group.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Reciprocal insults during hloma are described as showing claims of superiority
    by the bride’s relatives and defensive responses by the husband’s group, sometimes
    ending in a fight.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:17
  text: In the sham fight, the bride’s brothers thrash the husband’s brothers, who
    come to take a girl from the kraal.
  category: action
  evidence_refs:
  - ev:7
- id: obs:18
  text: Old men carry hoes, show them to defenders of the kraal, say the hoe is their
    ox, or hide among cattle as if claiming protection.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: The passage says the sham fight should not be explained as a remnant of marriage
    by capture, and distinguishes it from Thonga marriage by abduction.
  category: other
  evidence_refs:
  - ev:7
