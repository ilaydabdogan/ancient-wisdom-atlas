  text: The passage states that ndjaka must be washed away and glosses hlamba as “to
    wash away.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The death-related impurity is said to contaminate objects and the whole village,
    whose collective life must be purified.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: During mourning and even the deceased’s final days, sexual relations are forbidden
    because the village is in a contaminated state.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the death of a headman or important person, married people of the village
    assemble, with men and women apart, and discuss the order in which couples will
    perform the purifying act.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Participants question whether the rule of continence has been observed; a
    confessed transgressor must lead, while an unconfessed transgressor is said to
    risk illness and death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: If no transgression is reported, the master of the mourning begins the rite
    with his wife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The first couple goes outside the village to the bush, has sexual relations
    in the ritual fashion named in the passage, and returns by separate ways.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The woman carries a pot of water to an agreed spot near the village door or
    hut door and washes her hands, which are said to contain the couple’s impurity.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Other couples repeat the hand-washing, each woman cleansing impurity at the
    same place.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the women’s washing, the men come to the same spot and stamp on the
    ground.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sticks of absent young men, clothing of an absent girl, and the straps of
    an infant’s ntehe are brought to the spot and purified; the infant is not allowed
    to be present because this might cause death.
  category: object
  evidence_refs:
  - ev:6
- id: obs:13
  text: When all phases of the purifying act are complete, men and women go to the
