- id: scene:2
  label: Collective hlamba ndjaka after an important death
  summary: Weeks after the burial of an important person, married villagers assemble,
    test whether continence was observed, determine the leading couple, perform the
    ritual act in the bush, wash impurity with water at a fixed spot, stamp the ground,
    purify proxy belongings, and bathe in the river.
  figure_refs:
