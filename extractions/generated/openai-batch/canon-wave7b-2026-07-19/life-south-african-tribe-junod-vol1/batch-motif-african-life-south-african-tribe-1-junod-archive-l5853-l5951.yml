canonical_text:
  quote: "“the ndjaka must be washed away; hlamba means precisely to wash away.”"
  summary: The passage describes the Thonga/Ronga hlamba ndjaka rite as a collective
    purification after death. It explains ndjaka as both inherited property and a
    dangerous death-related malediction or impurity. After an important death, married
    couples observe continence, assemble, undergo an ordered ritual involving sexual
    relations, washing with water, stamping the ground, proxy purification of absent
    persons’ belongings, and river bathing. Related procedures are described for child
    deaths and for extending cleansing water to a married woman’s natal relatives.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Ndjaka is described as both the objects left by the deceased for future heirs
    and a death-associated malediction.
  category: other
  evidence_refs:
