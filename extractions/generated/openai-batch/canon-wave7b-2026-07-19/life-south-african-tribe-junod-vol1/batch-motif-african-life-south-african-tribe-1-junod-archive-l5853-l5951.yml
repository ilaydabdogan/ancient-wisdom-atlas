  - ev:7
- id: scene:3
  label: Private purification after a child’s death
  summary: When a child dies, the rite is more private and occurs inside the hut.
    Intercourse before purification is called a grave sin, requiring confession, a
    remedy arranged through women and the husband’s mother, fasting by the guilty
    husband, and purification of the whole village.
  figure_refs:
  - fig:3
  - fig:9
  symbol_refs:
  - sym:4
  evidence_refs:
  - ev:8
