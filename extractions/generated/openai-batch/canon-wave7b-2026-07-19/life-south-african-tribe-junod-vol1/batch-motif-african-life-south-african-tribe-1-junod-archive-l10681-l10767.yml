canonical_text:
  quote: ''
  summary: The passage discusses possible origins and consequences of Thonga polygamy,
    including war capture of women, widow inheritance, the status of a harem, the
    special ritual status of the first wife, and chiefly marriage rules in which a
    principal 'wife of the country' is linked to succession. It emphasizes ritual
    distinctions between the first wife and later co-wives, including death rites,
    village-foundation customs, and different death formulas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author describes a hypothetical earlier condition in which polygamy and
    polyandry coexisted, and then considers alternate explanations for the origin
    of polygamy.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'One proposed cause of polygamy is war: men were killed, women were enslaved,
    and each enslaved woman became the wife of her capturer.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Captured Chopi women are described as being called tinhloko, 'heads,' in a
    sense compared with heads of cattle, and as being sellable by their owners.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A succession rule is stated in which a younger brother inherits the widow
    of his elder brother, whether or not the younger brother is already married.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states that having a harem, tshengwe, is treated as evidence that
    a man has succeeded in his career and become rich.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The first wife performs a ritual incision in the inguinal region after the
    husband's death, while other widows do not perform it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A widower performs the corresponding rite only after the death of the first
    wife, not after the death of later wives.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The first wife is said to have a special part in the rite for founding a village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: Magingi explains the distinction by saying that the first wife is the true
    wife and the others are thieves; different formulas are used at the death of the
    first wife and at the death of another wife.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:10
  text: In chiefly marriages, the principal wife may be the woman bought with money
    collected by the chief's subjects, and her son is to be heir to the chieftainship.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The 'wife of the country' is generally not the first wife in date; the chief
    does not perform the incision at her death if she is not the first in date, because
    the first in date remains ritually first.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The author interprets these customs as evidence for a deeper, more mystical
    conception of matrimony in which complete marriage is the union of two persons,
    while later wives are treated as close to concubines.
  category: other
  evidence_refs:
  - ev:5
- id: obs:13
  text: The author evaluates polygamy by naming one claimed advantage, the absence
    of unmarried older women in the described tribal setting, but then states that
    the evils of polygamy exceed its advantages.
  category: other
  evidence_refs:
  - ev:6
