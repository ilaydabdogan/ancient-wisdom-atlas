  quote: ''
  summary: 'The passage gives several ethnographic case stories: a lobola dispute
    over Shaputa; Paulus K.''s confession of adultery with his elder brother''s wife
    and its social-religious consequences; Spoon Libombo''s maternal-family affiliation
    after returned lobolo and his role in sacrifices; and a case involving inherited
    women, Christian separation, and lobola payments connected to Muhambi.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Shaputa became a young woman, was bought by a suitor of the Hofiwana clan,
    and became the subject of a claim by the Ngwetsa.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Muzila rejected the Ngwetsa claim on the grounds that they had not attended
    the funeral and cited categories of death for which no claim was accepted: leprosy,
    drowning in a river, smallpox, or death by assagay.'
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Shaputa dispute is described as requiring decision by a chief or Portuguese
    Administrator.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Paulus K., a married pupil, confessed that after drinking at a feast he committed
    adultery with the wife of his elder brother Guga.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Paulus regarded the act as both adultery and incestuous, contemplated suicide,
    and asked his brother for forgiveness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that Paulus could no longer visit his brother when sick,
    take part in his burial, or maintain friendly relations with him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Paulus's letter to fellow evangelists frames his confession in Christian terms,
    mentioning the Enemy, Satan, Jesus, and the Spirit of God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Spoon was the son of Shibaninge of the Libombo family and Khobete of the Mazwaya
    family; Khobete had paid lobola for Shibaninge and later died in war.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After Khobete's death, Shibaninge was chosen to be inherited by Nsiki, Khobete's
    brother, but Nsiki did not properly care for her or the baby.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: After Shibaninge returned to her relatives and Mbobobo took her to his home,
    Nsiki claimed the lobolo and the Libombo returned it to the Mazwaya.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: After the return of lobolo, Spoon lived in his mother's family and was called
    'man of Libombo,' though the passage says he had no real home.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Spoon was chosen to help in sacrifices, including drinking beer left after
    libations in the gandelo near the gate and stealing offerings when victims were
    killed in the sacred bush.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Spoon is called the 'great ntukulu' and took precedence among uterine nephews
    because his mother belonged to the elder branch or first house of the family.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Bukutje I was inherited by Mboza after Sam and Fos died, and her children
