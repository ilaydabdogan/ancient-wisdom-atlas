candidate_motifs:
- id: motif:1
  label: Village relocation by carrying old roofs through a secondary exit
  taxonomy_refs: []
  basis: The passage describes old roofs being carried to the new site through a widened
    back gate rather than the main entrance.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is an ethnographic rite of settlement relocation; no broader mythic
    comparison is stated in the passage.
- id: motif:2
  label: Temporary ritual suspension of taboo speech during communal transition
  taxonomy_refs: []
  basis: The text explicitly says ordinary laws and speech taboos are suspended on
    the day when roofs are carried, with reciprocal insulting songs by men and women.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage frames the insults as festive and limited to the relocation
    process, not as a general license festival.
- id: motif:3
  label: Medicinal protection of village boundary and gate
  taxonomy_refs: []
  basis: The future fence line, entrance holes, poles, and a buried black stone are
    treated with medicines to protect against enemies and charm-users.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage reports local explanations but gives no wider taxonomy label
    for this protective boundary rite.
- id: motif:4
  label: Ripening a new village through continence testing and ordered sexual rites
  taxonomy_refs: []
  basis: The new village is ripened by asking about continence, invalidating the work
    if sexual rules were broken, and completing an ordered sequence of sexual relations
    and trampling at a washing place.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not fully explain the symbolism of the trampling or washing
    place.
- id: motif:5
  label: Principal wife closes and gives the village through water sacrifice
  taxonomy_refs:
  - sacrifice
  basis: The principal wife closes the entrance, performs a sacrifice involving water,
    prays for fertility and well-being, declares reconciliation, and gives the village
    to the people before the headman opens it.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: Only the term 'sacrifice' is explicit; broader ritual-exchange interpretation
    should be reviewed.
- id: motif:6
  label: Communal beer inauguration of a new settlement
  taxonomy_refs: []
  basis: The final khangula ceremony consists of preparing beer, inviting neighbours,
