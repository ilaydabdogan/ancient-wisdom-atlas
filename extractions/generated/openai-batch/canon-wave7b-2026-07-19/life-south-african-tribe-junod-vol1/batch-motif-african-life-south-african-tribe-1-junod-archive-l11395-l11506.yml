canonical_text:
  quote: ''
  summary: 'The passage describes later stages in moving and founding a Thonga village:
    huts are built and old roofs carried through a widened back gate with licensed
    obscene joking; the fence and main entrance are ritually treated with medicine;
    the village is ''ripened'' through a continence inquiry and ordered sexual rites;
    the principal wife closes the entrance with a thorny branch, performs a water
    sacrifice and prayer, and the headman reopens the village; beer inaugurates the
    settlement. It also describes closing the old village gate and a Ba-Ronga variant
    in which divination designates a tree that becomes ritually linked to the headman
    and village.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each man first builds a circular hut wall; when the walls are ready, men carry
    roofs from the old village to the new one.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The roof carriers leave by a widened back gate rather than the main entrance
    and follow a broad road prepared through the bush.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the roof-carrying, men sing obscene special-occasion songs and insult
    the women who accompany them; the passage states that normally taboo insults are
    permitted only on this day, while women later answer with insults when smearing
    hut floors.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Before the fence is erected, the family doctor throws drug-treated leaves
    or stones along the circular line where the headman plans the future fence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the great entrance, the doctor pours medicine into post holes and smears
    the poles at bottom and top.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mankhelu buried a drug-smeared black stone from the river at the gate and
    explained that this was to prevent enemies and charm-users from entering, with
    disease striking them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: For the ripening of the village, men and women assemble separately and ask
    whether members have remained continent during the whole u buhlapfa; a confession
    would spoil the work and require beginning again elsewhere.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: If the community has behaved well, couples have sexual relations according
    to a fixed order of precedence and then trample the place where women wash their
    hands; the principal wife performs last.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At dawn after ritual relations with the headman, the principal wife takes
    his shield and assagais, stands at the main entrance, drags a prepared thorny
    branch to the entrance, and closes it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: After closing the village, the principal wife sips water, spits or throws
    portions toward the people, prays for children, life, happiness, purity of heart,
    and household reconciliation, and the headman then pushes aside the branch and
    opens the village.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The final inauguration, called khangula, includes beer, invited neighbours,
    communal drinking, and neighbours coming to see the new village.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the old village has been vacated through the widened back door, one
    inhabitant closes its main entrance with a branch; the passage connects this with
    a saying about a village whose inhabitants have all died.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: In the Ba-Ronga clans, the headman examines possible places and consults bones
    about a tree; when a tree is designated, he places furniture and worshipping utensils
    at its foot and enters a mystic relation with it, so that he must not cut it himself.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: In the Ba-Ronga account, when the headman dies or his hut is crushed down,
    branches of the designated tree are used at the former threshold and to close
    the main entrance, while a new entrance is made through the fence for the mourning
    period.
  category: sequence
  evidence_refs:
  - ev:9
