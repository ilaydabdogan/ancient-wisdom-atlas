canonical_text:
  quote: ''
  summary: The readable portion gives examples of Thonga name changes. Mboza is named
    at birth after a paternal uncle, later takes a new name connected with divinatory
    bones, undergoes an episode described as possession or the 'folly of gods,' receives
    the spirit-name Mboza, and keeps it at Christian baptism. Elias is named at birth
    after a passing beggar, later adopts the nickname Spoon at a friend's suggestion,
    is teased by village women about the name, and receives the baptismal name Elias.
    The passage adds that boys often adopt European names or European-derived words
    at puberty.
  language: English
  quote_policy: summarized
