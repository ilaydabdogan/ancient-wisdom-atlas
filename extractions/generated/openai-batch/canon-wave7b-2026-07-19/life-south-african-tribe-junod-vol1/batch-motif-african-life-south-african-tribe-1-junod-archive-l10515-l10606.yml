canonical_text:
  quote: ''
  summary: The passage criticizes lobola/lobolo as a material means of concluding
    marriage, links it with polygyny and wife inheritance, and proposes missionary
    and colonial-government measures against it. The proposed measures include forbidding
    Christian fathers to ask lobolo, declaring widows free after a husband's death,
    maintaining both parents' rights in children, using written stipulations in mixed
    Christian-heathen marriages, encouraging girls and widows to redeem themselves,
    registering marriages, lowering the lobola amount, and protecting widows from
    being forced into polygamous inheritance.
  language: English
  quote_policy: summarized
