canonical_text:
  quote: ''
  summary: 'The passage describes procedures and beliefs concerning adultery with
    a married woman among the Thonga: detection by a watcher, obtaining an object
    from the lover''s hut as proof, a hearing before counsellors and the chief, compensation
    through lobola, kin involvement in payment, and the taboo relationship called
    matlulana between men who have had relations with the same woman. It also describes
    divorce and bridewealth restitution when the wife leaves for her lover.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a husband suspects his wife of infidelity, he may choose a friend to
    watch her, and the watcher may catch the wife and lover in places such as the
    bush or near the pool where she draws water.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After receiving the watcher's report, the husband tells his wife to go to
    her lover and take an item from the lover's hut, such as a blanket, to serve as
    proof.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The husband and his counsellor take the proof object to the village counsellor
    and chief; the lover is summoned, the woman is questioned, and the proof object
    is exhibited if the lover denies the accusation.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The chief condemns the adulterer to pay a whole lobola, described as enough
    to buy a wife, and rebukes him before the assembly for abducting a married woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The lover's counsellor claims the money from the guilty man; the adulterer's
    parents insult him for losing the money and must help him obtain it, and he adds
    a hoe as a reward to the counsellor.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that adultery with a married woman is treated as theft
    because she is described as owned by a master; the punishment falls chiefly on
    the man, though the watcher may beat the woman when catching her.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The term matlulana is explained as applying to two men who have sexual relations
    with the same woman; the passage says this creates a mutual dependence between
    them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The passage lists taboos between such rivals: one must not visit the other
    when ill, help remove a thorn from his foot, attend his mourning, or take part
    in his burial; violations are said to risk death or non-healing.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says medicines can remove the yila contamination, while the biha,
    or bad action, remains; for mpondjo, the passage says medicines are ineffective
    and visiting the rival would cause death.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage concludes that these taboos show a Thonga view that promiscuity
    is dangerous, and notes that boys are censured when two court the same girl in
    gangisa.
  category: other
  evidence_refs:
  - ev:9
- id: obs:11
  text: If the adulterous woman goes to live with her lover, the passage says this
    produces immediate divorce; the husband claims return of his lobolo from her parents,
    who may try to raise it by dissolving another marriage.
  category: sequence
  evidence_refs:
  - ev:10
