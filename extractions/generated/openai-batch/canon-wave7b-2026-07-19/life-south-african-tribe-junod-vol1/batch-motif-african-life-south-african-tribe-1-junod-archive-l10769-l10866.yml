canonical_text:
  quote: ''
  summary: The passage describes quarrels and jealousy among co-wives in polygamous
    households, gives an informant’s example of a husband provoking rivalry, quotes
    a short Nkuna song by a despised wife, recounts two cases presented as family
    ruin from large-scale polygamy, and ends with comments on governmental and mission
    responses to polygamy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says domestic quarrelling occurs in villages of polygamists and
    names a special jealousy of a wife toward her co-wives as bukwele.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The term bukwele is also said to designate a spot between courtyards where
    wives of one man go to insult each other.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Tobane’s example, a husband tells his favourite wife bad things about another
    wife and says the favourite is nicer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The favourite wife reports what she has heard; the other wife becomes angry,
    and people say the husband makes his wives hit against each other.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband later tries to regain the goodwill of the despised wife; she repels
    him, and he may kill a chicken to bring about reconciliation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A Nkuna song is attributed to a despised wife, who sings that her husband
    plucked her pumpkin and gave it to his favourite; the note says she sings to excite
    a quarrel and hopes to obtain her rights.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bingwana is described as having many wives in different villages; the passage
    says they committed adultery, he had hundreds of children, and he ultimately married
    his own daughters without knowing it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After Gungunyana’s yimpis surrounded Bingwana’s fortress and his son fled,
    Bingwana shut himself in a hut with treasures and gunpowder, set fire to it, and
    died in the flames.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Mubvesha is described as lobola-ing younger sisters of his wives while they
    were little girls, having between thirty and fifty spouses, and keeping wives
    secluded under an induna with men prohibited from crossing a road into the district.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says that during a 1908 visit to Mubvesha’s kraal the author saw
    one child only among thirty wives, and presents this as showing family ruin under
    those conditions.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says governments cannot immediately prohibit every form of polygamy
