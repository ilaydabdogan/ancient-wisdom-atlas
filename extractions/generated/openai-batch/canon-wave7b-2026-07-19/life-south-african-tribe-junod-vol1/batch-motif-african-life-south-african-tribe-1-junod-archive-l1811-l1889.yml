canonical_text:
  quote: Nwana a kula hi miri, the child grows by medicine
  summary: The passage describes Thonga nursing-period practices in which a child
    is thought to need medicinal protection and growth-aiding decoctions rather than
    milk alone. It explains medicines carried by the mother, infant ailments attributed
    to the nyoka worm/snake, plant remedies, daily administration of milombyana, taboos
    on ordinary water, travel rules involving home water or powder, a related relocation
    custom involving earth, and the beginning of solid food when teeth appear.
  language: English with Thonga terms
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that the Thonga believe milk alone is not enough for a
    child to grow, and gives an adage that the child grows by medicine.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A woman carrying a child is described as having a reed containing black powder
    and a small calabash containing milombyana water attached to the baby-carrier.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Milombyana is described as a medicine associated with infant ailments called
    nombo, including convulsions and infantile diarrhea.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Both named infant ailments are said to be caused by the nyoka, described as
    an intestinal parasite, worm, or snake present in every child.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: If unchecked, the nyoka is said to move from bowels to stomach, affect the
    fontanella, penetrate the chest, and cause convulsions and death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The fontanella is noted as important in children's doctors' diagnosis and
    may be treated with black wax or blowing in some circumstances.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: Named plant drugs are boiled into a decoction that is poured into a special
    small pot kept in the hut.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Each morning the mother warms the medicine pot, gives the child medicine to
    drink from a shell, applies drops to the fontanella, and presses the spat-on shell
    along the sternum toward the navel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The described treatment is said to nurse the child and make the child grow,
    and it is repeated many times a day if the child is sick.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The child is not to drink ordinary water during nursing, but only the milombyana
    decoction; the passage explicitly calls this a taboo.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When travelling, the mother may add water to the calabash only if some decoction
    remains, and she must use home water or take powder from the reed when drinking
    in another country so the child becomes familiar with that country.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The rules about milombyana, ordinary water, and the mother's travel drinking
    are to be kept during the whole nursing period.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The child begins eating solid food after the teeth are cut and when the child
    can take food with the hands; later the child can eat ordinary food.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: A footnote says to compare the passage with Zulu milk charms described by
    D. Kidd.
  category: other
  evidence_refs:
  - ev:8
- id: obs:15
  text: A footnote describes a similar relocation custom in which a Ronga couple bring
