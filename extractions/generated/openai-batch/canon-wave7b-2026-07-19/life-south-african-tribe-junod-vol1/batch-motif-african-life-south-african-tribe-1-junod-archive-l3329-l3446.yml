canonical_text:
  quote: ''
  summary: 'The passage describes Ngoma circumcision-school songs, hunting instruction,
    daily routines, and several aggregation or concluding rites: a pole ceremony involving
    a figure called grandfather, a purification medicine drunk in beer, and the Mayiwayiwane
    masked dance before women, including procedures for concealing a fallen dancer
    and presenting the event as a death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The circumcised boys sing a morning song addressed to the bird of the morn,
    and the passage glosses the cry as meaning that they are initiated men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hunting is described as the only useful thing taught in the Ngoma; boys go
    to the velt, catch game, climb hills, and once attack the Mamotsuiri mountain
    during the school period.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A day in the sungi includes early waking, singing, learning formulae, changing
    the shondlo, stabbing the Elephant, eating food brought by women, smearing the
    body with white clay, hunting, returning at sunset, and sleeping on the hut floor.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: For the Mulagaru rite, men and shepherds raise a very big pole with a man
    half hidden in white hair at its top, and boys lie on their backs with their heads
    toward the pole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Mulagaru rite, the boys say good morning to grandfather, and a voice
    from the top of the pole replies by greeting them as grandchildren.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that the Mulagaru ceremony is repeated every morning and
    means that the boys are put into communication with the ancestor representing
    the clan and begin admission to adult tribal life.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: A great doctor administers a medicine of purification, which the boys drink
    in a mouthful of beer; the passage notes that this is also the first time they
    are allowed to drink again.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Mayiwayiwane masks cover the upper body and are made of woven palm leaves,
    with a very high helmet protruding like a beak.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: The boys make the masks with help from shepherds and men and dance in them
    with high jumps before summoned women.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The masked boys must not be recognized by women and must appear before them
    as supernatural beings inspiring respect and awe.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: If a masked dancer falls or loses equilibrium, shepherds cover him with grass
    and men say that he is dead.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: After a fall, a fowl is bought, killed, and its blood is sprinkled over the
    grass; the fallen boy escapes after the women leave, and women later see the blood
    and believe that a circumcised boy dies when he falls.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Sometimes a little child is brought to the hidden boys during the dance; they
    kiss and smile at him because he is described as innocent and able to see what
    women may not contemplate.
  category: action
  evidence_refs:
  - ev:10
