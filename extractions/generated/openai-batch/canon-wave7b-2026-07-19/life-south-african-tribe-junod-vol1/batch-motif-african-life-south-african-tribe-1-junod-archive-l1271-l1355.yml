canonical_text:
  quote: ''
  summary: The passage argues that the Thonga language preceded Ngoni/Zulu influence
    and functioned as a bond among Thonga clans. It contrasts Thonga and Pedi military
    behavior in a witnessed battle preparation, describes Thonga bravery in later
    wars, attributes some Thonga military practices to Zulu influence, and discusses
    varied Thonga physical characteristics with a speculative note about possible
    Arab influence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Ba-Ngoni imposed Zulu military terminology, while women
    were not learning Zulu and are described as safeguards of language purity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author concludes that Thonga was already spoken by earlier occupants more
    than 500 years before and that language, along with some customs, bound Thonga
    clans together.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In a witnessed war preparation, Thonga warriors stood in a large armed circle,
    shouted war songs, gestured, jumped, and asked their chief to let them start,
    while Pedi warriors sat under trees taking snuff and appeared calm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Thonga groups showed bravery in the Gungunyane war,
    that the Ronga of Mpfumu showed courage and endurance, and that Thonga serving
    the Portuguese in Angola were praised as steady and reliable.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says Thonga military ability was not ancient but was imparted
    by Zulu influence, which taught fighting and gave the Thonga the name Mabuyandlela,
    glossed as those who open the way.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Before the Ngoni invasion, the passage says Thonga armies did not know the
    mukhumbi armed circle, arranged themselves in a straight line, and had battles
    in which few men were killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage presents the idea of conquest, broad dominion, and an armed nation
    associated with Chaka and his followers as new among South African natives, and
    adds an authorial prediction that European supervision would preserve Thonga peacefulness.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage describes Thonga physical appearance as varied, generally dark
    brown or black, often resembling Zulu appearance more than Suto, with differing
    facial and stature types.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage reports a Native Commissioner's observation of features described
    as Semitic in some Thonga settlements and asks whether intermarriage with East
    Coast Arabs may have occurred.
  category: speech
  evidence_refs:
  - ev:7
