canonical_text:
  quote: The relation by blood must be killed to give way to the relation by marriage.
  summary: The passage describes Thonga rules about prohibited kin marriages that
    can, in certain cases, be conditionally permitted through the rite called dlaya
    shilongo. It explains examples of such marriages, contrasts Thonga and Pedi marriage
    rules, and gives a detailed account of a Northern clan ritual involving an ox
    or goat, public assembly, anointing with psanyi, a goat-skin covering, tearing
    and eating raw liver, and a prayer to ancestral gods for blessing and children.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A man is said not to be allowed to marry certain relatives on his wife's side,
    including the elder sister of his wife and daughters of his wife's sisters.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some marriages that ought not to take place can be allowed if the whole family
    performs the rite called dlaya shilongo.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage gives two reported cases in which dlaya shilongo was used for
    kin marriages involving Mkili and Minsabula, and Michel and Djamela.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: The passage says that, for a Thonga, marriage with the malume's daughter is
    forbidden, while for a Pedi it is proper.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:5
  text: Shilongo or mulongo is explained as an archaic word corresponding to blood
    relationship, and the rite is described as killing blood relationship so that
    marriage relationship may replace it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:6
  text: A young man who wants to marry a near relation is described as a wizard or
    bewitcher in the Northern clan account.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:7
  text: The suitor goes to the girl's father, identified as his uncle, and brings
    an ox or goat as a first act of appeasement; the animal is said to open the hut.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: Relatives assemble in the girl's village, the wedding pair wait inside the
    hut, the goat is killed, an offering is prepared, and psanyi is set aside.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The bridegroom and bride are called outside, seated on the same mat, and the
    man's leg is passed over the girl's leg to kill shame.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: Both members of the couple are anointed with the green liquid of the psanyi.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A goat skin with a hole cut in the middle is placed on the heads of the two
    cousins.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: Raw liver is passed through the hole in the goat skin; the couple must tear
    it with their teeth and eat it, without using a knife.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: The priest of the family addresses the gods, states that the act has been
    done in daylight and not by stealth, and asks them to bless the couple and give
    them children.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: The passage states that without the sacrifice misfortune would befall the
    couple and the woman would remain childless.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:15
  text: After the prayer, attendants put solid psanyi on the wife's head and tell
    her to go and bear children.
  category: action
  evidence_refs:
  - ev:14
