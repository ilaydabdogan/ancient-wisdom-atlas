canonical_text:
  quote: ''
  summary: 'The passage describes a Thonga mortuary sacrifice and family gathering:
    sacrificial portions and psanyi are prepared, an old priest prays to the deceased
    and ancestors for peace and continuity, a daughter of the deceased interrupts
    with grievances, and the wives of the batukulu seize and eat the sacrificial meat
    and wine in a ritualized theft. It then compares related Ba-Ronga and Makaneta
    rites for closing or crushing a dead person''s hut, marking widows and a new master,
    and using a branch from the divination-revealed village tree to close a gate and
    mark the crushed hut.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The batukulu distribute parts of the victim to visitors, who are to eat them
