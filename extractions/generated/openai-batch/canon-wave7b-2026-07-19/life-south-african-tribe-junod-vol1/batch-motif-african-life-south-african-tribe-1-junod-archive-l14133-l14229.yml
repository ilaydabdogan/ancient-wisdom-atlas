  summary: 'The passage describes preparation and use of the nyokwekulu, a royal medicine:
    body parts, animal skins, and roots are roasted; the chief and sub-chiefs inhale
    the smoke; the medicine is powdered, stored, distributed, used for protection,
    divination, and ritual functions, and kept with a perpetual royal fire in the
    hut of the chief''s first wife.'
