canonical_text:
  quote: ''
  summary: The passage explains Thonga kinship terms for paternal ancestors, paternal
    aunts, siblings, cousins, affine relatives, and the mother. It includes an imagined
    multi-generation patriarchal seating scene, comments on age and house-rank hierarchy,
    links kinship terminology to inheritance, and describes the mother-child relation
    as especially tender.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tobane II applies successive grandfather terms to Shitsimbo, Tobane I, and
    Nkwangana, while the expression translated as father of grandfather is said not
    to be used.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Older paternal ancestors and descendants are described with special terms
    for grandson and with expressions involving sitting on knees, toes, or a nearby
    pointed place.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage asks the reader to imagine a very old man seated on the ground
    with his son in his arms, grandson on his thigh, great-grandson on his knees,
    and great-great-grandson on his toes.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wives of the paternal ancestors called bakokwana are also called bakokwana.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The father's sister is called rarana or hahane; the term is explained as female
    father, and an example nephew shows her great respect though she is not called
    mother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Female near relations of the father or paternal ancestors may also be called
    rarana by extension.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The husband of the paternal aunt is classified as brother-in-law rather than
    father or uncle because he has a kind of prior right to marry the speaker's sister
    and is therefore a potential husband for her.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The reciprocal term makwabu covers brothers and sisters; assagai or basket
    may be added to specify, and an elder brother is also called chief.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'Age hierarchy is strongly maintained: an elder brother may command younger
    brothers with near-paternal authority, and children of the first wife or first
    house take precedence over children of later houses even if younger.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: First and second cousins sharing a paternal grandfather or great-grandfather
    are called makwabu, and some maternal aunt's children are also called by that
    term.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Paternal-side cousins are described as more fully makwabu when they share
    the same family name or clan and can inherit one another's wives.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The man who marries the speaker's wife's sister, and the brothers of the wife's
    sisters, are also classified as brothers.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tobane II calls Mishikombo mother; this mother-child relation is described
    as deep and tender, with love generally exceeding respect.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The term for tenderness is derived from a verb meaning to beget, and the mother
    is also called by a term applied to females of animals.
  category: speech
  evidence_refs:
  - ev:9
