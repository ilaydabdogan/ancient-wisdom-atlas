canonical_text:
  quote: ''
  summary: The passage describes Ngoma initiation hardships for boys, naming six trials
    and detailing ordeals involving beatings, cold exposure, water deprivation, unpleasant
    food, and a severe finger-compression punishment called “drink goat’s milk.”
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage presents the Ngoma as an initiation in which candidates must
    accept hardships and are taught to suffer; it lists six main trials: blows, cold,
    thirst, unsavoury food, punishment, and death.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During the blows trial, candidates sit around the Elephant, hold sticks, lunge
    at it for more than an hour, and sing to it to keep still.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men and shepherds dance around the candidates, sing about a black cow kicking,
    and beat the naked shoulders of the initiated enough to cause pain but not bruising.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Boys are beaten for eating too slowly, for failing a bird-and-leaf knot task,
    and, if ill, for not joining hunting trips when their comrades return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the cold trial, boys lie naked in a shed during winter, may have fires
    only in the central court and not near their feet, must lie on their backs, receive
    no blankets, and are bitten by white worms in the soil.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: In some lodges, boys are led into water early in the morning and must remain
    there until the sun appears while shepherds prevent them from leaving.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Drinking water is prohibited throughout the initiation, though some boys try
    to escape to the river to drink during hunting trips and are punished if caught.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Mothers of the circumcised bring porridge in pots, leave the pots at a distance
    so they do not see the Ngoma, and may be mocked or punished if they provide too
    little food.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Boys must eat unseasoned food rapidly from reed tables; sauces are confiscated
    by men, slow eaters are beaten, and all porridge must be eaten even when the boys
    vomit or when antelope bowel contents are squeezed over it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: For a serious fault, the father of the circumcision may condemn a boy to “drink
    goat’s milk,” a punishment in which three mbuti sticks are placed between the
    boy’s fingers and compressed by a strong man who lifts him.
  category: action
  evidence_refs:
  - ev:9
