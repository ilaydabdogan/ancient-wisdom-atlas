canonical_text:
  quote: ''
  summary: 'The passage describes causes and procedures of divorce, including a wife''s
    return to her natal home, refund of marriage payment, and a tale in which a selfish
    husband is exposed by antelope bones. It then introduces widowhood customs: death
    defilement affects relatives in degrees, wives are especially affected, and the
    principal widow undergoes mourning and repeated washing in cold water at a pool
    or lake. After burial she washes with other women and remains with older widows
    described as a secret society receiving new members.'
  language: English
  quote_policy: summarized
