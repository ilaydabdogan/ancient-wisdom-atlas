canonical_text:
  quote: ''
  summary: 'The passage describes stages of the bukanye/luma feast: first ripe makanye
    liquor is offered at tombs of deceased chiefs and prayers ask for peace; bones
    are consulted before the chief’s luma; fruit is gathered and brewed at the capital;
    warriors and men who have killed in war drink, sometimes from beer medicated with
    black powder against miluru influence; counsellors warn the warriors not to quarrel
    or kill; village drinking follows with further makanye gathering.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first ripe makanye are gathered and pressed at the capital, and the sour
    liquor is poured on the tombs of deceased chiefs in the sacred wood, where they
    are invoked to bless the new year and feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nkolele, sub-chief of Libombo, is reported as praying that people not kill
    each other and that they eat peacefully; another formula asks that bukanyi cause
    no harm, killing, or serious quarrels.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that people fear quarrels, some possibly fatal, during
    the general intoxication expected in the bukanye drinking period.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods luma first; after the bones are consulted and the throw is propitious,
    the chief luma next.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Young people assemble to clean the public square and roads before the army
    luma.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Women of the capital sound the psibubutuana, gather golden makanye fruit,
    pile it on the public square, and brew it into fermented liquor in jars and casks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The entire male portion of the tribe is convoked, and warriors are expected
    to respond first, arriving in full array with ornaments and small play shields.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Black powder called buhlungu bya miluru is thrown into one cask of beer; the
    passage describes miluru as a spiritual influence from a man or beast killed by
    assagais that can affect the slayer.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Men who have killed in war must first drink the medicated new beer to keep
    them from killing compatriots during the following bukanye weeks; the chief also
    drinks if he is a man-slayer.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Each man-slayer receives a small calabash of fermented liquid, jumps and runs
    toward the entrance, drinks a mouthful, spits it out, and says a formula asking
    to live and hold the calabash forever.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Others sing and dance the war dance, with words about drinking bukanye again
    and having escaped the dangers of war.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the casks are distributed, a war circle is formed and counsellors advise
    the warriors to drink peacefully, not transfix a brother with an assagai, drink
    in their villages, and not quarrel with strangers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: After the preparatory luma and removal of the yila, village drinking begins;
    women who stayed home gather makanye, and the passage states that female makanye
    plants are not cut down and are found in fields and the bush.
  category: sequence
  evidence_refs:
  - ev:9
