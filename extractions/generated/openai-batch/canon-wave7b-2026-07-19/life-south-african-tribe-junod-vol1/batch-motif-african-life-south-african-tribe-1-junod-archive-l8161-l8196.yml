canonical_text:
  quote: ''
  summary: The passage introduces the chapter on family life by describing the Thonga
    kinship system as very different from the author’s own, highly complicated, and
    difficult for an uninitiated student to understand. The author explains that earlier
    genealogical work was insufficient, that further study found both uniformity across
    the tribe and greater complexity, and that lobola, polygamy, remnants of mother-right,
    and possible traces of group marriage are all involved. He states that his present
    aim is to offer a fuller statement of facts for anthropologists.
