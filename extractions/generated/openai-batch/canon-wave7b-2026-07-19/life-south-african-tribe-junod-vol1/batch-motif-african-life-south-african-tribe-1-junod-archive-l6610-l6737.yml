canonical_text:
  quote: ''
  summary: 'The passage describes games played by Ronga and Thonga girls before marriage:
    nursing dolls made from plant materials, a capture game with mother and thief
    roles, songs addressed to lizards, crabs, and an owl, string-figure play, and
    a knuckle-bones game using fruit stones and a tossed ball.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ronga girls are said to imitate their mothers' actions, including cooking,
    gathering fuel, and nursing babies, while boys imitate men's fighting and hunting.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Girls play with dolls called vide and nurse them as they see women nursing
    babies.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A mother may make a doll by plucking a sala in the bush, removing its stones,
    drying it, attaching it to a stick, adding string hair with ochre, and tying clothing
    around it.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the baby is said to have been found in the banana grove, the father may
    make a doll from a banana stem and its fibres for hair.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the ntshengu-ntshengu game, a big girl acts as mother, little girls hide
    behind her, and another girl acts as thief and takes the children one by one while
    a song is sung.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the capture, the children sit in a row, cross their legs, and dig small
    holes to represent wells or pots.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The game contrasts answers given to the mother and to the thief about the
    source of water: a spring under banana trees versus a nasty hole with frogs, mud,
    and dirt.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Girls sing a monotonous address to a grey lizard called galagala while one
    girl claps her hands under its nose.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports that the lizard appears fascinated and stretches its neck
    and swings its head during the hand-clapping and song.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Girls sing to one-clawed crabs on the sea-shore, asking them to lift and bring
    down the claw.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Little girls who hunt crabs for food say the song makes the crabs come out
    of their holes and increases the harvest.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: When an owl appears at noon, it is received with applause and a song telling
    it to flap its wings and find tobacco.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The buhlolo string game uses a ring-shaped string to make complicated figures
    with fingers and lips, and girls compete by inventing new figures.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The mathakisana game uses stones of the nkanye fruit, a hole, and a tossed
    ball; the player must remove and replace stones quickly before catching the ball.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: In mathakisana, certain mistakes lose the player's turn; if the ball falls
    on the ground it is called taboo, while falling on the body allows a recovery
    procedure.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Although natives are said not to play for stakes as a rule, challenged players
    may agree that the loser gives a fowl to the winner.
  category: relationship
  evidence_refs:
  - ev:11
