canonical_text:
  quote: ''
  summary: 'The passage describes Thonga/Tsonga military mobilization: warriors dressed
    like animals gather at the chief''s village; the army is organized into battalions
    and companies, often age-graded and sometimes named for animals. Heralds summon
    warriors with a chiefly praise formula, after which the warriors brandish weapons
    and form the mukhumbi, an unbroken circle of shields and men.'
  language: English with embedded Thonga and Zulu terms
  quote_policy: summarized
