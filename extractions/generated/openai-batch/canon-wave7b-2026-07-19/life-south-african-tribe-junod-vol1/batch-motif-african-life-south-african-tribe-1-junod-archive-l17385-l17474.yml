canonical_text:
  quote: ''
  summary: The passage describes a planned multi-regiment campaign by Gungunyane’s
    forces, its failure through quarrels, fear, and panic, examples of night panics
    among Matjolo-related forces, the use of Ba-Ronga military passwords, norms for
    the silent and shameful return of a defeated army, restrictions on mourning battle
    deaths, and Musongi’s punishment of defeated Maputju warriors who refused to fight
    again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nine regiments were assigned different routes across or along the Nkomati
    River, with some to enter Swaziland and others to ravage named districts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The planned campaign included a junction with Maputju forces and an intention
    to overrun the country and annihilate tribes opposed to Gungunyane while not directly
    attacking the Whites or their town.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The campaign is reported to have collapsed into a single day’s skirmish after
    Gungunyane was captured by a small party of white soldiers; quarrels among chiefs
    and rapid retreat followed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The narrator attributes military incapacity during the war to internal jealousies
    among tribes and dread of the White race, artillery, and discipline.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Matjolo and Nwamba warriors were ordered to attack Zihlahla and Mahazule,
    but Matjolo warriors failed to meet the Nwamba men at the rendezvous and suspected
    treachery.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: At Hukwen, a man who dreamt he was being killed cried out in the dark, causing
    soldiers to jump up; some hid, and others shouted that enemies were present.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Fighting began within the regiment of Geba during the panic, but order was
    restored before anyone was killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the following night a Chopi member of the troop cried that Matjolo men
    wanted to kill him, and he was secured and silenced to avoid rousing the Nondwane
    people.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ba-Ronga expedition parties arranged passwords; two examples are given as
    question-and-answer formulas, including looking at the sky and having a quarrel
    with the White man.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A defeated army not pursued by the enemy returns silently and disperses before
    reaching the capital, with each warrior going back ashamed to his village.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Mourning for battle deaths may be limited or prohibited; battle death is contrasted
    with dying at home, and weeping can be punished by a fine.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Maputju armies defeated by Nondwane in 1876 were sent back to fight again
    by their chief Musongi but refused.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Musongi punished the refusing warriors by making them fetch water with pots
    on their knees while declaring their cowardice, and then by making them extinguish
    a bush fire with their hands.
  category: action
  evidence_refs:
  - ev:11
