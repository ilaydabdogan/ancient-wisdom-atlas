canonical_text:
  quote: The chief must be a father to his people and not a tyrant.
  summary: The passage recounts a Nkuna succession case in which a chief's principal
    wife rejected him when he was sick, leading headmen to bypass her son and install
    the son of the wife who cared for him. It then describes ideals and mechanisms
    of Thonga chieftainship, including deposal, provincial wives, sub-chiefs, recurrent
    fragmentation, succession through elder branches with interim rule by younger
    brothers, and riddles criticizing chiefs.
  language: English
  quote_policy: quoted
