canonical_text:
  quote: ''
  summary: 'The passage presents a historical sketch of the Thonga during the nineteenth
    century: Ngoni/Zulu conquest under Manukosi, Thonga migrations to the Transvaal,
    a succession war between Muzila and Mawewe, the later fall of Gungunyane, and
    Portuguese administration. It then begins an ethnological comparison of Thonga
    language with Suto and Zulu.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says nineteenth-century Thonga history was dominated by invasion
    and migrations of Zulu conquerors, identified as Ba-Ngoni led by Manukosi, who
    conquered divided Thonga clans and tried to impose a military system of dominion.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Many Thonga clans, including Nkuna, Baloyi, and Mavundja, emigrated to the
    Transvaal around 1835-1840 rather than submit to Manukosi, and founded colonies
    there.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Manukosi ruled in the Limpopo valley and north of the Sabie for more than
    twenty years, and died in 1856.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Manukosi's death, a succession war called mubango lasted more than six
    years; two brothers disputed the chieftainship, with Thonga succession law favoring
    Muzila and Ngoni law favoring Mawewe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mawewe was proclaimed, Muzila's followers fled to the Spelonken, and Muzila
    later defeated Mawewe on the Sabie River with help from Portuguese and Ronga warriors.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Albasini, described as a Portuguese man, acted as a chief of the Thonga of
    the Spelonken and played a considerable part in the events.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gungunyane succeeded Muzila; later he was abandoned by many of his people,
    his capital Mandlakasi was burnt, and he was captured by Musinho d'Albuquerque
    in 1895.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The fall of Gungunyane is presented as the end of despotic Zulu rule and its
    replacement by Portuguese administration.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage classifies Thonga as a South-Eastern Bantu language related to
    both Suto and Zulu, sharing grammatical features with them but not being merely
    a dialect of Zulu.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that Suto lacks much of the nasalisation found in Bantu
    phonology, especially in Thonga and Zulu, while Suto shares the roots loya and
    yila with Thonga and not with Zulu.
  category: attribute
  evidence_refs:
  - ev:7
