canonical_text:
  quote: ''
  summary: The passage lists several Thonga clan praise-names, explains a royal-kraal
    praise formula used by subjects seeking food, compares Pedi seboko/mutshupu animal
    totems and taboos with Thonga atotemic clan names, gives joking examples based
    on Thonga shibongo, and notes a Rikotcho/Nwangwenya man said to “dance the crocodile,”
    a phrase compared with Pedi totemic terminology.
  language: English with Thonga/Pedi terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several Thonga groups are listed with shibongo or laudatory names involving
    a tree, a sword, old chiefs, animal images, and road-passage language.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:2
  text: The passage says subjects formerly entered the royal kraal crawling on their
    knees and pronounced a sentence when they wanted food from the chief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pedi tribes living with Thonga in the Leydenburg and Zoutpansberg districts
    are said to have laudatory names called seboko, identified as the same word as
    shibongo; many such names are animal names called mutshupu, or totems.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: For the Pedi clans described here, the animal is said to be an emblem or totem
    of the group, and the group is said to have a mysterious relation of life with
    it.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The Kaha of the Shiluvane valley are said to have the duyker, a small grey
    antelope, as totem and to salute each other with words including phudi, meaning
    duyker.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Kaha are said to avoid making a child’s ntehe from duyker skin; some avoid
    eating the animal’s flesh and avoid sitting near a person handling its skin, fearing
    harm to their children.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Mashila, identified as Sekukuni’s people, are said to have the porcupine
    as totem and to avoid treading on its dung because sore feet would result.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Many clans are said to fear killing their totem animal; the passage says the
    rule is not enforced by chiefs, but the totem itself punishes transgression.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrator states that he did not find among these people the idea that
    they descend from the totem; the local explanation given is that elders observed
    certain animal flesh made their clan ill and therefore proclaimed it taboo.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'The narrator concludes that Thonga clans are atotemic: many men bear animal
    names, but these are described as means of glorification without taboos concerning
    the animal’s flesh, skin, or dung.'
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'The passage gives jokes based on shibongo: Shibindji, meaning liver, is teased
    as if to be skewered and roasted; Ntcheko, meaning a tumbler or small calabash,
    is joked about at bukanye time as being carried, dipped into pots, and used for
    drinking.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: A Thonga man near Pietersburg belonging to the Rikotcho clan and bearing the
