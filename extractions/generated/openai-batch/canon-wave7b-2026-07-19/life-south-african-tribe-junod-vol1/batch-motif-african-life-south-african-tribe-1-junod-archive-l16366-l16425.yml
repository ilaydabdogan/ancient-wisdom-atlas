canonical_text:
  quote: ''
  summary: 'The passage describes the author’s account of Thonga warfare before and
    after Zulu/Ngoni influence: earlier warfare is portrayed as limited and relatively
    undeveloped; Manukosi’s forces and other Ba-Ngoni invaders defeated local yimpis;
    the Zulu/Ngoni system introduced harsher fighting rules, terminology, formations,
    and vanguard service; the author later qualifies this by saying an older peaceful
    tendency remained visible in the war against the Portuguese.'
  language: English
  quote_policy: summarized
