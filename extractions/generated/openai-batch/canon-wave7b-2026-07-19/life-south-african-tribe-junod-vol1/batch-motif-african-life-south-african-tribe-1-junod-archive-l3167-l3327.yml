canonical_text:
  quote: ''
  summary: 'The passage describes parts of the Thonga Ngoma initiation: severe penalties
    for escape or revealing secrets, deaths from circumcision wounds without mourning,
    instruction in secret formulae at a tree in the formulae-place, animal and lodge
    imagery in the formulae, password-like recognition among circumcised men, and
    a closing assessment that the teaching is mostly esoteric rather than intellectual.'
  language: English, with Thonga formulae and English glosses
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boys who tried to escape or revealed sungi secrets to women or the uninitiated
    were formerly hanged and burned with the lodge contents on the last day of the
    school.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Circumcised candidates might die if their wound did not heal and the Manyabe's
    medicine failed; mourning for them was prohibited.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother of a deceased candidate was notified by a notch cut into the edge
    of the food pot she brought, and she was not to cry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The corpse was buried in a wet place in a grave dug with sticks, avoiding
    village spades because their use would arouse suspicion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Every morning the candidates were gathered at the place of the formulae, where
    a tree stood in the middle of the square.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: A special instructor, whose father had held the same function, climbed the
    tree and taught the boys secret formulae sentence by sentence.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The formulae included references to a little bird, lances like lions, a wild
    pig, a crying frog, a mysterious hut, and twisted rings of an adder.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The narrator interprets some formulae as praising the Ngoma and its lodge
    and as describing the circumcised troop entering a mysterious hut and finding
    extraordinary wisdom there.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: Another set of formulae celebrates the sungi lodge by describing its smell,
    roof, poles, and rods.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Formulae ask and answer about animals including the crocodile, hippopotamus,
    and elephant.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Some formulae functioned as principal passwords by which circumcised men recognized
    one another.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: After the instructor finished, he lifted his stick with a gesture, and all
    the boys shouted “Zithari.”
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: The old men enjoyed flattery from the boys, including an exaggerated statement
    about the deadly wind from an elder's mouth.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The narrator concludes that the Ngoma teaching is mostly a collection of esoteric
    words rather than substantial intellectual training.
  category: other
  evidence_refs:
  - ev:14
