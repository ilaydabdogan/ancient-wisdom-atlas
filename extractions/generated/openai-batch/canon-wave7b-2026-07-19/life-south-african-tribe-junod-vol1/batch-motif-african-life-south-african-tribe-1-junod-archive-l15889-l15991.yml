canonical_text:
  quote: ''
  summary: The passage describes Thonga/Bantu juridical vocabulary and customary legal
    ideas, including collective kin responsibility, shared fault between lender and
    borrower when a lent implement is misused, procedures for private and chiefly
    court cases, fines, lobola-related civil cases, and divorce payments. It includes
    an anecdote about a schoolboy who borrowed a knife from an overseer and argued
    that the lender shared responsibility for the act for which he was accused.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says participation in discussion of the hubo has developed juridical
    sense among the Bantu, who are described as advocates and judges by inclination.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Thonga vocabulary is described as containing terms for law or custom,
    transgression, fault, wrongdoing another person, lodging a complaint before the
    chief, paying a fine, and imposing a fine.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that, under collectivist notions, relatives are considered
    responsible for the debts of their kin.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that when a borrowed implement is misused, the fault is
    considered as much the lender's as the borrower's.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the school anecdote, a boy injured his foot on a thorn, borrowed a knife
    from the overseer, and used it to make sandals of palm-leaf pith instead of working
    in the garden.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The overseer publicly denounced the boy at the weekly inquiry, and the boy
    argued that the overseer could not accuse him because the overseer had lent him
    the knife.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage explicitly contrasts Native and European conceptions of justice
    and says Native Commissioners should identify where the differences lie.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage describes clan Natives in normal conditions as peaceful and law-abiding,
    while contrasting town locations as places where some people have abandoned both
    tribal and Christian restraints.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage says Thonga do not exactly distinguish civil and criminal cases,
    since the same tribunal judges both and all are called milandju.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: A distinction is made between private cases settled by the two parties without
    the chief and official cases brought to the capital.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Village headmen try to settle difficulties locally; if a case goes before
    the Court, the fine is doubled and the chief keeps half.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that most civil cases concern lobola, that divorce cases
    are common, and that divorce disputes can involve lobolo money, cash, an ox, or
    payments retained in part by a chief.
  category: sequence
  evidence_refs:
  - ev:7
