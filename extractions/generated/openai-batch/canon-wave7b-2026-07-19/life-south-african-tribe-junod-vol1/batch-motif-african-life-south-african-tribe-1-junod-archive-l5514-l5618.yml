canonical_text:
  quote: ''
  summary: 'The passage describes rites of the Great Mourning after death among Ba-Ronga
    and related clans: post-burial bathing, treatment of the deceased person''s hut,
    purifications and taboos for grave-diggers and widows, communal hair cutting and
    mourning cloth, and the luma milomo rite for removing danger from the deceased
    person''s food through the uterine nephew.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a general sequence is found in all clans, while the
    rites themselves differ greatly.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After burial, all inhabitants of the village go to a lake or river to bathe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The grave-diggers nibble ndjao, identified as the root of a reed with magical
    power.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: One man climbs onto the hut, removes the woven grass crown from its top, and
    the crown is placed before the door so no one enters until the hut is crushed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Mpufmo clans, grave-diggers undergo preliminary purification, including
    an ablution with crushed nkuhlu leaves and water; formerly they also smoked a
    mixture involving a raw sala shell, an ember, and hen dung.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: From the first day, grave-diggers and widows must eat with special spoons
    made from old broken calabashes and must not take food from the common plate with
    their fingers during the five days.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: All widows sleep in the open because the huts belonging to the deceased are
    taboo; if it rains, they sleep in other huts of the village.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A doctor performs medical purification of widows and grave-diggers through
    three vapour baths on the first, third, and fifth day after death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: For the first vapour bath, the pot used for the drugs is broken on the grave,
    and the two grave-diggers and the first widow are exposed together to the treatment.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The whole community performs hair cutting; widows and near relations cut completely,
    while men and women may cut in specified patterns.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage reports that the shaving is said to show respect for the dead,
    sadness, and prevention of mayiha and delirium if the hair is not cut.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Mourners put on malopa, pieces of dark blue cotton cloth, and the first widow
    must have them before entering the second vapour bath enclosure.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The luma milomo rite uses seeds or cooked food from each kind of cereal the
    deceased had in storehouses, placed in one of the deceased person's baskets.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: The uterine nephew is called first to begin luma milomo; the first widow kneels,
    pours drops and food between his great toes, and he rubs the toes together.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: After the toe action, the uterine nephew turns away and must not look behind;
    other relatives then perform luma milomo, and some milomo is kept in a pot for
    months.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
