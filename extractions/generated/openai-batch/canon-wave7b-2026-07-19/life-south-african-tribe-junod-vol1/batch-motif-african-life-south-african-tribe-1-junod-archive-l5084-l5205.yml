canonical_text:
  quote: ''
  summary: 'The passage describes the last days and immediate death rites for Manyibane,
    a Thonga headman: deathbed taboos and seclusion, ritual healing and divination,
    final instructions to kin, preparation of the body, prohibitions on lamentation,
    avoidance of defilement, and the maintenance and renewal of a funeral fire for
    village purification.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Manyibane, a headman near Rikatla, is dangerously ill.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men of the kraal order inhabitants to remain in their sleeping places and
    avoid sexual relations because the dying man might die if the taboo is broken.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Visitors are barred from entering unless they have kept pure for at least
    two days, and sticks are placed across the hut entrance as a public proclamation
    that a dying man is inside.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A man who has had relations with the same woman as the patient is especially
    prohibited from seeing him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: A doctor and a bone-thrower have tried to treat or diagnose the illness; a
    suspected wizard may be shut in the hut and ordered to undo the harmful spells,
    but this does not succeed in the passage.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The dying man summons his relations, states last wishes, entrusts care of
    his people to a favored person, and may designate a successor.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The dying man reminds the kin about debts, unpaid lobola cattle, and the location
    of buried treasure; he does not address his wives because widow-law procedures
    are known.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: As breathing shortens, attendants begin bending the dying man's limbs before
    death, bringing hands near the chin and folding legs against the body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage reports an outside scholarly explanation that flexed burial posture
    imitates a child before birth, then says the author considers this doubtful for
    the Thonga and prefers an explanation involving a sitting posture in a grave conceived
    as a hut in the earth.
  category: other
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: After death, the body is handled so the hands are not closed; the eyes are
    closed, clothes removed, and in the Mpfumo clan the body is washed and covered
    with an old rug.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Crying and lamentation are prohibited before burial because the taboo is said
    to endanger the men who must perform funeral rites.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Strangers in the village leave quickly after the death to avoid defilement
    and the purifying ceremonies that would follow.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The fire from the funeral hut is moved to the square, kept alight for five
    days, used by all inhabitants, then extinguished by the doctor with sand or water
    and replaced with a new fire from which everyone takes embers.
  category: sequence
  evidence_refs:
  - ev:10
