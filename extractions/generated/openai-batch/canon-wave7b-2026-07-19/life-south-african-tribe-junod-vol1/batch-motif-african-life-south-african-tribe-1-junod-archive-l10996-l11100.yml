  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The main entrance is called the mharana; smaller back openings called psiruba
    are private and used by inhabitants.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A men’s court called the bandla is located near the entrance and is associated
