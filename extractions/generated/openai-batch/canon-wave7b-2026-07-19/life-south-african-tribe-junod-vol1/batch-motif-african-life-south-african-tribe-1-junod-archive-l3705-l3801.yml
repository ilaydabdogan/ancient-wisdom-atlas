canonical_text:
  quote: ''
  summary: The passage describes unmarried Thonga youths living in separate boys'
    and girls' huts at a village entrance, nocturnal meetings connected with gangisa,
    presents exchanged for sexual access, community attitudes toward such relations,
    Christian converts' moral standards, sexual practices said to be introduced through
    towns and prisons, and a comparison between Thonga and Pedi rules about premarital
    and marital sexuality, including bridewealth arrangements, virginity examination,
    lochia fears, and the Bukhaha chief's marital practice.
  language: English
  quote_policy: summarized
