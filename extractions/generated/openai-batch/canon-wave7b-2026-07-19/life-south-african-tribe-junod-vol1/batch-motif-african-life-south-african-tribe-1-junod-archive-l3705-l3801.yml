- id: obs:15
  text: 'The passage compares Thonga and Pedi habits: among the Thonga, unmarried
    girls are described as free and married women as taboo; among the Pedi, girls
    are prohibited from premarital sexual relations while some married women may have
    intercourse with men other than their husbands.'
  category: relationship
  evidence_refs:
