canonical_text:
  quote: ''
  summary: 'The passage describes a Ronga/Thonga family rite concluding mourning:
    relatives bring goats for a sacrifice, batukulu disrupt and steal the gods'' portion,
    men gather by the fire, widows undergo a secret washing and reclothing rite, and
    the sisters of the deceased oversee the widows'' selection or inheritance by new
    husbands. Disputes over widow choice, ntukulu claims, lobola, and later reconciliation
    sacrifice are described.'
  language: English with embedded Ronga/Thonga terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Relatives assemble near the mortuary hut door and bring goats that they have
    given for the feast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An old man prays to conclude the mourning, asking that there be no noise,
    misunderstanding, or anger among the batukulu, and presents the goat as the offering.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A ntukulu interrupts the prayer, accuses the old man of setting them apart
    and not giving them wives, and other batukulu join in chorus.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The batukulu steal the part of the victim set apart for the gods, while the
    crowd pursues them laughing and pelts them with balls of psanyi.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: At sunset the men go to the central place of the village and sit around the
    fire.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The widows remain between the deceased man's hut and the new hut of the great
    wife, near the place where the deceased's belongings have been kept during the
    year.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Other widows surround the widows of the deceased, exclude other women, and
    sing a mourning song about the secret law and the departed father.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Old women remove the widows' clothing, wash their bodies, lead them into the
    hut of the great wife, and put new clothing on them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The new clothing has been brought by the widows' suitors and other relatives.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: The sisters of the deceased ask the great wife whom she belongs to; she names
    the man she chooses and may use the formula that she is killing him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A widow may refuse the man who had cared for or visited her during the year
    and instead choose a ntukulu.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: A ntukulu may carry off a widow who chooses him, after which old men follow
    and implore him to return; if the woman remains decided, she may be allowed to
    go to her chosen husband.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Disputes over widow inheritance can involve claims for return of lobola paid
