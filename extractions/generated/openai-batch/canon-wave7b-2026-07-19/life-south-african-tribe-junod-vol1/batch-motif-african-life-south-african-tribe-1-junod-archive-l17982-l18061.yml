canonical_text:
  quote: ''
  summary: 'The author argues that granting the franchise would help only a small
    educated minority of South African Natives and would not solve the situation of
    the majority. He describes the Black race as in a period of transition, recommends
    keeping the franchise as an ideal for the best-educated representatives, and proposes
    additional measures for the masses: strengthening the tribal system where it still
    works and granting some form of representation. He cautions against abruptly abolishing
    clan life, speculates that converted chiefs and missionary guidance might allow
    Bantu clans to evolve into a new political organism compatible with Christian
    morals and civilization, and urges government oversight of chiefs’ moral character.
    The passage ends with a caption for Muhlaba’s house.'
  language: English
  quote_policy: summarized
