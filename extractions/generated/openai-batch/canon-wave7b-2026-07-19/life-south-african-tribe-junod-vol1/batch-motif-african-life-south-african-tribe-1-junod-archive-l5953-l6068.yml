canonical_text:
  quote: ''
  summary: 'The passage describes Ba-Ronga mortuary rites called lahla khombo, involving
    grave-diggers, sexual relations, hand-washing, communal stamping of a wet place,
    and a steam bath to remove death-related misfortune. It then describes later familial
    rites after a death: the deceased person''s hut is treated as a tabooed grave,
    relatives gather after months, and men carefully dismantle and finally crush the
    hut, leaving its remains to rot.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ba-Ronga are said not to know the expression hlamba ndjaka, but to have
    a corresponding rite called lahla khombo, glossed as throwing away misfortune.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lahla khombo is also described as the medicine of death and as healing mourning,
    and it especially concerns grave-diggers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: In the rite, the grave-digger who carried the deceased's legs begins; after
    early morning sexual relations his wife washes her hands at the hut door, village
    inhabitants stamp on the wet place, and a doctor prepares a steam bath for the
    man before the second grave-digger performs the rite.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After the grave-diggers are cleansed, the village is said to be pure, but
    the widows are said not yet to be purified.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A man who breaks the law of continence before lahla khombo is said to have
    crossed the village, taken mourning or misfortune upon himself, and to risk sores
    and coughing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: During the marginal period in mortuary villages, bugango is said to be prohibited,
    and men prevent boys from visiting girls.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After two or three months, the whole family of the deceased gathers; among
    the Ba-Ronga this gathering closes or breaks down the mortuary hut, and its principal
    aim is to restore and reorganize the family after the head's death.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The deceased person's habitation is tabooed, called a sbira or grave, and
    must be destroyed after an interval.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the witnessed case, Manyibane had died months earlier, his son Mugwanu
    had been chosen to take his place, and his younger brother Fenis had cared for
    the village meanwhile.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: An elderly man chews a sungi root, rubs his legs with it, enters the old hut,
    and returns with white eggs that had been laid there by a hen.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Men carefully remove the wall poles, place earth in a pot and pour it away,
    and lay the poles in a heap; the passage says these precautions are taken out
    of respect for the deceased.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says that handling the hut disrespectfully would insult the deceased
    and could bring colics called the disease of the wolves.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Some boys in European dress throw poles violently on the ground, and Spoon
    comments that they know the ways of the White men and have lost their respect.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The men finally collapse the roof by jumping, pulling sticks, kicking, and
    chopping with axes; the ruined hut is left to rot, and no one may remove or burn
    it because it is taboo.
  category: action
  evidence_refs:
  - ev:8
