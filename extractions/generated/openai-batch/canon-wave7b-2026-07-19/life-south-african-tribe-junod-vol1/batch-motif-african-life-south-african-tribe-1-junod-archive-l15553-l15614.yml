canonical_text:
  quote: The position is official and even hereditary.
  summary: The passage describes the shitale or Court Jester/Public Vituperator as
    an official figure with immunity to insult countrymen, including chiefs, while
    not abusing strangers. Tobane describes such a person entering villages, making
    shameful accusations, taking food, and prompting hosts to offer a present to avoid
    insults. The passage names office holders and ends with the author's uncertainty
    about whether the institution functioned as public censorship or resembled a European
    court fool such as Triboulet.
  language: English
  quote_policy: quoted
