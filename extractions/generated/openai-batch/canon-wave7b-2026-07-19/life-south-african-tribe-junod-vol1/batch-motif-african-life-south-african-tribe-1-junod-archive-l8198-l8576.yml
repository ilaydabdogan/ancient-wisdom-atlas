  quote: ''
  summary: 'The passage introduces a comparison of Thonga and English kinship terms.
    It lists Thonga terms for father, mother, brother, sister, husband, wife, son,
    daughter, and grandparents. A note explains that male and female sibling terms
    may be qualified by objects: the assagai for male and the basket for female, because
    these objects characterize each sex.'
  language: English with Thonga terms
