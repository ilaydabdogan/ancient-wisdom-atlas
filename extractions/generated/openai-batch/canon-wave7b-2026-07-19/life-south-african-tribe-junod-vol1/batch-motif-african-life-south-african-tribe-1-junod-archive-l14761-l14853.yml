canonical_text:
  quote: ''
  summary: 'The passage describes revenues and obligations attached to Thonga chieftainship:
    statute labor, royal fields, cash taxes, fines, and sub-chief remittances. It
    then discusses the chief''s supernatural power, the desirability and limits of
    the office, narrative references to chieftainship as a reward, and the need for
    a chief to redistribute beer, meat, and wealth to maintain the country. Mubvesha
    is presented as an example of a bad or criticized chief.'
  language: English
  quote_policy: summarized
