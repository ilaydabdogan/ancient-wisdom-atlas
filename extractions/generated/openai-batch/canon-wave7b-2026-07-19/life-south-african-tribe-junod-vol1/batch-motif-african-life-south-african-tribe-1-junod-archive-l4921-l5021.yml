canonical_text:
  quote: the crowning custom is in close relation with the national life of the tribe
  summary: The passage describes mature-age male prestige and the Thonga practice
    of fixing a black wax ring or crown on men's heads. The ceremony is ordered by
    the chief for men of a certain age, uses ox tendons or palm fibres, palm-leaf
    sticks, and wax, and is performed by specialist hairdressers. The crown marks
    mature status, changes daily conduct, and is removed during mourning for a dead
    chief until a new chief orders crowns remade.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A man who has succeeded in life becomes famous, his advice carries weight,
    and he may be esteemed more than the chief while still lacking royal-blood prestige.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that an African man's greatness is linked to pots and that
    pots are closely connected with polygamy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: During mature age, the passage says there are generally no special ceremonies,
    except for the common custom of fixing the wax ring, which marks progress in social
    position.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: All men who have reached mature age are described as having the right to wear
    the wax ring or crown, called ngiyana or shidlodlo; the crowning ceremony is called
    khehla and wearers are called makhehla.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: At a chosen time, the chief informs men of a certain age to prepare their
    rings; counsellors and royal sons in the class go to the capital; oxen are killed
    and tendons preserved for strings.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Specialist hairdressers plait palm-leaf nervures with tendon strings into
    a circular frame and fasten it through the hair above the temples after hair on
    the sides and back has been shaven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Wax from grub secretion is gathered, mixed with ingredients to make it black,
    fixed on the frame, and shaped into a glossy round or oval ring.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the crown is made at the capital, the participants eat the ox flesh,
    enjoy themselves, dance, and solemnize the occasion.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: More humble subjects crown themselves in their own villages, while poor men
    use cheaper palm-fibre strings instead of ox-tendon strings.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A self-respecting khehla polishes and repairs the crown; a man ordered by
    the chief to wear it no longer carries burdens on his head and may be accompanied
    by a boy who carries parcels.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The crown identifies a man as mature, but the right to participate in important
    affairs belongs only to counsellors; men sent as envoys to another chief may be
    chosen from among the crowned.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: When a sovereign dies, mature men remove their crowns, place the wax as a
    ball on a stick in the hut roof above the door, hang the frame nearby, and leave
    them until a new chief orders crowns remade.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The makhehla are also said to form special battalions in the army.
  category: relationship
  evidence_refs:
  - ev:9
