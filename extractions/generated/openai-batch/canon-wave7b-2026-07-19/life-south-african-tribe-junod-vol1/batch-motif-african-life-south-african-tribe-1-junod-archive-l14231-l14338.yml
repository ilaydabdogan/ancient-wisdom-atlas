canonical_text:
  quote: ''
  summary: The passage describes chiefly sacred medicines and taboos, including the
    nyokwekulu or sacred fire keeper, the mphulo as regalia and collective clan power,
    personal charms such as psitjemba, swallowed stones or ndjalama as death omens,
    avoidance between chiefs because of dangerous magic, and official luma or first-fruits
    rites before subjects eat new produce.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Queen Mimpanyanhoba is described as being in charge of the nyokwekulu and
    as having no sexual relations with the chief on that account.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The hut associated with the keeper was taboo: co-wives were kept away, the
    old roof grass was not removed, and new grass was laid over it when needed.'
  category: setting
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: In wartime, a special small hut could be built in the bush for the precious
    medicine, and the passage says this hut had the attribute of invisibility; in
    some clans, the keeper instead ran away with the mbamba and the chief.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mphulo is identified as an important part of the regalia, a means of strengthening
    chiefly authority, and a collective property by which the clan resists or conquers
    enemies.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The psitjemba charm is described as the top of a child's skull smeared with
    vitreous humour from lions or elephants and powders from wild-beast skins.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A chief possessing psitjemba is said to gain supernatural power and, when
    angered, to invoke his gods, suck the charm, emit the sacramental tsu, and call
    a wild beast to kill a person.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Some northern chiefs swallowed a medicated stone from a crocodile's stomach;
    the stone was said to remain in the chief's body as his head or life, and its
    passage in stools warned of approaching death.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: In other clans, ndjalama replaced the crocodile stone; chiefs swallowed it
    to be warned of death, while subjects were forbidden to swallow it and were said
    to die if they did so.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Chiefs of different clans treated staying in one another's company as taboo
    because they feared one another's magical power.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Maphunga is said to have been feared and to have killed his rival Musongi
    by sending a woman who poisoned him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Luma is explained as meaning 'to bite' in ordinary use and, ritually, as removing
    the injurious character of a food before it is eaten.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The official luma had to occur before subjects ate new-year products, because
    dangerous food required a first mouthful seasoned with the royal drug and because
    gods, the chief, and elder brothers had prior rights to the products.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
