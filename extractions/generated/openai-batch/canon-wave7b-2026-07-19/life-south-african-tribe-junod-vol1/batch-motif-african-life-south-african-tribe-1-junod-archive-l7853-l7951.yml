canonical_text:
  quote: ''
  summary: The passage describes Thonga/Ronga inheritance distribution after a man's
    death, the status and redistribution of widows, limits on women's inheritance,
    the closing meal of the inheritance feast, and several widow purification or remarriage
    practices, including special cases involving medicines, a grave-digger, Northern
    clan shikombo specialists, and newer local customs near Lourenço-Marques.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Widows are described as the most important property left by a man; after their
    distribution, lesser possessions are adjudicated.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oxen and money are said to pass to the younger brother or, if absent, to the
    sons, for family use including buying a wife for a son.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The principal uterine nephew has the right to choose one of the deceased uncle's
    assagais before the eldest son, taking the smaller weapon while the larger one
    remains for the eldest son.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The batukulu receive portions of the deceased's property, while women are
    generally said not to inherit; if only female heirs exist, they may receive or
    keep valuable property for their sons.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the end of the inheritance adjudication feast, flesh from victims is distributed,
    and each party must eat its limb on the road under a tree rather than in the mortuary
    village or their own kraal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Those who have received a wife return home rejoicing; the husband may kill
    a fowl or goat to receive the new wife, marking the end of the long period of
    widowhood.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: An old widow may buy medicines that are supposed to cleanse her.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the case of the wife of Sokis, a baby made sexual relations prohibited
    and the legal inheritor was absent, so a grave-digger substituted in a purification
    process and tied a cotton string around the widow's waist.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A sick widow may also be treated by a grave-digger, who is said to possess
    cleansing means because he has gone through the mourning with the widows.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Among Northern clans, widows are said to go to the bush to meet a man who
    frees them from death defilement; such a man is called the shikombo of the widows.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Northern clan widow purification includes specialists with cleansing drugs,
    removal of mourning string bracelets, and return home adorned with beads.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: 'The passage contrasts Ronga and Northern clan understandings: for Ronga,
    death defilement affects the hut and requires destruction of the hut and lahla
    khombo; for Northern clans, impurity rests more on the village and calls for collective
    hlamba ndjaka.'
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: A newer custom near Lourenço-Marques lets a widow who rejects the legal inheritor
    go home and adopt another husband, often a man from another tribe who comes to
    live in her village.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Children born from the widow and the adopted husband are said to belong to
    the family of the deceased husband who paid the lobolo.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: A widow may also choose a child nephew, giving him food as if she were his
    wife while living with another man, or may choose a girl, the daughter of another
    wife of the deceased.
  category: action
  evidence_refs:
  - ev:10
