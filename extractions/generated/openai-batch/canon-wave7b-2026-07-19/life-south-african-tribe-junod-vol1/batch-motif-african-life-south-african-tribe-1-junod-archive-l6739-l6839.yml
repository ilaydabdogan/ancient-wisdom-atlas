canonical_text:
  quote: ''
  summary: The passage describes terms for play, then focuses on girls' nubility customs
    among Thonga-related groups. It contrasts a minimal Ba-Ronga acknowledgment of
    first menses with the Northern khomba rite, involving departure to an adoptive
    mother, seclusion, veiling, repeated immersion in water, exclusion of men, instruction
    in sexual matters and menstrual secrecy, and return to adult society. It also
    notes related Pedi-Suto practices and describes tattooing customs connected in
    some cases with nubility or marriage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Ba-Ronga, no special ceremony is performed when a girl comes of
    age; she tells her mother that her menses have first appeared, and the mother
    answers that this means growth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Northern clans, the khomba rite is also called yisa matin, meaning to lead
    to the water; the girl chooses an adoptive mother and goes to her when she says
    she is of age.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The khomba rite includes a seclusion period of one month in which three or
    four girls may be initiated together and shut in a hut.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the secluded girls come outside, they wear a dirty and greasy cloth veil
    over the face.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Every morning the girls are led to a pool and immersed in water up to the
    neck.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Initiated girls or women accompany the nubile girls, sing obscene songs, and
    drive away men with sticks because no man is allowed to see a girl during the
    period.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: If a man comes near the group, women ask him short formulae of the circumcision
    school; if he cannot answer, they beat him, and the passage reports a saying that
    a man who sees a girl during the month becomes blind.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Within the hut, the girls are teased, pinched, and scratched, and although
    wet and cold they are not allowed near the fire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The girls receive instruction in sexual matters, are told not to reveal anything
    about menstrual blood to a man, and must salute adults by clapping their hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: At the end of the month, the adoptive mother brings the girl to her true mother
    and presents a pot of beer; if the girl has been bought by lobola, the mother
    goes with her to the future husband, who gives a present, and the veil is removed.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The author explicitly describes the final khomba rites as aggregation into
    adult society and the custom as a passage rite from an asexual to a sexual group.
  category: other
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that Pedi-Suto clans also practise a rite called kkoba
    and have a girls' initiation school called bale corresponding to the boys' circumcision
    school; it also says the Nkuna clan formerly practised bale, which has disappeared
    through the Thonga tribe.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage describes former Northern Thonga tattooing as large black pimples
    on the face, with men's and women's marks arranged differently.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: Among the Ba-Ronga, tattooing is said to be dying out and now practised only
    by women, in connection with nubility or marriage; remaining tattooing is on the
    shoulders and epigastric and hypogastric regions.
  category: attribute
  evidence_refs:
  - ev:9
