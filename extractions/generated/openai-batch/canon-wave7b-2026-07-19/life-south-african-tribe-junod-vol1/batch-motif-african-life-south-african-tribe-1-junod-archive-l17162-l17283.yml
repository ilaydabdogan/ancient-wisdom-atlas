canonical_text:
  quote: ''
  summary: 'The passage describes final war-preparation and departure rites: a chief
    tests warriors with a flaming torch, consecrates shields, sprinkles the army with
    water and leaves, and then the warriors depart. It also describes regimental departure
    with animal cries, marching songs, military order, and taboos observed at home
    during the campaign.'
  language: English
  quote_policy: summarized
