canonical_text:
  quote: "“the wife of the country, she who is to become the mother of the future
    king”"
  summary: The passage describes the official marriage required after a Thonga/Tsonga
    chief’s installation. Counsellors and royal family councils arrange a publicly
    funded bridewealth collection, select Mimalengane of the Matjolo royal family
    for the youthful Mpfumo chief Nwamantibyane, and conduct formal proposal etiquette
    through intermediaries before negotiating the marriage payments.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: After installation, the chief is to be provided with an officially recognized
    wife called the wife of the country, intended to become the mother of the future
    king; this wife must be bought with contributions from the people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When counsellors visit the new chief, he gives them a cold reception and asks
    who will feed them, cook meat, and brew beer; they understand this as an indirect
    reminder to find him a wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The matter is first discussed privately by brothers and sisters of the deceased
    ruler in a family council described as holding conclave “in the hut.”
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A messenger is sent to principal men and heads of younger branches of the
    royal family with a message asking whether the time has come to set up, grow,
    and increase the chief, because the country is sustained by its cock.
  category: speech
  evidence_refs:
  - ev:3
  - ev:10
- id: obs:5
  text: Dignitaries assemble and state that they must increase the chief and give
    him the wife of the country.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Secondary chiefs offer one pound sterling or an ox each; village headmen offer
    ten shillings each and each village one shilling, while the passage says that
    formerly each person gave a hoe.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The secondary chiefs collect money or oxen, notify the capital, convey all
    contributions to the chief, and an account is kept of the money or cattle contributed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: For Nwamantibyane’s marriage, the special subscription amounted to thirty
    pounds sterling and twenty oxen.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mimalengane, from the Matjolo royal family, is chosen as future queen; Nwamantibyane
    had seen her once, and she was his first cousin once removed.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that marriages between relatives are sanctioned in royal
    families and that Mpfumo chiefs generally marry into the reigning families of
    Mabota and Matjolo, while those families seek wives at Maputju.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Matshibi, a Mpfumo counsellor acting as Agent General for Matjolo, sends Nwamatshabane
    as messenger to Sigaole, chief of Matjolo, through Mambene, the Matjolo counsellor
    in charge of Mpfumo affairs.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The marriage request is phrased as asking for “our kokwana” in marriage; Sigaole
    replies that it is well and tells the messenger to return later for the reply.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Matjolo royal family meets, discusses the matter, agrees to the demand,
    and sends the same envoy with a companion to receive the reply.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: When the envoys renew the request, they say the chief is still celibate and
    sleeps in bachelor’s quarters, although the narrator notes that he already had
    several wives who did not count for this purpose.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The great ones of Matjolo visit Nwamantibyane; an ox has been killed for their
    reception, but they receive short commons at breakfast until the money question
    is settled.
  category: sequence
  evidence_refs:
  - ev:9
