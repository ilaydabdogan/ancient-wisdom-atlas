canonical_text:
  quote: ''
  summary: 'The passage describes Thonga practices surrounding infancy: a broken-pot
    remedy against convulsions; welcoming and first-born birth ceremonies with song,
    ochre, feasting, and clay-pot imagery; the beginning of the nursing period; rules
    for the ntehe child-carrier; and customs involving breast milk, heated potsherds,
    and a milky plant used to increase lactation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The broken-pot rite is described as a preventive remedy against infant convulsions;
    a child may be exposed again to smoke, and an adult patient may undergo the treatment
    with the broken pot placed on the head over cuscuta.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Thonga child is said to be welcomed with joy by the whole family; a girl
    is linked with future bridewealth oxen, while a boy is linked with strengthening
    the clan and perpetuating the father’s name.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: For a first-born child, a ceremony is performed at the end of the first week
    after the grandmother has smeared the hut and summoned female relatives who bring
    food, ochre, and fat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The relatives enter the child’s village performing the khana dance and singing
    a song that glorifies the first-born.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The child is compared to a clay pot that has gone through firing, has been
    tested by falling to the ground, and has not shattered.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The baby, mother, father, and everyone in the village are smeared with ochre
    during the first-born feast; a goat may be killed if possible.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The parents are said to have “found a village” and “grown roots” through the
    child; omission of the ceremony is an insult but not a taboo with evil consequence.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: For subsequent children, the celebration is reduced to the grandmother’s presentation
    of a basket of food to celebrate the child.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The nursing period begins after the child has been taken out of the confinement
    hut and is allowed outside.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The ntehe, a softened skin used to carry the child, must not be looked for
    before birth; the author calls this a taboo of prevision.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: For a first-born child, the ntehe skin is normally provided by the maternal
    uncle, though the father may prepare it if necessary.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: A sheep skin is taboo for the ntehe except under specified circumstances after
    several children have died; duiker, goat, and impala skins are named as acceptable
    alternatives.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: The ntehe is arranged so that the animal legs serve as straps around the mother’s
    neck and waist, holding the child against her shoulders or back.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: During nursing, the mother allows the child to take the breast at any time;
    before a short absence she squeezes drops of milk onto the child’s neck.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: After an absence of more than one day, the mother heats a broken-pot fragment
    in the fire and squeezes milk from each breast into it so that the liquid evaporates;
    the stated reason is to warm milk that has grown cold and prevent constipation.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: A baby that bites the teat is punished by the mother scratching its forehead.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Mothers without enough milk use the neta shrub, described as containing milky
    sap, as medicine on the principle of similars curing similars.
  category: action
  evidence_refs:
  - ev:11
