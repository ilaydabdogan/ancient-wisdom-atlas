canonical_text:
  quote: ''
  summary: The passage describes Thonga legal customs involving cattle sale defects,
    damage by goats, entrusted livestock, adultery and seduction, assault, accidental
    homicide, and deliberate murder. Several cases are brought before the chief or
    his tribunal, with compensation, fines, whipping, divination, kin liability, or
    death penalties depending on the case.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a diseased-ox sale case, the buyer may request another ox and brings the
    dead ox's skin with one hoe inside for meat already eaten; the chief tells the
    seller to provide another ox if the claim is accepted.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When goats damage a garden, the shepherds are whipped and no fine is paid;
    if their father protects them with weapons, he is summoned to the chief's tribunal
    and fined.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Owners with few animals may entrust cattle, pigs, goats, or hens to a neighbor
    with a larger herd; advance payment determines whether offspring remain with the
    owner or whether the caretaker takes a share.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: If an owner neglects the caretaker's due reward, the caretaker may keep one
    head of livestock, and an important dispute may go to the chief.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If an ox in another man's herd dies, the herd master informs the owner; if
    the owner is too distant, the ox is eaten locally and the skin is sent to him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Pretending that an ox is dead while hiding it with another herd and sending
    a skin to deceive the owner is treated as theft.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Adultery with a married woman is punished by a full lobolo; among the Nkuna,
    if the accused man denies guilt, bones or vumisa divination may be consulted,
    and guilt brings an extra fine of two oxen.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: For an unmarried girl, pregnancy can lead the seducer to offer lobolo; if
    he refuses marriage while the girl and her relatives want it, he must pay money
    and an ox.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage contrasts the neighboring Chopi, among whom adultery cases are
    not brought before the chief and the husband arranges matters himself; formerly
    he killed the adulterer.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: After fighting that ends in wounds, the wounded man goes to the square of
    the capital and shows himself; assailants pay a fine divided between the chief
    and the victim, or pay two oxen divided similarly.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: In accidental killing, the killer may settle directly with the deceased man's
    relatives; the killer's relatives provide a girl accompanied by ten hoes and one
    ox.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The girl given in accidental homicide compensation is said to help the diminished
    family recover its loss; once she has borne a child to the deceased man's relatives
    she is free unless they lobola her.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Accidental homicide is usually not brought before the chief if the law is
    known, but it may be discussed before the court if the killer and deceased were
    not on good terms.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Deliberate murder is punished by death.
  category: action
  evidence_refs:
  - ev:10
