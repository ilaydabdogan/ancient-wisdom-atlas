canonical_text:
  quote: ''
  summary: The passage explains Thonga kinship and affinal terms through named examples.
    It distinguishes relatives-in-law who are treated with respect or avoidance from
    relatives-in-law with whom joking, play, or potential marriage is permitted. It
    also introduces marriage-related taboos, especially a lobola counting taboo involving
    cattle, the number eight, and the danger of pointing with the index finger at
    affinal relatives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Mboza considers Mahazule a namu, and Shaputa is also described as an official
    namu and presumptive wife who can play the part of a nhlantsa for her maternal
    aunt Nsabula.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gawana, the wife’s elder sister, is not a namu for Mboza but a mukonwana,
    because she had already married Phayindi before Mboza married Nsabula.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Shaputa is marriageable for Mboza because she belongs to the Gogwe family
    name like Nsabula, while Mathamba and Mandewen, children of the wife’s sisters,
    are treated as bana or daughters and not as wives.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that a girl may become a second wife beside her father’s
    sister, but not beside her mother’s sister.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The husband of a paternal aunt is described as mukonwana for his nephew and
    namu for his niece; if he marries the speaker’s sister, the speaker may intervene
    in quarrels or fines as the sister’s protector.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Nsabula calls Masuleke, Nsengamunwe, and her husband’s elder brothers nwingi,
    a reciprocal term implying great respect.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: When sent to call Djan, Nsabula kneels and addresses him through respectful
    titles rather than by his personal name.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Komatane, Mboza’s younger brother, is a namu for Nsabula; they joke together
    and may smear each other with ashes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage formulates a rule that a woman generally respects her husband’s
    elder brothers and has freer relations with his younger brothers, while a man
    avoids his younger brother’s wives and plays with those of his elder brothers.
  category: relationship
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: The stated reason for the difference is that an elder brother’s wife is an
    eventual wife for younger brothers through inheritance, while an elder brother
    normally does not inherit a younger brother’s wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The passage says that one does not marry a nwingi, and that Nsabula would
    leave Mboza if he took Magugu, Komatane’s wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: For a wife, the husband’s elder sister is also nwingi, while the husband’s
    younger sister is namu or nhombe and has free relations with her.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Bukonwana is described as dominated by a contrast between fear or respect
    toward some relatives-in-law and extreme freedom with others.
  category: other
  evidence_refs:
  - ev:6
- id: obs:14
  text: During lobola discussions, the bridegroom’s parents must not offer eight head
    of cattle, because one will be killed for the feast and the remaining seven require
    a counting gesture that may point the index finger at the bakonwana.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Pointing at anyone with the index finger is described as a mortal offence,
    comparable to bewitching, done only in anger, and capable of nullifying preceding
    marriage discussions.
  category: action
  evidence_refs:
  - ev:7
