  confidence: high
  cautions: The passage reports a ritual action rather than a narrative mythic sacrifice.
- id: motif:2
  label: Fertility-oriented belt containing animal bone
  taxonomy_refs: []
  basis: The symbolical belt contains the goat's astragalus and is tied around the
    young woman; the source says the act is doubtless to wish good luck and many descendants
    and notes veneration of the astragalus.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The fertility explanation is presented by the source narrator as 'doubtless,'
    not as a quoted indigenous explanation.
