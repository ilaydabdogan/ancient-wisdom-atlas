canonical_text:
  quote: ''
  summary: 'The passage describes Thonga/Ronga marriage customs: a patriarchal prayer
    associated with a goat sacrifice, a symbolical belt made with the goat''s astragalus,
    the bride''s departure to the conjugal dwelling, erection of a woodpile as an
    interfamily present, a staged return to the natal home for her trousseau, final
    settlement in the husband''s home, domestic tasks marking the bride''s arrival,
    a first-night refusal resolved by payment, and variations among Nondwane and Mapuju
    clans.'
  language: English with Thonga/Ronga terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A brother of the bridegroom interrupts the old man's prayer with a statement
    about living peacefully with the bride if she does her duty, but the old man continues
    praying while the listeners remain quiet.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When people want the prayer to stop, a young man puts a piece of meat into
    the old man's mouth; the passage says this 'cuts' the prayer, and the officiant
    must be first to eat the meat of the sacrifice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The astragalus of the right leg of the sacrificed goat is kept, placed in
    a pocket made from a strip of goat skin, and tied by the father as a belt around
    the young woman's waist while he does not face her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that the belt action is doubtless done to wish the young
    woman good luck and many descendants, and that the astragalus is specially venerated
    and used in divination.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: After the lobolo business is concluded, the bride starts the next day for
    the conjugal dwelling, accompanied by friends.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women from the bride's village cut branches in the bush and pile them between
    two ochre-covered poles; the husband's relations later take logs, and the passage
    calls the woodpile a symbolic present from one family to the other.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: After the wood cutters leave, the bride goes with them and her sisters take
    her home again; the husband entreats, pursues, and offers a present, but she refuses
    because she must fetch her basket, mat, spoon, and other utensils from her mother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The bride's natal family gives the husband a final lesson, saying that even
    though they have given him their daughter, she remains precious and they take
    her back.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The next day the bride returns with one young girl carrying furniture, and
    her parents are said to have duly settled her in her home.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: In Nondwane, the bride comes to the husband's home on the marriage day with
    two mats and one young female companion, and later her mother and female relations
    bring the rest of the trousseau and erect the woodpile.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The settled young bride is called nilhonwa or nhlomi; during the first week
    she fills the village pots with water for ablutions, removes ashes from fireplaces,
    and smears huts.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: On the first night in the hut with her husband, the bride may refuse conjugal
    rights; the bridegroom asks his father what to do, the father tells him to give
    sixpence or a shilling, and the bride then consents.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: In Mapuju country, the fiancé and fiancée make brief informal visits to see
    each other's villages and do not accept food from their hosts.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: During the boys' tjekela visit in Mapuju, male visitors refuse food at first
    and eat only after being entreated with a gift; girls place coins at the bottom
    of pots filled with water for the boys' ablutions.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage says sexual relations during these visits were formerly not allowed,
    but now occur, and that a fiancé may ask his fiancée to give herself to him to
    test her love.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: During the girls' tjekela visit, money is repeatedly required because the
    girls refuse to enter the village, move to the hut, cross the doorway, sit on
    mats, return greetings, give news, or accept food.
  category: sequence
  evidence_refs:
  - ev:8
