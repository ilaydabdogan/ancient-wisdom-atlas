canonical_text:
  quote: ''
  summary: The passage describes the mukhumbi as an incomplete circular or horseshoe-shaped
    war assembly with an entrance, young regiments by the entrance, the chief at the
    opposite 'chest' of the army, older and stronger men as bodyguard, and middle-aged
    warriors arranged in wings by age. It compares this layout to the village layout,
    gives numerical estimates for some regiments and circles, notes chiefly red feathers
    from the nkulunkulu bird, and states that war-songs, dances, and medicine are
    performed before battle to produce courage, certainty of victory, and invulnerability.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mukhumbi is described as not a perfect circle but more like a horseshoe,
    with an opening called nyangwa or sangwa that gives access to it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Young men's regiments take position on both sides of the opening; the Dhlanazo
    are named for the Nkuna mukhumbi and the Ndumakazulu for that of Zihlahla.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the end opposite the entrance is the 'chest of the army' where the chief
    stands, surrounded by men of riper age; the strongest among them act as a bodyguard.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Between the chest and the opening, middle-aged warriors occupy the wings,
    with elder warriors nearer the chest and younger warriors nearer the entrance.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author states that the war-circle disposition is the same as that of the
    village, and that age and hierarchy dominate both arrangements.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: An informant estimated the Ndumakazulu regiment, described as young men aged
    about 19 to 25, at about 500 men, and the entire Zihlahla circle at about 2000;
    the Nkuna mukhumbi seen by the author had about 500 to 600 warriors present.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before battle, war-songs, war dances, and medicine are performed or administered
    to stimulate courage, certainty of victory, and invulnerability.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A note identifies the nkulunkulu as a bird shot in the forest on the borders
    of the Nkomati; its red feathers are said to be worn only by chiefs.
  category: object
  evidence_refs:
  - ev:6
