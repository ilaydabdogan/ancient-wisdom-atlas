canonical_text:
  quote: ''
  summary: 'The passage describes reported warfare practices: forming the mukhumbi
    near the enemy, reinforcing combat with successive companies, pursuing defeated
    enemies to villages, killing or capturing inhabitants, taking livestock, burning
    huts, making occasional exceptions by drawing a protective boundary, adapting
    tactics against Portuguese troops, and preferring surprise attacks or ambushes
    over pitched battle.'
  language: English
  quote_policy: summarized
