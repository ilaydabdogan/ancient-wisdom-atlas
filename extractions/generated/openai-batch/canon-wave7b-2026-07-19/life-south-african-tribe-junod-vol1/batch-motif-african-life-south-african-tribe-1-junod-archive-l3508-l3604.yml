canonical_text:
  quote: The Ngoma is truly a puberty rite, but not a sexual initiation.
  summary: The passage interprets the Thonga/Suto Ngoma circumcision school as a puberty
    rite that introduces boys into manhood, discusses its discipline, social setting,
    and missionary critique, and explicitly compares it with Jewish circumcision and
    Christian baptism while emphasizing differences in religious and moral meaning.
  language: English
