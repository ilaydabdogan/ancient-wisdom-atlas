canonical_text:
  quote: children, especially girls, must bring a material advantage to their father
  summary: The passage discusses difficulties caused by the transition from polygamy
    to monogamy under Christian marriage rules. It says young children follow the
    mother, fathers may resist parting from them partly because of an older Bantu
    view of children, especially girls, as a source of material advantage, and Christian
    teaching reframes fatherhood as duty rather than benefit. It also forbids a Christian
    husband to inherit a widow or claim alobola if she marries another man, while
    emphasizing the hardship and importance of the transition.
