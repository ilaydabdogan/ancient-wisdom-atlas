canonical_text:
  quote: ''
  summary: The passage describes Thonga kinship obligations and ritual prerogatives
    involving maternal relatives and uterine nephews or nieces. It covers marriage
    payments and portions reserved for the bride's maternal kin, bride equipment supplied
    by the mother's relatives, maternal relatives' rights of sacrifice and intercession,
    mourning-beer cleansing, village continuity through a sister's child, and the
    privileged ritual actions of uterine nephews and a chief's uterine niece in sacrifice,
    initiation, and purification rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the remittance of lobolo, the maternal uncle and the mother's relatives
    are invited to a feast and receive a reserved portion of the festal ox called
    nyimba, described as the womb, uterus, or belly portion; the bride's mother eats
    named portions from the spine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the day of hlomisa, the bride is led to her husband's village, and her
    maternal relatives receive a young cow named as the skin in which her mother carried
    her as a baby.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The young cow is sent for the first and third daughter when they marry, while
    for a second and fourth girl only the nyimba is sent.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The mother''s relatives provide parts of the bride''s equipment: her hoe,
    body-anointing fat, mat, clothing, and sometimes bracelets.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the mother's relatives do not provide their part of the trousseau, they
    will not receive the nyimba on a later occasion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The paternal aunt gives nothing for this equipment, and the paternal uncle
    is said only to help the father occasionally.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bamalume or bakokwana have a special right of intercession on behalf of
    uterine nephews, and the passage says the mother's relatives mostly perform sacrifices.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A quoted speaker identifies the father as a stem because of oxen and the mother
    as the true stem, the god, and the one who makes the child grow.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Another quoted speaker says maternal relatives and their sons have special
    charge of sacrificing for batukulu and are elders to them; the passage states
    they do not marry them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The bones indicate whether a sacrifice must be offered to the gods of the
    mother or to those of the father, and a kokwane is preferably called to sacrifice
    for a sick child.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: In ceremonies after death, especially the feast of mourning beer, the malume
    officiates and squeezes psanyi over the batukulu to cleanse them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: A childless malume can bring an unmarried sister to his village, refuse lobolo
    for her, and later appropriate her male child as belonging to the mother's family.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: An uterine nephew adopted in this circumstance can save the mother's family
    from disappearing.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: A proverb says the uterine nephew is a chief and takes any liberty he likes
    with his maternal uncle.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Batukulu are said to stand before the gods, serve the altar, and consume the
    offering.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: In a rain sacrifice, beer is offered with the sacrifice of a black victim.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The uterine niece of the chief begins several acts of brewing and is helped
    to stab the black victim with an assagay; she is described as the one who gives
    over to the gods.
  category: action
  evidence_refs:
  - ev:9
- id: obs:18
  text: In great family gatherings, one ntukulu holds the leg, another holds the assagay,
    and batukulu dispose of the limbs offered to the gods.
  category: action
  evidence_refs:
  - ev:10
- id: obs:19
  text: At the cutting of the prayer, batukulu steal the meat or beer of the sacrifice
    and run away with them, and the passage explains that they can eat what was reserved
    for the gods because of intimacy with the malume.
  category: action
  evidence_refs:
  - ev:10
- id: obs:20
  text: The uterine nephew of the chief takes precedence in the circumcision school
    and begins a purifying ceremony that gives others use of the food of the deceased.
  category: action
  evidence_refs:
  - ev:11
