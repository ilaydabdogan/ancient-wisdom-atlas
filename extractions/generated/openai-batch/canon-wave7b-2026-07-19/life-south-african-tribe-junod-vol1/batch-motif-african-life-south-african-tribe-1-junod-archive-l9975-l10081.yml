candidate_motifs:
- id: motif:1
  label: Maternal-kin sacred exchange in marriage
  taxonomy_refs:
  - sacred_exchange
  basis: Marriage-related transfers include lobolo, reserved ox portions, a young
    cow to maternal relatives, and reciprocal bride-equipment duties tied to entitlement
    to the nyimba.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents social and ritual obligations rather than a narrative
    myth; the taxonomy reference is functional.
- id: motif:2
  label: Maternal relatives as ritual intercessors and sacrificial priests
  taxonomy_refs:
  - sacrifice
  basis: The maternal relatives are said to intercede for uterine nephews, perform
    sacrifices, have sons who can act as priests, and officiate cleansing after death.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: This is an ethnographic kinship-ritual pattern, not a mythic episode.
- id: motif:3
  label: Mother as life-giving stem and god
  taxonomy_refs:
  - divine_parent_child
  basis: Quoted speech says the mother is the true stem, is the god, and makes the
    child grow, while the child's survival depends on her in infancy.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The statement may be rhetorical or relational rather than a formal doctrine
    of a divine mother.
- id: motif:4
  label: Lineage preserved by a sister's son
  taxonomy_refs: []
  basis: A childless malume may refuse lobolo for his sister and claim her son, an
    adopted uterine nephew who can save the mother's family from disappearing.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No available taxonomy reference precisely matches this social-legal continuity
    pattern.
- id: motif:5
  label: Chief-like uterine nephew with license to take sacred offerings
  taxonomy_refs:
  - sacred_theft
  - trickster_boundary
  basis: The uterine nephew is called a chief who takes liberties with the maternal
    uncle; batukulu take meat or beer reserved for the gods during sacrifice and can
    eat it because of intimacy with the malume.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: medium
  cautions: The passage describes a recognized ritual license; the word 'steal' appears
    in the passage, but the action is embedded in kinship prerogative rather than
    an explicit trickster narrative.
- id: motif:6
  label: Uterine niece inaugurates rain sacrifice
  taxonomy_refs:
  - sacrifice
  basis: The chief's uterine niece begins the brewing sequence and stabs the black
    victim in the rain sacrifice, being described as giving over to the gods.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage mentions rain sacrifice but does not provide a full mythic
