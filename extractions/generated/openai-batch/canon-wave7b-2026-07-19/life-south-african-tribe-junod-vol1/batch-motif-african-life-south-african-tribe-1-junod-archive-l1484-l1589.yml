canonical_text:
  quote: ''
  summary: The passage describes Thonga practices around birth naming, later renaming
    at initiation or possession treatment, care of premature children, beliefs and
    procedures surrounding difficult or illegitimate births, paternity confession
    and divination, taboos involving the lover of the mother, a brief note on twin
    births, and the beginning of the confinement period before the umbilical cord
    falls.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Newborn children may be named according to circumstances of birth, such as
    travel, a tree under which birth occurs, rain, ruins, war, or admired public events.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Thonga names are generally used for both sexes, with two named exceptions:
    Nhwanin for a girl and Nwandjise for a boy.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Birth-names are later abandoned, usually at circumcision school or puberty,
    and boys and girls choose new names.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: People undergoing initiation adopt a new name, and those treated for possession
    take the name of the possessor when that possessor has become known.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A premature, small, delicate child is wrapped in castor-oil plant leaves,
    placed in a large pot, and exposed to the sun's heat.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A protracted and difficult birth is treated as evidence that the child is
    not legitimate, and concealing adultery during birth is described as taboo and
    as causing suffering to the mother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: When delivery lasts too long, the husband puts some of his semen in water
    in a sala shell, and the woman drinks it; if he is the father, the child is expected
    to feel the father and the birth to conclude.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: If the semen-water procedure does not work, the midwife forces the mother
    to confess the lover's name; if multiple lovers are concealed, the womb is said
    to refuse until confession is complete.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: An illegitimate child born without delayed labor may have closed hands and
    refuse the breast, prompting the midwife to seek confession.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Midwives perform divination with a broken pot, pumpkin seeds, and fire; exploding
    seeds are treated as proof of guilt, and each explosion corresponds to a lover
    whose name must be revealed.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The confession is kept private by the midwives, but the true father is said
    to have to be known on the day of birth.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The mother's lover is forbidden to come to the hut door after the birth of
    the illegitimate child until the umbilical cord has fallen off, because the child
    would die.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: If the mother sits on the threshold with the baby and the lover passes by,
    a midwife may take sand from his footprints and throw it on the baby's fontanelle;
    the husband may infer from this act that he is not the true father.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage notes that twin births have special customs and says that in former
    times one twin was killed; outside that case, no child is deliberately killed
    on the day of birth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The period from birth until the umbilical cord falls may last seven days and
    is called busahana, a confinement period for mother and child.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: The confinement period is to be concluded by the child's first outing, marked
    by a broken-pot rite; during the period the mother follows a special diet prescribed
    by a family doctor and is described as outside ordinary society.
  category: sequence
  evidence_refs:
  - ev:10
