canonical_text:
  quote: '"The bushaka on the father''s side is the head ; on the mother''s side,
    only the legs"'
  summary: The passage describes Thonga kinship terms for mothers, fathers, maternal
    relatives, paternal affiliation, and uterine nephews, with comparisons to Zulu,
    Pedi-Suto, and Ronga terminology. It explains that several women may be called
    mother, that the mother's brother is not treated as father, and that maternal
    kin form a secondary but freer relational home compared with the father's official
    home.
  language: English
  quote_policy: quoted
