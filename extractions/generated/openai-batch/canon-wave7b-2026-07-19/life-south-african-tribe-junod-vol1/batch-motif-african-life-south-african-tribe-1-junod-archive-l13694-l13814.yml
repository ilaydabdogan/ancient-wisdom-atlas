  summary: 'The passage describes the official marriage of a chief: bridewealth negotiations,
    attendant sisters for the bride, feasting, betrothal visits made by the chief''s
    representatives, a peaceful martial wedding expedition, a mock fight with controlled
    bloodshed, transfer of money and oxen, reciprocal slaughtering of cattle, a prior
    propitiatory sacrifice, dances, the bride''s trousseau and transfer, the building
    of the chief''s new capital, and a Ba-Nkuna account in which the selected royal
    wife is called the wife of the country and mother of the future chief.'
  language: English
  quote_policy: quoted
