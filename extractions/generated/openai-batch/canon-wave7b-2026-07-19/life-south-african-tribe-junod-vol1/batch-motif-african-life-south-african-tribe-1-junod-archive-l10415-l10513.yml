canonical_text:
  quote: ''
  summary: The passage discusses lobola among the Thonga, with a quotation said to
    apply also to the Ba-Suto. It describes a woman married under lobola as bearing
    children who legally or socially belong to those who provided the cattle, and
    it states that disputes over lobola create debts, pursuit of repayment, family
    conflict, and many court cases. The author contrasts this system with Western
    Christian and individualist ideas of the human person, argues that lobola treats
    wives, children, boys, and girls as clan or family property, and recommends progressive
    legal change by colonial authorities and stronger opposition by Christian missions.
  language: English
  quote_policy: summarized
