canonical_text:
  quote: ''
  summary: The passage introduces several Thonga/Ronga ethnographic informants and
    describes their social, political, ritual, divinatory, and narrative knowledge.
    It emphasizes Mankhelu’s roles as Nkuna regent, doctor, bone-thrower, priest,
    and rainmaker; Viguet’s information on family life and initiation; Spoon/Elias
    and Mboza’s ritual knowledge; Mboza’s possession initiation and exorcist status;
    and the author’s collection of customs, tales, taboo material, and other information
    through interviews and school meetings.
  language: English
  quote_policy: summarized
