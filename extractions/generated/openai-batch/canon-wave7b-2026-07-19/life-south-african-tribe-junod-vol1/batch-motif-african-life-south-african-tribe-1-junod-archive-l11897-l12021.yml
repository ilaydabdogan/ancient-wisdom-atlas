canonical_text:
  quote: ''
  summary: 'The passage describes daily village movement and especially women''s work:
    preparing morning food, going to fields, cooking or returning with food, plastering
    hut floors with clay and dung, gathering firewood, taking grain from storehouses,
    pounding it with pestles, fetching water from wells, and the village at sunset.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The village setting includes an oxen kraal, huts, a square, a little wood,
    doors, and reed yards, with people moving about, talking, laughing, playing, and
    working.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women are described as especially busy and begin at sunrise by coming out
    of their huts, washing, lighting a fire, warming leftover mealie pap, and preparing
    monkey-nut sauce.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The family eats a morning meal called fihlula.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At tillage time women go to the fields carrying a hoe, a conic basket on the
    head, and sometimes a baby on the back.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Field work includes digging sweet potatoes, preparing a future plantation,
    and weeding mealies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Women may return during the heat of the day to prepare the evening meal, or
    remain in distant gardens or sorghum fields and bring cooked food back at sunset.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: A reported incident describes a Rikatla woman carrying a child and hot monkey-nut
    sauce; after she tripped, the pot fell on the baby, who was scalded to death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: One home duty is to collect black clay from swamps, mix it with fresh dung
    from the oxen kraal, and smear the hut floor with the mixture.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The floor plaster is said to crack if it lacks enough dung, while good clay
    hardens and lasts about a week.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Another woman may collect dead wood with a primitive axe, tie it into a bundle
    with grasses and twigs, and throw it before her hut door with an exclamation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women retrieve mealies, monkey nuts, millet, and sorghum from small storehouse
    huts on poles by lifting the roof.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Women process grain and nuts with mortars and pestles; the pounding is rhythmic
    and audible at a distance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Before cooking mealies, women fetch water from the village well with round
    pitchers on their heads.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Ronga wells are described as sand holes in hollows, generally protected by
    thorny branches to keep cattle from drinking and fouling the water.
  category: object
  evidence_refs:
  - ev:8
- id: obs:15
  text: At sunset, shadows of trees lengthen on the village square and rays of sun
    still reach the fireplaces.
  category: setting
  evidence_refs:
  - ev:9
