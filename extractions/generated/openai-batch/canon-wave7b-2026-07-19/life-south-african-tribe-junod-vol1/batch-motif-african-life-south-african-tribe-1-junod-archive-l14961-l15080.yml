canonical_text:
  quote: ''
  summary: The passage recounts disputed Nkuna succession history from the testimony
    of Mbokota, including the loss of rights by an elder branch, the handling and
    sale of royal objects, rival claims after Shiluvane’s death, the armed proclamation
    and external confirmation of Muhlaba, continued resentment by Mbokota, a similar
    Baloyi succession dispute, and a general reflection on Thonga political instability
    and violence among rival royal kin.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says two usurpations occurred in the Nkuna tribe and notes that
    accounts differ between current holders of chieftainship and those who say they
    were deprived of their right.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hoshana fled during the Ngoni disturbances to the Nwamba country, possessed
    the ritlata, and after his death the royal apanage was brought to Shiluvane rather
    than returned to Hoshana's children.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mbangwa had Tibatiba, Nyantsiri, and Shiluvane as children; after Mbangwa
    died, his younger brother Ribye reigned, and after Ribye died the chieftainship
    came back to Mbangwa's children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tibatiba told Shiluvane to take the elephant tusk belonging to the Nkuna royal
    family and reign in Nyantsiri's place, while only keeping the tumbler of Madyubane.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Shiluvane sold the tusk and bought wives, beads, and clothing for himself.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'After Shiluvane''s death, four men claimed the chieftainship: Mapsakomo,
    Mbokota, Muhlaba, and Muholo.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The great counsellor Shikhibane said that he had heard Shiluvane name Muhlaba
    as his desired successor, and he later assembled the tribe in arms to proclaim
    Muhlaba.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Warriors took Muhlaba to his new residence in an epic march through the country
    while singing war songs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Captain Dahl, as Native Commissioner for Zoutpansberg, confirmed Muhlaba's
    selection, and the Pedi queen Magayibia also said she had heard Shiluvane designate
    Muhlaba.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Mbokota established a separate circumcision school to show independence, but
    Muhlaba claimed the fees and Mbokota eventually submitted because he lacked enough
    warriors.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage gives a similar Baloyi case in which sons of Nkami tried to seize
    the chieftainship from Munyamana, causing a war after which Munyamana regained
    his right.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that dividing power between brothers and allowing younger
    brothers to reign before legal heirs caused rivalry, clan disunity, quarrels,
    and unrest.
  category: other
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says Maphunga, chief of Nondwane, killed four brothers or near
    relations and treacherously poisoned Gigiseka through the agency of a dissolute
    woman.
  category: action
  evidence_refs:
  - ev:10
