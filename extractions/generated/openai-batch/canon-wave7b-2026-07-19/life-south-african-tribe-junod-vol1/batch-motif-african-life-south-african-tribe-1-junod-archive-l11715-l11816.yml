canonical_text:
  quote: "“ku tlhaba homu ba hamba milao” — “to kill an ox according to rule”"
  summary: The passage describes rule-governed distribution of portions of an ox according
    to kin rank and social role, an illustrative clan-rank comparison involving Tembe,
    Sabi/Mpanyele, and Maputju, and the village headman’s duties as provider, watcher,
    and mediator of disputes.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: When the headman kills an ox for a feast, the portions are distributed to
    relatives according to their place in the family.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The headman keeps the breast, including the sternum, ribs, and much of the
    viscera; the heart and kidneys are probably sent to his wives.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Ranked male relatives receive specific limbs: the next brother receives a
    hindleg, the third in rank a foreleg, the elder son the second hindleg, and the
    younger son the second foreleg.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Other portions are assigned to in-laws, the maternal uncle, old people, village
    men, old men, shepherds, and butchers; women are barred from eating the tongue
    or under lip.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The passage names the ox-distribution custom as killing an ox according to
    rule, notes that a subordinate killer sends the breast to the village master,
    and states that the rules concern oxen and not goats.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: 'A footnote applies the meat-portion pattern to three related clans: Tembe
    is associated with the chest, Sabi or Mpanyele with the hindleg, and Maputju with
    the foreleg.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The customs are said to show the headman as master, father of subordinates,
    and provider.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The headman must watch over the village and may fine a lover caught entering
    the huts of daughters-in-law during a son’s absence.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: In disputes such as pigs damaging gardens, the headman urges compensation
    after warning, but if the offender refuses, the case goes to the chief’s court
    because the headman lacks soldiers or coercive means.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: A persistently troublesome person may be forced to build a hut alone outside
    the village; children may be beaten for theft or mocking cripples, rather than
    fined in the same way as adults.
  category: action
  evidence_refs:
  - ev:10
