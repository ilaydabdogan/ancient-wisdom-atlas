canonical_text:
  quote: ''
  summary: 'The passage describes named spaces in a Thonga village: the men''s bandla,
    the open hubo, and the bukwele associated with co-wife quarrels. It then describes
    the evening meal as a village-wide circulation of food: women cook and distribute
    portions, children carry plates to the men''s gathering, and portions are exchanged
    so that each person eats from all the fires. A witnessed example from Spoon Libombo''s
    village illustrates communal food support under a headman''s responsibility.'
  language: English
  quote_policy: summarized
