  text: The bandla is identified as a Zulu word replacing the Ronga term shisiso,
    glossed as a place of shelter from wind.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men warm themselves by a small fire and eat together in the bandla; women
    enter only to bring food, and boys remove ashes from the fireplace.
