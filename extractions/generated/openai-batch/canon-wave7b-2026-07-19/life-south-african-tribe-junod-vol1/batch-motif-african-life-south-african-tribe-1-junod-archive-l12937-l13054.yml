  summary: The passage describes small autonomous Bantu clans and their nineteenth-century
    amalgamation into larger kingdoms under several leaders. It then explains Thonga
    clan laudatory names, or shibongo, as ancestral family names used in greeting,
    consolation, and praise formulas, with examples involving enduring huts, fertile
    earth, flowing rivers, and animal images.
