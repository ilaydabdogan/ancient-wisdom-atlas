canonical_text:
  quote: ''
  summary: 'The passage describes mahloko mourning payments, affinal visits after
    death, and northern procedures after a wife''s death: a one-year feast at the
    wife''s parents'' village, goat-related cleansing rites, prayers and sacrifice,
    mediated juridic discussions, payments in hoes for the deceased wife''s head or
    brains, claims for repayment or a replacement wife if the deceased died childless,
    and later full lobolo after the replacement wife gives birth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After returning home, mourners spend the mahloko money on wine, may become
    intoxicated, and afterwards both families resume visits.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Converts are said still to adhere to the mahloko custom by sending money to
    the wife's family when informing them of the death, without performing another
    ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In northern clans mahloko are paid, and the widower's family may claim repayment
    of the whole lobolo when the deceased wife has left no child; in Nondwane lobolo
    must be repaid if the woman dies shortly after marriage.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Further north, the husband buries the deceased wife according to ordinary
    rules, then after one year both families gather at the wife's parents' village
    for a special feast and provide victims.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the feast, the father of the deceased wife squeezes the goat's psanyi on
    the assistants, insults the gods said to have killed his child, and tells the
    widower's relations that he cleanses them from their misfortune.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The widower's father performs a similar act, insults his own gods, everyone
    rubs the green liquid on the body, and prayer for new blessings and the offering
    of sacrifice follow.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'A juridic discussion then occurs: each family takes a hut, the widower''s
    family assembles in the house of the deceased wife''s mother, and the parley is
    conducted through a go-between.'
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The husband's family sends hoes to the wife's family; the wife's family demands
    payment for the deceased woman's head or brains, receives five hoes, and returns
    two as acts of cleansing and head-shaving.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: If the wife has died childless, the husband's family has opened a claim and
    later asks, through the go-between, for another wife or repayment of the money
    to buy one.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: If the wife's family has a girl of age, it offers her as a new wife; the husband's
    family brings twenty or thirty hoes as the beginning of lobola, and the girl goes
    immediately if marriageable or remains at home until grown.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the new wife has gone to live with the husband and gives birth, her family
    demands full lobolo for her because she has given the husband's family posterity.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: If the wife's family has neither a girl nor money, the husband's family is
    said to follow its oxen into the family of a girl bought by the wife's family
    for one of its sons, leading to a relation with the widower's great mukonwana.
  category: sequence
  evidence_refs:
  - ev:10
