  summary: The passage argues that the evolution of native society will involve suffering
    and requires patience from both Whites and Blacks. It urges conservative Natives
    to accept change and White men to allow transformation gradually. It presents
    moral and religious teaching as necessary for wisdom, patience, and understanding,
    warns against public houses and alcohol, and hopes that Church and School will
    be honored institutions in the future Bantu village.
