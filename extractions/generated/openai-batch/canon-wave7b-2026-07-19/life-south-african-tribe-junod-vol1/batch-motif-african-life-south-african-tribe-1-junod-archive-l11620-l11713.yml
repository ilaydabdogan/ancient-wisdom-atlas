canonical_text:
  quote: ''
  summary: The passage analyzes rites connected with moving and founding a Thonga
    village. It groups them as social, protective, and passage rites; describes the
    headman and principal wife as ritual owners who tie or possess the new village;
    explains death-related abandonment and altered entrances; presents the fence as
    magical protection; and interprets relocation as a passage involving separation,
    a marginal period with taboos, and final collective purification.
  language: English
  quote_policy: summarized
