literal_observations:
- id: obs:1
  text: In the Zihlahla country, a chief mustered his forces by means of the shipalapala,
    described as a rudimentary trumpet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A swift messenger ran from village to village blowing the shipalapala, then
    passed it to another runner when tired; this relay continued until the whole country
    had been reached.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the sound of the shipalapala, warriors shouted “A hi hlomen!” meaning “to
    arms,” put on war costumes, and went to the capital.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In Nondwane, sub-chiefs possessed their own shipalapala and each summoned
    his own people.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Nondwane, the shipalapala mostly sounded to call for dances and feasts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the army was mobilised only to discuss matters quietly, messengers ran
    through the country shouting “Mayivonoule!” meaning “take the shields,” and warriors
    answered “A hi hlomen!” meaning “to arms.”
  category: speech
  evidence_refs:
  - ev:4
