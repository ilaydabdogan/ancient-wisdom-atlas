- id: obs:2
  text: Girls are forbidden to eat certain animals or parts of animals, with stated
    consequences for a future child or delivery.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Unmarried girls are restricted from walking among pumpkin plants to pluck
    fruit and are instructed to place the end of a pumpkin stem in the waist while
    plucking pumpkins.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Married women and women generally are given additional food prohibitions involving
    ox blood, bowels or stomach parts, testicles, underlip, tongue, rectum, porcupine,
