canonical_text:
  quote: ''
  summary: The passage lists Thonga taboos for girls and women around childbearing,
    menstruation or nubility, and marriage. It explains forbidden animal foods, pumpkin-related
    restrictions, and an ox-kraal restriction, often with stated consequences for
    future children, women, courting, or cattle. It then describes aspects of the
    first year of marriage, including the new wife lacking her own hearth, cooking
    for her mother-in-law, the husband’s eating arrangements, gendered domestic space,
    and the precedence of the first wife.
  language: English
  quote_policy: summarized
