canonical_text:
  quote: ''
  summary: The passage describes Thonga childhood from about the third to the fourteenth
    year, emphasizing boys’ liberty, goat herding, peer customs, minor thefts, hunger-driven
    foraging, and small-game trapping. It also notes the goat’s ritual importance
    in sacrifices and compares it to Kaffir corn as an old ritual staple.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage presents childhood as the period in which an infant becomes a
    boy, roughly from the third to the fourteenth year.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: During early childhood the child stays with grandparents, receives little
    formal education, and is described as having considerable liberty.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Boys are said to spend their time herding goats, stealing, catching game,
    learning the science of the velt, and playing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The goat is described as the chief domestic animal, common among households,
    and regularly used in sacrifices.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sons of the village master or other proprietors tend goats until about their
    tenth or eleventh year, after which they may be promoted to care for oxen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Young goatherds go to the velt scantily clothed and play small trumpets made
    from bone or reed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Near gardens, boys watch the goats and try to keep them away from green mealies
    and sweet potato leaves.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the boys play and leave the youngest in charge, the goats may return
    to a prohibited garden and eat mealie stems.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The garden mistress identifies the responsible herd by tracks, uproots damaged
    stems, and throws them before the father’s hut.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The father may thrash the boys, and repeated offences may be punished by the
    garden owner’s husband.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: A peer custom requires a boy who emits an incongruous bodily noise to answer
    with a secret formula; ignorance or revealing the answer is punished by beating
    and goat-watching duty.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Boys steal sweet potatoes and roast them on a hidden little fire, or steal
    honey found in discarded containers set out to attract bees.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Minor thefts by goatherds are punished by whipping without a fine and are
    described as actions of little boys, not serious offences.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Because of hunger, boys catch birds, field-mice, eggs, and other small game.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Boys kill birds by throwing sticks and also make traps and snares for birds
    and hares.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
