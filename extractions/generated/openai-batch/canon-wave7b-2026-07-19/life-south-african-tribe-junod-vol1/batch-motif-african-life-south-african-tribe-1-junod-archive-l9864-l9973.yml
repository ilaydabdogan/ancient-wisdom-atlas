canonical_text:
  quote: ''
  summary: The passage discusses Thonga marriage and kinship rules in relation to
    theories of promiscuity, group marriage, and matriarchy. It reports preferential
    marriage rights involving tinamu, strict taboo on a married woman’s relations
    outside her husband, extended kinship terminology, and the maternal uncle’s duties
    and rights toward uterine nephews and nieces, including a tabooed claim to a share
    of lobolo enforced by fear of the mother’s gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author states that he sees no trace of original promiscuity among the
    Thonga, while noting a Pedi custom allowing free intercourse on one day at the
    close of the second circumcision school.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says a man has a special preferential right to certain women of
    his wife’s family, called tinamu, and that his son may regard a wife from his
    mother’s clan as especially appropriate.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage contrasts reciprocal Australian group-marriage rights with Thonga
    familial law, stating that a married Thonga woman is absolutely tabooed from relations
    with anyone except her husband.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that polygamy exists and is approved among the Thonga,
    while polyandry is strongly censured and described as disgusting.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage identifies the matlulana superstition as the main reason given
