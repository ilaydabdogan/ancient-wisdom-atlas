canonical_text:
  quote: ''
  summary: 'The passage describes Thonga funeral actions at the grave: careful filling
    of the grave, the rite of the mhamba twig, invocation of ancestors, prayer for
    peace, wailing by kin, breaking objects over the grave, and an explanatory account
    of death as a dangerous uncleanness requiring purification and later reintegration
    rites.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Relations fill the grave by hand, remove roots from the soil, and treat this
    care as a taboo of respect for the deceased.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A twig or twigs from a male nkanye branch are placed in the deceased person's
    right hand; one may be removed for the ritual while another remains with the deceased.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The twig is called mhamba and is described as an offering or object by which
    people enter into relation with ancestral spirits.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The officiant sits at the foot of the tumulus, turns the twig around his head,
    makes circular figures in the air, pronounces the syllable Tsu, and calls the
    spirits.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The officiant prays to the ancestors, says that the deceased has gone back
    to them, and asks that the living remain and mourn in peace.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the prayer, wailing begins; women shout and throw themselves on the
    ground, the wife laments being left alone, and brothers weep together.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: During the mourning, pots and handles of assagais are broken over the grave.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Death is described as a dangerous contaminating power that makes nearby objects,
    people, relatives, and affinal relations unclean.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The uncleanness is described in concentric circles around the deceased, with
    widows in the innermost circle, followed by grave diggers, the village, relatives
    elsewhere, and relatives of wives.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The bereaved village is described by the technical expression meaning that
    the village is dark, and a marginal period with taboos precedes reintegration.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:11
  text: The funeral sequence is summarized as Great Mourning, sexual rites, and familial
    rites that restore the life of the family or social group.
  category: sequence
  evidence_refs:
  - ev:9
