canonical_text:
  quote: ''
  summary: 'The passage describes post-funeral arrangements for widows: their possible
    reassignment within the deceased husband’s family, limits on who may inherit a
    widow, resistance by widows and family councils, and a subsequent widow purification
    rite called lahla khombo, described as casting away the malediction of death.
    The widows leave the village with witnesses, attempt the ritual act, return to
    the village entrance with shouts of mixed joy and sorrow, process to the grave
    to address the deceased, and complete further purification acts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After repartition is decided, the deceased man’s sisters call the widows and
    assign them to give food to particular men, after which disputes may begin.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A widow may refuse connection with brothers-in-law and may say she is taking
    her young son as husband, or that she chooses the big tree of the village where
    her late husband built his hut.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among the Ba-Ronga, an elder brother of the deceased is described as unable
    to inherit a widow because he is regarded as father-like to her, not as a husband.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the first wife wants to go to a man outside the village, the family council
    is said to object strongly because her departure would mean the disappearance
    of the village.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The man provisionally chosen as a widow’s future husband immediately begins
    visiting her, described technically as marching to her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Before a new life with a new husband can begin, the widows must perform lahla
    khombo, described as throwing away the malediction of death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The purification requires the widow to have sexual intercourse with another
    man whom she deceives; if she ends the act before completion, the man takes the
    malediction of death and she is purified.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the act is completed, the widow is said to have failed and returns in shame
    and despair.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The men of the village send the widows away to scatter the malediction through
    the country and get rid of it before another misfortune occurs.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The widows go with conical baskets on their heads, each accompanied by a friend
    who acts as witness.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A successful widow returns saying that she has coped with and overcome the
    mourning; an unsuccessful widow is described as overcome by the mourning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The man who has unknowingly purified a widow may consult a nanga to remove
    the pollution of death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The widows return together, stand at the main entrance of the village, and
    announce success with mikulungwana shouts that express both joy and sorrow.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The returning group forms a procession to the grave and tells the deceased
    that his death left them exposed and forced them through a painful trial.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: After the return, the widows put on new undergarments and complete purification
    by another steam bath; the mourning is then said to have ripened, and what remains
    is to kill the mourning.
  category: sequence
  evidence_refs:
  - ev:9
