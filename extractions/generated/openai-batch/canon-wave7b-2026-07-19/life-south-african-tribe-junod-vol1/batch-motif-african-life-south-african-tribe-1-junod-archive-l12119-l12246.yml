canonical_text:
  quote: ''
  summary: 'The passage first recounts Mandjia obtaining a pass-like letter to help
    recover oxen by invoking the authority associated with White officials. It then
    describes Thonga village beer brewing and drinking: the headman pours beer into
    the gandjelo as an obligatory religious act, guests gather, some beer is reserved
    for kin and reciprocal hosts, and dancing follows. The passage also describes
    hemp smoking through a reed-and-horn water pipe and a saliva-blowing game in which
    players create fences and mock attacks with streams of saliva.'
  language: English
  quote_policy: summarized
