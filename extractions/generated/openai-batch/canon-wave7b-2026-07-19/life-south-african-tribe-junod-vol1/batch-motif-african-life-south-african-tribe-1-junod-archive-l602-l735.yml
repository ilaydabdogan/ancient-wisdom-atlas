canonical_text:
  quote: ''
  summary: The passage surveys Thonga clan and dialect groupings by region. It describes
    the Ronga group around Delagoa Bay, the Djonga and Nwalungu groups divided by
    the Nkomati and Olifant rivers, the Hlanganu group to the west, and the Bila and
    Hlengwe groups to the east and northeast. It lists associated clans, locations,
    dialect relations, migrations, refugee colonies, and historical pressures such
    as wars and Zulu incursions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Ronga group is placed around the Bay of Delagoa, with named clans and
    sub-clans located west, south, north, and farther north of the bay area.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The survey divides territory northward by crossing the Nkomati and Olifant
    rivers: Djonga is located from the Nkomati to the Olifant, and Nwalungu north
    of the Olifant.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The terms Djonga and Nwalungu are glossed as South and North, and are described
    as relative designations probably coined by people near the Olifant border area.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Djonga group includes Khosa, Rikotjo, Shiburi, and Mathiye, and is associated
    with Ba-Hlabi clans near the Limpopo that speak a similar dialect.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Nkuna clan is described as having migrated into the Transvaal with Mavundja
    and other Hlabi during the wars of Manukosi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Nwalungu group includes the Baloyi or Ba-ka-Baloyi and the Maluleke; the
    Maluleke are reported by native historians to be one half of a larger Nwanati
    clan, with another half near the mouth of the Limpopo.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ronga, Djonga, and Nwalungu are described as lying on the central line or
    axis of the tribe, with Hlanganu to the west and Bila and Hlengwe to the east.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Hlanganu group is described as the smallest group, including the Nwamba,
    Mabila, and Hlanganu clans, and as having a dialect close to Djonga.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Bila group is named after the Lower Limpopo plain, includes clans on both
    banks of the river, suffered from Zulu invaders, and has distinctive dialect traits.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Hlengwe group is applied provisionally to eastern and northeastern Thonga
    populations and is divided into Hlengwe proper, Ba-Tswa of Inhambane, and Nwanati-related
    subdivisions.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Outside the tribe's main area, the passage identifies emigrated Thonga colonies
    in the Transvaal, especially in the Spelonken district, where they were called
    Magwamba and included Hlengwe, Maluleke, and Djonga refugees.
  category: setting
  evidence_refs:
  - ev:8
