canonical_text:
  quote: ''
  summary: 'The passage discusses changes in Thonga village life under colonial-era
    “civilisation”: altered work incentives, migration to Johannesburg mines, taxation,
    adoption of the plough, shifts in gendered agricultural labor, and the proposed
    future of the Bantu village. It argues that transformation is inevitable but should
    be guided so that communal virtues of the older circular village are retained
    while a wider social concern beyond the family is developed.'
  language: English
  quote_policy: summarized
