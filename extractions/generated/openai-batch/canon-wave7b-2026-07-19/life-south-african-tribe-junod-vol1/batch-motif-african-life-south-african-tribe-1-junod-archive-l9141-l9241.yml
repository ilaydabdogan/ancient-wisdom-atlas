  summary: The passage describes Thonga affinal kinship relations after a childless
    wife dies, including lobola compensation, possible marriage to a woman formerly
    in a prohibited or fearful relationship category, a rite that changes that relationship,
    substitute daughters who may settle the widower's claim, and rules concerning
    wife's siblings and younger sisters-in-law.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A hypothetical childless wife's death leaves a widower after mourning with
    an unresolved compensation claim when the wife's parents have neither money nor
    a young girl to give.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The deceased wife's father is said to open the way of bukonwana to the widower
    when no other resource is available.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gogwe, Mboza, and an official go-between approach Mbekwa; a calculation of
    fifty, thirty, and twenty hoes is used to complete the lobola associated with
    Maphunga.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mbekwa calls Maphunga and tells her that her great mukonwana is now her husband.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mboza fetches a goat before a ceremony called the rite of killing bukonwana
    or shikonwana, whose stated aim is to kill one relationship and replace it with
    another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Maphunga may refuse the proposed marriage by saying she fears him too much
    and that it is taboo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: If Maphunga refuses, another woman, a daughter, or a later-born girl may be
    used to end the widower's claim; the later-born girl is said to raise up the house
    of her aunt Nsabula.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The great mukonwana is described as being in a peculiar position toward the
    man by whose oxen she has been bought, marked by extreme respect and fear.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: A further explanation offered in the passage is that the great mukonwana is
    also a mamana because her daughters are potential wives, and the author reports
    a strong feeling against marrying a woman and her daughter.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The wife's father is also called mukonwana, but the passage says the respect
    includes less fear and that the son-in-law may soon call him tatana.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'The wife''s brothers and sisters are classified with attention to age: Vulandi
    and Makhube are mukonwana of Mboza, while Mahangale is mukonwana and can also
    be called namu.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Tinamu or balamo are described as those who follow the wife, especially younger
    sisters; they are presumptive wives, may play freely and eat from the same plate
    with the husband, and may smear his face with ashes and wash it with water.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Sexual relations with the younger sister-in-law are forbidden; if pregnancy
    occurs, the man must notify the father-in-law, bring five hoes, and later pay
    the remainder of the lobolo.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: A younger sister married to the same husband as her elder sister is called
    nhlantsa and is described as washing the elder sister's dishes and working more
    or less as her servant.
  category: relationship
  evidence_refs:
  - ev:10
