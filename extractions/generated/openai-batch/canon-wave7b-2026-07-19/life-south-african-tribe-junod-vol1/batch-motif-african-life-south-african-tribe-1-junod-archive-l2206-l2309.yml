canonical_text:
  quote: ''
  summary: 'The passage describes a Thonga weaning sequence: medicine from a ntjopfa
    root to help the child forget the breast, a physician-directed bondlola/hondlola
    rite with chicken sacrifice, prayer to spirits, rubbing the child with bran, depositing
    the resulting timhore in an ant nest with a no-looking-back taboo, explanations
    of infancy as a period of disease, speech taboos around children, removal of the
    weaned child to grandparents, and sexual and pregnancy restrictions intended to
    protect the weaned child.'
  language: English
  quote_policy: summarized
