canonical_text:
  quote: ''
  summary: 'The passage describes several Thonga childhood games and practices: a
    teasing game with mealie leaves called a purse, a paired beetle game with sung
    commands and role reversal, boys'' courage game attacking wasp nests with leaf
    shields, mock cattle raids among shepherds, inter-clan insults, and the use of
    imaginary frightening beings or wasps to quiet or pressure children.'
  language: English with Thonga/Ronga terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the purse game, an older goatherd rolls mealie leaves into a ball, throws
    it to a boy, calls it his purse, and the boy who misses a return throw is mocked
    as not a man but a little boy.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the beetle game, children play in pairs; one lies prone while the other
    sits on the back, sings about the beetle turning up, beats the back, and the players
    then reverse positions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says boys develop courage through a dangerous game of making war
    on wasps, using plaited nala palm leaves as shields and branches as protection.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A boy strikes the wasp nest, the insects attack and sting the boys, and the
    boys either flee from pain or resist and kill the wasps.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Shepherds from different flocks conduct mock battles by taking one another's
    cattle; stronger boys bring a stolen herd near their village but do not let it
    enter the kraal.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The defeated shepherds call elder brothers to recover the cattle and, if possible,
    beat the thieves.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Boys of Mpfumu and Matolo exchange insults referring to foods considered doubtful
