    and timbekmbele share the function of frightening, disciplining, or pressuring
    children.
  claim_level: same_function
  target: child-frightening imaginary beings in this Thonga passage
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
