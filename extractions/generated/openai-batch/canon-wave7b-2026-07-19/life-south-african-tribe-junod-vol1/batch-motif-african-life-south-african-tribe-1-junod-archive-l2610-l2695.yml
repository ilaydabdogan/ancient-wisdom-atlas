    historical relationship among the beings.
- id: claim:2
  claim: The passage supports a cautious lexical comparison between Shitukulumukumba
    and the Ronga Nuambilutimhokora because it says the former corresponds to the
    latter expression for 'the one who has scales on the heart.'
  claim_level: linguistic_similarity
  target: Ronga Nuambilutimhokora
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives an equivalence but not a full linguistic analysis
    or independent Ronga narrative.
- id: claim:3
  claim: The passage supports a cautious connection between the name Shitukulumukumba
    and Zulu because it states the word is originally from the Zulus.
  claim_level: linguistic_similarity
  target: Zulu origin of the term Shitukulumukumba
