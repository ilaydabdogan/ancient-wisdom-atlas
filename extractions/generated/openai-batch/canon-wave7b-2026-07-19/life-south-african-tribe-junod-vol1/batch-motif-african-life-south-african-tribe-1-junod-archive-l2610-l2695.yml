  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage says the custom of frightening children with imaginary beasts
    is widespread among Thonga.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: Shingomu-Ngomu or Shikunkununu is described as a mighty, huge being that walks
    while balancing its body from side to side with a sound resembling its name.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Shitukulumukumba, identified with the Ronga Nuambilutimhokora, is described
