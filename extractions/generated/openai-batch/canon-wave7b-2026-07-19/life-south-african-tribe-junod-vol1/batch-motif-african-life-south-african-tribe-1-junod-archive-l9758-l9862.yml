canonical_text:
  quote: ''
  summary: The passage describes Thonga rules for inheriting widows and inherited
    women. It distinguishes inheritable widows from unmarried women to be lobolaed,
    gives rules for elder and younger brothers' widows, maternal-uncle widows, cousins'
    widows, and father's wives, and explains prohibitions through lineage, bridewealth,
    clan affiliation, and avoidance of contradictory kinship statuses. It concludes
    by situating these marriage rules within an agnatic Thonga family system while
    mentioning a general ethnographic theory of earlier relationship systems.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage distinguishes widows whom a man might inherit after a husband's
    death from unmarried women whom he might lobola.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women eventually inheritable by the speaker are generally called namu or nsati;
    relations with them are described as free but not extending to sexual intercourse.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: An elder brother's widow is described as a regular legacy, with the phrase
    "Ndi ngada" glossed as eating or inheriting by prior right.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: A younger brother's widow may be married only if she is old and no longer
    able to bear children, except in cases where no one else can claim her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The stated reason against taking a childbearing younger brother's widow is
    that a child born from the union would have incompatible statuses among the same
    mother's children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A widow of the maternal uncle may be allotted to a man, but children born
    from the union belong to the family that paid the lobolo, and the man is described
    as having only usufruct.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The inherited woman in the maternal-uncle case is said to till fields and
    serve a daily plate of porridge, but is not described as really belonging to the
    recipient.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Muhambi can inherit Magugu, the widow of Hlangabeza, because Hlangabeza is
    a cousin through two brothers who are fathers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Muhambi cannot inherit Debeza, wife of Phusa, because Phusa belongs to another
    shibongo through his father, and the men of Mashabane claim the marital property
    rights.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: A man can inherit one of his father's wives only under certain circumstances,
    and the dlaya shilongo is never performed for inherited women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: A disappearing rule says that women whose husbands had no younger brothers
    must be inherited by batukulu, not by bana.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: Reasons given for excluding bana include that sons would take liberties with
    their father's wives and that a child born from such a union could stand in conflicting
    generation relationships.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The passage states that the Thonga family is now agnatic and that father's
    right is paramount, while some features appear as relics of former periods.
  category: other
  evidence_refs:
  - ev:8
  - ev:9
