canonical_text:
  quote: ''
  summary: 'The passage describes Thonga and Ba-Ronga judicial practices concerning
    murder and witchcraft: compensation and avoidance of vendetta in homicide cases;
    social impurity and ritual treatment of a murderer; witchcraft as a grave crime
    investigated through divination, ecstatic questioning, and ordeal by the mondjo
    plant; punishments formerly including death, later expulsion or fines under colonial
    jurisdiction; and conflicts between Native Court decisions and European colonial
    courts.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In former murder cases, compensation could include the remittance of a woman,
    though the deceased person’s family might instead receive money from the woman’s
    sale.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Ba-Ronga, relatives who want to avenge a murdered man are prevented
    by their people so the matter can be brought before the chief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A murderer may be required to pay a fine, and the stated purpose can include
    helping the bereaved family acquire a new spouse and new members.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A murderer is scorned by the community, eats apart for a week, is regarded
    as unclean, and takes miluru medicine with warriors who have killed enemies.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that vendetta is absent from Thonga practice in the punishment
    of murder.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Witchcraft, called buloyi, is treated as one of the greatest crimes and is
    described as equivalent to or worse than assassination because of an added idea
    of eating human flesh.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The tribunal uses magical means to discover suspected witchcraft, including
    divination by casting lots with bones and shells, followed by a second confirmation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After divination designates a suspected witch or wizard, relatives of the
    deceased lodge a complaint with the chief, making the accusation official before
    the tribunal.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The chief may send the plaintiff and accused to a magician who questions them
    and enters an ecstatic condition.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: An accused person who denies witchcraft may request the ordeal of the mondjo
    plant; intoxication by the drug confirms guilt and leads to condemnation by the
    tribunal.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The punishment for buloyi is described as death by hanging, impaling, or drowning
    in the river when the wizard was believed to send crocodiles to kill victims.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Under Gungunyane, a chief’s sign could direct an executioner to follow a condemned
    person into the bush and kill him from behind with a club or assagay.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: Under colonial jurisdiction, chiefs no longer dare execute suspected witches
    and instead expel them or impose high fines, while some individuals still carry
    out revenge killings.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage describes European courts condemning people, including an induna,
    for killing a noyi who had been condemned by a Native Court.
  category: relationship
  evidence_refs:
  - ev:10
