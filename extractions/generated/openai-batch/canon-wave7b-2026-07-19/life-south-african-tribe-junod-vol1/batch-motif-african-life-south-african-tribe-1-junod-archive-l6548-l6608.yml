canonical_text:
  quote: ''
  summary: Ethnographic prose traces a Ronga/Maputju girl’s life from infancy through
    play, domestic training, marriage, motherhood, old age, dependence, and 'second
    childhood,' followed by a note that the essay writer was just emerging from childhood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The child is dressed first in a gazelle skin tied by her mother and later
    in an antelope skin; she learns to walk, talk, know her parents, eat prepared
    mealies, is weaned after three years, and stays for a time with her grandmother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: As a walking child she plays at cooking with sala shells, then small pots;
    she draws water in a small calabash for her father and gathers small bundles of
    wood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When older, she takes over much of her mother’s work, reducing the mother’s
    need to crush mealies, go to the well, or go to the fireplace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When she is fully grown, suitors come; if accepted, they bring purchase money,
    described as lobola, and she becomes associated with a husband.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: If she bears children, they grow and perform work such as fetching water,
    cutting wood, and ploughing fields, and later they marry.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: After her children are married, the woman again performs domestic tasks such
    as steeping and crushing mealies, making flour, cutting wood, preparing beer,
    and smearing the hut floor until she is very old.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In old age she is fed by others; grandchildren may be sent with food, may
    eat it on the way, and may falsely claim to have delivered it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the morning a stick is put in the old woman’s hand and she is helped out
    of her hut to warm herself in the sun.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the end of life the Ronga woman is described as losing sight and hearing,
    entering 'second childhood,' crying, and saying she is ill-treated.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The editor notes that the girl who wrote the essay was just emerging from
    childhood and therefore emphasized the first phase of life.
  category: other
  evidence_refs:
  - ev:8
