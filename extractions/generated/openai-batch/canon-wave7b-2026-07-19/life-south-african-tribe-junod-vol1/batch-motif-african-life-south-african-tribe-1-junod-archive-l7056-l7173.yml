  quote_or_summary: Miscarriage is feared because of uncontrolled taboo blood; the
    foetus must be buried in wet soil or rain will fail and hot winds dry the polluted
    country. In drought, the mbelele rite searches premature-child graves and throws
    contents into river mud. A woman after miscarriage is impure for at least three
    months until menses cleanse her.
