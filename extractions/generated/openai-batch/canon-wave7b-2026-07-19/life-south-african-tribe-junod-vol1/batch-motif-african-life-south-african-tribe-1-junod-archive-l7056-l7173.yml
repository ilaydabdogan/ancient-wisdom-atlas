- id: obs:1
  text: Sexual relations between husband and wife are said to be regulated by many
    taboos.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: During monthly "tihweti" the woman is taboo, secluded from her husband, kept
    in the left half of the hut, and not allowed to cross the median line.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the menstruating woman wants snuff or tobacco, she must send a child to
    fetch it from her husband's side.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: During the menstrual taboo period she sleeps on a special mat, wears special
    clothing, and must not touch mealie meal with her hands while cooking.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: At the end of the menstrual period she smears the floor of the hut and puts
    on ordinary clothing; the passage identifies this return as an aggregation rite.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Northern clans, when a woman does not conceive, a goat is killed and parts
    of its skin and body are used in a rite for the sterile woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The sterile woman wears a goat-skin piece with openings for head and arms,
    with the astragalus visible on her breast, and fixes the gall-bladder in her hair
    for a time.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage states that, in Thonga intuition, children are given by the gods,
    and links this idea to sacrifice in cases of sterility.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Native doctors are said to have drugs against sterility, and a special porridge
    for a sterile woman is named.
  category: object
  evidence_refs:
  - ev:4
- id: obs:10
  text: Sterility can lead to divorce; the husband may send the wife home, though
    her parents may provide a younger girl, called nhlampsa, as a second wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: For a first pregnancy with swelling breasts, a physician makes incisions near
    the breast and legs, draws blood, and the pregnant woman drinks a decoction to
    remove blood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Pregnancy is said not to be a tabooed period, and sexual relations during
    pregnancy are allowed or recommended, though additional taboos apply in view of
    birth.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: A pregnant woman must kneel to drink water, keep her belly bare, avoid wrapping
    her dress over her shoulders, avoid very hot sauce, and not prepare the ntehe
    before birth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: A pregnant woman must not eat pigeon meat, lest she have no milk, and must
    not look at a monkey, lest the child resemble it.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Miscarriage is feared because it involves uncontrolled blood effusion, described
    as a serious taboo.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: The discharged foetus must be buried in wet soil; otherwise rain will not
    fall and the polluted country will be dried by hot winds.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: In times of drought, a rite called mbelele searches graves of prematurely
    born children and throws their contents into mud near the river.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: A woman who has had a miscarriage is impure for at least three months, until
    menses have occurred two or three times and cleansed her before sexual relations
    resume.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: A footnote describes a Pedi practice in which clothing pieces from husband
    and wife are placed near a large spider's nest to see which piece the spider carries
    down, thereby indicating which spouse is at fault for sterility.
  category: action
  evidence_refs:
  - ev:11
