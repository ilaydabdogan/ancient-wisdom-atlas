canonical_text:
  quote: ''
  summary: The passage describes Thonga rules around menstruation, sterility, pregnancy,
    miscarriage, and related taboos. It includes menstrual seclusion and return to
    ordinary life; a Northern-clan sterility sacrifice involving a goat skin, astragalus,
    and gall-bladder; social consequences of sterility; first-pregnancy blood-removal
    treatment; pregnancy taboos concerning water, clothing, hot food, pre-birth preparation,
    pigeon meat, and monkeys; and miscarriage pollution linked to drought, wet burial,
    and a drought rite involving premature-child graves. A footnote describes a Pedi
    spider-based method for determining whether sterility lies with husband or wife.
  language: English
  quote_policy: summarized
