canonical_text:
  quote: ''
  summary: In the introduction, the author dedicates the work to James Bryce, explaining
    that Bryce’s remarks about the value of documenting ancestral customs inspired
    systematic ethnographic study. The author describes a shift from entomology to
    collecting Ronga and Thonga materials, recounts a failed attempt to obtain comparative
    Zulu information about witchcraft, and argues that his Thonga informants are reliable
    while acknowledging possible errors.
  language: English
  quote_policy: summarized
