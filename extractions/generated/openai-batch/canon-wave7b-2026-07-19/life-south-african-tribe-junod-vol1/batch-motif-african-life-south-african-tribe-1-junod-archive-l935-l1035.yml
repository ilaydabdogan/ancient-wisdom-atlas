canonical_text:
  quote: ''
  summary: 'The passage gives one Hlengwe legendary tradition: Tshauke, described
    as first king, marries a daughter of a Sono chief; the Sono know cooking while
    the Hlengwe lack fire and eat raw porridge; Tshauke''s son steals a glowing cinder
    from the Sono, carries it in a big shell, and the Hlengwe later defeat the angered
    Sono after eating cooked food. The son is named Shioki-shahumba, glossed as the
    one who brings fire in a shell, and the tradition is connected by the author with
    the name of the first man Likalahumba. The passage then discusses earlier inhabitants,
    newcomer conquest, royal genealogies, their limits, and Portuguese reports from
    1554 naming rivers and chiefs.'
  language: English
  quote_policy: summarized
