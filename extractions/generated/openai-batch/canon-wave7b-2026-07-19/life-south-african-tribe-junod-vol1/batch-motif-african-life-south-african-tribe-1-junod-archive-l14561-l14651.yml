canonical_text:
  quote: ''
  summary: The passage describes bukanye/luma feasting in which drinking begins only
    after the proper chief has first performed the rite. The feasts include intoxication,
    dancing, songs, temporary relaxation of ordinary rules, and the delivery of liquor
    tribute to the chief. Women carriers sing praise songs comparing Mzila to a hawk
    or mythical lightning bird. The chief later visits villages for final feasting
    as the season turns. Among the Nkuna, the new-year/first-fruits rite involves
    a special pumpkin cooked with rain-making medicine, the chief eating first, a
    drum, rain-medicine horns, and the opening of the harvest after the rite.
  language: English with Thonga/Ronga terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A petty chief of a district must begin the luma rite in the presence of his
    subjects before people in the villages may drink freely.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the restriction is lifted, bukanye drinking continues day and night,
    with songs, dances, intoxication, and younger men running with sticks bearing
    red cloth pennants while seeking full barrels.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says bukanye beer contains little alcohol, but that the large
    quantity drunk can cause intoxication; the nunge variety is described as stronger.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: During bukanye, the passage reports many cases of adultery and suspension
    of ordinary behavioral taboos, while also saying the license does not reach the
    level of general promiscuity attributed to the Ba-Pedi after circumcision school.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During the feasting period, each petty chief sends people to the capital with
    brimming jars of liquor for the chief in an act called lumisa hosi.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A counsellor receives the women carriers before they enter the capital and
    takes a couple of jars; the chief returns one or two jars to the carriers and
    keeps the rest for court guests.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Women carrying makanye to Muzila sing a chorus that asks who the hawk is and
    answers that it is Mzila.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says carriers' songs praise chiefs and that Mzila is compared
    with a mythical lightning bird or a hawk swooping from the clouds.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the nsungi final feasting, the chief visits villages where beer is prepared
    for him, and dancing and singing accompany his acclamation.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The seasonal setting includes over-ripe makanye, a new moon called sibandlela,
    roads or paths becoming hard to pass because of tall rainy-season grass, and the
    approach of winter.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Among the Nkuna, the luma rite called eating the new year uses a special pumpkin
    cooked at the capital with rain-making medicine; the chief eats first in the evening,
    marks the big drum with a cross sign, and the drum is beaten to call the people.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Nkuna men bring horns holding rain medicine, eat a little, and smear the horn
    openings with medicine so that the horns also eat the new year; after this everyone
    may enjoy the harvest.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage says that if someone precedes the chief in eating, it would be
    fatal to the chief or make him ill, and Mankhelu reports that formerly the oxen
    of a man who stole the new year were taken.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: Mankhelu says that the first-fruits feast no longer exists and attributes
    its disappearance to white people.
  category: speech
  evidence_refs:
  - ev:10
