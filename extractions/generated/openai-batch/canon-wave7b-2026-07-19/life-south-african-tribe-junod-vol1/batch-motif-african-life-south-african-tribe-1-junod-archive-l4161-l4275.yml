canonical_text:
  quote: ''
  summary: The passage describes portions of a Thonga wedding feast as remembered
    from an earlier period when lobolo was paid in hoes. Relatives carry the hoes
    to the bride's village, where a mock assault and obstruction occur at the village
    fence. The hoes are displayed and counted before witnesses, beer is shared, a
    goat is slaughtered at the bride's mother's hut, the hidden bride is brought out
    under a cloth, and the two families exchange ritual insults with dance. The wedding
    pair sit on mats while the father performs a sacramental act with material from
    the goat's paunch and addresses the ancestors, asking them to accompany and bless
    the bride in married life.
  language: English
  quote_policy: summarized
