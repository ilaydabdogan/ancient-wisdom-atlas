  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The bridegroom's family and the bride's family stand on opposite sides and
    exchange accusations and mocking comments about the bride, the groom, and the
    families.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Participants may throw half-ruminated material from the goat's stomach at
