  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; short excerpt.
- id: ev:7
  type: summary
  locator: 14073-14079
  quote_or_summary: The Nkuna mbhulo Nwantikalala is kept by the Mushwane house; Papalati
    is responsible for it; it consists of four named calabashes, two male and two
    female, with bones consulted to choose which to use.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; summarized evidence.
- id: ev:8
  type: summary
  locator: 14079-14087
  quote_or_summary: Nwantikalala is mixed yearly with first fruits in luma; in wartime
    it is used to fence the country by smearing river stones with powder and placing
    them on roads and crossways at boundary drifts.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; summarized evidence.
- id: ev:9
  type: summary
  locator: 14087-14092
  quote_or_summary: Weapons are sprinkled with a decoction of the royal medicine,
    the chief receives it to prevent disease, and selling it to the Pedi chief Sikororo
    was treated as high treason.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; summarized evidence.
- id: ev:10
  type: summary
  locator: 14093-14099
  quote_or_summary: In the Mazwaya clan the royal medicine is called nyokwekulu; Mboza
    reported attending its preparation in 1893 before war scattered the clan.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; summarized evidence.
- id: ev:11
  type: summary
  locator: 14100-14109
  quote_or_summary: Nyokwekulu is renewed yearly; only Godlela, hereditary royal magician
    and priest of the Tlhatlha house, knows its composition; he is feared and may
    curse even the chief; his father Malubatilo held the office before him.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; summarized evidence.
- id: ev:12
  type: quote
  locator: 14110-14115
  quote_or_summary: 'When a successor takes the office, headmen box his ears and say:
    ''You will be the master of the medicine! Take great care of it.'''
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; short excerpt.
- id: ev:13
  type: summary
  locator: 14116-14122
  quote_or_summary: At the right time, the chief consults the bones and sends messengers
    to fetch a forked nkonono branch called shiphandje for hanging the medicine calabash.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; summarized evidence.
- id: ev:14
  type: summary
  locator: 14123-14131
  quote_or_summary: Godlela leads the return, four men carry the shiphandje behind
    him, and companions may enter villages and take fowls because the forked branch
    of the chief's great medicine is taboo.
  source_text_path: texts/public-domain/african-bantu/project-gutenberg/life-south-african-tribe-junod-vol1.md
  rights_note: Public domain source; summarized evidence.
