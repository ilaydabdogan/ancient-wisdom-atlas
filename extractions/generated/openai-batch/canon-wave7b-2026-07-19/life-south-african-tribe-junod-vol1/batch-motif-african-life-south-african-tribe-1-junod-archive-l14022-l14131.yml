canonical_text:
  quote: ''
  summary: 'The passage describes Thonga/Tsonga royal regalia and clan medicines:
    the Nkuna copper bracelet ritlatla and its reported self-moving power; an elephant
    tusk token of submission; a royal hair bun and a smoke-kept stick associated with
    warfare and invisibility; the Nkuna mbhulo medicine Nwantikalala with four sexed
    calabashes used in first-fruits rites, boundary protection, weapon sprinkling,
    and the chief''s health; and the Mazwaya nyokwekulu medicine, prepared by a hereditary
    royal magician-priest through annual rites that include fetching a forked nkonono
    branch under taboo conditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Nkuna, the chief possesses a large copper bracelet called ritlatla,
    with reported origins either in exchange at Lourenco Marques or in locally worked
    copper or gold.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ritlatla had belonged to the elder branch under Hoshana, was brought to
    chief Shiluvane after Hoshana's death, and was retained by Shiluvane with the
    chieftainship and left to Muhlaba.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Legends say the ritlatla can move of its own will when buried unless a piece
    of iron is placed inside it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Another Nkuna royal property was an elephant's tusk brought by vanquished
    enemies as a token of submission.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: In Nondwana, old chief Papele wore a plaited hair bun called shifoko as a
    sign of royalty.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: A long stick called ntjobo or mbamba was kept in the smoke of the royal fire
    in the sacred hut of nyokwekulu and was taken outside when the army assembled.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The ntjobo or mbamba was said to have the power of becoming invisible to enemies.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Each clan possessed a special medicine called mbhulo or mphulo whose possession
    was said to make the chief invincible, warriors invulnerable, and the country
    unconquerable.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Nkuna mbhulo, called Nwantikalala, is kept by the people of the Mushwane
    house, with Papalati responsible for it.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Nwantikalala consists of four named calabashes, two male and two female, and
    bones are consulted to determine which calabash is to be used.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: Every year the medicine is mixed with first fruits in the luma ceremony.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In war time envoys use mbhulo to fence the country by smearing river stones
    with magical powder and placing them on roads and crossways at boundary drifts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Weapons are sprinkled with a decoction of the royal medicine, and the medicine
    is also given to the chief to prevent disease.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Selling some of the national drug to the Pedi chief Sikororo was described
    as an act amounting to high treason.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: In the Mazwaya clan, the royal medicine is called nyokwekulu, and Mboza reported
    witnessing its preparation in 1893.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: The nyokwekulu is renewed yearly, and its composition is known only to Godlela,
    the hereditary royal magician and priest.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:17
  text: Succession to the medicine office passes first from an elder brother to a
    younger brother and then, after the brothers are dead, to the sons.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: At the proper time the chief consults the bones and sends messengers to fetch
    a forked nkonono branch called shiphandje, from which the medicine calabash will
    hang.
  category: action
  evidence_refs:
  - ev:13
- id: obs:19
  text: Godlela leads the return procession with four men carrying the shiphandje,
    and companions have the right to enter villages and take fowls because the branch
    of the chief's great medicine is taboo.
  category: action
  evidence_refs:
  - ev:14
