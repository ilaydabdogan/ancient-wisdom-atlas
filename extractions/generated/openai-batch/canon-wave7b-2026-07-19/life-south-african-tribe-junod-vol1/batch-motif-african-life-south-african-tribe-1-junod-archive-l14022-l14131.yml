candidate_motifs:
- id: motif:1
  label: Royal legitimacy vested in regalia and inherited sacred objects
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage links chieftainship to the ritlatla, identifies the shifoko hair
    bun as a sign of royalty, and describes royal properties such as the elephant
    tusk and ntjobo or mbamba.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage is ethnographic description rather than a single mythic narrative.
- id: motif:2
  label: Royal medicine conferring invincibility and territorial protection
  taxonomy_refs:
  - royal_legitimacy
  basis: The clan medicine mbhulo or mphulo is said to make the chief invincible,
    warriors invulnerable, and the country unconquerable; Nkuna rites use it to protect
    boundaries, weapons, and the chief.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The account reports attributed magical virtues; it does not narrate a
    completed battle outcome in this passage.
- id: motif:3
  label: Self-moving sacred or royal object restrained by iron
  taxonomy_refs: []
  basis: The ritlatla is said to move of its own will when buried unless iron is placed
    inside it.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage labels this as a legend about the object, with no broader
    comparative frame supplied.
- id: motif:4
  label: Annual renewal and first-fruits use of royal medicine
  taxonomy_refs:
  - seasonal_cycle
  basis: The Nkuna medicine is mixed yearly with first fruits in luma, and the Mazwaya
    nyokwekulu is renewed each year.
  evidence_refs:
  - ev:8
  - ev:11
  confidence: medium
  cautions: The full first-fruits ceremony is deferred to a later description, so
    this passage gives only a partial account.
- id: motif:5
  label: Hereditary ritual specialist installed as master of medicine
  taxonomy_refs:
  - initiation
  basis: The medicine office passes hereditarily; headmen box the successor's ears
    and tell him to become master of the medicine and care for it.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The rite is an office succession or installation; classification as initiation
    is provisional.
- id: motif:6
  label: Taboo procession with licensed taking of goods
  taxonomy_refs:
  - sacred_theft
  basis: Those accompanying the forked branch of the chief's medicine may enter villages
    and take fowls because the branch is taboo.
  evidence_refs:
  - ev:14
  confidence: low
  cautions: The passage describes ritual license to take goods, not a mythic theft
    of a sacred object.
comparison_claims:
- id: claim:1
  claim: The Nondwana ntjobo or mbamba may be functionally comparable to the Tembe
    mhamba as a venerated clan object used in relation to collective danger or propitiation.
  claim_level: same_function
  target: Tembe mhamba
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: low
  limitations: The passage itself says only that the object is 'perhaps' similar;
    details of the Tembe object are summarized briefly and no direct historical link
    is provided.
- id: claim:2
  claim: The Nkuna Nwantikalala and Mazwaya nyokwekulu belong to the same local pattern
    of clan royal medicines guarded by designated custodians and used for political
    or protective efficacy.
  claim_level: same_function
  target: Nkuna Nwantikalala and Mazwaya nyokwekulu royal medicines
  evidence_refs:
  - ev:6
  - ev:7
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage gives fuller ritual details for Mazwaya than for Nkuna
    and does not state that the two medicines have identical composition or rites.
