canonical_text:
  quote: ''
  summary: The passage describes sanctions for encouraging resistance to the chief’s
    court, answers questions about offices and ritual functions of chiefs, notes delegated
    military and ritual roles, mentions retained nails and hair of a predecessor for
    mhamba, describes a clan divination gathering called nyiwa to protect the chief,
    gives a proverbial couplet about the thief as a hawk burned while trying to take
    roasting meat, and states customs concerning incapacity, death, family worship
    of deceased chiefs, absence of mock kings, and temporary custodianship after a
    chief’s death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who supports a condemned man and encourages him to oppose a Court
    decision is beaten with a shambock on the capital square and may also pay a fine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says there are no separate chiefs for war and peace; in wartime
    the great induna directs military operations as commander-in-chief.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The chief is said never to be required to marry his own sister or daughter;
    the passage mentions a separate similar case in which a hunter must have sexual
    relations with his daughter before a hunting trip.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king’s mother is said not to hold a special office.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The chief keeps no portion of a deceased predecessor except nails and hair
    used for mhamba.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Diviners sometimes call the whole clan together to discover and eventually
    arrest people who might bewitch and kill the chief; the gathering is called nyiwa.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The chief generally performs no religious functions, which are conducted by
    elders; rainmaking is assigned to rain doctors or to mbelele ceremonies.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A couplet describes the thief through images of a rounded crown on a hut and
