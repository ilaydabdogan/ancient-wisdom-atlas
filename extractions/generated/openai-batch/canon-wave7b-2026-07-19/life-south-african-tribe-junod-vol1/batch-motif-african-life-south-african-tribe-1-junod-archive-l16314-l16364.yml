  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The chief is not held responsible for public calamities; if his bodily or
    mental powers fail, the tinduna discuss matters in his stead and he is not deposed.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: Chiefs are not worshipped during life; after death they are deified for their
