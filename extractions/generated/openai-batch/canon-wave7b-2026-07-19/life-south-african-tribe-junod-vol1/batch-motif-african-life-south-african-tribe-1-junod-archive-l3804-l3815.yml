  quote: ''
  summary: The passage reports and challenges Dudley Kidd's claim that African native
    mental development is arrested at puberty. The author allows that some boys may
    show decreased vivacity or slowed psychical development around fifteen or sixteen,
    but says this is not the rule, citing pupils aged sixteen to twenty who show zeal
    for study and increased intellectual power, and noting that Dr Mac Vicar of Lovedale
    also considered Kidd's assertion exaggerated.
