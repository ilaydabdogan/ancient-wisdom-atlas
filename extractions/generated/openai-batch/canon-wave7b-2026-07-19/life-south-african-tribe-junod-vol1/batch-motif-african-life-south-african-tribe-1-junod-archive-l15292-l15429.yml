canonical_text:
  quote: ''
  summary: 'The passage describes court personages at a Thonga chief''s court: counsellors
    in several grades, young favourites or messengers, and the herald. Counsellors
    assist and sometimes restrain the chief; some serve military, diplomatic, or district
    judicial functions. Favourites are young companions without official authority.
    The herald wakes the chief before sunrise with praise of royal ancestors, praise
    imagery for the chief, and disparaging exhortation. The passage also notes Zulu
    linguistic and procedural influence in some terms and customs.'
  language: English
  quote_policy: summarized
