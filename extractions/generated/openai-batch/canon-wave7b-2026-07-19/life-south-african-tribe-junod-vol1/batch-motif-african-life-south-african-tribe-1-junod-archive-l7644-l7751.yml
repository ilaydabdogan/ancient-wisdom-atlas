canonical_text:
  quote: ''
  summary: The passage describes widow purification practices, a year of widowhood
    before inheritance adjudication, divinatory preparation for a beer feast, mourning
    songs addressed to Heaven as King, a beer offering at the deceased's grave, and
    the subsequent assertive conduct of maternal nephews at the ceremony.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A purification procedure is described in which a fire is made in a hut, two
    pills of purifying medicine are placed in it, limbs are exposed to the smoke,
    and the fire is then put out with the participants' own water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the purification act, sexual relations are said to be possible without
    harm, though time must pass before the inheritance adjudication.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The narrator says the older Ba-Ronga form of lahla khombo had changed around
    Lourenço Marques, while the rule of casting away the malediction in the bush remained
    obligatory in cases involving phthisis, leprosy, or twins.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old widows who cannot find lovers may be purified by drugs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Widows remain in the old kraal for a year of ploughing, leave dry mealie sticks
    in their fields as a visible sign, and the harvest belongs to the new husband.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The inherited woman's marriage is not finally settled until the adjudication
    of the inheritance.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Before the adjudication ceremony, mealies and small cobs are collected for
    beer, the family council assembles, and divinatory bones are consulted to determine
    whether and how the ceremony should proceed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Relatives gather at the mortuary village; women pound the softened mealies
    and sing songs of mourning, including one addressed to a King whom the narrator
    identifies as Heaven.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'The first ceremony of the day is called a sacrifice on the grave: the master
    of the mourning brings beer to the grave, prays to the deceased for peace and
    understanding, pours some beer into the deceased''s cup on the grave, and the
    nephews drink the rest.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the grave offering, the nephews become bolder, steal another pot of
    beer, insult the masters of the village, threaten to leave with their wives, and
    are urged by old men not to spoil the feast.
  category: sequence
  evidence_refs:
  - ev:8
