canonical_text:
  quote: ''
  summary: The passage describes funerary treatments and taboos for infants, older
    children, suicides, women dying during pregnancy or confinement, lepers, ordinary
    people, ruling-family members, graves, sacred burial woods, and atonement after
    fire damages a sacred wood.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An infant who dies before presentation to the moon must be buried in a broken
    pot placed in the earth with a partly ash-covered opening that leaves an air passage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An older child is buried ordinarily with few ceremonies; the mother alone
    attends, while the father digs the grave and performs no further act.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father says that men who hold the assagai do not bury such little ones
    and calls them water, a womb, and a ntehe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In a suicide case, the corpse is buried by ordinary rules, but the hanging
    tree is cut down and its wood is not used for fuel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a woman dies during pregnancy, her body must be cut open in the grave before
    burial is completed in order to determine the child’s sex and let the air come
    out.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that burial of a pregnant woman without this precaution
    is a great taboo because she might become a god of bitterness.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Maluleke clan, women who die pregnant or in confinement are cremated.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lepers alone are buried in the hut; ordinary people in Maputju are buried
    in front of the hut, while in other Ronga areas the usual place is behind the
    hut.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Members of the reigning family are buried in the ntimu, a sacred wood belonging
    to them; large families may have a ntimu with village-specific burial places.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The bones of the dead are never disinterred, graves are respected, and women
    avoid tilling over them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Old graves may appear as dense bushes within mealie gardens with broken pots
    under the branches.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: If a bush fire damages a sacred wood, the person who lit it must atone by
    sacrificing a fowl to quench it.
  category: action
  evidence_refs:
  - ev:9
