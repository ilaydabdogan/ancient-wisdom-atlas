  summary: The passage describes the chief's village or capital as a distinct royal
    settlement with a public men's square, a strong enclosure, restricted quarters
    for queens, tabooed back entrances, morning attendance by men who pay respects
    to the chief, and beer brought to the capital by women when crops are good.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each chief is described as the center of a court, though royalty is said to
    make little display among the Ba-Ronga.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The chief's residence is not called an ordinary hamlet but ntsindja, translated
    as "the capital," and is generally larger than ordinary villages.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The capital is built by the young men of the tribe after the chief's marriage,
    and they keep it repaired, including keeping the public square clean and weeded.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Tembe capital is described as surrounded by a high, thorny, circular fence,
    stronger than those of ordinary kraals.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The inside of the fenced capital is divided into a front part entered by the
    main gate and a back part containing the huts of the queens.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: The front part is the square, called hubo and bandla, with shady trees under
    which visitors sit.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: The queens' huts are separated from the square by a high reed wall with only
    a few narrow entrances, and male access to this area is called taboo.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Behind the queens' huts are two passages between arranged poles, one toward
    the pig-sties and one toward the bush; these were said to provide an exit for
    the queens in case of war.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:9
  text: The back entrances, identified as the queens' psiruba, are said to be taboo
    in the royal kraal.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Men of the neighborhood meet in the square in the morning, pay respects to
    the chief, sit in groups, and discuss daily news.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Attendance at the square is called ku ya bandla, explained as going to the
    men's square.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The square is said to welcome not only members of the reigning family but
    also members of clans conquered by the current chiefs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: When crops have been good, women frequently bring brimming jars of beer made
    from maize or millet to the capital.
  category: action
  evidence_refs:
  - ev:6
