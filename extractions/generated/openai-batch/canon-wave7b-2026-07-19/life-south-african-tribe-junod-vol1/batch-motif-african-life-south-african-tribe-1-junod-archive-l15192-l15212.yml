canonical_text:
  quote: ''
  summary: 'The passage describes succession after Dambuze’s death: his son Gwaba
    was installed but then deported, and Gwaba’s sister Midambuze took the position.
    It notes her special marriage status, her choice of a common-origin husband, and
    the possible succession of her son as an exceptional uterine nephew. It also reports
    that queens were influential at Gungunyana’s court, compares this with a Zulu
    custom involving a year-long sexual taboo after Chaka’s mother’s death, and states
    that a foreigner marrying a princess cannot become the true chief but only a consort
    while the wife remains the true hosana.'
  language: English
  quote_policy: summarized
