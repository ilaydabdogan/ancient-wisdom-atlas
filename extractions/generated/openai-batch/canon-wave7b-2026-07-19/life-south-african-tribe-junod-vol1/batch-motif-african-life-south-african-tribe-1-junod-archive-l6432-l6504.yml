canonical_text:
  quote: 'death also means a passage: for the deceased, passage from the world of
    the living to the world of the dead'
  summary: The passage summarizes Thonga funeral rites as religious, purificatory,
    and social rites. It presents death as a passage for both the deceased and the
    relatives, describes rites of separation, transition, aggregation, purification,
    and the incorporation of the dead into the world of the ancestors, and ends with
    a burial reminiscence involving Christian worship and a local ancestor-invocation
    ceremony.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: 'The author states that Thonga funeral rites show three ideas: the dead person
    is immortal and becomes a god through death; death brings dangerous defilement
    to the collectivity; and the social group diminished by death must be reinforced.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author groups the rites into religious, purificatory, and social categories.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage explicitly describes death as a passage for the deceased from
    the world of the living to the world of the dead, and for the relatives from one
    life phase to another.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the deceased, separation from terrestrial life is marked by piercing the
    wall of the hut and by cutting through garments and mats.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Grave-diggers prepare an underground hut or square place, place the deceased
    in a sitting position, and direct the deceased's eyes toward the cardinal point
    from which the ancestors came.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The deceased is not prayed to before family gatherings held three, six, or
    twelve months after death; after that, the hut is crushed or closed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author suggests that the closed hut and shield before the door may mark
    incorporation in the world of the dead and prevent the deceased from returning
    and bringing misfortune.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: Relatives separate from the former phase by cutting hair, putting out the
    old fire, leaving off former clothing, and wearing mourning attire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The relatives' marginal period is marked by sexual taboos, and later ceremonies
    remove uncleanness from food, gardens, bereaved persons, grave-diggers, widows,
    and the whole community.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Sokis's burial, the narrator led worship after the grave was filled; afterward
    Sokis's youngest brother used a nkanye twig, called the ancestors to bless the
    relatives, and asked the deceased to leave them in peace.
  category: action
  evidence_refs:
  - ev:6
