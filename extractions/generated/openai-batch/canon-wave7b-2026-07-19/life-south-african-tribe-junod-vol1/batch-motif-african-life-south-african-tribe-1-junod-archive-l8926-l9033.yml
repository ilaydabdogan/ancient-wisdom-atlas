canonical_text:
  quote: ''
  summary: The passage describes Thonga/Ronga kinship relations involving the maternal
    grandfather, the maternal uncle, the uterine nephew, the maternal uncle's wives
    and children, cross-cousin classifications, sacrifice obligations, food-taking
    liberties, joking spouse-address, and widow-inheritance rights. It then begins
    a new section on relationship terms on the wife's side.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The maternal grandfather is identified as the great or true kokwana and is
    respected for age.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The maternal grandfather is lenient toward his daughter's son but would be
    hard on his son's son in the same kind of misbehavior.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a child takes too much liberty with the kokwana, the old man tells him
    to go and play with his malume.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'The malume is described as a different kind of relative for his uterine nephew:
    no respect is necessary, the nephew may take food without asking, and the malume
    gives special care and sacrifices for him when he is ill.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Ronga description, the wives of the malume call the visiting nephew
    'husband,' tell him where food is hidden, and the boy takes and eats the food
    with his companions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the malume learns the food-taking was done by his nephew, he accepts
    it and says that the nephew must not be beaten.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The nephew and malume exchange joking speech about causing famine by eating
    the food and doing it again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The malume may point to one of his wives and call her the nephew's wife; the
    woman may feast the nephew and call him husband.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The nephew may joke that the uncle should die quickly so that he may have
    the uncle's wife; the passage states that this speech is mere joking.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The nephew may take liberties with the aunt, but sexual relations with her
    during her husband's life are treated as adultery and require a high fine.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The nephew may possibly inherit the malume's wife after the malume dies, but
    she is not full property, and any children eventually belong to the malume's male
    relatives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The true malume is the mother's true brother, while her half brothers and
    the brothers of the true malume are also bamalume in a secondary degree.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The children of a mother's brother are classified differently for a boy and
    a girl; in the example, Shaputa is treated as mamana or sister in different relations
    and is also a potential wife for Mboza.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: The son of a malume may also be called malume or kokwana even if he is the
    same age or younger than his cousin, because he holds a superior position and
    has the right to offer sacrifices for his ntukulu.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Children of the mother's sister are called bamahuabu like children of the
    paternal aunt, with the explanation that they have suckled from the same breast.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: The passage distinguishes a male-line grandson, ntukulu wa shinene, from a
    female-line grandson or sister's son, ntukulu wa shisati; both are said to have
    equal right to inherit widows.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:17
  text: The passage then begins a section on the wife's side and introduces Mboza's
    wife's relatives as a complete case for nomenclature.
  category: sequence
  evidence_refs:
  - ev:10
