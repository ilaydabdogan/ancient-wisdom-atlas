  quote: '"I establish my home; I inaugurate my village"'
  summary: The passage describes the Thonga/Ronga ideal of mature married manhood
    as the founding and expansion of a household village through wives, huts, children,
    cattle, food production, and hospitality, illustrated by the prosperous man Gidja.
  language: English
  quote_policy: quoted
