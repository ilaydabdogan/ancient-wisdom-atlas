canonical_text:
  quote: ''
  summary: The passage discusses Thonga kinship, ancestor worship, and inheritance
    as evidence for an earlier mother-right alongside later father-right. It describes
    the special ritual and inheritance claims of uterine nephews, the dominance of
    paternal heirs under lobola-supported father-right, the possible chieftainship
    of uterine nephews, and the history of lobola payments using mats, baskets, rings,
    beads, and brass ornaments. A footnote compares Lower Ogowe groups where lobola
    coexists with partly preserved mother-right.
  language: English
  quote_policy: summarized
