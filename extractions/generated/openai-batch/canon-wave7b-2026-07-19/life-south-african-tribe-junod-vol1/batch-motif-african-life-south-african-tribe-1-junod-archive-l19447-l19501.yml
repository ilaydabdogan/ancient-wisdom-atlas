canonical_text:
  quote: ''
  summary: 'The passage describes Thonga/Ronga naming practices: personal-name prefixes
    and their meanings, ba-prefix names expressing bitterness among certain girls,
    names without clear prefixes or meanings, nicknames that may replace regular names,
    the example of Mbekwa becoming known as Nxoko from a repeated exclamation, descriptive
    nicknames for White people, and clan names or shibongo derived from a first known
    ancestor.'
  language: English
  quote_policy: summarized
