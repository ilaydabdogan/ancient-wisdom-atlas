canonical_text:
  quote: ''
  summary: The passage discusses Thonga war rites as a coherent system involving national
    defense around the chief, protective war medicine, taboos and marginal periods
    for the clan and warriors, departure and return rites, and special purification
    rites for slayers. It also gives a comparative Pedi example of post-battle medication
    involving human flesh, ox flesh, weapons, clay, taboo handling, vulture-like cries,
    and participation by wives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The author describes Thonga war rites as a mixture of older Thonga customs
    and newer Zulu customs, forming a complete whole.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Pedi example after the Mooudi battle, portions of a slain enemy, drugs,
    and ox flesh were cooked together, with assagais used to stir the mixture.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Pedi slayers were whitewashed with clay, came on their knees, cried like
    vultures, and took meat with their teeth without using their hands; their wives
    also participated in the meal because they were said to share contamination.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In war, the chief is described as the central and vital cell of the clan,
    and warriors gather at the call of the shipalapala to build a protecting circle
    around him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Guba ceremonies and patriotic songs are described as binding the clan to die
    for the chief, and many guba songs extol the chief.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Protective rites include sprinkling the mukhumbi with clan war medicine or
    giving each warrior some medicine to swallow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states the idea behind the war medicine as the belief that a warrior
    who has eaten a little of the enemy will become invulnerable to enemy blows.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Once war is decided by the chief, the whole clan enters a special phase marked
    by home taboos, some of which resemble those of circumcision school and mourning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the war phase, some sexual prohibitions are removed, while other sexual
    relations permitted in ordinary life become taboo.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The army’s departure rites include leave-taking from the General with shouts,
    swallowing meat without touching it with the hands, taking an emetic, and jumping
    over the ntchopfa branch called the medicine of oblivion.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The warriors’ return and their participation in the meat of captured oxen
    are interpreted in the passage as aggregation ceremonies returning them to ordinary
    life.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Slayers are described as having a worse condition than other warriors because
    murder brings defilement and danger from the mini; they are called hot and black.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Slayers undergo seclusion with alimentary and sexual taboos, purification
    rites like those of mourners and grave-diggers, and later rites separating them
    from the marginal period, including exposure of the m'njlo outside the village
    in the bush.
  category: sequence
  evidence_refs:
  - ev:7
