  quote: ''
  summary: The passage gives a short historical account of the Ronga-Portuguese war
    of 1894-1896 and the opening context of the Sikororo war of 1901. It describes
    succession disputes, alliances and refusals, battles with Portuguese forces, Gungunyana's
    flight to a sacred ancestral wood and capture, a later Ba-Ngoni revolt, and Sekhukhukhu's
    attempt to extend paramount authority through a disputed regency.
  language: English
  quote_policy: summarized
