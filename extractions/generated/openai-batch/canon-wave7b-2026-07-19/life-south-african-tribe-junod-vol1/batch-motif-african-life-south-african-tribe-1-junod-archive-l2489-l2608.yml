  quote: ''
  summary: The passage describes Thonga boys' knowledge of bush creatures and then
    surveys several boys' games involving animal impersonation, disks, sticks, teams,
    songs, mock fighting, bathing, and melodies addressed to animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boys living in the velt are described as knowing many bush creatures, their
    native names, and their habits.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage names insects and life stages observed by boys, including a caterpillar,
    a carabid beetle, a white cocoon, a green moth, and an edible beetle that boys
    roast and suck.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that Thonga boys' games are numerous and are played by
    day or in the evening, especially in moonlight.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the pig game, one child crawls while covered with a mortar and cloth, is
    followed by clapping and singing friends, receives food from households through
    the group, and may suddenly attack the followers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the nsema game, a woven grass disk is rolled and opponents try to pierce
    it with sticks before it falls; after the disk is spoiled, the two sides exchange
    cudgelling and then bathe together in a pool.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the little-elephant game, a boy ties a grass disk to a palm-fibre string
    and hides while comrades try to pierce or tear the disk from the string; he may
    chase and beat them with a stick.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the homane game, a hard round palm fruit is used as a ball and is hit with
    sticks toward an opposing camp.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the tlumba holwane game, a stick with charcoal on it is planted in the
    ground, and a player hops like a frog while moving it to his own ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the beetle game, one child marked with a handkerchief enters a hole in
    the sand, is covered with earth, remains still, and is sung to by comrades.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the honey-pitcher game, children in two rows clasp hands and swing a child
    lying on their arms while singing the same song used in the beetle game.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the huge-back game, children form a circle around a central player who
    hunches his back and tries to break out through or under the circle.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Children sing melodies to animals; the passage gives an example of goatherds
    shouting in honor of oxen, with girls also joining and pointing out the wagon
    to babies.
  category: speech
  evidence_refs:
  - ev:11
