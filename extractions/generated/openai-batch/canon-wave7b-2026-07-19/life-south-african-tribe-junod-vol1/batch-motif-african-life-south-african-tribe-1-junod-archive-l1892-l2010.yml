canonical_text:
  quote: ''
  summary: The passage lists uses of Thonga calabashes, then describes infant feeding
    when the mother is absent, dentition customs involving beads, teeth, the ash-heap,
    tooth omens, and lost-tooth formulas, a first hair-cutting custom, and the presentation
    of a child to the new moon as part of the nursing period.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Small calabashes are used for medicinal powders; medium calabashes for milombyana;
    long-handled calabashes are used as bottles or for drinking.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that babies may be fed with goat's or cow's milk, and that
    not adding water is associated with later death from enteritis.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes cases where another woman, including a co-wife, nurses
    a child whose own mother cannot do so, and one foster mother claims compensation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A named grandmother, Mishidohi, is said to have prepared light beer and other
    food, secreted milk in her own breast, and saved the boy Mayimbule after his mother
    died.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the child has cut the lower and upper incisors, the mother ties a white
    bead to one hair above the child's forehead.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The white bead is said to help the other teeth come out normally; without
    it, the child is said not to become intelligent and to show abnormal mouth and
    facial behavior.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: When all the teeth are cut, the bead is removed and thrown on the ash-heap
    behind the hut.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Children's teeth are figuratively called hobe, a term also used for a white
    grain of pounded maize resembling a tooth.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Cutting the upper teeth first is described as a bad omen; among Northern clans
    and especially Ba-Pedi it is called a great taboo, while among Ba-Ronga it is
    less serious.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: For a child who cuts upper teeth first, the passage says that at death the
    child must be buried in wet soil in the Northern/Ba-Pedi context.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When a child loses a first tooth, he is instructed to go to the ash-heap,
    put a finger into the tooth-hole, ask the grandfather for a grain of maize, throw
    the tooth over the shoulder onto the ashes, and return home without looking backward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Looking backward after throwing the tooth is said to prevent the grandfather
    from giving a new tooth.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: When a younger brother cuts his teeth, they are considered as pushing away
    or pulling the teeth of the elder brother.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the first hair cutting, the mother sprinkles drops of her milk on the child's
    forehead and occiput, cuts the hair, and throws it into thick grass.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The mother, when cutting her own hair, leaves a band on both sides of the
    head until the child can walk.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: 'Three carefully observed rites are said to divide the nursing period: presentation
    to the moon after three months, tying of the cotton string after one year, and
    weaning ceremonies.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The new moon is greeted by Ba-Ronga with a shouted exclamation repeated from
    village to village.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: Each moon or month is described as new, with the old one having died.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:19
  text: For the presentation to the moon, after the mother has resumed menses, she
    washes garments, puts on new clothing, and proceeds to the yandla ceremony.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:20
  text: On the day the new moon appears, the mother carries a torch or firebrand while
    the grandmother carries the child to the ash-heap behind the hut.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:21
  text: At the ash-heap, the mother throws the burning stick toward the moon, and
    the grandmother flings the child into the air while saying, 'This is your moon.'
  category: action
  evidence_refs:
  - ev:11
- id: obs:22
  text: After the child is put on the ashes and cries or rolls in the dirt, the mother
    snatches the child up, nurses him, and returns home.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:23
  text: The yandla ceremony is said to open the child's chest; otherwise the child's
    ears would die and the child would remain stupid.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:24
  text: The passage states that the yandla marks progress and entrance into a new
    phase of the child's existence.
  category: attribute
  evidence_refs:
  - ev:12
