comparison_claims:
- id: claim:1
  claim: The passage supports a cautious same-motif comparison between Ba-Pedi/Northern-clan
    and Ba-Ronga beliefs about upper teeth cutting first as an ill omen, while also
    noting different degrees of severity.
  claim_level: same_motif
  target: Northern clans and Ba-Pedi compared with Ba-Ronga dentition omen practice
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the brief ethnographic statement in this
    passage and does not establish historical contact or origin.
- id: claim:2
  claim: The author's footnote supports a cautious same-function comparison between
    the Thonga lost-tooth ash-heap rite and a Neuchatel childhood warning about not
    letting a broken tooth be found by a dog; both regulate the handling of a child's
    lost tooth in relation to the replacement tooth.
  claim_level: same_function
  target: Neuchatel childhood broken-tooth warning in the author's comparative footnote
  evidence_refs:
  - ev:6
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is explicitly anecdotal and functional; it does not
    show common inheritance, contact, or identical symbolism.
