  - ev:6
  confidence: high
  cautions: This is an ethnographic life-cycle practice; no broader mythic taxonomy
    reference is asserted.
- id: motif:2
  label: Irregular tooth sequence as omen or taboo
  taxonomy_refs: []
  basis: Cutting upper teeth first is explicitly called a bad omen or taboo, with
    a burial requirement in one group context.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage reports local severity differences and does not explain a
    narrative origin.
- id: motif:3
  label: Child presented to moon as entrance into a new life phase
  taxonomy_refs:
  - initiation
