canonical_text:
  quote: ''
  summary: The passage proposes rules for renouncing lobola claims, describes lobola
    as collective property that can attract claims from relatives or heirs, recounts
    a case in which the evangelist Zebedea urges Tumben to renounce a lobola claim
    while paying his own lobola debt, and then surveys polygamy among the Thonga with
    a tentative hypothesis connecting it to group marriage.
  language: English
  quote_policy: summarized
