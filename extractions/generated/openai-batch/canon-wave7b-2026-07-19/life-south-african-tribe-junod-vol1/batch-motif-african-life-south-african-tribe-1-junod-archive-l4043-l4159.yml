canonical_text:
  quote: ''
  summary: The passage describes the koroka betrothal visit by girls to the fiancé's
    village, including formal dress, ritualized reluctance to enter, hospitality,
    gifts, service tasks for the fiancé's family, and knotting grasses at departure.
    It then lists betrothal-period taboos involving corn, beer, rain, monkey nuts,
    black fish, honey, and fowls, with explanations for several taboos. The passage
    states these are familial taboos of allied families rather than marginal-period
    taboos. It also outlines the wedding feast as lobola and tlhoma, and describes
    preparations for the lobola feast, especially beer brewing, the bridegroom's arrival
    with a goat, concealment of the bride, and verification of the lobolo.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The koroka of the girls is presented as corresponding to the tjekela of the
    boys and is described as a betrothal visit to see the husband.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The girls wear their finest attire, including red and white cloth, bead crowns
    in curled hair, and twisted iron-wire bracelets on ankles and wrists.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the appointed day, the girls sit outside the fiancé's village and cough
    to announce their presence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The damsels make difficulties, and the young men must beg them to enter the
    village, enter the hut, sit on mats, and accept food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Each groomsman attends to the girl he chose at the preceding meeting and generally
    gives her a fowl or equivalent money to gain goodwill.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the early morning, the visiting girls fetch water, warm it, and pour it
    into basins before hut doors for the village inhabitants' ablutions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'The visiting girls perform feminine work for the fiancé''s parents: removing
    ashes, cutting wood for the young men''s mothers, and lighting village fires.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The visitors pretend to leave at sunset, stay another night, go home the following
    day with the young men, and knot grasses together at parting.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Decisive arrangements for the wedding are made on the day of the koroka.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The two families entering a marriage relation must observe taboos during the
    tjekela and koroka visits.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Visitors must leave a few grains on a mealie spike, must not tear off the
    leaves around the spike, and must leave some liquid in the beer pot.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: A person who has gone to tjekela must not return home in rain but must wait
    for fine weather, otherwise it is considered an insult to the future father-in-law.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: When eating monkey nuts during the visit, the thin skin covering the kernel
    must not be removed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The suitor, called the owner of the oxen, must not eat black fish that day
    because the desired girl might slip through his hands like a fish and because
    the fish's blackness might bring darkness or unhappiness.
  category: other
  evidence_refs:
  - ev:5
- id: obs:15
  text: The suitor must not eat honey because honey slips or flows.
  category: other
  evidence_refs:
  - ev:6
- id: obs:16
  text: The suitor must not eat fowls because cocks and hens scratch and scatter soil,
    and the marriage might likewise be scattered before it is ripe.
  category: other
  evidence_refs:
  - ev:6
- id: obs:17
  text: The passage states that these betrothal taboos are familial taboos dictated
    by mutual distrust between allied families, not proper taboos of a marginal period.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:18
  text: The wedding feast is divided into the lobola feast at the bride's village
    and the tlhoma, the bringing of the bride to the bridegroom's village.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:19
  text: The bride's family must prepare beer in advance for the feast, using mealie
    seeds, water, pounding, millet yeast, and boiling.
  category: action
  evidence_refs:
  - ev:9
- id: obs:20
  text: The bridegroom goes with friends to his future parents-in-law, brings a goat,
    does not find the bride because she has been hidden nearby, and later his family
    verifies that the lobolo is complete before starting.
  category: sequence
  evidence_refs:
  - ev:10
