  quote: ''
  summary: The passage describes evening cooking and meal distribution, women's continuous
    household and agricultural labor, men's intermittent agricultural, construction,
    cattle, craft, hunting, visiting, debt-claiming, and discussion activities, and
    introduces adult games with men's beer drinking as a favorite pastime.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cooking is described around smoke, hearth pieces, dead wood, pots, and flour
    being cooked over fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the evening, the lady of the house places food on plates or dishes and
    distributes it among the village inhabitants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the meal, women wash plates, set aside pots containing food for the
    next morning, and tidy the yards.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Women are said to have a well-filled day, to do regular food preparation and
    child care, and to be rarely seen playing in daytime.
  category: attribute
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: Men's duties are described as less continuous than women's and as requiring
    isolated efforts from time to time.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among the Ronga, each man has his own field, called mpashu, which he tills
    and may sow, while his wife weeds and reaps it; he also cuts sorghum ears.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Men assist in food conservation by building storehouses, preparing drying
    mats for groundnuts, and digging holes for the seed-basket shelf.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: After harvest, a wife prepares special beer to thank her husband for help
    and to notify him that the grain has been harvested; the mealies are said to belong
    to him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Men's main work is said to be building and repairing huts, including re-thatching
    roofs every third or fourth year during winter months.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: 'Cattle care is assigned to males: boys milk cows and repair the kraal, little
    boys herd goats, and young men herd oxen.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Men make most village utensils and tools except pots and crockery, and also
    make the ntehe for wives or sisters after childbirth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Hunting and fishing are described as men's work or pastime, with hunting formerly
    a trade for some men.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Men spend much time visiting relatives or friends and also travel to claim
    debts, including claims involving cattle.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Discussions of affairs occur in the village square, and adult games are introduced
    with the statement that men's favorite pastime in South Africa is drinking beer.
  category: sequence
  evidence_refs:
  - ev:10
