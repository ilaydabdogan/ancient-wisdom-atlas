canonical_text:
  quote: ''
  summary: The passage describes early child care, the boha puri or boha nshale rite
    performed when a Thonga child begins to crawl, the tying of a cotton string around
    the child's waist, associated parental and burial taboos, regional variants, the
    narrator's explanation of the rite as social aggregation, and the beginning of
    the section on weaning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When the child becomes firmer, the mother seats the child in a small hole
    in sandy soil and seeks an elder sister or cousin girl to care for the child while
    she works.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the child begins to crawl, a rite is performed that the narrator says
    appears to be practiced across the tribe, with greater importance in Northern
    clans than among the Ba-Ronga.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The puri is described as a cotton string tied around the child's waist when
    the child begins to crawl, or even before.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The father and mother set the day for the rite, and grandparents may remind
    them of the law if they forget.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The parents are required to have intercourse while avoiding conception; the
    mother then smears the string with the substance called 'their filth' and ties
    it around the child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The string remains on the child until it falls apart, and after the operation
    the child is described as 'grown up' for certain purposes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the rite, if the child dies, the child may be buried on a hill in dry
    soil; before the rite, the child would be buried in wet soil near the river, like
    twins and children who cut their upper teeth first.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the rite, the child may participate in the purification called hlamba
    ndjaka after the death of a village inhabitant.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the rite, the parents may resume conjugal intercourse while still avoiding
    conception until the child is weaned.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: If conception occurs before the rite, the passage says the parents are guilty
    of a dangerous taboo, the child has been 'stolen' from the law, and later tying
    the string cannot repair the condition.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A child who has not 'entered the law' must be buried in wet soil even if the
    child lives to old age, otherwise rain would be prevented from falling.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Among the Maluleke and the Hlengwe, the passage says such children are even
    burnt after death.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Among the Ba-Ronga the rite is called boha nshale, meaning tying the cotton,
    and can be performed in the same way or more simply by the father.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Parents who have tied the string on the child are said to have taken possession
    of the child.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: Among the Ba-Ronga, after the rite the child may be carried on the shoulders
    without ntehe, by the arms alone.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: The narrator states that tying the cotton string signifies official aggregation
    of the child into the family and human society, and that before this the child
    was considered shilo or khuna, while afterward the child is nkulu.
  category: other
  evidence_refs:
  - ev:10
- id: obs:17
  text: The narrator states that the custom is not a protective rite and that a physician
    has no role in it.
  category: other
  evidence_refs:
  - ev:10
- id: obs:18
  text: Weaning is delayed for a year or more after boha puri, until the child can
    speak, walk, and run small errands such as fetching snuff or tobacco from the
    next hut.
  category: sequence
  evidence_refs:
  - ev:11
