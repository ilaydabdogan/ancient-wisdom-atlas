canonical_text:
  quote: ''
  summary: 'The passage describes Essene communal discipline: shared property, a steward
    for the common bag, hospitality during travel, equality, mutual service, peaceableness,
    rejection of arms and slavery, moral purification, healing and exorcism, aspiration
    to become temples of the Holy Spirit, and a structure of inner communities with
    outer pupils. It also reports Philo''s distinction between the practical life
    of the Essenes and the contemplative life of the Therapeuts.'
  language: English
