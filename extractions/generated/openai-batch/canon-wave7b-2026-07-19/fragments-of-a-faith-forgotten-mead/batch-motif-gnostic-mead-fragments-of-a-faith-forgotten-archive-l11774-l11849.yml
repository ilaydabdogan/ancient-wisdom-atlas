canonical_text:
  quote: ''
  summary: The passage summarizes Mead's account of Menander, a Samaritan teacher
    associated with Simonian Gnosis and Antioch. It describes his teaching about a
    supreme God distinct from creative powers, the attainment of wisdom through disciplined
    transcendental practice, a reported claim to be a saviour sent by higher powers,
    the Logos as true Saviour, and a baptismal or interior purification in which a
    neophyte is said to rise from the dead and become immortal in a spiritualized
    sense.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Menander is identified as a teacher of the Simonian Gnosis, a native of Capparatea,
    and a figure said by Justin to have led many away.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Justin's notice places Menander in a past generation,
    but that Menander's dates are vague and obscure.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Menander's activity is said to have centered at Antioch, described as a major
    commercial and literary city on an East-West route.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Menander is said to have taught a distinction between the God over all and
    the creative power or powers, identified in the passage with forces of nature.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that Menander taught wisdom through practical discipline
    of transcendental magic and through definite endeavour along cosmological and
    psychological science, rather than by faith alone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Menander is described as professing knowledge of the powers of nature and
    the means by which they could be subjected to the purified human will.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports that Menander was said to claim to be the Saviour sent
    down by higher Powers to teach sacred knowledge freeing men from the dominion
    of lower Angels.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The author states that the Saviour was the Logos, and that perfected people
    could become conscious workers with the Logos, called Christs and Saviours, without
    being the Logos itself.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A neophyte receiving baptism, interpreted as interior purification or enlightenment,
