canonical_text:
  quote: ''
  summary: The excerpt introduces and translates an Ode to Sophia from the Acts of
    Thomas. The hymn describes a radiant Maiden, daughter of Light, adorned with fragrant
    garments, crowned by Truth, and praised by singers. It places her in a luminous
    bridal chamber with numbered bridesmen, bridesmaids, and attendants awaiting the
    Bridegroom. It then describes everlasting joy, a feast, robes of light, immortal
    food, wine that ends thirst, and praise to divine figures. A closing comment states
    that the hymn looks back to the sacred marriage of Sophia with Christ as Bridegroom.
  language: English
  quote_policy: summarized
