  quote: ''
  summary: The passage explains that the Master shortened the times for the sake of
    the Elect, so that material souls might be saved from fire. The narrative then
    resumes his heaven-journey through Aeonic Spaces toward the veils of the Thirteenth
    Aeon, where he finds Pistis Sophia alone and grieving outside her proper region.
    When she sees his radiant light-vesture, she sings to the light in the height,
    and the veils of the Thirteenth Aeon are drawn apart.
