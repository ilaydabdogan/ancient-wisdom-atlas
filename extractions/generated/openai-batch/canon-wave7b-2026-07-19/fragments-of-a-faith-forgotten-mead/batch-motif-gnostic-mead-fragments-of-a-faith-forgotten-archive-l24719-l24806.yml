canonical_text:
  quote: ''
  summary: The passage presents teaching attributed to the Saviour/Master about a
    powerful mystery connected with healing and resurrection, the disciples' ecstatic
    response to revealed transcendent heights, instructions to keep the resurrection-and-healing
    mystery as a sign of their mission, and a subsequent exposition of human constitution
    involving light-power, soul, counterfeit spirit, body, destiny, oblivion, the
    world of the Rulers, and the contrasting tendencies of these constituents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A mystery is described as enabling the one who achieves it to ask for conditions
    such as poverty or riches, weakness or strength, disease or health, bodily healing,
    resurrection of the dead, and healing of impairments and diseases, with the requests
    granted at once.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disciples cry out together in transport and say the Saviour has revealed
    a transcendent height that excites them and exalts their souls.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The disciples say their souls have become paths on which they travel to the
    Saviour and that the souls came forth from him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The disciples say their souls are frenzied, travail mightily, and yearn to
    go forth into the height, the region of the Saviour's Kingdom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Master says the disciples may give other committed mysteries to others,
    but not the mystery of the resurrection of the dead and the healing of disease.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The restricted mystery is to be retained as the sign of the disciples' mission,
    so that wonder-deeds will lead others to believe their preaching of the God of
    perfection.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The teaching turns to the question of who constrains a man to sin, opening
    an exposition of the constitution of man and Gnostic psychology.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: At birth the child contains light-power, soul, counterfeit spirit, and body,
    all described as feeble and lacking sense for good or evil because of a great
    weight of oblivion.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The babe eats the delights of the world of the Rulers, and the power, soul,
    counterfeit spirit, and body each absorb from corresponding portions in those
    delights.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Destiny is named as another factor that remains as it came into the world
    and takes nothing from the delights.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: As the human constituents develop, the power senses after the light of the
    height, the soul after the region of mixed righteousness, the counterfeit spirit
    after vices, desires, and sins, and the body after strength from matter.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage's commentary identifies the power as higher mind, the soul as
    lower mind, and the counterfeit spirit as animal nature.
  category: other
  evidence_refs:
  - ev:12
- id: obs:13
  text: The power within impels the soul to seek the region of light and the whole
    Godhead.
  category: action
  evidence_refs:
  - ev:13
