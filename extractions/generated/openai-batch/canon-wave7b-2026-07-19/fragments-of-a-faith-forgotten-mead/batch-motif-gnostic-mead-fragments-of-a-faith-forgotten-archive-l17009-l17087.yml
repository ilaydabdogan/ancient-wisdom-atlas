canonical_text:
  quote: "“All things depending in spirit I see; / All things supported in spirit
    I view.”"
  summary: The passage quotes a short Valentinian Psalm from the Philosophumena, then
    summarizes a reported macrocosmic interpretation in which flesh, soul, air, aether,
    Spirit, Sophia, Horos, Pleroma, and the Abyss form a hierarchical chain of dependence.
    Mead notes uncertainty about the Psalm’s intended meaning and mentions a manuscript
    prefix, “Harvest,” whose connection is unclear.
  language: English
  quote_policy: quoted
