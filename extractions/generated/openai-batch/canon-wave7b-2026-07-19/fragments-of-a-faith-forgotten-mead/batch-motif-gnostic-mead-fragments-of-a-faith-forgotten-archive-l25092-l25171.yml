canonical_text:
  quote: ''
  summary: The passage presents a future moment when souls who have received mysteries
    ascend to the Gates of Light after cycles of transmigration, but find the number
    of perfect souls complete and the gates shut. They petition the Master, are rejected
    for iniquity, and are sent to Outer Darkness. The surrounding summary describes
    Mary’s questions about Outer Darkness, a tail-in-mouth space-dragon with twelve
    dungeons, named rulers, doors, angels, torments, fires, teachings about salvation,
    initiated souls becoming light, escape through knowledge of names, the Draught
    of Oblivion, the counterfeit spirit, and the fashioning of a new soul.
  language: English
