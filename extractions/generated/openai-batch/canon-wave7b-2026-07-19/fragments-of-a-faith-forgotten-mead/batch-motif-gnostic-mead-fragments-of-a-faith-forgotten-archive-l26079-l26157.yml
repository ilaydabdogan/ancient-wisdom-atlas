canonical_text:
  quote: ''
  summary: 'The passage describes a ritual sequence from the Book of the Great Logos:
    Jesus prepares and seals disciples, invokes celestial powers, performs the Baptism
    of Water with a wonder changing wine into water, then describes the Baptism of
    Fire and the beginning of the Baptism of the Holy Spirit, each involving ritual
    materials, seals, and heavenly agents.'
  language: English
  quote_policy: summarized
