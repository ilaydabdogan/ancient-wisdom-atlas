  summary: The foreword argues that, alongside canonical Gospels and Acts, other apostolic
    narratives circulated, many originating in heretical or Gnostic circles and later
    reworked by orthodox editors. It cites Lipsius on editorial recasting, dates the
    Gnostic traces to second-century general Gnosis rather than later Manichaeism,
    and describes Acts-romances as public propaganda and as an intermediate link between
    the General Church and secret inner Gnostic teachings.
