canonical_text:
  quote: Blessed is the man who knoweth this [Word]
  summary: The passage summarizes teaching in which Jesus or the Master instructs
    disciples about receiving Gnosis and the Word, being freed from worldly rulers,
    bringing Heaven to Earth and raising Earth heavenward, understanding ignorance,
    putting on righteousness and a robe of glory, and receiving hidden mysteries of
    the Treasure of Light.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage says the teaching is meant to perfect its recipients and save
    them from the Rulers of this world and its snares by receiving Gnosis, identified
    with the Word he imparts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disciples praise the Master as Light shining in daylight and as one who
    has enlightened their hearts toward the Light of Life through Gnosis and hidden
    wisdom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jesus blesses the person who knows the Word and is described as bringing down
    Heaven, bearing the Earth, raising it heavenward, and making Earth the midst or
    a nothing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage explains Heaven as the invisible Word of the Father, and says
    those who know this bring Heaven to Earth and become children of the true Mind.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Raising Earth to Heaven is explained as ceasing to be an earthly intelligence,
    receiving the Word of the Gnoses, becoming a Dweller in Heaven, and being saved
    from the Ruler of this World.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The evil powers are said to envy those who know Him, while those born in the
    flesh of unrighteousness and not of the second birth have no part in the Kingdom
    of the Father.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The disciples despair because they have been born and have known Him according
    to the flesh, but the Master explains that the phrase means flesh of unrighteousness
    and ignorance, not bodily flesh.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the disciples ask about ignorance, the Master says that to understand
    the great mystery they must put on his virginity, righteousness, and robe, and
    seek to understand the teaching of the Word.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The apostles ask Lord Jesus, the Living One, to teach them the Fullness; the
    text is then said to break off with pages lost.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the following narrative, Jesus tells the twelve disciples and women disciples
    to surround him and promises to reveal mysteries of the Treasure of Light that
    the rulers and powers cannot endure or comprehend.
  category: action
  evidence_refs:
  - ev:9
