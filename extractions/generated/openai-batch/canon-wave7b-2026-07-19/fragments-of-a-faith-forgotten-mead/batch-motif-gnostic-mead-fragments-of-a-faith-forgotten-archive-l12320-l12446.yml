canonical_text:
  quote: ''
  summary: The passage summarizes an anonymous Gnostic system reported from Irenaeus.
    It describes Ialdabaoth and seven formative powers, the creation and animation
    of Adam, the formation of Eve, the role of Sophia and the serpent/mind in freeing
    humanity from ignorance, the descent into denser bodies, and a Christological
    scheme in which Sophia seeks help, Christ descends through the spheres, unites
    with Sophia, descends upon Jesus, and later departs as Jesus is crucified and
    his body is raised by a sent power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ialdabaoth is described as a son connected with Light-fluid and as producing
    further sons until seven formative powers exist.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seven formative powers are called fighters and quarrel with their fathers.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that mind was serpent-formed and arose along with spirit,
    soul, and worldly things through interaction of forces on matter.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ialdabaoth declares himself Father and God with no one beyond him, and Sophia
    contradicts him by saying that the Father of All, the First Man, and Man the Son
    of Man are above him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The powers make man after their image; the man lies like a worm until Ialdabaoth
    breathes into him the breath of life, identified as Light-fluid received from
    Sophia.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After receiving the Light-fluid, man gives thanks to the First Man and disregards
    his fabricators, identified parenthetically as the Elohim.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ialdabaoth is jealous and plans to deprive Adam of the Light-spark by forming
    woman.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The six creative powers are enamoured of Eve and generate sons by her, namely
    the angels.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: Sophia sends the serpent, identified with mind, into Ialdabaoth's Paradise,
    and Adam and Eve listen to its wise counsels.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: By listening to the serpent/mind, man is freed again from the Creative Power's
    dominion and transgresses Ialdabaoth's ordinance of ignorance about any higher
    power.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ialdabaoth drives Adam, Eve, and the serpent/mind out of his Paradise.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Sophia prevents the Light-spark from descending and withdraws it to avoid
    profanation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: The serpent-formed lower mind brings forth six sons, called demonial powers,
    who plague men.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Before the fall Adam and Eve have spiritual bodies; after their fall from
    Ialdabaoth's Paradise, their bodies become denser and become coats of skin.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: Sophia restores to Adam and Eve the sweet odour of the Light; they know they
    carry death, remember their former state, and become patient.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: The system is said to address Genesis legends concerning Cain and Noah and
    the Old Testament generally, with prophets inspired by one or another of the seven
    Elohim and sometimes impressed by Sophia with fragmentary revelations.
  category: other
  evidence_refs:
  - ev:8
- id: obs:17
  text: Sophia finds no rest in heaven or earth, implores the Great Mother, and the
    Great Mother asks the First Man to send Christ to help Sophia.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: Wisdom announces Christ's coming by John, and Jesus is prepared to receive
    him by the baptism of repentance as a clean vessel.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: Christ descends through seven spheres, likens himself to the rulers, drains
    them of their power, and the Light retained by them flows back to him.
  category: action
  evidence_refs:
  - ev:11
- id: obs:20
  text: Christ clothes Sophia with a Light-vesture, and their rejoicing together is
    identified as the mystical marriage of bridegroom and bride.
  category: action
  evidence_refs:
  - ev:11
- id: obs:21
  text: After Jesus is described as born of a virgin by God's working, glossed as
    spiritual second birth attained by the ascetic Jesus, Christ and Sophia descend
    upon him and he becomes Jesus Christ.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:22
  text: Jesus begins mighty works, heals, proclaims the Unknown Father, and openly
