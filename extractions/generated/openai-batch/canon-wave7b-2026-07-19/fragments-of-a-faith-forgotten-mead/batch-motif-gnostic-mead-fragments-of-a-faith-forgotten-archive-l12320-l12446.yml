candidate_motifs:
- id: motif:1
  label: Lower creator opposed by higher divine source
  taxonomy_refs:
  - duality
  basis: Ialdabaoth claims sole divinity, while Sophia names higher figures above
    him and later acts against his ordinance of ignorance.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: The taxonomy label is broad; the passage presents a specific Gnostic hierarchy
    rather than an abstract dualism alone.
- id: motif:2
  label: Serpent as wise liberating counselor
  taxonomy_refs:
  - serpent
  - wisdom
  - forbidden_knowledge
  basis: Sophia sends the serpent/mind into Paradise; Adam and Eve heed its wise counsels
    and transgress the ordinance of ignorance about higher powers.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage identifies the serpent with mind; it is not treated here as
    a purely animal figure.
