canonical_text:
  quote: ''
  summary: The passage argues that biblical criticism opens a new religious field
    but must pass through storms by means of rational faith rather than blind faith.
    It presents criticism as rational private judgment practiced within Christendom,
    yet only a higher faculty moving beyond visible science to gnosis of unseen things
    can address the deepest religious problems. This faculty is metaphorically described
    as a child born from the union of progress and reaction. The passage also describes
    the Bible as a composite and disputed library that nevertheless retains beauty
    and revelatory importance, intensifying the problem of inspiration.
  language: English
  quote_policy: summarized
