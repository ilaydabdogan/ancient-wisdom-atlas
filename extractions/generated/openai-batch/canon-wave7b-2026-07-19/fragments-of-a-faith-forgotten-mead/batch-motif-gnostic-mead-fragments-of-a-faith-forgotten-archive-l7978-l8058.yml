canonical_text:
  quote: ''
  summary: 'The passage describes a solemn communal banquet: participants stand in
    ordered rows, raise eyes and hands to heaven, and pray to God before eating. Seniority
    is defined by maturity in contemplative philosophy rather than age. Women also
    attend, many preserving voluntary virginity through love of wisdom and described
    through imagery of deathless progeny and divine light-beams implanted by the Father.
    Men and women are seated apart, the furnishings are frugal, and the community
    rejects slave service as contrary to natural freedom.'
  language: English
  quote_policy: summarized
