  quote: ''
  summary: The passage describes Basilidian teaching on cosmic limits, Great Ignorance,
    restoration according to cycles, the Saviour's appointed time and star, and Jesus
    as an exemplar whose mixed principles are separated, restored, and raised through
    cosmic levels until the Sonship passes upward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that beings remain indestructible in their proper condition
    but become subject to destruction if they desire to overleap natural limits.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ruler of the Hebdomad is said to have no knowledge of things above him
    because Great Ignorance takes hold of him, removing sorrow, pain, lamentation,
    and impossible desire.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Great Ignorance is also said to seize the Great Ruler of the Ogdoad and the
    ethereal creations subject to him, so that nothing longs for what is contrary
    to nature.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says all things are founded in the Seed of the universe and will
    be restored to their original nature in appointed cycles.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Saviour's saying about his hour and the Magi's observation of his star
    are presented as witnesses that everything has its proper cycle and time.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Saviour is described as the perfected spiritual man within the psychic
    and animal man or soul.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: When perfection is reached, the Sonship in a person leaves the soul behind,
    and the real man is clothed with a proper immortal soul.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The whole scheme of salvation is described as separating various principles
    from conglomeration into their proper states, with Jesus as first-fruits or exemplar.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Jesus's physical part suffers and is restored to formless matter, his psychic
    vehicle arises and is restored to the Hebdomad, and higher vehicles are raised
    to corresponding higher regions.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Through Jesus, the third Sonship is purified and passes upward through purified
    principles to the blessed Sonship above.
  category: action
  evidence_refs:
  - ev:9
