canonical_text:
  quote: ''
  summary: The passage preserves a fragmentary saying about restoration of a “real
    mind” through the help of “God-and-man” and a central “nail” that joins two into
    one as discipline, conversion, and repentance. Mead then comments on faulty Latin
    transmission, identifies one quotation as from the Gospel according to the Egyptians,
    notes an unknown source for another, and compares the changing of Right and Left
    with the conversion of spheres in Pistis Sophia. The afterword says the uncanonical
    Acts preserve traces of Gnosis from Gnostic circles and describes early devotees
    of Christ seeking purification and experience of unseen truths. The passage then
    transitions to a new section with a Latin light invocation.
  language: English with some Latin
