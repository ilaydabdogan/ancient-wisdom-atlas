  quote: '"Thou hast emanated Thy One and Only Mystery"'
  summary: The passage describes a Gnostic cosmological Power that energizes subordinate
    powers, emanates Guardians or Watchers and sixty fatherhoods called the Orders
    of the Five Trees, creates seals and a great name, and is named as First Mystery
    and Light-image around the Father. It then summarizes Light-spaces called the
    Spaces of the Great Logoi and quotes a hymn to an Unapproachable God who emanates
    the One and Only Mystery and is approached through the Great Logos according to
    the Mystery of Ieou.
