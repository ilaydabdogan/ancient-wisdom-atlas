canonical_text:
  quote: ''
  summary: The passage describes treasures made of nested regions, gates, guardians,
    veils, names, numbers, and seals. Jesus explains an emanational origin from the
    Father's remaining "Little Idea," identifies himself as the First Voice, and describes
    the Second and Third Voices as producing the spaces and their rulers. He gathers
    the Twelve, gives them powers to traverse the spaces, and reveals a guarded master-name
    of the Great Power to open every gate and withdraw veils and rulers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each treasure is described as surrounded by six regions or spaces represented
    by squares in diagrams.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The use of seals, numbers, and names is said to make Guardians, Orders, and
    Veils disperse, allowing the innermost space of the father of the treasure to
    be reached and his authentic name revealed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Each treasure has an inner Door or Gate and three outer Gates; each outer
    Gate has three Guardians, while the inner gate has one guardian, presumed to be
    the father of the treasure.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The disciples ask how the spaces and fatherhoods came into being, and Jesus
    answers that they exist because of the Little Idea left behind by the Father.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Jesus says he streamed forth from the Little Idea as its first emanation,
    perfect likeness, and image; this is identified as the First Voice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Second Voice sends forth the spaces one after another, and the Third Voice
    emanates the rulers of those spaces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Jesus, as the First Voice, gathers his Order, the Twelve, takes them through
    the spaces, and gives them powers to pass inward to the innermost space of the
    ruler of all, the True God.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The disciples ask for the promised single master-name that would traverse
    every space and unlock every gate without repeating separate names; Christ identifies
    it as the Name of the Great Power in all the spaces.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The authentic name is described as apparently a cipher containing a triple
    repetition of the seven vowels, to be spoken in the Space of the True God while
    turning to the four corners of the treasure.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After invocation of the Great Name, the paths are requested to be left free,
    the veils are withdrawn, and the rulers disperse into their own form.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Master tells the disciples to guard the master-name and not repeat it
    continually, so that the spaces are not disquieted by the glory within it.
  category: speech
  evidence_refs:
  - ev:9
