canonical_text:
  quote: ''
  summary: The passage describes the Museum of Alexandria as a richly endowed and
    comparatively free scholarly institution whose members pursued many fields of
    research. It compares the Alexandrian intellectual climate with the author's modern
    period, emphasizing skepticism, science, and Aristotelian influence. It presents
    Alexander and Aristotle as models for later schoolmen who sought intellectual
    mastery, then lists Alexandrian and Hellenistic activities in commentary, classification,
    measurement, astronomy, geography, mechanics, and mathematics.
  language: English
  quote_policy: summarized
