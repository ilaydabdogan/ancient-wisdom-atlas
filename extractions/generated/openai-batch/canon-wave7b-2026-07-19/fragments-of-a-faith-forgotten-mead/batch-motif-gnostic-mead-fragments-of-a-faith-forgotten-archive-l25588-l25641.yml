canonical_text:
  quote: ''
  summary: Jesus encourages his disciples, promises them authority and the keys of
    the kingdom of the heavens, chants an invocation in the Great Name, and remains
    with them in an atmosphere of great light. He calls them, turns to the four angles
    of the world, utters the Great Name over them, blesses them, breathes on their
    eyes, and commands them to look. They see a brilliant light and then report seeing
    fire/tire, water, wine, and blood. Jesus, identified as Aberamentho, says he brought
    water and fire from the Treasure of Light and wine and blood from the region of
    Barbelo.
  language: English
