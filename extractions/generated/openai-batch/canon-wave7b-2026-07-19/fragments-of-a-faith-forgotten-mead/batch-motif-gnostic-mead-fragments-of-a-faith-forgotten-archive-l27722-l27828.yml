canonical_text:
  quote: ''
  summary: A divine speaker divides right and left places into opposed realms of life/light/rest
    and death/darkness/suffering, sets veils and watchers between them, honors worshippers
    over opponents, expands the right into many cosmic regions, and promises powers,
    eternal life, divine knowledge, and authority to generate worlds. After the Lord
    hides himself, the births of matter pray to the hidden Mystery for authority,
    law, and incorporeal spirits to dwell with and teach them. The concluding prose
    says mysteries such as baptism and graded purification are given to the repentant
    so that a person may rise to higher consciousness corresponding to regions or
    states.
  language: English
  quote_policy: summarized
