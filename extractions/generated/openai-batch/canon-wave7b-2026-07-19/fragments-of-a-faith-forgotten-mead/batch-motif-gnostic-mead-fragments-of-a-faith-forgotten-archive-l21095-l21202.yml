canonical_text:
  quote: ''
  summary: The speaker forgets the pearl for which his parents sent him to Egypt and
    lies in deep sleep. His royal family and nobles send a sealed letter calling him
    to awaken, remember his royal sonship, the pearl, and his robe of glory. The letter
    flies like an eagle, becomes speech, and rouses him; after reading it he remembers
    his origin and the pearl.
  language: English
  quote_policy: summarized
