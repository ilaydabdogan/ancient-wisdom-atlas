canonical_text:
  quote: ''
  summary: The passage presents Sethian allegory in which a spark or light-ray from
    the upper Light is mingled with waters, bodies, and generation, and the mind seeks
    liberation from death and the dark body. The lower generative power is named wind,
    beast, and serpent. Opposed impure and pure wombs produce mortal and immortal
    beings. The Perfect Man or Logos descends into the pure man, and the Mystery candidate
    is washed, changes garments, drinks life-giving water, and ascends spiritually
    to the ocean of immortality. The passage also reports comparisons with Orphic
    Mystery traditions and affinities with Hermetic and natural-philosophical analogies.
  language: English
  quote_policy: summarized
