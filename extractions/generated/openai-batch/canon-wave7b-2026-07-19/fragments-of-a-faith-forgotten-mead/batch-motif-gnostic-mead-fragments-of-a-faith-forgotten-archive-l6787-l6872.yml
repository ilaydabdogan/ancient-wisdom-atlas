canonical_text:
  quote: ''
  summary: The passage recounts a tradition in which ancient Mystery-institutions
    were founded by highly developed teachers who instructed early humanity in arts,
    divine matters, the soul, the unseen world, and cosmology. As humanity developed
    reason, these teachers withdrew from visible presence, leaving advanced pupils
    to preserve teachings through symbols, devices, dramas, and scenic representations;
    corruption then entered, while the teachers remained unseen and ready to help.
    The passage also stresses the secrecy of the Greek Mysteries and the resulting
    limits on evidence.
  language: English
  quote_policy: summarized
