canonical_text:
  quote: ''
  summary: The passage discusses reports about Apelles and Philumene. Mead describes
    Philumene as having psychic faculties and as a possible medium, then quotes an
    anonymous hostile fragment stating that Apelles regarded her as divinely inspired,
    consulted her about dreams and mental disturbances, and received divinatory answers
    through a phantom appearing to her as a boy who claimed to be Christ or Paul.
    The same report attributes to her a wonder involving a loaf and a narrow-mouthed
    glass vase, and Mead cautions that the account comes from an unfriendly source.
  language: English
  quote_policy: summarized
