canonical_text:
  quote: ''
  summary: The passage summarizes obscure Peratic material in which a water power
    named Thalassa is linked to a Babylonian World-Mother, twelve sources or mouths
    transmit world-powers, cosmic powers extend to the aether, and Peratic teaching
    is related to astrological symbolism. It then describes generated existence as
    bound to destruction and fate, while knowledge of generation and its paths permits
    passage beyond destruction. Finally, it presents a triple universe of Father,
    Son/Logos, and Matter, where the Logos receives powers from the Father and casts
    them into formless Matter to produce the formal world.
  language: English
  quote_policy: summarized
