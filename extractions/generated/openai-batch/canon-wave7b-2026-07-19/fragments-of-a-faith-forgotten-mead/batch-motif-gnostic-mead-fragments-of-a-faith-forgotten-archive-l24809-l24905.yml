canonical_text:
  quote: ''
  summary: The passage describes the counterfeit spirit as an enemy that drags the
    soul into sin and binds it to actions decreed by the Rulers. At death, destiny
    leads the person to death and Receivers of Wrath remove the soul. A sinful soul
    is taken through regions and aeons, descends into Chaos, is punished and haunted
    by the counterfeit spirit, comes to the Ruler of the Way of the Midst, and is
    brought to the Virgin of Light, who seals it and sends it into another body until
    its cycle of transmigrations is complete. A righteous soul that has received higher
    mysteries ascends, utters a mystery that breaks the seals and bonds of the counterfeit
    spirit, and is no longer impeded by destiny and the counterfeit spirit.
  language: English
  quote_policy: summarized
