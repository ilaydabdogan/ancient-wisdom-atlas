canonical_text:
  quote: The Logos takes a body, and His body is the cosmos. The Heavenly Man is crucified
    in space.
  summary: The passage outlines a Gnostic cosmological scheme in which formless cosmic
    matter or chaos is shaped by rays from the aeons, a fiery vortex, and the Pleroma’s
    creative power. It also presents the Logos or Heavenly Man as taking the cosmos
    as body and being crucified in space, and it describes Wisdom as mother-substance
    and the solar embryo through serpent-and-egg imagery.
  language: English
  quote_policy: quoted
