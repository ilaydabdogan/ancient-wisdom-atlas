canonical_text:
  quote: ''
  summary: The passage introduces and quotes episodes from the Acts of John. Jesus
    leads three disciples up a mountain, where John secretly approaches and sees him
    in a non-human, radiant, heaven-reaching form before he appears as a small man
    and painfully pulls John's beard. Peter and James ask John about another speaker
    they heard with the Lord. A later nighttime scene at Gennesaret has John watching
    while the disciples sleep and seeing another figure like Jesus descend and speak
    with him. Mead then interprets the scene as an early basis for a Gnostic distinction
    between Jesus and the Christ. The passage also reports a loaf episode in which
    Jesus blesses and divides bread so that all are satisfied while the loaves remain
    whole.
  language: English
  quote_policy: summarized
