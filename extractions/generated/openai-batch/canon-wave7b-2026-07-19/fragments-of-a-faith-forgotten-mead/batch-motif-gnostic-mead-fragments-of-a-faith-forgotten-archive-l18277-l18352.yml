canonical_text:
  quote: ''
  summary: 'Mead discusses aeon names and their possible relation to Zoroastrian and
    Egyptian materials, then quotes a Sophia myth attributed through Hippolytus: Sophia,
    the last female aeon, observes the Father’s solitary creative power, attempts
    to create without her consort, emanates a formless essence, and thereby causes
    ignorance, formlessness, tumult, fear, prayer, and grief in the Pleroma. The formless
    essence is interpreted through Mosaic/Septuagint language about the unwrought
    earth and through imagery of the Good Land, Celestial Jerusalem, and a land flowing
    with milk and honey.'
  language: English
  quote_policy: summarized
