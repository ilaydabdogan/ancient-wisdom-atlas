canonical_text:
  quote: ''
  summary: 'The passage summarizes Mead''s account of Ebionite views: Jesus was regarded
    as a human son of Joseph and Mary who became a prophet when the Spirit descended
    at baptism; the Ebionites preserved his sayings orally, denied his pre-existence
    or divinity, treated christ-status as available to law-fulfillers, rejected Paul
    as apostate, and later developed Gnostic forms connected with an inner Jewish
    tradition.'
  language: English
  quote_policy: summarized
