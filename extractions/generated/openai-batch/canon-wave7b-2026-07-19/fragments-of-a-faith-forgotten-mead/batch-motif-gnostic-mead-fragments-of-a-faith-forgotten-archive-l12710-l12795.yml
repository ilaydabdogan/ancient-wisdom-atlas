  quote: ''
  summary: The passage summarizes a Naassene or related Gnostic system as transmitted
    through a Marian tradition and interpreted through Mystery traditions. It presents
    a threefold, male-female Heavenly Man; Jesus as the perfected Son of Man; humanity
    divided into spiritual, psychic, and material classes; the spirit/mind imprisoned
    in soul and body; a return to an eternal realm above; baptism as bathing in living
    water above; and anointing as entry into unfading bliss.
  language: English
  quote_policy: summarized
