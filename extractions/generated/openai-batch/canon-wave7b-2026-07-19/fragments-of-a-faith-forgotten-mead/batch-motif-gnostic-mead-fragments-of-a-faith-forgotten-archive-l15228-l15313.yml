canonical_text:
  quote: ''
  summary: 'The passage describes a Basilidian cosmological sequence: a Great Ruler
    comes into being, ascends to the Great Firmament, mistakenly believes nothing
    is above him, and undertakes creation. The cosmos is mapped into aetherial spaces
    beyond the moon and sublunary regions below it. The Great Ruler brings forth a
    wiser Son from the universal Seed, seats him at his right hand in the Ogdoad,
    and creates with the Son’s energizing counsel. A second Ruler later arises from
    the universal Seed and rules the sublunary Hebdomad from the moon to the earth.'
  language: English
  quote_policy: summarized
