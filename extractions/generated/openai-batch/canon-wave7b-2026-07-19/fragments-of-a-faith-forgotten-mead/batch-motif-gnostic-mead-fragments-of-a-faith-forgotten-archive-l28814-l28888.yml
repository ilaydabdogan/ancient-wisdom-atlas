canonical_text:
  quote: ''
  summary: A scholarly discussion of the Akhmim Codex relates the Barbelo-Gnostics
    or Gnostics to books attributed to Mary, ancient witnesses such as Epiphanius,
    Celsus, Irenaeus, Tertullian, and Hippolytus, and Harnack's view that the new
    Coptic evidence allows comparison of an original Gnostic work with Irenaeus's
    presentation. The passage also summarizes a reported dispute over whether aeons
    were external personified substances or internal impressions within the summit
    of the godhead, and notes the unusual transmission history from a probable second-century
    Egyptian Gnostic work to a fifth-century Coptic translation.
  language: English
  quote_policy: summarized
