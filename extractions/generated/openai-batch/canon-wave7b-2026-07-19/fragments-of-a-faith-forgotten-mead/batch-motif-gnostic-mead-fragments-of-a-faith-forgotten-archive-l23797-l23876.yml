canonical_text:
  quote: ''
  summary: Mary recounts an infancy episode in which a Spirit from the height, resembling
    the child Jesus and calling him brother, comes to Mary’s house. Mary doubts him,
    binds him to the bed, and fetches Jesus and Joseph from the vineyard. Jesus rejoices
    and expects the visitor. They return, see the Spirit’s likeness to Jesus, unloose
    him, and Jesus and the Spirit embrace, kiss, and become one being. Mary then asks
    about the twenty-four Invisibles, and Jesus describes them as incomparable to
    worldly forms, greater than cosmic regions, and far more radiant than the sun
    of this world.
  language: English
  quote_policy: summarized
