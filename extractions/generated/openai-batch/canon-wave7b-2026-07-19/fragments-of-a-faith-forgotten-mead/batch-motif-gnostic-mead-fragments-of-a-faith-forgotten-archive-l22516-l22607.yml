  summary: A modern scholarly frame introduces a Gnostic farewell address placed in
    John's mouth. John addresses his brethren and fellow-servants, recalls divine
    gifts granted through him, urges steadfastness and sinlessness, describes Jesus
    as the Good God, warns of consequences for turning back after receiving mercy,
    and then prays to Christ using images of a woven wreath, joined blossoms, unfading
    flower, and sown Words.
