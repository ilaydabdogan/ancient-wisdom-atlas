canonical_text:
  quote: ''
  summary: The passage introduces Ptolemy as an early pupil of Valentinus whose life
    is unknown, notes two preserved writings, and summarizes the opening argument
    of the Letter to Flora. The summary presents divided views about whether the Jewish
    Law came from the Logos or from an opposing destructive power, rejects both extremes,
    distinguishes false gnosis from Christian gnosis, and refers to a disputed report
    about Ptolemy's and Valentinus's treatment of aeons.
  language: English
  quote_policy: summarized
