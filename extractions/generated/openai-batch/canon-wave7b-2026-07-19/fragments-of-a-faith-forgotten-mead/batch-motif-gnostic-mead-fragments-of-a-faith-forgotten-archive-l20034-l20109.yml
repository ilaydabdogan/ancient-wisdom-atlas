- id: obs:4
  text: The Letter to Flora is said to give the Valentinian tradition's view concerning
    the world-process, old Covenant theology, and Jewish law documents.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ptolemy is summarized as saying that one extreme view holds the Jewish Law
    came directly from God and the Father, identified as the Logos, while the opposite
    extreme says it came from the destroyer, the god of this world, identified as
    the Accuser or Diabolos.
  category: speech
