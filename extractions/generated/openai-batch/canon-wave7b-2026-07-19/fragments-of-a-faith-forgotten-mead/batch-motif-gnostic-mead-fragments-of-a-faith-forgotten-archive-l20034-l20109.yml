- id: obs:3
  text: A reported statement attributed to Tertullian contrasts Ptolemy's and Valentinus's
    treatment of the names and numbers of the aeons, but the passage calls the statement
    unintelligible to the student of Gnosticism.
  category: speech
  evidence_refs:
