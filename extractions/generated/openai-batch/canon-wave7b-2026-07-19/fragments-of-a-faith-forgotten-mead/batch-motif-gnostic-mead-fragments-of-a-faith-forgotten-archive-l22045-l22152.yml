  quote: He who danceth not, knoweth not what is being done.
  summary: 'The passage describes secrecy around unutterable mysteries, then presents
    an editorially reconstructed hymn or ritual from the Acts of John: disciples form
    a ring around Jesus, answer with Amen, and a candidate and initiator exchange
    paired utterances about saving, loosing, piercing, birth, eating, hearing, washing,
    flight, and robing. Additional lines mention Grace or Sophia dancing, the Ogdoad
    playing, and the Dodecad dancing above.'
