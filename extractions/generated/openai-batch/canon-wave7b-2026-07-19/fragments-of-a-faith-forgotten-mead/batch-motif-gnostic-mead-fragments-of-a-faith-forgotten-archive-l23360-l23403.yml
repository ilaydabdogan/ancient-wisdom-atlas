  quote: ''
  summary: A radiant figure called He or the Master passes upward and inward through
    spheres, receiving worship from powers. In the Space of the Twelve Aeons, Tyrants
    under Adamas oppose the light and fail. The Master removes a third of their power
    so that harmful magical invocations will be less effective, and changes the Fate-Sphere
    from a single leftward orientation to alternating six-month left and right orientations.
  language: English
