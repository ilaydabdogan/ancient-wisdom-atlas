  summary: The passage describes contemplatives who seek solitude while remaining
    near one another for fellowship and mutual help. Each dwelling contains a sacred
    chamber or monastery where they perform the mysteries of the holy life without
    bodily provisions, using laws, prophetic sayings, hymns, and related materials.
    They maintain memory of God, receive sacred wisdom in dream-visions, pray at dawn
    and evening for heavenly light and the soul’s withdrawal from sense-desire, and
    spend the day studying sacred writings allegorically.
