canonical_text:
  quote: '"Take courage, it is I; be not afraid."'
  summary: After the Master has been absent for thirty hours, with shaking, confusion,
    fear, and praise in the regions, the disciples see Jesus descending in a threefold,
    brilliant light. He reassures them, withdraws the great light, appears in familiar
    form, and is worshipped and questioned. As the glorified Christ, he says he will
    reveal all things plainly because the First Mystery has given him authority; he
    has again received the vesture of light, the robe of glory, from the supernal
    Light-realm in order to reveal the mysteries to humankind.
  language: English
