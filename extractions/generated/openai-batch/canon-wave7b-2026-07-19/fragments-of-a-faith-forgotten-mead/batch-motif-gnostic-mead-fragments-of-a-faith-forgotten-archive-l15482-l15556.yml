canonical_text:
  quote: ''
  summary: The passage presents a Basilidian account in which Light descends through
    cosmic levels to Jesus, who is illumined and set aflame. It interprets annunciation
    language as a descent of divine creative power through Sonship, Limitary Spirit,
    Ogdoad, Hebdomad, and Demiurgos to Mary/body. The commentator adds that Jesus
    is a type for members of the Sonship. The world endures until the whole Sonship
    imitates Jesus, is purified, ascends beyond the Great Limit, and leaves creation
    to receive Great Mercy. God then brings Great Ignorance on the universe so beings
    remain in their natural condition, and lower souls lack knowledge of higher states
    to prevent painful impossible longing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage cites a mystery not known to former generations, made known by
    revelation, and includes words described as unspeakable and unlawful for man to
    utter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Light is said to descend from above, through the Ogdoad and Hebdomad, to Jesus,
    son of Mary.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jesus is described as illumined and caught on fire in harmony with the Light
    streaming into him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage interprets the Holy Spirit and the Power of the Highest as divine
    creative power coming from the Sonship through intermediary cosmic powers as far
    as Mary, glossed as the body.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The commentator states that the text of Hippolytus is involved, identifies
    the Son apparently with the soul, Mary with the body, and says Jesus seems to
    stand for every member of the Sonship.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The world is said to remain undissolved until the whole Sonship follows and
    imitates Jesus, hastens upward, and comes forth purified.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Purification is said to make the Sonship subtle enough to speed aloft through
    its own power, like the first Sonship.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the whole Sonship ascends beyond the Great Limit, the whole creation
    becomes the object of the Great Mercy and the Sons of God ascend beyond creation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: God is said to bring Great Ignorance upon the universe so that all things
    remain in their natural condition and do not long for what is contrary to their
    nature.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lower souls are described as remaining without knowledge of higher states
    so that they do not suffer by striving after impossible objects; the passage compares
    this to fish longing to feed on mountains with sheep.
  category: other
  evidence_refs:
  - ev:8
