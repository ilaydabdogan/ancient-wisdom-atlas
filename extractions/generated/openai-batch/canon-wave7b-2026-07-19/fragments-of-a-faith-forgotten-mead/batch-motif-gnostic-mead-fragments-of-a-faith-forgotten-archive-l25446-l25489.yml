canonical_text:
  quote: ''
  summary: The passage summarizes an excerpt concerning cosmological rulers and mysteries.
    Hermes, Aphrodite, and Zeus are mentioned with incorruptible mystery-names and
    genesis. Zeus is described as head of four powers and as a good figure who moves
    through ruling powers, freeing rulers from iniquity. Mary asks the Saviour about
    the aerial Ways of the Midst below the Fate-Sphere, their torments, and the danger
    that receivers may carry souls to judgments. The Master promises to reveal mysteries,
    seals, numbers, invocations, baptisms, and the Treasure of Light, so that the
    addressees may be called Sons of the Pleroma and blessed in the time of the Sons
    of Light.
  language: English
