canonical_text:
  quote: ''
  summary: 'The passage summarizes Mead''s account of Saturninus as preserved by Irenaeus:
    a system with an Unknown Father, cosmic hierarchies, seven creative spheres and
    rulers, builders of the universe and human body, hostile powers, and a World-saviour
    who rescues those with a light-spark. It then recounts a creation myth in which
    the Logos shows a shining image to demiurgic angels; they try to copy it but produce
    only a helpless plasm until the Power Above sends a life-spark that makes it rise
    and become the human body. The light-spark, described as the real man, returns
    after death to those of its own nature while the bodily elements dissolve. The
    passage also introduces the difficulty of treating the Ophites and notes secrecy,
    hidden manuscripts, and grades of initiation in Gnostic circles.'
  language: English
  quote_policy: summarized
