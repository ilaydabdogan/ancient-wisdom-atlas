  quote: ''
  summary: The passage discusses how Seth or Set came to be identified with Typhon,
    opponent of Osiris, after the Hyksos expulsion, while arguing that such later
    hostile identifications do not necessarily define older mystery doctrines. It
    compares this with Iranian use of Daevos for evil entities, Indo-Aryan Devas as
    beneficent, and Christian Demon versus Greek Daimones. It then notes political
    and religious contacts among Chaldaea, Egypt, Persia, Greece, and mystery traditions,
    and emphasizes the complex mixed heredity of Egyptian religion.
