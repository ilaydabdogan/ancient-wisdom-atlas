canonical_text:
  quote: ''
  summary: 'The passage reports Valentinian cosmological and scriptural exegesis within
    the Sophia myth: Wisdom-without, identified with Jerusalem Above, and the Common
    Fruit of the Pleroma emanate heavenly Words or angels; the Workman emanates souls
    and forms bodies from material and elemental substance; the soul is treated as
    the inner or psychic man; the material man is described as a dwelling for soul,
    daemonic existences, or words sown from above; Pauline and Genesis passages are
    interpreted through this scheme.'
  language: English
  quote_policy: summarized
