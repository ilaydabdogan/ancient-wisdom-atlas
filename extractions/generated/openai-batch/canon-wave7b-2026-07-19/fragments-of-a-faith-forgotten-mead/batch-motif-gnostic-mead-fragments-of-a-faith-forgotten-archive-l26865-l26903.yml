    sings to the Father. The hymn addresses the Father by exalted names and describes
    divine self-withdrawal, the remaining Little Idea as a shining Light-world, Jesus
    as the Father's light-emanation and image, and further emanations producing surrounding
    spaces, powers, rulers, and Treasures.
