canonical_text:
  quote: ''
  summary: The speaker, sent to Egypt, charms a terrible serpent by invoking named
    authorities, takes the pearl, and turns back toward the Father's house. He discards
    an unclean garment, is guided by a luminous letter, passes Babel and reaches Maishan.
    His parents send his bright robe by trusted treasurers; when he faces it, the
    robe appears as a mirror of himself, two in distinction yet one in likeness. Notes
    in the passage gloss some elements as initiation and compare them with other mystery
    and gnostic materials.
  language: English
  quote_policy: summarized
