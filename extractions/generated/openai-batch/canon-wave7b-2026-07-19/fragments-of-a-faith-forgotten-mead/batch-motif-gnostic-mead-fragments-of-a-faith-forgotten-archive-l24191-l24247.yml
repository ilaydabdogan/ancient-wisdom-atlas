canonical_text:
  quote: ''
  summary: The passage summarizes a section of the Pistis Sophia with headings about
    thrones in the Light-Kingdom, other Logoi, and degrees of mysteries. It reports
    an apparent interpolation from an unknown Gospel in which the Saviour speaks of
    twelve ministers, the high rank of Mary Magdalene and John, recipients of the
    Mystery in the Ineffable, and a hierarchy of thrones. Mary asks whether this is
    the final mystery and later asks about those who do not receive the Mystery before
    death. The Saviour/Master answers that there are further mysteries and words,
    that recipients of a mystery of light rest after death in a corresponding Light-world,
    and that only one who has become a Christ can know the Gnosis of the whole pleroma.
  language: English
