canonical_text:
  quote: ''
  summary: 'The passage presents Basilides as rejecting emanation and matter-based
    creation, interpreting creation as arising from divine speech and from a Seed
    beyond being. It then describes the absolute Seed as containing a triple Sonship:
    the subtlest aspect immediately ascends to the God beyond being, while the less
    subtle aspect remains in the Seed and requires the Holy Spirit, described as wings,
    for ascent.'
  language: English
