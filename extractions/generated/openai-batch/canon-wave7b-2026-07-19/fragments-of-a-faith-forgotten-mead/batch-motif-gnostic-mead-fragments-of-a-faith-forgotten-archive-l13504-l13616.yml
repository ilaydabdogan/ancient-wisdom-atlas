canonical_text:
  quote: ''
  summary: The passage summarizes a Docetic-Gnostic cosmology in which the third aeon
    or Logos emanates light into chaotic substance, souls are caught in darkness and
    cycle through bodies, a creative world-fabricator forms bodies from darkness,
    and the Saviour descends by withdrawing his glory, is baptized in Jordan, receives
    a spiritual body, and triumphs over the world-ruler at the cross or tree. It also
    notes initiatory understanding among real Gnostics and compares the system generally
    to the Bruce and Askew Codices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The third root-aeon becomes threefold and its light shines down on primordial
    chaotic substance, into which the souls of living beings are infused.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Logos perceives that his ideas, impressions, types, or seals, identified
    as souls, are seized by darkness, and he separates light from darkness by placing
    a firmament between them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A resemblance of the third aeon is impressed on the lower universe as a life-giving
    fire generated from light, identified as the creative god that fashions the world.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fabricating deity lacks substance of his own, uses darkness or gross matter
    as substance, makes bodies from it, and treats the imprisoned attributes of light
    despitefully.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Souls are described as ideas breathed out from the aeons above; they live
    in darkness and pass from one body to another under the world-fabricator.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Gnostic author cites sayings about Elias and Job as support for the teaching
    about wandering or body-change.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Saviour frees souls from the cycle of rebirth, and the Alone-begotten
    Son wills to descend after beholding souls changing from body to body in darkness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Before descending, the Saviour contracts or withdraws his glory so that the
    aeons can endure it, then passes to the heavenly dome, the star-belt, the third
    sphere of the third aeon, and finally into darkness as incarnation in a body.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Saviour washes in the Jordan, called the stream of the Logos, and after
    purification in water becomes possessed of a spiritual body copied from his virgin-made
    physical body.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The world-ruler condemns the physical body to the cross, while the spiritual
    body strips off the physical body, nails it to the tree, and the Christ triumphs
    over the powers and authorities of the world-ruler.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says that only real Gnostics who have passed through initiations
    similar to those of Jesus can understand the mystery face to face.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The author remarks on a striking similarity between this system and the leading
