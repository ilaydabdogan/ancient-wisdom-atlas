canonical_text:
  quote: ''
  summary: 'The passage presents Mead''s symbolic account of Valentinian aeonology:
    a light-sphere or egg-like motion develops two foci, Bythus and Ennoea, whose
    separation establishes syzygy, polarity, and duality. Their interaction produces
    veils, planes, offspring, the ogdoadic hierarchy, sevenfold differentiation, triadic
    syzygies, and later dodecadic and decad arrangements, with explicit comparisons
    to Isis, Osiris, the World-soul, and Basilidean structures.'
  language: English
  quote_policy: summarized
