canonical_text:
  quote: ''
  summary: Thomas accepts money for a king's palace but spends it on preaching, healing,
    and alms. He tells the king that the palace can only be seen after leaving the
    world. After the king imprisons Thomas, the king's brother dies, is taken by angels
    to heavenly habitations, sees the palace attributed to Thomas, and returns to
    life to ask to buy it. The king then wishes to keep the mansion for himself, and
    both brothers receive instruction and baptism.
  language: English
