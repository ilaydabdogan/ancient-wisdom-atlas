canonical_text:
  quote: "“the atom and its simplest modes of differentiated being, may be taken as
    symbols of the aeon-world, the Pleroma”"
  summary: A modern scholarly passage proposes that Valentinian aeonology may have
    drawn partly on Pythagorean and Platonic number, geometry, and mathesis. It describes
    atoms, points, spheres, polarity, and syzygy as living symbols for the aeon-world
    or Pleroma, while warning that proof for the broader historical claim is lacking.
    It then interprets the interlaced triangles of Solomon’s Seal as two interpenetrated
    tetrahedra and relates this to the five regular solids and a double syzygy of
    atoms in equilibrium.
  language: English
  quote_policy: quoted
