canonical_text:
  quote: '"My God and my Head / Hast thou left me alone?"'
  summary: The passage summarizes fragments attributed to Bardaisan, including a consummation
    scene in which spiritual souls pass from the Ogdoad to the Pleroma and unite with
    divine spouses, a cry ascribed to lower Wisdom or sorrowing Sophia, a phrase about
    the Ancient of Eternity as a boy, and a transition to Bardaisan’s views on astrology,
    fate, and the Seven Stars in The Book of the Laws of Countries.
  language: English
  quote_policy: quoted
