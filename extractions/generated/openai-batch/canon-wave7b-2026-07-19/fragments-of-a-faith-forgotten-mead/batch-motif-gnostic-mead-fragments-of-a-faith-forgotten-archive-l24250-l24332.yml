canonical_text:
  quote: ''
  summary: The passage summarizes teaching from the Pistis Sophia concerning the First
    Mystery, the Ineffable, ordered mysteries, postmortem inheritance in regions of
    Light, boons granted by higher mysteries, protections for another soul after death,
    and the differing requirements of heavenly spaces regarding explanations, apologies,
    symbols, and receivers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who receives the first mystery of the First Mystery is said to become
    king over spaces of the First Saviour in the Light-realm, continuing up to the
    twelfth.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mary asks the Master why the First Mystery has twelve mysteries while the
    Ineffable has one Mystery.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The answer states that the mysteries are really one Mystery, ordered into
    twelve, five, and three while remaining one.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The two higher mysteries of the three ensure the possessor an appropriate
    lot in the Inheritance after leaving the body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The same mysteries can enable the possessor to protect a deceased person who
    did not participate in the Words of Truth, so that this person is not punished.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The protected non-participant cannot enter the Light until performing the
    whole polity of the light of the mysteries, described here as strict renunciation
    of the world.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The protected non-participant is instead sent back into a righteous body that
    will find the God of Truth and the higher mysteries.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The highest mystery is associated with the whole Space of the Ineffable and
    with sweet mysteries in the Limbs of the Ineffable.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Ineffable is described as lying stretched out with Limbs and as having
    emanated with its own Word.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: Those who receive a mystery in the Space of the Ineffable inherit up to the
    region they have received, within the whole region of that Space.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Souls in the Space of the Ineffable do not give explanation, apology, or symbol,
    and are described as having no receivers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: In the second Space below, the Space of the First Mystery looking within,
    such souls require no apology.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: In the third Space, the Space of the First Mystery looking without, each region
    has its receiver, explanation, apologies, and symbols.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:14
  text: The pleroma is said to be completed when the number of perfect souls is reached
    and the Mystery is accomplished.
  category: sequence
  evidence_refs:
  - ev:6
