  summary: The passage introduces Valentinus as the commanding yet mysterious figure
    behind the Valentinian movement. It reports that even opponents acknowledged his
    learning, eloquence, and moral character, while emphasizing that reliable knowledge
    of him and his writings is fragmentary and mediated by hostile patristic and heresiological
    sources. The author sets aside the disputed relation of Valentinus to the Askew
    and Bruce Codices while stating a personal but unproven opinion that Valentinus
    contributed to some of their elaborations.
