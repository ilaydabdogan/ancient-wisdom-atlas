canonical_text:
  quote: ''
  summary: 'The passage surveys the Alexandrian libraries and Museum: sacred and national
    books are translated into Greek, the Bruchion and Serapeum collections grow, rolls
    are counted in large numbers, the Bruchion is burned and rebuilt with the Pergamus
    library, later rulers and religious groups remove or destroy collections, and
    the Museum is described as an institution for arts, sciences, and physical research.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Books of other nations are said to have been turned into Greek; sacred books
    were translated, and the Septuagint version of the Hebrew Bible was added with
    an associated miracle legend attributed to Josephus.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: By the time of Ptolemy III, the Bruchion could not contain all the books,
    so a new nucleus was established in the Serapeum buildings, not in the temple
    itself.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports 400,000 rolls or volumes in the time of the first three
    Ptolemies and notes later claims exceeding a million, while warning that a roll
    was often smaller than a modern volume.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Serapeum soon contained as many books as the Bruchion, and in 47 B.C.
    a great fire that destroyed Caesar's fleet also burned the Bruchion to the ground.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lucian is said to have asserted that the glow of the Bruchion conflagration
    could be seen as far as Rome.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Bruchion was rebuilt, and the library of Pergamus was placed in the new
    building after Mark Antony handed it over to Cleopatra.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Julian took many volumes for his own library, and in 387 a group described
    as "Christian" fanatics stormed the Serapeum, razed the temple, and left only
    empty shelves of the library.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the account, Amru, general of Omar, fed the furnaces of Alexandria's baths
    for six months with the Bruchion's treasures, justified by whether the rolls agreed
    with the Koran.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The written material served scholars, scientists, and philosophers of Alexandria,
