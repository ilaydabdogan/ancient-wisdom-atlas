canonical_text:
  quote: ''
  summary: The passage surveys Saturninus, or Satornilus, as a reported founder of
    Syrian Gnosis, discusses a Patristic teacher-chain used to date him, notes uncertainty
    about whether he met Menander, describes his Antioch teaching and rigid asceticism,
    and states that evidence for his doctrinal system is defective, with possible
    but untraced relations to Ophite and Barbelo developments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Saturninus, more correctly Satornilus, is generally regarded as founder of
    the Syrian Gnosis, while the passage states that Gnosticism was probably widespread
    in Syria before him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Justin Martyr, writing between 150 and 160, presents the Satornilians as an
    important body by bracketing them with the Marcians or Marcionites, Basilidians,
    and Valentinians.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The proposed date for Saturninus depends on Patristic statements arranging
    Menander, Saturninus, Basilides, and Valentinus in a teacher-chain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author cautions that heresiologists may have inferred Saturninus' origin
    from Menander on the basis of doctrinal similarity, and that the two may never
    have met face to face.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Saturninus is said to have taught at Antioch, but the passage says there is
    no information about his nationality or life incidents.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Saturninus is described as especially distinguished for rigid asceticism,
    also called encratism.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: His followers abstained from marriage and from all kinds of animal food, and
