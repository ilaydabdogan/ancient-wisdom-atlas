  quote: ''
  summary: The passage surveys sources for the Valentinian movement, especially patristic
    refutations and later scholarly assessments. It reports Tertullian’s list of earlier
    anti-Valentinian writers, summarizes Irenaeus’ evidence and limitations, notes
    material concerning Ptolemaeus and Marcus, and describes Clement’s excerpts from
    Theodotus as dislocated and difficult to interpret.
  language: English
  quote_policy: summarized
