  quote: Jesus stands by the Sea of the Ocean, surrounded by his disciples, male and
    female, and makes invocation with solemn prayer
  summary: The passage describes Jesus, identified later by the mystery-name Aberamentho,
    standing with male and female disciples by the Sea of the Ocean. The group wears
    white linen robes and gathers around an altar. Jesus invokes the Father of boundless
    light, turns with the disciples to the four quarters, invokes IAO three times,
    gives an interpretation of IAO, and prays for the disciples whom he has brought
    into the Father's presence. He then invokes the Name of the Father of the Treasure
    of Light.
