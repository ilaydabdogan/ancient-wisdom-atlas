- id: obs:3
  text: The author says the corrupt hymn concerns the World-Mind or Father, Chaos
    as Cosmic Mother, the World-Soul, the individual soul as pilgrim, sorrow, rebirth,
    the descent of the Saviour, and the regeneration of all.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the quoted hymn, Mind is first, Chaos is second, and the toiling Soul is
    third.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Soul is described as surrounded with a watery form, weary, subdued by
    death, seeing light, weeping, rejoicing, being judged, dying, unable to pass,
    and wandering into a labyrinth of rebirth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bracketed speaker identified as Jesus addresses the Father, says man wanders
