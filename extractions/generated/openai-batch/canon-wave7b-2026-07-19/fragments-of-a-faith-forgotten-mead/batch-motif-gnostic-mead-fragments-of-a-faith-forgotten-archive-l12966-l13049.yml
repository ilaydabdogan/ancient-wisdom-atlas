canonical_text:
  quote: ''
  summary: The passage discusses Naassene Gnostics, a corrupt hymn, and a transition
    to the Peratae. It describes anointing with an ineffable chrism from a serpentine
    horn of plenty; summarizes and quotes a hymn about Mind, Chaos, Soul, rebirth,
    and the descent of the Saviour or Jesus with seals to reveal mysteries called
    Gnosis; and reports that Peratae mysteries are linked to serpent symbolism and
    Chaldaean star-cult traditions.
  language: English
