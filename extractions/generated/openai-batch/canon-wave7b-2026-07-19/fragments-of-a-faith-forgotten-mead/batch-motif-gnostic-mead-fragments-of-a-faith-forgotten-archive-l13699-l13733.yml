canonical_text:
  quote: ''
  summary: Mead introduces the so-called Cainites as an obscure set of tendencies
    known from scant sources, chiefly Irenaeus and Epiphanius. He says this line is
    generally classed as Ophite, that its adherents called themselves Gnostics, and
    that they were distinguished by honour paid to Cain and Judas, provoking orthodox
    denunciation. He also notes that Epiphanius embroidered Irenaeus' account and
    that the systems of Justinus and the Sethians may help contextualize the discussion
    that follows.
  language: English
