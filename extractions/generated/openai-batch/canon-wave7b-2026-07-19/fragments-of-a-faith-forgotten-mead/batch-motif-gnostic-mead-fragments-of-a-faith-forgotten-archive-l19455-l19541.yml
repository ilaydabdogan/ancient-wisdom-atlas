canonical_text:
  quote: ''
  summary: 'The passage explains Marcus-related Gnostic number-symbolism: classes
    of letters correspond to aeonic pairs and cosmic processes; number sequences and
    alphabetic values are used to interpret Jesus, the Pleroma, and the aeons; Gospel
    stories are treated as allegories of initiation, especially the Transfiguration
    as an ascent after six days into a mountain symbolizing higher consciousness.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage assigns soundless letters to Mind-and-Truth, liquids to Word-and-Life,
    and vowels to Man-and-Church.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The liquids are described as midway between soundless letters and sounds,
    receiving emanation from above and ascent from below.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sound going forth through the Man is said to have formed all things, and the
    echo of his voice gave them form.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The numerical series 9, 8, 7 is transformed into 8, 8, 8 by moving one unit
    from 9 to 7; this is connected with the numerical value 888 of the six-lettered
    name Jesus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Jesus is described as having had a seat with the Father, leaving that seat,
    descending to the Church, and restoring divine creation to equilibrium.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The three spaces or phases of the Pleroma are made numerically equal as three
    eights, which together total 24.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The three spaces or elements are described as twofold and fourfold, making
    24 in all and reflecting elements of the Unnameable in dyads, triads, and tetrads.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A hidden 6 is found among the 24 letters of the alphabet in the double letters,
    and 24 plus 6 is said to symbolize the 30 aeons of the Pleroma.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Gnostics are said to have found Gospel numbers and processes in Genesis
    and elsewhere in the Old Covenant library.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states that the Gnostics treated Gospel legends not as history
    but as allegory and as symbolic of the drama of initiation.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Transfiguration story is described as symbolic of the divine economy manifested
    in the man seeking perfection and as a stage of initiation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: After six days, interpreted as the seventh stage since the disciple first
    entered the path, the disciple ascends into the mountain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The mountain is explicitly glossed as a graphic symbol for higher states of
    consciousness.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: The initiate ascends with three and is joined by two, identified with Peter,
    James, and John, and with Moses and Elias from the Gospel narrative.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The three are described as powers already won over the gross, subtle, and
    mental planes, with a tentative comparison to three Buddhist degrees.
  category: relationship
  evidence_refs:
  - ev:9
