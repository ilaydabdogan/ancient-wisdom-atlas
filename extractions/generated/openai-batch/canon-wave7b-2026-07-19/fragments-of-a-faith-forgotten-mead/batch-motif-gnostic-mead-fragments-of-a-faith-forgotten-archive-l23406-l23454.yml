  summary: The passage summarizes a Pistis Sophia teaching scene in which the Master
    invites questions about revealed mysteries. Mary Magdalene interprets an Isaiah
    passage, is commended for intuition, and receives further explanation about the
    Rulers of Fate, the altered turning of the spheres, and the remaining power in
    the Thirteenth Aeon. Philip asks about the conversion of the spheres, which is
    explained as aiding the salvation and perfection of souls who will dwell in the
    Light-treasure.
