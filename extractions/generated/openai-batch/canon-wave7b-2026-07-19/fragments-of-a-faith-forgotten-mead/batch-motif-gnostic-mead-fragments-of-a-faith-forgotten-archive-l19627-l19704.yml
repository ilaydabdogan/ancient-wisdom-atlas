canonical_text:
  quote: ''
  summary: The passage describes a Marcosian number-symbolic scheme in which seven
    heavens utter seven vowels in harmony, sending glory upward and an echo earthward
    that generates human souls. It then reports a cosmogonic account of Noughtness,
    Oneness, Monad/Nought, and One as primordial powers that send forth aeonic emanations.
    The passage further discusses the ineffability of the highest tetrad, sacred language,
    substitute divine names, and Greek letter-counts that total twenty-four elements
    of the Pleroma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The first through seventh spheres or heavens are each assigned a vowel: A,
    E, H, I, O, Y, and Q.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seven heavens unite in harmony, send forth a sound, and glorify the one
    by whom they were emanated, identified parenthetically as the system-logos or
    world-builder.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The glory of the sound is carried up to the Forefather of the Pleroma, while
    the echo of the hymn is borne to earth and becomes the modeller and generator
    of human souls.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The narrator says Irenaeus has reached the end of a manuscript and now reports
    additional Marcosian ideas from scraps of quotations or hearsay.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: A quoted exposition places a source before all universes and names an inconceivable,
    ineffable, unnameable state as Noughtness, with which Oneness consubsists.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Noughtness and Oneness are described as in reality one, and as emanating,
    while also not really emanating, the intelligible source called Monad or Nought.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Monad has with it a power of equal substance called One, and Noughtness, Oneness,
    Nought, and One send forth the rest of the emanations of the aeons.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Noughtness is glossed as the root of the monad and as the O or circle containing
    all numbers, the no-number.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage states that this material shows distinct influence of Basilides,
