  summary: The passage summarizes Greek Mystery institutions as initiatory forms of
    religion associated with purification, better conduct, and hope for the future
    after death. It distinguishes political, private, and philosophic Mysteries; describes
    the Eleusinian State-Mysteries, private associations, Orphic ascetic communities,
    and Pythagorean schools; and presents Orphic and Pythagorean traditions as important
    sources for understanding the 'real Mysteries.'
