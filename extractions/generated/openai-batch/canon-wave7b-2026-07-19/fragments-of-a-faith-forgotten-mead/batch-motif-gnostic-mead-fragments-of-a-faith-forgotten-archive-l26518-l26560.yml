canonical_text:
  quote: ''
  summary: The passage describes two schematic diagrams and an emanational ordering
    in the Light-kingdom. One diagram, made of a square, circle, inner square, and
    three lines, is the type of the treasures and of leou before emanation. Leou,
    by the Father's command, gives rise to emanations who become fathers of treasures
    and are also called leou. Jesus as Logos effects this ordering. The True God is
    described as father of the fatherhoods, a direct emanation from the Father, and
    the source through and from whom later emanation proceeds. Subordinate leous produce
    hosts called Orders of the Treasures of Light. A second diagram, like an egg with
    a smaller egg or nucleus and three strokes, represents the True God before emanation,
    with open upper circumferences suggesting a creative Light-beam from the Father.
  language: English
  quote_policy: summarized
