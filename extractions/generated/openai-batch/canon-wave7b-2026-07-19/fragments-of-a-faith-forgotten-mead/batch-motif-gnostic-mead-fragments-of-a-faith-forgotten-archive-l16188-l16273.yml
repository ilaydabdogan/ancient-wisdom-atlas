  summary: The passage is a modern scholarly discussion of the Valentinian movement.
    It treats the reported Eastern and Western division of Valentinianism as uncertain,
    gives a conjectural date range for Valentinus, and lists several named leaders
    or associated teachers, including Secundus, Marcus, Ptolemaeus, Heracleon, Axionicus,
    Baidesanes, and Theodotus.
