  summary: The passage introduces the Marcionite movement before turning to Basilidian
    and Valentinian developments. It characterizes the Marcionite school as a prototype
    of modern criticism with more sweeping conclusions, including rejection of the
    Old Testament and certain Gospel-compilation documents. It then identifies Cerdo
    as a Syrian predecessor or preceptor of Marcion at Rome around 135 A.D., notes
    that Marcion’s fame eclipsed Cerdo’s, and says patristic writers often confused
    their teachings and identities.
