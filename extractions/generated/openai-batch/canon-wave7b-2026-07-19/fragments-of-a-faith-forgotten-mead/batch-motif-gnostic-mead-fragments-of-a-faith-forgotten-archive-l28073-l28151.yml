  summary: 'The passage offers a cautious scholarly reconstruction of the Pistis Sophia
    and related codices: inner teachings are described as intended for disciples rather
    than public circulation; the Greek treatise is conjectured to have been compiled
    by Valentinus from several scriptural traditions; a copy is imagined as carried
    up the Nile and translated into Coptic with mistakes, guesses, and possible orthodox
    additions; Pistis Sophia is briefly mentioned as reciting Psalms in her repentances,
    followed by Salomonic Odes.'
