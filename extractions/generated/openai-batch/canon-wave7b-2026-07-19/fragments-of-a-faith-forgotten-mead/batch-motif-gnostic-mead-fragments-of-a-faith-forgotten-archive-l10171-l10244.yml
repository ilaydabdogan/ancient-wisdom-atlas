  summary: The passage describes the Essenes or Healers as ascetic communities associated
    with the Dead Sea, reverent toward Moses and the Law, committed to purity, communal
    labor, celibacy in inner circles, ritual prayer, baptism, common meals, Sabbath
    observance, and guarded instruction in mysteries, angels, the Tetragrammaton,
    and angelic worlds. It also reports that some have supposed Jesus was connected
    with Essene doctrine and discipline.
