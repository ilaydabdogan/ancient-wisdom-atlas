  quote: '"destroy them in the smoke of their darkness and their evil fire"'
  summary: 'The passage describes a hierarchy in the punitive regions of the Midst:
    three hundred and sixty of the brood of Adamas, with five great rulers above them.
    Ieou orders the system, and Zorokothora, identified with Melchizedec, acts for
    the light-powers. Two great Lights descend at appointed times to collect purified
    light, but when they withdraw the Rulers rebel, attack the light-powers of souls,
    and carry off souls for destruction in darkness and fire. The passage then introduces
    durations of punishments in these regions and ties their ending to celestial movements
    involving Little Sabaoth/Zeus, the Ram of Bubastis/Aphrodite, and the Balance.'
