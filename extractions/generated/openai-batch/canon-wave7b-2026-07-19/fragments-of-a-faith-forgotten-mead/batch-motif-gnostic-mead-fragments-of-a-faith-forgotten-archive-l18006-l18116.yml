canonical_text:
  quote: ''
  summary: The passage frames the Sophia-Mythus as central to Gnostic mythological
    drama, describes Sophia or personified Wisdom as World-Soul dwelling in the Midst/Ogdoad
    between upper spiritual and lower psychic-material regions, presents her as mediatrix
    projecting ideas from the pleroma into the cosmos, and explains her fall, suffering,
    ignorance, purification, and redemption by Christ. It also lists several names
    and aspects of Sophia and compares the Gnostic problem of sorrow with Gautama
    Sakyamuni’s problem of sorrow.
  language: English
  quote_policy: summarized
