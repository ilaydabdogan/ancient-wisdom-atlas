canonical_text:
  quote: ''
  summary: The passage summarizes the opening of the Book of the Great Logos according
    to the Mystery. It identifies the text as a book of gnoses of the Invisible God
    and of the Gnosis of Jesus the Living One, through which hidden mysteries are
    revealed to the elect. Jesus is described as Saviour of Souls and Logos of Life,
    sent by the Father from the Light-world to mankind, and as teaching the disciples
    a single doctrine in which all Gnosis dwells. A dialogue follows in which Jesus
    blesses the one who crucifies the world rather than being crucified by it, explains
    that this person has found and fulfilled his Word, and answers the apostles’ request
    for instruction in the Life of the Father by describing purification of souls
    and becoming the Race of the Mind.
  language: English
  quote_policy: summarized
