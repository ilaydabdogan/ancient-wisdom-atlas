- id: obs:1
  text: A group described as teachers from the East, including Axionicus and Ardesianes
    or Bardesanes, say that the body of the Saviour was spiritual.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Holy Spirit, identified as Wisdom, came upon Mary; the power of the Highest,
    called the Workman’s art, also came so that the substance given to Mary might
    be fashioned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Imperfections on the plane of the aeons, the Ogdoad or Wisdom-without, and
    the Hebdomad are described as having been corrected or set right.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Workman was taught by Wisdom that he was not God alone and learned of
    a Better Deity.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Workman received elementary instruction and first initiation, and was
    taught the mighty mystery of the Father and the aeons, but could reveal it to
