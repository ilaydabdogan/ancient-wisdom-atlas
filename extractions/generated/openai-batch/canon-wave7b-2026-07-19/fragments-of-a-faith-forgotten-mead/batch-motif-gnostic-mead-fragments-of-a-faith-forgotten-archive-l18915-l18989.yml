canonical_text:
  quote: ''
  summary: The passage summarizes a Sophia myth in which Wisdom or the Holy Spirit
    comes upon Mary, the Saviour is born through Mary for the righting of earthly
    and psychic sufferings, and the Workman or Demiurge receives limited instruction
    from Wisdom about a higher deity and a mystery of the Father and aeons. It also
    describes successive correction of defects in higher planes and on earth, and
    compares Christ’s emanation for Wisdom-without with the Saviour’s birth for the
    soul.
  language: English
  quote_policy: summarized
