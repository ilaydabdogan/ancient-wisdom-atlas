  summary: The passage describes a supernal Man or Father whose body is related to
    aeons, worlds, light, Word, and Cross. His face is unknowable to outer worlds
    that seek it; his eyes and mouth penetrate cosmic regions. His hands manifest
    a ninefold Cross. The passage then identifies him as source of the Cross and of
    Silence, describes the Monad proceeding from him like a light-spark, lists nine
    received qualities or gifts, and says his Pleroma surrounds or transcends the
    Twelve Depths.
