canonical_text:
  quote: ''
  summary: The passage introduces Monoimus as an Arabian figure of the later second
    century known chiefly through Hippolytus and Theodoret. It summarizes his system
    as centered on the Heavenly Man, the universe, and the Son or perfect man, with
    ordinary humans as imperfect reflections. It then describes his number-theory
    and geometrical cosmology, including the five Platonic solids, a monad called
    iota, yod, and one horn, and associations with serpentine force, horn of plenty,
    the rods of Moses and Hermes, the decad, and Moses' rod bringing the plagues of
    Egypt.
  language: English
  quote_policy: summarized
