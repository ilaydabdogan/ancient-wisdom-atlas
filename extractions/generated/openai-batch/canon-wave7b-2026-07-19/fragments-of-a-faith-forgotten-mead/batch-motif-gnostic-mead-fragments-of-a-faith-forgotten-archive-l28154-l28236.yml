canonical_text:
  quote: ''
  summary: 'Mead discusses the translation, copying, transmission, and possible textual
    relationships of Coptic Gnostic manuscripts. He then summarizes scholarship on
    the schemes underlying Pistis Sophia, the Extracts, and The Book of the Great
    Logos, noting ordered cosmic evolution, altered involution, revelatory modifications
    concerning the three Spaces of the Inheritance, and the opening headings of a
    cosmic outline: the Ineffable, its Limbs, the Highest Light-world or Kingdom of
    Light, and the First Space of the Ineffable.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The translator is said to have translated or possessed translations of other
    similar documents styled The Books of the Saviour, from which passages were extracted
    and appended to the Pistis translation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mead states his opinion that The Books of the Saviour came from the literary
    workshop of Valentinus.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Coptic translator's manuscript is described as having been copied by an
    ignorant copyist who made many orthographic mistakes and worked hurriedly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Mead suggests that two copies were made and that pages from one copy were
    sometimes substituted for pages of the other, producing puzzling repetitions and
    lacunae.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The manuscript's later history is said to be impossible to conjecture, though
    Mead says it must have escaped Christian and Mohammedan fanatics and that some
    pages were lost.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The inferior manuscript of the Bruce Codex is said to have had somewhat similar
