canonical_text:
  quote: ''
  summary: 'The commentator disagrees with Schmidt that the manuscript is clear, orderly,
    and by a single author. He tentatively reconstructs an original apocalyptic basis:
    a series of visions of the inner ordering of things, recorded at different times
    by a Basilidian Gnostic seer. He then proposes that a later learned writer expanded,
    annotated, and unified this material into a cosmogonical and soteriological treatise,
    while acknowledging the difficulty of expressing such mysteries. He compares this
    redactional activity with Gnostic synthetic efforts associated with Valentinus
    and suggests a textual-history parallel with the Pistis Sophia original.'
  language: English
  quote_policy: summarized
