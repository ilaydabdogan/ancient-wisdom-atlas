canonical_text:
  quote: ''
  summary: The passage summarizes an explanation in which the Master has taken a third
    of the Rulers' power and converted it to a higher substance. Mary asks further
    about this removal. Melchisedec, called the Great Receiver or Collector of Light,
    gathers purified power back to the higher world as the spheres are quickened by
    Light. The Rulers' substance is described as bodily emissions that become soul-material.
    As their kingdom dissolves, the Rulers devour their own matter to prevent the
    formation and purification of souls. They fight against the Master's great soul
    as he passes through them, after which he changes their configurations, influences,
    revolution, circles, and path.
