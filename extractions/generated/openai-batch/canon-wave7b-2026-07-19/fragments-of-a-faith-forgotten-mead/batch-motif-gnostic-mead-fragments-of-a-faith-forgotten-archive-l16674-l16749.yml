canonical_text:
  quote: ''
  summary: The passage presents Valentinian fragments and commentary on the making
    of Adam or the primitive human form. The human creature, fashioned by fabricative
    powers, contains a hidden supernal seed or divine mind associated with the Logos
    or Heavenly Man; this causes the powers to fear and mar their work. The commentary
    explains the divine “name” as an indwelling nature and compares this idea to ancient
    views of statues, talismans, and amulets bearing supernal names. A second fragment
    begins with the claim that the heart becomes pure through the Good manifested
    through the Son, when evil essences are expelled.
  language: English
  quote_policy: summarized
