canonical_text:
  quote: ''
  summary: The passage introduces Heracleon as a Gnostic associated with the school
    of Valentinus and known mainly through fragments of a fourth Gospel commentary
    preserved by Origen. It dates the commentary to about 170-180 A.D., describes
    Heracleon’s exegesis as partly endorsed by Origen, and presents the Gnostics as
    formerly within the general Christian body but later excluded because they claimed
    Christ’s teaching contained wisdom beyond the majority’s comprehension. It concludes
    that Heracleon’s commentary stands between distinct Gnostic exegesis and General
    Christianity.
