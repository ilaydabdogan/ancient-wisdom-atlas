canonical_text:
  quote: ''
  summary: A fragment from the Acts of John presents a ritual hymn or dialogue in
    which an I-speaker makes paradoxical claims about having and not having houses,
    places, and temples; identifies itself as lamp, mirror, door, and way; commands
    the addressee to respond to its dancing and keep silence about mysteries; connects
    a danced action with the passion or suffering of the Man; identifies itself as
    the Word sent by the Father; teaches knowledge of suffering; and is followed in
    Mead's account by a doxology answered by disciples going round in a ring with
    Amen responses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The fragment opens with alternating short responses: Amen, a wish to be at-oned,
    and the I-speaker''s statement that it would at-one.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The I-speaker states paradoxically that it has no house, place, or temple
    and also has houses, places, and temples.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The I-speaker describes itself as a lamp to one who beholds it, a mirror to
    one who perceives it, a door to one who knocks, and a way to a wayfarer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The I-speaker commands the addressee to respond to its dancing, to see itself
    in the speaker, and to keep silence on the speaker's mysteries.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A danced action is linked with the addressee's passion or suffering of the
    Man, which the I-speaker is to suffer or perform.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A bracketed editorial note says that a mystery-drama of the crucifixion and
    piercing probably followed at this point.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: The I-speaker says the addressee could never have understood what the speaker
    suffers alone, identifies itself as the addressee's Word or Logos, and says it
    was sent by the Father.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The I-speaker says the addressee saw it as suffering and was shaken, offers
    itself as a couch on which the addressee may rest, and says its identity will
    be known when it departs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The I-speaker distinguishes what it now appears to be from what will be seen
    later and teaches that knowing suffering gives power not to suffer.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The I-speaker says it will teach what is unknown, calls itself the addressee's
    God and not the betrayer's, and says that in it the addressee should know the
    Word of wisdom.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Mead describes these as mutilated fragments of an inner Gnostic ritual and
    states that, in the quoted version, the hymn begins and ends with a doxology answered
    by disciples going round in a ring with Amen.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The doxology glorifies the Father, Word, Grace, Spirit, Holy One, glory, and
    Light in which no darkness dwells.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Mead notes that a description of the things done, as well as the things said,
    would help illuminate the meaning of the passion of the Christ in this ceremony.
  category: other
  evidence_refs:
  - ev:9
