  quote: ''
  summary: The passage describes measures of Light-time, the Light-kingdom and its
    inheritances, the Books of Ieou attributed to Enoch, Andrew’s difficulty believing
    in the disciples’ high destiny, and the Saviour’s rebuke and teaching that the
    addressees are divine beings from one substance who have undergone embodiment,
    struggle, purification, and transformation into pure light through the mysteries.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A measure of time is given in which a day of the Light equals a thousand years
    in the world, and a single year of the Light corresponds to a vast number of world-years.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Light-kingdom is described as having three Realms and Kings, and the mysteries
    of three Inheritances of Light are said to be exceedingly numerous.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The lower mysteries are said to be found in the two Books of Ieou, which Enoch
    wrote when the speaker communicated with him from the Tree of Knowledge and the
    Tree of Life in the Paradise of Adam.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Andrew expresses amazement and difficulty believing that people of the world
    can have such a high destiny and reach such lofty heights.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Saviour rebukes the addressees for ignorance and says they are Angels,
    Archangels, Gods, Lords, Rulers, Invisibles, beings of the Midst, beings on the
    Right, and Great Ones of the Light-emanations.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The addressees are described as being from one mass, one matter, one substance,
    and the same mixture.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The great Light-emanations are described as not having undergone sufferings,
    changes of region, division, pouring into different bodies, or affliction.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The addressees are described as purgations of the Treasure, the Right, invisibles,
    rulers, and all of them; they have undergone afflictions and tribulations through
    pourings into different bodies in the world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The addressees are said to have struggled and fought, renounced the world
