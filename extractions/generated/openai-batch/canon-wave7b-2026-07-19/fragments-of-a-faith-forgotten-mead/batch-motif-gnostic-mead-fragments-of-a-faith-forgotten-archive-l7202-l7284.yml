canonical_text:
  quote: ''
  summary: The passage turns from Greece to Egypt as background for Gnosis. It describes
    Egyptian wisdom passing to Greece through translations associated with Manetho,
    Plutarch’s treatment of the Mysteries of Isis, and Greek Trismegistic or Hermetic
    literature. It presents Thoth or Tehuti as the God of Wisdom and source of priestly
    inspiration, explains the Greek identification of Tehuti with Hermes Trismegistus,
    notes Egyptian roots for doctrines also found in Gnostic Christianity, and gives
    an example of Egyptian syncretism involving Hyksos or Semitic influence, Seth,
    and Sothis/Sirius as Egypt’s guardian star.
  language: English
  quote_policy: summarized
