canonical_text:
  quote: ''
  summary: The passage introduces extra-canonical Sayings-of-the-Lord or Logoi, describes
    them as oracular utterances and discusses their selection or rejection in relation
    to canon formation. It then gives selected sayings on reciprocal mercy and judgment,
    Wisdom sending forth children, nearness to the speaker as nearness to fire and
    kingdom, the little and great mystery, attaining the speaker through pain and
    suffering, good and evil coming through agents, and the weak being saved by the
    strong.
  language: English
  quote_policy: summarized
