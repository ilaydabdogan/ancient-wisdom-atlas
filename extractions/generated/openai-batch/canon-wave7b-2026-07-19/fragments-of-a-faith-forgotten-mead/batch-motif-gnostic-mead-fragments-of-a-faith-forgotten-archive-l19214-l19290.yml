canonical_text:
  quote: ''
  summary: 'The passage presents Mead''s account of Marcosian number-symbolism: the
    document''s inspiration is ascribed to the Supernal Four, which reveals itself
    in feminine form because mortals cannot bear its masculine greatness; Mead compares
    this to an Indian Deva/Shakti pattern. The passage then describes the Supernal
    Father uttering a Word like himself, and explains the Great Name as four sounds
    totaling thirty elements. Each element has its own utterance and form but does
    not know the whole sound to which it belongs, so it treats its own utterance as
    the whole Name.'
  language: English
  quote_policy: summarized
