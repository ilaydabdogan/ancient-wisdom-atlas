canonical_text:
  quote: ''
  summary: 'The passage describes the Great Ruler being instructed, frightened, and
    confessing his sin of boasting. This instruction spreads through the Ogdoad, where
    the Mystery becomes known. The Gospel then comes to the Hebdomad: light passes
    from the Son of the Great Ruler to the Son of the lower Ruler, who becomes illumined
    and preaches to his Ruler, causing that Ruler also to fear and confess. The sublunary
    spaces are enlightened, and the passage turns toward the illumination of the formlessness
    of the world and revelation of the Mystery to the Sonship left behind there.'
  language: English
  quote_policy: summarized
