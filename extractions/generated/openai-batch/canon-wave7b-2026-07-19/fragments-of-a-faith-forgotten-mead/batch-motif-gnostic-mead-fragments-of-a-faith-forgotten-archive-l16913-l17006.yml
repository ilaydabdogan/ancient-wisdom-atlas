canonical_text:
  quote: ''
  summary: 'The passage presents several fragments and scholarly comments concerning
    Valentinus: a statement contrasting productions from a pair with those from a
    single aeon; a note linking this to Sophia''s fall and the origin of the phenomenal
    universe; a fragment on public volumes, the Church of God, and the People of the
    Beloved; a doubtful report on Galileans and the doctrine of natures; and a report
    that Valentinus saw and questioned a newborn child who identified itself as the
    Logos, after which he attached a tragic myth that may relate to the Sophia myth.'
  language: English
  quote_policy: summarized
