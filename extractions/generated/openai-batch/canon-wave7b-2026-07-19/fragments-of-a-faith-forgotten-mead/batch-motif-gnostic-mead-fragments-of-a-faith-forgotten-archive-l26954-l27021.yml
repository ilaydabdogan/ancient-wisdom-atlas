canonical_text:
  quote: ''
  summary: 'The passage summarizes the close of a hymn in which the Father withdraws
    into the Universal Idea while leaving the Little Idea for manifestation. It then
    summarizes appended fragments: a praise hymn to the Mystery, an account of the
    Mystery becoming oceanic water and purifying or sealing the sea, and a description
    of the soul passing through daemonic regions by means of imperishable names. It
    also notes a wrathful Great Powerful Ruler on the Way of the Midst and a codicological
    difference in the fragment leaves.'
  language: English
  quote_policy: summarized
