canonical_text:
  quote: ''
  summary: The passage presents headings contrasting the Unmanifested and the Manifested/Pleroma.
    It describes an ineffable eternal Father as source of all, from whom names, aeons,
    worlds, life, the Word-mediated Pleroma, and the emergence of that-which-is-not
    are related. The All rejoices with the Father and produces myriads of aeons called
    Births of Joy; the Cross and Man arise from these worlds or incorporeal members.
    Outer worlds desire to see the invisible Father. Forethought acts through the
    Father's breath, and that-which-is-not arises through his will.
  language: English
  quote_policy: summarized
