canonical_text:
  quote: ''
  summary: The passage describes a contemplative movement beyond thought and symbols
    into divine Silence and union, then outlines Valentinian cosmological language
    of Bythus or the Abyss, hierarchies of Deeps, Pleroma, aeons, boundaries, and
    the Kenoma or phenomenal deficiency. It also discusses visionary symbolic exposition
    and compares this with Pythagorean and Platonic doctrines of geometrical matter
    and the five regular solids.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mind is described as unable to comprehend further, while the spirit within
    urges onward beyond, after which words, symbols, and thoughts cease and the spirit
    rests in union with the Divine and the Great Deep.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says some Valentinians taught of a Beyond the Deep and a hierarchy
    of Deeps, with related hierarchies said to appear in the Codex Brucianus and to
    be assumed in the Pistis Sophia treatise.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage rejects seeking a beginning in infinitude and distinguishes the
    beginning of a special phenomenal universe from infinitude itself.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Beyond the Pleroma, the passage places silences more unspeakable than Silence
    and depths deeper than the Deep, while warning against reducing this intuition
    to monistic or dualistic theory.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A highest Boundary is described as shutting off the Pleroma from the Depth
    beyond Being, and the Great Boundary is described in relation to the phenomenal
    external world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Pleroma is called the Fullness of Being, its beings are aeons or eternities
    outside time and space, and what is outside the Pleroma is called image, deficiency,
    Kenoma, or Emptiness.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage states that Gnostic expositions were attempts to describe a living
    symbol shown in vision, received from above, and brought down into matter.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Pythagoras, Plato, and Mystery instructors are said to have declared that
    physical matter is geometrical; the five regular solids are described as central
    to Platonic geometrical knowledge and as lying behind material formation.
  category: speech
  evidence_refs:
  - ev:8
