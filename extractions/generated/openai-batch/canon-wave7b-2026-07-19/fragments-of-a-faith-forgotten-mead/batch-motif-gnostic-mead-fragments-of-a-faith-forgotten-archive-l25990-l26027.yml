canonical_text:
  quote: ''
  summary: The passage summarizes a section in which Jesus promises qualified followers
    further mysteries of the Light-treasure, including guardians, gates, invocations,
    trees, voices, powers, and the Great Name. A supreme Mystery of the Forgiveness
    of Sins is said to transform the soul into pure light. Such souls are described
    as already sharing the Light-treasure and, after death, passing through opened
    gates and successive orders by receiving seals, the Great Name, and master-words.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: People described as having abandoned worldly things, kept commandments, and
    followed Him The Greater for twelve years are promised additional mysteries by
    Jesus.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One promised mystery concerns Nine Guardians of the three Gates of the Light-treasure
    and an invocation that enables passage through their spaces.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Other listed mysteries include the Child of the Child, the Three Amens, the
    Five Trees, the Seven Voices, the Forty-nine Powers, and the Great Name or Great
    Light.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The master-mysteries of the Light-treasure are identified as the Five Trees,
    the Seven Voices, and the Great Name.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A supreme Mystery of the Forgiveness of Sins is described as bestowing the
    other mysteries and transmuting the soul into pure light for reception into the
    Light of lights.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Such souls are described as having inherited the Kingdom of God while on earth,
    sharing in the Light-treasure, and being immortal Gods.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: At death, when these souls leave the body, the Aeons disperse and flee westward
    and to the left until the souls arrive at the Gates of the Light-treasure.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Gates are opened to the souls, and the Wardens give them seals and their
    Great Name.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The souls pass successively through various Orders, receiving successive seals
    and master-words, and move inward into the Five Trees and Seven Voices.
  category: sequence
  evidence_refs:
  - ev:6
