  quote: ''
  summary: 'The passage presents Philo''s account of the Therapeuts: they reject external
    worship, seek inner sight of the true Deity, are moved by heavenly love, renounce
    possessions and family ties, and withdraw from cities to solitary retreats outside
    the walls. Mead notes Philo''s contrast between their orderly renunciation and
    Greek legends about philosophers who neglected their estates through love of wisdom.'
