canonical_text:
  quote: ''
  summary: The passage closes a discussion of Valentinus by warning that summaries
    of Valentinian doctrine do not securely preserve Valentinus's own teaching. It
    uses the image of Ariadne's thread, a maze, clues, a key, and a treasury to describe
    how ideas rather than names should guide interpretation of Gnostic systems. It
    then introduces outlines of Valentinian aeonology by asking the reader to pass
    in thought from earth through heavenly and starry regions to the Great Firmament
    or Ring Pass Not, a boundary between the phenomenal universe and a reality beyond
    space and time, described paradoxically as the Living Aeon, Light-world, and Pleroma.
  language: English
  quote_policy: summarized
