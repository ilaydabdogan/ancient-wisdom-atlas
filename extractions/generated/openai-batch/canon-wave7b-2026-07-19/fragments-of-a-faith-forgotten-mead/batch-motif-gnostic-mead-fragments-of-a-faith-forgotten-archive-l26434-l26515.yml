canonical_text:
  quote: ''
  summary: The passage summarizes gnostic material in which Jesus speaks of the Mystery
    of the Forgiveness of Sins, three Rulers of the Light, passage through aeonic
    spaces, seals and names, and then introduces Ieou/Jeu as the True God or Demiurgos
    of the middle Light-world. Mead also offers a speculative comparison between Ieou/Iao
    and the Semitic tetragrammaton, and describes Jesus taking disciples through inner
    spaces of the unseen world to the plane of the True God, where Ieou is shown as
    an emanation from the Treasures of the Father.
  language: English
