- id: obs:1
  text: A ceremonial act called the Mystery of Withdrawing the Evil of the Rulers
    is described as an elaborate incense-offering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prayer asks Sabaoth Adamas and his chiefs to take away the evil or naughtiness
    of the Rulers from the disciples.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the end of the rite the disciples are sealed with the seal of the Second
    Amen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the sealing, the Rulers no longer have power over the disciples, who
    are described as immortal and able to follow Jesus into all spaces where they
    would go.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Jesus has given the disciples mysteries of baptisms, invocation of powers,
    numbers, seals, and authentic names, and promises apologies or formulae for entering
    and passing through the powers' realms.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When out of the body, the disciples can pass through realms of six Aeons associated
    with Sabaoth Adamas, whose rulers and indwellers disperse before them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: At six great Aeons associated with Iabraoth, the disciples will be detained
    until they receive the Mystery of the Forgiveness of Sins.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Mystery of the Forgiveness of Sins is located in the interior of the interior
    of the Treasures of Light and is called the perfect salvation of the soul.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Mystery of the Forgiveness of Sins enables passage into the Aeons of the
    Invisible God, beyond the elements of water, fire, and air or aether.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: With the rite of this mystery, Aeons withdraw to the west and left like veils
    before the eyes, and the disciples' ascended ways are purified by the Light of
    the Light-treasure.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The exterior of the Light-treasure, identified as the Space of the Thirteenth
