canonical_text:
  quote: ''
  summary: 'The passage summarizes rites and mysteries taught by Jesus to the disciples:
    an incense-offering for withdrawing the evil of the Rulers, sealing with the Second
    Amen, instruction in baptisms, invocations, numbers, seals, names, apologies,
    and the Mystery of the Forgiveness of Sins. These mysteries enable the disciples,
    when out of the body, to pass through aeonic realms, have powers withdraw before
    them, become pure light, ascend to the Light-treasure, and be admitted by the
    Guardians of its Gates.'
  language: English
  quote_policy: summarized
