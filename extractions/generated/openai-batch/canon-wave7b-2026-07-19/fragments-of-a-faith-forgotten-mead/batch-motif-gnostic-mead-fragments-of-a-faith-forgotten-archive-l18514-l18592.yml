canonical_text:
  quote: ''
  summary: The passage describes Spirit ascending within the Boundary, the aeons in
    the Pleroma jointly emanating the Common Fruit named Jesus, and Wisdom-without-the-Pleroma
    becoming fearful and sorrowful after the Christ and Holy Spirit withdraw. In response
    to her prayers, the aeons send the Common Fruit as her consort and corrector,
    who separates her passions and transforms them into psychic, hylic, daemonian,
    and upward-repentant principles. Mead’s commentary identifies the episode with
    the enforming of cosmic substance and compares human passions with passions of
    the cosmic soul.
  language: English
  quote_policy: summarized
