canonical_text:
  quote: ''
  summary: The passage presents Basilidian teaching, as mediated by Hippolytus and
    Mead, on the insufficiency of names for realities beyond the manifested universe,
    the state of non-being beyond all categories, and the emergence of universality
    as a Seed containing all potential worlds. The Seed is compared to a mustard seed
    containing an entire plant and future seeds. The narrator also compares this concept
    to Mulaprakriti and to Christian creation out of nothing.
  language: English
  quote_policy: summarized
