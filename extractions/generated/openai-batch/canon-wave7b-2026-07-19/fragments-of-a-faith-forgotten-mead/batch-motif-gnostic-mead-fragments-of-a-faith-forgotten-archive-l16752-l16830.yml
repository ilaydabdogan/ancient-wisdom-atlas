canonical_text:
  quote: ''
  summary: The passage presents a Valentinian allegory of the heart as a neglected
    inn filled with uncleanness and daemons until the Alone Good Father sanctifies
    it with light. The surrounding commentary compares this doctrine with Basilides,
    Isidorus, Egyptian heart doctrine, the Upanishads, and Indian yoga. It also cites
    Valentinus on Jesus attaining godship through self-denial, continence, and incorruptibility
    of food in the body.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The heart is compared to an inn or caravanserai with holes and gaps in its
    walls, filled with dung and occupied by people living filthily in it as if it
    belonged to someone else.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The untended heart is described as unclean and as the abode of many daemons,
    glossed in brackets as elemental essences.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the Alone Good Father has regard for the heart, it is sanctified and
    shines with light.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The person who possesses such a heart is called blessed and is said to see
    God.
  category: attribute
  evidence_refs:
