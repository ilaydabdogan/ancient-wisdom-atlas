canonical_text:
  quote: ''
  summary: The passage summarizes Mead's account of Cainite traditions concerning
    Paul, Judas, Jesus, Christ, and the powers of generation. It reports a Pauline
    heavenly ascent tradition, contrasts negative and positive traditions about Judas,
    and describes Cainite interpretations in which Judas understands the true God,
    assists or brings about Jesus' handing-over, and in one mystical version helps
    effect the salvation of the world through Christ's betrayal to the cross or incarnation.
  language: English
  quote_policy: summarized
