    a previous dead state.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that the final revelation was not fully disclosed in treatises
    but was communicated orally in the body and by vision out of the body.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage reports a custom of dividing mankind into three classes: hylics,
    psychics, and pneumatics.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hylics are described as dead to spiritual things and like unperceptive matter;
    psychics as believers needing miracles and signs; pneumatics as capable of knowledge
    of spiritual matters and able to receive Gnosis.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The same classification is said to apply among powers, and Old Testament prophets
    as instruments of such powers are said to be sorted into an order of dignity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage describes divergent Gnostic opinions about Jesus, ranging from
