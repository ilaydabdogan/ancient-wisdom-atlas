canonical_text:
  quote: ''
  summary: 'The passage describes fleshly human birth as a fall from Adam into the
    earth and an inversion of right and left in the lower world. A commentary identifies
    the Jonah myth as an initiatory type involving three days in Sheol or Hades before
    preaching to Nineveh, identified with the world below. The speaker then gives
    restricted instruction on the Mystic Cross: his reversed hanging represents the
    first man’s birth into destruction, while a Power from Above descends and restores
    proper order through the Cross. The brethren are exhorted to convert their nature,
    ascend the Cross with Christ, and understand the straight stem and cross-piece
    as figures of Word, Voice, and human nature.'
  language: English
  quote_policy: summarized
