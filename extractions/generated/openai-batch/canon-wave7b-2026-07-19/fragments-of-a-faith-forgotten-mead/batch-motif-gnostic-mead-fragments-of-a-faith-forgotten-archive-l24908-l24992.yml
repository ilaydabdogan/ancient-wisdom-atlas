canonical_text:
  quote: ''
  summary: The passage summarizes teachings from the Pistis Sophia on the soul’s ascent,
    the need for seals and apologies for those with lower mysteries, Mary’s interpretation
    of a judicial saying as referring to transmigration and the Virgin of Light, and
    the baptismal mysteries as a wise fire that burns sins stamped on the soul by
    the counterfeit spirit and separates soul and power from body, destiny, and counterfeit
    spirit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A soul associated with the light becomes a glorious light-stream, passes upward
    to its inheritance, and is aided by receivers who become wings and a vesture of
    light for it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A soul that has received only the lower mysteries requires apologies and seals,
    and the Master says there are spaces to be traversed and rulers involved.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Mary compares some statements with former sayings and interprets the saying
    about enemy, judge, officer, prison, and payment as referring to the Judge, the
    Virgin of Light, and the soul’s recasting into another body.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that no soul is free from transmigration until it shows
    signs of being in its last cycle.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mary asks about the mysteries of the baptisms that remit sins, and the Master
    replies.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The counterfeit spirit bears witness to every sin committed by the soul and
    stamps or seals every sin upon it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rulers of the punishments of sinners know and chastise the sinful soul according
    to the number of seals stamped on it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The mysteries of the baptisms become a mighty, fierce, wise fire that secretly
    enters the soul and devours the sins implanted by the counterfeit spirit.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After purifying the sins, the mysteries enter the body occultly, pursue the
    pursuers, and separate counterfeit spirit and destiny from the soul and power.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The counterfeit spirit, destiny, and body are placed in one group, while the
    soul and power are placed in another; the mystery of baptism remains between them
    and keeps the soul and power from being fouled in matter.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage adds that the twelve and other mysteries of the First Mystery
    and the Ineffable are higher than the mysteries of baptism.
  category: other
  evidence_refs:
