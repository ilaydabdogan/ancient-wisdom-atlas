canonical_text:
  quote: ''
  summary: The passage describes tensions over circumcision and early Christian heresy,
    the narrowing of the Jerusalem church, the growth of educated and liberal Christian
    views through contact with other traditions, orthodox suspicion of those views,
    and the later condemnation of Origen. It then presents the Alexandrian school
    of Christian philosophy, associated with Clemens and Origen, as foundational for
    general Christian theology and shaped by Grecian thought. A story is given of
    the Didascaleion, a Christian Sunday-school for children in Alexandria near the
    Museum, from which Catholic theology is said to have arisen. The passage closes
    by placing major Gnostic doctors in outer contact with Alexandria’s cosmopolitan
    world of schools and with wider regions around the ancient Mediterranean.
  language: English
  quote_policy: summarized
