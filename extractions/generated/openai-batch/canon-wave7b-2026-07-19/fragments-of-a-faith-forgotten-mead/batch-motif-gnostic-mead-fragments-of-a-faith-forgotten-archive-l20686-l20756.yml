canonical_text:
  quote: ''
  summary: Bardesanes presents Free-will, Fortune, and Nature as real but non-absolute
    factors. God alone is fully powerful, having established the worlds, created humanity,
    ordained Governors, and given limited powers to cosmic and living orders. Fortune
    is described as an ordered procession affecting intelligences, souls, and embodied
    assemblages, which are being sifted and purified by divine favor and grace until
    consummation. Nature governs bodily limits such as procreation, aging, food, and
    drink.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person is said to act by his own Free-will, while faults, defects, and evil
    things that happen to him are received as punishment from God.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Bardesanes says the three sects under discussion are partly true and partly
    false.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wisdom of God is said to have established the worlds, created man, ordained
    the Governors, and given all things suitable power.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: God, Angels, Powers, Governors, Elements, men, and animals are said to have
    power, but the listed orders do not have power in everything; only the One is
    powerful in everything.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that Fortune exists, as the Chaldaeans say.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Everyday experience is used to state that Free-will is not absolute; Fortune
    and Nature also play parts, but are not absolute.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:7
  text: Men are described as governed by Nature equally, by Fortune differently, and
    by Free-will according to each person's wishes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Fortune is called an order of procession given by God to the Powers and Elements.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Intelligences are changed by coming down to be with the soul, and souls are
    changed by coming down to be with the body.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The alteration of this assemblage is called Fortune and Nativity, and the
    assemblage is described as being sifted and purified with divine assistance until
    the consummation of all.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:11
  text: The body is said to be governed by Nature, while the soul suffers with it
    and perceives.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'Fortune is said not to override all bodily conditions: procreation has age
    limits, old age removes procreative power, and Fortune cannot give children when
    the body lacks the Nature to do so.'
  category: relationship
  evidence_refs:
  - ev:5
