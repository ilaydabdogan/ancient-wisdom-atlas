canonical_text:
  quote: ''
  summary: The passage describes a Sophia-myth in which the Workman fashions the world
    while unknowingly energized by Wisdom, the Mother and Ogdoad. It states that the
    Prophets and Law spoke from the Workman and did not reveal the mysteries. The
    passage then explains the birth of Jesus through Mary as involving both Wisdom
    or Holy Spirit and the Workman or Highest, making Jesus a heavenly word from the
    Ogdoad. Mead comments that Jesus is presented as the perfected man who transcends
    rebirth. The passage also reports disagreement between Anatolic and Italic teachings,
    including an Italic view that the Spirit like a dove descended at baptism and
    united with Jesus' psychic body.
  language: English
  quote_policy: summarized
