canonical_text:
  quote: ''
  summary: The passage summarizes Ptolemy’s teaching that Moses’ inspiration came
    from an intermediate world-soul or fabricative power rather than from the Perfect
    Deity. It sets out a hierarchy among the supreme God, the world-maker, and an
    opposing destructive world of darkness, then describes cosmic spaces of the ingenerable
    Father as incorruptible Light differentiated into soul and body, with the planetary
    soul enforming earth.
  language: English
  quote_policy: summarized
