canonical_text:
  quote: ''
  summary: 'The passage presents a scholarly account of Greek religious and philosophical
    development: the rise of philosophy, revival of Orphic tradition, increased activity
    in the Mysteries, and a claimed lineage from Orpheus through Pythagoras and Plato.
    It then discusses speculative prehistoric traditions from Sais, Solon, and Plato
    about ancient Attica, the destruction of the Atlantic Island by a great flood
    and seismic disturbances, population displacement in Hellas, Pelasgian or autochthonous
    occupation, comparison with ancient Aryans in India, and possible cult-mixtures
    involving Atlantean introduction of the cults of Poseidon and Hephaestus.'
