canonical_text:
  quote: ''
  summary: The opening of the hymn presents a first-person speaker who, as a child
    in a royal Father's house, is equipped and sent from the eastern home by parents.
    The parents provide a large but light load from the treasury, including precious
    metals and stones, gird the speaker with adamant, and remove a bright robe. Editorial
    notes identify the East with spiritual realms, the treasury as a Gnostic technical
    term, the geographic names as allegorical substitutes for higher regions, and
    adamant as a symbolic vesture.
  language: English
  quote_policy: summarized
