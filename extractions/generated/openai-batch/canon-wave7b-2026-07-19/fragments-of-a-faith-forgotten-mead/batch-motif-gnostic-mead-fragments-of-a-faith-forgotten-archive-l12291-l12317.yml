canonical_text:
  quote: ''
  summary: 'The passage summarizes an anonymous system from Irenaeus: in the Unutterable
    Depth are the First Man/Father, the Son/Second Man, and the Holy Spirit/First
    Woman/Mother. Below them is a sluggish mass of Water, Darkness, Abyss, and Chaos.
    The Universal Mother broods over the Waters; the First and Second Man produce
    Christ from her, and Christ ascends to form the Holy Church with them. A contrasting
    left-hand descent follows: a Drop of Light falls into chaotic matter and is called
    Sophia or Wisdom. Waters form for Sophia a body, the Heaven-sphere; she leaves
    it and ascends to a Middle Region below the Universal Mother. By contact with
    Space-Waters she generates a son, the chief Creative Power of the Sensible World,
    though the passage ends mid-sentence.'
  language: English
  quote_policy: summarized
