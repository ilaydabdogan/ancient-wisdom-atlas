canonical_text:
  quote: ''
  summary: The passage gives a discourse on finding the mysteries and words of several
    cosmic Spaces. The person who finds these mysteries is described as blessed, divine,
    a saviour, free of every space, identified with or superior to the Pleroma, and
    equal to the Chief. The discourse links the universe's being to these words and
    mysteries and calls the teaching the gnosis of the Gnosis of the Ineffable. A
    following extract begins by saying that after Jesus was crucified, he rose from
    the dead on the third day and the disciples came to him asking mercy.
