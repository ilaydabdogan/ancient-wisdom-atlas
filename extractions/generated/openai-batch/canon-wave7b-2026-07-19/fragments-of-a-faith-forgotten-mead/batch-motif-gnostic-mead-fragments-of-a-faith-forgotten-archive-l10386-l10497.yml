  summary: The passage characterizes Gnosticism as a rapid theologizing or systematizing
    of Christianity, describes the Gnosis as pre-Christian and illumined by Christ,
    and says Gnostics claimed both public sayings and hidden inner teachings. It contrasts
    Gnostic allegorical and critical treatment of the Old Testament with Catholic
    literal acceptance, subordinates Yahweh or the Demiurgos to a transcendent Mystery
    God, and presents inner doctrine as reserved for the worthy or true Gnostic.
