canonical_text:
  quote: ''
  summary: 'The passage discusses Bardaisan/Bardesanes, a tripartite scheme relating
    Nature, Fate or Fortune, and Free-will to body, soul, and spirit, and the attribution
    of the Syriac “Hymn of the Soul” to Bardaisan. It reports scholarly arguments
    that the poem reflects doctrines ascribed to Bardaisan by Ephraim: denial of bodily
    resurrection, a divine Mother and Father of Life producing the Son of the Living,
    and subordinate eternal beings. It also summarizes the poem’s imagery of a prince
    wearing and discarding Egyptian garb, and of the soul’s true heavenly clothing.'
  language: English
  quote_policy: summarized
