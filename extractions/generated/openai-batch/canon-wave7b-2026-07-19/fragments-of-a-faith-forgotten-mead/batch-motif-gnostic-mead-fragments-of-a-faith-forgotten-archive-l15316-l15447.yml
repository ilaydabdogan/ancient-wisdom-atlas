canonical_text:
  quote: ''
  summary: 'The passage describes Basilidian cosmology and soteriology: the earth-stage
    follows a plan laid down by the God beyond being; the remaining third Sonship
    or Sons of God must be manifested and restored above; divine sparks within humans
    perfect downward-tending souls; the Gospel/Gnosis enters the universe as a hidden
    mystery, is compared to distant ignition by fire, passes through cosmic ranks,
    and instructs the Great Ruler of the Ogdoad, who learns he is not the highest
    God and begins to grow wise.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Things on earth are said to occur according to a plan laid down by the God
    beyond being when he deposited the universal Seed, without a special earthly chief,
    manager, or creator.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The earth-stage is described in the exposition as the moment between past
    and future, the turning-point of choice, and the field of new karman.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the supercosmic planes and universe are completed, a remaining third
    Sonship is said to remain in the universal Seed and to require manifestation and
    restoration above the highest Firmament.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Sons of God are identified as divine sparks or real spiritual men within,
    left in the seed-mixture to order, inform, correct, and perfect souls that tend
    downward.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Before the Gospel/Gnosis, the Great Ruler of the Ogdoad was considered the
    only God, while Moses and the Prophets are associated with inspiration from the
    Hebdomad.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Gospel is described as a mystery previously unknown to nations, the Hebdomad,
    the Ogdoad, and their Rulers.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: When the time for revelation arrives, the Gospel enters the universe and passes
    through principalities, authorities, lordships, and titles.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage denies that anything literally came down from above and instead
    compares the process to vapour of naphtha catching fire from a distant flame,
    with spiritual powers passing from below upward to the Sonship.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Son of the Great Ruler catches fire, as it were, seizes ideas from the
    blessed Sonship beyond the Limitary Spirit, and transmits the Gospel to the Great
    Ruler.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Great Ruler learns that he is not God over all, recognizes a higher ineffable
    Treasure and Sonship above him, repents, fears, and begins to grow wise through
    instruction by the Christ sitting by him.
  category: sequence
  evidence_refs:
  - ev:7
