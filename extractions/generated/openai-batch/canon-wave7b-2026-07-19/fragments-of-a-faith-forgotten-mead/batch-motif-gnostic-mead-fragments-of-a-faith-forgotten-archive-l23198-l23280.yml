  quote: ''
  summary: The passage describes Jesus/the Master choosing and implanting heavenly
    powers in the Twelve, John the Baptizer bearing a power and the reborn soul of
    Elias, Mary receiving powers associated with Jesus' birth, and the Master putting
    on a vesture containing mysteries. It then recounts a stream of light descending
    with the vesture, the five mystery words written in it, an interpretation of the
    Mystery beyond the world, and a hymn of welcome by powers at the investiture or
    supreme initiation, where limbs or fellow-members are gathered in unity.
