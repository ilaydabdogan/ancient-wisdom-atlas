canonical_text:
  quote: ''
  summary: The passage recounts the Father sending the Holy Spirit to Jesus in the
    form of a dove. Jesus explains fire, water, wine, blood, and Spirit as mysteries
    connected with cleansing sins and bringing souls into the region of Light. The
    disciples return to the Mount of Galilee, where Jesus celebrates a mystic eucharist
    and the first Baptism of Water. The disciples ask about further baptisms, chrism,
    and the Mystery of the Light of the Father; Jesus says these mysteries are unsurpassed
    and bring souls into the Light of lights and regions of Truth.
  language: English
  quote_policy: summarized
