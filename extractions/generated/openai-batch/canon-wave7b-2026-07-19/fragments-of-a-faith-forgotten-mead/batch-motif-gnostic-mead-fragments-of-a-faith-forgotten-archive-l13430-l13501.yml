  summary: The passage introduces the Docetae as a Gnostic school reported by Hippolytus,
    notes uncertainty about chronology and naming, and summarizes a cosmology in which
    a Primal Being is symbolized by fig-tree seed and mathematical point. From this
    source an ideal aeonic world emanates before the sensible world, with three male-female
    root-aeons and sub-aeons. Self-generating aeons unite to produce, from the One
    Virgin understood as ideal cosmic substance, the Alone-begotten Saviour or perfect
    aeon who contains the powers of the ideal aeon-world.
  language: English
