  quote: ceased from Ignorance, and ascended from Death unto Life
  summary: 'The passage summarizes Marcosian Gnostic number-symbolism: Christ descends
    so humans may know him and ascend from death to life; Jesus is described as a
    chosen and perfected vehicle for higher powers; Gospel birth and baptism elements
    are mapped onto aeonic tetrads; the dove’s descent and ascent completes Jesus
    into Christ; and aeonic number-patterns are traced into elements, qualities, spheres,
    and luminaries.'
  language: English
