- id: obs:2
  text: The framing prose states that, for Gnostics, the Cross symbolized cosmic processes,
    the crucifixion of the soul in matter, and regeneration.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the Address is put into Andrew's mouth, has been worked over
    by Catholic scribes, and derives underlying material from a Gnostic circle of
