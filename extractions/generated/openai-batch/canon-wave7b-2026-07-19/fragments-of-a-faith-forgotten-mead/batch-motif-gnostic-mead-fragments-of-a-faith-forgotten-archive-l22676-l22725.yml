canonical_text:
  quote: ''
  summary: Mead introduces an Address to the Cross from the Acts of Andrew and frames
    it as relevant to Gnostic ideas about the Cross. The quoted address, placed in
    Andrew's mouth, praises the Cross as life-giver, cosmic structure reaching heaven,
    earth, and the deep, instrument of salvation, life-giving tree, bearer of Christ
    and the Thief, and means by which the worthy and sinners are brought to God or
    summoned home.
  language: English
  quote_policy: summarized
