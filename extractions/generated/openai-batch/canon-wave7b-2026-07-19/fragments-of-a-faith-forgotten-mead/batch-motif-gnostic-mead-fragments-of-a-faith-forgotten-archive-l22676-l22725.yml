  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker comes rejoicing to the Cross, calls it life-giver, says he knows
    its mystery, and says it was planted in the world to make unstable things fast.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Cross is described with a head stretching into heaven to symbolize the
