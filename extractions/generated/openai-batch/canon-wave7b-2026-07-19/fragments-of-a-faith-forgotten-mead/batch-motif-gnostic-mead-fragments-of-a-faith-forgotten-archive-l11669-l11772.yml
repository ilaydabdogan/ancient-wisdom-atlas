canonical_text:
  quote: ''
  summary: 'The passage describes a symbolic Fire-tree whose outer parts are burned
    while perfected fruit is stored in a treasure-house. Mead then comments that this
    symbolism has points of contact with Coptic Gnostic Trees and Treasures and with
    Chaldaean and Zoroastrian Logia. The passage next quotes The Great Announcement,
    presenting two aeonic growths from one Root: a male Great Power or Universal Mind
    from above and a female Great Thought from below. Their union manifests a Middle
    Space or Air in which a sustaining Father appears. The text repeatedly states
    that Power and Thought are one, yet appear as two when separated.'
