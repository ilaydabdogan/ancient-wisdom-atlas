  quote: ''
  summary: 'The passage begins with a prayer addressing God, Jesus, Christos, and
    Lord as righteous, all-seeing, ever-present protector of servants. Mead then introduces
    the well-known humorous story of John and the bugs from the Acts of John: John
    and companions lodge in an uninhabited caravanserai, John orders the bugs away
    for the night, they obey and later return when commanded, and John uses their
    obedience as a rebuke to human disobedience toward God.'
