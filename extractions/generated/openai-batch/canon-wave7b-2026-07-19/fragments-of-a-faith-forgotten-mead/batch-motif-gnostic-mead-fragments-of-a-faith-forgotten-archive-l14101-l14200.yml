literal_observations:
- id: obs:1
  text: Volkmar is said to identify the festival at Same as a moon-god festival accompanied
    by licentious rites, called Epiphany in connection with Epiphanes, interpreted
    as the newly appearing new moon.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Clement of Alexandria was misled by similar names and stories
    of licentious rites and transmitted a scandalous libel.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Clement is reported to have seen a Carpocratian treatise On Justice and to
    have ascribed it to Epiphanes, while the passage doubts that such a young person
    could have written it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Carpocratians or Harpocratians are described as a Gnostic circle in Alexandria
    at the beginning of the second century.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The community is described as concerned with communism, influenced by early
    Christian circles, Plato, Pythagorean and Platonic discipline, and teachings of
    Jesus.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:5
- id: obs:6
  text: The passage states that, in their theory, private property was treated as
    the origin of human misery and that community of everything, including wives and
    husbands, was proposed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states there is no reliable evidence that these Gnostics practiced
    the communal ideas, and it treats accusations of orgies as polemical or as possibly
    applying to other abusive groups.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Monadic Gnosis summary states that all existence flows from one eternal
    Monad and strives to return to it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Finite spirits are described as ruling portions of the world, opposing the
    striving toward unity, and being connected with popular religions including the
    Jewish religion.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Souls attain perfection by reminiscence of former conditions, soaring above
    limitation and diversity toward contemplation of higher unity.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Souls escape the finite mundane spirits, are freed from imprisonment in matter,
    and obtain perfect repose after ascending above the world of appearance.
  category: sequence
  evidence_refs:
