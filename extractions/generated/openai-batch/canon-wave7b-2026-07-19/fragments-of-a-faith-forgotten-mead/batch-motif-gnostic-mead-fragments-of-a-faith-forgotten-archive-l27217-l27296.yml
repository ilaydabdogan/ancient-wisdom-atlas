canonical_text:
  quote: ''
  summary: The passage describes the holy Pleroma as a structured sacred space with
    four gates, monads, supporters, powers, and overseers. It then describes the orientations
    of a three-faced Overseer, higher beings and spaces above and within, a Holy of
    Holies, a Depth called Light, and a hidden Alone-born who is indivisible. A commentator
    explains that the seer saw inner spaces from multiple points of view and that
    these mysteries are difficult or impossible to describe with ordinary speech.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The holy Pleroma is described as having four Gates, with a Monad for each
    Gate and multiple orders of supporters, powers, ennads, decads, dodecads, and
    pentads assigned to every Gate.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'An Overseer is assigned to every Gate and is described as having three faces:
    an ingenerable face, a true face, and an ineffable face.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The Overseer’s faces look in different directions: outward toward outer Aeons,
    toward Setheus, and upward toward the Sonship in each Monad.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Above the Monads are Aphredon with twelve Righteous Ones, the Forefather,
    Adam belonging to the Light with three hundred and sixty-five Aeons, and the Perfect
    Mind.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Adam, his Aeons, and the Perfect Mind are described as surrounding a Basket
    or possible network that knows no death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The ineffable face of the Overseer looks within to the Holy of Holies, identified
    with the Boundless one, who is the head of the Holy Place or Shrine.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Depth is called the Light or Shining One, and within it a hidden Alone-born
    is said to manifest three Powers.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Alone-born is described as indivisible and never divided; the All has
    opened or divided itself for him, and all Powers belong to him.
  category: attribute
  evidence_refs:
  - ev:4
