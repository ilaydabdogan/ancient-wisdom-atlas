canonical_text:
  quote: ''
  summary: 'The passage lists features of an early Christian period: sayings of the
    Lord and the Old Testament were not yet absolute authorities because the Spirit
    could set them aside; churches lacked fixed political union and communities were
    independent; a distinctive literature arose with high claims; sayings and arguments
    attributed to assumed Apostolic Teachers carried authority. It then contrasts
    a gentilizing tendency with a background universalizing tendency, identifying
    the latter as an inspiration behind the best Gnostic efforts while noting that
    it did not become the descent-line claimed by General Christianity.'
  language: English
  quote_policy: summarized
