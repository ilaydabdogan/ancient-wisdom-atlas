canonical_text:
  quote: ''
  summary: The passage discusses Marcus' number-symbolism through seven and eighth
    spheres, zodiacal and calendrical divisions involving 12, 30, and 360, and the
    idea that a world-fabricator imitates Eternity through times, seasons, and numbers.
    It then reports Irenaeus' account of Marcosian ritual formulas for baptismal consecration,
    an invocation to Light or Christ, and angelic redemption by which a candidate
    becomes one with an angel above.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the seven spheres are not the planets of astrology or astronomy,
    and that the dodecad is shown in the zodiacal circle.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The seven spheres are described as moving very rapidly, while an eighth sphere
    or heaven moves more slowly and checks their motion, producing a cycle of about
    thirty years through a sign or twelfth part of the zodiacal belt.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The retarding sphere is described as an image of the Great Boundary surrounding
    the Mother of thirty names, also called the Pleroma.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage lists recurring numerical divisions: the moon''s heaven is encompassed
    in thirty days, the sun returns in twelve months, the day has twelve hours, each
    hour has thirty parts, the zodiac has twelve divisions each with thirty subdivisions,
    and the earth has twelve climates.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The world-fabricator or time-spirit is said to have tried to copy Eternity's
    infinite and timeless nature by representing it in times, seasons, and numbers,
    and his work is said to end when the times are fulfilled.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Irenaeus is said to report formulas used by the Marcosian school, though the
    Marcosians denied their accuracy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The baptismal consecration formula addresses the Name of the unknown Father
    of the universals, Truth as Mother of all, one who descended on Jesus, and union,
    redemption, and communion of powers.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A reported invocation to Christ addresses Light above every power of the Father,
    called Light, Spirit, and Life, and says that this Light has reigned in the body.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The rite of angelic redemption is described as a higher degree of Gnostic
    initiation by which the candidate becomes one with an angel above.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The angelic redemption formula invokes a hidden Name, the Name of Truth, Jesus
