canonical_text:
  quote: ''
  summary: 'The passage reconstructs early Greek religious development: it treats
    the relation of Chaldean tradition to an Orphic line as uncertain, says early
    settlers left no records, contrasts Homeric warrior Greece with older bardic and
    religious traditions, interprets the Trojan War as a kin-related land-foray, notes
    the subordinate position of priests, contrasts Homer and Orpheus as bards of different
    Greek groups, and says later philosophical thinkers found Homer insufficient for
    religious needs compared with Egypt and Chaldaea.'
  language: English
  quote_policy: summarized
