  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The described Simonian systems include the Father over all, the Logos idea,
    an aeon-world or ideal universe, emanation, positive and negative aspects as pairs
    or syzygies, the World-soul as the Thought or female aspect of the Logos, the
    descent of the soul, creation of the sensible world by builders, reincarnation,
    and redemption.
  category: other
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Simonians are said to have been characterized by the practice of magic,
