  summary: The passage summarizes Mead's account of Pseudo-Clementine legends about
    Simon Peter and Simon Magus, scholarly theories about Simon as a symbol for Paul
    in one legendary stratum, features attributed to Simonian Gnosis, associations
    with magic, Persia, Magi, and fire-symbolism, lost Simonian texts including criticism
    of the Genesis serpent legend, and the sidereal symbolism of Simon and Helen as
    Sun and Moon, Logos and World-soul, or mind and fallen soul. It also notes a Gnostic
    allegorical reading of the Homeric Helen myth and Irenaeus' account of the Logos
    and Sophia/Wisdom.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pseudo-Clementine romance is described as portraying conflicts between
    Simon Peter the Ebionite and Simon the Magician, with Peter foiling Simon's magical
    arts and routing him in different recensions at Rome or Antioch.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Baur and the Tübingen school are reported as proposing that in at least one
    stratum of the legend Simon Magus is a legendary symbol for Paul, though the passage
