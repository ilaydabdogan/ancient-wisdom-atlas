canonical_text:
  quote: ''
  summary: 'The passage presents a modern explanatory reconstruction of Valentinian/Gnostic
    aeonology using geometrical and numerical patterns: circles, spheres, dodecads,
    thirteen-sphere systems, the decad, one hundred modes, and the addition of Christ
    and the Holy Spirit to perfect the Pleroma. It also notes comparisons to Pythagorean,
    Platonic, Indian, Vaidic, zodiacal, and Docetae numerical or cosmological schemes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies circles and spheres as natural symbols of perfections
    or pleromata.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The differentiation of primal simplicity is represented by groups of twelve,
    and the mode of being of the Pleroma is called the dodecad.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A spatial model is described in which each equal sphere in mutual contact
    is surrounded by twelve others, and pressure makes the central thirteenth sphere
    assume a rhombic dodecahedron form.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage links a thirteenth aeon, the dodecahedron as symbol of the material
    universe, the atom's rhombic dodecahedral field, and the twelve zodiac signs as
    reasons for emphasizing the dodecad.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Each phase of the Pleroma is said to be positive to the succeeding phase;
    Bythus is positive to Ennoea, Ennoea becomes sevenfold, and the sevenfold is positive
    to the dodecad of thirteen spheres.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage distinguishes the phenomenal dodecahedron from the aeon-world
    living type behind it, described as a system of thirteen spheres that eventuates
    the dodecahedron in the physical world.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Each of the thirteen spheres is said to contain seven modes of being from
    the preceding phase, producing a multitudinous progeny and moving toward harmonious
    arrangement denoted by the decad.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A sphere's motions are listed as up, down, right, left, back, front, round,
    in, out, and an unimaginable motion that is no motion.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A fourteenth surrounding sphere is described as the boundary of the system,
    and a calculation of modes produces one hundred, interpreted as the perfection
    of ten.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that in one Gnostic system two aeons, Christ and the Holy
    Spirit, are added to the myth of the Pleroma-drama.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The root-aeons of the Pleroma are said to be thirty; adding Christ, the Holy
    Spirit, and That beyond all yields thirty-three, which the passage compares with
    the Vaidic pantheon of thirty-three deities.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The number one hundred is used to explain subordinate phases in a system attributed
    to the Docetae, described as thirty-fold, sixty-fold, and one hundred-fold.
  category: relationship
  evidence_refs:
  - ev:11
