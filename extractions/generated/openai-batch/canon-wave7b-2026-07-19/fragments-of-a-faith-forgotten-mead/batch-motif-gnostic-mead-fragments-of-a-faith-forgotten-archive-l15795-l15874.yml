canonical_text:
  quote: ''
  summary: The passage explains a Basilidian teaching on appended animal, plant, and
    mineral characteristics around the soul while denying that these excuse moral
    wrongdoing. It then describes the Basilidian celebration of Jesus' Baptism, an
    interpretation of gospel incidents as initiation legends, a five-year silence
    imposed on disciples, and valued Oriental writings associated by scholars with
    lost Zoroastrian literature.
  language: English
  quote_policy: summarized
