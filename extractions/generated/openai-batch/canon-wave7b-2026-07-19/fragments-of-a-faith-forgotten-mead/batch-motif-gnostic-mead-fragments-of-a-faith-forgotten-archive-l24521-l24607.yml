literal_observations:
- id: obs:1
  text: A soul that has the mysteries of light is taken charge of by the Receivers
    of Light when it goes forth from the body; the Receivers of Light are distinguished
    from the Receivers of Wrath.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Receivers of Light journey with that soul for three days through all creatures
    of the world and pass it through the elements of the judgments while instructing
    it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The soul is taken to the Virgin of Light, sealed with an excellent seal, carried
    into a righteous body of the aeons, and in its next birth may find the signs of
    the mysteries of light and inherit the Kingdom of Light.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man who has sinned only twice or thrice is sent back into the world according
    to the type of sins he committed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A righteous man without sin cannot be taken into the Kingdom of Light if the
    sign of the Kingdom of the Mysteries is not with him; the passage states that
    gnosis is needed as well as righteousness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The disciples ask whether they should remit the transgressions of a repentant,
    non-hypocritical sinner up to seven times and give him the mysteries again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Saviour answers that the sin should be remitted many times seven times
    and that the mysteries should be given again from the beginning, in hope of winning
    the brother's soul for the Kingdom of Light.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A person who gives life to and saves a soul receives additional glory beyond
    his own proper light or glory; one who saves many souls receives many additional
    glories.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The lower and higher mysteries may be given to a sincerely repentant non-hypocrite,
    up to the three highest mysteries of the First Mystery, which is described as
    compassionate and merciful-minded.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: If that man transgresses again after this, his sin is not to be remitted again,
    his repentance is not to be accepted, the three mysteries witness against his
    last repentance, his soul has no more probation for the world of the height, and
    it dwells in the habitation of the Dragon of the Outer Darkness.
  category: sequence
  evidence_refs:
  - ev:9
