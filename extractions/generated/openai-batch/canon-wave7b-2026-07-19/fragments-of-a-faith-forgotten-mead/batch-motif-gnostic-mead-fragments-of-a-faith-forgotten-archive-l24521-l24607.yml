  summary: The passage describes the post-mortem handling of a soul that has received
    mysteries of light, its instruction, sealing, and future birth; it also discusses
    rebirth according to sins, the need for gnosis, repeated remission for sincere
    repentance, added glory for saving souls, and final exclusion to the habitation
    of the Dragon of the Outer Darkness after renewed transgression.
  language: English
