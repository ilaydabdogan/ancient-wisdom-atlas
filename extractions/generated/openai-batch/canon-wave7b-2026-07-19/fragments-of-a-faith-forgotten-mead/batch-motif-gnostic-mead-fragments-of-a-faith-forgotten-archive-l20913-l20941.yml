canonical_text:
  quote: ''
  summary: 'Mead summarizes royal and familial titles within a Gnostic poem, then
    comments that the poem can be read alongside the Parable of the Prodigal Son.
    He rejects the title Hymn of the Soul as unsupported by the text and says the
    poem concerns the consummation of the Gnostic life: a crown of victory at the
    end of the Path and the wedding garment or robe of initiation, compared with Pistis
    Sophia.'
