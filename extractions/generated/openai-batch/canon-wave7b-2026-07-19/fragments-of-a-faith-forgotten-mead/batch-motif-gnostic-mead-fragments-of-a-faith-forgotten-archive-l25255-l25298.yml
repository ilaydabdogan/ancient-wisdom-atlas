canonical_text:
  quote: "“there are many members, but only one body.”"
  summary: A summary introduces an extract from the Books of the Saviour. The extract
    describes those worthy of mysteries in the Ineffable as prior to the First Mystery
    and, by similitude, as Limbs or Members of the Ineffable. It compares their differentiated
    dignity to body parts such as head, eye, and ear, while stressing that this is
    a paradigm rather than the full reality. The speaker then says that the Mystery
    of the Ineffable, its Limbs, those who dwell in it, and three following Spaces
    are all the speaker, who is the Treasure of all of them.
