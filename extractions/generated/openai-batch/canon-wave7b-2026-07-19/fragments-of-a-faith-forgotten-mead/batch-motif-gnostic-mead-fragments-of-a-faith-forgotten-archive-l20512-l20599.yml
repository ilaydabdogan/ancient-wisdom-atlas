canonical_text:
  quote: ''
  summary: The passage discusses Bardaisan through later indirect and polemical sources,
    especially Ephraim of Edessa, then quotes three short hymn fragments attributed
    to Bardaisan. The fragments invoke a fountain of joy, a gate opened to the Mother,
    divine beings, Father and Mother in union, a daughter/sister, and a young maiden/daughter
    at a banquet. Mead then reports interpretive identifications with Paradise, the
    Ogdoad or Jerusalem Above, and the Divine Mother addressing Wisdom above in the
    Pleroma.
  language: English
  quote_policy: summarized
