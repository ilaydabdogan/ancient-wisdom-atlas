canonical_text:
  quote: ''
  summary: The passage introduces a newly published fragment of the Acts of John,
    characterizes it as early and distinctly Gnostic, and summarizes a Johannine monologue
    about the occult and docetic life of Jesus. It describes Christ returning after
    death to teach inner communities in a spiritual or illusory body, and then reports
    traditions in which Jesus appears differently to James and John, has unclosing
    eyes, changes size and form, has a body felt as alternately tender and stone-like,
    and manifests an inexpressible light during prayer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says a long fragment of the Acts of John had recently been published
    from a fourteenth-century Vienna manuscript, and that the Acts are early because
    Clement of Alexandria quotes them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fragment is described as consisting nearly wholly of a monologue placed
    in the mouth of John and preserving a tradition of the occult life of Jesus; its
    christology is described as docetic and Gnostic.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that after his death Christ returned and taught followers
    among inner communities in a psychic or spiritual body, visible and tangible at
    will but illusory compared with an ordinary physical body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage presents John as summing up the teaching by saying that the Lord
    contrived all things symbolically and by a dispensation toward humans for conversion
    and salvation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the calling of James and John, James is said to have seen Jesus as a child,
    while John first saw him as a fair and cheerful man; later John saw him with a
    partly bald head and thick flowing beard, while James said he appeared as a youth
    with a new beard.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: John is said to have noticed that Jesus' eyes never closed, and the author
    adds that this is a sign of a god in Hindu scriptures.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:7
  text: John is said to have observed Jesus sometimes as a small and uncomely man
    and again as one reaching to heaven.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: When John lay on Jesus' breast, it was felt sometimes as smooth and tender
    and sometimes as hard like stones.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: When Jesus was in prayer and contemplation, a light was seen in him that the
    narrator says could not be described by ordinary corruptible speech.
  category: attribute
  evidence_refs:
  - ev:8
