  summary: The passage closes with a devotional invocation to divine light, noted
    as based on the Gayatri, followed by an afterword addressing the reader. The author
    frames the reading as a shared journey to a region of light, urges charitable
    regard toward early Christian groups labeled heretical, imagines the Master blessing
    them, asks whether a veil may be lifted from a forgotten side of Christianity,
    and argues for diverse ways of worship, self-loss as salvation, possible prior
    lives, and Christ as a master of religion who does not condemn diverse worshippers.
