canonical_text:
  quote: ''
  summary: Mead summarizes Hippolytus on the Sethians, notes textual and naming uncertainties
    around Seth, Setheus, and Sethite traditions, then outlines a Sethian cosmology
    of Light, Spirit, and Darkness, the imprisonment and rescue of light-sparks, creation
    through seals, a world-egg in waters, and the descent of a divine light-spark
    into human forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hippolytus is described as turning his attention to the Sethians and referring
    readers to a treatise called The Paraphrase of Seth, while Mead says the title
    and its relation to the doctrines are puzzling.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The term Sethians is described as puzzling because Hippolytus's summary differs
    from other reported fragments about Sethites associated by epitomizers with Nicolaitan
    doctrine.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the latter fragments, Seth is described as a hero chosen as the type of
    the good man, the perfect, and the prototype of Christ.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage raises questions about possible connections between the name Seth,
    Setheus of the Codex Brucianus, and an Egyptian or Hyksos line of tradition in
    which Seth is called a Mystery-God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'The Sethian outline begins with a trinity: Light, Spirit, and Darkness; Spirit
    is described not as breath or wind but as a subtle odour spreading everywhere.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The three principles are said to be intermingled with one another.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Darkness strives to retain Light and Spirit and to imprison light-sparks in
    matter.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Light and Spirit strive to raise their powers aloft and rescue them from Darkness.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Genera, species, individuals, heaven, and earth are described as images of
    seals produced according to pre-existent types.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The first great form, heaven and earth, is said to result from the first concourse
    of the three original principles or powers and to be the impression of the great
    seal.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Creation is symbolized by a world-egg in the womb of the universe; the egg
    is in waters, and waves produced by creative power determine the kinds of creatures.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The light-spark and fragrance of the Spirit descend into bodies brought into
    existence by the waves of the waters, so that mind or man is molded into various
    species.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The light-spark is described as a perfect god borne down from the ingenerable
    Light above and from the Spirit into the natural man.
  category: attribute
  evidence_refs:
  - ev:9
