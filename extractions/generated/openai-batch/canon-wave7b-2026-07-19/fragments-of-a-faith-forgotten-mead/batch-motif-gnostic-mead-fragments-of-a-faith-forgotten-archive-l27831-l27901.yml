canonical_text:
  quote: "“the purified souls mount the Great Ladder”"
  summary: An unnamed divine actor sends separating powers to establish hidden orderings
    from below upward. An air-world and nested spaces of repentance, reflection, baptism,
    and the Water of Life are described. Pistis Sophia, a pre-existing aetherial Jesus,
    and twelve aeons are located within these spaces. After notice of lacunae, higher
    spaces and the Great Ladder of purified souls are mentioned. The Heavenly Man
    or Son is praised; the Father forms a City or Man, a vesture, and a body in the
    type of the Pleroma. The remaining manuscript contains a Hymn to the Light attributed
    to another Gnostic hymn-maker and breaks off suddenly.
  language: English
  quote_policy: quoted
