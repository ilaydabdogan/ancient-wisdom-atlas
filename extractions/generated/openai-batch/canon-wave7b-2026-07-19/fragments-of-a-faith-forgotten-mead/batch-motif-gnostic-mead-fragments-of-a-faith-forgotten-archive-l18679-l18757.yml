canonical_text:
  quote: ''
  summary: 'The passage presents a Valentinian-style Sophia schema: the soul is a
    mediating psychic substance between the Ogdoad and matter, able either to become
    immortal and enter the Ogdoad or to perish through assimilation to matter. It
    describes the Workman/Demiurge, the Accuser, and Beelzeboul as powers associated
    with psychic, material, and elemental substances; Wisdom acts from above, empowering
    the ignorant Workman while he mistakes the universe’s fabrication as his own and
    claims sole divinity. The passage also describes a Valentinian Tetraktys, role-names
    for Wisdom and lower rulers, and mathematical emanations within the Pleroma compared
    polemically with Pythagorean number schemes.'
  language: English
  quote_policy: summarized
