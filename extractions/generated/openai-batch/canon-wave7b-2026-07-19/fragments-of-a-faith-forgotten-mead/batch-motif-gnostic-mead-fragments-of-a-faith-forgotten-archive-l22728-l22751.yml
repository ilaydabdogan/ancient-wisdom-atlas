  quote: ''
  summary: The passage introduces a final speech attributed to Peter in the romance
    of his Travels or Circuits, preserved in a fragment associated with the Martyrdom
    of Peter. It states that Peter insisted on being crucified head downward. In the
    speech, Peter addresses the Lord as the one crucified upright and as redeemer,
    says he wishes to imitate the Lord's passion, but refuses to be hanged upright.
    He contrasts humans born from Adam with the Lord as divine light and unstained
    savior.
