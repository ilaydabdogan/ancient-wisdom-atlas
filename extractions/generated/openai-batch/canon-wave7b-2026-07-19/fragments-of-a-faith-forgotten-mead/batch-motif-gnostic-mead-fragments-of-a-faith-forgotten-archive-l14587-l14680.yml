canonical_text:
  quote: ''
  summary: The passage summarizes a Marcionite mythic account in which the world and
    Adam are formed through the God of the Law and Hyle. Adam is warned to worship
    only the God of the Law, withdraws from Hyle, and Hyle responds by filling the
    world with idolatry. The Creator casts the dead into Hell. The Good God sends
    His Son to heal, raise the dead, be crucified, descend to Hell, liberate the captives
    there, and bring them up to the Father. Christ later confronts the God of the
    Law by appeal to that god's own law, receives his confession of ignorance, then
    reveals the path of truth to Paul. The passage closes with a note on Marcionite
    ascetic practices.
  language: English
  quote_policy: summarized
