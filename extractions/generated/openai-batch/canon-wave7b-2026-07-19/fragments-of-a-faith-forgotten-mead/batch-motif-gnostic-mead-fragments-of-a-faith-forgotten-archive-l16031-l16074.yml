canonical_text:
  quote: ''
  summary: The passage says Gnostic teachers placed Abrasax, viewed popularly as a
    great god, among lower hierarchies and connected the popular idea of him with
    the lowest powers building the physical body. It then reports and rejects as a
    foolish hostile tale the claim that Basilidians believed Jesus exchanged bodies
    with Simon of Cyrene at the crucifixion, so that Simon suffered while Jesus mocked
    those deceived. The passage closes with comments on the later presence of Basilidian
    students and the probable continuity of the Basilidian school with the broader
    Gnostic stream and the Valentinian movement.
