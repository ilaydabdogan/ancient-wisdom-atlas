canonical_text:
  quote: ''
  summary: The passage summarizes Peratic cosmology as a universe symbolized by a
    circle enclosing a triangle, with three worlds and corresponding triadic formulations
    of Logos, God, Mind, and Man. It describes the Saviour as descending from the
    ingenerable world with a threefold nature and a cosmic task of separating good
    from bad sidereal powers. It then introduces a Peratic treatise presented as a
    Gnostic commentary on an old Babylonian or Syrian cosmogonic scripture, beginning
    with a first-person voice of awakening that speaks of Chaos, abysmal slime, clay,
    a moist principle, and twelve founts of the Law.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hippolytus is said to have had the Peratic school in mind in an attempted
    refutation of astrologers and mathematicians, while admitting no practical knowledge
    of the art.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: According to the passage, the Peratic school symbolized the universe by a
    circle enclosing a triangle.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The triangle denotes a primal division into three worlds: ingenerable, self-generable,
    and generable.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage equates this triadic scheme with three aspects of the Logos, or
    three Gods, three Logoi, three Minds, or three Men.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the world-process reaches completion of its devolution, the Saviour descends
    from the ingenerable world or aeon.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Saviour is described as a perfected man with threefold nature, threefold
