canonical_text:
  quote: ''
  summary: The passage describes first-century religious associations in Greece, Rome's
    conquest and organizing role, and Rome's religious contact with the East. It identifies
    common solar worship as a point of contact among Roman imperial religions and
    presents the Mysteries of Mithras as the esoteric core of a widespread solar cult.
    It reports Christian polemics that the Devil had anticipated and copied Christian
    sacred rites in Mithraic mysteries, and describes Mithra as the visible sun for
    the uninstructed and the Spiritual Sun or mediator between Light and Darkness
    for the instructed.
  language: English
  quote_policy: summarized
