  summary: A scholarly foreword explains that Catholic bishops and teachers, according
    to Lipsius, countered Gnostic writings by adopting popular narratives from heretical
    books while removing false doctrine. The author says some traces of the removed
    material remain and states the aim of recovering fragments of old Gnostic teachings
    from mutilated textual traditions. The passage then summarizes claims about early
    collectors of Gnostic Acts, including Leucius Charinus and Linus, and refers readers
    to Lipsius and recent editions by Zahn, Bonnet, and Lipsius.
