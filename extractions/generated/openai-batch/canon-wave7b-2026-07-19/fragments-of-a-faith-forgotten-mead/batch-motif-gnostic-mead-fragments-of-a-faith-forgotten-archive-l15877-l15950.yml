canonical_text:
  quote: ''
  summary: A modern scholarly passage on the Basilidian Gnosis argues that Basilidian
    material was transmitted through fragmentary and hostile sources, places Gnosticism
    in contact with Iranian, Zoroastrian, Mithraic, Egyptian, and Chaldaean religious
    currents, and summarizes a reported or “spurious” Basilidian cosmology in which
    Abraxas or Abrasax is linked with the first heaven, 365 heavens, and the 365 days
    of the year.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that after the return from Babylonia, traditions of the Magi
    and the great Iranian faith were important among learned Jews, Essenes, and theosophically
    minded circles in an eclectic and syncretistic religious environment.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that extant Avesta literature was said to be recovered
    from memory from a small portion of the great library of Persepolis, which Parsi
    tradition says was destroyed by Alexander.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the Mithraic mystery tradition may preserve an authentic
    tradition comparable to the Parsi line and illuminate the Zoroastrianism with
    which Gnosticism was in contact.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Hippolytus and Clemens Alexandrinus selected Basilidian
    points for refutation and, according to the author, misunderstood the tenets they
    quoted.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says that writings of the Basilidian school have been lost or
    destroyed and would have shed light on Christian theosophy and origins.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage describes the later report of a “spurious” Basilidian system as
    coming from Irenaeus and epitomators, whom the author characterizes as relying
    on popular rumor and hearsay rather than firsthand information.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: In the reported system, Abraxas or Abrasax is said to be the God of the Basilidians
    and ruler of the first heaven among 365 heavens.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says the name Abrasax was explained numerologically because the
    Greek letter values of the name sum to 365, the number of days in the year.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says Hippolytus places the Abrasax material at a lower stage of
    creation than the God beyond all and notes uncertainty over whether Abrasax should
    be identified with the Great Ruler of the Ogdoad or the Ruler of the Hebdomad.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage relates the 365 heavens to Egyptian and Chaldaean astrological
    and genetical occult science and to 365 aspects of the heavenly bodies during
    the year.
  category: relationship
  evidence_refs:
  - ev:9
