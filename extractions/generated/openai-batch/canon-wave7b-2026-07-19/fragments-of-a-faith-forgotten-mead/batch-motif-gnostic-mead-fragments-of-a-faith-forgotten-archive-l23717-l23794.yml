canonical_text:
  quote: ''
  summary: Sophia is crowned, purified, and joined to descending light and her co-partner
    of light. As she rises, hostile powers change shape against her. Supported by
    Michael and Gabriel and surrounded by a light-stream, she enters the final battle,
    treads down a seven-headed basilisk, and is freed from Chaos. Remaining hostile
    rulers are sealed until an appointed time, and the passage describes perfected
    humanity passing into a timeless state called, by the author, Nirvana, with gates
    of the Great Light opened for the pilgrim. The range ends with the beginning of
    a new section on interpretations by disciples and Mary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sophia pours hymns of joy; a power becomes a crown for her head; her hyle
    or material propensities begin to be purified; retained spiritual light-powers
    join a new vesture of light.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The First Mystery sends another great light-power, which joins with a prior
    light-power and becomes a great light-stream described as the First Mystery looking
    without coming forth from the First Mystery looking within.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sophia is described as completely purified, with her light-powers re-established
    and filled by her co-partner of light, the syzygy; her earlier unaided attempt
    to reach the Light of lights is said to have led to error.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: As Sophia rises higher, stronger hostile powers or projections are sent against
    her and change their shapes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sophia is surrounded by the light-stream and supported on either hand by Michael
    and Gabriel, identified in the passage as the sun and moon; wing and winged-globe
    imagery appears as the final battle begins.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The First Mystery looking without directs an attack against cruel crafty powers,
    makes Sophia tread underfoot a basilisk with seven heads, destroys its hyle so
    no seed can arise from it, and casts down the rest of the opposing host.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Sophia sings triumphant hymns after being set free from the bonds of Chaos,
    and the passage says she remembers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The great Self-willed one and Adamas the Tyrant are not entirely subdued;
    the First Mystery looking without seals their regions and the regions of their
    rulers until three times are accomplished.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage links the appointed time with seven cycles or ages, the perfection
    of a number of humanity, a state called interplanetary Nirvana, the opening of
    the Gates of the Treasure of the Great Light, and the pilgrim crossing the heights.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage ends by beginning a new discussion of scriptural interpretations
    given by disciples, women disciples, and Mary, the Mother of Jesus.
  category: sequence
  evidence_refs:
  - ev:10
