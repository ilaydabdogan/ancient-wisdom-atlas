canonical_text:
  quote: ''
  summary: 'The speaker moves from a prior treatment of Essaeans, associated with
    a religious life of action, to a discussion of those who embrace contemplation.
    He states that he will avoid embellishment and adhere to truth, because the virtue
    of these men should not be passed over in silence. He explains that these wisdom-lovers
    are called Therapeuts and Therapeutrides, men and women, because they profess
    a healing art superior to ordinary city medicine: ordinary medicine heals bodies,
    while their practice heals souls afflicted by difficult diseases such as pleasure,
    desire, grief, fear, selfishness, folly, and injustice.'
  language: English
  quote_policy: summarized
