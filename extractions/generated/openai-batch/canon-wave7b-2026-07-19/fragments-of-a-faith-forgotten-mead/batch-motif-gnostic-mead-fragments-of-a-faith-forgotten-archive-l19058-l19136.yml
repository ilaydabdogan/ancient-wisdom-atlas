canonical_text:
  quote: ''
  summary: The passage introduces Mead's discussion of Marcus's number-symbolism.
    It describes Irenaeus's report of a Marcosian manuscript, summarizes what is known
    about Marcus, and presents Marcus's attempt to adapt Hebrew number-letter symbolism
    to the Greek alphabet in order to express Gnostic aeon-genesis and world-process.
    It also compares this kind of symbolic method with possible Greek, Egyptian, and
    Chaldean numerical traditions.
  language: English
  quote_policy: summarized
