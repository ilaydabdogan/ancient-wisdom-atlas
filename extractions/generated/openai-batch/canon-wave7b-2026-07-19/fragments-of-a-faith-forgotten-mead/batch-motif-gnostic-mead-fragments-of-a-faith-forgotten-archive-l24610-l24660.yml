canonical_text:
  quote: ''
  summary: The passage instructs that mysteries should not be withheld from a curious
    inquirer, even if the inquirer has not received lower mysteries, and warns of
    judgment for hiding them. It says only three higher mysteries can be given by
    those with limited knowledge. A person who falls away after receiving the highest
    mysteries is not entirely hopeless, because the case belongs to the First Mystery
    and the Mystery of the Ineffable, which can accept repentance and remit sins.
    The passage then considers hypocrites who receive mysteries through deception
    and mimic or forge them, instructing an appeal to the First Mystery to reclaim
    the mystery and make such souls strangers to the Kingdom.
  language: English
