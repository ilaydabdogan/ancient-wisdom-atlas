canonical_text:
  quote: ''
  summary: 'The passage summarizes a Cainite Gnostic system in which the world-creator
    and power of generation are inferior to a superior power of enlightenment and
    wisdom. It contrasts the sensible world as an impure world-womb or after-birth
    with the true birth from a virgin spiritual womb and the aeons above. It describes
    an inversion of scriptural valuations: figures praised by followers of the External
    Law are subordinated to figures such as Cain, Esau, the inhabitants of the Cities
    of the Plain, and Coran, Dathan, and Abiram, who are presented as higher-law types
    protected by Wisdom. The passage also notes Cain-Abel antitheses, compares this
    antithetical pattern with Justinus, Ebionite, and Marcionite contrasts, and names
    Cainite writings including The Gospel of Judas and The Ascent of Paul.'
  language: English
  quote_policy: summarized
