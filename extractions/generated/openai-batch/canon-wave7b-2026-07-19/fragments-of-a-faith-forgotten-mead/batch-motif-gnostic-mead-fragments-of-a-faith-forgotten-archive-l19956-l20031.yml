canonical_text:
  quote: ''
  summary: The passage describes a Gnostic final consecration rite involving declarations
    by assistants and a candidate, redemption through a divine Name, prayers and formulae
    for the dead, and formulae for the soul passing through seven purgatorial gates
    or spheres. The soul identifies itself as son of the Father beyond existence,
    speaks of Wisdom as female counterpart, returns to its own origin, makes an apology
    before powers around the demiurge, invokes incorruptible Wisdom above, and casts
    off chains glossed as the soul or lower nature. The author then relates these
    elements to Pistis Sophia, Codex Brucianus, and Valentinian initiation practices.
  language: English
  quote_policy: summarized
