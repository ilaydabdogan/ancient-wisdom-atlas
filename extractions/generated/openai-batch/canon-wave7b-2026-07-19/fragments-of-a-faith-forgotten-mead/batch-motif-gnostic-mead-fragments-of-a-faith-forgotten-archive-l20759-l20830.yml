canonical_text:
  quote: '"the three things, Nature and Fortune and Free-will"'
  summary: The passage contrasts Nature, Fortune/Fate, and Free-will. Nature is described
    as the principle of bodily growth, birth, moderation, and proper order; Fortune
    as a variable force that can assist or disturb Nature; Right and Left Heads/Governors
    as opposed powers in the sphere; and human Free-will as able, though not completely,
    to repel Fortune. The passage also attributes the final measure and number of
    beings to God or the ordaining One.
  language: English
  quote_policy: quoted
