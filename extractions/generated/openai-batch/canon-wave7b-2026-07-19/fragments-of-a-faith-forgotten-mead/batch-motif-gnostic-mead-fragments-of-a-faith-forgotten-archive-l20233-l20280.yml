canonical_text:
  quote: ''
  summary: The passage introduces Ptolemy's interpretation of the Proem to the Fourth
    Gospel. It summarizes a sequence in which the Beginning is the first principle
    brought into being by God, in which the Father emanates all things potentially.
    The Beginning is named Mind, Son, and Alone-begotten. The Logos is then emanated
    in the Beginning or Mind, contains the substance of the Aeons, and enforms that
    substance. The passage concludes that the opening words of the Gospel concern
    divine hypostases and argues for translating the Logos as being one with God.
