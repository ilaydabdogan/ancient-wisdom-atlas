  summary: The passage frames Gnosis as requiring study of Greek philosophy, mysteries,
    initiations, and the syncretic religious world before the Christian era. It emphasizes
    the difficulty of tracing religious origins because cults, theogonies, cosmogonies,
    races, nations, and inherited ideas are mixed. It uses metaphors of soil, seed,
    bodily heredity, national parentage, decay, children, grandchildren, family-trees,
    and a possible soul of a people.
