canonical_text:
  quote: ''
  summary: The passage summarizes Sophia's descent from a higher region toward the
    Light's reflection into Chaos, her danger of losing innate light, her turn upward
    through repentances, and stages of assistance from the Light, Jesus, and the First
    Mystery. It also describes opposing material powers, numbered stages, and a later
    comparison with light-powers and vestures of glory.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that the human soul, like the world-soul before it, must
    descend into matter or hyle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sophia desires the Light and descends toward its reflection from the Thirteenth
    Mou through the Twelve into the depths of Chaos or Unorder.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Chaos, Sophia is described as being in danger of losing her innate light
    or spirit because powers of matter continually deprive her of it.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: After reaching the lowest depths and a limit, Sophia's path begins to lead
    upward again; she reaches a middle point or turning point and recites penitential
    hymns or repentances.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sophia's chief enemy is identified as the false light, also called the counterfeit
    spirit or desire-nature, and it is assisted by twenty-four material powers.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The twenty-four material powers are described as reflections of supernal projections,
    powers, or co-partners of Sophia, and the whole arrangement is said to make an
    ordering into forty-nine.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Sophia first utters seven repentances; at the fourth she prays that the image
    of the Light not be turned from her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the sixth repentance, the Light remits Sophia's transgression of leaving
    her own region and falling into Chaos, but the First Mystery has not yet commanded
    her full release.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: After the seventh repentance, Sophia pleads ignorance and love for the Light;
    Jesus, her syzygy, raises her to a less confined region in Chaos, though she does
    not know who has done it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: At the ninth stage, the First Mystery partly accepts Sophia's repentance and
    sends Jesus in the form of the Light to help her, and she recognizes it.
  category: sequence
  evidence_refs:
  - ev:9
