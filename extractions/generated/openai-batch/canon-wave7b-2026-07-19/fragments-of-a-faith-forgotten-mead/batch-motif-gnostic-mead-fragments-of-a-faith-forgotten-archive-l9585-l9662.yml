canonical_text:
  quote: ''
  summary: 'The passage presents doctrinal and historical reflections: gods are not
    human-made or demonic products, angels are creatures of light, philosophy has
    limited but real value, all people will be saved, and religious renewal brings
    both faith and upheaval. It then describes a historical transition in which one
    race is dying and another being born, with cultural memory only partly retained,
    and turns to the Jewish presence, scriptures, schools, and rabbis in Alexandria.'
  language: English
