canonical_text:
  quote: the cross is the lower nature
  summary: A speaking revealer explains the cross, upper and lower nature, hearing
    his voice, and union with the Father. He denies and affirms suffering in paradoxical
    language, calls the displayed suffering a mystery, and identifies the passion
    as that of a Word or Logos, meaning Man. Mead’s commentary interprets the passage
    as an inner-school initiation called the Cross, with a three-limbed cross, a bound
    candidate, trance ascent to an inner mountain or height, hearing the Master’s
    voice, gathered limbs, and eventual at-onement with Christ.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The cross is called the lower nature, and those seen on the cross are said
    not to have one form because every limb of “Him who came down” has not yet been
    gathered together.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says that when the upper nature is taken up and a race comes to
    him in obedience to his voice, what does not yet hear him will become like the
    addressed listener and no longer remain as it is.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker tells the listener not to attend to the many or to those outside
    the mystery, and says that he is wholly with the Father and the Father with him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says that the things others will say he suffered were not suffered,
    and that the suffering shown in the dance should be called a mystery.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker uses paired affirmations and denials about suffering, piercing,
    hanging, and flowing blood.
  category: speech
