canonical_text:
  quote: ''
  summary: 'A royal speaker recalls a robe and purple toga made for him, and a compact
    written in his heart: if he descends into Egypt and brings back the pearl from
    the sea near the serpent, he will put on the robe and inherit the kingdom with
    his Brother. He leaves the East with two messengers, travels through named regions,
    reaches Egypt, is separated from his companions, waits near the serpent to take
    the pearl, befriends an Eastern youth, adopts Egyptian garb to avoid hostility,
    is betrayed by the Egyptians, eats their food, forgets he is a son of kings, and
    serves their king. Editorial notes gloss Egypt as the body, the pearl as Gnosis,
    the sea as matter, the serpent as elemental or passionate essence, and the robe
    and toga as higher vestures of the Self.'
  language: English
  quote_policy: summarized
