  summary: The passage presents a Valentinian homily declaring its hearers immortal
    children or sons of God who make death die in them and dissolve the world without
    being dissolved. Mead comments on the inner divine Self or pneumatic light-spark
    as an eternal pilgrim in matter. A second Valentinian fragment contrasts a dead
    image and living face, the phenomenal world and living aeon, and explains the
    image through a painter, name, form, invisible deity, Sophia/Wisdom, and the true
    God.
