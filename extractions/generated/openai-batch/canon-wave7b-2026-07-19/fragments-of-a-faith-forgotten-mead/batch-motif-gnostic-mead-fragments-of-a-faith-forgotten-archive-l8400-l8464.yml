canonical_text:
  quote: ''
  summary: 'Mead discusses Philo’s account of the Therapeuts and argues that Philo’s
    Mareotic community was one among many mystic and ascetic communities. He speculates
    that lost writings admired by Philo may have been precursors to surviving Gnostic
    fragments, and that some communities synthesized Egyptian, Chaldaean, Zoroastrian,
    Orphic, and Jewish elements. He describes graded audiences for religious literature:
    public scripture, intermediate writings for lay-pupils, and abstruse mystical
    treatises for trained insiders.'
  language: English
  quote_policy: summarized
