canonical_text:
  quote: ''
  summary: 'The passage describes the ascetic practices and communal festivals of
    the Therapeuts: extended fasting sustained by a figurative banquet of wisdom,
    seventh-day observance, plain food and water, simple housing and clothing, an
    ethical preference for simplicity and truth, and larger sacred assemblies at the
    end of every seventh week, culminating in a fiftieth-day feast with numerological
    explanation.'
  language: English
  quote_policy: summarized
