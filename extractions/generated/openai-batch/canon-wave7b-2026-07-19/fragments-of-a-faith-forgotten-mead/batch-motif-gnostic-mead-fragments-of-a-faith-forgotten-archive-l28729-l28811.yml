canonical_text:
  quote: ''
  summary: 'The passage presents and comments on a Gnostic emanation sequence: the
    Invisible Spirit, Will, Mind, Light, Word, Christ, the Self-begotten, Truth, four
    Luminaries, and four ministering emanations. It also compares the names and structure
    with Irenaeus and notes parallels with Codex Brucianus, plus proposed dating and
    Egyptian origin for the Gospel of Mary material.'
  language: English
  quote_policy: summarized
