- id: obs:3
  text: The Self-begotten is described as coming from Thought, identified with the
    Word, and as coming forth from the first Thought.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Invisible sets the Self-begotten as God over the All, gives him powers
    through the True God, and makes Truth subject to him so that he may think out
    the All.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Irenaeus is quoted as saying that the Self-begotten is sent forth from Mind
    and the Word, represents the Great Light, and is joined with Truth.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Four great Lights proceed from the Light of Christ and the Incorruptible to
