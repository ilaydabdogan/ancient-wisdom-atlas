canonical_text:
  quote: ''
  summary: The passage describes graded supernal spaces of the First Mystery and the
    Ineffable. Those who receive light-mysteries occupy regions according to the mysteries
    received, while the recipient of the complete mystery can explore all regions
    of the Inheritance of Light and choose a place there. At the dissolution of the
    world this one becomes king over the orders of Light. The passage then summarizes
    the supreme Gnosis of the Mystery of the Ineffable, including knowledge of many
    paired opposites and of nature and supernal realms. The disciples are amazed,
    and Mary asks who can understand such a Mystery.
  language: English
  quote_policy: summarized
