canonical_text:
  quote: ''
  summary: The passage argues that the Pauline letters are the earliest historic Christian
    records and that Paul preached a doctrine of the mystic Christ rather than the
    later historicized Gospel Jesus. It presents Paul as an independent propagandist
    with his own illumination, in contact with an inner school and with various outer
    Jewish, Essene, and Jesus-tradition communities. It then summarizes Harnack's
    characterization of Christianity from 50-150 CE, including the disappearance of
    Jewish Christianity, charismatic reception of the Spirit, expectation of the end
    of the age and a thousand-year reign of Christ, Christianity as a way of life
    rather than dogma, and freedom from fixed doctrinal forms.
  language: English
  quote_policy: summarized
