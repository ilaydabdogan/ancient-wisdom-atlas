canonical_text:
  quote: ''
  summary: The passage explains Marcosian number-symbolism in which the number six
    marks embodied spiritual consciousness, descent into the Hebdomad, relation to
    the World-mother or Wisdom, the dove of baptism, the sixth day, passion, cross,
    initiation, creation, and regeneration. It also describes creation by the Logos
    through a seven-numbered hierarchy and the demiurgic ensouling of a seven-powered
    cosmos according to a divine pattern.
  language: English
