canonical_text:
  quote: ''
  summary: A hymn summons the addressed figure, later called the Master, to receive
    glory-vestures appointed by the First Mystery and the Ineffable. The vestures
    contain the names, powers, mysteries, and glory of supernal and lower realms.
    The Master dons the lowest robe, becomes pure light, ascends to the lower firmament,
    causes the powers there to bow and praise, and then passes upward to the First
    Sphere, where gates open and he enters the mansions.
