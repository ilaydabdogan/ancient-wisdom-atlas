  summary: The passage describes lower regions moving westward, symbolic solar and
    lunar vehicles, Jesus and the disciples ascending into the aerial Way of the Midst,
    and instruction about twelve Mons divided between labraoth and Adamas. The group
    under labraoth repents and is carried by leou near the sun's light, while the
    group under Adamas refuses the mysteries of light, generates ranks of beings,
    and is bound in the Fate-Sphere under Great Rulers.
