canonical_text:
  quote: ''
  summary: The passage describes Marcionites as notable for martyrs and reports an
    early dated Christian inscription from a Syrian village, formerly marking a Marcionite
    meeting-house or church called a synagogue. The inscription is dated October 1,
    A.D. 318 and dedicates the church to Jesus as Chrestos, “the Good,” rather than
    Christos. The author discusses confusion between the titles, explaining Christos
    as the Greek form of Hebrew Messiah and Chrestos as a title for one perfected
    or holy, and claims later orthodox editing changed Chrestos to Christos. The passage
    then notes sub-schools and teachers of the Marcion school, especially Apelles.
