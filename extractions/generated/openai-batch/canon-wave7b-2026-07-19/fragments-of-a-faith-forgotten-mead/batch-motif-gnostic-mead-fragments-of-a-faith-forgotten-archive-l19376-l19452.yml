canonical_text:
  quote: ''
  summary: The passage describes Marcus's number-symbolism through the twelve-limbed
    Body of the Heavenly Man, a schema or glyph representing the ordered universe
    and Pleroma. It explains the term gramma as letter, musical note, or diagram,
    compares diagrammatic ordering with Indian tantra and yantra, then describes the
    Word or Logos issuing from Truth, becoming the earthly name Christ Jesus, and
    being associated with a secret six-lettered name. The passage also assigns the
    twenty-four alphabet letters to the limbs as symbols of aeonic emanations.
  language: English
  quote_policy: summarized
