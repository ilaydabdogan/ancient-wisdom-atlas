  summary: A reflective passage imagines a true scholar of religion who can affirm
    truth in all great religions without exclusiveness, perceive the Wisdom of Deity
    active in their manifestations, and draw faith from all world-bibles and world-teachers.
    The scholar is contrasted with external analysts and heresy-accusers through a
    stream metaphor. The passage concludes that One Religion flows in human hearts
    and that analysis of religion is analysis of humankind.
