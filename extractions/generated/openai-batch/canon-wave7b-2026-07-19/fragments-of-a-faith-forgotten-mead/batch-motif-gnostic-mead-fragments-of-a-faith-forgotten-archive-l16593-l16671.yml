  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage reports Tertullian’s statement that Valentinus composed a treatise
    called Sophia, or Wisdom, and argues that this should be understood as a book
    rather than only as the wisdom Valentinus taught.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that only a few fragments of Valentinus’s works survive,
