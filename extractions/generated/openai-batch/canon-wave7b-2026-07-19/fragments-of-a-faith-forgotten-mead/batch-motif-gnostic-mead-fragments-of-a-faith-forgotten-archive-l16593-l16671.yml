canonical_text:
  quote: ''
  summary: A modern scholarly passage describes the obscurity, secrecy, writings,
    and surviving fragments of Valentinus. It presents him as a reserved Gnostic teacher
    and prolific writer whose technical works did not circulate widely, discusses
    a possible relation to Pistis Sophia, and argues that Tertullian’s reference to
    Valentinus’s Sophia or Wisdom should likely be understood as a book, by comparison
    with the Wisdom of Solomon.
  language: English
  quote_policy: summarized
