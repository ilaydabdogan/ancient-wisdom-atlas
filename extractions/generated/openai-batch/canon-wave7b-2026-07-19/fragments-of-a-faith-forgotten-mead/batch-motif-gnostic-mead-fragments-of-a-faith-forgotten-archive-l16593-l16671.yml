    without record and that he was regarded as orthodox for much of his life.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage attributes this obscurity in part to Valentinus’s reserve and
    secrecy and says he was an enigma even to those who regarded him as a teacher.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Valentinus attempted to embrace popular and dogmatic Christian
    traditions and to weave external and internal elements into one whole.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Valentinus’s technical treatises were not published,
    while his letters and homilies circulated.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After leaving Rome, Valentinus is described as largely disappearing from the
    view of Western heresiologists, with his later movements treated as conjectural.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage conjectures, conditionally, that if documents such as Pistis Sophia
    belonged to his workshop, Valentinus may have returned to Alexandria and ended
    his life in retirement.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage lists Valentinus’s writings as including numerous letters, homilies,
