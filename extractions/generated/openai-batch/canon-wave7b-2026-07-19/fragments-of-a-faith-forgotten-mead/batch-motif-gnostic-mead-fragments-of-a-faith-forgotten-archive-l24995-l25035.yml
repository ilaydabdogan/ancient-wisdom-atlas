canonical_text:
  quote: ''
  summary: The passage reports that Mary interprets scripture in light of a new teaching
    after the Master recapitulates earlier points and asks whether the disciples have
    understood. It emphasizes the unending compassion of the highest Mysteries. A
    teaching then compares the power of a worldly king to pardon offenders with the
    greater power of the Ineffable and First Mystery to grant remission of sin to
    those who have received the Mystery. A second analogy compares a soldier protected
    by a royal mantle with those mantled in the mysteries of divine vestures. The
    passage closes as the Master tests Peter’s compassion in the case of a woman.
  language: English
  quote_policy: summarized
