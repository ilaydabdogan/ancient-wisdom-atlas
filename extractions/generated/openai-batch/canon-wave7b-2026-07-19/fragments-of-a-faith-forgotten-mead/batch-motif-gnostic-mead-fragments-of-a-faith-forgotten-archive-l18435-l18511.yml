canonical_text:
  quote: ''
  summary: 'The passage presents Mead’s discussion of the Sophia myth: a Boundary,
    also called Cross or Partaker, separates deficiency from the Pleroma; a robe of
    power is associated with the Saviour’s descent and final initiation; the Limit
    is attributed to the Father and perfects the aeons into a Living Aeon; and Wisdom-without-the-Pleroma,
    or the Ogdoad, is shaped into a perfect aeon by Christ-and-Holy-Spirit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A great wall or sphere is described as bounding the living Mou, and this is
    presented as a prototype of the mystic Christ bound to or in the tree of the body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hippolytus’ summary says the Boundary separates deficiency from perfection
    or Pleroma, is called Partaker because it partakes of deficiency, and is called
    Cross because it is fixed and unchangeable.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Cross or Boundary prevents anything of the deficiency from approaching
    the aeons within the Pleroma.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies the boundary with the Great Firmament or Limitary Spirit
    of Basilides and with the Last Limit of the Pistis Sophia treatise.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Saviour is described as having left the robe of power at the Limit when
    descending for the regeneration of the cosmos outside the Pleroma, and as being
    clothed with it again at final initiation after completing his task.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Day Be-with-us or Day Come-unto-us is described as final initiation or
    perfectioning for rare individuals made worthy to become gods or christs, and
    as the end of the world-cycle for the average mass of humanity.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The robe of power is interpreted as the highest spiritual body or principium
    individuitatis, participating in divine and human natures and opening divine realms
    to the man.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The living symbol of the robe or spiritual body is given as an O, while the
    lower dead symbol is the orthodox cross (+).
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The sexless Heavenly Man, the Logos, is said to limit and crucify himself
    for the good of humanity.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Limit is said to be due to the Father alone, by which he consummates and
