  summary: The passage describes the textual state, publication history, and scholarly
    difficulty of the Bruce Codex and related Coptic Gnostic treatises. It notes lost
    manuscript pages, jumbled leaves, titles preserved in the manuscripts, prior French
    and German editions, Schmidt’s reconstruction and translation work, and Mead’s
    decision to offer only a tentative English summary because the material remains
    complex and untranslated in English.
