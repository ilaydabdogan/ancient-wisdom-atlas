  summary: The passage urges repentance before the Gates of Light are shut. It contrasts
    the fate of one who received mysteries and fell away with that of an impious person
    who never knew them. The Master commands the disciples to preach urgent reception
    of the mysteries of light, warning that the completion of the number of perfect
    souls will close access to the Light. The speaker identifies with the First Mystery
    and says he will set fire to the world to purify cosmic realms and remaining matter
    while humankind is still present.
