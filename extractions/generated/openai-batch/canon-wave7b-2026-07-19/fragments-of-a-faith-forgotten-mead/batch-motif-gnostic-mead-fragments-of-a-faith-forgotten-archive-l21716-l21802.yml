canonical_text:
  quote: ''
  summary: The passage gives sacramental invocations calling upon the Highest Gift,
    Silence, and the Holy Dove or Hidden Mother to descend and join an eucharistic
    love-feast. Mead then interprets these phrases through Gnostic terms such as the
    Name or Power of Christ, Sophia, the Heavenly Man, the Pentad, neophytes awaiting
    a seal, the Pleroma, and Bardaisanist traditions about Sophia's two daughters.
    The passage then begins a summary of an Acts of Thomas story in which Judas Thomas
    is assigned India, sold as a skilled carpenter-slave, brought before a king, and
    commissioned to build a palace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The invocation calls on the Highest Gift and Perfect Mercy to come or descend,
