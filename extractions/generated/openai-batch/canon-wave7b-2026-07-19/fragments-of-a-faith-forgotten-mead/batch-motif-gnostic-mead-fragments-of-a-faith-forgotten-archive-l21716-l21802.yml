  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The invocation asks the addressed figure to commune with the assembled group
    in a thanksgiving or eucharist and a love-feast or agape.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The commentary says these sacramental invocations should be referred to the
