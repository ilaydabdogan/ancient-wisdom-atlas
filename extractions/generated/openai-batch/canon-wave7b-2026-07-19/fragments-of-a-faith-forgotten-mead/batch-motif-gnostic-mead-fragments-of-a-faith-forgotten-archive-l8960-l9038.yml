  quote: ''
  summary: 'The passage gives a descriptive tour of Alexandria: Alexander’s mausoleum
    and the Ptolemaic tombs, the temple of Poseidon, the Museum, baths, the Egyptian
    quarter Rhacotis and its Serapeum, underground cisterns, the Jewish quarter, Hippodrome,
    Nicopolis, Necropolis, and the city’s mixed population at the meeting point of
    Europe, Asia, and Africa.'
