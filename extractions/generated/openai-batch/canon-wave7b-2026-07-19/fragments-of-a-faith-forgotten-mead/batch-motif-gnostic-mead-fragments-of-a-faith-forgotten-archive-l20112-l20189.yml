  quote: ''
  summary: The passage summarizes Ptolemy's response to Flora about the Mosaic Law.
    It presents the Law as having multiple sources, distinguishes inspired law from
    Mosaic enactments and elder traditions, subdivides the inspired law into good,
    bad, and symbolic elements, and describes Christ as translating rites such as
    circumcision, sabbath, fasting, and offerings into spiritual meanings.
  language: English
