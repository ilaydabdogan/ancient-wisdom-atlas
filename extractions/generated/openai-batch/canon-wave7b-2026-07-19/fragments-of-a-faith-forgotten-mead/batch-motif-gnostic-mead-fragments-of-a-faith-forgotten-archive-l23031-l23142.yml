canonical_text:
  quote: ''
  summary: 'The passage first explains Mead''s tentative ordering of the Askew and
    Bruce Codex materials and his intention to lead the reader from lower to higher
    grades of Gnosis. It then summarizes the opening of the Pistis Sophia treatise:
    the risen Jesus has instructed his disciples for eleven years but only to a limited
    level; the disciples mistakenly think the First Mystery, the Father in the likeness
    of a dove, is the highest gnosis. In the twelfth year, on the Mount of Olives
    at full moon, a great light-stream covers Jesus at sunrise, he is hidden in radiance
    from earth to heaven, and he soars into heaven while the disciples are afraid.'
  language: English
  quote_policy: summarized
