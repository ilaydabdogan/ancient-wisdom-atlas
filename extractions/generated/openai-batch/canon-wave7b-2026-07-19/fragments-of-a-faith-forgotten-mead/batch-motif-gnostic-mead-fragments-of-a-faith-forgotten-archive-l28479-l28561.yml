canonical_text:
  quote: ''
  summary: 'The passage summarizes portions of the Akhmim Codex: appearances of the
    Lord or Saviour to disciples, Mary, and John; Mary’s consoling speech and disputed
    revelation; a post-resurrection appearance in The Wisdom of Jesus Christ on a
    Galilean mountain; and a note that the Acts of Peter belongs to apocryphal apostolic
    stories and concerns Peter’s healing-wonders.'
