canonical_text:
  quote: ''
  summary: The passage summarizes teachings on the counterfeit spirit, incarnation,
    and human constitution, then quotes the Saviour explaining that he came into the
    world to save sinners and that the righteous must find the mysteries in the Books
    of Ieou. These books were written by Enoch in Paradise after the Saviour spoke
    from the Tree of Knowledge and Tree of Life, deposited in the rock of Ararad,
    and guarded by Kalapatauroth against the flood and hostile rulers. The passage
    also states that few comprehend the highest mysteries, that souls had not fully
    entered the Light before the First Mystery, and that Mary recognizes the Saviour
    as bringing keys of the mysteries of the Kingdom of Light for cleansing and transforming
    souls.
  language: English
  quote_policy: summarized
