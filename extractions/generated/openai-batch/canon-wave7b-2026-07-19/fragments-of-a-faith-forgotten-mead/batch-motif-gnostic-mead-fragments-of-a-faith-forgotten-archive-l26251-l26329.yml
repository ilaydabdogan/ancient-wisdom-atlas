canonical_text:
  quote: Still upwards and inwards are they to soar to the Space of the Great Light
  summary: The passage catalogs heavenly orders and light-realms, notes the difficulty
    of reconstructing the underlying Gnostic scheme, and describes an upward and inward
    passage through gates and orders toward the True God, aided by invocation, divine
    Names, and a sent Light-power.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The opening catalogue names multiple celestial orders and entities, including
    the Child, Twin Saviours, Great Sabaoth, Great Iao the Good, Seven Amens, Five
    Trees, Seven Voices, and orders such as the Uncontainables, Impassables, Immovables,
    Parentless, Five Impressions, Three Spaces, and Triple Power.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says these spaces and orderings are also mentioned in the Pistis
    Sophia treatise and states that reconstructing the whole scheme is difficult because
    of fragmentary or insufficient source data.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The ascent is described as moving upwards and inwards to the Space of the
    Great Light, which surrounds or transcends the outer Treasure of Light; Ieou is
    said to be there and to be the Great Light, the Second or inner Light Treasure.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Guardians open Gates, allowing passage into the Orders of the Triple Powers
    of the Second Light Treasure and then inward to the twelfth Order of the twelfth
    Great Power of the emanation of the True God.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage describes twelve Great Powers with twelve Chiefs in each order,
    and says that Twelve stand apart in this Space and invoke the True God with a
    Name or prayer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The invocation addresses the Father of all fatherhood and includes a mystery-language
    sentence with four vowels each repeated seven times; its interpretation says that
    the All came out of the Alpha and will return to the Omega at the consummation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The prayer asks the True God to send forth great Light-power to follow the
    Twelve Uncontainables, interpreted in the passage as the twelve disciples, because
    they have received the Mystery of the Forgiveness of Sins and are not to be held
    back from the Light-Treasure.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The True God sends forth Light-power, which shines from behind the disciples;
    the Treasures of the Second Light-realm withdraw, and the disciples reach the
    Space of the True God.
  category: sequence
  evidence_refs:
  - ev:8
