canonical_text:
  quote: ''
  summary: 'The passage summarizes the mythic suffering of Pistis Sophia: she is in
    the Thirteenth Aeon, gazes upward toward the Treasure of Light, desires ascent,
    ceases the local mystery, is hated by lower rulers, is deceived by Arrogant''s
    lower light-power, descends into matter and Chaos, has her light consumed, cries
    to the Light of lights, and sings repentances. A note states that her repentances
    and songs of praise interpret Psalms and Odes of Solomon.'
