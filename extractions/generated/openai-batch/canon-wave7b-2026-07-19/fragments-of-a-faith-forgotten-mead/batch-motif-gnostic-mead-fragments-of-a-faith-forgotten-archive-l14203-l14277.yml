canonical_text:
  quote: ''
  summary: 'Modern scholarly account of Cerinthus and the Cerinthians: their name,
    reported placement in apostolic times, treatment by Epiphanius and Irenaeus, relation
    to Ebionism and John traditions, reported Egyptian training and Asian teaching,
    claims about Apocalypse authorship, and a summary of Cerinthian cosmogony and
    christology. The doctrinal summary presents a supreme God above the World-fashioner;
    Jesus as son of Joseph and Mary; the Christ or Father in dove-form descending
    at baptism, empowering Jesus to prophesy, work wonders, and preach the unknown
    Father; the Christ leaving before Jesus suffers; and Jesus rising or appearing
    after death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the Cerinthian circle, also called Merinthians according
    to Epiphanius's variant, derived its name from Cerinthus, who is placed in apostolic
    times.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Epiphanius is described as making Cerinthus a scapegoat for the pillar-apostles'
    antagonism to Paul, while the passage says impartial criticism must return to
    Irenaeus's shorter account.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Irenaeus is described as living a full century after Cerinthus and as giving
    only a brief paragraph about him, copied by later writers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cerinthus is described as a strong trace between Ebionism or the original
    external non-Pauline tradition and the beginning of the second century.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The story that Cerinthus personally contacted John is dismissed because the
    same story is also told of the mythic Ebion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cerinthus is said to have been trained in the Egyptian discipline and to have
    taught in Asia Minor, but the passage calls identification of that discipline
    with the Philonic school an assumption.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some Gnostics are reported as claiming Cerinthus was the writer of the Apocalypse
    orthodoxly ascribed to John.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage summarizes the cosmogony as declaring the excellence of the God
    over all beyond the subordinate power, the World-fashioner.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage summarizes the christology as saying Jesus was son of Joseph and
    Mary, and that at his baptism the Christ, identified as the Father in dove-form,
    descended upon him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the descent at baptism, Jesus is said to have begun to prophesy, perform
    mighty works, and preach the previously unknown Father.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Christ is then said to have left Jesus, after which Jesus suffered and
    rose again, glossed by the passage as appearing to his followers after death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says the Cerinthians used an earlier Hebrew collection rather
