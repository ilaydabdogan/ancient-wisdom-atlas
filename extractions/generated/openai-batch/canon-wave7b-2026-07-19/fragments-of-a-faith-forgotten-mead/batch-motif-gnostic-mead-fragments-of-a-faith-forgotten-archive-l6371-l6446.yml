canonical_text:
  quote: ''
  summary: A modern scholarly passage argues that a new religious-intellectual activity
    appeared among several cultures, names notable teachers such as Confucius, Laotze,
    the Buddha, Zoroaster, and Pythagoras, then focuses on Greek predecessors, Egyptian
    learning, Homeric and Hesiodic materials, Orphic fragments, and Onomacritus's
    recovery of older Greek religious tradition before the Persian wars.
  language: English
