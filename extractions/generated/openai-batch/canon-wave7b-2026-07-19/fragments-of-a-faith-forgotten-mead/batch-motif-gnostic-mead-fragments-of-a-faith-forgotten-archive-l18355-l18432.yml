canonical_text:
  quote: ''
  summary: The passage summarizes a Sophia myth in which the Father responds to Wisdom's
    tears by arranging an additional emanation. Mind-and-Truth emanate Christ-and-Holy-Spirit
    to form or remove Wisdom's formless solitary production and relieve her distress.
    Mead comments on the meaning of “only-begotten” as “created alone,” then cites
    a further emanation, the Cross or stock, sent as a guarding boundary of the Pleroma
    holding the thirty aeons together.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Father takes pity on Wisdom's tears, hears the prayers of the aeons, and
    orders an additional emanation, but does not Himself emanate it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mind-and-Truth emanate Christ-and-Holy-Spirit for the enforming and elimination
    of Wisdom's abortion and for the relief and appeasing of Wisdom's complaints.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: With Christ-and-Holy-Spirit included, the passage counts thirty aeons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The commentator identifies the passage as presenting a dual world-creator
    and redeemer type, linking Christ with the Logos and the Holy Ghost with the Comforter.
  category: other
  evidence_refs:
  - ev:2
- id: obs:5
  text: Christ-and-Holy-Spirit eliminate the formless abortion that Wisdom begot by
    herself without a consort from among the universal aeons.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The removal of the formless abortion is said to prevent the perfect aeons
    from being thrown into confusion at the sight of its formlessness.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The commentator explains “only-begotten” or “alone-begotten” as meaning created
    alone, from one principle and not from a syzygy or pair.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Father sends forth a single aeon, the Cross or stock, as a guard, wall
