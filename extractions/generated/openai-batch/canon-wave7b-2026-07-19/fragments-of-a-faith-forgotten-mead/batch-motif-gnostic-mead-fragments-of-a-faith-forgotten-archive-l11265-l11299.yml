canonical_text:
  quote: ''
  summary: The passage presents Dositheus as a legendary figure connected with Simon
    Magus, John the Baptist, Samaritan and heresiological notices, and the Dosithean
    sect. It says the notices are unreliable, but that the persistence of the sect
    suggests Dositheus was significant. It reports traditions that Dositheus and Simon
    were followers of John the Baptist, hostile to Jesus, and claimants to prophetic
    or messianic status. It also describes the Dositheans as having a mode of life
    resembling the Essenes, secret volumes, and literature, and places Dositheus in
    relation to Arabia and mystic communities allied with the Essenes and Therapeuts.
  language: English
  quote_policy: summarized
