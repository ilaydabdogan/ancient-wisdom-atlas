  summary: The passage discusses the scarcity and mediated nature of evidence for
    Valentinus and the Valentinian movement. It describes reports that Valentinus'
    writings were complex syntheses of earlier Gnostic formulations, contrasts Coptic
    treatises with Patristic accounts, and emphasizes that followers of Valentinus
    were independent thinkers whose teachings were preserved mainly through hostile
    or fragmentary testimony.
