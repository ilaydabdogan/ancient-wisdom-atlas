canonical_text:
  quote: ''
  summary: The passage quotes and summarizes Gnostic material in which Wisdom or Thought
    is the first conception and Mother of All, descends to generate angels and powers,
    is detained by them, imprisoned in human bodies, and identified as the lost sheep.
    A descending liberator comes to free her and provide salvation by gnosis. The
    passage then discusses The Great Announcement, whose opening describes a hidden
    revelation, a human dwelling, and Fire as the twofold symbol of the Boundless
    Power and Universal Root, later likened to a great Tree above the heavens.
