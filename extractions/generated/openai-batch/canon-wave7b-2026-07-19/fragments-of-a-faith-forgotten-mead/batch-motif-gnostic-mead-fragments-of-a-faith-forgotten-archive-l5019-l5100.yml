canonical_text:
  quote: ''
  summary: The passage opens with an epigraph on creation travailing for the manifestation
    of the Sons of God, then introduces a personified Time pregnant with a twentieth
    century since Jesus. It summarizes a common Christian creed in which Jesus is
    the Teacher of the Way, the Way itself, and an Illuminator whose light enters
    the world. It then quotes an Augustan birthday inscription that presents the emperor's
    birth as world-renewing, salvific, divinely providential, peace-bringing, and
    the beginning of a new era, explicitly comparing such language with Christian
    claims about Jesus' natal day.
  language: English
  quote_policy: summarized
