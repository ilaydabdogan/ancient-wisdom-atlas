canonical_text:
  quote: ''
  summary: 'The passage summarizes elements of Monoimus''s system: the plagues are
    read as transmutations of bodily matter; Monoimus is placed near the Valentinian
    school; his system is said to illuminate Gnostic theological arithmetic; and a
    letter to Theophrastus instructs the seeker to stop looking for God externally,
    to seek God within, to investigate inner faculties and involuntary states, and
    thereby to find God in oneself as one and many. The passage closes by saying this
    teaching echoes earlier Trismegistic literature.'
