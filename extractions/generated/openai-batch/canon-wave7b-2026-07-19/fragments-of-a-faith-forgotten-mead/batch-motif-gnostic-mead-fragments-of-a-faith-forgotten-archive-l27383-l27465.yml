canonical_text:
  quote: ''
  summary: The passage describes a Gnostic apocalyptic cosmology in which crowned
    powers praise the Alone-begotten Logos, acknowledge a Father and Mother of all,
    and receive an unfading wreath through the Logos' Image. A luminous figure becomes
    a body of light, passes into the aeons, reaches the Alone-begotten in the Monad,
    and receives grace and an eternal wreath. Higher grades of being are described,
    including a Perfected One whose light exceeds the Pleroma's endurance. The Logos-Demiurgos
    appears with crowned powers whose bodies, speech, sight, gestures, self-gazing,
    and bodily union correspond to eternal life, rest, flight, knowledge, return,
    and the ingathering of Israel. The Creator-Logos is united with those who came
    forth and becomes divine power, lord, saviour, Christ or righteous one, good,
    father, and mother.
  language: English
  quote_policy: summarized
