canonical_text:
  quote: ''
  summary: The passage introduces fragmentary Oxyrhynchus sayings attributed to Jesus.
    The sayings include commands to fast from the world and keep the Sabbath, Jesus
    standing in the world and grieving over blind-hearted people, divine presence
    found with one or two persons and in stone and wood, a prophet not accepted in
    his country, a fortified city on a high hill, a closed ear, the promise that hearers
    will not taste death, a seeking-finding sequence ending in wonder, reigning, and
    rest, self-knowledge as discovery of the Kingdom within and sonship to the Father,
    and the revelation of hidden or buried things.
  language: English
  quote_policy: summarized
