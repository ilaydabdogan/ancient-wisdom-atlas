canonical_text:
  quote: '"the goal of the ideas, expressions, and dancers is piety"'
  summary: The passage describes Therapeuts chanting hymns in God's honor, dancing
    and answering one another in bands, then joining into one chorus. Their joined
    chorus is said to imitate the chorus on the banks of the Red Sea, where the sea
    at God's command brought safety to one party and ruin to another. An editorial
    parenthesis identifies this as the Israelites' triumph dance after Pharaoh's destruction,
    led by Moses and Miriam, while questioning whether all Therapeuts could have derived
    the custom from that myth. The final description emphasizes male and female voices
    answering each other in harmonious piety.
  language: English
  quote_policy: quoted
