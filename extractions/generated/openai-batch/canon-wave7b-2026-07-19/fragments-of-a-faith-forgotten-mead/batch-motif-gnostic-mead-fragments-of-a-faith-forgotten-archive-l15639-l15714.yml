canonical_text:
  quote: ''
  summary: The passage summarizes the Basilidian system as a purification and restoration
    of elements confused in an original world-seed or universal plasm, producing Gnosis
    or perfected consciousness. It presents humanity as the crown of the world-process
    and the perfected man, Christ the Saviour, as the manifestation of Deity or Sonship.
    It then notes the modern recovery and evaluation of sources for Basilidian teaching,
    summarizes Basilides and Isidorus on marriage as natural but not necessary, and
    quotes Basilides on martyr suffering as providentially beneficial in relation
    to reincarnation and karman.
  language: English
  quote_policy: summarized
