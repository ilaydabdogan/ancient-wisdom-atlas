canonical_text:
  quote: ''
  summary: The passage describes an inward movement through sacred spaces toward the
    inner Treasures, Silences, and Peace Eternal. Jesus promises mysteries to his
    disciples, gathers male and female disciples to receive three baptisms before
    learning the mystery of the Rulers, instructs them to obtain two jars of wine
    and two vine branches from a sexually renounced person in Galilee, and arranges
    an offering with vessels, spices, white linen robes, plants, the number of the
    Seven Voices, a linen cloth, a cup, and bread or loaves.
  language: English
  quote_policy: summarized
