    editorially as the God beyond Being establishes another figure so that others
    may strive toward a City associated with Image, Father, Son, Mother, and the Fullness.
    The passage then describes a First Father or first Being in whom the All moves
    and receives form, whose voice and tone extend into all spaces, and whose members
    produce many powers. It closes by introducing a second space that comes into being
    and is named Demiurge, Father, Logos, Source, Mind, Man, Eternal, Limitless, Pillar,
    Support, and Overseer.
