canonical_text:
  quote: ''
  summary: A collection of sayings attributed to the Lord or Master instructs addressees
    to guard mysteries, cleave to holy ones, perform a bread-and-cup proclamation
    of death, resurrection, ascension, and return, seek faith, hope, love, knowledge,
    and discernment, understand the kingdom as a union beyond paired opposites, preserve
    the indwelling Spirit and Light, see the speaker within themselves as in water
    or a mirror, expect judgment, practice purity, compassion, non-retaliation, and
    love, reject false christs and teachers who violate grace, and affirm the Heavenly
    Father's preference for repentance over chastisement.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker commands that the mysteries be guarded for himself and for the
    sons of his house, and says that those who cleave to holy ones are made holy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the fashion of this world passes away, with a bracketed note
    glossing fashion as configuration and mentioning other worlds and phases of this
    world.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: A saying instructs the addressees to eat bread and drink a cup while proclaiming
    the speaker's death and confessing his resurrection and ascension until he comes
    to them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A bracketed note reports a variant in the third person that speaks of the
    death of the Son of the Man, the Logos, and says the Master promises to return
    to his disciples during a certain holy rite.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: Faith and hope are named as the means through which love to God and man is
    born, and this love gives eternal life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage distinguishes a mingling that leads to death from a mingling that
    leads to life.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the Lord sees a man working on the Sabbath, he says the man is blessed
    if he knows what he does, but accursed and a transgressor of the law if he does
    not know.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker asks why the addressees wonder at signs and says he gives them
    a mighty inheritance which the whole world cannot contain.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: In response to a question about when his kingdom will come, the Lord says
    it will be when two are one, the without as the within, and the male with the
    female, neither male nor female.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says not to call anyone father on earth because on earth there
    are only rulers; the Father is in heaven and is the source of every descent in
    heaven and on earth.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The addressees are told not to grieve the Holy Spirit in them and not to put
    out the Light that has shone forth in them.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The speaker says that as the addressees see themselves in water or a mirror,
    they should see him in themselves.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The speaker says he will judge the addressees as he finds them.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The addressees are told to seek the great and heavenly so that the little
    and earthly will be added, and to be approved money-changers who reject the bad
    and retain the good.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: The passage commands fleshly purity, non-retaliation, and love, saying that
    love hides a multitude of sins.
  category: speech
  evidence_refs:
  - ev:15
  - ev:17
- id: obs:16
  text: The speaker identifies himself as sick because of the sick, hungry because
    of the hungry, and thirsty because of the thirsty.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:17
  text: False christs and false teachers are said to have blasphemed the Spirit of
    Grace and not to be forgiven in this aeon or the aeon to come; a note identifies
    them as initiated persons who broke their vows.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:18
  text: The Heavenly Father is said to will the repentance of the sinner rather than
    the sinner's chastisement.
  category: speech
  evidence_refs:
  - ev:19
