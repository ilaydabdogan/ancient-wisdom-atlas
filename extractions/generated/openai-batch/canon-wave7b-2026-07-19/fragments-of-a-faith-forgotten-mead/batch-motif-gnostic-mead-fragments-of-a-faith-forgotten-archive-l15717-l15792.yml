canonical_text:
  quote: ''
  summary: 'The passage presents Mead''s account of Basilidian teaching on sin, suffering,
    former lives, martyrdom, faith, and the passions. It argues that unacted sinful
    will still constitutes guilt, that suffering is not evidence that Providence is
    evil, that souls suffer from deeds in former lives, and that the elect soul suffers
    honourably through martyrdom. It then explains transmigration language through
    the animal nature within the human being: passions are described as appendages
    or spirit-like accretions attached to the rational soul through turmoil and primitive
    confusion, with alien animal natures such as wolf, ape, lion, and goat growing
    upon the soul''s nucleus.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that a virtuous person who has not committed actual sin may
    still have a tendency or will to sin; the will to adultery or murder is treated
    as constituting the adulterer or murderer even without the completed act.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A supposedly sinless person suffering martyrdom is said to be evil insofar
    as the will to transgress remains, while Providence is not to be called evil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Jesus is raised as an example, the response given is that he has not
    sinned but was like a babe suffering; if pressed further, the passage says the
    named man is man, while God alone is righteous and no one is pure from pollution.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Basilides is reported as teaching that people suffer from deeds in former
    lives; the elect soul suffers honourably through martyrdom, while souls of another
    nature undergo other appropriate punishments.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elect soul is associated with faith, defined as assent of the soul to
    non-sensory things, and with discovering doctrines without demonstration by intellective
    apprehension.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage distinguishes the transmigration of a human soul into an animal
    body from a doctrine of reincarnation that denies such a possibility.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Basilidian school is said to explain transmigration language through the
    animal nature in the human being, identified as animal soul or body of desire,
    where the passions inhere.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Clement is quoted as saying that Basilidians call the passions appendages
    or accretions; these essences, literally spirits, have substantial existence and
    are attached to the rational soul because of turmoil and primitive confusion.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The commentary compares the animal soul with the counterfeit spirit in the
    Pistis Sophia and with turmoil in Plato's Timaeus, and identifies primitive confusion
    with a chaotic conglomeration of the universal seed-mixture.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Clement's account says that other bastard and alien natures grow onto the
    nucleus, including those of the wolf, ape, lion, and goat.
  category: object
  evidence_refs:
  - ev:8
