canonical_text:
  quote: ''
  summary: 'The passage discusses the efficacy of mysteries: pardon is available only
    through the Mystery of the Ineffable; recipients of mysteries may pray and invoke
    for unbelieving relatives and friends to receive a better after-death lot and
    return in favorable conditions; disciples ask whether mysteries can spare them
    the pains of martyrdom; the answer says that one who accomplishes the highest
    of the three higher mysteries will ascend at death to the Kingdom of Life, while
    not stating that martyrdom pain is avoided; the mystery of the resurrection of
    the dead is described as healing possessions, sufferings, diseases, and disabilities.'
