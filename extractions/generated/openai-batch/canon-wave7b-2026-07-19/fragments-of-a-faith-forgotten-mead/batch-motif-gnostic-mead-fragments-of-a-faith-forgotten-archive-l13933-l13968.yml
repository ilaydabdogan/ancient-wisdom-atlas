canonical_text:
  quote: ''
  summary: 'The passage summarizes doctrines of a Gnostic school: the sensible world
    is made by inferior builders beneath the unknown Father; Jesus is human-born but
    has a strong, pure soul that remembers the Father; the Father gives him powers
    to escape the rulers, pass through their spheres, and ascend. Similar souls may
    also ascend, and the group claims some members reached Jesus-like or greater perfection.
    Mead compares the recollection and soul-course motif with Pythagorean, Platonic,
    and Hermetic traditions.'
