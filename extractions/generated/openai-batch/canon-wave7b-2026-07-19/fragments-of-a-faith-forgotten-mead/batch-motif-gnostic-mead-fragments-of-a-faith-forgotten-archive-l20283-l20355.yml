canonical_text:
  quote: ''
  summary: 'The passage summarizes Ptolemy''s exegesis of the Johannine Proem: God/Father,
    Beginning/Son/Mind, and Logos are distinguished and then identified; the Logos
    mediates aeonic creation; Life is the Logos''s consort and light-giver; the sensible
    world''s chaos becomes cosmos through the Divine Aeon''s passion; and the Proem
    is said to contain two tetraktydes of paired divine names.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage first distinguishes God, Beginning, and Logos, then identifies
    or at-ones them, describing the Son or Beginning or Mind and the Logos as emanating
    from the Father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Beginning is described as in and from the Father, and the Logos as in
    and from the Beginning.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Logos is described as one with God because the Beginning is one with God
    and what is of God is God.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Logos is said to be the cause of divine or aeonic creation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Life is identified as the syzygy or consort of the Logos, is in Him, is united
    to Him, and bears fruit through Him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Aeons came into being through the Logos, while Life was in Him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Life is called the Light of men; the passage says that men first signifies
    the supernal Man and his spouse, the Church, who were enlightened through Life.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The phrase about Light shining in Darkness is applied to the sensible universe;
    the chaos of the sensible universe was made into cosmos by the passion of the
    Divine Aeon, though the sensible world did not know Him.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The enlightened alone are said to have beheld the glory of the Alone-begotten
    Son, the Divine Aeon or Pleroma, given by the Father and full of Grace, Silence,
    Peace, and Truth.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'Ptolemy is said to find two tetraktydes in the Proem: Father and Silence,
    Mind and Truth, Word and Life, Man and Church.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The author states that Irenaeus' summary of the tenets of those of Ptolemy
    differs only slightly from the aeon-process and Sophia-mythus drama previously
    familiar from Hippolytus's account.
  category: speech
  evidence_refs:
  - ev:8
