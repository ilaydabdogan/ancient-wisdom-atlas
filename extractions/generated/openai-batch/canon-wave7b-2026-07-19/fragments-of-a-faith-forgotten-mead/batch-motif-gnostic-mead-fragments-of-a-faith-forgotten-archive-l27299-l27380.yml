canonical_text:
  quote: ''
  summary: The passage discusses the inexpressibility of the Father's Mystery, names
    earlier Gnostic seers, quotes a saying attributed to Phosilampes, and then summarizes
    material from an untitled apocalypse concerning Setheus as Logos-Creator, cosmic
    praise of him and the hidden Son, the descent of a Light-spark into matter, mixed
    reactions to that descent, the sending of Guardians, and the Light-spark as the
    Indivisible who struggles for the universe.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Father's Mystery is said to be impossible to express in its reality; Marsanes,
    Nicotheus, and the Perfect are said to have seen and praised Him but failed to
    reveal Him.
  category: attribute
  evidence_refs:
  - ev:1
