  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The treatise is said to devote much attention to the Logos, his creative powers,
    and his self-emanation.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: Setheus is described as dwelling in the Shrine as King and God, and as the
