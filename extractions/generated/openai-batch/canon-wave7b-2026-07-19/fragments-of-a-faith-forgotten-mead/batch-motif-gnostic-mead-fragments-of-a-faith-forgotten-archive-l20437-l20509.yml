canonical_text:
  quote: ''
  summary: 'The passage gives a biographical and scholarly account of Bardaisan/Bardesanes:
    his education, association with an Abgar ruler, embrace and defense of Gnostic
    Christianity, travels and writings, Syriac hymns, surviving treatise on fate or
    karman, and later scholarly reassessment of his status as Gnostic or orthodox.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young Bardaisan received an elite education, was raised with a prince who
    later became one of the Abgars, shared martial exercises with him, became known
    for archery, married, and had a son named Harmonius.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Bardaisan’s age at embracing Gnostic Christianity is uncertain;
    he converted his royal friend and patron, induced the Abgar to make it the state
    religion, and is said to have indirectly established the first Christian state.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After Caracalla dethroned Abgar Bar-Manu in 216, Bardesanes defended the Christian
    faith before a representative of the Roman Emperor; Epiphanius called him “almost
    a confessor.”
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bardaisan went to Armenia, composed a history from temple chronicles found
    in the fortress of Ani, translated it into Syriac, and this work is said to have
    formed the basis for the later history of Moses of Chorene.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Bardaisan studied Indian religion and wrote a book on the subject that Porphyry
    later quoted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage presents Bardaisan as a poet and writer on Christian theology
    and theosophy who wrote many books in Syriac and Greek, though most titles are
    lost.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: His most famous work is described as a collection of 150 Hymns or Psalms modeled
    on the second-temple Psalm collection; he adapted Syriac to metrical forms, set
    words to music, and the hymns became widely popular among Syriac speakers.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Known titles of other works include Dialogues against the Marcionites, The
    Light and the Darkness, The Spiritual Nature of Truth, The Stable and Unstable,
    and Concerning Fate.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that only a Syriac treatise entitled Book of the Laws of
    Countries has come down from these works; it was brought to the British Museum
    in 1843 among the Nitrian manuscripts and summarizes Bardaisan’s views on fate
    or karman as set forth by a pupil.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Cureton published the Syriac text and an English translation in 1855; the
    possession of an approximately first-hand source is said to have changed older
    views based on hearsay and Ephraim’s polemic, while Hort’s view attempts to place
    Bardesanes in orthodoxy rather than Gnosticism.
  category: sequence
  evidence_refs:
  - ev:7
