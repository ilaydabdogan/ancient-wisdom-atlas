canonical_text:
  quote: I am thou and thou art I; and wheresoever thou art I am there.
  summary: Mead discusses fragments associated with the Acts of John and related Gnostic
    texts. The passage presents a hidden-way greeting, a Gospel of Eve mountain vision
    of a mighty Man and a dwarf with a thunder-like voice declaring identity and scattered
    presence, a Gospel of Philip ascent apology in which the soul gathers its scattered
    limbs, and a prayer attributed to John at a sacred feast before his departure
    from life, addressed to Christ with many praise-names.
  language: English
  quote_policy: quoted
