  quote: ''
  summary: The passage presents the Nicolaitans as an obscure early Gnostic circle
    known chiefly through hostile orthodox and heresiological reports. It uses cave,
    darkness, and daylight imagery for the limits of historical knowledge; it then
    summarizes accusations from the Apocalypse, Irenaeus, later heresiologists, and
    Epiphanius, before noting a contrary tradition that Nicolaus was ascetic and cautioning
    against accepting sweeping Church Father condemnations.
  language: English
