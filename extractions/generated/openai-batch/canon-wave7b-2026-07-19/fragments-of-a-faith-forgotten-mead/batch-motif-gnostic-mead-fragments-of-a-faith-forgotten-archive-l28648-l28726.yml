  evidence_refs:
  - ev:1
- id: obs:2
  text: Incorruptibility manifests after a request and divine assent, stands with
    Thought and Foreknowledge, and glorifies the Invisible and Barbelo.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Everlasting Life manifests after a request made for the others, and the manifested
    figures glorify Him and Barbelo.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage identifies Barbelo, Thought, Foreknowledge, Incorruptibility,
    and Everlasting Life as a pentad of Aeons of the Father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The account attributed to Irenaeus presents a sequence in which Thought asks
    for Foreknowledge, Foreknowledge asks for Incorruptibility, Life Eternal follows,
    Barbelo generates a Light, and the Father anoints the Light with goodness so that
    it is called Christ.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The cited manuscript wording says Barbelo gazes into Him and gives birth to
    a blessed Light-spark, identified as the Alone-begotten, self-generated God, first-born
    Son of the All, and pure Light-spirit; the Invisible Spirit rejoices over the
    Light and anoints him with goodness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Alone-begotten asks for Mind; Mind is given and praises the Father and
    Barbelo. Irenaeus is also quoted as saying Christ requested Mind as a helper.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The narrator says Irenaeus omitted a stage and forgot Will, named here as
    the third male Aeon; Irenaeus also says the Father sends forth the Word after
    Mind.
  category: other
  evidence_refs:
  - ev:8
