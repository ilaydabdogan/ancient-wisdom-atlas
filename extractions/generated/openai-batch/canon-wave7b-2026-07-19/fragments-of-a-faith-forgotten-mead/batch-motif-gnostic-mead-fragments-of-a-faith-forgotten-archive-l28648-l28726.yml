canonical_text:
  quote: ''
  summary: The passage describes a Gnostic emanation sequence in which personified
    Aeons manifest after petitions and divine assent. Barbelo, Thought, Foreknowledge,
    Incorruptibility, and Everlasting Life are identified as a pentad. A related account
    attributed to Irenaeus is compared with manuscript wording in which Barbelo gives
    birth to a Light-spark, identified with the Alone-begotten and Christ, whom the
    Invisible Spirit anoints with goodness. The Alone-begotten then asks for Mind,
    and the passage notes Irenaeus' omission of Will.
  language: English
  quote_policy: summarized
