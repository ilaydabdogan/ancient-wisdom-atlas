canonical_text:
  quote: ''
  summary: The passage states that the Father's will is for the universe to return
    to Him. Those who repent flee matter and the lower aeon, ascend to the aeon of
    the self-fathered one, accept a vow of renunciation, and receive promises and
    the mystery of the hidden Father. The First-born is described as clothed in a
    vesture containing all bodies, separating and warming matter, raising powers and
    species, giving laws, teaching Light, and departing to the Mother of the universe
    beside the Father.
  language: English
  quote_policy: summarized
