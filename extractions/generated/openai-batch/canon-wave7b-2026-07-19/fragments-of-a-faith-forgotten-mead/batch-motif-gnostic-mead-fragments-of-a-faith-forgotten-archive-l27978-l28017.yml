canonical_text:
  quote: ''
  summary: A scholarly note argues that the Extracts and part of The Book of the Great
    Logos derive from the same original, discusses translation differences between
    the Askew and Bruce Codices, and distinguishes this common document from The Two
    Books of Ieou. The note reports that Pistis Sophia says the Saviour gave The Two
    Books of Ieou to Enoch and that they were preserved from the Flood, then proposes
    that these books belonged to an ancient, probably Egyptian, tradition containing
    symbols, seals, passwords, and mystery-names.
