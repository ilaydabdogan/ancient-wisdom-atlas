canonical_text:
  quote: "“all things hasten from below upward, from worse to better”"
  summary: 'The passage summarizes and quotes Basilidean teaching: the Holy Spirit
    derives from the universal Seed; the second Sonship is borne upward by the Spirit
    as by a wing but leaves it near the Blessed Space; the Spirit retains the savour
    of the Sonship like scent remaining in an emptied vessel of unguent; this savour
    permeates downward to formless matter and prompts the remaining Sonship’s ascent.
    The Spirit is also described as the Limitary Spirit or Firmament between sensible
    and noumenal realms, and the Great Ruler or demiurge emerges from the seed-mixture
    as head of the sensible universe.'
  language: English
  quote_policy: quoted
