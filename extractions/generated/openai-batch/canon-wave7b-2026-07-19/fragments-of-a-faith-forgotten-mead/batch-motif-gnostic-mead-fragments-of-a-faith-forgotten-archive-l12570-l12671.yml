canonical_text:
  quote: ''
  summary: 'The passage recounts an early Ophite or Justinian system: Elohim ascends
    with his powers, recognizes a higher Good Deity, and enters the Light-world; the
    abandoned Soul/Eden and the serpent-power Naas oppose the spirit in humans; Baruch
    is sent as teacher and helper; Hercules and Jesus are interpreted within this
    conflict, with Jesus remaining faithful, being crucified, leaving lower bodies
    on the tree, and ascending to the Good One and life-giving water.'
  language: English
  quote_policy: summarized
