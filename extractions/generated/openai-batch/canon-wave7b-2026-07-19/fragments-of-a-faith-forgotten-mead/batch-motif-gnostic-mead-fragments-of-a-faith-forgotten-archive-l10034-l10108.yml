canonical_text:
  quote: ''
  summary: 'The passage discusses Mead''s account of the Ebionites: later heresiologists
    are said to have personified epithets and doctrines as named heretics; the Ebionites
    are explained as originally meaning the poor; they are described as preserving
    early public teachings of Jesus, opposing Pauline gentile Christianity, and viewing
    Jesus as a wise prophet and manifestation of the Messiah whose full messianic
    kingship would appear at a second coming, bringing subjection of nations and a
    thousand-year period of peace and plenty.'
  language: English
  quote_policy: summarized
