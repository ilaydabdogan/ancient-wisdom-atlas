canonical_text:
  quote: ''
  summary: The passage presents a hymn sung by the powers of the Mother to the Son
    or supreme One. The hymn praises the addressee as boundless, unknowable, creator,
    source of order, and giver of seals to creatures. It describes hidden worlds,
    the begetting and manifestation of the Man, a prayer associated with Sophia and
    her offspring, the descent of a Light-spark on Sophia, and the Lord of Splendour
    dividing matter into two bounded regions.
