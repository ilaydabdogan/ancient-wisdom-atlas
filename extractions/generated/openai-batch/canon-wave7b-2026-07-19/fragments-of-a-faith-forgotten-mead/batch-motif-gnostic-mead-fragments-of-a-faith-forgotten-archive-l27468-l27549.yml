canonical_text:
  quote: ''
  summary: The passage describes a consummation in which the Victor or Glorified receives
    the sacrifice, vow, task, vesture, powers, hosts, and fatherhood. He raises purified
    matter into an immortal world-city-land, receives an ineffable robe of light,
    participates in separating being from non-being/matter through veils and purifying
    powers, creates an Aeon with Pleroma and Sanctuary, addresses spiritual children,
    and desires to lead the universe back to the hidden Father.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the consummation, all things are ordered anew for the Victor, who receives
    the first fruits of the sacrifice of the Sonship, power to become thrice-powerful,
    the vow of the Sonship, and an entrusted struggle or task.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The universe is described as having been sold, with the supplied editorial
    possibility of slavery.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Victor raises up the whole purity of matter and makes it into a World,
    an Aeon, and a City with names including Immortality, Jerusalem, New Earth, Self-sufficing,
    and Perfect Freedom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The resulting Land is described as god-bearing and quickening.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: A Wreath of the glorified is identified with something written as having been
    given to Solomon on the day of the joy of his heart.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The first Monad sends Him an ineffable Vesture described as all Light, Life,
    Resurrection, Love, Hope, Faith, Wisdom, Gnosis, Truth, and Peace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The universe is said to be in the Vesture, to find and know itself there,
    and to receive light in its ineffable Light.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Myriads of powers are given to the Vesture so that it may raise up the universe
    once for all.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Monad, with editorial uncertainty, gathers its vestures into the form
    of a surrounding veil, pours itself over them, raises all, and separates all according
    to orders, laws, and forethought.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: That-which-is is separated from that-which-is-not; that-which-is-not is identified
    in the passage as evil manifested in matter.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Vesture-power names that-which-is eternal and that-which-is-not matter,
    and places veils and purifying powers between them for cleansing and purging.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Myriads of glories, angels, archangels, and ministers are given to Him to
    serve Him, and authority over all things is given to Him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: He creates for Himself a mighty Aeon, lays in it a vast Pleroma and a mighty
    Sanctuary, and places in them all the powers He had received.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: The hidden Father in silence sends treasures and gives a commandment; the
    crown of Fatherhood is given to Him because the Father establishes Him as father
    of those who arose after Him.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: He cries out to His children, saying that He travails until Christ is formed
    in them.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: He also cries that He would set beside a holy virgin an only husband, Christ.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: After seeing the Grace with which the hidden Father endowed Him, He desires
    to lead back the universe to the hidden Father.
  category: action
  evidence_refs:
  - ev:8
