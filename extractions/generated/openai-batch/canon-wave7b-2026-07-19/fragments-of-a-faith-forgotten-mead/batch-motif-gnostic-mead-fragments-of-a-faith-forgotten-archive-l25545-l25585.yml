canonical_text:
  quote: ''
  summary: The passage describes the Great Sabaoth appearing from the height among
    those of the Right after those of the Left are drawn aside. Before appearing,
    he looks down on the regions of Paraplex so that they may dissolve and so that
    souls in Paraplex's torments may be brought out and led into the Sphere. A comment
    associates Ieou or leou and Melchisedec with the sun and moon. The disciples then
    bow to the Master and ask for mercy and preservation from malignant torments,
    describing humanity as blind in darkness and endangered by powers that prey on
    souls through forgetfulness and ignorance.
