canonical_text:
  quote: ''
  summary: 'The passage first summarizes a Gnostic account in which Jesus has a psychic
    and spiritual body, teaches mysteries to capable disciples, receives souls, and
    the Light is eventually gathered into the Incorruptible Aeon. Mead then gives
    comparative comments on this system and introduces an early Ophite or Justinian
    system reported by Hippolytus from the Book of Baruch. The outline describes three
    principles: the Good, Elohim as Father-Spirit, and Eden as World-Soul or Mother-Soul
    in woman-serpent form; from Elohim and Eden come twenty-four powers, including
    World-Trees and Edenic rivers, and humans are constituted through soul and spirit
    under cyclic cosmic powers.'
  language: English
  quote_policy: summarized
