canonical_text:
  quote: ''
  summary: Mead frames the Johannine Acts as evidence that some Gnostics understood
    the crucifixion as a mystery rather than only as a literal historical event. In
    the excerpt, the Lord appears to John on the Mount of Olives, stands in a light-filled
    cave, and says that the visible crucifixion is occurring below in Jerusalem while
    he speaks to John. John is shown a cross of light, multitudes around and on it,
    and the Lord above it as a shapeless divine voice. The voice names the cross by
    many salvific terms and explains it as the delimitation and ordering of all things,
    the harmony of Wisdom, and not the wooden cross seen after descent.
  language: English
  quote_policy: summarized
