    causes Receivers of the Light-treasure to take the soul from the body, carry it
    through inferior spaces into the Light-treasure, blot out its sins, and bring
    it inward through the Light-realm. It commands that these mysteries be kept secret
    from the unworthy, relatives, material exchange, and sorcerers associated with
    Sabaoth Adamas. It states that only those who have abandoned the world and placed
    faith in the Light are worthy.
