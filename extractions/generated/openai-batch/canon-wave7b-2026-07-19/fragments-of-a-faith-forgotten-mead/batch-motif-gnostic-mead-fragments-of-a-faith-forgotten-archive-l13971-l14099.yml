    than Jesus and stronger powers than Peter, Paul, and the Apostles.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage reports this through Mead's summary of Irenaeus; the ascent
    taxonomy is approximate because the text speaks of degrees of illumination, not
    a literal ascent journey.
- id: motif:2
  label: Cycle of rebirth with karmic repayment
  taxonomy_refs:
  - death_rebirth
  basis: The soul is said to pass through every kind of existence and activity in
    rebirth and to pay karmic debt, possibly in one life.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The available taxonomy lacks a specific reincarnation or karma family;
    death_rebirth is a broad approximation.
