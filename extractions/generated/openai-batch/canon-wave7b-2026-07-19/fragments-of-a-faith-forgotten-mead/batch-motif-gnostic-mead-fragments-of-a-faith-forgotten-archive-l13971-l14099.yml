  quote: the prison is the body
  summary: The passage summarizes Mead's account of Carpocratian doctrines as reported
    and disputed through Irenaeus, including higher illumination, magical powers,
    moral non-essentialism, rebirth, karmic repayment, and an allegorical reading
    of adversary, judge, officer, and prison. It also discusses a Roman branch under
    Marcellina, possible Harpocratian/Egyptian connections, and Patristic legends
    about Epiphanes, including Clement's account of his posthumous worship.
  language: English
  quote_policy: quoted
