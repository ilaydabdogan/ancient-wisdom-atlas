canonical_text:
  quote: '"love is not love if there be nothing to be loved."'
  summary: 'The passage lists titles for Sophia or the Soul and explains her aspects
    as pure above, intermediary in the midst, and fallen into matter below. It then
    reports Hippolytus'' account of a Valentinian cosmogony: the Monad, called the
    Father, is the beginning and cause; there is debate over whether the Father is
    solitary or paired with the syzygy Silence; before creation the Father is alone,
    creative, and moved by love to emanate Mind-and-Truth, a dyad described as Lady,
    Beginning, and Mother of the aeons in the Pleroma.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Sophia is introduced through multiple titles, including Daughter of Light,
    Merciful Mother, Consort of the Masculine One, Holy Dove who has given birth to
    Twins, Ennoea, Ruler, and Lost or Wandering Sheep, Helena.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The titles are said to refer to Sophia or the Soul in cosmic or individual
    aspects: above in perfect purity, in the midst as intermediary, or below as fallen
    into matter.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hippolytus' account presents Valentinus, Heracleon, Ptolemaeus, and their
    school as disciples of Pythagoras and Plato who made arithmetical science fundamental
    to their doctrine.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The beginning of all things is described as the Monad, called the Father,
    ingenerable, imperishable, incomprehensible, creator, and cause of generated things.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some in the account say the Father is without femininity, without a syzygy,
    and solitary; others say the Father of all must have the syzygy Silence.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Mead comments that there were Fathers for every plane as monadic states, and
    Father-Mothers as dyadic states.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Gnostic manuscript described by Hippolytus says that at the beginning nothing
    created existed and the Father was alone, increate, without space or time, without
    counsel, and at rest in himself.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Father is described as creative and as all love; because love needs something
    loved, he chooses to create and produce what is most beautiful and perfect in
    himself.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Father emanates and generates Mind-and-Truth, a dyad called Lady, Beginning,
    and Mother of all the aeons in the Pleroma.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Mind-and-Truth is said to possess creative power like its parent and to imitate
    the Father by emanating further; the passage ends in a truncated phrase beginning
    “Word-and-”.
  category: sequence
  evidence_refs:
  - ev:10
