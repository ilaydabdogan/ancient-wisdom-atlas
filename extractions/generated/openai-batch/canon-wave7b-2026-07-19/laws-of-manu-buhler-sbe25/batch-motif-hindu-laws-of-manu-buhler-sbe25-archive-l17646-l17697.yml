  quote: ''
  summary: In an ascetic teaching, detachment from objects and opposites is said to
    bring eternal happiness and repose in Brahman. Meditation and knowledge concerning
    the Soul are presented as necessary for the full reward of rites, and the ascetic
    is instructed to recite Vedic texts concerning sacrifice, deities, and the Soul/Vedanta.
    Notes explain examples of the pairs of opposites and identify the textual classes
    mentioned.
