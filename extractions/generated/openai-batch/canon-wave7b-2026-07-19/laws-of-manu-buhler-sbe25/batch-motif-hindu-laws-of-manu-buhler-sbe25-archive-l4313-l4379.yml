canonical_text:
  quote: ''
  summary: The passage describes an entry into the body that gives rise to the name
    Purusha and makes the body perceptibly formed with sixteen constituent parts.
    It states that the great elements enter with karman or functions, that a first
    creator enters with the elements to perform austerities, and that creatures, Brahma,
    gods, sages, manes, humans, worlds, waters, directions, mountains, trees, spirits,
    animals, and snakes are created. It also mentions continuity or appointment of
    courses of action across creation and an editorial note about reused school-tradition
    wording.
  language: English
  quote_policy: summarized
