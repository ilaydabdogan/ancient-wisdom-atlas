  text: A judge is instructed to declare fraudulent mortgages, sales, gifts, acceptances,
    and other detected fraudulent transactions null and void.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a debtor is dead and the borrowed money was spent for the family, relatives
    must pay it from their own estate even if they have divided.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: A person wholly dependent may make a contract for the benefit of the family,
    and the master of the house is not to rescind it whether at home or abroad.
  category: action
  evidence_refs:
  - ev:4
- id: obs:4
  text: Items given by force, enjoyed by force, written by force, and other transactions
    done by force are declared void.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: Witnesses, a surety, and judges are listed as three who suffer for the sake
    of others.
