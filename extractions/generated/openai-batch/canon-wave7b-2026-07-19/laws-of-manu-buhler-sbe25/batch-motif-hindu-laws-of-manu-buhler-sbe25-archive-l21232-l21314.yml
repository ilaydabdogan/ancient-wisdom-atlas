canonical_text:
  quote: ''
  summary: 'A legal passage concerning civil and criminal procedure and debts: fraudulent
    transactions are voided by the judge; family-benefit debts remain payable by relatives;
    a dependent person''s family contract cannot be rescinded by the household master;
    coerced gifts, enjoyment, writings, and transactions are void; certain groups
    are said to suffer for others or enrich themselves through others; and a king
    is forbidden to take what ought not be taken.'
  language: English
  quote_policy: summarized
