canonical_text:
  quote: ''
  summary: Inheritance-law verses and translator notes regulate maintenance for excluded
    persons, offspring of certain disqualified persons, division of property acquired
    after the father’s death, equal division of labour-acquired property, and separate
    ownership of property acquired through learning, friendship, marriage, or a honey-mixture
    presentation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who knows the law is instructed to give food and raiment to the persons
    in question according to his ability; failure to give makes him an outcast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the eunuch and the rest somehow desire wives, the offspring of those among
    them who have children is said to be worthy of a share.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Property acquired by the eldest son through his own exertion after the father’s
    death is to be partly shared with younger brothers if they have made due progress
    in learning.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note to IX.204 states that the rule concerns a united family only.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: If all brothers are unlearned and acquire property by labour, the division
    of that property is to be equal because it is not property acquired by the father.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Property acquired by learning, a friend’s gift, a marriage present, and a
    present received with the honey-mixture are said to belong solely to the recipient.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:7
  text: The note to IX.206 lists examples of property acquired by learning, including
    teaching fees, gifts from pupils, sacrifice gratuities, legal or scholarly rewards,
    and rewards for reciting the Veda with unusual ability.
  category: object
  evidence_refs:
  - ev:8
