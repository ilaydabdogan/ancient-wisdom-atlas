  quote: ''
  summary: The passage gives rules for choosing recipients of sacrifices and funeral
    offerings, warns that improper ritual feeding leads to post-death punishment or
    loss of heavenly reward, privileges Vedic learning in determining honor, and uses
    images of blood, red-hot weapons, a blind cow, and barren soil to describe failed
    or improper offerings.
  language: English
  quote_policy: summarized
