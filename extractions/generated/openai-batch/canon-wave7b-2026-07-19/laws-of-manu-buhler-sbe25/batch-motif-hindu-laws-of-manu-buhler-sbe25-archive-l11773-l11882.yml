  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: For each mouthful an ignorant man swallows at a sacrifice to the gods or manes,
    the translation says the giver of the repast must swallow red-hot spikes, spears,
    and iron balls after death; the note records an alternate interpretation assigning
    the punishment to the eater.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Brahmanas are divided into those devoted to knowledge, austerities, austerities
    with Veda recitation, and sacred rites.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Oblations to the manes are to be presented to those devoted to knowledge,
    while offerings to the gods are assigned to all four named classes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A father and son are compared according to their knowledge of the Veda and
    Angas, and respect is said to be due to the Veda learned by the son.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A funeral sacrifice should not be used to entertain a personal friend; the
    host should feed a Brahmana regarded as neither foe nor friend.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Funeral sacrifices and offerings to the gods performed chiefly to gain friends
    are said to bring no post-death reward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
