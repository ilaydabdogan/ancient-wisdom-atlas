canonical_text:
  quote: ''
  summary: The passage gives rules for succession to a woman's property according
    to source of the property, type of marriage, presence or absence of issue, caste
    status among co-wives, restrictions on women's handling of common property, prohibition
    on heirs dividing ornaments worn during a husband's life, and exclusion of specified
    persons from inheritance shares.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman's property described as sixfold includes items given in token of love
    and items received from her brother, mother, or father.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman's enumerated property, a subsequent gift, and an affectionate gift
    from her husband are assigned to her offspring if she dies during her husband's
    lifetime.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a woman married by the Brahma, Daiva, Arsha, Gandharva, or Pragapatya rite
    dies without issue, her property is assigned to her husband alone.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: If property was given to a wife in an Asura or other blamed marriage and she
    dies without issue, the property is assigned to her mother and father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Property given by a father to a wife with co-wives of different castes is
    assigned to the daughter of the Brahmani wife or to that daughter's issue.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Women are instructed not to make a hoard from common family property or from
    their husbands' particular property without permission.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ornaments worn by women during their husbands' lifetime are not to be divided
    by the husband's heirs; those who divide them become outcasts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Eunuchs, outcasts, persons born blind or deaf, the insane, idiots, the dumb,
    and those deficient in an organ receive no inheritance share.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: The notes cite parallel or related rules from Vishnu, Yajnavalkya, Apastamba,
    Gautama, Vasishtha, and Baudhayana.
  category: other
  evidence_refs:
