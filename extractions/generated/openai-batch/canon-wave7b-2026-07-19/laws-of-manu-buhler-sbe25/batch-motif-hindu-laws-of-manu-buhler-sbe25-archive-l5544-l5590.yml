  quote: ''
  summary: The passage discusses evidence for dating the Manu-smriti. It cites a reference
    to Dronasi^ha, Maharaja of Valabhi, who is compared with Dharmaraja/Yudhishthira
    for observing laws taught by Manu and other sages. It then argues from textual
    references, including Manu 10.43-44 and comparisons with Aśoka's edicts, that
    groups such as Kambojas, Yavanas, Sakas, and Pahlavas were listed as Kshatriya-descended
    peoples degraded to Sudra status through neglect of Brahmanas.
  language: English
