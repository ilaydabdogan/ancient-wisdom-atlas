canonical_text:
  quote: ''
  summary: The passage prescribes that a virtuous king must not appropriate the property
    of a person guilty of mortal sin, but should dispose of such a fine through water,
    Varuna, or a learned Brahmana. It states Varuna's authority over punishment, links
    righteous royal conduct with prosperity and healthy births, distinguishes just
    from unjust punishment, and describes later royal duties of protection, fortification,
    removal of harmful persons, and heavenly reward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A virtuous king is told not to take for himself the property of a man guilty
    of mortal sin; if he takes it from greed, he is tainted by the offender's guilt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fine from such a case is to be thrown into water and offered to Varuna,
    or given to a learned and virtuous Brahmana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Varuna is called the lord of punishment and is said to hold the sceptre even
    over kings.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A Brahmana who has learnt the whole Veda is called the lord of the whole world.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: In the country where the king avoids taking the property of mortal sinners,
    people are born in due time and are long-lived.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: In that same country, the husbandmen's crops spring up as sown, children do
    not die, and no misshaped offspring is born.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The king is instructed to inflict terrifying corporal punishments on a base-born
    Sudra who intentionally gives pain to Brahmanas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A king who punishes an innocent person bears guilt comparable to freeing a
    guilty person, while just punishment brings merit.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: A king who duly fulfills his duties according to justice may seek to gain
    countries not yet gained and must protect them after gaining them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: After settling his country and building forts, the king is told to exert himself
    to remove men described as nocuous like thorns.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Kings who protect those living as Aryans and remove the thorns are said to
    reach heaven.
  category: sequence
  evidence_refs:
  - ev:4
