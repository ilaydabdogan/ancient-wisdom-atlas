canonical_text:
  quote: ''
  summary: The passage lists twelve bodily impurities, prescribes cleansing with earth
    and water in specified repetitions, differentiates purification requirements by
    life-stage and social category, and gives rules for water-sipping, cavity-sprinkling,
    mouth-wiping, monthly shaving, and food for Sudras.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Twelve substances are named as impurities of human bodies, including exudations,
    semen, blood, urine, faeces, mucus, ear-wax, phlegm, tears, eye rheum, and sweat.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who desires purity is instructed to clean the organ, anus, left hand,
    and both hands with earth in specified numbers of applications.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The prescribed purification is given as the householder standard, with doubled,
    trebled, and quadrupled requirements for students, hermits, and ascetics.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: After voiding urine or faeces, the person is to sip water and sprinkle the
    cavities; the same is required when about to recite the Veda and before taking
    food.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: For bodily purity, the person first sips water three times and wipes the mouth
    twice; a woman and a Sudra perform each act once.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Sudras who live according to the law are instructed to shave their heads monthly,
    use the same purification as Vaisyas, and eat fragments of an Aryan's meal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A note explains the cavities as those of the head, with some commentators
    also including the navel, heart, and crown of the head.
  category: other
  evidence_refs:
  - ev:4
