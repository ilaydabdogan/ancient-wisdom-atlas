  quote: ''
  summary: 'A fragmentary opening statement treats injury prescribed for certain occasions
    as non-injury because sacred law comes from the Veda. Verses 45-52 contrast harmful
    injury with non-injury: harming harmless beings for pleasure prevents happiness,
    while avoiding harm and wishing good to all brings bliss and attainment. The passage
    commands abstention from meat because meat requires injury to living beings, classifies
    all participants in slaughter and meat use as slayers, and condemns increasing
    one''s own flesh by the flesh of other beings.'
