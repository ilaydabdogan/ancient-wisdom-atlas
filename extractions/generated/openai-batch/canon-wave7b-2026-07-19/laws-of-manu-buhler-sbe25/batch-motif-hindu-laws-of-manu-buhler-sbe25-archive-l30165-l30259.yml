canonical_text:
  quote: ''
  summary: 'The passage lists penances for killing or injuring animals and plants,
    states that guilt from injuring created beings can be removed by such penances,
    and then gives expiations related to forbidden drink: re-initiation after unintentionally
    drinking Varuni and a five-day milk regimen after drinking water from a vessel
    used for Sura or other intoxicants. Notes cite parallel dharmashastra sources
    and discuss alternative interpretations of the Varuni/Sura rule.'
