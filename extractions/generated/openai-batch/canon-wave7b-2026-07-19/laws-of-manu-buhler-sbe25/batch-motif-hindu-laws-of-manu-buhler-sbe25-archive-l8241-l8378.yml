canonical_text:
  quote: ''
  summary: The passage defines sources and authority of sacred law, treats both revealed
    and traditional texts as normative, gives rules for conflicting sacred texts and
    Agnihotra timing, identifies ritual eligibility and sacraments, maps sacred regions
    from Brahmavarta to Aryavarta, and links local custom, dwelling, and sacrificial
    fitness to those regions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who obeys the law prescribed in revealed texts and sacred tradition
    gains fame in this world and unsurpassable bliss after death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Śruti is identified with the Veda, Smṛti with the Institutes of sacred law,
    and the passage says these two sources must not be questioned because sacred law
    shone forth from them.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A twice-born man who relies on dialectical institutes and treats the two sources
    of law with contempt is to be cast out by the virtuous as an atheist and scorner
    of the Veda.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Veda, sacred tradition, customs of virtuous men, and one's own pleasure
    are declared to be the fourfold means for defining sacred law.
  category: object
  evidence_refs:
  - ev:1
- id: obs:5
  text: For seekers of sacred-law knowledge, revelation is named as the supreme authority.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: When two sacred texts conflict, both are held to be law because the wise pronounce
    both to be valid law.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Agnihotra sacrifice may be performed after sunrise, before sunrise, or
    when neither sun nor stars are visible, according to Vedic texts.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: The person for whom ceremonies from the rite of impregnation through the funeral
    rite are prescribed with recited sacred formulas is entitled to study these Institutes,
    and no other person is so entitled.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Brahmavarta is described as a land created by the gods between the divine
    rivers Sarasvati and Drishadvati.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: Custom handed down among castes and mixed races of Brahmavarta is called the
    conduct of virtuous men.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The plain of the Kurus and the countries of the Matsyas, Pañcālas, and Śūrasenakas
    are identified as the country of the Brahmarshis, ranking immediately after Brahmavarta.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:12
  text: All men on earth are instructed to learn their several usages from a Brahmana
    born in that country.
  category: action
  evidence_refs:
  - ev:4
- id: obs:13
  text: Madhyadesa and Aryavarta are delimited by mountains, Prayaga, Vinasana, and
    the eastern and western oceans.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:14
  text: The land where the black antelope naturally roams is to be known as fit for
    the performance of sacrifices; land different from that is called the country
    of the mlecchas.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Twice-born men are told to seek residence in the named regions, while a Śudra
    distressed for subsistence may reside anywhere.
  category: action
  evidence_refs:
  - ev:5
- id: obs:16
  text: Holy rites prescribed by the Veda are to be performed for twice-born men from
    conception and other sacraments; these rites sanctify the body and purify from
    sin in this life and after death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:17
  text: The passage says it has succinctly described the origin of sacred law and
    the origin of the universe before turning to duties of the castes.
  category: speech
  evidence_refs:
  - ev:6
