  quote: ''
  summary: A scholarly introduction discusses Govindaraja, son of Bhatta Madhava,
    his uncertain date, evidence for dating him after Bhoja of Dhara and before later
    citations, proposed but rejected royal identifications, and an assessment of the
    Manutika as concise but not obscure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Govindaraja is described as the son of Bhatta Madhava, with an exact date
    that is not ascertainable.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says Govindaraja was reticent about himself and predecessors and,
    apart from Smritis, did not quote a law work except his own Smriti-manjari or
    Smriti-manjaripanjika, described as a compilation of rules on penances.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage places Govindaraja later than Bhoja of Dhara on the basis of Kulluka's
    remarks on Manu VIII, 184.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the lower chronological limit is fixed by mentions of Govindaraja
    in Jimutavahana's Dayabhaga and in Sulapani's work on penances.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author agrees with Professor Jolly that Govindaraja lived in the twelfth
    or thirteenth century.
  category: other
  evidence_refs:
  - ev:2
- id: obs:6
  text: Several scholars are said to have inferred from the ending of Govindaraja's
    name that he was a prince and proposed identifying him with a Govindachandra of
    Benares or with a king of Kanoj.
  category: other
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage rejects the royal identification by saying the son of a Bhatta
    can only be a Brahmana and that Govindaraja is equivalent to Govindrao, a name
    common among Brahmanas.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Manutika is characterized as very concise but not obscure.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: A footnote says Sir W. Jones applied the epithet 'obscure' to the Manutika
