canonical_text:
  quote: "“so long the manes partake (of it).”"
  summary: 'The passage gives ritual rules and consequences for a householder’s Sraddha
    and related funeral offerings: conditions under which ancestors partake, restrictions
    on guests and onlookers, post-meal distribution of remnants, rules before and
    after Sapindikarana, and punishments for specific violations. The surrounding
    notes discuss Vedic riddles and cited parallel authorities.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The commentary explains Brahmodya as Vedic riddles, Vedic stories, or conversations
    regarding Brahman, and notes that priests used Brahmodya-riddles during sacrifices.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a Sraddha, the listed means of sanctification are a daughter’s son, a Nepal
    blanket, and sesamum grains; additional recommended qualities are cleanliness,
    suppression of anger, and absence of haste.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The food is to be very hot; guests are to eat in silence; Brahmanas are not
    to proclaim the qualities of the sacrificial food; the manes partake while these
    conditions hold.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Food eaten with covered head, with face turned south, or with sandals on is
    said to be consumed by Rakshasas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Specified persons and animals must not look at Brahmanas while they eat, and
    their seeing rites for gods or manes is said to prevent the intended result.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A boar, cock, dog, and low-caste man are each described as making the rite
    useless by smell, wing-air, gaze, or touch respectively.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Certain disabled or malformed persons, even if servants of the performer,
    are to be removed from the place of the Sraddha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Brahmana householder or an ascetic who comes for food may be honored with
    the permission of the Brahmana guests.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the guests finish eating, mixed food is sprinkled with water and scattered
    on Kusa grass on the ground in front of them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Remnants and portions scattered on Kusa grass or fallen on the ground are
    assigned as shares for named classes of deceased children, persons who forsook
    noble wives, and honest dutiful servants.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Before Sapindikarana, the funeral sacrifice for a recently deceased Aryan
    involves feeding one Brahmana without an offering to the gods and giving one cake
    only; after Sapindikarana, sons offer the cakes according to the described rites.
  category: sequence
  evidence_refs:
  - ev:6
