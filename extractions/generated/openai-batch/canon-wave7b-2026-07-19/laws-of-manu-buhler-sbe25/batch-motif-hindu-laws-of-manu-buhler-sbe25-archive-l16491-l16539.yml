canonical_text:
  quote: ''
  summary: Rules on purification state that certain defiled objects become pure through
    earth, that inanimate things are cleansed with earth and water until smell and
    stain disappear, that the gods declared three criteria of purity for Brahmanas,
    that water is pure under specified sensory and contextual conditions, and that
    an artisan's hand and goods for sale are pure.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An object smelt at by cows, touched with the foot, sneezed on, or covered
    by hair or insects is said to become pure by scattering earth over it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For inanimate things defiled by impure substances, earth and water must be
    applied until foul smell and stain are gone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The gods are said to have declared three things pure for Brahmanas: what
    has no visible taint, what has been washed with water, and what has been commended
    as pure by a Brahmana''s word.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Water is described as pure if it is enough to slake a cow's thirst, has proper
    smell, colour, and taste, is unmixed with impure substances, and is collected
    on pure ground.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hand of an artisan is described as always pure, as is a vendible commodity
    exposed for sale.
  category: attribute
  evidence_refs:
  - ev:5
