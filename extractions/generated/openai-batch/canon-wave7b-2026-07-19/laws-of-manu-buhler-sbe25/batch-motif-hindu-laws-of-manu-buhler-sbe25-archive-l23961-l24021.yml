canonical_text:
  quote: ''
  summary: Verses IX.48-53 use analogies from animal breeding and sowing seed in another
    person's field to state rules about offspring, crops, women, marital property,
    and ownership. The benefit normally belongs to the owner of the cow, woman, field,
    or soil rather than to the begetter or seed-giver, unless a special contract makes
    seed owner and soil owner sharers. Verse IX.54 begins a fragment about seed carried
    by water or wind.
  language: English
  quote_policy: summarized
