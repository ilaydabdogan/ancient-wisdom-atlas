canonical_text:
  quote: ''
  summary: Manu XII.89-94 distinguishes desire-motivated acts that continue mundane
    existence from desireless, knowledge-based acts that bring cessation. It states
    that the liberation-oriented actor passes beyond the five elements, describes
    sacrifice to the Self with recognition of the Self in all beings and beings in
    the Self, urges a Brahmana to pursue knowledge of the Soul, passion-extinction,
    and Veda study, and calls the Veda the eternal eye of manes, gods, and men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Acts done to fulfill wishes in this world or the next are called pravritta,
    while acts done without desire for reward and preceded by true knowledge are called
    nivritta.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The one who performs pravritta acts is said to become equal to the gods, while
    the one intent on nivritta acts passes beyond the reach of the five elements.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person who sacrifices to the Self alone and recognizes the Self in all created
    beings and all created beings in the Self becomes autocratic and self-luminous.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The notes explain sacrifice to the Self through interpretations involving
    identification with deity, Brahman, the Supreme Soul, and all created beings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Brahmana is instructed to give up the sacrificial rites mentioned above
    and exert himself in knowledge of the Soul, extinguishing passions, and studying
    the Veda.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Veda is described as the eternal eye of the manes, gods, and men, and
    the Veda-ordinance is said to be beyond human power and comprehension.
  category: attribute
  evidence_refs:
  - ev:6
