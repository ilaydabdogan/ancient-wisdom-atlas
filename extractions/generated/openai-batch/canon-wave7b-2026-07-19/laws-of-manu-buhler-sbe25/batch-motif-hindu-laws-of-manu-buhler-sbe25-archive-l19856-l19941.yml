canonical_text:
  quote: ''
  summary: The passage gives legal instructions for discerning inner disposition from
    bodily signs, protecting the property of minors and certain vulnerable women,
    punishing relatives who seize such women’s property, and regulating custody, identification,
    fines, and royal shares for lost or unclaimed property.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A legal authority is instructed to discover men’s internal disposition by
    external signs including voice, colour, motions, aspect, eyes, and gestures.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The internal working of the mind is said to be perceived through aspect, motions,
    gait, gestures, speech, and changes in the eyes and face.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king is instructed to protect inherited and other property of a minor
    until the minor returns from the teacher’s house or passes minority.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Care is prescribed for barren women, women without sons, women whose family
    is extinct, wives and widows faithful to their lords, and women afflicted with
    diseases.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A righteous king must punish relatives like thieves if they appropriate the
    property of such females during their lifetime.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Property whose owner has disappeared is to be kept by the king as a deposit
    for three years; within that period the owner may claim it, and after that the
    king may take it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A person claiming property must be examined, and if he accurately describes
    its shape, number, and related details, he is treated as the owner and should
    receive it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A claimant who does not know the time and place of loss, or the colour, shape,
    and size of the object, is liable to a fine equal to the object’s value.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The king may take one-sixth, one-tenth, or at least one-twelfth of lost property
    that has been found, remembering the duty of good men.
  category: action
  evidence_refs:
  - ev:9
