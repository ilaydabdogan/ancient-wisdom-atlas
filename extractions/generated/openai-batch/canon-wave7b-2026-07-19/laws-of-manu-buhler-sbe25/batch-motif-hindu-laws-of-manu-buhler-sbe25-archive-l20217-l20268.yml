canonical_text:
  quote: ''
  summary: 'The passage gives procedural rules for civil and debt litigation: non-production
    after an order may lead to non-suit; silence or failure to plead is punishable
    or causes loss of the case; false denial or false declaration is fined at double
    the amount; debt denial is to be proven by at least three witnesses before a Brahmana
    appointed by the king; and eligible witnesses are defined by household, lineage,
    residence, varna, summons, and urgency conditions.'
  language: English
  quote_policy: summarized
