canonical_text:
  quote: ''
  summary: The passage summarizes traditions about Manu as father of humankind. It
    reports a Satapatha-Brahmana flood legend in which a fish's advice saves Manu
    alone from a great flood; after worship, austerities, and sacrifice, Manu's oblations
    produce Ida/Ila, through whom he generates the race of Manu. It also describes
    Manu as founder of social and moral order, king and ancestor of kings, Rishi,
    inventor of sacrificial rites, kindler of sacred fire, and revealer of funeral
    sacrifice.
  language: English
