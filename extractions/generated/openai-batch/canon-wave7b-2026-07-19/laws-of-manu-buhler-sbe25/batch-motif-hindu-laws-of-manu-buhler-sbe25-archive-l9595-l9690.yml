canonical_text:
  quote: ''
  summary: The passage, within rules on studentship, ranks parents and teachers, contrasts
    natural birth with a Veda-birth procured by a teacher through the Savitri, defines
    the Veda instructor as Guru and father, narrates young Kavi teaching older relatives
    and being vindicated by the gods, and states that greatness and seniority depend
    on sacred knowledge or social category rather than age alone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment states that the father is a hundred times more venerable
    than the teacher, and the mother a thousand times more than the father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes the giver of natural birth from the giver of Vedic
    knowledge and calls the giver of the Veda the more venerable father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Natural parentage is described as parents begetting a child through mutual
    affection and the child being born from the mother's womb; this is characterized
    as a mere animal existence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A teacher acquainted with the whole Veda is said to procure a birth through
    the Savitri, and that birth is described as real and exempt from age and death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Any person who benefits another by instruction in the Veda, whether little
    or much, is called Guru because of that benefit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Brahmana who gives birth for the sake of the Veda and teaches prescribed
    duties becomes, by law, the father of an aged man, even if the Brahmana himself
    is a child.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Young Kavi, son of Angiras, taught older father-like relatives and called
    them 'Little sons.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The older relatives, angered by Kavi's address, asked the gods about it, and
    the assembled gods answered that the child had addressed them properly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that a man lacking sacred knowledge is a child and that
    one who teaches the Veda is his father.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Greatness is said not to come through years, white hair, wealth, or powerful
    kinsmen; one who has learned the Veda with the Angas is considered great.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Seniority is assigned to Brahmanas by sacred knowledge, to Kshatriyas by valour,
    to Vaisyas by wealth in grain and other goods, and to Sudras by age.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The notes cite related passages from other legal or dharma texts for verses
