  summary: The passage states rules for defamation and assault, especially punishments
    for lower-status offenders injuring or insulting higher-status persons, fines
    for injuries among equals, fines for damage to trees, and compensation or fines
    for injuries to people and animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage closes rules on defamation and announces a transition to decisions
    concerning assault.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man of low caste hurts a man of the three highest castes with a particular
    limb, that limb is to be cut off.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person who raises a hand or stick is to have the hand cut off; a person
    who angrily kicks with a foot is to have the foot cut off.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A low-caste man who tries to sit on the same seat as a high-caste man is to
    be branded on the hip and banished, or have the buttock gashed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the offender spits, urinates, or breaks wind against a superior, the king
    is to order cutting of the corresponding body part named in the passage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the offender seizes the hair, feet, beard, neck, or scrotum of a superior,
    the king is to cut off his hands.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: For injuries to an equal, breaking the skin or causing blood incurs a fine
    of one hundred panas, cutting a muscle six nishkas, and breaking a bone banishment.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Injuring trees is punished by a fine set according to the usefulness of the
    trees; the note says the expression includes all plants and discusses shade, flowers,
    fruit, and location.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: A blow struck against men or animals in order to cause pain is punished by
    a fine proportionate to the amount of pain caused.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: If a limb is injured, a wound caused, or blood flows, the assailant must pay
    the sufferer's cure expenses or the whole fine to the king.
  category: action
  evidence_refs:
  - ev:10
