  summary: The passage presents a scholarly argument that discoveries in Vedic and
    Sutra literature support Max Müller's view that the systematic cultivation of
    Indian śāstras began in Vedic schools. It describes recovered Dharma-sutra materials,
    links among Sutra collections, and an alternative to the tradition that certain
    Dharmaśāstras were composed by ancient ṛṣis for the welfare of mankind.
