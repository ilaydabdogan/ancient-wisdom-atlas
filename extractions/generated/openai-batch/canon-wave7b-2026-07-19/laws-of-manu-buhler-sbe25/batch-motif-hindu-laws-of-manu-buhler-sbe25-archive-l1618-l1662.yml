  quote: ''
  summary: A scholarly introduction argues from citations and comparisons that a former
    Manava Dharma-sutra existed, that Kamandaki's Manu belonged to a particular school
    and resembled the Manu-smrzti, that possible Mahabharata allusions are doubtful,
    and that investigations into a direct connection between the Manu-smrzti and Manava
    school writings have produced a negative result. A footnote discusses a claimed
    authorship tradition for the Nitisara and its citation by Medhatithi.
