  quote: ''
  summary: The passage prescribes consequences for a wife’s chastity or violation
    of marital duty after her husband’s death. A chaste wife is said to reach heaven
    and reside with or near her husband, while a wife who violates her duty is disgraced,
    loses her heavenly place with him, and may be reborn in a jackal’s womb and afflicted
    by disease.
