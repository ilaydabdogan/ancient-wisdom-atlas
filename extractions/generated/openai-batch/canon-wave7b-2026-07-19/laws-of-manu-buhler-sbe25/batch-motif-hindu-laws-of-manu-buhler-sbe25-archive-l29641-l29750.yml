canonical_text:
  quote: Sura, indeed, is the dirty refuse (mala) of grain
  summary: The passage prescribes penances for a twice-born man who drinks Sura, including
    drinking boiling-hot liquor or other boiling substances, death-ending alternatives,
    or a year-long marked regimen. It classifies Sura as impure refuse, names three
    kinds of Sura, forbids it to twice-born classes, associates intoxicants and flesh
    with Yakshas, Rakshasas, and Pisacas, and states that drunkenness can cause impurity,
    misuse of Vedic speech, loss of Brahmanhood, and becoming a Sudra.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A twice-born man who has intentionally drunk Sura through mental delusion
    is instructed to drink that liquor boiling-hot; when his body is completely scalded,
    he is freed from guilt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An alternative penance is to drink boiling-hot cow's urine, water, milk, clarified
    butter, or liquid cowdung until death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another penance is to eat once daily at night for a year, consuming grains
    or oilcake, wearing cowhair clothes, keeping the hair in braids, and carrying
    a wine cup as a flag.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sura is described as the dirty refuse of grain; sin is also called dirt, and
    Brahmanas, Kshatriyas, and Vaisyas are told not to drink Sura.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: 'Three kinds of Sura are named: liquor distilled from molasses, from ground
    rice, and from Madhuka flowers; all are forbidden to the chief of the twice-born.'
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sura, other intoxicating drinks, decoctions, and flesh are described as food
    of the Yakshas, Rakshasas, and Pisacas; a Brahmana who eats remnants of offerings
    consecrated to the gods must not partake of such substances.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Brahmana stupefied by drunkenness may fall on something impure, pronounce
    Vedic texts improperly, or commit another act that ought not to be committed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the Brahman, glossed as the Veda, dwelling in a Brahmana's body is deluged
    even once with spirituous liquor, his Brahmanhood forsakes him and he becomes
    a Sudra.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: An editorial note cross-references Manu XI.91-98 with passages in Apastamba,
    Gautama, Vasistha, Baudhayana, Vishnu, and Yajnavalkya.
  category: other
  evidence_refs:
  - ev:6
