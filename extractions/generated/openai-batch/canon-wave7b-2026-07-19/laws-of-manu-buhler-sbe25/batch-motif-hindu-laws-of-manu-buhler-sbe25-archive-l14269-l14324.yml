canonical_text:
  quote: ''
  summary: The passage prescribes occasions and conditions when Veda-study or recitation
    must be omitted. It lists ritual times, physical locations, social conflicts,
    bodily states, the presence of a guest without permission, violent wind, bleeding,
    wounds, the hearing of Saman melodies, and completion of a Veda or Aranyaka. It
    also classifies the Rig-veda, Yajur-veda, and Sama-veda as sacred respectively
    to gods, men, and manes, explaining that the sound of the Sama-veda is treated
    as impure for purposes of study suspension.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Veda-study is prescribed to be omitted for three days at the Upakarman and
    Vedotsarga, and for a day and a night on the Ashtakas and the last nights of the
    seasons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Veda recitation is prohibited while on horseback, on a tree, on an elephant,
    in a boat or ship, on a donkey, on a camel, standing on barren ground, or riding
    in a carriage.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Veda recitation is prohibited during verbal altercation, mutual assault, in
    a camp, during battle, just after eating, during indigestion, after vomiting,
    or with sour eructations.
  category: action
  evidence_refs:
  - ev:3
  - ev:8
- id: obs:4
  text: Veda recitation is prohibited without permission from a guest staying in the
    practitioner’s house, while wind blows vehemently, while blood flows from his
    body, or when he is wounded by a weapon.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage forbids reciting the Rig-veda or Yajur-veda while Saman melodies
    are heard, and prescribes stopping all Veda-study for a day and a night after
    finishing a Veda or reciting an Aranyaka.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Rig-veda is declared sacred to the gods, the Yajur-veda to men, and the
