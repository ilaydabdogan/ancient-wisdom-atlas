canonical_text:
  quote: "“With the sacred fire, kindled at the wedding, a householder shall perform
    according to the law the domestic ceremonies and the five (great) sacrifices...”"
  summary: 'The passage gives household and lineage rules: mutual pleasure between
    husband and wife is said to sustain happiness, the wife''s beauty is linked to
    attraction, children, and household brightness, families decline through improper
    marriages and ritual neglect, and Vedic knowledge gives status. It then describes
    the householder''s wedding-kindled sacred fire, five household implements that
    cause inadvertent harm, and the daily five great sacrifices prescribed for expiation,
    with part of verse 70 listing sacrifices to Brahman, the manes, and the gods.'
  language: English
  quote_policy: quoted
