canonical_text:
  quote: ''
  summary: 'The passage gives rules for a snataka/Brahmana: false religious vows and
    student impersonation bring guilt and post-mortem or rebirth consequences; bathing
    and use of property can transfer guilt; proper waters for bathing are named; primary
    duties are prioritized over secondary ones; food and sacrificial offerings from
    improper persons or contaminated by contact are to be avoided.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person may perform penance under a false pretence, hiding sin under the
    pretext of a vow and deceiving women and Sudras.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Such Brahmanas are reprehended after death and in this life by those who expound
    the Veda, and a vow performed under false pretence goes to the Rakshasas.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person who is not a student but gains livelihood by wearing a student's
    dress takes on the guilt of all students and is born again in an animal womb.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Bathing in a tank belonging to another man taints the bather with a portion
    of the guilt of the maker of the tank.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Unauthorized use of another person's carriage, bed, seat, well, garden, or
    house causes the user to take one fourth of the owner's guilt.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The prescribed bathing places are rivers, ponds dug by the gods, lakes, water-holes,
    or springs.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: A wise man is instructed to discharge the paramount duties called yama constantly,
    while the minor duties called niyama are not required in the same way; observing
    only the latter while neglecting the former makes one an outcast.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Brahmana must not eat a dinner at a sacrifice offered by a non-Srotriya,
    by one sacrificing for a multitude, by a woman, or by a eunuch.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: When those persons offer sacrificial viands in the fire, the act is unlucky
    for holy men and displeases the gods.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Food is prohibited when associated with intoxicated, angry, or sick persons;
    hair, insects, intentional foot contact, the gaze of a Brahmana-slayer, a menstruating
    woman's touch, birds, a dog, a cow's smelling, public invitation, a multitude,
    harlots, learned condemnation, or specified donors such as a thief, musician,
    carpenter, usurer, initiated sacrificer, miser, or fettered person.
  category: object
  evidence_refs:
  - ev:7
