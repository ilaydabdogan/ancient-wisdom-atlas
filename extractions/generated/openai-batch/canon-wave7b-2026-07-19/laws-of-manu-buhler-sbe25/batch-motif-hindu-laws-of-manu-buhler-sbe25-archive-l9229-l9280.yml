canonical_text:
  quote: ''
  summary: 'Manu II.108-111 gives rules for an initiated Aryan student: daily fuel
    offerings in the sacred fire, begging food, sleeping on the ground, and serving
    the teacher until Samavartana. It lists ten categories of persons eligible for
    Veda instruction, restricts unsolicited or improper explanation, and warns that
    illegal explaining or questioning leads to death or enmity. The line range also
    includes a fragmentary footnote about honey symbolizing the four objects of human
    existence.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An initiated Aryan is instructed to offer fuel daily in the sacred fire, beg
    food, sleep on the ground, and do what benefits his teacher until Samavartana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ten types of persons are named as eligible to be instructed in the Veda, including
    the teacher's son, one desiring service, one who imparts knowledge, one intent
    on the law, a pure person, a person connected by marriage or friendship, one with
    mental ability, one who gives money, an honest person, and a relative.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person should not explain unless asked and should not answer one who asks
    improperly.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A wise man who knows an answer is told to behave among men as if he were an
    idiot; the note glosses this as dumb according to some commentators.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:5
  text: The illegal explainer and the illegal questioner are said to risk death or
    enmity; the note says the offender dies if only one offends and both die if both
    offend.
  category: sequence
  evidence_refs:
