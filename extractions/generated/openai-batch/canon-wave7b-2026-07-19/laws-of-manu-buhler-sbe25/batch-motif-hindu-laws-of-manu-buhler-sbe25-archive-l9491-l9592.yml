canonical_text:
  quote: ''
  summary: The passage sets out rules of respect and precedence by caste, age, wealth,
    kinship, ritual performance, and sacred learning; gives precedence to the Snataka
    and king; defines teacher, sub-teacher, Guru, and officiating priest; and states
    that the pupil should regard the Veda-teacher as father and mother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A ten-year-old Brahmana and a hundred-year-old Kshatriya are described as
    standing in a father-son relation, with the Brahmana as father.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wealth, kindred, age, due performance of rites, and sacred learning are listed
    as titles to respect, with each later-listed title said to be weightier than the
    preceding ones.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man of the three highest castes who possesses the five listed titles most
    fully is worthy of honour; a Sudra in the tenth decade of life is also worthy
    of honour.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Way is to be made for a man in a carriage, a person above ninety, a diseased
    person, a burden-carrier, a woman, a Snataka, the king, and a bridegroom.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the listed persons meet at one time, a Snataka and the king are to be most
    honoured; if a king and a Snataka meet, the Snataka receives respect from the
    king.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Brahmana who initiates a pupil and teaches him the Veda together with the
    Kalpa and Rahasyas is called the teacher or acarya.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: One who teaches only a portion of the Veda or the Angas of the Veda for livelihood
    is called the sub-teacher or upadhyaya.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Brahmana who performs rites such as Garbhadhana according to Vedic rules
    and gives food to the child is called the Guru, the venerable one.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A duly chosen man who performs Agnyadheya, Pakayagnas, and Srauta sacrifices
    such as Agnishtoma for another man is called his officiating priest.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The pupil is instructed to consider the one who fills both his ears with the
    Veda as his father and mother and never offend him.
  category: relationship
  evidence_refs:
  - ev:10
