canonical_text:
  quote: ''
  summary: The passage enumerates caste and mixed-caste descent categories. It assigns
    named offspring groups to unions involving Brahmana, Sudra, Vaisya, Kshatriya,
    Nishada, Kshattri, Vaidehaka, Ugra, Ambashtha, Ayogava, and related categories.
    It then states that sons of twice-born men by equal-caste wives who fail sacred
    duties are excluded from the Savitri and are called Vratyas, and it lists groups
    said to spring from Vratya Brahmana and Vratya Kshatriya categories. Translator
    notes discuss variant readings and cross-references in other legal or scholarly
    traditions.
  language: English
  quote_policy: summarized
