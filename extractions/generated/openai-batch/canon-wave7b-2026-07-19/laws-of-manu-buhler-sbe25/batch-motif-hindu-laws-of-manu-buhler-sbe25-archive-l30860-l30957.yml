canonical_text:
  quote: ''
  summary: The passage prescribes hell-punishments and penances for threatening, striking,
    or shedding the blood of a Brahmana, then describes several named penances involving
    regulated eating, cow-derived substances, hot liquids, bathing, and fasting as
    means for removing sin or guilt.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person intending to hurt a Brahmana and threatening him is said to remain
    in hell for one hundred years; one who strikes him is said to remain there for
    one thousand years.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For blood shed from a Brahmana, the duration in hell is related to the number
    of dust particles coagulated by the blood, counted in thousands of years.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage assigns a Krikkhra penance for threatening a Brahmana, an Atikrikkhra
    for striking him, and both a Krikkhra and an Atikrikkhra for shedding his blood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: For offences without a prescribed atonement, the penance is to be fixed after
    considering the offender's strength and the nature of the offence.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker introduces means adopted by gods, sages, and manes through which
    a man may remove his sins.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A twice-born man performing a penance revealed by Prajapati eats only in the
    morning for three days, only in the evening for three days, eats unasked food
    for three days, and fasts for three days.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Santapana Krikkhra is described as subsisting on cow urine, cowdung, milk,
    sour milk, clarified butter, and a decoction of Kusa-grass, together with fasting
    for one day and night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Atikrikkhra requires food during three three-day periods in the previously
    described manner, but only one mouthful at each meal, followed by three days of
    fasting.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Taptakrikkhra requires hot water, hot milk, hot clarified butter, and
    hot air, each for three days, and one bath with concentrated mind.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A twelve-day fast by a self-controlled man who commits no mistakes is called
    a Paraka Krikkhra and is said to remove all guilt.
  category: relationship
  evidence_refs:
  - ev:8
