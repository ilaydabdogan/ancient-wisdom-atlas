canonical_text:
  quote: ''
  summary: Verses X.36-44 enumerate mixed caste groups by parental combinations, occupations,
    dwelling places, duties, possible changes of rank in successive births, and the
    status decline of certain Kshatriya tribes through omitted rites and failure to
    consult Brahmanas. The accompanying notes report variant readings and commentator
    interpretations for some names and occupations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Karavara is said to spring from a Nishada and a woman of the Vaideha caste
    and to work in leather; Andhra and Meda are said to come from a Vaidehaka by women
    of the Karavara and Nishada castes and to dwell outside the village.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Pa^usopaka is said to be born from an Afa/zdala by a Vaideha woman and to
    deal in cane; an Ahi^ika is said to be born from a Nishada by the same kind of
    woman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Sopaka is said to be born from an ATa^ala by a Pukkasa woman, to live by
    the occupations of his sire, and to be despised by good men.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: An Antyavasayin is said to be born from a Nishada woman and an Aa^ala, to
    be employed in burial-grounds, and to be despised even by those excluded from
    the Aryan community.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states that these races originate in a confusion of castes, are
    described according to fathers and mothers, and may be known by occupations whether
    hidden or openly shown.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Six sons begotten by Aryans on women of equal and next lower castes are assigned
    the duties of twice-born men, while those born through violation of the law are
    said to be equal to Sudras in duties.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says that, through the power of austerities and of seed, these
    races obtain higher or lower rank among humans in successive births.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Certain Kshatriya tribes are said to have gradually sunk in this world to
    the condition of Sudras because of omission of sacred rites and not consulting
    Brahmanas.
  category: sequence
  evidence_refs:
  - ev:8
