canonical_text:
  quote: ''
  summary: The passage declares testimony invalid when given from motives such as
    covetousness, fear, friendship, lust, wrath, ignorance, or childishness. It lists
    graded fines for perjury according to motive, says the wise prescribed these fines
    to prevent failure of justice and restrain injustice, directs a just king to fine
    and banish lower-caste false witnesses while banishing a Brahmana, and begins
    a statement that Manu, son of the Self-existent, named ten places connected with
    punishment.
  language: English
  quote_policy: summarized
