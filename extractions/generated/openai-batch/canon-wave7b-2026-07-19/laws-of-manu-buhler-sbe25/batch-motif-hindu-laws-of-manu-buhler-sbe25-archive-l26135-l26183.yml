canonical_text:
  quote: A dress, a vehicle, ornaments, cooked food, water, and female (slaves) ...
    they declare to be indivisible.
  summary: Manu IX.218 states that property discovered after debts and assets have
    been distributed is to be divided equally. Manu IX.219 declares certain items
    and categories of property indivisible, including clothing, a vehicle, ornaments,
    cooked food, water, female slaves, property destined for pious uses or sacrifices,
    and a pasture-ground. The notes cite parallels and explain variant interpretations.
  language: English
  quote_policy: quoted
