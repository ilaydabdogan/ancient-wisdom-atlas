canonical_text:
  quote: ''
  summary: An index section lists entries from paternal relatives through royal policy.
    Most of the supplied range catalogs penances for many offenses, including sexual
    offenses, association with outcasts, killing or injuring beings, ritual neglect,
    false evidence, theft, improper teaching or sacrificing, and secret sins. It also
    mentions purification, sacred fire, Pathin hell, Piśācas, physicians, pledges,
    police, and royal policy.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The index lists paternal relatives: a paternal aunt and paternal uncle in
    connection with saluting, and a paternal grandmother in connection with inheritance.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The index names Pathin hell, Pavamani texts, and Pavitra as a means of purification.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The penance entries include adultery with a Guru's wife, other carnal offences,
    Apatrikarana sins, and associating with outcasts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The penance entries include bites of impure animals and men, cutting or destroying
    plants, destroying the embryo of a Brahmana, drinking spirituous liquor, eating
    forbidden food, and injuring living beings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The penance entries list killing a Brahmana, a menstruating Brahmani, a friend,
    a Kshatriya or Vaisya engaged in sacrifice, a wife, a cow, members of several
    social classes, various animals, a eunuch, and adulterous women.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The index lists penances for breach of student's vows, neglecting duties of
    a Snataka, neglecting initiation, neglecting sacred fire, neglecting twilight
    devotions, offences against a teacher, performing forbidden sacrifices, and performing
    obsequies for a stranger.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The penance entries include false evidence, teaching and sacrificing for wicked
    men, theft of a deposit, theft of gold, theft of other property, threatening or
    harming a Brahmana, unlawfully accepting gifts, and Upapataka sins.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The index includes entries on descriptions of various penances, how penances
    are imposed, reasons for performing them, restrictions against performing them
    under pretence of vows, and penances as vicarious for punishments.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The later entries mention physicians as impure or unskilful, Piśācas and their
    origin, Pitrmedha, pledges, punishment for destroying a pole, police patrols and
    stations, and four expedients of royal policy.
  category: other
  evidence_refs:
  - ev:9
