canonical_text:
  quote: ''
  summary: The passage gives rules for a householder's monthly new-moon funeral rite
    to the manes, including the Pindanvaharyaka/Sraddha after the Pitriyajna, approved
    ritual food, the number and qualifications of Brahmana guests, avoidance of large
    companies, and the reward or spiritual merit attached to feeding learned Veda-knowing
    recipients.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Brahmana who keeps a sacred fire is instructed to offer the Pindanvaharyaka
    funeral sacrifice every month on the new-moon day after performing the Pitriyajna.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An editor note explains the Pitriyajna as a sacrifice offered to the fathers
    and identifies Pindanvaharyaka as another name for the monthly Sraddha.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The monthly funeral offering to the manes is called Anvaharya and is to be
    carefully performed with approved sorts of flesh.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage introduces instructions concerning which Brahmanas are to be fed,
    who is to be avoided, and the foods to be used.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the offering to the gods, two Brahmanas are to be fed; at the offering
    to the manes, three are to be fed, or one may be fed on either occasion.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A large company is discouraged because it is said to destroy respectful treatment,
    proper place and time, purity, and the selection of virtuous Brahmana guests.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The rite for the dead on the new-moon day is said to bring its reward constantly
    to one who performs it diligently according to Smarta rules.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Oblations to gods and manes are to be presented to a Srotriya alone, and gifts
    to such a worthy Brahmana are said to yield great reward.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Feeding one learned man at the sacrifice to the gods and one at the sacrifice
    to the manes is presented as more rewarding than feeding many who are unacquainted
    with the Veda.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The ritual performer is told to inquire into the remote ancestors of a Brahmana
    who has studied an entire recension of the Veda; descent from a virtuous race
    makes him a worthy recipient.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A single man learned in the Veda is said to be worth a million men unacquainted
    with the Ricas for the production of spiritual merit.
  category: relationship
  evidence_refs:
  - ev:8
