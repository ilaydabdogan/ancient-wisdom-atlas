literal_observations:
- id: obs:1
  text: Men who delight in hurting others, eat forbidden food, steal, or have intercourse
    with women of the lowest castes are said to become carnivorous animals, worms,
    creatures that consume their own kind, or Pretas.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Association with outcasts, approaching other men's wives, and stealing a Brahmana's
    property are said to result in becoming Brahmarakshasas.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who greedily steals gems, pearls, coral, or other precious things is
    said to be born among goldsmiths; the note records an alternate explanation that
    the term may name a bird.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage gives itemized consequences for stealing grain, yellow metal,
    water, honey, milk, condiments, clarified butter, meat, fat, oil, salt, and sour
    milk, each paired with a specific animal, bird, or insect form.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Further listed thefts include silk, linen, cotton-cloth, a cow, molasses,
    perfumes, leafy vegetables, cooked food, and uncooked food, each paired with a
    particular animal or bird form.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Stealing fire, household utensils, dyed clothes, a deer, an elephant, a horse,
    fruit and roots, a woman, water, vehicles, or cattle is likewise paired with a
    specified animal or bird form.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage generalizes that anyone who forcibly takes another person's property
    or eats sacrificial food before a portion has been offered inevitably becomes
    an animal.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Translator notes cite parallels in Yajnavalkya III and Vishnu XLIV for several
    of the transmigration rules in verses 60-68.
  category: other
  evidence_refs:
  - ev:8
