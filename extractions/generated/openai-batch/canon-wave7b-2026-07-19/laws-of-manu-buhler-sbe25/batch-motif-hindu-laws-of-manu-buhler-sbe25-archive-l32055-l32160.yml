  quote: ''
  summary: The passage lists wrongful actions and thefts, then assigns corresponding
    rebirths as animals, insects, birds, spirits, or another class of being. It concludes
    that forcible taking of another's property or eating sacrificial food before offering
    leads inevitably to becoming an animal.
  language: English
