  summary: The passage explains rules and commentarial interpretations concerning
    inheritance when heirs fail or when remoter kin, teachers, pupils, or qualified
    Brahmanas may receive the estate. It emphasizes succession by nearness to the
    deceased, discusses terms such as Sakulya, Sapiṇḍa, Samanodaka, and Bandhu, and
    links final inheritance by Veda-versed Brahmanas with preservation of law and
    funeral rites.
  language: English
  quote_policy: summarized
