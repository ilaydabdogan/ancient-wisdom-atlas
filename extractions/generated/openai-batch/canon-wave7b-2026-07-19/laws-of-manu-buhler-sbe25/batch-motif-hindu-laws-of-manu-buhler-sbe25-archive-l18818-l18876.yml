canonical_text:
  quote: As the leech, the calf, and the bee take their food little by little...
  summary: 'The passage gives rules for royal administration: corrupt officials taking
    money from suitors are mentioned with banishment; the king is instructed to provide
    maintenance and wages for royal servants, assess trade duties after considering
    costs and risks, fix taxes so both ruler and worker receive due reward, and draw
    moderate annual taxes using the simile of a leech, calf, and bee taking food gradually.
    A following line begins a rule about a fiftieth part of increments on cattle,
    and notes cite related dharma-law sources.'
