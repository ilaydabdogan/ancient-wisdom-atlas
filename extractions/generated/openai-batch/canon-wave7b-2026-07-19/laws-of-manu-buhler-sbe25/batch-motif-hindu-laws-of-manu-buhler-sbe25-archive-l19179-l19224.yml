canonical_text:
  quote: ''
  summary: 'The passage classifies several royal-policy measures: sitting quiet, division
    of forces, seeking refuge, and peaceful measures. It gives circumstances for each,
    including weakness caused by fate or former acts, support of a friend, separating
    army and master for a purpose, seeking protection when harassed by enemies, and
    using peaceful measures when future superiority is expected with little present
    injury. Notes explain variant interpretations of former acts and division of forces.'
