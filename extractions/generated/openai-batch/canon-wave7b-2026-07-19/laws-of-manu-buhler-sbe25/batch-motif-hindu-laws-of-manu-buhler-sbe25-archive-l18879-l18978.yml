  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The kingdom of a king in whose dominions a Srotriya pines with hunger is said
    to be afflicted by famine before long.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After ascertaining a Srotriya's Vedic learning and conduct, the king is instructed
