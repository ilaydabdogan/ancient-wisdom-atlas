canonical_text:
  quote: ''
  summary: The passage classifies five organs of sense, five organs of action, and
    manas as an eleventh internal organ; teaches that control of the organs and mind
    prevents guilt and enables success; contrasts desire, renunciation, knowledge,
    ritual acts, and inner contamination; uses fire and water similes for desire and
    loss of wisdom; and prescribes Savitri recitation at morning and evening twilight,
    with morning recitation said to remove guilt from the previous night.
  language: English
  quote_policy: summarized
