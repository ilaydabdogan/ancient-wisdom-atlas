canonical_text:
  quote: ''
  summary: 'The passage argues about the relative chronology and dependence of Manu-smrti,
    Vasishtha Dharmaśāstra, and other Dharma-sutra traditions. It then quotes Vasishtha
    IV, 5-8 as preserving a Manava Sutra passage on limited occasions when injury
    to animals or animal slaughter is permitted: worship of manes and gods, honoring
    guests, sacrifice, honey-mixture offerings, rites for the manes, and hospitality
    to a Brahmana or Kshatriya guest. The quoted rules also distinguish ordinary injury
    from sacrificial slaughter and relate injury to living beings to heavenly bliss.'
  language: English
  quote_policy: summarized
