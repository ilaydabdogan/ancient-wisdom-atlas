  summary: The passage is a scholarly introduction comparing Manu's legal material
    with related legal authorities. It discusses an awkwardly placed inheritance verse,
    repeated moral exhortations about royal duties, a judicial device for doubtful
    deposit disputes, and the relative incompleteness or systematization of rules
    about gifts in Manu, Ya^avalkya/Ya^navalkya, and Narada.
  language: English
  quote_policy: summarized
