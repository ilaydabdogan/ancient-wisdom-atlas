literal_observations:
- id: obs:1
  text: The legitimate son and the son of the wife share the father's estate, while
    ten other kinds become members of the family and inherit in order when earlier-named
    types fail.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A son begotten by a man on his own wedded wife is identified as the legitimate
    son of the body and first in rank.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A son begotten according to the Niyoga rule on the appointed wife of a dead
    man, a eunuch, or a diseased man is called a son begotten on a wife.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A boy equal by caste whom his mother or father affectionately gives to a man
    as his son, confirming the gift with a libation of water in distress, is considered
    an adopted son.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A man may make as his son someone equal by caste, acquainted with right and
    wrong, and endowed with filial virtues.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A child born in a man's house whose father is unknown is called a son born
