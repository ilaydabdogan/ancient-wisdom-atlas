  quote: ''
  summary: The passage classifies types of sons for inheritance purposes, including
    the legitimate son, the son begotten on an appointed wife, the adopted son given
    by parents with a water libation, the son made by a man, the child born secretly
    in a house with unknown father, and the deserted child received as a son. It also
    gives editorial notes citing parallel legal authorities and commentators.
