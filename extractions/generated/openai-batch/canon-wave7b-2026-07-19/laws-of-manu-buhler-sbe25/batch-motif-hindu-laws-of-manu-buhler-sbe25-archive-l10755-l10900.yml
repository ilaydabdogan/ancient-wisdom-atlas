  quote: ''
  summary: The passage classifies marriage rites, describes the actions and exchanges
    involved in several rites, distinguishes lawful and unlawful forms, gives caste-related
    rules, and states lineage effects attributed to sons born from wives married according
    to particular rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that among several named marriage rites, some are declared
    lawful and some unlawful, and it says the Pai^a^a and Asura rites must never be
    used.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For Kshatriyas, the Gandharva and Rakshasa rites are said to be permitted,
    whether separate or mixed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Brahma rite is described as the gift of a decked and honoured daughter
    to a man learned in the Veda and of good conduct whom the father invites.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Daiva rite is described as giving an ornamented daughter to a priest officiating
    at a sacrifice during its performance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Arsha rite is described as giving a daughter after receiving a cow and
    a bull, or two pairs, from the bridegroom for the fulfilment of sacred law.
  category: speech
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:6
  text: The Pra^apatya rite is described as giving the daughter after addressing the
    couple with a text about performing duties together and showing honour to the
    bridegroom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Asura rite is described as the bridegroom receiving a maiden after giving
    as much wealth as he can afford to the kinsmen and to the bride herself, according
    to his own will.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Gandharva rite is described as the voluntary union of a maiden and her
    lover, springing from desire and having sexual intercourse as its purpose.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Rakshasa rite is described as the forcible abduction of a maiden from
    her home while she cries and weeps, after her kinsmen have been slain or wounded
    and houses broken open.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The eighth rite is described as a man stealthily seducing a girl who is sleeping,
    intoxicated, or disordered in intellect, and it is called most base and sinful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The gift of daughters among Brahmanas is said to be most approved when preceded
    by a libation of water; for other castes it may be performed by mutual consent.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage states that sons born from wives married by certain rites can
    liberate specified numbers of ancestors and descendants from sin.
  category: relationship
  evidence_refs:
  - ev:5
