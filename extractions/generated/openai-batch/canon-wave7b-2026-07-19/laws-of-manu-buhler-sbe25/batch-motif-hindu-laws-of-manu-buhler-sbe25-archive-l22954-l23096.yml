canonical_text:
  quote: ''
  summary: The passage gives legal rules for conversation with others' wives, exceptions
    and minor fines for certain women, penalties for sexual offenses involving maidens,
    women, wives, and caste-defined offenders, and severe punishments including fines,
    confinement, mutilation, public humiliation, execution by dogs, and burning on
    an iron bed. Translator notes cite related Dharmaśāstra passages and commentator
    explanations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man forbidden to converse with another man's wife is fined if he continues
    to converse with her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes wives of actors and singers, women connected with
    men who live from their wives' intrigues, female slaves, and female ascetics,
    assigning exceptions or small fines for secret conversation.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:10
- id: obs:3
  text: Penalties for sexual acts involving maidens are differentiated by willingness,
    force, caste status, and whether the father desires a nuptial fee.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
  - ev:11
- id: obs:4
  text: A maiden who courts a lower-caste man is to be confined in her house according
    to the rule, with translator notes reporting commentator explanations about fettering
    or guarding.
  category: action
  evidence_refs:
  - ev:3
  - ev:11
- id: obs:5
  text: Forcible contamination of a maiden is punished by cutting off two fingers
    and a fine; consensual defilement by an equal-caste man is punished by a smaller
    fine and not by finger amputation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A damsel or woman who pollutes a damsel is assigned penalties including fines,
    payment of nuptial fee, lashes, shaving, cutting off fingers, and riding on a
    donkey.
  category: action
  evidence_refs:
  - ev:5
  - ev:12
- id: obs:7
  text: A wife who violates the duty owed to her lord is to be publicly devoured by
    dogs, and the male offender is to be burned to death on a red-hot iron bed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Repeat conviction or repeated intercourse with named outcast or marginal categories
    is punished by a doubled fine.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Rules for Śūdra, Vaiśya, and Kṣatriya men with twice-born or Brahman women
    specify penalties including loss of property, imprisonment, shaving with ass's
    urine, bodily loss, and death in some cases.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Translator notes explicitly cite Yājñavalkya, Baudhāyana, Gautama, and Viṣṇu
