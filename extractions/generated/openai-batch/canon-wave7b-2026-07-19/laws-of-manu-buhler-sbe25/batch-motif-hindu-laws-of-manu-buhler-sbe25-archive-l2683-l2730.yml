canonical_text:
  quote: ''
  summary: 'The passage summarizes scholarly claims about Manu: his association with
    Sraddha rites and sacrifice, his relation to Ida and Manavi, a brief legend of
    demon-destroying voice, his credited revelation of mantras and hymns, and a transmission
    chain in which Brahma teaches Prajapati, Prajapati teaches Manu, and Manu teaches
    mankind. A footnote compares Manu''s role as inventor of Sraddhas with Brahmana
    sacrificial introductions in which the Devas play an analogous explanatory role.'
  language: English
  quote_policy: summarized
