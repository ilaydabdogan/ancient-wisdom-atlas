canonical_text:
  quote: ''
  summary: A prescriptive passage for a householder or Snataka gives rules about bodily
    acts, purity around fire and water, conduct toward Brahmanas, cows, superiors,
    menstruating women, sacrifice, sacred recitation, residence, eating, vessels,
    travel animals, and objects or sights to avoid.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that in shade or darkness, and when life is in danger, a
    Brahmana may do the referenced act in any position; it also says that a man who
    voids urine against fire, the sun, the moon, water, a Brahmana, a cow, or the
    wind loses his intellect.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage prohibits blowing on fire with the mouth, looking at a naked woman,
    throwing impure substances into fire, warming the feet at fire, placing fire under
    a bed-like object, stepping over fire, putting fire at the foot of a bed while
    sleeping, and tormenting living creatures.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage prohibits eating, travelling, or sleeping during twilight, scratching
    the ground, taking off a garland, and throwing urine, faeces, saliva, defiled
    clothes, impurities, blood, or poisonous things into water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage prohibits sleeping alone in a deserted dwelling, waking a sleeping
    superior, conversing with a menstruating woman, and going to a sacrifice when
    not chosen as officiating priest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage instructs keeping the right arm uncovered where a sacred fire
    is kept, in a cow-pen, in the presence of Brahmanas, during private Veda recitation,
    and at meals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says not to interrupt a cow suckling her calf or tell anyone of
    it, and says that a wise man should not point out a rainbow in the sky.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage prohibits dwelling where sacred law is not obeyed, staying long
    where diseases are endemic, travelling alone, residing long on a mountain, and
    dwelling in specified countries associated with Sudra rulers, unrighteous men,
    heretics, or men of the lowest castes.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'The passage regulates eating, bodily expression, vessels, and personal articles:
    it prohibits gluttony, certain meal times, purposeless exertion, drinking from
    joined palms, eating from the lap, idle curiosity, dancing, singing, instrumental
    music, limb-slapping, teeth-grinding, uncouth noises, washing feet in a white-brass
    vessel, eating from broken or defiled dishes, and using articles previously used
    by others.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'The passage gives rules for travel animals: one should not travel with untrained,
    hungry, diseased, injured, or disfigured beasts, but should travel with well-trained,
    swift animals with lucky marks and complete colour and form, without much use
    of the goad.'
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says that the morning sun, smoke rising from a burning corpse,
    and a broken seat must be avoided, and that nails or hair should not be clipped
    nor nails torn with the teeth.
  category: action
  evidence_refs:
  - ev:10
