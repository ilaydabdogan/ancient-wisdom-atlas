canonical_text:
  quote: ''
  summary: The passage describes nested measures of time for humans, manes, gods,
    and Brahman; the lengths of world ages; Brahman's awakening and creation through
    mind; a sequence of elements from ether to earth; numberless Manvantaras with
    repeated creations and destructions; and the condition of Dharma and Truth in
    the Krta age and later ages.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sun divides days and nights; night is for repose of created beings and
    day for exertion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A month is described as a day and night of the manes, divided by dark and
    bright fortnights.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A year is described as a day and night of the gods, divided by the sun's northward
    and southward progress.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The four ages have preceding and following twilights; their lengths decrease
    in successive ages, and twelve thousand divine years are called one age of the
    gods.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: One thousand ages of the gods make one day of Brahman, and Brahman's night
    has the same length.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: At the end of that day and night, Brahman, who was asleep, awakes and creates
    mind, which is both real and unreal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Mind, impelled by Brahman's desire to create, modifies itself and produces
    ether, whose quality is sound.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: From ether comes wind with the quality of touch; from wind comes brilliant
    light with the quality of colour.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: From light comes water with the quality of taste; from water comes earth with
    the quality of smell.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Seventy-one ages of the gods constitute a Manvantara; Manvantaras, creations,
    and destructions are numberless, and Brahman repeats them again and again.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: In the Krta age, Dharma and Truth are four-footed and entire; in the other
    ages, Dharma is said to be deprived successively because of unjust gains.
  category: attribute
  evidence_refs:
  - ev:10
