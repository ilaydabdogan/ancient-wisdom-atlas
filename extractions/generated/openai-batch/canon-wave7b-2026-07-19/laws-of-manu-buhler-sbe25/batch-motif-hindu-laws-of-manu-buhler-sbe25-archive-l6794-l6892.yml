  quote: ''
  summary: The passage opens with great sages asking a powerful speaker for instruction.
    The speaker honors them and tells them to listen. The universe is described as
    existing in Darkness, unperceived, without marks, beyond reasoning, unknowable,
    and as if immersed in deep sleep. Then the divine Self-existent appears with irresistible
    creative power, makes the great elements and the rest discernible, and dispels
    the darkness. The editorial notes compare this creation account with Vedic passages
    and discuss commentarial interpretations of darkness and the undiscernible state.
