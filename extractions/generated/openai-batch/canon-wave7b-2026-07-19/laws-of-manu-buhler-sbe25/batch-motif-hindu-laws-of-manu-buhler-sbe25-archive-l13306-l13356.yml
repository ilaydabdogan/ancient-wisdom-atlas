canonical_text:
  quote: ''
  summary: 'The passage gives rules for a Brahmana or Snataka: one who lives by gleaning
    grains must perform the Agnihotra and prescribed offerings at lunar and solar
    times; he should not adopt worldly ways for subsistence; and he should seek happiness
    through contentment and self-control. A note glosses Agnihotra as daily morning
    and evening oblations in the sacred fire or fires.'
