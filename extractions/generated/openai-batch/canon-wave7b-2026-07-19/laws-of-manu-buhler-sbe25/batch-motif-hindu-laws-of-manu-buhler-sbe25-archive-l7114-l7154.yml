canonical_text:
  quote: ''
  summary: Commentarial notes on Manu's creation passage explain that, according to
    Nandana, the verses are not meant to give the actual order of creation but to
    show that all created beings have their material cause in portions of the creator's
    body and related principles such as Mahat, Ahaṃkāra, Manas, Tanmātras, and organs.
    The notes also state that verse 16 derives individual subtle bodies from the creator's
    subtle body and individual souls from his soul, while recording disagreements
    about the meaning of 'those six.'
  language: English
  quote_policy: summarized
