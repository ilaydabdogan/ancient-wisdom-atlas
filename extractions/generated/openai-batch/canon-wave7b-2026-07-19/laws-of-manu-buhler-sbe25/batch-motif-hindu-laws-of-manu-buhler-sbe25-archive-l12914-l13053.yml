canonical_text:
  quote: Let there be Svadha
  summary: 'The passage gives prescriptive rules for śrāddha and related rites: Brahmana
    guests pronounce a benison, ritual words and materials are specified, the host
    prays to the manes, sacrificial cakes are disposed of through animals, fire, or
    water, a wife may eat a cake to obtain a son, relatives are fed, and offerings
    are said to satisfy ancestors for stated durations.'
  language: English
  quote_policy: quoted
