canonical_text:
  quote: ''
  summary: A set of rules for a learned or twice-born Snataka governs daily Veda recitation,
    interruptions caused by animal crossings and impurity, chastity on specified lunar
    days, bathing restrictions, avoidance of stepping on revered shadows or impure
    substances, caution at crossroads, avoidance of dangerous social contacts, respect
    toward a Kshatriya, a snake, and a learned Brahmana, perseverance in seeking fortune,
    and regulated truthful and pleasing speech.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The learned are instructed to repeat daily, in order, the essence of the three
    Vedas and then the Veda text.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Veda-study is to be interrupted for a day and a night when specified animals
    pass between teacher and pupil.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A twice-born man is to interrupt Veda-study when the recitation place is impure
    or when he himself is unpurified.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Snataka is instructed to remain chaste on the new-moon day, the eighth lunar
    day of each half-month, the full-moon day, and the fourteenth lunar day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The addressee is told not to bathe immediately after a meal, when sick, in
    the middle of the night, frequently while fully clothed, or in an unfamiliar pool.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The addressee is told not intentionally to step on the shadows of images of
    gods, a Guru, a king, a Snataka, his teacher, a reddish-brown animal, or a Dikshita.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The note to verse 130 reports that the expression translated as reddish-brown
    animal is not clearly explained and may be understood as a brown cow, Soma creeper,
    or brown creature according to different commentators.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The addressee is told not to stay long on a cross-road at midday, midnight,
    after eating meat at a funeral dinner, or during the two twilights.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The addressee is told not intentionally to step on cleansing materials, used
    bath water, urine, ordure, blood, mucus, spit, or vomit.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The addressee is told not to show special attention to an enemy, an enemy's
    friend, a wicked man, a thief, or another man's wife.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:11
  text: Criminal conversation with another man's wife is described as highly detrimental
    to long life.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: One who desires prosperity is told never to despise a Kshatriya, a snake,
    or a learned Brahmana, because these three may destroy him when disrespected.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:13
  text: The addressee is told not to despise himself because of former failures and
    to seek fortune until death.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The passage instructs one to speak what is true and pleasing, and not to utter
    disagreeable truth or agreeable falsehood; this is called the eternal law.
  category: speech
  evidence_refs:
  - ev:13
