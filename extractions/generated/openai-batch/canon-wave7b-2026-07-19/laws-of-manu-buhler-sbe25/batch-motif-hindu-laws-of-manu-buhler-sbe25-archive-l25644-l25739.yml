canonical_text:
  quote: ''
  summary: 'The passage gives inheritance rules: the king may not take a Brahmana''s
    property but may take property of other castes if all heirs fail; a widow who
    raises a son for a man who died without issue must give that son the deceased
    man''s property; sons begotten by different men divide claims according to what
    belonged to each father; uterine siblings divide a mother''s estate; granddaughters
    may receive something from a maternal grandmother''s estate; the next rule begins
    listing marriage-related gifts, including gifts before the nuptial fire and during
    the bridal procession.'
  language: English
  quote_policy: summarized
