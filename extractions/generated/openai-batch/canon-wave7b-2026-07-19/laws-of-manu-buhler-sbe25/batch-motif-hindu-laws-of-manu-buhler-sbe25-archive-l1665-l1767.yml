  summary: The passage discusses scholarly comparison between the Manu-smrti and the
    Manava Grhya-sutra, noting both limited correspondences and major discrepancies
    in initiation, marriage rites, Veda study, mantras, and ritual prescriptions.
    It then considers whether the Manava school may still have had a connection with
    an earlier Manu Dharma-sutra and points to the Sraddhakalpa, a Manava treatise
    on funeral sacrifices, as a possible connecting link.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Professor Jolly is reported to have found no special agreement between corresponding
    portions of the Manu-smrti and the Manava Grhya-sutra concerning ages for Samskaras,
    marriage rites, and rules for students and Snatakas.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that technical terms and phrases of the Manava Grhya-sutra
    were not found in the Manu-smrti, and that some closer resemblances in mantras
    and other points were not conclusive because other Grhya-sutras also agree.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A cited initiation rule says the student should go out to beg first from his
    mother and other friendly or nearby females; Manu II.50 is said to correspond
    by naming the mother, sister, maternal aunt, or another woman who would not disgrace
    him by refusing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'A footnote contrasts marriage classifications: Manu-smrti III.20-34 is said
    to describe eight modes of obtaining a woman from her family, while the Manava
    Grhya-sutra is said to know only the Brahma and Saulka rites, with Saulka allowing
    purchase of the bride from her parents.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: For Veda study, the passage says general rules agree between the two works,
    but special Manava Grhya-sutra prescriptions for learning portions of the Maitrayani
    Samhita cannot be traced in the Manu-smrti.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The author concludes that discrepancies, lack of characteristic agreements,
    and absence of Mantras peculiar to the Maitrayaniya-Manava school prevent a decisive
    settlement of the relationship between the works.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:7
  text: The passage allows that the original of the Manu-smrti may still have been
    connected with the Manava school, because school corpora can contain works by
    different teachers or from different sources.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
