literal_observations:
- id: obs:1
  text: Applying sesamum to any purpose other than food, anointing, and charitable
    gifts is said to result in rebirth as a worm and in the offender and his ancestors
    being plunged into dog ordure.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Brahmana who sells flesh, salt, and lac becomes an outcast at once, and
    one who sells milk becomes equal to a Sudra in three days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Willingly selling other forbidden commodities in ordinary circumstances causes
    a Brahmana, after seven nights, to assume the character named in the passage as
    a Vakya.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Condiments may be bartered for condiments, cooked food for cooked food, and
    sesamum seeds for grain in equal quantities, but salt may not be exchanged for
    other condiments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Kshatriya in distress may use the listed means of subsistence but must not
    arrogantly adopt the mode of life prescribed for his betters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A man of low caste who covetously lives by occupations of a higher caste is
    to have his property taken and be banished by the king.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that incomplete performance of one's own appointed duty
    is better than complete performance of another's duty, and that living by another
    caste's law excludes one from one's own caste law.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: A Vaisya unable to live by his own duties may maintain himself by a Sudra's
    mode of life while avoiding forbidden acts, and a Sudra unable to serve the twice-born
    may maintain himself by handicrafts and practical arts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A Brahmana in distress from want of subsistence may accept gifts from anybody,
    and accepting food from any person when his life is in danger is said not to taint
    him with sin.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Brahmanas in distress who teach, sacrifice for, or accept gifts from despicable
    men are said not to commit sin and are compared in purity to fire and water.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: A^igarta, suffering hunger, approached in order to slay his own son and is
    said not to have been tainted by sin because he sought a remedy against famishing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Vamadeva, while tormented by hunger and seeking to save his life, desired
