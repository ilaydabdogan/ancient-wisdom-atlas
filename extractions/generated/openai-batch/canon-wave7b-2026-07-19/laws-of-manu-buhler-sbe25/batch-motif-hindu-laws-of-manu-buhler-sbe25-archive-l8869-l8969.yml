canonical_text:
  quote: ''
  summary: 'The passage gives rules for a student beginning Vedic study: ritual preparation,
    clasping the teacher’s feet, reciting under the teacher’s command, framing lessons
    with Om, preparing to pronounce Om through grass, purification, and breath restraint.
    It also describes Prajapati drawing sacred sounds and the Savitri verse from the
    three Vedas, and states the merit and purification gained by repeated recitation.'
  language: English
  quote_policy: summarized
