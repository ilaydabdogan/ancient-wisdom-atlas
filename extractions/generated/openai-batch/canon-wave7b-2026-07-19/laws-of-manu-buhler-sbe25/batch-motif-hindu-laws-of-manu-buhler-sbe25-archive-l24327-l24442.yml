canonical_text:
  quote: ''
  summary: The passage gives rules concerning marriage, paternal giving of a daughter,
    a maiden's limited self-choice after a waiting period, ornaments and nuptial fees,
    marriage-age examples, divine sanction for the husband's reception of a wife,
    ritual performance with the wife, and remarriage to a deceased fee-payer's brother
    if the maiden consents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A sacrifice performed by another while a wife of equal caste is alive is declared
    blameworthy in the passage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A father is instructed to give his daughter to a distinguished, handsome suitor
    of equal caste according to the prescribed rule, even if she has not reached the
    stated proper age.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A marriageable maiden is said to be better left in her father's house until
    death than given to a man lacking good qualities.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: After three years of waiting while marriageable, a damsel may choose an equal-caste
    and equal-rank bridegroom herself, and neither she nor the man she weds incurs
    guilt.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: A maiden who chooses for herself is forbidden to take ornaments given by her
    father, mother, or brothers; carrying them away is called theft.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: A man who takes a marriageable damsel as wife is not to pay a nuptial fee
    to her father, because the father is said to lose dominion over her by obstructing
    the legitimate result of her menses.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage gives age-pair examples for marriage and states that a man must
    marry sooner if his duties would otherwise be impeded.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The husband is said to receive his wife from the gods rather than according
    to his own will, and he is instructed to support her while she is faithful.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Women are described as created to be mothers and men to be fathers, and Vedic
