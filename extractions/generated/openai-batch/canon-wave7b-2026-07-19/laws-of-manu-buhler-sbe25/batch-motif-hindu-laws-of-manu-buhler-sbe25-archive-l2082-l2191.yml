canonical_text:
  quote: ''
  summary: 'The passage describes classes of Vedic and scholastic specialists: Vaidiks
    who memorize Vedic and related texts, ritual experts who perform Srauta and domestic
    rites, and Pandits who specialize in grammar, law, astronomy, or related sciences.
    It notes that legal scholars may interpret older Dharma-sutras through later Dharma-shastras
    such as those of Manu or Yajnavalkya, and gives Sayana-Madhava as an example.'
  language: English
  quote_policy: summarized
