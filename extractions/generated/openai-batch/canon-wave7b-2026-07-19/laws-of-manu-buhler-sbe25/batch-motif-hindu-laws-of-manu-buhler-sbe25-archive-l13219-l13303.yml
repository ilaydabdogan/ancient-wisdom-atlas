canonical_text:
  quote: ''
  summary: The passage gives normative instructions for a Brahmana entering householder
    life after study and marriage. It ranks acceptable means of subsistence, defines
    several named modes such as gleaning, unasked gifts, begging, agriculture, trade,
    and service, and distinguishes four kinds of Brahmana householders by how much
    provision they store and by their occupations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Brahmana is instructed to live with a teacher during the fourth part of
    life and then, after marrying, to live in his house during the second quarter
    of life.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Brahmana is told to seek a means of subsistence causing no pain or little
    pain to others, except in distress.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Property is to be accumulated only for bare subsistence through irreproachable
    occupations prescribed for his caste and without unduly fatiguing the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The passage names several subsistence modes: Rta, Amrita, Mrta, Pramrta,
    Satyanrta, and Svavritti.'
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Rta is explained as gleaning corn; Amrita as what is given unasked; Mrta as
    food obtained by begging; and Pramrta as agriculture.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Trade and money-lending are called Satyanrta, while service is called Svavritti
    and is to be avoided.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Four storage levels are listed: enough to fill a granary, enough to fill
    a grain-jar, enough for three days, and no provision for the morrow.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Among four Brahmana householders, each later-named type is said to be more
    distinguished and to have conquered the world more completely through virtue.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The four householders are also distinguished by occupations: one follows
    six occupations, another three, another two, and the fourth lives by the Brahmasattra.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A translator's note reports disagreement among commentators about whether
    droha means pain caused by begging or injury to living beings.
  category: speech
  evidence_refs:
  - ev:7
