canonical_text:
  quote: ''
  summary: 'Verses V.59-62 prescribe rules for impurity after death and birth: death
    impurity among Sapindas lasts for specified periods or until bones are collected;
    kinship relationships have defined limits; birth impurity may parallel death impurity
    or fall on the parents or mother, while the father becomes pure by bathing. Translator
    notes cite other Dharmashastra/commentarial interpretations of these durations
    and variants.'
