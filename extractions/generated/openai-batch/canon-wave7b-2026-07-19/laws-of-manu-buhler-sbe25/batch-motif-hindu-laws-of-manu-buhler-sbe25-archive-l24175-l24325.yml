canonical_text:
  quote: ''
  summary: 'A prescriptive legal passage on duties of husband and wife: rules for
    marital approach, giving a daughter only once, annulment for fraud or undisclosed
    blemishes, maintenance and waiting during a husband''s absence, discipline or
    non-abandonment under specified conditions, supersession of wives, fines for public
    misconduct, and ranking or ritual service of wives by caste.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment instructs that a husband approach his wife once in each
    proper season after purity until issue is obtained.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man is forbidden to give his daughter to another man after she has already
    been given to one man; the passage states that doing so incurs guilt connected
    with false speech about a human being.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man who has accepted a damsel in due form may abandon her if she is blemished,
    diseased, deflowered, or given with fraud; a concealed blemish allows annulment
    of the contract with the giver.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A husband who departs for business abroad is told to secure maintenance for
    his wife; if he does not provide, she may subsist by blameless manual work.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the husband provides before going on a journey, the wife is to subject
    herself to restraints in daily life; the note explains these restraints as not
    adorning herself, not visiting strangers' houses, and not going to festivals.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: 'The passage gives different waiting periods for an absent husband: eight
    years for sacred duty, six for learning or fame, and three for pleasure.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A husband is told to bear with a wife who hates him for one year, and after
    that to deprive her of property and cease cohabitation.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A wife showing aversion toward a mad, outcast, eunuch, impotent, or severely
    diseased husband is not to be cast off or deprived of property.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage permits superseding wives under stated conditions, including bad
    conduct, rebelliousness, disease, wastefulness, barrenness, loss of children,
    bearing only daughters, or quarrelsomeness; a sick, kind, virtuous wife may be
    superseded only with her consent and without disgrace.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: A superseded wife who departs angrily from the husband's house is to be confined
    or cast off in the family's presence; a wife who disobeys prohibitions on liquor,
    festivals, spectacles, or assemblies is fined six krishnalas.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: When twice-born men marry wives of their own and lower castes, seniority,
    honour, and habitation are ordered by caste; only the equal-caste wife is to attend
    the husband personally and assist in daily sacred rites.
  category: relationship
  evidence_refs:
  - ev:10
