literal_observations:
- id: obs:1
  text: A brother able to maintain himself by his own occupation may be separated
    from family property if he does not desire a share, receiving only a trifle out
    of his share for support.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary reports that the small amount given to such a brother is intended
    to prevent future disputes.
  category: other
  evidence_refs:
  - ev:6
- id: obs:3
  text: A brother's acquisition made by his own labour, without using the patrimony,
    need not be shared with his brothers unless he chooses to share it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A father who recovers lost ancestral property is not required to divide it
    with his sons unless he wills to do so, because the recovered property is treated
    as self-acquired.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Brothers who were once divided but then live together again as coparceners
    must divide equally if they make a second partition; in that case primogeniture
    does not apply.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the eldest or youngest brother is deprived of his share or dies, the share
    is not lost; uterine brothers assemble to divide it equally together with reunited
    brothers and uterine sisters.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The notes cite other legal texts as parallels for several inheritance rules
    in this passage.
  category: other
  evidence_refs:
