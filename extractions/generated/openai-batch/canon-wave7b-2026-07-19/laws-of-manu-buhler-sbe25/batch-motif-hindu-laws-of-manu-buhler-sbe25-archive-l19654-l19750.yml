canonical_text:
  quote: ''
  summary: Chapter VIII opens with instructions for a king or appointed learned Brahmana
    to hear lawsuits in court, decide cases according to local usage and sacred law,
    recognize eighteen legal topics, constitute a Brahmanic court, and uphold truth
    against injustice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king who wishes to investigate law cases is instructed to enter the court
    of justice with a dignified demeanour, Brahmanas, and experienced councillors.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In court the king may sit or stand, raise his right arm, avoid ostentation
    in dress and ornaments, and examine the suitors' business.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king is told to decide cases daily, one after another, under eighteen
    legal titles, using principles from local usages and sacred law institutes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The listed legal titles include debts, deposits and pledges, sale without
    ownership, partnership concerns, gifts, wages, agreements, sale and purchase,
    cattle-owner disputes, boundaries, assault, defamation, theft, robbery and violence,
    adultery, duties of husband and wife, inheritance partition, gambling, and betting.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king is instructed to depend on eternal law when deciding suits among
    disputing men.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the king does not personally investigate suits, he is to appoint a learned
    Brahmana to try them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The appointed judge is to enter the excellent court with three assessors and
    consider the causes before the king, sitting or standing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A court where three Veda-versed Brahmanas and the learned judge appointed
    by the king sit is called the court of four-faced Brahman.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage represents justice as wounded by injustice and approaching the
    judges; if the judges do not extract the dart, they too are wounded by it.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that one should either not enter the court or speak truth
    there; silence or false speech makes a person sinful.
  category: speech
  evidence_refs:
  - ev:9
