canonical_text:
  quote: ''
  summary: The passage prescribes penances and purifications for cow-killing, minor
    offences, a student's broken vow, caste-degrading and impurity-producing acts,
    and graded expiations for killing persons of different social classes. It includes
    gifts of cattle, sacrificial offerings, fire oblations, begging, public proclamation,
    bathing, fasting, and dwelling away from the village.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cow-slayer who serves cows in the prescribed manner removes the guilt of
    killing a cow after three months.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After completing the penance, the cow-slayer must give learned Brahmanas ten
    cows and a bull, or all he has if he lacks that property.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Twice-born men who have committed other minor offences may purify themselves
    by the same penance or by a lunar penance, except for a student who has broken
    his vow.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A student who has broken his vow must offer a one-eyed ass to Nirmi at night
    on a crossway.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The broken-vow student offers oblations in the fire and then clarified butter
    to Vata, Indra, Brhaspati, and Agni while reciting a Rik verse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Voluntary effusion of semen by a twice-born student is declared to constitute
    breach of the student vow; the divine light imparted by the Veda enters the Maruts,
    Indra, Brhaspati, and Pavaka.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After this sin, the student goes begging to seven houses, wears the hide of
    the sacrificed ass, and proclaims his deed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The student subsists on one daily meal from the alms obtained and bathes at
    the three savanas; he becomes pure after one year.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Different named penances are assigned according to whether caste-degrading
    or impurity-producing acts were intentional or unintentional.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Penances for killing Kshatriya, Vaisya, and Sudra persons are given as fractions
    of the penance for murdering a Brahmana, with alternative cattle gifts and ascetic
    dwelling away from the village.
  category: sequence
  evidence_refs:
  - ev:8
