canonical_text:
  quote: ''
  summary: The passage lists categories of persons to be avoided at rites for gods
    and manes, compares an unlearned Brahmana to an extinguished fire of dry grass,
    warns that food given to unworthy participants is consumed by Rakshasas or loses
    its reward, defines certain kinship and marriage transgressions, and states that
    some participants in improper marriages fall into hell.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several categories of men are named as persons to be avoided, including those
    with specified illnesses or disabilities, ritual or occupational disqualifications,
    reprehensible conduct, and unworthiness to sit in the company at a repast.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Brahmana who knows the sacred law is instructed to shun the listed lowest
    twice-born men at sacrifices to the gods and to the manes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An unlearned Brahmana is compared to a fire of dry grass that is unable to
    consume offerings and is quickly extinguished.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sacrificial food is not to be given to an unlearned Brahmana because it would
    be as if offered in ashes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage announces a result after death for giving food destined for gods
    or manes to someone unworthy to sit in the company.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rakshasas are said to consume food eaten by Brahmanas who have not fulfilled
    the vow of studentship and by other men not admissible into the company.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage defines a Parivettri as one who marries or begins the Agnihotra
    before his elder brother, and identifies the elder brother as a Parivitti.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The elder brother marrying after the younger, the younger marrying before
    the elder, the woman, the giver of the woman, and the sacrificing priest are all
    said to fall into hell.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Two kinds of sons born by wives of other men are named, one born while the
    husband lives and one begotten after the husband's death.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Those two sons are said to cause the giver to lose the rewards in this life
    and after death for food sacred to gods or manes given to them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A giver of a funeral repast is said not to reap reward for as many worthy
    guests as an inadmissible man can look on while they are feeding.
  category: sequence
  evidence_refs:
  - ev:8
