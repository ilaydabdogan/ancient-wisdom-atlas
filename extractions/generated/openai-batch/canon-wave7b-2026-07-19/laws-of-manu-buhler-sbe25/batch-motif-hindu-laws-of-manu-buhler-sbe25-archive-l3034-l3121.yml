  summary: A scholarly introduction surveys suspected interpolations and later enlargements
    in chapters II-V of the Laws of Manu, noting passages on sacred law, revealed
    texts, sense-control, Om and related formulas, duties toward parents and teachers,
    Manes, householders, gifts, hells, sin, merit, and forbidden foods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage identifies several verse ranges in chapters II-V as larger or
    smaller interpolations, later enlargements, suspicious passages, or misplaced
    sections.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: For chapter II, the passage says one suspect passage contains an account of
    the origin of actions, a statement of the sources of sacred law, praise of the
    Manu-smriti, advice on studying authorities, reward for obedience to revealed
    texts, and definitions of Sruti and Smriti.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another chapter II passage is described as enumerating the organs of sensation
    and action and teaching the necessity of controlling them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says material on the syllable Om, the Vyahrztis, the Savitrt,
    Brahmana humility and meekness, and worship due to parents and a teacher may have
    been enlarged.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A chapter III passage is said to contain a classification of the Manes, and
    the author says this classification is foreign to Vedic literature in that form.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Other chapter III discussions concern conjugal intercourse, honour due to
    women, the excellence of householders, and results of inviting sinners and men
    of bad conduct to Sraddhas.
  category: other
  evidence_refs:
  - ev:6
- id: obs:7
  text: A chapter IV section concerns the means by which a Brahmana or Snataka may
    subsist and names a classification of subsistence categories said to be common
    in Puranas and later works but unknown in Vedic literature.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Chapter IV verses 85-91 are described as treating the offense of accepting
    gifts from a royal usurper and other wicked persons and enumerating twenty-one
    hells as the offender's portion.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: Other probable interpolations concern the results of sin, reasons for avoiding
    quarrels with near relatives, reasons for accumulating spiritual merit, and gifts
    and acceptance of gifts.
  category: other
  evidence_refs:
  - ev:9
- id: obs:10
  text: For chapter V, the passage mentions a preamble to forbidden food and verses
    prescribing penances for eating mushrooms, onions, leeks, and similar foods.
  category: object
  evidence_refs:
  - ev:10
