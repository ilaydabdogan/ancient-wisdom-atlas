  quote: ''
  summary: The passage argues that a special law school recast the Manava Dharma-sutra
    into the metrical Manu-smriti and that its universal claims are linked to law-school
    interests. It then explains the selection and veneration of Manu through myths
    around Manu's name. Manu is described as the eponymous figure of the human race,
    belonging both to gods and humans, with divine parentage accounts, sacrificial
    and heavenly roles, and human portrayals as an ancient sage, father, and householder.
  language: English
  quote_policy: summarized
