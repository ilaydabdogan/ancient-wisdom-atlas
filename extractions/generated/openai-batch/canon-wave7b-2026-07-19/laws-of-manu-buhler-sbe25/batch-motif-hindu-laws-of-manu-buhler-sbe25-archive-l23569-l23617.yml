  quote: ''
  summary: Manu IX.8-13 states that a husband is born again through conception by
    his wife, that offspring follows the male to whom the wife attaches, and that
    a husband should guard his wife to keep offspring pure. The passage adds that
    force cannot fully guard women, prescribes household duties and self-guarding,
    and lists six causes of women’s ruin. Notes in the passage connect the rebirth
    idea with Vedic and Yajnavalkya parallels and gloss the causes of ruin.
