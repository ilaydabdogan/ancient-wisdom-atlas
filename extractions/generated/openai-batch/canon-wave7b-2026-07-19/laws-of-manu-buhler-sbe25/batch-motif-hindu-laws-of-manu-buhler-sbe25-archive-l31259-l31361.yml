canonical_text:
  quote: ''
  summary: The passage lists penances for sins, including reciting Vedic hymns, bathing
    in rivers or water, fasting, begging for food, tending cows, offering clarified
    butter with sacred texts, repeating the Veda in a forest, and remembering or reciting
    Vedic collections. It states that such practices remove guilt, purify offenders,
    or free them from sins causing loss of caste. It compares the Aghamarshana hymn
    to the horse-sacrifice in its capacity to remove sin and compares sin engulfed
    by the threefold Veda to a clod dissolving in a great lake.
  language: English
  quote_policy: summarized
