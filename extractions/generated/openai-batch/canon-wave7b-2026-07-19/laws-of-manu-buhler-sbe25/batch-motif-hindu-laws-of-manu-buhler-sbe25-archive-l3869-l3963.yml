canonical_text:
  quote: ''
  summary: 'The passage defines nested cosmological measures of time: night and day
    as repose and exertion; a month as the day and night of the manes, divided by
    bright and dark fortnights; a year as the day and night of the gods, divided by
    the sun’s northward and southward courses; and the day and night of Brahman together
    with the ordered world ages. It names the Kṛta, Tretā, Dvāpara, and Kali ages
    and gives the Kṛta age as four thousand divine years with preceding and following
    twilight periods. Translator notes compare a Mahabharata reading and mention a
    fresh exordium in both works.'
  language: English
  quote_policy: summarized
