literal_observations:
- id: obs:1
  text: A pledge kept by a creditor must not be used by force; forcible use causes
    loss of interest or liability for the original price if the pledge is spoiled,
    and is described as theft of the pledge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A pledge or deposit is recoverable despite lapse of time, and certain animals
    or items used with friendly assent are not lost to the owner.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the general rule, an owner who sees a chattel enjoyed by others for ten
    years and remains silent cannot recover it; if the owner is neither an idiot nor
    a minor, the adverse possessor retains the property by law.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pledges, boundaries, infant property, open and sealed deposits, women, the
    king's property, and the wealth of a srotriya are not lost through adverse enjoyment.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person who uses a pledge without the owner's permission must remit half
    of his interest as compensation for the use.
  category: action
  evidence_refs:
  - ev:5
