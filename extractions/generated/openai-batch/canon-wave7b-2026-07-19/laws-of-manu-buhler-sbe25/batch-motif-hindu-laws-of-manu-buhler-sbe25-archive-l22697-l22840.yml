canonical_text:
  quote: ''
  summary: This legal passage defines fines and classifications for theft and robbery,
    including theft of prepared goods, sacred fire, cattle, slaves, horses, and carriages.
    It prescribes punitive duties for the king, exceptions for limited subsistence
    taking, graded liability by social rank, and religiously framed rewards or losses
    for royal punishment or pardon of violence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For husked grain, vegetables, roots, and fruit, the fine differs according
    to whether there is a connection between owner and thief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An offence committed in the owner's presence and with violence is classified
    as robbery; in the owner's absence, or if possession is denied after taking, it
    is classified as theft.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king is instructed to impose the lowest amercement for stealing prepared
    articles and for stealing sacred fire from the room where it is kept.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The king may deprive a thief of the limb used to commit an offence in order
    to prevent repetition or, according to the commentary note, to deter others.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Close relations and religious personnel, including father, teacher, friend,
    mother, wife, son, and domestic priest, are not to be left unpunished by the king
    if they fail in duty.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king is liable for a much larger fine than a common man, and theft guilt
    or penalty is scaled by varna, from eightfold for a Sudra to higher multiples
    for Vaishya, Kshatriya, and Brahmana.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Taking roots, fruit from trees, wood for sacrificial fire, and grass for cows
    is declared not to be theft; a travelling twice-born man with exhausted provisions
    is not fined for taking two sugar-cane stalks or two edible roots from another
    field.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tying up unbound cattle, freeing tied cattle, or taking a slave, horse, or
    carriage incurs the guilt of a thief.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A king who punishes thieves according to these rules is said to gain fame
    in this world and unsurpassable bliss after death.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A king desiring the throne of Indra and imperishable fame is told not to neglect
    punishment of the man who commits violence.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The perpetrator of violence is described as worse than a defamer, a thief,
    or one who injures another with a staff; a king who pardons such a person perishes
    and incurs hatred.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Twice-born men may take up arms when obstructed in fulfilling duties or when
    destruction threatens the twice-born castes in difficult times.
  category: action
  evidence_refs:
  - ev:7
