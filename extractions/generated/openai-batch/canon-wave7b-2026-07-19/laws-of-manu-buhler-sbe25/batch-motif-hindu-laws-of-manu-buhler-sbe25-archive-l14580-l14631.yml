canonical_text:
  quote: ''
  summary: 'The passage gives rules for a snataka: it defines pleasure and pain by
    dependence on self or others, advises performing acts that gladden the heart,
    forbids offending teachers, parents, gurus, cows, Brahmanas, and ascetics, lists
    attitudes to avoid, and restricts angry violence except corrective beating of
    a son or pupil.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dependence on others is said to give pain, while dependence on oneself is
    said to give pleasure; this is presented as a short definition of pleasure and
    pain.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the performance of an act gladdens the rule recipient's heart, he is told
    to perform it diligently and avoid the opposite.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The rule recipient is told never to offend his initiating teacher, his Veda
    teacher, his father and mother, any other Guru, cows, Brahmanas, or men performing
    austerities.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The rule recipient is told to avoid atheism, cavilling at the Vedas, contempt
    of the gods, hatred, want of modesty, pride, anger, and harshness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: When angry, the rule recipient is told not to raise a stick against another
    man or strike anyone, except that he may beat a son or pupil in order to correct
    them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The translator's notes cite related passages in Yajnavalkya, Apastamba, Vasishtha,
