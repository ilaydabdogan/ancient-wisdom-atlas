canonical_text:
  quote: Brahman first composed the law-book, and that Manu condensed its contents
    in his own language and taught it in that form to his pupils.
  summary: The passage reports commentarial explanations for how the Manava Dharmasastra
    can be called Manu's although Brahman/Prajapati is said to be its original author.
    Medhatithi gives explanations and analogies from the Ganges and the Kanaka Sakha;
    Narada and Kulluka are cited for a transmission in which Brahman composed the
    work and Manu abridged, condensed, and taught it. The editor then notes that these
    traditional statements have limited value for historical analysis outside Brahmanical
    doctrine.
  language: English
