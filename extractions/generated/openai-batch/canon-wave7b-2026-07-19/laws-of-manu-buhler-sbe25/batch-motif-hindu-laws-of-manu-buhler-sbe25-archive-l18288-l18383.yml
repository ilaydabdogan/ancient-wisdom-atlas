  quote: ''
  summary: The passage gives rules for a king’s consultation with ministers, special
    reliance on a learned Brahmana adviser, appointment and deployment of officials,
    and selection of an ambassador whose skills in knowledge, speech, memory, courage,
    and reading signs enable diplomacy, alliance-making, and intelligence about a
    foreign king.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king is instructed to learn each minister’s opinion separately and then
    the collective view before choosing what is beneficial in his affairs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: For the most important affairs concerning the six measures of royal policy,
    the king is instructed to deliberate with the most distinguished learned Brahmana
    among the ministers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The king is told to entrust all business to that official, form his final
    resolution with him, and then begin to act.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The king must appoint other officials described as men of integrity, wisdom,
    firmness, ability to collect money, and proven reliability.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king is instructed to appoint as many skilful, clever, non-slothful persons
    as his business requires.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Brave, skilful, high-born, and honest men are assigned to revenue-related
    offices such as mines, manufactures, and storehouses, while timid men are assigned
    inside the palace.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The ambassador is described as versed in all sciences, able to understand
    hints, facial expressions, and gestures, honest, skilful, noble, loyal, possessed
    of good memory, aware of place and time, handsome, fearless, and eloquent.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The passage states dependencies among royal functions: the army depends on
    its official, control of subjects on the army, treasury and realm on the king,
    and peace or war on the ambassador.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The ambassador alone is said to make allies and separate allies, conducting
    business by which kings are disunited or not.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The ambassador is instructed to investigate the foreign king’s countenance,
    gestures, and actions through the signs and actions of confidential advisers and
    to discover the king’s designs among servants.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After learning the foreign king’s designs from the ambassador, the king is
    instructed to take measures so that he does not bring evil on himself.
  category: sequence
  evidence_refs:
  - ev:5
