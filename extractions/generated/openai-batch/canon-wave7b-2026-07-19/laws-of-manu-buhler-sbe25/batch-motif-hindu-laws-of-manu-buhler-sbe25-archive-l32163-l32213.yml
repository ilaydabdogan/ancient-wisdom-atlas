  summary: The passage lists transmigration consequences for theft and abandonment
    of caste duty. Women who commit theft become female counterparts of previously
    enumerated creatures; men of the four castes who abandon their occupations become
    servants of Dasyus in degraded bodies; fallen members of the four varnas become
    named Pretas with specified impure diets.
