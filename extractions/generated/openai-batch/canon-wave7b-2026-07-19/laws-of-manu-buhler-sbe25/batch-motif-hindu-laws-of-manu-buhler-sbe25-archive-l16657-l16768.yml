canonical_text:
  quote: ''
  summary: The passage gives rules for personal purification involving drops of water,
    touching impurity while carrying an object, bathing, sipping water, clarified
    butter after vomiting or purging, and washing after sexual intercourse. It then
    turns to rules for women’s dependence on father, husband, or sons, domestic duties,
    obedience to a husband, and wedding rites involving benedictory recitations and
    sacrifice to Prajapati.
  language: English
  quote_policy: summarized
