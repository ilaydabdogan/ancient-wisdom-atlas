  quote: ''
  summary: 'The passage lists prescribed methods for purifying various materials and
    places: washing small quantities; cleaning skins, cane objects, plant foods, fabrics,
    shells, horn, bone, and ivory by specified substances; purifying grass, wood,
    straw, a house, earthen vessels, and land by sprinkling, sweeping, smearing, burning,
    scraping, or the presence of cows. It also states that an earthen vessel defiled
    by certain substances cannot be purified by burning again.'
