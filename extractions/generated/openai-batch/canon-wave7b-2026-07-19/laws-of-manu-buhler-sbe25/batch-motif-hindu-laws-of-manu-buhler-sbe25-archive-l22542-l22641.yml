canonical_text:
  quote: ''
  summary: The passage gives rules on theft, confession before the king, implements
    carried by a confessing thief, the removal or transfer of guilt through punishment
    or pardon, afterlife purity for punished criminals, and graded penalties for theft
    of water equipment, grain, weighed valuables, persons, animals, weapons, and medicines.
    Editorial notes cite parallels in nearby Dharma literature.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A thief is instructed to approach the king while running, with flying hair,
    confessing the theft and asking to be punished.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The confessing thief must carry on his shoulder one of several implements:
    a pestle, a Khadira-wood club, a double-pointed spear, or an iron staff.'
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that a thief is freed from the guilt of theft whether punished
    or pardoned, while a king who does not punish takes the thief's guilt upon himself.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists several cases in which guilt is said to fall on another
    person connected by food, marriage, instruction, priestly duty, or royal responsibility.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Men who have committed crimes and have been punished by the king are said
    to go to heaven and to be pure like persons who performed meritorious deeds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Stealing a rope or water-pot from a well, or damaging a hut where water is
    distributed, incurs a fine of one masha and restoration of the article or damaged
    item.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Stealing more than ten kumbhas of grain receives corporal punishment; lesser
    cases receive an elevenfold fine and payment of the owner's property value.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Stealing weighted valuables such as gold, silver, and excellent clothes is
    punished according to quantity, including corporal punishment, cutting off the
    hands, or an elevenfold fine.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Stealing noble persons, especially women, and precious gems deserves corporal
    or capital punishment; theft of large animals, weapons, or medicines is to be
    judged by the king according to time and purpose.
  category: action
  evidence_refs:
  - ev:7
