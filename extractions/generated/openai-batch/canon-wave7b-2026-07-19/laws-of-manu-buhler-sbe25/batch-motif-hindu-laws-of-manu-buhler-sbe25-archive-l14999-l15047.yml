  summary: The passage lists kinds of food or food-givers whose food is not to be
    eaten, including morally or ritually disqualified persons, food that is sour,
    stale, leftover, disrespectfully given, associated with childbirth impurity, or
    touched by sneezing. Notes report variant commentarial explanations for terms
    such as the food of a Sudra, Ugra, and food given by the lord of a town.
  language: English
