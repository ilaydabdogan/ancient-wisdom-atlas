canonical_text:
  quote: ''
  summary: The passage prescribes penances for minor offences, including theft of
    various objects and sexual or social transgressions. It assigns fasts, restricted
    diets, milk subsistence, lunar and Krichhra penances, bathing while clothed, alms,
    sacred-text muttering, confinement, and outcast status according to the offence.
    The notes cite parallel Dharma texts and commentarial qualifications.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Stealing grass, wood, trees, dry food, molasses, clothes, leather, or meat
    is assigned fasting for three days and nights.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Stealing gems, pearls, coral, copper, silver, iron, brass, or stone is assigned
    twelve days of subsistence on uncooked grains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Stealing cotton, silk, wool, hoofed animals, a bird, perfumes, medicinal herbs,
    or a rope is assigned three days of subsistence on milk.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The text states that these penances can remove the guilt of theft for a twice-born
    man and introduces further penances for approaching women who ought not to be
    approached.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Sexual intercourse with specified sisters, a friend's wife, a son's wife,
    unmarried maidens, or females of the lowest castes is assigned the penance prescribed
    for violation of a Guru's bed.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Approaching certain close female relatives is assigned a lunar penance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: The text forbids marriage with the three named female relatives because they
    are Sapinda relatives and states that a man who marries one of them sinks low.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:8
  text: Bestial crime, unnatural crime with a female, intercourse in water, and intercourse
    with a menstruating woman are assigned a Santapana Krichhra penance.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: A twice-born man who commits an unnatural offence with a male, or has intercourse
    in an ox-drawn cart, in water, or in the daytime, is told to bathe while dressed
    in his clothes.
  category: action
  evidence_refs:
  - ev:10
- id: obs:10
  text: A Brahmana who unintentionally approaches a very low-caste woman, eats such
    persons' food, or accepts presents from them becomes an outcast; intentional action
    makes him their equal.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:11
  text: An exceedingly corrupt wife is to be confined by her husband to one apartment
    and compelled to perform the penance prescribed for males in adultery cases.
  category: action
  evidence_refs:
  - ev:13
- id: obs:12
  text: If a wife is again unfaithful after being solicited by a man of equal caste,
    a Krichhra and a lunar penance are prescribed as means of purifying her.
  category: action
  evidence_refs:
  - ev:13
- id: obs:13
  text: The sin from dallying one night with a Vrishali is removed over three years
    by subsisting on alms and daily muttering sacred texts.
  category: action
  evidence_refs:
  - ev:14
- id: obs:14
  text: The passage transitions from atonement for four kinds of sinners to rules
    for those who have intercourse with outcasts; association with an outcast makes
    a person an outcast after a year.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:15
  text: The notes report that some commentators qualify theft penances by intention,
    distress, quantity, frequency, time, place, owner, and other circumstances.
  category: other
  evidence_refs:
  - ev:16
