    sources.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: It says that in times of distress a student may learn the Veda from one who
    is not a Brahmana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The student who learns from such a teacher is instructed to walk behind and
    serve the teacher for as long as the instruction lasts.
  category: relationship
  evidence_refs:
