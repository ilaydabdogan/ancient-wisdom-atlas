canonical_text:
  quote: ''
  summary: 'The passage gives rules for studentship: valuable law, advice, learning,
    purity rules, and arts may be learned from unexpected or socially low sources;
    in distress a student may learn the Veda from a non-Brahmana while serving that
    teacher; a lifelong stay with an unsuitable teacher is discouraged for one seeking
    heavenly bliss; lifelong service to a teacher is associated with reaching the
    eternal mansion of Brahman; and a gift to the teacher is deferred until the Samavartana/final
    bath with the teacher''s permission.'
  language: English
  quote_policy: summarized
