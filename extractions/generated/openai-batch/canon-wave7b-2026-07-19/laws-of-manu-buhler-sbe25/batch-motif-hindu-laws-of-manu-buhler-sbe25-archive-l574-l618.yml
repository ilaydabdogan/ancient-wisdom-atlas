canonical_text:
  quote: '"Manu is said to have revealed or seen" Vedic Mantras; sayings were attributed
    to "the father of mankind."'
  summary: The passage argues that Vedic citations used to support the authenticity
    of the Manu-smriti are weak and may be misquotations. It notes that Vedic passages
    refer primarily to Mantras revealed or seen by Manu, and that sayings attributed
    to Manu, called the father of mankind, may have included legal maxims. It also
    discusses later references to Manu as an authority on sacred law, while cautioning
    that such evidence is limited because of uncertain dating and multiple recensions.
  language: English
  quote_policy: quoted
