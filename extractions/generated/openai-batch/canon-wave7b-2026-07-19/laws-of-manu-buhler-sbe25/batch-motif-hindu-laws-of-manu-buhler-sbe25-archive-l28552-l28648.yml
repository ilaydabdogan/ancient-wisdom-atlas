canonical_text:
  quote: ''
  summary: 'The passage gives rules for conduct in times of distress: permitted modes
    of subsistence, restrictions and exceptions for lending at interest, emergency
    royal taxation, the king’s duty of protection and conquest, tax rates and labor
    obligations, and livelihood options for a Sudra through service to higher castes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ten modes of subsistence are listed as permitted to all men in times of distress.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Brahmana or Kshatriya must not ordinarily lend at interest, but an exception
    is allowed in distress for sacred purposes, involving a very sinful man and small
    interest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Kshatriya king may take even a fourth part of crops in distress and be free
    from guilt if he protects his subjects as well as he can.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king’s peculiar duty is conquest; he must not turn back in danger, and
    after protecting Vaisyas with weapons he may have the legal tax collected.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage gives tax rates on Vaisyas’ grain, gold, and cattle, and says
    Sudras, artisans, and mechanics benefit the king by doing work for him.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: A Sudra unable to subsist by serving Brahmanas may serve Kshatriyas or attend
