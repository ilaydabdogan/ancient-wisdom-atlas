canonical_text:
  quote: ''
  summary: The passage gives prescriptive rules about marriage, caste-specific wedding
    gestures, conjugal timing, conception, bride gratuities, women’s property, and
    the requirement to honour women. It states that blamable marriages produce blamable
    offspring, regulates intercourse by calendrical nights, condemns selling a daughter
    or appropriating women’s property, and links honouring women with divine pleasure,
    ritual efficacy, family prosperity, and protection from curses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that four blamable forms of marriage produce sons described
    as cruel, untruthful, and hostile to the Veda and sacred law; it advises avoiding
    those marriage forms.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: For equal-caste marriages, the ceremony of joining hands is prescribed; for
    a higher-caste groom marrying a lower-caste bride, specific objects or a garment
    hem are held by brides of different castes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Kshatriya bride is instructed to take hold of an arrow, a Vaisya bride of
    a goad, and a Sudra female of the bridegroom’s garment hem.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband is directed to approach his wife in due season and to be satisfied
    with her alone; conjugal union is excluded on Parvan days.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sixteen days and nights are called the natural season of women, but the first
    four, the eleventh, and the thirteenth nights are forbidden; the remaining nights
    are recommended.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says sons are conceived on even nights and daughters on uneven
    nights, and it describes male, female, mixed, weak, or deficient seed as determining
    sex, twins, hermaphroditism, or failed conception.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man who avoids women on the six forbidden nights and eight additional nights
    is described as equal in chastity to a student, regardless of his order of life.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: A father who knows the law is forbidden to take even a small gratuity for
    his daughter; accepting such a fee through avarice is called selling his offspring.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage rejects calling the cow and bull given at an Arsha wedding a gratuity
    if treated as a fee, but permits a non-appropriated gift as a token of respect
    and kindness toward maidens.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Male relations who live on women’s separate property, including beasts of
    burden, carriages, and clothes, are said to commit sin and sink into hell.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Women are to be honoured and adorned by fathers, brothers, husbands, and brothers-in-law
    who desire their own welfare.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Where women are honoured, the gods are pleased; where they are not honoured,
    sacred rites yield no rewards.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Families with grieving female relations are said to perish, while families
    where women are not unhappy prosper.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: Houses cursed by dishonoured female relations are said to perish completely,
    as if destroyed by magic.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Men seeking their own welfare are instructed to honour women on holidays and
    festivals with ornaments, clothes, and dainty food.
  category: action
  evidence_refs:
  - ev:8
