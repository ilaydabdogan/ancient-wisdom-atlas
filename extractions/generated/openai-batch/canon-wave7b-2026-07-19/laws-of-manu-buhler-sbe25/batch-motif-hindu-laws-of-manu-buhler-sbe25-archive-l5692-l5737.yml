  summary: The passage is a scholarly introduction arguing about the dating of the
    Bhrigu Saṃhitā/Manu text. It discusses ethnonyms as textual evidence, possible
    interpolation of the name Pahlavas, agreement with Cowell and Talboys Wheeler,
    and disagreement with Max Müller’s later dating based on zodiacal references in
    Vṛddha/Bṛhat Manu.
