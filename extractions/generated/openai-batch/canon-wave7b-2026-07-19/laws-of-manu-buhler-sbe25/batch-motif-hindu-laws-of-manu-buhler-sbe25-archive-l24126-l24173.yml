canonical_text:
  quote: ''
  summary: 'The passage rejects the appointment and remarriage of widows in marriage
    rules, condemns such appointment as associated with Vena''s rule, describes Vena
    as a lust-destroyed royal sage who caused caste confusion, and gives a rule for
    a betrothed maiden whose future husband dies: her brother-in-law is to wed her,
    and the commentary says any child belongs to the deceased betrothed. Notes compare
    Vena with epic and Puranic tradition and mention other textual references to Niyoga.'
  language: English
  quote_policy: summarized
