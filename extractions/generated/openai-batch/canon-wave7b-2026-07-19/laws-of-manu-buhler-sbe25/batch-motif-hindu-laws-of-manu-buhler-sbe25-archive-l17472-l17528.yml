canonical_text:
  quote: ''
  summary: Verses VI.64-69 instruct an ascetic to contemplate pain, demerit, merit,
    and eternal bliss; to recognize the supreme Soul through meditation; to perform
    duty with equal regard for all creatures rather than relying on external marks;
    to consider an analogy of the Kataka tree fruit clearing water; to walk carefully
    to preserve living creatures; and to expiate unintentional injury by bathing and
    breath suppressions. Notes report commentarial glosses, variant readings, and
    cross-references.
