canonical_text:
  quote: ''
  summary: The passage enumerates duties and occupations for Brahmanas, Kshatriyas,
    and Vaisyas; explains fallback occupations in case of inability to subsist; warns
    Brahmanas and Kshatriyas against agriculture because it injures earth and beings
    in it; and lists commodities that should not be sold even when trade is adopted.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Brahmanas are assigned six acts: teaching, studying, sacrificing for oneself,
    sacrificing for others, making gifts, and receiving gifts.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: For Brahmanas, sacrificing for others, teaching, and accepting gifts from
    pure men are described as means of subsistence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Teaching, sacrificing for others, and accepting gifts are forbidden to Kshatriyas
    and Vaisyas; the passage says Manu Prajapati did not prescribe them for those
    two castes.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kshatriyas are prescribed the carrying of arms as a means of subsistence,
    while Vaisyas are associated with trade, cattle-rearing, and agriculture.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The most commendable occupations are listed as teaching the Veda for a Brahmana,
