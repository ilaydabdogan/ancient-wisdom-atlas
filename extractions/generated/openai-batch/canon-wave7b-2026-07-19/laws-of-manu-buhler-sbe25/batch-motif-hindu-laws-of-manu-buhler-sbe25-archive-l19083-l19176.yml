canonical_text:
  quote: ''
  summary: 'The passage presents a technical doctrine of royal polity: the king is
    to understand the constituent parts of the surrounding circle of states, classify
    neighbouring rulers as hostile, friendly, or neutral, and choose among expedients
    and six measures of policy such as alliance, war, marching, halting, division
    of forces, and seeking protection. It further divides alliance, war, and marching
    into types.'
