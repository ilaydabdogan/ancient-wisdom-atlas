  text: If one among brothers sprung from one father has a son, Manu declares all
    the brothers to have male offspring through that son.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: If one among all the wives of one husband has a son, Manu declares all the
    wives to be mothers of male children through that son.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: When a better-ranked son is absent, the next inferior son is worthy of the
    inheritance; multiple sons of equal rank share the estate.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The rule states that sons, not brothers or fathers, take the paternal estate,
    but the father and then brothers take the inheritance of a son who leaves no male
