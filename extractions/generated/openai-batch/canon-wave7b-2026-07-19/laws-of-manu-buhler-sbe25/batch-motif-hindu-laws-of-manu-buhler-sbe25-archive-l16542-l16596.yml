canonical_text:
  quote: ''
  summary: 'The passage gives rules concerning what is pure or fit for use: certain
    food contexts, the mouth or actions of specific beings, flesh killed by specified
    agents, bodily regions above and below the navel, objects and phenomena pure to
    touch, and cleansing with earth and water. Footnotes cite parallel dharma-text
    passages.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fragment states that food from the market and food obtained by begging that
    a student holds in his hand is always fit for use.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mouth of a woman is said to be always pure; a bird is pure when causing
    a fruit to fall; a calf is pure when milk flows; and a dog is pure when catching
    a deer.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Flesh of an animal killed by dogs is declared pure, as is flesh of a beast
    slain by carnivorous animals or by men described as low caste Dasyu, such as Chandalas.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cavities of the body above the navel are called pure, while those below the
    navel and excretions falling from the body are called impure.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Flies, drops of water, a shadow, a cow, a horse, rays of the sun, dust, earth,
    wind, and fire are listed as pure to the touch.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Earth and water are prescribed for cleansing the organs that eject urine and
    faeces and for removing bodily impurities.
  category: action
  evidence_refs:
  - ev:6
