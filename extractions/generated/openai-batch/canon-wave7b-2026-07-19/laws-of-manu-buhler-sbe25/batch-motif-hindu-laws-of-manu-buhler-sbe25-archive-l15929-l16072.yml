canonical_text:
  quote: ''
  summary: The passage gives rules for ritual impurity and purification after deaths
    and births, with different durations and rites according to the deceased person's
    age, kinship relation, distance, social status, and association with teachers,
    rulers, or sacred-fire rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: For children who die before tonsure, Sapinda relatives become pure in one
    day and night; for children who received tonsure but not initiation, purification
    takes place after three days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A child dying before completion of the second year is to be carried out of
    the village by relatives, decked with flowers, buried in pure ground, and not
    have its bones collected afterward.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Such a child is not to be burnt with fire and is not to receive water libations;
    the relatives remain impure for three days only.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Relatives do not offer libations to a child under the third year, but water
    offering is optional if the child had teeth or had undergone the naming ceremony.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: A fellow-student's death brings one day of impurity; a birth among Samanodakas
    is purified after three days and nights.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: For a betrothed but unmarried female who dies, the bridegroom's relatives
    and paternal relatives are purified after three days.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Mourners are instructed to eat food without factitious salt, bathe for three
    days, abstain from meat, and sleep separately on the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: When a person hears before ten days have passed that a distant relative has
    died, impurity lasts for the remainder of the ten-day period.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: If ten days have passed after a distant death, impurity lasts three days and
    nights; if a year has elapsed, purification occurs by bathing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: Hearing after ten days of a Sapinda relative's death or a son's birth leads
    to purification by bathing while dressed in garments.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: If an unbearded or non-teethed infant, or a non-Sapinda grown relative, dies
    in a distant country, purification occurs at once after bathing in one's clothes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:12
  text: If another birth or death occurs within a ten-day impurity period, a Brahmana
    remains impure only until the first ten-day period ends.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:13
  text: A teacher's death brings three days of impurity; the death of the teacher's
    son or wife brings a day and a night.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:14
  text: The passage assigns impurity periods for a resident Srotriya, maternal uncle,
    pupil, officiating priest, maternal relative, king, intimate friend, and Guru.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:15
  text: Purification periods by social class are ten days for a Brahmana, twelve for
    a Kshatriya, fifteen for a Vaisya, and a month for a Sudra.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:16
  text: The passage says not to lengthen impurity unnecessarily or interrupt rites
    performed with sacred fires, and states that an Agnihotra performer will not be
    impure even if a Sapinda relative.
  category: action
  evidence_refs:
  - ev:5
