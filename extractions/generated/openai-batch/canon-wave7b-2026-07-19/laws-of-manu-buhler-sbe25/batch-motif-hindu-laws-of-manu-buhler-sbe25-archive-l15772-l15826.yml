canonical_text:
  quote: ''
  summary: The passage states that complete abstention from meat earns the same reward
    as annually offering a horse-sacrifice for a hundred years, and that avoiding
    flesh surpasses forest ascetic foods in merit. It explains the word for flesh
    through reciprocal future devouring in the next world. It says meat, liquor, and
    intercourse are not sinful when permitted, but abstention brings great rewards.
    It then introduces rules for purification after death and for things, and states
    that relatives become impure when certain children die, with the same rule prescribed
    at birth.
  language: English
  quote_policy: summarized
