canonical_text:
  quote: ''
  summary: The passage first states that an initial triliteral Brahman, identified
    as another secret triple Veda, marks one as learned when known. Chapter XII then
    opens with sages asking Bhrigu to explain the ultimate retribution for deeds.
    Bhrigu teaches that actions arise from mind, speech, and body; produce good or
    evil results; lead to higher, middling, or lower conditions; and are classified
    into mental, verbal, and bodily wrongs. The passage states that the result of
    each kind of action is experienced in the corresponding faculty, and that many
    bodily sins lead to an inanimate next birth.
  language: English
  quote_policy: summarized
