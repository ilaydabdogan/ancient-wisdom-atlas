  quote: '"shakes off sin here below and reaches the highest Brahman"'
  summary: The passage states that a twice-born man who becomes an ascetic after prescribed
    acts removes sin and reaches the highest Brahman. It then explains the law for
    self-restrained ascetics, names four orders—student, householder, hermit, and
    ascetic—and says that these orders, properly assumed, lead a Brahmana to the highest
    state. Notes discuss interpretive views about Brahmanas who give up Vedic rites
    and give cross-references to related Dharma texts.
