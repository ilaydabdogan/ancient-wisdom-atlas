  quote: ''
  summary: The introduction discusses whether the Mahabharata knew the Manava Dharma-sutra
    or a later metrical Manu text. It argues that the epic’s handling of civil and
    criminal law resembles Dharma-sutra arrangement rather than later Smriti legal
    titles, while also noting that the Mahabharata shares with later law-books a view
    that sacred moral and legal doctrine was revealed by Brahman to mythical rishis
    and then to mankind.
