canonical_text:
  quote: "“If a younger brother begets a son on the wife of the elder, the division
    must then be made equally.”"
  summary: The passage gives inheritance rules concerning indivisible animals, a son
    begotten by a younger brother on an elder brother's wife, the limited rights of
    a representative son, commentarial provisions for sisters' shares, and a stated
    doubt about seniority when sons are born from wives of different marital priority.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A single goat, sheep, or beast with uncloven hoofs is not to have its value
    divided; a single goat or sheep remaining after equal division belongs to the
    eldest alone.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note explains that such an animal is not to be sold so that proceeds can
    be divided, and its value is not to be offset by giving other objects to the other
    brothers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If a younger brother begets a son on the wife of the elder brother, the inheritance
    division is to be made equally.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note to verse 120 says that the Kshetraja receives no preferential share,
    and reports an inference that grandsons inherit like sons and with sons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The representative son begotten on the wife is not invested with the principal
    elder brother's right to an additional share; a share is assigned according to
    the previously stated rule.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The commentarial note on verse 121 records variant explanations using the
    contrast between principal and substitute or subsidiary son, and treats the father
    or begetter as principal in procreation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage poses a doubt about inheritance division when a younger son is
