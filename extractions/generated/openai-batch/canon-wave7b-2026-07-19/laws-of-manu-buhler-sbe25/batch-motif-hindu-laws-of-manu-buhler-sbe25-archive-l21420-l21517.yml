canonical_text:
  quote: ''
  summary: 'The passage gives legal rules concerning deposits: when deposits may be
    returned, treatment of open and sealed deposits, liability when deposits are stolen
    or destroyed by water or fire, procedures for trying alleged misappropriators
    and false claimants by legal means and Vedic oaths, and punishments or fines imposed
    by the king or judge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If the gold mentioned in the preceding rule is not restored to the persons
    identified as spies, the person in possession is to be compelled by force to restore
    both deposits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: An open or sealed deposit is not to be returned to a near relative of the
    depositor during the depositor's lifetime.
  category: action
  evidence_refs:
  - ev:2
  - ev:6
- id: obs:3
  text: A depositary who voluntarily returns deposits to a near relative of a deceased
    depositor is not to be harassed by the king or by the depositor's relatives.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In doubtful cases, the object is to be obtained or the matter settled by friendly
    and gentle means rather than by artifice.
  category: action
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:5
  text: For open deposits, the passage states a general rule of recovery; for sealed
    deposits, the depositary incurs no censure unless something has been taken out.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A bailee is not required to make good a deposit stolen by thieves, washed
    away by water, or burned by fire, unless the bailee took part of it for himself.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A person who appropriates a deposit and a person who asks for a deposit without
    having made one are to be tried by all means and by Vedic oaths.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A person who does not return a deposit and a person who demands what was never
    bailed are both to be punished like thieves or made to pay a fine equal to the
    value of the object.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The king is instructed to compel a non-restorer of an open deposit and a retainer
    of a sealed deposit to pay a fine equal to its value.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A person who obtains another's property by false pretences is to be publicly
    punished by various corporal or capital punishments along with accomplices.
  category: action
  evidence_refs:
  - ev:5
