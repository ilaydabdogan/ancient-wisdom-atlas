canonical_text:
  quote: ''
  summary: 'Verses V.93-106 prescribe rules about ritual impurity and purification:
    exemptions for kings and vow or Sattra performers, the king’s relation to world-guardian
    deities, purification after battle death, caste-specific purification by contact
    with objects, rules for carrying or following a corpse, listed purifying agents,
    and the superiority of purity in acquiring wealth.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that impurity does not fall on kings or on those performing
    a vow or Sattra; kings are associated with Indra’s throne, while the latter are
    described as pure like Brahman.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage prescribes immediate purification for a king because he is seated
    for the protection of his subjects.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The king is described as an incarnation of eight guardian deities of the
    world: the Moon, Fire, Sun, Wind, Indra, Kubera, Varuna, and Yama.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says no impurity is ordained for the king because he is pervaded
    by the lords of the world, who cause and remove purity and impurity among mortals.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person slain in battle with brandished weapons according to Kshatriya law
    is said to complete a Śrauta sacrifice instantly, and the impurity period caused
    by his death is also completed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'Different caste groups are purified by touching different things: a Brahmana
    by water, a Kshatriya by his mount and weapons, a Vaisya by a goad or ox nose-string,
    and a Sudra by a staff.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Brahmana who carries out a dead non-Sapinda Brahmana or a near maternal
    relative becomes pure after three days; eating the mourners’ food extends purification
    to ten days, while avoiding their food and house purifies in one day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: One who voluntarily follows a corpse becomes pure by bathing while clothed,
    touching fire, and eating clarified butter.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The passage forbids allowing a dead Brahmana to be carried by a Sudra when
    men of the same caste are available, saying a burnt-offering defiled by Sudra
    touch harms the deceased’s passage to heaven.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage lists knowledge, austerities, fire, holy food, earth, restraint
    of the internal organ, water, smearing with cowdung, wind, sacred rites, the sun,
    and time as purifiers of embodied beings.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage declares purity in the acquisition of wealth to be the best form
    of purification, contrasting clean-handed acquisition with purification by earth
    and water.
  category: speech
  evidence_refs:
  - ev:11
