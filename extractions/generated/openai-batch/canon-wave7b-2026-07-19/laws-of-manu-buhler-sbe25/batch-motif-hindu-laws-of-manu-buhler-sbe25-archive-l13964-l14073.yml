    river, Asipatravana, and Lohadaraka.
  category: setting
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:7
  text: Learned Brahmanas who know this, study the Veda, and desire bliss after death
    do not accept presents from a king.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: The rule subject is instructed to wake in the muhurta sacred to Brahman and
