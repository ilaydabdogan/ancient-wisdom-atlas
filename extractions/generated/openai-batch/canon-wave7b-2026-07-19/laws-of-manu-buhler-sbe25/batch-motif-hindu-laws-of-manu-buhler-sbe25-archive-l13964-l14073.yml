canonical_text:
  quote: '"will go in succession to the following twenty-one hells"'
  summary: 'The passage gives rules for a householder or snataka: bodily restraint
    after bathing, avoidance of gifts from certain kings and professions, a graded
    condemnation of kings and harmful trades, a warning that accepting gifts from
    an avaricious unlawful king leads through twenty-one named hells, and instructions
    for dawn and twilight Vedic devotions that are said to bring long life, wisdom,
    honour, fame, and Vedic excellence.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The rule subject is told not to seize hair in anger or strike the head, and
    after bathing with the head submerged not to touch the limbs with oil.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rule subject is told not to accept presents from a king not descended
    from the Kshatriya race, from butchers, oil-manufacturers, publicans, or persons
    living on the gain of prostitutes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage gives a graded comparison in which an oil-press is equated with
    ten slaughterhouses, a tavern with ten oil-presses, a brothel with ten taverns,
    and a king with ten brothels.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A king is declared equal in wickedness to a butcher keeping a hundred thousand
    slaughterhouses, and accepting presents from him is called a terrible crime.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person who accepts presents from an avaricious king acting contrary to the
    Institutes of sacred law is said to go successively to twenty-one hells.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
