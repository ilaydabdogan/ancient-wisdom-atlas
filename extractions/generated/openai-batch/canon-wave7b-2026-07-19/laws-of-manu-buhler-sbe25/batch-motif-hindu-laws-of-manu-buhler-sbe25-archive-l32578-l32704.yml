  quote: ''
  summary: The passage praises knowledge of the Veda-science, ranks learners from
    ignorant persons to those who follow the teaching, describes austerity and sacred
    learning as means to supreme bliss and release from births and deaths, and explains
    how doubtful points of sacred law are to be resolved through evidence, reasoning,
    revealed texts, and the teaching of learned Shishta Brahmanas.
  language: English
  quote_policy: summarized
