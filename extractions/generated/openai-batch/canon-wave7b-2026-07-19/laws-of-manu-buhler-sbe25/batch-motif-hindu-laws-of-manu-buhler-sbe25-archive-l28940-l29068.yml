literal_observations:
- id: obs:1
  text: A king is instructed to protect a person in every way and receives one sixth
    of that protected person's spiritual merit.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Brahmana is forbidden to beg property from a Sudra for a sacrifice; a sacrificer
    who does so is said to be born after death as a Kandala.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Brahmana who begs property for a sacrifice but does not use the whole of
    it for that purpose becomes, for a hundred years, a Bhasa vulture or a crow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: A covetous person who seizes the property of gods or Brahmanas feeds in another
    world on the leavings of vultures.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: If prescribed animal and Soma sacrifices cannot be performed, a yearly Vaisvanari
    Ishti is to be offered as a penance for the omission.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A twice-born person who is not in distress but follows duties meant for times
    of distress obtains no reward in the next world.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Visve-devas, Sadhyas, and great Brahmana sages made a substitute for the
