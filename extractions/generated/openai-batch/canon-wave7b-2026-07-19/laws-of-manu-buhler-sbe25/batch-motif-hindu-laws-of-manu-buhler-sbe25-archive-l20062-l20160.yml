canonical_text:
  quote: ''
  summary: 'The passage gives legal instructions for royal judicial procedure: the
    king is to infer the rightful side of a dispute like a hunter tracking a wounded
    deer by blood drops, attend to truth and contextual factors, establish law from
    virtuous practice when not opposed to local and caste customs, and enforce rules
    governing creditor recovery from debtors, including proof of debt, self-help,
    and customary coercive procedures.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king is instructed to discover the side on which right lies by inference
    from the facts, compared to a hunter tracing a wounded deer's lair by drops of
    blood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In judicial proceedings the king must attend to truth, the object of the dispute,
    himself, witnesses, place, time, and aspect.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king is to establish as law what virtuous twice-born men devoted to the
    law have practised, provided it is not opposed to the customs of countries, families,
    and castes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When a creditor sues before the king, the king is to make the debtor pay the
    sum that the creditor proves to be due.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A creditor may recover lent property by moral suasion, suit of law, artful
    management, customary proceeding, and force.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A creditor who recovers his own property from a debtor is not to be blamed
    by the king for retaking what is his own.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The commentary note describes interpretations of the customary proceeding
    as sitting at the debtor's door after harming dependents or cattle, fasting, or
    starving oneself to death; it links this custom with prayopavesana, Dharwa, and
    Traga.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a debtor denies a debt that is proved by good evidence, the king is to
    order payment; a note adds that self-help must not be used in that case.
  category: action
  evidence_refs:
  - ev:6
