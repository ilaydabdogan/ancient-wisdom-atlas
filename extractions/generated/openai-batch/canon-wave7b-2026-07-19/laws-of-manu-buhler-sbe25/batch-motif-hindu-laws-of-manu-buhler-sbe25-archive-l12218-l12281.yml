canonical_text:
  quote: ''
  summary: Rules concerning Sraddha gifts and meals state that certain attendees or
    recipients reduce, nullify, or corrupt the donor's reward. Disabled or diseased
    persons cause quantified losses; a guest who sacrifices for Sudras causes loss
    by touch; a learned Brahmana who covetously accepts a gift from such a man perishes
    like an unburnt clay vessel in water. Food or gifts to listed recipients become
    impure substances, are lost, find no place among the gods, or resemble an oblation
    thrown into ashes. Notes report commentarial explanations involving past-life
    sins, future rebirth as animals or worms, and rejection by manes and gods.
  language: English
  quote_policy: summarized
