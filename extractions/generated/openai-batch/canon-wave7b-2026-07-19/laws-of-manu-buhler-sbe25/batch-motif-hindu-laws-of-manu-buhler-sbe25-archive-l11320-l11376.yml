canonical_text:
  quote: ''
  summary: 'The passage prescribes daily householder Bali offerings after sacrificial
    food has been offered: food is distributed to deities, attendant beings, natural
    recipients, household deities, goblins of day and night, Sarvatmabhuti, and the
    manes, with locations assigned by compass direction and domestic space.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each offering is to be presented with a mantra consisting of the deity name
    in the dative case and the word svaha.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After offering sacrificial food, the householder is instructed to throw Bali
    offerings in all compass directions, proceeding from the east to the south, for
    Indra, Yama, Varuna, Soma, and their servants.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Food is to be scattered near the door for the Maruts, placed in water for
    the waters, and put on the pestle and mortar for the trees.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Offerings are assigned to domestic locations: near the head of the bed for
    Sri, near the foot of the bed for Bhadrakali, and in the center of the house for
    Brahman and Vastoshpati together.'
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Bali is thrown upward into the air for all gods, with separate day-time
    and evening offerings for goblins roaming by day and walking at night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: An offering is made in the upper story to Sarvatmabhuti, and the remains from
    the offerings are thrown southward for the manes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A note reports commentarial explanations that the bed-head and bed-foot locations
    correspond to parts of the house where the head and feet of the Vastu-purusha,
    called the Lar, are situated.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: An editorial note cites Apastamba, Gautama, and Vishnu passages as parallels
    for Manu 3.87-92.
  category: other
  evidence_refs:
  - ev:8
