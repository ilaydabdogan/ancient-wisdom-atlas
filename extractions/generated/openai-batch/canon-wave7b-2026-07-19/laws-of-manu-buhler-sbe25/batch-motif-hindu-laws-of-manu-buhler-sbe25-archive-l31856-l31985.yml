canonical_text:
  quote: ''
  summary: 'The passage classifies transmigration according to the three qualities:
    Goodness, Activity, and Darkness. Each quality leads to a general state and has
    low, middling, and high subdivisions, with examples of beings or conditions assigned
    to each rank. The passage concludes that this three-by-three system includes all
    created beings.'
  language: English
  quote_policy: summarized
