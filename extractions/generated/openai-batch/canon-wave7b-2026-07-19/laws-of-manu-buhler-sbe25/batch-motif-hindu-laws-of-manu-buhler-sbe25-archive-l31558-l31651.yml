canonical_text:
  quote: ''
  summary: The passage describes innumerable forms going forth from a body and impelling
    creatures to action. It then describes wicked men receiving, after death, a strong
    body made from particles of the five elements in order to undergo hell torments
    imposed by Yama. After the torments, the body's constituent parts return to the
    elements. Verse 18 adds that, after suffering for faults caused by attachment
    to sensual objects, the soul approaches the two mighty ones free from stains.
    The translator's notes record several commentarial interpretations of these verses.
  language: English
  quote_policy: summarized
