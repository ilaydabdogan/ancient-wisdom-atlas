canonical_text:
  quote: ''
  summary: The passage gives rules for completing Vedic studentship, entering the
    householder order, receiving honor after study, performing the Samavartana return-home
    rite, and choosing or avoiding potential wives and marriage-alliance families
    by caste, kinship, family practice, bodily traits, disease, and names. It also
    includes editor notes citing parallel Dharma texts and explaining some terms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A student is instructed to keep the vow of studying the three Vedas under
    a teacher for specified periods or until the Vedas are perfectly learned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A student who has studied three, two, or one Veda in due order without breaking
    studentship rules is to enter the householder order.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A dutiful student who has received the Veda as his heritage from his father
    is to be honored while seated on a couch and adorned with a garland, with a cow
    and honey-mixture as a present.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before marriage, the twice-born man is to bathe, obtain the teacher's permission,
    and perform the Samavartana rite on returning home.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The twice-born man is to marry an equal-caste wife who has auspicious bodily
    marks.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The recommended bride is neither a Sapinda on the mother's side nor of the
    same family on the father's side.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In seeking a wife, the man is told to avoid ten kinds of families even if
    they are great or wealthy in cattle, horses, sheep, grain, or other property.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Avoided families include those neglecting sacred rites, lacking male children,
    not studying the Veda, having thick body hair, or being subject to specified diseases.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The man is told not to marry a maiden with specified bodily traits such as
    reddish hair, a redundant member, sickness, too little or too much body hair,
    garrulousness, or red eyes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The man is told not to marry a maiden named after a constellation, tree, river,
    low caste, mountain, bird, snake, slave, or with a name that inspires terror.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The editor's note says that the father who transmits the Veda may be understood
    as the biological father, while the teacher is also considered the pupil's spiritual
    father.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The editor's note identifies the three Vedas in this rule as the Rig-veda,
    Yajur-veda, and Sama-veda, and notes that the Atharva-veda is omitted here.
  category: other
  evidence_refs:
  - ev:8
