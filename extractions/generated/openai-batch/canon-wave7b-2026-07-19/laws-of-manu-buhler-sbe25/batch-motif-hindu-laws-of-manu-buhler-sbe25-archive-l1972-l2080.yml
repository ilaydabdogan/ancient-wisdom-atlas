  summary: The passage argues that the Manava Dharmasastra was based on a Manava Dharma-sutra
    connected with the Maitrayaniya-Manava school and was later treated as a law-book
    for all Aryans. It explains this shift through the rise of specialized law and
    science schools, the growing difficulty of mastering Vedic texts and auxiliary
    sciences, and the resulting division between verbal preservation and specialized
    scholarly understanding.
