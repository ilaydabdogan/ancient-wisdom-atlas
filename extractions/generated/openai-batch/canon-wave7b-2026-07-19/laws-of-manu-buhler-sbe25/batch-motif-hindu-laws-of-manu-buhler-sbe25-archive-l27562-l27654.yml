  quote: ''
  summary: The passage enumerates groups said to be born from a Vratya of the Vaisya
    caste, states that adultery across castes, prohibited marriages, and neglect of
    prescribed duties produce sons associated with caste confusion, and announces
    an enumeration of mixed-origin sons from Anulomas and Pratilomas. It names six
    Pratiloma groups and describes rules for their offspring with women of their own,
    mothers', and higher castes, then extends the discussion to excluded races and
    offspring.
  language: English
