canonical_text:
  quote: ''
  summary: The passage classifies tribes and mixed-caste groups, assigns occupations
    to named groups, prescribes segregated dwelling places and restrictions for certain
    groups, assigns corpse-removal and execution duties under royal order, states
    that conduct reveals impure origin, and warns that a kingdom where caste-mixing
    offspring are born perishes quickly.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tribes excluded from those born from the mouth, arms, thighs, and feet of
    Brahman are called Dasyus, regardless of whether they speak the language of Mlecchas
    or Aryans.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Base-born offspring of Aryans or offspring produced through violation of law
    are directed to subsist by occupations reprehended by the twice-born.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Named groups are assigned specific occupations including managing horses and
    chariots, healing, service of women, trade, fishing, carpentry, slaughter of wild
    animals, catching and killing animals living in holes, leather work, and drum
    playing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage directs certain tribes to dwell near well-known trees and burial-grounds,
    on mountains, and in groves, while being known by marks and by their peculiar
    occupations.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The dwellings of the groups named in verse 51 are to be outside the village,
    and their wealth is stated to be dogs and donkeys.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The same groups are assigned garments of the dead, food from broken dishes,
    black iron ornaments, and wandering from place to place.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A man fulfilling a religious duty is told not to seek intercourse with these
    groups; their transactions and marriages are restricted to themselves and their
    equals.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Their food is to be given by others in a broken dish, and they are forbidden
    to walk about in villages and towns at night.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: By day they may go about for work, distinguished by marks at the king's command,
    and they are to carry out corpses of persons who have no relatives.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: By the king's order they are to execute criminals according to law and take
    the criminals' clothes, beds, and ornaments for themselves.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A man of impure origin whose status is not known and who has the appearance
    of an Aryan may be discovered by his acts.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: Behavior described as unworthy of an Aryan, harshness, cruelty, and neglect
    of prescribed duties are said to betray a man of impure origin.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: A base-born man is said to resemble his father, mother, or both in character
    and to be unable to conceal his real nature.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: A kingdom in which such offspring are born is said to perish quickly together
    with its inhabitants.
  category: sequence
  evidence_refs:
  - ev:8
