canonical_text:
  quote: ''
  summary: The passage enumerates classes of beings and phenomena in creation, states
    that creation was produced by high-minded beings through austerities and command
    according to actions, classifies creatures by modes of birth, describes plant
    propagation and plant consciousness, places beings within a cycle of births and
    deaths, and describes cosmic activity and dissolution as corresponding to the
    waking, sleeping, and self-absorption of an incomprehensible divine being.
  language: English
  quote_policy: summarized
