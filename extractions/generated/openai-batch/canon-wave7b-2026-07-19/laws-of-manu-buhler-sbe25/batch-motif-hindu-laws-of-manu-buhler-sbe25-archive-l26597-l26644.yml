  quote: ''
  summary: The passage instructs the king to regard improper high officials, physicians,
    performers or artists, clever harlots, and disguised persons as harmful to the
    people. It directs him to detect such persons through trustworthy undercover agents
    and spies in disguise, to have them instigated to offences, and to bring them
    under his power.
