  summary: The passage asserts that doctrines not based on the Veda are false and
    without after-death reward; that social orders, worlds, time, and sensory qualities
    are known through the Veda; and that the eternal lore of the Veda upholds created
    beings and is therefore supreme. The accompanying notes discuss variant readings
    and commentator interpretations, especially on whether sensory objects are known
    or produced through the Veda and Vedic rites.
