  quote: ''
  summary: The passage uses agricultural seed-and-field examples to state that seed
    produces according to its own kind, warns a learned man not to cohabit with another's
    wife, cites Vayu-attributed stanzas and an arrow/deer analogy about seed sown
    on another's property, calls Earth the primeval womb and wife of Prithu, states
    first-claim rules for fields and deer, and gives legal maxims about husband-wife
    unity, the non-release of a wife, and one-time legal acts.
  language: English
  quote_policy: summarized
