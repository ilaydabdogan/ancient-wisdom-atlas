  summary: The passage gives inheritance rules concerning the son of an appointed
    daughter, an adopted son, sons born to appointed or non-appointed women, a legally
    begotten son on an appointed female, and a son raised for a deceased brother.
    It links funeral cakes and offerings with family name and estate, and uses a seed-produce-soil
    analogy to explain legal inheritance.
