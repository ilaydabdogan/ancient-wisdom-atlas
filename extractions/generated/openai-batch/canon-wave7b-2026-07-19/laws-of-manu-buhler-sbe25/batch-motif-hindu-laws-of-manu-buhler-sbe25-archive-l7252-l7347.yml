canonical_text:
  quote: ''
  summary: In a creation passage, the world is said to spring from minute particles
    of seven powerful Purushas, as the perishable from the imperishable. Elements
    acquire qualities in sequence. The Lord assigns names, actions, and conditions
    to beings according to the Veda; creates gods, Sadhyas, and the eternal sacrifice;
    draws forth the threefold Veda from fire, wind, and the sun for sacrifice; and
    produces time, celestial divisions, waters, mountains, terrain, austerity, speech,
    pleasure, desire, anger, and the whole creation.
  language: English
  quote_policy: summarized
