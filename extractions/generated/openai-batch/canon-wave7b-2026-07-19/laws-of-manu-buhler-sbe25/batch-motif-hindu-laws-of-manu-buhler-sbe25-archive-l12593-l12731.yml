canonical_text:
  quote: A tear sends the (food) to the Pretas, anger to his enemies, a falsehood
    to the dogs
  summary: 'The passage gives detailed rules for a funeral sacrifice in honor of the
    manes: handling water and cakes, feeding Brahmana guests, naming or substituting
    ancestors according to family circumstances, presenting food with ritual care,
    avoiding emotional or physical faults that divert the offering, and using sacred
    recitation and hospitality to please the guests and the manes.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A sacrificer who knows the sacred texts is instructed to worship the guardian
    deities of the six seasons and the manes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The remaining water is to be poured near the cakes, and the cakes are to be
    smelled with attention in the order in which they were placed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Very small portions are to be taken successively from the cakes and given
    to seated Brahmanas to eat before their dinner.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The rules change according to whether the sacrificer's father or grandfather
    is living, including offering to remoter ancestors, feeding the father as a Brahmana
    guest, or naming the father and great-grandfather.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Water mixed with sesamum and containing a blade of Kusa grass is poured into
    the guests' hands before a portion of cake is given with the utterance addressed
    by Svadha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sacrificer carries a vessel filled with food in both hands and places
    it before the Brahmanas while meditating on the manes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Food brought without being held in both hands is said to be forcibly snatched
    away by malevolent Asuras.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Seasonings, broths, pot herbs, sweet and sour milk, honey, hard and soft foods,
    roots, fruits, meat, and fragrant drinks are placed and presented to the guests.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The sacrificer is told not to shed a tear, become angry, speak untruth, touch
    the food with his foot, or violently shake it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Specific faults redirect the food: a tear to the Pretas, anger to enemies,
    falsehood to dogs, foot-contact to Rakshasas, and shaking to sinners.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The sacrificer is to give Brahmanas what pleases them and provide Vedic riddles
    because these are agreeable to the manes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: At the rite for the manes, the guests are to hear the Veda, sacred law, legends,
    tales, Puranas, and Khilas.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The sacrificer is to delight the Brahmanas, invite them repeatedly to eat,
    entertain a daughter's son at the funeral sacrifice, place a Nepal blanket on
    the seat of each guest, and scatter sesamum on the ground.
  category: action
  evidence_refs:
  - ev:9
