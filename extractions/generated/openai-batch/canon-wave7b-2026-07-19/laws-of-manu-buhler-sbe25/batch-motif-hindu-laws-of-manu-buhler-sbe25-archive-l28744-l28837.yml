canonical_text:
  quote: ''
  summary: The passage gives rules about gifts, alms, sacrifice, household obligations,
    and ritual eligibility. It prescribes gifts to poor snatakas, twice-born mendicants,
    and Veda-learned Brahmanas; discusses a king’s gifts for sacrifices; rejects alms
    for a second marriage; links giving to heavenly bliss after death; sets property
    requirements for drinking Soma; and warns that generosity to strangers while neglecting
    dependants brings evil results in life and after death.
  language: English
  quote_policy: summarized
