canonical_text:
  quote: ''
  summary: The passage presents a scholarly argument about the historical relationship
    between Dharma-sutras, metrical Smritis, and the Manava Dharmasastra. It reports
    a Mimamsa tradition that each Vedic school had its own Dharma work, argues that
    metrical Smritis are later than Dharma-sutras, and describes Max Müller's hypothesis
    that the Manava Dharmasastra was a versified recast of a Manava Dharma-sutra.
    The passage also lists weaknesses in the hypothesis and notes its favorable reception
    among historical Sanskritists.
  language: English
  quote_policy: summarized
