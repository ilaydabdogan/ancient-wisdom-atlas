  summary: The passage discusses differences between two creation accounts in Manu
    I, argues that the first chapter may be a compilation from older memorial verses,
    and summarizes a Narada-smriti claim that Manu's very large Dharmaśāstra was successively
    reduced by Narada, Marka/zafeya, and Sumati. The author warns that this account
    contains obvious exaggerations and that one testable historical assertion is not
    true.
