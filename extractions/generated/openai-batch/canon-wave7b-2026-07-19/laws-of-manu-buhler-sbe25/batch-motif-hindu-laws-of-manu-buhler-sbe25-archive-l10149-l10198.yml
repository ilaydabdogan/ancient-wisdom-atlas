canonical_text:
  quote: ''
  summary: The passage gives rules for a student’s conduct toward persons connected
    with his teacher. It says that betters, certain sons of the teacher, and the teacher’s
    paternal and maternal relatives are to be treated as the teacher is treated. A
    teacher’s son who gives instruction in his father’s stead deserves the same honour
    as the teacher. The student is forbidden to perform several intimate or service
    acts for the teacher’s son, including shampooing limbs, assisting in bathing,
    eating food fragments, and washing feet. The excerpt begins a further rule that
    same-caste wives of the teacher must be treated respectfully, but the sentence
    is incomplete in the supplied range.
  language: English
