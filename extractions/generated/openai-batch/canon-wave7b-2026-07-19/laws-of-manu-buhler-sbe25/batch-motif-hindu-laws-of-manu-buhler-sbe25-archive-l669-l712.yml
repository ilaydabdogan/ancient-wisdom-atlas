canonical_text:
  quote: ''
  summary: A scholarly introduction argues that Indian commentators' explanations
    of the origin and history of the Manu-smriti are not adequate for critical study,
    then summarizes Max Müller's view that the Manu-smriti is based on or recasts
    an ancient Dharma-sutra. The passage describes ancient Sutra schools as centers
    for the systematic cultivation of Brahmanical sacred sciences, including sacred
    law, and notes that law Sutras cover the same range of topics as metrical Smritis
    attributed to Manu, Yajnavalkya, and other sages.
  language: English
