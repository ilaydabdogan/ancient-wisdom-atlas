canonical_text:
  quote: ''
  summary: The passage gives rules for selecting a wife, warns against certain kinship
    and caste situations, states consequences for twice-born men who marry Sudra women,
    and introduces eight named marriage rites with caste-specific legality and effects
    in this life and after death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prospective wife is described as desirable if she is free from bodily defects
    and has an agreeable name, graceful gait, moderate body and head hair, small teeth,
    and soft limbs.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A prudent man is told not to marry a maiden with no brother or a maiden whose
    father is not known, because of concerns about an appointed daughter or sin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: For the first marriage of twice-born men, wives of equal caste are recommended;
    later marriages are described as following the direct order of castes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The passage lists caste-specific wife eligibility: a Sudra woman for a Sudra
    man; Sudra and own-caste wives for a Vaisya; those two plus own-caste wife for
    a Kshatriya; those three plus own-caste wife for a Brahmana.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A Sudra woman is said not to be mentioned in any ancient story as the first
    wife of a Brahmana or Kshatriya, even in extreme distress.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Twice-born men who marry wives of the low Sudra caste are said to degrade
    their families and children to the state of Sudras.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Named authorities are cited for different rules about when a man who weds
    a Sudra woman becomes an outcast or loses status through offspring.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: A Brahmana who takes a Sudra wife to his bed is said to sink into hell after
    death, and if he begets a child by her, to lose the rank of a Brahmana.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The manes and gods are said not to eat offerings from a man who performs rites
    chiefly with a Sudra wife's assistance; he is said not to go to heaven, and no
    expiation is prescribed for specified contact and begetting.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Eight marriage rites are named and then assigned lawful use by caste, with
    virtues, faults, and effects on offspring to be declared.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
