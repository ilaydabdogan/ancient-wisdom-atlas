canonical_text:
  quote: ''
  summary: The passage praises the Brahmana within a hierarchy of beings, describes
    Brahmana birth as an embodiment of sacred law, attributes lordship, legal authority,
    and ritual centrality to the Brahmana, names Manu sprung from the Self-existent
    as composer of the Institutes, prescribes Brahmana study and teaching of the text,
    states the benefits of study and conduct, and begins a contents list including
    creation, sacraments, marriage rites, great sacrifices, and funeral sacrifices.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Verse 95 describes a figure through whose mouth the gods consume sacrificial
    viands and the manes consume offerings to the dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage ranks created beings in a sequence: animated beings, intelligent
    beings, mankind, Brahmanas, learned Brahmanas, those who know and perform duties,
    and those who know Brahman.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The birth of a Brahmana is described as an eternal incarnation of sacred law;
    he is born to fulfill sacred law and becomes one with Brahman.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Brahmana coming into existence is described as highest on earth, lord of
    all created beings, and protector of the treasury of the law.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The world is described as the property of the Brahmana, and other mortals
    are said to subsist through the Brahmana's benevolence.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wise Manu, sprung from the Self-existent, is said to have composed the Institutes
    in order to settle the duties of the Brahmana and the other castes in order.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A learned Brahmana is directed to study the Institutes carefully and to instruct
    his pupils in them, while nobody else is to teach them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: A Brahmana who studies the Institutes and fulfills the prescribed duties is
    said never to be tainted by sins from thoughts, words, or deeds.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Such a Brahmana is said to sanctify any company he enters, seven ancestors,
    and seven descendants, and he alone is said to deserve the whole earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Study of the work is said to secure welfare, increase understanding, procure
    fame and long life, and lead to supreme bliss.
  category: attribute
