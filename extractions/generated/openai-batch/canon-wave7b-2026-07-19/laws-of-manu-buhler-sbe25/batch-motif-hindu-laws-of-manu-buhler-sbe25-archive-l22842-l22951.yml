canonical_text:
  quote: ''
  summary: This passage gives legal rules and commentary on killing in defense or
    against an assassin, royal punishment for adultery, the danger of caste mixture,
    specified situations and acts treated as adulterous, and exceptions for certain
    occupations speaking with married women.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary describes robbers, foreign invasion, and famine as circumstances
    in which twice-born castes may be prevented from offering sacrifices or fulfilling
    sacred duties, or threatened by improper intermixture.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who kills in self-defense, in a dispute about officiating priests'
    fees, or to protect women and Brahmanas is said to commit no sin when acting in
    the cause of right.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An assassin approaching with murderous intent may be slain without hesitation,
    even if the assassin is a teacher, child, aged man, or learned Brahmana.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Killing an assassin is said to bring no guilt to the slayer, whether done
    publicly or secretly.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Men who commit adultery with the wives of others are to be marked with terrifying
    punishments and then banished by the king.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Adultery is said to cause mixture of castes among men, followed by sin and
    destruction.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: A man formerly accused of such offenses who secretly converses with another
    man's wife must pay the first or lowest amercement.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man not previously accused who speaks with a woman for a reasonable cause
    is said not to incur guilt.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Addressing another man's wife at a Tirtha, outside the village, in a forest,
    or at a confluence of rivers is treated as an adulterous act.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: Offering presents to a woman, romping with her, touching her ornaments and
    dress, and sitting with her on a bed are considered adulterous acts.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Mutually consensual touching of prohibited bodily places is declared adulterous.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A non-Brahmana man is said to deserve death for adultery, and the wives of
    all four castes are to be carefully guarded.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: Mendicants, bards, men initiated for a Vedic sacrifice, and artisans are not
    prohibited from speaking to married women.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: The commentary explains a Tirtha as a river-bank place where women fetch water.
  category: setting
  evidence_refs:
  - ev:14
- id: obs:15
  text: The commentary links caste mixture to inability to offer sacrifices properly,
    absence of rain, and universal perishing.
  category: sequence
  evidence_refs:
  - ev:15
