  quote: ''
  summary: The passage argues that the term Vaikhanasa in Manu should be understood
    as referring to a Vaikhanasa Shastra or Sutra attributed to Vikhanas, a work on
    the duties of forest hermits, rather than simply to hermits themselves. It cites
    commentators, Baudhayana, Haradatta, and reports from Indian Pandits as evidence
    for the existence and antiquity of such a work.
