canonical_text:
  quote: ''
  summary: The passage gives legal rules concerning royal adjudication, debts, repayment,
    deposits, and evidence. It warns that an unjust king perishes, says the prince
    should act like Yama while judging, describes penalties and repayment obligations
    for debtors, and prescribes how deposits should be entrusted, returned, and tested
    through witnesses or spies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A king who takes what should not be taken or refuses what should be received
    is said to be accused of weakness and to perish in this world and after death.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A king's power is said to grow when he takes his due, prevents confusion of
    castes, and protects the weak.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prince is instructed to behave like Yama, not following personal liking
    or disliking, and to suppress anger and control himself.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: An evil-minded king who decides causes unjustly is said to be subjugated by
    enemies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the king subdues love and hatred and decides cases according to law, the
    subjects' hearts are compared to rivers running toward the ocean.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A debtor who complains that a creditor recovers a debt independently of the
    court must pay a fine of one quarter of the sum and pay the money due to the creditor.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A debtor of the same or lower caste may make good the debt by personal labor;
    a debtor of higher caste pays gradually when he earns something.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king is told to decide disputes equitably in matters proved by witnesses
    and other evidence.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A sensible person is advised to make a deposit only with a person described
    as of good family, good conduct, legally knowledgeable, truthful, well-connected,
    wealthy, and honourable.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: A deposited thing should be received back in the same manner as it was delivered.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A person who does not restore a deposit may be tried by the judge in the depositor's
    absence.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: When witnesses fail, the judge may arrange for gold to be deposited with the
