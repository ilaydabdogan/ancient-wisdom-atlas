canonical_text:
  quote: ''
  summary: 'The passage presents rules on kingship: a king should punish thieves and
    protect subjects; royal protection is likened to an ongoing sacrificial session
    with safety as the sacrificial fee. A protecting king receives a sixth share of
    subjects'' spiritual merit, while a non-protecting king receives a share of their
    demerit and, if he still takes taxes and dues, sinks into hell after death. Notes
    gloss royal revenues and cite related legal sources.'
