  summary: Verses VIII.154-164 give civil-law rules on renewing unpaid debts, interest,
    payment for carriage or voyages, sureties, inherited liability, contractual capacity,
    and agreements contrary to law or settled usage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A debtor unable to pay at the fixed time may renew the agreement after paying
    the interest due.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the debtor cannot pay the interest, it may be inserted into the renewed
    agreement, and the due interest remains payable.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person contracted to carry goods by wheeled carriage for money forfeits
    the reward if the stipulated place and time are not kept.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rates fixed by men expert in sea-voyages, calculated according to place, time,
    and objects carried, have legal force for payment in those cases.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A surety for a debtor's appearance who does not produce the debtor must pay
    the debt from his own property.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A son is not obliged to pay money due by a surety, idle promises, gambling
    losses, liquor debts, unpaid fines, or taxes or duties owed by the party owing
    them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The special rule for a surety applies only to a surety for appearance; if
    a surety for payment dies, the judge may compel the heirs to discharge the debt.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: If a surety other than for payment had received money from the principal and
    had enough money to pay, the heir of the receiver must pay the debt from that
    property.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Contracts made by intoxicated, insane, gravely disordered, wholly dependent,
    infant, very aged, or unauthorized persons are invalid.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: An agreement contrary to law or settled virtuous usage has no legal force,
    even if established by proofs.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The translator's notes record differing commentator explanations of the term
    rendered as a wheeled-carriage contract, including an interpretation as compound
    interest.
  category: other
  evidence_refs:
  - ev:10
