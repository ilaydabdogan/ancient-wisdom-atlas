canonical_text:
  quote: ''
  summary: 'The passage prescribes conduct for a householder becoming a forest hermit:
    he abandons cultivated food and belongings, may arrange for or take his wife,
    carries sacred fire and domestic ritual implements into the forest, practices
    ascetic discipline, offers sacrifices, gives hospitality, recites the Veda, and
    uses forest produce for ritual food and subsistence.'
  language: English
  quote_policy: summarized
