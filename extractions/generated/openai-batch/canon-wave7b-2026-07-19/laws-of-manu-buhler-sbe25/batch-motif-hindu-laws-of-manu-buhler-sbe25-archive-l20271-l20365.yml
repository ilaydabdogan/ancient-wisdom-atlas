canonical_text:
  quote: ''
  summary: 'The passage gives rules for selecting witnesses in lawsuits: trustworthy
    men who know their duty and are free from covetousness may testify, while numerous
    categories of compromised, dependent, infirm, socially disqualified, or emotionally
    disturbed persons are excluded. It also assigns testimony by gender and caste
    group, and allows any person with personal knowledge to testify in certain secluded,
    forest, or life-loss cases.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Trustworthy men of all four castes may be witnesses if they know their whole
    duty and are free from covetousness; those of the opposite character are to be
    rejected.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Persons with an interest in the suit, familiar friends, companions, enemies
    of the parties, those formerly convicted of perjury, those severely ill, and those
    tainted by mortal sin are excluded as witnesses.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king, mechanics, actors, a Srotriya, a student of the Veda, and an ascetic
    who has given up connection with the world cannot be made witnesses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage excludes additional witness categories, including a wholly dependent
    person, one of bad fame, a Dasyu, a follower of forbidden occupations, an aged
    man, an infant, one man alone, a man of the lowest castes, and one deficient in
    organs of sense.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage also excludes as witnesses a person extremely grieved, intoxicated,
    mad, tormented by hunger or thirst, fatigued, tormented by desire, wrathful, or
    a thief.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Women are to give evidence for women; twice-born men of the same kind for
    twice-born men; virtuous Sudras for Sudras; and men of the lowest castes for the
    lowest.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Any person with personal knowledge may give evidence between the parties for
    an act committed in interior apartments, in a forest, or for a crime causing loss
    of life.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The note to verse 68 cites Vas. XVI, 30 and explains that women testify for
    women in cases between women or matters concerning the female sex.
  category: other
  evidence_refs:
  - ev:8
