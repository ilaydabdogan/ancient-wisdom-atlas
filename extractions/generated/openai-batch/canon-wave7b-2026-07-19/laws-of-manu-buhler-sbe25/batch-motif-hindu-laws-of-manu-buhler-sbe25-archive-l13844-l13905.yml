canonical_text:
  quote: ''
  summary: 'Verses IV.70-74 prescribe conduct for the addressed man: he is told not
    to crush earth or clods, tear grass with his nails, perform useless or harmful
    acts, wrangle, wear a garland over his hair, ride cows or oxen, enter a walled
    village or house except by the gate, approach tree roots at night, play with dice,
    remove his own shoes, or eat in certain improper positions or from certain placements.
    Verse IV.71 says that one who crushes clods, tears grass, bites his nails, informs,
    or neglects purification goes soon to perdition. Notes cite parallel dharma-text
    passages and explain the hand rule in relation to left-hand impurity.'
  language: English
  quote_policy: summarized
