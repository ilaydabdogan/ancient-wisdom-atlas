canonical_text:
  quote: ''
  summary: Rules for studentship regulate the pupil's conduct toward the teacher's
    wife, women, kin, daily hair and sleep discipline, penance, water purification,
    twilight worship, pursuit of the three goods, and reverence for teacher, parents,
    and elder brother. The passage also presents analogies in which hidden knowledge
    is obtained from the teacher like water from the ground, and parents/teacher are
    correlated with cosmic and ritual triads.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pupil is instructed not to anoint, bathe, shampoo, or arrange the hair of
    the teacher's wife.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A pupil who is twenty years old and knows what is becoming and unbecoming
    is told not to salute a young wife of his teacher by clasping her feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that women can seduce or lead men astray, and that the
    senses are powerful enough to master even a learned man.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: A young student may prostrate before the teacher's young wife according to
    rule, and after a journey must clasp the feet of the teacher's wife and salute
    her daily.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: An obedient pupil is said to obtain hidden knowledge from his teacher as a
    man digging with a spade obtains water from the ground.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: A student may shave his head, wear braids, or braid one lock on the crown,
    and the sun must not rise or set while he is sleeping in the village.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the sun rises or sets while the student sleeps, he must fast during the
    next day while muttering the Savitri; without such penance he is said to be tainted
    by great guilt.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The student is to sip water for purification and worship daily at both twilights
    in a pure place with concentrated mind, muttering the prescribed text.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage reports differing views on the chief good and concludes that it
    consists of the aggregate of spiritual merit, wealth, and desire.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: The teacher, father, mother, and elder brother are not to be treated with
    disrespect, and the effort of parents at a child's birth is said not to be compensable
    even in a hundred years.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Pleasing the parents and teacher is said to yield the rewards of austerities,
    and obedience to those three is declared the best austerity.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The teacher is called the image of Brahman, the father the image of Pra^apati,
    the mother the image of the earth, and an elder full brother the image of oneself.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The three revered persons are declared to be the three worlds, three orders,
    three Vedas, and three sacred fires; the father is identified with the Garhapatya
