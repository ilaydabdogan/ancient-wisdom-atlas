canonical_text:
  quote: ''
  summary: In the creation account, a being wishes to produce many beings from his
    own body. He first creates waters by thought and places his seed in them. The
    seed becomes a brilliant golden egg, and in that egg he is born as Brahman, the
    progenitor of the world. The waters are explained as nara, offspring of Nara,
    and because they were his first residence, he is called Narayana.
