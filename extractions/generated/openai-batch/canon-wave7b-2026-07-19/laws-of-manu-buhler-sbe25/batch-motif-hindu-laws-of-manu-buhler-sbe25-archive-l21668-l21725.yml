canonical_text:
  quote: ''
  summary: The passage prescribes proportional distribution of ritual fees among priestly
    classes and among joint workers. It states that a gift or promised payment for
    a pious purpose becomes void if not used as stated, and that a recipient who wrongfully
    tries to enforce such a promise must be compelled by the king to pay one suvarna
    as expiation for theft. Notes define the pious purpose as sacrifice or wedding
    and supply cross-references to ritual and legal texts.
