canonical_text:
  quote: ''
  summary: 'The passage describes duties and qualities of a king through comparisons
    with divine or cosmic powers: Wind, Yama, Varuna, the Moon, Fire, and Earth. It
    then warns the king not to anger Brahmanas, describing their capacity to destroy
    a ruler and alter cosmic conditions, and comparing a Brahmana’s sacred status
    to fire, including fire in burial places and fire strengthened by sacrificial
    oblations.'
  language: English
  quote_policy: summarized
