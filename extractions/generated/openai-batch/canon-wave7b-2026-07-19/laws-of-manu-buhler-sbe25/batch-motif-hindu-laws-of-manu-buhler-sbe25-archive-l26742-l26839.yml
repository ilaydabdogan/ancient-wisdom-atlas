canonical_text:
  quote: ''
  summary: 'The passage gives rules under the duties of a king: penalties for failing
    to assist during plunder or public danger, robbery of treasury property, opposition
    to royal commands, night burglary, cut-purses, aiding thieves, damaging tanks
    and water supplies, breaking into royal or sacred buildings, fouling the king''s
    road, exceptions for persons in necessity or incapacity, and the beginning of
    a rule about fines for physicians who treat wrongly.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons who do not assist according to their ability when a village is plundered,
    a dyke is destroyed, or highway robbery is committed are to be banished with their
    goods and chattels.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king is instructed to inflict various capital punishments on robbers of
    the king's treasury, persistent opponents of his commands, and those who conspire
    with his enemies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Robbers who break into houses and steal at night are to have their hands cut
    off and to be impaled on a pointed stake.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'A cut-purse receives escalating penalties: two fingers amputated on the first
    conviction, one hand and one foot on the second, and death on the third.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those who give thieves fire, food, arms, or shelter, and receivers of stolen
    goods, are to be punished like thieves.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person who breaks the dam of a tank is to be slain by drowning in water
    or another simple capital punishment, or may repair the damage and pay the highest
    amercement.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Persons who break into a royal storehouse, armoury, or temple, or who steal
    elephants, horses, or chariots, are to be slain without hesitation.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A person who takes away the water of an ancient tank or cuts off the water
    supply is to pay the lowest amercement.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A person who drops filth on the king's high-road, except in extreme necessity,
    is to pay two karshapanas and remove the filth immediately.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A person in urgent necessity, an aged man, a pregnant woman, or a child is
    to be reprimanded and must clean the place rather than receiving the ordinary
    road-filth penalty.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage begins a rule that physicians who treat patients wrongly shall
    pay a fine; the supplied excerpt breaks off during the next clause.
  category: action
  evidence_refs:
  - ev:9
