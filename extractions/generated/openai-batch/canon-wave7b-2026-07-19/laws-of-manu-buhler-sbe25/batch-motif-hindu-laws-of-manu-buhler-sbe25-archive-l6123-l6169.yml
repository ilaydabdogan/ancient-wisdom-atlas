  quote: ''
  summary: The editor discusses the corrupt and incomplete state of manuscripts of
    Medhatithi's commentary on the Manu-smriti, urges acquisition of better manuscripts
    for a trustworthy edition, lists the manuscript witnesses used for the translation
    notes, traces them to an archetypal codex derived from Madana's restored copy,
    and then notes the later Manu-tika of Govindaraja. A footnote thanks Dr. Schram
    for chronological calculations.
  language: English
