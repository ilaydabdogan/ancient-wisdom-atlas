literal_observations:
- id: obs:1
  text: 'The passage says that one of Professor Max Muller''s general propositions
    about the origin of metrical Smritis has proved untenable in its full extent:
    the assertion that continuous epic verse was unknown during the Sutra period of
    600-200 B.C.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that aphoristic prose appears to have been adopted earlier
    than verse, and that in known cases a Sutra stands at the head of each series
    of school-books.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that a former Manava Dharma-sutra, consisting of prose
    mixed with verses in several metres, is established by quotations in the Vasishtha
    Dharma-sutra and was closely related to the Manu-smriti.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that recovered Manava writings did not support the supposed
    connection between the Manava Dharma-sutra, the Manu-smriti, and the Sutracharana
    of the Manavas, and instead raised difficulties because the Manava Grhya-sutra
    differs from the Manava Dharmasastra.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage reports an argument that affinities among the Vishnu-smriti, the
    Kanaka Dharma-sutra, the Manu-smriti, the Kanaka and Manava Grhya-sutras, and
    the Kanaka and Manava Samhitas may suggest that the Vedic original of the Manu-smriti
    belonged to the Manava school.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says that the argument from the Vishnu-smriti is weakened because
    the Vishnu-smriti is not the original Kanaka Dharma-sutra, but that the argument
    should not be wholly rejected because Manu and Vishnu agree on many subjects.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage proposes to supplement arguments against the antiquity of the
    Manu-smriti by discussing passages that show knowledge of older legal literature,
    especially Dharma-sutras, and then to re-examine evidence for a Manava Dharma-sutra
    as precursor to the metrical law-book.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that some passages of the Manu-smriti disprove the author's
    claim to be the first legislator and show that the author had many predecessors.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage identifies controversies and conflicting decisions on ritual and
    law as key examples, including differing observances concerning the order of ceremonies
    at a sraddha.
