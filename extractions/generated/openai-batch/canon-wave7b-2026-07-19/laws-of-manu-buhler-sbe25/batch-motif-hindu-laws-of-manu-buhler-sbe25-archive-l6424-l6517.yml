  quote: ''
  summary: The passage is a scholarly introduction describing textual witnesses and
    commentaries on Manu. It discusses the Muktavali editions, the Manvartha^andrika
    attributed to Raghavananda Sarasvati and its relation to earlier commentators
    and Vedanta interpretation, manuscript evidence for that work, and the sixth commentary
    called Manuvyakhyana or Nandini attributed to Nandana, with notes on its Southern
    Indian manuscript affiliation and brevity.
  language: English
  quote_policy: summarized
