canonical_text:
  quote: ''
  summary: 'The passage describes forms of the lunar penance involving measured mouthfuls
    of sacrificial food, bathing, controlled mind, and lunar timing. It adds that
    divine groups and great sages practiced the rite to remove evil, then lists conduct
    for a penitent: daily burnt oblations, non-injury, truthfulness, freedom from
    anger and dishonesty, repeated bathing, speech restrictions, bodily austerities,
    chastity, student vows, worship of gurus, gods, and Brahmanas, and recitation
    of sacred purificatory texts. It concludes that these expiations purify twice-born
    men with known sins, while unknown sins are purified by sacred texts and burnt
    oblations.'
  language: English
  quote_policy: summarized
