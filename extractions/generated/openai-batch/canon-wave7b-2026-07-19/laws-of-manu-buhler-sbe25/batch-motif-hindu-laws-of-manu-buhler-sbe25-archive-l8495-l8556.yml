  quote: ''
  summary: 'The passage prescribes timings for early childhood sacraments: first leaving
    the house in the fourth month, first feeding with rice in the sixth month, tonsure
    in the first or third year, and upanayana initiation at class-specific years after
    conception. It also gives optional earlier initiation timings linked to aims such
    as sacred learning, power, or business, and includes notes citing related ritual
    and legal sources.'
