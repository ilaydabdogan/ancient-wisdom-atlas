literal_observations:
- id: obs:1
  text: The hermit is permitted to eat vegetables from dry land or water, flowers,
    roots, fruits from pure trees, and oils from forest-fruits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hermit is instructed to avoid honey, flesh, mushrooms, and named plant
    foods or fruits identified in the notes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the month of Asvina, the hermit is to discard previously collected ascetic
    food, worn-out clothes, vegetables, roots, and fruit.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The hermit is not to eat food grown on ploughed land or roots and fruits grown
    in a village, even when afflicted by hunger.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The hermit may eat food cooked with fire or ripened by time, and may grind
    with a stone or use his teeth as a mortar.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The hermit may cleanse his food-collecting vessel after the daily meal or
    store food sufficient for a month, six months, or a year.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hermit may eat only at night, only by day, at every fourth meal-time,
    or at every eighth meal-time.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The hermit may follow the lunar penance by diminishing and increasing food
    across the bright and dark halves of the month, or eat boiled barley-gruel once
    on the last days of each fortnight.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The hermit may subsist on flowers, roots, and fruit that ripen by time and
    fall spontaneously, following the rule of Vikhanas.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The hermit may roll on the ground, stand on tiptoe during the day, alternate
    standing and sitting, and go to forest water at sunrise, midday, and sunset to
    bathe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The hermit is to expose himself in summer to five fires, live under the open
    sky during the rainy season, and wear wet clothes in winter, thereby increasing
    austerity.
  category: sequence
  evidence_refs:
  - ev:9
