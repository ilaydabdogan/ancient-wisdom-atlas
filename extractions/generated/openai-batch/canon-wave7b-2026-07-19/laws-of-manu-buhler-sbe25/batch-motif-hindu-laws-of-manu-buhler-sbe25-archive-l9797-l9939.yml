canonical_text:
  quote: the Savitrl (verse) is his mother and the teacher his father
  summary: The passage presents Vedic recitation as high austerity, describes three
    births for an Aryan or twice-born person, identifies investiture with the girdle
    as birth for the sake of the Veda, and sets out rules for an initiated student
    living with a teacher, including ritual duties, abstentions, celibacy, remedial
    actions, service, and begging for food.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Daily private recitation of the Veda by a twice-born man is described as the
    highest austerity, while neglecting Vedic study for other worldly study is said
    to lead to the condition of a Sudra.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage enumerates three births: from the natural mother, at the tying
    of the Munja grass girdle, and at initiation to a Srauta sacrifice.'
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The birth marked by the girdle of Munja grass is called birth for the sake
    of the Veda; in that birth the Savitri verse is called mother and the teacher
    father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The teacher is called father because he gives the Veda, and an uninitiated
    person is restricted from pronouncing Vedic texts except for funeral rites.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: An initiated student is to be instructed in vows, learn the Veda gradually,
    and use the prescribed skin dress, sacred thread, girdle, staff, and lower garment
    at the vows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A student residing with the teacher must control all organs and observe restrictive
    rules to increase spiritual merit.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The student is instructed to bathe, become purified, offer water libations
    to gods, sages, and manes, worship images of gods, and place fuel on the sacred
    fire each day.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The student is instructed to abstain from specified foods and substances,
    women, injury to living creatures, adornment, certain comforts, sensual desire,
    anger, covetousness, performing arts, gambling, disputes, backbiting, lying, touching
    women, hurting others, and voluntary waste of manhood.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: If a twice-born student involuntarily loses manly strength during sleep, he
    must bathe, worship the sun, and mutter a Rik verse three times.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The student is instructed to fetch a pot of water, flowers, cowdung, earth,
    and Kusa grass as required by his teacher, and to beg food daily from suitable
    houses while avoiding specified relatives.
  category: action
  evidence_refs:
  - ev:7
