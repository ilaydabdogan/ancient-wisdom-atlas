literal_observations:
- id: obs:1
  text: The son of an appointed daughter is instructed to take the estate of his own
    father if that father leaves no other son, and to present two funeral cakes to
    his own father and maternal grandfather.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that there is no difference between a son's son and the
    son of an appointed daughter with respect to worldly matters or sacred duties.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage explains the equivalence by saying that their father and mother
    both sprang from the body of the same man.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a son is born to the father after a daughter has been appointed, the inheritance
    division is to be equal, because there is no right of primogeniture for a woman.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If an appointed daughter dies by accident without leaving a son, her husband
    may take that estate.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A son born to an appointed or unappointed daughter by a husband of equal caste
    is said to provide the maternal grandfather with a son's son; he presents the
    funeral cake and takes the estate.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that through a son one conquers worlds, through a son's
