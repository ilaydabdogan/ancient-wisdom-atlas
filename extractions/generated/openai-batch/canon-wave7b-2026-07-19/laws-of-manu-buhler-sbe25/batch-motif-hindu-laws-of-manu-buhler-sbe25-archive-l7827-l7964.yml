canonical_text:
  quote: ''
  summary: The passage and notes describe Dharma as four-footed and as diminishing
    across successive ages, with corresponding reductions in human lifespan, ritual
    results, powers, duties, and chief virtues. It then describes the Self-existent
    assigning distinct duties to groups born from his mouth, arms, thighs, and feet,
    and producing the Brahmana first from his mouth so that offerings may reach gods
    and manes and the universe may be preserved.
  language: English
  quote_policy: summarized
