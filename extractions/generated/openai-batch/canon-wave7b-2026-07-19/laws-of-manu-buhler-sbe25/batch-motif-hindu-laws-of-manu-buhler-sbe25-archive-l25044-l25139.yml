canonical_text:
  quote: ''
  summary: The passage gives inheritance rules for sons born to a Brahmana from wives
    of different caste categories, including special property and ranked shares for
    the sons. It also gives an alternative ten-share division, limits the portion
    of a son by a Sudra wife, and states equal division rules for sons of same-caste
    wives and for sons of a Sudra by a wife of his own caste. Editorial notes cite
    parallel legal passages and commentarial interpretations.
  language: English
  quote_policy: summarized
