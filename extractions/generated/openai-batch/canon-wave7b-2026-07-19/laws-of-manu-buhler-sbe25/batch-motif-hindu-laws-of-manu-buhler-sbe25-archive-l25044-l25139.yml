    specific property items and one excellent share.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'One rule assigns ranked shares: three to the son of the Brahmana wife, two
    to the son of the Kshatriya wife, one and a half to the son of the Vaisya wife,
    and one to the son of the Sudra wife.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: An alternative rule divides the whole estate into ten shares and assigns four,
