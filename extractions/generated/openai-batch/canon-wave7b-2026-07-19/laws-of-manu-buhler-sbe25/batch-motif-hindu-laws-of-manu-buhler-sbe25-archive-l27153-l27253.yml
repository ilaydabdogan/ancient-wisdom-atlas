canonical_text:
  quote: "“Fire sprang from water, Kshatriyas from Brahmanas, iron from stone ...”"
  summary: 'The passage states rules concerning Brahmanas, Kshatriyas, kings, and
    Vaisyas. Brahmanas are to be honored even when engaged in low occupations; Kshatriyas
    are said to originate from and be restrainable by Brahmanas, while Brahmanas and
    Kshatriyas prosper through union. A dying king should give fine-derived wealth
    to Brahmanas, pass the kingdom to his son, and seek death in battle. The text
    then turns to Vaisya duties: marriage, subsistence, cattle tending, knowledge
    of commodities, agriculture, weights, trade, and cattle rearing. Prajapati is
    said to have assigned cattle to the Vaisya and all created beings to Brahmanas
    and the king.'
  language: English
  quote_policy: quoted
