  quote: ''
  summary: A scholarly introduction assesses Nandana's commentary on Manu, describing
    its eclectic dependence on earlier commentaries, occasional agreement or disagreement
    with other commentators, distinctive expositions, and a text that differs from
    the vulgata through variants, omissions, additions, and transpositions. The passage
    judges many Nandana-only readings as corruptions or conjectures and gives examples
    of verse transpositions attributed to copyist error by Nandana.
  language: English
