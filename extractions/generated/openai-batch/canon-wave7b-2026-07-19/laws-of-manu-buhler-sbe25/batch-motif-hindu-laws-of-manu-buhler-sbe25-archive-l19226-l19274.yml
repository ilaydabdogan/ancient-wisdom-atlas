canonical_text:
  quote: ''
  summary: A set of rules instructs a king when to make war, march, remain quiet,
    divide his army, seek refuge with a righteous powerful king, serve such a protector,
    or return to war. It also tells a politic prince to use the four expedients so
    that friends, neutrals, and foes do not surpass him, and to judge actions by future,
    immediate, and past consequences.
