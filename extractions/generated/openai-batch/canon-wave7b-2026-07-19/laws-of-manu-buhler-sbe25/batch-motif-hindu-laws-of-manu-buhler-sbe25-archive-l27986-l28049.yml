  quote: ''
  summary: The passage includes commentary on distinguishing marks for excluded or
    depressed groups, then states that unrewarded death for Brahmanas, cows, women,
    and children secures beatitude for those excluded from the Aryan community. It
    summarizes the law for the four castes as non-injury, truthfulness, non-theft,
    purity, and control of the organs, and describes caste elevation across generations
    through marriages with a highest-caste partner. Notes cite parallel passages and
    variant interpretations in other Dharma texts and commentators.
