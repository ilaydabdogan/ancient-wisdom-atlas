canonical_text:
  quote: ''
  summary: The passage enumerates lawful and forbidden foods, especially milks, sour
    foods, birds, animals, fish, mushrooms, onions, garlic, leeks, and meat. It prescribes
    penances for eating forbidden food, permits some meat in sacrificial or emergency
    contexts, cites Agastya as an ancient precedent, and gives a rationale in which
    Prajapati created the world as sustenance for the vital spirit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Certain milks are prohibited, including the opening fragment's milk of one-hoofed
    animals, sheep, a cow in heat, or a cow without a calf, as well as milk of wild
    animals except buffalo-cows, women's milk, and sour substances; sour milk products
    and extracts from pure flowers, roots, and fruit are permitted.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists many prohibited birds and animals, including carnivorous
    birds, village birds, several named birds, birds identified by feeding or locomotion
    traits, village-pigs, fish-eating animals, and all kinds of fishes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Eating fish is described as eating every kind of flesh, but named fish such
    as Patina and Rohita may be eaten when used for offerings to gods or manes, and
    some other named fish may be eaten on all occasions.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Solitary or unknown beasts and birds and five-toed animals are forbidden,
    while porcupine, hedgehog, iguana, rhinoceros, tortoise, hare, and certain one-jawed
    domestic animals except camels are declared eatable.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: A twice-born man who knowingly eats mushrooms, village-pig, garlic, village-cock,
    onions, or leeks becomes an outcast; unwitting consumption requires specified
    penances or fasting.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Brahmanas may slay recommended beasts and birds for sacrifices and to feed
    dependents, and the passage states that Agastya did this in ancient times.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says that ancient sacrificial cakes at sacrifices offered by Brahmanas
    and Kshatriyas were made from the flesh of eatable beasts and birds.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lawful hard or soft stale food mixed with fatty substances, remains of sacrificial
    viands, and certain barley, wheat, and milk preparations may be eaten under the
    stated conditions.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Meat may be eaten when sprinkled with water while Mantras are recited, when
    Brahmanas desire it, when one is engaged in a lawful rite, or when life is in
    danger.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Prajapati is said to have created the whole world as sustenance for the vital
    spirit; immovable and movable creation are food, and the passage describes categories
    of beings feeding other categories.
  category: relationship
  evidence_refs:
  - ev:8
