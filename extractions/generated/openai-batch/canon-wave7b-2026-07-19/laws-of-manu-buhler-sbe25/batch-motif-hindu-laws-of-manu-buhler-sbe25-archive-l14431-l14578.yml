  text: The rule-recipient is told to speak of what is well as well and to avoid useless
    enmity or dispute.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rule-recipient is told not to journey very early, very late, during midday
    heat, with an unknown companion, alone, or with Sudras.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage forbids insulting people described as having redundant or deficient
    limbs, lacking knowledge, being very aged, lacking beauty or wealth, or being
    of low birth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: An impure Brahmana is forbidden to touch a cow, a Brahmana, or fire, and is
    forbidden while impure and healthy to look at luminaries in the sky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: If an impure person touches the forbidden items, he is instructed to sprinkle
    water with his hand on the organs of sensation, all limbs, and the navel.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The rule-recipient is instructed to follow auspicious customs and good conduct,
    maintain purity, control the organs, mutter prayers, and daily offer oblations
    in the fire.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
