canonical_text:
  quote: ''
  summary: Rules for a Snataka prescribe restrained speech, travel limits, non-insult,
    purity rules, prayer, Veda recitation, fire oblations, worship of gods and ancestors,
    hygiene, reverence toward authorities, virtuous conduct, and self-dependent undertakings.
    The passage states that Veda recitation with purification, austerity, and non-injury
    brings memory of former births and endless bliss, and that virtuous conduct brings
    worldly benefits and averts misfortune.
  language: English
  quote_policy: summarized
