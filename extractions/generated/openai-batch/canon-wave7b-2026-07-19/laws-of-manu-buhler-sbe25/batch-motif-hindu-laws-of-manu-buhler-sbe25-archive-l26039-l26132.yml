canonical_text:
  quote: ''
  summary: 'The passage gives inheritance rules and commentary: an eldest brother
    who defrauds younger brothers loses eldest privileges and is punished; brothers
    habitually committing forbidden acts are barred from property; the eldest may
    not appropriate common property without compensation; a father must not divide
    unequally among undivided sons who jointly work for gain; a son born after partition
    has a defined claim to the father''s property; and a mother, then paternal grandmother,
    inherits from a son who dies without issue. Notes cite commentators and parallel
    Dharmashastra/Dharmasutra authorities.'
  language: English
  quote_policy: summarized
