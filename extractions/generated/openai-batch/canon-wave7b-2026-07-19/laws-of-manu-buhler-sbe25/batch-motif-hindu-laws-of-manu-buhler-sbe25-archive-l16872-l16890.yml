  quote: ''
  summary: The passage prescribes that a twice-born man versed in sacred law should
    cremate a wife of equal caste who dies before him with Agnihotra sacred fires
    and sacrificial implements. After giving the sacred fires to her at the funeral,
    he may remarry and rekindle the fires. He must continue the five great sacrifices
    and live as a householder in the second period of life.
