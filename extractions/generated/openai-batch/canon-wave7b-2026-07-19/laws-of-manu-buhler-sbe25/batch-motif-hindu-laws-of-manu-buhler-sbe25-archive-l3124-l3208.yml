  quote: ''
  summary: A source-critical introduction argues that several portions of the Manu-smriti
    were altered, enlarged, repeated, systematized, or interpolated when compared
    with Dharma-sutras, the Vishnu-smriti, and related authorities. The discussed
    topics include meat rules, duties of women, ascetic meditations for salvation,
    royal duties, civil and criminal law, inheritance, and gambling or betting.
  language: English
  quote_policy: summarized
