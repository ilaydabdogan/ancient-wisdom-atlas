  summary: Commentary and Manu XI.38-48 discuss sacrificial fees, sacred fires, Agnihotra,
    the impropriety of sacrifices with insufficient fees or certain funding sources,
    and prescriptions for penance and expiation of intentional and unintentional sins.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Commentators give variant explanations of an instruction that no unpropitious
    or disagreeable word or action be directed toward a Brahmana.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note identifies Vaitana rites as rites performed in the three sacred fires
    and identifies the Agnihotra mentioned here as the Srauta Agnihotra.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A wealthy Brahmana who does not give a horse sacred to Prajapati as the fee
    for an Agnyadheya becomes equal to one who has not kindled the sacred fires.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person with faith and controlled senses may perform other meritorious acts
    but is told not to offer sacrifices with fees smaller than prescribed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A sacrifice with too-small fees is said to destroy the organs, honour, heavenly
    bliss, longevity, fame, offspring, and cattle; a man of small means should not
    offer a Srauta sacrifice.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: An Agnihotrin Brahmana who voluntarily neglects the sacred fires must perform
    a one-month lunar penance; the offence is equated with the slaughter of a son.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Those who obtain wealth from Sudras and use it to offer an Agnihotra are described
    as priests officiating for Sudras and are censured among Veda reciters.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The giver of wealth for a fire worshiped at a Sudra’s expense is said to pass
    over miseries in the next world while treading on the heads of the fire-worshipers
    described as fools.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: A man who omits a prescribed act, performs a blameable act, or cleaves to
    sensual enjoyments must perform a penance.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Sages prescribe penance for unintentional sin, and some authorities allow
    penance for intentional offence on the evidence of revealed texts.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Unintentional sin is expiated by recitation of Vedic texts, while intentional
    sin is expiated by various special penances.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A twice-born man liable to penance through fate or through an act committed
