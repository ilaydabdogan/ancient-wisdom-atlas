  quote: ''
  summary: The passage describes how merit and guilt are examined for an individual
    soul, leading to bliss or misery in this world and the next. Predominant virtue
    leads to bliss in heaven, while predominant vice leads to torments inflicted by
    Yama; after those torments the soul re-enters the five elements free from taint.
    The passage then teaches the three qualities—Goodness, Activity, and Darkness—and
    describes their effects on embodied souls.
  language: English
  quote_policy: summarized
