literal_observations:
- id: obs:1
  text: A twice-born man who threatens a Brahmana with bodily injury is said to wander
    for one hundred years in the Tamisra hell.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man who intentionally strikes a Brahmana in anger, even with a blade of
    grass, is said to be born for twenty-one existences in punitive wombs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man who causes blood to flow from a non-attacking Brahmana is said to suffer
    great pain after death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The number of dust particles taken up by the blood is used as the number of
    years during which the spiller of blood will be devoured by other animals in the
    next world.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The text states that unrighteousness does not produce its fruit at once, but
    advances slowly and cuts off the roots of the person who committed it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: If punishment does not fall on the offender, it may fall on his sons or grandsons;
    the iniquity is said never to fail to produce fruit for the doer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage instructs the subject to delight in truthfulness, sacred law,
    Aryan conduct, purity, lawful chastisement of pupils, and control of speech, arms,
    and belly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage instructs the subject to walk in the path followed by holy men,
    fathers, and grandfathers, with the promise that he will not suffer harm while
    walking in it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage lists priests, teachers, relatives, guests, dependants, children,
    aged and sick men, household members, and slaves as persons with whom quarrels
    should be avoided.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Avoiding quarrels with the listed persons is said to free the householder
    from all sins and enable him to conquer the following worlds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Specific social figures are assigned authority over worlds, including the
    teacher over the world of Brahman, the father over Prajapati's world, the guest
    over Indra's world, priests over the gods' world, and other relations over further
    worlds or spheres.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: A translator's note explains the comparison to a cow as referring to a cow
    that at once yields benefits by its milk, while other commentators read the word
    as earth.
  category: other
  evidence_refs:
  - ev:6
