  summary: The passage gives rules and consequences concerning harm to a Brahmana,
    moral warnings about unrighteousness and delayed punishment, injunctions for truthful
    and controlled conduct, avoidance of quarrels with relatives and dependants, and
    a mapping of social relations to authority over various worlds.
