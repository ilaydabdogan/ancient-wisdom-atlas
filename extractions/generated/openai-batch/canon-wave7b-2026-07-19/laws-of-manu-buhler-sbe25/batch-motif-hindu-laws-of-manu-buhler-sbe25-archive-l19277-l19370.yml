canonical_text:
  quote: ''
  summary: 'The passage gives prescriptions for a king’s expedition against an enemy:
    arranging political affairs to avoid injury, choosing favorable campaign times,
    securing preparations and spies, clearing roads, organizing the army, guarding
    against hidden enemies, arranging troops in named shapes, encamping in a lotus-shaped
    formation, and stationing officers toward danger.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king is instructed to arrange affairs so that no ally, neutral party,
    or foe can injure him; this is called the sum of political wisdom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the king undertakes an expedition against a hostile kingdom, he is to advance
    gradually against the foe’s capital.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The march is recommended in Margasirsha or toward Phalguna and Chaitra according
    to the condition of the army, with other times allowed when victory is likely
    or the foe has suffered disaster.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:9
- id: obs:4
  text: Before advancing, the king is instructed to arrange affairs in his original
    kingdom, prepare matters relating to the expedition, secure a basis for operations,
    and dispatch spies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king is instructed to clear three kinds of roads and make the sixfold
    army efficient before proceeding against the enemy’s capital.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The three kinds of roads are explained as routes through open country, marshy
    or watercourse-cut ground, and forests; an alternative note gives villages, forests,
    and hills.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sixfold army is explained in one note as consisting of elephants, horses,
    chariots, infantry, the general, and workmen, with variant explanations also reported.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king is told to be on guard against a friend who secretly serves the enemy
    and against deserters returning from the enemy’s camp, because such persons are
    described as the most dangerous foes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The troops may be arrayed like a staff, waggon, boar, Makara, pin, or Garuda,
    with explanatory geometric forms given in the translation.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king is instructed to extend troops toward the side from which danger
    is apprehended and to encamp in a lotus-shaped array.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: A note describes the lotus-array as equally extended on all sides, circular,
    and centered on the king.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:12
  text: The commander-in-chief, subordinate general, and superior officers are to
    receive places in all directions, and the king’s front is to face the direction
    from which danger is feared.
  category: action
  evidence_refs:
  - ev:8
