canonical_text:
  quote: ''
  summary: Verses V.107-118 give rules for purifying persons, inner faculties, bodies,
    materials, liquids, wooden objects, metals, grain, cloth, and sacrificial implements.
    The passage includes an elemental explanation that gold and silver arose from
    the union of water and fire and are purified by those originating elements.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage states that learned persons, offenders, secret sinners, and Veda-knowers
    are each purified by different means: forgiveness, liberality, muttering sacred
    texts, and austerities.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Earth and water are named as purifying agents; a river is purified by its
    current; a woman whose thoughts have been impure is purified by menstrual secretion;
    and a Brahmana is purified by abandoning the world.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The body, internal organ, individual soul, and intellect are each assigned
    a purifying means: water, truthfulness, sacred learning with austerities, and
    true knowledge.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: After rules for bodily purification, the passage turns to rules for purifying
    inanimate things.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Objects made of metal, gems, and stone are said to be cleansed with ashes,
    earth, and water.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: An unstained golden vessel, products of water such as shells and coral, stone
    objects, and a non-enchased silver vessel become pure with water alone.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Gold and silver are said to have arisen from the union of water and fire,
    and therefore to be best purified by the elements from which they sprang.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Copper, iron, brass, pewter, tin, and lead are to be cleansed, as appropriate,
    by alkaline substances, acids, or water.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Liquids are purified by passing two blades of Kuśa grass through them; solid
    things by sprinkling with water; and wooden objects by planing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: At sacrifices, Soma cups, Grahas, and other sacrificial vessels are purified
    by rubbing with the hand and rinsing with water.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Several ritual implements and related objects, including the Karu, Sruć, Sruva,
    Sphya, winnowing basket, cart, pestle, and mortar, are to be cleaned with hot
    water.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: Large quantities of grain and cloth are purified by sprinkling them with water.
  category: action
  evidence_refs:
  - ev:9
