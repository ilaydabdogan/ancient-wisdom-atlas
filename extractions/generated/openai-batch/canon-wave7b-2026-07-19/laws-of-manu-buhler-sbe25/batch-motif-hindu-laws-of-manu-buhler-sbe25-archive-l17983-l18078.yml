canonical_text:
  quote: "“Punishment alone governs all created beings”"
  summary: Verses VII.17-30 define Punishment as royal and legal authority, describe
    it as governing and protecting beings, warn that unconsidered or unjust punishment
    destroys, imagine social and ritual disorder without punishment, personify Punishment
    as black-hued and red-eyed destroying sinners, and specify the qualities needed
    for a king to administer punishment justly.
  language: English
  quote_policy: quoted
