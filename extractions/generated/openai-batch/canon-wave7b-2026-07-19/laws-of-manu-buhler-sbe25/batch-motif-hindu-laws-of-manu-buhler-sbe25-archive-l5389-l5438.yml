  quote: ''
  summary: The passage discusses source-critical evidence concerning the relation
    between the Bhavishya-purana, the Matsya-purana, and the Manu-smriti. It argues
    that the Purana appears to borrow from and explain the Manu text, reviews scholarly
    views on dating the Bhavishya-purana, notes Aufrecht's discovery of sections borrowed
    into the Matsya-purana, and concludes that quotation evidence from later Sanskrit
    works gives only unsatisfactory results for dating the Manu-smriti.
  language: English
  quote_policy: summarized
