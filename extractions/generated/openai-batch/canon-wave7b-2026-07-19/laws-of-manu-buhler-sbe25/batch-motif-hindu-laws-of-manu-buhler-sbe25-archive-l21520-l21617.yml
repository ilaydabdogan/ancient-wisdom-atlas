canonical_text:
  quote: ''
  summary: The passage gives legal rules for deposits, private bailment and return,
    royal adjudication of deposit disputes, sale without ownership, title and possession,
    market purchase before witnesses, restitution when the original seller is unavailable,
    and prohibitions on adulterated, misdescribed, deficient, unavailable, or concealed
    commodities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A deposit made before witnesses with a specified description or quantity is
    to be known by that description or quantity, and a depositary who makes a false
    statement about it is liable to a fine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note to VIII.194 states that witnesses are to be examined about the deposit
    and that their evidence is conclusive.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: Anything delivered or received privately must be returned privately, matching
    the manner of the original bailment.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king is instructed to decide cases about deposits and friendly loans for
    use without undue rigour toward the depositary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person who sells another man's property without ownership and without the
    owner's assent is treated as a thief and is not to be admitted by the judge as
    a witness.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the unauthorized seller is a kinsman of the owner, he is fined six hundred
    pa^as; if he is not a kinsman and has no excuse, he is guilty of theft.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A gift or sale made by someone other than the owner is to be considered null
    and void in judicial proceedings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Where possession is evident but title is not, title rather than possession
    is the proof of ownership.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A person who buys a chattel in the market before witnesses acquires that chattel
    with clear legal title by purchase.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: If the original seller cannot be produced, the buyer is exculpated by the
    public sale and dismissed by the king without punishment, while the former owner
    receives the lost chattel back.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A commodity mixed with another must not be sold as pure, a bad commodity must
    not be sold as good, deficient quantity must not be sold as full quantity, and
    unavailable or concealed goods must not be sold.
  category: action
  evidence_refs:
  - ev:9
