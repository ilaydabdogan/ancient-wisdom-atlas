canonical_text:
  quote: ''
  summary: 'The passage gives ascetic instructions: breath suppression with sacred
    recitation is praised as austerity; breath, attention, sense-restraint, and meditation
    remove taints and attachments; meditation reveals the soul’s progress through
    many beings. True insight frees one from bondage to deeds and the circle of births
    and deaths. The body is described as a decaying dwelling of five elements that
    should be left behind; one who leaves it is freed from worldly misery and attains
    eternal Brahman through meditation after transferring good and evil deeds to friends
    and enemies.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three suppressions of the breath, performed according to rule and accompanied
    by recitation of the Vyahritis and Om, are identified as the highest form of austerity
    for a Brahmana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The destruction of taints through breath suppression is compared to impurities
    of metallic ores being consumed when melted in the blast of a furnace.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'The passage assigns different disciplines to different removals: breath suppressions
    destroy taints, fixed attention destroys production of sin, restraint removes
    sensual attachments, and meditation removes non-lordly qualities.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Meditation is said to let the practitioner recognize the progress of the individual
    soul through beings of various kinds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person with true insight is not fettered by deeds, while one without that
    insight is drawn into the circle of births and deaths.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Non-injury, detachment of the senses, Vedic rites, and rigorous austerity
    are named as means by which men gain the stated condition in this world.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The body is described as a dwelling made of five elements, with bones, tendons,
    flesh, blood, and skin as structural materials, and as foul, diseased, painful,
    passion-darkened, and perishable.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: Leaving the body is compared both to a tree torn from a river-bank and to
    a bird quitting a tree; the one who leaves it is freed from worldly misery, which
    is compared to a shark.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The ascetic makes over good actions to friends and evil deeds to enemies,
    and attains the eternal Brahman through meditation.
  category: action
  evidence_refs:
  - ev:9
