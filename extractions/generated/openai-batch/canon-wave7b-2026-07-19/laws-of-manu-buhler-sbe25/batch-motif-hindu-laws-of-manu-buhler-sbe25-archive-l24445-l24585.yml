canonical_text:
  quote: "“Let mutual fidelity continue until death”"
  summary: The passage condemns taking a nuptial fee as a covert sale of a daughter,
    states mutual fidelity as the highest law for husband and wife, then turns to
    inheritance rules concerning division of parental estates, primacy of the eldest
    son, ancestral debt, support among brothers, separation for merit, and additional
    shares of goods.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A man giving away his daughter is told not to take a nuptial fee; taking such
    a fee is described as selling the daughter under another name.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says good men, ancient or modern, have not promised a daughter
    to one man and then given her to another.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says that even in former creations no covert sale of a daughter
    for a fixed price called a nuptial fee has been heard of.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that mutual fidelity until death summarizes the highest
    law for husband and wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A man and woman united in marriage are instructed to exert themselves so that
    they are not disunited and do not violate mutual fidelity.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the death of father and mother, assembled brothers may divide the paternal
    and maternal estate in equal shares; they have no power over it while the parents
    live.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: An alternate rule allows the eldest alone to take the whole paternal estate,
    while the others live under him as they lived under their father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Immediately on the birth of the first-born, a man is called the father of
    a son and is freed from the debt to the manes.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The son on whom the father places his debt and through whom he obtains immortality
    is said to be begotten for the fulfilment of the law; the rest are called offspring
    of desire.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The eldest is instructed to support younger brothers as a father supports
    sons, and the younger brothers are to behave toward the eldest as sons behave
    toward a father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The eldest son is said to make the family prosperous or bring it to ruin,
    and is treated as especially worthy of honour.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: If the eldest brother behaves properly, he is to be treated like a mother
    and father; if he behaves improperly, he is still to be honoured like a kinsman.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Brothers may live together or apart if each desires spiritual merit; the passage
    states that merit increases when they live separately.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:14
  text: The notes explain separation for merit by saying that each separately kindles
    the sacred fire and offers the Agnihotra and five great sacrifices.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: 'Additional shares are assigned by birth order: one-twentieth and the best
