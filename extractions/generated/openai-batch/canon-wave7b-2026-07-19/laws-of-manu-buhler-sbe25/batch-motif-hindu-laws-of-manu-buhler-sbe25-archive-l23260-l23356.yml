canonical_text:
  quote: ''
  summary: A sequence of legal rules instructs the king to show kindness to specified
    vulnerable or honored persons, regulates washermen and weavers, prescribes royal
    tolls, duties, monopolies, market prices, weights and measures, and ferry fees,
    and imposes fines or confiscation for commercial violations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king is instructed to treat kindly a śrotriya, sick or distressed persons,
    infants, aged or indigent persons, persons of high birth, and honorable persons.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A washerman is instructed to wash clothes gently on a smooth board of śalmali
    wood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A washerman is forbidden to return one person's clothes for another's or to
    allow anyone other than the owner to wear them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A weaver who receives ten palas of thread must return cloth weighing one pala
    more.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A weaver who acts differently is to pay a fine, with the main translation
    giving twelve paṇas and the note recording variant interpretations.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The king is to take one-twentieth of the value or amount fixed for each saleable
    commodity.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The amount is to be fixed by men acquainted with tolls, duties, and the valuation
    of merchandise.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The king is to confiscate the whole property of a trader who, out of greed,
    exports goods subject to royal monopoly or forbidden export.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A person who avoids a custom-house or toll, buys or sells at an improper time,
    or falsely enumerates goods is to be fined eight times the duty attempted to be
    evaded.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The king is to fix purchase and sale rates for marketable goods after considering
    origin, destination, duration of storage, probable profit, and probable outlay.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The king is to settle prices publicly at a stated interval or at the close
    of each fortnight.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Weights and measures must be duly marked and re-examined once every six months.
  category: object
  evidence_refs:
  - ev:8
- id: obs:13
  text: Ferry payments are assigned by category, including carts, loads carried by
    men, animals, women, unloaded men, laden carts, empty vessels, and men without
    luggage.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A note gives examples of royal monopolies in different regions, including
    elephants, saffron, fine cloth and wool, horses, precious stones, and pearls.
  category: other
  evidence_refs:
  - ev:5
