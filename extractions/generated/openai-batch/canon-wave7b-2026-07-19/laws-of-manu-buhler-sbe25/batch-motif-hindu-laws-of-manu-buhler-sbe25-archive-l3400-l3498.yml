canonical_text:
  quote: ''
  summary: The passage discusses how the Mahabharata may be used, with caution, to
    assess the history of the Manu text. It distinguishes general sayings of Manu
    from law-books attributed to him, then cites Mahabharata passages that refer to
    Manu's laws or institutes. The quoted material includes maxims about fire from
    water, Kshatriyas from Brahmanas, iron from stone, and the destruction of derivative
    assailants when they attack their sources. Another cited passage concerns the
    prerogatives of a Brahmana's Brahmani wife and links the rule to institutes proclaimed
    by Manu. The author compares these Mahabharata citations with verses in the existing
    Manu-smriti and comments on the Rajadharmas of Manu Pracetasa.
  language: English
  quote_policy: summarized
