  summary: The passage ranks sacred recitation, Om, the Mahavyahrtis, the Savitri/Gayatri,
    breath suppression, truthfulness, and muttered prayer offerings as superior or
    imperishable forms of practice. It says that daily recitation for three years
    leads after death to entering the highest Brahman, freedom like air, and an ethereal
    form. Notes explain the gate or mouth of Brahman and cite related dharma texts.
