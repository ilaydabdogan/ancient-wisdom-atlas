canonical_text:
  quote: "“the comparative importance of the seed and of the womb has been declared
    to you”"
  summary: The passage gives legal rules about seed, field, womb, and offspring; defines
    kinship boundaries between elder and younger brothers and their wives; permits
    an authorized woman without issue to obtain offspring through a brother-in-law
    or Sapinda under specified conditions; prescribes a silent night approach with
    clarified butter and a one-son limit; then states sanctions and a later prohibition
    concerning appointing a widow to another man.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A seed that germinates in someone else’s field is said to produce a plant
    belonging to the owner of the field, not to the owner of the seed.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same kind of offspring rule is applied to cows, mares, slave-girls, female
    camels, she-goats, ewes, females of birds, and buffalo-cows.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage explicitly frames the preceding material as a declaration of the
    comparative importance of seed and womb, and introduces rules for women in times
    of misfortune.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The wife of an elder brother is treated as the wife of a Guru for the younger
    brother, while the wife of a younger brother is treated as a daughter-in-law of
    the elder brother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: An elder brother approaching the younger brother’s wife, or a younger brother
    approaching the elder brother’s wife, becomes an outcast except in times of misfortune.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: On failure of issue by her husband, an authorized woman may seek desired offspring
    through cohabitation with a brother-in-law or another Sapinda of the husband.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: The appointed man is instructed to approach the widow at night, anointed with
    clarified butter and silent, and to beget one son, not a second.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Some sages versed in law allow a second son if the purpose of the appointment
