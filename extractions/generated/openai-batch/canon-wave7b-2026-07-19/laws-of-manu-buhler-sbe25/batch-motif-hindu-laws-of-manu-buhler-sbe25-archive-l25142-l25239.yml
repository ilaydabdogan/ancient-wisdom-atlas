canonical_text:
  quote: cross a (sheet of) water in an unsafe boat
  summary: The passage classifies twelve types of sons into heirs and non-heir kinsmen,
    compares reliance on bad substitutes for a real son to crossing water in an unsafe
    boat when passing the gloom of the next world, and gives rules for paternal inheritance
    and maintenance among legitimate and substitute sons.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Manu, described as sprung from the Self-existent, enumerates twelve sons of
    men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six of the twelve sons are described as both kinsmen and heirs, and six as
    kinsmen who are not heirs.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The six heirs and kinsmen are listed as the legitimate son of the body, the
    son begotten on a wife, the adopted son, the son made, the son secretly born,
    and the son cast off.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The six kinsmen who are not heirs are listed as the son of an unmarried damsel,
    the son received with the wife, the son bought, the son begotten on a remarried
    woman, the son self-given, and the son of a Sudra female.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage compares the result of crossing water in an unsafe boat with the
    result of trying to pass the gloom of the next world with bad substitutes for
    a real son.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: If a legitimate son of the body and a son begotten on a wife are heirs of
    one man, each is to take the estate of his natural father to the exclusion of
    the other.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The legitimate son of the body alone is called the owner of the paternal estate,
    but he is instructed to allow maintenance to the rest in order to avoid harshness.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the legitimate son of the body divides the paternal estate, he is to
    give one-sixth or one-fifth of his father's property to the son begotten on the
    wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: A note explains that the first six sons inherit the family estate and offer
    funeral oblations, while the last six do not inherit but offer libations of water
    and related rites as remoter kinsmen.
  category: action
  evidence_refs:
  - ev:4
