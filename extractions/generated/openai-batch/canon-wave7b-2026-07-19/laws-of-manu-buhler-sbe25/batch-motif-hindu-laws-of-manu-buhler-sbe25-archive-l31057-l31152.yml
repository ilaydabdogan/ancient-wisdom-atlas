canonical_text:
  quote: ''
  summary: The passage states that confession, repentance, austerity, Vedic recitation,
    and sometimes liberality free a sinner from guilt. It instructs the penitent to
    cease sinning, consider post-death results, and repeat penances until conscience
    is satisfied. It then presents austerity as the root, middle, and end of the bliss
    of gods and humans, assigns class-specific forms of austerity, and describes austerity
    as the means by which sages survey the three worlds, attain health, learning,
    divine stations, difficult accomplishments, freedom from guilt, and even heaven
    for animals and motionless beings.
  language: English
  quote_policy: summarized
