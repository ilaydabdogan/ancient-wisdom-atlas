canonical_text:
  quote: ''
  summary: The passage defines a kingdom as having seven constituent limbs, discusses
    their relative and interdependent importance, instructs the king to assess strengths
    and calamities through spies and undertakings, urges repeated effort, maps royal
    conduct to the four world ages, and instructs the king to imitate the actions
    of deities and cosmic powers such as Indra, the Sun, and the Wind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'A kingdom is said to have seven constituent parts or limbs: the king and
    his minister, capital, realm, treasury, army, and ally.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the seven parts, the text first states that each earlier-named part
    is more important and that its destruction is a greater calamity.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The text then states that, in an interdependent seven-part kingdom upheld
    like a triple staff, no single part is more important than the others for all
    purposes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king is instructed to use spies, a display of energy, and undertakings
    to determine both his own strength and his enemy's strength.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king is instructed to consider calamities and vices according to their
    relative importance before beginning operations.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king is instructed to begin operations again and again even when tired,
    because fortune favors exertion in undertakings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The king's behaviors are said to resemble the Kṛta, Tretā, Dvāpara, and Kali
    ages, and the king is identified with the ages of the world.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Sleeping corresponds to Kali, waking to Dvāpara, readiness to act to Tretā,
    and active movement to Kṛta.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The king is told to emulate the energetic action of Indra, the Sun, the Wind,
    Yama, Varu/za, the Moon, Fire, and Earth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Indra is described as sending copious rain during the four months of the rainy
    season, and the king is told to shower benefits on his kingdom in a corresponding
    way.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Sun is described as drawing up water with his rays during eight months,
    and the king is told to draw taxes gradually from his kingdom in a corresponding
    way.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Wind is described as moving everywhere and entering created beings as
    vital air; the king is correspondingly told to penetrate everywhere, though the
    line range cuts off before the sentence is complete.
  category: action
  evidence_refs:
  - ev:10
