canonical_text:
  quote: ''
  summary: 'The passage gives rules for an ascetic: beg only after household cooking
    and eating are finished; receive alms without grief or joy; avoid food obtained
    through reverential salutations; eat little; practice solitude, sense-restraint,
    non-injury, and the destruction of love and hatred; and reflect on transmigration,
    hell, Yama''s world, separation, age, disease, the soul''s departure from the
    body, and rebirth in another womb.'
  language: English
  quote_policy: summarized
