literal_observations:
- id: obs:1
  text: The passage says the idea that Manu acted as mediator between Brahman and
    mankind and taught the way to final liberation may belong to very early times.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says early testimony probably supports the belief that Manu first
    settled Dharma and that this belief follows from conceptions of Manu as founder
    of the moral and social order of the world.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports that a Taittiriya-samhita passage declares Manu divided
    his estate among his sons, and that Baudhayana placed it at the head of inheritance
    rules.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage cites a verse in Yaska's Nirukta saying that Manu, offspring of
    the Self-existent, declared at the beginning of creation that inheritance goes
    to children of both sexes without distinction according to sacred law.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage notes that the Manu-smriti does not teach equal sharing for daughters
    under all circumstances; daughters with brothers receive one-fourth of a share.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says formulas such as 'Manu has said' become more frequent in
    Dharma-sutra and later legal literature, and that their meaning is that an appended
    rule was thought ancient and indisputable.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says the adoption of the formula is explained by belief in Manu's
    revelation of the law, not by the existence of a primeval Manava Dharma-sutra
    or Sastra.
  category: other
  evidence_refs:
  - ev:7
