- id: obs:4
  text: The hermit may receive alms from Brahmana ascetics or twice-born forest householders,
    or bring food from a village in a leaf dish, his hand, or a broken earthen dish,
    eating eight mouthfuls.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The forest-dwelling Brahmana is told to practice these observances and study
    Upanishadic and other sacred texts for union with the supreme Soul, knowledge
    of Brahman, austerity, and bodily sanctification.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: An alternative instruction tells the hermit to walk straight in a north-easterly
    direction, fully determined, subsisting on water and air, until the body sinks
    to rest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Brahmana who gets rid of the body by modes practiced by great sages is said
    to be exalted in the world of Brahman and free from sorrow and fear.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A note identifies the north-easterly journey as the Mahaprasthana, or Great
