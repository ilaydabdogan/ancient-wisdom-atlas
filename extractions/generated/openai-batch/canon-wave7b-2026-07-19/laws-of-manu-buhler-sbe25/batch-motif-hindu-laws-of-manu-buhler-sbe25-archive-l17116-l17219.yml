  category: other
  evidence_refs:
  - ev:6
- id: obs:9
  text: A note lists possible modes of getting rid of the body, including drowning
    in a river, precipitating oneself from a mount, burning oneself, or starving oneself
    to death.
  category: action
  evidence_refs:
  - ev:7
