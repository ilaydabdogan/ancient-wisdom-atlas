canonical_text:
  quote: ''
  summary: 'The passage gives rules for a forest-dwelling Brahmana hermit: bathing
    and offering water libations, intensifying austerities, internalizing the sacred
    fires, living without house or external fire, practicing silence and chastity,
    sleeping on the ground near trees, receiving or bringing limited alms, studying
    sacred texts including the Upanishads for union with or perfection of the soul,
    and optionally undertaking a north-easterly death-journey. It states that one
    who relinquishes the body by such modes reaches the world of Brahman free from
    sorrow and fear; notes identify the practice with the Mahaprasthana or Great Departure
    and discuss parallel ascetic practices.'
  language: English
  quote_policy: summarized
literal_observations:
