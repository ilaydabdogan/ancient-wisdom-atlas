  text: The hermit is instructed to bathe at sunrise, midday, and sunset, offer water
    libations to the manes and gods, and practice increasingly harsh austerities that
    dry up the body.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hermit reposes the three sacred fires in himself, then lives without external
    fire or house, remains silent, and subsists on roots and fruit.
  category: action
  evidence_refs:
