canonical_text:
  quote: ''
  summary: The passage gives rules for legal testimony, oaths, and ordeals. It says
    misfortune after testimony may make a witness liable, allows oaths when witnesses
    are unavailable, warns against false oaths, specifies oath-objects by social class,
    permits ordeals by fire or water, and gives Vatsa as an example of innocence proven
    when fire did not burn him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A witness who suffers sickness, fire, or the death of a relative within seven
    days after giving evidence is to pay the debt and a fine.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When two parties dispute and no witnesses are available, the judge may use
    an oath to discover the truth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that great sages and gods have taken oaths to decide doubtful
    matters, and names Vasishtha as having sworn before King Sudas.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A wise person is instructed not to swear falsely, even in a small matter,
    because one who does so is lost in this world and after death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: False swearing is exempted from loss-of-caste crime in specified circumstances
    involving women, marriages, cow fodder, fuel, and favor to a Brahmana.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The judge is to cause a Brahmana, Kshatriya, Vaisya, and Sudra to swear by
    different objects or imprecations suited to each group.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: As alternative procedures, the judge may cause a party to carry fire, dive
    under water, or touch the heads of his wives and children.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A person whom fire does not burn, whom water does not force quickly upward,
    and who meets no speedy misfortune is to be held innocent on the strength of his
    oath.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'Vatsa is given as an earlier example: when accused by his younger brother,
    fire, called the spy of the world, did not burn even a hair of him because of
    his truthfulness.'
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: If false evidence has been given in a suit, the judge must reverse the judgment
    and treat what was done as undone.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The notes identify oath as part of divine proof and state that the fire and
    water procedures refer to ordeals discussed in related legal texts.
  category: other
  evidence_refs:
  - ev:11
  - ev:12
