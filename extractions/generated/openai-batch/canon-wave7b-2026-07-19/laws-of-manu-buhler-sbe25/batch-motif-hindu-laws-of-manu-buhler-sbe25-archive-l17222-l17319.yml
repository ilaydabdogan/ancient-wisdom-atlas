canonical_text:
  quote: ''
  summary: The passage prescribes the transition from forest hermit to ascetic life.
    After fulfilling ritual, social, and ancestral obligations, the twice-born man
    may seek final liberation, perform a sacrifice, give away property, internalize
    the sacred fires, promise safety to all beings, leave his house, and wander silently
    and alone without possessions, fire, or dwelling while meditating on Brahman.
    It also states afterlife rewards for proper renunciation and downward consequences
    for seeking liberation before completing required duties.
  language: English
  quote_policy: summarized
