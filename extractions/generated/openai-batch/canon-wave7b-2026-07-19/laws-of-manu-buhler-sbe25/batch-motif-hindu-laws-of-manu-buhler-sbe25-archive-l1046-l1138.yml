  quote: ''
  summary: The passage is a scholarly introduction arguing that the Manu-smriti knew
    the Vedic Angas, especially Kalpa, and is later than some Dharma-sutras. It discusses
    Manu’s citation of older legal authorities on marriage with a Sudra woman, compares
    the passage with Gautama’s Sutra and Uśanas, and notes a forest-hermit rule attributed
    to Vikhanas or the Vaikhanasa opinion.
  language: English
  quote_policy: summarized
