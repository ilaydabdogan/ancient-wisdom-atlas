canonical_text:
  quote: ''
  summary: In the Studentship section, these verses teach that Vedic learning, disciplined
    speech and thought, humility toward honor and scorn, and the performance of Vedic
    study with vows and austerities define true Brahmanical and student discipline.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man is not considered venerable merely because his head is gray; a young
    person who has learned the Veda is considered venerable by the gods.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: An unlearned Brahmana is compared to an elephant made of wood and an antelope
    made of leather; the three are said to have only the names of their kinds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Brahmana who does not know the Riks is described as useless, with similes
    of unproductive or unrewarding cases.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Created beings are to be instructed in what concerns their welfare without
    causing pain, and the instructor is to use sweet and gentle speech.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: One whose speech and thoughts are pure and guarded gains the whole reward
    conferred by the Vedanta.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage prohibits cutting words, injury in thought or deed, and fear-making
    speech, and says such speech prevents the gaining of heaven.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Brahmana is told to fear homage as poison and desire scorn as nectar; the
    scorned person remains at ease, while the scorner perishes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A sanctified twice-born man is to perform prescribed austerities gradually
    and cumulatively for Vedic study.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: An Aryan is required to study the whole Veda together with the Rahasyas while
    performing austerities and prescribed vows.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A Brahmana who desires to perform austerities is instructed to repeat the
    Veda constantly.
  category: action
  evidence_refs:
  - ev:10
