canonical_text:
  quote: ''
  summary: The passage prescribes expiations for stealing a Brahmana's gold, for violating
    a Guru's bed or having connection with a Guru's wife, and for the minor offence
    of killing a cow or bull. It gives options including confession before a king,
    death-bearing punishments, forest austerities, lunar penance, and a cow-centered
    penance involving diet, living in a cow-house, contact with cow products, following
    and serving cows, protecting them from danger, and refraining from objection when
    cows or calves consume food or milk.
  language: English
  quote_policy: summarized
