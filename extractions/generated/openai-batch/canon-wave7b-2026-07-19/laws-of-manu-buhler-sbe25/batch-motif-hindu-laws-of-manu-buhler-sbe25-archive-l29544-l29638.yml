canonical_text:
  quote: ''
  summary: 'The passage prescribes ways by which guilt for killing a Brahmana and
    related serious offences may be removed: risking or giving life for Brahmanas
    or cows, defending Brahmana property, maintaining a twelve-year vow, confessing
    before an authoritative assembly, bathing after a horse-sacrifice, receiving expiation
    proclaimed by Veda-learned men, and following rules with self-control. It also
    extends the same penance to specified other killings and offences.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who abandons life for Brahmanas or cows, or saves the life of a cow
    or Brahmana, is freed from guilt for killing a Brahmana.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person who fights three times against robbers in defence of Brahmana property,
    reconquers all such property, or dies for that cause is freed from guilt.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Remaining firm in a vow, chaste, and concentrated in mind for twelve years
    removes the guilt of slaying a Brahmana.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Confessing the crime before an assembly of Brahmanas and Kshatriyas and bathing
    with priests at the close of a horse-sacrifice frees the offender from guilt.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Brahmana is described as the root of sacred law and the Kshatriya as its
    top; confession before such an assembly makes the offender pure.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Brahmana is described as a deity even for the gods by origin, and his teaching
    is authoritative for men because the Veda is its foundation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: If three persons learned in the Veda proclaim the expiation for offences,
    that proclamation purifies sinners.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Brahmana who follows the prescribed rules with a concentrated mind removes
    the sin of Brahmana-slaying through self-control.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The same penance is prescribed for specified other acts, including destroying
    a Brahmana embryo of unknown sex, slaying certain Kshatriyas, Vaishyas, or a purified
    Brahmana woman, giving false evidence, abusing the teacher, stealing a deposit,
    and killing wife or friend.
  category: relationship
  evidence_refs:
  - ev:8
