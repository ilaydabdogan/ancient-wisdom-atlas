canonical_text:
  quote: ''
  summary: 'The passage classifies mixed-caste descent. It states that excluded or
    low men beget still more excluded or lower races through unions with women of
    higher rank, with a commentarial discussion of how fifteen lower castes are counted.
    It then names offspring from Dasyu, Vaideha, and Nishada unions with Ayogava women
    and assigns them occupations or attributes: Sairandhra, Maitreyaka, and Margava/Daśa/Kaivarta.
    A final verse describes the three as base-born and associates them with clothes
    of the dead, wickedness, and reprehensible food, with notes on textual variants.'
  language: English
  quote_policy: summarized
