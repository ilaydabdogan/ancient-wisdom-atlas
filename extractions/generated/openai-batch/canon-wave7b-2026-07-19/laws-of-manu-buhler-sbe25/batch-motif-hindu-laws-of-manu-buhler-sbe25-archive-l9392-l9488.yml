canonical_text:
  quote: ''
  summary: 'The passage gives rules for studentship etiquette: vocal forms for addressing
    names, who should or should not be saluted, class-specific greeting words, special
    non-name address for an initiated sacrificer, respectful address to women, and
    gestures or forms of honor for uncles, in-laws, priests, female relatives, elder
    sisters, and mothers.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A rule prescribes adding the vowel “a” at the end of the addressed person’s
    name and lengthening the preceding syllable to three moras.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Brahmana who does not know how to return a salutation is not to be saluted
    by a learned man and is likened to a Sudra.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: On meeting a Brahmana, Kshatriya, Vaisya, or Sudra, different words are prescribed
    for asking after health or welfare.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person initiated to perform a Srauta sacrifice is not to be addressed by
    personal name, even if younger; the knower of sacred law uses honorific forms
    such as bhoh and bhavat.
  category: speech
  evidence_refs:
  - ev:4
  - ev:11
- id: obs:5
  text: A woman who is another man’s wife and not a blood relation is to be addressed
    as “Lady” or “Beloved sister.”
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Maternal and paternal uncles, fathers-in-law, officiating priests, and other
    venerable persons are to be met by self-identification and by rising, even if
    they are younger.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A maternal aunt, maternal uncle’s wife, mother-in-law, and paternal aunt are
    to be honored like the wife of one’s teacher.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The feet of a brother’s wife of the same caste are to be clasped daily; the
    feet of wives of other paternal and maternal relatives are embraced on return
    from a journey.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The father’s sister, mother’s sister, and one’s elder sister are to be treated
    like one’s mother, while the mother is stated to be more venerable than they are.
  category: relationship
  evidence_refs:
  - ev:9
