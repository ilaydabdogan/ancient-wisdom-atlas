canonical_text:
  quote: ''
  summary: The passage defines Brahmanas who sanctify a ritual company, prescribes
    inviting them for a Sraddha rite, describes the manes as attending the invited
    Brahmanas, warns of guilt, rebirth, and sin transfer for ritual violations, characterizes
    the manes as primeval deities, and gives genealogical classes of manes and their
    relation to sages, gods, Danavas, and the world.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men considered sanctifiers of a company are described as highly learned in
    the Vedas and Angas, descended from Srotriyas, and include several specified types
    such as a keeper of five sacred fires, a Veda-knower, a Veda-expounder, a student,
    a giver of a thousand cows, and a centenarian.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the day before or the day of the Sraddha rite, the performer is instructed
    to invite with respect at least three qualified Brahmanas.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: An invited Brahmana at a rite for the manes, and the performer of the Sraddha,
    are instructed to control themselves and not recite the Veda.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The manes are said to attend the invited Brahmanas, follow them when they
    walk like the wind, and sit near them when seated.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A duly invited Brahmana who breaks an appointment for a rite in honour of
    the gods or the manes is said to become guilty and, in the next birth, a hog.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person invited to a Sraddha who dallies with a Sudra woman is said to take
    upon himself all the sins committed by the giver of the feast.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The manes are described as primeval deities, free from anger, careful of purity,
    ever chaste, averse from strife, and greatly virtuous.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage gives origins and classifications of the manes, describing classes
    as sons or descendants of sages and assigning classes of manes to gods, semi-divine
    beings, and human social groups.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: 'A cosmological sequence is given: from sages sprang the manes, from the manes
    the gods and Danavas, and from the gods the whole movable and immovable world.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The excerpt ends with a fragment beginning an assertion about water offered
    with faith to the manes.
  category: object
  evidence_refs:
  - ev:8
