  quote: ''
  summary: The passage instructs a Brahmana householder who has paid his debts to
    sages, manes, and gods to hand over everything to his son, live without concern
    for worldly matters, and meditate alone for the welfare of his soul. It states
    that solitary meditation leads to supreme bliss, that these ordinances increase
    holiness, and that a learned Brahmana who follows them destroys sins and is exalted
    in Brahman's world.
