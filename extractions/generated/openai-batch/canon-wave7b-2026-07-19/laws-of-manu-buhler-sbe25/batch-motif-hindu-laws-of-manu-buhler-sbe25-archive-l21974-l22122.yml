canonical_text:
  quote: Let them, putting earth on their heads, wearing chaplets (of red flowers)
    and red dresses... settle (the boundary) in accordance with the truth.
  summary: The passage gives legal rules for royal settlement of boundary disputes.
    It prescribes visible and hidden boundary markers, use of long possession and
    flowing water, public witness examination, a ritualized oath for boundary witnesses,
    penalties for false determination, and fallback testimony from neighbouring villagers
    or forest inhabitants.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A righteous king is instructed to follow these rules in cases involving transgressions
    by masters, cattle, and herdsmen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When two villages dispute a boundary, the king is to settle the limits in
    the month of Gyaishtha, when landmarks are most visible.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Boundaries are to be marked by named trees, clustering shrubs, bamboos, Samis,
    creepers, raised mounds, reeds, and thickets so that the boundary will not be
    forgotten.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tanks, wells, cisterns, fountains, and temples are to be built where boundaries
    meet.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Because ignorance of boundaries causes trespasses, the king is to have hidden
    boundary marks made from durable objects such as stones, bones, cow hair, chaff,
    ashes, potsherds, dry cowdung, bricks, cinders, pebbles, and sand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Objects that the earth does not corrode even after a long time are to be buried
    where one boundary joins another.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The king is to ascertain disputed boundaries by signs, long continued possession,
    and constantly flowing streams of water.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: If inspection of boundary marks leaves doubt, the dispute depends on witnesses,
    who are examined in the presence of villagers and both litigants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The king is to record the boundary in writing together with the witnesses'
    names according to their unanimous decision.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Boundary witnesses are instructed to put earth on their heads, wear red flower
    chaplets and red dresses, be sworn by the rewards for their meritorious deeds,
    and settle the boundary truthfully.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Veracious witnesses are guiltless, but those who determine the boundary unjustly
    must pay a fine of two hundred panas.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: If witnesses from the two villages are unavailable, pure men from the four
    neighbouring villages may decide the boundary in the king's presence.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:13
  text: If suitable neighbouring witnesses are unavailable, the king may hear forest
    inhabitants, including hunters, fowlers, herdsmen, fishermen, root-diggers, snake-catchers,
    gleaners, and other foresters.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: For fields, wells, tanks, gardens, and houses, boundary-mark decisions depend
    on the evidence of neighbours.
  category: relationship
  evidence_refs:
  - ev:5
