  quote: ''
  summary: The passage gives age limits for the initiation sacrament of Brahmana,
    Kshatriya, and Vaisya males; states that those missing the proper time become
    Vratyas, excluded from Savitri initiation and avoided in Vedic or marriage connections
    unless purified; and prescribes caste-specific student garments and girdles.
  language: English
