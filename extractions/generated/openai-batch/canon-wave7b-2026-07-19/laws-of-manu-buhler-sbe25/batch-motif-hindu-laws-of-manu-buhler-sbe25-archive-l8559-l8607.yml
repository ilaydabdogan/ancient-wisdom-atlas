literal_observations:
- id: obs:1
  text: 'Different upper age limits after conception are assigned for Brahmana, Kshatriya,
    and Vaisya initiation: completion of the sixteenth, twenty-second, and twenty-fourth
    years respectively.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Men of the three castes who have not received the sacrament at the proper
    time become Vratyas, described as outcasts, excluded from the Savitri initiation,
    and despised by Aryans.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Brahmana is instructed not to form Vedic or marital connections with such
    men if they have not been purified according to rule, even in distress.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Students are instructed to wear upper garments of black antelope, spotted
    deer, and he-goat skins according to caste order, with lower garments of hemp,
    flax, or wool.
  category: object
  evidence_refs:
