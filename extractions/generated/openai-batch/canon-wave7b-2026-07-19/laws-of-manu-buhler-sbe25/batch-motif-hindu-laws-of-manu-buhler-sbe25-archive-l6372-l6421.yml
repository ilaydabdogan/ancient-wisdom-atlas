  quote: ''
  summary: A scholarly introduction discusses Kulluka's Manvarthamuktavali, giving
    biographical and chronological notes, assessing its dependence on Govindaraja's
    Manutika, and explaining its later reputation through its association with Benares.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Manvarthamuktavali is identified as the fourth work under discussion and
    as a work of Kulluka, son of Divakarabhaṭṭa; it had until lately been considered
    a trustworthy guide for interpreting Manu.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kulluka's introductory verses are reported to say that he was Gauḍa or Bengali
    by birth, that his father resided in Nandana in Varendra, and that he wrote at
    Benares with help from other Pandits.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage places Narayana Sarvajna and Dharamdhara between Kulluka and Govindaraja,
    and identifies Raghunandana as the earliest author who quotes Kulluka.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: On this chronological basis, the passage says Kulluka probably lived in the
    fifteenth century.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Professor Jolly is credited with recognizing that the Manvarthamuktavali is
    little more than an improved edition of Govindaraja's Manutika.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says Kulluka attacks his predecessor but also copied large parts
    of the Manutika, sometimes verbatim and sometimes in shortened extracts; Govinda's
    influence is said to remain visible even where wording differs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage evaluates the Muktavali as not very valuable after the recovery
    of the Manutika, while still acknowledging some useful independent remarks and
    criticisms by Kulluka.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage explains the Muktavali's fame and frequent occurrence in native
    lawyers' libraries by noting that it was written and approved at Benares, described
    as an important literary centre and source of books for Pandits.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: A footnote says the place is called Varendranandana in the colophon of chapter
    XII and locates the district of Varendra between Dinajpur and the Ganges.
  category: setting
  evidence_refs:
  - ev:5
