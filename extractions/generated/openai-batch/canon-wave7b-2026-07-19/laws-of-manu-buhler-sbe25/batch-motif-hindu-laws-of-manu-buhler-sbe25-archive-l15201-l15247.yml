  summary: The passage gives rules concerning respectful giving and receiving, restraint
    after austerity and sacrifice, the loss of ritual or moral rewards through falsehood,
    pride, slander, or boasting, and the accumulation of spiritual merit as the only
    companion that remains after death and helps the person traverse a difficult gloom
    in the next world.
  language: English
  quote_policy: summarized
