- id: obs:2
  text: The instructed person is told not to be proud of austerities, not to utter
    falsehood after sacrifice, not to speak ill of Brahmanas when tormented by them,
    and not to boast after giving a gift.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Falsehood makes a sacrifice vain; self-complacency loses the reward of austerities;
    speaking evil of Brahmanas loses longevity; boasting loses the reward of a gift.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The instructed person is told to give no pain to any creature and slowly accumulate
    spiritual merit for the sake of having a companion in the next world.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The accumulation of spiritual merit is compared to a white ant gradually raising
    its hill.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the next world, father, mother, wife, sons, and relations do not stay as
    companions; spiritual merit alone remains.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
