canonical_text:
  quote: ''
  summary: 'The passage defines a true tridaṇḍin as one who controls speech, thought,
    and body, and says such threefold restraint, joined with the subduing of desire
    and wrath, leads to complete success. It then distinguishes several internal principles
    or selves: Kshetrajña, Bhutatman, an internal Self called Śiva, and the Great
    One, relating them to action, embodied existence, pleasure and pain across births,
    and union with the elements. Notes explain the outward ascetic sign of three staves,
    identify complete success with final liberation, and record commentarial interpretations
    of the self-terms.'
  language: English
  quote_policy: summarized
