canonical_text:
  quote: ''
  summary: A legal instruction warns witnesses against false speech by describing
    torments, loss of merit, inner divine witnessing, hell, and graded harms caused
    by perjury. It also states an exception for falsehood spoken to prevent death,
    followed by expiatory offerings and recitations to Sarasvati, Varuna, and the
    Waters.
