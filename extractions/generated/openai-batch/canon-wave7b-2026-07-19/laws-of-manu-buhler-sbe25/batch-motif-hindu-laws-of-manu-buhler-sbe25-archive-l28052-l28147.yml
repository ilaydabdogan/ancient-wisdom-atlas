    father.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The decision says that the child of an Aryan father and non-Aryan female may
    become like an Aryan by virtues.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The decision says that the child of an Aryan mother and non-Aryan father remains
    unlike an Aryan.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The law prescribes that neither of the two mixed-origin persons receives the
