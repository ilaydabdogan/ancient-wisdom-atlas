  text: A Sudra is said to attain the rank of a Brahmana, while a Brahmana can sink
    to the level of a Sudra; the same principle is said to apply to offspring of Kshatriya
    or Vaisya lineage.
  category: sequence
  evidence_refs:
  - ev:1
