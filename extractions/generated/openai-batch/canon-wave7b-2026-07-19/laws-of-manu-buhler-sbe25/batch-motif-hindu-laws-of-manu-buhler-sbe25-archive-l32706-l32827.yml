  summary: The passage defines who may determine sacred law, privileges learned Vedic
    authority over ignorant numerical majorities, warns against instruction by the
    ignorant, describes the teaching as a secret sacred law revealed by a deity for
    mankind’s benefit, and urges concentrated recognition of all things in the Self
    as a safeguard against unrighteousness.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: An assembly of at least ten persons, or at least three persons following their
    prescribed occupations, may declare what is law, and its legal force is not to
    be disputed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A ten-member legal assembly is described as including Vedic specialists, a
    logician, a Mimamsaka, a knower of Nirukta, a reciter of sacred law, and three
    men belonging to the first three orders.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A three-member assembly competent to decide doubtful points of law consists
    of one knower each of the Rig-veda, Yajur-veda, and Sama-veda.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A single Brahmana versed in the Veda may have supreme legal force when declaring
    law, while declarations by myriads of ignorant men do not.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Thousands of Brahmanas who have not fulfilled sacred duties, are unacquainted
    with the Veda, and subsist only by caste name cannot form an assembly for settling
    sacred law.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: If dunces described as incarnations of Darkness and unacquainted with law
    instruct someone in duty, the resulting sin falls a hundredfold on those who propound
    it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The preceding teaching is described as most efficacious for securing supreme
    bliss, and a Brahmana who does not fall away from it obtains the most excellent
    state.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: A worshipful deity is said to have disclosed the whole secret of sacred law
