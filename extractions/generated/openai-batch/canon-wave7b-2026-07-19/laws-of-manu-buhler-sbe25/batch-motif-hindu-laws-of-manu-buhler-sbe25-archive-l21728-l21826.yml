  summary: Verses VIII.215-226 state rules about non-payment of wages, breach of sworn
    agreements, return of a purchased or sold chattel within a ten-day period, penalties
    for concealing a blemish in a damsel, penalties for maliciously denying a maiden's
    virginity, and the application of nuptial texts only to virgins.
  language: English
  quote_policy: summarized
