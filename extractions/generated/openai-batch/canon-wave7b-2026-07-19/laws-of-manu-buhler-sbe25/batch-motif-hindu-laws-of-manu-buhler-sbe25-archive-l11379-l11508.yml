canonical_text:
  quote: ''
  summary: The passage gives rules for a twice-born householder's daily offerings,
    alms, and hospitality. It instructs him to place food for low-status people, afflicted
    persons, animals, and insects; to feed guests and give alms; to choose worthy
    recipients for offerings; and to honor guests with water, seats, food, lodging,
    and kind speech. It links these actions to merit, protection from guilt, heavenly
    reward, or postmortem consequences.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The householder is instructed to place food gently on the ground for dogs,
    outcasts, Candalas, persons afflicted by diseases described as punishments of
    former sins, crows, and insects.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Brahmana who daily honors all beings is said to go with a resplendent body
    by a straight road to the highest dwelling-place.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After performing the Bali offering, the householder is to feed his guest first
    and give alms to an ascetic and a student.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Giving alms is said to bring the householder a reward comparable to that gained
    by a student who presents a cow to his teacher according to rule.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Brahmana who knows the true meaning of the Veda may receive even a small
    portion of food or a pot full of water, with the food or pot garnished.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Oblations to gods and manes are said to be lost if shares are presented to
    Brahmanas described as mere ashes.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: An offering made in the mouth-fire of Brahmanas rich in sacred learning and
    austerities is said to save from misfortune and great guilt.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A guest who arrives of his own accord is to receive a seat, water, and garnished
    food according to the host's ability.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Brahmana who stays unhonored in the house is said to take away all spiritual
    merit even from a very austere or frugal man.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Grass, room for resting, water, and a kind word are named as things that never
    fail in the houses of good men.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: A Brahmana who stays one night only is declared to be a guest, while a Brahmana
    from the same village or one seeking livelihood through social intercourse is
    not to be considered a guest.
  category: attribute
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Householders who constantly seek to live on the food of others are said to
    become, after death, the cattle of those who gave them food.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: A guest sent by the setting sun in the evening must not be driven away, whether
    he arrives at supper-time or at an inopportune moment.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: The householder is told not to eat dainty food that he has not offered to
    his guest; the reception of guests is said to procure wealth, fame, long life,
    and heavenly bliss.
  category: relationship
  evidence_refs:
  - ev:11
