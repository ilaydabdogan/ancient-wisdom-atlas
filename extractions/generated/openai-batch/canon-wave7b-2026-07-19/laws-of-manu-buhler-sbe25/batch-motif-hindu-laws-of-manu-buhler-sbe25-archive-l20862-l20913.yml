canonical_text:
  quote: ''
  summary: 'The passage gives rules for royal punishment: bodily sites or forms of
    penalty are listed; the king is instructed to investigate motive, time, place,
    capacity, and crime before punishing; unjust punishment brings loss of reputation,
    loss of heaven, infamy, and hell; punishment is to proceed from admonition to
    reproof, fine, and corporal chastisement, with all four used if necessary. Editorial
    notes cite parallels in other Dharmaśāstra texts.'
  language: English
  quote_policy: summarized
