canonical_text:
  quote: ''
  summary: In a section headed as the knowledge of the Atman, an ultimate pervading
    principle is described as present in created beings through five forms, causing
    beings to move through birth, growth, and decay like chariot wheels. Recognizing
    the Self in all beings brings equal-mindedness and entry into Brahman. Recitation
    of Manu's revealed Institutes is said to produce virtuous conduct and attainment
    of the desired condition.
