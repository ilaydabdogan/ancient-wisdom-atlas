canonical_text:
  quote: ''
  summary: Rules for householders and Snatakas prescribe seasonal sacrifices, offerings
    before eating new grain or meat, hospitality and selective honoring of guests,
    food distribution, permitted begging, personal discipline and ritual objects,
    restrictions on looking at the sun and reflections in water, respectful right-hand
    passage by sacred or notable objects, and rules governing conduct toward a wife,
    especially during menstruation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Brahmana who keeps sacred fires is instructed not to eat new grain or meat
    before offering the new-grain Ishṭi and an animal sacrifice.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fires are described as seeking to devour the Brahmana's vital spirits
    when they have not been worshipped with offerings of new grain and an animal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A guest in the house is to be honoured according to ability with a seat, food,
    a couch, water, or roots and fruits.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Certain persons, including heretics, men following forbidden occupations,
    rogues, logicians arguing against the Veda, and men said to live like cats or
    herons, are not to be honoured even by greeting.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Snatakas, Veda-studying or vow-completing persons, householders, and Srotriyas
    are to be worshipped with gifts of food sacred to gods and manes, while different
    persons are to be avoided.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A householder must give food to those who do not cook for themselves and distribute
    food to all beings without detriment to his own interest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A hungry Snataka may beg wealth from a king, from one for whom he sacrifices,
    and from a pupil, but not from others.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Snataka who is able to obtain food is not to waste away from hunger or wear
    old or dirty clothes if he has property.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Snataka is instructed to keep hair, nails, and beard clipped, subdue passions
    by austerities, wear white garments, remain pure, study the Veda, and perform
    acts conducive to welfare.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Snataka is instructed to carry a bamboo staff, a water-filled pot, a sacred
    string, a bundle of Kusa grass, and to wear two bright golden earrings.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Snataka is prohibited from looking at the sun at setting, rising, eclipse,
    reflection in water, or at midday.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Snataka is prohibited from stepping over a rope to which a calf is tied,
    running when it rains, and looking at his own image in water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: He is instructed to pass by a mound of earth, a cow, an idol, a Brahmana,
    clarified butter, honey, a crossway, and well-known trees with his right hand
    toward them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: He is instructed not to approach his wife when her courses appear and not
    to sleep with her in the same bed at that time.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: Approaching a woman covered with menstrual excretions is said to diminish
    wisdom, energy, strength, sight, and vitality; avoiding her in that condition
    is said to increase them.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:16
  text: He is instructed not to eat in the company of his wife or look at her while
    she eats, sneezes, yawns, or sits at ease.
  category: action
  evidence_refs:
  - ev:9
