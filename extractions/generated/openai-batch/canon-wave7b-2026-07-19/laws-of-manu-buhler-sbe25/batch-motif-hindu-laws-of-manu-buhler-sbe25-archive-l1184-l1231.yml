  summary: The passage discusses textual relationships among Dharma-sutra and Dharma-sastra
    materials. It states that an ancient Vaikhanasa Sutra preceded the Manu-smriti,
    then compares Manu VIII, 140 with Vasishtha Dharmasastra III, 51 on legal interest
    for money-lenders. The editor notes that both passages give the same rate, while
    cautioning that direct use of the Vasishtha Dharmasastra by the author of Manu
    is not easily proven because the Vasishtha passage is itself marked as a quotation.
  language: English
