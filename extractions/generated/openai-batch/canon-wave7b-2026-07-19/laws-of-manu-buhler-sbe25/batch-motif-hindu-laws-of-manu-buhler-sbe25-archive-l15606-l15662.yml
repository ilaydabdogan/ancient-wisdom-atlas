canonical_text:
  quote: ''
  summary: The passage sets rules for lawful and unlawful meat consumption. Meat is
    allowed in sacrificial and ancestral or divine honor contexts, but persistent
    or unlawful use is condemned. Unlawful eating brings postmortem reversal in which
    victims eat the eater; refusal to eat meat when ritually obligated brings rebirth
    as an animal for twenty-one existences. Flesh should be consecrated by Mantras
    or Vedic texts, and a symbolic animal of clarified butter or flour may be used
    when there is desire for meat without lawful reason to kill.
  language: English
  quote_policy: summarized
