canonical_text:
  quote: ''
  summary: The opening of Chapter IX announces laws for husbands and wives and states
    rules about women being kept under male guardianship. It describes protection
    by father, husband, and sons; censures male relatives who fail in specified duties;
    and presents guarding wives as preserving offspring, conduct, family, self, and
    merit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker announces that he will propound eternal laws for a husband and
    wife who follow duty, whether united or separated.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Women are said to be kept in dependence day and night by the males of their
    families, and those attached to sensual enjoyments are to be kept under control.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A woman's father is described as protecting her in childhood, her husband
    in youth, and her sons in old age; the passage states that a woman is never fit
    for independence.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage calls a father reprehensible if he does not give his daughter
    in marriage at the proper time, a husband reprehensible if he does not approach
    his wife in due season, and a son reprehensible if he does not protect his mother
    after her husband has died.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Women are said to require guarding against evil inclinations, and lack of
    guarding is said to bring sorrow on two families.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Guarding wives is presented as a highest duty for all castes, and even weak
    husbands are instructed to strive to do it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A man who carefully guards his wife is said to preserve the purity of offspring,
    virtuous conduct, his family, himself, and his means of acquiring merit.
  category: sequence
  evidence_refs:
  - ev:7
