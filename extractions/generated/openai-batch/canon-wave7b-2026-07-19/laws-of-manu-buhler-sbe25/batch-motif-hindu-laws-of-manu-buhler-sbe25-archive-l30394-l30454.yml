canonical_text:
  quote: ''
  summary: 'The passage gives notes on variant readings and interpretations of purification
    terms, then prescribes graded expiations for theft: year-long Krikkhra penances
    for a twice-born chief stealing valuable property, grain, or cooked food from
    a caste-fellow; lunar penance for stealing persons or appropriating a field, house,
    or water; restoration plus Samtapana Krikkhra for small-value theft; and swallowing
    the five products of the cow as atonement for stealing various goods.'
  language: English
  quote_policy: summarized
