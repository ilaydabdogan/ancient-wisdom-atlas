canonical_text:
  quote: ''
  summary: Rules and commentary on impurity, purification by bathing or sipping water,
    recitation of texts to Surya and the Pavamani verses, contact with bones and corpses,
    restrictions on water libations to the dead, student obligations toward dead teachers
    or parents, and removal of a dead Sudra through the southern gate.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A commentary states that a mourner should not choose a longer impurity period
    in order to avoid sacred duties; another view treats the rule as an exhortation
    not to delay the required bath.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Touching a Candala, menstruating woman, outcast, woman in childbed, corpse,
    or one who touched a corpse is followed by purification through bathing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After sipping water, seeing an impure thing or person is followed by muttering
    sacred texts addressed to Surya and the Pavamani verses.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Brahmana who touches a human bone with fat becomes pure by bathing; if the
    bone is without fat, purity is obtained by sipping water and then touching a cow
    or looking at the sun.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: One who has undertaken a vow is told not to pour libations to the dead until
    the vow is complete; after offering water upon completion, he becomes pure in
    three days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Water libations are not to be offered to several listed categories, including
    those said to have been born in vain, those born from illegal caste mixture, certain
    ascetics, suicides, and women described with specified transgressions.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A student does not break his vow by carrying out the dead body of his teacher,
    sub-teacher, father, mother, or Guru.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A dead Sudra is to be carried out through the southern gate of the town.
  category: action
  evidence_refs:
  - ev:8
