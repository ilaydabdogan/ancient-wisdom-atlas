canonical_text:
  quote: ''
  summary: 'Instructions to a king after conquest and during diplomacy: ascertain
    the conquered people’s wishes, install a relative of the defeated ruler, respect
    local lawful customs, distribute or seize property at the proper time, reckon
    with both fate and human effort, seek gains of friend, gold, and land, secure
    the rear before expeditions, value dependable allies, assess foes and neutrals
    by qualities, and abandon even a good country if self-preservation requires it.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After conquest, the king is told to ascertain the wishes of the conquered
    and place a relative of the defeated ruler on the throne under imposed conditions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king is told to make the inhabitants’ lawful customs authoritative and
    to honour the new king and his chief servants with precious gifts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says seizure and distribution of desirable property may be recommended
    when done at the proper time, even though one causes displeasure and the other
    pleasure.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Undertakings are said to depend on both fate and human exertion; fate is described
    as unfathomable, while action is possible in human work.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A king bent on conquest may regard friend, gold, and land as a triple result
    of an expedition, make peace with a foe, and return to his realm.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Before securing the fruit of an expedition, the conqueror is instructed to
    attend to a neighbouring king who might attack from the rear and to the supporter
    who opposes that rear attacker.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A firm friend is valued as a greater source of strength than gold and land;
    even a weak friend is praised if righteous, grateful, attached, persevering, and
    supported by contented people.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: A dangerous foe is described as wise, noble, brave, clever, liberal, grateful,
    and firm.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: A neutral who may be courted is described through virtues including Aryan
