canonical_text:
  quote: ''
  summary: A royal-law passage instructs the king to collect revenue through trustworthy
    officials, obey sacred law, treat subjects like a father, appoint supervisors,
    honor learned Brahmanas, give gifts whose rewards are described as imperishable
    and otherworldly, and follow Kshatriya battle duties while avoiding prohibited
    weapons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king is instructed to collect annual revenue by trustworthy officials,
    obey sacred law in dealings with the people, and behave like a father toward all
    men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king is instructed to appoint intelligent supervisors for branches of
    business, and those supervisors are to inspect the acts of people transacting
    the king's business.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king is instructed to honor Brahmanas who have returned from their teacher's
    house after Vedic study.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Money given to Brahmanas is described as an imperishable treasure or store
    for kings, not removable by thieves or foes and not subject to loss.
  category: object
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: An offering made through the mouth of a Brahmana is described as not being
    spilt, not falling to the ground, and not perishing, and is called more excellent
    than Agnihotras.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'The passage ranks rewards for gifts according to the recipient: ordinary
    reward for a non-Brahmana, double for one who calls himself a Brahmana, hundred-thousandfold
    for a well-read Brahmana, and endless reward for one who knows the Veda and Angas.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The size of reward for a gift is said to depend on the recipient's qualities
    and the giver's faith, and the reward is to be obtained in the next world.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A king who protects his people and is defied by foes is instructed not to
    shrink from battle, whether the foes are equal, stronger, or weaker, remembering
    the duty of Kshatriyas.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Not turning back in battle, protecting the people, and honoring Brahmanas
    are named as means for a king to secure happiness.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Kings who fight each other in battle with utmost exertion and do not turn
    back are said to go to heaven.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: When fighting foes, the king is forbidden to strike with weapons concealed
    in wood, barbed weapons, poisoned weapons, or weapons with points blazing with
    fire.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage begins a further rule that the king should not strike someone
