  summary: The passage prescribes duties and restrictions for Sudras, especially service
    to Brahmanas, material maintenance from Brahmanas, limits on ritual participation
    and wealth, and merit or blessedness gained by proper conduct and imitation of
    virtuous behavior without sacred recitation. It concludes that duties of the four
    castes in distress have been declared and turns next to penances.
