  summary: The passage is a scholarly discussion of the possible date of Bhrigu's
    Samhita relative to the Mahabharata, the Smritis of Yajnavalkya and Narada, and
    later commentarial evidence. It argues that Narada-smriti likely dates near the
    middle of the first millennium CE and that Bhrigu's Samhita must be considerably
    earlier, perhaps existing by at least the second century CE.
