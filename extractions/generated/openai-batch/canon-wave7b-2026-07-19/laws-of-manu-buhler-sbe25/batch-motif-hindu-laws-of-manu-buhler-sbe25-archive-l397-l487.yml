canonical_text:
  quote: ''
  summary: 'The introduction explains that metrical Smritis are framed by mythological
    traditions intended to establish divine authority. It summarizes the opening frame
    of the Manava Dharmashastra: sages ask Manu to explain sacred law; Manu recounts
    creation and his origin from Brahman, says he learned the Institutes from the
    creator, taught them to ten sages, and delegates exposition to Bhrigu. Bhrigu
    continues with creation, cosmic time divisions, caste duties, praise of Brahmanas
    and Manu''s Institutes, and the contents of the twelve chapters. The passage also
    notes later interruptions by sages, assertions of Manu''s authority, and a variant
    opening that adds a pupil-reciter in an unbroken teacher lineage.'
  language: English
  quote_policy: summarized
