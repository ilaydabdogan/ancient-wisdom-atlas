  quote: ''
  summary: The passage describes a cosmogony in which an indiscernible first cause
    produces Purusha/Brahman. The divine being resides in an egg for a year, divides
    it into two halves by thought, and from those halves forms heaven, earth, the
    middle sphere, directions, and the abode of waters. The passage then describes
    the production of mind, egoism, other principles and organs, and finally all beings
    through the joining of particles.
