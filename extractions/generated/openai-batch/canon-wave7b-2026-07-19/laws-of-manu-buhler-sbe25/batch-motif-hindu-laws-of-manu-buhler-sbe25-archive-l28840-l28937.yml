canonical_text:
  quote: ''
  summary: The passage gives rules for taking sacrificial articles, food, or property
    in specified conditions of ritual need or hunger. It permits taking from certain
    wealthy non-sacrificers, from those who neglect sacred duties, or from wicked
    holders for the benefit of the virtuous; it compares such redistribution to becoming
    a boat that carries both parties over misfortune. It also distinguishes the property
    of sacrificers as divine and that of non-sacrificers as Asuric, and instructs
    a righteous king not to punish the permitted taking but to provide lawful maintenance
    after inquiry.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An article required for completing a sacrifice may be taken from the house
    of a wealthy Vaisya with many cattle who does not perform sacrifices or drink
    Soma.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two or three sacrificial articles may be taken from a Sudra, with the stated
    reason that a Sudra has no business with sacrifices.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A person with one hundred cows who does not kindle the sacred fire, or with
    one thousand cows who does not drink Soma, may be a source from whom needed items
    are taken, even if the person is identified as a Brahmana or Kshatriya.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage permits taking from one who always takes, never gives, and refuses
    to give, and says the taker's fame and merit will increase.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A person who has not eaten for six meals may take food at the seventh meal-time
    from someone who neglects sacred duties, without making provision for the next
    day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The food may be taken from a threshing-floor, field, house, or wherever it
    is found; if the owner asks, the taker must state the deed and its cause.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A Kshatriya must not take the property of a virtuous Brahmana, but a starving
    person may appropriate possessions of a Dasyu or of someone who neglects sacred
    duties.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: One who takes property from the wicked and gives it to the virtuous is said
    to transform into a boat and carry both over the sea of misfortune.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The property of those who zealously sacrifice is called the property of the
    gods, while the wealth of those who perform no sacrifices is called the property
    of the Asuras.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: A righteous king is instructed not to punish the permitted appropriator and
    to provide maintenance after considering the person's dependents, learning, and
    conduct.
  category: action
  evidence_refs:
  - ev:7
