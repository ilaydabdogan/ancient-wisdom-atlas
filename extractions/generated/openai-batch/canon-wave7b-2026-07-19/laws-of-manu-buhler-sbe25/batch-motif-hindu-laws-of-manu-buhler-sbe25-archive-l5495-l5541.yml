canonical_text:
  quote: ''
  summary: The passage argues that early literary and inscriptional allusions confirm
    the antiquity and influence of the laws of Manu. Its clearest example is Bharavi's
    Kiratarjuniya I.9, where Yudhishthira's spy describes Duryodhana as conquering
    internal foes, following a difficult path taught by Manu, and observing the day-and-night
    division of royal duties. The passage interprets this as probably alluding to
    the seventh chapter of Bhṛgu's version of the Manu-smṛti, while noting that it
    might otherwise be read as a general belief that Manu established human and royal
    duties.
  language: English
