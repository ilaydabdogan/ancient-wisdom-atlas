canonical_text:
  quote: ''
  summary: The passage reports commentarial accounts of Manu's identity and authority.
    Govindaraja describes Manu as a great Veda-knowing sage entrusted with creation,
    preservation, and destruction of the world. Kulluka accepts the etymology from
    knowing the Veda but identifies Manu as a manifestation or incarnation of the
    supreme Soul. Medhatithi and Kulluka cite Sruti, Smrti, Brhaspati-smrti, and the
    Mahabharata to support the authority and pre-eminence of the Manu-smrti and Manu's
    laws.
  language: English
  quote_policy: summarized
