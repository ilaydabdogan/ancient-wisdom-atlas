canonical_text:
  quote: ''
  summary: The passage gives rules about Brahmanas, hunger, gifts, ritual service,
    expiation, gleaning, requests to a king, ranked forms of property, and lawful
    acquisition. It opens with Visvamitra, though knowing right and wrong, approaching
    to eat a dog's haunch from a Chandala when tormented by hunger. It then ranks
    accepting gifts as more reprehensible than teaching or sacrificing for low or
    unworthy persons, prescribes forms of expiation, recommends gleaning grain over
    accepting gifts, permits hungry Snataka Brahmanas to ask a king for support, ranks
    various accepted goods by blameworthiness, and lists seven lawful ways of acquiring
    property.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Visvamitra is described as knowing right and wrong, being tormented by hunger,
    and approaching to eat the haunch of a dog received from a Chandala.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage compares accepting gifts from low men, sacrificing for them, and
    teaching them, and states that accepting gifts is the meanest and most reprehensible
    for a Brahmana because of results in the next life.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sacrificing and teaching are described as acts performed for men who have
    received sacraments, while accepting gifts can occur even when the giver is a
    lowest-class Sudra.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Guilt from sacrificing for or teaching unworthy men is said to be removed
    by muttering sacred texts and burnt offerings; guilt from accepting gifts is said
    to be removed by throwing the gifts away and by austerities.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Brahmana unable to maintain himself is advised to glean ears or grains from
    any field, with picking up single grains ranked as more laudable than accepting
    gifts.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Snataka Brahmanas who are hungry or lack common-metal utensils or other property
    may ask the king for these things, and a king who is not liberal is to be left.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The acceptance of an untilled field is ranked as less blamable than a tilled
    field, and the passage further ranks cows, goats, sheep, gold, grain, and cooked
    food by increasing blameworthiness.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'Seven lawful modes of acquiring property are listed: inheritance, finding
    or friendly donation, purchase, conquest, lending at interest, work, and accepting
    gifts from virtuous men.'
  category: other
  evidence_refs:
  - ev:7
