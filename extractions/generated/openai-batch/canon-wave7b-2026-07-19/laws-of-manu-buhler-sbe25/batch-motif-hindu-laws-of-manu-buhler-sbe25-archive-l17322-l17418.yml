canonical_text:
  quote: ''
  summary: 'The passage gives rules for an ascetic: indifference, waiting for the
    appointed time without desiring life or death, bodily and verbal purity, patience
    under insult, truthfulness, solitude, yogic practice, abstinence from sensual
    enjoyment, regulated begging, nonviolence, simple implements, permitted vessel
    materials, and avoidance of using omens, astrology, palmistry, advice, or scriptural
    exposition to obtain alms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Life in solitude and indifference toward everything are described as marks
    of one who has attained liberation.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ascetic is instructed not to desire death or life, but to wait for the
    appointed time like a servant waiting for wages.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: He is instructed to purify foot placement by sight, drinking water by straining
    with cloth, speech by truth, and to keep his heart pure.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: He is instructed to bear hard words patiently, not insult anyone, and not
    become anyone's enemy for the sake of the perishable body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: He is instructed not to respond to anger with anger, to bless when cursed,
    and not to utter speech devoid of truth at the seven gates.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: He is instructed to delight in what refers to the Soul, sit in prescribed
    Yoga postures, be independent, abstain entirely from sensual enjoyments, live
    with himself as his only companion, and desire the bliss of final liberation.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: He is forbidden to seek alms by explaining prodigies and omens, by astrology
    and palmistry, by giving advice, or by exposition of the Sastras.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: He is instructed not to go near a house filled with hermits, Brahmanas, birds,
    dogs, or other mendicants in order to beg.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: With hair, nails, and beard clipped, he is to carry an alms-bowl, a staff,
    and a water-pot, wander continually, control himself, and not hurt any creature.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: His vessels are not to be made of metal, are to be free from fractures, and
    are to be cleansed with water like cups used at a sacrifice.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: A gourd, a wooden bowl, an earthen dish, or a vessel made of split cane are
    declared by Manu, son of Svayambhu, to be suitable vessels for an ascetic.
  category: object
  evidence_refs:
  - ev:10
- id: obs:12
  text: He is instructed to beg once a day and not be eager for a large quantity of
    alms, because eagerness for alms attaches an ascetic to sensual enjoyments.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: A note reports several explanations of the phrase 'seven gates,' including
