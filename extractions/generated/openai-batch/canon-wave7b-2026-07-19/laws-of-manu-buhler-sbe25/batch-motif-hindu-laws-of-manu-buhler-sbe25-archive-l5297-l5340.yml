  quote: ''
  summary: The passage discusses Brhaspati's engagement with Manu's legal rules, including
    debt recovery, Niyoga, gambling, indivisible property, subsidiary sons, and the
    appointed daughter. It argues that Brhaspati knew and accepted Manu's teaching,
    that his work may be viewed as a revised and enlarged form of the Bhrigu-samhita,
    and that this accords with a Skanda-purana tradition about Brhaspati composing
    one version of Manu's Dharmasastra.
