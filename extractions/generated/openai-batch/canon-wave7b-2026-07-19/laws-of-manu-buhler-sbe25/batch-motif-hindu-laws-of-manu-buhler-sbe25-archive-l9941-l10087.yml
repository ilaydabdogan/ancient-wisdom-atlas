canonical_text:
  quote: ''
  summary: 'The passage gives rules for a student under the vow of studentship: begging
    while pure and silent, avoiding those accused of mortal sin, bringing sacred fuel
    and making morning and evening fire oblations, subsisting on alms, observing restrictions
    around ritual meals, studying the Veda, serving the teacher, controlling body
    and speech, displaying bodily deference to the teacher, avoiding disrespectful
    naming or mimicry, and withdrawing from places where the teacher is censured or
    defamed.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If no virtuous men of the previously named kind are available, the student
    may go to each house in the village while pure and silent, but must avoid Abhisastas,
    described as those accused of mortal sin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The student brings sacred fuel from a distance, does not place it on the ground,
    and uses it for burnt oblations to the sacred fire in the evening and morning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A student who is not sick and neglects both begging and offering fuel in the
    sacred fire for seven successive days must perform the penance of an Avakirnin,
    one who has broken his vow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: One who performs the vow of studentship is to subsist constantly on alms and
    not on food from only one person; begged food is declared equal in merit to fasting.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: When invited, the student may eat food at a rite in honour of the gods or
    at a funeral meal in honour of the manes, while observing the vow and behaving
    like a hermit.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the meal-related duty is prescribed for a Brahmana
    only and is not ordained for a Kshatriya or a Vaisya.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Whether ordered by his teacher or not, the student is to exert himself in
    studying the Veda and in doing what is serviceable to his teacher.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The student is instructed to control body, speech, sense organs, and mind,
    and to stand with joined hands while looking at the teacher's face.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The student is to keep his right arm uncovered, behave decently, keep his
    body well covered, and sit down facing the teacher when told to be seated.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the teacher's presence the student is to eat less, wear less valuable dress
    and ornaments, rise earlier, and go to rest later.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The student is not to answer or converse with the teacher while reclining,
    sitting, eating, standing, or with an averted face; instead he must adjust his
    posture and movement in relation to the teacher's posture and movement.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: When the teacher is near, the student's bed or seat is to be low, and within
    sight of the teacher he must not sit carelessly at ease.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: The student is not to pronounce the teacher's mere name without an honorific
    title, even behind his back, and is not to mimic the teacher's gait, speech, or
    deportment.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Where people censure or defame the teacher, the student must cover his ears
    or leave for another place.
  category: action
  evidence_refs:
  - ev:11
