  quote: ''
  summary: Verses XI.149-162 prescribe penances and purification procedures for contact
    with spirituous liquor, accidental swallowing of impure substances, eating forbidden
    foods or leftovers, and student violations involving food. The passage also cites
    related Dharmaśāstra loci in notes and transitions to penances for theft.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who touches, gives, receives spirituous liquor, or drinks water left
    by a Śūdra is instructed to drink water boiled with Kuśa-grass for three days.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Brahmana who has partaken of Soma and smells the odor from a drinker of
    Sura is said to become pure by suppressing breath three times in water and eating
    clarified butter.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Men of the three twice-born castes who unintentionally swallow ordure, urine,
    or anything touched by Sura must be initiated again.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The second initiation of twice-born men omits tonsure, sacred girdle, staff,
    begging, and student vows.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eating food from persons whose food must not be eaten, leavings of women and
    Śūdras, or forbidden flesh requires drinking barley-gruel for seven days and nights.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Several ingestion offenses involving sour fluids, animal excretions, dried
    or unknown meat, mushrooms, carnivorous animals, pigs, camels, cocks, crows, donkeys,
    and human flesh are assigned named penances.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A student who has not returned from the teacher's house and eats food given
    at a monthly Śrāddha is instructed to fast for three days and spend one day standing
    in water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A student who eats honey or meat must perform an ordinary Kṛcchra penance
    and afterwards complete the vow of studentship.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Eating food left by certain animals or food into which hair or an insect has
    fallen requires drinking a decoction of the Brahmasuvarcala plant.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A person desiring purity is told not to eat forbidden food, to vomit unintentionally
    eaten forbidden food, or quickly atone by means of purification.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage closes the rules on forbidden food and introduces penances that
    remove the guilt of theft.
  category: sequence
  evidence_refs:
  - ev:9
