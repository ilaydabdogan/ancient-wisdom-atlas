canonical_text:
  quote: ''
  summary: 'The passage enumerates minor ritual, social, verbal, and bodily offenses
    and assigns specific penances or purifications: Krichchhra penances, barley subsistence,
    breath suppression, regulated eating, Vedic recitation, oblations, bathing, touching
    a cow, fasting, salutation, and prostration. Translator notes compare several
    rules with other Dharma texts and commentarial explanations.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person connected with sacrifices for Vratyas, strangers' obsequies, a destructive
    magic sacrifice, or an Ahina sacrifice removes guilt by three Krichchhra penances.
  category: action
  evidence_refs:
  - ev:1
  - ev:10
- id: obs:2
  text: A twice-born man who rejects a suppliant for protection or improperly divulges
    the Veda atones by subsisting for a year on barley.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A person bitten by named animals or by a man becomes pure by suppressing the
    breath, identified as Pranayama.
  category: action
  evidence_refs:
  - ev:3
  - ev:11
- id: obs:4
  text: Persons excluded from society at repasts are purified by a month-long regimen
    involving eating only at each sixth meal-time, reciting the Samhita, and daily
    Sakala oblations.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:12
- id: obs:5
  text: A Brahmana who voluntarily rides in a carriage drawn by camels or asses, or
    who bathes naked, becomes pure by suppressing the breath.
  category: action
  evidence_refs:
  - ev:5
  - ev:11
- id: obs:6
  text: A person who relieves bodily necessities without water or in water becomes
    pure by bathing outside the village in his clothes and touching a cow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Fasting is prescribed as the penance for omitting daily Vedic rites and for
    neglecting the special duties of a Snataka.
  category: action
  evidence_refs:
  - ev:7
  - ev:13
- id: obs:8
  text: A person who says 'Hum' to a Brahmana or addresses a superior as 'Thou' must
    bathe, fast for the rest of the day, and appease the offended person by reverential
    salutation.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:13
- id: obs:9
  text: A person who strikes a Brahmana even with grass, ties him by the neck with
    a cloth, or conquers him in an altercation must appease him by prostration.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:13
- id: obs:10
  text: The notes identify the excluded repast category as also called Panktidoshanas,
    glossed as defilers of the company.
  category: attribute
  evidence_refs:
  - ev:12
