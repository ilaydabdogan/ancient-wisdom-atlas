literal_observations:
- id: obs:1
  text: The passage lists several persons who are not to be struck, including one
    on an eminence, a eunuch, a person joining the palms in supplication, one fleeing
    with loose hair, one sitting, and one saying, "I am thine."
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Additional persons not to be struck include one who sleeps, has lost armor,
    is naked, is disarmed, merely looks on without fighting, or is already fighting
    another foe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage adds cases involving broken weapons, sorrow, serious wounds, fear,
    and flight, and instructs remembrance of the duty of honourable warriors.
  category: action
  evidence_refs:
  - ev:2
  - ev:7
- id: obs:4
  text: A Kshatriya slain in battle while turning back in fear is said to take on
    the sin of his master, while the master takes whatever merit for the next world
    belongs to a man slain in flight.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Chariots, horses, elephants, parasols, money, grain, cattle, women, marketable
    goods, and valueless metals taken singly in conquest are assigned to the individual
    captor.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Vedic text is invoked to say that soldiers should present a choice portion
    of booty to the king, and that booty not taken singly should be distributed by
    the king among all soldiers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The warfare rule is described as a blameless, primeval law for warriors from
    which a Kshatriya must not depart when striking foes in battle.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The king is instructed to gain what is not yet gained, preserve what is gained,
    augment what is preserved, and bestow what is augmented on worthy men.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The king is instructed to be ready to strike, display prowess, conceal secrets,
    and explore the foe's weaknesses.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage says that the world stands in awe of one always ready to strike,
    and instructs the king to make all creatures subject to himself, even by force.
  category: action
  evidence_refs:
  - ev:10
