  summary: The passage gives rules for Kshatriya warfare, including persons not to
    be struck, consequences for being killed while fleeing, allocation of booty, the
    king's portion and distribution duties, and royal statecraft involving acquisition,
    preservation, augmentation, generosity, readiness, secrecy, and force.
  language: English
