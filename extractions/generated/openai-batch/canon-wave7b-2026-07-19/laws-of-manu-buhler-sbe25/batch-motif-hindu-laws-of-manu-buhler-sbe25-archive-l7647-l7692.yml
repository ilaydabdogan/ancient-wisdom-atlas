  summary: The passage describes the transmission of the Institutes of sacred law
    from an earlier teacher to Manu, from Manu to Marici and other sages, and then
    through Bhrigu to assembled sages. It also lists seven Manus who produced and
    protected creation in their allotted periods, and gives a sequence of time units
    from nimesha to day and night.
