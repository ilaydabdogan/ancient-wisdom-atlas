    then take counsel with ministers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Private consultation is to occur unobserved in a secluded place such as the
    back of a hill, a terrace, or a solitary forest.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The text states that a king whose secret plans are not discovered will enjoy
    the whole earth even if poor in treasure.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: At consultation, the king is told to remove listed groups of persons and animals;
