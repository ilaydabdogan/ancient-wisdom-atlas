  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king is to deliberate at midday or midnight, when mental and bodily fatigue
    is over, either alone or with ministers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
