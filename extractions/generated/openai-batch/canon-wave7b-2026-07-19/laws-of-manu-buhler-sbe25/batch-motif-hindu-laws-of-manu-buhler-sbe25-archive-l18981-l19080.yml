canonical_text:
  quote: ''
  summary: 'The passage gives instructions for a king: after ritual offerings and
    worship he enters an auspicious audience hall, receives subjects, dismisses them,
    and consults ministers privately. It prescribes secluded places and safeguards
    for secret counsel, states that undiscovered plans bring dominion, and lists topics
    for deliberation including virtue, pleasure, wealth, family matters, ambassadors,
    undertakings, harem affairs, spies, neighbouring rulers, and enemies. Notes cite
    related passages and commentarial explanations for secluded consultation, spies,
    and geopolitical categories.'
  language: English
  quote_policy: summarized
