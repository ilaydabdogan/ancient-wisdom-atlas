  quote: ''
  summary: A scholarly introduction discusses the dating of the Manu-smriti through
    linguistic and inscriptional evidence concerning the word Pahlava/Pahlav, its
    relation to Parthava and the Parthians, Professor Noldeke's proposed chronology,
    counterarguments from Kanishka's coins, and the occurrence of Pahlava in Rudradaman's
    Girnar inscription.
  language: English
  quote_policy: summarized
