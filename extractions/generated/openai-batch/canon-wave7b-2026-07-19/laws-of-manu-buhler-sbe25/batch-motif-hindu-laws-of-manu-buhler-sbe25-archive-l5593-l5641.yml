- id: obs:3
  text: Professor Noldeke is said to infer that Pahlav could not have originated among
    Iranians before the first century A.D. and could not have been introduced into
    India before the second century A.D.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
