canonical_text:
  quote: ''
  summary: 'Verses 112-119 regulate the transmission and reception of sacred knowledge:
    teaching is withheld from unworthy recipients, Sacred Learning is personified
    as a treasure to be guarded and entrusted only to a qualified Brahmana, unauthorized
    acquisition of the Veda is treated as theft leading to hell, students are told
    to salute teachers, and self-control is valued above broad Vedic learning without
    discipline. The final verse in the supplied passage begins an incomplete rule
    about not sitting on a couch or seat.'
  language: English
  quote_policy: summarized
