canonical_text:
  quote: ''
  summary: 'This passage gives rules for conduct toward superiors and elders: one
    should not occupy a superior''s couch or seat, should rise and salute when a superior
    approaches, and should use formal words of greeting, including self-identification
    by name and the word bhoh. It states that reverence to the aged increases life,
    knowledge, fame, and strength, and that a Brahmana should receive a return blessing
    of long life.'
  language: English
  quote_policy: summarized
