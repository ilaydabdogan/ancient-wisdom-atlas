- id: obs:1
  text: A person should not occupy a couch or seat occupied by a superior; if seated,
    he should rise to meet and salute a superior.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When an elder approaches, the vital airs of a young man are said to mount
    upward to leave his body; rising and saluting causes him to recover them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Habitual salutation and reverence to the aged are said to increase four things:
    length of life, knowledge, fame, and strength.'
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Brahmana greeting an elder must pronounce his name after the word of salutation,
    saying that he is named N. N.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: When people do not understand the salutation after a name is pronounced, a
