canonical_text:
  quote: ''
  summary: 'The passage lists conditions under which Veda-study, recitation, or even
    mental attention to sacred texts must cease: foul smells, corpses, weeping, impurity,
    funeral rites and gifts, certain bodily postures, lunar days and eclipses, ominous
    weather and animal sounds, prohibited places, robber attacks, fire alarms, and
    portents.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those seeking great merit are told that Veda-study is to be continually interrupted
    in villages and towns and must cease whenever a foul smell is perceptible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Veda recitation must stop where a corpse lies, in the presence of a man described
    as living unrighteously like a Sudra, while weeping is heard, and in a crowd.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: A man must not even think of the sacred texts while in water, during the middle
    of the night, while voiding excrement, while impure, or after eating a funeral
    dinner.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A learned Brahmana must not recite the Veda for three days after accepting
    an invitation to an ancestor rite, during royal impurity caused by birth or death,
    or when Rahu makes the moon impure by eclipse.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Brahmana must also refrain from recitation as long as the smell and stains
    of food given in honor of one ancestor remain on his body.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Study is forbidden while lying on a bed, with feet raised, sitting with a
    cloth tied around the knees, after eating meat, or after eating food given by
    someone impure through birth or death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Study is prohibited during fog, when the sound of arrows is heard, during
    both twilights, and on specified lunar days; the passage says those days harm
    the teacher, pupil, or remembrance of the Veda.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Brahmana must not recite during a dust-storm, when the sky is preternaturally
    red, while jackals howl, while dogs bark, donkeys bray, or camels grunt, or while
    seated in company.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Study is forbidden near a burial-ground, near a village, in a cow-pen, in
    a garment worn during conjugal intercourse, or after receiving a present at a
    funeral sacrifice.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:10
  text: After a gift at a Sraddha, the passage says the recipient should not recite
    the Veda because the hand of a Brahmana is his mouth.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: If a village is beset by robbers, if a fire alarm is raised, or if portents
    occur, Veda-study must be interrupted until the same hour on the next day.
  category: sequence
  evidence_refs:
  - ev:9
