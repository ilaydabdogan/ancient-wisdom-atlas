canonical_text:
  quote: ''
  summary: 'The passage lists alternative penances for the guilt of slaying a Brahmana:
    skull-bearing mendicancy, exposure to archers or fire, named sacrifices, long
    Vedic walking, donation to a learned Brahmana, upstream travel along the Sarasvati
    with restricted food and recitation, and ascetic residence while serving cows
    and Brahmanas. Notes record variant interpretations and parallels in commentators,
    the Bhavishyapurana, and Srauta Sutra references for certain sacrifices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A penitent is described as subsisting on alms for twelve years and making
    the skull of a dead man his flag.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One alternative penance is to willingly become the target of archers who know
    his purpose, or to throw himself headlong three times into a blazing fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Another alternative is to offer one of several named sacrifices, including
    a horse-sacrifice, Svar^it, Gosava, Abhi^it, Visva^it, Trivr/t, or Agnish/ut.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another alternative for removing the guilt of slaying a Brahmana is to walk
    one hundred yojanas while reciting one of the Vedas, eating little, and controlling
    the organs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Another alternative is to present a learned Brahmana with the offender's whole
    property, maintenance wealth, or a furnished house.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Another alternative is to subsist on sacrificial food and walk upstream along
    the whole course of the Sarasvati, or to restrict food and mutter the Samhita
    of a Veda three times.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Another alternative is to shave all hair and dwell at the edge of a village,
    in a cow-pen, in a hermitage, or at the root of a tree, while taking pleasure
    in doing good to cows and Brahmanas.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Notes attribute different applications of these penances to commentators and
    to the Bhavishyapurana, especially distinctions involving intentional or unintentional
    killing and the status of the killer and victim.
  category: other
  evidence_refs:
  - ev:8
  - ev:10
  - ev:11
  - ev:12
- id: obs:9
  text: A note connects several named sacrifices with Srauta Sutra passages and records
    disagreement among commentators about how some sacrifice names are to be parsed.
  category: other
  evidence_refs:
  - ev:9
