  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sons begotten by twice-born men on wives of the next lower castes are said
    to be similar to their fathers but blamed because of a fault attributed to their
    mothers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage distinguishes children born of women one degree lower from those
    born of women two or three degrees lower than their husbands.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Brahmana with the daughter of a Vaisya is said to produce a son called an
    Ambashtha; a Brahmana with the daughter of a Sudra is said to produce a Nishada,
    also called a Parasava.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A Kshatriya and the daughter of a Sudra are said to produce a being called
    Ugra, described as resembling both a Kshatriya and a Sudra and as ferocious and
    delighting in cruelty.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Children of a Brahmana by women of the three lower castes, of a Kshatriya
    by wives of the two lower castes, and of a Vaisya by a wife of the caste below
    him are collectively called base-born, apasada.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Kshatriya by the daughter of a Brahmana is said to produce a Suta; a Vaisya
    by females of the royal and Brahmana castes is said to produce a Magadha and a
    Vaideha.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A Sudra by Vaisya, Kshatriya, and Brahmana females is said to produce an Ayogava,
    a Kshattri, and a Kandala, described as the lowest of men and as arising from
    confusion of castes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage compares offspring in direct caste order with offspring in inverse
    caste order, naming Ambashtha and Ugra on one side and Kshattri and Vaidehaka
    on the other.
  category: relationship
  evidence_refs:
  - ev:8
