  quote: ''
  summary: The passage gives rules for classifying children born from unions between
    members of different castes, naming several mixed-caste offspring and distinguishing
    direct and inverse caste order. Editorial notes cite commentators and a Vedic
    story about Gabala Satyakama as a discussed case concerning uncertain paternity
    and Brahmana status.
