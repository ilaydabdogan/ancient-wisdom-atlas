  quote: No greater crime is known on earth than slaying a Brahma/za
  summary: The passage gives rules and penalties for sexual offenses involving guarded
    or unguarded women of different castes, distinguishes fines by status and consent,
    prescribes tonsure rather than capital punishment for a Brahmana, forbids a king
    to kill a Brahmana, and includes a fragment mentioning burning in a fire of dry
    grass. Notes define “guarded” and cite related legal sources.
  language: English
