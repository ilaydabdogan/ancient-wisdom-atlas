- id: obs:3
  text: If the teacher dies, a perpetual student is instructed to serve the teacher’s
    qualified son, the teacher’s widow, or the teacher’s Sapi^a in the same manner
    as the teacher.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If none of those persons are alive, the student must serve the sacred fire,
    standing by day and sitting during the night, and finish his life in that way.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Brahma^a who lives as a student without breaking his vow is said to reach
