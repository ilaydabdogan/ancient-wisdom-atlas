  quote: ''
  summary: The passage lists possible gifts to a teacher, prescribes continued service
    to the teacher’s qualified son, widow, or Sapi^a after the teacher’s death, directs
    service to the sacred fire if none of these remain alive, and states that a vow-keeping
    Brahma^a student attains the highest abode after death and is not born again.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A present for the venerable man may include a field, gold, a cow, a horse,
    a parasol and shoes, a seat, grain, or vegetables, according to the giver’s ability.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated purpose of the present is to give pleasure to the teacher.
  category: action
  evidence_refs:
