  summary: The passage instructs the king to proclaim crimes, punish offenders according
    to their crimes, guard likely haunts of thieves with soldiers and spies, use reformed
    thieves and pretexts to expose rogues, execute thieves under specified evidentiary
    conditions, punish those who shelter thieves, punish negligent guards and vassals,
    and fine a law-dependent person who departs from established law.
