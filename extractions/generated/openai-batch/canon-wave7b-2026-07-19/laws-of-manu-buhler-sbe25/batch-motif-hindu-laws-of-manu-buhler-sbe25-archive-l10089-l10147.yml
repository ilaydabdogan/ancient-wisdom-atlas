canonical_text:
  quote: ''
  summary: Rules and notes in the studentship section prescribe a student's conduct
    toward his teacher and other honored instructors or relatives, enumerate situations
    and places for sitting or saluting, and attach next-birth animal or insect consequences
    to offenses involving the teacher.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that teacher-related misconduct produces next-birth outcomes
    as an ass, dog, worm, or larger insect; visible offenses include falsely defaming
    the teacher, living on the teacher's substance, and envying his merit.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:2
  text: The student must not serve the teacher through another person while he himself
    stands aloof, while he is angry, or while a woman is near.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: If the student is seated in a carriage or on a raised seat, he must descend
    and afterwards salute the teacher.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The student must not sit with the teacher to leeward or windward, and must
    not say anything that the teacher cannot hear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The student may sit with the teacher in specified conveyances and places:
    a carriage drawn by oxen, horses, or camels, a terrace, a bed of grass or leaves,
    a mat, a rock, a wooden bench, or a boat.'
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the teacher's teacher is near, the student is to behave toward him as toward
    his own teacher.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Unless he has received permission from his teacher, the student is not to
    salute venerable persons of his own family.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The same constant behavior is also ordained toward other instructors in science
    and toward relatives to whom honor is due.
  category: relationship
  evidence_refs:
  - ev:7
