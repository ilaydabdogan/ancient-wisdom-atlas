canonical_text:
  quote: ''
  summary: 'The passage prescribes the daily duties of a householder, especially the
    five great sacrifices: recitation, burnt oblations, Bali offerings, reception
    of Brahmana guests, and offerings to the manes. It presents the householder as
    supporting other orders, living beings, gods, manes, Bhutas, guests, and dependents
    through ritual, food, and sacred knowledge. It also describes a ritual-cosmic
    sequence in which an oblation cast into fire reaches the sun, produces rain, becomes
    food, and sustains living creatures.'
  language: English
  quote_policy: summarized
