canonical_text:
  quote: ''
  summary: 'The passage gives legal rules for assault, hurt, and damage: compensation
    and fines for damaging goods; exceptions and liabilities for carriage accidents;
    graded penalties for killing or injuring humans and animals; and limits on beating
    certain household or dependent persons who have committed faults.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who damages another's goods, whether intentionally or unintentionally,
    must satisfy the owner and pay the king a fine equal to the damage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Damage to leather goods, wooden goods, clay goods, flowers, roots, and fruit
    is assigned a fine of five times the value.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage lists carriage-related circumstances in which no punishment for
    damage is imposed, including broken harness parts, broken axle or wheel, the carriage
    turning aside or back, and the driver's loud warning to make way.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a cart turns off the road through the driver's lack of skill and damage
    occurs, the owner is fined two hundred panas.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If a skilful driver is negligent, the driver alone is fined; if the driver
    is unskilful, the carriage occupants are each fined one hundred panas.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a carriage is stopped by cattle or another carriage and causes the death
    of a living being, a fine is imposed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'The penalties for deaths or injuries are graded by victim type: a killed
    man is treated like a theft case; large animals receive half that penalty; other
    animals receive smaller specified fines.'
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: A wife, son, slave, pupil, and younger full brother who have committed faults
    may be beaten with a rope or split bamboo.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Beating is restricted to the back part of the body and not to a noble part;
    striking otherwise incurs the same guilt as a thief.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage closes the section on assault and hurt and announces rules for
    theft.
  category: sequence
  evidence_refs:
  - ev:7
