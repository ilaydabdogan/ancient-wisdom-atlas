canonical_text:
  quote: ''
  summary: 'The passage gives rules about refusing offerings, even water, to certain
    Brahmanas: those acting like a cat, those acting like a heron, and those unacquainted
    with the Veda. It states that property given to such persons causes misery in
    the next world to both giver and recipient, compares ignorant donor and donee
    to someone sinking while trying to cross water in a stone boat, defines the cat-like
    and heron-like types as forms of hypocrisy or false gentleness, and says such
    Brahmanas fall into the hell Andhatamisra. A translator''s note explains the bird
    term translated as heron and its proverbial background. Verse 198 begins but is
    incomplete in the supplied passage.'
  language: English
  quote_policy: summarized
