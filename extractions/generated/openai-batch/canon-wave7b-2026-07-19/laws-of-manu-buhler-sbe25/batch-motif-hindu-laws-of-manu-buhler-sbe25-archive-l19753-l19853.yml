canonical_text:
  quote: Justice, being violated, destroys; justice, being preserved, preserves
  summary: The passage states that justice must not be violated, describes divine
    justice as a bull, assigns guilt for unjust judgments, restricts who may interpret
    law for the king, warns of a kingdom's decline when law is improperly settled,
    and prescribes ritual preparation and caste-ordered examination of legal causes.
  language: English
  quote_policy: quoted
literal_observations:
