canonical_text:
  quote: ''
  summary: The passage gives rules for a householder’s hospitality, including ranking
    and feeding guests, giving priority to certain vulnerable persons, eating only
    after guests, dependents, and ritual recipients have been honored, condemning
    food prepared only for oneself, prescribing honor with the honey-mixture for specified
    visitors, and directing the wife to make an evening Bali-oblation as part of the
    Vaisvadeva rite.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Guests are to receive beds, attendance at departure, and honor during their
    stay according to their relative distinction or equality.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a guest arrives after the Vaisvadeva offering is finished, the householder
    gives food according to ability but does not repeat the Bali offering.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Brahmana is told not to name his family or Vedic gotra in order to obtain
    a meal; one who boasts of them for a meal is called a foul feeder by the wise.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a Brahmana’s house, Kshatriya, Vaisya, Sudra, personal friend, relative,
    and teacher are not classified as guests in the same sense as an atithi.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Kshatriya arriving in the manner of a guest may be fed after the Brahmanas
    have eaten; Vaisya and Sudra visitors in the manner of guests may eat with the
    servants.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Friends and similar visitors who come out of affection may be given seasoned
    food according to the householder’s ability, together with his wife.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Newly married women, infants, the sick, and pregnant women may be fed before
    guests.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A man who eats first without feeding these priority persons is said, after
    death, to be devoured by dogs and vultures.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The householder and his wife eat what remains after Brahmanas, kinsmen, and
    servants have dined.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:10
  text: The householder eats remaining food after honoring gods, sages, men, manes,
    and guardian deities of the house.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Food prepared for oneself alone is described as sin, while food remaining
    after sacrifices is ordained as the meal of virtuous men.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:12
  text: A king, officiating priest, Snataka, teacher, son-in-law, father-in-law, and
    maternal uncle are to be honored with the honey-mixture if they return after a
    full year.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: A king and Srotriya who come during the performance of a sacrifice must be
    honored with the honey-mixture, but not when no sacrifice is being performed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: The wife offers an evening portion of dressed food as a Bali-oblation without
    sacred formulas; the Vaisvadeva rite is prescribed in both morning and evening.
  category: action
  evidence_refs:
  - ev:6
