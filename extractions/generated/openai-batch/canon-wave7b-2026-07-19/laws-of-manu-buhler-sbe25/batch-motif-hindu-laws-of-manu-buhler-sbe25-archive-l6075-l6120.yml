  summary: The passage is an editorial and source-critical discussion about Madanapala's
    completion or restoration of a defective manuscript of the Bhashya, the place
    of that restoration, genealogical identification of Madana/Madanapala, and chronological
    arguments involving the Madanavinoda, the Madanaparijata, manuscript readings,
    and proposed dates.
