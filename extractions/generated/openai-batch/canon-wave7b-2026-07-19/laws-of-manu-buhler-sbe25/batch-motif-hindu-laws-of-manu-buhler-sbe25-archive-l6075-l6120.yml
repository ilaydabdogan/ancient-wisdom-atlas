literal_observations:
- id: obs:1
  text: The writer agrees with Professor Jolly that Madanapala did not cause portions
    of the Bhashya to be recomposed, but completed a defective manuscript from a copy
    obtained elsewhere in India.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage locates the restoration at Kash/M near Delhi.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage identifies Madana, son of Sahara/za, with Madana or Madanapala,
    the patron of Vi^ve^varabha//a.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Vi^ve^varabha//a is said to have written the Subodhini on the Mitakshara and
    the Prayoga- or Madanapari^ata.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Vi^ve^vara's introduction to the latter work is said to give part of his patron's
    genealogy, including that Madana belonged to the family of the chiefs of Kash/Zza
    and was the second son of Sadhara/za.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage explains the form Sahara?za as a Prakritic form used instead of
