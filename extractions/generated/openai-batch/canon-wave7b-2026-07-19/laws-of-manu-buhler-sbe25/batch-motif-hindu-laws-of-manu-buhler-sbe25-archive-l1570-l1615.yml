canonical_text:
  quote: ''
  summary: The passage is a scholarly introduction comparing Kamandaki's statements
    about Manu with passages in the received Manu text, especially on branches of
    learning, ministers, and duties of kings. It argues that Kamandaki likely knew
    an older Manava Dharma-sutra associated with a school, and it comments on the
    usual treatment of Manu's authority by Hindu legal writers. A footnote questions
    an editor's assertion that the Nitisara's author was Buddhist.
  language: English
  quote_policy: summarized
