canonical_text:
  quote: Whatever (a man), full of faith, duly gives according to the prescribed rule,
    that becomes in the other world a perpetual and imperishable (gratification) for
    the manes.
  summary: 'The passage gives rules for Sraddha or funeral sacrifice: specified foods
    and times satisfy the manes for varying durations, faithful offerings benefit
    them in the other world, lunar and seasonal timing is prescribed, night is avoided
    because it belongs to Rakshasas, and water, fire, sacred-thread placement, and
    grass are included in ritual directions.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Different foods are said to satisfy the manes for specified durations, from
    six months to endless time.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Food mixed with honey, given on the thirteenth lunar day in the rainy season
    under Magha, is said to procure endless satisfaction.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The manes are represented as wishing for a family-born man who will give milk-rice
    with honey and clarified butter on a specified thirteenth lunar day and afternoon
    sign.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A prescribed gift given with faith is said to become perpetual and imperishable
    gratification for the manes in the other world.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The dark half of the month from the tenth day, except the fourteenth, is recommended
    for funeral sacrifice; even and odd lunar days and constellations are linked to
    different results, and afternoon is preferred to forenoon.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The performer is instructed to honour the manes with the sacred thread over
    the right shoulder, moving from left to right, and holding Kara grass in his hands
    until the end of the ceremony.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A funeral sacrifice is not to be performed at night, twilight, or just after
    sunrise; the night is declared to belong to the Rakshasas.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: A funeral sacrifice is prescribed at least three times a year, in winter,
    summer, and the rainy season, while the one included among the five great sacrifices
    is prescribed daily.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A burnt-oblation at a sacrifice to the manes must not be made in a common
    fire; a Brahmana keeping a sacred fire is restricted to new-moon performance for
    this rite.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A Brahmana who bathes and satisfies the manes with water is said to obtain
    the full reward of the daily Sraddha.
  category: action
  evidence_refs:
  - ev:8
