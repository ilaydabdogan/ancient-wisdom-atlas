  summary: 'The passage argues that references in the Manu-smriti show that its author
    knew Dharmaśāstras or Institutes of sacred law. It discusses three cited passages:
    a definition of Śruti and Smṛti, a legal assembly including a reciter of sacred
    law, and a funeral-sacrifice passage where guests hear the Veda and Dharmaśāstras.
    The author concludes that multiple earlier law-books are acknowledged.'
