canonical_text:
  quote: ''
  summary: The passage argues for Medhatithi's connection with Kashmir by citing his
    references to Kashmir, the Kanaka Sakha, and a Kashmiri word for rainbow. It also
    notes an attribution analogy in which the Manava Dharmasastra may be called Manu's
    although first taught by Hiranyagarbha. The passage then reports Colebrooke's
    account and a verse about the Bhashya being partly lost or mutilated and restored
    under prince Madanapala through a manuscript brought from another country. A footnote
    mentions Professor Jolly's different opinion about Medhatithi's origin.
  language: English
