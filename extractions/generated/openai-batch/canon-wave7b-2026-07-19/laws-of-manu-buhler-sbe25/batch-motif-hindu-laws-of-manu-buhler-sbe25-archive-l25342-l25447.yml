canonical_text:
  quote: ''
  summary: 'The passage classifies several kinds of sons for inheritance and ritual
    purposes: a son of an unmarried girl later assigned to her husband, a son received
    with a pregnant bride, a bought son, a son of a remarried woman, a self-given
    son, a Parasava described as a living corpse, and a son of a Sudra and female
    slave who may inherit if permitted. It states that these enumerated sons function
    as substitutes to prevent failure of funeral ceremonies, and the notes cite parallel
    legal sources.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A son secretly borne by an unmarried damsel in her father's house is called
    Kanina and is declared to belong to the man who later weds her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a man marries a pregnant bride, knowingly or unknowingly, the child in
    her womb belongs to him and is called Sahodha, a son received with the bride.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man may buy a boy from the boy's father and mother for the sake of having
    a son; that child is called Krittaka, a bought son.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A son born to a woman who was abandoned by her husband, or to a widow who
    remarries of her own accord, is called Paunarbhava, the son of a re-married woman.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A woman who is still a virgin, or who returned to her first husband after
    leaving him, is described as worthy to perform the nuptial ceremony again with
    the second or first deserted husband.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A child who has lost his parents or has been abandoned by them without just
    cause may give himself to a man and is called Svayamdatta, a self-given son.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: A son begotten by a Brahmana through lust on a Sudra female is described as
    alive yet a corpse, and is called Parasava, a living corpse.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: A son begotten by a Sudra on a female slave, or on the female slave of his
    slave, may take an inheritance share if permitted by his father.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The wise call the eleven enumerated sons substitutes for a son, taken to prevent
    failure of funeral ceremonies.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The notes cite related rules or discussions in Vasishtha, Baudhayana, Vishnu,
    Yajnavalkya, Apastamba, and commentators such as Medhatithi, Kulluka, Narayana,
    Nandana, and Raghavananda.
  category: other
  evidence_refs:
  - ev:6
  - ev:7
