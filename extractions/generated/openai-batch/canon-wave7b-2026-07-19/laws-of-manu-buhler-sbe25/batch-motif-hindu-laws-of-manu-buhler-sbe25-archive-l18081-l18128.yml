canonical_text:
  quote: ''
  summary: 'The passage gives rules for kingship: a pure, promise-keeping, law-observing,
    well-assisted, wise king may justly punish; he should govern justly, chastise
    enemies, be straightforward with friends, and be lenient to Brahmanas. It contrasts
    the fame of a rightly behaving king with that of an uncontrolled king through
    water similes, states that the king was created to protect castes and orders,
    and instructs him to worship and take advice from learned, aged, pure Brahmanas.'
  language: English
  quote_policy: summarized
