literal_observations:
- id: obs:1
  text: Property lost and later found by the king's servants is to remain in the keeping
    of special officials.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Persons convicted by the king of stealing such found property are to be slain
    by an elephant.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man who truthfully claims treasure-trove as his own may owe the king one-sixth
    or one-twelfth part.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man who falsely claims treasure-trove is to be fined, either in one-eighth
    of his property or a smaller calculated portion.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A learned Brahmana who finds treasure deposited in former times may take the
    whole of it, with the stated rationale that he is master of everything.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the king finds old treasure concealed in the ground, he is instructed
    to give half to Brahmanas and place the other half in his treasury.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king is said to obtain one half of ancient hoards and metals found in
    the ground because he gives protection and is lord of the soil.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Property stolen by thieves must be restored by the king to people of all castes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A king who uses recovered stolen property for himself incurs the guilt of
    a thief.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: A king who knows sacred law must inquire into the laws of castes, districts,
    guilds, and families and settle the particular law of each.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: People who follow their particular occupations and duties are said to become
