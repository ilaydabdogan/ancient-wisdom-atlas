  quote: ''
  summary: The passage gives legal rules concerning lost property, treasure-trove,
    ancient concealed hoards, stolen goods, royal duties, Brahmana entitlements, fines
    for false claims, and the king's obligation to recognize the customary laws of
    castes, districts, guilds, and families.
