  summary: The passage argues that ancient Vedic school texts already contained recurring
    Anuṣṭubh verses and that later teachers expanded a stock of detached legal and
    philosophical maxims, making metrical treatises possible. It connects this process
    with hypotheses about the composition of the Manu-smṛti and with similar or related
    verse material in the Purāṇas, Mahābhārata, Manu, and ancient Buddhist literature.
