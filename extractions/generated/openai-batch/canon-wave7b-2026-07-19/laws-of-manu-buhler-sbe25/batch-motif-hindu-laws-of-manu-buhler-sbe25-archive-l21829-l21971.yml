canonical_text:
  quote: ''
  summary: The passage gives legal rules concerning the completion of marriage by
    nuptial texts and the seventh step around the sacred fire, possible rescission
    of completed transactions, responsibility for cattle by owners and herdsmen, herdsman
    wages in milk, liability for lost or killed animals, evidence to be brought when
    cattle die, responsibility for livestock attacked by wolves, village and town
    pasture spaces, fencing requirements, fines for crop damage, exemptions for certain
    cows, bulls, and cattle sacred to the gods, and fines for crop destruction caused
    by a husbandman or servants.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nuptial texts are described as proof that a maiden has been made a lawful
    wife, and the marriage ceremony is complete with the bride's seventh step around
    the sacred fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A king is instructed to keep someone who repents of a completed transaction
    on the road of rectitude according to prior rules.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Responsibility for cattle is assigned to the herdsman during the day and to
    the owner at night when the cattle are in the owner's house; otherwise the herdsman
    remains responsible at night.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A hired herdsman paid with milk may, with the owner's consent, milk the best
    cow out of ten as his hire when no other wages are paid.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A herdsman must make good the loss of a beast that strays, is destroyed by
    worms, killed by dogs, or falls into a pit if he did not duly exert himself to
    prevent it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A herdsman is not required to pay for an animal stolen by thieves if he raised
    an alarm and notified his master at the proper place and time.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: When cattle die, the herdsman is instructed to bring body parts and identifying
    marks to his master.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If goats or sheep are surrounded by wolves and the herdsman fails to hasten
    to help, he is responsible for animals killed by a wolf.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: If properly ordered goats or sheep graze together in the forest and a wolf
    suddenly kills one, the herdsman bears no responsibility.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A pasture space is to be reserved on all sides of a village and a larger space
    around a town.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: If cattle damage unfenced crops on the common pasture, the king is not to
    punish the herdsmen.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: A field owner is instructed to make a hedge high enough that a camel cannot
    look over it and to stop gaps through which a dog or boar can thrust its head.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: If cattle damage an enclosed field near a highway or village, the herdsman
    is fined; unattended cattle are to be driven away by the field watchman.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: For damage in other fields, a cattle-related fine is assessed and the value
    of the destroyed crop is to be restored to the field owner.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: No fine is to be paid for damage done by a cow within ten days after calving,
    by bulls, or by cattle sacred to the gods, whether attended by a herdsman or not.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:16
  text: If crops are destroyed by the husbandman's own fault, the fine is ten times
    the king's share; if servants are at fault without the farmer's knowledge, the
    fine is half that amount.
  category: action
  evidence_refs:
  - ev:16
