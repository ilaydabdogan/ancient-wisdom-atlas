  summary: Verses 153-159 prescribe a wife’s devotion to her husband, describe obedience
    to him as a means to heavenly exaltation, instruct a widow to remain chaste and
    avoid attachment to another man, and cite chaste Brahmanas as examples of persons
    who reached heaven without producing offspring. Notes identify related dharmashastra
    passages and report that Medhatithi objected to widow-burning.
  language: English
