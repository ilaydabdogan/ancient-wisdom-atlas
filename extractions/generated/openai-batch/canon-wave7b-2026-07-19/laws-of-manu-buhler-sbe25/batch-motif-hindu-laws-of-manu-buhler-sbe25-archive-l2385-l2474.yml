  text: The passage says ancient cases were settled according to custom and that sacred
    law later became a separate science studied by specialists.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The specialists are described as choosing to remodel older works rather than
    compose entirely new ones, resulting in the class of secondary Smritis represented
    by Manu and Yajnavalkya.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Secondary Smritis are characterized as belonging to special law schools, giving
    fuller and more systematic treatment of legal topics, preserving traces of older
    Vedic redactions, lacking sectarian or royal-command signs, and functioning as
    school-books.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Manu-smriti is described as connected with an older Vedic work and kept
    by Pandits devoted to the study of law.
