canonical_text:
  quote: ''
  summary: The passage explains the development of secondary Smritis from older sacred-law
    materials, identifies Manu and Yajnavalkya as chief representatives, and describes
    Manu-smriti as a nonsectarian school-book in the keeping of law-specialist Pandits.
    It states that Brahman teachers instruct eligible Arya pupils and that recitation
    of the Institutes brings virtuous conduct and a desired postmortem condition.
  language: English
  quote_policy: summarized
