canonical_text:
  quote: ''
  summary: The passage gives rules on reverent eating, water-sipping purification,
    sacred parts of the hand, thread or garment positions, renewal of damaged ritual
    implements, the Keshanta hair-clipping rite, female sacramental equivalents, and
    the initiation of the twice-born as a sanctifying new birth followed by instruction
    from the teacher.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Food is to be treated reverently; irreverent eating, eating between meal-times,
    and excessive eating are prohibited or condemned.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The person addressed must not go anywhere without purifying himself after
    a meal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A Brahmana is instructed to sip water from hand-parts sacred to Brahman, Ka
    or Prajapati, or the gods, and not from the part sacred to the manes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage assigns sacred hand-parts to Brahman, Ka or Prajapati, the gods,
    and the manes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The water-sipping rite consists of sipping water three times, wiping the mouth
    twice, and touching specified bodily places with water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: One who knows the sacred law and seeks purity is to perform the sipping rite
    with water that is neither hot nor frothy, using the prescribed hand-part, in
    a lonely place, facing east or north.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: Purification by water is differentiated for Brahmana, Kshatriya, Vaisya, and
    Sudra by how far the water reaches or touches the body.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: The terms upavitin, prachinavitin, and nivitin are defined by the position
    of the raised arm and the placement of the sacrificial string or dress.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: A damaged girdle, skin garment, staff, sacrificial thread, and water-pot are
    to be thrown into water and replaced while sacred formulas are recited.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Keshanta or hair-clipping ceremony is assigned different years for Brahmana,
    Kshatriya, and Vaisya.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The same series of body-sanctifying ceremonies is to be performed for females
    at the proper time and order, but without recitation of sacred texts.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: For women, the nuptial ceremony is stated to be the Vedic sacrament equivalent
    to initiation; serving the husband and household duties are equated with residence
    in the teacher's house and daily sacred-fire worship.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: The rule for initiation of the twice-born is described as indicating a new
    birth and sanctifying the initiate.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: After initiation, the teacher first instructs the pupil in personal purification,
    conduct, fire-worship, and twilight devotions.
  category: sequence
  evidence_refs:
  - ev:7
