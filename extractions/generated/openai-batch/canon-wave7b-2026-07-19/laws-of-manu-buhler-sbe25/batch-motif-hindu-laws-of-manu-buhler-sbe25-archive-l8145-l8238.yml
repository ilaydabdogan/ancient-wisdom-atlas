canonical_text:
  quote: ''
  summary: Chapter II opens by instructing readers to learn sacred law as followed
    by Veda-learned and virtuous persons. It discusses desire for rewards as a motive
    for Vedic study, sacrifices, vows, and restraints; states that prescribed duties
    performed rightly lead to a deathless state and fulfillment of desires; lists
    the sources of sacred law as the Veda, tradition, virtuous conduct, customs of
    holy men, and self-satisfaction; and affirms Manu's law as declared in the Veda
    and to be scrutinized by a learned person with the eye of knowledge.
  language: English
  quote_policy: summarized
