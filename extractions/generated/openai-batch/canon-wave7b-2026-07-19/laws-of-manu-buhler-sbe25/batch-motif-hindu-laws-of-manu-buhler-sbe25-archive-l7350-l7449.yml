canonical_text:
  quote: ''
  summary: The passage describes the creator distinguishing merit from demerit and
    other pairs of opposites, framing the world from particles of the five elements,
    and assigning beings courses that recur in later creations and new births. It
    then gives origins for four social groups from parts of the Lord's body, describes
    the Lord dividing himself into male and female and producing Viraj, and recounts
    a chain in which Viraj produces the narrating creator, who through austerities
    produces ten sages, who then create further Manus, gods, and sages.
  language: English
  quote_policy: summarized
