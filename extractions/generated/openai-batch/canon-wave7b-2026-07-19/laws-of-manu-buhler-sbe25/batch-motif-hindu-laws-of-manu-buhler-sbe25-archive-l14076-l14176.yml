canonical_text:
  quote: ''
  summary: 'Manu IV.96-106 gives rules for Brahmana Veda-study: the Utsarjana of the
    Vedas, periods of reading and non-reading, restrictions on recitation, and occasions
    when Veda-study must stop because of seasonal, atmospheric, celestial, or earthly
    phenomena.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Brahmana is instructed to study the Vedas for four and a half months and
    to perform the Utsarjana of the Vedas at a specified calendrical time in the forenoon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After performing the Utsarga outside the village, the practitioner is instructed
    to stop reading for a prescribed interval.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the Utsarga interval, the practitioner is instructed to recite the Vedas
    during bright halves of months and to study the Angas during dark fortnights.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage prohibits indistinct recitation, recitation in the presence of
    Sudras, and returning to sleep after late-night fatigue from Veda recitation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Students and teachers are instructed to avoid Veda-study on occasions when
    it is forbidden by rule.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the rainy season, Veda-study is to stop when wind is audible at night or
    whirls up dust in the daytime.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: When lightning, thunder, and rain occur together, or when large fiery meteors
    fall on all sides, recitation is to be interrupted until the same hour on the
    next day.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: After the sacred fires have been made to blaze, combined twilight phenomena
    and out-of-season clouds make Veda recitation forbidden.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: A preternatural sound from the sky, an earthquake, and halos around heavenly
    lights are listed as causes for stopping Veda-study until the same hour on the
    next day.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Lightning and thunder after the sacred fires have been made to blaze cause
    a stoppage lasting while sun or star light remains visible; rain causes reading
    to cease in both daytime and nighttime.
  category: sequence
  evidence_refs:
  - ev:5
