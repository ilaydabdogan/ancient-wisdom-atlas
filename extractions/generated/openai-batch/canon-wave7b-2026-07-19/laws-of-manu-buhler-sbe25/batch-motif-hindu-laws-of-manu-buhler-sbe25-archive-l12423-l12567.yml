canonical_text:
  quote: What fire is, even such is a Brahmana.
  summary: 'The passage gives rules for a Sraddha rite: offerings to the manes are
    preceded and protected by rites for the gods; the ritual place is purified and
    oriented southward; Brahmanas are seated, honored, and given ritual materials;
    oblations are made to Agni, Soma, and Yama before food is offered to the manes;
    if sacred fire is absent, offerings may be placed in a Brahmana''s hand; three
    cakes are made from sacrificial food and placed toward the south for ancestral
    recipients.'
  language: English
  quote_policy: quoted
