canonical_text:
  quote: ''
  summary: A scholarly introduction evaluates traditions and quotations concerning
    versions of Manu's laws. It rejects Narada's statement as evidence for dating
    the versions, compares it to cited origin-of-Dharma stories in the Mahabharata,
    reports a Pauranik sequence of remodelling Manu's laws, and discusses later Brzhat/Vrddha
    Manu traditions, quotations, and astrological Samhitas associated with Manu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Narada's Vyavaharamatrzka is described as showing a more advanced development
    of judicial theories than Bhrzgu's Samhita and as containing matter that prevents
    dating it earlier than the fourth or fifth century CE.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Narada's statement cannot be used to determine the
    order in which versions of Manu's laws were composed.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Narada's statement was probably framed to enhance the importance
    of the Narada-smrzti on the model of fictitious stories about the origin of Dharma.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: In the cited Mahabharata account, Brahman, assisted by the gods, first produces
    a Dharmajastra in 100,000 chapters, which is then successively abridged by Sa/^kara,
    Indra, Brzhaspati, and Kavya into smaller numbers of Adhyayas.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Pauranik statement says Manu's laws were remodelled first by Bhrz'gu, secondly
    by Narada, thirdly by BWhaspati, and fourthly by Arigiras.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports Professor Jolly's argument that quotations attributed
