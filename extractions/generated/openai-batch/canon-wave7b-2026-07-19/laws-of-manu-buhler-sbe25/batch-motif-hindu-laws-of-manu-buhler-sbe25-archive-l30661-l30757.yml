canonical_text:
  quote: ''
  summary: The passage gives rules for re-admitting outcasts after penance, including
    bathing in a holy pool, a water-pot rite, renewed household duties, provision
    for female outcasts, restrictions on dealings with unpurified or grave offenders,
    reparative initiation for twice-born men, and expiations involving relinquishment,
    prayer, austerity, a cow-house, milk, and a cow-mediated sign of acceptance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a person has performed penance, others bathe with him in a holy pool
    and throw down a new pot filled with water.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The penitent throws the pot into water, enters his house, and resumes the
    duties incumbent on a relative.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Female outcasts are to follow the same rule, but are given clothes, food,
    and drink and live close to the family house.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Business is not to be transacted with unpurified sinners, while those who
    have made atonement are not to be reproached.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage forbids dwelling with child murderers, those who return evil for
    good, and slayers of suppliants or women, even if they have been purified according
    to sacred law.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Twice-born men not taught the Savitri at the prescribed time are to perform
    three Kricchra penances and then be initiated according to law.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The same expiation is prescribed for twice-born men who follow forbidden occupations
    or have neglected the Veda and desire to perform penance.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Brahmanas who acquire property by a reprehensible action become pure by relinquishing
    it, muttering prayers, and performing austerities.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A man is freed from the guilt of accepting presents from a wicked man by muttering
    the Savitri three thousand times, dwelling for a month in a cow-house, and subsisting
    on milk.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the fasting man returns from the cow-house, emaciated and saluting reverently,
    Brahmanas ask whether he desires to become their equal.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: If the man gives the required answer, he scatters grass for the cows; if the
    cows eat it and thereby hallow the place, the Brahmana re-admits him into the
    community.
  category: sequence
  evidence_refs:
  - ev:10
