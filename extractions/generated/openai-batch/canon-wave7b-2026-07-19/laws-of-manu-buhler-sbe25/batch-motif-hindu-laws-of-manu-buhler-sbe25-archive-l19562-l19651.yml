canonical_text:
  quote: ''
  summary: The passage prescribes how a king should preserve himself in danger, deliberate
    with ministers, guard food and personal articles against poison, receive attendance
    in the harem, inspect military resources, hear secret reports, dine again, rest,
    and delegate business if ill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king is instructed to preserve wealth for need, preserve his wife at the
    expense of wealth, and preserve himself even by giving up wife and wealth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A wise king facing simultaneous misfortunes should try the four expedients,
    together or separately, in order to save himself.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The king should ponder the person employing the expedients, the business to
    be accomplished, and the expedients collectively.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After consulting his ministers, exercising, and bathing, the king may enter
    the harem at midday to dine.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king's food is to be prepared by faithful and incorruptible servants and
    examined or hallowed by sacred texts that destroy poison.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The king is told to mix all food with antidote medicines and to wear gems
    that destroy poison.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Well-tried females, whose toilet and ornaments have been examined, serve the
    king with fans, water, and perfumes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The king is also to be careful about carriages, bed, seat, bath, toilet, and
    ornaments.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: After dining, the king may divert himself with his wives in the harem, but
    afterward he must again consider affairs of state.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Adorned in state, the king inspects fighting men, chariots, beasts of burden,
    weapons, and accoutrements.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After twilight devotions, the well-armed king hears secret reports and spies
    in an inner apartment.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The king then goes to another secret apartment, dismisses those people, and
    enters the harem surrounded by female servants to dine again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: After a second meal and recreation by music, the king rests, rises at the
    proper time, and may entrust the business to servants if indisposed.
  category: sequence
  evidence_refs:
  - ev:9
