canonical_text:
  quote: ''
  summary: Legal rules describe which witnesses may be accepted, how a judge or king
    should evaluate conflicting testimony, and how witnesses are to be examined in
    court. The passage emphasizes testimony based on what was seen or heard, warns
    that false testimony leads after death to hell and loss of heaven, and says truthful
    testimony brings spiritual merit, blessed regions, fame, and reverence by Brahman.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Evidence may be given in the specified cases by a woman, infant, aged man,
    pupil, relative, slave, or hired servant.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The judge is told to treat evidence from infants, aged and diseased men, and
    men with disordered minds as untrustworthy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In cases of violence, theft, adultery, defamation, and assault, the judge
    must not examine witness competence too strictly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When witnesses conflict, the king is instructed to accept the majority, then
    those with good qualities if numbers are equal, and then the best among the twice-born
    if the distinguished witnesses differ.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Evidence is admissible when it accords with what has actually been seen or
    heard.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A witness who speaks truth in such evidence loses neither spiritual merit
    nor wealth.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A witness who says in an honorable assembly something other than what was
    seen or heard falls after death into hell and loses heaven.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A person not originally appointed as a witness, but who saw or heard the matter,
    must declare it exactly as seen or heard when examined.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: One man free from covetousness may be accepted as a witness; the passage rejects
    many women and many sin-tainted men as witnesses.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Witness statements made naturally are to be received at trial; improperly
    made differing depositions are said to be worthless for justice.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Witnesses are assembled in court in the presence of the plaintiff and defendant,
    and the judge examines them with a kindly exhortation.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: The judge tells the witnesses to declare truthfully everything they know about
    the transaction between the two men before the court.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: A witness who speaks truth gains excellent regions after death and unsurpassable
    fame in this world.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: Truthful testimony is said to be revered by Brahman.
  category: relationship
  evidence_refs:
  - ev:12
