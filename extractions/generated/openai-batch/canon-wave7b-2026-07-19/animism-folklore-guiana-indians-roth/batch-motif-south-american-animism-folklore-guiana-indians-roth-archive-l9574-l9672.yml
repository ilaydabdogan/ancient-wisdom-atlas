canonical_text:
  quote: ''
  summary: 'The passage catalogues reported talismanic practices among Guiana and
    nearby Indigenous groups: charms held in the mouth during purchase, plant necklaces,
    animal parts worn or applied to transfer qualities or protect from harm, red paint
    and blood applied for protection or healing, and green Amazon-stones worn as healing
    or protective amulets.'
  language: English
  quote_policy: summarized
