candidate_motifs:
- id: motif:1
  label: spirit impersonates husband or lover
  taxonomy_refs:
  - shapeshifter
  basis: The Maihisikiri is explicitly said to assume the identical material appearance
    of husbands or lovers, and the Warrau narrative shows it appearing in a husband's
    likeness.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage frames the being as a spirit assuming human appearance; it
    does not use a broader comparative term beyond the local spirit names.
- id: motif:2
  label: nonhuman lover recognized by bodily anomaly
  taxonomy_refs: []
  basis: The passage states that a woman can tell a spirit wooer from the real man
    by looking at the left foot, which lacks the big toe.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Only one diagnostic sign is given; the passage does not present a successful
    detection episode.
- id: motif:3
  label: spirit lover causes death after encounter
  taxonomy_refs: []
  basis: The warning states that women who yield to the spirit's solicitations die
    within a few days, and the 1910 account describes a wife dying within a week after
    meeting the husband-like figure.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage reports the causal belief but does not narrate physical details
    of the fatal process in the 1910 account.
- id: motif:4
  label: spirit abduction or taking-away of a wife
  taxonomy_refs:
  - stolen_beloved
  basis: In the Warrau narrative, the Maihisikiri admits its identity and tells the
    woman to come away; when the husband returns, the house is empty and his wife
    is found under the spirit's power.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The wife states she does not really want to leave her husband, but the
    passage emphasizes transformation and spirit overpowering more than a rescue or
    recovery pattern.
- id: motif:5
  label: human transformed into bush spirit
  taxonomy_refs: []
  basis: The wife is found with a boneless body and states that she is now a Bush
    Spirit; she tells her husband he must die before he can become one.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The transformation mechanism is not fully explained beyond the Maihisikiri's
    power and sporting with her.
- id: motif:6
  label: gendered invisibility of spirit lover
  taxonomy_refs: []
  basis: The husband cannot see the Maihisikiri because the spirit is said to be invisible
    to the male sex.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The statement is specific to this episode and spirit context; the passage
    does not generalize it to all spirits.
- id: motif:7
  label: animal brood has a mother or guardian spirit
  taxonomy_refs: []
  basis: The scrub-turkey hunter is warned that killing many birds may bring trouble
    from the maam's mother, identified as a spirit of her brood.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage concerns maam/scrub-turkeys specifically and only briefly
    notes the broader section reference.
- id: motif:8
  label: animal call lures hunter into deep forest
  taxonomy_refs: []
  basis: The hunter hears scrub-turkey calls in many directions and, while following
    one, is led farther and farther into the forest.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not explicitly say the spirit intentionally lures him,
    only that the pursuit of calls draws him deep into the forest.
- id: motif:9
  label: animal spirit appears as human limb and transforms into game animal
  taxonomy_refs:
  - shapeshifter
  basis: The hunter sees a woman's leg in a tree, recognizes it as the Arch Spirit
    of the maams, shoots it, and it changes into an extraordinarily large scrub-turkey.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The initial form is a single limb, not a full human body.
- id: motif:10
  label: eating the whole spirit animal brings hunting success
  taxonomy_refs: []
  basis: The hunter is told to cook and eat the entire transformed scrub-turkey himself;
    afterward, he is even more successful in hunting maam and unafraid of killing
    many birds.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage reports the sequence but does not explicitly explain why whole
    consumption produces the later effect.
- id: motif:11
  label: calling spirit names causes manifestation
  taxonomy_refs: []
  basis: The Ekkekuli or Manahau are said to materialize if their names are loudly
    called in caves, gullies, or forest.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No extended narrative example of this summoning is included in the passage.
