canonical_text:
  quote: ''
  summary: 'The passage describes several Guiana Amerindian spirit traditions: Ekkekuli
    or Manahau spirits that materialize when called and are dangerous to humans; Maihisikiri/Mansinskiri
    bush spirits that impersonate husbands or lovers and harm or transform women;
    and an Arawak account in which the scrub-turkey''s mother or arch-spirit appears
    as a woman''s leg, is shot by a hunter, changes into a large scrub-turkey, and
    afterward increases the hunter''s success.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When perceptible to human eyes, the Ekkekuli or Manahau are described as having
    the appearance of Black people and as killing Indians and abducting children.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ekkekuli or Manahau are said to materialize if their names are loudly
    called in neighboring caves, gullies, or the forest.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Mansinskiri or Maihisikiri is identified as a particular Yawahu that wanders
    in the bush and among trees.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Maihisikiri can assume the identical material appearance of a woman's
    husband or lover; women who yield to its solicitations are said to die within
    a few days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A spirit wooer can be detected because its left foot lacks the big toe.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: In a 1910 account, a woman gathering firewood in the bush met someone she
    believed to be her husband, returned home to find her husband in his hammock,
    told him what happened, and died within the week.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Warrau narrative, a man went hunting and left his wife alone; a Maihisikiri
    appeared in the likeness of her husband on three occasions.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the third visit, after the woman questioned how the visitor could be her
    husband when her husband had gone far away, the Maihisikiri admitted that he was
    a Bush Spirit in her husband's likeness and told her to come away with him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: When the real husband returned, the house was empty; he heard his wife laughing
    in the distance and found her prostrate, laughing because the Maihisikiri was
    sporting with her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The husband could not see the Maihisikiri because the spirit was described
    as invisible to the male sex.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: When the husband seized his wife's arm, it was soft and boneless; he then
    found that her entire body had no bones and was soft flesh and skin.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The woman told her husband that she did not really want to leave him, that
    the Maihisikiri was too strong for her, that she was now a Bush Spirit, and that
    he would have to die before he could become one.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: An unusual Arawak Bush Spirit form is identified as the scrub-turkey and as
    a woman's leg; the leg's appearance above the horizon before daybreak is linked
    with the scrub-turkey's call.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: A man skilled at hunting maam, or scrub-turkeys, repeatedly killed many of
    them and was warned that he would get into trouble with the maam's mother or spirit
    for killing so many of her brood.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: While following scrub-turkey calls, the hunter was repeatedly led deep into
    the forest and feared being caught by the Yawahu after dark.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: The hunter looked into a tree where the call seemed to come from and saw only
    a woman's leg, which he recognized as the Arch Spirit of the maams.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: The hunter shot an arrow into the center of the foot; the leg fell, changed
    into an extraordinarily large scrub-turkey, and was killed and carried home.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: The hunter's friends recognized the bird as the maam's mother or spirit and
    advised him to cook and eat all of it himself; afterward he became even more successful
    hunting maam and was no longer afraid of killing many birds.
  category: sequence
  evidence_refs:
  - ev:10
