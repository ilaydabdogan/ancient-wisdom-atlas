- id: ev:7
  type: summary
  locator: "§98, Arawak Bush Spirit description within lines 3509-3587"
  quote_or_summary: An unusual Arawak Bush Spirit form is the scrub-turkey, a woman's
    leg; other leg references are noted, and the leg above the horizon before daybreak
    is linked with the scrub-turkey's call.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: "“The Man Who Always Hunted Scrub-Turkey,” opening within lines 3509-3587"
  quote_or_summary: A skilled hunter kills many maam; people warn that he will get
    into trouble with the maam's mother or spirit for killing her brood, and his pursuit
    of calls leads him deep into the forest where he fears the Yawahu at dark.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: "“The Man Who Always Hunted Scrub-Turkey,” spirit encounter within lines
    3509-3587"
  quote_or_summary: The hunter sees only a woman's leg in the tree, recognizes it
    as the Arch Spirit of the maams, shoots the foot, and the fallen leg changes into
    an extraordinarily large scrub-turkey that he kills and carries home.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: "“The Man Who Always Hunted Scrub-Turkey,” conclusion within lines 3509-3587"
  quote_or_summary: Friends identify the bird as the maam's mother or spirit and advise
    the hunter to eat the whole bird himself; afterward he is more successful in hunting
    maam and no longer fears killing many birds.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; summarized.
