canonical_text:
  quote: ''
  summary: The passage reports Guiana-region ethnographic accounts of menstruation
    and puberty restrictions, including dangerous menstrual contact, fasting, silence,
    restricted food and water, avoidance of ground contact, and ant or wasp ordeals
    connected with work capacity, marriage eligibility, and future children. It also
    describes ant-frames, animal-shaped insect frames, and an Apalai ant-frame application
    by a European traveler.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Orinoco cacique explains female menstrual food deprivation by saying ancestors
    believed menstrual footprints dried things up and caused men who stepped there
    to have swollen legs; the remedy was to starve the women so their bodies would
    be free of poison.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Pomeroon Caribs, a girl was carried between her hammock and the place
    of scarification so that her feet did not touch the ground.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among Pomeroon Arawaks at first menstruation, the girl was given no meat,
    only a little small fish, small cassava cakes with only the center eaten, and
    a small amount of water in a small calabash; for months afterward she avoided
    large-animal meat and blood-rich fish.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among the Warraus, a girl during the period was not to speak, laugh, or eat
    for two or three days; if she did so, she was said to risk losing all her teeth
    when older.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The first food allowed to the Warrau girl was a little cassava flour wrapped
    in a leaf.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: A Pomeroon Carib girl was required for three days to go without food, water,
    or speech, and then was kept for a month on roots, cassava bread, and water; the
    passage states that girls might die under this treatment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: For an Arawak girl newly become a woman, an old stranger known as strong,
    good, and willing to work was chosen to place an ant-frame on her forehead, hands,
    and feet.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The ant-frame is described as a plaited framework with ants attached at their
    middles so that their heads project from the side applied to the body.
  category: object
  evidence_refs:
  - ev:7
- id: obs:9
  text: Among Warraus and Caribs, young people of both sexes could not marry until
    they had undergone the ant ordeal.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: In one Warrau account, the sufferer was placed in a hammock and tari-tari
    ants were applied; crying out led to condemnation to celibacy.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Warrau informants on the Moruca said that if a girl cried during the ant practice,
    it meant she could not work and was not deserving of a husband.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: A Roucouyenne would-be bridegroom underwent an ordeal administered by the
    piai, with ants applied to the chest, wasps on the forehead, and later stinging
    of the whole body with ants and wasps.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Ojanas are reported to believe that the male wasp ordeal renders men skilful,
    clever, and industrious.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: Cayenne Apalais and Roucouyennes are reported to believe that parents who
    had not undergone ant, wasp, and other ordeals would have only emaciated and sickly
    children.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: In Surinam and Cayenne, the insects used in ordeals are said to be held in
    feather-fringed frames of unusual shapes representing quadrupeds and birds.
  category: object
  evidence_refs:
  - ev:12
- id: obs:16
  text: The author states that available evidence is insufficient to decide whether
    the animal-shaped frame or the person applying it was thought to impress qualities
    on the young person.
  category: other
  evidence_refs:
  - ev:12
- id: obs:17
  text: At an Apalai village, a European traveler was given a palm-leaf framework
    with large black ants attached, and people of all ages and sexes presented themselves
    for him to apply it to their bodies.
  category: action
  evidence_refs:
  - ev:13
