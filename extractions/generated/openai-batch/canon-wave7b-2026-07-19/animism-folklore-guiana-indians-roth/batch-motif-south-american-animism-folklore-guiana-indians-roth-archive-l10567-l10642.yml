comparison_claims:
- id: claim:1
  claim: Warrau and Carib ant ordeals are presented as serving the same social function
    of qualifying young people for marriage.
  claim_level: same_function
  target: Warrau and Carib ant-ordeal practices
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives a direct comparison but does not provide identical
    ritual details for each group.
- id: claim:2
  claim: The Roucouyenne bridegroom ordeal and the Ojana male wasp ordeal are comparable
    as male stinging ordeals associated with desirable adult qualities such as industry,
    skill, and endurance.
  claim_level: same_function
  target: Roucouyenne and Ojana male ant/wasp ordeals
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The Roucouyenne account emphasizes bridegroom ordeal procedure, while
    the Ojana account explicitly states the believed effects.
- id: claim:3
  claim: Insect frames in Surinam and Cayenne are visually comparable because both
    are described as feather-fringed frames representing quadrupeds and birds.
  claim_level: visual_similarity
  target: Surinam and Cayenne insect frames
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: high
  limitations: The passage states that evidence is insufficient to determine the intended
    transfer of qualities or ritual meaning of the frame shapes.
- id: claim:4
  claim: The Apalai palm-leaf ant framework resembles the other ant-frame rites in
    using ants attached to a framework and applied to bodies.
  claim_level: same_motif
  target: Apalai ant-frame application compared with Arawak and related ant-frame
