    narrative myth episode.
- id: motif:2
  label: puberty initiation through fasting, silence, and restricted diet
  taxonomy_refs:
  - initiation
  basis: Girls at first menstruation undergo carrying, silence, fasting, restricted
    foods, and prolonged avoidance of certain meat and fish.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: Specific rules vary among Pomeroon Carib, Pomeroon Arawak, and Warrau
    accounts.
- id: motif:3
  label: ant or wasp stinging ordeal as initiation and social qualification
  taxonomy_refs:
  - initiation
  basis: Ant and wasp ordeals are connected with becoming fit to work, marry, or be
    considered skilful, clever, and industrious.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage reports several related practices from different groups and
    sources.
- id: motif:4
  label: failure in ordeal produces social exclusion from marriage
  taxonomy_refs:
  - initiation
  basis: Warrau accounts state that crying out under the ant ordeal led to celibacy
    or showed a girl could not work and did not deserve a husband.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The explicit failure consequence is reported for the Warrau material in
    this passage.
