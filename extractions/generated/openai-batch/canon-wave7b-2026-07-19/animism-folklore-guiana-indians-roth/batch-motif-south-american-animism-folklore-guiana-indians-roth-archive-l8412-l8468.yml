canonical_text:
  quote: ''
  summary: Wawaiya, bride of Serikoai, is courted by Wailya, who appears as a Tapir
    and promises to become human if she follows him east to where earth and sky meet.
    After Wailya charms her ax, Wawaiya wounds Serikoai and flees. Serikoai creates
    a bird messenger from an eyelash; his mother nurses him, and he later follows
    traces of avocado seeds and footprints eastward. He kills the Tapir, but Wawaiya
    refuses to return and throws herself into the sky. The passage identifies Wawaiya
    with the Pleiades, the Tapir's head with the Hyades and Aldebaran, and Serikoai
    with Orion. Adjacent notes mention other Orion's Belt identifications and describe
    departed spirits and medicine-men's spirits traveling upward to Sky-land or Cloud-land,
    sometimes becoming birds or causing sickness.
  language: English
  quote_policy: summarized
