canonical_text:
  quote: ''
  summary: The passage contains the close of one account about obtaining tobacco seed
    and ritual objects, followed by the beginning of a Warrau account about Komatari
    and tobacco. In the first account, a small flying helper steals tobacco seed despite
    a watch-woman, the seed is planted and prepared, and a bereaved father uses a
    rattle to call his son and two other lads, now Tobacco Spirits. The passage says
    this bereaved father became the first piai because of grief and longing. In the
    Komatari account, Komatari seeks tobacco said to grow on an island at sea. A hummingbird
    brings back a flower, while a house-master later waits until night to steal tobacco
    leaves from the watched island, gives Komatari seed and access to leaves in a
    corial, withholds his own name until Komatari knows Piai, and Komatari dries and
    guards the tobacco with wasps while avoiding visitors.
  language: English
  quote_policy: summarized
