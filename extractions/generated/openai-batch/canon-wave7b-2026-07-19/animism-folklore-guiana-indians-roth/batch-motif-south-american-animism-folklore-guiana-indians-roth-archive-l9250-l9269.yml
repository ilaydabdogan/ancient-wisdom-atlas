canonical_text:
  quote: ''
  summary: 'The passage describes several Guiana-area practices involving hunting
    dogs treated with plant substances: dogs in Cayenne rubbed with simples so game
    will not leave at their approach; Roucouyennes washing dogs with a musk-scented
    Hibiscus abelmoschus infusion before jaguar hunting to prevent the tiger biting
    them; hunting dogs rubbed with ruku/Bixa orellana by several groups, with one
    explanation that it keeps ticks off; and an incomplete introduction to Corentyne
    Arawak methods of selecting and training hunting dogs.'
  language: English
