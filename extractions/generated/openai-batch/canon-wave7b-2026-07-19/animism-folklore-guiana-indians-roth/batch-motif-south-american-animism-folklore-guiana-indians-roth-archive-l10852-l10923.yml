canonical_text:
  quote: ''
  summary: The passage records regional tests of male skill and, in detail, an Arawak
    bridegroom ordeal. A suitor may be conditionally accepted by the bride’s father,
    mother, and daughter, but he must first shoot an arrow into a woodpecker’s nest
    from a large corial while the prospective bride signals consent by touching his
    left side. Repeated attempts are allowed; without success the bride is not given.
    After success he becomes her husband and resides in the father-in-law’s house,
    then performs further tasks of clearing a provision field and filling crab baskets,
    after which he becomes a legal heir of the house. Failure in the later tasks brings
    ridicule, though these tasks are said to be less essential than the woodpecker-nest
    shooting.
  language: English
  quote_policy: summarized
