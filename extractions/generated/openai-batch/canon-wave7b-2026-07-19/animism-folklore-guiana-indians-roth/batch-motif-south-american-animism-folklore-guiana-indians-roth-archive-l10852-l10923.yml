  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the suitor misses, the performance is postponed; he may try repeatedly
    until he succeeds or gives up.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: Without shooting the arrow into the nest, the wooer does not receive the girl;
    with success, she becomes his wife and he resides in the father-in-law’s house.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the marriage condition is met, the father-in-law marks out ground, presents
    an ax, and requires the young man to clear a provision field within a short time;
    a similar ordeal is noted among Makusis and other tribes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The father-in-law collects crab baskets, accompanies the youth to sea, and
    watches to ensure that he fills all baskets in one day through his own effort.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Completion of the crab-basket task makes the youth a legal heir of the house;
    failure in the field or basket tasks leads to ridicule at later paiwarris, though
    these two ordeals are less essential than the woodpecker-nest shooting.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
