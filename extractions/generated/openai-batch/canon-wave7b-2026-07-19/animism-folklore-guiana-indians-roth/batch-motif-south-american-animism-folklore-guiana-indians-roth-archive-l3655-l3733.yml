canonical_text:
  quote: The Spirit's brains thus were scattered, and from each piece there 'grew'
    a wokorai-yu (goat-sucker).
  summary: The passage describes bird-like Bush Spirits and soul-birds, especially
    goat-suckers, as beings that may warn of evil and must not be killed. It then
    gives a Carib and Arawak legend in which a huntsman tricks a Konoko-kuyuha Spirit
    into having its head cut and peppered, later tricks it again with deer bones and
    a dance, crushes its head on a baking-stone, and goat-suckers grow from the scattered
    pieces of its brain.
  language: English
  quote_policy: quoted
