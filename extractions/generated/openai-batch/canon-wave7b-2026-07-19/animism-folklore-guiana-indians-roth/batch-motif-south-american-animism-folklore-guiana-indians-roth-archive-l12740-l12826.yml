canonical_text:
  quote: ''
  summary: The passage describes piai and Boye healing roles, payments and feasts
    after cures, accusations against sorcerers or witches, violent treatment of accused
    women, spell-blowing at a death anniversary, and the Kanaima complex as a retaliatory
    force or spirit associated with illness, shapeshifting, poison, arrows, and delayed
    death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When a piai is consulted, acceptance of a cigarette signifies that he undertakes
    to visit the sick person, while certain gifts are withheld until the sick person
    is completely cured.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that a young girl may sometimes be given as payment for
    a piaiman's professional services during sickness, and that his influence among
    women is great.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among the Carib Islanders, a cured person expresses gratitude with a feast
    where the Boye who helped in the cure receives first rank, and an Anakri for the
    Familiar Spirit is not to be omitted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sorcerers are said to be believed capable of sending dangerous or fatal charms,
    and they are killed when caught; the accusation may also serve as a pretext for
    eliminating enemies.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Illness may be interpreted as bewitchment; an accused person, often a woman,
    is made to search in the earth until shells or fishbones are found and treated
    as buried remains of what the bewitched person had eaten.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The accused woman is described as being cut, hung by the feet, subjected to
    pepper in the eyes, deprived of food, and finally killed by a club blow to the
    head.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: At a Guahibo chieftain's death anniversary, the medicine-man casts or blows
    a spell over the person said to have caused the death, after which other men and
    women imitate him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The chapter outline states that Kanaima may appear as a human being, spirit,
    or animal, and that fatal Kanaima handiwork can be recognized only by the piai.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: When ordinary remedies and the piai's invocation of a Familiar Spirit fail
    and the patient dies, the death may confirm belief that the condition was produced
    by human agency influenced by Kanaima.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Kanaima is also reported as the name of a savannah tree whose sap can make
    a person mad, change into an animal such as a tiger or snake, and harm others;
    the sap can also be thrown on others with similar results.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: The word Kanaima is presented as having an extended meaning that includes
    the law of retaliation, the man devoted to a deed of blood, the murderous spirit
    influencing or possessing him, the injured person, and the whole procedure and
    means employed.
  category: other
  evidence_refs:
  - ev:11
