    a case.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Among the Siusi on the Aiary River, the 'Devil' flutes are sounded in honor
    of Ko-ai, who is identified as the son of Yaperi'kuli, their tribal Hero.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Siusi flute festival is held at the ripening of certain fruits and includes
    mutual flagellation with whips.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The dance associated with the flutes is said to have magic powers, including
