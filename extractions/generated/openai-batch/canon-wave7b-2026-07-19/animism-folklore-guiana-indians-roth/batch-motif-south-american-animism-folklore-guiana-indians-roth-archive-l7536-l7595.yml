canonical_text:
  quote: ''
  summary: A crab-hunting man encounters a young Water Woman who asks for crabs, has
    sexual relations with him, and tells him to jump into the water when his boat
    stops by itself. He is taken below to her people, conditionally returned home,
    and then brought back after a quarrel at the crab feast; the Water People father
    tells him to take two daughters as wives. The passage then states that Water People
    are strongly attracted to women during menstruation and that women of several
    named groups avoid water travel at that time. A following tale begins with a girl
    approaching womanhood disappearing when her house is replaced by water; her parents
    say Okoyumo has swallowed her, and the father jumps into the flood but is kept
    floating by the Spirit of the Water.
  language: English
  quote_policy: summarized
