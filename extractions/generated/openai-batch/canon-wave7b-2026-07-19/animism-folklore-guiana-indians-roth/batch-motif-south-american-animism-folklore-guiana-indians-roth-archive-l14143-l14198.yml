canonical_text:
  quote: ''
  summary: 'The passage closes one tale in which a husband hears that his brother
    has pursued his wife, beats the brother, then protects himself and his wife by
    sleeping in a hammock near the roof when the brother returns at night to kill
    them; the brother’s cudgel hits a beam, breaks, and rebounds on him, after which
    he leaves. The titled tale “The Old Blind Man Who Wanted a Woman” follows: young
    men deceive an old blind man by tying a rope from his hammock to a tree over a
    river instead of to a girl’s hammock, causing him to fall into the stream and
    cling to a ho-aranni tree. He refuses rescue until one young man dresses as a
    girl and persuades him to enter a corial. Footnotes explain the maraka-baluru
    as a small detached equipment house and a ho-aranni as a river-bed tree or snag
    believed to have been planted by the Water People. The next heading introduces
    “How We Beat the Caribs” and notes comparison with Brett’s version.'
  language: English
  quote_policy: summarized
