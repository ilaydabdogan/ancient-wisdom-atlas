canonical_text:
  quote: ''
  summary: The passage gives a Kaieteur Fall legend in which an aged man is sent over
    the waterfall toward the spirit land and his canoe and basket become rocks. It
    then discusses petroglyphs in the Guianas ascribed to spirits, beliefs about people
    and animals originating from or transforming into rocks and stones, stone transformation
    as punishment, animate or powerful rocks, venerated stones, and stone heaps on
    travel routes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Kaieteur legend places a large village above the fall and describes an old
    man whose age made his life a burden to himself and troublesome to relatives.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The old man's relatives arranged that he should be assisted on his way to
    a spirit land described as two days' journey beyond the setting sun.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The old man was moved with his pegall of goods into a woodskin on the river
    above the fall and launched into the stream.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The flood carried the old man to the brink, and the falling waters bore his
    body into the basin below.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Afterward, the woodskin was said to appear as a pointed rock and the pegall
    as a huge square rock; the fall was named Kaieteur in memory of the victim.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Petroglyphs scattered through the Guianas are described as being credited
    with supernatural origin.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: At Waraputa Rapids, Indigenous companions would not damage the rock markings
    and ascribed them to the Great Spirit.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: At Waraputa Rapids, the crew was uneasy in what was called the abode of the
    Spirits and expected fire to descend as punishment for temerity.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Piapocos of the lower Guaviar River ascribe rock-gravings to Maminaimis,
    identified in the passage as Water Spirits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage states a belief in the origin of human and animal life from rocks
    or stones and in the transformation of sentient beings into inorganic material.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The transformation of sentient beings into stone is described as sometimes
    regarded as punishment.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: A detached peaked rock called the Caribisce is said to be a Carib man turned
    into stone for attempting to scale a cliff.
  category: object
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage mentions a Nation of Stone-adzes where all the people are really
    stones.
  category: object
  evidence_refs:
  - ev:7
- id: obs:14
  text: Some inorganic objects are described as having human-like instincts, powers,
    and ideas, including a rugged rock that quells a threatening fountain.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:15
  text: Some stones and geological specimens are treated as dangerous, evil, venerated,
    or dedicated to magical invocations.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:16
  text: On paths over the Savannah Mountains, small artificial stone heaps are described,
    and passing Indians add stones to them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:17
  text: A parenthetical note says that in the Gran Chaco, Indians going over a pass
    place a stone on the ground so that they will not get tired on the way.
  category: action
  evidence_refs:
  - ev:9
