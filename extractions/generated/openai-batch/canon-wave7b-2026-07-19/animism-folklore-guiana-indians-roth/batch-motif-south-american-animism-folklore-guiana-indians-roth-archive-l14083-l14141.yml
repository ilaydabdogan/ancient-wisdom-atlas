canonical_text:
  quote: ''
  summary: The passage contains the end of a bird-hunting episode in which a son-in-law
    separately shoots woodpeckers and exchanges them for sea-birds. It then gives
    a Warrau story of an old woman who misidentifies wasps as bees while gathering
    honey with her grandson, loses her apron-belt while fleeing stings, is later mocked
    after the child reveals the incident, and dies from shame. A following Arawak
    story begins with a younger brother visiting his elder brother's wife in the husband's
    absence, attempting coercion after refusal, and pursuing her into the bush. A
    note comments on reports about eating or avoiding bird eggs among Guiana groups.
  language: English
  quote_policy: summarized
