canonical_text:
  quote: ''
  summary: The passage contains two narrative episodes about supernatural male-like
    beings visiting women while their husbands are away. In the first, a Hebu threatens
    a wife into coming to his house, where she tricks and kills him with a bamboo
    knife before returning to her husband. In the second, a hairy Konoko-kujiiha visits
    a pregnant wife during her husband’s hunting absence, later returns at night,
    kills and eats the husband, and the woman flees.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the first episode, a husband leaves early for a drink-feast, and another
    man visits his wife during his absence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The visitor tells the wife to come with him and threatens to kill her if she
    refuses; her little child tells her not to go.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The visitor is identified as a Hebu, and his house contains dried meat including
    game, fish, bird, and human flesh.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife places selected meat in a pot on the fire while thinking of how to
