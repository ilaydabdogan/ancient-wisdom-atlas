    uses it while shaving him to cut his throat and kill him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The wife flees with her child to her husband, reports what happened, and later
    shows him the dead Hebu in the hammock.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the second episode, while a husband is away hunting acouri, his wife hears
    a whistling sound and receives a man-like visitor covered with hair.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The visitor is identified as a Konoko-kujiiha; he asks where the husband is
    and makes the wife shout three times to check whether the husband will answer.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The spirit tells the pregnant wife to dance and comes close to her; when leaving,
