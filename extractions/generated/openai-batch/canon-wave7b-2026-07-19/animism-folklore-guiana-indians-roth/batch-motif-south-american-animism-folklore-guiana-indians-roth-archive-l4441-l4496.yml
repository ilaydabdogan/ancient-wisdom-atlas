  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After the husband returns, the wife reports the visit, but the husband dismisses
    it as an old sweetheart.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: At night, the wife hears the spirit’s low whistling approach and cannot wake
    her husband from his deep sleep.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The spirit enters, kills and eats the husband, says the woman with a baby
    was the sweetest morsel, and the woman runs away.
  category: action
