  summary: The passage describes Guiana mainland beliefs about body spirits, spirits
    associated with animals, plants, landscapes, waters, sky features, and the dead.
    It summarizes ideas about spirits separating from dead bodies, remaining near
    the grave or taking other courses, and explains mortuary practices such as posture
    of burial, jumping over graves or pyres, and propitiating feared dead spirits.
  language: English
