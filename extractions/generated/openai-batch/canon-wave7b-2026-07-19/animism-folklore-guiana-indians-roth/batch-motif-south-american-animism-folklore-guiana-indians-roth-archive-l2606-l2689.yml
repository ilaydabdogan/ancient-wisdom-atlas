  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Mortuary procedures listed as indications of ideas about spirits include corpse
    position, propitiation and address, objects buried with the corpse, eating of
    the flesh, abandonment of the place of death, and other customs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Akawoio groups are reported as burying some dead in standing or sitting postures
    because the soul is still alive; standing represents life and lying down represents
    death.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Among Pomeroon Arawaks, stepping over a person who is lying down is described
    as a grave offense, with the offended person saying that one may cross him only
    when he is dead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At a Makusi woman's burial, relatives jump over the grave; at a Guahiba death
