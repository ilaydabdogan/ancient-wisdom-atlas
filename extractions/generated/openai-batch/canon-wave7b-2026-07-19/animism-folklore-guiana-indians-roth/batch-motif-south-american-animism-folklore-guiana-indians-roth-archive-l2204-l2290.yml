canonical_text:
  quote: ''
  summary: The passage surveys Guiana and Orinoco traditions about people, ancestors,
    stones, soil, rivers, flood survival, and the origin of cultivated plants. It
    includes an Arawak story in which a Tree Spirit visits three sisters, kills and
    eats the youngest, retreats to a hollow tree, is burned with his family by people
    directed by a piai, and from the ashes grow the first fruit trees, which the piai
    must taste first.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Trios are said to have held that people were originally like wood, stone,
    and similar things, and had no faces.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage notes traditions of a woman manufactured from a plima tree and
    a tree changing into a man.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Otomacs described a three-part stone on the summit of Barraguan as their
    earliest ancestress and another large rock on a nearby pinnacle as their first
    ancestor.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Otomacs placed skulls of the dead among crevices in rocks and stones,
    expecting the skulls to change into stone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Mapoyas called the summit stone Uruana and treated it as the source of
    their tribe.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Some Salivas said they were children of the soil and that the earth formerly
    bred men and women as it now produces thorns and hidden rocks.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Makusi tradition summarized here, Makunaima sent great waters; one
    man survived and threw stones behind him, thereby peopling the earth anew.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Some Achaguas believed they originated from rivers and distinguished themselves
    from tree-trunk-origin groups by name.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says Yahuna palm trees were believed to derive from the ashes
    of a human being, and that Arawaks and Caribs had similar views about cultivated
    plant origins.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Arawak story, a young man who is actually an Adda-kuyuha or Tree Spirit
    visits three sisters while the men are away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The visitor refuses pepper-pot, breaks a calabash containing caasiri, and
    the youngest sister laughs.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: At night another visitor resembling the first arrives, gets into the youngest
    sister's hammock, breaks her neck, eats her body except the head, and carries
    the head away by its long hair.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The two elder sisters watch where the Tree Spirit carries the head and see
    him disappear with it into a hollow tree.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After the sisters report the events, a piai instructs the people to gather
    firewood and bring it to the hollow tree.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The people burn the hollow tree; the Tukuyuha family screams inside, and the
    old grandmother reproaches her grandson.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: After the hollow tree and the spirit family are reduced to ashes, the first
    fruit trees grow from the ashes; the piai must taste the fruit before anyone else
    may touch it.
  category: sequence
  evidence_refs:
  - ev:11
