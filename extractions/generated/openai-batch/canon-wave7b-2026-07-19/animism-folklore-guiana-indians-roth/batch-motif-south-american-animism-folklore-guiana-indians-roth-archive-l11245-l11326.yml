canonical_text:
  quote: ''
  summary: The passage opens with a brief tale in which Uraima keeps a bird's egg
    in a calabash, two girls seize and break it, and Uraima declares that eggs will
    thereafter belong to women, who must hatch them. The remaining sections describe
    reported childbirth, pregnancy, and couvade observances among Guiana and related
    Carib, Arawak, Makusi, and Warrau contexts, including water and bathing restrictions,
    fire and navel-string practices, restrictions on pregnant women and fathers, and
    beliefs about an infant's material and spirit dependence on both parents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Uraima keeps a bird's egg in a calabash and cares for it until it should hatch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Two girls see the egg, ask Uraima for it, follow him after he refuses, seize
    it, and break it during a scuffle.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the egg is broken, Uraima says trouble will follow the women, that the
    egg had belonged to man, and that in the future it will belong to woman, who will
    have to hatch it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage states that only females lay eggs nowadays.
  category: other
  evidence_refs:
  - ev:1
- id: obs:5
  text: A True Carib man whose wife is pregnant rubs his shins with beaten and washed-out
    haiari before entering water, saying this prevents fish from sinking to the bottom.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Island Carib women are reported to deliver near a fire, bathe the child at
    once, and, if the birth occurs at night, men sleeping in the house bathe so that
    the child may not catch cold.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Pomeroon Arawak women are reported not to bathe infants until the navel-string
    heals, while the Makusi father is forbidden his usual bath during couvade.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The mother's bath is described as the final purification after the lying-in
    period in most tribes mentioned by the author.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: The umbilical vessels are reported as divided with a brand of fire, and old
    Arawak women are cited as saying the cord was formerly burned off with a heated
    nail.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: A pregnant woman is strictly prohibited from cooking for a man; she may clean
    meat, but must not cut off ears, nails, or fins while cleaning an animal or fish.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: Among the Makusi, men and women during couvade or lying-in must not scratch
    their bodies or heads with their nails; a piece of kokerite palm midrib is used
    instead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: During couvade, the Pomeroon Arawak husband is prohibited from smoking, lifting
    heavy weights, using a fish-hook, or having intimate relations with any woman;
    the Mainland Carib of Cayenne is not allowed to cut big timber with an ax; the
    Makusi must not touch weapons.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage says that if couvade prohibitions are not observed, some evil
    is expected to befall the child.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: A reported man during couvade lies in his hammock twisting a new bowstring;
    when the baby begins to scream, the father has to undo the whole line.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: The passage reports a belief that the baby is materially and spiritually part
    of both parents and is not considered independent at birth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:16
  text: The baby's material dependence on the father is said to cease when the navel-string
    is detached, marking the close of the father's couvade or 'hatching.'
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: The baby's spirit nature is said usually not to free itself from the mother
    until months later, when the child begins to crawl or walk; until then, influences
    on the mother may correspondingly affect the child.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:18
  text: When a Monica River woman carrying a very young infant meets a cross path,
    she breaks off leaves from a nearby bush and throws them on the other path so
    the baby's spirit follows her and does not go another way.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: After couvade, the baby's spirit is said to accompany the father for a similar
    period until the child can crawl.
  category: relationship
  evidence_refs:
  - ev:6
  - ev:8
- id: obs:20
  text: When the infant begins to crawl, its hair is cut for the first time, and in
    some tribes this occasion is said to have been celebrated by a festival.
  category: sequence
  evidence_refs:
  - ev:8
