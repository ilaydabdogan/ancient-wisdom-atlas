canonical_text:
  quote: '"Take care! You are cutting me."'
  summary: The passage contains a tale of a honey-finding man who discovers and marries
    Maba, the Honey-Mother, under a condition that he not speak her name; after he
    names her during a drinking occasion, she returns to her bees' nest and honey
    becomes scarce. It then gives a tale of a greedy hunter who claims a tiger's kill
    and is killed and eaten while his wife survives on a high drying rack. The passage
    ends with the beginning of a tale in which a young wife is sent home with a knife
    and climbs a palm in the bush at night.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A man reputed for finding bees' nests chops into a hollow tree for honey and
    hears a voice from inside warning that he is cutting the speaker.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside the hollow tree he discovers a beautiful nude woman who identifies
    herself as Maba, the Honey-Mother and Spirit of the Honey.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: After receiving cotton and making herself a cloth, the woman agrees to be
    the man's wife on the condition that he never mention her name.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The man remains notably successful at finding bees' nests, and the woman becomes
    known for brewing cassiri and paiwarri from one jugful sufficient for all visitors.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the man accidentally speaks Maba's name to guests, she flies away to
    her bees' nest, his luck departs, and honey becomes scarce.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: An Indian hunter finds a freshly killed Maipuri, understands that a Tiger
    killed it, and plans to claim the meat for himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hunter's wife recognizes signs that he did not kill the animal and builds
    two babracotes, one low and one high.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The husband sleeps in his hammock near the fire while his wife tries unsuccessfully
    to wake him by calling, throwing water, and using a blazing fire-stick.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Tiger kills the husband and returns over four nights to eat him until
    there is no more man, while the wife remains on the high babracote.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A man takes a young wife in addition to his old wife, but after conflict between
