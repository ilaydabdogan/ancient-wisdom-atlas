  summary: The passage records Guiana and neighboring Indigenous and Afro-Surinamese
    beliefs about thunder, storms, water-passage rites, talismans, omens, soul separation,
    birth signs, social taboos, war auguries, and examples of unusual events taken
    as tokens of coming misfortune.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: River Indians blame Jurupari for thunderstorms and say he is angry with them
    at those times.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Kobéuas believe that at death the spirit separates from the body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Warraus believe thunder is the roar of Black Tiger.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Old-time Indian stone weapons are regarded as thunderbolts by Surinam negroes
    and as talismans or amulets for protection against lightning and thunder by people
    at Caracas and elsewhere.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Carib Islanders crossing by sea avoid drinking pure water and avoid spilling
    water in the canoe or sea because spilling would cause the sea to swell and bring
    rain and bad weather.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At certain sea places, Carib Islanders throw food overboard for Caribs who
    perished there and are said to have huts at the bottom of the sea; otherwise the
    boat could capsize.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: When a storm cloud is seen, Carib Islanders blow into the air and move their
    hands to drive it away and turn the rain elsewhere.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: To calm the sea and allay a storm, Carib Islanders chew cassava and spit it
    into the air and sea to appease Chemeen, who is described as perhaps angry because
    hungry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: With an unfavorable wind, an old man strikes the canoe’s hydrant with an arrow
    so that the canoe may go straight as an arrow; if wind makes them lose sight of
    land, they consult the devil.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: The chapter outline classifies omens, ordeals, charms, Binas, and talismans,
    including a note that certain hunting Binas were originally obtained from a snake.
  category: other
  evidence_refs:
  - ev:4
- id: obs:11
  text: Omens are named adijmahu among the Arawaks and asijatav-aha among the Warraus.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Children born with a caul are considered lucky because they will see Yawahu
    spirits and become more clever.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: If a small child of an absent fishing or hunting father pretends to cook by
    putting a pot on the fire, the mother interprets it as assurance that the father
    is bringing something home.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Among Arawaks, sudden sleepiness or spitting during sleep means someone is
    about to visit, while sneezing and yawning are times when the spirit temporarily
    leaves the body through the nose and mouth.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: Pointing a finger at another person is treated as a serious affront, as is
    stepping over someone lying on the ground, which the recumbent person interprets
    as being treated like the dead.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: A sprained foot suffered by a chieftain was taken as a bad omen by Makusis
    and Arekimas, many of whom turned back from the journey.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: Pomeroon Caribs seeking to assure warrior victory whip two boys; if the boys
    do not cry or groan, victory is certain, and arrows hitting a roof target indicate
    how many enemies will be killed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: Island Caribs treat being discovered before the first blow, or a dog yelping
    at them, as bad augury and return to their boats.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: The author states generally that anything out of the ordinary is accepted
    as a token of impending evil, and gives examples involving a turtle, a dead husband’s
    appearance, and a younger brother making noise while fishing.
  category: other
  evidence_refs:
  - ev:11
