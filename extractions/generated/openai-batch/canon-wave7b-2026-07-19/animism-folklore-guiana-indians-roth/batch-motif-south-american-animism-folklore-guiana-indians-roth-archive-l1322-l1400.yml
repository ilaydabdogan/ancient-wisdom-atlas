canonical_text:
  quote: ''
  summary: Kororomanna remains lost and repeatedly encounters Hebu or spirit dangers.
    He kills a Hebu child in a hollow tree, redirects the mother's footprint-burning
    curse onto her, escapes a Hebu spring-trap by pretending to be dead, and later
    evades the talking skull Kwa-muhu, which drowns after mistaking a deer for him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kororomanna is still lost after daylight and does not know how to find the
    road home.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: He finds a baby inside a fallen hollow tree and slaughters it after recognizing
    it as a Hebu's child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The child's mother examines fresh tracks, identifies the killer from the footprints,
    digs up soil marked by a footprint, wraps it in a leaf, and hangs it from a branch.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kororomanna removes the footprint soil from the bundle and substitutes a footprint
    of the Spirit woman before hiding again.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The mother burns the footprint bundle with a curse intended to draw the footprint's
    owner into the fire, but she herself is drawn in and burnt to ashes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After further wandering, Kororomanna steps onto a clean roadway and his foot
    sticks in a spring-trap set by the Hebus.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Unable to free himself, he fouls himself completely and lies still pretending
    to be dead while flies and worms gather on him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two Spirits find him in the trap, think he is a fish, release him, and carry
    him to the riverside to wash and clean him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: While the Spirits delay cutting him open in order to make a basket, Kororomanna
    rolls down the bank into the water and escapes to the other side.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Kororomanna later sees a man's skull, Kwa-muhu, and jerks his arrow into its
    eye-ball.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kwa-muhu tells Kororomanna that, because he has injured him, Kororomanna must
    carry and feed the skull; the skull grows heavier until the bark carrying-strip
    breaks.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Kororomanna sets the skull down on a pretext and flees across a creek; Kwa-muhu
    pursues, mistakes a deer for Kororomanna, kills it, then falls into the creek
    and drowns while trying to leap across.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: After Kwa-muhu drowns, all the ants come out of his skull.
  category: action
  evidence_refs:
  - ev:6
