canonical_text:
  quote: ''
  summary: The passage summarizes Guiana Indian ideas about spirit immortality, corpse
    treatment, spirit destinations, good and bad spirits, and ritual removal of undesirable
    spirits. It then describes beliefs in perpetual bodily and spiritual existence,
    consultation of a buried Roucouyenne piai, requests for objects or remedies against
    death, and myths in which changed or cast-off skins are linked with everlasting
    life. Amalivaca's departure and Kururumanni's removal and redistribution of everlasting
    life explain why humans die while skin-casting creatures live on.
  language: English
  quote_policy: summarized
