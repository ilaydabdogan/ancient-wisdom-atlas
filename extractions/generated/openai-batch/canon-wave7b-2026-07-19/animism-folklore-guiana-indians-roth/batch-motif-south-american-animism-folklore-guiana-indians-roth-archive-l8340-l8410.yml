canonical_text:
  quote: ''
  summary: Two daughters disobey their mother's prohibition against touching a hidden
    basket and find Nohi-abassi alive inside. The younger daughter takes him as husband.
    Nahakoboni accepts the marriage on condition that he provide food, threatening
    to eat him if he fails. Tired of fishing for her, Nohi-abassi arranges for a shark
    to devour Nahakoboni at the water. The elder daughter discovers this and pursues
    Nohi-abassi and his wife with a cutlass. They climb a tree; she cuts off part
    of his leg. The wife, Nohi-abassi, and the severed leg are then identified with
    the Pleiades, Hyades, and Orion's Belt, while the leg is also described as the
    mother or spirit of the maam bird.
  language: English
  quote_policy: summarized
