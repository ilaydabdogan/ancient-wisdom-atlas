canonical_text:
  quote: ''
  summary: 'An elder hunter named Nohiabassi observes a very large woman named Nahakoboni
    catching fish in a creek, eating one of each pair and placing the other in a basket
    while spinning an upside-down calabash on the water. His younger brother asks
    to see her and promises not to laugh. When both brothers hide in trees by the
    creek, the younger brother laughs as Nahakoboni tries to seize his shadow in the
    water. In anger she sends yackman ants up the trees: the younger brother is forced
    into the water and eaten, and Nohiabassi is forced down, put in her basket, and
    carried home. A note identifies Nahakoboni as a Bush Spirit or Hebu.'
  language: English
  quote_policy: summarized
