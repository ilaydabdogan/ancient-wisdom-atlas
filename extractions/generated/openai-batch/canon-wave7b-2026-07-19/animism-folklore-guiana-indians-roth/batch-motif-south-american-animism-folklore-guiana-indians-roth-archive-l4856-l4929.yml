canonical_text:
  quote: ''
  summary: The passage first narrates a group killing an elder brother by luring him
    from his hammock with swift animals after fearing his bone-points as weapons.
    It then describes procedures among several Guiana and Orinoco groups for expelling,
    deterring, appeasing, or avoiding Bush Spirits, evil spirits, animal spirits,
    and the Yurokon through sound, dance, food offering, protective utterance, a skull,
    careful response to forest sounds, and a string puzzle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A fugitive reaches home and tells others that something has happened to his
    brother, that they cannot be friends with him, and that they must kill him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The group follows the fugitive into the bush and surrounds the banab where
    the elder brother is resting in his hammock.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The group is afraid to attack the elder brother in place because he can skillfully
    use his bone-points as spears; their plan is to draw him into the open where the
    bones must serve as feet.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A hummingbird is sent to fly around the hammock, but after many trials the
    elder brother succeeds in spearing it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A swifter squirrel repeatedly passes the hammock, causes the bone-point to
    miss, and decoys the elder brother closer to the surrounding people, who fall
    upon and destroy him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: Warrau procedures for exorcising evil spirits from a dancing-ground include
    clanging Thevetia seeds, a flute imitating a monkey voice, circling the leader,
    laying instruments down, bending down, murmured words, and resuming the instruments
    after a signal.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: Makusi combined games and dances begin and end with a deafening universal
    shout like dogs howling, used to expel evil spirits from the neighborhood.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Orinoco wedding festivities, a dancing party with flutes and kettledrums
    circles the brides' houses; an old woman gives a plate of food to a dancer; the
    group returns to the bush, scatters the plate and food, and addresses a 'devil
    of a dog' to take the food and not disturb the festivities.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A hunter returning from the chase may shout the name Shimarabu-akaradani before
    entering the house to prevent Bush Spirits from coming in.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: An alligator skull stuck up in a Carib house is said to prevent the Yurokon
    from entering it.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: When traveling where spirits are lurking, people are advised not to be without
    a companion and to determine the cause of unusual sounds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: 'The passage reports that a bad spirit and a good spirit walk together: the
    bad one wishes to injure living people, while the good one breaks a twig or branch
    to test whether a person will look around.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: A person is described as saved from harm if he looks around when called by
    the twig-breaking sign, but in danger if he does not look.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Warraus and others who hear an unusual cry or uncanny noise in the bush call
    out for the being to show itself or bring food; Caribs are said to divert a spirit
    met on the road with a string puzzle.
  category: action
  evidence_refs:
  - ev:7
