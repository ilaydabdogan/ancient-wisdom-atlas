comparison_claims:
- id: claim:1
  claim: 'The passage itself presents Warrau and Makusi practices, and an Orinoco
    wedding practice, as comparable in function: sound, movement, and in one case
    food offering are used to expel, deter, or prevent disturbance by spirits.'
  claim_level: same_function
  target: Warrau, Makusi, and Orinoco Guayquiries/Mapojes spirit-expulsion or spirit-deterrence
    practices
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a functional comparison within Roth's ethnographic presentation;
    the details, settings, and named groups differ, and no historical-contact claim
    is supported by this passage alone.
- id: claim:2
  claim: The passage groups several precautions as functionally similar ways of avoiding
    or diverting dangerous spirits near houses, hunting returns, roads, and forests.
  claim_level: same_function
  target: Protective precautions against Bush Spirits, animal spirits, road spirits,
    and Yurokon in Guiana traditions described in the passage
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The examples are adjacent and thematically linked in the passage, but
    they involve different situations and beings; no single shared origin is implied.
