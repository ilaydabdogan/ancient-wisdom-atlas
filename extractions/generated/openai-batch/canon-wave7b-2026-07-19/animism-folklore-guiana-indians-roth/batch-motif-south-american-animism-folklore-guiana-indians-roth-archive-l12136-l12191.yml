canonical_text:
  quote: ''
  summary: 'The passage describes powers attributed to piais, medicine-men, doctors,
    conjurers, or sorcerers in Guiana and neighboring ethnographic reports: command
    over animals and bees, hunting charms, power over game and fish, animal transformation
    including tiger forms, invisibility, mountain roaming while a good spirit cures
    a sick man, summoning and questioning spirits, sending one’s own spirit for information,
    and interpreting dreams understood as people’s spirits.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Viitti is described as refusing to kill certain animals, including powis,
    maroodies, and the Axua tiger, and as saying he could put his hand on the Axua
    tiger when he went out.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wild-bee nests are described as fixed to tree branches, and Indians are said
    to kindle fires under them so the insects abandon the nests.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A conjurer or piaiman approaches a bee nest, draws his fingers under his armpits,
    knocks on the hive, and drives out the bees without being injured.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The piai system is described as making hunting a secret art taught by the
    priest-doctor, who gives hunters charms called maklar and hina to ensure success.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among Indians of the Uaupes River, piais are said to be believed able to destroy
    dogs or game and make fish leave a river.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The medicine-man is said to be able to transform himself into an animal; if
    his wife becomes pregnant she may bear him a tiger, and he may transform into
    a tiger at death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Doctors are said to have power over their own spirits sufficient to make themselves
    invisible.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: A sorcerer at Roraima is reported to have the power to make himself invisible
    at will.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A piai is said to go among the mountains at night while his good spirit remains
    in a house to cure a sick man.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The medicine-man is said to invoke spirits generally and spirits of particular
    birds and beasts.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The piai-man is said to summon and question the spirit of a sleeping or far-away
    Indian to learn what an absent friend is doing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The piai-man may send his own spirit to obtain information while his body
    remains present.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The piai is described as an interpreter of dreams, both dreamer and seer,
    in a context where dreams are identified with people’s spirits.
  category: attribute
  evidence_refs:
  - ev:8
