literal_observations:
- id: obs:1
  text: The author states that Guiana folklore includes fish folk, Amazons, and orang-utang-like
    beings, and explains these as people or animals reimagined through habitat, dress,
    or size.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The Toupinambous are reported to describe two mainland nations near their
    island: Guayazis, who are dwarfs, and Matayus, whose feet turn backward.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The backward feet of the Matayus are said to make their tracks misleading
    to someone trying to follow them.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Matayus are said to be tributary to the Toupinambous and obliged to supply
    stone hatchets used for felling trees and clearing ground.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Trio belief is reported that people were originally like wood and stone
    and had no faces.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Ouayanas are reported to avoid a stream because of reputed white-haired
    Indians who sleep by day and walk by night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A guide is reported to have said that villagers seen on distant ridges were
    turning white and would become white people; the passage also notes an association
    of white people with life everlasting in this world.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Touvingas, or Two-fingered Negroes, are described as having two large
    fingers and two large toes, compared to those of a crab.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Rayas are placed by missionaries in the forests of the River Sipapo and
    are believed to have mouths in their navels.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mianiko, described as one of three tribal Kobéua heroes, is said to have no
    head and eyes in place of nipples.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:11
  text: Amazons are described as believed in by Indians, connected with several legends,
    and characterized as valiant females who amputate the right breast for freer movement
    in battle.
  category: attribute
  evidence_refs:
  - ev:9
