  summary: The passage introduces a chapter section on unusual human and animal-related
    beliefs. It explains several Guiana folklore categories, then reports accounts
    of dwarfs, backward-footed people, faceless primordial people, white-haired nocturnal
    people, two-fingered people, acephalous or navel-mouthed people, a headless hero
    with eyes at the nipples, and Amazons described as female warriors.
  language: English
