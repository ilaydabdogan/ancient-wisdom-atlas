canonical_text:
  quote: ''
  summary: Three children disappear from their homes, wander onward, instruct wasps
    to sting and cause fever, and are later found at the seashore as big boys. Kurusiwari
    refuses to return home but says his parents may see him if they build a Spirit-house
    and call him with tobacco. Since tobacco is not locally available, the father
    sends birds to obtain tobacco seed from the oversea island Nibo-yuni, inhabited
    by women; earlier birds are killed by a watch-woman, and a crane and hummingbird
    attempt the crossing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A missing child named Kurusiwari is found playing at a neighbor's house; after
    the adults become absorbed in conversation, Kurusiwari and another child, Matuia-wari,
    are missing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The searching parents later find the two children playing with a third child,
    Kdwai-wari; after another delay, all three children are missing.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The three children wander onward and make friends with marabunta wasps, which
    the passage says formerly talked but did not sting.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The children tell the black wasps to sting people and the red wasps to give
    people fever in addition.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the seashore, the first pair of parents meet the three children, who are
    now described as big boys.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: Kurusiwari refuses to go back, saying his stepmother pushed him and his parent
    or parents would not look at him when he cried.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: After his father and mother implore him, Kurusiwari says they may see him
    if they build a proper Spirit-house and call him with tobacco.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kurusiwari and the two other boys cross the seas, while the parents return
    home.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The father builds the Spirit-house and burns pappaia, cotton, and coffee leaves,
    but the passage says these have no strength and that only tobacco can supply it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Tobacco is said not to grow locally at that time but on an island over the
    sea called Nibo-yuni, glossed as 'Man-without' and described as peopled entirely
    by women.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: The father sends a gaulding bird and then various sea-birds to fetch tobacco
    seed; they do not return because a watch-woman kills them when they alight on
    the tobacco-field.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The father consults a brother, who brings him a crane for the mission to Nibo-yuni.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A hummingbird asks the crane about his errand, offers to go instead, and is
    dismissed because his 'boat' is said to be too small.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The hummingbird starts before daylight, struggles in the water, is carried
    by the crane, is forced to fly again after being dirtied, and reaches Nibo-yuni
    before the crane.
  category: sequence
  evidence_refs:
  - ev:8
