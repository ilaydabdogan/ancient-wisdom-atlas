canonical_text:
  quote: ''
  summary: A girl catches an unusual fish, keeps and tends it, then later releases
    it at her bathing place. Her mother identifies it as Ho-aránni, the Water Spirit,
    and warns her not to bathe while moon-sick. The young woman ignores the warning;
    after three warning movements, the Water Spirit swallows her. Her father, a piai,
    seeks the Water Spirit in its underground cavern, is killed, but signals his relatives
    with a shell. They dig, uncover the pair, kill the Water Spirit, and leave its
    bones. A closing note states that denizens of the deep, like Bush Spirits, are
    associated with disease and sickness and are invoked by a Carib medicine-man.
  language: English
  quote_policy: summarized
