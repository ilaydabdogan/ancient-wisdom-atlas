canonical_text:
  quote: ''
  summary: A hunter leaves his wife at a banab while he hunts. A Kokono-kuyuha or
    Bush Spirit visits, later returns at night, kills the sleeping husband, and fails
    to find the hidden wife. The widow reports the killing to her brother. The brother
    and sister return, deceive the Spirit into coming again, lure him into a dance,
    and the brother shoots him with a special arrow. When the Spirit's wife comes
    seeking revenge-payment, the brother kills her too.
  language: English
  quote_policy: summarized
