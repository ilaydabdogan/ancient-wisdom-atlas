canonical_text:
  quote: ''
  summary: A hunting party is trapped in darkness; a lagging man’s repeated call is
    identified with the little night owl’s song. The family tries inadequate artificial
    lights, then sends daughters to fetch distant daylight. The elder daughter fails
    after a sexually coded lock-and-key episode, while the younger daughter succeeds
    and brings Daylight back. The passage then lists methods and taboos for producing,
    stopping, or intensifying rain, including water rites, animal remains, snakes,
    birds, frogs, a half-submerged tree stump associated with a young woman, and restrictions
    on washing utensils or spilling water while traveling.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Four hunters, consisting of a man, his wife, and two daughters, are caught
    by nightfall far from home while another man remains far behind them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lagging man calls for the four to wait, cannot reach them, keeps singing
    “Mawa-hakotii,” and is identified as the little night owl that still sings that
    way.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Darkness becomes so thick that the four cannot travel; they wait without daylight,
    and attempts to make light with ite-palm leaves and wax rolled in a leaf burn
    away too quickly.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:3
- id: obs:4
  text: The parents see a little dawn far away in the bush and send the elder daughter
    to bring it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The elder daughter walks crookedly and crossways, which the narration explains
    as a token that she will not obtain daylight because she has already had dealings
    with a man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the place of daylight, the elder daughter meets an old man, his wife, and
    their son; the son’s key does not fit the lock because it has been tampered with,
    and she returns without daylight.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The younger daughter insists on going, travels without stumbling because she
    has not had dealings with a man, receives the Daylight from the young man, and
    brings it back to her parents and sister.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that rain may be produced or stopped by human, animal,
    or spirit agency, while also appearing to have an independent existence.
  category: other
  evidence_refs:
  - ev:7
- id: obs:9
  text: Named rain-producing methods include soaking cassava stalks, washing scrapings
    from a large alligator tooth, burning a camudi carcass, and killing a snake.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A half-submerged tree stump named Iboma Git, glossed as “young woman,” is
    struck and called to in dry weather to vex the woman and cause rain.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Additional rain-associated agents include cursing the black kurri-kurri bird,
    a large eagle, a camudi, and frogs.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: Certain taboos around washing a pot-spoon in river or sea water, spilling
    fresh water in a traveling boat, placing a pot in water, or washing the inside
    of a pot are linked with storms, heavier rain, or stopping rain.
  category: relationship
  evidence_refs:
  - ev:11
