candidate_motifs:
- id: motif:1
  label: Human call becomes owl song
  taxonomy_refs:
  - shapeshifter
  basis: The man left behind repeats a phrase asking the others to wait, and the narrative
    identifies him with the little night owl that still sings that phrase.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage gives an etiological identification with the owl, but does
    not narrate a detailed transformation process.
- id: motif:2
  label: Retrieval of daylight from a distant place
  taxonomy_refs: []
  basis: The family is trapped in darkness, sees dawn far away, and the younger daughter
    obtains Daylight from a distant household and brings it back.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: No available taxonomy reference closely matches this daylight-retrieval
    episode.
- id: motif:3
  label: Sexual status determines success in obtaining daylight
  taxonomy_refs: []
  basis: The elder daughter fails after being described as having had dealings with
    a man, while the younger succeeds after being described as not having had such
    dealings.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage uses euphemistic and Latinized language; the extraction preserves
    the passage’s stated contrast without expanding beyond it.
- id: motif:4
  label: Rainmaking through sympathetic water rites and animal remains
  taxonomy_refs:
  - serpent
  basis: Rain is induced by soaking cassava stalks, washing alligator tooth scrapings,
    burning a camudi carcass, and killing a snake.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The serpent taxonomy applies specifically to camudi/snake elements, not
    to every listed rainmaking procedure.
- id: motif:5
  label: Angering a female-associated stump to cause rain
  taxonomy_refs: []
  basis: A stump named as a young woman is called to and slashed so that the woman
    becomes vexed and rain falls.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage gives alternative explanations for the woman’s association
    with the site and does not elaborate her ontological status.
- id: motif:6
  label: Weather taboos around washing utensils and spilling water
  taxonomy_refs: []
  basis: Washing a pot-spoon in river or sea water, spilling fresh water in a boat,
    or placing a pot in water is linked to squalls, storms, or heavier rain, while
    not washing a pot can stop rain.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The examples are drawn from several named settings and groups within the
    passage.
- id: motif:7
  label: Animal agencies in causing rain
  taxonomy_refs:
  - serpent
  basis: The passage states or reports that a camudi, snake, black kurri-kurri bird,
    large eagle, and frogs are connected with causing rain.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: high
  cautions: The exact mechanism varies by animal and locality; some are materials
    used in rites while others are agents or targets of speech.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares Guiana beliefs about burning a camudi carcass
    for rain with an Oyambis of Cayenne belief in the efficacy of killing a snake.
  claim_level: same_function
  target: Oyambis of Cayenne snake-killing rainmaking belief
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: high
  limitations: The comparison is limited to the shared rainmaking efficacy of killing
    or burning serpent-like animals as reported in the passage.
- id: claim:2
  claim: The passage explicitly juxtaposes the daylight episode’s genital lock-and-key
    imagery with a Pareasi report from Peru of vaginal origin for organic and inorganic
    nature.
  claim_level: same_motif
  target: Pareasi vaginal origin of organic and inorganic nature
  evidence_refs:
  - ev:5
  - ev:6
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The Pareasi material is only a brief editorial note; the passage does
    not provide the full Pareasi narrative.
- id: claim:3
  claim: The passage compares rain taboos involving washing pots with a Cayenne bush-negro
    instruction not to wash the inside of a pot in order to stop rain.
  claim_level: same_function
  target: Cayenne bush-negro pot-washing rain-stopping advice
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The claim concerns the specific functional association between pot
    washing and rain control, not broader historical relation.
