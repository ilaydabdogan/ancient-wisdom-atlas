candidate_motifs:
- id: motif:1
  label: descent from sky-world to earth through an opening
  taxonomy_refs:
  - hero_descent
  - departure
  basis: The Warrau account places the people above the sky, has Okonor6t6 discover
    the earth through a hole, descend by rope, and later has the people descend collectively.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The available taxonomy has no exact sky-to-earth migration tag; hero_descent
    and departure are approximate but directly supported by the descent sequence.
- id: motif:2
  label: blocked passage prevents return to former home
  taxonomy_refs:
  - return
  basis: The final woman becomes wedged in the aperture, filling the hole and preventing
    the Warraus from reaching their old home again.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The taxonomy ref is a negated or failed return rather than a successful
    return.
- id: motif:3
  label: woman in passage identified as Morning Star
  taxonomy_refs: []
  basis: The passage names the stuck woman Okona-kura and states that the Warraus
    recognize her as the Morning Star.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No available taxonomy reference directly covers astral transformation
    or identification.
- id: motif:4
  label: people claim descent from the Sun
  taxonomy_refs:
  - divine_parent_child
  basis: Certain Salivas proclaim themselves children of the Sun.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives only a brief statement without narrative details.
- id: motif:5
  label: human groups originate from pre-existing natural forms
  taxonomy_refs: []
  basis: The author summarizes that original ancestors are derived from animals, plants,
    rocks, stones, and rivers rather than created from nothing.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is an ethnographic generalization, not a single narrated episode.
- id: motif:6
  label: jaguar or tiger ancestry of Caribs
  taxonomy_refs: []
  basis: Achagua explanations identify Caribs as legitimate descendants of tigers
    or children of tigers with pikes.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The report is mediated through Achagua terminology and ethnographic interpretation.
- id: motif:7
  label: people emerge from worms in a slain serpent’s body
  taxonomy_refs:
  - serpent
  basis: In the Saliva account, worms develop in the entrails of a killed snake and
    each worm becomes a Carib Indian and his woman.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The transformation is from worms in the serpent’s corpse, not directly
    from the serpent alone.
- id: motif:8
  label: forbidden bathing leads to water-snake encounter and pregnancy
  taxonomy_refs:
  - serpent
  basis: The sister ignores a warning not to bathe in a certain pond at a certain
    time, is caught by Uamma the water-snake, and becomes pregnant.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No available taxonomy reference specifically covers bathing prohibition
    or menstrual taboo; serpent is the closest supported family.
- id: motif:9
  label: water-snake changes into a man to provide tree food
  taxonomy_refs:
  - shapeshifter
  - serpent
  basis: Uamma exits from the woman, climbs a bullet-tree, changes into a man, shakes
    down seeds, then returns to snake form.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage excerpt ends mid-sentence after the descent from the tree,
    so later consequences are not included.
comparison_claims:
- id: claim:1
  claim: The passage itself compares the Warrau water-snake account of Carib origin
    with Brett’s Legend of Korobona, indicating a similar special water-snake tradition.
  claim_level: same_motif
  target: Brett’s Legend of Korobona (BrB, 64)
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: Only the comparison statement and the beginning of the Warrau version
    are provided; the Brett version is not included in the supplied passage.
- id: claim:2
  claim: The passage groups jaguar and snake pedigrees as common animal-origin patterns
    for peoples claiming animal descent, with Carib examples supplied from Achagua
    and Saliva reports.
  claim_level: same_function
  target: animal-pedigree origin traditions involving jaguars and snakes in the nearby
    Guiana/Orinoco corpus
  evidence_refs:
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an ethnographer’s comparative summary rather than a direct
    comparison of full narrative variants.
