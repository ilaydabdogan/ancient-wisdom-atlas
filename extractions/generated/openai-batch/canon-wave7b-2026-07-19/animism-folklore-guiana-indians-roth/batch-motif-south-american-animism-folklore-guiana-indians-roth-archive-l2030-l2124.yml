canonical_text:
  quote: ''
  summary: 'The passage reports several Guiana origin traditions and ethnographic
    comparisons: a Warrau sky-origin account in which a hunter discovers the earth
    through a hole, descends by rope, returns with deer flesh, and later the Warrau
    descend but lose access to the sky when a woman becomes wedged in the aperture
    and is identified as the Morning Star; a brief Saliva claim of descent from the
    Sun; a discussion of human origins from pre-existing natural forms; reports of
    Carib origins from jaguars and serpents; and the beginning of a Warrau Carib-origin
    tale involving a forbidden pond, a water-snake, pregnancy, and the snake changing
    into a man to gather bullet-tree seeds.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the Warrau origin account, the Warraus are said to have lived above the
    sky and to have known only birds.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Okonor6t6 hunts a rare bird, shoots it, and finds a large hole at the place
    where it fell; through the hole he sees animals on green plains below.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Okonor6t6 descends to earth with a cotton rope, sees wild animals and predators,
    shoots and cooks a young deer, and ascends back with some of the flesh.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Warraus descend one after another, but the last person, a woman, becomes
    wedged in the aperture, filling it so that the Warraus cannot reach their former
    home again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman stuck halfway is named Okona-kura and is recognized by the Warraus
    as the Morning Star.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Certain Salivas proclaimed themselves children of the Sun.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author states that available evidence does not clearly support creation
    of humans from nothing, and says native accounts more often derive people from
    existing natural forms such as animals, plants, rocks, stones, and rivers.
  category: other
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage lists reported creator figures in Arawak, Maipure, and Akawai
    traditions, while also describing these examples as dubious or affected by Christian
    ideas.
  category: other
  evidence_refs:
  - ev:5
- id: obs:9
  text: Jaguars, called “tigers” in the text, and snakes are described as common animal
    sources for peoples claiming animal pedigree; Achagua explanations connect the
    Caribs with tigers and with children of tigers with pikes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: In a Saliva account, the son of Puru kills a destructive snake; when the snake
    putrefies, worms develop in its entrails, and from each worm arise a Carib Indian
    and his woman.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Warrau Carib-origin tale, a Warrau man warns his sister not to bathe
    in a neighboring pond at certain regular periods; she later bathes at the forbidden
    place and time, is caught by the water-camudi Uamma, and becomes pregnant.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: During bullet-tree season, the woman repeatedly returns with many seeds although
    she takes no ax; her brother watches her and sees the Uamma snake exit from her
    body, coil around a large bullet-tree, and climb into its branches.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: In the tree, the Uamma snake changes into a man, shakes the branches so that
    seeds fall for the woman, then returns to snake form and descends the tree.
  category: sequence
  evidence_refs:
  - ev:10
