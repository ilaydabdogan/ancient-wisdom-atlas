  quote: ''
  summary: 'The passage catalogues Guiana and nearby Amazonian bird omens: a feared
    Wacarai/Sumpy bird communicates with the dead and conjurers; owls and other birds
    signal sickness, death, pregnancy, birth, funerals, marriage, visitors, hunting
    luck, and other outcomes; some birds or feathers are avoided because they are
    believed to bring harm.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Wacarai or Sumpy Bird is reported as not being killed, because it is said
    to communicate with the dead and bring messages to conjurers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Named owls and night-owls are said to be heard when someone is sick or near
    death, and particular owl cries are linked with pregnancy, birth, or death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: At an Apalai village, notes of a bird thought to be a screech-owl caused an
    escort to panic, extinguish torches, and flee in the dark.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Baridi hawks flying in pairs are treated as funeral omens, and a black eagle
    near huts is said to warn of a household death.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The koko-bero, kwar-kwarra, kareo-obannahu, and beletika are linked respectively
    with pregnancy or a sick baby, an evil message, a patient's condition, and an
    impending marriage.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: On hunting or food-seeking occasions, the karrasuri's different cries, the
    bukulaura's orientation, and a munirikuti ant bite are read as signs of success,
    failure, fortune, or obtaining satisfying food.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A journey account says safety from drowning was attributed to respectful conduct
    toward a trogon, and that turning one's back on this bird at departure brings
    ill luck.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Gazing too long at the great red macaw is discouraged because it is said to
    cause baldness.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: A warracabba near the house with a leaf in its mouth is believed to announce
