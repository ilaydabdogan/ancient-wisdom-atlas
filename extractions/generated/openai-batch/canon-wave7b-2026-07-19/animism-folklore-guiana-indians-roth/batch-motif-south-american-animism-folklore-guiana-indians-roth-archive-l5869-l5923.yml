canonical_text:
  quote: ''
  summary: Three brothers take their sister to a bush camp while they hunt unsuccessfully.
    A tree-frog named Adaba, living in a water-filled hollow tree near the camp, changes
    into a man after the sister asks him for game. He brings meat, cleans fungus from
    the brothers' arrows, teaches them a successful shooting method, and becomes the
    sister's husband and the brothers' brother-in-law. When the wife tries to make
    him bathe in a pond, he returns to frog form and goes back into the hollow tree,
    after which the brothers lose the exceptional hunting success associated with
    him. The passage then begins a separate tale in which a fisherman in the upper
    creeks hears a thunder-like noise.
  language: English
  quote_policy: summarized
