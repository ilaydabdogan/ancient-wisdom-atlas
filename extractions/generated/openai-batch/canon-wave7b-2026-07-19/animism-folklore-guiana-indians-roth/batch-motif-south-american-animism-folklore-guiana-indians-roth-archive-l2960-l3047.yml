canonical_text:
  quote: ''
  summary: The passage surveys several Indigenous Guiana and Venezuelan accounts of
    postmortem spirits or souls. It describes skyward ascent, cloud-level separation
    of good and wicked spirits, smoke-assisted ascent after burning the body, Island
    Carib destinies based on valor or cowardice, Arawak distinctions of good and evil
    spirits, animal swallowing or transport on the way to paradise, a westward soul
    journey obstructed by a great bird, and the Guacharo cavern as a passage or detention
    place before the other world.
  language: English
  quote_policy: summarized
