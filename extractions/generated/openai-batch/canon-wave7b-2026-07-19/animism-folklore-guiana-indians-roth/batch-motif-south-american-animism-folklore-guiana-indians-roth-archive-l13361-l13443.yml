  quote: ''
  summary: The passage records beliefs and sayings concerning a hairy forest man,
    monkeys used in proverbs and cures, the Warracaba tiger as a feared pack creature,
    general beliefs about tigers and jaguars, and tapir traits and medicinal uses
    of tapir parts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A hairy man of the woods is described as carrying off women, building huts,
    and sometimes eating human flesh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The forest being is named salvaje, achi by the Tamanacs, and vasitri or “great
    devil” by the Maypures.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A reported woman from San Carlos is said to have lived for years with a man
    of the woods and to have had slightly hairy children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Arawak proverb about a shot black monkey and licking blood is applied to
    a man working hard all day and to the reviving effect of paiwarri.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among Maroon people of the Maroni, the vocal apparatus of a howling monkey
    is preserved and made into a drinking cup for children with stammering.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: Humboldt was told that asthma could be cured by drinking from the bony drum
    of the howling monkey’s hyoidal bone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Warracaba tiger is presented as a local and comparatively recent belief,
    possibly related to other mythical tigers or to indigenous wild dogs that hunt
    in packs.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Wapisiana informants said a night could not be spent near Ataraipu Rock because
    a pack of Warracaba tigers inhabited the district.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Barrington Brown’s account describes Warracaba tigers as small, very ferocious,
    pack-hunting creatures not frightened by camp-fires, deterred by barking dogs,
    and unwilling to cross wide streams.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The call of the Warracaba tiger is said to resemble that of the Warracaba
    or trumpet-bird, and Schomburgk says its name also relates to breast coloring
    like trumpet-bird feathers.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: A general Indian belief states that each kind of tiger or tiger-cat hunts
    one particular animal and can imitate that animal’s call.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: An Arawak saying, translated as “everything has tiger,” is used as a warning
    to remain on guard against enemies.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The jaguar is said, in Brazil, to have the power of fascination.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: The tapir is said to have a strong bone between its eyebrows that lets it
    break undergrowth and crush a tiger against timber.
  category: attribute
  evidence_refs:
  - ev:14
- id: obs:15
  text: Rio Negro Indians say the tapir drops dung only in water and, if no water
    is nearby, makes a rough leaf basket to carry it to a stream.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: Tapir hoofs are used as charms or remedies for snake bites, ray-fish stings,
