candidate_motifs:
- id: motif:1
  label: wild forest man abducts women and forms a household
  taxonomy_refs:
  - stolen_beloved
  basis: The forest man carries off women, and one woman is reported to have lived
    with such a being and had children.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage reports abduction generally but the San Carlos woman’s account
    emphasizes domestic harmony rather than explicit coercion.
- id: motif:2
  label: animal vocal organ used as healing drinking vessel
  taxonomy_refs: []
  basis: The howling monkey’s vocal apparatus or hyoidal bone is made into or used
    as a cup for cures of stammering and asthma.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage gives ethnographic reports but does not explain the mechanism
    or ritual context.
- id: motif:3
  label: mythical pack predator constrained by water and deterred by dogs
  taxonomy_refs: []
  basis: Warracaba tigers hunt in packs, are feared near Ataraipu Rock, avoid crossing
    wide streams, and fear barking dogs.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The author questions the creature’s existence and suggests possible origin
    in wild dogs.
- id: motif:4
  label: predator imitates prey or bird call
  taxonomy_refs: []
  basis: Warracaba tiger calls resemble the trumpet-bird, and tigers generally are
    said to imitate the calls of the animals they hunt.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: medium
  cautions: The passage distinguishes the Warracaba tiger’s name-call relation from
    the broader belief about tigers imitating prey.
- id: motif:5
  label: every creature has its specific enemy
  taxonomy_refs: []
  basis: The Arawak saying translated as “everything has tiger” is explained as a
    warning that some enemy is always present.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: This is presented as a proverb and moral warning rather than a narrative
    episode.
- id: motif:6
  label: tapir body parts as protective and curative charms
  taxonomy_refs: []
  basis: The tapir’s forehead bone is credited with defensive power, and its hoofs
    are used in remedies for bites, stings, fits, and epilepsy.
  evidence_refs:
  - ev:14
  - ev:16
  - ev:17
  confidence: high
  cautions: The defensive bone and medicinal hoof traditions are adjacent beliefs
    about the tapir but not necessarily a single ritual complex.
- id: motif:7
  label: animal carries waste to water in a leaf container
  taxonomy_refs:
  - water
  basis: Rio Negro Indians say that when no water is present, the tapir makes a rough
    basket of leaves and carries dung to the nearest stream.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: This is a single reported animal habit belief, not a developed narrative.
