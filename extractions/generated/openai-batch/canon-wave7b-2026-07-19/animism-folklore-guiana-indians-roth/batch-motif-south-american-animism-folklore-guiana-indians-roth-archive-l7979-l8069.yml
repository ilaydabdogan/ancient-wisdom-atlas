  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: During an eclipse, Pomeroon Arawak participants strike drums, blow shells,
    and make loud noise to awaken the Moon.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: During an eclipse, the Pomeroon Arawaks are said to remain lively and active
