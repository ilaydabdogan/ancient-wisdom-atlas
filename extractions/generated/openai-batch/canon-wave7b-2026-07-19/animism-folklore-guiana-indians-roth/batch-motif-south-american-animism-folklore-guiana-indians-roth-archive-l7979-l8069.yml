canonical_text:
  quote: ''
  summary: The passage records customs and beliefs concerning the new moon and lunar
    eclipses among Makusi, Pomeroon Arawak, and several Orinoco-area groups. It describes
    new-moon practices for hunting strength, eyesight, and durable pottery clay; Arawak
    explanations of eclipses as the Moon falling asleep and causing transformations;
    and Orinoco eclipse rites in which people hide embers, mourn, offer strength,
    make a field for the Moon, or obtain women’s prayers so that the Moon will recover
    or remain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the new moon, Makusi men stand before hut doors and move their arms toward
    the moon; another reported practice involves crying to the moon and passing drops
    of water through rolled leaves into the eye while looking at the moon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The first night of the incoming moon is reported as the proper occasion for
