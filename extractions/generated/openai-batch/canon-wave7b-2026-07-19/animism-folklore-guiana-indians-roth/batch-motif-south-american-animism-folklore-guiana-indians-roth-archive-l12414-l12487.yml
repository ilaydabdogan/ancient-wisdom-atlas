canonical_text:
  quote: ''
  summary: 'The passage explains illness and death as usually caused by Spirits, ritual
    specialists, hostile humans, charms, or Kanaima rather than as natural phenomena.
    It then describes a Pomeroon District Arawak piai treatment: preparation of the
    patient, new fire, tobacco, consultation of a doll, smoking and massage, and,
    for stubborn illness, seclusion, extinguished fires, invocation of Spirits, and
    use of the maraka rattle.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Disease or death is described as usually not natural, but due to a Spirit
    acting judicially, maliciously, or through a votary's importunity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: An evil Spirit may cause harm through an animal bite or sting, a falling tree,
    an ax wound, drowning by water, or another calamity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The influence of a Spirit causing disease is said usually to require the agency
    of the piai to be counteracted.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Laypersons may offer a piece of quadruped flesh to the Evil Spirit when sick;
    recovery is interpreted as the Spirit's acceptance, while failure leads to calling
    the conjurer.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Piais are said to influence Spirits both to remove causes of disease and to
    send sickness elsewhere.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: An Ojanas epidemic in 1907 was ascribed to piais.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Medicine-men and certain old people are reported as capable of inflicting
    sickness at a distance; Apalai people unable to subdue sickness may send an evil
    charm to a woman of a neighboring tribe.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The passage gives examples of one group blaming another for illness or evil,
    including Wapisianas blaming Makusis and Tiquie River communities blaming Makua.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A Piapoco skin disease is said to be contracted by drinking an enemy's couac-water
    brew mixed with a few drops of the enemy's blood.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Death and other evils may also be attributed to a human enemy disguised, modified,
    or influenced by Kanaima, against whom the piai's power is said to avail nothing.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the Arawak treatment procedure, the patient may be placed in a hammock
    in a special out-house, or, if too ill to move, the doctor erects a closely plaited
    conical cage of manicole leaves with a low door.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: After sundown, the medicine-man starts a new fire by twirling one stick on
    another, makes a tobacco cigarette, examines the patient, asks about the pain,
    and consults his kickshaws, especially the manikin or doll, about whether the
    patient will be cured.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: The doctor sits on his special chair, smokes, rubs his hands with haiwa wax,
    massages the painful spot, and smokes on it through his hands placed funnel-wise.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The initial smoking and massage treatment may be viewed by the public and
    may itself effect a cure.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:15
  text: If the illness is stubborn, females are sent away, men keep a respectful distance,
    quiet is required, and all fires are extinguished so that the Spirits to be invoked
    will not be afraid to come.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: For the invocation stage, the medicine-man may crawl into the cage; he cleans,
    polishes, and assembles his maraka with feathers, smokes on it, sings, shakes
    it, touches and circles the painful spot with it, and alters his voice according
    to a Spirit voice.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
