canonical_text:
  quote: ''
  summary: Two consecutive animal tales are presented. In the first, Tiger tries to
    kill Koneso after a prior trick, ambushes him near a bathing pond, pursues him
    into an armadillo hole, and leaves a hawk to watch; Koneso flatters the hawk,
    blinds her with sand, and escapes. In the second, a female Tiger leaves three
    cubs in Konehu's care; Konehu kills the cubs after they bite him, deceives the
    mother, flees, and later uses false warnings about a coming sea to mislead Tiger
    at a high house and then beside a basket near a mora tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tiger told Koneso that he intended to kill him for an earlier trick, but spared
    him after Koneso pleaded and then planned to catch him another way.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tiger waited in the branches of an overhanging tree at the pond where Koneso
    bathed.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Koneso arrived decorated with flowers on his head, neck, chest, and waist,
    and Tiger initially did not recognize him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Tiger recognized Koneso, Tiger sprang at him; Koneso fled and entered
    an armadillo hole too small for Tiger to enter.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tiger asked a hawk to watch the armadillo hole while Tiger went to fetch a
    digging-stick.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Koneso spoke flattering words to the hawk, induced her to bend her face down,
    threw sand into her eyes, and escaped.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A female Tiger left her three cubs with Konehu while she hunted, and she shared
    meat with him on returning.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: When the cubs bit Konehu on successive days, he killed them and concealed
    the losses by bringing the same cub more than once for the mother to suckle.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Konehu built a house on very high posts with a long ladder, and Tiger arrived
    threatening to eat him.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: Konehu claimed that a big sea was coming, invited Tiger up the ladder, descended
    on a false excuse, and removed the ladder, leaving Tiger on the roof.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Tiger eventually jumped down safely from the roof and resumed following Konehu.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Konehu made an openwork basket near a big mora tree and said it would let
    him haul himself to the top branch when the big sea came; Tiger wanted to enter
    it too.
  category: action
  evidence_refs:
  - ev:10
