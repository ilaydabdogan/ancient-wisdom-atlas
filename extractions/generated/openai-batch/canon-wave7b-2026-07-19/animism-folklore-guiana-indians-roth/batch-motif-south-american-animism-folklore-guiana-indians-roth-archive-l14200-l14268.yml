canonical_text:
  quote: ''
  summary: An Arawak and a Carib, linked by reciprocal sister-marriage, become enemies
    after the Arawak finds his sister killed and dried on a babracote. The Arawak
    retaliates by killing the Carib's sister. A call for collective war follows. Arawak
    and Carib groups prepare arrows, canoes, and strongholds. The Arawaks defeat Carib
    forces in a sea battle using shields, later defeat another Carib force with a
    vine-rope trap and palisaded defense, and finally attack Caribs gathered in Surinam
    after using a disguised scout and imitated crab-whistle signals. The final survivors
    are one Carib man and woman, from whom the passage says present-day Caribs descend.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Arawak and a Carib are described as friendly and as brothers-in-law because
    each had married the other's sister.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After both hunters stay away longer than usual, the Arawak follows the Carib's
    tracks and finds his own sister's dried body on a babracote, with the passage
    stating that her husband had evidently killed her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Arawak lures his wife, the Carib's sister, into the bush, kills her, and
    babracotes her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Carib wishes to fight and kill the Arawak, but the Nafudi says that all
    the Caribs must fight all the Arawaks.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Both sides plant and harvest canes for arrows, make weapons, erect a strong
    house called Waiba for storing them, and build canoes for a battle at sea.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: In the sea battle, twenty Arawak canoes and forty Carib canoes take positions
    at arrow range.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Arawaks use cork-wood shields; Carib arrows stick in the shields and are
    broken off, after which the Arawaks shoot and kill the Caribs except for two deliberately
    spared survivors.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The spared Caribs gather people from Cuyuni, Barima, and Waini, who declare
    that they will not rest until they destroy all Arawaks.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: At Waiba-diki the Arawaks stretch a vine-rope across the river, entangling
    and breaking the steering paddles of approaching Carib canoes and causing confusion
    before the Arawaks shoot arrows into them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Arawaks defend their fortress with a palisade containing chinks for arrows,
    lose a few of their own people, and again leave only two Caribs alive to carry
    news.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The surviving Caribs go east to Surinam and collect remnants of their tribe
    there.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: An Arawak scout who speaks Carib paints himself like a Carib, enters the enemy
    camp, claims to be a Carib from the Pomeroon, drinks a little, and learns that
    a crab whistle will signal battle preparations before daybreak.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Arawaks make crab whistles, surround the Caribs while they are drinking,
    blow the whistles, surprise them, and kill them all except one man and one woman.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: The final Carib man and woman beg for their lives; only their legs are speared.
  category: action
  evidence_refs:
  - ev:13
- id: obs:15
  text: The passage states that all present-day Caribs descend from the spared couple
    and that this explains why Caribs are comparatively few and why Arawaks say they
    broke Carib power.
  category: other
  evidence_refs:
  - ev:14
