  category: relationship
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The passage states that sexual relationships are not necessarily connected
    with child production and that women can cohabit with Water Spirits without disastrous
    consequences.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Women are said to be able to obtain babies by eating certain plant or animal
    binas; in this explanation the child already exists and its body passes into the
    mother's body by mysterious means.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage states that babies may arrive in water or bush and appear in the
    mundane world as gifts from Water Spirits or at the instigation of Spirits of
    the Forest, with or without piai agency.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the Warrau story, Yaburawdko, while going to her field, finds a pretty
    boy on the road, brings him home, cares for him, and he calls her mother.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: After the child becomes mischievous, Yaburawdko becomes angry, rejects him
    as not hers, and ill-treats him; the child then disappears.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Yaburawdko's husband says the child will return and enter her body; the child
    later enters her womb, causing painful trouble before delivery, and the tale concludes
