canonical_text:
  quote: ''
  summary: The passage describes an infant spirit that follows the father and may
    be harmed by the father's actions unless miniature aids such as a leaf boat or
    stick bridge are left undisturbed; if lost, the spirit must be recovered by a
    piai doctor. It then reports customs concerning killing or stigmatizing certain
    infants, including deformed children, firstborn children, orphaned infants, and
    twins. The passage also describes beliefs that children may pre-exist and enter
    a mother's body through plants, water, bush, Water Spirits, Forest Spirits, or
    piai agency. A Warrau story tells of Yaburawdko finding a little bush child, rejecting
    him, and later suffering when he enters her womb; this is given as an explanation
    for women bearing children in this manner.
  language: English
  quote_policy: summarized
