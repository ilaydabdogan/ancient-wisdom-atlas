canonical_text:
  quote: one rattle to call the beast, the other to drive it away
  summary: Siwara controls bush-hogs with maraka rattles, marries into his wife's
    family after the birth of a child, and warns his wife's people not to touch the
    rattles. A brother-in-law disobeys and shakes the wrong rattle, summoning savage
    bush-hogs that kill the baby before Siwara drives them away. The passage then
    gives ethnographic notes on forest spirits' attraction to women, infants, and
    pregnancy, and compares related child-associated spirit functions among Pomeroon
    Arawaks and upper Orinoco traditions.
  language: English
  quote_policy: quoted
