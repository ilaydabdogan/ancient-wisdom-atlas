canonical_text:
  quote: Binas are charms, plant or animal, which effect their purpose by enticing
    or attracting the particular object or desire yearned for,
  summary: The passage describes painful procedures used to prepare hunting dogs,
    then explains binas as plant or animal charms used to attract desired objects
    or outcomes, especially game. It emphasizes caladium varieties cultivated as hunting
    and fishing charms, their resemblance to target animals, restrictions on women
    handling them, and ways hunters apply them to bodies, weapons, gear, dogs, or
    trees.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Hunting dogs are described as undergoing ordeals; on the Pomeroon a dog's
    snout may be rubbed with a froth-producing tree-bark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Pomeroon Indian may gash a dog's snout with a sting-ray barb and apply drops
    of hot-pepper solution through a leaf funnel onto the cuts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the pepper-and-gash treatment, the dog is said to be ready to hunt in
    two or three days and to keep its nose close to the ground during the chase.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Ants may be made to bite the dog's snout, or a hairy caterpillar may be rubbed
    into it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A reported Makusi, Arekuna, and Akawaio method uses two holes connected by
    a tunnel, a fire burning tapir hoof parings and other animal substances, ants
    and wasps, and smoke directed into the hole where the dog's head is held.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Binas are defined as plant or animal charms that work by enticing or attracting
    a desired object or outcome, from animal capture to wish fulfillment.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage gives Arawak, Carib, and Warrau terms associated with these charms
    or attraction practices.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The author reports no inorganic binas except possibly quartz pebbles in a
    piai's rattle, and notes an argument that a medicine-man's tobacco smoke attracts
    Spirits.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: Indian huntsmen value caladium varieties as binas for particular game and
    fish, transplant valued kinds near dwellings, and women are generally not supposed
    to see or handle these cultivated plants.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Many bina leaves are said to have real or fancied resemblances to the animals
    they attract, including features of bush-hog, deer, armadillo, fish, labba, and
    powis.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: A hunter may place an unopened shoot in a powder flask, rub it into body paint,
    or rub a leaf on an arrow, fish-hook, gun-barrel, or dog; in Cayenne, such binas
    are said to have been hung on trees.
  category: action
  evidence_refs:
  - ev:7
