canonical_text:
  quote: ''
  summary: 'The passage describes puberty and menstruation practices among Guiana
    and neighboring Amazonian groups: girls or women are secluded in elevated, dark,
    or separate spaces; avoid water, certain foods, cooking for others, travel, bathing,
    and hair combing; use separate fires and small vessels; undergo hair cutting or
    burning; and may be presented at a concluding drink-and-dance event with decorations,
    a special seat, and distribution of hummingbird on cassava. It then describes
    courtship signs in which accepting food, objects, game, fish, or related gifts
    indicates favorable marriage intentions, while rejection indicates refusal.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At first puberty, girls are described as being kept high in the hut, in a
    dark partitioned corner, in a high hammock, or on an overhead staging.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The pubescent girl must avoid going near water until the period is over; her
    mother bathes her in a closed room.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the Arawak girl goes out to ease herself, she is accompanied by her mother
    and takes a lighted fire-stick; the Makusi girl uses a fire she lights herself
    and cooks at her own fire in her own pot.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Pots and drinking vessels used by the girl are broken and the pieces buried.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The girl must not comb her hair until her mother combs it after bathing her;
    other examples include hair cropped, burned off, or used by men for ornaments.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The puberty ordeal is generally concluded with a drink-and-dance party in
    which the girl neither drinks nor dances but is the central focus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: An Arawak girl is brought from the closed room by a middle-aged man, displayed
    in decorations, and seated on a special stool shaped like a crocodile or tiger.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: A hummingbird killed and dried by the girl's brother or father is cut into
    small pieces; each visitor receives a piece on cassava.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Warrau and Carib examples include beads, white feather-down, red body paint,
    and a stone or plate in place of the stool.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: At later menstruations, an Arawak woman stays in a separate structure marked
    by suspended ite shreds and lies in a smaller hammock.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:11
  text: At later menstruations, she must avoid meat from large animals, bloody fish,
    and game hunted by dogs, and must not cook, bake, or prepare drink for others.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: At later menstruations, she must not cross water, travel in a corial, bathe
    in a river or pond, blow out her separate fire, or comb her hair; she uses smaller
    utensils made for the purpose.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: Makusi women during menstruation must not go into the forest because of exposure
    to snakes; a Piapoco husband brings food to his isolated wife.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: In courtship, acceptance of food or objects is described as a favorable sign,
    while rejection is unfavorable.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: Arawak, Pomeroon, Surinam, and Galibi/Cayenne examples include a woman placing
    food before a man, bringing in his hammock, accepting game and fish, or offering
    drink and firewood as courtship signs.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
