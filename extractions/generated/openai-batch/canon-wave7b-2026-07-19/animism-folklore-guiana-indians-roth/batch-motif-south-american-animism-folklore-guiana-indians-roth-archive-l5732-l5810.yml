candidate_motifs:
- id: motif:1
  label: missing or swallowed fire in creation with animal body change
  taxonomy_refs:
  - sacred_theft
  basis: Makunaima's missing fire is associated with Marudi swallowing it and the
    alligator being accused of stealing it; the episode results in the alligator's
    tongue being pulled out and, in a related note, Marudi's fiery throat.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: medium
  cautions: The passage says the marudi accidentally swallowed the fire, while theft
    is an accusation made against the alligator; the taxonomy match to sacred theft
    is therefore cautious.
- id: motif:2
  label: animal bodily features explained by prior events
  taxonomy_refs: []
  basis: The passage explains or notes explanations for the alligator's tongue, the
    trumpeter bird's legs, Marudi's fiery throat, and Turtle's impaired movement after
    exchanging footgear with Deer.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:5
  confidence: high
  cautions: This is an analytic motif label; no formal taxonomy reference is supplied
    in the available list.
- id: motif:3
  label: deceptive exchange of locomotion parts
  taxonomy_refs: []
  basis: Deer obtains Turtle's hoofs or sandals, becomes faster, and never returns,
    leaving Turtle slowed with Deer's nails.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The exact status of the hoofs as natural body parts or sandals is not
    fully clear from the excerpt.
- id: motif:4
  label: betrayed weak hunter slays forest monster and gains status
  taxonomy_refs: []
  basis: The brothers-in-law direct an unlucky hunter toward Tobe-horoanna's lair,
    but he kills the monster and is later given another wife, a larger house, and
    recognition as Ai-ja'mo.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage does not explicitly frame the change of status as a ritual
    initiation or kingship narrative.
- id: motif:5
  label: human-animal dual forest monster
  taxonomy_refs:
  - shapeshifter
  basis: A note states that Tobe-horoanna is tiger-like when walking in the bush but
    at home is like a man or people.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The dual form is supplied in an explanatory note rather than enacted in
    the story segment.
- id: motif:6
  label: frog or toad helper associated with hunting success
  taxonomy_refs: []
  basis: The hunter seeks help from Wau-uta the Tree-frog, and a note states that
    toads, frogs, and kindred creatures have an intimate connection with success in
    the chase.
  evidence_refs:
  - ev:10
  - ev:12
  confidence: medium
  cautions: The excerpt ends before Wau-uta's response, so the function is inferred
    from the stated purpose and note.
