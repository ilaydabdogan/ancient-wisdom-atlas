  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supplies only the summarized elements of the comparandum
    and a cross-reference.
- id: claim:3
  claim: The turtle-and-deer exchange is placed near a note that associates a turtle
    head amulet among Gran Chaco Indians with hunting deer, suggesting a cautious
    functional comparison around turtle/deer hunting symbolism.
  claim_level: same_function
  target: Gran Chaco turtle-head amulet for hunting deer
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: low
  limitations: The Gran Chaco note concerns an amulet function, not the same narrative
    event as the Turtle and Deer exchange.
- id: claim:4
  claim: The Wau-uta episode is explicitly linked by note to a broader pattern connecting
