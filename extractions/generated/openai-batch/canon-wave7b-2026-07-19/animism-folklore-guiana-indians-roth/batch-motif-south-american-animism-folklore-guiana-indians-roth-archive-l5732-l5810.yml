canonical_text:
  quote: ''
  summary: 'The passage contains several etiological and narrative items: Makunaima
    searches for missing fire and removes the alligator''s tongue after animals accuse
    it; notes identify bird variants and creation-story animal body changes; Turtle
    lends hoofs to Deer and is left with nails; and the Warrau story of an unlucky
    hunter tells how hostile brothers-in-law send him toward the lair of Tobe-horoanna,
    Black Tiger, whom he kills, thereby gaining wives, a larger house, and chief status
    before seeking hunting help from Wau-uta the Tree-frog.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During creation, Makunaima misses his fire; the marudi is said to have accidentally
    swallowed it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other animals tell Makunaima that the disliked alligator stole the fire; Makunaima
    forces open the alligator's mouth and pulls out its tongue, which is said to have
    formerly been long and flexible.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: An editor's note identifies Annuanna as the carrion crow and says the legend
    may be an Arawak version of the latter part of a Warrau story.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: An Arawak woman reports that Tillili and Fai-fai-a joined Itiki in playing
    malingerers, and that Fai-fai-a now moans because he did not take part in the
    fray.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note on an Akawai creation story says the trumpeter bird flew into an ants'
    nest and had her legs picked clean, while Marudi swallowed hot embers and received
    a fiery throat.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Turtle lends Deer his hoofs or sandals and receives Deer's nails in exchange;
    Deer runs away faster and never returns, leaving Turtle's movement impeded.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: An unlucky hunter's two brothers-in-law plan to get rid of him by directing
    him along a route that leads to Tobe-horoanna's lair.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The hunter is chased by Tobe-horoanna around an immense tree, cuts off the
    creature's heels, shoots it through the neck with an arrow, and finishes killing
    it with a knife.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the hunter returns home, his brothers-in-law deny their intention; when
    shown the carcass, the others are afraid until he tramples it to show it is dead.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the killing, the father-in-law gives the hunter another daughter, the
    brothers-in-law build him a larger house, and he is recognized as Ai-ja'mo, chief
    or head-man of the settlement.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: A note defines Tobe-horoanna as literally 'Tiger-black-skin' and describes
    it as an immense savage forest beast, a tiger when walking in the bush and like
    a man at home.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: Wanting a wider reputation for hunting all animals, the man goes to the tree
    where Wau-uta the Tree-frog lives and calls on her for help; a note links frogs,
    toads, and related creatures with success in the chase.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:12
