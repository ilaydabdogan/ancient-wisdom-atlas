    of the Warrau story.
- id: claim:2
  claim: The note explicitly compares the Akawai creation account of the trumpeter
    bird and Marudi's fiery throat with Brett's story and a later section.
  claim_level: same_motif
  target: Brett's Akawai creation story / Sect. 162
  evidence_refs:
