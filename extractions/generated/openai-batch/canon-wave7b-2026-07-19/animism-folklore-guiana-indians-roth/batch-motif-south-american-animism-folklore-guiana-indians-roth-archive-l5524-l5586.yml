- id: obs:1
  text: An Arawak hunter shoots a female “baboon,” cuts off and eats the tail, and
    leaves the remaining carcass on a babracote to smoke-dry overnight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After a later hunting trip, the hunter returns to the banab and finds a woman
    in his hammock and no baboon on the babracote.
