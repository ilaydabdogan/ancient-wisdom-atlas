canonical_text:
  quote: ''
  summary: An Arawak hunter kills a female baboon, later finds a woman where the carcass
    had been, marries her, learns she is the transformed baboon, and is told not to
    reveal it. After ascending an immense cashew tree to Baboon country and drinking
    with Baboons, he reveals her identity. The wife, house, drinks, and Baboons vanish,
    leaving him stranded atop the tree until a bunia bird and then a hummingbird help
    him descend and return home.
  language: English
  quote_policy: summarized
