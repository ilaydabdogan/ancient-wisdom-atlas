- id: obs:3
  text: The woman says she came because of his loneliness, to help look after the
    meat and keep him company.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hunter becomes suspicious because the woman's fingers are naturally clenched
    and she tries to keep the fingers of one hand extended with the other hand.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman later admits that she is the baboon transformed into her present
