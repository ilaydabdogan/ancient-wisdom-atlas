canonical_text:
  quote: ''
  summary: A younger wife, expelled with her baby after conflict with a jealous elder
    wife, survives two nights of danger from tigers by taking refuge in trees, using
    palm fruit as a trap, and later being rescued by her father, a piai. The passage
    then describes powers attributed to medicine-men/piais, including fixing propitious
    times for attacks, prophecy, influence over unborn children, poison-related abilities,
    finding lost things, and claims of comprehensive knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man has two wives; the elder is jealous of the younger, and the husband
    sends the younger wife away with her baby while giving her a sharp knife for road
    protection.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The younger woman climbs an ite palm at night with her baby and makes a temporary
    basket from an unopened leaf in which they rest.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The woman cuts rings around the stalks of several palm-fruit bunches so that
    a slight touch will make a bunch fall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tigers attracted by the woman’s scent climb the palm, jump on the fruits,
    fall, and are torn apart by the tigers below.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After dawn the woman waits until she sees a wasp settling on each tiger’s
    protruded tongue, then concludes the tigers are dead and descends.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman climbs a manicole tree with the baby on her back; tigers dig around
    the roots until the tree falls into a large spider-web, where the woman and baby
    become stuck.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The woman’s father, described as a celebrated piai, dreams of her and the
    tigers, searches for her, discovers her because of the baby making water, shoots
    the prowling tigers, and helps down his daughter and grandchild.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Medicine-men are said to fix propitious times for attacks and to foretell
    battle outcomes, war or peace, and whether crops will be scanty or abundant.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Pomeroon Arawaks are said to credit the piai with influencing Yawahus in bringing
    unborn babies to mothers.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage reports claims that piais or sorcerers may be associated with
    poisoning, poison-proofing, finding lost things, and broad knowledge.
  category: attribute
  evidence_refs:
  - ev:9
  - ev:10
