canonical_text:
  quote: '"the trees, like the animals, would converse with one another just as people
    do"'
  summary: The passage recounts a Warrau story explaining the separation of the Ite
    palm, Mora tree, and Baboon, then catalogs several plant-associated beliefs involving
    illness omens, quarrel-producing smoke, tree spirits, nocturnal flowering, plant
    charms, snake-bone origins, and a legend in which a boy’s blood gives rise to
    the haiari fish-poison root.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In former times, a Mora tree was always found growing near an Ite palm.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Baboon foraged on the Ite and ate its fruit, which made the Mora jealous.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Ite and Mora are described as trees that could converse like people and
    as women because they bore seed.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Ite decided to leave the Mora and travel eastward, while the Mora followed
    because she wanted the Baboon to stay with her.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: As the Ite and Mora traveled eastward, they left seeds behind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: As the terrain changed from dry bush to swamp, the Baboon increasingly fed
    on the Mora, whose branches stayed above the water, and finally left the Ite.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Mora stopped when her jealousy was satisfied, while the Ite continued
    to the heavy swamps of the Orinoco, where there was too much water for the Baboon
    to follow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The story explains that Baboon is now found on the top branches of the Mora
    rather than on Ite palms, and that isolated local Ite palms are stragglers from
    the original palm that traveled to the Orinoco.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: A leaf of the Tree of Life may be suspended in a house when an inmate is ill;
    germination is taken as a sign of recovery, while withering indicates death.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The dried and pulverized Devil-doer bush-rope, when smoked with tobacco, is
    said to make people within the smoke pugnacious and is also used to stimulate
    virility and venery.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The scent of burning Silverballi chips is said to make people quarrelsome.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At a certain season the Darina appears dead, sheds bark, revives with red
    new bark and new leaves, and is said by Arawaks to emit medicine-man chants at
    midnight.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Preparations of the Hiari are said to cause the tree’s Spirit to appear to
    a sick person and identify who inflicted the illness; its fumes or smoke are also
    described as stupefying or fatal, and fallen leaves in a river are believed to
    bring sickness downstream.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Pomeroon Arawaks believe Bamboo flowers and seeds only at night, and the
    author notes that talking house-posts may preserve traces of a Spirit associated
    with timber.
  category: other
  evidence_refs:
  - ev:9
- id: obs:15
  text: The author interprets vegetal attraction-charms or binas as survivals of belief
    in plant-associated Spirits and notes that such binas are said to originate from
    calcined snake bones.
  category: other
  evidence_refs:
  - ev:10
- id: obs:16
  text: In the Haiari Root legend, a boy’s bathing killed fish; spine-bearing fish,
    especially the sting-ray, pricked him; before dying he told his father to watch
    for plants where his blood fell, and the father found haiari there.
  category: sequence
  evidence_refs:
  - ev:11
