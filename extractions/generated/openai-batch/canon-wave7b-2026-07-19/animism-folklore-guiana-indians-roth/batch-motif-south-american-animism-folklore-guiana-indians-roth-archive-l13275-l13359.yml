canonical_text:
  quote: ''
  summary: The passage reports traditions and scholarly explanations concerning South
    American Amazons, including annual meetings with men, uncertain treatment of male
    children, a mountain-enclosed locality, green stones, and proposed origins of
    the Amazon story. It also reports Bancroft's description of a Guiana 'wild man'
    or orang-utang-like being compared with Arawak forest spirits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the reported annual encounter, each Amazone takes a hammock from the visiting
    Indians' canoes or vessels, carries it home, hangs it where its owner can recognize
    it, receives the owner as a guest, and keeps him for a few days.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The visiting Indians are said to return to their own dwellings and to make
    the voyage again every year at an appointed time.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Girls born from these encounters are said to be brought up by their mothers.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: 'The fate of male children is disputed: one report says they are given to
    their fathers at the next visit, while a common report says the mothers kill all
    males at birth.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: Mahanarwa is cited as saying that the Amazons live on the River Wara in a
    place enclosed by mountains with a single entrance, and that they annually visit
    the Teyrous or Tairas in Cayenne.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Accounts of the Amazons are reported among Makusis and Arawaks, but different
    tribes assign them different localities.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: An Arawak chief is said to have reported that his brother visited the Amazons
    and received green stones as a present from the Wirisamoca.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: Wallace states that the Amazon story may have arisen from early voyagers encountering
    River Uaupes men whose hairstyle, combs, bead ornaments, bracelets, lack of beard,
    and shields could make them appear feminine to outsiders.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Schomburgk is reported as explaining the Amazon fable through the warlike
    reputation of women in certain tribes, including Caribs and women of Guadalupe,
    while Humboldt explains exaggeration through writers' tendency to find Greek and
    Old World patterns in newly discovered peoples.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Bancroft reports a Guiana orang-utang-like being called by native names meaning
    'wild man,' about five feet high, erect, human-shaped, and thinly covered with
    short black hair.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Indians are said to dread the wild-man beings, flee from them, and tell stories
    that they attack human males and ravish human females.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The author notes that Bancroft's wild-man description nearly agrees with the
    Spirits of the Forest, the Tukuyuha of the Arawaks, and related beings mentioned
    elsewhere.
  category: relationship
  evidence_refs:
  - ev:5
