canonical_text:
  quote: ''
  summary: The passage describes illness diagnosis and treatment by a Boye, piai,
    or Piache through consultation with familiar or subordinate spirits. The healer
    identifies spirit-caused illness, may perform extraction of harmful objects or
    poison through touch, breath, suction, and rubbing with junipa fruit, and may
    offer consolation when illness is fatal. Related examples include Makusi, Arawak,
    Otomac, Carib, Warrau, Roucouyenne, and other reported practices involving spirit
    agency, suction cures, disease objects, kin dietary restrictions, and blame for
    death after failed treatment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Boye consults a Familiar Spirit, which identifies the spirit said to have
    brought the mischief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The invoked Familiar Spirit is described as shaking the roof ridge or making
    another noise and answering the Boye's questions distinctly.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the illness is said not to be mortal, the Boye and an accompanying phantom
    approach the sick person, reassure him, touch painful parts, press them, and pretend
    to extract thorns, broken bones, splinters of wood, and stones.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The healer moistens the weak spot with breath, repeatedly sucks it, persuades
    the patient that poison has been removed, and rubs the body with junipa fruit.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the illness is said to be fatal, the Boye consoles the sick person by
    saying the Familiar Spirit wishes to take him into its company and free him from
    infirmities.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Makusi piai account, a good spirit sometimes brings the evil spirit
    supposed to have helped cause the malady; the wife appeals to it, and the answer
    is a mocking laugh.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Makunaima or great spirit is said not to be called upon by the sorcerer;
    only subordinate inhabitants of spirit-land are called to assist or cure the sick
    man.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Reported objects inserted into a victim by invisible spirit agency and later
    extracted include snake fangs, grass roots, gravel-stone, fish-bone, bird claw,
    snake tooth, wire, a worm, and a miniature bow and arrow.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Arawak belief cited in the passage attributes all pain to the Evil Spirit's
    arrow.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: Otomac medicos are reported to suck strongly enough to draw blood, in which
    minute stony particles are then seen; another cited account describes sucking
    the painful part as a successful cure method.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Piache's first prescription is described as a fast for the patient and
    kinsfolk, including avoidance by household members of hot food, cooked food, or
    peppers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Among Caribs, Arawaks, and Warraus, the whole family is described as being
    dieted like the invalid; a Carib Islander example says a relative's eating a forbidden
    food could worsen the patient's pain even at a distance.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Among the Roucouyennes, the doctor permits the patient, besides the diet,
    to throw himself into the river when fever is very high.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: When death follows treatment, the passage says it is usually ascribed to disobedience
    of food restrictions, though an implacable spirit or a rival sorcerer using the
    Yawahu may also be blamed.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: An editorial note states that, for Mainland and Island Caribs, the invoked
    spirits were of the Familiar class.
  category: other
  evidence_refs:
  - ev:10
