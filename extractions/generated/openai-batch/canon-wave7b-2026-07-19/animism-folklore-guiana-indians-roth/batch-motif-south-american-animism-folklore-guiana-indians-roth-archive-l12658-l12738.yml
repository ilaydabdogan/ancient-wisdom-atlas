candidate_motifs:
- id: motif:1
  label: Familiar-spirit diagnosis of illness
  taxonomy_refs: []
  basis: The Boye consults a Familiar Spirit that identifies the spirit blamed for
    the mischief and answers questions about the illness.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No available taxonomy family directly covers familiar-spirit medical divination.
- id: motif:2
  label: Spirit-caused illness
  taxonomy_refs: []
  basis: The passage repeatedly attributes illness, pain, or bodily intrusions to
    spirits, including an evil spirit, invisible spirit agencies, and the Evil Spirit's
    arrow.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage reports several sources and examples; it does not present
    one single narrative episode.
- id: motif:3
  label: Extraction of intrusive disease objects
  taxonomy_refs: []
  basis: The healer claims to extract thorns, bones, splinters, stones, poison, and
    other objects or substances from the patient's body by pressing, massage, breath,
    and suction.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: high
  cautions: The text distinguishes reported belief and performance from literal medical
    causation.
- id: motif:4
  label: Fatal illness as joining a familiar spirit
  taxonomy_refs: []
  basis: When illness is declared fatal, the Boye consoles the patient that the Familiar
    Spirit wishes to take him into its company and free him from infirmities.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage gives a brief consolation formula, not a developed afterlife
    journey account.
- id: motif:5
  label: Kin-shared dietary taboo during illness
  taxonomy_refs: []
  basis: The passage describes fasts and food restrictions imposed not only on the
    patient but on kinsfolk, household members, or the whole family.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: Specific restrictions vary across cited examples.
- id: motif:6
  label: Remote sympathetic effect of relatives' food on patient
  taxonomy_refs: []
  basis: The Carib Islander example states that relatives' eating a prohibited food
    could worsen the patient's pain even if they were fifty miles away.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This motif is explicitly attested in the cited Carib Islander example;
    broader distribution is not established beyond the passage.
- id: motif:7
  label: Failed cure blamed on taboo breach, hostile spirit, or rival sorcerer
  taxonomy_refs: []
  basis: When death ensues, the passage says blame may fall on disobedience to food
    restrictions, the power of the spirit causing the mischief, or a rival sorcerer
    employing the Yawahu.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage summarizes possible explanations rather than narrating a single
    case.
