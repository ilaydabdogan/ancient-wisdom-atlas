canonical_text:
  quote: ''
  summary: The passage catalogs pregnancy and postpartum restrictions among several
    Guiana and neighboring Indigenous groups. Parents, especially fathers and pregnant
    or postpartum mothers, avoid certain animals, foods, gestures, emotions, and sights
    because these are said to affect the unborn or newborn child, hunting animals,
    or social interpretations such as twin paternity. It also describes a Carib Islander
    father's postpartum bed rest and prolonged food abstinence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Akawai and Carib men expecting an increase in their families abstain from
    specified meats because each animal is linked to a feared condition in the expected
    child, including meagerness, blindness, protruding mouth, spots or ulcers, and
    stillbirth.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Pomeroon Arawaks, both father and mother are forbidden to kill and eat
    snake during pregnancy because the infant might become similar to a snake, unable
    to talk or walk.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Pomeroon Arawak parents carrying cassava cake may not turn it over or curl
    its sides, or the child's ears will be curled over when born.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A pregnant Pomeroon Arawak woman is forbidden to eat game hunted by dogs,
    and a wife must ensure that such game is not eaten by women in pregnancy or menstruation,
    because the dog may lose hunting ability.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Pregnant women in the Pomeroon Arawak account avoid big meat and blood-rich
    fish and may eat only the tail portion of a fish; rule-breaking is said to cause
    something to be amiss with the child.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Uaupes River account says a pregnant woman's meat eating can harm animals
    that partake of it, disable dogs from hunting, or prevent a man from shooting
    that kind of game thereafter.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: A Pomeroon Arawak woman is said to beget twins by eating double fruit during
    pregnancy, while the Saliva husband regards twins as evidence of his wife's disloyalty.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Pomeroon Arawak pregnant woman must not laugh, grieve, or look at the face
    of a dead person, though she may gaze at the body.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Until her child can walk well, a Pomeroon Arawak mother avoids deer, turtle,
    and iguana because these animals creep or crawl slowly after birth, and eating
    them is said to make the infant walk too slowly.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Island Carib mother abstains from female crabs, while the father avoids
    animals whose traits might affect the child, such as turtle, parrot, and crab.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: 'The passage reports additional paternal postpartum restrictions: Galibis
    avoid deer, hog, and large game; Akawai, Carib, and Warrau husbands abstain from
    venison; and a Roucouyenne father avoids fish or game caught with an arrow.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A Carib Islander father spends ten or twelve days in bed on cassava and water
    and later abstains for months from several meats for fear of hurting the infant,
    especially at the birth of the first male child.
  category: sequence
  evidence_refs:
  - ev:9
