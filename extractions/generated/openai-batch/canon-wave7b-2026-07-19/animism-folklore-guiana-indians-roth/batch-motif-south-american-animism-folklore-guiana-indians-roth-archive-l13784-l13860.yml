    deliberately thrown into boiling water in a pot covered with a baking-stone.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Konehu closes and sews a quake basket around Tiger, fastens a vine-rope to
    it, throws the rope over the top branch of a mora tree, and leaves Tiger hanging
    in the air.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A little monkey opens the basket; Tiger jumps out, both fall to the ground,
    and Tiger eats the monkey.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a river, Konehu tells Tiger that the sun’s reflection in the water is a
    beautiful yellow stone or gold, and Tiger dives repeatedly while Konehu escapes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Konehu balances a big rock on a high hill and digs a deep pit at the bottom
