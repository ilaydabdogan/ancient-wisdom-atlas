canonical_text:
  quote: ''
  summary: 'The passage gives several Konehu trickster episodes: Tiger is trapped
    in a basket and suspended from a tree, released by a monkey whom Tiger eats, then
    repeatedly deceived by Konehu at a river reflection and later killed by a rock
    rolled into a pit. Konehu also deceives hunters into bracing a cliff so he can
    take their provisions, and uses a hollow bamboo rice pounder to keep rice for
    himself. A note mentions an Arawak Pomeroon variant involving youngsters killed
    in boiling water, and another note mentions a Cayenne variation of the Tiger-in-a-pit
    episode.'
  language: English
  quote_policy: summarized
literal_observations:
