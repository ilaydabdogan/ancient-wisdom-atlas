canonical_text:
  quote: ''
  summary: 'The passage describes courtship and marriage-related customs among named
    Guiana, Orinoco, Cayenne, and Island groups: a hammock offer/refusal signal; lack
    of publicly recognized permanent union before womanhood; premarital fasting, insect
    exposure, flogging, scarification, meat abstention, and trials of skill; a widow
    remarriage ceremony on the dead husband’s grave involving flagellation; a subsequent
    tongue-piercing and blood application by a sorcerer; and a Uacarras bow-and-arrow
    trial interpreted as an omen or token of the husband’s future qualities.'
  language: English
  quote_policy: summarized
