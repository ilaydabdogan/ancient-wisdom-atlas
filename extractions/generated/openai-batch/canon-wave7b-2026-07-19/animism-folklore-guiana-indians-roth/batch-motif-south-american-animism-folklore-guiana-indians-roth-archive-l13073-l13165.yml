canonical_text:
  quote: ''
  summary: The passage describes beliefs and practices concerning Kanaima victims,
    hidden burial, corpse treatments meant to kill a returning Kanaima, the Kanaima's
    third-night blood-tasting grave rite, invisible arrows or darts causing illness,
    piai extraction of miniature weapons, special arrow beliefs, and associations
    of broken bows and arrows with Bush Spirits and strength-gaining self-castigation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After a sufferer killed by Kanaima is brought home, the Kanaima is said to
    hover nearby in order to discover the burial place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The victim's friends try to bury the corpse secretly so that the Kanaima will
    not know its location.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If discovery of the grave is feared, the corpse may be poisoned or fitted
    with palm-spines called pimplers.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: One described treatment places palm-spines in water under the naked corpse,
    washes the body with that water, forces broken spines into the body, and strews
    remaining spines over it in the grave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Another described treatment removes the liver from the corpse and puts a red-hot
    ax-head in its place.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: If Kanaima disturbs the corpse containing the red-hot ax-head, the heat is
    believed to pass into his body and consume his vitals.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wurali poison may also be placed on the dead body.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: On the third night, Kanaima visits the grave and inserts a pointed staff into
    the body.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: If blood is found on the withdrawn staff, Kanaima licks it off and is then
    said to be protected from the dangerous consequences of his act.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The blood-licking act is described as a purification and as an offering to
    the Kanaima Spirit within him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: If Kanaima cannot taste the victim's blood, he is said to wander until madness
    or death comes upon him through the disappointed Spirit.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: 'Kanaima is said to be freed only after leaving behind two death-marks: the
    swollen tongue and damaged entrails.'
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:13
  text: Among the Akawais, Brett says the Kanaima system is taught by father to son
    in many families.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: Kanaima's handiwork may be recognized by a blue spot attributed to an invisible
    poisoned arrow.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:15
  text: On the Napo River, illnesses are attributed to invisible darts puffed into
    bodies by evil, designing persons.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: In the Guianas, Caribs and Arawaks attribute some sicknesses, unexplained
    illness, and sudden sharp pains to invisible arrows, including the Bush Spirit's
    arrow.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:17
  text: A piai may extract a miniature bow and arrow from a patient's body by massage
    and suction.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: In other arrow beliefs, where an arrow sinks in water there is danger from
    submerged rocks, and where it floats the passage is clear for a corial.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:19
  text: Invisible fungus on an arrow or on a bowman's arm is said to prevent a missile
    from hitting its mark until cleaned.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:20
  text: Spirits and medicine-men are said to be able to hit an animal by shooting
    an arrow upward and letting it fall from above on the quarry.
  category: action
  evidence_refs:
  - ev:9
- id: obs:21
  text: Some Bush Spirits are associated with broken bows and are also said to use
    broken, spliced arrows.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:22
  text: Self-castigation with the two halves of a broken arrow is mentioned as a practice
    to ensure strength and courage.
  category: action
  evidence_refs:
  - ev:10
