canonical_text:
  quote: ''
  summary: 'The passage first recounts Komatari completing a calabash maraka rattle,
    using it against a killing Hebu, and curing several people made sick by the Hebu
    before failing to save one patient. It then explains that present-day medicine-men
    call on Hebus associated with Komatari’s maraka. The remainder describes old-time
    medicine-man apprenticeship: abstinence, restricted diet, instruction in animals,
    plants, stars, legends, and invocation techniques, dangerous tobacco ordeals,
    eye-washing with hiari infusion, trance contact with Spirits, consecration, deathlike
    sickness, recovery from a sacred hut, and post-ordeal food taboos.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Komatari puts stones into a calabash and finishes it as a maraka rattle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Komatari shakes the finished maraka, the killing Hebu trembles, staggers,
    almost falls, and escapes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The killing Hebu goes to his Aijamo, asks for revenge, and returns with him
    to bring sickness to Komatari’s friend and neighbor rather than attacking Komatari
    directly.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Komatari plays the maraka over sick people and removes sickness in three cases.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Komatari cannot cure a fourth patient because he was away hunting and the
    sickness had remained too long.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Present-day medicine-men are said to sing to and call on the Hebus who assisted
    Komatari in making the maraka; Wau-uno, the white crane, is named as the Hebu
    who procured tobacco seeds.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The old-time medicine-man apprentice undergoes months of self-denial, stinted
    diet, and prohibition of accustomed luxuries.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The apprentice must satisfy his teacher regarding knowledge of animals, plants,
    flowering and bearing seasons, stars, constellations, legends, invocation media,
    chants, recitatives, and imitation of voices.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The apprentice faces a chance of death by drinking repeated and increasing
    doses of a tobacco decoction and by having his eyes washed with hiari-leaf infusion.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: After slow recovery from narcotic trance and sickness, the apprentice believes
    he was admitted among the Spirits, conversed with them, and was consecrated as
    a piai priest-doctor.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Other cited accounts describe novices being dosed with tobacco juice, sometimes
    mixed with quinquiva or drippings from an exposed dead body, in dangerous experiments.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: One cited account says the novice’s death is proclaimed during a deathlike
    sickness; after recovery he emerges emaciated from the sacred hut and then follows
    months of dietary abstinence.
  category: sequence
  evidence_refs:
  - ev:8
