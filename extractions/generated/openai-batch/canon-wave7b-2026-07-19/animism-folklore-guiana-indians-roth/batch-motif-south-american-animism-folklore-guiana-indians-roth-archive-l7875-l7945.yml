canonical_text:
  quote: '"his head ''burst,'' and out of it there came the Sun''s warmth and heat."'
  summary: Waiamari, a young man living with his uncle, is pursued in the water by
    his uncle's young wife and publicly rebukes her. The husband later accuses Waiamari,
    fights him, and is stopped by Okohi, Waiamari's elder uncle. Okohi takes Waiamari
    away by canoe across a large sea; the canoe bears Sun and Moon imagery. On the
    far shore, Assawako hosts Waiamari, gives him food and drink, admires his hunting,
    and hears him play the kahabassa. She wishes him to remain, but he leaves with
    Okohi. Back home, Okohi announces that this was his last journey; his head bursts
    and the Sun's warmth and heat emerge.
  language: English
  quote_policy: quoted
