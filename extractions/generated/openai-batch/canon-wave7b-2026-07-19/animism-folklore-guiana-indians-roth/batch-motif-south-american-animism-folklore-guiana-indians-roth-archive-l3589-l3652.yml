canonical_text:
  quote: ''
  summary: The passage describes Hebus as hairy forest spirits with a fire-hearth
    in place of buttocks, prominent brows, and possible skull or skeleton forms. It
    then gives a Warrau tale in which Kau-nassa, a Hebu or bush spirit disguised as
    a grandmother, drowns two girls in a basket at a creek, attempts the same with
    another boy and girl, but is exposed by the boy when he looks behind her and sees
    the fire on her back. The spirit is angered by discovery and by hearing her name
    called, bursts into wind and flame, and flies away. The passage also notes other
    forest spirits and regional comparisons, including Immawari, Yurokons, Caypor,
    Curupari, and a Rio Negro forest demon.
  language: English
  quote_policy: summarized
