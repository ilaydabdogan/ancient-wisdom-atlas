literal_observations:
- id: obs:1
  text: Arawak tradition identifies old stone axes, called waMli^nor-haro, as objects
    from a very distant country reached only after a journey lasting years.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that these stories commonly carry the lesson that disobedience
    to elders is punished.
  category: other
  evidence_refs:
  - ev:1
- id: obs:3
  text: A corial full of people, led by a very old medicine-man, sets out to search
    for stone axes.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The searchers' wives prepare cassava, and the party also carries cassava-sticks
    to plant near the place where the axes are found for food on the return journey.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The party paddles downriver into blue sea water with many submerged rocks
    that threaten to break the vessel.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man tells the crew to shoot arrows into the blue water; sinking arrows
    indicate danger, while floating arrows mark a safe passage.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: At the Huri Fish Nation, the old man warns that fish lying on the sand are
    really men and women and must not be shot or chopped.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: One crew member secretly goes to the water at night, shoots one fish, roasts
    it quietly, eats it, and returns to his hammock.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The next morning, Indians come to the encampment, say one of their men is
    lost, and suspect someone in the party has killed him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Indians make the visitors drink hot water to induce vomiting; the guilty
    man vomits pieces of the fish.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: After identifying the guilty man, the Indians call the killed being their
    brother, throw the man into the boiling pot, and let the rest of the crew continue.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: In another country, the old man orders the crew to hunt any animal they see;
    most obey and return with game.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: One man sleeps most of the day, goes out late with only a knife, and finds
    a large ant-eater lying asleep in the shade.
  category: action
  evidence_refs:
  - ev:8
