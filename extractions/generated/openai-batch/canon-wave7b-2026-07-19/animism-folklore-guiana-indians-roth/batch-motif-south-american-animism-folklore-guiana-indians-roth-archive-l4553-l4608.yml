canonical_text:
  quote: Yawahu, who had taken on the real friend's shape and appearance
  summary: A daughter stays home alone while her family goes to a drink-party. A Yawahu
    comes in the shape of her old friend Dai-adalla, accompanies her to catch frogs,
    and reveals danger by saying it is eating the frogs raw. The girl tricks it into
    silence, returns home, overturns pots, hides on the roof, and escapes until dawn.
    The passage then notes that spirits are thought fond of tobacco and that tobacco
    smoke and a rattle are used in Carib spirit invocation.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A family accepts an invitation to a drink-party, but the daughter refuses
    to go and is left at home alone.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A visitor appears whom the girl thinks is her old friend Dai-adalla, but the
    passage identifies the visitor as Yawahu in the friend's shape and appearance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Yawahu offers to stay overnight and keep the girl company.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After dark, frogs are heard croaking, and the girl and the disguised visitor
    go out in opposite directions to catch them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Yawahu says it has caught plenty of frogs and is eating them as fast as
    it gathers them; this frightens the girl and causes her to recognize the visitor's
    real nature.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The girl knows the Yawahu can tell her location by her voice, so she tells
    it not to speak or make noise because the frogs will be frightened.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When silence returns, the girl goes back to the house, turns the pots upside
    down, throws the frogs away, and climbs onto the roof.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Yawahu returns to the house, searches under many pots, says it would have
    eaten the girl with the frogs, searches until dawn, and then has to leave.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: After the Yawahu leaves, the girl descends from the roof, waits for her people
    to return, and tells them about the disguised visit.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The father says that next time the family tells her to come with them, she
    will obey.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage states that spirits are supposed to be fond of tobacco, to inhale
    its fumes continually, and that tobacco smoke is largely used in their invocation.
  category: other
  evidence_refs:
  - ev:8
- id: obs:12
  text: Among the Caribs, a medicine-man calls Mawari and Makaiabtoi with his rattle;
    Makaiabtoi appears with tobacco smoke and otherwise remains in the rattle, coming
    out when it is shaken.
  category: sequence
  evidence_refs:
  - ev:9
