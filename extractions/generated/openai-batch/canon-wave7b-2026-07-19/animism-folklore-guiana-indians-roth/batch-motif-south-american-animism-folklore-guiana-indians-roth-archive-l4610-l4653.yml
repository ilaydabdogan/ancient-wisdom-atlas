canonical_text:
  quote: ''
  summary: A tobacco-loving Indian smokes while walking in the forest. Mawdii/Mawiri,
    a Yurokon or Bush Spirit, smells the tobacco and sends his daughter to bring the
    man to him. The Bush Spirit learns smoking from the Indian and keeps him to prepare
    tobacco leaves. The Indian lives among the Bush Spirits as the spirit’s son-in-law,
    sits on an alligator stool, grows hair over his body, has three children with
    the spirit daughter, briefly visits his mother, refuses to explain his changed
    appearance, and never returns home again. The author then comments that Guiana
    legendary beings are often described as very large to mark power or danger, and
    that Forest Spirits are associated with unusually big things in Arawak and Warrau
    stories.
  language: English
  quote_policy: summarized
