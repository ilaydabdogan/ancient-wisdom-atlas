canonical_text:
  quote: ''
  summary: A Warrau man is killed by his brother-in-law during a fishing encounter
    after a household quarrel. The widow compels the murderer to bury the body, then
    kills him while he fills the grave. The husband is buried with adornment and belongings,
    while the murderer is buried bare. The widow and children are taken to the dead
    man's relatives, and the dead man's brother takes the widow as a wife. The children
    repeatedly visit their father's grave, where a Hebu instructs them to rub leaves
    from a certain tree over the grave. When they return at midday, the father is
    present. The widow comes, recognizes him, and nurses him until he recovers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Warrau man, his wife, two children, and his brother-in-law lived together
    in one house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband and wife went to their field and instructed the brother-in-law
    to go fishing, but he stayed in the house and ate the remaining food.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband rebuked the brother-in-law, took his harpoon or fish-lance, and
    went down to the creek to catch fish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The brother-in-law sharpened a cutlass, followed the husband in a corial,
    and met him as the husband returned with a large speared fish.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When the husband put his lance into the brother-in-law's boat, the brother-in-law
    struck him with the cutlass; the husband died after giving his assailant two cuts.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The wife and children followed and found the brother-in-law trying to throw
    the dead body into the water; the wife ordered him to take the body home and bury
    it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The murderer hollowed out a tree trunk for burial and dug a grave; the dead
    husband was dressed with paint and ornaments and buried with a knife, fish-hooks,
    and other things.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: While the murderer filled the grave, the widow struck him from behind with
    her cutlass; he died and was buried bare in a second grave beside the first.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The dead man's mother and brother took the widow and children to the old woman's
    home; the dead man's brother placed the widow in his hammock and said he would
    take her because she could have children.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The two children went every morning to their father's grave and returned late.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: On the third day at the grave, the children met a Hebu, described as a little
    man, who told them to rub leaves from a certain tree over the grave and return
    at midday.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the children followed the Hebu's instructions, they returned at midday
    and saw their father seated on a bench.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The father asked the children for water to drink and then asked where their
    mother was.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The widow initially did not believe the children, but when she came to the
    place she recognized her husband seated before her.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:15
  text: The husband asked where the widow's brother was; she answered that she had
    killed and buried him beside the husband, and the husband said she would never
    see him again.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The husband was weak after what he had suffered, and the widow nursed him
    until within a week he was himself again.
  category: sequence
  evidence_refs:
  - ev:10
