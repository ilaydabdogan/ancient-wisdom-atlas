canonical_text:
  quote: ''
  summary: Haburi prepares to leave by making successive boats, several of which ducks
    steal, until a silk-cotton-tree boat remains and grows large enough for a journey.
    He arranges provisions with his mother and aunt, hides his departure from speaking
    house-posts, but a parrot informs Wau-uta. Wau-uta tries to prevent the boat leaving,
    is beaten on the fingers by paddles, and is then shut inside a hollow bee-tree
    while seeking honey; the story identifies her with a frog heard in hollow trees.
    The passage adds ethnographic notes on the rain-frog, Warrau and Carib boat traditions,
    a modern expansion of Haburi’s travels, and an introductory note on Koroiomanna
    as a creator figure associated with male humanity, Kulimina with female humanity,
    and his two wives with darkness and earth.
  language: English
  quote_policy: summarized
