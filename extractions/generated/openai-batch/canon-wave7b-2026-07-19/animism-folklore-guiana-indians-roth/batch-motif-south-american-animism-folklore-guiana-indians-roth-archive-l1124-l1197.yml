  claim: The passage itself cautiously connects Wau-uta’s frog identity with the Carib
    version’s old woman named as a rain-frog.
  claim_level: same_motif
  target: 'Carib version of the story, Sect. 35: Icono(bo)-aru or rain-frog old woman'
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The source uses cautious wording, saying the tree-frog is 'probably'
    the rain-frog, and this passage gives no detailed Carib narrative for comparison.
- id: claim:2
  claim: The ethnographic note contrasts Warrau boat-origin attribution with Carib
    sail-origin attribution as related technological-origin traditions.
  claim_level: same_function
  target: Warrau first boat use and Carib invention of the sail
  evidence_refs:
