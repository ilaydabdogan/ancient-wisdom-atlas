canonical_text:
  quote: ''
  summary: 'Yar performs tasks set by a prospective father-in-law: fetching water
    in a leaking quake with help from a Hebu, obtaining a corial, transforming an
    alligator into a bench and a snake into a fish-arrow, and shooting a large fish
    while obeying an instruction not to look into the water. The old man then gives
    Yar his daughter Usidiu, described as a plum-tree daughter and sculpture-like
    masterpiece. After further incidents involving a bunia bird and the removal of
    a snake from the daughter, the old man hides displeasure and awaits revenge during
    later marriage tasks of cutting a field and building a house.'
  language: English
  quote_policy: summarized
