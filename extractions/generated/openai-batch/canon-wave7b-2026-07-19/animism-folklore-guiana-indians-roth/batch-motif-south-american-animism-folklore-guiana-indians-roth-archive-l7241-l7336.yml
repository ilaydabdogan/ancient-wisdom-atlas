canonical_text:
  quote: ''
  summary: The passage surveys Guiana beliefs about Water Spirits and Water People.
    These beings may appear with animal forms such as horse, fish, porpoise, macaw,
    snake, or crab-like fish, may live under water or emerge at night, and may either
    harm humans by dragging them under or save them from drowning. It also includes
    a story in which an Ackawoi peaiman enters the belly of an Omar in the falls and
    kills it by setting fire to rotten wood inside it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Oriyu is described as splashing and trampling water like a horse, sometimes
    appearing above water with an animal head; Warrau descriptions cited here give
    Oriyu a fish's head.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Huroni or Water People are described as men by night and fish by day,
    and the passage notes that people may be transformed into fish.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Piapocos are said to believe in Evil Spirits who live at the bottom of
    the water by day and emerge at night, screaming like little children.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The same Piapoco spirits are said to be considered makers of rock carvings.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Toonahyannas or Water People are said to have stockaded ponds and to sleep
    at night with their bodies submerged.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Water Spirits may take zoomorphic forms including porpoise, manati, macaw,
    snake, or fish.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Among Pomeroon Arawaks, the black kassi-kuyuha porpoise injures a person who
