    a period; the wife is exempt.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage notes a belief in human milk as an effective antidote for snake-poison.
  category: object
  evidence_refs:
  - ev:10
- id: obs:13
  text: Omars are described as beings with bodies like exaggerated crabs and fish,
    living under water in rapids and dragging down Indian boats.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: In the Omar story, an Ackawoi peaiman wraps fire-making wood to keep it dry,
