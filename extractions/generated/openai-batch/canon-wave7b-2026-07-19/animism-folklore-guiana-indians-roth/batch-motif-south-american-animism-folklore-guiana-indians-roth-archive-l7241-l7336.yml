    and carries him to shore.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: At Caroquia, Water-mammas are said to take the form of huge scarlet macaws
    that rise from the river and drag Indians, with their woodskins, beneath the water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A Warrau piai told the collector that a macaw tells the Ho-aranni to upset
