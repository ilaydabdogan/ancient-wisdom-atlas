canonical_text:
  quote: ''
  summary: Sections 104-106 describe Guiana forest or bush spirits recognized by whistling,
    horse-like neighing, branch-cracking noises, smell, and other sensory signs; include
    named beings such as Didi, Kawaiho-Kuyuha, Hebus, Yurokon, Curupira, and Maboya;
    describe a caladium plant used to warn of a Yurokon; state that bush spirits can
    restore the dead and become invisible; and begin the tale titled “The Mutilated
    Husband is Made Whole,” in which a wife accompanies her husband in male attire.
  language: English
  quote_policy: summarized
