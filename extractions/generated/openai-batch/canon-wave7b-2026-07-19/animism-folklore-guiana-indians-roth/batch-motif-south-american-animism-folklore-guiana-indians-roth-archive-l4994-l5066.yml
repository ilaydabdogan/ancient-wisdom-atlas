canonical_text:
  quote: ''
  summary: A young woman is approached in her hammock by Simo, who says he belongs
    to the bee tribe and asks properly to marry her. After being accepted as son-in-law,
    he supplies an immense quantity of game with extraordinary strength and success.
    Later, his sisters-in-law pursue him despite his rejection and splash water on
    him, although he has warned that water burns and destroys him. He flies into a
    tree, melts into honey, and his child becomes the Wau-uta Tree-frog.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The huntsmen return from hunting with nothing on two successive afternoons,
    and the narrative asks whether the young woman may be the cause of the bad luck.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man approaches the banab, enters the young woman's hammock, and she
    fights him while warning him about her father.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The young man says he only came to rest, promises to ask her father properly
    for possession of her, and later identifies himself as Simoahawara, the bee tribe.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The young woman is calmed when she learns his identity because she had first
    taken him for a Bush Spirit or Hebu.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The father accepts Simo as son-in-law after Simo asks for the young woman
    and she consents.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Simo goes into the bush with a bow and two arrows, returns quickly, and sends
    word through his wife for her father to fetch the game he has killed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The game bundle is so heavy that the father and two sons together cannot raise
    it, but Simo brings it in himself.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: When the bundle is opened, it contains one of every kind of bird and beast
    imaginable, and the men spend a long time cleaning, cutting, smoking, and drying
    the meat.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: On the journey home, Simo carries a remaining load described as five times
    greater than all the others' loads together and catches up with them despite giving
    them a start.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: About a year later Simo has a baby boy and has been clearing his field.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Two sisters-in-law fall in love with Simo, repeatedly enter his hammock, and
    follow him, but he rejects them and complains to his wife.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: At the waterside, the sisters-in-law try to dash-spray water over Simo while
    he minds the baby on the river-bank.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: Simo has warned that if water touches him, it will act like fire, first weakening
    and then destroying him; he bathes in honey rather than water.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: After water is dashed over him, Simo cries that he burns, flies like bees
    into a tree, melts into honey, and his child changes into Wau-uta, the Tree-frog.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: 'The passage note explains three customs: the wife is tabooed from touching
    the meat due to her physiological condition, the husband must not bring it into
    the house, and a man and his father-in-law give orders through the wife as intermediary.'
  category: other
  evidence_refs:
  - ev:8
