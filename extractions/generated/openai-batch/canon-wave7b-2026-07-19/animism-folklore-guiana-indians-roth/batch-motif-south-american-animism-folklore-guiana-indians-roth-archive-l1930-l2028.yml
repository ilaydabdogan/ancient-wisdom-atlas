canonical_text:
  quote: ''
  summary: The passage first catalogs various Guiana and neighboring-region modeled
    or carved objects whose signification is said to be uncertain. It then introduces
    creation themes and describes accounts in which humans or a first man come from
    Cloud-land, the skies, or beyond them. In Carib accounts, mankind descends from
    on high, is left behind when clouds recede, eats baked earth cakes, and learns
    wild fruits by watching animals. Island Carib and central Guiana accounts name
    Louquo or Longwo as first man. A Korobohdna Arawak account says people descended
    from above the clouds by rope; the rope broke under a heavy woman, and the Great
    Spirit gave wings and plumage to those left above, who came down as kuriaka parrots.
  language: English
  quote_policy: summarized
