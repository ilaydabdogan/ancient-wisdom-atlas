  text: In one Carib account, mankind descended from on high, the clouds that brought
    them down receded, and hungry humans ate baked earth cakes and followed beasts
    and birds to learn wild fruits.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: In an Island Carib account, Louquo is the first man and a Carib; he descended
