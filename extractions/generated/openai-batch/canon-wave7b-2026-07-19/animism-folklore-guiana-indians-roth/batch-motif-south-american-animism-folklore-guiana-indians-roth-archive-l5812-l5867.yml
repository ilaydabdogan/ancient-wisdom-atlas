canonical_text:
  quote: ''
  summary: An unnamed man cries beneath a tree through the night while seeking Wau-uta's
    aid. Ordered groups of birds, game animals, tigers, and snakes touch his feet
    to confer hunting skill or luck. At daylight Wau-uta appears, shows him fungus
    on his arms as the source of bad luck, gives him a broken and spliced arrow in
    exchange for his own, and teaches him to shoot unseen animals. She permits him
    to keep the arrow only if he never reveals that she taught him. After he divulges
    the secret at a drinking feast, the special arrow is gone and his luck is lost.
  language: English
  quote_policy: summarized
