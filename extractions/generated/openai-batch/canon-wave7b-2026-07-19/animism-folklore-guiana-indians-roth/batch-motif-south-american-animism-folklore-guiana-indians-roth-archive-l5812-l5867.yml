- id: obs:9
  text: When the man shoots into the air in different directions, the arrow strikes
    birds, mammals, tigers, and snakes in the same ordered sequence as the animals
    that touched his feet.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Wau-uta says the man may keep the broken arrow on condition that he never
    tells anyone she taught him to be a good marksman.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: After returning home, the man gains a reputation for supplying meat and repeatedly
    refuses to reveal the secret of his success.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: At a paiwarri feast, drink causes the man to divulge what happened; afterward
