canonical_text:
  quote: ''
  summary: The passage recounts traditions about the twin boys Makunaima and Pia.
    In one episode Old Nanyobo extracts them from their mother, raises them, secretly
    produces fire from her mouth to cook fish, and is observed by one boy who turns
    into a lizard. The twins kill Nanyobo by burning her, and her internal fire passes
    into hima-heru wood, explaining firesticks. A Carib version begins with a woman
    pregnant by the Sun with the same twins; after a wrong journey she reaches Tiger's
    mother's house, is hidden, discovered, and killed by Tiger. The unborn twins are
    taken out, grow rapidly, learn from a Powis bird that Tiger killed their mother,
    and kill Tiger and his mother.
  language: English
  quote_policy: summarized
