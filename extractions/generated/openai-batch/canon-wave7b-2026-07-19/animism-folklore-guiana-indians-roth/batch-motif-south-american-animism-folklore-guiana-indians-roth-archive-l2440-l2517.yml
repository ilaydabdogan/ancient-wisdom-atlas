- id: motif:2
  label: Hidden watcher discovers secret domestic helper
  taxonomy_refs: []
  basis: In both animal-skin stories, the male figure secretly watches or silently
    returns and discovers that the animal-associated woman has been preparing cassava
    and household order.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  confidence: high
  cautions: The domestic-helper pattern is inferred from the repeated sequence; the
    passage itself only calls the second tale another example.
- id: motif:3
  label: Burning the animal skin after discovery
  taxonomy_refs:
  - shapeshifter
  basis: The young man burns the monkey skin after the woman agrees to stay with him,
    and the hunter burns the piai's daughter's charmed dog skin after finding her
    as a maiden.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: high
  cautions: The dog-skin story does not explicitly state the long-term consequence
    of burning the skin; the monkey-woman later returns to monkey-like movement despite
    the skin having been burned.
- id: motif:4
  label: Abused animal-wife returns to her people
  taxonomy_refs:
  - return
