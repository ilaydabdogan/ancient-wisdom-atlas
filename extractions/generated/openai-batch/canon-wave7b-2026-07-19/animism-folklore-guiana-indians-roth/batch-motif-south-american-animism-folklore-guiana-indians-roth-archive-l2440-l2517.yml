comparison_claims:
- id: claim:1
  claim: 'The Brett-adapted ''Sorcerer''s Daughter'' is presented as another example
    of the same local pattern as the preceding monkey-woman story: an animal-associated
    woman uses a removable or magic skin, secretly performs domestic work, is discovered
    by a male watcher, and has the skin burned.'
  claim_level: same_motif
  target: preceding monkey-woman removable-skin episode in the same passage
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  - ev:8
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The passage itself marks the second tale as another example, but it
    does not provide a formal comparative taxonomy or discuss differences in outcome.
- id: claim:2
  claim: The final notice explicitly aligns the Florida/Ponce de Leon account with
    a fountain-of-youth or River-of-Life pattern in which bathing in a special river
    restores youth.
  claim_level: same_motif
  target: fountain of perennial youth / River of Life pattern
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The passage gives only a short report and does not compare it to other
    regional or global fountain-of-youth traditions.
