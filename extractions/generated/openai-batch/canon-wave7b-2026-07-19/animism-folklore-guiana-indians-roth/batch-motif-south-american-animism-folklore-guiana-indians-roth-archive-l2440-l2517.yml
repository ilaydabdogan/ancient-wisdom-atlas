canonical_text:
  quote: ''
  summary: The passage contains a tale of a tame girl monkey who removes her skin,
    becomes a woman, makes cassava, is seized by a young man who burns her skin, bears
    a child, is abused, and returns with the child to her monkey people across a magically
    narrowed river. It then gives a Brett-adapted parallel in which a piai's daughter
    becomes a dog by means of a magic skin, secretly keeps a hunter's house, is discovered,
    and has the skin burned. The passage ends with a notice about a myth of a fountain
    or River of Life that restores youth and is linked to Ponce de Leon and Florida.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man and woman keep a girl monkey tame and leave her in charge when they
    go away.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The monkey removes her skin, hangs it on a house-beam, dresses in an apion-belt
    and ornaments, cooks cassava, eats it, and then puts the skin back on.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: A young man hides to watch, sees the monkey remove her skin and bake cassava,
    seizes her, and argues with her about becoming his wife.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the monkey-woman agrees, the young man pulls down the monkey skin from
    the beam and throws it into the fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The monkey-woman bears a boy, and later her husband lashes her, calls her
    Monkey, and annoys her.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The monkey-woman decides to return to her people, takes a calabash and ite-starch,
    says she is going to bathe, and instead goes into the bush.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the bush she resumes monkey-like movement, while her little boy imitates
    her; the husband later sees them jumping from tree to tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The child, feeling sorry for his father, throws down spiders and insects for
    him, but the father cannot eat them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: At a wide river the monkey-woman calls to her people, who make wind bring
    the opposite shore close enough for the mother and child to jump across; the shore
    then draws back.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The man is left on the near shore and later destroys belongings associated
    with the woman.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage introduces a Brett-adapted story as another example after the
    monkey-woman tale.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: In the second story, a piai's daughter asks her father to make her like one
    of a hunter's dogs; he puts a magic skin over her shoulders and she becomes a
    dog.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: When the hunter goes hunting, one dog returns home, and the hunter finds fire
    burning, cassava ready, and the house clean when he comes back.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The hunter silently returns, sees a maiden making cassava beside a charmed
    skin, seizes the skin, throws it on the fire, and claims the girl from her father.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage reports that old Island Indians told Ponce de Leon of a northern
