canonical_text:
  quote: ''
  summary: The passage discusses beliefs about spirits, afterlife, and sickness among
    Guiana and related Indigenous groups as interpreted by Roth. It questions whether
    conduct-conditioned future reward, punishment, and purgatorial ordeals are indigenous,
    noting possible European and Roman Catholic influence. It describes the Siusi
    dead as going to a forest on high mountains, explains that spirits may be regarded
    as good or bad according to whether they help or harm a person, distinguishes
    Maboya/Maboia from Familiar Spirits such as Chemin/Icheiri, and describes offerings,
    canoe images, and methods for removing undesirable spirits.
  language: English
  quote_policy: summarized
