- id: obs:3
  text: The others notice food remains in Maipuri's droppings and send the bush-rat
    to follow him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bush-rat sees Maipuri gather fallen fruit under the immense Allepdntepo
    tree, whose branches bear many foods desired by the Caribs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bush-rat climbs the tree, eats corn, brings back a grain, and then leads
    the Indians to the tree.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Indians cannot climb the tree because it is too large and smooth, so they
    build staging around the trunk and cut it with stone axes over repeated ten-day
    periods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: When sent for water, the other animals receive calabashes, but Maipuri receives
    a sifter, so the water runs out; the passage identifies this as punishment for
    keeping the tree secret.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: After the tree falls, the Indians take cultivated foods away to plant in their
    provision fields, while animals gather food from among the branches.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Bunia bird explains how the foods are to be propagated and cooked, including
    that bitter cassava juice must be boiled before drinking.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Roth says his old Carib account offered no explanation for the tree's origin,
    but he reports Brett's attribution of the tree to Tamosi and a similar Akawai
    tree to Makunaima.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: In Brett's added version, waters in the stump or under the roots of the wonderful
    tree are temporarily checked by a rock or inverted basket and later released,
    causing a destructive flood.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the flood episode, some people try to climb a kokerite palm whose top reaches
