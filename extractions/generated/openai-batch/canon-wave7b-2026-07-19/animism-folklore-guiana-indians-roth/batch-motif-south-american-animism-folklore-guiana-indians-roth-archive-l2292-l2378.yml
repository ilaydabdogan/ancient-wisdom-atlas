canonical_text:
  quote: ''
  summary: The passage gives a Carib tale in which the Maipuri secretly feeds at the
    immense Allepdntepo tree, where many cultivated foods grow. A bush-rat follows
    him, brings back a grain, and leads the Indians to the tree. The people cut the
    tree down after long labor, distribute the foods, plant them in provision fields,
    and receive instruction from the Bunia bird on propagation and preparation. Roth
    then notes Brett's related attributions to Tamosi and Makunaima, a variant in
    which waters from the stump or roots of the tree cause a flood, and an escape
    episode involving palms and petrification. A final note contrasts the lack of
    mainland animal-origin explanations with an Island Carib account of Louquo making
    fishes from cassava fragments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Roth reports, on Carib authority, that the Bunia bird taught the Carib folk
    about cultivated plants, which originally grew on a wonderful tree.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the beginning of the tale, the people, animals, and birds lack cassava
    or other food and starve, while Maipuri regularly returns sleek and fat.
  category: setting
  evidence_refs:
