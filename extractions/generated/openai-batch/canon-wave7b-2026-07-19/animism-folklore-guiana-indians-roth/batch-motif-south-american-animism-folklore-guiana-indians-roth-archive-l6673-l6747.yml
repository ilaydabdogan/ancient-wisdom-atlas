canonical_text:
  quote: ''
  summary: The passage describes Guiana beliefs and rites involving spirits associated
    with plants and trees. It treats the silk-cotton tree as spirit-associated, venerated,
    avoided for cutting, animated, and linked in Arawak tradition with the making
    of living beings. It then describes the Spirit of the Cassava, offerings to Bush
    Spirits/Yawahus and to the cassava spirit at house completion, harvest festival,
    and first baking or first-fruits rites. It ends by noting that a Spirit of the
    Rot is associated with maize.
  language: English
  quote_policy: summarized
