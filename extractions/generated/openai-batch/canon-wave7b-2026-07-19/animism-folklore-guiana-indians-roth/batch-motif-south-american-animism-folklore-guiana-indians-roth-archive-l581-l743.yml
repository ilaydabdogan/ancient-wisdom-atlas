  summary: The passage moves from a works-of-reference list into the opening of Chapter
    I, where Roth argues that Guiana Indians did not originally possess a modern concept
    of a Supreme Being. He says later God-terms were shaped by missionary or civilized
    requirements and that traditions of tribal heroes have sometimes been mistaken
    for evidence of such a concept. Roth quotes Gumilla on uncertain God-terms among
    Caribs, Salivas, and Betoyes, including Quiyumocón as “Our Big Father,” Puru as
    a sky-dwelling maker of good, and the Betoye identification of Sun and God.
