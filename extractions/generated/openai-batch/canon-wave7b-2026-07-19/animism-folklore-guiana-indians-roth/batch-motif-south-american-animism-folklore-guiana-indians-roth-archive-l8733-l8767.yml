  quote: ''
  summary: The passage lists several tokens or auguries that precede death, evil,
    or unusual events. It then states that a token may be an indescribable feeling
    and begins a Warrau story in which a young woman refuses an old man, marries a
    young hunter, senses danger while he cuts honey trees, and the hunter is killed
    by tiger-like spirits sent by the rejected old man.
