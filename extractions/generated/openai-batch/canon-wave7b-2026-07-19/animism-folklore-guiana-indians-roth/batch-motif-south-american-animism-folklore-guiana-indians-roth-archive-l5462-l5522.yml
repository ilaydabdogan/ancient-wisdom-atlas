    step-like route. After returning home, he beats his wife despite his mother's
    warning. The wife uses a feather covering to fly back to her father. The man later
    mourns and searches for her. Her father sends Carrion Crows, who kill the man
    at the former site of the beautiful house and then devour the carcass.
