canonical_text:
  quote: ''
  summary: The passage records Guiana Amerindian identifications of the Milky Way,
    Southern Cross, and other star groups as paths, animals, spirits, hunting scenes,
    and a narrative tableau. An Arawak story explains the Babracote and Camudi star
    groups through a tale of a son-in-law who kills his wife, deceives her mother
    with the liver, and escapes a revenge plan in which a large camudi instead swallows
    his younger brother.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Arawaks give the Milky Way two names: the Path of the Maipuri or Tapir, and
    the Path of the Bearers of Wai-o, a white clay used for vessels.'
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The nebulous spots in the Milky Way are described as tracks of spirits whose
    feet were smeared with white clay.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Another explanation says three nebulae within the Milky Way represent a tapir
    chased by a dog and followed by a jaguar; another says the nebulae were made by
    celestial wild hogs rooting up white clay.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Makusis call the Milky Way Parana, a term also applied to the sea.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Southern Cross is identified in one account as the great White Crane,
    while Arawak and Warrau accounts identify it as the powis bird.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Arawak and Warrau Southern Cross account, one pointer is an Indian
    about to shoot an arrow and the other is his companion running behind with a fire-stick.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Southern Cross is said to indicate powis hunting, and the Makusis apparently
    regard it as the home of the Spirit of the powis bird.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'Arawaks and some Warraus describe two star groups as the Babracote and the
    Camudi: four bright stars of Pegasus form the square frame of the Babracote, and
    a cluster in Scorpio represents the Snake.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the Arawak story, a man lives with his wife and mother-in-law and is repeatedly
    criticized by the mother-in-law for returning from hunting and fishing without
    food.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The man takes his wife hunting, kills her, cuts her into pieces, dries her
    flesh on a babracote, and gives her liver to the mother-in-law while calling it
    tapir liver.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The mother-in-law realizes the liver was her daughter's, goes to her brother,
    the large camudi at the head of a creek, and asks him to swallow the son-in-law
    when sent there.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The son-in-law suspects the plan and sends his younger brother to hunt at
    the creek while he goes in the opposite direction.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The camudi kills and swallows the younger brother, mistaking him for the son-in-law.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The story ends by saying that on a clear night the babracote and the nearby
    camudi with swollen belly can still be seen in the sky.
  category: relationship
  evidence_refs:
  - ev:8
