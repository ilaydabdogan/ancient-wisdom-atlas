canonical_text:
  quote: ''
  summary: Chapter synopsis and sections 94-96 define Forest or Bush Spirits, list
    regional names for them, describe their origins from corpses or spontaneous development,
    and give details about Arawak Yawahu/Tukuyuha types, especially Konoko and Adda
    spirits, including hairiness, underground forest habitation, attacks, broken-bow
    naming, tree association, bird form, and an appeasement gesture at a spirit-attached
    tree.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Forest or Bush Spirits are described collectively as spirits that can emanate
    from a human corpse and eventually rest in a tree, field, forest, or bush; some
    may arise from dead animals or birds or develop spontaneously.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:2
  text: The passage lists different generic names for these spirits across tribes
    and regions, including forms such as Hyorokon, Hyrouca, Maboya, Yolok, Yawahu,
    Hebu, Yurokon, Immawari, Caypor, Curupira, and Jurupari.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:3
  text: The author states that Yurokon-like terms occur in several forms across the
    Guianas and notes connections or resemblances to Juluca, the Rainbow, the Shadow
    Spirit, and Huracan-related names.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:4
  text: Yawahu is identified as the Arawak generic term and is said to include Tu-kuyuha,
    Ekkekuli or Manahau, and Mansinskiri; Tu-kuyuha is subdivided into Konoko and
    Adda varieties according to bush/forest or tree association.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:5
  text: The chapter synopsis says Bush Spirits may be zoomorphic and able to change
    into animals such as tigers and goat-suckers, and may be recognized by sound or
    smell.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: The chapter synopsis attributes to Bush Spirits the abilities to bring the
    dead to life and become invisible, and describes them as sometimes kind but generally
    mischievous, causing mishaps, crop damage, disputes, sickness, death, and transformations.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:7
  text: The synopsis says Bush Spirits are fond of women, human flesh, nursing children,
    and tobacco; are usually abnormally large; avoid exposure; and dislike being mimicked
    or mocked.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:8
  text: Konoko Tukuyuha are described by an Arawak woman as hairy people whose faces
    cannot be seen because of their hair; they live underground in the forest and
    may be male or female.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Konoko Tukuyuha may be encountered suddenly and may give a premonitory sign
    of their coming, though the sign is usually recognized only after the warned event
    has occurred.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Because they are said to lack bows and arrows, Konoko Tukuyuha fight only
    with their limbs; an attacked Indian may return home, die soon afterward, and
    show no marks on the body.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Sometimes a Konoko Tukuyuha is said to eat the victim, causing the person
    to disappear completely so that friends and relatives see no further sign of him.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Old-time Arawak people used to call these beings by a name meaning broken
    bows before reaching their houses, in order to prevent the spirits from entering.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Adda Tukuyuha are especially associated with trees and are sometimes in the
    shape of birds; the passage names the silk-cotton and kofa trees as notable examples.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: In a Cayenne example, an Indian guide breaks his arrow and asks pardon from
    the tree-attached spirit after a European visitor has touched the timber with
    a fish and an agouti described as unclean victims.
  category: action
  evidence_refs:
  - ev:10
