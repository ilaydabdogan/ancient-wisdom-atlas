canonical_text:
  quote: ''
  summary: 'A Warrau narrative tells of a queer old Hebu who gathers a settlement
    in a line, kills them with a clawing motion, and has his wife carry away the bodies.
    A pregnant woman escapes, reports the event, and a party burns a silk-cotton tree
    inhabited by the baboon-Hebu family with pepper smoke. The dying Hebu curses people
    with continuing choking and coughing, identified as whooping-cough or baboon cough.
    The following ethnographic section describes precautions after killing large animals:
    arrows or pointed sticks in paths, destruction of a tapir-meat drying rack, and
    hunting-related boucans or altars, all connected with preventing animal spirits,
    predators, or animal revenge.'
  language: English
  quote_policy: summarized
