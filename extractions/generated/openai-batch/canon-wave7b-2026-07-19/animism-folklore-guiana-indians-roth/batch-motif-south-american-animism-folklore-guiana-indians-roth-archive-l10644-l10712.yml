canonical_text:
  quote: ''
  summary: 'The passage describes several Guiana and nearby Amazonian puberty ordeals:
    painful wounding, whipping, beating, cutting, tooth filing, seclusion at menstruation,
    exposure to smoke, and later permission to wear adult garments, eat freely, marry,
    or see Jurupari music. It includes Warrau boys, Carib and Cayenne girls, Makusi
    girls, Puinavis girls and young men, Uaupes River girls and boys, and Pomeroon
    Arawak menstrual seclusion practices.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Warrau boys undergo initiation ordeals involving painful wounds on the breast
    and arms made with a wild boar tusk or toucan beak; endurance without signs of
    pain permits ranking with men, while failure requires a later ordeal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Carib girl of the Pomeroon is cut by a piai with acouri incisors down the
    back and from shoulder to shoulder, after which pepper is rubbed into the wounds
    and she is not to cry out.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In Cayenne, girls receive bloody incisions before being allowed to wear the
    apron-belt; young men are allowed to wear the lap-cloth after ordeals; a Cayenne
    girl is also said to have her teeth filed by the piai at puberty initiation.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After her first menstrual bath, a Makusi girl sits at night on a stool or
    stone and is whipped by her mother with thin rods without crying or waking the
    hut occupants; the whipping is repeated at the second menstrual period but not
    later.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the Puinavis, a figure called the “Devil” makes terrible music in the
    forest, later enters the girl’s house, and makes a hubbub while a piai binds the
    girl’s eyes and leads her through the village.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the Puinavis account, men strike the girl with sticks while she does not
    complain; a young man may take her place, endure the blows without murmuring,
    and then be chosen by her as husband.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Among Uaupes River Indians, assembled relatives and friends bring pieces of
    sip6, and each person gives the naked girl severe blows across the back and breast
    until she may fall senseless or die; if she recovers, the beating is repeated
    at stated intervals.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Uaupes account, sip6s are dipped in prepared pots of meat and fish
    and given to the girl to lick; afterward she is considered a woman, allowed to
    eat anything, and marriageable.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Uaupes boys undergo a somewhat similar but less severe puberty ordeal that
    initiates them into manhood and allows them to see the Jurupari music.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage groups other puberty procedures for menstruating girls with isolation,
    water, fire, cooking, cooking apparatus, and hair.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: In older Pomeroon Arawak practice, the girl remains with her mother in a separate
    logie or special house compartment marked by waste shreds of ite palm; the special
    room is called the aibona-lehi, and Warraus are said to have used a separate closed
    house.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: For a Makusi girl at first signs of menstruation, her hammock is moved to
    the highest part of the hut, where she is exposed to smoke that is increased,
    and for the first few days she must not leave the hammock during the day.
  category: setting
  evidence_refs:
  - ev:6
