canonical_text:
  quote: ''
  summary: The passage summarizes Guiana Indian accounts of Water Spirits, giving
    their names in several languages, their anthropomorphic and zoomorphic forms,
    their relation to sickness and accidents, taboos involving names and forbidden
    words, Warrau distinctions among fish, sea, and river spirits, stories of broken
    amity between Water People and Land People, cautions about comparisons with other
    water-spirit traditions, and Arawak accounts of Oriyus living in water and appearing
    in human form.
  language: English
  quote_policy: summarized
