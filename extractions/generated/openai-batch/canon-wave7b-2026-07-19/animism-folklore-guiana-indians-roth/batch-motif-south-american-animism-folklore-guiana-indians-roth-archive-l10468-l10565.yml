canonical_text:
  quote: ''
  summary: The passage describes name-changing and name-exchange customs, Warrau naming
    of hunting dogs after good hunters, restrictions and special forms in speech,
    and the beginning of a chapter on sexual life. It then summarizes puberty and
    marriage ordeals involving fasting, ant bites, scarification, flogging, endurance
    without visible suffering, and ritual counteraction of a harmful spirit in relation
    to a Makusi girl.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Names may be changed after recovery from prolonged sickness, when males are
    received as warriors, or after a warrior kills an Arawak chief and takes the chief's
    name as an honor.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Names are exchanged, or in some present-day Arawak and Warrau cases adopted
    by the younger from the older, as signs of affection, friendship, or perpetual
    amity.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Among Island Caribs, a person may ask to receive a new name during drinking
    bouts or public rejoicing; the appointed namer gives the name and is rewarded
    with a present such as a quartz-crystal.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Warraus name dogs after animals regarded as good hunters or fast hunters,
    including certain ants, bees, a wasp, crabs, the giant anteater, the shark, and
    the small wild dog.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: During travel over water, the use of certain names otherwise used in daily
    speech is forbidden; on the Aiary River, villages have secret names that are not
    mentioned except under pressure.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Among Arawaks, some words differ according to the sex of the speaker or addressee,
    and a special plaintive intonation is used when asking after the health or welfare
    of ill or unfortunate persons.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: In many tribes, including Warraus and Caribs as named examples, young people
    of both sexes cannot enter permanent sexual partnership until they have undergone
    puberty ordeals; in some cases betrothal or marriage follows the ordeals.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The listed puberty ordeals include fasting, exposure to ant bites, severe
    scarification, and flogging, all to be endured without visible signs of suffering.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that the ordeal effects are understood as making young
    people healthy, strong, willing to work, skillful, and industrious.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: For females, the passage reports a belief that a Spirit prone to evil possesses
    the girl, and says that a piai blows on and mutters over a Makusi girl and her
    valuables to disenchant her and the things she has touched.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Some ordeals may be repeated in reduced form at the second or perhaps third
    menstrual period.
  category: sequence
  evidence_refs:
  - ev:7
