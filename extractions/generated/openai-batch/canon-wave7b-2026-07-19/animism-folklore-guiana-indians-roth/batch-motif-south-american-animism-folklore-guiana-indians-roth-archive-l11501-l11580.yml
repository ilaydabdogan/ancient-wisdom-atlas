canonical_text:
  quote: ''
  summary: The passage describes the authority, restrictions, dead-veneration, propitiatory
    observances, social position, and ritual equipment of Guiana medicine-men or piai.
    It notes venerated bones of dead sorcerers, haunted travel places requiring offerings
    for safe return, and taboo ritual insignia such as benches, rattles, manikins,
    crystals, and special baskets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Medicine-men were described as respected and feared by the community both
    alive and dead, and as teachers, preachers, counsellors, guides, and arbiters
    of life and death.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Medicine-men had dietary restrictions, including abstention from certain fish,
    game, large animals, and animals transported from Europe that were considered
    unnatural to the country.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Medicine-men were said to renew their piai power by drinking tobacco juice
    in weaker doses than at installation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bones of dead sorcerers were kept with veneration, assembled, and hung
    in the air in the cotton beds used by the wizards when alive.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A spot on the Jabuni channel was said to be haunted by a Pajé, and voyagers
    were expected to propitiate him by depositing an article in order to secure a
    safe return.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the haunted spot, trees were reported as hung with rags, shirts, straw
    hats, bunches of fruits, and similar deposited objects.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage reports parallel observances on the River Caiary-Uaupes and the
    Rio Branco, while noting that at Bates's Jabuni example the pure Indians gave
    nothing and that the depositors were Portuguese and uneducated Brazilians.
  category: other
  evidence_refs:
  - ev:3
- id: obs:8
  text: In some cases the captain and the piai were the same person, but the medicine-man
    did not necessarily gain headship of a family through proficiency.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The medicine-man's equipment included a particular bench, a rattle, a doll
    or manikin, crystals, other unusual items, and a special basket or pegall for
    storage.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Among Arawaks and Warraus, the special basket was described as having both
    top and bottom concave.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: The medicine-man's insignia were taboo to common people, kept in a special
    shed, and said to lose their virtues if profaned, while profaners would suffer
    misfortunes.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The piai's bench differed from ordinary furniture by being larger, often painted,
    and carved with animal designs such as turtle, alligator, tiger, and macaw.
  category: attribute
  evidence_refs:
  - ev:7
