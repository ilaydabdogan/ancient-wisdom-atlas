canonical_text:
  quote: ''
  summary: The passage gives examples of ritual restrictions and consequences connected
    with performance, clay gathering, vessel use, hammocks, canoes, agriculture, and
    fans. It includes the story of a speaking Pot that cooks food for a man but stops
    after his sons clean it and after rebuking him for greed and failure to share
    with his family.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In a performance-related practice, spectators hide while dancers leave the
    public meeting-house to decorate themselves, then return together shouting and
    screaming when the performers reappear, to avoid death or other misfortune.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Indians travel to a small hill near the mouth of the Cuyuni to obtain clay
    considered especially desirable.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The clay is believed safe to collect only during the first night of the incoming
    full moon; clay taken at other times is said to make vessels break quickly and
    bring diseases to those who eat from them.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man finds a banab without human occupants, with a Pot simmering on a fire;
    the Pot speaks to him and cooks bird for him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man repeatedly eats food supplied by the Pot and then refuses food offered
    by his wife at home, saying he is satisfied.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The man’s two sons follow him, see him speak to the Pot, later ask the Pot
    to cook for them, eat, and wash the vessel completely clean.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After being cleaned, the Pot will not boil for the man or anyone else and
    tells the man he was greedy because he did not give the bird and meat to his wife
    or children.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Island Carib women place a small parcel of ashes at each end when making hammocks;
    without this ceremony the hammock is believed not to last.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Eating figs while possessing a new hammock is believed to make it rotten,
    and eating certain sharp-toothed fish is believed to make it soon torn.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: During Island Carib canoe manufacture, if a woman touched the canoe with her
    fingers while it was being burnt out and widened, it was believed the canoe would
    split.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Orinoco men tell Father Gumilla that women should plant because women know
    how to bring forth, and therefore maize, cassava, and other crops multiply when
    planted by women.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Among Pomeroon Arawaks, a woman’s fan is to be used for blowing up the fire;
    if she uses it on herself, she is said to become thin.
  category: relationship
  evidence_refs:
  - ev:9
