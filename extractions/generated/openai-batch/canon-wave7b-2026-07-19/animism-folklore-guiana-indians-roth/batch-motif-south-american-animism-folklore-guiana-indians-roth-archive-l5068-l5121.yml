canonical_text:
  quote: ''
  summary: A husband whose wife and her brothers leave him tied outside in the rain
    hides his anger, then takes his wife into the bush under pretense of hunting.
    He kills and dismembers her, dries the flesh, feeds her liver to her brothers,
    and sets her head above the meat basket. The brothers recognize the head and pursue
    him by river. When they catch up, he climbs a tree and is changed into a Yakahatata,
    a bird whose cry repeats his words about their sister.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A husband, his wife, and her two brothers live together in one house.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the husband says rain makes him sleep soundly, the wife and her brothers
    tie him up and leave him outside in the rain overnight.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At dawn the husband says he has slept well and asks to be untied, but he is
    angry and decides to punish his wife without showing his anger.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The husband takes his wife far into the bush, tells her to prepare a babracote
    and firewood for an alligator hunt near a waterhole, then kills her, removes her
    head, cuts up her body, and dries the flesh on the babracote.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: He packs the cured flesh in a waiyarri, leaves it away from the house, and
    fixes the wife’s head on a stick above it, with her face turned toward her former
    home and a silver nose-ornament on the face.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: He carries only the dried liver back to the house, gives it to the brothers
    to eat, and then tells them to go help their sister carry the load of meat.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: The brothers go down the path, see the head above the waiyarri, recognize
    it as their sister’s, and rush home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The husband leaves by saying he is going to bathe, releases the corials from
    their moorings, takes one, and goes downstream.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After their mother tells them where the husband went, the brothers obtain
    a corial and chase him on the stream.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: When the brothers catch up, the husband jumps ashore, climbs a tree, shouts
    that their little sister is where he left her, and is changed into a Yakahatata,
    described as a sort of powis that cries a phrase resembling “sister-little-there.”
  category: action
  evidence_refs:
  - ev:6
