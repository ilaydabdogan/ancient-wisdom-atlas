canonical_text:
  quote: ''
  summary: A man observes a beautiful decorated house with singing and dancing people,
    later returns, hides in lemon-grass, and seizes a dancing girl. When he seizes
    her, the house, people, decorations, and music disappear, but the girl remains.
    He makes her his wife after promising not to thrash her. She refuses to eat fresh
    game and prefers tainted meat; a note identifies her as retaining Vulture attributes.
    After the husband beats her three times over the meat, she says she will take
    him to see her father. For the visit to her people, he brings meat and must wear
    Vulture feathers.
  language: English
  quote_policy: summarized
