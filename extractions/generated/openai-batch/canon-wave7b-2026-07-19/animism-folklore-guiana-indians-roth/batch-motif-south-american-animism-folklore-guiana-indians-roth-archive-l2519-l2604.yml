candidate_motifs:
- id: motif:1
  label: Testing alleged immortality by killing and watching for decay
  taxonomy_refs: []
  basis: Brayoan tests whether Spaniards are immortal by arranging Salzedo’s drowning
    and a three-day watch for putrefaction.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage frames the episode historically and ethnographically rather
    than as a mythic tale; motif status depends on comparative use.
- id: motif:2
  label: Dead persons or enemies transformed into stone
  taxonomy_refs: []
  basis: The passage describes bodies or skeletons turning into stone, granite blocks
    identified as dead warriors, and attacking enemies changed into stones.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: 'The examples differ: some are after-death transformations, while the
    Kirinampo Rocks tale describes protective transformation of living enemies.'
- id: motif:3
  label: Protective spirit petrifies attackers
  taxonomy_refs:
  - divine_judgment
  basis: A good Spirit takes pity on the Makusi and changes their Carib enemies into
    stones when the Caribs come to destroy them.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage says the Spirit takes pity and transforms the enemies; it
    does not explicitly call the act a judgment.
- id: motif:4
  label: Multiple body-part or trace spirits depart at death
  taxonomy_refs: []
  basis: The passage says one or more spirit-like entities may be linked to shadow,
    heart, head, pulse-bearing parts, blood, spittle, footprint, and bone and depart
    at material death.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The author presents this partly as a reconstruction of earlier belief,
    so individual components may vary by group.
- id: motif:5
  label: Afterlife destinations mapped by spirit type
  taxonomy_refs:
