canonical_text:
  quote: ''
  summary: The passage records a Porto Rican Arawak-related episode in which Indigenous
    people test whether Spaniards are immortal by drowning a Spaniard and watching
    his body for putrefaction. It then surveys beliefs that bodies, skeletons, warriors,
    or enemies may become stone, including a tale in which a good Spirit changes attacking
    Caribs into rocks to protect the Makusi. The passage also compares Arawak, Carib,
    Warrau, and Island Carib ideas of spirits connected with shadow, head, heart,
    pulse, forest, sky, seashore, beasts, and bones after death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Many Indians in the Porto Rico example are described as believing that the
    Spaniards were supernatural beings who could not be killed.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cacique Brayoan sends subjects to escort the young Spaniard Salzedo with
    secret instructions.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a river, the subjects carry Salzedo on their shoulders, let him fall in
    midstream, hold him under water, and drown him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: After dragging Salzedo’s body ashore, the people apologize and keep watch
    over the body for three days until putrefaction appears.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: After deciding that the strangers are mortal, the Indians enter into a conspiracy
    to destroy them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:6
  text: Certain Indians, including Otomacs, are said to hold that after death the
    body or skeleton turns into stone.
  category: other
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Atorais regard certain enormous granite blocks as local warriors who after
    death were changed into stone.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: In a Kirinampo Rocks account, Caribs come to destroy the Makusi, and a good
    Spirit changes the Carib enemies into stones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The passage states that one or more spirits or spirit-like somethings are
    set free at death, and lists shadow, heart, head, pulse-bearing body parts, blood,
    spittle, footprint, and bone as possible spirit-bearing elements.
  category: other
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Arawak conception described here connects a dead person’s spirit with
    the person’s shadow and distinguishes good-doing and evil-doing forms by qualifying
    terms.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Mainland Carib terms distinguish a person’s shadow from a head-resident Dream
    Spirit; after the latter leaves the body permanently for the forest it receives
    another name.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Warrau expression cited for the heart or heart’s Spirit describes it as
    leaving the body at death and becoming a Bush Spirit.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Island Carib belief is described as linking spirits with heart-beats and pulse-beats,
    with a principal heart spirit going to the sky after death with its familiar spirit
    and changing into a young and new body.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: Other Island Carib spirits are said to live on the seashore and make boats
    tack, live in woods and forests, or become changed into beasts; these spirits
    are described as having sexes and multiplying.
  category: other
  evidence_refs:
  - ev:7
- id: obs:15
  text: Koch-Grunberg is cited as suggesting that some death-festival procedures point
    to belief in the bones as the spirit’s real and final resting place after bodily
    dismemberment.
  category: other
  evidence_refs:
  - ev:8
