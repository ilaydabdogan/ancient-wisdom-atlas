canonical_text:
  quote: ''
  summary: 'The passage contains three Warrau-marked tales: a rude Indian is misled
    into attacking a sleeping tapir and is painfully punished; Turtle and Aruresso
    Bird compete for marriage by clearing fields, with Turtle''s false industry exposed
    and Bird rewarded; two sisters tame a tapir, their brothers kill it, and the grieving
    sisters become water-cow and bush-cow.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the first tale, an Indian traveler encounters men eating something savory,
    asks roughly what they are eating, and is told it is tapir liver that he must
    hunt for himself.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The men direct the traveler to a sleeping tapir and give him a dangerous invasive
    method for getting its liver; he follows the instruction and cannot free his arm
    when the tapir wakes.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The tapir runs through thicket, bush, and forest dragging the man, and the
    man is freed only when they reach a sheet of water.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the man returns home with the skin peeled from his arm, his people laugh
    after he explains what happened; the narration says he was punished for bad manners.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the second tale, Turtle and Aruresso Bird both wish to court a woman's
    daughter, and the mother orders each to cut a field.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Turtle leaves before daybreak and is favored for apparent industry, but he
    has only rolled over decayed undergrowth and has not felled trees.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The mother finds Aruresso Bird in a cleared space and chooses him as son-in-law,
    while declaring Turtle's future life among decayed leaves and logs and Bird's
    future association with fields, cassava, drink, and songs.
  category: speech
  evidence_refs:
  - ev:6
  - ev:11
- id: obs:8
  text: In the third tale, two sisters regularly pick plums and tame a tapir by giving
    it squeezed plum juice in a manicole-palm spathe and calling it with a whistle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The sisters' brothers suspect the absences, watch the feeding of the tapir,
    imitate the whistle, kill the tapir, and bring home its meat.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The sisters at first eat the meat, later realize their pet has been killed,
    cry, refuse comfort, and leave the house.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: At a river bank the younger sister enters the water, declares she will be
    called water-cow, dives three times, and comes up in that shape; the elder sister
    runs into the bush and changes into a bush-cow.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The tale ends by saying bush-cow and water-cow still meet at the waterside
    and understand one another because they have the same grunt.
  category: relationship
  evidence_refs:
  - ev:9
