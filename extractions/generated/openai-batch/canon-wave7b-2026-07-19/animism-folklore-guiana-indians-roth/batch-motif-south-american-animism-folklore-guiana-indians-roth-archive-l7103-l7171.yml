literal_observations:
- id: obs:1
  text: The author states that local natural features in the Guianas may become landmarks
    of notable occurrences and acquire eerie stories around them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cliffs, hillocks, and other places near Kayiwa on the Corentyne are said to
    be inhabited by a large snake that goes to the river to drink, and its path is
    said to have deprived the cliffs of vegetation.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A low hill above the Waiquah River had a large artificial mound identified
    by a guide as the grave of Makunaima's brother, and an isolated rocky mountain
    was named Makunaima-outa, the Great Spirit's House.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: A hand-shaped rock in the Pakaraima Mountains, called Toupanaghoe by the Makusis,
    is treated as the seat of a demon, and Indians pass it fearfully.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the Merume escarpment, Indians warned against roasting salt fish on embers
    because a large eagle and a camoodie snake living on the mountainside might show
    displeasure by causing more rain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: A medicine-man said Mount Roraima was guarded by an enormous camudi capable
    of entwining a hundred people, and said he had seen many demons near its den.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: An Indian objected to camping near a cave believed to belong to a celebrated
    water-mama, near which it was dangerous to sleep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: At certain localities associated with Spirits, the passage says they must
    not be approached too closely or pointed to, and sometimes must not be looked
    at or spoken of.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Old Man's Rock in the Essequibo is said to be continually haunted by a murdered
    buckeen, and pointing at it is dangerous.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Negro Cap rock near the Three Brothers Islands is believed to bring a
    heavy storm on anyone who points at it.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Black glazed river-bed rocks are said to be vexed by allusions to their appearance
    and to send misfortune.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The passage treats temporary occlusion of sight as another procedure indicating
    the presence of a Spirit nearby.
  category: other
  evidence_refs:
  - ev:11
