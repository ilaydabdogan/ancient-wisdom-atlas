candidate_motifs:
- id: motif:1
  label: Serpent lover as ancestor of a people
  taxonomy_refs:
  - serpent
  - shapeshifter
  basis: Both Carib-origin variants involve a snake or water-camudi lover connected
    with a woman and with the origin of the Carib nation.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: 'The two variants differ: one makes Uamma''s own fragments grow into Caribs,
    while the Carib version makes the baby camudi''s fragments grow into people.'
- id: motif:2
  label: Dismembered serpent fragments become people
  taxonomy_refs:
  - serpent
  - death_rebirth
  basis: Uamma is cut into many pieces and each piece becomes a Carib; in the Carib
    version the baby serpent is chopped up and its fragments become Indians.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The mapping to death_rebirth is interpretive; the passage literally describes
    multiplication or generation from fragments rather than the same individual returning.
- id: motif:3
  label: Broken reciprocal exchange becomes blood feud
  taxonomy_refs:
  - sacred_exchange
  basis: Caribs and Warraus exchange food through children until revenge killing of
    a child creates reciprocal killing and feud.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage states reciprocal exchange and feud, but does not explicitly
    call the exchange sacred.
- id: motif:4
  label: Human or animal creation from tree and plant matter
  taxonomy_refs:
  - sacred_tree_axis
  basis: The passage groups several accounts under the vegetable derivation of man,
    including creation from a large tree, silk-cotton twigs and bark, tree-borne human
    fruit, tree trunks, and a mythic grave-tree.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage supports tree or plant origin strongly, but not every listed
    account makes the tree an axis or world-center.
- id: motif:5
  label: Flood survivor pair renews humanity through fruit
  taxonomy_refs:
  - flood_and_renewal
  - survivor_pair
  basis: A man and woman alone survive the submerged earth on a high mountain and,
    following a voice's instruction, produce men and women by throwing Mauritia fruits.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage gives the account in summary form and cites Maipure and Tamanac
    parallels rather than a full narrative.
- id: motif:6
  label: Mythic tree transformed into a river rapid
  taxonomy_refs: []
  basis: Loku-daia is described as a mythic Indian tree growing from a grave, associated
    with origin from its root, and transformed into a rapid when cut down.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The notice is brief and partly etiological; its relation to the broader
    human-origin theme needs review.
comparison_claims:
- id: claim:1
  claim: 'The first serpent-lover account and the Carib water-camudi version perform
    the same etiological function: explaining the origin of the Carib nation from
    serpent or camudi fragments.'
  claim_level: same_function
  target: First account of Uamma and Carib version of the water-camudi origin of the
    Caribs
  evidence_refs:
  - ev:1
  - ev:4
  counter_evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  limitations: 'The details differ: one centers on Uamma and later feud with Warraus,
    while the other centers on the baby camudi, kin recognition, and reconciliation.'
- id: claim:2
  claim: The plant-origin notices share a broad motif in which people or living beings
    derive from tree or plant substances.
  claim_level: same_motif
  target: Akawai/Makusi, Arawak, Saliva, Achagua, and Loku-daia plant-origin notices
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: 'The accounts vary in mechanism: creator action, human-bearing trees,
    self-identification as tree-trunk children, and transformation of a grave-tree
    into a rapid.'
- id: claim:3
  claim: The passage itself presents the Maipure and Tamanac traditions as similar
    accounts of flood survival and renewal through Mauritia fruits.
  claim_level: same_motif
  target: Maipure and Tamanac flood-survivor/Mauritia fruit accounts
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is reported in a compressed secondary summary and does
    not provide separate full Maipure and Tamanac variants.
