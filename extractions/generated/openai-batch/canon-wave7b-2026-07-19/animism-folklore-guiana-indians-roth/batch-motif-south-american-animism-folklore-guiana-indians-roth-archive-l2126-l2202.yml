canonical_text:
  quote: ''
  summary: The passage gives two related accounts of the Carib nation arising from
    serpent or water-camudi fragments after a snake lover or snake child is killed.
    It also summarizes several accounts in which humans or living beings originate
    from trees, wood, bark, fruits, tree trunks, or a mythic grave-tree, including
    a flood-survivor pair who regenerate people by throwing Mauritia fruits behind
    them.
  language: English with some Latin phrases
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the first account, watchers see Uamma come from under the woman, climb
    a tree, change into human form, shake down seeds, and become a snake again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The watchers cut Uamma into many pieces; the woman collects the fragments
    under mold and leaves, and each piece later grows into a Carib.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Caribs and Warraus live harmoniously for a time and exchange pieces of game
    or dainties by sending children between the groups.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The old mother of the Caribs tells them to kill a Warrau child in revenge
    for the killing of her snake lover; the Warraus kill a Carib child in return,
    producing a blood feud.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Carib version, a water-camudi has an Indian woman sweetheart, taking
    snake form by day and human-like form at night.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman bears a baby camudi, which appears near the river bank; her brothers
    spy on her at the stream and report what they see.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The father orders the snakes killed; the huge camudi is killed, and the baby
    serpent is taken into the bush and chopped into many small pieces.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: Fragments of the baby serpent grow into Indians occupying four houses; some
    want to kill the visiting brothers, but one house-master identifies them as uncles
    and prevents violence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old father visits the people grown from the snake fragments, recognizes
    them as numerous progeny, makes friends with them, and drinks paiwarri with them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Akawai and Makusi creation notice says Makunaima cut pieces from a large
    tree with a stone ax and threw them into the river, where they became animated
    beings.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Arawak notice says the Mighty One scattered twigs and bark from a silk-cotton
    tree into air, land, and water, and from these pieces arose birds, beasts, reptiles,
    fish, men, and women.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some Salivas are said to affirm that certain trees bore men and women as fruit
    and that these people were their ancestors.
  category: other
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Maipure and Tamanac notice says the earth was submerged in water, only
    a man and woman survived on Mount Tamanaku, and a voice instructed them to throw
    Mauritia fruits behind their shoulders; the man's fruits became men and the woman's
    fruits became women.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Achagua notice says they are children of tree trunks; the Loku-daia notice
    describes a mythic tree growing from a grave, associated with the root from which
    some Indians sprang and transformed into a rapid when cut down.
  category: sequence
  evidence_refs:
  - ev:9
