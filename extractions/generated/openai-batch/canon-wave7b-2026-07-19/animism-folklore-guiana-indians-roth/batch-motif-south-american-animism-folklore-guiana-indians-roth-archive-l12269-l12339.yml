canonical_text:
  quote: ''
  summary: 'A clever medicine-man named Makanauro discovers that carrion-crows and
    a vulture are stealing game from his traps. He disguises himself, captures the
    vulture, finds the bird is a woman, and marries her. His wife tests his abilities
    with difficult tasks: bringing water in a mesh basket, clearing a field that is
    restored at night by crows, and carving a bench with likenesses of a mother-in-law
    whose face he has not seen. Makanauro succeeds with help from ants and by tricking
    the old woman into looking up. He later produces abundant fish from a small parcel.'
  language: English
  quote_policy: summarized
