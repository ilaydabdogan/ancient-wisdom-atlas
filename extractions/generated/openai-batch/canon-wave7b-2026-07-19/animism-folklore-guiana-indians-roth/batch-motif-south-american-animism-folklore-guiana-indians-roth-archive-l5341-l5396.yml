canonical_text:
  quote: ''
  summary: 'A young woman escapes two Tigers in the bush: she prepares a palm-tree
    trap that kills the first Tiger, then cuts off the tail of a second Tiger who
    is imitating the sounds of tree-cutting to lure travelers. Her brothers initially
    disbelieve her account until she shows them the severed tail and the carcass.
    The next tale begins with a hunter who encounters fair-looking Vulture people
    in a bush house; they have removed their feathers and are dancing and singing.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young woman climbs a tree with six bunches of fruit, nicks the stalks
    of the bunches, coils herself in a young palm shoot, and sleeps there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Tiger scents the woman, climbs the palm, and repeatedly falls with fruit
    bunches after she cuts at the prepared nick; on the third attempt it falls onto
    pimplers and is impaled.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:8
- id: obs:3
  text: The woman fears the fallen Tiger may be pretending to be dead, but she descends
    after seeing its tongue hanging out.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another Tiger creates the sound of tree-cutting by hanging from a branch,
    whipping the trunk with its tail, and throwing twigs and leaves down to imitate
    a falling tree.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The woman comes upon the second Tiger from behind and cuts off its tail with
    a knife; the Tiger leaves howling in rage and pain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The woman later hears actual tree-cutting sounds, confirms they come from
    people, and rejoins her own people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Her brothers interrupt her account and say that no woman can do what she claims;
    she shows them the severed tail and the Tiger carcass, after which they believe
    her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The next story introduces three brothers, of whom the middle one is a good
    hunter, and says the story concerns him and his bird wife.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:9
  text: The hunter finds a large house in the bush where fair-looking people are sporting;
    the narrator identifies them as Vultures who have taken off their feathers.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:10
  text: The Vulture people are dancing and singing the makuan tune on musical instruments.
  category: action
  evidence_refs:
  - ev:11
