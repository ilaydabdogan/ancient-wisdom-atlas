canonical_text:
  quote: ''
  summary: The passage describes Kanaima as an invisible or personal avenging being
    linked with deaths, blood-revenge, animal or object forms, a waterfall escape
    story, possible connection with Rio Branco canaeme tribes, and piai-led diagnosis
    or divination to identify a human agent behind a death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kanaima is described as an evil invisible being and also sometimes as a particular
    personality who avenges a known or unknown injury; casualties are attributed to
    him.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes a Warrau thirst for vengeance that may be quenched only
    by the offender’s death or by annihilation of the offender’s family.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: At a waterfall on the upper Cotinga, Kanaima is said to have been pursued
    by a powerful Spirit, burrowed through an opening, and emerged on the opposite
    river bank ten or twelve miles away.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After emerging from the river bank, Kanaima is said to continue tormenting
    mankind.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The author suggests that the term Kanaima may have an origin in the reputation
    of Rio Branco tribes, transmitted by exchange and barter.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Certain tribes near the River Jauapiry and River Taruman-Assu are called canaemes
    or Kanaima tribes by upper Rio Branco Indians and are described as professional
    cut-throats involved in murder and theft.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The canaeme tribes are described as using victims’ tibias for flutes and victims’
    teeth for necklaces.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: An association of piais is reported among the canaeme tribes, and the tribes
    are described as allied or united.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: Kanaima may appear in animal form, and some Indians believe Kanaima animals
    are possessed by spirits of men devoted to bloodshed and cannibalism.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: A person may assume the form of a jaguar, or have his soul animate a jaguar,
    in order to kill and devour human beings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: 'The effects on a victim are used to infer Kanaima’s form: a striking blow
    indicates a tiger, while strangling indicates the camudi constrictor.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: Kanaima may also appear as a bird and may enter a person’s body as an insect,
    worm, or inanimate object.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: When a person dies, only the piai is said to know whether death was caused
    by an evil Spirit or by another Indian’s blood-revenge.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:14
  text: If a corpse has a blue spot or unusual mark, the piai may identify it as the
    place where the victim was wounded by an invisible poisoned arrow.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: Once Kanaima’s handiwork is recognized, retaliation is directed against the
    human agent rather than Kanaima himself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: Among the Arawaks, a pot with leaves and water is placed over a fire; the
    side on which boiling scum first falls is taken to point toward the murderer’s
    quarter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:17
  text: The passage begins a Makusi example in which a dead boy’s relatives seek the
    quarter to which the supposed Kanaima belonged, and the father cuts pieces from
    the corpse’s fingers, toes, and heels and places them in a new pot.
  category: sequence
  evidence_refs:
  - ev:8
