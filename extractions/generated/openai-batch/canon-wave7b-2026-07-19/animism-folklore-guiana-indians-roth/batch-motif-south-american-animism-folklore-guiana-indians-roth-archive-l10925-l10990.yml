canonical_text:
  quote: "“we Arawais would never accept a suitor for our daughter unless he gave
    us some proof that he was skilful in the chase”"
  summary: An Arawai narrator describes former marriage tests for a suitor, including
    hunting or work tasks. A young husband, living with his bride before completing
    the tests, fails to weave crab baskets and fails in the crab-gathering expedition.
    His bride helps her former lover instead, the father-in-law recognizes the skilled
    man as son-in-law, and the rejected husband returns to his mother with only a
    few crabs.
  language: English
  quote_policy: quoted
