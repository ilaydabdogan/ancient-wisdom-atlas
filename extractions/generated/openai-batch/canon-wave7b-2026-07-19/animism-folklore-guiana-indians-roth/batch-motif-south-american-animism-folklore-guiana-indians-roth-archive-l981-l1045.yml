canonical_text:
  quote: ''
  summary: 'The passage concludes an episode in which a family climbs into a large
    tree for a journey; the tree uproots and flies upward while Hariwali performs
    at its summit, but the piai''s sister returns for a forgotten apron and is changed
    into a wicisai-duck. It then begins the story of Haburi: two sisters encounter
    a manicole leaf that becomes the man Mayara-k6to, who fathers Haburi. Mayara-k6to
    later fishes in Tiger''s pond despite warning, is killed, and Tiger assumes his
    form. The women recognize the impostor by his voice, snoring, and naming, rescue
    Haburi from his arms with a bark substitute, and flee with a wax light and firewood.'
  language: English
  quote_policy: summarized
