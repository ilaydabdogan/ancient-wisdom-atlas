canonical_text:
  quote: ''
  summary: The passage describes customs of blowing upon people as greeting, charm,
    cure, protection, or disenchantment among several Guiana Indigenous groups, especially
    in relation to sickness, infants, departures, couvade, headache, and a menstruation
    ceremony. It then summarizes beliefs that a head spirit causes dreams when carried
    away by a bush spirit, that failure to return it may cause death, and that dreams
    may be understood as spirit journeys, real experiences, attacks by spirits or
    absent persons, or omens.
  language: English
  quote_policy: summarized
