canonical_text:
  quote: ''
  summary: Yar repeatedly performs marriage tasks under Nahakoboni, whose medicine
    makes cleared fields grow back; Hebii helps Yar clear the field, Nahakoboni plants
    it, and it bears ripe food overnight. Yar also rebuilds a house strongly enough
    to satisfy Nahakoboni. Later Yar, identified as the Sun, travels west and tells
    his pregnant wife to follow the right-hand track while avoiding feathers scattered
    on the left. Wind removes the feathers, the unborn child speaks and guides her,
    but after a wasp sting leads her to strike herself, the child thinks it has been
    hit and stops guiding her. Lost and exhausted, she reaches the house of Nanyobo,
    a frog-like old woman, who warns her not to put head insects in her mouth; the
    woman forgets, places a louse between her teeth, and dies.
  language: English
  quote_policy: summarized
