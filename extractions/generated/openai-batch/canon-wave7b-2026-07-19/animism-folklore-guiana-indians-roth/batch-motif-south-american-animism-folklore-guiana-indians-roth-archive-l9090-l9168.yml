canonical_text:
  quote: ''
  summary: A wife teaches her unsuccessful hunter husband to obtain game through a
    painful treatment with akura frog spawn, bathing, dietary preparation, and a graduated
    hunting regimen. The passage then describes hunter practices using irritating
    caterpillars, venomous ants, restrictions during recovery, and comparative bodily-stimulation
    practices involving children and future archery skill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man regularly goes hunting but brings nothing home, while his brothers-in-law
    seldom go out yet return with much game and share none with him or their sister.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The wife seeks a method, takes her husband to find akura frog spawn, and introduces
    spawn into his ears, eyes, nose, and mouth, causing burning, vomiting, rolling
    in sand, and then bathing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife obtains a small bow and arrows, sends him to shoot only small birds
    and no more than four, and prepares pepper-pot with few peppers and no salt; this
    is repeated for a week.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wife then has a larger bow and arrows made and instructs him to shoot
    larger birds for a week, followed by a stage in which he calls animals, points
    his arrow without shooting, and kills only one animal at the end of the day.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: At the beginning of the fourth week he is told to shoot everything he can;
    he brings home plenty, the couple no longer lacks food, and they barbecue and
    hide surplus while withholding from the wife’s brothers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the Pomeroon District, a hairy caterpillar may be rubbed into incisions
    on wrists and thighs, soaked in water for application to cuts, worn on the neck,
    or rubbed on chest and thighs to produce an irritating painful rash.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A hunter may mortify his flesh with living venomous ants held in a small mat
    and pressed against his chest so that the ants bite.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: While recovering from cuts and injuries, a Carib or Akawai hunter may be nursed
    by a woman past the climacteric, and he is forbidden sexual liberties with women.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage states that these procedures may seem like sacrifice or a free
    gift for favors, but says the evidence is negative and offers a possible physiological
    explanation involving sensory cleaning, diet, abstinence, frog slime, and pain-induced
    responsiveness.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage compares such stimulation to an Arawak mother using a tibi-tibi
    lizard and stinging ant to encourage an infant to walk, and mentions a Carib Island
    belief that flattened foreheads help children later fly arrows from tree-tops.
  category: action
  evidence_refs:
  - ev:7
