canonical_text:
  quote: ''
  summary: 'The passage describes several food-handling restrictions and taboos: men
    should not carry their own game or larger fish into the house; trap-killed animals
    must be cooked in a specified way; eating after nightfall is said among Arawaks
    to cause transformation into an animal; various groups observe restrictions on
    eating particular animals or introduced European foods; and some taboo meats may
    be made edible by a piai or old woman blowing on them to expel the animal spirit.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man who has caught game or larger fish is said not to bring it into the
    house himself, but to leave it outside for his wife or women-folk to fetch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated reason for the man not carrying the food directly home is that
    he would otherwise have bad luck in fishing or hunting next time.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Comparable reports in the passage describe women fetching game from the forest
    edge or the place where it fell, and fish from stream banks or the waterside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Among Pomeroon Arawaks, flesh from an animal killed by an arrow-trap or gun-trap
    is to be cooked in an uncovered pot over a fire that is not too large.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The cooking rule includes avoiding water boiling over.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: If the trap-kill cooking rules are not followed, the passage says the arrow
    or gun would no longer be useful and game of that kind would depart to another
    region.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that among Arawaks food in general was not allowed after
    nightfall.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: A person who ate after nightfall is said to be changed into an animal.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Children on the Amazons, especially females, are described as restricted from
    eating most game meat and fish except very small bony fish, with mandiocca-cake
    and fruits as principal food.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage says food taboos may apply to individuals because of a medicine-man's
    treatment, a wife's condition, or other reasons, rather than simply by tribal
    membership.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Several animal foods are listed as refused or avoided by different groups,
    including monkeys, armadillo, alligator, camudi, snakes, and large sea-turtles.
  category: object
  evidence_refs:
  - ev:6
- id: obs:12
  text: Introduced animals such as oxen, sheep or pigs, goats, and fowls are described
    as generally refused, but sometimes made eatable in necessity by ritual blowing.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage explains the blowing as apparently expelling the spirit of the
    animal about to be eaten.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: In Cayenne, people are said to avoid fowls and other birds because they imagine
    the animals would injure the stomach and intestines with beak and spurs.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Other examples include aversion to European pork, illness attributed to pork
    eating, fear that Trios would die because Europeans had eaten the same food, and
    old piais refusing European food.
  category: sequence
  evidence_refs:
  - ev:9
