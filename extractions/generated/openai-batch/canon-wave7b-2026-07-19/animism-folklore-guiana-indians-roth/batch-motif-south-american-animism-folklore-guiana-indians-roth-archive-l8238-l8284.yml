canonical_text:
  quote: ''
  summary: The passage describes the Pleiades or Seven Stars as an important seasonal
    marker for Guiana Indians, especially for the new year. It notes constellation
    legends involving amputated limbs, including a one-legged huntsman who ascends
    to the heavens. It then gives a Seven Stars legend in which a man murders his
    brother, takes the widow, traps her and her child in a tree-root hole, receives
    instructions from the murdered brother's spirit, and scatters the entrails, which
    rise to become the Seven Stars and mark a season of abundant river fish.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Pleiades, identified as the Seven Stars, are said to have an important
    role because their rising in the east marks the beginning of the new year.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that legends concerning Taurus and Orion share the detail
    of an amputated arm or leg.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the Mabukuli story, an unsuccessful huntsman cuts off one of his own legs,
    gives it to his stepmother as game, and ascends into the heavens as the one-legged
    Mabukuli or Ibbeh-pughn.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Seven Stars legend, a man desiring his brother's wife kills his brother
    while hunting, cuts off an arm, presents it to the widow as proof of death, and
    takes her as wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The murdered man's spirit haunts a nearby tree and laments at night, leading
    the widow to discover the treachery.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The murderer takes the widow and her child to hunt, tells her to look into
    a hole at the root of a large tree, pushes both her and the child in, and stops
    up the hole.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The murdered man's spirit tells the murderer that the widow has been transformed
    into an acouri and the child into an adourie.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The spirit says it will continue to make the murderer's life miserable while
    the mangled body remains unburied, but instructs him to disembowel the body, scatter
    the entrails, and bury the rest.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the murderer follows the instructions, the entrails float upward to
    the sky and become the Seven Stars.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The annual appearance of the Seven Stars is linked with abundance of several
    named fish in the rivers.
  category: relationship
  evidence_refs:
