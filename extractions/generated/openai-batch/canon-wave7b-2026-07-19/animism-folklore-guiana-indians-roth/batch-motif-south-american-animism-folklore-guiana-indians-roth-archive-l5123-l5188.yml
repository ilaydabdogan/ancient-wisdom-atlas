  text: A man goes hunting while his wife remains at home preparing food and caring
    for their small daughter.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Tiger assumes the exact form of an old grandmother, asks for the child,
    receives her from the mother, and then denies knowing anything about the child.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The parents search for the missing child, fail to find her, eventually stop
    searching, and after time forget her.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Household items and ornaments disappear from the parents' house at night,
