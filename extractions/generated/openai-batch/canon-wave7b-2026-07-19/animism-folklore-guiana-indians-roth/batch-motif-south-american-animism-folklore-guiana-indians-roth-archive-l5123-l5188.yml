    brothers.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: During the hurried departure, a young male cousin puts a grindstone in his
    hammock, slings it over his shoulder, breaks his back from the unexpected weight,
    dies, and is left behind.
  category: sequence
  evidence_refs:
  - ev:8
