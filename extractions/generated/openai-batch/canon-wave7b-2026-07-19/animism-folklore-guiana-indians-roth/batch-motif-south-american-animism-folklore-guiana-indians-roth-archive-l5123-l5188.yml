canonical_text:
  quote: ''
  summary: A Tiger assumes the form of an old grandmother and tricks a mother into
    handing over her little daughter. The parents fail to find the child, who is raised
    by Tiger in the forest. After she matures, she learns where her parents live,
    kills Tiger by spilling boiling food over him, returns to her family, and urges
    them to flee from Tiger's brothers. During the hurried flight, a cousin dies after
    trying to carry a grindstone in his hammock.
  language: English
  quote_policy: summarized
