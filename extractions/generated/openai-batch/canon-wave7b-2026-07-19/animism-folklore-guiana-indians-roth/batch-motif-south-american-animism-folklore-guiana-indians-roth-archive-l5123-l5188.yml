  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tiger keeps the girl in the forest, treats her as kin, provides her with meat,
    and she grows into a young woman.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: When the girl reaches menstruation, Tiger licks the blood; Tiger and his two
    brothers behave toward her in animal-like ways that she does not understand.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The young woman asks Tiger where her parents live, and he tells her the direction
    while warning that after his death she must hurry away before his brothers meet
    and tear her up.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The young woman cooks food in a large buck-pot over the fire, pretends that
    it is too hot and heavy, and asks Tiger to help lift it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: While Tiger lifts the pot, the young woman tips the boiling contents onto
    his face; Tiger falls, cries out in pain, and dies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tiger's two brothers hear the roaring but misinterpret it and do not immediately
    intervene.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The young woman returns to the place where her parents live, identifies herself
