canonical_text:
  quote: ''
  summary: The passage describes Guiana and neighboring Amazonian beliefs that bush
    or forest spirits can cause a person to lose the forest path, harm crops, provoke
    disputes, cause sickness or death, and punish transgressions. It records Carib
    use of a string puzzle left on a path to distract a bush spirit, compares it with
    a lower Amazon palm-leaf charm against Curupari, and gives a Carib narrative explaining
    children's unexplained sickness or crying through an invisible weapon associated
    with Yurokon retaliation. It also notes Arawak belief in the Spirit's Arrow, Cayenne
    accounts of Hyorokon and Chinay causing disease, reluctance to interfere with
    a spirit-caused drowning, and cures directed through a piai by driving spirits
    out with presents.
  language: English
  quote_policy: summarized
