canonical_text:
  quote: ''
  summary: The passage concludes a tale in which a young widow persistently attaches
    herself to successive brothers-in-law; during honey gathering, after her warning
    that something strange is about to happen, Tiger creatures kill the men. It then
    gives a Warrau story of a little boy who survives a Carib cannibal attack on women
    gathering wild pineapple by hiding in a tree, using a broken-arrow charm for bravery,
    and escaping in a corial. The passage then lists animal omens and divinatory signs
    concerning sickness, death, a child's sex, and bat familiar spirits.
  language: English
  quote_policy: summarized
