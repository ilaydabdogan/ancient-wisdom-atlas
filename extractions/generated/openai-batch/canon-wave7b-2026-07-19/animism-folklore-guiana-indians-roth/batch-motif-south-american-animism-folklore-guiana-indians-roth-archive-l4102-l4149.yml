canonical_text:
  quote: They were thus punished for taking food which did not belong to them.
  summary: Twenty hunters find prepared food while tracking bush-hog. Most eat it,
    while two refuse because it is not theirs. At night the Hebu blinds the eighteen
    who ate. The two uninjured men later lead the blind men to a pond of voracious
    fish, where the blind men are killed. The passage states that this punishment
    came because they took food that did not belong to them.
  language: English
  quote_policy: quoted
