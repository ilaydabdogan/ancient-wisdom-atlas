canonical_text:
  quote: ''
  summary: The passage records mourning addresses to a dead child, several Guiana
    burial and mourning practices, ritual actions performed at Makusi deaths, regional
    lament formulas directed to corpses, dances for the dead, and the placement of
    weapons with deceased persons for vengeance or protection in the spirit world
    or passage to another world. A note states uncertainty about the meaning of shouting
    into corpses' ears and mentions an analogous North Queensland practice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker addresses a dead child, says the child was warned not to eat sand,
    says the sand has killed the child, and places the child's arrow and bow by the
    child's side for amusement.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother of the dead child cries and chants that she bore and nourished
    the child, made garments, cared for and fed the child, and asks the child not
    to bring evil upon her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The father addresses the dead boy, says he had warned him about sand, mentions
    obtaining a coffin and making a grave in a pleasant place, and says he will put
    sand with the child because it can no longer harm him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: At a Makusi woman's burial, women around the hammock containing the corpse
    chant eulogies concerning the deceased and her possessions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the same Makusi burial, a piai goes to the head of the corpse, shouts into
    the left ear, later exposes the face, spits on it, plugs hair into the ears and
    mouth, continues spitting, and addresses the corpse harshly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At the death of another Makusi woman from snake bite, the village women gather
    in the hut and shout unintelligible words into the corpse's ears.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Warrau women on the Moruca River sit in a circle around the grave and repeatedly
    sing mourning questions about why the deceased left family, friends, home, field,
    and food-providing activities.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Island Carib women address a corpse with questions about why the person is
    dead and whether life or cassava had been insufficient.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: In Cayenne, mourners, especially nearest female relatives, sing while passing
    both hands over the corpse from head to foot and reproach the deceased for dying
    while praising skills such as hunting, fishing, catching crabs, and making a provision-field.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the Orinoco, Saliva mourners eulogize the deceased as an excellent fisherman
    and a clever archer.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Arawak Makuari and Hauyari dances are described as special feasts and festivals
    for deceased males and females respectively.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In the far western Guianas, Mask dances are said to propitiate the spirit
    of the dead so that it will not return to fetch one of the survivors.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: When an Akawai death is thought to have resulted from unfair means, the deceased
    person's knife is buried with him so he may avenge himself in the world of spirits.
  category: object
  evidence_refs:
  - ev:10
- id: obs:14
  text: In similar circumstances, Warrau place a bow and arrows beside a dead man
    so he can keep off malignant spirits during passage to the other world.
  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: 'A note states that the meaning of shouting into the ears is uncertain: the
    address may be to the deceased or to a mischievous spirit causing the death.'
  category: other
  evidence_refs:
  - ev:11
