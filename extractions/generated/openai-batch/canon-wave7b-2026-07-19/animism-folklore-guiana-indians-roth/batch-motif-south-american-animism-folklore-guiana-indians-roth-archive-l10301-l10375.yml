literal_observations:
- id: obs:1
  text: Among nations bordering the Amazon, the passage says the Indians are entirely
    nude and that covering the parts regarded by Europeans as shameful is treated
    as a sign of coming misfortune or death within the year.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Island Caribs are reported to have rebuked European visitors who laughed at
    their nudity by telling them to look only at their faces.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: During curare poison manufacture, women and young girls are not allowed to
    be present, and later testimony adds that women, especially pregnant women and
    maids, must not come near the house.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: The shed where the poison has been boiled is pronounced polluted and abandoned,
    and the boiling pot must be new and previously unused.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The poison-maker must fast during the operation, avoid the vapor, and may
    be regarded as sick afterward; another cited belief links the poison's virulence
    to the maker's hunger.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Water for poison-making is fetched from a distant stream and rested on the
    ground every few yards; a wounded bird is believed to fly only as far as the water
    was carried without rest.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: A personal name is described as part of the individual, so that mentioning
    it in the person's presence can have serious consequences and put the person in
    the speaker's power.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: People may be addressed by kin terms, partial names, nicknames, or distinct
    names for different audiences; the real name is not divulged, and the name of
    the dead must not be mentioned.
  category: speech
  evidence_refs:
  - ev:7
