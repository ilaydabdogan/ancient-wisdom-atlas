canonical_text:
  quote: ''
  summary: 'Ethnographic notes report Guiana and neighboring Indigenous beliefs about
    several animals: the jassi armadillo in death songs and remedies; a skunk-like
    animal whose odor overpowers enemies; anteaters connected with the forest demon
    Cunipira; sloth, tortoise, alligator, and gecko beliefs; and multiple serpent
    associations with sexuality, human origins, everlasting life, dances, rain, and
    a water-dwelling camudi called water-mamma.'
  language: English
  quote_policy: summarized
