canonical_text:
  quote: ''
  summary: A party of married Arawak men is murdered. One widow does not remarry.
    At night she hears her dead husband’s flute approaching by river, and his Spirit
    comes home, asks for a hammock, and complains of dog-fleas. A fire-stick reveals
    worms on him, so she recognizes him as Spirit rather than Body. She creates a
    pool of spittle that answers him while she flees. He follows, but she hides in
    an armadillo hole. The Spirit says he is dead and will make her dead too. She
    reaches another settlement, tells what happened, then becomes sick and dies.
  language: English
  quote_policy: summarized
