canonical_text:
  quote: ''
  summary: 'The passage surveys Guiana and neighboring Indigenous funerary practices:
    grave goods intended for use by the deceased, thongs or whips connected with death
    rites, animal and human companions or servants killed or buried with the dead,
    food, water, weapons, and ornaments placed in graves, measures meant to keep spirits
    in graves, and the ingestion of human remains or preparations made from them to
    transfer qualities of the dead to the living.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A male Makusi at Pirari was buried with his knife and several thongs; the
    thongs were placed in the grave so that he could tie to a tree the kanaima said
    to have caused his death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At a Roucouyenne festival in honor of the dead, a man holds and cracks an
    eight-meter whip, after which others also crack the whip.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At a corresponding Arawak festival, performers use whips on one another, sometimes
    causing serious wounds, and put their legs forward like a white crane or stork
    while masters-of-ceremony carry a wooden effigy of the bird.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that future provision for a deceased person may include
    burial with a dog, women, slaves, food, hunting and fighting implements, and ornaments.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: In cited examples, a hunting dog may be killed and placed with the deceased,
    or buried to guard him and watch those who caused his death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: In cited Island Carib examples, a slave may be killed in order to serve the
    deceased master in the other world.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: In cited examples, a wife may be placed beside the deceased to look after
    and accompany him, and on the upper Amazon a young infant may be buried alive
    with a dead mother.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Food, fruits, bread, dried fish, water, drinking vessels, cassava, bananas,
    and a vessel connected with stimulating the deceased on travels in the other world
    are listed among grave provisions.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Weapons, hunting equipment, war implements, bracelets, tobacco bags, ornaments,
    feather crowns, collars, combs, flutes, and other trinkets are listed as items
    buried with or placed on the dead.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some groups bury the dead in the hut where they lived, or build a palm-leaf-covered
    shed over a grave during a journey.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: Certain Pomeroon Arawaks are said to plant cassava or place a cassava-squeezer
    on a grave to give the spirit or spirits no cause to come out of it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage interprets eating corpse flesh or drinking a preparation made
    from it as tied to belief in spirit immortality and to a belief that qualities,
    somethings, or spirits of the deceased can be transferred to the living by ingestion.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: The upper Pomeroon Caribs are described as cutting out the heart of a slain
    person, drying it over fire, powdering it, and mixing the powder into a drink
    to strengthen courage and contempt for death.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Tarianas and Tucanos of the Uaupes River are described as disinterring
    a decomposed corpse, heating it over fire, pounding the remaining mass into powder,
    mixing it into caxiri, and drinking it with the belief that the deceased's virtues
    are transmitted to the drinkers.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Salivas on the Orinoco are described as digging up bones, burning them,
    collecting the ashes, and mixing the ashes with drinking water.
  category: sequence
  evidence_refs:
  - ev:11
