canonical_text:
  quote: ''
  summary: The passage recounts several exploits of Konehu. He deceives a traveler
    eating kokerite nuts, causing the traveler to injure himself fatally by imitation.
    He obtains a man's yams through a false promise of resale, then tricks the same
    man with pepper-pot and a false claim about cutting his wife's breast, leading
    the man to kill his own wife. Konehu also outwits a wealthy head-man who boasts
    of being cleverer than him by pretending that dung under a troolie palm cap is
    a captured bird, taking the man's weapons and going to his house while the head-man
    waits.
  language: English
  quote_policy: summarized
