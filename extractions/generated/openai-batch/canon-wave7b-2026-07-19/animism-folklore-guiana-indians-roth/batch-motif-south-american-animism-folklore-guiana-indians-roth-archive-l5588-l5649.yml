  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The surviving boy reaches his old home and tells his parents that the Tiger
    devoured his brother.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: A champion tiger killer refuses to act at first, saying the father caused
    the boys' vexation and therefore has a duty to act.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The father gives the champion a greenish stone as a present and agrees to
