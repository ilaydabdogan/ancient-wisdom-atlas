canonical_text:
  quote: ''
  summary: Two boys leave home after their father scolds them, live in a swamp house,
    encounter death omens, and are attacked by a Tiger. The elder brother is killed
    and eaten; the younger survives by hiding, ritually beats himself with a broken
    arrow for strength, and returns home. A champion tiger killer, after receiving
    a greenish stone from the father, accompanies him to the Tiger's lair, kills the
    Tiger, recovers the dead boy's flesh for burial, and declares the death revenged.
  language: English
  quote_policy: summarized
