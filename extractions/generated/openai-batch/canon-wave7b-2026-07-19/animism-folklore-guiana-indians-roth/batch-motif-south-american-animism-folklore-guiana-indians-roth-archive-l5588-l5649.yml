  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brothers understand the Hebu as a spirit from a grave and as another token
    of impending doom.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A Tiger enters after the Hebu leaves, pulls down the elder brother from the
