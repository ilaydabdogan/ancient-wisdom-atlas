canonical_text:
  quote: ''
  summary: The passage introduces a chapter on forest animals in Guiana Indian tales,
    emphasizing that beasts and birds are represented as thinking, speaking, acting,
    and possessing spirits like humans. It explains traditions in which Makunaima
    made humans and animals of one speech, animal and human forms may be interchangeable
    through punishment, departed spirits, medicine-men, or lunar eclipses, and animals
    associate with humans as members of the same broad kind. The passage then begins
    the Warrau tale “The Honey-bee Son-in-law,” in which a man takes two sons and
    a daughter on a hunting expedition into the bush while leaving his wife and two
    other daughters at home.
  language: English
  quote_policy: summarized
