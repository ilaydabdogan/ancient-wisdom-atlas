canonical_text:
  quote: ''
  summary: An ethnographic note reports beliefs about imbeciles as uncanny, close
    to good Spirits, and oracular, then gives a Warrau tale about Wabassi, a man without
    good sense who mistakes tigers for familiar animals or prey and later dresses
    like a bird, climbs a tree, falls, and claims he can fly. A following note states
    that handling certain birds' feathers causes loss of memory and insanity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The introductory note connects the passage with an idea that at least one
    of an individual's spirits may be located in the head.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among the Wapisiana on the Takutu River, imbeciles are said to be regarded
    with awe because traditions place them in close intimacy with good Spirits, and
    their words and actions are considered signs of divinity or oracular.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that imbeciles are also regarded as uncanny and may perform
    deeds with impunity and success that people in their right senses would not attempt.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Wabassi is introduced as a man with a sister and mother who is without good
    sense; his name is glossed as meaning a sickly person.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Wabassi's sister has a dog named Warribisi, glossed as meaning a wasp.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: At the seashore, Wabassi sees an immense tiger, thinks it is his sister's
    dog, calls it Warribisi, and tries to pull it into his boat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After Wabassi reports seeing the dog, his sister says the dog had been with
    her the entire time and tells him he cannot be in his right senses.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: On a hunting expedition, Wabassi shoots what he describes as a different bush-hog;
    the other hunters recognize it as a tiger and note that he has not received a
    scratch.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wabassi dresses like a bird with a feather behind his belt, climbs a high
    tree, jumps between limbs, falls when a dry limb breaks, and says he can fly splendidly.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A following note states that picking up or handling certain birds' feathers
    conduces to loss of memory and insanity.
  category: relationship
  evidence_refs:
  - ev:7
