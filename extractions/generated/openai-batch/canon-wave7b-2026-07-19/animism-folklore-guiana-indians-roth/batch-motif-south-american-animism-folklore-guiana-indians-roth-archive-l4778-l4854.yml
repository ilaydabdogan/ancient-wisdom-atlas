canonical_text:
  quote: ''
  summary: Two hunting brothers hear revelry in the forest and visit what appears
    to be a drinking party, though the younger suspects spirits. The hosts are revealed
    as Warekki rain-frog spirits in human form. After the elder drinks, he later has
    the younger build a great fire, allows his legs to burn, sharpens his exposed
    shin-bones into points, and uses them to spear small animals. The younger cares
    for him but is threatened and escapes by lying. The elder pursues, mistakes a
    deer trail for his brother's trail, kills the deer with his bone points, and only
    afterward realizes it is not his brother.
  language: English
  quote_policy: summarized
