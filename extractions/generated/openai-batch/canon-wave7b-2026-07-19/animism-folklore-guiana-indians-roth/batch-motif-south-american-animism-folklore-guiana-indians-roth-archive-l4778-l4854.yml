  evidence_refs:
  - ev:2
- id: obs:5
  text: At night the brothers make a banab, light a fire, and sling their hammocks.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The elder repeatedly tells the younger to add more wood until an immense fire
    is blazing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The younger smells a strong odor and sees the elder's legs hanging from the
    hammock close over the fire; he warns him that the legs are being scorched.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The elder withdraws his feet after an exclamation, but later puts them back
    into danger and ignores further warning.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The elder's lower limbs become charred; both feet are gone and much of the
    flesh around the shin-bones is destroyed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The elder cleans off the remaining flesh and scrapes both shin-bones to sharp
    points with a knife.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The elder lies helpless in his hammock but can spear passing birds or small
    animals with the pointed tip of a leg.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The younger sometimes carries the elder to a bullet tree and shakes branches
    so that fruit falls for him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The younger also shoots small birds for the elder, causing feathered game
    nearby to become scarce.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: The sick elder keeps calling the younger back and threatens to kill him if
    he goes out of sight.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:15
  text: The younger lies that his arrow is stuck in a tree and uses the excuse to
    get away.
  category: action
  evidence_refs:
  - ev:6
- id: obs:16
  text: The elder waits, calls, shouts, and screams, then leaves the hammock and starts
    in pursuit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: With his bone points the elder can travel faster than before on his feet.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:18
  text: The elder starts a deer, mistakes the deer's trail for his brother's, and
    pins the deer to the ground with his bone points.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: While killing the deer, the elder apologizes to it as if it were his brother
    and blames it for trying to run away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:20
  text: After examining the carcass, counting digits, and comparing them with his
