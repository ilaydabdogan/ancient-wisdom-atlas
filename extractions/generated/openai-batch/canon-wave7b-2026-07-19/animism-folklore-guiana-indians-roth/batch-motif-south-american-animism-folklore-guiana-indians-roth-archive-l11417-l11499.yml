canonical_text:
  quote: ''
  summary: The passage first records Arawak explanations for birth-marks, moles, and
    a body spot. It then introduces a chapter on the medicine-man, listing his status,
    paraphernalia, office, powers, and healing functions. The main section states
    that medicine-men believed in their own practices, used incantations for themselves
    and their families, held roles such as doctor, augur, rain-maker, spell-binder,
    secret-society leader, and guardian of tradition and wisdom, and were known by
    various terms among neighboring peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Arawaks are said to believe that birth-marks and moles are caused by a pregnant
    mother's failure to obtain something she wanted.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage gives an example in which a mother wants a bit of marudi, places
    her hand on a body part, and the baby is born with a corresponding mark on that
    part.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Arawak women are said to regard the so-called Mongohan spot as caused by the
    afterbirth being near the surface at the corresponding part of the mother's body.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Moruca River Arawaks are said to call the spot tvr-tebe, and when it begins
    to fade it is called anakwarro.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The chapter outline states that medicine-men practise what they preach, are
    respected and feared both alive and dead, may receive offerings, and do not necessarily
    hold a distinct office such as tribal captain.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The chapter outline lists medicine-man insignia and paraphernalia: a bench,
    rattle, doll or manikin, quartz crystals, and miscellaneous kickshaws.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:7
  text: The chapter outline lists topics including hereditary office, female doctors,
