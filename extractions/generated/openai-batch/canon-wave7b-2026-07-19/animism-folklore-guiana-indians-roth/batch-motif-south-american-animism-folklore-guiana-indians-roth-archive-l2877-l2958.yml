canonical_text:
  quote: ''
  summary: 'The passage describes several Guiana mortuary customs: exhuming and processing
    bones, drinking ashes mixed with vicou, distributing or housing bones, abandoning
    or burning places associated with death, restrictions near graves of ritual specialists,
    placing weights on the eyes of the dead, and a Warrau mourning procedure after
    a woman''s death.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Some groups inland from Cayenne disinter bones after bodily decay, calcine
    them, and drink the ashes mixed with vicou, regarding this as a more honorable
    burial than leaving the dead to worms and corruption.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that bones of the deceased distributed among friends or
    hung in houses may have served a purpose beyond ordinary gifts or ornaments; he
    adds that Island Caribs used friends' bones for witchcraft and prophecy.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: In one described practice, after a year the decomposed body is dug up and
    the bones are distributed to friends and acquaintances.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Among Warraus of the Orinoco, bones cleaned by fish are packed by size in
    a bead-worked basket, with the skull forming the lid, and the basket is hung from
    the house roof among baskets containing ancestors' bones.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among Caribs of the upper Pomeroon, women who prepare the bones are considered
    unclean for several months.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage attributes abandonment of a death locality to fear that the deceased's
    spirit remains nearby and might harm survivors.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the Orinoco, fields planted by the deceased may be rooted up after burial;
    the explanation given is that this destroys memory of the deceased.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among the Anabali and other Orinoco tribes, the dead may be buried at the
    place of the hearth, the grave covered with mats, and the village and fields abandoned
    for a new settlement at a distance.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Other examples describe breaking up the deceased's home, burning possessions
    or houses, and abandoning settlements after a death.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Among Roucouyennes, common people must not make noise or approach the grave
    of a piai because of fear of a Tiger medicine-man guarding the corpse, while distinguished
    dead may be visited for consultation by doctors, common people, and animals.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Island Caribs are described as placing two weights on the eyes of the deceased
    so that he may not see his parents and make them ill.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: In a Warrau procedure after the death of a woman, the husband lies in front
    of her briefly while weeping and singing, and then each person who had connection
    with her does the same.
  category: sequence
  evidence_refs:
  - ev:9
