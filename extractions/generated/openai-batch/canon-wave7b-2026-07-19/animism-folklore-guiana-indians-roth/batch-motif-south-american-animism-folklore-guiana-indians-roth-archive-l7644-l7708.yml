canonical_text:
  quote: ''
  summary: A Warrau man takes a wife from the Water People. She leads him below the
    water to her father’s house, where he is received and given obligations. She warns
    him not to send her to the menstrual out-house during moon-sickness, but Warrau
    women force the custom and she dies. Her father declares that sickness, accident,
    and death will come from the Water People, and that moon-sick women traveling
    on water may have their life-essence drawn out. Later the man and others go to
    sea in two canoes; the Water People shoot the canoes, sink them, and have sharks
    tear the bodies. The tale explains Water People punishment and the origin of accidents
    and death among Warraus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man goes fishing, wishes for a wife from the Water People, and a Water Spirit
    woman appears above the water, asks if he would take her home, enters his corial,
    and goes with him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Water Spirit wife tells the man to boil rather than roast the morokot
    fish and says that in the future he must bring animals and birds for her to eat,
    not fish.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The wife goes into the water, returns with a message that her father would
    welcome the man below, and reassures the man that no harm will happen.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Before leading the man below, the wife seizes the head of a big water-camudi
    and clamps its jaws on the gunwale as if tying the boat with a rope.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The man sinks below the surface, shuts and opens his eyes, and finds himself
    in the house of his father-in-law.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The father-in-law gives the man a bench to sit on, described as really a large
    live alligator; the narrator connects this with Warrau use of benches carved like
    alligators.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The father-in-law says he sent his daughter to be the man’s wife, instructs
    him to live well, and asks him to send his sister down for the father’s son.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The Water Spirit wife warns that when she is moon-sick she must remain in
    the hut with the man and must not be sent to the naibo-manoko, or she will die
    and her father will send sickness and death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Warrau women insist that the wife go to the naibo-manoko when she becomes
    moon-sick; the next morning she is found dead there.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Her body is placed in a hollowed piece of ite palm on a babracote under a
    banab, with an editorial comparison to Orinoco Warrau treatment of the dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The widower returns to the underwater house, sees his dead wife, and hears
    her father accuse him of killing her by not obeying her instructions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The father declares that sickness, accident, and death will come among the
    man’s people from the Water People and that moon-sick women traveling on water
    will have their shadows drawn.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: The man and his companions later go to sea in two large canoes, and the Water
    People at the bottom shoot the canoes with round-knobbed arrows so that both boats
    sink.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Water People put one canoe on each side of the old man’s house and release
    sharks, which are described as kept like dogs and which tear the dead occupants’
    bodies to pieces.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: The passage states that before these events Warraus had no accidents or death,
    only moon-sickness, and that the Water People punished the Warraus in this way.
  category: speech
  evidence_refs:
  - ev:7
