canonical_text:
  quote: ''
  summary: The passage describes Island Carib beliefs and practices concerning Familiar
    Spirits, including personal spirits called Icheiri or Chemin, offerings, invocation
    by a medicine-man, oracular replies, use of bones and effigies in prophecy and
    witchcraft, spirit speech through women, appeasement practices, and a comparison
    with Island Arawak Cemi or Zemi spirits and effigies.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Island Carib, good spirits or gods were called Icheiri by men and
    Chemin by women; each person was said to have a special familiar spirit, and these
    spirits were said to reside in the sky.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Island Caribs were described as having no temples, altars, or sacrifices
    for these divinities, but they made offerings of cassava, first fruits, and ouicou,
    especially after a cure from illness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Offerings called anacri were placed in vessels on small plaited tables at
    one end of the hut and were described as presentations not accompanied by adoration
    or prayer.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Invocation of the Familiar Spirits required the Boye or medicine-man, incantations,
    and tobacco smoke.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The spirits were invoked for revenge, curing illness and learning its outcome,
    consulting on wars, and driving away the Evil Spirit Maboya.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the Boye made his Familiar Spirit appear, the spirit was heard to answer
    questions and to make eating and drinking sounds, although the offerings were
    found untouched the next morning.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Food and drink believed to have been soiled by the spirits were considered
    sacred and were restricted to old men and illustrious persons under conditions
    of bodily cleanliness.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Familiar Spirits were said to nestle inside bones taken from a grave, wrapped
    with cotton into grotesque figures, and to give oracles through them.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hair or bones of deceased parents were sometimes kept in a calabash in huts
    and used for sorcery; the spirit of the dead was said to speak through these remains
    and forewarn of enemies' designs.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Bones prepared with cotton and wrapped with something belonging to an enemy
    were used by sorcerers for bewitching enemies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Familiar Spirits were also said to enter female bodies and speak through them.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: To divert the anger of these spirits, tobacco leaves were smoked through the
    agency of Boyes, likenesses were painted on canoes, and small embossed effigies
    were worn around the neck.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The Island Arawak were described as having supernatural beings or spirits
    and effigies known as Cemi or Zemi; a quoted account describes houses apart from
    the village containing wooden images called Cemis used for ceremony and prayer.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage states that similar Familiar Spirits were found among the Island
    Arawak and that belief in such spirits was traceable on the Guiana mainland.
  category: relationship
  evidence_refs:
  - ev:10
