canonical_text:
  quote: ''
  summary: 'The passage describes curing procedures attributed to a Guiana piai or
    medicine-man: invocation and interrogation of spirits, smoking and dreaming to
    identify the sender of sickness and the cure, dietary and fire restrictions for
    the patient, postponement when rain falls, and a Pomeroon Carib night ceremony
    involving a leaf shelter, songs, tobacco smoke, a maraka, helper spirits, harmful
    spirits, removal or return of disease, and a final appeal to Tiger.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: During the medicine-man's procedure, two voices may be heard, and the medicine-man
    is described as reproducing modulations of voice and speech associated with possible
    spirits.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The medicine-man does not know beforehand which spirit or agent caused the
    mischief, so he invokes and interrogates each one.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After extended invocation, ritual objects are put away in a specially constructed
    pegall.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The medicine-man sits on a divining stool, smokes, and dreams.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the dream, the medicine-man discovers who sent the sickness, whether the
    illness is due to a dead person's spirit, a living person's spirit, or the Water
    Spirit, and what cure is required.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The next morning, the medicine-man gives information to the patient or friends
    after receiving payment beyond the original fee.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Possible cures include extracting evil by suction or leaving a serious disease
    to the spirits alone.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The medicine-man gives dietary directions for the patient and relatives, including
    rules against altering the prescribed food, rules for cooking with the doctor's
    fire or a specially made fire, and a rule that the pot must not boil over.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: If the patient does not improve, the medicine-man may repeat smoking, singing,
    and dreaming on later nights and address the spirit that caused the harm.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: When rain falls during treatment, the proceedings are postponed until the
    following evening.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Among Pomeroon Caribs on the Manawarin River, the curing procedure observed
    by the narrator occurred at night with the piai seated in a small temporary cone-shaped
    structure of manicole leaves and using a rattle.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Pomeroon procedure begins with invocation of four particular spirits by
    different songs, tobacco smoke, and shaking the maraka.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The first spirit is said to be called by the medicine-man, and that spirit
    invokes the second, continuing the sequence.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Makai-abani remains in the maraka and comes out only when it is shaken, enveloping
    himself in tobacco smoke.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The four invoked spirits are described as good spirits, friends of the piai,
    male and female like people, and originating from the bodies of old-time medicine-men.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:16
  text: The four good spirits tell whether the disease was sent by another spirit
    or by another piai at an enemy's instigation.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: Three evil spirits are said to send sickness, ill-luck, and other calamities;
    they are associated with Cloudland and Water and have a master named No-sono.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:18
  text: If disease was sent by a bad spirit, the piai has Mawari take it far away
    to the Orinoco River; if it was sent by another piai, the present piai sends it
    back to him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:19
  text: If sickness remains stubborn, Tiger is called; when Tiger's voice is heard,
    the disease comes out and is devoured, but if Tiger fails the patient cannot be
    saved.
  category: sequence
  evidence_refs:
  - ev:10
