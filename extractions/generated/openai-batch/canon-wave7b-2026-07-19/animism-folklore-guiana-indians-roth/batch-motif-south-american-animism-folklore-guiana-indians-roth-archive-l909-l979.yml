canonical_text:
  quote: ''
  summary: Hariwali punishes two wives by transforming one into a hawk and the other
    into the first porpoise after a turtle omen at a cooking fire. He then causes
    his brother's hunting failure, which leads the brother to an island and to the
    Yawahu's Spirit house, where the Yawahu removes most of his bones and keeps him
    in a hammock. Moved by his mother's grief, Hariwali prepares with rattle, spirit
    friends, parrots, and a rapidly grown medicinal tree, then rescues his brother.
    Pursued by the Yawahu and dogs, the brothers hide in an armadillo hole; Hariwali
    turns the Yawahu's probing stick into a bush-master snake and restores his brother's
    bones.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hariwali asks both women to accompany him to a pond, saying he wants them
    to cook and make the fire while he fishes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A turtle placed alive on the hot aabee crawls off repeatedly; the passage
    identifies this as an omen betokening the women's death and says they had been
    bewitched into thinking the turtle was already killed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The faithless spouse goes to break dry wood, utters the phrase Tata—Ketaiaba,
    and immediately flies away as a hawk called the bul-tata; the passage states her
    husband caused this.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The other wife says she is hot, bathes in the pond, and is turned by her husband
    into the first porpoise in those waters.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hariwali causes his brother's arrows to miss birds repeatedly during a hunt.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the brother barely hits a bird, the bird speaks and tells him to look
    behind; he sees a large sheet of water and realizes he is on an island.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The brother finds a Yawahu's path leading to the Spirit's house.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Yawahu removes all of the brother's bones except the finger bones, places
    him in a hammock, and ties the bones in a bundle under the roof.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Yawahu's youngsters practice with bows and arrows and sharpen blunted
    arrows on the captive's bony fingertips.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hariwali's mother cries nightly over her absent son, not knowing where he
    is or what condition he is in.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Hariwali decides to fetch his brother home, and the passage states that his
    medicine had caused the brother to fall into the Spirits' clutches.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Hariwali tells the old woman to pack everything because, after he returns
    with his brother, the family must leave the place forever.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: On the night before departure, Hariwali plays the ehakshak rattle to call
    his Spirit friends, and parrots pass overhead the next morning.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Hariwali asks the birds for a seed of a tree whose bark he uses medicinally;
    they drop the seed, and he conceals it from the children.
  category: action
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage states that young people are not allowed to see what old medicine-men
    practice.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:16
  text: Hariwali plants the seed where it fell, repeats the rattle performance, and
    by the next morning a stately tree has grown from the one seed.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: Hariwali tells his mother to tie the packed belongings to the tree's branches
    and await the return of the brothers.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:18
  text: Hariwali reaches the Yawahu's place while the family is absent, releases the
    captive, unties the bones from the roof, and escapes.
  category: action
  evidence_refs:
  - ev:11
- id: obs:19
  text: The Yawahu returns, sees the empty hammock and missing bones, recognizes fresh
