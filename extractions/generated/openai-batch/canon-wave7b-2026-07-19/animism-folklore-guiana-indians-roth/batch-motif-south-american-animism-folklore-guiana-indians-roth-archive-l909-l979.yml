candidate_motifs:
- id: motif:1
  label: Death omen in failed cooking
  taxonomy_refs: []
  basis: The turtle repeatedly crawling off the hot aabee is explicitly described
    as an omen betokening the women's death.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The omen is local to this episode; the passage does not generalize it
    beyond the women's impending punishment.
- id: motif:2
  label: Punitive human-to-animal transformation
  taxonomy_refs:
  - shapeshifter
  basis: Hariwali transforms one wife into a hawk and another into a porpoise as punishment.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: 'The taxonomy label is broad: the transformed figures do not voluntarily
    shapeshift; transformation is imposed by Hariwali.'
- id: motif:3
  label: Animal-origin etiology
  taxonomy_refs: []
  basis: The passage explains the origin of the first porpoise in these waters and
    links the hawk's cry/name to the wife's utterance.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The hawk etiology is expressed through name and cry, while the porpoise
    etiology is explicitly first-origin.
- id: motif:4
  label: Enchanted hunting failure leading to supernatural isolation
  taxonomy_refs: []
  basis: Hariwali causes his brother's arrows to miss; after a speaking bird's instruction,
    the brother finds himself surrounded by water on an island.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage gives the sequence but does not fully explain how the island
    condition is produced.
- id: motif:5
  label: Spirit captivity by removal and external storage of bones
  taxonomy_refs: []
  basis: The Yawahu removes nearly all of the captive's bones, stores them under the
    roof, and keeps the captive alive in a hammock.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage says the Yawahu does this out of kindness to prevent escape,
    so the act is not presented simply as torture.
- id: motif:6
  label: Brother rescues captive brother from spirits and restores body
  taxonomy_refs:
  - sibling_pair
  - return
  basis: Hariwali decides to fetch his brother, releases him from the Yawahu's house,
    restores the bones to his skin, and leads him home.
  evidence_refs:
  - ev:7
  - ev:11
  - ev:14
  confidence: medium
  cautions: Hariwali is also responsible for the brother falling into the Spirits'
    clutches, so the sibling-pair pattern includes both harm and rescue.
- id: motif:7
  label: Restricted medicine-man practice
  taxonomy_refs:
  - forbidden_knowledge
  basis: Hariwali conceals the fallen seed from the children, and the passage states
    that young people are not allowed to see what old medicine-men practice.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage concerns restricted observation of practice, not a narrated
    theft or disclosure of forbidden knowledge.
- id: motif:8
  label: Rattle summons spirit helpers and bird-delivered medicinal seed
  taxonomy_refs: []
  basis: Hariwali plays the ehakshak rattle to call Spirit friends; parrots then deliver
    a seed of a medicinal tree used in his preparations.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage identifies the parrots after the rattle performance but does
    not detail the Spirit friends beyond this action.
- id: motif:9
  label: Miraculous tree growth from a single seed
  taxonomy_refs: []
  basis: After Hariwali plants the seed and repeats the rattle performance, a stately
    tree grows by the next morning from the single seed.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The tree is used to hold packed belongings; the passage does not describe
    it as a world tree or axis.
- id: motif:10
  label: Pursuer's weapon transformed into serpent with etiological explanation
  taxonomy_refs:
  - serpent
  basis: When the Yawahu probes the armadillo hole with a stick, Hariwali changes
    the stick into a bush-master snake, explaining why such snakes are found in armadillo
    holes.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The serpent motif is specifically an escape stratagem and local natural-history
    explanation in this passage.
