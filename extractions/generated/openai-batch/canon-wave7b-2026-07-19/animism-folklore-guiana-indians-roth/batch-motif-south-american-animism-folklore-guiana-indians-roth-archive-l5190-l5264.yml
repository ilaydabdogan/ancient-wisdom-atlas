canonical_text:
  quote: ''
  summary: The passage contains two animal-lover narratives. In the first, a skilled
    bush-hog hunter marries a Tiger who has changed into a woman; she becomes a successful
    wife and hunting partner, but leaves forever when her animal origin is revealed
    by his intoxicated mother. In the second, a woman has a Sloth for a sweetheart;
    a young man observes them, kills the Sloth, and persuades the woman to take him
    instead.
  language: English
  quote_policy: summarized
