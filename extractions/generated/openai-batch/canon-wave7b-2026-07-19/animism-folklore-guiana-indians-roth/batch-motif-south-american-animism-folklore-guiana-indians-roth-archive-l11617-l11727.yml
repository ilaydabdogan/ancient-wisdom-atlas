canonical_text:
  quote: ''
  summary: 'The passage describes Arawak doctors'' benches with animal features and
    a series of ritual objects used by Guiana Indigenous ritual specialists: rattles,
    dolls or manikins, crystals, rush wands, chest charms, and carved figures. It
    reports traditions about the rattle as a spirit-gifted and venerated object, distinguishes
    the rattle''s function of invoking spirits from the doll''s function of prognosis,
    and gives examples of dolls, Devil-figures, crystals, wands, and animal-imaged
    charms used for healing, exorcism, cursing, or professional credentials.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The plate caption identifies Arawak doctors' benches from the Upper Moruca
    River, including one with alligator and jaguar heads and another with macaw head
    and tail and a painted body on the seat.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that Indian tradition described the original rattle as
    a gift from the Spirits, and that the rattle was held in great veneration or fear
    by some people.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that the rattle's purpose is to invoke Spirits, while the
    doll or manikin gives prognosis and assistance.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:4
  text: A Peaiman burial on the Barima River is described as having five rattles hung
    around the house and a box over the grave containing professional objects, including
    a carved wooden doll or baby.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:5
  text: A small black doll seen on the Moruca or Monica River was balanced on its
    feet during incantation; if it remained standing the patient would recover, and
    if it fell the patient's death was expected.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: In parts of Cayenne, the doll is said to be replaced by the Anaan-tanha, or
    Devil-figure, which is beaten to compel the Evil Spirit to leave the invalid.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: A crystal set in an alligator tooth, called guanare, is reported among Guahibos
    of the Orinoco and is said to be used to cast spells on Piaroas.
  category: object
  evidence_refs:
  - ev:8
- id: obs:8
  text: The procedure called Twa is described as known to Warraus and Arawaks and
    practiced by very old people in the Pomeroon District.
  category: action
  evidence_refs:
  - ev:9
- id: obs:9
  text: Macusis and Wapisianas are described as cutting each other's legs with rock
    crystal for over-fatigue, assigning special virtue to the crystal and refusing
    a lancet instead.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: Little decorated instruments made of tender rushes are described as wands
    used by physicians or priests called Pyeis to drive out demons of illness.
  category: object
  evidence_refs:
  - ev:10
- id: obs:11
  text: A chest charm worn on a cord is described as flat, oval, resinous, and ornamented
    with an incised female frog; it was handed down from Bariki's grandfather to Bariki
    and then to the author.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: A reddish quartz carving of a dog sitting on its haunches is listed among
    objects associated with a piai-man's equipment.
  category: object
  evidence_refs:
  - ev:12
