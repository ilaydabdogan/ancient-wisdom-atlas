canonical_text:
  quote: ''
  summary: The passage describes a piai's rattle, also compared with the Creole shakshak,
    as a calabash or gourd shell fitted with a stick and containing stones, crystals,
    agates, seeds, or other objects. Its form varies among tribes. The passage notes
    special or unusual origins for its contents, including seeds said to come from
    a piai teacher's stomach and stones that may be gifts of Water Spirits. A Kalina
    informant says the rattle's power lies in its stones. The handle and feather ornamentation
    are also described, including an Arawak medicine-man's statement that the feathers
    must come from a particular parrot species.
  language: English
  quote_policy: summarized
