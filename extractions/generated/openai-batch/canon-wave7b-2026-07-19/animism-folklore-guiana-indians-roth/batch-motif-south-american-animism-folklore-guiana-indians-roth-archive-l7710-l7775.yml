canonical_text:
  quote: The Water Spirits must not be talked about, nor may their names be mentioned.
  summary: The passage links Oriyu and other Water Spirits with river turbulence,
    tidal bores, and named waterways. It then states a prohibition on talking about
    Water Spirits or naming them, followed by a story in which a man enters an underwater
    community, takes Amanna of the Okoyumo as a Water Spirit wife, discloses her name
    and identity, and is killed by her underwater kin. A closing note adds other Water
    Spirit taboos involving names, antecedents, menstruating women, and washing a
    pot-spoon from a traveling boat.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Oriyu is presented as responsible for troubles afflicting mankind and for
    more than one natural phenomenon.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A tidal bore is explained as the river being agitated when the bad things
    of the deep move furiously because the river is inconveniently low for them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Several coastal tribes are said to use names meaning head of waters or mother
    of waters and to tell stories of the Loku-kuyuha mermaid, translated as watery
    mamma.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Wailak-paru creek is believed to be Oriyu's home, and its turbulence is said
    to be caused by water issuing from that Spirit's body.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Water Spirits must not be talked about, and their names may not be mentioned.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: An intoxicated Indian man goes to a pond to bathe and is invited into the
    water by Amanna, a pleasant-spoken woman of the Okoyumo Nation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Below the surface, the man sees houses, many people, young women, and drink.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Amanna takes the man to her old father, who welcomes him and instructs his
    daughter to look after him properly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The man's mother traces his tracks to the water's edge, believes he has drowned,
    and mourns him as dead.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: When the man later visits his mother, he says he has been on a walk-about;
    she asks him not to leave because she is old and starving, but he returns to his
    Water Spirit wife.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: The younger brother asks whether the man is living with the Okoyumo People;
    the man becomes angry and returns to the water.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Amanna bears the man three children, and he later asks her to accompany him
    on a visit to his mother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: When the drunken younger brother again asks about the Okoyumo People, the
    man admits that Amanna is his wife and names her nation.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: After hearing the disclosure, Amanna runs to the waterside and jumps in; when
    the man follows, her friends and relatives kill him for mentioning her name and
    telling people who she was.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: Water Spirits are also said to dislike mention of their names and antecedents
