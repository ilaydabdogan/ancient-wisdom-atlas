  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:3
  type: summary
  locator: 8082-8089
  quote_or_summary: Arekunas and Makusis regarded a comet as a sign of pestilence,
    famine, and disaster; people came from huts, raised arms in supplication, and
    asked it to leave the heavens.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:4
  type: summary
  locator: 8089-8096
  quote_or_summary: Makusi comet names are translated as Fire-Cloud and Sun that throws
    its rays behind; Arekuna and Wapisiana names are glossed as Spirit of the Stars;
    Pomeroon Arawaks call Halley's comet Star-tail-with.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:5
  type: summary
  locator: 8097-8100
  quote_or_summary: Island Caribs describe Limacani as a comet sent by Coualina, boss
    of the Chemeens or Familiar Spirits, to cause evil when vexed.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:6
  type: summary
  locator: 8104-8114
  quote_or_summary: In the Bat Mountain legend, an immense bat leaves its dwelling
    after sunset, abducts anyone outdoors, carries victims to its nest, and devours
    them, causing fear and population loss.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:7
  type: summary
  locator: 8114-8118
  quote_or_summary: The medicine-man exorcises the spirit but it returns; men search
    for the killer's residence but do not find it, and Makunaima is said not to be
    with them.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:8
  type: summary
  locator: 8118-8121
  quote_or_summary: An old woman declares herself ready to sacrifice herself for her
    nation to prevent the tribe's destruction.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:9
  type: summary
  locator: 8121-8124
  quote_or_summary: At night the old woman stands in the village with a covered fire-stick
    while the others crouch in their houses.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:10
  type: summary
  locator: 8124-8126
  quote_or_summary: The bat seizes the old woman in its claws and carries her aloft
    to the charnel house.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:11
  type: summary
  locator: 8126-8130
  quote_or_summary: The old woman uncovers the fire-stick, producing a comet-like
    streak of light that shows the direction to the mortuary house.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:12
  type: summary
  locator: 8130-8133
  quote_or_summary: Flames from the burning nest on the mountain show the people where
    to go the next morning, and they kill the creature.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:13
  type: summary
  locator: 8133-8135
  quote_or_summary: The story does not say whether the old woman died; immense heaps
    of bleached bones are said still to be found there.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:14
  type: summary
  locator: 8144-8150
  quote_or_summary: Warraus call the Morning Star Okona-kura; she stuck in the hole
    when her people came down from above the skies to populate the earth.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:15
  type: summary
  locator: 8150-8153
  quote_or_summary: Makusis call the Evening Star Kai-wono, wife of the Moon, because
    she appears near him and shines more brightly than other stars.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:16
  type: summary
  locator: 8153-8158
  quote_or_summary: Casiquiare Indians believed night dew was the spittle of the stars;
    a similar Makusi belief is noted, and Caribs attributed it to urination of the
    stars.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:17
  type: summary
  locator: 8160-8169
  quote_or_summary: Racumon, one of the first Caribs made by Louquo, was transformed
    into a large snake with a man's head, sat on a cabatas tree, lived on its fruit,
    and is now a star.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:18
  type: summary
  locator: 8169-8172
  quote_or_summary: Savacou was a Carib changed into a large bird; he is captain of
    Storms and Thunders, causes heavy rains, and is now a star.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:19
  type: summary
  locator: 8172-8173
  quote_or_summary: Achinaon, a Carib now a star, causes light rain and strong winds.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
- id: ev:20
  type: summary
  locator: 8173-8176
  quote_or_summary: Couroumon, a Carib and star, causes heavy sea waves, upsets canoes,
    and causes flood and ebb.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain source; concise summary.
