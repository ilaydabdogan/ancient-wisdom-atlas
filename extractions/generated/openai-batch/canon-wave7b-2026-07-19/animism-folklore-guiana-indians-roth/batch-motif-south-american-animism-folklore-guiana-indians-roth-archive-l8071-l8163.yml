candidate_motifs:
- id: motif:1
  label: celestial body attacked during eclipse and defended by communal noise
  taxonomy_refs: []
  basis: The Uaupes and Island Carib accounts both describe a named being attacking
    or eating the Moon during an eclipse and people making loud ritual action to repel
    or respond to it.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage reports brief ethnographic summaries rather than full myths.
- id: motif:2
  label: comet as omen or agent of disaster
  taxonomy_refs: []
  basis: Arekunas and Makusis treat a comet as a sign of pestilence, famine, and disaster,
    while an Island Carib account describes a comet sent to cause evil.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: Specific ritual or narrative development is limited in the comet notices.
- id: motif:3
  label: self-sacrifice to save the community
  taxonomy_refs:
  - sacrifice
  basis: The old woman declares herself ready to sacrifice herself to prevent the
    tribe's destruction by the giant bat.
  evidence_refs:
  - ev:8
  - ev:10
  - ev:11
  confidence: high
  cautions: The text explicitly says it is not known whether the old woman died.
- id: motif:4
  label: monster abduction and devouring from a hidden lair
  taxonomy_refs: []
  basis: The giant bat nightly abducts people, carries them to its nest, and devours
    them until the community faces annihilation.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents a single Makusi legend version.
- id: motif:5
  label: fire trail reveals hidden monster lair
  taxonomy_refs: []
  basis: The old woman's uncovered fire-stick produces a streak of light that shows
    the direction of the bat's mortuary house; flames from the nest reveal where the
    people should go.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: No supplied taxonomy reference precisely matches this motif beyond the
    fire symbol.
- id: motif:6
  label: descent from above the sky to populate earth
  taxonomy_refs:
  - ascent
  basis: The Warrau Morning Star is linked to people who first came down from above
    the skies to populate the earth, with Okona-kura stuck in the hole.
  evidence_refs:
