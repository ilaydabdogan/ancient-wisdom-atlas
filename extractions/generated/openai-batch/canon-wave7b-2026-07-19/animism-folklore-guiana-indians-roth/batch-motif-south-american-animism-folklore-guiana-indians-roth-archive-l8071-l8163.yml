canonical_text:
  quote: ''
  summary: The passage records Guiana and neighboring Indigenous explanations of eclipses,
    comets, stars, and constellations. It includes eclipse traditions in which a spirit
    attacks or eats the Moon; comet traditions linking the phenomenon with disaster,
    spirits, or evil; the Makusi legend of Bat Mountain, where an old woman uses a
    covered fire-stick while being abducted by a giant bat to reveal its nest; and
    accounts of stars as persons, transformed beings, spouses, or sources of dew,
    rain, winds, waves, and storms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Uaupes River Indians say that during an eclipse Jurupari is killing the
    Moon, and they make noise to frighten him away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Island Caribs say that Maboya is eating the Moon during an eclipse, and
    they dance at night while rattling calabashes with pebbles inside.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Arekunas and Makusis regarded a comet seen by Schomburgk as a sign of pestilence,
    famine, and disaster.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Men, women, and children supplicated the comet and asked it to leave the heavens
    so they would not suffer under its influence.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Makusi names for the comet included terms translated as Fire-Cloud and Sun
    that throws its rays behind; Arekuna and Wapisiana terms are reported as meaning
    Spirit of the Stars.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Among Island Caribs, Limacani is described as a comet sent by Coualina, the
    boss of the Chemeens, to cause evil when Coualina is vexed.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the Makusi Bat Mountain legend, a huge bat leaves its dwelling after sunset,
    abducts people found outdoors, carries them to its nest, and devours them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The medicine-man exorcises the spirit, but the bat returns; men search for
    its residence but do not find it.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: An old woman volunteers to sacrifice herself to prevent the destruction of
    her tribe.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The old woman stands in the middle of the village at night with a covered
    fire-stick while the rest of the people hide in their houses.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: The bat seizes the old woman and carries her upward to its charnel house.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The old woman uncovers the fire-stick, making a streak of light that shows
    the people the direction to the mortuary house.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Flames from the burning nest on the mountain show the people where to go the
    next morning, and they kill the bat.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: The text says immense heaps of bleached bones are still found at Bat Mountain.
  category: object
  evidence_refs:
  - ev:13
- id: obs:15
  text: The Warrau Morning Star, Okona-kura, is described as female and as the one
    who stuck in the hole when her people came down from above the skies to populate
    the earth.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:16
  text: The Makusis describe the Evening Star as Kai-wono, wife of the Moon, because
    she appears near him and shines more brightly than other stars.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:17
  text: The Casiquiare Indians are reported to have believed that night dew was the
    spittle of the stars; the Caribs ascribed it to the urination of the stars.
  category: attribute
  evidence_refs:
  - ev:16
- id: obs:18
  text: In Island Carib cosmogony, Racumon was transformed into a large snake with
    a man's head, lived on fruit from a cabatas tree, and is now a star.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:19
  text: In Island Carib cosmogony, Savacou was changed into a large bird, is captain
    of Storms and Thunders, causes heavy rains, and is now a star.
  category: sequence
  evidence_refs:
  - ev:18
- id: obs:20
  text: Achinaon is described as a Carib who is now a star and causes light rain and
    strong winds.
  category: attribute
  evidence_refs:
  - ev:19
- id: obs:21
  text: Couroumon is described as a Carib who is now a star and causes heavy sea waves,
