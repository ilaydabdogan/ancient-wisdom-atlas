comparison_claims:
- id: claim:1
  claim: The Uaupes and Island Carib eclipse notices share a pattern in which a named
    being attacks or consumes the Moon and people respond with loud collective action.
  claim_level: same_motif
  target: eclipse attack-on-Moon traditions within the passage
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The two notices differ in the named being and in the specific human
    response; they are short ethnographic reports.
- id: claim:2
  claim: The passage itself compares the old woman's fire-stick streak in the Bat
    Mountain legend to the comet image of the Sun throwing its rays backward.
  claim_level: visual_similarity
  target: comet/fire-tail visual pattern in the same passage
  evidence_refs:
  - ev:4
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: This is an explicit visual analogy in the reported legend, not evidence
    of historical contact beyond the local account.
- id: claim:3
  claim: Several groups in the passage attribute harmful or disastrous influence to
    comets, either as omens of disaster or as a comet sent to cause evil.
  claim_level: same_function
  target: comet as harmful omen or agent among Arekuna, Makusi, and Island Carib notices
  evidence_refs:
  - ev:3
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The Arekuna and Makusi material treats the comet as a sign or influence,
    while the Island Carib notice personifies agency through Coualina and Limacani.
- id: claim:4
  claim: The Casiquiare, Makusi, and Carib star-dew or star-excretion notices are
    presented as similar explanations for moisture falling at night.
  claim_level: same_function
  target: dew or moisture attributed to stars
  evidence_refs:
  - ev:16
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage only gives summarized beliefs and does not provide full
    narratives for each group.
