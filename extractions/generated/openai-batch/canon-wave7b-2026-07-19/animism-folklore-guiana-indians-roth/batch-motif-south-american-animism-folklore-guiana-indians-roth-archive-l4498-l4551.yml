canonical_text:
  quote: ''
  summary: A good old man detects a Hebu spirit approaching his wife, hides with bow
    and arrow, and shoots the spirit during an attack; the spirit and wife disappear,
    but the wife resurfaces after being thrown into water. Later, the man returns
    with his wife and a powerful medicine-man brother-in-law; a beautiful girl is
    recognized as the Hebu and dies when the medicine-man silently looks at her. The
    wife then dies after a remembered bathing omission. Her parents give the man a
    younger daughter as a new helpmate; the elder sister becomes jealous, is rejected,
    and is killed by the brother. The old man remains with his wife's parents and
    lives contentedly.
  language: English
  quote_policy: summarized
