canonical_text:
  quote: ''
  summary: The passage recounts traditions concerning Water Spirits. In one narrative,
    Ho-arinni catches people at a fishing place and swallows a piai, who lights a
    fire and sets posts inside the spirit's belly, causing pain and eventually escaping,
    though he dies soon after. The passage then gives origin accounts in which two
    sisters become a manati and a porpoise after their tapir lover is killed, and
    defeated giant lizards become Oriyus. It also notes that some Water Spirits are
    kindly and begins a fisherman story.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Men go fishing downriver, and one of them repeatedly disappears; the disappearance
    is attributed to Ho-arinni, a Water Spirit.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son of the local piai travels to the place of the disappearances and is
    himself caught and taken away by Ho-arinni.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The local piai takes a corial, banab posts, firewood, and fire, and warns
    his wife that he may also be swallowed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Water Spirit engulfs the piai's boat and swallows the piai together with
    the posts, firewood, and fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Inside the Water Spirit, the piai is in darkness, lights a fire, and sets
    up banab posts in the creature's belly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ho-arinni feels severe pain and consults several medicine-men, who give no
    relief and say the condition is his own fault.
  category: sequence
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: When Ho-arinni rises and gasps at the surface, the piai watches the surroundings
    and eventually escapes with his corial through the creature's jaws.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The piai returns to his wife, says the heat has made his hair fall off, and
    dies soon afterward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The narrative states that ancestors of the present Warraus killed most of
    the bad Water Spirits, which explains why they are now scarce.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that some Water Spirits have been derived from human mortals
    and from animals.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: Two sisters have a Bush-cow or tapir as a sweetheart; they make plum drink
    for him and summon him by whistling.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The sisters' brother secretly observes them, later imitates their whistle,
    shoots the tapir lover with an arrow, cuts up the body, and scatters the pieces.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The sisters find the tapir lover's remains, cry, throw themselves into the
    water, and become a manati and a porpoise.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: At a place of bubbling water near Wakapoa Creek, gigantic Salapentas are said
    to have thrown themselves into the river after being defeated by Indians and to
    have become Oriyus.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The passage says certain Water Spirits are kindly, including by conferring
    gifts, saving people from drowning, and other acts; it then begins a story about
    a fisherman with repeated large catches and unusual tugs on his line.
  category: other
  evidence_refs:
  - ev:13
  - ev:14
