canonical_text:
  quote: ''
  summary: The passage catalogs Guiana Amerindian and related ethnographic beliefs
    about dangerous snakes or monsters, frogs as weather and culture-giving beings,
    birds with ritual or ominous functions, animal-derived remedies, oversized spider-webs
    in prior tales, and the local naming and interpretation of Brer Rabbit/Koneso
    as a clever rogue figure of foreign origin adapted locally.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A being called the buio raises its head and part of its body when it hears
    a noise and takes aim when it sees prey such as a tiger, calf, deer, or man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The buio opens its mouth and emits a poisonous, foul exhalation that fixes,
    stupefies, and immobilizes the victim.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: People are said not to travel alone for fishing or hunting; at least two go
    together so that one can shake or cut the air between the monster and the threatened
    companion with a hat or tree branch.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage links foul snake exhalation with reports of a musky stench from
    a hissing boa and with a camudi belief that the snake kills larger prey by inserting
    its pointed tail into the prey's rectum.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The frog is described as regarded by original Carib tribes as a divinity connected
    with sending rain or fine weather, kept as a domestic animal, and whipped if worshippers'
    wishes were not fulfilled.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The frog is generally spoken of as female and is credited with bringing fire
    from her mouth, food-starch and cassava from her neck and shoulders, teaching
    music, and showing people how to hunt.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The frog is used in hunting preparation by swallowing it or rubbing it into
    hunter's incisions, is depicted on a medicine-man's neck ornament, and is used
    by pregnant Arawak women as an omen.
  category: object
  evidence_refs:
  - ev:3
- id: obs:8
  text: The b(iDia or stinking bird is believed to produce the aerial roots of the
    kofa tree, understood as the bird's castings turned into wood.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: The same stinking bird is represented as removing a snake from a plum-tree
    woman and also as a transformed medicine-man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The tikitiki is described as a fabulous bird, enemy of the human race, that
    causes deformities in newborn children.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Macaws are believed to advise and assist Water Spirits in upsetting canoes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The tiriliana corn-bird and the werebekwa are each described as laying eggs
    in other birds' nests, with the host birds hatching or being driven away.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The goat-sucker is said by Wapisianas to carry another pair of eyes on its
    back and is described as a bird of ill omen.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:14
  text: Hummingbirds are described as quarrelsome, associated with tobacco and a pleasant
    smell, called the doctor's bird by Arawaks and Warraus, and credited with introducing
    tobacco among these tribes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The curbinata fish has two head stones valued as a treatment for retention
    of urine, and Arawaks are said to place a sting-ray barb in an aching tooth hollow
    to relieve toothache.
  category: object
  evidence_refs:
  - ev:8
- id: obs:16
  text: Spider-webs are mentioned as having formerly been large enough for people
    to climb down them and strong enough to support a fallen tree.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: Koneso or Konehu is identified as the local Arawak or Warrau form of Brer
    Rabbit, and the Warraus apply the term to a smart man, knave, or rogue who outwits
    neighbors.
  category: relationship
  evidence_refs:
  - ev:10
