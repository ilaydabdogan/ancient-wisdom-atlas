canonical_text:
  quote: ''
  summary: The passage surveys reports about Guiana and neighboring Amazonian peoples’
    terms and ideas for deity or supreme powers. It describes Cachimana/Manito as
    a good principle regulating seasons and harvests; Maire as a heaven-dwelling God
    acknowledged but not worshipped; Carib, Arawak, Warrau, and Tupi terms for deity
    as potentially adapted or linked to titles for chiefs, ancestors, or Christian
    usage; reports of Sun and Moon worship or influence; a cacique claiming to be
    God and begotten by the Sun, with a soul that nightly goes to Heaven to govern
    the universe; and china dolls called tupana as saint figures.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nations of the upper Orinoco, Atabapo, and Imrida are reported as having worship
    of the powers of Nature; they call the good principle Cachimana, identified in
    the passage with Manito or the Great Spirit, which regulates seasons and favors
    harvests.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Xouragues and Acoquas are reported to acknowledge a God named Maire, say
    he dwells in Heaven, do not worship him, are uncertain whether he is a spirit,
    and speak of him in fabulous stories.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The British Guiana Carib name for God is given as Tamosi-Kabutana, Old Man-Sky
    or Ancient of Heaven; the passage links it to a Cayenne Carib term for chief and
    to a term for grandfather.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that Arawak terms for the Christian deity appear adapted
    to a modern introduced conception and that Arawak creation myths cited by the
    author lack a reference to the All-Maker under the named terms.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Some Orinoco tribes are reported to consider the Sun the Supreme Being and
    First Cause, attributing earthly productions, rains, and temporal blessings to
    him; others are reported to depend on the Moon’s influence and to interpret a
    lunar eclipse as the Moon’s anger.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Chaimas, Cumanagotos, Tamanacs, and other original Carib peoples are reported
    to have worshipped the Sun and Moon.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A cacique of an Amazon tribe is reported as saying that he himself was God,
    was begotten by the Sun, and that his soul went every night into Heaven to give
    orders for the next day and regulate the government of the universe.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Tupi word tupana is said to signify God; on the Aiary River, little china
    dolls given to women and children were generally called tupana and taken for figures
    of saints from missionary times.
  category: relationship
  evidence_refs:
  - ev:7
