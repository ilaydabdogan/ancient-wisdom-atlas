canonical_text:
  quote: ''
  summary: The passage first narrates how Boku-boku, the Night-owl, and his bat brothers-in-law
    steal dried fish by frightening householders at night. The bats ignore Boku-boku’s
    warning, are exposed, shot, and in one case revived from apparent death before
    a later over-drying prevents revival. The story links the surviving bat with sucking
    people and fowls, and Boku-boku’s night presence with sickness and death. The
    passage then records Arawak beliefs about bees, a candle-fly, and an ant as omens,
    followed by a tale in which a candle-fly guides a lost hunter back to his companions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Boku-boku, identified as the Night-owl, marries the bats’ sister and often
    takes the bats with him at night to rob people’s houses.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: At houses where fish are drying on a babracote, the owl and bats frighten
    occupants with night cries, causing people to run into the bush while the bats
    steal fish.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before traveling away, Boku-boku tells the bats to behave, stay indoors at
    night, and avoid trouble during his absence.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bats disobey the warning; without the owl’s louder voice, householders
    are less frightened and are able to see that bats are stealing their food.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A housemaster shoots one bat in the rump with an arrow tipped with a knob
    of wax, stunning it.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The other bat escapes into the forest and tells the returned Boku-boku about
    his brother’s death.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Boku-boku and the surviving bat return, frighten the people again with their
    combined voices, steal fish, and carry away the dead bat from the babracote.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The dead bat revives after being smacked on the place where the arrow struck
    him, because the fire has not dried him beyond recovery.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: On a later raid without Boku-boku, another bat is shot; when the corpse is
    later taken away and smacked, it does not wake because it has been dried too much
    over the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The surviving bat continues to take revenge by sucking people and their fowls
    and by doing other damage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The presence or night sound of Boku-boku is said to mean mischief and that
    someone is about to sicken and die.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: Two bees, named honorari and wariro, are said to indicate the arrival of a
    stranger; the honorari appears early in the morning and late in the afternoon,
    while the wariro lives in the ground.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The modudu bee flies around between about 4 and 5 a.m.; if a young person
    hears it buzzing, the person must get out of the hammock or suffer pains all over
    the body.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: 'A candle-fly entering a house is interpreted in three ways: falling to the
    ground indicates near death of an inmate, falling into the fire indicates that
    a deer has sent it to fetch light, and settling under the roof indicates an expected
    stranger.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: The bite of a certain ant is described as lucky.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:16
  text: In the candle-fly story, five men go hunting; one does not return to the resting
    place, and the others decide he is lost after considering and rejecting the possibility
    of tiger tracks.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:17
  text: The lost hunter is overtaken by darkness, misses the track, wanders in the
    forest, and lies down under a tree.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:18
  text: A candle-fly asks the lost hunter why he is alone, learns that he is lost,
