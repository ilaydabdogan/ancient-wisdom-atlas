  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The timber used for the handle and fire sticks is described in a note as having
    milky sap and growing along swift creeks in the forest.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Hebus are found fastening parrot feathers into cotton-twine, and Komatari
    receives an ornament for his calabash.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A Hebu who gives the feather ornament also withholds his name, saying Komatari
    can find it if he becomes a good piai-man.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Komatari asks a Hebu house-master for a cotton-plait with different feathers
