canonical_text:
  quote: ''
  summary: The passage narrates how tobacco is taken from Komatari's place by distracting
    marabuntas, how Komatari plants tobacco and appoints black marabuntas as watchmen,
    and how he begins assembling a medicine-man's rattle from a calabash, handle timber,
    feather ornaments, and stones. Several Hebus provide or are connected with these
    materials while withholding their names until Komatari becomes skilled in piai
    practice. A killing Hebu repeatedly asks about the object and is said to fear
    the power of the maraka.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A visitor shows fish as payment to marabuntas, waits while they swarm down
    on the fish, climbs up, and takes tobacco.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Komatari finds much tobacco missing, moves the remaining tobacco, and keeps
    one black variety of marabunta, the oro or yieseri, as watchmen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Komatari cuts and burns a field and plants tobacco there.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the tobacco begins to thrive, Komatari builds a piai-house and finds
    a calabash tree full of gourds.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A Hebu at the calabash tree says that if the calabash is Komatari's, he may
    have the whole tree.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The same Hebu says he has a name but will not tell it, and that Komatari can
    find it out if he learns the piai business well.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: A killing Hebu asks what Komatari intends to do with the cleaned calabash,
