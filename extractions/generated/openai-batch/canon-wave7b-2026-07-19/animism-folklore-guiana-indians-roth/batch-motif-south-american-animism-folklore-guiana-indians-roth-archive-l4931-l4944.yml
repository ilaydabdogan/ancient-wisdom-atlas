canonical_text:
  quote: ''
  summary: A separated hunter hears a small rain-frog croaking and calls it to come
    out. The frog appears in the form of a woman, agrees to go home with him, and
    lives with him for a long time. His people mock her frog-like body. Made miserable,
    she returns toward her own people, jumps into a puddle, and disappears. Her sound
    is still heard at the beginning of the rainy season.
