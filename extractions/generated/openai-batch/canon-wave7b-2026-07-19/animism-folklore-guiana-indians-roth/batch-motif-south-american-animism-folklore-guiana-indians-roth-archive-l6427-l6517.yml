canonical_text:
  quote: ''
  summary: The passage includes an animal tale fragment in which Turtle hides in a
    log while Tiger watches, a Tiger and Great Ant-eater tale in which Tamanoa deceives
    Tiger in a wager and then kills him in a fight, an etiological tale explaining
    birds' plumage through the divided skin of a slain Water Serpent, and a Warrau
    tale in which an old woman unsuccessfully tries to hunt a sleeping deer and is
    laughed at by her family.
  language: English
  quote_policy: summarized
