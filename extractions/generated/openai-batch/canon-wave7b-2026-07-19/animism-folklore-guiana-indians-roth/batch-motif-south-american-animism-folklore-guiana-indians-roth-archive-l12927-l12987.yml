canonical_text:
  quote: ''
  summary: 'The passage describes a divinatory procedure using boiling water to determine
    the direction of a Kanaima and to identify a place and an atoning victim. It then
    describes Kanaima vengeance: a near relative or hired stranger may become a Kanaima,
    live apart under restrictions, wander until killing the target, and be treated
    as an outlaw. The passage also records variant rules about speech, dietary abstinence,
    emaciation, body paint, animal skins, jaguar claws, and reported associations
    with jaguar, tiger, and boa-constrictor forms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A pot filled with water is placed on a kindled fire; when the water boils,
    the side on which a piece is first thrown out by bubbling indicates the direction
    in which the Kanaima would be.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the boiling-water sign, a consultation is held, and the place and the
    individual whose death is to atone for the deceased are pointed out.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that a person may die because he or she has incurred the
    hatred of the all-powerful piai, or because the piai desires another Indian's
    wife.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A near relative may be charged with vengeance, become a Kanaima, be supposed
    possessed by the destroying Spirit so called, live apart under strict rules, and
    undergo privations until the blood deed is accomplished.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: If the intended individual cannot be found or a favorable opportunity does
    not arise, another member of that person's family may suffice.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: One example describes a Warrau boy of about twelve avenging his parents by
    smashing a piai's skull with a club while the piai lies drunk in a hammock.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage gives examples in which vengeance is delegated to strangers or
    mercenaries, including Great Falls Indians employed by Arawaks, Arekunas induced
    by presents, and poison specialists who hire themselves out and are called Kanaimas.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:8
  text: The person charged with avenging a death suddenly disappears from the settlement
    and wanders as Kanaima through forests, valleys, and heights until he kills the
    victim or shoots him with a poisoned arrow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the wandering period, which may last months or years, the Kanaima avoids
    contact with other Indians.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Once he leaves the settlement, the Kanaima is described as outlawed, with
    ties to family and tribe cut, and other Indians who meet him in the bush are expected
    to kill him.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: 'The passage records variant statements about speech: one source says the
    avenger may not speak with anyone he meets, while another says an Arawak avenger
    publicly avows his purpose and relinquishes it only with life.'
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Kanaima abstains from meat, lives on forest supplies, and is usually emaciated.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: Distinctive decoration includes a wrought cap, red spots on the skin, jaguar
    claws with threatening signification, painted lines described as tiger or boa-constrictor
    identity, peculiar painting, and animal skin clothing.
  category: attribute
  evidence_refs:
  - ev:7
