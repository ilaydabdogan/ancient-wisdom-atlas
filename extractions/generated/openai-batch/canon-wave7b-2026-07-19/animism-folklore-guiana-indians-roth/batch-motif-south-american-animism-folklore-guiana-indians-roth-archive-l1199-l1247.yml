canonical_text:
  quote: ''
  summary: Kororomanna, after shooting a baboon while hunting, loses his way at night
    and sleeps beside the carcass on a Hebu spirit road. Awakened by spirits striking
    trees, he imitates their blows by striking the swollen carcass, which makes a
    booming noise. The Hebu leader becomes frightened and curious. Kororomanna deceives
    him by showing the baboon's limbs and face as his own. When the Hebu asks to be
    altered so he can make the same sound, Kororomanna splits and impales him with
    a bow; the Hebu curses him, threatens revenge by other spirits, and disappears.
  language: English
  quote_policy: summarized
