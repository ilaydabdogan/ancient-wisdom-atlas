canonical_text:
  quote: ''
  summary: In §362, Konehu is shunned after deceiving others and loses his wife. After
    hanging a deer leg in his house, his hunting luck and household order improve;
    he discovers that the deer leg becomes a woman who helps him and later becomes
    his wife on condition that he keep her origin secret. Neighbors intoxicate him
    at a feast, he reveals the secret, and the woman and prosperity vanish; the deer
    leg bleeds when cut, and Konehu becomes a wanderer. In §363, a girl rejects local
    suitors and marries a fine-dressed stranger who proves to be the serpent Oroli.
    Omens of his nonhuman nature include magically rapid house-building and swallowing
    an uncooked duck. He later swallows the girl; her mother finds the serpent, and
    a priest refuses to kill him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Konehu is socially shunned because everyone has been fooled by him; his wife
    leaves with another man, and he is unable to keep house, cook, or hunt successfully.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Konehu shoots a deer, eats all except one leg, barbecues the leg, and hangs
    it from a beam; afterward his hunting luck begins to increase.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When Konehu returns home in the afternoons, the fire is lit, the pepper-pot
    is boiled, and the house is cleaned, although no person is visible.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Konehu hides behind a big tree and sees the hanging deer leg change into a
    beautiful woman.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman initially refuses to be Konehu's wife but promises to remain his
    benefactress; later she agrees to be his spouse if he keeps silent about her origin
    from a deer's foot.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman warns that she will punish Konehu if he reveals her antecedents.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Konehu's hunting, fishing, and provisions become abundant, but he remains
    silent when asked what binas he uses.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: Neighbors hold a paiwarri feast to make Konehu drunk; while intoxicated, he
    tells the whole story.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After returning home, Konehu finds only his old dirty house and the deer leg
    still hanging; when he stabs the leg with a knife, blood gushes out, and he leaves
    to wander.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: A girl refuses many marriage offers from men among her own people and immediately
    chooses a fine-dressed stranger as her desired husband.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The stranger builds a house and its furniture in one day, and the girl takes
    this speed as a sign that something is wrong.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: The stranger is identified as the terrible snake Oroli disguised as a man,
    decorated with boar's teeth and feathers.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: At the wedding feast, the bridegroom refuses ordinary eating and swallows
    an uncooked duck by himself.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: At the new home, the bride remains in the husband's hammock for three days;
    he then begins swallowing her foot first.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:15
  text: The girl's mother enters and finds a great fat serpent in the hammock, with
    her daughter gone; a priest refuses to kill the serpent because he is Catholic.
  category: sequence
  evidence_refs:
  - ev:7
