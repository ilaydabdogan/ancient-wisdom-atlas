canonical_text:
  quote: ''
  summary: 'Tiger wants to eat Turtle and approaches him under the pretense of friendship.
    Turtle recognizes the danger and repeatedly uses cunning: he answers Tiger''s
    boasts with tests, arranges a race in which turtle friends are stationed along
    the path, marks Tiger attractively in a painting contest, kills a deer by ambush
    while making Tiger believe he has already eaten, and then removes Tiger''s necklace
    while Tiger sleeps. Tiger threatens Turtle over the missing necklace, and the
    excerpt ends as they arrange a fight after a preparation interval.'
  language: English
  quote_policy: summarized
