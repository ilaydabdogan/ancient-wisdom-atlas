canonical_text:
  quote: ''
  summary: The passage first gives a tale in which a man who wants a honey-sweet drink
    calls Kohora, a honey-bee woman, who sweetens water by dipping her little finger
    into it; after he complains, she flies away, and people thereafter must gather
    and clean honey from trees. The passage then describes naming customs among Pomeroon
    Arawaks and compares them with Makusi, Tukano, and Island Carib naming practices,
    including maternal naming, piai naming with a spirit in a rattle, names from appearance
    or natural objects, sponsors, piercing, and new names after convalescence.
  language: English
  quote_policy: summarized
