  claim: The passage itself links Kororomanna's episode with a Carib story of an unnamed
    Indian in which the Skull Spirit is called Pupombo.
  claim_level: same_motif
  target: Carib unnamed-Indian story with Pupombo as Skull Spirit
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The note reports the relationship but does not provide the full Carib
    story in this line range.
- id: claim:2
  claim: The passage notes a Carib variant in which the home-return helper is a butterfly
    rather than the sequence of food-bearing animals.
  claim_level: same_function
  target: Carib Kere-Kere'miyu-au version with butterfly guide
  evidence_refs:
  - ev:5
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The note gives only a brief variant summary and does not narrate the
    whole episode.
- id: claim:3
  claim: An editorial note compares the Skull Spirit material with North American
    legends of individual giant heads or skulls.
  claim_level: visual_similarity
  target: North American legends of individual giant heads or skulls as cited from
    Ehrenreich
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: The passage provides only a bibliographic comparison and no North American
    narrative details.
- id: claim:4
  claim: The passage presents Makunaima and Pia as part of a hero tradition with Warrau,
