canonical_text:
  quote: ''
  summary: Kororomanna, unable to find his way home, encounters the Hebu Huta-Kurakura
    bailing water from a pond, wounds him with arrows, is punished by being hurled
    into timber, and secures friendship by offering tobacco. The Hebu helps him gather
    and compress a great quantity of fish into a small bundle. Kororomanna then finds
    the way home through reports from animals who have visited his mother; the small
    parcel releases so many fish that the house fills. A note gives a Carib version
    with a butterfly guide. The passage then introduces Makunaima/Makonaima and Pia
    as twin children of the Sun and heroes, and begins a Warrau story in which the
    old medicine-man Nahakoboni carves a daughter, Usi-diu, from a plum tree; animals
    court her unsuccessfully before the Sun, Yar, visits and is tested with food and
    drink.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kororomanna is unable to find his way home and meets an old man at a pond
    who is identified as the Hebu Huta-Kurakura, called Red-back.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Huta-Kurakura is bailing water from a pond to get fish and uses his large
    scrotum as a container because he has no calabash.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kororomanna strikes Huta-Kurakura in the back with arrows; after the third
    strike, Huta-Kurakura turns, seizes him, and hurls him into timber so that only
    his eye projects.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kororomanna offers crystals, rattles, paiwarri, women, and other things to
    be freed, but Huta-Kurakura accepts only tobacco; afterward they become friends.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kororomanna and Huta-Kurakura empty the pond and collect a heap of fish too
    large for Kororomanna to carry.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Huta-Kurakura binds the heap of fish into a small bundle that Kororomanna
    can carry in his hand.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'On the way home, Kororomanna receives news of his mother from a sequence
    of animals, each associated with a food item from her: rat with potato, acouri
    with cassava root, labba with yam, deer with cassava leaf, kushi-ant with a similar
    leaf, and tapir eating pineapple.'
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At home, Kororomanna's wife and mother laugh at the small parcel, but when
    it is opened many fish come out and fill the house, forcing the occupants outside.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A note reports a Carib version in which the hero is named Kere-Kere'miyu-au
    and finds his way back to his mother's place with the help of a butterfly.
  category: other
  evidence_refs:
  - ev:7
- id: obs:10
  text: The narrator of the Carib version says the butterfly is a good friend of the
    Caribs and explains this by saying it drinks from cassiri jar washings and becomes
    stuck or drunk.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Makunaima or Makonaima is described as an alleged God or Supreme Being, Maker
    of Heaven and Earth in cited accounts, and one of the twin children of the Sun;
    his brother is Pia.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: Makunaima and Pia are described as Akawai and Makusi heroes, and Epel is named
    as the being who works in opposition to Makunaima according to Makusi beliefs.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: Nahakoboni is an old man without a daughter and therefore without a son-in-law
    to care for him in old age.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Nahakoboni carves a daughter from a plum tree; as a medicine-man, he carves
    the timber so skillfully that the result is a lovely woman named Usi-diu, meaning
    seed-tree.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Animals, birds, and beasts come from afar to court Usi-diu, but Nahakoboni
    refuses them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: Yar, the Sun, stops on his journey to visit Nahakoboni, and the passage states
    that his purpose is clear and his advances are encouraged.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: Nahakoboni tests Yar by ordering him to provide barbecued meat and drink;
    Nahakoboni eats most of the meat and drinks a large jugful.
  category: action
  evidence_refs:
  - ev:11
