candidate_motifs:
- id: motif:1
  label: tobacco exchange creates alliance with a spirit
  taxonomy_refs:
  - sacred_exchange
  basis: Kororomanna's valuables are refused, but tobacco is eagerly accepted by the
    Hebu, after which the two become friends.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage presents an exchange with a spirit, but does not explicitly
    call the tobacco sacred.
- id: motif:2
  label: supernatural compression of abundant food into a small bundle
  taxonomy_refs: []
  basis: A heap of fish too large for Kororomanna to carry is bound by the Spirit
    into a small bundle, and later releases enough fish to fill the house.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: No supplied taxonomy family directly matches this motif.
- id: motif:3
  label: return home aided by animal informants
  taxonomy_refs:
  - return
  basis: Kororomanna finds the right path home because each animal he meets gives
    him news of his mother; a Carib variant gives a butterfly as helper.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The animal sequence and butterfly variant differ in details.
- id: motif:4
  label: solar twin culture heroes
  taxonomy_refs:
  - sacred_twins
  - culture_hero
  - divine_parent_child
  basis: Makunaima and Pia are described as twin children of the Sun and as Akawai
    and Makusi heroes.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage introduces the tradition but does not narrate the twins' deeds
    in this line range.
- id: motif:5
  label: opposed beings in Makusi belief
  taxonomy_refs:
  - duality
  basis: Epel is named as the being who works in opposition to Makunaima according
    to Makusi beliefs.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The nature of the opposition is not elaborated in the passage.
- id: motif:6
  label: woman created from tree by a medicine-man
  taxonomy_refs:
  - miraculous_child
  basis: Nahakoboni carves a daughter from a plum tree, and his medicine-man skill
    makes the timber into a lovely woman.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage describes the creation of a grown woman or daughter by carving,
    not a birth or childhood episode.
- id: motif:7
  label: suitor tested through provisioning food and drink
  taxonomy_refs: []
  basis: Nahakoboni tests Yar by ordering him to provide barbecued meat and drink
    and consumes most of what Yar supplies.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The test begins in this passage but its outcome lies outside the supplied
    line range.
- id: motif:8
  label: animal suitors rejected in favor of a solar suitor
  taxonomy_refs: []
  basis: Animals, birds, and beasts come to court Usi-diu and are refused; Yar the
    Sun then visits with his purpose understood and encouraged.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage implies courtship by Yar but does not yet complete the marriage
    sequence.
