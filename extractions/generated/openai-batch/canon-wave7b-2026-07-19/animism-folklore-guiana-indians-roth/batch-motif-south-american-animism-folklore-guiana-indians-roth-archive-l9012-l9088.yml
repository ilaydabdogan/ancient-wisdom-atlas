canonical_text:
  quote: ''
  summary: The passage describes a tree omen connected with infant marriage contracts,
    then surveys preparatory hunting charms and painful ordeals among Guiana and neighboring
    Indigenous groups, including abstinence, scarification, bloodletting, body modification,
    nose-stringing, and the use of frogs, toads, spawn, and other substances on wounds.
    It ends by introducing an Arawak story titled "The Wife Teaches her Husband to
    Hunt."
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Parents may contract marriages for infant children and plant trees as witnesses;
    if either tree withers, it is treated as a bad omen that the associated party
    will die.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Guiana Indian hunter is described as voluntarily undergoing preparatory
    charms or ordeals before the chase, including abstinence from salt and peppers
    and sometimes sugar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The preparatory ordeals are described as involving scarification and irritation
    of the body with frogs, toads, caterpillars, ants, or a nose-stringing apparatus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ojana and Trio examples describe slashing or scarifying limbs and rubbing
    materials such as Caladium bulb or earth into wounds for hunting, climbing, or
    strength.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Island Carib infants are described as having the forehead and nose artificially
    flattened soon after birth; the shape is said to be a beauty sign and to help
    with shooting arrows from a tree-top and other practical actions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yaruro, Cayenne Carib, and other reported practices include sting-ray barb
    piercing, drawing blood, scarification, calf incisions, and bleeding for bow skill,
    steadiness, paddling strength, land journeys, or fatigue.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A thick plaited fiber cord is described as being passed through the nose and
    drawn out through the mouth of a house owner to give hunting luck; this is associated
    with Makusis, Arecunas, and Ackawoi.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: On the Kaieteur savannah, frogs are rubbed on hunters' chest cuts, with different
    frogs used for different game; a live toad may be swallowed for hunting success.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the Pomeroon District, cuts are made on the arms and akura frog spawn is
    rubbed into the incisions and into the mouth, nose, eyes, and ears, where it causes
    acute irritation.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The author states that the relationship between frog or toad use and hunting
    success is difficult to understand, except by a possible earlier belief in the
    divinity of batrachians in parts of the Guianas.
  category: other
  evidence_refs:
  - ev:9
- id: obs:11
  text: The passage introduces an Arawak story with the title "The Wife Teaches her
