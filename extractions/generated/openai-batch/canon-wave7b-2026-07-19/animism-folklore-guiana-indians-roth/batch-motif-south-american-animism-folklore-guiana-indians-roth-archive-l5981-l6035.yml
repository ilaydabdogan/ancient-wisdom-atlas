canonical_text:
  quote: ''
  summary: 'The passage first concludes a Tiger-killing episode: a boy witnesses Tiger
    kill women, escapes by corial, and reports the massacre; Tobe-akuba and Sika-waka
    alone fight and kill Tiger, after which Tobe-akuba rewards Sika-waka with his
    daughter in marriage. It then begins the Warrau tale ''Why Black Tiger Killed
    the Indians'': Tobe-horoanna captures a young man, places him in a pot, and his
    siblings test whether the captive can eat a whole bush-hog and drink cassiri.
    Black Tiger''s sister takes a liking to the man, he proves his hunting ability,
    marries her, and she bears twin sons.'
  language: English
  quote_policy: summarized
