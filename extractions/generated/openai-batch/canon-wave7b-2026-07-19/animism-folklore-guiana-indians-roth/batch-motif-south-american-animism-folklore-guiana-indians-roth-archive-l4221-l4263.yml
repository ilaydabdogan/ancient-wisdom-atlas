canonical_text:
  quote: They were punished for their unbelief.
  summary: A hunter encounters a hair-covered Konokokuyuha or Bush Spirit making an
    eye-socket basket. He warns his family and friends not to sleep, but they ignore
    him. During the night the spirit enters, removes the sleepers' eyes, and places
    them in the basket. The blinded people ask to be taken to water; after being tied
    together and left near a stream, they become fish. One man tied to a tree is only
    partly changed until the spirit pities him, completes the transformation into
    a haimara fish, and restores his eyes. A following note states that Bush Spirits
    are excellent hunters and that some use a rattle like a medicine-man.
  language: English
  quote_policy: quoted
