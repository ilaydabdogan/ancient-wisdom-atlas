canonical_text:
  quote: '"utter certain words strictly forbidden under the circumstances"'
  summary: The passage describes speech taboos connected with boat or sea travel.
    Directly naming certain objects, beings, places, or ritual specialists is said
    to offend Water Spirits or create danger; travelers use paraphrases instead. Reported
    consequences include storm, rain, capsizing, shipwreck, drowning, and a monster
    rising from the deep.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The passage states that uttering certain forbidden words can offend Water
    Spirits and lead to punishment by storm, capsizing, wrecking, or drowning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Among Arawaks of the Pomeroon and Moruca Rivers, certain terms must not be
    used on a boat and must be paraphrased.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says most of the Arawak tabooed words are of foreign, mostly Spanish,
    origin, while a few are indigenous.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Examples of Arawak paraphrases include descriptive substitutes for gun, dog,
    fowl, horse, cow, grindstone or saw, monkey, tiger, and medicine-man.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Warraus are said to have had various words strictly taboo when traveling
    by boat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: For Cayenne, the passage says people avoid speaking of several things by their
    right names, including rock and lizard, and that naming streams and little islands
    passed on the route is dangerous.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says medicine-men may not be mentioned as such in the Cayenne
    practice, and that breaking this rule can cause rain, exposure to shipwreck, and
    the possibility of a monster rising from the deep and swallowing the group.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage reports that Carib islanders crossing the sea do not name or point
    out land when approaching it, but may call out “Lyca!” meaning “It is there!”
  category: speech
  evidence_refs:
  - ev:6
