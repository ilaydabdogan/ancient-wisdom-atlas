  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: During a solar eclipse, Arawak men are reported to have shouted and yelled
    because they said the Sun and Moon were fighting; the shouting was meant to frighten
    and part the combatants.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Oroan, called the great Demon of Darkness, is reported to cause eclipses by
