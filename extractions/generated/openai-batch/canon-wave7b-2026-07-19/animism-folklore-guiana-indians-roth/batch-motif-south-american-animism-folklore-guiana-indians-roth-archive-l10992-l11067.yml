canonical_text:
  quote: ''
  summary: A young man who lost his wife because of his ignorance of hunting and craft
    skills is taken by his mother to a wise old man, who teaches him for more than
    a year. After he returns skilled and prosperous, a passing woman reports his success
    to his former wife's household. The former wife, dissatisfied with her lazy second
    husband, visits with her mother and attempts to rejoin him, but he rejects her.
    The passage then adds ethnographic notes on exogamy, matrilineal descent, cousinship
    restrictions, and childbirth ordeals that resemble puberty and menstruation ordeals
    through food restrictions, pain endurance, isolation, water, fire, and cooking
    procedures.
  language: English
  quote_policy: summarized
