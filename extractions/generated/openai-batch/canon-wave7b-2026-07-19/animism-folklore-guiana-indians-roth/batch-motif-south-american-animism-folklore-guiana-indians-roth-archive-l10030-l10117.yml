canonical_text:
  quote: ''
  summary: The passage describes customs used when people first encounter striking
    natural landmarks or new regions. Tobacco, pepper, lime, indigo dye, or water
    may be applied to the eyes, or the eyes may be shut or turned away, to avert evil,
    sickness, or attraction of a place-associated spirit. Examples are given among
    Carib, Arawak, Warrau, Island Carib, and Conibo-related reports, with additional
    tentative analogy to eye-closing in prayer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that temporary occlusion or treatment of vision occurs
    when visiting a striking natural landmark or new region for the first time.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The general explanation given is that the procedure concerns a spirit connected
    with the landmark or region and is protective or defensive against sickness or
    other evil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Carib or Caribee examples include tobacco juice, tobacco water, lime juice,
    pepper, or indigo dye applied to the eyes at hills, mountains, or rocks, or turning
    the face away to avoid looking.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: At Kaieteur, a group of Indians of all ages and both sexes received pepper
    juice in the eyes during their first passage near the Fall and a new part of the
    country.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Kaieteur pepper-juice application is described as painful for a short
    time and as producing many tears.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Present-day Arawaks visiting a new place are described as putting creek or
    river water into their eyes to placate spirits and avoid sore eyes or other sicknesses
    from Yawahus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Warraus are said to shut the eyes when first looking at a mountain to avoid
    drawing the Shadow of the Spirit toward the person.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage connects looking with drawing or dragging another's shadow and
    uses this principle to explain indigenous interpretations of photography.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage gives further cases in which the eyes or gaze of corpses, portraits,
