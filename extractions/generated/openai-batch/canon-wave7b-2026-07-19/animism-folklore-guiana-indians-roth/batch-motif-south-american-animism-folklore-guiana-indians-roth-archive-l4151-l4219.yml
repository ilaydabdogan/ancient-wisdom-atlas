canonical_text:
  quote: ''
  summary: The passage contains two adjacent transformation legends. In the first,
    two brothers go by corial to shoot morokot fish; the younger ignores his elder
    brother's warning to stop singing, is left on the bank, and is later found transformed
    by the Hebu into a dangerous beast that his father and elder brother shoot. In
    the second, an ethnographic note introduces a taboo against eating after nightfall;
    one of two fishers ignores a friend's warning and continues eating kokerite nuts
    after dark, becomes a Yawahu tiger, and later kills his disbelieving mother.
  language: English
  quote_policy: summarized
