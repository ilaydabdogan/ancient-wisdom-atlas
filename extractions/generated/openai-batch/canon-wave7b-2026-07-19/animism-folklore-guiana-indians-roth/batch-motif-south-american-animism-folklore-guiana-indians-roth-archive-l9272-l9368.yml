canonical_text:
  quote: ''
  summary: The passage describes methods for training hunting dogs with animal-associated
    leaves, flesh, and tobacco; reports Carib, Warrau, and Arawak accounts that hunting
    binas came from great snakes; gives an Arawak story in which the serpent Oroli
    ambushes humans from between two silk-cotton trees and is killed and burned, after
    which bina plants grow from its ashes; and describes trials to identify plant
    binas and animal-remains practices for attracting bush-hogs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Young hunting dogs are washed and rubbed with a leaf named after the animal
    they are intended to hunt, and later are given a piece of that animal's flesh
    to make them more keen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A method attributed to Záparo Indians trains hunting dogs by forcing tobacco
    into the throat, nose, and mouth until the animal nearly chokes, with the stated
    aim of clearing scent and sharpening perception.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Caribs, Warraus, and Arawaks of the Pomeroon and Monica Rivers are said to
    agree that they originally obtained hunting binas from very large snakes.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Aramári snake is described as larger than the Orupéri, living in treetops,
    pouncing on prey from above, and yielding binas that can attract game, thunder,
    lightning, and rain.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Warraus are reported to say that almost all they know about binas was
    taught to them by Akawais and Caribs.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The traditions of the three named tribes are said to agree that after the
    snake was killed it was carefully burned, and from its ashes arose the plants
    now used as binas.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the Arawak account, people disappear into the forest; a large party tracks
    the latest victim to two immense silk-cotton trees, where a huge serpent is stretched
    like a bridge between the tree summits.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the Arawak account, pieces of the serpent's flesh fall to the ground and
    appear as dry firewood; when people touch the timber, the serpent pounces down
    and seizes them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Oroli is killed with blow-pipes and poisoned arrows; its carcass is covered
    with bushes and saplings and set on fire; binas grow from the ashes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: 'The efficacy of different bina plants is described as having been found by
    trial: a plant associated with unwanted or dangerous animals is discarded, while
    a plant associated with useful game is kept.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Arawaks bury unborn bush-hog young under the house to draw other bush-hogs
    toward the place, while Uaupes River Indians bury a bush-hog head where they first
    met the band so the band will return.
  category: action
  evidence_refs:
  - ev:8
