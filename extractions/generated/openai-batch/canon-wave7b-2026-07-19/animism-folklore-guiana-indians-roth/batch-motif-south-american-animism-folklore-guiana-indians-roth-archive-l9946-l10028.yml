canonical_text:
  quote: ''
  summary: The passage catalogs food restrictions and animal-related taboos among
    Guiana and neighboring South American Indigenous groups. Restrictions occur during
    eclipses, mourning, illness, physiological periods, feather-color alteration,
    sea travel, and in relation to domesticated animals. It discusses the lack of
    clear evidence for a totem-animal food taboo, gives many cases of avoided animal
    flesh, explains some avoidances through feared transfer of animal traits or effects,
    and describes prohibitions on dogs eating certain bird or mammal remains lest
    they be poisoned or lose hunting success.
  language: English
  quote_policy: summarized
