canonical_text:
  quote: ''
  summary: 'The passage describes several reported curing and exorcistic procedures
    among Guiana and neighboring Indigenous groups: piai or similar ritual specialists
    use rattles, sucking, blowing, hand passes, dark huts, spirit voices, wooden or
    straw figures, leaf bundles, tobacco smoke, special wood, and apparent extraction
    or vomiting of harmful substances to treat sickness or expel spirits.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Gahbi piai places a maraka below a sick person's hammock, sucks the parts
    where pain is greatest, and passes both hands over the patient.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Gahbi piai strikes his hands together and blows on each palm to drive
    away a Spirit said to have attached itself there.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Gahbi piai may pinch up pieces of his own skin and apply what is described
    as corpulency and good health to the patient while making passes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In a little hut built in the karbet, after lights are extinguished, medicine-men
    sing, shake the rattle, emerge from the cabin, and act as though a Spirit has
    come out.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The medicine-man may run around the karbet, tug hammocks, say he is going
    up into the skies and will return, and mimic a distant voice.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: In the Oyapok-area account, a figure called Anaan-tanha is made of soft resonant
    wood, three or four feet high, and described as frightful, with a long tail and
    big claws.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: After blowing on the sick person, piais carry the Anaan-tanha figure out of
    the hut, talk to it, and beat it with sticks to force the Spirit to leave the
    sick person; the exorcisms are performed at night after fires are extinguished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: A maize-straw manikin found among the Apalai is described as representing
    a warrior ready to shoot an arrow and fixed on two sticks arranged crosswise;
    the passage states it may have had a similar purpose.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the Makusi performance at Nappi, an old man uses two bundles of leaves,
    drives occupants out, extinguishes fires, whips the ground, howls, and conducts
    an unintelligible exchange involving a second voice identified as conversation
    with evil spirits.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: In the Makusi performance, the piai lights a cigar, blows tobacco smoke into
    the patient's face, presses a tobacco-leaf bundle onto the forehead, and does
    not use the maraka.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: In the Caracas account, a Piache licks and sucks the affected part, uses friction
    over the body, commands evil spirits to depart, rubs a special wood on the patient,
    and performs exclamations, howling, shaking, and contortions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: In the Island Carib account, tobacco incense attracts Chemeen, who answers
    in a distant-sounding voice; the sorcerer manipulates and blows on the suffering
    part, appears to extract small objects, sucks the painful part, and goes outside
    to vomit what is called poison.
  category: sequence
  evidence_refs:
  - ev:6
