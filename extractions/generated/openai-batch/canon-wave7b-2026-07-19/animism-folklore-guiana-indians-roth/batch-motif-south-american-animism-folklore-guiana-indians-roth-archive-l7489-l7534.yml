canonical_text:
  quote: ''
  summary: A man leaves his wife in a banab on a midstream island while he fishes.
    While she sleeps, a Water Spirit visits, says he has taken advantage of her, declares
    love, tells her he will take her as wife, and instructs her to blame her husband.
    She later leaves her husband at a river spot and appears with the Water Spirit
    before her mother, who brings her ornaments. The woman says she will be seen only
    indistinctly and will disappear if seen clearly. The narration adds that the Water
    Spirit had also influenced the husband to refuse the wife’s company in the corial.
    A footnote links the tale to beliefs about celibacy and relations with the Oiiyu.
  language: English
  quote_policy: summarized
