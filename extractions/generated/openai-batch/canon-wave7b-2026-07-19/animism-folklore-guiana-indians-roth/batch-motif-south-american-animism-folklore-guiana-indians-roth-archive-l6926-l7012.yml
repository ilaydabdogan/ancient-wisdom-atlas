canonical_text:
  quote: ''
  summary: The passage explains Indian beliefs in spirits connected with mountains,
    rocks, precipices, cataracts, and unusual landforms. It attributes such beliefs
    to geological peculiarities, supposed transformations of beings into stone, and
    memories of ancient events. Examples include named mountains and boulders resembling
    common objects or people, footprints attributed to the Great Spirit or to unseen
    wild men, Makonaima's action on a felled-tree mountain, Roraima streams as a mother's
    tears, and mountain-top seas guarded by white eagles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The passage states three main bases for belief in Mountain Spirits: unusual
    rock features, transformation of persons or animals into stone, and association
    with events from the long-ago.'
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: It states that many spirits are connected with mountains, precipices, rocks,
    cataracts, and similar places.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A crescent-like hill south of the Takutu River is compared by the Wapisianas
    to the moon and gives its name to Kai-irite, the Mountains of the Moon.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Schomburgk is reported as saying that Indians banish evil spirits to the Mountains
    of the Moon region, while Brazilians considered it the abode of wild Indians.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Several named mountains and rocks are described as resembling familiar objects
    or figures, including a maraka, tree stumps, a basket, a swallows' nest, a water-jar,
    and a row of women searching each other's heads.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Wayaca-piapa Mountain is identified as a felled tree that the Spirit Makonaima
    cut down during his journey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A peculiar rock in the Mazaruni River near Masanassa village resembles a human
    figure and is identified by Indians as a river-god watching for pacu.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Foot impressions on granite blocks above the Waraputa Rapids are explained
    as tracks left by the Great Spirit when he departed from the forefathers with
    whom he used to live.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: At Caro-miring, a sand-beach near a high fall bears mysterious human-like
    footprints and sand heaps that reappear after visitors trample them down and leave
    briefly.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Caro-miring footprint place is associated with wild men who are believed
    to live nearby but have not been seen.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Makusis say that torrential streams descending from Roraima are the sorrowful
    tears of the Mother of Pia and Makonaima, who was left behind on the mountain
    by Pia.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Some people say that seas full of fish and dolphins lie over the tops of Roraima
    and Kukenam and are continually circled by gigantic white eagles acting as watchmen.
  category: setting
  evidence_refs:
  - ev:10
