  text: A quoted account of the Aruacas says their object of adoration was the firmament
    or heavens, with a powerful lord and great lady in the greater heaven, and that
    souls would go with Hubuiri after death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage identifies Alubiri or Hubuiri as recognizable in later stories
    as Haburi and as Abore, called the Warrau Father of Inventions.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Alubiri and Kororomanna were Arawak and Warrau tribal
    heroes rather than deities.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Amalivaca is described in the quoted source as father of mankind or great
    grandfather, a personage of heroic times who came from afar, sculptured symbolic
    figures on rocks, and disappeared by going back beyond the ocean.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The chapter heading lists tribal heroes and stories including Alubiri or Hubuiri,
