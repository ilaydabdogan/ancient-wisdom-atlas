  quote: ''
  summary: The passage discusses how outside observers interpreted several Guiana
    mythic or tribal heroes as deities, then introduces the chapter on tribal heroes.
    It begins the tale of Hariwali, a clever piai whose wife propositions his brother,
    conceals the encounter by staging an accident, and is nevertheless understood
    by Hariwali.
