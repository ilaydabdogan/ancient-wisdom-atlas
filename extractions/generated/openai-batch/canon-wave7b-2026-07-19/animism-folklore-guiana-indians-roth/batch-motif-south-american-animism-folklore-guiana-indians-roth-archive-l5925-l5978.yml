canonical_text:
  quote: ''
  summary: The passage concludes an episode in which a man escapes Tobe-horoanna,
    the Black-skin Tiger, warns his settlement, later finds signs of massacre, gathers
    survivors, and helps kill the tiger and its offspring. It then begins the story
    titled "Bravery Rewarded with a Wife," where hunters find a dead mora tree with
    a daiha creeper, women go to gather bark, a boy climbs a manicole tree, and the
    noise of pounding bark masks the roar of an approaching immense Tiger.
  language: English
  quote_policy: summarized
