comparison_claims:
- id: claim:1
  claim: The passage explicitly presents Mount Zabang as functionally comparable to
    an Olympus-like mountain abode for the Makusis, because it is called their Olympus
    and the dwelling of Makunaima.
  claim_level: same_function
  target: Olympus-like mountain dwelling of a great spirit
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is the source author's wording; the passage does not
    develop a broader structural comparison with Greek Olympus.
- id: claim:2
  claim: The passage cautiously compares possible Guiana idol or fetish practices
    with neighboring northern island Cemi/familiar-spirit worship and western Orinoco
    idol rites.
  claim_level: same_function
  target: neighboring Cemi/familiar-spirit and Orinoco idol practices
  evidence_refs:
  - ev:9
  - ev:10
  counter_evidence_refs:
  - ev:9
  confidence: low
  limitations: The author stresses that positive evidence among the Guiana Indians
    is very scarce and that Schomburgk found no trace of idolatry or supplication
    to a fetish.
- id: claim:3
  claim: The passage compares the botuto with similar instruments among Uaupes River
    Indians used for Jurupari or Forest-Spirit festival music.
  claim_level: visual_similarity
  target: Uaupes River festival instruments producing Jurupari or Forest-Spirit music
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: The excerpt reports similarity but ends before further details; it
    does not prove identity of rite, origin, or meaning.
