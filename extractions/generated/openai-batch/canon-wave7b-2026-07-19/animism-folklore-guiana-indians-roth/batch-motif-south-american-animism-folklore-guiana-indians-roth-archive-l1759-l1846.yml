  locator: lines 1759-1763
  quote_or_summary: Pia and his mother travel, fish, and seek fruits; when she becomes
    weary, Pia carries her to the heights of Eoraima/Roraima as her resting place.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:2
  type: summary
  locator: lines 1763-1768
  quote_or_summary: Pia gives up hunting as his main occupation, travels to teach
    useful and good things, is linked with the Piai men, and disappears from men to
    remain awhile with his mother on Roraima.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:3
  type: summary
  locator: lines 1768-1774
  quote_or_summary: Before departing, Pia tells his mother to bow her head and cover
    her face with her hands while wishing; her sorrow is linked with storms on Roraima
    and streams described as her tears.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:4
  type: quote
  locator: lines 1777-1779
  quote_or_summary: Mount Zabang is described as "the Olympus of the Makusis" and
    the dwelling of their great Spirit Makunaima.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; short quotation.
- id: ev:5
  type: summary
  locator: lines 1781-1785
  quote_or_summary: Amalivaca is said to have arrived in a bark during the subsidence
    of great waters and carved sculptures high on rocks bordering great rivers.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:6
  type: summary
  locator: lines 1785-1791
  quote_or_summary: Amalivaca and his brother Vochi created the world; while making
    the Orinoco, they discussed making it flow up and down at once to help paddlers.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:7
  type: summary
  locator: lines 1791-1794
  quote_or_summary: Amalivaca's daughters liked wandering, so he broke their legs
    to make them sedentary and force them to people Tamanac land.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:8
  type: summary
  locator: lines 1794-1801
  quote_or_summary: Amalivaca levels the earth for habitation, is associated with
    music, and has a stone house or cavern near a large stone called his drum.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:9
  type: summary
  locator: lines 1812-1824
  quote_or_summary: The author says positive evidence for Guiana idol or fetish worship
    is scarce; neighboring peoples had related practices, including northern island
    Cemi or familiar spirits, though Schomburgk reported no trace of idolatry or fetish
    supplication.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:10
  type: summary
  locator: lines 1826-1830
  quote_or_summary: A western Orinoco rite is described as dancing with noisy instruments
    before two small idols, with reverence paid by chanting extemporaneous couplets.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:11
  type: summary
  locator: lines 1831-1839
  quote_or_summary: The botuto sacred trumpet is venerated in upper Orinoco, Atabapo,
    and Inirida areas; it is sounded under palm trees for fruit abundance, and initiation
    requires pure morals, single life, flagellation, fasting, and painful exercises.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:12
  type: summary
  locator: lines 1839-1843
  quote_or_summary: Few sacred trumpets exist; the Botuto of Tomo is reported as an
    object of worship common to many surrounding tribes, and fruit and intoxicating
    liquor are placed beside it.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:13
  type: summary
  locator: lines 1843-1848
  quote_or_summary: The Great Spirit sometimes makes the botuto resound or manifests
    his will through the instrument's keeper; women are forbidden to see it and excluded
    from its ceremonies at risk of life.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
  rights_note: Public domain; concise summary.
- id: ev:14
  type: summary
  locator: lines 1849-1852
  quote_or_summary: Wallace refers to similar instruments among Uaupes River Indians
    on the upper Rio Negro, used at festivals to produce Jurupari or Forest-Spirit
    music.
  source_text_path: texts/public-domain/guiana-amerindian/project-gutenberg/animism-folklore-guiana-indians-roth.md
