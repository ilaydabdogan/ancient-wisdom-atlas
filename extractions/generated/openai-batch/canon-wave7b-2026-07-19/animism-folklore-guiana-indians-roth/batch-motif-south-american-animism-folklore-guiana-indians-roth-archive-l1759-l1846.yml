canonical_text:
  quote: ''
  summary: The passage recounts Pia placing his weary mother on the heights of Roraima,
    becoming a benevolent teacher of useful arts, and later departing after giving
    his mother a ritual gesture for obtaining desired good things; her sorrow is linked
    with storms and streams on Roraima. It then notes Mount Zabang as Makunaima's
    dwelling, describes Amalivaca arriving by bark after great waters, carving river
    rocks, creating the world with his brother Vochi, shaping the Orinoco and the
    earth, restraining his daughters to people Tamanac land, and leaving stone objects
    associated with a house and drum. The passage then surveys scarce and comparative
    evidence for spirit, idol, fetish, and sacred-instrument cults, including Cemi
    familiar spirits, Orinoco idol dances, and the botuto sacred trumpet with initiation,
    offerings, spirit manifestation, and exclusion of women.
  language: English
  quote_policy: summarized
