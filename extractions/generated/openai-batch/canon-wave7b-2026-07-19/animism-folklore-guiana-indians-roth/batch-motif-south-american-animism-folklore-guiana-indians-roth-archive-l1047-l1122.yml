canonical_text:
  quote: ''
  summary: The passage narrates two sisters fleeing Tiger-man with Haburi to Wau-uta's
    house. Wau-uta shelters them, deceives Tiger, and kills him with a thorn-covered
    door. She then sends the women to gather cassava, makes Haburi grow suddenly into
    a youth, conceals his identity, and directs him to give unfair and polluted shares
    of birds to his real mother and aunt. Water-dog uncles reveal Haburi's true kinship
    and correct his behavior; Haburi reverses the bird distribution, and Wau-uta becomes
    angry.
  language: English
  quote_policy: summarized
