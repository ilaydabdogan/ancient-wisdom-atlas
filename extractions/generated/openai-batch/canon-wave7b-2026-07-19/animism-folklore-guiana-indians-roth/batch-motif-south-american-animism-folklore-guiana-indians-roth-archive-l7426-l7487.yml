canonical_text:
  quote: ''
  summary: A man catches Oriyu, a female Spirit of the Water, whose hair is tangled
    in his line. He marries her after she requires that her origin be kept secret.
    She aids his fishing until the mother-in-law reveals the secret; afterward Oriyu
    takes her husband below the waters, sends food and drink to the party, and transforms
    discarded vessels and skins into fish. A later notice says Oriyu gives a sick
    island community's chieftain materials and instruction for the first maraka and
    teaches tobacco. Another notice describes Oriyus as water spirits who visit humans
    sexually under conditions of secrecy and exclusivity, and mentions beliefs about
    water-spirit children and pregnancies.
  language: English
  quote_policy: summarized
