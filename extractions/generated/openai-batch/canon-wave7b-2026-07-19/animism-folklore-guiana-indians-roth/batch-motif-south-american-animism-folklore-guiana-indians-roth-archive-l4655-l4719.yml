canonical_text:
  quote: ''
  summary: 'A forest spirit meets a hunter in the bush and repeatedly asks him to
    fetch food and implements, but the spirit''s intended referents differ from the
    man''s: armadillos rather than land crabs, a toadstool transformed into cassava
    bread, a snake-like cooking pot, a fallen dead tree as firewood, and an opossum
    where the man sees a tiger. The hunter becomes afraid and leaves. The passage
    then gives an ethnographic note that forest spirits generally avoid sunlight,
    firelight, hearing their names, and discussion of their origins, and that Indians
    avoid telling such legends in daytime for fear of spirit punishment. Footnotes
    mention Demerara Arawak names for woody fungi and a Warrau version with analogous
    object-animal substitutions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Konoko-kuyuka meets a man hunting in the bush, asks for akara, rejects the
    man's black land crabs, and pulls two armadillos from a large hole as the kind
    of akara he wants.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the man brings ordinary cassava cakes, the spirit points to an immense
    toadstool near a tree and changes it into a cassava cake.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The spirit sends the man for a cooking pot among tree roots; the man first
    sees only a bush-master snake, then later finds a real pot painted in the snake's
    colors.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The spirit rejects the man's firewood, shakes a big dead tree until it falls,
    carries it to camp, and calls that firewood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The spirit eats his cooked armadillo quickly and says he is big, fat, and
    strong because he swallowed the whole armadillo.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: After resting, the spirit and the man hunt again, return with much game, eat,
    and smoke the remaining meat on a babracote.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At night the spirit expects a tiger to steal the meat; when a tiger comes,
    the spirit calls it a yawarri or opossum, and the frightened man leaves the spirit
    in the hammock.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that forest spirits, with rare exceptions, shrink from
    sunlight, firelight, having their names called, and having details of their origin
    discussed.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says an Indian will almost invariably refuse to tell spirit legends
    in daytime because the spirit spoken about might hear and later punish the teller.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage states that mimicking spirit voices is treated as bad, like laughing
    at spirits or mentioning their names.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: A note says that in the Warrau version of the story the Bush Spirit's requested
    peppers, hammock, and hammock-rope correspond respectively to a scorpion, a tiger,
    and a snake.
  category: relationship
  evidence_refs:
  - ev:9
