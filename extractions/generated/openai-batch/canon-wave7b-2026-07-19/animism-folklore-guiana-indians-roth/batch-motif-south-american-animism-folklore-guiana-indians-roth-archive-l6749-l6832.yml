canonical_text:
  quote: ''
  summary: A narrative tells of two sisters left at home while their household attends
    a drinking-party. A Yurokon emerges from a silk-cotton tree, brings a parrot for
    them to cook, kills the elder sister in his hammock, and searches for the younger,
    who hides in rotten corn after appealing to the Spirit of the Rot. The parents
    later avenge the death by surrounding the silk-cotton tree with fire and pepper
    smoke, causing Yurokons or baboon-like beings to fall; the killer is clubbed and
    opened, revealing woman's flesh. The passage then records Arawak and Carib beliefs
    about spirit-associated plants, snake-bush antidotes, warning plants, guardian
    spirits, and permission from a tree spirit for medicinal sap.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Two girls remained at home while the rest of the household went to a drinking-party,
    although their parents had told them to accept the invitation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: At sunset a Yurokon came out of a neighboring silk-cotton tree, carrying an
    arrow, shot a parrot, and asked the girls to cook it.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the parrot was eaten, the Yurokon slung a hammock and called for the
    younger sister; she sent the elder sister instead.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The younger sister heard noises from the Yurokon's hammock and later saw blood;
    inside the hammock her elder sister was dead.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The younger sister hid herself in a stack of mildewed and rotten buck-corn
    and warned the Spirit of the Rot not to let the Yurokon catch her.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the Yurokon asked the Spirit of the Rot about another woman, the Spirit
    refused to answer while eating the corn.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Yurokon searched for the younger sister but returned to his home in the
    silk-cotton tree when day began to break.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The survivor met her returning people and said that the komaka Yurokon had
    killed her sister; her mother replied that she should have gone with them as instructed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The parents gathered peppers, made a ring of fire around the silk-cotton tree,
    and threw peppers into the flames.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: As irritating smoke rose, small and larger baboons fell from the tree and
    were burned; the Yurokon who killed the elder daughter also came down and was
    clubbed to death.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The father stated that he was killing the Yurokon in payment for his daughter,
    and the corpse's belly was opened, revealing woman's flesh.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Arawak belief associates the Clusia grandiflora epiphyte, called kofa, with
    the spirit world and explains its aerial roots as castings of the bunia bird.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Pomeroon Arawak belief relates certain snake-bush plants to venomous serpents
    and to antidotes for snake-bites; a Demerara River account says burned snake bones
    could manure the ground from which snake-bushes grow.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:14
  text: Among the Caribs, the masiemo or kanaima Caladium is said to whistle and shake
