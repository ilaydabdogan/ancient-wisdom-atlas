canonical_text:
  quote: ''
  summary: The passage describes Kanaima attacks using wassi or massi poison, arrow,
    club, or other means; reports plant-derived powders and stick-pointing practices;
    describes bodily wasting, vomiting, and death; gives an account in which Kanaima
    changes into an acouri or deer; and explains a three-day delay before final rites,
    with methods used to prevent the victim from naming the assailant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kanaima finds a victim alone and may slay him by poison, arrow, or club.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A poison called wassi is described as extracted from the bulb or tuber of
    a plant, cut into shavings, dried, and crushed into a fine powder.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the alleged delinquent is caught asleep, the powder may be placed on the
    lips or under the nose so that it is inhaled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The described symptoms include burning in the bowels, fever, thirst, wasting,
    and death after a period of suffering.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a Mazaruni River account, a man is induced to join a fishing party, attacked
    by several men, has his limbs forced out of joint, is rubbed with white powder
    from wild tannier, and later vomits and dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Upper Pomeroon Caribs describe massi as a weed rubbed on a thin stick, which
    is pointed at the person intended to be injured.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: In the massi-stick account, the person pointed at comes toward the holder,
    falls unconscious, is covered with trisel, wakes, and later startles an acouri
    or deer after Kanaima has changed into one of those animals.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Kanaima agent avoids immediate death because a three-day interval must
    pass before rites on the victim's body can complete the agent's purification.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The victim's speech is impaired to prevent identification of the assailant;
    described methods include slitting the tongue with poisonous snake fangs, twisting
    the tongue, and inserting poisoned pills into the mouth.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
- id: obs:10
  text: If the victim dies immediately, the Kanaima agent may superficially bury the
    corpse where it fell and return after the third day for the final ceremony.
  category: sequence
  evidence_refs:
  - ev:6
