canonical_text:
  quote: ''
  summary: Kororomanna hides in a manicole tree while Hebu spirits attack a baboon
    corpse they mistake for him. The Hebus fail to cut down the tree, send a snake
    as a rope, and then send a climber whom Kororomanna kills; he uses their signal
    so the Hebus destroy their own member, then escapes. He later shelters in a hollow
    tree with a woman whose man is Snake, and avoids being killed by claiming birds,
    especially Chicken-hawk, as avenging uncles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kororomanna climbed a manicole tree sheltering his banab and left a dead baboon
    corpse inside the banab.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hebus entered the banab, believed the dead animal was Kororomanna, and
    struck it with sticks while each blow produced a booming sound.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kororomanna laughed from the tree; the Hebus heard him and found him after
    one stood on his head and looked upward.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:7
- id: obs:4
  text: The Hebus tried to cut down the tree with water-turtle shell axes and buari
    seed-pod knives, and both kinds of implements broke.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Hebus sent what they called a rope, but it was a snake; when it climbed
    within reach, Kororomanna cut off its head.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Hebus planned for one of their number to climb the tree and throw Kororomanna
    down while giving a signal.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kororomanna killed the climbing Hebu, threw down the body with the signal,
    and the Hebus below clubbed the body to pieces.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Kororomanna told the Hebus he was going into the bush and escaped; with approaching
    daylight the Hebus gave up the chase.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Kororomanna found shelter in a hollow tree where a woman warned him that her
    man was Snake and would kill him if he found him there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Snake returned before dawn, entered the tree, and said he could smell someone.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Kororomanna claimed the hummingbird, doroquaira, and Chicken-hawk as his uncles,
    saying Chicken-hawk would search for him if he died.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:12
  text: Snake let Kororomanna go because Chicken-hawk usually got the better of Snake.
  category: relationship
  evidence_refs:
  - ev:6
