canonical_text:
  quote: ''
  summary: A hunter leaves his wife at a banab and warns her not to imitate a Yawahu
    spirit’s bird-like whistle, because doing so would turn her feet into sharp stones.
    Lonely, she imitates the sound; the Yawahu angrily changes her feet and heart
    into stone, making her hostile to her husband. She tries to kill him, but he escapes
    across a creek. She mistakes an alligator for him and stabs it with her stone
    feet. After her brothers disbelieve the husband’s account, he demonstrates by
    imitating the whistle when the spirit is absent; the transformed wife comes running
    in rage, and her brothers kill her with an arrow.
  language: English
  quote_policy: summarized
