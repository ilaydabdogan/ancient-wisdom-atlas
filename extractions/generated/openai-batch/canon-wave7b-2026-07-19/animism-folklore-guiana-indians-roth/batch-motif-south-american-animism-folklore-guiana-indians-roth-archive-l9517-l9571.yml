canonical_text:
  quote: ''
  summary: 'The passage records a Warrau post-death practice, then describes animal-based
    binas and talismans among Guiana and nearby Amazonian groups: animal remains or
    eggs are burned, roasted, powdered, mixed into drinks, carried, rubbed on the
    body, or used in washing and paint to affect jealousy, sexual attraction, fertility,
    protection, strength, health, and courage.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Among the Warraus, about six days after a death, people prepare a small quantity
    of drink, cut the wife’s hair, bundle the deceased’s remaining belongings, and
    bury the belongings separately.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage describes certain animal binas as acting correspondingly to plant
    binas previously mentioned in connection with sexual matters.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Among Pomeroon Arawaks, a wife with a jealous and ill-tempered husband may
    cut off a small lizard’s head, burn it, put the ashes into water, and give the
    water to him to drink.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The stated result of the lizard-head drink is that any man or woman can make
    the husband do whatever he or she likes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: A woman who wants another woman’s husband may put pounded and roasted marabunta
    wasp eggs into his drink.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The stated result of the wasp-egg drink is that the man leaves his own wife
    and goes with the woman who used the charm.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the upper Amazons, some native, white, and half-caste women attach value
    to the skin and feathers of the papa-uira, believing these relics attract lovers
    and followers.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage reports a mythic explanation that moving bands of birds are led
    by a little gray bird called the papa-uira, which fascinates the rest and leads
    them through the thickets.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: When an Arawak woman wants an infant, her intimate friends and relatives may
    give her a mixture to drink without her knowing its contents.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The mixture given to the Arawak woman may contain roasted and pulverized cockroach
    remains, eggs of a certain spider, or an opossum paw.
  category: object
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage defines talismans as charms that repel evil, bad luck, and similar
    harms, and as charms that confer advantages of body and estate.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The listed talismanic advantages include courage, health, strength, resisting
    sickness and enemies, and craft in hunting, trade, and barter.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Among the Trios of Surinam, one person rubbed the palms of his hands with
    turalla on arrival at a feared village.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A young man traveling through the forest carried siinti in a small palm-leaf
    box attached to his neck to strengthen his head and shoulders.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: A feverish child was washed with water containing finely ground siinti, and
    later streaked with ruku paint mixed with the same material when fever returned.
  category: action
  evidence_refs:
  - ev:9
