canonical_text:
  quote: ''
  summary: The passage first tells of Aiyobanni, a Carib who enters the opened earth
    during an earthquake, lives among the Earthquake People, learns piai practice,
    returns to his mother, performs wonders, and later cures a Missionary of quartz
    crystals while concealing that he had caused the affliction. It then begins a
    new chapter and gives the tale of a lazy man who substitutes kokerite seeds for
    crabs on a crab-catching trip and is cured of laziness when his mother-in-law
    makes him eat the seeds instead of crabs. The passage ends with the start of another
    tale about a sea-bird and egg-hunting expedition.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: While a party of Caribs were shooting birds in the forest, an earthquake occurred,
    the ground opened, and Aiyobanni jumped inside to join people within the earth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aiyobanni's mother wept because she could not find him; the head-man of the
    Earthquake People told Aiyobanni that he must stay until they taught him piai
    and would later carry him back to her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aiyobanni stayed beneath the ground with the Earthquake People, learned piai
    practice, refused the girls' amatory overtures, and remained anxious to return
    to his mother.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After many years, another earthquake opened the earth and Aiyobanni returned
    to his mother; the next morning he knocked at the house-posts, and water flowed
    from their bases until it covered the ground and rose above their ankles.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Aiyobanni's fame as a piai spread after he performed wonders; a Missionary
    told him to stop, claiming that the Government paid the Missionary to be piai,
    but Aiyobanni said the Earthquake People had trained him and he could not give
    up the work.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Missionary later became ill and eventually summoned Aiyobanni, who anointed
    him; many quartz crystals came out of the Missionary's body, and Aiyobanni received
    payment while concealing that he had earlier caused the crystals to enter.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the crab tale, a group went out in a big boat to catch crabs; the lazy
    man collected kokerite seeds, filled his quakes with them, and refused to join
    the others in hunting crabs.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The companions would not give crabs to the lazy man; his wife discovered that
    he had brought kokerite seeds, and her mother boiled the seeds and made him eat
    them, which cured his laziness.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage ends with the beginning of another tale in which a house-master
    arranges a coastal expedition to hunt sea-birds and collect birds' eggs.
  category: sequence
  evidence_refs:
  - ev:8
