candidate_motifs:
- id: motif:1
  label: earlier deathless age ended by supernatural retaliation
  taxonomy_refs: []
  basis: The account begins with a time without sickness or death and later has Yurokon
    declare that human children will die after her own child is killed.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives an origin of child death specifically; broader human
    mortality is implied by the opening contrast but not developed beyond children.
- id: motif:2
  label: offended spirit mother curses childbirth and child mortality
  taxonomy_refs: []
  basis: Yurokon appears as a mother, loses her baby through human violence, weeps,
    and declares future child death and pain at birth.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The figure is called a spirit, not a deity; divine categories should not
    be assumed.
- id: motif:3
  label: etiology of difficult subsistence work
  taxonomy_refs: []
  basis: The passage explicitly contrasts easy former fishing with later troublesome
    poisoning of pools and attributes the change to Yurokon.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The etiology concerns fishing practices in this account; it is not a general
    labor-origin myth.
- id: motif:4
  label: spirit appears in human female form with child
  taxonomy_refs:
  - shapeshifter
  basis: The Yurokon is said to have appeared as a woman with a baby at the breast.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The text says the spirit appeared as a woman, but does not narrate a transformation
    process.
- id: motif:5
  label: spirit repelled or removed by named food object
  taxonomy_refs: []
  basis: Yurokon disappears when the children mention potatoes, and the note states
