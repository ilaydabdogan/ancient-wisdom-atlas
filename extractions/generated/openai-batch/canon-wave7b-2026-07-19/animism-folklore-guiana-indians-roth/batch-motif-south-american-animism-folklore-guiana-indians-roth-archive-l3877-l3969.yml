canonical_text:
  quote: ''
  summary: The passage gives a Carib account in which Yurokon, a spirit visitor appearing
    as a woman with a baby, is wronged when her child is thrown into boiling cassiri;
    she retaliates by instituting child death, childbirth pain, and difficult fishing.
    It then states that spirits are often blamed for mishaps such as spoiled drink,
    illustrated by a Warrau story in which Hebus drink from a household jar at night
    while a hidden man watches, after which the drink is thrown away and a widow reports
    a warning apparition of her dead husband.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage describes an earlier time with no contention, sickness, or death,
    when Yurokons lived among humans as friends and associates.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: One Yurokon regularly visited a Carib group to drink paiwarri and on the final
    visit appeared as a woman with a baby at the breast.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After eating hot pepper-pot with cassava, the Yurokon asked for water, obtained
    a calabash, and went to the waterside while leaving the baby at the house.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: During the Yurokon's absence, a woman in the company threw the baby into a
    boiling cassiri pot; the baby's body later rose to the surface while the Yurokon
    stirred the drink.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Yurokon wept, reproached the people, and declared that their children
    would die, childbirth would involve pain and trouble, and men would have trouble
    catching fish.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage contrasts an earlier easy fishing method, bailing out water and
    picking up fish, with a later method involving poisoning pools with roots, attributed
    to Yurokon's alteration.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yurokon killed the woman who had thrown the child into the cassiri and later
    disappeared when the woman's children mentioned sweet potatoes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note says Carib Spirits of the Bush have a marked aversion to sweet potatoes.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states generally that spirits tend to do bad and may be blamed
    for obscure mishaps, including failures in the fermentation of native drinks.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: In the Warrau story, a man visiting absent neighbors slept on manicole rafters
    in a house where a large jar of drink was being prepared for next-day festivities.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: At night the man saw Hebus enter the house, wash their skins, and drink from
    the jar.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Hebus arranged for a labba to provide music; the labba only grunted, but
    the Hebus danced and departed at daybreak.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: When the household returned, the watcher warned them that the Hebus had sipped
    the drink, and the household threw the drink away.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: A widow in the household said she had known the Hebus would spoil the drink
    because her dead husband had appeared to her while she was weeping and told her
    to stop crying.
  category: speech
  evidence_refs:
  - ev:13
