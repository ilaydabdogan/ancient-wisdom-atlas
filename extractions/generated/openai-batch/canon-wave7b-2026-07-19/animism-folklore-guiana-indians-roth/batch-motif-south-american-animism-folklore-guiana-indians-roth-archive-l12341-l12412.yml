canonical_text:
  quote: ''
  summary: The passage includes a note on mother-in-law avoidance; a narrative in
    which Makanauro, a medicine-man, visits his wife's sky-dwelling Carrion-crow relatives,
    performs difficult feats, survives their attempt to burn the world by bringing
    rain through cursing the black kurri-kurri, and then is threatened by his wife
    and son; and ethnographic notes on piais or medicine-men as keepers of traditions,
    name-givers, healers, and ritual opponents of spirit-caused disease.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Before European contact, it was described as taboo for an Indian to enter
    his mother-in-law's apartment, remain in the same room with her, speak with her,
    or look at her.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A mother wants to show her husband and child to her own people and says they
    must go to her father's place up and beyond the clouds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The wife's relations are identified as Carrion-crows, and they ask the husband
    to perform several seemingly impossible feats, all of which he completes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Carrion-crows become jealous and decide to kill Makanauro; Makanauro,
    described as a medicine-man, knows of their plan.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Makanauro returns to his old home with his wife and son and gathers neighboring
    birds to prepare for the Carrion-crows' attack.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Carrion-crows try to win by stratagem by starting fires around the area
    with the aim of burning the whole world along with Makanauro and his allies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Makanauro sees the black kurri-kurri flying high and directs the other birds
    to curse her; rain falls and the fires are extinguished.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Makanauro's wife becomes angry after he frustrates the Carrion-crows, and
    she sends her son to waylay and kill him; the narrator says the outcome is unknown.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Piais are said in some cases to be guardians of tribal traditions, and old
    wise men called Cemetu assemble in meeting houses to recount ancestral traditions,
    exploits, ancient events, and matters concerning the heavens, sun, moon, and stars.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Medicine-men give names to children and, when they successfully cure a sick
    child, may give the child a new name to make a fresh start in life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The chief work of the doctors is described as counteracting evil designs of
    Spirits, Kanaima or others, that cause diseases not resolved by ordinary household
    treatment.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Disease not readily responding to treatment is ascribed to Spirits acting
    directly or indirectly by maliciously inserting thorns, pointed bones, and similar
    things into the patient's body; the medicine-man can learn the cause and how to
    combat its effects.
  category: relationship
  evidence_refs:
  - ev:7
