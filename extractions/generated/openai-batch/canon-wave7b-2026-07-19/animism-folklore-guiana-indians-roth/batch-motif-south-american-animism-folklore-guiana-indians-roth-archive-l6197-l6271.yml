canonical_text:
  quote: ''
  summary: 'The passage contains several brief episodes: a man loses an ant-eater
    carcass because it was only sleeping; a medicine-man leader changes into a bunia
    bird and teaches people to use paddles broadside; a slothful man ignores warnings
    about giant bats and is reduced to bones overnight; and a man ignores a warning
    about a beautiful canoe and is carried away forever.'
  language: English
  quote_policy: summarized
