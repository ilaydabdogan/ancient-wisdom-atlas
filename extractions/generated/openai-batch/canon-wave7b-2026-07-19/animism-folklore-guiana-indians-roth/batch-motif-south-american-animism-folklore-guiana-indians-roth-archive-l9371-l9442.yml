canonical_text:
  quote: ''
  summary: 'The passage describes several Guiana and nearby Indigenous charm practices
    called binas: using a caught small fish to attract larger fish, treating a slain
    beast so its spirit will attract others, feeding a roasted ant in cassava to a
    hunting dog, applying plant charms for love, fidelity, return, affection, family
    recall, and quarrel pacification, drinking a fungus infusion for conception, avoiding
    double fruit because it would mean twins, and introducing a following legend involving
    binas.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unlucky Pomeroon Arawak fisherman may remove a small fish from the hook,
    blow into its mouth, and ask it to tell larger fish to come; he does not release
    it because it is believed it would warn others not to bite.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Three fish are named as acting as binas: wó-shi or sun-fish, shibaui or patwa,
    and hura-diro.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: A reported Caracas procedure has an Indian open a slain wild beast's mouth
    and pour intoxicating liquor down its throat so its soul or spirit will tell others
    of its species about its reception and encourage them to come.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A roasted ant called kudu-kudu-barilya is placed inside cassava and given
    to a dog to make it a good hunter; the dog is also trained to enter holes by having
    food placed inside a cassava-squeezer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage classifies another group of binas as relating to conjugal rights,
    mutual love and affection, and babies; plant binas in these roles are said to
    be mostly caladia.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: An Arawak young woman may plant hiaro-bina in a secluded place, bathe with
    or carry its leaf, secretly rub it on her lover's hammock, or rub her own hands
    with it before touching him; the procedure is said to depend on the man's ignorance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: With kurua-bina, a woman bathes with the leaf, keeps the bathing water, strews
    it on the path her sweetheart will travel, and tells it to make him return soon.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A male Arawak may carry the leaf of wajili or man-bina in order to brush it
    over a girl's face or shoulders when he thinks she is inclined toward other men.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Among Pomeroon practices, wai-iru is squeezed in water, rubbed on oneself,
    and the used water is thrown toward the desired person while calling the person's
    name.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Wamba is used by a father for an absent elder son or by a mother for an absent
    elder daughter by taking a leaf to the hammock and calling the child's name.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Akami is rubbed over the head and face when someone comes to quarrel, with
    the stated effect of making that person amicable and friendly.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Among the Surinam Kalinas, turalla is rubbed on the hands and face to evoke
    affection; an example given is a woman using it while her man is traveling so
    that he may not forget her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: An Arawak or Warrau woman desiring a baby may pound a certain fungus in water
    and drink the infusion; the fungus is identified as Nidularia and named as a baby-plenty
    charm.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The women described do not eat double-fruit because it would mean twins for
    them.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage ends by announcing a following legend that contains reference
    to the application of binas.
  category: sequence
  evidence_refs:
  - ev:11
