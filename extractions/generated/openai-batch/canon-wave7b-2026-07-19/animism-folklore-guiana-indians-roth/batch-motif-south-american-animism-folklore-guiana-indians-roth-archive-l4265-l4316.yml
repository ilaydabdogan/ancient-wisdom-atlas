canonical_text:
  quote: ''
  summary: While their parents and brothers are away at a drink-party, two girls hear
    a strange cry near the creek. The cry is Siwara, a Hebu or Bush Spirit, imitating
    an oto bird. After the girls challenge the cry to show itself or kill something,
    Siwara appears as a young man, is hosted by the girls, brings a powis, sleeps
    in the house without troubling them, and warns them not to tell their parents.
    The girls conceal the visit, but their father finds a kokerite arrow fragment
    in the cooked bird and learns the truth. He has the girls summon Siwara, welcomes
    him, offers him the elder daughter, and the mother consents. Siwara becomes a
    good husband and son-in-law, brings back game, and teaches his wife’s brothers
    how to shoot bush-hog.
  language: English
  quote_policy: summarized
