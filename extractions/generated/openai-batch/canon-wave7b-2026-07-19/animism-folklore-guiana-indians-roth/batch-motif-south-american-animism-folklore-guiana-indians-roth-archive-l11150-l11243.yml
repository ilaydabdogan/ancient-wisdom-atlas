canonical_text:
  quote: ''
  summary: The passage describes birth-related fasting, scarification, feeding, couvade,
    isolation, impurity, taboos, and purification procedures among several Guiana
    and neighboring Indigenous groups. A father or husband may undergo scarification
    or flogging after birth, with blood or courage connected to the child. Fathers,
    and in some groups both parents, undertake lying-in, dietary restriction, hammock
    seclusion, or avoidance. The mother’s delivery may occur in a secluded place,
    and her isolation may end after bathing. The passage also records beliefs about
    postpartum uncleanness, danger to visitors’ dogs or infants if restrictions are
    broken, ritual smoking of paths and water, and removal of objects from a house
    after birth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At the conclusion of a fasting period, a male parent is scarified on the shoulders
    with agouti teeth without complaint, and his endurance is linked to the future
    valor of his son.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Blood from the scarification is not allowed to fall to the ground and is smeared
    on the child’s face to make the child courageous.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The end of the fast includes seating the man on a red-painted seat, women
    bringing food, old men placing small pieces of cassava and fish in his mouth,
    and controlled drinking.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that scarification and flogging ordeals of puberty are
    repeated on the Carib father after his wife’s delivery of a boy or girl, with
    the stated aim of transferring courage to the children.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the described Carib and Galibi procedures, sponsors or others scratch,
    cut, scarify, paint, rub, or whip the father, using agouti teeth, fish-bones,
    roucou leaves, pepper seeds, tobacco juice, or a whip.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: After the birth of a baby, isolation of one or both parents is described;
    the father’s lying-in is called couvade and is said to occur among Arawaks, Warraus,
    Caribs, Makusis, and Wapisianas.
  category: other
  evidence_refs:
  - ev:4
- id: obs:7
  text: In Mainland Carib and Island Carib examples, the husband may sling his hammock
    high or go to bed, complain, act as though delivered, and follow dietary restrictions.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Among the Caribs, Arawaks, and Warraus as described, the husband is chiefly
    isolated, while the woman’s isolation is limited to actual delivery and ends after
    a bath; delivery may occur in the bush, a shelter, or a partitioned compartment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Among the Makusis and Wapisianas as described, both parents lie in after birth,
    using hammocks and in some cases a partition; the Makusi father remains in his
    hammock until the navel-string falls off.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: During lying-in or couvade, the mother or father may be considered unclean,
    and this uncleanness may be regarded as persisting afterward.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: Specific restrictions and dangers include a visitor’s dogs dying after entering
    a couvade house, an infant dying if the father has sexual relations with another
    woman during the couvade period, and women avoiding the Wapisiana lying-in woman
    after providing fire and cups.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: On the upper Tiquie River, a grandmother smokes the path to the water and
    the water itself before the parents’ first bath; among Uaupes River Indians, household
    objects are removed from the house until the next day after a birth in the house.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The author says that among the Caribs he obtained a trace of an idea of the
    male acting as the parturient parent.
  category: other
  evidence_refs:
  - ev:9
