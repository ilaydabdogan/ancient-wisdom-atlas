canonical_text:
  quote: ''
  summary: The passage introduces plant-associated bush spirits and reports beliefs
    about human origins from plants and two converse cases of humans or spirits becoming
    plants. In an Arawak account of the first Makuari whips, two sisters find a whip
    inside a split log, make copies, hide the whips, are discovered through a hummingbird
    messenger, and eventually hand the whips to their brothers, who transform them
    into Kuiaua thread and Ite fiber used for later whips. In a Yahuna Jurupari origin
    story, the boy Milomaki comes from the Water-house of the Sun, kills listeners
    through his song, is burned by relatives, ascends in spirit, and from his ashes
    grows the first Paxiuba palm, whose wood is made into flutes repeating his melodies;
    men play these flutes during fruit-ripening rites, while women and children must
    not see them.
  language: English
  quote_policy: summarized
