  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A long green leaf grows from Milomaki's ashes and becomes the first Paxiuba
    palm.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: People make large flutes from the Paxiuba palm; the flutes produce the same
