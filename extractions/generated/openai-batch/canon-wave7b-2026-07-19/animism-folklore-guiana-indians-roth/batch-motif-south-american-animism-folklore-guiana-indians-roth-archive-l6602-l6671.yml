- id: obs:2
  text: Two sisters go to cut firewood, split a log, and find a small whip inside
    it; each sister then makes another whip like the first.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sisters place three whips in a small banab in their provision field and
    repeatedly leave their share of prepared drink there.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The brothers suspect the sisters, send a hummingbird to investigate, and receive
    a report that drink and three whips are in the banab.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The brothers ask to try or view the whips; after the sisters show that they
