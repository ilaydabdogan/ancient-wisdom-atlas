canonical_text:
  quote: ''
  summary: 'The passage describes medicine-man or piai training and installation practices:
    payment, fasting, swallowing herbal pills, endurance of hunger, thirst, pain,
    seclusion, tobacco-drinking ordeals, ritual fainting, possible death or survival,
    spirit flight to Chemeen, special headdress use, and later professional invocation
    of game spirits through fire, tobacco, maraka, and ventriloquized speech.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tulujay is described as a celebrated medicine-man in the forest of Casiabo;
    people came to him, but his teaching required payment and a rigorous forty-day
    fast.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A disciple who completed Tulujay's fast was made to swallow three small herbal
    pills without chewing; the pills were said to be an antidote to poison.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: During training, an apprentice was taught to endure hunger, thirst, and pain
    without complaint.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pain ordeals included ant-biting, cutting the body, scraping with acouri teeth,
    and placing ants in plaited mats or girdles tied to parts of the body.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Some prospective medicine-men had to avoid contact with Europeans; west of
    the Orinoco, candidates were secluded for two years in forest caverns, ate no
    animal food, saw no one, and were instructed at night by old Piaches or doctors.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage reports claims that magic stones were placed in the novitiate's
    head and that after years of probation the novice returned skeleton-like.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: At a Cayenne public installation, an aspirant drank a calabash of tobacco-juice,
    often swooned, was carried to a hammock, and was acclaimed Piai if he survived.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: In Island practices, a novitiate drank tobacco-juice until fainting; people
    said his spirit had gone to Chemeen, then rubbed his body with gum and covered
    it with feathers so he could fly to Chemeen.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Among Pomeroon District Arawaks and Warraus, the aspirant apparently wore
    a special cotton headdress at installation; another cited account places piai
    installation on the night before marriages.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: A medicine-man, seated on his professional stool with maraka in hand, lit
    a fire, ignited tobacco, and invoked spirits of desired game to learn where game
    could be found.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The medicine-man spoke to the game spirits and answered for them in their
    supposed tones, with the belief that possession allowed them to answer through
    him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage states a belief in interdependence between priesthood and animal
    life and cites an Accawoi huntsman-sorcerer thought to control certain birds and
    animals.
  category: relationship
  evidence_refs:
  - ev:7
