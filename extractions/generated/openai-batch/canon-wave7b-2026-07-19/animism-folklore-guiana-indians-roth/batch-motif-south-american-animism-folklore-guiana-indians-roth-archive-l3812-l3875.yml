canonical_text:
  quote: ''
  summary: A concealed wife is discovered, and men attempt to kill her husband to
    secure her. After being tied in a corial and cast to sea, the husband is released
    by Tiger, aided by Spirits, repeatedly killed by his wife and her keeper, and
    repeatedly restored to life by a Spirit. He finally destroys the wife and paramour,
    whose relatives cannot revive them. The passage then describes Forest Spirits
    as ambivalent beings, some derived from old medicine-men, invoked by the piai,
    and associated with diagnosis, healing, and the introduction of ritual or dance
    objects in Arawak and Akawai traditions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman avoids bathing with the others and waits until she can bathe alone;
    two people keep watch and discover that the newcomer is a woman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: After discovering the woman, the group determines to kill her husband in order
    to secure possession of her; two attempts fail before they tie him in a corial
    and let it drift to sea.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The sea casts the corial back to shore, and Tiger gnaws through the ropes,
    frees the captive, threatens punishment, and then lets him go after the man pleads
    that he has already been punished by losing his wife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The husband reaches a house where the house-master welcomes him, provides
    a stool and food, is revealed as a Spirit, summons another Spirit, and sends the
    man with that Spirit to find his wife.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wife is living nearby with a keeper; when she and the keeper recognize
    the husband, they chop him up with an ax, and the Spirit friend restores him to
    life.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The couple kill the husband a second time and he is made whole again; after
    a third killing, the keeper burns the body and scatters the ashes, and the Spirit
    gathers the ashes in a palm leaf and makes them into a living person again.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:7
  text: The restored husband destroys his wife and her paramour; their friends and
    relatives try to reassemble and revive them but fail, and the passage states that
    only Spirits can perform such revivification.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Certain Forest Spirits are said to come from the bodies of old-time medicine-men,
    and the present-day celebrant invokes them with a rattle.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Some Forest Spirits assist the piai by giving information about the source
    of illness, confer blessings and gifts, introduce a femoral-bone flute and leg-worn
    nutshell lacework, and are associated with healing in the Jurupari festival.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The passage describes Forest Spirits as having both good and bad qualities,
    and says the Caribs admit responsibility for the introduction of pain, misery,
    and death.
  category: attribute
  evidence_refs:
  - ev:8
