canonical_text:
  quote: ''
  summary: The passage describes rites involving temporary occlusion or irritation
    of the eyes, whipping of novices, and beating or offering branches at rocks associated
    with rock spirits. It also records eye-closing as a hostile gesture among Warraus
    and Arawaks, and gives a Carib story in which a younger brother instructs his
    mother to shut her eyes and wish, producing a field, house, rejuvenation, the
    arrival of the elder brother, and paiwarri. A brief Makusi parallel is noted in
    which Pia tells his mother to bow her head and cover her face while wishing.
  language: English
  quote_policy: summarized
