canonical_text:
  quote: ''
  summary: The passage describes a ceremony involving Cemis, powder, a round table,
    and a two-branched cane used for snuffing. It then characterizes zemis as messenger-like
    subordinate beings with powers related to crops, childbirth, and healing, and
    compares Island Arawak Cemi/zemis with Island Carib Chemin, mainland Arawak piai
    terminology and apparatus, mainland medicine-man effigies, invoked healing beings,
    and a speculatively related Baby Spirit associated with couvade.
  language: English
  quote_policy: summarized
