canonical_text:
  quote: ''
  summary: The passage recounts two Koneso episodes. Koneso, a rabbit-like figure
    initially with short ears, cannot be harmed by weapons. Seeking a nafudi's daughter
    as wife, he is required to bring alligator and camudi eyes, which he obtains by
    luring the creatures with flute music and intoxicating them. The nafudi refuses,
    pulls Koneso's ears long, and repeatedly fails to kill or exile him; finally he
    gives Koneso the daughter. Later Koneso deceives Tiger by falsely warning of a
    coming wind and tying him to a tree. A carrion-crow eventually frees Tiger in
    exchange for a future share of meat, explaining why Tiger leaves meat for the
    carrion-crow.
  language: English
  quote_policy: summarized
