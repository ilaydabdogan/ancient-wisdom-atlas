canonical_text:
  quote: ''
  summary: 'The passage discusses the Guiana piai or medicine-man: a quartz chest
    ornament, hereditary and trained succession, possible payment for professional
    secrets, disputed reports about epileptic trainees, ecstatic states produced by
    narcotic powders, female piai, taboo spirit-houses or consulting rooms, and comparative
    notices about ritual buildings. It then introduces legends of the original piai
    known among Arawaks, Warraus, and Caribs, saying tobacco was brought from the
    islands, and begins a Warrau story titled ''The Hummingbird with Tobacco for the
    First Piai,'' involving the infant Kurusiwari and a hammock-weaving step-mother.'
  language: English
  quote_policy: summarized
