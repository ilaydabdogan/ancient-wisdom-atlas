canonical_text:
  quote: ''
  summary: 'The passage recounts episodes involving Pia and Makunaima: their stay
    with an old woman who is really a frog and whose cassava comes from a spot on
    her body; their encounter with Maipuri the tapir and a celestial explanation for
    Maipuri, Makunaima, and Makunaima''s severed leg; Makusi variants involving the
    Sun, Alligator, a woman made from a wild plum tree, Mother Toad, Tiger, and the
    unborn heroes; and later actions in which Pia restores his mother, Makunaima interacts
    with fire, the brothers travel by canal and corial, learn fire-making from Crane,
    make waterfalls by placing rocks, and quarrel with Crane.'
  language: English
  quote_policy: summarized
