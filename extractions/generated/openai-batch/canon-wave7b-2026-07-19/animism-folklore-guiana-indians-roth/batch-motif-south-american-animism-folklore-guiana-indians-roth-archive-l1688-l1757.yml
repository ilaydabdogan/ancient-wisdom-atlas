  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Pia and Makunaima stay at the house of Maipuri the tapir and trace her feeding
    place to a plum-tree.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The boys shake the plum-tree so that ripe and unripe fruit falls and is wasted;
