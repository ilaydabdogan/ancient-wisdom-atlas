canonical_text:
  quote: ''
  summary: The passage presents Budge's account of later Egyptian trust in Osiris
    as a partly divine and partly human being who raised himself from death without
    corruption and could grant mortals everlasting life. It cites Thothmes III addressing
    Osiris as divine father and hoping not to decay. It contrasts earlier magical
    words and ceremonies with later dependence on Osiris alone for rebirth and resurrection.
    It also says Osiris uniquely combined ethical, creative, and vivifying attributes,
    notes Ra and some gods being called “One,” and begins a statement that Vth Dynasty
    texts describe Osiris as weighing words and inquiring into deeds.
  language: English
  quote_policy: summarized
