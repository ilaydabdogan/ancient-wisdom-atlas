canonical_text:
  quote: Thereupon Unas ate them, and in eating them he also ate their words of power
    and their spirits.
  summary: The passage discusses Budge's interpretation of Pyramid Text material in
    which the dead king Unas is treated as a divine heavenly lord, is associated with
    bull-like fecundity and victorious power, receives a conquered enemy through Horus
    and Thoth, and consumes gods who have been snared, judged, bound, slaughtered,
    butchered, and cooked. By eating their bodies, words of power, and spirits, Unas
    becomes a supreme Sekhem/Ashem and travels through the double sky and regions
    of Egypt.
  language: English
  quote_policy: quoted
