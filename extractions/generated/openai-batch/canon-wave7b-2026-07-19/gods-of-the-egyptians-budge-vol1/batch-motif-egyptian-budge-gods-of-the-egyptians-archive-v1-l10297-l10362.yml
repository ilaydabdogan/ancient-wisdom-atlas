canonical_text:
  quote: ''
  summary: The passage describes a Tuat episode in which Ra’s words render the crocodile
    Ab-sha-am-Tuat helpless, allowing Osiris and the followers of Osiris to look at
    the Sun-god safely. It then describes the Eighth Hour, Nebt Ushau, where Ra travels
    by boat under Mehen’s protection, hidden gods and spirits emerge from their abodes,
    mummified dead beings revive at Ra’s words, and nine mummified follower-beings
    attack Ra’s enemies when called by name.
  language: English
  quote_policy: summarized
