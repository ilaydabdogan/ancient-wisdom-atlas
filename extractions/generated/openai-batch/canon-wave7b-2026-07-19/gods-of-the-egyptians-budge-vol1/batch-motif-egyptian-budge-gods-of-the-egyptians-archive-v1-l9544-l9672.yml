    piloting his boat through the hall to the Tuat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Souls of the dead are described as waiting in an intermediate place for the
    chance to enter Ra’s boat and continue their journey.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The quoted descriptive text says the god enters from earth into the drrit
    of the western horizon and must travel one hundred and twenty dtru in the country
    of the Tuat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ra gives fields to gods in his following and begins to pass decrees and give
    commands about things done in the Tuat by the gods of that country.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The descriptive text says that doing these things according to the similitude
    of hidden things of the Tuat and recognizing them as similitudes of the great
    god benefits a person on earth and in the great Tuat.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The region of the First Hour is called a country and is stated to be 120 dtru
    in length; Budge interprets this as a measured region of the sunset traversed
    by Ra in the first hour.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Second Hour is named Shesat maket neb-s, translated as “She who knoweth
    how to protect her lord.”
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Second Hour descriptive text says the great god arrives in Ur-nes, a country
    with stated length and width.
  category: setting
  evidence_refs:
