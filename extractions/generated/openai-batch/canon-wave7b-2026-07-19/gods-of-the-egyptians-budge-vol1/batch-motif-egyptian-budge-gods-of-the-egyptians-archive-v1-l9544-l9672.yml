candidate_motifs:
- id: motif:1
  label: Mapped journey through the Tuat by night hours
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage describes named night hours, local guides, measured regions,
    the western horizon entrance, and Ra’s boat traveling through successive Tuat
    countries.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage is Budge’s descriptive synthesis and includes some damaged
    or incomplete quoted material.
- id: motif:2
  label: Divine boat as underworld conveyance
  taxonomy_refs:
  - ark_vessel
  basis: Ra travels in a boat through the Tuat, pilots guide it, dead souls seek to
    enter it to continue their journey, and the Boat of Earth is named as Ra’s boat
    when it reaches earth.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:10
  confidence: medium
  cautions: The available taxonomy label 'ark_vessel' is broader than the Egyptian
    solar barque described here; no flood ark is present.
- id: motif:3
  label: Ritual and hidden knowledge aiding the dead
  taxonomy_refs:
  - wisdom
  basis: The passage says recognizing hidden Tuat similitudes, knowing names of the
    Souls of the Tuat, making offerings, and knowing divine words bring benefit on
    earth, in the Tuat, and after death.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The passage does not frame this as forbidden knowledge or initiation,
    only as beneficial ritual and textual knowledge.
- id: motif:4
  label: Serpent adversary of the solar god
  taxonomy_refs:
  - serpent
  basis: The Eater of the Ass is identified as a great serpent of darkness, probably
    Apepi, in continual war with the Ass form of the Sun-god.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The identification with Apepi is presented as probable rather than certain
    in the passage.
- id: motif:5
  label: Four divine supports of heaven and cardinal quarters
  taxonomy_refs: []
  basis: The four children of Horus are said to have tresses that become pillar-sceptres
