  text: A celestial female personage changes every hour and represents the local goddess
    of one hour, who guides the god through one portion of the Tuat and instructs
    the boat captain how and where to sail.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The First Hour dwellers include apes who open the doors of the drrit to the
    god.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
