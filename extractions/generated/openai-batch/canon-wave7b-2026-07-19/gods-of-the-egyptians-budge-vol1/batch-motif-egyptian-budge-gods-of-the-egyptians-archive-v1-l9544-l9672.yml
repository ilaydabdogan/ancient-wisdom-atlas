canonical_text:
  quote: ''
  summary: The passage describes the First and Second Hours of the night journey through
    the Tuat. An hourly goddess guides the god’s boat through her district. In the
    First Hour apes open doors, other beings sing praises and pilot the boat, and
    dead souls wait to enter Ra’s boat. The descriptive text says Ra enters the western
    horizon region, travels a measured country, gives fields, issues decrees, and
    that knowledge of the hidden similitudes benefits the knower. The Second Hour,
    named as a protecting female figure, is associated with Ur-nes, Souls of the Tuat,
    offerings, knowledge of divine words, and after-death benefit. The passage also
    explains the long-haired children of Horus as cosmic supports, identifies an Eater
    of the Ass with a serpent of darkness in conflict with a solar ass, and summarizes
    iconography of four boats preceding Ra’s boat.
  language: English
  quote_policy: summarized
literal_observations:
