- id: obs:11
  text: The passage says that knowing the names of the Souls of the Tuat and making
    offerings to them on earth will bring greatly multiplied benefit after death,
    and that knowing the words addressed by gods to the great god is useful in the
    Tuat.
  category: speech
  evidence_refs:
