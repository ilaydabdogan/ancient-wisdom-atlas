  quote: '"beyond measure scrupulous in all matters appertaining to religion"'
  summary: Budge introduces Egyptian religious practice through Herodotus' account
    of Egyptian scrupulousness, compares Egyptian observance with Babylonian religion,
    discusses animal veneration and funeral observances, and criticizes Juvenal's
    partial misunderstanding of Egyptian animal symbolism.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Herodotus is reported as saying that Egyptians were extremely scrupulous in
    religious matters after observing their ceremonies, their honoring of gods, and
    their obedience to priests' commands presented as divine revelations.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Egyptians worshipped many animals, birds, and reptiles
    with seriousness and earnestness.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Herodotus is described as not scorning Egyptian animal worship because he
    perceived sincerity and firm belief beneath practices that appeared foolish.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says Babylonians, both Sumerian and Semitic, were devoted worshippers
    with an old and complicated religious system, while Egyptians are described as
    even more scrupulous than their neighbors.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Egyptian monuments are said to show that religious festivals and duties connected
    with the gods absorbed much of the nation's time and energy from the earliest
    to the latest periods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage says funeral ceremonies and services commemorating the dead were
    performed at tombs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The cited passage from Juvenal lists Egyptian veneration or fear of crocodile,
    ibis, dog-headed ape, cat, fish, dog, leek, onion, sheep, and goat, and includes
    a claim about human flesh.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Budge states that crocodile, ibis, dog-headed ape, and fish were venerated
    in dynastic Egypt not as mere animals but as abodes of gods.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says peculiar sanctity was attributed to leek and onion in certain
    localities, but neither vegetable was generally worshipped throughout Egypt.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says there is no monumental evidence for the eating of human flesh
    and rejects the claim that predynastic Egyptians ate the flesh of the dead and
    gnawed their bones.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: An analogy is given of an Indian visitor who mistook lamb figures in English
    churches for idolatry; the passage says many nations regard animals as symbols
    of gods and divine powers.
  category: relationship
  evidence_refs:
  - ev:7
