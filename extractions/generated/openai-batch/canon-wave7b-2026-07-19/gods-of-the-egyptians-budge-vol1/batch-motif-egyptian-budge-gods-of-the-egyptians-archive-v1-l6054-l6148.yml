  quote: '"God [is] the judge of the right."'
  summary: 'The passage presents precepts attributed to Khensu-hetep: God judges rightly,
    gives subsistence, and should receive human devotion. A father or writer reminds
    his son of his mother''s burdens in pregnancy, nursing, and schooling, instructs
    him to raise his own child similarly, and warns him not to wrong his mother because
    God may hear her prayers against him.'
