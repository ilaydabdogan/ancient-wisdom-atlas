canonical_text:
  quote: ''
  summary: A fragmentary interlinear passage presents a first-person divine speaker
    describing the coming-into-being of Shu and Tefnut from himself and from Nu, the
    primeval watery abyss. It links vegetation, reptiles, and mankind with divine
    tears and the crying eye. Shu and Tefnut give birth to named deities, whose children
    create beings, invoke the speaker's name, and make words of power to overthrow
    Apep. Apep is bound by Aker, struck by Ra, overthrown, wounded, and left on his
    back.
  language: English with Egyptian transliteration
  quote_policy: summarized
