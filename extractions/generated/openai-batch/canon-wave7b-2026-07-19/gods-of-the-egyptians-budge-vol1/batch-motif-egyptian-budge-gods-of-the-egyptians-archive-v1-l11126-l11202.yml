canonical_text:
  quote: ''
  summary: Budge discusses Egyptian ideas of the annihilation of the wicked in the
    Tuat, emphasizing fiery punishment imagery, the absence of an Egyptian doctrine
    equivalent to medieval eternal hell, the importance of bodily preservation and
    prayers against the “second death,” and a comparison with later Hebrew and Coptic
    hell imagery. The passage then quotes a Coptic Pistis Sophia description in which
    Mary asks Jesus about outer darkness, described as a world-encircling serpent
    containing twelve halls of punishment governed by animal-faced rulers.
  language: English
  quote_policy: summarized
