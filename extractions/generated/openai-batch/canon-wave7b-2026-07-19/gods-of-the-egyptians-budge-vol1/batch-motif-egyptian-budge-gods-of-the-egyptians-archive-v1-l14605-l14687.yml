canonical_text:
  quote: '"son of the Sun"'
  summary: 'The passage summarizes evidence for Vth Dynasty royal association with
    Ra: Userkaf is said to have added the title “son of the Sun,” the Westcar Papyrus
    presents Userkaf, Sahu-Ra, and Kakaa as sons of Ra by Rut-tetet, and later royal
    birth scenes are described as showing Ra or Amen-Ra fathering royal children,
    who are then acknowledged as divine. It also describes the political power of
    Ra’s priesthood, the dominance of Ra worship, the absorption of local gods into
    the Heliopolitan system, and later Heliopolitan cult features including Ra, Horus,
    Temu, the Bull of Mnevis, and obelisks.'
  language: English
  quote_policy: quoted
