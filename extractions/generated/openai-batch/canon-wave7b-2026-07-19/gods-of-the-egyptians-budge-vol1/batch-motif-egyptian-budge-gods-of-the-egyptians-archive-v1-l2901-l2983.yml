canonical_text:
  quote: ''
  summary: The passage discusses composite animal-gods and fabulous monsters, proposing
    that Egyptians may have imagined beings combining the powers of different animals
    or may have misunderstood animals known only by report. It describes examples
    such as Setcha, a human-headed winged leopard, Apep as a huge serpent prototype,
    Babylonian and Assyrian composite guardians, Ezekiel's four-faced and four-winged
    animals, the scarabaeus as self-produced, and the Sphinx as a man-headed lion.
  language: English
  quote_policy: summarized
