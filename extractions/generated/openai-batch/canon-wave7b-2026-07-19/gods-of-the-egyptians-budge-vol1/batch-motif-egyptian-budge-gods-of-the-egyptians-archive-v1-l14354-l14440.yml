canonical_text:
  quote: the first act of creation was the appearance of his disk above the waters
    of the world-ocean
  summary: The passage describes Ra as the ancient solar god whose first rising above
    the world-ocean begins time. It explains Egyptian ideas of the sun as fire traveling
    over waters in boats, the solar course set by Maat, Ra’s nightly passage through
    the Tuat, divine navigation by accompanying gods, and obstruction by fiends and
    monsters, especially Apep, identified with darkness and the watery abyss. A Book
    of the Dead passage is cited in which Apep is repelled and destroyed by divine
    powers.
  language: English
  quote_policy: quoted
