- id: claim:2
  claim: The passage presents a Greek interpretive comparison between Egyptian Isis/Net
    traditions and Athene/Pallas, especially through self-origination and the unrevealed
    veil.
  claim_level: same_function
  target: Athene/Pallas in Plutarch compared with Isis/Net
