canonical_text:
  quote: ''
  summary: 'The passage discusses Egyptian and later Greek traditions concerning the
    goddess Net/Neith: Book of the Dead references to her temple and associated gods;
    a rubric vignette involving a serpent, utchat eyes, and a god with Net’s face;
    claims that Net was connected with the Eye of Horus, Isis, Hathor, Rat, and the
    birth of Ra; speculation about her mystic worship and reproductive symbolism;
    the Saite priest Utchat-Heru’s account of Net to Cambyses; and Greek statements
    about Pallas/Athene, Isis, the unrevealed veil, and Net as primordial being.'
  language: English
  quote_policy: summarized
