canonical_text:
  quote: ''
  summary: The passage gives a hymn of praise to Ra in which Nut strengthens him daily,
    he passes through heaven, the Sektet boat reaches port, Isis and Nephthys greet
    and protect him, souls and directions praise him, and a serpent enemy is defeated
    and condemned to fire. It then introduces the Seventy-five Praises of Ra from
    royal tombs at Thebes and lists epithets portraying Ra as exalted Sekhem, creator,
    lord of hidden circles of the Tuat, begetter or gatherer of gods, giver of breath
    to souls, illuminator, and destroyer of enemies.
  language: English
  quote_policy: summarized
