canonical_text:
  quote: ''
  summary: Budge summarizes extracts from Egyptian wisdom texts as presenting God
    as a providential ruler who gives children, property, and food, opposes tyranny,
    values obedience, and owns the goods administered by human officials. He interprets
    sekher neter as divine plan or providence rather than fate, argues that this God
    is distinct from local Memphite gods and from Osiris, and then introduces New
    Empire wisdom material from the Maxims of Ani or Precepts of Khensu-hetep.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A governor of a city is admonished not to be hard-hearted because his office
    makes him only the guardian of provisions belonging to God.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The summarized extracts attribute to God the giving of children, property,
    and food, and describe God as opposing tyranny, loving obedience, hating disobedience,
    and expecting favored people to do good to dependents.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage describes the God in the extracts as a great and powerful being
    who rules and governs the world and provides according to his will.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The phrase sekher neter is explained as thought, plan, intention, scheme,
    or design of God; the passage interprets eating bread as occurring according to
    a divine plan decreed beforehand and rejects translating the phrase as fate.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kaqemna and Ptah-hetep are said to have lived near Memphis, with tombs at
    Sakkara; their local divine context is described as Ptah, Sekhet, and I-em-hetep.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage states that the extracts do not mention Ptah, Sekhet, or I-em-hetep,
    and argues that the God discussed cannot be Osiris because the texts are not funerary
    and the attributes do not match later descriptions of the god of the dead.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Budge argues that the God referred to is too great to be called anything other
    than God and is an entirely different being from the gods worshipped in temples.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage introduces New Empire material from the Maxims of Ani or Precepts
    of Khensu-hetep and says the extracts will illustrate the author's conception
    of God.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: One quoted maxim states that God is for making his name great.
  category: speech
  evidence_refs:
  - ev:8
