canonical_text:
  quote: ''
  summary: 'The passage describes how Egyptian local goddesses and nome-gods were
    elevated by priests and communities: Neith is treated as a feminine counterpart
    to Tem and as a self-produced mother of Ra; Uatchet and Nekhebet become heads
    of local divine companies; Hathor at Dendera receives creator and mother-of-gods
    attributes; and nome-gods are described as local Great Gods whose cults persisted
    and were restored after disruption. The passage also discusses varying ancient
    counts of Egypt''s nomes.'
  language: English
  quote_policy: summarized
