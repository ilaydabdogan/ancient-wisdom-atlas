  summary: The passage argues that Egyptian animal worship should not be explained
    as totemism. It states that Egyptians first worshipped animals as animals and
    later as habitations of divine spirits or gods. It distinguishes the worship of
    kings and deified men from the worship of country gods, then discusses nome standards
    and emblems, especially the arrows and bow associated with Nit or Neith of Sais.
  language: English
  quote_policy: summarized
