canonical_text:
  quote: ''
  summary: Budge discusses the dog-headed ape as an animal highly esteemed by Egyptians,
    associated with Thoth and with Book of the Dead sunrise scenes in which ape-formed
    dawn spirits adore and hymn the rising Sun-god. He notes uncertainty about whether
    these spirits are created daily or transform daily, then compares the pattern
    cautiously to Hebrew angels created daily to sing a hymn and cease. The passage
    then turns to Egyptian animal worship, explaining it as arising from fear of animals
    possessing strength, power, cunning, or dangerous capacities, and describes prehistoric
    Egypt as forested and inhabited by elephants, serpents, reptiles, and crocodiles.
    It closes with remarks on ivory use and an elephant figure on predynastic standards
    as a possible emblem of family, country, or tutelary deity.
  language: English
  quote_policy: summarized
