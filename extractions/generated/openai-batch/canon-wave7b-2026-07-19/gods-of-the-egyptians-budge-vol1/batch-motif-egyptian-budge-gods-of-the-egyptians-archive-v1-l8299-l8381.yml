canonical_text:
  quote: ''
  summary: 'Budge describes Egyptian ideas of the Tuat as an underworld associated
    with Osiris and Ra: blessed dead souls accompany the sun in Ra''s boat through
    the Tuat and emerge into renewed life and light. He also describes priestly efforts
    to map the Tuat, list and depict hostile beings, and compile funerary texts such
    as the Book of Coming Forth by Day, the Book of that which is in the Tuat, and
    the Book of the Pylons, including Theban adaptation of Heliopolitan doctrines
    to magnify Amen-Ra.'
  language: English
  quote_policy: summarized
