  quote: ''
  summary: A translated Egyptian creation passage presents words attributed to Neb-er-tcher
    after he comes into being. The speaker identifies himself as coming into being
    in the form of Khepera and as creator of what exists. Before heaven, earth, plants,
    or creeping things exist, he raises things from Nu, the primeval watery abyss.
    He acts through mouth, heart, charm, foundation, and will, while alone and before
    Shu and Tefnut have been produced.
