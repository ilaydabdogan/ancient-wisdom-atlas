canonical_text:
  quote: ''
  summary: The passage describes Net/Neith as a goddess associated with weaving signs,
    arrows, a shield, Sais, possible war or hunting attributes, and identification
    with several other Egyptian goddesses. It then describes Sais as her principal
    sanctuary, reports Herodotus' account of an annual lamp festival and secret mysteries
    there, connects those mysteries with Osiris' suffering, death, and burial at Sais,
    and notes evidence for the antiquity of Net's cult.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Net is described as a goddess of weaving on the basis of a word meaning to
    knit or weave and signs on her head identified as a shuttle.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The oldest and most characteristic symbols of Net are stated to be two arrows
    and a shield; she is also said to have been represented by a bow and two arrows.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The arrows and shield also served as emblems of Net's city and as symbols
    forming the name of the nome whose capital was Sais.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Net was probably originally a goddess of war or the
    chase, or connected with a local wood-spirit or hunting-spirit in the eastern
    Delta.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Net's attributes are said at times to be indistinguishable from those of Isis,
    Uatchet, Sekhet, Bast, Mut, Nekhebet, and other goddesses, and she is said to
    have been identified with them by turns.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Net's ancient and famous sanctuary was at Sais, which is also given names
    meaning House of Net and Seat of Net.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: A great annual festival in honour of Isis-Net was held at Sais.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Herodotus' account says that at evening participants placed torches and lamps
    with oil and salt in their houses and kept them burning until morning, calling
    the day the feast of lamps.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Those not attending the feast are said to honour the night at home by placing
    many tapers and candles throughout their houses; the custom is described as spreading
    through the whole region.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The reason for the lamp-lit night is described in the quoted account as a
    secret mystical and religious reason.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Herodotus describes a stone chamber at Sais with pillars engraved like palm-trees,
    two main posts, a coffin, and a tomb whose name he says he may not reveal.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Herodotus describes a low covered place or vault near the temple wall at Sais
    where Egyptians perform nighttime mysteries, about which he says he should not
    disclose what was told to him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage states that the mysteries were probably ceremonies connected with
