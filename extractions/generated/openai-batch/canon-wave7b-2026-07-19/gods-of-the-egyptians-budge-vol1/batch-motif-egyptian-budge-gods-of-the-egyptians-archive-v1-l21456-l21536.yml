  summary: The passage discusses Nekhebet as a protector connected with Mer-en-Ra,
    embalming natron from Nekheb, and Underworld care for the dead. It then describes
    Uatchet/Uatchit as a serpent goddess associated with Isis and Horus, the hidden
    birth of Horus in papyrus swamps, and iconographic forms involving the crown of
    the North, papyrus sceptre, snake, and winged serpent.
