canonical_text:
  quote: '"The winds come forth from thy nostrils, and the celestial water from thy
    mouth"'
  summary: The passage quotes and discusses a hymn to Ptah-Tanen. The hymn depicts
    Ptah-Tanen as a cosmic life-giver whose body produces wind, water, grain, fertility,
    darkness, and light; as a creator who stretches the heavens, moves the solar disk
    through Nut under the name Ra, makes lands and sea, brings Hapi, causes waters
    and grain to flourish, and drives away flame. The surrounding prose comments on
    the hymn's likely date, Theban findspot, the Memphite identity of Ptah-Tenen,
    the worship of the Ptah-Sekhet-Nefer-Tem triad at Thebes, Heliopolitan influence,
    and Memphis as Ptah's principal cult center.
  language: English
  quote_policy: quoted
