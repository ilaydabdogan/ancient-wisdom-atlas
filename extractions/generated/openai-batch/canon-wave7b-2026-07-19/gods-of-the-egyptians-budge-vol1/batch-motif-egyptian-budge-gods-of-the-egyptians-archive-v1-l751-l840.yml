  quote: ''
  summary: The passage discusses reverence for trees in Nubia, the Eastern Sudan,
    and Central Africa; beliefs that spirits inhabit trees, animals, and beetles;
    medicinal and fertility uses of beetles; the Egyptian association of the scarab
    with Ra and his boat; Egyptian ideas about hostile, beneficent, and nature-working
    spirits appearing as animals; early animal worship and attribution of intelligence
    and speech to animals and objects; and comparative Babylonian examples including
    a horse-and-ox dialogue and Tiamat creating a serpent brood.
