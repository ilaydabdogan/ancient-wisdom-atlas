canonical_text:
  quote: ''
  summary: The passage describes the Seker or Hennu Boat as a sacred funerary and
    ritual boat with a closed coffer containing the body of the dead Sun-god Af or
    Osiris. It explains its use in a sunrise festival procession directed by the high
    priest of Memphis, discusses traditions and evidence for its antiquity, compares
    it with the Sektet Boat of the sun’s daily and underworld journey, and describes
    merged Ptah-Seker iconographic forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Seker Boat is said to be often represented on sepulchral monuments and
    papyri and to have had a prominent role in solemn sacred ceremonies.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boat is described as unlike an ordinary boat, with one end much higher
    than the other and shaped like the head of a gazelle or oryx.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The center of the boat held a carefully closed coffer surmounted by a hawk
    with protecting wings stretched over it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:4
  text: The coffer contained the body of the dead Sun-god Af or of Osiris and rested
    on a framework or sledge with runners.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: At the festival of Seker, the placing of the Seker Boat on its sledge was
    performed at sunrise as the sun’s rays began to spread over the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The high priest of Memphis directed the ceremony, lifted the Seker Boat onto
    its sledge, and led priests who drew the loaded sledge around the sanctuary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that the procession symbolized the revolution of the sun
    and other celestial bodies, while also noting that no explanatory texts for the
    symbolism survive.
  category: other
  evidence_refs:
  - ev:4
- id: obs:8
  text: The boat’s name is given as Hennu, and it is said to be mentioned several
    times in the Book of the Dead.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A rubric after Chapter 64 of the Book of the Dead is reported to say that
    a composition was found in masonry below the shrine of Hennu during the reign
    of Semti or Hesepti.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: An ebony tablet made for Hemaka is described as showing a king dancing before
    Osiris in a shrine, with a figure of the Hennu Boat in the register below.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Seker or Hennu Boat is described as probably a form of the Sektet Boat,
    in which the sun sailed over the sky during the second half of the day and entered
    the Underworld in the evening.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says that Seker was identified with and merged in Ptah before
    the major development of Ra worship, and that Ptah-Seker forms show attributes
    of the double god.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: Ptah-Seker is described in one form as a man with horns, plumes, and uraei,
    and in another form as a mummy with a disk and the two feathers of Maat on his
    head.
  category: attribute
  evidence_refs:
  - ev:10
