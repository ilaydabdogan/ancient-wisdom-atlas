  summary: The passage summarizes Maspero’s view of Egyptian religion as polytheistic
    and mythologically contradictory, then argues that this view overemphasizes myth
    and predynastic survivals. The author discusses Egyptian language, Coptic Christianity,
    Greek theological vocabulary, and concludes that Egyptian myths obscured earlier
    beliefs in monotheism and immortality. The passage compares this situation with
    superstition coexisting alongside professed monotheism or Christianity in later
    Eastern religious communities.
