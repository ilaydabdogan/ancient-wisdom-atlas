canonical_text:
  quote: ''
  summary: The passage explains Budge's interpretation of Unas as the Ashem of the
    Ashemu, connecting the term with hawks and divine status. It describes Unas as
    containing the words of power and spirits of the gods, becoming the habitation
    of divine power and the firstborn of the gods, moving through heaven and being
    visibly represented by Sahu or Orion. It then discusses the idea of absorbing
    power by consuming or possessing divine body parts, especially hearts, and compares
    this with heart-protection prayers in the Book of the Dead.
  language: English
  quote_policy: summarized
