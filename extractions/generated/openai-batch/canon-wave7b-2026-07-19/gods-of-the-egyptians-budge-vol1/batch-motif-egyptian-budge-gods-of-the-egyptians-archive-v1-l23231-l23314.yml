canonical_text:
  quote: ''
  summary: Horus of Behutet destroys rebels, assumes the form of a winged sun-disk
    with uraei, and takes Nekhebet and Uatchit as serpent goddesses who consume remaining
    rebels with fire. The passage explains the cultic placement of winged disks with
    uraei over temple entrances and then comments that the legend combines an old
    Light-versus-Darkness mythic pattern with a possible historical conquest tradition
    involving armed followers and iron weapons.
  language: English
  quote_policy: summarized
