  quote: ''
  summary: The passage describes a region of the Tuat associated with Ra, Horus, Osiris,
    fiery pits, serpents, female fire guardians, desert goddesses, and punishments
    inflicted on the enemies of Ra. It includes chambers or pits filled with fire,
    dismemberment, headlong casting, and divine commands that the enemies be destroyed
    without future existence.
