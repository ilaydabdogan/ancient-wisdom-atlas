canonical_text:
  quote: ''
  summary: The passage describes events in the Fifth and Sixth Hours of the Night
    in the Egyptian underworld route. Ra’s boat reaches a vaulted chamber associated
    with a sand mound and the beetle Khepera, the germ of life, who raises a dead
    god. The chamber is guarded. Nearby, seven gods inspect the slaughter of the dead
    and consume bodies with mouth-flames, while a blood-consuming goddess slays a
    condemned man. At the end of the Fifth Hour Ra sees a star identified by scholars
    as Venus, the morning star. The passage then describes the Sixth Hour, near the
    shrines of Osiris in the Delta, where the great god reaches an abyss of water
    and speaks with the gods there.
  language: English
  quote_policy: summarized
