canonical_text:
  quote: ''
  summary: The passage describes Egyptian nome cults as decentralized priestly systems
    in which each local priesthood exalted its god as father of the gods and creator.
    It presents Heliopolitan and Theban examples in which Ra and Amen were promoted
    without suppressing other gods, through association, assimilation, and inclusive
    divine catalogues. It also notes that gods from many places were retained in religious
    texts and assigned duties toward deceased kings in the Underworld.
  language: English
  quote_policy: summarized
