canonical_text:
  quote: ''
  summary: The passage argues that the epithet “One” is applied to Ra, forms of Ra,
    or deities endowed with Ra’s attributes. It describes a god as primeval Paut or
    divine substance, giving birth to two companies of gods, bringing every god or
    inferior divine being into existence, creating all things on earth in the beginning,
    and existing alone in primeval time. It also notes that priests of various cities
    ascribed unity or oneness to their local god when possible.
  language: English
  quote_policy: summarized
