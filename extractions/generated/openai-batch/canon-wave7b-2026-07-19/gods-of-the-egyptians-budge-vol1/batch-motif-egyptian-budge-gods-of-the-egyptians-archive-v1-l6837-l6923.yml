canonical_text:
  quote: God was One, and that he existed under innumerable forms.
  summary: The passage discusses Egyptian polytheism and monotheism in modern scholarly
    terms. It states that priests and educated classes could understand divine images
    as symbolic coverings and accept one creator God under many forms, while the uneducated
    favored a plurality of gods. It compares this view with Hebrew scriptural references
    to Yahweh, divine sons, and other gods, and summarizes the views of Tiele and
    de Rouge on Egyptian religion, divine unity, creation, and the development of
    polytheism and monotheism.
  language: English with a Dutch quoted note
  quote_policy: quoted
