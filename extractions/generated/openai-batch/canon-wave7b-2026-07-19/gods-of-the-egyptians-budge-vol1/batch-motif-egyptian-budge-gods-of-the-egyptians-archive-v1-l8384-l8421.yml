canonical_text:
  quote: ''
  summary: The passage describes the Book of the Pylons or Shat en sbau as a guide
    through the Tuat, where Osiris presides and through which the dead sun passes
    nightly. It contrasts two theological schools represented by the Shat am Tuat
    and Shat en sbau, compares the latter with the Book of Coming Forth by Day, and
    explains the Theban priestly elevation of Amen-Ra over Osiris in historical and
    institutional terms.
  language: English
  quote_policy: summarized
