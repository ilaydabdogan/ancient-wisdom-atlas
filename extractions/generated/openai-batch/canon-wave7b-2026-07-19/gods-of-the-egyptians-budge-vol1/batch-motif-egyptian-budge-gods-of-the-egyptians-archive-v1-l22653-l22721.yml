canonical_text:
  quote: ''
  summary: The passage describes Heru-p-khart or Harpocrates, Horus the Younger, distinguishing
    him from Horus the Elder and listing iconographic forms, parentage, birth setting,
    solar associations, local forms, and related identifications including Harmachis,
    Ra, and Temu.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Horus the Younger is distinguished from Heru-ur, Horus the Elder.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Egyptian pictures Horus the Younger is shown as a youth with a side-lock
    of hair, sometimes with a triple crown formed from the united crowns of South
    and North, and in one scene seated inside a box on a lion's back.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Heru-p-khart is described as the son of a Horus god and the goddess Rat-tauit,
    who brought him in a birth chamber in the precincts of Qemqem; Rat-tauit appears
    to have been worshipped there as a hippopotamus.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Heru-p-khart or Harpocrates is described as a form of the rising sun representing
    its earliest rays, and the passage says Egyptians distinguished seven forms or
    aspects of him.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Among the listed forms are Heru-Ra-p-khart of Hermonthis, Saaba with his mother
    Anit, and Sma-taui represented as a hawk-headed man with horns of Khnemu and a
    solar disk encircled by a uraeus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A papyrus is said to call one form 'Horus of the Two Eyes,' and Budge states
    this seems to show Heru-merti as a local form of Amsu, Khem, or Min as the Moon.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: A form worshipped at Ateb, identified as Edfu, is mentioned, but its exact
    characteristics are stated to be unknown.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: A form worshipped at Hierakonpolis or Per-Heru-nubt is depicted as a hawk
    seated on an antelope's head, which Brugsch says commemorates victory over Set,
    the murderer of Osiris.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Heru-khenti-Khat is represented with a human body and crocodile head, wearing
    horns of Khnemu, a triple crown, and plumes; the passage says this form does not
    appear to be ancient.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: A form called the 'Blind Horus' or associated with 'the head of sightlessness'
    appears to represent the god when neither eye was visible.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: Horus of the two horizons, Harmachis of the Greeks, is described as a chief
    form of the Sun-god Ra, representing the sun's daily course from the Mount of
    Sunrise to the Mount of Sunset; he combines Ra and several forms and is joined
    to Temu in funerary works.
  category: relationship
  evidence_refs:
  - ev:10
