canonical_text:
  quote: ''
  summary: Budge discusses a Nes-Amsu creation passage in which a first-person creator
    comes into being by uttering his own name, emerges from primeval matter and Nu,
    makes forms through a god-soul, lays a foundation by heart-spell, emits Shu and
    Tefnut, and is associated with later variants concerning Nu's obscured Eye and
    possible generation of vegetation and reptiles from divine tears.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaking god says he uttered his own name or word of power from his own
    mouth and came into being under created forms and under the form of Khepera.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Budge states that the passage presents Osiris transforming himself from primeval
    matter into the active principle of creation by uttering his own name.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that words of power, special names, words, and formulae
    played a great role in Egyptian magical and religious systems.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that no animate or inanimate creature was considered to
    have existence until it possessed a name.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that gods, goddesses, and supernatural beings possessed
    hidden names by, through, and in which they lived.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that a person who discovered such hidden divine names could
    command the help of the gods, while blotting out a name would wipe out the named
    being's existence.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The creator says he came into being from primeval matter, that nothing existed
    at that time, that he was alone, and that he made whatever was made.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The creator says he made the forms under which he appeared by means of, or
    out of, the god-soul raised from Nu, out of inertness or an inert mass.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Budge describes Nu as an inactive watery mass containing a soul in a quiescent
    state.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:10
  text: The creator says he found no place to stand in Nu, worked a spell on his heart,
    laid a foundation, and made the things that came into being.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The creator says he emitted Shu and Tefnut, and from being one god became
    three; Shu and Tefnut were raised up from Nu.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:12
  text: A variant states that after union with his hand, the creator's heart or will
    came from his hand, seed fell into his mouth, and he sent forth Shu and Tefnut.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Budge explains the repetitions as the result of variant readings from different
    schools incorporated by the scribe of the Papyrus of Nes-Amsu.
  category: other
  evidence_refs:
  - ev:9
- id: obs:14
  text: A later variant has father Nu declare that his Eye, identified by Budge as
    the sun, was covered by many bushes or hair, interpreted as clouds around the
    sunrise sun.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage tentatively states that vegetation and reptiles, including worms
    or serpents, proceeded from the god Rem and were the product of tears falling
    from Khepera, while noting that this rendering is not wholly certain.
  category: other
  evidence_refs:
  - ev:11
