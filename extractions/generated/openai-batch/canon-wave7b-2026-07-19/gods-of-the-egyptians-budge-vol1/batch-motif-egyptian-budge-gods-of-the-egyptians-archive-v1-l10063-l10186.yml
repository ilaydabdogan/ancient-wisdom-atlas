canonical_text:
  quote: ''
  summary: The passage describes portions of the Tuat in which Ra or the great god
    travels by boat through hidden paths, pylons, waters, houses, and the hidden abode
    of Osiris. It lists attendant deities and groups, describes serpent figures, a
    mummied or flesh-form god with a beetle, protective and destructive actions against
    Apepi/Apep, and states that making pictures of these regions benefits the maker
    with offerings or advantages in heaven and on earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The setting is the Tuat and the hidden path of Amentet, with a pylon, a city
    or district, hidden hours, and divine travel by boat.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The great god commands fields for offerings, gives water for streams, gives
    divine offerings to gods in the Tuat, and his command gives those gods their beings.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The text says that making pictures of the Sixth Hour gives the maker participation
    in offerings made to gods in the train of Osiris and offerings from kinsfolk on
    earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ra is described as no longer needing the boat made from a serpent body and
    as sailing again in his old boat on the waters of the stream in the Tuat.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: In front of Ra's boat are Thoth, called Khenti-Tuat and shown as a dog-headed
    god holding an ibis, and the goddess Ament-semu-set.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: A large house has sixteen divisions, each containing a mummied god; these
    divisions are called the mansions of Osiris and include kings of the South, kings
    of the North, Heteptiu, and Spirits.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: A serpent body is bent into an irregular oval, and within it lies a god named
    Nfu, or Flesh, touching the leg of a beetle which he holds on his head.
  category: object
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ra addresses the sixteen gods and commands them to be happy with offerings,
    protect him, and slay the serpent Apepi; the gods hearken to his voice.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The text says that the voice of Ra will make the god within the folds of the
    serpent Ash-hrau and the beetle on his head move.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Some houses of Ra are protected by serpent gods that stand on their tails
    and emit fire from their mouths.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: A serpent or monster is said to devour the shadows and spirits of Ra's enemies,
    and another group of gods destroys the enemies of Khepera and cuts up their shadows.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Seventh Hour is described as a region containing the hidden abode of Osiris,
    where the great god addresses the gods who are there.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: The great god makes other forms for the hidden abode so that he may turn back
    Apep by the magical words of Isis and Ser.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The great god travels in a boat endowed with magical powers even where there
    is no stream and no one to tow him, and he inflicts knife wounds upon Apep.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The pylon of the Seventh Hour city is named the Gate of Osiris, and the city
