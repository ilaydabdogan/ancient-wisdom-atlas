  summary: In this fragment of the Destruction of Mankind episode, Ra approves a plan
    to protect mankind from a goddess. The goddess has slain people at a specified
    place. By Ra's will, sleep-causing beer is poured out at night and heavenly fields
    are filled with water. In the morning the goddess, identified parenthetically
