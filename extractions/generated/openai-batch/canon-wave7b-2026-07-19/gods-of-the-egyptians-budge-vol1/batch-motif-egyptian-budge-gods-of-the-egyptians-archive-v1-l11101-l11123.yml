  summary: The passage explains that Ra's enemies were originally personifications
    of natural powers such as darkness, fog, storm, and wind. These foes were destroyed
    daily by Ra's fiery beams, and their fiery destruction was later mistaken by some
    as the burning of damned souls. The passage states that Egyptians understood these
    foes as recurring hosts appearing each night and morning, whose destruction enabled
    sunrise and did not involve damned souls obstructing Ra.
