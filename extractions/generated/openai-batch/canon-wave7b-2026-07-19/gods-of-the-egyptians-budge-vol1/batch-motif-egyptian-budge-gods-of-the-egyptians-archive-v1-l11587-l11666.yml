canonical_text:
  quote: ''
  summary: The passage describes Gehenna as a multi-gated and sevenfold punitive realm
    with rivers, pits, fire, hail, chambers, scorpions, poison, and periodic respites.
    It reports traditions about Arsiel, angels, the righteous, the damned, divine
    judgment, loss of names after death, differing rabbinic views of punishment, and
    a future solar punishment of the wicked. It also makes explicit comparisons between
    Hebrew Gehenna and the Egyptian Tuat, including shared punitive functions and
    an asserted difference concerning serpents.
  language: English
  quote_policy: summarized
