- id: obs:1
  text: A prince of Gehenna named Arsiel is said to stand before righteous souls to
    stop them from praying to God for the wicked.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports varying counts of Gehenna's gates or doors, but says the
    best traditions fixed the number at seven.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A river or canal is said to flow through Gehenna, and the passage explicitly
    compares this with a river through the Tuat.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The first division of Gehenna is described as containing pits with fiery lions;
    those who fall in are partly consumed by lions and partly by fire, then come into
    being again.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The damned are said to pass through the fire of all seven divisions, being
    consumed and coming to life again repeatedly.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: One reported view divides Gehenna between fire and hail, with an angel driving
    damned souls ceaselessly from one to the other.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Another reported description gives each division seven streams of fire and
    seven streams of hail, with many chambers, clefts, scorpions, vessels of gall,
    and rivers of deadly poison.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A river of fire is said to come from beneath the throne of God Almighty and
    pour upon the heads of the wicked, though some receive periodic rest at prayer
    times, Sabbaths, and new moons.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage reports disagreement among Rabbis over whether punishment of the
    wicked lasts forever or only six or twelve months for purification.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The damned are said not to remember their earthly names, even when angels
