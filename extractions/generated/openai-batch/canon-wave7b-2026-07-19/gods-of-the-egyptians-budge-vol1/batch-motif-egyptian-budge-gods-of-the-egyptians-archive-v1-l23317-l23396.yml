canonical_text:
  quote: ''
  summary: 'The passage explains Budge''s interpretation of the mesniti as blacksmiths
    whose foundry-name, mesnet or mesnit, became attached to a temple space and to
    the sky-place of the Sun-god''s emergence. It presents a historical reconstruction
    of metalworking invaders centered at Edfu, later merged by priests with traditions
    of Horus and Ra. It then describes forms of Horus: Heru-thema piercing Set with
    an iron-headed spear, Heru-Hebenu standing on an antelope associated with Set,
    and Heru-sa-Ast-sa-Asar as the son of Isis and Osiris, a rising-sun deity and
    lawful successor of Osiris.'
  language: English
  quote_policy: summarized
