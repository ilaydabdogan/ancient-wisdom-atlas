canonical_text:
  quote: ''
  summary: The passage describes Memphis and nearby sacred places, including temples
    and districts associated with Ptah, Sekhet, Bast, Hathor, Osiris, Seker, Khnemu,
    Ra, Anubis, Tenen, I-em-hetep, and Asar-Hapi/Serapis. It explains Memphis as a
    walled city, mentions an annual royal-priestly procession around its walls for
    Ptah-Seker-Asar, and describes Sekhet’s divine relationships, lioness-headed iconography,
    solar disk and uraeus, later identification with Bast and Hathor, directional
    associations, and colored garments.
  language: English
  quote_policy: summarized
