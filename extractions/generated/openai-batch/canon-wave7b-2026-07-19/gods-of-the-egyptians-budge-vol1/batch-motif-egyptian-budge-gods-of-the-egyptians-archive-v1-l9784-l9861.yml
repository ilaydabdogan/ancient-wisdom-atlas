canonical_text:
  quote: ''
  summary: The passage describes the Third Hour of the Night, where beings cut souls,
    confine shadows, drag tomb occupants to slaughter, emit flames, and behead enemies
    of Ra. Ra addresses hidden souls created to follow and protect Osiris, and speaks
    of leading Osiris's soul to heaven and earth while traversing night and day. The
    passage then introduces the Fourth Hour, Sekhemus, in which the Sun-god's boat
    reaches a hidden Circle of Amentet connected with the Land of Seker, pylons, paths,
    roads, and the Circle Ammehet known from the Book of the Dead.
  language: English
  quote_policy: summarized
