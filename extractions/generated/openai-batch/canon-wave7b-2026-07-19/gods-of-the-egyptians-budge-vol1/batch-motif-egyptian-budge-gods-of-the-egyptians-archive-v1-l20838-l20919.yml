canonical_text:
  quote: ''
  summary: Modern scholarly passage describing Sefekh-aabut/Sesheta as a goddess of
    chronology, divine writing, construction, architecture, royal life-recording,
    and afterlife house-building; it also notes her identifications and family relations
    in Egyptian cult, then introduces Unnut as a goddess connected with hours, hare-form
    attributes, destructive knives, and an early Hermopolitan cult association.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sefekh-aabut is described in iconographic scenes with an emblem of eternity,
    a double Set festival sign, and a notched palm-branch used as a symbol for counting
    years.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A scene places the goddess before hieroglyphs meaning life, power, and thirty-year
    festivals, resting on a seated figure who holds life signs and typifies millions
    of years.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A cited text says the goddess inscribed a king’s life-period in her register
    as hundreds of thousands of thirty-year periods and made his years on earth like
    those of Ra.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: In Book of the Dead lvii.6, the deceased says that a place or house of peace
    was built for him by Sefekh-aabut/Sesheta and set up by Khnemu.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: In Book of the Dead clii.3, Sefekh-aabut brings another god, Anpu calls to
    Osiris Nu to build a house on earth, the house has named foundation and shrine
    locations, offerings and libations are brought, and Osiris tells the gods to behold
    the house built for a well-equipped spirit who renews himself daily among them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the clxixth chapter, the goddess is said to sit before the deceased while
    the goddess Sa protects his members.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The author states that these passages show Sefekh-aabut as a goddess of construction
    and a suitable counterpart of Thoth in carrying out commands concerning Creation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that Sefekh-aabut’s chief duties were connected with writing
    history, recording a king’s deeds, and drawing the plan for his next-world abode;
    she is also called inventor of letters, lady of the builder’s measure, and founder
    of architecture.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: A quoted text says Sefekh-aabut tells Seti that her words about him will not
    be gainsaid, that her hand will write down his fame like her brother Thoth, and
    that this accords with Tem’s decree.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage reports that Sefekh-aabut was identified with Renenet and Isis,
    called daughter of Nut at Dendera, and regarded at Lycopolis as sister of Osiris
    and mother of Heru-nub.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A goddess connected with the hours is described as a woman with a star on
    her head; another description gives a woman’s body with a hare’s head and life
    signs, and a destructive aspect with knives identified with Sekhet.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: A rubric to Book of the Dead chapter cxxxvii is said to report that the chapter
    was found in Thoth’s handwriting by Heru-tata-f, son of Khufu; the passage infers
    from this that a temple of Unnut existed at Unnu/Hermopolis in the period discussed.
  category: setting
  evidence_refs:
  - ev:9
