canonical_text:
  quote: ''
  summary: 'The passage summarizes Budge''s discussion of the goddess Net/Neith: her
    early antiquity and sanctuaries, her reciprocal relation to Ra as both mother
    and daughter, her daily generation of the Sun-god through magical formulae, and
    her funerary roles in embalming, amuletic protection, canopic protection, and
    divine identification of the deceased body.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The text states that Net's cult was already ancient by the 1st Dynasty and
    that she had sanctuaries in many parts of Egypt during the first four dynasties.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sarcophagus passage cited by Budge addresses Net with the ancient goddesses
    Anunu and Nesert and says that she came forth from the god and the god came forth
    from her.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says Net was thought in the IVth Dynasty to be both mother and
    daughter of the Sun-god Ra and to conceive and bring forth the new Sun-god daily
    by divine and magical formulae.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The text connects Net with temples in the Pyramid Texts and with ceremonies
    for dressing, preserving, and magically protecting the dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: In a cited late Ritual of Embalmment, a linen piece bearing figures of Hapi
    and Isis is placed in the deceased's hand as an amulet to bring the mummy Net's
    protection under the name Isis.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says Isis, Nephthys, Net, and Serqet assist the Four Children
    of Horus by magical means in protecting body parts placed in canopic jars.
  category: action
  evidence_refs:
  - ev:7
- id: obs:7
  text: In the quoted protective speeches, Isis protects Amseth, Nephthys protects
    Hapi, Net protects Tuamutef, and Serqet protects Qebhsennuf.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Egyptian word sa for protection is represented by a knot sign, and Budge
