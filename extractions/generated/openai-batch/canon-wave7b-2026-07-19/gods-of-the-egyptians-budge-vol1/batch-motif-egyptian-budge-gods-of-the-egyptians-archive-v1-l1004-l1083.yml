canonical_text:
  quote: ''
  summary: Budge discusses the antiquity of Egyptian serpent worship and fear of serpents.
    He cites Pyramid Text formulae associated with Unas against serpents and fierce
    animals, later funerary prayers against underworld serpents, a tradition of a
    mighty serpent named Ami-Hemf, predynastic veneration of the uraeus in Lower Egypt
    and the vulture in Upper Egypt, the royal title joining the shrines of Vulture
    and Uraeus, and other animal cults.
  language: English
  quote_policy: summarized
