canonical_text:
  quote: ''
  summary: The passage describes the four followers or children of Horus as ancient
    and important lesser gods. It links them with the older Horus, Shu's pillars,
    the four quarters of heaven, funerary rituals repeated in fours, protection of
    the deceased's body and organs, and guidance of the deceased into Sekhet-Aaru.
    It also notes associations with four goddesses and the widespread sanctuaries
    of Horus, son of Isis, identified with Horus the Elder and rising-sun forms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several great gods are said to be served by lesser gods, but the followers
    of Horus are described as older and more important than those other ministering
    gods.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The original Horus-god is described as representing the face of heaven and
    as having long hair hanging from his face.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the mythic arrangement described, four pillars of Shu hold up a vast rectangular
    iron plate forming the floor of heaven, and these supports are placed in the tresses
    of Horus.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: At a later period, the four followers of Horus, son of Isis, are said to have
    been identified with the followers of the older Horus, to dwell near the pillars
    of Shu, and to have dominion over the pillars and the four quarters of heaven.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: In the Book of the Dead, the four children of Horus have prominent roles,
    and the deceased seeks their help and protection through offerings and prayers.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'The passage gives several examples of funerary elements arranged in fours:
    four men drawing the coffin containing the mummied intestines, four animals for
    sacrifice, ritual instruments and containers in quadruplicate, and prayers or
    formulae repeated four times.'
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The four children of Horus are said to share protection of the deceased's
    body and, as early as the Vth Dynasty, to preside over the deceased's life in
    the underworld.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The deceased's two arms are identified with Hapi and Tuamutef, and the two
    legs with Amset and Qebhsennuf; when the deceased enters Sekhet-Aaru, these four
    go with him as guides, two on each side.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hapi represents the north and protects the small viscerae; Tuamutef represents
    the east and protects the heart and lungs; Amset represents the south and protects
    the stomach and large intestines; Qebhsennuf represents the west and protects
    the liver and gall bladder.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nephthys, Neith, Isis, and Selqet or Serqet are associated with the four gods,
    perhaps as female counterparts.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Horus, son of Isis, is described as thoroughly identified with Horus the Elder
    and with other forms of the rising sun, and his sanctuaries are said to be numerous
    throughout the country.
  category: relationship
  evidence_refs:
  - ev:7
