candidate_motifs:
- id: motif:1
  label: mapped underworld journey through named hours and regions
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage gives named Hours, Circles, doors, a city, a pylon, a region,
    and sequences of beings encountered by Ra's boat in the Tuat.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage is a modern scholarly summary with some OCR-damaged names
    and lacunae.
- id: motif:2
  label: solar boat as ritual journey vessel
  taxonomy_refs:
  - ark_vessel
  basis: Ra travels through the Ninth and Tenth Hours in a boat staffed by divine
    sailors and escorted by other beings.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  confidence: medium
  cautions: The passage calls it a boat, not an ark; the taxonomy reference is functional
    rather than lexical.
- id: motif:3
  label: renewal and reanimation of divine life
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: The rowers lead the soul of Ra to reanimate the disk, the goddesses cause
    life and strength to rise in Osiris, and a living beetle is born in the Tenth
    Hour.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:11
  confidence: high
  cautions: The passage does not present a single narrative death-and-return episode;
    renewal is distributed across several images.
- id: motif:4
  label: reckoning with divine assessors and efficacious knowledge
  taxonomy_refs:
  - divine_judgment
  - wisdom
  basis: Knowledge of the scenes, names, and places is said to grant position in Amentet
    and effective speech with divine assessors on a day of reckoning.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage frames this as a ritual benefit of copying and knowing the
    Hour, not as a full judgment narrative.
- id: motif:5
  label: serpent beings as helpers, emblems, and enemies
  taxonomy_refs:
  - serpent
  basis: The passage includes fire-emitting uraei, a serpent held as Ra's staff, the
    serpent Ankh-ta, the enemy serpent Neha-hra, and serpents bearing a solar disk
    or generating goddess-souls.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:10
  - ev:12
  confidence: high
  cautions: The serpent figures have different functions and should not be collapsed
    into a single role.
- id: motif:6
  label: paired and directional duality
  taxonomy_refs:
  - duality
  basis: The Tenth Hour includes white and red crowns on a two-headed figure, paired
    legs, South and North personifications, and East and West goddesses.
  evidence_refs:
  - ev:9
  - ev:12
  confidence: medium
  cautions: The passage lists visual and directional pairings but does not explicitly
    interpret them.
- id: motif:7
  label: armed divine escort against enemies in darkness
  taxonomy_refs:
  - chaos
  basis: Armed gods guide Ra eastward, slay enemies living in darkness, and attack
    the serpent Neha-hra.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: The passage does not use the term chaos; the taxonomy link is based only
    on enemies in darkness and a hostile serpent.
