canonical_text:
  quote: ''
  summary: The passage describes named Circles, doors, and voice responses in the
    Tuat, then summarizes the Ninth and Tenth Hours of Ra's underworld journey. Ra
    travels by boat through named regions and cities, accompanied by rowers, goddesses,
    uraei, field-labourers, armed divine escorts, serpents, directional beings, and
    other figures. The passage also states ritual benefits for one who copies the
    scenes and knows the divine names and places.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Several Circles of the Tuat are shut by named doors; when Ra speaks to the
    beings there, they answer with animal-like or battle-like voices, including mewing
    cats, a roar, shouts of war, a divine hawk cry, and water-fowl sounds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ninth Hour is named and introduces a country called the hidden Circle
    of Amentet, with a named city and pylon.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ra addresses gods from his boat, and the sailors in his boat are described
    as content with the city.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person who copies the scenes of the Ninth Hour and knows the names and places
    of the gods in Amentet is said to attain a position in Amentet, stand before the
    lord of affairs, and have effective speech with divine assessors on a reckoning
    day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The illustrated Ninth Hour shows the boat of the god travelling with twelve
    divine rowers, each carrying a paddle.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The rowers row, throw water with their paddles upon spirits on each river
    bank, and lead the soul of Ra to the place where he will reanimate the disk.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the right of Ra's boat are twelve seated gods and twelve goddesses; the
    goddesses breathe after Ra salutes them and after they hear his voice.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The twelve goddesses utter words of power to surround the hidden soul and
    cause life and strength to rise up in Osiris.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: On the left are twelve uraei, each sending fire from its mouth; they kindle
    fire for the god in the Tuat and consume the fire after Ra has passed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Nine gods of cultivation and husbandry, called field-labourers, are directed
    by a mummified god and perform ploughing and watering of fields.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Tenth Hour brings Ra in his boat to a named city; the sun boat continues
    onward, and Ra holds a serpent like a staff.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: A composite figure has two heads, one with the white crown and one with the
    red crown, two pairs of human legs, and a body bent like a pair of horns; a black
    hawk form of Khent-Heru stands in the curve, with Neith on the left and Hert-ermen
    on the right.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: A boat contains the serpent Ankh-ta, and before it stand three groups of four
    gods, including gods with solar disks for heads and armed gods.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:14
  text: The armed gods guide Ra eastward, slay enemies who live in darkness, take
    vengeance on the serpent Neha-hra, escort the god to the limits of the Hour, and
    form part of his eastern-sky train.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: In the Tenth Hour Ra sees the living beetle born in the presence of P-ankhi
    and pushing its zone before it.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Two serpents hold a solar disk on their bent necks, and the passage also mentions
    seated personifications of South and North.
  category: object
  evidence_refs:
  - ev:12
- id: obs:17
  text: Goddesses of East and West come forth from serpents; they are described as
    souls of the serpents and of the axe that emerge to look upon the Sun-god and
    return to their material bodies after he passes.
  category: sequence
  evidence_refs:
  - ev:12
