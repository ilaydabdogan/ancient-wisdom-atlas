canonical_text:
  quote: ''
  summary: 'The passage describes Unnut as the female counterpart of Unnu and as a
    local or city goddess, then surveys several animal-headed divine figures: three
    seated deities before whom the deceased adores in a Book of the Dead vignette,
    a hare-headed god associated with an Underworld Arit, and a mummiform hare-headed
    god at Dendera whose possible relation to Osiris is discussed and questioned.
    It also compares Unnut’s two forms with the two forms of Maat and mentions Thoth
    with Nehemauait.'
  language: English
  quote_policy: summarized
