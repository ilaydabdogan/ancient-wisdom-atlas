canonical_text:
  quote: ''
  summary: The passage catalogs gods, stars, messengers, and classes of divine beings
    named in the Pyramid Texts. It notes uncertain functions for several classes,
    identifies the Urshu as possible watchers or messengers, describes Set beings
    as a company associated with a beneficent Set and divided into upper and lower
    classes, and describes the Shemsu Heru as followers who minister to Horus and
    assist him for the benefit of the dead.
  language: English
  quote_policy: summarized
