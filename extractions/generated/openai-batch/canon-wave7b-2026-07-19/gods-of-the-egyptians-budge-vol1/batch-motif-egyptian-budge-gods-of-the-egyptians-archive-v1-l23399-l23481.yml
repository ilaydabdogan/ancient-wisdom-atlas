canonical_text:
  quote: ''
  summary: The passage describes Horus as son of Isis, discusses varying accounts
    of his paternity, narrates Isis conceiving Horus after revivifying Osiris, hiding
    and nursing him in papyrus swamps, fleeing Set with Thoth’s help and scorpion
    protection, losing Horus temporarily to a scorpion sting until Thoth restores
    him, and later Horus’s avenging conflict with Set, including an episode in which
    Horus cuts off Isis’s head.
  language: English
  quote_policy: summarized
