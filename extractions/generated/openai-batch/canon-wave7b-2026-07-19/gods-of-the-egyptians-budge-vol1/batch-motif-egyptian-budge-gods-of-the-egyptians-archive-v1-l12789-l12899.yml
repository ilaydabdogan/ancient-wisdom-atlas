canonical_text:
  quote: men and women came into being from these tears
  summary: The passage summarizes Egyptian creation accounts in which Khepera/Ra produces
    humans from tears or the divine Eye, distinguishes human creation from the creation
    of gods, discusses late divisions of mankind, compares the Egyptian account with
    a Mesopotamian account of Marduk making man, describes the Eye of Nu gaining power
    and position, and ends with Shu and Tefnut giving birth to named gods whose descendants
    use Khepera's name and words of power.
  language: English
  quote_policy: quoted
