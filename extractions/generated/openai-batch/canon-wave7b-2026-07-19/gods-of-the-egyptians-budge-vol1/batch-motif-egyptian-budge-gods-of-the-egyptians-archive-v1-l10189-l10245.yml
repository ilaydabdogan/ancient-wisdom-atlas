canonical_text:
  quote: ''
  summary: 'The passage describes the seventh hour: knowledge of the picture and recitation
    of the words of Isis and Ser protect the soul, repulse Apep and Neha-hra, and
    secure a place on Ra''s boat. Ra''s boat reaches shallow water in Neha-hra''s
    domain; Isis speaks from the bow so it can proceed. Neha-hra is bound and transfixed,
    while Ra advances under the serpent Mehen as canopy. Four knife-bearing goddesses
    guard Osiris''s tombs and cut up Apep; the tombs contain forms or dead souls of
    Osiris named Tem, Khepera, Ra, and Osiris, with heads that come forth at Ra''s
    voice and then disappear. Budge adds a comparative note about slaying slaves at
    graves and a wider foundation-burial custom.'
  language: English
  quote_policy: summarized
