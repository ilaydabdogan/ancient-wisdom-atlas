  quote: ''
  summary: The passage describes the Fifth Division or Fifth Hour of the Tuat. The
    solar boat is towed along the underworld river toward a sepulchral building with
    nine chapels containing mummied gods. The tableau includes personified hours,
    serpents, a named pylon and guardians, groups of worshippers and cord-bearers
    rewarded by Ra, and beings who measure and destroy appointed souls. A central
    procession includes the solar boat, holders of Ennutchi, souls in the Tuat, and
    the sceptre-holding god Her-qenbet-f.
  language: English
  quote_policy: summarized
