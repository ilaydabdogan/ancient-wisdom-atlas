canonical_text:
  quote: ''
  summary: In the Fourth Hour of the Night, a quoted speaker asks not to be pursued
    by murderous fiends and to live on sepulchral offerings. The illustrated Fourth
    Hour shows Ra's boat entering a new snake-filled country under Seker's presidency.
    Unlike earlier regions, it has no river, no banks lined with gods and souls, and
    no fields for distribution. Ra travels with few attendants, stands in a shrine
    within a serpent-formed boat, and is hauled over sandy ground by gods associated
    with Osiris and with Ptali of Memphis. Osiris is said to merge with Seker as Osiris
    Seker. The road of Re-stau is introduced as having three doors.
  language: English
