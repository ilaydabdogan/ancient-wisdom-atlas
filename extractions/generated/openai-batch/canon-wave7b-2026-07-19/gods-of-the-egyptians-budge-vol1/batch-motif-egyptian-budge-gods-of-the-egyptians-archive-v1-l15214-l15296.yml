canonical_text:
  quote: ''
  summary: A sequence of praises addresses Ka, Ra, and Pta as exalted Sekhem. The
    praised deity assembles and generates bodies in the Tuat, gives them life, destroys
    impurities, sends fire and destruction, sends light and stars into hidden darkness,
    provides for those in the Tuat, opens roads in the hidden place, and creates the
    Circles and all classes of beings. The litany repeatedly identifies the praised
    deity with the bodies of named figures such as Serqi, Shai, Sekhen-Ba, Amen-khat,
    Rekhi, Shepi, Seshetai, Aper-ta, Hai, Thenti, Maa-uat, and Akhpa.
  language: English with transliterated Egyptian names
  quote_policy: summarized
