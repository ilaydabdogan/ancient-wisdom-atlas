canonical_text:
  quote: Horus once again took the form of a winged disk
  summary: Horus of Behutet takes the form of a winged disk in the boat of Ra, accompanied
    by Nekhebet and Uatchit as serpents. He and his armed blacksmith companions pursue
    the enemies of Ra, who flee, transform into crocodiles and hippopotamuses, and
    are slaughtered, chained, or captured. Horus stands on a hippopotamus after victory,
    later pursues rebels linked with Set, attacks Set, and Ra orders the defeated
    parties handed over to Isis and her son Horus.
  language: English
  quote_policy: quoted
