canonical_text:
  quote: ''
  summary: Budge presents and discusses hymnic and funerary material concerning Ra-Tem
    or Temu of Heliopolis. The passage describes Ra-Tem as setting and rising, protected
    by the uraeus and Eye of Tem, journeying through heaven and earth, being praised
    by gods and souls, illuminating the Tuat, opening paths, and receiving aid against
    fiends. It also notes theological identifications with Osiris, young Horus, Khepera,
    Ra, and Temu, including the three daily solar forms and Book of the Dead self-identification
    with Tem.
  language: English
  quote_policy: summarized
