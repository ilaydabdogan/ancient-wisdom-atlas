canonical_text:
  quote: ''
  summary: A hymn praises Ra/Tem-Heru-khuti as a self-manifesting solar deity who
    comes into being above Nu, traverses heaven, ends night, illuminates earth, rises
    and sets, renews himself as the Disk within Hathor, and comes forth from the water
    of Nu. The speaker asks to enter everlasting heaven, the mountain of favored ones,
    the Underworld company of shining beings, Ta-tchesertet, and Sekhet-Aaru. The
    hymn also describes divine homage from Nut, Maat, the gods, the lands, the dead,
    and all peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ra manifests alone above Nu, advances rapidly, sinks to rest, ends the hours
    of night, makes the earth light, and rises on the horizon.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ra is said to mould his limbs and bring them forth without birth-pangs in
    the form of Ra as he rises into the upper air.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker asks to enter everlasting heaven and the mountain where Ra's favored
    ones dwell, and to be joined to shining, holy, perfect beings in the Underworld.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker says his two hands are raised in adoration when Ra sets in the
    west as a living being.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The hymn states that Ra's mother gives him birth, that Ra gives light to the
    course of the Disk, and that he strengthens generations of men with the Nile-flood.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ra is described as glorious in the Sektet boat and mighty in the Atet boat.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker asks for effective words in the Underworld, absence of evil in
    the nether world, faults put behind Ra, membership among loyal servants, union
    with souls in Ta-tchesertet, and a journey into Sekhet-Aaru.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tem-Heru-khuti renews himself in season in the form of the Disk within his
    mother Hathor, and peoples and regions respond with joy and homage at his rising.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ra/Heru-khuti is called a divine man-child, heir of eternity, self-begotten
    and self-born, king of earth, prince of the Tuat, and governor of Aukert.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ra is said to come forth from the water and to have sprung from the god Nu,
    who cherishes him and orders his members.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Nut does homage to Ra, Maat embraces him, and those in his following sing
    to him and bow their foreheads to the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The company of the gods rejoices at Ra's rising, the earth is glad at his
    rays, and the long-dead come forth with cries of joy to see his beauties every
    day.
  category: action
  evidence_refs:
  - ev:7
