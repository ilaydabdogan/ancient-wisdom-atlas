canonical_text:
  quote: Poureth down water heaven, tremble the stars... take to flight [when] they
    see Unas rising [as] a soul
  summary: 'The passage, headed as an appendix on Unas as slayer and eater of the
    gods, describes cosmic disturbance: heaven pours down water, stars tremble, bow-bearers
    go about, and the bones of Aker quake. Those beneath flee when they see Unas rising
    as a soul like a god. Unas is described as living upon his fathers, feeding upon
    his mothers, and as lord of wisdom. A note identifies the text as from the Pyramid
    of Unas with variants from the Pyramid of Teta.'
  language: English with Egyptian transliteration fragments
