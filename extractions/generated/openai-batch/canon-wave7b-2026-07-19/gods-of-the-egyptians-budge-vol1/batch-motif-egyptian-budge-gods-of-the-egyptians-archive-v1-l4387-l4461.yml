canonical_text:
  quote: heaven was in many respects a duplicate of earth
  summary: The passage discusses Egyptian companies of gods in Pyramid Texts and later
    Book of the Dead traditions. It describes Pepi I acting among divine companies,
    interprets Great and Little companies as macrocosm and microcosm, connects three
    companies with gods of heaven, earth, and the Tuat, and explains how local deities
    were made heads of divine companies when Heliopolitan theology was adopted.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: In the text of Pepi I, the king sits on an iron throne, weighs words at the
    head of the Great company of gods in Annu, has his head lifted by two companies,
    takes the crown before the Great company, sits at the head of two companies and
    in their boat, and stands between two companies.
  category: sequence
  evidence_refs:
  - ev:1
