- id: obs:8
  text: 'Several ancient cities are named with their special local deities: Sais with
    Neith, Per-Uatchet with Uatchet, Dendera with Hathor, Nekheb with Nekhebet, Edfu
    with Horus, and Heliopolis with Tem.'
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: When cities accepted the Heliopolitan theological system, they kept the great
