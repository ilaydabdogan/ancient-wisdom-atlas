canonical_text:
  quote: ''
  summary: The passage presents a hymn and rubric concerning Sekhet-Bast-Ra, describing
    her as a fiery goddess in the bow of her divine father's boat, as mother and source
    of hidden souls, and as a protector of bodies and souls in the Underworld. It
    also describes a vignette with two two-faced dwarf attendants and a mortuary rubric
    promising afterlife benefits to the deceased. The passage then summarizes Nefer-Tem
    as a member of the Memphite triad, his parentage, iconography, and Pyramid Texts
    associations with the lotus and the rising of Unas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sekhet-Bast-Ra is addressed as standing in the bow of her divine father's
    boat to overthrow Qetu, and as placing Maat in the bow of the boat.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sekhet-Bast-Ra is called a fire goddess and is compared to a mighty flame
    in the bow of her father's boat.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says words of adoration rise to Sekhet-Bast-Ra from the Eight
    Gods of Hermopolis.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Living souls in hidden places praise Sekhet-Bast-Ra as their mother and source,
    and the passage says she makes a hidden Underworld place for them, makes their
    bones sound, preserves them from terror, strengthens them in an everlasting abode,
    and protects them from an evil chamber.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The vignette places a dwarf on each side of Sekhet-Bast-Ra; each dwarf has
    two faces, one hawk and one human, a fat body, disk and plumes on the head, and
    one raised hand and arm.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The rubric says that a deceased person for whom pictures of the goddess and
    the two dwarfs were made would become like the immortals, avoid bodily consumption
    by worms, have an unfettered soul, drink water at the river source, possess a
    homestead in Sekhet-Aanre, and become a star of heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Nefer-Tem is identified as the third member of the Memphite triad and as the
    child of Ptah and Sekhet, Ptah and Pakht, or Ptah and Bast.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Nefer-Tem is represented as a man with divine objects in his hands, is sometimes
    shown standing on a lion, and can appear with the lotus flower or lotus flower
    and plumes on his head.
  category: attribute
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The passage says that in the Pyramid Texts the dead king Unas is compared
    to a lotus at the nostrils of the Great One and is said to have risen like Nefer-Tem
    from the lotus.
  category: speech
  evidence_refs:
  - ev:6
