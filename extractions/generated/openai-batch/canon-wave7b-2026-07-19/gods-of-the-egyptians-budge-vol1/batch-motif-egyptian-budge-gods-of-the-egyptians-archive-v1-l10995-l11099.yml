canonical_text:
  quote: ''
  summary: The passage summarizes Egyptian afterlife doctrines in which Osiris judges
    the dead, Ra travels nightly through the Tuat in his boat, qualified souls accompany
    Ra through the underworld, unqualified but non-wicked dead remain in assigned
    divisions, and enemies of Osiris or Ra are destroyed rather than purified through
    purgatorial punishment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In the judgment before Osiris, the righteous are allowed to enter the Elysian
    Fields, while the wicked are destroyed immediately.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that annihilation is the punishment for sin in this judgment
    context.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The poor and ignorant are not condemned because of poverty; Osiris admits
    them into the first division of the Tuat.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those in the first division who lack the necessary words of power cannot continue
    through the remaining divisions, but rejoice when Ra passes nightly in his boat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The punished beings in the Tuat are described as enemies of Osiris and usually
    enemies of Ra.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says there is no textual basis that punishment in the Tuat removes
    guilt or allows a punished being to pass later into an easier division.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Good works, funerary ceremonies, and buried religious texts can help a person
    gain happiness, but the passage says the soul cannot improve its position after
    reaching the Underworld.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tomb offerings are said to benefit the ka or double, and perhaps an animal
    soul, but not to move spirits or souls between Tuat divisions or modify their
    decreed condition.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
  text: In the doctrine associated with the priesthoods of Ra, souls assemble in Amentet
    and wait for the boat of Ra.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ra's earthly worshippers who possess the necessary words of power enter his
    boat, travel with him through the Tuat under his protection, pass through the
    realms of Osiris and Seker, and appear at the eastern horizon at daybreak.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After reaching heaven at daybreak, these souls wander there until sunset,
    then rejoin Ra in his boat for another journey through the Tuat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Many beings in the divisions of the Tuat want to enter Ra's boat but cannot;
    they benefit from Ra's nightly visit, grieve when he leaves, and many cease to
    exist until renewed the following night.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Enemies of Ra in many divisions are destroyed by the god's followers, but
    the passage says there is no reason to view them as eternally punished damned
    beings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: At the end of the Tuat, goddesses preside over pits of fire and supervise
