canonical_text:
  quote: ''
  summary: The passage describes parts of the Fourth and Fifth Hours of the Night
    in the Tuat. Ra's boat passes through darkness and regions connected with Seker,
    aided by fiery serpentine light. Seker's hidden body, land, and city are described,
    along with serpent monsters, sphinxes, gods, goddesses, offerings from the living,
    and a fire-like lake. The text also states that making or knowing images of these
    hidden underworld things benefits the soul in the Tuat.
  language: English
  quote_policy: summarized
