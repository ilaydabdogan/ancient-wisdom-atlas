canonical_text:
  quote: ''
  summary: The passage explains the Egyptian term Maat as straightness, truth, law,
    order, and justice; describes the goddess Maat as personifying physical and moral
    law; associates her with the regular solar course of Ra; and describes the Hall
    of the Maati goddesses where the deceased enters, faces Forty-two Assessors or
    Judges, and recites denials of sin known as the Negative Confession.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The word Maat is explained as primarily indicating that which is straight
    and as being used in both physical and moral senses.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage lists meanings associated with Maat including right, true, truth,
    real, genuine, upright, righteous, just, steadfast, and unalterable.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The goddess Maat is described as the personification of physical and moral
    law, order, and truth.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: In relation to Ra, Maat indicates the regularity of his rising, setting, and
    daily course from east to west.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hymnic material quoted in the passage says Maat embraces Ra at morning and
    evening and that Thoth and Maat have written down his daily course.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says Horus may be seen acting as steersman in the boat of Ra with
    Thoth and Maat on either side.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Maat is called daughter of Ra, eye of Ra, lady of heaven, queen of the earth,
    mistress of the Underworld, and lady of the gods and goddesses.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In dual form as Maati, Maat is described as lady of the Judgment Hall and
    as personification of justice who awards every man his due.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: Some vignettes representing the weighing of the heart show Maat taking the
    form of the Balance itself.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Hall of the Maati goddesses is described as spacious, with a cornice formed
    of uraei and feathers symbolic of Maat.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the center of the Hall is a god with both hands stretched over a lake,
    and at each end is an ape seated before a pair of scales.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: Anubis is described as guardian of the door through which the deceased entered
    the Hall, and the deceased had to learn and utter names before being allowed to
    enter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Inside the Hall, the deceased finds Forty-two Assessors or Judges arranged
    in two rows of twenty-one, one row on each side of the Hall.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: Before each Assessor or Judge, the deceased makes a solemn declaration that
    he has not committed a specified sin; the forty-two denials are called the Negative
    Confession.
  category: speech
  evidence_refs:
  - ev:8
