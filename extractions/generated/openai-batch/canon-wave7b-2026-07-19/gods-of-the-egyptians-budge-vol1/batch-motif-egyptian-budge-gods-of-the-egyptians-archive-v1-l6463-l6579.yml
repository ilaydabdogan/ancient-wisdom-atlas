canonical_text:
  quote: ''
  summary: The passage presents a fragmentary translated Egyptian theological text
    and Budge's commentary under the heading 'Oneness of the Gods.' A primeval great
    god is described as living by Maat, giving birth to two divine companies, being
    the source through whom every god came into being, making what exists at the beginning
    of earth, and possessing hidden births and manifold forms. Budge then summarizes
    Amen-Ra as holy Power, lord of space, Khepera, creator of every evolution or thing,
    and the only one existing at the beginning. He further states that Ta-tunen, Ra-Tem,
    and Osiris are each called 'God One,' while Amen-Ra is called 'God One alone.'
  language: English
