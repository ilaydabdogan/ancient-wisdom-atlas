canonical_text:
  quote: ''
  summary: The passage describes Egyptian conceptions of the sky as supported by four
    pillars or sceptres associated with four gods of the quarters. It also mentions
    a middle support, a myth of the heavens as a human head with sun and moon eyes
    and hair as supports, the four gods as children of Horus connected with the deceased,
    Ra enthroned among heavenly gods, and the Followers of Horus serving Horus in
    heaven.
  language: English
  quote_policy: summarized
