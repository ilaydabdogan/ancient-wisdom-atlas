  quote: ''
  summary: The passage surveys examples from Hebrew biblical literature and Egyptian
    literature in which animals, trees, wells, and other nonhuman beings are treated
    as capable of speech, perception, reason, and human-like motives. It then describes
    the Egyptian Judgment Scene, especially the weighing of the deceased's heart against
    the feather of Maat before divine judges, with Anubis, Thoth, a guardian angel,
    the Eater of the Dead, and a dog-headed ape involved in the procedure.
