canonical_text:
  quote: ''
  summary: The passage discusses Nit or Neith as a goddess symbolized by crossed arrows
    and a shield, probably indicating an early hunting character, and later represented
    with two crocodiles at her breasts, suggesting power over the river. It also describes
    Egyptian use of animals and cult objects as divine symbols, gives examples from
    nome signs, notes the geographic spread of Neith’s cult, and summarizes Egyptian
    ideas that gods could age, die, feel human emotions, consume food and drink, intermarry
    with humans, and beget offspring. A footnote identifies Sebek as called the son
    of Neith in the text of Unas.
  language: English
  quote_policy: summarized
