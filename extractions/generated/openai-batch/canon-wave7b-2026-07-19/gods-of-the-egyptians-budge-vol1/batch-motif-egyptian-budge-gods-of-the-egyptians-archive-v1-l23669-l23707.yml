canonical_text:
  quote: he absorbed the attributes of all the other Horus gods
  summary: 'The passage describes several iconographic forms of Horus, son of Isis:
    as a child on a lotus, as a spear-wielding figure identified with Heru-Behutet,
    as a composite guardian of Osiris''s funeral coffer, as a seven-headed composite
    figure holding a knife and serpent, and as a jackal-headed syncretic form with
    Anpu or Anubis called Heru-em-Anpu.'
  language: English
  quote_policy: quoted
