canonical_text:
  quote: ''
  summary: The passage describes Khepera as a beetle-form, self-produced creator who
    brings forth Shu and Tefnut, is associated with the rising sun and the abyss of
    Nu, and becomes a model for the dead body containing a living germ. It explains
    scarabs as funerary and protective objects connected with resurrection, the heart,
    the ka or double, the Opening of the Mouth, and acquittal in the Judgment Hall
    of Osiris.
  language: English
  quote_policy: summarized
