canonical_text:
  quote: ''
  summary: The passage discusses Thoth and the ape in the Judgment Scene, the Hermopolitan
    four pairs or ogdoad in relation to Heliopolitan theology, and Thoth's role as
    judge, scribe, and arbiter in Egyptian divine combats between light and darkness.
    It describes the ape watching the balance during the weighing of the deceased's
    heart, Thoth restoring the Eye of Ra after clouds obscure it, and Thoth preventing
    total victory between hostile divine forces.
  language: English
  quote_policy: summarized
