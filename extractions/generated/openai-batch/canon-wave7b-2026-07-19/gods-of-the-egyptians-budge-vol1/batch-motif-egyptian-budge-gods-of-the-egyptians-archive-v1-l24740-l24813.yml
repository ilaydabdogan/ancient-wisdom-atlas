canonical_text:
  quote: ''
  summary: A modern scholarly passage describes Egyptian divine identifications among
    Thoth/Shu, Tefnut, Ptah, Sekhet, Bast, Pakht/Pekhet, and Ra. It discusses Sekhet
    as the Eye of Ra, a vignette with an Utchat-headed goddess and hawk, Bast on Ptah-Seker-Asar
    figures, Pakht as a feline or lioness-associated deity with a rock-cut temple
    near Beni Hasan, and the late composite deity Sekhet-Bast-Ra in Book of the Dead
    Chapter 164 with mixed female, male, bird, and lion attributes and solar generative
    power.
  language: English
  quote_policy: summarized
