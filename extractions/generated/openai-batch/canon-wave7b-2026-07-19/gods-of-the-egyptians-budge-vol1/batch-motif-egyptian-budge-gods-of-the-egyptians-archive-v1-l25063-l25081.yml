canonical_text:
  quote: ''
  summary: The passage presents I-em-hetep as a god whose images suggest human and
    local origin, discusses his replacement of Nefer-Tem at Memphis despite lacking
    a stated divine parentage through Ptah and Sekhet or Bast, and dates the popularity
    and material evidence of his cult mainly to later periods. It also compares his
    Memphis worship in the Ptolemaic period with the Theban worship of Amen-hetep,
    son of Hapu, described as a sage who had seen and conversed with gods.
  language: English
