canonical_text:
  quote: "“Thus Net was the prototype of partheno-genesis.”"
  summary: The passage presents a prayer to the hidden goddess Net in the doubly hidden
    underworld, then discusses Net as eternal, self-produced, both masculine and feminine,
    mother of Ra without a husband, represented as a vulture in her character as universal
    mother, and associated with clothing and protecting the dead, including Osiris.
  language: English
  quote_policy: quoted
