  text: The prayer addresses a great goddess in the doubly hidden underworld as unknown,
    divine, and great.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prayer asks the hidden goddess Hapt to grant entrance, receive the soul
