canonical_text:
  quote: ''
  summary: The passage opens Chapter XVI on Ptah and the Memphite triad. It identifies
    Ptah, also called Ptah-neb-ankh, as a very old god of Memphis whose worship reaches
    back to the early dynastic period. It reports and then questions the view that
    Ptah was a Sun-god or rising-sun personification and that his name meant "Opener."
    It argues instead that Egyptian evidence connects the word with engraving, carving,
    and chiseling, and cites Brugsch's proposal that Ptah means "sculptor, engraver,"
    fitting Ptah's role as chief god of handicraftsmen.
  language: English
