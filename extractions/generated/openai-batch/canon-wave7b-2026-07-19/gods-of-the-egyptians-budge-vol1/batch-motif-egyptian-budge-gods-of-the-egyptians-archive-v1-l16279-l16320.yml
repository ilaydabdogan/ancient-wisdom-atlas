canonical_text:
  quote: ''
  summary: A summarized account says that after Ra describes his weariness to Nu,
    Nu assigns Shu to take over Ra's work and directs Nut to carry Ra. Nut becomes
    a cow and bears Ra on her back. Humans see this, repent, arm themselves against
    Ra's enemies, and Ra declares their sins forgiven. Ra then rises into the sky,
    creates a kingdom, brings the Field of Hetep into being, plants green herbs there,
    fills the sky with stars, and creates supports to strengthen Nut.
