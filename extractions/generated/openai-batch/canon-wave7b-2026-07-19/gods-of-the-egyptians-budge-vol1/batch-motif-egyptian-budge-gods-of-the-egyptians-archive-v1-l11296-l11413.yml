canonical_text:
  quote: ''
  summary: The passage recounts a damned mummy's soul being carried to Amentet and
    tormented among reptiles and serpents, then identifies Apep/Apepi as the arch-serpent
    enemy of Ra who attacks the sun-god daily and is overcome daily. It describes
    a ritual service against Apepi using written names, a wax effigy, burning, spitting,
    dung, and recitations that proclaim Apepi's mutilation, burning, binding, and
    subjection before the boat of Ra by Horus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A nameless mummy narrates that avenging angels came before death with iron
    knives and pointed goads and thrust them into his sides.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Other angels tore the soul from the body, tied it to the likeness of a black
    horse, and carried it to Amentet.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The soul is described as being tortured in a place of noxious reptiles, outer
    darkness, and a deep pit filled with seven-headed reptiles whose bodies were covered
    with scorpion-like objects.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: A terrible serpent with teeth like iron stakes is said to devour and crush
    the soul for five days each week, with respite on Saturday and Sunday.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The passage states that hostile powers affecting the dead or living were commonly
    given the form of snakes or serpents.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: Apep or Apepi is described as the arch-serpent, the type and symbol of enmity
    to Ra, attacking Ra daily and being overcome daily.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: A special Upper Egyptian service is described as aiming to destroy Apepi's
    power and make his attacks on the sun ineffective.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: One rubric orders Apepi's name to be written in green on new papyrus and a
    wax figure of the fiend to be made with his name inlaid in green.
  category: object
  evidence_refs:
  - ev:4
- id: obs:9
  text: The papyrus and wax figure are burned so that, as they burn or melt, Apepi
    is believed to decay and fall to pieces.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The melting wax figure is to be spat upon repeatedly, and its refuse mixed
    with dung and burned again.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The rite is prescribed for midnight, dawn, noon, eventide, any hour of the
    day, and occasions when storm clouds or rain clouds appear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:12
  text: A recitation declares that Apepi falls into flame, has a knife stuck in his
    head, loses his name on earth, is pierced with darts, has his soul destroyed,
    and has his bones and limbs burned.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: The recitation says Horus decrees that Apepi come in front of the boat of
    Ra, where a steel fetter binds him and prevents his limbs from moving.
  category: speech
  evidence_refs:
  - ev:5
