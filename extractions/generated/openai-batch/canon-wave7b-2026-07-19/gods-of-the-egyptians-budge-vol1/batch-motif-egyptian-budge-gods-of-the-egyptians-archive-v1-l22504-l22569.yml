  quote: ''
  summary: The passage describes crocodile gods flanking a goddess, discusses Net
    at Thebes under the name and form of Ament and Ament-Ra, and lists maternal and
    creative titles attributed to Ament. It then introduces the Horus gods, describing
    the hawk as an early object of worship, Heru as a sky-related deity later understood
    as the Face of heaven, and the four children of Horus as supporting the Face of
    heaven with sceptres in a role compared to Shu’s four pillars.
