  quote: ''
  summary: The passage describes Budge’s account of Hehu and Hehut as a second primeval
    pair with uncertain characteristics, possible associations with fire, unlimited
    time, atmosphere, and supporting Harpocrates in an illustrated scene. It then
    describes Kekui and Kekuit as a third pair associated with darkness over the primeval
    watery abyss, liminal night periods around day, Elephantine and Nile associations,
    and animal-headed iconography.
  language: English
  quote_policy: summarized
