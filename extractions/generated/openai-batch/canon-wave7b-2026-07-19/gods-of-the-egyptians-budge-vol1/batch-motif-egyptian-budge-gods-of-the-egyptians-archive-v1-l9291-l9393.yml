canonical_text:
  quote: ''
  summary: 'The passage describes figures and actions in the Eleventh Division of
    the Tuat: Ra is praised at sunrise, divine groups stand near or precede his boat,
    some beings remain confined in the division while serving Ra and Osiris, the boat
    is drawn forward, an exit from Ament and transformations in Nu are described,
    and Apep or the Worm is attacked, slaughtered, and fettered.'
  language: English
  quote_policy: summarized
