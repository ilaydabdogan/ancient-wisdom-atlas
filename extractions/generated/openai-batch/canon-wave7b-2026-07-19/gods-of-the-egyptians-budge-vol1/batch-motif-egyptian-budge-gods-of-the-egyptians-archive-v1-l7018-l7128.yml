  quote: ''
  summary: The passage argues that Egyptian divine attributes assigned to many deities
    can be understood as phases or aspects of a single Great God. It describes Egyptian
    gods as created by and inferior to this Great God, compares the Great God’s position
    to Yahweh and Allah, compares subordinate gods to angels and spirits, and discusses
    declarations of divine oneness in Egyptian, Hebrew, and Arabic religious contexts.
    It also notes scholarly disagreement over whether Egyptian religion should be
    described as monotheistic or polytheistic.
