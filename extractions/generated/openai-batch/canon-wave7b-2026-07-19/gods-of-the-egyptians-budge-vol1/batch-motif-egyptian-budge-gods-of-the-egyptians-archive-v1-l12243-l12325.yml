canonical_text:
  quote: ''
  summary: The passage compares a Babylonian creation account with Egyptian allusions
    to primeval divine pairs, describes an inferred Egyptian primeval watery mass
    enveloped in darkness, reports Brugsch's reconstruction of a primeval spirit producing
    an egg from the waters from which Ra emerges, and then qualifies or rejects parts
    of that reconstruction. It also describes the Hermopolitan company of Eight Gods,
    Thoth's later headship over them, and rejects an Egyptian textual basis for an
    equivalent of the Genesis spirit of Elohim brooding over the waters.
  language: English
  quote_policy: summarized
