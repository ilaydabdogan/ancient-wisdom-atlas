canonical_text:
  quote: ''
  summary: 'Budge describes an older company of Egyptian gods as paired deities and
    personifications of primeval matter. The passage focuses on Nu and Nut: Nu is
    linked with the watery mass of the sky, the deep primeval water from which the
    world and life emerged, and later identifications with sky, ocean, Nile, and heaven;
    Nut is described as Nu''s female counterpart and primeval mother, later identified
    with several goddesses. The passage also notes variable iconographic forms for
    Nu and Nut.'
