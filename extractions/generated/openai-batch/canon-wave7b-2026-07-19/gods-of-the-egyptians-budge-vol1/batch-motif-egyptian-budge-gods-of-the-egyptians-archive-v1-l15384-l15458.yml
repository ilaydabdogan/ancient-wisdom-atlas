canonical_text:
  quote: ''
  summary: The passage gives a sequence of hymnic praises to Ra as exalted Sekhem,
    identifying him with hidden watcher gods, ape and named divine forms, earth-renewal,
    travel, light, darkness, the double Sphinx and obelisk form, and speech with gods
    in circles. Budge’s commentary then summarizes Ra as a solar symbol, maker and
    creator of gods, humans, heaven, earth, and underworld, self-created and eternal,
    source of life and light, destroyer of darkness and evil, deity of living, dead,
    and unborn, and related to Osiris as god, father, and equal.
  language: English
  quote_policy: summarized
