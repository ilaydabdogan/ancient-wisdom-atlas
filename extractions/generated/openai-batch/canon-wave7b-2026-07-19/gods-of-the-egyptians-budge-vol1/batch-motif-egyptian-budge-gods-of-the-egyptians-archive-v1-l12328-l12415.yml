  summary: The passage describes the Papyrus of Nes-Amsu, its ritual-magical works
    against Apepi, its temple context, and its two creation-story copies. It summarizes
    Neb-er-tcher/Ra as a self-coming-into-being creator whose creations come from
    his mouth, and explains Khepera as a beetle-form of Ra associated with the sun
    disk, life, resurrection, and self-production.
