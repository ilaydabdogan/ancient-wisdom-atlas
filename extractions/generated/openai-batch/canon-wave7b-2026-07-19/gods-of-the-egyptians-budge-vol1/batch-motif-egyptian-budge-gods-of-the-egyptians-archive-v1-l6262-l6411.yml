canonical_text:
  quote: ''
  summary: The passage presents a translated extract from the Precepts of Khensu-hetep
    and Budge's commentary on it. The worshipper is exhorted to adore God's name;
    God is described as giving souls or life to multitudes and exalting those who
    exalt him. The passage then distinguishes this God from Shu, the solar god associated
    with earth and the horizons, whose similitudes or likenesses receive daily incense
    and food offerings. Budge interprets the group of extracts as emphasizing the
    difference between the Egyptian conception of God and the gods, and connects the
    text with a moral-precept tradition rather than a funerary context.
  language: English, with transliterated Egyptian fragments
  quote_policy: summarized
