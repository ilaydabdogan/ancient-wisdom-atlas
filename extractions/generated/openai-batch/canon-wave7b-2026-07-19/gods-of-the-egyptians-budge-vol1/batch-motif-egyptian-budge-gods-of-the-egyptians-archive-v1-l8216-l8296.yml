canonical_text:
  quote: ''
  summary: The passage describes the Tuat as the realm of Osiris and a mountain-enclosed,
    river-crossed, dark valley between earth and heaven, populated by hostile beings.
    It also describes an image from Seti I's sarcophagus in which the Tuat is likened
    to Osiris's circular body, with Nut supporting the sun disk, and explains the
    Tuat as the path of the dead sun from sunset to sunrise. The passage further discusses
    Theban incorporation of local Egyptian underworld traditions and compares the
    Tuat's partitioning function with Hebrew and Muhammadan eschatological divisions.
  language: English
  quote_policy: summarized
