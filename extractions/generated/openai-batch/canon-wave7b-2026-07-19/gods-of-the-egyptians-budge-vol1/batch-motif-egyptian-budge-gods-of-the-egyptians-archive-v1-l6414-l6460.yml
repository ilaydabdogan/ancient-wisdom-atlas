  quote: '"God One, who came into being in primeval time"'
  summary: The passage is a modern scholarly discussion of Egyptian texts that ascribe
    oneness or unity to several great gods. It states that earlier passages imply
    divine exclusivity without explicitly saying so, then lists epithets for Ta-tunen,
    Ea-Tem, the great Khu created by Tem, and Osiris. Ea-Tem is especially described
    as a creator of heaven, earth, beings, the Nile, waters, mountains, people, animals,
    and life. The passage also notes a case where attributes of Ra are transferred
    to Amen-Ra.
