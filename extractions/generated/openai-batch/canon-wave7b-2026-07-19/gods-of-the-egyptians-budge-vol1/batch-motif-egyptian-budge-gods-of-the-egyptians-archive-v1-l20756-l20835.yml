  quote: ''
  summary: The passage describes a cow-form sky goddess, associated with fertility,
    creation, the world lotus, and an early judgment of the dead in the Hall of Meh-urt.
    It then describes Sefkhet-aabut/Sesheta as a goddess linked with Thoth, writing,
    books, names, and counting, while noting uncertainty about her hieroglyphic sign
    and name.
  language: English
  quote_policy: summarized
