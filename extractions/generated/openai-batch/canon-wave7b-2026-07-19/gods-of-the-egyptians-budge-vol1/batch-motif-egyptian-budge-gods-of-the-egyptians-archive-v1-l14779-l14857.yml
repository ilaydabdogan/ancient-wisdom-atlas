canonical_text:
  quote: ''
  summary: 'Budge summarizes the Heliopolitan doctrine: priests of Ra proclaimed Ra''s
    sovereignty while absorbing older Egyptian cults; Osiris and Isis were incorporated
    into the Heliopolitan company. The passage contrasts Osirian hopes in a fertile
    afterlife and an underworld king-judge with the Ra doctrine in which blessed souls
    reach Ra''s boat, live in light, pass through the Tuat, and return to the boat
    before night. Budge describes a continuing contest between the priesthoods of
    Ra and Osiris, ending with the prevalence of Osirian doctrine and the attribution
    of solar qualities to Osiris.'
  language: English
  quote_policy: summarized
