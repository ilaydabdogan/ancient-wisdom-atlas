canonical_text:
  quote: Horus the Child became the type of the new birth, and new life...
  summary: Budge describes Harpocrates or Horus the Child as son and successor of
    earlier Horus forms and of Osiris, as a type of new birth and youthful vigor,
    and as a figure syncretically identified with several Egyptian deities. The passage
    also summarizes Mendes associations with Osiris and the Ram of Mendes, and begins
    a Book of the Dead legend explaining why Ra gave Pe to Horus after an injury to
    Horus's eye caused when he looked at a black pig.
  language: English
  quote_policy: quoted
