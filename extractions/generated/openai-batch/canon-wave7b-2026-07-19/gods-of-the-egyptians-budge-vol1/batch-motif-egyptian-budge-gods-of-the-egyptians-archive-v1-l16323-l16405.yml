canonical_text:
  quote: ''
  summary: 'The passage describes a representation of Nut as a great cow embodying
    the heavens and sky, supported by Shu and other gods, with stars and the two solar
    boats beneath her belly. The narrative then reports Ra’s commands to Seb and Thoth:
    Seb is to watch serpents in earth and water, while Thoth is appointed as Ra’s
    deputy and representative, associated with writing punishments for rebels and
    with the coming into being of the Moon. The passage ends with purification requirements
    for anyone who repeats Ra’s holy words.'
  language: English
  quote_policy: summarized
