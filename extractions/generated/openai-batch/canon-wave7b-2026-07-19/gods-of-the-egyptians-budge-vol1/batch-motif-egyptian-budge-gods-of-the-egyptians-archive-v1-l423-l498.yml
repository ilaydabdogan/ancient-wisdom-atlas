canonical_text:
  quote: Everything in nature was inhabited by a spirit
  summary: The passage summarizes Budge's account of persistent Egyptian funerary
    beliefs from early to Roman periods, including Anubis, animal-headed guardians,
    the weighing of the heart, Thoth, Horus, and Osiris. It then describes indigenous
    and predynastic Egyptian beliefs in a spirit-filled world where natural elements,
    objects, images, and named representations could be animated by spirits of varying
    power, including an ambivalent Nile inundation spirit.
  language: English
  quote_policy: quoted
