canonical_text:
  quote: ''
  summary: The passage recounts Horus telling Ra that his eye has been struck by Suti.
    It identifies the black pig as Suti/Set in transformed form and says he struck
    Horus’s eye with a blow of fire. Ra orders Horus placed in his chamber, declares
    the pig abominable to Horus, and the divine company calls for sacrifices of bulls,
    goats, and pigs. The passage then names Horus and Isis as parents of Mesthi, Hapi,
    Tuamutef, and Qebh-sennuf, records Horus’s request for divine brethren at Pe and
    Nekhen to serve as everlasting judges, and catalogues additional forms and depictions
    of Horus/Sept.
  language: English
  quote_policy: summarized
