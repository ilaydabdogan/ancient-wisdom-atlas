canonical_text:
  quote: ''
  summary: Budge discusses the Egyptian term pauti or pautj, rendered as “company,”
    and argues that although it is often associated with the number nine, Pyramid
    Text examples show divine companies containing nine, ten, eleven, or twelve gods.
    The passage gives examples involving Unas, Mer-en-Ra, Pepi II, the Great and Little
    companies of gods, and Maspero’s explanation that an original set of nine could
    be expanded by adding associated gods.
  language: English
  quote_policy: summarized
