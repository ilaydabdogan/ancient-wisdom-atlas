  quote: ''
  summary: Budge summarizes Egyptian creation traditions in which a self-begotten
    god exists alone in a primeval watery mass, utters his own name as a word of power,
    comes into being as Khepera, activates the abyssal soul, produces a standing-place
    probably identified with earth, and brings forth Shu and Tefnut, causing light
    to appear and darkness to disperse.
