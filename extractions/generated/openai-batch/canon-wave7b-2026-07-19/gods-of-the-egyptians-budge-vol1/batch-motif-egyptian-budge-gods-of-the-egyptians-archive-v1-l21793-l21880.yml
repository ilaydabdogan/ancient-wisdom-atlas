canonical_text:
  quote: ''
  summary: The passage quotes an account of the festival and temple of Bubastis, describes
    the temple’s Nile-side setting, trees, image, and approach, then summarizes Bubastite
    divine triads and a local hidden chest containing a thigh of Osiris. It then turns
    to Net or Neith, describing her antiquity, common iconography as a crowned woman
    with sceptre, life-symbol, bow, and arrows, an animal-and-boat representation,
    her late identification with Hathor, and a possible earlier association with the
    primeval watery mass from which Ra emerged.
  language: English
  quote_policy: summarized
