canonical_text:
  quote: ''
  summary: 'The passage describes several forms of Horus: a Khatat-associated form
    incarnate as hawk or serpent and emerging from a lotus in the heavenly abyss of
    Nu at dawn; Heru-hekennu, son of Bast, shown as a hawk-headed man with a serpent-encircled
    solar disk; and Horus of Behutet as a powerful midday solar form who defeats Set
    or Typhon and is depicted as hawk-headed, lion-formed, crowned, trampling enemies,
    and armed as a destroyer.'
