canonical_text:
  quote: ''
  summary: Budge describes the worship of Egyptian gods from predynastic times through
    later periods, emphasizing local village gods, their emblems and habitations,
    the destruction or transfer of divine symbols, the proliferation and selection
    of gods, the development of great gods from helpful spirits, difficulties in enumerating
    all Egyptian gods, continuity between earlier and later Egyptian pantheons, and
    the temporary admission of foreign gods without displacement of indigenous divine
    functions.
  language: English
  quote_policy: summarized
