  quote: ''
  summary: The passage describes utterances and ritual books for overthrowing Apep,
    the Enemy of Ra. Apep is bound, cursed, pierced, dismembered, burned, and destroyed
    along with his confederates and their nonphysical components. The Books of Overthrowing
    Apep are said to have been recited daily in the temple of Amen-Ra at Thebes, and
    Apep's many names are listed so that each may be cursed.
  language: English
