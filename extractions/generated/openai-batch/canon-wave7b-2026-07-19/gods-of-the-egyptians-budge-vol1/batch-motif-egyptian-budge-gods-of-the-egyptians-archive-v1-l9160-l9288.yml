canonical_text:
  quote: ''
  summary: The passage describes episodes in the Tenth and Eleventh Divisions or Hours
    of the Tuat. Groups of divine, human, animal-headed, and star-associated beings
    tow or accompany the boat of Ra, restrain and attack serpent enemies including
    Apep, and help the sun-god continue toward sunrise and daybreak.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the left hand of the boat, sixteen human forms represent souls of Amentet
    and followers of Thoth, Horus, and Osiris; they draw a rope attached to a double
    serpent.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The double serpent is described with four heads, two at each end, and legs
    at each end; the hawk Heru-tuati is perched in its folds.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Eight human forms called Akhmiu are at the other end of the rope, and the
    god is being towed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: A procession includes human forms, apes, and women holding ropes, followed
    by three men restraining a prostrate ass-eared man called Aai with a rope and
    holding pikes against him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Apep and a crocodile with a serpent-headed tail stand before the prostrate
    figure, and the text describes magical action and speech against Apep.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Three pike-bearing beings drive weapons into Apep and destroy the serpent
    Sesi.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Tenth Division, Apep is held by a chain grasped by four beings, twelve
    gods, and a mighty hand called the hidden body; the scorpion-goddess Serqet is
    stretched on the chain near Apep's head.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The beings on this side of the Tuat are said to destroy Apep and the foes
    of the sun-god so they cannot attack the sun's boat at a narrow passage.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Other beings near the boat include Hours, gods with sceptres, a monkey on
    a standard with a star over its head, an eye, deities, star gods towing a small
    boat, Besi pouring flame, the serpent Ankhi, adorers, and the double god Horus-Set.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The text states that these beings help Ra continue through the Tenth Division
    toward the region of sunrise and that many are personifications of stars heralding
    dawn.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: In the Eleventh Division, the pylon is named Shetat-besu; crowned sceptres
    are called Osiris and Horus, and gods carrying stars and Hours seated on coiled
    serpents appear near the boat.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage says these star personifications bear the boat of Ra toward daybreak
    and wish to see it floating on Nut.
  category: action
  evidence_refs:
  - ev:9
