- id: obs:5
  text: The passage describes Revelation’s great red dragon as having seven heads,
    ten horns, and seven crowns, and Revelation’s beast from the sea as having seven
    heads, ten horns, and ten crowns on its horns.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The author states that the Hebrew conception of Leviathan was of Babylonian
