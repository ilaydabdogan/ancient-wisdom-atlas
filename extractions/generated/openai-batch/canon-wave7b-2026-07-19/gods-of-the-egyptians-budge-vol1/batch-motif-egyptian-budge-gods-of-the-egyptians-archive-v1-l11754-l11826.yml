  text: The passage links Revelation ix.19’s horses with serpent-like tails and heads
    to a Tuat Pylon monster with a crocodile body and a serpent-body tail ending in
    a serpent head.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:9
