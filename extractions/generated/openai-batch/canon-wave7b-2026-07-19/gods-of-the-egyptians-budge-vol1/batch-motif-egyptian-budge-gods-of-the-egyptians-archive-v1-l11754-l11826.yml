canonical_text:
  quote: ''
  summary: Budge compares a bright world-illuminating covering with Marduk’s canopy
    made from Tiamat’s body or skin; discusses Leviathan, the seven-headed dragon
    and beast in Revelation, the seven-headed basilisk in Pistis Sophia, and an Egyptian
    seven-headed serpent in the Pyramid Texts; connects a serpent-tailed monster of
    the Tuat with Revelation’s serpent-headed horse tails; and contrasts Hebrew borrowing
    of an Egyptian hell-framework with Coptic Gnostic retention of magical names and
    words of power, illustrated by prayers in Pistis Sophia.
  language: English
  quote_policy: summarized
