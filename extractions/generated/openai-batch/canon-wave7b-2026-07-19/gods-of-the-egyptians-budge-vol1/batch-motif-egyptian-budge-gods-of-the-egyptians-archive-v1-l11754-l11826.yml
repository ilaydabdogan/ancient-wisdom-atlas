- id: obs:2
  text: The passage says this bright covering recalls the Fourth Tablet of the Creation
    Series, where Marduk makes a heavenly canopy from one-half of Tiamat’s body or
    skin.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that a Hebrew version says the righteous feed on Leviathan’s
    body, while no equivalent cuneiform passage is presently known.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage states that Psalm lxxiv.13 suggests Leviathan had many heads,
    but that known descriptions of Tiamat do not support many-headedness.
  category: attribute
  evidence_refs:
