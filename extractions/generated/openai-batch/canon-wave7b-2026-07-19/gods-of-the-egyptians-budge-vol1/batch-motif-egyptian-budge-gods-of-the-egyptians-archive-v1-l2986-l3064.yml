  summary: The passage argues that composite animal-human divine forms mark a developmental
    stage linking animals and humans, notes Egyptian persistence in representing gods
    in animal forms, defines the Egyptian word neter for gods and supernatural beings,
    and discusses the hieroglyphic determinative/ideograph for neter as an axe, with
    cross-cultural examples of axes used as religious or magical emblems.
