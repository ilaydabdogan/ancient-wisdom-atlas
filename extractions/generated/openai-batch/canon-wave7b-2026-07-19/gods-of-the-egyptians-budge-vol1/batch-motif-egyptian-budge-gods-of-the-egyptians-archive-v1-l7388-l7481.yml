canonical_text:
  quote: ''
  summary: 'The passage summarizes a theological view, attributed to Theban and Heliopolitan
    priestly traditions, in which Osiris is assimilated to solar gods and identified
    with Ra. It lists Osiris''s cosmic, royal, and solar attributes, including defeat
    of Seba, establishment of maat, creation of the earth and living things, and possession
    of Ra''s disk, rays, throne, knowledge, and magical powers. It then describes
    Osiris as both divine and human: his human body lived on earth, was killed and
    mutilated by his brother, and was restored to life when Isis learned divine words
    and ceremonies from Thoth. After revival Osiris entered the Underworld as judge
    and god of the dead, and Egyptian priests developed magical rites and recitations
    said to reproduce the rites used for Osiris''s resurrection and to confer immortality.'
  language: English
  quote_policy: summarized
