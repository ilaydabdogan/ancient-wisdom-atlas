canonical_text:
  quote: ''
  summary: 'The passage cautions against judging Egyptian religion by foreign or later
    standards, states that Egyptian texts show ancient belief in monotheism and immortality,
    and then describes Egyptian ideas of heaven: heaven is above the sky; heaven and
    sky are linguistically distinguished; day and night skies are named; the sky/heaven
    is represented as a slab supported by mountains or pillars; the sun emerges from
    one mountain and enters another; and heaven is divided first into East and West
    and later into four parts under gods.'
  language: English
  quote_policy: summarized
