canonical_text:
  quote: ''
  summary: The passage summarizes an Edfu temple text in which Heru-behutet/Horus
    of Behutet is a luminous, self-created creator who dispels darkness and storms,
    renews his birth daily, and brings the seasons. It also describes an Osirian aspect
    in which Isis and Nephthys help him emerge from the abyss of Nu, and it presents
    his combat with Set as a struggle of light and good against darkness and evil,
    with reference to a Book of the Dead passage about mutual injuries in the conflict.
  language: English
  quote_policy: summarized
