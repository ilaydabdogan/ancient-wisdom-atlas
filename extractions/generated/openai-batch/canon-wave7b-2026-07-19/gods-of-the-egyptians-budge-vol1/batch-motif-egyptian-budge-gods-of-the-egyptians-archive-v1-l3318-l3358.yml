  quote: an Egyptian god is a being who is born and dies, like man
  summary: The passage summarizes scholarly views on the Egyptian word neter, noting
    proposed meanings such as renewal, strength, strong, or becoming, while also citing
    views that its original meaning is unknown. It reports Maspero's caution that
    Egyptian gods should not be read through modern definitions of god, because Egyptian
    gods may be finite, corporeal, passionate beings who are born and die. The passage
    also states that ideas close to monotheism existed among educated Egyptians alongside
    such conceptions.
