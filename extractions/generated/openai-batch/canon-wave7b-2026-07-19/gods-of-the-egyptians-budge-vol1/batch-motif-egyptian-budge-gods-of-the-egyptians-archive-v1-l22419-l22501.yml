canonical_text:
  quote: ''
  summary: The passage describes Net in relation to Osiris, funerary preservation,
    festivals at Sais, worship at Seni/Esneh, leonine and bovine representations,
    motherhood of several gods, primordial creation, Tutu as a son or form associated
    with Shu, lion and crocodile imagery, and a hymn in which Amen-Ra or the Sun-god
    is connected with Net, fertility, a woven veil, and crocodile gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Net mixes unguents that preserve the body of Osiris from destruction and make
    it young again.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The dead are described as fortunate if they can secure Net's ministrations.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Late dynastic texts are said to regard Net as a mother of Osiris, and Sais
    is called the city of Osiris.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Seasonal festivals at Sais commemorate the embalming, bandaging, and burial
    of Osiris; the feast of lamps is named as especially important.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: A spring festival is described as occurring on the birthday of Osiris, the
    son of Isis-Net, and Brugsch identified it with the birthday of the spring sun.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: In Upper Egypt Net is chiefly worshipped at Seni or Esneh, called the house
    of Net in the land of the south.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Seni or Esneh Net is identified with Nebuut, Menhit, Sekhet, and Tefnut,
    and is represented with a green lioness head.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Net's titles include Father of fathers, Mother of mothers, great lady, lady
    of the south, great cow who gave birth to the sun, maker of the germ of gods and
    men, mother of Ra, raiser of Tem in primeval time, and a being who existed when
    nothing else had being and created what exists.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: The people of Seni assign Net a ram-headed husband and identify her as mother
    of Tutu, a form of Shu whose symbol is a walking lion.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Tutu is described as a young man with northern and Atef crowns, uraei and
    disks, and a forefinger raised to his mouth.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:11
  text: Brugsch interprets Tutu as the personification of the sun entering Leo and
    connects lion-headed temple rain-spouts with the summer sun.
  category: other
  evidence_refs:
  - ev:5
- id: obs:12
  text: The lion-headed spouts are called Lion, Strong one of strength, mighty of
    strength, possessor of two-fold strength, mighty one of roarings, fiery-face,
    and lion of the face which enchants or terrifies.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: A form of Tutu is described as a god of the south and identified with the
    crocodile-headed Sebek-Ra or Hesnefer-Sebek, son of Net.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Amen-Ra, king of the gods, is said to be the son of Net in texts cited by
    Brugsch.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:15
  text: A hymn of Darius II describes the Sun-god as a husband who makes fertile with
    his seed, and it describes mother Net arraying his body in a woven veil or raiment
    associated with two crocodile gods.
  category: action
  evidence_refs:
  - ev:7
