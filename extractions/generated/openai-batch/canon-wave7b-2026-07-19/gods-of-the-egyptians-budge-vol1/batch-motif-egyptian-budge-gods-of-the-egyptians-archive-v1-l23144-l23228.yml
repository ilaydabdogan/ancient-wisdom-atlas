canonical_text:
  quote: ''
  summary: The passage recounts Horus and Herubehutet defeating enemies associated
    with Set under Ra's authority. Set changes into a hissing serpent and is contained
    by Horus in a pole-like form. Ra's boat reaches a battle site, further enemies
    are slain, Isis uses words of power, Horus changes into a lion-form warrior, and
    Thoth recites magical formulae to protect Ra's boat and calm the sea.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A young god attacks a monster, cuts off the monster's head and the heads of
    its followers, and drags the body with a spear through the land in the presence
    of Ra and the company of gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ra orders Horus, the son of Isis, to drag the monster's body; Isis asks Ra
    to give the winged sun-disk to Horus as a talisman because he has cut off the
    heads of the fiend and companions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Herubehutet and Horus, son of Isis, pursue Set together and are described
    as having the same form and appearance: human bodies, hawk heads, White and Red
    Crowns, plumes, and uraei.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Set changes himself into a loudly hissing serpent, finds a hole in the ground,
    and hides and lives there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ra says Horus should stand above the serpent's hole in the form of a pole
    topped with the head of Horus so that the serpent cannot come out again.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Horus, son of Isis, stands over the serpent in the form of a pole or staff
    topped with the head of a hawk.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The boat of Ra arrives at Per-aha, the House of Battle; its fore part is made
    of acacia wood and its after part of sycamore wood, and both woods become holy.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ra exhorts Horus to finish the remaining enemies; Horus spears and slaughters
    one friend of Set before Ra, followed by a truce of six days and six nights.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Isis uses words of power to keep Ba, identified in the passage with Set, away
    from the district called An-rut-f.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Horus slays 106 enemies, then later changes into a lion with a human head,
    triple crown, and sharp knife, pursues fleeing enemies, brings back 142, slays
    them, and tears out their tongues.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ra wishes to travel farther on the sea to strike remaining foes living as
    crocodiles and hippopotami near Egypt, but Horus says further sailing is impossible
    because a third of the enemies remain in the sea.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Thoth recites chapters of magical formulae to protect Ra's boat and the vessels
    of the blacksmiths and to quiet the sea during storm; after this Ra and his company
    cross the whole sea and see no more enemies.
  category: action
  evidence_refs:
  - ev:7
