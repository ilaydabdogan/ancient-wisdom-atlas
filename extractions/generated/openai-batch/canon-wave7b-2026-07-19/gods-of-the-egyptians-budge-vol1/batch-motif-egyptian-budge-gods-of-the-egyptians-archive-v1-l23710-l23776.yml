  quote: ''
  summary: The passage explains symbolic associations of two jackal gods with calendrical
    and cosmic dualities, then discusses the identification of Horus, son of Isis,
    with Horus of Hebennu and with Anubis. It states that Horus and Anubis both assisted
    in mummifying Osiris, and that Anubis is linked with a purification chest containing
    Osiris's inner parts and with appointing the Seven Spirits. It also reports variant
    authorities on the names or identities of the Seven Spirits.
