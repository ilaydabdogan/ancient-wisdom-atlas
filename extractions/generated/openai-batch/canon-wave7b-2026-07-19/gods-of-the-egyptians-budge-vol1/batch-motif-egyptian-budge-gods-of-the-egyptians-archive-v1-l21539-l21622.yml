canonical_text:
  quote: ''
  summary: The passage summarizes references to Uatchet in the Book of the Dead and
    embalming rites. Uatchet is described as a serpent around a papyrus stalk, the
    Eye of Ra, connected with Horus, identified with body parts and divine identities
    of the deceased, associated with Ra's heavenly boat, and invoked as a living Uraeus
    who anoints the mummy's head with flames. Uatchet and Nekhebet are paired on the
    head and brow of the deceased as on Ra. The passage also states that Uatchet destroys
    the foes of the deceased, connects her with Maat and a female counterpart of Thoth,
    names her as goddess of the eleventh month, and then introduces Bast as Lady of
    the East and goddess of the eastern Delta.
  language: English
  quote_policy: summarized
