canonical_text:
  quote: ''
  summary: The passage describes parts of the Second and Third Hours of the Night
    in the Book of the Underworld. Ra travels by boat through the Tuat, revives beings
    by his voice, gives food and water, and passes through the Stream of Osiris. Osiris
    is presented as lord of the Second Hour but subordinate to Ra. Gods and beings
    attached to Osiris worship Ra, guide him, guard their districts, oppose Ra's enemies,
    and sustain cosmic functions. Knowledge of names and hidden underworld things
    grants safe passage and sustenance to souls.
  language: English
  quote_policy: summarized
