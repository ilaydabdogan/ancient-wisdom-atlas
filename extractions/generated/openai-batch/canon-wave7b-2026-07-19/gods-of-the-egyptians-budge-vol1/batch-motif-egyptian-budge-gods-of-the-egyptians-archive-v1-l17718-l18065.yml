canonical_text:
  quote: ''
  summary: The passage identifies divine self-descriptions involving Hap/Nile, Khepera
    in the morning, Ra at noontide, and Temu in the evening. A poison afflicts the
    great god Ra and is not relieved. Isis tells Ra that his name has not been included
    among the things he has told her and asks him to tell it to her so that the poison
    may come out. The poison burns more strongly than fire. Ra says he will give himself
    from his body into her body so that his name may be searched out by Isis. The
    divine one hides himself from the gods, leaving the place in the Boat of millions
    of years empty. When the time comes for the heart to come forth, Isis tells her
    son Horus to make Ra bind himself by an oath.
  language: English with Egyptian transliteration
  quote_policy: summarized
