canonical_text:
  quote: ''
  summary: 'The passage surveys scholarly arguments that ancient Egyptian religion
    contained a doctrine of a single supreme deity: one, uncreated, hidden, eternal,
    creator, and legislator. It reports claims that the many Egyptian gods are names,
    attributes, aspects, or temple forms of this unique deity, notes the coexistence
    of animal-headed divine images, summarizes Brugsch’s compilation of divine epithets,
    and records an objection that those epithets are scattered rather than presented
    together.'
  language: English
  quote_policy: summarized
