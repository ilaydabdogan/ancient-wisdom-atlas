canonical_text:
  quote: ''
  summary: The passage describes Budge's account of Egyptian ideas about the abode
    of the blessed. It interprets Mauit and a bread-bringing young woman as forms
    of celestial waters, describes Egyptian heaven as simple and peaceful, explains
    ascent to heaven by mountains or by ladders supplied in tombs or papyri, and summarizes
    later beliefs in resurrection and an afterlife continuing earthly activities in
    Sekhet-hetep.
  language: English
  quote_policy: summarized
