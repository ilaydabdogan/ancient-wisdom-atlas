canonical_text:
  quote: ''
  summary: Ra, aged and traveling in his usual divine procession, is bitten by a serpent
    that Isis has formed from his spittle mixed with earth and placed in his path.
    The poison overwhelms him, and he summons the gods who possess magical speech.
    Isis arrives with words of power and asks Ra to tell her his name, saying that
    one delivered by that name will live. Ra replies by recounting his creative acts
    and saying that the gods do not know his name.
  language: English
  quote_policy: summarized
