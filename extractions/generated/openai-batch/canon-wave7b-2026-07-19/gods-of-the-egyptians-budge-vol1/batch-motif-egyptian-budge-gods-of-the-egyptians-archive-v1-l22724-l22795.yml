- id: obs:3
  text: Heru-khuti is said to have produced himself.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Heru-khuti is given titles including lord of heaven, lord of Sept-Hat, governor
    of the Aat of Ra, lord of the two lands of Annu, and dweller in Behutet.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The chief shrines of Heru-khuti are said to have been at Annu/Heliopolis and
    Apollinopolis, with the greater at Annu where he was identified with forms of
    Ra.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sphinx near the Pyramids of Gizeh is described as the largest known monument
    or figure of Heru-khuti and as his type and symbol.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The stele between the paws of the Sphinx is said to record that the image
    had become entirely covered with sand before the time of Thothmes IV.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The god of the Sphinx, named Heru-khuti-Ra-Temu-Khepera, is said to have appeared
    to Thothmes IV during his midday sleep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The god promised Thothmes IV the crown of Egypt if he cleared sand from the
    image and restored the temple.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Thothmes IV is said to have excavated the Sphinx, rebuilt the temple between
    its paws, and set up an inscribed stele to commemorate the work.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Heru-khuti is represented in many forms, usually with the head of a hawk.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Some representations show Heru-khuti wearing the solar disk encircled with
