canonical_text:
  quote: ''
  summary: The passage describes Harmachis/Heru-khuti as identified with solar forms
    including Temu, Khepera, and Ra; records epithets and shrines; presents the Sphinx
    near Gizeh as his type and symbol; recounts a dream in which the god of the Sphinx
    promises Thothmes IV the crown of Egypt if he clears sand from the image and restores
    its temple; and lists several iconographic forms of Heru-khuti, including hawk-headed,
    ram-headed, two-faced, and throne-seated forms.
  language: English
  quote_policy: summarized
