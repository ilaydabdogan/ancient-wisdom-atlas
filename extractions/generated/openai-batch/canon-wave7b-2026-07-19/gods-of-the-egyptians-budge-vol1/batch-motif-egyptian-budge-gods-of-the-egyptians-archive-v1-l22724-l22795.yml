- id: obs:1
  text: Temu is described as the god of the setting sun, and Khepera as the god of
    the sun when it is about to rise.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Heru-khuti is said to have been identified with various forms of the Sun-god
    and to possess their attributes.
  category: relationship
  evidence_refs:
