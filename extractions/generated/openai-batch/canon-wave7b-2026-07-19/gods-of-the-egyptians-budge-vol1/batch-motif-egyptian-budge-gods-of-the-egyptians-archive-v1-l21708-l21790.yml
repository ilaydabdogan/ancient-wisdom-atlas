  quote: ''
  summary: The passage describes Bast and Sekhet as closely connected female forms
    of solar heat and light. Sekhet is depicted in a cited anti-Apep text as violently
    destroying Apep with fire, while Bast is presented as a milder solar heat associated
    with vegetation. The passage also connects Bast with Mut, Isis, lunar symbolism,
    cat and lioness forms, pregnancy, birth, Khensu, and the festival at Bubastis
    involving boat travel, music, dancing, and offerings.
