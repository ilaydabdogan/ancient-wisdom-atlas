  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: As Temt at Dendera, Bast is connected with the god An, who is described as
    a form of Osiris.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage lists further local identifications of Bast with Mut, Uatchet,
