literal_observations:
- id: obs:1
  text: A version attributed to Manetho through Julius Africanus says that, in Boethus’s
    reign, a chasm opened at Bubastis and many people perished.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Bast’s worship was already very old in Egypt, especially
    in the Delta, and that Heliopolitan priests assigned her a definite theological
