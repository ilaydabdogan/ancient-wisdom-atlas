  summary: The passage discusses the antiquity and cult setting of Bast at Bubastis,
    cites Pyramid Text material in which Pepi ascends to heaven and Bast is addressed,
    notes references to Bast in funerary and confessional texts, describes Bast’s
    cat- and lioness-headed iconography with ritual objects, and lists identifications
    of Bast with other divine figures and cult-center forms.
  language: English
