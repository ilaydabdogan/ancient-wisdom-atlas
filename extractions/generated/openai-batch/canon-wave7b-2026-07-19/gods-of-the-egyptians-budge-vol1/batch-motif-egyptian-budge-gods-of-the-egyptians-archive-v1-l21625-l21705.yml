  text: In the cited Pepi text, Pepi is described as moving toward or up to heaven
    with bird and grasshopper comparisons, and Bast is addressed in connection with
    a doorway.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that Heliopolitan editors introduced local and foreign deities
    into their divine companies, while the Theban recension of the Book of the Dead
    rarely mentions Bast and her city.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the Negative Confession, an assessor named Thenemi is said to come forth
    from Bast, or from the city of Shetait.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bast is usually represented as a woman with a cat’s head, but sometimes with
    a lioness head surmounted by a snake.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Bast holds a sistrum in her right hand and an aegis with a cat or lioness
    head in her left hand.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that Bast’s earliest worshipped form was a cat and that
    her identification with a lioness was probably later.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Bast is identified with Rat, Temt, the eye of Ra, the eye of Tem, and Shetat,
    called the Hidden One.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: Bast is associated with Sept, lord of the East, and the passage says this
