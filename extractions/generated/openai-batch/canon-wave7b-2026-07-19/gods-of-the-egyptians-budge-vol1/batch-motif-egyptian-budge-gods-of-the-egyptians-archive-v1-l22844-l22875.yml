canonical_text:
  quote: ''
  summary: 'The passage describes several iconographic depictions of Horus of Behutet:
    armed with bow, arrows, and club; clubbing a fettered ass-headed man; standing
    on an oryx or antelope while holding a hawk-headed spear and cords attached to
    prisoners; appearing lion-headed and enthroned on a lion; appearing as a hawk
    with a lion-headed phallus as a god of generation and reproduction; and in a late-period
    hybrid form kneeling on crocodiles while holding a scorpion.'
