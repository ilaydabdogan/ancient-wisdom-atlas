canonical_text:
  quote: ''
  summary: The passage introduces a chapter on divine companies, explaining that Heliopolitan
    priests and Pyramid Text theologians organized companies of gods, usually as four
    god-goddess pairs plus a president or chief. It says such companies were not always
    limited to nine, but that the Heliopolitan system originally formed a nine-god
    company by adding the local god Tem to four pairs modeled on an older theological
    pattern. It also contrasts an older company of gods with the more prominent company
    of the gods of Annu and notes that the Heliopolitan company included Ra-Tem/Rê-Tem-Khepera
    and Osiris.
  language: English
