canonical_text:
  quote: ''
  summary: 'The passage first preserves a fragment concerning Unas, in which divine
    souls, spirits, shadows, and forms are said to be with or in him, his food surpasses
    that of the gods, and he rises while his heart-seat remains among the living.
    Budge then comments that Egyptian religious texts preserve mixed beliefs from
    many periods: gods were given the same constituent parts as humans and therefore
    imagined as embodied beings with material appetites and mortality. He cites the
    Book of the Dead and Early Empire texts in which the deceased is deified, receives
    gifts from Horus, sits near God, eats and drinks divine food, receives divine
    nourishment so as not to die, dwells with gods in the Field of Peace, eats from
    the tree or wood of life, enters divine kinship and marriage, and has the body
    reconstructed.'
  language: English
  quote_policy: summarized
