canonical_text:
  quote: ''
  summary: The passage describes Hathor as identified by Greeks with Aphrodite; as
    a goddess of love, joy, beauty, art, wine, and festivity; as the star Sothis associated
    with the Nile inundation and Ra; and as a major helper of the dead in Book of
    the Dead scenes involving judgment, Apep, deification of bodily members, food
    and drink beneath Hathor’s trees, and attendance among underworld or Heliopolitan
    gods.
  language: English
  quote_policy: summarized
