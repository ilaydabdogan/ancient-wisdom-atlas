canonical_text:
  quote: ''
  summary: The passage presents translated Egyptian creation material. In one section,
    a first-person creator describes becoming one god and then three gods, raising
    Shu and Tefnut in the inert watery mass, receiving the returning eye, producing
    men and women from tears, empowering the eye, and narrating the births of later
    gods. In Version B, titled as knowledge of the evolutions of Ra and overthrowing
    Apep, Neb-er-tcher speaks as a self-produced creator who arises in the forms of
    Khepera from primeval matter, uses a word of power/name, creates while alone in
    Nu, establishes a place or foundation, and generates Shu and Tefnut by spitting/emitting.
  language: English
  quote_policy: summarized
