  summary: The passage discusses the implied first combat between Ra and Apep and
    compares it with the Assyrian account of Marduk slaying Tiamat. It summarizes
    Marduk's weapons and defeat of Tiamat, notes an allusion in Bel and the Dragon,
    describes Apep iconography as a chained serpent pierced by knives, introduces
    Rat as Ra's female counterpart and mother of the gods, and identifies Heliopolis
    as a center of Ra worship with traditions about a solar pool or fountain.
  language: English
  quote_policy: summarized
