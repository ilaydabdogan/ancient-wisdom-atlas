  category: attribute
  evidence_refs:
  - ev:1
- id: obs:6
  text: The souls, spirits, shadows, and forms or attributes of the gods are described
    as being in or with Unas, and the flame of Unas is said to be in the bones of
    the gods.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: After the ordinances of the ploughing ceremony are performed, the seat of
    the heart of Unas is said to be among the living upon the earth forever.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Budge states that Unas is assigned a ba or soul, hau or doubles, khu or spirits,
    a sahu or spiritual body, and a sekhem or power.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:9
  text: Budge describes the soul as connected with the heart and gratified by offerings,
    the double as connected with the shadow and tomb, the spirit as the seat of the
    spiritual part, the spiritual body as an ethereal body growing from the dead body,
    and sekhem as the power animating the spiritual body.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Budge states that the gods were thought to be composed of the same kinds of
    parts as humans, while being attributed superhuman powers.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: Budge states that Egyptians sought magical protection and words of power because
    they thought mastery of these would allow them to live like the gods.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: Budge states that in earliest times in Egypt people thought the strength and
