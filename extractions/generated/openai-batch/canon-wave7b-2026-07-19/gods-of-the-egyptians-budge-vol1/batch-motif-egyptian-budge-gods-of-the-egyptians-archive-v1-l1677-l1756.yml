canonical_text:
  quote: ''
  summary: The passage presents Budge's discussion of a Pyramid Text extract in which
    King Unas rises to the sky, becomes associated with Sahu/Orion, consumes divine
    crowns, organs, knowledge, words of power, and spirits, and thereby becomes a
    supreme divine power. Budge then explains Egyptian ideas about soul, double, spirit,
    spiritual body, and power, and compares the constituent parts of gods with those
    of humans.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Unas becomes the eldest of the firstborn gods, goes before thousands, makes
    offerings to hundreds, and becomes as the star Sahu, identified in the passage
    as Orion, with the gods.
  category: sequence
  evidence_refs:
  - ev:1
