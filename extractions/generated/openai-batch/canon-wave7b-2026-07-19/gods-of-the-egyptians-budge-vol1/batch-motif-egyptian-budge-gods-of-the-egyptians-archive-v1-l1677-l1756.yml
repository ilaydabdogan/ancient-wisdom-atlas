- id: obs:3
  text: Unas takes count of knots or sinews and livers, takes possession of the hearts
    of the gods, eats the Red Crown and White Crown, and feeds upon fat entrails.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Offerings made to Unas are associated with hearts in which words of power
    live, and the words of power are said to be in his belly.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Unas has eaten the knowledge of every god, and his existence and duration
    of life are described as eternal and everlasting in any spiritual body he chooses
