canonical_text:
  quote: ''
  summary: 'The passage describes iconographic and theological forms of Ptah: Tanen
    inscribes decrees about Horus on an iron tablet; Ptah is commonly shown as a bald,
    bearded, shrouded man with signs of life and stability; associated signs include
    the mendt, madt pedestal, obelisk, and tet; Ptah-Nu is mentioned with Ptah as
    celestial workman and architect connected to earth and water; Ptah-Sekee or Ptah-Seker
    is described as a union of creative power and darkness, as a form of Osiris or
    the night/dead Sun-god, and Seker is linked with night-sun forms like Tem.'
  language: English
  quote_policy: summarized
