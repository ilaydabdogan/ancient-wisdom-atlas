canonical_text:
  quote: ''
  summary: A hymn section repeatedly praises Ra as exalted Sekhem and presents him
    through multiple names, forms, and bodies. The passage says that Ra leads souls,
    goes through the Tuat, unites with Beautiful Ament, appears as the Great Cat who
    avenges and judges, fills his eye, sends light, destroys enemies with fire, has
    mastery over divine souls, creates the two Setchet gods, orders his steps by Maat,
    holds a balance among the gods, restrains enemies, cuts off heads of those to
    be destroyed, and establishes the two lands. Several clauses are damaged or incomplete
    in the supplied text.
  language: English
  quote_policy: summarized
