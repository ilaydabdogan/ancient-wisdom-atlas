  quote: ''
  summary: The passage discusses the Watchers of Pe and Nekhen, protective gods or
    city-souls associated with cities; a temple relief of Cleopatra VII giving birth
    to Caesarion in the presence of deities and city-souls; and Egyptian ideas about
    righteous dead persons as living ones who could have divine attributes and existence
    in heaven and on earth.
  language: English
