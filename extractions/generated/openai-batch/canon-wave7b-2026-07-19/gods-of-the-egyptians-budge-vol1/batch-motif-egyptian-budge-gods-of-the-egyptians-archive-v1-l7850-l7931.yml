literal_observations:
- id: obs:1
  text: The author says it is possible that Set beings were of a nature like Set;
    Set is described as brother and associate of Horus in earliest times and later
    as a type and symbol of evil.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The text of Pepi II is said to mention the Watchers of the city of Pe, and
    the section title names the Watchers of Pe and Nekhen.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author states that certain cities were supposed to be protected by gods
    whose duty was to look after their interests in heaven.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Groups of gods are said to have been called the souls of cities, and each
    city and town is said to have possessed a soul with the ability to wander at will.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: In a relief from Cleopatra VII's temple at Erment, Cleopatra is depicted giving
    birth to Caesarion while Neith holds up her arms and the midwife Netchemtchemt
    receives the boy in the presence of gods and goddesses.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: In the upper part of the Erment birth relief, two groups of souls of cities,
    seven on the right and seven on the left, are said to have been present at the
    child's birth and to have taken him under their protection.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Each city-soul in the Erment relief is described as a human-headed hawk with
    horns and a disk on its head and a uraeus in front of the disk.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The spirits and souls of righteous men and women who once lived on earth are
    said to have been given the name living ones.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: A passage addressed to Unas says that he has not departed dead, tells him
    to sit on the throne of Osiris, and refers to his sceptre giving orders to hidden
    habitations.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The author infers from a passage about king Teta in heaven that Egyptians
    conceived it possible for a man to attain divine or angelic attributes while enjoying
    existence on earth and in heaven.
  category: other
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage states that heaven and earth were conceived as complements, with
    heavenly gods and earthly gods complementing each other and human spiritual attributes
    in heaven complementing continued postmortem life on earth.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says that in the early predynastic period life after death was
    thought of as a continuation of life in this world and that food was placed in
    or on graves of the dead.
  category: action
  evidence_refs:
  - ev:7
