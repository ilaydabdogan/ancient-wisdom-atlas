canonical_text:
  quote: ''
  summary: The passage describes royal patronage and ritual activity at Heliopolis,
    especially Piankhi's purification, offerings, entry into the temple and shrine
    of Ra, veneration of the Matet and Sektet solar boats, sealing of the shrine,
    and priestly acclamation. It also explains the sacred boats, their tabernacle,
    and a symbolic high ground connected with Ra's emergence from the watery abyss
    of Nu, before recounting the later decline of Heliopolis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rameses III restored temple buildings and assigned revenues for the worship
    of Ra and for the status of Ra's priests and servants.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Piankhi visited Heliopolis after the capture of Memphis during his invasion
    of Egypt.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Piankhi performed ablutions in the Lake of cold water and washed his face
