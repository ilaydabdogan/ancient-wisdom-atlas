  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At sunrise Piankhi made offerings to Ra, including white oxen, milk, unguent,
    incense, and sweet-smelling woods.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Piankhi entered the temple of Ra while bowing low in adoration.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
