  text: The priests prostrated themselves before Piankhi and pronounced that Horus
    who loves Annu should be firm, stable, and without end.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage states that the sacred boats of Ra were kept in a wooden tabernacle
