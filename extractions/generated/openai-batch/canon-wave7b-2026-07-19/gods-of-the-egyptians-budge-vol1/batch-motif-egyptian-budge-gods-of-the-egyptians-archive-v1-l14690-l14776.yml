    offered in the Het-Benbenet.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Piankhi stood alone, pushed back the bolt, opened the doors of the tabernacle,
    and saw his father Ra in the Het-Benbenet.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Piankhi made adoration to the Matet Boat of Ra, described as the boat of the
    rising sun, and to the Sektet boat of Tem, described as the boat of the setting
    sun.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Piankhi closed the doors again, sealed them with clay using the king's seal,
    and told the priests that no other king should enter or stand there.
  category: action
  evidence_refs:
  - ev:6
