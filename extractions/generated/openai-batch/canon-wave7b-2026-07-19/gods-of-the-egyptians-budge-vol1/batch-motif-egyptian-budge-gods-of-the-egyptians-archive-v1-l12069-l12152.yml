canonical_text:
  quote: ''
  summary: The passage discusses Kerh and Kerhet and the wider Egyptian group of four
    primeval male-female pairs, emphasizing uncertainty about their exact functions,
    their antiquity, and the unusual equality of their female counterparts. It describes
    animal-headed representations of Kerh and Kerhet, associates them with inactive
    powers of the primeval watery abyss, and then compares the Egyptian eight gods
    in four pairs with the Assyrian primeval gods in the Seven Tablets of Creation,
    especially Apzu-rishtu and Tiamat as male and female powers of the watery mass
    before gods were named and destinies ordained.
  language: English
  quote_policy: summarized
