canonical_text:
  quote: ''
  summary: 'Modern scholarly description of an Egyptian abode of the blessed: beatified
    dead inhabit a fertile, irrigated celestial estate with abundant crops, enduring
    bread and beer, white garments and sandals, divine care of crops, and hymns to
    the Great God. The passage contrasts this with Hebrew and Muhammadan descriptions
    of heaven and includes a brief cited episode in which Isis comes to king Teta,
    conceives, and gives birth to Horus Sept.'
