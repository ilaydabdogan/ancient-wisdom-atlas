canonical_text:
  quote: ''
  summary: Budge argues that mixed or coarse elements in Egyptian religious literature
    do not exclude monotheistic ideas. He compares this with Hebrew and Arabic religious
    literatures, then cites royal funerary texts about Unas, Teta, Pepi I, Nut, and
    God to argue that by about B.C. 3300 a singular God was distinguished from the
    plural gods and their companies.
  language: English
