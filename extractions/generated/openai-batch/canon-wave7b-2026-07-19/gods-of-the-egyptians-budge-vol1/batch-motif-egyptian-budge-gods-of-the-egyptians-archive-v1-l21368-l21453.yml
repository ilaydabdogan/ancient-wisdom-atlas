canonical_text:
  quote: ''
  summary: The passage describes Nekhebet’s sanctuary and local cult, her later identification
    with Hathor, her iconography as a vulture or serpent goddess of Upper Egypt, her
    pairing with Uatchet, her protective role on Ra’s brow and on temple winged disks,
    her astronomical identification as the sun’s western/right eye, her creative and
    maternal aspects, and her role with Uatchet in royal coronation symbolism.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage locates Nekhebet’s shrine at Nekhent, represented by modern El-Kab,
    and says that the town called White Nekhen contained the sanctuary of the vulture
    goddess Nekhebet.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that later texts identify the vulture goddess Nekhebet of
    the South with Hathor.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nekhebet is usually represented as a woman wearing a vulture head-dress surmounted
    by the white crown, the sign of sovereignty over Upper Egypt, with two plumes
    attached.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Nekhebet sometimes holds a sceptre in one hand and the symbol of life in the
    other.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: A form of Nekhebet’s sceptre is described as a long-stemmed flower, apparently
    a water-lily, with a serpent twined around it.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The serpent twined around the sceptre is identified as a winged serpent wearing
    the crown of the South and as symbolic of Nekhebet, like the vulture.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Nekhebet is also represented as a woman with a vulture head, and one reproduced
    picture shows her standing upon maat and holding a bow and arrow in her left hand.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: In uraeus form, Nekhebet takes her place with her twin sister Uatchet on the
    brow of Ra, and both goddesses destroy Ra’s enemies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage connects this protective idea with winged disks over Egyptian
    temple doors, where a serpent on the right or south side is Nekhebet and a serpent
    on the left or north side is Uatchet.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Astronomically, Nekhebet is described as the western or right eye of the sun
    during his journey in the Underworld, while Uatchet is the eastern or left eye.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: As a nature power, Nekhebet is described as a form of the primeval abyss that
    brought forth light.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage quotes epithets for Nekhebet as father of fathers, mother of mothers,
    existing from the beginning, and creatrix of the world.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Egyptian temple bas-reliefs usually represent Nekhebet with Uatchet, including
    coronation scenes in which the king is crowned with the double crown by these
    deities.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The passage reports that special temple rooms or chambers were said to be
    set apart near sanctuaries for Uatchet and Nekhebet, with Uatchet’s chamber on
    the west or right side and Nekhebet’s on the east or left side.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:15
  text: The passage states it is very probable that priestesses dressed as the two
    goddesses at royal coronation, with one declaring that the South had been given
    to the king and the other declaring the same for the North.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Coloured pictures of Nekhebet Fakit paint her light yellow or almost white,
    probably to represent the desert regions of the South and the white light of the
    newly risen sun or moon.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:17
  text: From one aspect, Nekhebet is identified with Isis, while Uatchet is identified
    with Nephthys.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:18
  text: The passage says Nekhebet was the mother of the Sun-god and therefore also
    of the king of Egypt, while Uatchet was his nurse.
  category: relationship
  evidence_refs:
  - ev:13
