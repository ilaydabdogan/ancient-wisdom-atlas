canonical_text:
  quote: ''
  summary: Budge describes Egyptian dynastic gods as selected from older local and
    natural-domain deities rooted in predynastic spirit-beliefs. He argues that Egyptian
    religion retained old gods and ritual forms while priesthoods absorbed ancient
    deities into newer systems and, in his view, moved from polytheism toward monotheism.
    The passage ends with the Heliopolitan statement that Tem produced Shu and Tefnut
    from himself by masturbation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says that variations in Egyptian triads were caused chiefly by
    assimilating local gods and goddesses with the well-known companies of the gods
    of Heliopolis.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The great gods of the dynastic period are described as having been selected
    from local gods, who in turn represented gods of desert, mountain, earth, water,
    air, and sky worshipped in predynastic times.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Osiris is described as the local god of both Busiris and Mendes, and Isis
    is described as a form of the older goddess Uatchit.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The later predynastic gods are described as developing out of a multitude
    of good and bad spirits believed in by the earliest Egyptians.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage states that Egyptians rarely abandoned a god whose earliest priests
    had established a recognized position for him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The form of worship is described as changing materially through larger and
    more magnificent temples, while gods, processions, and ceremonies preserved early
    essentials.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Budge says that careful examination of religious texts shows Egyptians trying
    to reduce the number of their gods, or advancing from polytheism to monotheism.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The uneducated people are described as clinging to festivals and imposing
    ceremonies because they considered them essential to general well-being.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Priests and educated classes are described as retaining popular forms of worship
