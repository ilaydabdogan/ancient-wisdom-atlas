canonical_text:
  quote: ''
  summary: 'The passage discusses King Unas as a deified dead king: he is likened
    to a vigorous bull, associated with divine food from gods and the Fiery Lake,
    connected with She-Sasa in the Book of the Dead, seated in heaven before Seb,
    compared with judgment imagery involving weighing, and described as eating men
    and feeding on gods. Budge also comments on Egyptian animal and plant-related
    worship, the cosmic egg, and possible predynastic cannibalism traditions.'
  language: English
  quote_policy: summarized
