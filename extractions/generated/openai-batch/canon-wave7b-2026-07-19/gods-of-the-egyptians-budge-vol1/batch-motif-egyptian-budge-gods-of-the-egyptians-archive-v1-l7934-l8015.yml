canonical_text:
  quote: ''
  summary: 'The passage explains Egyptian ideas about postmortem components: a dream-seen
    duplicate named ha, its survival with the body and maintenance by tomb offerings,
    the heavenly existence of hau, shadows, souls, spirits, and spiritual bodies,
    the ritual formation of the spiritual body, and the heavenly denizens who praise
    Ra and are nourished by the Eye of Horus or solar light.'
  language: English
  quote_policy: summarized
