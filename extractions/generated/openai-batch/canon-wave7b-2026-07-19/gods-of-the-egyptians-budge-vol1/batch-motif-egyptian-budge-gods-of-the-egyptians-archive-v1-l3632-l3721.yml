canonical_text:
  quote: ''
  summary: Budge discusses evidence for Egyptian gods of the earliest dynasties, noting
    limited surviving connected texts for the first four dynasties, the later evidence
    of the Pyramid Texts, the funerary and afterlife context of many divine roles,
    the positions of Ra and Osiris, Heliopolitan editing of funeral books, and a list
    of principal archaic gods with several animal or cosmic identifications.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Egyptian priesthood and people of a city could show hospitality
    to a god introduced from another locality if that god belonged to the same company
    as the chief local god.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The author states that no long connected religious texts survive in the forms
    in which they would have existed under the first four dynasties, so the gods worshipped
    in that period cannot be stated definitively from such texts.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage presents a conditional inference that parts of the Book of the
    Dead may have been revised or edited early in the 1st Dynasty and that later religious
    texts may resemble the late archaic religious system.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: For the Vth and VIth Dynasties, the passage identifies hieroglyphic texts
    inside pyramid tombs as abundant, though incomplete, material for studying Egyptian
    gods and attributes.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Pyramid Texts are described as revealing an established theological system
    with many layers of religious thought and belief from periods separated by long
    intervals.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The texts are described as sepulchral, and many gods in them are said to be
