canonical_text:
  quote: ''
  summary: The passage gives a destructive spell and rubric against Apepi/Apep, prescribing
    the making, naming, binding, trampling, spitting on, piercing, and burning of
    hostile figures. It also describes additional wax and serpent-shaped figures for
    fiends associated with Apepi and situates these practices within Egyptian anti-serpent
    charms and funerary texts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A curse describes removal of the target's strength, dismemberment, blocking
    of mouth and eyes, removal of speech and heart, and the nonexistence of the target's
    name, kin, offspring, soul, body, spirit, shade, words of power, bones, and skin.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rubric instructs that the chapter be said over a figure of Apepi inscribed
    on new papyrus with green ink and placed inside a covering bearing his name, tied
    tightly with cord.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The figure and covering are to be put into fire every day, stamped on and
    defiled with the left foot, and spat on four times during each day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: A spoken formula declares that Ra triumphs over Apepi, Horus triumphs over
    his enemies, and P-aa, identified parenthetically as the deceased, triumphs over
    his enemies.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The names of male and female devils feared by the heart, the enemies of P-aa
    in death and life, and the names of their parents and children are to be written
    down and placed with a wax figure of Apepi for burning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The burning is prescribed at morning, noon, and evening, associated with Ra
    rising and setting, and is said to benefit the practitioner on earth and in the
    Underworld.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Figures of fiends associated with Apepi are to be made in wax, inscribed with
    their names, tied with black hair, thrown to the ground, kicked with the left
    foot, and pierced with a stone spear.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'Additional serpent figures are described: one with its tail in its mouth
    and a knife in its back, and others with faces of a cat, crocodile, duck, and
    white cat, each with a knife in its back and specific names.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the papyrus was written about B.C. 312-311, while
    the compositions in it were much older, and that older Egyptian beliefs persisted
    despite Macedonian rule and Greek influence.
  category: other
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that Egyptians feared and propitiated snakes, used charms
    and incantations to keep reptiles from the dead, and that Book of the Dead recensions
    contained chapters to preserve the dead from snake attacks.
  category: other
  evidence_refs:
  - ev:7
