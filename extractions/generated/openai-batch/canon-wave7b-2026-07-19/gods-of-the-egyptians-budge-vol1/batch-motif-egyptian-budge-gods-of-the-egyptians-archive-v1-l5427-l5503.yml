canonical_text:
  quote: ''
  summary: The passage describes Hermopolis/Khemennu as the city and sanctuary of
    the Eight Gods, discusses variant lists of the Hermopolitan company, and then
    explains Egyptian triads as groups of an older god, his goddess wife or counterpart,
    and a younger son who inherits or shares his father's powers. It contrasts the
    triad with the later ennead, made of four divine pairs and one supreme god.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Khemennu, identified with Hermopolis, is described as famous for the sanctuary
    of a company of Eight Gods, and its name is explained as meaning “the city of
    the Eight Gods.”
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hermopolitan company is said to be led by Tehuti, or Thoth.
  category: relationship
  evidence_refs:
