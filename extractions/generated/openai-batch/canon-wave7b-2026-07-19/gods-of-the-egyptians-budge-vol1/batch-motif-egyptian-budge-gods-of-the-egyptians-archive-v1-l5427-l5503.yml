- id: obs:3
  text: The passage names Nu, Kekdi, and Kekuit among the Hermopolitan gods in the
    visible text.
  category: object
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: The names of the Hermopolitan company are said to come from temple-wall texts
    at Hebet in the Oasis of Kharga, in a temple built by Darius II.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Variant lists are reported in which Amen and Ament replace Nu and Nut, or
    replace Kereh and Kerehet; other substitutions involving Nenu and Nenut are also
    mentioned.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A local divine triad is described as consisting of a local deity and two associated
