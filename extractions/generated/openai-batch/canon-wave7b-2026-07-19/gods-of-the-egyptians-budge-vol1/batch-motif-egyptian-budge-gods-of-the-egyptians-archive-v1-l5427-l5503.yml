  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The younger god in a triad is described as the son of the older god and goddess
    and as possessing the attributes and powers of his father.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The head of a triad is said to be sometimes Ra and sometimes a local god to
    whom the power of the Sun-god was ascribed.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: The son in the triad is described as nearly as important as the father because
