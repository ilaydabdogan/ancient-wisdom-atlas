canonical_text:
  quote: ''
  summary: 'The passage summarizes traditions about Horus, son of Isis: his conflict
    with Set, Isis releasing Set, Horus receiving Osiris’s throne and world-sovereignty,
    his filial care for Osiris’s body and rites, his role introducing the justified
    dead before Osiris after the weighing of the heart, and his help in the deceased’s
    ascent by ladder. Budge also compares the Horus-Set combat to other Egyptian divine
    combats and to later dragon-overthrow legends.'
  language: English
  quote_policy: summarized
