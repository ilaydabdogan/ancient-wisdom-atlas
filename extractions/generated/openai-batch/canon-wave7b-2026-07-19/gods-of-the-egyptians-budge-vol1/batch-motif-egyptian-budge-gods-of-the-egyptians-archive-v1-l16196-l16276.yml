canonical_text:
  quote: "“she became drunk, and she took no further heed of mankind.”"
  summary: Ra is urged by the gods to send his Eye in the form of Hathor against humans
    who utter blasphemous words. Hathor slays people, and Sekhet continues the bloodshed.
    Ra then has mandrakes, beer, and blood prepared in thousands of vessels and poured
    out so that the goddess drinks, becomes drunk, and ceases to attack mankind. Ra
    institutes future sleep-making drink offerings at the New Year festival of Hathor,
    then complains of sickness, weariness with humans, and loss of bodily power.
  language: English
  quote_policy: quoted
