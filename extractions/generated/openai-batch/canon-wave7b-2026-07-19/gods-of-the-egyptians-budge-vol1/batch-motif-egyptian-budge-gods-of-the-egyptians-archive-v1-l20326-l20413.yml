canonical_text:
  quote: ''
  summary: 'The passage surveys attributes of Thoth: a Book of the Dead chapter in
    which the deceased is near Thoth and refers to knives in the powers of rain and
    thunder; Greek accounts identifying Thoth with Hermes and crediting him with wisdom,
    sciences, writing, theology, government, worship, and sacred books; Egyptian descriptions
    of Thoth as the mind and reason of Ra; and Maat as Thoth''s feminine counterpart,
    present with him in Ra''s boat at the Sun-god''s first rising above the waters
    of Nu and marked by ostrich-feather iconography.'
