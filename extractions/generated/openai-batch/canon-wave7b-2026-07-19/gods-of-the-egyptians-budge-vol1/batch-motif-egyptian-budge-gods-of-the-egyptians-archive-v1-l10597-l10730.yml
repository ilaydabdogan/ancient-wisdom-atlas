canonical_text:
  quote: ''
  summary: The passage describes the end of the Tenth Hour and portions of the Eleventh
    Hour of Ra's journey through the Tuat. It mentions Set as guardian of the Tenth
    Hour, goddesses with serpents who light Ra's path, Ra's boat in the Eleventh Hour
    guided by a solar disk encircled by a serpent, processions and composite beings
    including Mehen, uraei, forms of Neith, winged serpents, Shetu, Temu, Khnemu with
    attendant gods, and goddesses seated on uraei. The passage also states that parts
    of the Tuat swallow forms and give them for births on earth, and that certain
    beings live by Ra's hidden light, breath, and boat provisions.
  language: English
  quote_policy: summarized
