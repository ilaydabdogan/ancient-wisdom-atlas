canonical_text:
  quote: ''
  summary: 'The passage describes Ra''s Twelfth Hour journey through the Tuat: his
    boat is towed through a named serpent from darkness into daylight, the dead and
    old Sun-god emerges alive and young as Khepera, accompanying gods and goddesses
    praise and protect him, enemies are destroyed, Osiris is praised as governor of
    the Tuat, and the boundary between the Tuat and the world is marked by thick darkness,
    a mummied form, Shu''s image, and the beetle of Khepera.'
  language: English
  quote_policy: summarized
