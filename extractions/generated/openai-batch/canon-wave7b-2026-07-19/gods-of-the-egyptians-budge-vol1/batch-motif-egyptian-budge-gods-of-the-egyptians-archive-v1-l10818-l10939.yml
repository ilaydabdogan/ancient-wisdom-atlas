candidate_motifs:
- id: motif:1
  label: Mapped underworld solar journey
  taxonomy_refs:
  - afterlife_journey_map
  basis: The passage gives a structured Twelfth Hour route through the Tuat, with
    a named Circle, darkness boundary, solar boat, serpent passage, sky paths, horizon
    hall, and final boundary between Tuat and this world.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  - ev:9
  - ev:10
  confidence: high
  cautions: This is extracted from Budge's descriptive synthesis of the underworld
    books, not a direct translation of one continuous ancient narrative in the excerpt.
- id: motif:2
  label: Solar death, rebirth, and rejuvenation
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: Ra enters the serpent as a dead, old Sun-god and emerges alive and young
    as Khepera; blessed boat-companions also receive renewed youth and new birth.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage emphasizes daily solar renewal; the exact status and earthly
    return of the blessed souls is explicitly treated as uncertain by the author.
- id: motif:3
  label: Serpent as passage, protection, and enemy-destroying power
  taxonomy_refs:
  - serpent
  basis: One serpent serves as the passage through which the solar boat is reborn;
    goddesses bear serpents and emit protective flames; another serpent, Nesmekhef,
    slaughters Ra's enemies.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents several distinct serpent figures and functions; they
    should not be collapsed into a single being.
- id: motif:4
  label: Flame as punishment and apotropaic force
  taxonomy_refs: []
  basis: The passage describes blazing fiery pits for souls and shadows and flames
    from goddesses' mouths that drive away Apep.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: medium
  cautions: No available motif-family taxonomy item directly matches this limited
    fire pattern; it is recorded as an untaxonomized candidate motif.
- id: motif:5
  label: Divine son arranging the father's funerary rites
  taxonomy_refs:
  - divine_parent_child
  basis: The passage explicitly says Horus carried out arrangements for ceremonies
    and mummification details connected with the death and burial of Osiris, through
    the loving care of Osiris's son.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This appears in explanatory commentary on an allusion rather than in the
    main Twelfth Hour procession itself.
