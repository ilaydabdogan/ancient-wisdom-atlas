  summary: The passage contrasts hymnic praise of the Sun-god with prayers to Osiris,
    describes Egyptian magic as an ancient and persistent means of dealing with spirits,
    and compares ancient beliefs with modern Egyptian, Sudani, and Eastern Sudan practices
    involving amulets, the Evil Eye, Jinn, desert spirits, and feared spirit-inhabited
    places.
