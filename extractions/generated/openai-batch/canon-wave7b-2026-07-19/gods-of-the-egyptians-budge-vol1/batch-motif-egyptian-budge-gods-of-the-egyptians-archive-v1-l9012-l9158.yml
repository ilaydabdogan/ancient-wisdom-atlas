canonical_text:
  quote: ''
  summary: The passage describes several divisions or hours of the Tuat, emphasizing
    the Sixth Division as Osiris's northern domain and then listing the guardians,
    processions, boats, serpents, offerings, punishments, lake, and ritual groupings
    associated with the Seventh, Eighth, and beginning of the Ninth Divisions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sixth Division is placed near the northerly part of the Tuat and is associated
    with the Delta shrines of Osiris, including Mendes and Busiris.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sixth Division contains no representation or named mention of Ra, and
    the passage says the Book of Pylons made Osiris supreme in his own dominions.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Osiris is described as positioned on the top of a flight of steps, connected
    in the passage with the expression 'god who is on his staircase.'
  category: setting
  evidence_refs:
  - ev:10
- id: obs:4
  text: The serpent guarding the pylon of the Seventh Division or Seventh Hour is
    named Akhan-maati, while the mutilated state of the scene prevents recovery of
    some other names.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: In the Seventh Division scene, beings bear a rope resembling a serpent, Men-sheta
    bends over a staff, mummied forms lie on couches, and the Sun-god's boat is towed
    while gods and mummied figures call for praise of Ra.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Eighth Division pylon is called Bekhkhi, its snake-god guardian is Hept-ta,
    and its wall is protected by nine gods in mummied forms.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: On the right side of Ra's boat in the Eighth Division, twelve human-form sovereign
    chiefs provide bread, Maat, and green herbs to bearded human-headed hawk souls
    of Ta-neserser.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: On the left side of Ra's boat in the Eighth Division, Horus stands by twelve
    bound enemies of Osiris, while the serpent Kheti emits fire toward them and seven
    gods stand on Kheti's back.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says Ra decreed death for the bodies and souls of the enemies
    of Osiris because of acts against Osiris, including despising his mysteries and
    removing his image from the sanctuary.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: In the center of the Eighth Division the sun boat is towed, the Dweller in
    Nu leans on a staff, and a rectangular lake contains beings who swim or dive.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: The gods towing the boat speak praise of Ra's soul and body, saying heaven
    and earth are made new and that heaven is opened and the ways of Akert are made
    straight for him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Ninth Division pylon is called Aat-shefsheft; the passage also describes
    a serpent guardian, a wall guarded by nine mummied gods, rope-holding gods, raised
    pillars with crowned heads, composite figures, and a serpent called Tepi in a
    fragmentary closing section.
  category: sequence
  evidence_refs:
  - ev:8
  - ev:9
