canonical_text:
  quote: ''
  summary: The passage opens with a fragment about a king's soul and divine serpent
    forms, then begins the Legend of Ra and Isis. Ra is described as a self-produced
    creator and king with many names unknown even to the gods. Isis, skilled in words,
    seeks to become like Ra by knowing his holy name. She uses Ra's fallen spittle
    mixed with earth to fashion a sacred dart-like serpent and leaves it on his path.
    The serpent bites Ra during his daily procession, causing poison, trembling, and
    fiery symptoms. Ra summons the gods and says the attack is unknown to him; he
    also explains that his name was hidden in his body to prevent enchantment.
  language: English
  quote_policy: summarized
