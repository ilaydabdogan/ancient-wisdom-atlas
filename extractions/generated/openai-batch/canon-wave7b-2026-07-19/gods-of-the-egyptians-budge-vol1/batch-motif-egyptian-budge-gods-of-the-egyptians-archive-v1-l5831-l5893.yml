  summary: 'The passage cites admonitions and reflections about God: God''s actions
    or ways cannot be known; eating bread or receiving food occurs according to God''s
    plan or providence; the addressee must not put terror into men and women because
    God opposes it; and a person with ploughable land should work the field God has
    given. A note attributes one observation to Kaqemna and the others to Ptah-hetep.'
