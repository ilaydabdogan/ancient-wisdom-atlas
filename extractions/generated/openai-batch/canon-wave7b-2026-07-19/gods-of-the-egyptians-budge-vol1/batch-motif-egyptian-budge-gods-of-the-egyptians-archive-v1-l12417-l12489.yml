  summary: The passage summarizes and quotes a creation narrative in which Khepera
    continues creating from what he had already made, brings things forth from his
    mouth, raises heaven, earth, plants, and creeping things out of Nu, and acts alone
    before emitting Shu or spitting out Tefnut. It also explains Budge's interpretation
    of Maa as order, rectitude, or law, and compares Maa's function in Khepera's creation
    to Hokhmah/Wisdom in Proverbs.
