canonical_text:
  quote: ''
  summary: The passage describes Egyptian nome-gods, their capital temples, priestly
    and scribal personnel, funerary services in Upper Egypt, special priestly titles,
    local cult autonomy, the recurrence of the same deities across several nomes,
    and several ancient animal-form or animal-associated deity cults, including the
    uncertain animal symbol of Set.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Each Egyptian nome is described as possessing a representative god whose temple
    stood in the nome capital.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A body of priests was attached to each nome-god and handled divine service,
    temple maintenance, copying religious works, and religious education.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: In Upper Egypt, lower priestly orders are said probably to have worked in
    mummification, funeral papyri and amulets, and conducting funerals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: High-priests and high-priestesses in great cities bore special local titles.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Temple scribes kept accounts and, in larger temples, registers of gifts and
    property belonging to the god.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The priests of each nome-god are described as subject to no external authority,
    with a great nome high-priest having power close to that of the nomarch.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The worship of each nome-god contained peculiar local elements and preserved
    ancient indigenous beliefs of the nome inhabitants.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Several nomes could worship the same deity, including Horus, Khnemu, Amsu,
    Anpu, and Hathor, with one nome worshipping Horus as Horus of Behutet.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage lists several extremely ancient cults of animal-form or animal-associated
    deities, including Khnemu, Nekhebet, Sebek, Anpu, Thoth, Horus the elder, and
    Uatchet.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The animal type and symbol of Set is said to be unidentified, not the ass
