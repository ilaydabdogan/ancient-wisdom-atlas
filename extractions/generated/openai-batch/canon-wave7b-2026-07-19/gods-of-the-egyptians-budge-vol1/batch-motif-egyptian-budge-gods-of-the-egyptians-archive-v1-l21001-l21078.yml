    horns, and a lioness with a uraeus carrying a sceptre and the sign of life.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: As lady of the southern sycamore Hathor has the head of a cow, and as lady
    of the Holy Land, the Underworld, and Amentet she appears as a cow walking out
