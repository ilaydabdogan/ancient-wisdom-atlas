canonical_text:
  quote: ''
  summary: The passage describes Hathor as a cosmic goddess associated with Ra, as
    mother of light in Heliopolitan theology, and as producer of aspects of Shu and
    Tefnut, while noting an older tradition in which Temu produced them. It surveys
    Hathor’s iconographic forms, including solar, leonine, cow, underworld, chronographic,
    and sphinx forms, and briefly cites a Pepi I text in which gods conduct Ra-meri
    in heaven to Het-Heru, located within the watery heavenly mass called Qebh.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cited Pepi I text says that every god takes Ra-meri by the hand in heaven
    and conducts him to Het-Heru so that his voice or word may take effect upon Seb.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage identifies Het-Heru, the House of Horus, as a special part of
    a great watery mass of heaven called Qebh.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hathor is described as a cosmic goddess associated with the Sun-god Ra and
    as Ra’s principal female counterpart.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the Heliopolitan theological system, Hathor is called the mother of the
    light; the birth of light is described as the first act of creation, and her next
