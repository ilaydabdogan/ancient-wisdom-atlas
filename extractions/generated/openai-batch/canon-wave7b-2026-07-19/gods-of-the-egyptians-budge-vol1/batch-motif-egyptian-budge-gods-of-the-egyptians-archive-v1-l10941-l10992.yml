  summary: The passage describes Shu making an opening in a wall of thick darkness
    through which the boat of Ra passes into this world. Ra, as Af, the dead body
    of Ra, enters the world, begins new life, and the night gives way to a new day.
    The author then contrasts Osirian and Ra-centered accounts of the Tuat and argues
    that the evidence does not support readings of Egyptian belief as purgatory, eternal
    fiery hell, or reincarnation.
