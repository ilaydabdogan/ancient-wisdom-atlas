canonical_text:
  quote: ''
  summary: The passage describes the Sixth Division or Sixth Hour of the Tuat. Ra
    addresses the gods towing his boat and rewards those who spoke truth on earth.
    The Sixth Pylon has named guardians and mummied divine guards. Behind its wall
    is a chamber where Osiris sits on nine steps with divine attendants; before him
    are scales, a boat with an ape and pig, Anubis, and four oryx heads. The accompanying
    texts describe Osiris repelling enemies, the weighing of true and false words
    by Thoth, punishment of the pig, protection of spirits, and the Tuat as a curved
    valley related to the sun’s west-to-east course.
  language: English
  quote_policy: summarized
