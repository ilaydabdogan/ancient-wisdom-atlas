canonical_text:
  quote: ''
  summary: Budge discusses an Egyptian creation passage in which a god initiates creation
    from within his own heart, then compares a Pyramid Text passage about Tem producing
    Shu and Tefnut with a creation account in which Khepera produces the same two
    gods from himself. The passage also summarizes a sequence in which Pepi is ritually
    washed, assembled, raised to heaven, and placed among gods, and a further account
    in which the Eye of Nu, identified with the Sun, is hidden in the watery deep
    until Shu and Tefnut emerge and bring it forth.
  language: English
  quote_policy: summarized
