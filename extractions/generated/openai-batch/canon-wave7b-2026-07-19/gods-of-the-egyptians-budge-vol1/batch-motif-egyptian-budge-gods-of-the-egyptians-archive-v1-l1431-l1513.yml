canonical_text:
  quote: ''
  summary: Budge describes the Heliopolitan Recension as containing pyramid-chapel
    offerings, prayers, magical formulae, and passages about the beatified king’s
    power in the world beyond the grave. The passage summarized from the pyramid of
    Unas presents Unas rising in heaven as a god, terrifying cosmic beings, living
    upon fathers and mothers, surpassing his father Tem, possessing multiple doubles,
    standing over conquered enemies, and being protected by gods, uraei, a serpent-guide,
    and powers. The continuation calls Unas the Bull of heaven, describes his feeding
    on divine provisions, rising as a mighty god, weighing speech with a hidden-name
    god, mastering offerings, tying a knot, and eating men.
  language: English
  quote_policy: summarized
