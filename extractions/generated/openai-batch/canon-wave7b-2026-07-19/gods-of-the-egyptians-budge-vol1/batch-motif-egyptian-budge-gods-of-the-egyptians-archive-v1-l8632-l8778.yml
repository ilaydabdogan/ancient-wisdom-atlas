canonical_text:
  quote: '"the Tuat is a long, narrow valley, with sandy slopes"'
  summary: 'The passage summarizes the Book of Pylons'' geography of the Tuat as a
    nocturnal underworld divided into twelve divisions corresponding to the twelve
    hours of night. It describes the first through fourth divisions: the sun boat
    enters the Tuat, passes pylons and guarded corridors, encounters gods, serpents,
    lakes, bound offenders, fire, and ritual opposition to Apep/Apepi, and reaches
    scenes including uraei, the Lake of Life, and Osiris standing on a serpent.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Tuat is described as a long, narrow valley with sandy slopes, divided
    by a river on which the boat of the sun sails, and containing twelve divisions
    corresponding to the twelve hours of night.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the First Division, the lowest part is a path forming the entrance from
    this world to the Tuat.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The central sun boat contains a disk with a beetle, and the disk is encircled
    by a huge serpent holding its tail in its mouth; Sa stands in the bows and Heka
    stands in the stern.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The boat approaches a pylon with closed doors guarded by a huge serpent.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: In the Second Division, twenty-four humans are said to have directed words
    of power against Apep; the sun boat contains a ram-headed god in a shrine, protected
    by Mehen, and is towed by four beings of the Tuat.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: On the left of the divine boat are Tem, four dead men lying on their backs,
    and twenty bound men described as criminals connected with insults against Ra,
    curses, frustrated justice, and blasphemies against Khuti.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The pylon before the Third Division is described as a fortified entrance with
    a corridor crowned by spear heads; uraei in its angles drop balls of fire along
    the corridor.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Third Division includes twelve holy gods in open shrines, twelve gods
    of lakes of fire, a huge snake along the shrine tops, and an ear of corn before
    each god of the basins of fire.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Third Division also places Tem, the serpent Apepi, and nine chiefs who
    drive back Apepi on the left hand of the boat.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The sun boat is towed through the Third Division by eight gods of the Tuat
    using a rope fastened to a bull-headed beam supported by mummied gods.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: 'Companies under Tem are assigned to act against Apepi: he is to be enchanted
    by recited incantations, decapitated, and hacked in pieces at the joints.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: When the god leaves the Third Division and the door closes, beings fated to
    remain there lift up their voices and weep.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: In the Fourth Division, twelve jackal-headed figures walk on the Lake of Life
    and ten uraei rise from the Lake of uraei.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:14
  text: The Sun-god addresses words of comfort to the figures in the Fourth Division,
    and the uraei answer by offering flames and fire for use against Ra's enemies.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Fourth Division includes Osiris wearing the crown of the South and standing
    upon a serpent, with twelve gods, four pit-presiding gods, and a prince of destruction
    behind him.
  category: relationship
  evidence_refs:
  - ev:8
