canonical_text:
  quote: ''
  summary: 'The passage describes the deceased after satisfying the Forty-two Assessors:
    he still must know the magical names of the door-parts leading from the Hall of
    Maati to the regions of the blessed. He addresses the gods and Osiris, declares
    that he has done and purified himself with Maat, recounts afterlife actions, answers
    a guardian’s and Thoth’s questions, identifies Mau-taui as Thoth and the fiery,
    serpent-walled, water-floored house as belonging to Osiris, and is admitted with
    his name recorded. The author comments that Maat and Thoth are closely linked
    in determining the deceased’s fate.'
  language: English
  quote_policy: summarized
