canonical_text:
  quote: ''
  summary: Budge compares Egyptian primeval divine pairs with Babylonian, Assyrian,
    Sumerian, and Damascius' Greek-form cosmogonic lists. He identifies equivalent
    early pairs, describes successive male-female divine pairs required to complete
    a primeval company, notes a later all-male Anu-Bel-Ea triad representing heaven,
    earth, and abyss, and argues that the close similarities point to an exceedingly
    ancient common source rather than direct borrowing.
  language: English
  quote_policy: summarized
