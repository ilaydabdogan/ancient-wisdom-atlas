canonical_text:
  quote: ''
  summary: Budge summarizes Edfu temple material about Heru-Behutet defeating Set
    and the enemies of Ra. Horus is commissioned by his father, ascends as a winged
    disk, attacks rebels from heaven, enters Ra's boat, and receives names and cultic
    titles through Thoth's declarations. The passage also describes a lioness-headed
    chariot goddess trampling bound foes, enemies becoming crocodiles in water, and
    Horus's blacksmiths killing them with divine iron spears and chains. Several names,
    cultic objects, statues, and the blacksmiths of Heru-Behutet at Edfu are explained
    etiologically.
  language: English
  quote_policy: summarized
