canonical_text:
  quote: ''
  summary: 'The passage reports modern Sudanese beliefs and practices around Jebel
    Barkal and the pyramids of Bakrawiyeh: tombs, pyramids, and the mountain are avoided
    after sundown because buried kings or gods are thought to be active and potentially
    wrathful; wasps, a snake, and hawks are interpreted as embodied spirits; and amulets,
    stones, beads, and plaques are worn for bodily protection. The author also compares
    some of these practices with ancient Egyptian or Nile Valley beliefs.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Local people are reported to avoid the sandstone ridge called the mountain,
    tombs, cemeteries, and pyramids after sundown or at night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Approaching the pyramids at night is described as an act expected to bring
    the wrath of the spirits of kings, who are regarded by locals as having acquired
    a divine character.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: During the Jebel Barkal excavation, wives removed workmen from evening labor
    because they feared bewitchment or a penalty when spirits of the dead came forth
    in the cool of the evening.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A local sheikh near Bakrawiyeh said he feared the spirits of the gods buried
    at the pyramids, left the donkeys tied away from the ruins, and would not move
    about among the pyramids.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Large numbers of unusually large wasps appeared at the pyramids, and locals
    declared that they were evil spirits in the form of wasps and that evil was coming
    to the village.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: After a harmless snake that had crawled to drink was killed, locals believed
    the spirit of a king had been killed and expected vengeance from other divine
    spirits.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Four large hawks lived partway up Jebel Barkal, appeared to follow people
    ascending the mountain, and were regarded as embodied spirits of gods whose figures
    remained in the rock-hewn sanctuary.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The people of nearby villages are said not to shoot or snare the hawks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage says certain colored stones, especially when inscribed with symbols,
    are believed to possess magical properties due to spirits within them.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Women and children, especially female children, wear strings of beads and
    plaques of metal or stone on parts of the body for protection.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: The positions of some plaques on the body are said to correspond frequently
    to places where dynastic Egyptians placed amulets on the dead.
  category: relationship
  evidence_refs:
  - ev:8
