canonical_text:
  quote: ''
  summary: Budge discusses Thoth’s associations with the western sky, Temu, the moon,
    time-regulation, eternity, lunar iconography, the Eye of Horus/Ra, and Book of
    the Dead and Pyramid Text passages in which a deceased speaker addresses Thoth/Temu
    about disorder, a dark airless and waterless place, and the duration of afterlife
    existence.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Thoth is connected with the western sky, while Horus is identified with the
    eastern sky; in the Book of the Dead passage the deceased addresses Thoth as both
    Thoth and Temu, the setting sun or god of the west.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The divine children of Nut are described as doing battle, upholding strife,
    doing evil, creating fiends, making slaughter, causing trouble, and working against
    the weak; their actions are also linked with confusion of years and disturbance
    of months.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The deceased calls himself Thoth’s writing palette, says he has brought Thoth’s
    ink-jar, and states that he is not among those who work iniquity in secret places.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The place into which the deceased has come is described as without water,
    without air, unfathomably deep, black as night, and a place where men wander helplessly
    and cannot live in quietness of heart.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The deceased asks how long he has to live in the new world, and Temu-Thoth
    replies that he is for millions of millions of years.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Thoth is described as being appealed to as the measurer and regulator of times
    and seasons, as the Moon-god Aah-Tehuti, and as maker of eternity and creator
    of everlastingness.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Aah-Tehuti is depicted as a mummy standing on the symbol of maat, holding
    emblems of life, stability, sovereignty, dominion, and a sceptre; he has the crescent
    moon and the lock of youth, and in one form has two faces associated by the author
    with waxing and waning moon periods.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Lunar imagery includes a disk between crescent horns on a pedestal in a boat,
    and Aah-hetep with an ibis head, lunar disk, and crescent seated in a boat while
    a dog-headed ape presents an utchat; the boat end is compared to a notched palm
    branch symbolizing years.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Aah-Tehuti is said to symbolize the new moon in the narrowest sense and the
    moon during the whole month more generally.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: An iconographic scene shows ibis-headed Thoth by a lotus pillar supporting
    heaven, with a crescent resting on heaven and fourteen unequal steps representing
    the first fourteen days of the month; fourteen gods stand at the foot of the steps,
    beginning with Tem.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Utchat of Thoth, or Thoth-Horus, is described as the left eye of Ra, the
    winter half of the year, and the Black Eye of Horus; it is contrasted with the
    White Eye, identified as the sun, and both eyes are said to give light to King
    Unas’s face.
  category: relationship
  evidence_refs:
  - ev:11
