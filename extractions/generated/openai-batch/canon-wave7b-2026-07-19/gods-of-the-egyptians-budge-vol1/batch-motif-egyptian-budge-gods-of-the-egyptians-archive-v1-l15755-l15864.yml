canonical_text:
  quote: ''
  summary: Budge describes Khepera as the self-produced third form of Ra, symbolized
    by the scarab beetle. He summarizes a creation account in which Ra appears as
    Khepera from the primeval watery mass of Nu, makes a place to stand, and creates
    Shu and Tefnut. The passage also explains the scarab’s dung-ball behavior as a
    basis for Egyptian solar symbolism and notes ancient claims that scarabs were
    all male and self-produced like Ra.
