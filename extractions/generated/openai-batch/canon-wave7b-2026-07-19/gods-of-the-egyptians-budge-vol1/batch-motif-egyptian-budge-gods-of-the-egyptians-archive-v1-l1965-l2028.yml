canonical_text:
  quote: ''
  summary: 'The passage presents Unas in heaven, compares his strength with Tem, identifies
    Tem as the father who begot him, and arranges other beings around Unas: his doubles
    behind him, the conquered beneath his feet, his gods on him, his uraei on his
    brow, and his serpent guide before him. The section is labeled as concerning a
    slayer and eater of the gods.'
