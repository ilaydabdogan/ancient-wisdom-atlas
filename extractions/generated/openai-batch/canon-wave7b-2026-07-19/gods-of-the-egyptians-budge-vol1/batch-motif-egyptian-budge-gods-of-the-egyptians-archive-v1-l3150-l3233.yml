canonical_text:
  quote: ''
  summary: The passage discusses scholarly interpretations of the Egyptian word neter.
    Maspero rejects the claim that its primitive meaning is strong, treating adjectival
    uses as metaphorical divine language. Brugsch interprets neter as an operative
    power of periodic creation, renewal, rejuvenation, and restored youth, including
    post-mortem transformation into a youthful divine being in coffin-text language.
    The passage also reports and rejects Brugsch's comparison of neter with Greek
    physis and Latin natura.
  language: English, with quoted German and French examples
  quote_policy: summarized
