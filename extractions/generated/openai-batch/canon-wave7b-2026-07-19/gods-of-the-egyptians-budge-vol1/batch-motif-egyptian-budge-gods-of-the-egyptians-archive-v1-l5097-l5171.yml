canonical_text:
  quote: ''
  summary: The passage describes an Egyptian conception of heaven as divided like
    Egypt into regions, cities, districts, and quarters governed by gods whose favor
    or names the deceased must secure to move freely, drink celestial Nile waters,
    and enter heavenly cities. It then describes beliefs about divine assistance to
    the deceased, written and ritual efficacy, visits to heavenly shrines, and the
    deification of the dead through acquisition of divine powers, identification with
    gods, and transformation of body members into divine counterparts.
  language: English
  quote_policy: summarized
