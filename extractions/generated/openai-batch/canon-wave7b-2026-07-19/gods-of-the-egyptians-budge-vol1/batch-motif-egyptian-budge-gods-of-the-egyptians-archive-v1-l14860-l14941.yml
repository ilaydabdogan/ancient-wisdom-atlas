canonical_text:
  quote: ''
  summary: The passage introduces hymns to Ra and Osiris and then gives hymnic praise
    of Ra under solar names and forms. Ra is described as rising and setting, creator
    of earth, humanity, waters, the Nile, mountains, heavens, and beasts; as self-begotten
    and kingly; as travelling or sailing across the sky in the Sektet boat; as attended
    by Maat, Nebt-unnut, Thoth, gods, and Tuat dwellers; as defeating or being protected
    against foes including the serpent-fiend Nak; and as granting the worshipper renewal
    and access to the land of eternity.
  language: English
  quote_policy: summarized
