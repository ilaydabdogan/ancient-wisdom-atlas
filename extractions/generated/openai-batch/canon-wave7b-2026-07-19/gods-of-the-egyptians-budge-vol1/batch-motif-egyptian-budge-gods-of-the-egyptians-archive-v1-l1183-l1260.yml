  text: The passage distinguishes an earlier worship of animals as animals from a
    later belief that animals could be abodes of spirits or deities, a belief connected
    with mummifying animal bodies and keeping animals in sanctuaries.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The god Apis was not believed to inhabit every bull, and the soul of Osiris
    was not believed to inhabit every ram.
  category: relationship
  evidence_refs:
