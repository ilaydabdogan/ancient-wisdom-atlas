canonical_text:
  quote: ''
  summary: The passage describes Budge's account of Egyptian animal worship, especially
    the Apis Bull and the Ram of Mendes, as selected animals bearing recognized marks
    in which deity was believed to be incarnate. It also discusses nome standards
    topped by animals or birds, local sacred animals as territorial protective deities,
    and qualified comparisons with totems or fetishes, while warning against hostile
    Greek and Roman reports.
  language: English
  quote_policy: summarized
