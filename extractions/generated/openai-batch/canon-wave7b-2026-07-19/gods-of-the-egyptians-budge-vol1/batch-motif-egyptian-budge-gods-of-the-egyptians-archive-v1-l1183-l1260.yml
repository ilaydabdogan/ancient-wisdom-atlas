- id: obs:3
  text: The Apis Bull and the Ram of Mendes had to be diligently sought and had to
    possess characteristic marks recognized by priests.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ordinary bulls and rams of the same species were not regarded like the specially
    marked sacred animals and could be sacrificed in funeral ceremonies or killed
