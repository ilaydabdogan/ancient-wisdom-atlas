canonical_text:
  quote: ''
  summary: 'The passage presents Budge''s discussion of Tem: his Heliopolitan status
    as first god in primeval matter, his association with rising and setting solar
    forms, his shrine at Pa-Atemt/Pithom, evidence for a serpent form of worship,
    possible cultural modification of the local cult, possible phallic elements, and
    the female counterparts Iusaaset and Nebt-hetep, along with later syncretic and
    local forms.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An opening quoted passage identifies Ra as rising at the beginning in Suten-lienen,
    crowned like a king, before the pillars of Shu were created and while on high
    ground associated with the dweller in Khemennu, glossed as Thoth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Heliopolitans made Tem the first god to exist
    in primeval matter.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tem is coupled with Harmachis and Khepera as forms of the rising sun.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Tem is also identified with the setting sun, and the wind of evening is said
    to go forth from him, refreshing mortals and giving breath to the dead.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: The original shrine of Tem is placed by the passage in the Eighth Nome of
    Lower Egypt at Thuket or Pa-Atemt/Pithom, described as the gate of the East; inscriptions
    identify Tem as the great god of Pithom.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:6
  text: Inscriptions at Pithom allude to a Holy serpent, and part of the temple buildings
    is described as the house of the snake-god Qerliet; the passage concludes that
    Tem was probably worshipped in one form as a huge serpent.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: Pithom is described as lying on a canal between the Red Sea and the Nile and
    on a highway from Arabia to Heliopolis, with a mixed population that probably
    included Western Asian merchants.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says these Western Asian people probably brought practices connected
    with their own gods, which may have modified local worship.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage reports that a Pyramid Texts passage seems to suggest an originally
    phallic character for the worship of Tem, but also says nothing is known about
    it; some scholars regarded obelisks, especially disk-topped forms, as phallic
    emblems.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: Two female counterparts are attached to Tem; Iusaaset is called mistress of
    Annu and Eye of Ra, and as wife of Tem she is said to be mother of Shu and Tefnut.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Iusaaset is depicted as a woman holding a sceptre and the sign of life, wearing
    a vulture headdress with a uraeus and a disk between horns.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:12
  text: Nebt-hetep is presented as a form of Iusaaset, represented as a cow and called
    mistress of the gods under the combined name Iusaaset-Nebthetep.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: According to the passage, Tem was joined to Osiris as Tem-Asar, formed part
    of a Heroopolis triad with Hathor of Annu or Ant and Heru-sma-taui, and had local
    forms of Tem-Ra associated with Khnemu names at Elephantine, Heracleopolis Magna,
    and Mendes.
  category: relationship
  evidence_refs:
  - ev:8
