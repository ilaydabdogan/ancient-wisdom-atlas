  quote: ''
  summary: A philological note discusses the Vedic root myaksh, arguing that while
    a few examples may mean mixing, many cited passages convey holding to, sticking
    to, clinging, being firmly set, or grasping. The cited examples include Soma prepared
    by stones for Indra, butter mixed or coagulated, Indra’s spear, a thunderbolt
    in a king’s fist, Rodasi clinging, chariot and harness imagery, bright colours
    on Indra, and the Maruts clinging to splendour, thought, and a young maid.
  language: English with transliterated Sanskrit citations
  quote_policy: summarized
