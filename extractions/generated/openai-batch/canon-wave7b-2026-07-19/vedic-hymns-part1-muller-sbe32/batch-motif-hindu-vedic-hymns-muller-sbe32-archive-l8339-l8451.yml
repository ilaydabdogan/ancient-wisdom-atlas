  summary: The notes collect Vedic passages concerning the term vahni and related
    priestly functions. They include invocations of Indra and Varuza in battle and
    for treasure, Indra's victory among cows with ministers, descriptions of Hotar/vahni
    as priest or leader, Agni as a wise priest, priests calling deities at dawn with
    hymns, and the mouth or flame as an instrument of praise.
