  summary: 'A scholarly introduction discusses principles of translating the Rig-veda
    and compares renderings of Rig-veda I.165. Within that discussion, it summarizes
    an old legend cited from Brahmana texts: Agastya made offerings to the Maruts,
    Indra seized them, the Maruts threatened Indra with lightning, and Agastya and
    Indra pacified the Maruts with the hymn.'
