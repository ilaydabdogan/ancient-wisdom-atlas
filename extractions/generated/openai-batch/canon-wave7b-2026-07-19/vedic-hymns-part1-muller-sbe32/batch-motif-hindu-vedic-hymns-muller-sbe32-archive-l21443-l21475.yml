canonical_text:
  quote: ''
  summary: A hymn is presented as a dialogue between Indra and his worshipper Agastya.
    Indra speaks of uncertainty and the need to consult another thought. Agastya asks
    Indra not to kill or strike in battle, invokes the Maruts as Indra's brothers,
    and later commands preparation of altar, fire, sacrifice, and offerings. The Maruts
    address Agastya as brother and friend and ask whether he wishes to give to them.
    Agastya praises Indra and asks him to speak again with the Maruts and consume
    the offerings at the proper season.
