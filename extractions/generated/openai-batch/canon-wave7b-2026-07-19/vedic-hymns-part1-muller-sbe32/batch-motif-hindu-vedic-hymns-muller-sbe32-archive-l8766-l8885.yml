canonical_text:
  quote: ''
  summary: Scholarly notes on Rig Veda I, 6, 9-10 compare translations that invoke
    or seek Indra from earth, heaven, firmament, or air. The note argues that forms
    of rocanam/rocana divah mean the light or bright place of heaven, adducing Vedic
    parallels involving Indra, the sun, waters above and below, gods enthroned in
    heaven, and varying twofold, threefold, and fourfold cosmographic divisions.
  language: English with German translation excerpts and transliterated Sanskrit citations
  quote_policy: summarized
