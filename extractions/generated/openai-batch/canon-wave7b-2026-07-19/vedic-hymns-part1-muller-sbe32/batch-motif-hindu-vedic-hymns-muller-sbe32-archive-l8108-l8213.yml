canonical_text:
  quote: ''
  summary: The passage is a commentary on a Vedic verse and on the word vahni. It
    describes the Maruts assisting Indra in battle and becoming deities; gives alternate
    explanations involving a cloud embryo, Aditya, and Savitar; cites translations
    in which Indra with the Maruts finds cows hidden in a cave; recounts Sayana's
    story that the cows were carried off by the Pazis into darkness and recovered
    by Indra with the Maruts; and discusses vahni as fire, light, Agni, carrier, and
    sacrificial priest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary states that the Maruts assisted Indra in battle, retained an
    appellative meaning of storms, and attained deity rank beside Indra.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary reports a later legend in which the Maruts, like the Azbhus,
    were not originally gods but became deified for their works.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage gives alternate explanations in which something born within the
    cloud becomes a garbha or embryo, or in which the beings arise with Aditya, proceed
    with Savitar, and become garbhas again when Savitar sets.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The cited verse translations describe Indra, together with the Maruts or similar
    helpers, finding cows hidden in a cave or grotto; one translation renders the
    recovered object as morning rays.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sayana's explanation is summarized as a story in which cows are carried off
    from the world of the gods by the Pazis, thrown into darkness, and then conquered
    and brought back by Indra with the Maruts.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that vahni is a difficult Vedic word and that in later
    Sanskrit it means fire and is also quoted as a name of Agni.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage says Agni is often represented as the carrier of the sacrificial
    oblation and that vahni in the Veda is distinctly applied to bright fire or light
    and to the sacrificial fire.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The cited Vedic examples present Agni or vahni as a priest or chosen minister,
    as a finder of wealth, and as celestial or solar light that opens the doors of
    darkness and brightens the worlds.
  category: attribute
  evidence_refs:
  - ev:7
  - ev:8
