canonical_text:
  quote: ''
  summary: The hymn addresses the Maruts, identified as storm-gods. It praises them
    as a brilliant, powerful host who shake mountains, wield lightning and thunderbolts,
    bring or seek water, fill wells, moisten the earth, drive cosmic elements, travel
    with horses, protect properly led humans, and are adorned with weapons and gold.
    The speaker petitions them for guidance, food, wealth, and protection.
  language: English
  quote_policy: summarized
