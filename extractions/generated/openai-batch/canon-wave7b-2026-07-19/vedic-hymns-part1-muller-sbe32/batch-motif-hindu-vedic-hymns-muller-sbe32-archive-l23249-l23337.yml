- id: obs:2
  text: A speech is said to have been fashioned for the brilliant Marut-host, which
    shakes mountains and is connected with warm milk and sacrifice on the height of
    heaven.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Maruts are described as coming forth in search of water, invigorating
    themselves, harnessing horses, and swarming around.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the Maruts aim with lightning, Trita shouts and the waters murmur while
    running on their course.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Maruts are described as brilliant with lightning, shooting thunderbolts,
    blazing with wind, shaking mountains, and whirling hail when wishing to give water.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Maruts are addressed as driving forth nights, days, sky, mists, plains
    like ships, and strongholds.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Their strength is compared with the reach of the sun's daily course, and they
    are said to go down to the western mountain.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Marut-host is said to strip a waving tree like a caterpillar, and the
    speaker asks the Maruts to conduct the service to a good end.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A man rightly led by the Maruts is described as not overpowered, killed, failing,
    shaking, dropping, or losing goods and protections; the man may be a seer or a
    king.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Maruts, with steeds and waterskins, fill a well; when the strong ones
    roar, they moisten the earth with sweet juice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the Maruts come forth, earth, heaven, paths in the sky, and cloud-mountains
    with rain are said to bow.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: At sunrise the Maruts rejoice and toil together; their horses do not tire
    and they quickly reach the end of their journey.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Maruts are described as having spears on their shoulders, rings on their
    feet, golden chains on their chests, gems on their chariot, fiery lightnings in
    their fists, and golden headbands.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Maruts shake a red apple from the firmament; hamlets bow when they blaze,
    and pious people intone a far-reaching shout.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: The speaker asks to carry off food-wealth bestowed by the Maruts and asks
    them for thousandfold unfailing wealth; the Maruts are also said to protect wealth
    and a seer skilled in song.
  category: speech
  evidence_refs:
  - ev:12
