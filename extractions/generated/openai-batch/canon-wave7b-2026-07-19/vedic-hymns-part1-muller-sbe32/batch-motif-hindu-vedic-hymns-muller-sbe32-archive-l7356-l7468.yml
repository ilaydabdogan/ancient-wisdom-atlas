canonical_text:
  quote: They trim the fire day by day, like a strong horse, like Arusha, the child
    of Dyu.
  summary: The passage is a philological note on Arusha and Arushi in Vedic hymns.
    It distinguishes Agni, the sacrificial fire, from Arusha, child of Heaven and
    a bright morning or morning-sun figure. It then surveys feminine Arushi as an
    adjective meaning red, as a possible substantive for dawn, as a term for red cows,
    red dawns, mares, and the red horses of deities such as Agni, Indra, and Soma.
    It closes with a lexical comparison between Vedic arusha as red and Zend aurusha
    as white, suggesting an earlier sense of brilliance.
  language: English
  quote_policy: quoted
