  quote: ''
  summary: Philological notes on Rig-veda I, 38, verses 11-14 discuss the Maruts,
    their horses and cloud imagery; the interpretation of rodhasvati as an unopened
    cloud rather than only a river; Indra opening Bala's enclosures as clouds; Agni
    as invoked with and friendly to the Maruts; Mitra as possibly meaning friend or
    serving as a brightness comparison; and a hymn of praise compared to a cloud sending
    rain or to Parjanya/thunder.
