  summary: The passage is a set of philological notes on Rig-Vedic terms. It explains
    a chariot-like comparison, defines su-ketuna as divine kindness or favour, and
    discusses sumati as favour, blessing, gift, prayer, or desire. The cited Vedic
    examples include requests to deities such as Agni, Dyavaprithivi, the Maruts,
    the Asvins, Vishnu, Vasu, and Soma for favour, wealth, happiness, life-support,
    or grace. Several examples personify divine favour or help as approaching the
    worshipper, including comparison to a cow, and one cited line says the lighted
    fire went upward for the favour of wealth.
