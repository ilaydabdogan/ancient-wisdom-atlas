  text: The editor states that some Vedic verses are so difficult that translators
    should not be blamed for failing to render them securely.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Purandhi is discussed through several possible etymological meanings, but
    in the passage under discussion it is treated as a characteristic epithet of dawn,
    who is to be woken by the wind in the morning.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sabardugha is glossed as juice-yielding, and sabar is explained as juice,
    milk, or water in a linguistic note.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The note on vakshawzabhyak mentions flanks and discusses the Maruts'' parentage:
    Dhenu the cow and Dyaus are referenced in one relation, while in the present passage
    Vayu is taken as their father and dyaus as their mother.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: For verse 5, tsari is explained as hunter or watcher, and takvaviya as the
    chase of an unidentified animal called takva.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: For verse 6, vihutmat is rejected as meaning not sacrificing and is instead
    connected with invoking, possibly invoking toward different sides; another doubtful
