  summary: Philological notes on Rigvedic hymn I, 134 discuss a difficult verse addressed
    to Vayu, prepared morning drops with milk, songs and foods, the term Purandhi
    as an epithet of dawn awakened by wind, the word sabardugha as juice-yielding,
    the parentage of the Maruts in relation to Dhenu, Dyaus, Vayu, and dyaus, and
    disputed ritual terms connected with invoking or sacrificing.
  language: English with German and Sanskrit terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The cited German and Ludwig translations present Vayu as addressed by hymnic
    speech involving joyful morning drops prepared with milk, teams or harnessings
    directed toward the speaker, songs, and the receiving of foods.
  category: action
  evidence_refs:
  - ev:1
