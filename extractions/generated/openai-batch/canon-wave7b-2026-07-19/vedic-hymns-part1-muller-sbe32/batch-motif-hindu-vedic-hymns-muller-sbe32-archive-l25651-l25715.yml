  quote: ''
  summary: The passage first gives philological notes on the preceding hymn, including
    a note that amrta means “not dying.” It then presents Mandala VII, Hymn 58, addressed
    to the Maruts as storm-gods. The hymn praises the Maruts as a powerful divine
    company who stir heaven and earth, mount from the abyss of Nirvzti to the firmament,
    have a birth marked by fire and fury, inspire fear, and grant strength, success,
    victory, forgiveness, and protection when pleased by praise.
