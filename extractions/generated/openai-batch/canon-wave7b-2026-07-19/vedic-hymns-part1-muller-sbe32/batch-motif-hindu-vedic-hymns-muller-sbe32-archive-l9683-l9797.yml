    sardha/sardhas. The notes cite Vedic passages where sardha/sardhas denotes might,
    a host, or an aggregate of strong men or gods, especially the host of the Maruts.
    The cited examples include a host brilliant on chariots, a host called by voice,
    the quick and victorious Maruts, the shout of a daring host, and passages comparing
    or identifying Agni and his flames with the host of the Maruts.
