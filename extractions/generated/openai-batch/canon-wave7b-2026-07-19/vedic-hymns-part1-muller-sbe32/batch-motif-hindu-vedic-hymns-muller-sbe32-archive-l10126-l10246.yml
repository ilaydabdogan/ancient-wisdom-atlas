  quote: ''
  summary: Philological notes on Rig-Vedic hymn I, 37 discuss the Maruts as fearsome
    figures whose approach makes forests, earth, and mountains yield or tremble; the
    earth is compared to an aged or weakened ruler or man. The notes also discuss
    the Maruts' birth, strength as soon as born, possible bird imagery, their relation
    to a mother or parent, and contested interpretations of speech, sound, waters,
    and cattle in verse 10.
