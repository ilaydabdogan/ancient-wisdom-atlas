canonical_text:
  quote: ''
  summary: A philological note discusses the Vedic word vrishan and related forms,
    explaining that in cited passages it often means strong, hero, or strong bull
    rather than merely male. The note gives examples for Indra, Agni, Vishzu, and
    Rudra, with narrative details including Indra’s strength, thunderbolt, battles,
    Soma drinking, horses, and Vritra-killing; Agni’s kindling and praise; Vishzu’s
    mountain/cloud dwelling and wide stride; and Rudra’s begetting of the Maruts in
    a truncated citation.
  language: English with transliterated Sanskrit citations
  quote_policy: summarized
