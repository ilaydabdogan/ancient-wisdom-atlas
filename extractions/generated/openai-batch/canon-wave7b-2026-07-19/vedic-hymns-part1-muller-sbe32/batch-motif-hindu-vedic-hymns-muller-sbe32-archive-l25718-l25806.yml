  quote: ''
  summary: A philological note on a Vedic hymn ascribed to Vasishtha discusses the
    translation of the Vedic terms dhaman and vrata, arguing that concrete senses
    such as settled abode and hedge or enclosure precede abstract senses such as law
    or protection. The note also discusses a phrase involving the divine dhaman and
    cites alternative translations involving the gods' dwelling or divine nature.
  language: English
