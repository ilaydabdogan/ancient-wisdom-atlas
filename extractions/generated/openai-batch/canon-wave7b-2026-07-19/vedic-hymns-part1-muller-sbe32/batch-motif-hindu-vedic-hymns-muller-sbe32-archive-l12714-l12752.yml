canonical_text:
  quote: ''
  summary: Mandala I, Hymn 85, stanzas 7-12 describe the Maruts growing in might,
    taking a wide seat, appearing like warriors and kings, Indra taking a golden thousand-edged
    thunderbolt made by Tvashtr, slaying Vritra and releasing water, the Maruts raising
    a well or cloud, splitting a rock or cloud, pouring out a spring for thirsty Gotama,
    and being asked to grant shelter, wealth, and valiant offspring to their worshippers.
  language: English
  quote_policy: summarized
