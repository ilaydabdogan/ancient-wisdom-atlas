  quote: ''
  summary: The passage includes notes on Tryambaka as a name of Rudra and on Ambika
    sharing sacrifice with him, followed by the opening of Mandala VIII, Hymn 7 to
    the Maruts. The hymn describes a sage pouring a threefold draught, the Maruts
    shining in mountains or clouds, moving with winds, sowing mist, shaking mountains,
    receiving invocation for protection, rising above the sky, sending light for the
    sun, and the Prsnis or clouds yielding three lakes as mead for Indra.
