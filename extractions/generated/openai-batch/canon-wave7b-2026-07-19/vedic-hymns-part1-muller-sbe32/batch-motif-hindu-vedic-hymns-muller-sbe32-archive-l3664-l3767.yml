  quote: ''
  summary: A scholarly preface argues about the conjectural reading of the Vedic form
    “uloka,” declines to alter the received text without stronger support, evaluates
    etymological and comparative linguistic proposals, and then discusses metrical
    criticism, Sandhi, Pada and Samhita readings, and the limits of emending Vedic
    hymns on metrical grounds.
