canonical_text:
  quote: ''
  summary: The notes state that the hymn is ascribed to Agastya and addressed to the
    Maruts, with the first verse addressed to Indra. They distinguish certain Vedic
    terms for general wealth, horses, and cows; interpret the Maruts' spear as lightning;
    and explain that lightning is represented as the Maruts' wife or beloved, called
    Rodasi, distinct from the dual rodasi meaning heaven and earth. Brief Rig-vedic
    examples describe Rodasi standing on a chariot among the Maruts, clinging to them,
    and coming among the strong ones after the Maruts join the two Rodas, heaven and
    earth.
  language: English with Sanskrit transliterations
  quote_policy: summarized
