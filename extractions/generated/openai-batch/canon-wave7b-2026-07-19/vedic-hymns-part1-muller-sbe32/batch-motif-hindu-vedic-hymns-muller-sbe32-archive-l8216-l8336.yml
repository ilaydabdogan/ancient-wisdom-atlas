canonical_text:
  quote: ''
  summary: A philological note surveys Vedic uses of the word vahni. It cites examples
    where vahni is connected with light or fire, with carriers or horses, and with
    officiating ministers, singers, or reciters. The cited verses mention Indra filling
    heaven and earth with light, Savitar arising luminous, goats or horses bearing
    deities, Agni's horses and possible flame imagery, Soma as a possible referent
    of vahni, and ministers praising Dawn with hymns.
  language: English with transliterated Sanskrit citations
  quote_policy: summarized
