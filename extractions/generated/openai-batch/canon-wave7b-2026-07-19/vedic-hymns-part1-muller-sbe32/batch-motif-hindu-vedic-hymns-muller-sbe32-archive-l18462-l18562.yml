  summary: The notes explain a Vedic expression as indicating roadside accommodations
    for travelers, discuss the Maruts as imagined on a journey in a smoothly moving
    chariot whose axle turns the wheels, analyze the verb for turning with examples
    involving wheels and poison, and comment on eta as a deer or antelope term possibly
    referring to deer-skins. The notes also cite Grihya-sutra and Dharma-sutra rules
    for boys brought to a tutor, including new dress, animal skins, garment colors,
    and girdle materials by social class.
