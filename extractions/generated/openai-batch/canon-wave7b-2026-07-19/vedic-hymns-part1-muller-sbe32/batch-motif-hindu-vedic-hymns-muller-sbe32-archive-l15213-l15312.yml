  summary: Philological notes discuss the Maruts' chariot, its tire or wheels, thunderbolts,
    weapons, forests, clouds, prayer, and possible meanings of terms such as svadhiti,
    vasi, medha, dhan, and adri. The notes also compare the Vedic idea of thunder
    as a god's chariot-noise with a similar belief attributed to ancient Germanic
    people.
