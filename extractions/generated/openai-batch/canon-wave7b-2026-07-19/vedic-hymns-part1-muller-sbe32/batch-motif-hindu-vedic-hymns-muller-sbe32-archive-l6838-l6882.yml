canonical_text:
  quote: ''
  summary: A philological note argues that the Vedic sacrificial formula asking to
    which god sacrifice should be offered was poetically a questioning address, while
    later Brahmana authors treated the interrogative pronoun ka, “who,” as a deity
    named Ka and identified Ka with Prajapati. The note also cites a Vata hymn in
    which the wind is heard but not seen and receives sacrifice, and it describes
    later terms for hymns and sacrifices derived from ka/kad.
  language: English
