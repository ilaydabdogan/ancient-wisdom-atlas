canonical_text:
  quote: ''
  summary: Editorial notes collect Vedic passages on seven stations, threads, places,
    or divisions of sacrifice; discuss the uncertain number and names of the Adityas,
    including an eighth Aditya or Mārtaṇḍa; describe Aditi as mother of divine sons;
    and introduce a hymn identifying Aditi with heaven, sky, kinship roles, and other
    divine or cosmic categories.
  language: English with transliterated Sanskrit citations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note proposes that the destruction of the eighth Aditya might be explained
    through the uncertain eighth day of each parvan, represented as exposed to decay
    and destruction.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Several cited passages connect the number seven with the sacrifice through
    seven stations, seven threads, seven places, or the term sapta-tantu.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:3
  text: Agni is cited as worthy of sacrifice in seven stations, as associated with
    the seven stations of sacrifice, as going around seven stations, and as holding
    seven places for sacrifice.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: One cited verse says that sages established seven divisions and that mischief
    befell one of them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A cited verse asks the gods for protection from the place where Vishnu strode
    forth by the seven stations of the earth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The note states that the names of seven or eight Adityas are not definitely
    known from the Rigveda and then lists varying groups of deities from several passages.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'A Taittirīya-Āraṇyaka list names eight figures: Mitra, Varuna, Dhatar, Aryaman,
    Amsa, Bhaga, Indra, and Vivasvat; the eighth son is said to be Mārtaṇḍa or, according
    to the commentator, Aditya.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: Aditi is described as mother of certain gods, with epithets meaning having
    royal sons, good sons, and terrible sons.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A cited prayer asks Aditi with royal sons and Aryaman to carry the speakers
    across hatreds, asks Aditi with excellent sons to sit on the sacred pile, and
    asks a goddess with terrible sons to protect from an enemy in shallow or deep
    water and protect offspring.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The note says Aditi, originally intended for the Infinite, could be identified
    with finite deities represented as resting on Aditi, participating in Aditi, or
    being Aditi.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The cited hymn I, 89, 10 identifies Aditi with heaven, sky, mother, father,
    son, and other divine or cosmic categories.
  category: attribute
  evidence_refs:
  - ev:8
