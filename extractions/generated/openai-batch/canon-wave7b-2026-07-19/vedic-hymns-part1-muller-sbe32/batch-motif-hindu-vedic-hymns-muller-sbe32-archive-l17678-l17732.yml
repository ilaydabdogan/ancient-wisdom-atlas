canonical_text:
  quote: ''
  summary: 'The passage is a commentary note comparing Vedic expressions: Indra places
    Sushza in the darkness of a pit; the Ndsatyas aid Kazva when he is thrown into
    a pit; Atri is thrown into a fiery pit and saved by the Asvins; Yama, the Pitars,
    and gharma/harmye vocabulary are discussed in relation to house, nether world,
    and hearth; a further note analyzes nad and parvata imagery, including divine
    racing that makes rocks, forest, and earth vibrate.'
