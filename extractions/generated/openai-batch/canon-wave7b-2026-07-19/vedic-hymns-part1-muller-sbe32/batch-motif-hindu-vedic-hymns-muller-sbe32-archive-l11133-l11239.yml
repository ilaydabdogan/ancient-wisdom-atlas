canonical_text:
  quote: ''
  summary: The passage is a philological note on Rig-veda I, 38, 15. It discusses
    whether a verbal form is addressed to the Maruts or to the poet, cites a rain-cloud
    simile, explains arkin as singing or musician when applied to the Maruts, identifies
    the Maruts' arka as the music of the winds, compares this with Eddic representations
    of storm and thunder as a lay or wild-hunt music, and then discusses the honorific
    use of vriddha and grammatical forms of as.
  language: English
