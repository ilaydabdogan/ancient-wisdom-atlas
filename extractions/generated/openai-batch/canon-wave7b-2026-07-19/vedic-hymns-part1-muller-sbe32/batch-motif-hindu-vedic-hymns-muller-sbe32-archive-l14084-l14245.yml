canonical_text:
  quote: ''
  summary: The passage combines philological notes on Vedic wording and proper names
    with the opening of Mandala I, Hymn 86 to the Maruts. It mentions Indra and Varuza
    being invited to drink Soma, discusses Vṛṣan and Upastuta as proper names in Agni-related
    verses, cites Agni as carrier of oblations, protector, and one kindled by named
    ritual figures, and then presents a hymn in which the Maruts drink Soma, hear
    sacrifices and prayers, guard and bless a worshipper, receive offerings, and are
    asked to strike fiends with lightning, remove darkness, and make light.
  language: English
