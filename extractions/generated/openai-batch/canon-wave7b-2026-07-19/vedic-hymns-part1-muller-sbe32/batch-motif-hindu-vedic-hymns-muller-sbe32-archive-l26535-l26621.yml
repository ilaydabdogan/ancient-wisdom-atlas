canonical_text:
  quote: ''
  summary: In a hymn to the Maruts, speakers bring or request libations, invite the
    Maruts to arrive on a chariot, describe their shining weapons, ornaments, unity,
    and divine affiliations, and ask them for protection, favor, riches, brotherhood,
    medicine, and healing for a sick person.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Strongly-anointed priests are told to bring libations to the strong host of
    the Maruts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Maruts are asked to come quickly like winged hawks on a chariot with strong
    horses in order to enjoy libations.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Maruts are described with golden chains on their arms, sparkling spears,
    firm bows, weapons on their chariot, and splendours on their faces.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Maruts are described as not striving among themselves, as having no one
    last among them, and as united friends or kindred by common birth.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:7
- id: obs:5
  text: The Maruts are called sons of Rudra and servants of the divine Dyu.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The hymn instructs worship and praise of the Maruts and tells Sobhari to call
    them with a new song.
  category: speech
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:7
  text: A person under the Maruts' protection is called happy, and one whose libations
    they enjoy is said to obtain favors, riches, and booty.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: A mortal is said to come asking for the Maruts' brotherhood, and the Maruts
    are asked to care for the speakers because their friendship lasts forever.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Maruts are asked to bring Marut-medicine and to use favors like those
    by which they favor Sindhu and save or help Krivi.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Medicine is said to exist on the Sindhu, on the Asikni, in the seas, and on
    the mountains; the Maruts are said to carry it on their bodies and are asked to
    bless with it and heal the sick one.
  category: object
  evidence_refs:
  - ev:9
