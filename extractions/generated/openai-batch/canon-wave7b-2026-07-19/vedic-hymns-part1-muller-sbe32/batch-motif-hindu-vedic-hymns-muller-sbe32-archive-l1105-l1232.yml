canonical_text:
  quote: ''
  summary: A scholarly introduction argues about the linguistic relation of Sanskrit
    Marut to Latin Mars/Mavors and related Umbrian, Estonian, Polynesian, and Greek
    comparisons. It frames the Maruts as Vedic storm-gods whose hymns were selected
    for translation, notes a broader transition from storm gods to gods of destruction
    and war, and explains that a hymn to the Unknown God is placed first to show that
    Vedic hymns rise from nature imagery to a conception of supreme Deity.
  language: English
  quote_policy: summarized
