canonical_text:
  quote: ''
  summary: The passage contains notes on Mandala V, Hymn 59 and the beginning of Mandala
    V, Hymn 60. The notes interpret the Maruts as uniquely deserving sacrifice because
    they opened the chest of rain. Hymn 60 invokes Agni and the Maruts, describes
    the Maruts arriving with deer and chariots, frightening forests, earth, mountain/cloud,
    and heaven, bearing spears, adorning themselves with gold, and being brothers
    born of Rudra and Prishni. The hymn asks the Rudras/Maruts and Agni to notice
    the offered libation from the highest, middle, or lowest heaven.
  language: English
