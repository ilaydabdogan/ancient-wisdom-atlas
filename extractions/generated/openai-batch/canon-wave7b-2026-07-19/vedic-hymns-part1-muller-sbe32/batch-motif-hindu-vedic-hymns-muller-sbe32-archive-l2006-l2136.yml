    Aufrecht's Romanized transcript, and addresses the placement and interpretation
    of the Valakhilya hymns. A footnote cites the Taittiriya-aranyaka's explanation
    of the name Valakhilya, stating that Prajapati created the world and that groups
    of sages arose from parts of his body.
