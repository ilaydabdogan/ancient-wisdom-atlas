canonical_text:
  quote: ''
  summary: 'Commentary notes on Rig-veda I,39: the hymn is attributed to Kazva, son
    of Ghora, and its metre is described. The passage discusses mana as a measure
    or measuring line, compares it with a cited verse in which Varuza measures the
    earth with the sun, applies the image to the Maruts whose weapons strike trees
    and mountains from afar, discusses varpas with an example involving Indra and
    Soma-juice, and surveys vi-ya as passing through, piercing, or destroying, with
    cited parallels involving a chariot, mountains or clouds, Vritra, and evil spirits.'
  language: English
  quote_policy: summarized
