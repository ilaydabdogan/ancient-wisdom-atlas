canonical_text:
  quote: ''
  summary: The passage is a set of editorial and philological notes on a Vedic hymn.
    It attributes the hymn to Nodhas of the Gotama family, discusses the first verse
    as the poet's self-address, interprets suvrzkti as ritual trimming of grass for
    an oblation-altar as well as possibly a hymn of praise, identifies apas as water,
    and discusses water effective at sacrifices. It cites a translation in which the
    Maruts pour down water, called the fat milk of the clouds, and notes uncertainty
    over whether Dyu should be read as heaven or as a personified deity.
  language: English with Sanskrit transliteration
  quote_policy: summarized
