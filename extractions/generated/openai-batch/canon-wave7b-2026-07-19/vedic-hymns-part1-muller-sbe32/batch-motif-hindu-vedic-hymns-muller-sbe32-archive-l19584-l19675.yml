- id: obs:2
  text: The passage says that dawn, the sun, day and night, Mitra and Varuna, and
    other bright solar eastern deities may be answered as coming from the Orient and
    being sons of Aditi.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
