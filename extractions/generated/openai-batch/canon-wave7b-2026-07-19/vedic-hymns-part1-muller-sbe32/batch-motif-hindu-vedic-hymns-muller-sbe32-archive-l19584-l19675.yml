canonical_text:
  quote: ''
  summary: The note explains Aditi as an eastern or orient deity and mother of solar
    or eastern gods, lists Vedic passages naming Mitra, Varuna, Aryaman, Bhaga, and
    the Adityas as her sons, discusses the eight sons of Aditi with the eighth Martanda
    thrown away, and analyzes the seven/eight numbering of the Adityas in relation
    to solar movements, directions, and possible lunar calendrical divisions.
  language: English with transliterated Vedic citations
  quote_policy: summarized
