    powerful sound, Indra as lord of cattle and giver of wealth or strength, Indra's
    red weapon against enemies, Soma offerings, Indra's strong car, bays, thunderbolt,
    and sacrifice, Indra killing Vritra with the Maruts, and water-giving or water-pouring
    powers such as wind, Sun, and Moon.
