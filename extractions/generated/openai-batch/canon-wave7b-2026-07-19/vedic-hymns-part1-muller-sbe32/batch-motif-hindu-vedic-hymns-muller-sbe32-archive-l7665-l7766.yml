canonical_text:
  quote: ''
  summary: Notes on Rig-veda I, 6, 2-3 discuss attendants or charioteers harnessing
    a horse or Indra's two bay coursers to a car. The notes identify the unnamed possessor
    as Indra and compare a phrase with another passage where Ushas, the dawn, lights
    the lights in the sky. Verse 3 translations describe morning rays or dawn making
    the dark, unseen, senseless, or formless visible, known, sensible, or formed.
    A ritual note says the verse is used in the Asvamedha when a banner is fastened,
    and a philological note treats marya as an exclamation rather than a direct address
    to men or Maruts.
  language: English with transliterated Sanskrit and German translation excerpts
