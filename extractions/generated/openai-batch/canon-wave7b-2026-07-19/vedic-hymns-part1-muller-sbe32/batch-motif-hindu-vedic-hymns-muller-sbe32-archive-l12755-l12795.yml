  summary: The note to Mandala I, Hymn 85 ascribes the hymn to Gotama, lists Vedic
    textual parallels, and discusses an obscure phrase involving gani and sapti. The
    commentator considers but rejects a reading involving wives/mares, tentatively
    describes a poetic image of storms like race-horses as the host of the Maruts,
    and proposes that sapti means a yoked or following horse.
