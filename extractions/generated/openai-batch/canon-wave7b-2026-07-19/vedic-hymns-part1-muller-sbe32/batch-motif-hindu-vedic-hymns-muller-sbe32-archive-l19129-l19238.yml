  quote: ''
  summary: The note explains Aditi in relation to dawn, the distant East, the Infinite,
    and the Adityas. It cites Vedic passages in which Mitra and Varuna mount a chariot
    at dawn and sunset, Aditi is invoked with the Adityas for protection, Varuna can
    take Aditi’s place as leader with the Adityas, and the formula of Adityas and
    Aditi recurs in hymnic requests for protection and light.
