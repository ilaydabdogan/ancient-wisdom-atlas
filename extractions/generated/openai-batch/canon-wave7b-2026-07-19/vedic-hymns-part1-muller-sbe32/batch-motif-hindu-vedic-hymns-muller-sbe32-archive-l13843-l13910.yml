canonical_text:
  quote: ''
  summary: The note argues that the adjective haryata, meaning delicious, is a standing
    epithet of Soma and that the phrase haryata vrishan in the discussed verse should
    probably be assigned to Soma. The proposed interpretation presents Soma in a wooden
    vessel speaking with worshippers while the sacrificer brings the cow, glossed
    as milk, to be mixed with Soma. The note also mentions Indra as thirsting for
    Soma and as a Soma-drinker, and cites passages where the Maruts are addressed
    as vrishan, or heroes, asked to give wealth and good offspring and to fight.
  language: English
