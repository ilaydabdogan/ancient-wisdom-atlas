  summary: The passage contains notes on chariot arrangement, a lion identification,
    Rudra’s connections, and Manu’s receipt of health and wealth from Rudra, followed
    by Rig Veda VI, 74 to Soma and Rudra. The hymn asks Soma and Rudra to maintain
    divine dominion, receive oblations, bring seven treasures to households, protect
    children and cattle, remove disease and Nirvzti from the house, bestow remedies,
    remove evil clinging to bodies, and deliver the speakers from Varuna’s snare while
    guarding them.
