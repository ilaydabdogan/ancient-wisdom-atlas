  quote: ''
  summary: 'Editorial notes explain Sanskrit terms used in Vedic hymns: a verb translated
    as clinging also means following or revering; gods, Soma libation, horses, and
    worshippers are cited as examples of this usage. Further notes discuss epithets
    of the Maruts, the interpretation of a term connected with sky or dust, and the
    term vigishin in relation to Soma residue and the third libation.'
