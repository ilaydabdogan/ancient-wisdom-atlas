canonical_text:
  quote: O ye golden-jawed Maruts, shaking (your jaws), you go to feed.
  summary: The passage consists of philological notes on Rig-vedic hymn II, 34. It
    discusses proposed translations involving reeds, whips, and steeds; the meaning
    of sipra/sipraz/siprin as jaws or gold headgear; a preferred rendering addressing
    the Maruts as golden-jawed and going to feed; the adverbial reading of przksham;
    the Przshatis as spotted mares or spotted horses of the Maruts; and doubtful terms
    in verses 4-5.
  language: English
  quote_policy: quoted
