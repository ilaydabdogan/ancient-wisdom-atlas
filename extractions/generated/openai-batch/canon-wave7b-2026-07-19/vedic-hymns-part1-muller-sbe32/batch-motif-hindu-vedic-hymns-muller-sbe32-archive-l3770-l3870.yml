canonical_text:
  quote: ''
  summary: The passage is a philological discussion of Vedic metre and pronunciation.
    It explains that syllables in Vedic hymns may be lengthened, shortened, contracted,
    omitted, or supplied by protracting semivowels and contracted vowels. The authors
    of the Pratisakhyas are described as aware of these metrical necessities but as
    preserving the received text rather than altering it. The passage cites Sutra
    527 and later Sutras 972-973, with examples from Vedic verses, to show how deficient
    metre may be completed by restoring underlying vowel values.
  language: English
  quote_policy: summarized
