canonical_text:
  quote: ''
  summary: 'Philological and comparative notes on Rigvedic hymn I, 37, verses 5-7:
    the notes discuss bright and fierce terms applied to the Maruts, variant translations
    of their birth and nourishment among kine or milk, Prishni and Rudra as their
    parents, bull/cow and cloud/rain imagery, their shaking of heaven and earth, and
    the cowering of man and shaking or shattering of mountains before their approach.'
  language: English with Sanskrit and German citations
  quote_policy: summarized
