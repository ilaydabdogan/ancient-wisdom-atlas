  quote: "“Our chief object is to help forward a critical study of the Veda”"
  summary: 'The speaker explains a plan to divide future work with a collaborator:
    the present volume remains chiefly his responsibility, while the second volume
    will contain hymns to Agni translated and annotated by the collaborator and revised
    by the speaker. They will note real disagreements, share blame and praise, and
    aim to advance critical study of the Veda, while describing current scholarship
    as preliminary work before a longer effort against the difficult body of ancient
    Vedic literature.'
