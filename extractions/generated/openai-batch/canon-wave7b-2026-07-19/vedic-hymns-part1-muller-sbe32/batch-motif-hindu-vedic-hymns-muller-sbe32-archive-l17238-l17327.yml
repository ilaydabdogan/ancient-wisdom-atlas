canonical_text:
  quote: ''
  summary: Mandala I, Hymn 166 addresses the Maruts as storm gods and armed heroes.
    The hymn praises their march, cloud- and rain-bringing power, frightening storm
    effects, lightning, chariots, ornaments, association with Indra, and their protection
    and bounty toward the worshipper, sacrificer, or singer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hymn is addressed to the Maruts and calls them a robust host, strong-voiced
    heroes, and a group whose ancient greatness is to be proclaimed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Maruts or Rudras are compared to parents bringing a dainty to their own
    son, and they are said to protect the worshipper and not fail the sacrificer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: For a giver of oblations who has received wealth, the Maruts are said to gladden
    men with the milk of rain and pour out many clouds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Maruts stir up clouds, their horses rush forth self-guided, house-dwelling
    beings fear them, and their march is bright with spears.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Their terrible march is described as causing rocks to tremble, shaking the
    back of heaven, making forest lords fear, and driving shrubs out of the way.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Their lightning is described as gory-toothed, biting and crunching cattle
    like a well-aimed bolt.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Maruts are said to sing for drinking the sweet juice and to know the first
    manly deeds of Indra.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Maruts are asked to shield a guarded man with hundredfold strongholds
    from injury, mischief, and reproach.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Their chariots contain good things and clashing weapons, and the passage describes
    rings on shoulders, an axle, and two wheels.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Their equipment and adornment include golden chains, flaring ornaments, speckled
    deer-skins, sharp fellies, and splendors spread out behind them.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Maruts are described as mighty, visible from afar, sweet-toned singers,
    united with Indra, and shouting all around.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Maruts' bounty is said to extend far like the sway of Aditi, and Indra
    is said not to be able to injure that bounty when it is bestowed for good deeds.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Maruts are said to have often protected the singer in former years and
    to have granted a hearing to man through the prayer.
  category: relationship
  evidence_refs:
  - ev:12
