  summary: The passage is a philological note on Rig-Vedic terms, especially nitya/nishtya
    and harmya/gharma. It cites examples involving Agni within the house, outsiders
    or strangers in relation to Indra, libation and sacrifices, the hearth or fire-pit
    as the origin of house terminology, the Maruts by the hearth, dawn over house-tops,
    and a punitive pit from which gods save worshippers or into which they cast evil-doers.
