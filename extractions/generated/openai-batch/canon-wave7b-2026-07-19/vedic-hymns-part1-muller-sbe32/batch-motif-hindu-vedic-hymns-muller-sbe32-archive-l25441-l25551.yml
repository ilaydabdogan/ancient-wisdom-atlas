  quote: ''
  summary: Philological notes on Rig-vedic hymn VII, 56 discuss the Maruts, terms
    connected with sacrifice, possible meanings of yaksha/yakshadris, and references
    to divine groups such as the Vasus, Adityas, Rudras, Devas, and Agni. The notes
    also cite interpretations concerning meteors, ghosts, horses, offerings, wisdom,
    and a divine home.
