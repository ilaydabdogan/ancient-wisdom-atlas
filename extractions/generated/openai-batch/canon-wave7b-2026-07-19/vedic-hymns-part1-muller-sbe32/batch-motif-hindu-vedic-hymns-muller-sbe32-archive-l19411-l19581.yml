canonical_text:
  quote: ''
  summary: The passage is an exegetical note on Vedic terms and invocations. It discusses
    translating daksha-pitar as “fathers of strength,” the later or personified status
    of Daksha, and Aditi’s cosmic character as the unbounded Beyond. Several cited
    hymns place Aditi beside Heaven, Earth, sea/waters, and other gods, and describe
    divine kinship relations such as Sky as father, Earth as mother, Soma or Fire
    as brother, and Aditi as sister, mother, source of immortality, cow, protector,
    and well-guiding presence in a divine boat image.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage translates daksha-pitar expressions as “fathers of strength” for
    resplendent gods, for Mitra and Varuna, and for supplicant men through divine
    aid.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says Daksha may be taken as power, as a personification, or as the
    result of a mythological misunderstanding, and adds that Daksha, like Aditi, becomes
    a divine person and remains one of the Adityas in later tradition.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aditi is described in cosmic character as the Beyond, an unbounded realm beyond
    earth, sky, and heaven, originally distinct from sky, earth, and ocean.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: In one invocation, Mitra, Varuna, Aditi, Sindhu or the sea, Earth, and Sky
    are asked to grant the desired blessing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: One cited verse states that Sky is father, Earth is mother, Soma is brother,
    and Aditi is sister.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Aditi is called the mother of the Rudras, daughter of the Vasus, sister of
    the Adityas, source of immortality, and the guiltless cow who should not be offended.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Another invocation addresses Sky as father, Earth as kind mother, Fire as
    brother, and asks all Adityas and Aditi together to grant manifold protection.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A cited verse asks the worshippers to step for welfare into a divine boat
    with good oars, faultless and leakless, described with Earth, Sky, and well-guiding
    Aditi.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A longer invocation calls on many divine powers, including Heaven and Earth,
    Waters, and Adityas, then asks Aditi to protect from all sin and calls her mother
    of Mitra and Varuna.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The commentary argues that Aditi should not be treated as the same deity as
    Heaven and Earth in the cited verses, but as having an originally independent
    character.
  category: relationship
  evidence_refs:
  - ev:9
