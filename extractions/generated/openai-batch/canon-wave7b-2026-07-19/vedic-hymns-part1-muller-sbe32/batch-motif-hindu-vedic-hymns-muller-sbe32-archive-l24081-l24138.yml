canonical_text:
  quote: ''
  summary: Hymn V.59 addresses the Maruts, storm-gods. The speaker connects praise
    and sacrifice with Heaven, Earth, and a feast, while describing the Maruts as
    heroic, youthful, kin-like storm beings whose onset shakes the earth, obscures
    the sun with rain, moves through heaven, and shakes cloud-waters. The hymn identifies
    them by divine lineages involving Prishni, Dyaus, and Rudra.
  language: English
  quote_policy: summarized
