canonical_text:
  quote: ''
  summary: A philological note on Rigvedic use of Aditi argues that in the cited context
    Aditi should not be read as the female goddess, and surveys passages where aditi/Aditi
    functions as an epithet, name, or appellative of Agni. The note also observes
    wordplay between aditi and atithi, and cites translations in which Agni is described
    as Aditi/freest among gods, guest among men, welcome guest, and a brilliant light
    at the head of the dawns.
  language: English
  quote_policy: summarized
