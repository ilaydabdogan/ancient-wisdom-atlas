  quote: ''
  summary: The passage is a philological note explaining the Vedic term rzti-sah as
    one able to withstand attacks or onslaughts. It cites usages involving wealth
    in men able to withstand attack, Agni giving a strong son whose enemies tremble,
    and Indra described as strong and able to withstand onslaughts. It also notes
    that a concluding sentence occurs in six hymns ascribed to Nodhas and comments
    on the epithet dhiya-vasu as meaning rich in prayers or invoked by many worshippers.
  language: English with transliterated Sanskrit citations
