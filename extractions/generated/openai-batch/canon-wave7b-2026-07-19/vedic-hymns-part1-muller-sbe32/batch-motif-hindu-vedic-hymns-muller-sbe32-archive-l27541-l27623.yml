  summary: The passage first gives philological notes on variant readings and parallels
    for verses 7-10. It then begins a hymn addressed to Rudra as father of the Maruts,
    asking for favor, sight of the sun, grace for a horse, increase of offspring,
    long life through medicines, removal of hatred, anguish, sickness, and mischief,
    and protection from Rudra's wrath. Rudra is praised as beautiful, strong, thunderbolt-bearing,
    kind-hearted, responsive, tawny, and an excellent physician.
