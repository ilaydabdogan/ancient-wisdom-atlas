canonical_text:
  quote: ''
  summary: A hymn addresses the Maruts, storm-gods, as youthful decorated heroes riding
    chariots with spotted deer. The speaker recalls their rain-bringing movement,
    summons them from heaven and across named rivers, follows them with praise and
    prayers, and asks for seed, wealth, happiness, protection from enemies, health,
    water, medicine, and offspring.
  language: English
  quote_policy: summarized
