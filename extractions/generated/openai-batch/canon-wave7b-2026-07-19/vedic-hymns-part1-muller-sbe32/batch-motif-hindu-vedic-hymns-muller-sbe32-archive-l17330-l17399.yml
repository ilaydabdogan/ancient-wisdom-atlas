  summary: The hymn verses address the Maruts, asking for lasting prosperity through
    their wealth, growth of the speaker's men in the camp, successful completion of
    a rite with offerings, food and offspring, and an invigorating autumn with quickening
    rain. The notes ascribe the hymn to Agastya, identify reputed kinship relations,
    and discuss the word rabhasa and related forms as conveying quickness, strength,
    fury, or brilliant splendour in Vedic and comparative linguistic contexts.
