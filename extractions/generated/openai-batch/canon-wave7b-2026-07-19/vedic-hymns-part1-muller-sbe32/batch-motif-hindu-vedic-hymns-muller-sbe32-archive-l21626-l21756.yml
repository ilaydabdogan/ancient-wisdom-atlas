  quote: ''
  summary: 'Commentarial notes on a Vedic hymn: the Anukramani assigns the opening
    verses to the Maruts and the rest to Indra Marutvat; Agastya is named as poet;
    the hymn is described as leading to a compromise between the Maruts and Indra.
    Further notes discuss the Maruts blessing worshippers, debated interpretations
    of tree, forest, lance, and wooden Soma-vessel imagery, the Manas as people of
    Manya, and a possible translation involving protection from a stronger one.'
