canonical_text:
  quote: ''
  summary: The passage discusses the Maruts as deities, notes dictionary usage of
    Marut as a synonym for god, and reviews competing etymologies of the name. The
    author favors deriving Marut from a root meaning to grind, crush, or pound, and
    interprets the original conception of the Maruts as destructive storms.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Maruts are said to obtain a kind of supremacy and to be invoked by themselves
    as though no other gods were present.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says later native dictionaries give Marut as a synonym of deva,
    or god in general, and also notes Maru in Pali.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The hymns addressed to the Maruts are presented as especially useful for observing
    successive stages in the development of so-called deities, with uncertainty about
    the etymology of Marut named as a drawback.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author states that a deity's etymology is the best key to its original
    intention, using Zeus as Dyaus, the bright sky, and Ceres as Sarad, harvest, as
    examples.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The author derives Marut from a root meaning grinding, crushing, or pounding
    and says there is no objection to this etymology on phonetic or semantic grounds.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports Professor Kuhn's alternative derivation from a root meaning
    to die, with the Maruts conceived as souls of the departed and later as ghosts,
    spirits, winds, and storms; the author says this has no support from the Veda.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage reports another proposed derivation from a root meaning to shine
    and rejects it, adding that lightning is only a subordinate feature of the Maruts'
    character.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The author maintains that the original conception of the Maruts was as crushing,
    smashing, striking, tearing, destroying storms.
  category: attribute
  evidence_refs:
  - ev:7
