canonical_text:
  quote: ''
  summary: A scholarly note assembles Rig-vedic passages about Aditi as invoked for
    forgiveness, protection, light, wealth, health, food, cattle, offspring, and guiltlessness;
    lists her epithets; then distinguishes this Rig-vedic evidence from later Atharva-vedic
    and other Vedic material where Aditi is identified with cosmic and social totalities.
    The note also discusses passages where aditi functions as an adjective meaning
    unbounded or free, especially with Dyu, the sky.
  language: English
