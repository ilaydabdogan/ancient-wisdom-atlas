canonical_text:
  quote: In all these passages we must translate mada-fyut by bringing delight, showering
    down delight.
  summary: The note surveys the Vedic epithet mada-fyut as applied to Indra, Indra's
    horses, the Asvins, Soma, and wealth asked from the Maruts, glossing it as delight-bringing.
    It considers whether a phrase in I, 85, 7 refers to Indra or Soma, and contrasts
    a possible battle reading with the common image of the Maruts coming to sacrifice
    like birds to eat offerings.
