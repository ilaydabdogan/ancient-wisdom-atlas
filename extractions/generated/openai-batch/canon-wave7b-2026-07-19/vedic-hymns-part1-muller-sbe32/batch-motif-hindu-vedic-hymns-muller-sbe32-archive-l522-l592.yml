canonical_text:
  quote: ''
  summary: The passage is a philological note on Rig-vedic sushma and arfanti. It
    argues that sushma is etymologically related to breath but often means strength,
    prowess, or vigour; cites biblical breath/blast passages as parallels for breath
    as force; proposes that the Maruts proclaim their strength by breathing or howling;
    and quotes German renderings of verses about the Maruts being summoned to sacrifice
    and Indra driving alone.
  language: English with Sanskrit, German, and French quoted terms
  quote_policy: summarized
