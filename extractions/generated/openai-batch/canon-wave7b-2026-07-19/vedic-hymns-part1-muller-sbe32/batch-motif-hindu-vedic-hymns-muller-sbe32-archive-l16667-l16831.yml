canonical_text:
  quote: ''
  summary: Philological and interpretive notes on Rig-veda I, 165, especially verses
    9-11. The notes discuss meanings of terms for being unshaken or conceded, the
    usage of devata, a formula covering those born and being born, and the dramatic
    relation between Indra and the Maruts, including rebuff, praise, and supposed
    reconciliation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note discusses anutta as possibly meaning not shaken or unshakeable, and
    compares this with Vedic phrases about shaking what is unshakeable.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cited Vedic example describes a lone figure killing irresistible enemies
    with a thunderbolt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Indra is described in cited passages as not yielding or not surrendering,
    and the note prefers the sense of irresistible fury for dnutta-manyu.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The note says devata does not occur in the ordinary sense of deity in the
    Rig-veda; in cited cases it is explained as godhead, divine power, sacrifice,
    or a local adverb meaning among the gods.
  category: other
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: 'The lexical examples place divine or cosmic classes in relation to power:
    one is pre-eminent among the gods by strength, one knows the place among the gods,
    and the end of power is not reached by gods, mortals, or waters.'
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The note states that, to comprehend all beings, the Hindu expression speaks
    of those who are born and those who are being born; a cited Pavamani passage mentions
    sin in the womb, in being born, in the born, and in the growing.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The note on verse 10 glosses the speaker as saying that almighty power belongs
    to him and that he can dare and do according to his will.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The note on verse 11 says Indra declined the friendship of the Maruts, was
    touched by their words of praise after his rebuff, and may be supposed to have
    completed reconciliation with them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The final words of verse 11 are interpreted as referring to a hymn made by
    the Maruts for their own benefit and by their own exertions.
  category: object
  evidence_refs:
  - ev:8
