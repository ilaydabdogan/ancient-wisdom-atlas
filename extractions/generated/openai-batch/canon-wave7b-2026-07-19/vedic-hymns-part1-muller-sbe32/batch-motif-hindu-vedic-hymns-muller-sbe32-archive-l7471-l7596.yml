canonical_text:
  quote: ''
  summary: The passage is a philological note on uses of arusha/arushi in Rig-vedic
    passages. It distinguishes adjectival uses such as red or ruddy from substantive
    or name-like uses. It discusses Agni as red, brilliant, child of the sky, son
    of strength, and beacon of sacrifice, while rejecting several translations that
    make Agni himself a red horse. It also notes red birds associated with the Asvins,
    red or ruddy cows of the dawn, red companies identified with the Maruts, and passages
    involving Rudra, the thunderbolt, or a red cloud.
  language: English
  quote_policy: summarized
