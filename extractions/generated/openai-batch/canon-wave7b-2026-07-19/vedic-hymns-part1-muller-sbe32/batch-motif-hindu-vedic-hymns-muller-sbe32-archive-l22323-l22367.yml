canonical_text:
  quote: ''
  summary: Scholarly notes discuss obscure Vedic phrases and conjectural readings.
    One note treats an obscure phrase involving Vishnu and Soma. Another describes
    the Dasagvas as an old priestly family like the Angiras, possibly with divine
    prototypes or ancestors, and asks whether they might be identified with the Maruts.
    The note says the Dasagvas were the first to carry on sacrifice and were asked
    to rouse men at daybreak, while the Maruts are connected with dawn, morning storms,
    and the imagery of darkness being chased away by sun-brightness. Dyaus is mentioned
    as father of the Maruts.
