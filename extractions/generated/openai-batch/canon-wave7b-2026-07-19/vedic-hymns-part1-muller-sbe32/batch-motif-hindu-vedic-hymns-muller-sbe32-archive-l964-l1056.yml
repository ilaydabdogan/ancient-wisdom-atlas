  summary: The passage discusses uncertainty about the chronology and textual history
    of Vedic hymns, then explains why the translator began with hymns to the Maruts.
    It describes the Maruts as storm-gods associated with wind, storms, lightning,
    thunder, rain, chariots, thunderbolts, clouds, kinship with Rudra and Pyvzsni,
    association and conflict with Indra, and claims to praise and sacrifice.
