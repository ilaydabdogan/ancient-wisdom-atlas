  summary: Editorial notes on Vedic Hymn I, 64 discuss terms for night and day; an
    epithet of Indra as lighter of nights and parent of the sun; a comparison of Ahimanyu
    with Angra-mainyu; Rodasi as heaven and earth and as a companion of the Maruts;
    meanings of amati, khadi, and vanin; and translations depicting the Maruts as
    rain-augmenting, cloud-driving figures with golden wheels, sacrifices, and shining
    weapons.
