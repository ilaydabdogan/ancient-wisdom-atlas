canonical_text:
  quote: Aditi, the Infinite.
  summary: The note explains the term datra as bounty in relation to the Maruts and
    the realm of Aditi, distinguishes another use meaning sickle, and then discusses
    Aditi as the unbounded Infinite, mother or source of gods, nurse of Varuna and
    Mitra, and a figure who can also produce a hymn for Indra. It closes by associating
    early conceptions of the Infinite with the far East, dawn, sun, day, and life.
  language: English
  quote_policy: quoted
