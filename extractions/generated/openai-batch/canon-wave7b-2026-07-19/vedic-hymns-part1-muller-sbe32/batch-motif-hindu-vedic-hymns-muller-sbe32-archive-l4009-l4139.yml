  summary: 'A preface passage discusses Vedic phonology and scansion: final e and
    o may be treated as anceps, initial short a after final e or o is often not elided,
    and Pāṇini and Śākalya are cited for rules concerning unchanged or shortened final
    vowels before other vowels. The passage gives grammatical authorities and Rigvedic
    examples rather than a mythic narrative.'
