canonical_text:
  quote: ''
  summary: The passage is a set of notes on RV VIII, 20. It discusses a conjectural
    parallel between a custom attributed by Herodotus to the Thracians—shooting arrows
    at the sky during thunder and lightning—and the Sobharis said to shoot an arrow
    at a golden chest or treasure on the chariot of the Maruts. The commentator considers
    whether the action aimed to drive away clouds or compel them to give rain as treasure,
    while noting philological objections. Other notes address readings and meanings
    in verses 9, 13, 14, 17, 18, 20, and the start of 21, including worship, name,
    and calling for assistance.
