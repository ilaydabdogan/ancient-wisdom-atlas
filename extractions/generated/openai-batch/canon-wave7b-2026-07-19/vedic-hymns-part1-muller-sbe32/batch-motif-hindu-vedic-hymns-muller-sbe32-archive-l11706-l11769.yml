canonical_text:
  quote: ''
  summary: The passage praises the Maruts as mighty, swift, brilliant, animal-like
    in sound and anger, armed with lightning, spears, arrows, chariots, and golden
    wheels. They stir clouds and rain, shake firm things, and are invoked as offspring
    of Rudra. The hymn says the mortal protected by them gains strength, booty, treasures,
    wisdom, and prosperity, and it asks the Maruts to grant battle-strength, wealth,
    and long flourishing to the speaker's community.
  language: English
  quote_policy: summarized
