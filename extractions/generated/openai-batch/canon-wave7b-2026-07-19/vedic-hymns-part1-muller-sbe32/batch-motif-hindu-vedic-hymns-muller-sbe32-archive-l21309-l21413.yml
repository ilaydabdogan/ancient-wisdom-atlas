  quote: ''
  summary: Philological notes on Rig-Veda I,168 discuss the Maruts as Soma-like in
    refreshing and invigorating power, explain a shoulder-slung weapon image, analyze
    jaws-and-tongue wording, describe the Maruts as self-born and self-determined
    movers without horses or chariots, and interpret verse 7 as portraying Marut onslaught,
    rain-giving, storm, lightning, and laughing lightning imagery.
  language: English
  quote_policy: summarized
