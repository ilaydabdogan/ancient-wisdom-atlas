  quote: ''
  summary: Philological notes discuss the Vedic verb pad as moving from the sense
    of going to the sense of perishing, including maledictory uses and a suggested
    translation involving Nirrsti. A note on verse 7 evaluates explanations of avatam/avata
    in relation to the Maruts, storm gods and sons of Rudra, and to rain, cloud, rivers,
    Ushas, and Soma.
