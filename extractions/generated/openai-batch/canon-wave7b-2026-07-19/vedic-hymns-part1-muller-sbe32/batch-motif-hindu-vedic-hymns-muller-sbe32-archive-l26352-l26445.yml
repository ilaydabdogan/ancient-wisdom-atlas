canonical_text:
  quote: ''
  summary: Scholarly notes discuss interpretations of Rig-veda VIII, 7, especially
    storm imagery involving the Maruts, possible meanings of terms connected with
    sacrifice and Soma, an Atharva-veda variant, and the difficult interpretation
    of Sushoma, Saryavavat, Argika, and Pastyavat as either geographic localities
    or sacrificial vessels. The note surveys other Rig-veda passages in which Saryazavat/Saryavavat
    is associated with Indra, Soma, mountains or clouds, rivers, and a lake or holy
    place.
  language: English
  quote_policy: summarized
