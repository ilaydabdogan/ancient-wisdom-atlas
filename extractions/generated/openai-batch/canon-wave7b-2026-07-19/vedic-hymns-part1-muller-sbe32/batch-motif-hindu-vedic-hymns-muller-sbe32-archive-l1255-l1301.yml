  quote: ''
  summary: A preface signed by F. Max Muller at Oxford reflects on his long editorial
    and translation work on the Rig-veda, describes the attraction of deciphering
    ancient Vedic hymns, outlines philological methods for interpreting the text,
    and explains his choice to publish the text and commentary rather than only interpretive
    results.
