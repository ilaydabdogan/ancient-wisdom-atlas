canonical_text:
  quote: ''
  summary: The passage gives translations and notes for two Vedic verses. In Verse
    7, primordial waters pervade the universe, contain an embryo, generate fire, and
    from them arises the single life-spirit of the gods. The note interprets these
    as creation waters, compares them with other Vedic and Brahmana descriptions of
    an initial cosmic sea, and mentions a golden-covered embryo and sunrise as an
    image of creation. In Verse 8, a supreme god beholds the waters, which contain
    power and generate sacrifice, and the refrain asks to what god an oblation should
    be offered.
