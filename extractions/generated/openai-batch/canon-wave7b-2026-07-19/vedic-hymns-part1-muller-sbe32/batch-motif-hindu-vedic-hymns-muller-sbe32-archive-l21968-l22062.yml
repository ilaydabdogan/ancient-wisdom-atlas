canonical_text:
  quote: ''
  summary: 'This notes section discusses proposed interpretations for RV II, 34: clouds
    and storm-wind language, cows as waters in clouds, the Maruts'' golden equipment
    and possible spear-lightning imagery, the relation of Maruts to lightning and
    rain by analogy with Agni and fire, the parentage and debated birth-language involving
    Rudra and Prisni, and brief notes on washing horses and cloud hollows.'
  language: English with Sanskrit transliterations
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The commentary says dham is used for blowing away clouds and darkness, and
    that the cows would then be the waters in the clouds.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The commentary says “golden-breasted” means armed with golden chest-plates
    and compares the Maruts with brilliant khadis to the heavens with brilliant stars.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentary says the Maruts are not themselves lightning and rain but are
    seen in them, and compares this to Agni being present in fire or being the god
    of fire.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A proposed emendation would translate the Maruts' spears as shining like lightnings
    from the clouds; the note also says spears are mentioned alongside khadi and rukma
    in cited RV passages.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The commentary states that the Maruts are represented as sons of Rudra and
    sons of Prisni, and are called Prisni-matarah.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The commentary says the Maruts' birth is sometimes spoken of as unknown, though
    hardly as mysterious, and compares this to not knowing whence the wind comes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Prisni as a feminine figure is identified in the note with the speckled sky;
    the cloud may have been conceived as an udder while Prisni was conceived as a
    cow.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The note discusses translations in which Rudra either had begotten the Maruts
    in the bright lap of Prisni or was himself born in the bright udder of Prisni.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A cited passage is interpreted as saying that Prisni conceived the germ, identified
    parenthetically as the Maruts, for the strong one.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The note explains ukshante as washing horses before a new race, while also
    reporting another view that it refers to washing after a race.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Sayaza's explanation of nadasya karnaih is summarized as “through the hollows
    of the cloud,” though the note calls the phrase difficult.
  category: setting
  evidence_refs:
  - ev:10
