canonical_text:
  quote: May the weapon of Rudra avoid us, may the great anger of the flaring one
    pass us by.
  summary: Verses 7-15 address Rudra with praise and supplication. The speaker asks
    for Rudra's healing hand, celebrates his fierce and radiant power, acknowledges
    his weapons and strength, requests medicines and beneficence from Rudra and the
    Maruts, and prays that Rudra's weapon, anger, bows, and armies spare the worshippers
    and their kin.
  language: English
  quote_policy: quoted
