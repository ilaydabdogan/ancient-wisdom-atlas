canonical_text:
  quote: ''
  summary: The hymn praises the Maruts as powerful, ever-young storm-gods who drive
    with horses and chariots, roar, bear ornaments or weapons, dispense treasures,
    stir rain, accept a lit fire, create or bestow human kings and warriors, and bring
    storm-rain that opens the earth and is compared to a husband’s germ. The hymn
    closes by asking the immortal, mountain-dwelling Maruts to be gracious and listen.
  language: English
  quote_policy: summarized
