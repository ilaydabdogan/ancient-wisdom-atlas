literal_observations:
- id: obs:1
  text: The note asks whether asmān refers to the sacrificers or to the Maruts, and
    says the verb would fit the hymn of Manya if that hymn is understood as intended
    to bring the Maruts to the sacrifice.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Under one proposed reading, asmān refers to those who offer the sacrifice,
    who are distinguished from the poet Mandarya Manya, employed by them to compose
    or recite the hymn.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note suggests that Mandarya Manya's hymn may end with verse 13, or that
    only the dialogue from verses 3 to 12 was Manya's work and the rest was added
    on a solemn occasion.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The note explains duvas in Vedic usage as worship or sacrifice and says duvasyati
    can mean to worship.
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
