  quote: ''
  summary: A philological note on Rig-Vedic hymn I, 165 discusses difficult translation
    issues, the possible referent of asmān, the Maruts, the sacrificers, the poet
    Mandarya Manya, possible divisions of the hymn, and the meanings of duvas/duvasyati
    as worship, sacrifice, helping, or providing. It cites Vedic examples involving
    worship of Gatavedas/Agni, the gods, a god worshiped with praises, song, hymns,
    or feast, and a person who has poured out Soma and worships.
  language: English with transliterated Sanskrit terms
