  quote: ''
  summary: Scholarly notes on a Vedic hymn ascribed to Bharadvaga Barhaspatya. The
    notes discuss translation problems involving dhenu as both cow and cloud, Prishni
    as mother of the Maruts, golden chariots, the Maruts as born or milked from Prishni's
    udder, the joining of heaven and earth by thunderstorm clouds, Rudra's son or
    offspring, and a comparison of the fierce Maruts to waters from a mountain.
