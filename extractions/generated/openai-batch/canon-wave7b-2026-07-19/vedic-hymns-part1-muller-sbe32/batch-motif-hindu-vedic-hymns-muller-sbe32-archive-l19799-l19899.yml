canonical_text:
  quote: Who will give us back to the great Aditi, that I may see father and mother?
  summary: Scholarly notes discuss Aditi as an all-encompassing Vedic figure, possible
    but uncertain meanings of Aditi as afterlife, earth, liberty, or goddess of freedom,
    the contrast between Aditi and Diti, Diti's later epic and Puranic characterization,
    and Aditi's moral role in delivering from sin conceived as a bond or chain.
  language: English with transliterated Sanskrit citations
  quote_policy: quoted
