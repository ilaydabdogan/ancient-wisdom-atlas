canonical_text:
  quote: ''
  summary: The note discusses a philological correction involving Rodasi, then interprets
    Rodasi as lightning and Vak or voice as thunder in relation to the Maruts. It
    cites descriptions of Vak as born in waters or clouds, filling heaven and earth,
    stretching a bow for Rudra, and moving between heaven and earth like a messenger.
    It also treats thunder as a public companion or speaker at assemblies, contrasted
    with lightning as a hidden house-wife, and adds comments on Vedic assembly terms
    and a separate note on a spear drawn back before being hurled.
  language: English
  quote_policy: summarized
