canonical_text:
  quote: ''
  summary: A philological note on Rig-Vedic hymn I, 88, 4 discusses possible meanings
    of words in the line, especially whether a term meaning hawk could vocatively
    address the Maruts. It notes hawk imagery for the Maruts, uncertainty over a word
    possibly naming a sacred Gotama hymn, the rain-object of the hymn to the Maruts,
    Gotama devotion to the Maruts, animal imagery of wild boars with iron tusks, the
    image of a cloud as a covered well yielding rain, and a subsequent note that yogana
    commonly means chariot.
  language: English, with transliterated Sanskrit terms
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note argues that if ahani is taken as the subject, the hawk term would
    be a vocative intended for the Maruts; it adds that syena, especially a strong
    hawk, is a common simile for the Maruts and is also used as one of their names.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A cited Vedic passage is translated as hawks plucking each other with beaks,
    rushing like the wind, and striving together.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The note states that a verbal form may derive either from a root meaning to
    sing or from a root meaning to go, and gives examples translated as poets singing
    and cows approaching.
  category: other
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says the hymn is addressed to the Maruts and that its object is
