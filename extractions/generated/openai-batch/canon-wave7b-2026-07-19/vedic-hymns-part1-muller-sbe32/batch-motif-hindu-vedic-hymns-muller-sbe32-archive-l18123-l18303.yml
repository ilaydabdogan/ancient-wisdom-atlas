canonical_text:
  quote: ''
  summary: Philological notes survey the meanings of sudhita, barhavza, and alatvzzasah
    in cited Vedic passages. The examples include well-placed offerings to Vasu, secure
    life and dwelling, well-held or well-aimed weapons used in conflict, prayers and
    goods of Agni, Indra and Brzhaspati striking hostile beings, a club scattering
    spears, and debated explanations of a word as a water-bearing cloud or as applicable
    to the Maruts and the demon Bala.
  language: English
  quote_policy: summarized
