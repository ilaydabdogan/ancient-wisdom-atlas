    enemy, perhaps a stone block or heavy club.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The cited examples include Indra being addressed to pound the fearful Pisazi
    and strike down every Rakshas, and Brzhaspati being asked to strike down scoffers
    of the gods.
  category: action
  evidence_refs:
  - ev:6
