    and another passage glossed as well-placed offerings.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says that when sudhita is applied to life it may mean well established
    or safe, citing happy long lives of forefathers and a man dwelling securely in
    his own house.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note says that when sudhita is applied to a missile weapon it can mean
    well held, well levelled, or well aimed, and cites a spear and Indra striking
    enemies with well-aimed weapons.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note says that when sudhita is applied to a poem or prayer it means well
