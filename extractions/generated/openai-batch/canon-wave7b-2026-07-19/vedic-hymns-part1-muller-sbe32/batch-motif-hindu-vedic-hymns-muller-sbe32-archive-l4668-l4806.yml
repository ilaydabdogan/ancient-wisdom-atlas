  text: The author derives Trishtubh and Anushtubh from a root connected with stamping,
    striking, shaking, or making firm, rather than from a root meaning praise.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The author interprets Trishtubh as a three-step because three final syllables
    were, in his view, audibly stamped at the end of each turn or strophe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The author interprets Anushtubh as an after-step because each line was stamped
    regularly after the other, possibly by alternating choruses.
  category: action
  evidence_refs:
  - ev:2
