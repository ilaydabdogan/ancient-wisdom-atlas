canonical_text:
  quote: ''
  summary: A short hymn addresses the Maruts as storm-gods and bounteous givers. It
    asks that their march be brilliant through their protection, likens their shining
    to snakes, asks that their shaft and hurled stone be far away, and petitions them
    to spare the people of Trznaskanda and lift the speaker's group up so they may
    live. The notes ascribe the hymn to Agastya, identify the metre as Gayatri, state
    that the verses do not occur in several named Vedic collections, and mention textual
    conjectures for verse 1.
  language: English
  quote_policy: summarized
