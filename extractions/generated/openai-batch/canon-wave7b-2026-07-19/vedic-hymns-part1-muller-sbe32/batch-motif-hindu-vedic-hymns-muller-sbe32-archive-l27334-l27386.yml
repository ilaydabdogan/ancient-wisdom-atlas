literal_observations:
- id: obs:1
  text: The notes ascribe the hymn to Kavva Ghaura and state that it is addressed
    to Rudra in verses 1, 2, and 4-6, to Rudra and Mitra-Varuzau in verse 3, and to
    Soma in verses 7-9.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes say the hymn may be divided into two parts, verses 1-6 and 7-9,
    while reporting that Bergaigne preferred division into three hymns.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: For verse 2, Ludwig and Hillebrandt are reported as taking Aditi here as a
    name of Rudra.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: For verse 3, the expression visve sagdeshasah is said to follow on Rudra and
    is identified as probably referring to the Maruts, though it may also have meant
    all the gods together.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: For verse 4, gathapatim and medhapatim are described as difficult terms; medhapati
    is derived from medha, glossed as animal sacrifice.
  category: other
  evidence_refs:
  - ev:5
- id: obs:6
  text: The note says gathapati might, under a doubtful Zend comparison, be ritupati,
    a name of Agni, but calls this extremely doubtful.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: Galasha-bheshagam is described as an epithet of Rudra; related cited passages
    apply galasha wording to Rudra's arm and to Rudra himself, and Galasha is said
    to seem connected with gala, water.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: Verse 2 is cross-referenced to TS III, 4, 11, 2 and MS. TV; 12, 6.
  category: relationship
  evidence_refs:
  - ev:7
