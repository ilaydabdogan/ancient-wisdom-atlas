  summary: A philological note argues that the Vedic word sumati should often be translated
    as prayer, giving examples involving Sarasvati, Sakuni, Indra, Soma, and the Asvins.
    It also states that the phrase su-matim pipartana corresponds to fulfilling a
    desire, and then begins a note on the difficult word kriviz-datt, citing Yaska
    and Professor Roth.
