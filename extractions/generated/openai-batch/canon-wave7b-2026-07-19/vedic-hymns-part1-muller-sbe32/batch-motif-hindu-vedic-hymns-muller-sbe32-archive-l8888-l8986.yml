canonical_text:
  quote: ''
  summary: 'A philological note discusses Vedic descriptions of cosmic regions: heaven,
    sea, earth, sky, rivers, lights, welkins, and repeated threefold divisions. It
    cites hymnic passages involving an invoked killer of Vvztra, the Maruts, Adityas,
    Mitra and Varuza, Savita, Indra, Surekoatt, Vishzu, and a possible sacrificer’s
    invocation. The note emphasizes uncertainty about the exact meanings and divisions
    of terms such as rokana, dyu, ragas, and parthiva.'
  language: English
  quote_policy: summarized
