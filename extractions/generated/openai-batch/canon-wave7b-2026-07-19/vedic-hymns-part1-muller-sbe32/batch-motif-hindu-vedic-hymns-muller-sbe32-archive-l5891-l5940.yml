  quote: ''
  summary: The passage is a philological discussion of Vedic metre. It reports Professor
    Bollensen’s proposal to alter spellings where two syllables may metrically count
    as one, rejects such alteration as unnecessary, and argues that quick pronunciation,
    called synizesis in Greek grammatical terminology, can explain cases such as iva.
    The author distinguishes synizesis from vowel contraction, suggests that ancient
    Rishis used this metrical expedient frequently, and compares the phenomenon with
    Greek and Latin forms.
  language: English, with Sanskrit, Greek, and Latin examples
  quote_policy: summarized
