canonical_text:
  quote: ''
  summary: The passage is a philological discussion of Vedic recitation and meter.
    It argues that the Pratishakhya preserves the authorized Samhita text while allowing
    limited pronunciation adjustments, rejects an artificial extension proposed by
    a commentator, discusses examples where syllable counts require lengthening or
    treating long vowels and diphthongs as short, and compares this prosodic flexibility
    with Pali and Prakrit usage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says the authors of the Pratishakhya would not alter the authorized
    Samhita, but recognized that contracted vowels could be pronounced as two and
    that certain semivowels could be pronounced either as semivowels or with their
    corresponding vowel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that the Pratishakhya does not clearly allow more than
    two pronunciation modifications, while a commentator tries to argue for a third
    modification involving vocalization of semivowels within a word.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage treats the commentator's third modification as artificial and
    says independent semivowels, such as the v in parva, are not included under the
    cited rule.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A footnote says that Uvata, as represented in the passage's OCR variants,
    did not think of making two syllables out of go, and that M. Regnier is judged
    right while Professor Kuhn is judged wrong on that point.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says no explicit Pratishakhya rule is found for protracting long
    vowels that do not originate from coalesced vowels, but that such protraction
    seems to be presupposed by syllable counts assigned to cited verses.
  category: other
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage cites Sitra 937 as treating RV X, 134, 1 as a Mahapankti of six
    eight-syllable padas, requiring a particular reading to obtain the required syllable
    number.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The first-person author concludes that, without changing the received Samhita
    text, the Pratishakhya allows lengthened pronunciation in some cases and may be
    extended to other cases needed for Vedic meter.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage introduces a second argument that those who constituted the Vedic
    text current in ancient schools knew that some long vowels and diphthongs could
    be used as short.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage gives examples in which na or no is treated as a short syllable
    for metrical lengthening rules in hendecasyllabic and dodecasyllabic verses.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The passage gives an example where e is shortened before short a, with the
    Samhita giving a where e might be expected.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage compares Vedic treatment of e and o with Pali and Prakrit, where
    final o and e can be treated as either long or short, while warning not to extend
    the observation too far.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage quotes RV I, 84, 17 as a Samhita example in which e and o can
    be used in both long and short ways in the same verse.
  category: other
  evidence_refs:
  - ev:9
