canonical_text:
  quote: ''
  summary: The passage is a set of notes and cited Vedic parallels concerning divine
    powers, especially those of Agni, Mitra and Varuna, the dawn, the Maruts, and
    Indra. It explains that Indra is represented as claiming his deeds for himself,
    rejecting or denying Marut assistance, wanting to act alone as in a former battle
    with Ahi, and claiming the killing of Vritra, who withheld the waters, and the
    release of those waters for Manu or humankind.
  language: English
  quote_policy: summarized
