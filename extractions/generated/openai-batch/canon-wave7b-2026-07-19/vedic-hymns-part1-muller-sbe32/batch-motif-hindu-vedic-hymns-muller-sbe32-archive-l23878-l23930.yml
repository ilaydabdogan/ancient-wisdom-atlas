  summary: Two translated verses from Mandala V, Hymn 57 address the Maruts. The speakers
    credit the Maruts with giving wealth in cows, horses, chariots, heroes, and gold,
    and ask them for praise, divine protection, and graciousness. The Maruts are described
    as men of Rudra, heroes, bountiful, immortal, righteous, attentive, poets, young,
    mountain-dwelling, and mighty. The appended notes provide metrical and textual
    information and explain the mountain-related wording in verse 8.
