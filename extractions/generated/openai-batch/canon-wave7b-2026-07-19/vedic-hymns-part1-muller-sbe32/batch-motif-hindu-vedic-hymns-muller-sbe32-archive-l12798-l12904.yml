  quote: ''
  summary: 'Commentary notes on Rig Veda I,85 discuss the Maruts: a proposed rendering
    of a term as yoke-fellows or comrades; a simile comparing the Maruts to wives
    or females going forth in beauty; their description as sons of Rudra who promote
    earth and heaven and delight in sacrifices; an explanation of storms clearing
    dark clouds so earth and sky appear wider; and notes on the Maruts'' shared birth,
    growth, brightness, and equipment.'
