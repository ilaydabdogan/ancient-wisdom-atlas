- id: obs:5
  text: Abhog-ghanah is explained as slayers of the demon or slayers of clouds, with
    Abhog interpreted as a rainless cloud and compared to Namuci, another demon killed
    by Indra.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: A cloud that sends rain is called bhugman, and the cited simile compares giving
    to a feeding cloud showering gifts on worshippers.
