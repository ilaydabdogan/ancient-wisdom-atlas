canonical_text:
  quote: ''
  summary: Philological notes on Rig-veda I, 64 discuss Rudra, the Maruts, Dyu, terms
    for young males and strong beings, the interpretation of cloud- or demon-slaying
    epithets, Marut ornaments and weapons, and the meaning of sudanavah as bounteous
    or rain-associated divine giving.
  language: English
  quote_policy: summarized
