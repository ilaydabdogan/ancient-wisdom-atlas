  quote: ''
  summary: A hymn addressed chiefly to the Maruts asks them to accept adoration and
    praise, set aside anger, and unharness their horses. The speaker asks the Maruts
    and Indra for grace, valor, glory, protection, victory, an invigorating autumn,
    and quickening rain, while also expressing fear of Indra and asking forgiveness
    regarding offerings that had been prepared and put away.
