canonical_text:
  quote: ''
  summary: 'A hymn to the Maruts praises them as storm-gods: armed, radiant, strong,
    born together, moving triumphantly with horses and chariots, bringing rain from
    the sea, scattering enemies, moving unhindered through the cosmos, recognizing
    praise, and being petitioned for mercy, protection, wealth, and acceptance of
    an offering.'
  language: English
  quote_policy: summarized
