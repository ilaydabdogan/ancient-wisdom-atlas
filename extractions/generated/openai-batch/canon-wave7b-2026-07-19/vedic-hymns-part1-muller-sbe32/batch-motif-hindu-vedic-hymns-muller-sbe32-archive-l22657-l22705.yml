canonical_text:
  quote: ''
  summary: 'Excerpt from Mandala V, Hymn 52 invoking the Maruts: the passage describes
    their chariot power, their watching at sacrifice, their brilliant appearance,
    shouting dancers moving toward a well or cloud, instructions to a seer to worship
    and approach them for a gift, their reception of offerings and praise, their kinship
    through Prsni and Rudra, and the bestowal of wealth in cows and horses on the
    Yamuna.'
  language: English
  quote_policy: summarized
