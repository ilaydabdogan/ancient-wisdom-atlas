  quote: ''
  summary: Scholarly notes discuss Sanskrit forms connected with prayer, work, sacrificial
    work, ceremonial worship, and praise. The passage cites a mortal who toils for
    a liberal god with prayer, says the Rzbhus/Azbhus and others acquired immortality
    by works, and interprets the Maruts as gaining sacred names, divine character,
    splendour, worshippers, and a place among the gods after joining Indra in his
    work. Cited translations depict the Maruts with light, rays, rain, praise, sacrificial
    food, fearlessness, and storminess. The passage also includes philological comparisons
    with Greek terms.
