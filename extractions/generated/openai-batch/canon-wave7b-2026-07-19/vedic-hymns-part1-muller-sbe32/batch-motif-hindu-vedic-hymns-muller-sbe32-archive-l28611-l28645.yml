canonical_text:
  quote: ''
  summary: The passage is a hymn to Vata. It describes the greatness of Vata’s chariot,
    whose roar crashes and thunders while moving through the sky and stirring red
    sheens or dust. Gusts of Vata rise and go toward him, and the god travels with
    them on the same chariot as king of the world. Vata moves along sky paths without
    rest, is called friend of the waters, first-born, and holy. He is also called
    the breath of the gods and germ of the world; his roars are heard but his form
    is not seen, and the hymn calls for sacrifice to him.
  language: English
  quote_policy: summarized
