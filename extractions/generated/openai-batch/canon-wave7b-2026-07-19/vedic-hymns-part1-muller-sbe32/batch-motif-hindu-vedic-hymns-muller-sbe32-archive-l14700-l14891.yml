canonical_text:
  quote: ''
  summary: Philological notes argue that the Vedic term subhé in several cited passages
    should be understood as triumph, glory, victory, or conquest. The examples repeatedly
    mention the Maruts harnessing chariots, deer, or horses, moving toward conquest,
    fighting for glory, and being associated with thunder and lightning. The notes
    also mention Indra going with the Maruts to glory, the Asvins bringing glory and
    driving a morning chariot, Pushan's goats as draft animals, Soma-juice inspiring
    the poet with eloquence, the term rṇa-yavan as connected with debt or sin, and
    sami as work or toil connected with battlefield and sacrifice.
  language: English
  quote_policy: summarized
