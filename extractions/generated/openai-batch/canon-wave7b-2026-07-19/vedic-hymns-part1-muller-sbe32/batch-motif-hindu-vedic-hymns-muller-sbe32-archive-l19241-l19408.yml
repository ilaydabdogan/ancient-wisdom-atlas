canonical_text:
  quote: Daksha was born of Aditi, and Aditi from Daksha.
  summary: The note gathers Vedic passages invoking Aditi and the Adityas for protection
    and happiness, then discusses Aditi as the Infinite and Daksha as power. It cites
    verses in which Daksha and Aditi are born from one another, Aditi nurses Mitra
    and Varuna, Being and Not-being are located in the highest heaven in Aditi's lap
    and Daksha's birthplace, and a theogonic sequence describes Being arising from
    Not-being, followed by regions, Uttanapada, Earth, Daksha, and Aditi.
  language: English with Sanskrit transliteration
  quote_policy: quoted
