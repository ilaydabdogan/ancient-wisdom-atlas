  quote: ''
  summary: A hymn to the Maruts invokes prayers to great Vishzu accompanied by the
    Maruts, describes the Maruts as powerful, unapproachable, roaring, chariot-riding,
    and fire-like, describes wide-striding Vishzu moving with them, and asks the Maruts/Rudras
    to come to the sacrifice, hear the call, help, and protect against enemies and
    hateful things.
