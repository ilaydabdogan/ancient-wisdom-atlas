canonical_text:
  quote: ''
  summary: A philological note discusses the Vedic word vrishan as an epithet or designation
    that may refer to several deities, including the Maruts, Indra, Agni, Mitra and
    Varuna, and Soma. The note gives hymn examples involving Indra and Ushas, Agni
    as morning light, Soma pressed by stones, and sacrificial continuity across generations.
  language: English with transliterated Sanskrit and OCR variants
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Maruts are described as sons of Rudra and as a host called strong or manly;
    the note says they are called vrishan.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note states that when vrishan occurs by itself in the Veda, its referent
    may be doubtful and may be Indra, Soma, the Maruts, or another deity.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: In one cited passage, Ushas goes away from a broken chariot because she fears
    the hero will do violence to her; the note identifies the hero as Indra trying
    to conquer Ushas.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: In another cited passage, Soma is poured out for a strong bull or hero whose
    context the note identifies as Indra.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A cited verse describes a hero in the depth of heaven, yearning for the dawns,
    entering the great sky and the earth; the note says this hero may be Indra but
    is more likely Agni in that context.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The note says Agni may be called vrishan, and that dual and plural forms of
    the word can refer to Mitra, Varuna, and their companions.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Soma is described as a male or strong Soma bruised by males, explained as
    the Soma-plant pressed by stones; the stones are themselves likened to males.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage explains a prayer not to break cords that unite generations with
    the gods through sacrifice; the new generation offers Soma like its fathers, and
    Soma juice flows into a vessel when pressed by stones.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The note advises that adjectives and other contextual indications must guide
    the interpretation of vrishan, and gives an example where the subject may be Indra
    or Soma.
  category: other
  evidence_refs:
  - ev:9
