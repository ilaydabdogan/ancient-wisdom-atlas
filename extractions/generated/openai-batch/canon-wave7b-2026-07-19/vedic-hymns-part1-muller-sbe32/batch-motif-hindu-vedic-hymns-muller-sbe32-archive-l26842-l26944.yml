canonical_text:
  quote: ''
  summary: The passage contains editorial notes on verses concerning the Maruts, including
    their brotherhood, their comparison to oxen, and medicines associated with Rudra
    and the Maruts. It then gives Mandala VIII, Hymn 94.1-10, addressed to the Maruts,
    in which a cow called their mother sends milk, gods observe duties in her lap,
    singers invite the Maruts and other gods to drink Soma, Indra rejoices in pressed
    Soma mixed with milk, and the Maruts are invoked from heaven as powerful beings
    who spread out earth and the lights of heaven.
  language: English
  quote_policy: summarized
