canonical_text:
  quote: ''
  summary: Scholarly notes on Rigveda II, 34 discuss Narasamsa as a name or appellation
    of Indra, emend a cow-and-udder simile, interpret sacrificial drinking or carousing
    as possibly connected with Soma, explain terms for success, wisdom, rain, abundance,
    and wolfhood, and comment on an obscure verse involving the Maruts, Prishni, Trita,
    Vishnu, libations, and a brief comparison with Odin's titles.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note treats Nara-samsah or Narasamsa as a proper name or appellation referring
    to Indra, while also reporting Bergaigne's doubt and later appellative reading.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The translator rejects a reading that would compare filling a cow's udder
    to a mare and proposes a reading involving a barren or uncalved cow; related examples
    involve nourishing or filling a barren cow and fulfilling prayers.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note says apana may mean drinking or carousing and suggests that, if it
    refers to Soma drinking, the phrase can describe an exciting hymn in a sacrificial
    festival context.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note defines sani as acquiring, success, luck, or gain, and says it is
    often placed beside medha, wisdom.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The note says sudanu may be understood as bounteous, as having good rain,
    or as having good Soma, and defines pinvate as making swell or abound.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The note explains wolfhood as being treated as wolves or as a wolf would treat
    someone.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: The note proposes a possible contrast between the Maruts as friends milking
    the udder of Prishni, identified with the cloud, and the Maruts coming to blame
    those who fail or oppose them in sacrifice.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Trita is described as a friend of the Maruts whom they assist in battle, and
