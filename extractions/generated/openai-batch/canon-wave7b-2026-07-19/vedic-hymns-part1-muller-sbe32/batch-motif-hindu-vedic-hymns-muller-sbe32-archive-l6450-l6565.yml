canonical_text:
  quote: ''
  summary: 'The passage is a scholarly note on Rig-Veda X, 121, describing the hymn''s
    verse order and variant readings across Vedic collections, and stating that these
    variations show frequent sacrificial use. It then gives translations of the first
    two verses: Hirazyagarbha arises in the beginning, is born as the one lord of
    existing things, establishes earth and sky, and the refrain asks to what god an
    oblation should be offered. A note glosses Hirazyagarbha as the golden embryo,
    germ, child, or one born of a golden womb; it says the name was likely an attempt
    to name the sun and later became mythological, identifying the golden child with
    Prajapati dwelling in the golden egg. Verse 2 describes a deity who gives breath
    and strength, whose command even the gods reverence, and whose shadow is immortality
    and death.'
  language: English with Sanskrit transliteration and some German translation
