canonical_text:
  quote: ''
  summary: The passage first gives editorial notes identifying several Vedic place
    names as a lake, river, districts, countries, or peoples, and notes a possible
    Agnimaruta sacrificial context in which Agni is praised before the Maruts. It
    then opens Mandala VIII, Hymn 20, addressed to the Maruts or storm-gods, inviting
    them to come with food to the sacrifice. The verses describe the Maruts as sons
    of Rudra, givers of Soma or rain, powerful storm beings whose movement scatters
    clouds, affects heaven and earth, makes mountains and the earth resound or quiver,
    and is accompanied by light, weapons, and chariot imagery.
  language: English
  quote_policy: summarized
