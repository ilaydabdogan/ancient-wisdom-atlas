canonical_text:
  quote: ''
  summary: Commentary on Rig-veda I, 64, 7-8 discusses the Maruts, cloud and well
    imagery, independent storm-strength, elephants eating or crushing forests, the
    disputed term Aruzi/Aruvi interpreted either as ruddy cows or red flames/forest-fire,
    and lexical notes on deer and night/day expressions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Benfey is cited as saying that the Maruts make storm-driven clouds let water
    stream down.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says utsa, meaning well or spring, is again meant for cloud, while
    retaining the original sense of spring.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says that in Rig-veda V, 32, 2, wells shut up by the seasons are
    identified with the udder of the cloud.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Maruts are described through svatavas as possessing their own independent
    strength, and through sva-svrit as going by themselves or moving freely.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Mrvigah hastinah is explained as wild animals with a hand or trunk, taken
    to mean elephants.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The elephants are said to eat forests; the note says this may be understood
    as crushing, chewing, or eating.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The word Aruni/Aruvi is treated as difficult, and one rejected possibility
    connects Aruzis with the ruddy cows of dawn or Indra.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: The note proposes that aruzi is best taken here as red flames of fire or forest-fire,
    yielding the sense that the Storms assume vigour among flames and eat up forests
    like elephants.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: For verse 8, pisha is provisionally adopted as a name of deer, and kshapah
    is explained as an accusative plural used temporally in the sense of nights.
  category: other
  evidence_refs:
  - ev:8
