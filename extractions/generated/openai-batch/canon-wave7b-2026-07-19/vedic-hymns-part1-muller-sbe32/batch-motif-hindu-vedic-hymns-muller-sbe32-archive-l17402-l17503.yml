canonical_text:
  quote: ''
  summary: Scholarly notes on Rig-veda I, 166 explain ketu as sign, flag, herald,
    light, or splendour, preferring “herald” in this passage because the Maruts precede
    and announce Indra. The note discusses difficult comparison terms for torch/fire
    and battle/weapon, concludes that the Maruts’ torch is lightning and their weapon
    is the thunderbolt, and includes Wilson’s translation of the verse as a proclamation
    of the Maruts’ ancient greatness and vigorous advance toward sacrifice as if to
    battle.
  language: English
  quote_policy: summarized
