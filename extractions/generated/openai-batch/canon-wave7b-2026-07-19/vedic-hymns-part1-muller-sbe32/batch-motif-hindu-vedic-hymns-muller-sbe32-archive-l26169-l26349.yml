  summary: The passage gives the closing verses of a hymn to the Maruts and editorial
    notes. The verses describe hills and mountains lowering or bowing, horses flying
    through the air to bring the Maruts, the Maruts granting strength to a praising
    man, old fire being born in solar splendour, and the Maruts spreading with lights.
    The notes discuss Marut light in relation to the sun and morning, identify the
    Prishnis as clouds and mythologically Prishni as mother of the Maruts, and comment
    on three lakes of Madhu or rain poured by clouds, with a cited Atharva Veda parallel
    involving three vessels filled with milk and Soma.
