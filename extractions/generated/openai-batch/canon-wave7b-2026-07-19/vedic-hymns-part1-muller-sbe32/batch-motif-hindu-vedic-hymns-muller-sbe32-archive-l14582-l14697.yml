  summary: The passage is a philological note arguing that the Vedic term under discussion
    is better understood as “path” than “traveller,” with Rig-vedic parallels describing
    the Maruts seeing or going on their path, not being blocked by mountains or rivers,
    and having a blazing or fearful high path. It also cites waters going on their
    path, Indra sending waters forth, Marut chariots and possible buckets, Maruts
    harnessing clouds or chariots for rain-water, Maruts throwing down compact things,
    and Maruts adorned with glittering ornaments, weapons, and gold.
