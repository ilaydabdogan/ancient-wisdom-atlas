canonical_text:
  quote: ''
  summary: A hymn to the Maruts describes them as rain-charged, fierce, brilliant
    storm beings with horses, deer, chariots, spears, and rain-cloud cows. The speaker
    invites them to offerings, prayers, and libations, asks them for food, wealth,
    wisdom, strength, and protection, and refers to Rudra, Prishni, Vishnu, the Dasagvas,
    dawn, sacrifice, red rays, and milk imagery.
  language: English
  quote_policy: summarized
