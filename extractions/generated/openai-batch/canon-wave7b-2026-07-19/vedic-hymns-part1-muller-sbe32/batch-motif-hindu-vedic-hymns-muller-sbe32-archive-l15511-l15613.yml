canonical_text:
  quote: ''
  summary: The passage opens Hymn 165, addressed to the Maruts and Indra. A sacrificer
    asks about the Maruts, and a dialogue follows in which the Maruts question Indra’s
    solitary arrival. Indra claims ritual songs, prayers, libations, horses, strength,
    and the thunderbolt. The Maruts describe their company and harnessed deer, while
    Indra says they left him alone in killing Ahi. The Maruts affirm companionship;
    Indra says he slew Vrvztra and released waters for humans. The Maruts praise Indra’s
    unmatched strength, and Indra asserts his sole power and lordship over what he
    has thrown down.
  language: English
  quote_policy: summarized
