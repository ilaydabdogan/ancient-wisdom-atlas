canonical_text:
  quote: ''
  summary: 'Philological notes on Vedic uses of vrata: an invocation asks goddesses
    on earth or in the waters for protection; examples connect hidden chambers or
    hidden places with Nirrztis and Trita; the note defines vrata as what is fenced
    off, forbidden, determined, or settled, hence law or ordinance; cited verses illustrate
    divine laws belonging to Varuna, Indra, Savitar, Agni Vaisvanara, Aditi, Aryaman,
    and the gods generally; the note also states that divine ordinances can refer
    to sacrifices enjoined by the gods.'
  language: English with transliterated Sanskrit citations
  quote_policy: summarized
