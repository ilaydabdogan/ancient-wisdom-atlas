  quote: When I reverentially trim the truss for Agni, when the well-trimmed ladle,
    full of butter, is stretched forth.
  summary: Philological notes on Rig-veda I, 38 discuss ritual preparation for Agni,
    an epithet of the Maruts as deities for whom the grass-altar is prepared, alternate
    translations involving hand-taking like a father and son, questions about the
    Maruts tarrying in the sky rather than coming to earth, cloud-herds, debated cattle
    similes, and parallels for gods accepting offerings and prayers.
