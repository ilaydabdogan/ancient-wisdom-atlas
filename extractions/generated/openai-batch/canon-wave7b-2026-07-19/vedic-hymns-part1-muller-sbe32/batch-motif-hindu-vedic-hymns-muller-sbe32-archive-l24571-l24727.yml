canonical_text:
  quote: ''
  summary: Commentarial notes on Rig-veda V, 61 discuss the meaning of maternal and
    marital terms applied to Agni and the Maruts, identify a fire as sacrificial fire,
    summarize reported legends about Syavasva becoming a Rishi and marrying Rathaviti’s
    daughter, compare alternate Vedic prose traditions about gifts and praise, and
    interpret an obscure verse about a charitable woman, a miser, and weregild.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note says that a term often rendered as possession of beautiful wives
    may instead mean possession of an excellent mother; it cites Agni as having two
    mothers and the Maruts as sons of their mother Prishni.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The fire mentioned in the verse is identified by the commentator as sacrificial
    fire to which the Maruts are invited.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: The commentator states little confidence in Brahmana and Anukramani legends
    used to explain personal and historical allusions in Vedic hymns.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the story quoted from Sayana, Arkananas Atreya is chosen by Rathaviti Darbhya
    as ritual priest and, at the sacrifice, sees Rathaviti’s daughter and asks for
    her in marriage for his son Syavasva.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Rathaviti’s wife refuses the proposed marriage because their daughter has
    never been given to a man who is not a poet or Rishi.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Syavasva performs penance, travels collecting alms, reaches Sasiyasi, and
    is recommended by her as a Rishi to her husband, King Taranta.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: King Taranta is described as generous to Syavasva and sends him to his younger
    brother Purumilha.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: On the way to Purumilha, Syavasva sees the Maruts, composes a hymn in their
    praise, becomes a real poet or Rishi, returns home, and receives Rathaviti’s daughter
    in marriage.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Saunaka is said to confirm a version involving two princely brothers, Taranta
    and Purumilha, both Vaidadasvis, who give presents to Syavasva, a Brahmana, who
    marries Rathaviti’s daughter.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:10
  text: In the Tandya-Brahmana version, Dhvasra and Purushanti wish to give presents
    to Taranta and Purumilha, who hesitate because they have no right to accept a
    present without deserving it or doing something for it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the Tandya-Brahmana version, Taranta and Purumilha compose a hymn in praise
    of Dhvasra and Purushanti and then feel justified in accepting the present.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The commentator notes that if the Tandya-Brahmana story is accepted, Sasiyasi
    may be taken as a proper name; alternatively the word may describe an unnamed
    woman who is as good as, or better than, many a man.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: The note on verse 8 says the verse is obscure and interprets it as praise
    of a charitable woman who may be better than a man who gives nothing.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The commentator discusses weregild and proposes that the woman is equal to
    a man in weregild, meaning worth as much even though she is a woman.
  category: other
  evidence_refs:
  - ev:9
- id: obs:15
  text: The note on verse 9 treats Purumilha as a man from whom benefits are expected
    and Taranta as a giver, probably a prince, while also saying that the whole story
    is not clear.
  category: relationship
  evidence_refs:
  - ev:11
