    Veda teems with words that require a justification
  summary: The preface argues that translation of the Vedic hymns requires commentary,
    evidence, and careful definition of words. The author rejects metrical or rhymed
    imitation as a source of inaccuracy, credits the Sanskrit Dictionary of Bohtlingk
    and Roth, attributes its Vedic portion largely to Roth, and states both admiration
    for and disagreement with Roth's explanations.
