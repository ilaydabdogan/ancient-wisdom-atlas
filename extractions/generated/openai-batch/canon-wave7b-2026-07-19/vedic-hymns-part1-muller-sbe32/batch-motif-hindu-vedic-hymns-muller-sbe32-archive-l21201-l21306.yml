  quote: ''
  summary: 'Commentarial notes on Rig-Veda I, Hymn 168: the hymn is ascribed to Agastya;
    the first line is treated as corrupt and difficult; the notes discuss possible
    readings involving the Maruts, sacrifice, prayer, the term evaya as quick-moving,
    food or water and light, spring, and a possible comparison of the Maruts with
    Soma because of refreshing or strengthening effects.'
