canonical_text:
  quote: ''
  summary: 'The passage first gives notes identifying Nodhas as a poet associated
    with the Gotama family and citing Gotama hymns to Agni and Indra. It then presents
    the opening verses of Mandala I, Hymn 85 to the Maruts: the storm-gods are described
    as sons of Rudra and Prsni, seated in the sky, adorned with ornaments and weapons,
    yoking spotted deer to chariots, hurling a thunderbolt-like stone, bringing streams
    of water to earth, and being invited to the prepared sacrificial seat and sweet
    food.'
