  summary: Philological notes on Rig Veda I, 166, especially verses 8-9, gloss terms
    for assault, injury, strength, weapons, and khadis. The passage discusses requests
    for protection from assault, interprets tavisha in this context as weapons on
    the Maruts' chariots, describes khadis as quoit-like weapons or ornaments of the
    Maruts, and cautiously compares the ancient khadi with Vishnu's later chakra.
  language: English with Sanskrit transliteration
