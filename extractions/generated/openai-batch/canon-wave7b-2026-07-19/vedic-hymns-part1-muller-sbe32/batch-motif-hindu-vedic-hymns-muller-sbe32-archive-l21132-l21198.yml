canonical_text:
  quote: ''
  summary: A hymn to the Maruts invokes them to sacrifice and prayer for welfare and
    protection. It describes them as storm-gods, shakers, self-born beings associated
    with food, light, water, Soma, weapons, thunder, clouds, lightning, rain, and
    violent conquest. Prvzsni is said to have brought forth the Maruts, and the closing
    praise asks for food, offspring, autumnal vigor, and quickening rain.
  language: English
  quote_policy: summarized
