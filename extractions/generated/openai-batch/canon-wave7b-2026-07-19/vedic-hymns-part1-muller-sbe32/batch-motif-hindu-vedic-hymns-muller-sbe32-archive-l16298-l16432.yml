  summary: The passage is a philological note gathering Vedic examples of auspicious
    invocations and especially of the formula rendered as “health and wealth.” It
    lists prayers to wind, Tvashar, the sun, Agni, Soma, Brihaspati, Rudra, the Asvins,
    Mitra-Varuna, the Maruts, and waters, often asking that health, wealth, food,
    medicine, or blessing be given to worshippers, offspring, sacrificers, or named
    groups.
