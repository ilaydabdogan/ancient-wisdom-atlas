canonical_text:
  quote: ''
  summary: The passage first gives a philological note on the intensifying sense of
    the Sanskrit preposition pari. It then begins Mandala I, Hymn 64, addressed to
    the Maruts, describing Nodhas preparing a pure offering and songs for the Maruts.
    The Maruts are depicted as divine, bright, youthful storm-gods associated with
    Dyu and Rudra, armed and ornamented, slayers of a demon and devourers of foes.
    They make winds and lightnings, milk heavenly udders or clouds, sprinkle the earth
    with rain, and pour forth water or the fat milk of the clouds.
  language: English
  quote_policy: summarized
