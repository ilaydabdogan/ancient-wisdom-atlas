canonical_text:
  quote: ''
  summary: The preface explains the editor's decision to group Rig-veda hymns by the
    deities addressed, notes the arrangement of hymns to Agni, Indra, and Soma, and
    discusses the Pada and Samhita textual forms, manuscript evidence, and principles
    of textual criticism.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The editor says he does not attempt a translation of the whole Rig-veda in
    this work and therefore groups hymns according to the deities addressed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The editor states that grouping hymns by deity allows readers to see what
    has been said of a given god and to gain insight into the god's nature and character.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says the original collectors of the ten books seem to have done
    something similar, since each book begins with hymns addressed to Agni followed
    by hymns addressed to Indra, except for the eighth Mandala; the ninth is devoted
    to Soma.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says hymns addressed to the same deities are scattered across
    different books and are not always grouped together within the same book.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The editor says he gives each hymn's Sanskrit original in the Pada text, where
    words stand separately rather than being joined by Sandhi.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage distinguishes the Samhita text as the form in which words are
    joined according to Sandhi.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that neither the Pada nor the Samhita text, as currently
    possessed, represents the original text of the Veda, and that both show scholastic
    influences.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The editor argues that restoration of the original form of the Vedic hymns
    would likely arrive at some kind of Pada text, and that metre and rhythm are more
    perceptible when words are divided.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The editor says the Pada text is practically superior because final and initial
    letters are less disguised than in the Samhita text.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The passage says Sakalya wrongly analysed and divided certain Vedic words
    in some cases, but that these cases are comparatively few.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The editor states that available manuscript collations do not provide various
    readings in the usual sense; rather, some manuscript errors are described as non-traditional
    blunders or lapsus calami.
  category: attribute
  evidence_refs:
  - ev:9
