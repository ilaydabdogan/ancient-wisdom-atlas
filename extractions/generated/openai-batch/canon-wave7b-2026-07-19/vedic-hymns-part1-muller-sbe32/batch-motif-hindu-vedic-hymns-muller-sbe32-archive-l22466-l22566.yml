  evidence_refs:
  - ev:6
- id: obs:7
  text: The note says that in several remaining passages kshoziz plausibly means women,
    and in one place may mean real women or women of the clouds.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The note says that ARZtasya sadanani is difficult to translate and may refer
