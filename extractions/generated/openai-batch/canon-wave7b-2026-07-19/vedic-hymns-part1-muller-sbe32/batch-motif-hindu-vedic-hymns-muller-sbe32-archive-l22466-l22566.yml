  text: The note states that when kshozi stands in the dual it always means heaven
    and earth, comparable to other Vedic expressions for that pair.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the cited verse VIII, 7, 22, the Maruts set or put together the great waters,
    heaven and earth, and the sun piece by piece.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the cited verse VIII, 52, 10, Indra shook great treasures, heaven and earth,
    and the sun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: In the cited verse VIII, 99, 6, heaven and earth follow rapid strength like
    mother-cows following their calf.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the cited verse II, 16, 3, the addressed strength is not compassed by heaven
    and earth.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The note interprets apa or apaz as waters between heaven and earth, or as
    the sky, and lists its occurrence with heaven and earth, the sun, and heaven.
