canonical_text:
  quote: ''
  summary: Philological notes discuss occurrences of terms translated as heaven and
    earth, waters or sky, women or cloud-women, heavenly or sacrificial places of
    the Maruts, and the word pagas as splendour or light. The examples cite Maruts
    setting waters, heaven and earth, and sun in order; Indra shaking heaven, earth,
    and sun; heaven and earth following a divine strength like mother-cows a calf;
    and Agni, Vayu, and Dawn associated with light or splendour.
  language: English
  quote_policy: summarized
