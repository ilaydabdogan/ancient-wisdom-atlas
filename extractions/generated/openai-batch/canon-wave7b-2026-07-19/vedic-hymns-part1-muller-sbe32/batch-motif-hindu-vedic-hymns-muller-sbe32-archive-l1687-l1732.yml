  summary: The passage is a philological discussion of Vedic metre and pronunciation.
    It quotes a Latin metrical observation, explains how ancient grammarians treat
    coalesced vowels under Sandhi, gives Pratisakhya examples requiring twelve-syllable
    readings, and notes scholarly disagreement about which words permit protracted
    pronunciation.
