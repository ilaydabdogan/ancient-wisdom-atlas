  quote: May that grace of yours by which you help the wretched across all anguish...
    come hither, O Maruts
  summary: The passage invokes the Maruts with worship, asking them to come for protection
    and help. It says Trita may bring them near, compares their approach to five Hotri
    priests for victory, describes them descending on a chariot, and asks their grace
    to aid the wretched, deliver the worshipper from the reviler, and approach like
    a cow going to her calf.
