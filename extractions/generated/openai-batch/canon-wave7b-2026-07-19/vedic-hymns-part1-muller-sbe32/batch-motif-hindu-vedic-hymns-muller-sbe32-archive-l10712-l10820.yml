canonical_text:
  quote: "“The path of Yama can only be the path first followed by Yama, or that leads
    to Yama, as the ruler of the departed.”"
  summary: The passage is a philological note on Rig Veda I, 38, 5-6. It discusses
    translations of a verse involving the sons of Prisni, a poet or worshipper, mortality
    and immortality, and the idea of a role reversal between god and poet. It then
    explains the phrase “path of Yama” through Vedic parallels concerning Yama, the
    fathers, Varuna, and Death, and explains Nirriti as sin or a personified power
    of evil and destruction, with parallels using the phrase “lap of Nirriti.”
  language: English with Sanskrit, French, and German quotations
  quote_policy: quoted
