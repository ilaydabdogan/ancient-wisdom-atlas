canonical_text:
  quote: ''
  summary: Philological notes on Rig-veda I,37,1 state that the hymn is ascribed to
    Kazva, son of Ghora. The cited translations address the Kazvas and call them to
    praise the Maruts, described as a sportive or swift host shining in a car. The
    note argues that the disputed term should mean unopposed, without enemy, or free
    from injury rather than without horses. A cited Rig-vedic example prays that Agni
    remove wicked misdeeds committed while waking or sleeping.
