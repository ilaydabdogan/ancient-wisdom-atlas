canonical_text:
  quote: ''
  summary: The passage is a philological note on forms related to myaksh/mimiksh,
    with examples involving grasping or joining, removal of terror, and a distinct
    desiderative or inchoative sense meaning to sprinkle or shower. It lists Vedic
    examples in which Narasamsa, Soma, the Asvins, and heaven and earth are asked
    to sprinkle a sacrifice with rain. It also explains that the Asvins' whip, compared
    with the whip of the Maruts, is associated with the cracking noise of a storm
    before rain and with ritual sprinkling. Later notes mention the Maruts' self-proclamation
    of strength through wind-voice and the sense of manas as thought before speech
    or prayer.
  language: English
  quote_policy: summarized
