  summary: A set of translation notes discusses the terms nama, dayase, abhva, and
    garta-sad. The notes argue that nama means more than a mere name, that dayase
    should be understood through cutting or destroying rather than possessing, and
    that abhva can mean fiend, monster, or monstrous power. Examples are cited in
    which Agni cuts up enemies and an unnamed addressee destroys deceits.
