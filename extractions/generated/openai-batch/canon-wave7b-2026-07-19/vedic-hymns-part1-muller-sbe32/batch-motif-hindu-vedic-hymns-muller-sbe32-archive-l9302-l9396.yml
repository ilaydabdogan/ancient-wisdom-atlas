  quote: ''
  summary: The note discusses the Sarasvati in relation to Aryavarta, Brahmavarta,
    Madhyadesa, and later Sanskrit traditions of the river’s disappearance. It contrasts
    those later accounts with a Rig-vedic passage in which Sarasvati is described
    as a fertilising river, a stronghold or iron gate, moving like a chariot, flowing
    from the mountains to the sea, and pouring fat milk for man.
  language: English
