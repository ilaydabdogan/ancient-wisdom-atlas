canonical_text:
  quote: ''
  summary: A Vedic hymn addressed chiefly to Rudra asks what speech would please him,
    petitions Aditi to bring Rudra's healing to people and livestock, asks Mitra,
    Varuza, Rudra, and the Maruts to hear the speakers, implores Rudra for health,
    wealth, and favor, and then addresses Soma/Indu for happiness, strength, protection,
    booty, and remembrance of those who honor him.
  language: English
  quote_policy: summarized
