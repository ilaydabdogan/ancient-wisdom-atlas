    welkin in some Rig-Veda passages but usually means ocean.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The note states that a Rig-Veda passage is taken to show that Vedic poets
    followed the Sarasvati as far as the Indian ocean.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: The note says that the Sarasvati later changed course and that the place where
