canonical_text:
  quote: ''
  summary: A commentary note on Rig-Veda I, 19, 7 discusses Vedic terms for heaven,
    cloud, mountain, and sea. It compares the Indian naka to the Jewish firmament,
    presents translations of a verse invoking Agni with the Maruts, explains parvata
    as sometimes meaning cloud, notes Indra cutting a cloud with lightning, compares
    cloud-rock language with Edda and Old Norse material, and discusses whether samudra
    denotes ocean, air, or welkin, including remarks on Sarasvati and sacred geography.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note describes the Indian naka as star-adorned and places dyu, heaven,
    above the sky or welkin; Sayana is cited as interpreting it as radiant heaven
    above the sun.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The cited translations of verse 7 describe the Maruts as scattering clouds,
    agitating or crossing the surging sea, or moving mountains through the wave-sea,
    while Agni is invited to come with them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note states that parvata, literally mountain, is used in many passages
    in the sense of cloud.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A cited Rig-Veda example says Indra cuts a great broad cloud to pieces with
    lightning.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The note says that two similes are mixed in the expression translated as the
    udder of the cloud, and advises translating parvata as mountain while remembering
    that mountain means cloud in the relevant context.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The note compares Vedic cloud-mountain language with an Edda interpretation
    in which rocks fashioned from Ymir's bones are taken as clouds, and with Old Norse
    and English cloud/rock word associations.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The note says the surging sea may be interpreted as sea or as air depending
