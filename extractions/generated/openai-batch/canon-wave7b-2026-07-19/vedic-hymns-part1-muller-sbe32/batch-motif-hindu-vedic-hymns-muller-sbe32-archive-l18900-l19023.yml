canonical_text:
  quote: ''
  summary: A philological note illustrates senses of vrata as divine deeds, works,
    command, power, or auspices, using examples involving Agni, Varuna, Aditya, Pushan,
    Savitar, and Parjanya. A following note illustrates datra as gift, bounty, or
    largess, using examples involving Bhaga, the Asvins, Aditi, the Maruts, the Nasatyas,
    Rigisvan, and Agni.
  language: English
  quote_policy: summarized
