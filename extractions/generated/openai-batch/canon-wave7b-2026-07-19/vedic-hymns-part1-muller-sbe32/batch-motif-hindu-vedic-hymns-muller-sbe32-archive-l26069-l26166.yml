canonical_text:
  quote: ''
  summary: Hymn verses address the Maruts, asking them to come from heaven, accept
    libations, bring nourishing wealth, rejoice in Soma, move with rain, chariots,
    winds, and praise, recall aid given to named figures, gather cosmic elements and
    waters, defeat Vvztra/Vvctra and dark mountains, protect Trita and Indra, appear
    armed with lightning and golden weapons, release waters, and come with consolation
    and blessings.
  language: English
