canonical_text:
  quote: ''
  summary: 'The passage closes part of a hymn invoking the Adityas as guardians who
    protect prayer and are worshipped at sacrifices. Editorial notes describe the
    hymn and the following hymn as obscure and tentatively translated. The next hymn,
    addressed to the Maruts or storm-gods, praises them through a sequence of similes:
    priests, pious offerers, kings, youths, Agni, winds, fires, soldiers, chariot-wheel
    spokes, heroes, singers, horses, water in floods, Angiras, grinding-stones, Soma-stones,
    children, and a marching troop.'
  language: English
  quote_policy: summarized
