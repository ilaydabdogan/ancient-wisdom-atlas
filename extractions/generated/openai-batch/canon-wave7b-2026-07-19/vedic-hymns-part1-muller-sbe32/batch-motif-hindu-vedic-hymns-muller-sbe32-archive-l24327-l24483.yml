  quote: ''
  summary: The passage includes the final verses and notes for Mandala V, Hymn 60,
    asking Agni and the Maruts to descend, drink Soma, and grant wealth to the Soma-preparing
    sacrificer. It then begins Mandala V, Hymn 61 to the Maruts, asking about their
    arrival with horses and gear, inviting the young heroes to warm at the fire, praising
    generous women, describing guidance given to Syava/Syavasva and cattle gifts,
    and noting the Maruts driving swift horses while drinking mead.
