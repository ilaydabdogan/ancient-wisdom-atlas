canonical_text:
  quote: ''
  summary: A hymn addressed to the Maruts asks where they are going and where their
    favors, blessings, delights, and cows are. The speaker asks that the Maruts accept
    the worshippers like a father accepts a son, that the praiser not go on Yama’s
    path, and that sin and greed depart. The Maruts/Rudriyas are described as terrible
    and powerful rain-bringers whose lightning, clouds, darkness, shouting, steeds,
    and chariots affect the earth. The passage ends by urging praise of Agni and worship
    of the Maruts.
  language: English
  quote_policy: summarized
