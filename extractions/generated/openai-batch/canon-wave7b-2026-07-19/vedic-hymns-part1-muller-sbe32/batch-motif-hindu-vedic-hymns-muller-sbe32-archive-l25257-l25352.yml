canonical_text:
  quote: ''
  summary: A hymn to the Maruts, the storm-gods, describes them as resplendent youths
    of Rudra whose births are unknown, fierce and swift warriors adorned with rings
    and golden chains, associated with lightning, showers, flame, weapons, and a cattle-and-man-killing
    bolt. The speaker offers libations, sacrifice, praise, and a domestic share, asking
    the Maruts for wealth, offspring, protection from enemies, the removal of darkness,
    and the preservation of kin.
  language: English
  quote_policy: summarized
