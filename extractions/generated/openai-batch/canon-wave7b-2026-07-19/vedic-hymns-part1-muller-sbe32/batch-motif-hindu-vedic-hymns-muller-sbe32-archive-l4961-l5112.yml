  quote: ''
  summary: The passage is a philological argument about Rig-veda readings, synizesis,
    and Vedic metres. The speaker cautions against conjectural emendation made only
    to restore regular metre and argues that several irregular or less common metrical
    forms should be recognized in Vedic poetry.
  language: English with Sanskrit transliteration
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says a modern Pandit would naturally read a regularized form in
    one cited passage, but the speaker maintains that the transmitted reading is correct
    and reflects ancient pronunciation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker states that conjectural alteration of the Rig-veda should, where
    possible, explain how the supposed mistake entered the tradition.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker contrasts obscure passages, where oral transmission may have produced
    accidents, with clear and familiar passages, where a change from simple sense
    to obscure wording is harder to explain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage considers a proposed omission of the word Indra in a cited verse,
    then asks whether the traditional reading can instead be maintained through synizesis.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker rejects one conjectural replacement in a cited verse because the
    proposed form is said not to be Vedic, while allowing that a difficult synizesis
    may still be possible.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Professor Kuhn is said to propose omitting an initial syllable to reduce a
    line from twelve to eleven syllables; the speaker answers that synizesis can remove
    the need for this emendation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage lists several metrical shapes that could have been avoided by
    rearranging or altering Vedic lines, implying that the poets did not necessarily
    exclude such shapes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The speaker says that he must gather evidence against the view that regular
    metre should be restored by conjectural emendation, and he recognizes seven varieties
    in the final dipodia of Gayatri verses.
  category: speech
  evidence_refs:
  - ev:7
