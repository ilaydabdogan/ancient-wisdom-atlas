  quote: ''
  summary: The passage presents an English translation of Mandala X, Hymn 121, addressed
    to the Unknown God. It describes a primordial Golden Child, a supreme divine subject
    who gives breath and strength, establishes and governs the cosmos, is above the
    gods, and is repeatedly named as the one to whom sacrifice should be offered.
    The hymn includes waters holding a germ and generating light, and ends with a
    petition to Pragapati/Prajapati for desired goods and wealth.
  language: English
  quote_policy: summarized
