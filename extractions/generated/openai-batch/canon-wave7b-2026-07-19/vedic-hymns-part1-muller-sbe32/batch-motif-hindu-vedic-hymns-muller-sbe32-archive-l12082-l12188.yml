canonical_text:
  quote: ''
  summary: A philological note discusses meanings of Vedic danu, including powerful,
    Soma, liquid, rain, dew, giver, and gift. It connects Soma and rain imagery with
    Indra, priests, clouds, milk, a heavenly udder, and the Maruts leading or riding
    horse-like clouds that pour rain.
  language: English
  quote_policy: summarized
