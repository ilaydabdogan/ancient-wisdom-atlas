  evidence_refs:
  - ev:2
- id: obs:4
  text: The note links Soma, in some doubtful passages, with fertilising rain or dew,
    including discussion of Apam napat and related epithets.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
