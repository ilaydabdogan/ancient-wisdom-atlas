canonical_text:
  quote: ''
  summary: Philological notes on Rig Veda V, 53 discuss the hymn’s attribution to
    Syavasva Atreya, textual attestations and meters, and lexical interpretations
    in verses 1-8. The notes mention spotted prishatis, streams of rain following
    the Maruts with food, birds of the Maruts compared with birds of the Asvins, ornament
    terminology, and the interpretation of spotted deer rolling on the ground like
    horses at the end of a journey, with cited parallels from ritual, Buddhist, and
    epic contexts.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hymn is ascribed to Syavasva Atreya; its meters are listed, and the note
    states that no verse occurs in SV, VS, or AV, while verse 6 occurs in TS, MS,
    and Kathaka.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note on verse 1 says that kildsi, as a feminine form, seems to mean spotted
    or marked with pocks and would be intended for the prishatis.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The note on verse 2 interprets comrades as streams of rain with food following
    after the Maruts.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The note on verse 3 states that upa dyubhiz seems to mean from day to day.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage refers to birds of the Maruts and says they are probably of the
    same character as the birds of the Asvins.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The note on verse 4 translates azgi as ornament in general rather than specifically
    as paint or ointment.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The note on verse 5 says the text is doubtful and may be a corruption of another
    reading.
  category: other
  evidence_refs:
  - ev:7
- id: obs:8
  text: The note on verse 7 says tatrvzdana may be intended as a passive meaning bored,
    dug out, or tapped, and that an instrumental referring to the Maruts would be
    expected if that were the sense.
  category: other
  evidence_refs:
  - ev:8
- id: obs:9
  text: The note on verse 7 records several explanations of a phrase involving rivers
    or shining beings, but the translator concludes that spotted deer are said to
    roll on the ground like horses at the end of a journey.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The note cites examples of rolling on the ground involving a sacrificial horse,
    Bhikkhus hearing of Buddha’s death, and a wild boar.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The note on verse 8 says amat corresponds to prithivi in other places and
    may originally have meant from the home.
  category: setting
  evidence_refs:
  - ev:11
