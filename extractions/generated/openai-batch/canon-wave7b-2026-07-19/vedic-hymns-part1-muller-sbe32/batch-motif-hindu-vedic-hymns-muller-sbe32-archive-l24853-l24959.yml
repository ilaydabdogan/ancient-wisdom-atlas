canonical_text:
  quote: Evaydmarut is a sacrificial shout, much like Evo? in Greek, Evoe in Latin,
    though I do not mean to say that the two are identical.
  summary: Editorial notes on Rig-veda V, 87 describe the hymn as a later addition
    addressed to the Maruts and ascribed to Evayamarut Atreya. The notes discuss the
    refrain Evayamarut as a sacrificial shout, the possible sense of evaya as an epithet
    of Vishnu and the Maruts meaning quickly moving, and several lexical interpretations
    involving mountains, voice, chariots, horses, and a noose.
  language: English
  quote_policy: quoted
