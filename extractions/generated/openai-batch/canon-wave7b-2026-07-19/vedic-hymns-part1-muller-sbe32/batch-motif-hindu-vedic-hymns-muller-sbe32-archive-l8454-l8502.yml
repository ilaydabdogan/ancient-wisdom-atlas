canonical_text:
  quote: ''
  summary: The passage is a philological note on Sanskrit readings and the term vahni.
    It cites verses in which a poet invokes Agni, Agni sits with the gods, and Agni
    is addressed as a poet with a bright tongue. It then discusses whether vahni,
    when applied to deity groups such as the Asvins, Visve Devas, Azbhus, and Maruts,
    means rider, driver, poet, priest, or another sense. The note states that the
    Maruts are certainly riders on horseback, but cautions that taking vahni as a
    name or epithet of the Maruts in the discussed verse depends partly on authority
    and context rather than independent evidence.
  language: English with romanized Sanskrit citations
