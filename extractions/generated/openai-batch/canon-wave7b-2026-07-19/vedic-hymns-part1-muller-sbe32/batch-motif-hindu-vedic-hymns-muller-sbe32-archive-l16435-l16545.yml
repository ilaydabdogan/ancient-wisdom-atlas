canonical_text:
  quote: ''
  summary: Philological notes explain the verb iyarti as meaning both rising and raising,
    especially for prayers or hymns raised by a poet to the gods, with cited similes
    of wind stirring clouds and rowing a ship on a river with hymns. The notes also
    discuss Agni rising, a possible thunderbolt or Soma-pressing stone, the Maruts
    offering help to Indra, the Maruts calling followers, preparing for battle, harnessing
    chariots, and the Etas or Prishatis as deer associated with the Maruts.
  language: English with transliterated Sanskrit citations
  quote_policy: summarized
