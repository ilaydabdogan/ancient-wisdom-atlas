  summary: A scholarly note cites several Vedic passages in which worshippers ask
    deities to release persons or communities from ropes, bonds, wolves, guilt, sin,
    and evil. The note explains Aditi and Aditi-hood as associated with being unbound,
    free from guilt, and free from hindrances to sacrifice or religious action.
