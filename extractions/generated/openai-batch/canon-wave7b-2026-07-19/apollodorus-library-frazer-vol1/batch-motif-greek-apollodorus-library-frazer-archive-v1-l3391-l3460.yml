canonical_text:
  quote: ''
  summary: After the gods defeat the giants, Earth mates with Tartarus and gives birth
    to Typhon in Cilicia. Typhon is described as a gigantic hybrid with human, serpentine,
    winged, and fiery features who attacks heaven. The gods flee to Egypt. An unnamed
    thunderbolt- and sickle-bearing combatant wounds and pursues Typhon to Mount Casius,
    but Typhon coils around him, takes the sickle, severs his sinews, and hides them
    in the Corycian cave under the guard of Delphyne. Hermes and Aegipan then steal
    the sinews. Frazer's notes connect Typhon/Typhoeus with other ancient sources
    and with the Corycian cave tradition.
  language: English
  quote_policy: summarized
