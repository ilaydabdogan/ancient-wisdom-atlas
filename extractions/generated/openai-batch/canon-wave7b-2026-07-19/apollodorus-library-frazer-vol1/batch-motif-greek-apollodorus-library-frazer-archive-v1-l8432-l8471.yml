canonical_text:
  quote: This Busiris used to sacrifice strangers on an altar of Zeus in accordance
    with a certain oracle.
  summary: The passage identifies Busiris as a ruler in the narrative context, gives
    his genealogy, and says that he sacrificed strangers on an altar of Zeus according
    to an oracle during a time when Egypt suffered dearth. The accompanying note collects
    reports about Egyptian human sacrifice, red-haired victims at the grave of Osiris,
    suppression of human sacrifice by Amosis/Amasis with wax effigies substituted,
    inspection and sealing of victims, and a comparative explanation in which sacrifice
    is connected with restoring fertility or rain after drought, including a royal
    victim pattern.
  language: English
  quote_policy: quoted
