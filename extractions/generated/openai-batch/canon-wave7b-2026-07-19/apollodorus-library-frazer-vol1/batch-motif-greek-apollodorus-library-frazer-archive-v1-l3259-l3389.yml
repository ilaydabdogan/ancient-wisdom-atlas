canonical_text:
  quote: ''
  summary: Earth, angered over the Titans, gives birth to the Giants by Sky. The Giants
    attack heaven and can only be destroyed with mortal help. Zeus prevents Earth
    from securing a protective simple, summons Hercules through Athena, and the gods
    and Hercules defeat the Giants in a series of combats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Earth, vexed on account of the Titans, brought forth the Giants, whom she
    had by Sky.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Giants are described as enormous, mighty, terrible in appearance, long-haired,
    and having dragon-like scales for feet.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'The passage gives alternative birthplaces for the Giants: Phlegrae according
    to some, Pallene according to others.'
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Giants hurled rocks and burning oaks at the sky.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Porphyrion and Alcyoneus surpassed the other Giants; Alcyoneus was immortal
    while fighting in his native land and drove away the Sun’s cows from Erythia.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: An oracle said the Giants could not perish by divine hands alone but would
    be ended with the help of a mortal.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Earth sought a simple to prevent the Giants from being destroyed even by a
    mortal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Zeus forbade Dawn, Moon, and Sun to shine, gathered the simple himself, and
    through Athena summoned Hercules to assist.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Hercules shot Alcyoneus with an arrow; when Alcyoneus touched the ground he
    revived, but at Athena’s advice Hercules dragged him outside Pallene, where he
    died.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Porphyrion attacked Hercules and Hera; Zeus inspired him with lust for Hera,
    Hera called for help, Zeus struck him with a thunderbolt, and Hercules shot him
    dead with an arrow.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Ephialtes was shot in each eye by Apollo and Hercules; Eurytus was killed
    by Dionysus with a thyrsus; Clytius was killed by Hecate with torches; Mimas was
    killed by Hephaestus with red-hot metal missiles.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Athena threw Sicily onto the fleeing Enceladus, flayed Pallas, and used Pallas’s
    skin to shield her body in the fight.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Poseidon chased Polybotes through the sea to Cos and threw the island-piece
    Nisyrum onto him.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Hermes, wearing the helmet of Hades, slew Hippolytus; Artemis slew Gration;
    the Fates killed Agrius and Thoas with brazen clubs; Zeus destroyed the remaining
    Giants with thunderbolts while Hercules shot them with arrows as they were dying.
  category: sequence
  evidence_refs:
  - ev:8
