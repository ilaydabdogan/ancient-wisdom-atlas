candidate_motifs:
- id: motif:1
  label: Earth-born beings wage war against heaven
  taxonomy_refs:
  - chaos
  - divine_parent_child
  - mother_goddess
  basis: Earth and Sky produce the Giants, who attack the sky and are then fought
    by the gods.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:8
  confidence: medium
  cautions: The taxonomy references are broad; the passage describes a divine-giant
    war rather than an abstract account of chaos.
- id: motif:2
  label: Divine victory requires mortal assistance
  taxonomy_refs: []
  basis: The oracle says the Giants cannot be destroyed by gods alone and require
    help from a mortal; Hercules is summoned and participates in the killings.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:8
  confidence: high
  cautions: No specific supplied taxonomy family exactly matches this pattern.
- id: motif:3
  label: Life or invulnerability tied to native ground
  taxonomy_refs: []
  basis: Alcyoneus is immortal while fighting in his birthland, revives when he touches
    the ground, and dies only after being dragged outside Pallene.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage states this for Alcyoneus only, not for all Giants.
- id: motif:4
  label: Celestial light withheld to secure a protective substance
  taxonomy_refs: []
  basis: Zeus forbids Dawn, Moon, and Sun to shine, then gathers the simple before
    anyone else can get it.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not further identify the simple beyond its protective
    function.
- id: motif:5
  label: Serpent-footed or dragon-footed Giants
  taxonomy_refs:
  - serpent
  basis: The Giants are described as having scales of dragons for feet.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: A note in the passage says Pausanias denied the serpent-footed description,
    so variant traditions exist.
- id: motif:6
  label: Island or landmass used as a weapon against a monsterlike adversary
  taxonomy_refs: []
  basis: Athena throws Sicily onto Enceladus, and Poseidon throws Nisyrum onto Polybotes.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage gives two examples but does not explicitly interpret them
    as etiological.
- id: motif:7
  label: Flayed enemy skin used as divine shield
  taxonomy_refs: []
  basis: Athena flays Pallas and uses his skin to shield her body during the fight.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage reports the action without explaining its ritual or symbolic
    meaning.
comparison_claims:
- id: claim:1
  claim: The passage’s notes connect the serpent-footed form of the Giants with other
    ancient literary references and later monuments, while also noting Pausanias’s
    denial of the detail.
  claim_level: same_motif
  target: serpent-footed Giants in Ovid, Macrobius, Servius, Claudian, Vatican mythographic
    material, Pausanias, and later monuments as cited in the notes
  evidence_refs:
  - ev:9
  counter_evidence_refs:
  - ev:9
  confidence: medium
  limitations: The note is bibliographic and does not quote the parallel passages;
    it also records disagreement in Pausanias.
- id: claim:2
  claim: The notes present the battle of gods and Giants as a motif with variant geographic
    settings across ancient sources.
  claim_level: same_motif
  target: Gigantomachy settings in Diodorus Siculus, Strabo, Pausanias, and related
    cited traditions
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The note lists sources and places but gives limited narrative detail
    for each variant.
- id: claim:3
  claim: The note relates Alcyoneus’s driving away of the Sun’s cattle to nearby Pindar
    scholia and Tzetzes traditions.
  claim_level: same_motif
  target: Alcyoneus and the oxen or cows of the Sun in scholia on Pindar and Tzetzes
    as cited in the note
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to a specific narrative detail and depends
    on the note’s summary of the cited materials.
