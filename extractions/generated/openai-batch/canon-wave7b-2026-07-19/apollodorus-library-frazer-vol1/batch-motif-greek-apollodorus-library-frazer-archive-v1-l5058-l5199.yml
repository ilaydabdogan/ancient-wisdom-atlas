canonical_text:
  quote: ''
  summary: Phineas advises the Argonauts how to pass the Clashing Rocks by first sending
    a dove through them. The Argonauts use the test, pass with Hera's help, and the
    rocks thereafter become fixed. They then visit the Mariandynians, where Idmon
    and Tiphys die and Ancaeus takes the helm. Reaching Colchis, Jason asks Aeetes
    for the fleece. Aeetes sets the tasks of yoking fire-breathing brazen-footed bulls
    and sowing dragon's teeth. Medea, in love with Jason, bargains to help him if
    he swears to marry her and take her to Greece. She gives him a protective drug
    and instructions for defeating the earth-born armed men. Jason anoints himself,
    yokes the bulls, sows the teeth, incites the armed men to fight each other with
    thrown stones, and kills them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: After the Harpies were gone, Phineas revealed the Argonauts' voyage course
    and advised them about the Clashing Rocks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Clashing Rocks are described as huge cliffs driven together by winds,
    closing a sea passage amid mist and loud crashing, so that even birds could not
    pass between them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Phineas instructed the Argonauts to send a dove between the rocks and to attempt
    the passage only if the bird passed safely.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Argonauts released a dove from the prow; the rocks clipped the tip of
    its tail, and the Argonauts then rowed through with Hera's help, losing the extremity
    of the ship's ornamented stern.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After the ship passed, the Clashing Rocks stood still because it was fated
    that they would come to rest once a ship had made the passage.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Among the Mariandynians, King Lycus received the Argonauts kindly; Idmon the
    seer died from a boar wound, Tiphys died, and Ancaeus took over steering the ship.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Argonauts sailed past the Thermodon and the Caucasus to the river Phasis
    in Colchis, where Jason asked Aeetes to give him the fleece.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Aeetes promised the fleece if Jason, single-handed, would yoke two wild, enormous,
    brazen-footed, fire-breathing bulls and sow dragon's teeth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The bulls are described as a gift of Hephaestus, and Aeetes' dragon's teeth
    are said to be half of the teeth received from Athena, connected with those Cadmus
    sowed in Thebes.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: Medea, described as a witch and as daughter of Aeetes and Idyia, conceived
    a passion for Jason and offered to help him in exchange for his oath to marry
    her and take her to Greece.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: Medea gave Jason a drug to anoint his shield, spear, and body, saying it would
