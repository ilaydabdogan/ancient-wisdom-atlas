canonical_text:
  quote: ''
  summary: Deianira, fearing Hercules' love for Iole, smears a tunic with Nessus's
    blood, believing it a love-charm. When Hercules wears it during sacrifice, the
    hydra poison harms him; he attacks Lichas and tears away the clinging garment.
    After Deianira's suicide, Hercules orders Hyllus to marry Iole, goes to Mount
    Oeta, mounts a pyre, and is burned after Poeas lights it and receives his bow.
    A cloud with thunder carries Hercules to heaven, where he gains immortality, is
    reconciled to Hera, and marries Hera's daughter. Notes record variants, including
    other pyre traditions and a less famous stream-drowning and hot-spring aetiology.
  language: English
  quote_policy: summarized
