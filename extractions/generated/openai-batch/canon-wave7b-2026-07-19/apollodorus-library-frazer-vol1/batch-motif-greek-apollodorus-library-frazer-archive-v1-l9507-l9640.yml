canonical_text:
  quote: ''
  summary: Hercules takes Ephyra, has intercourse with Astyoche, and fathers Tlepolemus.
    He directs Thespius to keep, send, and dispatch groups of his sons, including
    forty to Sardinia to found a colony. At a feast with Oeneus, Hercules accidentally
    kills the lad Eunomus while the lad pours water on his hands; although pardoned,
    Hercules chooses exile and travels with Deianira toward Ceyx at Trachis. At the
    river Evenus, the centaur Nessus, a ferryman, carries Deianira and attempts to
    violate her; Hercules hears her cry and shoots Nessus. Dying, Nessus tells Deianira
    to make and keep a love charm for Hercules from his seed and wound-blood. The
    passage then begins a new episode in the land of the Dryopes, where Hercules lacks
    food and meets Thiodamas. Frazer’s notes add ancient source comparisons and variants
    for several episodes.
  language: English
  quote_policy: summarized
