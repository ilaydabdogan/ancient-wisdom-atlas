canonical_text:
  quote: ''
  summary: After Zeus regains his strength, he pursues Typhon with thunderbolts, Typhon
    is deceived by the Fates, and Zeus finally casts Mount Etna upon him. The passage
    then recounts Prometheus moulding humans from water and earth, giving them fire
    hidden in fennel, and being punished by Zeus through binding on Mount Caucasus,
    where an eagle repeatedly devours his regenerating liver until Hercules later
    releases him. It closes by introducing Deucalion, son of Prometheus, and his marriage
    to Pyrrha.
  language: English
  quote_policy: summarized
