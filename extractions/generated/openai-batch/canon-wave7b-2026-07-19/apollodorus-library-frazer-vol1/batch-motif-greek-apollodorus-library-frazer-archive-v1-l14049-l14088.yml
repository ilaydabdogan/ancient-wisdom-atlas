canonical_text:
  quote: ''
  summary: Atalanta sets a marriage contest in which suitors must race her; if she
    overtakes them they die, and if not they marry her. After many suitors perish,
    Melanion uses golden apples from Aphrodite to distract her and wins the race and
    marriage. Later, while hunting, the couple enter Zeus's precinct, have sex there,
    and are transformed into lions. The accompanying note cites other ancient mythographic
    witnesses and gives an explanatory tradition about lions and leopards.
  language: English
  quote_policy: summarized
