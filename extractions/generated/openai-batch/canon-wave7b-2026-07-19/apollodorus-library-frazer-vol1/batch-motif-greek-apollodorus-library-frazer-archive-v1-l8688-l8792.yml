canonical_text:
  quote: ''
  summary: 'The passage describes Hercules'' twelfth labour: to bring Cerberus from
    Hades. Cerberus is described as a composite creature with three dog heads, a dragon
    tail, and snake heads on his back. Before the descent, Hercules seeks initiation
    at Eleusis, is cleansed by Eumolpus, and is initiated. He descends through the
    mouth of Hades at Taenarum. In Hades the souls flee except Meleager and the Gorgon
    Medusa; Hercules draws his sword against Medusa until Hermes tells him she is
    an empty phantom. At the gates of Hades he finds Theseus and Pirithous; Pirithous
    is bound because he wooed Persephone, and Hercules raises Theseus by the hand.
    The passage also includes notes comparing ancient variants and parallels.'
  language: English
  quote_policy: summarized
