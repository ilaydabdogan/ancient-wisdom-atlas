canonical_text:
  quote: ''
  summary: Medea helps Jason seize the guarded fleece and flee by night with the Argonauts.
    Aeetes pursues; Medea kills and dismembers Apsyrtus to delay him. Zeus sends a
    storm because of the murder, and the speaking ship directs the crew to seek purification
    from Circe. The Argonauts pass the Sirens, sea monsters, Wandering Rocks, Thrinacia,
    and Corcyra; Arete arranges Medea’s marriage to Jason. Apollo’s lightning reveals
    Anaphe, where the crew founds an altar, sacrifices, feasts, and an etiological
    custom of ritual jesting is explained.
  language: English
  quote_policy: summarized
