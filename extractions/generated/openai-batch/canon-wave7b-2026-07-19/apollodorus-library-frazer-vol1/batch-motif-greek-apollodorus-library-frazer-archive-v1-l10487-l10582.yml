canonical_text:
  quote: ''
  summary: Temenus prepares ships at Naupactus. Aristodemus is killed by a thunderbolt,
    leaving twin sons. A frenzied soothsayer is mistaken for a hostile magician and
    killed by Hippotes, after which the fleet is destroyed, famine strikes, and the
    army disbands. An oracle orders Hippotes banished for ten years and commands that
    the Three-eyed One be taken as guide. Oxylus, found riding a one-eyed horse, is
    recognized as the guide. The army wins by land and sea. After conquering Peloponnese,
    the leaders sacrifice at three altars of Paternal Zeus and cast lots for Argos,
    Lacedaemon, and Messene; Cresphontes uses a dissolving clod of earth in the water
    so that Messene falls to him.
  language: English
  quote_policy: summarized
