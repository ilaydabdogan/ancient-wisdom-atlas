canonical_text:
  quote: ''
  summary: The passage reports variant notices about Hercules and the Argonauts, then
    narrates the Argonauts' visit to the Bebryces, where Pollux kills King Amycus
    in a boxing match. It then describes the Argonauts' arrival at Salmydessus, the
    blind seer Phineus, alternative accounts of his blindness, the Harpies' theft
    and defilement of his food, and the pursuit of the Harpies by the winged sons
    of Boreas, Zetes and Calais, including place-name explanations and an Apollonius
    variant in which the Harpies swear not to wrong Phineus again.
  language: English
  quote_policy: summarized
