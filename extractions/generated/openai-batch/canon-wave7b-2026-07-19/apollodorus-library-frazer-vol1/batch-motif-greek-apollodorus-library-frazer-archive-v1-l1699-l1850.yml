canonical_text:
  quote: ''
  summary: 'An index-like summary of episodes from the end of the Trojan War and its
    aftermath: Achilles’ wrath and death, the Wooden Horse and sack of Troy, postwar
    returns and shipwrecks, the murder and vengeance cycle of Agamemnon and Orestes,
    Menelaus’ recovery of Helen and reception into Elysium, and Ulysses’ wanderings,
    return, later death, and variant stories.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Achilles slays Hector; Patroclus and Hector are buried, and Priam ransoms
    Hector’s body.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Achilles is later shot by Apollo and Paris; Ajax and Ulysses rescue his body
    and arms, and Achilles is buried.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ulysses and Diomedes perform several preparatory actions connected with Troy’s
    fall, including fetching Philoctetes, capturing Helenus, and stealing the Trojan
    Palladium.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Epeus makes the Wooden Horse; Greek leaders hide in it, Sinon remains behind,
    and the Greeks depart to Tenedos.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Trojans bring the Horse into the city despite the counsels of Laocoon
    and Cassandra.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sons of Laocoon are killed by serpents.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Sinon gives a signal, the Greeks return; the leaders descend from the
    Horse and open the gates to the Greeks.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The sack of Troy includes the slaughter of Astyanax and Polyxena; Hecuba is
    changed into a dog, and Laodice is swallowed in an earthquake.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: During the Greek returns, storms and false lights cause shipwrecks and deaths.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Orestes, helped by Pylades, kills Clytaemnestra and Aegisthus after Agamemnon
    is murdered; he is tormented by the Furies and acquitted at the Areopagus.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Menelaus wanders to Egypt, recovers Helen from Proteus, returns to Sparta
    after eight years, and is received with Helen into the Elysian fields when dying.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Ulysses’ wanderings include the Cicones, Lotus-eaters, Cyclops, Aeolus, Laestrygones,
    Circe, the nether world, Sirens, Scylla and Charybdis, the oxen of the Sun, shipwreck,
    Calypso, a raft, the Phaeacians, and return home.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:13
  text: Ulysses is killed unwittingly by his son Telegonus; Telegonus brings Ulysses’
