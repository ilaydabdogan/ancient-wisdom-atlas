  summary: Frazer discusses deified abstractions in Greek and Roman religion, suggests
    that some pantheon members may have begun as ordinary humans, describes Greek
    heroes and heroines as transitional figures moving from tomb to temple, and defines
    myth and legend. He defines myths as mistaken explanations of human and natural
    phenomena and lists subjects such as origins, seasons, vegetation, rain, thunder,
    fire, arts, society, and death. He defines legends as traditions about real people
    or events at real places that mix truth, falsehood, and often marvels.
