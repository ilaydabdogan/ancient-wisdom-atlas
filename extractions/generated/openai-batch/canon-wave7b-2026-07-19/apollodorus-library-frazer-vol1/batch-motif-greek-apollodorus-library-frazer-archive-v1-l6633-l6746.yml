  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Amphitryon ransoms the cattle from Polyxenus and brings them back to Mycenae.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Electryon plans war on the Teleboans to avenge his sons and first entrusts
    his kingdom and daughter Alemena to Amphitryon, binding him by oath to keep her
    a virgin until his return.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: When a cow charges, Amphitryon throws his club; the club rebounds from the
