candidate_motifs:
- id: motif:1
  label: Birth obstruction by binding, locks, and closed posture
  taxonomy_refs: []
  basis: The translator's note describes locks and knots thought to retard delivery,
    a jealous wife's padlocks and knotted cloth, and comparison to Juno Lucina preventing
    Hercules' birth.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This motif is in the translator's comparative note, not in the main Apollodorus
    II.iv.6 narrative.
- id: motif:2
  label: Cattle raid as trigger of feud and retaliation
  taxonomy_refs: []
  basis: The sons of Pterelaus and Taphians drive away Electryon's kine; the resulting
    defense leads to deaths and a later revenge plan.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The cattle are not described as sacred, so no sacred-theft taxonomy reference
    is assigned.
- id: motif:3
  label: Opposing-side survivors after mutual slaughter
  taxonomy_refs: []
  basis: After the sons of Electryon and sons of Pterelaus slay each other, Licymnius
    survives on one side and Everes on the other.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage names two survivors but does not present them as a functional
    survivor pair.
- id: motif:4
  label: Oath-bound chastity pending vengeance
  taxonomy_refs: []
  basis: Electryon binds Amphitryon by oath to keep Alemena a virgin until his return,
    while planning war to avenge his sons; the note compares a Hesiodic condition
    and interprets a blood-avenger chastity custom.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: medium
  cautions: The generalized blood-avenger custom is Frazer's interpretive note; the
    narrative itself records the oath and condition.
- id: motif:5
  label: Accidental killing by rebounding weapon
  taxonomy_refs: []
  basis: A charging cow causes Amphitryon to throw a club; it rebounds from the horns
    and kills Electryon.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: A note records variant traditions in which the killing may be intentional
    or hot-blooded rather than accidental.
- id: motif:6
  label: Banishment after death as pretext for throne seizure
  taxonomy_refs:
  - royal_legitimacy
  basis: Sthenelus uses Electryon's death as a pretext to banish Amphitryon and seize
    the throne of Mycenae and Tiryns.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The royal_legitimacy taxonomy is broad; the passage emphasizes seizure
    by pretext rather than a formal legitimacy doctrine.
comparison_claims:
- id: claim:1
  claim: The translator's note explicitly compares birth-retarding bindings and posture
    in an Efik/Ibibio example with the mythic posture of Juno Lucina preventing Hercules'
    birth, supporting a cautious same-function comparison of childbirth obstruction
    by binding or closed posture.
  claim_level: same_function
  target: Efik/Ibibio birth-retarding binding custom and Juno Lucina/Hercules birth
    obstruction tradition
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is made by the translator's note and does not establish
    historical contact; it is not part of the main Apollodorus II.iv.6 episode.
- id: claim:2
  claim: The notes support a nearby-corpus comparison of Electryon's death by Amphitryon
    across Apollodorus-like, Tzetzes, and Hesiodic versions, while distinguishing
    accidental rebound from hot-blooded killing after a cattle quarrel.
  claim_level: same_motif
  target: Electryon's death by Amphitryon in Tzetzes, Hesiod's Shield of Hercules,
    and related scholia
  evidence_refs:
  - ev:6
  - ev:9
  counter_evidence_refs:
  - ev:9
  confidence: high
  limitations: The compared traditions share victim and killer but differ in causation
    and moral framing.
- id: claim:3
  claim: The oath requiring Amphitryon to keep Alemena a virgin until Electryon's
    return is linked in the note to a broader pattern of avenger chastity before blood
    vengeance.
  claim_level: same_function
  target: blood-avenger chastity before vengeance pattern
  evidence_refs:
  - ev:5
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The broader custom is Frazer's interpretation; the passage itself directly
    states only Electryon's oath and planned revenge.
