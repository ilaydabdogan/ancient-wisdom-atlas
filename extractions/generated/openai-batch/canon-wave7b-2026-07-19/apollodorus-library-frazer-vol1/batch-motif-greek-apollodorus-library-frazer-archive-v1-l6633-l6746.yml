canonical_text:
  quote: ''
  summary: 'The passage includes a translator''s note on birth obstruction by knots,
    locks, and crossed posture, then narrates Apollodorus II.iv.6: Electryon reigns
    at Mycenae; the sons of Pterelaus and Taphians claim a kingdom and steal cattle;
    rival sons kill one another with one survivor on each side; the cattle are taken
    away and later ransomed by Amphitryon; Electryon entrusts his kingdom and daughter
    Alemena to Amphitryon under an oath of virginity while he plans revenge; Amphitryon
    accidentally kills Electryon when a club rebounds from a charging cow''s horns;
    Sthenelus banishes Amphitryon and seizes rule.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A translator's note reports beliefs and practices in which locks and knots
    are undone near a woman in labor because such bindings are thought to retard delivery.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same note recounts a jealous wife using padlocks, a tightly knotted waist-cloth,
    locked fingers, and crossed legs near a laboring woman; the note likens this posture
    to Juno Lucina preventing the birth of Hercules.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Electryon is described as reigning over Mycenae when the sons of Pterelaus
    arrive with Taphians and claim the kingdom of Mestor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Electryon ignores the claim, the sons of Pterelaus and their allies
    drive away his kine.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sons of Electryon defend the cattle; the opposing groups challenge and
