  summary: 'The passage recounts episodes from Hercules'' labours: the opening of
    Pholus''s wine jar and the ensuing centaur conflict; Chiron''s incurable accidental
    wound and death after Prometheus''s substitution; Pholus''s accidental death;
    the capture of the Erymanthian boar; the cleansing of Augeas''s cattle-yard by
    diverted rivers and the disputed reward; and Hercules'' killing of the centaur
    Eurytion to prevent the forced marriage of Mnesimache.'
