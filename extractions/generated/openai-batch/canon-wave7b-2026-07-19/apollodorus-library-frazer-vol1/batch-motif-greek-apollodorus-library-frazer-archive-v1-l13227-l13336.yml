canonical_text:
  quote: the Athenians marched with Theseus, captured Thebes, and gave the dead to
    their kinsfolk to bury.
  summary: A suppliant at the altar of Mercy petitions for burial of the dead. The
    Athenians under Theseus capture Thebes and hand over the dead to their kin for
    burial. Evadne, wife of Capaneus, throws herself on his burning pyre. The notes
    discuss variant traditions about negotiation versus conquest, grave locations,
    the suppliant olive bough, and special beliefs and burial rules concerning people
    killed by lightning.
  language: English
  quote_policy: quoted
