canonical_text:
  quote: ''
  summary: The passage recounts that Busiris instituted the slaughter of strangers
    in honor of Zeus, first killing the seer and then strangers who landed. Hercules
    was seized for sacrifice, broke his bonds, and killed Busiris and Busiris's son
    Amphidamas. In a following episode, Hercules reached Thermydrae, the harbor of
    the Lindians, took a bullock from a cowherd's cart, sacrificed it, and feasted.
    The powerless cowherd cursed from a mountain, explaining why later sacrifices
    to Hercules were performed with curses. Frazer's notes cite variant accounts and
    related Greek ritual explanations.
  language: English
  quote_policy: summarized
