canonical_text:
  quote: ''
  summary: The passage reports Frazer's note on Eurystheus as a posthumous protector
    of Athens and enemy of the Heraclid descendants, compares this with other Greek
    examples of protective dead in graves, and adduces Scythian, Bornean, and Greek
    legendary head-taking material as analogies for skulls or dead foes functioning
    as guardians. It then begins the Apollodorus narrative of the Heraclids attacking
    the Peloponnese after Eurystheus's death, with a note explaining the invasion
    as a 'return' to ancestral territory.
  language: English
  quote_policy: summarized
