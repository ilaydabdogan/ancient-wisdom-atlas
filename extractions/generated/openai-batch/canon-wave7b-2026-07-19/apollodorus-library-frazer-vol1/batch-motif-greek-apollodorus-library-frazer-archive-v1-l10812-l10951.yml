canonical_text:
  quote: ''
  summary: The passage recounts the unsuccessful search for Europa and the settlement
    or foundation of several places; the upbringing and rivalries of Europa's children;
    the careers of Miletus, Sarpedon, Rhadamanthys, and Minos; Minos's claim to Cretan
    kingship through a sign from Poseidon; his failure to sacrifice the divine bull;
    Poseidon's punishment through the bull and Pasiphae; Daedalus's construction of
    a wooden cow; the birth of the Minotaur; and the Minotaur's confinement in the
    Labyrinth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The searchers for Europa could not find her, abandoned the idea of returning
    home, and settled in different places.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Phoenix settled in Phoenicia; Cilix settled near Phoenicia and named the country
    Cilicia; Cadmus and Telephassa settled in Thrace; Thasus founded and dwelt in
    a city named Thasus on an island off Thrace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Asterius, prince of the Cretans, married Europa and brought up her children.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Europa's grown children quarrelled because they loved Miletus; Miletus favored
    Sarpedon, Minos won a war, and the others fled.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Miletus landed in Caria and founded a city named Miletus after himself.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sarpedon allied with Cilix, stipulated for a share of the country, became
