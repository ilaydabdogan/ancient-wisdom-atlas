  basis: Minos claims he has received the kingdom from the gods and asks Poseidon
    for a bull from the depths as proof.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage frames the sign as a proof of divine support but does not
    provide a formal coronation ritual.
- id: motif:4
  label: broken sacrificial vow punished by a god
  taxonomy_refs:
