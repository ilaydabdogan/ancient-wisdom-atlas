canonical_text:
  quote: ''
  summary: The passage narrates how Hercules, seeking release from disease, receives
    no answer from the Pythian priestess, plunders the temple, and carries off the
    tripod to establish an oracle of his own. Apollo fights him and Zeus separates
    them with a thunderbolt. An oracle then prescribes that Hercules be sold, serve
    for three years, and pay compensation to Eurytus. Hermes sells Hercules to Omphale,
    queen of Lydia; Eurytus refuses compensation; Hercules serves Omphale and binds
    the Cercopes at Ephesus. Notes cite manuscript variants and other Greek and Roman
    attestations, including artistic representations of the tripod episode.
  language: English
  quote_policy: summarized
