canonical_text:
  quote: Pluto fell in love with Persephone and with the help of Zeus carried her
    off secretly.
  summary: The passage gives a brief genealogy involving Poseidon, Amphitrite, Triton,
    Rhode, and the Sun, then narrates Pluto's secret abduction of Persephone with
    Zeus's help, Demeter's search with torches, her anger at the gods, her departure
    from heaven in human likeness to Eleusis, and Iambe's jesting that makes the goddess
    smile. Frazer's notes compare the account with other ancient sources and discuss
    Rhodian solar ritual, Hermion as an underworld-entry locality, and Eleusinian
    wells.
  language: English
  quote_policy: quoted
