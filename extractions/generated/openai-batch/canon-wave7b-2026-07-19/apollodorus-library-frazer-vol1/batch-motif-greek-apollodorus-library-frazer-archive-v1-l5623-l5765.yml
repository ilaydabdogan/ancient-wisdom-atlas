  summary: The passage gives Argive genealogy, recounts the deeds of the all-seeing
    Argus, narrates Zeus’s seduction and transformation of Io into a white cow, Hera’s
    guarded custody and persecution of Io, Hermes’ killing of Argus, Io’s gadfly-driven
    wanderings to Egypt, the birth and recovery of Epaphus, and Io’s later association
    with Demeter and Isis.
