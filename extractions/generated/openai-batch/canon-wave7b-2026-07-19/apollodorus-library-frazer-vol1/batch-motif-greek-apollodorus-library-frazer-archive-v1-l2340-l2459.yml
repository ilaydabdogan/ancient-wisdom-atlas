canonical_text:
  quote: ''
  summary: The passage recounts Calliope's sons Linus and Orpheus; Linus is slain
    by Hercules, while Orpheus is a musician whose songs move stones and trees. After
    Eurydice dies from a snake bite, Orpheus descends to Hades to recover her, receives
    Pluto's conditional permission, turns back too soon, and loses her again. Orpheus
    is also said to have invented the mysteries of Dionysus and to have been torn
    apart by Maenads. The passage then narrates Clio's love for Pierus, the birth
    of Hyacinth, Thamyris's love for Hyacinth, and Apollo's later love for and involuntary
    killing of Hyacinth with a quoit.
  language: English
  quote_policy: summarized
