- id: claim:1
  claim: Within this passage, Telephus and Atalanta share the same broad pattern of
    child exposure followed by wild-animal nursing and later human fostering.
  claim_level: same_motif
  target: 'internal comparison: Telephus exposure episode and Atalanta exposure episode'
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  counter_evidence_refs: []
  confidence: high
  limitations: 'The causes and later careers differ: Telephus is exposed after Auge’s
    concealed pregnancy and later seeks parents and royal succession, while Atalanta
    is exposed because her father wants male children and becomes an armed huntress.'
- id: claim:2
  claim: The notes indicate that Atalanta’s genealogy and related courtship episodes
    circulate with variant names and details in nearby Greek and Latin literary traditions.
  claim_level: same_motif
