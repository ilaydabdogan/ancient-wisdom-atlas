canonical_text:
  quote: ''
  summary: 'The passage gives Arcadian genealogies, narrates Auge’s concealed child
    by Hercules and the discovery of impiety in Athena’s precinct, then tells how
    the exposed infant Telephus was suckled by a doe, fostered, sought his parents
    through Delphi, and succeeded Teuthras in Mysia. It also begins the story of Atalanta:
    exposed by her father, suckled by a she-bear, raised by hunters, remaining an
    armed virgin huntress, killing two centaur attackers, and joining heroic contests.'
  language: English
  quote_policy: summarized
