canonical_text:
  quote: ''
  summary: 'The passage recounts the allotment of Argos, Lacedaemon, and Messene,
    where sacrificial signs of a toad, serpent, and fox are found and interpreted
    by seers. It then narrates dynastic violence among the Heraclids: Temenus favors
    Hyrnetho and Deiphontes, is murdered by his sons'' agents, and the army awards
    the kingdom to Hyrnetho and Deiphontes. Cresphontes is murdered, Polyphontes takes
    his throne and forces Merope to marry him, and Merope''s surviving son Aepytus
    later returns secretly, kills Polyphontes, and recovers his paternal kingdom.
    The passage then begins the genealogy of Agenor, Telephassa, Europa, Cadmus, Phoenix,
    and Cilix, with notes on variant traditions.'
  language: English
  quote_policy: summarized
