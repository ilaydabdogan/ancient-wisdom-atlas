comparison_claims:
- id: claim:1
  claim: The translator's note identifies related ancient accounts of the drawing
    of lots and Cresphontes' stratagem for Messenia in Polyaenus, Pausanias, and Sophocles.
  claim_level: same_motif
  target: Polyaenus, Strategemata i.6; Pausanias iv.3.4 sq.; Sophocles, Ajax 1283
    sqq., as cited in the note
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The note cites the comparanda but the supplied passage does not reproduce
    the stratagem's details.
- id: claim:2
  claim: The note gives regional animal parallels for the serpent associated with
    Sparta and the fox associated with Messene in Pausanias.
  claim_level: same_function
  target: Pausanias x.26.3 on Menelaus' serpent shield-device; Pausanias iv.18.6 sq.
    on Aristomenes and the fox, as cited in the note
  evidence_refs:
  - ev:8
  counter_evidence_refs: []
  confidence: low
  limitations: 'These are not the same episode as the altar signs: one is a shield
    device and the other is a rescue story. The note also says no parallel evidence
    is known there for the toad''s association with Argos.'
- id: claim:3
  claim: The Merope, Aepytus, and Polyphontes narrative is explicitly compared in
    the notes with Pausanias and Hyginus, with a variant name for the surviving avenger
    in Hyginus.
  claim_level: same_motif
  target: Pausanias iv.3.7 sq. and Hyginus, Fabulae 184, as cited in the note
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The note says Pausanias does not name Polyphontes and Hyginus names
    the avenging son Telephon rather than Aepytus.
- id: claim:4
  claim: The genealogy of Agenor, Europa, and their relatives is presented as one
    of several divergent ancient genealogical traditions.
  claim_level: same_function
  target: Scholia on Apollonius Rhodius; Hesiod; Pherecydes; Asclepiades; Antimachus;
    Moschus; Hyginus; Euripides; Pausanias, as cited in the note
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage summarizes disagreement and names authorities, but does
    not quote the full alternative genealogies.
