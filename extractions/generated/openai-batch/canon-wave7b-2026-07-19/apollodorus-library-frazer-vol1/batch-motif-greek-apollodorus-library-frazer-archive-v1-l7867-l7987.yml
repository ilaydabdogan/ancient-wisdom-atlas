canonical_text:
  quote: ''
  summary: 'The passage includes notes on Ganymede’s compensation and Laomedon’s broken
    promises, then narrates Hercules’ tenth labour: he is ordered to fetch Geryon’s
    red cattle from Erythia/Gadira, an oceanic island. Geryon is described as three-bodied,
    with Eurytion as herdsman and Orthus as two-headed watchdog. Hercules travels
    through Europe and Libya, destroys many wild beasts, reaches Tartessus, and erects
    two pillars as tokens of his journey. Notes compare ancient traditions about Geryon’s
    form, Gadira, and the Pillars of Hercules.'
  language: English
  quote_policy: summarized
