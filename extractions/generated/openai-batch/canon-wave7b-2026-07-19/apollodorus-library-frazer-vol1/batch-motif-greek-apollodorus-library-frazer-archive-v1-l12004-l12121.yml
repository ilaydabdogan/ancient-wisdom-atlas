  summary: The passage recounts the exposure and rustic rearing of Zethus and Amphion,
    their different pursuits, the escape and recognition of their mother Antiope,
    their revenge on Lycus and Dirce, their rule and fortification of the city through
    Amphion’s lyre, the expulsion and later abduction committed by Laius, and the
    marriages and offspring of Zethus and Amphion. Editorial notes compare variants
    and related treatments in other Greek and Latin sources.
