canonical_text:
  quote: ''
  summary: 'The passage recounts Zeus punishing Lycaon and his sons, sparing Nyctimus
    through Earth''s intercession, and notes the flood in the age of Deucalion. It
    then gives the story of Callisto: her variant parentage, her companionship and
    vow with Artemis, Zeus approaching her in another god''s likeness and violating
    her, her transformation into a bear, her death by Artemis, the rescue and fostering
    of her child Arcas, and Callisto''s transformation into the Bear star. Frazer''s
    notes add comparative discussion of Lycaean wolf transformation, periodic sacrifice,
    and later interpretations of Callisto''s bear transformation and Arcadian descent.'
  language: English
  quote_policy: summarized
