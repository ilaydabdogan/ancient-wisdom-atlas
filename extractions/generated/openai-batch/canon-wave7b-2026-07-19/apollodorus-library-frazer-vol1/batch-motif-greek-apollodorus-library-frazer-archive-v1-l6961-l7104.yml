  text: Hercules thinks his bedfellow is always the same woman, but has intercourse
    with all the daughters.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After vanquishing the lion, Hercules dresses in its skin and wears its scalp
    as a helmet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Clymenus, king of the Minyans, is wounded by Perieres in a precinct of Poseidon
    at Onchestus and, before dying, charges Erginus to avenge him.
  category: sequence
  evidence_refs:
  - ev:3
