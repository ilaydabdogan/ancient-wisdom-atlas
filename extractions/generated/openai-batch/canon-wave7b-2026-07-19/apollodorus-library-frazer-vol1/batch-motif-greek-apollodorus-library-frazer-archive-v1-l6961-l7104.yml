canonical_text:
  quote: ''
  summary: The passage narrates Hercules' stay with Thespius and the fifty daughters,
    the defeat of the lion and wearing of its skin, the Theban tribute to Erginus
    and Hercules' violent reversal of it, subsequent marriages and offspring, and
    a note reporting an alternate tradition in which Hermes removes Alcmene's body
    and carries her to the Islands of the Blest.
  language: English
  quote_policy: summarized
