candidate_motifs:
- id: motif:1
  label: Fated impossible chase
  taxonomy_refs: []
  basis: The vixen is fated not to be caught, while the dog is destined to catch whatever
    it pursues; Zeus resolves the contradiction by petrifying both animals.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage presents the paradox literally; no supplied taxonomy family
    directly names this pattern.
- id: motif:2
  label: Periodic human exposure to a ravaging beast
  taxonomy_refs:
  - sacrifice
  basis: The Thebans expose a citizen’s son every month to the vixen to prevent greater
    loss.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage describes exposure to a brute rather than an explicit ritual
    sacrifice.
- id: motif:3
  label: Aid exchanged for future spoils
  taxonomy_refs:
  - sacred_exchange
  basis: Amphitryon persuades Cephalus to bring the dog in return for a share of the
    Teleboan spoils.
  evidence_refs:
  - ev:3
  confidence: medium
