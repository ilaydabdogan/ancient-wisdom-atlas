canonical_text:
  quote: ''
  summary: Amphitryon comes to Thebes, undertakes to avenge Alemena’s brothers, and
    is required to rid the Cadmea of a fated, uncapturable vixen. He obtains Cephalus
    and a fated hunting dog; Zeus resolves the paradoxical chase by turning both animals
    to stone. Amphitryon campaigns against the Taphians; Comaetho removes her father
    Pterelaus’s golden hair, causing his death, and Amphitryon conquers the islands
    and kills Comaetho. Before Amphitryon returns, Zeus prolongs the night, assumes
    Amphitryon’s likeness, and sleeps with Alemena. She later bears Heracles by Zeus
    and Iphicles by Amphitryon. Hera sends serpents against the infant Heracles, who
    strangles them; a variant says Amphitryon placed the serpents to test the boys’
    paternity.
  language: English
  quote_policy: summarized
