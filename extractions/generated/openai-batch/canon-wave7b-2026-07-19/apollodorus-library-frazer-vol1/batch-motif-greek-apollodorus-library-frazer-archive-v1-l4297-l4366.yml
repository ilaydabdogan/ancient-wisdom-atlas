canonical_text:
  quote: ''
  summary: The passage gives genealogical notices about Perieres and Magnes, then
    narrates how Salmoneus founded a city in Elis, claimed to be Zeus, redirected
    Zeus's sacrifices to himself, simulated thunder and lightning with a chariot,
    kettles, hides, and torches, and was destroyed by Zeus with a thunderbolt along
    with his city. It then begins the account of Tyro, who was brought up by Cretheus
    and loved the river Enipeus. Editorial notes cite comparanda and speculate about
    imitative weather magic.
  language: English
  quote_policy: summarized
