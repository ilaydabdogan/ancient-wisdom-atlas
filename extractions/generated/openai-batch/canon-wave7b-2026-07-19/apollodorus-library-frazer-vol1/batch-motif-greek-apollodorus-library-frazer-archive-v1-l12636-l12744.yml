canonical_text:
  quote: ''
  summary: 'The passage and notes describe Opheltes/Archemorus at Nemea: his grave
    and commemorative crowns; visual representations of his death by a serpent; Hypsipyle''s
    enslavement in Lycurgus''s house; the abandoned boy''s death while Hypsipyle shows
    a spring; the serpent''s killing by Adrastus''s party; the burial, ominous naming,
    and Nemean games in the boy''s honor. The passage then describes Tydeus''s embassy
    to Eteocles, Eteocles'' refusal to cede the kingdom to Polynices, Tydeus''s victories
    in single combat, and his survival of a Theban ambush.'
  language: English
  quote_policy: summarized
