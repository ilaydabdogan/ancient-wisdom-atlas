candidate_motifs:
- id: motif:1
  label: Serpents grant animal language and divination after kindness
  taxonomy_refs:
  - serpent
  - wisdom
  basis: Melampus protects the young snakes, and they cleanse his ears; he then understands
    birds and becomes a soothsayer.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage gives the mechanism but does not frame it as an initiation
    rite in explicit terms.
- id: motif:2
  label: Animal speech saves the imprisoned seer
  taxonomy_refs:
  - wisdom
  basis: Melampus hears worms discussing the roof beam and has himself moved before
    the prison cell collapses.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage treats this as an episode within his established divinatory
    ability, not as a separate origin of power.
- id: motif:3
  label: Guarded cattle as bride-winning condition
  taxonomy_refs:
  - sacred_exchange
  - sacred_theft
  basis: Neleus requires Phylacus’s cattle before giving Pero; Melampus attempts theft,
    endures captivity, and ultimately obtains the cattle for Bias’s marriage.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:8
  confidence: high
  cautions: The word 'sacred' is not applied to the cattle; the taxonomy is based
    on the exchange and theft structure.
- id: motif:4
  label: Foretold ordeal through bondage before successful acquisition
  taxonomy_refs:
  - initiation
  - wisdom
  basis: Melampus predicts his detection, a year of bondage, and eventual receipt
    of the cattle; events unfold as predicted.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  confidence: medium
  cautions: The text presents the captivity as a practical consequence of attempted
    theft, not explicitly as ritual initiation.
- id: motif:5
  label: Hidden object in sacred tree as cause and cure of childlessness
  taxonomy_refs:
  - miraculous_child
  basis: A vulture reveals that a bloody knife hidden in a sacred oak is connected
    to Iphiclus’s inability to beget children; rust from it is given to Iphiclus,
    and Podarces is born.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The birth follows a cure for childlessness; the passage does not call
    Podarces miraculous.
- id: motif:6
  label: Sacrifice used to summon animal oracle
  taxonomy_refs:
  - sacrifice
  - wisdom
  basis: Melampus sacrifices two bulls, cuts them in pieces, summons birds, and receives
    decisive information from a vulture.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not specify formal ritual details beyond the sacrifice
    and summoning.
- id: motif:7
  label: Divinely caused madness healed for royal power
  taxonomy_refs:
  - divine_judgment
  - sacred_exchange
  - royal_legitimacy
  basis: Dionysus drives the women of Argos mad; Melampus heals them on condition
    of receiving part of the kingdom.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives no reason for Dionysus’s action and only a brief notice
    of the healing.
- id: motif:8
  label: God serving a mortal ruler
  taxonomy_refs: []
  basis: Apollo is said to have served Admetus as his thrall while Admetus reigned
    over Pherae.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: This passage provides only a brief genealogical notice without the fuller
    narrative context.
comparison_claims:
- id: claim:1
  claim: The passage itself compares Melampus’s serpent-mediated acquisition of divination
    with Helenus and Cassandra, who are said to have gained prophecy when serpents
    licked their ears in Apollo’s temple.
  claim_level: same_motif
  target: Helenus and Cassandra receiving prophetic power through serpents licking
    their ears
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: high
  limitations: This comparison appears in the translator’s note rather than the main
    Apollodorus narrative.
- id: claim:2
  claim: The note links Melampus’s serpent-derived animal-language knowledge to a
    wider folktale pattern in which people obtain knowledge of animal speech from
    serpents.
  claim_level: same_function
  target: Folktales in many lands where humans gain animal-language knowledge from
    serpents
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The note gives only a broad cross-cultural statement and does not supply
    individual tale details within this passage.
- id: claim:3
  claim: A note states that the wooing of Pero and the cattle of Phylacus story is
    also told or summarized in nearby Greek textual traditions, with some versions
    lacking the miraculous elements.
  claim_level: same_motif
  target: Scholiast on Homer, Eustathius, Homeric Odyssey summaries, and Pausanias
    versions of Melampus and the kine of Phylacus
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage reports parallels bibliographically; it does not quote
    or narrate those parallel versions in full.
