canonical_text:
  quote: ''
  summary: The passage recounts how Melampus gained animal-language knowledge and
    divinatory power through serpents, helped Bias win Pero by attempting to obtain
    Phylacus’s guarded cattle, endured foretold captivity, used animal speech to avoid
    a collapsing cell, cured Iphiclus’s childlessness through information obtained
    from a vulture, and later healed the women of Argos when Dionysus drove them mad.
    It also gives related genealogical notices and mentions Apollo serving Admetus
    as a thrall.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prefatory note says Melampus learned the language of birds and divination
    from serpents in return for kindness, and that Helenus and Cassandra were said
    to have gained prophetic power similarly when serpents licked their ears.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Melampus lived in the country near an oak that contained a lair of snakes.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Melampus’s servants killed the snakes, but Melampus burned the dead reptiles
    and reared the young ones.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the young snakes were full-grown, they stood by Melampus’s shoulders
    while he slept and purged his ears with their tongues.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After this, Melampus understood the voices of birds, foretold future events
    to people, acquired the art of taking auspices, and was later an excellent soothsayer
    after meeting Apollo at the Alpheus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bias wished to marry Pero, and Neleus made the bringing of Phylacus’s cattle
    the condition for giving her in marriage.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The cattle were in Phylace and were guarded by a dog that neither man nor
    beast could approach.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Melampus agreed to help Bias and foretold that he would be detected stealing
    the cattle and would obtain them after being kept in bondage for a year.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Melampus was detected in the theft and kept prisoner in a cell.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Near the end of the year, Melampus heard worms in the hidden roof discuss
    how much of a beam was gnawed through, asked to be moved, and the cell collapsed
    soon afterward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Phylacus released Melampus after recognizing him as a soothsayer and asked
    how his son Iphiclus might have children.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Melampus agreed to answer if he received the cattle, then sacrificed two bulls,
    cut them in pieces, and summoned birds.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: A vulture told Melampus that Phylacus had once left a bloody knife near Iphiclus,
    that the frightened child fled, and that Phylacus stuck the knife in a sacred
    oak where bark concealed it.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Melampus found the knife, scraped off its rust, gave it to Iphiclus to drink
    for ten days, and Podarces was born to Iphiclus.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Melampus drove the cattle to Pylus, received Pero from Neleus, and gave her
    to Bias.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:16
  text: When Dionysus drove the women of Argos mad, Melampus healed them on condition
    of receiving part of the kingdom and settled there with Bias.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:17
  text: The passage continues with descendants of Bias and Pero, notes that Pheres
    founded Pherae, and says Apollo served Admetus as a thrall when Admetus ruled
    Pherae.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
