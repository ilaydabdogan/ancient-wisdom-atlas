  summary: The passage recounts repeated failed attempts by the Heraclids to return
    to Peloponnese, including a plague blamed on their premature return, Tlepolemus’
    accidental killing of Licymnius and flight to Rhodes, Hyllus’ consultation of
    the Delphic oracle and mistaken interpretation of “the third crop,” Aristomachus’
    death after another defeat, and a later explanation that the oracle meant a generation
    and a sea route rather than the Isthmus.
