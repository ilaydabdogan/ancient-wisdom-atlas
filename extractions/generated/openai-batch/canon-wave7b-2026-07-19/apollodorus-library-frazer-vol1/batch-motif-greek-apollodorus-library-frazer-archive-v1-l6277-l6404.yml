- id: obs:1
  text: Danae is guarded underground before the account of her seduction and pregnancy.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:2
  text: 'The passage gives alternate accounts of Danae’s seduction: by Proetus, or
    by Zeus in the form of a stream of gold entering through the roof into Danae’s
    lap.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Acrisius learns that Danae has a child, Perseus, does not believe Zeus was
    responsible, places Danae and the child in a chest, and casts it into the sea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The chest washes ashore on Seriphus, where Dictys takes up the boy and rears
    him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Polydectes, king of Seriphus and brother of Dictys, loves Danae but cannot
    get access to her because Perseus has grown to manhood.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Polydectes gathers friends under the pretext of collecting a wedding gift
    and orders Perseus to bring the Gorgon’s head after Perseus says he would not
    refuse even that task.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hermes and Athena guide Perseus to the daughters of Phorcus, named Enyo, Pephredo,
    and Dino.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The daughters of Phorcus are described as sisters of the Gorgons, old women
