canonical_text:
  quote: ''
  summary: The passage presents Frazer’s source notes on the Perseus legend and narrates
    Danae’s confinement, Perseus’ conception and sea exposure in a chest, his rescue
    and fosterage on Seriphus, Polydectes’ demand that Perseus fetch the Gorgon’s
    head, and Perseus’ acquisition of guidance and magical equipment before reaching
    the Gorgons.
  language: English
  quote_policy: summarized
