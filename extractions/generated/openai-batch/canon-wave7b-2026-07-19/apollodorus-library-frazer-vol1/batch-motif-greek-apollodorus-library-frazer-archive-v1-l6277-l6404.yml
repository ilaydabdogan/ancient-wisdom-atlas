candidate_motifs:
- id: motif:1
  label: divine conception through golden form
  taxonomy_refs:
  - sacred_birth
  - divine_parent_child
  basis: One account says Zeus had intercourse with Danae by becoming a stream of
    gold that entered her chamber, after which Perseus is the child in the narrative.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage explicitly gives an alternate human seduction by Proetus,
    so the divine-birth reading is version-specific within the passage.
- id: motif:2
  label: mother and child exposed in floating chest
  taxonomy_refs:
  - ark_vessel
  basis: Danae and infant Perseus are shut in a chest, cast into the sea, washed ashore,
    and the child survives through fosterage.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage involves sea exposure and rescue, not a flood narrative.
- id: motif:3
  label: dangerous quest imposed by obstructive ruler
  taxonomy_refs:
  - departure
  basis: Polydectes, blocked from Danae by adult Perseus, contrives a gift-gathering
    pretext and orders Perseus to fetch the Gorgon’s head.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The taxonomy link is broad; the passage has a compelled quest but not
    a full return sequence in this excerpt.
- id: motif:4
  label: hero receives divine guidance and magical aids
  taxonomy_refs:
  - mystical_quest
  basis: Hermes and Athena guide Perseus; nymphs supply sandals, wallet, and cap;
    Hermes gives a sickle before Perseus approaches the Gorgons.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage gives practical supernatural aid for a monster quest; the
    term mystical is broader than the literal wording.
- id: motif:5
  label: seizure of shared eye to obtain hidden route
  taxonomy_refs:
  - trickster_boundary
  basis: Perseus takes the Phorcides’ shared eye and tooth and uses them to compel
    directions to the nymphs, then returns the objects.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage does not call Perseus a trickster; the taxonomy reference
    is based on boundary-crossing and coercive acquisition of knowledge.
- id: motif:6
  label: mortal monster among immortal sisters
  taxonomy_refs: []
  basis: The Gorgons are three sisters, but Medusa alone is mortal and therefore becomes
    the object of Perseus’ head-taking mission.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No specific taxonomy family supplied directly matches this pattern.
