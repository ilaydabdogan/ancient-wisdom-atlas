comparison_claims:
- id: claim:1
  claim: The editorial note reports that the Perseus legend in this section seems
    based on Pherecydes and that the Scholiast on Apollonius Rhodius gives a closely
    agreeing narrative.
  claim_level: historical_contact
  target: Pherecydes’ second book and the Scholiast on Apollonius Rhodius, Argonautica
    iv.1091, 1515
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a Frazer editorial/source note within the passage, not an independent
    motif-by-motif demonstration; the cited external narratives are not reproduced
    here.
- id: claim:2
  claim: The passage cites Pindar and Hesiod’s Shield for a related image of Perseus
    carrying the Gorgon head and the kibisis.
  claim_level: same_motif
  target: Pindar and Hesiod, Shield of Hercules, as cited in Frazer’s note on the
    kibisis
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The cited material concerns a specific object and image within the
    Perseus complex, not the whole surrounding narrative.
