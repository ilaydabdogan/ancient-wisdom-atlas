  confidence: medium
  cautions: The opening oracle is fragmentary in the supplied passage, and city foundation
    is indicated indirectly by the later identification with Thebes and Cadmus' kingdom.
- id: motif:2
  label: Dragon or serpent guarding a spring
  taxonomy_refs:
  - serpent
  basis: A dragon guards Ares' spring and kills those sent to draw water; the editorial
    note also identifies dragon-guarded springs as a common pattern.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: high
  cautions: The taxonomy reference is to the broader serpent family; the passage's
    creature is called a dragon.
- id: motif:3
  label: Sown dragon teeth produce armed earth-born warriors
  taxonomy_refs:
  - serpent
  basis: Cadmus sows the dragon's teeth, and armed men rise from the ground and fight
    each other.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The available taxonomy has no specific dragon-teeth-warrior category;
    serpent is used only as a broad related family.
- id: motif:4
  label: Atonement through service to a deity
  taxonomy_refs: []
  basis: Cadmus serves Ares for an eternal year to atone for the slaughter.
