canonical_text:
  quote: ''
  summary: Cadmus follows a cow to the place later called Thebes. While preparing
    to sacrifice it to Athena, he sends companions for water from Ares' spring, where
    a dragon kills most of them. Cadmus kills the dragon, sows its teeth on Athena's
    advice, and armed earth-born men called Sparti arise and fight each other, leaving
    five survivors. Cadmus serves Ares in atonement, receives a kingdom through Athena,
    is given Harmonia as wife by Zeus, and their marriage is celebrated by the gods.
    The passage also lists wedding gifts, children, marriages, and the beginning of
    Zeus' union with Semele.
  language: English
  quote_policy: summarized
