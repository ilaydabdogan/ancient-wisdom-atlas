  quote: ''
  summary: The passage gives notes on Hephaestus’s fall and then narrates Zeus swallowing
    Metis to prevent a foretold son, Athena’s armed birth from Zeus’s head, Asteria’s
    quail-like flight into the sea and association with Delos, Latona’s persecution
    by Hera and birth of Artemis and Apollo at Delos, Artemis’s maiden devotion to
    the chase, and Apollo’s acquisition of prophecy and the Delphic oracle after killing
    Python.
