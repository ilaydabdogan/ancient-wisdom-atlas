canonical_text:
  quote: ''
  summary: Hercules is trained and armed, is driven mad through Hera’s jealousy and
    kills children, seeks purification and the Delphic oracle, receives the name Hercules,
    is ordered to serve Eurystheus and perform labours for immortality, and begins
    the Nemean lion labour with a conditional sacrifice arranged with Molorchus.
  language: English
  quote_policy: summarized
