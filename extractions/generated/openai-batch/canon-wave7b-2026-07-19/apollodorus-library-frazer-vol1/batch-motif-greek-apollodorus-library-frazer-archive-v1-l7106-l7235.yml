- id: claim:2
  claim: The translator’s note places the labours of Hercules in a broader ancient
    literary tradition by citing Sophocles, Euripides, Diodorus, Pausanias, Quintus
    Smyrnaeus, Tzetzes, Virgil, Ovid, and Hyginus.
  claim_level: same_motif
  target: Ancient literary accounts of the labours of Hercules cited in the note.
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The note concerns the labours generally; the supplied narrative excerpt
    begins only the first labour.
- id: claim:3
  claim: The translator’s note identifies ancient comparanda for the Nemean lion episode
    and records variant origins for the lion in Hesiod and Hyginus.
  claim_level: same_motif
  target: Nemean lion traditions in Hesiod, Bacchylides, Sophocles, Theocritus, Diodorus,
