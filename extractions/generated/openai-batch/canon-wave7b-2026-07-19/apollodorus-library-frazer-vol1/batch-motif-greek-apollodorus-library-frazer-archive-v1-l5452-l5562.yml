canonical_text:
  quote: "“she sent the bride a robe steeped in poison”"
  summary: 'The passage and notes recount comparative traditions about Medea’s cauldron
    rejuvenations, then narrate Medea and Jason in Corinth: Jason marries Glauce and
    divorces Medea; Medea sends Glauce a poisoned robe that burns Glauce and Creon,
    kills or loses her children in variant traditions, and escapes in a dragon-drawn
    car from the Sun. Later she marries Aegeus in Athens, bears Medus, is expelled
    after plotting against Theseus, and finally returns to Colchis, where she kills
    Perses and restores Aeetes.'
  language: English
  quote_policy: quoted
