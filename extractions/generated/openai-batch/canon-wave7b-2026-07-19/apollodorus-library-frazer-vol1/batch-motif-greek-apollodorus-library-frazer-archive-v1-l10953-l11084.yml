canonical_text:
  quote: ''
  summary: The passage includes editorial notes on Pasiphae, Minos, Poseidon, the
    bull, the Minotaur, and the labyrinth, then narrates the family of Catreus. An
    oracle foretells that Catreus will die by one of his children. Althaemenes, fearing
    parricide, leaves Crete with Apemosyne, settles in Rhodes, ascends Mount Atabyrium,
    and founds an altar of Atabyrian Zeus. Hermes pursues Apemosyne and traps her
    by spreading fresh hides on the path; after she reports this to Althaemenes, he
    disbelieves her and kills her. Catreus sends Aerope and Clymene away through Nauplius,
    and later sails to Rhodes hoping to transfer his kingdom to Althaemenes, but is
    mistaken for a pirate by cowherds.
  language: English
  quote_policy: summarized
