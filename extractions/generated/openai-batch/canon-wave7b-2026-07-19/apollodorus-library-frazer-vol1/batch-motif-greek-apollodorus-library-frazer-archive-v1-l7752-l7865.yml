canonical_text:
  quote: ''
  summary: The passage recounts Apollo and Poseidon serving Laomedon in human likeness
    to fortify Pergamum for wages, Laomedon's refusal to pay, divine punishments of
    pestilence and a sea monster, the oracle-commanded exposure of Hesione, Hercules'
    rescue of Hesione in exchange for mares, Laomedon's second refusal to pay, and
    Hercules' subsequent travel and combats before bringing the belt to Mycenae. Frazer's
    notes compare versions and relate the Hesione episode to Perseus and Andromeda.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A comparative note reports Homeric variants in which Poseidon and Apollo built
    Troy's walls together, or Poseidon built while Apollo tended Laomedon's cattle;
    after a year Laomedon withheld wages and threatened violence and enslavement.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Apollodorus narrative, Apollo and Poseidon assumed the likeness of
    men, undertook to fortify Pergamum for wages, completed the fortification, and
    were not paid by Laomedon.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the unpaid labor, Apollo sent a pestilence and Poseidon sent a sea monster
    carried by a flood that snatched people from the plain.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Oracles foretold deliverance if Laomedon exposed Hesione to be devoured by
    the sea monster, and Laomedon fastened her to rocks near the sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hercules saw Hesione exposed and promised to save her if Laomedon gave him
    mares that Zeus had given as compensation for the rape of Ganymede.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Laomedon agreed to give the mares; Hercules killed the sea monster and saved
    Hesione, but Laomedon did not give the stipulated reward, after which Hercules
    sailed away threatening war on Troy.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At Aenus, Hercules was entertained by Poltys and then shot and killed Sarpedon,
    described as a lewd fellow, on the Aenian beach.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Hercules came to Thasos, subjugated the Thracians living on the island, and
    gave it to the sons of Androgeus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: At Torone, Polygonus and Telegonus challenged Hercules to wrestle, and he
    killed them in the wrestling match.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Hercules brought the belt to Mycenae and gave it to Eurystheus.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: A cited variant says Hercules, in full armor, leaped into the jaws of the
    sea monster, spent three days in its belly hewing it, and emerged without hair
