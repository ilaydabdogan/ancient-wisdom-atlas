canonical_text:
  quote: ''
  summary: The passage catalogues many sons of Hercules by the daughters of Thespius
    and by other women, including a genealogical connection to the family of Croesus.
    It then narrates that, after Hercules was translated to the gods, his sons fled
    from Eurystheus, first to Ceyx and then through Greece to Athens, where they sat
    at the altar of Mercy and claimed protection. The Athenians refused to surrender
    them, fought Eurystheus, killed his sons, and Hyllus pursued and slew Eurystheus.
    The commentary notes related traditions, including an omitted story of Macaria’s
    voluntary sacrifice for Athenian victory.
  language: English
  quote_policy: summarized
