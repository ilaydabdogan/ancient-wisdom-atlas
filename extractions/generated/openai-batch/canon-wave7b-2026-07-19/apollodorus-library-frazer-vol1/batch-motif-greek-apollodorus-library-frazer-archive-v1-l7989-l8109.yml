canonical_text:
  quote: ''
  summary: Heracles is heated by the Sun, aims his bow at the god, receives a golden
    goblet, and crosses the ocean to Erythia. There he confronts a dog, Eurytion,
    Menoetes, and Geryon in connection with cattle, kills several opponents, ferries
    the cattle in the goblet, and returns the goblet to the Sun. He then passes through
    Abderia, Liguria, and Tyrrhenia; in Liguria Ialebion and Dercynus, sons of Poseidon,
    try to rob him of the cattle and are killed, and at Rhegium a bull breaks away.
    The notes cite related accounts of the golden goblet voyage and a Ligurian stone-rain
    episode.
  language: English
  quote_policy: summarized
