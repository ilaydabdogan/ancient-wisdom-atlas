canonical_text:
  quote: ''
  summary: The passage recounts Tiresias seeing copulating snakes on Cyllene, wounding
    them, changing from man to woman, and later becoming male again after seeing the
    same snakes. Zeus and Hera ask him to judge which sex feels more pleasure in love;
    his answer angers Hera, who blinds him, while Zeus gives him soothsaying. The
    passage then reports his counsel that Thebes would win if Menoeceus sacrificed
    himself to Ares, followed by Menoeceus's self-killing, Capaneus's attempt to scale
    the wall, Zeus's thunderbolt, and the Argive retreat. Frazer's notes cite variant
    ancient sources and compare beliefs that seeing snakes or crows coupling is unlucky.
  language: English
  quote_policy: summarized
