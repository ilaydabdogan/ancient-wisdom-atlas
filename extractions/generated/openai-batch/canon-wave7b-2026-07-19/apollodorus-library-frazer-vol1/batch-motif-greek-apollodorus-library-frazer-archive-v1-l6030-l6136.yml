canonical_text:
  quote: ''
  summary: The passage gives an Argive genealogy from Lynceus and Abas to the twin
    brothers Acrisius and Proetus. The twins quarrel in the womb, later fight for
    the kingdom, and are said to invent shields during the war. Acrisius defeats and
    expels Proetus, who goes to Lycia, marries the ruler's daughter, and is restored
    by his father-in-law with Lycian forces; Proetus occupies Tiryns, fortified for
    him by the Cyclopes. The brothers divide Argive territory between Argos and Tiryns.
    The passage also names Acrisius's daughter Danae and Proetus's daughters Lysippe,
    Iphinoe, and Iphianassa, who grow up, go mad according to variant cultic explanations,
    and roam through Argive land, Arcadia, and the Peloponnese. Notes in the passage
    compare the twin quarrel to Esau and Jacob and summarize related ancient variants
    about the Proetides or Argive women.
  language: English
  quote_policy: summarized
