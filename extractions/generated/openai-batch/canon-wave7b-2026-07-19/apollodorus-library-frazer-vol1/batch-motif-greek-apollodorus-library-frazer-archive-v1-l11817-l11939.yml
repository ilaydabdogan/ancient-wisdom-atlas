canonical_text:
  quote: ''
  summary: The passage recounts Dionysus bringing his mother up from Hades, naming
    her Thyone, and ascending with her to heaven; associated notes describe nocturnal
    rites, watery descent, offerings, resurrection traditions, and a myrtle exchange
    with Hades. It then narrates Cadmus and Harmonia leaving Thebes, leading the Encheleans
    to victory over the Illyrians by oracle, Cadmus’s rule and son Illyrius, and the
    couple’s transformation into serpents and dispatch by Zeus to the Elysian Fields.
    A final section gives Theban succession details from Polydorus to Labdacus, Laius,
    and Lycus.
  language: English
  quote_policy: summarized
