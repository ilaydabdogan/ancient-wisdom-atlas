  summary: The passage is an introductory and textual-critical discussion. It compares
    the Library with Genesis as composite works, evaluates Apollodorus’s compilation
    style, describes the late and incomplete manuscript tradition, summarizes Wagner’s
    classification of manuscripts by sigla, and recounts the discovery and publication
    of Vatican and Sabbaitic epitomes of the Library.
