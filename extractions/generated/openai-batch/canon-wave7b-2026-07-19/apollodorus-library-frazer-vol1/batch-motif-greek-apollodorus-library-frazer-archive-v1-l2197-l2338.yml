canonical_text:
  quote: "“Atlas, who has the sky on his shoulders”"
  summary: The passage gives genealogies of divine and semi-divine beings, including
    Titan-lineage offspring, sea-lineage offspring, and children of Zeus by Hera and
    other consorts. It also recounts Atlas bearing the sky, Zeus striking Menoetius
    with a thunderbolt and casting him into Tartarus, Chiron’s double-form birth,
    and Zeus instituting oaths by the water of Styx because Styx and her children
    aided him against the Titans.
  language: English
  quote_policy: quoted
