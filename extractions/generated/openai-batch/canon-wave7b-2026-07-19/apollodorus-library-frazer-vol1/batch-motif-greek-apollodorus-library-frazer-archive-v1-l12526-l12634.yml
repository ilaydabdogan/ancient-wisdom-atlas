canonical_text:
  quote: Eriphyle accepted the necklace and persuaded him to march with Adrastus.
  summary: The passage recounts how Polynices gives Eriphyle a necklace so that she
    will persuade Amphiaraus to join Adrastus in the war against Thebes, despite Amphiaraus
    having forbidden such gifts. Because Amphiaraus had sworn that Eriphyle would
    arbitrate future disputes between him and Adrastus, her decision compels him to
    go. Amphiaraus then commands his sons, when grown, to kill their mother and march
    against Thebes. The passage lists the Seven leaders and begins the Nemea episode,
    where the army seeks water and Hypsipyle shows them a spring while leaving the
    infant Opheltes behind.
  language: English
  quote_policy: quoted
