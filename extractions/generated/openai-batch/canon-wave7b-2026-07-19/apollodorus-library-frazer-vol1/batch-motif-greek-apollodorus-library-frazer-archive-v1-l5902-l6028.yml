canonical_text:
  quote: ''
  summary: The passage lists bridal pairings between sons of Egyptus and daughters
    of Danaus, including pairings made without lots and others made by casting lots.
    Danaus then hosts a feast, gives daggers to his daughters, and the daughters kill
    their sleeping bridegrooms except for Hypermnestra, who spares Lynceus. The passage
    reports burial and purification rites, later marriage arrangements, the birth
    of Nauplius from Amymone and Poseidon, and Nauplius's use of beacon lights at
    sea to lure others to death before dying by the same kind of death. It also gives
    variant names for Nauplius's wife and names his children.
  language: English
  quote_policy: summarized
