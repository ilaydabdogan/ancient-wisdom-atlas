candidate_motifs:
- id: motif:1
  label: shapeshifting opponent slain in battle
  taxonomy_refs:
  - shapeshifter
  basis: Periclymenus is explicitly described as changing shape in battle and is killed
    by Hercules.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage does not describe the forms assumed by Periclymenus.
- id: motif:2
  label: hero wounds a god on the battlefield
  taxonomy_refs: []
  basis: Hercules wounds Hades, who is fighting on the side of the Pylians.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No broader theological interpretation is supplied by the passage.
- id: motif:3
  label: kin vengeance campaign
  taxonomy_refs: []
  basis: Hercules attacks Lacedaemon to avenge the son of Licymnius, who was killed
    by the Hippocoontids.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives political and battlefield reasons as well as vengeance.
- id: motif:4
  label: apotropaic monstrous relic defends a city
  taxonomy_refs: []
  basis: The Gorgon’s hair, kept in a bronze jar and raised from the walls, is expected
    to make an attacking army flee.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The text names the Gorgon’s hair but does not describe its appearance
    or mechanism.
- id: motif:5
  label: divine gift passed on as protective power-object
  taxonomy_refs:
  - sacred_exchange
  basis: Hercules receives the Gorgon’s hair from Athena and gives it to Sterope for
    defensive use.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage reports transfer and use of a sacred object, but does not
    frame it as a ritual exchange.
- id: motif:6
  label: restoration of a displaced ruler after conquest
  taxonomy_refs:
  - royal_legitimacy
  basis: After killing Hippocoon and his sons and subjugating the city, Hercules restores
    Tyndareus and entrusts the kingdom to him.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not explain the prior claim or genealogy of Tyndareus.
- id: motif:7
  label: dangerous child foretold by oracle in variant tradition
  taxonomy_refs:
  - miraculous_child
  basis: Frazer’s note reports an oracle warning Aleus that his daughter would bear
    a son who would kill his maternal uncles.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This motif is in Frazer’s summarized variant tradition, not in the brief
    Apollodorus sentence itself.
- id: motif:8
  label: attempted disposal of mother and child averted by sale or adoption
  taxonomy_refs: []
  basis: Frazer’s note reports that Nauplius was to drown Auge but instead sold Auge
    and Telephus to Teuthras, who married Auge and adopted Telephus.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: This is from a cited variant and is explicitly distinguished from Apollodorus’s
    version in the note.
comparison_claims:
- id: claim:1
  claim: Frazer’s notes place the Pylus campaign and divine-wounding episodes within
    a nearby Greek corpus, citing Homer, Pausanias, Panyasis, Clement, and Hesiod
    for related accounts involving Hercules at Pylus and wounds to deities.
  claim_level: same_motif
  target: Greek Heracles-at-Pylus battle traditions in Homeric, Hesiodic, Pausanian,
    and related sources cited by Frazer
  evidence_refs:
  - ev:1
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides citations and summaries, not the full comparator
    texts; it supports cautious corpus-level comparison rather than a direct source-dependence
    claim.
- id: claim:2
  claim: Frazer’s note explicitly identifies multiple ancient versions of the Hercules-Auge-Telephus
    story, allowing cautious comparison within Greek and Greco-Roman mythographic
    traditions while noting variant details.
  claim_level: same_motif
  target: Auge and Telephus traditions in sources cited by Frazer, including Diodorus,
    Strabo, Hyginus, Alcidamas, Pausanias, and tragic fragments
  evidence_refs:
  - ev:6
  - ev:8
  counter_evidence_refs:
  - ev:8
  confidence: medium
  limitations: The note states that the Alcidamas version differs from Apollodorus;
    the main Apollodorus passage here gives only the brief notice about Auge.
