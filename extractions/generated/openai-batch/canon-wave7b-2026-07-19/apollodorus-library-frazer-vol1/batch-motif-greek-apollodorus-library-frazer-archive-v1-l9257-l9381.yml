canonical_text:
  quote: ''
  summary: Hercules captures Pylus, kills Periclymenus, Neleus, and most of Neleus’s
    sons, while Nestor survives and Hades is wounded as an ally of the Pylians. He
    then attacks Lacedaemon to avenge the killing of the son of Licymnius by the Hippocoontids.
    Before the campaign he obtains Cepheus’s support by giving Sterope a lock of the
    Gorgon’s hair in a bronze jar as a city-defense charm. Cepheus, his sons, and
    Iphicles die in the battle; Hercules kills Hippocoon and his sons, subjugates
    the city, and restores Tyndareus. The passage then notes that Hercules, passing
    Tegea, debauched Auge without knowing she was Aleus’s daughter. Frazer’s notes
    cite related Greek accounts and summarize variant Auge-Telephus traditions.
  language: English
  quote_policy: summarized
