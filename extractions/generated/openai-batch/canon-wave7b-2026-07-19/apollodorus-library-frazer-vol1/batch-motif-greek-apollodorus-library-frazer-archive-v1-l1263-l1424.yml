canonical_text:
  quote: ''
  summary: 'The passage is a prefatory/table-of-contents section summarizing episodes
    in Apollodorus: early divine generations, Titans, Zeus, Persephone and Demeter,
    Prometheus and the flood, Aeolid genealogies, the Argonaut expedition, Inachid
    and Danaid genealogies, Perseus, and the early life and first labors of Heracles.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage includes a prefatory signature and then outlines Book I and Book
    II chapters by topic.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The contents list offspring of Sky and Earth, including the Hundred-handed,
    Cyclopes, and Titans, and describe the Titans attacking and mutilating Sky.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The contents list the children of Cronus and Rhea, the birth of Zeus, Zeus
    conquering the Titans, and Zeus dividing the kingdom with his brothers.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The contents list children of Zeus and other divine births, including Athena
    and Artemis and Apollo.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Apollo is summarized as slaying Python, Tityus, and Marsyas; Artemis is summarized
    as slaying Orion.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Pluto carries off Persephone, Demeter comes to Eleusis, and Persephone remains
    with Pluto.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Prometheus creates men, steals fire, and is nailed to the Caucasus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Deucalion and Pyrrha are saved from the flood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The contents summarize Aeolid descendants, including Phrixus and Helle with
    the Golden Fleece, Sisyphus and his stone, Salmoneus and mock thunder, Tyro, Admetus
    and Alcestis, and Jason being sent to fetch the Golden Fleece.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Argonaut section lists the building of the Argo, the Argonauts' stops
    and encounters, Jason's tasks in Colchis with Medea's help, the carrying off of
    the Golden Fleece, the murder of Apsyrtus, purification by Circe, dangers at sea,
    the destruction of Talus, return, and later events involving Jason and Medea.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Book II outline summarizes the family of Inachus, Io's wanderings, Belus's
    offspring, marriages between the sons of Egyptus and daughters of Danaus, and
    related genealogies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Danae with her infant son Perseus floats to Seriphos.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Perseus is sent by Polydectes, comes to the Phorcides and nymphs, is associated
    with the birth of Pegasus, frees Andromeda, punishes Polydectes, and accidentally
    kills Acrisius.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: Heracles, son of Zeus and Alcmene, kills serpents sent by Hera, receives an
    education, kills the lion of Cithaeron, conquers the Minyans, marries Megara,
    receives arms from the gods, goes mad, murders his children, and is sent by Apollo
    to Eurystheus.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:15
  text: The listed labors of Heracles include the Nemean lion, Lernaean hydra and
