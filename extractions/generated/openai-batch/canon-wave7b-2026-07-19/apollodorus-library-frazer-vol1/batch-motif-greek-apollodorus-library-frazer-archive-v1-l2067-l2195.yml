canonical_text:
  quote: ''
  summary: The passage and accompanying notes describe Cronus swallowing children
    and Poseidon being saved by a foal substitution; the main narrative recounts Earth
    prophesying victory for Zeus if he gains Tartarus-bound allies, Zeus killing Campe
    and releasing them, the Cyclopes giving divine weapons, the gods defeating and
    imprisoning the Titans, the Hundred-handers guarding them, and Zeus, Poseidon,
    and Pluto receiving sky, sea, and Hades by lot. The excerpt then begins a genealogy
    of Titan offspring and includes notes on Earth oracles.
