canonical_text:
  quote: ''
  summary: The passage gives notes on variant traditions about Oedipus, Jocasta, and
    the curse on Oedipus's sons, then narrates Oedipus's expulsion from Thebes, his
    arrival with Antigone at Colonus as a suppliant, and his death after being received
    by Theseus. It then describes the compact of Eteocles and Polynices to alternate
    rule, Polynices's banishment, his arrival at Argos with the necklace and robe,
    his night fight with Tydeus, Adrastus's recognition of the boar and lion signs
    from an oracle or seer, the marriages of Tydeus and Polynices to Adrastus's daughters,
    Adrastus's promise to restore the exiles, and Amphiaraus's prophetic refusal to
    join the expedition because he foresees its fatal outcome.
  language: English
  quote_policy: summarized
