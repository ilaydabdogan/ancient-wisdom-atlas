canonical_text:
  quote: ''
  summary: The passage recounts Cronus ruling after the Tartarus episode, marrying
    Rhea, swallowing his children because Earth and Sky foretold his overthrow by
    his son, and Rhea secretly giving birth to Zeus in a cave of Dicte. Zeus is nursed
    by Adrastia and Ida, fed with Amalthea's milk, and guarded by the Curetes, whose
    weapon-clashing masks his voice. Rhea gives Cronus a swaddled stone in place of
    the child. When grown, Zeus enlists Metis, who gives Cronus a drug that makes
    him disgorge the stone and the swallowed children. Editorial notes discuss variant
    ancient locations for Zeus's birth or nurture and related details of Amalthea,
    the nurses, and the Curetes.
  language: English
  quote_policy: summarized
