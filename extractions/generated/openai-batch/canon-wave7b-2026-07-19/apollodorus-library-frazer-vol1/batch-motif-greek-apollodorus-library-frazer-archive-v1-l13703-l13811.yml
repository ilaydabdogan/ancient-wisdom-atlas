canonical_text:
  quote: ''
  summary: The passage gives Apollodorus's account, together with Frazer's notes and
    cited variants, of Zeus testing the impiety of Lycaon's household while disguised,
    the slaughter of a child whose flesh or bowels are mixed with sacrificial meat
    and set before the god, divine punishment by storm, lightning, table-upsetting,
    thunderbolt, and in some variants wolf-transformation. The notes further connect
    these traditions with reported rites of Lycaean Zeus on Mount Lycaeus involving
    human sacrifice, cannibal consumption, and temporary werewolf transformation.
  language: English
  quote_policy: summarized
