canonical_text:
  quote: ''
  summary: 'A scholarly note discusses Euripides and Atalanta, then the mythographic
    passage gives variant genealogy: Atalanta is said to be daughter of Maenalus;
    her husband is identified as Hippomenes rather than Melanion; Parthenopaeus is
    said to be her son by Melanion or Ares and to have gone to war against Thebes.
    A note adds another variant naming Meleager as Parthenopaeus’s father.'
