  quote_or_summary: Hercules goes to Crete, receives no practical aid from Minos,
    catches the bull himself, shows it to Eurystheus, releases it, and the bull roams
    through Sparta, Arcadia, the Isthmus, and Marathon, harrying inhabitants.
  source_text_path: texts/public-domain/greek/project-gutenberg/apollodorus-library-frazer-vol1.md
  rights_note: Public domain translation; summarized.
- id: ev:5
  type: summary
  locator: lines 7606-7617; Library II.v.8, Diomedes and his mares
  quote_or_summary: The eighth labour is to bring the mares of Diomedes to Mycenae;
