canonical_text:
  quote: ''
  summary: 'The passage recounts three labours of Hercules: driving away the Stymphalian
    birds with Athena’s bronze castanets, capturing and releasing the Cretan Bull
    after variant origin explanations involving Europa, Zeus, Poseidon, and Minos,
    and bringing the man-eating mares of Diomedes, during which Abderus is killed
    and Hercules founds Abdera beside his grave. Translator notes add comparative
    references for the Stymphalian birds and Diomedes’ mares.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The sixth labour is to chase away the Stymphalian birds from the lake and
    wooded area at Stymphalus in Arcadia.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The birds had gathered at the Stymphalian lake for refuge because they feared
    being preyed on by wolves.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Athena gives Hercules bronze castanets that she had received from Hephaestus
    when Hercules is unsure how to drive the birds from the wood.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Hercules clashes the bronze castanets on a mountain overhanging the lake;
    the birds rise in fear, and he shoots them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: A translator note reports that the Stymphalian birds were said in other material
    to shoot their feathers like arrows and that a bronze rattle was mentioned by
    Pherecydes and Hellanicus.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The seventh labour is to bring the Cretan Bull; the passage gives variant
    explanations identifying it either with Europa’s transport for Zeus or with a
    bull sent by Poseidon from the sea.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: In the Poseidon version, Minos promises to sacrifice what appears from the
    sea, keeps the beautiful bull, sacrifices another animal, and Poseidon makes the
    bull savage in anger.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Hercules comes to Crete, is told by Minos to fight and catch the bull himself,
    captures it, shows it to Eurystheus, and then releases it.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After being released, the Cretan Bull roams through Sparta, Arcadia, and the
    Isthmus to Marathon in Attica, where it harries inhabitants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The eighth labour is to bring to Mycenae the man-eating mares of Diomedes,
    king of the Bistones and son of Ares and Cyrene.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: Hercules sails with volunteers, overpowers the grooms by the mangers, and
    drives the mares toward the sea.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: When the armed Bistones arrive, Hercules entrusts the mares to Abderus; the
    mares kill Abderus by dragging him after them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Hercules fights the Bistones, kills Diomedes, makes the rest flee, and founds
    Abdera beside Abderus’s grave.
  category: sequence
  evidence_refs:
  - ev:7
