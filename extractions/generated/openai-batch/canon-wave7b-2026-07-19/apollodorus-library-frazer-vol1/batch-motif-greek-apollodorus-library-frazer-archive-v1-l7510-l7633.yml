- id: ev:2
  type: summary
  locator: lines 7514-7532 and 7552-7564; translator notes on Stymphalian birds
  quote_or_summary: Frazer cites other ancient accounts of the Stymphalian birds,
    says they were said to shoot feathers like arrows, notes that Pherecydes and Hellanicus
    mentioned a bronze rattle, and comments that wolves are not found in other ancient
    accounts known to him.
  source_text_path: texts/public-domain/greek/project-gutenberg/apollodorus-library-frazer-vol1.md
  rights_note: Public domain translation/commentary; summarized.
- id: ev:3
  type: summary
  locator: lines 7565-7587; Library II.v.7, Cretan Bull origin variants
  quote_or_summary: The seventh labour is to bring the Cretan Bull; Acusilaus identifies
    it with the bull that ferried Europa for Zeus, while another version says Poseidon
    sent it from the sea after Minos promised a sacrifice, kept the beautiful bull,
    substituted another, and angered Poseidon, who made it savage.
  source_text_path: texts/public-domain/greek/project-gutenberg/apollodorus-library-frazer-vol1.md
  rights_note: Public domain translation; summarized.
- id: ev:4
  type: summary
