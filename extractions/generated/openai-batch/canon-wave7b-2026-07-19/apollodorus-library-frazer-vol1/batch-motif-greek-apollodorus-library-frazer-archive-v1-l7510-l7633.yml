candidate_motifs:
- id: motif:1
  label: Hero uses a divine bronze noisemaker to flush dangerous birds
  taxonomy_refs: []
  basis: A divinely sourced bronze instrument is given to Hercules; by clashing it,
    he scares the birds from hiding and shoots them.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents this as a single labour episode; broader motif classification
    would require comparison beyond the passage.
- id: motif:2
  label: Dangerous bird flock with projectile feathers
  taxonomy_refs: []
  basis: The translator note says the fabulous Stymphalian birds were said to shoot
    feathers like arrows.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The arrow-feather detail appears in commentary, not in the main narrative
    excerpt.
- id: motif:3
  label: Broken sacrificial promise brings divine punishment
  taxonomy_refs:
  - sacrifice
  - divine_judgment
  - sacred_exchange
  basis: Minos promises to sacrifice what appears from the sea, withholds the beautiful
    bull, substitutes another sacrifice, and Poseidon makes the bull savage.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives this as one of multiple reported explanations for the
    Cretan Bull.
- id: motif:4
  label: Hero captures a savage bull for a ruler and releases it to roam
  taxonomy_refs: []
  basis: Hercules captures the Cretan Bull, shows it to Eurystheus, releases it, and
    it later harries people in Attica.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No explicit taxonomy family among the provided refs directly names bull
    capture or roaming monster.
- id: motif:5
  label: Man-eating mares kill the hero’s entrusted companion
  taxonomy_refs: []
  basis: The mares are described as man-eating and kill Abderus after Hercules entrusts
    them to him.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage does not elaborate a ritual or symbolic explanation for the
    mares.
- id: motif:6
  label: Hero founds a city beside a companion’s grave
  taxonomy_refs:
  - culture_hero
  basis: After Abderus is killed, Hercules founds Abdera beside his grave.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The foundation is stated briefly and without further civic origin details.
- id: motif:7
  label: Divine parent-child genealogy around heroic conflict
  taxonomy_refs:
  - divine_parent_child
  basis: Diomedes is named as son of Ares and Cyrene, and Abderus as son of Hermes.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The genealogies are explicit but not developed as causal elements in the
    passage.
comparison_claims:
- id: claim:1
  claim: The translator note links the bronze rattle or castanet method for frightening
    the Stymphalian birds with accounts attributed to Pherecydes and Hellanicus.
  claim_level: same_motif
  target: Pherecydes and Hellanicus accounts of the Stymphalian birds
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim relies on Frazer’s summary note; the cited ancient texts
    are not quoted in the passage.
- id: claim:2
  claim: 'The passage presents alternative origin traditions for the same Cretan Bull:
    one involving Europa and Zeus, and another involving Poseidon’s sea-sent bull
    and Minos’s failed sacrifice.'
  claim_level: same_motif
  target: alternative Cretan Bull origin traditions
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: high
  limitations: Only Acusilaus is named for the Europa version; the other version is
    introduced generically as what some say.
- id: claim:3
  claim: Frazer’s note marks the wolves in the Stymphalian-bird episode as atypical
    relative to other ancient accounts known to him.
  claim_level: same_motif
  target: other ancient accounts of the Stymphalian birds
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: This is a negative comparison stated by the translator and qualified
    by 'so far as I know'; the other accounts are not excerpted here.
evidence:
