canonical_text:
  quote: ''
  summary: Demeter nurses the child of Metanira and Celeus and attempts to make him
    immortal by placing him in fire at night and stripping away mortal flesh. Praxithea
    sees the child in the fire and cries out; the child, named Demophon, is consumed
    by the fire, and Demeter reveals herself. Demeter gives Triptolemus a chariot
    of winged dragons, and he sows the inhabited earth. Zeus orders Pluto to send
    up the Maid; Pluto gives her a pomegranate seed to eat so that she will not remain
    long with her mother. Editorial notes mention Eleusinian ritual features, an appendix
    on putting children on fire, and a wider belief about food eaten in the world
    of the dead.
  language: English
  quote_policy: summarized
