  summary: The supplied passage includes Frazer's comparative notes on ritual treatment
    of people struck by lightning and Apollodorus's account of the Epigoni, sons of
    the fallen Argive heroes, preparing a second expedition against Thebes to avenge
    their fathers. After consulting an oracle, they make Alcmaeon their leader; Alcmaeon
    is reluctant because he first wishes to punish his mother Eriphyle, who accepted
    a robe from Thersander and persuaded her sons to join the war. The passage lists
    the warriors in the expedition and notes their initial devastation of villages
    around Thebes.
