canonical_text:
  quote: ''
  summary: The passage recounts Tyro’s union with Poseidon disguised as Enipeus, the
    secret birth and exposure of her twin sons Pelias and Neleus, their discovery
    and rearing by a horse-keeper, their later vengeance on Sidero at Hera’s altar,
    the brothers’ quarrel, Neleus’s exile and foundation of Pylus, the shapeshifting
    of Periclymenus during Heracles’ attack, and genealogical notices concerning Nestor
    and Pelias. Frazer’s notes compare the exposed-twin story with Romulus and Remus
    and cite variant traditions involving animal suckling, an ark, and a recognition
    token.
  language: English
  quote_policy: summarized
