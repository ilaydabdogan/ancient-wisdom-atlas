canonical_text:
  quote: ''
  summary: The passage recounts the Argonauts' attempted approach to Crete, where
    Talos guards the island and is killed through variant accounts involving Medea,
    a removed nail, ichor, or Poeas. It then describes a water-drawing contest at
    Aegina, the voyage's completion, Pelias's violence against Jason's kin, Jason's
    return with the fleece and dedication of the ship to Poseidon, and Medea's deception
    of Pelias's daughters through a false rejuvenation by cutting and boiling.
  language: English
  quote_policy: summarized
