candidate_motifs:
- id: motif:1
  label: Bronze island guardian repelling a ship
  taxonomy_refs: []
  basis: Talos guards Crete, patrols it three times daily, and throws stones at the
    approaching Argo.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage gives variant descriptions of Talos's origin and form.
- id: motif:2
  label: Life-token vulnerability in a sealed body
  taxonomy_refs: []
  basis: Talos's life is associated with a single vein sealed by a bronze nail; in
    one version removing the nail releases ichor and kills him.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage preserves multiple accounts of Talos's death, so the nail-removal
    version is not the only version.
- id: motif:3
  label: Magical deception through promised immortality
  taxonomy_refs:
  - trickster_boundary
  basis: Medea is said to promise Talos immortality and then draw out the nail that
    causes his death.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage emphasizes Medea's
    wiles but does not frame the act as a boundary-crossing trickster episode.
- id: motif:4
  label: Water-drawing contest as etiological episode
  taxonomy_refs: []
  basis: The Argonauts draw water at Aegina and a contest arises; a note connects
    the story with an Aeginetan race in which young men ran with full water jars.
  evidence_refs:
  - ev:5
  - ev:10
  confidence: medium
  cautions: The athletic aetiology is supplied in a translator note rather than in
    the main narrative.
- id: motif:5
  label: Return with quest object and dedication of ship
  taxonomy_refs:
  - return
  - sacred_exchange
  basis: Jason returns, surrenders the fleece, and dedicates the ship to Poseidon.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not narrate the original acquisition of the fleece.
- id: motif:6
  label: Poisonous bull's blood in ritualized suicide
  taxonomy_refs:
  - sacrifice
  basis: Aeson asks to take his own life and dies after drinking bull's blood while
    offering a sacrifice; a note states that ancients believed bull's blood to be
    poisonous.
  evidence_refs:
  - ev:6
  - ev:11
  confidence: medium
  cautions: The sacrifice setting is explicit, but the broader poisonous-blood belief
    is given in a note.
- id: motif:7
  label: False rejuvenation by dismemberment and boiling
  taxonomy_refs:
  - death_rebirth
  basis: Medea promises to make Pelias young again with drugs, demonstrates by boiling
    a ram into a lamb, and Pelias's daughters then cut up and boil him.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The human rejuvenation is fraudulent; Pelias does not return to life in
    this passage.
- id: motif:8
  label: Delayed revenge through another's stratagem
  taxonomy_refs: []
  basis: Jason longs to avenge his wrongs, waits, and asks Medea to devise a punishment
    for Pelias.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not give Jason's direct participation in Pelias's killing
    beyond asking Medea to devise the punishment.
comparison_claims:
- id: claim:1
  claim: The notes present Apollodorus's return-voyage sequence as differing from
    Apollonius Rhodius, especially around Apollo's intervention, Anaphe, Crete, Talos,
    and the omitted Libyan episode.
  claim_level: same_motif
  target: Argonauts' return voyage in Apollonius Rhodius, Argonautica, and Diodorus
    Siculus as cited in the notes
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: This comparison depends on the translator's note; the full comparative
    passages are not included here.
- id: claim:2
  claim: The Talos death episode is presented as a cluster of nearby variants involving
    ankle injury, ichor outflow, Medea's spells or deception, and Poeas's shot.
  claim_level: same_motif
  target: Talos death traditions in Apollonius Rhodius, Sophocles-related scholia,
    and Apollodorus as cited in the passage and notes
  evidence_refs:
  - ev:4
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage summarizes variant traditions but does not quote the other
    sources in full.
- id: claim:3
  claim: The Aegina water-drawing contest is connected by a note to an Aeginetan foot-race
    with full water jars, suggesting an etiological function for the narrative detail.
  claim_level: same_function
  target: Aegina water-jar foot-race tradition as cited from Apollonius Rhodius
  evidence_refs:
  - ev:5
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The etiological interpretation is provided by the note, not by the
    main narrative itself.
- id: claim:4
  claim: Aeson's death by drinking bull's blood is linked by a note to a wider ancient
    belief that bull's blood was poisonous and to a comparable story about Themistocles.
  claim_level: same_motif
  target: Poisonous bull's blood death tradition, including Themistocles as cited
    from Plutarch
  evidence_refs:
  - ev:6
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is between a mythographic narrative and a cited historical
    anecdote or popular belief; it should not be treated as evidence of direct dependence.
