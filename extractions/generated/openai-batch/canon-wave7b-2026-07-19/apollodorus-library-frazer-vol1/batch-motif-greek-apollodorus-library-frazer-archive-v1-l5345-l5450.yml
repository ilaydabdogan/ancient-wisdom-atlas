  - ev:3
- id: obs:2
  text: 'Talos is described in variant ways: as a man of the Brazen Race, as given
    to Minos by Hephaestus, as a brazen man, or as a bull.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Talos has a single vein running from neck to ankles, closed at its end by
    a bronze nail, and he runs around the island three times each day as guard.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'Talos''s death is given in variants: Medea drove him mad by drugs, Medea
    promised immortality and drew out the nail so that ichor flowed out, or Poeas
    shot him in the ankle.'
  category: sequence
  evidence_refs:
  - ev:4
