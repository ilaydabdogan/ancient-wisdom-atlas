canonical_text:
  quote: myth has its source in reason, legend in memory, and folk-tale in imagination
  summary: Frazer defines folk-tales as anonymous oral fictions meant chiefly to amuse,
    warns against finding myth, rite, magic, or practical utility behind every tale
    or cave image, distinguishes myth, legend, and folk-tale by their sources in reason,
    memory, and imagination, and comments that Apollodorus appears not to separate
    these narrative kinds by credibility. He cites several Greek tales as showing
    story-teller's art and states that Apollodorus's Library resembles Genesis in
    presenting a world history from creation or cosmic ordering to ancestral settlement.
  language: English
  quote_policy: quoted
