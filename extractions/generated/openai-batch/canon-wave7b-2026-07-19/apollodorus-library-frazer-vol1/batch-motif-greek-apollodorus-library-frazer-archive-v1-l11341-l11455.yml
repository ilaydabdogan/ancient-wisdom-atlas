    function of dressing boys as girls.
  claim_level: same_function
  target: Achilles dressed as a girl at the court of Lycomedes
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: The note uses cautious language ('may embody reminiscences') and is
    an editor's comparative interpretation, not part of the main myth narrative.
