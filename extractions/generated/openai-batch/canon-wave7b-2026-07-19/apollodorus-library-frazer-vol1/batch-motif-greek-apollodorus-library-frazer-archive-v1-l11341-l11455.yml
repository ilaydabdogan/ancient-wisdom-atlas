candidate_motifs:
- id: motif:1
  label: fatal request for divine epiphany
  taxonomy_refs:
  - divine_judgment
  basis: Semele, deceived by Hera, requests Zeus's full manner of appearance; Zeus
    arrives with thunder and lightning, and Semele dies.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage presents the death as fright after Zeus's appearance; the
    'judgment' framing is partly reflected in the daughters of Cadmus' report rather
    than an explicit narrator's judgment.
- id: motif:2
  label: miraculous second birth from a god's body
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  - divine_parent_child
  basis: Zeus rescues the premature Dionysus, sews him into his thigh, and later gives
    birth to him.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage does not call the event miraculous; that label is a motif
    classification based on the described birth sequence.
- id: motif:3
  label: divine child hidden or disguised from hostile goddess
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Dionysus is reared as a girl and later turned into a kid so Zeus can elude
    Hera's wrath.
  evidence_refs:
  - ev:6
  - ev:11
  confidence: medium
  cautions: The text explicitly states the kid transformation was to elude Hera, but
    does not explicitly state that the girl-rearing was for concealment.
- id: motif:4
  label: divine madness leading to familial child-killing
  taxonomy_refs:
  - divine_judgment
  basis: Hera drives Ino and Athamas mad; each parent kills a child during that madness.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage states Hera causes the madness, but it does not present a
    formal judgment scene.
- id: motif:5
  label: dead child honored by games
  taxonomy_refs: []
  basis: Sisyphus institutes the Isthmian games in honor of Melicertes after the child's
    death.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: high
  cautions: No supplied taxonomy family directly names ritual-game foundation or hero
    cult.
- id: motif:6
  label: drowned figures become maritime helpers
  taxonomy_refs:
  - water
  basis: After Ino leaps into the deep with Melicertes, the passage gives them maritime
    names and says they aid storm-tossed mariners.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The taxonomy reference is symbolic rather than a motif-family label.
- id: motif:7
  label: nurses transformed into stars
  taxonomy_refs:
  - ascent
  basis: The nymphs of Nysa who receive Dionysus are later changed by Zeus into stars
    named the Hyades.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The supplied taxonomy lacks a catasterism category; 'ascent' is only an
    approximate fit.
