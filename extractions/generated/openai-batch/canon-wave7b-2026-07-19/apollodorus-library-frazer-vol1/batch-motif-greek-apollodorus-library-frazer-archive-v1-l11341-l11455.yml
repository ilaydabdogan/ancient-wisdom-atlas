canonical_text:
  quote: ''
  summary: 'Hera deceives Semele into asking Zeus to appear as he did when wooing
    Hera. Zeus arrives with thunder and lightning, and Semele dies. Zeus rescues the
    unborn Dionysus from the fire, sews him into his thigh, later gives birth to him,
    and entrusts him to Hermes. Hermes takes Dionysus to Ino and Athamas, who are
    persuaded to rear him as a girl. Hera drives them mad: Athamas kills Learchus,
    and Ino kills Melicertes and leaps into the sea. Ino and Melicertes receive maritime
    names and aid sailors; Sisyphus institutes the Isthmian games in Melicertes''
    honor. Zeus changes Dionysus into a kid to avoid Hera''s wrath, and Hermes takes
    him to the nymphs of Nysa, later transformed into the Hyades stars.'
  language: English
  quote_policy: summarized
