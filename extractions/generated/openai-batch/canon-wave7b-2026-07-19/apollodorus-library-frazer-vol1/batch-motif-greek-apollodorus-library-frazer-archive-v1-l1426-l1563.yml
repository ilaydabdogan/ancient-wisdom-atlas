canonical_text:
  quote: ''
  summary: 'A table-of-contents style passage summarizes episodes from Apollodorus:
    later labors and death of Hercules, the return of the Heraclids, the families
    of Agenor and Cadmus, the Theban cycle, Arcadian and Spartan genealogies, transformations,
    divine punishments, abductions, resurrections, heroic wars, and elevations to
    divine or otherworldly status.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hercules is said to carry off Cerberus from the nether world.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hercules fights with Apollo for the Delphic tripod and later serves Omphale
    for three years.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hercules captures Oechalia, carries off Iole, receives a poisoned robe from
    Deianira, burns himself on a pyre on Mount Oeta, ascends to heaven, and marries
    Hebe.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Heraclids flee, receive Athenian help against Eurystheus, make repeated
    attempts to conquer Peloponnese, and ultimately conquer and divide Peloponnese
    by lot under Oxylus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Europa is carried off by Zeus, and her male relatives are sent to fetch her
    back but settle in various regions.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Pasiphae, inflamed with love for a bull sent from the sea by Poseidon, gives
    birth to the Minotaur.
  category: sequence
  evidence_refs:
  - ev:6
