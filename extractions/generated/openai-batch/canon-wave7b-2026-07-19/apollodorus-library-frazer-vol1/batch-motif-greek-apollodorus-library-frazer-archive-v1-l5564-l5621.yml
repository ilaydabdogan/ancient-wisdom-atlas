canonical_text:
  quote: ''
  summary: The passage includes a note on variant accounts of Perses' death and Aeetes'
    deposition, then turns from Deucalion's family to the family of Inachus. It gives
    an Argive genealogy from Ocean and Tethys through Inachus, Melia, Phoroneus, Aegialeus,
    Apis, Niobe, Zeus, and Argus. It explains several eponymous place names, narrates
    the tyranny, death, and deification of Apis, and notes identifications of Apis
    with Egyptian Apis and Sarapis/Serapis.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A source note reports a variant in which Medus, rather than Medea, killed
    Perses, and also mentions a representation of the deposed Aeetes mourning his
    condition.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that the account now moves from the family of Deucalion
    to the family of Inachus.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Ocean and Tethys are said to have a son Inachus, after whom a river in Argos
    is called Inachus.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Inachus and Melia, daughter of Ocean, are said to have sons Phoroneus and
    Aegialeus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Aegialeus is said to have died childless, after which the whole country was
    called Aegialia.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Phoroneus is said to have reigned over the whole land later named Peloponnese
    and to have begotten Apis and Niobe by the nymph Teledice.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Apis is described as converting his power into tyranny, naming the Peloponnese
    Apia, being slain by Thelxion and Telchis, leaving no child, and later being deemed
    a god called Sarapis.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Niobe is said to have had a son Argus by Zeus, and the passage states that
    she was the first mortal woman with whom Zeus cohabited.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: A note reports that Apion dated the flight of the Israelites from Egypt to
    the reign of Inachus at Argos and that an ancient epic called the Phoronis concerned
    Phoroneus.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: A note states that Apollodorus identifies the Argive Apis with the Egyptian
    bull Apis, who was in turn identified with Serapis, and also notes Apia as a name
    for Peloponnese or Argos.
  category: relationship
  evidence_refs:
  - ev:9
