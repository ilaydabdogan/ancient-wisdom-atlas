canonical_text:
  quote: ''
  summary: 'The passage recounts Apollo’s musical contest with Marsyas and Marsyas’s
    punishment by hanging and flaying. It then gives accounts of Orion: his parentage,
    giant stature, sea-striding power, marriage to Side, wooing of Merope, blinding
    by Oenopion, recovery of sight by being guided to the sunrise, Dawn’s love and
    abduction of him, and variant explanations of his death by Artemis, with a note
    on a scorpion-constellation variant.'
  language: English
  quote_policy: summarized
