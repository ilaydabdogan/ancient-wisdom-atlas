candidate_motifs:
- id: motif:1
  label: Musical contest with agreed punitive stakes
  taxonomy_refs: []
  basis: Apollo and Marsyas compete musically after agreeing that the victor may impose
    his will on the defeated party.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage presents the event as a contest and punishment, not as a formal
    ritual.
- id: motif:2
  label: Inversion challenge determines contest victory
  taxonomy_refs: []
  basis: Apollo turns his lyre upside down and demands Marsyas do likewise; Marsyas
    cannot, and Apollo wins.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The specific challenge concerns a lyre and does not generalize beyond
    the passage.
- id: motif:3
  label: Defeated rival hanged and flayed on a tree
  taxonomy_refs:
  - sacrifice
  basis: After victory Apollo hangs Marsyas on a tall pine tree and strips off his
    skin.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage describes punishment; the taxonomy link to sacrifice is only
    approximate and should be reviewed.
- id: motif:4
  label: Divine or earth-born giant with sea-crossing power
  taxonomy_refs:
  - divine_parent_child
  basis: Orion is described as gigantic, either earth-born or son of Poseidon and
    Euryale, and Poseidon gives him sea-striding ability.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage preserves alternative parentage traditions rather than a single
    stable origin account.
- id: motif:5
  label: Blinding followed by guided journey to sunrise and restored sight
  taxonomy_refs:
  - mystical_quest
  - return
  basis: After Oenopion blinds him, Orion has a lad guide him to the sunrise, where
    the sun’s rays heal him, after which he returns against Oenopion.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The quest and return taxonomy labels are interpretive; the literal sequence
    is blinding, guidance, healing, and pursuit.
- id: motif:6
  label: Hidden adversary in an underground refuge
  taxonomy_refs: []
  basis: When Orion pursues Oenopion after regaining sight, Poseidon has prepared
    an underground house for Oenopion, constructed by Hephaestus.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not explicitly describe Orion finding or failing to find
    Oenopion there.
- id: motif:7
  label: Divine beloved carried off by Dawn
  taxonomy_refs:
  - divine_beloved
  - stolen_beloved
  basis: Dawn falls in love with Orion, carries him off, and brings him to Delos.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents Dawn as the abductor and lover; Orion’s consent or
    resistance is not described.
- id: motif:8
  label: Goddess kills transgressive or challenging male figure
  taxonomy_refs:
  - divine_judgment
  basis: Variants say Orion is killed for challenging Artemis to quoits or shot for
    violence toward Opis; another account has Artemis send a scorpion that kills him.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: medium
  cautions: The passage gives multiple inconsistent explanations for Orion’s death.
- id: motif:9
  label: Constellation opposition after creature-caused death
  taxonomy_refs: []
  basis: A commentary variant says the scorpion and Orion are raised as constellations,
    explaining why Orion perpetually flees Scorpion in the sky.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is given in commentary as another, more generally received account,
    not as the main narrative of the passage.
comparison_claims:
- id: claim:1
  claim: The passage itself identifies the Marsyas-Apollo contest and punishment as
    a story paralleled in several ancient authors, and it specifically compares the
    inverted-instrument detail with Hyginus and the Second Vatican Mythographer.
  claim_level: same_motif
  target: Marsyas and Apollo contest traditions in Diodorus Siculus, Pausanias, Ovid,
    Hyginus, and Vatican Mythographers
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage cites these parallels in commentary; it does not reproduce
    all parallel narratives in full.
- id: claim:2
  claim: The passage identifies the Orion-Oenopion blinding and sunrise-healing story
    as a recurring account in nearby Greek and Latin mythographic and scholastic sources.
  claim_level: same_motif
  target: Orion and Oenopion story in Eratosthenes, scholia on Aratus and Nicander,
    Hyginus, Servius, and the First Vatican Mythographer
  evidence_refs:
  - ev:5
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The cited sources are named in a note; detailed variation among them
    is not provided here, except for the note that one source substitutes Minos for
    Oenopion.
- id: claim:3
  claim: The passage presents Orion’s death as a cluster of related variant traditions
    involving Artemis, including death after a contest challenge, death after violence
    against Opis, and death by a scorpion sent by Artemis.
  claim_level: same_motif
  target: Orion death traditions involving Artemis and the scorpion constellation
    account
  evidence_refs:
  - ev:7
  - ev:8
