canonical_text:
  quote: ''
  summary: 'The passage and notes describe traditions around Hercules: Zeus begetting
    him during a lengthened night, the infant Hercules and serpents, Linus being killed
    by Hercules with a lyre, Hercules'' trial and acquittal by appeal to a law of
    Rhadamanthys, his removal to a cattle farm by Amphitryon, visible signs of his
    divine parentage and strength, and his killing of the lion of Cithaeron at eighteen.'
  language: English
  quote_policy: summarized
