canonical_text:
  quote: ''
  summary: 'The passage opens the cosmogonic genealogy: Sky first rules the world,
    weds Earth, and fathers the Hundred-handed, the Cyclopes, the Titans, and the
    Titanides. Sky binds and casts certain children into Tartarus. Earth, grieving,
    persuades the Titans to attack their father and gives Cronus an adamantine sickle.
    The Titans, except Ocean, attack; Cronus cuts off Sky''s genitals and throws them
    into the sea; drops of blood generate the Furies. Frazer''s notes compare the
    Sky-Earth marriage with other traditions and discuss Hesiodic parallels and interpretive
    explanations of Sky-Earth separation.'
  language: English
  quote_policy: summarized
