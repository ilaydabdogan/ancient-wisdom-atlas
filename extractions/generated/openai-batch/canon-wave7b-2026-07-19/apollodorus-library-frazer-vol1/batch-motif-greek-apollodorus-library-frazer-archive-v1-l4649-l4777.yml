canonical_text:
  quote: ''
  summary: 'The passage recounts how Admetus won Alcestis after Apollo yoked a lion
    and a boar for him, then offended Artemis by omitting her marriage sacrifice,
    leading to snakes in the bridal chamber. Apollo secured from the Fates a condition
    by which Admetus could escape death if another died voluntarily for him; Alcestis
    died in his place and was restored either by the Maiden or by Heracles after conflict
    with Hades. The passage then begins the Jason narrative: Pelias is warned by an
    oracle to beware a one-sandaled man, recognizes Jason after he loses a sandal
    crossing the Anaurus, and sends him to fetch the Golden Fleece, which hangs on
    an oak in Ares'' grove at Colchis and is guarded by a sleepless dragon.'
  language: English
  quote_policy: summarized
