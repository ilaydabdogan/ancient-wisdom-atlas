comparison_claims:
- id: claim:1
  claim: Frazer's note presents the Alcestis episode as functionally parallel to a
    historical anecdote in which Anne of Austria offers her life for Philip II of
    Spain, the king recovers, and the queen dies, while noting that the restoration
    element has no counterpart.
  claim_level: same_function
  target: 'Frazer''s historical comparison: Anne of Austria and Philip II of Spain'
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  counter_evidence_refs:
  - ev:6
  confidence: medium
  limitations: This is a translator's comparative note, not a claim of historical
    contact or shared tradition; the note itself stresses that no Heracles-like restoration
    completes the parallel.
