canonical_text:
  quote: ''
  summary: The passage includes editorial notes on textual variants and a lacuna,
    then narrates a sequence in which an unnamed pair flee after killing Phlegyas
    and gain Theban citizenship. Lycus rises to power in Thebes and is later killed
    by Zethus and Amphion. Antiope, daughter of Nycteus, has intercourse with Zeus,
    becomes pregnant, flees her father to Epopeus at Sicyon, and marries him. Nycteus
    kills himself after charging Lycus to punish Antiope and Epopeus; Lycus conquers
    Sicyon, kills Epopeus, takes Antiope captive, and Antiope gives birth to two children
    on the way.
  language: English
  quote_policy: summarized
