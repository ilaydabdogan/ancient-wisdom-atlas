canonical_text:
  quote: ''
  summary: The passage recounts Actaeon, son of Autonoe and Aristaeus, trained by
    Chiron as a hunter and killed on Cithaeron by his own dogs. It gives variant explanations
    involving Zeus, Semele, Artemis, and Actaeon's sight of Artemis bathing; in the
    general account Artemis transforms him into a deer and maddens his pack. The dogs
    later seek their master and are soothed by an image made by Chiron. Fragmentary/interpolated
    material names some dogs and describes the attack. The next section begins Dionysus's
    discovery of the vine and his Hera-caused madness and wandering, with commentary
    on Dionysus's travels and comparison with Osiris worship.
  language: English
  quote_policy: summarized
