canonical_text:
  quote: ''
  summary: The excerpt includes a comparative note on dangerous ghosts disabled by
    mutilating corpses; a note on Orestes biting off a finger after madness caused
    by the Furies of his murdered mother; and a translated narrative in which Dionysus
    causes death, frenzy, dismemberment, infanticide, and pirate punishment. Dionysus
    travels through Thrace and India, comes to Thebes, compels women to rave on Cithaeron,
    and Pentheus is torn apart by Agave. At Argos, women who do not honor him are
    driven mad and devour their infants. On a Tyrrhenian pirate ship, Dionysus transforms
    mast and oars into snakes, fills the vessel with ivy and flute-sound, and the
    pirates leap into the sea and are changed. A later note reports Dionysus' descent
    to the lower world to fetch Semele, using the Alcyonian Lake and Prosymnus as
    guide.
  language: English
  quote_policy: summarized
