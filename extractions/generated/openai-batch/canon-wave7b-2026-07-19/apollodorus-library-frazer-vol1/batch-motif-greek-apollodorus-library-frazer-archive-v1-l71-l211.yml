canonical_text:
  quote: ''
  summary: The passage is Frazer's introductory discussion of the uncertain authorship
    and dating of the Library. It rejects the identification of the Library's author
    with Apollodorus the Athenian grammarian, contrasts the Library's uncritical mythographic
    method with rationalizing works on the gods, dates the work no earlier than the
    mid-first century BCE by reference to Castor, and notes the author's silence about
    Rome while mentioning Greek mythic episodes involving Ulysses, the Heraclids,
    Hercules, Philoctetes, Aeneas, Aphrodite, and Anchises.
  language: English
  quote_policy: summarized
