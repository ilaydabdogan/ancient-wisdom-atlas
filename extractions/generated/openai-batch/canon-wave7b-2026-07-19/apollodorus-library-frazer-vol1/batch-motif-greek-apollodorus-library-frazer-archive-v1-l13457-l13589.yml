  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Alcmaeon is entertained by Oeneus at Calydon, driven away by the Thesprotians,
    reaches the springs of Achelous, is purified by Achelous, receives Callirrhoe
    as wife, and settles on land formed by Achelous’s silt.
  category: sequence
  evidence_refs:
