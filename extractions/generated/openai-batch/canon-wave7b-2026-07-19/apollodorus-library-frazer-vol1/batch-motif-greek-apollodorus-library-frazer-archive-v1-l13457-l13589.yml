candidate_motifs:
- id: motif:1
  label: Flight from a captured city and resettlement
  taxonomy_refs:
  - departure
  basis: The Thebans flee Thebes with women and children after Tiresias’s counsel
    and later build and inhabit Hestiaea.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives a communal flight rather than an individual heroic departure.
- id: motif:2
  label: Vowed dedication of spoils to a deity
  taxonomy_refs:
  - sacred_exchange
  basis: The Argives had vowed to dedicate the fairest spoils to Apollo if they took
    Thebes, and they send a portion of the booty and Manto to Delphi.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents the dedication as fulfillment of a vow; it does not
    elaborate ritual details.
- id: motif:3
  label: Kin-murder followed by divine or chthonic punishment
  taxonomy_refs:
  - divine_judgment
  basis: After Alcmaeon kills his mother, he is visited by the Fury of the murder
    and goes mad.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage names a Fury and madness but does not explicitly call the
    consequence a judgment.
- id: motif:4
  label: Polluted wanderer seeking purification
  taxonomy_refs:
  - initiation
  - departure
  basis: Alcmaeon travels to several places after the matricide, receives purification
    from Phegeus, and later is directed to Achelous for another trial and purification.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The taxonomy term initiation is approximate; the explicit action is purification
    after pollution.
- id: motif:5
  label: Land barrenness caused by blood guilt
  taxonomy_refs:
  - divine_judgment
  basis: The ground becomes barren on Alcmaeon’s account after the murder, and an
    oracle directs him to further purification.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage states the ground became barren on his account but does not
    supply an extended causal theology.
- id: motif:6
  label: Purification by river or river-god
  taxonomy_refs:
  - water
  basis: Alcmaeon is told to go to Achelous and is purified at the springs of Achelous;
    an editorial note observes that Achelous is conceived partly as a river and partly
    as a god.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: medium
  cautions: The available taxonomy lists water as a symbol rather than a motif family;
