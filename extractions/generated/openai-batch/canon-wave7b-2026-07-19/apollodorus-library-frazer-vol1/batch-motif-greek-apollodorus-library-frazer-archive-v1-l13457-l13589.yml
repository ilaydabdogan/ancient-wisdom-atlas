canonical_text:
  quote: ''
  summary: The passage recounts the fall of Thebes after battle, the Thebans’ flight
    with women and children, Tiresias’s death after drinking from the spring Tilphussa,
    and the Argives’ capture of the city and dedication of booty and Manto to Apollo.
    It then narrates Alcmaeon’s killing of his mother Eriphyle under Apollo’s oracle,
    his pursuit by the Fury of his mother’s murder, madness, purification, marriages
    to Arsinoe and Callirrhoe, the barrenness of the ground on his account, and his
    purification by Achelous. The passage continues with Alcmaeon’s death in an ambush
    by the sons of Phegeus, Arsinoe’s confinement in a chest and enslavement, and
    the sons’ movement of the necklace and robe toward Delphi. Some details are fragmentary
    in the supplied text.
  language: English
  quote_policy: summarized
