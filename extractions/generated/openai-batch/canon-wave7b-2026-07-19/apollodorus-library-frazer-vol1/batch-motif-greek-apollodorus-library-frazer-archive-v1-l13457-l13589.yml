comparison_claims:
- id: claim:1
  claim: The editorial note explicitly compares the barrenness of ground on Alcmaeon’s
    account with other traditions in which murder or bloodshed is associated with
    dearth or sterility of land.
  claim_level: same_function
  target: Barrenness or dearth following blood-guilt in stories of Pelops, Oedipus
    at Thebes, and wider blood-offense-to-earth beliefs cited by the editor
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an editorial comparative note, not a direct narrative comparison
    inside Apollodorus’s main mythic account; it supports functional similarity, not
    historical contact.
- id: claim:2
  claim: The editorial apparatus cites several nearby ancient sources as comparanda
    for the Alcmaeon narrative, indicating that the matricide and aftermath circulated
    in related ancient literary traditions.
  claim_level: same_motif
  target: Alcmaeon traditions in Thucydides, Diodorus Siculus, Pausanias, Ovid, Hyginus,
    and lost tragedies named Alcmaeon
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: low
  limitations: The supplied passage lists comparanda but does not quote or summarize
    their versions in detail, so the specific points of motif overlap cannot be established
    from this excerpt alone.
