canonical_text:
  quote: ''
  summary: The passage is an editorial-history section describing printed editions
    of Apollodorus' Library from the 1555 Rome edition of Benedictus Aegius through
    Richard Wagner's 1894 Teubner edition, with attention to translations, notes,
    manuscript collations, epitomes, conjectures, and textual restoration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first edition of the Library was published by Benedictus Aegius at Rome
    in 1555 and contained the Greek text, a Latin translation, and notes.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The second edition was prepared by Hieronymus Commelinus and published posthumously
    at Heidelberg in 1599; it contained Aegius' Latin version, the Greek text, and
    critical notes recording readings of the Palatine manuscript.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A subsequent edition was brought out by Tanaquil Faber at Salmurii in 1661,
    known to Frazer only by report through Heyne.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Thomas Gale edited Apollodorus together with mythological treatises by other
    authors in a volume printed or published at Paris in 1675; his text used readings
    from at least one Oxford manuscript and included a Latin translation with critical
    and exegetical notes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: C. G. Heyne published an edition with a copious critical and exegetical commentary
    in two volumes, first in 1782 and 1783 and later revised at Göttingen in 1803.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Heyne did not consult manuscripts himself but used collations of several manuscripts
    made by Gerard Jacob van Swinden, as well as extracts from a third Paris manuscript
    procured by J. Schweig-hiuser.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that Heyne restored the text of Apollodorus in many places
    and removed alien words or sentences interpolated from scholia or other sources
    by Aegius and retained by later editors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: E. Clavier published a two-volume Paris edition in 1805 with a French translation
    and notes, and Chr. L. Sommer published another edition with notes at Rudolstadt
    in 1822; Frazer says he knew both only by report.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: C. Miiller included the text of Apollodorus with a Latin translation in his
    edition of fragments of the Greek historians and used a collation of Paris manuscript
    2722, described as believed to be the archetype of all extant manuscripts of Apollodorus.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: A. Westermann edited the text with critical notes in 1843 without manuscript
    collation; Immanuel Bekker published an 1854 edition without collating manuscripts
    but with conjectural corrections; R. Hercher's 1874 edition introduced many conjectural
    readings and many excisions.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Richard Wagner's 1894 Teubner edition supplemented the text with Vatican and
    Sabbaitic epitomes, used extensive manuscript collation and comparison of the
    epitomes, and is said to have restored the true text in many places.
  category: action
  evidence_refs:
  - ev:7
