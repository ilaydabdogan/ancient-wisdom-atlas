  summary: The passage recounts Perseus accidentally killing Acrisius during athletic
    games, exchanging kingdoms with Megapenthes, ruling Tiryns, and having descendants
    by Andromeda. It then gives genealogies from Perseus, including Hippothoe’s abduction
    by Poseidon, the birth of Taphius, and Pterelaus’s immortality through a golden
    hair. It also recounts the descent to Alcmene and Eurystheus, and Hera’s intervention
    to delay Alcmene’s delivery so Eurystheus is born first and gains rule over Mycenae.
  language: English
  quote_policy: summarized
