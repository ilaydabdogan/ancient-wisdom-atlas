candidate_motifs:
- id: motif:1
  label: madness of women followed by ritual purification
  taxonomy_refs: []
  basis: The maidens and other women rave, abandon homes, run to the desert, and are
    finally purified through Melampus's intervention.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not state the original cause of the madness in the main
    narrative.
- id: motif:2
  label: healing exchanged for sovereignty, land, and marriage
  taxonomy_refs:
  - sacred_exchange
  - royal_legitimacy
  basis: Melampus demands sovereignty and land terms for the cure, and the recovered
    women are later given in marriage to Melampus and Bias.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The exchange is political and therapeutic; the term 'sacred_exchange'
    is interpretive because the cure is by a seer using purifications.
- id: motif:3
  label: purification after accidental homicide
  taxonomy_refs: []
  basis: Bellerophon accidentally kills his brother and comes to Proetus to be purified.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage gives only a brief notice of the purification.
- id: motif:4
  label: false accusation after rejected desire
  taxonomy_refs: []
  basis: Stheneboea desires Bellerophon, he rejects her proposal, and she accuses
    him to Proetus.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage presents the accusation sequence without extended characterization.
- id: motif:5
  label: concealed letter ordering the bearer’s death
  taxonomy_refs: []
  basis: Proetus sends Bellerophon to Iobates with a letter that instructs Iobates
    to kill him.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No taxonomy reference among the provided motif families is specific to
    this pattern.
- id: motif:6
  label: hero assigned impossible combats and rewarded with bride and kingdom
  taxonomy_refs:
  - initiation
  - royal_legitimacy
  basis: Iobates sends Bellerophon against the Chimera, the Solymi, the Amazons, and
    Lycians; after Bellerophon survives and succeeds, he receives Philonoe and the
    kingdom.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage does not explicitly frame the combats as an initiation, but
    the task sequence culminates in royal marriage and succession.
- id: motif:7
  label: aerial monster-slaying with winged mount
  taxonomy_refs:
  - ascent
  basis: Bellerophon mounts winged Pegasus, soars high, and kills the Chimera from
    above.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The 'ascent' reference is limited to tactical elevation in combat, not
    a cosmic or heavenly ascent.
- id: motif:8
  label: composite fire-breathing monster with dragon tail
  taxonomy_refs:
  - serpent
  basis: The Chimera combines lion, dragon, and goat features and breathes fire through
    the goat head.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The serpent taxonomy is based on the dragon-tail element; the passage
    does not use the word 'serpent'.
- id: motif:9
  label: fatal descendant prophecy and confinement response
  taxonomy_refs: []
  basis: The oracle says Acrisius's daughter will bear a son who will kill him, and
    Acrisius responds by building a brazen chamber.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The supplied passage ends at the beginning of the confinement episode.
comparison_claims:
- id: claim:1
  claim: The editorial note reports a parallel account in Bacchylides in which the
    daughters are healed after a vow to the Sun and divine intercession involving
    Artemis and Hera.
  claim_level: same_function
  target: Bacchylides, Epinic. x.95 sqq., as summarized in the passage note
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: This comparison rests on an editorial note, and the summarized version
    adds divine vow and intercession details not present in the main narrative.
- id: claim:2
  claim: The editorial note states that the Bellerophon story follows Homer, with
    a variant name for Proetus's wife, and lists later mythographic parallels.
  claim_level: same_motif
  target: Homer, Iliad vi.155 sqq.; Tzetzes; Zenobius; Hyginus; Vatican mythographers,
    as cited in the passage note
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The note identifies parallels but the supplied passage does not reproduce
    all cited versions.
- id: claim:3
  claim: The main text and note connect the Chimera and Bellerophon combat with nearby
    Greek epic and mythographic traditions, including Homer and Hesiod.
  claim_level: same_motif
  target: Homer, Iliad xvi.328 sq. and vi.179 sqq.; Hesiod, Theogony 319 sqq.; Pindar,
    Olympian xiii; Hyginus, Fab. 57
  evidence_refs:
  - ev:5
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The cited comparanda are given as brief references or assertions, not
    full parallel passages.
