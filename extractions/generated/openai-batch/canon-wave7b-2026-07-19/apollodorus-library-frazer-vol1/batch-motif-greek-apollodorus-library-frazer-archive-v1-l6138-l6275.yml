canonical_text:
  quote: ''
  summary: The passage recounts Melampus negotiating and carrying out the purification
    of Proetus's raving daughters and other women; Bellerophon's purification after
    an accidental killing, his rejection of Stheneboea, the false accusation and death-bearing
    letter, his battles against the Chimera and other enemies, and his reward with
    marriage and kingship; and the opening of Acrisius's response to an oracle that
    his daughter's son will kill him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Melampus is described as a seer and as the first to devise a cure by drugs
    and purifications.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Melampus offered to cure the maidens in exchange for a third part of the sovereignty;
    after Proetus delayed, Melampus also required that his brother Bias receive as
    much land as himself.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The maidens raved and ran through the desert; other women joined them, abandoned
    their houses, destroyed their own children, and flocked to the desert.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Melampus took stalwart young men and chased the women from the mountains to
    Sicyon with shouts and a frenzied dance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Iphinoe died during the pursuit; the others were purified and recovered their
    wits, and Proetus gave them in marriage to Melampus and Bias.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Bellerophon, son of Glaucus and descendant of Sisyphus, accidentally killed
    his brother and came to Proetus for purification.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Stheneboea fell in love with Bellerophon, sent him proposals for a meeting,
    and after his rejection told Proetus that Bellerophon had made a vicious proposal
    to her.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Proetus believed Stheneboea and sent Bellerophon with a letter to Iobates
    ordering Bellerophon's death.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Iobates ordered Bellerophon to fight the Chimera, expecting the beast to destroy
    him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Chimera is described as having the fore part of a lion, a dragon tail,
    and a goat's middle head that belched fire; it devastated the country and harried
    cattle.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:11
  text: Bellerophon mounted the winged steed Pegasus, soared on high, and shot down
    the Chimera from above.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Iobates next sent Bellerophon against the Solymi, the Amazons, and an ambush
    of selected Lycians; Bellerophon killed them, after which Iobates honored him,
    gave him Philonoe, and left him the kingdom.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Acrisius asked the oracle how he might get male children; the god replied
    that his daughter would bear a son who would kill him, and Acrisius began building
    a brazen chamber out of fear.
  category: sequence
  evidence_refs:
  - ev:8
