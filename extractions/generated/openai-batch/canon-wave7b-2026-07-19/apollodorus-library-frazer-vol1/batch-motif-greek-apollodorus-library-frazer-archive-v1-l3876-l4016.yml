candidate_motifs:
- id: motif:1
  label: Life bound to a burning brand
  taxonomy_refs: []
  basis: The Fates make Meleager's death depend on the burning out of a hearth-brand;
    Althaea preserves it, then burns it, immediately killing him.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:9
  confidence: high
  cautions: The supplied motif taxonomy does not include an exact 'external soul'
    or 'life-token' category.
- id: motif:2
  label: Neglected deity sends destructive animal
  taxonomy_refs:
  - divine_judgment
  basis: Oeneus forgets Artemis in the firstfruits sacrifice, and Artemis angrily
    sends a giant boar that devastates land, cattle, and people.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage presents this as divine retaliation, but does not frame it
    with a formal judgment scene.
- id: motif:3
  label: Heroic assembly for monster hunt and prize
  taxonomy_refs: []
  basis: Oeneus summons noble Greek heroes to attack the destructive boar and promises
    the skin as prize to the killer.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: No exact available taxonomy reference corresponds to a heroic hunt or
    monster-hunt prize motif.
- id: motif:4
  label: Woman hunter wins first honor and receives contested prize
  taxonomy_refs: []
  basis: Some hunters object to hunting with a woman; Atalanta is first to strike
    the boar and receives the skin, which the sons of Thestius seize from her while
    objecting to a woman receiving the prize before men.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The motif is inferred from the sequence of actions and speeches; the passage
    does not give an abstract label for it.
- id: motif:5
  label: Maternal vengeance through destruction of son's life-token
  taxonomy_refs: []
  basis: After Meleager kills Althaea's brothers, Althaea burns the brand that controls
    Meleager's life, causing his death.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: This overlaps with the external-life motif; the kinship revenge aspect
    is specific to this narrative.
- id: motif:6
  label: Angered defender withdraws and returns under supplication
  taxonomy_refs:
  - departure
  - return
  basis: In the alternate account, Meleager remains at home in anger after Althaea
    curses him, then later yields reluctantly to his wife and goes out when citizens
