canonical_text:
  quote: ''
  summary: The passage recounts Oeneus's family, Meleager's conditional life tied
    to a burning brand, Artemis's sending of a destructive boar after Oeneus omits
    her from firstfruits sacrifice, the gathering of Greek heroes for the Calydonian
    boar hunt, Atalanta's role in striking the boar, Meleager's killing of the beast
    and award of its skin to Atalanta, the dispute with the sons of Thestius, and
    Althaea's fatal burning of the brand. It also reports an alternate version in
    which the prize dispute leads to war between Curetes and Calydonians.
  language: English
  quote_policy: summarized
