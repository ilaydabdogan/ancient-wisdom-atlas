  locator: lines 3930-3938; The Library I.viii.2
  quote_or_summary: Oeneus sacrifices firstfruits to all gods but forgets Artemis;
    Artemis in wrath sends a very large and strong boar that prevents sowing and destroys
    cattle and people.
  source_text_path: texts/public-domain/greek/project-gutenberg/apollodorus-library-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 3938-3961; The Library I.viii.2
  quote_or_summary: Oeneus calls together the noblest men of Greece to attack the
    boar and promises its skin to the killer; the passage lists the assembled hunters
    and the sons of Thestius.
  source_text_path: texts/public-domain/greek/project-gutenberg/apollodorus-library-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 3961-3973; The Library I.viii.2
  quote_or_summary: After nine days of hospitality, some object to hunting with a
    woman; Meleager compels them to hunt with Atalanta, whom he desires despite being
    married to Cleopatra.
  source_text_path: texts/public-domain/greek/project-gutenberg/apollodorus-library-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 3984-3994; The Library I.viii.2-3
  quote_or_summary: In the hunt, the boar kills Hyleus and Ancaeus; Peleus accidentally
    kills Eurytion; Atalanta first shoots the boar in the back, Amphiaraus shoots
    it in the eye, and Meleager kills it by a stab in the flank and gives Atalanta
    the skin.
  source_text_path: texts/public-domain/greek/project-gutenberg/apollodorus-library-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 3994-4005; The Library I.viii.2-3
  quote_or_summary: The sons of Thestius seize the skin from Atalanta, objecting that
    a woman should receive the prize before men; Meleager kills them in rage, returns
    the skin to Atalanta, and Althaea burns the brand in grief, causing Meleager to
    die.
  source_text_path: texts/public-domain/greek/project-gutenberg/apollodorus-library-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 4006-4016; The Library I.viii.3
  quote_or_summary: An alternate account says the skin dispute leads to war between
    Curetes and Calydonians; Althaea curses Meleager, he stays home in anger, and
    later reluctantly goes out after the citizens and his wife appeal to him.
  source_text_path: texts/public-domain/greek/project-gutenberg/apollodorus-library-frazer-vol1.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: note
  locator: footnote within lines 3908-3927
  quote_or_summary: Frazer's note says the burning-brand story belongs to a widespread
    class of tales about the 'external soul,' in which a person's life is bound up
    with an animal or object outside the body.
  source_text_path: texts/public-domain/greek/project-gutenberg/apollodorus-library-frazer-vol1.md
  rights_note: Public domain source; summarized with a short quoted term.
- id: ev:10
  type: note
  locator: introductory and footnote material within lines 3876-3882 and 3908-3927
  quote_or_summary: The note compares the Meleager story with accounts in Zenobius,
    Bacchylides, Homer, Diodorus Siculus, Ovid, and others, and says Homer tells it
    without express mention of the burning brand or Meleager's death.
  source_text_path: texts/public-domain/greek/project-gutenberg/apollodorus-library-frazer-vol1.md
  rights_note: Public domain source; summarized.
