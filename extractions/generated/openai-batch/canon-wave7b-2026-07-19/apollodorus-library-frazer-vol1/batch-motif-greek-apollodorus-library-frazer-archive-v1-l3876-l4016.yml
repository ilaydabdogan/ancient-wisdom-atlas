comparison_claims:
- id: claim:1
  claim: The passage's editorial note explicitly relates the Meleager brand episode
    to the widespread tale pattern often described as an external soul, in which a
    person's life is bound to an external animal or object.
  claim_level: same_motif
  target: 'External-soul tale pattern: life bound to an external object or animal'
  evidence_refs:
  - ev:2
  - ev:7
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: This comparison is supported by Frazer's note within the supplied passage,
    but the available taxonomy list has no exact external-soul motif family.
- id: claim:2
  claim: The passage's introductory note treats the Meleager story as a narrative
    known in nearby Greek and later classical sources, while noting that Homer lacks
    express mention of the burning brand or Meleager's death.
  claim_level: same_motif
  target: Meleager narrative in Bacchylides, Homer, Diodorus Siculus, Ovid, and other
    cited classical sources
  evidence_refs:
  - ev:10
  counter_evidence_refs:
  - ev:10
  confidence: medium
  limitations: The claim relies on the passage's source note rather than on direct
    comparison of the cited texts; the note also indicates variation in whether the
    brand and death are present.
