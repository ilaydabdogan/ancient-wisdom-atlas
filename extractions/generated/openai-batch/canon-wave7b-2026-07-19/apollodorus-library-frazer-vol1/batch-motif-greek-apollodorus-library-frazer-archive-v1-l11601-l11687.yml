canonical_text:
  quote: ''
  summary: Dionysus is associated with Phrygia, receives purification, initiation
    rites, and costume from Rhea, and proceeds through Thrace. Lycurgus, king of the
    Edonians, insults and expels him; Dionysus takes refuge in the sea with Thetis
    while his Bacchanals and Satyrs are captured. The Bacchanals are later released,
    Dionysus drives Lycurgus mad, and Lycurgus kills his son Dryas with an axe while
    imagining that he is cutting a vine branch. After the land becomes barren, an
    oracle declares that it will bear fruit if Lycurgus is put to death. Frazer’s
    notes compare ancient variants and broader sacred-tree self-wounding analogies.
  language: English
  quote_policy: summarized
