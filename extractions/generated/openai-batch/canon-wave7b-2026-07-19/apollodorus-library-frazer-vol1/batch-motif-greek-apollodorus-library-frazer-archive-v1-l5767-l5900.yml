canonical_text:
  quote: ''
  summary: The passage gives a genealogy from Epaphus through Libya, Agenor, Belus,
    Egyptus, and Danaus. It recounts eponymous city, region, country, and people names;
    the settlement and rivalry of Egyptus and Danaus; Danaus's Athena-advised construction
    of the first ship and flight with his fifty daughters; his arrival at Rhodes and
    Argos; Poseidon's drying of Argive springs because of Inachus's testimony for
    Hera; Amymone's search for water, encounter with a satyr, union with Poseidon,
    and discovery of the Lerna springs; and the later marriage request and allocation
    of Danaus's daughters to the sons of Egyptus.
  language: English
  quote_policy: summarized
