comparison_claims:
- id: claim:1
  claim: The editor's note explicitly compares the Sphinx's four/two/three-support
    life-stage riddle with similar riddles reported among the Mongols of the Selenga,
    in Gascony, and among tribes of British Central Africa.
  claim_level: same_motif
  target: Life-stage riddle of four legs in childhood or morning, two in adulthood
    or midday, and three in old age or evening, as cited by Frazer outside Greece.
  evidence_refs:
  - ev:11
  - ev:5
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is from Frazer's note, not Apollodorus's narrative;
    no historical contact, borrowing, or common inheritance is demonstrated in the
    supplied passage.
- id: claim:2
  claim: The editor's note identifies the road encounter at the Cleft or Triple Way
    as a motif also treated in cited Oedipus traditions such as Sophocles, Euripides,
    and Seneca.
  claim_level: same_motif
  target: Cleft Way or Triple Way fatal encounter in nearby Greek and Latin Oedipus
    traditions cited by Frazer.
  evidence_refs:
  - ev:1
  - ev:2
  counter_evidence_refs: []
  confidence: medium
  limitations: The supplied note gives citations but not the full comparative passages,
    so the extraction can only record the editor's stated correspondence.
