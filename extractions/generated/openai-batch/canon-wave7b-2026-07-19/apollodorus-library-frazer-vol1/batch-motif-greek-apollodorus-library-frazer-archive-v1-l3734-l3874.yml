canonical_text:
  quote: ''
  summary: The passage recounts the Aloads’ attempt to reach heaven by piling mountains,
    their threats to invert sea and land, their courtship of Hera and Artemis, their
    binding of Ares, and their defeat through Hermes’ stealth and Artemis’ deer-ruse.
    It then gives genealogical material including Endymion, loved by the Moon and
    granted eternal ageless sleep by Zeus; Aetolus, whose violence and exile lead
    to the naming of Aetolia; and the Marpessa story, in which Idas abducts Marpessa
    in Poseidon’s winged chariot, Evenus dies pursuing them, Apollo contests Idas,
    and Zeus lets Marpessa choose her husband.
  language: English
  quote_policy: summarized
