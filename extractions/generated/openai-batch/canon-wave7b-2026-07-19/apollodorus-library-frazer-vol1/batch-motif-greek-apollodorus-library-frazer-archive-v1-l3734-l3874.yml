  taxonomy_refs: []
  basis: Ares is put in bonds by the Aloads and Hermes rescues him by stealth.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: No supplied taxonomy family exactly matches this captive-god rescue pattern.
- id: motif:5
  label: shapeshifted animal ruse causing mutual destruction
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Artemis changes into a deer, leaps between the Aloads, and causes them to
    throw darts at each other.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The ruse is divine and martial; the trickster taxonomy is used only for
    the deception and boundary-crossing aspect.
- id: motif:6
  label: immortal ageless sleep
  taxonomy_refs: []
  basis: Endymion chooses to sleep forever while remaining deathless and ageless.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is not described as resurrection or rebirth in the passage.
- id: motif:7
  label: beautiful mortal loved by celestial deity
  taxonomy_refs:
  - divine_beloved
  basis: Endymion’s surpassing beauty is paired with the Moon falling in love with
    him.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not elaborate the relationship beyond the Moon’s love
    and Endymion’s granted choice.
- id: motif:8
  label: divine grant of choice
  taxonomy_refs:
  - divine_judgment
  basis: Zeus allows Endymion to choose what he would and later lets Marpessa choose
    between Apollo and Idas.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: medium
  cautions: The Endymion episode is a boon, while the Marpessa episode is an arbitration;
    they share the choice-granting function but occur in different contexts.
- id: motif:9
  label: abduction of beloved in a supernatural vehicle
  taxonomy_refs:
  - stolen_beloved
  basis: Idas carries off Marpessa in a winged chariot received from Poseidon.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage does not state Marpessa’s consent at the moment of carrying
    off; her later choice favors Idas.
- id: motif:10
  label: contested bride chooses mortal over god
  taxonomy_refs:
  - divine_beloved
  - divine_judgment
  basis: Apollo and Idas fight for Marpessa; Zeus lets her choose, and she chooses
    Idas because she fears Apollo may leave her in old age.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The motive is explicitly Marpessa’s fear of abandonment in old age, not
    a general rejection of divinity.
- id: motif:11
  label: eponymous naming through death or conquest
  taxonomy_refs: []
  basis: Aetolus names Aetolia after himself after violence and exile; the river Lycormas
