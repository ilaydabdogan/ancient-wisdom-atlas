canonical_text:
  quote: ''
  summary: The passage recounts a ransom of Podarces by a female captive’s veil, Hercules’
    departure from Troy through storms and conflict at Cos, divine aid in his wound
    and his participation in the gods’ war against the giants, and Hercules’ later
    campaign against Augeas and the Molionides, ending with the taking of Elis, restoration
    of Phyleus, and institution of Olympian games and altars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A female captive awarded to Telamon chose her brother Podarces from among
    the captives; Hercules required that Podarces first be enslaved and ransomed,
    and she gave the veil from her head as the ransom.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: While Hercules was sailing from Troy, Hera sent grievous storms, and Zeus
    responded by hanging Hera from Olympus.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Coans thought Hercules was leading a piratical squadron and tried to keep
    him away with a shower of stones.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hercules forced his way into Cos, took the city by night, and killed Eurypylus,
    king of Cos, who is identified as son of Poseidon by Astypalaea.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Hercules was wounded by Chalcedon in battle, but Zeus snatched him away so
    that he took no harm.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: After laying waste Cos, Hercules came through Athena’s agency to Phlegra and
    sided with the gods in their victorious war on the giants.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Hercules collected an Arcadian army and volunteers from Greece to march against
    Augeas; Augeas appointed Eurytus and Cteatus as generals of the Eleans.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Eurytus and Cteatus are described as two men joined in one, strongest of their
    generation, sons of Actor by Molione, though Poseidon was also said to be their
    father; Actor is described as brother of Augeas.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: When Hercules fell sick during the expedition he made a truce with the Molionides,
    but after learning of his illness they attacked his army, slew many, and forced
    him to retreat.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At the third Isthmian festival, when the Eleans sent the Molionides to take
    part in sacrifices, Hercules waylaid and killed them at Cleonae.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Hercules marched on Elis, took the city, killed Augeas and his sons, restored
    Phyleus, and gave him the kingdom.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Hercules celebrated the Olympian games, founded an altar of Pelops, and built
    six altars of the twelve gods.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: A note reports variant descriptions of the Molionides as twins or conjoined
    beings, including one account in which they were born from a silver egg with equal
    heads in one body.
  category: attribute
  evidence_refs:
  - ev:10
