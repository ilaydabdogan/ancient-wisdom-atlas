candidate_motifs:
- id: motif:1
  label: ransom of captive kin by personal garment
  taxonomy_refs: []
  basis: Podarces is released from impending slavery when his sister gives her veil
    as ransom.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents a ransom exchange; it does not explicitly frame the
    veil as sacred or magical.
- id: motif:2
  label: divine punishment of a goddess by a higher god
  taxonomy_refs:
  - divine_judgment
  basis: Zeus responds to Hera’s storm-sending by hanging her from Olympus.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives the action but not an extended theological explanation.
- id: motif:3
  label: hero protected from battle wound by divine intervention
  taxonomy_refs: []
  basis: After Chalcedon wounds Hercules, Zeus snatches him away so that he takes
    no harm.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No available taxonomy reference precisely matches divine rescue from wounding.
- id: motif:4
  label: human hero joins gods in war against giants
  taxonomy_refs: []
  basis: Hercules reaches Phlegra through Athena’s agency and sides with the gods
    in their victorious war on the giants.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage states the alliance and victory briefly without narrating
    the battle in detail.
- id: motif:5
  label: conjoined or twin warrior pair of extraordinary strength
  taxonomy_refs:
  - duality
  - sacred_twins
  basis: Eurytus and Cteatus are two men joined in one and exceptionally strong; a
    note also reports twin and conjoined variants, including birth from a silver egg.
  evidence_refs:
  - ev:6
  - ev:10
  confidence: medium
  cautions: The main passage emphasizes conjoinment and strength; the explicit twin
    and silver-egg birth details occur in a note reporting variant accounts.
- id: motif:6
  label: truce violated during hero’s illness
  taxonomy_refs: []
  basis: Hercules makes a truce after falling sick, but the Molionides learn of his
    illness, attack his army, and kill many.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No available taxonomy reference precisely matches illness, truce, and
    betrayal.
- id: motif:7
  label: ambush at festival sacrifice
  taxonomy_refs:
  - sacrifice
  basis: The Molionides are sent to take part in sacrifices at the third Isthmian
    festival and are waylaid and killed by Hercules.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The sacrificial setting is explicit, but the killing itself is not described
    as a sacrifice.
- id: motif:8
  label: restoration of rightful or favored kingship after conquest
  taxonomy_refs:
  - royal_legitimacy
  basis: After taking Elis and killing Augeas and his sons, Hercules restores Phyleus
    and bestows the kingdom on him.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not explain Phyleus’ prior claim, only that Hercules
    restores him and grants the kingdom.
- id: motif:9
  label: culture hero institutes games and cultic altars
  taxonomy_refs:
  - culture_hero
  - sacrifice
  basis: Hercules celebrates the Olympian games, founds an altar of Pelops, and builds
    six altars for the twelve gods.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage is concise and does not describe the rituals in detail.
- id: motif:10
  label: divine parentage of notable warriors or rulers
  taxonomy_refs:
  - divine_parent_child
  basis: Eurypylus is identified as son of Poseidon by Astypalaea, and Poseidon is
    also reported as possible father of Eurytus and Cteatus.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: medium
  cautions: For the Molionides, divine fatherhood is presented as an alternative report
    rather than the primary parentage.
