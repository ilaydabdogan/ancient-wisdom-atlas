canonical_text:
  quote: ''
  summary: Frazer’s introductory discussion characterizes Apollodorus’s Library as
    a plain literary compilation of Greek myths and heroic legends. It notes Apollodorus’s
    rare preferences among variants, including the northern location of the Hesperidean
    apples guarded by a hundred-headed dragon and the divine adjudication of the Poseidon-Athena
    dispute over Attica. It also discusses Apollodorus’s sources, especially Pherecydes,
    and the Library’s scope from the mythical beginning of the world to the edge of
    history.
  language: English
  quote_policy: summarized
