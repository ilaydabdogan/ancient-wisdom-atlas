canonical_text:
  quote: ''
  summary: 'The passage describes the Argive assault on Thebes, with seven leaders
    placed at seven gates and Eteocles arranging Theban defenders and seeking divination.
    It then introduces Tiresias, a blind Theban soothsayer, and reports variant explanations
    for his blindness and prophetic power: one account says the gods blinded him for
    revealing their secrets; Pherecydes says Athena made him sightless after he saw
    her naked, then compensated him by enabling him to understand birds and by giving
    him a cornel-wood staff.'
  language: English
  quote_policy: summarized
