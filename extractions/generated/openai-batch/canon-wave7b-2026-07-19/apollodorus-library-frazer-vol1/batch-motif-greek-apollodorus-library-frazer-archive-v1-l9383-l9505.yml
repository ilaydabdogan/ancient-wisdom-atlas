canonical_text:
  quote: ''
  summary: The passage narrates Auge's secret childbirth, the exposure and preservation
    of the infant Telephus, Auge's transfer to Teuthras, and Hercules' contest with
    Achelous for Deianira. It also reports the exchange of Achelous' broken horn for
    the horn of Amalthea, and includes notes on Telephus' name, homicide silence,
    the underworld origin of the Deianira match in other traditions, variants of the
    Achelous combat, and traditions about Amalthea's goat or horn.
  language: English
  quote_policy: summarized
