canonical_text:
  quote: ''
  summary: 'Eurystheus assigns Hercules an eleventh labour: to fetch the golden apples
    of the Hesperides. The passage locates the apples on Atlas among the Hyperboreans,
    says Earth gave them to Zeus after his marriage with Hera, and describes their
    guardians: an immortal hundred-headed dragon, offspring of Typhon and Echidna,
    and four Hesperides. Hercules travels to the river Echedorus, where Cycnus, son
    of Ares and Pyrene, challenges him; Ares supports Cycnus, but a thunderbolt separates
    the combatants.'
  language: English
  quote_policy: summarized
