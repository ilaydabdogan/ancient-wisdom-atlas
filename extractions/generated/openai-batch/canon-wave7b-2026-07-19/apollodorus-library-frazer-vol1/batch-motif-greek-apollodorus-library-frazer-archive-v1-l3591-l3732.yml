- id: claim:2
  claim: A passage note explicitly compares the stone-born human renewal episode with
    Pindar and Hyginus.
  claim_level: same_motif
  target: Pindar, Olympian 9.41 sqq.; Hyginus, Fabulae 153
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The cited passages are not quoted in the supplied text; the claim is
    limited to the passage's bibliographic comparison.
- id: claim:3
  claim: The Alcyone and Ceyx bird-transformation episode is placed by notes alongside
    other ancient treatments, including Lucian, scholia, and Ovid.
  claim_level: same_motif
  target: Ancient treatments of Alcyone and Ceyx cited in the passage notes
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The supplied passage gives only the Apollodoran version plus citations;
    no direct comparison of narrative details is possible from this excerpt alone.
- id: claim:4
  claim: A note mentions Cerambus as another flood survivor, with escape by being
    wafted aloft over Thessalian mountains, which has the same survival-in-flood function
    but a different mechanism from Deucalion's chest.
  claim_level: same_function
  target: Cerambus flood-survival variant mentioned in the passage note
  evidence_refs:
  - ev:9
  counter_evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  limitations: 'Cerambus appears only in a footnote summary, and the main narrative
