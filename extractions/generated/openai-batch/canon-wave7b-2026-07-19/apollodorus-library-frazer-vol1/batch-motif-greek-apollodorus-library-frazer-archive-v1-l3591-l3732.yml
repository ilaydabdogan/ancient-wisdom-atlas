  claim: Frazer's notes associate the Deucalion flood account with related versions
    or discussions in Lucian, Ovid, Hyginus, Servius, and the Vatican Mythographers.
  claim_level: same_motif
  target: Deucalion flood accounts in nearby Greek and Roman sources cited in the
    passage notes
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
