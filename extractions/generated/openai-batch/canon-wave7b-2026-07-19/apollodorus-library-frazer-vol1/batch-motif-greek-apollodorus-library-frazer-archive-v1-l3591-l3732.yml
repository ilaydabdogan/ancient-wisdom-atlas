canonical_text:
  quote: ''
  summary: The passage recounts Deucalion and Pyrrha surviving a Zeus-sent flood in
    a provisioned chest, landing at Parnassus, sacrificing to Zeus, and restoring
    human beings by throwing stones over their heads. It then gives genealogies and
    eponymous origins for Greek peoples, followed by accounts of Alcyone and Ceyx
    being changed into birds for pride, and of Poseidon fathering children including
    the giant Aloads, Otus and Ephialtes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Deucalion, advised by Prometheus, constructed a chest, stored it with provisions,
    and embarked with Pyrrha.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zeus poured heavy rain from heaven and flooded much of Greece, destroying
    men except for a few who fled to high mountains.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Deucalion floated in the chest for nine days and nine nights, reached Parnassus
    after the rain ceased, landed, and sacrificed to Zeus, called the god of Escape.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Zeus sent Hermes to Deucalion and allowed him to choose what he wanted; Deucalion
    chose to get men.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Zeus's bidding, Deucalion and Pyrrha threw stones over their heads; Deucalion's
    stones became men and Pyrrha's stones became women.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage presents Deucalion and Pyrrha as parents of Hellen, Amphictyon,
    and Protogonia, and then traces named Greek peoples from Hellen and his descendants.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Hellen named those called Greeks after himself as Hellenes and divided territory
    among his sons; later names include Dorians, Achaeans, Ionians, and Aeolians.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Alcyone and Ceyx are said to have perished because they claimed divine spousal
    titles; Zeus transformed Alcyone into a kingfisher and Ceyx into a gannet.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Iphimedia loved Poseidon, drew up waves with her hands, and poured them into
    her lap; Poseidon met her and begat Otus and Ephialtes.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Otus and Ephialtes, called the Aloads, grew each year in breadth and height
    and at nine years old resolved to fight the gods.
  category: attribute
  evidence_refs:
  - ev:8
