canonical_text:
  quote: ''
  summary: 'The passage recounts part of Hercules'' cattle journey: a bull reaches
    Sicily and Italy, is taken into Eryx''s herds, and is recovered by Hercules after
    a wrestling contest in which Eryx is killed. Hera then afflicts the cattle with
    a gadfly, causing dispersion near Thrace; Hercules gathers some cattle, makes
    the Strymon unnavigable with rocks, and gives the kine to Eurystheus, who sacrifices
    them to Hera. Editorial notes discuss Roman/Italian Hercules traditions, an etymology
    of Italy, wild cattle in Thrace, and expiatory servitude cycles.'
  language: English
  quote_policy: summarized
