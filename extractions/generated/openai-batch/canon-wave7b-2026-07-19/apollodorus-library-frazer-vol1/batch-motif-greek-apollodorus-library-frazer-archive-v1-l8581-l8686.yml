canonical_text:
  quote: ''
  summary: Hercules travels through Arabia and Libya, receives a goblet from the Sun,
    kills the eagle tormenting Prometheus on Caucasus, and releases Prometheus. The
    notes discuss residual bonds and memorial customs associated with Prometheus.
    Chiron consents to die in Prometheus's stead. Prometheus advises Hercules to send
    Atlas for the apples; Hercules temporarily bears the sky, then tricks Atlas into
    taking it back. A variant says Hercules plucked the apples himself after killing
    the guardian snake, and he gives the apples to Eurystheus.
  language: English
  quote_policy: summarized
