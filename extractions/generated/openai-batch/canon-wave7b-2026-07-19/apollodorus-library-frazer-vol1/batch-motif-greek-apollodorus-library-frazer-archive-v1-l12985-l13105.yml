canonical_text:
  quote: ''
  summary: The passage recounts the mutual death of Eteocles and Polynices in single
    combat for the kingdom, further battle deaths involving the sons of Astacus, Melanippus
    wounding Tydeus, Athena’s intended gift of immortality to Tydeus, Amphiaraus giving
    Tydeus the severed head of Melanippus, Tydeus eating the brains, Athena withholding
    the benefit, and Zeus opening the earth with a thunderbolt so that Amphiaraus
    vanishes with his chariot and charioteer and is made immortal. The accompanying
    note compares Tydeus’s act with customs of consuming parts of a slain foe.
  language: English
  quote_policy: summarized
