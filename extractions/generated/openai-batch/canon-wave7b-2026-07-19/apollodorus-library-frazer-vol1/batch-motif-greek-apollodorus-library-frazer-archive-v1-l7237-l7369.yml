  quote: ''
  summary: The passage recounts Hercules' completion of the Nemean lion labor, Eurystheus'
    fearful response, the Lernaean hydra labor with Iolaus' assistance, and the capture
    of the Cerynitian hind sacred to Artemis; it begins the Erymanthian boar labor.
    Editorial notes compare the hydra and hind episodes with other ancient sources.
  language: English
  quote_policy: summarized
