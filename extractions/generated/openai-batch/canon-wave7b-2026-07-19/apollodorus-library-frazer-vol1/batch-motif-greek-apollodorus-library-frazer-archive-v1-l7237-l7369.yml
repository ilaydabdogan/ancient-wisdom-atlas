candidate_motifs:
- id: motif:1
  label: Heroic labors imposed by a fearful ruler
  taxonomy_refs:
  - initiation
  basis: Eurystheus repeatedly orders Hercules to perform labors and later judges
    whether the hydra labor counts; the repeated tasks function as trials within the
    passage.
  evidence_refs:
  - ev:3
  - ev:8
  - ev:11
  - ev:13
  confidence: medium
  cautions: The passage calls them labors, but the classification as initiation is
    a broad analytic grouping rather than an explicit label in the text.
- id: motif:2
  label: Invulnerable cave beast killed by bodily force
  taxonomy_refs: []
  basis: The Nemean lion cannot be harmed by an arrow, retreats into a two-mouthed
    cave, and is killed when Hercules strangles it.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: No external comparison is implied here beyond the literal scene.
- id: motif:3
  label: Regenerating many-headed monster defeated by fire-assisted strategy
  taxonomy_refs:
  - serpent
  basis: The hydra's smashed heads regrow two at a time until Iolaus burns the roots
    with brands; Hercules then removes and buries the immortal head.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The available taxonomy term is 'serpent'; the passage itself calls the
    creature a hydra and does not explicitly call it a serpent.
- id: motif:4
  label: Helper-assisted victory disqualified by task-giver
  taxonomy_refs: []
  basis: Iolaus' assistance enables Hercules to defeat the sprouting hydra heads,
    and Eurystheus refuses to count the labor because Hercules did not act alone.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: This is a plot pattern within the passage, not a taxonomy-matched motif.
- id: motif:5
  label: Capture of sacred animal under divine rebuke
  taxonomy_refs:
  - sacred_theft
  basis: Hercules captures the hind sacred to Artemis; Artemis confronts and rebukes
    him, but he appeases her by pleading necessity and blaming Eurystheus.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The hind is taken alive under command and with appeasement; the passage
    does not explicitly call the act theft.
- id: motif:6
  label: Sacrifice to a presumed dead hero redirected to a god
  taxonomy_refs:
  - sacrifice
  basis: Molorchus prepares a sacrifice to Hercules as to a dead man, but Hercules
    returns and sacrifices to Saviour Zeus.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage gives only a brief ritual notice.
- id: motif:7
  label: Animal opponent raised to a constellation
  taxonomy_refs:
  - ascent
  basis: The editorial note says the crab that helped the hydra was promoted by Hera
    to the rank of a constellation in the sky.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This motif is supplied by the translator's note rather than the main narrative;
    the taxonomy term 'ascent' is approximate.
- id: motif:8
  label: Ravaging boar ordered captured alive
  taxonomy_refs: []
  basis: The fourth labor begins with Eurystheus ordering Hercules to bring the Erymanthian
    boar alive; the boar ravages Psophis from Mount Erymanthus.
  evidence_refs:
  - ev:13
  confidence: low
  cautions: The passage excerpt breaks off before the boar episode develops.
comparison_claims:
- id: claim:1
  claim: The editorial note places the hydra episode in a shared ancient motif cluster
    across Euripides, Diodorus, Zenobius, Quintus Smyrnaeus, Virgil, Ovid, Hyginus,
    and Pausanias, while noting variation in the number of heads and in the detail
    of poisoned arrows.
  claim_level: same_motif
  target: Hydra traditions in cited Greek and Roman sources
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: The claim is based on the translator's comparative note included in
    the passage, not on direct quotation of the cited sources.
- id: claim:2
  claim: The note on the crab links this episode with catasterism accounts in Eratosthenes
    and Hyginus, where the crab is promoted to a constellation by Hera.
  claim_level: same_motif
  target: Crab catasterism in Eratosthenes, Catasterismi, and Hyginus, Astronomica
  evidence_refs:
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: The main narrative only says the crab aided the hydra and was killed;
    the constellation comparison comes from the editorial note.
- id: claim:3
  claim: The editorial note identifies the Cerynitian hind episode as comparable with
    accounts in Pindar, Euripides, Diodorus Siculus, Tzetzes, and Hyginus, with special
    attention to the golden-horned hind tradition.
  claim_level: same_motif
  target: Cerynitian hind traditions in cited ancient sources
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: medium
  limitations: The note is partially concerned with geographical and zoological interpretation;
    the excerpt does not provide full details from the cited sources.
