canonical_text:
  quote: ''
  summary: Agamemnon drives a violent Greek attack, killing enemies and pursuing the
    routed Trojans toward their city. Hector is preserved from death by Jove and destiny.
    Jove descends on Ida and sends Iris to tell Hector to avoid direct combat until
    Agamemnon is wounded and leaves the field; then Hector is to be strengthened and
    the Greeks driven back to their ships until night. Iris delivers the command,
    and Hector rallies the Trojans for renewed battle.
