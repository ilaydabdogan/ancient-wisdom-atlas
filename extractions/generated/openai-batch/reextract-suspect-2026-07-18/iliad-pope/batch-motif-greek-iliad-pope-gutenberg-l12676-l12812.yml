canonical_text:
  quote: ''
  summary: 'The passage narrates a fierce battle at the Greek wall: Teucer kills Imbrius,
    Hector''s spear misses Teucer and kills Amphimachus, the Greeks contest and strip
    the dead, and Imbrius is beheaded. The god of the ocean, grieving for his slain
    grandson, strengthens the Greeks and addresses Idomeneus in Thoas''s voice, urging
    him to fight. Idomeneus arms himself, returns to battle, and speaks with Meriones
    about replacing a broken spear from stored captured weapons.'
  language: English
  quote_policy: summarized
