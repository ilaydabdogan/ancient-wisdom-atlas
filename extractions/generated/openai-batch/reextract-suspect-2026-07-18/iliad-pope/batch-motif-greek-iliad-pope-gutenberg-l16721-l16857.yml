canonical_text:
  quote: ''
  summary: Zeus observes Hector wearing Achilles' armor, grants him a brief day of
    glory, and foretells that he will not return to Andromache. The armor fits Hector
    by divine command and he rallies Trojan and allied forces to capture Patroclus'
    body. Ajax and the Greeks call for aid and form around the corpse while Zeus darkens
    the battle and protects the dead from carrion birds. Hippothous drags Patroclus
    by the feet but is killed by Ajax and falls beside the body.
  language: English
  quote_policy: summarized
