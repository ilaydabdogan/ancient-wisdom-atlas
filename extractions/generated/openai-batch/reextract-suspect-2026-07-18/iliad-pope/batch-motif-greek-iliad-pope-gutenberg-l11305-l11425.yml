canonical_text:
  quote: ''
  summary: In battle, Socus wounds Ulysses, but Pallas prevents the wound from being
    mortal. Ulysses kills the fleeing Socus and speaks over him about fate, carrion
    birds, and funeral honor. Bleeding and surrounded by Trojans, Ulysses calls for
    aid; Menelaus hears and brings Ajax, who scatters the attackers and continues
    routing foes. Elsewhere Hector presses the battle, Machaon is wounded, and Nestor
    carries him to the ships. Cebriones surveys the field from Hector's car and urges
    Hector toward Ajax, recognizable by his sevenfold shield.
  language: English
  quote_policy: summarized
