canonical_text:
  quote: ''
  summary: The Spartan king reluctantly withdraws from Patroclus' despoiled body under
    Trojan pressure, seeks Ajax, and asks him to help defend the remains for return
    to Achilles. Ajax and the Spartan king guard the body while Hector's followers
    carry away the armor. Glaucus rebukes Hector for abandoning Sarpedon and proposes
    capturing Patroclus' corpse as leverage to recover Sarpedon's body and arms. Hector
    replies that Jove controls battle-fortune, rallies the allies, and puts on Achilles'
    divine armor taken from Patroclus.
  language: English
  quote_policy: summarized
