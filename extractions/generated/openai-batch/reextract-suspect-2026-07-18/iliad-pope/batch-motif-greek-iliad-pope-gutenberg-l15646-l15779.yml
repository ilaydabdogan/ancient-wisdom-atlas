canonical_text:
  quote: ''
  summary: Patroclus leads and exhorts the Greek troops, who surge from the tents
    toward the burning fleet. The sight of Achilles' shining armor makes the Trojans
    think Achilles is near, and they flee. Patroclus kills Pyrechmes and helps drive
    the Trojans from the half-burned ship. The passage then narrates a sequence of
    individual killings, including paired brothers in combat, duels, and slaughter
    compared to wolves among unguarded flocks. Ajax continues to aim at Hector, while
    Hector shields himself and remains to protect his allies.
  language: English
  quote_policy: summarized
