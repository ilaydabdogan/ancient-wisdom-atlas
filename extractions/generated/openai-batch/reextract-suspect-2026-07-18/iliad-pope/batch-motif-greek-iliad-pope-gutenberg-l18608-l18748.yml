canonical_text:
  quote: ''
  summary: Achilles mourns Patroclus, imagines grief for Peleus and Neoptolemus, and
    thinks revenge is his only comfort. Jove sends a blue-eyed goddess to preserve
    Achilles with ambrosia and nectar. The Greek host advances, Achilles arms himself
    in divine armor, takes up his unique paternal spear, mounts his chariot, and commands
    the immortal horses Xanthus and Balius not to abandon him. Xanthus, enabled by
    Juno, speaks and foretells Achilles' unavoidable death, while saying Patroclus
    fell through divine force.
  language: English
  quote_policy: summarized
