canonical_text:
  quote: ''
  summary: The passage discusses translation practice for Homeric epithets, repetitions,
    and versification; gives examples involving a mountain epithet and Apollo's far-shooting
    epithet; notes formulaic repetition in divine messages and religious ceremonies;
    compares Homer and Virgil for sound fitted to sense; and critiques prior English
    verse translators Chapman, Hobbes, and Ogilby.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says some epithets cannot preserve their image in one or two words
    and may require circumlocution; a mountain epithet translated literally as leaf-shaking
    is recast as a lofty mountain shaking its waving woods.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apollo's epithet far-shooting is described as having a literal explanation
    connected with darts and bow and an allegorical explanation connected with the
    rays of the sun.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker advises avoiding perpetual repetition of the same Homeric epithets
    while placing them where the occasion adds beauty.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Homeric repetitions are divided into whole narrations and speeches, single
    sentences, and one verse or hemistitch.
  category: other
  evidence_refs:
  - ev:4
- id: obs:5
  text: Repetition is described as fitting when used in messages from gods to men,
    from higher powers to inferiors in state concerns, or in solemn religious forms
    such as prayers and oaths.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Homer is said to apply sound to sense and vary it with each new subject; Virgil
    is named as a Latin poet eminent for the same poetic quality.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The speaker says he cannot fully do justice to Homer but hopes to produce
    a more tolerable verse translation than previous entire verse translations by
    Chapman, Hobbes, and Ogilby.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Chapman's translation is criticized for loose paraphrase, interpolations,
    mistakes, strained meanings, fustian expression, negligence, and poetic enthusiasm,
    though it is also credited with a daring fiery spirit.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hobbes is credited with a generally correct explanation of sense but criticized
    for cutting particulars, omitting beautiful material, omitting similes and sentences,
    and making careless mistakes; Ogilby's poetry is also dismissed as too mean for
    criticism.
  category: attribute
  evidence_refs:
  - ev:8
