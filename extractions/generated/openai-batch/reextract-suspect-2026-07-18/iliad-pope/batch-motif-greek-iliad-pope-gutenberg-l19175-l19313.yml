  quote: ''
  summary: A sea god intervenes in battle, hides Achilles' sight, removes a spear
    from the Dardan prince, carries the prince away, and warns him not to meet Achilles
    before the appointed time. Achilles regains sight, recognizes divine protection
    of his opponent, and rallies the Greeks. Hector rallies the Trojans, but Phoebus
    warns him to avoid single combat with Achilles. Achilles then kills Iphytion,
    Demoleon, Hippodamas, and Polydore. Polydore's death moves Hector to face Achilles,
    and Achilles challenges Hector as the killer of his friend.
  language: English
