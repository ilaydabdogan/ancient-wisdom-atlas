canonical_text:
  quote: ''
  summary: Youkahainen tells his mother that he has promised his sister Aino to Wainamoinen
    as a bride. The mother rejoices, but Aino weeps over the loss of youth and maiden
    adornment implied by wifehood. After her mother tries to console her, Aino goes
    to the birch forest, meets Wainamoinen, refuses his request that she wear her
    ornaments for him, throws away her adornments, and returns home, where father,
    brother, and sister each ask why she is weeping.
  language: English
  quote_policy: summarized
