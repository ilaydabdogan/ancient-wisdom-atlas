  summary: The preface introduces the translation of The Kalevala for English-speaking
    readers, describes Finland and the Finns, summarizes their geography, climate,
    social habits, ancient attestations, material culture references, and linguistic
    relations, and notes recurring Kalevala references to the cleansing and healing
    virtues of vapor-baths.
