canonical_text:
  quote: ''
  summary: 'The passage narrates funeral arrangements and rites for Bāli: a decorated
    ritual litter is brought, Rāma orders funeral service, Sugrīva commands royal
    obsequies, mourners process with the body, Tārā laments over Bāli, and the body
    is placed on a pyre, burned, and followed by water libations to the dead.'
  language: English
