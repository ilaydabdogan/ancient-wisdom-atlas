  summary: After the guardian goddess has been subdued, Hanumán, the Vánar chief,
    enters the city, moves through its decorated streets and houses, hears music,
    women’s song, royal praise, and prayer, observes priests, envoys, ascetic-like
    groups, armed Rákshas warriors, and the guarded palace of Rávaṇ on a mountain
    crest, then passes through the guarded bound. The passage also contains an editorial
    note omitting a later canto and quoting a brief moonlit evening sample.
