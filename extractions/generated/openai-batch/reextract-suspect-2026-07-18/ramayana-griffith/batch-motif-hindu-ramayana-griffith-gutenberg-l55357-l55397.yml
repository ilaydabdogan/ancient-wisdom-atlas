canonical_text:
  quote: ''
  summary: Rāma reverently praises the Day-God and arms himself again. Rāvaṇ, described
    as the giant chief, advances with his charioteer and attacks Rāma’s pennon and
    steeds. Heavenly protection preserves Rāma’s chariot and steeds. Rāma cuts down
    Rāvaṇ’s banner with a fiery serpent-like arrow. A later magical volley of trees,
    mountain peaks, and weapons misses Rāma but crushes many Vānars.
