canonical_text:
  quote: ''
  summary: A giant leader fights Angad and the Vánars, using arrows, mace, fists,
    sword, and shield; Angad counters with tree, rock, and hill, and finally beheads
    him. Editorial summaries recount similar sallies by Akampan and Prahasta, who
    are killed by Hanumán and Níla. Rávaṇ, enraged by the death of a chief, resolves
    to enter battle himself, rides out with his host, and is identified by Vibhishaṇ
    along with other captains in the array.
  language: English
  quote_policy: summarized
