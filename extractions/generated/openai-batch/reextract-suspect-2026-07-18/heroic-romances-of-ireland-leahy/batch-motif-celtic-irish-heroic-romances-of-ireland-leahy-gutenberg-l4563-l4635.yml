canonical_text:
  quote: ''
  summary: After the sons of Usnach have been slain, Deirdre remains in Conor's household
    for a year without laughter or relief from grief. Conor sends for Eogan, orders
    Deirdre to spend time with him, and has her placed in a chariot behind Eogan while
    Conor rides along to deliver her. She looks fiercely at both men; Conor compares
    her glance to that of a ewe between two rams. Deirdre leaps from the chariot,
    strikes her head on rocks, and dies. The passage then gives a genealogical 'Tree
    of their race' for Red Branch champions, connecting Magach, Cathbad, Rossa, Carbre,
    Cathbad's daughters, Conall, the sons of Usnach, and Cuchulain, and closes by
    saying the Third of Griefs is told.
  language: English
  quote_policy: summarized
