  summary: The preface comments on the differing tone and literary quality of several
    Irish romances, summarizing elements such as fairy vengeance, raids and forays,
    supernatural prophecies, Deirdre's lament and death, Fraech as a demi-god hero
    among fairies, fairy harpers, antiquarian insertions about old Celtic religion,
    and Fand's surrender of her lover to a mortal woman.
