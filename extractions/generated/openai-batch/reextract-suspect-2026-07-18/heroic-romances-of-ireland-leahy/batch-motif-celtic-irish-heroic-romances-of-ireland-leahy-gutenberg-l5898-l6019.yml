canonical_text:
  quote: ''
  summary: Cuchulain and Ferdia continue fighting at the ford. Ferdia wounds Cuchulain
    severely, after which Cuchulain calls for the Gae-Bulg. The passage explains the
    weapon’s manner of use and barbed effect. Cuchulain first wounds Ferdia with a
    spear and then casts the Gae-Bulg with his foot, fatally striking Ferdia. Ferdia
    declares that he is dying and reproaches Cuchulain. Cuchulain carries Ferdia’s
    body to the north side of the ford, faints or weakens from grief, and is urged
    by Laeg to rise because the men of Erin are approaching. Laeg argues that Cuchulain
    should rejoice in victory, while Cuchulain grieves for Ferdia and begins a lament.
  language: English
  quote_policy: summarized
