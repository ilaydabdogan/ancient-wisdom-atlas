canonical_text:
  quote: ''
  summary: A scholarly special note on the textual history and criticism of the “Combat
    at the Ford” episode and the Tain bo Cuailnge. It discusses differing manuscript
    versions, Zimmer’s thesis about a common source and compiler, the possible role
    of Flann of Monasterboice, linguistic dating of textual elements, and cautions
    about manuscript incompleteness and later alteration.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note describes the preceding “Combat at the Ford” episode as a famous
    example of Irish literature and as a case raising critical problems for literary
    history.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage states that two markedly different versions of the Tain bo Cuailnge
    exist: an older version represented by Leabhar na h-Uidhri and the Yellow Book
    of Lecan, and a younger version represented by the Book of Leinster.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Zimmer’s stated conclusion is that the source behind Leabhar na h-Uidhri and
    the Yellow Book of Lecan combined several descriptions of the “War,” one of which
    is represented by the Book of Leinster version.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The compiler is described as more interested in historical and antiquarian
    material than in literary finish, preferring archaic and mythical elements, inserting
    historical and antiquarian learning, and showing indifference to consistency and
    artistic finish.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Zimmer identified the compiler as Flann, Abbot of Monasterboice, who died
    in 1047 and was described as a famous representative of Irish learning in his
    day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that Zimmer’s main thesis remained unshaken even though
    his identification of the compiler was challenged.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that the common source of Leabhar na h-Uidhri and the Yellow
    Book of Lecan goes back to the early eleventh century and used texts similar to
    those in the Book of Leinster.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage states that some elements used in the eleventh-century harmony
    may be as old as the earliest Irish glosses, possibly dating to the eighth or
    seventh century.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The passage states that the Leabhar na h-Uidhri–Yellow Book of Lecan version
    of the Tain bo Cuailnge contains many such older elements and may mainly be treated
    as an eighth-century text.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage cautions that not all parts of the Leabhar na h-Uidhri–Yellow
    Book of Lecan version can be declared eighth-century and not all parts of the
    Book of Leinster version can be declared earlier than the common source.
  category: other
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage notes the possible activity of the eleventh-century compiler and
    later scribes, as well as the incompleteness of both manuscripts.
  category: other
  evidence_refs:
  - ev:7
- id: obs:12
  text: For the “Combat at the Ford,” the older redaction is said to be extant only
    in the fourteenth-century manuscript, leaving open the objection that it may have
    been introduced from the rival Leinster version.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage states that most of the Leinster version probably existed before
