candidate_motifs:
- id: motif:1
  label: Hunt leading to supernatural disorientation
  taxonomy_refs: []
  basis: A stag hunt leads Finn and Daire away from the Fianna; shifting sound and
    Druid mist leave them unable to determine direction.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not state that the stag itself is supernatural or transformed.
- id: motif:2
  label: Sleep-inducing Sidhe music at a boundary place
  taxonomy_refs: []
  basis: Near a hill, the characters hear sleepy music of the Sidhe; Finn and Daire
    fall into heavy sleep before seeing the sea-surrounded house.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: Only Finn and Daire are explicitly said to fall asleep.
- id: motif:3
  label: Sea-surrounded supernatural dwelling and forced entry
  taxonomy_refs: []
  basis: Finn and Daire wake to a large lighted house encircled by a stormy blue sea,
    and the Grey Man brings them through the waves into it.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not explicitly name the house as an Otherworld dwelling,
    though it is linked with Sidhe music and enchantment.
- id: motif:4
  label: Captivity as revenge for slain kin and allies
  taxonomy_refs: []
  basis: Ailne imprisons Finn and Daire after accusing Finn of treachery in the deaths
    of Meargach, her sons, Tailc, and Tailc's people.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: Finn disputes the charge of treachery and says the deaths occurred in
    fighting.
- id: motif:5
  label: Blameless captive released after testimony
  taxonomy_refs: []
  basis: Glanluadh explains how she became lost and met Finn; Ailne concludes that
    Glanluadh should not be punished without cause and orders her spells removed.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The exact nature of the spells is not described.
- id: motif:6
  label: Restorative enchanted cup
  taxonomy_refs: []
  basis: Ailne gives Glanluadh a drink from an enchanted cup of the Sidhe, after which
    her strength and appearance return.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The cup is used once in this passage and only for Glanluadh.
- id: motif:7
  label: Withholding and conditional granting of sustenance to captives
  taxonomy_refs: []
  basis: Finn, Daire, and Glanluadh are kept five days and nights without food or
    drink; later Ailne permits Glanluadh to bring food and drink to Finn and Daire
    while keeping them captive.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The passage does not state that the food and drink free the captives.
