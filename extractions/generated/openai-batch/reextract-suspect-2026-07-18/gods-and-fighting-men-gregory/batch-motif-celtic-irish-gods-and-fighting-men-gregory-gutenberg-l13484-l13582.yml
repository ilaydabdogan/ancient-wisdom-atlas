canonical_text:
  quote: ''
  summary: During a hunt, Finn and Daire become separated from the Fianna in a Druid
    mist, meet the lost woman Glanluadh, and are drawn by Sidhe music to a lighted
    house surrounded by sea. A Grey Man brings them inside, where Ailne, wife of Meargach,
    accuses Finn of treachery and seeks revenge for deaths connected with Meargach,
    her sons, Tailc, and his people. The Grey Man imprisons Finn, Daire, and Glanluadh.
    After five days without food, drink, or music, Ailne releases Glanluadh as blameless,
    restores her with an enchanted Sidhe cup, and allows her to bring food and drink
    to Finn and Daire while still intending to capture more of the Fianna.
  language: English
  quote_policy: summarized
