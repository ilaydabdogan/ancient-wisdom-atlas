canonical_text:
  quote: ''
  summary: A young man tells a hound that Finn has dealt treacherously with it. The
    hound turns on the King of Ulster's sons, and a dark Druid wind strips their weapons
    into a wall of fire. Three men then kill them, and the dog breathes on the bodies
    so that they become ashes. The Fianna search Ireland in companies of nine but
    find no word of the King of Ulster's sons. Finn waits at Teamhair Luachra. The
    three sons of the King of Iruath and the hound are not seen again by Finn and
    the Fianna.
  language: English
