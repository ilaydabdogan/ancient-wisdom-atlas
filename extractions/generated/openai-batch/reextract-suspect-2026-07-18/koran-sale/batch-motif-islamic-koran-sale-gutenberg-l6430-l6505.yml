literal_observations:
- id: obs:1
  text: A cited traveler reports that Mahomet commanded allowance of two, three, or
    four wives, while some Mahometans reportedly took nine wives and as many concubines
    as they could sustain.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: If divorce occurs before consummation, the woman is not required to wait a
    particular time, and the man is required to give only half the dower.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A divorced woman with a young child is to nurse the child until it is two
    years old, while the father maintains her; a widow is also obliged to nurse and
    must wait four months and ten days before remarrying.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The commentary states that the divorce, widowhood, and nursing rules are copied
    from Jewish rules, including a ninety-day waiting period and two years of maintenance
    for a nursing woman.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Sexual misconduct is described as punished by imprisonment until death in
    early Mohammedism, later by stoning for an adulteress and by one hundred stripes
    plus one year of banishment for an unmarried woman guilty of fornication.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: A she-slave convicted of adultery is assigned half the punishment of a free
    woman, namely fifty stripes and six months of banishment, and is not to be put
    to death.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Capital conviction for adultery requires four witnesses; a false accuser unable
    to produce that number receives eighty stripes and has future testimony invalidated.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: For fornication in either sex, the Koranic penalty is described as one hundred
    stripes.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: A husband accusing his wife without sufficient evidence may swear four times
    and invoke God's vengeance on the fifth; the wife can answer with similar oaths
    and imprecation, avoiding punishment though the marriage is dissolved.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says that many of the Koranic decisions agree with Jewish law,
    and it summarizes Mosaic penalties for adultery and related sexual offenses.
  category: relationship
  evidence_refs:
  - ev:7
