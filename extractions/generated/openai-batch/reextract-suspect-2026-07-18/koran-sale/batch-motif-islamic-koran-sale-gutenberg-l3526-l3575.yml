canonical_text:
  quote: ''
  summary: The passage describes the early revelation, writing, memorization, collection,
    custody, standardization, and reading of the Koran according to Sale's preliminary
    discourse. It recounts revealed passages being written by a scribe, copied or
    memorized by followers, collected after Mohammed's death by Abu Becr from written
    materials and oral reciters, kept by Hafsa, later standardized under Othmn because
    provincial copies disagreed, and read by specialists due to the absence of vowel
    marks in early Arabic writing.
  language: English
  quote_policy: summarized
