  quote: ''
  summary: The supplied excerpt contains Chapter CIX, which rejects reciprocal worship
    with unbelievers and distinguishes their religion from the speaker's religion,
    followed by Chapter CX, which announces God's assistance and victory, people entering
    God's religion in groups, and a command to praise the Lord and ask pardon. Sale's
    notes identify the occasion for Chapter CIX as a proposed exchange of worship
    by certain Koreish, identify Chapter CX's victory with the taking of Mecca and
    subsequent professions of Islam, and report a commentarial reading that Chapter
    CX warned Mohammed of his approaching death.
