  quote: ''
  summary: 'The passage surveys religious currents among Arabs before Mohammed: Persian
    introduction of Magian religion, Jewish migration and proselytizing, Abu Carb
    Asad''s introduction of Judaism among Hamyarites, Dhu Nows''s persecution by a
    pit of fire, the spread of Christianity and Jacobite Christians among Arab tribes,
    and a public Jewish-Christian disputation before a king and people.'
  language: English
  quote_policy: summarized
