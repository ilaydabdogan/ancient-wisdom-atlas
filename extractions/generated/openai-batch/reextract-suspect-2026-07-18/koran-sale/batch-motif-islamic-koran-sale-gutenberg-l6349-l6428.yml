canonical_text:
  quote: ''
  summary: The passage introduces Islamic civil law as founded on the Koran and interpreted
    by legal authorities. It summarizes rules concerning marriage, plural wives or
    concubines, divorce, remarriage after repeated divorce, women's grounds for separation,
    dowry consequences, and waiting periods after divorce. It repeatedly compares
    these legal institutions with Jewish, Pentateuchal, or Mosaic law and with decisions
    of Jewish doctors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Mohammedan civil law is founded on the precepts and
    determinations of the Koran and compares this relation to Jewish civil laws founded
    on the Pentateuch.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage says the law is variously interpreted by civilians and especially
    by four named doctors: Abu Hanfa, Malec, al Shafe, and Ebn Hanbal.'
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: 'Polygamy is described as allowed by the Koran but limited: no man may have
    more than four wives or concubines, and one wife is advised if inconvenience is
    feared.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage rejects claims of unbounded plurality and distinguishes the stated
    legal precept from the conduct of some followers and from privileges attributed
    to the prophet himself.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Mohammed's limitation of wives was directed by the decision
    of Jewish doctors, whose counsel limited wives to four though their law did not
    set a fixed number.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Divorce is described as allowed by Mohammedan law, as it was by Mosaic law,
    with a specific difference concerning remarriage.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a man divorces his wife a third time, he may not take her again until she
    has first been married and bedded by another man and then divorced by that second
    husband.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says this rule discouraged proceeding to the extremity of divorce
    and that such divorce was reckoned a disgrace.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Men are described as allowed to repudiate wives even on slight disgust, while
    women may separate only for specified causes such as ill usage, lack of maintenance,
    neglect of conjugal duty, impotency, or comparable causes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: A woman who separates is generally said to lose her dowry, while a woman divorced
    by her husband does not lose it unless guilty of impudicity or notorious disobedience.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: A divorced woman must wait for three courses, or three months in cases of
    doubt due to age, before marrying another; if pregnant she must wait until delivery.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: During the waiting term, the divorced woman may remain in the husband's house
    and is to be maintained at his expense, and turning her out before the term is
    forbidden unless she is guilty of dishonesty.
  category: sequence
  evidence_refs:
  - ev:8
