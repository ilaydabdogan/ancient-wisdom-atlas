  quote: ''
  summary: The introduction argues that Welsh topographical names often commemorate
    events or renowned persons, and that such names can support the remote antiquity
    of associated Welsh legends. It classifies examples of place-names tied to landscape
    features, artificial works, actions, and individuals, warns against excessive
    etymological interpretation, and concludes that the Mabinogion preserve an ancient
    Welsh/Celtic element related to medieval romance traditions.
  language: English
