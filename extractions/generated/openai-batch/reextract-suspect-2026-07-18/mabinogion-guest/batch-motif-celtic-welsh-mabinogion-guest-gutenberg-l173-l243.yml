canonical_text:
  quote: ''
  summary: The passage argues that several medieval authors and texts served as channels
    through which Welsh and Armoric fiction entered wider Continental and English
    romance traditions. It discusses Layamon, Gaimar, Sir Tristrem, Welsh manuscript
    witnesses such as the Red Book of Hergest, and classifies the Mabinogion into
    older Welsh-rooted tales and later tales overlaid with Norman and ecclesiastical
    elements. It also excludes some foreign-derived tales from the canon of Welsh
    romance.
  language: English
