canonical_text:
  quote: ''
  summary: Manawyddan watches a croft at midnight and sees an innumerable host of
    mice cut and carry away the ears of wheat. He catches one sluggish mouse, confines
    it in a tied glove, and declares it a thief to be hanged. Kicva advises him that
    hanging such a creature would be unseemly. Manawyddan takes the mouse to the Gorsedd
    of Narberth, prepares a hanging frame, and refuses offers from a scholar and then
    a priest to release the mouse for payment.
  language: English
