canonical_text:
  quote: ''
  summary: Cethern son of Fintan undergoes a severe three-day healing in a marrow-bath
    supplied through Cuchulain and Fingin. Still grievously wounded, he uses chariot
    parts to hold his body together, receives arms brought by his wife Finna, and
    returns to attack the men of Erin. The enemy host first deceives him with Ailill's
    royal clothing placed on a pillar-stone. After he discovers the deceit, Mane Andoe
    wears the regalia and is pursued and killed by Cethern, after which the men of
    Erin surround and kill Cethern. Finna mourns him with a funeral-song.
  language: English translation
  quote_policy: summarized
