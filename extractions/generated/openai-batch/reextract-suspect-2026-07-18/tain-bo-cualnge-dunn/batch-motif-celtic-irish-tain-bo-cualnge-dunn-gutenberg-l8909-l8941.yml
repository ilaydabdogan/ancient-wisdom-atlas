  summary: A bold young Ulster warrior, Oengus son of Oenlam Gabe, comes near the
    hosts, drives them from Moda Loga/Lugmud to Ath da Fert, and prevents their passage
    by showering them with stones. A scholarly comment says he would have killed a
    great portion of the host in single combat, but instead the host attacks him by
    ambush from all sides, and he dies in unequal combat at Ath da Fert in Sliab Fuait.
    The passage then introduces a following section about the misthrow at Belach Eoin.
