canonical_text:
  quote: ''
  summary: Fergus comes to Cuchulain, not seeking hospitality but combat. Cuchulain
    observes that Fergus lacks a real sword because Ailill had earlier replaced it
    with a wooden sword after finding Fergus at a tryst with Medb. Fergus adjures
    Cuchulain by their training and honor to give way before him, promising that he
    will later retreat before Cuchulain and cause the men of Erin to flee. Cuchulain,
    acting for Ulster's advantage, flees in his chariot before the army. The men of
    Erin rejoice and Medb urges pursuit, but Fergus refuses. The episode is called
    the White Battle because no blood was shed on weapons, and the army marches on
    to camp in Crich Roiss.
  language: English
  quote_policy: summarized
