canonical_text:
  quote: ''
  summary: Laeg comes from Cuchulain to speak with Lugaid about Ferbaeth’s death and
    the next challenger. Lugaid explains that his brother Larine is being induced
    to fight Cuchulain so that Larine’s death might provoke Lugaid into vengeance.
    Lugaid meets Cuchulain at Glen Ferbaeth and asks him, by their fellowship and
    fosterage, not to kill Larine. Cuchulain promises not to kill Larine but to punish
    him nearly to death. The next day Larine is feasted in Ailill and Medb’s tent,
    attended by Finnabair, and promised Finnabair if he brings Ailill Cuchulain’s
    head. Larine accepts and rejoices violently.
  language: English
  quote_policy: summarized
