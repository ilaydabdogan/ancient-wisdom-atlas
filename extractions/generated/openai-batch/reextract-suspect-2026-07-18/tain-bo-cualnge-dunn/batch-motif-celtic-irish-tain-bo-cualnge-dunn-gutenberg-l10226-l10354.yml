canonical_text:
  quote: ''
  summary: Ferdiad's servant reminds him of an earlier episode in which Cuchulain
    proved superior, then prepares Ferdiad to sleep and keeps guard. Cuchulain rises
    in full daylight, has his chariot harnessed, and advances to the ford, accompanied
    by martial noise and supernatural cries that increase his terror in battle. Ferdiad's
    servant hears the approach, wakes Ferdiad, and recites verses describing Cuchulain
    with hound and hawk imagery and as a bringer of defeat.
  language: English translation
  quote_policy: summarized
