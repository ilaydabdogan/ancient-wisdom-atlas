canonical_text:
  quote: ''
  summary: In this passage Cuchulain recognizes Fergus arriving in a richly described
    chariot. Cuchulain welcomes him with poor provisions that Fergus calls an outlaw's
    portion. Fergus says he has come to warn Cuchulain that Ferdiad, Cuchulain's friend,
    comrade, foster-brother, and equal in arms, will fight him in the morning. Cuchulain
    says he does not fear Ferdiad but loves him, while Fergus warns that Ferdiad has
    a horny skin or belt that weapons do not pierce. Cuchulain swears he will not
    retreat and says he has been holding back the men of Erin through the Cualnge
    cattle-raid.
  language: English
  quote_policy: summarized
