canonical_text:
  quote: ''
  summary: Fergus explains the danger of wheeled battle-towers and a pitfall tactic
    against them, then advises withdrawal. MacRoth reports a sorrowing warrior company,
    which Fergus identifies as Cuchulain's division from Murthemne. Medb boasts of
    ravaging them, while Fergus says Cuchulain has avenged them by killing many of
    her people. An uproar is identified as the wounded Cuchulain trying to go to battle
    while restrained. Two women lampoonists feign lamentation over him and report
    Ulster's defeat and losses. Conchobar then camps nearby and asks Ailill for a
    truce until sunrise.
  language: English translation
  quote_policy: summarized
