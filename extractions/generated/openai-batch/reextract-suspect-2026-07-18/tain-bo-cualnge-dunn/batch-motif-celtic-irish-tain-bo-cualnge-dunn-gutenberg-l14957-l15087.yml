- id: obs:7
  text: Sencha's battle exhortation calls Macha's kings to arise, shatter weapons,
    fight, plow the earth in anger, and strike shields.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The exhortation describes enemies slain, deep draughts of blood, queens grieving,
    and grassy sod soaked in blood.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Laeg sees the men of Erin rising together, taking shields, spears, swords,
    and helmets, and urging warriors toward battle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The men of Erin fight by smiting, battering, cutting, hewing, slaying, and
    destroying for a long time.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: When a bright cloud comes over the sun, Cuchulain asks Laeg how the Ulstermen
    are fighting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Laeg answers that the Ulstermen fight like men and describes their arms as
