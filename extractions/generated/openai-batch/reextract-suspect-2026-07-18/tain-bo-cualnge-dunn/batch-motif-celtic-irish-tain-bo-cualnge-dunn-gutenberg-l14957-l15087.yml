canonical_text:
  quote: ''
  summary: The men of Ulster rise urgently for battle around Conchobar. Conchobar
    has Sencha delay them until a favourable omen and sunlight appear, then Sencha
    exhorts them with a martial poem. Laeg reports the fighting to Cuchulain, who
    is not yet strong enough to join. The passage then describes the arrival of Norseland
    fighters and governors of the men of Erin with contingency orders involving Conchobar,
    Ailill, and Medb.
  language: English translation
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: All the men of Ulster arise at one time in the train of their king and at
    the word of their prince to prepare for battle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Ulstermen are described as naked except for their weapons, and men whose
    tent doors face east go westward through the tents rather than around them.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Cuchulain asks Laeg how the Ulstermen are rising, and Laeg reports their naked
    armed rising and their urgency.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Conchobar instructs Sencha to hold the men of Ulster back from battle until
    a good omen, a favourable portent, and full sunlight appear.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Ulstermen wait until the favourable sign comes and sunshine fills the
    province's glens, slopes, heights, and watch-towers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Conchobar then tells Sencha to rouse the men of Ulster to battle.
  category: speech
  evidence_refs:
