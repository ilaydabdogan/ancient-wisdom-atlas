canonical_text:
  quote: ''
  summary: Cuchulain reaches Ath Cruinn with Laeg and calls on the waters, heaven,
    earth, and the Cronn for aid. The Cronn is said to oppose the host, and the water
    rises. Cuchulain kills Mane at the ford, drowns or slays more of the host, parleyes
    with Lugaid about a truce, receives terms involving tokens and provisions, and
    continues killing warriors with sling and stone at named fords. Fergus warns Medb
    and Ailill that their position is dangerous, and the passage ends with an etiological
    naming of Ath Cuillne after Cuillius is slain.
  language: English
  quote_policy: summarized
