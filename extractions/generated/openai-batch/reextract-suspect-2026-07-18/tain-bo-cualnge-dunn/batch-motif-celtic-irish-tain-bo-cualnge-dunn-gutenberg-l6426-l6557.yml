  summary: The passage recounts the death of Forgemen during the driving off of the
    Brown Bull, Redg the jester's fatal demand for Cuchulain's javelin, negotiations
    and broken truces around Cuchulain's single combats, and the beginning of an attempt
    to offer Finnabair to Cuchulain so that he will keep away from the host.
  language: English translation
