literal_observations:
- id: obs:1
  text: Forgemen, the bull's cowherd or neatherd, tries to prevent the Brown Bull
    of Cualnge from being carried off; the bull is driven into a narrow gap, and the
    herd tramples Forgemen's body into the ground.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the hill is named Forgemen after this death, and that the
    host had no peril that night so long as a man was available to ward off Cuchulain
    at the ford.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men of Erin, with Medb and Ailill, say Cuchulain would not be more valiant
    than other men without his spearlet, and they send Redg to demand the light javelin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Redg asks Cuchulain for the javelin; Cuchulain refuses to give it at once
    and offers treasure instead; Redg refuses the treasure and threatens Cuchulain's
    honour unless he receives the javelin.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cuchulain hurls the javelin at Redg, killing him at the ford; the ford and
    a stream receive names connected to the event and to the javelin's copper.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ailill seeks a sword-truce and sends Lugaid to parley; Lugaid reports the
    host's complaints about Cuchulain's demands and about being killed while provisioning
    him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: For a week a man falls each day to Cuchulain; after faith is broken, twenty
    men attack him together and he destroys them all, and further named groups fall
    to him in single combat at Cronech.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At Cronech, Medb proposes asking Cuchulain for a sword-pact for the host and
    offering him half the cattle; Cuchulain agrees on condition that the bond not
    be broken the next day.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ailill proposes that Finnabair, his daughter, be offered to Cuchulain so that
    he will keep away from the hosts, and Mane Athramail is sent with the message.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Mane questions Laeg three times; Laeg identifies himself as Cuchulain's man
    and threatens to strike off Mane's head if provoked.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Cuchulain is sitting with deep snow around him up to his belt, and the snow
