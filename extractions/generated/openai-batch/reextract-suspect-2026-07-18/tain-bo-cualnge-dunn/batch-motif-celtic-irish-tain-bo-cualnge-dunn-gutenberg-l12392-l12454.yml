canonical_text:
  quote: ''
  summary: Fintan son of Niall comes with an armed company to avenge his son and defend
    Ulster’s honour. His band fights the hosts, inflicting losses but being destroyed
    except for Fintan and his son Crimthann. Crimthann is kept safe and then restored
    to Fintan in exchange for Fintan’s withdrawal until the foretold great battle.
    The dead are found with lips, noses, and ears clenched in one another’s teeth
    and tusks after weapons were exhausted, giving the episode the name “Tooth-fight”
    of Fintan.
  language: English
  quote_policy: summarized
