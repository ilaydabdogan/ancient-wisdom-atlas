canonical_text:
  quote: ''
  summary: The host is stopped at the ford called Ath Gabla by a fork or stake associated
    with Cuchulain. Fergus explains the feat by which it was driven in and the geis
    that bars passage until it is drawn out in the same one-handed manner. After breaking
    many chariots, Fergus removes it with his own chariot, gives it to Ailill, praises
    Cuchulain in a lay, and the host encamps with food, music, and tales of Cuchulain's
    feats.
  language: English
  quote_policy: summarized
