canonical_text:
  quote: ''
  summary: A ship anchors near an island inhabited by small hairy savages who seize
    the vessel and strand the sailors on another island. The sailors find a castle
    containing human bones and roasting spits. A one-eyed giant enters, selects and
    roasts the captain, and later eats another sailor. The narrator proposes making
    rafts from driftwood, and he and nine companions heat spits in the fire and blind
    the sleeping giant.
