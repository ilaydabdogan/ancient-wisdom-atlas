canonical_text:
  quote: ''
  summary: A tailor confesses that the hunchback died accidentally from a fish bone
    at supper and that he and his wife moved the corpse to the Jewish doctor's house
    to avoid blame. The chief of police prepares to hang the tailor, but the Sultan
    of Kashgar, seeking his missing jester, sends an usher who stops the execution.
    The Sultan orders all involved and the corpse brought to the palace and has the
    case recorded as the miraculous escape of four men who thought themselves murderers.
    The frame then turns to stories told before the Sultan, including the barber's
    account of his fifth brother Alnaschar, who inherits money, buys glassware, opens
    a shop, and daydreams aloud while a neighboring tailor hears him.
  language: English
  quote_policy: summarized
