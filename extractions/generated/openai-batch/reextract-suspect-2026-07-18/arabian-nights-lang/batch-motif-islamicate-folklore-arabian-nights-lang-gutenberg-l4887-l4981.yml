canonical_text:
  quote: ''
  summary: A Christian merchant is arrested after being found with a motionless hunchback
    Muslim. The Sultan orders the merchant hanged, but the Sultan's purveyor interrupts
    at the gallows and confesses. The purveyor is then to be hanged, but a Jewish
    doctor interrupts and claims responsibility, explaining a dark staircase accident
    and the disposal of the corpse through the purveyor's chimney. As the doctor is
    about to be hanged, a tailor interrupts and asks to speak.
  language: English
  quote_policy: summarized
