canonical_text:
  quote: ''
  summary: Rustem refreshes himself at a flood, prays, and regains strength. He returns
    to combat with the young warrior Sohrab, wrestles him, throws him down, and mortally
    wounds him. The dying Sohrab says fate has caused his fall and reveals that he
    had been seeking his father, Rustem. Rustem realizes the truth after Sohrab shows
    a gold bracelet given by his mother as his father's token. Rustem laments killing
    his son. Elsewhere, Persian forces see Rustem's riderless horse and report to
    the king that Rustem is dead; the king fears the loss of his champion and kingdom.
  language: English
  quote_policy: summarized
