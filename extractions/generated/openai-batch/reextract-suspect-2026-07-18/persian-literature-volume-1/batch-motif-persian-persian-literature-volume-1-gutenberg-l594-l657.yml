  summary: An introductory critical passage evaluates James Atkinson's English metrical
    and prose treatment of Firdusi's Shh Nmeh, especially the Story of Sohrab. It
    discusses translation, epic universality, literary influence, comparisons with
    Homeric, Vergilian, Dantesque, and Tennysonian examples, and the blending of prose
    and verse.
