canonical_text:
  quote: ''
  summary: A sorceress deceives Ts and other warriors with enchanted food and wine
    so that Plsam can bind them inside a fort. Zl resists the enchantment, learns
    that companions have been captured, breaks the gate, and battles Plsam until Fermurz
    takes over. Rustem arrives with Barz, fights Plsam, kills him, and then joins
    Zl and Barz against Afrsiyb's Trnian army. Ssen flees to Afrsiyb. Kai-khosru arrives
    with Persian forces; the Trnians give way, and Prn-wsah advises Afrsiyb that continuing
    the war and trusting a singing-girl's dreams risks ruin.
  language: English
  quote_policy: summarized
