canonical_text:
  quote: ''
  summary: Rustem seeks permission to fight Isfendiyr despite counsel for peace. Zl
    arms Rustem with grief, warns of disastrous outcomes, and prays to God. Rustem
    goes alone to meet Isfendiyr while the armies are held back. Isfendiyr rejects
    Rustem's proposal for a wider battle, and both principal warriors rely on divine
    support rather than human aid. They fight in single combat through successive
    weapons until both riders and horses are wounded and exhausted. Meanwhile Zra
    provokes the Irnians, Nshwer kills Alwa, and Zra kills Nshwer; the Irnian troops
    flee and many are slain, including Mehrns.
  language: English
  quote_policy: summarized
