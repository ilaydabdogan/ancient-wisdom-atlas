  quote: ''
  summary: 'The introductory note identifies two Atli poems in the Codex Regius and
    summarizes their shared narrative: the sons of Gjuki visit Atli''s court, die
    there, and their sister Guthrun, Atli''s wife, avenges them. The prose preface
    states that Guthrun kills Atli''s sons, then Atli, and burns the hall with his
    company. The first stanza begins with Atli sending the rider Knefrth to Gunnar
    at Gjuki''s home.'
