canonical_text:
  quote: ''
  summary: The passage recounts a violent confrontation at Atli's hall. A false invitation
    is exposed; Vingi is killed; Atli gathers armed men; the Niflungs fight outside
    the hall. Guthrun hears of the battle, casts off ornaments and mantle, takes a
    sword, and fights for her kin, killing two warriors including Atli's brother.
    After heavy losses, Atli and Guthrun exchange accusations over slain kin and gold.
    Atli orders Hogni's heart cut out and Gunnar bound on a gallows and cast to serpents.
    Beiti proposes substituting Hjalli for Hogni, and the terrified Hjalli begs for
    his life.
  language: English
  quote_policy: summarized
