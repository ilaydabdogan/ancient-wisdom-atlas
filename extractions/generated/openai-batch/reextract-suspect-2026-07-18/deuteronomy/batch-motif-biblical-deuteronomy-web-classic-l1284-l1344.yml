canonical_text:
  quote: ''
  summary: A sequence of laws commands restoration of lost property, aid to fallen
    animals, boundaries in clothing and mixed kinds, humane treatment of a nesting
    bird, roof safety, fringes on garments, and procedures and penalties for sexual
    accusations, adultery, rape, seduction, and incestuous union with a father’s wife.
  language: ''
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person must not ignore a brother’s straying ox, sheep, donkey, garment,
    or other lost thing, but must keep it if necessary and restore it to the owner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person must help lift up a brother’s fallen donkey or ox on the way rather
    than hiding from the situation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage forbids a woman wearing men’s clothing and a man wearing women’s
    clothing, calling such acts an abomination to Yahweh.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: When encountering a bird’s nest with a hen on young or eggs, the hen must
    be released while the young may be taken.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A new house must have a railing around the roof to prevent bloodguilt if someone
    falls.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage forbids sowing a vineyard with two kinds of seed, plowing with
    an ox and donkey together, and wearing wool and linen woven together.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The people are commanded to make fringes on the four corners of the cloak
    used as a covering.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: If a husband accuses his wife of lacking tokens of virginity, her parents
    bring the tokens to the city elders at the gate and spread the cloth before them.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: If the accusation against the young wife is false, the elders chastise the
    man, fine him one hundred shekels of silver payable to the father, and require
    that she remain his wife without divorce.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: If the accusation is true, the young lady is brought to the door of her father’s
    house and stoned by the men of her city.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: If a man is found lying with a married woman, both the man and the woman must
    die.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: If a pledged virgin and a man lie together in the city, both are brought to
    the city gate and stoned; the stated reasons are that she did not cry in the city
    and he humbled his neighbor’s wife.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: If a pledged woman is forced in the field, only the man dies; the woman has
    no death-worthy sin, and the case is compared within the passage to murder because
    she cried with no one to save her.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: If an unpledged virgin is grabbed and the pair are found, the man pays fifty
    shekels of silver to her father and must marry her without the right to divorce.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: A man is forbidden to take his father’s wife or uncover his father’s skirt.
  category: relationship
  evidence_refs:
  - ev:15
