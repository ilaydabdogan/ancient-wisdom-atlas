candidate_motifs:
- id: motif:1
  label: Neighborly restoration and aid
  taxonomy_refs: []
  basis: The law requires returning lost property and helping fallen animals rather
    than hiding from them.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is a legal-ethical pattern in the passage, not a narrative mythic
    episode.
- id: motif:2
  label: Separation of categories and mixed-kind prohibition
  taxonomy_refs: []
  basis: 'The passage forbids cross-gender clothing and multiple forms of mixing:
    seed, plow animals, and woven fibers.'
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: No broader symbolic interpretation is stated beyond the explicit legal
    prohibitions and the abomination statement for clothing.
- id: motif:3
  label: Humane release of the mother animal
  taxonomy_refs: []
  basis: The hen must be released while the young may be taken, and the passage links
    the act with well-being and prolonged days.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage frames the act as a command and promised result; it does not
    explain a mythic origin.
- id: motif:4
  label: Preventive protection against bloodguilt
  taxonomy_refs: []
  basis: The roof railing is required so that blood is not brought on the house if
    someone falls.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The motif is extracted as a legal safety-and-guilt pattern rather than
    a mythic symbol.
- id: motif:5
  label: Public gate judgment with material evidence
  taxonomy_refs:
  - divine_judgment
  basis: Parents present the cloth before elders at the city gate; elders punish the
    false accuser and impose a fine.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage shows public legal judgment; the taxonomy reference to divine
    judgment is cautious because the immediate agents are human elders.
- id: motif:6
  label: Removal of evil through communal penalty
  taxonomy_refs:
  - divine_judgment
  basis: Several sexual-law cases end with death penalties and the formula that evil
    is removed from Israel or from among the people.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage states communal punishment and removal of evil; it does not
    depict a direct divine act of judgment.
- id: motif:7
  label: Place-based distinction of guilt and rescue
  taxonomy_refs: []
  basis: The city case assigns guilt partly because the woman did not cry, while the
    field case treats the woman as guiltless because she cried and there was no one
    to save her.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: This is a legal distinction based on setting within the passage, not a
    claim about comparative tradition.
- id: motif:8
  label: Compensation and binding marriage after sexual violation
  taxonomy_refs:
  - sacred_exchange
  basis: In the unpledged-virgin case, the man gives fifty shekels to the father and
    is bound to marriage without divorce.
  evidence_refs:
  - ev:14
  confidence: low
  cautions: The taxonomy reference is weak and only reflects an exchange-like legal
    structure; the passage does not mark the exchange as sacred.
- id: motif:9
  label: Forbidden union with father’s wife
  taxonomy_refs: []
  basis: The final law forbids taking the father’s wife and uncovering the father’s
    skirt.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: No additional interpretation of the kinship prohibition is supplied in
    the passage.
