canonical_text:
  quote: ''
  summary: The passage closes with Savitri walking through a dark jungle under the
    stars and midnight, described in terms of deathless love. It then introduces the
    Pandavas' exile and required year of concealment in Virata's court, listing their
    disguises and menial roles. A cattle raid by Trigarta and Kuru forces leaves the
    Matsya capital undefended. A cowherd chief reports the theft of sixty thousand
    cattle to Prince Uttara and urges him to recover them. Uttara boasts of his martial
    ability but says he requires a skilled chariot-driver.
  language: English
  quote_policy: summarized
