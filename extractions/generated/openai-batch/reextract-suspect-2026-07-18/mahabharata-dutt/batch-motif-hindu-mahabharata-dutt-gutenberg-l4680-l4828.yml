canonical_text:
  quote: ''
  summary: After Bhishma falls, Drona is made leader of the Kuru forces and vows to
    capture Yudhishthir. Arjun reveres Drona as preceptor but vows to protect Yudhishthir.
    Abhimanyu captures Paurava and duels Jayadratha; Salya intervenes, and Bhima meets
    Salya in a mace duel that leaves both fallen, with Salya carried away. Drona continues
    pressing toward Yudhishthir until Arjun arrives with white horses and a conch.
    The next morning Drona drives against the Pandav side, Dhrishta-dyumna and Satyajit
    oppose him, Satyajit falls, and the passage begins a catalogue of Pandav chariots,
    horses, and standards.
  language: English
  quote_policy: summarized
