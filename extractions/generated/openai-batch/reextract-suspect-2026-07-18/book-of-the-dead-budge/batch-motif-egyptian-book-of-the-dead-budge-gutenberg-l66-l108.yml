canonical_text:
  quote: ''
  summary: The passage explains that “Book of the Dead” is a modern title for a miscellaneous
    collection of ancient Egyptian funerary texts composed for the benefit of the
    dead. It describes their contents as spells, incantations, hymns, litanies, magical
    formulae, names, words of power, and prayers, and notes that they were inscribed
    or painted on tomb and pyramid walls, coffins, sarcophagi, and papyrus rolls.
    It further explains that the modern title derives from nineteenth-century Egyptologists’
    translations of an Arabic term used by tomb-robbers for inscribed papyrus rolls
    found with mummies or in coffins, rather than from an ancient Egyptian title.
  language: English
  quote_policy: summarized
