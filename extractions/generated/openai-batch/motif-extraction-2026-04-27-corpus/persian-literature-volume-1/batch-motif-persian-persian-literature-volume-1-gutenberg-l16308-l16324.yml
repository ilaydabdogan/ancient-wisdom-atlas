  quote: ''
  summary: A speaker addresses the heart, warning that the path of Love involves deceit
    and risk and that those who move too swiftly will fall. Pride is compared to a
    shining bubble whose rule soon collapses and is absorbed into wine. The heart
    is urged not to display airs of grace in old age, remembering that such youthful
    ways pass. A final image contrasts a ‘black book’ of black locks closing with
    an ‘album’ that remains, though many daily extracts will pass away.
