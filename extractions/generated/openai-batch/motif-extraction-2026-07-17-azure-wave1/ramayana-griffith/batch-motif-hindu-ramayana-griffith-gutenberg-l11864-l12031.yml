canonical_text:
  quote: ''
  summary: The distressed monarch answers Queen Kaikeyí, repudiating her and her son,
    lamenting that Ráma’s consecration will be stopped, and longing to see his eldest
    son. Kaikeyí insists that Ráma be summoned, her son receive rule, and Ráma be
    sent to the woods. At dawn Vaśishṭha arrives with disciples and many ritual articles
    for Ráma’s installation, meeting Sumantra at the gate. Sumantra enters the royal
    chamber and hymns the king awake, invoking divine comparisons and blessings, and
    asks him to order Ráma’s consecration.
  language: English
  quote_policy: summarized
