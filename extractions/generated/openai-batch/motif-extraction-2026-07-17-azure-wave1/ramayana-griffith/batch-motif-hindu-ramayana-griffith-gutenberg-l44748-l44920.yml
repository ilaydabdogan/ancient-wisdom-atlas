canonical_text:
  quote: ''
  summary: Hanuman prepares on a mountain to search for a captive lady, prays to several
    deities, vows to go to Ravana's city, and leaps across the sea. The Sea asks the
    mountain Mainaka to rise from the water and offer him rest. Mainaka emerges, offers
    hospitality, and recounts how the Wind saved him when Indra cut the wings of mountains.
    Hanuman courteously declines rest and continues. The gods then ask Surasa, mother
    of the Nagas, to take a Rakshasa form and impede Hanuman to test him.
  language: English
  quote_policy: summarized
