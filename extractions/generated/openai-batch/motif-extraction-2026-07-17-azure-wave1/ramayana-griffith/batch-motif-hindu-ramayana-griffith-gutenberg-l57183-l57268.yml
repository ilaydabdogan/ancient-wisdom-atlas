canonical_text:
  quote: ''
  summary: In Appendix Section XIII, Rishyaśring undertakes a sacrifice so King Daśaratha
    may obtain sons. The assembled gods grant the request for four sons, then petition
    Brahmá about Rávaṇa, whose boon makes him invulnerable to many beings and whose
    power disrupts gods, sages, and natural forces. Brahmá notes that Rávaṇa omitted
    man from the boon, so he can be destroyed by a man. Vishṇu arrives, is asked by
    the gods to divide himself into four parts and be born as Daśaratha's son through
    the king's three consorts, and promises to incarnate among men, kill Rávaṇa and
    his associates, and protect the earth.
  language: English
  quote_policy: summarized
