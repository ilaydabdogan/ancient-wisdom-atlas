canonical_text:
  quote: ''
  summary: Vishṇu decides to divide his being into four and take birth from King Daśaratha.
    During Daśaratha’s heir-winning sacrifice, a divine envoy emerges from the sacrificial
    flame carrying a golden vessel of heavenly nectar. The envoy says the gods accept
    the rite and that the nectar will give sons. Daśaratha distributes the nectar
    among Kauśalyá, Sumitrá, and Kaikeyí, and the queens conceive. The self-existent
    Lord then instructs the gods and other beings to produce monkey-form helpers for
    Vishṇu.
  language: English
  quote_policy: summarized
