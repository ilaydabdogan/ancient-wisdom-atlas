  quote: ''
  summary: A commanding speaker sends a selected Vānar host southward to search for
    the Maithil queen. He gives a detailed itinerary through rivers, forests, caves,
    cities, mountains, oceanic islands, a serpent city, guarded groves, and finally
    the boundary near Yama’s realm, beyond which living beings may not go. He promises
    great reward and intimacy to whoever reports seeing the queen.
