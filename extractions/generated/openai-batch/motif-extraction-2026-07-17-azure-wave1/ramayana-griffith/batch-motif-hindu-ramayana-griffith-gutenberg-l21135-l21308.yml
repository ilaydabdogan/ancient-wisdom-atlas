canonical_text:
  quote: ''
  summary: After the mourning period, the prince makes large gifts to Brahmans for
    his father's obsequies, returns on the thirteenth day to the pyre, addresses his
    dead father, sees the half-burnt bones and ashes, and collapses in grief. Śatrughna
    also mourns, blames Manthará, Kaikeyí, and the king's boons for the calamity,
    and vows death by fire and withdrawal to the forest. Vaśishṭha and Sumantra counsel
    the brothers to restrain grief, gather the remaining bones, and complete the rites.
    In the next scene Śatrughna denounces Ráma's banishment, Manthará appears richly
    adorned, is seized by a sentinel, accused of causing the king's death and Ráma's
    exile, and is violently threatened while the women flee to Kauśalyá for protection.
  language: English
  quote_policy: summarized
