canonical_text:
  quote: "“The changes seen when monarchs die”"
  summary: Bharat returns to Ayodhya, observes signs of public gloom and neglected
    ritual order, fails to find his father in the palace, questions Kaikeyi, learns
    that his father the king has died, falls to the ground in grief, laments the loss,
    and is urged by Kaikeyi not to mourn.
