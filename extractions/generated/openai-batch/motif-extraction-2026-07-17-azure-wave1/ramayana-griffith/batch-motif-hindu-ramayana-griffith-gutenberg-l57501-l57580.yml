  summary: A French appendix passage recounts the gods, led by Indra, petitioning
    Brahma about Ravana’s oppressive use of a boon. Brahma identifies that humans
    were omitted from Ravana’s protection, and Vishnu/Narayana is asked to take human
    birth as Dasaratha’s son, divided among the wombs of Dasaratha’s three wives,
    in order to kill Ravana.
