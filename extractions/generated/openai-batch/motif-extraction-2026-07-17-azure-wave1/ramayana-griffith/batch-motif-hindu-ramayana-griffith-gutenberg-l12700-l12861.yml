canonical_text:
  quote: ''
  summary: Rama accepts exile to the Dandak forest for fourteen years in order to
    honor his father's promise and will. Kaikeyi urges him to depart quickly and to
    summon Bharata. King Dasaratha collapses in grief and remains speechless. Rama
    remains calm, speaks of filial duty, touches the feet of his father and Kaikeyi,
    circumambulates them, refuses royal emblems and attendants, and goes toward his
    mother's house with Lakshmana following, concealing his grief from the assembled
    people.
  language: English
  quote_policy: summarized
