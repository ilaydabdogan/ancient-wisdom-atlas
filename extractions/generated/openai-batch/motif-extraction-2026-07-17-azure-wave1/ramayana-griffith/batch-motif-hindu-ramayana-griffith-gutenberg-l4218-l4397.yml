- id: motif:2
  label: Divinely granted child with extraordinary power
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: The childless Suketu performs austerities; the Mighty Sire grants him Táḍaká,
    who receives Brahmá’s dower of strength equal to a thousand elephants.
  evidence_refs:
