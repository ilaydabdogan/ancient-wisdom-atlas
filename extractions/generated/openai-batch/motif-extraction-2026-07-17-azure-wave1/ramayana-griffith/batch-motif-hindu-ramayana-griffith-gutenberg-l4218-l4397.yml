comparison_claims:
- id: claim:1
  claim: Viśvámitra explicitly frames the proposed killing of Táḍaká as functionally
    comparable to earlier divine killings of women who threatened the earth or Indra’s
    throne.
  claim_level: same_function
  target: Manthará, Virochan’s child, slain by Indra; Kávya’s mother, Bhrigu’s wife,
    slain by Vishṇu
  evidence_refs:
  - ev:17
  counter_evidence_refs: []
  confidence: high
  limitations: This is an in-passage precedent used by the speaker to justify action;
    it is not evidence by itself for historical contact or common inheritance.
- id: claim:2
  claim: The passage presents a shared pattern of curse-induced bodily transformation
    for both Márícha and Táḍaká, though their resulting forms are described differently.
  claim_level: same_motif
  target: Márícha’s giant-form curse and Táḍaká’s man-eating-form curse within the
    same passage
  evidence_refs:
  - ev:14
  counter_evidence_refs: []
  confidence: high
  limitations: This is an intra-passage comparison only, not a cross-cultural or external
    textual comparison.
