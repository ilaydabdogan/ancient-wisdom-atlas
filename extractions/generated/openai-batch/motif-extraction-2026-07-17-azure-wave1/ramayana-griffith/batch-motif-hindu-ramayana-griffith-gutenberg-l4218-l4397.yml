canonical_text:
  quote: ''
  summary: Ráma and another prince cross to the southern shore after reverencing rivers
    and come upon a dark forest. Viśvámitra explains that the place was once the fertile
    lands Malaja and Karúsha, where Indra was purified by holy waters after killing
    Namuchi. He then recounts how the shapeshifting Táḍaká, wife of Sunda and mother
    of Márícha, desolated the region and barred the road. In response to Ráma’s question
    about her strength, Viśvámitra narrates her origin as a child granted by Brahmá
    to the ascetic Suketu, her marriage, her son’s curse, and Agastya’s curse turning
    her into a man-eating being. The sage commands Ráma to slay her for the welfare
    of Bráhmans, kine, and the land, citing earlier divine precedents; Ráma agrees
    to obey.
  language: English
  quote_policy: summarized
