canonical_text:
  quote: ''
  summary: Rama recognizes Ravana and challenges him. Ravana orders his forces to
    guard Lanka, charges through the Vanar host, and defeats several Vanar attackers
    using arrows. Lakshmana asks Rama for leave to fight. Hanuman confronts Ravana,
    citing Brahma's boon and the remaining danger posed by a Vanar; the two exchange
    blows, and Hanuman is temporarily felled. Ravana then fights Nila, whose mountain
    and tree missiles are stopped, who uses a condensed form to leap onto Ravana's
    standard, bow, and crown, and who survives a flaming dart through his father's
    might and innate power. Ravana finally turns toward Lakshmana and threatens him
    with death.
  language: English
  quote_policy: summarized
