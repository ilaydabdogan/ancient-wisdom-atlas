candidate_motifs:
- id: motif:1
  label: Boon-protected foe with an excluded vulnerable class
  taxonomy_refs: []
  basis: Hanuman says Brahma's boon shields Ravana from Yaksha, God, Gandharva, and
    fiend, but warns him to tremble before a Vanar.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The details are given in Hanuman's speech within the combat scene; the
    passage does not narrate the original granting of the boon.
- id: motif:2
  label: Forest warriors wield mountains and trees as weapons
  taxonomy_refs: []
  basis: Sugriva and other Vanars repeatedly hurl hills, a mountain peak, and uprooted
    trees at Ravana.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:9
  - ev:10
  confidence: high
  cautions: This is a passage-internal combat pattern rather than a linked taxonomy
    motif family.
- id: motif:3
  label: Successive single combats against a dominant champion
  taxonomy_refs: []
  basis: Ravana successively engages Sugriva, Hanuman, Nila, and Lakshmana, defeating
    or threatening each in turn within a battle sequence.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:13
  confidence: high
  cautions: The passage shows a sequence of combats but does not complete the final
    fight with Lakshmana in this excerpt.
- id: motif:4
  label: Combat magic through condensed form
  taxonomy_refs:
  - shapeshifter
  basis: Nila condenses his form and makes nimble leaps onto Ravana's standard, bow,
    and crown; Ravana identifies this as magic lore.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The text describes form-condensing rather than a full transformation into
    another being, so the shapeshifter taxonomy link is approximate.
- id: motif:5
  label: Seeming death followed by renewed strength
  taxonomy_refs: []
  basis: Hanuman falls with no sign of life after Ravana's blow, but later regains
    life and strength and speaks again.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage states that Hanuman showed no sign of life, not that he actually
    died; this should not be treated as a clear resurrection motif.
- id: motif:6
  label: Inherited or parental power preserves a warrior
  taxonomy_refs:
  - divine_parent_child
  basis: Hanuman is identified as the Wind-God's son, and Nila survives Ravana's flaming
    dart because of his father's might and his own innate power.
  evidence_refs:
  - ev:7
  - ev:12
  confidence: medium
  cautions: Only Hanuman's father is explicitly divine in the passage; Nila's father
    is not named here, so the taxonomy link requires review.
