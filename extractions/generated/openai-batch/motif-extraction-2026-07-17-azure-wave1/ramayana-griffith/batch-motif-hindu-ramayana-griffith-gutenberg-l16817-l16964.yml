canonical_text:
  quote: ''
  summary: The passage describes the people and sages of Ayodhya discovering that
    Ráma has gone, lamenting his absence, following his chariot tracks until they
    vanish, and returning in despair to a joyless city. In Ayodhya, households and
    women grieve; the women praise Lakshmaṇ for following Ráma and Sítá, imagine the
    forest landscape and waters as blessed by Ráma’s presence, and urge their husbands
    to go after him while they attend Sítá.
  language: English
  quote_policy: summarized
