canonical_text:
  quote: ''
  summary: Hanuman, traveling as Rama’s messenger to find Sita, is confronted first
    by a sea-rising godlike dame who demands that he enter her mouth under a boon
    from Brahma. Hanuman changes size, passes through her mouth without being eaten,
    and receives her blessing. He then flies onward, is seized by the shadow-grasping
    demon Sinhika, enters her open mouth, kills her from within, and continues until
    he reaches Lamba’s peak and sees Lanka.
  language: English
