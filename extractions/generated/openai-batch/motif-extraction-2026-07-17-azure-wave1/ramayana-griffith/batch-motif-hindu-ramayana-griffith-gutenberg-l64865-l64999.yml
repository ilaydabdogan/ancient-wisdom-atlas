comparison_claims:
- id: claim:1
  claim: The Meru cosmography in the note is explicitly supported by a citation to
    Wilson's Vishṇu Puráṇa, suggesting the same world-center mountain pattern in that
    nearby Purāṇic source.
  claim_level: same_motif
  target: Vishṇu Puráṇa Meru cosmography
  evidence_refs:
  - ev:1
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage is an editorial citation; it does not independently compare
    two full narrative passages.
- id: claim:2
  claim: The passage explicitly identifies the Rudras with storm winds more usually
    called Maruts, supporting a cautious same-function comparison between Rudras and
    Maruts as storm-wind deity groups.
  claim_level: same_function
  target: Rudras and Maruts as storm-wind deities
  evidence_refs:
  - ev:15
  counter_evidence_refs: []
  confidence: medium
  limitations: The statement is classificatory and also notes later association of
    Rudras with Śiva, so the equivalence is not exhaustive across traditions.
- id: claim:3
  claim: The cited interpretation by De Gubernatis reads Svayamprabhā as the moon
    or a good fairy connected with a golden palace and the cavern episode, but the
    footnote corrects details of that reading.
  claim_level: archetypal_reading
  target: Svayamprabhā as moon or good fairy in the cavern episode
  evidence_refs:
  - ev:10
  counter_evidence_refs:
  - ev:10
  confidence: low
  limitations: The passage itself says the interpretation is 'not quite accurate'
    and corrects the claim that she guided the searchers during the month in the cavern.
