canonical_text:
  quote: ''
  summary: A sequence of editorial footnotes explains mythic geography, divine classes,
    ritual practices, genealogies, and interpretive notes connected with the Ramayana,
    including Meru as world center, sacrifices to the Viśvadevas, storm and sea deities,
    Varuṇa's noose, mythic mountains, Svayamprabhā guiding searchers from a cavern,
    and Purandara releasing waters from cloud-cities.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Meru is described as standing at the center of Jambudwípa and the earth, with
    the sun traveling around the world while keeping Meru on its right; regions north
    of the mountain are described as dark and those south of it as light from a relative
    spectator position.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Viśvadevas are described as a class of deities to whom householders should
    offer daily sacrifices; Brahmá and the Pitris are said to have granted them this
    privilege as a reward for austerities practiced on Himálaya.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Vasus are described as original personifications of natural phenomena
    such as fire and wind, and the Maruts are described as storm-gods who attend and
    ally with Indra.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Varuṇa is described as an old and mighty Vedic deity later regarded as god
    of the sea, and his knotted noose is described as the instrument with which he
    seizes and punishes transgressors.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The passage gives divine genealogical notices: Sávarṇi is a Manu and offspring
    of the Sun by Chháyá, and Vivasvat or the Sun is father of Yáma, god of Death.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: A Himalayan pass is said to have been formed when the War-God Kártikeya and
    Paraśuráma tore a mountain asunder.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Uttara Kurus are described through a cited passage as northern peoples
    beyond Himavat consecrated to glorious dominion, while another passage treats
    them as mythological.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: Several mythic mountains are identified, including the Moon-mountain, Udayagiri
    as the hill of sunrise, Asta as the mountain of sunset, and Himálaya as the Hills
    of Snow.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: The black antelope skin is identified as an ascetic's proper garb, and Uśanas
    is identified with Śukra, preceptor of the Asuras or Daityas and possessor of
    great knowledge.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Svayamprabhā, whose name is glossed as 'self-luminous,' is discussed in relation
    to a moon interpretation; the note states that Hanumán and his companions wandered
    for a month in a vast cavern without a guide and that Svayamprabhā then led them
    out.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Purandara is glossed as destroyer of cities, with the cities interpreted as
    clouds that the god bursts open with thunderbolts to release waters imprisoned
    in fortresses of drought demons.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: Vṛihaspati is called Lord of Speech and preceptor of the gods; Śukra is called
    regent of Venus and preceptor of the Daityas; Kuśa grass is described as sacrificial
    grass used to strew the ground and purify officiants.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: Sampáti is identified as the eldest son of Garuḍa, king of birds.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: Daśaratha's action is summarized as a rash oath and fatal promise to Kaikeyí.
  category: action
  evidence_refs:
  - ev:14
