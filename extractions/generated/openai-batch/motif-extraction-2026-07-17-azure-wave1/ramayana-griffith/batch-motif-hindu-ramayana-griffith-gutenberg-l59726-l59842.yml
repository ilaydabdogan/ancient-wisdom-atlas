  summary: The passage contains editorial notes comparing Indra's loan of chariot,
    charioteer, and arms to Ráma with Venus bringing celestial arms to Æneas in the
    Æneid. It then describes Agastya's legendary role in southern India and gives
    a literal translation of the battlefield episode in which Agastya instructs the
    weary Ráma to recite and worship through the Ádityahridaya, a hymn to the rising
    Sun, in order to gain victory over Rávaṇa.
