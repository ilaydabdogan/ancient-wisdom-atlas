canonical_text:
  quote: ''
  summary: Guha hears Bharat and orders his people to gather boats to ferry the army.
    Five hundred decorated boats are prepared, and Bharat, Śatrughna, royal women,
    priests, elders, Brahmans, soldiers, animals, chariots, baggage, and wealth cross
    the Gangá by boats and other means. The host reaches Prayága’s wood at an auspicious
    hour; Bharat lets the weary men rest and goes with priest and deacon to Bharadvāja’s
    dwelling.
  language: English
  quote_policy: summarized
