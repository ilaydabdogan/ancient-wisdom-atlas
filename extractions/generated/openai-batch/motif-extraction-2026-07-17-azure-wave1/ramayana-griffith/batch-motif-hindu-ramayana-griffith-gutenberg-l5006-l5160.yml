canonical_text:
  quote: "“Since then, because the Wind-God bent / The damsels’ forms for punishment,
    / That royal town is known to fame / By Kanyákubja’s borrowed name.”"
  summary: The passage recounts King Kuśa’s royal lineage, the founding of several
    cities by his sons, the landscape of Vasu’s Magadh domain, and the story of Kuśanábha’s
    hundred daughters. The Wind-God proposes marriage to all the daughters and offers
    immortality, but they refuse without their father’s consent. In anger he bends
    their bodies. Their father praises their patience and filial honor, consults ministers
    about their marriage, and the town receives the name Kanyákubja because of the
    bent maidens.
  language: English
