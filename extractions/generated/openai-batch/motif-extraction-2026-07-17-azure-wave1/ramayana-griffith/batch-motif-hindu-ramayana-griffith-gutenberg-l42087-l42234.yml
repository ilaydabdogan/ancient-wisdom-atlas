canonical_text:
  quote: "“His foeman Rávaṇ shall be slain, / And Sítá shall be his again.”"
  summary: Tárá addresses the angry Lakshmaṇ, defends Sugríva against charges of ingratitude,
    explains his delay as arising from renewed pleasure after hardship, urges Lakshmaṇ
    to calm his wrath, and reports that forces are being assembled against Lanká.
    Lakshmaṇ is appeased. Sugríva casts aside his garland, acknowledges his debt to
    Ráma, praises Ráma's power, promises to bring his legions against Rávaṇ, and asks
    forgiveness. Lakshmaṇ accepts him as Ráma's friend and ally and asks him to comfort
    the grieving Ráma.
  language: English
  quote_policy: quoted
