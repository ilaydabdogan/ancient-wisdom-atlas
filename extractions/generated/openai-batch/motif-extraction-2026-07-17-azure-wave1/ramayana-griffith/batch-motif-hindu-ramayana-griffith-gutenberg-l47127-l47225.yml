canonical_text:
  quote: ''
  summary: In the Asoka grove, the crashing of trees and cries of birds awaken Rākshas
    warders, who see Hanuman standing amid the ruined wood. Hanuman enlarges himself
    to frighten them. The warders question Sita, who says she cannot identify the
    being and notes that the fiends themselves can change form. Some warders surround
    Sita while others report to Ravana that a powerful monkey-like creature has spoken
    with her, perhaps as a messenger of Indra, Kuvera, or Rama. Ravana sends a large
    armed force of Kinkars to seize Hanuman. Hanuman roars, proclaims loyalty to Rama
    and Lakshman, identifies himself as the Wind-God’s son, threatens Ravana’s city,
    and defeats the attackers. Ravana then sends Prahasta’s son to fight.
  language: English
  quote_policy: summarized
