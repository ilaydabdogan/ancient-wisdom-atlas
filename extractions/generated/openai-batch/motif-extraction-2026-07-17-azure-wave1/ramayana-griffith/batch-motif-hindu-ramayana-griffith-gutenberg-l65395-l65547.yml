  summary: 'A sequence of editorial footnotes explains names, variant readings, metaphors,
    mythological identifications, and literary parallels in the Ramayan: divine weapons
    and vehicles, Ravan''s heads, Bali and Vishnu''s dwarf incarnation, Hanuman''s
    binding, hells, fire imagery, sky-lake imagery, serpent beings, constellation
    ascent, sacrificial fire, and comparisons to Homer, Spenser, and Milton.'
