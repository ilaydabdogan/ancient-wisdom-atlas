canonical_text:
  quote: ''
  summary: Sampáti tells the Vánars that he saw Rávaṇ carrying Sítá through the air
    and locates her in Lanká beyond the southern ocean. He describes aerial realms,
    vulture far-sight, and instructs the Vánars to cross the sea, find Sítá, and return.
    He then recounts how his son Supárśva saw the same abduction from Mahendra’s height,
    with holy spirits identifying Sítá and her captor.
  language: English
