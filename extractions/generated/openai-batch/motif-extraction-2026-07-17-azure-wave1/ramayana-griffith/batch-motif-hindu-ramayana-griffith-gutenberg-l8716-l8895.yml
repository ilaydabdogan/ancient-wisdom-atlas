canonical_text:
  quote: ''
  summary: Janak sends for his brother Kushadhwaj, then the two brothers summon Dasharatha,
    his sons, sages, ministers, and peers. Dasharatha asks Vasishtha to speak for
    the Ikshvaku line. Vasishtha recites a royal genealogy from Brahma and Manu through
    Ikshvaku to Dasharatha, including the episode of Asit’s exile, Kalindi’s poisoned
    pregnancy, Chyavan’s prophecy, and Sagar’s birth. Vasishtha concludes by claiming
    Janak’s daughters as wives for Rama and Lakshman.
  language: English
  quote_policy: summarized
