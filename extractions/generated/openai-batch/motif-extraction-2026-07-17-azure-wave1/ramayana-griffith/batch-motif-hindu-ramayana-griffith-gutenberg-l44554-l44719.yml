canonical_text:
  quote: "“Down in a cave beneath the earth / The happy mother gave thee birth.”"
  summary: An unnamed old Vánar chieftain exhorts Hanumán by recalling his divine
    birth from Anjaná and the Wind-God, his childhood leap toward the sun, his injury
    by Indra, and the boons that made him hard to harm. The speaker urges Hanumán
    to leap over the ocean. Hanumán grows to gigantic size, receives the Vánars’ praise,
    and declares his power to cross sky, mountain, sea, and sun-path, find the Maithil
    lady, and destroy Lanká’s walls.
  language: English
  quote_policy: quoted
