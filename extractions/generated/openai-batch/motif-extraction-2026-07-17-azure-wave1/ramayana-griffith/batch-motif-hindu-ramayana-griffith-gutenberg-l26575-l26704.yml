canonical_text:
  quote: "“No arms may take in battle strife: / Now dig we in this grove a pit”"
  summary: Rāma and Lakṣmaṇ fight the giant Virādha, whose charmed life cannot be
    ended by weapons. Rāma proposes that they dig a pit and bury him. The defeated
    giant reveals that he was formerly Tumburu, cursed by Kuvera into a hideous form,
    and that Rāma’s destruction of him will restore him to heaven. After directing
    Rāma toward the hermit Śarabhanga, Virādha is buried in the pit and dies beneath
    the ground; the princes then continue through the forest.
  language: English
  quote_policy: quoted
