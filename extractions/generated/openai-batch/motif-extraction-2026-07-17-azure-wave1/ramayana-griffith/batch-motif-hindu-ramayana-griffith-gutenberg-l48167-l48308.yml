canonical_text:
  quote: ''
  summary: Rāma hears Hanumān’s report, praises his feat of crossing the sea and finding
    Sītā, but worries how the army can cross to Rāvaṇ’s island. Sugrīva counsels courage
    and advises building a bridge across the sea to reach Laṅkā. Rāma asks Hanumān
    to describe Laṅkā, and Hanumān reports its gates, walls, moats, defenders, and
    his prior destruction and burning of its fortifications, then urges the Vānar
    host to set out.
  language: English
  quote_policy: summarized
