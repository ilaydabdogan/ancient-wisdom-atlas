canonical_text:
  quote: ''
  summary: Rishyaśring and Śāntā depart toward a forest hermitage with royal attendance.
    Daśaratha and his queens give an emotional farewell; the queens bless Śāntā and
    urge her to honor her husband and his father. Daśaratha reverently honors Rishyaśring
    and returns home expecting promised sons from his queens. Rishyaśring later enters
    Champā and is honored by King Lomapād. A Brahman messenger tells Rishyaśring’s
    father that the rites are complete and the sacrificial steed has been slain; the
    father sets out with disciples and is honored by villagers.
  language: English
