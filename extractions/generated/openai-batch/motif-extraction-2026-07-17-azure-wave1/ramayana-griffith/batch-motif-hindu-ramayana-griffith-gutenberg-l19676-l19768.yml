canonical_text:
  quote: ''
  summary: Kauśalyā mourns the dead king Daśaratha, accuses Kaikeyī of causing his
    death and Rāma’s banishment, imagines Sītā’s suffering in the forest, and declares
    that she will enter the funeral fire with her husband. Attendants remove her from
    the body. The king is placed in a cask of oil and funeral rites are performed,
    but the lords delay cremation until his son returns. The royal women lament, accuse
    Kaikeyī, and the city of Ayodhyā is described as dark and bereaved after the king
    has gone to heaven.
  language: English
  quote_policy: summarized
