canonical_text:
  quote: ''
  summary: The king laments Ráma’s exile, blames Kaikeyí and fate, asks that Ráma
    be brought back or that he be taken to see Ráma, Sítá, and Lakshmaṇ, and describes
    his sorrow as an overwhelming sea before collapsing. Queen Kauśalyá asks Sumantra
    to take her to the exiles in Daṇḍak forest or she will die. Sumantra consoles
    her by reporting that Ráma, Lakshmaṇ, and Sítá live in the forest with courage
    and joy, preserving the father’s honor and following an ancient saintly path,
    though Kauśalyá continues to lament.
  language: English
  quote_policy: summarized
