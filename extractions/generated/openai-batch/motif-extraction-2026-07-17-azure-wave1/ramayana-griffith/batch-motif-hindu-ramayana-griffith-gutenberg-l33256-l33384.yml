canonical_text:
  quote: ''
  summary: Rávaṇ battles the vulture king while carrying Sítá away. The vulture endures
    arrows, breaks Rávaṇ’s weapons, chariot, team, and royal emblems, and attacks
    the driver. Rávaṇ again attempts to carry Sítá through the air. Though aged and
    weakening, the vulture rises again to block him and warns that stealing Ráma’s
    wife will bring ruin and the fruits of guilty deeds.
  language: English
  quote_policy: summarized
