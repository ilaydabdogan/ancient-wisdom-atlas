canonical_text:
  quote: ''
  summary: Rākshasa counsellors propose deceptive and direct attacks against Rāma’s
    allies. Vibhishaṇ urges Rāvaṇ to restore captive Sītā, warning that Rāma, Hanumān,
    Sugrīva, Lakshmaṇ, and the Vānars cannot safely be opposed. The next morning Vibhishaṇ
    visits Rāvaṇ’s palace, describes ominous disorders in sacrificial rites, animals,
    birds, and the city, and again urges Sītā’s restoration as atonement. Rāvaṇ reacts
    with anger.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unnamed Rākshasa speaker proposes that thousands of the host assume youthful
    human forms and falsely claim to have been sent by Bharat to aid Rāma.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same speaker proposes that, after the deception is believed, armed Rākshasa
    forces attack the Vānar army with weapons, steel, and stones.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Nikumbha declares that he alone will take the field against Raghu’s son and
    tells the chiefs to remain by the monarch.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: A group of warriors promises to slay Sugrīva, Raghu’s sons, and Hanumān, whom
    they identify as the spoiler of their golden town.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Vibhishaṇ joins his palms in reverence and tries to calm the chieftains’ fury.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Vibhishaṇ says Rāvaṇ stole the woman loved by Raghu’s son and keeps her in
    his citadel, and he urges her restoration before Rāma and the Vānars attack Lanka.
  category: speech
  evidence_refs:
  - ev:5
