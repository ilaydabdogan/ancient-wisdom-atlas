  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Vibhishaṇ reports that since Rāma’s queen has been captive in Rāvaṇ’s house,
    disastrous omens have appeared: sacrificial flames have become smoky and faint,
    offerings fail, ants and serpents enter the consecrated hall, domestic animals
    suffer, birds gather fiercely, and jackals, wolves, and hyenas haunt the city
    gates.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'Vibhishaṇ says that one atonement remains: restore the Maithil dame and obtain
