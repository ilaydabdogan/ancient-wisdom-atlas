  text: Rāvaṇ gives no answer to Vibhishaṇ’s first counsel, closes the council, and
    goes to his chamber.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: At morning, Vibhishaṇ goes to his brother’s palace, which is described as
    vast, richly adorned, filled with nobles, retinue, music, women, praise, priests,
    and ritual offerings.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: Vibhishaṇ bows to Rāvaṇ on his throne, blesses him, sits where Rāvaṇ can see
