canonical_text:
  quote: ''
  summary: Ráma searches the ground after Sítá's disappearance and finds footprints,
    Sítá's ornaments, and remains of a battle. He infers that shapeshifting giants
    or fiends have seized, slain, eaten, or stolen her. In grief and rage he threatens
    to destroy fiends, gods, living beings, and the worlds unless Sítá is restored.
    He takes up his bow, is compared to Rudra preparing to slay Tripur, and renews
    his threat of world-destruction.
