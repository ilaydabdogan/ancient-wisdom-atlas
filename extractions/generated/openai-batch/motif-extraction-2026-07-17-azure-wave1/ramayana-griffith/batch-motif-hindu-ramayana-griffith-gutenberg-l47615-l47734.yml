canonical_text:
  quote: ''
  summary: Hanuman explains that he is a Vanar and messenger from Rama and Sugriva,
    admits ruining the grove to gain audience with Ravana, and says divine or demonic
    bonds cannot hold him because of a boon. He urges Ravana to return the Maithil
    queen unharmed, warns that Rama and his allies can destroy him, compares the captive
    queen to a deadly snake, and foretells Lanka’s burning if Ravana refuses. Ravana
    orders Hanuman killed, but Vibhishana argues from ancient law that an envoy must
    be spared, though he may be punished.
  language: English
  quote_policy: summarized
