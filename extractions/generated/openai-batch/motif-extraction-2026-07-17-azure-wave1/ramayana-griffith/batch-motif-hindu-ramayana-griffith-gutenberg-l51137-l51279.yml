canonical_text:
  quote: ''
  summary: Saramā hears the noise of armies and tells Sītā that Laṅkā’s troops are
    fearful and that Rāma will free her. She offers to fly unseen and learn Rāvaṇ’s
    plans. Sītā asks her to discover the plots of the lord of Laṅkā. Saramā reports
    that Rāvaṇ’s mother and elder nobles urged him to return Sītā, but he refused.
    War sounds from the approaching enemy shake Laṅkā; Rāvaṇ briefly fears, regains
    pride, and addresses his counsellors about Rāma’s army and bridge to Laṅkā.
  language: English
  quote_policy: summarized
