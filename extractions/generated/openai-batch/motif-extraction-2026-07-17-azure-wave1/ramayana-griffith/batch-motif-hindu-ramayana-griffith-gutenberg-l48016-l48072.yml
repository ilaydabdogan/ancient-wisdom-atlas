canonical_text:
  quote: ''
  summary: The Vánars fly through the air to a guarded honey grove belonging to Sugríva.
    With Angad's consent they eat the honey and fruit, become intoxicated and exuberant,
    and damage the trees. Dadhimukh, the grove's guardian and Sugríva's uncle, tries
    to stop them but is beaten. A prose note says Dadhimukh reports the misconduct
    to Sugríva, who interprets the riotous joy as evidence that Hanumán's search party
    has succeeded, and sends Dadhimukh back to hurry the monkeys onward.
  language: English
