canonical_text:
  quote: ''
  summary: Vaśishṭha leads the royal widows toward Rāma’s hermitage. Kauśalyā observes
    the stream used by the brothers and the humble funeral offering Rāma has made
    for his deceased father. The queens meet Rāma, Lakṣmaṇ, and Sītā with grief and
    affection. Rāma reveres Vaśishṭha, Bharata sits humbly with the royal assembly,
    and Bharata asks Rāma to take back the government and return as rightful king.
  language: English
  quote_policy: summarized
