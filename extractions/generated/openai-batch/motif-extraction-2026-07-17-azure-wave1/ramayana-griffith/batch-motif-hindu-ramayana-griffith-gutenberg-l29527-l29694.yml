canonical_text:
  quote: "“the prince oppose / His single might to myriad foes”"
  summary: Khara and his demon host attack Ráma near his leafy shed. Ráma stands alone
    with his bow, endures volleys of weapons, and answers with overwhelming arrows
    that kill many giants. Dúshaṇ rallies the remaining demons, who attack again with
    weapons, rocks, and trees, but Ráma surrounds the field with arrow fire, uses
    the Gandharva arrow, and leaves the battlefield covered with the dead and shattered
    war gear.
  language: English
  quote_policy: quoted
