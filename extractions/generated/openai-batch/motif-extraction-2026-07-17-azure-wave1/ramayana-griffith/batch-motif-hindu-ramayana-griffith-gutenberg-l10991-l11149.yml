canonical_text:
  quote: |-
    Or, Ráma banished as we planned,
    My son made king shall rule the land.
  summary: Kaikeyí, following the hump-backed maid’s counsel, enters the mourner’s
    room, casts off ornaments, lies on the floor, and resolves that Ráma must be banished
    and Bharat made king. Daśaratha, having arranged Ráma’s installation, comes to
    Kaikeyí’s palace, learns from a warder that she is in the mourner’s cell, and
    finds her lying on the ground in grief-like display.
  language: English
