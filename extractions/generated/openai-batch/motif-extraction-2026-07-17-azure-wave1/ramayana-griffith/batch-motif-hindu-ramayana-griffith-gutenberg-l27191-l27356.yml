canonical_text:
  quote: ''
  summary: Sítá warns Ráma against unprovoked violence while he travels armed in Daṇḍak
    wood. She lists three desire-born sins, recounts the tale of the hermit Śuchi
    corrupted by keeping Indra’s sword, and urges Ráma to follow the forest rule of
    ascetic restraint. Ráma replies that the hermits of Daṇḍak wood asked for his
    protection because fiends kill and eat them, and that he has promised them aid.
  language: English
  quote_policy: summarized
