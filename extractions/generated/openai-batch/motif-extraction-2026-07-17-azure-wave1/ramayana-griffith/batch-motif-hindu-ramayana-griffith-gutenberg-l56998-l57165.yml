canonical_text:
  quote: ''
  summary: Bharat asks Ráma to resume the restored realm and undergo royal consecration.
    Ráma returns toward Ayodhyá in a royal procession with Sítá, his brothers, Vánar
    allies, attendants, Bráhmans, cattle, maidens, music, flags, and crowds. Sugríva
    sends Vánar envoys to gather water from the seas and many floods. Vaśishṭha and
    other sages place Ráma and Sítá on a jeweled throne and consecrate Ráma with sacred
    drops, after which an ancestral diadem, royal emblems, divine gifts, celestial
    celebration, renewed fertility, and royal largess appear. Ráma gives gifts to
    allies and Sítá gives her pearl chain to Hanúmán as a faithful friend.
  language: English
  quote_policy: summarized
