canonical_text:
  quote: ''
  summary: Ráma and Sítá rest near a rill on a mountain. Bharat’s approaching army
    raises dust and noise, frightening many forest creatures. Ráma asks Lakshmaṇ to
    discover the cause. Lakshmaṇ climbs a Sál tree, sees an armed force with banners,
    warns Ráma to put out the fire, shelter Sítá in a cave, and prepare weapons. When
    Ráma asks who leads the army, Lakshmaṇ identifies Bharat by his banner and angrily
    interprets the approach as a hostile royal threat, vowing to kill Bharat, Kaikeyí,
    and the army.
  language: English
