canonical_text:
  quote: ''
  summary: A Vánar views the ornate fortified city from the rampart. The city’s guardian
    Goddess, appearing like a Rákshas woman, confronts him at the gate and forbids
    entry in Rávaṇ’s name. She identifies herself as Lanká, guardian of the town.
    The Vánar says he will see the golden city, wander through it, and return home.
    She strikes him; he fells her with his fist but repents and spares her. She then
    reports Brahmá’s prophecy that defeat by a Vánar marks the giants’ coming fear
    and defeat, and she declares that ruin will fall on Rávaṇ, his town, and all for
    Sítá’s sake.
  language: English
  quote_policy: summarized
