canonical_text:
  quote: ''
  summary: Rama orders the Vanara host to march south toward the coast for war against
    Ravana, who has stolen his queen. He assigns commanders to the vanguard, flanks,
    center, and rear. The Vanaras mobilize from mountains, caves, and forests, foraging
    and shouting against Ravana as they advance. Lakshman, borne on Angad, consoles
    Rama by predicting the recovery of the queen, Ravana's death, and a triumphant
    return to Ayodhya, citing favorable celestial and natural omens.
  language: English
