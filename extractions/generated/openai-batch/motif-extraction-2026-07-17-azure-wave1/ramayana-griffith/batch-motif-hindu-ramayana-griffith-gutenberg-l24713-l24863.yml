canonical_text:
  quote: ''
  summary: 'Rāma answers Bharata by explaining the king’s oath and boons to Kaikeyī,
    his own fourteen-year forest exile with Lakṣmaṇa and Sītā, and Bharata’s duty
    to rule Ayodhyā while preserving their father’s promise. Rāma cites a doctrine
    that a son frees his father from infernal pains through ancestral rites at Gayā.
    He then sets out separate paths: Bharata should return to Ayodhyā with Śatrughna,
    while Rāma goes to Daṇḍaka forest. Jāvāli then speaks against this duty, arguing
    that kinship is transient, the dead have no claim, funeral offerings are useless,
    no future life exists, and Rāma should accept the throne and present royal enjoyment.'
  language: English
  quote_policy: summarized
