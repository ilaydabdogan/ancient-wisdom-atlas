canonical_text:
  quote: ''
  summary: After the nuptial events, Viśvámitra departs and Janak gives rich dowers
    as Daśaratha travels home with sons, seers, and army. Ominous birds, frightened
    beasts, and a violent tempest precede the appearance of Jamadagni’s son, Bhrigu’s
    son, a fearsome axe- and bow-bearing figure associated with hostility toward warriors.
    The saints confer in fear, approach him with a gift, and he begins to speak to
    Ráma.
  language: English
  quote_policy: summarized
