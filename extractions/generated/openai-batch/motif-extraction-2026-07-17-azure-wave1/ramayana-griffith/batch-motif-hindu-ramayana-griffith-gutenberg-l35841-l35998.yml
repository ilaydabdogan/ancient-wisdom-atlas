canonical_text:
  quote: ''
  summary: Rama and Lakshman travel through difficult forests while seeking Sita.
    They find a dark cave where the giantess Ayomukhi seizes and woos Lakshman; Lakshman
    wounds her and she flees. Lakshman then warns Rama of bad omens, including an
    ill-omened bird. The brothers hear a destructive sound, discover a huge headless
    fiend with a chest-eye, mouth below the waist, and league-long arms, and are seized
    in his grasp.
  language: English
