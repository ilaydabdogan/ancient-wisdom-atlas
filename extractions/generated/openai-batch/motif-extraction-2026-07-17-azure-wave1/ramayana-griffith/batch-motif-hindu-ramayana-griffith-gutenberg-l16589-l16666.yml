canonical_text:
  quote: ''
  summary: Ráma, still intent on his journey to the wood, leaves his chariot and walks
    beside aged Bráhmans who are following him. The Bráhmans plead for him to return,
    saying they bring their worship fires, sacrificial canopies, Vedic learning, and
    unfinished rites with him. They describe trees, birds, and all living things as
    grieving for him. Tamasá is personified as seeming to check his progress, while
    Sumantra tends the horses by the riverside.
  language: English
