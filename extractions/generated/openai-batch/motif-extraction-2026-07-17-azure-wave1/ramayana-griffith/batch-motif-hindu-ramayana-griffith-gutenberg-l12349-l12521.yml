canonical_text:
  quote: ''
  summary: Sítá blesses Ráma’s expected consecration and invokes divine guardians
    for him. Ráma leaves the hall, is joined by Lakshmaṇ, mounts a radiant royal car,
    and proceeds through the city amid elephants, warriors, music, flowers, and public
    praise. Citizens ask him to become their guardian and anointed king in the ancestral
    line. Ráma salutes the people, reverently passes shrines, altars, divine houses,
    crossroads, and sacred trees, then enters his father’s palace alone while the
    crowd waits for his return.
  language: English
  quote_policy: summarized
