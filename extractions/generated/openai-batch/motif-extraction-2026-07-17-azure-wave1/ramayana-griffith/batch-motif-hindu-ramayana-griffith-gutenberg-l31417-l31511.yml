canonical_text:
  quote: ''
  summary: A first-person speaker recounts how Ráma, lent by a monarch to the hermit
    Viśvámitra, guarded rites in Daṇḍak wood. When the speaker attacked with an axe,
    Ráma shot him into the ocean but spared his life, while the speaker’s band was
    slain. The speaker then warns a king connected with Lanká not to fight Ráma or
    seize Sítá, predicting the destruction and burning of Lanká, the death or flight
    of giants, and the king’s journey to Yáma’s realm.
  language: English
