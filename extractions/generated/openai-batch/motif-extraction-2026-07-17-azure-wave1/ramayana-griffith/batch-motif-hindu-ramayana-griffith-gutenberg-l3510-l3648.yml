canonical_text:
  quote: ''
  summary: 'After the earlier rite, the royal sons are born under specified celestial
    conditions: Kauśalyā bears Rāma, Kaikeyī bears Bharat, and Sumitrā bears Lakshmaṇ
    and Śatrughna. The children are described as sharing Vishṇu’s vigour or essence,
    and Rāma is marked as the one who will destroy Rāvaṇ. Celestial beings and Ayodhyā
    celebrate, Vaśishṭha names the infants, and the princes grow as virtuous, skilled,
    mutually devoted brothers. The passage then introduces Viśvāmitra, who comes to
    Daśaratha because night-roaming fiends disrupt his rites.'
  language: English
  quote_policy: summarized
