canonical_text:
  quote: ''
  summary: 'A series of footnotes explains or compares several Ramayana names and
    episodes: the seven rishis as stars, Viśvámitra’s creation of new saints/stars,
    Pushkara as a pilgrimage place, possible substitution of animal victims for human
    sacrifice, Satyavatí/Kauśikí changed into a river, Daksha’s sacrifice and Śiva’s
    anger, Sítá’s name meaning furrow, analogies with Erechtheus and Proserpine, Kalmáshapáda
    as a cannibal, and Paraśuráma as the axe-bearing enemy of the Warrior caste.'
  language: English
  quote_policy: summarized
