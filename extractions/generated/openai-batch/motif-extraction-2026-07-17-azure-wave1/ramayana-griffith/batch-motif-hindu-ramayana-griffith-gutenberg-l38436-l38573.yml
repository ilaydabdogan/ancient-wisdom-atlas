canonical_text:
  quote: ''
  summary: Sugriva recounts how Bali pursued the demon Mayavi into a cave, ordered
    Sugriva to wait outside, and was presumed dead after blood flowed from the cavern.
    Sugriva sealed the entrance and returned to Kishkindha, where he says the citizens
    made him king against his will. Bali later emerged, accused Sugriva of betrayal,
    banished him, and took his wife. Sugriva asks Rama for aid, and Rama promises
    to kill Bali, free Sugriva's captive wife, and restore his kingdom.
  language: English
