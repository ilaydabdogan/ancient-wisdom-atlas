canonical_text:
  quote: ''
  summary: Sítá rejects the advances of the stranger who seeks Ráma’s wife, praises
    Ráma, and warns that the attempt is fatal and impossible. The stranger then reveals
    himself as Rávaṇ, boasts of his power, his defeat of Vaiśravaṇ, his possession
    of the flying car Pushpak, and his city Lanká, then urges Sítá to dwell with him
    and threatens grief if she refuses.
  language: English
  quote_policy: summarized
