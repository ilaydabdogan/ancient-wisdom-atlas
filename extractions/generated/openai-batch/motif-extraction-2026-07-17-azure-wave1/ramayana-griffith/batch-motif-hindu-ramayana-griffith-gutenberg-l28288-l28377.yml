canonical_text:
  quote: "“The spot is pure and pleasant”"
  summary: Rāma describes a pleasant forest glade near the Godāvarī, with lake, trees,
    birds, deer, hills, rock, and cave, and asks Lakshmaṇ to build a cottage there.
    Lakshmaṇ constructs a leaf-thatched hermitage from forest materials, bathes, gathers
    lilies, fruit, and berries, performs sacrifice, and presents the cottage. Rāma
    and Sītā admire it; Rāma embraces and praises Lakshmaṇ, and the three dwell there
    contentedly.
  language: English
