canonical_text:
  quote: ''
  summary: Khara finds his mutilated sister lying in distress. She reports that Rāma
    killed the giants Khara had sent to avenge her, pleads for help, and taunts Khara
    as unable to withstand Rāma and Lakshmaṇ. She collapses at Khara's feet. Khara,
    angered, vows to kill Rāma and his brother and orders Dúshaṇ to assemble fourteen
    thousand giants and prepare his war equipment.
