  quote: ''
  summary: 'Bharat accepts Sumantra’s advice and summons the aged king. King Guha
    comes with his kinsmen, bows to Bharat, and offers what his country can provide:
    lodging, fruit, roots, woodland fare, and meat. Guha asks Bharat’s host to rest
    for the night and continue the next day refreshed.'
