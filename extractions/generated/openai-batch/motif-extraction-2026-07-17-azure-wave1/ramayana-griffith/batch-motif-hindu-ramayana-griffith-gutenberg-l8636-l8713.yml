canonical_text:
  quote: |-
    Then, sanctioned by the saints and thee,
    The marriage of thy Ráma see.
  summary: At daybreak Daśaratha orders Sumantra to prepare a richly supplied royal
    procession with troops, vehicles, horses, and leading sages. The party travels
    four days to Videha, where Janak welcomes Daśaratha, praises the presence of his
    sons and the sages, and announces the completion of his rite and Ráma’s forthcoming
    marriage. Daśaratha accepts Janak’s direction. The sages and ascetics reunite
    peacefully; Ráma and Lakshmaṇ arrive with Viśvámitra, honor their father by embracing
    his feet, and Janak orders the rite to proceed after attending to his daughters’
    needs.
  language: English
  quote_policy: quoted
