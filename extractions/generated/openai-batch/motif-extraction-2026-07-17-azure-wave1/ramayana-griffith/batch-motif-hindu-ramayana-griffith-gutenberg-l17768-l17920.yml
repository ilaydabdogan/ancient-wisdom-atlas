canonical_text:
  quote: ''
  summary: Rama, lying on leaf-covered ground rather than a royal bed, laments his
    exile, Dasharatha's weakness before Kaikeyi, Bharat's expected enthronement, and
    the grief and danger facing Kausalya and Sumitra. He asks Lakshman to guard Kausalya
    but also declares that he chooses forest life and refuses royal power to preserve
    duty. Lakshman consoles him and affirms his dependence on Rama. The brothers rest
    beneath a fig tree, then at dawn travel through woods toward the Yamuna-Ganga
    confluence near Prayag, where smoke and other signs point to Bharadvaja's hermitage.
  language: English
  quote_policy: summarized
