canonical_text:
  quote: For heralds never must be slain.
  summary: Śárdúla reports Ráma and Lakshmaṇ's army at the ocean strand and advises
    Rávaṇ to try diplomacy. Rávaṇ sends Śuka with a message urging Sugríva to withdraw
    and dismissing Sugríva's stake in the theft of Ráma's wife. Śuka flies over the
    sea in birdlike form, delivers the message, is attacked by Vánars, pleads the
    protection due to heralds, and is spared by Ráma. Sugríva sends a threat against
    Rávaṇ and Lanká. Angad then identifies Śuka as a spy because he surveyed the army
    from the air; the Vánars bind him, but Ráma orders his release.
  language: English
  quote_policy: quoted
