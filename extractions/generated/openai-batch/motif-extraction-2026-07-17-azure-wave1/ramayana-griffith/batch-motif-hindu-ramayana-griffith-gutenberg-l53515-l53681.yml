canonical_text:
  quote: ''
  summary: 'In a war council at Lankā, an unnamed younger speaker vows to kill Rāma,
    Lakshmaṇ, Sugrīva, and Hanumān. Mahodar rebukes the boast, warns of Rāma’s power,
    and proposes a deception: if the warriors fail, they should return wounded and
    falsely claim that the princes have been devoured, then use the captive lady’s
    grief to make her submit to Rāvaṇ. Kumbhakarṇa rejects this counsel, promises
    to save Rāvaṇ by killing the foe, is praised and sent out, arms himself with an
    iron blood-stained spear and ornaments, marches from the city with a giant host,
    frightens the Vānars, and is opposed by Angad’s rallying cry.'
  language: English
  quote_policy: summarized
