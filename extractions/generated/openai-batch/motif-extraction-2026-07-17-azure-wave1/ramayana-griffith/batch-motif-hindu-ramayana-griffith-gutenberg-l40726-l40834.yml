canonical_text:
  quote: ''
  summary: After Báli's death, a richly decorated funeral litter is brought. Ráma
    instructs that Báli be placed on the bier and given full funeral rites. Sugríva,
    Angad, Tárá, the widowed women, and the Vánar chiefs conduct a royal funeral procession,
    build a pyre on a sandy island by a stream, lament the dead king, cremate him,
    circumambulate the pyre, and offer water-libations for the departed shade.
  language: English
  quote_policy: summarized
