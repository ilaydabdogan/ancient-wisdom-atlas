canonical_text:
  quote: ''
  summary: A Latin appendix passage recounts the preparation of a rite for King Dasaratha
    to obtain sons, the gods’ petition to Brahma about Ravana’s oppression, Brahma’s
    statement that Ravana may be killed by a human because his boon omitted humans,
    and the gods’ request that Vishnu be born through Dasaratha’s wives in fourfold
    form to kill Ravana. Vishnu agrees, promising to destroy Ravana and rule among
    mortals.
