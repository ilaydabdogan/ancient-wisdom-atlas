canonical_text:
  quote: ''
  summary: Rāma and Rāvaṇ continue a fierce chariot battle that disturbs cosmic and
    earthly realms. Rāma repeatedly cuts off Rāvaṇ’s heads, but new heads grow. Mātali
    urges Rāma to use a divinely fashioned dart associated with Agastya, Brahmā, and
    Indra. Rāma launches it, pierces Rāvaṇ’s heart, and Rāvaṇ dies. The Rākshas forces
    flee, the Vānars and celestial beings acclaim Rāma, and Vibhishaṇ laments his
    brother. Rāma counsels that enmity ends with death and authorizes funeral rites.
  language: English
  quote_policy: summarized
