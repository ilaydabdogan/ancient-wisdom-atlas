  summary: Vaśishṭha instructs named envoys to ride quickly to Rājagriha and summon
    Bharata home, while concealing Rāma's departure and the king's death. The envoys
    prepare supplies and gifts, travel through named lands, rivers, and sacred sites,
    revere a boon-granting celestial tree, and arrive at Girivraja by night to serve
    their master and protect the royal lineal right.
