canonical_text:
  quote: ''
  summary: Tárá comes weeping to the battlefield, finds her husband Báli slain or
    dying, sees Ráma with his bow, Sugríva, and Lakshmaṇ, and laments over Báli. She
    recalls his kingship, her ignored counsel, Fate, Ráma’s blow, Angad’s future,
    and Sugríva’s restored wife and reign. Other women mourn, and Hanumán approaches
    to comfort her.
  language: English
  quote_policy: summarized
