  text: Tárá hastens to the field weeping and striking her head and breast in grief.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She finds her husband Báli prostrate on the ground, described as a powerful
    Vánar warrior now slain or dying.
  category: action
  evidence_refs:
