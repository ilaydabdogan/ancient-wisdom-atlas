  text: Tárá says she gave wise counsel for Báli’s welfare and for the Vánar race,
    but he did not believe her words.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Tárá says Báli’s true conqueror is Fate, and she accuses Raghu’s son of striking
    him while he fought his foe.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Tárá worries about Angad’s future under his uncle’s anger and asks Angad to
    come for a last sight of his father.
  category: speech
  evidence_refs:
