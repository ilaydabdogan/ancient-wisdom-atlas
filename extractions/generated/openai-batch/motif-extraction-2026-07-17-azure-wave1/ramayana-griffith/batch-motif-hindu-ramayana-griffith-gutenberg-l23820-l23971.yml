canonical_text:
  quote: ''
  summary: Bharat, accompanied by Śatrughna, Sumantra, and others, reaches Rāma’s
    forest hermitage near the Mandākinī on Chitrakūṭa. He sees the leaf-built dwelling,
    altar fire, weapons, and Rāma seated in ascetic dress with Lakshmaṇ and Sītā.
    Bharat laments that Rāma, the rightful sovereign, lives in exile because of him,
    seeks pardon, collapses in grief, and is embraced by Rāma as Śatrughna and the
    forest dwellers weep.
  language: English
  quote_policy: summarized
