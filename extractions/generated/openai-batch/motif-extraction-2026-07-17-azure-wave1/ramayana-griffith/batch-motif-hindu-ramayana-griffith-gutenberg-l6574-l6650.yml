  text: Gautam curses his wife to live for countless years in severe vows, with ashes
    as her bed, air as her food, solitude in a lonely grove, and invisibility to others.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gautam declares that Ráma’s future coming, and due honour paid to him as guest,
    will remove her stain, purify her, restore her to Gautam’s side, and give her
    proper shape again.
  category: speech
  evidence_refs:
