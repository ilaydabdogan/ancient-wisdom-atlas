canonical_text:
  quote: ''
  summary: Gautam curses his wife to long secluded penance until Ráma’s visit and
    proper guest-honour will purify and restore her. Ráma and Lakshmaṇ enter the grove,
    meet the hidden penitent Ahalyá, receive her hospitality, and heavenly beings
    celebrate her purification. Gautam returns, receives her again, honors Ráma, and
    Ráma proceeds toward Mithilá.
  language: English
  quote_policy: summarized
