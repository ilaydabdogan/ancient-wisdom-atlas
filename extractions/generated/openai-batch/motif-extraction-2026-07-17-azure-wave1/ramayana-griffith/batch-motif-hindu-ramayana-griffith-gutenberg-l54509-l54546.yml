canonical_text:
  quote: ''
  summary: An unnamed giant or Rákshas warrior turns his chariot toward battle while
    his mace-bearing followers charge. He wounds and kills many Vánars with arrows,
    casts a binding net of missiles around Ráma and his brother, and is described
    by Ráma as empowered by Brahmá’s grace beyond mortal resistance. The sons of Raghu
    fall under shaft and spell, and the Rákshas returns to Lanká to report the princes’
    fate in Rávaṇ’s hall.
