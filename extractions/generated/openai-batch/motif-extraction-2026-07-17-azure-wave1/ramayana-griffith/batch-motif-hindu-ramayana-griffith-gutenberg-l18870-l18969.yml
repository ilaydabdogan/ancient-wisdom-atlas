canonical_text:
  quote: ''
  summary: Kauśalyā, grieving after Rāma has gone out of sight, addresses King Daśaratha.
    She laments the exile of Rāma, Lakṣmaṇa, and Sītā into the forest, worries about
    their hardships, condemns the king’s deed, and argues that Rāma would reject royal
    power already held by another, comparing such kingship to ritual leavings and
    improper sacrificial repetition.
  language: English
  quote_policy: summarized
