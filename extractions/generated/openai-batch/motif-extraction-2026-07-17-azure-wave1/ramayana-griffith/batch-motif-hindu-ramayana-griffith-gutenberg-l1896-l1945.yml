canonical_text:
  quote: ''
  summary: A king considers how to bring the holy young hermit Rishyaśring. His attendants
    fear going, so a plan is formed to send women disguised as hermits to entice the
    recluse from his father’s cell. His arrival in the city is said to end the king’s
    troubles and bring rain. Rishyaśring is to marry Śántá, become allied with Lomapád,
    and later perform the horse offering that will obtain sons for Daśaratha. The
    speaker identifies the account as the words of Sanatkumár, and Daśaratha asks
    how the hermit boy was brought.
  language: English
  quote_policy: summarized
