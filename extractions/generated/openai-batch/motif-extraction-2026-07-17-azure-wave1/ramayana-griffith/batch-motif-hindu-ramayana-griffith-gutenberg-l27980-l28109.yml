canonical_text:
  quote: ''
  summary: Agastya welcomes Ráma, Lakshmaṇ, and Sítá, praises Sítá’s fidelity, and
    advises Ráma to settle at Panchavaṭí, a fertile grove near the Godávarí. Ráma
    asks for a place to build a hermit cell, Agastya gives directions and says Ráma
    will protect dependent hermits. The party departs armed toward Panchavaṭí and
    encounters a giant vulture who identifies himself as an old friend of Ráma’s father
    and begins to state his name and lineage.
  language: English
