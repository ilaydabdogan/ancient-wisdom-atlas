canonical_text:
  quote: ''
  summary: Vánar forces depart rapidly in assigned directions to search for Ráma’s
    captive wife, boasting that they will defeat Rávaṇ and traverse land, sea, mountains,
    and hell if needed. Ráma asks Sugríva how he gained his knowledge of the world.
    Sugríva recounts earlier events involving Máyáví, Báli, a cave on Malaya, his
    own wanderings across eastern, southern, western, and northern regions, and Hanumán’s
    counsel to seek safety at Rishyamúka because Matanga’s curse prevented Báli from
    entering there.
  language: English
  quote_policy: summarized
