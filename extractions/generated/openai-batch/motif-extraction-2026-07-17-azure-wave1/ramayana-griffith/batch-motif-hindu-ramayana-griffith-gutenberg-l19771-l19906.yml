canonical_text:
  quote: ''
  summary: After a night of mourning, Brahman counsellors assemble and address Vaśishṭha.
    They state that the king has died, that Rāma and Lakṣmaṇa are in the forest, and
    that Bharata and Śatrughna are away in Kekaya. They urge that a scion of Ikṣvāku
    be consecrated, arguing through a long catalogue that a kingless land loses rain,
    agriculture, ritual order, civic enjoyment, trade, safety, law, truth, and moral
    discernment. The monarch is praised as guardian, truth, right, parent, friend,
    and the social equivalent of an eye.
  language: English
  quote_policy: summarized
