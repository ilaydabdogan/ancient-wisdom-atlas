  summary: Ráma returns home with Sítá after bowing to his mothers. King Daśaratha
    sends Vaśishṭha to ordain a strict fast for Ráma and Sítá before Ráma’s consecration
    as heir. Vaśishṭha instructs them, returns through festive Ayodhyá, reports completion
    to the king, and Daśaratha withdraws to the chambers of his consorts.
