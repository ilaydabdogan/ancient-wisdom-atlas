  quote: ''
  summary: Sita sees a wondrous golden, jewel-like deer in the forest and calls Rama
    and Lakshman to view it. Lakshman warns that the deer may be the fiend Maricha
    using magical disguise and recalls deadly deceptions of hunters. Sita rejects
    the warning and asks Rama to capture the deer alive, or else kill it for its skin.
    Rama, moved by Sita's request and attracted by the deer, turns to speak to Lakshman.
  language: English
