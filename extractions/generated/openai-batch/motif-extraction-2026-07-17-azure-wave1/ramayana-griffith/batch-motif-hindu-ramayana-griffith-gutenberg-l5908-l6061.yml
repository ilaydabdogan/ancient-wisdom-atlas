canonical_text:
  quote: ''
  summary: Bhagírath performs severe austerity and obtains Śiva's aid for Gangá's
    descent. Gangá descends angrily from the sky, is held and tamed in Śiva's hair,
    then released as seven rivers, with one stream following Bhagírath. Her waters
    are witnessed by divine and semi-divine beings, cleanse sin, and release cursed
    beings. Jahnu swallows the river after she floods his sacrificial ground, then
    releases her from his ears, giving her the name Jáhnavi. Gangá finally follows
    Bhagírath through the sea and nether caves to the dust of Sagar's sons, whose
    spirits gain heavenly rest after the funeral libation.
  language: English
  quote_policy: summarized
