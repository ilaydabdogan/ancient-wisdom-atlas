canonical_text:
  quote: ''
  summary: Rāma thanks Sugrīva for wise friendship, asks him to help find the Maithil
    lady and Rāvaṇ, and promises truthful reciprocal aid. Sugrīva rejoices, recalls
    that their friendship was won near a witness fire, and praises the obligations
    of noble friends. On the mountain, Sugrīva and Hanūmān prepare seats from Sāl
    boughs for Rāma and Lakshmaṇ. Sugrīva describes his oppression and exile by Bāli
    and asks for deliverance. Rāma promises to kill Bāli with his arrows. Sugrīva
    reaffirms the friendship and begins to tell his woes through tears.
  language: English
  quote_policy: summarized
