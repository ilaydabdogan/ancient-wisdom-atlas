canonical_text:
  quote: ''
  summary: Before leaving to live in the forest, Ráma sends Lakshmaṇ to bring Suyajǹa,
    honors him with Sítá, and gives him ornaments, a bed, an elephant, and gold. Ráma
    then commands Lakshmaṇ to distribute cattle, gems, gold, silver, robes, chariots,
    elephants, and other treasures to Brahmans, sages, attendants, scholars, household
    retainers, and the needy. A poor Brahman named Trijaṭ comes at his wife’s urging
    to request help; Ráma jokingly promises him cows as far as he can throw his staff,
    and then grants him the cows, herdsmen, further wealth, and means for sacrifice.
  language: English
  quote_policy: summarized
