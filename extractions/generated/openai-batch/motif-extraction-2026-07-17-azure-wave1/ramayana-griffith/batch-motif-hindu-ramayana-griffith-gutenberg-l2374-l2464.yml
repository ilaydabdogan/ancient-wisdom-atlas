  summary: King Daśaratha, seeking heirs, asks Rishyaśring and assembled priests to
    conduct a sacrifice. The priests approve and promise sons; the king orders the
    horse-sacrifice preparations, safeguards against ritual flaws and fiends, and
    tells his wives to begin lustral rites.
