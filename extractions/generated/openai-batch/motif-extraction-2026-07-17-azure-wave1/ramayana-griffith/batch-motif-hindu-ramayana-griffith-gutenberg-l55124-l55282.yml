canonical_text:
  quote: ''
  summary: 'Ráma laments over Lakshmaṇ, whom he believes slain. Susheṇ says Lakshmaṇ
    is not dead and sends Hanumán to Mahodaya for life-giving herbs. Hanumán brings
    back the whole mountain when he does not locate the herbs, and Susheṇ uses their
    scent to restore Lakshmaṇ. The next canto resumes the battle: Indra sends Mátali
    with a divine chariot and weapons for Ráma; Rávaṇ attacks with serpent-like arrows
    and harms the chariot team; cosmic portents appear; Ráma counters with Indra’s
    spear and arrows.'
  language: English
  quote_policy: summarized
