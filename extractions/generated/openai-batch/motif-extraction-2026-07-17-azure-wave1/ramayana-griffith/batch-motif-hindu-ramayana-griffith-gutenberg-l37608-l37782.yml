canonical_text:
  quote: ''
  summary: Rāma praises Hanumān as Sugrīva’s eloquent and trustworthy envoy. Lakshmaṇ
    replies on Rāma’s behalf, recounting Daśaratha’s righteous rule, Rāma’s exile,
    Sītā’s faithful accompaniment and abduction by an unnamed giant, and the guidance
    that led them to seek Sugrīva. Hanumān answers that Sugrīva, himself dispossessed
    and separated from his spouse, will receive them and send the Vānars to search
    for Sītā.
  language: English
