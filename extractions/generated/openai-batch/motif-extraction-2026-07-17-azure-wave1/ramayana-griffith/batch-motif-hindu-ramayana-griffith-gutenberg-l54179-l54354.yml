canonical_text:
  quote: ''
  summary: The passage narrates successive combats in which Angad, Hanúmán, and Níla
    fight Rákshas chiefs, using trees, stones, mountain peaks, tusks, and captured
    weapons. Devántak, Mahodar, Triśirás, and Mahápárśva are killed. Atikáya then
    appears in a radiant chariot; Ráma asks Vibhishaṇ to identify him, and Vibhishaṇ
    names him as Rávaṇ’s son. Atikáya repels Vánar missiles and challenges the bravest
    opponent to fight him.
  language: English
  quote_policy: summarized
