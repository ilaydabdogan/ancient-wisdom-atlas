canonical_text:
  quote: ''
  summary: Anasúyá gives Sítá a heavenly robe, gems, scented balsam, and garlands,
    and Sítá receives them reverently. At Anasúyá’s request, Sítá recounts how King
    Janak found her while ploughing sacred ground, adopted her after a confirming
    voice from the sky, raised her in the royal household, and later arranged a Bride’s
    Election using a divine bow. Many suitors fail to manage the bow; Ráma arrives
    with Viśvámitra and Lakshmaṇ, strings and breaks the bow, and after Daśaratha’s
    approval Janak gives Sítá to Ráma and Urmilá to Lakshmaṇ.
  language: English
  quote_policy: summarized
