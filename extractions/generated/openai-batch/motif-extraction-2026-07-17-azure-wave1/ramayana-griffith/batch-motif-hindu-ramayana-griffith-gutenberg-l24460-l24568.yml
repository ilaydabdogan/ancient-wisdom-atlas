  quote: |-
    Death is the end of life, and all,
    Now firmly joined, apart must fall.
  summary: The people support Bharat’s appeal to Rāma. Rāma consoles his grieving
    brother with a speech on fate, time, aging, death, impermanence, and the separation
    of loved ones. He says their father has attained heaven through righteous rule,
    gifts, rites, and duty, and he instructs Bharata to restrain grief, return to
    the city, and obey their father’s decree while Rāma remains in the wood fulfilling
    that decree.
