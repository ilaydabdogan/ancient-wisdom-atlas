canonical_text:
  quote: "“An envoy never should be harmed.”"
  summary: Rávaṇ sends Śuka and Sáraṇ in Vánara guise to inspect Ráma’s army, its
    leaders, and the sea bridge. Vibhishaṇ detects them, but Ráma releases them as
    envoys and sends a warning to Rávaṇ about the theft of his queen and the coming
    attack on Lanká. The spies report Ráma’s strength, urge Rávaṇ to restore Sítá,
    and Rávaṇ refuses before surveying the opposing host from his palace roof.
  language: English
  quote_policy: quoted
