canonical_text:
  quote: ''
  summary: As Khara’s host approaches Rama’s hermitage, Rama observes ominous signs
    in earth and sky and instructs Lakshman to take Sita to a mountain cave. Lakshman
    obeys while Rama arms himself to fight alone. Gods, saints, Gandharvas, sages,
    and other divine beings assemble to watch, pray for Rama’s victory, and wonder
    how he can face twice seven thousand giants alone. The demon army advances with
    drums, war-cries, flags, shields, bows, and chariots, causing forest creatures
    to flee. Rama stands before his dwelling, draws his arrows and bow, and is compared
    in wrath and radiance to Rudra, Shiva, and world-ending fire.
  language: English
  quote_policy: summarized
