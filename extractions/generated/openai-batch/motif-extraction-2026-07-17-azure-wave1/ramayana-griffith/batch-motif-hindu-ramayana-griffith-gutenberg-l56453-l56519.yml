canonical_text:
  quote: "“Swift through the air, as Ráma chose, / The wondrous car from earth arose.”"
  summary: Vibhishan presents the prepared car. Rama orders the allied hosts rewarded
    with wealth, boards the car with Sita and Lakshman, and bids farewell to Vibhishan,
    Sugriva, and the Vanar chiefs. The allies ask to accompany him to Ayodhya and
    witness his anointing. Rama welcomes them aboard, and the wondrous car rises through
    the air carrying the kings.
