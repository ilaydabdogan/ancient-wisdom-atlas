canonical_text:
  quote: ''
  summary: In a framed narration, the hermit recounts how King Sagar began a sacrifice
    between Himālaya and Vindhya. Indra, disguised as a demon, stole the sacrificial
    horse. The priests warned Sagar that the rite was obstructed, and Sagar ordered
    his sixty thousand sons to search the whole earth, digging until the horse was
    found. The sons cleft the earth, killed subterranean beings, reached hell, and
    searched Jambudvip. Distressed gods and other beings petitioned the Sire Omnipotent,
    complaining that innocent creatures were being slain.
  language: English
  quote_policy: summarized
