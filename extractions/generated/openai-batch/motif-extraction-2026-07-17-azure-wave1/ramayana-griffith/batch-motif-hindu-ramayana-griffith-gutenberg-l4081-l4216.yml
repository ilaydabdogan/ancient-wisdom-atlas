canonical_text:
  quote: ''
  summary: Ráma and Lakshmaṇ rise at dawn, perform bathing and prayer rites, and accompany
    Viśvámitra to a sacred hermitage near the meeting of the Sarjú and Gangá. Viśvámitra
    explains that Káma once attacked Stháṇu and was burned by the god’s eye, giving
    rise to the name Ananga and the land Anga. The party is received by ascetics,
    spends the night, then crosses the river by barge. As they hear the confluence
    roaring, Viśvámitra explains the divine origin of the Sarjú from the lake Mánas
    on Kailása and instructs Ráma to bow in adoration.
  language: English
  quote_policy: summarized
