canonical_text:
  quote: ''
  summary: Rávaṇ, fearing coming danger, summons the magician Vidyujjihva and orders
    him to make a head resembling Ráma’s, along with arrows and a bow, to deceive
    Sítá. He visits Sítá in the grove, falsely reports Ráma’s death and the defeat
    of the Vánars, and demands that she become his wife. Vidyujjihva presents the
    magic head and weapons before Sítá. Sítá gazes on the apparent head and bow of
    Ráma, recognizes his features, and laments, blaming Kaikeyí for the exile and
    ruin of Ráma.
  language: English
  quote_policy: summarized
