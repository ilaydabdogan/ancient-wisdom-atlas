canonical_text:
  quote: ''
  summary: A sage named Chúli, pleased by the service of the heavenly maid Somadá,
    grants her request for a son won through holy penance; the child is named Brahmadatta
    and later rules Kámpilí. King Kuśanábha gives his hundred daughters to Brahmadatta
    in marriage, and when each bride's hand is placed in the king's palm her deformity
    and sorrow disappear. Later the sonless Kuśanábha prepares a sacrifice to gain
    an heir; Kuśa, son of Brahmá, appears and foretells the birth of Gádhi. The speaker
    traces his lineage through Gádhi and describes his sister Satyavatí, wife of Richíka,
    as becoming the holy river Kauśikí after following her dead husband. The tale
    ends at midnight with praise from holy men, rest, and dawn on the Śona shore when
    the hermit tells Ráma to rise for morning rites and travel.
  language: English
  quote_policy: summarized
