canonical_text:
  quote: "“The wood, my love, is full of woes.”"
  summary: 'After Sítá speaks, a duty-conscious pious hero tries to dissuade her from
    living in the forest. He tells her to remain and describes forest life as full
    of danger and hardship: predatory creatures, treacherous waters, thorns, cold
    ground, scant food, ascetic disciplines, ritual duties, hunger, darkness, wind,
    serpents, insects, and dense thickets. He concludes that she should abandon the
    purpose because the wild wood is no place for her.'
  language: English
  quote_policy: quoted
