canonical_text:
  quote: ''
  summary: Ráma prepares to leave with Sítá and Lakshmaṇ at the riverside. He dismisses
    Sumantra, ordering him to return to Ayodhyá and care for the king. Sumantra laments
    the parting and Ráma’s forest life. Ráma then sends messages of reassurance to
    his father, mothers, the queens, and Bharat, urging obedience to the king’s decree
    and the installation of Bharat on the throne.
  language: English
