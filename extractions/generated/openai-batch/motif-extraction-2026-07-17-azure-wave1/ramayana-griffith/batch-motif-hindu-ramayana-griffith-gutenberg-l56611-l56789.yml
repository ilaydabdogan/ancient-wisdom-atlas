canonical_text:
  quote: ''
  summary: Ráma halts his aerial chariot at Bharadvája’s hermitage, asks after Ayodhyá,
    and receives assurance of Bharat’s loyal guardianship. Bharadvája grants a boon,
    and Ráma asks that the road to Ayodhyá be lined with fruiting and flowering trees
    for the Vánars. As Ráma nears Ayodhyá, he sends Hanumán ahead to visit Guha and
    then Bharat, report Ráma’s victorious return with Sítá and Lakshmaṇ, and observe
    Bharat’s feelings about the throne. Hanumán travels in human form through the
    air, finds Bharat living austerely and revering Ráma’s shoes, delivers the message,
    and Bharat faints with joy before embracing and rewarding him.
  language: English
  quote_policy: summarized
