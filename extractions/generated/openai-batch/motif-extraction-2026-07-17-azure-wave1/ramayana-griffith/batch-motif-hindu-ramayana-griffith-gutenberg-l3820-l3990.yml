canonical_text:
  quote: ''
  summary: The king pleads with Viśvámitra not to take the young Ráma to defend a
    sacrifice, offering himself and his army instead. Viśvámitra describes Rávaṇ and
    the demons Márícha and Suváhu as obstructors of the rite. After the king again
    refuses, Viśvámitra reproaches him for breaking his promise, and the sage’s anger
    shakes the earth. Vaśishṭha counsels the king to keep his word, assures him that
    Viśvámitra will protect Ráma, and says the sage possesses celestial weapons that
    he will give to Ráma, enabling him to defeat the fiends.
  language: English
  quote_policy: summarized
