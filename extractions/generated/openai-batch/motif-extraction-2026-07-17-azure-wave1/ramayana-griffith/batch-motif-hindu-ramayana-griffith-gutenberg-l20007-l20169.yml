canonical_text:
  quote: ''
  summary: Bharat recounts a terrifying dream in which his father the king appears
    amid defilement, cosmic disorder, ominous women, a she-monster, and a southward
    ass-drawn chariot. He interprets the dream as foretelling the death of the king,
    Ráma, Lakshmaṇ, or himself. Envoys then arrive, summon Bharat urgently to his
    father’s house with gifts, reassure him briefly about his family, and Bharat prepares
    to depart after taking leave of his maternal grandfather.
  language: English
  quote_policy: summarized
