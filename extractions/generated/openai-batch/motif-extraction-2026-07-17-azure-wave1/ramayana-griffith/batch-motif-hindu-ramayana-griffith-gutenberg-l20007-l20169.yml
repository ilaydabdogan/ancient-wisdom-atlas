  text: Bharat has a dream that leaves him frightened and sorrowful, and his companions
    try unsuccessfully to cheer him with stories, music, dancing, jokes, and quotations
    from plays.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the dream Bharat sees his father, the king, fall from a high mountain into
    a lake of mire, with soiled body and loosened hair.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The dreamed king lies in mire, drinks oil with hollowed hands, laughs loudly,
    eats sesamum and cake with head lowered, and is covered with dripping oil.
  category: action
  evidence_refs:
  - ev:2
