  quote: ''
  summary: Ráma, Lakshmaṇ, and Sítá move through hermitage and forest settings toward
    Agastya’s retreat. Ráma describes signs of the holy place, Agastya’s power over
    fiends and giants, the humbling of Vindhya at the saint’s command, the purity
    of the sacred precinct, and the ascent or reward of perfected beings there.
