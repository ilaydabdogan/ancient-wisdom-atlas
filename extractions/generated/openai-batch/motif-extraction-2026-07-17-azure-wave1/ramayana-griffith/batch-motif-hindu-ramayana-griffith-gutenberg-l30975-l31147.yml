  quote: ''
  summary: Rávaṇ resolves to undertake a deed, orders his chariot, and travels in
    a wondrous vehicle over the ocean shore. The passage describes the shore as a
    sacred and celestial landscape, then recounts the history of a vast fig tree where
    Garuḍ once protected hermits and later stole the Amrit from Indra’s palace. Rávaṇ
    then reaches a hermitage where Márícha, dressed as an ascetic, receives him with
    hospitality and asks why he has come.
