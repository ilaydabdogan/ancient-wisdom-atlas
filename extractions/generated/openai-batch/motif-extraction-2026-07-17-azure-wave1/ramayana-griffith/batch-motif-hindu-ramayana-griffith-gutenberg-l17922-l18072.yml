canonical_text:
  quote: ''
  summary: Ráma, Sítá, and Lakshmaṇ arrive at Bharadvája’s hermitage near meeting
    waters. Ráma explains their exile and wish to live as hermits. Bharadvája offers
    ritual hospitality, lodging, and an invitation to stay near the confluence. Ráma
    asks for a more secluded refuge, and Bharadvája directs them to the holy mountain
    Chitrakúṭa. After spending the night in the grove, Ráma receives permission and
    guidance to depart.
