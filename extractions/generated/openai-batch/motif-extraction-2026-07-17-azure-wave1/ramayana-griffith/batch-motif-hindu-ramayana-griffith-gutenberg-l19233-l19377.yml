canonical_text:
  quote: ''
  summary: Daśaratha recounts how a wounded hermit youth, struck by his arrow, spoke
    before dying. Remorseful, Daśaratha carried the youth’s water pitcher to the blind
    aged parents, who mistook his footsteps for their son’s return. He confessed that
    he had been hunting by the Sarjú, mistook the sound of water being drawn for an
    elephant, shot, and killed their son unintentionally. The bereaved father distinguished
    accidental from intentional guilt, warned of supernatural punishment for concealed
    or deliberate killing of a devotee, and asked Daśaratha to guide the parents to
    their son’s body, which they touched in grief.
  language: English
  quote_policy: summarized
