canonical_text:
  quote: ''
  summary: Maheśvar tells Ráma to return to Ayodhyá, receive the ancestral kingdom,
    perform the horse offering, and salute his heavenly father Daśaratha. Daśaratha
    appears radiant from heaven, embraces Ráma, recognizes the divine purpose in Ráma’s
    form, blesses Lakshmaṇ and Sítá, and revokes his curse on Kaikeyí at Ráma’s request.
    Indra then offers Ráma a boon; Ráma asks that the slain Vánars be restored to
    life, strength, food, fruit, and water. Indra grants the request, the Vánar dead
    rise restored, and the gods urge Ráma to return to Ayodhyá and be consecrated
    king.
  language: English
  quote_policy: summarized
