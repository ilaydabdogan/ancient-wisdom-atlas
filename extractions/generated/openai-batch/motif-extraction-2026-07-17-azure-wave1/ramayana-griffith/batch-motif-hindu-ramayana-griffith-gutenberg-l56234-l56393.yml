candidate_motifs:
- id: motif:1
  label: heroic return after exile and victory
  taxonomy_refs:
  - return
  basis: Ráma is repeatedly instructed to return to Ayodhyá, comfort family and citizens,
    and end the grief caused by his absence and exile.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:19
  confidence: high
  cautions: The passage anticipates the return and consecration rather than narrating
    the full arrival in Ayodhyá.
- id: motif:2
  label: royal legitimacy through ancestral succession and consecration
  taxonomy_refs:
  - royal_legitimacy
  basis: Ráma is told to receive the kingdom of his sires, rule Ayodhyá, and be consecrated
    king of men after divine praise.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:19
  confidence: high
  cautions: The passage confirms and urges kingship; the actual coronation is not
    shown here.
- id: motif:3
  label: divine father-son encounter after death
  taxonomy_refs:
  - divine_parent_child
  basis: Daśaratha, Ráma’s deceased father enrolled among the blessed in heaven, appears
    radiantly, embraces Ráma, blesses him, and returns to heaven.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:13
  confidence: medium
  cautions: Daśaratha is a heavenly deceased royal father in this passage; the taxonomy
    label is used broadly for a parent-child sacred encounter.
- id: motif:4
  label: hero revealed as divine manifestation
  taxonomy_refs:
  - culture_hero
  basis: Daśaratha says the might of Purushottam was enshrined in Ráma’s form to slay
    the tyrant of the worlds, and he calls Ráma supreme and worshipped by gods and
    sages.
  evidence_refs:
  - ev:6
  - ev:11
  confidence: medium
  cautions: The available taxonomy does not include a precise avatar or divine-incarnation
    motif; culture_hero is an approximate supported family.
- id: motif:5
  label: fire ordeal confirms truth
  taxonomy_refs:
  - divine_judgment
  basis: Daśaratha states that Sítá’s truth was proved by fire and that the flame
    confessed her faith.
  evidence_refs:
