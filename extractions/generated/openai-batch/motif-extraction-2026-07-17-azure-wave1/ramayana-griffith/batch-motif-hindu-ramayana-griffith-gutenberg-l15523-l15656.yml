canonical_text:
  quote: ''
  summary: Rama tells his father that he renounces wealth, lordship, and retinue,
    and will go to the woods for fourteen years with only a basket and spade. Kaikeyi
    gives bark garments; Rama and Lakshman put them on. Sita, distressed and unfamiliar
    with the bark dress, struggles to wear it, and Rama ties it over her silk clothing.
    The palace women plead that Sita remain. Vasistha rebukes Kaikeyi, declares that
    Sita is Rama's own self and should guard his throne, and says that if Sita follows
    Rama then the people, brothers, city, kingdom, and even creatures will follow
    him into the woods.
  language: English
  quote_policy: summarized
