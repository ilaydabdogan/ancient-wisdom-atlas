canonical_text:
  quote: ''
  summary: 'Sugriva tells Rama that Bali oppressed him, took his consort, and drove
    him from power. At Rama''s request he recounts the origin of their enmity: Bali,
    the elder brother and king, pursued the demon Mayavi into a cave while Sugriva
    kept watch outside. After a year Sugriva saw blood and heard demon roars, believed
    Bali dead, sealed the cave, performed rites, and returned to Kishkindha, where
    the lords made him king. Bali later returned after killing the demon, raged at
    Sugriva''s rule, killed the lords, and rejected Sugriva''s humble submission.'
  language: English
  quote_policy: summarized
