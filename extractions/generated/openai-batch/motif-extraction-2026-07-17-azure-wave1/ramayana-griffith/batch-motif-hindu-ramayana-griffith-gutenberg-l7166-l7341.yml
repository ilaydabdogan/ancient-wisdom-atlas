canonical_text:
  quote: ''
  summary: Vaśiṣṭha commands his cow to create warrior peoples, whose multitude defeats
    Viśvámitra’s force. When Viśvámitra’s sons attack the sage, Vaśiṣṭha burns them
    to ashes. Viśvámitra gives his kingdom to his surviving son, goes to the Himalaya,
    performs penance, and receives divine weapons from Śiva. He returns and burns
    Vaśiṣṭha’s hermitage, causing its inhabitants and animals to flee. Vaśiṣṭha confronts
    him with a Brahman staff that quenches and swallows Viśvámitra’s fiery and divine
    weapons; when Viśvámitra draws Brahmā’s dart, gods and the three worlds tremble.
  language: English
  quote_policy: summarized
