canonical_text:
  quote: ''
  summary: At Bharadvāja’s hermitage, Bharat’s host receives an abundant, seemingly
    magical feast with food, bathing places, clothing, grooming implements, grain,
    and provisions for animals. After a joyful night, Bharat thanks the sage and asks
    the way to Rāma’s forest retreat. Bharadvāja directs him toward Chitrakūṭa, the
    Mandākinī, and a leafy hut between river and hill. The queens approach the sage,
    and Bharat identifies Kauśalyā as Rāma’s mother, Sumitrā as mother of two sons,
    and Kaikeyī as his own mother and the source of the family’s grief.
  language: English
  quote_policy: summarized
