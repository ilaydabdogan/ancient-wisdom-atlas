canonical_text:
  quote: "“With fiery flood of arrowy rain / Thy channels will I dry and drain.”"
  summary: Rāma threatens the Sea with a fiery Brahmá weapon so the Vánar host may
    cross. The weapon produces terrifying signs in sky, earth, wind, and waters. Ocean
    rises in personified royal form, explains that the sea must remain unfordable
    by natural law, but offers a passage and redirects the weapon northward. Rāma
    fires the arrow, creating the well of Vraṇa, drying waters in the region, and
    granting fertility. Ocean then directs Rāma to Nala, son of Viśvakarmá, who says
    he can build a bridge across the sea.
  language: English
