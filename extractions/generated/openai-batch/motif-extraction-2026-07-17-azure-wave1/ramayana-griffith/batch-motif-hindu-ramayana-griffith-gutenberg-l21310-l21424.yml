canonical_text:
  quote: ''
  summary: Śatrughna violently drags Kaikeyī’s hump-backed maid, but Bharat restrains
    him by invoking the wrong of killing a woman and Rāma’s expected disapproval.
    The maid is released and comforted by Kaikeyī. Later, royal peers ask Bharat to
    accept the throne because the former lord is dead and Rāma and Lakshmaṇ are in
    the forest. Bharat refuses, affirms Rāma’s right as eldest son, and orders preparations
    to bring Rāma back and consecrate him as king.
  language: English
  quote_policy: summarized
