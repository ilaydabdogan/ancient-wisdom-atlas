  quote: "“The realm and I are Ráma’s”"
  summary: In an assembly, Vaśishṭha urges Bharat to accept the kingdom after Daśaratha’s
    death and Ráma’s exile. Bharat refuses, declares Ráma the rightful ruler, vows
    to seek him in the forest, and orders Sumantra and the army to prepare for the
    journey to bring Ráma home.
