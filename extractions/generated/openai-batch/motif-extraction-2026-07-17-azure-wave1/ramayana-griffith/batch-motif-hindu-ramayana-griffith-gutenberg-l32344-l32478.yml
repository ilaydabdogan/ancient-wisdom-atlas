canonical_text:
  quote: ''
  summary: Lakshman reassures Sita that Rama cannot be slain and says the mournful
    cry was not Rama's but giant magic. Sita angrily accuses Lakshman of treachery
    or desire and vows death if Rama is dead. Lakshman answers reverently, invokes
    woodland witnesses and wood-gods, and then leaves toward Rama while Sita weeps
    and renews her vow not to live or accept another man if widowed.
  language: English
