canonical_text:
  quote: ''
  summary: The wounded Vánar king Báli accepts Ráma’s rebuke, admits wrongdoing, and
    asks protection for his son Angad, his wife Tárá, and Sugríva. Ráma answers that
    justice and duty have been satisfied and promises care for Angad. Báli lies dying
    from Ráma’s arrow. Tárá hears of his fall, comes with Angad toward the battlefield,
    questions fleeing Vánars, hears their fearful report and proposal to anoint Angad,
    then declares she will go to the victorious Ráma and prostrate herself.
  language: English
  quote_policy: summarized
