canonical_text:
  quote: ''
  summary: Sugriva, dulled by wine, love, and languor, is awakened by the alarm of
    the Vanars as Lakshman approaches the city gate as Rama’s envoy. Sugriva’s counsellors
    urge him to appease Lakshman and honor his pledge to Rama. Sugriva worries about
    friendship, slander, and unrepayable favors. Hanuman counsels him to remember
    Rama’s aid, recognize that autumn has begun and the season for action has arrived,
    and humbly seek peace with Rama’s envoy.
  language: English
  quote_policy: summarized
