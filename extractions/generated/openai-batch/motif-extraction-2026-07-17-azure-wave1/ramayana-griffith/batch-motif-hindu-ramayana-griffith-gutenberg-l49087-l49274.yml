canonical_text:
  quote: ''
  summary: Kumbhakarna rebukes Ravan for rash conduct regarding Sita but vows to fight
    Rama. Mahaparshva urges Ravan to force Sita and rely on Kumbhakarna and Indrajit
    in battle. Ravan explains that Brahma cursed him after his assault on Punjikasthala,
    so he does not force Sita; he then boasts of his power against Rama. Vibhishan
    repeatedly warns Ravan to restore Sita to Rama before ruin comes upon Lanka, while
    Prahasta rejects such fear and Indrajit begins to reply.
  language: English
  quote_policy: summarized
