canonical_text:
  quote: ''
  summary: Indra’s nymph attempts to beguile the ascetic Viśvámitra, who recognizes
    the plot and curses her to become stone until a powerful Bráhman releases her.
    Regretting the failure of his wrath-restraint, Viśvámitra vows silence, fasting,
    breath-control, and long penance to win Bráhman rank. After a thousand years,
    Indra comes disguised as a Bráhman and asks for food; Viśvámitra gives his whole
    meal and keeps his vow. His ascetic power produces smoke and terrifying cosmic
    signs, prompting gods and other beings to petition Brahmá. Brahmá grants him the
    title and rank of Bráhman Saint, and Vaśishṭha confirms the boon.
  language: English
  quote_policy: summarized
