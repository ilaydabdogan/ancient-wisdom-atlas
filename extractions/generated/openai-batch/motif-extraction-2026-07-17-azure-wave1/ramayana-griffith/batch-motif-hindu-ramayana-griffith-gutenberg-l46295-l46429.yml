canonical_text:
  quote: "“My soul rejects the sin and shame.”"
  summary: Rākshasī guards urge and threaten Sítá to abandon Ráma and accept Rávaṇ.
    Sítá refuses, laments in captivity, recalls her abduction by the shape-changing
    Rávaṇ, and says she would rather be killed or burned than consent. She grieves
    that Ráma does not know where she is and imagines that, if he knew, he would cross
    land and sea, rescue her, and destroy Lanká.
  language: English
  quote_policy: quoted
