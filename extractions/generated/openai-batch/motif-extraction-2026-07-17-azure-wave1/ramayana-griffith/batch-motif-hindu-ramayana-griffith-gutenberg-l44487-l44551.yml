canonical_text:
  quote: ''
  summary: At a Vānar council, none of the host is found able to clear the sea. Jāmbavān,
    the aged sage-chief, says old age has weakened him, though he can still leap ninety
    leagues and recalls that in youth he circled Vishṇu as the god traversed the universe.
    Angad volunteers to leap to Lankā, though he doubts he can return. Jāmbavān refuses
    to send him because a prince and hope of the host must be protected, and then
    promises to incite another sufficiently powerful chieftain.
  language: English
  quote_policy: summarized
