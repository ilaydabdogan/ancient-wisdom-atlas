canonical_text:
  quote: ''
  summary: Bharat approaches Bharadvāja’s hermitage on foot after leaving his army
    and war gear behind. The hermit receives Bharat and Vaśishṭha with hospitality,
    questions Bharat’s purpose, and tests whether he means harm to the exiled Rāma.
    Bharat denies this, says he seeks to bring Rāma back to the royal seat, and asks
    where Rāma is. Bharadvāja approves him, identifies Chitrakūṭa as Rāma’s dwelling,
    invites Bharat to stay, and offers to entertain his army; Bharat explains that
    he kept the troops back to avoid harming the hermitage.
  language: English
