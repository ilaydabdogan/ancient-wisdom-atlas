candidate_motifs:
- id: motif:1
  label: Divided unborn being transformed into storm gods
  taxonomy_refs:
  - death_rebirth
  - divine_parent_child
  basis: Diti’s unborn bud, cut into seven by Indra, is petitioned over and then transformed
    by divine decree into the seven Maruts, heavenly storm gods.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage frames the beings as arising from a blighted unborn bud rather
    than a complete death-and-resurrection episode; taxonomy fit is approximate.
- id: motif:2
  label: Divine compact granting status and immortality-like privileges
  taxonomy_refs:
  - sacred_exchange
  - covenant
  basis: Diti petitions, Indra agrees, and the passage explicitly calls their agreement
    a compact; the Maruts receive divine forms, Amrit, service to Indra, and freedom
    from fear, age, and sickness.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The compact is between mother and son about the children’s status; it
    is not a formal social covenant in the excerpt.
- id: motif:3
  label: Royal lineage legitimating a city and current king
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage traces Viśálá’s rulers from Ikshváku and Viśála to Sumati and
    says the line is blessed with long life, virtue, and strength.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage is genealogical and laudatory; it does not include a contested
    succession.
- id: motif:4
  label: Ritual hospitality to a sage and royal guests
  taxonomy_refs:
  - sacred_exchange
  basis: Sumati comes with priest and lords, bows, worships, honors Viśvámitra, questions
    him, and hosts the princes for the night.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The taxonomy reference is broad; the scene is hospitality and honor rather
    than an explicit exchange of boons.
- id: motif:5
  label: Abandoned sacred place with hidden past
  taxonomy_refs:
  - wisdom
  basis: Ráma sees an aged deserted holy wood and asks the sage-guide to explain its
    former inhabitant and history.
  evidence_refs:
