canonical_text:
  quote: ''
  summary: Diti petitions Indra that the divided unborn child become seven heavenly
    storm-spirits called Maruts. Indra grants this, promising them divine status,
    Amrit, freedom from age and sickness, and swift movement through the three worlds.
    The narrative then identifies the region and gives the lineage of Viśálá down
    to King Sumati, who welcomes Viśvámitra and the princes. On the road to Mithilá,
    Ráma asks about an aged deserted grove; Viśvámitra recounts how Indra, disguised
    as Gautama, approached Ahalyá, was discovered by the returning sage, and was cursed
    so that his vigor and bodily power were lost.
  language: English
  quote_policy: summarized
