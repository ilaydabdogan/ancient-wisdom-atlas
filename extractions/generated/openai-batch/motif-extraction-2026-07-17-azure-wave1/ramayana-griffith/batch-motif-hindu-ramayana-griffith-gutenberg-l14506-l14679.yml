canonical_text:
  quote: "“My sire’s behest, the oath he sware, / The claims of truth, all lead me
    there.”"
  summary: Sítá collapses in grief after pleading to accompany Ráma. Ráma consoles
    her, explains that obedience to his father and truth compel his forest exile,
    consents to take her to Daṇḍak’s wild, and orders gifts to mendicants, Bráhmans,
    and followers before departure. Lakshmaṇ then begs to accompany Ráma and Sítá
    with his bow, but Ráma urges him to remain and protect Kauśalyá and Sumitrá from
    neglect under Kaikeyí’s political ascendancy.
  language: English
  quote_policy: quoted
