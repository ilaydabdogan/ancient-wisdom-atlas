canonical_text:
  quote: ''
  summary: Angad and the Vānara search party despair after failing to find Sítá and
    losing time in an underground enchanted cavern. A wingless vulture, Sampáti, hears
    them speak of Jaṭáyus, identifies him as his brother, asks to descend from the
    peak, and later recounts how he lost his wings shielding Jaṭáyus during a flight
    toward the sun. Angad narrates Ráma’s exile, Sítá’s abduction by Rávaṇ, Jaṭáyus’s
    death defending her, Ráma’s covenant with Sugríva, the search party’s failure,
    and asks Sampáti to reveal Rávaṇ’s dwelling.
  language: English
  quote_policy: summarized
