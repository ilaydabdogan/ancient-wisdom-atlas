canonical_text:
  quote: ''
  summary: Daśaratha returns to a city and palace marked by emptiness and mourning
    after the banishment of Rāma, Sītā, and Lakṣmaṇa. He is led to Kauśalyā, laments
    Rāma’s departure, and says his sight has gone with his son. Kauśalyā then laments
    to him, blames Kaikeyī, imagines the hardships of forest exile, longs for the
    exiles’ return and public welcome, and describes her own grief as consuming anguish.
  language: English
  quote_policy: summarized
