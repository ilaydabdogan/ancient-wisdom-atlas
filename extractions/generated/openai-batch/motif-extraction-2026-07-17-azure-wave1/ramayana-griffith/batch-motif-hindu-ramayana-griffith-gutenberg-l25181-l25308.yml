canonical_text:
  quote: ''
  summary: Vaśishṭha counsels Ráma to honor father, mother, and holy guide and to
    heed Bharat’s request. Ráma answers that he will not break Daśaratha’s word. Bharat
    attempts a fasting supplication on sacred grass before Ráma’s forest dwelling,
    asks the people to join his plea, performs a water-purification gesture, disclaims
    desire for the throne, and offers to take the exile himself. Ráma refuses to transfer
    the exile, upholds his father’s promise, praises Bharat, and asks him to preserve
    the monarch’s name from falsehood.
  language: English
  quote_policy: summarized
