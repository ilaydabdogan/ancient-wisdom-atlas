canonical_text:
  quote: ''
  summary: Rāma, on Mālyavat, describes the monsoon landscape to his brother, repeatedly
    linking clouds, rain, mountains, and lightning with memories of Sītā and Sugrīva.
    He says the rains block roads and delay action against Rāvan, while Sugrīva enjoys
    restored queen and kingdom. The next canto opens after the rains, with Sugrīva
    absorbed in pleasure and Hanumān preparing prudent counsel.
  language: English
