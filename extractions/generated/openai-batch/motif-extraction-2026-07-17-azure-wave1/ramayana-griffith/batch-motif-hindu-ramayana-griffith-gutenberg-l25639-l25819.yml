canonical_text:
  quote: ''
  summary: Bharat carries Ráma’s sandals to Nandigrám, installs them with royal honors,
    and administers the realm as their trustee until Ráma’s return. In the forest,
    Ráma notices the hermits’ fear; an aged sage explains that Khara and other demons
    are harassing the hermitage and obstructing rites. The hermits depart, while Ráma
    remains in the grove.
  language: English
  quote_policy: summarized
