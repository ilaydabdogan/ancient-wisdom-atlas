candidate_motifs:
- id: motif:1
  label: Serpent bondage broken by a bird ally
  taxonomy_refs:
  - serpent
  basis: The princes are bound by arrows transformed into snakes, called a serpent
    noose; when Garuḍ, lord of birds, appears, serpents flee and the bonds vanish.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: high
  cautions: The available taxonomy contains a serpent symbol but no exact motif family
    for Garuḍ-like bird-serpent opposition; the label is descriptive.
- id: motif:2
  label: Supernatural healing and revival of incapacitated heroes
  taxonomy_refs:
  - death_rebirth
  basis: The princes are described as fallen, wounded, and bound; Garuḍ’s touch closes
    their wounds and restores memory, mental powers, zeal, and strength.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: medium
  cautions: The passage includes lament language suggesting death, but the actual
    restoration is from wounds, numbing bonds, and loss of strength rather than an
    unequivocal death and resurrection.
- id: motif:3
  label: Life-giving herbs from a remote sacred mountain region
  taxonomy_refs:
  - mystical_quest
  basis: Susheṇ proposes that swift Vánars fetch herbs from Chandra and Droṇa by the
    Milky Ocean, herbs said to heal wounds and bestow life.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: In this passage the herb-fetching remains a proposed remedy and is superseded
    by Garuḍ’s immediate healing.
- id: motif:4
  label: Captive beloved to be rescued from a tyrant
  taxonomy_refs:
  - stolen_beloved
  basis: Sugríva says he will rescue and bring the Maithil lady from the giant king,
    and Garuḍ says Sítá will be freed from Rávaṇ’s power.
  evidence_refs:
  - ev:4
  - ev:10
  confidence: high
  cautions: The abduction itself is not narrated in this passage; only the captive
    status and promised rescue are stated here.
- id: motif:5
  label: Deceptive magical warfare against open combat heroes
  taxonomy_refs:
  - trickster_boundary
  basis: Vibhishaṇ contrasts the brothers’ open fighting with Indrajít’s stealthy
    blow, and Garuḍ warns that the giants use deceit and dishonest arts to destroy
    brave foes.
  evidence_refs:
  - ev:2
  - ev:10
  confidence: medium
  cautions: The taxonomy reference is approximate; the passage emphasizes deceit and
    magic, not a full trickster episode.
- id: motif:6
  label: Guardian helper arrives at crisis
  taxonomy_refs: []
  basis: Garuḍ identifies himself as Rāma’s old friend and guardian and intervenes
    at the moment when the princes are bound and incapacitated.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: No exact supplied taxonomy family corresponds to this helper motif.
