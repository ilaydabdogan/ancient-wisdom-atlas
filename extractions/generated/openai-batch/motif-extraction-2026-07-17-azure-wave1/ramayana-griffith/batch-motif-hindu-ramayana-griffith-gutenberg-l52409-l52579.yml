canonical_text:
  quote: ''
  summary: The passage presents the panic of the Vánar forces after Rāma and his brother
    are found bound and wounded by Indrajit’s serpent-like arrows. Vibhishaṇ laments
    the apparent defeat, Sugríva consoles him and expects Garuḍ’s aid, and Susheṇ
    proposes life-restoring herbs from mountains by the Milky Ocean. Garuḍ then appears
    amid storm portents and fiery light, the serpent bonds flee and vanish, and his
    wing-touch heals the two princes. Garuḍ identifies himself as their long-standing
    guardian and friend, warns against the giants’ deceit, predicts Rávaṇ’s defeat
    and Sítá’s release, and departs. The Vánars rejoice, and Rávaṇ hears the uproar
    from within his hall.
  language: English
  quote_policy: summarized
