canonical_text:
  quote: ''
  summary: Bharat asks Guha for the route to Bharadvaja’s retreat. Guha offers guides
    but voices fear that Bharat’s large host may threaten Rama. Bharat denies any
    hostile intent and says he seeks to bring his elder brother home. Guha praises
    Bharat’s willingness to renounce the kingdom. At night Bharat grieves for Rama.
    Guha recounts Lakshman’s earlier vigil beside the sleeping Rama and Sita, Lakshman’s
    refusal to sleep, his lament for Rama and the royal family, and the next morning’s
    river crossing and onward journey in ascetic dress.
  language: English
  quote_policy: summarized
