canonical_text:
  quote: ''
  summary: An aged king explains to the assembled realm that he wishes to rest from
    rule and appoint his eldest son Rāma as heir. The assembled people acclaim the
    proposal, praise Rāma’s virtues, justice, martial power, and care for subjects,
    and ask that he be installed as Regent Heir. The king accepts their petition and
    orders Vaśishṭha and Vāmadeva to prepare the necessary rites during the auspicious
    season of Chaitra.
  language: English
  quote_policy: summarized
