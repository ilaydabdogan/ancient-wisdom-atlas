canonical_text:
  quote: ''
  summary: A saintly hermit blesses the king, ministers, and town. Servants tell the
    king, who comes with a guest-gift, bows, and asks forgiveness for having taken
    away the hermit's son. The Brahman reassures the king that his virtues have won
    favour. The saint is led before the king into the abode amid public reverence.
    Palace women present Śántá as the saint's son's bride; the saint embraces her,
    and she bows with joined palms. The saint performs a rite for his son that frees
    from stain and departs with him to the wood.
  language: English
  quote_policy: summarized
