canonical_text:
  quote: ''
  summary: Bharat joyfully orders a public welcome for the returning Rāma. Śatrughna
    arranges road preparations, decorations, music, and a royal procession. Bharat
    bears Rāma’s shoes, awaits the arrival, questions the Vānara chief when Rāma is
    not yet visible, and is told of signs of approach and the celestial car. Rāma
    arrives with Lakshmaṇ, the rescued queen, Vibhishaṇ, Sugrīva, and others. Bharat
    greets Rāma, allies, family members, and elders, then places the shoes on Rāma’s
    feet and returns the rule entrusted to him. Rāma embraces Bharat, visits Bharat’s
    retreat, and the wondrous car departs northward to the Lord of Gold.
  language: English
  quote_policy: summarized
