canonical_text:
  quote: "“To Daṇḍak wood this day I go.”"
  summary: Ráma, Lakshmaṇ, and Sítá come before Ráma’s grieving father, the king,
    who faints and is laid on a couch. Ráma asks farewell and permission to go to
    Daṇḍak wood with Lakshmaṇ and Sítá. The king says he was misled by Kaikeyí and
    offers Ráma the throne, but Ráma refuses, renounces rule, and declares he will
    dwell in the woods for fourteen years to preserve his father’s word. The king
    begs him to stay one night; Ráma insists on immediate departure, gives the kingdom
    to Bharat, honors his father as a god, and asks him to comfort the weeping court.
  language: English
  quote_policy: quoted
