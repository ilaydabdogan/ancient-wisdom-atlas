canonical_text:
  quote: ''
  summary: Bharadvája blesses Ráma, Lakshmaṇ, and Sítá and gives directions toward
    the meeting of the Yamuná and Gangá, across the Kálindí, to the Fig-tree Śyáma,
    and onward through forest toward Chitrakúṭa. The travelers build a raft, cross
    the river, and Sítá prays to Kálindí and later to the sacred tree. Ráma arranges
    their order of travel through the forest; they gather plants, hunt, eat, rest
    by the river, and at dawn Ráma wakes Lakshmaṇ to continue.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bharadvája blesses the travelers and gives a route involving the meeting of
    Yamuná and Gangá, the swift Kálindí, a raft crossing, the Fig-tree Śyáma, and
    a wooded path toward Chitrakúṭa.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ráma, Lakshmaṇ, and Sítá thank the hermit, go to Kálindí’s wooded shore, and
    consider how to cross the river.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The brothers construct a raft with logs, dry bamboos, and grass; Lakshmaṇ
    also prepares a seat for Sítá from cane and Rose-Apple boughs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ráma places Sítá on the raft, stores skins, bows, coats, ornaments, and a
    spade, and the brothers push the raft from the shore.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the raft is halfway across, Sítá prays to Kálindí as a goddess and vows
    gifts of cattle and jars of wine if Ráma returns to the city of Ikshváku’s line.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After crossing, Sítá approaches the Fig-tree Śyáma, greets it, asks that Ráma
    complete his vow and that they return to meet Kauśalyá and Sumitrá, and walks
    around the tree with joined hands.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ráma tells Lakshmaṇ to lead the way, Sítá to walk behind Lakshmaṇ, and himself
    to go last holding his bow; he asks Lakshmaṇ to gather fruits and flowers for
    Sítá.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: As they walk, Sítá asks the names of flowering shrubs, creepers, and trees,
    and Lakshmaṇ fetches flowering boughs at her request.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The travelers pass along the river, hear birds, travel through forest, kill
    game, prepare a meal, rest, and choose a level riverside place for the night.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: In the morning, Ráma wakes Lakshmaṇ, points to the voices of forest birds,
    and says it is time to depart.
  category: speech
  evidence_refs:
  - ev:9
