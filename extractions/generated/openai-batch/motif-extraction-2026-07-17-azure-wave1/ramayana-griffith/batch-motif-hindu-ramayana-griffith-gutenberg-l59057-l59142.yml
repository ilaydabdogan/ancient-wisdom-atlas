canonical_text:
  quote: ''
  summary: 'The passage consists of additional notes: a critical note on Ráma’s exile
    wanderings among southern Brahmanical hermitages and the chronological problems
    posed by sages associated with those hermitages; a gloss identifying Umá/Párvatí
    as daughter of Himálaya and Mená; a note on Kumbhakarṇa’s immense appetite and
    Brahmá’s sleep decree; and a note on Śiva interrupting Daksha’s sacrificial rite,
    with reference to Hindu sculpture and an allegorical interpretation of sectarian
    ritual conflict.'
