canonical_text:
  quote: Of Ráma and the throning spoke.
  summary: Sumantra leaves the king, travels through a decorated and rejoicing royal
    street to Rāma’s palace, passes crowds, guards, halls, and attendants, and announces
    himself. Rāma receives him while Sītā attends him. Sumantra tells Rāma that the
    king and Queen Kaikeyī seek an interview, and Rāma tells Sītā he expects counsel
    about his consecration and will go to the king.
  language: English
