canonical_text:
  quote: "“I have no power to slight or break / Commandments which my father spake.”"
  summary: Kauśalyá begs Ráma not to go into exile and argues that a mother’s command
    also deserves obedience. Ráma refuses to break his father’s command, cites earlier
    examples of filial obedience, instructs Lakshmaṇ to put duty before wrath, asks
    his mother for blessing, promises to return after the appointed years, and ends
    by reverently circling and embracing her.
  language: English
  quote_policy: quoted
