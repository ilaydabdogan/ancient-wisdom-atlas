canonical_text:
  quote: ''
  summary: 'A holy man tells Ráma a legend of King Sagar of Ayodhyá, who, being childless,
    performs long austerities with his two queens on Himálaya. The saint Bhrigu grants
    a boon: one queen will bear one heir and the other sixty thousand sons. Keśini
    chooses the single heir and bears Asamanj; Sumati chooses the multitude and gives
    birth to a gourd that splits open to reveal sixty thousand babes, who are kept
    in jars of oil until mature. Asamanj becomes cruel and is banished by Sagar, while
    Asamanj’s son Anśumán is praised. Sagar later prepares to perform a horse sacrifice
    with his priests.'
  language: English
  quote_policy: summarized
