canonical_text:
  quote: ''
  summary: Ráma, Lakshmaṇ, and Sítá take leave of Guha and Sumantra, board a boat,
    cross the Gangá, and enter the forest. During the crossing Sítá prays to the river
    goddess Gangá and vows offerings if Ráma safely completes his fourteen-year exile
    and returns. After landing, Ráma arranges a protective walking order, the party
    proceeds into the forest, rests under a fig tree near a lotus lake, eats a hunted
    meal cooked over fire, and prepares for the first night of vigil on leaf beds.
  language: English
  quote_policy: summarized
