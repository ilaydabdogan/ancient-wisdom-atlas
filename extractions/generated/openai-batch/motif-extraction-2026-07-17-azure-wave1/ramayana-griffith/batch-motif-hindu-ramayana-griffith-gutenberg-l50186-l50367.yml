canonical_text:
  quote: ''
  summary: Rāma reads ominous signs and orders the host arranged near the water. He
    predicts battle around Lankā. The army marches from the sea toward the city; Rāma
    sees Lankā and thinks of Sītā imprisoned there. He assigns commanders to positions,
    releases Rāvaṇ’s spy Śuka, and Śuka returns to report the sea-bridge, the crossing
    army, and the approaching assault. Rāvaṇ refuses to return the Maithil lady and
    boasts that he will fight Rāma.
  language: English
  quote_policy: summarized
