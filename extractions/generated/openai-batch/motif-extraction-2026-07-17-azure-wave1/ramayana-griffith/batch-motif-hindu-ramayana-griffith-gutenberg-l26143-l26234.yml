canonical_text:
  quote: ''
  summary: Anasúyá praises Sítá's tale, describes the evening hermitage, and asks
    Sítá to appear in heavenly raiment. Sítá wears the gifts, returns to Ráma, and
    Ráma and Lakshmaṇ rejoice at the honour she has received. After a night in the
    hermitage, the princes depart; the hermits warn them of shapeshifting man-eating
    monsters in the distant forest and ask Ráma to chase or destroy them. Blessed
    by the saints, Ráma enters the wood with his wife and brother.
  language: English
  quote_policy: summarized
