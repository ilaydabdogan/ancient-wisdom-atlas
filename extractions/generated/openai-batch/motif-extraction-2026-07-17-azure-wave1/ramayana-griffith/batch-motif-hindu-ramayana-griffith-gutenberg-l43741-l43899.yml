canonical_text:
  quote: Her only child, return, return.
  summary: Hanuman assesses Angad’s qualities and counsels him not to remain in the
    cave, warning that the Vanars will return to Sugriva and that Lakshman’s arrows
    can pierce the mountain refuge. Angad rejects trust in Sugriva, fears imprisonment
    or death, chooses to fast and die, and sends greetings home. The Vanars sit with
    him on sacred darbha grass and vow to die. Sampati, the vulture king and brother
    of Jatayus, then sees the sorrowing Vanars on Vindhya’s slope and rejoices at
    the prospect of a feast.
  language: English
  quote_policy: quoted
