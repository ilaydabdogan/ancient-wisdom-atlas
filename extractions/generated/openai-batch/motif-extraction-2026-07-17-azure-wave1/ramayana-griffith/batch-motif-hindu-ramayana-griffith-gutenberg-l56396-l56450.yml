canonical_text:
  quote: ''
  summary: At morning Vibhishan offers Rama oils, scents, clothing, ornaments, and
    attendants for bathing. Rama declines such luxuries because he longs to return
    to Bharat and Ayodhya. Vibhishan offers the aerial chariot Pushpak, made by divine
    hands and formerly seized by Ravan from the God of Gold, and asks Rama to remain
    briefly in Lanka as his honored guest. Rama thanks him but refuses delay. The
    magic car, made by Visvakarma, is brought and shines like the sun, astonishing
    Rama and Lakshman.
