canonical_text:
  quote: "“Come, Ráma from his home expel / An exile in the woods to dwell.”"
  summary: A troubled damsel warns a Queen that Ráma will take the throne, that Bharat
    will be excluded and endangered, and that the Queen should secure the kingdom
    for her child by sending Ráma into forest exile. The speech also describes sibling
    loyalties, an ancient tree-and-reeds tale, a comparison to the Heavenly Twins,
    and images of flood and animal predation.
  language: English
