canonical_text:
  quote: ''
  summary: Rávaṇ, enraged by grief, recalls the boons and martial gifts he gained
    from Brahmá through long penance, threatens to avenge his son, nearly kills the
    captive Sítá in the grove, but is restrained by a Rákshas counselor. Later, amid
    lamentation in Lanká, he orders his chariot and army, sallies forth with ominous
    portents, kills many Vánars, sees allied chiefs fall, and resolves to uproot Ráma,
    whom he describes through a tree image with Sítá as fruit and the Vánar lords
    as branches.
  language: English
  quote_policy: summarized
