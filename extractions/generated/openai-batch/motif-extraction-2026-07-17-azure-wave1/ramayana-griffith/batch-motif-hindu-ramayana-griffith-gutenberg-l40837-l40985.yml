canonical_text:
  quote: ''
  summary: Hanuman asks Rama to enter Kishkindha and install Sugriva as ruler. Rama
    refuses to enter any town because of his father’s fourteen-year command, instructs
    Sugriva to be anointed, names Angad as partner in rule, and says the rainy season
    requires postponing war while Rama and Lakshman remain on the hill. Sugriva enters
    Kishkindha, is welcomed by the Vanars, and undergoes a royal consecration with
    balm, regalia, priestly rites, sacrificial fire, and sacred water. Afterward he
    appoints Angad as partner in his sway, and the Vanars praise Sugriva, Rama, and
    Lakshman.
  language: English
  quote_policy: summarized
