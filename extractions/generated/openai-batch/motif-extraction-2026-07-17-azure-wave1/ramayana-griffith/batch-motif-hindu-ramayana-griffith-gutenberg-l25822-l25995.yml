canonical_text:
  quote: ''
  summary: Rama leaves a lonely forest place whose associations with Bharat, his mother,
    and Bharat's host pain him. With Sita and Lakshman he reaches Atri's hermitage,
    where Atri welcomes them and introduces his aged ascetic wife Anasuya. Atri praises
    Anasuya's long penance and miraculous aid in drought and to the gods. Rama asks
    Sita to approach Anasuya. Anasuya counsels Sita on wifely fidelity and its heavenly
    reward; Sita replies by affirming her devotion to Rama, recalling maternal and
    wedding counsel, and citing Savitri and Rohini as examples. Pleased, Anasuya offers
    Sita a blessing or boon, which Sita says she does not need.
  language: English
  quote_policy: summarized
