canonical_text:
  quote: ''
  summary: Triśirás stops Khara and asks to fight Rāma first, swearing by his sword
    that he will kill Rāma or be conquered. Khara consents. Triśirás attacks in a
    chariot and exchanges arrows with Rāma. Rāma disables the chariot, kills the horses,
    casts down the driver and banner, then severs Triśirás’s three heads. The surviving
    fiends flee to Khara, who rallies them and drives against Rāma.
