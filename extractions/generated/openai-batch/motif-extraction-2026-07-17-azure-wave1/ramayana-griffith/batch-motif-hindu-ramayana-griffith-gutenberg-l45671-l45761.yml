  quote: ''
  summary: Hanumán leaves Rávaṇ’s halls after failing to find Sítá, speculates that
    she may have died during or after her abduction, fears that reporting failure
    would cause a cascade of deaths among Raghu’s son, his brothers, Sugríva, and
    the Vánars, considers ascetic withdrawal or self-destruction, then notices an
    unsearched Aśoka grove, invokes celestial powers, and resolves to continue the
    search.
