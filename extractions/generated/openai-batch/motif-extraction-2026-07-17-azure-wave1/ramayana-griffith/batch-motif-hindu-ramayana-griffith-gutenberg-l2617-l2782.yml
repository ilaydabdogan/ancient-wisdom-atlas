canonical_text:
  quote: ''
  summary: After the wandering horse returns, Daśaratha’s horse sacrifice begins on
    the northern bank of the Sarjú under Rishyaśring and Brahman priests. The rite
    includes Vedic observances, offerings to Indra and the gods, abundant public feeding,
    preparation of gilded sacrificial posts and an eagle-shaped altar, binding of
    victims, the ritual slaying of the consecrated horse by Queen Kauśalyá, her night
    beside the dead horse to gain a son, and the final offering of the horse’s remains
    in the sacred flame.
  language: English
  quote_policy: summarized
