canonical_text:
  quote: "“Come, Dapple-skin,” he cried, “with speed; / Hear thou my words and help
    at need.”"
  summary: Viśvámitra, a king descended from Kuśa and Gādhi, travels with a large
    army and reaches the holy retreat of Vaśishṭha. Vaśishṭha welcomes him, exchanges
    courteous questions, and insists on feeding the king and his train. He calls upon
    the heavenly cow Dapple-skin to produce abundant food and drink. After the feast,
    Viśvámitra asks Vaśishṭha to sell or give him the cow, arguing that such a wondrous
    jewel belongs with a monarch.
  language: English
  quote_policy: quoted
