canonical_text:
  quote: ''
  summary: The Raghu princes, guided by Viśvámitra, arrive at Janak’s sacrificial
    ground. Rāma observes the scale of the rite, and the sage lodges apart near water.
    Janak comes with Śatānanda and priests, honors Viśvámitra, and explains that twelve
    days remain before the gods claim their dues. Janak asks about the two armed,
    divine-looking youths. Viśvámitra recounts their identity as Daśaratha’s sons,
    their deeds against demons, Ahalyā’s release, and their purpose of seeing the
    famous bow. Śatānanda asks about his mother Ahalyā’s restoration, hears Viśvámitra’s
    affirmation, welcomes Rāma, praises Viśvámitra, and begins to recount the sage’s
    former kingship.
  language: English
  quote_policy: summarized
