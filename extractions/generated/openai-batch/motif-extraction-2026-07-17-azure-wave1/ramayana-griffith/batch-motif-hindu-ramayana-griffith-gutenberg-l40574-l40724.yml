canonical_text:
  quote: ''
  summary: Sugríva laments Báli’s death, confesses remorse over a brother’s fall,
    compares his guilt to Indra’s sin in killing Viśvarúpa, and doubts his right to
    rule. Ráma counsels that grief cannot restore the dead, that Fate governs events,
    and that Báli has reached a heroic heavenly reward. Lakshmaṇ urges Sugríva to
    perform Báli’s funeral rites with Tárá and Angad, preparing wood, sandal, adornments,
    oil, perfumes, and a litter.
  language: English
