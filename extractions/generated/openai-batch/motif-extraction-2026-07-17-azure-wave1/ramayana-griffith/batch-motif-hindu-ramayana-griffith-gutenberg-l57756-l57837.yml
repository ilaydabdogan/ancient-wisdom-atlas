canonical_text:
  quote: ''
  summary: 'The passage summarizes episodes involving Rávaṇ’s conflicts, alliances,
    descents, captures, and ritual boons, then turns to Ráma and the pregnant Sítá:
    Sítá asks to visit Ganges hermitages, but public slander leads Ráma to send her
    away with Lakshmaṇ, after which she laments yet sends a submissive message back
    to Ráma.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rávaṇ attacks Arjuna or Kárttavírya on the banks of the Narmadá and is defeated,
    captured, and imprisoned before Pulastya intercedes for his release.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rávaṇ visits Kishkindhá and enters an alliance with Báli, the King of the
    Vánars, declaring that many possessions and relationships will be held in common.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Rávaṇ invades the kingdom of departed spirits and battles Yáma.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: The realm of departed spirits is described with a river of blood, lamentations,
    cries for water, a devouring worm, punishments of the guilty, and pleasures of
    the just.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yáma is defeated because he refrains from using his deadly weapon at Brahmá’s
    request, due to a prior divine promise that preserves Rávaṇ.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Rávaṇ goes under the earth into Pátála, described as a treasure-house of waters
    inhabited by serpents and Daityas and defended by Varuṇ.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: Rávaṇ subdues Bhogavatí, the city ruled by Vásuki, and reduces the Nágas or
    serpents to subjection.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Rávaṇ reaches Varuṇ’s imperial seat; Varuṇ is absent, but his sons fight the
    invader and Rávaṇ departs victorious.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Rávaṇ and Mándhátá fight with supernatural weapons until Pulastya and Gálava
    intervene and separate them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Rávaṇ returns home in the car Pushpak carrying virgin daughters of kings,
    Rishis, Daityas, and Gandharvas whom he has seized.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Meghanáda, also called Indrajít, captures Indra with magic art and later releases
    him after Brahmá intercedes and Indrajít receives a boon connected with sacrifice
    to the Lord of Fire.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Agastya explains that Hanumán’s failure to use his full strength earlier was
    caused by a Rishi’s curse that made him unaware of his own might.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: In spring, Ráma and pregnant Sítá sit together beneath Aśoka trees, and Sítá
    asks to visit holy hermitages on the Ganges where saints perform austerities.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Ráma hears public slander concerning Sítá’s captivity in Rávaṇ’s palace, knows
