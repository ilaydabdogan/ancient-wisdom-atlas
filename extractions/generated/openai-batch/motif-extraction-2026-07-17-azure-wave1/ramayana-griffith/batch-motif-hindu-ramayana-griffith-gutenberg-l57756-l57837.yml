candidate_motifs:
- id: motif:1
  label: Afterlife realm with punishments and rewards
  taxonomy_refs:
  - afterlife_journey_map
  - divine_judgment
  basis: The departed realm contains punitive images for the guilty and pleasures
    for the just, with Yáma as sovereign.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage is a summary and comparison note, not a full journey narrative
    through the afterlife.
- id: motif:2
  label: Descent beneath the earth to a serpent and water realm
  taxonomy_refs:
  - hero_descent
  - serpent
  basis: Rávaṇ goes under the earth into Pátāla, a water-treasure realm inhabited
    by serpents and Daityas, and subdues the Nágas.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: Rávaṇ is an invading antagonist rather than a conventional hero; the taxonomy
    label is applied to the descent pattern only.
- id: motif:3
  label: Boon-protected combatant
  taxonomy_refs: []
  basis: Yáma does not use his deadly weapon because Brahmá’s promise preserves Rávaṇ.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage states the protective mechanism, but not the full earlier
    context of the promise.
- id: motif:4
  label: Ritual sacrifice granting battle invincibility
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Indrajít releases Indra after obtaining the boon that sacrifice to the Lord
    of Fire will make him invincible in coming battle.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage summarizes the exchange and does not describe the ritual in
    detail.
- id: motif:5
  label: Sage or divine intercession averts or reverses captivity and death
  taxonomy_refs: []
  basis: Pulastya intercedes for Rávaṇ’s release, Pulastya and Gálava stop the fight
    with Mándhátá, and Brahmá intercedes for Indra’s release.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:8
  confidence: medium
  cautions: These interventions occur in different episodes and may not form a single
    unified motif without broader textual context.
