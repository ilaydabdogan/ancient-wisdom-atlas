canonical_text:
  quote: ''
  summary: Additional notes summarize festival practice for Lakshmi/Saraswati, dictionary-style
    attributes of Indra, and Vishnu's preserving role, cosmic sleep, and several avatars
    including flood rescue, ocean churning, demon defeat, Vamana's three steps, Buddha's
    reform, and Kalki's future world-ending renewal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A festival honors Lakshmi on the fifth lunar day of the light half of Magha,
    when she is identified with Saraswati, consort of Brahma and goddess of learning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lakshmi is to be worshipped with flowers, perfumes, rice, and water, and writing
    implements are given ritual honor.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: Pens, inkstands, and books are cleaned or wrapped, placed together, strewn
    with flowers and young barley, and given a holiday from ordinary writing.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Indra is described as chief of the secondary deities, presiding over paradise,
    the atmosphere, winds, and the eastern quarter of the sky.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Indra is associated with titles, a wife named Sachi or Indrani, a son Jayanta,
    a garden, city, palace, horse, elephant, and charioteer.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:6
  text: Vishnu is described as the preserving power and as becoming incarnate in different
    forms for the preservation of mankind in emergencies.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Before creation and after temporary annihilation, Vishnu sleeps on the waters
    floating on the serpent Sesha, and Brahma springs from a lotus growing from Vishnu's
    navel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: In the fish avatar, Vishnu saves Satyavrata, the seven Rishis, and their wives,
    who have taken refuge in an ark during a deluge that destroys the earth.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the tortoise avatar, Vishnu supports Mount Mandara at the bottom of the
    ocean while gods and demons use the serpent Vasuki as a rope to churn the waters
    for amrita and other sacred things.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the boar avatar, Vishnu rescues the earth from the demon Hiranyaksha in
    the ocean depths after a long contest; in the man-lion form he delivers the earth
    from Hiranyakashipu.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: In the dwarf avatar, Vishnu asks Bali for as much land as he can pace in three
    steps, expands to fill the world, and takes heaven and earth in two steps while
    leaving Patala to Bali.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Buddha avatar is described as reforming Brahmin religion and discouraging
    animal sacrifice; Kalki is described as a future white-horse figure who will end
    the present age by destroying the world and renovating creation.
  category: sequence
  evidence_refs:
  - ev:10
