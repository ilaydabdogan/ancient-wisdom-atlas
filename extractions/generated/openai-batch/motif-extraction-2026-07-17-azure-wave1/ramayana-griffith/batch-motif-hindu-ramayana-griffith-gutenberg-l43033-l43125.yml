canonical_text:
  quote: ''
  summary: Sugriva orders the Vanar chief Satabal to lead a large northern search
    for Janak's daughter and the robber or fiend. The itinerary passes through sacred
    mountains, barren wastes, Kailasa and Kuvera's palace, Krauncha's pass, the blessed
    land of the North Kurus, and finally the northern deep and sunless limit near
    Somagiri, where Brahma and sages are present; the searchers are then told to turn
    back.
  language: English
  quote_policy: summarized
