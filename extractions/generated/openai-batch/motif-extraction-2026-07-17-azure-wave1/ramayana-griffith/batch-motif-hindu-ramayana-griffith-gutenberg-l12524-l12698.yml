canonical_text:
  quote: ''
  summary: 'Rāma finds his father, the king, speechless and grief-stricken beside
    Queen Kaikeyī. Rāma asks Kaikeyī what has caused the king’s distress and affirms
    filial obedience. Kaikeyī explains that the king once granted her two boons and
    now must honor them: Bharat is to be installed on the throne, and Rāma is to go
    to Daṇḍak forest for fourteen years, wearing bark and matted hair. Rāma promises
    to obey his father’s command; the king remains overwhelmed by grief.'
  language: English
  quote_policy: summarized
