canonical_text:
  quote: "“This lovely grove will I destroy, / The cruel Rávaṇ’s pride and joy.”"
  summary: After being dismissed with honor, the Vánar called the Wind-God’s son decides
    that force is the only remaining expedient against the Rákshas foe. He plans to
    destroy Rávaṇ’s beloved grove in order to provoke Rávaṇ into battle, defeat his
    forces, and return to his lord the king. He then tears up blossoming trees, shatters
    fountains, levels pleasure structures, and leaves the fair place a bare ruin compared
    to the aftermath of blast or fire.
