canonical_text:
  quote: ''
  summary: A sage proposes that Janak’s brother’s two daughters marry Bharat and Śatrughna,
    joining the houses of Ikshváku and Videha. Janak accepts, fixes the same auspicious
    day for four marriages, and honors the sages. Daśaratha returns to perform offerings
    to the shades and then gives four hundred thousand decorated cows, with calves
    and filled pails, to Bráhmans for his four sons.
