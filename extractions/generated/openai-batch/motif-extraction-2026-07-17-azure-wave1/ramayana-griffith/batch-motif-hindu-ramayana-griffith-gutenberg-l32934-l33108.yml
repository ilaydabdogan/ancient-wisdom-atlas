canonical_text:
  quote: ''
  summary: Sítá rebukes Rávaṇ and warns that taking Rāma’s wife will bring punishment.
    Rávaṇ reveals his monstrous giant form after casting aside a gentle or saintly
    disguise, boasts of vast powers and form-changing, urges Sítá to abandon Rāma
    and become his bride, then seizes her by the hair and body. A golden magic car
    drawn by asses appears; Rávaṇ places Sítá in it and carries her through the sky
    while she cries to Lakshmaṇ, warns of Rávaṇ’s coming death by Rāma, and asks the
    forest, Godávarí, gods, birds, and deer to tell Rāma she has been stolen.
  language: English
  quote_policy: summarized
