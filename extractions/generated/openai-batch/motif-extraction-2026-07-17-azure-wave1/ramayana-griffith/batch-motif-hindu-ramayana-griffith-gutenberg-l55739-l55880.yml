canonical_text:
  quote: ''
  summary: After Rávaṇ is slain, heavenly beings rejoice and praise Ráma and his allies.
    Ráma honors Mátali, embraces Sugríva, and directs Lakshmaṇ to consecrate Vibhishaṇ
    as ruler with sea water from a golden urn. Ráma sends Hanúmán to Sítá with news
    of victory. Hanúmán finds Sítá guarded beneath a tree, tells her that Ráma has
    slain the foe and will soon come, offers to kill her guards, and receives her
    refusal based on compassion and duty. Sítá asks only to see Ráma, and Hanúmán
    carries her message back.
  language: English
  quote_policy: summarized
