canonical_text:
  quote: ''
  summary: Skilled workers, guides, guilds, and star-readers go before Bharat's host
    to prepare an imperial road and camp. They clear and level difficult ground, bridge
    ravines, cut channels, dig wells and tanks, place altars, and ornament the route
    with trees, banners, flowers, and sandal-water. Bharat's camp and road are described
    with royal and celestial comparisons, including Mandar, heavenly cars, Indra's
    metropolis, and the night sky.
  language: English
  quote_policy: summarized
