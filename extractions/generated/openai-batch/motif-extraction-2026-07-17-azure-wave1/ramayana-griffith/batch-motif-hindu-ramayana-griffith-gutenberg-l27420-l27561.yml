canonical_text:
  quote: ''
  summary: Rāma, Sītā, and Lakshmaṇ travel through the forest, reach a lake where
    unseen music is heard, and ask the sage Dharmabhrit to explain it. Dharmabhrit
    tells of the lake Panchāpsaras, made by the ascetic Māṇḍakarṇi, whose austerities
    frightened the gods; they sent five nymphs who drew him from penance, became his
    wives, and live with him in a palace beneath the lake. Rāma then stays among hermit
    settlements for years, returns to Sutīkshṇa, and asks the way to the hermit Agastya.
  language: English
  quote_policy: summarized
