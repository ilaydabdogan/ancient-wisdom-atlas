canonical_text:
  quote: ''
  summary: Śúrpaṇakhá sees the battlefield where Ráma has slain fourteen thousand
    foes, including Triśirás, Dúshaṇ, and Khara, then flees to Lanká. There she approaches
    Rávaṇ, who is enthroned among counsellors and described through his royal power,
    monstrous body, battle scars, thefts, violence against rites, austerities, and
    protection from most forms of death except a human arm. Bearing marks on her face,
    she begins to address him angrily before the council.
  language: English
  quote_policy: summarized
