canonical_text:
  quote: ''
  summary: After the death of Rávan’s brother Kumbhakarṇa, messengers report that
    his mangled body blocks Lanká’s gate. Rávan faints, mourns, calls Kumbhakarṇa
    his support, speaks of Yáma’s hall, and regrets ignoring Vibhishaṇ. Triśirás exhorts
    him to recover his courage and offers martial and mythic comparisons for destroying
    the enemy. Rávan sends his sons and warriors into battle. Narántak charges through
    the Vánar host on horseback, killing many, until Sugríva sends Angad. Angad, fighting
    without formal weapons, breaks Narántak’s attack, kills his horse, survives a
    blow, and crushes Narántak to death.
  language: English
  quote_policy: summarized
