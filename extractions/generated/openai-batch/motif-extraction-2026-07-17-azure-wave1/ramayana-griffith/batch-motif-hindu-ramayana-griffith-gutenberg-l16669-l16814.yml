canonical_text:
  quote: ''
  summary: Rāma, Sītā, Lakshmaṇ, and Sumantra halt on the first night of their forest
    journey near the Tamasā. Rāma speaks of Ayodhyā, his parents, and his brothers,
    accepts only water, and rests beside Sītā on a leafy bed. Lakshmaṇ and Sumantra
    keep watch through the night. At dawn Rāma sees the citizens sleeping nearby and
    decides to leave secretly so they will not suffer by following him. Sumantra yokes
    the chariot; the party crosses the Tamasā, conceals its route, and proceeds toward
    the hermit-haunted wood.
  language: English
  quote_policy: summarized
