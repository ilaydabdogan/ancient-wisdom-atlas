canonical_text:
  quote: ''
  summary: The Wind-God’s son, described as a Vánar chieftain, scales a lofty temple,
    proclaims allegiance to Kośal’s King, fights armed warders, tears out a pillar,
    and causes flames to consume the temple while killing many giants. He then rises
    into the air and warns that Vánar chiefs under Sugríva and a warrior lord associated
    with Raghu’s son will cross the sea and bring down Lanká and Rávaṇ. In the next
    canto Jambumáli, Prahasta’s son, is sent by Rávaṇ, wounds the Vánar with arrows,
    avoids a stone, cuts through an uprooted Sál tree, and is finally crushed by the
    Vánar with the shattered trunk. Rávaṇ responds in anger by sending his general’s
    sons.
  language: English
  quote_policy: summarized
