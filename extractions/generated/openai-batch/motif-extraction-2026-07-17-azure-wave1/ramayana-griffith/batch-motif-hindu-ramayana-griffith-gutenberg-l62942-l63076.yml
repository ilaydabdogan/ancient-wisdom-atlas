canonical_text:
  quote: ''
  summary: A sequence of editorial footnotes explains mythological references in the
    Ramayan, including earth-supporting elephants, battles of Devas and Asuras, divine
    genealogies, mythic rivers and seas, the churning-ocean cycle, Lakshmi’s sea-birth,
    and Indra’s destruction of Diti’s unborn offspring. Several notes include cautious
    comparisons to Greco-Roman myths or natural phenomena.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ancient Indian belief is described in which enormous elephants support
    the earth on their backs, and the earth trembles when one of them shakes its tired
    head.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A comparison is given to Virgil’s account of Enceladus buried under Aetna,
    whose movement causes disturbance and fire or smoke.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Devas and Asuras fight in the east, south, west, and north; the Devas
    are defeated in those directions, but not in the northeast.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The northeastern direction is called unconquerable and is recommended as a
    direction for work connected with clearing religious debts.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: Kapil is interpreted in the note as possibly a hidden fiery force connected
    with volcanic phenomena and is also named as one of the names of Agni, the God
    of Fire.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Garuḍ is identified as the son of Kaśyap and Vinatá.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Diti and Aditi are identified as wives of Kaśyap and as mothers respectively
    of Titans and Gods.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: One note refers to seven seas surrounding seven worlds in concentric rings.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: Apsaras are etymologically connected in the note with water and described
    as inhabitants of the water, nymphs of the stream, or possibly personifications
    of vapours forming mist or clouds.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: Surā is described as intoxicating liquor, while an etymological explanation
    links Sura, a god, with heaven.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: A footnote identifies Uccaiḥśravas as the high-eared horse of Indra and compares
    the horse’s production from the sea with Neptune’s production of a horse from
    the sea.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Kaustubha is described as a gem with living light on Lord Vishṇu’s breast.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: Lakshmī is described by the name Kshīrābdhi-tanayā, daughter of the Milky
    Sea, and her birth is compared with the Greek myth of Venus born from sea foam.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:14
  text: Indra is said to destroy Diti’s unborn fruit with his thunderbolt, after which
    the Maruts, Gods of Wind and Storm, come forth.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: A note interprets Diti in that myth as possibly the dry earth, Indra as the
    god of thunder who rends it open, and the Maruts as exhalations of the earth,
    while warning that such myths are difficult to interpret with certainty.
  category: relationship
  evidence_refs:
  - ev:14
