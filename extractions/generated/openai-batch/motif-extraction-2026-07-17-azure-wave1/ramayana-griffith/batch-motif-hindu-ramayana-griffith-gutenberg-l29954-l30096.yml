canonical_text:
  quote: "“Down sprang the giant, mace in hand, / On foot against the foe to stand.”"
  summary: Khara, seeing his allies and host destroyed by Rama, attacks Rama in a
    chariot with heavy volleys of arrows. Rama is wounded and his armor and bow are
    damaged, but he takes up Vishnu’s bow, given by Agastya, and methodically destroys
    Khara’s flag, horses, chariot, driver, hand, and bow, forcing Khara to descend
    on foot with a mace. Gods and saints watch from the sky and praise Rama.
  language: English
  quote_policy: quoted
