canonical_text:
  quote: ''
  summary: In the palace before Ráma’s exile, Daśaratha orders a chariot and gives
    Sítá robes and ornaments for the forest years. Kauśalyá instructs Sítá on wifely
    duty, and Sítá vows fidelity to her lord. Ráma consoles his mother, bids farewell
    to the royal women, and departs after reverencing the king. Sumitrá instructs
    Lakshmaṇ to serve Ráma and regard Sítá as his mother. Sumantra summons Ráma to
    the chariot as the fourteen-year forest exile begins under Kaikeyí’s command.
  language: English
