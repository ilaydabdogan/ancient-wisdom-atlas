canonical_text:
  quote: ''
  summary: An editorial note presents a free poetic version of the ancient story of
    the suppliant dove. A dove fleeing a hawk seeks refuge with the king of Káśí.
    The hawk claims the dove as rightful prey, while the king refuses to betray his
    guest. When the hawk demands the king’s own flesh weighed against the dove, the
    king cuts flesh from his body and finally places himself in the scale. Celestial
    signs follow; gods led by Indra arrive, bestow honors and Amrit, praise the king,
    and take him in a golden car. The passage concludes that the king won heaven and
    deathless fame by protecting the weak.
  language: English
