canonical_text:
  quote: |-
    With thee is heaven, where’er the spot;
    Each place is hell where thou art not.
  summary: The daughter of Videha's king, Rama's wife, speaks in anguish and anger.
    She insists that Rama must not leave her behind when he journeys to the wood,
    compares her devotion to Savitri's devotion to Satyavan, imagines the wilderness
    becoming pleasant if Rama is near, and says she would choose poison or death rather
    than endure separation from him for fourteen years.
  language: English
  quote_policy: quoted
