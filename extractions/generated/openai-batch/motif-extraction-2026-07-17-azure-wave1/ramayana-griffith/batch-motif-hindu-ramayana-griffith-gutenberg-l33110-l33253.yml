canonical_text:
  quote: |-
    Rávaṇ the spoiler bears me hence
    The helpless prey of violence.
  summary: Sítá, being carried away by Rávaṇ, sees the vulture Jaṭáyus on a lofty
    tree and asks him to tell Ráma and Lakshmaṇ what has happened. Jaṭáyus wakes,
    identifies himself, counsels Rávaṇ according to law and royal duty, urges him
    to release Sítá, warns him with comparisons to Vritra, Khara, a venomed snake,
    and Death’s coils, and vows to oppose him even at the cost of his life.
  language: English
  quote_policy: quoted
