  summary: A first-person speaker laments in a spring landscape that flowers, birds,
    breezes, trees, and the waters of Pampá no longer give pleasure because Sítá is
    absent and described as imprisoned in distant lands. He addresses Lakshmaṇ, describes
    forest and lake scenes, anticipates aid from a dark-winged bird, and says Love
    and spring intensify his grief.
