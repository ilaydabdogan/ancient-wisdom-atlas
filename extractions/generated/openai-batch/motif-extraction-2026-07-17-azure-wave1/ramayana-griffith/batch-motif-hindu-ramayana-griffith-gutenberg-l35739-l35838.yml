canonical_text:
  quote: ''
  summary: A mortally wounded royal vulture identifies the giant by lineage and dies.
    Ráma laments that the bird fought to free Sítá from the giant, honors him like
    a noble friend, and performs funeral rites with Lakshmaṇ, including a pyre, offerings,
    recited death texts, libations in the Godávarí, and bathing. The vulture is said
    to rise to a blissful celestial seat, and the brothers resume seeking the captor
    of Sítá.
  language: English
