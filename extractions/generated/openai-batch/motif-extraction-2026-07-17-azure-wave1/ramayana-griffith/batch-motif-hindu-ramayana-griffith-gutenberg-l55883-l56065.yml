canonical_text:
  quote: ''
  summary: After the battle, Sítá is prepared and brought before Ráma. Ráma orders
    that she come on foot and be seen openly by the assembled hosts. Sítá approaches
    with shame, fear, and joy, but Ráma publicly says that he fought for honour rather
    than love and rejects her because of her captivity under Rávaṇ. Sítá denies fault,
    insists her heart remained true, invokes her birth and marriage, and asks Lakshmaṇ
    to prepare a pyre, saying that fire will end her woes.
  language: English
  quote_policy: summarized
