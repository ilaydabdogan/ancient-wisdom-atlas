canonical_text:
  quote: ''
  summary: A Brahman hermit, son of Jamadagni, challenges Ráma to prove his prowess
    by drawing a powerful bow once owned by Vishṇu and preserved in the challenger's
    lineage. Daśaratha pleads fearfully for safety. The challenger recounts the history
    of two celestial bows, a contest between Śiva and Vishṇu, the transmission of
    the bows through sages and rulers, the killing of Jamadagni by Arjun, his own
    vengeance against Warriors, his gift of the conquered earth to Kaśyap, and his
    retreat to Mahendra before renewing the challenge to Ráma.
  language: English
  quote_policy: summarized
