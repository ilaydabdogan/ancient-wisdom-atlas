canonical_text:
  quote: ''
  summary: Ráma praises Sugríva as a truthful friend and champion, says the Rákshas
    who stole his queen has ensured his own destruction, and compares the coming vengeance
    to Indra’s slaying of Paulomí’s sire. A vast host of warriors and chiefs then
    arrives from many regions amid dust, darkness, and earth-shaking. Named leaders
    assemble with countless troops, bow before Sugríva, and Sugríva tells Ráma that
    every chief and warrior host is present.
  language: English
  quote_policy: summarized
