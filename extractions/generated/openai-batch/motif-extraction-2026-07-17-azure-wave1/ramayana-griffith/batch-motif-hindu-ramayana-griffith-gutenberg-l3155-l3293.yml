canonical_text:
  quote: ''
  summary: A group addressed by the mighty Sire produces countless sons in sylvan,
    monkey, bear, and ape forms, including named Vánar chieftains with divine or supernatural
    fathers. These beings possess great strength, can change form, are intended to
    kill a fiend, and are described as Ráma’s champions. After the Aśvamedh is completed,
    the gods, saints, kings, and guests depart; Daśaratha advises the kings to guard
    their realms and then returns to his city with his wives and retinue.
  language: English
  quote_policy: summarized
