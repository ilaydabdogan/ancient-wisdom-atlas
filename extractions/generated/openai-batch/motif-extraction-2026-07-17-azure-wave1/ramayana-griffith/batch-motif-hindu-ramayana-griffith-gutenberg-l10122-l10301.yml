canonical_text:
  quote: ''
  summary: Ráma departs amid public rejoicing. The monarch consults his counsellors,
    summons Ráma, and announces that auspicious stars and the people’s approval support
    Ráma’s consecration as Regent Heir. The monarch also cites dire omens and possible
    danger, orders Ráma and Sítá to fast and keep ritual discipline, and notes Bharat’s
    absence. Ráma reports the decree to his mother Kauśalyá, who prays and blesses
    him, and then Ráma tells Lakshmaṇ that he must share rule as his second self.
  language: English
  quote_policy: summarized
