canonical_text:
  quote: ''
  summary: Sita sees what appears to be Rama's severed head and bow, collapses, laments
    him as dead, and asks to die beside him. Ravana leaves for counsel with his ministers
    and orders his forces gathered. After he departs, the head and bow disappear.
    Sarama, a Rakshas woman who pities Sita, reveals that the sight was a magical
    illusion and reports that Rama is alive, has bridged the sea, crossed with his
    Vanara army, and stands on Lanka's shore.
  language: English
  quote_policy: summarized
