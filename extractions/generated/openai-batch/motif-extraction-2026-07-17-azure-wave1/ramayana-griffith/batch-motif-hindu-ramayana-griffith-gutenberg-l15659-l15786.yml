canonical_text:
  quote: ''
  summary: The people protest when they see Sítá dressed in bark. Daśaratha rebukes
    Kaikeyí, insisting that the oath concerned Ráma and not Sítá, and that Sítá should
    not be made to wear hermit clothing or suffer forest hardships. Ráma, still prepared
    to depart, asks his father to care tenderly for Kauśalyá in his absence. Daśaratha
    collapses in grief, laments seeing Ráma abandon royal garments for hermit dress,
    blames Kaikeyí, and orders Sumantra to prepare the chariot and drive Ráma beyond
    the state toward the wood.
  language: English
  quote_policy: summarized
