  quote: ''
  summary: Lakshman enters Sugriva’s splendid city and palace, observes courtly ease
    and pleasure, and becomes angry on Rama’s behalf. Sugriva fears Lakshman’s anger
    and sends Tara to calm him. Tara approaches, Lakshman’s anger softens, and he
    rebukes Sugriva for neglecting duty, friendship, affairs of state, and an agreed
    four-month obligation to help Rama.
