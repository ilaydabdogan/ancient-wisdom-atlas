canonical_text:
  quote: ''
  summary: Lakshmaṇ urges Ráma to continue searching Janasthán. Ráma finds the wounded
    vulture Jaṭáyus and first suspects him of harming Sítá, but Jaṭáyus reports that
    Rávaṇ abducted Sítá, fought him, cut his wings, and carried her south. Ráma mourns
    Jaṭáyus as a loyal royal bird. Before dying, Jaṭáyus confirms Rávaṇ’s act, mentions
    his magic and an ominous theft-hour, and foretells Rávaṇ’s defeat and Sítá’s recovery.
  language: English
  quote_policy: summarized
