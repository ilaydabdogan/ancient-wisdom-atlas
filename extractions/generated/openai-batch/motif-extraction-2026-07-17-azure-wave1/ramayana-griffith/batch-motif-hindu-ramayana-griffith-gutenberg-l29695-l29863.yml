canonical_text:
  quote: ''
  summary: Dúshaṇ summons five thousand demons against Ráma. Ráma withstands their
    missiles, destroys Dúshaṇ’s chariot and weapons, cuts off Dúshaṇ’s arms, and kills
    him. Spirits praise Ráma. Three more chiefs and the remaining demon crew attack
    and are killed. Khara then sends another force with his chiefs; Ráma slays the
    host, leaving Khara, Trisirás, and himself alive before Khara charges him.
  language: English
  quote_policy: summarized
