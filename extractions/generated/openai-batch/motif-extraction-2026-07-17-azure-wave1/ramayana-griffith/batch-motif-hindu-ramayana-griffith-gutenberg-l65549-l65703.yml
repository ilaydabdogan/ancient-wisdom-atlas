- id: motif:2
  label: departure from rejected lord to righteous ally
  taxonomy_refs:
  - departure
  basis: In the Bengal-recension summary, Vibhishaṇ leaves after abuse by Rávaṇ, receives
    Śiva’s advice, and seeks Ráma and the Vánar army.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage reports a recension variant in summary form and does not narrate
    the scene fully.
- id: motif:3
  label: extreme filial obedience
  taxonomy_refs: []
  basis: Kaṇdu is said to have killed a cow at his father’s command and is cited as
    an example of filial obedience.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The note is a cross-reference and does not provide the wider story.
- id: motif:4
  label: demon in animal form slain by ancestor
  taxonomy_refs:
  - shapeshifter
  basis: Keśarí kills an Asur or demon who appeared in elephant form, explaining later
    hostility between Vánars and elephants.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The note reports a Pauranik legend only briefly.
- id: motif:5
  label: refusal to surrender Sítá
  taxonomy_refs: []
  basis: Rávaṇ refuses to give up Sítá despite the possible combined force of Gods,
    Gandharvas, and fiends.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not itself narrate Sítá’s seizure, so a stronger stolen-beloved
