canonical_text:
  quote: ''
  summary: 'A set of additional notes discusses several mythic and cultural topics:
    a Vedic conflict between a bright heavenly god and Vritra, a dark demon who hides
    rain-clouds; medicinal herbs including Moly and Neem; accounts of the origin and
    description of the Nishadas from the Vishnu Purana and related texts; a large
    fig-tree with pendent shoots; house-completion rites; caste restrictions on killing
    elephants; and the guilt and punishment attached to killing Brahmans.'
