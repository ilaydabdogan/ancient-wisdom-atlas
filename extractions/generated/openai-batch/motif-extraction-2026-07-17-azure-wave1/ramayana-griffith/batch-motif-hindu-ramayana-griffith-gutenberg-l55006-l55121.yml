  summary: The passage describes a battle sequence in which Rávaṇ attacks the Vánars
    and duels Ráma with arrows, charms, animal-formed weapons, and spears. Ráma counters
    with arrows, a spell-aided dart, and a fire weapon. Vibhishaṇ kills Rávaṇ’s chariot
    steeds, Lakshmaṇ intervenes to save him, and Rávaṇ strikes Lakshmaṇ down with
    a Maya-forged spear. Ráma briefly grieves, then resumes battle and Rávaṇ flees.
  language: English
