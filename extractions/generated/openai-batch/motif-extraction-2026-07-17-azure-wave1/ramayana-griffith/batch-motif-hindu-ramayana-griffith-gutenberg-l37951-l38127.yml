canonical_text:
  quote: ''
  summary: Sugríva tells Ráma that Sítá was abducted by Rávaṇ, recounts seeing her
    carried through the sky and dropping her robe and ornaments as tokens, retrieves
    those tokens from a mountain cave, and gives them to Ráma. Ráma grieves and asks
    where Rávaṇ went; Lakshmaṇ recognizes Sítá’s anklets. Sugríva admits he does not
    know Rávaṇ’s dwelling, promises aid, counsels Ráma against despair, and Ráma regains
    composure.
  language: English
  quote_policy: summarized
