canonical_text:
  quote: ''
  summary: Lakshman announces Rama, Sita, and himself to Agastya through a pupil.
    Agastya joyfully summons them, and Rama enters the hermitage, seeing deer and
    many divine shrines. Rama reveres Agastya, who receives the visitors with hospitality,
    speaks on the duty owed to guests, and gives Rama a divine bow, shaft, inexhaustible
    quiver, arrows, and sword associated with Vishnu and Mahendra.
  language: English
  quote_policy: summarized
