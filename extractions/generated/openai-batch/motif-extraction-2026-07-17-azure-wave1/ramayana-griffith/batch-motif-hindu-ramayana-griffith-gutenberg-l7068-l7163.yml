canonical_text:
  quote: ''
  summary: In Canto LIV, the king attempts to take the cow of plenty from Saint Vaśishṭha
    by force. The cow escapes the king’s servants and returns to Vaśishṭha, who says
    the king’s military power is too great. The cow insists that Brahmanical power
    surpasses royal power and asks for a command. Vaśishṭha orders her to create a
    force, and she brings forth warrior hosts that fight King Viśvámitra’s army; the
    king counters with missiles and weapons.
