    retreat and bring him to the king, using young women as the means.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: medium
  cautions: Within this passage range, the plan is described and initiated, but Rishyasring
    has not yet actually left for the king's city.
- id: motif:2
  label: Erotic awakening of an inexperienced ascetic
  taxonomy_refs:
  - initiation
  basis: Rishyasring has never seen women or men, then encounters dancing and singing
    women, experiences desire, receives touch and drink, and is left lovesick.
  evidence_refs:
  - ev:2
  - ev:10
  - ev:16
  - ev:17
  - ev:19
  confidence: high
  cautions: The passage presents awakening through sensual contact, but it does not
    describe a completed sexual union.
- id: motif:3
  label: Seductive disguise as a ritual or ascetic form
  taxonomy_refs:
  - trickster_boundary
  basis: The scheme is called a harmless trick; women are dressed as hermits, use
    guile, and conceal their purpose while approaching a protected ascetic space.
  evidence_refs:
  - ev:1
