canonical_text:
  quote: ''
  summary: 'Sumantra recounts a priestly plan for King Lomapad: young women, disguised
    as hermits and carried on ships decorated like a grove, are sent into the forest
    to lure the secluded ascetic youth Rishyasring. The women wait until his father
    Vibhāṇḍak is absent, perform games, singing, dancing, and flirtatious gestures,
    and draw Rishyasring into conversation. He invites them to his hermitage and gives
    them water and forest food. They offer him counterfeit fruits, sweets, mead, embraces,
    and kisses; afterward they leave, saying vows must be performed. Rishyasring is
    left lovesick and distracted when his father returns.'
  language: English
  quote_policy: summarized
