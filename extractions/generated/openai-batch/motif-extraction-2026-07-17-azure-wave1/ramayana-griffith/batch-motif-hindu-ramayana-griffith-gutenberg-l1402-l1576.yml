  summary: Vālmīki seeks fit reciters for the completed tale and teaches the Ramayan
    to the twins Kuśa and Lava. They sing it before hermits, receive gifts and blessings,
    and later perform it before Rāma in a royal assembly. Their recitation opens with
    the Ikshvāku lineage, Manu, Sagar, and a description of Kośal and Ayodhyā.
  language: English
