  summary: The Wind-God’s son beholds a gem-studded airborne car made by Viśvakarmá,
    then enters Rávaṇ’s splendid palace, where guards stand outside and women, including
    princesses taken from defeated kings, sleep after revelry in a richly ornamented
    hall. He compares the palace to Indra’s heaven and the sleeping women to stars.
