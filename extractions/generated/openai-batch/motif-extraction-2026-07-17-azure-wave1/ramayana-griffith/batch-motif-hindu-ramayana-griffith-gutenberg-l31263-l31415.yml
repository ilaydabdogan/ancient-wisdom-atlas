canonical_text:
  quote: ''
  summary: Márícha counsels Rávaṇ not to attempt to take Sítá from Ráma. He praises
    Ráma as dutiful, virtuous, and overwhelmingly powerful, warns that Sítá would
    bring destruction on Rávaṇ and Lanká if seized, and advises consultation with
    chiefs including Vibhishaṇ. Márícha then recounts his former strength and violence
    in Daṇḍak wood and tells how Viśvámitra asked Daśaratha to send the young Ráma,
    not an army, to overcome him.
  language: English
  quote_policy: summarized
