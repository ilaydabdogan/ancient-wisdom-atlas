canonical_text:
  quote: ''
  summary: At Ráma’s command the Vánars gather trees, stones, and hills, cast them
    into the sea, and complete a hundred-league bridge over five days. Vibhishaṇ waits
    armed on the shore. Sugríva proposes that Hanumán and Angad bear Ráma and Lakshmaṇ
    through the air. The hosts cross the Nala-planned bridge to Lanká and rest by
    brooks and fruiting trees.
  language: English
  quote_policy: summarized
