canonical_text:
  quote: ''
  summary: Sutíkshṇa directs Ráma, with Sítá and Lakshmaṇ, southward toward Agastya’s
    hermitage, first by way of Agastya’s brother’s dwelling. Ráma identifies hermitage
    signs in the forest and recounts how Agastya destroyed the rákṣasa brothers Vátápi
    and Ilval, who used disguises and a fatal ritual meal to kill Bráhmans, thereby
    making the grove a refuge.
  language: English
  quote_policy: summarized
