canonical_text:
  quote: ''
  summary: The Vánars reach Praśravaṇ’s hill, bow to Raghu’s sons and their king,
    and Hanumán delivers Sítá’s jewel to Ráma while reporting that he found her guarded
    and threatened on the giants’ island. He relays Sítá’s signs, her message, and
    her one-month limit. Ráma presses the jewel to his breast, weeps, recalls its
    wedding and divine provenance, and asks Hanumán for Sítá’s words and guidance
    to reach her.
