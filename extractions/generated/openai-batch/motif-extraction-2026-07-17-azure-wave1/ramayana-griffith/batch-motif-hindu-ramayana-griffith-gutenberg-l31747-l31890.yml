canonical_text:
  quote: ''
  summary: Márícha warns the giant king that a sinful plan to take Rāma’s lady will
    bring death on the king, his family, Lankā, and the giant race. When the king
    refuses to heed him, Márícha reluctantly consents. The king orders him to use
    his shape to attract the lady while the king seizes her. The two giants travel
    in a jewelled flying chariot to Daṇḍak wood and reach the area of Rāma’s hermitage.
  language: English
  quote_policy: summarized
