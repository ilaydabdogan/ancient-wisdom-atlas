  summary: Palace women lament Rāma’s banishment to the forest and praise him as protector
    of the weak. Ayodhyā is shown in civic, ritual, animal, and celestial disorder
    after his departure. Daśaratha watches Rāma’s chariot vanish, faints, rejects
