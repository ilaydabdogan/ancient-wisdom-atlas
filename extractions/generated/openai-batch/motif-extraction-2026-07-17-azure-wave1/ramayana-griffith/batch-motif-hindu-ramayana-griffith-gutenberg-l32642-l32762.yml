canonical_text:
  quote: "“Rávaṇ the Rákshas king am I.”"
  summary: Sítá, addressing a disguised mendicant as a guest, recounts her lineage,
    marriage to Ráma, Ráma’s thwarted consecration, exile, and Lakshmaṇ’s loyal accompaniment.
    She offers hospitality and asks the stranger’s identity. The stranger reveals
    himself as Rávaṇ, king of the Rákshases, praises Sítá’s beauty, and offers her
    queenship in Lanká with wealth and attendants.
  language: English
  quote_policy: quoted
