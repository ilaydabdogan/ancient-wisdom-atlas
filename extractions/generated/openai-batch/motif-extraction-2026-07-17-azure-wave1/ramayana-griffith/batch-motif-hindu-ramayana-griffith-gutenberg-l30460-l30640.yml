canonical_text:
  quote: "“That hero in the wood beguile, / And steal his lovely spouse the while.”"
  summary: 'Akampan reports to Rāvaṇa that Rāma destroyed Janasthān and cannot be
    defeated openly. He advises guile: abduct Sītā so that Rāma will weaken in grief.
    Rāvaṇa approves the plan and visits Mārīcha, asking for aid. Mārīcha warns that
    provoking Rāma by stealing Sītā will bring ruin, and Rāvaṇa temporarily abandons
    the plan and returns to Laṅkā.'
  language: English
