canonical_text:
  quote: ''
  summary: Sita instructs Hanuman to remind Rama of an earlier incident at Chitrakuta,
    where Rama sent a magically empowered arrow after a crow that had wounded her.
    She asks why Rama punished a bird for hurting her yet has not struck the Rakshasa
    who stole her. She then gives Hanuman a gem from her hair as a token for Rama.
    A bracketed editorial note summarizes omitted dialogue in which Sita repeats her
    request that Rama hasten to rescue her, and Hanuman reassures her that Rama will
    destroy Ravana.
