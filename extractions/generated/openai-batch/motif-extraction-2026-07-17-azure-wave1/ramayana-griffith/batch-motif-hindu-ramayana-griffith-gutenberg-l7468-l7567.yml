  summary: Vaśishṭha’s sons reject Triśanku’s request for ritual aid after their father
    has refused him. When Triśanku says he will seek other aid, they curse him to
    become a Chaṇḍála. Transformed and abandoned by his followers, he goes to Viśvámitra,
    explains his wish to gain a heavenly mansion while still in his body through rites,
    and begs for aid against Fate.
