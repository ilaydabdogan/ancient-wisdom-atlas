canonical_text:
  quote: ''
  summary: A demon seeking combat is directed by Himalaya to the Vānar king Báli of
    Kishkindhá. The demon arrives in bull-like form, bellows at the city gate, and
    challenges Báli. Báli answers, removes his golden chain, fights the horned monster
    with bodily force, rocks, and trees, kills him, and hurls the corpse away. Blood
    from the corpse falls near Saint Matanga’s hermitage, provoking the sage’s anger
    at the defilement.
  language: English
  quote_policy: summarized
