  summary: Rama travels from Ayodhya through Kosala, hears common people condemn the
    king and Kaikeyi for his banishment, crosses several rivers, bids farewell to
    the city and its people, halts near the Ganga under an Ingudi tree, and is welcomed
    by Guha, the Nishada chief, who offers hospitality and his kingdom.
  language: English
