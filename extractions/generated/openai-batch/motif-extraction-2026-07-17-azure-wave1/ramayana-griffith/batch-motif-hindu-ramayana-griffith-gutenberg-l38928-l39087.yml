canonical_text:
  quote: ''
  summary: Rāma demonstrates his strength to Sugríva by shooting an arrow through
    seven palm trees, a hill, and lower realms before it returns to his quiver. Sugríva
    praises him and asks him to defeat Báli. At Kishkindhá, Sugríva challenges Báli,
    but Rāma withholds his shot because the two combatants look alike. Sugríva is
    defeated and complains. Rāma explains the danger of mistaken killing and has Lakshmaṇ
    place a flowering creeper garland around Sugríva’s neck as a recognition token
    before returning to Kishkindhá.
  language: English
  quote_policy: summarized
