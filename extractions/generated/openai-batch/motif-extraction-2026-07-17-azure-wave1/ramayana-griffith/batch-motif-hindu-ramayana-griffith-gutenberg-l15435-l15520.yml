canonical_text:
  quote: ''
  summary: Kaikeyí fears that Bharat may receive an emptied realm and cites Sagar’s
    expulsion of Asamanj as precedent for sending Ráma into exile. Daśaratha rebukes
    her. Siddhárth, the old councillor and sage, explains that Asamanj was exiled
    for drowning children, contrasts that crime with Ráma’s stated innocence, and
    warns that driving the guiltless Ráma into the wild would violate right and bring
    disgrace.
  language: English
  quote_policy: summarized
