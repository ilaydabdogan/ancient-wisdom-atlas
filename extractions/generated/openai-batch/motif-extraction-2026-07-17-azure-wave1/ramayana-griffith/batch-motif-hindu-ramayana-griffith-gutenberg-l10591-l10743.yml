canonical_text:
  quote: ''
  summary: Manthara warns Queen Kaikeyi that King Dasaratha will appoint Rama as heir
    associate and frames this as danger to Kaikeyi and Bharat. Kaikeyi first rejoices
    and rewards Manthara, saying Rama is as her own son. Manthara rejects the gift
    and intensifies her warning, predicting Kausalya’s rise and Bharat’s fall. Kaikeyi
    answers by praising Rama’s virtue and rightful claim, saying he will protect his
    kin and that Bharat will later inherit or share the kingdom.
  language: English
