canonical_text:
  quote: ''
  summary: 'The passage presents the argument or summary of the Ramayana as seen and
    sung by Vālmīki: through ritual meditation he gains vision of Rāma’s life, then
    recounts Rāma’s birth, exile, forest wanderings, Sītā’s abduction, alliances,
    Hanumān’s mission to Laṅkā, the bridge and war, Sītā’s restoration and vindication,
    Rāma’s return and kingship, and later events still to come.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The hermit receives the poem’s seed, wets his lips with water, sits reverently
    on holy grass with its points bent toward the east, and enters meditation and
    poetry.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Through virtue, holy thought, and rite, the hermit gains sight of what befell
    Rāma, his brother, Sītā, Daśaratha, the queens, the people, and court; the vision
    includes present, past, and future.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vālmīki rehearses the tale of Raghu’s line as Nārada had earlier traced its
    outline.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The summary includes Rāma’s princely birth, virtues, wooing of Janak’s child,
    breaking of an unmatched bow, and a fight with his namesake Rāma.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rāma is chosen for the throne, but Kaikeyī’s counsel disrupts the plan and
    leads to his banishment; Daśaratha grieves and dies.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rāma leaves following crowds behind, speaks with Guha, orders his driver to
    return, crosses the Gaṅgā, is entertained by Bharadvāja, and reaches Chitrakūṭa
    hill.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Bharat journeys to Rāma, makes earnest supplication, pays drink-offerings
    to their father, receives Rāma’s sandals as emblems of his right, and spends years
    at Nandigrāma.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The forest summary includes Daṇḍak wood, Anasūyā’s balsam, Indra’s appearance,
    Agastya’s heavenly bow, residence at Pañcavaṭa, Śūrpaṇakhā’s disfigurement, the
    fall of Triśirā and Khara, Rāvaṇ’s revenge, Mārīcha’s doom, and Sītā’s abduction.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: After Sītā’s abduction, Rāma grieves, the Vulture-king is slain, Kabandha
    is killed, Rāma reaches Pampā, meets Hanumān and Sugrīva, forms friendship, and
    Bāli is slain so Sugrīva reigns.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The search for Sītā includes the gathering of hosts, sending spies, Rāma’s
    ring, a cave with a bear, Sampāti becoming a friend, and Hanumān’s leap across
    the sea toward Laṅkā.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Hanumān enters Laṅkā at evening, searches through the city, finds captive
    Sītā in the Aśoka garden, speaks with her, gives Rāma’s ring, receives her gem,
    destroys the grove, is seized, and Laṅkā burns with hostile fire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Rāma speaks with Ocean, Nala builds a bridge, the army crosses, a treaty with
    Vibhīshaṇ is made, Rāvaṇ’s slaughter is planned, Kumbhakarṇa, Meghanāda, and Rāvaṇ
    are killed, and captive Sītā is brought again.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Vibhīshaṇ is placed on the throne; the flying chariot Pushpak appears; Brahmā
