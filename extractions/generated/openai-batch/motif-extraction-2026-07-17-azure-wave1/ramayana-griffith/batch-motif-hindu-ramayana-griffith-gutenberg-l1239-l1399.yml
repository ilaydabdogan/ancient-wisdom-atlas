candidate_motifs:
- id: motif:1
  label: visionary sage receives and narrates total life-story
  taxonomy_refs:
  - wisdom
  basis: Vālmīki’s ritual meditation and sanctity give him sight of present, past,
    and future events, enabling him to narrate Rāma’s life.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: This is framed as poetic and ascetic vision in the passage; broader doctrinal
    interpretation is not supplied here.
- id: motif:2
  label: prince’s enthronement thwarted by court intrigue and exile
  taxonomy_refs:
  - departure
  - royal_legitimacy
  basis: Rāma is chosen for the throne, Kaikeyī’s counsel disrupts the plan, and he
    is driven forth banished.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage summarizes events and does not give the full political dialogue
    or motives beyond Kaikeyī’s malice and counsel.
- id: motif:3
  label: royal authority preserved through symbolic substitute
  taxonomy_refs:
  - royal_legitimacy
  basis: Rāma gives Bharat his sandals as emblems of his right, and Bharat spends
    years at Nandigrāma.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage calls the sandals emblems of Rāma’s right but does not expand
    the administrative details.
- id: motif:4
  label: bride won through unmatched bow feat
  taxonomy_refs:
  - sacred_marriage
  basis: Rāma wins Janak’s child and breaks the bow that none could bend.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage supports a bride-winning feat; the taxonomy link to sacred_marriage
    is cautious because the passage itself does not explicitly call the marriage sacred.
- id: motif:5
  label: abduction of the beloved wife
  taxonomy_refs:
  - stolen_beloved
  basis: The summary connects Rāvaṇ’s vengeance, Mārīcha’s doom, and the rape or abduction
    of the fair Videhan lady, followed by her captivity in Laṅkā.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The passage uses summary phrasing and does not narrate the abduction scene
    in detail.
- id: motif:6
  label: hero’s grief followed by alliance with helpers
  taxonomy_refs: []
  basis: Rāma weeps after Sītā is lost, then meets Hanumān and Sugrīva, forms friendship,
