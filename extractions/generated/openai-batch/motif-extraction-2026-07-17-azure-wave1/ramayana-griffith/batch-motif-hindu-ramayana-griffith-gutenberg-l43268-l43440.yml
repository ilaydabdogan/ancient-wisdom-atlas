canonical_text:
  quote: ''
  summary: Sugríva’s search parties return from several directions after failing to
    find Sítá, while Hanumán, Angad, Tára, and other Vánars continue through Vindhya,
    a cursed barren region, and thick forests. Angad kills a hostile Asur, then urges
    renewed effort; Gandhamádan agrees, and the Vánars resume the search but still
    do not find Sítá.
  language: English
  quote_policy: summarized
