    brooks, thickets, wastelands, dens, and difficult places, and that they slew monstrous
    creatures.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The searchers state that Hanumán may still find the Maithil lady because the
    robber fiend was seen flying toward his quarter of the sky.
  category: speech
  evidence_refs:
  - ev:3
