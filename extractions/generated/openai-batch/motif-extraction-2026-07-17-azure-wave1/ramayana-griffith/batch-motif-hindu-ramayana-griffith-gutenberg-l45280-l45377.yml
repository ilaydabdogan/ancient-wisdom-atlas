  summary: A Vánar moves through guarded Rákshas palace precincts, passing courts,
    gardens, named residences, armed demonic watchers, elephants, royal ornaments,
    and then entering Rávaṇ’s palace. Inside he sees gems, weapons, flowers, women,
    lakes with lilies and lotuses, the Flower-named car with sculptured animals and
    serpents, and an artistic image of Lakshmí holding a lotus beside a pool.
  language: English
