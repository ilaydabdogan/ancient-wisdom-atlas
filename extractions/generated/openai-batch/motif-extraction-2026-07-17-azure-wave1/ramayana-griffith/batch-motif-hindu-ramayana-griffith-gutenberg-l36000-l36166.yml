  quote: ''
  summary: Lakshman, held by the giant Kabandha, urges Rama to flee. Rama rebukes
    fear. Kabandha threatens to eat the brothers, who then cut off his arms. Lakshman
    identifies Rama and explains that Rama is searching for his stolen wife. Kabandha,
    dismembered, welcomes them and begins to explain how pride and a sage's curse
    left him in his grisly form.
