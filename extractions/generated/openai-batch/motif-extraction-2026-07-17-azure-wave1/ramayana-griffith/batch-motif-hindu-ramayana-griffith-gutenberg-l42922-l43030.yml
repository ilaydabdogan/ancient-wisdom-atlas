canonical_text:
  quote: ''
  summary: Sugriva instructs Susheṇ to lead a large Vānar force westward in search
    of Rāvaṇ and the Maithil queen. The instructions catalogue western lands, mountains,
    seas, caves, divine or dangerous beings, sacred mountains including Meru and Asta,
    Varuṇ’s palace, and the hermit Sāvarṇi, beyond which lies an unknown sunless sea.
  language: English
  quote_policy: summarized
