canonical_text:
  quote: ''
  summary: 'Ráma, Lakshmaṇ, and the sage cross the Ganga to Viśálá. At Ráma’s request,
    the sage recounts an ancient episode: the rival sons of Diti and Aditi, offspring
    of Kaśyap, seek immortality by churning the milky sea. They use Vásuki as a churning
    rope and Mandar mountain as the pole. Venom emerges first, threatening gods, fiends,
    and men, and Śiva drinks it after Vishṇu’s counsel. When Mandar sinks, Vishṇu
    takes tortoise form and supports it. Further churning produces a healing sage,
    the Apsarases, Surā, Uchchaihśravas, Kaustubha, and Soma.'
  language: English
  quote_policy: summarized
