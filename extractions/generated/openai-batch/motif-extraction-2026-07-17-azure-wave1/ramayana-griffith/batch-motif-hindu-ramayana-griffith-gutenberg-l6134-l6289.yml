candidate_motifs:
- id: motif:1
  label: Quest for an immortalizing drink
  taxonomy_refs:
  - mystical_quest
  basis: The rival divine broods deliberately churn the milky sea to release a life-bestowing
    drink and remain immortal in youthful prime.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage names the drink and purpose clearly, but does not describe
    possession of the Amrit within the supplied excerpt.
- id: motif:2
  label: Cosmic churning with serpent and mountain
  taxonomy_refs:
  - cosmic_mountain
  - serpent
  basis: Vásuki is used as churning-string and Mandar mountain as pole in the churning
    of the milky sea.
  evidence_refs:
  - ev:4
  - ev:7
  confidence: high
  cautions: The taxonomy pairing is based on literal serpent and mountain elements;
    no external motif index is invoked.
- id: motif:3
  label: Catastrophic first product contained by a god
  taxonomy_refs:
  - world_destroying_fire
  basis: The first dangerous emergence is flame-like poison that threatens the realms
    of god, fiend, and man until Śiva drinks it.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The destructive substance is poison, not literal fire; the fire taxonomy
    is supported only by the passage’s flame comparison and consuming action.
- id: motif:4
  label: Deity assumes animal form to stabilize the world-task
  taxonomy_refs:
  - shapeshifter
  basis: Vishṇu takes the semblance of a tortoise, supports Mandar on his back, grasps
    the summit, and joins the churning.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage describes a divine assumption of tortoise form but does not
    frame it with broader avatāra doctrine.
- id: motif:5
  label: Ocean-born beings and treasures
  taxonomy_refs:
  - sacred_birth
  basis: A healing sage, Apsarases born from foam and water, Surā, a divine steed,
    a gem, and the Moon God emerge from the churned sea.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: medium
  cautions: Some emergent items are beings while others are treasures; the sacred-birth
    taxonomy applies most directly to the beings born or rising from the sea.
- id: motif:6
  label: Rival kinship groups distinguished by accepting or rejecting a maiden
  taxonomy_refs:
  - duality
  basis: Diti’s sons decline Surā while the rival brood honors her, and the passage
    uses this opposition to explain the names Asurs and Suras.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is an etiological contrast in the passage; it is not explicitly called
    a cosmic dualism by the text.
