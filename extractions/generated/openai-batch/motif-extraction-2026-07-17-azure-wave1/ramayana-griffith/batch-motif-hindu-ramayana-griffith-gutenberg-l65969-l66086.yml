  quote: ''
  summary: A sequence of editorial footnotes identifies peoples and regions named
    in the Ramayana and related Sanskrit sources. Several notes describe fabulous
    or ethnographic peoples with extraordinary bodies, including people whose ears
    serve as coverings, one-footed people, and people described as half tiger and
    half human. The notes explicitly compare some of these fabulous peoples with accounts
    in Mandeville, Pliny, and Isidore, while also cautioning that such epithets may
    be exaggerations or references to customs rather than literal descriptions.
  language: English
