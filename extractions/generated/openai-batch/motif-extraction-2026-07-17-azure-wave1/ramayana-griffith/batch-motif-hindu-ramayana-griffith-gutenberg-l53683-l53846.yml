canonical_text:
  quote: ''
  summary: In a battle passage, the Vánar forces attack Kumbhakarṇa with mountains,
    rocks, and trees, flee in terror, and are rallied by Angad. Kumbhakarṇa kills
    many with his mace and spear, defeats several named Vánar champions, devours captives,
    and causes another rout. Angad confronts him and is dashed senseless; Sugríva
    then challenges him with a shattered hill.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Vánars stop their flight, stand for war again, and throw mountain peaks
    and flowering trees at the foe.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rocks break against Kumbhakarṇa’s body while he remains unmoved and apparently
    unconscious of the strokes.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kumbhakarṇa charges fiercely; Vánars fall under his feet, flee toward the
    shore and bridge, climb trees, seek mountain and cave, or hide in a dell.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Angad sees the chieftains fleeing and calls them back to battle, saying there
    is no safe hidden place on earth and urging them to remove shame from their names.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The frightened Vánars say they have fought in vain, have seen their mightiest
    slain, fear the giant’s force, and flee because their lives are dear.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Angad cheers the Vánars; they turn, form again, and wait under his command.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: After reforming, the Vánars again seize rocks and fallen trees, attack Kumbhakarṇa,
    and are killed in large numbers by his mace.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Dwivid runs with an uprooted mountain and throws it; it passes over Kumbhakarṇa’s
    head and crushes many giants, steeds, and cars in his host.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Hanúmán sends rocks and trees against Kumbhakarṇa, then meets his charge with
    a woody hill; Kumbhakarṇa reels and then strikes Hanúmán on the breast.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Níla hurls a fragment of a mountain height, but Kumbhakarṇa strikes the rock
