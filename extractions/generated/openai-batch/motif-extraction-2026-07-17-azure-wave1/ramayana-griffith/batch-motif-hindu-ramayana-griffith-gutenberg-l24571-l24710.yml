canonical_text:
  quote: ''
  summary: Bharata speaks to Rāma by the river, praising Rāma’s wisdom and asking
    him to pardon Kaikeyī and Daśaratha’s offence. He argues that forest asceticism
    does not suit royal duty, urges Rāma to accept consecration and return to Ayodhyā
    as rightful king, and vows to follow him into the forest if refused. Rāma remains
    firm in keeping his father’s decree, while the assembled people weep, admire his
    steadfastness, and support Bharata’s plea.
  language: English
