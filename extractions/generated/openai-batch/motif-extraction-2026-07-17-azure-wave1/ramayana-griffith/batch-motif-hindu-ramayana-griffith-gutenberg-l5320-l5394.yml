canonical_text:
  quote: ''
  summary: Ráma asks the saint how to cross the Śona and later asks to hear the story
    of the three-pathed Gangá. The travelers reach the holy Jahnaví/Gangá, bathe,
    make oblations, offer to Fire, and sit around Viśvámitra. The sage recounts that
    Himálaya and Mená are parents of two daughters, Gangá and Umá. The gods request
    Gangá, and Himálaya gives her to the Immortals for the welfare of the three worlds;
    Gangá is described as cleansing and purifying. Umá performs austerities and becomes
    Rudra’s bride. The passage ends with a translator’s note about omitted cantos.
  language: English
  quote_policy: summarized
