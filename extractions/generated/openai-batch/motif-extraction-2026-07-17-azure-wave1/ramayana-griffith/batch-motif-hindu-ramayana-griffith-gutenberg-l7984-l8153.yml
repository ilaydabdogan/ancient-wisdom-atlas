canonical_text:
  quote: ''
  summary: The passage first describes Śunahśepha being bound as a sacrificial victim,
    praying to deities, and receiving long life while the king gains the sacrifice’s
    fruit. It then follows Viśvámitra through repeated cycles of severe austerity,
    partial recognition by Brahmá, interruption by Menaká, renewed penance in northern
    mountains, and Indra’s plan to send Rambhá, aided by Kandarpa and a spring bird-form,
    to disrupt the ascetic’s rites.
  language: English
  quote_policy: summarized
