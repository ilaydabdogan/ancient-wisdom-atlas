canonical_text:
  quote: ''
  summary: The passage describes a fierce battle in which Angad fights and beheads
    a giant opponent after an exchange of arrows, trees, rocks, mace blows, fists,
    swords, and shields. An editorial summary reports further sallies in which Akampan
    and Prahasta lead forces and fall, with Hanuman and Nila killing opponents using
    trees or mountain-like missiles. Ravan, enraged by the deaths of his commanders,
    decides to take the field himself, rides out with a giant host, and is observed
    by Rama, who asks Vibhishan to identify the leaders in the array.
