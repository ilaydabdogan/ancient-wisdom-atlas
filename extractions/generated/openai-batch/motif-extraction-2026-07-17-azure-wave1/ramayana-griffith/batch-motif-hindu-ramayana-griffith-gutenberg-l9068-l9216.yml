canonical_text:
  quote: ''
  summary: Yudhájit arrives to see Bharat and is honored by Daśaratha. The next morning
    Daśaratha, his sons, and the sages go to the sacrificial ground for the wedding
    rites. Janak and Vaśishṭha arrange the ritual; Vaśishṭha prepares the altar and
    fire. Janak gives Sítá to Ráma and the other maidens to Lakshmaṇ, Bharat, and
    Śatrughna. The couples join hands, circle the fire and sacred ground, and heavenly
    signs mark the wedding day.
  language: English
  quote_policy: summarized
