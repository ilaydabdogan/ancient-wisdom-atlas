  summary: A sequence of explanatory footnotes defines Veda as sacred knowledge, gives
    comparative linguistic and cultural notes, identifies figures and places from
    the Ramayana and Hindu tradition, summarizes a myth explaining the Moon's periodic
    waning and recovery, explains ascetic garb and the twice-born initiation, identifies
    Meru and Kailasa as sacred mountains, and notes motifs involving royal sandals,
    Jatayu's defense of Sita, Brahma's conditional protection of Ravana, Ocean personified,
    and Rama's Bridge.
  language: English
  quote_policy: summarized
