canonical_text:
  quote: ''
  summary: The Vánar and allied leaders stand with Vibhishaṇ before fortified Lanká
    and discuss how to enter it. Vibhishaṇ reports the enemy dispositions at the four
    gates. Ráma assigns commanders to attack the gates and the center, orders shape-changing
    Vánars to retain their own form for recognition, and then looks toward Suvela
    mountain with a desire to climb it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The chieftains stand with Vibhishaṇ in enemy land and examine their hopes
    and fears in council.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lanká is described with ascending towers, massive walls, barred portals, and
    strong guard under Rávaṇ.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Vibhishaṇ says his own lords entered within Lanká’s walls, learned the enemy’s
    plan and order, and returned to him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'Vibhishaṇ reports enemy commanders by direction: Prahasta at the eastern
    gate, Mahodar at the southern gate with Mahápárśva aiding him, Indrajít at the
    western gate, and Rávaṇ with a host at the northern approach.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The defending forces include Rákshas or giant troops armed with swords, maces,
    battle-axes, and lances, and armies with elephants, cars, and steeds.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ráma assigns Níla to the eastern gate, Angad to the southern gate, Hanúmán
    to the western gate, and himself with Lakshmaṇ to the northern gate.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Ráma says he has sworn to kill Rávaṇ, whom he describes as armed with a boon
    from Brahmá, defying the gods, and oppressing the just and wise.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ráma directs Jámbaván and the King of Vánars to bring their bravest forces
    and force their way to the center.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'Ráma orders the shape-changing Vánar chiefs not to disguise themselves in
    human form but to keep Vánar semblance; he states that only seven will appear
    in human form: himself, Lakshmaṇ, Vibhishaṇ, and the four who left Lanká with
    Vibhishaṇ.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: After addressing the chiefs, Ráma gazes at Suvela’s crest and longs to climb
    the mountain height.
  category: action
  evidence_refs:
  - ev:6
