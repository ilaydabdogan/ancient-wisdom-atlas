  quote: ''
  summary: Rāma, Sītā, and Lakṣmaṇ enter a sacred hermitage in Daṇḍak wood, are received
    and honored by ascetics, and hear the hermits appeal to Rāma as royal protector.
    The next morning they depart into the deeper forest, where the giant Rākṣasa Virādha
    appears, seizes Sītā, identifies himself, and threatens the brothers.
  language: English
