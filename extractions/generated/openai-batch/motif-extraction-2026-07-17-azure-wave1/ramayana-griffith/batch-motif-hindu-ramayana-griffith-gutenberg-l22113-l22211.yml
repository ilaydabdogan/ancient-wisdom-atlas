canonical_text:
  quote: ''
  summary: After hearing Guha’s account, Bharat collapses in grief. Śatrughna, Bharat’s
    mothers, and Kauśalyá gather around him; Kauśalyá laments the death of the king
    and the exile of Ráma and Lakshmaṇ. Bharat recovers and asks Guha where Ráma,
    Lakshmaṇ, and Sítá stayed, what they ate, and where they slept. Guha recounts
    that Ráma refused gifts of food and fruit, drank water brought by Lakshmaṇ, fasted
    with Sítá, and performed evening worship. Lakshmaṇ prepared a bed of sacred grass
    beneath a tree, bathed their feet, and then kept armed watch through the night
    with Guha and Guha’s followers.
  language: English
  quote_policy: summarized
