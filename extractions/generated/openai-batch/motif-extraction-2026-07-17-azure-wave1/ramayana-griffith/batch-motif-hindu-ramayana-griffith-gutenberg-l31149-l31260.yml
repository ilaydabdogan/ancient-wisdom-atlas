canonical_text:
  quote: ''
  summary: 'Rávaṇ tells Márícha why he has come: Ráma has slain the giant forces at
    Janasthán, including Khara, Dúshaṇ, and Triśirás. Rávaṇ accuses Ráma of mutilating
    Śúrpaṇakhá and declares his plan to seize Sítá. He asks Márícha to appear as a
    golden deer with silver spots so that Sítá will send Ráma and Lakshmaṇ after it,
    leaving her undefended. Márícha reacts with terror and begins to counsel Rávaṇ
    against the plan.'
  language: English
  quote_policy: summarized
