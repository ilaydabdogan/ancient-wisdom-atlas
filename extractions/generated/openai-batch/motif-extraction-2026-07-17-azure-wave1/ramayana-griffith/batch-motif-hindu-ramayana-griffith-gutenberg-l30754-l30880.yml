  summary: Śūrpaṇakhā rebukes a demon king for neglecting royal duty, ignoring spies,
    and failing to perceive the destruction of his forces by Rāma. She reports that
    Rāma has slain many giants and made Janasthān safe for saints. The demon king
    then reacts in fury and questions her about Rāma and about who maimed her.
  language: English
