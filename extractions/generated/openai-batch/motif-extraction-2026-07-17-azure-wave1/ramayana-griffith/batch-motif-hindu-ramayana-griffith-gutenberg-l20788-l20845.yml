canonical_text:
  quote: Is to the mother like her son.
  summary: Surabhí answers Indra that she mourns two children born from her body who
    toil painfully under a cruel driver. Indra recognizes the depth of a mother's
    grief. The passage then applies this example to Kauśalyá, bereft of Ráma, and
    an unnamed speaker rebukes a Queen, vows to perform due rites, restore the rightful
    ruler to Ayodhyá, retire to the forest, and finally falls to the ground in rage.
  language: English
  quote_policy: quoted
