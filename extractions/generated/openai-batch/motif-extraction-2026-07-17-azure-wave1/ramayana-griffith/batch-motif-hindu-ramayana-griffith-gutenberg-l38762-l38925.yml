canonical_text:
  quote: ''
  summary: 'Matanga curses the Vánar responsible for throwing Dundubhi’s corpse into
    his hermitage, making the region deadly for him and dangerous for other Vánars.
    The curse keeps Bāli away from Rishyamúka, where Sugríva finds refuge. Sugríva
    describes Bāli’s strength and asks for proof of Ráma’s power: throwing the demon
    bull’s remains and piercing a Sál tree. Ráma lightly sends Dundubhi’s frame twenty
    leagues, but Sugríva asks for the tree test because the bones are now dried and
    light.'
  language: English
  quote_policy: summarized
