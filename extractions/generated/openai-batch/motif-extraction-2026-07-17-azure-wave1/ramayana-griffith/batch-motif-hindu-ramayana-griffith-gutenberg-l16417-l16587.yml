canonical_text:
  quote: ''
  summary: Sumitrá consoles Kauśalyá by presenting Ráma’s forest exile as an act of
    duty to his father, foretelling his protection, return, and kingship. The people
    of Ayodhyá follow Ráma’s chariot in grief; Ráma asks them to give their loyalty
    to Bharat and to comfort the king. Elder twice-born men then call to the horses
    drawing Ráma’s car, urging them to turn back toward the royal residence.
  language: English
  quote_policy: summarized
