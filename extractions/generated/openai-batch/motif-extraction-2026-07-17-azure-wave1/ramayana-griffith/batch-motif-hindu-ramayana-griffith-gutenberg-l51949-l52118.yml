canonical_text:
  quote: ''
  summary: During a night battle, Rákshasas and Vánars fight in darkness and confusion.
    Ráma kills attacking giants with arrows. Indrajít, defeated after Angad destroys
    his chariot team, vanishes and attacks invisibly by magic. He wounds the Vánar
    searchers and Rāma and Lakṣmaṇa, binds the brothers with a serpent noose, and
    boasts that they are slain. The Vánar chiefs lament while Vibhishaṇ perceives
    Indrajít despite his concealment; the giants praise Indrajít.
  language: English
  quote_policy: summarized
