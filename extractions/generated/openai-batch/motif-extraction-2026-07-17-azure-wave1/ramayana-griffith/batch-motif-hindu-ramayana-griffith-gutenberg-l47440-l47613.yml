canonical_text:
  quote: ''
  summary: Ravana sends youthful Aksha against Hanuman. Aksha attacks from a splendid
    chariot that can move on earth and through the clouds, but Hanuman rises into
    the air, defeats him, and kills him. Ravana then sends Indrajit, who uses a Brahma-charmed
    magic shaft to bind Hanuman. Rakshasas add hemp and bark bonds, beat him, and
    drag him to Ravana. Hanuman observes Ravana’s jeweled, ten-headed royal splendor
    and reflects that Ravana’s power would be world-protecting if not opposed to right
    and law. Ravana wonders whether Hanuman may be Nandi or another supernatural being
    and orders Prahasta to question him. Prahasta asks whether Hanuman is a divine
    agent or spy and warns him to speak truthfully.
  language: English
  quote_policy: summarized
