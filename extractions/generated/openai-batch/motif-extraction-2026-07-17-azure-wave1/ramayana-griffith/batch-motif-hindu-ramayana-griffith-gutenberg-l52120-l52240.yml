canonical_text:
  quote: ''
  summary: After Rāma and Lakṣmaṇa lie motionless on the battlefield as if dead, Vibhishaṇ
    reassures Sugrīva that they are held by magic and will revive. Indrajīt reports
    the apparent fall of the princes to Rāvaṇ, who rejoices. Vānars keep watch over
    the fallen brothers. Rāvaṇ orders Sītā’s warders to bring her by aerial car to
    see Rāma and Lakṣmaṇa lying amid the slain, hoping grief will turn her toward
    him. Sītā sees the battlefield and begins to lament.
  language: English
  quote_policy: summarized
