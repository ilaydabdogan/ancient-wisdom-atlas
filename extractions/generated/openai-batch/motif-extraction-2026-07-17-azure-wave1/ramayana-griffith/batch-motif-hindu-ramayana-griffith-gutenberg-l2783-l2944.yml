canonical_text:
  quote: ''
  summary: After a sequence of royal sacrificial rites, Daśaratha distributes ritual
    fees, asks Rishyaśring for sons, and receives the promise of four sons. Rishyaśring
    begins another rite and petitions the assembled gods to grant the king’s request.
    The gods then appeal to Brahmā about Rāvaṇ’s oppression and the boon that protects
    him from gods, demons, and other beings. Brahmā states that Rāvaṇ can be killed
    only by a man because he had disregarded humans. Vishṇu arrives, is praised as
    refuge of the suffering worlds, and asks what he may do.
  language: English
  quote_policy: summarized
