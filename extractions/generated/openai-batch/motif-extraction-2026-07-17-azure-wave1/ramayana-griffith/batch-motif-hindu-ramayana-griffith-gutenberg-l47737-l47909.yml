canonical_text:
  quote: ''
  summary: Rávaṇ decides not to kill Hanumán as an envoy but orders his tail set on
    fire as punishment. The Rákshasas bind, oil, and ignite the tail and parade him
    through Lanká. Sítá prays to the fire to spare him, and the fire becomes harmless
    to him. Hanumán changes size, escapes his bonds, kills guards, and uses the burning
    tail to set Lanká’s palaces aflame, sparing Vibhishaṇ’s house. He later fears
    Sítá may have been harmed by the fire, reasons that her virtue protects her, and
    hears heavenly voices confirm that she is unharmed.
  language: English
  quote_policy: summarized
