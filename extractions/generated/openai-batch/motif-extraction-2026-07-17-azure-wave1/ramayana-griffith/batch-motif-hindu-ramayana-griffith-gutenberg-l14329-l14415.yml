canonical_text:
  quote: ''
  summary: Sita, distressed by Rama’s refusal, argues that love makes forest hardship
    bearable and that she must accompany him into exile. She invokes her father’s
    command, Brahmanic predictions, remembered warnings about forest life, a scriptural
    statement about marriage in this world and the afterlife, and threatens death
    by fire, water, or poison if Rama leaves her behind. The narrator says she still
    has not persuaded Rama and weeps at his answer.
  language: English
  quote_policy: summarized
