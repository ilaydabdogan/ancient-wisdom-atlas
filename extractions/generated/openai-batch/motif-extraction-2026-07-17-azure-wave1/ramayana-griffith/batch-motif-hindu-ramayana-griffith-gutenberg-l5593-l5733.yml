canonical_text:
  quote: ''
  summary: A divine father reassures the frightened gods that Vásudeva, in Kapil's
    form, guards Earth and has foreseen the burning of Sagar's sons. Sagar's sixty
    thousand sons continue digging through the earth in search of the stolen sacrificial
    horse, encounter and reverence several world-bearing elephants, then find Kapil
    with the horse and are scorched to ashes after rushing at him. King Sagar then
    sends his grandson Anśumán to follow the same underground course, recover the
    horse, honor the beings below, and complete the sacrifice; Anśumán honors a warder
    elephant, who tells him he will bring back the steed.
  language: English
  quote_policy: summarized
