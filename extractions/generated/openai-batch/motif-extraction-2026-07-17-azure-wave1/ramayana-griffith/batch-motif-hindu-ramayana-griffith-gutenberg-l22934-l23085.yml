canonical_text:
  quote: ''
  summary: Bharadvaja counsels Bharat not to blame the woman responsible and says
    blessings will come from Rama’s exile. Bharat respectfully departs with a large
    royal and military company. Near Chitrakuta and the Mandakini, Bharat describes
    the mountain, forest, animals, and hermit landscape, orders a search for Rama
    and Lakshman, and responds to smoke seen in the forest by halting the army and
    proceeding with only Dhrishti and Sumantra.
