canonical_text:
  quote: "“Bright as the sun at early morn / To Yáma’s halls is Báli borne.”"
  summary: After Báli dies from Ráma’s shaft, the Vánars lament their slain lord.
    Tárá mourns over Báli’s body, laments her widowhood and Angad’s loss, describes
    the wound and blood, and recalls warnings he ignored. Níla removes the fatal shaft.
    Tárá instructs Angad to salute his dead father, and frames the battle as a deadly
    rite before declaring that she and Angad will die with Báli.
  language: English
  quote_policy: quoted
