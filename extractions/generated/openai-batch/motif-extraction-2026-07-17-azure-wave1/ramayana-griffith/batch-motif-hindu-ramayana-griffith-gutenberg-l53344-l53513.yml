canonical_text:
  quote: ''
  summary: Rama sees the giant Kumbhakarna near Lanka and asks Vibhishana to identify
    him. Vibhishana recounts Kumbhakarna's immense strength, violent birth, battle
    with Indra, and Brahma's curse of deathlike sleep modified into a six-month sleep
    and one-day waking cycle. Rama orders defensive preparations. Kumbhakarna, newly
    awakened, goes to Ravana, who asks him to save besieged Lanka from Rama and the
    Vanars. Kumbhakarna rebukes Ravana for ignoring counsel and urges him to restore
    Sita; Ravana rejects the reproach and commands him to repair the king's errors.
  language: English
  quote_policy: summarized
