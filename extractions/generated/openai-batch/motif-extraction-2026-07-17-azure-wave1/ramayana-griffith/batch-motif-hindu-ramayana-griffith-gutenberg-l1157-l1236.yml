canonical_text:
  quote: "“In all thy poem, through my grace, / No word of falsehood shall have place.”"
  summary: Brahma visits Valmiki’s hermitage, is received with reverence, and finds
    Valmiki still absorbed in grief over the slain curlew. Brahma identifies Valmiki’s
    spontaneous lament as verse, commands him to compose Rama’s life as told by Narad,
    promises that the poem will be true and enduring, and says Valmiki will rise to
    higher spheres. After Brahma vanishes, Valmiki’s pupils chant the grief-born verse,
    and Valmiki adopts its measure for the Ramayan.
  language: English
  quote_policy: quoted
