canonical_text:
  quote: ''
  summary: During a sacred rite, fiends led by Márícha and Suváhu arrive in dark magical
    gloom and shower blood to disrupt the ceremony. Ráma tells Lakshmaṇ that his weapon
    will drive them off, strikes Márícha senseless and hurls him into the ocean, kills
    Suváhu with a flaming shaft, and overthrows the remaining demons with a dart of
    the Wind-God. The saints honor Ráma, the rite succeeds, and Viśvámitra declares
    the retreat perfected.
  language: English
