canonical_text:
  quote: "“Send out, send out: from coast to coast / Assemble all the Vánar host”"
  summary: King Sugríva orders Hanúmán to summon Vánar legions from many regions.
    Hanúmán sends envoys in all directions, and vast Vánar forces gather for Ráma.
    On their way the envoys find a sacred Himalayan tree and celestial fruit from
    the site of Maheśvar’s rite, bring the fruit to Sugríva at Kishkindhá, report
    the successful summons, and are rewarded.
  language: English
