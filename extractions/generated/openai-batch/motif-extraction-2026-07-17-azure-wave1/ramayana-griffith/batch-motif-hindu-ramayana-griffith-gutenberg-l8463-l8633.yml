canonical_text:
  quote: "“With steady arm the string he drew / Till burst the mighty bow in two.”"
  summary: King Janak has the ancient heavenly bow brought before Viśvámitra, Ráma,
    and Lakshmaṇ. Janak states that gods, spirits, serpents, kings, and other beings
    have failed to lift, draw, or string it. At the hermit’s prompting, Ráma lifts
    and draws the bow, breaking it with a terrifying sound. Janak declares that Sítá
    shall be Ráma’s wife according to his vow, sends envoys to Ayodhyá, and Daśaratha
    agrees to travel to Janak’s city with priests and counsellors.
  language: English
  quote_policy: quoted
