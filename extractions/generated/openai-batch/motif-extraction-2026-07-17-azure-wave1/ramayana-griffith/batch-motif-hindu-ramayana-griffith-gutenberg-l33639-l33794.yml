canonical_text:
  quote: ''
  summary: The Maithil lady is carried through the air by Rávaṇ. She denounces him
    for stealing her when unguarded, recalls the magic deer that lured her husband
    away and the vulture king who died trying to save her, and foretells Rávaṇ’s doom
    at Ráma’s hands. While Rávaṇ carries her toward Lanká, she drops her scarf and
    ornaments among five monkeys as markers of her path. Rávaṇ crosses Pampa and the
    sea, and celestial voices warn that his guilty deed will bring his end.
  language: English
  quote_policy: summarized
