canonical_text:
  quote: "“No lust have I for kingly sway, / My mother I no more obey”"
  summary: Bharata rejects any desire for kingship, denies knowledge of Rama's planned
    consecration and exile, is reproached by Kausalya, and clears himself through
    strong oath-curses against whoever consented to Rama's banishment. Kausalya accepts
    his fidelity and affirms his virtue.
  language: English
  quote_policy: quoted
