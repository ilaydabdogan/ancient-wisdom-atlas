canonical_text:
  quote: "“Embodied let the king ascend / To life in heaven that ne’er shall end.”"
  summary: 'Triśanku falls from the sky and calls to Viśvámitra, who halts him by
    ascetic power, creates new stars in the southern sky, and threatens to create
    a new Indra and new gods. The gods object that Triśanku is cursed and unpurified,
    but Viśvámitra insists on his vow to send the king bodily to heaven. The gods
    consent to a compromise: Viśvámitra’s stars remain, and Triśanku shines among
    them head downward.'
  language: English
  quote_policy: quoted
