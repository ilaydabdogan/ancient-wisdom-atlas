canonical_text:
  quote: ''
  summary: Rāma proposes ascending Suvela with Sugrīva, Lakshmaṇ, and Vibhīshaṇ to
    view the city of the foe who stole his beloved. The group climbs, sees Lankā and
    its defenses, then at dawn surveys its gardens, Trikūṭa peak, golden walls, and
    Rāvaṇ's palace. Rāma and Sugrīva see Rāvaṇ standing royally on a tower; Sugrīva
    leaps to him, challenges him as Rāma's ally, snatches his crown, wrestles with
    him, and escapes when Rāvaṇ begins to use magic.
  language: English
  quote_policy: summarized
