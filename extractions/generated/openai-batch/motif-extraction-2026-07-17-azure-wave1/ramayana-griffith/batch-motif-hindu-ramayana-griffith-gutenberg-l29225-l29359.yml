canonical_text:
  quote: ''
  summary: As Khara’s giant army marches, numerous ominous signs appear in sky, earth,
    weather, animals, waters, plants, and celestial bodies. Khara recognizes the omens
    but dismisses them in a boastful speech, vowing to kill Rama and Lakshmana and
    let his sister drink their blood. His host rejoices, described as caught in Fate’s
    noose. Divine and semi-divine beings gather in the sky, hoping Rama will slay
    the night-roaming giants. Khara and his chiefs advance toward the dwelling of
    the two princes.
  language: English
  quote_policy: summarized
