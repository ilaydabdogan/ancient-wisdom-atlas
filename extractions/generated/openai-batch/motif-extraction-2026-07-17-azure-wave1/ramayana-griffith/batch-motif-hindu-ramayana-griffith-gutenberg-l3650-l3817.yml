canonical_text:
  quote: ''
  summary: A great sage is received by the king with formal hospitality. After the
    king welcomes him and promises to grant his wish, the sage explains that two shape-changing
    fiends repeatedly interrupt his holy rite by defiling the altar. He asks the king
    to give him Ráma, the king’s eldest son, so that Ráma may slay the demons during
    the ten-night sacrifice. The king is overwhelmed and faints.
  language: English
  quote_policy: summarized
