canonical_text:
  quote: ''
  summary: Ráma laments Sítá’s disappearance, fears she has been stolen, slain, or
    devoured by hostile beings, and speaks of shame, separation, and despair. He asks
    Lakshmaṇ to return to Ayodhyá and later to renew the search, recalls places Sítá
    loved near the Godávarí, invokes the all-seeing Lord of Day and the Wind as witnesses,
    and is counseled by Lakshmaṇ to master grief and search again.
  language: English
  quote_policy: summarized
