canonical_text:
  quote: "“I cannot longer brook my pain, / Or, Sítá lost, my life retain.”"
  summary: After Śavarí ascends to the skies, Ráma and Lakshmaṇ reflect on the saints’
    hermitage, the seven lakes, and ritual libations. They leave the grove and travel
    toward Pampá and Mount Rishyamúka, where Sugríva dwells. The luxuriant waters,
    woods, birds, flowers, and mountain intensify Ráma’s grief over the lost Sítá,
    and he urges Lakshmaṇ to seek Sugríva as an ally.
  language: English
