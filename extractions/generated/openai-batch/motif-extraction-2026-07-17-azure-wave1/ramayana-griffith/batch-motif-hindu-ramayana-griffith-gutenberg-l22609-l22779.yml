canonical_text:
  quote: ''
  summary: Bharadvāja invokes deities, who manifest with celestial breezes, flowers,
    drums, music, and dancers. A divinely fashioned landscape with groves, streams,
    mansions, and a palace appears for Bharat’s company. Bharat enters, honors Rāma
    at the throne, and sits as a councillor. Rivers flow milk and curds; celestial
    nymphs and Gandharvas perform; trees and garlands respond to the saint’s command.
    Bharat’s army feasts, drinks, bathes, is attended by women, and receives all desired
    things until the warriors declare the place to be heaven and wish to remain.
  language: English
  quote_policy: summarized
