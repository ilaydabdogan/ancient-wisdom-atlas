canonical_text:
  quote: ''
  summary: Rama calmly addresses the angry Lakshman. He tells him to restrain anger,
    remain in duty, redirect preparations for Rama's consecration toward Bharat's
    enthronement, and prevent anxiety for an unnamed woman concerned for Rama. Rama
    says his father is true to his promise and that Rama will resign the consecration,
    leave the city for the forest, wear hermit attire, and repurpose the consecration
    water for a hermit's vow. He repeatedly attributes Kaikeyi's conduct, the loss
    of royal power, and all changes of fortune to Fate, and tells Lakshman not to
    blame either the youngest queen or their father.
  language: English
  quote_policy: summarized
