canonical_text:
  quote: ''
  summary: Rāma shows Sītā the Mandākinī stream and the Chitrakūṭa landscape, describing
    birds, animals, trees, hermits, saints, bathing waters, and his contentment in
    forest life with Sītā and Lakshmaṇ. He then finds a cave and shaded stone where
    Sītā rests, and continues describing the forest sounds and plants through affectionate
    similes.
