  summary: Rama answers the dying Bali’s reproaches by arguing that Bali violated
    duty by taking his brother’s wife Ruma, that Bharat’s royal authority requires
    punishment of sinners, that Rama is bound by a sworn promise to restore Sugriva’s
    wife and kingdom, and that ancient law and royal precedent justify chastisement
    even by a concealed arrow.
