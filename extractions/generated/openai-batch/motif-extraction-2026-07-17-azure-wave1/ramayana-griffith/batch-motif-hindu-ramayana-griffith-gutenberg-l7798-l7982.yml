canonical_text:
  quote: ''
  summary: Viśvámitra settles for austerities at Pushkar. King Ambarísha’s sacrificial
    horse is taken by Indra, and a Brahman says the rite needs either the horse or
    a human victim. Ambarísha seeks to buy a victim and obtains Śunahśepha, the middle
    son of Richíka. While being conveyed to the rite, Śunahśepha appeals to his uncle
    Viśvámitra for rescue. Viśvámitra asks his own sons to die in the boy’s place;
    they refuse and are cursed. Viśvámitra then teaches Śunahśepha hymns to recite
    when bound at Vishṇu’s post, promising preservation and freedom.
  language: English
  quote_policy: summarized
