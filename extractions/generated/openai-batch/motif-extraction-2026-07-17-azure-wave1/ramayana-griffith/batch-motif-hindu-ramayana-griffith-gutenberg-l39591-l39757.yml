canonical_text:
  quote: ''
  summary: A wounded speaker rebukes Ráma for striking him secretly while he fought
    Sugríva. He contrasts Ráma’s royal and ascetic appearance with the deed, argues
    about kingly duty, lists sins that lead to hell, says Tárá’s counsel was ignored,
    and claims he could have rescued the Maithil lady and bound Rávaṇ. He ends by
    accepting Sugríva’s future rule while calling the manner of his own killing unjust
    and invoking Fate.
