canonical_text:
  quote: ''
  summary: 'Daśaratha, grieving after Rāma has been sent to the woods, tells Queen
    Kauśalyā that people receive the fruit of their deeds. He recalls a youthful hunting
    crime: proud of shooting by sound, he mistook the noise of a pitcher filling at
    the Sarjú for an elephant and shot a hermit youth who had come for water for his
    aged blind parents. The dying youth laments that the same arrow will destroy his
    parents as well, and tells the king to go to his father, report the death, seek
    pardon, and remove the dart.'
  language: English
  quote_policy: summarized
