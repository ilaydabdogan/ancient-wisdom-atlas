canonical_text:
  quote: ''
  summary: Brahma describes Sita as carried to sea-girt Lanka, guarded by demons,
    and in danger of despair. He sends Indra with Sleep to sustain her with heavenly
    food. Sleep closes the demons' eyes, Indra enters the Ashoka garden, identifies
    himself, and offers ambrosial food. Sita tests his divinity by asking for signs,
    recognizes him, receives the food, thinks of Rama and Lakshman, eats, and is strengthened.
    The passage then turns to Rama returning after killing Maricha in the form of
    a deer; he hears ominous animal cries, recalls Maricha's mimicked call, fears
    for Sita, sees further omens, meets Lakshman, and reproaches him for leaving Sita.
  language: English
  quote_policy: summarized
