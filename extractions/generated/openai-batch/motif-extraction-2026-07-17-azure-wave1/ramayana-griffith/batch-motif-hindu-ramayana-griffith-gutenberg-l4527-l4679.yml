canonical_text:
  quote: ''
  summary: A saint, pleased with Rāma, grants him a large set of celestial weapons
    and the spells governing them. The weapons appear in embodied form and declare
    themselves Rāma’s servants. Rāma then asks for powers that can restrain the weapons;
    the sage names and grants these charms, which also appear and pledge obedience
    before Rāma dismisses them to come when called.
  language: English
  quote_policy: summarized
