canonical_text:
  quote: "“This day my son enthroned shall see, / And Ráma to the woods shall flee.”"
  summary: Kaikeyí, angered at Ráma’s impending elevation, asks Manthará for a plan
    to make Bharat king and send Ráma away. Manthará recalls Daśaratha’s old promise
    of two boons after Kaikeyí saved him in battle, then instructs her to use those
    boons to demand Bharat’s consecration and Ráma’s forest exile. Kaikeyí praises
    and promises rewards to Manthará, who urges immediate action.
  language: English
  quote_policy: quoted
