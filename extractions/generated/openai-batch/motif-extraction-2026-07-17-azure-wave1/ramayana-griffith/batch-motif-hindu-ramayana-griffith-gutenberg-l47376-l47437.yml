  summary: King Rávaṇ summons five leading captains and orders them to seize the dangerous
    Vánar, whom he suspects may be an extraordinary creature sent by Indra. The captains
    attack with chariots and weapons. The Vánar kills Durdhar by crushing his chariot,
    kills Yúpáksha and Virúpáksha with an uprooted tree, and kills Bhásakama and Praghas
    by hurling a mountain peak on them.
