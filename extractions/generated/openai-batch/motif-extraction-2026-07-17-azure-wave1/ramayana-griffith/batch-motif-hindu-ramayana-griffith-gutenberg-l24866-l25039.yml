canonical_text:
  quote: |-
    “Upheld by truth the monarch reigns,
    And truth the very world sustains.”
  summary: Rāma answers Jáváli by rejecting counsel that would make him abandon duty.
    He praises truth as the basis of kingship, cosmic order, religious rites, and
    heavenly reward; reaffirms his oath to obey his father and remain in the forest;
    rebukes heterodox or impious doctrine; and hears Jáváli disavow the atheist argument
    as an expedient plea.
