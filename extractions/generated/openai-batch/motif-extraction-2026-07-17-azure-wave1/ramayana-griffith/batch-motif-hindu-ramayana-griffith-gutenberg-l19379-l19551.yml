canonical_text:
  quote: ''
  summary: A bereaved aged saint laments his slain son, describes the son's filial
    and ritual duties, invokes Yama and heavenly realms, and performs funeral rites
    with his wife. The son's spirit announces a heavenly reward and ascends with Indra.
    The father curses the king who killed the boy by arrow, saying the king will also
    die grieving a son. The parents enter the pyre and pass to heaven. The king later
    recalls the curse as he grieves for Rāma, loses his senses, and feels death approaching.
  language: English
  quote_policy: summarized
