canonical_text:
  quote: ''
  summary: Rishyaśring recounts alluring visitors to his father Vibháṇdak, who warns
    him against them. After Vibháṇdak leaves for the forest, Rishyaśring returns to
    the visitors, follows the damsels, and rain falls. Vibháṇdak searches for him,
    later learns that King Lomapád has bestowed villages and wealth on Rishyaśring,
    and accepts the turn of events. A ship bears Rishyaśring to the royal town amid
    darkening clouds and heavy rain. The king honors and serves him, seeks his grace,
    and gives him his daughter Śántá as bride.
  language: English
  quote_policy: summarized
