canonical_text:
  quote: ''
  summary: King Sugriva commands a powerful Vanar leader to take ten thousand Vanars
    eastward in search of Sita and Ravana. The route passes through rivers, woods,
    mountains, caves, islands, oceans, the dwelling of Garuda, terrifying Mandeha
    giants, the Milky Sea, a flaming horse-head in the ocean, Ananta on a golden mountain,
    and the eastern mountain where the sun rises. The journey is to stop at the limit
    beyond which there is no sun or moon, and the party must return within a month.
  language: English
  quote_policy: summarized
