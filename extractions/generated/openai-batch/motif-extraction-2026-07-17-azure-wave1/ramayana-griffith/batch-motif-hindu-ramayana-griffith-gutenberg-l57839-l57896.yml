canonical_text:
  quote: ''
  summary: The passage summarizes Sita's reception at Valmiki's hermitage, the birth
    and training of Kusa and Lava, their recitation before Rama at the Asvamedha,
    Sita's final appeal to the Earth goddess and descent into the earth, an editorial
    comparison of sorrowful epic endings, and the beginning of the account of Rama's
    terrestrial departure through a message from Time on behalf of Brahma.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sita is received by Valmiki, and holy women of the hermitage are charged to
    entertain and serve her.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the hermitage Sita gives birth to two boys named Kusa and Lava, who are
    brought up and taught by Valmiki to recite the Ramayana.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rama determines to celebrate the Asvamedha, Valmiki attends with the two young
    pupils, and the unknown princes recite the poem before Rama, who recognizes them
    as his sons.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sita is invited to return and affirm her innocence before a great assembly,
    but instead speaks an oath invoking Madhavi, the goddess of Earth, to grant her
    a hiding-place if she has never thought of anyone but Rama.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: After Sita's oath, the earth cleaves, a divine throne rises borne by resplendent
    dragons, the Earth goddess welcomes Sita and seats her beside herself, and the
    throne descends to Hades while flowers fall from heaven.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage states that both great Hindu epics end in disappointment and sorrow,
    citing the Mahabharata brothers' abandonment of the throne and Rama's loss of
    Sita after regaining her.
  category: other
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage compares this sorrowful ending pattern with the later Homeric
    cycle, where Iliad heroes perish and Ulysses eventually sails away again and is
    killed by his son.
  category: other
  evidence_refs:
  - ev:6
- id: obs:8
  text: Time, in the form of an ascetic, comes to Rama's palace gate as messenger
    of Brahma and requires a private interview whose witness must lose his life; Rama
    assigns Lakshman to stand outside.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Time's message says that Rama, identified with Vishnu, formed Brahma from
    a lotus springing from his navel after destroying the worlds and sleeping on the
    ocean, later assumed the function of Preserver, was born as Aditi's son, and came
    to destroy Ravana.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Time says Rama's appointed period on earth is expiring and that Rama may either
    prolong his stay on earth or ascend to heaven and rule over the gods.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Rama replies that he was born for the good of the three worlds and will return
