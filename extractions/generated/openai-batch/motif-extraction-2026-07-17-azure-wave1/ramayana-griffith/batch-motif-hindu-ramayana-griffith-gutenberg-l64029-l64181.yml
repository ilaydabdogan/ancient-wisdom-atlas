canonical_text:
  quote: ''
  summary: 'A series of explanatory notes identifies mythological beings, deities,
    places, omens, and botanical references: horse-headed supernatural beings; Vibhishana,
    Ravana, and Brahma in connection with austerities and boons; serpent-gods; the
    mountain used in the Churning of the Ocean; Rudras and Maruts; afterlife return
    as falling stars; a rock-covered cavern and Pampa lake/brook; Bharata as ascetic
    regent; and Rama’s interpretation of a crow omen concerning separation from and
    restoration of Sita.'
