canonical_text:
  quote: ''
  summary: Khara sees his wounded sister Śūrpaṇakhā and demands to know who mutilated
    her. She identifies Rāma and Lakshmaṇ, Daśaratha’s sons, describes Sītā with them,
    and urges vengeance. Khara sends twice seven giants with Śūrpaṇakhā to kill the
    two men and the woman. The giants reach Rāma’s dwelling; Rāma asks Lakshmaṇ to
    guard Sītā, addresses the giant band, and warns them to leave. The giants answer
    with threats on Khara’s behalf.
