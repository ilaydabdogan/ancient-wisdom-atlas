canonical_text:
  quote: ''
  summary: At night Hanuman and Vibhishan search the battlefield and find Jambavan
    wounded. Jambavan identifies Hanuman as the army’s hope and sends him to the Himalayan
    region for four radiant medicinal herbs. Hanuman flies there, cannot seize the
    hidden herbs, tears off the mountain peak, returns with it, and the scent restores
    the wounded and slain allies.
