  quote: ''
  summary: Kaikeyí presses the king to keep his promise, invokes examples of truth-keeping
    and bodily sacrifice, rejects Ráma’s anointing, threatens to drink poison if Ráma
    is installed, and declares that only Ráma’s banishment will satisfy her. The king,
    bewildered and grief-stricken, falls prone and laments Ráma before addressing
    the queen.
