canonical_text:
  quote: ''
  summary: Báli hears Sugríva’s challenge while with Tárá, becomes enraged, and prepares
    to fight. Tárá embraces him and urges restraint, warning that Sugríva’s return
    after defeat implies powerful support from Ráma and Lakshmaṇ. She advises peace,
    shared rule, and alliance. Báli rejects her counsel, argues that dishonour must
    be answered, says Ráma will not act sinfully, and goes to humble Sugríva. Tárá
    blesses him and withdraws in fear and grief.
  language: English
  quote_policy: summarized
