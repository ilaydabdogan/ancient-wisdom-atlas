canonical_text:
  quote: ''
  summary: Virádha seizes Sítá, terrifies her, and challenges Ráma and Lakshmaṇ. Ráma
    laments the touch of another upon his wife, while Lakshmaṇ vows to kill the fiend.
    Virádha identifies himself as a giant protected by a boon from Brahmá that weapons
    cannot pierce him, and he demands that the brothers leave Sítá with him. Ráma
    and Lakshmaṇ attack with arrows, swords, and by breaking Virádha’s spear, but
    Virádha remains unharmed, releases Sítá, seizes the two brothers, and carries
    them through the forest. Sítá cries out and asks the giant to take her instead
    and leave the sons of Raghu free.
  language: English
