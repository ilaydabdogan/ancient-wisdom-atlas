canonical_text:
  quote: ''
  summary: A sequence of editorial notes discusses Uttara Kuru/Ottorakorra as a northern
    land and ideal paradise; the Vánars as monkey-formed or silvan combatants; Rávaṇ's
    exploits against Serpent-Gods; Brāhmanical sacred fires and funeral rites; Brahmá's
    curse connected with Punjikasthalí; Sítá's lament over unperformed funeral honours
    for Ráma; royal signs read by chiromancy; Gandharvas as dancers, musicians, or
    warriors; Anaraṇya's defeat and prophecy against Rávaṇ; and a magic image of Sítá
    compared with classical Greek and Roman image-doubles.
  language: English
  quote_policy: summarized
