  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is mediated through Lassen's scholarly note and does not
    establish historical contact or identity beyond the reported comparison.
- id: claim:2
  claim: The royal hand-mark anecdote in Josephus serves a similar legitimating function
    to bodily signs of future queenship in the note.
  claim_level: same_function
  target: Josephus anecdote of Caesar detecting a royal impostor by chiromancy
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supplies only a brief analogy; it does not show a shared
    tradition.
- id: claim:3
