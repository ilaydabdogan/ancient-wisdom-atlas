canonical_text:
  quote: ''
  summary: Lakshmaṇ confronts and kills the giant Atikáya after the Wind-God advises
    use of a weapon named for Brahmá. Rávaṇ hears of Atikáya's death, laments fallen
    chiefs, and orders Lanka's walls, gates, lanes, and the Aśoka garden guarded.
    Indrajít consoles Rávaṇ, vows to kill the sons of Raghu, rides out, and performs
    a fire rite with offerings, a goat, auspicious flame signs, and spell-charmed
    weapons.
  language: English
  quote_policy: summarized
