canonical_text:
  quote: ''
  summary: Valmiki asks Narad to identify a man possessing the highest virtues. Narad
    names Rama of the Ikshvaku line and describes his virtues, bodily marks, learning,
    martial power, and royal qualities. The passage then summarizes Rama's planned
    consecration, Kaikeyi's demand that Rama be exiled and her child made heir, Rama's
    obedient departure with Lakshman and Sita, the crossing near the Ganga and settlement
    at Chitrakuta, Dasaratha's death, Bharata's refusal to reign, Rama's adherence
    to his father's decree, and Bharata's rule with Rama's sandals as a pledge while
    awaiting Rama's return.
  language: English
  quote_policy: summarized
