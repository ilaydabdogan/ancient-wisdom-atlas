canonical_text:
  quote: ''
  summary: Rávaṇ and Lakshmaṇ fight with arrows; Rávaṇ uses a Brahma-bestowed fiery
    weapon and later tries but fails to lift Lakshmaṇ. Hanumán strikes Rávaṇ senseless,
    carries the wounded Lakshmaṇ to Ráma, and then bears Ráma into battle. Ráma destroys
    Rávaṇ’s chariot, wounds and disarms him, cuts off his coronet, but spares him
    for the night and tells him to return the next day.
  language: English
  quote_policy: summarized
