canonical_text:
  quote: ''
  summary: Anśumān reaches the place where Sagar’s sons lie as ashes and finds the
    sacrificial horse. Garuḍ tells him that only the heavenly river Gangā, brought
    down from the sky, can purify the ashes and secure heaven for the dead. Sagar,
    Anśumān, and Dilīpa fail to bring the river down. Bhagīrath undertakes severe
    austerities, wins Brahmā’s favor, and asks that Gangā wash the ashes of Sagar’s
    sons and that he receive a son. Brahmā grants the request but says Bhagīrath must
    win Śiva’s aid, because only Śiva can bear Gangā’s descent.
  language: English
  quote_policy: summarized
