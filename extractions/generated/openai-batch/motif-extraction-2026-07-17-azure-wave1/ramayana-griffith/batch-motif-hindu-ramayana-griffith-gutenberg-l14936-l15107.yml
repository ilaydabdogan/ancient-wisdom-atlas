canonical_text:
  quote: "“From duty’s path he will not swerve, / But, still his father’s truth preserve.”"
  summary: Rāma, Sītā, and Lakṣmaṇ proceed toward the aged king after distributing
    wealth. The city crowd mourns Rāma’s departure, praises his obedience and virtues,
    laments Sītā’s exposure, and vows to abandon the city and follow him into the
    wood. Rāma remains firm, reaches the palace, and sends Sumantra to announce him.
    Sumantra finds the grieving king, reports Rāma’s arrival and planned departure
    to the wilds, and the king summons his women before ordering Rāma brought in.
  language: English
  quote_policy: quoted
