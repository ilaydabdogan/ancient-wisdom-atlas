canonical_text:
  quote: ''
  summary: Kumbhakarna fights the Vánar and human allies, captures Sugríva, and carries
    him into Lanká amid Rákshas celebration. Sugríva recovers and escapes. Lakshmana
    wounds Kumbhakarna and directs him toward Ráma. Ráma confronts Kumbhakarna, shatters
    his thrown rock, and uses divine-named missiles and arrows to sever his arms,
    legs, head, and throat; the giant's falling body damages the city and disturbs
    the sea.
  language: English
  quote_policy: summarized
