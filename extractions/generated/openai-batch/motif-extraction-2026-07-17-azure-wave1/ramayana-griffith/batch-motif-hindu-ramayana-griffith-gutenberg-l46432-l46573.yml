canonical_text:
  quote: ''
  summary: Trijaṭá rebukes the demons threatening Sítá and recounts a dream in which
    Ráma triumphs, Sítá is reunited with him, Rávaṇ and his kin move south in disgrace,
    and Lanká is overwhelmed by the sea. She urges the demons to comfort Sítá and
    seek forgiveness. A bracketed editorial note explains omitted cantos. Hanumán,
    concealed nearby, reflects that he has found Sítá after the search, must console
    her before leaving, must avoid alarming her, and decides to speak Ráma's name
    in ordinary speech.
  language: English
  quote_policy: summarized
