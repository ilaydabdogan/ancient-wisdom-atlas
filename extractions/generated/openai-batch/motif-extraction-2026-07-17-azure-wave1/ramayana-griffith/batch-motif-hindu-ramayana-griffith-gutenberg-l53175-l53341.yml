canonical_text:
  quote: ''
  summary: Ravana, shaken by Rama, recalls prophecies and curses foretelling his destruction
    by a human. He orders Lanka guarded and commands that Kumbhakarna be awakened.
    Rakshasas go to Kumbhakarna’s immense cave-like dwelling with food, drink, noise,
    blows, animals, and water to rouse him. When awakened, hungry and terrible, Kumbhakarna
    learns that Rama and the Vanaras threaten Lanka because Ravana stole Rama’s queen.
    Kumbhakarna vows to destroy the enemy and goes to Ravana.
  language: English
