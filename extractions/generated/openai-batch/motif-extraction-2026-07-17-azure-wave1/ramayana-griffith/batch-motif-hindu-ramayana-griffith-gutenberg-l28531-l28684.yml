canonical_text:
  quote: ''
  summary: Rama speaks tenderly of Bharata and Shatrughna, then Rama, Lakshmana, and
    Sita bathe in the Godavari and offer libations. Back at the leafy hermitage, the
    giantess Surpanakha sees Rama, desires him, questions his presence, and identifies
    herself as a shapeshifting rakshasa and sister of Ravana. She urges Rama to abandon
    Sita, threatens to eat Sita and Lakshmana, and invites Rama to roam the forest
    with her.
