canonical_text:
  quote: ''
  summary: Rama greets the altered Bharata and asks why he has come into the wilderness.
    Bharata reports Dasharatha's death, blames Kaikeyi, and begs Rama to accept the
    kingdom. Rama refuses to violate his father's command, teaches obedience to parents
    and king, and says Bharata must rule while he remains in forest exile for fourteen
    years. Bharata replies that family custom forbids the younger son to rule while
    the elder lives, asks Rama to return to Ayodhya, and requests that he perform
    water rites for their deceased father.
  language: English
  quote_policy: summarized
