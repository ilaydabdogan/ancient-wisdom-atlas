canonical_text:
  quote: ''
  summary: Vibhishaṇ, brother of Rávaṇ, appears above the ocean shore with four companions
    and asks Sugríva to tell Ráma that he seeks refuge after failing to persuade Rávaṇ
    to restore Janak’s abducted child. Sugríva warns Ráma that the newcomer may be
    a hostile spy. Ráma asks the Vánar chiefs for counsel. Angad, Śarabha, Jámbaván,
    and Mainda advise caution or testing; Hanúmán argues that Vibhishaṇ has truly
    fled his brother’s wrongdoing. Ráma declares that he will not abandon a suppliant,
    while Sugríva questions whether one who deserts his brother can be trusted.
  language: English
  quote_policy: summarized
