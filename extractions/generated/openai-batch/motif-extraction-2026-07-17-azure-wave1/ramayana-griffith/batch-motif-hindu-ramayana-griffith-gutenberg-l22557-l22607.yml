canonical_text:
  quote: ''
  summary: A hermit asks Bharat to bring his whole host. The hermit goes to the chapel,
    purifies himself with water before the sacred fire, and prays for divine aid in
    providing a great feast. He invokes Viśvakarmá, Indra and world-guarding deities,
    streams from earth and sky, gods, celestial musicians, Apsarases, Kuvera's garden,
    and Soma to supply drink, food, flowers, music, and attendants for the multitude.
  language: English
  quote_policy: summarized
