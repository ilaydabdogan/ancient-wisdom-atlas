canonical_text:
  quote: ''
  summary: 'Rāma travels through the skies with Sītā and points out remembered places
    below: Lankā and the battlefield, the sea and bridge, Kishkindhā and earlier allies
    or foes, Janasthān and the site of Sītā’s abduction, sacred rivers and hermitages,
    and finally Ayodhyā, their long-lost home.'
  language: English
