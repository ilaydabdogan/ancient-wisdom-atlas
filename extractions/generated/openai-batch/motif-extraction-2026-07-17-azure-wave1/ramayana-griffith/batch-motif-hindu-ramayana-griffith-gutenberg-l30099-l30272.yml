canonical_text:
  quote: ''
  summary: Rāma confronts Khara, condemns his violence against hermit saints and mankind,
    and declares that sinners must receive punishment. Khara replies angrily, denies
    Rāma's heroic stature, raises his mace, and vows to avenge his slain giants before
    sunset. Khara hurls a fiery gold-ringed mace; Rāma splits it with arrows, rendering
    it harmless. Rāma then mocks Khara's failed weapon, predicts Khara's death, and
    says Daṇḍak forest will again be safe for devotees and hermits.
  language: English
  quote_policy: summarized
