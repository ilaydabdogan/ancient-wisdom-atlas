  summary: The passage includes a brief narrative of Ráma reciting a hymn to the sun,
    purifying himself with water, and preparing to face Rávaṇa. It then gives notes
    on Rávaṇa’s funeral rites, including a Vedic-style pyre, offerings, victim sacrifice,
    perfumes, garlands, grains, seeds, grass, water, and fire. A further note translates
    Brahmá’s address to Ráma, in which Brahmá and the gods identify Ráma with Náráyaṇa,
    Vishṇu, Purusha, sacrifice, cosmic body, and supporter of the worlds.
  language: English
  quote_policy: summarized
