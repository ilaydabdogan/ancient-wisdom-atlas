canonical_text:
  quote: ''
  summary: Sítá, believing Ráma and Lakshmaṇ slain, laments that prophecies, auspicious
    bodily signs, and royal blessings have proved false. Trijaṭá consoles her by reading
    hope in the Vánar army and in the beauty remaining on the wounded heroes. Sítá
    is returned to Lanká and despairs again. Ráma awakens from a trance, sees Lakshmaṇ
    senseless and bloodied, laments him, contemplates death, worries about his promises
    and kin, and dismisses his Vánar allies.
  language: English
  quote_policy: summarized
