  quote: ''
  summary: The passage narrates Lakshmaṇ’s interruption of Ráma’s interview with Time
    to report Durvásas’s message, Ráma’s compelled abandonment of Lakshmaṇ, Lakshmaṇ’s
    bodily conveyance to heaven, and Ráma’s ceremonial great departure to the Sarayú
    with brothers, subjects, sacred attendants, and divine reception. Ráma enters
    the glory of Vishṇu and secures a celestial abode for his followers.
  language: English
