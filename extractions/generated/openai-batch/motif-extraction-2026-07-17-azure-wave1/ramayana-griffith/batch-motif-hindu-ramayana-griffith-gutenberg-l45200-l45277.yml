canonical_text:
  quote: ''
  summary: After the guardian goddess has been subdued, Hanumán, the Vánar chief,
    enters the imperial city street. He observes high ornamented houses, flowers,
    music, women’s songs, Rákshas praise of their king, prayer, priests, envoys, ascetic-looking
    crowds, warriors, fiends, and guarded legions at Rávaṇ’s gate. Rávaṇ’s palace
    is described as rising on a mountain crest, protected by ramparts and lotus-covered
    moats, while Hanumán passes the guarded boundary unhindered. A bracketed note
    then says the translator omits Canto V as likely interpolated, while giving a
    moonlit evening sample involving the sea, stars, Mandar’s hill, and the Vánar
    chief looking upward.
  language: English
  quote_policy: summarized
