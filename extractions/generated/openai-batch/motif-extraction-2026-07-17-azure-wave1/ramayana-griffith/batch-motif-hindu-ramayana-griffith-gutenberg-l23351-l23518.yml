canonical_text:
  quote: ''
  summary: 'Ráma and Sítá enjoy an affectionate forest interlude: he adorns her with
    mineral dye and blossoms, comforts her when she fears a monkey, and roams with
    her among Aśoka trees. They return to Lakshmaṇ, who has prepared deer and other
    game. Sítá distributes food and serves the brothers. A crow harasses Sítá; Ráma
    launches a mystically charmed arrow that pursues the crow through the worlds.
    The crow returns as a suppliant, and Ráma spares its life on condition that it
    forfeit one eye.'
  language: English
  quote_policy: summarized
