canonical_text:
  quote: "“This sacred water clear and pure... To thee, O lord of kings, I give.”"
  summary: Rāma hears from Bharata that his father, the king, has died. He faints,
    laments, speaks of his father in other worlds, tells Sītā and Lakshmaṇ, and prepares
    offerings. With Sumantra and his brothers he goes to the holy river, gives water
    while facing south, and then offers a cake of jujube and Ingudī seed on sacred
    grass to his father’s shade.
  language: English
  quote_policy: quoted
