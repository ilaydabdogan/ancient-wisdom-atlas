canonical_text:
  quote: "“Thus in the magic deer’s disguise / Márícha lured him...”"
  summary: Ráma pursues a magic deer that is Márícha in disguise. Ráma kills him with
    a divine arrow; dying, Márícha resumes his giant form and imitates Ráma’s voice
    to call Sítá and Lakshmaṇ. Ráma fears the deception has reached them. Sítá hears
    the cry, urges Lakshmaṇ to go to Ráma, and reproaches him when he remains.
