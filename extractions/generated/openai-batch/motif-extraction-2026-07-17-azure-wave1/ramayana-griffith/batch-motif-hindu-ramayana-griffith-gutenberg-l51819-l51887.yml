canonical_text:
  quote: ''
  summary: Ravana sees the Vanar army surrounding Lanka and Rama at its head. Rama
    looks toward Lanka, thinks of Sita suffering there, and orders a charge. The Vanars
    fill the moat with stones, trees, rocks, and mountains, scale the ramparts, and
    damage gates and battlements. Ravana orders his giants to sally from the gates.
    The opposing forces clash amid battle noise, and the fight is compared to gods
    battling rebel fiends.
  language: English
  quote_policy: summarized
