canonical_text:
  quote: ''
  summary: The son of Raghu dwells at Chitrakuta and, speaking to his Videhan spouse,
    describes the mountain’s colors, wildlife, trees, heavenly beings, waters, caves,
    luminous night landscape, lovers’ traces, and beauty. He says forest dwelling
    eases his sorrow, fulfills obligations connected with his father and Bharat, accords
    with ancestral teaching, and will allow him to keep his oath with Lakshman nearby.
  language: English
  quote_policy: summarized
