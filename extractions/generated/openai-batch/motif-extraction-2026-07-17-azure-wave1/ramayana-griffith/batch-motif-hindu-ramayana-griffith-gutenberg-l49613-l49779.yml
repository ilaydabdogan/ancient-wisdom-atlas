candidate_motifs:
- id: motif:1
  label: Protection of the suppliant enemy
  taxonomy_refs: []
  basis: Rama explicitly argues that those who ask for shelter must be welcomed whether
    friends or foes, and he applies this vow to Vibhishan even though Vibhishan is
    Ravana's brother.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: No external taxonomy match is exact; this is extracted from the passage's
    stated ethic of refuge.
- id: motif:2
  label: Hospitality through self-sacrifice
  taxonomy_refs:
  - sacrifice
  basis: Rama invokes the dove who welcomed the killer of its mate and gave the fowler
    a meal of its own flesh.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The dove episode is cited within Rama's speech as an exemplum, not narrated
    as the main action of the passage.
- id: motif:3
  label: Defecting enemy kinsman becomes ally and guide
  taxonomy_refs: []
  basis: Vibhishan, Ravana's brother, flees Lanka, seeks refuge with Rama, reports
    enemy strengths, and promises to guide the army in overthrowing the tyrant.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:10
  confidence: high
  cautions: The passage identifies a sibling relationship and defection, but does
    not frame it with a specific named taxonomy family.
- id: motif:4
  label: Replacement ruler consecrated before conquest
  taxonomy_refs:
  - royal_legitimacy
  basis: Rama promises that Vibhishan will reign in Ravana's stead and then orders
    sea-water for Vibhishan's consecration as king and lord of Lanka.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The enthronement is anticipatory; the actual conquest of Lanka is not
    completed within this passage.
- id: motif:5
  label: Personified sea as obstacle to be supplicated
  taxonomy_refs: []
  basis: The army needs passage over the tide, and Vibhishan advises Rama to entreat
    the mighty Sea for aid.
  evidence_refs:
