  - ev:13
  - ev:14
  confidence: high
  cautions: The Sea's response is not included in the supplied passage.
- id: motif:6
  label: Oath of punitive overthrow
  taxonomy_refs:
  - divine_judgment
  basis: Rama vows that Ravana and his kin will die and says they must pay in death
    the price of sin.
  evidence_refs:
