canonical_text:
  quote: ''
  summary: Rama argues that a suppliant must be protected even if he is an enemy,
    citing an old dove exemplum and Kandu's teaching. Vibhishan descends with attendants,
    identifies himself as Ravana's brother, and seeks refuge. Rama questions him about
    Lanka's forces, vows to kill Ravana, accepts Vibhishan as ally, and has him consecrated
    with sea-water as king of Lanka. Hanuman asks how the army will cross the sea;
    Vibhishan advises Rama to supplicate the Sea, after which Rama lies on sacred
    grass on the ocean shore.
  language: English
  quote_policy: summarized
