  summary: Bharat visits the tree and grass bed where Ráma and Sítá slept, laments
    Ráma’s exile and Ayodhyá’s condition, praises Lakshmaṇ and Sítá, vows to live
    in forest austerity in Ráma’s place if needed, and later at Gangá’s bank asks
    Guha to prepare boats so the army can cross.
