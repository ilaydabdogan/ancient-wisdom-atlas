  summary: Rama, Sita, and Lakshmana depart Ayodhya in Sumantra's chariot for Rama's
    banishment. Citizens, royal women, and Rama's parents grieve and try to follow
    or delay the chariot. Rama, constrained by duty, orders Sumantra to drive on despite
    the cries of the king, queen, and people.
