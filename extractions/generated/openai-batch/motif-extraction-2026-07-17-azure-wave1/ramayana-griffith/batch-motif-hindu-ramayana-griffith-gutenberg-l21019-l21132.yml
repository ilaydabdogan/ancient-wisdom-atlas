  quote: ''
  summary: Bharat is overcome by grief. Vaśishṭha urges him to perform the dead monarch's
    funeral rites. The king's body is prepared, carried in procession, placed on a
    pyre, and cremated with sacred fires, funeral texts, and Śaman verse. Royal women
    mourn, the mourners go to the Sarjú, purify their lips with water, and observe
    ten days of grief.
