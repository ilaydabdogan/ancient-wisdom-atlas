canonical_text:
  quote: ''
  summary: A poetic account describes Daksha making a feast and sacrifice at the gates
    of Ganga while excluding Uma and Shiva. Narad brings news of the rite to Uma and
    Shiva on Kailasa. Uma goes to Daksha, who insults Shiva and accepts her only because
    she comes alone. In anger Uma hurls herself into the holy fire; a fiery Vision
    called Uma’s Wrath emerges and destructive forms attack the sacrificers, defiling
    the rite. The sacrifice flees in deer-like form toward heaven, the Rudras cut
    off its head, and Shiva appears, blesses the rite, and calms the storm; the Deer’s
    Head remains in the sky.
  language: English
  quote_policy: summarized
