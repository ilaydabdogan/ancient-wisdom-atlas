canonical_text:
  quote: Laid down his body in the fire.
  summary: After Rama has slain Viradha, he travels with Sita and Lakshmana to Sarabhanga's
    hermitage. Rama sees Indra with a radiant celestial car and retinue; Indra departs
    before Rama approaches, saying Rama has a future task. Sarabhanga explains that
    Indra came to carry him to Brahma's sphere, but that he waited to see Rama. He
    directs Rama toward Sutikshna's hermitage by the Mandakini, then enters the fire,
    emerges in a youthful radiant form, ascends beyond celestial regions, reaches
    Brahma's sphere, and is welcomed by Brahma.
  language: English
  quote_policy: quoted
