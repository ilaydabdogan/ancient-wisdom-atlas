canonical_text:
  quote: "“I shall be born again for thy destruction.”"
  summary: 'The passage summarizes episodes involving Rāvaṇa: Kuvera yields Lankā;
    Rāvaṇa marries Mandodarī and fathers Meghanāda/Indrajit; Rāvaṇa encounters the
    ascetic Vedavatī, who is vowed to Vishṇu, insults her, and causes her to enter
    fire after declaring future rebirth for his destruction. The passage then identifies
    Vedavatī with Sītā, Rāma with Vishṇu, and Sītā with Lakshmí, and briefly recounts
    Rāvaṇa interrupting Marutta’s sacrifice, causing gods to take animal forms and
    grant boons to those animals.'
  language: English
  quote_policy: quoted
