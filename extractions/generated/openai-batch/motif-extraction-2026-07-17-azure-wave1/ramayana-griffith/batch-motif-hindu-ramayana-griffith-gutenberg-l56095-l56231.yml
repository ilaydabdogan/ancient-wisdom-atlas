canonical_text:
  quote: ''
  summary: After Sita’s ordeal by fire, a divine assembly arrives and asks Rama why
    he does not recognize his heavenly nature. Rama calls himself a mortal of Ikshvaku’s
    line. Brahma reveals him as Narayana/Vishnu and identifies Sita as Lakshmi, saying
    Rama took human form to free the worlds from Ravana. The Lord of Fire then brings
    Sita unharmed from the pyre and testifies to her purity and fidelity. Rama explains
    that the public ordeal was necessary to clear her reputation before the world,
    says he never doubted her, and embraces her.
  language: English
  quote_policy: summarized
