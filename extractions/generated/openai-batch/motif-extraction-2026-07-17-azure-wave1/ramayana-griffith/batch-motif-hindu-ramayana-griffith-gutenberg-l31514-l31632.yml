canonical_text:
  quote: ''
  summary: Márícha tells Rávaṇ that after a previous encounter with Ráma he and two
    fiends took deer forms, roamed Daṇḍak wood, killed hermits, and disrupted their
    rites. He later attacked Ráma, who was in the forest with his wife and Lakshmaṇ;
    Ráma shot arrows, killing the two companions while Márícha escaped. Márícha now
    lives as a fearful hermit, perceiving Ráma everywhere, and warns Rávaṇ that Ráma
    is too strong and that Rávaṇ and his kin will die if the counsel is ignored. Rávaṇ
    rejects the warning and answers with reproaches.
  language: English
  quote_policy: summarized
