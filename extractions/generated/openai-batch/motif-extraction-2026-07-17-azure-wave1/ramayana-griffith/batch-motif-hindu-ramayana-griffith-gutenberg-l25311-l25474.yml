canonical_text:
  quote: "“The rule and all affairs of state / I to these shoes will delegate.”"
  summary: After sages praise the brothers and counsel Bharat to accept Rama's decision,
    Bharat begs Rama to rule the realm. Rama refuses to violate his father's word
    and urges Bharat to govern with counselors. Bharat asks Rama to set his feet in
    gold-decked sandals, receives them, vows to live ascetically outside the realm
    until Rama returns, and delegates rule to the sandals. Bharat carries the sandals
    away with reverence and returns toward the hermitage of Bharadvaja.
  language: English
  quote_policy: quoted
