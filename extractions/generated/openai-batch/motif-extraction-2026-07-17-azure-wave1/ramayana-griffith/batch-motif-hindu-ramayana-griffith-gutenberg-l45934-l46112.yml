canonical_text:
  quote: ''
  summary: From a shelter in the boughs, the Vánar watches Ráma’s spouse as the giant
    monarch Rávan wakes, thinks of her, and comes in royal procession to the Aśoka
    grove. Sítá is afraid, guarded by she-demons, weeps, lies on the earth, and thinks
    of Ráma. Rávan then addresses her with a coercive wooing speech, praising her
    beauty, urging her to accept him, offering luxury, jewels, kingdom, conquest,
    and queenly rank, while disparaging Ráma and boasting of his own power.
  language: English
  quote_policy: summarized
