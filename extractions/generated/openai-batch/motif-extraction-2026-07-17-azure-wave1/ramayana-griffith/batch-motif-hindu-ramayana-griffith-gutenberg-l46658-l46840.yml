canonical_text:
  quote: ''
  summary: Hanumán descends from a tree and respectfully addresses the sorrowing lady,
    discerning that she is Sítá, Janak’s child and Ráma’s queen, whom Rávaṇ stole
    away. Sítá confirms her identity, recounts Ráma’s forest exile and her abduction
    to Lanká, and says she has only two months before she will be slain. Hanumán announces
    himself as Ráma’s messenger, but Sítá fears he may be Rávaṇ in a magical disguise.
    After she asks for proof through a description of Ráma, Hanumán praises Ráma and
    Lakshmaṇ, foretells Rávaṇ’s fall, and recounts Ráma’s alliance with Sugríva, the
    death of Báli, the Vánar search, his sea-crossing, and his discovery of Sítá.
  language: English
  quote_policy: summarized
