canonical_text:
  quote: ''
  summary: Sumantra reports to the grieving monarch the messages Rama gave for his
    father, mother, Bharata, and the royal household. Lakshman angrily condemns the
    king's banishment of Rama, while Janak's child grieves silently. Sumantra then
    recounts the exiles taking on votive locks and bark clothing, crossing the Ganga
    toward Prayag, and entering the wood while he returns with the chariot. The realm,
    natural world, people, women, and city of Ayodhya are described as mourning Rama's
    absence.
  language: English
  quote_policy: summarized
