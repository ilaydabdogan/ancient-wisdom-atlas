candidate_motifs:
- id: motif:1
  label: captive queen and approaching avenger
  taxonomy_refs:
  - stolen_beloved
  basis: The passage reports a captive queen in Lanká and immediately frames Ráma
    as a vengeful leader approaching with allies against Rávan.
  evidence_refs:
