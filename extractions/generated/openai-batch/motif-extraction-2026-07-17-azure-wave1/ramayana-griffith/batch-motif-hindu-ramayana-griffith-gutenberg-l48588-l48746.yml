canonical_text:
  quote: ''
  summary: Rávan sees Lanká ruined after Hanumán’s incursion, acknowledges that the
    Vánar spy has seen the captive queen, and asks his lords for wise counsel as Ráma
    approaches with allies across the sea. His counsellors encourage him by recalling
    his former victories over supernatural enemies and by proposing Indrajít as champion.
    Prahasta and Durmukh vow to attack the Vánars, and Vajradanshṭra enters brandishing
    a blood-stained mace.
  language: English
  quote_policy: summarized
