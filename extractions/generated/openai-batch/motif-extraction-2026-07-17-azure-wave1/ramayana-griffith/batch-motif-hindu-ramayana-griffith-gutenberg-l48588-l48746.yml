  - ev:3
  confidence: medium
  cautions: The passage calls the queen captive and Ráma vengeful, but within this
    excerpt it does not explicitly name the queen or state her relationship to Ráma.
- id: motif:2
  label: enemy spy breaches an inviolable city and burns it
  taxonomy_refs:
  - trickster_boundary
  basis: Hanumán passes the long-inviolate gate, eludes the watch, sees the captive
    queen, and leaves the city desolate by fire; Prahasta also describes him as a
    disguised foe.
  evidence_refs:
  - ev:1
  - ev:9
  - ev:10
  confidence: medium
  cautions: The text identifies disguise, spying, and boundary breach, but does not
    explicitly characterize Hanumán here as a trickster.
- id: motif:3
  label: wise counsel before royal military action
  taxonomy_refs:
  - wisdom
  basis: Rávan states that victory springs from counsel, distinguishes better and
    worse forms of counsel, and asks his lords to advise before he acts.
