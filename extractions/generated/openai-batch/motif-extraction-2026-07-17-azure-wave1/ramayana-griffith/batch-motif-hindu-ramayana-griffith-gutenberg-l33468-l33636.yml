  quote: |-
    Then Rávaṇ raised her up, and bare
    His captive through the fields of air
  summary: Sítá is seized and carried through the sky by Rávaṇ while crying out for
    Ráma and Lakshmaṇ. The sky, sun, saints, spirits, animals, trees, brooks, and
    hills react with fear or mourning. Flowers and ornaments fall from Sítá as she
    is borne away, and she finally looks down for help, sees none, and swoons.
  language: English
