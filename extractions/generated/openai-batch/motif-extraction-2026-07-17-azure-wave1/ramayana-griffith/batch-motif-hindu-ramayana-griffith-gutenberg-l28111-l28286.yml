canonical_text:
  quote: ''
  summary: A royal bird narrates a genealogy of primordial fathers, Daksha's daughters,
    Kashyap's wives, gods, animals, serpents, humans, trees, and his own descent.
    He identifies himself as Jatayus, offers to help Rama and guard Sita, and is accepted.
    Rama, Sita, and Lakshman then arrive at Panchavati, where Rama asks Lakshman to
    find a suitable hermitage site with water, trees, flowers, wood, sacred grass,
    and springs; Lakshman pledges obedience and Rama selects a fair spot.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker lists first-born Fathers or Lords of Life as sources from whom
    beings in earth and heaven derive birth.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'Daksha is said to have sixty daughters, and Kashyap weds eight of them: Aditi,
    Diti, Kalaka, Tamra, Danu, Anala, Krodhavasa, and Manu.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kashyap tells each bride that she will bear sons to rule the three worlds;
    Aditi, Diti, Danu, and Kalaka obey, while the others refuse.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aditi bears the Vasus, Adityas, Rudras, and Asvins; Diti bears the Daityas;
    Danu and Kalaka also bear named offspring.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tamra's daughters are linked to cranes, owls, waterfowl, vultures, hawks,
