  summary: An unnamed speaker praises a prince's might but asks him first to hear
    of Bāli's strength. The speaker describes Bāli's feats with mountains and trees,
    then recounts how the bull-shaped monster Dundubhi sought battle, challenged Ocean,
    was redirected to the Lord of Hills, and began damaging Himalaya before the mountain
    lord refused warfare as a hermit's retreat.
