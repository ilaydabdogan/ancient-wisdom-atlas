  quote: ''
  summary: Hanuman presents Rama and Lakshman to Sugriva, explaining Rama's lineage,
    forest exile, and the theft of Rama's wife by Ravana. Sugriva offers Rama friendship,
    Rama accepts, and Hanuman kindles a fire before which the two chiefs solemnize
    their league. Sugriva recounts his loss of wife and realm through his brother
    Bali, and Rama promises to kill Bali. The passage closes with signs in the left
    eyes of Sita, Bali, and demons, interpreted respectively as hopeful or ominous.
  language: English
