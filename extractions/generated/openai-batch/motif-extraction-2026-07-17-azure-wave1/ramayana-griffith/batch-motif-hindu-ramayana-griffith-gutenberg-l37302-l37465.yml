canonical_text:
  quote: |-
    “Rise, Ráma, rise: the search begin,
    And track the giant foul with sin.”
  summary: Lakshman counsels the grieving Rama to restrain sorrow, pursue Ravana,
    and recover Sita. Rama accepts the counsel and travels with Lakshman toward Rishyamuka.
    Sugriva and the Vanaras see the armed brothers, fear they may be Bali’s spies,
    and flee to higher refuge. Hanuman advises Sugriva to dismiss fear because Bali
    cannot harm him on Malaya and urges prudent judgment.
