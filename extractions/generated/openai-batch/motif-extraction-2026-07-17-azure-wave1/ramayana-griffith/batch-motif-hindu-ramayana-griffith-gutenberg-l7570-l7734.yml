canonical_text:
  quote: ''
  summary: Viśvámitra promises to aid the transformed king Triśanku through a rite
    that will send him bodily to heaven. After Mahodaya and Vaśishṭha’s hundred sons
    reject participation, Viśvámitra curses them. The gathered saints, fearing Viśvámitra,
    perform the rite. The gods refuse the offering, so Viśvámitra invokes his ascetic
    power directly; Triśanku rises into the sky, but Indra rejects him from heaven
    and orders him to fall back to earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kuśik’s son speaks kindly to the transformed king, promises relief, and says
    the king will be transported in his present body to the place he desires.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sage orders his sons and pupils to prepare what is needed for the rite
    and to summon Vaśishṭha’s sons and the saints.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The envoys report that the holy men are gathering, that Mahodaya alone refused,
    and that Vaśishṭha’s hundred sons rejected the rite with scornful words about
    the prince and Viśvámitra.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Viśvámitra becomes angry and pronounces curses on Vaśishṭha’s sons and on
    Mahodaya, including destruction, descent to Yáma’s kingdom, repeated rebirths,
    and a degraded life for Mahodaya.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Viśvámitra presents Triśanku to the gathered saints as a virtuous king who
    seeks refuge with him and asks them to arrange the rite so Triśanku may rise bodily
    to the skies.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The gathered saints agree to participate because they fear Viśvámitra’s anger
    and possible curse.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The rite is performed with requisites, hymns, and a solemn offering, but the
