canonical_text:
  quote: ''
  summary: Ráma tells Sítá that his father’s decree, shaped by boons granted to Queen
    Kaikeyí, requires him to spend fourteen years in Daṇḍak forest while Bharat receives
    the kingdom. He urges Sítá to remain in Ayodhyá, observe vows and worship, honor
    the royal elders, and obey Bharat. Sítá rejects being left behind, argues that
    a wife shares her husband’s fate, asks to go before Ráma through the forest, describes
    life with him in the wild, and declares that separation from him would make life
    unbearable. The narrator states that Ráma still does not consent and continues
    trying to dissuade her by describing the hardships of the wild.
  language: English
  quote_policy: summarized
