canonical_text:
  quote: ''
  summary: Rāvaṇ hears the renewed shouts of the Vānar army and sends envoys to discover
    why. The envoys report that the Vānars are formed under Sugrīva and that Rāma
    and his brother have been released from the snake-bond spell. Rāvaṇ, alarmed,
    orders Dhūmrāksha to attack. Dhūmrāksha’s giant forces clash with the Vānars;
    trees, stones, arrows, swords, and maces are used. Hanumān destroys Dhūmrāksha’s
    chariot and kills him with a rock or mountain peak. Rāvaṇ then sends Vajradanshṭra
    with troops; ominous signs appear before the battle, and Angad charges the giant
    ranks wielding a tree.
  language: English
  quote_policy: summarized
