canonical_text:
  quote: ''
  summary: An unnamed speaker rejoices that long-awaited good news has arrived and
    asks for the account of Ráma’s woes and triumphs. Hanúmán recounts Ráma’s wanderings
    from Daṇḍak wood, including encounters with Virádha, Śarabhanga’s cell, Indra’s
    descent, Śúrpaṇakhí’s rejection and mutilation, battles with giants, the golden
    deer, Rávaṇ’s abduction of the Maithil queen, Jatáyus’s death while trying to
    save her, Ráma’s renewed search, the sea bridge, and the final reunion with his
    queen.
