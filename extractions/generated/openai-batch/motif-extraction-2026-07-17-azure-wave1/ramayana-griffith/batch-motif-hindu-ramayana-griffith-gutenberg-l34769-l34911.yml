canonical_text:
  quote: "“O Sítá, O my love!”"
  summary: Ráma returns to his empty forest home after a vain search for Sítá, laments
    her absence, and wonders whether she has been carried away. Lakshmaṇ urges renewed
    searching through hills, caves, woods, and waters. The brothers search but find
    no trace. Lakshmaṇ consoles Ráma with a comparison to Vishṇu recovering the earth
    after subduing Bali, but Ráma remains overwhelmed by grief and imagines Sítá hidden
    among trees near the hermitage.
  language: English
  quote_policy: quoted
