canonical_text:
  quote: ''
  summary: During the churning of the troubled main, a lotus-borne queen identified
    with Beauty and Fortune appears and clings to Vishṇu. The Amrit then appears,
    provoking a war between gods and Titans; Vishṇu removes the Amrit by illusion,
    the Titans and Diti’s brood are defeated, and Indra gains rule over the three
    worlds. Diti, grieving her slain sons, asks Kaśyap for a son who can kill Indra;
    Kaśyap grants this if she remains pure for a thousand years. Diti undertakes austerities
    while Indra attends her, and near the end she tells him a warlike new brother
    will soon appear.
  language: English
  quote_policy: summarized
