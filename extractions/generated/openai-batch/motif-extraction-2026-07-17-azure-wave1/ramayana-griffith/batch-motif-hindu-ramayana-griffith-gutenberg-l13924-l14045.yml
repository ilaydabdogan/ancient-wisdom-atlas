  summary: Kauśalyá blesses Ráma before his forest departure with ritual substances,
    an amulet, prayers, embraces, and invocations for protection. Ráma leaves her
    and goes toward Sítá. Sítá, unaware of the change in events and expecting a royal
    consecration, sees Ráma distressed and asks why the expected signs and attendants
    of coronation are absent.
