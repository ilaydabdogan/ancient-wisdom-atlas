canonical_text:
  quote: ''
  summary: Bharat reports that Rama refused to return before the fourteen-year term
    of his father's decree and entrusted golden sandals to Bharat so they might guard
    Ayodhya. A hermit praises Bharat's virtue. Bharat returns with his retinue across
    the Yamuna and Ganga to Ayodhya, which is described as dark, silent, and bereft
    after Rama's exile. Bharat laments the cessation of music, garlands, fragrance,
    vehicles, animals, feasting, and song, hoping Rama's return will restore joy.
    He enters the deserted palace, sees the widowed queens lodged, and resolves to
    go to Nandigram and wait until Rama is restored as rightful lord; the holy guides
    approve his brotherly loyalty.
  language: English
  quote_policy: summarized
