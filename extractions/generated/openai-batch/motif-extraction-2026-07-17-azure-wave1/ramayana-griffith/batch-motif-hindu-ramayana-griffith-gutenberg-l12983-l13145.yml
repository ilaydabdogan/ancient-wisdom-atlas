canonical_text:
  quote: ''
  summary: Rāma raises and comforts the fainting Kauśalyā. Kauśalyā laments that Rāma’s
    birth, her hopes in him, her vows, fasts, prayers, and rites have all led to grief
    because he is to be banished and she will be left among rivals. Lakṣmaṇ then argues
    that Rāma is faultless, that the king is acting under Kaikeyī’s influence, and
    that Rāma should secure the throne by force if necessary. Lakṣmaṇ threatens violence
    against Bharat’s supporters and even against his father, and swears he will precede
    Rāma into forest or fire.
  language: English
  quote_policy: summarized
