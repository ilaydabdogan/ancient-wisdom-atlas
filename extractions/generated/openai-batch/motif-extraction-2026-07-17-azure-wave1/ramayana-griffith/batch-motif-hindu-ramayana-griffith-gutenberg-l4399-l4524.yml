canonical_text:
  quote: ''
  summary: Rāma summons Tāḍakā by sounding his bow, first intends only to maim her,
    then battles her magical dust, stones, disguises, and invisibility. Urged by Viśvāmitra
    to kill her before twilight, Rāma strikes her heart with a crescent-shaped dart.
    Indra and the gods praise the deed and ask the sage to bestow heavenly arms on
    Rāma. Viśvāmitra blesses Rāma, and the formerly cursed grove becomes bright and
    pleasant.
  language: English
  quote_policy: summarized
