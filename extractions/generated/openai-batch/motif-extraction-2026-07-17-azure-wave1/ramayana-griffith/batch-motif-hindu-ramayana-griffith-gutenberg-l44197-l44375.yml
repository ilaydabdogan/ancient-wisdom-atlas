canonical_text:
  quote: ''
  summary: Sampáti performs rites for his brother and tells Báli’s son how, after
    being burned by the sun, he fell on Mount Vindhya, sought the ascetic Niśakar,
    and recounted his and Jaṭáyus’s attempt to chase the sun. Sampáti shielded Jaṭáyus
    and lost his wings. Niśakar foretold the future exile of Ráma and Lakshmaṇ, Rávaṇ’s
    abduction of Ráma’s wife, the coming of Vánar envoys, and Sampáti’s eventual restoration
    after declaring the lady’s fate.
  language: English
  quote_policy: summarized
