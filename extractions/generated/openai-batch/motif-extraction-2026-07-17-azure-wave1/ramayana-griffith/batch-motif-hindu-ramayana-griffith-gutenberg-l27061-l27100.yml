  quote: ''
  summary: A holy hermit praises his forest retreat and invites Ráma to rest there.
    Ráma answers that his weapons might harm the animals near the hermitage and thus
    dishonor the saint, so he will stay only briefly. He performs evening rites and
    spends the night with Sítá and his brother under the grove’s shade, while Sutíkshṇa
    offers hospitable food suited to hermits.
