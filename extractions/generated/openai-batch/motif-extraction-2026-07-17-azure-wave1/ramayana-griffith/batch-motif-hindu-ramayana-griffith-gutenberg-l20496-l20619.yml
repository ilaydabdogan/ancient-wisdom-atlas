canonical_text:
  quote: ''
  summary: Bharat mourns his father, questions Kaikeyi about Dasaratha’s death and
    last words, asks where Rama, Sita, and Lakshman are, and seeks the cause of Rama’s
    exile. Kaikeyi reports Dasaratha’s grief and death, says Rama has gone in hermit
    dress to the Dandak wilderness with Sita and Lakshman, admits that she requested
    Rama’s banishment and the throne for Bharat, and urges Bharat to perform the king’s
    funeral rites and then assume rule.
