canonical_text:
  quote: ''
  summary: King Aśvapati honors Bharat with wealth, animals, and trusted guides. Bharat,
    anxious to depart, leaves with Śatrughna and a large retinue. He travels eastward
    across many named rivers, forests, hills, and towns, rests his army at the Yamunā,
    and after seven nights sees Ayodhyā. He tells his driver that the city seems lifeless,
    silent, joyless, and ominous.
