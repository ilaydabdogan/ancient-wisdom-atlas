  summary: Malyaván advises Rávaṇ to make peace with Ráma and restore the captive
    queen, arguing that Justice and ascetic power now support Rávaṇ’s enemies. He
    cites Brahmá’s boon, the invading Vánars, men, and bears, and many fearful omens
    over Lanká. He identifies Ráma as Vishṇu in human form and urges peace. Rávaṇ
    angrily rejects the counsel, refuses to return the lady, vows that Ráma will not
    leave alive, and then arranges the defense of Lanká’s gates with named commanders.
  language: English
