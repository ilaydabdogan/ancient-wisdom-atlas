canonical_text:
  quote: ''
  summary: Rāma rebukes the wounded Sugrīva for rashly risking his life, then orders
    the Vānara forces arrayed around Lankā. He sends Angada as envoy to Rāvaṇa with
    a warning to return the Maithil lady and seek pardon or face destruction. Rāvaṇa
    orders Angada seized, but Angada demonstrates his strength, throws down his captors,
    breaks a palace turret, leaps into the sky, and returns to Rāma.
  language: English
  quote_policy: summarized
