canonical_text:
  quote: ''
  summary: At dawn on an auspicious day, Brahmans, royal chaplains, officials, traders,
    military leaders, entertainers, and multitudes assemble for a royal consecration
    rite. Ritual objects, sacred waters, offerings, animals, regalia, music, and attendants
    are prepared. The crowd notices the king is absent. Sumantra enters the inner
    chamber, blesses and urges the king to rise for the rite, and the king orders
    him to bring Rama without delay.
  language: English
  quote_policy: summarized
