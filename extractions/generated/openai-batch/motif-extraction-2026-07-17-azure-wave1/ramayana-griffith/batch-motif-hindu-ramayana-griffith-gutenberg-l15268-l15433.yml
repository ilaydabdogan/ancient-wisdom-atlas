    Dasaratha, invoking royal succession, public outrage, a tree proverb, and an embedded
    tale about Kaikeyi's parents and a dangerous demand for secret knowledge. He urges
    her to allow Rama's anointing, but she remains unmoved. Dasaratha then orders
    that a full royal retinue, wealth, and provisions accompany Rama into the forest
    so that he may live, sacrifice, give largess, and meet hermits, while Ayodhya
    is left to Bharata.
