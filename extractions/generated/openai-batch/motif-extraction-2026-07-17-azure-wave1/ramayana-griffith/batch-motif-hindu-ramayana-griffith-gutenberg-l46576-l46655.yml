canonical_text:
  quote: ''
  summary: A Vánar speaks gently to Sita, recounting Daśaratha, Ráma’s exile, Sita’s
    abduction by a giant king, Ráma’s alliance with Sugríva, the Vánar search, and
    the speaker’s leap across the sea to find her. Sita reacts with fear and doubt,
    wondering whether the monkey speaker is a dream or mental illusion, then invokes
    deities to make the hopeful words true.
