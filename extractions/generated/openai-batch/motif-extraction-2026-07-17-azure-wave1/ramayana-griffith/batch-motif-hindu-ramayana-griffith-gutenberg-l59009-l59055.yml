  summary: The passage contains scholarly notes. A Latin quotation from Schlegel argues
    that certain Ramayana verses, including references to followers of Buddha, are
    spurious or later additions, citing recensional rejection, meter, chapter placement,
    and style. An English note states that the narrative of Ráma's exile in the jungle
    is obscure, but may illuminate the poem's significance and the character in which
    a Brahmanical author wished to represent Ráma.
