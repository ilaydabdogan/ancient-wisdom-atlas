canonical_text:
  quote: ''
  summary: A first-person speaker addresses Lakshman beside Pampā, describing the
    mountain, flowering spring forest, breezes, bees, birds, paired animals, and lotus-covered
    stream. The beauty of the landscape repeatedly recalls Sítá, his absent beloved
    and spouse, who is described as far away and imprisoned. The speaker fears reporting
    Sítá’s fate to her father and to Queen Kauśalyá, asks Lakshman to go to Bharat,
    and says life is unbearable without Sítá.
