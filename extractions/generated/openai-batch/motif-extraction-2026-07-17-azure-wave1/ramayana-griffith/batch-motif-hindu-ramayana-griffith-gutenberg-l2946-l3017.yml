canonical_text:
  quote: ''
  summary: The gods petition Náráyaṇ/Vishṇu to be born as King Daśaratha's offspring
    through his three queens, divided into four, because Daśaratha has performed a
    sacrificial rite for sons. They ask the deity to take human form and kill Rávaṇ,
    whose boon leaves him vulnerable only to man. Vishṇu promises to kill Rávaṇ, his
    ministers, and his kin, then reign on earth as a human king. A celestial throng
    sings praise to the champion who will appear as man and slay Rávaṇ.
  language: English
  quote_policy: summarized
