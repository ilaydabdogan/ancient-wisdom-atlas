canonical_text:
  quote: ''
  summary: Viśvámitra explains that the hermitage grove was once associated with Lord
    Vishṇu, who performed austerities there and later, in dwarfish form, requested
    three steps of land from Bali, expanded, measured the worlds, sent Bali to the
    nether world, and restored Indra’s rule. Viśvámitra then brings Rāma and Lakshmaṇ
    to the consecrated hermitage, where the residents honor them. Rāma and Lakshmaṇ
    urge Viśvámitra to begin the initiatory rites. After ritual purification with
    water and worship beside the sacrificial flame, the brothers keep a six-day and
    six-night vigil while Viśvámitra observes his silent Dikshā, awaiting the expected
    demon attack.
  language: English
  quote_policy: summarized
