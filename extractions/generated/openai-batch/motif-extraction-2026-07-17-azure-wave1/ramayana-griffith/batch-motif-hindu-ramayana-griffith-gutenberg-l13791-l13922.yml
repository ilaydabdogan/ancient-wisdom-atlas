canonical_text:
  quote: ''
  summary: Kauśalyá sets aside grief, purifies her lips with water, and blesses Ráma
    as he departs for Daṇḍak wood. She invokes deities, saints, celestial bodies,
    times, natural places, elements, and forest creatures to protect him. She then
    worships the gods, has a Bráhman perform a fire offering for Ráma’s welfare and
    safe return, distributes offerings, pays the priest, and invokes mythic precedents
    for successful enterprises.
  language: English
  quote_policy: summarized
