canonical_text:
  quote: "“Scarce may the living find their way / Returning hence to light of day;”"
  summary: Hanumán recounts the Vánars’ search for Ráma’s stolen wife, their exhaustion,
    entry into a dark cave, and aid from an ascetic woman. The ascetic releases them
    from the cave by ascetic power after they close their eyes. Outside by the sea,
    the Vánars despair because Sugríva’s deadline has passed; Angad proposes fasting
    to death, and Tára suggests returning to the magical cavern for safety.
  language: English
  quote_policy: quoted
