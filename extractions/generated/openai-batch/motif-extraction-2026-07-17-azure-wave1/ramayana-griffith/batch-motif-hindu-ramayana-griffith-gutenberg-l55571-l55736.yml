canonical_text:
  quote: ''
  summary: Rávaṇ’s wives mourn over his battlefield corpse and blame his refusal to
    return Sítá and heed counsel. Mandodarí laments Rávaṇ, interprets Ráma as Death,
    Indra, or Vishṇu in human form, recalls omens of Ráma’s divinity, and says desire
    for Sítá brought ruin. Ráma instructs Vibhishaṇ to perform funeral rites. Vibhishaṇ
    objects because of Rávaṇ’s wrongdoing, but Ráma orders honors for the fallen warrior.
    Vibhishaṇ leads formal obsequies with sacred fire, offerings, a golden litter,
    sandal wood, milk, a sacrificial goat, and the kindling of the pyre. After bathing,
    the mourners return to Lanká; Ráma lays aside his weapons.
  language: English
  quote_policy: summarized
