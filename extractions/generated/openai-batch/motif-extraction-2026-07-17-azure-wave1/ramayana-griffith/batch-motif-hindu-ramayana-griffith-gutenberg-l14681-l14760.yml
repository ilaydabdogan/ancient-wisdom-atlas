  quote: ''
  summary: Lakshman asks to follow Rama, promising armed protection, practical service,
    food gathering, and watchfulness in the woodland. Rama accepts his help, sends
    him to bring celestial weapons given by Varun to Janak and kept by Rama's preceptor,
    and then says he will distribute wealth and livelihood to Brahmans and servants
    before going with Lakshman to the solitary wood.
