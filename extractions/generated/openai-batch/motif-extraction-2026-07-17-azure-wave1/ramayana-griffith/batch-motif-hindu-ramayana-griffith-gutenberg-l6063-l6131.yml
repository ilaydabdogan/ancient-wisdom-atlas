  quote: |-
    “Gangá thine eldest child shall be,
    Called from thy name Bhágirathí;
    Named also—for her waters fell
    From heaven and flow through earth and hell—”
  summary: Brahma praises King Bhagirath because the sons of Sagar have been purified
    and have gained heaven. He names Ganga as Bhagirath's child and as the three-path
    river flowing through heaven, earth, and hell. Brahma instructs Bhagirath to bathe
    and pour libations for his kin, then ascends with the gods. Bhagirath performs
    the libation, returns purified, rules prosperously, and the narrator says the
    story of Ganga's descent grants blessings to its hearers.
