canonical_text:
  quote: "“Proud Lanká was one blaze of fire”"
  summary: Sugríva urges the Vánara leaders to exploit Rávaṇ’s weakened state. At
    night the Vánara host attacks Lanká with torches, setting fire to buildings, wealth,
    weapons, animals’ stalls, and the city’s gates and towers. Ráma stands ready while
    Kumbha and Nikumbha enter battle; Sugríva kills both. An editorial summary then
    compresses further battles, including Makaráksha’s death, Indrajít’s invisible
    magic, his magical effigy of Sítá, and his death by Lakshmaṇ. In the following
    canto, messengers report Indrajít’s death to Rávaṇ, who laments his son while
    describing heroic death in battle as earning a heavenly reward.
  language: English
  quote_policy: quoted
