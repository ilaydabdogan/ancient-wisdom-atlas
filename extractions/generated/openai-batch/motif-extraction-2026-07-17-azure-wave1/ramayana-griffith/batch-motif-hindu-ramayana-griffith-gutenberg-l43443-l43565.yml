canonical_text:
  quote: ''
  summary: Hanumán, Angad, Tára, and the Vánars continue their search through mountains
    and enter a dark mountain cave to find water. Inside they discover a luminous
    hidden grove with golden trees, lotus pools, streams, precious buildings, and
    food. They meet a holy woman, later identified as Svayamprabhá. Hanumán asks who
    owns the cave and its marvels. Svayamprabhá explains that Maya, a Dánava artificer,
    made the golden wood after receiving knowledge from Brahmá; Indra killed Maya
    for loving Hemá, and Brahmá gave the abode to Hemá. Svayamprabhá guards the hidden
    home and offers the travellers fruit and water.
  language: English
  quote_policy: summarized
