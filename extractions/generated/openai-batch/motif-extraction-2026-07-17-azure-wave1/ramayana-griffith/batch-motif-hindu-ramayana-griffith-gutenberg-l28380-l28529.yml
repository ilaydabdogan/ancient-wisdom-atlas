canonical_text:
  quote: "“The glowing autumn passed, and then / Came winter so beloved of men.”"
  summary: While Ráma dwells contentedly, autumn passes and winter arrives. At dawn
    he goes to bathe at a stream, with Lakshmaṇ and Sítá behind him. Lakshmaṇ describes
    winter weather, rites, harvest, animals, waters, and plants, then speaks of Bharat’s
    grief and renunciation for Ráma and reproaches Kaikeyí; Ráma is grieved by the
    reproach.
  language: English
  quote_policy: quoted
