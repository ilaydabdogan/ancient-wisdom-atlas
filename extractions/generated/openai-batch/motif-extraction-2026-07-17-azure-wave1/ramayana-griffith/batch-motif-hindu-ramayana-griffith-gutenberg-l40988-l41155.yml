canonical_text:
  quote: ''
  summary: After Sugríva is restored to kingship, Ráma and Lakshman retire to a cave
    on Praśravaṇ hill for the rainy season. Ráma praises the mountain, cave, brook,
    trees, birds, and nearby Kishkindhá, but remains grief-stricken over his stolen
    wife. Lakshman urges him to cast off sorrow, wait until the rains pass, and then
    defeat the demon foe. Ráma accepts the counsel and states that one who has been
    saved should repay the boon with a friendly deed.
  language: English
  quote_policy: summarized
