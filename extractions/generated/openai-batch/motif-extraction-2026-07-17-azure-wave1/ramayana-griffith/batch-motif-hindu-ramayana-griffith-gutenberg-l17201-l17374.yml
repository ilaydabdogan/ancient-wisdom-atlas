canonical_text:
  quote: "“Grass, bark, and hide my only wear, / And woodland roots and fruit my fare”"
  summary: Rāma declines Guha's gifts, accepts only care for the horses, performs
    evening rites on the riverbank, and sleeps with Sītā while Lakshmaṇ and Guha keep
    watch. Guha offers protection and rest to Lakshmaṇ, but Lakshmaṇ laments Rāma's
    exile, Daśaratha's likely grief and death, and Ayodhyā's sorrow. At dawn Rāma
    calls for the crossing of the Gangā/Jāhnavī, and Guha has a boat prepared for
    the pilgrims.
  language: English
  quote_policy: quoted
