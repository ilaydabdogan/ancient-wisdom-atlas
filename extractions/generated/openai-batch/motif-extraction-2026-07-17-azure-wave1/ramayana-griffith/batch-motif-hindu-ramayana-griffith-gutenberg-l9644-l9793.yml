canonical_text:
  quote: ''
  summary: Bharat goes to his grandsire with Śatrughna and is honored by King Aśvapati,
    while the princes and their father remember one another. The aged monarch loves
    all his sons but especially Ráma, whose virtues, learning, self-command, counsel,
    and martial skill are praised at length. Feeling weak and warned by fearful signs,
    the monarch wishes to anoint Ráma as first-born ruler and Regent Heir before death,
    so that he may gain a blissful heavenly seat. He summons people, princes, peers,
    and rulers to an honored assembly, omitting Kekaya’s king and Janak only because
    of haste, and begins to address the gathered assembly.
  language: English
  quote_policy: summarized
