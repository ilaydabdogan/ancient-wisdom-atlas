canonical_text:
  quote: ''
  summary: After completing their previous task, Ráma and Lakshmaṇ perform morning
    rites and ask the sage for commands. The saints led by Viśvámitra tell Ráma that
    King Janak of Mithilá has planned a sacrifice and that Ráma will see a divine
    bow there. The bow is described as impossible for gods, fiends, bards, or royal
    sons to string, and as obtained by Janak from the Gods through an imperial sacrifice.
    Viśvámitra leaves the hermitage with disciples, servants, and even animals following,
    journeys north, halts on the Śona shore, and after evening rites Ráma asks him
    to describe the country.
  language: English
  quote_policy: summarized
