canonical_text:
  quote: ''
  summary: Daśaratha dies while grieving, with Kauśalyá and Sumitrá beside him. At
    dawn, court musicians, heralds, attendants, and maids arrive with songs, praise,
    ritual water, offerings, sacred objects, and toilet gear. When the king does not
    rise or speak, attendants enter, touch the bed and his cold hand, and realize
    he is dead. Kauśalyá and Sumitrá, exhausted by grief, awaken, see and touch his
    lifeless body, cry out as wives, and fall prostrate. The royal women, led by Kaikeyí,
    weep and collapse, and the palace resounds with lamentation and fear.
  language: English
  quote_policy: summarized
