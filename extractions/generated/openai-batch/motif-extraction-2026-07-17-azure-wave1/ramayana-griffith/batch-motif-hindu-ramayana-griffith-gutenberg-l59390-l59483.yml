literal_observations:
- id: obs:1
  text: The passage discusses the possibility of Rama concluding an alliance with
    monkeys and describes monkeys in southern India as intelligent, physically capable,
    organized, attached to localities, and capable of journeys over mountains and
    rivers.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that Hindus regarded the monkey as a being half human and
    half divine, and says that the Ramayana monkeys have been confounded with aboriginal
    people of southern India.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage conjectures that an aboriginal army may have been accompanied
    by bands of monkeys, giving rise to a story that the army was composed of monkeys.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage describes the Bali narrative as a quarrel between an elder and
    a younger brother for possession of a Raj, followed by Rama's alliance with the
    younger brother.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says Rama killed Bali by an act contrary to fair fighting and
    tacitly sanctioned the transfer of Tara from Bali to Sugriva.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage pairs the Marutas as Indra's army with the red-haired monkeys
    and bears as Rama's army.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage says Bali was the son of Indra, while Sugriva was the child of
    the sun and could change shape at pleasure.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage presents an interpretation in which Vedic antagonism between Indra
    and Vishnu is reproduced in an apish form through Bali, Sugriva, and Rama.
  category: other
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: The passage says Sugriva promises to find the ravished Sita, and compares
    this to Vishnu finding the lost Vedas in one of his incarnations.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says Indra broke Hanumant's jaw with a thunderbolt after Hanumant
    leapt from a mountain into the air to arrest the course of the sun.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
