  summary: The passage consists of additional notes discussing Rama's alliance with
    the monkeys, the possible relation between the Vanaras and southern aboriginal
    peoples, the fall of Bali and alliance with Sugriva, and an interpretive solar/Vedic
    reading of Rama's monkey allies, Bali, Sugriva, Hanumant, Indra, and Vishnu.
