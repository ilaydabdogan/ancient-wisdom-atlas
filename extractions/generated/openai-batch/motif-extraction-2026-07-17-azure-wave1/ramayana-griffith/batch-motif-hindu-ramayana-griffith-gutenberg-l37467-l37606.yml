canonical_text:
  quote: ''
  summary: Sugríva, fearing that two armed strangers may be agents of Bāli, sends
    Hanumán to investigate their purpose and test their sincerity. Hanumán leaves
    Rishyamúka, assumes a wandering mendicant’s disguise, bows to Raghu’s son and
    Lakshmaṇ, praises and questions them, then identifies himself as Sugríva’s envoy
    and says Sugríva seeks a friendly league with them. Raghu’s son is pleased by
    the envoy’s speech.
  language: English
  quote_policy: summarized
