  text: The note says the Epic-period inauguration ceremony may be recognized in the
    inaugurations of Rama in the Ramayana and Yudhishthira in the Mahabharata.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says Rama’s inauguration was prepared while Dasaratha was alive,
    was prevented at that time through Kaikeyi’s intrigues, and occurred fourteen
    years later after Dasaratha’s death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Before the intended inauguration, Rama and Sita fasted; Rama bathed, approached
    the idol of Narayana, made a clarified-butter libation into kindled fire, drank
    the remainder, and lay silently with Sita on Kusha-grass before Vishnu’s altar.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At daybreak Rama performed morning devotion, praised the divinity, and ordered
    the palace prepared for the solemnity.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The inauguration implements included golden water-jars, a throne-seat, a tiger-skin-covered
    chariot, water from sacred rivers and other water sources, honey, curd, clarified
    butter, fried grain, Kusha-grass, flowers, and milk.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The pageant also included damsels, an elephant, golden and silver jars with
    water, Udumbara branches, lotus flowers, white royal objects and animals, musical
    instruments, bards, and in another list seeds, perfumes, jewels, weapons, a litter,
    a golden vase, blazing fire, Brahmanas, cows, wild beasts, birds, chiefs, and
    citizens.
  category: object
  evidence_refs:
  - ev:4
