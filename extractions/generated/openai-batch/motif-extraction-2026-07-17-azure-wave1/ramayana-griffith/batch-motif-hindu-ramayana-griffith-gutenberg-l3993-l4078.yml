canonical_text:
  quote: ''
  summary: Rāma and Lakshmaṇ are sent forth under Viśvámitra’s guidance after blessing
    and parental rites. Divine signs accompany their departure. On the southern shore
    of the Sarjú, the sage instructs Rāma to touch the lustral water and invests him
    with two powerful spells that confer protection, strength, wisdom, and freedom
    from hunger and thirst. Rāma receives the spells with reverence, his glory increases,
    and the youths serve the hermit as pupils before spending the night on the riverbank.
  language: English
  quote_policy: summarized
