canonical_text:
  quote: "“To thee, O Prince, we flee, and crave / Thy guardian help our lives to
    save.”"
  summary: Many ascetics gather around Rama in Sarabhanga’s hermitage and ask him
    to protect forest hermits from Rakshasas. They describe royal duty, the king’s
    share of subjects’ merit, and the killings of ascetics. Rama promises protection
    and then travels with Lakshmana, Sita, and sages to Sutikshna’s hermitage. Sutikshna
    welcomes Rama, says he had delayed ascent to heavenly worlds until Rama’s arrival,
    offers him the reward of his vows, and Rama asks instead for a dwelling place
    in the forest.
  language: English
  quote_policy: quoted
