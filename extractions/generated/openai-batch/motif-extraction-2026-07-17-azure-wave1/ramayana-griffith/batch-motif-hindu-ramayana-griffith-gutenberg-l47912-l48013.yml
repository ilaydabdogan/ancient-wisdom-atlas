  summary: Hanuman looks over a burning waste, consoles the Maithil queen, ascends
    Mount Arishta, leaps northward from its peak, flies through clouds toward the
    coast, and is welcomed by the waiting Vanar host, to whom he reports that he has
    seen and addressed the queen.
