canonical_text:
  quote: ''
  summary: Lakshman, obeying Rama's command, leaves the pregnant Sita near Valmiki's
    grove. Sita grieves, sends a message to Rama, and is comforted by Valmiki, who
    offers refuge in the holy grove. Sita gives birth to two sons, Kusa and Lava,
    who are raised with rites, learn sacred lore, and sing Valmiki's Ramayana. Rama
    hears them, sees his likeness in them, and Valmiki declares them Rama's children
    while urging Sita's restoration.
  language: English
  quote_policy: summarized
