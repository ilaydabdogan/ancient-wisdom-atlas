canonical_text:
  quote: ''
  summary: Palace women lament that Ráma will go into exile and reproach the king,
    who faints from grief. Ráma goes with Lakshmaṇ through the palace to Queen Kauśalyá.
    Kauśalyá has spent the night in rites and makes offerings to Vishṇu, the sacred
    fire, and Lakshmí. She greets, embraces, kisses, and blesses Ráma, expecting him
    to receive regent power. Ráma tells her he must go to Daṇḍak wood for twice seven
    years as a hermit, while Bharat receives the regency. Kauśalyá collapses when
    she hears this.
  language: English
  quote_policy: summarized
