canonical_text:
  quote: ''
  summary: The cursed being Danu recounts how a curse and Indra’s bolt gave him a
    monstrous body, long arms, and a mouth in his chest. He says release will come
    when Rāma cuts off his arms and burns his body. Rāma explains that Rāvaṇ has carried
    away his Maithil spouse and asks Danu for knowledge in exchange for funeral rites.
    Danu says his knowledge is limited until the body is burned, but promises afterward
    to identify one who knows the robber and will aid Rāma as a faithful ally.
  language: English
  quote_policy: summarized
