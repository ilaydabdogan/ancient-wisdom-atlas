  quote: envoyez-lui quatre fils, qui soient vantés dans les trois mondes!
  summary: Rishyaçringa announces and performs another sacrifice for the king so that
    heaven may grant the desired children. A divine assembly has come to receive shares
    of the offering. Rishyaçringa petitions the gods for King Daçaratha, who is without
    sons, and asks them to send four sons. The gods answer favorably and say the king
    will obtain his desired reward for the sacrifices.
