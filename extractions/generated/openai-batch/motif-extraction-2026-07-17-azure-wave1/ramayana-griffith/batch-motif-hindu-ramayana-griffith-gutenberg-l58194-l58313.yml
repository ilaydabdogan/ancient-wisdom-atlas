canonical_text:
  quote: ''
  summary: The passage opens with a critical note rejecting earlier false parallels
    between Christianity and Brahmanical religion. It then introduces the story of
    Sítá’s banishment and the birth of Kuśa and Lava in Válmíki’s hermitage. In the
    excerpt, Sítá asks to revisit sacred groves by the Gangá; Ráma promises to grant
    the request. After hearing from Bhadra that the people praise him except for accepting
    back his abducted wife, Ráma resolves to banish Sítá for the sake of public honor,
    though he declares her spotless. He instructs Lakshmaṇ to take her to Válmíki’s
    grove and leave her there. Sítá trustingly departs in the chariot, notices an
    ominous throbbing of her right eye, and prays that no harm come to Ráma or his
    brothers.
  language: English
  quote_policy: summarized
