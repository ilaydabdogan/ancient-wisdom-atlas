canonical_text:
  quote: ''
  summary: Kabandha, restored to a bright form, directs Ráma toward Sugríva. Ráma
    and Lakshmaṇ travel to Pampá and reach Śavarí’s hermitage, where she receives
    them with reverence, water, and prepared fruits. Śavarí recounts a prophecy from
    her ascetic masters that Ráma would visit and she would then pass to deathless
    worlds. She shows the brothers Matanga’s grove, where ascetic power preserves
    altar light, lakes, wet garments, and fresh flowers. With Ráma’s consent she casts
    off her mortal body in flame and rises to a heavenly sphere of saints.
  language: English
  quote_policy: summarized
