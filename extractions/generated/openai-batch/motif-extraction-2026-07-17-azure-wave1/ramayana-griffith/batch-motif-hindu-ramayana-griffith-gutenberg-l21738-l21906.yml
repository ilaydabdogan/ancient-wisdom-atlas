canonical_text:
  quote: ''
  summary: Bharat departs at dawn with queens, priests, lords, soldiers, townspeople,
    artisans, and other subjects to seek Ráma and Lakshmaṇ in banishment. The procession
    reaches the Ganges at Śringavera, where Bharat orders a halt, plans to cross the
    river after rest, and wishes to pour funeral water for his father. Guha, Ráma’s
    ally and ruler of the Nishádas, sees Bharat’s vast army and suspects hostile intent
    against Ráma. He orders defensive preparations along the river but allows that
    Bharat may cross if he has no guilty purpose. Guha then approaches Bharat with
    gifts of honey, meat, and fish, and Bharat’s charioteer advises receiving him
    because he may know where Ráma and Lakshmaṇ dwell.
  language: English
  quote_policy: summarized
