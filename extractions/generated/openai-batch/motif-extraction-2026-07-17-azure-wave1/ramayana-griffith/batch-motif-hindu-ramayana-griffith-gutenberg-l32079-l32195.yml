canonical_text:
  quote: ''
  summary: Rama tells Lakshmana that Sita longs for a wondrous, jewel-bright deer.
    He describes the deer’s extraordinary beauty, says he will hunt it and bring Sita
    its golden hide, and adds that if Lakshmana’s fear is right and the deer is Maricha
    in disguise, he will kill Maricha. Rama recalls Vatapi’s magical trick against
    saints and Agastya’s defeat of him as an analogy, then orders Lakshmana to guard
    Sita carefully with Jatayus’s aid while he goes after the deer.
  language: English
  quote_policy: summarized
