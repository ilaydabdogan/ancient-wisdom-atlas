canonical_text:
  quote: ''
  summary: Ráma calms Lakshmaṇ’s anger and argues that Bharat comes without hostile
    intent. He rejects kingship won by harming kin and affirms obedience to his father’s
    will and care for his brothers. Lakshmaṇ becomes ashamed and descends from a tree.
    Bharat’s army encamps near the mountain; Bharat organizes a search with Śatrughna,
    Guha, hunters, elders, priests, lords, and citizens. Bharat longs to see Ráma,
    honor his feet, and restore him to the hereditary throne. He sees smoke and flame
    from Ráma’s hermit hut and advances with Guha.
  language: English
