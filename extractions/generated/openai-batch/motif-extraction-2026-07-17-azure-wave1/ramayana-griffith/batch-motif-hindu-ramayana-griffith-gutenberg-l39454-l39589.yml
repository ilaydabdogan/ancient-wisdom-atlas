canonical_text:
  quote: ''
  summary: Bāli comes out to meet Sugrīva, and the two exchange threats and fight
    violently. Sugrīva wounds Bāli with an uprooted Sāl tree, but then weakens. Rāma
    sees Sugrīva failing and shoots an arrow that pierces Bāli’s breast. Bāli falls,
    still adorned with a divine golden chain that preserves his life and beauty; the
    shaft is said to bring bliss and light the way to Brahmā’s worlds. Rāma and Lakṣmaṇa
    approach the fallen Bāli, who begins to address Rāma.
  language: English
