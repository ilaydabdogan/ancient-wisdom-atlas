canonical_text:
  quote: ''
  summary: Sítá, held by Rávaṇ in Lanká, defiantly rejects him, praises Ráma and Lakshmaṇ,
    predicts Rávaṇ’s destruction, and asserts her fidelity. Rávaṇ threatens to have
    her killed and eaten if she refuses him after twelve months, then orders Rákshas
    women to confine and watch her in the Aśoka garden. She is led there in grief
    and fear. The passage ends by introducing Indra’s joy and the Eternal Sire addressing
    him.
  language: English
