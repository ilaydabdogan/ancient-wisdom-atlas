candidate_motifs:
- id: motif:1
  label: creation from primordial waters
  taxonomy_refs:
  - chaos
  basis: The passage begins the world account with only water present, then earth
    forms and Brahmá emerges with the Gods.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The available taxonomy has no exact primordial-water creation category;
    the broader chaos family is used for an undifferentiated pre-earth state.
- id: motif:2
  label: creator in animal form raises the earth
  taxonomy_refs:
  - shapeshifter
  basis: Brahmá appears in a boar’s disguise and commands the earth to arise from
    the deep.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage says “boar’s disguise,” not an explicit transformation process.
- id: motif:3
  label: divine and ancestral genealogy legitimizes kingship
  taxonomy_refs:
  - royal_legitimacy
  basis: Vaśishṭha traces Ráma’s line from Brahmá through Manu and Ikshváku to Daśaratha
    and then uses that lineage to argue that Ráma should take the throne.
  evidence_refs:
  - ev:3
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage functions as a succession argument; broader political or ritual
    details outside the excerpt are not used.
- id: motif:4
  label: eldest-son succession rule
  taxonomy_refs:
  - royal_legitimacy
  basis: Vaśishṭha states that in Ikshváku’s race the eldest takes the father’s place
    and no other son is consecrated while he lives.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a stated dynastic rule in the passage, not a universal claim beyond
    it.
- id: motif:5
  label: promised child survives a poisoned pregnancy and preserves the line
  taxonomy_refs:
  - miraculous_child
  basis: Kálindí prays to Chyavan, receives a prophecy of a glorious son who will
    uphold the ancient race, and bears Sagar despite the rival’s poison plot.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage gives a sage’s prophecy and failed poison plot, but does not
    describe divine conception.
- id: motif:6
  label: truth rewarded by bodily ascent
  taxonomy_refs:
