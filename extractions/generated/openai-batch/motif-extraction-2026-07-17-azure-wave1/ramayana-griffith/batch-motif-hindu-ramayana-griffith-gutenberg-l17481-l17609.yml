canonical_text:
  quote: ''
  summary: Sumantra laments being ordered back to Ayodhya without Ráma and begs to
    share his exile. Ráma explains that Sumantra must return so Kaikeyí will accept
    that the banishment has occurred and Bharat may reign securely. Ráma then asks
    Guha for fig-tree juice to form matted locks, and Ráma and Lakshmaṇ take on bark
    garments and ascetic hair. Ráma counsels Guha to guard his realm carefully.
  language: English
