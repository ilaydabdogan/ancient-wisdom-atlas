  summary: A Vánar approaches and observes Lanká, a richly adorned and strongly defended
    city ruled by Rávaṇ. He reflects that direct assault, guile, bribery, or dissension
    will not easily win the city, and resolves to continue his search for the captive
    Sítá, the Maithil queen. To enter unseen, he plans a deceptive form and, after
    sunset, shrinks to the size of a cat and enters the city by moonlight.
