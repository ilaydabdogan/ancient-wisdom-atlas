canonical_text:
  quote: ''
  summary: Rama, Sugriva, Lakshman, and Vanar allies travel from Rishyamuka toward
    Kishkindha, where Bali rules. Along the way they pass a rich woodland landscape
    and a sacred grove associated with seven ascetics. Sugriva describes the ascetics’
    austerities, heavenly departure, the grove’s dangerous sanctity, its sounds, fragrances,
    and ritual fires, then instructs Rama and Lakshman to honor the Seven. The brothers
    bow and the party proceeds to Kishkindha’s gate ready for combat with Bali.
  language: English
  quote_policy: summarized
