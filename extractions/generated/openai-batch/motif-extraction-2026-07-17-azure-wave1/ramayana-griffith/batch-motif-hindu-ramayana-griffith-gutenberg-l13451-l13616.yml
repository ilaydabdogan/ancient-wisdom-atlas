  quote: ''
  summary: After Rama speaks, Lakshman reacts with visible anger and delivers a vehement
    speech. He rejects Rama's submission to duty and Fate, accuses Kaikeyi and the
    king of deceit over the succession, argues that human effort can overcome Fate,
    and vows to defend Rama's right to consecration and rule by force if necessary.
  language: English
