canonical_text:
  quote: ''
  summary: Lakshman affirms that he will obey his father's orders and follow duty.
    Kausalya laments Rama's banishment to the forest, asks to follow him, and compares
    her grief to fire and a cow following its young. Rama refuses her request, tells
    her to obey and comfort the aged king, says he will spend fourteen years in the
    wilds and return, and instructs her to perform offerings. Kausalya accepts that
    Fate cannot be resisted and blesses Rama as he leaves for exile.
  language: English
  quote_policy: summarized
