canonical_text:
  quote: ''
  summary: Before dawn and an intended march, heralds and bards praise Bharat with
    royal music. Bharat stops the sounds, denies that he is king, laments his father's
    death, blames Kaikeyí, and speaks of an absent lord exiled to the forest. Women
    weep. Vaśishṭha enters the assembly hall, sits on a golden seat, and orders messengers
    to gather royal, priestly, military, and virtuous persons. The people come with
    vehicles and animals, welcome Bharat, and the assembly is described as shining
    with Bharat's kingly face as if Daśaratha were present.
  language: English
  quote_policy: summarized
