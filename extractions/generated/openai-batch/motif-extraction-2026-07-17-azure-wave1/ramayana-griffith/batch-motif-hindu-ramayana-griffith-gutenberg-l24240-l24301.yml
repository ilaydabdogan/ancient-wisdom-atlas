canonical_text:
  quote: ''
  summary: Ráma retraces his path up the mountain to his cottage and embraces his
    brothers. Sítá and the brothers weep loudly, and Bharat’s army understands the
    cries as grief for the dead king. Followers rush toward Ráma, causing a great
    tumult that frightens elephants, forest animals, and birds. The crowd finds the
    chief on his sacrificial ground, curses the hump-back and queen, and approaches
    him tearfully; he embraces loved ones, honors friends, and the heroes’ lament
    fills the landscape.
  language: English
  quote_policy: summarized
