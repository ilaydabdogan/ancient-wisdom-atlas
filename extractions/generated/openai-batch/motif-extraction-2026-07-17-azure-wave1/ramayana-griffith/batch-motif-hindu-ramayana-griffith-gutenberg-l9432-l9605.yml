canonical_text:
  quote: ''
  summary: Rāma answers the challenge of Jamadagni’s son, strings a mighty bow, and
    draws Vishṇu’s dart while refusing to kill him because he is a Brāhman and for
    Viśvāmitra’s sake. A celestial assembly watches. Jamadagni’s son concedes, asks
    to retain his power of movement to Mahendra, and permits Rāma’s arrow to bar the
    heavenly worlds he won by penance. The arrow flies, those worlds are barred, and
    Jamadagni’s son reverently departs. Rāma returns the bow to Varuṇa and the royal
    party proceeds to Ayodhyā, where the king, princes, queens, and brides are festively
    received. Later Daśaratha sends Bharat with Śatrughna and Yudhājit to the latter’s
    city.
  language: English
  quote_policy: summarized
