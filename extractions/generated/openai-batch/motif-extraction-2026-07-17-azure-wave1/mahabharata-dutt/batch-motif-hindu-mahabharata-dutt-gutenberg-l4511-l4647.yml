canonical_text:
  quote: ''
  summary: Bhishma declares limits on whom he will fight, including the wounded, the
    submissive, and one born female. Krishna advises Arjun to place Sikhandin, formerly
    female and divinely made a warrior, at the front so Bhishma will lay down his
    arms. Arjun objects to using deceit against the elder he loves as a father, but
    Krishna urges him to fight. In battle, Sikhandin is placed before Arjun; Bhishma
    remembers his oath, drops his weapons, and is struck down. Both sides gather around
    the dying Bhishma, who counsels Duryodhan to end the war and grant Yudhishthir
    his kingdom, but Duryodhan remains unmoved.
  language: English
  quote_policy: summarized
