canonical_text:
  quote: ''
  summary: 'Arjun refuses to fight his preceptor Drona and presses toward Jayadratha
    under a severe vow. Krishna halts to rest and tend the exhausted horses, then
    drives Arjun onward. Kuru chieftains with distinctive standards defend Jayadratha.
    As the day declines, Krishna prays and a dark cloud hides the sun, causing the
    Kuru warriors to think night has ended the fighting. They slacken their guard,
    and Arjun breaks through and kills Jayadratha before sunset. Night fighting follows:
    Bhima kills many of Duryodhan''s brothers, Karna kills Ghatotkacha, and Duryodhan
    later laments to Drona that the Kuru chiefs and his brothers have fallen.'
  language: English
  quote_policy: summarized
