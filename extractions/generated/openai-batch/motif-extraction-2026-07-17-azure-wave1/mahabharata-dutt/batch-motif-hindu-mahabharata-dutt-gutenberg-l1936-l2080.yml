canonical_text:
  quote: '"This your exile, good Yudhishthir, is ordained to serve your weal, / Is
    a trial and _samadhi_, for it chastens but to heal!"'
  summary: Draupadi receives boons from Dhrita-rashtra that free Pandava warriors
    from slavery and refuses to ask for more. Yudhishthir, deprived of empire, departs
    for exile with Draupadi and his brothers. Vidura arranges for Pritha to stay behind,
    blesses the exiles, and frames the exile as a chastening trial that will lead
    to virtue, renewed strength, and eventual return. Pritha laments and blesses Draupadi
    before Draupadi enters the forest path.
  language: English
  quote_policy: quoted
