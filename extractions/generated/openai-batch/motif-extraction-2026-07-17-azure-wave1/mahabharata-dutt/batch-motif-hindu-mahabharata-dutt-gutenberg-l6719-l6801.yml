canonical_text:
  quote: ''
  summary: 'The conclusion summarizes post-war episodes: Dhrita-rashtra, Gandhari,
    and Pritha retire to the forest, where Dhrita-rashtra sees the spirits of slain
    warriors before the three die in a forest fire. Krishna and Valadeva die after
    disorders among the Vrishnis and Andhakas, and Dwarka is swallowed by the ocean.
    The Pandavas appoint Prakshit, withdraw toward the Himalayas, and most die along
    the way. Yudhishthir alone reaches heaven in a celestial car, undergoes a trial,
    bathes in the celestial Ganges, receives a celestial body, and meets Krishna and
    other dead kin and warriors in heavenly form as Indra identifies them.'
  language: English
  quote_policy: summarized
