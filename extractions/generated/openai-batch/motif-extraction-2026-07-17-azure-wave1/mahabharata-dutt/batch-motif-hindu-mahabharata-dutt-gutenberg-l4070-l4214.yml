  summary: 'The passage describes successive battle episodes: Bhishma routs Pandav
    forces; Arjun, aided by Krishna, later terrifies and routs the Kurus; Dhrista-dyumna,
    Drona, Bhima, Kalinga leaders, Abhimanyu, and Lakshman appear in combat; Duryodhan
    accuses Bhishma of half-hearted loyalty; Bhishma replies that Duryodhan is doomed
    because of unrighteous acts against Yudhishthir, his wife, and the Pandavs, then
    returns to the battle.'
