candidate_motifs:
- id: motif:1
  label: divine judgment on an unrighteous ruler
  taxonomy_refs:
  - divine_judgment
  basis: Bhishma says Duryodhan is doomed by righteous Heaven because of unholy deeds,
    wrongs against Yudhishthir's wife, theft of the kingdom, plots against Yudhishthir,
    and ignored counsel.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The doom is stated in Bhishma's speech; the passage does not depict a
    direct visible divine intervention.
- id: motif:2
  label: ignored wisdom before ruin
  taxonomy_refs:
  - wisdom
  basis: Bhishma calls Duryodhan deaf to wisdom, parents, and kin, and says saintly
    Krishna's holy counsel was given vainly.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage summarizes the counsel only indirectly through Bhishma's accusation.
- id: motif:3
  label: violated royal legitimacy through stolen kingdom
  taxonomy_refs:
  - royal_legitimacy
  basis: Bhishma names the kingdom stolen from Yudhishthir among the wrongs that make
    Duryodhan's cause unrighteous.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage identifies the theft and moral consequence but does not narrate
    restoration of kingship within this excerpt.
