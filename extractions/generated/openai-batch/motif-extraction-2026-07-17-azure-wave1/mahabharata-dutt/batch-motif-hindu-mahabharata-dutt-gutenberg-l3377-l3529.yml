canonical_text:
  quote: ''
  summary: After Yudhishthir's exile expires, he seeks restoration of Indra-prastha.
    Duryodhan refuses despite elder counsel, and both sides move toward war. In Virata's
    council, Krishna urges peace and a righteous envoy; Valadeva also advises sending
    an envoy but urges humility toward Duryodhan; Satyaki angrily rebukes Valadeva
    and defends Yudhishthir.
