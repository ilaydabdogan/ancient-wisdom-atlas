  cautions: The passage gives brief parentage statements rather than birth narratives.
- id: motif:2
  label: public martial trial of princes
  taxonomy_refs:
  - initiation
  basis: Drona trains the princes and arranges a public royal tournament in which
    they demonstrate weapons, riding, archery, and mock combat.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: medium
  cautions: The passage calls this a tournament and demonstration; it does not explicitly
    describe a rite of passage.
- id: motif:3
  label: heroic rivalry
  taxonomy_refs:
  - duality
  basis: Karna appears as a warrior of unknown origin and is described as a worthy
    rival of Arjun; the prose introduction identifies their rivalry as a leading thought
    of the epic.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The taxonomy reference is broad; the passage presents rivalry more directly
    than metaphysical duality.
- id: motif:4
  label: twin sons linked to divine twins
