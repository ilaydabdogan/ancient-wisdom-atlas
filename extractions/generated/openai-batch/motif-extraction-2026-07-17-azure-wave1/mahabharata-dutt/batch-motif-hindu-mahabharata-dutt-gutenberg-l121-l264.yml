  quote: ''
  summary: Introductory prose identifies the Kuru setting, the family relationship
    between Pandu and Dhrita-rashtra, the principal Pandava brothers, Duryodhan, Karna,
    and their divine parentage. The verse passage describes Drona arranging a royal
    tournament at Hastina, the preparation of a ritually marked arena, the gathering
    of rulers, women, priests, warriors, and townspeople, and the armed display of
    the princes.
  language: English
  quote_policy: summarized
