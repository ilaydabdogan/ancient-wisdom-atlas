canonical_text:
  quote: ''
  summary: 'The passage describes Yudhishthir''s aswa-medha rite: animals and the
    sacrificial horse are prepared and offered; celestial beings, sages, priests,
    Draupadi, Krishna, Vyasa, Yudhishthir''s brothers, and monarchs are present; gifts
    are distributed; Vyasa returns Yudhishthir''s gift of the kingdom and instructs
    him to rule; the rite and ablution cleanse Yudhishthir''s sins; departing kings
    bless him; Krishna leaves for Dwarka.'
  language: English
  quote_policy: summarized
