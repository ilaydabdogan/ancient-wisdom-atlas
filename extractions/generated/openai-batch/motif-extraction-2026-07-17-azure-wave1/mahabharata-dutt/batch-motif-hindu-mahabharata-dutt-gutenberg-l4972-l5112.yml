canonical_text:
  quote: ''
  summary: Abhimanyu, wounded and outnumbered, makes a final rush and falls. Arjun
    returns with Krishna, senses ominous silence, learns from Yudhishthir that Jayadratha
    and Kuru chieftains killed his son, grieves, and vows to slay Jayadratha before
    the next sunset or die on a flaming pyre. Subhadra and other women lament Abhimanyu.
    At morning Arjun blows his sankha and, driven by Krishna, presses through Kuru
    forces toward the slayer, avoiding battle with Drona.
  language: English
  quote_policy: summarized
