  quote: ''
  summary: In the cattle-recovery episode, Arjun, disguised as Brihannala, arranges
    through Draupadi to serve as Uttara's charioteer. Uttara doubts him, but Arjun
    leads him to a sami tree where the Pandavas' weapons are hidden in corpse-like
    wrappings. Uttara unwraps the arms, marvels at their markings, and Arjun identifies
    Gandiva and other weapons as belonging to himself and his brothers.
  language: English
