canonical_text:
  quote: "“Then unto the pathless jungle turned their steps with bitter sigh!”"
  summary: Draupadi and Pritha weep as Pritha’s children, dressed in deer-skin, prepare
    to depart for the forest. Pritha laments their undeserved suffering, recalls Pandu
    and Madri in the sky, appeals to divine and human helpers, asks that at least
    Sahadeva remain, and is then consoled as the children leave. Kuru women mourn,
    and Dhritarashtra is troubled by forebodings.
  language: English
  quote_policy: quoted
