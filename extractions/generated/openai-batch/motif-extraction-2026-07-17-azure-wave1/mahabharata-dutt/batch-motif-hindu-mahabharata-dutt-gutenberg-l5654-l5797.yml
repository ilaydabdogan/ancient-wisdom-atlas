canonical_text:
  quote: ''
  summary: 'Arjun apologizes to Yudhishthir for drawing his sword after being told
    to yield Gandiva; Yudhishthir forgives him and admits his own hasty anger. Arjun
    then rides with Krishna into battle against Karna. In their duel, both invoke
    rules of war when disabled: Arjun after his bowstring breaks, Karna after his
    chariot wheel sinks. Krishna rejects Karna''s appeal by recounting prior wrongs.
    Karna wounds Arjun, but Arjun recovers, remembers Abhimanyu, and kills Karna.
    Afterward Kripa laments the leaderless Kuru forces and urges Duryodhan to end
    the battle.'
  language: English
  quote_policy: summarized
