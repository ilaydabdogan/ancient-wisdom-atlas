canonical_text:
  quote: ''
  summary: Duryodhan challenges Drona over Kuru losses and suggests Karna replace
    him. Drona rebukes Duryodhan, praises Arjun, and says Heaven has willed that either
    Arjun or Drona die that day. At sunrise warriors worship with joined hands and
    mantras, then return to battle. Drona devastates the Pandav and Panchala forces,
    killing Drupad's grandsons and later Drupad and Virata. Bhima kills an elephant
    named Aswa-thaman, and a garbled report reaches Drona that his son Aswa-thaman
    is dead. Yudhishthir truthfully says the elephant named Aswa-thaman is dead, but
    Drona hears only part of the statement. Dhrista-dyumna then kills Drona; the Kurus
    flee, and Arjun mourns his teacher.
  language: English
  quote_policy: summarized
