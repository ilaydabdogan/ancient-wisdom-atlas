canonical_text:
  quote: ''
  summary: Duryodhan, jealous after Yudhishthir's imperial sacrifice, plots with Sakuni,
    who is skilled with false dice. Yudhishthir accepts a gambling challenge and loses
    wealth, empire, brothers, himself, and Draupadi. Duryodhan claims Draupadi as
    a slave. Draupadi disputes the claim, arguing that a man already enslaved cannot
    stake his wife. Duryodhan orders Duhsasan to bring her to the council hall; Duhsasan
    insults her, seizes her by the hair, and drags her there. Draupadi appeals to
    the elders, invokes sacred law and the sanctity of a woman's hair, and warns of
    divine wrath.
  language: English
  quote_policy: summarized
