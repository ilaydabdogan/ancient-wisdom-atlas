canonical_text:
  quote: ''
  summary: Salya, king of Madra, drives Karna's horses and taunts him by predicting
    Arjun's approach. Karna attacks Yudhishthir; Yudhishthir wounds him, but Karna
    recovers, destroys Yudhishthir's armor, standard, chariot, and horses, then spares
    and insults him. Yudhishthir retreats to his tent and rebukes Arjun for not yet
    killing Karna. After Krishna explains Arjun's absence and vow, Yudhishthir further
    insults Arjun and tells him to give up Gandiva and his warrior equipment. Arjun
    angrily draws his sword against his elder, but Krishna restrains him, invokes
    sacred duty and respect for the elder, and Arjun obeys with tears.
  language: English
  quote_policy: summarized
