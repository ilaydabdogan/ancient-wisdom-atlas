canonical_text:
  quote: ''
  summary: Karna enters the arena, repeats Arjun's feats, and challenges him. Duryodhan
    welcomes Karna and later has him anointed king of Anga so that he may stand as
    a princely rival. Celestial and factional alignments frame the impending duel.
    Pritha silently grieves because Karna is her eldest son. A chariot-driver arrives
    and hails Karna as his son; Bhima insults Karna over this association, and Duryodhan
    defends warrior merit over birth.
  language: English
  quote_policy: summarized
