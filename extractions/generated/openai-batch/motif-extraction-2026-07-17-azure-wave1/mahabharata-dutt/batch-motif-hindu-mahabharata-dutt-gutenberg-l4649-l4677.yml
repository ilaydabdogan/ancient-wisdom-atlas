canonical_text:
  quote: ''
  summary: At gloomy midnight, the dying Bhishma lies alone on a bed of arrows. Karna
    comes to him, and Bhishma speaks with affection and sorrow. Bhishma tells Karna
    that pride and envy caused their discord, reveals that Karna is Pritha's son and
    that the Sun inspired his birth, explains that Pritha abandoned him and a driver
    raised him, and urges him not to fight his brother Arjun. The narrator states
    that Bhishma's warning is vain because hatred awakens in Karna.
