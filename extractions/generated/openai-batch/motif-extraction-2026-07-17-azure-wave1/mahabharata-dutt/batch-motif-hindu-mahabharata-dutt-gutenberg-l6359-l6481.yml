canonical_text:
  quote: ''
  summary: 'The passage introduces the Aswa-medha, or Sacrifice of the Horse, after
    the war and funerals. Bhishma is summarized as instructing Yudhishthir from his
    deathbed; after Bhishma''s death and cremation, Krishna is summarized as teaching
    Arjun. Yudhishthir, crowned at Hastinapura and troubled by guilt over the war,
    is advised by Vyasa to perform the horse sacrifice for expiation. The passage
    explains the royal custom: a horse wanders under guard; if detained, war follows,
    and if unrestrained, the owner receives tacit submission; on return, the horse
    is sacrificed at a feast. In the narrative opening, Arjun returns victorious with
    the sacred charger, minstrels announce his triumphs, and Yudhishthir orders Bhima
    and Veda-versed Brahmans to prepare a decorated sacrificial site.'
  language: English
  quote_policy: summarized
