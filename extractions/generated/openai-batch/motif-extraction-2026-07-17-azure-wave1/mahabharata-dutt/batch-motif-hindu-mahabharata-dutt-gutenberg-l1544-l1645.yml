canonical_text:
  quote: Brahmans sprinkled holy water on the empire's righteous lord
  summary: The passage describes rites for the slain Chedi monarch and the installation
    of his son, the completion of Yudhishthir's rajasuya sacrifice, public recognition
    of Yudhishthir as emperor, the formal departure of visiting monarchs, and Krishna's
    leave-taking from Yudhishthir, Pritha, Draupadi, and Subhadra before returning
    to Dwarka. Krishna departs in a falcon-bannered chariot and gives Yudhishthir
    counsel on watchful, compassionate kingship.
  language: English
