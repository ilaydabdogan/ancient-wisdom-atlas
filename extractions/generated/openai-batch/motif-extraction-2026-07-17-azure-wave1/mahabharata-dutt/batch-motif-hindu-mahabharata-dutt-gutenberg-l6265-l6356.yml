canonical_text:
  quote: '"Offer unto him oblation, Karna was my eldest son!"'
  summary: Mourners gather on the banks of the Ganga and offer sacred water to slain
    kin. Pritha reveals to her children that Karna, killed by Arjun and thought to
    be of another lineage, was actually her eldest son and Sun-inspired in birth.
    The Pandav brothers grieve; Yudhishthir laments the concealed kinship and offers
    water oblation to Karna. Karna's widow and women of his house also mourn and offer
    oblations. After rites and ablutions, the survivors return toward Hastina in sorrow.
  language: English
  quote_policy: quoted
