canonical_text:
  quote: Where he leads she ever follows, be it death or be it life!
  summary: Savitri follows Yama after her husband Satyavan’s death, speaks of the
    inseparability of faithful wife and husband, and obtains boons restoring her father-in-law’s
    kingdom and ensuring sons for herself and Satyavan. Yama grants that Satyavan
    will live again. Savitri returns to the forest, revives Satyavan, and the two
    prepare to return home through the dark jungle.
  language: English
  quote_policy: quoted
