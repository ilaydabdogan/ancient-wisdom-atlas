canonical_text:
  quote: ''
  summary: Yudhishthir prepares and performs the Rajasuya rite with the aid of relatives,
    priests, kings, and attendants. He distributes duties, receives tribute, feeds
    guests, makes offerings, and undergoes the abhisheka. Narad perceives the assembled
    kings as divine portions and Krishna as Narayana. Bhishma then instructs Yudhishthir
    on the arghya and declares Krishna the most worthy recipient of foremost honor.
  language: English
