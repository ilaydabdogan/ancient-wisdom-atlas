canonical_text:
  quote: ''
  summary: At a public martial exhibition, Bhima and Duryodhan engage in a mace contest
    that excites rival factions in the crowd until Drona halts it. Drona summons Arjun,
    who performs a rite to the gods, enters in golden armor, is acclaimed by the people,
    and demonstrates mastery of weapons and archery. Pritha reacts maternally to the
    acclaim, while Vidura explains the scene to the sightless Kuru monarch. As the
    exhibition ends, Karna arrives dramatically as an unknown warrior, described as
    Pritha's pre-marital son of solar origin, and challenges Arjun, though the two
    are unaware of their kinship.
  language: English
  quote_policy: summarized
