canonical_text:
  quote: '"no farther living creature may with monarch YAMA go!"'
  summary: Savitri obtains permission to accompany her husband Satyavan into the forest.
    Satyavan gathers fruit and fuel, becomes ill, rests his head on Savitri's lap,
    and dies. Yama appears, identifies himself as lord of the dead, draws Satyavan's
    thumb-sized vital spark from the body with a noose, and goes southward. Savitri
    follows him, argues from wifely devotion and sacred law, and Yama grants her a
    boon for her blind father-in-law while forbidding her to follow farther.
  language: English
  quote_policy: quoted
