canonical_text:
  quote: ''
  summary: In the Kuru assembly, Draupadi reproaches silent chiefs and elders for
    failing to defend an outraged wife and queen. Karna argues that Yudhishthir lost
    Draupadi in the dice game and that she should serve the Kuru princes. Bhima, constrained
    by bondage and Yudhishthir's pledge, reproaches Yudhishthir and vows to break
    Duryodhan's knee after Duryodhan attempts to disgrace Draupadi. Ominous jackal
    and raven cries are heard in the sacred chamber where sacrificial fire rites are
    being performed. Dhritarashtra, fearful of wrath and destruction, rebukes Duryodhan,
    asks Draupadi's pardon, offers her a boon, and Draupadi asks that Yudhishthir
    be freed from bondage so her son is not the son of a slave.
  language: English
  quote_policy: summarized
