canonical_text:
  quote: ''
  summary: 'The passage narrates several phases of battle: Pandav forces are routed;
    Krishna attempts to leave his role as Arjun''s charioteer and fight with his discus,
    but Arjun restrains him and vows to fight. Arjun drives back opponents, but the
    battle continues through nightfall. In later fighting, Bhima wounds Duryodhan
    and Salya and kills eight of Duryodhan''s fourteen brothers. Lakshman is wounded
    while fighting Abhimanyu; ten sons of Satyaki are slain by Bhuri-sravas. Bhima
    is surrounded and rescued by Drupad, Abhimanyu, and other chiefs. Finally Bhishma''s
    power routs the Pandavs again, bringing down Yudhishthir''s standard and horses.'
  language: English
  quote_policy: summarized
