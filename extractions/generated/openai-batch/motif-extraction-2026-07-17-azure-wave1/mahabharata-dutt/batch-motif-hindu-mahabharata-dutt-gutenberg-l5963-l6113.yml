canonical_text:
  quote: ''
  summary: Book XI, titled Sraddha or Funeral Rites, opens after Duryodhan's death.
    Dhrita-rashtra summons Gandhari and the Kuru women to the battlefield. The royal
    women, widows, and citizens leave Hastina in public mourning. On the corpse-strewn
    battlefield, Gandhari laments to Krishna over the slain warriors and finally sees
    her son Duryodhan, whereupon she collapses in grief.
  language: English
  quote_policy: summarized
