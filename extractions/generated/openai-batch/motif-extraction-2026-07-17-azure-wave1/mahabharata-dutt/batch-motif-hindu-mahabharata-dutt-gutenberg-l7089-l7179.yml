canonical_text:
  quote: ''
  summary: The translator’s epilogue contrasts the plain grandeur of the Maha-bharata
    with later ornate Sanskrit poetry, praises its distinct character portraiture,
    names major male and female figures with brief attributes, and summarizes memorable
    incidents from tournament and bridal scenes through war, funerals, and Yudhishthir’s
    horse-sacrifice.
  language: English
  quote_policy: summarized
