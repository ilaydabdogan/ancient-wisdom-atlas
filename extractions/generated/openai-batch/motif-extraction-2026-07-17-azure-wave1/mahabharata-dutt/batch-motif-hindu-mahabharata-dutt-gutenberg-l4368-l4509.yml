canonical_text:
  quote: ''
  summary: 'The passage narrates episodes in the Kurukshetra battle: Iravat, son of
    Arjun and a Naga princess, defeats several Gandhara princes but is killed by Alumbusha.
    Arjun mourns his son and calls for vengeance, while Bhima also avenges him. At
    night Duryodhan, grieving losses, petitions Bhishma to save the Kuru royal race;
    Bhishma counsels that the righteous side will prevail, recalls Arjun’s past deeds,
    notes Krishna’s presence with Arjun, and says he will still fulfill his duty.
    Bhishma then routs the Pandavs. Yudhishthir laments the carnage, proposes withdrawal
    to the woods, and the Pandav chiefs go to Bhishma to seek mercy, though Bhishma
    remains bound by his pledge to Duryodhan.'
  language: English
  quote_policy: summarized
