canonical_text:
  quote: ''
  summary: The passage introduces Book X, in which Karna becomes leader of the Kuru
    forces after Drona's death and the long-awaited contest between Karna and Arjun
    begins. Duryodhan appoints and praises Karna, priests consecrate him with sacred
    rites, and Karna leads the Kurus into battle. Karna and Arjun meet amid destructive
    warfare but part undecided at evening. On the following morning Karna declares
    that either he or Arjun must die, compares their weapons and skills, identifies
    Krishna's charioteering as Arjun's advantage, requests Salya as his own charioteer,
    and offers rewards for anyone who points out Arjun on the battlefield.
