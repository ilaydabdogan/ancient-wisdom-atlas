canonical_text:
  quote: ''
  summary: After failed negotiations over partition of the Kuru kingdom, the armies
    of Duryodhan and Yudhishthir prepare for battle. Krishna serves Yudhishthir as
    friend and adviser and Arjun as charioteer, and instructs the unwilling Arjun
    in duty. Bhishma commands Duryodhan's forces. At dawn the battle begins with many
    named duels and widespread slaughter. Bhishma routs the Pandav forces; Abhimanyu
    checks him briefly and cuts down his palm-tree standard, but is struck down. Matsya
    princes attempt rescue and fall, and Arjun comes to oppose Bhishma and save Sankha.
  language: English
  quote_policy: summarized
