canonical_text:
  quote: ''
  summary: The Prayer-Maiden grants King Aswapati a boon of offspring after his penance
    and sacrifices, saying Swaymbhu wills that a noble daughter be born in his line.
    Aswapati returns home; his queen conceives and bears a girl named Savitri after
    the Prayer-Maiden. Savitri grows in beauty, is regarded as goddess-like, and has
    no suitor. At her father's direction she departs to choose a husband, traveling
    with attendants through forests, hermitages, and sacred bathing places while giving
    food and wealth. She returns to her father's court, where the rishi Narad is present,
    and names Satyavan, son of the blind dispossessed forest-dwelling king Dyumat-sena,
    as her chosen husband. Narad warns that disaster awaits if she marries Satyavan,
    though he praises Satyavan's truthfulness and virtues.
  language: English
  quote_policy: summarized
