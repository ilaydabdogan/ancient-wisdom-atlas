canonical_text:
  quote: ''
  summary: A speaker declares knowledge of Bhima and his brothers' divine-linked lineage,
    praises Karna as a lordly warrior destined for rule, and challenges dissenters
    to combat. The crowd applauds as evening falls; Duryodhan leaves with Karna, while
    Pandu's sons and elders depart silently. Spectators disagree over the winner.
    Pritha secretly recognizes Karna as her son at his crowning as king of Anga. Duryodhan
    takes Karna to his side, and Yudhishthir judges Karna mightier than Arjun.
  language: English
