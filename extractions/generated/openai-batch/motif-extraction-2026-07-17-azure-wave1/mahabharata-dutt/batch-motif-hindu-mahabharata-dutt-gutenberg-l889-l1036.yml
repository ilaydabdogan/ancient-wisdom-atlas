canonical_text:
  quote: ''
  summary: In a royal bride-choice contest, many suitors try and fail to string Drupad's
    bow and hit the target. Karna nearly completes the feat but Draupadi refuses to
    wed a Suta's son. Arjun, disguised among Brahmans, is debated by the Brahmans,
    ritually approaches the bow, prays to Isana, strings the weapon, shoots through
    the disc, and hits the target. Celestial signs and public praise follow. Draupadi
    garlands Arjun and gives him the bridal robe, while defeated suitors become angry
    that the bride has gone to a Brahman-born contestant.
  language: English
  quote_policy: summarized
