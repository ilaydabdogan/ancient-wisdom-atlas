canonical_text:
  quote: ''
  summary: At a royal assembly, Bhishma has Sahadeva bring the arghya to Krishna.
    Sisupala angrily disputes Krishna's precedence, naming other kings, elders, priests,
    and warriors as more fitting recipients. Krishna replies by recounting Sisupala's
    repeated offenses, including violence, sacrilege, and pursuit or violation of
    women, and says he had forgiven many offenses because of a promise to Sisupala's
    mother. When Sisupala taunts him again, Krishna kills him with an unfailing discus.
    Sisupala's soul emerges cleansed and comes to Krishna. Natural portents and mixed
    reactions follow, while rishis and Brahmans praise Krishna and Yudhishthir orders
    funeral rites and royal honors for the dead.
  language: English
  quote_policy: summarized
