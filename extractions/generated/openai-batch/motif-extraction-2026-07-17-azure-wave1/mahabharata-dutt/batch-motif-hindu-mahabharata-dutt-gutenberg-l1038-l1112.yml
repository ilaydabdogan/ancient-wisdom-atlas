canonical_text:
  quote: ''
  summary: Rejected monarchs at a swayamvara accuse Drupad of dishonoring kings and
    object to a Brahman being accepted as suitor. They threaten violence; Drupad flees
    among Brahmans. Bhima and Arjun confront the armed kings, Bhima using an uprooted
    tree and Arjun his bow. Krishna recognizes the Pandu sons beneath Brahman dress,
    recalls their escape from Duryodhan's death-by-fire plot, calms the monarchs,
    and Arjun leads the princess away by the hand.
  language: English
  quote_policy: summarized
