canonical_text:
  quote: ''
  summary: Introductory and poetic passage from the forest-exile frame of the Pandavas
    and the opening of the Savitri episode. It recounts the Pandavas' exile with Draupadi,
    divine and sage visits, Arjun's acquisition of celestial weapons, Duryodhan's
    captivity and release, Jayadratha's abduction of Draupadi and her rescue, the
    storytelling frame with Markandeya, and the beginning of King Aswapati's penance
    culminating in the goddess of savitri emerging from the altar fire.
  language: English
  quote_policy: summarized
