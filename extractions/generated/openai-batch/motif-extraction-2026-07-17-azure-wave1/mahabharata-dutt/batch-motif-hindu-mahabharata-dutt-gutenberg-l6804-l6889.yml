canonical_text:
  quote: ''
  summary: The translator's epilogue compares the Maha-bharata with the Iliad as a
    great-war epic and the Ramayana with the Odyssey as a hero-wandering epic. It
    describes the Maha-bharata as arising from bardic war traditions, becoming a cycle
    of legends and poems, being shaped into narrative form, receiving a moral purpose
    of virtue over vice, and later expanding through poetic, legal, religious, caste,
    life-stage, mythic, and Krishna-cult materials. It also notes attempts to limit
    the text by prefatory couplet counts, later interpolations beyond those limits,
    the immense size and heterogeneous contents of the printed epic, and the resulting
    difficulty of readable English verse translation.
  language: English
  quote_policy: summarized
