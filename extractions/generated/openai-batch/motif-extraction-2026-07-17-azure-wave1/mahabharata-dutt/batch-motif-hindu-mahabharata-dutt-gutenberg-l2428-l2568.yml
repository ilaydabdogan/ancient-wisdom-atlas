canonical_text:
  quote: ''
  summary: Narad praises Satyavan's virtues but foretells that he will die one year
    later. Savitri refuses to choose another husband, marries Satyavan, lives with
    him in the forest, serves his aged parents, undertakes a three-night fast as the
    predicted day arrives, performs morning rites with Fire oblations, receives blessings
    against widowhood, and asks to accompany Satyavan into the dark forest when he
    goes out with his axe.
  language: English
  quote_policy: summarized
