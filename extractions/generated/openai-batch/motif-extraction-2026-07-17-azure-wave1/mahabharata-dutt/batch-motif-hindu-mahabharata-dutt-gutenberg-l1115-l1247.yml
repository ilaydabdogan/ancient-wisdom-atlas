  summary: After Draupadi's bridal, the five sons of Pandu bring her home and, following
    their mother's unwitting command, share her as a common wife. The passage comments
    on the unusual nature of this legend, then describes the partition of the Kuru
    kingdom, the founding of Indra-prastha, Yudhishthir's decision to perform the
    Rajasuya imperial sacrifice, the submission or defeat of surrounding kings, and
    the arrival and hosting of many rulers at the sacrifice.
