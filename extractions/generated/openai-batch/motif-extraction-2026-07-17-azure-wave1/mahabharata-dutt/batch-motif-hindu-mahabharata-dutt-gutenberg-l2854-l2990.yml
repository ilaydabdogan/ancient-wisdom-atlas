- id: motif:3
  label: hidden hero under altered name and dress
  taxonomy_refs: []
  basis: Arjun, being well known, assumes the name Brihannala, changes dress and presentation,
    and teaches music and dancing inside the palace before being identified as the
    coming rescuer.
  evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  cautions: This extraction treats the disguise as a narrative motif; the passage’s
    wording is a later English translation and includes period-specific phrasing about
    gender.
- id: motif:4
  label: cattle-lifting as martial provocation
  taxonomy_refs: []
  basis: The Trigarta and Kuru forces seize a large herd from Matsya, triggering the
    cowherd’s appeal to the prince and the anticipated armed response.
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
  - ev:10
  - ev:12
  confidence: high
  cautions: Although cattle are culturally significant, this passage describes them
    primarily as valued royal livestock and does not explicitly call the theft sacred.
- id: motif:5
  label: weapons concealed in a tree and disguised as corpses
  taxonomy_refs: []
  basis: The Pandav brothers’ weapons are hidden in a tree and wrapped like human
    corpses to scare away travellers.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: This appears in introductory prose describing material that will be relevant
