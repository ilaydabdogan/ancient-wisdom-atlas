- id: motif:2
  label: concealment through disguise and humble service
  taxonomy_refs: []
  basis: The Pandavas and Draupadi survive the concealment year by taking service
    roles under altered appearances or identities in Virata’s household.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage summarizes the concealment rather than narrating all incidents
