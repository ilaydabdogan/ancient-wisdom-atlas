canonical_text:
  quote: ''
  summary: The passage closes with Savitri walking in a dark jungle under midnight
    stars and then introduces Book VI, Go-harana, on cattle-lifting. It summarizes
    the Pandavas’ exile and year of concealment in Virata’s court under disguises,
    notes a cattle raid by Trigarta and Kuru forces, and begins the episode in which
    a cowherd reports the seizure of Matsya cattle to Prince Uttara. The cowherd urges
    Uttara to recover the herd, while Uttara boasts of his prowess but says he needs
    a skilled chariot-driver.
  language: English
  quote_policy: summarized
