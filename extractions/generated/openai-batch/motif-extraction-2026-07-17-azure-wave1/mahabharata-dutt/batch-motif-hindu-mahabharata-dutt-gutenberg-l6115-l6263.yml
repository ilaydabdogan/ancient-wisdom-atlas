canonical_text:
  quote: ''
  summary: Gandhari mourns the slain Duryodhan, recalling his departure to battle,
    his royal status, his death, and the grief of his widow. Yudhishthir then orders
    funeral rites for all slain friends, kinsmen, and foes. Vidura and others gather
    pyre materials and offerings; many named and nameless dead receive cremation rites
    with libations, hymns, and lamentation. The passage closes with Dhrita-rashtra
    and Yudhishthir going to the Ganga, where Kuru women come to perform rites for
    departed chiefs.
  language: English
  quote_policy: summarized
