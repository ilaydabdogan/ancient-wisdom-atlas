canonical_text:
  quote: ''
  summary: Kripa urges Duryodhan to spare the few survivors and return Yudhishthir's
    kingdom, but Duryodhan refuses peace as too late. Yudhishthir arranges the Pandava
    forces and kills Salya in battle. Sakuni and Duryodhan's brothers are slain, and
    Duryodhan flees to a lake. The Pandavas track him; Bhima challenges him, recounts
    past wrongs, and in mace combat breaks Duryodhan's thigh. A voice resounds through
    sky and earth, creatures and heavenly Siddhas tremble, and darkness falls while
    old hatred remains.
  language: English
  quote_policy: summarized
