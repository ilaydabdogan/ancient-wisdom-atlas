canonical_text:
  quote: ''
  summary: The passage presents an interpretive discussion of the Vukub-Cakix myth,
    emphasizing its terrestrial significance. It says Vukub-Cakix and his sons are
    earth-made beings comparable to Jotuns or Titans; Xpiyacoc and Xmucane remove
    Vukub-Cakix's emerald teeth and replace them with maize grains; the author reads
    this as an allegory of removing green turf and replacing it with maize seed. The
    passage also states that divine beings place maize in Vukub-Cakix's mouth and
    links this to the Popol Vuh statement that gods gave maize to humanity and sacred
    animals brought it from heaven to earth.
