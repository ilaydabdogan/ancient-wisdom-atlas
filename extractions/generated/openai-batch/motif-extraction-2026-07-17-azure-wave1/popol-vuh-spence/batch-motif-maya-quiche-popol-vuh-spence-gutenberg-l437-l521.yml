canonical_text:
  quote: ''
  summary: Hun-Ahpu and Xbalanque are summoned to Xibalba by Hun-Came and Vukub-Came.
    With help from messengers, animals, and stratagems, they survive underworld ordeals,
    undergo death and transformation, deceive and destroy the Xibalban rulers, punish
    the underworld powers, and honor their father and uncle, who ascend as sun and
    moon while the four hundred youths become stars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hun-Came and Vukub-Came hear the brothers at play and decide to lure them
    to Xibalba as they had lured their fathers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Xmucane sends a louse to carry a message; the louse is carried through a chain
    involving a toad, a serpent, and the great bird Voc, and the message is delivered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Before departing, each brother plants a cane in the middle of the house; the
    canes are meant to show their condition by withering if fatal harm occurs.
  category: object
  evidence_refs:
  - ev:1
  - ev:9
- id: obs:4
  text: The brothers follow their fathers' route, pass the river of blood and the
    river Papuhya, and send Xan ahead to prick Xibalbans and learn which beings are
    wooden and what names others have.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: On arriving at the Xibalban court, the brothers avoid saluting mannikins,
    avoid sitting on a red-hot stone, and pass through the House of Gloom unharmed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The brothers defeat the Xibalbans in a ballgame, obtain requested flowers
    with help from ants, and survive the House of Lances by bribing the lancers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The brothers survive the House of Cold with burning pine-cones and pass through
    the House of Tigers and the House of Fire, but Hun-Ahpu is beheaded by Camazotz
    in the House of Bats.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that Hun-Ahpu's beheading does not appear to be fatal,
    though the manner of his cure is unclear, and later says the brothers emerged
    uninjured from all the ordeals.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Hun-Ahpu and Xbalanque instruct Xulu and Pacaw, lie on a funeral pile, die
    together, have their bones powdered and thrown into a river, and later reappear
    in altered forms.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: In disguise, the brothers perform acts of burning and restoring, killing and
    restoring to life; when the Xibalban rulers request the same treatment, the brothers
    kill them and do not restore them.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: After revealing their names, the brothers punish the princes of Xibalba by
    forbidding their ballgame, assigning menial tasks, and limiting their vassals
    to beasts of the forest.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Xmucane watches the canes grow green and wither according to the brothers'
    changing fortunes; the father and uncle mount to heaven as sun and moon, and the
    four hundred youths become stars.
  category: sequence
  evidence_refs:
  - ev:9
