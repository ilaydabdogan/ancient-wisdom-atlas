canonical_text:
  quote: ''
  summary: The passage is editorial commentary on the Fourth Book and on the cosmogony
    of the Popol Vuh. It describes the Fourth Book as a confused account of Kich history,
    royal genealogies, conflicts, and traditions of Toltec migration. It then discusses
    possible Christian influence, resemblance to Genesis, possible fusion of multiple
    native creation traditions, comparison with composite Peruvian cosmogony, the
    antiquity of the Popol Vuh tradition, and oral transmission among American peoples.
  language: English
