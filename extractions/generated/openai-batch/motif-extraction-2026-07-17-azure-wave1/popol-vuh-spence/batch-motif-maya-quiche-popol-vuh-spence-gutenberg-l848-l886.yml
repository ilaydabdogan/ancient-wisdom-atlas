canonical_text:
  quote: Hurakan, the winged creative power, is the wind of the tempest.
  summary: The passage gives an expository account of Hurakan as a creative tempest,
    wind, lightning, and heavenly power; notes proposed relations to Tezcatlipoca,
    Antillean origins, and the term “hurricane”; lists three lightning-associated
    demiurges assisting Hurakan; and describes Hun-Ahpu and Xbalanque as youthful
    demi-god hero figures with disputed name meanings and limited comparison to Tezcatlipoca
    and Nanahuatl.
  language: English
  quote_policy: quoted
