canonical_text:
  quote: ''
  summary: The passage is a comparative scholarly discussion of Kich, Mayan, Mexican,
    Antillean, Carib, and Toltec mythological affinities. It cautions that Kich and
    Mayan deities should not be freely identified, then discusses Xpiyacoc and Xmucane
    as a masculine-feminine creator pair, Tepeu as a generative deity who renders
    homage to Hurakan, Hurakan as an alien or Antillean deity involved in creation,
    and Gucumatz/Cucumatz as the Kich Feathered Serpent identified with Quetzalcohuatl,
    a Mexican/Toltec/Aztecan culture-hero and solar traveller figure.
  language: English
  quote_policy: summarized
