  summary: A bibliographical appendix explains that works on the Popol Vuh and Mayan-Kich
    mythology are difficult to access, divides them into more recent obtainable works
    and older Spanish colonial works, evaluates several editions and translations,
    lists related studies, and notes that some listed works illustrate the connection
    between Kich and Mayan mythologies.
