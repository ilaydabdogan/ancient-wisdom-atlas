canonical_text:
  quote: ''
  summary: A note names Ixtlilxochitl and Torquemada as authorities for the Toltec
    settlement in Yucatan and reports their claim that immigrants went to Campeachy
    and the south. A second note proposes that Xpiyacoc and Xmucane may derive from
    Gucumatz and represent male and female attributes of that god; it also links Gucumatz
    with Quetzalcohuatl, discusses a woman sitting opposite Quetzalcohuatl in papyri,
    and identifies Goddess I as a possible Mayan equivalent of Xmucane marked by a
    knotted serpent.
  language: English
  quote_policy: summarized
