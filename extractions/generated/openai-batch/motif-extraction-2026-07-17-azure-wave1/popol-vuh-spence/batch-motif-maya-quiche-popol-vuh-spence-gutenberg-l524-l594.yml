canonical_text:
  quote: ''
  summary: The passage recounts the creation of four first Kich men from maize, the
    veiling of their sight, the making of their wives, the reception of tribal gods
    at Tulan-Zuiva or Seven Caves, Tohil's provision of fire, the hardships and departure
    from Tulan, a migration through mountains and a divided sea to Hacavitz, the first
    sunrise and petrification of gods, the founding of the first Kich city, warfare
    connected with human sacrifice, miraculous aid by wasps and hornets, and the death-time
    disappearance of the first men leaving the unopened bundle called the Majesty
    Enveloped.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The gods are described as being in council in darkness concerning the creation
    of man.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Creator and Former made four perfect men wholly from yellow and white
    maize; the men are named Balam-Quitz, Balam-Agab, Mahucutah, and Iqi-Balam, and
    are said to have neither father nor mother.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Hurakan and the gods regarded the first men as too perfect and knowing too
    much, and Hurakan breathed a cloud over their eyes so that their sight became
    partially veiled.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Four women named Caha-Paluma, Choimha, Tzununiha, and Cakixa were made while
    the four men slept, and became their wives in the stated order.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The first men and women are identified as ancestors of the Kichs; ancestors
    of other peoples are also said to have been created and to have prayed for peaceable
    lives and the return of the sun.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The people set out for Tulan-Zuiva, or Seven Caves, where gods were given
    to the heads of groups: Balam-Quitz received Tohil, Balam-Agab received Avilix,
    Mahucutah received Hacavitz, and Iqi-Balam received an unnamed god not counted
    in the native mythology because he had no family.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Kichs lacked fire; Tohil, described as creator of fire, supplied it, and
    repeatedly renewed it after a mighty rain extinguished the fires in the land.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tulan is described as a place of cold, famine, and confounded speech, so that
    the first four men could no longer understand each other.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: Under Tohil's leadership the people left Tulan to seek a new dwelling, climbed
    many mountains, crossed a miraculously divided sea, and reached the mountain Hacavitz
    where they had been told they would see the sun.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The sun appeared at Hacavitz, animals and men rejoiced, and the celestial
    bodies were established, though the sun is described as weak and mirror-like.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: At sunrise the three tribal gods and gods connected with wild animals were
