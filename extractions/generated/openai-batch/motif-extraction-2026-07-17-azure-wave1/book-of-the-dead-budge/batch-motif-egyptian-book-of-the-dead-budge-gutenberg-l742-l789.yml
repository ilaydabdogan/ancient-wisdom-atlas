  summary: Thoth announces that the heart of the deceased Ani has been weighed and
    found true. The Great Company of the Gods confirms the verdict, denies Amemit
    mastery over him, and grants offerings and a dwelling in the Field of Offerings.
    The narrator explains the title “true of voice” and the identification of the
    deceased as Osiris. Horus leads Ani before Osiris, where Ani denies sin and asks
    to join the favored ones; under Osiris’s favor he becomes a sahu, or spirit-body,
    and enters the Kingdom of Osiris.
