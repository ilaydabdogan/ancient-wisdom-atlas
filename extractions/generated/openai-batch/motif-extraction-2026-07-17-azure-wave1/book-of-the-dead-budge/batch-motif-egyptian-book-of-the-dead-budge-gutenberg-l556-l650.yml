canonical_text:
  quote: ''
  summary: 'The passage describes the Judgment of Osiris in the Book of the Dead:
    the deceased enters the Hall of Maati, addresses Osiris and the Forty-Two gods,
    declares moral innocence through a series of negative confessions, and is associated
    with the weighing of the heart in scales under Anubis, with Amemit present to
    consume the hearts of the condemned.'
  language: English
  quote_policy: summarized
