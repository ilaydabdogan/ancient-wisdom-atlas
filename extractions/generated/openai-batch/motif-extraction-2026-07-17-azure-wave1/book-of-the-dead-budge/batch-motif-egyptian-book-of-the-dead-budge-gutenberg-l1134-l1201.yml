    Kingdom of Osiris: guarded halls and gates requiring knowledge of names, named
    cows, districts, protective mummy-chamber texts and amulets, the soul avoiding
    a snare, declarations against bodily decay, and assurance of immortality in the
    Tuat. The later bibliographic note in the passage is not treated as mythic content.'
