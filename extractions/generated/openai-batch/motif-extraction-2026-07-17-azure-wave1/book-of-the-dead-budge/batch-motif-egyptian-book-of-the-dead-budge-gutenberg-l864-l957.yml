  summary: The passage presents explanatory material and translated hymnic excerpts
    in which the deceased praises Ra and Osiris. Ra is addressed as king of the gods,
    solar riser and setter, creator of heaven, earth, waters, mountains, humans, and
    animals, voyager in Morning and Evening Boats, and giver of light and breath to
    the dead in Amentt/Tuat. Osiris Un-Nefer is praised as eternal king, child of
    Nut and Geb, father of Horus, ruler of the World and Under World, possessor of
    royal insignia, and source of fertility for the Two Lands.
