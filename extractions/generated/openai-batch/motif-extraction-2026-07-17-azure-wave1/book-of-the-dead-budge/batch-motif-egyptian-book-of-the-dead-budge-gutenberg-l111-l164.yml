    powers, and invoking Thoth's spells, magical names, and funerary texts. It contrasts
    predynastic grave evidence with dynastic practices, describes the road of the
    dead toward the Kingdom of Osiris, and includes Ra's daily threat from Aapep overcome
    by Thoth's spell.
