canonical_text:
  quote: ''
  summary: A prose synopsis describes how recitations and chapters of the Book of
    the Dead protect the deceased, enable travel and transformation in the Tuat and
    heavens, provide divine books, boats, guides, offerings, rebirth, judgment-related
    safeguards, return to earth, and rituals involving Osiris and solar boats.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Water in some Tuat pools is cool for speakers of truth but becomes boiling
    water that scalds the wicked when they try to drink it.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chapter LXIV is described as a great divine protection; its recital is said
    to suggest that the deceased may absorb gods into himself or be absorbed by them,
    and its rubric requires abstention from meats, fish, and women by reciters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Several chapters give the deceased victory over enemies, access to the Boat
    of Ra, freedom of motion in heaven and earth, rebirth in the Mesqet Chamber, passage
    in the Henu Boat, and guidance toward the House of Osiris.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Seven Spirits are said to punish the wicked in the Kingdom of Osiris.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The praying mantis, also called Bebait, guides or leads the deceased through
    a bush and to the great gods.
  category: action
  evidence_refs:
  - ev:3
  - ev:6
- id: obs:6
  text: The Chapters of Transformations enable the deceased to assume named forms
    including hawks, a self-created god, a light-god or robe of Nu, a lily, the Son
    of Ptah, the Benu Bird, a heron, the Soul of Ra, a swallow, an earth-serpent,
    and a crocodile.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Other chapters bring the deceased's ba to his body in the Tuat, preserve him
    from mutilation and attacks by a head-cutting god, and prevent his soul from being
    shut in the tomb.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Chapters associated with Thoth provide the deceased with Thoth's books, power,
    protection, scribal office under Osiris, wisdom, and identification with Thoth.
  category: relationship
  evidence_refs:
  - ev:5
  - ev:8
  - ev:9
- id: obs:9
  text: Boats and a ladder enable the deceased to sail over northern heavens, ascend
    to heaven, enter the Boat of Ra, be with Hathor, and use magical boats whose parts
    have mystic names.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: A Uatch amulet from the neck of Ra provides the deceased's ka and ba with
    offerings.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The eastern region includes spirits of the East and West, gods of the Mountain
    of Sunrise, the Serpent-god Ami-hem-f, the Morning Star, the Two Sycamores, the
    daily appearance of the Sun-god, and the entrance to Sekhet Aaru or the Elysian
    Fields.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage summarizes legends in which Horus temporarily loses the sight
    of his eye after looking at Set in the form of a black pig, and in which Horus
    drowns and his body is recovered by Sebek the Crocodile-god.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Later chapters concern lordship in the Tuats of Memphis and Heliopolis, food
    supply, judgment, prayer to Four Holy Apes, hymns to gods of the Circles and Osiris,
    use of the Boats of Sunrise and Sunset, and return to earth to visit the deceased's
    former house.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Daily magical ceremonies are described as making the deceased a living soul
    forever; other chapters concern reconstituting Osiris, setting up twelve altars,
    making offerings, and vignettes of solar boats.
  category: sequence
  evidence_refs:
  - ev:10
