canonical_text:
  quote: ''
  summary: The passage describes the Kingdom of Osiris as an underworld division where
    beautified souls receive allotted dwellings, undergo truth-based admission, dwell
    in watered agricultural fields, work and eat celestial grain identified with Osiris,
    and are addressed by Osiris as beings of Truth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Kingdom of Osiris is described as the Sixth Division of the Tuat and as
    a realm whose theological location shifted before absorbing other Egyptian underworld
    localities.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the soul arrives in a beautified or spirit body, ministers of Osiris
    take it to an allotted homestead by Osiris's command, where it begins a new existence.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The abode of the blessed is described as flat country with canals of running
    water containing no fish and no worms or water snakes, and with small islands,
    including the Island of Truth where Osiris dwells with his saints.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The ferry-man of Osiris will not convey a soul to the Island of Truth unless
    that soul has been declared true of word by Thoth, Osiris, and the Great Gods
    at the Great Reckoning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The deceased is shown ploughing, reaping, and driving oxen that tread out
    corn in a region likened to a typical Egyptian farm.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Thoth introduces the deceased into Sekhet Heteput, a section of Sekhet Aaru
    or the Field of Reeds, where the deceased finds ancestral souls joined to the
    Company of the Gods.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: A special corner is set apart for aakhu, beautified souls or spirit-souls,
    described as seven cubits high and as reaping wheat or barley three cubits high.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Two boats are moored near the aakhu dwelling place; they are described as
    spirit boats that move by themselves and carry the beautified wherever they wish
    without trouble or fatigue.
  category: object
  evidence_refs:
  - ev:3
- id: obs:9
  text: Images on Seti I's alabaster sarcophagus show the beautified tending wheat
    plants and reaping ripe grain to produce celestial food for themselves and the
    god.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The accompanying texts identify the ears of wheat as the members of Osiris,
    call the wheat plant the maat plant, describe Osiris as Wheat-god and personification
    of Maat, and state that the beautified eat the body of their god daily as the
    Bread of Everlastingness.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: The beautified are described as those who offered incense to the gods, whose
    kau have been washed clean, and who have been reckoned as maat in the presence
    of the Great God who destroys sin.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Osiris addresses the beautified as truth of truth and beings of Truth, tells
    them to rest, and commands that they live with dominion over the cool waters of
    their land, with Truth and without sin.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:13
  text: 'The passage explicitly distinguishes two conceptions of Osiris: as Wheat-god
    satisfying an agricultural heaven and as God of Truth serving as hope and consolation
    for the spiritually minded.'
  category: other
  evidence_refs:
  - ev:7
