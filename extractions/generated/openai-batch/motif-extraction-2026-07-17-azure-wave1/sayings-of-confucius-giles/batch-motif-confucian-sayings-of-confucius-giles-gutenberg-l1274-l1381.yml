- id: motif:4
  label: Reciprocity as the domain of moral virtue
  taxonomy_refs: []
  basis: 'The passage gives both positive and negative reciprocal formulations: strengthening
    and illuminating others as oneself, doing to others as one would be done by, and
    not doing what one would not wish for oneself.'
  evidence_refs:
  - ev:5
  - ev:11
  confidence: high
  cautions: The passage supports an ethical reciprocity pattern, not a claim about
    historical transmission.
- id: motif:5
  label: Ritual analogy for public conduct and rulership
  taxonomy_refs:
  - sacrifice
  basis: The Master tells Chung Kung to behave outside as if entertaining a distinguished
    guest and to rule the people as if officiating at a solemn sacrifice.
  evidence_refs:
