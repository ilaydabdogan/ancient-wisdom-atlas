  text: The Master contrasts the man of knowledge, who takes pleasure in the sea and
    is restless and happy, with the man of virtue, who takes pleasure in mountains
    and is calm and long-lived.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The higher type of man gathers learning and regulates it by an inner rule
    of conduct so as not to overstep the limit.
  category: speech
  evidence_refs:
  - ev:3
