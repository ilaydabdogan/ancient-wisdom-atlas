- id: motif:3
  label: Water and mountain as contrasting ethical landscapes
  taxonomy_refs: []
  basis: The man of knowledge is linked with the sea, restlessness, and happiness,
    while the man of virtue is linked with mountains, calm, and long life.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The imagery is explicitly analogical in this saying; broader symbolic
