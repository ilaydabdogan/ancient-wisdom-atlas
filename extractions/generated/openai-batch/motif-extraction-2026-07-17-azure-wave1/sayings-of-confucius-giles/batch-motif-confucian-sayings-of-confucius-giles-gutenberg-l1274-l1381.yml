  confidence: medium
  cautions: The sacrifice reference is analogical; no actual sacrifice is narrated.
- id: motif:6
  label: Withdrawal from corrupt or lawless polity
  taxonomy_refs: []
  basis: The Master counsels entering not a tottering state, abiding not where sedition
