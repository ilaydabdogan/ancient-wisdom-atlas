  quote: ''
  summary: The passage sketches Confucius's life against the breakdown of the Chou
    feudal order. It describes political decentralization, usurpation by powerful
    families and officers, Confucius's stance against disorder, his teaching and disciples,
    his brief political success in Lu, his resignation after Duke Ting is distracted
    by gifts from Chi, his subsequent wandering exile, a report that his mission was
    beginning, and his delayed return in old age.
