literal_observations:
- id: obs:1
  text: The Master says that prodigality, parsimony, and lack of self-restraint can
    distort conduct into arrogance, niggardliness, oppression, timidity, violence,
    and rudeness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says pride and avarice invalidate other fine qualities, and he
    describes several character combinations that he does not understand.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master says self-cultivation tends toward happiness, that virtue should
    be pursued continually, and that he has not met one whose love of virtue equals
    love of sensual beauty.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master uses the image of making or leveling a mound by basketfuls of earth
    to distinguish stopping from continuing progress.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Master uses crop imagery for growth that does not fully mature, and says
    juniors should be respected because they may later equal present adults.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Master says admonition and advice matter only when followed by reformation
    and meditation.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Master says a poor man cannot be robbed of his will, and that pine and
    cypress are known as evergreens only when the cold season comes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: 'The Master describes a staged order of learning: self-cultivation, general
    truths of philosophy, forming character for good, and only then making exceptions
    to general rules.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: When Yen Yan dies, the Master laments that God has forsaken him; after the
    disciples give Yen Yan a sumptuous funeral against his advice, the Master says
    Hui regarded him as a father and blames the disciples.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Chi Lu asks about duty to spirits and about death; the Master replies by prioritizing
    duties to the living and knowledge of life.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Master defines clear mental vision as a mind resistant to slander and
    calumny, and he values practical service and speech over memorized learning alone.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tz Kung asks about a man loved or hated by all fellow-townsmen; the Master
    says neither general love nor general hatred is sufficient without knowing whether
    the good love him and the wicked hate him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Master says people must be trained before war, and that taking an untrained
    multitude into battle is equivalent to throwing them away.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The passage gives additional maxims on bold or tactful speech, poverty and
