canonical_text:
  quote: ''
  summary: A sequence of sayings attributed to disciples and later notes presents
    ethical teaching on friendship, altruism, faults, public trust, teaching methods,
    study and public office, mourning, compassionate judgment, and the visible repair
    of a great person's mistakes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsng Tz says the higher type of man's culture brings him into communion with
    friends, and friendship heightens his altruism.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tz Hsia's disciples ask Tz Chang about friendship; they report Tz Hsia's view
    that one should associate with those who meet one's standard and reject those
    who do not, while Tz Chang says the nobler man honors the virtuous and wise but
    admits all people to his society and pities weaker brethren.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tz Hsia says the inferior type of man tries to gloss over his faults.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tz Hsia says the wise man gains the people's confidence before placing burdens
    on them and gains the sovereign's confidence before censuring his actions.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tz Hsia says one who does not transgress larger principles of virtuous conduct
    may be excused for crossing the boundary in smaller matters.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tz Yu criticizes Tz Hsia's followers as trained in practical courtesies but
    ignorant of fundamentals; Tz Hsia replies that the wise teacher teaches methodically
    and cultivates minds as one cultivates different plants.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Tz Hsia says an official with spare time should study, and a student with
    spare time should devote it to public affairs.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Tz Yu says mourning rites should not go beyond the expression of heartfelt
    grief.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: After Yang Fu is appointed Criminal Judge and asks Tsng Tz for advice, Tsng
    Tz says the rulers have lost their way, the people are scattered and distracted,
    and discovered crime should evoke pity and grief rather than joy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Tz Kung compares the mistakes of a great and good man to eclipses of the
    sun and moon: the failure is seen by all, and when repaired, all look up to him
    with awe.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'Footnote 12 comments that the two teachers have each seized one side of the
    truth: one need not reject fellow-men, yet one should still discriminate in choosing
    associates.'
  category: other
  evidence_refs:
  - ev:9
