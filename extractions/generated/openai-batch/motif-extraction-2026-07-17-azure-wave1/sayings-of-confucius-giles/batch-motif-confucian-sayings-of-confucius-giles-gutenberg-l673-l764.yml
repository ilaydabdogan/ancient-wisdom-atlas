canonical_text:
  quote: '"The virtue of the prince" is "like unto wind; that of the people, like
    unto grass."'
  summary: 'The passage presents Confucius''s view that moral example begins in the
    family and should extend to government: an upright ruler shapes subjects as wind
    bends grass. It discusses the partial practical success of this theory in Lu,
    its weakness when rulers lack virtue, Confucius''s long search for an ideal sovereign,
    criticism of him as a visionary, his perseverance, and his posthumous influence
    as a moral exemplar or "throneless king." It ends by comparing the scale of his
    influence to that of Gautama, the Arab Prophet, and the figure whose years ended
    on Golgotha.'
  language: English
  quote_policy: quoted
