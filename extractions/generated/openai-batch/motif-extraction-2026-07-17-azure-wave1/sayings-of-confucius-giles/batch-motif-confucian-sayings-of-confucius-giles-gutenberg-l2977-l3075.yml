candidate_motifs:
- id: motif:1
  label: Wisdom gained through humility, questioning, and study
  taxonomy_refs:
  - wisdom
  basis: Confucius gains information through modest and deferential conduct, asks
    questions in the Temple as a ritual act, and the passage values study of the Odes
    and Rites.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  confidence: high
  cautions: This is an ethical-pedagogical motif rather than a mythic narrative episode.
- id: motif:2
  label: Single ethical thread through a teacher's doctrine
  taxonomy_refs:
  - wisdom
  basis: Confucius says one principle runs through all his teaching, and Tsng Tz defines
    it as loyalty to oneself and charity to one's neighbour.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives the doctrine in explicit ethical terms, not as an allegorical
    symbol.
- id: motif:3
  label: Inexhaustible teaching as an unreachable horizon
  taxonomy_refs:
  - wisdom
  basis: Yen Yan says Confucius' teaching appears higher the more he looks, remains
    reliable when tested, draws learners step by step, and leaves something inaccessible
    beyond all effort.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The description is metaphorical praise of learning; no supernatural quest
    is narrated.
- id: motif:4
  label: Sage as herald and reformer in a disordered age
  taxonomy_refs:
  - culture_hero
  - wisdom
  basis: The prefect says God will make Confucius a herald to rouse the land, and
    Confucius later says reform would be unnecessary if right principles prevailed
    in the Empire.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: medium
  cautions: The herald claim is spoken by the prefect, and the reform role is political-ethical;
    classification as culture_hero is tentative.
- id: motif:5
  label: Public service versus withdrawal from a corrupt world
  taxonomy_refs: []
  basis: Yang Huo urges Confucius toward office, Chieh Yu warns against government,
    Chieh Ni recommends following one who has withdrawn from the world, and Confucius
    refuses withdrawal from human society.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: No available taxonomy reference exactly matches this Confucian engagement-versus-withdrawal
    pattern.
- id: motif:6
  label: Gift used to compel or invite political encounter
  taxonomy_refs: []
  basis: Yang Huo sends Confucius a sucking-pig as a present after Confucius refuses
    an interview; Confucius then goes to pay respects and encounters Yang Huo on the
    road.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not state a sacred exchange or ritual law of reciprocity;
    it only narrates a present and subsequent visit.
- id: motif:7
  label: Phoenix image used to admonish the sage
  taxonomy_refs: []
  basis: Chieh Yu sings to a phoenix about fallen virtue and warns against future
    danger for those engaging in government as he passes Confucius' carriage.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The phoenix appears within a song image; the passage does not explain
    its wider symbolism.
