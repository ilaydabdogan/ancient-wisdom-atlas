canonical_text:
  quote: ''
  summary: A sequence of anecdotes presents Confucius as perceived by disciples, officials,
    critics, recluses, and other observers. The passage emphasizes his humility in
    learning, ritual questioning, ethical teaching, public mission in a disordered
    world, refusal to abandon human society, and the tensions between political service
    and withdrawal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tz Chin asks whether Confucius seeks governmental information in new countries
    or receives it unasked; Tz Kung says Confucius gains it through geniality, goodness,
    deference, modesty, and regard for others.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In the Grand Temple, Confucius asks questions about everything; when someone
    criticizes this as ignorance of ceremony, Confucius says the questioning itself
    is a ceremonial observance.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The frontier prefect of I asks to be introduced to Confucius and, after the
    audience, tells the followers not to grieve over Confucius' fall from power because
    God will make him a herald to rouse the land.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Confucius says a single principle runs through all his teaching; Tsng Tz explains
    it to the disciples as loyalty to oneself and charity to one's neighbour.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Yen Yan describes Confucius' teaching as high, reliable, elusive, progressive,
    broadening through polite learning, restraining through inward self-control, and
    still inaccessible after exhaustive effort.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A gate-keeper at Shih-men identifies Confucius as the man trying to do what
    he knows to be impossible.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Po Yu reports that his father gave him no secret teaching, but instructed
    him to study the Odes for conversation and the Book of Rites for stability of
    character; Chn Kang concludes that the higher type of man has no secrets even
    with his son.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Yang Huo seeks an interview, sends Confucius a sucking-pig as a present, meets
    him on the road, argues that hidden talent should not let the country drift into
    confusion, and urges timely public service.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The eccentric Chieh Yu passes Confucius' carriage singing to a phoenix and
    warning of danger in government; Confucius alights to speak, but Chieh Yu leaves
    too quickly.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Chang Ch and Chieh Ni work in the fields when Confucius passes; Tz Lu asks
    them about the ford, and they question and criticize Confucius' political course.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: After hearing the field workers' remarks, Confucius says humans cannot join
    birds and beasts, that he must associate with the ruling class, and that reform
    would be unnecessary if right principles already prevailed.
  category: speech
  evidence_refs:
  - ev:10
