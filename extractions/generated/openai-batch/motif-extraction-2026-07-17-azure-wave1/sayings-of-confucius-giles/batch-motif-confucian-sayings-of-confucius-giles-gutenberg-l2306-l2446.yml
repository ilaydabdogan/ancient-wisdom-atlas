canonical_text:
  quote: ''
  summary: A sequence of sayings attributed to the Master gives instructions on learning,
    sincerity, filial mourning, judging character, true knowledge, cautious speech
    and action, ritual propriety, Heaven, virtue, self-examination, charity, austere
    happiness, and accepting a visitor at his best.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master describes learning and practicing what one has learned as pleasure,
    and the arrival of a friend from far away as joy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage advises making conscientiousness and sincerity central, avoiding
    unequal friends, and making amends after wrongdoing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A filial son is described as one who does not swerve from his father's principles
    during the three years of mourning after the father's death.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Odes are said to number three hundred and to be summed up by the instruction
    to have no depraved thoughts.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A man's character is to be discerned by observing his actions, scrutinizing
    his motives, and noting what gives him pleasure.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Master links teaching to acquiring new knowledge while thinking over old
    knowledge, balances study with thought, warns against absorption in the supernatural,
    and defines true knowledge as knowing both what one knows and what one does not
    know.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tz Chang is told that cautious judgment, cautious speech, and cautious action
    will reduce error and repentance, with official preferment following of itself.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: A man without sincerity is compared to a cart or carriage that cannot go without
    a yoke or cross-bar.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Sacrificing to a spirit with which one has nothing to do is called servility,
    shirking visible duty is called lack of moral courage, and the Master says that
    knowing the Great Sacrifice would make governing the Empire easy.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Wang-sun Chia asks about an adage comparing the kitchen-god and the god of
    the inner sanctum; the Master rejects it and says that one who sins against Heaven
    can rely on no intercession.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Rank without liberality, ceremonies without reverence, and mourning rites
    without sorrow are criticized.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Faults are said to reveal character, and hearing the True Way in the morning
    is said to make death at night unimportant.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: A scholar ashamed of bad clothes and coarse food is said not to be ready for
    instruction; one should seek worthiness rather than recognition and should emulate
    good men while examining oneself when seeing bad men.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Chi Wn Tz is said to have reflected three times before acting; the Master
    responds that twice would do and later laments not meeting a man who arraigns
    himself at his own conscience.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Jan Chiu asks for grain for Tz Hua's mother, gives far more than the Master
    specified, and is rebuked because the princely man helps the distressed but does
    not add to the wealth of the wealthy.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: Yan Ss declines nine hundred measures of grain after becoming governor; the
    Master tells him not to decline them and suggests distributing them among neighboring
    villages and townships.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: The Master asks who can leave a house except by the door and asks why life
    should not likewise pass through the door of virtue.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:18
  text: The Master says happiness can exist with coarse food, water, and the bended
    arm as a pillow, while unrighteously obtained wealth and rank seem like floating
    clouds.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:19
  text: When a young man from Hu-hsiang comes to see Confucius and the disciples hesitate,
    the Master says he accepts a man at his best, comparing this to receiving someone
    after he has washed his hands.
  category: action
  evidence_refs:
  - ev:16
- id: obs:20
  text: 'The Master says virtue is not remote: if he shows a desire for virtue, it
    is present.'
  category: speech
  evidence_refs:
  - ev:16
