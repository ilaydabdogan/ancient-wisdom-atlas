canonical_text:
  quote: ''
  summary: Editorial notes explain WuChng as a fortified 'Martial city,' describe
    Tz Yu's successful turn of its people from warlike habits to arts of peace, note
    the Master's pleased and amused reaction, compare the importance of ancient Chinese
    music under the Chou to Plato's ideal State, state that a ruler should seek the
    people's welfare without indiscriminate largess, contrast this with Roman imperial
    doles, and reduce the 'four evil things' to cruelty and meanness.
