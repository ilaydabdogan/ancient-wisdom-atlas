canonical_text:
  quote: ''
  summary: The passage presents anecdotes about Confucius's respectful conduct toward
    mourners, officials, blind people, guests, and natural disturbances; his refusal
    to claim knowledge of warfare; his composure during privation; his practical assistance
    to the blind musician Mien; and his departure after the Duke of Lu neglects court
    business following the acceptance of singing-girls as a gift.
  language: English
  quote_policy: summarized
