    and reckless under it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: When Mien, a blind musician, visits, Confucius verbally points out the steps,
    the mat, and the locations of the seated visitors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: After Tz Chang questions this manner of speaking to a musician, Confucius
