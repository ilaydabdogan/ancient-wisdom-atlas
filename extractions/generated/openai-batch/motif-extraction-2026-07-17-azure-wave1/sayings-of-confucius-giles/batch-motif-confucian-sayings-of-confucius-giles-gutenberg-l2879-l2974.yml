  text: When in his carriage, Confucius does not look behind him, speak rapidly, or
    point with his finger.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Duke Ling of Wei asks Confucius about troop disposition, and Confucius replies
