canonical_text:
  quote: ''
  summary: A series of sayings and dialogues presents ethical instruction on the princely
    or higher type of person, filial piety, ritual propriety, public conduct, speech
    and action, and delight in what is right.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master says a princely man is not vexed when others do not know him, and
    that true virtue rarely accompanies artful speech and insinuating looks.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A young man is instructed to behave as a son at home, as a younger brother
    abroad, to be circumspect and truthful, to have charity for all, to associate
    with the virtuous, and to devote surplus energy to literary culture.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The nobler type of man is described as not seeking mere repletion or comfort
    in food and lodging, as earnest in affairs, cautious in speech, and as frequenting
    virtuous company for improvement.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Filial piety is explained as having no falling off, including serving parents
    properly while they live, burying them with proper rites after death, and worshipping
    them thereafter with proper sacrifices.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Further sayings on filial piety state that parents should be spared anxiety
    except over sickness, that reverence distinguishes filial maintenance from the
    maintenance of dogs and horses, and that outward service with work, wine, and
    food is not by itself sufficient.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The higher type of man is said to act before speaking, to profess only what
    he practices, to be broadly sympathetic and free from party bias; the lower type
    is described as biased and unsympathetic.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Master asks what ceremonies and music are to a person without charity,
    and teaches that in rites simplicity is better than extravagance and in mourning
    heartfelt sorrow is better than punctiliousness.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: The true gentleman is said to avoid contention; even at a shooting-match he
    salutes opponents before competing and again when he loses and retires to drink
    the forfeit-cup.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Charity is said to make a locality good to dwell in; the person with goodness
    is able to love and hate; the princely man never quits the path of virtue, even
    in storm and stress.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The nobler sort of man follows the line of duty rather than narrow predilections
    or obstinate antipathies, knows his duty, while the inferior man is proficient
    only in money-making.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: In serving father and mother, a son may use gentle remonstrance, should increase
    deference if ignored, should show no resentment, should not travel far while parents
    live unless in a fixed direction, and should keep their age in mind as both joy
    and alarm.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The wise man is said to be slow to speak but quick to act.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tz Chang describes Prime Minister Tz Wn holding office three times without
    joy, losing it three times without concern, and explaining the political situation
    to his successor; the Master calls him loyal and conscientious but declines to
    judge his highest moral virtue.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Tz Chang describes Chn Wn Tz as leaving his wealth and country after Tsui
    Tz slew the Prince of Chi, and as departing from other states when he found similar
    conditions; the Master calls him pure and incorruptible but declines to judge
    his highest virtue.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: The Master says that excess solidity gives boorishness, excess ornament gives
    superficial smartness, and that a proper blending of the two produces the higher
    type of man; he also says all men are born good.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: The passage ranks delighting in what is right above being fond of what is
    right, and being fond of what is right above merely knowing what is right.
  category: sequence
  evidence_refs:
  - ev:11
