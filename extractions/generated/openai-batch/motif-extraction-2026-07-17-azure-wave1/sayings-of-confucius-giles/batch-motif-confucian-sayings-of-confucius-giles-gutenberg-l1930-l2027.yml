canonical_text:
  quote: ''
  summary: 'A sequence of editorial notes explains figures and anecdotes connected
    with Confucius and his disciples: loyal ministers and brothers who remain faithful
    to fallen rulers, a lover who drowns while waiting under a bridge, disciples suffering
    illness or acting bravely, voluntary exile to protect dynastic succession, the
    Great Yü''s flood-control labor, Confucius'' return from exile, peril between
    Ch''en and Ts''ai, the broad sense of filial piety, Tz Lu''s death in Wei, and
    Confucius'' judgment of public duty over private ties.'
  language: English
  quote_policy: summarized
