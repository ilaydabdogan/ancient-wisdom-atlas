  summary: The passage defends Confucius against charges that he failed to teach religion
    and encouraged selfishness. It presents Confucian teaching as moral instruction
    grounded in human nature, altruism, and virtue for its own sake, contrasting this
    with religious systems that motivate conduct through supernatural or afterlife
    rewards and punishments. It also identifies the Confucian term _jn_ with social
    good or altruistic virtue.
