canonical_text:
  quote: ''
  summary: 'The passage presents sayings and anecdotes about Confucius'' personal
    conduct: cheerful leisure, restraint around mourning, selective teaching topics,
    careful speech, courtesy toward marked social statuses, rejection of false official
    honors during illness, hope to dwell among eastern tribes, reserved conduct in
    village, temple, court, and palace settings, ritualized behavior with visitors
    and regalia, disciplined eating and ancestral offerings, caution about medicine,
    concern for people after a stable fire, handling of princely gifts, funeral care
    for a friend, and informal home life.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: In leisure, the Master is described as cheerful and smiling.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When dining beside someone mourning for parents, he did not eat a full meal,
    and he did not sing on a day when he had bewailed a death.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: He would not talk about prodigies, feats of strength, crime, or supernatural
    beings.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: His teaching subjects are listed as literature and the arts, conduct, conscientiousness,
    and truthfulness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: He fished with a line rather than a net and shot only at birds on the wing.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When singers performed well, he asked them to repeat the piece and then joined
    in the song.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: He is described as affable yet grave, stern but not fierce, attentive yet
    calm.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage says he seldom spoke of money-making, the laws of Providence,
    or moral virtue, and barred certain categorical expressions including shall, must,
    certainly, and I.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: When he saw a mourner, a person in official robes, or a blind person, he rose
    from his seat or quickened his step when passing them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: During a serious illness, Tz Lu arranged for the disciples to act as ministers
    of state, and Confucius called this an imposture.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: In the illness episode, Confucius said it would be better to die in the arms
    of his disciples than among officials, even without the honor of a public funeral.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: He wished to settle among the nine eastern tribes and replied that the presence
    of a higher type of man would alter their condition.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: In his native village he was simple and unassuming; in the ancestral temple
    and at court he spoke fluently but with reserve.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: At court he spoke with frankness and affability to lower-ranking ministers,
    quietly and decisively to higher-ranking ministers, and with awe yet composure
    before the Sovereign.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: When receiving distinguished visitors for the Prince, he changed expression,
    bent his legs, saluted with clasped hands, kept his robe adjusted, moved forward
    with arms like bird wings, and reported the visitor's departure.
  category: action
  evidence_refs:
  - ev:9
- id: obs:16
  text: When entering the palace and passing the throne, he bent his body, avoided
    the middle doorway and threshold, held up his robe, held his breath, and later
    departed with arms outstretched like wings while still showing awe.
  category: action
  evidence_refs:
  - ev:10
- id: obs:17
  text: He carried the Prince's regalia with a bent body as though it were heavy,
    raising it to head height and lowering it to chest height.
  category: action
  evidence_refs:
  - ev:11
- id: obs:18
  text: His eating practices included avoiding improperly cut or improperly sauced
    meat, limiting meat relative to vegetables, avoiding intoxication, taking ginger,
    not conversing while eating, and making reverent offerings to ancestral spirits.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: He would not sit on a mat placed awry.
  category: action
  evidence_refs:
  - ev:12
- id: obs:20
  text: After receiving unfamiliar medicine from Chi Kang Tz, he bowed but said he
    would not venture to try it.
  category: action
  evidence_refs:
  - ev:13
- id: obs:21
  text: After his stables burned, he asked whether anyone had been hurt and did not
    ask about the horses.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:22
  text: When the Prince sent gifts, he tasted cooked meat on a properly placed mat,
    cooked raw meat and offered it in sacrifice, kept a live animal alive, and went
    on foot immediately when summoned.
  category: action
  evidence_refs:
  - ev:14
- id: obs:23
  text: If a friend died without home or relations, he said he would see to the funeral.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:24
  text: In bed he did not lie like a corpse, and in home life his manner was not too
    formal.
  category: attribute
  evidence_refs:
  - ev:15
