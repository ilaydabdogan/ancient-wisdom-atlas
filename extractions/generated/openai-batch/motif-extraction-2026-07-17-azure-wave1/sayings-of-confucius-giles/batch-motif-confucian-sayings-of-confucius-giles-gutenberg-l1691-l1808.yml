candidate_motifs:
- id: motif:1
  label: Wisdom shown in conduct rather than speech
  taxonomy_refs:
  - wisdom
  basis: Hui's conduct proves understanding despite silence; Confucius criticizes
    clever speech and says he now compares words with actions after Tsai Y.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:7
  confidence: high
  cautions: This is an ethical-discursive pattern rather than a narrative mythic episode.
- id: motif:2
  label: Person assessed through a ritual vessel image
  taxonomy_refs: []
  basis: Tz Kung is compared to a richly ornamented sacrificial vessel with a limited
    function.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The vessel is a metaphor in moral evaluation; no broader vessel taxonomy
    is directly supplied by the available symbol list.
- id: motif:3
  label: Prudent restraint preferred over reckless daring
  taxonomy_refs:
  - wisdom
  basis: Yu is praised for daring but said to lack judgment, and Confucius rejects
    the commander who attacks a tiger unarmed, crosses a river without a boat, or
    sacrifices life without regret.
  evidence_refs:
  - ev:4
  - ev:20
  confidence: high
  cautions: The passage frames this as practical moral judgment, not heroic adventure
    narrative.
- id: motif:4
  label: Virtue sustained in poverty
  taxonomy_refs:
  - wisdom
  basis: Hui is praised for remaining cheerful in a miserable alley with only one
    dish of food and one bowl of drink, and for not deviating from perfect virtue
    for three months.
  evidence_refs:
  - ev:15
  - ev:17
  confidence: high
  cautions: The passage does not present poverty as a supernatural trial; it is an
    ethical exemplar.
- id: motif:5
  label: Reciprocity ethic as difficult attainment
  taxonomy_refs:
  - wisdom
  basis: Tz Kung states the wish not to do to others what he would not want done to
    himself, and Confucius says he has not reached that level.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage gives a brief maxim-like exchange, not an extended motif narrative.
- id: motif:6
  label: Fate at the deathbed of a worthy person
  taxonomy_refs: []
  basis: At Po Niu's deathbed, Confucius clasps his hand through the window, says
    he is dying, calls it fate, and laments that such a man has such an illness.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: No afterlife, rebirth, judgment, or divine agency is stated in the passage.
- id: motif:7
  label: Renunciation of royal power as supreme virtue
  taxonomy_refs:
  - royal_legitimacy
  basis: Tai Po is said to have reached the summit of virtue by resolutely renouncing
    the Imperial throne and avoiding public glorification of the act.
  evidence_refs:
  - ev:21
  confidence: medium
  cautions: 'The available taxonomy reference is approximate: the passage concerns
    renunciation of royal power rather than accession or legitimation.'
- id: motif:8
  label: Humility after military defeat
  taxonomy_refs:
  - wisdom
  basis: Mng Chih-fan, after bringing up the rear in defeat, denies that courage made
    him last and attributes it to his horse's slowness.
  evidence_refs:
  - ev:19
  confidence: medium
  cautions: The passage presents a moral anecdote of modesty, not a larger battle
    narrative.
