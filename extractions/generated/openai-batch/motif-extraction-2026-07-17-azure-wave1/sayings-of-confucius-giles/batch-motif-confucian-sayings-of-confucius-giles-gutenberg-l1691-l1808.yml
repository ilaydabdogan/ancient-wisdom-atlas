canonical_text:
  quote: ''
  summary: A sequence of sayings in which Confucius evaluates disciples and other
    men by understanding, speech, conduct, public capacity, friendship, humility,
    prudence, poverty, illness, fate, and renunciation of power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius says Hui listens without criticism or dissent, but Hui's private
    conduct later shows that he exemplifies the teaching.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius likens Tz Kung to a richly ornamented sacrificial vessel with a
    limited function.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: Confucius questions the usefulness of clever speech and says people who assail
    others with their tongues make themselves disliked.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Confucius imagines boarding a raft and floating away over the sea, and says
    Yu would accompany him; he then says Yu loves daring but lacks discretion and
    judgment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Confucius says Yu, Chiu, and Chih may be trusted with particular public or
    ceremonial duties, but he does not say whether any of them has true virtue.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tz Kung says Hui can hear one point and master the whole, while Tz Kung can
    only proceed to a second point; Confucius agrees that Tz Kung is not equal to
    Hui.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: After Tsai Y sleeps during the day, Confucius compares him to rotten wood
    and mud walls and says he now listens to people's words and watches their actions.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Confucius says he has not met a really strong character and rejects Shn Chng
    as an example because Chng is enslaved to passions.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Tz Kung says he wants to avoid doing to others what he would not want done
    to himself; Confucius replies that he has not reached that point.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: 'Confucius attributes four qualities to Tz Chan: grave demeanour, attentiveness
    to superiors, kindness toward the people, and justice in ordering the people.'
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Yen P'ing is said to treat friends with the same respect however old the acquaintance
    becomes.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:12
  text: Ning Wu Tz is described as wise when his country is well governed and stupid
    when revolution comes.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:13
  text: Po I and Shu Chi are said not to remember old injuries, resulting in few enemies.
  category: attribute
  evidence_refs:
  - ev:13
- id: obs:14
  text: Wei-sheng Kao is questioned as an upright man because, when asked for vinegar,
    he begged it from a neighbour and gave it to the requester.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Hui is said not to deviate in spirit from perfect virtue for three months,
    while other disciples may only attain that state briefly.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:16
  text: When Po Niu is sick unto death, Confucius visits him, clasps his hand through
    a window, and says his dying is fate.
  category: action
  evidence_refs:
  - ev:16
- id: obs:17
  text: Confucius says Hui remains cheerful while living in a poor alley with one
    dish of food and one bowl of drink.
  category: setting
  evidence_refs:
  - ev:17
- id: obs:18
  text: Jan Chiu says his strength fails him in following the teaching; Confucius
    replies that he is setting up bounds he will not try to pass.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:19
  text: After a defeat, Mng Chih-fan brings up the rear, whips his horse near the
    city gate, and denies that courage made him last.
  category: action
  evidence_refs:
  - ev:19
- id: obs:20
  text: Confucius says he would not choose for command a person who attacks a tiger
    unarmed, crosses a river without a boat, or sacrifices life without regret; he
    would choose one who plans carefully.
  category: speech
  evidence_refs:
  - ev:20
- id: obs:21
  text: Confucius says Tai Po reached the summit of virtue by renouncing the Imperial
    throne and preventing people from glorifying his renunciation.
  category: action
  evidence_refs:
  - ev:21
