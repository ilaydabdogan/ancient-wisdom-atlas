canonical_text:
  quote: ''
  summary: Confucius visits Wu-chng, hears music, and jokes about using an excessive
    instrument for a small task; Tz Yu defends education in true principles, and Confucius
    accepts the correction. Tz Chang asks about good government, and Confucius lists
    five excellent qualities of a ruler and four evil practices to avoid. The passage
    also includes editorial notes on rectification of names, division of labour in
    rulership, a tiger anecdote illustrating harsh government, and a comparison to
    Taoist quietism.
  language: English
  quote_policy: summarized
