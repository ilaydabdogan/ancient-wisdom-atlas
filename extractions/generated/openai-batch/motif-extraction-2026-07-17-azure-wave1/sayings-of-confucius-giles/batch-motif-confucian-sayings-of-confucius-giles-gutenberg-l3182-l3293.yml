canonical_text:
  quote: ''
  summary: A sequence of sayings and dialogues attributed to Confucius and his disciples
    presents teachings on filial and fraternal virtue, self-examination, education,
    sincerity, use of the Odes, moderation in criticism, humility before office, wishes
    for social care, assessment of rulers and worthies, restoration of old forms,
    universal brotherhood, the relation of substance and ornament, and famine taxation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yu Tz states that good sons and brothers are seldom insubordinate, and identifies
    filial piety and fraternal love as the root of goodness from which virtue springs.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsng Tz says he daily examines whether he has worked conscientiously for others,
    been truthful with friends, and practiced what he preaches.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tz Hsia says that a person who values moral worth, serves parents and prince,
    and speaks sincerely with friends has received the highest education even if called
    untaught.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Tz Kung asks about poor and rich men; the Master values cheerfulness, harmony,
    and self-control above merely refusing flattery or pride, and praises Tz Kung
    for applying a verse from the Odes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tz Hsia asks about a poetic passage; the Master explains that a plain background
    is needed before colors are applied, and praises Shang for grasping his meaning.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tz Yu says excessive fault-finding with princes brings disgrace and excessive
    fault-finding with friends brings estrangement.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Master wants to employ Ch'i-tiao K'ai in government; Ch'i-tiao K'ai says
    he cannot yet trust himself, and the Master is pleased.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: When asked their wishes, Tz Lu wants possessions to share with friends, Yen
    Yan wants no parade of goodness or service, and the Master wishes to comfort the
    aged, win friends' confidence, and cherish the young.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Master says Yung might be made a prince; Chung Kung discusses being strict
    in oneself while easy-going toward people, and the Master agrees with Yung's words.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Jan Yu asks whether the Master supports the Prince of Wei; Tz Kung asks the
    Master about Po I and Shu Ch'i, then concludes that the Master is not for the
    Prince.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Tsng Tz describes his late friend as able but asking instruction, abundant
    but learning from insufficiency, humble in self-presentation, and non-retaliatory.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Tsng Tz says a person who can be entrusted with a young orphan prince, a large
    province, and a great emergency without shaken resolution is of the princely type.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Min Tz-chien advises restoring the Long Treasury in the ancient style rather
    than renovating it altogether; the Master says he speaks to the purpose.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Tz Hsia tells Ss-ma Niu that life and death are divine dispensations, wealth
    and rank depend on God's will, and a courteous higher man has brethren within
    the four seas.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Tz Kung replies that substance and ornament are closely connected, comparing
    speech to a four-horse chariot and comparing hairless tiger or leopard hide to
    dog or sheep hide.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: Duke Ai asks about famine and low revenue; Yu Jo advises collecting tithes
    and says the prince's want or plenty cannot be separated from the people's want
    or plenty.
  category: speech
  evidence_refs:
  - ev:16
