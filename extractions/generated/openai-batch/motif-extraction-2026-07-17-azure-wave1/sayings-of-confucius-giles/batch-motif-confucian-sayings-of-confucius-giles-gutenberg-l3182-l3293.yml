candidate_motifs:
- id: motif:1
  label: Wisdom through ethical self-cultivation
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly frames wisdom as attention to the root of virtue,
    daily self-examination, sincere service, practice matching speech, refinement
    through learning, and humility.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:11
  confidence: high
  cautions: The material is didactic aphorism and dialogue rather than mythic narrative.
- id: motif:2
  label: Filial and fraternal order as moral foundation
  taxonomy_refs:
  - wisdom
  basis: Yu Tz identifies filial piety and fraternal love as the root of goodness,
    and Tz Hsia links high education with service to parents, prince, and friends.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: medium
  cautions: This is an ethical-social pattern; it is not a family-origin myth or sibling-pair
    narrative.
- id: motif:3
  label: Humility and non-display as marks of worth
  taxonomy_refs:
  - wisdom
  basis: Ch'i-tiao K'ai hesitates before office, Yen Yan rejects display, and Tsng
    Tz praises a friend who was self-effacing and non-retaliatory.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:11
  confidence: high
  cautions: The motif is moral and behavioral, not supernatural.
- id: motif:4
  label: Substance and ornament held together
  taxonomy_refs:
  - wisdom
  basis: The Odes are interpreted through images of cutting, polishing, background,
    colors, and ornament, and Tz Kung explicitly argues that ornament and substance
    are closely connected.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:15
  confidence: high
  cautions: The imagery is metaphorical and pedagogical; no ritual object is developed
    into a mythic symbol.
- id: motif:5
  label: Indirect moral judgment through exemplary figures
  taxonomy_refs:
  - wisdom
  basis: Tz Kung asks about Po I and Shu Ch'i to infer the Master's stance on the
    Prince of Wei, and other passages assess Yung, Tz-sang Po-tz, a humble late friend,
    and the person of princely type.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: medium
  cautions: The passage supports ethical comparison within the text, but not a wider
    historical or mythological lineage.
- id: motif:6
  label: Universal kinship within the four seas
  taxonomy_refs: []
  basis: Tz Hsia answers the grief of lacking brothers by saying that the respectful
    and courteous higher man has brethren within the four seas.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: This is a moral-social image of brotherhood, not a literal sibling-pair
    or origin motif.
- id: motif:7
  label: Ruler and people share want or plenty
  taxonomy_refs: []
  basis: Yu Jo tells Duke Ai that if the people have plenty the prince cannot be in
    want, and if the people are in want the prince cannot alone have plenty.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The passage presents political-economic counsel, not a sacred exchange
    or covenant narrative.
