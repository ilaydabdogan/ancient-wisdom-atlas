  quote: ''
  summary: 'Translator notes explain key Confucian ethical terms and teachings: li
    as ritual conduct broadened into inward harmony and self-restraint; a hierarchy
    of virtue; Confucius tailoring replies to disciples; judging character by more
    than words; distinctions among te, jn, shu, and chn tz; rejection of returning
    good for evil; and comparison of a maxim of shu with the Golden Rule in negative
    form.'
