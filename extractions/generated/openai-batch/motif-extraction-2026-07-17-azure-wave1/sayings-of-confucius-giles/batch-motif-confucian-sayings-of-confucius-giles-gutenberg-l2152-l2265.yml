canonical_text:
  quote: ''
  summary: Confucius speaks about ethical duties, ceremonial precedent, the aim of
    preventing litigation, criticism of his travels, recognition by Heaven, unified
    knowledge, the value of study over meditation, and whether he may respond to an
    invitation from the rebel Pi Hsi. Editorial notes in the range also mention westward
    disappearance traditions for Png Tsu and Lao Tz and an editor's comparison of
    one saying with Taoist thought.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master lists faithful public service, filial duty at home, careful mourning
    rites, and not being overcome by wine, then asks which of these virtues he has.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: In ceremonies and music, the Master says he uses the earlier period as his
    practical guide, despite later refinement.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master says he is no better than others as an arbiter in litigation, but
    the greater goal is that there be no litigation at all.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wei-sheng Mou accuses Confucius of moving from place to place to show off
    rhetoric; Confucius denies indulging in rhetoric and says he regards obstinacy
    as a fault.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: When Tz Kung asks why none know him, Confucius says he does not complain against
    Heaven or blame people, studies virtue from the bottom upward, and is known by
    Heaven.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Confucius rejects the idea that his learning is merely a mass of retained
    knowledge and says it is strung on one connecting thread.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Confucius says he formerly spent whole days without food and nights without
    sleep in meditation, made no progress, and found study better.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Pi Hsi invites Confucius; Tz Lu objects because Pi Hsi has raised rebellion
    in Chung-mou and because Confucius had warned against intimacy with wrongdoers.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Confucius replies to Tz Lu with sayings about the hard not losing substance
    when rubbed and the white not losing purity when steeped, then asks whether he
    is a bitter gourd fit only to be hung up and not eaten.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: An editorial note says Png Tsu was said to be over 800 years old when he disappeared
    into the west, and that Lao Tz was also alleged to have disappeared westward at
    an advanced age.
  category: other
  evidence_refs:
  - ev:10
- id: obs:11
  text: An editorial note says one saying has a distinctly Taoist flavour because
    it concerns intuitive moral action and Confucius's reliance on experience rather
    than intuitive perception.
  category: other
  evidence_refs:
  - ev:11
