candidate_motifs:
- id: motif:1
  label: Wisdom as discriminating moral judgment
  taxonomy_refs:
  - wisdom
  basis: The Master distinguishes excess from deficiency, tailors instruction to temperament,
    defines proper ministerial service, evaluates disciples' abilities, and praises
    concise settlement of litigation.
  evidence_refs:
  - ev:4
  - ev:10
  - ev:13
  - ev:14
  - ev:15
  confidence: high
  cautions: This is an ethical and didactic pattern rather than a narrative mythic
    episode.
- id: motif:2
  label: Exemplary rulership through private austerity and public-ritual expenditure
  taxonomy_refs:
  - wisdom
  basis: Emperor Y is praised for plain personal consumption and humble dwelling while
    devoting resources to ancestral offerings, state ceremonial clothing, and public
    canals and water-courses.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage praises conduct but does not narrate a full royal foundation
    or legitimacy myth.
- id: motif:3
  label: Ancestral piety through offerings
  taxonomy_refs:
  - sacrifice
  basis: Emperor Y's offerings to ancestral spirits are singled out as showing extreme
    piety.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The text says offerings, but it does not describe the ritual contents
    or a sacrificial victim.
- id: motif:4
  label: Moral progress as approach to an inner sanctuary
  taxonomy_refs:
  - ascent
  - initiation
  basis: The Master says Yu has ascended the steps of the temple but has not yet reached
    the inner sanctuary, presenting progress as movement toward an inner sacred space.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The temple language appears metaphorical within a didactic judgment; no
    formal initiation rite is narrated.
- id: motif:5
  label: Virtue as the mean between excess and deficiency
  taxonomy_refs:
  - wisdom
  basis: In comparing Shih and Shang, the Master says that to exceed is as bad as
    to fall short.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: This is a concise ethical maxim, not a mythological narrative motif.
- id: motif:6
  label: Righteous service limited by moral boundaries
  taxonomy_refs:
  - wisdom
  basis: The Master defines a great minister as serving according to truth and virtue
    and resigning when that is impossible, while also stating that Yu and Chiu would
    not follow a master into parricide or regicide.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The passage gives a normative political teaching rather than a narrated
    crisis.
