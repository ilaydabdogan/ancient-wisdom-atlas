canonical_text:
  quote: ''
  summary: The passage collects sayings in which the Master praises Emperor Y for
    personal austerity, ritual piety, and public waterworks; evaluates disciples by
    virtues and abilities; mourns Yen Yan; gives different advice to different disciples;
    defines the conduct of great ministers; and criticizes improper service to wealth
    and power.
  language: English
  quote_policy: summarized
