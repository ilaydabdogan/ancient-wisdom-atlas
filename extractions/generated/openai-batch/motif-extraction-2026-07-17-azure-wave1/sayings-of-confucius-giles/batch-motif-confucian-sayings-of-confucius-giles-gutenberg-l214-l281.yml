  summary: The passage assesses James Legge’s translation and scholarship on the Confucian
    Canon. It credits him with raising foreign study of Confucian doctrine and compiling
    a coherent account of Confucius’s life, while criticizing his ethical judgments,
    missionary assumptions, and overly rigid translation of Chinese terms. It emphasizes
    the importance, attributed to Confucius, of defining terms and making words correspond
    to things.
