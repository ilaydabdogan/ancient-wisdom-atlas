canonical_text:
  quote: ''
  summary: A sequence of aphoristic teachings concerns proper speech before a superior,
    guarding oneself against age-specific impulses, classes of knowledge and learning,
    pursuit of good and avoidance of evil, the role of habit, virtues distorted by
    lack of learning, the inadequacy of mere ritual objects or musical instruments,
    false virtue, the Master's wish to teach without speaking, and a comment on managing
    girls and servants.
  language: English
  quote_policy: summarized
