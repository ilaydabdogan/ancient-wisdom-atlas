literal_observations:
- id: obs:1
  text: The Master says that ruling a country of a thousand chariots requires careful
    attention to business, honesty, economy, charity, and employing people at the
    proper season.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A virtuous ruler is compared to the Pole-star, which remains in place while
    the other stars do homage to it.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage contrasts despotic rule by punishments with virtuous rule ordered
    by self-control, saying the former may prevent infractions but loses moral sense,
    while the latter retains moral sense and makes people good.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Duke Ai asks how to make the people contented, and Confucius replies that
    promoting the upright and dismissing evil-doers will content them, while the reverse
    will discontent them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chi Kang Tzu asks how to make the people respectful, loyal, and virtuous;
    the Master answers with dignified conduct, filial and kind rulership, promotion
    of the deserving, and instruction of those who fall short.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: When asked why he takes no part in government, the Master cites filial and
    fraternal duty as qualities that affect government, and says holding office is
    not essential.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Master says people can be made to follow a certain path, but cannot be
    made to know the reason why.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: In answer to Tzu Kung, the Master defines good government as enough food,
    enough soldiers, and the confidence of the people; if one must be sacrificed,
    soldiers go first, then food, because without popular confidence no government
    can stand.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ching, Duke of the Chi State, asks about government, and Confucius replies
    that sovereign, subject, father, and son should each do their respective duty.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Chi Kang Tz asks about government, and Confucius says governing is keeping
    straight; if the ruler leads straight, subjects will not fall out of line.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: When Chi Kang Tz is troubled by robbers, Confucius says that if the ruler
    checks his own cupidity there will be no stealing, even if rewards are offered
    for theft.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: When Chi Kang Tz asks about cutting off the lawless, Confucius rejects the
    need for the death penalty and compares the prince's virtue to wind and the people's
    virtue to grass bending before it.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Tz Lu asks for guidance on governing, and the Master tells him to lead, set
    an example of diligent toil, and be patient and untiring.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Chung Kung asks about governing as Prime Minister to the head of the Chi clan,
    and the Master advises employing subordinates, overlooking trifling mistakes,
    and promoting worthy and able men.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Tz Lu says the Prince of Wei is waiting for Confucius to take up the reins
    of government, and the Master says he would first define terms and make them exact.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:16
  text: The Master explains that incorrect terms lead to words not harmonising with
    things, unfinished public business, failure of order and harmony, failure of law
    and justice, and the people's inability to move hand or foot.
  category: sequence
  evidence_refs:
  - ev:16
- id: obs:17
  text: The Master says the wise man frames definitions to regulate speech and speech
    to regulate actions, and is never reckless in choosing words.
  category: speech
  evidence_refs:
  - ev:17
