candidate_motifs:
- id: motif:1
  label: virtuous ruler as fixed center
  taxonomy_refs:
  - world_center
  - royal_legitimacy
  basis: The passage likens a virtuous ruler to the fixed Pole-star receiving homage
    from the other stars.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The image is a political simile, not a full mythic account of a cosmic
    axis or sacred kingship.
- id: motif:2
  label: moral example orders the people
  taxonomy_refs:
  - wisdom
  - royal_legitimacy
  basis: Repeated sayings state that the ruler's dignity, filial conduct, straightness,
    restraint, and virtue shape the people's loyalty, morality, and conduct; the wind-and-grass
    image states this explicitly.
  evidence_refs:
  - ev:5
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  confidence: high
  cautions: This is an ethical-political pattern rather than a narrative myth motif.
- id: motif:3
  label: virtue preferred over coercive punishment
  taxonomy_refs:
  - wisdom
  basis: The passage contrasts punishment-based rule with virtuous rule and explicitly
    questions the need for the death penalty when the ruler sincerely desires goodness.
  evidence_refs:
  - ev:3
  - ev:12
  confidence: high
  cautions: The passage frames the pattern as practical moral instruction, not as
    divine judgment or supernatural sanction.
- id: motif:4
  label: public trust as the foundation of rule
  taxonomy_refs:
  - wisdom
  basis: In the dialogue with Tzu Kung, soldiers and food may be sacrificed before
    the confidence of the people, because without that confidence no government can
    stand.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The motif is institutional and ethical; no symbolic or mythic narrative
    development is supplied.
- id: motif:5
  label: proper names and ordered speech secure public order
  taxonomy_refs:
  - wisdom
  basis: The Master says his first reform would be exact definitions and gives a chain
    in which incorrect terms disrupt words, business, harmony, law, justice, and bodily
    action.
  evidence_refs:
  - ev:15
  - ev:16
  - ev:17
  confidence: high
  cautions: This is a philosophical-political motif of rectification rather than a
    mythological episode.
- id: motif:6
  label: role fulfillment sustains social and political order
  taxonomy_refs:
  - wisdom
  - royal_legitimacy
  basis: Confucius answers that sovereign, subject, father, and son should each do
