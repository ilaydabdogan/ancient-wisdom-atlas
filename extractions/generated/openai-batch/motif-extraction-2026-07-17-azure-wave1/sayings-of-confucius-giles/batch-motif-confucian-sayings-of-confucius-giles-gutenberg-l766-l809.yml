canonical_text:
  quote: ''
  summary: An editorial passage explains that proper names in the Analects can be
    difficult because one person may be referred to by different appellations. It
    contrasts Mr. Ku's use of periphrasis with the editor's choice to preserve the
    Chinese names and provide a reference table of principal disciples. The table
    lists surname/personal names, styles, and mixed appellations, with an asterisk
    marking the name most frequently used.
