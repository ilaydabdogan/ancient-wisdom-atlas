canonical_text:
  quote: At fifteen, my mind was bent on learning.
  summary: A series of sayings and anecdotes presents Confucius describing his own
    learning, ethical self-cultivation, relation to antiquity, teaching practice,
    ritual judgments, public reputation, humility about wisdom and virtue, and responses
    to disciples and officials.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Master says he will not grieve that others do not know him, but will grieve
    that he does not know other men.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master describes a sequence of life stages from age fifteen through seventy,
    moving from learning to standing firm, freedom from delusions, understanding Providence,
    attentiveness to truth, and following the heart without overstepping the mean.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tz Kung proposes doing away with the customary first-day-of-the-month sheep
    sacrifice, and the Master says Tz Kung grudges the sheep while he grudges the
    loss of the ceremony.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master says that in a hamlet of a dozen houses there will be men as honest
    and conscientious as himself, though not as devoted to ethical study.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After visiting Nan Tz and displeasing Tz Lu, Confucius swears a solemn oath
    invoking God’s sight if he has sinned.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Master says his function is to indicate rather than originate, that he
    trusts and loves antiquity, and that he would compare himself with the ancient
    patriarch Png Tsu.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Master names failures in cultivating virtue, examining learning, moving
    toward righteousness, and correcting faults as causes of grief, and laments that
    he has not dreamed of Chou Kung for a long time.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Master says he has refused instruction to no one from the person who brings
    dried meat as payment upward, but does not expound to those who are not eager
    or repeat a lesson to someone who cannot infer the other three corners from one
    corner.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Master says he would pursue riches, even as a chariot-driver, if that
    pursuit were commendable, but he instead follows pursuits more to his taste.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: When Tz Lu fails to answer the Duke of Sh, the Master says he could have described
    him as someone whose zeal for self-improvement makes him forget to eat, forget
    troubles, and not perceive old age.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Master denies that his knowledge is innate and says he loves antiquity
    and studies it earnestly.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: 'The Master says that when walking with two other men, each will serve as
    his teacher: he imitates one person’s good points and corrects in himself the
    other’s bad points.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Master tells his disciples that he has no secrets from them and does nothing
    without communicating it to them.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Master describes a practice of hearing much, sifting out the good and
    practising it, seeing much and retaining it in memory, and calls this the second
    order of wisdom.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The Master says he cannot claim divine wisdom or perfect virtue, but says
    he never falters in his course and is unwearying in instructing others; Kung-hsi
    Hua says the disciples cannot acquire those qualities.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: When the Master is gravely ill, Tz Lu proposes a prayer, cites a precedent
    from the Eulogies addressed to the spirits of Heaven and Earth, and the Master
    answers that his prayers began long ago.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: When a district man calls Confucius great and learned but lacking anything
    that brings fame, the Master asks whether to take up charioteering or archery
    and says he will take up charioteering.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:18
  text: The Master says he follows current custom by accepting silk rather than linen
    for a ceremonial cap, but rejects the current salutation above the dais and adopts
    the humbler position below.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:19
  text: A high officer asks whether the Master is a divine Prophet; Tz Kung answers
    that he is endowed by God and perfected in various arts, while the Master says
    his arts came from low condition in youth and are base accomplishments.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:20
  text: The Master says he is not possessed of true knowledge, but if an ignorant
    lower-class person comes with a question, he will discuss it from end to end and
    set it fully before him.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:21
  text: In response to Tz Kung’s jewel-and-casket question, the Master says he would
    sell the jewel, but would wait until a price was offered.
  category: speech
  evidence_refs:
  - ev:15
