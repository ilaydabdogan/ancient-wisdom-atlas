canonical_text:
  quote: "“The family, in Chinese eyes, is a microcosm of the Empire...”"
  summary: The passage explains Confucian social obligations through an analogy between
    family and state. It presents paternal authority, filial piety, reciprocal duties,
    the principle of li, and rites and ceremonies as visible expressions of inner
    loyalty and respect. It includes an anecdote in which Confucius holds a father
    responsible for failing to teach his son filial conduct.
  language: English
  quote_policy: quoted
