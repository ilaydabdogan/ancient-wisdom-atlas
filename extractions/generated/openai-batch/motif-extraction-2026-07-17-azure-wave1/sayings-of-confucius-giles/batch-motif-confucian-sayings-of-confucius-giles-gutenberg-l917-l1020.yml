canonical_text:
  quote: ''
  summary: 'A sequence of sayings and dialogues presents Confucius answering disciples
    and rulers on government: the ruler’s self-control, justice, sincerity, personal
    uprightness, enrichment and teaching of the people, good rulership, self-reform,
    open remonstrance, service before emolument, Shun’s grave non-action on the throne,
    and a rebuke of ministers supporting an attack on Chuan-y.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fan Chih asks to be taught husbandry and gardening; the Master says farmers
    and gardeners can teach those arts better than he can.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Fan Chih leaves, the Master calls him small-minded and says a ruler’s
    modesty, self-control, justice, duty, sincerity, and good faith will influence
    the people and draw them from all quarters with their children.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master states that personally upright rulers are obeyed without bidding,
    while rulers who are not upright are not obeyed despite commands.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: When the Master goes to Wei, Jan Yu drives the carriage; after remarking on
    the abundant population, the Master says the people should next be enriched and
    then taught.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says that a hundred years of good rulers might stamp out crime
    and abolish the death penalty, and that a kingly sovereign could make natural
    goodness prevail within one generation.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Master says that reforming one’s own heart is relevant to taking part
    in government and to reforming others.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Duke Ting asks whether one sentence can make a country flourish or be ruined;
    Confucius denies that any single sentence has such power by itself, but discusses
    sayings about good kings, ministers, and unopposed royal will.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Duke of Sh asks about good government; the Master says it makes nearby
    people happy and attracts those far away.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tz Hsia, as governor of Ch-fu, is advised not to hurry and not to focus on
    small gains.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tz Lu is told that service to a prince should use no deceit and that opposition
    should be open.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Master says that a ruler’s self-control makes the people docile, and that
    Shun governed well while doing nothing except sitting gravely and self-observantly
    on his throne.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage advises putting actual service to the prince before emolument.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The head of the Chi clan is preparing to attack Chuan-y; Jan Yu and Chi Lu
    report this to Confucius.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Confucius says ancient kings made Chuan-y the centre of worship of the Eastern
    Mng mountain, that it lies within Lu, and that its ruler has independent priestly
    functions.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: Confucius argues that ministers should either hold office when capable or
    resign, and compares ministerial responsibility to blame for a tiger or wild buffalo
    escaping a cage or for a tortoise-shell or jade ornament being smashed in its
    casket.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: Jan Yu says Chuan-y is fortified and near Pi; Confucius rejects this as an
    excuse for greed and says justice, harmony, contentment, refinement, and goodness
    should be used to attract resistant outlying communities.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: Confucius concludes that Chi-sun’s troubles are to be feared from within his
    own palace rather than from Chuan-y.
  category: speech
  evidence_refs:
  - ev:10
