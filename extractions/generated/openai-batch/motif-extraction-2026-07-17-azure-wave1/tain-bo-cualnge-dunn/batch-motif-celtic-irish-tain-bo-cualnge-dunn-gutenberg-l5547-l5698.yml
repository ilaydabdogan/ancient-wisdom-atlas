canonical_text:
  quote: ''
  summary: Cuchulain sits by a pillar-stone playing draughts with Laeg as approaching
    chariots are observed. Laeg describes an ornate chariot-warrior whom Cuchulain
    recognizes as Fergus, noting that Fergus carries a wooden sword in place of his
    own. Fergus arrives, is warmly offered food, lodging, protection, and substitute
    combat by Cuchulain, but states that he has come to bind the terms of single combat.
    Cuchulain pledges himself to the compact if fair single-handed combat is granted,
    and Fergus binds himself to it before returning to the camp.
  language: English
  quote_policy: summarized
