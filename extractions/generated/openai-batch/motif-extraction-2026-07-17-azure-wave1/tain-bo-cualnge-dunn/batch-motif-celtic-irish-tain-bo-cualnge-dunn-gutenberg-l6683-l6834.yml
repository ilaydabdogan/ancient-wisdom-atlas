canonical_text:
  quote: '"Put a man for me on the ford to-morrow," said Cuchulain.'
  summary: After a sword-truce is granted, Cuchulain demands a combatant at the ford.
    Six royal hirelings attack him and are killed. The hosts then choose Cur mac Da
    Loth, a dangerous and disliked warrior, to fight Cuchulain. Cur dismisses Cuchulain
    as a beardless boy, comes to the ford with many weapons, and attacks while Cuchulain
    practices martial feats. Laeg warns Cuchulain, who throws apples; the ninth apple
    strikes Cur through shield and forehead, killing him. A source note reports another
    version locating Cur's fall at Imslige Glendamnach.
  language: English
  quote_policy: quoted
