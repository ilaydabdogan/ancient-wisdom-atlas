canonical_text:
  quote: ''
  summary: Cuchulain warns Ferdiad not to approach him for combat, argues that Finnabair
    has been used as a lure for many warriors, and appeals to their former bond. He
    recalls that he and Ferdiad trained and fought together with Scathach, Uathach,
    and Aife. Ferdiad rejects the appeal, asks which weapons they will use, and is
    given the choice because he reached the ford first. They take matched feat-equipment
    and exchange missiles from early morning until noon without either wounding the
    other, then cease and hand their gear to their charioteers.
  language: English
  quote_policy: summarized
