canonical_text:
  quote: ''
  summary: Bricriu taunts Cuchulain into renewed action. Cuchulain strikes an eel,
    and the cattle surge through the host. The Morrigan then appears as a grey-red
    bitch-wolf, bites Cuchulain, and drives cattle against him; Cuchulain wounds her
    eye with a javelin. While he is engaged, Loch wounds him, but Cuchulain kills
    Loch with the Gae Bulga. Loch asks to fall face east rather than seem to have
    fled; Cuchulain grants the request. Loch dies, Laeg despoils him, and Cuchulain
    cuts off his head. The passage gives place-name explanations, recounts a breach
    of fair fight by five attackers whom Cuchulain kills, and ends with the exhausted
    Cuchulain sending Laeg to summon Ulster’s aid.
  language: English
  quote_policy: summarized
