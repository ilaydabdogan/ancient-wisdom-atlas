    by Cuchulain, describes heads and spoils, notes women and a queen watching without
    joining battle, and advises surrounding and killing him. Fergus macRoig condemns
    the counsel as betrayal, kicks Dubthach, reproaches him for past wrongs, and speaks
    verses accusing Dubthach of killings and incitement while predicting Ulster retaliation,
    corpses, raven-food, and scattered battle-gear. The section closes with an editorial
    note that an obscure fragment is omitted.
