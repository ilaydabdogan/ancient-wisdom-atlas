canonical_text:
  quote: ''
  summary: The passage opens with a catalogue of many warrior triads. Medb urges Fergus
    to use his battle strength on their side, and Fergus responds with an oath of
    extreme bodily destruction if he had his sword. Ailill orders his charioteer Ferloga
    to bring the sword, then places it in Fergus's hand. Fergus greets the named sword
    Calad Colg and enters battle, where the Ulstermen are routed three times before
    being driven back again. Conchobar asks his Red Branch bodyguard to hold its place
    while he investigates, and the bodyguard vows not to retreat unless cosmic catastrophes
    occur.
  language: English
  quote_policy: summarized
