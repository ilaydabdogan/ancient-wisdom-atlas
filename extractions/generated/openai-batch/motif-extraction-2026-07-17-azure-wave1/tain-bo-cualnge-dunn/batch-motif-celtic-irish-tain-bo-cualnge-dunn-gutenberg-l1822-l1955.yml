canonical_text:
  quote: ''
  summary: Fergus defends allied contingents in Medb's army, disperses the Galian
    among the host, and is chosen to go ahead for tidings because of his former kingship
    and exile from Ulster. While leading the host, he sends warnings to the Ulstermen
    and delays the army out of affection for his kin. Medb rebukes him for the devious
    route and threatens to replace him. Fergus remains in front and warns the host
    to beware of Cuchulain, described through martial animal and fire imagery.
  language: English
  quote_policy: summarized
