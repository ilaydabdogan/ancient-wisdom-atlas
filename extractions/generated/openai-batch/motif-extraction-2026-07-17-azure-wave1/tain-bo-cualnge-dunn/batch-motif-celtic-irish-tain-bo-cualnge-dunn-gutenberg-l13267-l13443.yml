canonical_text:
  quote: ''
  summary: Conchobar and Celtchar attack the bodyguard of Ailill and Medb at a ford
    and free captive Ulster women. The passage explains a place-name change for the
    ford. During the night, several figures speak battle prophecies or dreams concerning
    the coming fight at Garech and Ilgarech. Nemain brings confusion on the host,
    causing panic and deaths. The Connacht leaders then plan reconnaissance, and Ailill
    declares he will not retreat before battle.
  language: English
  quote_policy: summarized
