canonical_text:
  quote: ''
  summary: The passage recounts Forgemen the cowherd being trampled when the Brown
    Bull is driven off; Redg the lampoonist demanding Cuchulain's javelin and being
    killed by it; repeated negotiations, broken faith, and single combats involving
    Cuchulain; and an attempted inducement involving Finnabair, during which Mane
    encounters Laeg and Cuchulain and sees Cuchulain's heat melting the snow around
    him.
