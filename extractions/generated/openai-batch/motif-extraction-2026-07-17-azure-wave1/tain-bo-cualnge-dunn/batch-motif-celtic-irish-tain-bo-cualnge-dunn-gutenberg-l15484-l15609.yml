canonical_text:
  quote: ''
  summary: After Cuchulain’s chariot has been reduced to fragments during the fighting,
    Medb sends the Brown Bull of Cualnge and accompanying animals toward Cruachan.
    Medb asks Fergus to shield her while she voids water, producing three large dikes
    and an etiological place-name. Cuchulain finds her but refuses to strike from
    behind or slay a woman; at her request he places the retreating host under his
    protection until it crosses Ath Mor. Laeg brings Cuchulain his sword, with which
    Cuchulain cuts the tops from three hills, producing another place-name. Fergus
    rebukes the defeated host’s leadership, and Conchobar laments Cuchulain as a defender
    of Ulster and recounts the dead and their mourners.
  language: English
  quote_policy: summarized
