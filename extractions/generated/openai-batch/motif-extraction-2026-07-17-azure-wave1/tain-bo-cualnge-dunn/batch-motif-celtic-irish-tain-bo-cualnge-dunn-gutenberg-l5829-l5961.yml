canonical_text:
  quote: ''
  summary: Etarcumul challenges Cuchulain to battle. Cuchulain says he does not wish
    to fight him and twice uses nonlethal strokes while warning him to leave. Etarcumul
    persists and declares that the combat must end with one warrior taking the other's
    head and spoils. Cuchulain then kills and dismembers him. Etarcumul's charioteer
    reports the death to Fergus, who first rebukes Cuchulain because Etarcumul had
    come under Fergus' safeguard, then accepts the charioteer's account that Etarcumul
    was at fault and blesses the hand that struck him.
  language: English
  quote_policy: summarized
