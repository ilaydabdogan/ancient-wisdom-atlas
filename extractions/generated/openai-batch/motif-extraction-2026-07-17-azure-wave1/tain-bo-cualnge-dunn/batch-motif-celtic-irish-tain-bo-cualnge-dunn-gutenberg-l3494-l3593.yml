  text: Conall Cernach is stationed at a ford to guard the province, and champions
    of Ulster take turns on Sliab Fuait to meet visitors or warriors before they reach
    Emain unnoticed.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Conall recognizes that the lad has taken arms and says it is too soon, because
    the lad is not yet capable of deeds or able to cope with a good warrior.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The lad asks Conall to return home and leave him the watch and guard of the
    province, but Conall refuses at first.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The lad says he will go south to Fertas Locha Echtrann, where champions are
    accustomed to stand, and says he may redden his hands on friend or foe that day.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Conall has his horses caught, his chariot yoked, and sets out to protect the
    little boy on the border.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cuchulain picks up a hand-stone, hurls it from his sling at Conall's chariot,
