  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Cuchulain goes south to Fertas Locha Echtrann and remains there until the
    end of the day, with no one found there before them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ibar says it is time to return to Emain because food distribution has begun
