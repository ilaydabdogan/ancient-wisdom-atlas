  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Cuchulain says it is a geis among the men of Ulster to proceed after a mishap
    has befallen their chariots, and he tells Conall to go back to Emain and leave
    him to keep watch.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Conall turns back northward to the Ford of Watching and does not pass that
