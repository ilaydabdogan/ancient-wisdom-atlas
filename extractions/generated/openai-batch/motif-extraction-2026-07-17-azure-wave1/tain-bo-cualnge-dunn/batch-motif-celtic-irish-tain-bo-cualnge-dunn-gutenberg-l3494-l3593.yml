canonical_text:
  quote: ''
  summary: Cuchulain, described as a little boy or lad, encounters Conall Cernach
    guarding the province. Conall judges him too young to take arms or fight and tries
    to protect him. Cuchulain insists on keeping watch and going south toward places
    where champions stand. When Conall follows, Cuchulain disables Conall's chariot
    with a stone cast and invokes an Ulster geis concerning chariot mishaps so that
    Conall turns back. Cuchulain and Ibar then continue to Fertas Locha Echtrann,
    consider returning to Emain, and instead proceed toward Sliab Moduirn and the
    White Cairn.
  language: English
  quote_policy: summarized
literal_observations:
