canonical_text:
  quote: ''
  summary: Curoi son of Dare hears that one man has been stopping four of the five
    provinces of Erin and sets out to fight Cuchulain. Finding Cuchulain badly wounded
    after Ferdiad, he refuses to fight him as unfair. Curoi then confronts Amargin
    near Taltiu with stone-throwing, but after Medb objects to the harm caused, Amargin
    bargains that Curoi cease aiding the men of Erin. Amargin later pelts the hosts,
    killing an unnumbered number while Conall supplies him with weapons. The men of
    Erin negotiate a temporary cessation until the great battle, and the episode is
    named the Deer-stalking of Amargin in Taltiu.
  language: English
  quote_policy: summarized
