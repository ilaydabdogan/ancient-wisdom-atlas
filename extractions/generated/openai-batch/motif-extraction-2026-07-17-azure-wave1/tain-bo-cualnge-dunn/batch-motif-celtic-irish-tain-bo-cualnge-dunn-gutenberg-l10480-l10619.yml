  summary: Cuchulain and Ferdiad face one another at a ford, exchange a wary welcome,
    recall their former association in warrior training, renounce friendship through
    reproachful speeches, threaten each other with death, and Cuchulain warns that
    Ferdiad has been drawn into the combat by Ailill and Medb's false promises.
