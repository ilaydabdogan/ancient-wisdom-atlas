canonical_text:
  quote: '"I call on the waters to help me," cried Cuchulain.'
  summary: The armies gather and camp. Cuchulain and Laeg come before the ford of
    the Cronn, where Cuchulain invokes the waters, heaven, earth, and the Cronn; the
    water rises. Cuchulain kills Mane son of Ailill and Medb at the ford, drowns or
    slays many warriors, negotiates a truce through Lugaid with tokens and provisions,
    and continues killing warriors at named fords, including Ailill's charioteer Cuillius,
    whose death explains the ford-name Ath Cuillne.
  language: English
  quote_policy: quoted
