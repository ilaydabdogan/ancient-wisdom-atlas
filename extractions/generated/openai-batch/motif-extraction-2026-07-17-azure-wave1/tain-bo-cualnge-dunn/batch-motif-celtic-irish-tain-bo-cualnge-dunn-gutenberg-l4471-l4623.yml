canonical_text:
  quote: ''
  summary: 'The four provinces of Erin move out and harry Breg and Murthemne. Fergus
    warns the host that Cuchulain will come against them and sings of Cuchulain''s
    deeds and the host''s impending danger. Donn, the Brown Bull of Cualnge, enters
    Margine/Sliab Culinn with heifers and paws the earth. The Morrigan, daughter of
    Ernmas, appears as a bird on a standing-stone and warns the Brown Bull that the
    men of Erin seek him and that he will be taken and slain unless he is on guard.
    After hearing her words, the Brown Bull moves to Glenn na Samaisce with his heifers
    and herdsman Forgemen. The passage then lists the Brown Bull''s magic virtues:
    extraordinary fertility, carrying youths on his back, sheltering warriors, repelling
    hostile supernatural beings, and musical evening lowing.'
  language: English
  quote_policy: summarized
