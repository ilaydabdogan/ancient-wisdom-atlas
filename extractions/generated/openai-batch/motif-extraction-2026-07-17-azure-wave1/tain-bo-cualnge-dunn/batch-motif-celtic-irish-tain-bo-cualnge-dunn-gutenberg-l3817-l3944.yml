canonical_text:
  quote: ''
  summary: Cuchulain leaves a burned and pillaged fort with the three heads of Necht
    Scene's sons and spoils, drives rapidly toward Emain Macha with Ibar, captures
    wild deer alive, brings down swans with sling-stones, restrains dangerous animals
    by his look and command, and proceeds to Emain with deer, swans, heads, jewels,
    treasure, and wealth arranged around the chariot.
  language: English
  quote_policy: summarized
