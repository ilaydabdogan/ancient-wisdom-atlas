canonical_text:
  quote: ''
  summary: Medb and Ailill compare their possessions and livestock. Their goods are
    mostly equal, but Ailill has the exceptional bull Finnbennach, formerly from Medb's
    herd. Medb sends macRoth with couriers to seek the loan of Donn Cualnge, the Brown
    Bull of Cualnge, from Dare son of Fiachna, offering compensation and friendship.
    Dare receives the messengers, agrees to send the bull, and the messengers later
    speak drunkenly about his generosity and Conchobar's superiority.
  language: English
  quote_policy: summarized
