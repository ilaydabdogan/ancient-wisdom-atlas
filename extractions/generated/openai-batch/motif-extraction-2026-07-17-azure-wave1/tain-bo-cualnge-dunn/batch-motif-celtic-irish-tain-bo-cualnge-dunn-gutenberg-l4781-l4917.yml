canonical_text:
  quote: ''
  summary: Medb urges her people to meet Cuchulain, but they refuse. The army moves
    through Cualnge, unable to cross certain waters, digging through a mountain, camping,
    driving cattle, and creating named places. Later Medb divides the foray. Ailill
    sends Cuillius to spy on Medb and Fergus; Cuillius steals Fergus's sword as a
    token, and Fergus later fashions a substitute sword from a tree, giving rise to
    another place-name.
  language: English
  quote_policy: summarized
