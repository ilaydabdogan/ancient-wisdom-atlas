canonical_text:
  quote: ''
  summary: MacRoth reports two armed companies arriving at the mound in Slane of Meath.
    Fergus identifies the first vanguard youth as Conall Cernach and characterizes
    him with martial, animal, and natural images. A second richly equipped company
    arrives around a small youth; Fergus is uncertain but thinks they are the men
    of Temair with Erc, related to Conchobar, and predicts that the youth's fearless
    entry into battle will provoke Conchobar and the Ulster warriors to rescue him
    and win the battle.
  language: English
  quote_policy: summarized
