canonical_text:
  quote: ''
  summary: 'MacRoth reports to Ailill, Medb, and Fergus that Cuchulain has not accepted
    the previous terms and that MacRoth will not parley with him again. Fergus explains
    Cuchulain''s terms: a single champion from the men of Erin is to fight him each
    day at the ford; the army may march while that fight occurs, or else halt until
    morning; the cattle are not to be taken by the ford; wounded Ulstermen near him
    are to be healed without payment; royal women who love him are to be brought to
    him with purchase and bride-price; and his provisions are to be supplied, though
    Fergus says he will waive food and clothing. Medb accepts the terms as preferable
    to losing many men nightly, and Fergus requires bonds, covenants, pledges, and
    bail. Fergus then sets out to convey the terms, and Etarcumul follows to see Cuchulain.
    Fergus warns Etarcumul not to seek combat or treat Cuchulain with contempt.'
  language: English
  quote_policy: summarized
