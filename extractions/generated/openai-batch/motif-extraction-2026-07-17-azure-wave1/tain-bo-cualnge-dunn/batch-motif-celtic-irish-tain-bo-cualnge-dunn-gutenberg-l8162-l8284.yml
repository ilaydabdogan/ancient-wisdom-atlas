canonical_text:
  quote: '"Thy father from Faery am I, even Lug son of Ethliu."'
  summary: The armies of four provinces camp at Breslech Mor while Cuchulain takes
    station nearby at Ferta in Lerga. Enraged by the enemy host, he raises a terrifying
    hero's shout that supernatural beings answer, and Nemain/Badb throws the camp
    into confusion so that many warriors die of fright. Laeg sees a splendid single
    armed man crossing the camp unheeded. The visitor, Lug son of Ethliu, identifies
    himself as Cuchulain's father from Faery, offers to oppose the hosts while Cuchulain
    sleeps, and heals him during a three-day sleep with chant, herbs, plants from
    the fairy-rath, and a healing charm.
  language: English
  quote_policy: quoted
