canonical_text:
  quote: ''
  summary: Ailill and Medb, in their royal bed at Cruachan, debate which of them has
    greater wealth, rank, and authority. Medb recounts her royal descent, riches,
    martial strength, rejected suitors, and exceptional marriage requirements. She
    says she chose Ailill and gave him a purchase-price. Ailill counters with his
    own royal connections, maternal succession, and wealth claim.
  language: English
  quote_policy: summarized
