canonical_text:
  quote: ''
  summary: After earlier challengers fall to Cuchulain in single combat, the men of
    Erin seek another warrior to face him at the ford. They choose Ferbaeth son of
    Ferbend because he is Cuchulain's friend, foster-brother, equal in arms, and fellow
    trainee under Scathach. Medb promises him Finnabair and kingship as rewards. Though
    Ferbaeth acknowledges his bond and covenant with Cuchulain, he says he will meet
    him. Cuchulain sends Laeg to learn who will attack him; Lugaid son of Nos reveals
    that Ferbaeth has been chosen and entertained with Finnabair, drink, food, and
    kisses. Laeg returns sorrowfully and reports this to Cuchulain.
  language: English
  quote_policy: summarized
