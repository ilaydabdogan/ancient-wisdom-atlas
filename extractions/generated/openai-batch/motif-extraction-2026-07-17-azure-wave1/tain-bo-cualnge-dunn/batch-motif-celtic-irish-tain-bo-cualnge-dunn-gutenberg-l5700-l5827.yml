canonical_text:
  quote: ''
  summary: Etarcumul gazes at Cuchulain, admires his youthful beauty and feats, but
    dismisses him as lacking the terror of a true warrior. Cuchulain says Etarcumul
    is safe only because he came under Fergus's protection. Etarcumul invokes the
    terms of fair single combat and declares he will fight Cuchulain at the ford.
    After speaking with his charioteer, he turns back immediately and vows to bring
    Cuchulain's head as a trophy. The chariot's left board faces Cuchulain's side,
    a hostile sign noted in the passage. Laeg alerts Cuchulain, who arms himself,
    goes to the ford, bares his sword, and waits.
  language: English
  quote_policy: summarized
