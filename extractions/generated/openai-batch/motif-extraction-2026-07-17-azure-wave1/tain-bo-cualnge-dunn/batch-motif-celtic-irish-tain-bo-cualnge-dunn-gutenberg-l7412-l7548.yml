canonical_text:
  quote: ''
  summary: Medb offers rich rewards and Finnabair to warriors who will fight Cuchulain.
    Long accepts and is killed by Cuchulain at the ford; his brother Loch reacts to
    the report. Medb orders an unfair attack, then sends women to urge Cuchulain to
    put on a false beard so that adult warriors will agree to face him. Cuchulain
    makes a beard from grass by a spell and displays it. Loch is offered terms but
    delays seven days, during which nightly spies sent against Cuchulain are all slain.
    Medb then plans a false truce to catch Cuchulain unarmed, but Laeg warns him to
    carry his sword.
  language: English
  quote_policy: summarized
