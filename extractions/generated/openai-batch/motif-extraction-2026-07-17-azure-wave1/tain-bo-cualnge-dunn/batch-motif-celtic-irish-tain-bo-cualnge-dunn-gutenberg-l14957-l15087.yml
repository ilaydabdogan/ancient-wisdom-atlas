canonical_text:
  quote: ''
  summary: The passage describes the opening of the battle of Garech. The Ulstermen
    rise suddenly for battle, Conchobar delays them until a favourable omen and sunlight
    appear, and Sencha rouses them with a violent battle speech. Laeg reports the
    fighting to Cuchulain, who laments that he is not yet strong enough to join. Reinforcing
    fighters and battle-governors of the men of Erin arrive, with the governors assigned
    to kill Conchobar if defeated and to rescue Ailill and Medb if they are defeated.
  language: English
  quote_policy: summarized
