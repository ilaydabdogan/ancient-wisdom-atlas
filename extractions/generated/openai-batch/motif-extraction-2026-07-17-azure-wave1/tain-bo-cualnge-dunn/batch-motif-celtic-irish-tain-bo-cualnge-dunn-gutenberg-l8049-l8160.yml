canonical_text:
  quote: ''
  summary: After Cuchulain becomes exhausted and thirsty, the Morrigan comes from
    the fairy dwellings disguised as an old hag milking a three-teated cow. She gives
    him three milkings; after he drinks and blesses her, the wounds he had caused
    are healed. She reveals herself, then later appears as a royston crow on a bramble,
    giving rise to a place-name. Medb sends a hundred armed bodyguard warriors against
    Cuchulain, and he kills them at a ford, producing further place-name explanations
    connected with gore and blood.
  language: English
