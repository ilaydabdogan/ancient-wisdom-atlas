- id: obs:1
  text: Sualtaim departs with warnings to the men of Ulster.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cuchulain cuts the prime sapling of an oak with a single blow, uses only one
    foot, one hand, and one eye, makes a twig-ring from it, writes ogam on the plug,
    and sets the ring around a pillar-stone at Ard Cuillenn.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men of Erin come to the pillar-stone at Ard Cuillenn and look out on the
    province of Ulster, which is described as unknown to them.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Two sons of Nera, Err and Innell, regularly go before the host, with their
    charioteers Fraech and Fochnam, at camps, marches, fords, rivers, and gaps.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The nobles of Erin see signs of horses browsing near the pillar-stone and
    inspect the hoop left there.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ailill gives the withy to Fergus, and Fergus reads the ogam writing on it
    for the men of Erin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Fergus says the writing forbids anyone to pass until a man can throw a like
    withy made from one branch with one hand, excepting Fergus himself; he identifies
    Cuchulain as the maker.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A druidic lay describes the withy as made by a hero and chief, as a trap for
    foes and a stayer of lords, and says one man cast it with one hand.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Fergus warns that if the host disregards the withy and passes without either
    camping one night or reproducing the feat with one foot, one eye, and one hand,
    the writer of the ogam will bring slaughter and bloodshed before morning.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Medb says she does not want their own blood spilled in the unknown province,
    and Ailill says they will not set the withy or its maker at naught but will camp
    in Fidduin until morning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The host advances by felling the wood with swords before their chariots, and
