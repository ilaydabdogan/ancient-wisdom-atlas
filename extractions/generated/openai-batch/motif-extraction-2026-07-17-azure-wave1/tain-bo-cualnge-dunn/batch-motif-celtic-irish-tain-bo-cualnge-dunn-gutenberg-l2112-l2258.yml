canonical_text:
  quote: ''
  summary: Cuchulain cuts an oak sapling, makes a withy ring with ogam writing, and
    fastens it around a pillar-stone at Ard Cuillenn. The host of Erin reaches the
    stone, Fergus reads the message, and the army is told not to pass unless one man
    can make an equivalent withy, or unless they camp for the night. Medb and Ailill
    choose not to disregard the sign and the host camps in the wood; later they advance
    by felling a path through the wood, explaining the by-name Slechta, the Hewn Road.
  language: English
  quote_policy: summarized
