canonical_text:
  quote: ''
  summary: The host begins its march from Cruachan, camps at Cul Silinne near Cargin's
    Lough, and arranges tents around Ailill. Medb, with Finnabair and Flidais nearby,
    reviews the host from nine chariots while seeking tidings, augury, and knowledge.
    She praises the Galian/Leinster division for exceptional efficiency but argues
    they should be destroyed because they may become dangerous; Ailill objects, Fergus
    defends them as Ulster allies, and Medb answers by listing the forces she could
    use against Fergus and the Leinstermen.
  language: English
  quote_policy: summarized
