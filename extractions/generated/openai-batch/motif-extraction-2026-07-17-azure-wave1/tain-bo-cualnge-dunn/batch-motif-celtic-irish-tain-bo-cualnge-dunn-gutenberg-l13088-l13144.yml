canonical_text:
  quote: '"Men are slain, women stolen, cattle lifted, ye men of Ulster!"'
  summary: Sualtaim leaves the men of Ulster angry, rides toward Emain, and dies when
    his own shield cuts off his head. His horse returns to Emain carrying the shield
    and the head, and the head repeats a warning about slain men, stolen women, and
    lifted cattle. Conchobar answers with a vow to restore the women and cattle unless
    cosmic disasters overturn the world, then summons Findchad to muster the men of
    Ulster.
  language: English
  quote_policy: quoted
