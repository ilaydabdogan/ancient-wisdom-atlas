  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Fergus identifies this man as Fingin the prophet mediciner, physician of Conchobar,
    and says he can know a man's sickness by the smoke of the house where he lies
    or by hearing his groans.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: A powerful turbulent company causes uproar in feats of arms and tears up the
