canonical_text:
  quote: ''
  summary: 'A sequence of companies arrives at the mound in Slane of Meath. MacRoth
    describes them and Fergus identifies their leaders: Cathba with druids who read
    clouds and work elemental spells; Fingin with medical attendants who diagnose,
    cure, and foretell illnesses; Conchobar''s household under Glasne and Menn; Ercenn
    in chains and Triscoth the stone-flinging strongman; and the three sons of Conchobar,
    Glas, Mane, and Conaing, described with triadic martial epithets.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A company comes to the mound in Slane of Meath with multicolored mantles,
    a white-grey broad-eyed hero in front, and two youths near him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One of the cunning men looks to heaven, scans the clouds, and conveys their
    answer to the troop.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The company watches the clouds and works spells against the elements, causing
    the elements to war and discharge rain-clouds of fire on the camp and entrenchments
    of the men of Erin.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Fergus identifies the leader as Cathba, describes him as a foundation of knowledge
    and master of the elements, and says he makes augury to learn how the battle on
    Garech and Ilgarech will end.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fergus identifies the two youths near Cathba as Cathba's sons, Imrinn and
    Genonn Gruadsolus, also called Bright-cheek.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: Another bright-faced company wears unusual garments and each man has a little
    bag at his waist.
  category: object
  evidence_refs:
