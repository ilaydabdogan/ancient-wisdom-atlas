canonical_text:
  quote: ''
  summary: 'MacRoth, identified as a chief runner, surveys the plain of Meath and
    twice reports overwhelming sounds and sights: first a crash like cosmic and earthly
    upheaval, then a vast grey mist with images of islands, caverns, snow, birds,
    stars, and fire. Fergus explains these signs as the advancing Ulstermen, newly
    arisen from their Pains, with chariots, horses, weapons, dust, foam, and furious
    eyes.'
  language: English
  quote_policy: summarized
