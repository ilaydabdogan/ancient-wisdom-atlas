canonical_text:
  quote: ''
  summary: Ailill asks Fergus who could have entered their lands and killed four men
    so quickly. Fergus rejects several renowned Ulster figures as unlikely because
    each would have brought large forces or fought openly. He then identifies the
    likely actor as Cuchulain, his and Conchobar's nursling, saying Cuchulain could
    have felled the tree, killed the four, and come to the border with his charioteer.
    Fergus recounts Cuchulain's youthful martial deeds, training, wooing of Emer,
    taking of arms, present age, and unmatched ferocity through a long catalogue of
    battle and animal images.
  language: English
  quote_policy: summarized
