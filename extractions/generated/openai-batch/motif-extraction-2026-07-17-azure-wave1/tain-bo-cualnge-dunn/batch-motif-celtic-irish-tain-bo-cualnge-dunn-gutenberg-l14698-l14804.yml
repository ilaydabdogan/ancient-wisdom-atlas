canonical_text:
  quote: ''
  summary: Fergus identifies three battle-wheeled towers and explains from past experience
    how they may be defeated by a concealed pitfall. He reports their foreign origin
    and Ulster occupants, warns Medb's side of danger, and offers a delaying defense.
    macRoth reports a mournful company from Murthemne lacking Cuchulain; Medb and
    Fergus dispute the harms done and avenged. A later uproar is identified as the
    wounded Cuchulain straining to join battle while restrained by the Ulstermen.
    Two women lampoonists, Fethan and Collach, then come from the camp of the men
    of Erin, feigning lamentation and telling Cuchulain dire news.
  language: English
  quote_policy: summarized
