  summary: Cuchulain arms himself with layered armor, numerous weapons, shields, a
    gemmed war-helm, a veil of concealment from the Land of Promise, and a protective
    fan. Supernatural beings are said to scream around him when he goes to shed heroic
    blood. He then undergoes his first twisting-fit, violently distorting his body
    into a terrible many-shaped form.
