canonical_text:
  quote: ''
  summary: In a narrated episode of Cuchulain's youthful exploits, Cathba the druid
    predicts that whoever takes arms on that day will win lasting renown but live
    briefly. Cuchulain overhears the prediction, asks Conchobar for arms, breaks ordinary
    and reserve weapons, and finds only Conchobar's own arms suitable. When Cathba
    clarifies the prophecy, Cuchulain accepts a short life if his fame and deeds endure.
    A following episode repeats the omen pattern for mounting a chariot, and Cuchulain
    asks Conchobar for one.
  language: English
  quote_policy: summarized
