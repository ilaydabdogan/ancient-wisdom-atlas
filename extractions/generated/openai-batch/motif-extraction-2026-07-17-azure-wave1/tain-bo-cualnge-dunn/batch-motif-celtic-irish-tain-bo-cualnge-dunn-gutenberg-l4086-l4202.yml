canonical_text:
  quote: ''
  summary: Fiachu recalls Cuchulain's extraordinary childhood deeds and says that,
    at seventeen during the Tain, such feats should no longer cause surprise. The
    men of Ulster rejoice while the men of Erin grieve. In a separate version of the
    route narrative, Cuchulain fells an oak, writes an ogam condition on it, and blocks
    the host until a chariot-warrior can overleap it. Attempts to cross cause horses
    and chariots to fall and break. Medb sends Fraech against Cuchulain; Fraech wrestles
    him in the water and is drowned after refusing to acknowledge that Cuchulain saved
    him once. Fraech's corpse is mourned, and green-clad women carry it into a fairy
    dwelling. Further notices describe Fergus overleaping the oak-stump, alternate
    killings at Ath Meislir, Cuchulain killing Medb's whelp Baiscne, and another version
    concerning the deaths of a youth beside Medb and a pet bird.
  language: English
  quote_policy: summarized
