canonical_text:
  quote: ''
  summary: 'The passage narrates Larine''s armed challenge to Cuchulain at the ford,
    where Cuchulain meets him unarmed, disarms and maims him, and hurls him back into
    camp. It then presents the colloquy of the Morrigan and Cuchulain: a beautiful
    young woman offers love, treasures, cattle, and aid; after Cuchulain refuses,
    she threatens to oppose him in the shapes of an eel, a grey she-wolf, and a hornless
    red heifer, while he threatens corresponding injuries. The passage ends with the
    men of Erin selecting Loch son of Mofemis to fight Cuchulain; Loch refuses to
    fight a beardless boy and proposes his brother Long instead.'
  language: English
  quote_policy: summarized
