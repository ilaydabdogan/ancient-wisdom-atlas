canonical_text:
  quote: THE RED-SHAME OF MENN FOLLOWETH HERE
  summary: Menn son of Salcholga arrives from Renna of the Boyne with twelve armed
    men carrying spears headed at both ends. They make three attacks on the hosts,
    kill three times their own number, and lose all but Menn, who is badly wounded
    and bloodied. The men of Erin call the event Menn's Reddening Shame. They then
    say Menn may leave without dishonour, while the hosts withdraw a day's journey
    to wait until Conchobar recovers and the foretold great battle occurs. Menn agrees
    and returns to his own land.
  language: English
  quote_policy: quoted
