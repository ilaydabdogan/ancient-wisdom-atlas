canonical_text:
  quote: ''
  summary: 'Cuchulain, wounded after combat with Loch and other attackers, laments
    that he is alone guarding the cattle and fords and asks that word be brought to
    Conchobar and the Ulster chiefs. He recalls wounds from Loch, a wolf, and an eel,
    and the killing of Loch with Aife''s spear sent by Laeg. After the combat, enemies
    are sent against him in groups despite the terms of single combat: five men, then
    six druid-men and druid-women, and later other named men. Because the covenant
    and fair-dealing have been broken, Cuchulain uses his sling against the host from
    Delga, terrifying them and killing many by sunrise.'
  language: English
  quote_policy: summarized
