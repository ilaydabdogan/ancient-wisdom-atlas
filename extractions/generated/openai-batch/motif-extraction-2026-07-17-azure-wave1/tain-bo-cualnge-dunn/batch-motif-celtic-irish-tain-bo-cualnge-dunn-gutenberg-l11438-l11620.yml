  summary: After the combat with Ferdiad, Cuchulain speaks with Laeg, laments Ferdiad,
    blames deception and ignored counsel for the fight, remembers their former comradeship
    with Scathach, has Laeg remove Ferdiad's armor and the brooch associated with
    the combat, laments over the brooch and Ferdiad's possessions, and then orders
    Laeg to cut out the Gae Bulga from Ferdiad's body.
