canonical_text:
  quote: ''
  summary: Medb gathers the men of Erin at Cruachan to watch the Brown Bull of Cualnge
    and Finnbennach, the Whitehorned of Ai, fight. Bricriu is selected as an impartial
    witness and judge, but the fighting bulls trample him to death. Cormac strikes
    and reproaches the Brown Bull, who understands the speech, becomes enraged, and
    injures the Whitehorned. The bulls continue fighting through the day and roam
    across much of Erin by night, giving rise to bull-named places.
  language: English
  quote_policy: summarized
