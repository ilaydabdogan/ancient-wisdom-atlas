canonical_text:
  quote: ''
  summary: 'Cuchulain and Ferdiad cease fighting for the night, disarm, greet each
    other affectionately, and are tended by charioteers and healers. Each sends aid
    to the other across the ford: Cuchulain sends matching healing remedies, while
    Ferdiad sends matching food and drink. The next morning Cuchulain notices an evil,
    dark change in Ferdiad’s appearance and laments that Ferdiad is fighting his foster-brother
    and friend because of a woman’s counsel and concern for reputation with Medb and
    other nobles. In verse the warriors speak of doom, grave, Medb, Finnabair, fame,
    betrayal, and sorrow at fighting one another. Ferdiad chooses heavy swords for
    the day’s combat, and the two champions wound each other severely with swords
    and shields.'
  language: English
  quote_policy: summarized
