canonical_text:
  quote: ''
  summary: MacRoth, envoy of Ailill and Medb, encounters Laeg and then Cuchulain,
    who is sitting in the snow. MacRoth first fails to recognize Cuchulain and brings
    terms offering captured milch-kine and bondwomen if Cuchulain will stop using
    his staff-sling against the host. Cuchulain refuses, explaining that such terms
    would disgrace Ulster. MacRoth reports back to Medb, Ailill, and Fergus; Fergus
    identifies the man as Cuchulain. Medb proposes a second offer of dry cattle and
    noble captive women. MacRoth returns, now recognizing Cuchulain, but Cuchulain
    again refuses and says that only terms known by someone in the camp will be accepted;
    otherwise anyone approaching him with further offers will be at risk of death.
  language: English
  quote_policy: summarized
