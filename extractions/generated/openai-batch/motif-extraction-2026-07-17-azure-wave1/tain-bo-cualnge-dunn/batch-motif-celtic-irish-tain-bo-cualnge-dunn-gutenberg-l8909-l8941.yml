  summary: A bold young Ulster warrior, Oengus son of Oenlam Gabe, approaches the
    hosts, drives them from one place to another, blocks their passage, and showers
    them with stones. A learned comment says he would have slain two-thirds of the
    host in single combat, but instead the host attacks him by ambush from every side
    and he falls in an unequal fight at Ath da Fert in Sliab Fuait.
