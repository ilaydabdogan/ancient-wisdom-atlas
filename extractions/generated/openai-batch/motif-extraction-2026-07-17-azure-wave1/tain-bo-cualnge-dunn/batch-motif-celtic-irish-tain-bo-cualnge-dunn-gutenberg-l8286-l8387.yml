canonical_text:
  quote: ''
  summary: The youths of Ulster come from Emain Macha to aid Cuchulain while he sleeps.
    Led by Follomain, they fight the hosts and are killed, except briefly for Follomain,
    who vows to take Ailill's head and gold diadem but is himself slain by two sons
    of Bethe son of Ban. Cuchulain awakens after three days and nights, strengthened,
    hears the account from a young warrior from Faery, laments that he was not present,
    and seeks vengeance. The young warrior refuses to stay because any glory would
    accrue to Cuchulain, advises him to fight alone, says the hosts do not have power
    over his life on this occasion, then vanishes. Cuchulain calls on Laeg to prepare
    the scythed chariot.
  language: English
  quote_policy: summarized
