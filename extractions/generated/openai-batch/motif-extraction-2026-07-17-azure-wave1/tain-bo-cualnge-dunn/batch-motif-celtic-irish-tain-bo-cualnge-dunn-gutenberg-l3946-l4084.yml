canonical_text:
  quote: ''
  summary: Cuchulain returns toward Emain in a chariot with trophies and captured
    animals, still violent from combat. Lebarcham warns Conchobar that, unless he
    is attended to, he will kill the youths of Ulster. Conchobar arranges for women
    to confront him by exposing themselves; Cuchulain averts his gaze, is removed
    from the chariot, and is cooled in three vats of water until his wrath subsides.
    He is then dressed richly, described with extraordinary bodily features, armed,
    seated between Conchobar’s feet, and stroked by the king.
  language: English
  quote_policy: summarized
