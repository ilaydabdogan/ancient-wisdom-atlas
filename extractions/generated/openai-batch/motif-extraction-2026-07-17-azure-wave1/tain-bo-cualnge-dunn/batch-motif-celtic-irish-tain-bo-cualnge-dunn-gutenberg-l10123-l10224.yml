canonical_text:
  quote: ''
  summary: Ferdiad wakes troubled by the coming combat with Cuchulain and by the consequences
    of breaking his pledge to Medb and Ailill. His charioteer urges him not to go,
    but Ferdiad insists on setting out by chariot toward the ford of battle. He turns
    back briefly to bid farewell to the men of Erin; Medb predicts he will not return
    on the same feet. Ferdiad reaches the ford and asks whether Cuchulain is there,
    but Cuchulain is not visible.
  language: English
  quote_policy: summarized
