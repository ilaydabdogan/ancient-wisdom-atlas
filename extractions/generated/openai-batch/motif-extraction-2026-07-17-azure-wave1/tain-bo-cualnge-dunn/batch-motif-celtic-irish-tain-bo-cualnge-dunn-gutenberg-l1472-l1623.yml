  summary: Medb repeatedly asks Fedelm the prophet-maid to report what she sees of
    the host. Fedelm repeatedly foresees the host crimson with blood. Medb dismisses
    the augury by citing reports that the Ulstermen are incapacitated, but Fedelm
    then prophesies the coming of Cuchulain, describing his appearance, weapons, battle
    transformation, and the destruction he will bring upon the men of Erin.
