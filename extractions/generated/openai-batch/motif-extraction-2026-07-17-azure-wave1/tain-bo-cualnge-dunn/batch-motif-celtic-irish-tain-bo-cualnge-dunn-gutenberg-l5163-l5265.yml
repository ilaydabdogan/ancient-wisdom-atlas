canonical_text:
  quote: ''
  summary: Cuchulain refuses terms offered by Medb and insists on recovering cattle
    and a woman taken from the Gael. The opposing host camps at Druim En without normal
    comforts while Cuchulain kills a hundred warriors each night. Medb and Ailill
    discuss a parley offering milk-bearing cattle and captive women if Cuchulain will
    stop attacking them at night. MacRoth is sent as messenger after Fergus indicates
    Cuchulain's likely location. In heavy snow, Cuchulain's battle heat melts the
    snow around him; Laeg describes an approaching man whose equipment Cuchulain recognizes
    as heraldic signs.
  language: English
  quote_policy: summarized
