  summary: MacRoth waits at Slane of Meath and reports to Ailill, Medb, Fergus, and
    the nobles of Erin on the Ulster host assembling there. He describes the Ulstermen
    arriving in ordered divisions and gives detailed accounts of three companies,
    each with a prominent warrior leader, rich garments, weapons, shields, and followers
    arranged around or near him.
