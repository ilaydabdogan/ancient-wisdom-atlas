canonical_text:
  quote: ''
  summary: A little boy identified as Cuchulain tests chariots at Emain, destroying
    the ordinary chariots kept for the youths until Conchobar's own chariot withstands
    him. On his first day of taking arms, he has Ibar drive him around Emain, receives
    the boys' blessing, asks where the road leads, learns of the guarded Ford of Watching
    in Sliab Fuait, and asks to be guided there, where Conall Cernach is on guard.
  language: English
  quote_policy: summarized
