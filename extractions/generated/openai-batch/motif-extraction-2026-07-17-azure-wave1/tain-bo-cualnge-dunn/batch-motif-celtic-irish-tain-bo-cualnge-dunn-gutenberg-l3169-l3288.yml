canonical_text:
  quote: ''
  summary: 'Setanta follows the company to Culann the Smith while playing with his
    toys. Culann''s watch-hound attacks him, and the boy kills it with his ball and
    by striking it against a pillar-stone. Culann laments the loss of the hound that
    guarded his life and livestock. Setanta offers judgement: he will rear a whelp
    of the same breed if one exists, and until then he himself will act as Culann''s
    hound and protect Culann''s land and cattle. Conchobar and Cathba approve the
    judgement; Cathba proposes the name Cuchulain, ''Wolfhound of Culann,'' which
    becomes the boy''s famous name. Cormac Conlongas notes that the deed was done
    when the boy was six and uses it to frame later expectations of his prowess.'
  language: English
  quote_policy: summarized
