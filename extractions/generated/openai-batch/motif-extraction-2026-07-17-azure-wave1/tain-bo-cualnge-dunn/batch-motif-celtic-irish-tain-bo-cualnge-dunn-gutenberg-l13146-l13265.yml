  quote: ''
  summary: The passage opens with a long list of named people and places to be approached.
    It then states that Finnchad easily gathered the assembly and muster commanded
    by Conchobar. Ulstermen from several directions around Emain set out, some to
    the field of Emain and some directly along the host’s trail. Conchobar leads the
    first stage from Emain to Iraird Cuillinn; when the men delay to await Fiacha
    and Fiachna returning from Tara with Erc and reinforcements, Conchobar refuses
    further delay because the men of Erin do not know whether he has recovered or
    is alive.
  language: English
