canonical_text:
  quote: ''
  summary: Nathcrantail goes from the camp to attack Cuchulain, carrying fire-hardened
    holly spits rather than ordinary arms. He finds Cuchulain fowling at a pond with
    his chariot nearby. Nathcrantail throws darts, and Cuchulain leaps onto their
    points while continuing to pursue birds for food. Nathcrantail interprets this
    as flight and boasts of it before Ailill and Medb; Medb accepts the claim. Fergus
    and the Ulstermen are angered, and Fergus sends Fiachu to rebuke Cuchulain. Cuchulain
    replies that he does not kill charioteers, heralds, or unarmed people, says Nathcrantail
    bore only a wooden spit, and challenges him to return armed the next morning between
    Ochaine and the sea.
  language: English
  quote_policy: summarized
