canonical_text:
  quote: ''
  summary: 'Fergus recounts the beginning of Cuchulain''s youthful exploits: the boy
    hears of the youths at Emain, insists on going there despite his mother''s warning,
    travels with his playthings while performing feats, enters the play-field without
    first obtaining protection, defeats the boys in play, is attacked by the boy-troop,
    parries their missiles, and undergoes bodily contortions with a champion''s light
    rising from his crown.'
  language: English
  quote_policy: summarized
