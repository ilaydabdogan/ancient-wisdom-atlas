canonical_text:
  quote: ''
  summary: 'MacRoth reports several companies arriving at the hill or mound in Slane
    of Meath. Ailill repeatedly asks who leads them, and Fergus identifies the warriors:
    Fergus son of Lete, Amargin son of Ecetsalach, Feradach Finn Fectnach, and the
    three sons of Fiachna, Ros, Dare, and Imchad. The passage emphasizes their appearance,
    arms, banners, kinship, titles, and the three sons'' quest to recover or defend
    their bull.'
  language: English
  quote_policy: summarized
