canonical_text:
  quote: ''
  summary: Laeg sees and describes a richly equipped chariot. Cuchulain recognizes
    the approaching warrior as Fergus, his master, who comes to warn him. Fergus is
    welcomed with a poor outlaw's portion and tells Cuchulain that Ferdiad, his friend,
    comrade, foster-brother, and equal in arms, will fight him the next morning. Cuchulain
    says his anxiety comes from love, not fear, and Fergus warns him of Ferdiad's
    formidable horn-like battle-skin. Cuchulain vows not to retreat and says he has
    held back the men of Erin for a long season.
  language: English
  quote_policy: summarized
