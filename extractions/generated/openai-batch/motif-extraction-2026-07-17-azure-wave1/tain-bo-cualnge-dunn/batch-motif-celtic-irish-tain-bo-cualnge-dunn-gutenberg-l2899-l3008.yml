canonical_text:
  quote: ''
  summary: 'Fergus recounts youthful exploits of Setanta/Cuchulain at Emain Macha:
    the boy defeats members of the boy-troop, negotiates reciprocal protection under
    a geis, displays dangerous strength while sleeping and playing ball, and later
    awakens during a war crisis to go onto a dark battlefield where he encounters
    a phantom-like wounded man and hears Badb from among the corpses.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The little lad runs among the boys and scatters fifty king's sons before they
    reach the gate of Emain.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some of the boys dash between Fergus and Conchobar while they are playing
    chess, and the lad springs over Conchobar's chessboard in pursuit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Conchobar seizes the lad by the wrists, tells him to stop, and asks who he
    is.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The lad identifies himself as Setanta, son of Sualtaim and Dechtire, and says
    Dechtire is Conchobar's sister.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Conchobar says it is a geis for the boy-troop that no boy should approach
    them in their land without first claiming their protection.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The boy-troop grants protection to Setanta; afterward he rushes among them
    again, lays low fifty princes, and demands that they also come under his protection
    and shielding.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:7
  text: The boys whom Setanta had overthrown later arise, with help from their nurses
    and tutors.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: Setanta says he cannot sleep unless his head and feet are equally high, so
    Conchobar has pillar-stones set at his head and feet and a separate bed made between
    them.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: When a man wakes Setanta, the lad strikes him in the neck or forehead and
    also overthrows a pillar-stone with his forearm; afterward no one dares wake him.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: In a ball game east of Emain, Setanta plays alone against thrice fifty boys
    and is said to best them in every game.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: After using his fists so that fifty boys die, Setanta takes refuge under the
    cushion of Conchobar's couch.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: Setanta rises under the couch and lifts it, together with the thirty warriors
    on it, into the middle of the house.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: During a war with Eogan son of Durthacht, the Ulstermen are beaten while Setanta
    is left asleep; groans from the field awaken him.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:14
  text: On waking, Setanta stretches so that the two stones near him snap, then asks
    the wounded Fergus where Conchobar is.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: On the dark battlefield, Setanta sees a man with half his head remaining and
    half of another man on his back; the man asks Setanta to carry the load, then
    throws it at him when refused.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Setanta and the battlefield man grapple; Setanta is overthrown, Badb speaks
    from the corpses, and Setanta then rises, cuts off the man's head with his playing-stick,
    and drives the ball before him over the battlefield.
  category: sequence
  evidence_refs:
  - ev:8
