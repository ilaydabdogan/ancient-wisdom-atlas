canonical_text:
  quote: ''
  summary: 'The passage introduces the Tain Bo Cualnge as an early western European
    epic with pagan heroic material, then summarizes the opening argument: Medb and
    Ailill compare possessions; Ailill’s bull creates an imbalance; Medb seeks the
    Brown Bull of Cualnge from Dare; the request fails after an insult; Medb gathers
    forces for a raid on Ulster; Ulster is disabled by Macha’s curse; Cuchulain alone
    bears the defense; and Cuchulain’s boyhood naming is linked to his killing and
    replacing Culann’s hound.'
