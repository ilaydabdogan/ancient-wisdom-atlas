canonical_text:
  quote: ''
  summary: Cethern son of Fintan, badly wounded, asks Cuchulain for another healer.
    Cuchulain sends Laeg to summon Fingin, a seer-leech, who examines Cethern's wounds
    one by one. Cethern describes the attackers who made the wounds, and Cuchulain
    identifies Illann son of Fergus, Medb daughter of Eocho Fedlech, Oll and Othine,
    and Bun and Mecconn. Fingin judges the last wounds especially grave, saying the
    spears crossed through Cethern's heart and that he can only try plants and charms
    to prevent immediate death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cethern asks Cuchulain for another leech after the leeches of the men of Erin
    have failed him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cuchulain tells Laeg to go to Fingin the seer-leech at Fingin's Grave-mound
    at Leccan of Sliab Fuait and bid him heal Cethern.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Laeg goes to Fingin, and Fingin comes to where Cuchulain and Cethern are.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cethern shows Fingin his stabs, cuts, sores, and bloody wounds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: For one wound, Fingin says it is a slight and unwillingly given wound made
    by someone of Cethern's own blood and that it will not kill him at once.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cethern describes the maker of that wound as a lone man with bushy hair, a
    blue mantle, a silver brooch, an oval shield, a five-pointed spear, and a spare
    spear; the man also received a slight wound from Cethern.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Cuchulain identifies the lone man as Illann Ilarchless son of Fergus and says
    Illann gave a mock blow so the men of Erin would not accuse him of betrayal or
    desertion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: For another wound, Fingin says it is a woman's deed of arms, specifically
    a wound made by a warrior-woman.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Cethern describes the woman as fair-faced, tall, golden-haired, richly dressed,
    with two gold birds on her shoulders, a purple cloak, a gold brooch, and a straight
    ridged red-flaming spear; she wounded him and received a slight wound from him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Cuchulain identifies the woman as Medb daughter of Eocho Fedlech and says
    she would have counted Cethern's fall at her hands as victory, triumph, and trophy.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Fingin diagnoses another wound as the feat of two warriors, saying two wounds
    were made as one wound.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Cethern describes two men-at-arms with bushy hair, blue cloaks, silver ornaments,
    shields, and five-pointed spears; they wounded him, and he gave each a small wound.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Cuchulain identifies that pair as Oll and Othine of the bodyguard of Ailill
    and Medb and says they go to battle or combat when the wounding of a man is certain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:14
  text: Cethern reports that a pair of young warriors of the Fian each cast a spear
    at him and that he drove a spear through one of them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:15
  text: Fingin observes black blood and says the spears passed through Cethern's heart
    so that they formed a cross; he prophesies no cure but says he would get plants
    and charms so they do not destroy Cethern immediately.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: Cuchulain identifies the last pair as Bun and Mecconn of the bodyguard of
    Ailill and Medb and says they hoped Cethern would fall at their hands.
  category: speech
  evidence_refs:
  - ev:6
