canonical_text:
  quote: ''
  summary: Cuchulain greets Fergus as his master and offers lodging, but Fergus says
    he has come to fight. Cuchulain observes that Fergus has no true sword in his
    sheath; the passage explains that Ailill had earlier removed Fergus's sword and
    replaced it with a wooden one. Fergus invokes his past training and fosterage
    relationship with Cuchulain and asks him to give way before him, promising that
    he will later flee before Cuchulain, causing all the men of Erin to flee. Cuchulain
    retreats in his chariot for Ulster's advantage. The men of Erin rejoice and Medb
    urges pursuit, but Fergus refuses. The episode is called the White Battle because
    no blood on weapons results, and the army marches on to camp in Crich Roiss.
  language: English
  quote_policy: summarized
