  summary: MacRoth reports successive companies arriving at the mound in Slane of
    Meath. Fergus identifies richly armed leaders as Fergna son of Findchoem and Furbaide
    Ferbenn son of Conchobar. A third splendid company is identified as the poets
    of Ulster, including Fercerdne, Athirne, and Ailill Honey-tongue; the passage
    includes a sword display, musical speech, and claims about poetic speech affecting
    lakes and rivers.
  language: English
