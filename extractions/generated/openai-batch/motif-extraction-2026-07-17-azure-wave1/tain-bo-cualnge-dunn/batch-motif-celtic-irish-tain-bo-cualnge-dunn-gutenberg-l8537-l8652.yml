  summary: Cuchulain undergoes a violent bodily contortion, enters a scythed war-chariot,
    performs thunder-feats, circles and traps the hosts of four provinces, and slaughters
    them in revenge for the youths and Follomain. The event is named Sessrech Breslige,
    and some say Lug son of Ethliu fought on Cuchulain's side.
  language: English
