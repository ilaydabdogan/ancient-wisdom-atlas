canonical_text:
  quote: ''
  summary: After defeating the Whitehorned of Ai, the Brown Bull of Cualnge carries
    and scatters the other bull's remains across Ireland. The passage explains several
    place names from these scattered body parts, describes the Brown Bull's return
    toward Cualnge, his slaughter of local women, youths, and children, his death
    from a broken heart, and the peace that follows the Tain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Brown Bull carries the remains of the Whitehorned for a day and a night
    to the loch by Cruachan, with parts of the other bull on his horns.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The men of Erin see the Brown Bull coming over Cruachan with torn fragments
    of the Whitehorned hanging about his ears and horns, and Fergus tells them to
    leave him and his trophy alone.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The seven Mane arise to avenge the Brown Bull's violence and valour by killing
    him; Fergus warns that worse will happen unless the Brown Bull is allowed to go
    home with his spoils and victory.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Brown Bull gives three bellowings in boast of triumph, and fear of Fergus
    holds back the men of Erin from attacking him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: West of Cruachan, the Brown Bull turns his right side toward Cruachan and
    leaves a heap of the Whitehorned's liver there, giving an explanation for the
    name Cruachan Ai.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Finnglas, the Shannon, and Tromma, the Brown Bull drinks so that no drop
    of the river flows past him while he drinks.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Shoulder-blades, haunches, loin, and liver of the Whitehorned fall or are
    left at waterways and fords, and the passage links these remains to local names.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Brown Bull shakes the Whitehorned's remains over Erin, sending a hind
    leg to Port Large and ribs to Dublin/Ath Cliath.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: From the summit of Sliab Breg, the Brown Bull sees the peaks and land of Cualnge,
    becomes greatly agitated at the sight of his own country, and heads toward it.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Women, youths, and children in Cualnge lament the Brown Bull, see his forehead
    approaching, shout about a bull's forehead, and the passage explains the name
    Taul Tairb from this event.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: At Cuib, where he used to be with the yeld cow of Dare, the Brown Bull tears
    up the earth, and the passage explains the name Gort Buraig from this action.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: In fury, the Brown Bull slaughters women, youths, and children of Cualnge;
    then his heart breaks, he belches it out like a black stone of dark blood, and
    he dies at Druim Tairb.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Ailill and Medb make peace with the men of Ulster and with Cuchulain; for
    seven years there is no killing of men among them in Erin, and the opposing groups
    return to their own places.
  category: sequence
  evidence_refs:
  - ev:8
