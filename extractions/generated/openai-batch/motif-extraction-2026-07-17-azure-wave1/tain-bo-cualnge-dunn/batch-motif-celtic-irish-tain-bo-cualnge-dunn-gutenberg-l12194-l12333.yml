canonical_text:
  quote: ''
  summary: Cethern son of Fintan chooses a drastic three-day healing so that he may
    fight his enemies himself. Fingin directs the cure, Cuchulain obtains marrow for
    the bath, and Cethern returns to battle despite severe bodily wounds. His wife
    Finna brings his arms and later laments him. The men of Erin deceive him with
    Ailill's royal garments on a standing-stone, then Mane Andoe wears the garments
    and is struck by Cethern, after which the host surrounds and kills Cethern.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fingin the prophet-leech offers Cethern a choice between a long illness followed
    by help or a drastic red healing lasting three days and three nights.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cethern chooses the red healing so that he can use his own strength against
    his enemies and avenge himself.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fingin asks Cuchulain for a vat of marrow, and Cuchulain takes herds, flocks,
    and droves from the men of Erin to make a marrow-mash of flesh, bones, and skins.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Cethern is placed in the marrow-bath for three days and three nights; the
    bath enters his wounds, and afterward he rises and sleeps for a day and a night.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cethern says he has no ribs and asks for the ribs of the chariot-box to be
    put into him; he later has a slab or chariot-box support pressed to his belly
    or bound around his back.
  category: object
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: Finna daughter of Eocho, Cethern's wife, comes from Dun da Benn bringing his
    sword and other arms in a chariot.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Cethern seizes his arms and proceeds to attack the men of Erin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Ithall, a physician of Ailill and Medb who had survived a previous blow from
    Cethern, rises and warns the camp that Cethern is coming after being healed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The men of Erin put Ailill's dress, golden shawl, and regal diadem on a pillar-stone
    in Crich Ross so that Cethern will first strike it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Cethern mistakes the dressed standing-stone for Ailill, rushes at it, and
    drives his sword through the stone up to the pommel.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Cethern recognizes the deceit and swears he will not stop slaughtering unless
    one of the men of Erin wears the royal dress and golden shawl.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Mane Andoe, son of Ailill and Medb, puts on the royal raiment, golden shawl,
