canonical_text:
  quote: ''
  summary: MacRoth reports three successive armed companies arriving at the same mound
    or hill in Slane of Meath. Ailill asks Fergus to identify each leading warrior.
    Fergus names Connud macMorna, Fedilmid son of Ilar Cetach of Cualnge, and Rochad
    son of Fatheman, praising their martial force and, in Rochad's case, noting his
    marriage to Ailill's daughter Finnabair without dower, marriage-gift, or bride-price.
  language: English
  quote_policy: summarized
