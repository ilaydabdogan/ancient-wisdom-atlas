canonical_text:
  quote: ''
  summary: Cuchulain seeks a night meeting with Ferbaeth, an equal and former companion,
    in order to avert their combat. Ferbaeth refuses because he has promised Medb
    to fight. In anger Cuchulain steps on a holly-spit, pulls it from his own wound,
    throws it after Ferbaeth, and kills him. The death is followed by comments on
    the naming of places. Ailill then proposes using wine, Finnabair, and the promise
    of reward to induce warriors to attack Cuchulain; Cuchulain kills each challenger.
    Cuchulain finally sends Laeg to Lugaid macNois to learn what has happened in the
    camp and who will fight next.
  language: English
  quote_policy: summarized
