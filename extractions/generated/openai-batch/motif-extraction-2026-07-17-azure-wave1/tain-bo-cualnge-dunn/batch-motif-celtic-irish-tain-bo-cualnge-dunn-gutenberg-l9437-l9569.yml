canonical_text:
  quote: ''
  summary: The forces of Erin, unable to defeat Cuchulain while Ulster is incapacitated,
    choose Ferdiad as the champion fit to meet him at the ford. Ferdiad is Cuchulain's
    close foster-brother and equal in training, but has horn-like skin that may resist
    weapons. Ferdiad first refuses to fight his friend, then is pressured by threats
    of satire and shame. He comes to Medb and Ailill's camp, where he is honored,
    given strong drink, attended by Finnabair with kisses and gifts, and promised
    rewards if he will fight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The four grand provinces of Erin are described as being against Cuchulain
    while the Ulstermen are sunk in their nine days' Pains and Conall Cernach is away
    in foreign lands.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Cuchulain is said to endure fierce combat day and night and to have killed
    Calatin, Calatin's sons, Fraech son of Fiadach, and others not enumerated.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The men of Erin take counsel about who should be sent to the ford to fight
    Cuchulain on the following morning.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ferdiad son of Daman son of Dare is chosen as the fit opponent, and is identified
    as a great warrior of the men of Domnann and Cuchulain's own foster-brother.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Ferdiad and Cuchulain are described as well-matched in fighting because they
    learned feats of arms under the same instructresses, Scathach, Uathach, and Aife.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Cuchulain is said to possess the Gae Bulga, while Ferdiad is said to be horn-skinned
    in combat so that weapons and edges could not pierce him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Messengers from Medb and Ailill are sent to Ferdiad, but Ferdiad refuses because
    he knows they want him to fight Cuchulain, his friend, comrade, and foster-brother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Medb sends druids, poets, lampoonists, and hard-attackers to threaten Ferdiad
    with satires, mockery, reviling, disgrace, and three facial blisters named Blame,
    Blemish, and Disgrace.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Ferdiad comes with the satirists for the sake of his honor and from fear of
    shame, judging it better to fall by valor than by satire, abuse, and reproach.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: When Ferdiad comes into the camp, Medb and Ailill rejoice, send him to their
    trusted people, honor him, serve him, and pour strong liquor for him until he
    becomes drunken and merry.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Finnabair, daughter of Ailill and Medb, sits beside Ferdiad, touches each
