canonical_text:
  quote: ''
  summary: Fiachu compels Nathcrantail to meet Cuchulain at the ford. Nathcrantail
    initially refuses to fight a beardless boy, so Cuchulain has Laeg apply a false
    beard. In combat Cuchulain avoids casts by leaping upward, wounds Nathcrantail
    through the crown with a spear, permits him to return to his sons, and later kills
    him after Nathcrantail returns. The passage then shifts to Medb marching with
    part of the host to seek the bull while Cuchulain pursues, kills named figures
    linked to place names, and turns back to protect his own land.
  language: English
  quote_policy: summarized
