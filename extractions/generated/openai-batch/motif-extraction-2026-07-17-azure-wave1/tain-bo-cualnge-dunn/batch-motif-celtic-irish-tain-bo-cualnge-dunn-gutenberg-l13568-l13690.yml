canonical_text:
  quote: ''
  summary: Fergus warns Medb and Ailill that no host can withstand the men of Ulster
    once angered. The forces of Erin camp at Clartha and set watches. Conchobar and
    Celtchar advance with a large force of chariot-fighters to Slane of Meath, while
    macRoth scouts and reports their approach. Ailill belittles the force, and Medb
    proposes a hollow array to capture Conchobar without wounding him; the narrator
    calls this a notably derisive saying. Cormac Conlongas reacts to the boast, opposing
    troops rise, and other forces interpose. Medb’s hollow array is made, but Conchobar
    breaks through it, kills eight hundred warriors, remains unbloodied, and takes
    his station at the head of the men of Ulster. Ailill then orders further reconnaissance,
    and macRoth is chosen.
  language: English
  quote_policy: summarized
