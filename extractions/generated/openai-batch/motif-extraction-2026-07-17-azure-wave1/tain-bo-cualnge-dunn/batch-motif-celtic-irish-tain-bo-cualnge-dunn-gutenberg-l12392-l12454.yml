canonical_text:
  quote: ''
  summary: Fintan son of Niall Niamglonnach comes from Dun da Benn with a force to
    defend Ulster’s honor and avenge his son. His men carry spear-shafts with points
    at both ends and fight multiple battles against the hosts, killing thrice their
    own number before all but Fintan and his son Crimthann are slain. Crimthann is
    protected by Ailill and Medb and later returned to Fintan in exchange for his
    withdrawal until the foretold great battle. The dead are found with facial parts
    caught in one another’s teeth and tusks after their weapons were spent, giving
    the episode its name, the Tooth-fight of Fintan.
  language: English
  quote_policy: summarized
