canonical_text:
  quote: ''
  summary: In Daire macFiachna's house, drunken runners discuss the Brown Bull of
    Cualnge and one says that if the bull were not given willingly it should be taken
    by force. Daire's chief steward hears this and reports it. Daire retracts his
    willingness to give the bull. MacRoth excuses the runners' drunken words, but
    Daire refuses. The messengers return to Cruachan, where Medb declares the bull
    will be taken. The text then marks this as the occasion of the Tain and begins
    the rising-out of the men of Connacht, with Ailill and Medb mustering allies and
    the companies of Cormac described by dress and arms.
  language: English
  quote_policy: summarized
