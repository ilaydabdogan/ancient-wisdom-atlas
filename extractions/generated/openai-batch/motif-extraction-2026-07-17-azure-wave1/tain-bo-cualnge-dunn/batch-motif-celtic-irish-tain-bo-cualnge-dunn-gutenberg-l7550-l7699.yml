canonical_text:
  quote: ''
  summary: Medb arranges an ambush for Cuchulain at Fochard, but he kills the fourteen
    men sent against him. After further killings among the host, Medb urges Loch to
    avenge his brother by fighting Cuchulain. Loch and Cuchulain duel at an upper
    ford. The Morrigan comes from the fairy dwellings to destroy Cuchulain, first
    in the form of a white red-eared heifer among cattle and then as a black eel that
    coils around him in the ford. While Cuchulain is freeing himself, Loch wounds
    him through the breast, and Fergus condemns the deed.
  language: English
  quote_policy: summarized
