canonical_text:
  quote: ''
  summary: Laeg goes from Cuchulain to Lugaid to ask about Ferbaeth's death and the
    next combatant. Lugaid says his brother Larine is being persuaded to fight Cuchulain
    so that Larine may fall and Lugaid may be drawn into vengeance, but Lugaid refuses
    to fight Cuchulain. Lugaid meets Cuchulain at Glen Ferbaeth, invokes their fellowship
    and mutual nurture, and asks him not to kill Larine. Cuchulain promises not to
    kill Larine but to inflict a punishment next to death. The next day Larine is
    entertained in Ailill and Medb's tent by Finnabair, who serves him drink and food
    and kisses him. Medb praises Finnabair and Larine as a fitting pair, and Ailill
    promises Finnabair to Larine if he brings Cuchulain's head. Larine agrees and
    reacts with great joy.
  language: English
  quote_policy: summarized
