canonical_text:
  quote: ''
  summary: Ferdiad wounds Cuchulain, who calls to Laeg to prepare the Gae Bulga. Laeg
    overpowers Ferdiad's charioteer, sets the weapon in the water, warns Cuchulain,
    and sends it along the stream. Cuchulain wounds Ferdiad with a short spear and
    then casts the Gae Bulga from his foot; it penetrates Ferdiad's defenses and fills
    his body with barbs. Ferdiad declares the killing unfair and refers to Medb turning
    his hand against his ward. Cuchulain carries Ferdiad north of the ford, swoons
    in grief, and Laeg urges him to rise as the men of Erin prepare to attack.
  language: English
  quote_policy: summarized
