canonical_text:
  quote: ''
  summary: An alternate account describes Medb meeting Fedelm the seeress at Fidduin
    and ordering a wood cut down when Fedelm says it blocks her sight. The host then
    endures a severe snowy night at Cul Sibrille and departs at sunrise. Cuchulain
    rises late after a tryst, discovers with Laeg that the army has passed into Ulster,
    and laments his failed watch. Laeg cannot count the host clearly, but Cuchulain
    counts eighteen cantreds and attributes this to magical gifts of sight, understanding,
    and reckoning. The narrator compares this reckoning with renowned reckonings by
    Lug Lamfota and Incel, lists Cuchulain’s many excellences, and ends with Cuchulain
    ordering pursuit while showing enmity to the host.
  language: English
  quote_policy: summarized
