canonical_text:
  quote: ''
  summary: The host of the four provinces camps at Druim En while Cuchulain stays
    nearby, flourishes his weapons, and frightens warriors with nightly sling-casts.
    Ailill and Medb judge that the host cannot endure this and send Fiachu to parley,
    offering Cuchulain recompense, hospitality, land, chariotry, bondmaids, and service
    with Ailill and Medb instead of Conchobar. Cuchulain welcomes Fiachu but refuses
    to betray his maternal uncle. At a later tryst in Glenn Fochaine, Medb sees Cuchulain
    as youthful, Fergus praises his unmatched prowess, and Medb again offers terms
    while Cuchulain says he will continue harassing the raid.
  language: English
  quote_policy: summarized
