canonical_text:
  quote: ''
  summary: After a day of combat, Cuchulain and Ferdiad part in sorrow and without
    signs of friendship. Ferdiad arms himself for a decisive day at the ford, fearing
    the Gae Bulga, and performs unprecedented feats. Cuchulain asks Laeg to taunt
    or praise him as needed, arms himself, and chooses the Feat of the Ford. The narrator
    frames the duel as a clash of two great Gaelic champions brought to deadly conflict
    through Ailill and Medb's incitement.
  language: English
  quote_policy: summarized
