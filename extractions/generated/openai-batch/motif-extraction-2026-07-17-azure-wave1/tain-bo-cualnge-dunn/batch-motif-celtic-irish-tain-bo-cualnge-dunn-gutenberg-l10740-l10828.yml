canonical_text:
  quote: ''
  summary: Cuchulain and Ferdiad continue their formal duel at the ford, first with
    throwing-spears and then, on the following day, with lances from chariots. After
    each day’s combat they stop at evening. The first evening they embrace and kiss
    in remembrance of friendship, share camp arrangements through their attendants,
    receive healing, and send equal portions of healing materials and provisions across
    the ford to one another.
  language: English
  quote_policy: summarized
