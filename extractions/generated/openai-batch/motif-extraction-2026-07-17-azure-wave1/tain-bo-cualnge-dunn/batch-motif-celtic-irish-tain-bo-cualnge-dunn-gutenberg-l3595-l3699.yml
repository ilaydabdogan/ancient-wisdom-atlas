canonical_text:
  quote: ''
  summary: Cuchulain and Ibar survey Ulster from a hill, identify the fort of the
    sons of Necht Scene, and go there despite Ibar's warnings. At the enemy green
    Cuchulain reads an ogam challenge-geis on a pillar-stone, throws the stone into
    the moat, and sleeps. Foill son of Necht arrives and questions Ibar, who avoids
    waking Cuchulain because the boy ordered him not to wake him for only a few foes.
  language: English
  quote_policy: summarized
