canonical_text:
  quote: ''
  summary: Medb summons Ferdiad and offers him wealth, land, privileges for his descendants,
    her brooch, friendship, and Finnabair as wife if he will face Cuchulain. Ferdiad
    refuses to proceed without bonds, oaths, and sureties, repeatedly noting the danger
    of fighting Cuchulain and the pain of contending with a friend and foster-companion
    trained by the same nurses.
  language: English
  quote_policy: summarized
