canonical_text:
  quote: ''
  summary: 'The passage recounts episodes from Cuchulain''s youthful exploits: he
    rescues Conchobar from concealment on a battlefield, kindles fire for him, procures
    a roast pig by killing an armed man at a cooking-pit, and carries the wounded
    Cuscraid. Fergus then describes an attack during the Ulstermen''s Pains, in which
    Cuchulain alone among the boys stands against raiders from the Isles of Faiche,
    kills nine, and receives many wounds. The narrative comments on his extreme youth
    at the time and his later age during the Cattle-lifting of Cualnge. A new section
    begins with Cormac Conlongas introducing another childhood deed and Culann the
    Smith inviting Conchobar to a limited feast.'
  language: English
  quote_policy: summarized
