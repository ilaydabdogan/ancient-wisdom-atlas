canonical_text:
  quote: ''
  summary: Sualtaim hears of Cuchulain's distress, finds him gravely wounded, and
    is sent by Cuchulain to warn the men of Ulster. Sualtaim rides to Emain Macha
    and repeatedly cries that men are slain, women stolen, and cattle lifted. Because
    of a geis governing speech before the king and druids, he receives no initial
    answer. At the Flag-stone of the hostages, Cathba questions him; Sualtaim names
    Ailill and Medb, with Fergus's cunning, and describes Cuchulain's solitary defense
    and wounds. Cathba then declares death and destruction fitting for the man who
    incites the king, and the Ulstermen agree.
  language: English
  quote_policy: summarized
