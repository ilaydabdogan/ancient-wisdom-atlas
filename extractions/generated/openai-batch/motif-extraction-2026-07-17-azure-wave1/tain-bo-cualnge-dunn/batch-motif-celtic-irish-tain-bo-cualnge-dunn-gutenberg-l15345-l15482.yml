canonical_text:
  quote: ''
  summary: Cuchulain, still wounded, asks Laeg how far the enemy hosts have advanced
    and orders his bonds loosened. His battle-frenzy breaks his wound-bindings and
    sends dressings to named places; the narrator attributes this to fairy helpers
    who make his story famous and explain place-names. He kills two false lamenters
    sent by Medb, carries his chariot as his only available weapon, attacks the men
    of Erin, confronts Fergus, and compels Fergus to honor an earlier promise to flee.
    Fergus retreats, the armies turn, and by sunset Medb and the Connacht forces are
    routed westward.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Laeg reports that the hosts have advanced to Garech; Cuchulain says they will
    not reach Ilgarech if he catches them and orders his bands loosened.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Because Cuchulain had been prevented from going into battle, his twisting
    fit comes upon him, and twenty-seven skin tunics and other bindings are associated
    with restraining him when he goes to battle.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Cuchulain springs so violently that wound-bindings, bracings, supports, pins,
    and dry wisps fly away to named places or up into the sky; his wounds then bleed
    heavily into ditches and furrows.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: 'The narrator reports a variant explanation: not Cuchulain’s strength alone,
    but his powerful fairy-folk friends, moved the objects to those places so that
    the places would be named from them and his history made famous.'
  category: other
  evidence_refs:
  - ev:3
- id: obs:5
  text: Fethan and Collach, two women lampoonists, had come from Medb to make a false
    lament over Cuchulain and to tell him false news of Ulster defeat and Fergus’s
    death; Cuchulain kills them by striking their heads together.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Cuchulain’s arms are not near him except for his chariot; he takes the chariot
    on his back and uses it to strike the men of Erin until he reaches Fergus macRoig.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cuchulain calls Fergus his master, threatens him if he will not turn, identifies
    himself as Fergus’s fosterling and as connected with Ulster and Conchobar, and
    reminds Fergus of a promise to flee before him when Cuchulain is wounded.
  category: speech
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:8
  text: Fergus acknowledges the promise, turns away from Cuchulain, and flees; his
    company, the Leinstermen, the men of Munster, and then all the men of Erin turn
    with him.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The men of Erin break their ranks westward; fighting continues around the
    Connacht leaders, and by sunset Medb and the last Connacht company flee westward
    over the hill.
  category: sequence
  evidence_refs:
  - ev:8
