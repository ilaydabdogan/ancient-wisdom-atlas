canonical_text:
  quote: ''
  summary: Before the combat at the ford, Ferdiad's attendant rebukes him for disparaging
    Cuchulain and recalls past occasions when Cuchulain aided or outdid him. Ferdiad
    sleeps on chariot-coverings while the attendant keeps watch. Cuchulain rises in
    daylight, has his chariot harnessed, and approaches the ford amid battle-noises
    and supernatural cries associated with the Tuatha De Danann. Ferdiad is awakened,
    arms himself, and his attendant recites verses identifying the approaching Cuchulain
    as a Hound who brings defeat.
  language: English
  quote_policy: summarized
