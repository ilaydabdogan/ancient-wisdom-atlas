canonical_text:
  quote: ''
  summary: The passage recounts Cuchulain's slaughter of many kings and members of
    the host on the Plain of Murthemne, followed by his unwounded departure. The next
    morning he appears in a beautiful form, contrasting it with a prior magical battle-form,
    and is described in elaborate bodily detail and splendid clothing. He displays
    severed heads as tokens of prowess. Medb hides behind shields, women climb or
    are lifted to look at him, and Dubthach becomes jealous when his wife seeks to
    view Cuchulain, urging treachery and ambush.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cuchulain is said to have laid low ten and six-score kings, leaders, and men,
    along with a countless horde of dogs, horses, women, boys, children, and common
    folk; fewer than a third of the men of Erin escaped without some wound or lasting
    mark.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the battle, Cuchulain, his charioteer, and both of his horses are described
    as leaving without blood drawn or wounds received.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Early the next morning Cuchulain came to observe the host and to display a
    comely, beautiful form because he judged the previous night's wild magical shape
    unbecoming.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Cuchulain's body is described with three colors of hair, colored spots on
    his cheeks, brilliant kingly eyes, seven toes on each foot, seven fingers on each
    hand, and claw-like grips.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Cuchulain wears a fair-day dress with a mantle, brooch, silk jacket, buckler,
