canonical_text:
  quote: ''
  summary: The passage describes an armed troop identified as Cormac, the gathering
    of the four provinces of Erin at Cruachan Ai, a fortnight of feasting while poets
    and druids await a favorable omen, and Medb’s consultation of a druid about whether
    she and the host will return. After her charioteer turns the chariot rightward
    for a good omen, Medb encounters Fedelm, a richly described armed maiden and prophetess
    from the Sid of Cruachan, trained in prophetic skill in Alba. Fedelm divines the
    undertaking and answers Medb with a vision of the host crimson-red and bathed
    in blood.
  language: English
  quote_policy: summarized
