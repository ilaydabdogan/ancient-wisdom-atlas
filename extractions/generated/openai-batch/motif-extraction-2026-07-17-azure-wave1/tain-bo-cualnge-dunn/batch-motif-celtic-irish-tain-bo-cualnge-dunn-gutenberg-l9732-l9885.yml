canonical_text:
  quote: '"Sad, O god, yea, sad, O god, / That a woman should us part!"'
  summary: Ferdiad rejects gifts if they require him to fight Cuchulain, his foster-brother
    and equal in arms. He laments the coming fight, speaks of shared affection, vows
    extreme responses if Cuchulain dies, and says Scathach foretold his own fall at
    a ford through Cuchulain. Medb, described as stirring disunion, reports that Cuchulain
    belittled Ferdiad; Ferdiad swears to meet him despite reluctance. Medb secures
    a covenant and sureties for the combat. Fergus, present at the covenant, laments
    the coming deed and drives to warn Cuchulain of Ferdiad's challenge.
  language: English
  quote_policy: quoted
