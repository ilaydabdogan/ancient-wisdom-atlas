canonical_text:
  quote: ''
  summary: 'At the hill or mound in Slane of Meath, macRoth reports successive companies
    approaching. Ailill asks who the leading warriors are, and Fergus identifies them:
    the paired young warriors Fiacha and Fiachna, Celtchar son of Uthechar, Errge
    Echbel, and Menn son of Salcholga. The passage emphasizes their appearance, weapons,
    martial epithets, origins, and in Menn''s case a stated motive of vengeance for
    wounds.'
  language: English
  quote_policy: summarized
