canonical_text:
  quote: ''
  summary: The passage first recounts a group of Ulster charioteers who fight the
    hosts with improvised stones and earth, kill many, and fall. It then tells how
    Cuchulain seeks aid from Rochad, how Fergus advises Ailill to lure Rochad with
    Finnabair, how Rochad is seized and bound to a truce in return for Finnabair,
    and how Munster under-kings claim Finnabair had already been pledged to them,
    causing an internal conflict that Fergus mediates after heavy losses.
  language: English
  quote_policy: summarized
literal_observations:
