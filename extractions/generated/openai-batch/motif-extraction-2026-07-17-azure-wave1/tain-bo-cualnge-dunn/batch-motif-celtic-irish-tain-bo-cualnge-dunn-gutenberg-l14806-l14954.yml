canonical_text:
  quote: '"Ravens shall pick / The necks of men! / Blood shall gush"'
  summary: Conchobar and Ailill agree to a truce until sunrise. During the night the
    Morrigan comes between the two camps, foments strife, and speaks a battle-verse
    of ravens, blood, ruin, and woe. Cuchulain, stationed at Fedain Collna and not
    strong enough to fight, asks Laeg to report events between the battle-lines. Laeg
    sees a small flock and opposing bands moving around it; Cuchulain predicts a major
    fight, and the bands clash. At sunrise Cuchulain orders Laeg to rouse the Ulstermen,
    and Laeg exhorts the kings of Macha to arise for Cualnge's cattle.
  language: English
  quote_policy: quoted
