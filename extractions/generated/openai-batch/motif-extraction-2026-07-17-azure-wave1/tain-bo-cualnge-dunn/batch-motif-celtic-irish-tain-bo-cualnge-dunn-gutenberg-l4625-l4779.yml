canonical_text:
  quote: ''
  summary: The host moves through Conalle Murthemni while Medb is protected from Cuchulain
    by a canopy of shields. At Rede Loche, Cuchulain kills Medb's handmaiden Loche
    with a sling-stone after mistaking her for Medb. The host ravages Cualnge, seeks
    the bull Donn, and the bull kills the cowherd Lothar and warriors before escaping.
    Later swollen streams prevent the host from crossing; Uala attempts the river
    with a rock on his back and drowns, after which his grave-stone gives a place-name.
    Cuchulain continues attacking the host near the stream.
  language: English
  quote_policy: summarized
