canonical_text:
  quote: ''
  summary: Cuchulain repeatedly leaps onto Ferdiad's shield to strike at his head,
    but Ferdiad repels him. Laeg rebukes Cuchulain. Cuchulain enters his first twisting-fit
    and grows terribly enlarged, after which the duel becomes so close and violent
    that weapons break, supernatural beings scream, the river is displaced from the
    ford, and the camp panics. Ferdiad wounds Cuchulain and blood crimsons the ford.
    Cuchulain then receives hidden aid from Dolb and Indolb of Faery, prompting Ferdiad
    to complain about undisclosed supernatural help; Cuchulain answers that revealing
    the magic veil would destroy Tuatha De Danann concealment, and counters that Ferdiad
    has withheld knowledge about his horn skin.
  language: English
  quote_policy: summarized
