canonical_text:
  quote: ''
  summary: The men of Erin disguise Tamon the fool in Ailill's royal garments and
    send him to a ford, where Cuchulain mistakes him for Ailill and kills him with
    a stone from a staff-sling; the ford and tale receive names from the episode.
    The passage then shifts to the encamped hosts, where Medb seeks a combatant against
    Cuchulain. The warriors refuse, Medb summons Fergus, and Fergus objects because
    Cuchulain is his young disciple and fosterling; after Fergus is made drunk and
    pressured, he goes toward the combat.
  language: English
  quote_policy: summarized
