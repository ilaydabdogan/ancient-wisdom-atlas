canonical_text:
  quote: ''
  summary: During the combat at the ford, Cuchulain and Ferdiad display their skills,
    but Cuchulain keeps the Gae Bulga as an unrevealed secret. Ferdiad kills Dolb
    and Indolb. After Cuchulain is pressed hard, Laeg rebukes him, and Cuchulain undergoes
    a violent bodily swelling before calling for the Gae Bulga. The weapon is described
    as a spear prepared with the stream, cast from between the toes, and opening many
    barbs inside the body. Laeg repeatedly dams the water to set it ready, while Id,
    Ferdiad’s charioteer and Laeg’s brother, repeatedly releases the stream and disrupts
    the preparation. Laeg and Id grapple, and Ferdiad repeatedly throws Cuchulain
    from his shield, finally knocking him into the ford’s waves.
  language: English
  quote_policy: summarized
