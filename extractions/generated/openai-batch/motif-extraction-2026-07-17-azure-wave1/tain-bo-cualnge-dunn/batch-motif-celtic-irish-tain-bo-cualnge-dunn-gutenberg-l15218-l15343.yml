canonical_text:
  quote: ''
  summary: Conchobar confronts Fergus on the battlefield. Fergus strikes Conchobar's
    shield Ochain, provoking cries from the shield, answering waves, and the shields
    of the Ulstermen. Conchobar taunts Fergus about exile, dependency, and the sons
    of Usnech. Enraged, Fergus attempts to deliver fatal blows with Calad Colg, but
    Cormac restrains him and redirects his anger toward the hilltops. Conall later
    gives similar counsel. Fergus's faery sword grows to rainbow size and he cuts
    the tops from three hills, which are identified as the three Maels of Meath. Cuchulain
    hears Ochain struck and asks Laeg who is responsible.
  language: English
