canonical_text:
  quote: ''
  summary: 'A young Cuchulain declares that he has come to seek battle and proves
    himself against three sons of Necht. Ibar warns him that each opponent has an
    exceptional defense or skill: Foill cannot be harmed by weapon-points or edges,
    Tuachall can evade weapons unless overcome at once, and Fandall moves over water
    beyond other swimmers. Cuchulain defeats each with a fitting weapon or feat, beheads
    each opponent, and carries away the heads and spoils.'
  language: English
  quote_policy: summarized
