canonical_text:
  quote: ''
  summary: Culann prepares food and drink for Conchobar. Before leaving Emain for
    the feast, Conchobar visits the boys and sees one small boy defeat thrice fifty
    boys in several games. Conchobar praises the boy and invites him to the feast,
    but the boy says he will come later after the games are finished, following the
    trail of the company. At Culann's house the guests are honored and begin feasting.
    Culann asks whether anyone will follow; Conchobar, having forgotten the boy, says
    no. Culann then releases a powerful chained hound to guard the enclosure, and
    the hound takes its place on the guard mound.
  language: English
  quote_policy: summarized
