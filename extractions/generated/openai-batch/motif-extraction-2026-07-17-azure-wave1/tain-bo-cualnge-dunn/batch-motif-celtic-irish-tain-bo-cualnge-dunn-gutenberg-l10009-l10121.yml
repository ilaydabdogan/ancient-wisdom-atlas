canonical_text:
  quote: ''
  summary: Fergus and Cuchulain speak in verse about the impending combat with Ferdiad.
    Fergus returns to the camp. Laeg advises Cuchulain to seek matching adornment
    from Emer before Ferdiad arrives richly prepared and watched by the provinces.
    Cuchulain goes to Dundelgan and spends the night with his wife. Ferdiad tells
    his people about Medb's surety and covenant terms for the coming combat. Ferdiad's
    followers are sorrowful because they expect one or both champions to fall, and
    they fear it will be their own lord.
  language: English
