canonical_text:
  quote: Virtue is not left to stand alone. He who practises it will have neighbors.
  summary: Book IV, chapters I-XXVI present sayings and one brief dialogue concerning
    virtue, the superior man, the right way, propriety in rule and relationships,
    self-cultivation, filial service, restraint in speech, and cautious remonstrance.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Master says virtuous manners make a neighborhood excellent, and that choosing
    a residence without them is not wise.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says those without virtue cannot long abide either poverty and
    hardship or enjoyment; the virtuous rest in virtue, and the wise desire virtue.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master says only the truly virtuous person can love or hate others, and
    that setting the will on virtue prevents wickedness.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master says riches and honors should not be held if not obtained properly,
    and poverty or meanness should not be avoided if avoidance is improper.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Master says the superior man does not act contrary to virtue even for
    the space of a single meal, and cleaves to it in haste and danger.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Master says he has not seen a person who loved virtue or hated what was
    not virtuous, and asks whether anyone could apply strength to virtue for one day.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Master says men's faults are characteristic of their class and that by
    observing a man's faults it may be known that he is virtuous.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Master says that hearing the right way in the morning permits dying in
    the evening without regret.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Master says a scholar whose mind is set on truth but who is ashamed of
    bad clothes and bad food is not fit to be discoursed with.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Master contrasts the superior man, who follows what is right and thinks
    of virtue, law, and righteousness, with the small or mean man, who thinks of comfort,
    favors, and gain.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Master says acting constantly with a view to one's own advantage will
    bring much murmuring.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Master says a prince able to govern by complaisance proper to the rules
    of propriety will have no difficulty, while one unable to do so has no use for
    those rules.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Master says a person should be concerned with fitting himself for a place
    and with being worthy to be known, rather than with having no place or not being
    known.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The Master tells Shan that his doctrine is an all-pervading unity; after the
    Master leaves, Tsang explains it as being true to the principles of one's nature
    and exercising them benevolently toward others.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: The Master says that when seeing people of worth one should think of equaling
    them, and when seeing people of contrary character one should turn inward and
    examine oneself.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The Master says a son serving his parents may remonstrate gently; if they
    do not follow, he should increase reverence, not abandon his purpose, and not
    murmur if punished.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:17
  text: The Master says a son should not go far abroad while his parents are alive,
    and if he does, he must have a fixed place to which he goes.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:18
  text: The Master says a son who does not alter from his father's way for three years
    may be called filial.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:19
  text: The Master says parents' years must be kept in memory as an occasion for both
    joy and fear.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:20
  text: The Master says the ancients were slow to utter words because they feared
    their actions would not come up to them; he also says the cautious seldom err
    and the superior man wishes to be slow in speech and earnest in conduct.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:21
  text: The Master says virtue is not left to stand alone and that one who practises
    it will have neighbors.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:22
  text: Tsze-yu says frequent remonstrances in serving a prince lead to disgrace,
    and frequent reproofs between friends make friendship distant.
  category: speech
  evidence_refs:
  - ev:14
