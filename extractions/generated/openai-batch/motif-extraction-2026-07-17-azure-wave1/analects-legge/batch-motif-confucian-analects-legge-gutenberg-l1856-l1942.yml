canonical_text:
  quote: What is necessary is to rectify names.
  summary: 'The passage presents sayings and dialogues on government: the Master advises
    moral example, appointment of worthy officers, rectification of names, practical
    public competence, correct personal conduct by rulers, enrichment and teaching
    of the people, and long-term transformation through virtuous rule.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Tsze-lu asks about government, and the Master tells him to go before the people
    by example, work in their affairs, and not grow weary.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chung-kung, as chief minister to the Head of the Chi family, asks about government,
    and the Master advises using officers first, pardoning small faults, and raising
    virtuous and talented men to office.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master tells Chung-kung to raise to office those he knows to be virtuous
    and talented, adding that others will not neglect those he does not know.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tsze-lu says the ruler of Wei is waiting for the Master to help administer
    government, and the Master replies that the first necessity is to rectify names.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Master describes a sequence in which incorrect names lead to language
    not matching the truth of things, failed affairs, decline of proprieties and music,
    improper punishments, and the people not knowing how to move hand or foot.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fan Ch'ih asks to be taught husbandry and gardening, and the Master answers
    that he is not as good for those matters as an old husbandman or old gardener.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: After Fan Ch'ih leaves, the Master criticizes him and says that if a superior
    loves propriety, righteousness, and good faith, the people respond with reverence,
    submission, and sincerity, and people from all quarters come with children on
    their backs.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Master says that reciting the three hundred odes is of no practical use
    if a person cannot act in government office or reply unaided on a mission.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Master says that when a prince's personal conduct is correct, government
    is effective without orders, but if conduct is not correct, orders will not be
    followed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Master says the governments of Lu and Wei are brothers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Master says Ching, a scion of the ducal family of Wei, understood household
    economy and responded approvingly as his means grew.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: When the Master goes to Wei, Zan Yu drives his carriage; after the Master
    observes the people's number, he says they should be enriched and then taught.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Master says that if princes employed him, he could accomplish something
    within twelve months and perfect government in three years.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Master affirms that good men governing for a hundred years could transform
    the violently bad and dispense with capital punishments, and that a truly royal
    ruler would need a generation for virtue to prevail.
  category: speech
  evidence_refs:
  - ev:11
  - ev:12
