canonical_text:
  quote: ''
  summary: 'The passage gives several sayings and narrative notices: the Master criticizes
    Kwan by comparing his gate screen and cup-stand with princely usages; instructs
    the grand music-master of Lu on how music should begin, harmonize, remain distinct,
    and conclude; is visited by the border warden at Yi, who interprets the Master''s
    loss of office as Heaven''s intended use of him as a wooden-tongued bell; evaluates
    the Shao and Wu; and condemns high office, ceremony, and mourning when they lack
    corresponding inward virtues.'
  language: English
  quote_policy: summarized
