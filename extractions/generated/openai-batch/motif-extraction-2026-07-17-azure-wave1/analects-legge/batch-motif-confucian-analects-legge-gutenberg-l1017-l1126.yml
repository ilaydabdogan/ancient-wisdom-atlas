  summary: Book VIII presents sayings on virtuous renunciation, propriety, illness
    and deathbed counsel, humility, the superior man, virtue as a lifelong burden,
    learning through Odes, propriety, and music, conduct under good or bad government,
    and ancient model rulers and ministers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: T'ai-po is praised for reaching a high point of virtuous action after declining
    the kingdom three times; the people did not understand his motives.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says propriety regulates respectfulness, carefulness, boldness,
    and straightforwardness, and that proper conduct by those in high stations influences
    the people.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When ill, Tsang calls disciples, asks that his feet and hands be uncovered,
    cites a Book of Poetry warning image, and says he has escaped injury to his person.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: When Meng Chang visits the ill Tsang, Tsang says a dying bird has mournful
    notes and a dying man has good words, then gives three conduct principles for
    a man of high rank.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Tsang praises a former friend who, despite ability and possession, asked questions
    of those with less, counted himself as empty, and avoided altercation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Tsang says a superior man can be entrusted with an orphan prince and authority
    over a state while remaining firm in emergencies.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tsang says the officer needs breadth of mind and endurance because perfect
    virtue is a heavy burden and the course lasts until death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Master states that the Odes arouse the mind, the Rules of Propriety establish
    character, and Music gives finish.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Master says people may be made to follow a path of action without being
    made to understand it; he also warns that daring joined to dissatisfaction with
    poverty may lead to insubordination.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Master says abilities like those of the Duke of Chau are not worth considering
    if joined to pride and niggardliness.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Master advises firm faith and learning, avoidance of tottering or disorganized
    states, concealment when right principles are prostrated, and different grounds
    for shame under good and bad government.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Master praises the music master Chih's beginning in office and the finish
    of the Kwan Tsu as filling the ears.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The Master praises Shun and Yu for holding the empire as if it were nothing
    to them, and praises Yao as corresponding to Heaven.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: The passage states that Shun had five ministers and a well-governed empire,
    King Wu said he had ten able ministers, and Confucius comments that talents are
    difficult to find.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: The Master says it is not easy to find someone who studies three years without
    becoming good, and urges learning as if the object might not be reached or might
    be lost.
  category: speech
  evidence_refs:
  - ev:15
