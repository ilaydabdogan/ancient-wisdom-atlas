  quote: ''
  summary: The passage contains a fragment about a low-lying situation receiving the
    world's evil; Tsze-kung compares the superior man's visible faults to eclipses;
    he explains Chung-ni's learning as drawn from surviving doctrines of Wan and Wu
    among people; he defends Chung-ni through images of high walls, a door, an ancestral
    temple, sun and moon, heavens, and stairs; and he describes the effects of a sage's
    hypothetical rule.
