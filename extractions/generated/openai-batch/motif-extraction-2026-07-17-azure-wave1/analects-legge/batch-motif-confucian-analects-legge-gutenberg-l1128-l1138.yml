canonical_text:
  quote: ''
  summary: 'The passage praises King Wan for serving the Yin dynasty despite possessing
    two thirds of the empire, presenting this as the height of the virtue of the house
    of Chau. It then reports the Master praising Yu as without flaw: Yu lived austerely
    in food, clothing, and housing, showed utmost filial piety toward the spirits,
    wore elegant sacrificial attire, and devoted his strength to ditches and water-channels.'
