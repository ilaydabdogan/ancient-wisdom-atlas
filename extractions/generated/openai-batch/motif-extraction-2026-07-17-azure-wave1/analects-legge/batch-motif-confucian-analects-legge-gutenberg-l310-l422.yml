canonical_text:
  quote: ''
  summary: Book III presents Confucius and interlocutors discussing ritual propriety,
    music, ceremonies, sacrifice, archery, dynastic rites, temple conduct, offerings,
    ruler-minister relations, and trees planted at land-spirit altars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The head of the Chi family is said to have eight rows of pantomimes in his
    area, and Confucius questions what else he might bear to do if he can bear this.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The three families use the YUNG ode while vessels are removed at the conclusion
    of a sacrifice, and Confucius questions the ode's application in their hall.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Confucius says that a person lacking the virtues proper to humanity has no
    proper relation to rites of propriety or music.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lin Fang asks what should be attended to first in ceremonies, and Confucius
    says festive ceremonies should prefer sparingness to extravagance and mourning
    ceremonies should prefer deep sorrow to minute observance.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Chi family chief is about to sacrifice to T'ai mountain; Confucius asks
    Zan Yu whether he can save him from it, and after Zan Yu says he cannot, Confucius
    remarks on the mountain's discernment in comparison with Lin Fang.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Confucius describes the student of virtue as avoiding contention; when archery
    is unavoidable, the student bows, ascends and descends the hall, and exacts a
    drinking forfeit while remaining a Chun-tsze.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Confucius says that, in archery, piercing the leather is not the principal
    thing because people's strength is unequal.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tsze-hsia asks about an ode passage concerning dimples, eyes, plain ground,
    and colours; Confucius says laying on colours follows preparing the plain ground,
    and accepts Tsze-hsia's inference that ceremonies are subsequent.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Confucius says he could describe the ceremonies of the Hsia and Yin dynasties
    but cannot sufficiently support his words because of insufficient records and
    wise men.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Confucius says Chau viewed the two past dynasties, praises its regulations
    as complete and elegant, and says he follows Chau.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Confucius says that after the pouring out of the libation at the great sacrifice,
    he has no wish to look on; he also says that one who knew the sacrifice's meaning
    would find governing the kingdom easy.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage states that Confucius sacrificed to the dead and to the spirits
    as if they were present, and he says that not being present at the sacrifice is
    as if he did not sacrifice.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Wang-sun Chia asks about paying court to the furnace rather than to the south-west
    corner, and Confucius replies that one who offends against Heaven has none to
    whom he can pray.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: When Confucius enters the grand temple, he asks about everything; after someone
    questions his knowledge of propriety, he says that asking is a rule of propriety.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Tsze-kung wishes to do away with the sheep offering connected with the first
    day of each month, and Confucius replies that Tsze-kung loves the sheep while
    he loves the ceremony.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: Duke Ting asks how a prince should employ ministers and how ministers should
    serve a prince; Confucius replies that the prince should employ ministers according
    to propriety and ministers should serve with faithfulness.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:17
  text: Duke Ai asks Tsai Wo about altars of the spirits of the land, and Tsai Wo
    says Hsia, Yin, and Chau respectively planted pine, cypress, and chestnut trees
    about them.
  category: speech
  evidence_refs:
  - ev:15
