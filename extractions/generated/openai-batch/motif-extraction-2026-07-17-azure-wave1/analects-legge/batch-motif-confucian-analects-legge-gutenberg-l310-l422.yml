- id: motif:2
  label: Sacrificial presence and participation
  taxonomy_refs:
  - sacrifice
  basis: Sacrifice to the dead and spirits is performed as if they are present, and
    Confucius says absence at a sacrifice is as if not sacrificing.
  evidence_refs:
  - ev:10
