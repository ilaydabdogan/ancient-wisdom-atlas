  cautions: No details are given about the dead or spirits beyond their sacrificial
    presence.
- id: motif:3
  label: Inner virtue before ritual form
  taxonomy_refs:
  - wisdom
  basis: Confucius says rites and music require humanity, mourning requires sorrow
    more than minute observance, and ceremonies follow the prepared plain ground.
  evidence_refs:
  - ev:3
