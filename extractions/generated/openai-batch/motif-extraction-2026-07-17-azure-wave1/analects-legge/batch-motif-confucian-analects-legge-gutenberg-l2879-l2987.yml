canonical_text:
  quote: ''
  summary: The passage presents examples of withdrawal, upright service, remonstrance,
    dismissal, refusal of office, and Confucius's departures from courts that will
    not use his doctrines. Several recluses or field workers warn Confucius or Tsze-lu
    against political engagement, while Confucius and Tsze-lu defend association with
    mankind and the righteous duties of office. It also catalogues named retired men
    and notes music officials who leave for other states or withdraw north of the
    river.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Viscount of Wei withdrew from court, the Viscount of Chi became a slave
    to Chau, and Pi-kan remonstrated with Chau and died; Confucius calls them three
    men of virtue of the Yin dynasty.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hui of Liu-hsia, while chief criminal judge, was dismissed three times and
    answered that upright service may bring repeated dismissal wherever he goes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Duke Ching of Ch'i says he cannot use Confucius's doctrines, after which Confucius
    departs.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The people of Ch'i send female musicians to Lu; Chi Hwan receives them, court
    is not held for three days, and Confucius departs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chieh-yu, called the madman of Ch'u, passes Confucius singing a warning that
    Confucius's virtue has degenerated, the future may still be guarded, and peril
    awaits those engaged in government.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Confucius wishes to converse with Chieh-yu, but Chieh-yu hastens away and
    no conversation occurs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ch'ang-tsu and Chieh-ni are working in a field when Confucius passes and sends
    Tsze-lu to inquire for the ford.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Chieh-ni says disorder spreads over the empire like a swelling flood and advises
    Tsze-lu to follow those who have withdrawn from the world altogether.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Confucius replies that he cannot associate with birds and beasts as if they
    were the same as people, and that if right principles prevailed he would not need
    to change the empire's state.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Tsze-lu, having fallen behind, meets an old man carrying a weed basket on
    a staff; the old man criticizes him for being unused to toil and not distinguishing
    the five grains.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The old man plants his staff, weeds, hosts Tsze-lu overnight, kills a fowl,
    prepares millet, feasts him, and introduces two sons.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Confucius calls the old man a recluse and sends Tsze-lu back, but the old
    man is gone.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: Tsze-lu tells the old man's family that refusing office is not righteous because
    duties between sovereign and minister should not be set aside.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Confucius names several men who retired to privacy from the world and distinguishes
    their ways of maintaining will, purity, speech, and conduct.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Confucius says he differs from the named retired men because he has no predetermined
    course either for or against action.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:16
  text: Several music masters go to other states, and Fang-shu the drum master withdraws
    north of the river.
  category: sequence
  evidence_refs:
