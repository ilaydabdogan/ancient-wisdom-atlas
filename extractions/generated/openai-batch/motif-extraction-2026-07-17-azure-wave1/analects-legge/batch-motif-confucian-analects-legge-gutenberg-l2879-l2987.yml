candidate_motifs:
- id: motif:1
  label: Withdrawal or departure from corrupt or unsuitable public life
  taxonomy_refs:
  - departure
  basis: The passage repeatedly shows figures withdrawing, departing from courts,
    retiring to privacy, advising withdrawal from the world, or moving away from office
    contexts.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:6
  - ev:8
  - ev:10
  - ev:11
  confidence: high
  cautions: The pattern is ethical and political rather than a supernatural journey
    motif.
- id: motif:2
  label: Upright service despite dismissal and disorder
  taxonomy_refs:
  - wisdom
  basis: Hui of Liu-hsia explains repeated dismissal as a consequence of upright service;
    Confucius and Tsze-lu defend engagement with mankind and office despite failed
    principles.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: This is a moral-teaching pattern within a philosophical text, not a mythic
    episode.
- id: motif:3
  label: Admonishing recluse warns against political engagement
  taxonomy_refs:
  - wisdom
  basis: Chieh-yu, Chieh-ni, and the old man each confront Confucius or Tsze-lu from
    a withdrawn or agrarian position and question engagement in public affairs.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage presents these figures as human recluses or field workers,
    not supernatural messengers.
- id: motif:4
  label: Seeking the ford amid flood-like disorder
  taxonomy_refs:
  - wisdom
  basis: Confucius sends Tsze-lu to inquire for a ford, and the response turns into
    a speech about disorder spreading like a swelling flood over the empire.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Only the flood is explicitly a simile for disorder; the ford's broader
    symbolic function is implied by the dialogue rather than stated.
- id: motif:5
  label: Courtly entertainment gift disrupts governance and prompts the sage's departure
  taxonomy_refs:
  - departure
  basis: Female musicians are sent as a present, Chi Hwan receives them, court is
    suspended for three days, and Confucius departs.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage does not explicitly state the senders' motive or Confucius's
    internal reason, only the sequence of events.
- id: motif:6
  label: Virtuous remonstrance or uprightness leading to loss
  taxonomy_refs:
  - wisdom
  basis: Pi-kan remonstrates and dies, while Hui of Liu-hsia serves uprightly and
    is dismissed three times.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: Only Pi-kan's death is directly paired with remonstrance; Hui's loss is
    dismissal rather than death.
