candidate_motifs:
- id: motif:1
  label: Wisdom through disciplined teaching and inquiry
  taxonomy_refs:
  - wisdom
  basis: The Master explains questions exhaustively, Yen Yuan says the Master leads
    people by orderly method through learning and propriety, and the passage includes
    explicit reflections on learning.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:14
  confidence: high
  cautions: This is a didactic-philosophical pattern rather than a narrative myth
    episode.
- id: motif:2
  label: Moral truth entrusted under Heaven
  taxonomy_refs:
  - wisdom
  basis: In danger at K'wang, the Master says the cause of truth was lodged in him
    after King Wan and that Heaven does not let that cause perish; Tsze-kung also
    says Heaven endowed the Master.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage presents this as reported speech about moral mission and Heaven,
    not as a full divine commission myth.
- id: motif:3
  label: Absent auspicious signs
  taxonomy_refs: []
  basis: The Master states that the FANG bird does not come and the river sends forth
    no map, and treats these absences as a negative sign for himself.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage does not explain the FANG bird or river map; their omen-like
    function is inferred only from the Master's lament.
- id: motif:4
  label: Ritual humility against arrogant custom
  taxonomy_refs: []
  basis: The Master accepts a common economical cap practice but rejects the newer
    bowing practice as arrogant, continuing to bow below the hall.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a ritual-ethical pattern, not a mythic-symbolic narrative by itself.
- id: motif:5
  label: Truthfulness before Heaven at death
  taxonomy_refs: []
  basis: When ill, the Master rejects pretended ministers as deceitful and asks whether
    such deception would impose upon Heaven.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The scene is ethical and biographical; any broader deathbed motif should
    be reviewed by a human.
- id: motif:6
  label: Water as ceaseless passage
  taxonomy_refs: []
  basis: Standing by a stream, the Master says it passes on without ceasing day or
    night.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage gives only a brief saying; no explicit cosmological or afterlife
    water motif is present.
- id: motif:7
  label: Civilizing presence of the superior man
  taxonomy_refs: []
  basis: The Master says rudeness would not remain if a superior man dwelt among the
    nine wild tribes of the east.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage names an ethical superior man, not a mythic culture hero;
    no historical contact or migration claim is supported.
- id: motif:8
  label: Value recognized by the right buyer
  taxonomy_refs: []
  basis: The beautiful gem may be kept or sold; the Master says to sell it but wait
    for one to offer the price.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage does not explicitly identify the gem's referent; symbolic
    meaning requires review.
