canonical_text:
  quote: ''
  summary: 'The passage records sayings and anecdotes about the Master: his restraint
    in speaking of profit, Heaven, and perfect virtue; his ritual choices; his conduct
    under danger in K''wang; his relation to King Wan''s cause of truth and to Heaven;
    discussions of sagehood, learning, teaching, omens, mourning conduct, illness,
    burial, the sale of a gem, dwelling among eastern tribes, reforming music, duties,
    the ceaseless stream, love of virtue, and learning compared to raising a mound.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master is said to have seldom spoken about profitableness, the appointments
    of Heaven, and perfect virtue.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man of Ta-hsiang praises K'ung's extensive learning while saying he is not
    famous for any particular thing; the Master responds by saying he will practise
    charioteering rather than archery.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master follows common practice in wearing a silk cap instead of the prescribed
    linen cap because it is economical, but he continues bowing below the hall against
    common practice because the newer practice is arrogant.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master is described as free from foregone conclusions, arbitrary predeterminations,
    obstinacy, and egoism.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: When put in fear in K'wang, the Master says that after King Wan's death the
    cause of truth was lodged in him and that Heaven does not let that cause perish.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: A high officer asks whether the Master may be called a sage because of his
    varied ability; Tsze-kung attributes this to Heaven, while the Master says he
    learned many arts because his youthful condition was low and he had no official
    employment.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Master says he is not possessed of knowledge, but if an apparently empty
    mean person asks him something, he sets it forth from one end to the other.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Master laments that the FANG bird does not come and that the river sends
    forth no map, concluding that it is all over with him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: When the Master sees a person in mourning dress, a person in full dress, or
    a blind person approaching, he rises even if they are younger than himself, and
    if passing them he does so hastily.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: Yen Yuan says the Master's doctrines appear higher when looked up to, firmer
    when penetrated, and elusive in front and behind; he says the Master leads men
    by orderly method, enlarges the mind with learning, and teaches propriety.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: During a remission of illness, the Master rebukes Tsze-lu's wish that disciples
    act as ministers to him, saying this would be deceitful and would impose upon
    Heaven.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Master says it is better for him to die in the hands of his disciples
    than in the hands of pretended ministers, and asks whether he would die upon the
    road even without a great burial.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Tsze-kung compares something present to a beautiful gem and asks whether to
    store it in a case or sell it; the Master says to sell it, but to wait for one
    to offer the price.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Master wishes to live among the nine wild tribes of the east and says
    that if a superior man dwelt among them, there would be no rudeness.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: The Master says that after returning from Wei to Lu, the music was reformed
    and the Royal songs and Praise songs found their proper places.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: The Master lists service abroad to high ministers and nobles, service at home
    to father and elder brothers, exertion in duties to the dead, and not being overcome
    by wine, then asks which of these he attains.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:17
  text: Standing by a stream, the Master says that it passes on without ceasing day
    or night.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:18
  text: The Master says he has not seen someone who loves virtue as he loves beauty.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:19
  text: The passage begins a comparison of learning to raising a mound, where stopping
    with one basket of earth remaining leaves the work incomplete; the supplied passage
    ends before the comparison is finished.
  category: speech
  evidence_refs:
  - ev:14
