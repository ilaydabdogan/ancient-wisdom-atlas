canonical_text:
  quote: The wise find pleasure in water; the virtuous find pleasure in hills.
  summary: A sequence of sayings and brief exchanges defines wisdom, perfect virtue,
    the superior man, the Constant Mean, and the qualities of a sage, with references
    to water, hills, a well, a vessel without corners, Heaven, and the sage-kings
    Yao and Shun.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Master says that those who know the truth are not equal to those who love
    it, and those who love it are not equal to those who delight in it.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says that the highest subjects may be announced to those above
    mediocrity, but not to those below mediocrity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fan Ch'ih asks what constitutes wisdom, and the Master answers that wisdom
    consists in earnest attention to duties due to people, while respecting spiritual
    beings and keeping aloof from them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master says that the man of virtue makes the difficulty to be overcome
    his first business and treats success as subsequent.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Master associates the wise with pleasure in water, activity, and joy,
    and the virtuous with pleasure in hills, tranquility, and long life.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Master says that Ch'i could change into the State of Lu, and that Lu could
    change into a state where true principles predominated.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Master remarks that a cornered vessel without corners is a strange cornered
    vessel.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tsai Wo proposes that a benevolent man, if told there is a man in the well,
    would go in after him; Confucius asks why he should do so.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Confucius says a superior man may be made to go to the well, but cannot be
    made to go down into it; he may be imposed upon, but cannot be fooled.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Master says the superior man can avoid overstepping what is right by extensive
    study and restraint under the rules of propriety.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: After the Master visits Nan-tsze and Tsze-lu is displeased, the Master swears
    that Heaven may reject him if he has acted improperly.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Master praises virtue according to the Constant Mean and says its practice
    has long been rare among the people.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Tsze-kung asks whether a man who extensively benefits the people and can assist
    all may be called perfectly virtuous; the Master says such a person must have
    the qualities of a sage and mentions Yao and Shun.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: The Master says the man of perfect virtue seeks to establish and enlarge others
    as he seeks to establish and enlarge himself, and that judging others by what
    is near in oneself may be called the art of virtue.
  category: speech
  evidence_refs:
  - ev:11
