canonical_text:
  quote: What you do not want done to yourself, do not do to others.
  summary: The passage presents sayings of the Master on reciprocity, proper judgment,
    speech, reforming faults, learning, truth, virtue, governance, service, teaching,
    and plain language. It ends with a brief scene in which the Master guides Music-master
    Mien by identifying steps, a mat, and attendees, then explains that this is the
    rule for those who lead the blind.
  language: English
  quote_policy: quoted
