canonical_text:
  quote: ''
  summary: The passage presents sayings and dialogues in which the Master evaluates
    appearances of virtue, gives different advice to disciples according to temperament,
    discusses loyal and righteous ministerial service, criticizes premature appointment
    and glib speech, and asks several disciples to state their ambitions. The final
    dialogue contrasts plans for government and ritual office with Tsang Hsi's wish
    for a spring outing involving washing, wind at rain altars, singing, and return,
    which the Master approves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master says that a person may avoid following others' footsteps yet still
    not enter the sage's chamber, and he questions whether solid and sincere-looking
    discourse proves true superiority or only outward gravity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsze-lu and Zan Yu ask the same question about immediately carrying into practice
    what they hear; the Master tells Tsze-lu to consult father and elder brothers
    but tells Zan Yu to act immediately.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kung-hsi Hwa asks why the Master gave different replies; the Master explains
    that Ch'iu is retiring and slow, while Yu has more than his share of energy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: In K'wang the Master is put in fear, Yen Yuan falls behind, and after Yen
    Yuan rejoins him the Master says he thought Yen Yuan had died.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yen Yuan replies that while the Master is alive, he would not presume to die.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Master defines a great minister as one who serves his prince according
    to what is right and retires when he cannot do so.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Master calls Yu and Ch'iu ordinary ministers and says that they would
    not follow their chief in parricide or regicide.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tsze-lu appoints Tsze-kao governor of Pi; the Master says this injures a man's
    son, while Tsze-lu defends the appointment by pointing to people, officers, and
    altars of the spirits of land and grain.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Master asks the disciples seated with him what they would like to do if
    some ruler were to know them.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Tsze-lu imagines governing a state of ten thousand chariots under military
    pressure and famine, and says he could make the people bold and aware of righteous
    conduct in three years; the Master smiles at him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Zan Yu imagines governing a smaller state and says he could make plenty abound
    in three years, while leaving instruction in propriety and music to the rise of
    a superior man.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Kung-hsi Hwa says he wishes to learn ritual service and to act as a small
    assistant at ancestral temple services and audiences of princes with the sovereign,
    wearing a dark robe and black linen cap.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Tsang Hsi pauses while playing a lute, lays the instrument aside, rises, and
    says his wishes differ from those of the other three disciples.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: Tsang Hsi describes going in the last month of spring with capped young men
    and boys, washing in the I, enjoying the breeze among the rain altars, and returning
    home singing; the Master approves his wish.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: After the three others leave, Tsang Hsi asks why the Master smiled at Yu,
    and the Master says Yu's words were not humble because management of a state demands
    propriety.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:16
  text: The Master explains that Ch'iu's territory was also a state and that Ch'ih's
    proposed ritual service also concerns princes, ancestral temples, and audiences
    with the sovereign.
  category: speech
  evidence_refs:
  - ev:8
