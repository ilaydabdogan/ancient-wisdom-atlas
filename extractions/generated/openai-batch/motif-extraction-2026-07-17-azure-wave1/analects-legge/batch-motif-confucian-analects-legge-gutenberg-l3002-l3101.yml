canonical_text:
  quote: ''
  summary: Book XIX presents a sequence of sayings attributed to Tsze-chang, Tsze-hsia,
    Tsze-yu, Tsang, and Tsze-kung about public duty, righteousness, learning, the
    superior man, teaching, mourning, filial continuity, and compassionate criminal
    judgment. The final statement about Chau is cut off at the passage boundary.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tsze-chang states that a scholar trained for public duty is ready to sacrifice
    his life in danger, thinks of righteousness when gain appears, is reverent in
    sacrificing, and thinks about proper grief in mourning.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tsze-chang questions the value of holding virtue without enlarging it and
    believing right principles without firm sincerity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tsze-hsia’s reported advice to associate with advantageous people and put
    away others is contrasted with Tsze-chang’s statement that the superior man honors
    the talented and virtuous, bears with all, praises the good, and pities the incompetent.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tsze-hsia says inferior studies have something worth observing but may become
    inapplicable if extended too far, and he connects extensive learning, sincere
    aim, earnest inquiry, and self-application with virtue.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tsze-hsia compares mechanics dwelling in shops to accomplish work with the
    superior man learning in order to reach the utmost of his principles.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Tsze-hsia describes the mean man as glossing his faults, and describes the
    superior man as stern from a distance, mild when approached, and firm when heard
    to speak.
  category: attribute
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Tsze-hsia says confidence from the people should precede imposing labors on
    them, and confidence from the prince should precede remonstrating with him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Tsze-hsia says that a person should not transgress the boundary line in great
    virtues, though he may pass and repass it in small virtues.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Tsze-yu criticizes Tsze-hsia’s followers as accomplished in sprinkling and
    sweeping, answering and replying, and advancing and receding, but ignorant of
    essentials; Tsze-hsia replies that all departments of teaching matter and compares
    disciples to plants assorted by classes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Tsze-hsia says an officer should use leisure for learning and that a student
    who completes learning should apply himself to office.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Tsang quotes the Master as saying that mourning for parents can show what
    is in people to the full extent.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Tsang reports the Master’s statement that Mang Chwang’s filial piety is difficult
    to attain because he did not change his father’s ministers or his father’s mode
    of government.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Tsang advises Yang Fu, after discovering the truth of an accusation, to grieve
    for and pity the people rather than rejoice in his own ability, because rulers
    have failed and the people have long been disorganized.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The passage closes with the beginning of Tsze-kung’s statement that Chau’s
    wickedness was not as great as the name implies; the statement is incomplete in
    the supplied range.
  category: sequence
  evidence_refs:
  - ev:9
