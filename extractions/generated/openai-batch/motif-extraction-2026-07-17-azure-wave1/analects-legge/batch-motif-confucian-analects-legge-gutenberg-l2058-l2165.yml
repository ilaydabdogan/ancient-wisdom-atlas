canonical_text:
  quote: ''
  summary: The passage presents sayings and dialogues in which the Master evaluates
    shame, virtue, speech, poverty, public service, complete character, appropriate
    conduct, rulership, loyalty, and the public beneficence of Kwan Chung. It includes
    historical exempla contrasting martial or extraordinary ability with agricultural
    labor, and personal fidelity with large-scale political benefit.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hsien asks what is shameful, and the Master answers that thinking only of
    salary is shameful whether government is good or bad.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says that repressing superiority, boasting, resentments, and covetousness
    is difficult, but he does not affirm that it is perfect virtue; he also says that
    a scholar who loves comfort is not fit to be called a scholar.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master distinguishes correct speech and boldness from virtue and principle,
    and says that under bad government bold action may remain while language should
    have reserve.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Nan-kung Kwo contrasts an archer and Ao, who moved a boat on land and did
    not die naturally, with Yu and Chi, who personally worked at husbandry and became
    possessors of the kingdom; after Nan-kung Kwo leaves, the Master praises him as
    a superior man and esteemer of virtue.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Master says that love may lead to strictness toward its object, and loyalty
    may lead to instruction of its object.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Master describes governmental notifications as prepared through a sequence
    of rough drafting, examination and discussion, stylistic polishing, and final
    elegant finish.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Master calls Tsze-ch'an kind, recounts that the chief of the Po family
    did not murmur after losing Pien and being reduced to coarse rice, and says poverty
    without murmuring is difficult while riches without pride are easy.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: In response to Tsze-lu, the Master first defines a complete man through combined
    knowledge, freedom from covetousness, bravery, talents, propriety, and music;
    he then gives a present-day definition centered on righteousness before gain,
    readiness to give life in danger, and fidelity to an old agreement.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kung-ming Chia qualifies reports about Kung-shu Wan by saying that he speaks
    when it is time to speak, laughs when there is occasion for joy, and takes when
    taking is consistent with righteousness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Master says that Tsang Wu-chung, by keeping possession of Fang while asking
    the duke of Lu to appoint a successor for his family, was in effect using force
    with his sovereign.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Master evaluates the duke Wan of Tsin as crafty and not upright, and the
    duke Hwan of Ch'i as upright and not crafty.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: Tsze-lu and Tsze-kung question Kwan Chung's virtue because he did not die
    with Chiu after Duke Hwan caused Chiu to be killed and because he later served
    Duke Hwan as prime minister.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The Master defends Kwan Chung by saying that Duke Hwan assembled the princes
    without weapons and chariots through Kwan Chung's influence, and that Kwan Chung
    made Hwan leader of the princes, united and rectified the kingdom, and conferred
    benefits still enjoyed by the people.
  category: speech
  evidence_refs:
  - ev:6
