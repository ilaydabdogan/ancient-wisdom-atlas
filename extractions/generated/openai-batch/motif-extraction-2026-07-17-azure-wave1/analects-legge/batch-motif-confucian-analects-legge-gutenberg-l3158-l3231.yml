canonical_text:
  quote: ''
  summary: Book XX records sayings attributed to Yao, Shun, T'ang, Chau, and Confucius
    concerning Heaven-determined succession, ritual address to God, rulerly responsibility,
    restoration of political order, proper government, and the requirements for becoming
    a superior person.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yao addresses Shun and says that the Heaven-determined order of succession
    now rests in Shun's person; he instructs Shun to hold fast the due Mean and links
    distress within the four seas with the end of Heavenly revenue.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Shun is said to have used the same language when giving charge to Yu.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: T'ang addresses a most great and sovereign God while using a dark-coloured
    victim; he says that he will not pardon the sinner, will not hide God's ministers,
    and that offences by the people of the myriad regions must rest on his own person.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Chau confers great gifts, enriches the good, declares virtuous men superior
    to near relatives, and states that the people are throwing blame on him, the One
    man.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chau attends to weights and measures, examines the laws, restores discarded
    officers, revives extinguished states, restores broken family lines, and calls
    retired persons to office.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Chau's chief concerns are the people's food, mourning duties, and sacrifices;
    his generosity, sincerity, activity, and justice are said to win people, gain
    trust, produce achievements, and delight all.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Tsze-chang asks Confucius how a person in authority should act to conduct
    government properly; Confucius answers with five excellent things to honor.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Confucius explains beneficence without great expenditure, proper labor assignments,
    benevolent government without covetousness, respectful dignified ease, and majesty
    shown through adjusted clothes, cap, and looks rather than fierceness.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: 'Confucius identifies four bad governmental actions: killing uninstructed
    people, suddenly requiring full work without warning, delaying urgency and then
    enforcing severity, and giving pay or rewards stingily.'
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Confucius says that recognizing the ordinances of Heaven, knowing the rules
    of Propriety, and knowing the force of words are necessary for being a superior
    man, establishing character, and knowing men.
  category: speech
  evidence_refs:
  - ev:10
