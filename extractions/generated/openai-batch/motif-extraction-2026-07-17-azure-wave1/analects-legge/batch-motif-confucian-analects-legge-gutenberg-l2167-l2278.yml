canonical_text:
  quote: ''
  summary: A sequence of Analects sayings and anecdotes presents Confucius judging
    officials, explaining why a flawed ruler keeps his state through competent ministers,
    responding to regicide, advising direct service to rulers, contrasting the superior
    and mean person, praising self-cultivation, discussing recognition by Heaven,
    treating slander as subordinate to a larger ordering, describing withdrawal by
    worthy people, and being identified by a gatekeeper as one who acts despite knowing
    the times are impracticable.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening fragment refers to unnamed common men and women who would commit
    suicide in a stream or ditch without being known.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hsien, formerly family-minister to Kung-shu Wan, ascends to the prince's court
    with Wan; Confucius says Hsien deserved to be considered accomplished.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Confucius says Duke Ling of Wei does not lose his state because named officers
    manage guests and strangers, the ancestral temple, and the army and forces.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Confucius states that a person who speaks without modesty will have difficulty
    making his words good.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Chan Ch'ang is said to have murdered Duke Chien of Ch'i; Confucius bathes,
    goes to court, reports the killing to Duke Ai, asks that the killer be punished,
    is directed to tell the chiefs of the three families, and later says the chiefs
    would not act.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: When Tsze-lu asks how to serve a ruler, Confucius tells him not to impose
    on the ruler and to withstand him to his face.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Confucius contrasts the superior man's progress as upward with the mean man's
    progress as downward.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Confucius says ancient learners studied for their own improvement, whereas
    present learners study for others' approval.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Chu Po-yu sends a messenger to Confucius; the messenger says his master is
    trying to make his faults few but has not yet succeeded, and Confucius praises
    the messenger.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Confucius says someone outside a particular office should not plan its duties,
    and Tsang says the superior man does not go out of his place in thought.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Confucius says the superior man is modest in speech and exceeds in action,
    and also describes the superior man's way as virtuous, wise, and bold.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Tsze-kung remarks that Confucius is describing himself when Confucius says
    the superior man is free from anxieties, perplexities, and fear.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Confucius says he is not concerned that others do not know him, but is concerned
    at his own lack of ability.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:14
  text: Confucius describes a person of superior worth as not anticipating deception
    or disbelief, yet readily apprehending such things when they occur.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: Wei-shang Mau asks Confucius whether he keeps roosting about because he is
    an insinuating talker; Confucius denies playing that part and says he hates obstinacy.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: Confucius says a horse is called a ch'i not because of strength but because
    of other good qualities.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:17
  text: When asked about recompensing injury with kindness, Confucius asks how kindness
    would then be recompensed and says to recompense injury with justice and kindness
    with kindness.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:18
  text: Confucius says no one knows him, says he does not murmur against Heaven or
    grumble against men, and says Heaven knows him.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:19
  text: Kung-po Liao slanders Tsze-lu to Chi-sun; Tsze-fu Ching-po tells Confucius
