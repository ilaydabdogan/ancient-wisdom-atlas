  quote: ''
  summary: The passage presents sayings and anecdotes in which the Master evaluates
    former and later ritual practice, classifies disciples by abilities, praises or
    criticizes named disciples, mourns the death of Yen Yuan/Hui, discusses funerary
    propriety, declines to answer about death before life is understood, comments
    on moderation, and condemns Ch'iu for enriching the Chi family.
  language: English
  quote_policy: summarized
