  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master says the ancients all followed this practice, and that after a
    sovereign died, officers attended to their duties under instructions from the
    prime minister for three years.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Master says that when rulers love observing the rules of propriety, the
    people readily respond to calls for service.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In response to Tsze-lu's question about the superior man, the Master describes
