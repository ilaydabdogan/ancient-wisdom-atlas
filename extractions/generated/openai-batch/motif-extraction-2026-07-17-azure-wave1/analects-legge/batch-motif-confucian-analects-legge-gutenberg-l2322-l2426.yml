- id: ev:7
  type: summary
  locator: lines 2322-2426, BOOK XV, CHAP. VI
  quote_or_summary: Historiographer Yu is like an arrow under both good and bad government;
    Chu Po-yu serves in office under good government and keeps his principles in his
    breast under bad government.
  source_text_path: texts/public-domain/confucian/project-gutenberg/analects-legge.md
  rights_note: Public domain source metadata; summarized.
- id: ev:8
  type: summary
  locator: lines 2322-2426, BOOK XV, CHAP. VII
  quote_or_summary: The Master says one errs by not speaking to a person who may be
    spoken with, or by speaking to one who may not; the wise err neither in regard
    to the person nor the words.
  source_text_path: texts/public-domain/confucian/project-gutenberg/analects-legge.md
  rights_note: Public domain source metadata; summarized.
- id: ev:9
  type: summary
  locator: lines 2322-2426, BOOK XV, CHAP. VIII
  quote_or_summary: The determined scholar and man of virtue will not injure virtue
    to live, and will even sacrifice their lives to preserve virtue complete.
  source_text_path: texts/public-domain/confucian/project-gutenberg/analects-legge.md
  rights_note: Public domain source metadata; summarized.
- id: ev:10
  type: summary
  locator: lines 2322-2426, BOOK XV, CHAP. IX
  quote_or_summary: Asked about practicing virtue, the Master compares preparation
    to a mechanic sharpening tools, then advises service with worthy officers and
    friendship with virtuous scholars.
  source_text_path: texts/public-domain/confucian/project-gutenberg/analects-legge.md
  rights_note: Public domain source metadata; summarized.
- id: ev:11
  type: summary
  locator: lines 2322-2426, BOOK XV, CHAP. X
  quote_or_summary: To Yen Yuan's question about government, the Master recommends
    Hsia seasons, Yin carriage, Chau cap, Shao music and pantomimes, and rejection
    of Chang songs and specious talkers.
  source_text_path: texts/public-domain/confucian/project-gutenberg/analects-legge.md
  rights_note: Public domain source metadata; summarized.
- id: ev:12
  type: summary
  locator: lines 2322-2426, BOOK XV, CHAP. XI-XII
  quote_or_summary: The Master says lack of thought about what is distant brings near
    sorrow, and laments not seeing one who loves virtue as he loves beauty.
  source_text_path: texts/public-domain/confucian/project-gutenberg/analects-legge.md
  rights_note: Public domain source metadata; summarized.
- id: ev:13
  type: summary
  locator: lines 2322-2426, BOOK XV, CHAP. XIII
  quote_or_summary: Tsang Wan is called like one who stole his situation because he
    knew Hui of Liu-hsia's virtue and talents but did not procure that Hui should
    stand with him in court.
  source_text_path: texts/public-domain/confucian/project-gutenberg/analects-legge.md
  rights_note: Public domain source metadata; summarized.
- id: ev:14
  type: summary
  locator: lines 2322-2426, BOOK XV, CHAP. XIV-XVII
  quote_or_summary: The Master teaches demanding much from oneself and little from
    others, repeated reflection, righteous conversation, and the superior man's completion
    of righteousness with propriety, humility, and sincerity.
  source_text_path: texts/public-domain/confucian/project-gutenberg/analects-legge.md
  rights_note: Public domain source metadata; summarized.
- id: ev:15
  type: summary
  locator: lines 2322-2426, BOOK XV, CHAP. XVIII-XXII
  quote_or_summary: The Master says the superior man is distressed by lack of ability,
    seeks in himself, is dignified without wrangling and sociable without partisanship,
    and does not promote or reject solely on the relation between a man and his words.
