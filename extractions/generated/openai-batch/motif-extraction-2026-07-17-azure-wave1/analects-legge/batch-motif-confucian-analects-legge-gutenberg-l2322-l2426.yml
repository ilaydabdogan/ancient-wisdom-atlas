candidate_motifs:
- id: motif:1
  label: Master-disciple ethical wisdom instruction
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly presents disciples or interlocutors asking questions
    and the Master answering with concise teachings on virtue, conduct, government,
    and speech.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:10
  - ev:11
  - ev:14
  - ev:15
  confidence: high
  cautions: This is a didactic-philosophical pattern rather than a mythic narrative
    episode.
- id: motif:2
  label: Virtue preserved through deprivation or life-sacrifice
  taxonomy_refs:
  - wisdom
  - sacrifice
  basis: The superior man may endure want without license, and the determined scholar
    or man of virtue may sacrifice life to preserve virtue complete.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: high
  cautions: The sacrifice is moral self-sacrifice, not an explicit ritual sacrifice.
- id: motif:3
  label: Effortless sage rulership by reverent presence
  taxonomy_refs:
  - royal_legitimacy
  - wisdom
  basis: Shun is named as an exemplar of efficient government without exertion, doing
    only the act of gravely and reverently occupying the royal seat.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives only a brief exemplum and no extended account of Shun's
    rule.
- id: motif:4
  label: Government ordered by ancient ritual and cultural precedents
  taxonomy_refs:
  - royal_legitimacy
  - wisdom
  basis: The Master's instructions for administration select institutions or cultural
    forms associated with Hsia, Yin, Chau, and Shao, while rejecting Chang songs and
    specious talkers.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The line is prescriptive and ritual-political; it does not narrate a myth
    of dynastic origin.
- id: motif:5
  label: Moral discernment in speech, office, and recognition
  taxonomy_refs:
  - wisdom
  basis: The passage teaches speaking only when appropriate, choosing office or withdrawal
    according to political conditions, advancing the worthy, and not judging men only
    by words.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:13
  - ev:15
  confidence: high
  cautions: This motif is ethical and social rather than supernatural.
comparison_claims:
- id: claim:1
  claim: The governance advice explicitly compares or coordinates selected cultural
    forms from Hsia, Yin, Chau, and Shao as functional precedents for administering
    a country, while contrasting them with Chang songs and specious talkers to be
    rejected.
  claim_level: same_function
  target: ancient Chinese dynastic and court-cultural models for governance
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The passage provides a prescriptive list, not a historical explanation
    of transmission among these traditions.
- id: claim:2
  claim: Shun is used as a named sage-ruler exemplar for the same function of efficient
    government, specifically through reverent occupation of the royal seat rather
    than active exertion.
  claim_level: same_function
  target: sage-ruler governance pattern
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: Only the exemplifying statement is present; no full Shun narrative
    is supplied.
- id: claim:3
  claim: Historiographer Yu and Chu Po-yu are presented as comparable official exemplars
    whose conduct is evaluated in relation to good and bad government.
  claim_level: same_function
  target: exemplary official conduct under changing political conditions
  evidence_refs:
  - ev:7
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is local to the passage and does not establish historical
    contact or broader motif diffusion.
