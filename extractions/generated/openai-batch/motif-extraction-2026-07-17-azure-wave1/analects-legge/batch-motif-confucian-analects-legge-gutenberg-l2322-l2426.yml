canonical_text:
  quote: ''
  summary: A sequence of sayings and brief encounters in which Confucius refuses military
    expertise, comments on hardship, teaches disciples about virtue, conduct, speech,
    office-holding, government, and the qualities of the superior man, and invokes
    named exemplars and ancient ritual-political precedents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Duke Ling of Wei asks Confucius about tactics; Confucius answers that
    he knows about sacrificial vessels but has not learned military matters, and departs
    the next day.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: In Chan, provisions are exhausted and Confucius's followers become too ill
    to rise.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tsze-lu asks whether the superior man must endure such hardship; the Master
    contrasts the superior man's endurance of want with the mean man's license under
    want.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master tells Ts'ze/Tsze-kung that he does not merely learn and memorize
    many things, but seeks a unity all-pervading.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Master says those who know virtue are few.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Shun is cited as governing efficiently without exertion by gravely and reverently
    occupying his royal seat.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tsze-chang asks how to be appreciated everywhere; the Master instructs him
    to maintain sincere and truthful words and honorable and careful actions, imagining
    them before him or attached to a carriage yoke.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Tsze-chang writes the Master's counsels on the end of his sash.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The historiographer Yu is described as straightforward like an arrow in both
    good and bad government.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Chu Po-yu is said to hold office when good government prevails and to roll
    up his principles and keep them in his breast when bad government prevails.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Master says wisdom involves knowing when a person may be spoken with and
    avoiding error with both the person and the words.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The determined scholar and man of virtue are said not to preserve life by
    injuring virtue, and even to sacrifice life to keep virtue complete.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: A mechanic who wishes to work well must first sharpen his tools; this is used
    in advice about serving worthy officers and befriending virtuous scholars.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: For government, the Master tells Yen Yuan to follow the seasons of Hsia, ride
    in the state carriage of Yin, wear the ceremonial cap of Chau, use the Shao music
    with pantomimes, banish the songs of Chang, and avoid specious talkers.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Tsang Wan is compared to one who stole his situation because he knew Hui of
    Liu-hsia's virtue and talents but did not arrange for Hui to stand with him in
    court.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:16
  text: Later sayings describe the superior man as self-demanding, righteousness-centered,
    humble, sincere, concerned with ability, self-directed, dignified without wrangling,
    sociable without partisanship, and discerning about men and words.
  category: attribute
  evidence_refs:
  - ev:14
  - ev:15
