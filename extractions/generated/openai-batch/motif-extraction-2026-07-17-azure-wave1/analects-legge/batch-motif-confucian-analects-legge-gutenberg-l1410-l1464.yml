literal_observations:
- id: obs:1
  text: When sending complimentary inquiries to someone in another state, he bowed
    twice while escorting the messenger away.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Chi K'ang sent physic, he bowed and received it but said he did not know
    it and dared not taste it.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the stable burned down, he asked whether any man had been hurt and did
    not ask about the horses.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the prince sent cooked meat, he adjusted his mat, tasted it first, and
    then gave it away to others.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: When the prince sent undressed meat, he had it cooked and offered it to the
    spirits of his ancestors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the prince sent a living animal, he kept it alive.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: When ill and visited by the prince, he placed his head to the east, spread
    court robes over himself, and drew his girdle across them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When summoned by the prince's order, he went at once without waiting for his
    carriage to be yoked.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: When he entered the ancestral temple of the state, he asked about everything.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: If a friend died and lacked dependable relations for the necessary offices,
    he said he would bury him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: He did not bow for ordinary presents from friends, even a carriage and horses;
    the only such present for which he bowed was flesh of sacrifice.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: He changed countenance or performed formal salutations in response to mourning
    dress, full-dress cap, a blind person, persons in mourning, persons bearing population
    tables, abundant provisions, thunder, and violent wind.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: In a carriage he did not turn his head fully around, talk hastily, or point
    with his hands.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The Master spoke of a hen-pheasant on the hill bridge as being at its season;
    after Tsze-lu made a motion to it, it smelled him three times and then rose.
  category: sequence
  evidence_refs:
  - ev:10
