canonical_text:
  quote: Does Heaven speak? The four seasons pursue their courses, and all things
    are continually being produced, but does Heaven say anything?
  summary: The passage presents sayings and dialogues attributed to the Master on
    ambition, ancient and present failings, deceptive speech and appearances, Heaven's
    silent activity, a refused visit signaled through music, the three years' mourning
    for parents, idleness, valor governed by righteousness, proper hatreds, social
    conduct toward girls and servants, and fixed character after age forty.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Master says that certain mean creatures are impossible companions in serving
    a prince because they anxiously seek aims, fear losing them once obtained, and
    will proceed to anything when afraid of loss.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master contrasts ancient and present forms of high-mindedness, stern dignity,
    and stupidity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master says that fine words and an insinuating appearance are seldom associated
    with virtue.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master says he hates purple displacing vermilion, songs of Chang confounding
    the music of the Ya, and sharp-mouthed people overthrowing kingdoms and families.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Master says he would prefer not speaking; when Tsze-kung asks what disciples
    would record, the Master points to Heaven, the seasons, and continual production.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Zu Pei wants to see Confucius; Confucius declines on the ground of sickness,
    then takes his lute and sings so that Pei may hear him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tsai Wo asks about the three years' mourning for parents and argues that one
    year is long enough, citing propriety, music, grain, and fire-making wood cycles.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Master asks whether Tsai Wo would feel at ease after one year eating good
    rice and wearing embroidered clothes; Tsai Wo replies that he would.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Master says the superior man in mourning does not enjoy pleasant food,
    music, or comfortable lodging, and does not do what Tsai Wo proposes because he
    is not at ease.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: After Tsai Wo leaves, the Master says Yu lacks virtue and connects three years'
    mourning to the time before a child leaves the arms of its parents.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Master says a person who stuffs himself with food all day without applying
    his mind to anything good is hard to deal with, and that gaming or chess would
    be better than doing nothing.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: In response to Tsze-lu's question about valor, the Master says the superior
    man holds righteousness most important and that valor without righteousness leads
    to insubordination or robbery according to station.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Master and Tsze-kung each name behaviors they hate, including proclaiming
    others' evil, slandering superiors, valor without propriety, prying, immodesty,
    and making known secrets.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The Master says girls and servants are difficult to behave toward, because
    familiarity leads them to lose humility and reserve makes them discontented.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Master says that when a man at forty is the object of dislike, he will
    always continue what he is.
  category: speech
  evidence_refs:
  - ev:12
