- id: motif:2
  label: ethical poverty preferred to unrighteous wealth
  taxonomy_refs: []
  basis: The Master expresses joy with simple food, water, and a bent arm for a pillow,
    and treats unrighteous riches and honors as a floating cloud.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: No supplied taxonomy family precisely matches this ethical motif.
- id: motif:3
  label: prudence over reckless heroic danger
  taxonomy_refs: []
  basis: The Master rejects a companion who would attack a tiger unarmed or cross
    a river without a boat and instead prefers one who plans carefully.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage uses dangerous images to teach prudence; it does not narrate
    an actual tiger combat or river crossing.
- id: motif:4
  label: ancient exemplars guide present judgment
  taxonomy_refs:
  - wisdom
  basis: The Master compares himself to old P'ang, formerly dreams of the duke of
    Chau, praises Po-i and Shu-ch'i as ancient worthies, and says he seeks knowledge
    in antiquity.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:15
  - ev:22
  confidence: medium
  cautions: The examples are brief sayings; the passage does not elaborate the ancient
    figures' stories.
- id: motif:5
  label: music producing transformed perception of appetite
  taxonomy_refs: []
  basis: After hearing the Shao, the Master does not know the taste of flesh for three
    months and praises the music's excellence.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The effect is stated as an exceptional response to music, not as a supernatural
