candidate_motifs:
- id: motif:1
  label: Didactic wisdom through question-and-answer maxims
  taxonomy_refs:
  - wisdom
  basis: The passage consists of concise teachings and responses on government, virtue,
    official status, constancy, and moral judgment.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  - ev:8
  - ev:13
  - ev:14
  - ev:16
  confidence: high
  cautions: This is ethical and political instruction rather than a mythic narrative
    episode.
- id: motif:2
  label: Self-rectification before governing others
  taxonomy_refs:
  - wisdom
  basis: The Master directly links correct self-conduct with the ability to assist
    in government and rectify others.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The motif is a moral-political teaching; no supernatural or cosmological
    element is present.
- id: motif:3
  label: Ruler's speech and counsel affect the country
  taxonomy_refs:
  - wisdom
  basis: The Duke Ting exchange treats sayings and rulerly words as conditionally
    connected with the prosperity or ruin of a country, especially when bad words
    face no opposition.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: Confucius explicitly denies that one sentence mechanically causes prosperity
    or ruin; the pattern is conditional and didactic.
- id: motif:4
  label: Kinship loyalty as uprightness
  taxonomy_refs:
  - wisdom
  basis: The passage contrasts public testimony against a father with mutual concealment
    between father and son, and locates uprightness in the latter.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: This is an ethical kinship example, not a narrative of a named mythic
    family.
- id: motif:5
  label: Constancy as condition for specialist efficacy
  taxonomy_refs:
  - wisdom
  basis: A southern saying states that a person without constancy cannot be a wizard
    or doctor, and the Master links inconstant virtue to disgrace.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The wizard and doctor occur within a proverb; the passage does not narrate
    actual ritual or medical practice.
