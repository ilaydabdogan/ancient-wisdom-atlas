canonical_text:
  quote: ''
  summary: A sequence of sayings and question-and-answer exchanges in which the Master/Confucius
    discusses self-rectification, government, rulership, official conduct, family
    loyalty, perfect virtue, constancy, social judgment, and the qualities of superior
    and mean persons.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master says that a minister whose own conduct is correct will have no
    difficulty assisting in government, while one who cannot rectify himself has no
    basis for rectifying others.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The disciple Zan returns from court; after Zan says he was delayed by government
    business, the Master says it must have been family affairs because he would have
    been consulted about true government business.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Duke Ting asks whether one sentence can make a country prosperous or ruin
    it, and Confucius answers that such effects cannot simply be expected from one
    sentence.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: Confucius cites a saying that being a prince is difficult and being a minister
    is not easy, and says a ruler who knows the difficulty of being a prince may contribute
    to the prosperity of his country.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Confucius cites a saying about a prince taking pleasure in no one opposing
    his words, and warns that unopposed bad words from a ruler may lead toward the
    ruin of the country.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When the Duke of Sheh asks about government, the Master says good government
    occurs when those nearby are made happy and those far away are attracted.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Tsze-hsia, as governor of Chu-fu, asks about government, and the Master advises
    against haste and against looking at small advantages.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Duke of Sheh describes people who testify when their father has stolen
    a sheep; Confucius replies that in his region father and son conceal each other's
    misconduct and that uprightness is found in this.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: Fan Ch'ih asks about perfect virtue, and the Master describes it as grave
    in retirement, reverently attentive in business, and strictly sincere with others,
    even among rude tribes.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: Tsze-kung asks about qualifications for being called an officer and lower
    ranks; the Master answers with conduct involving shame, not disgracing a prince's
    commission, filial and fraternal reputation, sincerity, and carrying out actions,
    then dismisses present-day government men as pecks and hampers.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  - ev:12
- id: obs:11
  text: The Master says that since he cannot find people pursuing the due medium,
    he must seek the ardent and the cautiously-decided; the ardent advance toward
    truth and the cautiously-decided avoid wrong.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:12
  text: The Master cites a southern saying that a man without constancy cannot be
    a wizard or doctor, and links inconstancy in virtue with disgrace and failure
    to attend to prognostication.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:13
  text: The Master contrasts the superior man, who is affable but not adulatory, with
    the mean man, who is adulatory but not affable.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:14
  text: When Tsze-kung asks about a person loved or hated by all in his neighborhood,
    the Master says neither universal love nor universal hatred is sufficient; it
    is better that the good love him and the bad hate him.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:15
  text: The Master says the superior man is easy to serve and difficult to please,
    and that he will not be pleased by attempts that do not accord with right; the
    passage ends mid-sentence after this point.
  category: speech
  evidence_refs:
  - ev:17
