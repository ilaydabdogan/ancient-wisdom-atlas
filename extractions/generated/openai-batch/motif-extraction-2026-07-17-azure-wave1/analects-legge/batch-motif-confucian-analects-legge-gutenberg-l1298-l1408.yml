canonical_text:
  quote: ''
  summary: The passage describes Confucius' demeanor, speech, bodily gestures, dress,
    fasting, eating, sacrificial conduct, seating, and participation in village ceremonies,
    especially in relation to court, ruler, guests, sacrifices, and communal rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Confucius appears simple and sincere in his village, speaks minutely but cautiously
    in the ancestral temple and court, and adjusts his speech and manner according
    to rank and the ruler's presence.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: When called by the prince to receive a visitor, Confucius' countenance and
    movement change; he inclines to other officers, keeps his robe adjusted, hastens
    with arms compared to bird wings, and reports after the visitor retires.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: At the palace gate and audience hall, Confucius bends his body, avoids the
    middle of the gateway and the threshold, changes demeanor near the prince's vacant
    place, holds up his robe, and restrains his breath.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: After the audience, Confucius relaxes after descending, advances rapidly with
    arms compared to wings, and still shows respectful uneasiness on returning to
    his place.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When carrying the ruler's scepter, Confucius bends as if it is heavy, holds
    it at regulated height, looks apprehensive, and drags his feet; he appears placid
    when presenting entrusted gifts and pleased at private audience.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage lists dress rules for the superior man, including avoided colors,
    garments worn over different furs, sleeping and home clothing, mourning restrictions,
    and monthly court robes.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: During fasting, Confucius considers it necessary to wear brightly clean linen
    clothing, change his food, and change his usual sitting place.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The passage describes food rules: preference for clean rice and finely cut
    meat, avoidance of spoiled, discolored, badly flavored, ill-cooked, out-of-season,
    improperly cut, or improperly sauced food, proportioning meat to rice, avoiding
    confusion from wine, rejecting market wine and dried meat, keeping ginger, and
    eating moderately.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: After assisting at the prince's sacrifice, Confucius does not keep received
    flesh overnight; family sacrifice flesh is not kept beyond three days, and even
    coarse food is offered in sacrifice with grave respect.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:10
  text: Confucius does not converse while eating, does not speak in bed, and does
    not sit on a mat unless it is straight.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: At village drinking, Confucius leaves immediately after those who carry staffs
    go out.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: When villagers perform ceremonies to drive away pestilential influences, Confucius
    puts on court robes and stands on the eastern steps.
  category: action
  evidence_refs:
  - ev:12
