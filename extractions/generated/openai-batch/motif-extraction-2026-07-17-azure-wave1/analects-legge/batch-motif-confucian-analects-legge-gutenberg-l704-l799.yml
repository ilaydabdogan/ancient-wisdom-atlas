- id: motif:3
  label: ritual acceptance despite human rejection
  taxonomy_refs:
  - sacrifice
  basis: The red horned calf image asks whether mountain-and-river spirits would reject
    a worthy animal even if people did not wish to use it.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage uses the ritual image rhetorically; no actual sacrifice is
    narrated.
- id: motif:4
  label: Heaven-appointed illness or fate
  taxonomy_refs: []
  basis: The Master's lament over Po-niu's sickness explicitly calls it the appointment
