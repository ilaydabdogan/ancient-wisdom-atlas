  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage does not explain Heaven's agency or connect the illness to
    judgment.
- id: motif:5
  label: ethical refusal of office or withdrawal from office
  taxonomy_refs: []
  basis: Min Tsze-ch'ien declines a governorship and states that repeated invitation
    would send him to live by the Wan.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The motive for refusal is not elaborated in the passage.
- id: motif:6
  label: proper distribution of material aid
  taxonomy_refs: []
  basis: The Master distinguishes aiding distress from increasing the wealth of the
    rich and suggests that declined grain may be given to local communities.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This is an ethical-administrative pattern, not a mythic exchange unless
    interpreted more broadly.
