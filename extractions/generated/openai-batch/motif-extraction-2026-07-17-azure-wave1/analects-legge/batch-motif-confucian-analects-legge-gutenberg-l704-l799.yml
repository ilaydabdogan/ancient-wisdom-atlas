canonical_text:
  quote: ''
  summary: In Book VI, chapters I-XVII, Confucius evaluates disciples and contemporaries,
    answers questions about learning and government service, discusses aid and redistribution,
    invokes a ritual image of a red horned calf and mountain-and-river spirits, visits
    the sick Po-niu, praises Hui's virtue amid poverty, and offers maxims about learning,
    conduct, balanced qualities, and uprightness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Master says Yung could occupy the place of a prince and later approves
    Yung's words about balancing reverential attention to affairs with ease in small
    matters.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: When Duke Ai asks which disciple loved learning, Confucius names Yen Hui,
    says Hui did not transfer anger or repeat a fault, and notes that Hui died young.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: In the grain episodes, requests and distributions are measured, and the Master
    distinguishes helping the distressed from adding to the wealth of the rich.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Master describes a red, horned calf born from a brindled cow and asks
    whether the spirits of mountains and rivers would set it aside if people did not
    wish to use it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Master says Hui could keep nothing in his mind contrary to perfect virtue
    for three months, while others reached this only briefly.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: Chi K'ang asks whether Chung-yu, Ts'ze, and Ch'iu are fit for government office;
    the Master answers by citing decision, intelligence, and varied ability.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Min Tsze-ch'ien declines the governorship of Pi and says a second invitation
    would make him live on the banks of the Wan.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Master visits Po-niu in illness, holds his hand through the window, and
    says the sickness is the appointment of Heaven.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Hui is described as living with one bamboo dish of rice, one gourd dish of
    drink, and a mean narrow lane, yet not letting his joy be affected by distress.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:10
  text: When Yen Ch'iu says his strength is insufficient for the Master's doctrines,
    the Master replies that he is limiting himself rather than stopping from true
    exhaustion.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Master instructs Tsze-hsia to be a scholar after the style of the superior
    man rather than the mean man.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Tan-t'ai Mieh-ming is reported as never taking a shortcut while walking and
    never coming to Tsze-yu's office except on public business.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: Mang Chih-fan is described as not boasting of merit after remaining in the
    rear during flight; he attributes his delay to his horse.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: The Master uses the door and ways as an analogy, contrasts solid qualities
    with accomplishments, and states that man is born for uprightness.
  category: speech
  evidence_refs:
  - ev:13
