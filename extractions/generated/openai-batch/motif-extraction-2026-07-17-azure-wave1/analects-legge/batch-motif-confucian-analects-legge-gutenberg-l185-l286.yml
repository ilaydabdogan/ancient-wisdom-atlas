    narrative.
- id: motif:2
  label: Moral-political order through virtue rather than coercion
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage says laws and punishments produce avoidance without shame, while
    virtue and propriety produce shame and goodness; later political counsel links
    submission and reverence to uprightness, gravity, filial kindness, and teaching.
  evidence_refs:
  - ev:3
  - ev:11
  confidence: medium
  cautions: The passage concerns effective and ethical rule, but it does not narrate
    royal origins, enthronement, or divine sanction.
