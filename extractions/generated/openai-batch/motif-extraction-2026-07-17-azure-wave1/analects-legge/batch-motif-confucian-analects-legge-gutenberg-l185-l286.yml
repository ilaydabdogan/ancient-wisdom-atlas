  summary: Book II opens with sayings of the Master on virtuous government, the moral
    aim of the Book of Poetry, the effects of law and punishment versus virtue and
    propriety, stages in the Master's own learning, filial piety, the conduct of Hui,
    discernment of character, learning and knowledge, the superior man, and counsel
    to political questioners about securing the people's submission, reverence, faithfulness,
    and pursuit of virtue. The passage ends with an incomplete opening question asking
    why Confucius is not engaged in government.
