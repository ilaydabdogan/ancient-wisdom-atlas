literal_observations:
- id: obs:1
  text: The Master says Yu could settle litigations with half a word, and Tsze-lu
    is described as never sleeping over a promise.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master says that in hearing litigations he is like anyone else, but what
    is necessary is causing the people to have no litigations.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tsze-chang asks about government, and the Master says governing requires keeping
    affairs before the mind without weariness and practicing them with consistency.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Master says extensive study restrained by propriety can prevent error,
    and contrasts the superior man with the mean man in relation to others' qualities.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Confucius tells Chi K'ang that to govern means to rectify and that leading
    the people with correctness will make them correct.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Confucius tells Chi K'ang that if he were not covetous, the people would not
    steal, and he rejects killing as a tool of government.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Confucius compares the relation between superiors and inferiors to wind and
    grass, saying grass must bend when wind blows across it.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Tsze-chang asks what makes an officer distinguished, and the Master distinguishes
    genuine distinction from notoriety.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Fan Ch'ih walks with the Master under trees near the rain altars and asks
    how to exalt virtue, correct cherished evil, and discover delusions.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Master tells Fan Ch'ih that benevolence is to love all men and knowledge
    is to know all men.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Master says to employ the upright and put aside the crooked so that the
    crooked can be made upright.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Tsze-hsia explains the Master's saying by citing Shun employing Kao-yao and
    T'ang employing I Yin, after which those devoid of virtue disappeared.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The Master tells Tsze-kung to admonish a friend faithfully, lead him skillfully,
    and stop if he is impracticable.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The philosopher Tsang says the superior man meets friends on grounds of culture
