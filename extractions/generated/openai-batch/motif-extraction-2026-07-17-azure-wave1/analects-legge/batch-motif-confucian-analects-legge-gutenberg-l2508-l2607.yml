canonical_text:
  quote: ''
  summary: Confucius rebukes Zan Yu and Chi-lu for assisting the Chi family head in
    a planned attack on Chwan-yu, argues from Chwan-yu's established ritual and political
    status, and teaches that rulers should cultivate civil virtue, harmony, and internal
    order rather than pursue aggression. He then gives sayings on proper sources of
    government authority, decline of ducal power, beneficial and harmful friendships
    and enjoyments, and errors in speech before a superior.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The head of the Chi family plans to attack Chwan-yu, and Zan Yu and Chi-lu
    report this to Confucius.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Confucius says a former king appointed Chwan-yu's ruler to preside over sacrifices
    to the eastern Mang, that Chwan-yu lies within the state's territory, and that
    its ruler is directly connected with the sovereign.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Zan Yu says the chief wants the attack while the two ministers do not; Confucius
    replies that an official should take office only when able and retire when unable.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Confucius uses images of a tiger or rhinoceros escaping from a cage and a
    tortoise or jade being injured in a repository to ask who bears responsibility.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Zan Yu argues that Chwan-yu is strong and near Pi, and that failure to take
    it will bring sorrow to the Chi chief's descendants.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Confucius says the superior man dislikes concealing desire behind explanations,
    and says rulers should be concerned with people keeping their places, harmony,
    and contented repose.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Confucius says remoter unsubmissive people should be attracted by civil culture
    and virtue, then made contented and tranquil.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Confucius says Yu and Ch'iu assist a chief who cannot attract remoter people
    or preserve internal order, and warns that the Chi-sun family's sorrow will be
    found within its own court.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Confucius states that under good government ceremonies, music, and punitive
    military expeditions proceed from the son of Heaven; under bad government they
    proceed from princes, great officers, or subsidiary ministers, leading to loss
    of power over generations.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Confucius says the state's revenue has left the ducal House for five generations,
    government has been in the hands of Great officers for four generations, and the
    descendants of the three Hwan are reduced.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Confucius lists friendships with the upright, sincere, and observant as advantageous,
    and friendships with the specious, insinuatingly soft, and glib-tongued as injurious.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Confucius lists enjoyment in ceremonies and music, speaking of others' goodness,
    and worthy friends as advantageous, while extravagant pleasures, idleness, and
    feasting are injurious.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: 'Confucius lists three errors before a man of virtue and station: speaking
    too early, failing to speak at the proper time, and speaking without observing
    the superior''s countenance.'
  category: speech
  evidence_refs:
  - ev:9
