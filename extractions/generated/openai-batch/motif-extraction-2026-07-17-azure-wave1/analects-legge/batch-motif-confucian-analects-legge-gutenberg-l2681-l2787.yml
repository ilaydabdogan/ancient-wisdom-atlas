canonical_text:
  quote: ''
  summary: The passage presents episodes and sayings from Book XVII in which Confucius
    is pressed toward public office, comments on human nature, learning, music, virtue,
    rebellion, poetry, ritual forms, and false virtue. Several teachings use images
    such as a jewel in the bosom, an ox knife and fowl, hard and white material, a
    bitter gourd, a wall, ritual objects, and thieves.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yang Ho wants to see Confucius, sends him a pig as a present, and Confucius
    goes to acknowledge the gift when Yang Ho is absent, but they meet on the road.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yang Ho questions whether someone can be benevolent while keeping a jewel
    in his bosom and leaving his country confused, and whether someone can be wise
    while repeatedly missing public employment; Confucius answers that he will go
    into office.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Master says people are nearly alike by nature but become widely separated
    by practice, and that only the highest wise and the lowest stupid cannot be changed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: At Wu-ch'ang the Master hears stringed instruments and singing, comments with
    the image of using an ox knife to kill a fowl, and accepts Tsze-yu's reminder
    about instruction among people of high and low station.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kung-shan Fu-zao, while holding Pi in rebellion, invites the Master; Tsze-lu
    objects, and the Master says that if employed he might make an eastern Chau.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Tsze-chang asks about perfect virtue, and Confucius names five practices:
    gravity, generosity of soul, sincerity, earnestness, and kindness, with effects
    attached to each.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Pi Hsi, while in rebellion and holding Chung-mau, invites the Master; Tsze-lu
    objects, and the Master replies with images of hard material not becoming thin,
    white material not becoming black in dark fluid, and a bitter gourd not meant
    to hang unused.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Master tells Yu about six words with six becloudings, each describing
    a desired quality pursued without learning and the resulting defect.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The Master urges his children or disciples to study the Book of Poetry and
    the Odes, saying they stimulate the mind, aid self-contemplation, teach sociability,
    regulate resentment, teach duties, and provide knowledge of birds, beasts, and
    plants; he also tells Po-yu that one who has not studied the Chau-nan and Shao-nan
    is like someone facing a wall.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Master says propriety is not exhausted by gems and silk, and music is
    not exhausted by bells and drums.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Master compares outward stern firmness with inner weakness to a thief
    who breaks through or climbs over a wall, calls careful village people thieves
    of virtue, and says that passing on hearsay from the road casts away virtue.
  category: speech
  evidence_refs:
  - ev:10
