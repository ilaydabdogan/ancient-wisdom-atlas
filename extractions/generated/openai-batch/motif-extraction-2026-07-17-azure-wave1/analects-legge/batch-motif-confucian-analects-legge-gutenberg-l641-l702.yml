  - ev:13
  confidence: high
  cautions: The material is ethical-philosophical instruction rather than a mythic
    narrative with supernatural agents.
- id: motif:2
  label: Steady respect and sincere social conduct
  taxonomy_refs:
  - wisdom
  basis: Yen P'ing's continuing respect, Tsze-lu's wish to share possessions, and
    the Master's wish for sincerity, rest, and tenderness all emphasize proper conduct
    in relationships.
  evidence_refs:
  - ev:1
  - ev:11
  confidence: high
  cautions: The pattern is social-ethical, not a narrative exchange with sacred agents.
- id: motif:3
  label: Ethical departure from corrupt or violent authority
  taxonomy_refs:
  - departure
  basis: Ch'an Wan abandons wealth and leaves his country after a killing, then leaves
    other states when he sees officials he compares to Ch'ui.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: This is a political and moral withdrawal, not a mythic hero departure
    or journey cycle.
- id: motif:4
  label: Measured restraint and self-cultivation
  taxonomy_refs:
  - wisdom
  basis: The Master moderates Chi Wan's triple deliberation, wants students to restrict
    and shape themselves, praises non-boasting, and laments the absence of inward
    self-accusation.
  evidence_refs:
  - ev:5
  - ev:7
  - ev:11
  - ev:12
  confidence: high
  cautions: The motif is expressed in sayings and classroom-like instruction rather
    than symbolic myth.
- id: motif:5
  label: Return to instruct and shape pupils
  taxonomy_refs:
  - return
  - wisdom
  basis: While in Ch'an, the Master says 'Let me return' because the students of his
    school are ambitious, hasty, and in need of restriction and shaping.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The return is literal and pedagogical; it should not be read as a full
    mythic return motif without further context.
