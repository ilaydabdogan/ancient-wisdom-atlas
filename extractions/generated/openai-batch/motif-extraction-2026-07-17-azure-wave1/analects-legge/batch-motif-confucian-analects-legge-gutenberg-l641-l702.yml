  summary: A sequence of sayings and anecdotes in which the Master evaluates friendship,
    ritual display, loyalty, purity, deliberation, conduct under political order or
    disorder, students' self-cultivation, resentment, uprightness, false appearances,
    generosity, self-examination, and love of learning.
  language: English
  quote_policy: summarized
literal_observations:
