  text: The Master questions what sort of wisdom Tsang Wan had in connection with
    the tortoise house.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Tsze-wan took office three times without showing joy and retired from office
    three times without showing displeasure.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Tsze-wan informed the new minister about the way he had conducted the government.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Master calls Tsze-wan loyal but says he does not know whether Tsze-wan
    can be called perfectly virtuous.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The officer Ch'ui killed the prince of Ch'i.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ch'an Wan abandoned forty horses and left his country, then left other states
    after judging their officers to resemble Ch'ui.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Master calls Ch'an Wan pure but says he does not know whether Ch'an Wan
    can be called perfectly virtuous.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Chi Wan thought three times and then acted; when told this, the Master says
    twice may be enough.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Master says Ning Wu acted as a wise man when good order prevailed and
