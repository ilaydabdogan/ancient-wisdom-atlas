candidate_motifs:
- id: motif:1
  label: Wisdom as ethical discernment through brief cases
  taxonomy_refs:
  - wisdom
  basis: The passage repeatedly presents short cases and the Master's judgments about
    wisdom, loyalty, purity, uprightness, virtue, self-accusation, and learning.
  evidence_refs:
