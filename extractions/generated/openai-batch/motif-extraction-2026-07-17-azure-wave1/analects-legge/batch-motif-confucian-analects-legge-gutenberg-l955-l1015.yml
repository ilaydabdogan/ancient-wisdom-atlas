literal_observations:
- id: obs:1
  text: The Master says he has not seen a sage or good man, and would be satisfied
    to see real talent and virtue or constancy; he also says pretense and emptiness
    make constancy difficult.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Master angled without using a net and shot without shooting at birds that
    were perching.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Master says he does not act without knowing why, and describes hearing
    much, selecting what is good, following it, seeing much, and keeping it in memory
    as a style of knowledge.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A lad from Hu-hsiang has an interview with the Master; the disciples doubt,
    and the Master says he receives a person who purifies himself to wait upon him
    without guaranteeing the person's past or later conduct.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: 'The Master says virtue is not remote: when he wishes to be virtuous, virtue
    is at hand.'
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The minister of crime of Ch'an questions whether duke Chao knew propriety,
    challenges the Master's answer through Wu-ma Ch'i, and the Master responds that
    he is fortunate because people know his errors.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the Master was with someone singing well, he made the person repeat the
    song and accompanied it with his own voice.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Master says he may equal others in letters, but has not yet attained the
    conduct of the superior man who carries out what he professes.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Master says he does not rank himself with the sage or perfectly virtuous
    man, but strives without satiety and teaches without weariness; Kung-hsi Hwa says
    the disciples cannot imitate him in this.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: When the Master is very sick, Tsze-lu asks permission to pray for him, cites
    a saying from the Eulogies about prayer to spirits of the upper and lower worlds,
    and the Master replies that his praying has been for a long time.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The Master says extravagance leads to insubordination, parsimony to meanness,
