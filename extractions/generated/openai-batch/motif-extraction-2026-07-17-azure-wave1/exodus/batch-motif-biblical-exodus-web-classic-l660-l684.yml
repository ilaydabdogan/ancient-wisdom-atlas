canonical_text:
  quote: ''
  summary: A footnote explains the term “Yam Suf” as the Red Sea or Sea of Reeds/Cattails.
    In Chapter 11, Yahweh tells Moses that one more plague will come on Pharaoh and
    Egypt, after which Pharaoh will force the people out. Israelites are instructed
    to ask Egyptian neighbors for silver and gold jewels, and Yahweh gives them favor.
    Moses announces that at midnight Yahweh will go through Egypt and all Egyptian
    firstborn, including livestock, will die, while Israel will be spared so that
    Yahweh’s distinction between Egypt and Israel is known. Pharaoh’s servants will
    bow and urge the people to leave. Yahweh says Pharaoh will not listen so that
    wonders may multiply; Moses and Aaron have performed wonders, but Pharaoh does
    not release Israel because Yahweh hardens his heart.
  language: English
  quote_policy: summarized
