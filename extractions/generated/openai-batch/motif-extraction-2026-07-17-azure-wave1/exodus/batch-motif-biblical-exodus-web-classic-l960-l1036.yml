  quote: ''
  summary: A footnote glosses Marah as “bitter.” Exodus 16 narrates Israel’s journey
    from Elim into the wilderness of Sin, the congregation’s hunger complaint against
    Moses and Aaron, Yahweh’s promise and provision of quail and bread from the sky,
    instructions for daily and sixth-day gathering, Sabbath rest, the naming and description
    of manna, and the preservation of an omer of manna as a memorial for future generations.
  language: English
  quote_policy: summarized
