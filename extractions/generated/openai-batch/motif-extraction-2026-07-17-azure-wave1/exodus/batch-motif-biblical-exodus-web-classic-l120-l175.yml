candidate_motifs:
- id: motif:1
  label: endangered child preserved in a small vessel on water
  taxonomy_refs:
  - ark_vessel
  basis: The child is hidden, placed in a tar- and pitch-coated papyrus basket, laid
    by the river, discovered, and drawn out of the water.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage does not use the word ark for the basket in this translation;
    the motif label is based on the vessel-on-water episode.
- id: motif:2
  label: exposed or concealed child rescued and adopted by royalty
  taxonomy_refs:
  - miraculous_child
  - royal_legitimacy
  basis: The Levite child is concealed, set in the river basket, rescued by Pharaoh’s
    daughter, and becomes her son.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  - ev:6
  confidence: medium
  cautions: No miraculous conception or explicit royal legitimacy claim is stated
    in this passage; the royal element is adoption by Pharaoh’s daughter.
- id: motif:3
  label: flight from royal danger into foreign land
  taxonomy_refs:
  - departure
  basis: Pharaoh seeks to kill Moses, and Moses flees to Midian, where he later identifies
    himself as a foreigner in a foreign land.
  evidence_refs:
  - ev:9
  - ev:13
  confidence: high
  cautions: The passage presents flight and foreign residence, not a completed return.
- id: motif:4
  label: heroic aid at a well before settlement and marriage
  taxonomy_refs: []
  basis: Moses sits by a well in Midian, helps the priest’s daughters against shepherds,
