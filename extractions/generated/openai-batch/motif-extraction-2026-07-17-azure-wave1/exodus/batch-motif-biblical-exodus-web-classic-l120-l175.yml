  summary: The passage includes footnotes to Exodus 1, then narrates the birth, concealment,
    river exposure, discovery, nursing, adoption, and naming of Moses; his later killing
    of an Egyptian, flight to Midian, rescue of Reuel’s daughters at a well, marriage
    to Zipporah, birth of Gershom, and God’s hearing of Israel’s groaning and remembering
    the covenant with the patriarchs.
