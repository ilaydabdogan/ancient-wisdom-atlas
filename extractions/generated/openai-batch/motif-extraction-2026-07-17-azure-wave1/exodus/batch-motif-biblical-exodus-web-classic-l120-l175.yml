literal_observations:
- id: obs:1
  text: A man and woman from the house of Levi have a son, and the woman hides him
    for three months after seeing that he is a fine child.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the child can no longer be hidden, his mother places him in a pitch-coated
    papyrus basket and sets it among reeds by the riverbank.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The child’s sister watches from a distance to see what will happen to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Pharaoh’s daughter comes to the river, sees the basket among the reeds, has
    it retrieved, opens it, sees the crying child, and has compassion on him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The sister offers to call a Hebrew nurse, and Pharaoh’s daughter agrees; the
    child’s mother is called and is paid to nurse him.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: When the child grows, he is brought to Pharaoh’s daughter, becomes her son,
    and is named Moses because she drew him out of the water.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: As an adult, Moses sees an Egyptian striking a Hebrew, kills the Egyptian
    when no one is seen nearby, and hides the body in the sand.
