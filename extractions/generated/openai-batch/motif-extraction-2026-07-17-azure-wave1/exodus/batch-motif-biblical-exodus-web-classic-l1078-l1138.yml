canonical_text:
  quote: ''
  summary: Footnotes explain names from Exodus 17. In Exodus 18, Jethro comes to Moses
    in the wilderness at the Mountain of God with Zipporah and Moses’ two sons. Moses
    recounts Yahweh’s deliverance of Israel from Egypt. Jethro blesses Yahweh, offers
    sacrifice, and eats before God with Aaron and Israel’s elders. Jethro then advises
    Moses to delegate judging to qualified rulers over groups of different sizes;
    Moses follows the counsel and later sends Jethro home.
