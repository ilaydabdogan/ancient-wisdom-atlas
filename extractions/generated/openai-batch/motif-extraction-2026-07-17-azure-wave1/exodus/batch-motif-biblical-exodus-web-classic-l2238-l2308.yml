  quote: ''
  summary: Exodus 35 opens with Moses assembling Israel and relaying Yahweh’s commands
    about Sabbath rest, the prohibition of kindling fire on the Sabbath, the collection
    of willing offerings, and the making of the tabernacle, ritual furnishings, and
    priestly garments. The people bring freewill offerings of precious materials and
    craft goods. Wise-hearted women spin materials, rulers bring stones, spices, and
    oil, and Moses announces that Yahweh has called and equipped Bezalel and Oholiab
    with wisdom and skill for the work.
