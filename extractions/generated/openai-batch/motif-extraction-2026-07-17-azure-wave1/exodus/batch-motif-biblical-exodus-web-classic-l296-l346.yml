canonical_text:
  quote: ''
  summary: A footnote identifies “Lord” as translating “Adonai.” In Exodus 5, Moses
    and Aaron ask Pharaoh in Yahweh’s name to let Israel go into the wilderness for
    a feast and sacrifice. Pharaoh refuses, increases the Israelites’ labor by withholding
    straw while keeping the brick quota, and the Israelite officers are beaten. The
    officers blame Moses and Aaron, and Moses complains to Yahweh that his mission
    has brought trouble without rescue.
