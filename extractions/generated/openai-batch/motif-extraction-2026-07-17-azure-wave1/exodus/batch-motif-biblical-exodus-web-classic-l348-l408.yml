canonical_text:
  quote: ''
  summary: Yahweh tells Moses that Pharaoh will release Israel under divine pressure.
    Yahweh identifies himself, recalls the covenant with the patriarchs, promises
    to free Israel from Egyptian bondage, take them as his people, and bring them
    into the promised land. Moses reports this to Israel, but they do not listen because
    of anguish and cruel bondage. Yahweh commands Moses and Aaron to speak to Pharaoh.
    Moses protests that both Israel and Pharaoh will not listen to him because of
    his “uncircumcised lips.” A genealogy of Reuben, Simeon, and Levi culminates in
    Aaron and Moses, identifying them as the ones commissioned to bring Israel out
    of Egypt.
  language: English
  quote_policy: summarized
