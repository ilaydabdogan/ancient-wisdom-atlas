canonical_text:
  quote: ''
  summary: Yahweh commands Moses to sanctify Israel's firstborn. Moses instructs the
    people to remember the departure from Egypt with unleavened bread, annual observance,
    signs, and teaching to sons. The passage gives rules for sacrificing or redeeming
    firstborn males, explains them through Yahweh's killing of Egypt's firstborn,
    and narrates Israel's departure route, Joseph's bones being carried, and Yahweh's
    guidance by cloud and fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yahweh speaks to Moses and commands that all firstborn among Israel, human
    and animal, be sanctified to him because they are his.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moses tells the people to remember the day they came out of Egypt, described
    as the house of bondage, and says Yahweh brought them out by strength of hand.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moses says no leavened bread is to be eaten and identifies the departure as
    occurring in the month Abib.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people are told that when Yahweh brings them into the sworn land, described
    as flowing with milk and honey, they shall keep the service in that month.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: For seven days the people are to eat unleavened bread, with a feast to Yahweh
    on the seventh day and no leaven or yeast visible within their borders.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The observance is to be explained to a son as connected with what Yahweh did
    when the speaker came out of Egypt, and it is to function as a sign on the hand
    and a memorial between the eyes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The people are instructed to keep the ordinance in its season from year to
    year.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Yahweh gives the sworn land, the people are to set apart to Yahweh all
    that opens the womb, including male firstborn animals.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A firstborn donkey is to be redeemed with a lamb or have its neck broken,
    and all firstborn sons are to be redeemed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: A future son's question is to be answered by recounting Yahweh's removal of
    the people from Egypt and Pharaoh's stubborn refusal to let them go.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The explanation says Yahweh killed all firstborn in Egypt, human and livestock,
    and therefore firstborn males are sacrificed to Yahweh while firstborn sons are
    redeemed.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: After Pharaoh lets the people go, God avoids the nearer Philistine route so
    the people will not see war and return to Egypt.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: God leads the people by the wilderness route by the Red Sea, and the children
    of Israel leave Egypt armed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Moses takes Joseph's bones because Joseph had made the children of Israel
    swear to carry them away when God visited them.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: The people journey from Succoth and camp at Etham on the edge of the wilderness.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:16
  text: Yahweh goes before the people by day in a pillar of cloud and by night in
    a pillar of fire, leading them and giving light, and the pillars do not depart
    from before the people.
  category: action
  evidence_refs:
  - ev:11
