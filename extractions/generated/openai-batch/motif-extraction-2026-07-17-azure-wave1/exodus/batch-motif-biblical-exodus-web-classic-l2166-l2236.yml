canonical_text:
  quote: ''
  summary: Yahweh commands Moses to chisel replacement tablets and ascend Mount Sinai
    alone. Yahweh descends in a cloud, proclaims divine attributes, and renews covenant
    commands. Moses worships, intercedes for the people, receives commandments concerning
    exclusive worship, festivals, firstborn offerings, rest, sacrifice, and firstfruits,
    remains forty days and nights without food or water, writes the covenant words,
    and descends with the tablets. Moses’ face shines after speaking with Yahweh;
    the people are afraid, and Moses uses a veil except when speaking before Yahweh
    and relaying commands.
  language: English
  quote_policy: summarized
