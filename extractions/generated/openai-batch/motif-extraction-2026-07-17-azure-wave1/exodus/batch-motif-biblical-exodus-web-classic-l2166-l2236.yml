candidate_motifs:
- id: motif:1
  label: renewed covenant on a mountain
  taxonomy_refs:
  - covenant
  - ascent
  - cosmic_mountain
  basis: Moses ascends Mount Sinai alone with replacement tablets; Yahweh descends,
    proclaims the divine name, and says he makes a covenant with Moses and Israel.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:5
  - ev:11
  confidence: high
  cautions: The passage identifies Mount Sinai as the meeting place but does not explicitly
    describe it as a cosmic mountain; that taxonomy link is based only on the mountain-as-divine-meeting
    setting.
- id: motif:2
  label: law or covenant received through a mediator
  taxonomy_refs:
  - covenant
  - wisdom
  basis: Moses receives and writes the covenant words and later gives the commandments
    spoken with him on Mount Sinai to the children of Israel.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:15
  confidence: high
  cautions: The passage frames the material as covenant commandments rather than abstract
    wisdom teaching.
- id: motif:3
  label: exclusive divine allegiance and rejection of rival cults
  taxonomy_refs:
  - covenant
  - divine_judgment
  basis: The covenant commands forbid covenants with inhabitants of the land, require
    destruction of altars, pillars, and Asherah poles, forbid cast idols, and identify
    Yahweh as a jealous God.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage gives commands and warnings; it does not narrate an actual
    episode of rival worship within this excerpt.
- id: motif:4
  label: ritual calendar and first-offering obligations
  taxonomy_refs:
  - covenant
  - sacred_exchange
  - sacrifice
  - seasonal_cycle
  basis: The passage commands feasts, firstborn redemption, seventh-day rest, pilgrimage
    appearances, Passover sacrifice rules, firstfruits, and related ritual obligations.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage states ritual obligations but does not narrate the performance
    of the rituals.
- id: motif:5
  label: forty-day fast in divine presence
  taxonomy_refs:
  - initiation
  - ascent
  basis: Moses remains with Yahweh for forty days and nights on Sinai without bread
    or water while the covenant words are written.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The text states duration and fasting but does not explicitly call the
    experience an initiation.
- id: motif:6
  label: radiant mediator after divine encounter
  taxonomy_refs:
  - ascent
  - wisdom
  basis: After speaking with Yahweh on Mount Sinai, Moses descends with the tablets
    and the skin of his face shines, causing fear among Aaron and Israel.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:16
  confidence: medium
  cautions: Radiance is stated literally; any broader symbolic reading should be reviewed.
- id: motif:7
  label: veiled and unveiled sacred mediator
  taxonomy_refs:
  - covenant
  basis: Moses covers his shining face after speaking with Israel and removes the
    veil when going before Yahweh to speak.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: medium
  cautions: The passage describes the veil practice but does not explain its reason
    beyond the shining face context.
