canonical_text:
  quote: ''
  summary: Yahweh tells Moses and the people to depart toward the promised land with
    an angel sent before them, but says he will not go among the stiff-necked people
    lest he consume them. The people mourn and remove their jewelry. Moses regularly
    pitches the Tent of Meeting outside the camp, where Yahweh speaks with him as
    the cloud descends. Moses asks for Yahweh’s way, presence, and glory; Yahweh promises
    his presence and rest, then permits Moses to see only his back while shielding
    him in a cleft of the rock from seeing his face.
  language: English
  quote_policy: summarized
