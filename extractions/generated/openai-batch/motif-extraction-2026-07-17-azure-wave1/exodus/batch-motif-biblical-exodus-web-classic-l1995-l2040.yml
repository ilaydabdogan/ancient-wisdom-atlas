  quote: ''
  summary: 'The passage includes measurement footnotes for Exodus 30, then Exodus
    31: Yahweh tells Moses that Bezalel has been called and filled with divine Spirit,
    wisdom, understanding, knowledge, and craft skill, and that Oholiab and other
    wise-hearted workers have been appointed to make the Tent of Meeting and its sacred
    furnishings, garments, anointing oil, and incense. Yahweh then commands Israel
    to keep the Sabbath as a holy sign and perpetual covenant, grounded in Yahweh’s
    six-day creation and seventh-day rest. After speaking on Mount Sinai, Yahweh gives
    Moses two stone tablets of the covenant written with God’s finger.'
