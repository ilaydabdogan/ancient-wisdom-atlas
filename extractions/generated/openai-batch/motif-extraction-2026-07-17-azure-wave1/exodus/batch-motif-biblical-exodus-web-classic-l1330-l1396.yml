literal_observations:
- id: obs:1
  text: The passage assigns scaled restitution for stolen oxen or sheep, treats a
    thief killed while breaking in differently depending on whether the sun has risen,
    and requires double payment when stolen property is found alive in the thief's
    possession.
  category: sequence
  evidence_refs:
  - ev:1
