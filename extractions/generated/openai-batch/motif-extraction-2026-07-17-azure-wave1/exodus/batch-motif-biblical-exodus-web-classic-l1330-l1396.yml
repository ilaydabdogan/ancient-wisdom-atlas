  text: A person whose animal grazes in another person's field or whose fire consumes
    grain or a field must make restitution from his own resources.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: When entrusted money or goods are stolen, a found thief pays double; when
    no thief is found, the house master and disputed parties come before God, and
    the one God condemns pays double.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: For entrusted or borrowed animals, liability depends on whether the animal
    was stolen, torn, injured, died, or whether the owner was present; an oath of
    Yahweh can settle an unseen loss.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a man entices an unpledged virgin and lies with her, he must pay a dowry
    for marriage; if her father refuses the marriage, he still pays the dowry amount.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage commands that a sorceress not be allowed to live, that sex with
    an animal be punished by death, and that sacrificing to any god except Yahweh
    alone leads to utter destruction.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Aliens, widows, and fatherless children are not to be wronged or oppressed;
