canonical_text:
  quote: God spoke all these words, saying,
  summary: God speaks commandments to Israel, identifying Yahweh as the one who brought
    them out of Egypt. The passage prohibits other gods, idols, misuse of the divine
    name, murder, adultery, theft, false testimony, and coveting; commands Sabbath
    observance and honoring parents; describes the people's fear before thunder, lightning,
    trumpet sound, and a smoking mountain; shows Moses mediating near the darkness
    where God was; and gives instructions about altars, sacrifice, and avoiding silver
    or gold gods.
  language: English
  quote_policy: quoted
