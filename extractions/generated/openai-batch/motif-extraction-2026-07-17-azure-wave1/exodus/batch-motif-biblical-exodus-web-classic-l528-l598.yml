canonical_text:
  quote: ''
  summary: In Exodus 9, Yahweh repeatedly commands Moses to demand that Pharaoh release
    Yahweh’s people. After Pharaoh refuses, pestilence kills Egyptian livestock while
    Israelite livestock are spared; ashes sprinkled toward the sky become boils on
    Egyptians and animals; and a severe hailstorm with thunder and lightning strikes
    Egypt while Goshen is spared. Pharaoh briefly confesses wrongdoing and asks Moses
    to pray, but after the storm ceases he and his servants harden their hearts and
    do not release the Israelites.
  language: English
