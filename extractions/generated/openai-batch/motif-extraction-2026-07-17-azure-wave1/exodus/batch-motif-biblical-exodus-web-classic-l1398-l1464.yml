canonical_text:
  quote: ''
  summary: Exodus 23 gives commands about truthful testimony, justice, aid even to
    enemies, treatment of aliens, seventh-year and seventh-day rest, exclusive worship
    of Yahweh, annual feasts, sacrificial and first-fruits rules, the sending of an
    angel before the people, promised blessing, divine action against adversaries,
    land boundaries, and prohibitions on covenanting with the inhabitants or their
    gods.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage prohibits false reports, malicious witness, following a crowd
    to do evil, perverting justice, biased judgment, false charges, killing the innocent
    and righteous, and taking bribes.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is commanded to return an enemy’s stray ox or donkey and to
    help the donkey of one who hates him when it has fallen under its burden.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage forbids oppression of an alien and gives the reason that the addressees
    know the heart of an alien because they were aliens in Egypt.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The land is to be sown and harvested for six years, then left resting and
    fallow in the seventh year so that poor people and animals of the field may eat.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Work is to be done for six days, and rest is required on the seventh day for
    the addressee, ox, donkey, servant’s son, and alien.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage commands care in doing what has been spoken and forbids invoking
    or even mentioning the names of other gods.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: 'Three annual feasts to Yahweh are prescribed: unleavened bread, harvest with
    first fruits, and ingathering at the end of the year.'
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: All males are to appear before the Lord Yahweh three times in the year.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: 'The passage regulates sacrifice and offerings: blood is not to be offered
    with leavened bread, fat is not to remain overnight, first fruits are to be brought
    into Yahweh’s house, and a young goat is not to be boiled in its mother’s milk.'
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: Yahweh says he sends an angel before the people to keep them on the way and
    bring them to a prepared place.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The people are instructed to pay attention to the angel and listen to his
    voice; the angel will not pardon disobedience because Yahweh’s name is in him.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: If the people listen and do what Yahweh speaks, Yahweh promises to be an enemy
    to their enemies and an adversary to their adversaries.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The angel is said to go before the people and bring them to named peoples,
    while Yahweh says he will cut those peoples off.
  category: action
  evidence_refs:
  - ev:4
- id: obs:14
  text: The people are commanded not to bow to the gods of the land, serve them, or
    follow their practices, but to overthrow them and demolish their pillars.
  category: action
  evidence_refs:
  - ev:5
- id: obs:15
  text: Serving Yahweh is linked with promised blessing on bread and water, removal
    of sickness, absence of miscarriage and barrenness, and fulfilled days.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:16
  text: Yahweh promises to send terror, confusion, and a hornet before the people
    so that enemies turn away and named groups are driven out.
  category: action
  evidence_refs:
  - ev:6
- id: obs:17
  text: Yahweh says he will drive out the inhabitants little by little rather than
    in one year, to prevent the land from becoming desolate and field animals multiplying
    against the people.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:18
  text: Yahweh states borders from the Red Sea to the sea of the Philistines and from
    the wilderness to the River, and says the inhabitants will be delivered into the
    people’s hand and driven out.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:19
  text: The people are forbidden to make a covenant with the inhabitants or their
