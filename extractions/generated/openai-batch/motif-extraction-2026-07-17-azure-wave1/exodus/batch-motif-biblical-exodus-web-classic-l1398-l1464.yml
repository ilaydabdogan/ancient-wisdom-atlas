candidate_motifs:
- id: motif:1
  label: Exclusive covenant boundary against other gods
  taxonomy_refs:
  - covenant
  basis: The passage forbids invoking other gods, bowing to or serving the gods of
    the land, and making a covenant with the inhabitants or their gods.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage explicitly uses covenant language only for prohibited covenants
    with inhabitants and their gods; it does not in this excerpt narrate the making
    of a covenant with Yahweh.
- id: motif:2
  label: Sacrificial and first-fruits offering to the deity
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The passage commands annual feasts to Yahweh, forbids appearing empty, regulates
    sacrificial blood and fat, and requires first fruits to be brought into Yahweh’s
    house.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The broad sacred-exchange category is inferred from commanded offerings
    and divine service; the passage presents legal instructions rather than a mythic
    exchange narrative.
- id: motif:3
  label: Ritualized rest and harvest cycle
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage sets six/seventh rhythms for land and weekly labor and names
    feasts of unleavened bread, harvest, and ingathering.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage gives calendrical and legal requirements; it does not personify
    seasons or narrate a seasonal myth.
- id: motif:4
  label: Divine messenger guiding a people to a prepared place
  taxonomy_refs:
  - departure
  basis: Yahweh sends an angel before the people to keep them on the way and bring
    them to the place prepared for them; the feast of unleavened bread is tied to
    coming out of Egypt.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: medium
  cautions: The passage alludes to prior departure from Egypt and future movement
    but does not itself narrate the departure event.
- id: motif:5
  label: Divine defeat and displacement of adversaries
  taxonomy_refs:
  - divine_judgment
  basis: Yahweh promises to cut off named peoples, send terror and confusion, send
    the hornet, deliver inhabitants into the people’s hand, and cause them to be driven
    out.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: medium
  cautions: The passage frames the action as promised displacement of adversaries;
    it gives limited moral explanation for the inhabitants beyond their gods and practices.
- id: motif:6
  label: Service to the deity linked with health, fertility, and sustenance
  taxonomy_refs:
  - sacred_exchange
  basis: The people are told to serve Yahweh, and he will bless bread and water, remove
    sickness, prevent miscarriage and barrenness, and fulfill their days.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The motif is expressed as a conditional blessing formula, not as a full
    narrative episode.
- id: motif:7
  label: Prohibition on boiling offspring in mother’s milk
  taxonomy_refs: []
  basis: The passage explicitly states that a young goat is not to be boiled in its
    mother’s milk.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No supplied motif-family taxonomy directly corresponds to this prohibition;
    only the symbol reference to milk is available.
- id: motif:8
  label: Justice toward vulnerable persons and enemies
  taxonomy_refs:
  - covenant
  basis: The passage commands truthful testimony, impartial justice, protection of
    the poor and alien, and aid to an enemy’s or hater’s animals.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The connection to the covenant motif family is taxonomy-level; the passage
    presents laws rather than an explicit comparative myth pattern.
