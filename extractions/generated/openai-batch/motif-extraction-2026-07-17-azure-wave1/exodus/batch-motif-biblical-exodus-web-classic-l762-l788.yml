  summary: A mixed multitude and the children of Israel depart from Egypt with livestock,
    bake unleavened cakes because they were hurried out, and are said to have left
    after four hundred thirty years. The night is to be observed to Yahweh through
    generations. Yahweh gives Moses and Aaron Passover regulations concerning who
    may eat, circumcision, eating in one house, not carrying meat outside, and not
    breaking bones. Israel obeys, and Yahweh brings them out by their armies.
