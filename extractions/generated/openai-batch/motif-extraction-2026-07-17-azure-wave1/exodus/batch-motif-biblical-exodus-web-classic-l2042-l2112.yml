candidate_motifs:
- id: motif:1
  label: Covenant breach marked by broken divine tablets
  taxonomy_refs:
  - covenant
  basis: The people turn from Yahweh’s command to worship the calf while Moses carries
    the divine-written covenant tablets; Moses breaks those tablets when he sees the
    calf and dancing.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The passage records breach and broken tablets but does not narrate covenant
    renewal within this line range.
- id: motif:2
  label: Divine judgment threatened, mitigated by intercession, and later enacted
  taxonomy_refs:
  - divine_judgment
  basis: Yahweh threatens to consume the people; Moses intercedes and Yahweh relents
    from the immediate destruction, yet judgment follows through the Levites and Yahweh’s
    later striking of the people.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:9
  - ev:11
  confidence: high
  cautions: The passage combines averted total destruction with partial or later punishment.
- id: motif:3
  label: Mediating ascent and descent between deity and people
  taxonomy_refs:
  - ascent
  basis: Moses is delayed coming down from the mountain, descends with the tablets,
    and later says he will go up to Yahweh to seek atonement.
  evidence_refs:
  - ev:1
  - ev:5
  - ev:10
  confidence: medium
  cautions: The passage emphasizes descent and return to Yahweh more than a detailed
    ascent narrative.
- id: motif:4
  label: Substitute cult image made during the leader’s absence
  taxonomy_refs: []
  basis: Because Moses is absent and his fate is unknown, the people ask for gods
    to go before them; Aaron makes a molded calf, and the people worship and sacrifice
    to it.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: No external comparison is inferred; this is a passage-level motif label.
- id: motif:5
  label: Ritual destruction and ingestion of the illicit image
  taxonomy_refs: []
  basis: Moses burns the calf, grinds it to powder, scatters it on water, and makes
    the children of Israel drink it.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not explicitly explain the ritual meaning of the drinking.
- id: motif:6
  label: Atonement plea with self-blotting offer
  taxonomy_refs:
  - sacrifice
  basis: Moses says he may make atonement for the people’s sin and asks Yahweh to
    forgive them, or otherwise blot him out of Yahweh’s written book.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The self-offer is expressed as being blotted from a book, not as an explicit
    sacrificial death.
- id: motif:7
  label: Loyal faction consecrated through violent judgment
  taxonomy_refs:
  - divine_judgment
  basis: The sons of Levi gather to Moses as those on Yahweh’s side, kill within the
    camp according to Moses’ command, and are told to consecrate themselves to Yahweh
    for a blessing.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage presents consecration language but does not provide a broader
    institutional explanation in this excerpt.
