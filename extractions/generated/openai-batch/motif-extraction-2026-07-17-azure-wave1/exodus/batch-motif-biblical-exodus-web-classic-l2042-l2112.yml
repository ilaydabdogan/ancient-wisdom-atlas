canonical_text:
  quote: ''
  summary: In Exodus 32, while Moses is delayed on the mountain, the people ask Aaron
    to make gods to go before them. Aaron gathers gold rings, makes a molded calf,
    builds an altar, and the people offer sacrifices and celebrate. Yahweh tells Moses
    the people have corrupted themselves and threatens destruction, but Moses intercedes
    by invoking Yahweh’s deliverance and promises to the ancestors. Moses descends
    with the covenant tablets, sees the calf and dancing, breaks the tablets, destroys
    the calf, and makes Israel drink the water mixed with its powder. The Levites
    rally to Moses and kill many in the camp. Moses then seeks atonement, offering
    to be blotted out from Yahweh’s book if forgiveness is not granted. Yahweh says
    the sinner will be blotted out, promises angelic guidance, and strikes the people
    because of the calf.
  language: English
  quote_policy: summarized
