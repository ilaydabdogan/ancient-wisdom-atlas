  text: Yahweh speaks to Moses and Aaron in Egypt and declares the month to be the
    beginning of months and first month of the year for Israel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Israelite households are instructed to take a lamb on the tenth day, one per
    household or shared by neighboring households according to what people can eat.
  category: action
  evidence_refs:
  - ev:2
