canonical_text:
  quote: ''
  summary: Yahweh instructs Moses and Aaron concerning the first month, the household
    Passover lamb, blood on doorposts and lintels, the ritual meal, and the feast
    of unleavened bread. Moses relays the commands to Israel’s elders. Yahweh strikes
    Egypt’s firstborn at midnight while sparing marked Israelite houses. Pharaoh and
    the Egyptians urge Israel to leave; the Israelites depart with unleavened dough
    and goods from Egypt.
  language: English
  quote_policy: summarized
