- id: motif:6
  label: Divinely enabled transfer of wealth at departure
  taxonomy_refs: []
  basis: Israel asks Egyptians for silver, gold, and clothing; Yahweh gives the people
    favor, and the Egyptians grant the requests, described as plundering Egypt.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage describes requesting, receiving, and plundering, but does
