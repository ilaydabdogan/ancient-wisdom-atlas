  text: The lamb is to be without defect, male, one year old, taken from sheep or
    goats, kept until the fourteenth day, and killed by the whole assembly at evening.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some blood is to be placed on the two doorposts and lintel of the houses where
    the lamb is eaten.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The meat is to be eaten that night roasted with fire, with unleavened bread
    and bitter herbs; it is not to be eaten raw or boiled with water, and leftovers
    are to be burned with fire by morning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The meal is to be eaten with belt on waist, sandals on feet, staff in hand,
    and in haste; it is identified as Yahweh’s Passover.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Yahweh states that he will go through Egypt that night, strike all the firstborn
    of humans and animals, and execute judgments against all the gods of Egypt.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The blood is described as a token on the houses; when Yahweh sees it, he will
    pass over, and the destructive plague will not strike those houses.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The day is to be a memorial and feast to Yahweh kept throughout generations
    as an ordinance forever.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Israel is commanded to eat unleavened bread for seven days, remove yeast from
    houses, hold holy convocations on the first and seventh days, and avoid leavened
    food.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Moses calls the elders of Israel and tells them to take lambs by family, kill
    the Passover, apply blood to lintel and doorposts with hyssop, and remain inside
    until morning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Yahweh is said to pass through to strike Egyptians, see the blood on the lintel
