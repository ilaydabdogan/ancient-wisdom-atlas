candidate_motifs:
- id: motif:1
  label: Passover sacrifice with household meal
  taxonomy_refs:
  - sacrifice
  basis: A defectless lamb is selected, killed at evening, eaten in a prescribed meal,
    and later explained as the sacrifice of Yahweh’s Passover.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  confidence: high
  cautions: The passage itself explicitly calls the service a sacrifice; broader sacrificial
    typologies are not asserted here.
- id: motif:2
  label: Protective blood marking on the threshold
  taxonomy_refs:
  - sacrifice
  basis: Blood on the lintel and two doorposts serves as a token; Yahweh sees the
    blood, passes over the door, and prevents the destroyer from entering the marked
    houses.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The protective threshold-marking pattern is described literally, but no
    external comparison is made in the passage.
- id: motif:3
  label: Divine judgment through death of the firstborn
  taxonomy_refs:
  - divine_judgment
  basis: Yahweh announces and then performs a strike against all firstborn in Egypt,
    humans and livestock, and states that he will judge Egypt’s gods.
  evidence_refs:
  - ev:5
  - ev:9
  confidence: high
  cautions: The passage presents the event as Yahweh’s action; no comparative plague
    typology is asserted.
- id: motif:4
  label: Ritualized departure in haste
  taxonomy_refs:
  - departure
  basis: The Passover meal is eaten with travel gear in hand and in haste; Pharaoh
    and the Egyptians urgently send Israel out; Israel leaves with unleavened dough
    and travels from Rameses to Succoth.
  evidence_refs:
  - ev:4
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The route is only begun in this passage; later stages of the exodus are
    outside the supplied text.
- id: motif:5
  label: Perpetual memorial feast and intergenerational explanation
  taxonomy_refs: []
  basis: The day is commanded as a memorial feast throughout generations, and future
    children are expected to ask about the service and receive a ritual explanation.
  evidence_refs:
