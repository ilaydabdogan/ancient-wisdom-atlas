canonical_text:
  quote: ''
  summary: Exodus 1 recounts the sons of Israel entering Egypt, their multiplication
    after Joseph's generation dies, the rise of a new Egyptian king who fears their
    growth, their oppression through forced labor, and royal commands aimed at killing
    Hebrew male newborns. The midwives Shiphrah and Puah fear God, spare the boys,
    answer Pharaoh's questioning, and receive divine favor; Pharaoh then commands
    that every newborn son be cast into the river while daughters are kept alive.
  language: English
  quote_policy: summarized
