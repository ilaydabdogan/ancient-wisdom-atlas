canonical_text:
  quote: "“Let my people go, that they may serve me.”"
  summary: Yahweh sends Moses and Aaron to Pharaoh with demands for Israel’s release.
    Pharaoh refuses or negotiates limits. A locust plague devastates Egypt and is
    removed after Moses prays, but Pharaoh still does not release Israel. A three-day
    darkness follows, with light in Israelite dwellings. Pharaoh again refuses full
    release and threatens Moses.
  language: English
