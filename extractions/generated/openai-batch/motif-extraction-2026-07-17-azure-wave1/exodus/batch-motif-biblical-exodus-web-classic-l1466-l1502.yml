canonical_text:
  quote: ''
  summary: Exodus 24 describes Yahweh summoning Moses and selected leaders up the
    mountain, the people accepting Yahweh’s words, Moses writing and reading the covenant,
    sacrifices and blood-sprinkling ratifying the covenant, a representative ascent
    with a vision of God and a meal, and Moses entering the cloud on Mount Sinai for
    forty days and forty nights to receive written tablets.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yahweh tells Moses, Aaron, Nadab, Abihu, and seventy elders of Israel to come
    up and worship from a distance; Moses alone is to come near, and the people are
    not to go up.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Moses reports Yahweh’s words and ordinances to the people, and the people
    answer with one voice that they will do what Yahweh has spoken.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moses writes Yahweh’s words, builds an altar at the base of the mountain,
    and sets up twelve pillars for the twelve tribes of Israel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Young men of the children of Israel offer burnt offerings and sacrifice peace
    offerings of cattle to Yahweh.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Moses divides the blood, putting half in basins and sprinkling half on the
    altar.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Moses reads the book of the covenant to the people; the people promise obedience;
    Moses sprinkles blood on the people and identifies it as the blood of the covenant
    Yahweh has made with them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Moses, Aaron, Nadab, Abihu, and seventy elders go up, see the God of Israel,
    and see under his feet a sapphire-like pavement described as clear like the skies.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: God does not lay his hand on the nobles of Israel; they see God and eat and
    drink.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Yahweh tells Moses to come up to the mountain and stay there to receive stone
    tablets with written law and commands for teaching.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Moses rises with Joshua his servant and goes up onto God’s Mountain, while
    the elders are told to wait and to bring disputes to Aaron and Hur.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The cloud covers the mountain, Yahweh’s glory settles on Mount Sinai, the
    cloud covers it for six days, and on the seventh day Yahweh calls to Moses from
    the cloud.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Yahweh’s glory appears to the children of Israel like devouring fire on the
    mountain top, and Moses enters the cloud and remains on the mountain forty days
    and forty nights.
  category: setting
  evidence_refs:
  - ev:9
