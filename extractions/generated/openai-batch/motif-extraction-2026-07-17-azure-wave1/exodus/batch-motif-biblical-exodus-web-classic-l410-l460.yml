canonical_text:
  quote: ''
  summary: 'Yahweh commissions Moses and Aaron to speak to Pharaoh, predicts Pharaoh’s
    refusal, and announces signs, wonders, and judgments in Egypt. Aaron’s rod becomes
    a serpent before Pharaoh and swallows the rods of Egyptian magicians. Pharaoh
    remains hardened. Yahweh then commands a sign at the Nile: the river waters are
    struck and become blood, killing fish and making the water undrinkable throughout
    Egypt.'
  language: English
  quote_policy: summarized
