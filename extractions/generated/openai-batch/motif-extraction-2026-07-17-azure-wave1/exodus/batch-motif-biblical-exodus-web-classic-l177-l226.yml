candidate_motifs:
- id: motif:1
  label: Divine call at a sacred mountain
  taxonomy_refs:
  - world_center
  - cosmic_mountain
  basis: Moses comes to Horeb, called God’s mountain, where God calls him from the
    bush and the place is declared holy ground.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage calls Horeb God’s mountain and holy ground, but does not explicitly
    describe it as a cosmic mountain or world center.
- id: motif:2
  label: Fire that does not consume
  taxonomy_refs: []
  basis: The bush burns with fire but is not consumed, and this sight draws Moses
    toward the divine encounter.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: No specific available motif-family taxonomy directly names an unconsuming
    fire; symbol taxonomy supports fire only.
- id: motif:3
  label: Commissioned deliverer and departure from oppression
  taxonomy_refs:
  - departure
  - culture_hero
  basis: God sends Moses to Pharaoh so that he may bring the children of Israel out
    of Egypt, after declaring that he has seen their oppression.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: high
  cautions: The culture-hero label is applied only cautiously to Moses’ commissioned
    public role; the passage itself emphasizes divine sending rather than heroic self-initiation.
- id: motif:4
  label: Revelation of a divine name
  taxonomy_refs:
  - wisdom
  basis: Moses asks what name to report to Israel, and God answers with “I AM WHO
    I AM,” “I AM,” and the name Yahweh as a memorial.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  confidence: medium
  cautions: The taxonomy reference to wisdom is broad; the passage presents name revelation,
    not a general wisdom teaching.
- id: motif:5
  label: Divine judgment through wonders
  taxonomy_refs:
  - divine_judgment
  basis: God says he will reach out his hand and strike Egypt with wonders, after
    which the king will let Israel go.
  evidence_refs:
  - ev:19
  - ev:20
  confidence: high
  cautions: The specific wonders are announced but not narrated in this passage.
- id: motif:6
  label: Ritual journey into the wilderness for sacrifice
  taxonomy_refs:
  - sacrifice
  - departure
  basis: Moses and the elders are to ask the king of Egypt to allow a three days’
    journey into the wilderness so that Israel may sacrifice to Yahweh.
  evidence_refs:
  - ev:18
  confidence: high
  cautions: The passage gives the requested ritual journey but does not narrate the
    sacrifice itself.
- id: motif:7
  label: Departure with goods from the former oppressors
  taxonomy_refs:
  - sacred_exchange
  basis: God says the people will not go empty-handed; women are to ask Egyptians
    for silver, gold, and clothing, and the Egyptians will be plundered.
  evidence_refs:
  - ev:21
  - ev:22
  confidence: medium
  cautions: The taxonomy reference is approximate because the passage describes asking
    and plundering rather than an explicitly reciprocal sacred exchange.
