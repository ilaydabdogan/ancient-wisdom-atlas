canonical_text:
  quote: the bush burned with fire, and the bush was not consumed
  summary: Moses, while keeping Jethro’s flock near Horeb, sees a bush burning without
    being consumed. God calls to him from the bush, declares the ground holy, identifies
    himself as the God of Moses’ ancestors, says he has seen Israel’s affliction in
    Egypt, commissions Moses to go to Pharaoh, reveals the name “I AM,” and gives
    instructions for Israel’s departure, sacrifice in the wilderness, divine wonders
    against Egypt, and departure with Egyptian goods.
  language: English
  quote_policy: quoted
