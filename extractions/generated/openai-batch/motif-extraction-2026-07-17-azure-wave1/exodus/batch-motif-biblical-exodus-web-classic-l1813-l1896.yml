canonical_text:
  quote: "“This is the thing that you shall do to them to make them holy, to minister
    to me in the priest’s office”"
  summary: 'The passage gives instructions for consecrating Aaron and his sons for
    priestly service: preparing animals and bread, washing and clothing them, anointing
    Aaron, offering a bull and rams with blood rites and fire, assigning wave-offering
    portions, eating holy food at the Tent of Meeting, consecrating the altar for
    seven days, and beginning continual morning and evening lamb offerings. The line
    range also includes two brief footnotes from the preceding chapter.'
  language: English
  quote_policy: quoted
