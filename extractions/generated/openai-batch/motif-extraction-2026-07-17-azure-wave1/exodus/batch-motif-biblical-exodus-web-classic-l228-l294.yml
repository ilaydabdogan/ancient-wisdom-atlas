canonical_text:
  quote: ''
  summary: In Exodus 4, Moses doubts that the people will believe Yahweh appeared
    to him. Yahweh gives him signs involving a rod becoming a snake, a hand becoming
    leprous and restored, and river water becoming blood on dry land. Moses objects
    that he is slow of speech, and Yahweh appoints Aaron as his spokesman. Moses returns
    toward Egypt with his family and God's rod. Yahweh gives him a message for Pharaoh
    naming Israel as Yahweh's firstborn son and warning that Pharaoh's firstborn will
    be killed if Pharaoh refuses. On the way, Yahweh threatens Moses at a lodging
    place until Zipporah circumcises her son with a flint and speaks of a bridegroom
    of blood. Aaron meets Moses at God's mountain, and together they address the elders
    and people, who believe and worship.
  language: English
  quote_policy: summarized
