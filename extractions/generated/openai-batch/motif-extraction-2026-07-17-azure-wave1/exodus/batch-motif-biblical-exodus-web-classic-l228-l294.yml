candidate_motifs:
- id: motif:1
  label: Miraculous signs authenticate a divine appearance
  taxonomy_refs: []
  basis: The rod-snake, leprous-hand, and water-blood signs are explicitly given so
    that the people may believe Yahweh appeared to Moses; later Aaron performs signs
    before the people and they believe.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:9
  confidence: high
  cautions: The passage presents these as signs for belief rather than as a generalized
    comparative motif label.
- id: motif:2
  label: Rod transformed into serpent and back
  taxonomy_refs:
  - serpent
  - shapeshifter
  basis: A rod becomes a snake when thrown down and becomes a rod again when taken
    by the tail.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The transformation involves an object becoming an animal; applying a broader
    shapeshifter family should be reviewed.
- id: motif:3
  label: Reluctant messenger receives a spokesman
  taxonomy_refs: []
  basis: Moses resists the commission because he is slow of speech and asks that someone
    else be sent; Yahweh appoints Aaron as spokesman and says he will teach both mouths.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No specific taxonomy reference in the supplied list exactly names this
    commissioning pattern.
- id: motif:4
  label: Return mission to Egypt after danger has passed
  taxonomy_refs:
  - return
  - departure
  basis: Moses asks to return to his brothers in Egypt, Yahweh tells him to return
    because those seeking his life are dead, and Moses travels toward Egypt with his
    family and God's rod.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The return is a mission within the narrative; broader departure/return
    motif classification should remain cautious.
- id: motif:5
  label: Divine firstborn claim and reciprocal firstborn judgment
  taxonomy_refs:
  - divine_parent_child
  - divine_judgment
  basis: Yahweh's message calls Israel his son and firstborn, demands release, and
    threatens the killing of Pharaoh's firstborn son if Pharaoh refuses.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage states the kinship formula and threatened judgment directly,
    but the later fulfillment is outside this passage.
- id: motif:6
  label: Blood circumcision rite ends a divine threat
  taxonomy_refs: []
  basis: When Yahweh wants to kill Moses at a lodging place, Zipporah circumcises
    her son with a flint, uses the phrase 'bridegroom of blood,' and the text says
    he let him alone.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: Pronouns and ritual meaning in this brief episode are compressed; the
    functional description should be human-reviewed.
- id: motif:7
  label: Public recognition after signs and proclamation
  taxonomy_refs: []
  basis: Aaron speaks Yahweh's words and performs signs before the gathered elders
    and people; the people believe, bow, and worship.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a passage-level narrative pattern rather than a supplied taxonomy
    family.
