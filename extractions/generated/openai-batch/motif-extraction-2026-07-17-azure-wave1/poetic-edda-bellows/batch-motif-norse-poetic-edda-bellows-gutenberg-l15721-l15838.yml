canonical_text:
  quote: ''
  summary: 'Introductory note to the fragment of a Sigurth lay. The note explains
    the manuscript gap, identifies the surviving twenty stanzas as the end of a longer
    Sigurth poem, and summarizes the Volsungasaga narrative leading up to the Brot:
    Sigurth renews fidelity with Brynhild, forgets her after Grimhild’s draught, marries
    Guthrun, wins Brynhild for Gunnar by riding through flames in changed form, and
    becomes the focus of quarrel and vengeance planning.'
  language: English
  quote_policy: summarized
