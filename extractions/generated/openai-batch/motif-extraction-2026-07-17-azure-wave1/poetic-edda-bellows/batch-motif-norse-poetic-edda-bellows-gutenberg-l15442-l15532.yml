  quote: ''
  summary: A first-person speaker declares steadfastness and then gives a series of
    counsels to a second-person addressee. The advice covers avoiding guilt and vengeance
    toward kin, refusing uncertain oaths, avoiding quarrels with fools at the Thing,
    avoiding witches by the road, caution around women and drunken warriors, choosing
    battle over burning in a hall, shunning lying and illicit sexual conduct, rendering
    burial care to the dead, distrusting feud-enemies described as wolves, and avoiding
    wrath and treachery with friends.
