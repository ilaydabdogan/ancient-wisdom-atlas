canonical_text:
  quote: ''
  summary: Editorial notes to The Poem of Hyndla explain the narrative setup in which
    Ottar wagers his inheritance on the rank of his ancestry, obtains Freyja's help,
    is disguised by her as a boar, and is recognized by the giantess Hyndla. The notes
    also connect surrounding material to Othin, Hermoth's mission to Hel for Baldr,
    Sigmund drawing a sword from a tree, the road to Valhall, Hildisvini as a possibly
    golden-bristled boar, altar fires fusing stone to glass, and several mythic genealogies
    including Skjold and Halfdan the Old.
  language: English
  quote_policy: summarized
