canonical_text:
  quote: ''
  summary: Loki continues verbal attacks at a divine feast, is warned and threatened
    by several figures, is confronted by Thor, announces fire against the host's goods,
    then flees in salmon form. The gods capture and bind him; a poison-snake is set
    above him, Sigyn catches the venom in a shell, and Loki's convulsions are given
    as the cause of earthquakes.
  language: English
  quote_policy: summarized
