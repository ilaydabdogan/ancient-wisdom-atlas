canonical_text:
  quote: ''
  summary: Svipdag comes to a giant's guarded house and questions Fjolsvith, who denies
    him entry but answers a series of questions about the hall, its ruler Mengloth,
    the binding gate and enduring house, the world-spreading tree Mimameith, its childbirth-associated
    fruit, the golden cock Vithofnir, the guardian hounds, and the rare objects needed
    to obtain the weapon Lvatein from Sinmora.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A figure comes before a house described as the high home of giants; Svipdag
    sees a giant in front of the house with fires flaming around him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fjolsvith asks what the stranger seeks, tells him to wander away by wet ways,
    and denies that he has a home there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fjolsvith names himself, says he is wise but miserly with meat, and states
    that the stranger shall not enter the house.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Svipdag says that few leave the joy of their eyes when seeking the sight of
    their loves, calls the gates bright and the hall golden, and claims he shall have
    a home there.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: When asked his father and kindred, Svipdag gives the name Vindkald and says
    he is Varkald's son and Fjolkald's descendant.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Fjolsvith identifies Mengloth as the one who holds and rules the rich hall.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The gate is named Thrymgjol, was made by three sons of Solblindi, and holds
    anyone who lifts its latch fast like a fetter.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The house is named Gastropnir; Fjolsvith says he made it from the limbs of
    Leirbrimir and braced it to stand as long as the world lasts.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: The tree Mimameith casts its limbs over every land; its root is unknown, and
    neither fire nor iron will fell it.
  category: object
  evidence_refs:
  - ev:9
- id: obs:10
  text: Fjolsvith says pregnant women seek the tree's fruit and carry it to the flames,
    after which what was hidden within comes out.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: A cock named Vithofnir sits on the highest bough, shines with gold like lightning
    on Mimameith's limbs, and troubles Surt and Sinmora.
  category: object
  evidence_refs:
  - ev:11
- id: obs:12
  text: The hounds before the house are named Gif and Geri; they are fierce, great,
    and their might will grow until the gods are doomed to death.
  category: object
  evidence_refs:
  - ev:12
- id: obs:13
  text: 'The hounds do not sleep together: one sleeps by night and the other by day,
    so no one may enter while both are sleeping.'
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
