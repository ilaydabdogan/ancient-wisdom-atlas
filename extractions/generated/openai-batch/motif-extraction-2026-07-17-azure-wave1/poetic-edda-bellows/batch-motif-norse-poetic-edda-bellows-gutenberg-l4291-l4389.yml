canonical_text:
  quote: ''
  summary: Editorial notes on Grimnismol stanzas 34-45 discuss listed serpents of
    the Yggdrasil passage, a list of Valkyries, the sun’s horses and Sol’s heavenly
    task, the shield Svalin, wolves that devour sun and moon, cosmogonic details from
    Ymir’s body, Othin’s situation bound between fires, Ivaldi’s craftsmen-dwarfs
    and Skithblathnir, Sleipnir and Loki’s mare transformation, and the resumption
    of the poem’s narrative with Agir.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes state that the serpents listed in stanza 34 are otherwise unknown,
    that many names have conjectural meanings, and that Snorri quotes the stanza.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The notes state that stanza 35 concludes a passage beginning with stanza 25
    that describes Yggdrasil.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The notes provide a Valkyrie name-list and state that another list appears
    in Voluspo 31.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The notes describe Arvak and Alsvith as horses of the sun and summarize Snorri’s
    account in which Sol drives the horses drawing the sun’s car.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The notes state that the gods set two bellows under the horses’ yokes to cool
    them.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The notes identify Svalin as a cooling shield and say the only other reference
    to it is in Sigrdrifumol 15.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The notes identify Skoll and Hati as wolves that devour the sun and moon respectively.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The notes say Hati is the son of Hrothvitnir, identified parenthetically as
    Fenrir.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: The notes summarize Snorri’s added details that stones were made from Ymir’s
    teeth and broken bones, and that Mithgarth was a mountain-wall made from Ymir’s
    eyebrows around the earth.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: The notes state that Othin is bound between two fires and calls down a blessing
    on the man who will reach into the fire and move the great kettle aside.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The notes describe a great kettle in Icelandic houses as hanging under the
    roof smoke-vent and preventing anyone above from looking down inside.
  category: object
  evidence_refs:
  - ev:8
- id: obs:12
  text: The notes identify Ivaldi as the father of craftsmen-dwarfs who made Skithblathnir,
    Gungnir, and golden hair for Sif after Loki cut off her hair.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:13
  text: The notes describe Skithblathnir as a ship that always had a fair wind when
    its sail was set and could be folded up and put in a pocket.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: The notes identify Sleipnir as Othin’s eight-legged horse and as one of Loki’s
    progeny, borne by Loki to the stallion Svathilfari.
  category: relationship
  evidence_refs:
  - ev:11
- id: obs:15
  text: The notes say Loki transformed himself into a mare to delay a stallion belonging
    to the giant builder, causing the giant to fail to complete his task on time.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The notes identify Bragi as the god of poetry and Ithun as his wife and goddess
    of youth.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:17
  text: The notes state that with stanza 45 the poem’s narrative current is resumed
    and identify Agir as the sea-god.
  category: sequence
  evidence_refs:
  - ev:13
