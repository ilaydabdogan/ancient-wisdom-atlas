  summary: Editorial notes on the opening and later episodes of The Lay of Helgi the
    Son of Hjorvarth explain manuscript titling, names, genealogical links, a bird-counsel
    episode, Glasir's golden-leaved wood, gold-horned cattle, the flight of Sigrlin
    and Alof from Hrothmar, Helgi's namelessness and naming, a rune- and snake-carved
    sword, vengeance against Hrothmar, the slaying of the giant Hati, Hrimgerth's
    attacks on ships and mare-form, and related Eddic parallels.
  language: English
  quote_policy: summarized
