  - ev:2
  confidence: high
  cautions: The Othin witch-disguise item is explicitly marked as lacking other reference
    in the note; the Loki mare episode is presented more fully.
- id: motif:2
  label: Trickster disruption of a supernatural bargain
  taxonomy_refs:
  - trickster_boundary
  basis: Loki disrupts the fortress bargain by distracting Svathilfari and is elsewhere
    linked to Baldr's death through cunning.
  evidence_refs:
  - ev:1
  - ev:4
  confidence: high
  cautions: The passage is a commentary note, not the full narrative context.
- id: motif:3
  label: Monstrous or supernatural offspring of a liminal figure
  taxonomy_refs:
  - divine_parent_child
  basis: Loki gives birth to Sleipnir and is father of Fenrir, Narfi, and presumably
    Vali; Heimdall is also described as a son of Othin born of nine sisters.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:10
  - ev:11
  confidence: medium
  cautions: The motif groups several parent-child notices from notes; the passage
    does not present them as a single narrative unit.
- id: motif:4
  label: Chained wolf awaiting the end-time battle
  taxonomy_refs:
  - chaos
  basis: Fenrir/Hrothvitnir is a chained wolf who remains until the doom of the gods
    and the final battle.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The available taxonomy has no specific wolf or bound-monster category;
