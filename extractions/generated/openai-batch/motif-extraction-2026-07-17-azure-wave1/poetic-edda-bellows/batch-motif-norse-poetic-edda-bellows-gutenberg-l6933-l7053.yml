  summary: Bellows's notes to Lokasenna stanzas 23-49 explain mythic references including
    Loki's mare transformation and birth of Sleipnir, Othin's magic and alleged witch
    disguise, kinship traditions involving Frigg, Freyja, Freyr, Njorth, Vili, and
    Ve, Baldr's death through Loki's cunning and Hoth's blindness, Fenrir's chaining
    and river-making slaver, Muspell's sons and Surt in the last battle, Heimdall's
    functions and mutual death with Loki, and variant accounts of Loki's binding with
    the bowels or intestines of his sons.
