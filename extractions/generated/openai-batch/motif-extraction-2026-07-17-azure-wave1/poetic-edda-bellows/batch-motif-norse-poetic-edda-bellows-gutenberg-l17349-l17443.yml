canonical_text:
  quote: "“Hognis heart was cut out, and Gunnar was cast into the serpents den.”"
  summary: 'The passage introduces Drap Niflunga as a prose narrative link in the
    Eddic Sigurth cycle, then summarizes the aftermath of Sigurth and Brynhild’s deaths:
    Atli’s hostility toward the Gjukungs, Guthrun’s marriage to Atli after a draught
    of forgetfulness, Atli’s treacherous invitation to Gunnar and Hogni, Guthrun’s
    warning by runes and token, and the deaths of Hogni and Gunnar. The accompanying
    notes compare details with related poems and saga traditions.'
  language: English
  quote_policy: quoted
