  summary: Sigurth repeatedly asks Gripir to foretell his future. Gripir prophesies
    that Sigurth will take Fafnir's treasure, encounter a sleeping armored ruler's
    daughter who teaches him runes and languages, come to Heimir's home, face doomed
    death, love Brynhild, be deceived by Grimhild, marry or be drawn toward Guthrun,
    woo Brynhild for Gunnar, and exchange forms with Gunnar while retaining his own
    mind and voice.
