  quote: The poem is simply a contest of abuse...
  summary: The introductory note describes the manuscript setting, metrical irregularity,
    textual disorder, and broad farcical character of Harbarthsljoth. It identifies
    the opposing figures as Thor and Othin, with Othin appearing in the disguise of
    the ferryman Harbarth. The poem opens with Thor returning from the East to a sound,
    asking the ferryman across the water for passage, and entering an exchange of
    insults, name declarations, threats, and boasts about past exploits.
  language: English
  quote_policy: quoted
