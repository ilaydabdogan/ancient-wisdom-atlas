canonical_text:
  quote: ''
  summary: A dying queen speaks in the hall after self-wounding, distributes wealth,
    refuses to compel unwilling attendants to die, foretells future deaths and marriages
    involving Gunnar, Guthrun, Atli, Oddrun, Svanhild, Jonak, Bikki, and Jormunrek,
    and gives detailed instructions for a broad funeral pyre beside the dead hero
    Sigurth with attendants, animals, and a sword placed between them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Warriors in the hall are asked to come forward and try to keep the queen from
    death until her fearful thoughts fade.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hogni says she will not be held back from the long road and speaks of her
    being born for wicked deeds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Gunnar turns away from Hogni while the jewel-bearer divides gems and looks
    on her wealth, slain bond-women, and slaughtered slaves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman dons a golden byrnie, is pierced by the point of her sword, lays
    her head on a pillow, and considers her plan while wounded.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: She summons her women, offers gold, necklaces, cloth, and bright garments,
    and the women answer that enough are slain and that they seek to live.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: She says that no one unwilling or loath to die should lay down life for her
    sake.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: She addresses Gunnar and foretells events involving Guthrun and the birth
    of Svanhild.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: She foretells Atli seeking Guthrun, Oddrun and Gunnar loving in secret, Gunnar
    being cast into a den of snakes, and Guthrun killing Atli in bed with a blade.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: She says Guthrun will not lose her life for the speaker's sake, will travel
    over tossing waves to Jonak, will bear sons, and will suffer further grief when
    Svanhild dies through Bikki's word and Jormunrek's wrath.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: She requests a broad pyre in the field, covered with shields, carpets, shrouds,
    and fallen slaves, and asks to be burned beside the Hunnish hero.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: She specifies that slaves are to burn near the hero, with two at his head
    and two at his feet, along with a brace of hounds and a pair of hawks.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: She asks that keen steel lie between herself and the hero as it did when they
    were in one bed, and says that five bond-women and eight thralls will follow him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: At the end of the passage she says fate has not given more time for speech,
    her voice is weak, her wounds are swelling, and she dies.
  category: sequence
  evidence_refs:
  - ev:9
