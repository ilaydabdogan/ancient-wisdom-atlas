canonical_text:
  quote: ''
  summary: The introductory note situates Baldrs Draumar in manuscript and literary
    relation to the Voluspo and other Eddic poems. The poem depicts the gods meeting
    over Baldr's ominous dreams; Othin riding to Niflhel on Sleipnir; Othin summoning
    a dead wise-woman from her grave; and the wise-woman foretelling Baldr's death
    by Hoth, vengeance by Vali, and a future final strife when Loki is loose from
    bonds.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The introductory note says Baldrs Draumar is found only in the Arnamagnan
    Codex, is preserved in late paper manuscripts under the title Vegtamskvitha, and
    is closely linked in subject-matter and style with the Voluspo.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The introductory note says the Wise-Woman of the poem may or may not be identical
    with the Voluspo speaker; it also says Othin calls her up from the dead to learn
    the meaning of Baldr's evil dreams.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The gods and goddesses meet in council to discover why baleful dreams have
    come to Baldr.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Othin saddles Sleipnir, rides down to deep Niflhel, meets a hound from hell,
    and reaches the high house of Hel.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The hound from hell is described as bloody on its breast and howling at Othin
    from afar.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Othin rides to the eastern door where the wise-woman's grave is located and
    speaks magic and charms until she rises spell-bound and speaks in death.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The wise-woman says she has been made to travel a troublous road and states
    that she was long dead.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Othin gives the name Vegtam and says he knows of heaven but asks the wise-woman
    to speak of hell.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The wise-woman says mead and a shining drink are prepared for Baldr, with
    a shield over them, and that the hope of the mighty gods is gone.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Othin asks who will become Baldr's bane, and the wise-woman answers that Hoth
    bears the far-famed branch and will take the life of Othin's son.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Othin asks who will avenge Baldr, and the wise-woman answers that Rind bears
    Vali, who at one night old fights and will not wash his hands or comb his hair
    until he brings Baldr's slayer to the flames.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Othin asks about maidens who will weep and toss the yards of the sails to
    the sky; the wise-woman then identifies him as Othin rather than Vegtam.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Othin replies that she is no wise-woman and calls her the mother of three
    giants.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The wise-woman tells Othin to ride home and says no man will seek her again
    until Loki wanders loose from his bonds and destroyers come to the last strife.
  category: speech
  evidence_refs:
  - ev:11
