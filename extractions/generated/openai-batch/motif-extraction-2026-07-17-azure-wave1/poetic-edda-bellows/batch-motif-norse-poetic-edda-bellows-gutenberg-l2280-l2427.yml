  summary: A speaker begins a chant after seeing, thinking, and hearing the speech
    of Hor and words of runes near the wells of Urth and Hor's hall. The speaker repeatedly
    addresses Loddfafnir with practical and ethical counsel about night travel, witches,
    adultery, journey provisions, evil and good companions, friendship, speech, craft,
    battle, promises, caution, and treatment of guests or journey-goers.
  language: English
  quote_policy: summarized
