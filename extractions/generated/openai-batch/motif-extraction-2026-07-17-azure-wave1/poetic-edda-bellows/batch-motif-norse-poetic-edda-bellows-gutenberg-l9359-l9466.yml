canonical_text:
  quote: At the doors of the dead I call thee
  summary: Svipdag summons his dead mother Groa at a death-threshold and asks for
    help. He says a false woman associated with his father has sent him to seek Mengloth
    where no one may go. Groa chants a numbered sequence of protective charms against
    journey dangers, enemies, fetters, sea storms, frost, night curses, and verbal
    strife with a giant, then tells him to keep her words within him.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Svipdag calls on Groa, identified as his good mother, at the doors of the
    dead and asks for help at the hill of death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Groa replies as Svipdag's mother, calls him her only son, and says she lies
    in the mould and has left the world of the living.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'Svipdag says a false woman whom his father embraced set him a baleful task:
    to go where none may fare and seek Mengloth the maid.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Groa says the way is long, the wandering long, love is also long, and success
    depends on the favor of the fates.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Svipdag asks his mother to chant good charms and guard him because he fears
    death on the way and considers himself young.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Groa's first charm is described as an often-tried charm that Rani taught to
    Rind; it lets Svipdag shake off what mislikes him and become his own helper.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Groa's second charm protects Svipdag if he must travel a purposeless road
    by making the bolts of Urth guard him on every side.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Groa's third charm addresses threatening streams and says Horn and Ruth will
    turn to Hel and the waters will fail before Svipdag.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Groa's fourth charm addresses foes coming against Svipdag on the gallows-way
