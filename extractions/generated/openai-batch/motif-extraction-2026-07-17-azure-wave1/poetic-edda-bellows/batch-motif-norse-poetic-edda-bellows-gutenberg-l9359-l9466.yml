  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Groa's fifth charm addresses fetters binding Svipdag's limbs and says a loosening-charm
    will burst the lock and make the fetters fall from his feet.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Groa's sixth charm protects against sea storms by making wind and wave harmless
    and the boat's course calm.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Groa's seventh charm protects Svipdag from fatal frost on lofty crags so that
    cold will not grip his flesh and his body will remain whole.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Groa's eighth charm protects Svipdag if he wanders by night on murky ways,
    so that the curse of a Christian woman from the dead will not harm him.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Groa's ninth charm prepares Svipdag to contend in words with a warlike giant
    by giving his heart wit and his mouth wise words.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: Groa tells Svipdag to proceed where danger waits and says she has stood at
