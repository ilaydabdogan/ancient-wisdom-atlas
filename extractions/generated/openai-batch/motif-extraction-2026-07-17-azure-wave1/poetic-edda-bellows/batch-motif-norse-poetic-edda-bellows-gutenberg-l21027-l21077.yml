canonical_text:
  quote: ''
  summary: 'Editorial notes on stanzas 23-31 and prose for the Ballad of Hamther discuss
    manuscript ordering, possible interpolations, and narrative details: Hamther and
    Sorli as Gjuki''s grandsons; their wounding but not killing Jormunrek; a Volsungasaga
    variant in which Othin advises that they be killed with stones because iron will
    not wound them; Erp''s implied absence; and references to Norns and wolves.'
  language: English
  quote_policy: summarized
