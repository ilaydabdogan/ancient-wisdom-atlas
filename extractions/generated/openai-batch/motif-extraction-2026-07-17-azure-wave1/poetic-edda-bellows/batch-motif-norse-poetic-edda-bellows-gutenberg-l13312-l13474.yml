canonical_text:
  quote: ''
  summary: The introductory note describes the growth of the Sigurth legend through
    historical and legendary accretions, its adaptation in Norway, and its connection
    with Northern mythology. The poem opening then presents Sigurth riding to Gripir's
    hall, identifying himself, being welcomed, and asking Gripir to foretell his life.
    Gripir predicts Sigurth's fame, vengeance for kin, victory over Hunding's sons,
    and his future fight with the fiery dragon at Gnitaheith, along with the slaying
    of Regin and Fafnir.
  language: English
  quote_policy: summarized
