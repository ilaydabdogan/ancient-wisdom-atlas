  summary: Scholarly notes to Hamthesmol / The Ballad of Hamther discuss textual interpolation
    and defective stanzas, explain kennings, and summarize narrative background involving
    Guthrun, Jonak, Hamther, Sorli, Erp, Svanhild, Jormunrek, Randver, Atli, Gunnar,
    Hogni, and parallels in Guthrunarhvot, Atlamol, and the Volsungasaga.
