canonical_text:
  quote: ''
  summary: A treacherous welcome at Atli's hall turns into armed battle. Vingi is
    killed after revealing deceit. Atli's mailed men attack the Niflungs, while Guthrun
    casts off ornaments, tries to warn her kin, then takes up a sword and kills enemies
    including Atli's brother. Atli and Guthrun exchange accusations over kin-slaying
    and gold. Atli orders Hogni's heart cut out and Gunnar bound and cast to serpents;
    Beiti proposes killing the terrified cook Hjalli instead.
  language: English
  quote_policy: summarized
