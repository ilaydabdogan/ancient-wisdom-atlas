  quote: ''
  summary: The introduction explains the scarcity and inadequacy of earlier translations
    of the Poetic Edda, presents the work as a major storehouse of Germanic mythology
    and literature, and briefly identifies thematic contents including world creation
    and destruction in the Voluspo, wisdom counsels in the Hovamol, comic characterization
    in the Lokasenna, ballad form in the Thrymskvitha, and the heroic story of Sigurth,
    Brynhild, and Atli as a Norse parallel to the German Nibelungenlied.
  language: English
