canonical_text:
  quote: Bale and hatred I bring to the gods, / And their mead with venom I mix.
  summary: The introductory note describes Lokasenna as an insult-contest poem centered
    on Loki’s taunts to assembled gods and goddesses. The prose frame presents Ægir’s
    divine feast, Loki’s killing of Fimafeng, his expulsion and return, his exchange
    with Eldir, his entry into the hall, his claim on Odin’s old blood-bond promise,
    and the beginning of his quarrel with Bragi, interrupted by Ithun.
  language: English
  quote_policy: quoted
