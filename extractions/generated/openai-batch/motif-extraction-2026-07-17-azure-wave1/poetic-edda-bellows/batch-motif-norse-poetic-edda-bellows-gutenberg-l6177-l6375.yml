candidate_motifs:
- id: motif:1
  label: divine insult contest
  taxonomy_refs: []
  basis: The note explicitly describes the poem as an exchange or contest of insults
    consisting chiefly of Loki’s taunts to the assembled gods and goddesses and their
    replies.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is an editorial description in the introductory note, not a formal
    taxonomy label supplied by the passage.
- id: motif:2
  label: disruptive return to a divine feast
  taxonomy_refs:
  - trickster_boundary
  basis: Loki kills a servant, is expelled to the forest, returns, announces that
    he brings bale and hatred and venom to the gods’ mead, then crosses into the hall
    and demands drink and a seat.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
  - ev:14
  - ev:15
  confidence: medium
  cautions: The taxonomy reference is based on Loki’s boundary-crossing and disruptive
    conduct in this passage; the passage does not itself use the word 'trickster.'
- id: motif:3
  label: contested hospitality and shared drink obligation
  taxonomy_refs:
  - sacred_exchange
  basis: Loki demands mead and a seat; Bragi denies him a place, but Loki invokes
    Odin’s old blood-mixing and shared-ale promise, after which Odin orders Vithar
    to seat and serve him.
  evidence_refs:
  - ev:14
  - ev:15
  - ev:16
  - ev:17
  - ev:18
  - ev:19
  confidence: medium
  cautions: The sacred-exchange classification is tentative; the passage presents
    a remembered obligation involving blood and ale but does not name it as a ritual
    category.
- id: motif:4
  label: self-supplying divine feast
  taxonomy_refs: []
  basis: The feast has glittering gold in place of firelight, ale that comes in by
    itself, and an initial state of great peace.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage gives these as setting details; broader motif status would
    need comparison outside this passage.
- id: motif:5
  label: appeasement gifts to avert divine conflict
  taxonomy_refs:
  - sacred_exchange
  basis: Bragi offers Loki a horse, sword, and ring so that Loki will not make hatred
    among the gods or rouse them to wrath.
  evidence_refs:
  - ev:21
  confidence: medium
  cautions: The exchange fails immediately in the passage, and the taxonomy reference
    is tentative.
- id: motif:6
  label: binding of a dangerous wolf with bodily cost
  taxonomy_refs: []
  basis: Tyr is described as one-handed because Fenrir bit off his other hand when
