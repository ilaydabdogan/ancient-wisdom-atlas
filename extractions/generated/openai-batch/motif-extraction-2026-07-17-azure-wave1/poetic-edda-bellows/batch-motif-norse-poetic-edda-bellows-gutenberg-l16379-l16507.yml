  summary: Introductory note and opening stanzas of the Short Lay of Sigurth. The
    note discusses manuscript title, coherence, sources, dating, and German/Norse
    narrative traditions. The stanzas recount Sigurth's oath-bound alliance with Gjuki's
    sons, his marriage to Guthrun, the wooing of Brynhild, Brynhild's grief and desire
