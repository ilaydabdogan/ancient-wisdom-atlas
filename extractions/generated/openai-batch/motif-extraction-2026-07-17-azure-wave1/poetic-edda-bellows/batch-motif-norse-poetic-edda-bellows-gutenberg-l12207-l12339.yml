canonical_text:
  quote: ''
  summary: Bellows's introductory note characterizes the second Helgi Hundingsbane
    lay as a non-consecutive patchwork of eight fragments and summarizes its sections.
    The passage then gives prose and verse on Helgi's genealogy, his spying in King
    Hunding's home, his escape by wearing bond-woman's clothes and working at a mill,
    his killing of Hunding, and Sigrun's arrival at Helgi's ship. The note also refers
    to later sections involving Sigrun's curse and lament after Helgi's death and
    the return of the dead Helgi in a burial hill.
  language: English
  quote_policy: summarized
