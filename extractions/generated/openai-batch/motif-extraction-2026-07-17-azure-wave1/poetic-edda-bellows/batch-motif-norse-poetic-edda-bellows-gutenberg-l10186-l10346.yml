canonical_text:
  quote: ''
  summary: The passage recounts women associated with Egil, Slagfith, and Vlund leaving
    after seven winters; Vlund waits alone in Ulfdalir while crafting rings. King
    Nithuth learns of his isolation, seizes a ring and sword, has Vlund bound and
    hamstrung, and confines him to Svarstath to smith precious objects. Vlund later
    lures Nithuth's sons, kills them, and turns parts of their bodies into ornaments
    sent to Nithuth's household. Bothvild then comes to Vlund about her broken ring.
  language: English
  quote_policy: summarized
