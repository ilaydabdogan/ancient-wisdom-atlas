canonical_text:
  quote: ''
  summary: In the passage, speaking birds urge Sigurth not to spare Regin and direct
    him toward Fafnir's wealth. Sigurth kills Regin, eats Fafnir's heart, drinks the
    blood of Regin and Fafnir, and then hears the nut-hatch give counsel about rings,
    a gold-rich maid, Gjuki's daughter, and a flame-ringed hall on Hindarfjoll where
    a battle-maid sleeps under a doom involving Ygg, a thorn, and the Norns. Sigurth
    then enters Fafnir's earth-dug iron lair, takes gold and precious objects, loads
    Grani, and the horse moves only after Sigurth mounts.
  language: English
  quote_policy: summarized
