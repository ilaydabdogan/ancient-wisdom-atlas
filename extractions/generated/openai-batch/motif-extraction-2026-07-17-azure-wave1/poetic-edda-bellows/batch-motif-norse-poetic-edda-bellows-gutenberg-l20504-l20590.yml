canonical_text:
  quote: ''
  summary: 'Guthrun equips her sons for battle after inciting revenge. Hamther foresees
    that the warriors will not return. Guthrun weeps at the gate and recounts her
    griefs: multiple marriages, Sigurth’s death, Atli, her own acts of revenge, a
    failed attempt to escape the Norns by sea, Svanhild’s death among the Goths, Gunnar’s
    serpent death, and another king’s heart being cut out. She addresses dead Sigurth,
    recalls a pledge of meeting across hell and earth, and asks jarls to build an
    oak pyre so fire may consume her grief.'
  language: English
  quote_policy: summarized
