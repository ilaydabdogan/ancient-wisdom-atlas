canonical_text:
  quote: ''
  summary: Stanzas 161-165 continue a numbered catalogue of songs known by the speaker.
    The fifteenth is associated with Thjothrrir the dwarf singing before Delling's
    doors and bringing might, glory, and wisdom to named recipients. The sixteenth
    and seventeenth concern influence over maidens. Loddfafnir is told that these
    songs are hard to gain and sing. The eighteenth is withheld from maidens and wives,
    except for an intimate woman or sister.
  language: English
  quote_policy: summarized
