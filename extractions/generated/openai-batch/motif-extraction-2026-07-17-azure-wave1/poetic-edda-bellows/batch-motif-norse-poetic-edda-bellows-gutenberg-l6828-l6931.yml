  summary: 'Editorial notes to Lokasenna identify and contextualize figures at Ægir’s
    feast and related stanzas: Ægir’s sea-hall, Frigg, Thor, Sif, Bragi, Ithun, Tyr,
    Njorth, Skathi, Vithar, Loki, servants, gold-light imagery, Loki’s names, taunts,
    a reported Othin-Loki blood-brotherhood, and uncertain or obscure incidents involving
    goddesses and mythic objects.'
