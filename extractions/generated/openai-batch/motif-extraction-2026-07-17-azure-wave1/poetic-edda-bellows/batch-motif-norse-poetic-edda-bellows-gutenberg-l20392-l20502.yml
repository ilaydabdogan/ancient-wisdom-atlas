canonical_text:
  quote: ''
  summary: Introductory note and opening stanzas for Guthrunarhvot. The note relates
    the poem to Ermanarich/Sunilda traditions, the Sigurth-Guthrun/Nibelung cycle,
    and Hamthesmol. The prose preface recounts Guthrun's failed drowning, her arrival
    at Jonak's land, Svanhild's marriage to Jormunrek, Bikki's counsel concerning
    Randver and Svanhild, Randver's hanging, Svanhild's death under horses' feet,
    and Guthrun's incitement of her sons. The first stanzas present Guthrun's grim
    speech urging vengeance, followed by Hamther's reply recalling Sigurth's blood-filled
    death.
  language: English
  quote_policy: summarized
