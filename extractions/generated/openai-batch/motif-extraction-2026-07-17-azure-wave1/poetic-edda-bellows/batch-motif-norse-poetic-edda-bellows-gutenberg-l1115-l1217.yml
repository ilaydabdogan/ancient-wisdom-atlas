  summary: Editorial notes on the opening stanzas of Voluspo explain the Volva’s compelled
    speech to Othin, Heimdall and mankind, Othin as Valfather, the nine worlds and
    Yggdrasil, Ymir and the primordial gap, Bur’s sons, celestial kinship of sun and
    moon, Ithavoll, giant-maids or Norns, and the dwarf catalogue including Durin,
    Dvalin, Brimir, and Blain.
