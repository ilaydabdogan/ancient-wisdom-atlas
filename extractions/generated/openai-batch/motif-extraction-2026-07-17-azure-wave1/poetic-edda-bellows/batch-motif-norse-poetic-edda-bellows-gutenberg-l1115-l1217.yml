comparison_claims:
- id: claim:1
  claim: The note cautiously relates the phrase Heimdall’s sons to Rigsthula, where
    a figure named Rig is ancestor of three classes of men and a later annotator identifies
    Rig with Heimdall.
  claim_level: same_function
  target: Rigsthula ancestor-of-social-classes tradition
  evidence_refs:
  - ev:2
  counter_evidence_refs:
  - ev:2
  confidence: low
  limitations: The note explicitly says the authority for the identification is unknown
    and that Rig seems more like Othin.
- id: claim:2
  claim: The note connects Yggdrasil in Voluspo with Grimnismol, where Yggdrasil is
    described at length.
  claim_level: same_motif
  target: Grimnismol 29-35 world-ash Yggdrasil
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The passage only reports the cross-reference and does not quote the
    Grimnismol description.
- id: claim:3
  claim: The note links the Ymir world-body cosmogony to Vafthruthnismol and to Snorri’s
    Edda.
  claim_level: same_motif
  target: Vafthruthnismol 21 and Snorri’s Edda Ymir cosmogony
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The note gives only a brief summary and reference, not the full parallel
    passages.
- id: claim:4
  claim: The note compares the giant-maids or Norns in Voluspo with references in
