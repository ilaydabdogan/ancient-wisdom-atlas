canonical_text:
  quote: ''
  summary: A messenger from Atli comes to Gunnar and Hogni with an invitation and
    rich offers. Hogni reads a ring with a wolf hair as a warning, but Gunnar and
    his company depart through Myrkwood to Atli's armed halls. Their sister warns
    that Gunnar has been betrayed and that the snake den is destined for him. Gunnar
    is seized and bound; Hogni fights for him. Gunnar is asked whether he will buy
    his life with gold, demands Hogni's heart, rejects Hjalli's trembling heart, and
    receives Hogni's heart after Hogni laughs under torture.
  language: English
  quote_policy: summarized
