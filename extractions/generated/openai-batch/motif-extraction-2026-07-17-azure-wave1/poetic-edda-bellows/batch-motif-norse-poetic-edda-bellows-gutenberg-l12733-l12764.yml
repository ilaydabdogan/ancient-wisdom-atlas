canonical_text:
  quote: ''
  summary: Helgi speaks of riding away on a skyward, westward route before Salgofnir
    wakes the warrior host. Helgi and his followers depart, while Sigrun later asks
    a maiden to keep watch at a hill. At sunset Sigrun laments that Sigmund's son
    would have come from Othin's seat if he could, but hope of the hero's return is
    fading. The maiden warns that seeking the house of the dead alone at night would
    seem mad because ghosts are stronger at night. The prose note says Sigrun died
    early of sorrow and that an old belief held that people were born again; Helgi
    and Sigrun are said to have been reborn as Helgi Haddingjaskati and Kara, daughter
    of Halfdan, who was a Valkyrie.
  language: English
  quote_policy: summarized
