canonical_text:
  quote: Oddruns lament is ended now.
  summary: Oddrun recounts Brynhild’s self-slaying, her own love for Gunnar, Atli’s
    refusal of marriage compensation, the discovery of the lovers by spies, the killing
    of Hogni, Gunnar’s casting into a serpent cave, Gunnar’s harp-playing appeal for
    help, Oddrun’s failed rescue attempt, and her continuing grief.
  language: English
  quote_policy: quoted
