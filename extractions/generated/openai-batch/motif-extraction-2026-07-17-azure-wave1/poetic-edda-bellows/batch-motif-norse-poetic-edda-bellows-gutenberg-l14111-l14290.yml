canonical_text:
  quote: ''
  summary: 'Regin, fosterer and teacher of Sigurth, recounts the origin of Fafnir''s
    hoard: Loki kills Otr in otter shape, the gods pay ransom with Andvari''s gold
    and ring, Andvari curses the treasure, and Fafnir kills Hreithmar and keeps the
    wealth. Regin then prepares Sigurth with the sword Gram and urges him toward Fafnir,
    who lies at Gnitaheith in dragon shape with a fear-helm; Sigurth insists first
    on avenging his father and receives a fleet from Hjalprek before a storm and a
    mountain-speaking figure appear.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sigurth chooses a horse from Hjalprek's stud, and the horse is afterward called
    Grani.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Regin is identified as the son of Hreithmar, small in stature, ingenious,
    wise, fierce, skilled in magic, and responsible for Sigurth's upbringing and teaching.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Regin tells Sigurth about Othin, Hnir, and Loki coming to Andvari's waterfall,
    where many fish are present.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Andvari is a dwarf who has long lived in the waterfall in the shape of a pike
    and obtains food there.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Otr, Regin's brother, often enters the waterfall in the shape of an otter.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: Loki kills Otr with a stone while Otr is eating a salmon on the bank, and
    the gods strip off the otter skin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: At Hreithmar's house, the gods are seized and required to fill and cover the
    otter skin with red gold as ransom for their lives.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Loki borrows Ron's net, casts it before the pike at Andvari's fall, and the
    pike leaps into the net.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Andvari names himself, names Oin as his father, and says an evil Norn doomed
    him to live in waters.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After Loki takes all Andvari's gold and a withheld ring, Andvari goes into
    a rocky hole and declares that the gold will bring death and evil.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The gods fill and cover the otter skin with gold; when one whisker remains
    visible, Othin covers it with the ring Andvaranaut.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Loki states that the gold is given at a great price and will be the bane of
    Hreithmar and his sons.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Hreithmar refuses to share the ransom wealth with Fafnir and Regin.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Fafnir thrusts his sword through his father Hreithmar while Hreithmar is sleeping.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Hreithmar calls to Lyngheith and Lofnheith as he is dying, and Lyngheith says
    a sister seldom takes revenge on her brother for her father.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: Hreithmar tells Lyngheith to bear a daughter with a wolf's heart if she has
    no son, so that a descendant may seek vengeance.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
  text: After Hreithmar dies, Fafnir takes all the gold and refuses Regin's inheritance
    claim.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:18
  text: Lyngheith counsels Regin to ask Fafnir for the wealth in a friendly manner
    and not to seek Fafnir's treasure with the sword.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:19
  text: Regin welcomes Sigurth, calls him the son of Sigmund and Yngvi's heir, and
    says he will foster the fearless prince.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:20
  text: Regin says Fafnir lies at Gnitaheith in the shape of a dragon and has a fear-helm
    that terrifies all living creatures.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:21
  text: Regin makes Sigurth the sword Gram, whose sharpness is shown by cutting a
