    or remaining silent.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A greedy or foolish man is said not to know the measure of his belly, unlike
    herds that know when to go home from grass.
  category: attribute
  evidence_refs:
  - ev:5
