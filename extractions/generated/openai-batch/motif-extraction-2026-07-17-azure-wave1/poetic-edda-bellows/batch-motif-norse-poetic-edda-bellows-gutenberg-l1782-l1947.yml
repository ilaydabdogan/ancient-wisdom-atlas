  summary: Gnomic stanzas contrast foolish, greedy, slothful, cowardly, and ungenerous
    conduct with wise, moderate, brave, self-sufficient, and reciprocal conduct. The
    passage gives counsel on mortality, feasting, drink, speech and silence, travel,
    guests, homes, weapons, friends, foes, gifts, distrust, and companionship.
