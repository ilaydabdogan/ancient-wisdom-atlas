canonical_text:
  quote: ''
  summary: Othin questions Vafthruthnir about maidens who will protect earth-dwellers,
    who will rule after Surt's fires have sunk, Othin's death at the gods' destruction,
    and the secret words spoken to his son before the bale-fire. Vafthruthnir answers
    with future divine survivors and avengers, then admits that only Othin could know
    the final secret and recognizes Othin as wiser.
  language: English
  quote_policy: summarized
