candidate_motifs:
- id: motif:1
  label: Verbal contest of boasts and insults
  taxonomy_refs: []
  basis: The passage repeatedly alternates Thor's and Harbarth's speeches, with boasts
    of deeds, questions about what the other did, insults, accusations, and threats.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  - ev:6
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage itself does not name the exchange as a formal contest; the
    motif label summarizes the observable speech pattern.
- id: motif:2
  label: Denied ferry passage at a water boundary
  taxonomy_refs:
  - trickster_boundary
  basis: Harbarth controls or is associated with the boat and refuses to take Thor
    across the sound, instead hindering him and giving a long alternate route.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage supports the boundary and refusal function; it does not explicitly
    label Harbarth a trickster.
- id: motif:3
  label: Giant-slaying protector of Midgard and travelers
  taxonomy_refs:
  - culture_hero
  basis: Thor reports felling Thjazi, killing giant women, guarding a river from attackers,
    and fighting hostile Berserker brides; he explicitly links the survival of giants
    with the absence of men in Midgard.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  - ev:8
  confidence: medium
  cautions: The culture-hero taxonomy is approximate because the passage emphasizes
    boasting and combat rather than foundation of a cultural institution.
- id: motif:4
  label: Gift repaid by theft of knowledge or mind
  taxonomy_refs:
  - sacred_theft
  basis: Harbarth says Hlebarth gave him a wand as a gift and that he stole Hlebarth's
    wits away; Thor describes this as repaying good gifts with evil mind.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The stolen object is 'wits' rather than a clearly sacred object; the taxonomy
    reference is tentative.
- id: motif:5
  label: Erotic trickery and adultery accusation
  taxonomy_refs: []
  basis: Harbarth boasts of stealing women from husbands, meeting a maid by stealth,
    and accusing Sif of having a lover at home.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:10
  confidence: medium
  cautions: The passage presents these as boasts and taunts; it does not independently
    verify the events or accusation.
- id: motif:6
  label: Socially ranked divine allotment of the dead or human groups
  taxonomy_refs: []
  basis: Harbarth states that the noble who falls in fight has Othin, while Thor has
    the race of the thralls.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives a terse polemical statement inside a taunt; it does
    not elaborate an afterlife journey or judgment scheme.
- id: motif:7
  label: Hostile supernatural or liminal female groups subdued by the warrior god
  taxonomy_refs:
  - chaos
  basis: Thor reports killing ill-working giant women and Berserker brides whom he
    describes as she-wolves who attacked his ship and drove off Thjalfi.
  evidence_refs:
  - ev:4
  - ev:8
  confidence: medium
  cautions: The 'chaos' taxonomy is broad; the passage supplies hostility and disordering
    acts but not a cosmological chaos doctrine.
comparison_claims:
- id: claim:1
  claim: 'Harbarth''s refusal to ferry Thor across the sound functions as a boundary-trickster
    pattern: a verbal challenger controls a crossing, delays the traveler, taunts
    him, and redirects his route.'
  claim_level: same_function
  target: trickster_boundary motif family
  evidence_refs:
  - ev:10
  - ev:11
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports the function of boundary obstruction, but it does
    not explicitly identify Harbarth as a trickster or provide wider comparative context.
- id: claim:2
  claim: Thor's repeated accounts of slaying giants and guarding a river function
    like a protector or culture-hero combat pattern in which a powerful figure defends
    the human world from threatening beings.
  claim_level: same_function
  target: culture_hero motif family
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage is a flyting-style exchange of boasts; it does not present
    a complete origin myth or culture-founding narrative.
- id: claim:3
  claim: The wand-gift followed by the stealing of Hlebarth's wits can be cautiously
    compared to a sacred-theft or trickster-theft pattern, insofar as a valuable nonmaterial
    possession is taken through deception after exchange.
  claim_level: same_function
  target: sacred_theft motif family
  evidence_refs:
  - ev:3
  counter_evidence_refs: []
  confidence: low
  limitations: The passage does not call the wand or wits sacred, and the theft concerns
    cognition rather than a named ritual or cosmic object.
