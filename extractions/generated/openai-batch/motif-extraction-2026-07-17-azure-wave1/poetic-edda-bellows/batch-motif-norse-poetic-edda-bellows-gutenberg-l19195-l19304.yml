canonical_text:
  quote: ''
  summary: The passage gives an introductory note on the Greenlandic Atlamol, describing
    its relation to Atlakvitha, its probable Greenlandic composition, its adaptation
    of a South Germanic heroic story, and its summary plot of Atli's summons, the
    journey of Gjuki's sons, their deaths, and Guthrun's revenge. The poem then begins
    with secret counsel, Atli's ill-advised message to his kinsmen, a wise woman making
    runes that Vingi falsifies, the arrival of Atli's messengers at Limafjord, generous
    hospitality, the presence of Kostbera and Glaumvor, and Kostbera's attempt to
    read the strange runes by firelight before telling Hogni her dream.
  language: English
