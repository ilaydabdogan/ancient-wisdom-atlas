  cautions: The passage is an editorial note summarizing and glossing the poem rather
    than the verse text itself.
- id: motif:2
  label: Ship made from dead matter carrying hostile hosts
  taxonomy_refs: []
  basis: Naglfar is made from dead men's nails and carries giants to battle; nearby
    notes also mention people of Hel arriving by ship.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The notes also report manuscript confusion about the hosts; the exact
    relationship between named hosts and ships should be checked against the stanza
    text.
- id: motif:3
  label: World-destroying fire
  taxonomy_refs:
  - world_destroying_fire
  basis: Surt rules the fire-world, fire is emphasized through a poetic kenning, and
    the notes place these details within the destruction sequence.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The evidence is from notes, not direct verse lines.
- id: motif:4
  label: Serpent combat ending in the god's death
  taxonomy_refs:
  - serpent
  basis: Thor slays Mithgarthsorm and then dies after being overcome by the serpent's
