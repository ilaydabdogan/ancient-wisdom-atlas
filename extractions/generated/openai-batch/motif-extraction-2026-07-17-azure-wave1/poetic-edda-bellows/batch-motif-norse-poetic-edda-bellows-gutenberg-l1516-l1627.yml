  quote: ''
  summary: Editorial notes to Voluspo stanzas 50-65 identify figures, manuscript variants,
    and interpreted episodes in the destruction of the old world and the emergence
    of a renewed world, including the world-encircling serpent, Naglfar, Surt and
    fire, Fenrir, Thor, Othin, Vithar, Baldr and Hoth, runes, golden tables, Gimle,
    and an uncertain unnamed ruler.
  language: English
  quote_policy: summarized
