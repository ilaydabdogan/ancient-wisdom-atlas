canonical_text:
  quote: ''
  summary: Hrimgerth, a giantess, exchanges taunts with Atli and Helgi after threatening
    the ships. She reports that a company of mounted maidens, led by a helmed white
    maiden, protected the fleet. Atli and Helgi keep her talking until daybreak, when
    she is doomed to stand as stone by the harbor. The prose then recounts Helgi’s
    vows with Svava, Hethin’s Yule-eve encounter with a troll-woman riding a wolf
    with snakes as bridle, Hethin’s rash vow on the sacred boar to have Svava, Helgi’s
    foreknowledge of death, his battle wound, and his sending Sigar to summon Svava
    before he dies.
  language: English
  quote_policy: summarized
