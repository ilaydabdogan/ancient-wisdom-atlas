canonical_text:
  quote: ''
  summary: The introductory note describes the Thrymskvitha as a well-preserved and
    notable Eddic poem. In the opening narrative, Thor wakes and discovers his hammer
    is missing. Loki borrows Freyja's feather-dress, flies to the giants' realm, and
    learns from Thrym that the hammer is hidden deep in the earth and will only be
    returned if Freyja becomes Thrym's wife. Freyja angrily refuses. The gods hold
    council, Heimdall proposes dressing Thor as a bride, and Loki agrees to accompany
    him as a maid-servant. Thor and Loki travel toward Jotunheim, and Thrym prepares
    for the supposed arrival of Freyja as bride.
  language: English
  quote_policy: summarized
