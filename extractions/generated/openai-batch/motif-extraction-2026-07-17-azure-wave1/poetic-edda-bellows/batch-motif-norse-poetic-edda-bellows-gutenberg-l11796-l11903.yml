canonical_text:
  quote: ''
  summary: A flyting exchange between Sinfjotli and Gothmund gives way to Helgi's
    rebuke that battle is better than empty words. Messengers and reports describe
    a hostile fleet and army. Hothbrodd summons allies against the Volsungs. At Frekastein
    the battle begins, Helgi is foremost among the warriors, helmed maidens come from
    heaven, and Sigrun praises Helgi's victory, naming rings, a noble bride, Hringstathir,
    wealth, and triumph as his gains.
  language: English
