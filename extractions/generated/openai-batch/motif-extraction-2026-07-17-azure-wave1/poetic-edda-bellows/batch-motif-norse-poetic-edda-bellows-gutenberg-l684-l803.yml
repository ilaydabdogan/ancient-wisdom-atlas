canonical_text:
  quote: ''
  summary: 'The passage introduces Voluspo as a major Eddic poem and summarizes its
    plan: Othin seeks knowledge from a Volva, who recounts creation, Yggdrasil, early
    beings, wars, Othin’s secrets, the gods’ final destruction by battle, fire, and
    flood, and a renewed world where Baldr returns. The included opening stanzas invoke
    listeners, recall giants and nine worlds in a tree, describe a primordial gap
    in Ymir’s age, the making of Mithgarth by Bur’s sons, unassigned celestial bodies,
    and the gods’ naming of times.'
  language: English
  quote_policy: summarized
