canonical_text:
  quote: ''
  summary: Gunnar identifies Hogni's heart, states that he alone now knows the Niflungs'
    hoard, and says the Rhine will hold the gold rather than the Huns. Atli has Gunnar
    bound and cast into a serpent den, where Gunnar strikes harp-strings. Guthrun
    receives Atli with drink and food, reveals that he has eaten the hearts and flesh
    of his sons Erp and Eitil, scatters gold, kills the drunken and weaponless Atli
    with a sword, and sets the hall on fire. The passage closes by describing this
    as an unmatched vengeance for brothers.
  language: English
  quote_policy: summarized
