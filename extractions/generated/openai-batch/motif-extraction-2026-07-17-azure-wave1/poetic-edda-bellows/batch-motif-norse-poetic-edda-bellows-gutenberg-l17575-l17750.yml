canonical_text:
  quote: ''
  summary: Guthrun recalls weaving heroic scenes, Grimhild summoning her sons to make
    amends, gifts and speeches offered for Guthrun's grief, a bitter magic draught
    that makes her forget Sigurth's killing, pressure to marry Atli, Guthrun's resistance
    and foretelling of harm to Gunnar and Hogni, a journey to Atli's halls, and Atli's
    later dreams of a poisoned blade, uprooted bloody plants, and hawks' hearts eaten
    with honey and blood.
  language: English
  quote_policy: summarized
