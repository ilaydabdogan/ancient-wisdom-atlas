  - ev:15
  confidence: medium
  cautions: The passage supports exchange and compensation, but the available taxonomy
    label 'sacred_exchange' may be broader than the literal kinship settlement described.
- id: motif:3
  label: Magic drink that removes grief or memory
  taxonomy_refs: []
  basis: Grimhild gives Guthrun a bitter cold draught, brewed with magical, animal,
    plant, and runic elements; Guthrun says she forgot her husband's slaying when
    the draught was given.
  evidence_refs:
  - ev:6
  - ev:7
