- id: motif:2
  label: Compensation gifts for kin-slaying or marital loss
  taxonomy_refs:
  - sacred_exchange
  basis: Grimhild asks who will make amends, Gunnar and Hogni are ready to give gold,
    and Grimhild later offers wealth, women, and lands to Guthrun.
  evidence_refs:
