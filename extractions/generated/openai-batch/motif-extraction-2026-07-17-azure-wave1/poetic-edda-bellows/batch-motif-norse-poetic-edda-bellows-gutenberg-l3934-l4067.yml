  summary: The passage describes beings and objects associated with Yggdrasil, the
    sun, divine service to warriors, the making of the world from Ymir’s body, divine
    artifacts and rankings, and the speaker’s many names. The speaker reveals himself
    as Othin, condemns King Geirrth, and Geirrth dies by falling onto his own sword;
    afterward Agnar rules.
