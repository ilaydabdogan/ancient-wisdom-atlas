canonical_text:
  quote: ''
  summary: A storm-tossed sea journey brings Sigurth and Regin into contact with a
    man who names himself Hnikar and other names, boards their ship, and is followed
    by the storm's subsiding. Sigurth asks him for the best signs before battle, and
    Hnikar gives a sequence of favorable and unfavorable omens and practical counsel.
    Sigurth later defeats Lyngvi and his brothers; Regin describes a bloody eagle
    carved on Sigmund's killer and then urges Sigurth to fight Fafnir.
  language: English
  quote_policy: summarized
