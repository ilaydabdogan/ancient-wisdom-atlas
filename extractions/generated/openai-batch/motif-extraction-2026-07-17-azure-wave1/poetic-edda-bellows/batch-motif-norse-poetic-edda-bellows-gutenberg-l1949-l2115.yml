  summary: A sequence of Hávamál gnomic stanzas gives counsel about social standing,
    friendship, small gifts, moderate wisdom, speech and secrecy, diligence, hospitality,
    fire, health, death, kin memorials, fame, wealth, runes, and delayed praise after
    testing or completion.
