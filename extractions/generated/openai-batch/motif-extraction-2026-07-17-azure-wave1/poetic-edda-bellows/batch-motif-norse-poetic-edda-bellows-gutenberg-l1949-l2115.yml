literal_observations:
- id: obs:1
  text: The first-person speaker says he once gave garments in a field to a pair of
    carven poles; when clothed they seemed like heroes, while the naked man is said
    to be nought.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fir-tree on a dreary hillside dies with its needles and bark bootless, and
    the stanza compares it to a man whom no one loves.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Friendship between false friends is described as burning hotter than fire
    for five days and cooling on the sixth day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The speaker says that a small gift, including half a loaf and a half-filled
    cup, can purchase praise and make a friend quickly.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Several stanzas advise that each man should have a measure of wisdom but not
    too much, and that no man should see the fate before him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: A brand is kindled from a brand, fire is begotten from fire, and a man is
    known by speech while the stupid are known by stillness.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: A man who seeks another’s blood or goods, or who has few workers, is advised
    to go forth early; the idle wolf and sleeping man win little.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage names fire, the power to see the sun, health, and an unstained
    life as desirable goods for men.
  category: object
  evidence_refs:
  - ev:13
- id: obs:9
  text: The speaker says it is better to live than to lie a corpse, and reports seeing
