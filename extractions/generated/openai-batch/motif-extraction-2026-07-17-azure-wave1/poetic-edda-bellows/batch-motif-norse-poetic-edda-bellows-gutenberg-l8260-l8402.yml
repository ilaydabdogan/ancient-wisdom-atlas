canonical_text:
  quote: ''
  summary: 'Rig repeatedly travels to households, sits and sleeps between household
    members, stays three nights, and departs. After nine months, sons are born to
    Edda, Amma, and Mothir: Thrll, Karl, and Jarl. The passage describes their birth
    rites, appearances, work, marriages or household formation, descendants, and the
    stated origins of the races of thralls and yeomen.'
  language: English
  quote_policy: summarized
