canonical_text:
  quote: ''
  summary: 'The introductory note identifies the Skirnismol, its manuscript witnesses,
    title, literary character, and proposed dating. The narrative then begins: Freyr,
    seated in Hlithskjolf, looks into Jotunheim, sees a fair maiden, and becomes love-sick.
    Njorth sends Skirnir to ask Freyr what troubles him. Freyr describes the maiden
    from Gymir''s house and says that gods or elves will not allow their union. Skirnir
    asks for Freyr''s horse and self-fighting sword, then rides to Gymir''s house
    in Jotunheim, where dogs guard Gerth''s hall. After speaking with a herdsman,
    Skirnir is admitted, questioned by Gerth, and offers eleven golden apples to gain
    her troth for Freyr. Gerth refuses the apples and refuses to dwell with Freyr.'
  language: English
  quote_policy: summarized
