canonical_text:
  quote: ''
  summary: Hogni and Gunnar receive runic and dream warnings before traveling. Kostbera
    and Glaumvor describe ominous visions of fire, animals, weapons, water, hanging,
    serpents, dead women, and fate. Hogni and Gunnar interpret or dismiss the warnings
    and proceed with companions. Vingi swears he has not lied, the travelers depart
    by ship, and they reach the former home of Buthli.
  language: English
  quote_policy: summarized
