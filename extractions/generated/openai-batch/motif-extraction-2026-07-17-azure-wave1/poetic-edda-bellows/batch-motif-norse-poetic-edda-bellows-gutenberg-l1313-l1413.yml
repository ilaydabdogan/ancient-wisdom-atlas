  summary: Editorial notes to Voluspo stanzas 27-36 describe the Volva's turn to Othin's
    secrets and prophecy, Othin's eye exchange with Mimir, Heimdall's buried horn,
    Valkyries and Valhall, Baldr's death and vengeance, Loki's binding, and otherworld
    homes of giants, dwarfs, and the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Volva turns from memories of the past to Othin's secrets in his search
    for knowledge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Heimdall's Gjallarhorn will summon the gods to the last battle and remains
    buried under Yggdrasil until then.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: Othin gave his eye to Mimir in exchange for wisdom; the eye is described as
    a drinking-vessel used with magic mead and water poured on Yggdrasil.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The note says Othin's sacrifice of his eye was made to gain knowledge of his
    final doom and is part of a series of disasters leading to the gods' destruction.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Volva directly addresses Othin, claiming to know why he has come and what
    he has suffered in seeking knowledge of his doom.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Volva is described as rewarded by Othin for her knowledge of the past
    and induced to continue with prophecy.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Valkyries bring the bravest warriors killed in battle to Valhall to reinforce
    the gods for their final struggle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Frigg secured oaths from created things not to harm Baldr, except for mistletoe;
    Loki brought mistletoe to blind Hoth and guided his hand, and Baldr was slain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Vali, begotten by Othin to avenge Baldr, fought and slew Hoth the day after
    Vali's birth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After Baldr's murder, the gods bound Loki to a rock with Narfi's bowels; a
    serpent's venom fell on Loki, while Sigyn caught it in a basin when present.
  category: sequence
  evidence_refs:
  - ev:9
