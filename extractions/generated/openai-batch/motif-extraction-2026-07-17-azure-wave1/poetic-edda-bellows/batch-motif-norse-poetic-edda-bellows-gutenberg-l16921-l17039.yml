canonical_text:
  quote: ''
  summary: 'Editorial notes discuss textual gaps, variant arrangements, and narrative
    details in the Short Lay of Sigurth: Sigurth is killed in bed; Gram may be his
    sword; Freyr may be a late ancestor of the Volsungs; Sigurth, Guthrun, Sigmund,
    Brynhild, Gunnar, Hogni, and Atli are connected through disputed episodes of betrayal,
    marriage deception, dragon-slayer recognition, Brynhild''s Valkyrie identity,
    her determination to die, and a possible Christian-colored idea that suicide prevents
    being born again.'
  language: English
  quote_policy: summarized
