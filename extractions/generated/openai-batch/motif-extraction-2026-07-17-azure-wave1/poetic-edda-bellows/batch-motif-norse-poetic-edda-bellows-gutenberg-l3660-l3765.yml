canonical_text:
  quote: ''
  summary: 'The introductory note describes Grimnismol as an encyclopedic Eddic poem
    with an underlying dramatic story: Othin, under the name Grimnir, is tortured
    by King Geirrth between fires, reveals wisdom to the kind young Agnar, and ultimately
    reveals his names before Geirrth dies. The prose narrative recounts the childhood
    separation of Hrauthung''s sons Agnar and Geirrth, their winter fostering after
    shipwreck, Geirrth''s betrayal of Agnar and rise to kingship, and the later wager
    of Othin and Frigg concerning Geirrth''s hospitality. Frigg sends Fulla to warn
    Geirrth about a magician whom dogs will not attack; Geirrth captures the man called
    Grimnir and torments him between two fires until young Agnar gives him a horn
    to drink.'
  language: English
  quote_policy: summarized
