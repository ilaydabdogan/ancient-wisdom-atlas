canonical_text:
  quote: ''
  summary: 'Editorial notes on Guthrunarkvitha I discuss variant or related traditions:
    Guthrun eating part of Fafnir''s heart and becoming wiser; Herjan as Othin and
    his maids as Valkyries; cursed gold as a motive in Sigurth''s murder; Atli''s
    role in Brynhild''s forced or deceptive marriage to Gunnar; and the kenning of
    gold as the flame of the snake''s bed because serpents and dragons guard treasure.'
  language: English
  quote_policy: summarized
