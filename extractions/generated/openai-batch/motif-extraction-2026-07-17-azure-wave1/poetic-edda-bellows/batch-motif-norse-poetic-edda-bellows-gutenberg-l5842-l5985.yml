canonical_text:
  quote: ''
  summary: Thor/Hlorrithi eats heavily at Hymir's house, obtains an ox head as bait,
    rows out with Hymir, hooks the earth-girdling serpent, strikes it with his hammer,
    and returns. Hymir then tests Thor's strength by challenging him to break a cup
    and remove a great kettle. Thor breaks the cup by striking it against Hymir's
    skull, lifts and carries the kettle, fights a pursuing many-headed throng from
    eastern caves, and brings the kettle to the gods so they can drink ale in Gir's
    hall at autumn-time.
  language: English
  quote_policy: summarized
