candidate_motifs:
- id: motif:1
  label: god or hero fishes up a world-girdling serpent
  taxonomy_refs:
  - serpent
  basis: Thor uses an ox head as bait, draws up the venomous serpent described as
    the foe of the gods and girdler of the earth, strikes it with his hammer, and
    the earth shakes before it sinks.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage does not itself name the serpent as a world serpent beyond
    the literal description of girdling the earth.
- id: motif:2
  label: strength contests between a god and a giant
  taxonomy_refs: []
  basis: Hymir repeatedly challenges or measures strength against Thor through rowing,
    carrying the boat and whales, breaking the cup, and moving the kettle.
  evidence_refs:
  - ev:6
  - ev:12
  - ev:13
  - ev:14
  - ev:17
  - ev:19
  - ev:20
  confidence: high
  cautions: No external contest-type taxonomy is assigned because the supplied taxonomy
    list has no exact strength-contest category.
- id: motif:3
  label: impossible vessel broken by hidden weakness
  taxonomy_refs: []
  basis: The cup cannot be broken against stone pillars, but the giant's loved one
    reveals that Hymir's skull is harder than glass; when Thor strikes there, the
    cup shatters.
  evidence_refs:
  - ev:15
  - ev:16
  - ev:17
  - ev:18
  confidence: medium
  cautions: This is extracted as a local pattern; the passage does not compare it
    with other hidden-vulnerability motifs.
- id: motif:4
  label: retrieval of a giant's vessel for divine drinking
  taxonomy_refs: []
  basis: Hymir challenges the visitors to bring out the kettle; Tyr cannot move it,
    Thor carries it away, and later brings it to the gods so they can drink ale at
    autumn-time.
  evidence_refs:
  - ev:19
  - ev:20
  - ev:25
  confidence: high
  cautions: The passage supports a vessel-retrieval pattern, but does not explicitly
    frame the action as theft, exchange, or covenant.
- id: motif:5
  label: giant pursuers emerging from caves
  taxonomy_refs: []
  basis: After Thor takes the kettle, he sees Hymir coming with a many-headed throng
    from caves in the east and then slays them with Mjollnir.
  evidence_refs:
  - ev:21
  - ev:22
  confidence: medium
  cautions: The exact identity of the many-headed throng is not stated in the supplied
