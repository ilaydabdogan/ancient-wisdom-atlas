  quote: ''
  summary: 'Bellows''s notes to Harbarthsljoth identify mythic places, cross-references,
    and narrative background: Valland and the dead, Thor''s refuge in Skrymir''s glove,
    a boundary river between gods and giants, berserkers as bear-transformers, Othin
    seeking knowledge from the dead, and identifications of Thor''s kin and Bifrost.'
  language: English
  quote_policy: summarized
