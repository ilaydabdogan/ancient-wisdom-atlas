canonical_text:
  quote: ''
  summary: The introductory note describes Vafthruthnismol as a mostly dialogic and
    encyclopedic Norse mythological poem. In the verse passage, Othin asks Frigg for
    counsel before going under the name Gagnrath to Vafthruthnir's hall to test the
    giant's wisdom. Vafthruthnir challenges the visitor, asks questions about the
    horses of day and night, the river between gods and giants, and the battlefield
    of Surt and the gods, and then proposes that their heads be wagered on the wisdom
    contest.
  language: English
  quote_policy: summarized
