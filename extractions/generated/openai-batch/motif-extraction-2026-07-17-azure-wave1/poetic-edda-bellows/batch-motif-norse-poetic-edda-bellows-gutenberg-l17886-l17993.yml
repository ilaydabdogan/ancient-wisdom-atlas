canonical_text:
  quote: ''
  summary: 'Editorial notes to the Second, or Old, Lay of Guthrun explain kennings,
    manuscript variants, speakers, and narrative references: a snake kenning, Hadding''s
    land as the world of the dead, a draught of forgetfulness, Guthrun''s dialogue
    with Grimhild, forced marriage to Atli, prophecies of revenge, travel to Atli''s
    home, Atli''s dreams, the deaths of Guthrun''s sons, and the poem''s damaged ending.'
  language: English
  quote_policy: summarized
