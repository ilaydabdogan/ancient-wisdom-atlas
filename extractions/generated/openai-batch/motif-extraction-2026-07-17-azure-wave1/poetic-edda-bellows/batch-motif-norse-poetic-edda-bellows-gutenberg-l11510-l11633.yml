canonical_text:
  quote: ''
  summary: The introductory note characterizes the first lay of Helgi Hundingsbane
    as a late, chiefly narrative Eddic poem that blends Helgi-tradition material with
    Volsung-cycle elements. The opening stanzas describe Helgi's birth in Bralund,
    the Norns shaping and weaving his fate, ravens speaking of the half-day-old armored
    child, his naming and receipt of lands and a blood-snake, his growth and generosity,
    his slaying of Hunding at fifteen, the sons of Hunding demanding compensation,
    and warriors moving toward battle at Logafjoll.
  language: English
  quote_policy: summarized
