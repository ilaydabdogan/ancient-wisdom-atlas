canonical_text:
  quote: "“Behold, ye warriors, well am I cleared / Of sin by the kettles sacred boiling.”"
  summary: The introductory note describes Guthrunarkvitha III as a Norse narrative
    lay with German story material centered on an ordeal by boiling water. In the
    poem, Herkja reports that Guthrun and Thjothrek were together, Atli accuses Guthrun
    of infidelity, Guthrun swears innocence and undergoes a hallowed boiling-kettle
    ordeal. Guthrun retrieves stones from the kettle unharmed and is declared cleared;
    Herkja is then tested, burned, and cast into a foul bog.
  language: English
  quote_policy: quoted
