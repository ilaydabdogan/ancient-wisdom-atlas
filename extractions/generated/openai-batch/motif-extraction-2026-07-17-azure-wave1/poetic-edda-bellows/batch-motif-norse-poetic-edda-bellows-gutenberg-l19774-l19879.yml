canonical_text:
  quote: ''
  summary: Guthrun and Hniflung harbor anger against Atli. Remembering Hogni, Guthrun
    urges vengeance, and Atli is fatally wounded by Hogni's son and Guthrun. As Atli
    dies, he and Guthrun exchange accusations about betrayal, marriage, wealth, kin-strife,
    and past campaigns. Atli asks for funeral honor; Guthrun promises a ship, coffin,
    and shroud, fulfills the promise after his death, and later seeks death herself.
    The passage closes by praising Gjuki's offspring and their enduring heroic fame.
  language: English
  quote_policy: summarized
