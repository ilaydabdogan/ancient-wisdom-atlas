canonical_text:
  quote: ''
  summary: Editorial notes to stanzas 46-69 of the Short Lay of Sigurth discuss manuscript
    variants and interpretive notes, including attendants killed and burned on Sigurth's
    funeral pyre, Brynhild's expectation that women follow her in death, her prophecy
    of later fates, the incorporation of Svanhild into the Sigurth-Guthrun legend,
    Gunnar's death, Guthrun's revenge on Atli, Svanhild's killing through Jormunrek's
    order, funerary accompaniment of slaves or beasts, and the gate of Hel or Valhall
    kept open for Sigurth's retinue.
  language: English
  quote_policy: summarized
