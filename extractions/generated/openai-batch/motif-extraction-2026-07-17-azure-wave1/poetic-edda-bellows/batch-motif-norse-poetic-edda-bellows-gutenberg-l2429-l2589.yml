canonical_text:
  quote: ''
  summary: The passage gives counsel to Loddfafnir on listening to old counsel, treating
    guests well, healing correspondences, and measured offerings. It then narrates
    the first-person speaker hanging nine nights on a windy tree, wounded by a spear
    and offered to Othin, taking up runes, receiving songs and mead, gaining wisdom,
    and listing rune knowledge and fourteen powerful songs or charms for healing,
    protection, restraint, fire-quenching, sea-calming, shape-revelation, battle safety,
    speaking with a hanged man, water-sprinkling protection, and knowledge of gods
    and elves.
  language: English
  quote_policy: summarized
