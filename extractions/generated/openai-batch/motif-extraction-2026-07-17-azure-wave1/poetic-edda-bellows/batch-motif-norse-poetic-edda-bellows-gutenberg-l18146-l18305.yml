canonical_text:
  quote: ''
  summary: The introductory note situates Oddrunargratr in the manuscript and in the
    Sigurth-Atli legendary cycle. The poem opens with Borgny unable to give birth
    until Oddrun, Atli's sister and Gunnar's beloved, rides to her, chants potent
    charms, and enables the birth of a boy and a girl. Borgny thanks holy powers and
    Oddrun; Oddrun says she acted because of an old oath to aid all. The exchange
    turns to past grievances and Oddrun begins recounting her own history, including
    her father's deathbed commands and Brynhild's fate.
  language: English
  quote_policy: summarized
