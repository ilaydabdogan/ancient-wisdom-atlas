canonical_text:
  quote: ''
  summary: 'Bellows''s notes identify figures and variant narrative materials associated
    with Oddrun''s Lament: Oddrun''s kinship with Atli and Brynhild, her skill in
    birth-runes, her love for Gunnar, obscure eastern geography, manuscript and speaker
    uncertainties, appeals to charms and healing/love deities, Brynhild''s Valkyrie
    association, variant accounts of Brynhild being given to Gunnar after a siege
    or won for him through a ring of flames, and references to marriage gold and Sigurth''s
    treasure from Fafnir.'
  language: English
  quote_policy: summarized
