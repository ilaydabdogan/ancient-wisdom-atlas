canonical_text:
  quote: ''
  summary: Skirnir offers Gerth a marvelous ring, then threatens her with a sword
    and with magical curses. He invokes gods and giants, writes runes of longing,
    madness, and lust, and says the writing can be undone. Gerth finally welcomes
    him with mead and appoints a meeting with Freyr at Barri after nine nights. Skirnir
    returns to Freyr, who laments the delay.
  language: English
  quote_policy: summarized
