canonical_text:
  quote: ''
  summary: Svipdag questions Fjolsvith about a flame-encircled hall, its makers, Lyfjaberg
    mountain, Mengloth's attendant maidens, and whether any man may reach Mengloth.
    Fjolsvith says only Svipdag is destined for her. Svipdag reveals himself, the
    gate and house open, Mengloth verifies his identity, welcomes him with a kiss,
    and declares that they will live together henceforth.
  language: English
  quote_policy: summarized
