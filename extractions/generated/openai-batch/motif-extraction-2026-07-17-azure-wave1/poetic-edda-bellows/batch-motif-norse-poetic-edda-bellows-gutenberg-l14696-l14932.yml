canonical_text:
  quote: ''
  summary: In a dying dialogue with Sigurth, Fafnir answers questions about fate,
    the Norns, and a future battle involving the gods and Surt; he recalls guarding
    gold with a fear-helm and venom, and warns that the gold and Regin will bring
    betrayal. Regin returns after Fafnir's death, cuts out the heart, drinks blood,
    and has Sigurth cook the heart. When Sigurth tastes Fafnir's heart-blood, he understands
    nut-hatches, which warn that Regin plans to betray him and advise violent prevention.
  language: English
  quote_policy: summarized
