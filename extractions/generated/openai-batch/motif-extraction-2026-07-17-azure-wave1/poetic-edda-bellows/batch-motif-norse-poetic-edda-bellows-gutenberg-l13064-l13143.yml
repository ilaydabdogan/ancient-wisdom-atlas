canonical_text:
  quote: ''
  summary: 'Introductory note explaining how Sinfjotli connects the Helgi and Volsung
    materials, summarizing his Volsungasaga background: Siggeir betrays Volsung''s
    family; a wolf devours Sigmund''s brothers; Signy helps Sigmund, changes form
    to conceive Sinfjotli, and later aids father and son when they are buried alive;
    Sigmund and Sinfjotli escape with the sword and burn Siggeir''s house. The note
    also describes the probable textual placement of the prose piece Of Sinfjotli''s
    Death before the Sigurth poems.'
  language: English
  quote_policy: summarized
