canonical_text:
  quote: ''
  summary: 'Editorial notes to the Lay of Thrym identify figures, kinships, objects,
    places, and textual variants connected with the poem: Thor and his hammer Mjollnir,
    Loki, Freyja and her feather-dress, Thrym the frost-giant, Brisings necklace,
    Heimdall, Thor''s goats and wagon, Jotunheim, Noatun, Sif, Vor, and hammer hallowing.
    The notes also report scholarly interpretations and comparisons, including the
    theft of Thor''s hammer as a possible winter-thunderstorm symbol and the hammer
    sign as comparable in sacred function to the Christian cross.'
  language: English
  quote_policy: summarized
