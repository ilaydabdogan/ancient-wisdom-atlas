canonical_text:
  quote: ''
  summary: At a giant bridal feast, Thrym boasts of wealth and his desire for Freyja.
    Thor consumes enormous quantities of food and mead while a wise serving-maid explains
    the suspicious behavior as Freyja's fasting, sleeplessness, and longing for Jotunheim.
    Thrym orders Mjollnir brought to hallow the bride; when Hlorrithi sees his hammer,
    he kills Thrym, the giants, and Thrym's sister, and Odin's son regains the hammer.
  language: English
  quote_policy: summarized
