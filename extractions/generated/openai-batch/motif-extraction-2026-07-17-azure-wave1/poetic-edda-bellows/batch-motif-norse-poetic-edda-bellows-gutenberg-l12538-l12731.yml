canonical_text:
  quote: The hill is open,   |   Helgi is come;
  summary: The passage moves from a warrior taunt to Helgi's marriage to Sigrun, Dag's
    sacrifice to Othin for vengeance, Othin's gift of a spear, and Dag's killing of
    Helgi. Sigrun curses Dag and rejects compensation. Helgi is commemorated by a
    hill and comes to Valhall, where Othin grants him authority. Later a maiden sees
    Helgi riding with dead men to his hill. Sigrun enters the opened hill, greets
    the lifeless Helgi, and prepares a bed so that she may sleep in the dead king's
    arms.
  language: English
  quote_policy: quoted
