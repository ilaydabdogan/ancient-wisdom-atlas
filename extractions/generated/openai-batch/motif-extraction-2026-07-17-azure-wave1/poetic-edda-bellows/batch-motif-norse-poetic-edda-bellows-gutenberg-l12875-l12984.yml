  label: Divine spear that makes victory certain
  taxonomy_refs: []
  basis: The prose note mentions Othin's spear as the weapon which made victory certain
    in connection with Helgi's death.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The editor says the annotator likely introduced this detail from Dag's
    statement blaming Othin.
