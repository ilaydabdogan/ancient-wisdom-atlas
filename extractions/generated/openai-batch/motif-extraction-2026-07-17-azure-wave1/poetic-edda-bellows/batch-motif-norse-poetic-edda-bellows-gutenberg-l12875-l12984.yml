  limitations: This is a textual-compositional comparison, not necessarily a claim
    of independent mythic parallel.
- id: claim:2
  claim: The note on the Gothmund-Sinfjotli dispute suggests that the composer of
    the first Helgi Hundingsbane lay probably borrowed directly from the poem of which
    the present dialogue is a fragment.
  claim_level: historical_contact
  target: Relationship between the present dialogue fragment and Helgakvitha Hundingsbana
    I
  evidence_refs:
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The wording is editorial inference; the passage itself also says the
    dialogue is misplaced and fragmentary.
