    lines are directly related to Helgakvitha Hundingsbana I, including quoted or
    nearly identical material.
  claim_level: linguistic_similarity
  target: Helgakvitha Hundingsbana I
  evidence_refs:
  - ev:1
  - ev:6
  - ev:8
  counter_evidence_refs: []
