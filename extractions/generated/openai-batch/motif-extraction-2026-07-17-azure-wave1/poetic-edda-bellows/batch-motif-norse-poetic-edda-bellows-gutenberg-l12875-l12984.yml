  quote: ''
  summary: Editorial notes to the Second Lay of Helgi Hundingsbane discuss manuscript
    structure, dependence on Helgakvitha Hundingsbana I, ambiguous names and terms,
    giantess wolf-mounts, Norns, a possibly interpolated Starkath stanza, a pre-battle
    dispute, Dag's killing of Helgi with blame assigned to Othin, oaths at Leipt and
    Uth's stone, mythical places, Helgi's horse, and a late Valhall tradition about
    Helgi sharing Othin's rule.
