candidate_motifs:
- id: motif:1
  label: Oath-bound kinsman kills hero under divine blame
  taxonomy_refs:
  - covenant
  basis: The notes connect Dag, Sigrun's brother, with prior loyalty oaths to Helgi,
    then describe Helgi's death at Dag's hands and Dag's blame of Othin.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:9
  - ev:10
  confidence: medium
  cautions: The passage is editorial commentary rather than a continuous primary narrative;
    Dag's name is said not to appear in the relevant verse, and some details are attributed
    to the annotator.
- id: motif:2
  label: Sacred oath by river and stone
  taxonomy_refs:
  - covenant
  basis: Leipt is identified as a river, Uth's sacred stone is mentioned, and Dag's
    spared life is explained through an oath of loyalty to Helgi.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The note says nothing further is known about Uth's sacred stone.
