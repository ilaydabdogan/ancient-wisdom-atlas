canonical_text:
  quote: ''
  summary: The introductory note describes the Rigsthula as an incomplete poem preserved
    in Codex Wormanius, explaining on a mythological basis the origins of social castes
    and praising kingship. It discusses possible Danish royal context, Celtic influence,
    and uncertainty over whether Rig should be identified with Heimdall or Othin.
    The narrative opening says a god named Heimdall went by a seashore, came to a
    dwelling, and called himself Rig. In the first stanzas, Rig travels, enters a
    dwelling where Ai and Edda sit by the hearth, speaks wisely, receives food from
    Edda, and lies down in bed with the two others on either side.
  language: English
  quote_policy: summarized
