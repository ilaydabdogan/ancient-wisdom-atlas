canonical_text:
  quote: ''
  summary: The introductory note describes the textual history of the second or old
    lay of Guthrun and relates it to Norse and German Sigurth traditions. In the narrative
    frame, King Thjothrek and Guthrun lament together at Atli's court. Guthrun recounts
    her early life, her marriage to Sigurth through Gjuki's gold, Sigurth's excellence,
    his killing by her brothers, Grani's return without his master, Hogni's report
    that Sigurth lies among wolves and carrion birds, Guthrun's curse-like reply,
    her silent grief beside Sigurth's body, her wish for death or burning, and her
    later journey from a mountain to Hoalf's hall, where she stays with Thora in Denmark.
  language: English
  quote_policy: summarized
