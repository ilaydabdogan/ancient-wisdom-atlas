canonical_text:
  quote: Near them were their swan-garments, for they were Valkyries.
  summary: The introductory note discusses the manuscript condition of the Vlundarkvitha
    and its relation to Weland/Wayland traditions, Deor's Lament, Saxon regions, the
    Thithrekssaga, and German swan-maiden tales. The prose narrative names King Nithuth
    of Sweden, his children, and three brothers, Slagfith, Egil, and Vlund, sons of
    a king of the Finns. The brothers settle at Ulfdalir by Lake Ulfsjar, find three
    Valkyrie women with swan-garments spinning flax at the shore, bring them home,
    and live with them for seven winters. The women then fly away to seek battles;
    Egil and Slagfith pursue two of them, while Vlund remains and is later seized
    by Nithuth. The first stanza describes maids from the south flying through Myrkwood,
    resting at the sea-shore, and spinning flax.
  language: English
  quote_policy: quoted
