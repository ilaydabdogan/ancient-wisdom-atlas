canonical_text:
  quote: ''
  summary: Hamther and Sorli come to Jormunrek's hall after seeing their sister's
    son on a tree. Jormunrek hears that helmed warriors have arrived and is reminded
    that he murdered their sister. In the hall, Jormunrek threatens to bind and hang
    them; fighting follows, and Hamther declares that Jormunrek's hands and feet have
    been thrown into hot fire. Jormunrek orders the brothers stoned because edged
    weapons will not harm them. Sorli and Hamther speak of bad counsel, the killing
    of their brother Erp, the Norns, and their impending deaths. Sorli and Hamther
    then fall at different parts of the house.
  language: English
  quote_policy: summarized
