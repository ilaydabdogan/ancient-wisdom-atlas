canonical_text:
  quote: ''
  summary: Vlund promises to repair broken gold and brings beer after which Bothvild
    sleeps. He declares that he has vengeance for his injuries, rises aloft, and Bothvild
    leaves the island weeping. Nithuth grieves his slain sons and asks what happened
    to them. Vlund first requires oaths that no harm will come to his wife, bride,
    or child, then reveals that he killed Nithuth's sons, hid parts of their bodies
    in the smithy, and fashioned their skulls, eyes, and teeth into precious objects
    given to Nithuth, Nithuth's wife, and Bothvild. Nithuth says no one can reach
    Vlund while he travels high in the clouds. Nithuth has Bothvild summoned, and
    she confirms that she was with Vlund on the island and could not resist his strength.
  language: English
  quote_policy: summarized
