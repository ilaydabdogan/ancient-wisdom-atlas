canonical_text:
  quote: ''
  summary: Guthrun weeps for the dead Sigurth, speaks of his greatness, blames the
    sons of Gjuki and Gunnar for broken oaths, and recalls Sigurth's journey to win
    Brynhild. Brynhild and Gollrond exchange accusations; Brynhild blames Atli and
    is described with fire in her eyes and venomous breath when she sees Sigurth's
    wounds. The prose aftermath says Guthrun departs to Denmark, while Brynhild refuses
    to live after Sigurth, has attendants slain, and kills herself with a sword.
  language: English
  quote_policy: summarized
