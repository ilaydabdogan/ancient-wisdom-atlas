  summary: Editorial notes to Baldrs Draumar identify Baldr’s parentage, death, and
    later return; explain figures and places including Sleipnir, Niflhel, Hel, Garm,
    Othin in disguise, Hoth, Rind, Vali, and Loki; and record manuscript uncertainties
    and parallels with other Eddic passages.
