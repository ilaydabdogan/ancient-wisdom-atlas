  summary: Editorial notes identify Loki as builder of a hall with help from nine
    dwarfs; discuss dwarf-name attestations and manuscript variants; explain Lyfjaberg
    as the Hill of Healing; infer Mengloth as a healing goddess possibly related to
    Frigg; note Eir as Mengloth's handmaiden and a healing figure; translate several
    names; and gloss Solbjart and the words of Urth.
