    armed scene appears near Logafjoll. Helgi encounters Sigrun, who says her father
    has pledged her to Hothbrodd; Helgi promises battle rather than her unwilling
    departure. He summons a host, assembles ships, departs by sea, and is aided by
    Sigrun from above when personified sea-powers threaten the fleet. The fleet arrives,
    and Sinfjotli and Gothmund exchange a flyting with accusations involving wolves,
    witchcraft, Valkyries, and giant-women.
