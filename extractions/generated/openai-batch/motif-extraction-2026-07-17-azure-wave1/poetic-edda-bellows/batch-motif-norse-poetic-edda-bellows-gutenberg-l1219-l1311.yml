canonical_text:
  quote: ''
  summary: 'Bellows''s notes summarize several Voluspo narrative elements: Loki''s
    robbery of Andvari and the cursed treasure; the creation of the first man and
    woman, Ask and Embla, by Othin, Hnir, and Lothur; Hnir''s survival after destruction;
    Lothur''s possible identity with Loki and gift of heat; Yggdrasil sustained by
    water from Urth''s well; the three Norns and runes governing destiny; the first
    war between the gods and the Wanes, including Gollveig''s ill-treatment; Heith
    as a wise-woman name; the Wanes'' victory and admission to worship; the rebuilding
    of Asgarth by a giant who demands the sun, moon, and Freyja; Loki''s delaying
    trick; Thor''s killing of the giant; and the gods'' oath-breaking as a cause of
    giant hostility in the final battle.'
  language: English
  quote_policy: summarized
