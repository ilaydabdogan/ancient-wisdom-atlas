canonical_text:
  quote: "“Behold, you are a dead man, because of the woman whom you have taken; for
    she is a man’s wife.”"
  summary: A footnote glosses Zoar as “little.” In Chapter 20, Abraham lives as a
    foreigner in Gerar and identifies Sarah, his wife, as his sister. Abimelech takes
    Sarah, but God warns him in a night dream that she is another man’s wife. Abimelech
    protests his innocence, God commands restoration, and Abraham is identified as
    a prophet whose prayer will preserve life. Abimelech restores Sarah with gifts
    and public vindication; Abraham prays, and God heals Abimelech’s household after
    Yahweh had closed its wombs because of Sarah.
  language: English
