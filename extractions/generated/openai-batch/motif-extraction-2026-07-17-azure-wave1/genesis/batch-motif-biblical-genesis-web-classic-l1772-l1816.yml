canonical_text:
  quote: ''
  summary: Isaac blesses Jacob, commands him not to marry Canaanite women, and sends
    him to Paddan Aram for a wife from his mother’s kin. Esau responds by taking an
    additional wife from Ishmael’s family. Jacob travels from Beersheba toward Haran,
    sleeps at a place using a stone as a headrest, dreams of a stairway between earth
    and heaven with angels ascending and descending, and hears Yahweh promise land,
    offspring, blessing, protection, and return. Jacob awakens, identifies the place
    as God’s house and heaven’s gate, sets up the stone as a pillar, pours oil on
    it, names the place Bethel, and vows loyalty and a tenth if God provides and returns
    him safely.
  language: English
  quote_policy: summarized
