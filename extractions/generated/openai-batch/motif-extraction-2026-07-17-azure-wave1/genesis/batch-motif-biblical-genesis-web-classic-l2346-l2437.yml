  summary: 'The passage includes footnotes explaining the names Benoni and Benjamin,
    then gives the generations of Esau/Edom: Esau’s wives and children, his move away
    from Jacob to Seir because their livestock and possessions were too great for
    one land, the chiefs descended from Esau, the Horite chiefs of Seir including
    Anah who found hot springs in the wilderness, and the kings and chiefs of Edom
    before Israelite kingship.'
