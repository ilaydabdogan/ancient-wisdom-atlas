canonical_text:
  quote: ''
  summary: A footnote defines the cubit. In Genesis 8, God remembers Noah and the
    living beings in the ship, the waters recede, the ship rests on Ararat’s mountains,
    and Noah sends out birds to test whether the waters have abated. When the earth
    is dry, God commands Noah, his household, and the animals to leave the ship and
    multiply. Noah offers burnt offerings, and Yahweh declares that he will not again
    curse the ground or strike every living thing, while regular earthly cycles continue.
  language: English
  quote_policy: summarized
