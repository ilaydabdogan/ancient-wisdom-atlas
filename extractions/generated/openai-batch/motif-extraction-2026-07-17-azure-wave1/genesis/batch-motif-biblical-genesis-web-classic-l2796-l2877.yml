canonical_text:
  quote: ''
  summary: Footnotes explain the sound-play of the names Manasseh and Ephraim. In
    Genesis 42, Jacob sends ten sons from famine-stricken Canaan to Egypt to buy grain,
    while keeping Benjamin at home. Joseph, now governor and grain seller in Egypt,
    recognizes his brothers when they bow before him, but they do not recognize him.
    He accuses them of spying, tests them by requiring Benjamin’s appearance, imprisons
    them briefly, binds Simeon, and sends the others away with grain, food for the
    journey, and their money restored in their sacks. The brothers fear the restored
    money and interpret their distress in relation to their earlier wrongdoing against
    Joseph. They return to Jacob, who laments Joseph and Simeon and refuses to risk
    Benjamin despite Reuben’s pledge.
  language: English
  quote_policy: summarized
