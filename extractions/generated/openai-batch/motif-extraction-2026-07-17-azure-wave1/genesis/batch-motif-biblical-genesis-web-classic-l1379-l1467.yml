canonical_text:
  quote: ''
  summary: 'Abraham, old and blessed by Yahweh, makes his senior servant swear to
    seek a wife for Isaac from Abraham’s relatives rather than from the Canaanites.
    The servant travels with camels and goods to the city of Nahor, waits at a spring,
    and prays for a sign: the appointed woman will offer water to him and to his camels.
    Rebekah arrives, draws water, fulfills the sign, receives gold ornaments, identifies
    herself as Abraham’s kin, and offers lodging. The servant worships Yahweh, and
    Laban invites him into the household, where the servant begins recounting his
    commission.'
  language: English
  quote_policy: summarized
