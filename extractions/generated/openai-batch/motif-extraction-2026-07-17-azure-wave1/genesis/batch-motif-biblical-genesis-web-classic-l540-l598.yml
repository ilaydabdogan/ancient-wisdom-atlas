  summary: Genesis 9 recounts God’s post-flood blessing and commands to Noah and his
    sons, the establishment of a covenant with Noah, his descendants, and living creatures,
    the rainbow as covenant sign, the naming of Noah’s sons and their role in populating
    the earth, Noah’s vineyard and drunken exposure, Ham’s report, Shem and Japheth’s
    covering of their father, Noah’s curse and blessings, and Noah’s later death.
