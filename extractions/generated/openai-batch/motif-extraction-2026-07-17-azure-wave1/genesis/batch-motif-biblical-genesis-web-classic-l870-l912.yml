canonical_text:
  quote: ''
  summary: Yahweh’s word comes to Abram in a vision. Abram asks about being childless
    and about knowing he will inherit the land. Yahweh promises an heir from Abram’s
    own body, offspring like the stars, and land for those offspring. Abram prepares
    divided animals as instructed. During sunset, deep sleep, terror, and darkness
    fall on Abram, and Yahweh foretells foreign servitude, judgment on the oppressing
    nation, later return, and Abram’s peaceful death. A smoking furnace and flaming
    torch pass between the pieces, and Yahweh makes a covenant granting land to Abram’s
    offspring.
  language: English
