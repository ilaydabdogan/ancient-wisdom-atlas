candidate_motifs:
- id: motif:1
  label: rival brothers and fratricide
  taxonomy_refs:
  - sibling_pair
  basis: Cain and Abel are brothers; Cain kills Abel in the field.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: high
  cautions: The taxonomy label captures the sibling-pair structure; the passage specifically
    presents conflict ending in fratricide.
- id: motif:2
  label: accepted and rejected offerings
  taxonomy_refs:
  - sacrifice
  basis: Both brothers bring offerings to Yahweh, but Abel and his offering are respected
    while Cain and his offering are not.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage uses the term offering; it does not explicitly use the term
    sacrifice for Cain’s or Abel’s act.
- id: motif:3
  label: divine warning before wrongdoing
  taxonomy_refs:
  - divine_judgment
  basis: Before Abel is killed, Yahweh warns Cain about anger, doing well, and sin
    crouching at the door.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is a warning motif within a larger divine-judgment sequence.
- id: motif:4
  label: blood crying from the ground
  taxonomy_refs: []
  basis: Yahweh says Abel’s blood cries to him from the ground after the killing.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No supplied taxonomy reference directly names this image.
- id: motif:5
  label: curse and exile of the killer
  taxonomy_refs:
  - divine_judgment
  - departure
  basis: Cain is cursed from the ground, loses agricultural yield, and becomes a fugitive
    and wanderer; he later leaves Yahweh’s presence.
  evidence_refs:
  - ev:8
  - ev:11
  confidence: high
  cautions: The passage frames the departure as punishment rather than a voluntary
    quest.
- id: motif:6
  label: protective mark for an offender
  taxonomy_refs:
  - divine_judgment
  basis: Yahweh appoints a sign for Cain so that those finding him will not strike
    him, while also declaring sevenfold vengeance against anyone who kills him.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not describe the physical form of the sign.
- id: motif:7
  label: city founding by an exile’s line
  taxonomy_refs:
  - culture_hero
  basis: Cain, after settling east of Eden, fathers Enoch and builds a city named
