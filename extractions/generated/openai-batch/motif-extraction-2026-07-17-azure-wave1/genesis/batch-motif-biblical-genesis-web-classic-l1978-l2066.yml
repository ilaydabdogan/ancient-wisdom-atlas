  summary: The supplied passage opens with a footnote glossing the name Joseph. In
    Genesis 31, Jacob hears hostility from Laban's sons, receives a divine command
    to return to his ancestral land, consults Rachel and Leah, leaves with family,
    livestock, and possessions, and flees toward Canaan. Rachel steals her father's
    teraphim. Laban pursues Jacob, receives a night dream warning from God, confronts
    Jacob in Gilead, and searches unsuccessfully for the stolen objects because Rachel
    hides them. Jacob then disputes Laban's accusations and recounts twenty years
    of difficult service, changed wages, and divine protection.
