canonical_text:
  quote: ''
  summary: Abraham's servant recounts how Rebekah fulfilled his water-drawing test
    at the spring, identifies her kinship, gives her jewelry, and praises Yahweh for
    guidance. Rebekah's household accepts the match as proceeding from Yahweh, receives
    gifts, asks Rebekah whether she will depart, and sends her with a blessing. Rebekah
    journeys by camel, meets Isaac, veils herself, and becomes his wife in Sarah's
    tent.
  language: English
