canonical_text:
  quote: ''
  summary: Joseph stores the food and grain from seven years of abundance in Egyptian
    cities. Before the famine, Asenath bears him two sons, whom he names Manasseh
    and Ephraim with explanations referring to God, toil, his father’s house, fruitfulness,
    and affliction. The seven years of plenty end and seven years of famine begin;
    famine affects all lands, but Egypt has bread. Egyptians cry to Pharaoh for bread,
    Pharaoh sends them to Joseph, and Joseph opens the storehouses and sells grain
    to Egyptians and to people from all countries.
