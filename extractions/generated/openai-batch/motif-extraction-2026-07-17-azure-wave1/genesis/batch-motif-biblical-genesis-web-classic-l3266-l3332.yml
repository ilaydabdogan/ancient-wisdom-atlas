  - ev:10
  - ev:11
  confidence: medium
  cautions: This groups multiple abundance images in the passage; their precise theological
    or ritual function is not stated.
- id: motif:6
  label: Ancestral burial cave and being gathered to one's people
  taxonomy_refs: []
  basis: Jacob requests burial with his fathers in the Machpelah cave, where named
