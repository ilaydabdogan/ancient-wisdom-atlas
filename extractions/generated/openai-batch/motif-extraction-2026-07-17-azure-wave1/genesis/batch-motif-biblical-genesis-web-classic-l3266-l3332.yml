candidate_motifs:
- id: motif:1
  label: Father's future-oriented blessings over sons or tribes
  taxonomy_refs: []
  basis: Jacob gathers his sons to tell what will happen in days to come; the passage
    later summarizes the sayings as blessings over the twelve tribes.
  evidence_refs:
  - ev:1
  - ev:13
  confidence: high
  cautions: The passage itself frames the speeches as blessings, but no supplied taxonomy
    family directly matches patriarchal blessing.
- id: motif:2
  label: Royal authority assigned to Judah
  taxonomy_refs:
  - royal_legitimacy
  basis: Judah is associated with brothers bowing, a hand on enemies, a scepter, a
    ruler's staff, and obedience of peoples.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The extraction records the royal imagery within the passage; later messianic
    or dynastic interpretations are not assumed here.
- id: motif:3
  label: Tribal destinies expressed through animal images
  taxonomy_refs: []
  basis: 'Several sayings use animals or creatures for tribal figures: Judah as lion,
    Issachar as donkey, Dan as serpent, Naphtali as doe, and Benjamin as wolf.'
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  - ev:9
  - ev:12
  confidence: high
  cautions: Only the animal imagery present in this passage is recorded; no broader
    totemic system is inferred.
- id: motif:4
  label: Serpent ambush on the path
  taxonomy_refs:
  - serpent
  basis: Dan is compared to a serpent or adder on the trail that bites a horse's heels
    and causes the rider to fall backward.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage uses the serpent as a comparison for Dan; it does not explicitly
    connect this image to other serpent narratives.
- id: motif:5
  label: Fruitfulness and abundance blessing
  taxonomy_refs: []
  basis: Judah's saying includes vine, wine, grape, and milk imagery; Joseph's blessing
    includes a fruitful vine by a spring and blessings of heaven, deep, breasts, womb,
    and hills; Asher is linked with rich food.
  evidence_refs:
  - ev:5
