  quote: ''
  summary: Genesis 35 recounts God's command for Jacob to go to Bethel, Jacob's household
    purification and disposal of foreign gods, travel to Bethel under divine terror,
    altar and pillar rites, God's renewed appearance and renaming of Jacob as Israel
    with promises of descendants and land, Rachel's death in childbirth and burial
    marker, a notice about Reuben and Bilhah, the list of Jacob's twelve sons, and
    Isaac's death and burial by Esau and Jacob.
  language: English
