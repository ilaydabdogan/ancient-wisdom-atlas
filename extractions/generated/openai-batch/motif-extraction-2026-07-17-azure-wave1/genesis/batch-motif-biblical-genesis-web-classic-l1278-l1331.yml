canonical_text:
  quote: ''
  summary: Footnotes gloss the names Isaac and Beersheba. In Genesis 22, God tests
    Abraham by commanding him to take Isaac to Moriah and offer him as a burnt offering
    on a specified mountain. Abraham travels with Isaac and two young men, leaves
    the young men behind, ascends with Isaac, fire, wood, and knife, binds Isaac on
    an altar, and is stopped by Yahweh’s angel. Abraham then offers a ram caught in
    a thicket instead of Isaac, names the place “Yahweh Will Provide,” receives a
    renewed divine oath of blessing, returns to Beersheba, and is later told of Nahor’s
    descendants including Rebekah.
  language: English
  quote_policy: summarized
