canonical_text:
  quote: ''
  summary: 'Genesis 1 narrates God creating the heavens and the earth and ordering
    a formless, dark, watery initial state over six days: light and darkness, sky,
    land and seas, vegetation, celestial lights, aquatic and airborne creatures, land
    animals, and humankind. God blesses living creatures and humans, gives humans
    dominion and plant food, and sees all that was made as very good.'
  language: English
  quote_policy: summarized
