  quote: ''
  summary: The passage includes a footnote explaining Isaac’s name, then narrates
    Yahweh’s appearance to Abraham by the oaks of Mamre. Abraham receives three men
    with hospitality, offering water, rest, bread, cakes, butter, milk, and a calf.
    A son is promised to aged Sarah, who laughs and then denies laughing. Yahweh speaks
    of Abraham’s future and of investigating the outcry against Sodom and Gomorrah.
    Abraham questions whether the righteous will be destroyed with the wicked and
    negotiates mercy for the city down to ten righteous persons.
