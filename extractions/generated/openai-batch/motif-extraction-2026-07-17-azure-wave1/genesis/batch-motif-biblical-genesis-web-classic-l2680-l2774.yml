canonical_text:
  quote: ''
  summary: Pharaoh dreams two paired dreams involving seven fat cattle consumed by
    seven thin cattle and seven full grain heads swallowed by seven thin, wind-blasted
    grain heads. Egypt's magicians cannot interpret the dreams. The cup bearer recalls
    Joseph, who is brought from the dungeon. Joseph attributes interpretation to God,
    explains the dreams as seven years of plenty followed by seven years of severe
    famine, and advises storing grain during the abundant years. Pharaoh recognizes
    Joseph as wise and filled with the Spirit of God, appoints him over Egypt, gives
    him royal insignia and honors, renames him, gives him Asenath as wife, and Joseph
    administers the land as the years of plenty begin.
  language: English
  quote_policy: summarized
