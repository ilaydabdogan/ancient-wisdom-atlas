    and blesses them. He knowingly places his right hand on the younger Ephraim rather
    than the firstborn Manasseh, refuses Joseph's correction, predicts Ephraim's greater
    future, and gives Joseph an extra portion while announcing that God will bring
    him back to the land of his fathers.
