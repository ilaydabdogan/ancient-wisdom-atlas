  summary: People sharing one language settle in Shinar, plan to build a brick city
    and a tower reaching to the sky, and seek to make a name for themselves so they
    will not be scattered. Yahweh comes down, confuses their language, scatters them
    over the earth, and the place is called Babel. The passage then traces a genealogy
    from Shem to Terah and introduces Terah’s family, Sarai’s barrenness, the departure
    from Ur toward Canaan, the settlement in Haran, and Terah’s death.
