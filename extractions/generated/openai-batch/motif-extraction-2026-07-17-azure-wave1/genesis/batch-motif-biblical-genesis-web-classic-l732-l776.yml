canonical_text:
  quote: ''
  summary: A footnote gives an alternate LXX reading for Genesis 11:2. In Genesis
    12, Yahweh commands Abram to leave his homeland and go to a land to be shown,
    promises blessing, a great nation, and blessing for all families of the earth
    through him. Abram departs Haran with Sarai, Lot, possessions, and acquired people,
    enters Canaan, receives a land promise at Shechem, builds altars, and travels
    south. Because of famine he goes to Egypt, asks Sarai to identify herself as his
    sister, and she is taken into Pharaoh’s house. Pharaoh benefits Abram, but Yahweh
    afflicts Pharaoh and his house with plagues; Pharaoh rebukes Abram and sends him
    away with Sarai and all he has.
  language: English
  quote_policy: summarized
