candidate_motifs:
- id: motif:1
  label: famine-driven departure and return for food
  taxonomy_refs:
  - departure
  - return
  basis: The severe famine and exhausted grain compel Israel to send the men back
    down to Egypt to buy food.
  evidence_refs:
