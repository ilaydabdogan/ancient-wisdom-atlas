  - ev:5
  - ev:6
  confidence: high
  cautions: The passage presents a practical survival journey; it does not by itself
    frame the journey as cosmic or initiatory.
- id: motif:2
  label: brother required as condition of access
  taxonomy_refs:
  - sibling_pair
  basis: The men cannot see the powerful man’s face unless their brother is with them,
    so Benjamin becomes the required companion for the return journey.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: high
  cautions: The role is embedded in family and political negotiation rather than a
    standalone sibling-pair myth.
- id: motif:3
  label: surety pledge for a vulnerable younger kin member
  taxonomy_refs:
  - sibling_pair
  basis: Judah pledges himself as collateral for Benjamin and accepts blame if he
    does not return him to Israel.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The taxonomy link is based on sibling responsibility; the passage does
    not use a fixed ritual formula for surety.
- id: motif:4
  label: gift, money, and divine mercy before a powerful host
