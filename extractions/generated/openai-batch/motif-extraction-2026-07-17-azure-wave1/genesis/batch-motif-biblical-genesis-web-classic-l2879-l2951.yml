canonical_text:
  quote: ''
  summary: A footnote defines Sheol as the place of the dead. In Genesis 43, severe
    famine drives Israel’s sons to seek more food in Egypt. Judah pledges responsibility
    for Benjamin, Israel sends Benjamin with gifts and double money, and the brothers
    return to Joseph. Joseph orders a meal, the brothers fear enslavement over the
    returned money, the steward reassures them and releases Simeon. Joseph receives
    their gift and homage, asks about their father, blesses Benjamin, privately weeps,
    then hosts a separated banquet where the brothers are seated by birth order and
    Benjamin receives a fivefold portion.
  language: English
  quote_policy: summarized
