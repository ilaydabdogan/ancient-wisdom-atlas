  summary: Israel/Jacob travels to Beersheba, offers sacrifices, receives a night
    vision in which God tells him not to fear going down into Egypt and promises to
    make him a great nation, accompany him, and bring him up again. Jacob’s household,
    livestock, and goods move into Egypt; the passage lists descendants and totals
    the house of Jacob at seventy souls. Judah goes ahead to Goshen; Joseph meets
    his father there, and Joseph instructs his family how to speak to Pharaoh about
    their occupation as livestock keepers.
