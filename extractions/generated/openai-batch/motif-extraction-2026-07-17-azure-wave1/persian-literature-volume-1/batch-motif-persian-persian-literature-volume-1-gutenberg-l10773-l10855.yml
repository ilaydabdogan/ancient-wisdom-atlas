canonical_text:
  quote: ''
  summary: Lohursp is described as a just and paternal king. His son Gushtsp, feeling
    excluded from succession because of lineage politics, first marches toward Hindustan
    with horsemen, then returns after Zarr’s persuasion on condition of being named
    heir. When Lohursp does not favor his claim, Gushtsp flees alone to Rum, suffers
    poverty, seeks work, breaks a blacksmith’s anvil with one blow, is driven away,
    and later receives food and shelter from a husbandman of Kainian descent. Gushtsp
    and the husbandman recognize shared ancestry and live together until Gushtsp’s
    fortune and Heaven’s favor begin to appear.
  language: English
  quote_policy: summarized
