canonical_text:
  quote: ''
  summary: After Ks is imprisoned, Afrsiyb invades and conquers Irn. Rustem learns
    of the crisis, demands the prisoners' release from the king of Hmvern, marches
    to Hmvern, defeats the combined forces of Hmvern, Misser, and Berberistn, captures
    opposing rulers, and accepts terms restoring Ks and his warriors to liberty.
  language: English
  quote_policy: summarized
