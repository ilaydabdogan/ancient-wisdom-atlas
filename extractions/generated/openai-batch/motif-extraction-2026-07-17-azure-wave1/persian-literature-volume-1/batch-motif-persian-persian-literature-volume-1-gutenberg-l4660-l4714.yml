canonical_text:
  quote: ''
  summary: Ks defeats the King of Hmvern, seeks marriage with the king’s daughter
    Sdveh, and marries her after her father reluctantly agrees. The King of Hmvern
    later invites Ks as a guest despite Sdveh’s warning, entertains him for seven
    days, then has soldiers seize Ks and his warriors and imprison them in a remote
    fortress on a high mountain. Sdveh refuses separation from her husband and is
    sent to the same dungeon. The passage closes with a reflection on worldly fickleness
    and treachery among kin.
  language: English
  quote_policy: summarized
