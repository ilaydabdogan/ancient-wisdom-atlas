canonical_text:
  quote: ''
  summary: Rdbeh and Zl arrange a secret evening meeting through Rdbeh's attendants.
    Rdbeh lowers her long hair from a balcony so Zl can climb to her, and the two
    exchange vows while remaining mindful of paternal and royal disapproval. Zl then
    consults advisers about marriage; they object because Rdbeh's family is linked
    to Zohk the serpent-king. Sm consults astrologers, who predict a prosperous union
    and a mighty son, and he gives conditional approval. A female emissary carrying
    messages and gifts is later detected by Rdbeh's mother, Sndokht.
  language: English
  quote_policy: summarized
