- id: obs:2
  text: Rdbeh is anxious to know Zl's appearance, and her attendants arrange for him
    to come after sunset to a secluded, richly decorated rural retreat where she waits
    in splendid dress.
  category: sequence
  evidence_refs:
  - ev:1
