canonical_text:
  quote: ''
  summary: Failaks crowns Sikander, appoints Arist as vizir, and gives moral counsel.
    After Dr demands customary tribute, Sikander rejects Persian superiority, threatens
    war, enters the Persian camp disguised as an envoy to inspect the enemy, keeps
    four cups from Dr's table, escapes after being recognized, defeats Dr, takes the
    capital, and consolidates rule by claiming Persian inheritance and descent from
    Drb.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Failaks places the crown of sovereignty on Sikander, appoints Arist as vizir,
    and counsels Sikander toward virtue, humility, justice, mercy, and attention to
    advice.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Dr sends an envoy to Sikander to claim the customary tribute; Sikander replies
    that Rm no longer acknowledges Persian superiority, demands tribute from Dr, and
    threatens invasion and wider conquest.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the armies come into sight on the Persian frontier, Sikander enters the
    Persian camp in the assumed character of an envoy in order to learn the enemy's
    condition.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Dr is struck by the envoy's commanding appearance and asks whether he is Sikander;
    the envoy denies having such rank.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Dr's table, the envoy drinks from cups but does not return them, explaining
    that his country does not take back a cup once placed in an ambassador's hands;
    he keeps four cups.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: An unnamed person at the feast recognizes Sikander and informs Dr; Sikander
    notices the change, takes the four cups, mounts his horse, and escapes by night.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:7
  text: Sikander displays the four golden cups to Aristtals and his courtiers as objects
    taken from his enemy's table and says he has learned the enemy's strength and
    numbers.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The armies fight for seven days without decision; on the eighth day Dr flees,
