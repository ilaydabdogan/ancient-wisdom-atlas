canonical_text:
  quote: ''
  summary: At night Rustem receives the king's permission to reconnoiter the opposing
    camp in Turkish disguise. He observes Sohrab's banquet, is detected by Zinda-ruzm,
    and kills him unseen. Sohrab discovers his guardian's body, mourns, vows revenge,
    and resumes the feast. Rustem reports Sohrab's stature and splendor to the monarch.
    At dawn Sohrab arms himself and compels the captive Hujir to identify the leaders
    of the Persian host, beginning with the royal pavilion of Ks.
  language: English
  quote_policy: summarized
