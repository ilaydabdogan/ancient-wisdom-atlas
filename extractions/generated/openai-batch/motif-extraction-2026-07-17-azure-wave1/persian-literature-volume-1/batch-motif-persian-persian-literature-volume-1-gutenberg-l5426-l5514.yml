  summary: An insidious ruler sends forces and royal gifts to Sohrb while ordering
    his chiefs to conceal Sohrb's relationship to Rustem, hoping father and son will
    fight as enemies. Sohrb accepts the embassy, marches toward Persia, and at a barrier-fort
    defeats Hujr in single combat, sparing his life but sending him bound to Hmn.
