canonical_text:
  quote: ''
  summary: Kai-ks inherits the throne, falls into pride and luxury, and is lured by
    a Demon disguised as a musician who praises Mzindern. Kai-ks resolves to invade
    the demon-associated land despite the alarm of his warriors and the warning counsel
    of Zl. He leaves the realm under delegated care and sends Gw with two thousand
    men into Mzindern, where they burn, destroy, and kill indiscriminately under the
    king's order.
  language: English
