canonical_text:
  quote: ''
  summary: Hma rules prosperously, secretly bears a son, publicly declares him dead,
    and has him placed in a box and cast into the Euphrates. A washerman and his wife
    find and foster the child, naming him Drb. As he grows, Drb shows unusual ability,
    rejects menial work, trains as a warrior, learns the story of his discovery, and
    keeps one ruby from the box. When Hma musters forces against Rm, Drb joins; Hma
    sees his royal bearing and feels a brief maternal stirring.
  language: English
  quote_policy: summarized
