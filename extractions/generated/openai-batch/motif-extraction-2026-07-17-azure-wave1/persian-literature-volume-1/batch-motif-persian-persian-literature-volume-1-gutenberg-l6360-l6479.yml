  summary: Hujr refuses to guide Sohrab to Rustem's tent, preferring death to betraying
    the Persian host. Sohrab arms himself, attacks the Persian center, challenges
    Kai-Ks, and seeks Rustem. Kai-Ks calls for Rustem, who arms with Rakush, leopard
    skin, regal girdle, and dragon banners. Rustem and Sohrab withdraw toward single
    combat; Rustem praises the youth and Sohrab asks whether he is Rustem, but Rustem
    denies the identity.
