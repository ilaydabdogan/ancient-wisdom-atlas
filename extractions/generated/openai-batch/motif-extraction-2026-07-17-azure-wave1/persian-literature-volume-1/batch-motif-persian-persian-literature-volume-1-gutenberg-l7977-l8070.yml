canonical_text:
  quote: ''
  summary: Afrsiyb learns that his realm has been plundered and vows vengeance. Rustem
    has sent agents to seek Kai-khosru. Gdarz dreams that the young prince reveals
    his location and that Gw is destined to restore him to his birth-right. Gw undertakes
    a difficult secret journey, finds Kai-khosru at a fountain, verifies his royal
    identity by recognition and a bodily mark, reunites him with his mother Ferangs,
    obtains horses including Behzd, and escorts the fugitives toward Irn. Afrsiyb
    sends Kulbd with three hundred horsemen after them, but Gw defeats the pursuers
    and the three travellers continue through the wilderness.
  language: English
  quote_policy: summarized
