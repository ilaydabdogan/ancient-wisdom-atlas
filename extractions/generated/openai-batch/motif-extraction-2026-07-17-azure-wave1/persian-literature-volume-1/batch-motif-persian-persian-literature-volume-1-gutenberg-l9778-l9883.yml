canonical_text:
  quote: My mother has never mentioned his name, and my birth is wrapped in mystery.
  summary: After his defeat, Afrsiyb meets the huge Barz, whose father and birth are
    unknown. Afrsiyb recruits him against Rustem with promises of marriage, rule,
    gifts, and command. Barz ignores his mother's warnings about Rustem, receives
    rapid martial training, is acclaimed as inhumanly formidable, and is sent with
    horsemen toward conflict with Rustem and Kai-khosru.
  language: English
  quote_policy: quoted
