canonical_text:
  quote: ''
  summary: Gushtsp, while outwardly promising the crown to Isfendiyr, makes the transfer
    conditional on Isfendiyr subduing Rustem. Isfendiyr rebukes his father for broken
    promises, recalls his Heft-khan trials and conquest of Arjsp, and resists the
    command to attack Rustem because of Rustem's past loyalty and hospitality. Gushtsp
    persists and orders Rustem to be bound and brought before him; Isfendiyr remains
    reluctant.
  language: English
  quote_policy: summarized
