canonical_text:
  quote: ''
  summary: Afrsiyb sends gifts and news to Saiwush through Gerswaz, whose jealousy
    of Saiwush grows after a perceived slight. Gerswaz returns to Afrsiyb and accuses
    Saiwush of ambition and potential rebellion. Afrsiyb initially doubts the accusation
    but is persuaded to summon Saiwush by deception. Saiwush is ready to obey, but
    Gerswaz privately counsels delay; Saiwush delays under a pretext involving Ferangs.
    Afrsiyb treats the delay as proof of disloyalty, raises an army under Gerswaz,
    and moves against Saiwush. Ferangs advises Saiwush to flee to Irn; unable to accompany
    him because of her condition, she tells him to save himself. Saiwush leaves with
    three hundred Irnians and asks that a son, if born, be named Kai-khosru.
  language: English
  quote_policy: summarized
