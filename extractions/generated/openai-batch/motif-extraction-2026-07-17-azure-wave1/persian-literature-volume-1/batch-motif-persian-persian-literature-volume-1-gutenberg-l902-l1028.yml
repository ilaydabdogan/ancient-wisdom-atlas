canonical_text:
  quote: ''
  summary: Mirts, a charitable Arab king, gives milk to the poor and receives divine
    favor. His son Zohk is approached by Ibls, who appears in disguises, binds him
    by oath, and induces him to kill his father and usurp the throne. Ibls then wins
    influence through cooking, requests a kiss on Zohk's shoulder, and causes two
    black serpents to spring from the touched place. Returning as a physician, Ibls
    prescribes human brains as the serpents' food, intending destruction among humankind.
  language: English
  quote_policy: summarized
