canonical_text:
  quote: ''
  summary: After Gushtsp crowns Isfendiyr as successor, he urges him to conquer other
    lands. Zerdusht encourages these campaigns as a means of spreading the new religion
    and the Zendavesta. Isfendiyr succeeds abroad, but Gurzam maliciously accuses
    him to Gushtsp of planning rebellion. Summoned by his angry father, Isfendiyr
    obeys despite foreboding. Gushtsp receives him with accusations and orders him
    chained in a tower-prison on a mountain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gushtsp crowns Isfendiyr as his successor and tells him to pursue conquest
    rather than peace and private gratification.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zerdusht recommends that Isfendiyr subdue kingdoms so that the new religion
    may be diffused and the world enlightened.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Isfendiyr invades Rm; its sovereign lacks the means to resist and accepts
    the faith of Zerdusht and the Zendavesta as spiritual instructor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Isfendiyr also invades Hindstn, Arabia, and other countries, establishing
    the religion of the fire-worshippers in them.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: Isfendiyr sends letters to Gushtsp reporting the success of disseminating
    Zerdusht's religion and asking what further enterprises require his aid.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Gurzam, secretly hostile to Isfendiyr, tells Gushtsp that Isfendiyr commands
    a great army and intends to take Balkh and imprison his father.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:7
  text: Gushtsp becomes distressed by Gurzam's accusations, drinks wine for three
    days without sleep or rest, and then sends Jamsp with a letter summoning Isfendiyr.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Isfendiyr tells Jamsp that he has dreamed his father is angry with him, and
    Jamsp confirms that Gushtsp is indeed angry.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Isfendiyr asks what crime he has committed, cites his spreading of the Zendavesta
    and his conquests for Gushtsp, and wonders whether a demon has changed his father's
    disposition.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Jamsp advises Isfendiyr that a son should not disobey his father and that
    Gushtsp is both king and father.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Isfendiyr consents to go, appoints Bahman to command the army during his absence,
    and takes his other three sons with him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Before Isfendiyr arrives at Balkh, Gushtsp has arranged measures to secure
    him as a prisoner while preserving an appearance of justice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Gushtsp accuses Isfendiyr of excessive ambition and of usurping authority,
    while Isfendiyr replies that he remains Gushtsp's servant and at his command.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: Gushtsp's courtiers answer that such a son should be executed or bound in
