canonical_text:
  quote: ''
  summary: Two lyric passages speak in a Hafizian voice. The first urges a companion
    to cast off deceptive religious garb, favor wine over convent wealth, act drunkenly,
    unveil Fate's hidden mystery, and restrain boastful overreach. The second declares
    servitude to Love, freedom from both worlds, descent from heaven into earthly
    confinement through Adam, preference for the beloved's street over paradise, and
    tears that threaten to overwhelm the speaker.
  language: English
  quote_policy: summarized
