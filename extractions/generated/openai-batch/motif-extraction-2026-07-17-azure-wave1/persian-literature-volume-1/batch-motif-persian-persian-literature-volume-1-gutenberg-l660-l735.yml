canonical_text:
  quote: ''
  summary: The passage presents Kaimers as the first Persian lawgiver and monarch,
    dwelling in the mountains and ruling with animals obedient to him. His beloved
    son Saimuk is killed in battle against a demonic enemy. After Kaimers grieves,
    a mysterious voice urges renewed war. Saimuk's son Hsheng, characterized by knowledge
    and goodness, leads the army with the aid of animals, kills the Demon and his
    offspring by God's blessing, and later ascends the throne after Kaimers dies.
  language: English
