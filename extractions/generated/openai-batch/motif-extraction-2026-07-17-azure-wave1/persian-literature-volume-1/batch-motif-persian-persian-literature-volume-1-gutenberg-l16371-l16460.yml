  quote: ''
  summary: Three lyric sections admonish against religious fraud, praise wine, gracious
    action, divine efficacy, and purity; describe angels and unseen spirits at a wine-house
    shaping Adam’s clay and pouring wine with a mortal; and repeatedly counsel despairing
    figures to hope through images of Joseph’s return, spring renewal, pilgrimage
    to the Ka'bah, Noah’s ark amid death-flood, divine oversight, prayer, and the
    Koran.
  language: English
  quote_policy: summarized
