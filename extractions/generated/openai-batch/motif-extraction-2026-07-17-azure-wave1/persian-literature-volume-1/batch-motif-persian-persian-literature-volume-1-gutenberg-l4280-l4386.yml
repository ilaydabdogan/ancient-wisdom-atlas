canonical_text:
  quote: ''
  summary: In the fourth stage of Rustem's journey, he enters an enchanted green place,
    encounters magically appearing food, wine, and music, and kills a demon who had
    approached him disguised as a beautiful sorceress. In the fifth stage, he crosses
    a region of darkness, lets Rakush find the way, quarrels with a forest keeper,
    defeats Ald's force, captures Ald, and compels him to reveal the route to king
    Ks and the White Demon's realm. Ald describes mountains, deep caves, night-watching
    demons, a desert, and a guarded stream. Rustem follows Ald to Mzindern, sees fires
    and lamps, binds Ald to a tree, and sleeps.
  language: English
  quote_policy: summarized
