canonical_text:
  quote: ''
  summary: A fort governor reports Sohrab's siege to King Kai-Kaus, sends a messenger,
    and escapes by night with the warrior maid and other heroes. At dawn Sohrab finds
    the fortress empty and laments the missing warrior maid. Haman rebukes his lovesickness
    and urges him back toward conquest. Sohrab renews his ambition and declares that
    Afrasiyab shall rule Persia. Afrasiyab is pleased, while Kai-Kaus gathers his
    chiefs and sends to summon Rustem.
  language: English
  quote_policy: summarized
