canonical_text:
  quote: ''
  summary: 'Zohk dreams that three warriors overpower him, and court wise men interpret
    the vision as foretelling his death and replacement by Feridn, whose father’s
    blood will be avenged. Zohk responds with persecution: Abtn is killed, while Farnuk
    flees with infant Feridn, who is nourished first by a charitable cow and pasture
    keeper, then removed to Mount Alberz. Zohk destroys the pasture refuge but fails
    to find the child; a dervish on Alberz fosters and teaches Feridn, declaring him
    the foretold destroyer of Zohk and future monarch.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zohk dreams that three warriors attack him; the youngest strikes his head
    with a mace, binds his hands, puts a rope around his neck, and drags him before
    crowds.
