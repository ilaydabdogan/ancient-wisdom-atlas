canonical_text:
  quote: The glorious standard of Kavah streamed upon the breeze.
  summary: Kai-kobd is enthroned by a council of warriors, arrays his army against
    Afrsiyb, and a great battle follows. Rustem confronts Afrsiyb, unhorses him, takes
    his crown and broken girdle, and becomes the decisive force in the rout of the
    Trnian army. Afrsiyb reports Rustem's strength to Poshang, who sends Wsah with
    gifts and peace proposals invoking kinship, prior vengeance, Feridn's decree,
    and the Jihn as a boundary.
  language: English
  quote_policy: quoted
