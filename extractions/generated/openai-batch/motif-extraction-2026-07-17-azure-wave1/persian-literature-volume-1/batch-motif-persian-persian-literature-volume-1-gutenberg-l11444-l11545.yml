candidate_motifs:
- id: motif:1
  label: Imprisoned prince released as necessary deliverer
  taxonomy_refs: []
  basis: Isfendiyr is confined in a mountain prison and chains; after Gushtsp's defeat,
    Jamsp says recovery is possible through Isfendiyr alone, leading to his release
    and appointment to command.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:10
  confidence: high
  cautions: The passage stops at Isfendiyr's restoration and does not narrate the
    subsequent deliverance in this excerpt.
- id: motif:2
  label: Royal repentance and restored legitimacy
  taxonomy_refs:
  - royal_legitimacy
  basis: Gushtsp asks pardon for wronging Isfendiyr, promises the crown, then resigns
    the throne to him and gives him command of the imperial armies.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: high
  cautions: The record only captures the restoration scene within this line range.
- id: motif:3
  label: Astrological counsel determines the path to recovery
  taxonomy_refs:
  - wisdom
  basis: Gushtsp consults Jamsp about what the stars foretell, and Jamsp identifies
    Isfendiyr as the sole means of recovery.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage reports the consultation but does not explain Jamsp's method
    beyond reference to the stars.
- id: motif:4
  label: Sacred text and sanctuary destroyed by conqueror
  taxonomy_refs: []
  basis: Kahram captures Balkh, destroys the Gubers' places of worship, kills the
    altar keeper, and burns the Zendavesta.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No wider doctrinal or ritual interpretation is supplied in the passage.
- id: motif:5
  label: Retired devout king compelled back to battle and slain
  taxonomy_refs: []
  basis: Lohursp has abandoned earthly concerns for devotion to God, but the people
    draw him from prayer to command a small force; he is defeated and killed.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Because he is compelled by the people, this is not coded as a voluntary
    sacrifice motif.
- id: motif:6
  label: Conversion under royal pressure
  taxonomy_refs: []
  basis: Rustem receives the Zendavesta and adopts the new faith, but the passage
    reports common opinion that fear of Gushtsp induced him to do so.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The statement is attributed to common report, and the passage does not
    verify Rustem's internal motive.
- id: motif:7
  label: Punishment of malicious counselor before the wronged prince
  taxonomy_refs:
  - divine_judgment
  basis: Gurzam is identified as the counselor whose malice led to Isfendiyr's injury;
    he is executed in Isfendiyr's presence after the reconciliation.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: medium
  cautions: The passage frames the punishment as just, but it is carried out by royal
    order rather than by an explicitly divine agent.
