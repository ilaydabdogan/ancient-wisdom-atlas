canonical_text:
  quote: ''
  summary: Gushtsp leaves Isfendiyr confined in a mountain prison and visits Sstn,
    where Rustem accepts the Zendavesta and the faith of Zerdusht. Bahman hears of
    Isfendiyr's imprisonment and returns to Balkh. Arjsp sends Kahram against the
    unprotected city; Lohursp is drawn from religious retirement to lead a small defense
    and is killed. Kahram captures Balkh, destroys Guber worship sites, kills the
    altar keeper, and burns the Zendavesta. A woman from Gushtsp's household escapes
    to report the disaster. Gushtsp returns, is defeated by the forces of Kahram,
    Arjsp, and demon-legions, and takes refuge in a mountain fort. Jamsp interprets
    the stars as saying that recovery depends on Isfendiyr. Gushtsp asks forgiveness
    and offers the crown; Isfendiyr is released from chains, reconciled with his father,
    given command, and Gurzam is executed for his malicious counsel.
  language: English
  quote_policy: summarized
