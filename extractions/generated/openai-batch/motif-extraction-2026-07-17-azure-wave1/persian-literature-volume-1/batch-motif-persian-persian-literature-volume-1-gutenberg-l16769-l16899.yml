canonical_text:
  quote: ''
  summary: A didactic lyric urges an unlearned seeker to enter the quest and path
    of love, learn in the school of Truth from Master Love, renounce sleep and food,
    wash away worldly dross, be transformed by Love, receive divine light, plunge
    into God's sea, behold the Creator's face, and become dust at the threshold of
    keen-sighted men if Union is desired. The attached footnotes gloss several Persian
    and Islamicate literary figures and images, including the Magian as spiritual
    teacher, Jemshid's cup and Alexander's mirror, Korah/Karun swallowed by the earth,
    Noah, the sky as a cup of poison, Rizvan as gatekeeper of Paradise, and Koranic
    lote-trees and rivers in the garden of delight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses an unlearned person and asks whether one who has not
    trodden the path can guide others on the way.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressee is imagined as remaining in the school of Truth to learn from
    Master Love and to advance from a son's status toward the father's grade.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Slumber and food are said to have kept the addressee far from Love's good,
    and abstinence from sleep and food is prescribed for attaining love's goal.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If the heart and soul are cleared by rays of love of truth, the addressee's
    beauty is said to outshine the sun.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The addressee is told to wash the dross of life from the hands and, through
    Love's alchemic power, to transmute the self to gold.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Divine light is said to shine on the whole frame if the seeker has neither
    head nor foot on the Lord of Glory's path.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
