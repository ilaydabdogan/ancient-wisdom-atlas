canonical_text:
  quote: ''
  summary: Rustem is taunted by Akwn Dw, captures the demon with a kamund, beheads
    him, and sends the head as a trophy to Kai-khosru. The narrative then turns to
    the people of Armn, who petition Kai-khosru for relief from destructive wild boars.
    Byzun volunteers for the task despite objections to his youth, travels with Girgn
    to the region between Irn and Trn, kills the boars, burns the forest and cultivation,
    and gathers heads and tusks as proof. Girgn, becoming envious, lures Byzun toward
    the springlike garden of Manjeh, daughter of Afrsiyb. Manjeh sees Byzun near her
    summer-tent, falls in love with him, and sends her nurse to ask who he is.
  language: English
  quote_policy: summarized
