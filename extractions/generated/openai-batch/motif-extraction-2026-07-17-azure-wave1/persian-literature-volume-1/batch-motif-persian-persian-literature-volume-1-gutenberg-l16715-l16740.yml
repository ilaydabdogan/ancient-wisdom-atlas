canonical_text:
  quote: ''
  summary: A lyric defines fortune as seeing Beauty, asking alms in her lane, and
    disdaining royal pomp. It reflects on loosening attachment to life, the pain of
    losing friends, wandering to an orchard, casting off reputation, hearing secrets
    of Love from wind, flower, and bulbuls, seizing the occasion to kiss the Beloved,
    valuing companionship before an irreversible departure from a two-doored house,
    and asking the Lord to remind Hafiz of Shah Mansur and the poor.
  language: English
  quote_policy: summarized
