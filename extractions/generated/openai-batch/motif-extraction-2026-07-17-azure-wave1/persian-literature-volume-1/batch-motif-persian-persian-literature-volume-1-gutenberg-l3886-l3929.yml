canonical_text:
  quote: ''
  summary: The passage recalls earlier kin-slaying and Afrsiyb's invasion of Persia,
    sets peace terms at the river Jihn with an oath not to cross it, reports withdrawal
    of the Trnian army, and describes Kai-kobd's preference for justice and tranquillity
    over further war. Kai-kobd rewards Rustem, Zl, and other warriors, rules benevolently
    from Istakhar and then Irn, and near death appoints his eldest son Kai-ks as successor
    with instructions to rule justly and mercifully.
