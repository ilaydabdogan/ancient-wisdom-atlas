canonical_text:
  quote: ''
  summary: 'The passage surveys Persian lyric poetry and presents Hafiz as its greatest
    poet: a Shiraz-based lyricist, associated with wine, love, nature, Sufi symbolism,
    veiled language, and imagery in which literal and mystical meanings are difficult
    to separate. It also includes images of paradise, willow shade, serpent-like asceticism,
    fire persisting in a dead heart, and seasonal language for the decline of Persian
    letters.'
  language: English
  quote_policy: summarized
