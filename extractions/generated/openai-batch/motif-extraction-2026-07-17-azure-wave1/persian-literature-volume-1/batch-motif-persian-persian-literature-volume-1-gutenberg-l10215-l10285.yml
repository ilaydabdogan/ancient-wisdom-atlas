canonical_text:
  quote: ''
  summary: A sorceress deceives and captures several warriors with enchanted food
    and wine in a fort. Zl resists the enchantment, breaks the gate, and battles Plsam
    until Fermurz intervenes. Rustem arrives with Barz, fights and kills Plsam, then
    attacks Afrsiyb's forces with Zl and Barz. Ssen flees to Afrsiyb. Kai-khosru arrives
    with an army, the Trnians give way, and Prn-wsah counsels Afrsiyb against continued
    reliance on the singing-girl's dreams or a woman's word.
  language: English
  quote_policy: summarized
