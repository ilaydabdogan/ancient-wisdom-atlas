canonical_text:
  quote: '"But if thou art fire, I am water, and able to quench thy flames."'
  summary: Kai-khosru responds to Afrsiyb's renewed invasion. Barz defeats the Persian
    force and captures Ts and Frburz. Rustem and Gustahem rescue the prisoners by
    night. Afrsiyb sends Barz to challenge Rustem; Barz and Rustem fight with weapons
    and wrestling until Barz wounds Rustem severely. Rustem conceals the wound, postpones
    the combat, seeks a remedy from the Smrgh, and is relieved by the arrival of Fermurz.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Kai-khosru hears of Afrsiyb's renewed expedition, orders Ts and Frburz with
    twelve thousand horsemen to oppose it, and follows with a large army.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Barz wins a battle lasting a whole day and night; the Persian warriors flee,
    and Ts and Frburz are captured, bound, and placed in Hmn's charge.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Rustem takes Gustahem with him at midnight and comes to Afrsiyb's pavilion,
    where Afrsiyb sits on a throne with Barz at his right and Prn-wsah at his left
    while Ts and Frburz stand in chains.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Afrsiyb tells the captive warriors that they will be put to death the next
    day in the manner he slew Saiwush.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Rustem thanks Heaven that his friends are alive, waits until the watchman
