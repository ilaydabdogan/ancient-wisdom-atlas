  quote: '"Stratagem / Must be employed, or we shall never gain / Possession of its
    wide-extended walls"'
  summary: After judging the Brazen Fortress too strong for direct assault, Isfendiyr
    decides to enter it disguised as a merchant. He prepares a caravan carrying valuable
    goods and hidden warriors, instructs Bashtan to attack when a fire-and-smoke signal
    rises, gains entry to Arjsp’s fort under the name Kherd, and encounters his captive
    sisters, who recognize him by his voice.
