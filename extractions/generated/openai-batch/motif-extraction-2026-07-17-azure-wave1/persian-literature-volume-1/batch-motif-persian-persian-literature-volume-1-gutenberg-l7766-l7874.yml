canonical_text:
  quote: ''
  summary: Prn protects the newborn Kai-khosru from Afrsiyb by hiding him with peasants
    on Mount Kaln. Afrsiyb dreams of the child’s birth and later shows remorse for
    Saiwush’s murder. Kai-khosru grows into a talented royal youth, is instructed
    to feign madness before Afrsiyb, and is sent safely to his mother. Mother and
    son visit Saiwush’s killing place, where a verdant tree has grown from blood-enriched
    soil. Kai-ks and his warriors mourn Saiwush; Rustem blames Sdveh and kills her
    as punishment.
  language: English
  quote_policy: summarized
