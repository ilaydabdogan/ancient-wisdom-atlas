candidate_motifs:
- id: motif:1
  label: contested dynastic marriage across a feared lineage
  taxonomy_refs:
  - royal_legitimacy
  basis: Rdbeh and Zl's intended marriage produces fear in Mihrb and Minchihr because
    of the political union of Zl with Mihrb's Zohk-descended house.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage presents the union as politically and ancestrally dangerous,
    not as a ritual or explicitly sacred marriage.
- id: motif:2
  label: serpent-line ancestry as danger to the realm
  taxonomy_refs:
  - serpent
  - royal_legitimacy
  basis: Mihrb is associated with Zohk and called of the serpent-race; Minchihr fears
    that this lineage may revive earlier abominations and endanger Persia.
  evidence_refs:
  - ev:5
  - ev:7
  confidence: high
  cautions: The passage uses ancestry and serpent-language, but does not explain the
    full mythic background of Zohk within this excerpt.
- id: motif:3
  label: hero slays a devastating serpent-like monster
  taxonomy_refs:
  - serpent
  - culture_hero
  - chaos
  basis: Sm describes a monstrous being whose devouring jaws depopulate the land;
    he kills it with arrows and a battle-axe, after which the world regains peace
    and comfort.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage calls the creature a monster and dragon in summary context;
    the taxonomy link to serpent is based on the monster's dragon-like and poisonous
    traits.
- id: motif:4
  label: heroic service used as intercessory claim
  taxonomy_refs:
  - wisdom
  basis: Sm sends Zl with a letter to Minchihr, listing his services and monster-slaying
    as grounds for deprecating the king's wrath against Kbul and Mihrb's house.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
  - ev:12
  confidence: medium
  cautions: The motif is rhetorical and political in this passage; the wisdom taxonomy
