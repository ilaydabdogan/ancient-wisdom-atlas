canonical_text:
  quote: ''
  summary: The passage recounts the discovery of a disguised emissary connected to
    Rdbeh and Zl, Rdbeh's confession of love to her mother Sndokht, Mihrb's angry
    response, Minchihr's alarm over the political and ancestral implications of the
    match, Sm's report of victories over a Zohk-descended enemy and demons, Minchihr's
    command to destroy Kbul and Mihrb's house, and Sm's letter asking mercy while
    recalling his past service, especially the slaying of a devastating dragon.
  language: English
  quote_policy: summarized
