canonical_text:
  quote: ''
  summary: Isfendiyr completes a dragon combat but is overcome by its venom and revived
    by his companions. He purifies himself and thanks the Creator. Kurugsar, the demon-guide,
    foretells an enchantress with sea-and-land-transforming power and a ghoul attendant.
    In the fourth stage, Isfendiyr encounters the enchantress in a meadow, recognizes
    her deception, binds her with his kamund, sees through her transformations into
    a cat, wolf, and old man, and kills her. A fiery black demon then appears, burns
    his clothing and armor, and is beheaded by him. Kurugsar next foretells the Smrgh
    on a lofty mountain with two elephant-sized young.
  language: English
  quote_policy: summarized
