candidate_motifs:
- id: motif:1
  label: wine as release from confinement of being
  taxonomy_refs:
  - annihilation_union
  - mystical_quest
  basis: The speaker associates the cupbearer's wine-cup with deliverance from Being's
    prison and later values worldly kingship at almost nothing when rapt.
  evidence_refs:
  - ev:12
  - ev:24
  confidence: medium
  cautions: The passage is lyric and symbolic; the extraction does not establish a
    doctrinal reading beyond the explicit language of deliverance, rapture, and wine.
- id: motif:2
  label: beloved as divine or cosmic refuge
  taxonomy_refs:
  - divine_beloved
  basis: The beloved's love and absence affect Rizvan's gardens and Gehenna, while
    Heaven, the Tuba-tree, a celestial river, and Empyrean portals orient toward the
    beloved.
  evidence_refs:
  - ev:19
  - ev:20
  - ev:21
  - ev:22
  confidence: high
  cautions: The beloved may be human, divine, or poetically ambiguous; the motif label
    reflects the passage's cosmic and paradisal language.
- id: motif:3
  label: ark and deluge image
  taxonomy_refs:
  - ark_vessel
  - flood_and_renewal
  basis: Noah's ark and the deluge are explicitly invoked in a moral or devotional
    statement about men of God.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage alludes to ark and flood imagery but does not narrate a flood
    story.
- id: motif:4
  label: death as final earth-couch and heaven's deadly cup
  taxonomy_refs:
  - divine_judgment
  basis: The speaker says earth will be the final couch and describes Heaven's black
    goblet striking every guest dead.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The lines are aphoristic and imagistic; they imply mortality but do not
    provide a full judgment scene.
- id: motif:5
  label: release from chains to royal station
  taxonomy_refs:
  - return
  - royal_legitimacy
  basis: The Moon of Kanaan is told that the Egyptian throne pertains to him and that
    the time has come to quit chains.
  evidence_refs:
