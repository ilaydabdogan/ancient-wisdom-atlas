  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; short excerpt used.
- id: ev:2
  type: summary
  locator: 15631-15632
  quote_or_summary: The young Magian is described as dallying gracefully, and the
    speaker's eye would sweep the house of wine.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: quote
  locator: 15643-15644
  quote_or_summary: '"To men of God be friendly: in Noah''s ark was earth / Which
    deemed not all the deluge one drop of water worth."'
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; short excerpt used.
- id: ev:4
  type: summary
  locator: 15646-15647
  quote_or_summary: The speaker says two handfuls of earth will supply the final couch
    and asks why one should build a sky-aspiring palace.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: quote
  locator: 15649-15650
  quote_or_summary: '"Flee from the house of Heaven... Her goblet black shall shortly
    her every guest strike dead."'
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; short excerpt used.
- id: ev:6
  type: quote
  locator: 15652-15653
  quote_or_summary: '"To thee, my Moon of Kanaan, the Egyptian throne pertains; /
    At length has come the moment that thou shouldst quit thy chains."'
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; short excerpt used.
- id: ev:7
  type: summary
  locator: 15675-15676
  quote_or_summary: The speaker says his heart abhors the cloister and false cowl,
    then asks for the Magian's cloister and pure wine.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 15678-15679
  quote_or_summary: The speaker says memory should recall Union's days and asks where
    the beloved's anger and coquettish ways are.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 15684-15685
  quote_or_summary: Dust on the beloved's threshold gives balm to the speaker's eyes;
    leaving the beloved's presence would remove calm.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 15697-15702
  quote_or_summary: At evening a son of song pipes a soul-inflaming lay on a vocal
    reed; the speaker is deeply stirred and sees earthly things grow gray through
    tears.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: summary
  locator: 15704-15707
  quote_or_summary: The speaker's Saki is present; when he perceives the speaker's
    wish, he fills the bowl with wine.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: quote
  locator: 15709-15710
  quote_or_summary: '"Saki, from Being''s prison deliverance did I gain, / When now
    and now the cup thou lit''st with cheerful ray."'
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; short excerpt used.
- id: ev:13
  type: summary
  locator: 15712-15713
  quote_or_summary: The speaker asks God to guard the cupbearer below and reward him
    in the Seat of Bliss on God's day.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: 15724-15731
  quote_or_summary: In dialogue, the speaker addresses the monarch of the lovely;
    a stranger seeks grace, is told the heart's deceitful guidance turns him from
    the way, asks the beloved to tarry, and is refused.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: quote
  locator: 15736-15737
  quote_or_summary: '"O thou whose locks hold fast on fetters so many a soul known
    long ago..."'
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; short excerpt used.
- id: ev:16
  type: summary
  locator: 15758-15765
  quote_or_summary: Morning clouds make a ceiling; companions are urged to take the
    morning cup; dew streaks the tulip, the wine-bowl is sought, the greensward breathes,
    and limpid wine is urged.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: 15767-15768
  quote_or_summary: The flower displays an emerald throne, and the speaker asks for
    wine with the ruby's blaze.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: quote
  locator: 15770-15771
  quote_or_summary: '"Again is closed the vintner''s store, / ''Open, Thou Opener
    of the door!''"'
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; short excerpt used.
- id: ev:19
  type: summary
  locator: 15784-15785
  quote_or_summary: The beloved's love makes Rizvan's bright gardens fresher, while
    the heat kindled by absence makes Gehenna's flames glow more intensely.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:20
  type: summary
  locator: 15787-15789
  quote_or_summary: Heaven and the Tuba-tree flee to the beloved's tall form and shining
    cheek as to a place of refuge.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:21
  type: summary
  locator: 15791-15792
  quote_or_summary: At night the celestial river glides through the garden of the
    skies and sees only the beloved's narcissus eyes.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:22
  type: summary
  locator: 15794-15795
  quote_or_summary: Each section of spring's volume comments on the beloved's name,
    and every portal of the Empyrean murmurs the beloved's fame.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:23
  type: summary
  locator: 15797-15804
  quote_or_summary: The speaker's heart has burned, blood-tinged tears flow, and the
    beloved's mouth and lips have power over a sorrow-wounded breast and flame-burned
    heart.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:24
  type: summary
  locator: 15715-15718
  quote_or_summary: When Hafiz is rapt, he would appraise even the realm of Kay Kaus
    at a barleycorn.
  source_text_path: texts/public-domain/persian/project-gutenberg/persian-literature-volume-1.md
  rights_note: Public domain source; summarized.
- id: ev:25
  type: summary
  locator: 15751-15755
  quote_or_summary: The reply says familiars stand amazed at the beloved's renown,
