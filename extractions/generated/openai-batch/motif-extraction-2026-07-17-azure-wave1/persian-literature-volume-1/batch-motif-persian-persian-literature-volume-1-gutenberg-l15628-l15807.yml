  confidence: medium
  cautions: The lines evoke a recognized Joseph-like pattern, but only the local allusive
    language supplied in the passage is used here.
- id: motif:6
  label: lost union and threshold devotion
  taxonomy_refs:
  - annihilation_union
  - divine_beloved
  basis: The speaker remembers Union's days and treats dust from the beloved's threshold
    as balm, saying calm depends on the beloved's presence.
  evidence_refs:
