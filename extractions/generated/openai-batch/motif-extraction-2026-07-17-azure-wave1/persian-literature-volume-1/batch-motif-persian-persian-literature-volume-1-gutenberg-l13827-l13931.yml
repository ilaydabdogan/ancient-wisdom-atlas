  text: Dr tells his remaining devoted friends that his subjects have been deluded
    by Sikander and that their wives and children may be enslaved by conquerors.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A small faithful force fights again, is defeated, and Dr flees with three
