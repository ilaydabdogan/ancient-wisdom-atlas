canonical_text:
  quote: ''
  summary: Dr, abandoned by most of his army, is defeated by Sikander, refuses to
    submit, seeks aid, and is murdered by his own ministers. Sikander finds him dying,
    mourns him, claims brotherhood, promises vengeance, and accepts Dr's last requests
    to preserve his family, marry Roshung, and support the religion of Zerdusht. Dr
    dies and is buried; the ministers are executed. Sikander succeeds to Persia, marries
    Roshung according to imperial custom, and later prepares to go to Ind.
  language: English
  quote_policy: summarized
