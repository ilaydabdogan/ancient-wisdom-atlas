canonical_text:
  quote: ''
  summary: After Sohrb's death, Ks tries to console Rustem by speaking of the inevitability
    of death and the irreversibility of the past. Rustem asks that Sohrb's host be
    protected and allowed to return home, and Ks agrees to end the war. The armies
    depart; Rustem conducts sacrificial funeral rites, leads the bier in procession
    through Zbul, and receives the mourning of Zl, Rdbeh, and the public. Sohrb's
    body is displayed, covered with a yellow robe, enclosed in an aloe bier, and commemorated
    by a hoof-shaped sepulchral mound. News reaches Trn, Afrsiyb's realm, Samengn,
    and finally Tahmneh, who laments her son, his search for his father, and the unshown
    bracelet that might have prevented his death.
  language: English
  quote_policy: summarized
