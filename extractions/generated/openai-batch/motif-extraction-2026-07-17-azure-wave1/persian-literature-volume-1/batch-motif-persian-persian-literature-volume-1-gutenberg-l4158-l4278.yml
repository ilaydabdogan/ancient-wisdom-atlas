canonical_text:
  quote: THE SEVEN LABORS OF RUSTEM
  summary: 'The passage recounts the first three stages of Rustem''s journey toward
    Mzindern: a forest episode in which Rakush kills a lion while Rustem sleeps; a
    desert episode in which Rustem prays, follows a sheep to water, and recovers;
    and a midnight episode in which Rakush repeatedly warns Rustem of a dragon-serpent,
    then helps him kill it.'
  language: English
  quote_policy: quoted
