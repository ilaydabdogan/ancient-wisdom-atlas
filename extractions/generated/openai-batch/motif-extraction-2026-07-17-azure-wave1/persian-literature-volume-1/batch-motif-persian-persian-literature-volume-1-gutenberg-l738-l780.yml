canonical_text:
  quote: ''
  summary: The passage describes Hsheng discovering fire when a stone he throws at
    a terrifying monster strikes rock and produces sparks; the resulting fire kills
    the monster. Hsheng praises the Creator, calls the flame divine light, establishes
    reverence for fire, celebrates the Festival of Siddeh, and is credited with introducing
    blacksmithing, irrigation, furs, bread-making, cookery, mild laws, and cultivated
    prosperity before being succeeded by his son Tahmers.
  language: English
  quote_policy: summarized
