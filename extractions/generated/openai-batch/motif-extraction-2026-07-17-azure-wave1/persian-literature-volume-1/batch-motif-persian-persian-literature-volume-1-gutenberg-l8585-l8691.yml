canonical_text:
  quote: ''
  summary: A Turanian commander uses a magician on a mountain to create darkness,
    snow, and hail against the Persian army. After Persian leaders pray to God, an
    otherworldly person directs Rehm to the magician, whom Rehm disables and kills,
    ending the storm. The Persians later retreat to a well-provisioned mountain fortress,
    receive Rustem and Frburz as aid, and face new reinforcements sent by Afrsiyb,
    including Kms. Rustem prays before battle, and the passage ends as he steps forward
    with bow and arrows after Ushkabs has driven Rehm back.
  language: English
  quote_policy: summarized
