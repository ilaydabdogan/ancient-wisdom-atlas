- id: motif:1
  label: Weaponized supernatural storm and darkness
  taxonomy_refs:
  - chaos
  basis: A magician on a mountain creates darkness, snow, and hail and directs their
    severity against one army, helping produce a battlefield rout.
  evidence_refs:
