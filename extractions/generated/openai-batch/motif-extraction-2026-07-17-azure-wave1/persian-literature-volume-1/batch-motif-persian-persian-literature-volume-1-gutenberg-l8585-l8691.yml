  confidence: medium
  cautions: The available taxonomy has no exact weather-magic motif; 'chaos' is a
    broad fit for disruptive supernatural darkness and storm.
- id: motif:2
  label: Prayer answered by otherworldly guidance against sorcery
  taxonomy_refs: []
  basis: After Ts and Gdarz pray to God for rescue from sorcery, a mysterious person
    from the invisible world appears to Rehm and points out the mountain source of
    the tempest.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not explicitly state that God sent the mysterious person,
    only that the appearance follows the prayer.
- id: motif:3
  label: Hero disables magician and the enchantment ends
  taxonomy_refs: []
  basis: Rehm finds the magician performing incantations, cuts off his arms, and a
    whirlwind immediately disperses the preternatural darkness, snow, and hail.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The causal sequence is strongly implied by the narration, but no separate
    taxonomy reference is available.
- id: motif:4
  label: Mountain refuge supplied against siege
  taxonomy_refs: []
  basis: The Persians retreat into a mountain fortress with wells, grain, and provisions,
    preventing starvation during the siege.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: This is a strategic siege pattern rather than an explicitly supernatural
    motif.
- id: motif:5
  label: Champion reinforcement of a besieged army
  taxonomy_refs: []
  basis: Khosru sends Rustem and Frburz to aid the Persians in the fortress, and Rustem
