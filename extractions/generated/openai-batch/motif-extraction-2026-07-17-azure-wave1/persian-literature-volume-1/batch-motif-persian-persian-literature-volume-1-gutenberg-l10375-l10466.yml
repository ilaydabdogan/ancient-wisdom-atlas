canonical_text:
  quote: ''
  summary: Kai-khosru entrusts a renewed expedition against Trn to Gdarz. Gdarz’s
    forces defeat Hmn, and after a long war Prn is killed, causing Afrsiyb deep grief.
    Afrsiyb raises another army, sends his son Shydah-Poshang as ambassador with peace
    terms, and secretly instructs him to challenge Kai-khosru to single combat if
    peace is refused. Kai-khosru rejects peace until Saiwush is avenged, while Rustem
    and other warriors warn that Afrsiyb’s proposal is deceitful.
  language: English
  quote_policy: summarized
