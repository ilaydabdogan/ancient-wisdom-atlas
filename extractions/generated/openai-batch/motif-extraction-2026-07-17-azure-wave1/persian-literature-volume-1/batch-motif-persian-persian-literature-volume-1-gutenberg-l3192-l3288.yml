canonical_text:
  quote: ''
  summary: After Minchihr's death, Nauder becomes king but turns oppressive, prompting
    the people to seek Sm as ruler. Sm refuses to usurp Nauder, counsels the king
    on just rule and the transience of worldly power, and Nauder reforms. Meanwhile
    Poshang of Trn learns of Persia's weakness, urges his son Afrsiyb to avenge Slim
    and Tr, and prepares an army despite Aghrras's warning.
  language: English
  quote_policy: summarized
