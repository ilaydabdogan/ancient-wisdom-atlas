    explicit comparisons with European and Japanese heraldry, Plutarch's Themistocles,
    the biblical girdle gift from Jonathan to David, Sa'di, romances including Don
    Quixote, Hind medical lore, Theocritus, the Arabian Nights, and Greek historians.
