canonical_text:
  quote: ''
  summary: Bahman reports to Isfendiyr that members of Isfendiyr's family have been
    killed by warriors of Zabul. Isfendiyr accuses Rustem of treachery; Rustem denies
    knowledge and offers to surrender his kin as punishment. Isfendiyr demands Rustem's
    death instead. Rustem and Isfendiyr fight with bows; Rustem and Rakush are badly
    wounded while Rustem's arrows fail to harm Isfendiyr. After a night postponement,
    Isfendiyr mourns his slain kinsmen and sends their heads to the king. Rustem returns
    wounded to his family, is treated by Zl, and describes Isfendiyr as nearly impenetrable.
    Zl burns a feather to summon the Smrgh, who appears and heals Rakush's arrow wounds
    with beak and feather.
  language: English
  quote_policy: summarized
