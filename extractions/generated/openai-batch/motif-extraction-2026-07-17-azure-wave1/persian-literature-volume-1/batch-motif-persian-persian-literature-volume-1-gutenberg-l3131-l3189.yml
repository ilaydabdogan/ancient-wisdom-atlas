canonical_text:
  quote: ''
  summary: After a reign of one hundred and twenty years, Minchihr is warned by astrologers
    that his death is near. He counsels his son Nauder on the impermanence of royal
    power, recounts his deeds and lineage from Feridun, resigns the kingdom, urges
    continued worship of God, warns of a future enemy from the mountains, names Sam,
    Zal, and a young branch as helpers, describes death as a journey, and soon dies
    though not visibly ill.
  language: English
  quote_policy: summarized
