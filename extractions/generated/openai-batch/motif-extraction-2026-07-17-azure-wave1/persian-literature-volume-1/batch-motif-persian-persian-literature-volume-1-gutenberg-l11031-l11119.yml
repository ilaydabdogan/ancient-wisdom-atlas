canonical_text:
  quote: ''
  summary: The king of Rm, aided by Gushtsp, conquers Khuz after Gushtsp defeats Als.
    Gushtsp then urges an invasion of Irn. Lohursp learns from Kabs that the victorious
    youth is his son Gushtsp, sends Zarr to seek peace and reconciliation, and promises
    to resign the crown and throne to Gushtsp. Gushtsp returns with Kitabn and Zarr,
    and Lohursp publicly embraces him, seats him beside the throne, receives public
    allegiance for him, and gives him the crown.
  language: English
  quote_policy: summarized
