canonical_text:
  quote: ''
  summary: Isfendiyr advances against Arjsp, captures the demon-race gladiator Kurugsar
    with a noose, defeats several enemy forces, and forces Arjsp to flee. After enemy
    survivors beg for quarter, Isfendiyr ends the slaughter and returns to Gushtsp
    covered with arrows. Gushtsp blesses him and again offers him sovereignty, but
    Isfendiyr refuses and asks instead to rescue his captive sisters and take vengeance
    on Arjsp. Kurugsar pleads for mercy, swears fidelity, is pardoned, and is taken
    into Isfendiyr's household as a potential ally.
  language: English
  quote_policy: summarized
