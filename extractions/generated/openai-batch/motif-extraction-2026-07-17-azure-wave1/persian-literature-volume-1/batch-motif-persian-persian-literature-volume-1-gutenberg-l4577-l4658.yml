canonical_text:
  quote: ''
  summary: Rustem approaches the court of the king of Mzindern as an ambassador, displays
    extraordinary strength before enemy warriors, and later fights in the Persian
    campaign. The king of Mzindern transforms himself into a rock by magic, but Rustem
    lifts the rock, compels him to resume human form, and brings him to Ks, who orders
    his execution. After victory and settlement, Ks later tours his dominions and
    suppresses rebellion in Berberistn.
  language: English
  quote_policy: summarized
