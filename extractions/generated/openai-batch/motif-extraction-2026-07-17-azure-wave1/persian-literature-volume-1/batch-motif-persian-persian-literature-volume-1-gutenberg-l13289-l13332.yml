canonical_text:
  quote: ''
  summary: At the point of death, Rustem asks Shughad to string his bow and give it
    to him, ostensibly to keep wild animals away after his death. Shughad does so,
    but hides behind a tree when he sees Rustem grasp the bow. Rustem shoots an arrow
    through both the tree and Shughad, thanks the Creator for allowing him to avenge
    himself, and dies. His followers have perished in pits except for one survivor
    who reports the news to Zal. Fermurz later retrieves the bones of Rustem and Zra,
    buries them with public lamentation, returns to Kbul, captures the king, and brings
    him to Sstn for execution. Gushtsp later bequeaths his empire to Bahman and dies
    after a reign of one hundred and eight years.
  language: English
  quote_policy: summarized
