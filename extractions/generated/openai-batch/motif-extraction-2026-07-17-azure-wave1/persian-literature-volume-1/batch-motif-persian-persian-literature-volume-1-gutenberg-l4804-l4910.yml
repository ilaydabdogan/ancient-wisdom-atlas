canonical_text:
  quote: ''
  summary: Kai-Ks is released and restored to the throne by Rustem. Afrsiyb is challenged,
    defeated, and retreats to Trn. After peaceful rule and palace-building on Alberz,
    Ibls uses Demons to flatter Kai-Ks into desiring flight and heavenly knowledge.
    Astrologers devise an eagle-lifted throne, which rises into the clouds but collapses
    in Chn, leaving Kai-Ks helpless until discovered by Demons sent by his ministers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ks and his heroes are released from fetters and removed from a mountain-fortress
    where they had been confined.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Rustem reseats Ks on his throne after the release.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The troops of Misser, Berberistn, and Hmvern declare allegiance to the Persian
    king, increasing Ks's army to more than three hundred thousand horse and foot.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: Before marching toward Irn, Ks sends Afrsiyb a message commanding him to leave
    the invaded country and be content with Trn.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Afrsiyb reacts with resentment and promises his daughter in marriage and a
    kingdom to whoever captures Rustem alive.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: In battle, many chiefs seeking the reward fall; Afrsiyb attacks Rustem but
    escapes and retreats to Trn, leaving Ks in possession of the kingdom.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ks resumes rule on the throne of Persia, administers affairs justly and liberally,
    sends warriors to secure several states, and gives Rustem the title Jahni Pahlvn,
    Champion of the World.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When safe from foreign and domestic enemies, Ks orders Demons to build splendid
    palaces and mansions on mountain Alberz, lavishly decorated with precious materials.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ibls observes the king's vanity and ambition, persuades the Demons, and has
    one Demon disguised as a domestic servant present a nosegay to Ks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The disguised Demon flatters Ks as ruler over beings beneath the sky but says
    he cannot fly and urges him toward knowledge of planets, sun, moon, nights, days,
    hidden causes, and who directs the whole.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ks becomes concerned with how he might ascend the Heavens without wings and
    consults his astrologers.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The astrologers take young eagles from a nest, rear them until strong, prepare
    an aloes-wood framework, set upright javelins with goat flesh at the four corners,
    bind one eagle at each corner, and seat Ks in the middle with a goblet of wine
    before him.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Hungry eagles try to reach the goat flesh, flap upward, and raise the throne
    from the ground into the clouds, carrying the king far beyond his own country.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: After long effort, the eagles lose strength; the fabric falls from the sky
    into a dreary solitude in the kingdom of Chn, where Ks is left hungry, alone,
    and despairing.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: A band of Demons, sent by Ks's anxious ministers to search for him, discovers
    him.
  category: action
  evidence_refs:
  - ev:10
