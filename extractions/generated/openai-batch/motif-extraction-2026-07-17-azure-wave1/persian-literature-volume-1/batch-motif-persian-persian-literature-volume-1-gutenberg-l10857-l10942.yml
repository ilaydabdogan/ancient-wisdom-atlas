canonical_text:
  quote: '"My dream, my dream is true!"'
  summary: Kitabun, daughter of the king of Rm, dreams of a destined husband from
    Irn and recognizes Gushtasp at a royal marriage feast. She chooses him with a
    bunch of roses. Her father resists, then sanctions the marriage but expels the
    couple without support. Gushtasp and Kitabun live humbly while Gushtasp hunts
    across a river and befriends a ferryman. Later, Mabrun seeks the king's second
    daughter, and the king sets the killing of a destructive monstrous wolf as the
    condition for marriage; the ferryman points Mabrun toward Gushtasp as a possible
    champion.
  language: English
  quote_policy: quoted
