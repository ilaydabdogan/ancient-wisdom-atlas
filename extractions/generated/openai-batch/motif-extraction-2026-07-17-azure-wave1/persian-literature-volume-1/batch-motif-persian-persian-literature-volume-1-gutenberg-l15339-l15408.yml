canonical_text:
  quote: ''
  summary: The introduction recounts an anecdote in which Tamerlane summons Hafiz
    at Shiraz, challenges him over a verse offering Samarkand and Bokhara for a lady's
    mole, and rewards his calm witty reply. The narrator then says the story is historically
    false but spiritually revealing of Hafiz's joy, poverty, Sufi theology, and vision
    of earthly pleasures as manifestations of God that assist the soul's journey and
    union with the divine source.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tamerlane is said to halt before the gates of Shiraz and send two followers
    into the bazaar to find the dervish Muhammad Shams-ad-din, known as Hafiz.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Hafiz is described as a man of religion wearing a simple woollen Sufi garment
    when brought before Tamerlane's richly decorated pavilion.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Tamerlane asks Hafiz whether he is the poet who offered Samarkand and Bokhara
    for the black mole on his lady's cheek.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Hafiz replies calmly that his munificence has left him destitute and dependent
    on Tamerlane's generosity.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tamerlane is pleased by Hafiz's reply and self-possession and dismisses him
    with a liberal present.
  category: sequence
  evidence_refs:
