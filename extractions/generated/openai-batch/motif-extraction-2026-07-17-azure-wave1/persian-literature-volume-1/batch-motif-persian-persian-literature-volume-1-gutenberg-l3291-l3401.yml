canonical_text:
  quote: ''
  summary: Afrsiyb marches against Nauder, sends part of his force toward Zbulistn,
    and engages the Persians near Dehstn. Brmn challenges the Persians; the aged Kobd
    accepts and is killed. Krun seeks vengeance, while Nauder later sends his sons
    and household toward Irn and the mountain Alberz to preserve Feridn's line. After
    further Persian defeat, Krun pursues the force sent to capture Nauder's household
    and kills Brmn.
  language: English
  quote_policy: summarized
