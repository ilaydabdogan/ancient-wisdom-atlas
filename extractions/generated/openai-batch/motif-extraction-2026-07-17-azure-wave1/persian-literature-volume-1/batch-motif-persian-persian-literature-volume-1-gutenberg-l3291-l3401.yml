  confidence: high
  cautions: No external taxonomy reference is assigned because the provided motif
    list has no specific champion-duel category.
- id: motif:3
  label: aged warrior knowingly accepts fatal combat
  taxonomy_refs: []
  basis: Kobd is described as aged, cannot be restrained from unequal conflict, speaks
    of universal death, and is killed in the duel.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: Although the scene includes willing exposure to death, it is not explicitly
    ritual sacrifice.
- id: motif:4
  label: brother avenges slain brother
  taxonomy_refs: []
  basis: Krun first brings his army forward to avenge Kobd and later challenges and
