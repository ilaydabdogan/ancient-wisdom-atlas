canonical_text:
  quote: ''
  summary: After ascending the throne, Drb rules justly, rewards a washerman and his
    wife, defeats Arabian and Rm armies, marries Nahd daughter of Failaks, and later
    has a son named Dr by another wife. Nahd conceals her pregnancy and gives birth
    in Rm; Failaks claims the child, Sikander, as his own and has him educated by
    Aristtals. After Failaks dies, Sikander becomes king of Rm, refuses tribute to
    Persia, wars against Dr, and kills him in battle.
  language: English
  quote_policy: summarized
