canonical_text:
  quote: ''
  summary: Gdarz persuades the offended Rustem to return to the king's service for
    Persia's defense. The king apologizes and is reconciled with Rustem, then holds
    a banquet and musters a large army at dawn. The Persian host reaches the Barrier-fort,
    where Sohrb observes it without fear while Hmn is terrified, declaring that he
    fights for Afrsiyb and raising a wine cup.
  language: English
