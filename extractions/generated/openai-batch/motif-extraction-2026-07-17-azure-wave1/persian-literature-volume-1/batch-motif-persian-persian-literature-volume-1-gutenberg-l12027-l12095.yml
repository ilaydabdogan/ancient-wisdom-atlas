canonical_text:
  quote: ''
  summary: In the seventh stage of Isfendiyr's journey, his followers pledge to follow
    him and risk their lives. Kurugsar, the demon-guide, has exaggerated the dangers
    of burning sand and lack of water, then confesses the deception after the party
    finds cooled sand and a great river. Isfendiyr releases him from chains and receives
    his help in crossing the river. Near the Brazen Fortress, Kurugsar describes it
    as impregnable. Isfendiyr threatens vengeance against Arjsp for Lohursp and conquest
    of the enemy realm; Kurugsar curses him for this threat. Isfendiyr kills Kurugsar.
    At night Isfendiyr and warriors reconnoiter the Brazen Fortress, which is made
    of iron and brass and has no accessible point of attack.
  language: English
  quote_policy: summarized
