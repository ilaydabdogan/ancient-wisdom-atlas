canonical_text:
  quote: ''
  summary: 'Firdusi addresses Mahmud in satirical rebuke: earthly power is transient,
    rulers should fear God and not oppress even the smallest creature, the poet defies
    threatened execution by elephant, grounds his fame in God, the Prophet, and heroic
    song, attacks Mahmud''s ancestry and tyranny, praises the enduring Book of Kings,
    and complains of a broken royal reward after thirty years of labor. Editorial
    footnotes add comments on Persian love poetry, Hafez, and Turan/Scythia.'
  language: English
  quote_policy: summarized
