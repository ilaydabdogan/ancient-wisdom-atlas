    are described as pious and devoted to the Almighty.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gushtsp pays tribute to Arjasp, ruler of Chin and Machin, whose army is described
    as including Dews, Peris, and men.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Zerdusht is introduced as a Guber learned in divine things; Gushtsp is pleased
    with his learning and piety and takes him into confidence.
  category: relationship
  evidence_refs:
  - ev:4
