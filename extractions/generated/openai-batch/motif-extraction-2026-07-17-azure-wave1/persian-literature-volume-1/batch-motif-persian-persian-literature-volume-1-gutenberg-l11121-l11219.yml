canonical_text:
  quote: ''
  summary: Lohursp gives up royal authority and retires as a recluse. The passage
    then frames Gushtsp’s reign around Zerdusht’s teachings, a miraculous tree of
    knowledge, Zerdusht’s claimed journeys to heaven and hell, Gushtsp’s conversion,
    the refusal of tribute to Arjasp, and the exchange of threats that leads to war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lohursp relinquishes imperial authority, puts on the coarse clothing of a
    recluse, retires near Balkh, and spends the rest of his life in prayer and worship.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The narrator states that earlier sovereigns worshipped God, while later times
    produced idolatry and adoration of created things.
  category: speech
  evidence_refs:
