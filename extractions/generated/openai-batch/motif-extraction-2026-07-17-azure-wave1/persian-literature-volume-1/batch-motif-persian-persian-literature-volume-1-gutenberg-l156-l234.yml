  text: The passage states that Turkish speech prevailed at court, Arabic script became
    universal, Ormuzd was replaced by Allah, and Ahriman by Satan.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Persian past is described as being kept alive in the minds of the people,
    in poets' songs, and in minstrels' lays.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Firdusi is presented as one among several collectors or transmitters of old
    Persian epic materials, with antecedents in the Avesta, oral transmission, earlier
    chronicles, the Chodainameh, Abu Mansur's Shah Nameh, and Dakiki's versification.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says Firdusi was born in Tus in A.D. 935 and figuratively connects
