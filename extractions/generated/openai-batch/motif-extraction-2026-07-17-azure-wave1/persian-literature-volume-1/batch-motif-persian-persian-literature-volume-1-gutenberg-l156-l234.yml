  quote: ''
  summary: The passage describes Persian cultural persistence after Arab conquest,
    earlier transmission and compilation of Persian epic materials, Firdusi's life
    and work on the Shah Nameh, his relationship with Mahmud of Ghazna, an anecdote
    about an inadequate reward, Firdusi's wandering and death, and a tale of Mahmud's
    belated gold arriving as Firdusi's body was carried away.
  language: English
  quote_policy: summarized
