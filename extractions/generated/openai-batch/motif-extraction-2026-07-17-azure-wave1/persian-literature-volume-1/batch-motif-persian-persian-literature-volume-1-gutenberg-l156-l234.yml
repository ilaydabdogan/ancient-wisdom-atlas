  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The story says Mahmud had covenanted to pay Firdusi a gold dirhem per line
    but sent sixty thousand silver dirhems instead; Firdusi spurned and distributed
    them and left.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After disappointment, Firdusi wrote a lampoon against Mahmud; a friend bought
    off the satire for one thousand dirhems a verse.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Firdusi is described as wandering to Herat, Taberistan, and the Buyide Court
