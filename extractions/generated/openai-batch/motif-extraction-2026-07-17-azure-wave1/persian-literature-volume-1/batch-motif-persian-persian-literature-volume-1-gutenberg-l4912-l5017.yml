canonical_text:
  quote: ''
  summary: Gdarz, Rustem, and Ts rescue and admonish Kai-Ks after his fall caused
    by attempting to learn heavenly secrets. Kai-Ks repents for forty days and resumes
    just rule. Rustem then feasts with warriors, plans a pretended hunt near Afrsiyb's
    grounds, faces a Trnian army, defeats challengers, pursues Afrsiyb on Rakush,
    briefly catches him with a noose, and Afrsiyb escapes across the boundary-stream.
  language: English
  quote_policy: summarized
