canonical_text:
  quote: ''
  summary: Kai-khosru receives a report of a destructive wild-ass-like apparition
    and summons Rustem. Rustem hunts the vanishing creature, identifies it as Akwn
    Dw, and later sleeps near a spring with Rakush grazing. Akwn Dw lifts the ground
    beneath the sleeping hero and asks whether to throw him into the sea or abandon
    him on a mountain. Knowing demons act contrary to stated wishes, Rustem asks for
    the mountain and is thrown into the sea; he kills crocodiles, swims ashore, and
    thanks Heaven. He recovers Rakush among Afrsiyb's herd, drives off the horses,
    intimidates the keepers, defeats or repels Afrsiyb, and returns to the fountain
    near Akwn Dw's dwelling, where the demon meets him again.
  language: English
  quote_policy: summarized
