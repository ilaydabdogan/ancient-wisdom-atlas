canonical_text:
  quote: ''
  summary: Minchihr challenges Slim to leave his fort and settle the conflict in battle.
    Slim is killed, his forces are routed, and former enemy warriors submit to Minchihr
    and are incorporated under him. Minchihr honors Feridn, who, near death, entrusts
    Minchihr to Sm and Narmn, seats him on the throne, crowns him, and counsels him.
    After Feridn’s death, Minchihr succeeds to the empire, upholds his great-grandfather’s
    laws, commands worship of God, and receives the praise and loyalty of army and
    people.
  language: English
  quote_policy: summarized
