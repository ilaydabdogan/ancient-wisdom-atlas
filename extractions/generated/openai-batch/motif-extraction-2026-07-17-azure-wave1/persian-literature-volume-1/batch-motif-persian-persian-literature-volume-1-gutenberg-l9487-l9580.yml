canonical_text:
  quote: ''
  summary: Byzun tells Prn of Girgn's treachery. Prn intercedes with Afrsiyb and argues
    that killing Byzun would repeat the tragedy of Saiwush and bring war. Afrsiyb
    changes the sentence from execution to imprisonment in a deep pit under a huge
    stone associated with Akwn Dw. Manjeh is left near the pit, stripped of finery
    and denied public aid, but a fissure allows Byzun's voice and sustenance to pass.
    Girgn returns to Irn with Byzun's horse and gives Gw a false story about a supernatural
    elk; Gw rejects the story, punishes him, and reports to Kai-khosru. Astrologers
    say Byzun is alive, and Kai-khosru sends troops to search for him.
  language: English
  quote_policy: summarized
