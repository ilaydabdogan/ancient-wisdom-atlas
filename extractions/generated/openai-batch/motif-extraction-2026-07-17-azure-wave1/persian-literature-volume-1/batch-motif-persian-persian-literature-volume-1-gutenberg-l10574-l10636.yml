canonical_text:
  quote: ''
  summary: Afrsiyb, abandoned while fleeing Kai-khosru, hides in a cave. Hm, a mountain-dwelling
    ascetic of the race of Feridn, hears his lament, lures him from the cave by a
    seeming spiritual summons, strikes and binds him, and delivers him to Kai-khosru.
    Kai-khosru rewards Hm, recalls the murder of Saiwush, summons Gerswaz, and has
    Afrsiyb and Gerswaz beheaded. Kai-khosru returns to Irn and is praised for avenging
    his father.
  language: English
  quote_policy: summarized
