  - ev:1
- id: obs:3
  text: The wolf is described as a dreadful monster larger than an elephant, howling
    terribly, and ready to spring upon Gushtsp.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:4
  text: Gushtsp shoots two arrows into the wolf, then cuts it in two with a sword,
    causing blood to cover the ground.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Mabrn and the ferryman ask Gushtsp to conceal his name temporarily; Mabrn
    then claims the promised bride after the king verifies the wolf's death.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The king of Rm sets Ahrun the condition of destroying a hideous dragon that
    has taken possession of a neighboring mountain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Gushtsp asks for a dagger fastened with knives, goes to the mountain, and
    confronts a dragon whose nostrils issue flames as it advances.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Gushtsp drives many arrows into the dragon, thrusts the armed dagger into
    its throat, beats its brains with a flinty rock, and removes two fangs from its
    jaws.
  category: action
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: Ahrun delivers the two dragon teeth to the king, who ascends the mountain,
    sees the dead dragon, questions Ahrun, and then gives him the youngest daughter.
  category: sequence
  evidence_refs:
  - ev:5
