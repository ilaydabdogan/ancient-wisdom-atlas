- id: obs:1
  text: Mabrn reports his situation and required conditions to Gushtsp, who agrees
    to help and proceeds toward the forest with Mabrn and the ferryman.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the border of the wolf's wilderness, Gushtsp leaves his companions behind
    and advances alone into the interior.
  category: action
