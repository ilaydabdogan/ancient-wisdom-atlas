canonical_text:
  quote: ''
  summary: Gushtsp secretly helps Mabrn and Ahrun obtain the king of Rm's daughters
    by killing a monstrous wolf in a wilderness and a dragon on a mountain. The suitors
    receive the brides after the king verifies the deaths. Kitabn later reveals that
    Gushtsp performed both deeds, and the king honors him and appoints him to chief
    command of the army.
  language: English
  quote_policy: summarized
