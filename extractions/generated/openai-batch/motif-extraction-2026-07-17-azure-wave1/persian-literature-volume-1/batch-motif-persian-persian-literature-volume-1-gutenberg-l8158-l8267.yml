canonical_text:
  quote: ''
  summary: Afrsiyb, angered by Kai-khosru's escape, orders ferrymen at the Jihn to
    stop three travelers and pursues them with an army. Gw, Kai-khosru, and Ferangs
    refuse the ferrymen's demands for precious persons and objects, cross the dangerous
    river on horseback under divine protection, and reach safety. Afrsiyb arrives
    too late and retreats. In Persia, Kai-ks receives Kai-khosru with royal honors,
    but Ts rejects his claim in favor of Frburz, leading Gdarz to prepare armed support
    while Ts hesitates to begin civil war.
  language: English
  quote_policy: summarized
