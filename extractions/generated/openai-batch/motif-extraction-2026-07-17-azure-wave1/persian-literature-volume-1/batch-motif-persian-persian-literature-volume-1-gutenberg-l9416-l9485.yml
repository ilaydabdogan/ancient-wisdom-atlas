canonical_text:
  quote: ''
  summary: Afrsiyb orders Gerswaz to seize and kill Byzun after Byzun is found with
    Manjeh in private quarters. Byzun resists accusation, claims he was magically
    transported while asleep by a Peri to a princess and then confined in Afrsiyb's
    palace, denies guilt and cowardice, invokes Rustem, and is ordered bound for execution.
    Prn-wsah sees the gallows and approaches the bound youth.
  language: English
  quote_policy: summarized
