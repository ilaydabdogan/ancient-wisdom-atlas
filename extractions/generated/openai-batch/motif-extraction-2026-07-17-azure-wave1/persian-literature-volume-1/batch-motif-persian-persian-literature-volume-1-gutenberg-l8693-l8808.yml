canonical_text:
  quote: ''
  summary: Rustem, initially unknown to the Turanian/Tartar side, defeats several
    opposing champions in single combat. He kills Ushkabs and Ushkabs' horse with
    arrows, returns to his own army unknown, and inspires amazement at the force of
    his shot. Kms kills Alwund but is then captured by Rustem with a kamund and put
    to death. Chingush challenges Rustem, flees, is dismounted when Rustem seizes
    his horse's tail, and is killed. Hmn attempts to halt the destructive vengeance,
    but Rustem cites Afrsiyb's crimes, especially the murder of Saiwush. Hmn and Prn-wsah
    infer that the warrior must be Rustem and fear devastation.
  language: English
  quote_policy: summarized
