canonical_text:
  quote: ''
  summary: 'The passage recounts a sequence of Persian and Turanian military actions:
    Ts attacks forts, Ferd is killed, Glshaher dies by her own hand beside her son,
    Ts is punished by Kai-khosru for disobeying orders and violating a sacred residence,
    and later battles involve night attack, loss and recovery of the imperial banner,
    royal commands, heroic intervention, and single combat.'
  language: English
  quote_policy: summarized
