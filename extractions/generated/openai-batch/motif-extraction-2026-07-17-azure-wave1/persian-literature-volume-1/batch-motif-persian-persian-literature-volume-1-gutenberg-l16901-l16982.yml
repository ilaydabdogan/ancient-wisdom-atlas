canonical_text:
  quote: ''
  summary: 'Footnotes explaining mythic, religious, and poetic allusions in Hafez:
    Solomon’s magical signet and Asaf, the ant’s rebuke, Majnun and Laila, the tulip
    as a preordained brand of love, Korah/Karun swallowed with his treasures, Solomon’s
    vanished glory, Mount Kaf, God’s appearance to Moses in Aiman, Kalandars, Zoroaster
    and fire-worshippers, the destruction of Ad and Thamud, the forbidden grain of
    Paradise, Kamil’s deadly glance, and the true lover who loves God.'
  language: English
  quote_policy: summarized
