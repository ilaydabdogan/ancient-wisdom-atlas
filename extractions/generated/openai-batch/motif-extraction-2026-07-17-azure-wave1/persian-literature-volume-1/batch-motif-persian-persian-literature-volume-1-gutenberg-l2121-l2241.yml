canonical_text:
  quote: '"They rooted up my favourite tree, / But yet a branch remains to me."'
  summary: Feridn mourns the murdered Irij and hopes for an heir who can avenge him.
    Irij's line continues through a daughter, whose son Minchihr resembles Irij and
    Feridn. Feridn raises and trains Minchihr, seats and crowns him as king, and an
    army gathers around him. Slim and Tur, fearing Minchihr's vengeance, send gifts
    and a message of repentance, blaming Iblis and offering obedience. Feridn rejects
    the attempted reconciliation, displays his warriors, refuses to exchange blood
    for gold, and declares that Minchihr will punish the brothers for Irij's murder.
  language: English
  quote_policy: quoted
