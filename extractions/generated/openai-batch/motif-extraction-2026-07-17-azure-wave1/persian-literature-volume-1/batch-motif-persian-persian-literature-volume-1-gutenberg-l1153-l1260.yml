canonical_text:
  quote: ''
  summary: 'A princess receives the disguised or unrecognized Jemshd at a fountain
    with carpets, attendants, music, food, and wine. His manner, speech, skill with
    a bow, and later a portrait lead her and her nurse to recognize him as King Jemshd.
    A pair of ring-doves prompts an archery wager connected with choosing a spouse.
    The nurse says a horoscope is being fulfilled: Jemshd has been brought to be the
    princess’s spouse, and she will bear a son who will conquer the world. When Jemshd
    sees his own portrait, he remembers his lost throne and weeps.'
  language: English
  quote_policy: summarized
