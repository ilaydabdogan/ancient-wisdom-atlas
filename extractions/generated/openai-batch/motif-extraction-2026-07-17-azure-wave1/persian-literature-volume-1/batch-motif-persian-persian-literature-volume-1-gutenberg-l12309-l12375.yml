canonical_text:
  quote: ''
  summary: After Isfendiyr's conquest, Gushtsp permits him to return by the road of
    the Heft-khan with booty. Isfendiyr recovers property lost in snow, is welcomed,
    and later recounts his adventures to his father. Gushtsp delays fulfilling a promise
    to give him the crown. Isfendiyr asks his mother Kitabn for help, but she counsels
    patience and silence. Isfendiyr confronts Gushtsp, who consults Jamsp about the
    stars. Jamsp foretells Isfendiyr's future sovereignty over the seven climes and
    his eventual death from Rustem's bow.
  language: English
  quote_policy: summarized
