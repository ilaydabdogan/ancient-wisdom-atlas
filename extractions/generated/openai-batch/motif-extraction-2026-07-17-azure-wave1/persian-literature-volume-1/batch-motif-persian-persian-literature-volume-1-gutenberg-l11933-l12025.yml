canonical_text:
  quote: ''
  summary: On the fifth stage, Isfendiyr reaches the Smrgh, uses an armed vehicle
    stratagem, and kills it. Kurugsar warns that the next ordeal will be a deadly
    snowstorm; the army wavers, but Isfendiyr refuses to turn back. In the sixth stage,
    a storm traps the company in mountain caves for three days until they pray to
    the Almighty and the storm ceases. Kurugsar then warns that the seventh stage
    leads through waterless burning sand toward Arjsp's Brazen Fortress.
  language: English
  quote_policy: summarized
