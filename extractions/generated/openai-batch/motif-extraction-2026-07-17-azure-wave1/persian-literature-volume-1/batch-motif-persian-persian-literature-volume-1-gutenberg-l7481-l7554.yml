canonical_text:
  quote: seemed to realize the imagined charms and fascinations of Paradise
  summary: Saiwush is honored by Afrasiyab in Turan, marries Gulshaher/Jarra, then
    marries Ferangis, Afrasiyab's daughter, and receives sovereignty over Khoten with
    rich gifts. Kai-Kaus mourns Saiwush's flight and Rustem leaves the court in anger.
    Saiwush chooses a mountain site of exceptional beauty, builds a palace and garden-temples
    decorated with portraits of kings and champions, yet remains sorrowful over estrangement
    from home. Gulshaher later gives birth to a son named Ferd.
  language: English
