canonical_text:
  quote: ''
  summary: After Khosru's accession, Zl and Rustem come to court, and Khosru asks
    Rustem to help avenge Saiwush. Ks gives Khosru the imperial army and commanders
    are assigned. Khosru orders Frburz and Ts not to molest his brother Ferd at the
    fort of Kullb, but Ts takes the route through Ferd's lands. Ferd resists, kills
    R, and defeats several warriors. After Byzun is wounded and Ts vows destruction,
    Ferd's mother dreams that the fortress has burned and its inhabitants have died.
    Ferd replies with a speech accepting death, fate, and divine protection.
  language: English
  quote_policy: summarized
