canonical_text:
  quote: ''
  summary: Mihrab of Kabul, descended from Zohak, receives Zal. Rudabeh, Mihrab's
    secluded daughter, is described as extraordinarily beautiful. Zal falls in love
    with her by report, and Rudabeh in turn falls in love after hearing Mihrab praise
    Zal. Her attendants first object to Zal because of his white hair and association
    with the Mountain Bird, then agree to help. In spring they approach Zal's camp
    while gathering roses by a stream, speak with Zal's servant, and indirectly propose
    the union of Zal and Rudabeh. Zal sends back gems, robes, and two rings secretly.
  language: English
  quote_policy: summarized
