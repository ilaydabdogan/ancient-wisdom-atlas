canonical_text:
  quote: ''
  summary: Rustem rides Rakush toward Alberz, overcomes hostile troops, and finds
    a young man at a streamside banquet. The young man reveals himself as Kai-kobd
    after Rustem explains that Zl sent him to seek Kai-kobd. During the feast, Kai-kobd
    recounts a dream in which two white falcons from Persia crown him; Rustem interprets
    the dream as referring to Zl and himself investing Kai-kobd with kingship. Rustem
    escorts Kai-kobd toward Persia, defeats enemies including Keln, and brings the
    monarch to his father's house. After seven days of council, Kai-kobd is crowned
    on an ivory throne, and his warriors urge war against Afrsiyb.
  language: English
  quote_policy: summarized
