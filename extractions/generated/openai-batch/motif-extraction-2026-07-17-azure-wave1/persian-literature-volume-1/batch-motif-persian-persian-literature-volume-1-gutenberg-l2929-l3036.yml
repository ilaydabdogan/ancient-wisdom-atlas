canonical_text:
  quote: A child will be born of mighty power, who will become the wonder of the world.
  summary: Sindokht secures Sam's support for Zal and Rudabeh's marriage through an
    embassy with rich gifts. Minuchihr consents after consultation with astrologers,
    who predict a heroic child. Rudabeh suffers dangerously near childbirth; Zal burns
    the Simurgh's feather, and the Simurgh appears, predicts the child's greatness,
    and gives saving advice. Rustem is born prodigiously strong and rapidly matures.
    His grandfathers Sam and Mihrab celebrate him, while Sam prays that Rustem become
    a benefactor rather than a tyrant.
  language: English
  quote_policy: quoted
