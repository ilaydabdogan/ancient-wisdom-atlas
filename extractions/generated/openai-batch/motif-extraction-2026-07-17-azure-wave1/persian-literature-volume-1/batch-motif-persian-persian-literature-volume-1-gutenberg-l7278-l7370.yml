canonical_text:
  quote: ''
  summary: Saiwush resists Sdveh's attempt to hold him, after which she tears her
    dress and accuses him. Ks tests the case by scent and concludes Saiwush is innocent,
    but later orders a fire ordeal. Saiwush prays, enters the flames in ceremonial
    attire, and emerges unharmed. He then seeks command in war to escape Sdveh's machinations.
    After fighting near Balkh, Afrsiyb is terrified by a dream of serpents, eagles,
    heat, blood, defeat, captivity, and a youthful attacker; interpreters are consulted.
  language: English
  quote_policy: summarized
