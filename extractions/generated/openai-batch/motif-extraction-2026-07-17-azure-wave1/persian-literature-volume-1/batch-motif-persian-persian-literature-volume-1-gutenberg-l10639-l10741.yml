canonical_text:
  quote: ''
  summary: Kai-khosru turns from sovereignty to devotion, resists the pleas of nobles,
    Zl, and Rustem, reports a mysterious warning that his departure is near, distributes
    wealth and offices, appoints Lohursp as successor, announces a dream-revealed
    fountain where he will surrender his life, and begins his final journey while
    companions mourn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kai-khosru becomes attached to a religious life, thinks only of devotion to
    God, abandons the duties of sovereignty, and commits state affairs to ministers.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Chiefs and warriors respectfully remonstrate and ask him to divide his day
    between ruling and religious exercises.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kai-khosru refuses the request and says that one heart is not equal to both
    duties, that his affections are not for the transitory world, and that he trusts
    to inhabit the world to come.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The people ask Zl and Rustem to intervene, saying that an evil eye or Ibls
    has led the king astray and darkened the country with sorrow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Kai-khosru tells Zl and Rustem that he is weary of life’s troubles and anxious
    to prepare for a future state.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kai-khosru reports that a mysterious voice told him that the time of departure
    is near, that he should prepare the load for the journey, and that he should not
    neglect the warning angel.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kai-khosru says the palace is not the place for him and that he must seek
    a solitary cell where he will resign his soul to heaven.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The next day Kai-khosru gathers his great men and warriors, declares that
    he resigns the pageantry of kings, and says farewell.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kai-khosru orders tents pitched in the desert, opens his treasury, holds a
    seven-day feast, and distributes food and money to the indigent, widows, orphans,
    and destitute persons.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'Kai-khosru grants territories and offices: Rustem receives Zbul, Kbul, and
    Nm-rz; Lohursp is appointed successor; Gdarz is appointed chief minister; Gw receives
    chief command of the armies; Ts receives Khorassn; and Frburz is told to obey
    Lohursp.'
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Some warriors murmur that the son of Kai-ks should be placed under Lohursp,
