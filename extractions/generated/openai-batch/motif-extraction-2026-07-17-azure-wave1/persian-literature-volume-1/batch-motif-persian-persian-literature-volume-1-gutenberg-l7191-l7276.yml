canonical_text:
  quote: ''
  summary: Sdveh contrives to bring Saiwush into the women’s apartments under the
    pretense that he should choose a royal bride. Saiwush suspects artifice but obeys
    the king. Sdveh embraces him and later arranges to be alone with him, openly declaring
    her desire and urging him to take her after the king’s death. Saiwush regards
    the proposal as demonic temptation and treachery toward his father. He offers
    instead to marry Sdveh’s daughter. Sdveh persists, uses incantations, declares
    long-unrequited love, threatens his life, and Saiwush refuses.
  language: English
  quote_policy: summarized
