canonical_text:
  quote: ''
  summary: The princess pleads with her father not to kill Jemshd, and he relents
    enough to promise aid. Jemshd distrusts King Greng and flees after learning the
    vizirs may detain him out of fear of Zohk. While wandering toward Chn and Ind,
    Jemshd sleeps by a tower, is recognized by Zohk's envoy, chained, and sent to
    Zohk. Zohk mocks his fallen kingship and orders him sawn in two. Jemshd's wife
    later poisons herself from grief. His sisters Shahrnz and Arnawz are said to have
    been seized and held in Zohk's harem until Feridn releases them. The passage closes
    by describing Zohk's cruelty, including serpents fed on human brains and daily
    youth victims.
  language: English
  quote_policy: summarized
