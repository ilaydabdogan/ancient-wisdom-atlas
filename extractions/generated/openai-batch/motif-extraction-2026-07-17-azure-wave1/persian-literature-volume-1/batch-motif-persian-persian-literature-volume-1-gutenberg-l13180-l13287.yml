canonical_text:
  quote: ''
  summary: Shughad, whose birth was accompanied by a prophecy that he would ruin the
    house of Sm and Narmn, conspires with the king of Kbul to kill Rustem. They lure
    Rustem toward a sporting ground by means of a staged insult and hidden sword-lined
    pits. Rakush senses danger but is forced onward; horse and rider fall repeatedly
    and emerge gravely wounded. Rustem recognizes Shughad's treachery, rejects the
    king's feigned aid, and says Fermurz will avenge him.
  language: English
