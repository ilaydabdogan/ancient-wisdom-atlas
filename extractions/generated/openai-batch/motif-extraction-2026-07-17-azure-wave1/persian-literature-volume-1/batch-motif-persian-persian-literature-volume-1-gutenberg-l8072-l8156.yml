canonical_text:
  quote: ''
  summary: Prn pursues the fugitives after Kulbd's defeat. Ferangs recognizes Prn's
    banner and wakes Khosru and Gw. Gw refuses to let the young destined king Khosru
    enter battle, confronts Prn, captures him with a kamund, and disperses the Tartars.
    Ferangs then pleads for Prn because he previously saved her and Khosru from Afrsiyb.
    Khosru resolves Gw's oath to stain the earth with Prn's blood by proposing a symbolic
    ear-wounding, after which Prn is freed.
  language: English
  quote_policy: summarized
