canonical_text:
  quote: ''
  summary: Zohak’s serpents spread terror, leading Persian nobles to abandon Jemshid.
    Zohak gains the crown and sends spies after the defeated, wandering Jemshid, who
    reaches Zabulistan. There, King Gureng’s warrior daughter, whose marriage to Jemshid
    and future son had been foretold by her Kabul nurse-sorceress through celestial
    signs, encounters Jemshid at the royal garden gate. After a slave-girl reports
    his presence, the princess invites him in with wine and hospitality, asserts her
    freedom to choose, and Jemshid becomes enamored as she leads him into the garden.
  language: English
  quote_policy: summarized
