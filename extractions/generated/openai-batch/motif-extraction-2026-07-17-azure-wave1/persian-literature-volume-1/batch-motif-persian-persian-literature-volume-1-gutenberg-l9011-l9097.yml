canonical_text:
  quote: ''
  summary: Rustem reports success to Kai-khosru, continues campaigning, kills the
    cannibal king Kafr, ravages Khoten, and provokes Afrsiyb to recruit the giant-like
    king Pladwund. Pladwund captures and wounds several Persian warriors, but Rustem
    liberates them and defeats Pladwund in single combat. Pladwund escapes by pretending
    to be dead, after which Afrsiyb flees and abandons his camp. Rustem sends booty
    to Kai-khosru, receives royal honors and rich gifts, and returns to Zbul with
    public admiration.
  language: English
  quote_policy: summarized
