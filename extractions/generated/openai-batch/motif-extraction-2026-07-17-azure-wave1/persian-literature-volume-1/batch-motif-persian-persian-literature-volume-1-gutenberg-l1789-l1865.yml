canonical_text:
  quote: ''
  summary: Kandr reports to Zohak that Feridun and other warriors have overthrown
    his power, released Shahrnaz and Arnawaz, destroyed the talisman, and dissolved
    his magic. Zohak loses the support of army and people, attempts a night attack
    on Feridun, is struck by Feridun's cow-headed mace, and is spared immediate death
    by a supernatural command that he be chained in a dark cave on a mountain. The
    passage closes by praising Feridun's justice and generosity.
  language: English
  quote_policy: summarized
