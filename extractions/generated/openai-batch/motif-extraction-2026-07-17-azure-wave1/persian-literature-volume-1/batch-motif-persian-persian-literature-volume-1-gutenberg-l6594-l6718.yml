canonical_text:
  quote: "“Thus Jemshd fell, and thus must Rustem fall.”"
  summary: Rustem prepares for renewed combat by giving death-contingency instructions
    and reflecting on fate. At dawn Sohrb suspects the opponent is Rustem, possibly
    his father, but Hmn discourages the thought. Sohrb asks for peace, friendship,
    and Rustem’s name; Rustem refuses. The two wrestle, Sohrb throws Rustem and is
    about to kill him, but Rustem deceives him by invoking a combat law requiring
    two falls. Sohrb releases him, and Hmn rebukes Sohrb for sparing a dangerous foe.
  language: English
  quote_policy: quoted
