canonical_text:
  quote: ''
  summary: Bahman begins his reign with public approval but soon seeks vengeance against
    Rustem's family for Isfendiyr's death. He invades Sstn, threatens Zl, plunders
    his house, fetters him, defeats and executes Fermurz after a battle aided by a
    dust-bearing hurricane, and nearly orders a massacre before Bashtan persuades
    him to show mercy. Bahman later dies from a snakebite and transfers the throne
    to his wife Hma under a conditional succession arrangement.
  language: English
  quote_policy: summarized
