canonical_text:
  quote: '"In this Cup, this mirror bright, / All that''s dark is brought to light"'
  summary: Kai-khosru uses a wondrous Cup associated with Jemshid to locate Byzun
    in a dismal cave with Manjeh beside him. He summons Rustem, who goes in disguise
    as a merchant with a caravan. Manjeh approaches Rustem, tells him of Byzun's imprisonment
    and her own fall from royal status for love of him, and explains that she feeds
    him bread and water through a fissure. Rustem hides his seal-ring in a roasted
    fowl and sends it to Byzun through Manjeh; Byzun recognizes Rustem's name on the
    ring and is joyful, then asks Manjeh to keep his secret.
  language: English
  quote_policy: quoted
