canonical_text:
  quote: ''
  summary: Rustem prepares for an unavoidable battle with Isfendiyr despite Zl's grief
    and counsel for peace. Both champions arrange for their forces to stand back and
    engage in single combat, invoking God or Heaven as their only support. Their duel
    passes through multiple weapons and leaves both men and horses exhausted. Meanwhile
    Zra provokes the Iranians; Nshwer kills Alwa, then Zra kills Nshwer, causing a
    rout in which many are slain.
  language: English
  quote_policy: summarized
