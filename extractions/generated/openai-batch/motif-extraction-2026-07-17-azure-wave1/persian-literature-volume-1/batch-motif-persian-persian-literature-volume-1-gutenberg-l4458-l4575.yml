canonical_text:
  quote: ''
  summary: Rustem enters a gloomy cavern, confronts the White Demon, survives a violent
    struggle, kills the demon, and removes its heart. He washes and prays in gratitude,
    then returns with the heart whose blood cures Kai-ks and his warriors of blindness.
    The restored king rejoices, resumes his throne, and continues the campaign against
    Mazinderan, whose ruler refuses submission.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Rustem advances to a cavern and looks down into a gloomy place described as
    dismal and infernal.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A hair-covered, mountain-form monster appears in the cavern, asleep at first
    and then awakened by Rustem's shouts.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The awakened demon seizes a huge mill-stone and challenges Rustem, asking
    for his name before destroying him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Rustem identifies himself as Rustem, sent by his father Zl, descended from
    Sm Swr, and seeking revenge because the King of Persia is imprisoned in Mzindern.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The demon reacts with terror to the name of Sm Swr, then hurls the mill-stone
    at Rustem, who avoids the blow.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Rustem strikes the demon with his sword, wounds and lops the demon's thigh,
    and then grapples with him in a struggle that shakes the cavern and makes both
    bleed.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: During the struggle, Rustem thinks that surviving the day would make his life
    immortal, while the White Demon despairs of returning to Mzindern.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Rustem gathers power described as vouchsafed by favoring Heaven, throws the
    White Demon to the ground, kills him, and tears out his heart.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: After the White Demon is overthrown, crowds of demons fall as part of him,
    while others tremble and flee.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: Rustem leaves the cave, removes his helm, mail, and royal girdle, washes his
    face and body with water, chooses a pure place, and prays to praise his Maker.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: After praying, Rustem releases Ald from a tree, gives him charge of the White
    Demon's heart, and continues toward Ks at Mzindern.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Ald asks for a reward, and Rustem again promises that Ald will be appointed
    governor of the country after the Demon-king is subdued.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: Rustem reports his deeds to his sovereign and applies the White Demon's heart-blood
