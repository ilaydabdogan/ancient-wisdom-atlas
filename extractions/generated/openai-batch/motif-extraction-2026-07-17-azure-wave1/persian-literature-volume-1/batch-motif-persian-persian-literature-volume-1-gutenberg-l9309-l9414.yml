canonical_text:
  quote: ''
  summary: Manjeh sees a beautiful youth beneath a cypress tree and sends her nurse
    to learn his name. The youth, Byzun, identifies himself as the son of Gw, says
    he came from Irn by royal permission to destroy wild boars, and asks the nurse
    to introduce him to Manjeh. Manjeh invites him into her tent, where he is received
    with luxury and feasting for three days. When departure comes, Manjeh has a narcotic
    given to him and secretly has him carried in disguise into Trn and the palace
    of Afrsiyb. Byzun wakes, fears betrayal and danger, but remains with her. Their
    relationship is discovered, terrifying the guards and provoking Afrsiyb's angry
    denunciation of daughters and women.
  language: English
  quote_policy: summarized
