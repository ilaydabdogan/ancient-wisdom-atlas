canonical_text:
  quote: ''
  summary: A messenger reports Feridn's denunciations and Minchihr's warlike appearance
    to Slim and Tr. The brothers advance toward Irn with a large army. Feridn waits
    strategically, appoints commanders, and Minchihr stands at the center under the
    sacred banner of the blacksmith. Tr challenges Minchihr's legitimacy; Kabd accuses
    the brothers of murdering Irij, and Minchihr declares that he seeks vengeance
    for Irij. After a bloody battle, Minchihr is victorious with Heaven's favor. He
    defeats a night attack, kills Tr, sends Tr's head to Feridn, pursues Slim to a
    fort, and kills the warrior Kak after Kak's failed sally.
  language: English
  quote_policy: summarized
