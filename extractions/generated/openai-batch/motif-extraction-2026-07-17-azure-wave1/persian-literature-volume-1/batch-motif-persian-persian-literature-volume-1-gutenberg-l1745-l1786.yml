canonical_text:
  quote: ''
  summary: Kavah guides Feridn toward the Tigris. After an unanswered call for boats,
    Feridn rides into the river and his army follows safely. Feridn reaches Zohk's
    lofty tower, overthrows its talisman, defeats enchanted beings with his mace,
    releases imprisoned damsels including Shahrnz and Arnawz, and takes Zohk's throne
    and treasure while Zohk is away. Arnawz explains that Zohk has gone toward Ind/Hindustan
    to confront Feridn or gain a magician's aid.
  language: English
  quote_policy: summarized
