canonical_text:
  quote: ''
  summary: Rustem, released and restored after prayer at a flood, returns to combat
    with Sohrb. The two wrestle again, and Rustem mortally wounds the youth. As Sohrb
    dies, he says he had sought his father Rustem and identifies a bracelet from his
    mother as proof. Rustem realizes he has slain his own son, grieves, and his delayed
    return causes his army and Persia's monarch to fear that Rustem is dead.
  language: English
  quote_policy: summarized
