canonical_text:
  quote: ''
  summary: Rustem demands the Khakn of Chn surrender royal goods and elephants as
    trophies for Kai-khosru. After a fierce battle, the Khakn seeks peace, but Rustem
    repeats his demands. When the Khakn responds with abuse, Rustem nooses him from
    his white elephant, binds him, and kills him. The passage reflects on the decrees
    of Heaven and reversals of fortune. Prn-wsah counsels flight, Rustem celebrates,
    and Afrsiyb vows revenge and prepares a new army.
  language: English
  quote_policy: summarized
