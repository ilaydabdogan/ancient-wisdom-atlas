canonical_text:
  quote: ''
  summary: A sequence of lyric passages attributed to Hfiz addresses a powerful beloved
    or friend whose beauty, lips, face, fragrance, bounty, and favor overwhelm the
    speaker. The passage uses imagery of intoxication, veil and revelation, rose and
    fire, tears as a deluge greater than Noah's flood, a broken heart offered for
    sale, love as a master who bends the soul toward wine, the pursuit of truth as
    an inner sun, readiness to devote head and heart, mountains and barren plain,
    a lost signet, Majnun's passing, the eye as a chamber for the beloved, and the
    breast as a treasure shrine of love.
  language: English
