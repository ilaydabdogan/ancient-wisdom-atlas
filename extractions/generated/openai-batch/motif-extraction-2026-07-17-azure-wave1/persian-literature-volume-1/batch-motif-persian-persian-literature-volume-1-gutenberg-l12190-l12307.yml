canonical_text:
  quote: ''
  summary: Isfendiyr arranges a banquet in the fortress under the pretext of fulfilling
    a vow. The guests become intoxicated; a fire signal is lit; Bashtan attacks the
    gates; concealed warriors are released from chests; Isfendiyr kills Arjsp and
    later Kahram. He proclaims pardon to those who submit, subdues the surrounding
    provinces, and takes possession of the defeated royal household and treasure.
  language: English
  quote_policy: summarized
