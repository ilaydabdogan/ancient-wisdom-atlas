canonical_text:
  quote: ''
  summary: Feridn urges reconciliation among his sons. Irij travels to his elder brothers,
    is admired by their troops as kingly, and becomes the object of renewed fear and
    hostility. Slim urges Tr to kill him. Irij renounces royal power and begs for
    peace and life, but Tr strikes him, beheads him, and sends the embalmed head to
    their father with cruel words about crown and throne.
  language: English
