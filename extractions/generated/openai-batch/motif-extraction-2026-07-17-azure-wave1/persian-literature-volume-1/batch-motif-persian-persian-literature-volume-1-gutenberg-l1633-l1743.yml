canonical_text:
  quote: |-
    On his javelin's point
      He fixed his leathern apron for a banner
  summary: Zohk prepares against a young enemy by mustering his realm. Kavah the blacksmith
    protests the planned killing of his children for serpent-food, tears the royal
    register, raises his apron as a banner, gathers the people, and joins Feridn.
    The banner becomes a sacred royal sign. Feridn receives a cow-headed mace, sacred
    instruction in magic, and survives an attempted murder by his elder brothers.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Zohk summons nobles and philosophers, reports fear of a young enemy known
    for prowess and wisdom, and proposes an army made up of Men, Demons, and Peris.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zohk orders an annually revised register or muster-roll of all people of every
    age in his dominions, and the register is prepared.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kavah is identified as a strong and brave blacksmith with a large family,
    and two of his children are selected to be killed to feed the serpents.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Kavah speaks angrily before the king, asking why the brains of his beloved
    children should be given as serpent-food.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The king releases Kavah's sons, then orders Kavah's name to be written in
    the register; Kavah tears the register and casts it underfoot.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: The nobles complain that Kavah's defiance was permitted, while Zohk says Kavah's
    grief amazed him and that destiny is veiled.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kavah publicly declares the nation's wrongs, fixes his leather apron on a
    javelin as a banner, and gathers crowds calling for justice and union with Feridn.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When Kavah finds Feridn, the leather banner is adorned with gold and jewels,
    called the flag of Kavah, and described as a sacred symbol and true sign of royalty
    honored by later kings.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Feridn proceeds against Zohk with Kavah's advice; his mother prays for him,
    his two elder brothers accompany him, and Kavah makes him an iron mace shaped
    like a cow's head.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: At a shrine or pilgrimage place, Feridn asks for inspiration and aid and is
    taught the mysteries of magic by a radiant personage who gives him a key to every
    secret.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Feridn's elder brothers envy him, roll a heavy rock from a mountain toward
    him while he sleeps, and Feridn stops the stone by sorcery before later sparing
    and elevating them.
  category: sequence
  evidence_refs:
  - ev:9
