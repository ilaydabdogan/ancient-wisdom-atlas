canonical_text:
  quote: ''
  summary: Afrsiyb's expedition against Kbul and Zbul is defeated by Zl. Afrsiyb kills
    the captive Nauder and later kills his own brother Aghrras when Aghrras is proposed
    as a rival king. Zl shelters displaced royal figures and warriors, seeks a ruler
    of Feridn's line, summons Zau, and Zau is enthroned, defeats Afrsiyb's position,
    reigns five years, and is succeeded by Garshsp.
  language: English
  quote_policy: summarized
