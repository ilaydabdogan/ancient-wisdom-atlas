- id: obs:3
  text: The two wolves rush toward Isfendiyr's legions near a forest and murmuring
    stream; the people shoot them with arrows.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Bashtan attacks one wolf and Isfendiyr attacks the other; both wolves are
    left lifeless.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the first obstacle, Isfendiyr says it has been extinguished through
    the favor of Heaven, and Kurugsar expresses amazement at the bravery displayed.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: After the first stage, the warriors and party dismount, feast, drink wine,
    and repose until morning.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
