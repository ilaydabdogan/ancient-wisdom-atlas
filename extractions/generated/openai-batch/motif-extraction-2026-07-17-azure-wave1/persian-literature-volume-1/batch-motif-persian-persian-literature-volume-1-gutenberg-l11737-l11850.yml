canonical_text:
  quote: ''
  summary: The passage narrates the first three stages of Isfendiyr's journey. Kurugsar,
    kept bound as guide, leads Isfendiyr, Bashtan, and the warriors into wilderness.
    They encounter and kill two monstrous wolves, then a lion and lioness. Kurugsar
    next warns of a fire-associated, poison-foaming dragon. Isfendiyr constructs a
    spiked wheeled machine, enters it, and the dragon attempts to swallow the horses
    and car, but the machine wounds and chokes it and the dragon ejects poison.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Isfendiyr keeps Kurugsar in bonds among the retinue, takes his brother Bashtan,
    and proceeds into a desert wilderness under Kurugsar's direction.
  category: sequence
  evidence_refs:
  - ev:1
