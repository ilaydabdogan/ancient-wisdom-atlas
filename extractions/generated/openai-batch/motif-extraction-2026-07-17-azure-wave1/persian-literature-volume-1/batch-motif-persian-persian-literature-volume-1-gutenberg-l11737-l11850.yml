    and lioness are encountered near the close of day.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Isfendiyr chooses to attack both lions himself so that Bashtan will not be
    exposed to harm, and he kills the lion and then cuts off the lioness's head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kurugsar describes the next danger as an enormous dragon with power to fascinate,
    fire around it, mountain-like bulk, a fearful roar, poison-foam, and devouring
    jaws.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Isfendiyr orders a wheeled apparatus like a carriage to be made, fastens pointed
    instruments to it, harnesses horses to it, and tests its motion.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At the third stage, Kurugsar says he smells the stench of the dragon; Isfendiyr
    dismounts, enters the machine, shuts the door, and drives toward the monster.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Bashtan and the warriors weep and lament when Isfendiyr enters the machine,
    believing he is going to destruction, but he tells them to be silent.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The dragon hears the rumbling wain, smells a human scent, and stretches open
