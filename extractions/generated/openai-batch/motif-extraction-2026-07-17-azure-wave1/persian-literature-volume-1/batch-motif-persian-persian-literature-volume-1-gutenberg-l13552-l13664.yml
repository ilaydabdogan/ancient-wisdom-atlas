canonical_text:
  quote: ''
  summary: During a storm, Drb sleeps beneath a broken arch. A supernatural voice
    warns the arch not to fall because the sleeper is destined for the Persian throne.
    After Drb is removed, the arch collapses. Rishnawd investigates, recognizes Drb
    by a ruby on his arm as Bahman's son and Hma's son, gives him honor and military
    command, and Drb wins victories against the Rms. Hma receives the ruby, recognizes
    Drb as her son, makes offerings at the Fire-altar, embraces him, and yields the
    crown and throne to him.
  language: English
  quote_policy: summarized
