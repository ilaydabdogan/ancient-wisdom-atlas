  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Frburz and Ts treated the expedition as easy, but their army found the ground
    in flames, hot wind, many deaths by heat, a fort suspended in mid-air, and no
    visible gate or door; after a week they returned defeated.
  category: sequence
  evidence_refs:
  - ev:4
