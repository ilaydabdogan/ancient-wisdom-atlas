canonical_text:
  quote: ''
  summary: 'Ts and Gdarz dispute whether Frburz or Kai-khosru should succeed Ks. Ks
    sets a trial: each claimant must attack the fiery demon-fortress Bahmen with equal
    forces, and the conqueror will become sovereign. Frburz and Ts fail after suffering
    from supernatural fire. Khosru, aided by a heavenly dream, the written name of
    God on a javelin, prayer, and his companions, extinguishes the fire, defeats demons,
    enters the fortress, builds a temple, and returns victorious.'
  language: English
  quote_policy: summarized
