canonical_text:
  quote: ''
  summary: Grd-afrd arms herself in male guise, rides from the fort, and challenges
    Sohrb. After an exchange of arrows, lance, and javelin, Sohrb unhelms her, discovers
    she is a woman, and captures her with a noose. She uses beauty and persuasive
    speech to protect his honor and induce him to let her reach the castle gate, where
    she escapes to her friends. From the walls she urges him to leave and warns that
    King Ks and Rustem will destroy his host. Sohrb, angered at being deceived and
    losing his prey, pillages the suburb-town and vows renewed attack on the fort.
  language: English
  quote_policy: summarized
