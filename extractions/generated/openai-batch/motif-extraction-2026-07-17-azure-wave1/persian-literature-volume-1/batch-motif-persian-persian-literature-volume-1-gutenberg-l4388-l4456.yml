canonical_text:
  quote: ''
  summary: In the sixth and seventh stages of Rustem's labors, Rustem kills the Demon
    chief Arzang, releases Ald, reaches the captive and blinded Kai-ks, receives instructions
    to confront the White Demon beyond the Seven Mountains, learns that the White
    Demon's heart-blood can cure blindness, attacks sleeping Demons in a cavern, and
    hastens toward the White Demon.
  language: English
  quote_policy: summarized
