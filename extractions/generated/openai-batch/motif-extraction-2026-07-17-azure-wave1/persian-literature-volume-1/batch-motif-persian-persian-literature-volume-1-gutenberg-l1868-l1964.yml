canonical_text:
  quote: ''
  summary: Feridn arranges marriages between his three sons and the three daughters
    of the King of Yemen, then divides his empire among the sons. Slim and Tr resent
    that Irij receives Persia, described as the best portion, and they send a threatening
    message. Feridn counsels peace and warns Irij, who chooses to renounce throne
    and dominion rather than fight his brothers.
