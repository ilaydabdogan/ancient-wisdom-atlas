canonical_text:
  quote: ''
  summary: Rustem advances with the Persian army against Afrsiyb to avenge Saiwush.
    Fermurz captures Sarkh, Afrsiyb's son, who is executed despite pleading friendship
    with Saiwush. Afrsiyb gathers the Trnian army. Plsam challenges Rustem after Afrsiyb
    promises him royal rewards, but Rustem defeats and humiliates him. Afrsiyb then
    fights and is nearly captured, but Hmn rescues him. Rustem pursues the fleeing
    enemy, occupies Trn, rules harshly for years, and later returns toward Persia
    with spoils while Zra devastates places associated with Saiwush.
  language: English
  quote_policy: summarized
