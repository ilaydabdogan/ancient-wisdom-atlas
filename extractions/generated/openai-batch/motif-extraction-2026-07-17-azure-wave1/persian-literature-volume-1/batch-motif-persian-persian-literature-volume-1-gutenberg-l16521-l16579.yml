canonical_text:
  quote: ''
  summary: Two lyric sections describe a distressed speaker leaving a forlorn city,
    hearing a bulbul address a rose with counsel about Love, fate, devotion, and the
    fall of Jem's throne. A second section addresses the North Breeze and a carrier
    pigeon as bearers of news of an approaching meeting with the Loved one, asks after
    distant parties, recalls a ruined banquet hall and mansion, and laments absence,
    unattainable glances, and the malefic eye.
  language: English
  quote_policy: summarized
