  text: Sm rejoices, blesses both Zl and the Smrgh, confesses shame for his crime,
    and promises to treat Zl with respect and honor.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Minchihr receives news of Sm and Zl, sends Nauder with a splendid reception,
    and has Zl introduced at court among warriors and great men.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: Zl kisses the earth before Minchihr, receives a golden mace and helm, and
