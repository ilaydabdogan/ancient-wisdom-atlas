canonical_text:
  quote: ''
  summary: Sm dreams that his exposed son Zl is alive, then receives a second dream
    rebuking him for rejecting the child. Sm goes to Alberz, prays for forgiveness,
    and the Smrgh restores Zl to him after giving Zl a protective feather. Zl is received
    by Minchihr, granted royal gifts, prophesied to be mighty, educated by learned
    men, and later governs Zbulistn wisely before traveling to Kbul.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sm has a dream after melancholy reflections, and interpreters declare that
    Zl is still alive despite having been exposed on Alberz.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sm sends people to the mountain to search for Zl, but the search is unsuccessful.
  category: action
  evidence_refs:
