- id: obs:3
  text: In a second dream Sm sees a beautiful young man at the head of an immense
    army, with a banner and a Mbid beside him.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A dream figure rebukes Sm for treating silvery tresses as a crime and says
    Heaven has protected the boy whom Sm treated cruelly.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sm wakes terrified, goes to Alberz, ascends the mountain, weeps, and prays
    for forgiveness and the restoration of his son.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Smrgh hears Sm's lamentations and tells Zl that he has fed, protected,
