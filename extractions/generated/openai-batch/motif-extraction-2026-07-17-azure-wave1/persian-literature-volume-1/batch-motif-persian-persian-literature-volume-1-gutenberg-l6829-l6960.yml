canonical_text:
  quote: ''
  summary: After Rustem has fatally wounded Sohrb, the dying youth asks that vengeance
    cease and that the Tartar host be spared. He explains that he sought his father
    and recalls the mother's token and Rustem's denial of kinship. Rustem, recognizing
    the catastrophe, ends the war, hears accusations against Hujr, is restrained from
    violent frenzy, and asks the King for a healing balm that can restore life. The
    King refuses, and Sohrb dies. Rustem laments killing his son, the warriors place
    the body on a bier, and Rustem burns his martial and royal-looking pageantry until
    it lies in ashes.
  language: English
  quote_policy: summarized
