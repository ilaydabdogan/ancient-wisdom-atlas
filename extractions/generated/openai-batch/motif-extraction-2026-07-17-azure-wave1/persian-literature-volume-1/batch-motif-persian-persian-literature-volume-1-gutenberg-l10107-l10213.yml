canonical_text:
  quote: ''
  summary: After returning defeated to Turan, Afrsiyb accepts the aid of Ssen, a sorceress
    who promises to destroy Rustem and his family through charms rather than weapons.
    Afrsiyb sends Plsam with her, supplied with treasure and gifts, and they establish
    a lavish roadside house of entertainment near Sstn. Meanwhile, at Rustem's feast,
    Ts quarrels with Gdarz and leaves in anger. Rustem insists that guests must be
    protected and sends several men after Ts. Ts reaches Ssen's residence, is drawn
    in by the hospitality and by Ssen's beauty, and hears her claim to be a persecuted
    singing-girl fleeing Afrsiyb and wishing to serve Kai-khosru.
  language: English
  quote_policy: summarized
