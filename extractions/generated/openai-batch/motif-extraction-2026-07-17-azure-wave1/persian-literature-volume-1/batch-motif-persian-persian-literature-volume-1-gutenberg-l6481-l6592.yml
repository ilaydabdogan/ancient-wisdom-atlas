canonical_text:
  quote: ''
  summary: 'Sohrab and Rustem enter single combat without resolving their father-son
    relationship. They fight with lances, swords, clubs, bows, grappling, and a mace.
    Rustem is unable to throw Sohrab, and Sohrab wounds and stuns him. The wider armies
    clash, and Sohrab attacks the Persian host until Rustem calls him back to single
    combat. Night ends the fight; they agree to wrestle the next day. Both sides retire
    to their tents: Sohrab recounts his success, while Rustem reports the youth’s
    strength to the king, who spends the night in despair and prayer.'
  language: English
  quote_policy: summarized
