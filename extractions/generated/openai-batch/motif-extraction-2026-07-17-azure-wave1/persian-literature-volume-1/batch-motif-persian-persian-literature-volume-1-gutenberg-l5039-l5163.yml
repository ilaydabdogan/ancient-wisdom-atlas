  summary: The passage opens the story of Sohrab with a reflection on mortality, strife,
    and kin-slaying. Rustem goes hunting in the wilds of Turan, eats beside a stream,
    and falls asleep. His horse Rakush wanders free and is captured by horsemen after
    killing several of them. Rustem wakes, laments the loss, follows the hoof-tracks
    to Samengan, confronts the king, and accepts hospitality after the king promises
    to recover Rakush if he is within the realm. Rustem attends a banquet and sleeps
    in a perfumed couch.
