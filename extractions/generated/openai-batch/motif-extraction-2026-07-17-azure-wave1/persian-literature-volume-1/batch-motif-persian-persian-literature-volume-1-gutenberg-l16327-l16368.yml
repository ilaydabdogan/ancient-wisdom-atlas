canonical_text:
  quote: ''
  summary: Three short lyric passages praise love, depict the speaker as a beggar
    enamored of a cypress-like beloved, request wine and secrecy, and describe the
    beloved’s beauty at creation igniting the world with love, affecting Adam’s mould,
    confounding Reason, repelling an enemy seeking the beloved’s secret, and ending
    with Hafiz addressing a love-scroll to the beloved after canceling what his heart
    loved best.
