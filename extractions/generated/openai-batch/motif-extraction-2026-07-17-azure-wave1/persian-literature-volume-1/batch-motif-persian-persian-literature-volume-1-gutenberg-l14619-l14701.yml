canonical_text:
  quote: ''
  summary: The passage introduces Edward Fitzgerald's translation of Omar Khayyam's
    Rubaiyat. It describes the poem as independent quatrains filled with roses, nightingales,
    wine, love, feasting, and sensual pleasure, but governed by melancholy, fear of
    death, and Fate. Omar is presented as both mathematician and poet, skeptical toward
    established religion, faintly mystical in longing for knowledge of the invisible,
    and modern in a pessimism compared with nineteenth-century Europe.
