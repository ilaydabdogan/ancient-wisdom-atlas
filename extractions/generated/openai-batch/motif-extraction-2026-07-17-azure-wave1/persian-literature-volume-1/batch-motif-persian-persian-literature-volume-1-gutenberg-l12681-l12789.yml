  summary: Rustem and Isfendiyr exchange boasts and warnings over Gushtsp's command
    that Rustem be bound. Rustem recalls earlier support for Lohursp's kingship, Isfendiyr
    tests Rustem's hand, both agree to feast and then fight the next day, and Rustem
    warns that killing Isfendiyr would bring shame while suspecting Gushtsp of deception.
    The passage ends with renewed threats and Rustem riding home.
