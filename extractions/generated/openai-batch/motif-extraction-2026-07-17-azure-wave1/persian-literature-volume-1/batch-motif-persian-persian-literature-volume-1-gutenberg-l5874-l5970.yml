canonical_text:
  quote: Slave to no Prince, I only bow to God.
  summary: Rustem is greeted by Persian warriors, but the enraged king orders him
    impaled. Rustem denounces the king, invokes his past services to the crown, warns
    of the invader, and withdraws from court. The warriors grieve; Gdarz counsels
    the king against punishing Rustem and urges wisdom. The king relents and orders
    Rustem's return to be sought.
  language: English
  quote_policy: quoted
