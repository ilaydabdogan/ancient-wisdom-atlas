  text: The river called Jihun or Amu by Arabs and Persians and Oxus by Greeks and
    Romans is described as dividing Iran and Turan.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: Sam, also called Sam Suwar, is named as the son of Nariman and is said to
    have vanquished or tamed many animals and terrible monsters.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A furious animal called Sohm is described as having the color and nature of
    fire; Sam made it his war-horse in engagements against demons.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The Simurgh is described as a fabulous animal whose sex is unclear; it tells
