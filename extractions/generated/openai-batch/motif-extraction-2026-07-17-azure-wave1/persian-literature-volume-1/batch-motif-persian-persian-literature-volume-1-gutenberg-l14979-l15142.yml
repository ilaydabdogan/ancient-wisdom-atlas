candidate_motifs:
- id: motif:1
  label: speaking vessel made from former life
  taxonomy_refs: []
  basis: The earthen urn speaks about life and death, and the speaker imagines the
    vessel once lived and drank.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents this as poetic personification; it does not specify
    a full narrative of metamorphosis.
- id: motif:2
  label: humanity formed from earth or clay
  taxonomy_refs: []
  basis: The passage explicitly invokes an old story of saturated earth cast by the
    Maker into human mould.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No specific named creation tradition is identified in the passage.
- id: motif:3
  label: drink before death because the dead do not return
  taxonomy_refs:
  - departure
  basis: The urn tells the speaker to drink while alive because the dead never return;
    later the speaker says none return through the door of darkness to describe the
    road.
  evidence_refs:
  - ev:2
  - ev:16
  confidence: high
  cautions: The motif is framed as counsel and reflection rather than as a narrative
    episode.
- id: motif:4
  label: death as cup offered by an angelic messenger
  taxonomy_refs:
  - afterlife_journey_map
  - departure
  basis: An angel of the darker drink finds the addressee at the river brink, offers
    a cup, and invites the soul to drink.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage does not name the angel or provide a detailed map of the afterlife.
- id: motif:5
  label: soul leaving the clay body
  taxonomy_refs:
  - departure
  basis: The soul can fling dust aside and ride naked on the air of heaven; the body
    is a temporary tent for a death-bound guest.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage uses metaphorical imagery; it does not narrate an actual witnessed
    separation.
- id: motif:6
  label: life as temporary lodging
  taxonomy_refs:
  - departure
  basis: The body is compared to a tent where a sultan rests for one day before the
