canonical_text:
  quote: ''
  summary: A sequence of quatrains presents a speaker seeking a hidden inner self,
    questioning an earthen urn and clay, reflecting on human formation from earth,
    urging wine-drinking before death, depicting the soul and body through images
    of cup, tent, veil, caravan, and darkness, rejecting abstract logic for the grape,
    and ending with skepticism about afterlife reports and the soul's answer that
    it itself is heaven and hell.
  language: English
  quote_policy: summarized
