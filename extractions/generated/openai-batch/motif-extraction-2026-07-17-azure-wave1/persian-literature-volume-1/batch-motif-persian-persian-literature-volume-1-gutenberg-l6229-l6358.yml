  quote: ''
  summary: Sohrab surveys the Persian camp and asks the captive Hujir to identify
    the chiefs by their tents, standards, and followers. Hujir identifies several
    chiefs but withholds Rustem's name, fearing for Rustem's life. Sohrab repeatedly
    asks about the warrior in the green pavilion with the dragon standard and great
    horse, suspects Rustem should be present, offers reward for the truth, and then
    challenges Rustem's reputation through martial and elemental imagery.
  language: English
