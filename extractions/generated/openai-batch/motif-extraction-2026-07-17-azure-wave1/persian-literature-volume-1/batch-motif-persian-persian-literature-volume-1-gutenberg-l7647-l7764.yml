canonical_text:
  quote: ''
  summary: Saiwush is overtaken after flight, captured, fettered, and brought back
    to the palace. Ferangs pleads with Afrsiyb to spare him, but Afrsiyb confines
    her and orders Gerswaz to have Saiwush beheaded while keeping his blood from the
    earth. Kar-zra executes Saiwush after Saiwush prays for a son who will vindicate
    and avenge him. A golden vessel catches the blood, but drops fall on the soil
    and a tree called Saiwush grows there. A tempest and darkness accompany the murder.
    Afrsiyb then orders Ferangs killed to prevent offspring, but Prn intercedes and
    takes charge of her, with Afrsiyb demanding the child after birth.
  language: English
  quote_policy: summarized
