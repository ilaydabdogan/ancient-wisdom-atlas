canonical_text:
  quote: ''
  summary: Afrsiyb challenges Kai-khosru to single combat. Kai-khosru wishes to accept
    in order to avenge Saiwush, but Rustem and Barz dissuade him. Barz takes the field
    instead, confronts Afrsiyb over divided allegiance and the deaths of Saiwush and
    Aghrras, and is wounded in combat. Afrsiyb’s advisers redirect the duel into a
    general attack, and Barz is surrounded until Rustem, Fermurz, and Kai-khosru come
    to his aid. The Trnians flee, Afrsiyb escapes, and Rustem later asks leave to
    rest at Sstn, naming Fermurz and Barz as possible replacements.
  language: English
  quote_policy: summarized
