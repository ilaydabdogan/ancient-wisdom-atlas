canonical_text:
  quote: ''
  summary: After nine months Tahmineh gives birth to Sohrab, who grows into an exceptionally
    strong and swift youth. Tahmineh has concealed his father’s identity, even feigning
    that a daughter was born, but Sohrab demands to know his lineage. She reveals
    Rustem as his father, names Sam and Zal in his heroic line, shows Rustem’s letter
    and gifts, and warns him to keep the secret because Afrasiyab is Rustem’s enemy.
    Sohrab rejects delay, declares that fate cannot be controlled, imagines a father-son
    alliance that will displace Kaus and elevate Rustem, and decides to seek his father.
    He asks for a worthy horse, rejects weaker steeds, mounts a destined steed bred
    from Rakush, gathers followers, receives resources from his grandfather, arms
    himself, and draws Afrasiyab’s delighted attention.
  language: English
  quote_policy: summarized
