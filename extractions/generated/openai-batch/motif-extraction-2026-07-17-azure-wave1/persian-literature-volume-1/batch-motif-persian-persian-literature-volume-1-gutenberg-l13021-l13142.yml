  summary: Isfendiyr refuses Rustem's offers of reconciliation and insists on taking
    him to the king in fetters. Rustem prays that his arrow be directed into Isfendiyr's
    eyes, strikes him with a charmed arrow, and Isfendiyr is mortally wounded. Before
    dying, Isfendiyr entrusts his son Bahman to Rustem's guardianship; Rustem accepts
    despite a warning that Bahman may later seek vengeance.
