canonical_text:
  quote: '"victory''s palm, and regal sway, / Alike the will of Heaven obey."'
  summary: Rustem advises Kai-khosru against a risky combat with Shydah, but Shydah
    insists on fighting. Kai-khosru sends a hostile letter to Afrsiyb and a death-foretelling
    message to Shydah, then wrestles Shydah, kills him with a dagger, and orders honorable
    burial rites. Afrsiyb, grieving for his son, marches to battle and is defeated.
    Kai-khosru pursues him to the borders of Chn, where the Khakn withdraws refuge
    under threat.
  language: English
  quote_policy: quoted
