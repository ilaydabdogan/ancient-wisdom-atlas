  summary: The passage describes Jemshd as a wise ruler associated with inventions,
    agriculture, building, ships, a jeweled aerial throne, the institution of N-rz
    feasting, and a seven-hundred-year deathless and disease-free reign. Afterward
    he becomes proud, receives praise as unequaled, claims supreme beneficence, and
    is punished by God/Heaven with the loss of royal grandeur and terror.
