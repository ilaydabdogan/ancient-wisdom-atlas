canonical_text:
  quote: ''
  summary: Fermurz, equipped with Rustem's armor, weapons, and horse, impersonates
    Rustem in battle against Barz and captures him alive with a noose. Afrsiyb fails
    to rescue Barz and retreats. Kai-khosru orders Barz executed, but Rustem obtains
    a reprieve. Barz's mother Shh-r uses a singing-girl in Rustem's household to send
    him a hidden ring, a file, and horses for escape. Rustem later encounters the
    escapees, attempts to poison Barz with food, and the singing-girl dies after eating
    it.
  language: English
  quote_policy: summarized
