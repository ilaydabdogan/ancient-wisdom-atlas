canonical_text:
  quote: ''
  summary: Gushtsp presses Isfendiyr to accept succession and carry out a campaign.
    Jamsp advises obedience to the father-king, and Kitabn warns her son against trying
    to bind Rustem. Isfendiyr departs despite a bad omen from a camel, sends Bahman
    to Rustem, and meets Rustem through Zl's intervention. Isfendiyr demands that
    Rustem submit to being bound, while Rustem attempts to shift the encounter into
    hospitality; the two avoid bread and salt and instead drink their own wine. Rustem
    later consults Zl and praises Isfendiyr.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker warns that a resolved course would shroud glory and dim the throne,
    and says he would rather remain secluded and free from crime than aspire to reign
    in that way.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gushtsp tells Isfendiyr that he is appointed successor and that the crown
    and throne are his, requiring him to march to the scene of action and accomplish
    the war's object.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gushtsp sends Jamsp to learn Isfendiyr's state of mind; Jamsp advises that
    a father's commands must be obeyed, and Isfendiyr consents to the expedition.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kitabn goes to Isfendiyr, counsels him against the enterprise, says Rustem
    will not be confined in bonds, invokes Rustem's former deeds, and sheds tears.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Isfendiyr says he does not fear Rustem but cannot place ignominious bonds
    on so great a hero; he also says his pledged word requires him to follow his fortune.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The next morning Isfendiyr takes leave of the king and begins marching toward
    Sstn with a vast army and immense treasure.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A camel in advance lies down and cannot be made to rise even after severe
    beating; Isfendiyr orders it killed and continues.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The people interpret the camel incident as a bad omen and wish Isfendiyr not
    to proceed, but he continues because he fears the king would see delay as a pretense.
  category: sequence
  evidence_refs:
  - ev:6
