canonical_text:
  quote: ''
  summary: Manjeh arranges with Rustem for Byzun's rescue and lights a fire to guide
    him. Rustem comes by night with seven warriors, fights a monstrous demon seeking
    revenge for Akwn Dw, removes a stone from the mouth of Byzun's pit, and draws
    the captive up with a kamund. Byzun insists on joining Rustem in a subsequent
    night attack on Afrsiyb's palace. Afrsiyb later musters troops but is defeated,
    and Rustem returns to Irn with spoils; Manjeh is rewarded and the enterprise is
    celebrated.
  language: English
  quote_policy: summarized
