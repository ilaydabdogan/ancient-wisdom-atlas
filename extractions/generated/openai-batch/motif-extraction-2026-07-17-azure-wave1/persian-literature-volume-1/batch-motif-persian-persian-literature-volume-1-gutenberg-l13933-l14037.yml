canonical_text:
  quote: ''
  summary: Sikander compels Kaid of Ind to submit and provide prized possessions,
    marries Kaid’s daughter, and later defeats Far of Kanj by using combustible iron
    engines against elephants. He visits Mekka, consults speaking male and female
    trees that foretell his remaining lifespan and death at Kashan, builds a barrier
    against Yjuj and Mjuj, and kills a guardian dragon at a lofty mountain.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Kaid answers Sikander’s summons by saying he will submit but has four things
    he cannot relinquish: a beautiful daughter, a wise minister, a skilful physician,
    and a very valuable goblet.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: After Sikander demands the four things, Kaid complies; Sikander receives the
    minister and physician, marries Kaid’s daughter at a feast, drinks wine from the
    goblet, and Kaid acknowledges Sikander’s authority.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Far of Kanj refuses Sikander’s demand for allegiance, contrasts himself with
    Kaid, invokes his warrior ancestry, and rejects submission to a Greek.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sikander’s force is described as eighty thousand men, while Far has sixty
    thousand horsemen and two thousand elephants; Sikander’s troops fear the elephants.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Aristtals and other counsellors devise wheeled iron horses with iron riders,
    filled with combustibles and ignited by an armored soldier with a long staff.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The combustible machines explode and blaze, burning and destroying many elephants;
    the remaining elephants and troops flee, and Sikander slays Far and rules Kanj.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: After conquering Kanj, Sikander goes to Mekka with rich presents and offerings.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: 'In another kingdom, two trees are said to speak: a male tree in the day and
    a female tree in the night; people go there to have wishes answered.'
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: At the trees, a terrible sound is interpreted by an attendant priest as meaning
    Sikander has fourteen years left; a later answer says he will die at Kashan and
    will not see his mother or family again.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Inhabitants of a city report being afflicted at night by two demons or giants
    named Yjuj and Mjuj, glossed as Gog and Magog, who devour men, goats, and whatever
    comes in their way.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sikander orders a barrier five hundred yards high and three hundred yards
    wide; the giants cannot scale it, and the inhabitants live without fear of molestation.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: At a strange place with many inhabitants, Sikander sees a lofty mountain reaching
    to the stars; at its foot is a terrible guardian-dragon with open jaws, which
    Sikander kills.
  category: sequence
  evidence_refs:
  - ev:7
