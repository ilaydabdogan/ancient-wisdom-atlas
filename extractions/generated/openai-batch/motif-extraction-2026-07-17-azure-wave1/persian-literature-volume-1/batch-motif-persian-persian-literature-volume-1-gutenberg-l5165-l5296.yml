canonical_text:
  quote: ''
  summary: At night Tahmneh comes to the sleeping Rustem with an attendant carrying
    a taper. She declares love inspired by Rustem's fame, asks him to seek her hand
    from her father, and promises that Rakush will be restored. A Mobid obtains royal
    sanction, the marriage is celebrated, and Rustem gives Tahmneh a magic bracelet
    with instructions for a future daughter or son. At morning he leaves his weeping
    bride, receives his war-horse, and returns toward Sstn and Zbul.
  language: English
  quote_policy: summarized
