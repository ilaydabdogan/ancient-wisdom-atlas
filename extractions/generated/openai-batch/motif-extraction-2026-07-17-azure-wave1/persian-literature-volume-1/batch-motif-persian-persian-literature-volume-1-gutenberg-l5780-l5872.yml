canonical_text:
  quote: ''
  summary: A written royal appeal asks Rustem to rescue the Persian king and realm
    from an invading Tartar/Turkish force led by a formidable young champion. The
    king sends Gw as urgent envoy to Zabul. Rustem receives the message, wonders whether
    the young warrior might be connected to his own lineage or child, then dismisses
    the fear and delays departure with feasting. After repeated urging and several
    days of revelry, the trumpet sounds on the fifth morning and Rustem's force prepares
    to depart.
  language: English
  quote_policy: summarized
