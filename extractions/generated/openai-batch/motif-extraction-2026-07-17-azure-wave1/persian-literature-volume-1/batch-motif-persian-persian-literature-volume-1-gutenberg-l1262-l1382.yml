  summary: A princess and her nurse recognize the fugitive Jemshd despite his denial.
    The princess recalls a prophecy that she would be united with him and bear him
    a son. After emotional entreaty, Jemshd reveals his identity and marries her privately.
    King Greng discovers the marriage, hears the nurse and daughter defend it as destined,
    and secretly resolves to betray Jemshd by sending him bound to Zohk for reward.
