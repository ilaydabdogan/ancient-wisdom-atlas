canonical_text:
  quote: ''
  summary: The passage opens the story of Saiwush. Ts, Gw, Gdarz, and horsemen encounter
    a beautiful damsel in the forest near the Jihn. She explains that she fled her
    father Shwer after refusing marriage to Poshang. Ts and Gw quarrel over her, but
    the king takes her himself. She bears Saiwush, whose future greatness is predicted
    by astrologers. Rustem educates Saiwush in Zbulistn in martial, courtly, and royal
    accomplishments. Later Sdveh sees Saiwush, desires him, summons him to her secret
    bower, and he refuses in order not to dishonor his father's house.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At cock-crow, Ts, Gw, Gdarz, and a company of horsemen go hunting near the
    banks of the Jihn and range through a forest.
