  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The damsel says she left home to escape her violent father's anger, crossed
    the river Jihn, traveled several leagues on foot after her horse tired, and had
    spent three days in the forest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The damsel identifies her father as Shwer, of the race of Feridn, and says
