canonical_text:
  quote: ''
  summary: Rustem is settled in Sstn, where he kills Minchihr’s white elephant after
    it breaks loose and tramples people. Zl then sends him to avenge Narmn at an enchanted
    fort on Mount Sipund. Rustem enters by disguising himself and his warriors as
    salt-merchants with hidden weapons, attacks at night, kills the fort leaders and
    defenders, removes treasure, burns and destroys the place, and returns to public
    honor and family blessing.
  language: English
  quote_policy: summarized
