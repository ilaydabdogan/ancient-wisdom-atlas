canonical_text:
  quote: ''
  summary: Piran receives permission from the Khakan to negotiate with Rustem. Piran
    meets Rustem, blesses Kai-khosru, Ferangis, and Rustem, recalls his protection
    of Ferangis and the infant Kai-khosru, and urges peace. Rustem states peace terms
    requiring surrender of those responsible for Saiwush's death, especially Gerswaz,
    and payment of wealth. The Khakan and confederates reject the terms. Shinkul challenges
    Rustem, is wounded and flees, then returns with a force. A wider battle follows
    in which Rustem kills additional challengers and advances toward the Khakan's
    headquarters.
  language: English
  quote_policy: summarized
