canonical_text:
  quote: ''
  summary: Gw discovers the splendid and wealthy city-region of Mzindern and reports
    it to Kai-ks. The king of Mzindern calls on the White Demon, after which darkness,
    hail, rout, blindness, and captivity overtake Kai-ks and the Persian host. Kai-ks
    sends word to Zl for help; Zl commissions Rustem, who chooses the shorter road
    filled with dangers, demons, and sorcery, prepares Rakush, receives his mother's
    farewell, and departs from Sstn to free the captive king.
  language: English
  quote_policy: summarized
