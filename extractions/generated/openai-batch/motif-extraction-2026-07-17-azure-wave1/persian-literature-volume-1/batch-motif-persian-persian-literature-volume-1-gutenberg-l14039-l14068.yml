canonical_text:
  quote: ''
  summary: Sikander ascends a mountain and reaches its summit, where he sees the dead
    body of an old saint adorned with grave-clothes, gems, gold, and jewels. The mountain
    is described as a place sought for knowledge. Sikander hopes to see visions of
    the future from the departed holy man and hears a voice prophesy his conquests,
    fame, and imminent death. He weeps and descends. Later, in Kashn, he falls sick
    and dies according to the oracle and prophecy. Arist, Bilniys the physician, and
    Sikander’s family arrive, find him dead, and mourn for forty days.
  language: English
