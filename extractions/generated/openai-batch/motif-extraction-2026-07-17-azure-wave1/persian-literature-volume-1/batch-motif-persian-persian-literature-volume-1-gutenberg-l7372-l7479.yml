- id: obs:3
  text: Saiwush initially wants to pursue the enemy across the Jihn, but his friends
    dissuade him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A secret council decides to demand one hundred distinguished hostages and
