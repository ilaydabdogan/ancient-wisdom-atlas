canonical_text:
  quote: ''
  summary: A warning interpretation of Afrsiyb's dream predicts disaster if he fights
    Saiwush. Afrsiyb sends Gerswaz with gifts and proposes peace. Saiwush accepts
    terms requiring one hundred hostages and restoration of conquered provinces, but
    Kai-Ks rejects the settlement, appoints Ts to command, and orders Saiwush to return
    with the hostages. Saiwush, unwilling to break his pledged word and recalling
    earlier wrongs including a fire ordeal, chooses exile in Trn, crosses the Jihn
    with three hundred horsemen, and is honorably received by Afrsiyb.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A prophetic interpretation warns Afrsiyb that if he fights Saiwush, his Turkish
    cohorts will be slain and his country will lose its throne and diadem.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Afrsiyb accepts the warning as prudent reason to avoid war and sends Gerswaz
