canonical_text:
  quote: ''
  summary: The passage introduces the Heft-khan of Isfendiyr as a sequence of seven
    labours parallel to Rustem’s. Isfendiyr questions Kurugsar about the road to the
    brazen fortress. Kurugsar describes three routes, including a seven-day road called
    the Heft-khan, divided into seven stages with monsters and dangers. Despite repeated
    warnings, Isfendiyr chooses the dangerous route, trusting divine protection. Suspecting
    Kurugsar’s reliability, he has him bound in chains so he must accompany the expedition.
    Isfendiyr then receives Gushtasp’s blessing, horsemen, and treasure for the campaign
    against Arjsp.
  language: English
  quote_policy: summarized
