canonical_text:
  quote: ''
  summary: The hymn invokes the Muses to sing of Selene, the Moon, whose radiance
    lights heaven, earth, and air. Selene bathes in Ocean, mounts her shining team,
    drives long-maned horses at evening in mid-month, and becomes a sign to mortal
    men when her orbit is full and her beams are brightest. The Son of Cronos joins
    with her in love, and she bears Pandia. The hymn closes with a hail to bright
    Selene and a transition to songs of half-divine men.
  language: English
  quote_policy: summarized
