canonical_text:
  quote: ''
  summary: The passage describes the rim of Heracles' shield, then narrates Heracles
    and Iolaus riding to battle. Athene encourages them and instructs Heracles how
    to kill Cycnus and wound Ares without taking Ares' horses or armor. The opposing
    chariots meet; Heracles warns Cycnus, recalls a previous fight with Ares, and
    then fights Cycnus. Zeus signals the battle with thunder and drops of blood. Cycnus
    strikes Heracles' shield unsuccessfully, and Heracles kills Cycnus with a spear-thrust
    to the neck.
  language: English
  quote_policy: summarized
