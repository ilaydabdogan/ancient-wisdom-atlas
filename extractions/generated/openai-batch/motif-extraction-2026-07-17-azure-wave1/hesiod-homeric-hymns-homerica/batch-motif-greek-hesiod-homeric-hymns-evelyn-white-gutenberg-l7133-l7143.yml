  summary: A short hymn announces praise of Heracles, son of Zeus and Alcmena, born
    in Thebes. It recalls his former wandering over land and sea under King Eurystheus,
    his deeds and sufferings, and contrasts this with his present happy life on snowy
    Olympus with Hebe as wife. The hymn closes by hailing him and requesting success
    and prosperity.
