canonical_text:
  quote: ''
  summary: The passage gives prose summaries of fragments of the Telegony. Proclus
    places the Telegony after the Odyssey and summarizes Odysseus' later travels,
    sacrifices, marriage to Callidice, war in Thesprotis, return to Ithaca, and death
    at the hands of Telegonus, followed by transport to Circe's island, immortalization,
    and further marriages. Eustathius reports a genealogical notice about sons of
    Odysseus by Calypso and Penelope.
  language: English
  quote_policy: summarized
