  quote: ''
  summary: Fragmentary Hesiodic material reports Helen bearing Hermione, Zeus planning
    storm, destruction, and separation between gods and mortals, a seasonal serpent-like
    being dwelling on mountain and in cave, and later testimonia about Iphigeneia
    becoming Hecate, Minos holding Zeus's sceptre, Demeter receiving Cychreus' snake,
    Autolycus making held objects disappear, and people made from stones for Deucalion.
  language: English
  quote_policy: summarized
