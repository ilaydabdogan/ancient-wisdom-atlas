  summary: After a bright goddess has taught all, the goddesses go to Olympus and
    dwell beside Zeus among the gods. Mortals whom the goddesses love are blessed
    by receiving Plutus, who gives wealth. The hymn then invokes queen Deo, linked
    with Eleusis, Paros, and Antron, together with her daughter Persephone, asking
    them to be gracious and to grant substance for the song.
