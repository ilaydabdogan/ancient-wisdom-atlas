canonical_text:
  quote: a mortal man with an immortal goddess
  summary: Aphrodite tells Anchises that she is a mortal maiden taken by Hermes to
    become his wife. She induces desire in him; they lie together on his couch. Afterward
    she puts him to sleep, resumes her divine appearance, wakes him, receives his
    fearful plea, reassures him, and foretells the birth and Trojan rule of Aeneas
    and his descendants.
  language: English
  quote_policy: quoted
