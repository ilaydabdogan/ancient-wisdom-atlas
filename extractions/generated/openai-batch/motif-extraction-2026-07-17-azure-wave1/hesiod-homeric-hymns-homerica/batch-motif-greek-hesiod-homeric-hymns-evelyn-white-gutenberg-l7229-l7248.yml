canonical_text:
  quote: ''
  summary: The hymn to Hephaestus asks the Muses to sing of Hephaestus, famed for
    inventions, who with Athene taught crafts to humans who had formerly lived like
    wild beasts in mountain caves; because of these crafts they now live peacefully
    in houses year-round. The hymn then asks Hephaestus for success and prosperity.
    The hymn to Apollo says that the swan sings of Phoebus by the river Peneus, and
    that a minstrel with a lyre sings of him first and last; the speaker seeks Apollo’s
    favor through song.
  language: English
