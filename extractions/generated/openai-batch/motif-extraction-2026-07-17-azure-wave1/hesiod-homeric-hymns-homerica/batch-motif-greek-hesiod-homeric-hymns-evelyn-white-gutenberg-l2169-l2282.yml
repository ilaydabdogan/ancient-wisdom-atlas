literal_observations:
- id: obs:1
  text: Spring sailing is marked by leaves on the topmost shoot of a fig-tree reaching
    the size of a cow's footprint, but the speaker warns that this sailing is risky
    and may bring death among waves.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker instructs the addressee not to put all goods in ships, but to
    leave the greater part behind and take the lesser part on board.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage states that due measure should be observed and that proportion
    is best in all things.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage advises bringing a wife home at the right age, marrying a maiden
    who has grown up for four years and is in the fifth, preferably one living nearby.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A good wife is described as the best thing a man can win, while a bad, greedy
    wife is described as harming her man and bringing him to raw old age.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage warns against the anger of the deathless gods and gives rules
    for friendship, including not wronging a friend first, repaying wrong double,
    and welcoming reconciliation with satisfaction.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage warns against reputations for lavishness, churlishness, associating
    with rogues, or slandering good men, and says not to taunt a man with poverty
    sent by the deathless gods.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A sparing and orderly tongue is described as a great treasure and pleasure,
    and evil speech is said to bring evil speech in return.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says not to pour libations of sparkling wine to Zeus or the other
    deathless gods after dawn with unwashed hands, because they will not hear the
    prayers and will spit them back.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage gives rules about urination, uncovering oneself, exposure near
    the fireside, and begetting children after burial or after a festival of the gods.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Before crossing ever-rolling rivers on foot, one should pray while looking
    into the water and wash hands; whoever crosses with hands unwashed of wickedness
    makes the gods angry and receives trouble afterward.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: Additional taboos concern cutting at a festival, placing a ladle on a mixing-bowl
    at a wine party, leaving a house rough-hewn, using uncharmed pots, boys sitting
    on unmoved things, washing with water used by a woman, mocking mysteries at a
    burning sacrifice, and polluting river mouths or springs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: Talk is described as mischievous, light, easily raised, hard to bear, difficult
    to remove, never wholly dying when voiced by many people, and in some ways divine.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The speaker instructs the addressee to mark days that come from Zeus, including
    days good for work, supplies, shearing, reaping, weaving, planting, or avoiding
    sowing.
  category: sequence
  evidence_refs:
  - ev:9
