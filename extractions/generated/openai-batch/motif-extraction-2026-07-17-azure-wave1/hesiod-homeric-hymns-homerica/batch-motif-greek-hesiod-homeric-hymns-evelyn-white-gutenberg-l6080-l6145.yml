canonical_text:
  quote: ''
  summary: Apollo tells Cretan strangers that he has brought them over the sea to
    keep his rich temple, gives instructions for landing the ship, making a seaside
    altar, lighting fire, offering white meal, praying to him as Apollo Delphinius
    because he first appeared in dolphin form, feasting and pouring offerings, and
    following him with the Ie Paean to Pytho. The Cretans obey, process with Apollo
    as he plays the lyre, and arrive at Parnassus, where he shows them his sanctuary
    and temple. When they ask how they will live in the poor land, Apollo promises
    abundance from the offerings brought by worshippers, commands them to guard the
    temple and show his will to mortals, and warns that disobedience or outrage will
    lead to subjection under other masters.
  language: English
  quote_policy: summarized
