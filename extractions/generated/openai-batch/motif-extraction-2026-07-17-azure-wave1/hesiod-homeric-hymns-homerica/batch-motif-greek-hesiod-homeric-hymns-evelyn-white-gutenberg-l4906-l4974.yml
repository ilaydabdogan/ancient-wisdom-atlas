canonical_text:
  quote: ''
  summary: 'The passage gives fragments of the Melampodia concerning seers and divine
    signs: Calchas challenges Mopsus to count figs and dies when Mopsus is correct;
    Teiresias laments his long life; Teiresias is transformed after killing mating
    snakes and later is blinded by Hera but given prophetic power by Zeus; other fragments
    mention banquet storytelling, tokens of good or ill from the gods, a silver goblet,
    an ox-handling scene, Chalcis, Amphilochus killed by Apollo, and the inability
    of mortal seers to know Zeus’ mind.'
  language: English
  quote_policy: summarized
