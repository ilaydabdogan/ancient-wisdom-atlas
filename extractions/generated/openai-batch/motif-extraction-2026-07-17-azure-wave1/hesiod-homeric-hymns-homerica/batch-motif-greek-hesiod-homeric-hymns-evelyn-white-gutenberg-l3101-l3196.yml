canonical_text:
  quote: ''
  summary: The passage describes the defeat and confinement of the Titans in Tartarus,
    the cosmic depth and boundaries of Tartarus, the houses and crossings of Night
    and Day, the dwellings of Sleep and Death, the guarded halls of Hades and Persephone,
    the oath-water of Styx and its penalties for perjured gods, and the locations
    of Titans and Zeus's allies near the cosmic limits.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cottus, Briareos, and Gyes launch three hundred rocks at the Titans, conquer
    them, and bury and bind them beneath the earth in Tartarus.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tartarus is described as lying as far beneath earth as earth lies beneath
    heaven, measured by a brazen anvil falling for nine nights and days before reaching
    the next level on the tenth.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Tartarus has a bronze fence, triple surrounding night, roots of earth and
    sea above, bronze gates fixed by Poseidon, and a wall all around.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Titan gods are hidden in misty gloom in a dank place at the ends of the
    huge earth and cannot go out.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: Gyes, Cottus, and great-souled Obriareus live there as trusty warders of Zeus.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage locates the sources and ends of earth, Tartarus, sea, and heaven
    in the same dreadful region.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:7
  text: The gulf is said to be so great that a man inside the gates would be carried
    by blasts for a year before reaching the floor.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The home of murky Night stands there, wrapped in dark clouds.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The son of Iapetus stands immovably before Night's home, holding up the wide
    heaven on his head and hands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Night and Day meet and greet one another at a bronze threshold; the house
    never holds both at once, because one is abroad while the other remains inside
    waiting to journey.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Day holds all-seeing light for those on earth, while Night holds Sleep, the
    brother of Death, in her arms.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: Sleep and Death, children of dark Night, have dwellings where the Sun never
    looks on them with his beams.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: Sleep roams peacefully over earth and sea and is kindly to men; Death has
    a pitiless heart and holds fast whomever he seizes.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: The halls of Hades and Persephone stand in front, guarded by a fearful hound.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:15
  text: The hound fawns on those entering but does not allow them to go out, and devours
