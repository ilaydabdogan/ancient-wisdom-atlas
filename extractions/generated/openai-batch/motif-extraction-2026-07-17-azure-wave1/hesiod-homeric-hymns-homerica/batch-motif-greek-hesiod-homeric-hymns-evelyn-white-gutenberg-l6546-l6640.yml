canonical_text:
  quote: ''
  summary: In a passage from the Hymn to Hermes, Hermes plays the lyre and sings of
    the gods, moving Apollo to joy and desire. Apollo praises the music, calls Hermes
    a trickster and slayer of oxen, and offers honor and gifts. Hermes presents the
    lyre to Apollo, who gives Hermes a shining whip and makes him keeper of herds.
    The two sons of Zeus return the cows, go to Olympus, and Zeus makes them friends.
    Hermes then makes pipes, and Apollo asks Hermes to swear not to steal his lyre
    and bow, invoking the oath by Styx.
  language: English
  quote_policy: summarized
