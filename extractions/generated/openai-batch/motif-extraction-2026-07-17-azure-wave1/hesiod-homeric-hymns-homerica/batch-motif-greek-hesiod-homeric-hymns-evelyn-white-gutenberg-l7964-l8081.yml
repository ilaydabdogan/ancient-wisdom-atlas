canonical_text:
  quote: ''
  summary: 'The passage gives Proclus'' summary of the Little Iliad and several later
    testimonia or fragments: the award of Achilles'' arms, Aias'' madness and death,
    prophecies and retrieved heroes needed for Troy''s capture, the building and entry
    of the wooden horse, Odysseus'' disguises and theft of the Palladium, divine gifts,
    poetic contests, signal lights, and episodes from the sack of Troy.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The arms of Achilles are adjudged; Odysseus gains them through Athena's contrivance,
    after which Aias becomes mad, destroys the Achaean herd, and kills himself.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Odysseus captures Helenus, who prophesies about the taking of Troy; Diomede
    brings Philoctetes from Lemnos, and Machaon heals him.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Philoctetes fights Alexandrus in single combat and kills him; Menelaus outrages
    the body, and the Trojans recover and bury it.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Deiphobus marries Helen; Odysseus brings Neoptolemus from Scyros, gives him
    his father's arms, and the ghost of Achilles appears to him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Eurypylus, son of Telephus, comes to help the Trojans, displays prowess, and
    is killed by Neoptolemus.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: With the Trojans closely besieged, Epeius builds the wooden horse under Athena's
    instruction.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Odysseus disfigures himself, enters Ilium as a spy, is recognized by Helen,
    plots with her for the city's capture, kills certain Trojans, and returns to the
    ships.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Odysseus, helped by Diomedes, carries the Palladium out of Troy.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Hellenes put their best men in the wooden horse, burn their huts, and
    sail the main body to Tenedos.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Trojans think their troubles are over, break part of their city wall,
    take the wooden horse into the city, and feast as though they had defeated the
    Hellenes.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Aias and Odysseus quarrel about their achievements; Nestor advises eavesdropping
    near the walls, where girls are heard disputing the heroes' valor.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: One girl praises Aias for carrying the son of Peleus out of battle; another,
    by Athena's contrivance, says carrying a load is not the same as fighting.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Aias is said not to have been buried in the usual way, but simply in a coffin
    because of the king's anger.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: A storm carries Achilles to Scyros, where he enters an uneasy harbor at night.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: A spear-shaft is described with a hoop of flashing gold and a point fitted
    at each end.
  category: object
  evidence_refs:
  - ev:11
- id: obs:16
  text: A richly blooming golden vine, wrought by Hephaestus and given to Zeus, is
    bestowed on Laomedon as recompense or price for Ganymedes.
  category: object
  evidence_refs:
  - ev:12
- id: obs:17
  text: Machaon is said to have been killed by Eurypylus, son of Telephus.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: Odysseus disguises himself as a beggar-like person by changing clothes and
    putting on rags.
  category: action
  evidence_refs:
  - ev:14
- id: obs:19
  text: In a poetic contest, Homer asks for things that never happened before and
    never shall happen; Hesiod answers with an image of horses wrecking chariots around
    the tomb of Zeus and wins the tripod.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:20
  text: Sinon secretly shows a signal-light to the Hellenes at midnight while the
    clear moon is rising.
  category: action
  evidence_refs:
  - ev:16
- id: obs:21
  text: Fragments concerning the sack of Ilium describe night-battle wounds, Odysseus
    recognizing Helicaon and leading him alive from the fight, and Neoptolemus killing
    several figures including Priam after dragging him from the altar.
  category: sequence
  evidence_refs:
  - ev:17
