canonical_text:
  quote: ''
  summary: The passage invokes Aphrodite's power to stir passion among gods, mortals,
    and animals, then names Athene, Artemis, and Hestia as goddesses she cannot subdue.
    It explains that Zeus imposes desire on Aphrodite for the mortal Anchises so she
    cannot mock other divine-mortal unions. Aphrodite prepares herself at Paphos,
    travels to Ida, inspires wild animals to mate, appears before Anchises in maiden-like
    form, and Anchises responds with love, cult promises, and requests for favor.
  language: English
  quote_policy: summarized
