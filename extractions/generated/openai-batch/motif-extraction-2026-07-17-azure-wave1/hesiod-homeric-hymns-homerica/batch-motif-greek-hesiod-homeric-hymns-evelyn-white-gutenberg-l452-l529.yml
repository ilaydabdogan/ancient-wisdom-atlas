canonical_text:
  quote: ''
  summary: 'The passage recounts an outline tradition about Hesiod’s death: after
    a Delphic warning about death in the grove of Nemean Zeus, he avoids one Nemea
    but dies at Oenoe, another place sacred to Nemean Zeus; his body is cast into
    the sea, returned by dolphins, buried, and later associated with funerary honors.
    A quoted epigram adds Nymphs washing the body with spring water, grave offerings
    of milk and honey, and the Muses’ inspiration. The passage then summarizes the
    structure and moral aim of the Works and Days, including the Two Strifes, Pandora,
    the Five Ages, the Hawk and Nightingale, divine punishment, practical labor advice,
    domestic precepts, and auspicious or inauspicious days.'
  language: English
  quote_policy: summarized
