canonical_text:
  quote: ''
  summary: The passage recounts Zeus carrying off Ganymedes and compensating Tros;
    Eos carrying off Tithonus and obtaining deathlessness for him without youth; and
    a goddess, identified in the speech as Aphrodite, instructing her mortal lover
    about their child, the mountain Nymphs who will rear him, and the secrecy required
    to avoid Zeus's thunderbolt. The goddess then ascends to heaven and the hymn closes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Zeus carried off golden-haired Ganymedes because of his beauty, placed him
    among the Deathless Ones, and made him pour red nectar from a golden bowl for
    the gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tros did not know where the heaven-sent whirlwind had taken his son, mourned
    continually, and then received high-stepping horses from Zeus as recompense.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At Zeus's command, the Guide and slayer of Argus told Tros that Ganymedes
    would be deathless and unageing; Tros then stopped mourning and rejoiced.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Eos rapt away Tithonus, asked Zeus that he be deathless and live eternally,
    and Zeus granted the request; Eos did not ask that Tithonus retain youth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Tithonus lived with Eos by the streams of Ocean at the ends of the earth while
    young, but after old age overtook him, Eos put him in a room with shining doors,
    where he babbles endlessly and lacks his former strength.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaker says she would not wish the mortal addressee to be deathless among
