canonical_text:
  quote: ''
  summary: Demeter enters the house of Celeus in divine radiance while grieving for
    her daughter. Iambe’s jokes cheer her, and Demeter accepts a meal-water-mint drink
    rather than wine. Metaneira asks the disguised goddess to nurse Demophoon. Demeter
    secretly treats the child with ambrosia, divine breath, and nightly concealment
    in fire to make him deathless, but Metaneira sees the fire treatment and cries
    out. Demeter angrily stops the process, declares that the child can no longer
    escape death, reveals herself, commands a temple and altar, promises to teach
    rites, and leaves in an epiphanic transformation.
  language: English
  quote_policy: summarized
