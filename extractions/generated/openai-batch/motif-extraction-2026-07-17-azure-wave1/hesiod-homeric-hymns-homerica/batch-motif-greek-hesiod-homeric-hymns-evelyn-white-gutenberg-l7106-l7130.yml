  summary: The passage contains short hymnic invocations to Hera, Demeter with Persephone,
    and the Mother of the Gods. Hera is praised as Rhea’s daughter, queen of the immortals,
    and sister-wife of Zeus. Demeter is invoked with her daughter Persephone and asked
    to protect the city and guide the song. The Muse is asked to sing of the Mother
    of all gods and men, who delights in instruments, animal cries, hills, and wooded
    places.
