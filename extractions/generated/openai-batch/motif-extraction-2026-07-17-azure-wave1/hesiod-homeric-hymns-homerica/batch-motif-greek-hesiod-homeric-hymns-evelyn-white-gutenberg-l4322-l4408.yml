  summary: The passage introduces Alcmena at Thebes with Amphitryon, recounts Amphitryon's
    exile and imposed vengeance task, narrates Zeus's nocturnal plan and union with
    Alcmena, then describes Alcmena's twin sons Heracles and Iphiclus with distinct
    divine and mortal paternity. It then shifts to Heracles, Iolaus, Cycnus, Ares,
    and Apollo's grove, presenting a martial confrontation with fiery imagery and
    Heracles' instructions to Iolaus.
  language: English
