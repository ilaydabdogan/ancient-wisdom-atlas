canonical_text:
  quote: ''
  summary: 'The passage summarizes fragments of the Aethiopis: Penthesileia and Memnon
    come to aid Troy and are killed by Achilles; Achilles kills Thersites, is purified
    after bloodshed, later kills Memnon, and is himself killed by Paris and Apollo.
    Thetis and other divine mourners lament Achilles and remove him from the pyre
    to the White Island. The Achaeans honor him with a cairn and games, and Odysseus
    and Aias dispute his arms. Additional fragments mention the Amazon''s arrival
    after Hector''s burial and Aias''s suicide around dawn.'
  language: English
  quote_policy: summarized
