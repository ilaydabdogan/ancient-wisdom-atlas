canonical_text:
  quote: ''
  summary: 'Opening of The Battle of Frogs and Mice: the singer invokes the Muses
    and frames an animal war. A thirsty Mouse, Crumb-snatcher, meets the Frog king
    Puff-jaw at a lake. After an exchange of identities and genealogies, Puff-jaw
    invites the Mouse to ride on his back to the Frog house. During the crossing a
    water-snake appears; Puff-jaw dives, the Mouse is left in the water, drowns, and
    foretells vengeance by the Mice.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator invokes the choir of the Muses from Helicon and announces a war
    between Mice and Frogs, saying the Mice rivalled the exploits of Giants.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A thirsty Mouse who had escaped a ferret drinks at the lake brink, where a
    loud-voiced Frog sees him and asks his identity, origin, and parentage.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Frog identifies himself as Puff-jaw, king and continual ruler of the Frogs,
    and offers friendship, a house visit, and guest gifts if the Mouse is worthy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Mouse identifies himself as Crumb-snatcher, gives his parentage and birthplace
    in a mouse-hole, names foods he eats, and says he fears the hawk, ferret, and
    trap.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Crumb-snatcher contrasts his own food and habits with the Frog's watery life
    and says he does not eat lake foods such as radishes, cabbages, pumpkins, leeks,
    or parsley.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Puff-jaw says the Son of Chronos gave Frogs power to live in two elements,
    both on land and under water, and tells the Mouse to mount his back to visit his
    house.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Mouse mounts the Frog's back, first enjoys the swimming, then becomes
    frightened as waves cover him, uses his tail like a steering oar, prays to heaven
    for land, and compares the ride to the bull carrying Europa to Crete.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: A water-snake appears with its neck raised above the water; Puff-jaw dives
    to the lake bottom and leaves the Mouse in the water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Mouse sinks and rises repeatedly, is weighed down by wet fur, and in his
    dying words accuses Puff-jaw of treachery and says Heaven has an avenging eye
    and the Mice will punish him.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
