canonical_text:
  quote: ''
  summary: 'Demeter, grieving and angry, avoids Olympus and goes among mortals with
    altered appearance. At Eleusis she sits by the Maiden Well under an olive shrub,
    looking like an old woman. The daughters of Celeus encounter her while drawing
    water, question her, and hear her account under the name Doso: she says pirates
    carried her from Crete and she escaped. She asks for household work, especially
    nursing a child. Callidice proposes that she come to Metaneira’s house to rear
    Metaneira’s late-born only son; the daughters return with their mother’s invitation
    and lead the veiled goddess to Celeus’ house.'
  language: English
  quote_policy: summarized
