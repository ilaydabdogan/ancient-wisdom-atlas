canonical_text:
  quote: ''
  summary: The hymn opens by remembering far-shooting Apollo in Zeus' house, where
    the gods tremble at his arrival, Leto removes his bow and quiver, and Zeus welcomes
    him with nectar. The poet recalls Leto's children, Apollo and Artemis, and Apollo's
    birth on rocky Delos near Mount Cynthus, a palm-tree, and the streams of Inopus.
    Leto, in labor, roams many lands seeking a place for Apollo; the lands fear to
    receive him until she reaches Delos. Leto offers Delos future honor, temple wealth,
    sacrifices, and sustenance from strangers. Delos agrees but fears Apollo may despise
    and sink the poor rocky island, so it requests a divine oath. Leto swears by Earth,
    Heaven, and the water of Styx that Apollo will have his altar and precinct there
    and honor Delos. After the oath, Delos rejoices, but Leto suffers nine days and
    nights of labor while Hera keeps Eilithyia away out of envy.
  language: English
  quote_policy: summarized
