canonical_text:
  quote: Born with the dawning, at mid-day he played on the lyre
  summary: The opening of the Hymn to Hermes recounts Zeus and Maia's hidden union,
    Hermes's precocious birth, his discovery of a tortoise and invention of the lyre,
    his plotting and theft of Apollo's cattle, his concealment of tracks, his warning
    to an old witness, and his drive of the cattle to the Alpheus where he begins
    to seek the art of fire.
  language: English
  quote_policy: quoted
