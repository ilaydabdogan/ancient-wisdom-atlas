canonical_text:
  quote: ''
  summary: 'The passage gives a sequence of divine genealogies: Night and Strife bear
    personified powers of fate, suffering, conflict, and moral consequence; Sea and
    Earth produce sea deities; Nereus and Doris produce the fifty Nereids; Thaumas
    and Electra produce Iris and the Harpies; Ceto and Phorcys produce the Graiae
    and Gorgons. It then recounts Medusa''s union, beheading by Perseus, the emergence
    of Chrysaor and Pegasus, Pegasus'' service to Zeus, Chrysaor''s line leading to
    Geryones, Heracles'' killing of Geryones and other figures, and the birth and
    subterranean dwelling of Echidna.'
  language: English
  quote_policy: summarized
