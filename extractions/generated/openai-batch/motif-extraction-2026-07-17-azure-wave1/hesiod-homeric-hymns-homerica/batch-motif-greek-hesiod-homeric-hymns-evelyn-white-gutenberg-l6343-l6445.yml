canonical_text:
  quote: ''
  summary: Apollo hears a report, follows an omen and strange backward tracks, and
    reaches the cave at Cyllene where Hermes, son of Zeus and Maia, lies swaddled
    with his lyre hidden. Apollo searches the cave, demands his cattle, threatens
    Hermes with Tartarus, and calls him a crafty robber. Hermes denies knowledge of
    the cattle, stresses his newborn condition, produces a rude omen and a sneeze
    when Apollo carries him, and finally asks that the dispute be judged before Zeus.
  language: English
  quote_policy: summarized
