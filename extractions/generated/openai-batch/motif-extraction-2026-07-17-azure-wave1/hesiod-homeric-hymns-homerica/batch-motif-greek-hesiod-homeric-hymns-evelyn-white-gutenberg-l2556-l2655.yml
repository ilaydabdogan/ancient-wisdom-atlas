- id: obs:1
  text: The speaker asks the Muses, children of Zeus who dwell on Olympus, to tell
    how gods, earth, sea, stars, heaven, divine honors, and Olympus first came to
    be.
  category: speech
  evidence_refs:
  - ev:1
