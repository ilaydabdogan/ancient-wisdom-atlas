canonical_text:
  quote: ''
  summary: The speaker invokes the Muses to recount the origins of gods and cosmos.
    Chaos comes first, followed by Earth, Tartarus, and Eros; Night, Erebus, Aether,
    Day, Heaven, Hills, Pontus, Titans, Cyclopes, and hundred-armed sons are generated.
    Heaven hides his children within Earth, Earth makes a flint sickle and recruits
    Cronos, and Cronos castrates Heaven. From the blood and sea-foam arise further
    beings, including Aphrodite, accompanied by Eros and Desire. Heaven names his
    sons Titans in reproach and foretells vengeance.
  language: English
  quote_policy: summarized
