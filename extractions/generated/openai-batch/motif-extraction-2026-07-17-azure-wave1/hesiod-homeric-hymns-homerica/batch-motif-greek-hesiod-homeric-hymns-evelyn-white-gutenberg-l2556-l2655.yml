candidate_motifs:
- id: motif:1
  label: Creation sequence from primordial Chaos
  taxonomy_refs:
  - chaos
  basis: The passage explicitly states that Chaos came first and then lists the emergence
    of Earth, Tartarus, Eros, Night, Day, Heaven, Sea, and gods.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage gives a genealogical cosmogony rather than a fully narrated
    creation from nothing.
- id: motif:2
  label: Generative Earth as mother of gods and cosmos
  taxonomy_refs:
  - mother_goddess
  basis: Earth is foundational, bears Heaven, Hills, and Pontus, unites with Heaven
    to bear many deities, and later receives blood that generates further beings.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  confidence: high
  cautions: The text does not use the phrase 'mother goddess' in the supplied translation;
    the label is a motif-family classification.
- id: motif:3
  label: Primordial divine union producing cosmic offspring
  taxonomy_refs:
  - sacred_marriage
  basis: Night unites with Erebus to bear Aether and Day, and Earth lies with Heaven
    to bear numerous divine children.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage describes sexual union and generation, but not a formal marriage
    rite.
- id: motif:4
  label: Divine parent-child conflict and violent succession
  taxonomy_refs:
  - divine_parent_child
  basis: Heaven hides his children; Earth recruits Cronos; Cronos ambushes and castrates
    his father; Heaven predicts later vengeance.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  - ev:11
  confidence: high
  cautions: The passage ends before the later vengeance is narrated.
- id: motif:5
  label: Birth of a goddess from sea foam
  taxonomy_refs:
  - sacred_birth
  basis: Heaven's severed members are cast into the sea, foam forms, a maiden grows
    within it, and Aphrodite emerges in Cyprus.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The birth is linked to violence and sea foam; no infant stage is described.
- id: motif:6
  label: Blood-generated avenging or armed beings
  taxonomy_refs: []
  basis: Blood from Heaven falls onto Earth and produces the Erinyes, Giants with
    armor and spears, and Meliae nymphs.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage names the beings and their birth from blood but does not fully
    narrate their later functions.
- id: motif:7
  label: Cosmic mountain as divine dwelling
  taxonomy_refs:
  - cosmic_mountain
  basis: Olympus is named as the Muses' dwelling, the snowy peaks held by the deathless
    gods, and the place whose taking is part of the divine order.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: Olympus is a divine mountain setting here, but the passage does not explicitly
