canonical_text:
  quote: ''
  summary: 'The passage preserves several fragments and scholia concerning genealogies
    and marriage traditions: Asclepius and Eriopis are born to Arsinoe and Apollo;
    Apollo is said to have destroyed the Cyclopes in another fragment; Castor and
    Polydeuces are made sons of Zeus; Helen is given variant parentage involving Ocean
    and Zeus. A scholion connects Tyndareus'' neglect of Aphrodite in sacrifice with
    the marital desertions of Timandra, Clytaemnestra, and Helen. A long papyrus fragment
    lists many suitors for Helen, their origins, gifts, strategies, and the expectation
    that Menelaus would win her because of wealth and kinship diplomacy.'
  language: English
  quote_policy: summarized
