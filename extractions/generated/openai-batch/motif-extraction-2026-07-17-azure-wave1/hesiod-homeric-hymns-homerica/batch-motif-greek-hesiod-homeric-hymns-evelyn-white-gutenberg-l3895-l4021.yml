  taxonomy_refs:
  - divine_parent_child
  basis: Asclepius and Eriopis are children of Apollo and Arsinoe; Castor and Polydeuces
    are sons of Zeus; Helen is connected with Zeus and Ocean or a daughter of Ocean
    in variant parentage accounts.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage is fragmentary and preserves variant genealogical notices
    rather than a single continuous narrative.
- id: motif:2
  label: sacred or divinely marked birth
  taxonomy_refs:
  - sacred_birth
  basis: Several named figures are born from unions involving deities, including Apollo
    with Arsinoe and Zeus with figures connected to Ocean and Tyndareus.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:5
  confidence: medium
  cautions: The birth reports are genealogical and do not describe a miraculous birth
    scene in detail.
- id: motif:3
  label: god-mortal or divine beloved union
  taxonomy_refs:
  - divine_beloved
  basis: Arsinoe is described as subject in love to Phoebus and joined with Apollo;
    the daughter of Ocean shares embraces involving Zeus and Tyndareus.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: medium
  cautions: The passage gives brief genealogical statements and does not elaborate
    the courtship or relationship.
- id: motif:4
  label: divine retribution for neglected worship
  taxonomy_refs:
  - divine_judgment
  - sacrifice
  basis: Tyndareus forgets Aphrodite in a sacrifice; Aphrodite becomes angry and causes
