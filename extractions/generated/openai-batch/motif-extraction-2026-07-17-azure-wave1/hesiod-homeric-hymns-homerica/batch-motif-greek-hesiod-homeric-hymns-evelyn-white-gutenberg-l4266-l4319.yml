canonical_text:
  quote: ''
  summary: 'Fragmentary genealogical and heroic material: Electyron’s sons are killed
    by Taphians in a conflict over oxen, leaving Alcmena; a woman bears Heracles after
    union with Zeus; Teuthras receives and fosters Auge; Auge bears Telephus by Heracles
    during Heracles’ quest for Laomedon’s horses and war against Amazons; Telephus
    defeats Achaeans but is later brought low; Electra bears Dardanus and Eetion by
    Zeus; Zeus kills Eetion with a thunderbolt for attempting Demeter; Dardanus leaves
    Samothrace by ship and begins a lineage; Ganymede is taken by an eagle for Zeus
    because of his beauty; Diomede bears Hyacinthus, whom Phoebus unintentionally
    kills with a disk.'
  language: English
  quote_policy: summarized
