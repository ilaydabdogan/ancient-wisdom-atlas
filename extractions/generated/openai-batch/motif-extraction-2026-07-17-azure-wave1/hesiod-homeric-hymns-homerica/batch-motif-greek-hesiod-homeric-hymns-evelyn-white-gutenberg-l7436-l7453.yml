canonical_text:
  quote: ''
  summary: 'The hymn invokes the Muses to sing of the Tyndaridae, Castor and Polydeuces,
    sons of Zeus and children of Leda. It recounts their birth beneath Taygetus and
    describes them as deliverers of men and ships in storms: sailors vow white lambs
    at the prow, the two appear through the air on tawny wings, calm winds and waves,
    and bring relief. The hymn closes by hailing them as swift-horse riders.'
  language: English
  quote_policy: summarized
