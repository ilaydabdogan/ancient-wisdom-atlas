canonical_text:
  quote: ''
  summary: Apollo and Hermes seal friendship by oath after Hermes promises not to
    steal Apollo's possessions. Zeus confirms the agreement. Apollo gives Hermes a
    golden three-branched staff, refuses to reveal Zeus' prophetic counsel, explains
    proper and improper bird omen practice, and gives Hermes three winged virgins
    who teach divination through honey-inspired truth. Zeus confirms Hermes' offices
    over omen birds, animals, flocks, and as messenger to Hades. The hymn closes by
    characterizing Hermes as one who consorts with mortals and immortals and cozens
    mortal men at night.
  language: English
  quote_policy: summarized
