  summary: The passage describes the iron race's moral decline, Zeus's future destruction
    of that race, the departure of Aidos and Nemesis from earth, a fable of a hawk
    and nightingale, instruction to Perses and princes about justice, prosperity for
    cities that judge straightly, punishment for violent cities, divine watchers over
    human deeds, and Justice as Zeus's daughter reporting wrongs to him.
  language: English
  quote_policy: summarized
