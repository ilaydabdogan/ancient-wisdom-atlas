  category: attribute
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage states that from the maiden comes the race of women and female
    kind, and it presents women, marriage, and nonmarriage as sources of trouble for
    mortal men.
  category: relationship
  evidence_refs:
  - ev:11
