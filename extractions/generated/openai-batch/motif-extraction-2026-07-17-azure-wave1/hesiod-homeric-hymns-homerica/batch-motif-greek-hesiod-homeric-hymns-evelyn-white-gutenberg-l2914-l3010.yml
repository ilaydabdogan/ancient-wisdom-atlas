canonical_text:
  quote: ''
  summary: The passage gives the genealogy of Iapetus and Clymene’s children, describes
    Zeus’ punishments of Menoetius, Atlas, and Prometheus, recounts Prometheus’ deceptive
    division of an ox at Mecone, explains the burning of bones in sacrifice, narrates
    Prometheus’ theft of fire in a fennel stalk, and describes Zeus’ creation of an
    earth-formed maiden as the price for fire and as the source of women and marriage-related
    troubles for men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Iapetus takes Clymene, daughter of Ocean, as wife, and she bears Atlas, Menoetius,
    Prometheus, and Epimetheus.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Epimetheus is said to have first taken from Zeus the formed woman or maiden,
    and is described as a mischief to bread-eating men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zeus strikes Menoetius with a thunderbolt and sends him down to Erebus because
    of presumption and pride.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Atlas, under hard constraint, upholds the wide heaven with his head and arms
    at the borders of the earth before the Hesperides; the passage says Zeus assigned
    this lot to him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Zeus binds Prometheus with chains, drives a shaft through his middle, and
    sets an eagle to eat his immortal liver; the liver grows back during the night.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Heracles kills the long-winged bird and releases Prometheus from his affliction,
    with the passage stating that this was not without Zeus’ will.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'At Mecone, Prometheus cuts up an ox and sets out two portions: flesh and
    inner parts hidden under a paunch, and white bones covered with shining fat for
    Zeus.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Zeus perceives the trick, becomes angry when he sees the bones under the fat,
    and rebukes Prometheus for his cunning arts.
  category: speech
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The passage explains that because of this event, human tribes burn white bones
    to the deathless gods on fragrant altars.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: After the trick, Zeus withholds fire from mortal men; Prometheus steals the
    far-seen gleam of fire in a hollow fennel stalk.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: As the price for fire, Zeus has the Limping God form from earth the likeness
    of a shy maiden, and Athene clothes and adorns her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The maiden’s golden crown contains many crafted creatures of land and sea,
    described as wonderful and like living beings with voices.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: When the maiden is brought before gods and men, both groups are seized by
