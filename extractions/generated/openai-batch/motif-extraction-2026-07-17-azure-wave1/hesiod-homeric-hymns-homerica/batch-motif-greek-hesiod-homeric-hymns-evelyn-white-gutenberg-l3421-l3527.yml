  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Polycaste and Telemachus are joined in love through Aphrodite and bear Persepolis.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:16
  text: Tyro has Neleus and Pelias by Poseidon, later marries Cretheus, and Jason
