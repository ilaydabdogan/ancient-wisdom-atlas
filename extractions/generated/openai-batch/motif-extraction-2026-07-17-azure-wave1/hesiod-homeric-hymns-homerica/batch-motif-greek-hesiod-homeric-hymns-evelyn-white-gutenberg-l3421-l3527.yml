canonical_text:
  quote: ''
  summary: 'A sequence of Hesiodic catalogue fragments gives genealogies of Deucalion,
    Hellen, Zeus-born and Poseidon-born descendants, eponymous peoples and regions,
    and several brief mythic notices: Bellerophon receives Pegasus and kills the fire-breathing
    Chimera; Endymion receives a death-related gift from Zeus; Actor and Molione''s
    sons are described as joined twins; Periclymenus shapeshifts and is defeated by
    Heracles with Athena''s help; Nestor survives the killing of his brothers; Jason
    is raised by Chiron on Pelion; and Atalanta avoids marriage and contends with
    Hippomenes.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Deucalion is identified as the son of Prometheus and Pronoea, and Hellen as
    the son of Deucalion and Pyrrha.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage reports that Greeks are named after Graecus, and that Pandora,
    daughter of Deucalion, bore Graecus after union with Zeus.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Macedonia is said to take its name from Macedon, son of Zeus and Thyia; Thyia
    bears Magnes and Macedon to Zeus.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hellen is described as ancestor of Dorus, Xuthus, and Aeolus, and Aeolus is
    ancestor of several named sons.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: Descendants of Deucalion are said to have ruled over Thessaly.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Aloiadae are publicly called sons of Aloeus and Iphimedea, but the passage
    says they are in reality sons of Poseidon and Iphimedea.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Eurynome is taught skill, wit, and wisdom by Athena, is described with scent
    and beauty, and is sought as a wife by Glaucus with gifts and oxen.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Zeus swears that the son of Sisyphus will not have children born of one father;
    Eurynome lies with Poseidon and bears Bellerophon in Glaucus's house.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Bellerophon's father gives him Pegasus, who flies swiftly over the earth,
    and Bellerophon uses Pegasus to catch and kill the fire-breathing Chimera.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Endymion receives from Zeus a gift described as being keeper of death for
    himself when ready to die.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The sons of Actor and Molione are said to have Poseidon as their father and
    are described as twins with two bodies joined to one another.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:12
  text: Periclymenus receives gifts from Poseidon and can appear as an eagle, an ant,
    a swarm of bees, or a snake.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: Periclymenus perches on the yoke-boss of Heracles' horses to fight him, but
    Heracles, instructed by Athena, wounds him mortally with an arrow.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Heracles kills eleven sons of Neleus, while Nestor alone escapes because he
