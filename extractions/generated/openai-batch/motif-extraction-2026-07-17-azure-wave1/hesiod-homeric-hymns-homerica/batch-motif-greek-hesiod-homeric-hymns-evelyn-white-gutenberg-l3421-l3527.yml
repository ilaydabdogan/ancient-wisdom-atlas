candidate_motifs:
- id: motif:1
  label: genealogical origin of peoples, regions, and ruling houses
  taxonomy_refs:
  - royal_legitimacy
  basis: The passage links Greeks, Macedonia, Thessaly's rulers, and Hellenid/Aeolid
    lines to named ancestors and divine or heroic genealogies.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The fragments are catalogue notices rather than extended foundation narratives.
- id: motif:2
  label: divine-mortal union producing named descendants
  taxonomy_refs:
  - divine_parent_child
  - sacred_birth
  - divine_beloved
  basis: Multiple mortal women bear children to Zeus or Poseidon, including Graecus,
    Magnes, Macedon, the Aloiadae, Bellerophon, the joined twins, and Tyro's sons.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  - ev:10
  - ev:14
  confidence: high
  cautions: The passage reports parentage tersely and does not always narrate the
    union in detail.
- id: motif:3
  label: hero with supernatural steed defeats fire-breathing monster
  taxonomy_refs: []
  basis: Bellerophon receives Pegasus, who flies on wings, and uses him in the killing
    of the fire-breathing Chimera.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No supplied taxonomy family directly names monster-slaying; fire is recorded
    as a symbol rather than a motif family here.
- id: motif:4
  label: shapeshifting warrior defeated through divine strategy
  taxonomy_refs:
  - shapeshifter
  - serpent
  - wisdom
  basis: Periclymenus has Poseidon's gifts of animal transformation, including a snake
    form, but Athena's devising and instruction enable Heracles to wound him mortally.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage emphasizes defeat in combat more than ritual or initiatory
    meaning.
- id: motif:5
  label: conjoined or two-bodied twins
  taxonomy_refs:
  - sacred_twins
  basis: The sons of Actor and Molione are described as twins, double in form, with
    two bodies joined to one another.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The fragment explicitly distinguishes them from the Dioscuri, so the subtype
    should not be conflated with all divine twin traditions.
- id: motif:6
  label: divine instruction grants skill or success
  taxonomy_refs:
  - wisdom
  basis: Athena teaches Eurynome art, wit, and wisdom, advises Glaucus, and secretly
    instructs Heracles against Periclymenus.
  evidence_refs:
  - ev:7
  - ev:11
  confidence: medium
  cautions: Athena's actions occur in separate brief notices; the common motif is
    inferred from repeated divine instruction.
