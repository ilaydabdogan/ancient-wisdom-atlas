  summary: 'The passage reports several fragments or testimonia connected with the
    Little Iliad: Menelaus sees Helen unclad and casts away his sword; Aethra leaves
    captured Ilium, reaches the Hellenic camp, is recognized by the sons of Theseus,
    and is granted to Demophon after Helen consents; Neoptolemus leads Andromache
    to the ships, kills Astyanax by throwing him from a tower, receives Andromache
    as a prize, and puts Aeneas aboard his ships as an exceptional prize.'
