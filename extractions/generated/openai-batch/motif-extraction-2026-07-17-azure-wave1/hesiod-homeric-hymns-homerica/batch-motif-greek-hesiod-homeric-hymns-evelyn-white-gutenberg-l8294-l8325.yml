canonical_text:
  quote: ''
  summary: The passage gives testimonia and fragments concerning the Phocais and Margites.
    It reports claims about Homer composing the Phocais, a notice that Pigres wrote
    the Margites attributed to Homer, an image of an old divine singer arriving at
    Colophon with a lyre, descriptions of Margites as broadly incompetent and ignorant,
    and a proverb contrasting the fox’s many wiles with the hedgehog’s single effective
    trick.
  language: English
