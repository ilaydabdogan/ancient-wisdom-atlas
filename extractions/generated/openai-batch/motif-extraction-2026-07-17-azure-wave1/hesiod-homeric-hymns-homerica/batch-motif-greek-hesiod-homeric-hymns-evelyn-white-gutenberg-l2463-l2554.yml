canonical_text:
  quote: ''
  summary: 'Opening of the Theogony: the Muses of Helicon and Olympus dance, wash,
    and sing divine praises; they teach Hesiod song, give him a laurel rod, and breathe
    a divine voice into him. The passage recounts the Muses’ birth from Zeus and Mnemosyne,
    their songs about gods, men, and giants, Zeus’s rule after overcoming Cronos,
    and the gifts of eloquence, judgment, and consolation that the Muses grant to
    princes and singers.'
  language: English
  quote_policy: summarized
