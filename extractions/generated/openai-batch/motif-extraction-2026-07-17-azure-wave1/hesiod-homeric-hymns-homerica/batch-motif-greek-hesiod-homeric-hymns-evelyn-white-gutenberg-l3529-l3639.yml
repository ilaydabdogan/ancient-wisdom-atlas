candidate_motifs:
- id: motif:1
  label: life-or-death bride race
  taxonomy_refs:
  - sacred_marriage
  basis: Marriage to Atalanta is offered only if Hippomenes wins the contest; the
    race is also for his life and culminates in escape from death.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: medium
  cautions: The passage presents a mortal marriage contest rather than an explicit
    ritual or divine marriage; taxonomy mapping is approximate.
- id: motif:2
  label: victory through divine gifts and guile
  taxonomy_refs:
  - trickster_boundary
  - sacred_exchange
  basis: Hippomenes speaks with thoughts of guile, offers Aphrodite's gifts, and uses
    three apples to alter the race's outcome.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage names Aphrodite's gifts but does not fully explain how Hippomenes
    acquired them in the surviving lines.
- id: motif:3
  label: water-bringing civil benefactor
  taxonomy_refs:
  - culture_hero
  basis: Danaus is credited with transforming waterless Argos into a well-watered
    place.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The notice is very brief and gives no narrative details of the act.
- id: motif:4
  label: divine punishment for religious refusal
  taxonomy_refs:
  - divine_judgment
  basis: The daughters of Proetus become mad after refusing Dionysus' rites or, in
    a variant notice, scorning Juno's divinity; other notices describe cow-delusion
    and bodily affliction.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage preserves variant explanations and punishments from different
    cited sources.
- id: motif:5
  label: healing of divinely afflicted women
  taxonomy_refs:
  - initiation
  basis: The daughters of Proetus leave Argos after madness and are later cured by
    Melampus in one notice.
  evidence_refs:
  - ev:9
  confidence: low
  cautions: The initiation taxonomy is only a possible functional parallel; the passage
    itself states cure, not initiation.
- id: motif:6
  label: divine abduction of beloved across water
  taxonomy_refs:
  - stolen_beloved
  - divine_beloved
  basis: Zeus beguiles and secretly snatches Europa, taking her across the briny water
    to Crete, where he mates with her.
  evidence_refs:
  - ev:11
  - ev:13
  - ev:16
  confidence: high
  cautions: The main fragment emphasizes wiles and secret removal; the scholion adds
    the bull transformation.
- id: motif:7
  label: god in animal form deceives mortal woman
  taxonomy_refs:
  - shapeshifter
  - divine_beloved
  basis: The scholion says Zeus changes into a bull, deceives Europa, and carries
    her over the sea to Crete.
  evidence_refs:
  - ev:16
  confidence: high
  cautions: This detail is in the scholion account within the passage, not in the
    preserved papyrus fragment excerpt itself.
