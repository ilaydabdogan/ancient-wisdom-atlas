canonical_text:
  quote: ''
  summary: A set of fragments recounts Atalanta's life-or-death race with Hippomenes
    and the use of Aphrodite's apples; brief genealogical and mythographic notices
    about Danaus, Aegyptus, the daughters of Proetus, and Argos; and a longer Europa
    fragment in which Zeus deceives and carries Europa to Crete, gives her a golden
    necklace, fathers Minos, Rhadamanthys, and Sarpedon, grants Sarpedon honor and
    long life, and sends him a star-sign in the Trojan War context.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Atalanta is described as a peerless, trim-ankled maiden surrounded by a great
    throng whose appearance causes wonder.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Schoeneus announces that Hippomenes seeks his daughter as wife and must win
    her through a contest, with victory bringing marriage, horses, renown, and return
    home, while failure entails death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Atalanta runs in a struggle described as unenviable, while Hippomenes' race
    is explicitly for his life, either doom or escape.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Hippomenes addresses Atalanta and offers glorious gifts associated with golden
    Aphrodite.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Hippomenes casts three apples; Atalanta turns back to snatch the first, has
    two apples near the goal, and the third apple allows Hippomenes to escape death
    and black fate.
  category: sequence
  evidence_refs:
  - ev:5
