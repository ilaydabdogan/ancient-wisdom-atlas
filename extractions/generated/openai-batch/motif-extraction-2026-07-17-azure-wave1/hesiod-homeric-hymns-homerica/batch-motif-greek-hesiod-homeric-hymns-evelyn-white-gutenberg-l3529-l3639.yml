    scalps.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Europa crosses the briny water to Crete after being beguiled by Zeus' wiles
    and secretly snatched away by the Father.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Zeus gives Europa a golden necklace made by Hephaestus, after receiving it
