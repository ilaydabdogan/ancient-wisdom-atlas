canonical_text:
  quote: ''
  summary: 'The passage presents four fragments under the title The Precepts of Chiron:
    an instruction to hold teachings in a wise heart and sacrifice to the eternal
    gods on coming home; a maxim about hearing both sides before judging a suit; a
    comparative sequence of lifespans from crow to stag, raven, phoenix, and Nymphs;
    and a note about literary education before age seven and disputed attribution
    to Hesiod.'
