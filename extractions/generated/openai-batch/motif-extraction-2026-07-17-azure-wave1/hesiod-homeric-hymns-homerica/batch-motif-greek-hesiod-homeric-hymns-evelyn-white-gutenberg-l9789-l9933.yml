  claim: The Aeneas and Odysseus etymologies are presented as similar examples of
    deriving a hero's name from a meaningful Greek word.
  claim_level: linguistic_similarity
  target: Odyssey i.62 derivation of Odysseus from ODYSSMAI
  evidence_refs:
