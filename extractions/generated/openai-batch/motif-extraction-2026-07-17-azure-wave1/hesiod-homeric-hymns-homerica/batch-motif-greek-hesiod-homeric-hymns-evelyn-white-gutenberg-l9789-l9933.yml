  quote: ''
  summary: 'Endnotes explaining mythic, ritual, linguistic, and textual details: the
    Thriae as pebble-diviners associated with bees; Cronos swallowing and disgorging
    his children; cattle bride-payment; name etymologies; the Eiresione garland and
    seasonal songs; Demeter changing into a mare to escape Poseidon; a serpent omen
    at Aulis interpreted by Calchas; alternate traditions about Aeneas; and a fox-and-hedgehog
    proverb.'
  language: English
  quote_policy: summarized
