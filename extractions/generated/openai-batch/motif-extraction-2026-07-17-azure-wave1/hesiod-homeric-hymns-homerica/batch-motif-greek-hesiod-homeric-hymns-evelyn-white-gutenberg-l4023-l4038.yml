canonical_text:
  quote: ''
  summary: Tyndareus refuses to dismiss any suitor or accept gifts from them, but
    requires all suitors for Helen to swear oaths with unmixed libations. They must
    not act apart from him concerning her marriage, and if anyone takes her by force,
    the rest must pursue and punish him. The suitors comply, hoping to win the marriage.
    Menelaus prevails because he gives the greatest gifts. Chiron is tending the young
    Achilles on woody Pelion; the passage says Achilles would have prevailed as a
    suitor if Helen had still been unmarried, but Menelaus had already won her.
  language: English
