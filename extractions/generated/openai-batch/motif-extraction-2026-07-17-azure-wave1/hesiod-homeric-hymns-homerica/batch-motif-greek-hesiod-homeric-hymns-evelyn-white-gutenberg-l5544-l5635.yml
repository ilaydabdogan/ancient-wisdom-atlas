canonical_text:
  quote: ''
  summary: Demeter and Persephone are reunited. Demeter asks whether Persephone tasted
    food below, because that determines whether she must return beneath the earth
    for part of each year. Persephone recounts the pomegranate seed and her abduction
    from a flower-filled meadow by the Host of Many. Zeus sends Rhea to confirm the
    yearly division; Demeter restores fertility to the earth and teaches her rites
    and mysteries.
  language: English
