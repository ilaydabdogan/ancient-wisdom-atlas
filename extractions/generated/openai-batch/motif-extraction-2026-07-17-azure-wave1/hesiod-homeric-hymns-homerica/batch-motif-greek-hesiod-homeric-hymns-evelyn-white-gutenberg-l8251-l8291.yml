canonical_text:
  quote: ''
  summary: 'The passage gives fragmentary notices about Homeric and related poems.
    Homer is said to have recited the Expedition of Amphiaraus and Hymns to the Gods
    in a tanner''s yard. Notices on the Taking of Oechalia connect Eurytus, Iole,
    and Heracles'' sack of Oechalia, and discuss rival attributions of the poem to
    Homer or Creophylus. Another fragment notes a verse shared with Odyssey xiv.343.
    A further fragment records disagreement over the number of Eurytus'' sons. The
    final fragment gives Creophylus'' version of Medea''s story: she poisons Creon
    in Corinth, flees to Athens, leaves her young sons at Hera Acraea''s altar, and
    Creon''s relatives kill them and blame Medea.'
  language: English
  quote_policy: summarized
