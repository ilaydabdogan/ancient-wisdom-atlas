  quote: ''
  summary: A set of fragments and testimonia about the Marriage of Ceyx reports Heracles
    landing from the Argo to seek water and being left behind near Aphetae; Heracles
    repeatedly visiting Ceyx's house and uttering a proverb about good people attending
    good feasts; Ceyx described as horse-driving; tables being called tripods; and
    wood from the forest being brought after an equal-shared feast to be burned in
    flames.
