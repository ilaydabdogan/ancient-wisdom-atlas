  quote: ''
  summary: The hymn addresses Hestia as honored in the dwellings of gods and humans
    and as receiving first and last wine offerings at mortal banquets. It then invokes
    Hermes, identifies him by epithets and lineage, and asks Hermes and Hestia to
    be favorable, dwell together in the house, and aid human wisdom and strength.
    The hymn closes with a hail to Hestia and Hermes.
