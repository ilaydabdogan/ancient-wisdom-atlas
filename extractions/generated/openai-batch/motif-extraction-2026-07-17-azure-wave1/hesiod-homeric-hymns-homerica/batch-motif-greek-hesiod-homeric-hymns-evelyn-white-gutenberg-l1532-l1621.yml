canonical_text:
  quote: ''
  summary: The passage opens Works and Days with an invocation to the Muses and Zeus,
    then addresses Perses about justice, work, and Strife. It distinguishes two kinds
    of Strife, one destructive and one productive. It then recounts Zeus hiding livelihood
    and fire after Prometheus deceives him, Prometheus stealing fire for humans in
    a fennel-stalk, and Zeus responding by ordering the creation and adornment of
    Pandora, who is sent as a harmful gift to Epimetheus.
  language: English
  quote_policy: summarized
