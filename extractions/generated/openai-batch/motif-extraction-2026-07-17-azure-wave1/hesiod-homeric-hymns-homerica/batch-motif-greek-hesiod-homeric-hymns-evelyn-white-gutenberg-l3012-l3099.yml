canonical_text:
  quote: ''
  summary: The passage says Zeus’s will cannot be escaped, citing Prometheus bound
    under Zeus’s anger. It then recounts how Obriareus, Cottus, and Gyes were bound
    beneath the earth by their father, brought back to the light by Zeus and the gods
    at Earth’s advice, fed with nectar and ambrosia, and enlisted against the Titans.
    The armies of Titans and Olympian gods fight, aided by the hundred-armed, fifty-headed
    allies. Zeus unleashes thunder, lightning, fire, earthquake, and cosmic upheaval
    as the battle turns.
  language: English
  quote_policy: summarized
