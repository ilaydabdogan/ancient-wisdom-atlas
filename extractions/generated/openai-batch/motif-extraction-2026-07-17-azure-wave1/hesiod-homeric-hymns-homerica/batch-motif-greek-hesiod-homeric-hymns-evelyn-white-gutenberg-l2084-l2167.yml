canonical_text:
  quote: ''
  summary: The speaker gives seasonal advice about summer heat, food, libations, grain
    winnowing, grape harvest, ploughing, ship storage, sailing seasons, trade, and
    return before autumn storms. Celestial bodies and divine powers mark or govern
    the timing of agricultural and maritime work. The speaker also recounts his father’s
    migration by sea and his own limited sailing experience, song victory, dedication
    to the Muses, and instruction from them.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The flowering artichoke, a grasshopper singing in a tree, and Sirius’s heat
    mark a season when goats are plump, wine is sweet, and men are weakened by heat.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker imagines sitting in shade with wine, curds, goat milk, and meat,
    facing Zephyr, and pouring three offerings of spring water followed by a fourth
    libation of wine.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Slaves are instructed to winnow Demeter’s holy grain when Orion first appears,
    then measure and store it in jars while household labor, animals, and provisions
    are managed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Grape clusters are cut and processed according to the positions of Orion,
    Sirius, Dawn, Arcturus, the Pleiades, and the Hyades; the processed wine is called
    the gifts of Dionysus.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Ploughing is to be remembered when the Pleiades, Hyades, and Orion begin to
    set, so that the completed year passes beneath the earth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the Pleiades plunge into the misty sea to escape Orion’s strength, gales
    rage, and ships should be hauled onto land, weighted, drained, and stripped of
    gear.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The speaker says that his and Perses’s father crossed the sea from Aeolian
    Cyme, fled poverty laid upon men by Zeus, and settled near Helicon in Ascra.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker says he sailed only from Aulis to Euboea and Chalcis, won a song
    contest at the games of Amphidamas, dedicated a tripod to the Muses of Helicon,
    and was taught song by the Muses.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fifty days after the solstice is presented as a safe sailing season, unless
    Poseidon or Zeus chooses destruction; the speaker advises returning before new
    wine, autumn rain, storms, and Notus’s gales.
  category: sequence
  evidence_refs:
  - ev:7
