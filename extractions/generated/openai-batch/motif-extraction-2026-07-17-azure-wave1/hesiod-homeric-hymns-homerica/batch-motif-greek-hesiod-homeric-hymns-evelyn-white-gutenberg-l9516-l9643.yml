  quote: ''
  summary: A cluster of endnotes explains fragmentary Hesiodic and Homeric material,
    including wooing by proxy, destruction of humanity by storms, a spring-bearing
    snake, Iphigeneia and Artemis, Minos' tribute to the Minotaur, Deucalion and Pyrrha
    after the Flood, etymological notes, Maron as discoverer of wine, Apollo's transformed
    crow, Zeus' slaying of Asclepius and Apollo's punishment, Dodona's oak oracle,
    Meleager's life-brand, and shield imagery with Fear and Oceanus.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The notes state that wooing could be performed by proxy; Agamemnon wooed Helen
    for Menelaus, while Idomeneus is noted as an exception because he came in person.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: One note says a fragment probably led to an account of the Trojan and possibly
    Theban war, in which the Race of Heroes perished according to Works and Days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The same note says the destruction of man begins with storms that spoil crops,
    and the remaining verses describe a snake bearing young in spring.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: A note identifies the 'snake' in the passage and compares the naming to the
    'Boneless One' for the cuttle-fish in Works and Days.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: According to the note, Iphigeneia was carried by Artemis to the Tauric Chersonese;
    the Tauri identified their maiden-goddess with Iphigeneia, while Euripides makes
    Iphigeneia a priestess of the goddess.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: A note says Minos exacted a yearly tribute of boys and girls from the Athenians,
    to be devoured by the Minotaur, as recompense for a murder.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A note says a fancied connection between words for stone and people refers
    to the stones Deucalion and Pyrrha transformed into men and women after the Flood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A note identifies Maron as a priest of Apollo and, according to Homer, the
    discoverer of wine.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A note says the crow was originally white and was turned black by Apollo because
