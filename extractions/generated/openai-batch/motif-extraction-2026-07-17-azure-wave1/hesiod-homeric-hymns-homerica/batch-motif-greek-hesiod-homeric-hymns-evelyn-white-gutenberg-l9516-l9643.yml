  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: A note says Zeus slew Asclepius because of his success as a healer; Apollo
    then killed the Cyclopes in revenge and was punished by being forced to serve
    Admetus as herdsman.
  category: sequence
  evidence_refs:
  - ev:9
