canonical_text:
  quote: ''
  summary: In a contest between Hesiod and Homer, Hesiod tests Homer with ambiguous
    verse completions, a numerical problem about the Achaeans at Ilium, and brief
    moral questions. Homer answers each challenge. The Hellenes call for Homer to
    be crowned, but King Paneides asks both poets to recite their finest passages.
    Hesiod recites a seasonal agricultural passage keyed to the Pleiads, while Homer
    recites a martial passage describing close-ranked warriors facing the Trojans
    and Hector.
  language: English
  quote_policy: summarized
