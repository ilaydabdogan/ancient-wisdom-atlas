canonical_text:
  quote: ''
  summary: The passage narrates a violent battle between Frogs and Mice by a lake,
    with many named animal warriors wounded or killed by spears, stones, reeds, and
    other improvised weapons. A powerful Mouse warrior, Slice-snatcher, threatens
    to destroy the Frogs, prompting Zeus to pity them. Zeus and Hera discuss divine
    aid; Hera proposes Zeus's thunderbolt. Zeus casts the thunderbolt, frightening
    both armies, but the Mice continue. Zeus then sends crabs, whose armored bodies
    and claws overcome the Mice and end the one-day war at sunset.
  language: English
  quote_policy: summarized
