candidate_motifs:
- id: motif:1
  label: deceptive war-object admitted into the city
  taxonomy_refs: []
  basis: The Trojans choose to dedicate the wooden horse, celebrate the apparent end
    of war, and the Greeks hidden inside later emerge to attack.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage summarizes the horse as a tactical device but does not elaborate
    its construction or divine status beyond dedication to Athena.
- id: motif:2
  label: serpent portent before disaster
  taxonomy_refs:
  - serpent
  basis: Two serpents appear, kill Laocoon and one son, and the event is explicitly
    called a portent that alarms Aeneas' followers before the sack unfolds.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage states the effect of alarm and withdrawal but does not explain
    the serpents' origin.
- id: motif:3
  label: sacrilege at a goddess's image followed by divine retaliation
  taxonomy_refs:
  - divine_judgment
  basis: Aias tears away Athena's image while seizing Cassandra; later Athena plans
    to destroy the Greeks on the high seas.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage places Athena's sea-destruction plan after the sack but does
    not explicitly state that it is solely caused by Aias' act.
- id: motif:4
  label: killing of a suppliant at an altar
  taxonomy_refs: []
  basis: Priam flees to the altar of Zeus Herceius and is killed there by Neoptolemus.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage reports the action without giving a moral or divine response
    in this fragment.
- id: motif:5
  label: sacrifice at the tomb of a dead hero
  taxonomy_refs:
  - sacrifice
  basis: After burning the city, the Greeks sacrifice Polyxena at Achilles' tomb.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: No ritual details or stated purpose of the sacrifice are given.
- id: motif:6
  label: child victim after city fall
  taxonomy_refs: []
  basis: Astyanax is murdered by Odysseus and another fragment says he was hurled
    from the city wall.
  evidence_refs:
  - ev:7
  - ev:11
  confidence: high
  cautions: The fragments preserve two brief formulations of the same victim's death
    without extended context.
- id: motif:7
  label: hidden sacred talisman and deceptive substitute
  taxonomy_refs:
  - sacred_theft
  basis: The Palladium is hidden in a secret place, a copy is displayed to deceive
    plotters, and the Achaeans take the copy through plots.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The available text says the Achaeans take the copy, not the hidden original,
    so the sacred-theft classification is cautious.
- id: motif:8
  label: divinely apportioned healing knowledge
  taxonomy_refs:
  - wisdom
  basis: 'The Earth-Shaker grants different medical gifts: surgical treatment of wounds
    to one son and knowledge of hidden diseases to another.'
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: This is a brief quoted fragment about expertise and does not narrate an
    initiation or quest for wisdom.
- id: motif:9
  label: woman retrieved from the captured city
  taxonomy_refs: []
