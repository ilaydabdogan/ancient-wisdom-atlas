canonical_text:
  quote: ''
  summary: Fragments of the Sack of Ilium recount Trojan debate over the wooden horse,
    serpent portents, Greek infiltration and destruction of Troy, killings and seizures
    during the sack, the fate of sacred images and captives, Athena's planned punishment
    of the Greeks at sea, a tradition about the Palladium, and brief notices on healing
    gifts and a bodily stance.
  language: English
  quote_policy: summarized
