canonical_text:
  quote: ''
  summary: Heracles faces Ares in battle after Cycnus has fallen. Athene warns Ares
    not to kill Heracles, but Ares attacks; Athene turns aside his spear, and Heracles
    wounds Ares in the thigh. Panic and Dread carry Ares by chariot to Olympus. Heracles
    and Iolaus strip Cycnus' armor and go to Trachis. Ceyx buries Cycnus with many
    people attending, but the rain-swollen Anaurus erases Cycnus' grave and memorial
    by Apollo's command because Cycnus had violently despoiled hecatombs brought to
    Pytho.
  language: English
  quote_policy: summarized
