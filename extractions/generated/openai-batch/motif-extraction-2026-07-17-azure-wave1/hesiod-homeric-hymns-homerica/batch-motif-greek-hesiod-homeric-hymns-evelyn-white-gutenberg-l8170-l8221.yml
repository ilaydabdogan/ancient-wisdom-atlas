candidate_motifs:
- id: motif:1
  label: homeward returns after war
  taxonomy_refs:
  - return
  basis: The main fragment summarizes multiple routes home after Troy, including safe
    arrivals, ship losses, overland travel, delayed return, and Menelaus' final return
    home.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage is a plot summary rather than a full narrative episode.
- id: motif:2
  label: divine anger disrupting departure
  taxonomy_refs:
  - divine_judgment
  basis: Athena causes a quarrel about the voyage, and Agamemnon remains to appease
    her anger.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage does not explicitly connect all later travel disasters to
    Athena's anger.
- id: motif:3
  label: prophetic ghost warning travelers
  taxonomy_refs: []
  basis: The ghost of Achilles appears to Agamemnon's followers and foretells what
    will befall them.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No supplied taxonomy reference directly corresponds to prophetic apparition.
- id: motif:4
  label: perilous sea return and wreck at rocks
  taxonomy_refs:
  - return
  basis: Menelaus loses ships on the high seas, and the storm at the rocks called
    Capherides is linked with the end of Locrian Aias.
  evidence_refs:
  - ev:2
  - ev:5
  confidence: medium
  cautions: The details of the storm and Aias' end are not narrated in full.
- id: motif:5
  label: magical rejuvenation by cauldron and herbs
  taxonomy_refs:
  - death_rebirth
  basis: Medea strips Aeson's old age from him and makes him a young boy with a brew
    of many herbs in golden cauldrons.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage describes rejuvenation, not literal death or rebirth; the
