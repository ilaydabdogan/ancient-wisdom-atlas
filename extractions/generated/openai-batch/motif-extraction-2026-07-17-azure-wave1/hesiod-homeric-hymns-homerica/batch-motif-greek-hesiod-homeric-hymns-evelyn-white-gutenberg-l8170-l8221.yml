canonical_text:
  quote: ''
  summary: 'The passage summarizes fragments and testimonia concerning the epic Returns:
    disputes and homeward journeys after Troy, sea losses, burials, warnings by a
    ghost and a goddess, Agamemnon''s murder and vengeance, Medea''s rejuvenation
    of Aeson, Antiope''s betrayal of Themiscyra, later marriages involving Telemachus,
    Circe, Telegonus, and Penelope, a maxim about gifts, an account of Hades lacking
    Eurynomus, and Tantalus'' punishment by Zeus.'
  language: English
  quote_policy: summarized
