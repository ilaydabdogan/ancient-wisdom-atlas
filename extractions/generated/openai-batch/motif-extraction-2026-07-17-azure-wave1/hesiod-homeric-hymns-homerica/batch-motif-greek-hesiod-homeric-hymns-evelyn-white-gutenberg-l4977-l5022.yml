canonical_text:
  quote: ''
  summary: A sequence of cited fragments from the Aegimius reports Phrixus entering
    Aeetes' halls with a purified fleece after sacrifice; Thetis testing or exposing
    her children by Peleus in a cauldron of water until Peleus prevents Achilles from
    being thrown in; Zeus' seduction and transformation of Io into a white cow, Hera's
    appointment of Argus as watcher, and Hermes' killing of Argus; a brief utterance
    about a future place of refreshment; and an explanation of the Three-fold People
    in Crete.
  language: English
  quote_policy: summarized
