canonical_text:
  quote: Sometimes a day is a stepmother, sometimes a mother.
  summary: The passage gives a didactic calendar of favorable and unfavorable days
    for births, marriage, animal gelding and taming, threshing, building, ship work,
    opening jars, and reading omens. It also mentions the fifth day as the day on
    which the Erinyes assisted at the birth of Horcus, whom Eris bore to trouble the
    forsworn.
  language: English
  quote_policy: quoted
