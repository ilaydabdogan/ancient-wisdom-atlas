canonical_text:
  quote: ''
  summary: A hymn invokes the Muse to tell of Pan, son of Hermes, describing his goat-like
    form, mountain domain, hunting, music, dancing nymphs, and delight in song. The
    nymphs sing of Hermes in Arcadia, his marriage to the daughter of Dryops, the
    birth of Pan, the nurse's fear, Hermes carrying the child to the gods, and the
    gods' delight in him and naming of him.
  language: English
  quote_policy: summarized
