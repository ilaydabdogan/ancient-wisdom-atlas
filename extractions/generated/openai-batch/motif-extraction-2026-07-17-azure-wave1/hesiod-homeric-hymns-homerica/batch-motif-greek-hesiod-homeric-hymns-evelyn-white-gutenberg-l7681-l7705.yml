  summary: 'The passage preserves fragments concerning the Epigoni and related Theban
    material: Homer is said to have composed the Epigoni; the Teumesian fox is described
    as a divine punishment for Cadmus'' descendants and is hunted by Cephalus'' inescapable
    hound until both become stones; and Manto, daughter of Teiresias, is sent to Delphi
    as spoil, obeys Apollo''s oracle by marrying Rhacius, and mourns her destroyed
    country at Colophon.'
