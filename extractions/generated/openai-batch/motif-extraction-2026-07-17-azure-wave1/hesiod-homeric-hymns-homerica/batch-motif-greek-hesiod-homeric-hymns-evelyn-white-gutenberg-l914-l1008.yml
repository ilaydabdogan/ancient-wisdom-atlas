canonical_text:
  quote: ''
  summary: 'Scholarly introduction to the Homeric Hymns: it discusses the collection,
    its possible date and function, and summarizes selected hymns, especially those
    to Demeter and Apollo. The Demeter summary recounts Persephone’s seizure by Hades,
    Demeter’s grief and famine, Persephone’s partial return, and the establishment
    of the Eleusinian mysteries. The Apollo summary recounts Leto’s search for a birthplace,
    Apollo’s birth at Delos, his claims to lyre, bow, and prophecy, the founding of
    Pytho/Delphi, the slaying of a she-dragon, Apollo’s dolphin transformation, and
    the appointment of Cretan shipmen as priests.'
  language: English
  quote_policy: summarized
