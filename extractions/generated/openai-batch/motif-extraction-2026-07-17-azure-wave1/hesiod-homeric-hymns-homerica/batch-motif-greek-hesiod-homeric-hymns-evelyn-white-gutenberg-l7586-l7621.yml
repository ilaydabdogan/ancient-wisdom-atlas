canonical_text:
  quote: ''
  summary: Fragments attributed to The War of the Titans report a primordial union
    of Heaven and Earth producing hundred-handed sons and Cyclopes; Heaven’s descent
    from Aether; Aegaeon’s parentage, sea dwelling, and alliance with the Titans;
    an aquatic shield image; Zeus dancing; Cronos taking horse shape and fathering
    Cheiron with Philyra; Heracles sailing in a cauldron; and guarded apples of the
    Hesperides.
