comparison_claims:
- id: claim:1
  claim: 'The passage explicitly says the Hymn to Aphrodite can be compared with the
    Lay of Demodocus in Odyssey viii, 266 ff., but only as superficially similar,
    while stressing a different emphasis in the hymn: Aphrodite as a victim of forces
    stronger than herself.'
  claim_level: same_motif
  target: Lay of Demodocus, Odyssey viii, 266 ff.
  evidence_refs:
  - ev:3
  counter_evidence_refs:
  - ev:3
  confidence: low
  limitations: The passage does not state the shared narrative details; it also cautions
    that the similarity is superficial.
- id: claim:2
  claim: The Dionysus pirate episode summarized here is said to have a visual representation
    in a different form on reliefs from the choragic monument of Lysicrates.
  claim_level: visual_similarity
  target: Reliefs from the choragic monument of Lysicrates, now in the British Museum
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: high
  limitations: The passage says the reliefs show the story in a different form but
    does not describe the visual differences.
- id: claim:3
  claim: The punishment of the Cercopes by Heracles is linked to an early visual representation
    on a metope from Selinus.
  claim_level: visual_similarity
  target: One of the earlier metopes from Selinus
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The passage only notes the representation and gives no iconographic
    detail.
