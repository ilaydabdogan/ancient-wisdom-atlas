canonical_text:
  quote: ''
  summary: The hymn praises Artemis as a golden-shafted maiden huntress, sister of
    Apollo. She hunts over hills, peaks, mountains, woods, sea, and wild beasts, then
    goes to Apollo's house at Delphi, puts away her bow and arrows, leads dances of
    the Muses and Graces, and is hailed with Apollo as a child of Zeus and Leto.
  language: English
  quote_policy: summarized
