  summary: The speaker addresses Perses with instructions about justice, truthful
    witness, labor, wealth, reciprocity, household management, proper treatment of
    others, and ritual offerings to the gods. Zeus and the gods are presented as rewarding
    right conduct and punishing violence, falsehood, impiety, and social wrongs.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker addresses Perses and tells him to store the instruction in his
    heart, listen to right, and stop thinking of violence.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The son of Cronos is said to have ordained that fishes, beasts, and birds
    devour one another because right is not in them, while mankind received right.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Zeus is said to give prosperity to one who knows and speaks right, while false
    witness and perjury harm Justice and leave the offender's generation obscure.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Badness is described as easy, near, and reached by a smooth road; Goodness
    is described as separated from people by sweat, reached by a long, steep, rough
    path that becomes easier after the top is reached.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker ranks the person who considers things himself as best, the person
    who listens to a good adviser as good, and the person who does neither as unprofitable.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Perses is urged to work so that Hunger may hate him and Demeter may love him
    and fill his barn with food.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The idle man is compared to stingless drones that consume the bees' labor
    without working, and both gods and men are said to be angry with such a man.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: Wealth taken violently or deceptively is said to last only briefly because
    the gods blot out the wrongdoer and make his house low.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Zeus is said to be angry with people who wrong a suppliant or guest, violate
    a brother's marriage, offend fatherless children, or abuse an aged father, and
    he lays heavy requittal on them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: The speaker instructs Perses to sacrifice purely and cleanly, burn rich meats,
    and propitiate the deathless gods with libations and incense at night and morning.
  category: action
  evidence_refs:
  - ev:4
- id: obs:11
  text: The speaker advises calling a friend rather than an enemy to a feast, especially
    a nearby neighbor, because neighbors respond quickly to local trouble.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The speaker instructs Perses to take fair measure from a neighbor and repay
    with the same measure or better.
  category: action
  evidence_refs:
  - ev:5
- id: obs:13
  text: The passage personifies Give as good and Take as bad and death-bringing, and
    says willing giving brings joy while shameless taking freezes the heart.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:14
  text: The speaker says that even with a brother, a promised wage should be fixed
