  text: Apollo is associated with Lycia, Maeonia, Miletus, and Delos, and is said
    to reign especially over Delos.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apollo goes to rocky Pytho playing a hollow lyre, wearing divine perfumed
    garments; the lyre sings sweetly when touched with a golden key.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Apollo speeds from earth to Olympus, to the house of Zeus, and joins the gathering
    of the gods.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The gods attend to lyre and song, and the Muses sing responsively about divine
    gifts and human sufferings.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Graces, Seasons, Harmonia, Hebe, and Aphrodite dance; Artemis sings; Ares
    and the Slayer of Argus sport; Apollo plays with radiance around him; Leto and
    Zeus rejoice as they watch their son.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: 'The narrator names possible song topics: Apollo as wooer, and Apollo going
    over the earth seeking a place of oracle for men.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Apollo travels from Olympus through named regions; the Lelantine plain does
