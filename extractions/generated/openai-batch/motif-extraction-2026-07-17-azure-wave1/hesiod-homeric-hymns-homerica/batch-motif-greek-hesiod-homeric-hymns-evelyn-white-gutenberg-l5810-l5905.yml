  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: At Onchestus, a rite is described in which horses rattle an empty chariot
    without guidance; if the chariot breaks, the horses are cared for, the chariot
    is left, drivers pray to the shrine’s lord, and the chariot falls to the god.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Apollo reaches and crosses the sweet stream Cephissus, then passes Ocalea
    and reaches Haliartus.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: At Telphusa, Apollo says he intends to build a glorious temple and oracle
    for men, where people will bring hecatombs and receive unfailing counsel.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Apollo lays foundations at Telphusa; Telphusa becomes angry, warns that horses
