canonical_text:
  quote: ''
  summary: A section of the Hymn to Pythian Apollo describes Apollo’s music at Pytho
    and Olympus, the divine assembly’s song and dance, possible themes for singing
    about Apollo, and Apollo’s journey through various places while seeking a site
    for an oracle. The passage includes the Onchestus chariot rite, Apollo’s proposed
    oracle at Telphusa, Telphusa’s successful persuasion that he build instead at
    Crisa below Parnassus, and Apollo’s arrival at Crisa.
  language: English
  quote_policy: summarized
