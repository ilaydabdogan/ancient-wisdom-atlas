canonical_text:
  quote: ''
  summary: Apollo chooses a site for an oracle temple, lays its foundations, and receives
    future sacrifices and questions from worshipers. Near a spring he kills a destructive
    she-dragon associated with Typhaon. A flashback explains Hera's anger at Zeus's
    birth of Athena, her complaint about Hephaestus, her prayer to Earth, Heaven,
    and the Titans, and her bearing of Typhaon apart from Zeus. Apollo's killing of
    the dragoness leads to the naming of Pytho and Pythian Apollo. He then punishes
    the deceptive spring Telphusa by covering its streams with rocks and establishes
    an altar there.
  language: English
  quote_policy: summarized
