canonical_text:
  quote: ''
  summary: Hermes invents fire-sticks and fire, slaughters and prepares stolen cattle,
    divides the meat into twelve portions, hides or destroys evidence, returns secretly
    to his cradle, is confronted by his mother Maia, and declares his ambition for
    divine honor and wealth. Apollo then searches for his missing cattle and questions
    an old man, who uncertainly reports seeing a child with a staff driving long-horned
    cattle backwards.
