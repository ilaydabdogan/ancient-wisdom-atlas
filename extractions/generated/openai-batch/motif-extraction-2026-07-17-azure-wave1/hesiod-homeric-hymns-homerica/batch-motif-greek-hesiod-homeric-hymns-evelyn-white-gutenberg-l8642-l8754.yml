canonical_text:
  quote: ''
  summary: The passage surveys rival claims about Homer’s birthplace, parentage, names,
    and relation to Hesiod; reports Pythian oracles about Homer’s origin and death;
    gives a genealogy linking Homer and Hesiod through divine and poetic ancestors;
    and narrates a contest of wit between Homer and Hesiod at Chalcis during funeral
    rites for Amphidamas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Hesiod is said to have named his native place as Ascra near Helicon, while
    many cities claim Homer as their own.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Smyrnaeans say Homer was the son of the River Meles and the nymph Cretheis,
    was first called Melesigenes, and later received the name Homer after becoming
    blind.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Chians claim Homer as their countryman and cite descendants called Homeridae;
    the Colophonians show a place where they say he began composing as a schoolmaster
    and identify the Margites as his first work.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage lists multiple conflicting accounts of Homer’s father, mother,
    and names, including human, divine, Muse, and slave-mother claims, and alternative
    explanations of the name Homer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A Pythian response reportedly given in Hadrian’s time names Ithaca as Homer’s
    country, Telemachus as his father, Epicasta daughter of Nestor as his mother,
    and calls him the wisest of mortal kind.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: One genealogy links Homer and Hesiod through a line beginning with Apollo
    and Aethusa, including Linus, Pierus, Oeager, Calliope, Orpheus, and later Dius
    and Apelles; Hesiod is made son of Dius, and Homer descendant of Apelles through
    Maeon and a daughter of the River Meles.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After composing the Margites, Homer is said to have traveled from city to
    city as a minstrel and to have asked the Pythia at Delphi about his identity and
    country.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Pythia tells Homer that Ios is his mother’s country, will receive him
    dead, and that he should beware the riddle of young children.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Ganyctor celebrates funeral rites for his father Amphidamas, king of Euboea,
    and invites those famous for bodily strength, speed, and wit, promising great
    rewards.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Homer and Hesiod meet at Chalcis; leading Chalcidians and Paneides judge;
    Hesiod wins after asking Homer a sequence of questions that Homer answers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: When Hesiod asks what is best for mortal man, Homer answers that it is best
    never to be born, or, once born, to pass quickly through the gates of Hades.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: When Hesiod asks what is most delightful to men, Homer describes a town filled
    with mirth, ordered feasters listening to a minstrel, tables with bread and meat,
    and wine served from a mixing-bowl into cups.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage says Greeks admired Homer’s feast verses as golden and recited
    them at public sacrifices before feasts and libations.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Hesiod, annoyed at Homer’s success, poses a difficult poetic challenge, and
    Homer answers with lines about horses, chariots, victory, and the tomb of Zeus.
  category: sequence
  evidence_refs:
  - ev:9
