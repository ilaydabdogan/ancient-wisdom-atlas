canonical_text:
  quote: ''
  summary: 'The passage recounts the release of human ills from a jar while Hope remains
    inside, then introduces a tale of successive races of mortal men: golden, silver,
    bronze, heroic, and fifth. These races are made or ordered by the gods and Zeus;
    they differ in piety, violence, mortality, and posthumous destiny, including guardian
    spirits, underworld spirits, Hades, and the Isles of the Blessed.'
  language: English
  quote_policy: summarized
