  quote: ''
  summary: The hymn praises Dionysus as ivy-crowned son of Zeus and Semele. Nymphs
    receive and nurture him in Nysa, where he grows in a sweet-smelling cave and is
    reckoned among the immortals. Once raised, he wanders wooded places wreathed with
    ivy and laurel, followed by the Nymphs, and the hymn ends with a prayer for recurring
    seasonal rejoicing.
