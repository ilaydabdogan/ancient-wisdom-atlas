canonical_text:
  quote: ''
  summary: After Metaneira is struck speechless and the household tends the wailing
    child, Celeus orders a temple and altar for Demeter. Demeter withdraws in grief
    for Persephone and causes the earth to stop producing grain, threatening humankind
    and the gods' sacrifices. Zeus sends Iris and then the gods to persuade her, but
    she refuses until she sees her daughter. Zeus then sends Hermes to Erebus to bring
    Persephone back from Hades. Hades permits Persephone to go, promises her honors,
    secretly gives her pomegranate seed, and has her driven by Hermes in a chariot
    back to Demeter's temple.
  language: English
  quote_policy: summarized
