candidate_motifs:
- id: motif:1
  label: Serpentine chaos challenger defeated by divine ruler
  taxonomy_refs:
  - serpent
  - chaos
  - royal_legitimacy
  basis: Typhoeus is a hundred-headed snake or dragon being who could have ruled mortals
    and immortals; Zeus defeats him and casts him into Tartarus.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage does not use the abstract term chaos; that part of the motif
    label is inferred from the cosmic disruption and threat to rule.
- id: motif:2
  label: World-shaking divine combat with fire
  taxonomy_refs:
  - world_destroying_fire
  basis: The conflict makes earth, sky, and sea seethe; fire and vapor scorch and
    melt the earth after Zeus strikes Typhoeus.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage describes severe cosmic effects but not a completed destruction
    or renewal of the world.
- id: motif:3
  label: Kingship confirmed after divine struggle
  taxonomy_refs:
  - royal_legitimacy
  basis: After divine conflict, the gods press Zeus to reign and rule, and he divides
    their dignities.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage gives a brief succession statement rather than a full enthronement
    narrative.
- id: motif:4
  label: Internalized wisdom to prevent succession
  taxonomy_refs:
  - wisdom
  - royal_legitimacy
  basis: Zeus places the wisest Metis inside his belly so that no child of hers will
    replace him and so that she may devise good and evil for him.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The act is described as deception and containment; broader symbolic meanings
    should be reviewed by a human.
- id: motif:5
  label: Divine marriages producing ordered powers and gods
  taxonomy_refs:
  - sacred_marriage
  - divine_parent_child
