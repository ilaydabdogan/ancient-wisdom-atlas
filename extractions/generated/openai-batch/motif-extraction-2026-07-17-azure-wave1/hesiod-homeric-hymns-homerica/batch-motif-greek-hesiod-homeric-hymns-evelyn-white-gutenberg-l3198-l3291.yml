canonical_text:
  quote: ''
  summary: After the Titans are driven from heaven, Earth bears Typhoeus from Tartarus.
    Typhoeus is a many-headed serpentine being whose voices, fire, and force threaten
    divine and mortal rule. Zeus attacks him with thunder, lightning, and thunderbolt,
    scorches and maims him, and casts him into Tartarus. Destructive winds come from
    Typhoeus. The gods then press Zeus to reign, and he distributes honours. The passage
    continues with Zeus’s marriages and unions, including Metis, Themis, Eurynome,
    Demeter, Mnemosyne, Leto, and Hera, and lists the divine children born from them,
    including Athene, the Horae, Moerae, Charites, Persephone, Muses, Apollo, Artemis,
    Hebe, Ares, and Eileithyia.
  language: English
  quote_policy: summarized
