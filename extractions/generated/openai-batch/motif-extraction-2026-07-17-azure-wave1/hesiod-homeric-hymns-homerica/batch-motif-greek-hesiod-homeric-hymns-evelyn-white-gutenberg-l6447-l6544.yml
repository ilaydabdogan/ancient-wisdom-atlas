canonical_text:
  quote: ''
  summary: Hermes and Apollo bring their quarrel over Apollo’s cattle before Zeus
    on Olympus. Apollo accuses the newborn Hermes of stealing and hiding the cattle
    by cunning means. Hermes denies guilt with deceptive speech. Zeus laughs, orders
    Hermes to reveal the cattle, and the two gods go to Pylos and the Alpheus ford.
    Apollo sees cowhides near the cave and tries to bind Hermes, but the bands fail
    and grow from the ground, covering the cattle.
  language: English
  quote_policy: summarized
