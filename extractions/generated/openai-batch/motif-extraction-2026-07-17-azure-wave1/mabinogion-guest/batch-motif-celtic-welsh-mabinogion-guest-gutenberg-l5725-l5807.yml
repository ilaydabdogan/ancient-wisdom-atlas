  quote: ''
  summary: Arthur and Owain continue playing chess while three armed knights arrive
    in succession to report that Owain's Ravens are killing attendants, pages, nobles'
    sons, household men, and horses. Arthur repeatedly asks Owain to forbid the Ravens,
    but Owain tells him to continue the game. After the third petition, Arthur crushes
    the golden chessmen to dust; Owain orders Gwres son of Rheged to lower his banner,
    and peace follows.
