canonical_text:
  quote: ''
  summary: 'Taliesin sings near the door; a great wind-storm arises, and the king
    has Elphin brought from his dungeon. Taliesin sings, and Elphin’s chains open.
    Taliesin then performs several named poems: a devotional hymn asking for Elphin’s
    liberation, a riddling challenge to Heinin’s bards, a reproof of bards, and a
    moral denunciation of false minstrels. The passage concludes that Taliesin freed
    his master, protected the innocence of Elphin’s wife, silenced the bards, and
    showed that Elphin’s wife had no finger missing.'
  language: English
  quote_policy: summarized
