canonical_text:
  quote: ''
  summary: Llevelys explains remedies for the second and third plagues afflicting
    Lludd's dominion. Lludd returns to Britain, destroys the Coranians with water
    containing bruised insects, traps two fighting dragons in a mead-filled cauldron
    at the island's central point, buries them in a kistvaen at Snowdon, and then
    watches a banquet while resisting magical sleep with cold water. A giant magical
    thief arrives, Lludd defeats him in combat, and the defeated figure promises restitution
    and vassalage. The tale concludes that Lludd freed Britain from the three plagues
    and ruled in peace.
  language: English
  quote_policy: summarized
