canonical_text:
  quote: ''
  summary: Arthur delegates a quest to find Mabon son of Modron. Gwrhyr and companions
    question a sequence of ancient animals, each of whom gives testimony of great
    age and guides them onward. The Eagle directs them to the Salmon of Llyn Llyw,
    who carries envoys to Gloucester, where Mabon is found lamenting in a stone prison.
    Arthur’s warriors attack the castle, Kai breaks into the dungeon, and Mabon is
    freed.
  language: English
  quote_policy: summarized
