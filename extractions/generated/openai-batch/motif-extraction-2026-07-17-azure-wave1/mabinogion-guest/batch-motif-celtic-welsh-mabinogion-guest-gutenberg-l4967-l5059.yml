  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Eagle of Gwern Abwy says a rock from which he once pecked at the stars
    is now less than a span high, and he directs the embassy to the Salmon of Llyn
    Llyw.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Eagle reports that the Salmon once dragged him into deep water, later
