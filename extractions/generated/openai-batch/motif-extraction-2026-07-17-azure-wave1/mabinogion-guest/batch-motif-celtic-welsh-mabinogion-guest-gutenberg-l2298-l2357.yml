canonical_text:
  quote: ''
  summary: At Arthur's court in Caerlleon, a black, hideous maiden arrives on a yellow
    mule and rebukes Peredur for failing to ask the meaning of a bleeding spear and
    other wonders at the Lame King's court. She says his failure prevents the king's
    healing and brings conflict and loss. She then tells Arthur of distant places
    where fame may be gained, including a lofty mountain castle where a maiden is
    held prisoner. Gwalchmai vows to attempt the rescue, while Peredur vows to learn
    the meaning of the lance. An armed knight then arrives, accuses Gwalchmai of treachery,
    and challenges him; Gwalchmai accepts and departs, with Peredur also setting out
    separately.
  language: English
  quote_policy: summarized
