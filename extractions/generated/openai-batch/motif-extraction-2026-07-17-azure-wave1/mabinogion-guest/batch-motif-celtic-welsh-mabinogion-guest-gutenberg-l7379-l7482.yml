canonical_text:
  quote: ''
  summary: A man preparing to hang a captured mouse refuses escalating ransom offers
    from a bishop-like visitor until he obtains the release of Pryderi and Rhiannon,
    the removal of the charm and illusion on Dyved, protection from future charms,
    and immunity from vengeance. The visitor identifies himself as Llwyd son of Kilcoed,
    says the mouse is his pregnant wife, explains that he enchanted Dyved to avenge
    Gwawl, and restores the captives, the woman, and the land. The passage then transitions
    to Math son of Mathonwy, lord of Gwynedd, whose feet must be held in a maiden's
    lap, and introduces Goewin and Math's nephews, including Gilvaethwy, who loves
    Goewin.
  language: English
  quote_policy: summarized
