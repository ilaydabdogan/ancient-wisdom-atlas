  summary: Owain views a grand funeral procession for the man he killed and sees the
    grieving Countess of the Fountain, with whom he immediately falls in love. Luned
    identifies the Countess, washes and serves Owain, then goes to the Countess to
    argue that she needs a new defender for her fountain and dominions, preferably
    a knight from Arthur's household.
  language: English
