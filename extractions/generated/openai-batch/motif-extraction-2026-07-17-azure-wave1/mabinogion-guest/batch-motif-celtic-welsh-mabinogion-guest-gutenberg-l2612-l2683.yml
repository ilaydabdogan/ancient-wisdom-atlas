canonical_text:
  quote: ''
  summary: At Arthur's Whitsuntide court at Caerlleon, the royal and ecclesiastical
    arrangements of the court are described. A forester named Madawc reports seeing
    an unmatched pure white stag in the Forest of Dean. Arthur orders a hunt for the
    next morning. Gwenhwyvar asks to attend, and Gwalchmai proposes that whoever takes
    the stag may cut off its head and give it to a chosen lady. After a night of entertainment,
    Arthur rises, leaves Gwenhwyvar sleeping, hears hunting horns, and the assembly
    sets out for the forest.
  language: English
