canonical_text:
  quote: ''
  summary: A dispossessed maiden is pressured by her foster-brothers to seek Peredur’s
    aid. She explains that an earl who wished to marry her has conquered her lands
    except for one fortified house. Peredur defends her over three days of combat,
    compels the earl’s subordinates and then the earl to restore lands and supplies,
    establishes her government, and departs after promising future protection.
  language: English
  quote_policy: summarized
