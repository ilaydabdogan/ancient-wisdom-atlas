canonical_text:
  quote: ''
  summary: Geraint tells Erbin he is leaving on a quest and sets out with Enid, ordering
    her to ride ahead and remain silent unless he speaks first. They choose a dangerous
    road and encounter two successive groups of armed horsemen who intend to seize
    horses, armour, and the lady. Enid warns Geraint despite his command; he rebukes
    her but defeats four attackers, then three more, and gathers their horses and
    armour as spoil.
  language: English
  quote_policy: summarized
