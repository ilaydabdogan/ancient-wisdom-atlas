canonical_text:
  quote: ''
  summary: Pwyll and his company repeatedly see a mounted lady crossing the same road
    at the same pace. Two riders cannot overtake her, and Pwyll suspects illusion.
    On the third day Pwyll himself follows, cannot gain on her, and asks her to stop;
    she stops immediately. She reveals herself as Rhiannon, daughter of Heveydd Hn,
    says her chief quest was to seek Pwyll, and explains that others have tried to
    give her to a husband against her will. Pwyll chooses her, and she asks him to
    pledge to meet her in one year at Heveydd's palace, where she will prepare a feast.
    After the year passes, Pwyll goes there with a hundred knights and is joyfully
    received.
  language: English
  quote_policy: summarized
