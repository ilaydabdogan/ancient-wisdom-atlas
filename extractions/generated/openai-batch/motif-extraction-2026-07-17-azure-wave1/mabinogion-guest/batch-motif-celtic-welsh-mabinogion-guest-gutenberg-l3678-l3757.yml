canonical_text:
  quote: I seek adventures, and go where I list.
  summary: In a hot wood, the wounded Geraint and Enid rest under trees. Arthur's
    company arrives nearby. Kai tries to compel Geraint to visit Arthur and is knocked
    down. Gwalchmai then confronts Geraint, recognizes him, and secretly arranges
    for Arthur's tent to be set by the road. Arthur prevents Geraint from continuing
    until healed, sends Enid to Gwenhwyvar's chamber, and orders a tent, provisions,
    and physicians for Geraint.
  language: English
  quote_policy: quoted
