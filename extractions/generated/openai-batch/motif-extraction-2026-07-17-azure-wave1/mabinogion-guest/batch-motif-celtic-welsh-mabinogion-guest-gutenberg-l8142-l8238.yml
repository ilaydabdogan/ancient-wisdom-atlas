canonical_text:
  quote: ''
  summary: Maxen Wledig, emperor of Rome, goes hunting with his retinue and vassal
    kings. Overcome by heat, he sleeps under shields set up by his attendants and
    dreams of travelling through rivers, a world-high mountain, seas, islands, castles,
    a splendid ship, a golden and gemmed hall, chess-playing youths, an elder carving
    chessmen, and an extraordinarily beautiful maiden. In the dream the maiden rises
    and sits with him in a golden chair, but noises from the hunting party wake him.
    Afterward he is lovesick, avoids ordinary pleasures, and repeatedly sleeps in
    order to see the maiden again.
  language: English
  quote_policy: summarized
