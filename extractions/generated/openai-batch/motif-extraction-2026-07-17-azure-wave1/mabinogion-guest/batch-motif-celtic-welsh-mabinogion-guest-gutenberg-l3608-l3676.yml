canonical_text:
  quote: Thou canst not go by his tower on the other side of the bridge, unless thou
    dost intend to combat him;
  summary: Geraint and Enid approach a fair river valley, bridge, and fortified town.
    A local knight warns that Gwiffert Petit, the Little King, challenges every knight
    who passes his tower. Geraint proceeds, is confronted by the Little King, fights
    him fiercely, defeats and spares him, and receives his pledge of future aid. Though
    urged to rest, Geraint continues wounded toward a wood with Enid going first.
  language: English
  quote_policy: quoted
