canonical_text:
  quote: the dread they felt at seeing the dead man rise up to slay them
  summary: After recovering from wounds, Geraint leaves Arthur and travels with Enid.
    They hear a woman mourning her slain husband, whom three giants have killed. Geraint
    pursues and kills the giants but is gravely wounded and collapses. The Earl of
    Limours takes Geraint, thought nearly dead, to his court and attempts to compel
    Enid to eat, drink, change clothes, and accept him. When the Earl strikes Enid,
    her cry rouses Geraint from his swoon; Geraint rises from the bier and kills the
    Earl, causing the onlookers to flee in dread.
  language: English
  quote_policy: quoted
