canonical_text:
  quote: ''
  summary: At a feast where Pwyll sits between Heveydd Hn and Rhiannon, a tall royal-looking
    youth enters and asks Pwyll for a boon. Pwyll promises whatever he can give, and
    the youth asks for Rhiannon as bride along with the feast and banquet. Rhiannon
    identifies him as Gwawl son of Clud, an unwanted former suitor, and instructs
    Pwyll to yield publicly while using a small bag, a one-year delay, disguise, hidden
    knights, and a horn signal to trap Gwawl later. The passage ends with Pwyll and
    Rhiannon limiting the gift of the current feast and arranging a banquet one year
    later.
  language: English
  quote_policy: summarized
