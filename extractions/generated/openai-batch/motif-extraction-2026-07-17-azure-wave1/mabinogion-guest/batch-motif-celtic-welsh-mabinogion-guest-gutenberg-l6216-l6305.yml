canonical_text:
  quote: And then was the game of Badger in the Bag first played.
  summary: At Heveydd Hn's feast, Pwyll enters in ragged disguise with a bag, tricks
    Gwawl into stepping inside it, binds him there, summons his household, and has
    Gwawl beaten in a game called Badger in the Bag. Gwawl is released after accepting
    a covenant involving compensation and no revenge. Pwyll and Rhiannon then distribute
    gifts, travel to Dyved, and rule prosperously.
  language: English
  quote_policy: quoted
