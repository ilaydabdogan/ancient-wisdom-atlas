canonical_text:
  quote: ''
  summary: Geraint and Enid travel across a plain toward a vast wood. Five armed horsemen
    plan to seize their horses, arms, and Enid; Enid warns Geraint despite his command
    of silence, and Geraint defeats the horsemen. He burdens Enid with the captured
    horses and armour. Night overtakes them near the wood; Geraint sleeps in his armour
    while Enid watches the horses. At dawn they travel through open country by meadows
    and a river, then meet a youth from a city who offers Geraint bread, meat, and
    wine intended for mowers.
