canonical_text:
  quote: ''
  summary: Peredur rides into a wood, meets his foster-sister mourning her slain husband,
    learns of his mother's death and the identity of the dwarf and dwarfess, buries
    the body, defeats the slayer, and imposes terms of mercy. The defeated knight
    takes the woman to Arthur's Court and reports Peredur's message against Kai. Peredur
    continues to a deserted wood and a weed-grown castle, where red-haired youths
    serve him, a fair but poorly clothed maiden welcomes him, nuns bring scarce bread
    and wine, and Peredur distributes the meal equally before sleeping.
  language: English
  quote_policy: summarized
