canonical_text:
  quote: ''
  summary: Arthur receives and honors Enid, gives her to Geraint, and the court celebrates
    their union. Gwenhwyvar awards Enid the stag's head, increasing her fame, while
    Geraint gains renown in tournaments. Later, ambassadors from Cornwall report that
    Erbin is old and that neighboring chiefs threaten his lands; they ask that Geraint
    return to defend his inheritance. Arthur reluctantly counsels Geraint to go, and
    Gwenhwyvar considers provision and companions for Enid.
  language: English
  quote_policy: summarized
