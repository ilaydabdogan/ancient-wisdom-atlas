canonical_text:
  quote: it is thy destiny not to be suited with a wife until thou obtain Olwen
  summary: A lady returns home, questions the king about his concealed children, and
    the king brings his son to court. The stepmother tells the youth that he will
    not have a wife until he obtains Olwen, daughter of Yspaddaden Penkawr; the youth
    immediately feels love for Olwen though he has not seen her. His father directs
    him to seek Arthur, his cousin, for hair-cutting and a boon. The youth rides richly
    equipped toward Arthur’s palace. At the gate, the porter refuses entry because
    of palace law and offers hospitality outside the court. The youth refuses the
    arrangement and threatens deadly shouts with harmful consequences, but Glewlwyd
    Gavaelvawr maintains that he may not enter until the porter speaks with Arthur.
  language: English
  quote_policy: quoted
