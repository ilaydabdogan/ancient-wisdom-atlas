canonical_text:
  quote: ''
  summary: Peredur prepares for a tournament, sees a beautiful maiden in a splendid
    tent, and spends days gazing at her until the miller prods him into combat. He
    overthrows tournament opponents, sends captives to the Empress and arms and horses
    to the miller's wife. After refusing summons from the Empress and defeating a
    hundred knights, he is persuaded by a wise counselor to visit her. Three challengers
    successively bring wine vessels to the Empress, each asking that the vessel be
    given only to one willing to fight; Peredur receives them, sends the vessels to
    the miller's wife, and slays the three men the next day. The Empress reminds him
    of a prior pledge involving a stone and the killing of the Addanc, and he remains
    entertained by her for fourteen years.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Peredur equips himself and his horse for the tournament and sees a tent described
    as the fairest he had ever seen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A beautiful maiden in a satin garment leans from a window of the tent; Peredur
    gazes at her and begins to love her greatly, remaining there from morning until
    evening.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Peredur borrows money from the miller; the miller's wife is angry, but the
    miller lends him money, and the borrowing is repeated the next day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: On the third day, while Peredur gazes at the maiden, the miller strikes him
    with the edge of an axe and tells him either to turn his head away or go to the
    tournament.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Peredur goes to the tournament, overthrows those who encounter him, sends
