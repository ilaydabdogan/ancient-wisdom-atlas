  summary: The passage opens “The Lady of the Fountain” at Arthur’s court in Caerlleon.
    Arthur sleeps while his companions receive mead and meat, and Kynon begins a first-person
    tale of leaving his own country to seek adventures. He travels through distant
    regions to a fair river valley, reaches a lustrous castle by a torrent, sees two
    ornate youths and a courteous man, and is received in the castle hall by twenty-four
    damsels who wash, clothe, seat, and feed him with elaborate hospitality.
