canonical_text:
  quote: ''
  summary: Gwydion draws the eagle-form Llew down from an oak tree and restores him
    with a magic wand. Llew is healed, seeks retribution and recovery of his right,
    and Gwynedd is gathered. Blodeuwedd flees with her maidens; the maidens drown,
    and Gwydion transforms Blodeuwedd into an owl. Gronw offers compensation, but
    Llew demands a reciprocal dart-blow at the place of his own wounding. Gronw’s
    followers refuse to stand in his place. Llew’s dart pierces a stone slab and Gronw,
    killing him; the pierced slab is named Llech Gronw. Llew then retakes the land
    and governs Gwynedd.
  language: English
  quote_policy: summarized
