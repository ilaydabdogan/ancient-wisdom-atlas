canonical_text:
  quote: ''
  summary: 'The passage recounts the end of Pwyll''s year acting in Arawn''s place:
    he meets Havgan at the Ford, defeats him in single combat, receives homage, and
    brings both kingdoms under control. Pwyll then meets Arawn at Glyn Cuch, they
    regain their proper forms, and each returns home. Pwyll''s nobles praise the just
    and generous rule they experienced during the year, and Pwyll explains the exchange.
    Pwyll and Arawn strengthen their friendship through gifts, and Pwyll gains the
    title Chief of Annwvyn. A new episode begins at Narberth, where Pwyll sits on
    Gorsedd Arberth, a mound said to bring either wounds or a wonder; he sees an unknown
    lady on a large white horse in a shining gold garment, and a man sent after her
    cannot catch her on foot.'
  language: English
  quote_policy: summarized
