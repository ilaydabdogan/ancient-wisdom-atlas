canonical_text:
  quote: "“Below us ... there is a hedge of mist, and within it are enchanted games,
    and no one who has gone there has ever returned.”"
  summary: Geraint retrieves his horse, carries Enid onward, is pursued, and is recognized
    by the Little King, who brings him to safety and healing. After recovering, Geraint
    chooses a warned-against lower road leading to Earl Owain’s court and to enchanted
    games within a mist hedge from which none have returned. He accepts hospitality,
    refuses exemption from the games, arms himself, and approaches a lofty hedge marked
    with many heads on stakes; no one may enter with him.
  language: English
  quote_policy: quoted
