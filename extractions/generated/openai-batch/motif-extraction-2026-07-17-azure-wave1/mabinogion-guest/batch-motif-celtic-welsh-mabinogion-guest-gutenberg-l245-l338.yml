canonical_text:
  quote: ''
  summary: The passage presents a literary-historical argument that Welsh place-names,
    often commemorating events or renowned persons, can preserve evidence for the
    antiquity of legends connected with the Mabinogion. It classifies names by great
    natural features, lesser features, and mixed natural or artificial works, gives
    examples involving figures such as Idris, Arthur, Arianrod, Howell, Goronwy, and
    Vortigern, cautions against excessive etymological interpretation, and concludes
    that the Mabinogion preserves a Welsh original related to an older Celtic nucleus
    within European medieval romance.
  language: English
  quote_policy: summarized
