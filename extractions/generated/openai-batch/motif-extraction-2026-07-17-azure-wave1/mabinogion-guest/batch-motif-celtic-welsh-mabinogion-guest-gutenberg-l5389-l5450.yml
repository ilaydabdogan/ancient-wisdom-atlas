  quote: ''
  summary: The passage opens The Dream of Rhonabwy by describing Madawc’s rule in
    Powys, his brother Iorwerth’s resentment and violent raid into Loegria, the dispatch
    of searchers, and Rhonabwy’s arrival with companions at a filthy, smoky house.
