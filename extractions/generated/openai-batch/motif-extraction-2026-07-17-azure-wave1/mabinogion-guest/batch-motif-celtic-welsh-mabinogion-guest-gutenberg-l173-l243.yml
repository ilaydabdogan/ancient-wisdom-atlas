literal_observations:
- id: obs:1
  text: The passage names Wace and Geoffrey as figures for whom claims had been made
    as channels by which Cymric tales passed into Continental Romance, and adds Layamon
    as a third nearly contemporary author.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Layamon is described as a Saxon priest living about 1200 on the upper Severn,
    who acknowledged the English Bede, Latin Albin, and French Wace as sources for
    his British history, with Wace as his chief and only avowed Welsh-matter authority.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says Layamon’s work contains Welsh names and stories not found
    in Wace or Geoffrey, and concludes that he had independent access to Welsh literature
    current at the time.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage reports that Abbé de la Rue believed Gaimar, an Anglo-Norman in
    Stephen’s reign, had access to an independent Welsh authority.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The English version of Sir Tristrem is said to have been considered by Sir
    Walter Scott to come from a distinct Celtic source, and the editor of the Auntours
    of Arthur is said to hint at a similar claim.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The passage states that portions of Welsh and Armorican fiction crossed the
    Celtic border and contributed to the ornate and widespread romance of the Age
    of Chivalry, and that a large portion of Medieval Romance stocks proceeded from
    Wales.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The passage states that Wales possessed ancient literature, including lyric
    compositions and triads arranging historical facts or moral aphorisms, with Sharon
    Turner credited for showing the antiquity of many compositions.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage identifies the Red Book of Hergest as the chief ancient manuscript
    for Welsh romantic literature, now in Jesus College, Oxford, and says it contains
    poems and the prose romances known as Mabinogion; it also describes the Black
    Book of Caermarthen as containing poems only.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: 'The passage divides the existing Mabinogion into two classes: an older class
    with few Norman allusions and a less ancient class full of Norman customs, manners,
    arts, arms, luxuries, and ecclesiastical terms.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage gives Kilhwch and Olwen and the dream of Rhonabwy as examples
    of the older class, and the Lady of the Fountain, Peredur, and Geraint ab Erbin
    as examples of the later or decorated class.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: The passage names Amlyn and Amic, Sir Bevis of Hamtoun, the Seven Wise Masters,
