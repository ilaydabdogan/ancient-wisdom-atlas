  summary: The passage is a scholarly introduction discussing alleged channels by
    which Welsh and Armorican fiction entered Continental and English romance traditions,
    the manuscript preservation of Welsh romantic literature, and a distinction between
    older Welsh-rooted Mabinogion tales, later Norman-influenced tales, and foreign
    tales excluded from the Welsh romance canon.
  language: English
