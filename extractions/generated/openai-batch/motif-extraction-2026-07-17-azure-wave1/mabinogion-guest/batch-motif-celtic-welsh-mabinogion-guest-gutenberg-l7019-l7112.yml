canonical_text:
  quote: ''
  summary: After the head of Bendigeid Vran is buried in the White Mount at London
    facing France, Manawyddan grieves over his displacement. Pryderi offers him Rhiannon
    and the seven Cantrevs of Dyved, and Manawyddan marries Rhiannon at Narberth.
    The four companions enjoy Dyved until, after a thunderstorm and thick mist at
    the Gorsedd of Narberth, the land is emptied of people, domestic animals, dwellings,
    smoke, and fire, leaving only the four of them. They live by hunting and wild
    honey for two years, then leave for Lloegyr, where Manawyddan makes saddles and
    blue-enamel housings after the manner of Llasar Llaesgywydd.
  language: English
  quote_policy: summarized
