canonical_text:
  quote: ''
  summary: Pwyll, lord of Dyved, goes hunting at Glyn Cuch, becomes separated from
    his companions, and encounters strange hounds that have brought down a stag. He
    drives them away and sets his own dogs on the stag. Arawn, king of Annwvyn, rebukes
    him for discourtesy and offers reconciliation if Pwyll will go to Annwvyn in Arawn's
    form for a year, defeat Havgan at a ford, and follow the condition of striking
    only once. Arawn promises to take Pwyll's place in Dyved. Pwyll is guided to Arawn's
    court, where no one recognizes the substitution; he is received, clothed, seated
    with the queen, and joins a rich feast.
  language: English
  quote_policy: summarized
