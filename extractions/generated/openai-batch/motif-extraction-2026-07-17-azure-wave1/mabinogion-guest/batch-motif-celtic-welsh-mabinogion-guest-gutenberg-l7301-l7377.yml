canonical_text:
  quote: ''
  summary: Manawyddan watches a croft at midnight and sees an innumerable host of
    mice cutting off and carrying away the ears of wheat. He catches one slower mouse,
    confines it in a glove, and says he will hang it as a thief. Kicva advises that
    such an act would be unseemly for a man of dignity. Manawyddan takes the mouse
    to the Gorsedd of Narberth, sets up an improvised hanging frame, and refuses successive
    offers from a poor scholar and a priest to buy the mouse's freedom.
  language: English
  quote_policy: summarized
