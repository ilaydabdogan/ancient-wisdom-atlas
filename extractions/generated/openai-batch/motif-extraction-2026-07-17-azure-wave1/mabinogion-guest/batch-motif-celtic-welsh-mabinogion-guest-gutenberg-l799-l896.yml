canonical_text:
  quote: ''
  summary: Luned secretly returns to Owain, arranges his presentation to the Countess,
    and the Countess recognizes him as the killer of her former lord. She asks her
    subjects whether one of them will marry her or whether she may take an outside
    husband to defend the earldom; they consent to her marriage with Owain, clergy
    celebrate the wedding, and Owain receives homage and defends the Fountain for
    three years. Arthur grieves over Owain’s absence and sets out with his household,
    guided by Kynon. After receiving hospitality at a vast castle, the party reaches
    the black man, the green tree, the fountain, bowl, and slab. Kai pours water on
    the slab, causing thunder and a deadly shower, after which the tree becomes leafless,
    birds sing on it, and a black knight arrives and overthrows Kai.
  language: English
  quote_policy: summarized
