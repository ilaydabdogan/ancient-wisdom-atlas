candidate_motifs:
- id: motif:1
  label: Marriage to an outside defender legitimates rule
  taxonomy_refs:
  - royal_legitimacy
  basis: The Countess presents the earldom as defenceless, asks for consent to marry
    an outside defender, marries Owain, and the men of the earldom do him homage.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage frames the marriage politically and militarily; it does not
    present the marriage as divine or explicitly sacred.
- id: motif:2
  label: Slayer becomes protector of the slain lord’s domain
  taxonomy_refs:
  - royal_legitimacy
  basis: The Countess identifies Owain as the killer of her lord; after deliberation
    and marriage, Owain receives homage and defends the Fountain and dominion.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage gives the sequence of recognition, marriage, homage, and defence,
    but does not explicitly state an abstract rule of succession.
- id: motif:3
  label: Search expedition for a missing companion
  taxonomy_refs:
  - mystical_quest
  - departure
  - return
  basis: Arthur grieves over Owain’s long absence and sets out with his household,
    guided by Kynon, to avenge, free, or bring Owain back.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The stated purpose is recovery of Owain; the more wondrous elements appear
    later at the castle and fountain.
- id: motif:4
  label: Water poured at a marked place summons storm and combat
  taxonomy_refs:
  - mystical_quest
  - initiation
  basis: Kai pours a bowlful of water on the slab by the fountain; thunder and a deadly
