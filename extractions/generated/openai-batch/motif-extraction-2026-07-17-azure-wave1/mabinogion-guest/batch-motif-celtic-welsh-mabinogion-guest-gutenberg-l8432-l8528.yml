canonical_text:
  quote: ''
  summary: 'The passage opens the story of Lludd and Llevelys. Beli''s son Lludd inherits
    Britain, prospers, and rebuilds London. His brother Llevelys, described as wise,
    marries the sole heiress of France and receives the crown. Britain then suffers
    three plagues: the all-hearing Coranians, a destructive May-eve shriek, and the
    nightly disappearance of provisions. Lludd secretly goes to Llevelys for counsel.
    The brothers meet at sea, use a brass horn to avoid wind-carried speech, expel
    a demon from the horn with wine, and Llevelys gives instructions for insect-infused
    water that will poison the Coranians while sparing Lludd''s people.'
  language: English
  quote_policy: summarized
