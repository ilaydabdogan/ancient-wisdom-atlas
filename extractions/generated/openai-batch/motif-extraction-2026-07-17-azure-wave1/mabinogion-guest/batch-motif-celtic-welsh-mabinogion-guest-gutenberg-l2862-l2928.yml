canonical_text:
  quote: ''
  summary: At dawn Geraint challenges the Knight of the Sparrow-Hawk over the right
    of a lady to claim the Sparrow-Hawk. They fight first with lances and then with
    swords. The hoary-headed man supports Geraint, while the dwarf supports the opposing
    knight. After being reminded of insults against himself and Gwenhwyvar's maiden,
    Geraint wounds the knight, who yields and is sent to Arthur's court to make satisfaction.
    The knight identifies himself as Edeyrn son of Nudd and departs with his beloved
    lady and the dwarf.
  language: English
  quote_policy: summarized
