canonical_text:
  quote: ''
  summary: Bendigeid Vran reads of Branwen's suffering, summons forces, and resolves
    to go to Ireland while leaving ministers to govern the island. His host crosses
    the sea. Irish swineherds report a moving wood, mountain, ridge, and lakes; Branwen
    explains these as ships' masts and the enormous Bendigeid Vran, whose eyes appear
    as lakes. The Irish retreat across the Linon and break the bridge, but Bendigeid
    Vran lies across the river so his host can cross. Matholwch's messengers offer
    the kingdom of Ireland to Gwern as compensation; Bendigeid Vran demands a stronger
    settlement, and the messengers advise building a house large enough for him and
    yielding the kingdom to his will.
  language: English
  quote_policy: summarized
