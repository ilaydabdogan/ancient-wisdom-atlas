canonical_text:
  quote: ''
  summary: 'The passage opens the tale of Taliesin: Caridwen prepares a year-and-day
    cauldron of inspiration for her ill-favoured son Avagddu, but Gwion Bach accidentally
    receives the three potent drops and gains foresight. Caridwen pursues him through
    successive transformations, swallows him as a grain, bears him after nine months,
    and casts the beautiful child in a leathern bag into the sea. Elphin finds the
    child at Gwyddno''s weir, names him Taliesin, and receives consolation and a prophecy
    of honour from him.'
  language: English
  quote_policy: summarized
