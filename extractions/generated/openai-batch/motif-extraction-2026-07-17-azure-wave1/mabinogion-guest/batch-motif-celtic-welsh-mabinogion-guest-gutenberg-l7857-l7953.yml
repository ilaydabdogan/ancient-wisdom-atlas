canonical_text:
  quote: ''
  summary: Gwydion uses magic to create the appearance of an attacking fleet and army,
    causing Arianrod to arm her son and thereby defeat a prior prohibition. Arianrod
    then lays a new destiny that the youth shall have no wife from the race inhabiting
    the earth. Gwydion and Math form Blodeuwedd from flowers as his wife. After the
    youth is given land and a palace, Blodeuwedd receives the hunter Gronw Pebyr as
    a guest, and the two fall in love. Gronw advises her to learn from Llew Llaw Gyffes
    the manner of his death under the appearance of concern for him.
  language: English
  quote_policy: summarized
