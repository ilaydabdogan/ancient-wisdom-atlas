canonical_text:
  quote: ''
  summary: Peredur reaches a river valley and is directed to a king's palace, where
    the king's daughter entertains him. A yellow page reports that the daughter appears
    attached to him, and the king has Peredur imprisoned. The daughter comforts him
    and later supplies horse, arms, a scarlet robe, and a yellow shield so he can
    attend a battle against a powerful earl. Peredur fights repeatedly while returning
    to prison, kills the earl, and is revealed by the maiden. The king offers marriage
    and lands, but Peredur says he seeks the Castle of Wonders. The maiden gives directions,
    provisions, and a guide, saying the castle lies in a lake beyond a mountain.
  language: English
  quote_policy: summarized
