  summary: Arthur and Owain play chess while three richly equipped youths from animal-emblazoned
    tents bring escalating reports that Arthur's attendants are harming Owain's Ravens.
    After Owain orders a banner raised where the fighting is thickest, the Ravens
    rise, recover energy, and attack the men who had injured them.
