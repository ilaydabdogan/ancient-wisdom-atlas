canonical_text:
  quote: ''
  summary: The passage introduces Peredur as the youngest surviving son of Earl Evrawc
    after his father and six brothers are slain. His mother removes him to wilderness
    seclusion and keeps horses and arms from him. Peredur misidentifies hinds as hornless
    goats, later misidentifies knights as angels, learns from Owain about knights
    and their equipment, prepares an improvised mount, and receives his mother's instructions
    before riding toward Arthur's Court.
