canonical_text:
  quote: ''
  summary: Peredur enters an open castle hall, sees chessmen playing by themselves,
    and throws the chessboard into a lake. A black maiden says he has caused the Empress
    the loss of her chessboard and sends him to slay a black man at the Castle of
    Ysbidinongyl. After first granting mercy, Peredur returns and kills the black
    man. The maiden then says he may not see the Empress unless he kills a destructive
    one-horned stag in the forest. A small dog belonging to the Empress guides him
    and rouses the stag, and Peredur beheads it. A lady on horseback arrives, takes
    the dog, calls the stag the fairest jewel in her dominions, and offers friendship
    if Peredur challenges a man three times at a cromlech in a grove on a mountain.
  language: English
  quote_policy: summarized
