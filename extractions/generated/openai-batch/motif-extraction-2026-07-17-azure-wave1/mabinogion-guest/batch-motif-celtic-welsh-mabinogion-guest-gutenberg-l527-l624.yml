canonical_text:
  quote: ''
  summary: Kynon recounts reaching a summit where a tree, fountain, marble slab, and
    chained silver bowl stand. When he pours water from the bowl onto the slab, thunder
    and a deadly hail shower follow; after he shelters himself and his horse, birds
    sing in the stripped tree. A black-clad knight on a black horse accuses him of
    harming his dominions, defeats him, and takes the horses. Kynon returns ashamed
    and later tells Arthur's court. Owain proposes to seek the place, departs at dawn,
    reaches the described valley and castle, is hosted, and declares that he seeks
    the knight who guards the fountain.
  language: English
  quote_policy: summarized
