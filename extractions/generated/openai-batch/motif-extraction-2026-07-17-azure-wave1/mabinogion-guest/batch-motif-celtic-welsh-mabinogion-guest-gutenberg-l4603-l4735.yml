canonical_text:
  quote: Though thou get this, there is yet that which thou wilt not get.
  summary: A speaker sets a cumulative series of difficult demands connected with
    a daughter’s wedding and marriage feast. The addressee repeatedly replies that
    each demand will be easy. The demanded items include flax, honey, special vessels,
    a basket, horn, harp, cauldron, tusk, blood, bottles, milk-preserving bottles,
    comb and scissors from Twrch Trwyth, and hunting equipment needed to pursue him.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The speaker says nine bushels of flax were sown when he first met the maiden’s
    mother, but none has yet sprung up, and he wants the flax for a white wimple for
    his daughter’s head on the wedding day.
  category: speech
  evidence_refs:
  - ev:1
