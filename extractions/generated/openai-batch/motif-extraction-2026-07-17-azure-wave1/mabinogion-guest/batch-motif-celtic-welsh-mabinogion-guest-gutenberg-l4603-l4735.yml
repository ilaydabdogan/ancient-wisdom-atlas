  text: The speaker requires honey nine times sweeter than the honey of the virgin
    swarm, without scum and bees, to make bragget for the feast.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker requires the vessel of Llwyr son of Llwyryon, described as the
    only vessel in the world able to hold the drink.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker requires the basket of Gwyddneu Garanhir, from which desired meat
    would be found for the whole world, thrice nine men at a time.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker requires the horn of Gwlgawd Gododin to serve liquor on the wedding
    night and the harp of Teirtu to play that night.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The harp of Teirtu is described as playing by itself when a man desires it
