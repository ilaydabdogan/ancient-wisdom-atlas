candidate_motifs:
- id: motif:1
  label: Cumulative impossible bride tasks
  taxonomy_refs:
  - mystical_quest
  basis: The passage repeatedly frames each required object or act as something the
    addressee will not get, yet the addressee answers that it will be easy; the requirements
    are tied to the daughter becoming the addressee’s bride.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:11
  confidence: medium
  cautions: The passage gives the task sequence and wedding context, but does not
    itself label the demands as a bride quest.
- id: motif:2
  label: Magical or unique feast-provision objects
  taxonomy_refs: []
  basis: The required wedding feast objects include a unique drink vessel, an abundance
    basket, a liquor horn, a self-playing harp, and a cauldron for boiling meat.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The magical properties are explicit for the basket and harp; other objects
    are marked as unique or necessary rather than fully described as magical.
- id: motif:3
  label: Ritual grooming through difficult acquisitions
  taxonomy_refs: []
  basis: The speaker’s shaving and hair arrangement require a tusk plucked alive from
    Yskithyrwyn, blood from a sorceress, heat-preserving bottles, and comb and scissors
    from Twrch Trwyth.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:9
  confidence: high
  cautions: The passage presents these as practical requirements for grooming; any
    ritual interpretation requires caution.
- id: motif:4
  label: Chain of prerequisites for hunting a dangerous bearer of objects
  taxonomy_refs:
  - mystical_quest
  basis: To obtain the comb and scissors from Twrch Trwyth, the passage says he cannot
    be hunted without Drudwyn, and Drudwyn requires a unique leash and collar.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The danger of Twrch Trwyth is implied by the escalating prerequisites
    rather than explicitly described in this passage.
- id: motif:5
  label: Supernatural preservation containers
  taxonomy_refs: []
  basis: The bottles of Gwyddolwyd Gorr preserve heat from east to west, and the bottles
    of Rhinnon Rhin Barnawd prevent liquor from turning sour.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage describes the containers’ properties but does not compare
    them to other traditions.
