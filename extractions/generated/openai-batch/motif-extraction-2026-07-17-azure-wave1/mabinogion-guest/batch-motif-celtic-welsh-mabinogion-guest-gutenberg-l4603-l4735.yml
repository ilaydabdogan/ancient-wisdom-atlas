  category: attribute
  evidence_refs:
  - ev:4
- id: obs:8
  text: The speaker requires the cauldron of Diwrnach Wyddel, steward of Odgar son
    of Aedd, king of Ireland, to boil meat for the marriage feast.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker requires the tusk of Yskithyrwyn Penbaedd to shave himself, and
