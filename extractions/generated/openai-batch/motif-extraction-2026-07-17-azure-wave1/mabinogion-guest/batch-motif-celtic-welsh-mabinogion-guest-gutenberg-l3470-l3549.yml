canonical_text:
  quote: ''
  summary: Geraint and Enid are served by a youth, who is rewarded and secures lodging
    for them. The youth mediates with the Earl. Geraint keeps Enid apart in the chamber
    and later receives the Earl and his twelve knights. The Earl notices Enid, desires
    her, offers her his earldom, threatens to kill Geraint and keep her, and agrees
    when Enid tells him to return the next day and take her away as if she knew nothing.
    Enid does not report the conversation to Geraint because she fears causing his
    anger and distress.
  language: English
