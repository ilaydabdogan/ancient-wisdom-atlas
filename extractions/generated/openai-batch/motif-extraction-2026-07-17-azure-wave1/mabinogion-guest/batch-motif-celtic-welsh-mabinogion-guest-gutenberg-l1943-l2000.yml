canonical_text:
  quote: ''
  summary: Peredur crosses an uninhabited desert, kills a serpent that lies on a gold
    ring and prevents settlement nearby, and takes the ring. After a long silent period
    and altered appearance, he returns toward Arthur's Court, is unrecognized, wounded
    by Kai, defended by Gwalchmai, and cared for at court. He anonymously defeats
    several challengers, including one while using Arthur's horse and arms. Known
    as the Dumb Youth, he is addressed lovingly by Angharad Law Eurawc; he speaks,
    reveals himself as Peredur, and resumes fellowship at Arthur's Court.
  language: English
  quote_policy: summarized
