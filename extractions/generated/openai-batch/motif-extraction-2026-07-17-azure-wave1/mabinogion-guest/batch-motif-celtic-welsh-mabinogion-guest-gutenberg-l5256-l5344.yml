    after the shouting and barking.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After Arthur again sees Twrch Trwyth, he sets men and dogs on him; several
    of Twrch's pigs or swine are killed, leaving only Grugyn Gwallt Ereint and Llwydawg
    Govynnyad alive with him from that place.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Llwch Ewin, Twrch Trwyth makes another stand and kills named men and many
    men and dogs; later Llwydawg Govynnyad kills the king of Armorica and two of Arthur's
    maternal uncles before Llwydawg is himself slain.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: At the estuary of the Severn, Arthur summons forces from Cornwall and Devon
    and declares that Twrch Trwyth shall not go into Cornwall while Arthur lives;
    Arthur plans to use knights, dogs, and warriors to force Twrch into the Severn.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: At the Severn, Arthur and the champions of Britain attack Twrch Trwyth; several
