canonical_text:
  quote: ''
  summary: Arthur and his forces pursue Twrch Trwyth and the swine associated with
    him across multiple named places. Twrch Trwyth repeatedly makes stands and kills
    many named warriors, attendants, dogs, and others. Arthur plans to force him into
    the Severn, where champions seize and plunge him into the water; the razor and
    scissors are taken from him, but he escapes before the comb is obtained. Two of
    Arthur's men are drawn into the deep. In Cornwall the comb is finally obtained,
    and the boar is driven into the deep sea, after which his destination is unknown.
    Arthur then goes to Gelli Wic to anoint himself and rest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Twrch Trwyth makes a stand, kills four of Arthur's champions, makes a second
    stand, kills several more including Gwydre son of Arthur, and is wounded.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before day the next morning, Twrch Trwyth kills three attendants of Glewlwyd
    Gavaelvawr, many local men, and Gwlydyn Saer, Arthur's chief architect.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Arthur overtakes Twrch Trwyth at Pelumyawc; Twrch kills more named men, makes
    another stand at Aberteivi, and is later lost by the men and dogs at Glyn Ystu.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Arthur asks Gwyn ab Nudd whether he knows anything of Twrch Trwyth, and Gwyn
    replies that he does not.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Grugyn Gwallt Ereint and Llwydawg Govynnyad kill nearly all the huntsmen at
