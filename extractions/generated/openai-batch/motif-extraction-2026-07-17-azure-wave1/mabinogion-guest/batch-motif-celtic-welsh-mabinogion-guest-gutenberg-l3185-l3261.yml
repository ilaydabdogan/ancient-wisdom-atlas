canonical_text:
  quote: ''
  summary: Geraint leaves Arthur's court with many companions after Gwenhwyvar permits
    Edeyrn to go. Across the Severn he and Enid are welcomed with rejoicing. Erbin
    urges Geraint to take possession of the dominions, boons and gifts are distributed,
    homage is received, Arthur's followers depart, and Geraint inspects the bounds
    of his territories with guides and chief men.
  language: English
