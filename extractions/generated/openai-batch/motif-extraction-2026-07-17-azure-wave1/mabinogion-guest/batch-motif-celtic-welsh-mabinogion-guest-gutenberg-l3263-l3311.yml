canonical_text:
  quote: ''
  summary: Geraint gains fame and enriches his court, then withdraws into ease and
    his wife's chamber, neglecting nobles and former pursuits. Erbin questions Enid
    about whether she caused this, and she denies it with distress. In a summer morning
    chamber scene, Enid laments over Geraint's sleeping body that his arms and breast
    have lost warlike glory; her tears and words awaken him. Geraint misreads her
    lament as desire for another man and orders his horse and arms prepared, commanding
    Enid to dress in her worst riding clothes and not return until his strength is
    tested.
  language: English
  quote_policy: summarized
