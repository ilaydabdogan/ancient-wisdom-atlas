canonical_text:
  quote: ''
  summary: Gwydion brings an unnamed boy to Arianrod, who is told the boy is her son
    and places a destiny on him that he will not have a name until he receives one
    from her. Gwydion uses transformation, disguise, and a shoemaking ruse to bring
    Arianrod to a boat, where the boy shoots a wren and Arianrod's remark gives him
    the name Llew Llaw Gyffes. Arianrod then places another destiny on him, barring
    arms and armour until she invests him with them. Gwydion raises Llew and later
    returns with him to Arianrod's castle in altered form as visiting bards.
  language: English
  quote_policy: summarized
