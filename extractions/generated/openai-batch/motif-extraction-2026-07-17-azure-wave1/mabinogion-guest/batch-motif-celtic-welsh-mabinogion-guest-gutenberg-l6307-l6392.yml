canonical_text:
  quote: ''
  summary: Nobles urge Pwyll to secure an heir; before a year ends, Rhiannon bears
    a son at Narberth. The child disappears while six women watchers sleep, and the
    women frame Rhiannon by using the blood and bones of hound whelps. Pwyll refuses
    to put Rhiannon away, and she undertakes public penance. In Gwent Is Coed, Teirnyon
    watches a mare whose May-night colts have vanished each year; a claw seizes the
    newborn colt, he cuts off the arm, and he later finds a strong infant boy wrapped
    in swaddling-clothes and satin at his door.
  language: English
  quote_policy: summarized
