canonical_text:
  quote: As soon as sleep had come upon his eyes, it seemed to him that he was journeying
    with his companions across the plain of Argyngroeg.
  summary: Rhonabwy, in sleep, seems to travel with companions across Argyngroeg toward
    Rhyd y Groes on the Severn. They encounter Iddawc, a fierce horseman whose horse
    has a strange breath effect, and Iddawc explains his role in provoking the Battle
    of Camlan and his later penance. A second horseman, Rhuvawn Pebyr, appears. The
    company reaches a ford with an encamped host and sees Arthur on a flat island
    with attendants. Iddawc identifies Arthur's ring-stone as enabling Rhonabwy to
    remember the night's vision. Rhuvawn's red troop then approaches and encamps above
    the ford.
  language: English
  quote_policy: quoted
