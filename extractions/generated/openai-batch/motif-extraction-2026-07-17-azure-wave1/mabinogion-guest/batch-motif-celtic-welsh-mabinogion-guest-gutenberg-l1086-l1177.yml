canonical_text:
  quote: ''
  summary: Owain cooks a roebuck and gives part to his lion, then hears Luned, handmaiden
    of the Countess of the Fountain, speaking from imprisonment in a stone vault.
    Luned says she is condemned unless Owain son of Urien returns to deliver her.
    Owain shares food with her, receives directions to a hospitable castle, and travels
    there with the lion. At the castle, the Earl explains that a man-devouring giant
    has captured his two sons and demands the Earl's daughter. Owain fights the giant,
    and the lion escapes confinement to help and kills the giant. Owain restores the
    sons and returns toward Luned, finding two youths leading her to a fire to be
    burned; he offers to fight them in Owain's stead.
  language: English
  quote_policy: summarized
