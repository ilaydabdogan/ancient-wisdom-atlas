canonical_text:
  quote: ''
  summary: During a banquet conversation, Matholwch asks Bendigeid Vran about the
    cauldron he has been given. The cauldron is traced to Llassar Llaesgyvnewid and
    his wife Kymideu Kymeinvoll, giant fugitives from Ireland who escaped a heated
    iron house. Matholwch recounts first meeting them by the Lake of the Cauldron
    and hearing a prediction that Kymideu would bear a fully armed warrior. Later,
    Branwen travels to Ireland with Matholwch, bears Gwern, is punished and isolated
    after Irish anger over Matholwch's insult in Cambria, and secretly sends a letter
    to Britain by a trained starling.
  language: English
  quote_policy: summarized
