canonical_text:
  quote: ''
  summary: Kilhwch adjures many named figures to help him obtain his boon. Arthur
    says he has no knowledge of Olwen and sends messengers for a year, but they return
    without information. Kai rebukes Kilhwch and joins a quest with Bedwyr, Kynddelig,
    Gwrhyr, Gwalchmai, and Menw, each described with special abilities. The party
    travels across a vast plain toward a difficult-to-reach castle and encounters
    a boundless flock, a herdsman on a mound, and an oversized mastiff; the herdsman
    burns dead trees and bushes with his breath.
