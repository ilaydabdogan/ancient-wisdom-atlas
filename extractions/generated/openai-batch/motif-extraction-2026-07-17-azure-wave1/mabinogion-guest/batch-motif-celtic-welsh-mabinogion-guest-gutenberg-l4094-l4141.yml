canonical_text:
  quote: ''
  summary: Glewlwyd reports to Arthur that an exceptionally dignified man is at the
    gate. Arthur orders that the visitor be admitted and treated with full courtesy
    despite Kai's objection. Kilhwch enters mounted, greets Arthur and the whole court,
    refuses ordinary hospitality, seeks a boon, and asks Arthur to bless his hair.
    Arthur grants the request after promising any boon except certain named possessions
    and Gwenhwyvar.
