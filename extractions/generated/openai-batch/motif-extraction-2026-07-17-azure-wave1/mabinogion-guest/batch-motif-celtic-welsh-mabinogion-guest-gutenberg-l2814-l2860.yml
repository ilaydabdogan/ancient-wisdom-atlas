canonical_text:
  quote: ''
  summary: Geraint questions a hoary-headed man about the palace and a coming tournament.
    The man recounts losing his earldom after withholding his nephew's property, explains
    the Sparrow-Hawk contest and its rules, offers Geraint arms and a horse, and permits
    him to challenge on behalf of the man's daughter at daybreak.
  language: English
  quote_policy: summarized
