canonical_text:
  quote: ''
  summary: Peredur rides into wilderness without food or drink, finds a tent in a
    glade that he mistakes for a church, is welcomed by a richly adorned maiden, eats
    part of the provisions, takes her ring with her permission after citing his mother's
    instruction, and departs. The Lord of the Glade later returns, questions the maiden,
    disbelieves her denial of harm, imposes a condition on her lodging, and sets out
    to seek vengeance on Peredur.
  language: English
