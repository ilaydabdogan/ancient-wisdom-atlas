canonical_text:
  quote: ''
  summary: Geraint receives hospitality and healing after the tournament, refuses
    to remain with the young Earl, mediates the restoration of Earl Ynywl's possessions,
    and agrees to take Ynywl's daughter to Arthur's court. The passage then recounts
    Arthur's stag hunt, the cutting off of the stag's head, a dispute over who should
    receive the head, Gwenhwyvar's decision to postpone the award until Geraint returns,
    and the sighting of an approaching mounted group.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The young Earl and his hosts saluted Geraint and invited him to the young
    Earl's castle, but Geraint said he would stay where he had stayed the previous
    night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The young Earl offered provisions and ointment for Geraint's fatigue; attendants
    prepared the lodging with straw and fire, and Geraint's head was washed after
    the ointment was made ready.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Geraint instructed that the maiden should not array herself except in her
    vest and veil until she came to Arthur's court to be clothed by Gwenhwyvar.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: At the meal, Geraint sat with the young Earl and Earl Ynywl on one side, and
    with the maiden and her mother on the other; the company was served abundantly
    and received gifts.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: Geraint refused the young Earl's invitation for the next day and said he would
    go to Arthur's court with the maiden, chiefly to improve Earl Ynywl's maintenance.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Geraint required the young Earl to restore Ynywl's property and arrears; the
    young Earl agreed, men who owed homage to Ynywl performed it, and Ynywl's castle,
    town, possessions, and smallest jewel were restored.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Earl Ynywl bestowed the maiden upon Geraint, and Geraint replied that she
    would go with him to Arthur's court for Arthur and Gwenhwyvar to dispose of her
    as they wished.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Arthur's hunting parties released dogs after the stag; Arthur's favorite dog
    Cavall outpaced the others, turned the stag, and Arthur cut off the stag's head
    before anyone else could kill it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the stag was killed, a death horn was sounded and the hunters gathered
    around.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kadyrieith reported that Gwenhwyvar had only one maiden with her, and Arthur
    commanded Gildas son of Caw and the court scholars to escort Gwenhwyvar to the
    palace.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Members of the household and knights disputed sharply over which beloved lady
    should receive the stag's head.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Gwenhwyvar advised Arthur not to give away the stag's head until Geraint returned
    from his errand, and Arthur accepted this counsel.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: A watch was set on the ramparts for Geraint, and after midday watchers saw
    an unshapely little man, a possible dame or damsel, and a large sorrowful knight
    in broken armor approaching on horseback.
  category: sequence
  evidence_refs:
  - ev:8
