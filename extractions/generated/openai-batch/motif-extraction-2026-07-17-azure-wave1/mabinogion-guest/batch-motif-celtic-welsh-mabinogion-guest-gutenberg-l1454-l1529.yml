canonical_text:
  quote: ''
  summary: Peredur rides through wilderness to two castles. At the first, a lame hoary-headed
    host receives him, tests him with cudgel and shield through the host's sons, reveals
    himself as Peredur's maternal uncle, and instructs him in knightly conduct, including
    not asking about wonders unless told. At the second castle, another hoary-headed
    uncle tests Peredur with a sword and iron staple that break and reunite twice
    but not a third time, then says Peredur has reached two-thirds of his strength.
    During conversation, youths bring a bleeding spear and maidens bring a salver
    containing a man's bloody head; the court laments, and Peredur does not ask their
    meaning.
  language: English
  quote_policy: summarized
