canonical_text:
  quote: ''
  summary: A maiden uses all the Countess's balsam to restore Owain, then brings him
    to the Countess's castle. After convalescence, Owain receives a horse and arms,
    captures the young Earl who has oppressed the Countess, and obtains restitution
    for her. Owain then departs to wander, rescues a black lion from a serpent in
    a rock cleft, and the lion follows him and provides fuel and game at his evening
    fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The maiden pours the whole balsam upon Owain, leaves a horse and garments
    nearby, and hides to watch him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Owain begins to move, rises, sees his appearance, draws garments from the
    saddle, clothes himself, and mounts the horse with difficulty.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The maiden says a widowed Countess owns the castle and that a neighboring
    young Earl has taken her two earldoms and all but one dwelling after she refused
    to become his wife.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The maiden conducts Owain to a pleasant chamber in the castle and kindles
    a fire.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Countess says the balsam was a costly precious ointment and instructs
    the maiden to wait on Owain until he is recovered.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The maiden supplies Owain with meat, drink, fire, lodging, and medicaments;
    after three months he is restored to his former guise and becomes more comely
    than before.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The young Earl comes before the castle with a numerous army to subdue the
    Countess, and Owain asks for the loan of a horse and arms.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Countess gives Owain a beautiful black steed with a beechen saddle and
    armour for man and horse; Owain arms himself and rides out with two equipped pages.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Earl is identified by four yellow standards, and Owain drags him from
    the saddle, brings him to the castle portal, and presents him to the Countess
    as requital for the balsam.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Earl restores the two earldoms, gives the Countess half his dominions,
    gold, silver, jewels, and hostages as ransom and payment for freedom.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Owain departs despite requests that he remain and chooses to wander through
    distant lands and deserts.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: While journeying, Owain hears yelling three times in a wood and finds a serpent
    in a rock cleft attacking a black lion near a grey rock and craggy mound.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:13
  text: Owain cuts the serpent in two with his sword, dries the sword, and continues
    on his way; the lion follows and plays about him.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: At evening, after Owain kindles a fire in a wooded meadow, the lion brings
    him enough fuel for three nights and then brings a large roebuck.
  category: action
  evidence_refs:
  - ev:10
