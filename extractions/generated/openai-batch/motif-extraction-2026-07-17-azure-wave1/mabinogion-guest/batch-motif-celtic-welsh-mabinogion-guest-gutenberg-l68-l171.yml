canonical_text:
  quote: ''
  summary: The passage gives the title, translator, table of contents, and opening
    of Lady Charlotte Guest's introduction. Guest explains that translating and annotating
    the tales led her into broader reading on medieval romance. She states that the
    Welsh Mabinogion is closely connected with Continental romance, but cautions that
    collecting evidence is different from classifying it. She describes twelfth- and
    thirteenth-century European romance as largely chivalric, notes the relative exclusion
    and isolation of the Celts, and argues that many major romances contain Celtic
    names, places, and internal features associated with Wales and Brittany. She then
    sketches possible literary transmission through France, Wace, Geoffrey of Monmouth,
    and British sources.
  language: English
  quote_policy: summarized
