canonical_text:
  quote: ''
  summary: Peredur vindicates an innocent woman by defeating a knight and requiring
    him to acknowledge her innocence. He then stays at a threatened dwelling, defeats
    a sorceress, grants mercy after a pledge, and goes with her to learn chivalry
    and receive arms. Later, near a hermit's cell, he contemplates a raven, snow,
    and blood as images of his beloved's hair, skin, and cheeks. Arthur's household
    finds him by a brook; while absorbed in meditation, Peredur silently overthrows
    successive challengers and grievously injures Kai.
  language: English
  quote_policy: summarized
