  summary: A mounted narrator eats at a court, states that he is seeking whether anyone
    is superior to him, and is directed toward a glade. There he meets a huge black
    woodward on a mound who controls wild animals. The woodward directs him toward
    a green tree, a fountain, a slab, and a chained silver bowl, where pouring water
    will summon thunder, hail, birdsong, and an approaching black knight.
  language: English
