canonical_text:
  quote: ''
  summary: At Arthur's court an unnamed knight insults Gwenhwyvar by throwing drink
    from a golden goblet on her and striking her, then challenges anyone to pursue
    him to the meadow. Peredur arrives poorly equipped seeking knighthood; a male
    dwarf and a female dwarf acclaim him after a year of silence, and Kai assaults
    them. Kai directs Peredur against the challenger. Peredur kills the knight with
    a fork, struggles to remove his armor, receives help from Owain, sends the goblet
    back to Gwenhwyvar, vows service to Arthur, and refuses to come to court until
    he avenges Kai's injuries to the dwarfs.
  language: English
  quote_policy: summarized
