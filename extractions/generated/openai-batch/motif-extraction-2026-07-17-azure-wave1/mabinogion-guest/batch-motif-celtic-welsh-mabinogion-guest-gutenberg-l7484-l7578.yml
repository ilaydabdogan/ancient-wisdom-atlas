canonical_text:
  quote: ''
  summary: Gwydion recognizes that his brother Gilvaethwy loves Goewin and promises
    to help. He then seeks Math's permission to obtain Pryderi's otherworld-origin
    swine, travels with companions disguised as bards, charms Pryderi's court with
    storytelling, negotiates around a covenant, creates illusory horses, dogs, and
    shields as exchange goods, obtains the swine, and hurries away before the illusion
    expires. The journey gives rise to pig-related place names.
  language: English
  quote_policy: summarized
