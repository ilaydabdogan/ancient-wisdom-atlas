canonical_text:
  quote: ''
  summary: Peredur declines offered wealth and women, reaches a palace where slain
    men are restored to life, learns of the Addanc in a cave, receives a seeing stone
    from a fair lady after pledging love, passes through a valley of color-changing
    sheep and a half-burning tree, chooses the narrow road to the cave, kills and
    beheads the Addanc, declines a marriage-and-kingdom reward, and accepts Etlym
    Gleddyv Coch as attendant.
  language: English
  quote_policy: summarized
