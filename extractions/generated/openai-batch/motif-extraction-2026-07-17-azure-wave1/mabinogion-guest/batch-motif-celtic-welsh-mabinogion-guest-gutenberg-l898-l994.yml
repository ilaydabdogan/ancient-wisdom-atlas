canonical_text:
  quote: ''
  summary: Owain, initially encountered as the Knight, defeats Kai and Arthur's household,
    then fights Gwalchmai in a concealed and evenly matched duel until mutual recognition.
    Arthur reconciles them, visits Owain and the Countess of the Fountain, and later
    takes Owain to Britain, where Owain remains far longer than agreed. A mounted
    damsel removes Owain's ring and denounces him as faithless. Owain leaves court,
    wanders in uncultivated mountains, lives among wild beasts, wastes away, and is
    later found near a lake in a widowed Countess's park; she sends precious ointment,
    clothing, and a horse to restore him if life remains.
  language: English
  quote_policy: summarized
