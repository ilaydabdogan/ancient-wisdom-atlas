  summary: The surviving companions carry Bendigeid Vran's head, hear news of Caswallawn's
    invisible killings and kingship, feast at Harlech while three birds sing for seven
    years, then stay joyfully at Gwales for eighty years with a forbidden door closed
    toward Cornwall. When Heilyn opens it, memory of grief returns and they carry
    the head to London, where its burial protects the island from invasion until later
    disinterment. The passage also recounts Ireland's repopulation by five sons born
    to five pregnant women who survived in a cave.
