canonical_text:
  quote: ''
  summary: Manawyddan and Pryderi repeatedly prosper at crafts in towns, provoking
    local artisans to plot their deaths. Manawyddan counsels withdrawal rather than
    violence, and they eventually go to Dyved and Narberth, where they live by hunting.
    During a hunt, their dogs react fearfully to a bush, a pure white boar appears,
    and the pursuit leads to a newly appeared castle. The boar and dogs enter and
    disappear from hearing. Pryderi enters despite Manawyddan's warning that the castle
    has been caused by a spell, and he finds an empty interior with a fountain, golden
    bowl, marble slab, and chains hanging from the air.
  language: English
  quote_policy: summarized
