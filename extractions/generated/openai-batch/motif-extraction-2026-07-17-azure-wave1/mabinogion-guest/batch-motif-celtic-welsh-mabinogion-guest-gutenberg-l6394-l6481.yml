  summary: Teirnyon and his wife raise a found boy named Gwri Wallt Euryn, note his
    noble appearance and rapid growth, and give him a colt foaled the same night he
    was found. After hearing of Rhiannon's punishment, Teirnyon recognizes the boy's
    resemblance to Pwyll and returns him to Narberth, where the child is acknowledged
    as Pwyll and Rhiannon's son and named Pryderi.
