canonical_text:
  quote: ''
  summary: Owain follows the route previously associated with Kynon to a green tree,
    fountain, slab, and bowl. After throwing water on the slab, thunder, rain, a leafless
    tree, birdsong, and a knightly encounter follow. Owain mortally wounds the black
    Knight and pursues him to a castle, where a portcullis cuts his horse in two and
    traps him. A richly dressed maiden gives Owain a concealing ring, helps him evade
    the castle people, leads him to a decorated chamber, and provides washing, food,
    drink, and a bed. The castle's noble owner is then reported to receive extreme
    unction, die, and be carried to church.
  language: English
  quote_policy: summarized
