canonical_text:
  quote: ''
  summary: A richly wrought golden bowl traps Pryderi, and then Rhiannon, fixing their
    hands to the bowl and feet to the slab and rendering them speechless. At night
    thunder and mist come, and the castle vanishes with them. Manawyddan consoles
    Kicva and vows faithful friendship; they leave for Lloegyr, where he prospers
    as a shoemaker until rival cordwainers plot to kill him. Returning to Dyved, he
    sows three crofts of wheat; the first two are mysteriously stripped of their ears
    overnight, and he resolves to keep armed watch over the third.
  language: English
  quote_policy: summarized
