candidate_motifs:
- id: motif:1
  label: iterated impossible tasks met by confident acceptance
  taxonomy_refs:
  - mystical_quest
  basis: The passage repeatedly alternates between the claim that another requirement
    cannot be obtained and the respondent’s assertion that it will be easy.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives only this segment of the task-list; the larger narrative
    frame is not supplied here.
- id: motif:2
  label: quest requiring uniquely qualified helpers, animals, and objects
  taxonomy_refs:
  - mystical_quest
  basis: The hunt for Twrch Trwyth is made dependent on named huntsmen, rulers, animals,
    kin, and special objects that are each said to be uniquely necessary or difficult
    to obtain.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The taxonomy reference is broad; the passage itself is specifically a
    hunt-preparation task sequence.
- id: motif:3
  label: lost child of unknown fate needed for the quest
  taxonomy_refs: []
  basis: Mabon was taken from his mother when three nights old, and it is unknown
    where he is or whether he lives, yet he is necessary for the hunt.
  evidence_refs:
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage does not identify who took Mabon or describe his recovery.
- id: motif:4
  label: destructive otherworld beings restrained by appointed guardian
  taxonomy_refs:
  - chaos
  basis: Gwynn son of Nudd is placed over the brood of devils in Annwvyn so they will
    not destroy the present race.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The passage does not narrate a struggle with these beings; it only states
    their containment as a reason Gwynn cannot be spared.
- id: motif:5
  label: giant vulnerable only to a specific sword
  taxonomy_refs: []
  basis: Gwrnach the Giant is said never to be slain except with his sword, which
    he refuses to give and cannot be compelled to surrender.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage does not say how the sword is obtained or used.
- id: motif:6
  label: triadic warrior catalogue and overwhelming battle-noise
  taxonomy_refs: []
  basis: Bwlch, Kyfwlch, and Sefwlch are surrounded by repeated groups of three, and
    their horn and collective shouting are said to make all think the sky is falling
    to the earth.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage presents a stylized catalogue but does not explain its broader
    ritual or narrative function.
