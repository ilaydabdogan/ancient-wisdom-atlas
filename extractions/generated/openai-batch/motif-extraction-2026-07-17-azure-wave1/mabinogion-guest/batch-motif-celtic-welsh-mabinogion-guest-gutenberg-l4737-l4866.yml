  quote: Though thou get this, there is yet that which thou wilt not get.
  summary: A dialogue lists increasingly difficult prerequisites for hunting the boar
    Twrch Trwyth. The task-setter names required objects, animals, huntsmen, kin,
    rulers, Arthur and his companions, an otherworld-associated figure, and the sword
    of Gwrnach the Giant, while the respondent repeatedly says each task will be easy
    to accomplish.
  language: English
  quote_policy: quoted
