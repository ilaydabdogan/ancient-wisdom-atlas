canonical_text:
  quote: Rhonabwy awoke...having slept three nights and three days.
  summary: Rhonabwy questions Iddawc about messengers, Arthur's council, notable counsellors,
    bards, tribute, and a truce. Kadyriaith, a young counsellor, interprets praise-verses
    and proposes that tribute be given to the bards during the truce. Kai calls Arthur's
    followers to Cornwall; a tumult wakes Rhonabwy from a three-day dream on a yellow
    calf-skin. The tale is named as the Dream of Rhonabwy and said to require a book
    because of its many colors and details.
  language: English
  quote_policy: quoted
