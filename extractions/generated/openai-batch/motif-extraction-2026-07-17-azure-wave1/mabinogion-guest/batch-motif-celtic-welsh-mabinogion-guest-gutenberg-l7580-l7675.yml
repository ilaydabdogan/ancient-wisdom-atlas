canonical_text:
  quote: ''
  summary: Gwydion leads animals identified as swine into Gwynedd while Pryderi gathers
    forces in pursuit. Gwynedd and the men of the South fight; peace is sought through
    hostages, but Pryderi asks to settle the wrong by single combat with Gwydion.
    Gwydion kills Pryderi by strength, fierceness, magic, and charms, and Pryderi
    is buried. The hostages are released. Math returns to Caer Dathyl and learns from
    Goewin that Gwydion and Gilvaethwy wronged her and dishonoured him during his
    absence. Math marries Goewin, gives her possession of his dominions, and begins
    punishment of Gwydion and Gilvaethwy.
  language: English
  quote_policy: summarized
