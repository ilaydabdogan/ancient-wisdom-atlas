canonical_text:
  quote: ''
  summary: 'A wand-wielding ruler changes Gilvaethwy and another man into successive
    animal forms for year-long intervals, during which offspring appear and are baptized
    and named. After restoration and reconciliation, Arianrod is tested with the wand
    and two children appear: Dylan, who immediately takes the nature of the sea after
    baptism, and a hidden infant whom Gwydion conceals, later finds, fosters, and
    sees grow rapidly.'
  language: English
  quote_policy: summarized
