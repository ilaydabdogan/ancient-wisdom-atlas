canonical_text:
  quote: ''
  summary: Peredur rides onward, meets a knight who says he has been Arthur's enemy
    and has slain Arthur's men, defeats him, grants mercy on condition that he go
    to Arthur's Court with a message. Peredur declares that he will not come to the
    Court until he has avenged the insult to the dwarf and dwarfess, and sends a threat
    to Kai. Within the week Peredur defeats sixteen more knights, all of whom carry
    the same message and threat to Arthur's Court. Arthur reproves Kai, who is grieved.
  language: English
