canonical_text:
  quote: ''
  summary: Rhonabwy, guided by Iddawc, witnesses Arthur's host near the ford of the
    Severn and below Caer Badou. A knight splashes Arthur, the Bishop, and counsellors
    at the ford and is corrected by a youth. Iddawc identifies Adaon, Elphin, Caradawc,
    the troops of Norway and Denmark, Kai, Kadwr, and Eirynwych. The passage describes
    contrasting white and black troops, Kai's riding, Arthur's serpent-and-fire sword,
    and the golden chair and magical carpet Gwenn set before Arthur.
  language: English
  quote_policy: summarized
