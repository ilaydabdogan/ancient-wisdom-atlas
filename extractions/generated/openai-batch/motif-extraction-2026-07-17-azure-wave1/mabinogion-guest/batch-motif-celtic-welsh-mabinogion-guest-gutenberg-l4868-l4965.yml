candidate_motifs:
- id: motif:1
  label: Marriage-conditioned quest for difficult marvels
  taxonomy_refs:
  - mystical_quest
  basis: The daughter is made obtainable only through difficult searching and completion
    of marvels, and Arthur later organizes the order of marvels to seek.
  evidence_refs:
  - ev:1
  - ev:7
  confidence: high
  cautions: The passage gives only this segment of the larger task-list and does not
    name the daughter or the task-setter in the excerpt.
- id: motif:2
  label: Hostile giant’s castle with craft-only entry
  taxonomy_refs:
  - trickster_boundary
  basis: The castle is deadly to guests, and its gate opens only to a person who brings
    a craft; Kai enters by claiming a craft.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The taxonomy mapping emphasizes the boundary-crossing and craft-test;
    the passage itself frames the rule literally as castle entry policy.
- id: motif:3
  label: Claimed craftsmanship used to gain access and slay a giant
  taxonomy_refs:
  - trickster_boundary
  basis: Kai’s sword-burnishing claim gains him access to Gwrnach and to the sword,
    after which he uses the sword and scabbard situation to behead the giant.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage does not explicitly label Kai’s claim as false, though it
    functions as a means of entry and attack.
- id: motif:4
  label: Marvelous weapon as companion-recognition sign
  taxonomy_refs: []
  basis: Bedwyr is identified for entry by a lance-head that leaves and returns to
    its shaft and draws blood from the wind.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: No available taxonomy reference directly matches this weapon-sign motif.
- id: motif:5
  label: Passage through three guarded wards
  taxonomy_refs: []
  basis: The son of Custennin brings companions into the midst of the castle by keeping
    them close while passing three wards.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage is brief and does not explain the nature of the wards or whether
    the number three has special significance here.
- id: motif:6
  label: Return to court with acquired giant’s sword
  taxonomy_refs:
  - return
  basis: After killing Gwrnach and despoiling the castle, the company returns the
    same day to Arthur’s court bearing Gwrnach’s sword.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The taxonomy reference captures the return element only; the passage is
    also part of an ongoing quest.
- id: motif:7
  label: Quest chain requiring release of an imprisoned kinsman
  taxonomy_refs:
  - mystical_quest
  basis: Mabon cannot be found unless Eidoel is first found; Eidoel is imprisoned
    in Glivi’s castle and is yielded to Arthur.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage does not yet narrate the finding of Mabon, only the prerequisite
    step.
