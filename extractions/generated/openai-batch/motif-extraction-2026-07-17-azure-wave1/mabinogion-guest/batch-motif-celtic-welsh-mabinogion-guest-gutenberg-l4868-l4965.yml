canonical_text:
  quote: ''
  summary: 'An unnamed task-setter makes the winning of his daughter depend on the
    completion of difficult marvels. Arthur’s company travels to the dangerous castle
    of Gwrnach the Giant, where only craftsmen may enter. Kai gains entry by claiming
    skill in burnishing swords, brings Bedwyr and other companions inside, uses Gwrnach’s
    own sword and scabbard to behead him, despoils the castle, and returns to Arthur’s
    court with the sword. Arthur then turns to the next marvel: seeking Mabon son
    of Modron by first finding Eidoel son of Aer, who is imprisoned by Glivi and is
    yielded to Arthur.'
  language: English
  quote_policy: summarized
