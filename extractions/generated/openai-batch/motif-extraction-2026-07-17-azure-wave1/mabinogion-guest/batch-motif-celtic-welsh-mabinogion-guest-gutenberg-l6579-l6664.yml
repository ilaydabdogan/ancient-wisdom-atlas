canonical_text:
  quote: ''
  summary: At Bendigeid Vran's court, Evnissyen mutilates Matholwch's horses after
    learning that Branwen has been given in marriage to Matholwch without his consent.
    Matholwch prepares to leave in anger, but embassies offer compensation and peace
    is restored. Bendigeid Vran adds a cauldron that restores slain men by the next
    day, except for their speech, and Matholwch is then paid with horses and colts.
  language: English
  quote_policy: summarized
