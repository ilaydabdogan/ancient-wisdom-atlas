canonical_text:
  quote: ''
  summary: Arthur and Peredur hunt from Caerlleon. Peredur follows a hart to a remote
    hall where maidens warn him that their father kills unauthorized visitors. A huge
    black one-eyed man, later named the Black Oppressor, spares Peredur overnight
    at a maiden’s request, then fights him the next day. Defeated, he explains that
    he lost his eye fighting the Black Serpent of the Carn, whose tail bears a stone
    that produces desired gold. He describes further places on the route, including
    the Palace of the Sons of the King of the Tortures, the Addanc of the Lake, the
    Court of the Countess of the Achievements, and the guarded Mound of Mourning.
    Peredur kills the Black Oppressor to end his oppression.
  language: English
  quote_policy: summarized
