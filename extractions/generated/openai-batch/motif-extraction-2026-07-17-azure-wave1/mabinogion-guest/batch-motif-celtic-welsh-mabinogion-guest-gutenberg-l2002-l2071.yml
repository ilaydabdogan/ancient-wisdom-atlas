    with life, but the maiden again asks him to keep his promise to spare Peredur
    that night.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The next day the black man arms himself and tells Peredur to arise and suffer
    death; Peredur demands either equal combat without armor or arms for himself.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The maiden brings Peredur arms of his choosing; Peredur fights the black man
    and forces him to ask for mercy.
  category: action
  evidence_refs:
  - ev:5
