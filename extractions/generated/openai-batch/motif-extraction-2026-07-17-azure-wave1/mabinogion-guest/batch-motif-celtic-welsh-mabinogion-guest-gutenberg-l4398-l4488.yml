canonical_text:
  quote: Four white trefoils sprung up wherever she trod. And therefore was she called
    Olwen.
  summary: Arthur's embassy, including Kilhwch, Kai, Gwrhyr, and Menw, reaches Custennin
    the herdsman near Yspaddaden Penkawr's castle. Custennin and his wife warn them
    that the quest for Olwen is deadly. Kilhwch gives a gold ring that reveals his
    kinship to Custennin's wife. In the household, a hidden surviving youth is brought
    from a stone chest, and Kai promises him protection. Olwen is summoned after a
    pledge that she will not be harmed. She arrives richly clothed and wondrously
    beautiful, with white trefoils springing where she walks. Kilhwch asks her to
    go with him, but she says he must seek her from her father and meet whatever demands
    he sets. The party follows her to the castle and silently kills the nine porters
    and nine watch-dogs at the nine gates.
  language: English
  quote_policy: quoted
