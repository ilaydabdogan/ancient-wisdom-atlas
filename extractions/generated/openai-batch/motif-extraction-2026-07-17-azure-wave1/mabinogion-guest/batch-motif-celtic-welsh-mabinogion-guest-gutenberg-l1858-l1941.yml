canonical_text:
  quote: ''
  summary: Peredur enters the Round Valley through a dangerous wooded approach guarded
    by a chained lion above a pit of bones. At the castle of a huge grey man, a maiden
    warns him that the grey man's giant vassals will kill him. With his horse and
    arms kept nearby, Peredur defeats much of the host and kills the grey man's two
    sons. He grants mercy on condition that the survivors render homage to Arthur,
    acknowledge Peredur's service, and receive baptism. The grey man and his company
    do homage at Arthur's court, are baptized, and receive the valley back under Arthur's
    authority.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Peredur travels along a high road on a mountain-ridge and sees a circular
    valley with rocky and wooded bounds, meadows, fields, and large black houses in
    the wood.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A sleeping lion is bound by a chain on a rocky ledge above a deep pit filled
    with the bones of men and animals.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Peredur strikes the lion, breaks the chain, causes the lion to fall into the
    pit, and leads his horse over the ledge into the valley.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: In the valley's centre Peredur sees a fair castle, a huge grey man, and two
    young pages associated with dagger hilts made of sea-horse bone.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The grey man refers to his porter, and Peredur understands the porter to have
    been the lion.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the castle meal, an aged woman and a young woman appear; the grey man sits
    at the head of the table, and Peredur is seated with the maiden while the pages
    serve.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The maiden says she loves Peredur, warns him of his expected doom the next
    day, identifies the black houses as belonging to her father's giant vassals, and
    names the place the Round Valley.
  category: speech
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The maiden arranges for Peredur's horse and arms to be lodged with him; in
    the morning he hears a tumult, arms himself and his horse, and goes to the meadow.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The aged woman and the maiden ask the grey man to accept Peredur's promise
    of secrecy as a surety, but the grey man refuses.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Peredur fights the host, slays one-third of them without being hurt, and the
    aged woman again asks that he be granted mercy.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Peredur kills the yellow-haired youth and the auburn-haired youth, described
    in the plea as the grey man's two sons.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The maiden asks mercy for her father and the surviving vassals; Peredur grants
    it on conditions of homage to Arthur, acknowledgment of Peredur's service, and
    baptism.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The grey man says no Christian has departed the valley alive during his possession
    except Peredur, and Peredur says he has not broken his vow not to speak to any
    Christian.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The grey man and his company go to Arthur's court, do homage, are baptized,
    report Peredur's victory, and receive the Round Valley back from Arthur.
  category: sequence
  evidence_refs:
  - ev:11
