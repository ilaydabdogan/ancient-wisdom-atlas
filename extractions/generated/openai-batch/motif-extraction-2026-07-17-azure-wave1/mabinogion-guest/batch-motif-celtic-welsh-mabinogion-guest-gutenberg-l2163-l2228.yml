canonical_text:
  quote: ''
  summary: Peredur comes to the Countess's court, where defeating her household grants
    the victor a favored place and her love; he has defeated the household but gives
    the Countess to his companion Etlym, whom she loves. Peredur and Etlym then go
    to the Mound of Mourning, where Peredur defeats many tent owners, compels homage,
    kills a guarded serpent connected with a coveted stone, repays the men, requires
    vassalage, and gives the stone to Etlym. Peredur then reaches a valley of many
    tents and mills, is hosted by the chief miller, and learns that the Empress of
    Cristinobyl the Great seeks the most valiant man.
  language: English
  quote_policy: summarized
