canonical_text:
  quote: ''
  summary: An emperor is sorrowful because of a maiden seen in a dream. Roman sages
    advise sending messengers to seek the dream. After an initial failed search, messengers
    retrace the dream route through river, mountain, sea, Britain, and a castle hall,
    where they find the maiden and invite her to Rome. She requires the emperor to
    come to her. The messengers return as guides; the emperor travels with an army,
    conquers Britain, recognizes the castle and hall from his dream, embraces the
    maiden, and she becomes his bride.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A chamber page, described as king of the Romans, tells the emperor that people
    revile him because they receive no message or answer from him as their lord.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The emperor summons the wise men of Rome and says he has seen a maiden in
    a dream, and that because of her he has neither life, spirit, nor existence within
    him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The sages advise the emperor to send messengers for three years to the three
    parts of the world to seek his dream, saying that hope of news will support him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Messengers travel for a year seeking news of the dream but return without
    learning more, after which the emperor becomes very sorrowful.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king of the Romans advises the emperor to hunt in the direction of the
    dream; at a river bank the emperor identifies the place where he was in the dream
    and says he went westward toward the river source.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Thirteen messengers set forth wearing one sleeve on the front of each cap
    as a sign that they are messengers, so they will not be harmed in hostile lands.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: After crossing a high mountain that seemed to touch the sky, the messengers
    see vast plains and large rivers and identify the land as the one their master
    saw.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: The messengers follow river mouths to a mighty river flowing to the sea, a
    vast city, high many-coloured castle towers, a large fleet, and a great ship;
    they cross the sea to Britain and pass through Snowdon, Anglesey, Arvon, and Aber
    Sain to a castle at a river mouth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Inside the castle hall the messengers see two youths playing chess on a golden
    bench, a hoary-headed man by a pillar in an ivory chair carving chessmen, and
    the maiden seated on a chair of ruddy gold.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The messengers kneel and hail the maiden as Empress of Rome; they say the
    emperor saw her in sleep and lacks life or spirit because of her, and they offer
    her the choice of going with them or having the emperor come to take her as wife.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The maiden answers that she will neither deny nor fully believe them, and
    says that if the emperor loves her, he should come to seek her.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: The messengers hurry back by day and night, replacing failed horses, and tell
    the emperor they will guide him over sea and land to the woman he loves, whose
    name, kindred, and race they know.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: The emperor immediately sets forth with his army, crosses toward Britain,
    conquers the island from Beli son of Manogan and his sons, drives them to the
    sea, and goes on to Arvon.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The emperor recognizes the castle of Aber Sain as the castle from his dream,
    enters the hall, sees the named occupants and the maiden on a golden chair, hails
