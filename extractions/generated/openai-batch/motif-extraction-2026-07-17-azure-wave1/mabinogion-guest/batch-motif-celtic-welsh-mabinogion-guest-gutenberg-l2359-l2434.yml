canonical_text:
  quote: ''
  summary: Gwalchmai reaches a valley fortress, is invited into the palace by its
    lord with a ring-token, is welcomed by the lord's sister beside a smokeless fire,
    and is then accused by a hoary-headed man of having slain the Earl's father. An
    armed party attempts entry, Gwalchmai blocks the doorway with a chessboard, and
    the Earl grants him a year to complete Arthur's mission and return to answer the
    charge. The narrative then follows Peredur, who wanders seeking the black maiden,
    is rebuked by a priest for travelling armed on Good Friday, dismounts, receives
    lodging, remains through prohibited travel days, and receives directions toward
    the Castle of Wonders by way of a mountain, river valley, and king's Easter palace.
  language: English
  quote_policy: summarized
