canonical_text:
  quote: ''
  summary: At Arthur's court, the wounded Edeyrn son of Nudd arrives under compulsion
    from Geraint to answer for an insult connected with Gwenhwyvar's maiden and the
    dwarf. Edeyrn recounts his defeat in a tournament for the Sparrow-Hawk at Cardiff,
    where Geraint fought on behalf of a poorly dressed maiden. Arthur and Gwenhwyvar
    grant mercy, arrange sureties and medical care, and receive the maiden into Gwenhwyvar's
    household. The next day Geraint returns with the maiden and is welcomed and praised
    for securing retribution.
  language: English
  quote_policy: summarized
