canonical_text:
  quote: ''
  summary: Taliesin claims an earlier identity as little Gwion and nine months in
    Caridwen's womb. At Maelgwn's court, the king and nobles marvel at the young boy's
    song; Heinin and the other bards are unable to answer him. Taliesin sings that
    he will free Elphin from confinement and golden fetters. He challenges the bards
    with riddling descriptions of a noxious creature with springs in its neck, foretells
    a destructive creature from Rhianedd as punishment for Maelgwn, and describes
    an ancient bodiless force prepared by One Being to wreak vengeance on Maelgwn
    Gwynedd.
  language: English
  quote_policy: summarized
