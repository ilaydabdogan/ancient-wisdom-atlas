canonical_text:
  quote: ''
  summary: 'The passage first completes an episode in which Geraint enters a mist,
    reaches an orchard and tent, sits in a forbidden chair, defeats the chair’s knightly
    owner, and causes the enchanted mist to vanish by sounding a horn, after which
    reconciliation and Geraint’s prosperous return follow. The passage then begins
    Kilhwch and Olwen: Kilydd marries Goleuddydd, who bears Kilhwch in a swine-associated
    setting; before dying she sets a grave-briar condition on Kilydd’s remarriage;
    after the sign appears, Kilydd violently takes King Doged’s wife, and the abducted
    lady consults an old crone about her captor’s children and heir.'
  language: English
  quote_policy: summarized
