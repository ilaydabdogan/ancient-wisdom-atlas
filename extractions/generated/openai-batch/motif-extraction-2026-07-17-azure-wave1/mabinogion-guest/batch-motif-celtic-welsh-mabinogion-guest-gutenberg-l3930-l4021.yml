candidate_motifs:
- id: motif:1
  label: Hero crosses enchanted mist into a challenge space
  taxonomy_refs:
  - mystical_quest
  basis: Geraint deliberately enters the mist and emerges at an orchard-tent setting
    that leads to a chair challenge and combat.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: medium
  cautions: The excerpt does not state the full quest motive before Geraint enters
    the mist; the motif label is based on this passage’s immediate sequence only.
- id: motif:2
  label: Forbidden or owned seat provokes combat
  taxonomy_refs: []
  basis: The maiden warns that the chair’s owner allows no other man to sit in it,
    and the owner challenges Geraint to satisfaction after finding him seated there.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: No broader ritual meaning for the chair is stated in the passage.
- id: motif:3
  label: Victory enables a horn blast that ends enchantment
  taxonomy_refs:
  - mystical_quest
  basis: The defeated knight says the mist will vanish only when the horn is blown
    by the knight who vanquished him; Geraint sounds it and the mist vanishes.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage identifies magic and enchantment but does not explain their
    origin.
- id: motif:4
  label: Breaking enchantment restores social order and precedes return
  taxonomy_refs:
  - return
  basis: After the horn blast dispels the mist, the hosts reconcile, and Geraint later
    returns to his dominions and reigns prosperously.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The return is literal, but the passage gives limited detail about how
    the reconciliation is structured.
- id: motif:5
  label: Prayed-for royal child with anomalous animal-associated birth
  taxonomy_refs:
  - miraculous_child
  - sacred_birth
  basis: The people pray for an heir, a son is born through the prayers, and his birth
    and naming are tied to swine and a swine’s burrow.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage attributes the birth to prayers but does not describe a direct
    divine appearance or miracle scene.
- id: motif:6
  label: Dying mother sets a remarriage sign on her grave
  taxonomy_refs: []
  basis: Goleuddydd commands that Kilydd not take another wife until a briar with
    two blossoms appears on her grave.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage gives the condition but does not explain the briar’s cause.
- id: motif:7
  label: Wife seized after husband is killed
  taxonomy_refs:
  - stolen_beloved
  basis: Kilydd’s party slays King Doged, carries away Doged’s wife and daughter,
    and conquers his lands.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage presents the woman as a wife carried away by violence, but
    it does not describe her as a beloved or give her prior emotional relationship
    in detail.
- id: motif:8
  label: Old crone gives heir information and prediction
  taxonomy_refs:
  - wisdom
  basis: The toothless old crone answers the abducted lady’s questions and reports
    a prediction that Kilydd will have an heir by her, while also saying he has one
    son.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The taxonomy reference is broad; the passage presents the crone as an
    informant but gives no extended wisdom teaching.
- id: motif:9
  label: Noble lineage asserted despite lowly birth-place
  taxonomy_refs:
  - royal_legitimacy
  basis: After the child is found in a swine’s burrow and named Kilhwch, the text
    states nevertheless that he is of gentle lineage and cousin to Arthur.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage asserts lineage but does not yet narrate a legitimacy conflict.
