canonical_text:
  quote: ''
  summary: At night Enid prepares Geraint's armour and warns him about Earl Dwnn's
    intention. Geraint leaves town by another route with help from the host. Earl
    Dwnn and eighty armoured knights pursue by following horse tracks. At dawn Enid
    warns Geraint again despite his command of silence. Geraint defeats the knights
    and the Earl, then grants the Earl mercy.
  language: English
