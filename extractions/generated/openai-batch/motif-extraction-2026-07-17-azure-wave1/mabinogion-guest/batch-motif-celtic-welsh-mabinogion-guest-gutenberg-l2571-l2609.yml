canonical_text:
  quote: ''
  summary: Peredur challenges an opponent near a grove and fights an armoured black
    man who arises from beneath a cromlech and disappears with both horses. Peredur
    then reaches a castle in a valley with a river, where he finds Gwalchmai, a lame
    grey-headed man, and his recovered horse. A yellow-haired youth kneels to Peredur,
    reveals that he had appeared as the black maiden and as the bearer of a bloody
    head and bleeding lance, identifies the head as Peredur's cousin's, names the
    sorceresses of Gloucester as killers and maimers of his kin, and states a prediction
    that Peredur will avenge these things. Peredur, Gwalchmai, Arthur, and Arthur's
    household fight the sorceresses; after a sorceress kills men before Peredur three
    times, he strikes her, and Arthur's household kills all the sorceresses of Gloucester.
    The passage closes by naming the Castle of Wonders.
  language: English
  quote_policy: summarized
