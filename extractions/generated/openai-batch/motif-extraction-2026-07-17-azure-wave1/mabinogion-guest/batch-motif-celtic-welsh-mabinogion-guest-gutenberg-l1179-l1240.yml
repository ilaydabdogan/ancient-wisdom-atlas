canonical_text:
  quote: ''
  summary: Owain is aided by a lion in combat, saving Luned from burning. He returns
    with Luned to the Countess of the Fountain and later takes the Countess as his
    wife to Arthur's Court. He then goes to the court or castle of the savage black
    man, finds twenty-four noble ladies whose husbands have been slain and whose goods
    were taken, defeats the castle owner, spares him when he promises to keep the
    house as a hospice, restores the ladies and their property, and returns to Arthur's
    Court. Owain later dwells at Arthur's Court and is victorious with an army of
    three hundred ravens left to him by Kenverchyn.
  language: English
  quote_policy: summarized
