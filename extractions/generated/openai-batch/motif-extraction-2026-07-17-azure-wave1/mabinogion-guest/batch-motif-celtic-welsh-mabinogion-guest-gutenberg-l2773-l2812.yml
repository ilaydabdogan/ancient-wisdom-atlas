canonical_text:
  quote: ''
  summary: Geraint, uncertain where to lodge, approaches a ruined palace outside the
    town. A ragged hoary-headed man invites him in. In the chamber Geraint sees an
    elderly woman in worn satin and a beautiful maiden in worn garments. The maiden
    tends Geraint and his horse, fetches mead, meat, and bread from the town, and
    serves the meal while Geraint sits between the man and his wife.
  language: English
  quote_policy: summarized
