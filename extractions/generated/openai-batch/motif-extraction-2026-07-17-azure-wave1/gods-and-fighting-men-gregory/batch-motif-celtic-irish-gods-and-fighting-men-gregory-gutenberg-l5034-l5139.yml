canonical_text:
  quote: ''
  summary: 'Laegaire praises his Sidhe life, wife, and blue sword, then returns to
    the otherworldly kingdom and remains there. The passage then opens the fate of
    the Children of Lir: Bodb Dearg is chosen king of the Tuatha de Danaan, Lir resents
    the choice, but Bodb refuses violent retaliation. After Lir is widowed, Bodb offers
    one of his foster-daughters as wife in friendship and lordship. Lir marries Aobh,
    who bears four children and dies; he then marries her sister Aoife. The children
    are loved by Lir, Bodb, and the Men of Dea, but Aoife becomes jealous, feigns
    illness, and takes the children away in a chariot while Fionnuala senses treachery
    through a dream.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Laegaire says every man among the fifty has a wife, names his own wife as
    the Tear of the Sun, says he has been made master of a blue sword, and says one
    night of the Sidhe is worth more to him than the whole kingdom being offered.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Laegaire turns back to the kingdom, is made king there with Fiachna son of
    Betach and Fiachna's daughter, and has not come out of it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the battle of Tailltin, the Tuatha de Danaan choose Bodb Dearg as king;
    Lir is displeased, leaves the gathering without leave, and thinks he himself had
    the right to be king.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Some of the Tuatha de Danaan propose pursuing Lir, burning his house, and
    attacking him, but Bodb Dearg refuses and says his kingship remains even if Lir
    does not submit.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Lir's wife dies after a sickness lasting three nights, and Lir is heavily
    grieved.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Bodb Dearg says he has three foster-daughters, Aobh, Aoife, and Ailbhe, and
    proposes friendship and help for Lir through one of them.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Messengers tell Lir that if he joins Bodb Dearg and acknowledges his lordship,
    Bodb will give him one of his foster-children.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Lir travels with fifty chariots from Sidhe Fionnachaidh to Bodb's dwelling-place
    at Loch Dearg and receives a welcome there.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The three daughters of Oilell of Aran sit with Bodb's wife, their foster-mother,
    and Lir chooses the eldest, Aobh, as his wife.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Aobh bears two children, Fionnuala and Aodh, and later bears two sons, Fiachra
    and Conn; she dies at the latter birth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Bodb Dearg's people keen Aobh with three loud cries, and Bodb says friendship
    with Lir will continue by giving Aoife, Aobh's sister, as wife.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Lir marries Aoife and brings her home; Aoife initially shows honour and affection
    to her sister's children.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: The four children are described as inspiring love in anyone who sees them,
    and Bodb often visits Lir's house and brings the children to his own place for
    periods of time.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:14
  text: At the Feast of Age in the Sidhe hills, the Men of Dea take joy and delight
    in the four children because of their beauty.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: The children sleep in beds in sight of Lir, and he rises each morning to lie
    down among them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Jealousy is described as being kindled in Aoife, and she comes to hate her
    sister's children.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:17
  text: Aoife pretends to be sick for almost a year and then commits a jealous and
    treacherous deed against the children.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:18
  text: Aoife has her chariot yoked and takes the four children toward Bodb Dearg's
    house; Fionnuala does not want to go because she has perceived a plan for their
    death or destruction and has dreamed of treachery in Aoife's mind, but she cannot
