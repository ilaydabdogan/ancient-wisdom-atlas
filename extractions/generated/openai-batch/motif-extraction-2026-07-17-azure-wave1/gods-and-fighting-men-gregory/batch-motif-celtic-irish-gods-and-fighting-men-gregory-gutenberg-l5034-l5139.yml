candidate_motifs:
- id: motif:1
  label: Otherworld life preferred over earthly kingship
  taxonomy_refs:
  - afterlife_journey_map
  - departure
  basis: Laegaire values a night of the Sidhe above a whole kingdom and returns to
    the otherworldly kingdom, where he remains.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives a return and continued residence in the Sidhe kingdom
    but does not provide a detailed journey map in this excerpt.
- id: motif:2
  label: Contested royal succession and legitimate lordship
  taxonomy_refs:
  - royal_legitimacy
  basis: The Tuatha de Danaan choose Bodb Dearg as king; Lir disputes the outcome,
    and Bodb asserts that his kingship remains despite Lir's non-submission.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage does not give the full prior political context beyond the
    chosen kingship and Lir's resentment.
- id: motif:3
  label: Marriage alliance used to restore friendship and obedience
  taxonomy_refs:
  - sacred_exchange
  - sacred_marriage
  basis: Bodb offers one of his foster-daughters to Lir if Lir joins him and acknowledges
    his lordship; later he gives Aoife to preserve friendship after Aobh's death.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  confidence: medium
  cautions: The passage frames the marriages as political and kinship alliance; the
    term sacred is inferred only from the divine Tuatha de Danaan context and available
    taxonomy.
- id: motif:4
  label: Divine parent-child devotion
  taxonomy_refs:
  - divine_parent_child
  basis: Lir's grief after Aobh's death is restrained by his attachment to the four
    children, who sleep in his sight and among whom he lies each morning.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: The passage emphasizes affection and proximity rather than a formal ritual
    of parent-child relation.
- id: motif:5
  label: Beloved sibling group born in paired births
  taxonomy_refs:
  - sibling_pair
  - sacred_twins
  basis: Aobh gives birth first to Fionnuala and Aodh and later to Fiachra and Conn;
    the four siblings become the shared delight of Lir, Bodb, and the Men of Dea.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The text describes paired births but does not explicitly use the word
    twins; the group is four siblings rather than a single sibling pair.
