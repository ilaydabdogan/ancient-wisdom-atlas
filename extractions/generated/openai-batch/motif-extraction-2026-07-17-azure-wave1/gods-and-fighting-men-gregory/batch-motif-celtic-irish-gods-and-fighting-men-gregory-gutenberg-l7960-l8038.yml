canonical_text:
  quote: ''
  summary: Fergus reaches Tadg's house, where Finn's kin are grieving over the danger
    to Finn. Tadg's wife explains that Daire Donn, King of the World, cannot be wounded
    except by a sword and shield made by the smith of the Fomor on the night of Daire's
    birth and kept by the King of the Country of the Fair Men. Labran is sent in eagle
    shape to obtain the weapons, receives them from their seven-locked storage, returns
    exhausted, and Tadg gives them to the swift Aedh to carry to Finn. Aedh reaches
    the White Strand at dawn, delivers the weapons to Finn, and the uncovered weapons
    give off flashes of fire and deadly bubbles, heartening the Fianna before the
    fight.
  language: English
  quote_policy: summarized
