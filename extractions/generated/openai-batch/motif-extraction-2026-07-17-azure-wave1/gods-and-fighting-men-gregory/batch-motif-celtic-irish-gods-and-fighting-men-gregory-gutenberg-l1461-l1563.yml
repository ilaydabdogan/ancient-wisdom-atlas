canonical_text:
  quote: ''
  summary: Bres and his Druids interpret a strange westward sun-like brightness as
    Lugh’s shining face. Lugh comes to parley, asks for the return of Ireland’s milch
    cows, waits for allied Riders of the Sidhe, and then fights. Bres surrenders under
    Lugh’s protection and swears by cosmic elements to bring the Fomor to a future
    battle. Lugh then seeks knowledge of his father Cian’s death, follows the trail
    to the place of danger, hears the earth reveal that Cian had taken pig shape and
    was killed by the sons of Tuireann, exhumes and laments the wounded body, reburies
    him with keening and an Ogham stone, and returns to Teamhair to question the assembly
    about vengeance for a father’s killing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Bres describes the brightness as if the sun were rising in the west, and the
    Druids identify it as the shining of Lugh’s face.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lugh greets Bres’s side as a friend, states that one half of him belongs to
    the Tuatha de Danaan and the other half to them, and asks for the milch cows of
    the men of Ireland to be returned.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lugh remains near them for three days and three nights until the Riders of
    the Sidhe arrive, including Bodb Dearg with twenty-nine hundred men.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The kings and chief men of Ireland arm themselves, raise spears and shields,
    and fight with spears and swords; the passage describes brown flames rising from
    the weapons.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lugh attacks the battle-pen where Bres is guarded and kills two hundred of
    the guards before Bres gives himself up to Lugh’s protection.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Bres asks for his life and swears by the sun, moon, sea, and land that he
    will bring the whole race of the Fomor to a great battle; Lugh grants him his
    life and extends protection to the Druids.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After the battle, Lugh asks whether his father was seen in the fight and vows
    that he will take no food or drink until he learns by what death his father died.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Lugh and the Riders of the Sidhe go to the place where he parted from his
    father and then to the place where his father had taken the shape of a pig on
    seeing the sons of Tuireann.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: At that place the earth speaks to Lugh and says that his father was in danger
    there, took pig shape, and was killed in his own shape by the sons of Tuireann.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lugh has the burial place dug up; the body is raised from the grave and found
    covered with wounds, and Lugh kisses it three times.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Lugh laments that grief for his father has left him unable to hear, see, or
    feel a living pulse in his heart, and he says that treachery among the people
    of the gods of Dana will weaken them and trouble Ireland.
  category: speech
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:12
  text: Cian is buried again; keening is made over the grave, a stone is raised, his
    name is written in Ogham, and Lugh says the hill will take Cian’s name.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: At Teamhair, Lugh sits in the king’s high seat, sees the three sons of Tuireann,
    has the chain of silence shaken, and asks the Men of Dea what vengeance each would
    take on the killer of his father.
  category: sequence
  evidence_refs:
  - ev:11
