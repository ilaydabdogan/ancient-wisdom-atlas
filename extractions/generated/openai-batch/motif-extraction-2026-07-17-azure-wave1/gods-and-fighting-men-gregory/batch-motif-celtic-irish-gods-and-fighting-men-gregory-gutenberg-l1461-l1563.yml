candidate_motifs:
- id: motif:1
  label: Radiant heroic arrival mistaken for the sun
  taxonomy_refs: []
  basis: The brightness of Lugh’s face is compared in the dialogue to the sun rising
    in the west.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives a luminous image but does not itself explain a broader
    solar theology.
- id: motif:2
  label: Cattle restitution demanded across enemy kinship lines
  taxonomy_refs:
  - sacred_theft
  basis: Lugh presents himself as partly kin to both sides and asks that the milch
    cows of the men of Ireland be given back.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: The passage says the cows are to be returned, but it does not describe
    the original taking or explicitly mark the cows as sacred.
- id: motif:3
  label: Life spared in exchange for a binding oath
  taxonomy_refs:
  - sacred_exchange
  basis: Bres gives himself up, asks for his life, swears by sun, moon, sea, and land
    to bring the Fomor to battle, and Lugh grants him life and protection.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The exchange is explicit, but the passage does not elaborate the legal
    or ritual mechanics of the oath.
- id: motif:4
  label: Shapeshifted victim revealed by a speaking place
  taxonomy_refs:
  - shapeshifter
  basis: The earth tells Lugh that Cian took the shape of a pig but was killed in
    his own shape by the sons of Tuireann.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Only one transformation is described in this passage.
- id: motif:5
  label: Filial grief and quest for vengeance after a father’s death
  taxonomy_refs:
  - divine_parent_child
  basis: Lugh vows to learn how his father died, uncovers and mourns the wounded body,
    and later asks the assembly what vengeance is due for killing a father.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:11
  confidence: high
  cautions: The passage reaches the question of vengeance but does not yet show the
    punishment imposed.
- id: motif:6
  label: Kin-treachery among divine people brings lasting communal trouble
  taxonomy_refs:
  - divine_judgment
  basis: Lugh says that the people of the gods of Dana have done treachery on one
    another and that they will be weakened and Ireland troubled from then on.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The statement predicts consequences, but the passage does not narrate
    a separate divine court or formal judgment.
