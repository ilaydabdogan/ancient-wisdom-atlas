candidate_motifs:
- id: motif:1
  label: Bride won by overseas quest and combat
  taxonomy_refs:
  - departure
  - return
  - stolen_beloved
  basis: Oisin goes beyond the sea for Eibhir, defeats the High King and Firbolg supporters,
    and brings her back to Ireland.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: The passage states that Eibhir was the High King's foreign sweetheart
