canonical_text:
  quote: ''
  summary: 'The passage opens Book Five with accounts of Oisin''s wife Eibhir, whom
    he wins after travelling beyond the sea and fighting the High King of Ireland
    and Firbolg supporters. It then recounts Eoghan''s exile in Spain, Beara''s Druidic
    prophecy concerning her husband, the golden salmon whose shining clothing becomes
    a shirt, and Eoghan''s marriage to Beara and naming as Eoghan the Bright. A genealogical
    note links their son Oiliol, Aine of the Sidhe, and Oisin''s daughter. The passage
    then describes Osgar, son of Oisin: his pampered childhood, sudden proof in battle
    with a log, reputation as a great warrior, friendship and training with Diarmuid,
    and a feast where several Fianna state what music they prefer, ending with Osgar''s
    preference for the sound of swords in battle.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Oisin is described as brave, comely, swift enough to overtake a deer, and
    keen-sighted at night; his wife is Eibhir of the plaited yellow hair, called the
    foreign sweetheart of the High King of Ireland.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eibhir lives beyond the sea in a sunny place; her father is named lunsa, and
    her house has bird-feather thatch, gold doorposts, and doors of ribbed grass.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Oisin goes looking for Eibhir, fights the High King and a Firbolg army helping
    him, defeats them, and brings Eibhir to Ireland.
  category: action
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:4
  text: Beara's father, the King of Spain, asks his Druid who Beara's husband will
    be; the Druid answers that the destined husband will land in Spain that night.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Druid instructs Beara to go east to the river Eibhear, find a crimson-spotted
    salmon with shining clothing, strip off that clothing, and make a shining shirt
    for her husband.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Beara goes to the river Eibhear, finds the golden salmon as predicted, strips
    off its crimson clothing, and makes a shining shirt from it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Eoghan arrives in Spain that night, is welcomed by the waves and by the king,
    and is judged by the people to be a fitting match for Beara.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Eoghan says he has not asked for Beara because he is an exile without treasures
    or goods, though Beara is dear to him; the King of Spain calls this a kingly answer
    and gives Beara to him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Beara sends a serving-maid to bring the shirt made for Eoghan; he wears it
    over his armour, its brightness is seen everywhere, and he receives the name Eoghan
    the Bright.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Oiliol is named as the first son of Eoghan and Beara; Aine of the Sidhe bit
    off Oiliol's ear in revenge for her brother, and Oiliol's son later married Oisin's
    daughter.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Osgar, Oisin's son, is described as the best young man of the Fianna in battle;
    as a child he was pampered by the Fianna and grew up tall and idle.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: When a troop of the Fianna is attacked and Osgar is left behind, he takes
    a log of wood, attacks the enemy, makes a great slaughter, and routs them.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: After that battle Osgar goes into every battle, is called the strongest of
