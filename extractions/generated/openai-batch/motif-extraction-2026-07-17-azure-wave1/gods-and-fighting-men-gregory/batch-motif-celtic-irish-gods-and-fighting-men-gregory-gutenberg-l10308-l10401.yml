    the full circumstances of the rivalry.
- id: motif:2
  label: Prophecy identifies the destined royal spouse
  taxonomy_refs:
  - wisdom
  - royal_legitimacy
  - sacred_marriage
  basis: The King of Spain asks a Druid about Beara's husband; the Druid foretells
    the man's arrival and gives instructions that lead to Eoghan's marriage to Beara.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:6
  confidence: medium
  cautions: The marriage is royal and prophetically framed, but the passage does not
    present a formal sacred marriage ritual.
- id: motif:3
  label: Animal's shining covering becomes identity-giving garment
  taxonomy_refs: []
  basis: Beara strips the salmon's shining or crimson clothing, makes it into a shirt
    for Eoghan, and the shirt's brightness gives him the name Eoghan the Bright.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage does not explain whether the salmon is a transformed being;
