  label: Latent warrior proves himself in first combat
  taxonomy_refs:
  - initiation
  - culture_hero
  basis: Osgar is pampered and thought idle, but when left behind during a fight he
    takes a log, defeats the enemy, and thereafter joins every battle.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage shows a first public proof of warrior ability, though it does
