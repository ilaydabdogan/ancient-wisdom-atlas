canonical_text:
  quote: ''
  summary: Diarmuid and Grania wander through Ireland hiding from Finn, who follows
    them by divination but once searches the wrong hills. Grania watches over Diarmuid
    and sings both a sleep song and a rousing song. While they are in a cave at Beinn
    Edair, an old woman who has helped them meets Finn, reveals Diarmuid's hiding
    place, and returns with a sea-wet cloak and a false account of severe cold to
    keep him in the cave. Grania tastes salt water on the cloak, concludes they have
    been betrayed, and tells Diarmuid to arm himself.
  language: English
  quote_policy: summarized
