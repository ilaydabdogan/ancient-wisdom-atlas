  quote: ''
  summary: The preface describes Gaelic-speaking Ireland as having a generational
    popular literature that shaped social and martial ideals. It links stories of
    Finn, the Fianna, Cuchulain, and Osgar with aristocratic conduct, historical exempla,
    and later armed Irish identity. It then describes a boy near the Hill of Allen
    as part of a renewed chain of Irish-language and book-based transmission of stories
    of Finn and Oisin, tying heroic memory to named Irish landscapes.
  language: English
