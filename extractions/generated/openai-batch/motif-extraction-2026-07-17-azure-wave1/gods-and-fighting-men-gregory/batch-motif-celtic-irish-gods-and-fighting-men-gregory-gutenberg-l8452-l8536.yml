canonical_text:
  quote: ''
  summary: During a hunt at Ceiscoran, Conaran of the Tuatha de Danaan orders his
    three enchanting daughters to take vengeance on Finn. At a cave mouth they use
    enchanted hanks of yarn to weaken and bind Finn, Conan, and the Fianna, then carry
    them into the cave and prepare to kill them. Goll son of Morna arrives, defeats
    the women, spares the oldest after her oath to restore the captives, and the Fianna
    are released.
  language: English
  quote_policy: summarized
