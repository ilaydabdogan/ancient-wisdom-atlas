canonical_text:
  quote: ''
  summary: Etain tries to meet Ailell to heal his sickness but instead encounters
    Midhir, who appears in Ailell's likeness and says he was once her husband. Midhir
    later privately invites Etain to his wonderful country, describing its deathless
    beauty, feasting, and invisibility to others. Etain refuses to leave Eochaid unless
    Eochaid permits it. Midhir then appears to Eochaid as a strange armed man and
    challenges him to chess for stakes, losing horses and difficult works.
  language: English
