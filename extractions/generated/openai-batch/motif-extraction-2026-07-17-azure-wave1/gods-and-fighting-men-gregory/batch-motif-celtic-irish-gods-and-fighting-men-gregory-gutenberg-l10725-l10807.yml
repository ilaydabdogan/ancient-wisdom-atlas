canonical_text:
  quote: ''
  summary: Diarmuid reproaches a woman after the greyhound’s pups are gone; the woman
    and house vanish, and he vows to find her. He follows signs and reports to the
    strand, travels by mysterious ship and boat below the sea, reaches Land-under-Wave,
    learns the daughter of King Under-Wave has returned sick after seven years of
    enchantment, reunites with her, and undertakes a quest for three draughts from
    the cup of the King of the Plain of Wonder. A reddish man at a river boundary
    carries him across and joins him.
  language: English
