canonical_text:
  quote: ''
  summary: Midhir's people from Bri Leith perform difficult work, and Eochaid learns
    a Sidhe method of yoking oxen. Midhir later wins a game against Eochaid and asks
    for Etain, Eochaid's wife, but is granted only an embrace and a kiss. In the hall
    at Teamhair, Midhir takes Etain, rises through the roof, and is seen afterward
    as one of two swans linked by a gold chain. Eochaid searches for them among Sidhe
    places, later uses Codal's ogham divination to locate Etain at Bri Leith, besieges
    and digs into the hill, and finally recognizes and recovers Etain from among many
    women made to look like her. The passage also gives place-name origins and says
    Midhir's people later avenge the attack on their hill by bringing Conaire to death
    at Da Derga's Inn.
  language: English
  quote_policy: summarized
