canonical_text:
  quote: ''
  summary: Laegaire, son of Crimthan Cass of Connacht, meets Fiachna of the Sidhe
    coming through mist from a lake. Fiachna asks for warriors to help recover his
    wife, who has been taken and is now with Goll, king of a people of Magh Mell.
    Laegaire and fifty men follow Fiachna down into the lake, defeat Goll and his
    host, recover the woman, and return her to Fiachna. Laegaire receives Fiachna's
    daughter Deorgreine as wife, while his men receive women, and they remain for
    a year. When they revisit Ireland on horses, they find Connacht mourning them;
    Laegaire refuses his father's offer of rule and riches and says farewell, describing
    the pleasures of the other place.
  language: English
  quote_policy: summarized
