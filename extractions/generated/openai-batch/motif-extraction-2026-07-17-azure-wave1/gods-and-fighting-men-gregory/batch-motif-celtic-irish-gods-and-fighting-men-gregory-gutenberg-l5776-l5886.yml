canonical_text:
  quote: ''
  summary: Finn, using the name Deimne, studies poetry with Finegas at the Boinn and
    accidentally receives the salmon of knowledge. A second episode gives him wisdom
    from the moon well of Beag when its water enters his mouth. He demonstrates poetic
    learning in a seasonal nature poem. He then goes at Samhain to the High King's
    gathering at Teamhair, declares himself Finn son of Cumhal, and pledges service
    to the king, who accepts him.
  language: English
  quote_policy: summarized
