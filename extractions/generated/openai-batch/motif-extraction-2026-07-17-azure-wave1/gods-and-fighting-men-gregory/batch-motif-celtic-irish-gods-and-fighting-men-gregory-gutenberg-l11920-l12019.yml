canonical_text:
  quote: ''
  summary: Diarmuid and Grania leave a cave to avoid Finn and three hounds. The surviving
    strangers, guided by the Woman of the Black Mountain, set the hounds on Diarmuid's
    track. The pursuers reach Slieve Luachra, where Muadhan and Diarmuid defeat the
    three hounds one by one, and Diarmuid then kills the green-cloaked leader and
    two other men, causing the strangers to flee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Diarmuid tells Grania that he bound the strangers' three kings and that three
    fierce hounds are ready to hunt him; he says they should leave the cave before
    Finn and the hounds come upon them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Diarmuid, Grania, and Muadhan leave the cave; Muadhan carries Grania when
    she falls behind, and they reach Slieve Luachra, where a stream flows through
    the mountain and Grania asks Diarmuid for his knife.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The surviving strangers try to release their bound leaders, but touching the
    bonds makes them tighter.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Woman of the Black Mountain arrives quickly, identifies herself as Finn's
    woman-messenger, recognizes Diarmuid from the description, and tells the strangers
    to set their hounds on his track.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A woman-Druid remains with the bound champions while the strangers bring three
    hounds from the ship and follow Diarmuid's track through the cave, the Carrthach
    river, the bog of Finnliath, and Slieve Luachra.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Diarmuid sees the pursuing troop with soft silk banners and three chained
    hounds at its front.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: A young man in a well-coloured green cloak comes ahead of the others; Grania
    returns Diarmuid's knife and says she has no love for that man.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: When the first hound is loosed, Muadhan takes a whelp from his belt; the whelp
    leaps into the hound's throat, comes out through its side with its heart, and
    kills it.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When the second hound is loosed, Diarmuid speaks of weapons of Druid wounding
    and casts the Gae Dearg, the Red Spear, through the hound's body.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: When the third hound overtakes them at Lic Dhubhain on Slieve Luachra, it
    leaps as if to seize Grania, and Diarmuid kills it by striking it against a rock.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: After killing the third hound, Diarmuid casts the Gae Dearg at the green-cloaked
    leader and two other men, killing them; the remaining strangers flee after their
    leaders fall.
  category: sequence
  evidence_refs:
  - ev:10
