canonical_text:
  quote: ''
  summary: Patrick tries to convert Oisin and bring him to baptism. In a series of
    arguments, Oisin praises Finn, the Fianna, hunting, music, hounds, generosity,
    and heroic feats, while Patrick insists on Christian devotion and repeatedly declares
    Finn to be confined in Hell for neglecting or disrespecting God. Oisin rejects
    or laments this judgment and imagines the Fianna as able to free Finn, but Patrick
    denies that any force could bring him out.
  language: English
  quote_policy: summarized
