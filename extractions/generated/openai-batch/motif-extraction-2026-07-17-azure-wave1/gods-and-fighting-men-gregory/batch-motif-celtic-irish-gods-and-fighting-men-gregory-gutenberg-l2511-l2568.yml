canonical_text:
  quote: ''
  summary: After the battle of Magh Tuireadh, an unnamed player uses three harp-tunes
    to move listeners to grief, laughter, and sleep, allowing three persons to pass
    through the Fomor. The Dagda’s heifer recalls Ireland’s tribute cattle. A wounded
    druid named C dies on a flowered plain, and a lake covers his grave. Remaining
    Fomor spoil produce until the Morrigu and Angus Og drive them out on Samhain.
    The Morrigu proclaims victory and peace to Ireland’s people and landscape. Lugh
    becomes king of the Men of Dea, buries his foster-mother Taillte, founds annual
    commemorative fires, keening, games, and sports at Taillten, and arranges his
    mother Ethlinn’s marriage to Tadg, from whom named descendants are born.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'An unnamed player performs three kinds of harp-tune: the sleepy tune, the
    laughing tune, and the crying tune.'
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The crying tune makes women cry, the laughing tune makes women and children
    laugh, and the sleepy tune makes all the hosts fall asleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: While the hosts sleep, three persons go away through the Fomor, who would
    have been glad to harm them.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The Dagda brings out a heifer received as wages from Bres; when the heifer
    calls to her calf, the cattle of Ireland taken by the Fomor as tribute return
    to their fields.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: C, the druid of Nuada of the Silver Hand, is wounded in battle, travels southward
    to Carn Corrslebe, sees a flower-filled plain, reaches it, and dies there.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: After C is buried, a lake bursts out over his grave and the plain, and the
    lake is named Loch C.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Four Fomor remain in Ireland after the battle and spoil corn, milk, fruit,
    and sea-produce until the Morrigu and Angus Og drive them out on a Samhain night.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Morrigu gives news of the victory to the hosts, royal heights, chief rivers,
    and river-mouths of Ireland, and speaks a formula of peace and strength.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The number of men who fell in the battle is said to be unknowable until innumerable
    natural things can be numbered.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Lugh is made king over the Men of Dea, and his court is at Nas.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: Taillte, Lugh’s foster-mother, dies; before death she tells her husband Duach
    the Dark to clear the wood of Cuan so people can gather around her grave.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Duach calls the men of Ireland, and they cut down the wood of Cuan within
    a month using knives, bill-hooks, and hatchets.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: Lugh buries Taillte in the plain of Midhe, raises a mound over her, and orders
    annual summer fires, keening, games, and sports in her honor; the place is named
    Taillten.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: After the battle, Lugh’s mother Ethlinn comes to Teamhair, and Lugh gives
    her in marriage to Tadg, son of Nuada; their children are Muirne, mother of Finn,
    and Tuiren, mother of Bran.
  category: relationship
  evidence_refs:
  - ev:10
