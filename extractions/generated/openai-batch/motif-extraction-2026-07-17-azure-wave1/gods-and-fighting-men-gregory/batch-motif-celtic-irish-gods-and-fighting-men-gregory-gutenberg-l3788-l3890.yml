    Diarmuid and Cuchulain, being called Deirdre''s father by some, and appearing
    as a hare to lead Ulstermen to Deirdre.'
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
