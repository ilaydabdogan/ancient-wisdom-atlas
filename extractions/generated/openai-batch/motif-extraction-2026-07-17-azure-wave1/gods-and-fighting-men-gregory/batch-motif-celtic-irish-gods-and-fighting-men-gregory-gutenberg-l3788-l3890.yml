  quote: ''
  summary: 'The passage recounts traditions about Manannan: his reported death and
    lake-burial, later appearances and teachings, his possible involvement in the
    death of the sons of Usnach, his possible identity with Culain the Smith, a sea-woman''s
    shield bargain with Conchubar, Manannan''s hounds and a destructive pig, the drowning
    of Tuag after an attempted abduction to the Land of the Ever-Living Women, and
    three cows from the sea opening roads across Ireland.'
