candidate_motifs:
- id: motif:1
  label: death or burial producing a lake and place-name
  taxonomy_refs: []
  basis: Manannan's reported standing burial is immediately followed by a lake bursting
    up under his feet and being named Loch Orbson from one of his names.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage reports this as what some said, not as a single fixed account.
- id: motif:2
  label: supernatural figure active after reported death
  taxonomy_refs:
  - death_rebirth
  basis: The passage first reports Manannan's death and burial, then says he had many
    places of living and was often heard of in Ireland afterward.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: No explicit resurrection is stated; the text juxtaposes a death tradition
    with later activity.
- id: motif:3
  label: shapeshifting or variable identity
  taxonomy_refs:
  - shapeshifter
  basis: The passage says Manannan had many shapes, some identified Culain as Manannan,
    Manannan appeared as a hare in one account, and Fer Ferdiad took the shape of
    a household woman.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:10
  confidence: high
  cautions: The Culain identification is introduced as 'some say,' so it is a variant
    claim within the passage.
