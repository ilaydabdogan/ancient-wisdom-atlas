canonical_text:
  quote: ''
  summary: Mochaomhog learns through prayer that the music he hears is sung by the
    children of Lir, finds them as swans at the Lake of the Birds, and brings them
    under his care. Lairgnen, urged by Deoch, tries to take the swans from Mochaomhog's
    altar; when he touches them, their bird skins fall away and they appear as aged
    human beings. Fionnuala asks for baptism and a specific burial arrangement. The
    children of Lir are baptized, die, are buried with an Ogham-inscribed stone, and
    their souls gain heaven.
  language: English
  quote_policy: summarized
