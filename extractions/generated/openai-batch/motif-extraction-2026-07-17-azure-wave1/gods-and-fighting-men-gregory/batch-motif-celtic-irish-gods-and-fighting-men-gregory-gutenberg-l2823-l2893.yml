canonical_text:
  quote: ''
  summary: After the Gael land in Ireland, Eriu attacks them with the Men of Dea.
    Further battles follow at Tailltin, ending with the defeat of the Tuatha de Danaan
    leadership, the death of kings and queens, the yielding of the country to the
    Gael, and the division of Irish provinces among leaders and lineages. The passage
    also reports poetic characterizations of different peoples.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Three days after the landing of the Gael, Eriu attacks them with a body of
    men; the passage calls this the first battle between the Sons of the Gael and
    the Men of Dea for the kingship of Ireland.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fais is killed in a valley at the foot of a mountain, and the valley is said
    to be called after her; Scota also dies in the battle and is buried in a valley
    north of the mountain near the sea.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Gael are said to lose three hundred men, while a thousand of the Men of
    Dea are killed; Eriu retreats to Tailltin, and the Gael bury their dead, including
    the Druids Aer and Eithis.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: After resting and joining Heremon at Inver Colpa, the Gael summon the three
    kings of Ireland to a battle intended to settle the ownership of the country.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: At Tailltin, the Gael remember the death of Ith and fight to avenge him; they
    rout the Men of Dea, and the three kings and the queens Eriu, Fodhla, and Banba
    are killed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: During the pursuit, the Gael lose Cuailgne at Slieve Cuailgne and Fuad at
    Slieve Fuad, but the Men of Dea cannot regroup and give up the country to the
    Gael.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The sons of Miled divide the provinces of Ireland among leaders and related
    groups; the passage connects later Ulster figures to the Children of Rudraighe
    descended from Eimhir.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says that descendants of Ith include Fathadh Canaan, who obtains
    sway over the whole world and takes hostages of streams, birds, and languages.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:9
  text: The poets of Ireland are reported as associating brave fighters with the Sons
    of the Gael, skilled men with music and secret enchantments with the Tuatha de
    Danaan, and negative traits with the Firbolgs, men of Domnand, and Gaileoin, while
    also noting good fighters among them.
  category: speech
  evidence_refs:
  - ev:9
