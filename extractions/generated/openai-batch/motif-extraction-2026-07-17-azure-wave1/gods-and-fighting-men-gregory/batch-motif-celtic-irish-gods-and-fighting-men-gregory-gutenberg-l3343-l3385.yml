canonical_text:
  quote: ''
  summary: The passage describes Aoibhell, a woman of the Sidhe, trying to keep Dubhlaing
    ua Artigan from the battle of Cluantarbh by concealing him and later offering
    him two hundred years of happy life. Dubhlaing and Murchadh refuse to leave the
    battle after Aoibhell warns that they will die, and they return and are killed.
    The passage then recounts Aoibhell giving a golden harp to the son of Meardha;
    hearers of the harp die soon after, including the three sons of the King of Lochlann.
    Cuchulain later hears the same harp and knows his death is near.
  language: English
  quote_policy: summarized
