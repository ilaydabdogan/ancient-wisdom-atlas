  quote: ''
  summary: Glas, serving with the King of the World, meets Conn Crither and recognizes
    him as a kinsman from Teamhair Luachra. Glas asks to aid Conn and to keep the
    conflict to single combats until the Fianna arrive. Glas and Conn kill successive
    opponents; Conn is wounded, healed by three women from the Country of the Young
    in a healing well, and returns. Glas challenges and kills Madan of the Bent Neck,
    after which Conn praises him.
