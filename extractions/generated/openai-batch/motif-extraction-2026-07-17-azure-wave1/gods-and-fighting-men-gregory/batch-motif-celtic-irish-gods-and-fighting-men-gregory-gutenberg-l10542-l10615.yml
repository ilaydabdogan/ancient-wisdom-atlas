canonical_text:
  quote: ''
  summary: Diarmuid, Conan, Goll, and Osgar lose their way after hunting and come
    at midnight to a lit house where an old man, a young girl, and a cat receive them.
    During the meal a great wether overpowers the four men, but the cat subdues it.
    The old man explains that Goll has wrestled with the world, that the wether holds
    the strength of the world, and that the cat is death. Later the young girl, identified
    as Youth, refuses Conan, Osgar, and Diarmuid as former possessors, but gives Diarmuid
    a love-spot on his forehead that makes women unable to refuse him love.
  language: English
  quote_policy: summarized
