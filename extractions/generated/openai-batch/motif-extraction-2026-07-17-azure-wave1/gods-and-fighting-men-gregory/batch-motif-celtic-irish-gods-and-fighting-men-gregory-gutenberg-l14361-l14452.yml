canonical_text:
  quote: ''
  summary: Oisin, returned from the Country of the Young as an old man after a time
    that seemed short to him, is kept and questioned by Saint Patrick. At Patrick's
    request, Oisin recounts leaving Ireland with Niamh over the western sea, seeing
    wonders on the waves, arriving after a storm in the Country of the Young, being
    welcomed by its court and king, marrying Niamh, and having three children.
  language: English
  quote_policy: summarized
