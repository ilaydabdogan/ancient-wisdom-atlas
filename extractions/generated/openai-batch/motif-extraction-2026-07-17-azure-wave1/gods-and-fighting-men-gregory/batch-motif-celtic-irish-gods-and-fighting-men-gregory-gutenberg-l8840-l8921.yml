canonical_text:
  quote: ''
  summary: Finn, his companions, and their hounds encounter a giant with a pig and
    a young girl. A Druid mist hides the road, and after it clears they find a house
    at a ford with two wells. In the house are several strange inhabitants. Finn is
    given water from one well that harms and disfigures him, then water from the other
    that restores him. A pig is divided for the household, but a speaking ram takes
    the Fianna's share and proves invulnerable until a twelve-eyed man throws it out.
    A hag covers Finn's four comrades with a gown, turning them into old men, but
    after Finn sleeps with his head at the host's breast, the covering is removed
    and they return to their own shape.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Finn, Oisin, Caoilte, Diarmuid, Lugaidh's Son, and five named hounds go to
    the top of Cairn Feargall and see a tall rough giant carrying an iron fork with
    a squealing pig on it, followed by a beautiful young girl pushing him onward.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Diarmuid goes to speak with the giant and girl, but they turn away; Finn's
    party follows, and a dark Druid mist rises and hides the road.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the mist clears, Finn's party sees a light-roofed house at the edge
    of a ford, with a green lawn, two wells, an iron vessel at one well, and a copper
    vessel at the other.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: Inside the house are an old white-haired man at the door, the young girl,
    the giant boiling a pig by the fire, an old countryman with twelve eyes, a ram
    with marked coloring, and a hag in a worn grey gown.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The man at the door welcomes Finn's party and calls for respect to be shown
    to Finn; the giant complains but rises and shows respect.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: When Finn becomes thirsty, Caoilte fetches water in the copper vessel; the
    drink tastes like honey while Finn drinks it and gall afterward, and it brings
    pains, signs of death, and a change in Finn's appearance.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Caoilte then brings water in the iron vessel; the draught is extremely bitter,
    but after Finn drinks it his own color and appearance return and he is well again.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The giant divides the boiled pig among Finn, Finn's comrades, himself, the
    old man, the hag, the man of the house, and the young girl, but gives no portion
    to the ram.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The ram complains that no share was allotted to it, takes the Fianna's quarter,
    and begins to eat it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Finn's four comrades strike the ram with swords, but the swords do not harm
    it and slip from its back like from a rock; the twelve-eyed man throws the ram
    out the door, after which it is no longer seen.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The hag throws her pale grey gown over Finn's four comrades, and they turn
    into weak, withered old men with hanging heads.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The man at the door tells the frightened Finn to put his head in his breast
    and sleep; while Finn sleeps, the hag removes the covering from the four men,
    and when Finn wakes they are restored to their own shape.
  category: sequence
  evidence_refs:
  - ev:8
