canonical_text:
  quote: ''
  summary: Caoilte encounters Derg near a Sidhe hill at Ess Ruadh, enters the hill
    as Derg's guest, and learns of a war between Ilbrec and Lir. A destructive bird
    with an iron beak and fiery tail attacks Ilbrec's hall every evening. Caoilte
    brings the bird down with a copper rod. Ilbrec gives Caoilte the Spear of Fiacha,
    associated with Finn's killing of Aillen. The next morning Lir's armies surround
    the hill; Derg accepts command, and Caoilte meets Lir in single combat and kills
    him.
  language: English
  quote_policy: summarized
