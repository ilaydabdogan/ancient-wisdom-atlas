canonical_text:
  quote: ''
  summary: After losses among the Fianna, Niamh of the Golden Head arrives from over
    the sea on an adorned white horse. She identifies herself as daughter of the King
    of the Country of the Young, declares her love for Oisin, describes a deathless
    and abundant country, promises gifts and herself as wife, and Oisin agrees to
    go with her. He says farewell to Finn and the Fianna, mounts the horse with Niamh,
    and they head toward the sea while Finn and the Fianna grieve.
  language: English
