canonical_text:
  quote: ''
  summary: Finn and the Fianna sit at a ford and encounter Daireann, a queenly woman
    of the Sidhe lineage, who asks Finn to become her husband under conditions he
    refuses. She gives him a silver cup of strong mead; because he is bound not to
    refuse feast-items, he drinks and becomes mad, insulting the Fianna until they
    leave. Caoilte repeatedly brings them back, and Finn recovers by nightfall. A
    second episode tells of Maer sending Finn nine charmed nuts; Finn refuses them
    as nuts of ignorance and buries them.
  language: English
  quote_policy: summarized
