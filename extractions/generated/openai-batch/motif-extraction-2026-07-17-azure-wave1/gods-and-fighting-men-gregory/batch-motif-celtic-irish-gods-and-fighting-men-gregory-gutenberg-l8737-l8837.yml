candidate_motifs:
- id: motif:1
  label: Concealment by Druid mist
  taxonomy_refs: []
  basis: A Druid mist rises around Caoilte and his companions so they cannot be seen,
    and the young man with Caoilte cannot see the figures at the ford.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage gives concealment as an event, but does not explain the source
    or purpose of the mist beyond invisibility.
- id: motif:2
  label: Absent leader and delayed succession
  taxonomy_refs:
  - departure
  - royal_legitimacy
  basis: Finn has been gone for over a year, the Fianna grieve for their lord and
    leader, and the High King and Goll discuss temporary authority and refusal to
    replace Finn until a longer absence proves final.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:7
  - ev:11
  confidence: high
  cautions: The passage concerns political and communal response to absence, not a
    formal enthronement.
- id: motif:3
  label: Healing within a fixed ritual-like term
  taxonomy_refs: []
  basis: Luibra says the wounded men can be cured in nine days, and within nine days
    he restores them to soundness.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage gives a fixed healing duration but does not explicitly describe
    ritual actions.
- id: motif:4
  label: Search for the hidden hero in liminal places
  taxonomy_refs:
  - mystical_quest
  basis: The king asks whether anyone can get news of Finn in hills, secret places,
    rivers, invers, or houses of the Sidhe in Ireland or Alban.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: In this passage the search is proposed rhetorically; no full quest is
    narrated here.
- id: motif:5
  label: Following a deer of the Sidhe before disappearance
  taxonomy_refs:
  - departure
  - mystical_quest
  basis: Berngal says Finn came from the north following a deer of the Sidhe and entrusted
    him with a spear and hound-collar until a future meeting.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage recalls the departure but does not narrate the full pursuit
    or its immediate outcome.
- id: motif:6
  label: Prophecy of living survival and imminent return
  taxonomy_refs:
  - return
  - wisdom
  basis: Cithruadh says Finn is alive, withholds his location, and foretells that
    the Leader of the Fianna will be seen drinking at the Feast of Teamhair before
