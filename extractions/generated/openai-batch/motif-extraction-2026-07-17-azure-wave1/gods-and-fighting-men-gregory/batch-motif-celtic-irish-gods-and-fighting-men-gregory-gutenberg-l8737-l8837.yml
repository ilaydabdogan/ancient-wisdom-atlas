    behead him if the cure fails.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Within nine days Luibra cures the wounded men, who become as well and sound
    as before.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The High King summons the Fianna to the Feast of Teamhair, where the loss
