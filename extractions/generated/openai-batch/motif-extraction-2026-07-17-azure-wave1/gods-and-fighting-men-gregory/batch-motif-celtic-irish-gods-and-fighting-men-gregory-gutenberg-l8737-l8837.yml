canonical_text:
  quote: ''
  summary: Caoilte and companions move under a Druid mist, see young Fianna mourning
    Finn's absence, and return into a hill. Luibra heals wounded comrades in nine
    days. At the Feast of Teamhair, the High King and the Fianna discuss Finn's loss,
    succession, Finn's queens, and possible searches in liminal places. Berngal shows
    Finn's spear and hound-collar from the day Finn followed a deer of the Sidhe.
    Cithruadh says Finn is alive and will return before the feast ends. Finn and his
    men return from the House of the Two Birds after hostages are taken for Donn from
    the Tuatha de Danaan.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Caoilte and companions bring an unnamed young man to the ford of the Slaine,
    and a Druid mist rises so that they cannot be seen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: From a little hill above the ford, Caoilte sees four young men with crimson
    fringed cloaks, gold-hilted swords, and four hunting hounds; the young man with
    Caoilte cannot see them because of the mist.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Caoilte recognizes two of the young men as his sons Colla and Faolan and hears
    the group say that Finn has been gone for a year; they grieve and discuss what
    the Fianna should do without their lord and leader.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Caoilte and the two sons of Midhir go back by the Lake of the Two Birds to
    Slieve-nam Ban and enter the hill.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Finn and Donn welcome Luibra the physician and show him two wounded comrades;
