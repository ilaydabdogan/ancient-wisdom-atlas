canonical_text:
  quote: ''
  summary: Lugh comes to Nuada’s feast at Teamhair, proves that he possesses many
    arts, wins at chess, answers Ogma’s stone challenge, and plays the harp. Nuada
    seats him on the throne for thirteen days so the Tuatha de Danaan may hear his
    advice against the Fomor. The passage then introduces Balor of the Evil Eye, his
    Tower of Glass, an earlier failed attack by the sons of Nemed, the deadly origin
    and use of Balor’s eye, and Balor’s confinement of his daughter Ethlinn after
    a prophecy that his grandson will kill him.
  language: English
  quote_policy: summarized
