- id: motif:6
  label: regulated battle by equal numbers
  taxonomy_refs: []
  basis: Nuada proposes daily battle with the same number of fighters on each side,
    and Eochaid agrees.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The rule is explicit, but its ritual, legal, or heroic significance is
