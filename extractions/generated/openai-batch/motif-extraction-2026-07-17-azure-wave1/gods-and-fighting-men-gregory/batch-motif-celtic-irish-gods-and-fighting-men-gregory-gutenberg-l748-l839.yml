candidate_motifs:
- id: motif:1
  label: exchange of weapons before battle
  taxonomy_refs: []
  basis: Sreng and Bres inspect one another’s spears and exchange them so each side
    can see the other’s weapons before hostilities.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives a practical military reason for the exchange; any ritual
    or sacred meaning is not stated.
- id: motif:2
  label: conditional land-sharing ultimatum
  taxonomy_refs: []
  basis: The Men of Dea repeatedly offer peace in exchange for half of Ireland, while
    refusal leads toward battle.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:5
  confidence: high
  cautions: The passage frames this as political negotiation; it does not explicitly
    explain legal or sacred legitimacy.
- id: motif:3
  label: magical darkening and fiery-bloody assault
  taxonomy_refs:
  - chaos
  basis: The three queens use enchantments to cover the Firbolg planning-place with
    mists, darkness, and showers of fire and blood, disrupting sight and speech for
    three days.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The available taxonomy supports a broad chaos/disorder reading, but the
    passage itself calls the event enchantment rather than giving an abstract category.
- id: motif:4
  label: counter-enchantment by Druids
  taxonomy_refs: []
  basis: The three Firbolg Druids break the enchantment laid by the three queens after
    three days.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives no details of the method used to break the enchantment.
- id: motif:5
  label: preparatory delay to match enemy weapons
  taxonomy_refs: []
  basis: The Firbolgs request a quarter-year delay to prepare armour and make spears
