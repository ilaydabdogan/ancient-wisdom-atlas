canonical_text:
  quote: ''
  summary: Bres and Sreng compare and exchange spears, and Bres delivers an offer
    that the Firbolgs give half of Ireland to the Men of Dea or face battle. Sreng
    advises acceptance, but Eochaid and the Firbolg chiefs refuse. The Men of Dea
    fortify themselves at Magh Nia, and Badb, Macha, and the Morrigu send mists, darkness,
    and showers of fire and blood over Teamhair until three Firbolg Druids break the
    enchantment. Further peace terms are refused, and both sides agree to delay for
    preparations. The battle begins at Midsummer, proceeds under regulated numbers,
    and physicians heal surviving warriors each evening. On the fourth day Eochaid
    is driven from the field by thirst, pursued, killed at Traigh Eothaile, and buried
    under a heap of stones. Nuada then offers peace to the remaining Firbolgs; Sreng
    chooses Connacht. The passage links these survivors to later figures and names
    the conflict as the first battle of Magh Tuireadh.
  language: English
  quote_policy: summarized
