- id: obs:3
  text: The Fomor grant a delay, prepare an enormous broth in the king's cauldron,
    pour it into a hole in the ground, and tell the Dagda to eat it so they will not
    be reproached for poor hospitality.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Indech threatens that the Dagda will be killed if he leaves any of the broth
    behind.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Dagda uses a giant ladle, eats until the hole is empty, and scrapes up
    what remains among the earth and gravel.
