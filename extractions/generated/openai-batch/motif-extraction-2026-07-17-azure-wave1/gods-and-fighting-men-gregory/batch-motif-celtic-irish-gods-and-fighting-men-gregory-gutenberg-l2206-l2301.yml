canonical_text:
  quote: ''
  summary: 'The Fomor land with their leaders for battle. Lugh sends the Dagda to
    spy and delay them. The Fomor impose a huge broth-eating ordeal on the Dagda,
    who consumes it all and later meets the Morrigu washing in a river; she promises
    Indech''s heart-blood to the men of Ireland. Lugh gathers ritual, craft, and learned
    specialists, who each declare battle powers: mountains will fight, waters will
    be denied to the Fomor, fire and sickness will fall on them, trees and stones
    will become an armed host, and satire will shame and enchant them.'
  language: English
  quote_policy: summarized
