canonical_text:
  quote: ''
  summary: The transformed children of Lir, in the shape of four white swans, tell
    Lir they cannot live among people but retain memory, reason, Irish speech, and
    sweet music. Lir laments their condition and reports Aoife's deed to Bodb Dearg.
    Bodb punishes Aoife by changing her into a witch of the air with a Druid wand.
    The Tuatha de Danaan and the Sons of the Gael gather for three hundred years at
    Loch Dairbhreach to hear the swans' music. When the appointed time ends, the children
    depart sorrowfully for the cold sea of the Maoil, and the men of Ireland forbid
    killing swans. On the Maoil, a storm threatens to separate the siblings, who agree
    to meet at the Rock of the Seals.
  language: English
  quote_policy: summarized
