canonical_text:
  quote: ''
  summary: At a feast, Grania asks a Druid to identify several men of the Fianna,
    including Diarmuid. When Diarmuid's cap falls and reveals a love-spot on his forehead,
    Grania falls in love with him. She sends an enchanted wine cup that puts Finn,
    the king, queen, and most of the company to sleep. She asks Diarmuid to take her
    away; when he refuses because she is promised to Finn, she places him under Druid
    bonds to take her out before Finn and the King of Ireland awaken. They discuss
    possible routes of escape from Teamhair.
  language: English
  quote_policy: summarized
