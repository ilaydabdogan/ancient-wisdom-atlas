canonical_text:
  quote: ''
  summary: 'Finn accepts three strange men named Dubh, Dun, and Glasan into service
    and assigns them night watches measured by burning logs. Dubh and Dun each enter
    a strange house and recover wonder-working objects said to have been stolen from
    Finn a hundred years earlier: an inexhaustible cup and a knife that produces meat
    from a bone. Glasan hides among dead bodies, sees a one-limbed hag eat the bodies,
    kills her, and then faces three young men who leap from her body; one escapes.
    Finn praises the first two watchers but fears the escaped young man may bring
    trouble. After twenty-one years, a Red-Haired Man serves Finn under a condition
    that, if he dies, Finn will bury him on Inis Caol. When he dies, Finn keeps his
    word and sets out with the body on an old white horse that had grown younger.'
  language: English
  quote_policy: summarized
