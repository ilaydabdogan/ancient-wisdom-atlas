canonical_text:
  quote: ''
  summary: Before and during the battle of Magh Tuireadh, Lugh questions the craftsmen
    and healer about their battle-aid. Goibniu, Credne, Luchta, and Diancecht each
    state their powers; the Dagda claims he can do all. The Tuatha de Danaan are restored
    daily through a healing well and renewed weapons, while the Fomor send Ruadan
    to spy and wound Goibniu. Goibniu kills Ruadan, is healed, and the Fomor later
    dry up the well with stones. A later notice tells of Goibniu enchanting a spear-shaft
    named Nes so that it burns those struck by it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Goibniu says he can replace broken swords and lost spear-shafts for as long
    as seven years of battle, and that spear-points made by his hand will not miss
    or leave a touched man alive.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Credne says he will supply rivets for spears, hilts for swords, and bosses
    and rims for shields.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Luchta says he will provide shields and spear-shafts.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Diancecht says he will heal wounded men for the next day's battle unless the
    head is struck off or the brain or marrow is cut through.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Dagda says he can do all the boasted deeds by himself; the others call
    him the good god and laugh.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lugh speaks to the whole army and gives them strength, so that each has the
    spirit of a king or great lord.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Fomor and the men of Ireland come to the northern Magh Tuireadh near Ess
    Dara, and Bres and Indech threaten the men of Ireland with defeat and tribute.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Men of Dea decide not to let Lugh enter the battle and set nine men to
    watch him; on the first day only common fighting men fight.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Fomor observe that their broken weapons remain broken and their dead stay
    dead, while the Tuatha de Danaan's killed men and broken weapons are restored
    by the next morning.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the well of Slaine, Diancecht, Octruil, and Airmed sing spells and put
    herbs into the well; men brought there as dead come out whole and sound and quicker
    in battle.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: In the forge, Goibniu makes spear-heads by three turns, Luchta makes shafts
    by three cuts, and Credne makes rivets by three turns and casts rings so that
    the spears are ready.
  category: action
  evidence_refs:
  - ev:11
- id: obs:12
  text: The Fomor send Ruadan to spy on the camp because he is the son of Bres and
    Brigit and has Tuatha de Danaan descent; he observes the work and reports back.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: After Ruadan's report, the Fomor decide that Goibniu is hindering them most
    and send Ruadan back to kill him.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: Ruadan asks for spear parts, receives them, wounds Goibniu with the spear,
    and is then struck through and killed by Goibniu with the same weapon; Brigit
    keens her son.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: Goibniu is healed in the well, but Octriallach orders the Fomor to throw stones
    into the well until it dries up and a cairn is raised over it.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: After hearing a charge against his wife, Goibniu becomes jealous, sings spells
    over a spear-shaft named Nes, and anyone later struck by that spear burns up like
    fire.
  category: sequence
  evidence_refs:
  - ev:16
