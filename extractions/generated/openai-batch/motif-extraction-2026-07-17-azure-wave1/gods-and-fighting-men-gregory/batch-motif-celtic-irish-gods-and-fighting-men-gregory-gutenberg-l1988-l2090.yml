  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: After hearing the refusal, the sons of Tuireann take up their arms and fight
    the army of Ioruaidh; in the fighting, Iuchar and Iucharba are separated from
    Brian.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Brian reaches the King of Ioruaidh, fights him, overcomes him, binds him,
    and brings him to Easal.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The whelp is given to the sons of Tuireann, the King of Ioruaidh is unbound,
    and peace is made.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lugh learns that the sons of Tuireann have obtained the things needed for
    the battle with the Fomor, and he sends a Druid spell that makes them forget the
    rest of the fine and long to return to Ireland.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At Teamhair, Lugh shuts himself inside the city, puts on Manannan's smooth
