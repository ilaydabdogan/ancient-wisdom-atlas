canonical_text:
  quote: ''
  summary: The sons of Tuireann receive pigs from Easal without battle, travel with
    him to Ioruaidh to seek a hound, and obtain it after Brian defeats and binds the
    King of Ioruaidh. Lugh then sends a Druid spell causing them to forget remaining
    parts of the fine and return to Ireland. At Teamhair, Lugh avoids them, receives
    the fine through the king, and declares that the cooking-spit and three shouts
    on the hill are still missing.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The king and his people agree to give the pigs freely to the sons of Tuireann
    because they judge that no one has yet been able to stand against them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sons of Tuireann thank Easal, are hosted with food, drink, beds, and other
    comforts, and receive the pigs the next morning.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Brian says the pigs are the only part of the fine they have obtained without
    fighting, and he makes a praising poem for the king.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sons of Tuireann say their next destination is Ioruaidh because of a whelp
    there, and Easal asks to accompany them because his daughter is married to the
    King of Ioruaidh.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king's ship is prepared, and the travellers come to the coast of Ioruaidh,
    where people and armies watch the harbours and landing-places.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Easal speaks peaceably with the King of Ioruaidh and asks for the hound, but
