canonical_text:
  quote: ''
  summary: The passage identifies Manannan with forms or names such as the Gilla Decair
    and O'Donnell's Kern. It recounts his association with Finn and the Fianna, then
    tells how a strange clown-like visitor enters Aodh Dubh O'Donnell's feast without
    using the gate, disparages the musicians, plays surpassingly sweet harp music,
    refuses honors and gifts, evades guards through trickery, and gives the gate-keeper
    an herb that restores the injured men to life in exchange for cows and land.
  language: English
