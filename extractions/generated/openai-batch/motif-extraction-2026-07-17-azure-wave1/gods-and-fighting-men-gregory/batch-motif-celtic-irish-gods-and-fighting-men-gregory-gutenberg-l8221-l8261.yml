canonical_text:
  quote: ''
  summary: After a battle in which the armies of the World and the Fianna have fallen,
    Finnachta, a surviving foreign warrior, carries away the body of the King of the
    World and says he will report the battle in the East. Finn, lying wounded, laments
    that a foreigner remains alive to tell the story. Fergus reports that neither
    side gave way and that the field is covered with bodies. Cael, Finn’s foster-son
    and mortally wounded, asks Fergus to carry him to the sea so he can swim after
    Finnachta. At the ship, Cael seizes Finnachta, pulls him overboard, and the two
    sink together into the sea.
