canonical_text:
  quote: ''
  summary: Finn hunts a fawn that is unharmed and recognized by Bran and Sceolan.
    The fawn becomes Sadbh, a woman enchanted into deer form by the Dark Druid after
    refusing him, and she marries Finn. While Finn is away fighting, a deceptive likeness
    of him and his hounds lures Sadbh outside Almhuin, where she is changed back into
    a fawn and carried off. Finn searches for her for seven years. Later, while hunting
    at Beinn Gulbain, he finds a wild young boy protected by his trusted hounds; the
    boy is brought among the men and loses his wildness.
  language: English
  quote_policy: summarized
