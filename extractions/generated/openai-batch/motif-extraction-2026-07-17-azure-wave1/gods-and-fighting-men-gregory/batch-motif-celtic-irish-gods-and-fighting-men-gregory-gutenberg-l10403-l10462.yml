canonical_text:
  quote: ''
  summary: Finn and the Fianna meet a richly dressed woman at Slieve Crot who identifies
    herself as Etain and challenges them to a race. They follow her to the hill of
    the Sidhe at Beinn Edair, where Aedh reveals that the runner was actually Be-mannair,
    a shapeshifting messenger, in Etain's form. Etain, daughter of Aedh, loves Osgar.
    A rejected bride-price is described, Osgar agrees to Etain's condition with sureties,
    and a wedding feast follows. Later Osgar is badly wounded at Beinn Edair; Etain
    sees him diminished, grieves, and dies, though Osgar dies later at Gabhra.
  language: English
  quote_policy: summarized
