  summary: Oisin recounts leaving the Country of the Young with Niamh's warning not
    to dismount from the white horse. He returns to Ireland, learns that Finn and
    the Fianna belong to the distant past, sees Almhuin ruined, disputes with Patrick
    about the fate of the Fianna, and finally dismounts beside a water-filled stone
    trough, whereupon age overtakes him and the horse leaves him.
