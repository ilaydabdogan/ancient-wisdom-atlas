- id: ev:10
  type: summary
  locator: 9334-9344
  quote_or_summary: Bebind says Caoilte has relief, performs the washing of Flann
    for his head, and the hill people divide into three groups to visit, entertain,
    and bring him the best of their hunting.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
