  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary of supplied passage.
- id: ev:12
  type: summary
  locator: 9354-9365
  quote_or_summary: The sound is Uaine from the Sidhe hill at the Wave of Cliodna
    with birds of the Land of Promise; she visits a Sidhe hill yearly, enters with
    the birds, and thirty birds sing with Cascorach's harp.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary of supplied passage.
- id: ev:13
  type: summary
  locator: 9366-9369
  quote_or_summary: Caoilte asks for the healing of his thigh; Bebind attends to it,
    and her serving people suck the bad matter from the wound until it is healed.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary of supplied passage.
- id: ev:14
  type: summary
  locator: 9370-9372
  quote_or_summary: The people of the hill go to swim; Caoilte enters the water because
    his health has returned, and afterward they return to the hill for a great feast.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summary of supplied passage.
