canonical_text:
  quote: ''
  summary: Caoilte and his companions aid the people of the Sidhe by driving away
    destructive red birds and killing three ravens that annually carry off boys during
    hurling. In return, Ilbrec orders Caoilte's cure. Bebind, daughter of Elcmar,
    treats him with herbal water, milk, a head-washing cure, and later a thigh treatment.
    While he recovers, the Sidhe community entertains and feeds him. Uaine arrives
    with birds from the Land of Promise, and their music is praised. After healing,
    Caoilte swims and joins a feast.
  language: English
  quote_policy: summarized
