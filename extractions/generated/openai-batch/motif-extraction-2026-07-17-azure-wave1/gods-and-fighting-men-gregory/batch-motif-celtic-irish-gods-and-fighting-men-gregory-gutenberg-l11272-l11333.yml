canonical_text:
  quote: ''
  summary: Miodac, son of the King of Lochlann, deceives Finn and the Fianna by posing
    as a poet, then lures them into the enchanted House of the Quicken Trees with
    the promise of a feast. The beautiful house becomes foul and bare, its doors are
    reduced and shut, and the captives cannot move. Finn perceives danger and orders
    the Dord Fiann to be sounded. Some Fianna hear and fight, but Diarmuid finally
    kills Miodac and the Three Kings of the Island of the Floods and removes the enchantment
    with their blood. Conan then asks for food and jokes about Diarmuid's responsiveness
    to women.
  language: English
  quote_policy: summarized
