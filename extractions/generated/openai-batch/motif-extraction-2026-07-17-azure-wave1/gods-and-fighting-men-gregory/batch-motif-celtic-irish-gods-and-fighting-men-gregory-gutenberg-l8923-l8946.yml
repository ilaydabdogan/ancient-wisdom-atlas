canonical_text:
  quote: ''
  summary: 'A man explains to Finn that the strange beings and objects in the house
    are allegorical: Sluggishness, Liveliness, the World, the Desires of Men, Old
    Age, and the wells of Lying and Truth. He names himself Cuanna from Innistuil
    and says he arranged these things because of his love for Finn’s wisdom and reputation.
    Finn and his men sleep, and in the morning they awaken on Cairn Feargall with
    their dogs and arms beside them.'
  language: English
  quote_policy: summarized
