canonical_text:
  quote: "“willing or unwilling, I will take those berries from you.”"
  summary: Diarmuid asks the Surly One of Lochlann for berries from the quicken-tree
    of Dubhros because Grania wants to taste them. The Surly One refuses, attacks
    Diarmuid with a club, and is killed by Diarmuid. Diarmuid has the body hidden,
    brings Grania to the berries, and plucks them for her and the children of Morna.
    He sends berries to Finn through the young men of Morna, who claim the killing,
    but Finn recognizes Diarmuid’s hand on the berries. Finn comes with the Fianna
    to the tree, where Diarmuid and Grania are hidden above. Finn begins a chess game
    below, and Diarmuid, unseen by all but Grania, comments that he could show Oisin
    the winning move.
  language: English
  quote_policy: quoted
