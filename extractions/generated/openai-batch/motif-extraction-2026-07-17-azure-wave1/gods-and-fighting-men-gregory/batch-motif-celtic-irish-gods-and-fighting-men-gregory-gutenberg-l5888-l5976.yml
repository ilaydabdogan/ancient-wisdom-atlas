canonical_text:
  quote: ''
  summary: At Samhain, Aillen of the Tuatha de Danaan repeatedly comes from Sidhe
    Finnachaidh, lulls Teamhair to sleep with Sidhe music, and burns it with fire
    from his mouth. The king promises a rightful inheritance to whoever can guard
    Teamhair until dawn. Finn accepts after sureties are given. Fiacha secretly provides
    Finn with a deadly spear whose power prevents sleep when held to the forehead.
    Finn resists the music, turns aside Aillen's flame with his crimson cloak, follows
    Aillen to Sidhe Finnachaidh, kills him with the spear, and displays his head at
    Teamhair. Aillen's mother laments him. At daybreak Finn shows the head, pipe,
    and harp as proof that Teamhair is saved. The council gives Finn the headship
    of the Fianna; Goll and the chief men acknowledge him by putting or striking their
    hands in his hand. The passage closes by naming Finn's dwelling at Almhuin and
    recounting the white dun, the well, and cattle horns associated with the place.
  language: English
  quote_policy: summarized
