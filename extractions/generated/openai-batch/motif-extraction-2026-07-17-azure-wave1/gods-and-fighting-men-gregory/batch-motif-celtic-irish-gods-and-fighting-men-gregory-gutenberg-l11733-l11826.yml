canonical_text:
  quote: ''
  summary: Diarmuid and Grania continue westward, gain Muadhan as a helper, are carried
    over rivers, and sleep in a cave where Muadhan feeds and watches over them. Diarmuid
    scouts from a hill, encounters the Green Champions sent by Finn to find a hiding
    enemy, hears of their invulnerable tracking hounds, and then performs a wine-tun
    trick that kills fifty men who try to imitate it.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Diarmuid and Grania travel west along the Sionnan; Diarmuid kills a salmon,
    cooks it on a spit at a fire, and they cross the stream to eat it.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the marsh of Finnliath they meet Muadhan, who describes himself as a fighting
    lad seeking a master and offers day service and night watching.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Grania advises Diarmuid to keep Muadhan, and the three make a binding agreement
    before continuing westward.
  category: relationship
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Muadhan carries Diarmuid and Grania on his back across the Carrthach and Beith
    rivers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The group enters a cave near Currach Cinn Adhmuid, and Muadhan prepares beds
    of rushes and birch tops for Diarmuid and Grania.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: Muadhan makes a fishing rod from a quicken-tree rod, hair, hook, and holly
    berries, catches three salmon in three casts, and cooks them on spits.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Muadhan divides the fish, giving the largest to Diarmuid, the second largest
    to Grania, and the smallest to himself, explaining that each of the other two
    would have favored the other.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Diarmuid and Grania sleep in the far part of the cave while Muadhan keeps
    watch until morning.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Diarmuid climbs a nearby hill to look around and sees a fleet of ships arriving
    from the west; nine times nine chief men come ashore.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Green Champions say Finn sent them to look for a hiding enemy; they describe
    themselves as twenty hundred fighting men and say they have three deadly hounds
    immune to fire, water, and arms.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Diarmuid tells the Green Champions he saw the grandson of Duibhne yesterday
    and describes himself as a fighting man living by his hand and sword.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Diarmuid asks whether there is wine in the ships, has a tun brought out, drinks
    from it, and rides it down and up the hill three times as a trick.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Men of the Green Champions attempt Diarmuid's tun trick; the first is knocked
    from the tun and crushed, and fifty are killed before the survivors return to
    their ships.
  category: sequence
  evidence_refs:
  - ev:10
