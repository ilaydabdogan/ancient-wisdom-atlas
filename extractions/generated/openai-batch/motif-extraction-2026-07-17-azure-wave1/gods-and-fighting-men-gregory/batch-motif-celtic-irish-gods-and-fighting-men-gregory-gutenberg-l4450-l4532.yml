candidate_motifs:
- id: motif:1
  label: Forced departure from homeland by sea
  taxonomy_refs:
  - departure
  basis: Ciabhan is sent away because of jealousy among the Fianna and then boards
    a curragh to leave Ireland, saying he lacks shelter and protection there.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage frames the departure as social exile and self-preservation,
    not as a formal quest command.
- id: motif:2
  label: Perilous sea crossing to an otherworld country
  taxonomy_refs:
  - mystical_quest
  basis: Ciabhan passes through dangerous waves and is taken by the rider to Tir Tairngaire,
    Loch Luchra, and Manannan's city.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The destination is an otherworld-associated country in the passage, but
    the passage does not state that Ciabhan is dead or traveling to an afterlife realm.
- id: motif:3
  label: Rescue exchanged for future service
  taxonomy_refs:
  - sacred_exchange
  basis: The rider asks what reward would be given for rescue, specifies service to
    the helper, and Ciabhan agrees before being rescued.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The later fulfillment or content of the promised service is not included
    in this passage.
- id: motif:4
  label: Difficult feat set before a stranger in a supernatural hall
  taxonomy_refs:
  - initiation
  basis: Performers in Manannan's house challenge strangers with a difficult nine-rod
    trick; Ciabhan performs it successfully before the assembled company.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The passage presents the feat as entertainment and humiliation of strangers;
    an initiation reading is possible but not explicit.
- id: motif:5
  label: Otherworld love and elopement followed by pursuit
  taxonomy_refs:
  - stolen_beloved
  basis: Cliodna of Manannan's country falls in love with Ciabhan and goes away with
    him; people of Manannan's house then pursue them with forty ships.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:11
  confidence: medium
  cautions: Cliodna consents to leave, so the 'stolen beloved' taxonomy is approximate
    rather than literal abduction by Ciabhan.
- id: motif:6
  label: Sleep induced by music before loss by water
  taxonomy_refs: []
  basis: Iuchnu plays music to Cliodna until she lies down and sleeps, after which
    a great wave sweeps her away.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: The passage does not explain the nature or source of the music's power
