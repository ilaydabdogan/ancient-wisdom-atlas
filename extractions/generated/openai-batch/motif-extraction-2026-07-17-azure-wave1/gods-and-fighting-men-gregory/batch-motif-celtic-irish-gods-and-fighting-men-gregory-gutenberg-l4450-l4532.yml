canonical_text:
  quote: ''
  summary: Ciabhan of the Curling Hair leaves Ireland by curragh after jealousy among
    the Fianna. In a dangerous sea crossing he is rescued by an unnamed rider on a
    dark grey horse and brought to Tir Tairngaire, Manannan's country. In Manannan's
    house he succeeds at a difficult rod-juggling feat. Cliodna, daughter of the chief
    Druid Gebann, falls in love with him and leaves with him for Ireland. At Teite's
    Strand, while Ciabhan hunts, Manannan's people pursue them; Iuchnu plays music
    that puts Cliodna to sleep, and a great wave sweeps her away. The wave is thereafter
    named for Cliodna.
  language: English
  quote_policy: summarized
