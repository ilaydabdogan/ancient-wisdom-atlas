canonical_text:
  quote: ''
  summary: During a return to Ireland, the Lad of the Skins meets an old enemy in
    a ship. The two fight through multiple human and animal forms and kill one another
    as birds. Finn brings the Lad's bird-body back to the wife, Manannan's daughter.
    She is carried by sea to an island, sees a dead bird revived there, finds a tree
    with green leaves, and uses the leaves to restore the Lad. The pair return to
    Almhuin, where Finn pays the Lad his wages, and then they depart.
  language: English
