canonical_text:
  quote: ''
  summary: Connla of the Red Hair is summoned by a wonderfully clothed woman of the
    Sidhe from deathless otherworld lands. Conn asks Coran the Druid to resist her
    with spells; she leaves Connla an apple that sustains him for a month without
    diminishing. When she returns, she invites Connla into a shining ship, and he
    leaves his people, sailing away across the sea and not returning.
  language: English
  quote_policy: summarized
