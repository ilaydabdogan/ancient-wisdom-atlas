canonical_text:
  quote: ''
  summary: 'A large stranger, called the Gilla Decair or Hard Servant, leaves Finn
    and the Fianna after accusing them of mocking him. His horse, loaded with Conan
    and other Fianna, follows him and carries them away toward and over the sea. Conan
    calls on Finn to follow and bring them back. Finn pursues, recalls a Tuatha de
    Danaan gift by which those leaving Ireland may find a ship at Beinn Edair, and
    meets two sons of the King of the Eastern World: Feradach, who can produce ships
    with three axe-blows on a sling-stick, and an unnamed tracker who can follow a
    teal''s track over land or sea. Feradach fills the bay and harbour with ships,
    and Caoilte gives three shouts heard by the Fianna throughout Ireland.'
  language: English
  quote_policy: summarized
