candidate_motifs:
- id: motif:1
  label: guarded champion breaks restraint and turns battle
  taxonomy_refs: []
  basis: Lugh is left under guard but breaks away, reaches the front, rallies the
    fighters, and then defeats Balor.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage does not explicitly state that Lugh alone turns the whole
    battle, though his intervention is central.
- id: motif:2
  label: destructive eye neutralized by hero's weapon
  taxonomy_refs:
  - world_destroying_fire
  basis: Balor's eye kills those who see it and is said capable of burning Ireland
    in one flash; Lugh disables it with a spear before beheading him.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: 'The available taxonomy label is broader than the passage: the text threatens
    Ireland specifically, not the whole world.'
- id: motif:3
  label: life spared in exchange for agricultural knowledge
  taxonomy_refs:
  - sacred_exchange
  - wisdom
  - culture_hero
  basis: Bres seeks mercy through promises about cattle and corn, then gives instructions
    on ploughing, sowing, and reaping; Lugh accepts and frees him.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage frames the exchange pragmatically; the sacred status of the
    exchange is inferred from mythic context rather than explicitly named.
- id: motif:4
  label: speaking weapon recounts its deeds
  taxonomy_refs: []
  basis: When Ogma unsheathes Orna, the sword tells all the deeds done by it, and
    the narrator adds that swords used to have that power.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No available taxonomy family directly matches animate or speaking weapons.
- id: motif:5
  label: stolen sacred instrument summoned back by its owner
  taxonomy_refs:
  - sacred_theft
  - return
  basis: The Fomor have carried off the Dagda's harp; the Dagda has bound the music
    in it, calls to it, and it comes from the wall to him.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage does not explicitly call the harp sacred; the label rests
    on its mythic ownership and magical behavior.
- id: motif:6
  label: battle blood consecrates or names a ford of destruction
  taxonomy_refs: []
  basis: The Morrigu takes Indech's blood to armies waiting at the ford of Unius,
    and the ford receives the name Ford of Destruction from that day.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The function of giving the blood to the armies is not explained in the
    passage.
