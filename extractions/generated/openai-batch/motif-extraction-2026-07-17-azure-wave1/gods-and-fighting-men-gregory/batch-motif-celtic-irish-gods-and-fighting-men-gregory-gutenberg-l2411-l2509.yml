  category: object
  evidence_refs:
  - ev:10
- id: obs:15
  text: Lugh, the Dagda, and Ogma pursue the Fomor because they have carried off the
    Dagda's harp, Uaitne, and find it hanging in a feasting-house with Bres and Elathan
    present.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: The Dagda has bound the music in the harp so it will not sound until he calls
