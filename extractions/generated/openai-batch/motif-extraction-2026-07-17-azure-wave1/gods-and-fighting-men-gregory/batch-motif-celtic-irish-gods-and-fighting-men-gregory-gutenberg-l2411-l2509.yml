canonical_text:
  quote: ''
  summary: The passage narrates the great battle between the Fomor and the Men of
    Dea/Tuatha de Danaan. Lugh breaks away from his guards, rallies the fighters,
    kills Balor by striking out his destructive eye, and later spares Bres after receiving
    agricultural advice. The passage also recounts the Morrigu taking Indech's blood
    to a ford, Ogma finding the speaking sword Orna, and the Dagda summoning back
    his stolen harp Uaitne.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Fomor come out of their camp in strong ranks, each leader or fighting
    man equipped with armour, helmet, spear, sword, and shield.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Men of Dea leave Lugh with nine comrades guarding him and go to the battle
    with Midhir, Bodb Dearg, and Diancecht; Badb, Macha, and the Morrigu say they
    will go along.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: At first the battle goes against the Tuatha de Danaan; Nuada and Macha fall
    by Balor, Cass-mail falls by Octriallach, and the Dagda is badly wounded by Ceithlenn's
    casting spear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lugh breaks away from those guarding him, rushes to the front, and urges the
    fighters of Ireland to fight rather than remain in bonds and tribute.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The battle is described with slaughter, blood, weapon-noise, men slipping
    in blood, and a river carrying bodies of friends and enemies together.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lugh meets Balor in battle, reproaches him, and after Balor's eyelid is lifted,
    Lugh casts his red spear and drives Balor's eye out through the back of his head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Balor's dislodged eye falls toward his own army; three times nine Fomor die
    when they look at it, and the passage says Ireland would have burned in one flash
    if Lugh had not put the eye out.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: After disabling the eye, Lugh cuts off Balor's head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Indech is crushed in the battle, blood bursts from his mouth, and he calls
    for his poet Leat Glas, who cannot help him.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Morrigu enters the battle, encourages the Tuatha de Danaan, takes two
    handfuls of Indech's blood, and gives it to armies waiting at the ford of Unius,
    which is thereafter called the Ford of Destruction.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Fomor are routed and driven back to the sea; Lugh and his comrades find
    Bres without a guard.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: Bres asks Lugh to spare his life, first promising that Ireland's cows will
    never go dry and then promising a harvest of corn every quarter; Maeltine rejects
    both offers as insufficient.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: Lugh asks Bres for the best way to plough, sow, and reap; Bres answers that
    these actions should be done on a Tuesday, and Lugh lets him go free.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: Ogma finds Orna, the sword of Tethra, takes it from its sheath, cleans it,
