canonical_text:
  quote: ''
  summary: Finn, Daire, and the Fianna pursue a stag; Finn and Daire become separated,
    disoriented by shifting sound and Druid mist, and meet Glanluadh, who has also
    lost her way. Sidhe music brings sleep, after which Finn and Daire see a lighted
    house surrounded by a stormy sea. A large Grey Man brings them into the house,
    where Ailne, wife of Meargach, accuses Finn of treachery and seeks revenge for
    earlier deaths. Finn, Daire, and Glanluadh are bound and imprisoned without food,
    drink, or music. After hearing Glanluadh's account, Ailne releases her and restores
    her with an enchanted cup of the Sidhe, then permits her to feed Finn and Daire
    while still intending revenge on the Fianna.
  language: English
  quote_policy: summarized
