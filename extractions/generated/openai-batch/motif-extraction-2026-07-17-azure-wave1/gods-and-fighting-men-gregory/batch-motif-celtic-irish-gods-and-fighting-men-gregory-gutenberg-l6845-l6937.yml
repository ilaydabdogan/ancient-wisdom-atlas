canonical_text:
  quote: '"every third night, one of us three is dead and the other two are watching
    him"'
  summary: Finn and the Fianna meet three young men from Iruath with a many-coloured
    hound. The men offer service, provisions, protection, and a sleep-making pipe,
    but ask for secrecy at night and explain that one of them is dead every third
    night while the others watch him. The hound later produces gold and silver to
    pay poets, and one of the men fills drinking-horns with beer when the Fianna lack
    water. Three poisonous red bald men then arrive with red hounds and spears, claim
    kinship with the Tuatha de Danaan, demand a blood-fine from Caoilte for their
    slain father, and threaten ongoing harm after Finn refuses.
  language: English
  quote_policy: quoted
