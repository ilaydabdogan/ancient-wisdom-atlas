canonical_text:
  quote: ''
  summary: After Nuada loses an arm and is removed from kingship under a Tuatha de
    Danaan law requiring bodily perfection, Bres is chosen as king because of his
    beauty. His reign is marked by Fomor tribute, his own milk tax, deception involving
    disguised and wooden cows, lack of hospitality, forced labor imposed on Ogma and
    the Dagda, and a dispute in which Cridenbel dies after taking gold hidden in the
    Dagda's food portions on Angus Og's advice. The Dagda is accused but vindicated
    when the gold is found inside Cridenbel's body. Angus then advises the Dagda about
    choosing a marked heifer as wages.
  language: English
  quote_policy: summarized
