canonical_text:
  quote: ''
  summary: Finn discovers that Diarmuid and Grania have left Teamhair and pursues
    them with trackers and the Fianna. Allies attempt to warn Diarmuid through Bran
    the hound and through Fearghoin's three loud shouts, but Diarmuid refuses to flee.
    Finn surrounds the wooded shelter at Doire-da-Bhoth. Angus Og, warned of Diarmuid's
    danger, comes unseen, offers concealment under his cloak, and carries Grania away
    while Diarmuid remains behind.
  language: English
  quote_policy: summarized
