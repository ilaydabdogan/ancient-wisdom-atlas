canonical_text:
  quote: ''
  summary: Oisin remembers the sounds, hunts, hounds, feasts, battles, and companions
    of the Fianna while speaking with Patrick. Patrick repeatedly urges him to leave
    such memories and attend to God, death, judgment, and the pains or blessedness
    ahead. Oisin laments old age, regrets baptism and ascetic practice, asks whether
    his hound may enter the heavenly court, and continues to defend the Fianna against
    Patrick’s rebukes.
  language: English
  quote_policy: summarized
