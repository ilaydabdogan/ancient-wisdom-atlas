canonical_text:
  quote: ''
  summary: Grania sees Finn and the Fianna returning with Diarmuid's hound and realizes
    Diarmuid is dead. Oisin gives the hound to her after Finn refuses. Grania laments
    Diarmuid, sends her household to recover his body, and mourns him as husband,
    champion, hunter, and beloved. Angus learns of Diarmuid's death, meets the body-bearers,
    laments his failure to protect Diarmuid, accuses Finn of treachery, and carries
    the body to Brugh na Boinne on a golden bier, saying he will try to bring Diarmuid
    back to life or give him life enough to speak with him daily.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Grania sees Finn and the Fianna approaching with Mac an Chuill and says that
    if Diarmuid were alive the hound would not be led home by Finn; she is pregnant
    and falls from the wall.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Grania asks Finn to leave Mac an Chuill with her; Finn refuses and says he
    does not think it too much for him to inherit from Diarmuid.
  category: speech
  evidence_refs:
