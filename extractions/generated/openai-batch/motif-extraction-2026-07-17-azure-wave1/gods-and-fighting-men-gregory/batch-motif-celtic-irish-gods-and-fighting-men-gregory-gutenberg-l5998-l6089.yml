canonical_text:
  quote: ''
  summary: The passage describes the size, obligations, admission tests, compensation,
    and defensive duties of the Fianna; lists Finn's Druids, physicians, poets, musicians,
    and household servants; describes sewing-women making clothing in a rath; and
    recounts the arrival of Cnu Deireoil, the Little Nut, a musician from the Sidhe
    at Slieve-nam-ban whose music is taught to Finn's musicians.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Fianna of Ireland are described as seven score and ten chief men, each
    chief having three times nine fighting men under him.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Every man of the Fianna is bound not to take cattle by oppression, not to
    refuse any man as to cattle or riches, and not to fall back before nine fighting
    men.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: A man is not admitted to the Fianna until his tribe and kindred provide securities
    concerning vengeance and responsibility, and until he knows the twelve books of
    poetry.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Before admission, a candidate is placed in a deep hole up to his middle with
    a shield and a hazel rod while nine men cast spears at him; being wounded disqualifies
    him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The candidate then runs through the woods while the Fianna pursue him; he
    is disqualified if wounded, if his spears tremble, if a branch loosens his hair,
    or if he cracks a dry stick underfoot.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The candidate must leap over a stick as high as himself, stoop under one as
    high as his knee, and remove a thorn from his foot with his nail while running
    at full speed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Fianna receive wages, but their hardships include keeping strangers, robbers
    from beyond the seas, and every bad thing from coming into Ireland.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Finn has five Druids, including Cainnelsciath of the Shining Shield, who brings
    down knowledge from the clouds and foretells battles.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:9
  text: Finn's household also includes physicians, poets, musicians, cup-bearers,
    door-keepers, horn-players, stewards, a huntsman, serving-men, and others.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:10
  text: Fifty sewing-women in a rath on Magh Feman make clothing for the Fianna throughout
    the year under the charge of a daughter of the King of Britain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: In the sewing-women's rath, three king's daughters make music on a small silver
    harp, and a large stone candlestick stands in the middle; fire is kindled no more
    than three times yearly to avoid smoke and ashes harming the needlework.
  category: object
  evidence_refs:
  - ev:5
- id: obs:12
  text: Cnu Deireoil, the Little Nut, comes to Finn from the Sidhe; he appears at
    Slieve-nam-ban as a small man about four feet high, with light yellow hair to
    his waist, playing flawless sweet music on a harp.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: Cnu Deireoil says he has come from the place of the Sidhe in Slieve-nam-ban
    to be in Finn's company for a while; Finn promises him rewards, riches, red gold,
    and friendship.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: The Fianna name him the Little Nut, like his speech and music, and some say
    he is a son of Lugh Lamh-Fada.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:15
  text: The five musicians of the Fianna are brought to Cnu Deireoil to learn the
    music of the Sidhe, which is said to be better than any music heard on earth.
  category: action
  evidence_refs:
  - ev:7
