canonical_text:
  quote: "“You left us worse than you found us.”"
  summary: 'The passage recounts the final waning of Finn, Oisin, Caoilte, and the
    Fianna: Caoilte laments old age and enters a hill of the Sidhe; he later appears
    as a luminous guide to a lost king. A remnant of the Fianna dies at Teamhair.
    Traditions about Finn say either that he died, never died, or sleeps with the
    Fianna in a hidden cave until the Dord Fiann is sounded three times and they rise
    again. The passage closes with sheep-minders reciting Fianna poems and seeing
    tall figures on hills who speak of the battle of Gabhra.'
  language: English
  quote_policy: quoted
