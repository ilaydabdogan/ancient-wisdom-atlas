canonical_text:
  quote: ''
  summary: Conan questions Finn about his origins and deeds, then asks about the Dord
    Fiann and Finn's favorite music. Finn answers with accounts of the Fianna's music
    and natural sounds. Conan agrees to give Finn his daughter and prepares a wedding
    feast. Finn dreams that the Tuatha de Danaan will quarrel with him and slaughter
    the Fianna. The Fianna seek Finn through Mac-an-Reith, who has true knowledge.
    At Almhuin, a hall division involving the King of Ireland's son is interpreted
    by two Men of Dea as an insult, and they report to Fionnbhar that Finn intends
    to take a woman promised to a Tuatha de Danaan man. Fionnbhar summons the Tuatha
    de Danaan. Finn goes toward Conan's feast with few of his people, fears an attack,
    and is reassured by Goll before being seated in Conan's hall.
  language: English
  quote_policy: summarized
