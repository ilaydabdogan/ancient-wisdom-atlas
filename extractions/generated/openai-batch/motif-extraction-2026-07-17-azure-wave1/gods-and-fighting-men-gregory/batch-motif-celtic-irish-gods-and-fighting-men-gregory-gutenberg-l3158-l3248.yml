canonical_text:
  quote: ''
  summary: 'The passage first describes the Dagda having a burial rath built around
    his son''s grave at the Hill of Aileac. It then recounts appearances and stories
    of Angus Og: his manifestation to King Cormac with a harp, birds, music, and prophecy;
    his bird-kisses and frightening effect on cattle; his and Midhir''s redirection
    of settlers by lending horses; the abduction of Enghi at a Samhain gathering;
    the transformation of Derbrenn''s fosterlings into swine and their later pursuit;
    and Angus bringing Caer Ormaith to Brugh na Boinn.'
  language: English
  quote_policy: summarized
