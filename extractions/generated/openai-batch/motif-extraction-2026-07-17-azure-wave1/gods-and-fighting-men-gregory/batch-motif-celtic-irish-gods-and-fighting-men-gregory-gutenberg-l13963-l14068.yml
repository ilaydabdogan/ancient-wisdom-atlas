canonical_text:
  quote: ''
  summary: The High King of Ireland turns against Finn and the Fianna, summons Osgar
    to Teamhair, and quarrels with him over an exchange of spears and tribute. On
    the way Osgar encounters a Sidhe woman washing blood-colored clothes at a river
    and receives a prophecy of his death and of the High King's death-wound. Finn
    and the High King meet in battle at Gabhra. Osgar kills many enemies, is mortally
    wounded by the High King, kills the High King in return, breaks the displayed
    royal helmet, and dies. The remaining Fianna search among their dead and mourn
    as a beaten race.
  language: English
  quote_policy: summarized
