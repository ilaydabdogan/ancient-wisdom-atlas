canonical_text:
  quote: ''
  summary: After the battle at Gabhra, Oisin finds Osgar mortally wounded with his
    weapons and blood around him. Caoilte and Finn mourn him; Osgar says the King
    of Ireland's spear of seven spells has left him beyond healing. Osgar dies, the
    Fianna lament him, graves are made for the dead, and Finn has no peace or pleasure
    afterward.
  language: English
