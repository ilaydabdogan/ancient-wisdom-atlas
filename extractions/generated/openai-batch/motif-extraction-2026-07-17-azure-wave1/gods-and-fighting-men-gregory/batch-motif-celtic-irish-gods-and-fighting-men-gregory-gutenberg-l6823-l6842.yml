  quote: ''
  summary: At Inis Caol, Finn and the Fianna enter an open house and sit on prepared
    seats, but an enchantment prevents them from rising. The Red-Haired Man appears
    and attacks them to avenge his mother and two brothers, who he says were killed
    by Glasan. Finn blows the Dord Fiann. Diarmuid hears it, enters, kills the Red-Haired
    Man, ends the enchantment, and Finn returns to Almhuin with nine surviving Fianna.
