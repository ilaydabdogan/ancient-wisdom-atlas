canonical_text:
  quote: ''
  summary: 'Aonghus and Aodh of the children of Morna come to Finn seeking peace and
    a place among the Fianna. Finn demands compensation for his father''s death: either
    a champion''s head, identified by Oisin as Diarmuid''s, or a fistful of berries
    from the quicken-tree at Dubhros. Oisin warns that both tasks are dangerous and
    recounts that the tree is guarded by the Surly One of Lochlann for the Tuatha
    de Danaan. The two brothers go to Dubhros and meet Diarmuid and Grania. Diarmuid
    explains the danger, gives them the choice of fighting him or asking the Surly
    One for berries, defeats and binds them in an unarmed fight, and then loosens
    them at their request after Grania demands a share of the berries.'
  language: English
  quote_policy: summarized
