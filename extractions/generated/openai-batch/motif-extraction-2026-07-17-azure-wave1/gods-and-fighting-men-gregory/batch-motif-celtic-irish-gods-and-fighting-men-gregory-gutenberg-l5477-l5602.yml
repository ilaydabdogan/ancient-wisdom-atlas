canonical_text:
  quote: ''
  summary: The children of Lir, in bird form, lament their hardship on the sea and
    remember their former royal life. After their appointed time in the Maoil, they
    move to Irrus Domnann, endure more misery, then return to an abandoned Sidhe Fionnachaidh.
    They later stay near Inis Gluaire, are loved by Aibric, and after the coming of
    Christianity hear Saint Mochaomhog's bell, which Fionnuala says will free them
    from pain and misery.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The children contrast their present feather-covered bodies, sand, bitter sea
    water, rocks, frost, and waves with former purple clothing, mead, cups, bird-feather
    beds, and royal company.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fionnuala says Fiachra and Conn have their bed under her wings on the sea,
    and Aodh has his place under the feathers of her breast.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Fionnuala remembers the teaching of Manannan, the talk of Bodb Dearg, and
    the voice and kisses of Angus as parts of a former life without grief.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Riders report the condition of the birds to Lir's house and to the chief men
    of the Tuatha de Danaan, who say they have no power over them but are glad they
    are still living.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Fionnuala says the time in the Maoil is over after three hundred years and
    that they must go to Irrus Domnann, where there will be no rest, standing ground,
    or shelter from storms.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Irrus Domnann the children lead a cold and miserable life; at one time
    the sea freezes around them so that they cannot move.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:7
  text: The brothers lament during the frozen hardship, and Fionnuala comforts them
    because she knows help will come in the end.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: When the children return to Sidhe Fionnachaidh, they find it empty, with green
    hillocks and nettles and without a house, fire, or hearthstone.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The children press close together, cry out three sorrowful cries, and Fionnuala
    laments the changed and empty ancestral place.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The children spend the night at their father’s and grandfather’s place, sing
    sweet music of the Sidhe, then go to Inis Gluaire, where birds of the country
    gather near them.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Aibric, a young man of good race, notices the birds, loves their singing,
    is loved by them, and tells their whole story in order.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: After the faith of Christ and blessed Patrick come into Ireland, Saint Mochaomhog
    comes to Inis Gluaire and the children hear his bell.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The brothers are frightened by the bell, but Fionnuala identifies it as Mochaomhog’s
    bell and says it will set them free from pain and misery.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The children listen to the bell until matins are done and then sing the low,
    sweet music of the Sidhe.
  category: action
  evidence_refs:
