canonical_text:
  quote: ''
  summary: In a great battle on the strand, the King of the World and his armies fight
    the remaining Fianna. Natural forces and animals give ominous responses to the
    slaughter. Finn directs Fergus to praise warriors and report who is strongest
    in battle. Conan fights to make amends for past harm, Duban and Duban Donn are
    praised for killing many enemies, and Osgar fights while surrounded. Caoilte is
    sent to help Osgar, but Osgar rejects the help as an encroachment on his own battle-share,
    after which Caoilte angrily returns against the foreigners and kills many.
  language: English
  quote_policy: summarized
