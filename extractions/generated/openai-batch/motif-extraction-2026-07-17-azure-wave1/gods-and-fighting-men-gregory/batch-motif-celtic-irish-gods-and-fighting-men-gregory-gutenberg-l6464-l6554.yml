canonical_text:
  quote: ''
  summary: Finn gives a long set of conduct instructions to Lugaidh's Son, who keeps
    the advice and becomes praised by poets. Aoife, daughter of the King of Lochlann
    and wife of Mal, hears this praise, falls in love with Lugaidh's Son, and crosses
    the sea with nine foster-sisters to find him in Ireland. Finn and the Fianna welcome
    her, and Finn gives her to Lugaidh's Son while warning of the war she brings.
    After a month and a year, Mal comes with armed battalions to avenge his wife;
    he kills many Fianna warriors but is finally slain by Lugaidh's Son. Aoife watches
    the battle from a hill and afterward belongs to Lugaidh's Son and bears him children.
  language: English
  quote_policy: summarized
