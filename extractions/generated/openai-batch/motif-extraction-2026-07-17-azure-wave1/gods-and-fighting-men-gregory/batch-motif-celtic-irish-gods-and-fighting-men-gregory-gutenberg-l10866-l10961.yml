canonical_text:
  quote: ''
  summary: While the Fianna are hunting in Munster, Finn sends Finnbane to keep watch.
    Finnbane sees an ugly, deformed Fomor man with weapons and a badly behaved horse.
    The stranger comes to Finn, says he seeks wages, names himself the Gilla Decair
    or Hard Servant, and claims horseman’s wages. After Finn allows him to release
    his horse among the Fianna’s horses, the horse attacks them. Conan halters the
    horse and, at Finn’s urging, tries to ride it, but the horse will not move until
    it carries weight equal to the big man.
  language: English
  quote_policy: summarized
