canonical_text:
  quote: ''
  summary: Etain is described, identified as daughter of Etar, King of the Riders
    of the Sidhe, and married to King Eochaid after bride-price is paid. At a Samhain-season
    feast, Eochaid's brother Ailell falls in love with Etain, becomes ill from concealed
    desire, and is diagnosed by Fachtna as suffering from jealousy or unfulfilled
    love. Eochaid charges Etain to care for Ailell while he travels. Etain questions
    Ailell, learns that she herself is the object of his desire, continues to tend
    him, and appoints a dawn meeting outside the dun; Ailell falls asleep at the appointed
    time and misses it.
  language: English
  quote_policy: summarized
