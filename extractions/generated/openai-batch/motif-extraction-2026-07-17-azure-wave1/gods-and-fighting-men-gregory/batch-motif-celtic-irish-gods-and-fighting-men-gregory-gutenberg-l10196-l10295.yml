canonical_text:
  quote: ''
  summary: Finn pursues a grey fawn to Slieve Cuilinn, where it vanishes. At a lake
    he meets a sorrowful beautiful woman who says she has lost a red-gold ring and
    binds him to retrieve it. After Finn returns the ring from the water, the woman
    vanishes and Finn becomes a withered grey old man. The Fianna find him, name the
    lake Loch Doghra, and learn that Miluchradh of the Sidhe enchanted him. They carry
    him to Cuilinn’s Sidhe hill, dig for three days and nights, and Cuilinn comes
    out with a red-gold vessel. Finn drinks from it and regains his form, though his
    hair remains grey.
  language: English
  quote_policy: summarized
