canonical_text:
  quote: ''
  summary: The preface contrasts a receding supernatural world with the Fianna's intimacy
    with divine beings. Cuchulain is described as a god's son still separated from
    the gods, while Finn is presented as their equal, entering their houses and meeting
    Bodb Dearg, Angus, and Manannan as friend or enemy. The Fianna are linked to the
    Tuatha de Danaan through wives, mothers, foster-mothers, and sweethearts. Finn's
    death is called doubtful, his return in another shape certain, and Oisin is said
    to become king over a divine country. Forest birds and beasts are described as
    transformed fighting men, enchanters, or fair women. The preface then characterizes
    Fianna stories as episodic, childlike, full of accumulated wonders, wandering
    landscapes, and dream-like heroic power.
  language: English
  quote_policy: summarized
