canonical_text:
  quote: ''
  summary: Diarmuid asks companions what he should do about bonds laid on him, and
    they advise him to follow Grania. He leaves the dun, meets Grania outside, warns
    her to return and says he will keep faith with Finn, but she refuses to part from
    him. They begin their flight, use horses, then abandon them because horses make
    tracking easier. They cross the Sionnan ford, move west to Connacht, and Diarmuid
    leaves unbroken bread as a sign to Finn that he has kept faith. They reach Doire-da-Bhoth,
    where Diarmuid builds a seven-doored twig fence and makes a bed for Grania in
    the wood.
  language: English
  quote_policy: summarized
