canonical_text:
  quote: ''
  summary: Finn and the Fianna face the foreign armies by sending out selected champions
    rather than fighting all at once. Cuban's son dies in mutual combat with the King
    of Greece and is succeeded by Follamain. Goll Garb defeats the forces of three
    eastern kings and receives the kings as captives. Oisin fights the King of France,
    who says he has come because Finn brought away his wife; the King of France flees
    to the Valley of Wild Men. Finn then expects a night attack, and Oisin volunteers
    to keep watch at the harbour.
  language: English
  quote_policy: summarized
