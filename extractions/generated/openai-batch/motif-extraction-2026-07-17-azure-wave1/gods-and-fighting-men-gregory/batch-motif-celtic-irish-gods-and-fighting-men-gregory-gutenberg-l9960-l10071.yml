canonical_text:
  quote: ''
  summary: Finn receives gifts after games at Aonach Clochair, pays for hospitality
    at Cacher's house, and rides with Caoilte and Oisin to an unknown valley house.
    Inside, monstrous inhabitants offer harsh music and raw horse flesh, then attack
    the three through the night. At sunrise the house vanishes and the adversaries
    are identified as three Shapes avenging Cuillen, whose son Fear Og died after
    envy from the Fianna. The passage ends by listing Finn's killings of serpents,
    Shadow-Shapes, and a cat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: At Aonach Clochair, horses of the Fianna and of the men of Munster run races,
    and Fiachu gives Finn a black horse, a chariot, a spear with a deadly spell, silver
    weapons, and three hounds with decorated collars and chains.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Finn thanks Fiachu, stays three days feasting at Cacher's house, and gives
    Cacher fifty rings, fifty horses, and fifty cows as the price of the feast and
    ale.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Finn tests the black horse on the strand, and Caoilte and Oisin race after
    him across named places until the group reaches the hill of Bairnech.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At night, Finn sees a house with fire shining from it in a valley where he
    says he never knew a house to be.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: When Finn, Caoilte, and Oisin come to the house, they hear screams and crying;
