  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Inside the house are a fire made smoky with elder-wood logs, a hag with three
    heads on one neck, a headless man with one eye in his breast, and nine bodies
    and nine heads that rise and screech.
  category: setting
  evidence_refs:
  - ev:6
