candidate_motifs:
- id: motif:1
  label: Reciprocal gift and feast exchange
  taxonomy_refs: []
  basis: Fiachu gives Finn prestige gifts after the races, and Finn later pays Cacher
    for three days of feasting with rings, horses, and cows.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents the exchange literally; no specifically sacred status
    is stated.
- id: motif:2
  label: Unfamiliar night house as perilous lodging
  taxonomy_refs: []
  basis: At night the heroes find a house Finn did not know, enter after hearing screams,
    and become trapped inside by the grey man.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not explicitly call the house an otherworld dwelling;
    it later vanishes.
- id: motif:3
  label: Monstrous household with dismembered or multiple-bodied figures
  taxonomy_refs: []
  basis: The house contains a three-headed hag, a headless man with one eye in his
    breast, and separate bodies and heads that rise and screech.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The figures are described by bodily features, but their exact nature is
    not explained until the later identification of three Shapes.
- id: motif:4
  label: Hostile hospitality and refusal of raw meat
  taxonomy_refs: []
  basis: The grey man prepares horse flesh that remains raw; Finn refuses to eat it,
    and the host threatens and attacks the heroes.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage does not state that eating the meat would have had ritual
    or magical consequences.
- id: motif:5
  label: Night battle with phantoms ending in vanishing house
  taxonomy_refs: []
  basis: The heroes fight the household through the night; at sunrise they collapse
    under a mist and later find the house and inhabitants gone.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The word phantoms is in the chapter title, while the narrative identifies
    the main adversaries as Shapes.
- id: motif:6
  label: Supernatural kin vengeance
  taxonomy_refs: []
  basis: The three fighters are identified as Shapes who came from the Valley of the
    Yew Tree to avenge their sister Cuillen.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage does not say precisely how Finn, Caoilte, or Oisin were responsible
    for Cuillen's death, only that the Shapes came to avenge her.
- id: motif:7
  label: Envy or hostile gaze causing wasting death
  taxonomy_refs: []
  basis: Fear Og surpasses the Fianna in games and hunting, then a heavy sickness
    falls on him through the eyes and envy of the Fianna, leaving him dead after nine
    days.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The mechanism is reported by the narrative but not elaborated as a formal
    charm or curse.
- id: motif:8
  label: Mother dies grieving at son's grave
  taxonomy_refs: []
  basis: Cuillen keens at Fear Og's grave every day for a year, dies there of grief,
    and is buried in the same green hill.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: No divine or resurrection element is stated.
- id: motif:9
  label: Hero as slayer of serpents and shadow beings
  taxonomy_refs: []
  basis: The closing lines say Finn feared no earthly thing and killed many great
    serpents, Shadow-Shapes, and other beings at several named locations.
  evidence_refs:
