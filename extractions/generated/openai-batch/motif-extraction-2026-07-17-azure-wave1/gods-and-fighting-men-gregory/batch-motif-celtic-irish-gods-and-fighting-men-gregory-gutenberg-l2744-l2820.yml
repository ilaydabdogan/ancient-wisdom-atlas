canonical_text:
  quote: ''
  summary: The Sons of the Gael withdraw to their ships at Amergin’s instruction.
    The Men of Dea raise an enchanted wind that scatters the ships and causes several
    deaths, including Donn, Ir, Colpa, and Arranan. Amergin answers the storm with
    words and enchantment, asking that the Gael reach and possess Ireland. The wind
    falls, the survivors land at Inver Sceine, and Amergin is the first to set foot
    on Ireland, where he recites a poem of identification with natural, martial, and
    knowledge-bearing forms.
  language: English
  quote_policy: summarized
