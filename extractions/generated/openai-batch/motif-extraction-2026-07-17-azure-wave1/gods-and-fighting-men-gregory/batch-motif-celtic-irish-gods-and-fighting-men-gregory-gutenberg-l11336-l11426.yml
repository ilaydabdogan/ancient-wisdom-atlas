canonical_text:
  quote: ''
  summary: Finn, widowed and seeking a wife, is advised to ask for Grania, daughter
    of the High King of Ireland. Oisin and Diorraing go as emissaries to Teamhair,
    where the king directs them to obtain Grania's own answer. Grania gives a conditional
    acceptance, and arrangements are made for Finn to come. Finn arrives with the
    Fianna; Grania sees that he is grey-haired and older than her father, prefers
    Oisin as more fitting, and has no liking for Finn. Finn and Grania exchange riddling
    questions and answers before the wedding feast is arranged in the king's feasting-house.
  language: English
  quote_policy: summarized
