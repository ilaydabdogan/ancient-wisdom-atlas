canonical_text:
  quote: ''
  summary: Finn and his men are welcomed by the King of the Hill after a hunt. At
    the Red Woman's request, the king reveals a wonderful beast from behind a door
    opened by striking a golden chair. The beast speaks, flees, and is hunted until
    Bran brings it down; when dead it appears as a tall man, whom the Red Woman identifies
    as the King of the Firbolgs. She foretells future troubles, offers to bring Finn
    to the Country of the Young, and is refused. She then rouses a deer, later releases
    her own small white hound to kill it, and disappears; Finn leaves the deer because
    he recognizes enchantment on it.
  language: English
  quote_policy: summarized
