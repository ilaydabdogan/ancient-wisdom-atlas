canonical_text:
  quote: ''
  summary: Finn's aunt Tuiren is married to Iollan under a pledge of safe return.
    Iollan's jealous Sidhe sweetheart Uchtdealb disguises herself, lures Tuiren away,
    and changes her into a hound with a dark Druid rod. The hound is placed with Fergus
    Fionnliath, becomes valued for hunting, and gives birth to two whelps. After Finn
    demands fulfilment of the pledge, Iollan obtains Uchtdealb's help; she restores
    Tuiren to human form and gives her back to Finn. The two whelps remain with Finn
    and are named Bran and Sceolan.
  language: English
  quote_policy: summarized
