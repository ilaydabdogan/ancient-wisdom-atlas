canonical_text:
  quote: ''
  summary: Oisin, staying in Patrick's house, defends an apparently extravagant claim
    about the size of food in former times. He selects and raises a pup, retrieves
    old Fianna objects hidden under a rock, uses a horn to summon giant birds, and
    proves his claim by producing part of a giant bird along with a huge rowan berry
    and ivy leaf found inside it. Later, when blind, he is misled by servants about
    the weather but discovers the deception when he goes out to inspect the cattle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Oisin says he is not receiving enough food or drink and describes himself
    as under a yoke drawing stones; Patrick says he receives a daily quarter of beef,
    churn of butter, and griddle of bread, and Oisin answers that he has seen larger
    equivalents from a blackbird, rowan berry, and ivy leaf.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Patrick is vexed and tells Oisin he has lied.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Oisin orders a serving-boy to nail a fresh bullock hide to the wall and throw
    pups against it; only the last pup clings to the hide, and Oisin orders that pup
    reared and the rest drowned.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Oisin orders the chosen pup to be kept in a dark place, well cared for, and
    never allowed to taste blood or see daylight; after a year he names it Bran Og.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Oisin, the serving-boy, and the chained pup travel past Slieve-nam-ban, where
    witches of the Sidhe are said to spin with spinning-wheels, and then turn east
    into Gleann-na-Smol.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
  text: 'Oisin raises a rock and has the lad take out three objects from beneath it:
    a great sounding horn of the Fianna, an iron throwing ball, and a very sharp sword.'
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The boy sounds the horn twice without seeing anything; Oisin then blows three
    great blasts, after which the boy sees three clouds settling in the valley as
    flights of increasingly large and black birds.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The dog shows protruding eyes and raised hair, is released, attacks the largest
    bird, kills it after a fierce fight, and laps its blood.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After lapping the bird's blood, madness comes on the dog; it rushes back at
    Oisin and the boy, and Oisin kills it by casting the iron ball into its mouth
    and throat.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: At Oisin's direction, the lad cuts a quarter from the dead bird and opens
    its body, finding a very large rowan berry and an ivy leaf larger than the biggest
    griddle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Oisin returns to Patrick and shows the bird quarter, rowan berry, and leaf;
    Patrick acknowledges that Oisin did not lie.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: When Oisin has lost his sight, he nightly carries a serving-man on his shoulders
    to inspect the cattle; the servants agree to give him reports of bad weather so
    they will not have to go.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: A serving-girl urges Oisin to go out to the white-headed cows, while a serving-man
    brings a vessel of water and a birch broom and splashes water in Oisin's face
    to imitate rain.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: At the cattle pen Oisin finds the night quiet and afterwards asks the servants
    no more news of the weather.
  category: sequence
  evidence_refs:
  - ev:10
