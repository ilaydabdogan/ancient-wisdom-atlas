canonical_text:
  quote: ''
  summary: The children of Lir, transformed into swans, are scattered by a storm on
    Sruth na Maoile. Fionnuala laments the loss of her brothers, then receives Conn,
    Fiachra, and Aodh back and shelters them under her feathers. The swans endure
    cold, snow, wind, freezing to a rock, injury, salt water in their sores, and enforced
    return to Sruth na Maoile each night. Later, near the mouth of the Banna, they
    meet riders of the Sidhe, including two sons of Bodb Dearg, who have been seeking
    them and bring news of Lir, Bodb Dearg, and the Men of Dea.
  language: English
  quote_policy: summarized
