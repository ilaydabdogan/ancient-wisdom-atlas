canonical_text:
  quote: ''
  summary: Midhir's three daughters are given in marriage, and Bodb Dearg and other
    Tuatha de Danaan figures specify or offer marriage portions and gifts, including
    gold, clothing, magical drink vessels, weapons, a fortified town, an inexhaustible
    cook, and a powerful musician. The recipients later live richly in their dun and
    return to the Tuatha de Danaan when their lifetime ends. A later episode tells
    of Scathniamh, Bodb Dearg's daughter, coming from the cave of Cruachan to the
    aged Caoilte to claim her promised bride-price, and Caoilte explaining the contrast
    between his mortal aging and her deathless Tuatha nature.
  language: English
  quote_policy: summarized
