canonical_text:
  quote: ''
  summary: Lugh of the Long Hand returns with Sidhe riders, foster-brothers, and Manannan's
    horse, armor, helmet, and sword. He finds the Tuatha de Danaan under Fomor tax
    oppression, kills most of the Fomor messengers, and spares nine to report back.
    In Lochlann, Ceithlenn identifies him as the foretold descendant whose arrival
    ends Fomor power in Ireland. Bres and Elathan seek Fomor aid; Bres prepares an
    invasion, and Balor commands the destruction or removal of Ireland. The Fomor
    fleet sails to Ireland and devastates West Connacht.
  language: English
  quote_policy: summarized
