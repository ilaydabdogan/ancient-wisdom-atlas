canonical_text:
  quote: ''
  summary: Grania summons her four sons, tells them Finn killed their father Diarmuid
    against a peace agreement, gives them Diarmuid's weapons and armour, and sends
    them to learn fighting so they may avenge him. The sons depart, while Donnchadh
    advises their people to remain in place. Finn later visits Grania secretly, persists
    despite her rejection, and brings her to his will. Finn and Grania appear before
    the Fianna like husband and wife and are mocked; explanations are given that Grania
    changed like running water or that Finn enchanted her. After seven years of martial
    training abroad, Diarmuid's sons return, learn Grania has gone with Finn, attack
    Almhuin, and slaughter opposing troops. Grania eventually makes peace between
    them and Finn; they gain their father's place among the Fianna but later die at
    Gabhra, while Finn and Grania remain together.
  language: English
  quote_policy: summarized
