canonical_text:
  quote: ''
  summary: The passage tells of Bri and Leith being prevented from meeting, Bri's
    death and the naming of Bri Leith; then of Midhir's wife Etain, Fuamach's jealousy,
    Etain's magical transformation into a fly, her seven-year wandering, swallowing
    by Etar's wife and rebirth as Etar's daughter, followed by Midhir's disguised
    prophetic appearance and Eochaid's first sight of the grown Etain at a well.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Midhir takes a hill; Fuamach and Bri are with him there.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Leith loves Bri and comes with young men toward her, but opposing slingers
    prevent the groups from coming nearer; Cochlan receives a wound and dies.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: Bri turns back to Midhir's hill, dies of heartbreak, and Leith says he will
    leave his name with her; the hill is called Bri Leith afterward.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Midhir takes Etain as wife; Fuamach becomes jealous and calls the Druid Bresal
    Etarlaim to put spells on Etain so that Fuamach can drive her away.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Angus Og keeps Etain after she is driven out, refuses to give her back to
    Midhir, and makes for her a sunny house with flowers and invisible walls wherever
    they rest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Fuamach arranges for Midhir and Angus to be away, finds Etain in the sunny
    house, turns her into a fly by Druid spells, and sends a blast of wind that sweeps
    her through the window.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Angus returns, finds the sunny house empty, searches for Fuamach, finds her
    with Etarlaim the Druid, and strikes off her head.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Etain is blown through Ireland for seven years, falls from a roof beam into
    a golden cup at Etar's feast, is drunk down with wine by Etar's wife, and after
    nine months is born again as Etar's daughter.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The reborn Etain has the same name as before and is reared as a king's daughter
    with fifty daughters of princes as companions.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:10
  text: While Etain and the young girls are bathing, a richly dressed mounted man
    approaches, speaks about Etain's present and past and future battles for her sake,
    then vanishes; the narrator identifies him as Midhir.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: When Etain is grown, Eochaid Feidlech, High King of Ireland, sees her by a
    well with ornate comb, basin, clothing, jewelry, and bright hair.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
