canonical_text:
  quote: ''
  summary: Finn keeps the boy near him because he seems to resemble Sadbh and may
    be her son. After learning the Fianna's speech, the boy recalls living with a
    beloved deer mother in an enclosed landscape of hills, valleys, streams, and woods.
    A dark man repeatedly visits the deer, speaking gently or angrily; she fears him.
    On the final visit he strikes her with a hazel rod, forcing her to follow him
    while she looks back and cries for the child. The child cannot move after her,
    loses consciousness, wakes on a hillside where hounds find him, and later cannot
    find the place where he was raised. The Fianna name him Oisin, and he later becomes
    their poet and fighter.
  language: English
  quote_policy: summarized
