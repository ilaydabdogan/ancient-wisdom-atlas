canonical_text:
  quote: ''
  summary: Diarmuid and Osgar reach Angus and Grania at Brugh na Boinne. Grania and
    Diarmuid later stay in a sea cave, where Ciach, a Fomor man, arrives during a
    storm, plays chess with Diarmuid, and claims Grania as his winnings. Grania wounds
    Diarmuid with a knife when he moves to kill Ciach; Diarmuid kills Ciach and flees.
    Grania follows, asks forgiveness, and Diarmuid reproaches her for causing his
    exile and losses. At another cave with running water, Grania discovers the knife
    still in Diarmuid’s thigh and removes it. The next day Diarmuid leaves broken
    bread instead of the unbroken bread that had served as a sign to Finn of kept
    faith.
  language: English
  quote_policy: summarized
