  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Finn and his companions enter the lighted house with their shields and arms,
    are seated on a shining seat, and receive food and old drink.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The tall man identifies himself as Donn son of Midhir and says the armed men
    are sons of Midhir of the Yellow Hair and Fionnchaem, daughter of the King of
    the Sidhe of Monaid.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Donn says Bodb Dearg became king among the Tuatha de Danaan, demanded hostages,
    and that Donn and his brothers left after a threat against their father's dwelling-place,
    eventually finding a secret hidden place.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Donn says the Men of Dea come three times every year to battle them on the
    green outside, and that Donn's household has been worn down to the remaining brothers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Donn says he killed Diangalach, an enchanter of the Men of Dea, whose long
    new grave is outside.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Donn says his side took jewels, riches, treasures, horns, vessels, cups of
