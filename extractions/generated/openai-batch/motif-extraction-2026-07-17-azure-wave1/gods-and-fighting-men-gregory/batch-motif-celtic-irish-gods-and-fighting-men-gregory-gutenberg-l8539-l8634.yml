canonical_text:
  quote: ''
  summary: While hunting, Finn and six companions follow a beautiful fawn to Slieve-nam-Ban,
    where it vanishes into the earth. In a snowstorm Caoilte finds a lighted Sidhe
    house and brings Finn there. They are hosted by Donn son of Midhir, who explains
    that he and his brothers are exiled sons of Midhir, reduced by recurring battles
    with the Men of Dea. Donn reveals that the fawn was an unnamed girl sent in animal
    form to draw Finn to them before an expected attack. The next morning Donn shows
    Finn the battlefield, graves, and boundary where the Men of Dea come to fight.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Fianna hunt at Toraig, rouse a wild and beautiful fawn, and Finn with
    six men follows it through the country to Slieve-nam-Ban, where it puts down its
    head and vanishes into the earth.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A heavy snow falls, bends the tops of trees, and weakens the courage and strength
    of the Fianna; Finn asks Caoilte to find shelter.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Caoilte sees a light-filled house containing cups, horns, and bowls, recognizes
    it as a house of the Sidhe, enters, and sits on a shining chair.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Inside the house are armed men with women beside them, six yellow-haired young
    girls, and another young girl in the middle with a harp, playing and singing while
    the company makes mirth.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: A young woman addresses Caoilte and offers attendance; Caoilte says Finn is
