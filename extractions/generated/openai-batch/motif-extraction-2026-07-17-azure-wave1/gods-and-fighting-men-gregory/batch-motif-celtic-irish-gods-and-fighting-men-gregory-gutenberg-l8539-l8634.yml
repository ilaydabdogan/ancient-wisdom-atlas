candidate_motifs:
- id: motif:1
  label: Shapeshifting animal lure to a hidden otherworld dwelling
  taxonomy_refs:
  - shapeshifter
  - mystical_quest
  basis: The fawn first leads Finn through the country to Slieve-nam-Ban and vanishes
    into the earth; Donn later says the fawn was a girl sent in that form so Finn
    would follow her to the hidden place.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: The passage explicitly supports shapeshifting and luring, but does not
    state the girl's name or wider origin.
- id: motif:2
  label: Otherworld hospitality after wilderness hardship
  taxonomy_refs:
  - sacred_exchange
  basis: After the snowstorm, Finn and his companions are brought into a lighted Sidhe
    house, seated on a shining seat, and given food and drink before an exchange of
    information.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: Hospitality is explicit; the taxonomy link to sacred exchange is interpretive
    because no formal bargain is made in this passage.
- id: motif:3
  label: Exiled supernatural kin after refusal of hostages
  taxonomy_refs:
  - departure
  - royal_legitimacy
  basis: Donn says Bodb Dearg was granted kingship, demanded hostages, and Donn's
    brothers left after a threat against their father's dwelling-place, then found
    a secret hidden place.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage gives the political dispute and exile, but does not frame
    it as a full foundation or legitimacy myth beyond this episode.
- id: motif:4
  label: Recurring yearly battle at a marked boundary
  taxonomy_refs:
  - seasonal_cycle
  basis: Donn says the Men of Dea come three times every year to battle on the green
    outside, and the morning scene identifies graves, flag-stones, and the point where
    they come to meet Donn's side.
  evidence_refs:
  - ev:7
  - ev:10
  confidence: medium
  cautions: The passage states annual recurrence but does not connect the battles
    to named seasons or ritual calendrical observances.
- id: motif:5
  label: Taking of otherworld treasures and a harper
  taxonomy_refs:
  - sacred_theft
  basis: Donn says his side took jewels, riches, treasures, horns, vessels, cups of
    pale gold, and Fethnaid the woman-harper from the Tuatha de Danaan.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The taking is described as a major loss to the Tuatha de Danaan; the passage
    does not explicitly call it theft or sacrilege.
- id: motif:6
  label: Human champions drawn to aid endangered Sidhe household
  taxonomy_refs:
  - mystical_quest
  basis: Donn says only he and his brothers remain, that they are in danger from an
    attack, and that they sent the fawn-shaped girl so Finn would come to them.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage sets up the need for aid but ends before the battle outcome
    or Finn's decision is shown.
