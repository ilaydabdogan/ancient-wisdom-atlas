canonical_text:
  quote: ''
  summary: The passage tells of Cian, Goibniu, and Samthainn at the Ridge of the Fire;
    Balor steals Cian's unfailing-milk cow by taking the appearance of a red-haired
    boy; Cian seeks Druidic help and, with Birog of the Mountain, reaches Ethlinn
    in her tower. Ethlinn bears a son, Balor orders the child drowned, but Birog rescues
    him and he is fostered by Taillte as Lugh. The passage then notes a variant about
    Cian's death, describes Lugh and other leaders planning secretly against the Fomor,
    and ends with Nuada's assembly seeing a radiant young commander approaching with
    an armed troop.
  language: English
  quote_policy: summarized
