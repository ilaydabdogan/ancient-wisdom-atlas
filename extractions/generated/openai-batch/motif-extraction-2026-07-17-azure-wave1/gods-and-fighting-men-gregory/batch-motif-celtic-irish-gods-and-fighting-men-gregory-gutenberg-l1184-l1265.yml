- id: ev:1
  type: summary
  locator: 1184-1190
  quote_or_summary: At Druim na Teine, the Ridge of the Fire, Goibniu, Samthainn,
    and Cian live together; Cian is a land-lord, Goibniu a famed smith, and Cian owns
    the Glas Gaibhnenn, a cow whose milk never fails and who is coveted and guarded.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain; source metadata rights_status=public_domain.
- id: ev:2
  type: summary
  locator: 1191-1197
  quote_or_summary: Cian brings the Glas Gaibhnenn to Goibniu's forge and asks Samthainn
    to hold the cow's halter while he speaks with Goibniu.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain; source metadata rights_status=public_domain.
- id: ev:3
  type: summary
  locator: 1198-1210
  quote_or_summary: Balor, who has long wanted the cow, takes the appearance of a
    little red-haired boy, deceives Samthainn with a claim about his brothers' plans
    for the steel, receives the halter, and drags the cow across the sea to his island.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain; source metadata rights_status=public_domain.
- id: ev:4
  type: summary
  locator: 1211-1217
  quote_or_summary: Cian sees Balor and the cow at sea, reproaches Samthainn, then
    consults a Druid, who says the cow will not be brought back while Balor lives
    because no one will go within reach of his Evil Eye.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain; source metadata rights_status=public_domain.
- id: ev:5
  type: summary
  locator: 1218-1227
  quote_or_summary: Birog of the Mountain dresses Cian in woman's clothes, carries
    him over the sea in a blast of wind to Ethlinn's tower, gains shelter, enchants
    the tower women into sleep, and allows Cian and Ethlinn to meet; Ethlinn says
    his face appeared in her dreams.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain; source metadata rights_status=public_domain.
- id: ev:6
  type: summary
  locator: 1228-1238
  quote_or_summary: Ethlinn gives birth to a son; Balor orders him wrapped and thrown
    into a sea current; the pin drops out, the child slips into the water and is thought
    drowned, but Birog brings him to Cian, who gives him to Taillte for fostering;
    the passage identifies him as Lugh.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain; source metadata rights_status=public_domain.
- id: ev:7
  type: summary
  locator: 1239-1242
  quote_or_summary: A variant says Balor struck off Cian's head on a white stone with
    blood marks, but the narration says it was likely another man because Cian died
    by the sons of Tuireann.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain; source metadata rights_status=public_domain.
- id: ev:8
  type: summary
  locator: 1243-1252
  quote_or_summary: After coming to Teamhair, Lugh decides to join his father's people
    against the Fomor and secretly plans for a full year at Grellach Dollaid with
    Nuada, the Dagda, Ogma, Goibniu, and Diancecht; the place is later named the Whisper
    of the Men of Dea.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain; source metadata rights_status=public_domain.
- id: ev:9
  type: summary
  locator: 1253-1256
  quote_or_summary: The council breaks up, agreeing to meet again after three years;
    Lugh returns to his friends, the sons of Manannan.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain; source metadata rights_status=public_domain.
- id: ev:10
  type: summary
  locator: 1257-1265
  quote_or_summary: Nuada holds an assembly on the Hill of Uisnech; an armed troop
    comes from the east, led by a young man whose face is bright like the setting
    sun so that people cannot look at him.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain; source metadata rights_status=public_domain.
