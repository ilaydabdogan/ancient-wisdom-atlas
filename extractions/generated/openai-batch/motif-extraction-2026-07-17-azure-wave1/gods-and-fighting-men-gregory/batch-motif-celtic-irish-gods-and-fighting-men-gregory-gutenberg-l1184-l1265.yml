candidate_motifs:
- id: motif:1
  label: Coveted unfailing cow stolen by deception
  taxonomy_refs:
  - sacred_theft
  basis: The cow's milk never fails, many covet her, and Balor obtains her by deception
    and carries her away across the sea.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The passage calls the cow wonderful and unfailing but does not explicitly
    call her sacred.
- id: motif:2
  label: Assumed child appearance used for theft
  taxonomy_refs:
  - shapeshifter
  - trickster_boundary
  basis: Balor takes the appearance of a little red-haired boy, uses false speech
    to make Samthainn leave, and thereby gains the cow's halter.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage describes an assumed appearance, not a detailed transformation
    sequence.
- id: motif:3
  label: Dangerous eye that prevents approach
  taxonomy_refs: []
  basis: The Druid says no one would go within reach of Balor's Evil Eye, making recovery
    of the cow impossible while Balor lives.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not describe the Evil Eye's exact effect beyond deterring
    approach.
- id: motif:4
  label: Magical helper enables disguised access to a tower
  taxonomy_refs:
  - trickster_boundary
  basis: Birog disguises Cian, transports him across the sea by wind, gains entry
    to the tower, and puts its women to sleep by enchantment.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The episode is clearly a boundary-crossing by disguise and enchantment,
    but the passage does not name it as a formal initiation or quest.
- id: motif:5
  label: Dream-recognized lover and special birth
  taxonomy_refs:
  - sacred_birth
  - miraculous_child
  basis: Ethlinn recognizes Cian as the face from her dreams, gives him her love,
    and later bears the son identified as Lugh.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The passage gives dream recognition and Lugh's birth, but no explicit
    prophecy in this excerpt.
- id: motif:6
  label: Exposed child survives attempted drowning and is fostered
  taxonomy_refs:
  - miraculous_child
  basis: Balor orders the newborn cast into a sea current; the child is thought drowned
    but is rescued by Birog and fostered by Taillte as Lugh.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents rescue from exposure, not resurrection.
- id: motif:7
  label: Secret council before uprising
  taxonomy_refs: []
  basis: Lugh and other named leaders spend a year in secret planning so the Fomor
