canonical_text:
  quote: ''
  summary: Finn and the Fianna find Diarmuid dying. Diarmuid asks Finn for healing
    water from Finn's palms, citing Finn's gift of knowledge and healing and reminding
    him of past services. Finn refuses or delays because of Grania, twice letting
    the water slip from his hands. Osgar threatens Finn into bringing the water a
    third time, but Diarmuid dies as it reaches him. The Fianna keen, Finn departs
    fearing Angus and the Tuatha de Danaan, and four companions cover Diarmuid with
    cloaks.
  language: English
  quote_policy: summarized
