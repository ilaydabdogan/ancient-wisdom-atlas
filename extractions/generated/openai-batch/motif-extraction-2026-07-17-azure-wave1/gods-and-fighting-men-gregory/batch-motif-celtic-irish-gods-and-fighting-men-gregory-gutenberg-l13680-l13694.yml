  quote: ''
  summary: The Grey Man returns from looking for a cup and strikes at Conan with a
    sword. Conan calls on Osgar, who attacks and kills the Grey Man. Ailne sees this
    and dies from grief and dread. The Fianna feast on discovered food and drink,
    but in the morning the dun has vanished and they are lying on bare grass. Conan's
    sheepskin remains with him, and its wool grows again each year.
