canonical_text:
  quote: ''
  summary: Cormac, king of Teamhair, receives a magical branch from an armed stranger
    from Manannan's country in exchange for three future gifts. The stranger later
    takes Cormac's daughter, son, and wife. When Cormac pursues, a mist leaves him
    alone in an otherworldly plain where he sees bronze-walled duns, Sidhe riders,
    repeated and self-renewing actions, a shining well with streams, hazels and salmon,
    supernatural hosts, and regenerating pigs prepared for a feast.
  language: English
  quote_policy: summarized
