canonical_text:
  quote: ''
  summary: A recurring stranger visits several Irish hosts under different names.
    He first claims learning and musical skill, briefly fails, then reads and plays
    beautifully after being mocked, and vanishes on Cnoc Aine. Later, as the Gilla
    Decair, he helps O'Conchubar and the Connacht men in a cattle raid and holds off
    Munster attackers with a bow and twenty-four arrows, but leaves when not honored
    with the first drink. He then appears to Tadg O'Cealaigh as a trick performer,
    performs rush and ear tricks, heals an injured imitator, and sends a hare, dog,
    boy, and young woman up a silk thread fastened to a cloud.
  language: English
  quote_policy: summarized
