canonical_text:
  quote: ''
  summary: Grania arranges a long feast for the High King, Finn, and the Fianna in
    hope of gaining their affection. On the last night, Diarmuid hears a hound-voice
    three times and, despite Grania's warnings and advice to take stronger weapons,
    goes out with lesser weapons and a hound. On Beinn Gulbain he meets Finn, who
    warns him about the earless Green Boar and says Angus had put bonds on Diarmuid
    not to hunt pigs. Diarmuid stays, fights the boar, is fatally ripped open, and
    kills the boar with his broken sword-hilt; the place is named from that hilt.
  language: English
  quote_policy: summarized
