    and repent.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Oisin disputes Patrick's claim, defends Finn and the Fianna as generous, truthful,
    and strong in battle, and says Finn would go to any place better than God's Heaven
    if such a place existed.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Oisin contrasts church singing, bells, croziers, and clerks with his former
    place in battles, then calls on Conan, Osgar, Diarmuid, Caoilte, and other companions
    to come to him or free him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Patrick says his King made the heavens, gives blossom to the trees, and made
    the moon, sun, fields, and grass.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Oisin says his own king delighted in overthrowing fighting men, defending
    countries, spreading his name, courting, playing, hunting, bearing a banner in
