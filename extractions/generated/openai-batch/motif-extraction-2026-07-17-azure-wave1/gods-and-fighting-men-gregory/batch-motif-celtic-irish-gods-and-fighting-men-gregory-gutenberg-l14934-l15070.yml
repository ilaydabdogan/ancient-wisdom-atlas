canonical_text:
  quote: ''
  summary: Patrick urges Oisin to stop speaking against priests, repent, accept God,
    and desire Heaven. Oisin rejects Patrick's claims, says Heaven would be worthless
    without Finn and the Fianna, praises the generosity, truth, and battle-prowess
    of his companions, invokes absent heroes, and questions why God did not intervene
    in former conflicts. Patrick answers by describing God as maker of the heavens,
    trees, moon, sun, fields, and grass, and by warning that Finn and the Fianna are
    in a painful afterlife unless Oisin repents.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Patrick tells Oisin to stop speaking against priests who tell the word of
    God and warns him of great pain at the end if he continues.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Oisin says that, when he and the leader of the Fianna were searching for a
    boar in a valley, not seeing it was worse to him than the clerks being without
    heads.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Patrick says Oisin is without sense and blind, and says that if Oisin had
    inward sight he would desire Heaven.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Oisin says Heaven would be of little value to him without Caoilte, Osgar,
    and his father, and he prefers images of hunting and wild animals to the delights
    Patrick promises.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Patrick compares Oisin's people to smoke, a stream, and a whirling wind; Oisin
    answers by recalling armed companions and preferring them to clerics with croziers.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Patrick says Oisin will leave the Fianna and receive the God of the stars;
    Oisin rejects the idea that he would part from the generous Fianna.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Patrick says the people of God have plentiful feasts, that Finn and the Fianna
