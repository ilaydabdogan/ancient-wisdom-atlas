  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The hurling match lasts three days and three nights without either side winning
    a goal; the watching Tuatha de Danaan decide to go away without finishing the
    game.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The Men of Dea brought crimson nuts, apples, and sweet-smelling rowan berries
    from the Land of Promise; one berry falls in Ui Fiachrach by the Muaidh and grows
    into a tree.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The tree's berries keep sickness and disease away from anyone who eats them,
    give the liveliness of wine and satisfaction of mead, make a hundred-year-old
    person young again, and make a young girl a flower of beauty.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Messengers of the Tuatha de Danaan hear birds and bees, find the Druid tree,
    and report it to the chief men, who recognize that it must have grown from a berry
    of the Land of the Ever-Living Ones.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Tuatha de Danaan determine that a young musician had dropped the berry
    and send him to seek a man of Lochlann to guard the tree by day and sleep in it
    by night.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The women of the Sidhe are downhearted at the musician's departure because
