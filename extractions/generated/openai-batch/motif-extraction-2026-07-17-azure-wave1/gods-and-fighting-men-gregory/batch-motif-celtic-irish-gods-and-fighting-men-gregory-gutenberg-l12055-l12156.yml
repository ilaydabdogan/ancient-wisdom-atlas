canonical_text:
  quote: ''
  summary: Diarmuid, Grania, and Muadhan travel until Muadhan leaves them; Diarmuid
    and Grania continue to the wood of Dubhros. The passage explains that a wonderful
    quicken-tree grew there from a rowan berry brought by the Tuatha de Danaan from
    the Land of Promise after a hurling match with the Fianna. Its berries prevent
    sickness, give exhilaration and satisfaction, restore old people to youth, and
    make young girls beautiful. The Tuatha de Danaan send the musician who dropped
    the berry to find a guardian; he recruits Searbhan Lochlannach, a one-eyed strong
    man with an iron collar and club. Searbhan guards the tree and forbids access
    to its berries. Diarmuid makes an agreement with him to hunt in the wood without
    touching the berries and builds a cabin for himself and Grania.
  language: English
  quote_policy: summarized
