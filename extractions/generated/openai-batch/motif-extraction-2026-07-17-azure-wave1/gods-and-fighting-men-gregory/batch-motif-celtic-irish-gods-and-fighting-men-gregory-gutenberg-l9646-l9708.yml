canonical_text:
  quote: ''
  summary: Fionnbhar and the Tuatha de Danaan hide themselves in Druid mist and approach
    Conan's house in armed battalions. Ethne, a woman-Druid, lures Finn outside by
    invoking binding heroic bonds, while fiery-beaked blackbirds attack the people
    in the house. Ethne challenges Finn to a race, but Caoilte follows and cuts her
    in two. Finn and Caoilte return and are attacked by the Tuatha de Danaan until
    Goll and the Fianna rush to aid them. Goll kills Fionnbhar, many fall in the hard
    battle, and the Tuatha de Danaan withdraw again under Druid mist when more Fianna
    arrive.
  language: English
  quote_policy: summarized
