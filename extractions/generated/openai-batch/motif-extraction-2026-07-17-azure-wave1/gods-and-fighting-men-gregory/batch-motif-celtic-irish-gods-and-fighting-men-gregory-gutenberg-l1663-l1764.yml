canonical_text:
  quote: ''
  summary: Lugh explains dangerous parts of the fine imposed on the sons of Tuireann.
    Tuireann advises his sons to request Manannan's horse and then Manannan's curragh
    from Lugh. Lugh refuses the horse but grants the curragh. Ethne laments her brothers'
    departure and reproaches them for killing Lugh's father. The brothers sail to
    the Garden in the East of the World, where Brian uses a Druid rod to transform
    them into hawks so they can evade guards and take apples. The king's daughters
    pursue them as ospreys with lightning, and Brian changes the brothers into swans
    so they can escape into the sea and return to their boat.
  language: English
  quote_policy: summarized
