canonical_text:
  quote: ''
  summary: A twelve-year-old son of the King of Ulster asks to help Finn and the Fianna,
    is confined by his father, persuades his twelve foster-brothers to escape with
    him, and reaches the White Strand. After his foster-brothers are secretly killed
    by the foreign champion Dolar Durba, the boy rushes to fight him. Their weapons
    break, they wrestle until the tide drowns them both, and the bodies are found
    locked together with Dolar Durba underneath, which is taken as the boy's victory.
    The boy is buried under a flag-stone and keened.
  language: English
  quote_policy: summarized
