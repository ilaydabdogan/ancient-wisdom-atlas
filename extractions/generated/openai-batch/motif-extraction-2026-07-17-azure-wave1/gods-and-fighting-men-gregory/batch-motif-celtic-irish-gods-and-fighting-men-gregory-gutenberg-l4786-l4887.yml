canonical_text:
  quote: ''
  summary: Tadg and his companions encounter Connla and a shape-changing girl in a
    beautiful otherworld setting, learn of golden apples that sustain youth and remove
    sorrow, enter a shining house prepared for future kings, meet Cliodna of the Fair
    Hair, receive guiding birds and a green cup that turns water to wine, hear a prophecy
    of Tadg's death, discover that a year has passed although they thought it was
    one day, depart over the sea, and see the island hidden by Druid mist.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tadg and his people go to a third hill and find a beautiful resting-place
    with two young lovers, a boy and a girl.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The boy and girl have gold-like shining hair, matching green clothes, gold
    chains, and an appearance that makes them seem as if they share the same parents.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The boy and girl answer Tadg, praise his courage, strength, and wisdom, and
    give him their blessing.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The young man holds a sweet-smelling golden-colored apple; he eats a third
    of it, but it does not become less.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The apple is described as the food nourishing the pair, and age or sorrow
    cannot touch them once they have tasted it.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:6
  text: The young man identifies himself as Connla, son of Conn of the Hundred Battles,
    and says the girl of many shapes brought him there.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The girl says she brought Connla to the place because she gave him her love
    and affection, so they might look at one another forever.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The girl says the grand dun with silver walls is empty because it is for future
    kings who will rule Ireland, and that Tadg will have a place in it.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The group enters a wonderful house with white-bronze walls set with crystal
    and carbuncles shining by night and day.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:10
  text: A sheltering apple-tree near the house has both blossoms and ripe fruit, and
    its fruit is said to feed the host of the house.
  category: object
  evidence_refs:
  - ev:6
- id: obs:11
  text: The woman says an apple from that apple-tree brought Connla to her, and that
    its golden apples would satisfy the whole house.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Cliodna of the Fair Hair identifies herself as daughter of Gebann, of the
    Tuatha de Danaan, sweetheart of Ciabhan of the Curling Hair, and as the namesake
    of Cliodna's wave on the coast of Munster.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Three beautiful birds of different colors come to the apple-tree, each eats
    an apple, and they sing music that would put sick men to sleep.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Cliodna says the birds will go with Tadg's group, guide them, make music for
    them, and keep sorrow and sadness from them until they reach Ireland.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Cliodna gives Tadg a green cup and says that water poured into it will immediately
