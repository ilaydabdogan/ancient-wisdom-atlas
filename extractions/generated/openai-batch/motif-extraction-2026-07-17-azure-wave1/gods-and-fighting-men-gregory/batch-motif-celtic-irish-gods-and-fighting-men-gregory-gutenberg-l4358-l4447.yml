canonical_text:
  quote: ''
  summary: In Manannan's house, a pig in a cauldron cooks only as true stories are
    told for its quarters. The household recounts inexhaustible or self-renewing treasures.
    Cormac recognizes the host as Manannan and tells of his abducted family and his
    journey there. Manannan puts Cormac to sleep, restores his wife and children,
    displays a gold cup that breaks under lies and is mended by truth, gives Cormac
    the cup and branch until his death, identifies himself, explains allegorical sights
    and the Well of Knowledge, and returns Cormac to Teamhair with his family and
    gifts.
  language: English
  quote_policy: summarized
