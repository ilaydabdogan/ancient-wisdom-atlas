canonical_text:
  quote: ''
  summary: The passage gives Diarmuid's parentage and fosterage by Angus Og at Brugh
    na Boinne, narrates the killing of Roc Diocain's son by Donn during an uproar
    among Finn's hounds, Finn's divinatory discovery of the killer, and the Steward's
    transformation of his dead son into the Boar of Slieve Guillion, bound to bring
    about Diarmuid's death. It ends with Diarmuid's later standing among the Fianna
    and a seven-day combat with a wild ox on the Mountain of Happiness.
  language: English
  quote_policy: summarized
