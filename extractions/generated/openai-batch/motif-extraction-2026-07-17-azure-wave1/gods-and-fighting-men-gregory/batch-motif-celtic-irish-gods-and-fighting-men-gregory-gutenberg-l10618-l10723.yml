canonical_text:
  quote: ''
  summary: A wild and ugly woman comes to the Fianna on a snowy winter night seeking
    shelter. Finn and Oisin refuse her, but Diarmuid admits her, brings her to the
    fire, and allows her under his covering. She appears as a beautiful young woman,
    causes a great house to appear on a hillside, and lives there with Diarmuid under
    a condition that he must not say three times what she was like when she came to
    him. While Diarmuid visits the Fianna, Finn and Oisin each obtain one of Diarmuid's
    greyhound pups from her, and Diarmuid twice reproaches her by referring to her
    former state. Caoilte then comes seeking a similar promise of a pup.
  language: English
  quote_policy: summarized
