  summary: The passage presents Irish gods and invisible people as perfected forms
    of local life, describes the Men of Dea fighting the Fomor and later dwelling
    in hills and the Under-Wave, quotes Midhir’s description of an abundant unseen
    country to Queen Etain, recalls Oisin lamenting Finn and the Fianna before S.
    Patrick, and develops a symbolic contrast and union of lunar folk art and solar
    disciplined art.
