canonical_text:
  quote: ''
  summary: Finn gathers the Fianna when Ireland's enemies are coming. Cael arrives
    from Brugh na Boinne and says he has dreamed of a high marriage with Credhe, a
    woman of the Sidhe. Finn explains that Credhe requires suitors to make a poem
    describing her vessels and palaces. Cael has such a poem from his nurse Muirenn.
    The Fianna postpone battle and go to Credhe's Sidhe dwelling at Loch Cuire. Cael
    recites a long praise-poem cataloguing Credhe's house, attendants, vessels, beds,
    bird-thatched roof, well, bronze vat, and apple-tree. Credhe accepts him as husband,
    a wedding-feast is held, and the Fianna remain there seven days.
  language: English
  quote_policy: summarized
