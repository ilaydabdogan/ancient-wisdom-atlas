canonical_text:
  quote: ''
  summary: After Lugh's long kingship, the Dagda succeeds him. Lugh departs Ireland,
    with a report that he died at Uisnech, where the first fire in Ireland was kindled
    and from which chief fires derived. Lugh is later seen in connection with Cuchulain
    and then by Conn of the Hundred Battles. Conn visits the Rath of the Kings at
    Teamhair with Druids and poets; the Lia Fail screams under his feet, and a Druid
    explains that its screams foretell kings of Conn's race. Mist and darkness come,
    a rider casts spears, then welcomes Conn to a beautiful plain, a king's rath,
    and a house with a white-bronze roof and golden tree. A young woman with ale vessels
    serves Conn and Art, and the master names future kings. The woman is identified
    as the Kingship of Ireland, and the master identifies himself as Lugh of the Long
    Hand, son of Ethlinn.
  language: English
  quote_policy: summarized
