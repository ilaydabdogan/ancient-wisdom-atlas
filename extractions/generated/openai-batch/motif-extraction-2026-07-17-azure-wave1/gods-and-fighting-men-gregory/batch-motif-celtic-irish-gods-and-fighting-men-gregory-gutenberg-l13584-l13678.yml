canonical_text:
  quote: ''
  summary: The Grey Man uses spells to hold Finn, Daire, and later the Fianna. Daire's
    music prompts temporary weakening of spells and later distracts the captor. Conan,
    wounded while escaping a beheading attempt, gains access to an enchanted cup,
    hides it, and uses its drink to restore Finn, Osgar, and the Fianna.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Grey Man asks Daire to play music; Daire says the Grey Man's spells have
    made him weak and downhearted and that Finn's bonds prevent him from making music
    willingly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Grey Man weakens the spells, gives food and drink, and is pleased by Daire's
    music; Glanluadh and Ailne are called to listen and are pleased.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Fianna hear Daire's music, locate the place, learn the condition of Finn
    and Daire, and attack Ailne's dun.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Grey Man restores the full power of his spells; the Fianna hear the music
    as stammering and then hear a roar like waves before falling into sleep and clouds
    of death.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Grey Man and Ailne bring the Fianna into the dun, put hard bonds on them,
    and place them with Finn and Daire.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Daire says he cannot play sweet music while the Fianna are in trouble; after
    the Grey Man weakens the spells on all of them, Daire plays music of sweetness,
    shouting, grief, lamentation, and sweet strings.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The prisoners are kept for a long time and treated harshly; Ailne's brother
    sometimes beheads some of them, while enchantments keep them from rising from
    their seats.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: When threatened with beheading, Conan leaps from his seat and loses strips
    of skin from his back; he asks the Grey Man to delay his death and heal him first.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: Conan asks for healing because he knows of an enchanted cup in the dun that
    had cured Glanluadh.
  category: object
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ailne refuses to bring the cup but later places a sheepskin on Conan's back;
    it fits, grows to him, and covers his wounds.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:11
  text: The Grey Man puts the enchanted cup in Conan's hand, but Daire's sorrowful
    music draws him away; Conan hides the cup and says he left it where he found it.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: Conan gives drink from the hidden cup to Finn, Osgar, and the rest of the
    Fianna; those who were withered, shaking, and without strength or courage immediately
    regain appearance and strength.
  category: action
  evidence_refs:
  - ev:11
