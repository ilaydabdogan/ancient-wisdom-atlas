canonical_text:
  quote: ''
  summary: Finn gathers the Fianna after fifteen of his people have been taken. He
    and fifteen companions sail across the sea to follow the track of the Hard Servant.
    At a cliff, Diarmuid uses Manannan's staves of power to leap onto a slippery rock
    but cannot bring the others up. Alone, he enters woods and finds a tree, drinking-horn,
    well, and enchanted water. A hostile Man of Enchantments challenges him. After
    repeated combats, hunting deer, eating by a fire, and drinking from the well,
    Diarmuid falls into the well after the Enchanter, follows him to a flowery plain
    and royal city, fights an army, is wounded, and is confronted by a champion.
  language: English
  quote_policy: summarized
