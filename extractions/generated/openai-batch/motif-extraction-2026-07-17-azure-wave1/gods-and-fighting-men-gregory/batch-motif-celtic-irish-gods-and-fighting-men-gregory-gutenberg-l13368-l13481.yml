  quote: Cnoc-an-Air, the Hill of Slaughter.
  summary: Ailne mourns the deaths of her husband and two sons, listing signs she
    says foretold their fall. Grania denies that Finn or the Fianna used treachery.
    Ailne refuses hospitality and demands satisfaction, leading to a hard battle in
    which her side is defeated. The battlefield hill receives the name Cnoc-an-Air,
    the Hill of Slaughter.
