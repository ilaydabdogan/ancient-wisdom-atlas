canonical_text:
  quote: ''
  summary: 'After a great battle, members of the Fianna search for the dead and wounded.
    Credhe searches for Cael and observes animals in distress: a crane protecting
    nestlings from a fox, and a stag mourning a killed hind. Fergus tells her Cael
    and Finnachta Fiaclach drowned one another. Cael''s body is cast back by the waves,
    and Credhe laments him with images of roaring water, grieving birds, and mourning
    deer. She dies beside Cael; they are buried together and Caoilte raises a stone
    over them. The passage closes with the battle''s aftermath and the Fianna''s gain
    of spoils and guardianship over Ireland until Gabhra.'
  language: English
  quote_policy: summarized
