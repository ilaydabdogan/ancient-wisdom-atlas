canonical_text:
  quote: ''
  summary: After their defeat, the Tuatha de Danaan withdraw from the rule of the
    sons of Miled. Manannan assigns them hidden dwellings in Ireland and provides
    an age-defying feast with Goibniu’s ale and self-renewing swine. The Tuatha de
    Danaan choose Bodb Dearg as king. The passage then describes Bodb’s enchanted
    house, a failed musical courtship by Cliach, an ominous swineherd, Bodb’s three
    sons living among men, and three landless sons of Lugaidh Menn fasting at Brugh
    na Boinn until Bodb receives them and the Men of Dea consider giving each a wife.
  language: English
  quote_policy: summarized
