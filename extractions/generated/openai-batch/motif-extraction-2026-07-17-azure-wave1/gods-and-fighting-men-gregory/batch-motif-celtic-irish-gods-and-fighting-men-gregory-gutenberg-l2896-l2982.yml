  type: summary
  locator: lines 2942-2946
  quote_or_summary: Bodb’s swineherd goes with a squealing pig to Da Derga’s Inn on
    the night Conaire dies; it is said that any feast the swineherd attends will have
    bloodshed before it is over.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 2948-2960
  quote_or_summary: Bodb’s sons Angus, Artrach, and Aedh often live among men in the
    time of the Fianna. Artrach has a seven-doored hospitable house; kings’ sons come
    to Angus for spear and dart training; poets stay with Aedh at his beautiful rath
    with apples and nuts. After the Fianna pass away, the brothers return to the Tuatha
    de Danaan.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 2962-2970
  quote_or_summary: Bodb is sometimes with Angus at Brugh na Boinn. Eochaid, Fiacha,
    and Ruide, sons of Lugaidh Menn, go there after their father refuses them land
    until they win it. They sit on the green and fast on the Tuatha de Danaan to win
    some good thing.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized.
