- id: ev:3
  type: summary
  locator: lines 2916-2930
  quote_or_summary: The Tuatha de Danaan decide they should have one king. Bodb Dearg,
    Ilbrech, Lir, Midhir, and Angus Og are possible candidates; Angus Og does not
    want the kingship. The chiefs choose Bodb Dearg because of his father, himself,
    and his seniority among the Dagda’s children.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: lines 2932-2940
  quote_or_summary: Bodb’s house is in Sidhe Femen, surrounded by great enchantments.
    Cliach, a harper, seeks one of Bodb’s daughters in marriage and plays outside
    for a year without gaining access; while he continues playing, Loch Bel Sead bursts
    up under his feet on a mountain top.
  source_text_path: texts/public-domain/celtic-irish/project-gutenberg/gods-and-fighting-men-gregory.md
  rights_note: Public domain source; summarized.
