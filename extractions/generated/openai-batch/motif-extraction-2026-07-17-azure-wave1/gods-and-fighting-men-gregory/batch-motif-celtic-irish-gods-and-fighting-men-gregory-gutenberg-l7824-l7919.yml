  quote: ''
  summary: During a prolonged battle, Finn sends Fergus to count the remaining Fianna
    and summon the King of the World. The King of the World names his remaining battalions
    and chief fighters. The King of Lochlann insists that he and his sons must fight
    first. His sons Forne, Tocha, and Mongach enter the battle in sequence; Forne
    is killed by Oisin after Fergus heartens him, Tocha is killed by Lugaidh's Son,
    and Mongach advances with an elaborate iron flail before Fidach asks Fergus for
    praise.
