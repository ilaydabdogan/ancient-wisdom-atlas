canonical_text:
  quote: ''
  summary: The sons of Tuireann, led by Brian, decide to obtain the King of Greece's
    pig-skin. They enter the Greek court in the appearance of Irish poets, receive
    hospitality, and Brian recites and explains a poem that asks for the skin as reward.
    The king refuses and offers gold measured in the skin; Brian uses that occasion
    to seize the skin, kills attendants and the king, and leaves with his brothers.
    They then set out for Persia to seek Pisear's spear and begin the same poet-disguise
    approach there.
  language: English
  quote_policy: summarized
