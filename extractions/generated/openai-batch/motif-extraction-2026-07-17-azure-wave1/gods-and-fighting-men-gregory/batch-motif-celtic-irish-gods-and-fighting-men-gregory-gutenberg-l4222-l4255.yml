canonical_text:
  quote: ''
  summary: Bran and his companions reach the Land of Women, where a chief woman welcomes
    Bran and draws the curragh to shore with a thread. They enter a grand house with
    three times nine beds and inexhaustible food and drink. After what seems to them
    one year, Nechtan and his kinsmen long for Ireland. The woman warns that they
    will regret leaving, forbids them to touch Irish land, and tells them to bring
    the man left in the Island of Joy. At Ireland, people know Bran only from old
    stories. Nechtan touches shore and becomes ashes. Bran recounts his wanderings,
    bids farewell, and his later wanderings are unknown.
  language: English
  quote_policy: summarized
