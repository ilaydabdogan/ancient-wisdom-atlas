canonical_text:
  quote: ''
  summary: The preface reflects on Irish heroic figures and the Fianna as joyful,
    courteous companions rather than speculative or ascetic seekers. It compares their
    fellowship with the Table Round, contrasts their enchanted voyages to divine countries
    with Grail-seeking, and gives examples of Osgar and Goll facing death within the
    ethic of heroic friendship and courtesy.
  language: English
  quote_policy: summarized
