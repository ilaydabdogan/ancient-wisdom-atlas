canonical_text:
  quote: ''
  summary: Finn questions Black Garraidh about the death of Finn's father Cumhal,
    and Garraidh recounts the sons of Morna's banishment, return, and attack on Cumhal.
    Later, at a feast in Almhuin, Fergus praises the forefathers of Finn and Goll,
    Goll receives gold tribute from Lochlann, and Finn challenges Goll's right to
    that tribute. Goll explains the tribute in relation to earlier conflicts with
    Cumhal and to protection by the Fianna.
  language: English
  quote_policy: summarized
