canonical_text:
  quote: ''
  summary: 'The passage recounts fighting at Finntraigh: Caoilte challenges an enemy
    and is aided by newly arrived allies; the nine Garbhs keep watch and die in a
    night battle; Fergus asks the High King for aid, receives hostility toward Finn,
    and then shames the High King''s son from play into battle. The young royal gathers
    companions, insists on fighting despite Finn''s warning, and kills Sligech, King
    of the Men of Cepda.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Finn proposes to send a challenge to Daire Bonn, King of the Great World;
    Caoilte asks to do that day's fighting, receives men from Finn, Oisin, and others,
    and his challenge is answered by the son of the King of the Great Plain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A fleet of ships enters the harbour during the fight; Finn first thinks they
    have come to help the foreigners, but Oisin identifies them as friends, Fiachra
    and Duaban Donn with their people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those who came in the ships go ashore, see Caoilte's banner going down, hurry
    to help him, and together defeat the king's son and his people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: When Finn asks who will keep watch that night, the nine Garbhs of the Fianna
    volunteer.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The King of the Men of Dregan comes toward the night watch; after a fierce
    battle, only three Garbhs and the king remain, and the four fall together.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The fighting continues from day to day and week to week, with great losses
    on both sides.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Fergus of the Sweet Lips sees many Fianna fallen, goes without leave to Teamhair,
    and tells the High King of Ireland about Finn's situation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The High King says it is good for Finn to be in difficulty, complains about
    the Fianna's power, and says it would be better for the foreigners to win than
    for Finn to win.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Fergus finds the High King's son playing ball and rebukes him for playing
    while strangers are taking the country.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The High King's son is shamed, throws away his stick, gathers one thousand
    and twenty young men from Teamhair, and leaves without asking the High King's
    leave or advice.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:11
  text: The High King's son arrives at Finntraigh; Fergus reports his arrival to Finn,
    and the Fianna rise to welcome the young man.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Finn says he would rather receive the young man in a time of music and pleasure
