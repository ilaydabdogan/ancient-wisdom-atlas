canonical_text:
  quote: ''
  summary: Arthur, son of the King of Britain, comes to serve Finn, steals three of
    Finn's named hounds, and takes them across the sea. Finn discovers the theft through
    a water-filled golden basin and sends nine Fianna, who recover the hounds, spare
    and capture Arthur, and bring back a horse and mare whose offspring become the
    Fianna's horses. A later episode tells of a rejected woman-Druid who imprisons
    many of Finn's hounds in a hill. The passage ends with Adhnuall, one of the recovered
    hounds, returning after a battle to a burial hill, howling three times, and dying.
  language: English
  quote_policy: summarized
