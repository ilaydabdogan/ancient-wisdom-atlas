canonical_text:
  quote: ''
  summary: The passage recounts the first landing attempts of the Sons of the Gael
    in Ireland under the sons of Miled, their obstruction by Tuatha de Danaan enchantments,
    encounters with the queens Banba, Fodhla, and Eriu, and Amergin's conditional
    challenge to the Tuatha de Danaan for the kingship of Ireland.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Tuatha de Danaan are said to have held sway over Ireland for an unknown
    but likely long time before being put from it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sons of Gaedhal, later called the Sons of the Gael, first attempt to land
    at Inver Slane to avenge Ith, one of their race who had died in Ireland.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Sons of the Gael come under the leadership of the sons of Miled from the
    south, and their Druids had told them they would find no country to settle in
    until they reached the island in the west.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When the Tuatha de Danaan see the ships coming, they gather at the shore and
    use enchantments to cast a cloud over the whole island, confusing the Sons of
    Miled so that they see only a large thing like a pig.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: After enchantments prevent them from landing, the Sons of the Gael sail along
    the coast and make a landing at Inver Sceine in west Munster.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: At Slieve Mis, a queen of the Tuatha de Danaan meets the newcomers with beautiful
    women, Druids, and wise men; she identifies herself to Amergin as Banba, wife
    of Mac Cuill, Son of the Hazel.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: At Slieve Eibhline, another queen of the Tuatha de Danaan meets them with
    her women and Druids; she identifies herself as Fodhla, wife of Mac Cecht, Son
    of the Plough.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: At the hill of Uisnech, Eriu approaches Eremon and is seen changing between
    the form of a beautiful wide-eyed queen and a sharp-beaked grey-white crow.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Eriu identifies herself as the wife of Mac Greine, Son of the Sun.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage states that the names of Banba, Fodhla, and Eriu were often later
    given to Ireland.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:11
  text: The Sons of the Gael go to Teamhair, where the three sons of Cermait Honey-Mouth,
    son of the Dagda, hold court and share the kingship.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:12
  text: The three sons of Cermait are quarrelling over the division of their father's
    treasures, and the quarrel appears likely to lead to battle.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The island is described as fruitful and abundant, with wholesome air, mild
    sun and cold, and plentiful honey, acorns, milk, fish, corn, and room enough for
    all.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:14
  text: Amergin tells the Tuatha rulers that they must give up the kingship immediately
    or leave it to battle, and he presents this demand as revenge for Ith's treacherous
    killing.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:15
  text: The sons of Cermait say they are not willing to fight because their army is
    not ready, ask Amergin to make an offer, and warn that an unfair offer will be
    met with destructive enchantments.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:16
  text: Amergin instructs his men to return to Inver Sceine, enter their ships, and
    go out to the length of nine waves from the shore.
  category: action
  evidence_refs:
  - ev:14
- id: obs:17
  text: Amergin proposes that if the Tuatha de Danaan can prevent the Sons of the
    Gael from landing, the Gaels will return home and never try again; if the Gaels
    can land despite them, the Tuatha de Danaan must give up the kingship and come
    under their sway.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:18
  text: The Tuatha de Danaan accept the offer because they trust their enchantments
    over winds and sea and their arts to keep the Gaels from landing again.
  category: action
  evidence_refs:
  - ev:15
