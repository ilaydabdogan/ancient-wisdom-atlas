canonical_text:
  quote: ''
  summary: Caoilte gathers an unruly troop of animals to secure Finn's release; the
    animals are confined overnight at Teamhair, seen once by the King of Ireland,
    and scatter when Finn is freed. The passage then lists Caoilte's speed, Colla's
    backward race, Caoilte's exceptional hearing, and his use of Druid herbs in bath
    water to restore husbands' love. It then turns to Lugaidh's Son, his fostering,
    arming at twelve, service agreement with Finn, poor conduct, and the Fianna's
    complaint against him.
  language: English
