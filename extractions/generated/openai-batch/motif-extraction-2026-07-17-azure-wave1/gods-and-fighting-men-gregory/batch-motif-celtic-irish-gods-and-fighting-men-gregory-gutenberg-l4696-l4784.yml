canonical_text:
  quote: ''
  summary: Tadg and his companions, after losing their course on a long ocean voyage,
    survive a frightening storm and reach a beautiful island. They pass through abundant
    woods and orchards, encounter strange singing birds, and arrive at a honey-dewed
    plain with three fortified hills. A white-bodied woman welcomes Tadg and identifies
    the island and one dun connected with the royal line of Ireland. Tadg then meets
    Cesair, who says his coming was foretold, identifies herself as the first to reach
    Ireland, describes permanent life in the island, names the island as one of the
    paradises of the world, and directs Tadg onward rather than revealing the occupant
    of a silver-walled dun.
  language: English
  quote_policy: summarized
