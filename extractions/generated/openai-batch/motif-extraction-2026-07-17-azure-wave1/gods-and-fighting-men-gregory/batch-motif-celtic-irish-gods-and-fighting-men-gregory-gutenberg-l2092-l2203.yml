canonical_text:
  quote: ''
  summary: The passage narrates Ethne's lament for the departing sons of Tuireann;
    Brian's sea search for the Island of the Fair-Haired Women and acquisition of
    a cooking-spit; the battle at the Hill of Miochaoin that leaves the brothers mortally
    wounded; their return toward Ireland; Tuireann's failed request to Lugh for a
    healing skin; Lugh's refusal until their deaths satisfy their deed; and the deaths
    and burial that follow.
  language: English
