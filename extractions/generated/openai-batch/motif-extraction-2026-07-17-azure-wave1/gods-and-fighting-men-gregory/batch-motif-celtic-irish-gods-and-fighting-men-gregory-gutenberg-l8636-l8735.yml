canonical_text:
  quote: ''
  summary: Donn names the Tuatha de Danaan leaders who attack his hill. Finn and the
    Fianna join the sons of Midhir in defending it against night assaults. After a
    severe battle, the Men of Dea remove their dead and set fire and water barriers.
    During a year of repeated attacks, Conn son of Midhir is killed and the Fianna
    are badly wounded. Donn tells Finn of a Tuatha de Danaan physician who gathers
    healing herbs at dawn; Caoilte goes with Aedh and Flann to find him.
  language: English
  quote_policy: summarized
