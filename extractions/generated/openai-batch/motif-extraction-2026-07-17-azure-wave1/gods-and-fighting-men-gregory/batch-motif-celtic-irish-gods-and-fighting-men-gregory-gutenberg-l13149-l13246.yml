canonical_text:
  quote: '"dark clouds of blood"; "he has the head and the tail of a cat"'
  summary: The Fianna see ominous blood-clouds and prepare for an enemy. Finn dreams
    of Aodh Beag headless and of Goll fighting a strong man, but the Druid says Aodh
    Beag and Goll will not be wounded. A pursued woman in a crimson cloak asks Finn
    for protection from Tailc, son of Treon, whom she says she hates because of his
    appearance and cat-like head and tail. Tailc arrives and demands battle for his
    wife. Many Fianna are slain before Osgar fights Tailc for five days and nights
    and beheads him. The woman dies of shame after seeing the slaughter caused on
    her account.
  language: English
  quote_policy: quoted
