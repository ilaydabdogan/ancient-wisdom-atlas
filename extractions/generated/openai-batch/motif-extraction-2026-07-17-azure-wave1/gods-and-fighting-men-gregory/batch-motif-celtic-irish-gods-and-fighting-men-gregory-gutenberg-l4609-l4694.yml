canonical_text:
  quote: ''
  summary: Tadg, son of Cian, is introduced as one who went to the Land of the Ever-Living
    Ones and returned. After Cathmann of Fresen captures Tadg's wife Liban, his brothers,
    and many Munster people, Tadg escapes, builds a strong hide-covered curragh, and
    sails with his men to search for them. The voyage crosses a stormy sea filled
    with unfamiliar birds and sea creatures, reaches an island of giant sheep and
    a nine-horned ram, and then strange bird islands where eating eggs causes feathers
    to grow until bathing removes them.
  language: English
  quote_policy: summarized
