canonical_text:
  quote: ''
  summary: The passage tells of Red Ridge, a daring young man from Connacht who nearly
    leaves Finn over delayed wages but is quieted by Finn's three verses recalling
    gifts and shared experiences. It then tells of Finn fighting at a ford with worn
    weapons, receiving a flat stone with a gold chain from a daughter of Mongan of
    the Sidhe, using it in battle, and losing it in the ford later named Ath Liag
    Finn. The stone is prophesied to remain lost until the Woman of the Waves brings
    it to land on a Sunday morning, after which the world will end seven years later.
  language: English
