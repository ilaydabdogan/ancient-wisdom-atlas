canonical_text:
  quote: ''
  summary: Finn and the Fianna hunt across hills, woods, and plains. After Finn sleeps
    with only Diorraing watching him, the rest of the Fianna abandon the hunt. Diorraing
    discovers a well-lighted house of the Sidhe belonging to Conan of Ceann Slieve.
    Finn and Diorraing are identified by their appearance and by their hounds, Bran
    and Sceolan, admitted, relieved of their arms, and feasted. Finn asks for Conan's
    daughter Finndealbh as his wife; Conan says she is promised to Fatha, son of the
    King of Ess Ruadh. Diorraing defends Finn's superiority, and Conan puts Finn under
    bonds as a true hero to answer his questions.
  language: English
  quote_policy: summarized
