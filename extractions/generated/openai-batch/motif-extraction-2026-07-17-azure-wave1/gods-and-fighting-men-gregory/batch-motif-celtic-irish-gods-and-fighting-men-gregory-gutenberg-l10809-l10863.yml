canonical_text:
  quote: ''
  summary: Diarmuid reaches the King of the Plain of Wonder, defeats the king's fighting
    men, and receives the cup of healing. A red man carries him across a river and
    reveals himself as a messenger from beyond the world. The messenger instructs
    Diarmuid to bring water from a well and use it with the cup and three drops of
    blood to heal the daughter of King Under-Wave, warning that Diarmuid's love for
    her will vanish. Diarmuid follows the instructions, heals the woman at the third
    draught, loses his love for her, refuses reward, asks only for a ship to Ireland,
    and returns to Finn and the Fianna.
  language: English
  quote_policy: summarized
