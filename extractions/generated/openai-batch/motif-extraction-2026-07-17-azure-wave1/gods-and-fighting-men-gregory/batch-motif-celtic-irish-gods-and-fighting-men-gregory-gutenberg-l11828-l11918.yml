canonical_text:
  quote: ''
  summary: Diarmuid returns to Grania while Muadhan provides salmon and keeps watch.
    On successive days Diarmuid performs dangerous feats with a spear and a sword;
    Green Champions who try to copy the feats die. He arms himself with battle clothing,
    sword, and spears, refuses to give up the person sought by the Green Champions,
    fights and destroys most of their host, and later wrestles and binds three named
    champions instead of killing them.
  language: English
  quote_policy: summarized
