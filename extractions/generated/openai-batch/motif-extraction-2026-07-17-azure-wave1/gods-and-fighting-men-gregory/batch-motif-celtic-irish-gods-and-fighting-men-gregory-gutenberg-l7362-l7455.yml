canonical_text:
  quote: ''
  summary: Taistellach kills an enemy champion at the White Strand and is sent to
    summon aid. Bran and Dolb carry the request to the Tuatha de Danaan. Bodb Dearg
    at first denies obligation, but accepts after Dolb invokes kinship and past mutual
    aid. The Men of Dea assemble, arm themselves, and go to the White Strand. Glas
    announces their challenge to the King of the World. The King sends the kings of
    the Dog-Heads and Cat-Heads with red-armed battalions. Lir struggles against the
    Dog-Head king; Abarthach kills the Cat-Head king, intervenes, kills the Dog-Head
    king, and the Men of Dea rout the enemy while losing many of their own.
  language: English
  quote_policy: summarized
