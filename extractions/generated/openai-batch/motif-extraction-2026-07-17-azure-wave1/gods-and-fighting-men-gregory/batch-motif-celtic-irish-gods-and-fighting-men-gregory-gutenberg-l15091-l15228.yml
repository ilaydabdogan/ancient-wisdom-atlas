canonical_text:
  quote: ''
  summary: Oisin laments old age and praises Finn, Finn's household, and the Fianna.
    He recalls Finn's virtues, wealth, generosity, the blackbird of Doire an Chairn,
    the sounds of animals and hounds, and a great hunt with Finn and Bran. He contrasts
    these memories with Patrick's bells, church, and priestly setting. He then complains
    of weakness and dragging stones, recounting that he once refused Finn's order
    to bring stones for a dun and that Finn foretold he would drag stones before death.
    The passage ends with Oisin's images of loss and long-lasting sorrow.
  language: English
  quote_policy: summarized
