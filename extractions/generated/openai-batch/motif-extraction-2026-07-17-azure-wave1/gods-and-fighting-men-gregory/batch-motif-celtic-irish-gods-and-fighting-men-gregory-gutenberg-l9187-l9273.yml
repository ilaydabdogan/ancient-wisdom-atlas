canonical_text:
  quote: ''
  summary: 'The passage first concludes a battle in which Derg kills Dubh and Donn
    with one spear-cast and Ilbrec rewards Caoilte. Later, Caoilte is wounded by a
    poisoned spear and goes to the Sidhe hill of Ess Ruadh to seek healing from Bebind.
    He travels with Cascorach and Fermaise, is welcomed and feasted, and then helps
    repel a Lochlann attack: Cascorach kills a woman-warrior, Caoilte kills the King
    of Lochlann with the spear Ben-badb, and Fermaise kills Eolus, causing the invaders
    to retreat.'
  language: English
  quote_policy: summarized
