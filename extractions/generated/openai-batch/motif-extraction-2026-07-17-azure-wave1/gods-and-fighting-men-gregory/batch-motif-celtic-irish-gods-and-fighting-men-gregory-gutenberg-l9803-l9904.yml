canonical_text:
  quote: ''
  summary: Finn compels the Fianna to go hunting on a misty morning. They encounter
    a strange moon-marked beast pursued by a Red Woman. After dispute, she transforms
    into a water-worm and attacks Finn, but Bran and Finn overcome her. The Fianna
    pursue the luminous beast through the night until it enters the foot of Cnoc-na-righ.
    The Red Woman opens a door in the hill with a Druid rod, has the Fianna washed
    and clothed, and leads them into a splendid hall with a king, court, musicians,
    and a feast-table.
  language: English
  quote_policy: summarized
