canonical_text:
  quote: '"I give you my word, Finn," said Diarmuid, "that the door you are at yourself
    is the first door I will pass out of."'
  summary: Diarmuid arms himself, questions the groups stationed at seven doors, refuses
    to leave through friendly doors, and vows to pass out by Finn's door. Finn orders
    his men to stop him, but Diarmuid vaults over them on his spear staves, escapes
    westward, follows Angus and Grania to Ros-da-Shoileach, and joins them in a sheltered
    cabin. After food and sleep, Angus gives Diarmuid rules for continued flight and
    then departs.
  language: English
  quote_policy: quoted
