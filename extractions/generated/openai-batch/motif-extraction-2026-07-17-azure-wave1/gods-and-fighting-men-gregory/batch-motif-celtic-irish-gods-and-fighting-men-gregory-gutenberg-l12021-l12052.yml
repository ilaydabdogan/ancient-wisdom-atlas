  quote: ''
  summary: Diarmuid routs and destroys opposing strangers, leaving only the Woman-messenger
    of the Black Mountain to report to Finn. She tells Finn of the destruction and
    the deaths of three hounds. Finn goes to the bound Kings of the Green Champions
    and asks several companions to loosen them, but they refuse; the kings die in
    their bonds. Finn buries them under marked stones with names written in Ogham
    and returns to Almhuin of Leinster.
  language: English
