  quote: And he lay down on the rocks, and at the end of twelve days he died.
  summary: Goll kills Finn's son Cairell, withdraws to a sea-cave, is watched by Finn's
    men, refuses his wife's plea to leave and accept healing, dies after twelve days,
    and is lamented. Conan later vows vengeance for Goll, while traditions differ
    about Conan's burial place.
