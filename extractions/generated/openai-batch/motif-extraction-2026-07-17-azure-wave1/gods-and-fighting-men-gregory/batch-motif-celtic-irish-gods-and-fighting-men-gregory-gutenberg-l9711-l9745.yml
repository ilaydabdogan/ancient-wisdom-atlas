canonical_text:
  quote: ''
  summary: Finn seeks a wife from among the Sidhe. While hunting on Bearnas Mor, his
    company encounters a destructive wild pig. A tall man from a hill asks Finn to
    spare it, brings the company into a Sidhe hill, and changes the pig into a young
    woman named Scathach by striking it with a Druid rod. After a feast, Finn asks
    to marry her and her father agrees. At night Scathach plays a harp whose silver
    string causes sleep, and Finn, Bran, and the company awaken next morning back
    outside on the mountain where they first saw the pig.
  language: English
  quote_policy: summarized
