canonical_text:
  quote: ''
  summary: 'Brian asks for a king''s spear as the reward for a poem, kills the king
    when refused, and takes the spear. The sons of Tuireann then seek further items
    of their imposed fine: the horses and chariot of the King of Siogair and the seven
    pigs of Easal. They enter Siogair''s court as paid soldiers, gain sight of the
    horses and chariot, kill the driver and king, and carry the chariot away. In Easal''s
    country, the people watch the harbours in fear because the sons are known for
    taking gifted treasures; Brian explains that a hard sentence forced their actions
    and demands the pigs, either willingly or by battle.'
  language: English
  quote_policy: summarized
