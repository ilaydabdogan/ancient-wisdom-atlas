literal_observations:
- id: obs:1
  text: The Tuatha de Danaan come to Ireland in a mist, through the air and high air,
    from the north.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Their place of origin has four named cities, each associated with instruction
    in skill, knowledge, and perfect wisdom by named wise men.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: 'They bring four named treasures: the Lia Fail or Stone of Destiny, a sword,
    a Spear of Victory, and a cauldron from which no company goes unsatisfied.'
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage lists Nuada as king, Manannan as greater than Nuada, and several
    male and female figures associated with writing, healing, battle, crafts, smithwork,
    poetry, and Ireland's names.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Brigit is described as connected with poetry, healing, smith's work, the first
    whistle for night-calling, a face with one ugly and one comely side, and a name
    meaning fiery arrow.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Tuatha de Danaan put the plough, the sun, and the hazel-tree above all
    other things.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: They have a well below the sea where nine hazels of wisdom grow; hazel parts
    fall into the well, five salmon eat the nuts, eating a salmon gives wisdom and
    poetry, and seven streams of wisdom issue from and return to the well.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Tuatha de Danaan arrive on the first day of Beltaine in northwest Connacht,
    while the Firbolgs see only mist lying on the hills.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Eochaid son of Erc receives news of the new arrivals and had already had a
