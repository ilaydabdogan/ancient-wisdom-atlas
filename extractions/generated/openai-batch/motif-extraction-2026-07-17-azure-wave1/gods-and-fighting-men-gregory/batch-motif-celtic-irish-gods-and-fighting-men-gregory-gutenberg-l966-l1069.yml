canonical_text:
  quote: ''
  summary: The passage recounts Dagda's small requested reward from Bres; Corpre's
    poor reception and satire against Bres; Nuada's silver arm and later restoration
    by Miach; Diancecht's jealous killing of Miach and the mixing of medicinal herbs
    from Miach's grave; the restoration of Nuada to kingship; and Bres's discovery
    of his Fomor father Elathan through Eri's account and a recognition ring.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Dagda asks Bres for a heifer as reward after doing his work, following
    Angus's instruction, and Bres considers the request foolishly small.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Corpre, son of Etain and poet of the Tuatha de Danaan, comes seeking hospitality
    at the king's house and is put in a dark narrow house without fire, furniture,
    or bed, and is given three small dry cakes.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Corpre speaks a hostile verse naming lack of food, milk, shelter, light, and
    payment for a story-teller as the prosperity of Bres.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Corpre's speech, Bres has no good luck and is said to be going down
    thereafter; the passage calls this the first satire made in Ireland.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Diancecht makes Nuada an arm of silver with movement in every finger, after
    Nuada's arm had been struck off.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: Miach places a cat's eye in a one-eyed young man's head, but the eye wakes
    at small animal movements and sleeps when the man wants to watch an army or gathering.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Miach restores Nuada's own severed hand over three days and nights, using
    the formula about joint and sinew and applying fire-blackened bulrushes before
    the king is healed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Diancecht, angry that Miach has done a better cure, strikes Miach with a sword
    repeatedly until the brain is cut out and Miach dies.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: Three hundred and sixty-five herbs grow from Miach's grave, matching the number
    of his joints and sinews; Airmed lays them out by virtue, but Diancecht mixes
    them so their full powers are no longer known.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: When the Tuatha de Danaan see Nuada restored, they gather at Teamhair, require
    Bres to give up the kingship, and put Nuada back in the kingship.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: Eri tells Bres that his father is Elathan, a king of the Fomor, who once came
    to her across a level sea in a great vessel that seemed silver and gave her a
    ring to give only to the man whose finger it would fit.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The ring fits Bres's middle finger, and Bres, Eri, and his people set out
    for the country of the Fomor.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: At a Fomor gathering, Bres's side accepts friendly challenges with hounds
    and horses, and the hounds and horses of the Tuatha de Danaan beat those of the
    Fomor.
  category: action
  evidence_refs:
  - ev:12
- id: obs:14
  text: When Bres puts his hand to his sword, Elathan recognizes the ring and asks
    who the young man is; Eri tells him that Bres is his son.
  category: relationship
  evidence_refs:
  - ev:12
