canonical_text:
  quote: ''
  summary: After Cumhal is killed, his son Finn is secretly fostered in the woods
    by Bodhmall and Liath Luachra to protect him from the sons of Morna. Finn is trained
    in hunting, running, leaping, swimming, and agility, shows exceptional skill,
    leaves his fosterers because of danger, receives the name Finn after beating boys
    at swimming, is recognized as Cumhal and Muirne's son, avenges a bereaved woman
    by killing a champion connected with Cumhal's death, recovers Cumhal's treasure-bag,
    and brings it to his father's brother Crimall.
  language: English
  quote_policy: summarized
