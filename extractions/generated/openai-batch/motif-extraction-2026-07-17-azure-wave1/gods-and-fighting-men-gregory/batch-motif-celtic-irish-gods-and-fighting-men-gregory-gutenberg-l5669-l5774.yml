candidate_motifs:
- id: motif:1
  label: hidden child raised away from enemies
  taxonomy_refs:
  - miraculous_child
  basis: Finn is taken from his mother and secretly raised in the woods because his
    father's enemies are a threat.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  confidence: medium
  cautions: The passage does not describe a miraculous conception or miraculous birth;
    the taxonomy match rests on the protected extraordinary child pattern rather than
    on explicit miracle.
- id: motif:2
  label: heroic training in wilderness
  taxonomy_refs:
  - initiation
  basis: Finn is trained by foster women in physical trials and hunting, including
    swimming, running, keeping hares in a field, and catching game.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage presents training rather than a formal ritual initiation.
- id: motif:3
  label: departure from fosterage under threat
  taxonomy_refs:
  - departure
  basis: Finn leaves his fosterers after they warn that the sons of Morna are watching
    again to kill him.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The departure is motivated by danger and survival, not by a stated quest
    command.
- id: motif:4
  label: recognition of concealed lineage
  taxonomy_refs:
  - royal_legitimacy
  basis: Finn conceals his identity, but kings identify or infer that he is Cumhal's
    son; his parentage and connection to Muirne are stated.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The passage supports recognition of lineage, but does not depict a coronation
    or formal transfer of rule.
- id: motif:5
  label: avenging combat and recovery of ancestral object
  taxonomy_refs:
  - sacred_theft
  basis: Finn kills a champion who had been involved in Cumhal's fatal battle and
    had brought away Cumhal's treasure-bag, after which Finn takes the bag.
  evidence_refs:
