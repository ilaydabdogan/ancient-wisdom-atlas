canonical_text:
  quote: ''
  summary: Bran hears sweet music, sleeps, and wakes beside a silver branch with white
    blossoms. A strangely clothed woman appears in his royal house, sings of Emhain
    and the Land of Women, and urges Bran to voyage over the sea. Bran departs with
    companions, meets Manannan riding in a chariot over the sea, hears Manannan describe
    the sea as a flowered plain from his own perspective, and later passes the Island
    of Joy, where one of Bran's men joins the laughing inhabitants and is left behind.
  language: English
  quote_policy: summarized
