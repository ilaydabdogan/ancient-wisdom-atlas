canonical_text:
  quote: '"it was no common pig was in it, but my own son."'
  summary: Angus Og feasts Finn and the Fianna at Brugh na Boinne. A dispute over
    hunting leads Angus to send a destructive herd of great pigs. The Fianna hunt
    and wound the pigs but suffer heavy losses. Finn orders the pigs burned and their
    ashes thrown into the sea so they will not come to life again. Bran the hound
    brings unknown logs that make the burning possible. Angus then reveals the black
    pig was his son, names other royal sons among the dead, and curses Bran.
  language: English
  quote_policy: quoted
