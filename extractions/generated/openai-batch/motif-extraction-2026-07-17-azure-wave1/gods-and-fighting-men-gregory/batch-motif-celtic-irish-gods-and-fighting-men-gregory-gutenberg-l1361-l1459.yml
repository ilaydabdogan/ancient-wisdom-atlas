canonical_text:
  quote: ''
  summary: Lugh learns that the Fomor have landed and spoiled Bodb Dearg's country.
    After Nuada gives an unsatisfactory answer, Lugh asks Cian, Cu, and Ceithen for
    aid in gathering the Riders of the Sidhe. Cian, travelling north, encounters the
    hostile sons of Tuireann and transforms into a pig to hide. Brian recognizes the
    transformation, changes his brothers into hounds, wounds the pig, and forces Cian
    back into human form before killing him with stones. The earth repeatedly rejects
    Cian's buried body before accepting it on the seventh burial. Lugh meanwhile travels
    westward through named places toward the Fomor and their spoils.
  language: English
  quote_policy: summarized
