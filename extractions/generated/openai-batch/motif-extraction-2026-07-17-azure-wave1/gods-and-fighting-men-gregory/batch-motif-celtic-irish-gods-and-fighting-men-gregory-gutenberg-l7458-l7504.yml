canonical_text:
  quote: ''
  summary: At Credhe's house, Taistellach reports to Finn that foreigners have arrived
    at the harbour of the White Strand. Finn tells the Fianna that, because they receive
    tribute and service from Ireland's chief men, they must defend Ireland from this
    danger. The Fianna vow not to retreat. Credhe equips them, accompanies them with
    cattle, supplies new milk through a battle lasting a year and a day, and receives
    the wounded for healing. The Fianna march and camp with shelters and fires. Caoilte,
    Oisin, and Lugaidh's Son go ahead to the harbour, attack a landing party sent
    by the King of the World to take spoils, and are joined by Conn Crither and Glas,
    son of Bremen, until the landing party is destroyed.
  language: English
  quote_policy: summarized
