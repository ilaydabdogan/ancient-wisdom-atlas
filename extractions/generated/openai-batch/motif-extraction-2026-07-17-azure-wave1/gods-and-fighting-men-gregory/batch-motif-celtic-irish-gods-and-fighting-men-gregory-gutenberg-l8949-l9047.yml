canonical_text:
  quote: ''
  summary: Nine of the Fianna search Ireland for a pup, encounter and defeat cat-headed,
    dog-headed, and white-backed armies, and then find a hound. The passage lists
    named banners, named swords, the strange smith Lon and seven-handed smiths who
    make swords, and the origin and transmission of Finn's Storm Shield from Balor's
    poisoned head and a hazel-tree through Manannan, Luchtaine, and Tadg to Finn.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Nine of the Fianna set out to find a desired pup and search many named places
    in Ireland without finding one at first.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'They see three approaching armies of the sons of the King of Ruadhleath:
    one army is cat-headed, one is dog-headed, and one is white-backed.'
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Finn holds up a shining spear, Caoilte gives a shout heard in several named
    places, and other named Fianna answer the shout.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Fianna raise named banners associated with individual members and with
    emblems including the sun, a candle of battle, a red hand, a broom of rowan branches,
    a bloody branch, and a briar.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The Fianna attack the three armies and kill the Cat-Heads, then the Dog-Heads
    and the White-Backs.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After the battle the Fianna go to a little hill to the south with a double
    dun and find a hound from which they can get a pup.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that after searching the whole of Ireland, the Fianna did
    not find a hundred men who could match their nine.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Several swords belonging to members of the Fianna are named, including Finn's
    Mac an Luin and swords belonging to Oisin, Caoilte, Diarmuid, and Osgar.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lon, son of Liobhan, appears as a very big and ugly young man with one foot
    and one eye, a cloak of black skins, and a blunt ploughshare turning red; he says
    he is one of the smiths of the King of Lochlann.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lon runs, and Finn, Caoilte, and others follow him through many named places
    in Ireland to the sea.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: At the smithy the Fianna find four smiths working, each with seven hands;
    they watch until the swords are made and then take the swords away.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Finn has a shield called Sgiath Gailbhinn, the Storm Shield, whose call can
    be heard throughout Ireland.
  category: object
  evidence_refs:
  - ev:9
- id: obs:13
  text: Lugh cuts off Balor's head and hangs it in the fork of a hazel-tree; poison
    from the head splits and withers the tree and makes its leaves fall, and the tree
    becomes a dwelling-place for crows and ravens for fifty years.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: When Manannan has the tree dug up, poison mist rises from the roots, killing
    two groups of nine men and blinding a third group of nine.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: Luchtaine the Carpenter makes a shield from the hazel wood; Manannan gives
    the shield and a set of chessmen to Tadg, son of Nuada, and the shield later comes
