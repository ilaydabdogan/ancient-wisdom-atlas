canonical_text:
  quote: ''
  summary: The narrator returns to the tailor, is confronted by an old man who reveals
    himself as a genius descended from Eblis, and is carried to an enchanted palace
    where the wounded princess of the Ebony Isle is accused of being his lover. Both
    deny knowing one another and refuse to kill each other when ordered. The genius
    mutilates the princess, threatens to transform the narrator into an animal, and
    agrees to hear the narrator’s embedded tale of an envious neighbor and a virtuous
    man who becomes a dervish.
  language: English
