canonical_text:
  quote: ''
  summary: The passage recounts the princesses maintaining Badoura's male disguise,
    Camaralzaman sheltering with a gardener, witnessing birds kill and bury a victim
    and punish its killer, recovering Badoura's talisman, discovering treasure in
    an underground cave beneath a dead fruit tree, arranging passage by ship, dividing
    the treasure with the gardener, and concealing gold and the talisman in marked
    olive jars for transport.
