canonical_text:
  quote: ''
  summary: The Prince of Persia, acting as a physician, plans with the Princess of
    Bengal to escape from the Sultan of Cashmere. He persuades the Sultan that the
    princess must be cured in public beside the enchanted horse, using perfumes and
    smoke. During the spectacle, the princess mounts the horse, the prince mounts
    behind her, turns the peg, and they fly away to Persia, where they marry and gain
    the King of Bengal's approval. A new story begins with Sultan Kosrouschah of Persia,
    who disguises himself with his vizir to seek adventures in the city and overhears
    three sisters discussing whom they wish to marry.
  language: English
  quote_policy: summarized
