canonical_text:
  quote: ''
  summary: After losing his basket of glass through prideful imaginings, Alnaschar
    is publicly mocked and then given five hundred gold pieces by a compassionate
    high-status lady. An old woman asks him for water for prayer, refuses a small
    gift, claims to serve a rich beautiful lady, and lures him to a large house with
    promises of marriage and wealth. There he is received by the lady, then attacked
    by an armed slave, robbed, wounded, tortured with salt, and thrown through a trapdoor
    into a vault containing murdered men.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The tailor-neighbor laughs and rebukes Alnaschar for his treatment of a young
    wife, saying a vizir should punish him publicly.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Alnaschar regains his senses, recognizes that pride caused the mischief, tears
    his clothes and hair, and laments over his broken basket of glass while passers-by
    react.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A lady of high status riding on a mule hears that Alnaschar lost all his money
    in the broken glass and orders her attendant to give him a purse of five hundred
    gold pieces.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: An old woman comes to Alnaschar’s door and asks to enter so she can wash with
    water before the hour of prayer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Alnaschar gives the old woman a vessel of water, puts his gold into a long
