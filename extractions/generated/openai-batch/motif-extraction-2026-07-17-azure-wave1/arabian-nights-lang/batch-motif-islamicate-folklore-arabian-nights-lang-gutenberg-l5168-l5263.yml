  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The old woman refuses the offered money, says she belongs to a beautiful rich
    lady, and Alnaschar asks whether she can arrange for him to see that lady.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The old woman tells Alnaschar that the lady will marry him and make him master
    of her wealth, and Alnaschar follows her with his purse concealed in his clothing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The old woman brings Alnaschar to a large house, where a young Greek slave
    opens the door and Alnaschar is led through a paved court into a furnished hall.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: A richly dressed beautiful lady receives Alnaschar, speaks with him, moves
