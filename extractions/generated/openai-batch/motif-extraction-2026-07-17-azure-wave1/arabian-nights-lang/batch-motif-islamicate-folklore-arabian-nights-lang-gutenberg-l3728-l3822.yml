canonical_text:
  quote: ''
  summary: A ship reaches an island feared by mariners. Hairy dwarf-like islanders
    seize the ship and leave the crew on another shore. The stranded mariners find
    a castle containing human bones and roasting spits. A one-eyed giant enters, selects
    the fattest captive, roasts and eats him, then repeats the killing on following
    nights. The narrator proposes building rafts and, with nine companions, blinds
    the sleeping giant by heating spits and driving them into his single eye.
  language: English
  quote_policy: summarized
