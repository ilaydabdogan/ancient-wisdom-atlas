canonical_text:
  quote: ''
  summary: The young King of the Black Isles recounts how an enchantress kept her
    wounded slave alive, transformed him into half man and half marble, and changed
    his capital and people into a lake of colored fish. The Sultan devises a deception,
    kills the slave, impersonates him, compels the enchantress to restore the prince
    and the city, then kills her. The Sultan adopts the young king as heir and rewards
    the fisherman. A new tale begins in Bagdad, where a veiled lady hires a porter
    and has him carry a jar of wine from an old man’s house.
  language: English
  quote_policy: summarized
