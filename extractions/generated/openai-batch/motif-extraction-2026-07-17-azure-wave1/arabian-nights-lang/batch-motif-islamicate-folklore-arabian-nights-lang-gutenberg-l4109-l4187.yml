canonical_text:
  quote: ''
  summary: Sindbad is sealed alive in a cavernous burial vault with bread and water,
    survives among the dead by taking provisions from later burials, follows a small
    animal through a hidden crack to the seashore, gathers jewels from the cavern,
    is rescued by a passing ship after giving a false shipwreck story, returns to
    Bagdad wealthy, gives alms, and ends the account of his fourth voyage before the
    fifth begins.
  language: English
  quote_policy: summarized
