canonical_text:
  quote: ''
  summary: A sequence of royal children are sent adrift and taken in by the intendant
    of the gardens and his wife. The Sultan, angered by repeated births and influenced
    by the situation created by the jealous sisters, condemns the Sultana to public
    humiliation rather than death after intercession by the grand-vizir and courtiers.
    The three fostered children, Bahman, Perviz, and Parizade, grow up educated and
    accomplished, but the intendant dies before revealing their royal birth. Later,
    while the princes hunt, an old Muslim devotee enters Parizade's house for prayer
    and is brought before her.
  language: English
  quote_policy: summarized
