canonical_text:
  quote: ''
  summary: A fisherman opens a sealed jar and releases a smoke-like genius imprisoned
    in it. The genius recounts rebellion, punishment by the king of the genii, long
    captivity, changing vows toward any liberator, and a final vow to kill whoever
    frees him. The fisherman tricks the genius into proving he can fit back into the
    vase, reseals it, and refuses to trust him. The passage then begins an embedded
    tale about a leprous Greek king in Persia and the learned physician Douban, who
    proposes a cure and prepares a hollow polo club containing a drug.
  language: English
  quote_policy: summarized
