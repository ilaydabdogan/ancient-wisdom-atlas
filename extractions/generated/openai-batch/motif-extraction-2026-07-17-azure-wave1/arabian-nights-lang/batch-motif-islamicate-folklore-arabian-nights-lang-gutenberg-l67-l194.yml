canonical_text:
  quote: Now "The Arabian Nights"... are only fairy tales of the East.
  summary: The passage gives the title, contents, and preface to Andrew Lang's edition
    of The Arabian Nights Entertainments. The preface describes fairy tales as ancient
    orally transmitted stories, claims that similar stories recur across distant cultures
    with local variations, presents The Arabian Nights as eastern fairy tales adapted
    to Islamicate settings, describes a frame in which a wife narrates tales to a
    cruel Sultan, and notes Galland's French translation and European fascination
    with ghouls, geni, magic-working princesses, peris, rocs, dervishes, vizirs, and
    Sindbad.
  language: English
  quote_policy: quoted
