canonical_text:
  quote: ''
  summary: Sindbad forgives Hindbad, explains that his wealth came only after many
    hardships, and begins the account of his first voyage. After squandering inherited
    wealth, he joins sea merchants at Balsora. The ship lands near what appears to
    be a small green island, but it is the back of a sleeping whale; when the whale
    dives, Sindbad is left clinging to wood and drifts to another island. There he
    climbs cliffs by tree roots, finds food and water, and meets one of King Mihrage’s
    horse grooms, who takes him to a cave with other grooms and tells him he is fortunate
    to have found them.
  language: English
  quote_policy: summarized
