  quote: '"Wretch, receive the reward of your prying, and become a dog."'
  summary: The narrator secretly follows his wife Amina at night to a cemetery, where
    she and a female ghoul exhume and eat a newly buried corpse. When he later hints
    that he saw her, Amina becomes enraged, uses water and murmured words to transform
    him into a dog, beats and pursues him, and he escapes into the street before taking
    refuge in a cookshop.
