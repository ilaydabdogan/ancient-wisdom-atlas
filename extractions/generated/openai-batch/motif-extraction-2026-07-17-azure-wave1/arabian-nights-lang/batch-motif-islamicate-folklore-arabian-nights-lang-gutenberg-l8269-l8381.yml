canonical_text:
  quote: ''
  summary: Aladdin is spared execution when the crowd presses into the courtyard.
    The Sultan demands the return of his daughter and gives Aladdin forty days. After
    wandering in despair, Aladdin rubs his magic ring and the ring-genie transports
    him to the stolen palace in Africa. Aladdin reunites with the princess, learns
    that the African magician has the lamp, and devises a plan in which the princess
    feigns reconciliation and gives the magician drugged wine. After the magician
    falls lifeless, Aladdin recovers the lamp and commands the palace and its occupants
    to return to China. The Sultan sees the palace restored, hears Aladdin's account,
    and proclaims a feast.
  language: English
  quote_policy: summarized
