canonical_text:
  quote: ''
  summary: Zobeida requires the guests to tell their histories and reasons for coming
    if they wish to leave unharmed. The porter briefly recounts how he was hired and
    brought into the house, then asks to stay and hear the others. One Calender begins
    his story, saying he is a king’s son and explaining that his tale concerns the
    loss of his right eye and his Calender dress. He describes his close relationship
    with his cousin, a prince, who has secretly built a structure and extracts an
    oath of secrecy. The cousin brings an unnamed richly dressed lady, sends the narrator
    to escort her to a newly built dome-like tomb, then opens an empty sepulchre to
    reveal a trap-door and spiral staircase. The lady and prince descend; the narrator
    later cannot find the tomb again and remains silent because of his oath. Returning
    home, he learns that his father has been killed in a mutiny, the grand-vizir has
    taken the throne, and he is under arrest.
  language: English
  quote_policy: summarized
