canonical_text:
  quote: ''
  summary: Camaralzaman, separated from Princess Badoura, learns from a gardener that
    return by land is long and that the annual ship has just been missed, so he stays
    in refuge. Badoura wakes to find Camaralzaman absent and her talisman gone, conceals
    the disappearance, disguises herself as him, and travels to the Ebony Island.
    King Armanos receives the supposed prince, offers his daughter and crown, and
    has the disguised Badoura acclaimed as successor. Badoura privately reveals her
    identity to Princess Haiatelnefous, who responds with sympathy.
  language: English
  quote_policy: summarized
