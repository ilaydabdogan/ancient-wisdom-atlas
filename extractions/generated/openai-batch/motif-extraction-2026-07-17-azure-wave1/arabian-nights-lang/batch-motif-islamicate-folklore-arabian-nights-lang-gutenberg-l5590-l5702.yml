canonical_text:
  quote: ''
  summary: The passage introduces the island kingdom of Khaledan, King Schahzaman’s
    distress at lacking an heir, the vizir’s advice to seek holy intercession, and
    the birth of Prince Camaralzaman after prayers. The prince is educated as a royal
    heir, but repeatedly refuses his father’s wish that he marry. The king, vizir,
    and Sultana Fatima attempt to persuade him, and the prince explains that he objects
    to an arranged marriage with an unknown woman and no choice of his own.
  language: English
  quote_policy: summarized
