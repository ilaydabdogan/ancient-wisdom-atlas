- id: obs:3
  text: When the fish are turned, the wall opens and a very tall black slave carrying
    a large green stick comes out, touches the fish, and asks whether they are doing
    their duty.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fish lift their heads and answer with a formula about reckoning, paying
    debts, flying, conquering, and being content.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The black slave overturns the pan, the fish become cinders, and he returns
    into the wall, which closes around him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sultan says the fish signify a mystery that he must clear up.
  category: speech
  evidence_refs:
