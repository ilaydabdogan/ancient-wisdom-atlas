  category: setting
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Sultan hears a lamenting voice and finds a sad, richly clothed young man
    seated on a slightly raised throne.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: The young man says he cannot rise to honor the Sultan and shows that from
