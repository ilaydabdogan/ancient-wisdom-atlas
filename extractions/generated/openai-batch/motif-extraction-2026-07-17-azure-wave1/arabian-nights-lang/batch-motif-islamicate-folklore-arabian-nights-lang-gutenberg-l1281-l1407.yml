canonical_text:
  quote: ''
  summary: A repeated marvel occurs when cooked colored fish speak after a wall opens
    and supernatural figures appear. The Sultan traces the fish to a hidden lake among
    hills, travels alone to investigate, discovers an empty black marble palace, and
    meets a young ruler whose lower body has become black marble. The young ruler
    begins explaining the altered Black Isles and an enchantress wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A cook prepares fish; a wall opens, a damsel appears, addresses the fish,
    receives an answer, overturns the pan, and disappears.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Sultan asks the fisherman to obtain four more different-colored fish and
    has them cooked privately with the grand-vizir present.
  category: action
  evidence_refs:
