canonical_text:
  quote: This happened every morning. The Sultana told a story, and the Sultan let
    her live to finish it.
  summary: Scheherazade arranges for Dinarzade to request a story before dawn on the
    night of Scheherazade's marriage to Schahriar. With the Sultan's permission she
    begins the story of a merchant who, after resting by a tree and fountain in the
    desert, is confronted by an enraged genius accusing him of killing the genius's
    son with a thrown date-stone. Scheherazade stops at daybreak, and the Sultan postpones
    killing her in order to hear the story's end. The passage then states that this
    pattern recurs each morning. In the embedded tale, the merchant asks the genius
    for a short delay to farewell his family and make his will.
  language: English
  quote_policy: quoted
