canonical_text:
  quote: '"The man is no more dead than I am," he said; "watch me."'
  summary: 'The passage concludes several nested stories: the barber recounts his
    brother''s captivity and rescue, the tailor explains how the hunchback seemed
    to die from a fish bone and how the body was moved among several people, and the
    Sultan summons the barber. The barber examines the hunchback, removes the bone,
    and the hunchback revives. The Sultan orders the histories recorded, pardons and
    robes the implicated men, and rewards the barber.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The barber's brother lived for twenty years with the Barmecide, managing his
    house and affairs, before the Barmecide died without heirs and the brother was
    left poor again.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The brother joined a caravan of pilgrims going to Mecca; the caravan was attacked
    by Bedouins, pillaged, and the pilgrims were taken prisoner.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The brother became a slave, was beaten for ransom, and was eventually left
    on a camel at the top of a high barren mountain until the barber rescued him.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: After hearing the barber's tale, the Caliph laughed, called him well named
    as 'the Silent,' and ordered him to leave the town and not return.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The tailor says the company judged the barber to be a chatter-box, then later
    the hunchback came to him half drunk, singing and playing a drum.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At supper, a fish bone lodged in the hunchback's throat, and he was believed
    to have died suddenly despite attempts to help him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: To divert suspicion, the tailor carried the body to a Jewish physician; it
    was then placed in the purveyor's chamber, propped in the street, and thought
    to have been killed by the merchant.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: The tailor asked the Sultan to decide whether the group deserved mercy or
    punishment, life or death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Sultan was pleased by the stories, wanted the barber brought before him,
    and sent an usher with the tailor to find him.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The barber asked why the Jew, Christian, Mussulman, and dead body were present,
    heard the hunchback's story, and asked to examine the body.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: The barber rubbed the hunchback's neck with balsam ointment, opened his mouth,
    removed the bone with pincers, and the hunchback sneezed, stretched, and opened
    his eyes.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The Sultan ordered the histories of the hunchback and the barber written in
    the archives, clothed the tailor, doctor, purveyor, and merchant in robes, and
    gave the barber a pension.
  category: action
  evidence_refs:
  - ev:7
