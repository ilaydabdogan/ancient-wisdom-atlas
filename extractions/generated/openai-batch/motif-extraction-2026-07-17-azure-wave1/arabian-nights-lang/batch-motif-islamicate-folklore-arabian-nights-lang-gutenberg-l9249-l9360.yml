canonical_text:
  quote: ''
  summary: Ali Cogia travels from Bagdad to Mecca and then through other trading destinations,
    remaining away for seven years. During his absence, the merchant who keeps his
    sealed vase of olives opens it despite his wife's warning, discovers gold beneath
    the olives, steals the gold, and replaces the olives. Ali returns, retrieves the
    vase, discovers the gold missing, and confronts the merchant, who begins to deny
    having touched it.
  language: English
  quote_policy: summarized
