canonical_text:
  quote: '"Look at me, princess, and you will see that I am no doctor, but the Prince
    of Persia, who has come to set you free."'
  summary: The Sultan of Cashmere seeks physicians to cure the Princess of Bengal's
    apparent madness. The princess has been feigning madness to avoid a forced marriage.
    Prince Firouz Schah hears of her condition, reaches Cashmere, disguises himself
    as a physician, observes her secretly, gains private access, reveals himself by
    whispering, and learns that she has maintained the deception out of fidelity to
    him.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The Sultan of Cashmere summons court doctors to consult about the princess's
    condition and orders that they be introduced into her chamber one by one according
    to rank.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The princess anticipates that a pulse examination would reveal her good health,
    so she responds to approaching physicians with violent paroxysms that prevent
    them from touching her; she accepts potions she believes harmless.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the court doctors fail, the Sultan calls city doctors, physicians from
    other towns, and foreign physicians from neighboring states, offering expenses
    and a reward, but none succeeds.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Prince Firouz Schah, while wandering sadly, hears in an Indian city that the
    Princess of Bengal went mad on the day she was to marry the Sultan of Cashmere;
    he travels to Cashmere and seeks details at an inn.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The prince obtains a doctor's robe and uses his travel-grown beard to present
    himself as a physician who possesses effective secret remedies.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Sultan tells the disguised prince that the sight of a doctor enrages the
    princess, then leads him to a room under the roof with an opening through which
    he can observe her unseen.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: The prince sees the princess reclining on a sofa with tears in her eyes and
    singing softly about her sad destiny and the beloved from whom she has been deprived.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: After observing her, the prince reports that her condition is not incurable
    and says that he must see and speak with her alone.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:9
  text: When the princess sees the physician's robe, she reacts with fury and insults
    him; the prince then whispers that he is not a doctor but the Prince of Persia
    who has come to free her.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: At the sound of his voice, the princess becomes calm and joyful; the prince
    explains his despair, his oath to follow her, and his discovery of her in Cashmere.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The princess explains that she played the part of a mad woman to avoid marriage
    to the Sultan, who had not asked her consent, and that she would rather die than
    be forced into that union and break faith with the prince she loved.
  category: speech
  evidence_refs:
  - ev:11
