canonical_text:
  quote: ''
  summary: Sindbad is honored by the King of Serendib, explores the island and its
    high mountain associated with Adam, then carries the king's letter and gifts to
    Caliph Haroun al Raschid. He describes the king's riches, procession, mortality
    chant, and direct justice. The Caliph rewards him. The next voyage begins when
    the Caliph summons Sindbad to carry a return gift and letter to Serendib.
  language: English
