canonical_text:
  quote: ''
  summary: 'The Caliph notices the strange conduct of a blind beggar and a horseman
    and has them summoned. In the palace, the blind man, Baba-Abdalla, says his conduct
    is expiation for a grave sin and begins his story: as a wealthy camel owner returning
    from Balsora, he meets a dervish under a tree, hears of a vast hidden treasure
    nearby, reacts with greed, and is told by the dervish to swear to divide the loaded
    camels equally.'
  language: English
  quote_policy: summarized
