canonical_text:
  quote: ''
  summary: A hunchback dies suddenly at supper after swallowing a fish bone. The tailor
    and his wife fear being blamed and secretly place the body at a Jewish doctor's
    house. The doctor accidentally kicks the body down the stairs and thinks he has
    killed the patient. He and his wife move the corpse through a chimney into a Muslim
    purveyor's room, where the purveyor mistakes it for a thief and beats it, then
    thinks he has murdered a man. He leaves the body in the street, where a drunken
    Christian merchant collides with it and attacks it, thinking he is being assaulted.
  language: English
  quote_policy: summarized
