canonical_text:
  quote: ''
  summary: 'Princess Parizade installs three marvels: a singing bird in a cage, a
    planted branch that becomes a tree, and Golden Water that becomes a high fountain.
    Her brothers Bahman and Perviz meet the Sultan while hunting, display skill and
    courage, and receive an invitation to stay with him. Because they do not act without
    consulting their sister, the Sultan gives golden balls to remind them to seek
    her advice. Parizade asks the wise Talking Bird, who tells them to accept the
    Sultan’s proposal and invite him to their house.'
  language: English
  quote_policy: summarized
