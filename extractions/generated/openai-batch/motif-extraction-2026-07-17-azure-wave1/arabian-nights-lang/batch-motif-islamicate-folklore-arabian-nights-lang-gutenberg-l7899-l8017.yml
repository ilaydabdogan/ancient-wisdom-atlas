canonical_text:
  quote: ''
  summary: A false uncle leads Aladdin to a valley between mountains, opens an underground
    place by fire, powder, and words, and sends him to retrieve a lamp through dangerous
    halls and an enchanted garden. Aladdin keeps the lamp, is sealed inside, and escapes
    when a ring summons a genie. The lamp later summons another genie who provides
    food and wealth. Aladdin sees the veiled princess at the bath, falls in love,
    and sends his mother to petition the Sultan with jewel-like fruits from the underground
    garden.
  language: English
  quote_policy: summarized
