canonical_text:
  quote: "“The Golden Door, alone, forbear to open, as you value your own peace...”"
  summary: The narrator/prince frees himself after landing near a roc, reaches a splendid
    castle with a hundred doors, and is welcomed by forty princesses. After thirty-nine
    days of hospitality, the princesses leave for forty days, give him keys, and forbid
    him to open the Golden Door. During their absence he explores other chambers,
    then opens the forbidden door, is overcome by perfume, enters a vaulted room,
    finds a black winged horse, rides it into the sky, and loses his right eye when
    the horse throws him on a castle terrace.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: After his feet touch the ground, the narrator cuts the threads binding him;
