  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: At night the ladies illuminate the castle with many tapers, serve supper,
    sing, dance, and conduct the narrator to a prepared sleeping room at midnight.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: After thirty-nine days, the women come to the narrator in tears and say they
    must leave him, perhaps never to see him again unless he has sufficient self-command.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: One woman explains that they are all princesses, each a king’s daughter, and
