canonical_text:
  quote: ''
  summary: 'A frame-story guest finishes his account and is permitted to remain. The
    Second Calender, a king''s son, begins his life story: he describes his royal
    education, journey toward India, robbery by bandits, flight into unfamiliar country,
    refuge in a cave, arrival at a beautiful city, aid and warning from a tailor,
    and his adoption of woodcutting for survival.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The prior narrator says a lucky star led his party to a door where they knocked
    and received shelter for the night.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Zobeida says she is satisfied and permits the calender to go; the calender
    asks to stay and hear the other histories, and this is allowed.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Second Calender, called the son of a king, says that explaining the loss
    of his right eye requires telling the story of his whole life.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The king, his father, arranged his education in reading, writing, the Koran,
    commentary, traditions about the Prophet, history, poetry, geography, chronology,
    and outdoor exercises.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The young prince especially liked writing Arabic characters, surpassed his
    masters, and gained a reputation that reached India.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Sultan of the Indies sent an ambassador with presents and an invitation;
    the prince's father accepted, and the prince set out for India with the ambassador,
    a small suite, and ten camels carrying rich presents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After about a month of travel, a dust cloud was revealed to conceal fifty
    robbers, who attacked the party; the ambassador and followers were made prisoners.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The narrator, though wounded, escaped on horseback; the horse later died from
    a wound, and the robbers were occupied quarrelling over booty.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: In unfamiliar country, the narrator avoided the main road, bound his wound,
    walked until he reached a cave at the foot of a mountain, and spent the night
    there eating gathered fruit.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After wandering for a month, he reached a beautiful city with winding streams
    and eternal spring, while his own body and clothing appeared burned, ragged, and
    barefoot.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:11
  text: A tailor perceived that the narrator's condition did not match his background,
    heard his story, warned him that the local prince was his father's enemy, and
    gave him food and lodging.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The tailor advised him to wear a short coat, cut firewood, and sell it; he
    gave him a hatchet and cord, and the narrator began working with poor woodcutters.
  category: action
  evidence_refs:
  - ev:9
