canonical_text:
  quote: ''
  summary: Noureddin discovers that his friends abandon him after his fortune is gone.
    The beautiful Persian advises him first to sell his slaves and furniture and finally
    offers that he sell her so he can rebuild his life elsewhere. At the slave market,
    the dealer Hagi Hassan appraises her and warns Noureddin against Saouy, who tries
    to acquire her. Hagi Hassan proposes a pretense to prevent the sale; Saouy attempts
    to seize her by force, and Noureddin beats him with public approval. Saouy then
    goes to the palace to complain to the king.
  language: English
  quote_policy: summarized
