canonical_text:
  quote: ''
  summary: 'Agib, a ruler fond of sea voyages, sails with a fleet, is driven off course
    by a storm, and reaches the destructive Black Mountain, whose adamant draws iron
    from ships. The fleet sinks, but Agib survives, climbs the mountain, and receives
    dream instructions from an old man: dig up a brass bow and lead arrows, shoot
    the summit statue, bury the horse, board a metal man''s boat, and avoid uttering
    Allah''s name. Agib follows the instructions until land appears, then forgets
    the warning and praises Allah; the boat and metal man sink, leaving him to swim
    until a wave casts him ashore on an island where he hides in a tree as a ship
    approaches.'
  language: English
  quote_policy: summarized
