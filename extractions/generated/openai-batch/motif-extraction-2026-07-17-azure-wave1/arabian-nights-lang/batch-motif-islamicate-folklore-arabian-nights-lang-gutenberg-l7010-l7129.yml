canonical_text:
  quote: ''
  summary: The passage concludes an episode in which Princess Badoura reveals that
    she had been acting as king, explains herself to King Armanos, arranges for Prince
    Camaralzaman to marry Princess Haiatelnefous, and yields queenly precedence while
    Camaralzaman is proclaimed king. It then begins the tale of Noureddin and the
    Fair Persian by introducing Balsora, King Zinebi, the contrasting vizirs Khacan
    and Saouy, and the royal commission to obtain an exceptionally beautiful, wise,
    and accomplished enslaved woman, whom Khacan names the Fair Persian.
  language: English
