canonical_text:
  quote: ''
  summary: 'The passage concludes Noureddin''s episode: Saouy obtains royal permission
    to execute him, but Giafar arrives from the Caliph, frees Noureddin, and Saouy
    is punished. Noureddin refuses personal revenge and refuses rule over Balsora.
    The passage then begins the Aladdin story: Aladdin is an idle tailor''s son; a
    famous African magician claims to be his uncle, gives gifts and promises advancement,
    and leads him outside the city toward gardens, a fountain, and the mountains.'
  language: English
  quote_policy: summarized
