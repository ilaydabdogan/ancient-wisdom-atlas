canonical_text:
  quote: ''
  summary: 'Sindbad escapes the Old Man of the Sea by letting him drink strong wine
    from a gourd, then throwing him down when his grip loosens. Mariners identify
    the creature as a known strangler on the island and take Sindbad aboard. In a
    stone-built town, a friendly merchant guides Sindbad into a coconut-gathering
    practice in which men throw stones at monkeys so the monkeys retaliate by throwing
    down coconuts. Sindbad trades these goods, gathers pearls, returns wealthy to
    Bagdad, gives a tenth to the poor, and rests. The frame narrative then has Sindbad
    reward Hindbad and begin recounting his sixth voyage: after a period of repose
    he departs again, is driven off course by storms and currents, and is wrecked
    at the foot of a sheer mountain rising from the sea, where the captain says no
    shipwrecked mariner has ever returned.'
  language: English
  quote_policy: summarized
