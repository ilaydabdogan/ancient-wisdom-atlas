canonical_text:
  quote: ''
  summary: A prince hunting a stag becomes separated from his vizir, finds a weeping
    woman who claims to be an Indian king's daughter, and discovers she is an ogress
    intending to feed him to her children. He escapes and reports the vizir's carelessness;
    the king has the vizir strangled. The speaking vizir then uses the tale to warn
    the Greek king against the physician Douban. Persuaded, the king orders Douban's
    death. Douban asks to settle his affairs and offers a book that, after his beheading,
    will let his severed head answer the king's questions. The execution occurs; the
    head speaks and tells the king to open the book, whose leaves stick together.
  language: English
  quote_policy: summarized
