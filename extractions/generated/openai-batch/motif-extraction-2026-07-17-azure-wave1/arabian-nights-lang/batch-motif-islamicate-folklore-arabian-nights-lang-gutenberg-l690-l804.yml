  quote: ''
  summary: A merchant-narrator recounts a trading voyage with two brothers, his marriage
    to a poorly dressed woman who proves to be a fairy, the brothers' attempted murder
    of the couple by throwing them into the sea, the fairy's rescue and transformation
    of the brothers into black dogs, and the use of marvelous stories to persuade
    a genius to remit a merchant's punishment. The passage then begins the story of
    a poor old fisherman whose first three net casts bring worthless objects and whose
    fourth brings a sealed yellow pot.
