canonical_text:
  quote: ''
  summary: Khacan fears dishonor after Noureddin's offense and, with his wife's advice,
    arranges a staged reconciliation in which Noureddin is spared and required to
    marry the beautiful Persian and never part with her. Khacan later dies after charging
    Noureddin to keep this promise. After a period of mourning, Noureddin returns
    to society, gathers ten young companions, spends lavishly, ignores the Persian's
    warnings and his steward's accounts, gives away property, and is finally told
    by the steward that his funds and income are exhausted while one friend secretly
    overhears.
  language: English
  quote_policy: summarized
