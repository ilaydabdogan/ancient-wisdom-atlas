canonical_text:
  quote: ''
  summary: A first-person voyager undertakes a second sea journey, is left asleep
    on an uninhabited island, finds a giant roc egg, ties himself to the roc’s foot,
    is carried through the air, and is deposited in a steep valley filled with diamonds
    and huge serpents. He shelters overnight in a cave and is startled the next day
    by something falling nearby.
  language: English
  quote_policy: summarized
