    seas, but the king imprisons him until Prince Firouz Schah is safe. The prince
    ascends high into the air, discovers a hidden peg to descend, lands at night on
    the roof of a palace, enters through guarded rooms, wakes the princess of Bengal,
    asks protection, and is given hospitality, food, and lodging.
