canonical_text:
  quote: ''
  summary: 'The passage closes Alnaschar''s misfortunes: a judge confiscates his goods,
    expels him, robbers strip him, and the narrator rescues and shelters him. It then
    begins the story of Schacabac, the barber''s sixth brother, who loses his inheritance,
    becomes a beggar, enters a Barmecide mansion, and is drawn into the host''s pretense
    of washing, dining, and drinking imaginary food and wine. After Schacabac plays
    along and pretends drunkenness enough to strike the host, the Barmecide laughs,
    embraces him, and rewards him with a real supper, entertainment, friendship, and
    clothing.'
  language: English
  quote_policy: summarized
