canonical_text:
  quote: ''
  summary: Marzavan travels widely seeking news connected to Princess Badoura and
    hears of the similarly afflicted Prince Camaralzaman. After surviving a shipwreck
    near the prince's palace, he gains access to the court, recognizes the prince's
    resemblance to Badoura, and privately tells him of her sufferings. The prince
    recovers from hope of reunion. Marzavan then devises a hunting pretext and stages
    a false sign of the prince's death with a bloodied coat at a forest crossroads
    so they can continue toward China.
  language: English
  quote_policy: summarized
