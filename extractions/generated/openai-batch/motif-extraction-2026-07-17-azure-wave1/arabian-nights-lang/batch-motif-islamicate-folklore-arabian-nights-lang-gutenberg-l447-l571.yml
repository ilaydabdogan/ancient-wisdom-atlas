canonical_text:
  quote: ''
  summary: A merchant obtains a one-year delay from a genius who intends to kill him,
    returns home to settle his affairs, and comes back to the appointed fountain.
    Three old men arrive as witnesses. When the genius appears with a sword, the first
    old man offers to tell the story of himself and the hind in exchange for reducing
    the merchant's punishment. In that embedded story, the hind is identified as the
    old man's wife, who used magic to transform his adopted son into a calf and the
    boy's mother into a cow; at Bairam the transformed cow is nearly sacrificed, then
    killed by the steward after the old man's pity prevents him from killing her himself.
  language: English
  quote_policy: summarized
