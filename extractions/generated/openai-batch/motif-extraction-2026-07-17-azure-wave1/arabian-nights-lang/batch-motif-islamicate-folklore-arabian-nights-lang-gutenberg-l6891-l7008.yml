canonical_text:
  quote: ''
  summary: A captain returns by ship to the Island of Idolaters, abducts Prince Camaralzaman
    at night, and brings him to the palace of the Ebony Island. Princess Badoura,
    ruling in male disguise as King Armanos the younger, recognizes him, conceals
    her identity, raises him to high office, and later uses the talisman associated
    with their separation to lead him toward recognition. She changes back into female
    attire, and Camaralzaman recognizes and embraces her.
  language: English
  quote_policy: summarized
