canonical_text:
  quote: Whoso meddles in affairs that are no business of his, will hear truths that
    will not please him.
  summary: Amina buys abundant provisions, flowers, scents, and spices while a porter
    carries them, then brings him to a palace where Sadie opens the door. Inside,
    the porter sees an ornate court, a throne, a water basin, and the eldest sister
    Zobeida. The porter is paid but asks to remain for dinner; Zobeida permits this
    only on conditions of politeness and secrecy. After wine, song, and sunset, he
    asks to stay overnight, and Zobeida adds that he must ask no questions about anything
    he sees. Three one-eyed, clean-shaven Calenders then arrive at night seeking admittance,
    and Zobeida permits them to enter only if they accept the warning inscription
    over the door.
  language: English
  quote_policy: quoted
