canonical_text:
  quote: ''
  summary: Ali Cogia disputes with a merchant over a vase he had entrusted to him,
    saying it contained olives and a thousand gold pieces. The merchant denies touching
    the vase or knowing of the gold. A Cadi accepts the merchant's oath and declares
    him innocent. Ali petitions Caliph Haroun-al-Raschid. That evening the Caliph,
    disguised with Giafar and Mesrour, observes children staging a mock trial of the
    same case. The child acting as Cadi asks to examine the vase before allowing an
    oath.
  language: English
