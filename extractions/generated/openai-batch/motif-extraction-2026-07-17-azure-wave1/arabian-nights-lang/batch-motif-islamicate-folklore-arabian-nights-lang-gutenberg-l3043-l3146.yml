canonical_text:
  quote: '"This is the fruit of idleness, and of our wicked lives."'
  summary: After being left alone on an island, the narrator crosses toward the mainland,
    reaches a red copper castle, meets a tall old man and ten right-eye-blind young
    men, observes their nightly blackening and lamentation ritual, insists on learning
    its cause despite warnings, and is sewn into a sheep-skin so a roc will carry
    him to a mountain near a gold and jewel-covered castle.
  language: English
  quote_policy: quoted
