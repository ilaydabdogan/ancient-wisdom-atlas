canonical_text:
  quote: ''
  summary: Khacan buys a beautiful Persian slave from a merchant for the king, lodges
    her in his household for rest, bath, and dress, and warns her to avoid his son
    Noureddin. Noureddin and the Persian become mutually attracted. After the Persian
    is bathed and dressed, Khacan's wife orders guards to keep Noureddin out, but
    he forces them away, enters, and deceives the Persian by saying his father has
    given her to him. The wife reveals the deception, fears Khacan will punish Noureddin,
    and Khacan laments that the king may kill both father and son; his wife proposes
    selling jewels to buy another slave.
  language: English
  quote_policy: summarized
