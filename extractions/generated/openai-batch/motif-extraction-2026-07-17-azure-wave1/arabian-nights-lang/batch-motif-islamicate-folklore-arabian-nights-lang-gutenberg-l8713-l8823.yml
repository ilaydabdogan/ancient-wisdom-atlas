canonical_text:
  quote: The blindness of your heart has wrought the blindness of your body.
  summary: Baba-Abdalla recounts how a dervish gave him an ointment that revealed
    hidden treasures when applied to the left eye but caused blindness when applied
    to the right. Driven by avarice, he insisted on the forbidden application, became
    blind, lost his wealth, and became a penitent beggar. The Caliph then declares
    that he has suffered enough and provides for his needs before turning to Sidi-Nouman.
  language: English
  quote_policy: quoted
