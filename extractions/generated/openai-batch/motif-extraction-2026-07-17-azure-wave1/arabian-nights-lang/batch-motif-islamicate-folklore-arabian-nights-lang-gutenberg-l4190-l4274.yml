canonical_text:
  quote: ''
  summary: The first-person narrator leaves quiet life for another sea voyage in his
    own ship. On an unknown island, accompanying merchants break open a nearly hatched
    roc egg, kill the young bird, and roast it. The parent rocs return, grieve over
    the nest, and attack the ship with huge stones, destroying it. The narrator survives
    by clinging to driftwood and reaches another island with trees, fruit, and water.
    There he carries a feeble-seeming old man across a river, but the man clamps onto
    his neck and forces him to carry him continually. Later the narrator fills a gourd
    with grape juice, leaves it in a tree, and drinks the resulting wine.
  language: English
  quote_policy: summarized
