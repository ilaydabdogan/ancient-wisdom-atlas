  summary: The Princess of Bengal is wakeful after seeing the Prince of Persia, prepares
    herself with unusual care and royal ornaments, and meets him privately. Prince
    Firouz Schah recounts the Persian festival of Nedrouz, the Indian owner's enchanted
    horse, the proposed exchange for his sister's hand, and his uncontrolled flight
    on the horse that brought him to the palace roof. He then thanks the princess
    and declares that his heart has belonged to her from the first moment he saw her.
  language: English
