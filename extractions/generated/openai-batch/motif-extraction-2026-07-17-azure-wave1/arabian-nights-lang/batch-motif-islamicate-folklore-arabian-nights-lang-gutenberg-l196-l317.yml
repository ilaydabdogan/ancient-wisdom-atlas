canonical_text:
  quote: ''
  summary: A prefatory note recalls reading The Arabian Nights in childhood. The narrative
    then introduces a prosperous Sassanid king, his two sons Schahriar and Schahzeman,
    Schahriar's discovery of his wife's deception, his order to kill her, and his
    ensuing practice of marrying and killing a new bride each day. The town laments.
    The grand-vizir's learned and courageous daughter Scheherazade volunteers to marry
    the Sultan in order to stop the killings, despite her father's objections and
    the Sultan's warning that the vizir must kill her if required. Scheherazade prepares
    for the marriage and calls for her sister Dinarzade.
  language: English
  quote_policy: summarized
