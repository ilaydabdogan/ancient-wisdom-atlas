canonical_text:
  quote: ''
  summary: Camaralzaman falls into despair while his father withdraws from public
    affairs until advised to move with him to an island castle. Meanwhile the Princess
    of China is returned by two genii to her bed, wakes alone, insists that a young
    man slept beside her, and is treated as mad. She shows a ring as proof, refuses
    all other marriage, is confined, and becomes the object of a fatal challenge in
    which suitors must cure her or die. Marzavan, her nurse’s son and foster-brother,
    secretly visits her, hears her account, and departs to search other countries
    for the absent beloved.
  language: English
  quote_policy: summarized
