  summary: Prince Firouz Schah persuades the Princess of Bengal to flee with him on
    the enchanted horse to Persia. After he returns to his father and secures consent
    for their marriage, the released Indian deceives the country-house doorkeeper
    and the princess, mounts the enchanted horse with her, and flies over the city
    in revenge.
