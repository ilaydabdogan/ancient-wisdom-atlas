  text: The princess fears that Prince Firouz Schah may not know how to manage the
    horse, but he reassures her and they plan a secret flight from the palace.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Early in the morning, while the palace sleeps, the princess joins the prince
    on the roof; they mount the horse, she holds his belt, he touches the screw, and
    the horse rises from the earth.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The horse travels rapidly, and after two and a half hours the prince sees
    the Persian capital below and leaves the princess in a country house outside the
    town.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The prince is welcomed by the people, finds the Sultan and ministers in mourning,
    and tells his father that the Princess of Bengal waits for the Sultan's consent
    to their marriage.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The Sultan consents to the marriage, promises to bring the princess back for
