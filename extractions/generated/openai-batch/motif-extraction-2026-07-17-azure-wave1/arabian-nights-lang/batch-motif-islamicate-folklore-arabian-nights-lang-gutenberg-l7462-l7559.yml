canonical_text:
  quote: ''
  summary: Saouy accuses Noureddin before the king, prompting a royal order to seize
    Noureddin and the fair Persian. A former slave of Khacan warns them and gives
    them money, allowing them to flee by ship to Bagdad. There they sleep outside
    the Caliph's walled garden, are admitted by the doorkeeper Scheih Ibrahim, enter
    the pavilion, eat, and ask him to procure wine despite his stated religious objection.
  language: English
  quote_policy: summarized
