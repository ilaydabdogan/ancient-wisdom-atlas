canonical_text:
  quote: ''
  summary: Noureddin and the beautiful Persian feast, drink wine, and draw Scheih
    Ibrahim into drinking with them. The Persian and Noureddin light all the candles
    and lustres and open the pavilion windows, causing the Caliph Haroun-al-Raschid
    to notice the illuminated pavilion from his palace. The Caliph and Giafar go in
    disguise to investigate. After hearing the Persian sing and play the lute, the
    Caliph decides to enter without being recognized. He encounters a fisherman illegally
    fishing in the garden lake, pardons him, takes two fish, exchanges clothes with
    him, and returns to the pavilion claiming to be the fisher Kerim.
  language: English
  quote_policy: summarized
