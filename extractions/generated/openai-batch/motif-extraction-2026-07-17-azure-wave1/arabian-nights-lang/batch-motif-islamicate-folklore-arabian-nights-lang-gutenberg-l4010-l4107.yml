canonical_text:
  quote: ''
  summary: Sindbad prospers on an island by introducing riding equipment unknown to
    the king and his subjects. The king arranges his marriage to a local woman. Sindbad
    then learns that the island's law requires a living spouse to be buried with a
    deceased spouse. After witnessing a neighbor's burial with his dead wife and confirming
    that the rule applies to married foreigners, Sindbad's own wife dies and his procession
    reaches the mountain where the burials occur.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The island is populous, prosperous, and commercially active, and the king
    treats Sindbad with special favour.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: All men on the island ride horses without bridles or stirrups, and the king
    says he has never heard of such things.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sindbad directs craftsmen to make a saddle, bit, and spurs, then presents
    them to the king and shows him how to use them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The king is delighted with the riding equipment, rewards Sindbad, and principal
    officers also receive saddles, making Sindbad wealthy and important.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The king asks Sindbad to marry a rich and beautiful local woman and remain
    among the islanders.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Sindbad accepts the bride because the king's will is law, but privately intends
    to escape and return to Bagdad.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A neighbor's wife dies, and the grieving neighbor says he has only an hour
    left to live.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The neighbor states that island law requires a living husband to go to the
    grave with his dead wife and a living wife with her dead husband, and that the
    law is ancient and unchanging.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The neighbor's dead wife is dressed in rich robes and jewels, placed on an
    open bier, and carried in procession to a high mountain while the husband follows
    in a black mantle.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: At the burial site, the corpse is lowered into a deep pit; the living husband
    is placed on another bier with seven loaves and a pitcher of water, lowered into
    the cavern, and the opening is sealed with a stone.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Sindbad tells the king that the custom of burying the living with the dead
    is cruel and horrible; the king replies that the law applies to everyone, including
    married foreigners.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Sindbad's wife falls ill and dies; her body is arrayed in rich robes and jewels,
    and Sindbad follows the funeral procession, led by the king and nobles, to the
    fatal mountain by the sea.
  category: sequence
  evidence_refs:
  - ev:9
