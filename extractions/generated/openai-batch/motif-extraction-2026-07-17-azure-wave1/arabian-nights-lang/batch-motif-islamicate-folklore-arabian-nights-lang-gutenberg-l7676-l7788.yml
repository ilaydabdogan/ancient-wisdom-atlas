canonical_text:
  quote: ''
  summary: The Caliph, disguised as a fisherman, receives gifts and music from Noureddin
    and the fair Persian, learns Noureddin's story, and sends him to Balsora with
    a letter ordering the king to yield his throne. After Scheih Ibrahim attacks the
    supposed fisherman, the Caliph reveals himself by changing clothes and sitting
    on his throne, forgives Scheih Ibrahim, and promises the Persian future royal
    status. In Balsora, Saouy secretly destroys the validating formula on the Caliph's
    letter and argues that the king need not obey it.
  language: English
  quote_policy: summarized
