canonical_text:
  quote: ''
  summary: A prince recounts how a hostile vizir mutilated him and ordered his execution,
    how an executioner spared him into exile, how he and his uncle discovered the
    uncle's son and a lady half-burned in an underground tomb, and how renewed invasion
    forced him to disguise himself as a calender and travel to Bagdad, where he joined
    two other calenders in shared misfortune.
  language: English
  quote_policy: summarized
