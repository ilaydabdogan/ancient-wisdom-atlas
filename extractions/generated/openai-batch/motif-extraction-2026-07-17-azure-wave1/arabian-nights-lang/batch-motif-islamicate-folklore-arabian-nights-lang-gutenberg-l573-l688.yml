canonical_text:
  quote: ''
  summary: The first old man explains that a calf he spared from sacrifice was his
    enchanted son, while the son's mother had already been sacrificed as a cow. The
    steward's daughter, who knows magic, reveals the transformation, restores the
    son with water and spoken words, marries him by agreement, and changes the old
    man's wife into a hind as punishment. The genius grants the old man a third part
    of the merchant's punishment. A second old man then begins a tale about himself
    and two black dogs, whom he identifies as his brothers; he recounts their inheritance,
    mercantile ventures, ruinous travels, and his aid to them.
  language: English
  quote_policy: summarized
