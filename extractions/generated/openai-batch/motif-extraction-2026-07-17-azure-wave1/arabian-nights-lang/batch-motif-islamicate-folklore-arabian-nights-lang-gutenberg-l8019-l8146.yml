canonical_text:
  quote: ''
  summary: Aladdin's mother petitions the Sultan for the princess's hand and presents
    jewels. The Sultan delays at the vizir's urging, while the vizir's son is prepared
    as rival bridegroom. Aladdin uses the lamp's genie to disrupt the rival wedding
    by transporting the bridal bed. After the rival marriage is abandoned, the Sultan
    demands an extravagant bride-price, which the genie supplies, and Aladdin appears
    in royal splendor to be accepted by the Sultan.
  language: English
