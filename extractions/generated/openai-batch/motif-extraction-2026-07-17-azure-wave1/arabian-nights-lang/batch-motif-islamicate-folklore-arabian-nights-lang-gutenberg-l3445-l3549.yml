canonical_text:
  quote: ''
  summary: Sindbad reaches King Mihrage's capital, seeks news and a way back to Bagdad,
    and hears of strange islands and sea creatures. At the quay he finds his own marked
    cargo on a ship whose captain believes him dead after the earlier whale-island
    disaster. After telling his escape story and being recognized by others, Sindbad
    recovers his goods, exchanges gifts with King Mihrage, trades successfully, and
    returns wealthy to Balsora and his family. In the frame narrative he rewards Hindbad,
    resumes the banquet the next day, and begins the story of his second voyage, explaining
    that he soon tired of idle life and longed for the sea again.
  language: English
  quote_policy: summarized
