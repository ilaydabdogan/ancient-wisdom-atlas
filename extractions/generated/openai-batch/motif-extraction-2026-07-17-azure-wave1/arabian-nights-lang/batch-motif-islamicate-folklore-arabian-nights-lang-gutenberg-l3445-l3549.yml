  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:10
  text: Sindbad offers the captain several bales of merchandise in thanks, but the
    captain refuses; Sindbad then gives selected goods to King Mihrage, who gives
    him valuable things in return.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Sindbad trades his merchandise for sandalwood, aloes wood, camphor, nutmegs,
