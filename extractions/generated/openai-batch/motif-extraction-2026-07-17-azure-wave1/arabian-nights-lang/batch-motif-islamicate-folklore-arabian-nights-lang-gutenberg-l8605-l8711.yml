canonical_text:
  quote: ''
  summary: The narrator follows a dervish to a narrow valley between unclimbable mountains.
    The dervish uses fire, perfumes, smoke, and an unknown spell to open a rock and
    reveal a palace of treasure. They load camels with gold and precious stones; the
    dervish also takes a wooden box of special ointment from a golden vase. After
    the treasure is sealed again and the men part, the narrator’s envy leads him to
    return repeatedly and persuade the dervish to give him all the treasure-laden
    camels. Ignoring the dervish’s counsel to use riches for the poor, the narrator
    then asks for the hidden box of ointment.
  language: English
  quote_policy: summarized
