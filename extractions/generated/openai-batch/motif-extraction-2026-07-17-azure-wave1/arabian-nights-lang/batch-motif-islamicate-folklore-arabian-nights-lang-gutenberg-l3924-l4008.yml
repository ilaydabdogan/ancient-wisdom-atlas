canonical_text:
  quote: ''
  summary: 'Sindbad identifies himself to the captain who had abandoned him, receives
    his goods and profit, trades among islands, observes strange animals, and returns
    wealthy to Bagdad. After rewarding Hindbad in the frame narrative, he begins the
    fourth voyage: wealth does not keep him home, a hurricane wrecks his ship, and
    he and a few companions are washed onto an island. Local inhabitants capture them,
    give them herbs that drive his companions mad, and feed them rice with coconut
    oil to fatten them for eating; Sindbad avoids the food, grows thin, escapes an
    old guard, survives in the forest on coconuts, and reaches Arabic-speaking pepper
    gatherers who take him to their king, where he is hospitably received.'
  language: English
  quote_policy: summarized
