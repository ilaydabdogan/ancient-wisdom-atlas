  summary: The Princess of Bengal welcomes Prince Firouz Schah, entertains him with
    a courtly meal and amusements, and hopes to bring him before her father so that
    a marriage may result. The prince is moved by her kindness but insists he must
    first return to his own father, whose grief he imagines, and later return properly
    attended as a prince to seek her hand.
