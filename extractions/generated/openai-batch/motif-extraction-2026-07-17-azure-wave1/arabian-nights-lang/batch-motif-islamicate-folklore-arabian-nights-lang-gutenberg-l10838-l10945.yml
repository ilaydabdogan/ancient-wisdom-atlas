  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Princess Parizade tells the beads daily and at night; when the first pearl
    remains fixed, she understands the sign and sets out for the mountain disguised
    as a man.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Parizade reaches the dervish on the twentieth day and asks about the Talking
    Bird, Singing Tree, and Golden Water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The dervish identifies Parizade as a woman by her voice despite her manly
    dress and warns her that the adventure may lead to a cruel death.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The dervish describes the mountain dangers as clamorous voices, black stones
    that were once living men, difficult climbing, and the need not to look behind
    until the cage is grasped.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
