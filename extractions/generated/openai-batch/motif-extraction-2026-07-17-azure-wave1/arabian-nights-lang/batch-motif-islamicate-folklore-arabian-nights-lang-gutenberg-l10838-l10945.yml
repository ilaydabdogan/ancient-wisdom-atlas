canonical_text:
  quote: ''
  summary: Prince Perviz follows his lost brother on the quest for the Talking Bird,
    Singing Tree, and Golden Water. He leaves Princess Parizade a pearl chaplet that
    will signal his fate, meets the dervish, ignores the warning not to heed the mountain
    voices, turns back, and is changed into black stone. Parizade sees the omen, disguises
    herself as a man, reaches the dervish, learns the dangers, proposes blocking her
    ears with cotton, and receives the guiding ball.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Prince Perviz says his brother must have died by accident or lack of precaution
    and announces that he will start on the same quest the next day.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Before departing, Perviz gives Princess Parizade a chaplet of a hundred pearls
    and says stuck beads will show that his brother's fate has befallen him.
  category: object
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:3
  text: On the twentieth day of his journey, Perviz meets the dervish and asks where
    the Talking Bird, the Singing Tree, and the Golden Water may be found.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The dervish says Perviz's elder brother has been changed into a black stone
    like others on the same errand, warns Perviz not to heed pursuing voices up the
    mountain, and gives him a ball.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the foot of the mountain, Perviz hears a threatening man's voice, draws
