canonical_text:
  quote: ''
  summary: The princess shows the Sultan her house and garden. He marvels at the Golden
    Water, the Singing Tree, and the Talking Bird. During a meal, the Talking Bird
    uses a cucumber stuffed with pearls to challenge the Sultan's earlier belief about
    the Sultana's supposed offspring, then reveals that the princes and princess are
    the Sultan's children, saved and raised by the intendant of the gardens. The Sultan
    accepts the revelation, embraces them, and says he will bring their mother the
    next day.
  language: English
