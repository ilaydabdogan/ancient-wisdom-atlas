canonical_text:
  quote: ''
  summary: A first-person prince watches an old man and slaves hide a young merchant's
    son in a furnished underground chamber to evade a prophecy. The prince uncovers
    the chamber, befriends and serves the youth, but on the fortieth day accidentally
    kills him with a knife, thereby fulfilling the prophecy that Agib would cause
    the boy's death. The father returns, finds the body, faints with grief, and the
    slaves bury the youth.
  language: English
  quote_policy: summarized
