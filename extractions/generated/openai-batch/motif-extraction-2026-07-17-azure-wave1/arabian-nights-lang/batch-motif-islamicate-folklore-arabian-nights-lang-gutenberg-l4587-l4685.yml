  quote: '"This then must be the elephants'' burying place,"'
  summary: Sindbad obeys the Caliph's order to carry gifts and a message to Serendib,
    is welcomed there, then is captured by pirates and sold to a merchant who uses
    him to hunt elephants. After months of hunting, the elephants uproot his tree
    and carry him to a hill covered with elephant bones and tusks, which Sindbad interprets
    as their burying place.
