canonical_text:
  quote: ''
  summary: A princess wakes beside the magically sleeping Prince Camaralzaman, admires
    him, finds her ring on his finger, kisses him, and falls asleep. Maimoune orders
    genii to return the princess home. In the morning Camaralzaman searches for the
    vanished woman, violently questions his slave and the vizir, and asks his father
    to give her to him in marriage. The king denies arranging the encounter but accepts
    the prince's account when shown the ring, while the event remains unexplained.
  language: English
