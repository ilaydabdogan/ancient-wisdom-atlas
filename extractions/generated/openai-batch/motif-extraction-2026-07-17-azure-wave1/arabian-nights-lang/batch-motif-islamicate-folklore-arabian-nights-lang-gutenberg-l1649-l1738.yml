canonical_text:
  quote: "“have as many eyes as you like, but no tongues; and ask no questions about
    anything you see”"
  summary: 'Three Calenders are received by the ladies and clash briefly with the
    porter before supper, music, and dancing. The Caliph secretly leaves the palace
    with Giafar and Mesrour disguised as merchants and gains admission to the house
    after requesting shelter. Zobeida welcomes them on condition that they ask no
    questions about strange sights. The Caliph notices the mystery of the ladies and
    the one-eyed Calenders but stays silent. Zobeida then begins a nightly task: Amina
    prepares the room, the porter brings in two black dogs on a chain, and Zobeida
    takes a whip.'
  language: English
  quote_policy: quoted
