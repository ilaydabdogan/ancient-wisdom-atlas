canonical_text:
  quote: ''
  summary: Princess Parizade ascends a mountain despite hostile voices, captures the
    caged Talking Bird, obtains directions to the Golden Water and Singing Tree, compels
    the bird to explain how to restore her brothers and other transformed people from
    black stones, and returns with her brothers and the wonders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The princess arrives at a mountain, stops her ears with cotton, chooses a
    path, and begins to climb.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Voices become louder and more insulting as she climbs, and the bird also calls
    for her to return.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The princess reaches the cage, seizes it, addresses the bird as captured,
