  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bird addresses her as brave, explains its resistance as an effort to preserve
    freedom, and swears faithful service.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The princess asks where the Golden Water is, and after the bird describes
    the place, she fills a small silver flask.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The bird directs the princess to the Singing Tree in a wood behind her; she
    finds it by its sweet voices.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Because the tree is too large to uproot, the bird tells her to break off a
    twig and plant it in her garden.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Princess Parizade holds the three wonders and demands that the bird identify
    or help recover her brothers, who had become black stones.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bird tells her to take a nearby pitcher and sprinkle a little of its water
    on every black stone while descending the mountain.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The princess carries the cage, twig, flask, and pitcher down the mountain
    and sprinkles the black stones with water.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: When the water touches the stones, they instantly become men, and the princess
    sees her brothers before her.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:12
  text: The brothers say they have been asleep; the princess says the sleep might
    have lasted until the day of judgment without her.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The princess explains that the gentlemen, her brothers, and their horses had
    been changed into stones and that she delivered them with water from the pitcher.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: Prince Bahman and Prince Perviz understand their debt to their sister, and
