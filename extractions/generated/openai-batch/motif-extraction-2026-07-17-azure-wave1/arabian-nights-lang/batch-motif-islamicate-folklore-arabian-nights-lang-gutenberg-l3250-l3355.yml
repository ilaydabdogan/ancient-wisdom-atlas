canonical_text:
  quote: ''
  summary: 'The passage closes a Calender''s account: after seeing a horse rise into
    the clouds, he returns to the hall of the ten blue sofas, hears from the ten young
    men that opening the Golden Door caused their shared punishment, is sent toward
    Bagdad to learn his destiny, adopts a Calender''s habit, and is later pardoned
    and expelled by Zobeida. The passage then begins the Sindbad cycle: Hindbad, a
    poor porter in Bagdad, rests outside a luxurious house, complains to the Creator
    about the inequality between his hardship and Sindbad''s wealth, is summoned inside,
    fed by Sindbad, and asked to repeat his complaint.'
  language: English
  quote_policy: summarized
