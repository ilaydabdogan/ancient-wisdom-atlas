canonical_text:
  quote: ''
  summary: A narrator in monkey form is brought before a Sultan and demonstrates courtly
    intelligence through gestures, writing, poetry, and chess. The Sultan’s daughter,
    Queen of Beauty, recognizes him as an enchanted prince transformed by a genius.
    She explains her magical training, agrees to disenchant him, prepares a ritual
    with an inscribed knife, a circle, Arabic writing, and Koranic recitation, after
    which the genius appears in the form of a colossal lion and disputes with her
    over a broken treaty.
  language: English
  quote_policy: summarized
