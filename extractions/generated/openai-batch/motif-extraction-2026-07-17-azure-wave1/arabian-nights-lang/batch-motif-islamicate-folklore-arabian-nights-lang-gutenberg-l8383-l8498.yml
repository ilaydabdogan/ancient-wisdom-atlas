canonical_text:
  quote: ''
  summary: The African magician's younger brother travels to China to avenge him,
    murders and impersonates the holy woman Fatima, and enters Aladdin's palace. Disguised
    as Fatima, he persuades the princess to desire a roc's egg for the palace dome.
    When Aladdin commands the genie of the lamp to bring it, the genie reveals that
    the egg is his master and exposes the disguised magician's plot. Aladdin kills
    the impostor, then lives peacefully, succeeds the Sultan, and founds a line of
    kings. The next tale begins with Caliph Haroun-al-Raschid, who, urged by Giafar,
    disguises himself as a foreign merchant to inspect justice in the city and encounters
    a blind beggar who asks to be struck after receiving alms.
  language: English
  quote_policy: summarized
