canonical_text:
  quote: ''
  summary: Sindbad and companions flee giants by raft, lose other raft crews to rock-throwing
    giants, land on another island, and encounter an immense snake that devours both
    companions. Sindbad survives by building a thorny shelter under a tree, is rescued
    by a passing ship, receives food and clothing, and later discovers that the ship's
    captain has merchandise registered in the name of Sindbad, whom the captain believes
    dead from an earlier voyage.
  language: English
  quote_policy: summarized
