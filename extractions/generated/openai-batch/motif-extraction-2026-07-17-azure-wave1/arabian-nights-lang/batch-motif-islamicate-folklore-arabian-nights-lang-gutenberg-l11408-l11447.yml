canonical_text:
  quote: ''
  summary: The Sultan orders the Sultana's sisters seized, questioned, found guilty,
    and executed. He publicly frees the Sultana from long imprisonment, asks her pardon,
    and restores her rank. The next day the Sultan and Sultana visit their children,
    reunite with them, see the Golden Water and Singing Tree in the garden, and return
    to the palace amid public welcome and birdsong from the Talking Bird and other
    birds.
  language: English
