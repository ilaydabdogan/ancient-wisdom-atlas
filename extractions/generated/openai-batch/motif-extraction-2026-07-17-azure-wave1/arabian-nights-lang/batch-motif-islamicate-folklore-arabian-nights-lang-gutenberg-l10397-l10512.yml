canonical_text:
  quote: ''
  summary: Three sisters' marriage wishes are overheard by the Sultan and granted.
    The youngest becomes Sultana, while her elder sisters marry the Sultan's baker
    and chief cook. Jealous of her elevation, the elder sisters plot revenge. When
    the Sultana gives birth to a beautiful boy, they set him afloat in a cradle on
    a canal and falsely tell the Sultan she has borne a puppy. The child is found
    by the royal intendant, a childless official, who resolves to raise him as his
    own son.
  language: English
  quote_policy: summarized
