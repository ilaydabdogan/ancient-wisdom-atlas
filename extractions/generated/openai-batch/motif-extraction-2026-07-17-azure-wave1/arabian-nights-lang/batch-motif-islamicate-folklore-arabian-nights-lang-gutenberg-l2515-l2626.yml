canonical_text:
  quote: ''
  summary: A former dervish who has become Sultan generously rewards the envious man
    who once tried to kill him. The narrator uses this story to plead with a genius,
    but the genius refuses mercy, carries him through the air to a mountain, and transforms
    him into a monkey. The transformed narrator travels to the sea, boards a ship,
    is nearly killed as ill-omened, but is protected by the captain. At a harbor town,
    royal officials request writing samples for a Sultan seeking a successor to a
    dead grand-vizir famed for handwriting. The monkey writes beautifully in six Arabic
    scripts, and the Sultan orders him brought to court in fine dress on a horse.
  language: English
  quote_policy: summarized
