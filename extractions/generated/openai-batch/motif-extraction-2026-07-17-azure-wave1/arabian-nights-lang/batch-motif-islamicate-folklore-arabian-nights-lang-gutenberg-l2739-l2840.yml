canonical_text:
  quote: ''
  summary: A princess engages a genius in a magical battle of changing forms, defeats
    him by fire, restores an enchanted man with water, and dies from the fire's effects.
    Her father mourns, buries her ashes, and banishes the restored man, who becomes
    a wandering calender. The next calender begins his own story, identifying himself
    as Agib, son of King Cassib.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The princess avoids the lion, turns a hair from his mane into a sword by spoken
    words, and cuts the lion's body in two; the remaining head becomes a scorpion.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The princess takes the form of a serpent to fight the scorpion; the opponent
    becomes an eagle and she becomes a stronger eagle in pursuit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: After the combatants vanish from sight, a black-and-white cat emerges from
    the opened ground pursued by a wolf; the cat becomes a worm and hides in a pomegranate,
    which swells, rises, falls, and breaks open.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wolf becomes a cock and swallows the pomegranate seeds, but one seed reaches
    the canal, becomes a fish, and is pursued underwater by the cock transformed into
    a pike.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The combatants return to their proper forms and emit fire from their mouths;
    the Sultan is singed and scorched, the chief eunuch is burned to a cinder, and
    the narrator loses the sight of one eye.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The princess cries victory, and the genius lies at her feet as a heap of ashes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The princess has an uninjured slave bring water, speaks magic words over it,
    throws it into the narrator's face, and the narrator resumes human form while
    remaining blind in one eye.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The princess says the battle is won but has cost her life because fire has
    reached her heart; she says the missed last pomegranate seed forced her to resort
    to fire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The princess cries that she burns and dies; the nation mourns for seven days,
    and her ashes are buried with pomp under a superb tomb.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: After recovering from illness, the Sultan orders the narrator to leave the
    kingdom on pain of death; the narrator shaves his beard and eyebrows, dresses
    as a calender, wanders, and resolves to go to Bagdad.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The next calender says his story is different from those of his two friends,
    names himself Agib, and identifies himself as the son of King Cassib.
  category: speech
  evidence_refs:
  - ev:8
