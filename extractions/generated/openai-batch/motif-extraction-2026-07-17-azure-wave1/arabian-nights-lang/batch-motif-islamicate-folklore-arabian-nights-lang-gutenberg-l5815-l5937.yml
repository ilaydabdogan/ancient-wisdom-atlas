canonical_text:
  quote: ''
  summary: The king of China confines his daughter and announces that whoever cures
    her may marry her. Danhasch and the fairy Maimoune dispute whether the princess
    or the imprisoned prince Camaralzaman is more beautiful. Danhasch brings the sleeping
    princess to the prince's room; a summoned genius, Caschcasch, proposes waking
    each sleeper to judge their admiration. Maimoune becomes a gnat and wakes Camaralzaman,
    who admires and kisses the sleeping princess, exchanges rings with her, and falls
    asleep. Danhasch then becomes a gnat and bites the princess.
  language: English
  quote_policy: summarized
