canonical_text:
  quote: ''
  summary: A physician cures a Greek king by means of a medicated polo club, bodily
    exertion, bathing, and sleep. The king honors the physician, but an envious grand-vizir
    privately accuses him of plotting assassination. The king refuses to believe the
    accusation and introduces the story of a husband, his wife, and a truth-telling
    parrot. In that inset tale, the wife discredits the parrot by staging a false
    storm, causing the husband to kill the bird and later regret it. The Greek king
    applies the parrot tale as a warning against rashly harming the physician, while
    the vizir persists and introduces another story.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The physician instructs the king to play polo with a bat or club whose handle
    contains a remedy, then to return, bathe, sleep, and expect to be cured the next
    morning.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The king plays polo until he becomes very hot, bathes, follows the physician's
    directions, and awakens completely cured.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: After the cure, the king honors the physician Douban, seats him by his side,
    gives him a rich robe of state, gives him two thousand sequins, and continues
    to favor him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The grand-vizir is described as avaricious, envious, and bad; he becomes jealous
    of the physician and determines to ruin him.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: The grand-vizir privately warns the king that the physician may be an unproved
    traitor intending assassination, but the king rejects the warning and points to
    the cure as evidence of the physician's faithfulness.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The king introduces a remembered story connected with King Sindbad and a vizir
    as a reason not to believe every accusation.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: In the inset story, a husband buys a parrot that can speak and tell what has
    been done before it, places it in his wife's room, and later asks it what happened
    during his absence.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The parrot reports things that cause the husband to scold his wife; the wife
    learns that the parrot was the source and resolves revenge.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: The wife orders slaves to create an artificial disturbance around the parrot's
    cage using a hand-mill, falling water, a mirror, and candlelight.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The parrot reports lightning, thunder, and rain; because the husband knows
    no real storm occurred, he disbelieves the bird, throws it down, kills it, and
    later regrets the act after learning the parrot had spoken truth.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Greek king says he will not listen to the vizir and will protect the physician
    to avoid the husband's regret, but the vizir continues to insist that Douban wishes
    to assassinate the king and introduces another story.
  category: speech
  evidence_refs:
  - ev:9
