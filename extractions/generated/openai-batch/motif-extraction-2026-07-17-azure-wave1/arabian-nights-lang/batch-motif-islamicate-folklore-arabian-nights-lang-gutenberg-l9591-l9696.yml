canonical_text:
  quote: ''
  summary: During the Persian New Year feast at Schiraz, an Indian appears before
    the King of Persia with a richly harnessed horse that looks real. He says the
    horse can carry a rider to any wished-for place in moments, then proves it by
    flying to a nearby mountain and returning with a palm leaf. The king wishes to
    obtain the horse. The Indian says he may part with it only for something of equal
    value, since he received it from its inventor in exchange for his only daughter,
    and he asks for the princess's hand. Prince Firouz Schah objects, but the king
    asks him to test the horse. The prince mounts before learning how to return, turns
    the screw, and disappears into the air. The Indian warns that the prince did not
    learn the return procedure, and the king responds in fear and anger.
  language: English
  quote_policy: summarized
