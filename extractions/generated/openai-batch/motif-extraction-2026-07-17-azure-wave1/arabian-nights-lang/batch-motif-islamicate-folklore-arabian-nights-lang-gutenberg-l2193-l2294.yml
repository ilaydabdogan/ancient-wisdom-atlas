canonical_text:
  quote: ''
  summary: A prince living as a wood-cutter finds a hidden trapdoor beneath a tree
    root and descends into an underground palace. There he meets a captive princess
    who says a genius abducted her on her wedding day and keeps her there, visiting
    every tenth day and reachable through a talisman. The prince urges her to flee,
    ignores her warning, breaks the talisman, and summons the genius. The genius accuses
    and beats the princess while the prince escapes back to the forest and his tailor
    friend in shame.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The narrator has been working as a wood-cutter for more than a year and wanders
    deeper into the forest to a green glade.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: While cutting at a tree root, the narrator finds an iron ring fastened to
    a metal trapdoor, clears earth away, opens the door, and descends a staircase
    with his hatchet for protection.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the bottom of the staircase, the narrator finds a brilliantly lit underground
    palace with a long gallery, jasper pillars, and gold capitals.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:4
  text: A beautiful lady meets the narrator in the gallery and asks whether he is
    a man or a genius; she says he is the first man to visit her in five and twenty
    years.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:5
  text: The lady says she is the daughter of the king of the Ebony Isle, was married
    to her cousin at her father's desire, and was snatched up by a genius on her wedding
    day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The princess says the genius visits every tenth day and that she can seek
    his help at other times by touching a talisman at the entrance of her chamber.
  category: object
  evidence_refs:
  - ev:3
- id: obs:7
  text: The princess receives the narrator as a guest, has him conducted to a bath,
    provides rich clothing, and serves a feast in a room hung with embroidered Indian
    fabrics.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The narrator asks the princess to break her bonds and return with him to the
    sunlit world; she answers that this is impossible and says the jealous genius
    will not allow a man near her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The narrator says he will break the talisman and vows to oppose the whole
    race of genii; the princess begs him not to touch it and warns that doing so will
    ruin them both.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: After drinking wine, the narrator kicks the talisman, and it breaks into a
    thousand pieces.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Immediately after the talisman is touched, the air becomes dark, a fearful
    noise is heard, and the palace shakes to its foundations.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The princess tells the narrator to flee; he runs up the staircase and leaves
    his hatchet behind, but the genius appears before he can fully escape the danger.
  category: sequence
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:13
  text: The princess tells the genius that she broke the talisman accidentally after
    feeling faint, but the genius calls her a liar and asks how the hatchet and shoes
    came there.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The genius answers the princess with insults and blows; the narrator hears
    her shrieks and groans, changes back into his former clothes, lifts the trap,
    returns to the forest, and goes back to his friend the tailor in shame and sorrow.
  category: sequence
  evidence_refs:
  - ev:9
