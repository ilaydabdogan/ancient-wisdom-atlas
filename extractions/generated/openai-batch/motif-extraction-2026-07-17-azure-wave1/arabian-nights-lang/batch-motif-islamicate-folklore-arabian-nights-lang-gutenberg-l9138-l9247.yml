canonical_text:
  quote: ''
  summary: 'The passage concludes Sidi-Nouman''s account: an unnamed young magician
    restores him from dog form with water and later instructs him to punish Amina
    with water from a bottle, causing Amina to become a horse. The Caliph advises
    that this punishment should be enough. The next tale begins with Ali Cogia of
    Baghdad, who repeatedly dreams of an old man reproaching him for delaying pilgrimage
    to Mecca; he prepares to depart, hides gold in a vase under olives, and entrusts
    the vase to a merchant friend.'
  language: English
  quote_policy: summarized
