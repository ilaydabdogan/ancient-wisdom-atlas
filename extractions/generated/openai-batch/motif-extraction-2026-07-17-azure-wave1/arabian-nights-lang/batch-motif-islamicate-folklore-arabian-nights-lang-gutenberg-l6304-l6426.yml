canonical_text:
  quote: ''
  summary: Camaralzaman, aided by Marzavan, disguises himself as an astrologer and
    presents himself at the King of China's palace to cure Princess Badoura under
    a condition of marriage if successful and death if he fails. After public warnings
    and royal scrutiny, he sends the princess a letter enclosing her ring, recalling
    their earlier exchange of rings. On seeing the ring, Badoura is immediately roused,
    recognizes him, and they are reunited. The eunuch reports the cure, the king fulfills
    his promise by giving Badoura in marriage, Camaralzaman reveals his princely identity,
    the king orders the story preserved, and the wedding follows with Marzavan rewarded.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Marzavan prepares an astrologer's dress for the prince, and the prince wears
    the astrologer's robe before being left near the king's palace.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The prince proclaims at the palace gates that he is an astrologer who will
    restore Princess Badoura's health, accepting marriage if he succeeds and death
    if he fails.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A crowd gathers, pities the young man, and warns him that exposed heads on
    the town wall show the danger of attempting the cure.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Camaralzaman repeats his proclamation, is brought before the king, refuses
    to renounce his project, and is sent toward the princess's apartments under the
    eunuch's guard.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the ante-room to the princess's chamber, Camaralzaman asks whether he should
    cure the princess in her presence or from outside without seeing her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Camaralzaman writes a letter to Badoura describing his earlier sight of her
    sleeping beauty, his gift of his ring, his taking of hers in exchange, and his
    willingness to die for love if rejected.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Camaralzaman encloses the ring in the letter secretly and tells the eunuch
    that the princess will be cured when she reads it and sees its contents.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The princess opens the note indifferently, sees her ring, rises quickly, reaches
    the doorway, and recognizes Camaralzaman; they embrace after a long separation.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The nurse draws the reunited pair back into the inner room, and the princess
    restores her ring to Camaralzaman while saying she will wear his as long as she
    lives.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The eunuch tells the king that the new astrologer has cured the princess without
    seeing her and says the former doctors and astrologers were quacks.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The king embraces his daughter, places her hand in the prince's, and gives
    her to him as wife while suspecting that his rank is higher than it appears.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Camaralzaman reveals that he is not an astrologer but a prince, names his
    father and kingdom, and recounts his earlier first sight and love of Badoura.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: The king says the story should be preserved in the royal archives and published
