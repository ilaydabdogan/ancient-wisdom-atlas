canonical_text:
  quote: If you do, you will instantly become a black stone like the rest.
  summary: Prince Bahman seeks the Talking Bird, the Singing Tree, and the Golden
    Water. A dervish warns him of a dangerous mountain trial, gives him a ball that
    will guide him there, and tells him not to turn his head when he hears invisible
    voices. Bahman ascends, is overcome by the voices, turns to flee, and becomes
    a black stone. His siblings learn of the disaster when blood appears on a magic
    knife.
  language: English
  quote_policy: quoted
