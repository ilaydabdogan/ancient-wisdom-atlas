  summary: Alnaschar, owning only a basket of glass, imagines multiplying his money
    through trade, becoming wealthy, marrying the grand-vizir's daughter, displaying
    rank, and dominating his imagined wife. While absorbed in this fantasy, he physically
    kicks the basket, which falls into the street and breaks.
