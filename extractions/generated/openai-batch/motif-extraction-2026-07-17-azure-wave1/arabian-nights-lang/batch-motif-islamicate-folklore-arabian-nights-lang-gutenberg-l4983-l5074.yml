canonical_text:
  quote: ''
  summary: A tailor confesses that the hunchback died accidentally while eating fish
    at his house and that he and his wife moved the corpse to the Jewish doctor's
    house out of fear. The chief of police orders the tailor hanged in place of the
    doctor, but the Sultan of Kashgar, seeking his missing jester, sends an usher
    who arrives in time to stop the execution. The involved men and the corpse are
    brought to the palace, where the Sultan orders the affair recorded and asks for
    further stories. The passage then begins the barber's story of Alnaschar, an idle
    brother who inherits money, buys glassware, sets up a small shop, and starts speaking
    his thoughts aloud while staring at his basket of wares.
  language: English
  quote_policy: summarized
