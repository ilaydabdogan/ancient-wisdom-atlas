canonical_text:
  quote: ''
  summary: 'Princess Parizade receives an old pious woman, who says the princess''s
    house lacks three marvels: the Talking Bird, the Singing Tree, and the Golden
    Water. The old woman gives partial directions toward India. Parizade tells her
    brothers, and Prince Bahman volunteers to seek the marvels. Before departure he
    gives Parizade a knife whose blade will indicate whether he lives or dies. After
    twenty days on the road he nears the Persian frontier and sees a strange old man
    seated under a tree.'
  language: English
  quote_policy: summarized
