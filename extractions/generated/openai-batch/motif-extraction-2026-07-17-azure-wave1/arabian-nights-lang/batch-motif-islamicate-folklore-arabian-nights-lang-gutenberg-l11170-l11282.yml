canonical_text:
  quote: ''
  summary: The Sultan favors the two princes, whose appearance and learning prompt
    remarks that they resemble the sons he might have had. The brothers invite him
    to their house. Their sister consults the Talking Bird about entertaining him,
    receives the strange instruction to serve cucumbers stuffed with pearls, and is
    directed to dig under a tree for the needed pearls. She finds a golden box of
    pearls, orders the head cook to prepare the dish, and later greets the Sultan
    when he arrives after the hunt.
  language: English
