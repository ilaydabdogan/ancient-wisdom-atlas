canonical_text:
  quote: ''
  summary: Sindbad recognizes the diamond valley from sailors' tales, uses meat and
    an eagle to escape with diamonds, reconciles with the diamond merchants, travels
    through mountains with serpents to Rohat, observes camphor trees and marvellous
    animals, returns to Bagdad with wealth, rewards Hindbad after recounting the second
    voyage, and begins the third voyage by sailing again until a storm drives the
    ship to a strange island.
  language: English
  quote_policy: summarized
