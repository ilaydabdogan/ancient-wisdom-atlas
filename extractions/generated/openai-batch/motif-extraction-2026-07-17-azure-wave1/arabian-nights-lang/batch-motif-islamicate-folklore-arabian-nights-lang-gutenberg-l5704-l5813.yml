canonical_text:
  quote: ''
  summary: Prince Camaralzaman refuses marriage despite dynastic and imperial pressure
    from Fatima and the Sultan. After angering his father before the council, he is
    imprisoned in an old tower, where he reads, performs devotions, and sleeps. The
    fairy Maimoune rises from a well in the tower, sees the sleeping prince, admires
    his beauty, kisses him, and flies away. In the middle region she meets the bad
    genie Danhasch, who fears her and reports that the King of China has an exceptionally
    beautiful daughter secluded in seven palaces. The princess refuses all marriage
    proposals and threatens to stab herself if pressed to marry.
  language: English
  quote_policy: summarized
