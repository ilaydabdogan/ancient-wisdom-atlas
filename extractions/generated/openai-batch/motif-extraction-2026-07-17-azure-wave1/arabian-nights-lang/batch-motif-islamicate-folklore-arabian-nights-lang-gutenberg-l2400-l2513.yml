canonical_text:
  quote: ''
  summary: An envious man deceives a dervish and drops him into a well, but hidden
    fairies and genii save him and reveal how to cure the Sultan's daughter from the
    power of the genius Maimoum by using white hairs from a black cat. The dervish
    escapes, performs the rite with burning coals and smoke, the princess recovers,
    and the Sultan rewards him with marriage to the princess. Later the dervish becomes
    grand-vizir and then heir to the throne.
  language: English
  quote_policy: summarized
