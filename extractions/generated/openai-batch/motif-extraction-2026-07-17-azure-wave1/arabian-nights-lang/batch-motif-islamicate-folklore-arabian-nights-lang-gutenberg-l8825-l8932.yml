  summary: The Caliph questions Sidi-Nouman about his repeated harsh treatment of
    a horse. Reassured, Sidi-Nouman begins explaining that his conduct has a reason.
    He recounts his marriage to Amina, her unusual refusal to eat normally, her use
    of a pin to consume rice grain by grain, and her silent nocturnal departure from
    their room, which he decides to follow.
