canonical_text:
  quote: ''
  summary: After the Princess of Bengal is carried away on an enchanted horse by the
    Indian, Prince Firouz Schah disguises himself as a dervish and departs to find
    her. Near Cashmere, the princess calls for help, is rescued when the Indian is
    executed, but is then confined by the Sultan of Cashmere, who intends to marry
    her; she faints and later feigns madness to avoid breaking faith with the Prince
    of Persia.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sultan of Persia sees the horse and its riders and reacts with astonishment,
    horror, oaths, and curses, while the Indian remains unmoved because he believes
    himself safe from pursuit.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Prince Firouz Schah sees the object of his devotion being carried away and
    is struck with grief and remorse as she vanishes from sight.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prince tells the doorkeeper that he, not the doorkeeper, is the cause
    of the misfortune and orders him to find a dervish's dress without revealing it
    is for the prince.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The doorkeeper obtains a dervish's dress through a false story; the prince
    puts it on, conceals a box of pearls and diamonds, and leaves at nightfall resolved
    not to return without the princess.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Indian brings the horse down in a wood near the capital of Cashmere and
    leaves the princess in a shady place beside a clear stream.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The princess considers escaping and hiding but abandons the plan because hunger
    has made her too weak to go far.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: After eating, the princess answers the Indian with spirit; when threatened,
    she calls loudly for help, and a troop of horsemen hears her cries.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The leader of the horsemen is the Sultan of Cashmere returning from the chase;
    when questioned, the Indian says the princess is his wife and that others need
    not interfere.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The princess denies the Indian's claim, calls him an impostor and magician,
    says he has torn her from the Prince of Persia, and identifies the horse as enchanted.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The Sultan of Cashmere believes the princess's account and orders his followers
    to cut off the Indian's head, which is done immediately.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Sultan of Cashmere gives the princess a horse, takes her to his palace,
    places her in a beautiful apartment, and assigns female slaves and eunuchs to
    attend and guard her.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:12
  text: The princess hopes that telling her story will move the Sultan of Cashmere
    to restore her to the Prince of Persia.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:13
  text: The King of Cashmere resolves that the princess will become his wife before
