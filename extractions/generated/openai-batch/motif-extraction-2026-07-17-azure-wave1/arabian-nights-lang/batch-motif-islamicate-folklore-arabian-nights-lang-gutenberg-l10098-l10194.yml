  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: When the princess learns that the music announces marriage ceremonies for
    her, she is terrified and falls into a faint.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: After recovering, the princess decides to feign madness rather than break
