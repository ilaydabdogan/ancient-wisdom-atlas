canonical_text:
  quote: ''
  summary: Aladdin commands the genie to build a magnificent palace for his marriage
    to the Sultan's daughter. The Sultan admires the palace, attempts unsuccessfully
    to finish one jeweled window, and then sees it completed by Aladdin through the
    genie. Aladdin gains public favor and military rank. In Africa, the magician learns
    that Aladdin survived the cave and prospers through the lamp. He travels to China,
    tricks the princess's household into exchanging the magic lamp for a new one,
    and commands the genie to carry the palace and princess to Africa. The Sultan
    finds the palace gone, accepts the vizir's explanation of enchantment, and orders
    Aladdin brought in chains for execution.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Aladdin refuses to proceed without first building a palace suitable for the
    princess and commands the genie to build it of marble, precious stones, gold,
    silver, and jeweled windows, leaving one window unfinished.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The palace is finished by the next day, and the genie shows Aladdin that the
    orders have been carried out, including a velvet carpet laid between Aladdin's
    palace and the Sultan's palace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aladdin's mother, slaves, musicians, and the princess participate in the wedding
    procession, and Aladdin and the princess feast and dance after the wedding.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The Sultan enters the hall with twenty-four jeweled windows and asks whether
    the unfinished window was left that way by accident.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Aladdin says the unfinished window was left for the Sultan to complete; the
    Sultan's jewelers and his own jewels are insufficient, and the genie later finishes
    the window at Aladdin's command.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: The vizir hints that the completed palace window is the work of enchantment.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Aladdin wins the hearts of the people, is made captain of the Sultan's armies,
    wins battles, and remains modest and courteous.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The African magician uses magic arts to discover that Aladdin escaped the
    cave, married a princess, and lives in honor and wealth.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The magician infers that Aladdin's success depends on the lamp, travels to
    China, sees the palace, and determines to obtain the lamp and ruin Aladdin.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: While Aladdin is away hunting, the magician offers new lamps for old, and
    the princess unknowingly authorizes a slave to exchange the magic lamp for a new
    one.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: At night the magician rubs the lamp; the genie appears and, at the magician's
    command, carries the magician, the palace, and the princess to a lonely place
    in Africa.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The Sultan sees that Aladdin's palace is gone, sends mounted men to fetch
