canonical_text:
  quote: ''
  summary: A Christian merchant is arrested after a dead hunchback Mussulman is found
    in his presence. The Sultan orders the merchant's execution, but the Sultan's
    purveyor interrupts at the gallows and confesses. As the purveyor is about to
    be hanged, a Jewish doctor interrupts and confesses that the hunchback died in
    an earlier accident in darkness and that he and his wife moved the body into the
    purveyor's chimney. The doctor is then placed on the gallows, but a tailor interrupts
    before the execution proceeds.
  language: English
  quote_policy: summarized
