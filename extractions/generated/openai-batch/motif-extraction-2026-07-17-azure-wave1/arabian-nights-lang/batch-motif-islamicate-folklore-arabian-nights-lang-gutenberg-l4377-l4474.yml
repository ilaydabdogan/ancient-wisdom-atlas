canonical_text:
  quote: ''
  summary: Sindbad and his companions are trapped on a desolate island shore beneath
    an unscalable mountain, surrounded by wreckage, bones, treasure, and a fresh-water
    river that disappears into a jewel-lined cave. After his companions die, Sindbad
    builds a raft, loads it with precious goods, and entrusts himself to the underground
    river. He travels in darkness, narrowly avoids being crushed, nearly exhausts
    his food, falls asleep, and wakes in daylight in a beautiful country where local
    men rescue him. They bring him to Serendib and present him to the king, who hears
    his story, orders it recorded in gold letters, and examines the treasures from
    the raft.
  language: English
  quote_policy: summarized
