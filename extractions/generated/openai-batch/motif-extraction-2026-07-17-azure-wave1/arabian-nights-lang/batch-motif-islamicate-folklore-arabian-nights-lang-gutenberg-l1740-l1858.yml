canonical_text:
  quote: ''
  summary: Zobeida whips and then tenderly comforts two dogs while the guests watch
    in astonishment. Sadie and Amina perform music; Amina faints and reveals scars
    on her neck. The male guests debate the mystery and, despite an imposed condition,
    have the porter ask for an explanation. Zobeida angrily summons seven armed slaves,
    threatens the seven men with death unless they truthfully identify themselves,
    and then questions the three one-eyed Calenders about their kinship and blindness.
  language: English
  quote_policy: summarized
