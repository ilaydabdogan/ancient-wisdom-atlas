canonical_text:
  quote: ''
  summary: Prince Camaralzaman dreams that his father is dying, and Princess Badoura
    obtains permission for them to visit King Schahzaman. During the journey, the
    prince finds a talismanic cornelian in the princess's girdle, but a bird steals
    and swallows it. He follows the bird for days until it disappears near a seaside
    town, where a gardener shelters him and warns him about hostile inhabitants.
  language: English
