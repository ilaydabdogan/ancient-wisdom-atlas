canonical_text:
  quote: ''
  summary: Alnaschar survives wounds and escapes from a murder-house, recovers in
    the narrator's care, then returns disguised as an old woman to take revenge on
    the old woman, the black slave, and the Greek slave. He spares a captive lady,
    who tells how she was lured and imprisoned. She leads him to stored gold but escapes
    with it while he fetches carriers. Alnaschar removes furniture from the house,
    is arrested as a thief, and tells his story before a judge.
  language: English
  quote_policy: summarized
