canonical_text:
  quote: ''
  summary: A poisoned set of pages kills a king after a physician's severed head declares
    that cruelty and injustice are punished. Returning to the fisherman and the genius,
    the fisherman threatens to throw the genius back into the sea, but releases him
    after a promise of wealth. The genius leads him to a hidden lake among hills,
    where four differently colored fish are caught, with a warning not to fish more
    than once a day. The fish are taken to the Sultan and then to the cook; while
    frying them, a richly dressed damsel emerges from an opened kitchen wall, questions
    the fish, hears their collective reply, overturns the pan, and disappears. The
    fish are left blackened, and the fisherman is asked to bring more like them the
    next day.
  language: English
  quote_policy: summarized
