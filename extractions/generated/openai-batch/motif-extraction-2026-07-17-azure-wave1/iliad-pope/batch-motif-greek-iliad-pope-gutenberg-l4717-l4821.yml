canonical_text:
  quote: "“Let Argive Helen own her lawful lord;”"
  summary: Venus compels Helen to go to Paris after the duel. Helen resists, accuses
    Venus of deception, and condemns Paris, but obeys after Venus threatens her. In
    the palace Helen reproaches Paris for fleeing the field; Paris answers that Pallas
    aided the enemy and urges love. Meanwhile Atrides searches for Paris on the battlefield,
    and the king of kings declares the victory divinely favored, demanding the return
    of Helen, Spartan wealth, and an appointed fine.
  language: English
