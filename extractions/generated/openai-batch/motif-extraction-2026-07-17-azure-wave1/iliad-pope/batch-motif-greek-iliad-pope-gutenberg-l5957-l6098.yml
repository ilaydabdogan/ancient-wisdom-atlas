  quote: ''
  summary: Aeneas guards a slain companion but is struck down by Diomedes with a huge
    stone. Venus protects and carries off her son, but Diomedes pursues and wounds
    her hand. Phoebus conceals Aeneas in a cloud. Iris helps the wounded Venus reach
    Mars’s chariot and ascend to her mother Dione, who consoles her by recounting
    other times gods suffered harm from mortals or heroes.
  language: English
  quote_policy: summarized
