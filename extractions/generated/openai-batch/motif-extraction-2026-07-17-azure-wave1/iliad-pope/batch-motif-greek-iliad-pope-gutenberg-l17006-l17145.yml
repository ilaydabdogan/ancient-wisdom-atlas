canonical_text:
  quote: ''
  summary: Achilles' immortal horses mourn Patroclus and resist Automedon until Jove
    pities them, addresses them, and breathes new spirit into them. Automedon and
    Alcimedon manage the chariot while Hector, neas, Chromius, and Aretus attempt
    to seize the horses. Automedon prays, calls allies, kills Aretus, and dedicates
    the stripped arms as an offering to Patroclus' shade.
  language: English
  quote_policy: summarized
