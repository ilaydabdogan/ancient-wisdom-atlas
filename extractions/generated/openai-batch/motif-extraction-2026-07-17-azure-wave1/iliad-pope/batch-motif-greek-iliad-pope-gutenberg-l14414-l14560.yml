canonical_text:
  quote: ''
  summary: In a divine council, Juno urges submission to Jove and provokes Mars by
    naming the death of Ascalaphus. Mars prepares to avenge his son, but Pallas disarms
    and restrains him, warning that rebellion against Jove would bring ruin on Olympus.
    Juno then sends Iris and the god of day to Jove on Mount Ida. Jove orders Iris
    to command Neptune to leave the battle. Neptune rejects the idea that he is Jove's
    vassal, citing the division of realms among the sons of Saturn and Rhea, but after
    Iris counsels moderation he yields under protest and warns that his anger will
    endure if Jove breaks faith over Ilion.
  language: English
  quote_policy: summarized
