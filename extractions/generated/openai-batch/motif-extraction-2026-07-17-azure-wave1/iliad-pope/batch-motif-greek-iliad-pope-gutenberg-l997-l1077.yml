canonical_text:
  quote: ''
  summary: The passage argues for belief in Homer as a single author rather than a
    mere compiler, while allowing that he drew upon inherited legends, romances, songs,
    and mythical traditions. It includes a figurative image, attributed to Ennius,
    of Homer as a ghost like a patron saint hovering by a poet's bed and bestowing
    imaginative gifts. The passage also reflects on faith, sacred memory, and the
    reader's imaginative identification with heroic figures such as Achilles and Hector.
  language: English
  quote_policy: summarized
