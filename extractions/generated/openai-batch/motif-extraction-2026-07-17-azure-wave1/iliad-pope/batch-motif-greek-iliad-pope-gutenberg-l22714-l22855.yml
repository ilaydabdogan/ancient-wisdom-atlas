canonical_text:
  quote: ''
  summary: Hermes tells Priam that Hector's corpse remains intact and divinely preserved
    despite Achilles dragging it. Priam praises the gods' regard for Hector and tries
    to reward his guide, but Hermes refuses the gift. Hermes drives Priam's chariot
    through the Greek camp, uses his wand to put the guards to sleep, opens the gates,
    reveals himself as Hermes, and instructs Priam to supplicate Achilles. Priam enters
    Achilles' tent, kneels, embraces his knees, kisses the hands that killed Hector,
    and appeals to Achilles through pity for old fathers, dead sons, gifts, and reverence
    for the gods.
  language: English
  quote_policy: summarized
