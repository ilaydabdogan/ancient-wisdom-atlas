canonical_text:
  quote: |-
    From all your troops select the boldest knight,
    And him, the boldest, Hector dares to fight.
  summary: Hector announces that divine will has prolonged the war and challenges
    the Greeks to choose a champion for single combat. He sets terms for arms, bodies,
    funeral burning, dedication to Apollo, and a shore monument. Menelaus volunteers
    but is restrained by Agamemnon. Nestor rebukes the Greeks with a story of his
    youthful victory over Ereuthalion, after which nine Greek leaders volunteer and
    Nestor proposes that the gods decide who will fight.
  language: English
  quote_policy: quoted
