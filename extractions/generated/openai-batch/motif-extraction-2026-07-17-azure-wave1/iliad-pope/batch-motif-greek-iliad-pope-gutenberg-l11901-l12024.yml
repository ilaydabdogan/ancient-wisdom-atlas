  summary: Trojan forces dismount, divide into five bands, and advance against the
    Greek wall with hopes of burning the fleet. Asius alone keeps to his chariot and
    charges a gate, where Polyptes and Leonteus stand against him and his band. Heavy
    missiles fly from both sides. Asius complains that Jove and Heaven have deceived
    Trojan expectations, but the poem states that Jove remains unmoved and that the
    destined glory of the battle belongs to Hector.
