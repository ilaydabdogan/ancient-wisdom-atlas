canonical_text:
  quote: ''
  summary: The passage describes Zeus returning from Ida to Olympus, taking his golden
    throne, rebuking Juno and Pallas, and declaring that no god can overturn his will
    or fate. Juno protests on behalf of the Greeks but accepts the prohibition against
    direct intervention. Zeus foretells the next day’s Greek losses, Hector’s attack
    on the ships, Patroclus’ death, and Achilles’ vengeance. Night falls; Hector gathers
    Trojan chiefs near the Greek ships, orders food, watch fires, and city guards,
    and predicts renewed battle, the burning of the Greek fleet, and a contest with
    Tydides under Jove’s scales.
  language: English
