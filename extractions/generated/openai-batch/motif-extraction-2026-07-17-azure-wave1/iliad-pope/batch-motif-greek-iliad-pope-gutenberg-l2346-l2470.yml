canonical_text:
  quote: ''
  summary: Agamemnon rejects Achilles' threats and threatens to seize Achilles' captive
    woman if another captive must be returned. Achilles nearly draws his sword against
    Agamemnon, but Minerva, sent by Juno, appears privately to Achilles, seizes him
    by the hair, and commands him to restrain his violence. Achilles obeys, sheaths
    the sword, then curses Agamemnon and swears by a sacred sceptre that Greece will
    later seek his help in vain. He throws the sceptre down, and the aged Nestor rises
    to calm the quarrel.
  language: English
  quote_policy: summarized
