canonical_text:
  quote: ''
  summary: Nestor urges Agamemnon and Achilles to restrain their quarrel, recalling
    earlier heroes who accepted his counsel. Agamemnon and Achilles continue the dispute
    over Briseis, and Achilles threatens withdrawal from battle. Agamemnon sends a
    ship with offerings toward Chrysa and conducts purification and sacrifice. He
    then orders heralds to remove Briseis from Achilles' tent. Achilles receives the
    heralds, releases Briseis through Patroclus, vows not to aid the Greeks, and laments
    by the sea to his divine mother about his short life, lost honor, and Agamemnon's
    seizure of his prize.
  language: English
