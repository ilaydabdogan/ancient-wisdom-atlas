canonical_text:
  quote: ''
  summary: Hector and the Trojans press against the Greek wall until Sarpedon, inspired
    by Jove, advances with the Lycians. Sarpedon is compared to a hungry lion and
    urges Glaucus to prove their noble status by valor because death is unavoidable.
    Menestheus sees the Lycian threat, sends Thoos to summon the Ajaces and Teucer,
    and Ajax comes to the wall. The Lycians renew the assault; Ajax kills Epicles,
    Sarpedon's friend, with a thrown rock, and Epicles dies as his soul goes to the
    shades.
  language: English
  quote_policy: summarized
