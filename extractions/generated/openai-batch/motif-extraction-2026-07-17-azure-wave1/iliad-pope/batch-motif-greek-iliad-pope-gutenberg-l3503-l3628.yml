canonical_text:
  quote: ''
  summary: After the monarch speaks, the Greek army murmurs, disperses, kindles fires,
    sacrifices, and prays. Agamemnon leads a five-year-old steer to Jove's altar,
    gathers leading Greek chiefs, and prays for Troy, Priam's palace, Hector, and
    Trojan heroes to fall before night. Jove refuses the prayer and prepares further
    woes. The chiefs complete the sacrifice and feast. Nestor urges Agamemnon to call
    and arrange the troops. Heralds summon the army; the blue-eyed virgin passes among
    the ranks with Jove's shield, whose fringe is formed of a hundred serpents, and
    inspires the Greeks for battle. The troops assemble in radiant arms beside Scamander,
    while Agamemnon is described as towering above them with divinely marked glory.
    The narrator then invokes the nine all-knowing daughters of Jove to assist the
    catalogue of heroes, armies, names, numbers, and chiefs.
  language: English
  quote_policy: summarized
