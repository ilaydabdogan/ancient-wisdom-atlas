canonical_text:
  quote: ''
  summary: Jupiter observes a sea-god withdrawing from battle and commands Phoebus/Apollo
    to alarm the Greeks, shake his broad gis, and strengthen Hector. Apollo descends
    from Ida, finds Hector recovering by a stream after Ajax's blow, tells him that
    the Thunderer sends aid, and breathes immortal ardour into him. Hector returns
    to battle with his hosts, causing the Greeks to fear. Thoas calls Hector's return
    a portent and advises the Greeks to form a deep array, which they do.
  language: English
  quote_policy: summarized
