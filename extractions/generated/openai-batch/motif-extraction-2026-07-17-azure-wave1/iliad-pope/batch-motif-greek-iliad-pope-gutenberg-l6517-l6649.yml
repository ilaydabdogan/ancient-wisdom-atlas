canonical_text:
  quote: ''
  summary: Juno sees the battlefield carnage and urges Minerva to oppose Mars. The
    goddesses prepare a divine chariot; Minerva arms herself with Zeus's war-gear.
    They pass through the gates of heaven, petition Jove on Olympus, receive permission
    to confront Mars, descend to Troy, stop near the joined Simois and Scamander,
    and move among the Argives. Juno rebukes the Greek warriors in Stentor's voice,
    while Minerva approaches wounded Tydides beside his horses.
  language: English
  quote_policy: summarized
