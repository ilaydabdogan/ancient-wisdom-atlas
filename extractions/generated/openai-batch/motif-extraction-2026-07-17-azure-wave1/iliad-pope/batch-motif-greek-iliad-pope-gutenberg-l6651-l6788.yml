canonical_text:
  quote: ''
  summary: Minerva rebukes Diomed, who explains that he held back because she had
    warned him not to fight gods except Venus. Minerva then commands him to attack
    Mars, mounts his chariot, hides herself with Orcus' helmet, and drives at Mars.
    Mars attacks, but Pallas deflects his lance; Diomed, with the goddess's aid, wounds
    Mars. Mars ascends to heaven, complains to Jove, is rebuked for loving war, and
    is healed by Paeon before being dressed by Hebe and restored among the gods.
  language: English
  quote_policy: summarized
