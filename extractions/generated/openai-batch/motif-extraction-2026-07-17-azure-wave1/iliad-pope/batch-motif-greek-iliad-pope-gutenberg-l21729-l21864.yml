canonical_text:
  quote: ''
  summary: A dispute is resolved by yielding a horse prize. Achilles distributes further
    prizes and gives a double bowl or goblet to aged Nestor in memory of dead Patroclus.
    Nestor accepts, recalls his former athletic victories, acknowledges that younger
    men now compete, and praises Achilles for honoring age and the dead. Achilles
    then announces a boxing contest with a mule for the winner and a bowl for the
    defeated. Epeus boasts and challenges the host; Euryalus, aided by Tydides, fights
    him. Epeus knocks Euryalus down, and the defeated boxer is carried away bleeding
    while his friends receive the bowl.
  language: English
  quote_policy: summarized
