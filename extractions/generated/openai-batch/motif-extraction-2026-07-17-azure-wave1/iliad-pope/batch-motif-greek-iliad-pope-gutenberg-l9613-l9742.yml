canonical_text:
  quote: ''
  summary: Achilles allows Phoenix to stay or depart as he chooses. Phoenix rises
    in grief and urges Achilles not to abandon the Greeks. He recalls being sent by
    Peleus to instruct Achilles, recounts his own youthful family conflict, curse,
    near-violence, detention, escape, reception by Peleus, and his foster care of
    Achilles. He then argues that gods are appeased by offerings and prayers, personifies
    Prayers as daughters of Jove who follow Injustice, and warns that rejected supplication
    brings punishment. Phoenix urges Achilles to accept the honors sent by the Greek
    leader and begins an old example involving Calydon, a neglected sacrifice to Cynthia,
    a divinely sent boar, Meleager, and ensuing strife.
  language: English
  quote_policy: summarized
