canonical_text:
  quote: Jove, the great arbiter of peace and wars.
  summary: The passage opens Book IV with an argument summarizing the breach of the
    truce and the renewal of battle. In the main narrative, the gods sit in council
    on Olympus, where Jove provokes Juno and Minerva over the fate of Troy. Juno demands
    vengeance against Troy; Jove answers by permitting Troy’s destruction but requires
    reciprocal concession regarding cities dear to Juno. Juno proposes that Pallas/Minerva
    be sent to end the truce by making the Trojans violate it. Jove approves, and
    Minerva descends like lightning or a comet between the armies, where the hosts
    interpret the sign as a divine signal of peace or renewed bloodshed.
