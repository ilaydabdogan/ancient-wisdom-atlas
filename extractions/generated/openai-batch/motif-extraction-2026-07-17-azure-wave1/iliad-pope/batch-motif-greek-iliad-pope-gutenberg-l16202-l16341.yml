canonical_text:
  quote: ''
  summary: Apollo carries the slain Sarpedon from battle, purifies and dresses the
    body, and entrusts it to the twin figures Sleep and Death, who bring it to Lycia.
    Patroclus then drives furiously against Trojans and Lycians under a fate ordained
    by Jove. Apollo prevents him from taking Troy, later assumes Asius's shape to
    incite Hector, and turns battle morale toward the Trojans. Patroclus kills Cebrion
    with a stone, mocks him, and contends with Hector over the corpse amid general
    battle. After the Greeks recover the corpse and arms, Patroclus attacks again,
    but the passage closes with the Fates, Apollo, and Death ending his glory.
  language: English
  quote_policy: summarized
