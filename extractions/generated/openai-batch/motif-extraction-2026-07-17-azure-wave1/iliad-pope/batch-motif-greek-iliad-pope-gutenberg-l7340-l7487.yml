canonical_text:
  quote: ''
  summary: Hector meets Andromache, their infant son, and the nurse at the gate. Andromache
    pleads with him to consider her and their child, recounts the loss of her family,
    and urges him to defend a vulnerable place by the wall. Hector answers that honor
    and duty require him to fight, foresees Troy's fall and Andromache's captivity,
    removes his frightening helmet when the child cries, prays that his son may become
    a great defender of Troy, and returns the child to Andromache.
  language: English
  quote_policy: summarized
