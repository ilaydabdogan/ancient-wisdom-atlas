canonical_text:
  quote: ''
  summary: Achilles refuses to stop fighting until Troy and Hector face vengeance.
    The river Scamander/Xanthus rises against him, disgorging the dead and overwhelming
    him with waves. Achilles escapes by means of an uprooted elm but is pursued by
    the flood and fears a shameful death by drowning. Neptune and Pallas appear in
    human form, assure him that he is not fated to die in the river, and urge him
    onward until Hector falls. Achilles resumes battle through the flood while Xanthus
    continues to rage.
  language: English
  quote_policy: summarized
