canonical_text:
  quote: ''
  summary: During the chariot race at the funeral games, Ajax and Idomeneus quarrel
    over who is leading until Achilles stops them as the horses approach. Tydides
    wins; Antilochus, Menelaus, Meriones, and Eumelus follow in contested order. Achilles
    attempts to compensate Eumelus for misfortune, Antilochus asserts his right to
    the mare, Achilles gives Eumelus a corslet instead, and Menelaus challenges Antilochus
    over the disputed prize by demanding an oath before a sea-and-earthquake god.
    Antilochus apologizes and restores the mare to Menelaus.
  language: English
  quote_policy: summarized
