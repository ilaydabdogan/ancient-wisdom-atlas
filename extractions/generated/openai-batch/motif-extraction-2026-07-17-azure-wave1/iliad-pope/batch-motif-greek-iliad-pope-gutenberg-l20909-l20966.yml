canonical_text:
  quote: ''
  summary: A mourning wife laments her dead husband, her own desolation, and the future
    vulnerability of their only child, Astyanax. She imagines the child losing protection,
    inheritance, and welcome after his father’s death. She then addresses Hector’s
    exposed body and orders woven garments burned as an honor for the living rather
    than useful service to the dead. The surrounding matrons respond with shared lamentation.
  language: English
