  summary: The passage narrates the selection of Ajax by lot as the Greek champion,
    prayers to Jove, Ajax's arming and challenge to Hector, their single combat with
    lances, stones, and drawn swords, Apollo's aid to Hector after he falls, and the
    interruption of the duel by heralds because Night has come.
