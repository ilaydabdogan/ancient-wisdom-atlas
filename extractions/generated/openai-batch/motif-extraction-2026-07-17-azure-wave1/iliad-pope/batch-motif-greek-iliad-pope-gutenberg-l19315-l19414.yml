canonical_text:
  quote: ''
  summary: Hector defies Achilles and says war-success belongs to heaven. Hector throws
    a lance, but Pallas diverts it from Achilles; Apollo then hides Hector in a cloud.
    Achilles threatens that many Trojans will pay, then kills a series of warriors,
    including a youthful suppliant. His advance is compared to wildfire and to threshing
    at harvest, and he stands amid dust and blood, still enraged.
  language: English
