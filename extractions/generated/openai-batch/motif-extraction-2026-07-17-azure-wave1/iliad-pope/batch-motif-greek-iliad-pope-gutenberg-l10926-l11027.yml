canonical_text:
  quote: ''
  summary: Agamemnon kills and pursues Trojans with the Greek army following him.
    Hector is protected from death by Jove and destiny. As the Trojans flee toward
    Troy, Agamemnon presses them to the wall. Jove descends on Ida, sends Iris to
    Hector, and orders Hector to avoid direct combat until Agamemnon is wounded and
    leaves; then Jove will empower Hector to drive the Greeks back toward the ships
    until night. Iris delivers the command, and Hector rallies the Trojans for renewed
    fighting.
  language: English
  quote_policy: summarized
