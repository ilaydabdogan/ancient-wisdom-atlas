  summary: 'The passage contrasts Homer and Virgil as epic poets: Homer is characterized
    by invention, impetuosity, abundance, heroic force, terrifying divine power, marvellous
    fictions, and exuberant similes; Virgil is characterized by judgment, artistry,
    controlled majesty, tranquillity, benevolent divine order, and comparable marvels.
    The passage is critical prose and uses mythic figures and images rhetorically.'
