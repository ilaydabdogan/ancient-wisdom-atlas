canonical_text:
  quote: ''
  summary: The passage introduces Book XVIII, then narrates Achilles sitting by the
    Hellespont, fearing the fulfillment of Thetis' warning. Antilochus arrives and
    tells him Patroclus is dead and that Hector has taken his arms. Achilles mourns
    violently with ashes, torn hair, groveling, and cries; captives also lament, while
    Antilochus restrains him. In the sea depths, Thetis and the Nereids hear him,
    weep, gather in a grotto, and Thetis laments the doomed fate of her son. Thetis
    then leaves the sea with her attendant train, the tides part, and she comes to
    Achilles to ask the cause of his grief.
  language: English
