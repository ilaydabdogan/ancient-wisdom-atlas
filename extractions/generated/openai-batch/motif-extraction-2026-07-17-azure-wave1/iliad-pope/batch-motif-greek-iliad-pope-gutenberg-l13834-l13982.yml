  summary: Juno asks Venus for a love-charm and receives the embroidered zone or cestus.
    She then goes to Sleep, asks him to overcome Jove while Jove is absorbed in love,
    and secures his help by promising Pasithea under a binding oath. Juno and Sleep
    travel unseen to Ida, where Sleep hides in a fir as a night bird. Jove sees Juno,
    desires her, and hears her stated explanation that she is traveling to Ocean and
    Tethys to reconcile them.
