canonical_text:
  quote: ''
  summary: Idomeneus praises courage, contrasts cowardice with bravery, and urges
    Merion toward battle. Merion takes a spear and advances with Idomeneus, compared
    to Mars accompanied by Terror. They choose to aid the left while other Greek leaders
    hold the center. Their advance brings a violent clash described through fire,
    iron, dust, and storm imagery. The passage then frames the mortal battle within
    divine conflict between Jove and Neptune, with Neptune secretly aiding the Greeks
    in human form while both armies are bound in a fatal chain of war and discord.
  language: English
  quote_policy: summarized
