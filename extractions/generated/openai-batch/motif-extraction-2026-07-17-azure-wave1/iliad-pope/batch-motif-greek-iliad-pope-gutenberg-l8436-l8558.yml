canonical_text:
  quote: ''
  summary: In this English verse passage, Tydides resists the disgrace of flight while
    Nestor counsels him and drives the chariot away under Hector's taunts. Jove thunders
    from Ida as an omen favoring Troy, and Hector urges Trojan-allied forces and his
    horses toward the Greek ships, intending to burn the fleet and win heroic spoils.
    Juno urges Neptune to aid the Greeks, but Neptune refuses to oppose Jove. Hector
    presses the Greeks at the trench with firebrands, and Agamemnon rallies the army
    and prays to Jove, recalling sacrifices and asking that the surviving Greeks escape
    Hector.
  language: English
