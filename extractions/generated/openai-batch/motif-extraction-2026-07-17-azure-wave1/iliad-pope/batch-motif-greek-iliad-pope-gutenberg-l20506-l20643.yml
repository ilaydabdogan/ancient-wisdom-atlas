canonical_text:
  quote: ''
  summary: Achilles pursues Hector around Troy. Phoebus sustains Hector briefly, while
    Achilles prevents other Greeks from taking the kill. Jove weighs the heroes' fates,
    and Hector's lot sinks toward death. Phoebus leaves Hector; Minerva aids Achilles,
    then disguises herself as Deiphobus to lure Hector into standing and fighting.
    Hector proposes an oath to protect the defeated corpse, but Achilles rejects any
    pact. Achilles throws a spear, Hector dodges, and Minerva secretly restores the
    spear to Achilles. Hector declares he will not die dishonorably and prepares to
    cast his own dart.
  language: English
  quote_policy: summarized
