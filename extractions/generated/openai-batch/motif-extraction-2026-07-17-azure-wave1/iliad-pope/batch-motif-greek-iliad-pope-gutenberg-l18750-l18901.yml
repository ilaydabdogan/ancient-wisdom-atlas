canonical_text:
  quote: ''
  summary: Achilles acknowledges his fate and rushes back to battle. The Book XX argument
    announces divine intervention in the war. Jove summons a council of gods through
    Themis and permits the deities to aid either Greeks or Trojans. The gods divide
    by faction, the battlefield and cosmos are shaken by divine conflict, and Achilles
    seeks Hector with intensified rage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Achilles says he knows his fate is to die and not see his parents or native
    shore again, then declares Troy should perish and rushes to fight.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Book XX argument states that Jupiter permits gods to assist either party,
    Apollo encourages Aeneas against Achilles, Neptune preserves Aeneas, Apollo removes
    Hector in a cloud, and Achilles slaughters Trojans.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Jove commands Themis to call the gods to a council in the starry hall, and
    divine beings assemble at Jove's dome, with Ocean excepted.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Neptune leaves the sea, takes his throne among the gods, and asks Jove why
    the whole celestial assembly has been convened.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Jove says the council concerns the human race, that he will watch fate work,
    and that the gods may descend to aid either army because Achilles alone could
    make Troy fall before its fated time.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'The deities divide into opposing parties: several go to the Greek fleet,
    while Latona, Phoebus, Mars, the laughter-loving dame, Xanthus, and Diana aid
    Troy.'
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: Achilles appears again in arms before the Greek host, and the Trojan warriors
    are described as fearful at the sight.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Discord sounds alarms, Minerva calls from Greek positions, and Mars shrouds
    Troy in clouds while stirring fury among Trojans.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Jove thunders above, Neptune shakes the earth below, mountains, forests, rivers,
