  quote: ''
  summary: The passage introduces Book V as the acts of Diomed. Pallas empowers Diomed
    with martial force and radiance. Diomed kills Phegeus, while Vulcan rescues Idus
    in a smoky cloud. Minerva persuades Mars to withdraw from the fighting so Jove
    may decide the battle. The Greeks pursue the Trojans, and several named warriors
    and priests are killed by Greek leaders.
