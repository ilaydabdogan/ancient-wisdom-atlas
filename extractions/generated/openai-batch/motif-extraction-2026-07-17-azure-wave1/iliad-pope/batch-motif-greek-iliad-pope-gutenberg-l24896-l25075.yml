  summary: The passage is a sequence of editorial notes and comparative literary excerpts
    attached to Pope's Iliad. It mentions dawn personified as Aurora, blood-like drops
    or dew, battlefield courage, Priam's family practice, animal and rock similes
    for warriors, the river Simois carrying bodies and shields, Neptune overturning
    foundations, battle weighed in scales, night-like attack, mare-milking peoples,
    genealogical traditions about Minos as son of Jupiter, the dwelling of Sleep,
    sea-daughters as attendants, and floral imagery around a couch.
  language: English
  quote_policy: summarized
