  summary: Atrides/Menelaus withdraws reluctantly from the body of Patroclus, exhorts
    others to guard it, locates Antilochus, and sends him to tell Achilles that Patroclus
    is dead and Hector has taken the arms. Antilochus grieves and runs with the message.
    Menelaus returns to the body; Ajax directs that the corpse be lifted while he
    and his brother hold off Hector and the Trojans. The Greeks bear Patroclus away
    through a violent retreat, while the passage uses animal and natural-force similes
    for sight, pursuit, battle, and defense.
