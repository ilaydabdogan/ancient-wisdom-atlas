canonical_text:
  quote: ''
  summary: In the battle around the body of Sarpedon, warriors from both sides kill
    and taunt one another while Greeks and Trojans struggle for the corpse and its
    armor. Jove watches, weighs the fates, gives Patroclus temporary glory, causes
    Hector to withdraw, and later orders Phbus to cleanse and adorn Sarpedon's body
    before handing it to Sleep and Death for conveyance to Lycia and burial honors.
  language: English
  quote_policy: summarized
