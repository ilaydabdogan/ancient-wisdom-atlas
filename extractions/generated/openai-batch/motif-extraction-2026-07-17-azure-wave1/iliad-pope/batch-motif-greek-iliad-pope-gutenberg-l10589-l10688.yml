  summary: Athena commands Diomedes to cease slaughter and withdraw with Ulysses and
    the captured horses. Apollo, angered by Athena's aid, wakes Hippocoon, who discovers
    Rhesus's losses and raises alarm among the Trojans. Diomedes and Ulysses return
    to the Greek camp with Rhesus's horses and Dolon's spoils. Nestor questions the
    prize, Ulysses explains the night raid, the spoils are stored or dedicated, and
    the heroes cleanse, feast, and pour libations to Pallas.
