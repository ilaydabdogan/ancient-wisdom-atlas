  summary: In a battle at the Greek wall, Teucer kills Imbrius, Hector's javelin kills
    Amphimachus, and Greeks contest and strip the dead. Imbrius is decapitated and
    his head is thrown at Hector's feet. The god of ocean, grieving for his slain
    grandson, inspires the Greeks and speaks to Idomeneus in Thoas's voice. Idomeneus
    arms himself, advances in shining armor, and offers Meriones replacement weapons
    after Meriones' lance breaks in a Trojan shield.
