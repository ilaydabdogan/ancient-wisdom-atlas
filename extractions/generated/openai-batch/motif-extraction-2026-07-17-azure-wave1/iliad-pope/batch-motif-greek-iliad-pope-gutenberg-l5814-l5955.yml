canonical_text:
  quote: ''
  summary: The Lycian archer explains that Diomed appears protected by a god and laments
    having come to Troy with bow rather than chariot, spear, and shield. Aeneas urges
    a chariot assault; the Lycian agrees that Aeneas should guide the horses while
    he fights. Sthenelus warns Diomed that Lycaon's son and Aeneas are approaching,
    but Diomed refuses flight, invokes Pallas' direction, and instructs Sthenelus
    to seize Aeneas' divine-bred horses if the enemy falls. The Lycian throws a spear
    that pierces Diomed's shield and cuirass, but Diomed, aided by Pallas, casts a
    spear that kills him.
  language: English
  quote_policy: summarized
