canonical_text:
  quote: ''
  summary: The Greeks and Trojans fight at the ships. Ajax and Hector contend over
    a vessel. Ajax kills a fire-bearing Trojan; Hector kills Lycophron. Ajax summons
    Teucer, who kills Clytus with an arrow, then aims at Hector, but Jove prevents
    Hector's death by breaking Teucer's bowstring. Teucer changes from bow to shield
    and spear. Hector interprets the broken bow as Jove's favor and urges the Trojans
    and allies to burn the ships and accept death for their country.
  language: English
  quote_policy: summarized
