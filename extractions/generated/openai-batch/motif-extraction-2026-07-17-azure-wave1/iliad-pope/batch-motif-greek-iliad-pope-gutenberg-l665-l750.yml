  summary: The passage discusses conjectures about when Greek epic poems, especially
    the Iliad, were first written down. It contrasts oral rhapsodic performance for
    public audiences with manuscript use by a narrow emerging reading class, links
    this development to changes in seventh-century Greek poetry and access to papyrus
    through Egyptian commerce, and then questions the traditional credit given to
    Peisistratus or his circle for compiling the Homeric poems in their present form.
