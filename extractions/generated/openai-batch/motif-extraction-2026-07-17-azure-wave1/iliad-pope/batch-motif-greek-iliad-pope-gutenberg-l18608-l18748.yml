canonical_text:
  quote: ''
  summary: Achilles mourns Patroclus, imagines grief for Peleus and Neoptolemus, and
    turns toward revenge. Zeus orders Athena to sustain Achilles with ambrosia and
    nectar. The Achaean force moves from the ships, and Achilles arms himself in divine
    armour, takes his unique Pelion spear, mounts the chariot with immortal horses,
    and commands Xanthus and Balius not to abandon him. Xanthus, enabled by Juno,
    speaks and foretells Achilles' death, saying Patroclus fell through divine force
    and that Achilles' doom is required by the Fates.
  language: English
  quote_policy: summarized
