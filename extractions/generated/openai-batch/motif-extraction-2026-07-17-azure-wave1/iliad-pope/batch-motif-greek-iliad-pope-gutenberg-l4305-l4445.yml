canonical_text:
  quote: ''
  summary: Hector secures a parley and announces Paris' proposal that he and Menelaus
    fight in single combat, with Helen and the spoils awarded to the victor and peace
    made between the armies. Menelaus accepts and calls for oath-sacrifices and Priam's
    sanction. The armies suspend fighting. Iris, disguised as Laodice, summons Helen
    from her loom to watch the duel. Helen goes veiled to the Scaean gate, where Priam
    and the Trojan elders sit; the elders remark on her beauty and the danger it brings.
    Priam absolves Helen and asks her to identify Agamemnon, whom she names with shame
    and regret.
  language: English
  quote_policy: summarized
