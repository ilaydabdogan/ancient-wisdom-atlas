canonical_text:
  quote: ''
  summary: Priam performs a libation and prays to Jove for guidance and a favorable
    bird-omen before traveling to Achilles. Jove sends the omen, Priam departs with
    gifts, and Jove instructs Hermes to guard him. Hermes appears in youthful disguise,
    meets Priam and the herald at twilight near a spring, reassures Priam, questions
    him, and presents himself as a servant of Achilles. Priam asks where Hector's
    remains lie and whether they have been damaged by dogs.
  language: English
  quote_policy: summarized
