canonical_text:
  quote: ''
  summary: An elder replies to Atrides by distinguishing the wisdom of age from the
    combat suited to youth. The monarch then moves among Greek contingents, rebuking
    Menestheus, Ulysses, and Tydides/Diomed for seeming delay. Ulysses defends his
    readiness, and the king reconciles with him. The monarch exhorts Diomed by recounting
    Tydeus' exploits at Thebes, including divine signs, Pallas' aid, and an ambush.
    Sthenelus answers in defense of the sons, while Diomed restrains him and accepts
    the Greeks' duty to fight under the king's cause.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The experienced elder says he once had youthful strength and killed Ereuthalion,
    but now claims counsel as the proper work of old age while combat belongs to the
    young and bold.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The monarch finds Menestheus with the Athenian phalanx and Ulysses with his
    bands at a distance, unaware that the peace has been broken and with their squadrons
    unmoved.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The monarch reproaches the chiefs by contrasting their precedence at banquets
    with their apparent delay in battle.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ulysses blushes, rejects the reproach as unjust, says the warriors are armed
    and awaiting command, and declares readiness to enter the thick of battle.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The king praises Ulysses as great in action and wise in council, asks forgiveness
    for a martial outburst, and says the gods will keep worthy friends together.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The monarch comes to Tydides/Diomed, whose steeds and chariots are in firm
    array and who is attended by Sthenelus, and reproaches him for inactive watching.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The monarch recalls Tydeus as a warrior who sought armies at Mycenae, but
    Jove forbade them, while comets warned of the Theban war.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The recalled Tydeus enters Thebes alone as an envoy, demands the throne, combats
    the chiefs found feasting there, and subdues them with Pallas' aid.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The recalled Tydeus is ambushed by fifty warriors in a winding way, kills
    them, and spares one to carry the tale.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: Diomed remains silent and respectful while inwardly angered; Sthenelus, son
    of Capaneus, replies that the sons' achievements at Thebes surpassed those of
    their fathers because Heaven was on their side.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Tydides/Diomed tells his friend to suppress anger and revere the king, because
    the king bears the chief praise if Troy falls and the chief disgrace if the Greeks
    fail.
  category: speech
  evidence_refs:
  - ev:11
