canonical_text:
  quote: ''
  summary: Agamemnon addresses the Greek assembly, attributes his prior quarrel with
    Achilles to divine compulsion, and recounts how Ate and Juno once misled Jove
    over a birth-oath determining royal rule. He offers restitution to Achilles. Achilles
    urges immediate battle, while Ulysses advises food, public presentation of gifts,
    an oath about the captive woman, and a banquet. Agamemnon accepts the ritual settlement
    and orders gifts and a sacrificial boar. Achilles again rejects delay and food
    until he has avenged his dead friend.
  language: English
  quote_policy: summarized
