  summary: A concluding argument summarizes the Iliad as the story of an injured hero
    who withdraws from war, rejects compensation, lends his armor to a friend who
    dies, receives new armor from a divinity, returns to battle, slays the enemy chief,
    honors the friend with funeral rites, mistreats the enemy's corpse, and finally
    restores that corpse to the slain warrior's father for burial. The appended notes
    discuss carrion imagery, Jove's will, comparison to Milton, Apollo/Smintheus,
    divine arrows, and dreams as divine in origin.
