canonical_text:
  quote: ''
  summary: At dawn on the sea-shore, Thetis brings divine armour made by Vulcan to
    Achilles, who is grieving over Patroclus. Achilles fears that Patroclus' body
    will decay, but Thetis promises preservation and applies nectar and ambrosia to
    the corpse. Achilles then summons the Greek assembly, declares his anger ended,
    and calls for renewed war against Troy; the Greeks accept his finished wrath as
    Agamemnon begins to reply.
  language: English
  quote_policy: summarized
