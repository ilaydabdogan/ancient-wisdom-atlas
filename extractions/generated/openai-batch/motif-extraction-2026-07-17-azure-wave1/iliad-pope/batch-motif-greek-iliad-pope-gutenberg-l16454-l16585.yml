  summary: The passage opens Book XVII with an argument summarizing the battle over
    Patroclus' body. Menelaus guards the slain Patroclus, exchanges challenges with
    Euphorbus, kills him, and strips his arms. Apollo, disguised as Mentes, urges
    Hector to turn from chasing Achilles' horses and contest the spoils. Hector sees
    Euphorbus dead and advances toward Menelaus.
