canonical_text:
  quote: ''
  summary: Achilles refuses mercy and ransom to Lycaon, kills him, and casts his body
    into the Scamander. He taunts the river and says Trojan offerings to it are vain.
    Scamander is angered by the dead choking his waters. Achilles then confronts and
    kills Asteropeus, a Paeonian warrior of river descent, after an exchange about
    ancestry. Achilles asserts the superiority of his descent from Jove over river
    lineage. Scamander speaks from the flood, complaining that his streams are clogged
    with bodies and asking Achilles to turn away.
  language: English
  quote_policy: summarized
