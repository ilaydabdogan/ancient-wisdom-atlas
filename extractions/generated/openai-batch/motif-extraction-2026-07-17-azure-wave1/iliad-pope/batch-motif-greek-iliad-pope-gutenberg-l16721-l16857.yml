canonical_text:
  quote: ''
  summary: Zeus observes Hector wearing Achilles' armor after Patroclus' death, pities
    him, and grants him a brief final glory. Hector is divinely strengthened, exhorts
    Trojan and allied forces, and offers honor and spoils to whoever wins Patroclus'
    body. Ajax calls Greek leaders to defend the corpse from desecration. The armies
    clash around the body; Zeus darkens the fight while protecting Patroclus from
    birds. Hippothous drags the corpse by the feet but is killed by Ajax and falls
    beside the dead.
  language: English
  quote_policy: summarized
