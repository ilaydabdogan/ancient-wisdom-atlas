  summary: A god in human form is recognized as divine rather than Calchas, and Greek
    heroes feel renewed strength. Neptune inspires the exhausted Greeks at the ships
    with a speech rebuking shame and warning that Hector is at the wall. The Greeks
    form a dense phalanx around the Ajaxes. Hector leads the Trojan charge, is compared
    to a rock rolling down from a mountain, withstands attack, and exhorts the Trojans.
    Deiphobus advances with his shield, and Merion's javelin breaks against it before
    Merion retreats to get another weapon.
