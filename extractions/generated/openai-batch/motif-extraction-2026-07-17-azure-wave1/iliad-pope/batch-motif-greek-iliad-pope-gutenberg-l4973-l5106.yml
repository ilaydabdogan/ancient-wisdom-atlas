canonical_text:
  quote: ''
  summary: Pallas moves through the Trojan ranks in mortal disguise and persuades
    Pandarus to shoot at Menelaus after making a vow to Apollo. Pandarus prepares
    his horn bow and releases an arrow. Pallas diverts the shaft so that it wounds
    Menelaus but does not kill him. Agamemnon laments the apparent breach of the truce,
    predicts divine vengeance against Troy, is reassured by Menelaus, and sends Talthybius
    to summon Machaon for medical aid.
  language: English
  quote_policy: summarized
