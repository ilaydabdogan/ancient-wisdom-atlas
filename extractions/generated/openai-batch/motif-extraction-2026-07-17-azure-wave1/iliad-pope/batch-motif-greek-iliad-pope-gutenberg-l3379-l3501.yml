canonical_text:
  quote: ''
  summary: An unnamed Greek speaker rebukes the army's desire to return home after
    nine years and recalls an Aulis sacrifice where a dragon or serpent sent by Jove
    killed a mother-bird and her eight young, then became a marble prodigy. Chalcas
    interpreted the nine slain birds as nine years of labor before Ilion would fall
    in the tenth. Nestor then urges the monarch/Atrides to lead, remember vows, divide
    the army by tribes and nations, and prevent flight. The king praises Nestor, notes
    Achilles' withdrawal over a captive maid, orders the troops to eat and arm for
    battle, and threatens deserters with scavenging birds and dogs.
  language: English
  quote_policy: summarized
