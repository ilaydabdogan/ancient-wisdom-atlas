  summary: Hector’s mother pleads with him not to face Achilles alone. Hector remains
    resolved but debates whether to retreat, negotiate, or fight. Achilles approaches
    in shining armor; Hector flees, and Achilles pursues him three times around Troy
    past notable landmarks. The gods watch. Zeus pities Hector and asks whether to
    save him or leave him to fate; Athena objects that Hector is mortal and destined
    to die. Zeus allows Athena to act and yields to the Fates.
