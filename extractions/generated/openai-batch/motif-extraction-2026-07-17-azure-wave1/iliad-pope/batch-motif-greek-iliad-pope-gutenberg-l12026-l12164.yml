canonical_text:
  quote: ''
  summary: 'The Lapithae hold a pass and kill named warriors. Hector and Polydamas
    lead the Trojan host toward the Grecian wall and fleet, but a portent appears:
    Jove''s bird carries a serpent, is bitten, and drops it among the troops. Polydamas
    interprets the event as a warning not to press the attack; Hector rejects his
    counsel and leads the assault. Jove sends wind and dust from Ide, terrifying the
    Greeks and aiding Hector. Trojans batter the wall while Greeks and the Ajaces
    defend and exhort one another; stones fall thickly, compared to a snowstorm sent
    by Jove.'
  language: English
  quote_policy: summarized
