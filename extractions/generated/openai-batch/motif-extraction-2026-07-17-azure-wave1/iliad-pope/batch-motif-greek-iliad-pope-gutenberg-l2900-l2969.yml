canonical_text:
  quote: ''
  summary: Jove rebukes the goddess for seeking what heaven hides, asserts an immutable
    decree, and commands submission. The divine assembly is silenced. Vulcan, seeing
    his mother threatened, urges Juno to comply with Jove for the sake of heavenly
    peace, offers her nectar, recalls being hurled from heaven when he once defended
    her, and then serves the gods. Laughter returns, the gods feast with Apollo's
    lyre and the Muses' song, and at sunset they depart to their dwellings while Jove
    and Juno sleep.
  language: English
  quote_policy: summarized
