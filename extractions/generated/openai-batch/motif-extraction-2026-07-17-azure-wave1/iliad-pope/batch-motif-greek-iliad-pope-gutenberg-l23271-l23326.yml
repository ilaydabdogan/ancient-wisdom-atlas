canonical_text:
  quote: ''
  summary: 'A concluding note states that the Iliad has ended with the anger of Achilles
    brought to an end, then summarizes later events involving Troy and principal figures:
    the wooden horse, deaths, betrayals, homecomings, exile, peace, and Ulysses''
    return. It closes with the narrator''s dedication of the completed work to Mr.
    Congreve.'
  language: English
  quote_policy: summarized
