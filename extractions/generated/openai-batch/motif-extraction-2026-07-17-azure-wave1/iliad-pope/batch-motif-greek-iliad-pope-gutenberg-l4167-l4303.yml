  summary: The passage gives the argument of Book III and opens the narrative of the
    duel of Menelaus and Paris. The armies assemble before Troy; Paris advances armed
    and challenges the Greeks, but withdraws in fear when Menelaus approaches. Hector
    rebukes Paris for cowardice and for bringing Helen from Sparta. Paris accepts
    the rebuke and proposes that he and Menelaus fight in a middle space for Helen
    and her wealth, with peace to follow the result.
