canonical_text:
  quote: ''
  summary: The passage describes a sequence of battlefield killings at the Grecian
    wall. Named warriors are slain by spear, sword, arrow, and axe; some victors strip
    the dead of armor. Neptune protects Antilochus and turns aside Adamas' attack.
    Helenus kills Deipyrus, Menelaus wounds Helenus, Agenor tends the wound, and Menelaus
    kills Pisander. Menelaus then addresses the Trojans, accusing them of delighting
    in war, violating rites, ravishing a princess, burning ships, and provoking eventual
    ruin while invoking Jove.
  language: English
  quote_policy: summarized
