canonical_text:
  quote: ''
  summary: 'A sequence from the funeral games presents contests in armed combat, discus
    throwing, archery, and dart-casting. Prizes include heroic arms, a gold-studded
    sword, an iron quoit, axes, a spear, and a decorated charger. The archery contest
    contrasts an archer who makes no vow to Phoebus with one who vows firstling lambs
    and succeeds. The final prize is redirected by honor: the king receives praise,
    Merion receives the spear, and the charger is set apart for sacred use under Talthybius.'
  language: English
  quote_policy: summarized
