canonical_text:
  quote: ''
  summary: A first-person Pylian veteran recounts earlier rites and battle against
    the Epeians, including sacrifices, a martial rout, and divine intervention. He
    then criticizes Achilles' inaction, recalls the recruitment of Achilles and Patroclus
    at Phthia, and urges Patroclus either to persuade Achilles or to lead the Myrmidons
    wearing Achilles' arms. Patroclus leaves, encounters the wounded Eurypylus, and
    treats him by removing the embedded weapon, washing the wound, and applying a
    healing root and styptic juice from knowledge traced to Chiron and Achilles.
  language: English
  quote_policy: summarized
