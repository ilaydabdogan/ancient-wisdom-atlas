  locator: 11646-11651
  quote_or_summary: Solemn rites are paid to Jove; an untamed heifer is given to the
    blue-eyed maid; bulls are slain for Alphaeus and the blue monarch of the watery
    main; the army sleeps armed beside the flood while Epeians stand around the town.
  source_text_path: texts/public-domain/greek/project-gutenberg/iliad-pope.md
  rights_note: Public domain source; summarized.
- id: ev:3
  type: summary
  locator: 11652-11660
  quote_or_summary: At dawn Pylos and Elis meet; the first to fall under the speaker's
    javelin is King Augias' son, spouse of Agamede, who knew the healing virtues of
    simples and herbs.
  source_text_path: texts/public-domain/greek/project-gutenberg/iliad-pope.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 11661-11674
  quote_or_summary: The speaker seizes a car, leads the battle, routs the Epeians,
    takes fifty captive chariots, and drives the foe; Neptune shrouds Actor's sons
    in clouds, and Pallas stops the pursuit where Alisium flows.
  source_text_path: texts/public-domain/greek/project-gutenberg/iliad-pope.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 11675-11683
  quote_or_summary: The speaker returns triumphantly to Pyle; public thanks go to
    Jove and to Nestor; he then contrasts his youthful valor with Achilles' inactive
    fury and its danger to Greece.
  source_text_path: texts/public-domain/greek/project-gutenberg/iliad-pope.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: 11684-11703
  quote_or_summary: The speaker recalls going with Ulysses to Peleus' court at Phthia,
    where Peleus sacrifices a bull to Jove, pours libations on flaming thighs, and
    Achilles, Peleus, and Menoetius attend the fire and feast; Peleus tells Achilles
    to be brave, and Menoetius tells Patroclus to counsel Achilles.
  source_text_path: texts/public-domain/greek/project-gutenberg/iliad-pope.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: 11704-11720
  quote_or_summary: The speaker urges Patroclus to persuade Achilles; if an oracle
    or heaven restrains Achilles, Patroclus should lead the Myrmidons clad in Achilles'
    arms so Troy may tremble and Greece recover.
  source_text_path: texts/public-domain/greek/project-gutenberg/iliad-pope.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 11721-11742
  quote_or_summary: Patroclus leaves the tent along the shore and near the public
    mart, courts, Ulysses' fleet, and altars meets Eurypylus, son of Euaemon, with
    an arrow head rooted in his wound and dark blood on the ground; Patroclus asks
    about Greece and Hector.
  source_text_path: texts/public-domain/greek/project-gutenberg/iliad-pope.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 11743-11762
  quote_or_summary: Eurypylus says Troy is driving Greece to the ships and wounded
    chiefs lie in the fleet; he asks Patroclus to lead him to his ships, draw the
    dart, wash away gore, and apply balms such as Chiron taught Achilles and Achilles
    taught Patroclus; Podalirius and Machaon are unavailable.
  source_text_path: texts/public-domain/greek/project-gutenberg/iliad-pope.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 11763-11775
  quote_or_summary: Patroclus says the gods alone know events, supports Eurypylus,
    has hides laid down, cuts away the steel, washes the wound, bruises a bitter root,
    infuses styptic juice, and the flesh ceases to glow, torture, and bleed.
  source_text_path: texts/public-domain/greek/project-gutenberg/iliad-pope.md
  rights_note: Public domain source; summarized.
