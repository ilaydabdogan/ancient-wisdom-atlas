- id: motif:3
  label: Substitute warrior wearing the champion's arms
  taxonomy_refs: []
  basis: Patroclus is urged to lead the Myrmidons while clad in Achilles' arms so
    Troy may tremble and desist from war.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Within this passage the act is proposed, not yet carried out.
- id: motif:4
