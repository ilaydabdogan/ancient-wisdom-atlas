canonical_text:
  quote: ''
  summary: After Hector's death, the victor fastens his body to a chariot and drags
    it before Troy. Hector's parents and the city grieve; his father tries to leave
    the walls to beg the killer for pity. Hecuba laments Hector as Troy's defense.
    Andromache, still unaware, is weaving while a bath is prepared for Hector's return;
    hearing cries, she fears his death, runs to the wall, sees his body dragged, and
    faints.
  language: English
  quote_policy: summarized
