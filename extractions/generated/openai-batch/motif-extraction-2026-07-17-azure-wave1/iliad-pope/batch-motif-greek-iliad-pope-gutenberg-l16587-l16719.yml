  quote: ''
  summary: Menelaus considers leaving Patroclus' body under divine and Trojan pressure,
    seeks Ajax, and together they defend the remains. Hector has stripped Patroclus
    of Achilles' armor, withdraws before Ajax, is rebuked by Glaucus for abandoning
    Sarpedon and fearing Ajax, then rallies the allies and puts on Achilles' divinely
    made armor.
  language: English
  quote_policy: summarized
