  quote: ''
  summary: The passage opens Book VI with an argument summarizing Hector’s return
    to Troy, a proposed procession to Minerva, the meeting and armor exchange of Glaucus
    and Diomedes, and Hector’s farewell to Andromache. The verse portion describes
    the gods leaving the battle, Greek successes between the Simois and Scamander,
    a sequence of killings, the death of hospitable Axylus, the killing of twin sons
    of a naiad and Bucolion, the capture and rejected supplication of Adrastus, Agamemnon’s
    order of no mercy toward Troy, Nestor’s exhortation to postpone booty until victory,
    and Helenus beginning to advise Hector and Aeneas.
  language: English
  quote_policy: summarized
