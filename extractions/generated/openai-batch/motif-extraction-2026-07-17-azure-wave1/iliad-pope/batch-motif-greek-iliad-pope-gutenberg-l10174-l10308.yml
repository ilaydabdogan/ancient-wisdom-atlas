canonical_text:
  quote: ''
  summary: Greek chiefs inspect the night guard, convene in a battlefield council,
    and hear Nestor ask for a warrior to reconnoiter the Trojan camp. Diomedes volunteers,
    requests a companion, and chooses Ulysses for his counsel and divine favor. The
    two arm themselves, leave by dark paths, receive a heron omen sent by Minerva,
    and Ulysses prays for safe passage and a memorable deed against Troy.
  language: English
  quote_policy: summarized
