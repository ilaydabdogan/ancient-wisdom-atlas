canonical_text:
  quote: ''
  summary: An ocean-associated god intervenes in battle, blinds Achilles with darkness,
    rescues a Dardan prince from him, and warns the prince not to seek a premature
    death. Achilles rallies the Greeks, Hector rallies the Trojans, and Phoebus warns
    Hector to avoid single combat with Achilles. Achilles then kills Iphytion, Demoleon,
    Hippodamas, and Polydore; Hector, moved by Polydore's death, comes forward to
    face Achilles.
  language: English
  quote_policy: summarized
