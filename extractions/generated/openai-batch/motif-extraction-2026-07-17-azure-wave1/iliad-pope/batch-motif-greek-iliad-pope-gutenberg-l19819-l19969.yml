canonical_text:
  quote: ''
  summary: 'A personified river calls on Simois to help overwhelm Achilles with floodwaters,
    rocks, and corpses and to deny him burial. Juno summons Vulcan, who burns the
    plain, riverbanks, plants, fish, and waters until the river yields and swears
    not to aid Troy. Juno stops Vulcan, and the river resumes its course. The gods
    then fight: Mars attacks Minerva, Minerva strikes him down with an ancient boundary
    stone, and Venus helps him away while Juno observes.'
  language: English
  quote_policy: summarized
