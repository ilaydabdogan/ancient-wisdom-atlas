canonical_text:
  quote: ''
  summary: Diomed prays to Pallas for aid and vows a sacrificial steer; Pallas grants
    the prayer. Hector asks the Trojan leaders for a night scout to inspect the Greek
    fleet and offers a rich reward. Dolon volunteers after securing Hector's oath
    for Achilles' horses and chariot, arms and disguises himself with animal hides,
    and goes toward the Greek camp. Ulysses and Diomed detect him, hide, pursue him,
    stop him with a cast javelin, seize him, and begin questioning him after he begs
    for his life and offers ransom.
  language: English
  quote_policy: summarized
