  quote: A work of this kind seems like a mighty tree...
  summary: The preface defends Homer against critics who elevate Virgil at Homer’s
    expense, argues for Homer’s priority and inventive power, compares Homer’s work
    to a vigorous fruit-bearing tree that could be pruned but not fundamentally surpassed,
    and states that a translator must preserve the author’s images and design entire
    and unmaimed.
