canonical_text:
  quote: ''
  summary: Patroclus asks Achilles to let him lead the Myrmidons in Achilles' armor,
    hoping Achilles' appearance will drive the Trojans from the ships. Achilles explains
    his anger over the woman taken from him, sends Patroclus to save the ships, but
    warns him not to pursue to Troy or engage Hector. Ajax is overwhelmed at the ships;
    Hector cuts Ajax's spear, Ajax reads the event as a divine sign, and Trojan fire
    reaches the ships. Achilles sees the flames and orders Patroclus to arm. Patroclus
    puts on Achilles' armor except for Achilles' unique spear, and Automedon harnesses
    Achilles' horses.
  language: English
  quote_policy: summarized
