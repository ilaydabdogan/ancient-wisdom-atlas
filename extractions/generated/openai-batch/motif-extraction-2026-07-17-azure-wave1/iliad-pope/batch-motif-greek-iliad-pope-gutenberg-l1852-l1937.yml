literal_observations:
- id: obs:1
  text: Some Homeric epithets are said to require circumlocution; the mountain epithet
    translated literally as leaf-shaking is rendered by a phrase about a lofty mountain
    shaking its waving woods.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apollo's epithet far-shooting is described as having a literal explanation
    connected with darts and bow and an allegorical explanation connected with rays
    of the sun.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The speaker recommends avoiding perpetual repetition of the same epithets
    while placing them where they gain beauty from context.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Homer's repetitions are divided into whole narrations and speeches, single
    sentences, and one verse or hemistitch.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Repetition is described as appropriate in speeches involving messages from
    gods to men, hierarchical state concerns, and solemn religious forms such as prayers
    and oaths.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Homer is described as applying sound to sense and varying verse with each
    new subject; Virgil is named as similarly eminent in Latin.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The first-person speaker says he cannot do full justice to Homer but hopes
    to produce a more tolerable complete verse translation than existing ones by Chapman,
    Hobbes, and Ogilby.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Chapman's translation is described as loose, rambling, interpolated, sometimes
    mistaken, interested in hidden meanings, and animated by a daring fiery spirit.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Hobbes is described as generally correct in sense but as cutting particulars,
    omitting beautiful material, and sometimes making careless mistakes; Ogilby's
