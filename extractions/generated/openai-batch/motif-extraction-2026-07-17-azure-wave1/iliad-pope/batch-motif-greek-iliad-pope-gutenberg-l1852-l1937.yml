  summary: The passage is a prefatory discussion of translating Homer. It treats Homeric
    epithets, including a mountain epithet and Apollo's epithet, discusses repetition
    in speeches and religious forms, comments on sound matching sense in Homer and
    Virgil, and evaluates earlier verse translations by Chapman, Hobbes, and Ogilby.
  language: English
