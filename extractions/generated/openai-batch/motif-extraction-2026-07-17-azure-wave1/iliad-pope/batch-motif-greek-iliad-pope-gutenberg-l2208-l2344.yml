canonical_text:
  quote: ''
  summary: Calchas asks Achilles for protection before revealing that Apollo's plague
    is caused by Agamemnon's dishonor to the priest and seizure of the captive woman.
    Achilles swears to protect him. Agamemnon angrily agrees to return the woman for
    the public good but demands compensation and threatens to seize another leader's
    prize, including Achilles'. Achilles denounces Agamemnon, states that he came
    to Troy for Agamemnon's cause rather than his own, and declares that he will return
    to Thessaly with his fleet.
