  quote: ''
  summary: Thetis rises from the sea to hear Achilles' complaint. Achilles recounts
    Agamemnon's insult to Chryses, Apollo's plague, and the seizure of Briseis, then
    asks Thetis to petition Jove for vengeance on the Greeks. Thetis laments Achilles'
    fate and promises to go to Olympus. Ulysses returns Chryseis to Chryses at Apollo's
    shrine, offers a hecatomb, and Chryses prays that Apollo end the plague.
  language: English
