canonical_text:
  quote: ''
  summary: 'The passage describes a battle near the ships: a sea-ruling god appears
    opposite Hector and the sea rises around the ships; Hector attacks Ajax but Ajax
    strikes Hector down with a heavy stone. Hector is shielded by Trojan leaders and
    carried away to the Xanthus, where he is sprinkled with water and intermittently
    revives and faints. The fighting continues with Oilean Ajax killing Satnius, Polydamas
    killing Prothonor and invoking Pluto''s hall, Ajax killing Archilochus in retaliation,
    and Acamas killing Promachus as vengeance for his brother.'
  language: English
  quote_policy: summarized
