canonical_text:
  quote: "“Let Hector die, / And let me fall!”"
  summary: Achilles grieves over Patroclus, resolves to avenge him though Thetis warns
    that Hector's death will be followed by Achilles' own. Thetis promises to bring
    new divine armor from Vulcan and sends the Nereids back to the sea. Meanwhile
    Hector and the Trojans struggle to seize Patroclus' body, Juno secretly sends
    Iris to urge Achilles to intervene, and Achilles answers that he cannot fight
    unarmed while Ajax defends the body.
  language: English
  quote_policy: quoted
