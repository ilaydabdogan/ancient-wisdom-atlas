canonical_text:
  quote: ''
  summary: 'Achilles sleeps on the shore after grieving. The shade of Patroclus appears,
    asks for burial rites so he may enter the realm below and cross the flood, predicts
    Achilles'' own death, and requests that their ashes be joined in a golden urn.
    Achilles cannot embrace the shade, wakes, and reflects on the survival of the
    mind as an empty shade. At dawn, funeral preparations begin: timber is cut from
    Ida, a procession brings Patroclus to the pyre, and Achilles cuts and casts his
    vowed hair toward the deep, saying Patroclus will bear it to the shades below.'
  language: English
  quote_policy: summarized
