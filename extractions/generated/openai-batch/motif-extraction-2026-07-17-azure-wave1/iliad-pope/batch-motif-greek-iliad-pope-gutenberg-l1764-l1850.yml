canonical_text:
  quote: ''
  summary: 'The passage from Pope''s preface discusses how a translator should render
    Homer into English: avoid both servile literalism and rash paraphrase, preserve
    the poem''s spirit and ''fire,'' follow Homer''s alternation of plain and elevated
    style, retain noble simplicity, draw cautiously on Scripture-like diction, preserve
    moral and proverbial sayings plainly, avoid modern terminology, and handle compound
    epithets and repetitions with care.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that a literal translation cannot fully do justice to an
    excellent Greek original, but that rash paraphrase can also lose the spirit of
    antiquity.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says the translator should chiefly preserve the poem's 'fire'
    and should not try to make the author greater than the author is in any particular
    place.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage presents Homer as a guide who teaches when to be plain and when
    to be poetical or figurative, and it describes translators as followers who may
    either strain too violently or creep too servilely after him.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage identifies noble simplicity as perfected in Scripture and Homer,
    and says Homer's style resembles the sacred books more than that of any other
    writer.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says Homer's moral sentences and proverbial speeches should be
    rendered plainly because their unadorned gravity and shortness give them a venerable,
    almost oracular quality.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage allows cautious use of Greekisms and old words after Milton's
    manner, but rejects modern terms of war and government such as platoon, campaign,
    and junto.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage names compound epithets and repetitions as distinctive marks of
    Homer's diction, and gives 'cloud-compelling Jove' as an example of an acceptable
    English compound epithet.
  category: attribute
  evidence_refs:
  - ev:7
