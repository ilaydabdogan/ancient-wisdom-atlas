canonical_text:
  quote: With prayers to move him, or with gifts to bend.
  summary: Night guards are posted around the Greek defenses. Agamemnon convenes a
    council, where Nestor urges him to repair his wrong against Pelides/Achilles by
    prayers and gifts. Agamemnon acknowledges fault and lists extensive gifts, honors,
    marriage ties, and cities intended to end Achilles' wrath. Nestor approves the
    offer and names an embassy to Achilles, instructing prayer to Jove with pure hands.
  language: English
