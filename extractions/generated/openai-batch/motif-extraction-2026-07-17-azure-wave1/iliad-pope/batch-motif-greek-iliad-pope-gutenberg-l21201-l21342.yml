canonical_text:
  quote: ''
  summary: 'Achilles conducts rites for Patroclus: he lays a sacred lock on the dead
    hand, directs the Greeks in building and attending the pyre, offers animals, jars,
    libations, and Trojan captives, calls to Patroclus'' spirit, invokes the winds
    to kindle the fire, and later has the bones collected in a golden vase and a tomb
    raised. The gods preserve Hector''s corpse from Achilles'' threat of desecration.'
  language: English
  quote_policy: summarized
