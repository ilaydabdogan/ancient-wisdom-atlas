  quote: ''
  summary: Tydides ranges violently through the battle, is wounded by Pandarus, prays
    to Minerva, receives renewed strength and divine sight, and returns to kill multiple
    opponents. Aeneas then seeks Pandarus and wonders whether the attacking force
    is a mortal warrior or an angry god punishing Troy for neglected sacrifice.
  language: English
  quote_policy: summarized
