canonical_text:
  quote: ''
  summary: Priam tells Hecuba that a messenger of Jove has ordered him to go with
    gifts to Achilles and obtain Hector's body. Hecuba warns him against entering
    the enemy camp, but Priam insists that heaven commands him and prepares to risk
    death for a final embrace of his son. He gathers costly ransom gifts, angrily
    dismisses attendants, laments the loss of Hector and other sons, rebukes his surviving
    sons, and has the car and wain prepared. Hecuba brings wine for a libation to
    Jove and advises Priam to seek a favorable eagle omen before going.
  language: English
  quote_policy: summarized
