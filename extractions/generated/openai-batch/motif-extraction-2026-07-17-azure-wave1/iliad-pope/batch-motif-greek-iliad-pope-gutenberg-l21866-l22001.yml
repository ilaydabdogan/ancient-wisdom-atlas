canonical_text:
  quote: ''
  summary: At the funeral games for Patroclus, Achilles oversees wrestling and footrace
    contests, sets valuable prizes, divides an inconclusive wrestling victory between
    Ajax and Ulysses, and later awards race prizes after Pallas aids Ulysses and causes
    Oilean Ajax to fall near the pyre. Antilochus jokes about age and prowess and
    receives an added gold prize from Achilles.
  language: English
  quote_policy: summarized
