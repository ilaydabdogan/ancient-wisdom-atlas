canonical_text:
  quote: ''
  summary: 'The passage recounts episodes in the divine battle around Troy: Minerva
    strikes Venus; Poseidon challenges Apollo and recalls Laomedon''s broken payment
    to the gods; Apollo refuses to fight over mortals; Artemis rebukes him but is
    overpowered by Juno; Latona and Hermes avoid further combat; Artemis complains
    to Zeus; the gods return to Olympus while Apollo enters Ilion. The passage then
    turns to Achilles'' destructive advance and Priam''s alarm from the walls of Troy.'
  language: English
  quote_policy: summarized
