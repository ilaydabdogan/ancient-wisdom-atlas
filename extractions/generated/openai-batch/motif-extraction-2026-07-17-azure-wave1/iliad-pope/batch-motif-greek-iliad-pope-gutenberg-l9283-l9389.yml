canonical_text:
  quote: ''
  summary: After ritual cleansing, libations, and Nestor's instructions, a Greek embassy
    led by Ulysses goes by night to Achilles' Myrmidon tents, praying to Neptune for
    success. They find Achilles soothing his anger with a harp while Patroclus listens.
    Achilles welcomes the visitors, provides wine and a prepared feast with offerings
    to the immortals. Ulysses then addresses Achilles, describing the Greek crisis,
    Trojan threats, Jove's favorable omens for the enemy, Hector's impending attack,
    and urging Achilles to return and remember Peleus's counsel.
  language: English
  quote_policy: summarized
