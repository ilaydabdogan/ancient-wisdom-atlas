canonical_text:
  quote: ''
  summary: Hector addresses Andromache, saying that fate fixes the time of death for
    all and sending her back to household work while he returns to battle and fame.
    He resumes his helmet; Andromache departs grieving, and her maids mourn Hector
    as though he were already dead. Paris then emerges armed from the palace, is compared
    to an unbound horse, joins Hector, excuses his delay, and is urged by Hector to
    share the Trojans' war-labor. Hector hopes Jove will decree Trojan liberation
    and Greek withdrawal. The excerpt also includes two illustration captions.
  language: English
  quote_policy: summarized
