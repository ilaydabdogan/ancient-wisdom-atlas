canonical_text:
  quote: ''
  summary: Ulysses counsels against prolonged fasting and grief, urging food and readiness
    for battle. Agamemnon's gifts are publicly brought forward, and he swears by divine
    powers that Briseis was untouched, sealing the oath with a boar sacrifice. Achilles
    attributes the quarrel and losses to Jove, sends the chiefs to eat, and prepares
    for battle. Briseis returns to Achilles' tent, sees Patroclus' body, and laments
    him together with her own losses. Achilles refuses food until sunset while leaders
    fail to calm his grief and rage.
  language: English
  quote_policy: summarized
