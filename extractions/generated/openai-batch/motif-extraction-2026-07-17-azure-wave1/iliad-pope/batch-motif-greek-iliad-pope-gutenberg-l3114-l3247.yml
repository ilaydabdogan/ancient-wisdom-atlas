  summary: Nestor urges the Greek leaders to obey a divine warning sent by Jove and
    rouse the army. The kings assemble the host, Agamemnon raises an inherited golden
    sceptre of divine origin, and he gives a designed speech urging flight from Troy.
    The army rushes toward the ships. Hera sees the possible departure and sends Athena
    to stop it. Athena instructs Ulysses, who receives Agamemnon's sceptre and moves
    through the army persuading the chiefs.
  language: English
