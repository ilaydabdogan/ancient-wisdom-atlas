canonical_text:
  quote: ''
  summary: Achilles arranges a chariot race by lots and sends Phoenix to judge it.
    The racers begin; Eumelus leads, with Diomedes close behind. Phoebus knocks the
    scourge from Diomedes' hand, but Pallas/Minerva restores it, strengthens his horses,
    breaks the rival chariot, and Diomedes wins while Eumelus falls injured. Menelaus
    follows, and Antilochus forces a risky pass through a narrow way by a torrent-worn
    precipice, drawing Menelaus' warning and accusation of fraud. A Cretan king watches
    from high ground and reports that the leading horses now appear different, likely
    those of the Aetolian chief.
  language: English
  quote_policy: summarized
