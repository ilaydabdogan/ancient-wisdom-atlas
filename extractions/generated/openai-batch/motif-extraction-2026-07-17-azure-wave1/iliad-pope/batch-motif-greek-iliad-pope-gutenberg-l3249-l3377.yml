canonical_text:
  quote: |-
    To one sole monarch Jove commits the sway;
    His are the laws, and him let all obey.[86]
  summary: Ulysses restrains the Greek troops by invoking royal authority and Jove's
    favor. Thersites alone continues to denounce Agamemnon, accusing him of greed
    and urging flight. Ulysses rebukes and strikes Thersites with a sceptre; the army
    praises Ulysses for silencing sedition. Pallas, in herald form, calls the crowd
    to attention before Ulysses speaks again.
  language: English
  quote_policy: quoted
