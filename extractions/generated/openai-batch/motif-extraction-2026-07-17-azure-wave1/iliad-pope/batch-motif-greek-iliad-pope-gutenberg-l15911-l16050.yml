canonical_text:
  quote: ''
  summary: Jove assents to Sarpedon's fated death and heaven rains blood in grief.
    Patroclus and Sarpedon exchange attacks; Sarpedon kills Achilles' horse Pedasus,
    while Patroclus mortally wounds Sarpedon. The dying Sarpedon commands Glaucus
    to lead the Lycians and defend his body and arms. Glaucus prays to Apollo for
    healing, is restored, and rallies Trojan allies. Patroclus urges Ajax and the
    Greeks to hold the body, strip the armor, and kill the Lycians around it.
