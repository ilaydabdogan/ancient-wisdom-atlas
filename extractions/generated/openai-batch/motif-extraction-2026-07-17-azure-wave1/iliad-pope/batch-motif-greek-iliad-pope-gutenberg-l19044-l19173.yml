canonical_text:
  quote: ''
  summary: Anchises' son answers Achilles by asserting both heroes' divine descent,
    recounting the Dardanian genealogy from Jove through Dardanus to Anchises, and
    then attacks with a spear. Achilles and Anchises' son exchange spear blows; Achilles'
    divine shield resists, while Achilles' spear pierces the Dardan shield. As Achilles
    closes in and Anchises' son lifts a great stone, Neptune sees the danger and urges
    the gods to save him because fate and Jove require him to continue the Dardan
    line. A radiant-eyed imperial goddess answers that Neptune may decide his fate,
    while she and Pallas remain sworn to Troy's destruction.
  language: English
  quote_policy: summarized
