canonical_text:
  quote: ''
  summary: A king's prayer is answered by Jove with an eagle omen carrying a fawn,
    encouraging the Greeks. The Greeks counterattack; Teucer kills many Trojans while
    sheltered by Ajax's shield. Agamemnon praises Teucer and vows rich rewards if
    Troy falls. Teucer aims repeatedly at Hector, but divine intervention prevents
    Hector's death, and other Trojans are killed instead. Hector strikes Teucer with
    a stone, breaking his bow and wounding him; Ajax shields him while companions
    carry him away. Jove then favors Troy, Hector drives the Greeks back toward their
    ships, and Jove's wife observes their distress.
  language: English
  quote_policy: summarized
