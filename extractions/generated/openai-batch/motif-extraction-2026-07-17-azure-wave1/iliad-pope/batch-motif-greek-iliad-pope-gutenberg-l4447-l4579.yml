canonical_text:
  quote: ''
  summary: Priam surveys the Greek army and asks Helen to identify prominent warriors.
    Helen and Antenor describe Ulysses, Ajax, Idomeneus, and Helen's absent brothers
    Castor and Pollux, whose death Helen does not know. Heralds summon Priam to ratify
    a truce and a duel between Paris and Menelaus. Priam and Antenor go to the plain,
    where an oath rite with wine, victims, and invoked gods sets the terms of the
    duel and treaty.
  language: English
  quote_policy: summarized
