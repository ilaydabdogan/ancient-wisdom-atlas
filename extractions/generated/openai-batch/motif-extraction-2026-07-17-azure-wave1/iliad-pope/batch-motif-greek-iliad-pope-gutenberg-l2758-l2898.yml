canonical_text:
  quote: ''
  summary: After Chryses prays, Apollo hears. The Greeks perform a hecatomb with barley,
    slaughtered victims, burned thigh-offerings, wine libations, a shared feast, and
    hymns to Apollo. The Greeks sail back to camp with winds supplied by Phoebus.
    Achilles remains apart by his ships, angry and imagining revenge. After twelve
    days, the gods gather on Olympus. Thetis rises from the sea, supplicates Jove,
    and asks him to honor Achilles by humbling the Greeks and aiding the Trojans.
    Jove grants the request with an irrevocable nod that shakes Olympus. Juno, having
    seen Thetis, questions Jove about hidden divine counsels and fears that he has
    granted a favor that will bring Greek bloodshed.
  language: English
  quote_policy: summarized
