canonical_text:
  quote: ''
  summary: In the battle over Patroclus' body, Minerva descends to aid the Greeks,
    assumes Phoenix's form, and strengthens Menelaus. Menelaus kills Podes. Apollo,
    in the likeness of Phaenops, urges Hector, while Jove uses cloud, thunder, lightning,
    and the shaking of his shield to turn the battle toward Troy. Greek fighters are
    wounded or withdraw; Coeranus dies while saving Merion. Ajax recognizes Jove's
    will, prays for daylight, and Jove clears the cloud. Menelaus is directed to seek
    Antilochus to carry news of Patroclus' death to Achilles.
  language: English
  quote_policy: summarized
