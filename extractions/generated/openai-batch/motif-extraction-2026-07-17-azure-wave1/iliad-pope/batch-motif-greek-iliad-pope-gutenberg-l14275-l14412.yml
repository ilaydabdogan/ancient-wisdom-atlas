  summary: At the opening of Book XV, Jove awakens on Ida, sees the Greeks aided by
    Neptune and Hector near death, and angrily accuses Juno of deception. Juno swears
    by cosmic powers that Neptune acted on his own. Jove gives commands for Iris and
    Apollo, foretells Hector’s return, Patroclus’ intervention, Sarpedon’s death,
    Achilles’ return, Hector’s death, and Troy’s fall. Juno then flies to the Olympian
    assembly, where Themis offers her nectar and Juno warns of Jove’s severe decrees.
