canonical_text:
  quote: We acknowledge him the father of poetical diction; the first who taught that
    language of the gods to men.
  summary: The passage praises Homer’s expression, compound epithets, and versification,
    describing his diction as vivid and animated, his epithets as compressed images,
    and his verse as harmonically suited to its sense. It compares Homeric Greek versification
    with Virgilian Latin verse and invokes the Muses, trumpet sound, river, and tide
    as images for Homeric poetic force.
  language: English
  quote_policy: quoted
