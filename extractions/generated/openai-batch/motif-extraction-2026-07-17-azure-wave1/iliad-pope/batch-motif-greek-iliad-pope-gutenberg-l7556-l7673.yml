canonical_text:
  quote: ''
  summary: The Book VII argument previews the renewed battle, divine agreement to
    suspend the general fight, Hector's challenge to single combat, Ajax's selection
    by lot, later councils, a truce for the dead, funerals, Greek fortifications,
    and Jupiter's thunder. The narrative section begins with Hector and Paris returning
    through the Scan gate, several Greek warriors being slain, Minerva descending
    from Olympus, Apollo meeting her under a beech, both gods agreeing to have Hector
    challenge a Greek champion, Helenus conveying the divine counsel to Hector, the
    armies suspending combat, and Minerva and Apollo watching in vulture form as Hector
    addresses both armies.
  language: English
  quote_policy: summarized
