canonical_text:
  quote: ''
  summary: Troy receives Hector's body with public mourning. Priam directs the body
    to the palace, where Hector's wife, mother, and Helen lament him. Priam orders
    the funeral rites under a truce granted by Achilles. The Trojans gather wood,
    burn Hector on a pyre, quench the fire with wine, collect his bones in a golden
    vase, wrap them in rich cloth, bury them under a tomb, and share a final funeral
    feast.
  language: English
