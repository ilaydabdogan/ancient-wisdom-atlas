canonical_text:
  quote: Learn hence, betimes to curb pernicious ire
  summary: Phoenix recounts a tale of a warrior cursed by Althaea, besieged by supplications,
    and finally moved by his wife to save his city, then applies it as a warning to
    Achilles. Achilles refuses gifts and honors from Atrides, insists on his wrath
    and on loyalty from Phoenix, and says he will fight only when Hector’s fire reaches
    his own ships. Ajax rebukes him for rejecting compensation and guest-friendship.
    The envoys pour libations, return by night, and report to the Achaian command
    tent.
  language: English
  quote_policy: quoted
