comparison_claims:
- id: claim:1
  claim: 'Phoenix explicitly uses the earlier cursed warrior’s wrath as an admonitory
    pattern for Achilles’ wrath: refusal of gifts and supplication brings the crisis
    close to destruction before action is taken.'
  claim_level: same_function
  target: The cursed warrior exemplum compared with Achilles’ refusal of the embassy
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  counter_evidence_refs:
  - ev:3
  - ev:6
  confidence: high
  limitations: The comparison is rhetorical within the speech; the passage does not
    assert historical contact, common inheritance, or identity of the figures.
- id: claim:2
  claim: Ajax compares Achilles’ refusal with a broader atonement pattern in which
    blood-price and gifts can settle even severe kin-loss, emphasizing Achilles as
    an exception to that pacifying exchange.
  claim_level: same_function
  target: Blood-price or atonement exchange as a pacification pattern
  evidence_refs:
  - ev:5
  counter_evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  limitations: The claim is based on Ajax’s argumentative generalization; the passage
    gives no independent legal or ritual explanation beyond the speech.
