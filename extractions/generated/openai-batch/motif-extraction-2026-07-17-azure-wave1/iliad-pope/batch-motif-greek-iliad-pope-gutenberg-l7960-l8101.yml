canonical_text:
  quote: "“Not hate, but glory, made these chiefs contend; / And each brave foe was
    in his soul a friend.”"
  summary: Ajax and Hector suspend their duel at night and exchange gifts. Each returns
    to his camp. The Greeks sacrifice and feast, and Nestor advises funeral rites
    for the dead and construction of defensive works. In Troy, Antenor urges returning
    Helen and the treasures, Paris refuses to return Helen, and Priam sends Idus to
    request a truce for cremating the dead before war resumes under Jove’s decision.
  language: English
  quote_policy: quoted
