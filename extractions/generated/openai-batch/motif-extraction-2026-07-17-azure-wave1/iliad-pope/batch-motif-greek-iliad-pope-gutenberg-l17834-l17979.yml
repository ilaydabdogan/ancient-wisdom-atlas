canonical_text:
  quote: ''
  summary: Achilles mourns over Patroclus, laments his failed promise to return him
    home, anticipates his own death, and vows revenge before Patroclus' burial. Attendants
    wash, anoint, and veil Patroclus' body. In Olympus, Jove and Juno discuss Greek
    success and Juno's will. Thetis goes to Vulcan's divine forge, where Charis welcomes
    her. Vulcan recalls how Thetis and Eurynome sheltered him after his mother cast
    him from the sky, then he leaves his work and approaches Thetis supported by animated
    golden female forms.
  language: English
  quote_policy: summarized
