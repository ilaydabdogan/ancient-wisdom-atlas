canonical_text:
  quote: Without the gods, how short a period stands / The proudest monument of mortal
    hands!
  summary: The passage introduces the battle at the Grecian wall. The argument summarizes
    Hector's assault, Polydamas's tactical counsel, an eagle-serpent omen, Sarpedon's
    breach, and Hector's forced entry. The poem then states that the Greek wall and
    trench were built without proper divine honor or sacrifice, and that the gods
    later destroy them with rivers, rain, and sea. In the present battle, Hector presses
    the Greeks near their ships, while Polydamas advises leaving the chariots behind
    and attacking on foot because the trench and stakes block the horses.
  language: English
