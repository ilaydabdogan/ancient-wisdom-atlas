canonical_text:
  quote: ''
  summary: The passage describes fighting around the body of Patroclus. Hector's javelin
    kills Schedius after Ajax avoids it, and Ajax kills Phorcys. Phoebus, appearing
    like Periphas, exhorts Aeneas, who rallies Hector and the Trojans. Greeks and
    Trojans fight in close ranks around Patroclus' corpse under a localized darkness
    while other parts of the plain remain bright. Both sides struggle to pull the
    body toward their own lines. Achilles remains unaware of Patroclus' death, and
    the passage closes with Greeks and Trojans vowing or praying to continue the fight.
  language: English
  quote_policy: summarized
