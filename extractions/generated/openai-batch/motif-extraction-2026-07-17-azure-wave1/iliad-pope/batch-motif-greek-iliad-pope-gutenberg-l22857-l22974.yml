    mortal suffering, Zeus' two urns of good and evil, and the losses of Peleus and
    Priam. Priam asks for Hector's body and offers gifts. Achilles says he will return
    Hector because of divine command, warns Priam not to provoke him, then has the
    ransom received and Hector's body washed, anointed, wrapped, and placed on a car.
    Achilles addresses Patroclus' shade and asks forgiveness for restoring Hector
    in obedience to heaven.
