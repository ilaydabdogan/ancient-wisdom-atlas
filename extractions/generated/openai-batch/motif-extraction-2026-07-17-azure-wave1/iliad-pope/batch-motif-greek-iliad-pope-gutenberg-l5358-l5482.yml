canonical_text:
  quote: ''
  summary: 'The passage describes the opening clash of Greek and Trojan forces after
    the truce is broken. The Greek ranks advance silently while the Trojans shout;
    gods inspire the hosts and Discord is personified as enlarging the conflict. Several
    warriors are killed in sequence: Antilochus kills Echepolus; Agenor kills a leader
    trying to despoil the corpse; Ajax kills Simoisius, whose birth and naming by
    Simois are recalled; Antiphus misses Ajax but kills Leucus; Ulysses kills Democoon
    in retaliation. The Trojans give way until Phbus appears from Ilion''s height
    and urges them to fight, noting Achilles is absent.'
  language: English
  quote_policy: summarized
