canonical_text:
  quote: ''
  summary: 'A series of editorial notes explains mythological, ritual, and comparative
    details: the Myrmidons'' alleged ant-like origin and early dwellings; allegorical
    readings of Minerva''s apparition to Achilles; comparisons of poetic speech imagery;
    salt-water lustration; the protected status of heralds; traditions about Thetis,
    Peleus, Achilles, and Jove; ideas about fate; an Egyptian sacred ship interpretation
    of Jove''s Ethiopian absence; sacrificial procedure; the meaning of crowned cups;
    and Phidias'' use of Homeric Jupiter as a model for the Olympian statue.'
  language: English
  quote_policy: summarized
