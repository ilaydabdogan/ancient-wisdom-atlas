canonical_text:
  quote: ''
  summary: The passage opens with an illustration caption of Otus and Ephialtes holding
    Mars captive. In the narrative, Venus is treated after being wounded; Pallas jokes
    to Jove about how the wound occurred, and Jove tells Venus that deeds of arms
    belong to Mars and Pallas. On the battlefield, Tydides attacks Aeneas despite
    Apollo’s protection. Apollo warns him to recognize the distance between mortals
    and gods, then carries Aeneas to Troy’s sacred place for healing by Latona and
    Phoebe. Apollo raises a phantom likeness of Aeneas, around which Greeks and Trojans
    continue fighting. Apollo calls on Mars to punish the Greek who has attacked gods.
    Mars, in the form of Acamas, rallies the Trojans. Sarpedon rebukes Hector for
    standing idle while allies fight; Hector accepts the reproof, returns to the field,
    rallies the Trojans, and the Greeks prepare to meet them.
  language: English
  quote_policy: summarized
