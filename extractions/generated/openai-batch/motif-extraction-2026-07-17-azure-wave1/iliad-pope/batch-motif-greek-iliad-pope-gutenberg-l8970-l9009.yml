  quote: 'Full hecatombs lay burning on the shore:'
  summary: After a leader speaks, the host applauds, unyokes horses, and brings animals,
    wine, and bread. Hecatombs burn on the shore, but the immortal powers remain hostile
    to Troy, Priam, and his sons. At night the troops sit around many fires, which
    are compared to moonlight and starlight; watch-fires before Ilion illuminate Xanthus,
    the walls, and the field while guards, horses, and warriors wait for morning.
