canonical_text:
  quote: ''
  summary: Iris urges unarmed Achilles to appear at the trench and terrify Troy. Pallas/Minerva
    covers him with the aegis, golden cloud, flame-like glory, and an amplified shout.
    The Trojans panic, some die in the confusion, and the Greeks recover the slain
    body identified by the passage label as Patroclus. Achilles mourns over the body.
    Juno commands the sun to set, and the Trojans hold a fearful council. Polydamas
    advises retreating within Troy's walls before morning; Hector rejects this and
    urges renewed attack. The host applauds Hector after Pallas deprives them of sound
    judgment.
