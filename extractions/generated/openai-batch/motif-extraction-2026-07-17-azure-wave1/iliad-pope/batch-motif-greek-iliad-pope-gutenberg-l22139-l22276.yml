canonical_text:
  quote: ''
  summary: The passage introduces Book XXIV as the redemption of Hector's body. It
    summarizes divine instructions to Thetis, Iris, and Priam; Priam's ransom journey;
    Mercury's guidance; Priam's supplication to Achilles; Achilles' return of the
    body; and the Trojan funeral laments. The verse opening depicts Achilles sleeplessly
    mourning Patroclus, dragging Hector's body around Patroclus's monument, Apollo
    protecting the corpse, and a divine debate in which Apollo, Juno, and Jupiter
    discuss Hector's honors, Achilles' status, and the proposed ransom.
  language: English
