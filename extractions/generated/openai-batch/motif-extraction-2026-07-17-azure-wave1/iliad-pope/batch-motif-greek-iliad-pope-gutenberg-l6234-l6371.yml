candidate_motifs:
- id: motif:1
  label: Divine powers intensify human battle
  taxonomy_refs: []
  basis: Mars, Apollo, the blue-eyed maid's withdrawal, Discord, Fame, and Bellona
    are all connected with the escalation or direction of the fighting.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:13
  confidence: high
  cautions: The passage presents divine and personified forces in battle, but it does
    not state a broader mythic system beyond this scene.
- id: motif:2
  label: Wounded warrior restored and returned by a god
  taxonomy_refs:
  - return
  basis: Apollo produces neas from the sacred fane alive, unhurt, and vigorous from
    his wound, returning him to the shouting train.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not say that neas had died, so resurrection or death-rebirth
    taxonomy is not supported here.
- id: motif:3
  label: Heroic exhortation before combat
  taxonomy_refs: []
  basis: The Greek general urges the troops to valor, mutual reverence, glorious action,
    and avoidance of shame, then follows the speech with a lance strike.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: This is a battle-speech pattern rather than a specifically supernatural
    motif in the passage.
- id: motif:4
  label: Warrior genealogy before untimely death
  taxonomy_refs: []
  basis: Orsilochus and Crethon are given ancestry, homeland, and purpose for leaving
    home before their deaths are narrated.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage supplies only this example within the selected lines.
- id: motif:5
  label: Ally intervention prevents single combat
  taxonomy_refs: []
  basis: Antilochus enters to aid Menelaus, and neas withdraws when faced with the
    combined force.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage implies avoidance of unequal force, but does not elaborate
    a formal duel structure.
- id: motif:6
  label: Battlefield victory through captured chariot prize
  taxonomy_refs: []
  basis: After killing Mydon, Nestor's son mounts the empty chariot seat and carries
    the prize to the fleet.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage describes the seizure as a battle prize without wider ritual
    explanation.
- id: motif:7
  label: Hero halted by fear before divinely backed assault
  taxonomy_refs: []
  basis: Tydides pauses and first knows fear as Hector advances with Mars and Bellona;
    the hesitation is compared to a traveler stopped by a foaming brook.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: medium
  cautions: The passage links the pause sequentially with Hector's divine-backed advance,
