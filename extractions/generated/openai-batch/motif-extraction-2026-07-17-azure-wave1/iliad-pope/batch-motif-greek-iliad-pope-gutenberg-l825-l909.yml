  summary: The passage discusses theories about the date, preservation, editing, oral
    transmission, and authorship of the Iliad and Odyssey, arguing that the poems
    preserve older linguistic and cultural features, that Peisistratus likely acted
    editorially rather than compositionally, and that oral ballads from a war context
    may have been collected and recast into a unified poem.
