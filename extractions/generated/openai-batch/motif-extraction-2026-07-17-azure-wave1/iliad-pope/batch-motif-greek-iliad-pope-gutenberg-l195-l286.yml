    such as Homer, Socrates, and Shakespere are surrounded by uncertainty and debate.
    It then describes modern scepticism about Homeric tradition and notes that biographies
    of Homer are partly forgeries or imaginative works, before mentioning a Life of
    Homer attributed to Herodotus.
