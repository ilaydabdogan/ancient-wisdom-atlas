canonical_text:
  quote: ''
  summary: A Trojan speaker instructs Hector to return to the city and direct a ritual
    appeal to Minerva. Hector rallies the Trojans before leaving. Diomedes and Glaucus
    meet between the armies; Diomedes asks whether Glaucus is mortal or divine and
    cites Lycurgus as an example of punishment for fighting gods. Glaucus answers
    with a reflection on generations like leaves and recounts his ancestry through
    Sisyphus, Glaucus, and Bellerophon. He tells how Bellerophon resisted Antaea,
    was falsely accused, carried sealed death tablets to Lycia, received hospitality,
    and was assigned dangerous labors including the Chimaera, the Solymi, and the
    Amazons, all of which he overcame with heavenly favor.
  language: English
  quote_policy: summarized
