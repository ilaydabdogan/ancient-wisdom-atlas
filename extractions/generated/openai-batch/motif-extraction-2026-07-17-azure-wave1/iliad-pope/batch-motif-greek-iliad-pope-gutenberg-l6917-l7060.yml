candidate_motifs:
- id: motif:1
  label: Ritual offering to secure divine protection
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The Trojan women are instructed to offer a precious mantle, vows, and twelve
    heifers to Minerva so she may spare the city, wives, and infants.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage presents a petitionary rite during war; the requested divine
    response is hoped for, not yet shown.
- id: motif:2
  label: Human refusal to contend with gods
  taxonomy_refs:
  - divine_judgment
  basis: Diomedes says he will not fight immortals and cites Lycurgus, whose attack
    on Bacchus led to punishment by the gods.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The divine judgment example is embedded in Diomedes' speech as a warning,
    not narrated as a present action.
- id: motif:3
  label: Generations compared to seasonal leaves
  taxonomy_refs:
  - seasonal_cycle
  basis: Glaucus describes humans as like leaves that grow green, wither, fall, and
    are renewed by spring.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is an explicit simile about mortality and succession, not a full
    seasonal myth narrative.
- id: motif:4
  label: Virtuous hero sent with concealed death message
