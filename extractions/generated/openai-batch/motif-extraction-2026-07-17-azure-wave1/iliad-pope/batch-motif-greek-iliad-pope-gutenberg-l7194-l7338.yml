canonical_text:
  quote: ''
  summary: A Phrygian queen selects a shining veil and leads Trojan women to the temple
    of Pallas/Minerva, where Theano places the veil on the goddess's knees and prays
    for protection against Tydides, vowing twelve heifers; the prayer is said to be
    in vain. Hector goes to Paris's palace, finds Paris among his arms with Helen
    and her women, rebukes him for inaction, and receives Paris's promise to arm.
    Helen laments her role in the war and the future shame attached to herself and
    Paris. Hector refuses rest, says battle calls him, and seeks his wife and infant,
    learning that she has gone with the child and nurse to Ilion's tower to watch
    the fighting in fear for him.
  language: English
  quote_policy: summarized
