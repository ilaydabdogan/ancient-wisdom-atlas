canonical_text:
  quote: ''
  summary: In a battle sequence, Diomed and Ulysses kill multiple Trojans. The sons
    of Merops enter battle despite their father's prophetic warning and are slain.
    Diomed wounds or stuns Hector, but Hector survives through Apollo's protection
    and escapes. Paris ambushes Diomed from behind Ilus' ruined monument and wounds
    his foot with an arrow. Ulysses removes the arrow, Diomed withdraws, and Ulysses
    remains alone, resolves not to flee, and fights while surrounded by Trojan forces.
