    no taxonomy reference is assigned.
- id: motif:3
  label: blind wanderer sheltered by a compassionate host
  taxonomy_refs:
  - wisdom
  basis: Glaucus finds Homer, a blind man alone in desolate places, hears his misfortunes,
    gives him shelter, lights a fire, and feeds him; Homer later proves clever and
    knowledgeable.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: medium
  cautions: The wisdom taxonomy is broad; the passage emphasizes human cleverness
    and learning, not explicit supernatural wisdom.
- id: motif:4
