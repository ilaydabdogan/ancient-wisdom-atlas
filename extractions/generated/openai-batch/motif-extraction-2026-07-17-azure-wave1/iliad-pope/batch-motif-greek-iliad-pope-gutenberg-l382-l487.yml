canonical_text:
  quote: ''
  summary: A biographical account says Homer learns that Thestorides is profiting
    from reciting the same poems, travels toward Chios, receives help from Glaucus
    the goat-herd and later a Chian patron, establishes a school, gains fame, is linked
    with figures in the Odyssey through gratitude, travels to Samos and Ios, and dies
    after failing to solve an enigma. The compiler then cautions that this early life
    of Homer has broad evidence of historical worthlessness.
  language: English
  quote_policy: summarized
