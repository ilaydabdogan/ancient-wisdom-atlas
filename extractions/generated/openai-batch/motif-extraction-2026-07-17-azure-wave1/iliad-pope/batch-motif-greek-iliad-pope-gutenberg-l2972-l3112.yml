canonical_text:
  quote: Jupiter... sends a deceitful vision to Agamemnon
  summary: Book II opens with Jupiter deciding to honor Achilles by sending a deceptive
    night dream to Agamemnon. The dream, appearing in the form of Nestor, tells Agamemnon
    that Troy can now be taken and urges him to arm the Greeks. Agamemnon believes
    the vision, dresses with royal and martial insignia, summons the leaders, reports
    the dream, and proposes first to test the army by suggesting a return across the
    sea while the chiefs restrain them.
  language: English
