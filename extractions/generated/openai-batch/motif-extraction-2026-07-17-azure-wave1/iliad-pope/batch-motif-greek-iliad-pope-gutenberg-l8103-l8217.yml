canonical_text:
  quote: ''
  summary: The Greeks reject Trojan peace terms but grant a truce for burial. Both
    sides gather, mourn, and burn their dead. The Greeks raise a common tomb and build
    walls, towers, gates, a trench, and defensive piles. In heaven the sea-god objects
    that the Greeks built without consulting gods or offering sacrifice; Jove replies
    that the wall will later be destroyed by sea and sand. The Greeks sacrifice bulls,
    receive wine from Lemnos, feast, witness Jove’s thunder and lightning, pour libations,
    and sleep.
  language: English
  quote_policy: summarized
