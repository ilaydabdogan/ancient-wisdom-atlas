canonical_text:
  quote: ''
  summary: At the ships, Greek leaders arrange defense while Trojans advance under
    Hector. Phoebus/Apollo leads the battle with Jove's shield, terrifies the Greeks,
    and destroys the trench and wall. Hector drives the Trojans onward and forbids
    plunder. The Greeks pray; Nestor asks Jove to remember past offerings and save
    the ships. Jove answers with thunder, which Troy misreads as encouragement. Meanwhile
    Patroclus tends wounded Eurypylus, sees the danger at the fleet, and decides to
    urge Achilles to return to battle.
  language: English
  quote_policy: summarized
