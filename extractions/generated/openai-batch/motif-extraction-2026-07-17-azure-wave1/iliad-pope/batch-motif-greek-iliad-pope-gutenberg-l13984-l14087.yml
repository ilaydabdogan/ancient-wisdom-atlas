  summary: Jove declares urgent desire for Juno and compares it with earlier loves.
    Juno objects that Ida is exposed to gods and mortals and suggests a secret bower,
    but Jove promises cloud concealment. The pair are hidden in golden clouds as Earth
    produces flowers and dews, and Jove falls asleep. Sleep informs Neptune that Jove
    is disabled, allowing Neptune to rally and lead the Greeks against Troy.
  language: English
