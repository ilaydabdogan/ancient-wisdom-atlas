literal_observations:
- id: obs:1
  text: The passage presents a sequence in which people first do not know their rulers,
    then love and praise them, then fear them, and then despise them; deficient faith
    in rulers leads to want of faith among the people.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The earliest rulers are described as reticent, successful in their undertakings,
    and associated with people saying that they are as they are of themselves.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When the Great Tao ceased to be observed, benevolence, righteousness, wisdom,
    shrewdness, and hypocrisy appeared; disharmony and disorder are linked with filial
    sons and loyal ministers becoming manifest.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says that renouncing sageness, wisdom, benevolence, righteousness,
    artful contrivances, and scheming for gain would benefit the people and remove
    thieves and robbers.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A verse contrasts old named methods of government with simple views and plain
    true courses that avoid selfish ends and many lusts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage states that renouncing learning brings no troubles and contrasts
    small verbal differences with large consequences such as good and ill.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The multitude is described as satisfied and pleased, while the speaker alone
    is listless, still, like an unsmiling infant, homeless, lacking, and in a state
    of chaos.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ordinary men are described as bright, intelligent, and discriminating, while
    the speaker is benighted, dull, confused, drifting like one on the sea, like a
    rude borderer, and valuing the nursing-mother, identified as the Tao.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Tao is described as the only source of the grandest forms of active force,
    eluding sight and touch, containing forms, semblances, and essences, being profound,
