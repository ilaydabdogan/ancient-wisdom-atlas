  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: 'The passage lists reversals: the partial becomes complete, the crooked straight,
    the empty full, and the worn out new; few desires are linked with obtaining, many
    desires with going astray.'
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The sage embraces one thing, identified parenthetically as humility, and avoids
