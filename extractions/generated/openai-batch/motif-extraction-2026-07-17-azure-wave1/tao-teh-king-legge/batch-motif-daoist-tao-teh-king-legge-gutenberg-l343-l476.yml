  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: An ancient saying that the partial becomes complete is cited as not vainly
    spoken, and real completion is said to be comprehended under it.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Abstaining from speech is linked with obeying natural spontaneity; violent
    wind and sudden rain are described as not lasting, though owing to Heaven and
