canonical_text:
  quote: ''
  summary: The passage describes the effects of Tao cultivated from the individual
    to the kingdom, infant-like vitality and harmony, the silence of the one who knows
    Tao, sage rule by non-action, the reversibility of happiness and misery, moderation
    and return, Tao-aligned governance that prevents harm from departed spirits, and
    the low, still, waterlike/feminine posture by which great and small states gain
    one another.
  language: English
  quote_policy: summarized
