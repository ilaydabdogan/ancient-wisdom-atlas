- id: obs:1
  text: Tao nursed within oneself and ruling social units is said to show effects
    in the person, family, neighbourhood, state, and kingdom.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: One who abundantly has the attributes of Tao is compared to an infant.
  category: attribute
  evidence_refs:
