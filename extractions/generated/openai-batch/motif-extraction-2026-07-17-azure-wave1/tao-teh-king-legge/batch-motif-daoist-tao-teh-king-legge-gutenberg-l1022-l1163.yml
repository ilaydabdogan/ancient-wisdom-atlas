    seize, or strike the Tao-attribute bearer.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The infant is described as having weak bones and soft sinews, yet a firm grasp.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The infant does not know the union of male and female, yet its virile member
    may be excited; the passage treats this as showing perfection of physical essence.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
