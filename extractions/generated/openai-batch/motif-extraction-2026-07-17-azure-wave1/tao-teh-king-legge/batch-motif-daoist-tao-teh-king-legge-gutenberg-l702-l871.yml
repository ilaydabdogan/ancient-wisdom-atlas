canonical_text:
  quote: ''
  summary: The passage contrasts higher and lower possession of Tao-like attributes,
    describes a sequence of loss from Tao to propriety, presents cosmic and royal
    dependence on the One, states that Tao moves by contraries, gives a numerical
    account of production from Tao to all things, and praises non-action, wordless
    teaching, humility, stopping, and contentment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those with the highest degree of Tao-like attributes do not seek to display
    them, while those with a lower degree seek not to lose them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those with the highest degree of attributes are described as doing nothing
    with a purpose and having no need to act; lower degrees are associated with continual
    doing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The highest propriety is described as seeking to show itself, and when people
    do not respond it bares the arm and marches up to them.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage gives a sequence in which loss of Tao is followed by attributes,
    then benevolence, righteousness, and proprieties.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:5
  text: The Great man is said to abide by what is solid, avoid what is flimsy, dwell
    with the fruit rather than the flower, and choose one over the other.
  category: action
  evidence_refs:
  - ev:10
- id: obs:6
  text: Heaven, earth, spirits, valleys, all creatures, princes, and kings are listed
    as having obtained the One, with corresponding conditions such as brightness,
    firmness, powers, fullness, life, and a model for others.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: The passage says that if these beings or domains lacked the One, heaven would
    rend, earth would break and bend, spirits would fail, valleys would parch, creatures
    would pass away, and princes and kings would decay.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:8
  text: Dignity is said to have its root in prior meanness, and what is lofty has
    stability in lowness; rulers use humble self-designations.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The movement of Tao is said to proceed by contraries, and all things under
    heaven are said to arise from existence, which arises from non-existence.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: 'Three classes of scholars respond differently on hearing of Tao: the highest
    practice it, the middle seem to keep and lose it, and the lowest laugh at it.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: The Tao is described as hidden and nameless, yet able to impart what things
    need and make them complete.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Tao is said to produce One, One to produce Two, Two to produce Three,
    and Three to produce all things; all things leave Obscurity, embrace Brightness,
    and are harmonised by the Breath of Vacancy.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The softest thing in the world is said to dash against and overcome the hardest,
    and what has no substantial existence enters where there is no crevice.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Few in the world are said to attain teaching without words and the advantage
    arising from non-action.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage contrasts fame, life, and wealth, and says that contentment and
    knowing when to stop avoid shame, blame, and danger.
  category: sequence
  evidence_refs:
  - ev:9
