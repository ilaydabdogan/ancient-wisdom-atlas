  category: action
  evidence_refs:
  - ev:12
- id: obs:17
  text: One assisting a lord of men in harmony with the Tao is not to assert mastery
    in the kingdom by force of arms.
  category: action
  evidence_refs:
  - ev:13
- id: obs:18
  text: Where a host is stationed, briars and thorns spring up; after great armies
