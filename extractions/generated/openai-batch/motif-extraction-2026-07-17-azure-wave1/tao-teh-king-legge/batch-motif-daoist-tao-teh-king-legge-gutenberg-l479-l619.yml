  label: Holding paired opposites and returning to simplicity
  summary: The passage praises knowing strength, whiteness, and glory while maintaining
    femaleness, black shade, and disgrace; this produces receptivity like a channel
    or valley and return to childlike simplicity. It adds that unwrought material
