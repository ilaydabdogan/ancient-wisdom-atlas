candidate_motifs:
- id: motif:1
  label: Primordial unnamed source before Heaven and Earth
  taxonomy_refs:
  - chaos
  basis: The Tao is described as undefined, formless, complete, prior to Heaven and
    Earth, and unnamed.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:19
  confidence: medium
  cautions: The passage does not depict chaotic conflict or disorder; the taxonomy
    link rests only on primordial undefined formlessness.
- id: motif:2
  label: Cosmic mother-source of all things
  taxonomy_refs:
  - mother_goddess
  basis: The Tao is explicitly regarded as the Mother of all things.
  evidence_refs:
  - ev:1
  confidence: low
  cautions: The Tao is not personified as a goddess in this passage; 'Mother' functions
    as a source image.
- id: motif:3
  label: Return of the great source
  taxonomy_refs:
  - return
  basis: The Great passes on, becomes remote, and returns; the passage also describes
    return to first state and childlike simplicity.
  evidence_refs:
  - ev:3
  - ev:9
  confidence: high
  cautions: This is a cosmological and ethical return pattern rather than a narrative
    hero return.
- id: motif:4
  label: Paired opposites held together
  taxonomy_refs:
  - duality
  basis: The passage repeatedly pairs gravity/lightness, stillness/movement, manhood/femaleness,
    white/black, glory/disgrace, front/behind, warmth/freezing, and strength/weakness.
  evidence_refs:
  - ev:5
  - ev:9
  - ev:12
  confidence: high
  cautions: The passage treats opposites as ethical and cosmological correlations,
    not as personified twin beings.
- id: motif:5
  label: Wisdom of non-action, restraint, and hidden skill
  taxonomy_refs:
  - wisdom
  basis: The sage and skilful figures act without traces, save without discarding,
    avoid grasping, reject excess, and govern or fight only without violent assertion.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  - ev:15
  confidence: high
  cautions: This is aphoristic wisdom instruction rather than a mythic narrative episode.
- id: motif:6
  label: Rulership aligned with cosmic order
  taxonomy_refs:
  - royal_legitimacy
  basis: The sage king is counted among the four greats, the wise prince preserves
    root and throne through gravity, and the ruler is advised to act in harmony with
    the Tao rather than by force.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:13
  confidence: medium
  cautions: The passage gives principles for rulership but does not narrate a royal
    consecration or dynastic claim.
- id: motif:7
  label: Weapons as ominous and victory as mourning
  taxonomy_refs:
  - sacrifice
  basis: Weapons are called instruments of evil omen; slaughter requires grief, and
    the victor's place is assigned according to rites of mourning.
  evidence_refs:
  - ev:16
  - ev:17
  - ev:18
  confidence: low
  cautions: No offering or sacrificial ritual is described; the taxonomy link is weak
    and limited to death, ritual placement, and mourning.
