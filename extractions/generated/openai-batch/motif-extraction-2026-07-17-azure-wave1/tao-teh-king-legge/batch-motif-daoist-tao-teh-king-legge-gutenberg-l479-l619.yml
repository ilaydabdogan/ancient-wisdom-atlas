canonical_text:
  quote: ''
  summary: Chapters 25-32 describe the Tao as an unnamed, formless, complete reality
    prior to Heaven and Earth and as the source or model for cosmic order. The passage
    presents the sage, wise prince, and superior man as restrained, still, non-grasping,
    receptive, and opposed to violent mastery. It uses images of mother, root, child,
    valley, unwrought material, vessels, spirit-like kingdom, weapons of ill omen,
    and mourning rites.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An undefined and complete something is said to exist before Heaven and Earth,
    still, formless, alone, unchanged, reaching everywhere, and not exhausted.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: This prior reality is regarded as the Mother of all things and is designated
    the Tao, also called The Great.
  category: attribute
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The Great passes on, becomes remote, and returns.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The Tao, Heaven, Earth, and the sage king are each called great.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Man takes law from Earth; Earth from Heaven; Heaven from the Tao; the Tao's
    law is being what it is.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Gravity is called the root of lightness, and stillness the ruler of movement.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: A wise prince remains near his baggage waggons and does not carry himself
    lightly before the kingdom.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Skilful figures are described as travelling without traces, speaking without
    blame, reckoning without tallies, closing without bolts or bars, and binding without
    strings or knots.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The sage is said to be skilful at saving men and things and does not cast
    away any man or anything.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The man of skill is described as a master to the unskilled, and the unskilled
    as a helper to the skilled.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: One who knows manhood's strength while maintaining female feebleness becomes
    like a channel to which many drains flow and retains constant excellence as a
    simple child.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: One who knows white attraction while remaining in black's shade displays humility
    and returns to man's first state.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:13
  text: One who knows glory but loves disgrace is compared to a spacious valley and
    is hailed as a simple infant man.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Unwrought material, when divided and distributed, forms vessels; the sage,
    when employed, becomes head of all officers and uses no violent measures.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:15
  text: The kingdom is called a spirit-like thing that cannot be obtained by active
    doing or held by grasping.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:16
  text: After describing reversals in the course of things, the passage says the sage
