canonical_text:
  quote: ''
  summary: A sequence of Tao Teh King chapters presents paradoxical valuations, stillness,
    contentment, inward knowledge, non-action, the sage's relation to the people,
    life and death, the Tao as producer and mother of all things, restraint of the
    senses and breath, criticism of elite excess, and an image of enduring planting
    and ancestral sacrifice.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Great achievement, fullness, straightness, skill, and eloquence are described
    through paradoxical opposites such as poverty, voidness, crookedness, stupidity,
    and stammering.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Constant action is said to overcome cold, stillness to overcome heat, and
    purity with stillness to give correct law to all under heaven.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: When the Tao prevails, swift horses are returned to draw dung-carts; when
    the Tao is disregarded, war-horses breed in border lands.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ambition, discontent, and the wish to get are named as severe moral faults,
    while contentment is called enduring sufficiency.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: A person is said to understand what occurs under the sky without leaving the
    door and to see the Tao of Heaven without looking from the window.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The sages are said to know without travelling, name things without seeing
    them, and accomplish ends without intending to do so.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Learning is described as daily increase, while devotion to the Tao is described
    as daily decrease until non-action is reached.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: After arriving at non-action, the person is said to have nothing that he does
    not do.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The sage is said to have no fixed mind of his own and to make the mind of
    the people his mind.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:10
  text: The sage is good and sincere both to those who are good or sincere and to
    those who are not.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: The people direct their eyes and ears toward the sage, and he deals with them
    all as his children.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:12
  text: Men are described as coming forth to live and entering again to die; groups
    of ten are divided into ministers of life, ministers of death, and those whose
    life-seeking movements tend toward death.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:13
  text: The skilled manager of life travels without shunning rhinoceros or tiger and
    enters an armed host without avoiding armor or weapons.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: The rhinoceros, tiger, and weapon find no place in the skilled life-manager
