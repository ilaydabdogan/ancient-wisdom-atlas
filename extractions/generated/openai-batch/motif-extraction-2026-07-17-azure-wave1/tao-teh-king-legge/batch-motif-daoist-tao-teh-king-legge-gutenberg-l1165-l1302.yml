canonical_text:
  quote: ''
  summary: The passage teaches that the great should abase themselves, that Tao is
    the most valuable refuge and gift, and that the sage acts without ulterior striving.
    It develops patterns of small beginnings becoming great outcomes, early ordering
    before disorder, humility as rulership, simplicity in governance, gentleness as
    victory, and non-martial mastery in conflict.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A great state is described as wishing to unite and nourish people, while a
    small state wishes to be received by and to serve the other; the great state must
    learn to abase itself.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tao is said to hold the most honoured place among all things, giving grace
    to good men and guarding or effacing the ill of bad men.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A formal court offering of a large round rank-symbol and horses is declared
    inferior to a lesson of Tao presented on the knees.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Tao can be obtained by seeking it and that the guilty can
    escape the stain of guilt by it.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The way of Tao is described as acting without thinking of acting, conducting
    affairs without felt trouble, treating small as great and few as many, and recompensing
    injury with kindness.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The sage anticipates difficult things while they are easy, handles things
