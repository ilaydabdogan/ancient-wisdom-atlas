canonical_text:
  quote: ''
  summary: A sequence of aphoristic chapters presents non-contention, defensive action
    in war, reluctance to engage in killing, hidden wisdom, knowing one’s ignorance,
    restraint in self-display, Heaven’s quiet but inescapable efficacy, the danger
    of usurping death’s authority, the social effects of burdensome rulers, the contrast
    between supple life and rigid death, Heaven’s balancing of excess and deficiency
    by the image of a bow, and water’s soft power over hard and strong things.
  language: English
  quote_policy: summarized
