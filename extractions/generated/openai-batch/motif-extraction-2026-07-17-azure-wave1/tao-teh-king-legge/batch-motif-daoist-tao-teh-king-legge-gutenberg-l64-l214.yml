canonical_text:
  quote: ''
  summary: The opening chapters describe the Tao as unnameable, originator, mother,
    mystery, empty vessel, and ancestral source; present paired opposites as mutually
    arising; commend the sage's non-action, desirelessness, self-effacement, and quiet
    government; compare heaven and earth to impersonal processes, a bellows, and enduring
    selflessness; name the valley spirit as the female mystery and root of heaven
    and earth; praise water as a model of lowly benefit; and warn against fullness,
    pride, and hoarded wealth.
  language: English
  quote_policy: summarized
