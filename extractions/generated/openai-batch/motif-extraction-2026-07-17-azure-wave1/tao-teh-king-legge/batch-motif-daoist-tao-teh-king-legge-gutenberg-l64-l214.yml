  text: The Tao is described, under different aspects, as the nameless originator
    of heaven and earth and as the named mother of all things.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Desirelessness is associated with sounding the deep mystery, while desire
    is associated with seeing only its outer fringe.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Pairs such as beauty and ugliness, existence and non-existence, difficulty
    and ease, length and shortness, height and lowness, musical notes and tones, and
    before and behind are said to arise through mutual relation or contrast.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The sage manages affairs without doing anything and conveys instructions without
    speech.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: All things spring up and grow without ownership being claimed, reward expected,
    or achievement rested in.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: In government, the sage is said to empty minds, fill bellies, weaken wills,
    strengthen bones, and keep people without knowledge and desire.
  category: action
  evidence_refs:
  - ev:4
