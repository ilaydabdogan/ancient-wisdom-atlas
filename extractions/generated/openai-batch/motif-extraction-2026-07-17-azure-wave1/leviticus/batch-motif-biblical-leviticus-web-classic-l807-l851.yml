canonical_text:
  quote: ''
  summary: The passage gives regulations for priestly examination of skin conditions,
    baldness, and mildew in garments or leather. It distinguishes clean from unclean
    cases, prescribes visible marks and isolation for a leprous person, and sets procedures
    for isolating, washing, tearing, or burning contaminated materials.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If an itch is arrested and black hair has grown in it, the itch is healed
    and the priest pronounces the person clean.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man or woman with dull white bright spots in the skin is described as having
    a harmless rash and is clean.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hair loss from the head or forehead alone is clean, but a reddish-white plague
    on the bald head or forehead is leprosy and makes the man unclean.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The leper with the plague must wear torn clothes, let the hair of his head
    hang loose, cover his upper lip, and cry out that he is unclean.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: For all the days the plague is in him, the leper is unclean, dwells alone,
    and has his dwelling outside the camp.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:6
  text: A plague may appear in wool, linen, warp, woof, leather, or leather-made items,
    with greenish or reddish coloring, and it must be shown to the priest.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The priest examines the plague in the material and isolates it for seven days.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If the plague spreads in the garment, woven material, or skin item, it is
    a destructive mildew, is unclean, and the affected item is burned in fire.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: If the plague has not spread, the affected thing is washed and isolated seven
    more days; if unchanged afterward, it is unclean and burned.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: If the plague fades after washing, the affected part is torn out; if it reappears,
    the item is burned, but if it departs after washing, the item is washed a second
    time and becomes clean.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: The stated law concerns mildew in wool, linen, warp, woof, or skin items,
    for pronouncing them clean or unclean.
  category: relationship
  evidence_refs:
  - ev:11
