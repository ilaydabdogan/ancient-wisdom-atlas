canonical_text:
  quote: Sanctify yourselves therefore, and be holy; for I am holy.
  summary: An opening footnote explains the Hebrew term translated “Behold.” Chapter
    11 presents Yahweh speaking through Moses and Aaron to Israel, defining which
    land animals, water creatures, birds, winged insects, and creeping things may
    or may not be eaten. The passage also gives rules for uncleanness from touching,
    carrying, or being affected by carcasses, including treatment of vessels, food,
    drink, seed, springs, and cisterns. It grounds the commands in Yahweh’s holiness
    and in his bringing Israel up from Egypt.
  language: English
  quote_policy: quoted
