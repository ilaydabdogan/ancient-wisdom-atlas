canonical_text:
  quote: ''
  summary: Leviticus 25:1-41 presents Yahweh's instructions to Moses on Mount Sinai
    concerning the sabbatical year for the land, the Jubilee after seven cycles of
    seven years, return of property and family, redemption rules, limits on sale of
    land and houses, provision for the poor, prohibition of exploitative interest,
    and release of an impoverished Israelite servant at Jubilee.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yahweh speaks to Moses on Mount Sinai and commands him to address the children
    of Israel about the land Yahweh gives them and its Sabbath.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fields and vineyards are to be worked for six years, but the seventh year
    is a solemn rest for the land with no sowing, pruning, reaping of self-grown harvest,
    or gathering from undressed vines.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The produce associated with the land's Sabbath is designated as food for the
    people, servants, hired workers, foreign residents, livestock, and wild animals
    in the land.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Seven sabbaths of years are counted as forty-nine years, and a loud trumpet
    is sounded on the tenth day of the seventh month, the Day of Atonement, throughout
    the land.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The fiftieth year is made holy and called Jubilee; liberty is proclaimed,
    people return to their property and family, and ordinary sowing and harvesting
    are prohibited.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Sales between neighbors are to be priced according to the number of crop years
    remaining after the Jubilee, and the parties are commanded not to wrong one another.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Keeping the statutes and ordinances is linked with dwelling safely in the
    land, eating its fruit, and receiving a sixth-year blessing sufficient for three
    years.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The land is not to be sold in perpetuity because Yahweh says the land is his
    and the people are strangers and foreigners with him; redemption is to be granted
    for the land.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: If a poor brother sells possessions, the nearest kinsman may redeem them;
    if the seller later prospers he may redeem them himself, and if not they are released
    in the Jubilee.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Dwelling houses in walled cities, village houses, Levite city houses, and
    Levite pasture fields are assigned distinct rules for redemption, Jubilee release,
    and sale.
  category: other
  evidence_refs:
  - ev:8
- id: obs:11
  text: A poor brother is to be upheld and not charged interest or profit, with the
    command grounded in fear of God and Yahweh's act of bringing Israel out of Egypt
    to give Canaan.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: If a poor brother sells himself, he is not to be treated as a slave but as
    a hired servant or temporary resident until Jubilee, when he and his children
    go out and return to family possession.
  category: action
  evidence_refs:
  - ev:10
