canonical_text:
  quote: ''
  summary: Nadab and Abihu offer uncommanded fire before Yahweh and are consumed by
    fire from before Yahweh. Moses interprets the event in terms of Yahweh's holiness,
    orders the bodies removed, and restricts mourning and movement for Aaron and his
    remaining sons because of the anointing oil. Yahweh commands priestly abstinence
    from wine or strong drink when entering the Tent of Meeting, and commands priests
    to distinguish holy from common and clean from unclean and to teach Israel. Moses
    gives instructions about eating priestly portions of offerings, rebukes Eleazar
    and Ithamar when the sin offering goat has been burned rather than eaten, and
    accepts Aaron's explanation.
  language: English
  quote_policy: summarized
