    Abraham, and the land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressees are commanded not to make idols, carved images, pillars, or
    figured stones, and to keep Yahweh's Sabbaths and reverence his sanctuary.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: If the addressees walk in Yahweh's statutes and keep his commandments, Yahweh
    says he will give rains in season, make the land yield increase, and make the
    trees yield fruit.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The promised obedience-blessing includes full bread, safe dwelling, peace
    in the land, lying down without fear, removal of evil animals, and absence of
    the sword in the land.
  category: sequence
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: The addressees are told that they will chase enemies and that small numbers
    of them will chase much larger numbers of enemies.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Yahweh says he will make the addressees fruitful, multiply them, establish
    his covenant with them, set his tent among them, walk among them, and be their
    God while they are his people.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: Yahweh identifies himself as the one who brought the addressees out of Egypt,
    broke the bars of their yoke, and made them walk upright.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: If the addressees do not listen, reject Yahweh's statutes, abhor his ordinances,
    fail to do his commandments, and break his covenant, Yahweh says he will appoint
    terror, disease, failed sowing, enemy consumption of seed, defeat, hostile rule,
    and flight when no one pursues.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Further refusal to listen brings sevenfold chastisement, broken pride of power,
    sky like iron, soil like bronze, spent strength, and failure of land and trees
    to yield.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: If the addressees continue to walk contrary to Yahweh, he says he will bring
    seven times more plagues and send wild animals that rob children, destroy livestock,
    reduce the people's number, and make roads desolate.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Further contrary walking brings Yahweh's contrary action, sevenfold striking,
    a sword executing covenant vengeance, gathering into cities, pestilence, delivery
    to the enemy, broken staff of bread, bread baked by ten women in one oven, bread
    delivered by weight, and unsatisfied eating.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Continued refusal brings wrathful sevenfold chastisement, eating the flesh
    of sons and daughters, destruction of high places and incense altars, dead bodies
    cast on idols, wasted cities, desolate sanctuaries, rejected offering fragrance,
    land desolation, scattering among nations, and sword drawn after the people.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: When the land lies desolate and the people are in their enemies' land, the
    land is said to enjoy its Sabbaths and rest.
  category: setting
  evidence_refs:
  - ev:10
- id: obs:13
  text: Those left in enemies' lands receive faintness of heart, flee at the sound
    of a driven leaf, stumble over one another, lack power before enemies, perish
    among nations, and pine away in iniquity.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: If those left confess their own iniquity and their fathers' iniquity, acknowledge
