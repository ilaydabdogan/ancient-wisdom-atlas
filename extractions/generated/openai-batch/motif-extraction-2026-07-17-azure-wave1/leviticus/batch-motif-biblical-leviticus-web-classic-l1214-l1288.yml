canonical_text:
  quote: You shall be holy; for I, Yahweh your God, am holy.
  summary: Yahweh speaks to Moses and gives the congregation of Israel laws about
    holiness, sacrifices, harvest gleanings, neighbor justice, ritual boundaries,
    sexual trespass atonement, fruit trees, blood and occult prohibitions, bodily
    markings, Sabbath and sanctuary reverence, care for foreigners and elders, just
    measures, and observance of statutes.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Yahweh speaks to Moses and directs him to tell all the congregation of Israel
    that they shall be holy because Yahweh their God is holy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressees are commanded to respect mother and father, keep Sabbaths,
    and not turn to idols or make molten gods.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A peace offering to Yahweh is to be eaten on the day offered and the next
    day; anything remaining until the third day is to be burned with fire, and third-day
    eating is called an abomination that causes the eater to bear iniquity and be
    cut off from the people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Harvesters are not to reap the corners of the field or gather gleanings and
    fallen grapes, but are to leave them for the poor and the foreigner.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage prohibits stealing, lying, deception, false oaths, oppression,
    robbery, delayed wages, cursing the deaf, placing a stumbling block before the
    blind, unjust judgment, slander, endangering a neighbor, hatred, vengeance, and
    grudges; it commands love of neighbor as self.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage prohibits cross-breeding different kinds of animals, sowing a
    field with two kinds of seed, and wearing a garment made of two kinds of material.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: In a case involving a man and a slave girl pledged to another man and not
    freed, punishment is prescribed, but not death; the man brings a ram as a trespass
    offering, and the priest makes atonement before Yahweh so the sin is forgiven.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: After entering the land and planting food trees, the fruit is counted forbidden
    for three years, holy for praise to Yahweh in the fourth year, and eaten in the
    fifth year so that it may yield increase.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: The passage prohibits eating meat with blood in it, enchantments, sorcery,
    certain cutting of hair and beard, cuttings in flesh for the dead, tattoo marks,
    making a daughter a prostitute, and seeking mediums or wizards; it also commands
    keeping Sabbaths and reverencing the sanctuary.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The addressees are commanded to rise before the gray head, honor the elderly,
    not wrong a resident foreigner, treat the foreigner as native-born, and love the
    foreigner as self because they lived as foreigners in Egypt.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: The passage commands no unrighteousness in measures of length, weight, or
    quantity, requires just balances, weights, ephah, and hin, identifies Yahweh as
    the one who brought the addressees out of Egypt, and closes by commanding observance
    of statutes and ordinances.
  category: object
  evidence_refs:
  - ev:9
