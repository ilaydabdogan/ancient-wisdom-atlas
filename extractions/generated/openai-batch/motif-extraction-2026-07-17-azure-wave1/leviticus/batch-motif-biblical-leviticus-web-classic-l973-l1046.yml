canonical_text:
  quote: ''
  summary: 'The passage begins with footnotes defining ephah and log measures, then
    gives Leviticus 15: Yahweh instructs Moses and Aaron to speak to Israel about
    impurity from male bodily discharge, semen emission, menstruation, and prolonged
    blood discharge. The law describes contaminated beds, seats, saddles, vessels,
    garments, and contacts; washing and bathing in water; waiting until evening; seven-day
    cleansing periods; eighth-day bird offerings brought to the priest at the Tent
    of Meeting; priestly atonement before Yahweh; and separation from uncleanness
    so Israel does not die by defiling the tabernacle among them.'
  language: English
  quote_policy: summarized
