canonical_text:
  quote: ''
  summary: Yahweh instructs Moses concerning Aaron’s restricted entry into the Most
    Holy Place and the annual atonement rite. Aaron must bathe, wear holy linen garments,
    offer a bull for himself, use incense and blood within the veil, purify the sanctuary,
    altar, priests, and people, and send a live goat bearing Israel’s sins into the
    wilderness. The rite is established as an everlasting annual statute on the tenth
    day of the seventh month.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The instruction is given after the death of Aaron’s two sons who came near
    before Yahweh and died.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aaron is told not to enter the Most Holy Place within the veil at any time,
    because Yahweh appears in the cloud on the mercy seat and unauthorized entry risks
    death.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Aaron must bring a young bull for a sin offering and a ram for a burnt offering
    when entering the sanctuary.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Aaron must bathe his body in water and put on holy linen garments before the
    rite.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Two male goats are taken from the congregation; lots assign one goat for Yahweh
    and the other for the scapegoat.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: The goat assigned to Yahweh is offered as a sin offering, while the scapegoat
    is presented alive and sent into the wilderness.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: Aaron brings coals of fire and incense within the veil so that an incense
    cloud covers the mercy seat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:8
  text: Aaron sprinkles blood from the bull and the goat on and before the mercy seat,
    including sevenfold sprinkling.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:9
  text: Atonement is made for the Holy Place, the Tent of Meeting, and the altar because
    of Israel’s uncleanness, transgressions, and sins.
  category: action
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:10
  text: No one else is to be in the Tent of Meeting while Aaron enters to make atonement
    until he comes out.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:11
  text: Aaron lays both hands on the live goat’s head, confesses Israel’s iniquities,
    transgressions, and sins over it, and sends it away by a prepared man.
  category: action
  evidence_refs:
  - ev:13
- id: obs:12
  text: The goat carries the iniquities to a solitary land and is released in the
    wilderness.
  category: action
  evidence_refs:
  - ev:14
- id: obs:13
  text: After the scapegoat is released, the person who released it must wash his
    clothes, bathe in water, and then return to the camp.
  category: action
  evidence_refs:
  - ev:15
- id: obs:14
  text: The bull and goat whose blood was used in the Holy Place are carried outside
    the camp and burned with fire; the burner must wash and bathe before returning.
  category: action
  evidence_refs:
  - ev:16
- id: obs:15
  text: The rite is appointed for the seventh month, the tenth day; the people must
    afflict their souls and do no work.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:16
  text: The statute is described as everlasting and annual, making atonement for Israel
    because of all their sins.
  category: speech
  evidence_refs:
  - ev:18
