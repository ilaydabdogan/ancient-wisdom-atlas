  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Unintentional violation of Yahweh’s commandments is described as sin and guilt
    requiring a sin offering.
  category: relationship
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  - ev:7
- id: obs:3
  text: If the anointed priest sins so as to bring guilt on the people, he is to offer
    a young bull without defect to Yahweh for a sin offering.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bull is brought to the door of the Tent of Meeting, the offerer lays a
    hand on its head, and the bull is killed before Yahweh.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Blood is taken into the Tent of Meeting, sprinkled seven times before Yahweh
    before the veil, placed on altar horns, and poured at the base of the altar of
    burnt offering.
  category: action
  evidence_refs:
  - ev:2
  - ev:5
- id: obs:6
  text: Selected fat and organs of the bull are burned on the altar, while the rest
    of the bull is carried outside the camp to a clean ash place and burned with fire
    on wood.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: If the whole congregation sins and the sin becomes known, the assembly offers
    a young bull; the elders lay hands on its head, and the priest makes atonement
    so that they are forgiven.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: If a ruler sins unwittingly and the sin is made known, he brings a male goat
    without defect; the rite includes hand laying, killing, blood application, fat
    burning, atonement, and forgiveness.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: If a common person sins unwittingly and the sin is made known, the person
    may bring a female goat or a female lamb without defect for the sin offering.
  category: action
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:10
  text: The passage gives differentiated procedures for an anointed priest, the whole
    congregation, a ruler, and a common person.
  category: relationship
