canonical_text:
  quote: ''
  summary: Yahweh instructs Moses to tell Israel the procedures for sin offerings
    when an anointed priest, the whole congregation, a ruler, or a common person sins
    unintentionally. The prescribed rites involve bringing an unblemished animal,
    laying hands on its head, killing it before Yahweh, applying and pouring out its
    blood at sacred places, burning its fat or selected parts on the altar, and in
    some cases burning the remaining bull outside the camp. The priest makes atonement,
    and the sinner or group is forgiven.
  language: English
  quote_policy: summarized
