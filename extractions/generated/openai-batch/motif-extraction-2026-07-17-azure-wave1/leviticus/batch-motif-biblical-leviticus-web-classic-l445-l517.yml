canonical_text:
  quote: ''
  summary: Yahweh commands Moses to assemble Aaron, Aaron’s sons, ritual garments,
    anointing oil, sacrificial animals, and bread at the Tent of Meeting. Moses washes,
    clothes, anoints, and consecrates Aaron and his sons, performs sin, burnt, and
    consecration offerings, applies blood and oil, instructs them to eat at the sanctuary
    entrance, burn leftovers, and remain there seven days. Aaron and his sons obey.
  language: English
  quote_policy: summarized
