canonical_text:
  quote: ''
  summary: Leviticus 5 lists cases of guilt involving failure to testify, contact
    with uncleanness, rash oaths, trespass against holy things, and unwitting violations.
    It prescribes confession, graded sin or trespass offerings, priestly atonement,
    restitution where holy things are wronged, and forgiveness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who hears a public adjuration to testify and does not report what
    he has seen or known shall bear iniquity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Touching the carcass of an unclean animal, livestock, creeping thing, or human
    uncleanness can make a person guilty when the hidden condition becomes known.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A rash oath to do evil or good, if hidden and later known, results in guilt.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: When guilty in these cases, the person must confess the sin and bring a trespass
    offering to Yahweh.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The prescribed offering can be a female lamb or goat, with the priest making
    atonement for the sin.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the person cannot afford a lamb, he brings two turtledoves or two young
    pigeons, one for a sin offering and one for a burnt offering.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: For the bird sin offering, the priest wrings the neck, sprinkles blood on
    the side of the altar, and drains the remaining blood at the altar base.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: If the person cannot afford birds, he brings one tenth of an ephah of fine
    flour for a sin offering, without oil or frankincense.
  category: object
  evidence_refs:
  - ev:6
- id: obs:9
  text: The priest burns a handful of the flour as a memorial portion on the altar,
    and the rest belongs to the priest as with a meal offering.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: A trespass regarding Yahweh’s holy things requires a ram without defect, valuation
    in sanctuary shekels, restitution, and an added fifth part.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A person who unknowingly does what Yahweh commanded not to be done remains
    guilty and must bring a ram for a trespass offering.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:12
  text: The repeated ritual result is that the priest makes atonement and the guilty
    person is forgiven.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
