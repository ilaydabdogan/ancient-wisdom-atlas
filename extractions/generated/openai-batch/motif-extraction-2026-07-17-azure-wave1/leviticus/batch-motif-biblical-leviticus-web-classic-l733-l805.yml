canonical_text:
  quote: ''
  summary: Yahweh instructs Moses and Aaron about priestly examination of skin conditions
    called plagues of leprosy. Priests inspect visible signs such as white hair, depth
    of appearance, spread, fading, raw flesh, scars from boils or burns, and itching
    on the head or beard. Depending on the signs, the priest isolates the person for
    seven-day periods or pronounces the person clean or unclean; some clean verdicts
    require washing clothes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yahweh speaks to Moses and Aaron and gives instructions for cases where a
    person has swelling, a scab, or a bright spot in the skin that may become a plague
    of leprosy.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A person with such a skin condition is to be brought to Aaron the priest or
    to one of his sons, the priests.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The priest examines the skin condition and pronounces the person unclean if
    the hair in the affected place has turned white and the appearance is deeper than
    the skin.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a white bright spot is not deeper than the skin and the hair has not turned
    white, the priest isolates the infected person for seven days and may isolate
    him for seven more days.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: If after isolation the plague has faded and has not spread, the priest pronounces
    the person clean; the person washes his clothes and is clean.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: If a scab spreads after the person has shown himself for cleansing, the priest
    examines him again and pronounces him unclean.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A white swelling with white hair and raw flesh is described as chronic leprosy,
    and the person is pronounced unclean without isolation.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: If leprosy covers all the person’s skin and all the flesh has turned white,
    the priest pronounces him clean; whenever raw flesh appears, he is unclean.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A healed boil that develops a white swelling or reddish-white bright spot
    is examined; depth, white hair, spreading, or stability determine whether the
    person is unclean or clean.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A burn from fire that develops a reddish-white or white bright spot is examined;
    depth, white hair, spreading, fading, and stability determine whether the person
    is unclean or clean.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: A plague on the head or beard is examined; deeper appearance with yellow thin
    hair leads to an unclean verdict and is called an itch and leprosy of the head
    or beard.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: When an itch lacks the decisive signs, the person is isolated, shaved except
    for the itch, isolated for seven more days, and can be pronounced clean if the
    itch has not spread and is not deeper than the skin.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: If an itch spreads after cleansing, the priest examines the person and may
    pronounce him unclean without looking for yellow hair.
  category: sequence
  evidence_refs:
  - ev:10
