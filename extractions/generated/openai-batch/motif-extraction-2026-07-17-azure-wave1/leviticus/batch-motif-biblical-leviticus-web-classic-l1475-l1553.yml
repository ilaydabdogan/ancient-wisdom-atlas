canonical_text:
  quote: ''
  summary: 'Yahweh instructs Moses to tell Israel the appointed feasts and holy convocations:
    weekly Sabbath rest; Passover and Unleavened Bread; first-fruits offerings after
    harvest; counting fifty days to a new meal offering; leaving gleanings for the
    poor and foreigner; seventh-month trumpet memorial; Day of Atonement with self-denial
    and work prohibition; and the Feast of Booths with offerings and solemn rest.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yahweh speaks to Moses and commands him to announce Yahweh’s set feasts as
    holy convocations to the children of Israel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Six days are designated for work, while the seventh day is a Sabbath of solemn
    rest with no work in all dwellings.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Passover is placed in the first month on the fourteenth day in the evening,
    followed by seven days of unleavened bread beginning on the fifteenth day.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: During the feast of unleavened bread, the community is to hold holy convocations,
    avoid regular work on specified days, and offer offerings made by fire to Yahweh.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: After entering the given land and reaping its harvest, Israel is to bring
    a sheaf of first fruits to the priest, who waves it before Yahweh.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: On the day of the waved sheaf, a year-old male lamb without defect, fine flour
    mixed with oil, and wine are offered to Yahweh; grain foods are not to be eaten
    before the offering is brought.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: After seven Sabbaths and fifty days are counted, two loaves of first-fruits
    bread, animal offerings, a sin offering, and peace offerings are presented, and
    the priest waves them before Yahweh.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Harvesters must not completely reap field corners or gather harvest gleanings,
    but must leave them for the poor and the foreigner.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: On the first day of the seventh month, Israel is to have solemn rest, a memorial
    of trumpet blowing, a holy convocation, no regular work, and an offering made
    by fire.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: On the tenth day of the seventh month, the Day of Atonement is a holy convocation
    marked by self-denial, offerings made by fire, and no work.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Anyone who does not deny himself on the Day of Atonement is to be cut off
    from his people, and Yahweh says he will destroy anyone who works on that day.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: On the fifteenth day of the seventh month, the Feast of Booths lasts seven
    days, with offerings made by fire, holy convocations, and solemn rest on the first
    and eighth days.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:11
- id: obs:13
  text: The appointed feasts include burnt offerings, meal offerings, sacrifices,
