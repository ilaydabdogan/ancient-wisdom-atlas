canonical_text:
  quote: ''
  summary: Yahweh instructs Moses to address the children of Israel. Israel is told
    not to follow the practices of Egypt or Canaan, but to keep Yahweh’s statutes
    and ordinances. The passage lists prohibited sexual relations involving close
    kin, adultery, intercourse during uncleanness, same-sex intercourse, and intercourse
    with animals. It also prohibits giving children as a sacrifice to Molech. The
    passage says such practices defiled prior nations and the land, which was punished
    and vomited out its inhabitants. Israel, including native-born and resident foreigner,
    is warned not to commit these abominations lest the land vomit them out and offenders
    be cut off from among their people.
  language: English
