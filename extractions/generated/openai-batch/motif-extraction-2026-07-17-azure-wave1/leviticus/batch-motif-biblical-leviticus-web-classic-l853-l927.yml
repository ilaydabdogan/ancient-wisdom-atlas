  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: One bird is killed in an earthen vessel over running water, and the living
    bird with the cedar wood, scarlet, and hyssop is dipped in the blood of the killed
    bird.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The priest sprinkles the person to be cleansed seven times, pronounces him
    clean, and lets the living bird go into the open field.
  category: action
  evidence_refs:
