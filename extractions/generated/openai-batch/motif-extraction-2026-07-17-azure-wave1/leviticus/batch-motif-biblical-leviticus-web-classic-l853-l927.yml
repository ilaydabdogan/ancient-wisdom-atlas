canonical_text:
  quote: ''
  summary: 'An included footnote defines warp and woof. Chapter 14 begins laws for
    cleansing a person healed of leprosy: priestly examination outside the camp, a
    bird-and-water rite, washing and shaving, timed reentry, eighth-day offerings,
    blood-and-oil application, atonement, and a reduced offering for a poor person.
    The passage then introduces instructions about a spreading mildew in a house in
    Canaan and the house owner reporting it to a priest.'
  language: English
  quote_policy: summarized
