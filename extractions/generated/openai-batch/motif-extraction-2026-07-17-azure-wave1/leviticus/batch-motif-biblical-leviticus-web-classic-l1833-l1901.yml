canonical_text:
  quote: ''
  summary: Leviticus 27 presents Yahweh’s instructions to Moses for Israel concerning
    vows, valuations, dedication and redemption of persons, animals, houses, fields,
    firstborn animals, devoted things, and tithes. It concludes that these commandments
    were commanded on Mount Sinai.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yahweh speaks to Moses and tells him to speak to the children of Israel.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Persons consecrated to Yahweh in a vow are assigned monetary valuations according
    to age and sex.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If a person is poorer than the stated valuation, he is set before the priest,
    and the priest assigns a value according to ability to pay.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: An offerable animal given to Yahweh becomes holy and must not be altered or
    exchanged; if exchanged, both animals become holy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: An unclean animal is set before the priest for evaluation and may be redeemed
    by adding a fifth part to its valuation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: A house dedicated as holy to Yahweh is evaluated by the priest and may be
    redeemed by adding a fifth part of the valuation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A field dedicated to Yahweh is valued according to seed capacity and the years
    remaining until the Year of Jubilee.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: If a dedicated field is not redeemed, or has been sold to another, it becomes
    holy to Yahweh at Jubilee as a devoted field and is owned by the priests.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: A bought field dedicated to Yahweh returns in the Year of Jubilee to the person
    whose possession the land belongs to.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:10
  text: All valuations are to be according to the shekel of the sanctuary, with twenty
    gerahs to the shekel.
  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: Firstborn animals that belong to Yahweh as firstborn may not be dedicated
    by a man; an unclean firstborn animal may be bought back with an added fifth part
    or sold according to valuation.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: A devoted thing from a person’s possessions, whether human, animal, or field,
    may not be sold or redeemed and is most holy to Yahweh.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:13
  text: A person devoted to destruction from among humans must not be ransomed and
    is to be put to death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:14
  text: The tithe of land, seed, fruit, herds, and flocks is Yahweh’s and holy to
    Yahweh; every tenth animal passing under the rod is holy.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:15
  text: The passage closes by identifying these instructions as commandments Yahweh
    commanded Moses for the children of Israel on Mount Sinai.
  category: setting
  evidence_refs:
  - ev:9
