canonical_text:
  quote: ''
  summary: Yahweh gives Moses instructions for Aaron, his sons, and Israel concerning
    priestly handling and eating of holy things, impurity, restitution for unwitting
    consumption, acceptable and defective sacrificial animals, timing rules for newborn
    animals and thanksgiving sacrifices, and the command not to profane Yahweh’s holy
    name.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yahweh speaks to Moses and directs him to instruct Aaron and his sons about
    separating themselves from the holy things of Israel and not profaning Yahweh’s
    holy name.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: An offspring of Aaron who approaches holy things while unclean is to be cut
    off from before Yahweh.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Specific states or contacts—leprosy, discharge, contact with uncleanness from
    the dead, seminal emission, creeping things, or other persons with uncleanness—bar
    a priestly descendant from eating holy things until clean.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A person made unclean by such contact remains unclean until evening and may
    not eat holy things unless he bathes his body in water.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After the sun goes down, the person is clean and may eat the holy things because
    they are his bread.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage forbids eating what dies by itself or is torn by animals, and
    warns priests to follow the commandment so they do not bear sin, die in it, or
    profane it.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: A stranger, a foreigner living with priests, a hired servant, and a priest’s
    daughter married to an outsider may not eat the holy thing, while a purchased
    slave and those born in the priest’s house may eat his bread.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: A widowed or divorced priest’s daughter with no child who returns to her father’s
    house may eat her father’s bread, but no stranger may eat any of it.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: If a man eats something holy unwittingly, he must add a fifth of its value
    and give the holy thing to the priest.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: The priests are told not to profane the holy things offered by Israel to Yahweh,
    so as not to cause guilt when people eat holy things.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Offerings for vows or free will burnt offerings may be brought by members
    of Israel or foreigners in Israel.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: For acceptance, the offering is to be a male without defect from bulls, sheep,
    or goats.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: A sacrifice of peace offerings for a vow or free will offering from herd or
    flock must be perfect and without defect to be accepted.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: Animals that are blind, injured, maimed, warty, festering, or running with
    sores must not be offered to Yahweh or made an offering by fire on Yahweh’s altar.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: A bull or lamb with deformity or lacking parts may be used for a free will
    offering but is not accepted for a vow.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:16
  text: An animal with bruised, crushed, broken, or cut testicles must not be offered
    to Yahweh, and defective animals from a foreigner’s hand must not be offered as
    the bread of God.
  category: action
  evidence_refs:
  - ev:11
- id: obs:17
  text: A newborn bull, sheep, or goat must remain seven days with its mother; from
    the eighth day onward it is accepted for an offering made by fire to Yahweh.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:18
  text: A cow or ewe and its young must not both be killed in one day.
  category: action
  evidence_refs:
  - ev:12
- id: obs:19
  text: A thanksgiving sacrifice to Yahweh must be sacrificed for acceptance and eaten
    the same day, with none left until morning.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:20
  text: The passage ends with commands to keep Yahweh’s commandments, not profane
    Yahweh’s holy name, and recognize Yahweh as the one who makes Israel holy and
    brought them out of Egypt to be their God.
  category: speech
  evidence_refs:
  - ev:14
