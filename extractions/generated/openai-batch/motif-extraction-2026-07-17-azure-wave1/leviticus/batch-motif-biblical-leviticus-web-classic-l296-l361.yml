canonical_text:
  quote: ''
  summary: Footnotes define ephah and shekel measures. Chapter 6 presents divine instructions
    to Moses concerning trespass restitution, offerings for atonement, maintenance
    of the burnt offering and altar fire, meal offerings, priestly portions, anointing
    offerings, and the handling of sin offerings, blood, vessels, and holy food.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The footnotes define an ephah as about 22 liters or about two thirds of a
    bushel, and a shekel as about 10 grams or about 0.35 ounces.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yahweh speaks to Moses and names offenses involving false dealing with a neighbor,
    robbery, oppression, lost property, lying, and false oaths as sins and trespasses.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The guilty person must restore the property in full, add one fifth more, and
    return it to the owner on the day of being found guilty.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The guilty person must bring to Yahweh a ram without defect from the flock
    as a trespass offering, through the priest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The priest makes atonement before Yahweh, and the guilty person is forgiven.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The burnt offering remains on the altar hearth all night until morning, and
    the altar fire is kept burning on it.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The priest wears linen garments to remove ashes from the altar and changes
    garments before carrying the ashes outside the camp to a clean place.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The altar fire must not go out; wood is burned on it every morning, and burnt
    offerings and the fat of peace offerings are burned on it.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: For the meal offering, a handful of fine flour, oil, and frankincense is burned
    as a memorial portion and pleasant aroma to Yahweh; the remainder is eaten without
    yeast by Aaron and his sons in a holy place, in the court of the Tent of Meeting.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: On the day of anointing, Aaron and his sons offer a tenth of an ephah of fine
    flour, half in the morning and half in the evening; the priestly meal offering
    is wholly burned and not eaten.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The sin offering is killed in the place where the burnt offering is killed,
    and the priest who offers it for sin eats it in a holy place.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Whatever touches the flesh of the sin offering becomes holy; a garment sprinkled
    with its blood must be washed in a holy place; an earthen cooking vessel is broken,
    while a bronze vessel is scoured and rinsed in water.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: A sin offering whose blood is brought into the Tent of Meeting to make atonement
    in the Holy Place is not eaten but burned with fire.
  category: action
  evidence_refs:
  - ev:12
