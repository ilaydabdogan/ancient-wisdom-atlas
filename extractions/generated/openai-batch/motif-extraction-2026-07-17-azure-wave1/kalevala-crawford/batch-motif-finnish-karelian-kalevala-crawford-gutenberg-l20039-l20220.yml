canonical_text:
  quote: ''
  summary: Ilmarinen travels with the unwilling Northland maiden. She asks to be freed
    and names possible animal transformations; Ilmarinen answers with predator transformations
    of his own. During the journey she sees animal tracks and says she would rather
    follow hare, fox, or wolf than remain with him. After returning home, Ilmarinen
    considers violence, but his sword refuses to kill a helpless maiden. He then uses
    magic song to transform her into a sea-gull. Later Wainamoinen asks about Pohyola
    and the maiden; Ilmarinen reports Pohyola’s prosperity through the Sampo and says
    he changed the maiden into a sea-gull.
  language: English
  quote_policy: summarized
