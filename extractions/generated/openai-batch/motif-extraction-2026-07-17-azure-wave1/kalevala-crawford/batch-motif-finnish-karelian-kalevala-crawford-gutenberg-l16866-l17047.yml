canonical_text:
  quote: ''
  summary: Lemminkainen rejoices that his mother is alive, recalls his long absence
    on a refuge island, and describes its abundant landscape and social tensions.
    In the next rune, his personified ships lament remaining unused; he promises them
    war, tells his mother he will avenge an insult by Northland warriors, ignores
    her warning of death, seeks Tiera/Kura as a combat companion, and departs with
    him by boat toward Pohya/Sariola.
  language: English
  quote_policy: summarized
