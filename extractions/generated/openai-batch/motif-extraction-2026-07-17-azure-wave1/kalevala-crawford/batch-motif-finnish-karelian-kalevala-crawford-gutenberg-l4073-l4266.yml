canonical_text:
  quote: ''
  summary: Louhi of Pohyola questions the stranded Wainamoinen, rescues and hosts
    him, and negotiates his return home in exchange for the forging of the Sampo.
    Wainamoinen says he cannot forge it but will send Ilmarinen, the smith said to
    have forged the heavens. Louhi then sends Wainamoinen off in a birch-wood sledge
    and warns him not to look upward during the journey before evening.
  language: English
  quote_policy: summarized
