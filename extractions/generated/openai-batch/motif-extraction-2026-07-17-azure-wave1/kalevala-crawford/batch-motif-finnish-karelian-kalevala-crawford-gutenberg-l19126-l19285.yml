canonical_text:
  quote: ''
  summary: A maiden recounts becoming lost while gathering berries, calling from a
    mountain, and seeking death. She then leaps from a snow-sledge into river, cataract,
    fiery stream, and whirlpool, and is described as Kullervo's sister finding peace
    in Tuonela and Mana. Kullerwoinen laments that he has shamed and destroyed his
    sister, returns to his mother, confesses that he did not recognize her, seeks
    a place to die, rejects his mother's counsel to hide his transgression, and turns
    toward death, battle, and revenge against Untamoinen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The maiden says that as a child she lived in plenty in her mother's dwellings
    and went to woods, uplands, and mountains to gather berries.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: On the third day she could not find the homeward path; the roads and footpaths
    led her farther into the woodlands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: She wept for three days, climbed a lofty mountain, called out, and received
    an echoing answer from the woodlands and hills that no one would answer her and
    her home and people were far away.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: From the third through seventh days she sought to perish but could not die
    on the mountains; she imagines that, had she died, her body would have fed vegetation
    and blossomed as a flower.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: After speaking, the maiden bounded from the snow-sledge and rushed to the
    rolling river, cataract, fiery stream, and whirlpool.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage identifies the maiden as Kullervo's lovely sister and says she
    hastened to destruction, death by fire and water, and peace in Tuonela and the
    sacred stream of Mana.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Kullerwoinen wept and said he had slain his virgin-sister and shamed his mother's
    daughter; he wished death or sickness had killed him in infancy.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Kullerwoinen rode home to his father's cabin and told his mother she would
    have done well had she killed him as an infant by smoke, water, or fire.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The mother asked what had happened and whether he came as from Tuoni or Manala.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kullerwoinen confessed that he met a maiden, his mother's long-lost daughter,
    did not recognize his sister, and committed a fatal sin before she rushed to the
    waters and fiery whirlpool.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kullerwoinen asked where he might perish and named the wolf, bear, shark,
    and sea-dog; his mother warned him not to seek those deaths and said there was
    room in Suomi and the Sawa-borders to hide transgression until time brought consolation.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:12
  text: Kullerwoinen rejected hiding from sorrow, said he hastened to death, Kalma,
    Pohya, and battle-fields, and named unavenged wrongs connected with Untamoinen.
  category: speech
  evidence_refs:
  - ev:11
