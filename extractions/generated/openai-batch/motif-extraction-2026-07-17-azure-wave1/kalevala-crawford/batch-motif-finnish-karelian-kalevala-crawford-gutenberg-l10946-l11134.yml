canonical_text:
  quote: ''
  summary: A huge ox from Karjala/Suomi is brought to Pohyola for Louhi's marriage
    feast, but no local butcher can kill it. Wirokannas attempts and fails. After
    a wide search, a small sea-born hero with a golden cleaver rises from the waves
    and slays the ox, providing vast quantities of meat, blood, and suet. Louhi then
    seeks beer and mead for her daughter's nuptials. An old man explains barley, hops,
    and water; the plants and water are personified as joining forces. Osmotar brews
    the ingredients in a caldron and barrels the beer, but cannot yet produce fermentation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ox is said to have grown in far Karjala/Suomi and is described with vast
    body measurements, including a tail sweeping Jamen, a head over Kemi, and horns
    a hundred fathoms long.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The ox is conducted from Karjala to Pohyola with many heroes at its horns,
    head, and neck; its shoulders rise to the clouds and its horns to heaven.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: No butcher in Sariola or among Northland's people can be found to kill the
    ox for Louhi.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wirokannas, also called Palwoinen in the passage, threatens to kill the ox
    with an ancient war-club, but when the ox turns and flashes flaming eyes at him,
    he hides in a thicket.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: A butcher is sought across Karelen, Suomi, Ehstland, Sweden, Lapland, Turya,
    Tuoni's empire, Manala, the ocean, and distant pastures, without success.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A hero rises from the sea-waves; he is not the largest or smallest, has a
    sea-shell bed, can stand beneath a flour-sieve, has iron hands, a copper-colored
    face, a flint-stone hat, sandstone sandals, and a golden cleaver with a copper
    handle.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The sea-born hero is identified as the butcher and slayer of the magic ox,
    and the passage states that nothing so mighty has been found that it has not found
    a master.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: The sea-god rushes on the ox, throws it to its knees, and fells it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: The slaughter produces abundant meat, seven boatfuls of blood, and a thousand
    weight of suet for the banquet of Pohyola and the marriage-feast of Northland.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: Pohyola has an enormous guest-room or hall of Louhi, described as a hundred
