canonical_text:
  quote: ''
  summary: Lemminkainen enters the court of Pohyola after changing form, confronts
    Louhi and the gathered singers and wizards, defeats them by incantation, spares
    Nasshut, and then seeks Louhi's daughter. Louhi refuses because of Kyllikki and
    sets the capture of a wild-moose from Hisi fields and forests as a condition.
    Lemminkainen prepares weapons and seeks snow-shoes from Kauppi/Lylikki, who warns
    him of failure and suffering.
  language: English
  quote_policy: summarized
