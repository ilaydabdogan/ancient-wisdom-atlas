canonical_text:
  quote: ''
  summary: Lemminkainen departs from Sahri with Kyllikki and returns to his mother's
    cottage. He and his mother welcome and praise Kyllikki as bride and household
    daughter. A later section, headed as Kyllikki's broken vow, describes a period
    of marital contentment, Kyllikki's visit to village dances while Lemminkainen
    is fishing, Ainikki's report of this to him, his angry decision to go to war in
    Northland/Lapland, Kyllikki's warning dream of fire rising through their dwelling,
    and his rejection of both her warning and his mother's plea for peace.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lemminkainen rides away from Sahri, bids farewell to its meadows, woodlands,
    waters, valleys, mountains, islands, and inlets, and refers to them as places
    connected with his pursuit of Kyllikki.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The racer carries Lemminkainen and Kyllikki homeward toward Wainola and Kalevala.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: As they near Ahti's dwellings, Kyllikki describes the cottage as cold, dreary,
    and deserted-looking.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lemminkainen tells Kyllikki not to grieve about the cottage and promises to
    build better dwellings with beams, posts, sills, and rafters made from sacred
    birch-wood.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: At his mother's cottage, Lemminkainen's mother remarks on his long absence,
    and Lemminkainen says that he has brought the best of the Sahri maidens as his
    life-companion.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lemminkainen asks his mother to prepare a couch, pillows, and table food so
    that he may dwell in pleasure with his spouse and bride.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Lemminkainen's mother praises Ukko/Creator for giving her a daughter and describes
    the bride as able to tend fire, weave, spin, rinse ribbons, and full garments.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The mother compares Kyllikki's purity and beauty to mountain snow, ocean foam,
    a white swan, and stars, and asks that the cottage be enlarged and beautified
    now that a bride of higher station has been taken.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A later section states that Lemminkainen lived constantly beside his young
    wife in contentment; Ahti did not think of battles, and Kyllikki did not think
    of dances.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: When Lemminkainen goes fishing on the lake and is not home by evening, Kyllikki
    goes to the village dance of merry maidens.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Ainikki, Ahti's sister, reports that Kyllikki went to the village, to halls
    of strangers, plays, and dances with young men and maidens.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Lemminkainen becomes dejected and angry, asks his mother to wash his linen
    in poison-serpent and adder blood, and says he must hasten to combat in Northland
    and Lapland.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Kyllikki pleads with Ahti not to go to war and reports a dream in which fire
    and flames rise from the chimney, windows, rafters, floor, ceiling, halls, and
    doorways of their dwelling.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: Lemminkainen says he discredits women's dreams and has no faith in maidens'
