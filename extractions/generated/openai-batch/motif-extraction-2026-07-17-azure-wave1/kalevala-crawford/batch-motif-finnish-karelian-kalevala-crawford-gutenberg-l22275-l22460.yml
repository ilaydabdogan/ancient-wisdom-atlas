canonical_text:
  quote: Made a harp from sacred birch-wood
  summary: Wainamoinen commands a magic boat, searches unsuccessfully for his lost
    fish-bone harp, laments the loss of his music, hears and addresses a grieving
    birch-tree, promises it joy, then makes a new magical harp from birch, aspen,
    oak-associated pins, and a forest-maiden's golden tresses. When he plays the finished
    harp, the surrounding landscape, stones, waters, and trees respond with motion
    and pleasure.
  language: English
  quote_policy: quoted
