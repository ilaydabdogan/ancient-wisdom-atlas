canonical_text:
  quote: ''
  summary: Ahti/Lemminkainen, living near Kauko-point, hears signs of Pohyola’s wedding
    and angrily leaves his plowing. At home he asks his mother for food, drink, a
    heated bath, and hero clothing so he can attend the Northland wedding. His mother,
    wife, and others urge him not to go because he was not invited. He treats his
    sword and magic blade as his invitation. His mother warns that the road has three
    deadly dangers; she describes the first as a stream of fire with a flaming eagle
    and the second as a fire pit that has swallowed many travelers. Lemminkainen proposes
    magical means to pass the first danger.
  language: English
  quote_policy: summarized
