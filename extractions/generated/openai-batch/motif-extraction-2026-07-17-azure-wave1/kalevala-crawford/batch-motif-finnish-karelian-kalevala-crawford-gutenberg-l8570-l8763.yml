canonical_text:
  quote: |-
    Many they that visit Mana,
    Few return from Manas kingdom.
  summary: Wainamoinen builds a magic boat from oak by singing, but lacks three words
    needed to complete it. After unsuccessfully seeking the words among birds and
    animals, he journeys to Tuoni and Manala to find ancient wisdom. At the black
    fatal river he asks Tuoni's daughter for a ferry-boat. She questions why he has
    come alive to Manala, rejects several false explanations by noting the absent
    signs, warns that few return from Mana, and Wainamoinen insists that she row him
    across.
  language: English
  quote_policy: quoted
