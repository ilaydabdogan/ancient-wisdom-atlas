canonical_text:
  quote: "“Willingly thy life thou givest / As a sacrifice to Northland.”"
  summary: After Wainamoinen heals Kalevala, Louhi sends the bear Otso against Wainola’s
    herds. Wainamoinen asks Ilmarinen to forge a magic spear, invokes forest powers,
    addresses Otso respectfully, thanks Ukko, describes the bear’s life as willingly
    given in sacrifice, and returns singing with Otso while the community wonders
    at the forest gift.
