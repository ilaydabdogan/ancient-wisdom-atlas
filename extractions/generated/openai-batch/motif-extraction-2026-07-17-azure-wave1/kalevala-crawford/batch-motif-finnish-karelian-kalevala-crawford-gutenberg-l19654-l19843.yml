canonical_text:
  quote: ''
  summary: After mourning the death of his wife, Ilmarinen gathers precious metals
    and fuel, works a magical furnace, and repeatedly tries to forge a bride. The
    furnace first yields a lambkin and then a colt, both of which he rejects and returns
    to the furnace. At last a golden and silver maiden rises, but her limbs and senses
    do not function, and she remains cold and lifeless when placed beside him. Ilmarinen
    concludes she is not for him and says he will take her to Wainola for Wainamoinen.
  language: English
  quote_policy: summarized
