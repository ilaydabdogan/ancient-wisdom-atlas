  evidence_refs:
  - ev:1
- id: obs:2
  text: In his lament, Ilmarinen says his faithful life-companion was slaughtered
    by witchcraft and that he searches for his departed wife at midnight.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After mourning, Ilmarinen gathers gold from the ocean deeps, silver from the
    mountains, and birch-wood, then burns the wood and places ashes and metals in
    the furnace.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Servants or workmen are set at the bellows to fan the furnace flames, but
    the passage repeatedly says they fail or work faithlessly.
  category: relationship
  evidence_refs:
