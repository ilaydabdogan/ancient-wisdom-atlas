canonical_text:
  quote: When the blood flows from that hair-brush, / When blood oozes from those
    bristles.
  summary: Lemminkainen, also called Kaukomieli and Ahti, rejects his mother's treasure
    and warnings, prepares to travel to Northland/Lapland for war and possible pursuit
    of a distant maiden, recounts past magical victories over Lapland wizards, sets
    a bleeding hairbrush as an omen of misfortune, and arms himself with protective
    gear and a sword associated with Tuoni and the gods.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Lemminkainen asks for martial clothing, a battle sword, and his father's sword,
    saying he must go to upper Northland and Lapland battle-fields to win gold and
    silver.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: His mother answers that the household already has abundant gold and silver,
    including treasure uncovered by a plowshare from a chest beneath a serpent-filled
