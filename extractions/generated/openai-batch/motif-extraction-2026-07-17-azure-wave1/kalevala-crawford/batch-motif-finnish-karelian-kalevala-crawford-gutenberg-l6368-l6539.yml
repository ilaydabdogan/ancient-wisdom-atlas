  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lemminkainen refuses the household silver and says gold and silver won from
    combat are of greater value to him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Lemminkainen asks for heavy armor, spear, and broadsword, and says his pride
    and heart turn him toward the Northland and Lapland wars.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lemminkainen says he has heard of a maid in Pimentola who does not care for
    suitors or bearded heroes.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mother replies that Lemminkainen already has Kyllikki at home as his wife,
    and comments on the strangeness of two wives in one husband's home.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Lemminkainen dismisses Kyllikki by saying she runs to village dances, sleeps
    in other dwellings, and finds pleasure with village youth and maidens.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The mother warns him not to go to Northland or Lapland before gaining magic
