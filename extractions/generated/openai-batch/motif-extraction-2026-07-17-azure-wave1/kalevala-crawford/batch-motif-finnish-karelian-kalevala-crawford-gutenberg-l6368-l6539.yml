    charcoal, furnace, ashes, and fire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Lemminkainen says wizards and serpents have bewitched him before, including
    three Lapland wizards on a twilight rock, and that their losses inflicted on him
    were minimal.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Lemminkainen says the wizards threatened to sink him into marsh water, mud,
