canonical_text:
  quote: ''
  summary: Wainamoinen steers a magic vessel to a Northland promontory where Lemminkainen
    is working on a fish-boat. Lemminkainen mistakes the approaching war-ship for
    a rainbow and cloudlet, then identifies Wainamoinen at the helm and Ilmarinen
    rowing. Wainamoinen says they are sailing to Pohyola to gain the magic Sampo and
    its colored lid from a stone-berg or copper-bearing mountain. Lemminkainen asks
    to join as a third magic hero, is accepted, brings aspen floats, and discusses
    hidden sea dangers and the strength of Wainamoinen's metal-bound vessel. The next
    rune begins with Wainamoinen steering and singing the vessel onward toward Pohyola;
    maidens on the banks hear the music. Lemminkainen then recites prayers and commands
    for cataracts, water-beings, rocks, named helpers, a helm goddess, and Ukko to
    guide the ship safely through rapids and whirlpools.
  language: English
  quote_policy: summarized
