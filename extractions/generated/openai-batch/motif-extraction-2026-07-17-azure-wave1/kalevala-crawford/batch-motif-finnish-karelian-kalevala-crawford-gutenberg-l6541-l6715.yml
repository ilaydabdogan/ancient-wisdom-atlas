canonical_text:
  quote: ''
  summary: The passage describes how heroes guard homes, thresholds, and dangerous
    border places; Lemminkainen invokes protective powers, including nature spirits
    and Ukko, then travels by horse and snow-sledge to a Northland village in Lapland.
    He passes through lower, middle, and upper approaches, encounters a child and
    a witch or wizard, silences a watch-dog by invocation, enters a court-room, conjures
    a small attendant from vapor, and listens unseen to songs and laughter inside.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Heroes are said to guard homes and firesides, doors, roofs, windows, torch-light
    posts, highways to the courtyard, and gateway ends.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Heroes are said to be watchful against women, maidens, enchanters, warlike
    giants, and dangerous places including a doubly branching highway, blue-rock border,
    evil marshes, waterfalls, whirlpool, fiery springs, and rapids.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lemminkainen calls weapon-bearing heroes, beings from deeps and brooks, forest
    and thicket forces, mountain spirits, Hisi, Water-mother, Wellamo with mermaids,
    valley maidens, and river nymphs to protect him and dull hostile weapons.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lemminkainen says he can call other powers, including gods above and the great
    god of the heavens who governs clouds, ether, and storm-winds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Lemminkainen addresses Ukko as the god above, father of creation, thunder
    speaker, and bearer of lightning, asking for a fire-sword, burning arrows, lightning
    arrows, protection, guidance, and help against enchanters and Lapland wizards.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Lemminkainen asks that Lapland wizards be driven to the deepest ocean to wrestle
    with Wellamo.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Lemminkainen whistles for his stallion, harnesses the steed to a snow-sledge,
    mounts, and travels north for three days to a Northland village on the shores
    of Lapland.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: At the lowest highway and courtyard, Lemminkainen asks whether someone can
    loosen his stallion's gear; a babe playing on the floor answers that no one in
    the dwelling can do it.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: At the middle highway and central courtyard, Lemminkainen again asks for someone
    to tend his horse; a wizard or witch answers from the fireplace or bench that
    someone can do it and that a thousand heroes there can send him home before evening.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lemminkainen replies to the wizard that he should slay the speaker for pertness.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Lemminkainen drives onward on the upper highway to the courtyard on the summit.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: At the upper courtyard, Lemminkainen calls on Hisi and Lempo to stop the watch-dog's
    throat, nostrils, and mouth so the canine will be silent while he passes.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Inside the court-room, Lemminkainen strikes the floor with his whip; vapor
    rises, a pigmy appears in the fog, unhitches the horse, removes the harness, and
    tends the steed.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Lemminkainen advances and listens; no one sees or hears him, while he hears
    songs, voices, singing, and laughter through chinks, walls, and doors.
  category: action
  evidence_refs:
  - ev:12
