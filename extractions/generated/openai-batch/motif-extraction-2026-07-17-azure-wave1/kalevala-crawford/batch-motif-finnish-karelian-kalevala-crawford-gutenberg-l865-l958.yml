canonical_text:
  quote: ''
  summary: The preface describes Dr. Lnnrot's collection and arrangement of Finnish
    oral materials into the Kalevala, later expansion of the epic, and European scholarly
    reception. It reports comparative claims about Finnish mythological material,
    Hungarian incantations related to Kalevala charms, a Hungarian contract cup called
    Ukkon's cup linked to Finnish Ukko, and the Kalevala's contests between Finns
    and Laplanders.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Dr. Lnnrot arranged the results of his travels throughout Finland under the
    central idea of an epic called Kalevala and transmitted the manuscript to the
    Finnish Literary Society in February 1835.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: By 1840, Dr. Lnnrot had gathered more than one thousand fragments of epical
    poetry, national ballads, and proverbs, and published related works including
    Kanteletar and The Proverbs of the Suomi People.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Additional Finnish epic materials collected by other scholars led to a new
    edition; Dr. Lnnrot organized the material into an 1849 second edition with fifty
    runes and 22,793 lines.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage reports Jacob Grimm's view that mythological ideas in the Kalevala
    can help interpret ancient German mythological conceptions, and that Gothic and
    Icelandic literatures show Finnish influence.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage reports Max Mller's view that an epic collected from aged singers
    equalled the Iliad in length and completeness and should stand with major national
    epics.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ferdinand Barna used Hungarian materials to argue for the genuineness and
    antiquity of the Kalevala, citing the relationship between Hungarians and Finns
    and between Magyar and Finnish.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Peter Bornemissza's 1578 book is described as collecting incantations used
    among Hungarian country-people for expelling diseases and misfortunes.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that these Hungarian incantations display a sameness with
    numerous Kalevala incantations used for the same purpose.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Hungarian deeds from 1616-1660 are described as ending contracts with both
    parties emptying a customary cup of wine called Ukkon's cup.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ukko is identified in the passage as the chief God according to Finnish mythology.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Kalevala is described as relating ever-varying contests between Finns
    and darksome Laplanders.
  category: relationship
  evidence_refs:
  - ev:8
