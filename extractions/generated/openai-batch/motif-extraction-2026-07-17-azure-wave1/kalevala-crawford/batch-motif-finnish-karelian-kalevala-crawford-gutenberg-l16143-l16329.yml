canonical_text:
  quote: ''
  summary: Lemminkainen tells his mother that Northland warriors seek revenge after
    his violence at Pohyola. His mother reviews unsafe hiding possibilities, then
    directs him to swear off combat and flee by his father's vessel to a distant ocean
    island used earlier by his father as a refuge. Lemminkainen prepares provisions,
    says farewell, launches a copper boat with magic linen sails, and calls on the
    winds to carry him safely to the refuge.
  language: English
  quote_policy: summarized
