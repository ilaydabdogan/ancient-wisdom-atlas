canonical_text:
  quote: ''
  summary: The preface passage catalogs Finnish forest deities, forest demons, and
    deities concerned with human bodily and temporal welfare. It describes Tapio,
    Mielikki, Nyrikki, Sima-suu, Hiisi, Suoyatar, several love, sleep, healing, craft,
    travel, and treasure deities, and notes a serpent-treasure association said to
    occur also in Hungarian, German, and Slavic myths.
  language: English
  quote_policy: summarized
