canonical_text:
  quote: ''
  summary: Lemminkainen changes into an eagle, attempts an upward flight, and is burned
    by moonlight and sunshine. He prays to Ukko for a vapor cloak or silver cloud
    so he can return safely to his mother. He encounters a gray-hawk and sends a defiant
    message to Northland. He returns troubled to his mother, who repeatedly asks what
    has harmed him. He finally says he has seen visions, asks for provisions, and
    says he must leave because men are sharpening weapons for his death.
  language: English
  quote_policy: summarized
