canonical_text:
  quote: ''
  summary: The passage surveys Finnish spiritual powers, sacred animals, birds, insects,
    waters, trees, giants, and heroic genealogies. It describes household and subterranean
    spirits, blood-animated magical beings, bear worship and Otso’s birth, world-egg
    traditions, sacred birds and insects, revered waters and trees, violent giant
    feats of Soini/Kullervo, and the divine or primordial ancestry of Kalevala heroes.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage states that Finns hold spiritual powers other than gods and goddesses
    in high reverence.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Tontu is described as a kind-hearted house-spirit, a diminutive Cyclops-like
    being, to whom bread and broth are offered every morning.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: A mare's collar worn on the neck while walking nine times around a church
    is said to attract a desired being to a place.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Para is described as a mystical three-legged being that comes to life and
    action when its possessor cuts the little finger of the left hand, lets three
    drops of blood fall on it, and pronounces the proper magic word.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: The possessor of Para is said to be supplied with abundance of milk and cheese.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: The Maahiset are described as minute, invisible, human-shaped dwarfs living
    under stumps, trees, blocks, thresholds, and hearth-stones.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:7
  text: The Maahiset are said to punish neglect at household and festive activities,
    failure to honor the corners of new houses, and untidy households with cutaneous
    afflictions.
  category: action
  evidence_refs:
  - ev:2
- id: obs:8
  text: The Kirkonwki are described as little deformed beings living under church
    altars and able to aid sorrowing and suffering worshipers.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:9
  text: The passage states that certain beasts, birds, and trees are sacred in Finland
    and that traces of bear-worship appear in the Kalevala.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:10
  text: Otso the bear is said to have been born on the shoulders of Otava in the regions
    of the sun and moon and nursed by a woodland goddess in a gold-banded cradle between
    fir branches.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:11
  text: Otso's nurse withheld teeth and claws until he promised to avoid bloody strife
    and violence; the passage says Otso does not always keep this pledge.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:12
  text: Ahava the West-wind and Penitar, a blind old witch of Sariola, are named as
    parents of the swift dogs of Finland.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:13
  text: The duck, according to the Kalevala, and the eagle, according to other traditions,
    are said to lay the mundane egg and thereby take part in world creation.
  category: action
  evidence_refs:
  - ev:5
- id: obs:14
  text: Puhuri, the north-wind and father of Pakkanen, is sometimes personified as
    a gigantic eagle.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:15
  text: The didapper is revered for foretelling rain; Linnunrata is the Milky-way
    or bird-path; and the cuckoo is sacred and believed to fertilize the earth with
    songs.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:16
  text: Honey-bees are called Mehilainen and are described as especially sacred; Ukkon-koiva,
    the butterfly, is called Ukko's dog and viewed as a messenger of the Supreme Deity.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:17
  text: Certain lakes, rivers, springs, and fountains are held in high reverence,
    and the oak is called God's tree in the Kalevala.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:18
  text: The mountain-ash and birch-tree are said to remain sacred, and peasants plant
    them by cottages with reverence.
  category: action
  evidence_refs:
  - ev:7
- id: obs:19
  text: Soini, a synonym of Kullervo, is described as tearing his swaddling clothes
    at three days old, harming an infant he was ordered to nurse, and burning the
    infant's cradle.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:20
  text: When ordered to fence fields, Soini built a fence from earth to heaven using
    entire pine-trees and interwoven venomous serpents.
  category: action
  evidence_refs:
  - ev:8
- id: obs:21
  text: When ordered to tend herds, Soini changed cattle to wolves and bears and sent
    them home to destroy his mistress after she baked a stone into his oat-loaf and
    broke his knife.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:22
  text: The Finns proper are said to regard Wainamoinen, Ilmarinen, and Lemminkainen
    as descendants of the Celestial Virgin Ilmatar, impregnated by the winds when
    air, light, and water were the only material existences.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:23
  text: The Esthonians are said to regard these heroes as sons of the Great Spirit,
    begotten before the earth was created and dwelling with the Supreme Ruler in Jumala.
  category: relationship
  evidence_refs:
  - ev:9
