canonical_text:
  quote: ''
  summary: Wainamoinen invokes water figures to help draw fish to a magic net. A water-pigmy
    helps drive fish into the net, and a Fire-pike is caught. The Sun-child receives
    a heaven-sent knife and cuts open nested fish and colored balls until a heavenly
    fire-ball is found. Wainamoinen snatches the fire; it burns him, Ilmarinen, and
    wide landscapes before he tracks it, instructs it to dwell in hearths, contains
    it, and returns fire to Kalevala. Ilmarinen treats his burns and invokes a frost
    maiden for relief.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wainamoinen addresses Wellamo and asks her to exchange her water-raiment and
    reed/rush coat for garments he offers, including sea-foam, moss, sea-grass, and
    linen vestments.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wainamoinen addresses Ahto as king of the waters and instructs him to search
    deep waters with a seven-fathom pole and drive gray-pike toward a magic fish-net.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The deep-water setting includes caverns, trout-holes, whirlpools, bottomless
    abysses, and places without sunshine or moonlight.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A water-pigmy rises from the waters, riding a billow, and offers to help frighten
    pike and salmon into the fish-nets.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wainamoinen accepts the helper; the water-pigmy cuts a linden from the border
    and asks how strongly he should scare the fish.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: The pigmy frightens deep-sea dwellers and drives fish in countless numbers
    to the net; Wainamoinen draws the net with flax-thread ropes while speaking magic
    words.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Many gray-pike are caught, and a Fire-pike is among them; Wainamoinen lands
    the catch, casts the Fire-pike on shore, and returns the others to the water.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The Sun-child says he would like to carve the Fire-fish if he had the knife
    of good-luck; a magic fish-knife falls from the heavens and clouds to his girdle.
  category: sequence
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:9
  text: The Sun-child carves the Fire-pike, finds a lake-trout inside it, carves the
    lake-trout and finds a whiting, then carves the whiting and finds a blue ball,
    a scarlet ball, and a ball of fire.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: The fire found within the nested bodies and balls is described as a flame
    fallen from heaven, from the seventh heaven through nine regions of ether.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Wainamoinen reflects on how to bring the fire-ball to Wainola's fireless hearth-stones
    and snatches the heavenly fire from the Sun-child's fingers.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The fire singes Wainamoinen's beard, burns Ilmarinen's brow and fingers, then
    rolls westward and burns trees, heaths, meadows, islands, fields, forests, and
    dry lands.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Wainamoinen tracks the Fire-child to a glen-wood and finds it in an elm-tree,
    sleeping in a bed of fungus.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: Wainamoinen wakes the fire, calls it a fire created by God and flame of Ukko,
    and tells it to go to his village, hide in chimneys and ashes, devour birch-wood
    by day, and be hidden in the evening.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: Wainamoinen takes the willing Panu, places the fire of Ukko in tinder, birch
    punk-wood, and a copper vessel, and carries it back to Northland, Wainola, and
    the hearths of Kalevala.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: Ilmarinen goes to the deep-sea margin, sits on a rock, washes his wounds with
    briny water, and later addresses Panu about the burns.
  category: action
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:17
  text: Ilmarinen invokes a daughter from Pohyola, a white virgin of hoar-frost from
    Lapland, described with shoes of ice, icicles, a cup of white-frost, and an ice-spoon,
    to sprinkle snow on his burned members.
  category: speech
  evidence_refs:
  - ev:12
