canonical_text:
  quote: ''
  summary: Wainamoinen and companions approach a sound of weeping and find a personified
    war-ship lamenting at the shore. The ship says it was built for battle and treasure
    but has decayed unused. Wainamoinen promises to take it to Sariola, launches it,
    magically fills it with youths, maidens, and heroes, and commands it over the
    waters. Several groups of rowers fail to make progress until Ilmarinen rows with
    magic and the vessel speeds across the billows.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The approaching party expects to find a maiden weeping on the sea-shore, but
    instead finds a sad, lonely vessel wailing on the shore.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wainamoinen speaks to the vessel and asks why it is weeping, including whether
    its row-locks, rigging, or anchoring are the cause.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The war-ship answers that it wants to go to the waters and laments that no
    hero has set it free on the billows.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The vessel says it was fashioned and built to be a battle bark or mighty war-ship
    carrying treasures and goods across the ocean.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The vessel says it has never sailed to conquest or carried booty, while lesser
    vessels go to war and return with gold and silver.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The vessel describes its unused condition: it is decaying in harbor, with
    worms in its hull, birds in its rigging, and frogs and lizards around its oars
    and rudder.'
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wainamoinen tells the vessel to stop lamenting and says it will sail with
    them to Sariola, the Northland, and deadly combat.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: A dialogue establishes that the vessel cannot sail unaided and needs rowers,
    south-winds, and a helm or master at the rudder.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Wainamoinen leaves the racer at the sea-side, ties it to a sacred birch-tree,
