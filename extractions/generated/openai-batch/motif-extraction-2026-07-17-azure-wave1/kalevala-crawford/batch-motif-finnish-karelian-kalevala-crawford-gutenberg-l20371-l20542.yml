    onto the broad-sea.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The vessel is described as constructed from mighty oak and says it can carry
    treasures, golden cargo, a hundred oarsmen, and a thousand warriors.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:11
  text: Wainamoinen is called a magician and uses wondrous singing to place youths,
