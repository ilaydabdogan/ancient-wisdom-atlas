canonical_text:
  quote: ''
  summary: A first-person speaker describes the many possible origins of evil and
    affliction, addresses a demon or plague within the body, commands it to leave,
    and escalates through invocations of heroes, nature powers, female creative figures,
    and Ukko. The speaker repeatedly sends the evil back to possible source-realms
    such as winds, clouds, waters, death-lands, forests, caves, serpent abysses, and
    silent waters.
  language: English
  quote_policy: summarized
