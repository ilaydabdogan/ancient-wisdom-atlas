canonical_text:
  quote: ''
  summary: Lemminkainen spends three summers among island maidens, neglecting one
    spinster. As he prepares to return home over the ocean, the slighted woman curses
    his vessel and burns it. Seeing armed men preparing to kill him, he rebuilds a
    magic ship from fragments by secret knowledge, launches it with song, asks eagle
    and raven for protective feathers, and sails home while the island maidens lament
    his departure.
  language: English
  quote_policy: summarized
