canonical_text:
  quote: ''
  summary: Ilmarinen arrives at Louhi's yard as bridegroom. The hostess of Pohyola
    orders lavish care for his horse, has attendants alter the doorway so the tall
    hero can enter, thanks Ukko, prepares bridal rooms, discovers a magically remodeled
    dwelling, welcomes Ilmarinen, inspects him by firelight and tapers, seats him
    in the place of honor, and serves him and the wedding guests abundant food and
    beer.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ilmarinen drives his racer into Louhi's yard and stables and descends from
    his snow-sledge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The hostess of Pohyola commands a servant to remove the bridegroom's horse
    from the shafts, take off its harness, tie it at the manger, and lead it carefully
    to shelter.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The horse is to be led to Pohya-fountains, where living streams flow from
    the roots of birches under aspens.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The horse is to be fed with sweet grain and hay at golden and copper-furnished
    stable fittings, then groomed with a fish-bone comb, silken brushes, and decorated
    blankets.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The hostess calls village lads to lead the suitor into her chambers and asks
    whether they can bring him through the door without changing the cross-bar, threshold,
    or casings.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ilmarinen is too tall for the doorway, so servants remove the upper cross-bar,
    lower the threshold, widen the birch-wood portals, and open the door for him.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: After the bridegroom enters, the hostess thanks Ukko and orders the bridal
    chambers and halls prepared with linen, furs, clean birchen flooring, and orderly
    rooms.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The hostess finds her dwelling altered by mighty magic, with rooms and halls
    remodeled using animal bones, woods, trout scales, precious metals, marble, sea-shells,
    and the protection of Kalew's tree.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: In the court-room, Ilmarinen asks Ukko to send health and pleasure to the
    house, and the hostess welcomes him to the home of his affianced.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The hostess orders fire brought so she can look at the bridegroom; smoke first
    blackens his face, then waxen tapers make his eyes and cheeks shine.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The hostess orders attendants to lead her son-in-law to the highest and most
    honored seat at table, facing the guests.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The hostess serves the bridegroom first with rich food and drink, then helpers
    serve the other guests; beer is brought in silver pitchers from copper-banded
    vessels and sparkles on the beards of Ilmarinen and other heroes.
  category: sequence
  evidence_refs:
  - ev:10
