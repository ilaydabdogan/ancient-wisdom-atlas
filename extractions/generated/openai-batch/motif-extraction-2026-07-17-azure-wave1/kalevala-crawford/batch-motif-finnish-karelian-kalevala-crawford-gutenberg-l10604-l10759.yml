canonical_text:
  quote: ''
  summary: A pike of Mana rises from Tuoni's river and tries to swallow Ilmarinen.
    A mighty eagle attacks the pike repeatedly and finally lifts it from the water,
    but then tears and eats the body, leaving only the head. Ilmarinen presents the
    pike-head to Louhi as proof that he has completed the third Death-land task and
    asks for her daughter; Louhi objects to the damaged trophy but grants the bride.
    A child then tells of a huge eagle from the East that knocks at an iron-roofed
    hero-castle and a copper-roofed mother's castle but cannot enter either.
  language: English
  quote_policy: summarized
