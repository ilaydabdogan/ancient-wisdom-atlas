canonical_text:
  quote: ''
  summary: 'Ilmarinen completes a serpent-field task, asks the hostess of Pohyola/Louhi
    for her daughter, and is given further lethal tasks in the Death-land: to muzzle
    the bear of Mana and to catch the monster-pike of Tuoni without ordinary fishing
    gear. The affianced maiden advises him how to forge magical aids. Ilmarinen forges
    a bridle, receives fog-concealment from Terhenetar, bridles the bear, then forges
    a giant eagle from magical fire. The eagle carries him to Tuoni’s river and rescues
    him when a river monster seizes him.'
  language: English
  quote_policy: summarized
