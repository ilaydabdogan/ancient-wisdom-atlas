canonical_text:
  quote: ''
  summary: Wainamoinen laments the loss of Aino to Wellamo's watery realm and grieves
    that his wisdom has departed. He returns home, wishes his mother could advise
    him, and receives counsel from her as she speaks from her tomb, directing him
    toward the Northland and the Suomi daughters. In the next rune, he sets out northward
    on a magic courser. Youkahainen, moved by envy, fashions a decorated crossbow
    and poisoned arrows, waits in ambush near sacred waters, and at dawn sees Wainamoinen
    approaching over the ocean.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The ancient minstrel speaks in sorrow, calls himself foolish, and says his
    former knowledge, wisdom, virtues, youth, vigor, insight, sense, and prudence
    have left him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Aino is named as one whom Wainamoinen loves and cherishes; she is also called
    Wellamo's maiden and his promised friend and bride.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wainamoinen says he once caught Aino in Wellamo's grottoes, led her to his
    copper boat with a silver fish-line, but failed to keep her and let her slip to
    the home of water-maidens and the kingdom of Wellamo.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Wainamoinen departs empty-handed and heavy-hearted for his country and home
    in Kalevala.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On his journey, Wainamoinen asks why the cuckoo no longer brings gladness
    or sings for him, and he attributes the changed calling to sorrow and compassion.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wainamoinen says he will never learn the secret of how to live and prosper,
    rest on earth, or wander on the seas, and he wishes his ancient mother were alive
    to advise him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: Wainamoinen's mother awakens in the deep and speaks from her tomb, saying
    she was only sleeping and now answers him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The mother tells Wainamoinen to go to the Northland and visit the Suomi daughters,
    describing them as wise, lovely, and suitable for a life-companion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:9
  text: Wainamoinen arranges a journey to the Northland, takes a royal racer, adjusts
    a golden bridle, places an ornate saddle on it, and begins riding northward.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Wainamoinen rides through Wainola's meadows and the plains of Kalevala, bounds
    over a waste of waters, and reaches the blue-sea margin without wetting the horse's
    hoofs.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:11
  text: Youkahainen is described as evil and envious, nursing a grudge against Wainamoinen,
    the wonderful enchanter.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: Youkahainen prepares a cruel crossbow made of metals, colored paint, copper,
    silver, gold, sinews from the stag of Hisi, and flax of Lempo; the bow bears painted
    images including a courser, colts, a maiden, and a hare.
  category: object
  evidence_refs:
  - ev:5
- id: obs:13
  text: Youkahainen makes arrows with oak shafts, metal tips, feathers from swallow
    and sparrow, and steeping in the blood of serpents and the virus of the adder.
  category: object
  evidence_refs:
  - ev:5
- id: obs:14
  text: Youkahainen waits and spies for Wainamoinen with a crossbow and feathered
    arrows dipped in viper venom, taking positions at windows, paths, meadows, Fog-point,
    and places near a river, holy stream, whirlpool, and sacred river fire-fall.
  category: action
  evidence_refs:
  - ev:6
- id: obs:15
  text: At daybreak, Youkahainen looks northeast toward the sunrise, sees a black
    cloud and something blue on the waters, and identifies it as Wainamoinen riding
    to Northland on his magic courser.
  category: sequence
  evidence_refs:
  - ev:7
