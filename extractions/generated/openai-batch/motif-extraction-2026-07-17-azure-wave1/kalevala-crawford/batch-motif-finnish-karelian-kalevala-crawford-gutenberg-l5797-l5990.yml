canonical_text:
  quote: ''
  summary: The passage introduces Ahti, also called Kaukomieli and Lemminkainen, as
    an island-born heroic but morally flawed figure. It describes a noble Sahri maiden,
    called Kulli and later Kyllikki, who rejects celestial and foreign suitors. Lemminkainen
    decides to woo her despite his mother's warnings about social rank, mockery, and
    violence. He travels to Sahri, is mocked by local women for his arrival, enters
    service as a shepherd, joins the maidens' dances, gains favor among the Sahri
    women, and continues to woo the still-aloof Kyllikki.
  language: English
  quote_policy: summarized
