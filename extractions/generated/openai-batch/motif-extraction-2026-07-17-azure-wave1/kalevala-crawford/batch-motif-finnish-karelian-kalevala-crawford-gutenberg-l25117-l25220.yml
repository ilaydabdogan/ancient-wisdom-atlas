canonical_text:
  quote: ''
  summary: Mariatta seeks baptism for her child. Wirokannas hesitates and summons
    Wainamoinen to examine the infant. Wainamoinen condemns the child as an outcast,
    but the two-week-old child speaks and rebukes him for unjust judgment. Wirokannas
    then blesses the child with holy water and grants him royal heirship over Karyala.
    Wainamoinen, recognizing his waning power, departs westward in a magic copper
    boat, prophesies a future need for his return, and leaves his harp, songs, and
    wisdom sayings to Suomi.
  language: English
  quote_policy: summarized
