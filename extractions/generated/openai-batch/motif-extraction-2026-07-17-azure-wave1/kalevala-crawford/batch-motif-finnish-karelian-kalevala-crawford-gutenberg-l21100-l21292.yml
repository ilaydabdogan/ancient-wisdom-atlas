canonical_text:
  quote: This the origin of sea-pearls, / And the blue-ducks beauteous plumage.
  summary: Wainamoinen's harp-playing draws celestial maidens, fish, water beings,
    and human listeners into wonder and tears. His own tears flow into the waters;
    after a raven fails, a duck retrieves them from the deep and receives beautiful
    plumage, while the tears become sea-pearls. The next rune opens with Wainamoinen,
    Ilmarinen, and Lemminkainen/Kaukomieli sailing a magic war-ship toward Northland/Pohyola
    for the capture of the Sampo.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Moon's daughters and Sun's maidens hold silver weaving-combs, distaffs, golden
    shuttles, and silver spindles while weaving and spinning on cloud-rims and a many-colored
    bow.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the celestial maidens hear Wainamoinen's harp, they drop their silver
    combs and spindles, and golden and silver threads are broken.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fish from Suomi waters, water-cliffs, sea-caves, deeper caves, and sea-fern
    beds gather with heads above the surface to hear Wainamoinen's harp and songs.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ahto, king of the waters, rises above the billows in a boat of water-lilies,
    goes to the coast, listens, and praises Wainamoinen's playing as unparalleled
    since the sea was fashioned.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Satko's daughters sit on colored strands combing sea-green tresses with silver
    and gold implements; when they hear the harp, their combs and brushes fall into
    the water and their hair remains uncombed.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The hostess of the waters rises from a deep sea-castle, swims to shore, listens
    to the music, and sinks into sleep on colored rocks and a watery couch.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Wainamoinen plays for three days, and no listed group of people or heroes
