- id: motif:2
  label: etiological origin of sea-pearls and blue-duck plumage from a hero's tears
  taxonomy_refs:
  - culture_hero
  basis: The passage says Wainamoinen's tears are recovered from deep water as jewel-like
    objects and explicitly calls this the origin of sea-pearls and blue-duck plumage.
  evidence_refs:
  - ev:8
  - ev:12
  confidence: high
  cautions: The passage states the origin but does not spell out a separate act of
