canonical_text:
  quote: |-
    To the kingdom of Tuoni,
    To the realm of the departed,
    To the isle of the hereafter.
  summary: Aino grieves after being promised by her mother to aged Wainamoinen, dresses
    in ornaments, wanders toward the sea while naming Tuoni and the realm of the departed,
    tries to join water-maidens, leaves her clothes and jewels on the shore, swims
    to a rainbow-colored rock that sinks, and perishes beneath the blue sea while
    warning family members away from those waters.
  language: English
  quote_policy: quoted
