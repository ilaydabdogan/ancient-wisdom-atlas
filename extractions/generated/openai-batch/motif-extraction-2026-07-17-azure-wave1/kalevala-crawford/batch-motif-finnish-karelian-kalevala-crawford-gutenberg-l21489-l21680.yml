canonical_text:
  quote: ''
  summary: Wainamoinen and companions travel over the sea with the captured Sampo.
    Lemminkainen sings despite Wainamoinen's warning; his harsh song frightens a crane,
    which flies screeching to Northland and awakens its people. Louhi discovers the
    Sampo missing from the copper-bearing mountain and invokes fog, Iku-Turso, and
    Ukko against the fugitives. The fog binds the ship until Wainamoinen clears it
    with a magic sword. A sea-monster then rises, and Wainamoinen seizes and questions
    Iku-Turso, who remains silent.
  language: English
  quote_policy: summarized
