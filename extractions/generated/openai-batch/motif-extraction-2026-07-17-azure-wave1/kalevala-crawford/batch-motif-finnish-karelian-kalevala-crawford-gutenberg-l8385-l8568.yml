canonical_text:
  quote: ''
  summary: 'The passage concludes Lemminkainen''s restoration and return: his mother
    warns him not to kill the swan of Mana for Louhi''s bridal condition and credits
    Ukko with saving him from Tuoni and Manala. The song then shifts to Wainamoinen,
    who lacks timber for a boat. Sampsa Pellerwoinen searches with axe and hatchet,
    questions an aspen, pine, and oak, and fells the suitable oak to make boards and
    ribs for Wainamoinen''s magic vessel.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mother rocks her son to his former being, life, spirit, and greater magic
    powers; the hero becomes wiser and handsomer but remains troubled.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lemminkainen says his sorrow concerns the Northland maidens and Louhi's daughter,
    whom Louhi will not give unless he kills the swan of Mana with one arrow in the
    river of Tuoni.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Lemminkainen's mother tells him to let the swan or water-bird go free in the
    waters of Manala and Tuoni, leave the maiden in the Northland, and return to Kalevala.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mother states that Ukko, the Creator, gave aid, saved Lemminkainen from
    the waters and chambers of Tuoni and Manala, and can revive the dead and dying.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lemminkainen, described as filled with wisdom, travels with his mother to
    his home and kindred in Wainola and Kalevala.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The narrating singer leaves Kaukomieli or Lemminkainen and turns the song
    toward other heroes and another legend.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Wainamoinen works on lumber for a boat on a fog-point and forest-covered island,
    but beams, scantling, ribs, and flooring are lacking.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Pellerwoinen, also called Sampsa, undertakes to seek the needed oak-wood beams
    for Wainamoinen's boat.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Sampsa travels through eastern fields, forests, and Northland mountains with
    a golden axe and a copper hatchet.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: A seven-fathom aspen speaks to Sampsa; after he asks for vessel timber, it
    says boats made from its wood sink and that its trunk is hollow and worm-eaten.
  category: speech
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:11
  text: A fourteen-fathom pine speaks to Sampsa and says its body is unworthy for
