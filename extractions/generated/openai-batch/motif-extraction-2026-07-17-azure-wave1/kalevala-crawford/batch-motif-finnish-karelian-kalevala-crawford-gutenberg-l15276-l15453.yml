canonical_text:
  quote: ''
  summary: Ukko sends storm-clouds and snow into fire, producing a lake; Lemminkainen
    conjures an ice passage and continues toward Pohyola. He bypasses a wolf and bear
    by animating a flock from ewe-wool, breaks a serpent-covered iron and steel wall,
    then confronts a huge serpent at the entry. He commands it with inherited words
    of knowledge and begins recounting its origin from Suoyatar's spittle on the ocean.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ukko sends storm-clouds from several directions and snow from the heights
    into a fire-pit or fire-pond; a lake with rolling billows grows from the snow
    and fire.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lemminkainen conjures an ice passage across the lake and escapes what the
    passage calls his second danger.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lemminkainen drives onward toward Pohyola with a birch-rod and whip until
    his stallion stops and trembles at the sight of a wolf and bear at the portals
    or gate.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Lemminkainen takes ewe-wool from a leather pouch, rubs it to powder, breathes
    life on it, and a flock of dark sheep and goats appears.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The wolf and bear attack the conjured flock while Lemminkainen rushes past
    them on his journey.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At Sariola or Pohyola he finds a fence of molten iron and steel rods, with
    deep and high extensions, double-pointed spears, and serpents, adders, and lizards
    coiled on the spears.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: Lemminkainen recalls that his mother had predicted this wall stretching from
    earth to heaven and extending downward with serpents and rails.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lemminkainen draws his ancestral broadsword, hews the wall and palisade with
    magic, breaks seven pickets, chops the serpent-wall, and passes through the breach.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A huge serpent lies crosswise in the entry, described with many eyes, many
    tongues, large teeth, and a broad back; Lemminkainen does not immediately pass
    through it.
  category: object
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lemminkainen addresses the serpent as a venomous being, asks who sent and
    empowered it, commands it to coil, move aside, or retreat, and threatens that
    Ukko will destroy its raised head with iron weapons.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The serpent ignores the command, hisses angrily, and attacks Lemminkainen's
    head with its venomous mouth.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Lemminkainen speaks master-words of knowledge from distant ages, taught by
    ancestors and learned by his mother, and threatens to burst the serpent and sing
    its origin.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Lemminkainen names Suoyatar as the serpent's ancient mother and creator; the
    passage begins an origin account in which her spittle falls on the ocean, is rocked
    by winds, currents, and waves for years, softened by sunshine, and washed to shore.
  category: sequence
  evidence_refs:
  - ev:10
