canonical_text:
  quote: ''
  summary: Youkahainen becomes angry and envious of Wainamoinen's fame as a singer,
    rejects parental warnings, and travels by sledge to confront him. The two collide
    on the road. After disputing identity, age, and right-of-way, Youkahainen challenges
    Wainamoinen to a contest of singing, legends, and wisdom. Youkahainen recites
    practical and natural knowledge, but Wainamoinen dismisses it and asks instead
    for the story of creation and the world's beginning.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Youkahainen grows angry and envious of Wainamoinen, who is famed as a sweeter
    singer, and vows to go to Wainola/Northland to vie with him as a bard.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The father tells Youkahainen not to go to Kalevala.
  category: speech
  evidence_refs:
