  text: The mother tells Youkahainen not to go to Wainamoinen and warns that Wainamoinen
    may charm, bewitch, dishonor, sink, or freeze him by singing.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Youkahainen says his own decision is best and declares that he will challenge
    Wainamoinen with songs, legends, and wisdom.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Youkahainen claims his songs will transform Wainamoinen with flint-stone feet,
    oak raiment, a stony burden, a marble bow, a flint-stone gauntlet, and a stony
