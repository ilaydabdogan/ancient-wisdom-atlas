canonical_text:
  quote: ''
  summary: A bridal counsel passage instructs the bridegroom on how to treat and instruct
    the bride, includes an old gray-bearded beggar's hearthside advice based on his
    own marriage, and then presents the Rainbow-maiden, bride of Ilmarinen, weeping
    at her departure from her Northland home, thanking her family and childhood household,
    and reassuring them that celestial lights shine on other homesteads too.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The opening counsel tells the husband not to reproach the bride for humble
    birth or for her father's status, and states that her relations are honored.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The husband is told not to treat the bride unkindly, not to use servant-like
    lashes or leather thongs, and to stand before her as protection from chiding or
    offense by parents, guests, or servants.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Further counsel prescribes private instruction over three years, followed
    by escalating measures involving a reed, nettle, willow, or birch-rod if the wife
    does not heed instruction.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The counsel says to hide the rod from strangers, show it privately, avoid
    public punishment, and avoid striking the forehead, ears, or face where marks
    could be noticed by family or villagers.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: A gray-bearded beggar lying by the fire-place and hearth-stone speaks to the
    hero-husband and says his own wife was dissatisfied despite purchased food and
    drink.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old man says his wife tore his hair and scolded him, and that she spoke
    affectionately or kissed him when he cut or threatened her with birch, juniper,
    willow, or a lash.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bridegroom is said to have been instructed and to have received the last
    advice.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Maiden of the Rainbow, bride of Ilmarinen, sighs, moans, weeps, and states
    that separation and departure from her Northland home are near.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The bride says the parting bowl is empty, the farewell-beer is taken, and
    her husband's sledge waits at her father's dwelling looking southward.
  category: object
  evidence_refs:
  - ev:5
- id: obs:10
  text: The bride asks how to repay the kindness, counsel, friendship, and affection
    of mother, father, brother, and sister, and gives gratitude to family, servants,
    friends, and playmates.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The bride tells her father, mother, and kindred not to harbor sorrow or weep
    because she has gone to strangers, and says the sun, moon, and stars shine as
    brightly on other homesteads.
  category: speech
  evidence_refs:
  - ev:7
