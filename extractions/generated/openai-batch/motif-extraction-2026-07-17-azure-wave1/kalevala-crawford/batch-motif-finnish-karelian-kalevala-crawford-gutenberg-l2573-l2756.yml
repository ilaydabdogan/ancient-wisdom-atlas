canonical_text:
  quote: ''
  summary: Youkahainen tells his mother that he has promised his sister Aino to Wainamoinen.
    The mother rejoices, but Aino weeps over the loss of youth, adornment, and household
    life implied by marriage. After her mother attempts to console her, Aino goes
    to the forest, meets Wainamoinen, refuses his demand that she wear her ornaments
    for him, throws away her adornments, and returns home weeping to her father, brother,
    and sister.
  language: English
  quote_policy: summarized
