  text: The mother asks Youkahainen why he is weeping and heavy-hearted.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Youkahainen says his sorrow is that he has promised Aino, his sister and his
    mother's daughter, to Wainamoinen as a bride and companion.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The mother responds joyfully and says she had hoped and prayed that Wainamoinen
    would become Aino's spouse and her own son-in-law.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Aino weeps on the threshold for several days because sorrow has fallen on
    her youthful heart.
  category: action
  evidence_refs:
