- id: obs:5
  text: The mother describes the suitor as noble and says Aino would rule his dwelling
    and live there as a queen.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Aino says she must loosen her golden tresses, cease wearing jewels and ribbons,
    and hide her hair under the linen bonnet worn by a wife.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Aino laments waning beauty, vanished childhood, departed youth, and separation
    from her father's cottage and siblings' work spaces.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The mother argues that sunshine, moonlight, flowers, berries, meadows, and
    mountains exist in other households and places as well as in Aino's family home.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: After night passes, Aino goes early to the forest to gather birchen shoots
    and tassels for brooms and family use.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: As Aino leaves the birchen woodland, Wainamoinen sees her and tells her to
    wear her cross, pearls, tresses, and braidlets for him rather than for others.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Aino answers that she wears the crosslet and hair ribbons neither for Wainamoinen
    nor for others, rejects trinkets, and says she would rather live simply with her
    parents.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Aino throws away her gold cross, jewels, necklace, and silken ribbons into
    the forest ferns and flowers, then goes to her mother's cottage.
  category: action
  evidence_refs:
  - ev:7
