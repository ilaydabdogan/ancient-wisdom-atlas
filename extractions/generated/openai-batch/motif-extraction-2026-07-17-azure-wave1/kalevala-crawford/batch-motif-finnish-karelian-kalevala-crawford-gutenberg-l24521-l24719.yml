canonical_text:
  quote: ''
  summary: Wainamoinen asks Ilmarinen to forge magical implements to uncover the Sun
    and Moon from Pohyola’s mountain-cavern. Louhi, in eagle form, visits the forge,
    hears Ilmarinen threaten to bind her, returns to Pohyola, and unlocks the place
    where the Sun and Moon are hidden. She then changes into a dove and announces
    their release. Ilmarinen and Wainamoinen see the restored sunshine and moonlight;
    Wainamoinen greets the freed celestial bodies and asks the Sun to continue its
    daily course for communal prosperity. The passage then begins the Mariatta section,
    introducing her as a beautiful, guarded virgin maiden in a pastoral Northland
    setting.
  language: English
  quote_policy: summarized
