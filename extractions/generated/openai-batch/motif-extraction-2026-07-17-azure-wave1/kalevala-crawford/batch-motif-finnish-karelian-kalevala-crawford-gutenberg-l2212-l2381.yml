canonical_text:
  quote: ''
  summary: Youkahainen answers Wainamoinen with natural lore, then claims primeval
    creative deeds and presence at the making of heaven and celestial bodies. Wainamoinen
    rejects the claims as lies. Youkahainen challenges him to sword combat and threatens
    magical transformation by singing. Wainamoinen instead sings powerful enchantments
    that shake the landscape, transform Youkahainen’s possessions into natural and
    celestial forms, and sink Youkahainen into quicksand until his foot turns to flint.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Youkahainen lists natural and origin lore, including statements about birds,
    serpents, fish, iron, water, fire, mountains, trees, and household objects.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wainamoinen asks whether Youkahainen can offer wisdom and calls the preceding
    answer nonsense.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Youkahainen claims that he performed primeval acts involving seas, islands,
    caverns, lakes, mountains, and rocks, and says he was present when the heavens
    and celestial bodies were formed.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wainamoinen calls Youkahainen a liar and denies that Youkahainen existed or
    was present for the primeval events he described.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: After failing in wisdom, Youkahainen offers battle with swords and broadswords.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Wainamoinen says he does not fear Youkahainen’s sword, wisdom, prudence, or
    cunning, but refuses to measure broadswords with him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Youkahainen threatens to transform anyone who fears to test blades into a
    wild boar or swine by singing, and to hurl and stamp such cowards into mire and
    stable-rubbish.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wainamoinen grows angry, composes himself, and begins wondrous singing of
    heroic matters rather than children’s tales.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Wainamoinen’s singing causes mountains, rocks, cliffs, the ocean, and distant
    hills to tremble, break, heave, tumble, and echo.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Youkahainen is transfixed in wonder while his sledge, gear, horse, whip, sword,
    crossbow, arrows, dog, cap, gauntlets, clothing, and girdle are sung into other
    natural, animal, or celestial forms.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Wainamoinen sings Youkahainen into quicksand, where he sinks to his belt in
    mud and water and recognizes the folly of his journey and contest.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Youkahainen cannot move his feet; his left foot is found turned to flint-stone.
  category: action
  evidence_refs:
  - ev:10
