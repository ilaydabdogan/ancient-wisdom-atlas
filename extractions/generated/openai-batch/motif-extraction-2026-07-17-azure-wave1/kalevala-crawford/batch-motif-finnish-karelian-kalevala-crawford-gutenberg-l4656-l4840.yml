canonical_text:
  quote: ''
  summary: The passage narrates Iron fleeing from Fire, hiding in marsh and water
    places, being found by Ilmarinen, and undergoing smelting, oath-making, forging,
    and tempering. Ilmarinen tries to harden iron into steel with birch-ash lye and
    then seeks honey from a bee, but a hornet brings venom and stings into the tempering
    mixture.
  language: English
  quote_policy: summarized
