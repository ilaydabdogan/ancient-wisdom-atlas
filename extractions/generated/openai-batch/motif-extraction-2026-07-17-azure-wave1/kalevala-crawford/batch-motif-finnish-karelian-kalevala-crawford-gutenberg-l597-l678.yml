  claim: The passage explicitly compares Manala or Tuonela with Scandinavian Helheim
    as an underworld corresponding to the upper world.
  claim_level: same_function
  target: Helheim of Scandinavian mythology
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
