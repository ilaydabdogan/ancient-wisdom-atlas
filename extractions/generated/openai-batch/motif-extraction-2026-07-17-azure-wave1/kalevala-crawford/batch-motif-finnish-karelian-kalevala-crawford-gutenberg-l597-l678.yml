    sailing to win the mystic maiden of Sariola.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The hero searches unsuccessfully in the brain of a white squirrel and in the
    mouth of a dying white swan, then journeys to Tuoni and to the grave of Antero
    Wipunen, where he finds the lost words.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage describes spirits of the dead as remaining in graves until bodily
