- id: claim:2
  claim: The passage compares Tuoni with the original conception of Hades as a leader,
    counsellor, guardian, and ruler of the dead.
  claim_level: same_function
  target: Hades in Greek mythology
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is explicitly authorial and limited to the functions
    named in the passage.
- id: claim:3
  claim: The river of Tuoni is described as a Finnish Styx, and the daughter who ferries
    Wainamoinen is compared to Charon.
  claim_level: same_function
  target: Styx and Charon in Greek mythology
  evidence_refs:
  - ev:3
  - ev:6
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage supports functional analogy of underworld river and ferrying,
    but not historical contact.
- id: claim:4
  claim: The passage draws an analogy between the third daughter of Tuoni seated on
    Kipu-Kivi and Kali sitting in judgment on the dead.
  claim_level: visual_similarity
  target: Kali in Hindu mythology
  evidence_refs:
