canonical_text:
  quote: ''
  summary: Untamoinen finds Kullervo's threshing ruined, condemns his work, and sells
    him to the blacksmith Ilmarinen for worn implements. In Ilmarinen's household,
    Kullervo is assigned to herd cattle. Ilmarinen's wife gives him a loaf with a
    flint hidden inside and sends the cattle to forest and mountain pastures while
    invoking the Creator, Ukko, trees, woodland maidens, and other nature powers to
    protect and feed the herd, preserve its milk, and keep it from danger and Manala.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Untamoinen goes in the evening to inspect Kullervo's threshing and finds the
    rye, barley, and straw ruined.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Untamoinen says Kullervo is a failed workman whose work is ruined by witchcraft
    and proposes selling him to Ilmarinen.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Untamoinen sells Kullervo in Karyala to the blacksmith Ilmarinen for worn
    sickles, old caldrons, scythes, hoes, and axes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kullervo is described as a wizard-servant, purchased slave, and magic son;
    he asks Ilmarinen and the hostess for work.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ilmarinen's wife makes Kullervo a shepherd and keeper of her pastures.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: The wife bakes a thick loaf with oatmeal below, barley above, a flint-stone
    in the center, and liquid butter around it, then gives it to Kullervo with instructions
    not to eat until the herd is in the woods.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The wife sends the cattle toward birches, aspens, forest pastures, hills,
    mountains, glens, lowlands, pine forests, and thickets.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: The wife invokes the Creator and Ukko to guard, shield, shelter, and protect
    the cattle from danger and wandering.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The wife asks pastures, alders, birch, willow, aspen, linden, and creation's
    daughters to act as protectors or substitute herdsmen if human keepers fail.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The wife names Summer-daughter, the southern mother of the woodlands, Kateyatar,
    Pihlayatar, Tapio's daughter, Millikki, and Tellervo as protectors of the herds.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: The wife asks the Summer-daughter or southern mother to spread protective
    robes and an apron over the forest and cattle and to guard them from winds, storms,
    wild beasts, swamps, springs, running waters, whirlpools, and marshes.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The wife asks for a bugle, a shepherd's horn from heaven, Ukko's honey-flute,
    and magical pipes to charm the hills, valleys, mountains, forest borders, trees,
    and fountains.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: The wife asks that the herds be fed and watered on honeyed pastures, golden
    grasses, silver saplings, life-giving waters, crystal waters, waterfalls, uplands,
    glens, and golden fountains, so that the cows' udders swell and milk flows without
    being wasted or given to Manala.
  category: speech
  evidence_refs:
  - ev:12
