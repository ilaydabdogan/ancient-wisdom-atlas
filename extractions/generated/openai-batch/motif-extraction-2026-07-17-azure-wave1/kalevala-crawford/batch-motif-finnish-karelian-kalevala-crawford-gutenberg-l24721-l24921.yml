canonical_text:
  quote: |-
    Thus became a bride impregnate,
    Wedded to the mountain-berry;
  summary: Mariatta, a virgin shepherd-maid, hears a mountain-berry call to her, takes
    it by means of a charm-stick, and the berry enters her body. She becomes pregnant,
    is rejected by her mother and father, foretells that her unborn son will be an
    immortal hero who will rule Wainamoinen, and sends her servant Piltti to seek
    a birth-place from Ruotus near the Sara-streamlet.
  language: English
  quote_policy: quoted
