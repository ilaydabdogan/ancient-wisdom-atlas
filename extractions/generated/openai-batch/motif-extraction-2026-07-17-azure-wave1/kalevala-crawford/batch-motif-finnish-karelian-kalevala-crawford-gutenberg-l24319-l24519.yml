canonical_text:
  quote: ''
  summary: Wainamoinen cannot get the ferry-maiden to answer, makes a fire by the
    river, and is noticed by Louhi and her people. Refused a skiff, he changes into
    a pike and crosses into Pohyola. In Louhi's halls he confronts armed Northland
    heroes, declares that he has come to seek the hidden Sun and Moon, defeats the
    heroes with his magic sword, and searches the copper-bearing mountain. He finds
    a many-colored stone pillar with nine bolted portals, a crevice of sunlight, and
    serpents drinking beer within; he kills the serpents but cannot open the portals.
    He returns home and says greater means are needed to free the sunshine and moonlight.
  language: English
  quote_policy: summarized
