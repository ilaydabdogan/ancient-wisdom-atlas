canonical_text:
  quote: ''
  summary: A bridal admonition and lament unfolds. An ancient maid tells the young
    bride that married life will bring labor, domestic duties, hidden wisdom, and
    ritual weeping. The bride weeps and compares her sorrow to cold water and heavy
    burdens. A child by the stove consoles her, describing her husband Ilmarinen as
    protector, provider, metal-master, hunter, and hero, and urges her to go homeward
    with him.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The bride is told that as a wife she must weep and labor, tend the fire and
    oven, prepare her husband's dinner, and direct her master's servants.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride is told to search for hidden wisdom in perch, salmon, ocean whiting,
    and the cuckoo, since such knowledge cannot be learned from her mother.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The instruction asks where human instincts, heroic minds, maidenly beauty,
    beautiful tresses, and springtime renewal originate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The bride is repeatedly urged to weep sincerely and profusely, with tears
    described as rivers, floods, lakelets, and overflowing rooms.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The bride is warned that insufficient weeping now will lead to later weeping
    when she returns to see father, mother, brother, and sister in diminished or injured
    conditions.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: After the ancient maid finishes, the young bride sighs, weeps bitterly, and
    speaks sorrowfully to her sisters and childhood companions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The bride says she had expected pleasure and cuckoo-like singing, but instead
    compares herself to a songless blue-duck swimming on a cold ocean with icicles
    on her wings.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The bride addresses her father and mother, asking where they wish to lead
    or take her so that sorrow may pass and grief become gladness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The bride says it would have been better if her mother had nursed a birch-wood
    block or clothed colored sandstone rather than rear her into such sorrow.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The bride rejects claims that she is ungrateful, saying her troubles exceed
    pebbles, willows, and berries and are too heavy for a Pohya plow-horse or Northland
    reindeer to draw.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A babe by the stove speaks and tells the bride to leave her troubles to elk-herds,
    fillies, steeds, and horses because they have bodies made for bearing burdens.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The child says the bride is not being led to swamps or riverbanks, but to
    fields of flowers, fruitful trees and forests, and from the beer of Pohya to the
    sweeter mead of Kalew.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: The child says Ilmarinen waits beside the bride as husband, constant friend,
    and protector, with steed, harness, and birds ready for the wedding march.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:14
  text: The child praises Ilmarinen as a noble husband, metal-master, provider, fish-catcher,
    elk-hunter, bear-killer, and mighty hero, and urges the bride to hasten homeward
    with him.
  category: speech
  evidence_refs:
  - ev:8
