canonical_text:
  quote: ''
  summary: Lemminkainen captures the Hisi-moose with oak and willow bindings, but
    after he wishes to linger with a maiden the moose warns him and escapes. His renewed
    pursuit breaks his snow-shoes, snow-staff, and javelins. In the next rune he considers
    whether to continue the hunt, then prays to Ukko and forest powers including Tapio,
    Nyrikki, Mielikki, and Tapio's daughter for aid, guidance, and access to the forest's
    game. He journeys through Hisi and Lempo territories, climbs Big-stone mountain,
    and sees Tapio's golden-doored mansion.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lemminkainen advances rapidly on snow-shoes, reaches the wild-moose, and uses
    an oak pole and willow bark-strings to bind it to an oaken hurdle.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: He addresses the captive animal as the moose of Juutas and as a captive from
    Piru and the Hisi glens and mountains.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: After stroking and patting the captured moose, Lemminkainen says he would
    like to rest in the cottage of his maiden or virgin.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Hisi-moose becomes angry, stamps, shakes its antlers, and tells Lemminkainen
    that Lempo will get him if he sits beside or lingers by the maiden.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The wild-moose tears apart the willow bands, breaks the oak pole, overturns
    the hurdle, and escapes beyond the hunter's sight and hearing.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Lemminkainen resumes the pursuit, but his snow-shoe, javelins, and snow-staff
    break while the moose remains out of reach in Hisi woods and snow-fields.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Kaukomieli looks at the fragments of his gear and warns Northland hunters
    not to defy the Hisi forests by hunting the moose of Juutas as he did.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: At the opening of Rune XIV, Lemminkainen considers leaving the moose in Hisi
    or hunting it a third time so that he may return victorious to Louhi's forest
    home.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Lemminkainen supplicates Ukko, called God above and Creator of the heavens,
    to repair and quicken his snow-shoes for travel through Hisi, Lapland, Lempo's
    moose-paths, Juutas, and Tapiola.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: He greets mountains, vales, fir-trees, aspen groves, fields, streams, and
    woods of Lapland, and asks Tapio for favor to search the snow-fields where wild-moose
    and reindeer linger.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: He asks Nyrikki, son of Tapio and mountain hero with scarlet head-gear, to
    make notches and landmarks so the hunter will not wander, fall, and perish while
    hunting the moose of Hisi as dowry for the pride of Northland.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: He asks Mielikki, mistress of the woods and forest-mother, for silver keys
    from her golden girdle so that Tapio's chambers and the forest fortress may be
    opened while he hunts the moose of Lempo.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: He says that if the service is too menial for Mielikki, she should order her
    servants and maidens, who tend the herds and game of her dominions.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:14
  text: He asks the forest-virgin, Tapio's beloved daughter, to play honey flute-notes
    and a forest-whistle so the woodland mistress will awaken.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Lemminkainen prays while journeying through fields, moorlands, brushwood,
    Hisi's colliery, and Lempo's burning fields, then climbs Big-stone mountain and
    sees Tapio's golden-doored mansion toward Northland.
  category: sequence
  evidence_refs:
  - ev:11
