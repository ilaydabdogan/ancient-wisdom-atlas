canonical_text:
  quote: ''
  summary: 'Kalervo reproves Kullervo for destructive rowing and then for ruining
    a fishing task. Kullervo is sent to pay tribute and returns by snow-sledge. On
    the return journey he meets three maidens and invites each into his sledge; the
    first two refuse with death-world taunts, and the third initially refuses. Kullervo
    draws the third maiden into the sledge, shows her treasure and finery, and they
    travel through the evening and night. At dawn they exchange lineage: Kullervo
    identifies himself as Kalervo''s son, and the maiden identifies herself as Kalervo''s
    long-lost daughter.'
  language: English
  quote_policy: summarized
