- id: obs:4
  text: The bride is described standing near the bridegroom, under his protection,
    and able to keep the home, spin linen, weave fabrics, and make clothing.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bridegroom is told to forge a scythe and take the bride to the lowlands
    and meadows for mowing, raking, and haymaking in summer sunshine.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At weaving time, the bridegroom is told to give the bride spools and shuttles
    so that her weaving can be heard in the village and identified as the work of
    his beloved bride.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: The bride's weaving and spinning are compared to the weaving or spinning of
