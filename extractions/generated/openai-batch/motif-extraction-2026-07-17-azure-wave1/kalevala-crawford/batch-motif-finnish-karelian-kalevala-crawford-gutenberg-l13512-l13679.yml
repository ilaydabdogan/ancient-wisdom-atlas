  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: When traveling with the Rainbow-daughter, the bridegroom is told not to lead
    her into unfrequented places, border copses, briers, brambles, marshes, rocks,
    or rubbish.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The counsel contrasts the bride's former treatment in her parents' dwelling
    with rough or neglectful treatment in the bridegroom's household.
  category: relationship
  evidence_refs:
  - ev:7
  - ev:8
  - ev:10
- id: obs:10
  text: The bridegroom is told never to let his wife suffer, be neglected, sit in
    darkness, or remain unattended.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The bridegroom is told not to lead the bride to a mortar for making food from
    sea-grass, bark, stubble, or tan-bark, but instead to abundant garners for barley,
    flour, beer, and honey-biscuits.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: If the wife becomes unhappy, the bridegroom is instructed to harness a racer,
