canonical_text:
  quote: ''
  summary: In a wedding-counsel passage, Osmotar addresses Ilmarinen and instructs
    him how to value and treat the Maiden/Bride of the Rainbow. The counsel emphasizes
    praise of the bride, textile work, haymaking, careful travel, protection from
    neglect and hardship, proper household provisions, return to the bride's natal
    household if she is unhappy, and reciprocal welcome from her kin if she is treated
    well.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Osmotar is identified as a bride-instructor and gives counsel to the wedding
    guests and to the bridegroom, Ilmarinen.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Osmotar calls the bride the Maiden of the Rainbow, Bride of Beauty, and Ilmarinen's
    life-companion, and tells the bridegroom to praise her sincerely.
  category: speech
  evidence_refs:
  - ev:1
  - ev:2
- id: obs:3
  text: The bride is described as bestowed by Ukko or God.
  category: relationship
  evidence_refs:
