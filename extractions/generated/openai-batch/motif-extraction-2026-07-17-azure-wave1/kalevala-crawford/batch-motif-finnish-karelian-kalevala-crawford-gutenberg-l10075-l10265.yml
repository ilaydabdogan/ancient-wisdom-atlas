canonical_text:
  quote: ''
  summary: Wainamoinen and Ilmarinen travel toward Pohyola by magical vessel and horse-drawn
    sledge. Watch-dogs alert the Northland household; the master investigates and
    sees the approaching strangers. The hostess has her daughter test their intent
    by burning a sorb-branch with magic fire. The expected omens are scarlet drops
    for war or water for peace, but honey appears, which Suowakko interprets as a
    sign that the strangers are friends and suitors. The hostess identifies Wainamoinen
    as a treasure-bearing suitor and Ilmarinen as a wisdom-bearing but empty-handed
    suitor, then instructs the daughter to give food and drink to the man she would
    follow.
  language: English
  quote_policy: summarized
