canonical_text:
  quote: ''
  summary: Lemminkainen's mother retrieves his dismembered body from the waters and
    caverns of Tuonela and Manala, reconstructs his body, invokes Suonetar, a celestial
    maiden, and God for bodily repair, and partially restores him to life. Because
    speech and senses remain absent, she sends a bee first to forest meadows and then
    across seven oceans to an enchanted island to gather honey-balsam with stronger
    healing power.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lemminkainen's mother does not cast the dead onto the waters but rakes the
    river, the streams of Tuonela, and the pools and caverns of Manala.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: She recovers body fragments including half a head, a fore-arm, a hand, half
    the backbone, and smaller portions.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: She shapes Lemminkainen anew from the fragments by placing flesh, bones, members,
    vessels, and venules together.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The mother prays to Suonetar, described as a virgin, goddess of heroes' veins,
    and spinner of vessels, asking her to knit veins and venules in the wounds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mother calls on a maiden living in the ether in a silver and copper boat
    to row through the lifeless members and body channels, set vessels and heart in
    place, and sew wounds with a silver needle and silken thread.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mother invokes an all-knowing God to come swiftly in a scarlet sledge
    with a courser, drive through lifeless tissues and vessels, bind flesh and bones,
    and place silver and gold in joints and fissures.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The prayer asks for broken skin, torn veins, lost blood, broken bones, loosened
    flesh, and body parts including bone, vein, nerve, sinew, heart, brain, gland,
    and vessel to be healed.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The mother's means join the lifeless members, heal death-like tissues, restore
    her son to his former life and likeness, and fasten his veins and parts, but he
    remains without speech and senses.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The mother seeks balsam and magic honey to anoint Lemminkainen so that his
    mouth may open and he may sing and speak incantations again.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The mother sends a bee to gather honey from Metsola's gardens and Tapio's
    meadows; the bee returns with balsam, and the mother anoints the hero, but the
    balm is insufficient because he remains deaf and speechless.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The mother sends the bee across seven oceans to an eighth magic island, to
    Turi-castles and the chambers of Palwoinen, for enchanted honey and wonder-working
    balsam to restore the hero's senses.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: The bee flies over seven oceans for three days without resting and reaches
    an ocean island with honey-rich meadows, a cataract and fire-flow, a sacred stream,
    and a whirlpool.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: On the island, magic honey-balm distills in tiny earthen vessels and copper
    kettles; the bee gathers enchanted honey from Turi-cuplets and returns carrying
    vessels filled with honey-balsam.
  category: sequence
  evidence_refs:
  - ev:12
