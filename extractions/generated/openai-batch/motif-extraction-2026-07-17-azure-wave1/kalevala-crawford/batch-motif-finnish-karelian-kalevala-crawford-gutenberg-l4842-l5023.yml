canonical_text:
  quote: |-
    This, the origin of iron,
    And of steel of light blue color.
  summary: The passage recounts Ilmarinen forming steel from iron with water he believes
    has been sweetened by honey but that is mixed with poisons. The hardened iron
    becomes dangerous and wounds Wainamoinen. A gray-bearded speaker recites and curses
    the origin of iron, commands the flowing blood to stop by magic, threatens further
    ritual measures, and invokes Ukko to heal the wound and save Wainamoinen.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Ilmarinen is introduced as a skilful blacksmith and first of the iron-workers,
    and he believes a bee has brought honey from flowers to help water form steel
    from iron.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ilmarinen dips iron into water mixed with many poisons, thinking it is wild
    bees' honey, and thus forms steel from iron.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The hardened iron is said to grow angry, break its vow, cut its brother, rage
    against kindred, and cause blood to flow from wounds.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A gray-bearded figure rises from the hearth, says he knows the source of iron
    and steel's evils, and curses iron and steel.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker says iron once rested as milk in the breasts and bosoms of Gods'
    three daughters in the heavens.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker also describes iron as water or formless rusty matter resting
    on marshes and mountains, trampled or scratched by moose, roebuck, wolves, and
    bear-paws.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ilmarinen brought iron from blackened swamp-lands to his smithy and furnace,
    where the iron gave an oath by the furnace, anvil, tongs, hammer, dwelling, and
    fire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The speaker says iron has broken its pledges, denies that its family gave
    it malice, blames iron itself, and commands it to view and amend the damage.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speaker commands the crimson streamlet and blood from Wainamoinen's wounds
    and veins to cease flowing and stand still by magic.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The speaker orders the blood to remain in Wainamoinen's inner circuit, bones,
    muscles, organs, veins, and heart rather than staining grass, flowers, and hills.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: If the blood does not heed the magic order, the speaker says he will call
    the Hisi irons and boil or roast it to check the flow and save the wounded hero.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: If those measures fail, the speaker says he will call Ukko, then prays for
    Ukko to touch and bind the wound with healing fingers, leaflets, and flowers to
    save Wainamoinen.
  category: speech
  evidence_refs:
  - ev:12
