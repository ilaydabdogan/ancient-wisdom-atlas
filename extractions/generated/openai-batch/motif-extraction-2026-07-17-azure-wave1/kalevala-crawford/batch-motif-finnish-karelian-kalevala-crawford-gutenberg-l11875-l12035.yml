  evidence_refs:
  - ev:7
- id: obs:8
  text: Wainamoinen says that since no other bard appears, he will sing legends and
    his store of wisdom, stating that he was created a bard and born an orator and
    singer.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Wainamoinen begins songs of pleasure and ancient wisdom-sayings, making the
