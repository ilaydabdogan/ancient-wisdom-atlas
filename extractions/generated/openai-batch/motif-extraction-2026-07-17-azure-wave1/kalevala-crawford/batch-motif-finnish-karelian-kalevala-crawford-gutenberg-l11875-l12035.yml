  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: After his wonder-tales, Wainamoinen says his own worth, power, and singing
    are little compared with Ukko, his Creator.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Wainamoinen describes Ukko as able to sing floods, sands, pebbles, waters,
