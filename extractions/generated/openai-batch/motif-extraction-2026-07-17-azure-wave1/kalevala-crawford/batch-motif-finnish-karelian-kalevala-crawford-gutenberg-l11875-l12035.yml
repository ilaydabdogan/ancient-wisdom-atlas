  evidence_refs:
  - ev:1
- id: obs:2
  text: Wainamoinen urges that the beer not be consumed in silence and calls for heroes,
    the hostess, the bridegroom, and the gathered guests to sing the beer's virtues.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A small boy sitting on the floor volunteers to sing simple stories because
    the elder minstrels, heroes, and hostess do not begin singing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: An old gray-beard reclining near the fire says it is not the time for children's
    singing and assigns songs, incantations, and primeval tales to ancient wizard-singers
    and Wainamoinen.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
