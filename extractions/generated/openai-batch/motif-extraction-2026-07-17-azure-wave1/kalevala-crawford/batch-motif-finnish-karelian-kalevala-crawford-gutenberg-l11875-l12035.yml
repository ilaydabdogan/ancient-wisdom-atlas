canonical_text:
  quote: ''
  summary: At a festive gathering after the guests drink barley beer, the drink is
    personified and Wainamoinen calls for song. A child offers to sing, an old man
    rebukes child-singing and recalls his own former skill, and Wainamoinen takes
    up the role of bard. He performs ancient wisdom-songs that amaze the guests, then
    states that his own power is small beside Ukko, the Creator, whose perfected singing
    could transform natural things into food, wealth, livestock, and garments.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The guests partake of wondrous barley beer, and the beer is said to speak
    merrily through the tongues of magicians, heroes, and Wainamoinen.
