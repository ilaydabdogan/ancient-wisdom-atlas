canonical_text:
  quote: ''
  summary: A first-person young wife recounts leaving for her husband's household,
    encountering a wealthy but hostile dwelling, laboring for the husband's mother
    while being deprived and blamed, lamenting her fate through tree and animal images,
    and finally being attacked by her angry husband with a willow branch and alder
    club.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker hastens through other fields and describes elm-trees, aspens,
    willows, and the forest as if they wound, cut, seize, and slay her.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker journeys to her husband, travels to his dwelling, and is conducted
    to his mother.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The husband's household is described as large and wealthy, with pine-wood
    compartments, twelve chambers, garrets, fields, grain, gold, silver, and other
    treasures.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: After the speaker's hand is given, the cabin and its surroundings are described
    as hostile, with angry bushes, disfavoring glens, troubled walks, evil-tempered
    forests, and many unkind words.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker tries to merit praise and kindness, is led to the cottage, gathers
    chips, and knocks her head against the low portals of the dwelling.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the door and partition are hostile eyes and strangers; mouths stream fire,
    tongues send out sparks, and the second father is marked by unkind eyes.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: The speaker lives humbly in the homestead, rises early like a servant, and
    still cannot win kindness, love, or honor.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The speaker turns the millstone and grinds flour and barley so that the husband's
    mother may be fed from platters and table.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The speaker herself eats siftings, moss loaves, river water, and poor fish,
    and says she never receives fish or biscuit from the second mother's fingers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The speaker gathers blades in summer and barley-stalks in winter, and receives
    the heaviest or largest threshing, shore, and haying tools.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: The household blames and derides the speaker with unkind words compared to
    hail, lightning, and spring hail.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The speaker says the old-one spoiled her temper and that her husband became
    a wild-bear and a savage wolf of Hisi.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: The speaker weeps, remembers her childhood, father's fireside, and mother's
    cottage, and addresses her mother with an image of a bud or scion grafted in a
    bad place.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The speaker says she deserved a better dwelling and a loving, stronger husband,
    then describes her suitor and husband with shoe, raven, jackdaw, black-wolf, and
    wild-bear imagery.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: The speaker imagines that, had she known her affianced was a source of pain
    and evil, she would have become a pine-tree, linden, earth, loam, birch knots,
    and aspen trunks.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The husband hears the speaker's song and wail, comes to her chamber in anger,
    carries a willow branch and an alder club, strikes at her, and aims at her forehead.
  category: action
  evidence_refs:
  - ev:10
