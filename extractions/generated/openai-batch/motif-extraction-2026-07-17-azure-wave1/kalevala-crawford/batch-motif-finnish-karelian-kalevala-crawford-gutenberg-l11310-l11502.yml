canonical_text:
  quote: This the origin of brewing / Beer from Kalew-hops and barley;
  summary: A bee retrieves honey from island honey-fields; Osmotar and Kapo mix honey
    into beer, which ferments, overflows, and gains fame. Louhi, hostess of Pohyola,
    brews beer and prepares food for the wedding feast of the Maiden of the Rainbow
    and Ilmarinen. Smoke from the brewing fire is mistaken for battle smoke before
    Lemminkainen learns its source. The stored beer speaks, calling heroes to drink
    and sing songs of wisdom.
  language: English
  quote_policy: quoted
