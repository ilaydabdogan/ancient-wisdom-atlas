canonical_text:
  quote: ''
  summary: Fragments of the Sampo wash toward Wainola. Wainamoinen sees the fragments
    as the beginning of seed-grain, good fortune, resources, and agricultural prosperity.
    Louhi threatens to hide moonlight and sunlight, send frost, iron hail, a bear,
    and diseases against Kalevala; Wainamoinen answers by invoking God/Ukko and denying
    her power over the lights. Louhi returns to Pohyola with worthless Sampo fragments,
    and the passage attributes Northland poverty and famine to this loss. Wainamoinen
    gathers Sampo relics and prays to Ukko for peace, plenty, protection, and a fortified
    boundary. The next rune opens with Wainamoinen lamenting his lost fish-bone harp
    at the sea bottom and asking Ilmarinen to forge a great iron-and-copper rake to
    recover it; Ilmarinen forges the rake, and Wainamoinen takes it toward two ships.
  language: English
  quote_policy: summarized
