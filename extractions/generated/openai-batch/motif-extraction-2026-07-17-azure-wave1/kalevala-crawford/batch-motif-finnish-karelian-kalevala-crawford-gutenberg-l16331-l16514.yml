canonical_text:
  quote: ''
  summary: Lemminkainen is driven by winds and waves across the ocean to the Isle
    of Refuge, where island maidens greet him, answer his requests for harbor, hiding-place,
    land, and a place to sing, and then witness his magical singing. He conjures trees,
    birds, metals, gems, flowers, water sources, a duck, banquet vessels, food, drink,
    and a silver-and-gold knife before feasting and charming the maidens.
  language: English
  quote_policy: summarized
