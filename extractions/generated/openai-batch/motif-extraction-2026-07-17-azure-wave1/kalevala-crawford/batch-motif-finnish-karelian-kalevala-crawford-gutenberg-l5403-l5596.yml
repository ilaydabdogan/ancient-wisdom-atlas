canonical_text:
  quote: I will forge for thee the Sampo
  summary: Wainamoinen magically sends Ilmarinen by storm-wind to Pohyola/Sariola.
    Louhi recognizes him as the expected smith, prepares her daughter, hosts Ilmarinen,
    and asks him to forge the Sampo from specified materials in exchange for the daughter.
    Ilmarinen agrees, citing his earlier forging of heaven and air. Finding no forge,
    he builds one on a rainbow-colored stone; after days and nights of furnace-work,
    a beautiful but violent crossbow emerges, which he destroys and returns to the
    furnace while continuing to try to forge the Sampo.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Wainamoinen sings a storm-wind into fury and commands it to carry the forgeman-hero
    to the dark Northland/Sariola.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The storm-wind makes a sailing vessel of air, takes Ilmarinen from fir-tree
    branches, and carries him northward through the sky until he reaches Pohyola/Sariola
    without being noticed by hunters or watch-dogs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Louhi questions the stranger who arrived on the storm-wind, says Ilmarinen
    has long been expected to forge the Sampo, and Ilmarinen identifies himself as
    that smith.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Louhi tells her youngest and fairest daughter to dress and adorn herself because
    Ilmarinen has come to forge the Sampo; the daughter puts on rich clothing and
    ornaments and waits in the hall.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Louhi seats Ilmarinen at a well-filled table, gives him food and comforts,
    asks him to forge the Sampo and its colored lid from swan feathers, milk, barley,
    and lambs' wool, and offers her fairest daughter as recompense.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ilmarinen agrees to forge the Sampo and says that he forged the arch of heaven
    and the air before the earth began.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ilmarinen looks for a workshop and tools but finds no smithy, bellows, chimney,
    anvil, tongs, or hammer; he then states that heroes and gods do not leave work
    unfinished.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ilmarinen searches the borders of Northland and the Pohya hills and meadows,
    finds a rainbow-colored rock or stone, and builds a smithy with fire, chimney,
    bellows, and furnace.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Ilmarinen mixes metals in a caldron, places them in the furnace, and has hirelings
    work the bellows, fire, and fuel for three summer days and three midsummer nights,
    until rocks blossom from the magic heat.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The first thing to rise from the furnace is a bright, ornamented crossbow
