canonical_text:
  quote: ''
  summary: Annikki prepares a cleansing and beautifying bath for her brother Ilmarinen,
    who forges ornaments and a silver loom for her. Ilmarinen bathes, dresses richly
    for wooing, orders a servant to prepare a magic sledge with a gray steed, birds,
    and furs, and petitions Ukko for snow. Ukko sends snow, and Ilmarinen drives north
    toward Pohya/Sariola. On the third day he overtakes Wainamoinen in his vessel,
    and the two agree to woo the Northland maiden peacefully and let her choose.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Annikki warms a bath-room using fir knots, heated stones, birch tassels, honey-steeped
    foliage, lye from milk and ashes, and reindeer fat and marrow, making a soap described
    as having magic virtue for cleansing and beautifying Ilmarinen.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ilmarinen forges ornaments, rings, bracelets, pins, ear-drops, six golden
    girdles, and a silver weaving loom for Annikki while she prepares the bath-room.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: After receiving the trinkets and loom, Annikki says the bath and toilet-things
    are ready and instructs Ilmarinen to prepare himself for successful wooing.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Ilmarinen bathes, makes his head flaxen-white, his cheeks ruddy, and his eyes
    sparkling, then asks Annikki to bring his best clothing for wooing.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Annikki brings Ilmarinen rich garments and accessories, including soft linen,
    mother-made raiment, marten-leather shoes, colored clothing, ermine and seal-skin
    garments, a magic girdle, gloves, and a cap associated with earlier wooing.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: Ilmarinen orders a servant to harness the gray steed to his magic snow-sledge,
    place six cuckoos and seven bluebirds on it to attract Northland maidens, and
    add bear-skin and marten robes for warmth.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The servant harnesses the gray steed, readies the snow-sledge, places the
    birds on it, and brings the bear-skin and marten robes.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Ilmarinen entreats Ukko to send snow so that his sledge may glide toward Sariola,
    and Ukko sends snow in assistance.
  category: action
  evidence_refs:
  - ev:8
  - ev:9
- id: obs:9
  text: Seated in his metal snow-sledge, Ilmarinen asks for good luck and divine protection
    for the reins, traces, shafts, runners, and journey to Sariola.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:10
  text: Ilmarinen drives northward over sea-coast, lowlands, alder-hills, and mountains
    amid snow, wind, and sea-foam, while the bluebirds and cuckoos sound from the
    sledge.
  category: action
  evidence_refs:
  - ev:11
- id: obs:11
  text: On the third day Ilmarinen overtakes Wainamoinen in his magic vessel and proposes
    that they woo the Northland maiden peacefully, letting her choose; Wainamoinen
    agrees and says the unsuccessful suitor should not harbor wrath or envy.
  category: speech
  evidence_refs:
  - ev:12
