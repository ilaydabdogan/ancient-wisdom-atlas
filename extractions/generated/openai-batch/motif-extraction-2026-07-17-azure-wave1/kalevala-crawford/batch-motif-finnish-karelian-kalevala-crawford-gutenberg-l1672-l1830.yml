canonical_text:
  quote: ''
  summary: A copper-clad small hero rises from the ocean. After Wainamoinen questions
    and doubts him, the sea-born figure declares that he has come to fell the oak,
    becomes a giant, and cuts down the hundred-branched tree. The fallen oak scatters
    beneficial branches and splinters, some of which a Northland maiden gathers for
    enchanted weapons. With the oak down, light and sky-course return; vegetation
    grows again, but barley requires sowing and forest-clearing by fire.
  language: English
  quote_policy: summarized
