canonical_text:
  quote: ''
  summary: Lemminkainen asks Lylikki to make snow-shoes so he can hunt a blue moose.
    Lylikki crafts wondrous snow-shoes, and Lemminkainen boasts that no deer can escape
    him. Hisi and Juutas hear him, create a magic reindeer from natural materials,
    and send it fleeing through Lapland to exhaust him. The reindeer disrupts courtyards
    and households, causing dogs, children, women, and heroes to react noisily. Lemminkainen
    pursues it over many landscapes, including the realms of Kalma and Tuoni, where
    death cannot catch him. At a distant Hisi corner he hears of the reindeer’s disturbance
    and speaks magic words invoking Lapland heroes, women, children, and kettles to
    help catch and boil the moose.
  language: English
  quote_policy: summarized
