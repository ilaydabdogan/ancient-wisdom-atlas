canonical_text:
  quote: ''
  summary: 'A woman is instructed in conduct for entering and serving her husband''s
    household: bath preparation, spinning and weaving, brewing, hospitality, village
    speech, and proper answers about her mother-in-law. She is warned not to forget
    her natal mother, with threat of punishment in Manala by Mana''s daughters and
    Tuoni''s sons. A witch or beggar-woman near the fire speaks of failed song, homelessness,
    her former youth in nature, and compares maidens entering marriage to hungry animals
    entering traps.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressed woman is told to prepare the bath-room, not linger in the bath,
    and invite the father of her hero-husband to bathe while offering service.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressed woman is told to do spinning and weaving herself, without asking
    servants, sisters, strangers, or looking in the stream for knowledge.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The addressed woman is told to brew beer from barley and honey with magic
    virtues, stir it with her fingers rather than a birch-rod, keep dogs outside the
    brew-house, and not fear wolves or wild beasts.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: If a stranger comes, the household is said to have food; the woman should
    seat and kindly entertain the guest, but escort him only to the portals and not
    outside the doorway.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If the woman goes to the village, she is told to speak wisely so as not to
    shame her kindred or disgrace her husband's household.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: When village women ask whether her husband's mother greets her as she was
    greeted in childhood, she is told not to answer negatively but to say she has
    received the best provisions and kindest greetings, even if only once a season.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The woman is told not to forget her natal mother when she leaves her father
    for her husband's distant dwelling; the mother is described as giving life, nurturing,
    nursing, feeding, and teaching her.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: A daughter who forgets her mother is warned not to visit Mana's castle in
    Tuoni's kingdom; in Manala she would suffer retribution, be tormented by Mana's
    daughters, and be reviled by Tuoni's sons.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A witch or beggar-woman sits on the floor near the fire, is described as knowing
    the ways of people, and utters words about a winter crow, failed singing, and
    homelessness.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:10
  text: The beggar-woman addresses a sister, tells her to enter her husband's dwelling
    but not follow his mind as she herself did, and recalls herself as like a budding
    flower, rose, birds, meadow berry, and singer in valleys, hills, mountains, glens,
    forests, and woodlands.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Foxes and ermine are said to be driven into traps by hunger; this is explicitly
    compared to maidens being wooed and wedded in their hunger for a husband, and
    daughters are said to be subject to husband and his mother.
  category: relationship
  evidence_refs:
  - ev:9
