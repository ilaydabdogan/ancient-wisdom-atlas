canonical_text:
  quote: ''
  summary: Lemminkainen travels through snowy forest to Tapio's dwelling, addresses
    the forest women and deities, recalls their former golden splendor, petitions
    them to clothe themselves and the trees richly, asks Tulikki to drive the moose
    and clear the route, offers gold and silver in exchange, sings the forest powers
    friendly, captures the blue moose of Hisi with a lasso, and asks Mielikki to receive
    the promised payment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lemminkainen travels over lowlands, uplands, snow-fields, and snow-robed trees
    to Tapio's court-yards and looks into the mansion.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Inside Tapio's dwelling he sees forest-dames or forest-mothers wearing scanty,
    soiled, ragged linen.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lemminkainen recalls three mountain castles made of horn, ivory, and wood,
    each with golden windows, through which he saw Tapio's hostess, Tellervo, maidens,
    and a queenly forest hostess in gold, silver, jewels, and pearls.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: He asks the forest hostess or Metsola's mistress to discard straw-shoes, birch-bark
    shoes, and ragged linen and to put on festive clothing while he hunts the moose
    of Hisi or Lempo.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: He addresses a sable-bearded god of forests and asks him to robe trees and
