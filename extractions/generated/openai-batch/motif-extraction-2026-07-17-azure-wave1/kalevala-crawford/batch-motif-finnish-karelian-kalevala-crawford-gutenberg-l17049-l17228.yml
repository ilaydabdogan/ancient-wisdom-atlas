  summary: Louhi sends Frost to the waters of Pohyola to freeze Lemminkainen/Ahti
    and his magic vessel. Frost freezes waters, snow, and the hero's ship and tries
    to freeze the hero. Lemminkainen counters with magic, fire, commands, origin-knowledge,
    and threats of banishment to Northland, fiery places, or summer.
  language: English
  quote_policy: summarized
