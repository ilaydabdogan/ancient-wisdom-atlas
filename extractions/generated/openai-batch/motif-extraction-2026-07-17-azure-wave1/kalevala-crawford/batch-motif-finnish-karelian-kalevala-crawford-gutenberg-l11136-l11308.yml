canonical_text:
  quote: ''
  summary: The passage narrates a sequence in which Kalevatar finds small objects
    in a caldron and brings them to Kapo/Osmotar, who magically produces animal helpers.
    A squirrel is sent to obtain cones and pine shoots for brewing, but these do not
    ferment the beer. A marten is then sent to gather foam from fighting bears, but
    this also fails to make the beer effervesce. Finally, a bee is produced from a
    pod and sent to gather honeyed juices from flowers near a sleeping maid on ocean
    islands and water-cliffs.
  language: English
  quote_policy: summarized
