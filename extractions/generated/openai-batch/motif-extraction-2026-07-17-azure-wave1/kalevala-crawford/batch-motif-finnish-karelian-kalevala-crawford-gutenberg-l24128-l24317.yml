canonical_text:
  quote: ''
  summary: Ilmarinen invokes frost and Ukko to cool wounds caused by Panu, a fire-being.
    The next rune opens with the sun and moon absent from Wainola and Kalevala, producing
    cold, hunger, and death. A maid asks Ilmarinen to forge new celestial lights,
    but Wainamoinen warns that gold and silver will not shine as true moonlight or
    sunlight. Ilmarinen's forged lights fail. Wainamoinen divines with alder chips,
    learns that the sun and moon are hidden in a mountain of Pohyola, and begins a
    journey to recover them, calling for a ferry across Pohyola's river.
  language: English
  quote_policy: summarized
