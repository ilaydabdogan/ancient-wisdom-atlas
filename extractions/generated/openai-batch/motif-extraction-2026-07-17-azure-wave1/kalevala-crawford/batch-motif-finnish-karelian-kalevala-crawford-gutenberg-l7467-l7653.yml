canonical_text:
  quote: ''
  summary: 'Lemminkainen returns to Louhi after catching the moose and asks for her
    daughter. Louhi sets further tasks: first to bridle the flaming horse of Hisi/Lempo,
    then to kill the swan in the river of Tuoni with one arrow. Lemminkainen prays
    to Ukko for hail, bridles the fire-horse, and returns. On the next quest he goes
    toward Tuoni/Manala, where Nasshut, a blind and crippled shepherd, sends a serpent
    from the death-stream into him. As he perishes, Lemminkainen regrets ignoring
    his mother’s counsel and calls on her to rescue him from Tuoni.'
  language: English
  quote_policy: summarized
