  summary: Wainamoinen returns to Kalevala by sledge, sings a heaven-reaching tree
    with the Moon and Great Bear in its branches, meets Ilmarinen, describes a wondrous
    Northland maiden and the forging of the Sampo, then leads Ilmarinen to the tree
    and tells him to climb it; the tree speaks against Ilmarinen’s attempt to take
    its celestial lights.
  language: English
