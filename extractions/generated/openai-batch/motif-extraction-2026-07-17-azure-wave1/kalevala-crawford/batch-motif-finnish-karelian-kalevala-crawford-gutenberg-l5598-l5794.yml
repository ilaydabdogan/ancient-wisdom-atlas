canonical_text:
  quote: ''
  summary: Ilmarinen repeatedly examines the furnace while trying to forge the Sampo.
    A metal skiff, a magic cow, and a metal plow rise from the fire but are harmful
    or unruly, so he breaks or cuts them and returns them to the furnace. With workmen
    and storm-winds at the bellows, the Sampo finally rises with a many-colored lid
    and produces flour, salt, and money. Louhi takes the Sampo to Sariola and secures
    it with locks and roots. Ilmarinen asks Northland's daughter to marry him, saying
    he forged the Sampo for her, but she refuses to leave her home, freedom, seasonal
    labors, birds, and waters. Ilmarinen returns home by copper boat with wind assistance
    and tells Wainamoinen that Louhi has the Sampo while he has no bride.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the second day, a metal skiff or boat rises from the furnace-fire; it has
    purple color, golden ribs, and copper oars, but is described as rushing into quarrels
    and evil combat.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ilmarinen is displeased with the skiff, breaks it into fragments, throws the
    fragments back into the furnace, and keeps workmen at the bellows to forge the
    Sampo.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: On the third day, a magic heifer or cow rises from the furnace; she has golden
    horns, the Bear of heaven on her head, and a disc of sunshine on her brow, but
    she is ill-tempered and wastes her milk while running.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ilmarinen is displeased with the magic cow, cuts it in pieces, throws the
    pieces into the fiery furnace, and sets the workmen at the bellows.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: On the fourth day, a metal plow rises from the fire; its point and plowshare
    are golden, its beam is copper, and its handles are silver, but it plows up fields
    and meadows destructively.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Ilmarinen breaks the plow, throws the pieces back into the furnace, and lets
    winds and storm-winds attend the bellows until fire, sparks, and smoke rise strongly.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: On the third night, Ilmarinen sees the Sampo rising from the furnace with
    a many-colored lid and forges it with tongs, anvil, and hammer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The finished Sampo grinds flour, makes salt, forges money, and produces measures
    for eating, the market, and the storehouse.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:10
- id: obs:9
  text: Louhi takes the Sampo to the hills of Sariola and copper-bearing mountains,
    places nine locks on it, and makes three strong roots grow around it nine fathoms
    into the earth.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: Ilmarinen asks the Northland maiden to come with him as wife and queen, saying
    he forged the Sampo and its many-colored lid for her.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Northland daughter refuses, saying she will not leave her father’s dwelling,
