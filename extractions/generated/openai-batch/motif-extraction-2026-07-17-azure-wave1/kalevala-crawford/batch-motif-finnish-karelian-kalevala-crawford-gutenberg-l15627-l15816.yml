canonical_text:
  quote: ''
  summary: Lemminkainen arrives at a Pohyola wedding feast as an unwelcome guest,
    complains that he was not invited despite sending barley, receives poor food and
    vile beer containing serpents and other creatures, removes and kills the creatures,
    drinks the remaining beer, disputes with the landlord over proper drink, and engages
    him in an alternating contest of conjured animals before refusing to leave the
    banquet.
  language: English
  quote_policy: summarized
