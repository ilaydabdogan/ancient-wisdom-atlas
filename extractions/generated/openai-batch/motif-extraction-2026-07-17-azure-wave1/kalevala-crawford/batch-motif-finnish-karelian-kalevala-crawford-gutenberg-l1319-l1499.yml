  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The water around the nest grows warm; fire is kindled in the maiden's knee,
    her shoulders burn, and she shakes the nest so that the eggs fall into the ocean
    and break on the bottom.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The broken egg fragments do not perish; the lower half becomes the nether
    vault of Terra, the upper half becomes the upper vault of Heaven, and other egg
    parts become moonbeams, sunshine, starlight, and clouds.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'After years in the sea, the water-mother begins creating on the watery expanse:
    where she moves her hand, foot, body, head, or back, hillocks, fish-holes, deeps,
    banks, bays, inlets, rocks, and hidden reefs arise.'
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: Islands, rocks, pillars of the sky, fields, forests, and many-colored stones
    are established, while Wainamoinen remains undelivered and has not yet seen sunlight
    or moonlight.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Wainamoinen has remained unborn in a dark dungeon for thirty summers and thirty
    winters on the waters, and he prays to the Moon, Sun, and Bear of heaven to take
    him from the dark prison so he can walk on islands and see the sky lights.
  category: speech
  evidence_refs:
