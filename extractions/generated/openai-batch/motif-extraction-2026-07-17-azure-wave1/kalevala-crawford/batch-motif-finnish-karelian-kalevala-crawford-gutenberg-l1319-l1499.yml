canonical_text:
  quote: ''
  summary: The daughter of the Ether, now a water-mother, laments her suffering in
    the sea and calls on Ukko for help. A duck searches the empty waters for a nesting
    place; the water-mother raises her body above the ocean, and the duck nests on
    her knee, laying six golden eggs and a seventh iron egg. Heat from the hatching
    eggs causes the water-mother to shake the nest, and the broken eggs transform
    into earth, heaven, moonbeams, sunshine, starlight, and clouds. The water-mother
    later shapes islands, reefs, deeps, banks, bays, fields, and forests through movements
    of her body. Wainamoinen remains unborn in a dark enclosure on the sea and prays
    to the Moon, Sun, and Bear of heaven to release him so that he may walk on land
    and see the lights of the sky.
  language: English
  quote_policy: summarized
