  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: At the homestead he does not see his father's cottage or his mother's dwellings;
    alder-trees, shrubs, and junipers grow where the mansion and courtyard had been.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lemminkainen recalls playing there as a child and says he fears fire found
