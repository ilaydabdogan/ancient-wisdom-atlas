  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: He weeps for three days, not for the homestead or his father's dwellings,
    but for his mother, the departed, and loved ones of the island.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: He sees an eagle, called a bird of heaven, and asks where his mother has wandered
