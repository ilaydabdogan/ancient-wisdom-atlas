canonical_text:
  quote: ''
  summary: Lemminkainen, also called Ahti and Kaukomieli, leaves the Isle of Refuge
    by sea while the island maidens and he mourn their separation. A storm destroys
    his vessel, and he swims until he reaches land. At a magic castle a kindly hostess
    feeds him and gives him a magic vessel for his journey home. Returning to his
    homeland, he finds the homestead overgrown and fears destruction by fire and enemies.
    He mourns his mother, asks an eagle and hears a raven's report about his people,
    then follows footprints through wild country to a hidden cabin where he finds
    his gray-haired mother weeping.
  language: English
  quote_policy: summarized
