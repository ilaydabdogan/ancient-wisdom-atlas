canonical_text:
  quote: With the stone of many colors / Sank poor Aino to the bottom
  summary: Aino perishes in the sea; a hare is chosen to carry the news to her family;
    the hare announces her death and abandoned ornaments; Aino's mother laments, warns
    mothers not to force daughters to unwanted bridegrooms, and her tears become streams,
    torrents, cataracts, rocks, hillocks, birches, and golden cuckoos whose calls
    memorialize love, suitor, and consolation.
  language: English
  quote_policy: quoted
