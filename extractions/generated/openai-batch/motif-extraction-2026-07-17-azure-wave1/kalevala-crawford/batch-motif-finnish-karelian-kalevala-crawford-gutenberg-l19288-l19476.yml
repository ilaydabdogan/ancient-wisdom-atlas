- id: obs:7
  text: Kullervo asks his father whether he will weep if Kullervo dies; the father
    says he will not mourn and will beget a second, wiser hero.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Kullervo answers that he will not mourn his father and can make a second father
