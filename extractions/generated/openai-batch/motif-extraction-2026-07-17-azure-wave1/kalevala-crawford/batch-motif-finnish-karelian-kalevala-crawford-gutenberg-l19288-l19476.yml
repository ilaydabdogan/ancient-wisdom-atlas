canonical_text:
  quote: ''
  summary: Kullervo prepares for battle despite his mother's warning. He rejects concern
    for his father, mother, brother, and sister, bids farewell to family members,
    and exchanges refusals of mourning with most of them. He claims he could make
    replacement kin from natural and precious materials. His mother alone promises
    an extended lament. Kullervo then goes joyfully toward combat, while messengers
    report the deaths of his father and brother; he refuses to return, saying a sable
    stallion can take them to Kalma.
  language: English
  quote_policy: summarized
