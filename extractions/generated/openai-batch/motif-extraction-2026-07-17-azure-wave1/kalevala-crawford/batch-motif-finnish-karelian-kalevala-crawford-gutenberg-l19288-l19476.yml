  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: Kullervo's brother and sister also say they will not mourn him, and Kullervo
    says he can form replacement siblings from substances including dust, ashes, ocean
    pearls, marble, moonbeams, rainbow, ocean-flowers, gold, and silver.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Kullervo's mother says she will mourn him bitterly for three years, with tears
    sprinkling fields, making rivers, melting snows, and greening hillocks.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: Kullervo goes rejoicing toward combat across fields, fens, hills, mountains,
    glens, and forests, blowing a bugle.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: A messenger reports that Kullervo's father has died and urges Kullervo to
