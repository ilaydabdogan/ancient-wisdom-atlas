  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: 'When his mother asks who will protect his father, mother, brother, and sister,
    Kullerwoinen answers that each may die in a specified place: courtyard, stable
    or cabin, forest, and waters or fountain.'
  category: sequence
  evidence_refs:
  - ev:3
