canonical_text:
  quote: |-
    One foot on the fathers threshold,
    And the other for the snow-sledge
  summary: A wedding blessing invokes Ukko for abundance and joy. After Ilmarinen’s
    marriage to the Maiden of the Rainbow, Louhi, the hostess and mother, tells the
    bridegroom to wait until the bride is ready, then urges the bride to leave with
    him. The mother contrasts the bride’s sheltered childhood with the difficult,
    lasting departure to a strange household. The departing daughter recalls verses
    about becoming a bride at the threshold, with one foot toward the snow-sledge
    that will carry her to her husband’s lands.
  language: English
  quote_policy: quoted
