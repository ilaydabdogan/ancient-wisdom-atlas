- id: obs:3
  text: The hostess of Pohyola speaks to Ilmarinen, calls him bridegroom and blacksmith,
    and tells him repeatedly to wait because the bride is not yet fully prepared.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Louhi later says the bride is ready and names her as the Fairy Maiden of the
    Rainbow.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The bride is instructed to join her suitor and follow her chosen husband;
    a steed with a silver bridle and a sledge wait at the gate.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The mother reminds the bride that she had desired a suitor, jewels, and rings,
    and now must keep her promise and go with Ilmarinen.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The bride’s childhood at her father’s dwelling is described as sheltered,
    well-provisioned, and free from sorrow.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The bride is told that she now leaves home and kindred for other firesides,
    another mother, other siblings, a second father, and the servant-folk of strangers.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:9
  text: The mother states that marriage does not mean a brief absence; the wife must
    wander, work, and struggle for many months and years, even while the mother lives.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The departing daughter recalls verses saying that a maiden becomes a bride
    only when she has a suitor and weds a hero, with one foot on her father’s threshold
    and the other for the snow-sledge to her husband’s lands.
  category: speech
  evidence_refs:
