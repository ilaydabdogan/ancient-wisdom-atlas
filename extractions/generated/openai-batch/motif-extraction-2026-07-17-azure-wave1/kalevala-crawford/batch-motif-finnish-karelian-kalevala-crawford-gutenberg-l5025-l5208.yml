canonical_text:
  quote: ''
  summary: After the blood-stream ends through spoken magic words, a gray-beard sends
    his young son to prepare a healing balsam. The son gathers oak material, herbs,
    and distant healing plants, boils them in a copper kettle, and tests the completed
    salve on a broken birch and fractured stones. The gray-beard then applies the
    balm and a silk bandage to Wainamoinen, invokes Ukko/Jumala/Creator, banishes
    pain to Hisi's realm, and Wainamoinen recovers. Wainamoinen praises Ukko/Jumala
    and warns future people that completion belongs to Ukko alone.
  language: English
  quote_policy: summarized
