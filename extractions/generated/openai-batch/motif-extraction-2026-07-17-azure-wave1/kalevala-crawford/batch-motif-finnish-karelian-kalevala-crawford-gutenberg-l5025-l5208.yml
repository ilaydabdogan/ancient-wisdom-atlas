- id: obs:2
  text: The gray-beard sends his young son to the smithy to make a healing balsam
    from herbs, plants, flowers, honey-bearing stalks, roots, leaves, and blossoms.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: On the way, the son meets an oak-tree, asks about honey, and the oak-tree
    answers that honey and fragrance came from clouds and the heavens onto its branches
    and leaves.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The son takes oak splinters and young oak branches, gathers healing grasses,
    herbs, and flowers, places them in a copper kettle in the furnace, and steeps
    and boils them; after the first testing the balsam is unworthy.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The son adds further healing herbs from distant nations, associated with the
    wisest minstrels and nine enchanters, tends the fire, watches the mixture, and
    finds the magic balm finished.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The son tests the balm on a branching birch that had been broken by evil Hisi,
    anointing and rubbing its broken places.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The birch-tree recovers, and the salve also causes broken sandstone, granite
    blocks, and mountain fissures to unite or grow together.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The young boy returns with the finished balm, gives it to the gray-beard,
    and describes its power to join granite, restore fragments, affect mountain fissures,
    and restore the birch-tree.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The old man tests the balsam with his tongue, anoints Wainamoinen's wounds,
    and speaks ancient wisdom about relying on the Creator and Ukko rather than on
    one's own virtue, power, or wisdom.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: After the salve touches the wounds, Wainamoinen suffers severe pain until
    the gray-beard banishes the torment by magic to a distant hostile landscape and
    to Hisi's realm.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: The gray-beard tears silk into strips, makes a bandage, wraps Wainamoinen's
    knee, ankle, and wounds, and prays for Ukko/Creator to guard and protect them
    from evil and Hisi's wilds.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Wainamoinen feels the aid of magic and Ukko; his body grows stronger, his
    wounds unite, his pain departs, and he walks freely.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: Wainamoinen looks heavenward to Jumala, addresses Ukko, gives thanks for healing
    and protection from pain caused by Iron and Hisi, and tells present and future
    people that Ukko alone brings completion.
  category: speech
  evidence_refs:
  - ev:11
