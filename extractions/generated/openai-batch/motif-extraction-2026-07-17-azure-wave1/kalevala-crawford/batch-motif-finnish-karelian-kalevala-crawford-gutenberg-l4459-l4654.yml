canonical_text:
  quote: ''
  summary: Wainamoinen, wounded by an axe, attempts incantation and natural remedies
    to stop a severe blood flow, then travels by sledge through a triple-parted road
    to seek help. After two dwellings refer him onward, an old man receives him, has
    maids collect some blood, and asks him to sing the origin of iron. Wainamoinen
    recounts an origin in which Ukko separates air and water, brings forth three daughters,
    and their colored milks produce different kinds of iron.
  language: English
  quote_policy: summarized
literal_observations:
