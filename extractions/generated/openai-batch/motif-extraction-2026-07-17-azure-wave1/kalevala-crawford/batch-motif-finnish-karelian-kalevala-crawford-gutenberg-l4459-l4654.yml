- id: obs:2
  text: Wainamoinen begins incantations and magic singing about the origin of evil
    and the origin of iron, intending to fashion a bolt or lock for his axe wounds.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Blood flows from Wainamoinen's knee and veins like a brooklet or torrent and
    covers meadow vegetation.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wainamoinen gathers lichens, moss, and grasses to stop the blood flow, but
    the attempt is unsuccessful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wainamoinen hitches his steed to a birch-wood sledge and travels to a Northland
    village where the road is divided into three ways.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: At a cottage on the lowest highway, Wainamoinen asks whether anyone can heal
    his axe wound and check the blood flow; a boy beside a baby says no one there
    can do so but someone in another cottage may help.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: At a cabin on the middle highway, Wainamoinen repeats his request; a witch
    or beldame near the fireplace says no one there can help but someone in another
    cottage may do so.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: At a cottage on the upper highway, an old man by the fireplace or hearthstone
    says greater wonders have been accomplished through three words of the master
    and through telling causes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Encouraged, Wainamoinen enters the old man's dwelling, and two maids with
    silver pitchers and golden goblets collect a very small measure of his blood.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The old man asks Wainamoinen's identity, remarks that his blood fills seven
    sea-boats and eight large birchen vessels, and asks him to sing the source of
    metals and origin of iron.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Wainamoinen says air is the oldest mother, water the oldest brother, fire
    the second brother, and iron the youngest brother; he also says Ukko, maker of
    the heavens, first separated air and water before iron was born.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Ukko rubs his hands together and presses them on his knee-cap; three beautiful
    maidens or daughters then arise and are identified as mothers of iron and bright-blue
    steel.
  category: action
  evidence_refs:
  - ev:10
- id: obs:13
  text: The three daughters walk the heavens and clouds with the milk of future iron
    flowing from them to earth and waters.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: The eldest daughter sprinkles black milk over river channels, the second sprinkles
    white milk over hills and mountains, and the youngest sprinkles red milk over
    seas and oceans; dark ductile iron, lighter iron, and red brittle iron grow where
    these milks fall.
  category: sequence
  evidence_refs:
  - ev:11
