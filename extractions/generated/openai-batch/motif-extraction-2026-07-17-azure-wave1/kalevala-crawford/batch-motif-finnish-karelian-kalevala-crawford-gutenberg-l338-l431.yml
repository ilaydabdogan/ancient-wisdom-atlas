  quote: ''
  summary: The preface passage summarizes Finnish-Karelian mythic material concerning
    Ukko, heavenly bodies as deities, solar and lunar figures, celestial maidens,
    the rescue or restoration of fire and life, air deities, and the reverence paid
    to sacred waters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Sun and Moon are said to have been stolen from the heavens and hidden
    in a cave in a copper-bearing mountain by the wicked hostess of Sariola.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ukko is described as relinquishing the support of the heavens, thundering
    along darkened clouds, and striking fire from his sword to kindle a new sun and
    moon.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: When Lemminkainen hunts the fire-breathing horse of Piru, Ukko responds to
    invocation by opening heaven’s windows and sending snow, ice, and iron hailstones
    against the horse.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ukko is also described as refusing aid when invoked by Ilmatar and by Wainamoinen
    in separate episodes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Sun, Moon, Polar-star, and Great Bear are presented as heavenly bodies
    that are also deities in their own right and not controlled by Ukko.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sun and Moon are said to have consorts, sons, and daughters.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: 'Two sons of the Sun appear: one gives Wainamoinen a magic knife, and Panu
    the Fire-child brings back fire stolen by Louhi.'
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The daughters of the Sun, Moon, Great Bear, Polar-star, and other heavenly
    dignitaries are described as ever-young maidens seated on trees, clouds, rainbow,
    or the dome of heaven and skilled in spinning and weaving.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: The Sun tells the Virgin Mariatta where her golden infant lies hidden in water
    among reeds and rushes.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The mother of Lemminkainen gathers fragments of his body from the river of
    Tuoni after he has been chopped to pieces by the Sons of Mana.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The Sun casts rays on the Shades of the Death-stream and causes them to sleep
    while Lemminkainen’s mother gathers the body fragments.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage states that the rune shows a belief that the dead can be restored
    to life through the blissful light of heaven.
  category: other
  evidence_refs:
  - ev:8
- id: obs:13
  text: Three Luonnotars are created by Ukko rubbing his hands on his left knee; they
    walk cloud borders and sprinkle white, red, and black milk over hills and mountains,
    becoming mothers of iron.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:14
  text: Untar or Undutar dwells in the highest heavens and sends mists and fogs through
    a silver sieve to earth.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Suvetar, goddess of the south wind, heals sick and afflicted followers with
    honey dropped from clouds and watches over grazing herds.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Water is described as highly revered; sacred lakes and rivers are named, offerings
    are made to waters, and taboos protect certain waterways or their surroundings.
  category: setting
  evidence_refs:
  - ev:12
