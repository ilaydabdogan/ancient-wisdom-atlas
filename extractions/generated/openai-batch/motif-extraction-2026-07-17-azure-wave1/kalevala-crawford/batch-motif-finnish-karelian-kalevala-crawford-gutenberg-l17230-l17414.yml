canonical_text:
  quote: ''
  summary: Frost asks Ahti for mercy and proposes a non-harm agreement. Lemminkainen/Ahti
    and Tiera abandon a frozen vessel and travel through Northland, Hunger-land, and
    Starvation-island. They find no food, curse an empty castle, make magic garments
    against the cold, fear starvation and death, imagine maternal mourning and the
    death-realm, reject enchantment by wizards, and pray to the Creator for protection,
    wisdom, and guidance.
  language: English
  quote_policy: summarized
