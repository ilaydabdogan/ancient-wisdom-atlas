- id: obs:5
  text: Wainamoinen says the maiden would bake, prepare drink, fill beer-cups, sing
    at his table, and walk as queen in his dwelling and in Kalevala.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The maiden says she heard a thrush or song-bird and asked whether life is
    happiest as a maiden with her father or as a wife with her husband.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The song-bird answers that maiden-freedom is warmer than summer and that many
    married women are like dogs chained in kennels.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Wainamoinen rejects the song-bird's statement and says wives are queens and
    highly honored.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The maiden says she would call Wainamoinen a hero if he split a golden hair
    with edgeless knives and snared a bird's egg with an unseen snare.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Wainamoinen completes the golden-hair and bird's-egg tasks.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The maiden next requires Wainamoinen to peel sandstone and cut a whip-stick
    from ice without losing fragments, and he completes the task.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The maiden says she will go only with one who makes a ship or shallop from
    spindle and distaff fragments and launches it without using the body to propel
    it.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Wainamoinen claims no one under heaven can build such a vessel like him, takes
    the fragments, and works at an iron mountain with hammer and hatchet for three
    days.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Hisi and Lempo interfere with the hatchet; fragments rebound and wound Wainamoinen's
