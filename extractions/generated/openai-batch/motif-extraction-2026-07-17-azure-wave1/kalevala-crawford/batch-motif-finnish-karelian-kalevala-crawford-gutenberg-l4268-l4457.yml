canonical_text:
  quote: ''
  summary: Wainamoinen travels homeward from Northland/Sariola and encounters Pohyola's
    daughter, the Maiden of the Rainbow, weaving on the bow of heaven. He invites
    her into his sledge and offers to make her wife and queen in Kalevala. She recounts
    a bird's warning about marriage, then sets a series of difficult tasks. Wainamoinen
    completes several tasks and attempts to build a vessel from spindle and distaff
    fragments at an iron mountain, but Hisi and Lempo turn the hatchet and wound him,
    causing a stream of blood.
  language: English
  quote_policy: summarized
