canonical_text:
  quote: ''
  summary: Mariatta, called the virgin-mother, is denied proper lodging and directed
    to a forest stable near a fiery mountain. She prays to her Creator and Ukko, receives
    warmth and moisture from the flaming horse of Hisi, and gives birth to a holy
    child in a woodland manger. The child vanishes while she sleeps. Mariatta searches
    for him, questions the Star, Moon, and Sun, and the Sun reveals that the child
    lies hidden in water among reeds and rushes. She finds him and brings him to her
    father’s dwelling; he grows in beauty, strength, light, and wisdom and receives
    different names.
  language: English
  quote_policy: summarized
