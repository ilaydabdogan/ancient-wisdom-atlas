canonical_text:
  quote: ''
  summary: The preface surveys scholars who collected and studied Finnish national
    poetry, including early collectors of incantations and pagan folklore, Juslenius,
    Porthan and later investigators, Topelius's bedside collection of heroic poems
    from travelling merchants and minstrels, and Lnnrot's field journeys to gather
    songs from oral performers. It identifies Wainamoinen as the central figure and
    chief hero around whom many runes gather, and closes with Lnnrot meeting an old
    runolainen whose death threatened the loss of many runes.
  language: English
