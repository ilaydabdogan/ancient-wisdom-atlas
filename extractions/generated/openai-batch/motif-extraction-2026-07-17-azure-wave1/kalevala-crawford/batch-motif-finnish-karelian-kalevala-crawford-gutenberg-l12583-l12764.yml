canonical_text:
  quote: ''
  summary: The passage first describes Ilmarinen as possessing abundant animals, crops,
    metals, jewels, and wealth. Rune XXIII then introduces Osmotar as the bride-adviser
    who instructs Ilmarinen's bride. Osmotar tells the bride to leave her father's
    house for her husband's household, abandon former maiden customs, love and honor
    her husband's kin, uphold virtue, consult dawn and celestial signs, kindle or
    request fire, and begin domestic tasks such as heating ovens and feeding animals.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ilmarinen is described as possessing birds, woodland beasts, mountain-feeding
    animals, grazing animals, thousands of sheep and cattle, abundant fields of grass
    and grain, metals in mountains and mines, jewels, and the wealth of Kalevala.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The rune states that the bride must be instructed, and identifies Osmotar
    as the wisdom-maiden who will instruct the bride of Ilmarinen and orphaned bride
    of Pohya.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The bride is addressed with labels including Maid of Beauty, lovely sister,
    Rainbow-daughter, and tender plant of Louhi's gardens.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:4
  text: Osmotar tells the bride to go from her father's ancient house and courtyards
    to her husband's village and his mother's household, where the rooms and customs
    are strange.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Osmotar says the bride's going and work must be carefully considered because
    the new household is unlike her Northland home, father's meadows, brother's highlands,
    mother's fenlands, and sister's flower-gathering.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The bride may take what pleases her, but is told to leave behind or cast away
    day-dreams, kindness for her mother, labors for her brother, incantations, sighing,
    maidenhood, rejoicing, trinkets, leisure, and pleasures, which are sent to others
    or buried beneath a mountain.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Osmotar repeatedly instructs the bride to acquire new habits, forget former
    customs, forsake former mother-, father-, brother-, and sister-love, and instead
    love the husband's mother, father, brother, and sister while bowing her head and
    speaking kind words.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The bride is warned not to approach the household, servants, or courts wickedly
    or indiscreetly; a virtuous house is contrasted with an immoral one whose elders
    are likened to black dogs in sheep's clothing, women to witches, brothers to serpents,
    and sisters to people of evil conduct.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The bride is told to give equal honors to her husband's friends and kindred,
    to bow lower than she did in her parents' house, to give good counsel, keep a
    sunny countenance, and carry ancient sayings in her head.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The bride is told to wake by the rooster's call, moonbeams, and the Great
    Bear, to call on the Moon for counsel, ask the Bear for ancient wisdom, divine
    the future from the stars, and use the Great Bear's orientation as a sign for
    waking.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: At waking, the bride is told to seek fire in the ashes, put a spark on tinder,
    and blow it through the fuel; if no spark remains, she should wake her husband
    and ask him to strike fire from flintstone for her tinder.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: With the spark, the bride is told to light fires, heat ovens, place torch-light
    in a holder, go to the stables, fill mangers, and feed cows, lambs, horses, calves,
    and fowl.
  category: action
  evidence_refs:
  - ev:9
