canonical_text:
  quote: ''
  summary: Lemminkainen's mother fails at first to revive her speechless son with
    earlier balms, then sends a honey-bee to high Jumala and Ukko's seventh heaven
    for a stronger Creator's balsam. The bee ascends through celestial stations, gathers
    divine honey and life-giving balsam, and returns. The mother tests the remedy,
    anoints Lemminkainen's body and life-centres, and commands him to wake. He revives
    and explains that Nasshut sent him to Manala and caused a serpent or adder from
    the death-stream to strike his heart. His mother rebukes his ignorance of serpent
    knowledge and recounts the origin of serpents from waters, bird matter, and Suoyatar's
    saliva.
  language: English
  quote_policy: summarized
