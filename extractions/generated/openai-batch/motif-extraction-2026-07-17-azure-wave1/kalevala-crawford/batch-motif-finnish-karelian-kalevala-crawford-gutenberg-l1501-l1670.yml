canonical_text:
  quote: ''
  summary: Wainamoinen escapes from a dark fortress into the ocean, rests there for
    years, emerges onto a bare island, and is described as delivered from his mother
    Ilmatar. On the island he calls on Pellerwoinen/Sampsa to sow forest seeds. Most
    trees grow, but the oak remains in its acorn until maidens rake grasses, Tursas
    burns the windrows and plants an acorn in the ashes, and a vast oak rises high
    enough to block sunlight, moonlight, and starlight. Wainamoinen seeks a power
    able to fell the oak and invokes Kap/Luonnotar for water-forces.
  language: English
  quote_policy: summarized
