canonical_text:
  quote: ''
  summary: Wainamoinen explains that Otso has been placed honorably in a pine-tree
    cradle on a gold and copper mountain, then sings and prays to Ukko for future
    bear feasts and forest signs. In the next rune, Wainamoinen's music draws the
    Moon and Sun into trees. Louhi captures and hides them in Pohyola and steals fire,
    causing darkness and cold. Ukko searches the heavens, strikes new fire from his
    sword, places it in a precious container, and entrusts it to ether-maidens and
    a virgin who rocks it as a Fire-child; the Fire-child escapes and falls through
    the heavens.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The children ask Wainamoinen where he has taken Otso, called Forest-apple
    and sacred Otso of the woodlands.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wainamoinen says he did not leave Otso on ice, snow, swamp-land, or heather
    because animals, birds, worms, or insects would consume him there.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wainamoinen says he placed Otso on the summit of the Gold-hill and copper-bearing
    mountain, in a silken cradle at the top of a pine-tree, where winds and sacred
    branches rock him to lasting sleep.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Otso's lips point east and his eyes look north; he does not look upward because
    storm-winds would harm his vision.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:5
  text: Wainamoinen plays his harp, sings, and asks for a pine-wood torch as darkness
    appears so his playing and wisdom-songs may be welcomed.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: Wainamoinen prays to Ukko that the people of Wainola may enjoy another banquet
    with Light-foot and remember the feast with Otso.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wainamoinen asks Ukko that signs and notches in pine-trees direct his people
    to bear-dens, and that Tapio's bugle, Tapio's horn, and wood-nymph calls sound
    through forests, fields, and settlements for future generations.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: Wainamoinen plays magic harp-strings and sings; the melodies rise to heaven
    and reach the Moon and Sun.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Moon leaves her station and settles in a birch-tree, while the Sun leaves
    his castle and settles in fir-tree branches to listen to Wainamoinen's harp.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Louhi captures the Sun and Moon, takes Luna from the birch-tree, calls the
    Sun from the fir branches, and carries them to upper Northland and dark Sariola.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Louhi hides the Moon in a many-colored rock and the Sun in an iron-banded
    mountain or caverns of Pohyola, ordering them not to shine until she frees them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:12
  text: Louhi says she will free the Sun and Moon when she comes drawn by nine sable
    horses of one mother.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: After the Sun and Moon are hidden, Louhi steals fire from Northland and Wainola,
    leaving mansions cold, cabins dark, and darkness ruling in Kalevala and Ukko's
    home.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Ukko wonders at the darkness, walks the heavens to the cloud-border, and seeks
    the missing moonlight and sunshine.
  category: action
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ukko strikes lightning in the darkness from the edges of his fire-sword and
    sends flames into the upper heavens and ether.
  category: action
  evidence_refs:
  - ev:7
- id: obs:16
  text: Ukko hides a little kindled fire in cloud-space inside a gold and silver box
    and silver-adorned case, gives it to ether-maidens, and calls a virgin to rock
    it so it may become a new moon and second sun.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: The ether-virgin rocks the Creator's fire in a copper-colored cradle on the
    cloud and blue edge of ether, while clouds thunder and the heaven-dome descends.
  category: action
  evidence_refs:
  - ev:8
- id: obs:18
  text: The virgin tends the Fire-child with her fingers, but it escapes her hands,
    opens the heavenly vault, and falls as a red ball through cloudlets and nine starry
    vaults of ether.
  category: sequence
  evidence_refs:
  - ev:8
