canonical_text:
  quote: ''
  summary: Lowyatar gives birth to nine disease-children and names them. Louhi sends
    the fatal beings against Wainola, whose people become sick. Wainamoinen prepares
    a healing vapor-bath, invokes Ukko and other healing or pain-associated figures,
    and ritually banishes the diseases to remote otherworldly, watery, rocky, and
    subterranean places while treating the sufferers with balsams, herbs, and vapors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Lowyatar is described as blind, ancient, a wicked witch of Tuonela, and the
    daughter of Tuoni; she gives birth to nine children.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lowyatar places her offspring in a cradle under golden covers and guards them
    affectionately.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Lowyatar names the offspring Colic, Pleurisy, Fever, Ulcer, Plague, Consumption,
    Gout, Sterility, and Cancer.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The worst of the nine children is banished by Lowyatar to bewitch lowland
    people and engender strife and envy.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Louhi, hostess of Pohyola, banishes the other disease-children to a fog-point
    in the ocean and a forest-covered island, then gives them to the people of Wainola
    and Kalevala for destruction of the Kalew tribes.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Maidens, young and old people, men, and heroes in Wainola become sick and
    dying with severe, new, and nameless diseases.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wainamoinen hastens to rescue his people, to war with Mana, to conflict with
    Tuoni, and to destroy Lowyatar's evil children.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Wainamoinen heats bath-rooms and sandstone blocks with magic Northland wood,
    brings water from a cataract and whirlpool, prepares birch-wood brooms, cleanses
    the bath, and fills it with healing vapors.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Wainamoinen invokes Ukko to give the vapor-baths healing virtues, restore
    the dying people, and make water poured on heated sandstone turn to honey laden
    with healing balm.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Wainamoinen asks that the bath heat remain within healing limits and not harm
    the afflicted.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Wainamoinen asks the heavenly God of mercy to bring a fire-sword and lightning
    blade so that he can subdue and banish pains, ills, tortures, and monsters to
    remote places including Tuoni, east-winds, islands, caverns, mountains, and iron
    beds.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Wainamoinen addresses the Torture-daughter of Tuoni, who is located on a mount
    of anguish at the junction of three rivers, and asks her to turn the diseases
    into water-channels and ocean depths.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Wainamoinen invokes the Health-virgin to heal the people, take diseases in
    a copper vessel, carry them to mountain caves and the Pain-rock, and pour pains
    through a holed touch-stone.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: After the invocations, Wainamoinen rubs the sufferers with balsams, healing
    flowers, enchanted herbs, and healing vapors.
  category: action
  evidence_refs:
  - ev:9
- id: obs:15
  text: Wainamoinen prays for rain-clouds, mingled rain and honey, balsam from the
    great Physician, wisdom from his Creator, and the driving away of the Death-child
    from Wainola and Northland.
  category: speech
  evidence_refs:
  - ev:9
