canonical_text:
  quote: ''
  summary: Wainamoinen urges Ilmarinen to travel to Sariola/Pohyola to gain the Sampo
    and its colored lid. Ilmarinen says Louhi has hidden the Sampo in a locked copper
    mountain with deep roots around it. After debating land and sea routes, Wainamoinen
    asks Ilmarinen to forge a fire-sword. Ilmarinen forges and ornaments the weapon;
    Wainamoinen tests it and boasts it could split the mountain of Pohya. The two
    then harness a steed, travel north along the sea, and hear a lament near a landing-place.
  language: English
  quote_policy: summarized
