canonical_text:
  quote: |-
    Hear, O maiden, what I tell thee,
    Learn the tenor of my teaching:
  summary: 'A female addressee is given detailed instruction in domestic conduct:
    caring for children, cleaning the house, serving husband and kin, tending a sacred
    courtyard tree, asking the husband''s mother for tasks, preparing grain and bread,
    fetching water, gathering wood, washing utensils, and avoiding actions that could
    be read as vanity, anger, idleness, or discontent.'
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The addressee is told not to rest in the haymow or sleep within the hurdles
    after the cattle and flocks have been fed and watered.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A crying, speechless baby waits in the dwelling and is said to greet the mother's
    footsteps with joy.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The addressee is told to go silently to her husband's rooms carrying a golden
    pitcher, a birch-wood broom, and a lighted taper, then to sweep, dust, and wash
    the floor.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If the sister's baby is alone, the addressee is told to attend to the child,
    bathe the eyes, smooth the hair, give comforts, and, if no barley bread is available,
    place a trinket in the child's hand.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At the end of the week, the addressee is instructed to clean benches, tables,
    walls, ceilings, windows, crevices, chimney-corners, and rafters, first sprinkling
    rooms to keep dust from scattering.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The addressee is told to wear plain, comely clothing, white linen, and tidy
    fur-shoes for the glory and honor of her husband or hero.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: The addressee is instructed to tend the sacred sorb-tree and guard the mountain-ashes
    planted in the courtyard.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says the exiled one demonstrates that she lives to please her
    husband and tries to make her hero happy.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The addressee is compared to a mouse for hearing, a hare for running, and
    juniper and aspen for bending and turning, in order to watch her movements and
    avoid stumbling.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: When brother, father, and husband return from work, the addressee should give
    each a water-basin, a linen-towel, and a pleasant greeting.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: When the second mother comes with a corn-meal measure, the addressee should
    meet her in the court, bow, take the measure, and carry it to her husband.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: If uncertain about the next task, the addressee should ask her hero's mother,
    addressed as second mother, to name the task and explain how to do it.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: 'The expected answer of the mother lists daily work: stamping, grinding, arranging
    millstones, filling barley-pans with water, kneading dough, placing fagots on
    the fireplace, baking biscuits and barley loaves, and cleaning vessels.'
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: If the meal cask is empty, the addressee should take barley, grind in silence
    without singing, sighing, or groaning, sift the flour, and bake bread carefully.
  category: action
  evidence_refs:
  - ev:11
- id: obs:15
  text: If a bucket is empty, the addressee should carry it with a silver dipper to
    the crystal river, fill it, return quickly, and not linger at the water to admire
    her reflection.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: When gathering aspen and birch fuel in the woodlands, the addressee should
    do so quietly so the father and mother do not interpret noise as anger or discontent.
  category: action
  evidence_refs:
  - ev:13
- id: obs:17
  text: When going to the storehouse for barley flour, the addressee should not linger,
    lest father and mother imagine she has shared the meal with village women.
  category: action
  evidence_refs:
  - ev:14
- id: obs:18
  text: At the river, the addressee should wash platters, pans, buckets, pitchers,
    spoons, forks, knives, goblets, and cooking-vessels, and guard them from dogs,
    kittens, eagles, and children.
  category: action
  evidence_refs:
  - ev:15
