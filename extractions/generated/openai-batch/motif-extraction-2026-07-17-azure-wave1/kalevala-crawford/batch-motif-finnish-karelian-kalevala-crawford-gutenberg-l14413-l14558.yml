  summary: Wainamoinen begins incantatory singing and addresses his kin and companions.
    The speaker justifies singing old traditional songs in a festive hall with food,
    beer, and gathered people. The passage then praises the bridegroom’s father as
    host, landlord, and builder of a great mansion, and praises the hostess for preparing
    the wedding banquet, baking, feeding guests, and brewing honey-beer.
  language: English
