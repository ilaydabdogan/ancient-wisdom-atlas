canonical_text:
  quote: ''
  summary: Kullervo questions his purpose, sets out to avenge his family against Untamo,
    and meets a blue-clad woodland mother who tells him his parents still live in
    Northland. She gives him directions through forest, mountain, river, waterfalls,
    and a headland cottage. Kullervo follows the route, reaches his surviving family,
    and is recognized by his mother, who had mourned him as dead and tells of an absent
    daughter who vanished while gathering berries. The next rune states that Kullervo
    remains with his parents but cannot gain better judgment; when sent fishing, he
    rows with magical force and destroys the boat and oars.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kullervo addresses the Creator, asks about his birth and service, and says
    he will not perish on ice-plains or marshes while he has arms able to serve his
    kindred.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kullervo decides to journey to Untamo's village to avenge his father, mother,
    and tribe-folk, and he threatens to slay Untamo and his kindred and burn their
    homes.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A woman described as aged, dressed in blue, and called a woodland-mother meets
    Kullervo on the highway and asks where he is going.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: 'The woman tells Kullervo that he is mistaken: his tribe has not perished,
    and his mother and father live in Northland with old Kalervo.'
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman gives Kullervo a route involving forest travel, a river-border,
    three days northwest, a mountain to go around, an east-flowing river, three waterfalls,
    a headland, and a cottage where fishermen assemble.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Kullervo follows the route north and west, goes around the mountain, follows
    the river and rapids, reaches three waterfalls and a headland, and sees the fishermen's
    cottage.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: At the cottage Kullervo's kindred do not recognize him, so he identifies himself
    as Kullerwoinen, carried away by Untamo's heroes when he was only hand-breadth
    high.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kullervo's mother recognizes him as her son and says she had mourned him as
    dead and had supposed him to be in Manala.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Kullervo's mother says her elder daughter went to gather berries in the woodlands
    and mountains, vanished there, and died a death unknown to the mother.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The mother describes searching for the daughter for three days, reaching a
    mountain summit, calling to her, and hearing the mountains, hills, and valleys
    answer that the daughter will never again join her kindred.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The next rune says Kullervo lingered with his parents but could not change
    his nature, gain higher wisdom, or win better judgment because he had been ill-nurtured
    in childhood.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: When Kullervo goes fishing, he asks whether to row with full youthful force
    or aged weakness; a gray-beard tells him to row with all vigor, and Kullervo rows
    with youthful and magical force until he shatters the boat's bindings, ribs, and
    oars.
  category: sequence
  evidence_refs:
  - ev:10
