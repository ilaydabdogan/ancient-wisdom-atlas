canonical_text:
  quote: ''
  summary: An initial cross-bow challenge is stated. Lemminkainen prepares for a feast
    at Pohyola, receives warnings from his mother, departs in a battle-sledge, collects
    magical hazel-chicken feathers, confronts a fire-stream and fire-spouting eagle,
    uses transformed birds to escape the first danger, then encounters a second fire-gulf
    and prays to Ukko for storm-clouds and snow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An unspecified speaker takes a strong cross-bow and says he will recognize
    as a hero whoever can bend it and break its magic sinews in Pohyola.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Lemminkainen puts on battle gear and tells his servant to prepare a fiery
    charger for travel to a feast or banquet.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The servant prepares the war-horse or fire-red stallion and reports that it
    is ready for its master.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: At his departure, Lemminkainen's mother counsels him to drink only half a
    cup and leave the lower half, where serpents, worms, frogs, and lizards are said
    to be feeding.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The mother further counsels him to occupy only half a settle, take only half
    a stride, and behave courageously among hosts of magic valor.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Lemminkainen departs in a battle-sledge, using a pearl-enamelled birch-rod
    or whip, and his steed gallops on the journey.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A flight of hazel-chickens leaves feathers in Lemminkainen's pathway; he gathers
    them into a leather pouch for their magic virtues.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Lemminkainen's horse stops in danger before a fire-stream like a river, with
    a fire-fall, fire-rock, fiery hillock, and an eagle on the summit emitting fire
    from throat and feathers.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The eagle asks Lemminkainen where he is going; Lemminkainen answers that he
    is going to the feastings of Pohyola and the drinking-halls of Louhi, and asks
    the eagle to move aside.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The eagle answers that Lemminkainen's passage will be through its fire-throat
    and through the flames.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Lemminkainen rubs the magic feathers into powder, causing hazel-chickens to
