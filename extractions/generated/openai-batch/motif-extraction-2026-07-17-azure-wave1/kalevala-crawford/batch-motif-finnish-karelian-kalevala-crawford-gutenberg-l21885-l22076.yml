canonical_text:
  quote: ''
  summary: Wainamoinen urges the fleeing boat's crew to row from their pursuers. He
    casts tinder fragments on the water and uses magic words to raise a reef or mountain
    from the sea, wrecking Louhi's war-ship. Louhi transforms herself and the wreckage
    into a monster-eagle filled with armed men, attacks the boat, and tries to seize
    the Sampo. Ilmarinen prays to Ukko for protection. Wainamoinen asks Louhi to divide
    the Sampo, but she refuses. Lemminkainen cuts the eagle's talons, Wainamoinen
    strikes the eagle with a rudder, and Louhi finally drags the Sampo into the water,
    where its lid and body break and scatter through the sea, enriching Ahto's waters.
  language: English
  quote_policy: summarized
