canonical_text:
  quote: ''
  summary: Kullervo continues toward battle while messengers report the deaths of
    his sister and mother. He refuses to abandon vengeance against Untamo, prays to
    Ukko for a sword, destroys Untamo's people, returns to an empty home, receives
    counsel from his dead mother through her grave, follows his dog to the place connected
    with his sister, questions his sword, and kills himself before journeying to Manala.
    Wainamoinen closes with a moral warning about badly nurturing children.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Kullervo travels over valleys and mountains while sounding martial music,
    and a messenger reports that his sister has died in a crystal fountain.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Kullervo says a sable filly can take his sister to her resting place, then
    continues onward until another messenger reports that his mother has died broken-hearted.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Kullervo laments his mother, gives instructions for washing, wrapping, mourning,
    and burial, but says he cannot leave battle while Untamo remains unpunished.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kullervo prays to Ukko for a battle sword and says he will conquer against
    armies if granted the weapon.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Ukko gives Kullervo a magic broadsword, and Kullervo kills the people of Untamo
    and burns their villages.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:6
  text: Kullervo returns to his homeland and father's cabin, finding it empty and
    deserted.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:7
  text: Cold oven and hearth-stones, absent boats, and torn nets lead Kullervo to
    conclude that his mother, sister, brother, and father have all died.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kullervo weeps for three days and calls to his mother, saying she does not
    hear his magic song, tears, or lamenting heart.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Kullervo's mother awakens from her grave and tells him that his remaining
    dog will lead him to the forest, the woodland border, and the caverns of wood-nymphs
    where forest maidens can feed and shelter him.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Kullervo goes with his watch-dog through forest and fields to the summit where
    he had met his sister, and the surrounding turf, glen, heather, and flowers are
    described as weeping.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: Kullervo asks his broadsword whether it wishes to drink his life-blood, and
    the sword answers that it can drink guilty blood because it also drinks the blood
    of the worthy and righteous.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Kullervo fixes the sword-hilt in the heather, points the blade to his heart,
    throws his weight on it, dies, and is described as journeying to Manala.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: Wainamoinen hears of Kullervo's death and warns future generations not to
    rear children badly or give them to strangers and fools.
  category: speech
  evidence_refs:
  - ev:12
