canonical_text:
  quote: ''
  summary: Wainamoinen laments being stranded in the cold sea. An eagle from Pohyola
    questions him, learns of his wooing journey, Youkahainen's attack, and his storm-driven
    wandering, then rescues him in return for Wainamoinen's earlier kindness to birds
    by sparing a birch tree. The eagle carries him to Northland/Sariola, where he
    weeps on the shore. A Northland maiden, after pre-dawn tasks and a wager with
    the Sun and Moon, hears the lament and tells her mother. Louhi identifies the
    cry as that of a bearded hero, rows out, and comforts Wainamoinen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wainamoinen laments being in cold, lifeless waters and says dwellings built
    in winds or on billows would have no secure foundation or would be destroyed.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: An eagle or bird from far Pohyola/the occident appears, with one wing touching
    the waters and the other sweeping the heavens, sees Wainamoinen on the ocean,
    and addresses him.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wainamoinen identifies himself as ancient Wainamoinen, a friend of the waters
    and a famous wisdom-singer, and says he went to woo a Northland maiden.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Wainamoinen says Youkahainen killed his magic steed with bow and arrow, tried
    to slay him, and caused him to fall into the salt sea.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A storm-wind and whirlwind washed Wainamoinen farther out to sea, where he
    wandered and struggled for many days and nights among waves, foam, winds, and
    waters.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The eagle tells Wainamoinen to sit between its shoulders and promises to lift
    him from the waters and bear him where he wishes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: 'The eagle says it remembers Wainamoinen''s earlier service to eagles and
    birds: leaving a birch tree standing as a home and resting-place for song-birds
    and eagles.'
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:8
  text: Wainamoinen rises from the sea, seats himself on the eagle's feathered shoulders,
    and the eagle carries him through winds and breezes to the distant shore of Northland/Sariola.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: After being left on the shore, Wainamoinen weeps for three days and nights
    on a promontory, wounded and dishevelled, unable to find a route home to Kalevala.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: A young Northland maiden wagers with the Sun and Moon about who will rise
    first, rises before them, and shears six lambs for white fleeces before dawn.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: The maiden cleans and sweeps with birch materials, carries sweepings toward
    a meadow near the sea, hears wailing and a hero-voice from the shore, and reports
    it to her mother.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Louhi, hostess of Pohyola, listens at the sea-shore, identifies the sound
    as the anguish of a bearded hero, launches a boat, rows to Wainamoinen, and comforts
    him.
  category: action
  evidence_refs:
  - ev:10
  - ev:11
