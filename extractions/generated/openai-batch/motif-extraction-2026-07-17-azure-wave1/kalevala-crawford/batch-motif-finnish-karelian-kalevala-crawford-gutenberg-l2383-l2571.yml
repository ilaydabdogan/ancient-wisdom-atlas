canonical_text:
  quote: ''
  summary: Youkahainen, trapped by Wainamoinen's enchantment in mud, water, quicksand,
    and a stony prison, repeatedly begs for release and offers ransom gifts. Wainamoinen
    rejects magic bows, boats, stallions, gold, silver, and grain, singing Youkahainen
    deeper into torment after several offers. Youkahainen finally promises his sister
    Aino as Wainamoinen's bride. Wainamoinen accepts this ransom, sings to break the
    spell, and frees him. Youkahainen returns home sad and reckless, breaks his sledge,
    is questioned by his father, and weeps without answering.
  language: English
  quote_policy: summarized
