canonical_text:
  quote: ''
  summary: Wainamoinen seeks lost magic words after failing to learn them in Tuoni
    and Manala. A shepherd directs him to wise Wipunen, whose words are in his mouth
    and body, reached by a perilous path. Wainamoinen prepares metal gear from Ilmarinen,
    travels the ordeal road, finds Wipunen overgrown with trees, cuts the trees away,
    and tries to awaken him. Wipunen swallows Wainamoinen, who survives inside him
    by magically making a boat and then forging in Wipunen’s body until Wipunen feels
    smoke, fire, and iron and questions the intruder’s origin.
  language: English
  quote_policy: summarized
