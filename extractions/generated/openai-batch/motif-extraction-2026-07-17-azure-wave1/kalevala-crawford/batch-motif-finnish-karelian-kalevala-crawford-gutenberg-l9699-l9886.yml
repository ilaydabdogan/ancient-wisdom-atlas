canonical_text:
  quote: I am sailing to the Northland / To the dismal Sariola... / There to woo the
    Maid of Beauty
  summary: 'Wainamoinen, sailing in a magic vessel, repeatedly gives false explanations
    for his voyage. Annikki rejects each falsehood, threatens storm-winds, and elicits
    the truth: he is going to Sariola to woo the Maid of Beauty. Annikki abandons
    her washing, runs to her brother Ilmarinen''s smithy, bargains for ornaments in
    exchange for the news, and tells him that Wainamoinen is sailing ahead to woo
    Ilmarinen''s affianced bride. Ilmarinen is shocked and asks Annikki to prepare
    a heated bath and magic soap so he can cleanse himself.'
  language: English
  quote_policy: quoted
