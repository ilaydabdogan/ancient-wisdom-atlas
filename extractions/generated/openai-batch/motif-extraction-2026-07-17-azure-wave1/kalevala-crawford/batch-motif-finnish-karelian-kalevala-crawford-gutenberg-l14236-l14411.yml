canonical_text:
  quote: ''
  summary: A bridegroom is asked to uncover and show the bride he has brought after
    long wooing. A young child mocks the bride as giftless and unskilled, but Lakko,
    hostess of Wainola, rebukes the child, praises the bride, lists her textile gifts,
    welcomes her into the husband's household, describes domestic prosperity and ease,
    and the bride and bridegroom are served an abundant wedding feast before singing
    is called for.
  language: English
  quote_policy: summarized
