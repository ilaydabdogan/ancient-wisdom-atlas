canonical_text:
  quote: ''
  summary: The passage recounts the origin and equipping of the sacred bear Otso by
    Mielikki after an oath before Mielikki and Ukko; Wainamoinen then explains how
    forest powers guided him to Otso, how the bear died without weapons, and how Wainamoinen
    ritually addresses, dismembers, and sends Otso onward.
  language: English
  quote_policy: summarized
