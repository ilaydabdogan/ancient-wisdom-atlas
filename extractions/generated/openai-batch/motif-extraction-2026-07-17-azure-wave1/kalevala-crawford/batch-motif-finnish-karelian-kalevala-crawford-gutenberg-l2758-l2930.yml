canonical_text:
  quote: ''
  summary: Aino returns weeping to her mother and recounts how Wainamoinen addressed
    her from a cornfield and asked her to wear her ornaments and hair for him. Aino
    says she cast away her jewelry and would rather live simply with her parents.
    Her mother counsels her to stop grieving, eat strengthening foods, and take stored
    garments and ornaments from a mountain storehouse. The mother recalls receiving
    gold and silver from the daughters of the Moon and Sun in her youth, and urges
    Aino to dress splendidly and return to the household. Aino does not heed the advice,
    weeps alone, and laments her sorrow, comparing happiness and grief to natural
    images and saying it would have been better never to have lived or to have died
    as an infant.
  language: English
  quote_policy: summarized
