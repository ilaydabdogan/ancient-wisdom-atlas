canonical_text:
  quote: ''
  summary: The passage describes Kullerwoinen as a shepherd mistreated by Ilmarinen's
    wife. After discovering that his oat loaf contains an embedded stone that breaks
    his treasured knife, he receives revenge advice from a raven, transforms the herd
    into wolves and bears by magic, drives them back toward the hostess, and maneuvers
    her toward the milking place.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A woman sits on the greensward in a sunny place and chants to the Sun and
    to Ukko's fire, contrasting the rich food of the hostess with the poor bread and
    water of the herdsman.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ilmarinen's wife eats rich bread and provisions while setting aside cabbage,
    fragments, and dog leavings for Kullerwoinen.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A bird from the woods tells Kullerwoinen that it is time for the fatherless
    herdsman to eat from his basket.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Kullerwoinen looks at the Sun's long shadow and agrees that it is time to
    eat his basket dinner.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Kullerwoinen rests the herd, sits on a grassy hillock, takes out an arid oat
    loaf, inspects it, and speaks about loaves that look fine outside but contain
    chaff and tan-bark inside.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: When Kullerwoinen cuts the oat loaf, his knife strikes a stone embedded in
    the center and breaks.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Kullerwoinen identifies the broken knife as sacred to him and as a relic of
    his mother's people.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Kullerwoinen calls the loaf a cheat-cake of the hostess and asks how he should
    repay the insult, malice, and deception.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: A raven answers from a tree and advises Kullerwoinen to take a shoot or birch-rod,
    drive the herd into marshes, let the cattle go to wolves and bears, and bring
    wolves and bears home like cattle to repay the hostess.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Kullerwoinen threatens that the bride of Hisi will mourn when her cows come
    home in the evening.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kullerwoinen cuts a birch-wand and a juniper whip-stick, drives the herd through
    lowlands and marshes, sends them toward wolves and bear-dens, calls wolves his
    children and bears his standard-bearers, and changes all the cattle into wolves
    and bears by magic.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: At sunset Kullerwoinen drives the wolves and bears over a pine-tree mountain
    and toward the hostess's milk-yards.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: Kullerwoinen orders the wolves and bears to tear and kill the hostess when
    she comes to view and milk the cattle.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Kullerwoinen makes a bugle and flute from animal bones and horn and plays
