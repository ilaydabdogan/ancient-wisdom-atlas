canonical_text:
  quote: Thus was born the evil serpent, / This the origin of evil.
  summary: The passage recounts the origin of an evil serpent from Suoyatar's spittle,
    animated by Hisi after the Creator refuses to give it life. Lemminkainen recites
    the serpent's origin as a charm and commands it aside, then proceeds toward Pohyola.
    The next rune introduces him as an uninvited guest at a Northland feast, where
    he demands hospitality and is rebuked by the hostess Ilpotar.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Three daughters of Creation appear on the roaring ocean shore, see spittle
    lying there, and ask what would happen if the Creator's breath gave it life and
    vision.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Creator identifies the spittle as the expectoration of Suoyatar and says
    it would be evil if he gave it a soul and sight.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Hisi hears the conversation, acts as creator, breathes a soul into the spittle,
    and the poison-monster or evil serpent is born.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The serpent's body and faculties are traced to multiple sources, including
    Hisi, Suoyatar, rolling waters, a waterfall, ivy, Lempo, Keitolainen, Mana's daughter,
    Piru, a hobgoblin, and Tuoni.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Lemminkainen addresses the serpent by its origin and evil qualities, commands
    it to leave, and says he is journeying to Pohyola for feasting and carousal.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
