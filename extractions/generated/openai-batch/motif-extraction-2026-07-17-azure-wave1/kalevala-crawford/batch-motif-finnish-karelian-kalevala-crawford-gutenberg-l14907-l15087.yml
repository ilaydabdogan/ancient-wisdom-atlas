canonical_text:
  quote: ''
  summary: Lemminkainen and his mother debate his intended journey to Pohyola/Sariola.
    He claims he can defeat or evade successive dangers by magic, armor, and weapons,
    while his mother warns of wolf and bear guardians, a serpent-filled iron-and-steel
    fortification, enchanted warriors, an earlier near-fatal passage through deadly
    waters, and a courtyard of stakes for heroes' heads. He rejects her counsel, arms
    himself in copper mail, takes his father's magic sword, tests it, and boasts that
    none in Pohya or Sariola can match him.
  language: English
  quote_policy: summarized
