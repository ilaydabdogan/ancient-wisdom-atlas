canonical_text:
  quote: ''
  summary: The proem presents a first-person singer preparing to chant ancient inherited
    songs with a dear brother or companion. The singer names family, legendary figures,
    natural forces, and stored boxes of songs as sources of ancestral wisdom, asks
    to open the boxes and receive barley beer, and introduces Wainamoinen as a wise
    enchanter born from Ether's daughter. Rune I begins with the Daughter of the Ether
    living alone in heaven, descending to the ocean, being tossed by storm-wind and
    waves, conceiving through a union of force and beauty, and wandering in long watery
    travail as a water-mother before the delivery of her first-born.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The first-person speaker says an inward urging makes him ready to sing and
    chant an ancient national folk-song.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker invites a golden friend and childhood brother to sing and chant
    forgotten legends with him, clasping hands so they may remember.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The songs are described as taught in childhood, preserved from distant ages,
    connected with named legendary figures and places, and transmitted by the speaker's
    father and mother.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Incantations and other legends are said to come from waysides, copses, forest
    branches, pine-trees, vines, flowers, cold, rain, winds, birds, waves, waters,
    and the whole creation.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker describes sentences made by trees as gathered into bundles, brought
    to his dwelling, and stored in copper-lined boxes.
  category: object
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker asks whether to open boxes of wondrous stories and unfasten a
    ball of ancient wisdom, then requests barley beer and strong beer to sustain the
    singing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Wainamoinen is described as solitary like the night, Moon, and Sun, and as
    a renowned wise enchanter born from everlasting Ether and from Ether's daughter.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: In primeval times the Daughter of the Ether lives for ages in heaven and the
    expanses of air above the sea-foam, grows weary and lonely, and descends to the
    ocean where waves serve as her coach and pillow.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: An eastern storm-wind agitates the ocean, sprays the stars, tosses the maiden
    with waves and salt-sea forces, and the passage describes conception as a union
    of force and beauty.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: After conception the maiden cannot rise above the water; she wanders and labors
    for seven hundred years as a water-mother, swimming in all directions before her
    first-born is delivered.
  category: sequence
  evidence_refs:
  - ev:9
