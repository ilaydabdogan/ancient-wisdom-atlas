canonical_text:
  quote: I will play for my creator, / Sing in melody and concord
  summary: Wainamoinen's fish-bone harp is tried by young and old players, by Lemminkainen,
    and by people of Pohyola, but all produce discord. A blind gray-beard complains
    and advises that the harp be cast into water or returned to its maker. The harp
    speaks, refusing the water and saying it will play for its creator. Returned to
    Wainamoinen, the harp produces joyful music that attracts Northland people, forest
    animals, forest beings, birds, and daughters of the sky.
  language: English
  quote_policy: quoted
