canonical_text:
  quote: ''
  summary: A gray-pike swallows the Fire-fish and suffers burning torment. Wainamoinen
    and Ilmarinen, aided by maidens, brothers, fathers, mothers, and other people
    of Wainola, make and repeatedly use nets to catch the Fire-fish or Fire-pike.
    A first net fails. Wainamoinen then seeks flax for a stronger net; flaxseed is
    found in Tuoni's kingdom, sown in ashes near the Alue lake, grows overnight, and
    is processed into a large magic net. Repeated fishing across waters catches many
    ordinary fish but not the Fire-fish within this passage.
  language: English
  quote_policy: summarized
