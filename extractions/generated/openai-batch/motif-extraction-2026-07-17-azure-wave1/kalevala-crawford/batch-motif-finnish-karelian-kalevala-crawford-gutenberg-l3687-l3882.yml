canonical_text:
  quote: ''
  summary: Youkahainen, moved by envy, prepares a crossbow and poisoned arrows to
    kill Wainamoinen. His mother forbids the killing, identifying Wainamoinen as kin
    and warning that joy, song, and wisdom would vanish. Youkahainen ignores her,
    shoots three arrows, misses with the first two, and strikes Wainamoinen's magical
    steed with the third. Wainamoinen falls into the sea, is driven far from land
    by a storm-wind, and later swims for many days before lamenting that he left home
    and kin for a maiden and now wanders in the vast waters.
  language: English
  quote_policy: summarized
