canonical_text:
  quote: ''
  summary: The Northland daughter rejects marriage for riches and favors Ilmarinen
    over Wainamoinen. Wainamoinen arrives with a magic vessel and proposes, but she
    refuses him. Ilmarinen then comes to Pohyola, refuses drink until he sees the
    maiden, and is told by the hostess that he can win her only by magically plowing
    the serpent-field of Hisi. He reminds the maiden of her oath after he forged the
    Sampo; she advises him to forge a golden, silver, and copper plow. Ilmarinen forges
    the plow and protective iron gear, harnesses a fiery horse, enters the viper-filled
    field, and commands the serpents away while invoking Ukko.
  language: English
  quote_policy: summarized
