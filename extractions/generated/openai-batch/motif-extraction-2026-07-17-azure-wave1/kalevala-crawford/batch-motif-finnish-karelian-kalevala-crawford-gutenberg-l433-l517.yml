canonical_text:
  quote: ''
  summary: The passage recounts a lake named Eim leaving a violent borderland with
    its fish, rising through the air and among the stars, then settling elsewhere
    to fertilize fields. It then describes Finnish water-deities, especially Ahto
    and his sea-palace, a knife-reward tale involving an honest shepherd, minor water-people
    including Pikku Mies, and earth and agricultural deities including Maa-em/Maan-emo
    and Wirokannas.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Violent men lived by the lake’s borders, neglected the watered meadows and
    fruitful fields, and robbed and murdered until the lake’s waves were darkened
    with blood.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The lake Eim mourned, summoned all its fish, and rose into the air with them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Robbers expected to gather the lake’s fish and treasures, but found only snakes,
    lizards, and toads on the lake-bottom after the lake departed.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Eim rose higher through the air, was perceived by humans as bad weather or
    a white swan, hovered among the stars through the night, and was seen sinking
    in the morning.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A voice from the waters told reapers to leave with their harvest because the
    lake would dwell beside them; after being welcomed, the lake settled and made
    the neighborhood fruitful.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ahto is described as the chief water-god or Wave-host, living with his spouse
    Wellamo at the bottom of the sea in Ahtola, a palace in the chasms of the Salmon-rocks.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ahto possesses fish in his dominions and the Sampo, a talisman of success,
    which Louhi dragged into the sea while trying to regain it from the heroes of
    Kalevala.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: Ahto is described as eager for others’ treasures and often unwilling to return
    them, but also capable of generosity.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: A shepherd lad dropped his knife into a stream; Ahto brought up gold and silver
    knives first, which the boy refused as not his, then brought up the true knife,
    and finally gave him all three knives for honesty.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: Other water-hosts, collectively called Ahtolaiset or Water-people, are said
    to inhabit seas, rivers, lakes, cataracts, and fountains; some named examples
    are Allotar, Koskenneiti, and Melatar.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:11
  text: Pikku Mies emerged from the sea in copper clothing with a copper hatchet,
    grew from a pigmy into a gigantic hero, and felled a primitive oak-tree that had
    blocked sunlight from Northland.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: Water-deities are generally described as helpful and kind, although Wetehilien
    and Iku-Turso are said to enjoy annoying and destroying others.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:13
  text: The earth is described as formerly regarded by the Finlanders as a godlike
    existence with personal powers and as a beneficent mother bestowing peace and
    plenty on worthy worshipers.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:14
  text: Maa-em and Maan-emo are names given to the Finnish Demeter; the goddess is
    powerful, may help sufferers after invocation, and is said by some mythologists
    to be espoused to Ukko.
  category: relationship
  evidence_refs:
  - ev:12
  - ev:13
- id: obs:15
  text: Wirokannas is the only minor plant-governing earth-deity named as appearing
    in The Kalevala; he baptizes Mariatta’s infant son and later fails in an attempt
    to slay the Finnish Taurus.
  category: action
  evidence_refs:
  - ev:14
