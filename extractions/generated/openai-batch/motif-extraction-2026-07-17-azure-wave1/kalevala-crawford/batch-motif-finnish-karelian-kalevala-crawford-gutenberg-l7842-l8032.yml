canonical_text:
  quote: ''
  summary: Lemminkainen's mother searches for her missing son, questions trees, pathways,
    the Moon, and the Sun, learns from the Sun that he has died in the waters of Tuoni
    and Manala, obtains a magic metal rake from Ilmarinen, asks the Sun to quiet Tuoni's
    realm, rakes the death-river until she recovers Lemminkainen's incomplete body,
    and declares that she will revive him; a raven tells her the fragments cannot
    be revived and advises casting the dead into Tuonela's waters.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The mother seeks her lost son and hero through fenlands, forest thickets,
    marshes, sea-coast, and waters, and initially does not find him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The mother asks the trees, and the forest replies that it has its own cares,
    including being felled, chopped, and burned as fuel.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The mother questions the pathways about Lemminkainen; the pathways answer
    that they are too burdened, being trodden by animals, carts, dogs, heroes, and
    armies.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The mother asks the Moon whether it has seen Kaukomieli; the Moon answers
    that it has its own long journey and misfortunes and cannot watch the hero.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The mother asks the Sun whether it has seen Lemminkainen, and the Sun answers
    that Lemminkainen died in Tuoni's river, in Manala's waters, and sank to Tuonela
    and Manala's lower regions.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The mourning mother goes to Ilmarinen's forge and asks the immortal blacksmith
    to forge a rake with a copper shaft, strong metal teeth a hundred fathoms long,
    and a handle five hundred fathoms long.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Ilmarinen makes the requested rake.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The mother takes the magic rake to the river of Tuoni and prays to the Sun
    for magical heat, warmth, strength, courage, and the quieting of Manala and Tuoni's
    empire.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Sun shines three times with increasing power, lulls the people of Manala
    and armed men of Tuoni's empire, then returns upward to its Jumala home and kingdom.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The mother rakes the Tuoni river bottoms, cataract, whirlpool, current, and
    death-stream; after finding clothing and footwear, she draws up Lemminkainen's
    body in the metal rake.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: Lemminkainen's body is recovered from the Manala lake and river, but many
    fragments and life itself are missing; the mother says she will bring her hero
    to life with magic.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A raven tells the mother that the fragments cannot be revived, says eels and
    whiting have fed on the body, and advises casting the dead into Tuonela's waters
    so he may become a sea animal.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: The passage identifies Lemminkainen as the mother's son, her hero, Kaukomieli,
