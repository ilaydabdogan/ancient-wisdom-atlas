canonical_text:
  quote: ''
  summary: Wainamoinen questions and releases the sea-monster Iku-Turso after it promises
    to return under the sea and not appear again. Ukko raises a violent storm that
    endangers Wainamoinen's vessel and causes his fish-bone magic harp to be carried
    below the waves by Ahto's people. Wainamoinen and Ilmarinen lament, then Wainamoinen
    commands the sea, Ahto, Wellamo, and the storm-winds to let the boat pass. Lemminkainen
    invokes eagle and raven feathers for protection, and the heroes repair the sinking
    vessel by magic. Louhi arms Pohyola's forces and sails after the heroes to re-take
    the Sampo; Lemminkainen climbs the mast and, after repeated scanning, sees the
    pursuing boat.
  language: English
  quote_policy: summarized
