canonical_text:
  quote: ''
  summary: Wainamoinen's harp-song gathers human listeners, animals, water-dwellers,
    plants, and places in wonder. Louhi hears of Wainola's prosperity from the ruins
    of the Sampo and seeks destruction for Kalevala's people by invoking Ukko. Lowyatar,
    blind daughter of Tuoni and source of evils, is impregnated by the East-wind,
    suffers obstructed labor, and is directed by Ukko to Pohyola, where Louhi receives
    her and performs secret birth-aid and invocations.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Human groups in Wainola and Northland leave their activities, hasten to hear
    Wainamoinen's harp, and declare that they have never heard such music.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The harp's tones echo through seven hamlets and seven islands, and every creature
    of Northland hastens to look and listen.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Woodland beasts fall on their knees, forest birds perch and sing, water-dwellers
    leave beds, caves, and grottoes, and small things of nature come to hear the music.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wainamoinen plays for three days in halls, cabins, and dwellings until floors,
    ceilings, roofs, windows, portals, and hearth-stones respond with sound or motion.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: As Wainamoinen wanders through forests and open land, trees bend or wave,
    hills echo, and flowers and shrubs respond to his music.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Louhi hears that Wainola lives and prospers and that wealth increases through
    the ruins of the Sampo; she becomes wrathful and considers destruction for Wainola
    and Kalevala.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Louhi prays to Ukko to slay Wainola's people by iron hail, lightning-tipped
    arrows, or sickness.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Lowyatar is described as the blind daughter of Tuoni, a Death-land woman,
    and the source of evils, ills, and plagues of Northland.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:9
  text: Lowyatar makes a couch by the wayside, turns toward stormy and morning winds,
    and becomes heavy-laden through impregnation by the East-wind.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: Lowyatar bears her burden through suffering and attempts labor by mountain
    springs, fountains, crystal waters, a sacred stream and whirlpool, and a fire-stream,
    but the burden does not lighten.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: Ukko speaks from heaven and tells Lowyatar to go to a triangle in Swamp-field
    near the ocean border in Sariola, where the Laplanders will welcome her children.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Lowyatar travels northward to Pohyola and to Louhi's ancient halls to lay
    down her burdens and leave her offspring.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Louhi receives Lowyatar, leads her secretly to bath-rooms, pours barley beer,
    lubricates bolts and hinges, and instructs her to fetch sea-foam and mermaid honey
    for anointing.
  category: action
  evidence_refs:
  - ev:10
- id: obs:14
  text: Louhi says that if the measures are ineffective, Ukko should come with a golden-colored
    sceptre, charm away opposing forces, strike pillars, and open resisting portals.
  category: speech
  evidence_refs:
  - ev:11
