canonical_text:
  quote: Honey-paw was born in ether, / In the regions of the Moon-land,
  summary: Wainamoinen and his people ceremonially welcome Otso the bear as an honored
    forest guest, lead him toward the dining hall and hearth, pray to Ukko for peace
    and plenty, prepare and display bear meat for a feast, invite forest beings to
    Otso's marriage-feast, and recount Otso's sacred origin from sky, water-borne
    wool and hair, and Mielikki's tree-top nurturing.
  language: English
  quote_policy: quoted
