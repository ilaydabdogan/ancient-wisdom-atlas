canonical_text:
  quote: ''
  summary: Wainamoinen's vessel stops in open water because it is caught on a mighty
    pike. Lemminkainen and Ilmarinen fail to free or kill the monster, while Wainamoinen
    kills and cuts it apart. The pike is cooked and eaten, and Wainamoinen later fashions
    a magic harp from its bones and teeth, with strings from Lempo's stallion, attracting
    the people to view it.
  language: English
  quote_policy: summarized
