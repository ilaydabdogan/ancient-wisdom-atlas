canonical_text:
  quote: ''
  summary: In a wedding-song passage, the household and community at Ilmarinen's home
    in Wainola wait for his winter return by snow-sledge from Sariola/Pohyola with
    his bride. Lakko welcomes the bridegroom and bride, recalls anxious waiting, frames
    the wooing journey as successful, invites the bride to cross the household threshold
    into her new kinship home, and joins a final hail to Wainola, moonlight, Ukko,
    the wedding train, and the bride.
  language: English
  quote_policy: summarized
