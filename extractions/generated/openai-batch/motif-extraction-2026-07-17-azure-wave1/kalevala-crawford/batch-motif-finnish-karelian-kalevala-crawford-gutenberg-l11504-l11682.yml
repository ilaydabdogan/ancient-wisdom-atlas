canonical_text:
  quote: ''
  summary: Louhi seeks a capable singer to praise the wedding beer; animal and child
    candidates fail, and the beer threatens to burst its vessels unless honored in
    song. Louhi sends a servant to invite many groups to her daughter's wedding, including
    Wainamoinen, but explicitly excludes Lemminkainen/Ahti because he is considered
    dangerous and disruptive. The servant carries out the invitations. At the wedding
    feast, Louhi sees Ilmarinen arriving with attendants, recognizes him as the bridegroom,
    describes his horse and ornaments, and orders that he be welcomed.
  language: English
  quote_policy: summarized
