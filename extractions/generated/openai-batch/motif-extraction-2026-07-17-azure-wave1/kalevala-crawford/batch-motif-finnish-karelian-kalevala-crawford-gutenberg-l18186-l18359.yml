canonical_text:
  quote: ''
  summary: A cattle-protecting speaker addresses Otso the bear, recalling pledges
    and proposing a treaty that separates bear food from cattle pasture. The speaker
    invokes Ukko and Knippana to protect the herd by magic, misdirection, and the
    restraint of forest dogs. The wife of Ilmarinen then places the herd in Kullervo’s
    care, and Kullervo drives the cattle to pasture while lamenting his misfortune.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speech recalls former pledges made at the river of Tuoni, near a waterfall
    and whirlpool, in the hearing of the Creator.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Otso is said to have been granted three summer approaches to the land of cow-bells,
    but not permission to begin wicked or evil action.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Otso is instructed to redirect malice and hunger toward mountains, trees,
    fungus, ant-hills, roots, and honey rather than the grass eaten by the herd.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The speaker proposes a lasting treaty in which both parties may enjoy the
    woods in common while keeping their food distinct.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: If Otso breaks the treaty and comes to the golden cattle, the people threaten
    to kill him with cross-bows, including the weapons of archer-women and the hostess.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The speaker entreats Ukko to metamorphose the cattle by magic into stumps
    and stones if the enemy wanders near the herd in summer.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Otso is directed toward other hills, honey-pastures, mountains, Lapland, Tuonela,
    and Kalma, and the speaker asks groves and mountains to grant peace and plenty
    to the cattle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Knippana is asked to block his dogs’ scent and sight so that they do not detect
    the cattle.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The speaker asks that the forest dogs be driven away, hidden in caverns, tied
    with fetters and chains, muzzled, ringed, and chained so that they cannot injure
    the herd.
  category: action
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:10
  text: The wife of Ilmarinen opens her yards and stables, leads her herd across the
    meadow, and places it in Kullerwoinen’s keeping.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Kullervo places his luncheon in a basket, drives the herd to mountain and
    woodland pastures, and says that he is poor, hapless, troubled, and forced to
    wander as a watch-dog for the cattle.
  category: action
  evidence_refs:
  - ev:9
