canonical_text:
  quote: ''
  summary: News spreads of Aino's flight and death. Wainamoinen grieves, asks Untamo
    where the water-beings and Wellamo's maidens dwell, goes fishing near their waters,
    catches a magic fish, and attempts to prepare it for food. The fish speaks, identifies
    itself as Aino and as a mermaid of Wellamo, refuses to return after being mishandled,
    dives away, and is not caught again despite Wainamoinen's further search.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Tidings travel that Aino, described as Youkahainen's sister and fairest daughter
    of creation, has fled and died.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wainamoinen weeps repeatedly because Aino has departed, vanished, and sunk
    into the deep blue sea.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wainamoinen asks Untamo where the water-gods may linger and where Wellamo's
    maidens may rest.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Untamo answers that the sea-maids live on a verdant headland, a forest-covered
    island, in deep waters, sea-side chambers, water-caverns, and sea-cliffs.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wainamoinen gathers hooks, lines, poles, and nets, places them in a copper
    boat, rows to the island/headland, and begins angling.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: After angling for many days and nights, Wainamoinen catches a fish of magic
    powers and lands it in his copper boat.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Wainamoinen describes the caught fish as unlike ordinary fish and also unlike
    fully recognizable sea-born maidens or mermaids.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:8
  text: Wainamoinen draws a silver-sheathed fish-knife intending to carve, dress,
    roast, and eat the fish at several meals.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: When Wainamoinen touches the fish with the silver knife, it leaps from the
    boat and dives under the sea surface.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: The fish rises at a distance, speaks to Wainamoinen, and chides him that it
    did not come to be caught, cut up, and eaten.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The speaking fish says it came to rest in Wainamoinen's arms, become his life-companion
    and wife, and perform household tasks for him.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The fish denies being an ordinary fish and identifies itself as a young maiden,
    friend and sister of fishes, Youkahainen's youngest sister, and Aino.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: Aino says Wainamoinen lacked judgment, did not know enough to keep her, tried
    to kill her with his fish-knife, and that she is a mermaid of Wellamo who was
    once Aino.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:14
  text: When Wainamoinen begs Aino to come again, the mermaid answers that Aino's
    spirit will never again fly to him to be ill-treated.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:15
  text: The water-maiden dives to many-colored pebbles and rainbow-tinted grottoes
    where mermaids live.
  category: action
  evidence_refs:
  - ev:15
- id: obs:16
  text: Wainamoinen draws his silken net through many waters and catches many fish,
    but he does not catch the sea-maid or Wellamo's water-maiden.
  category: action
  evidence_refs:
  - ev:16
