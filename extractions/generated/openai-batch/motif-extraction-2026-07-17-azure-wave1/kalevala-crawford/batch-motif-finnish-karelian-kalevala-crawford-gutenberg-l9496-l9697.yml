    doctrine, and prepares to leave the body and bosom of Wipunen.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wipunen says he has eaten many animals, a man, and a hero, but never anything
    like Wainamoinen; he acknowledges that Wainamoinen has found the desired three
    words and blesses his departure.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Wipunen opens his mouth, and Wainamoinen leaves Wipunen's abdomen through
    the mouth, returning toward Wainola and Kalevala.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Wainamoinen goes to Ilmarinen's smithy, where Ilmarinen asks whether he has
    found the wisdom and magic needed to finish the ship; Wainamoinen answers that
    he has learned many incantations and found the lost words.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Wainamoinen fastens the ledges, binds the stern, completes the forecastle,
