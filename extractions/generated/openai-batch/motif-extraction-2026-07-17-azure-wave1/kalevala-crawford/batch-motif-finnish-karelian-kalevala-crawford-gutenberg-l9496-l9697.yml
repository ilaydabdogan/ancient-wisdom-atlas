canonical_text:
  quote: ''
  summary: After learning the lost magic words and secret doctrine from within Wipunen,
    Wainamoinen exits through Wipunen's mouth, returns to Kalevala, reports his knowledge
    to Ilmarinen, and completes a magic vessel as a dowry task. A new rune begins
    with Wainamoinen preparing and sailing the vessel north toward Pohyola to woo
    the rainbow-associated maiden. He invokes Ukko, winds, and waves for aid. Annikki,
    standing on the seashore, sees the distant vessel, guesses what it might be, recognizes
    it as Wainamoinen's magic ship, and asks where he is going.
  language: English
  quote_policy: summarized
