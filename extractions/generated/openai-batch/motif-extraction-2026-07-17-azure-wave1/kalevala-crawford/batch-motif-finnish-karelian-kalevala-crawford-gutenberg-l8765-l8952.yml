canonical_text:
  quote: ''
  summary: Wainamoinen is ferried alive across the fatal river to Manala. Tuonetar
    offers him Tuoni's beer, which he refuses after seeing poisonous creatures in
    it. He explains that he seeks lost master-words for completing a vessel, but Tuonetar
    says the words will not be given and that he will not leave. She puts him to sleep
    while net-makers and Mana's son set iron and copper nets across the river. Wainamoinen
    wakes, changes form into a serpent-like body, passes through the nets, escapes
    Tuonela, thanks Ukko, and warns others not to cross the death-river. He then teaches
    the people of Kalevala moral prohibitions and describes punishments in Manala
    for the wicked.
  language: English
  quote_policy: summarized
