canonical_text:
  quote: ''
  summary: A bride laments her imminent departure from her father's home to her husband's
    people. An old maiden recalls earlier warnings about suitors and predicts hardship,
    censure, servitude, and loss in the husband's household. The bride's natal family's
    affectionate names are contrasted with insulting names expected from affinal kin.
    The passage describes marriage as an exchange of kin, home, waters, and landscapes,
    and closes by contrasting the happy maiden at her father's fireside with married
    women likened to prisoners held in bondage.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'The bride says her long-held wish is fulfilled, yet her departure is near:
    one foot is on her father''s threshold and the other is set for the journey with
    her husband to his people.'
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The bride says she cannot leave her old home, kindred, father's guidance,
    and mother's counsel with gladness, and describes herself as a sorrowful maiden
    going heavy-hearted to the bridegroom.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The bride contrasts herself with other brides of Northland heroes, saying
    they do not leave unhappy while she must weep and carry sadness.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The bride contrasts happy maidens with images of spring dawn and summer sun,
    while describing her own heart as terrified and her future as dreary.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: An industrious old maiden who guards home and kindred speaks words of doubtful
    comfort to the bride.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The old maiden says she taught the bride not to joyfully seek suitors, heed
    wooers, or look into charmers' eyes.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The old maiden associates the charming suitor with Lempo on his forehead and
    Tuoni in his mouth.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:8
  text: The old maiden says her former advice was to reject becoming a second daughter,
    living with a husband's mother, leaving the father, entering bondage, becoming
    a servant, or submitting to a husband.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The old maiden says the bride ignored counsel and hastened to the suitor's
    snow-sledge, the husband's bear-dens, his native country, and bondage under his
    people and mother.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The old maiden predicts hard teachings from the master, bridles and shackles
    for the bride, censure from the second father, harsh treatment from his wife,
    and cold or haughty treatment from other affinal kin.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: In her natal home, the bride is described as a jewel and her father's pride;
    her father calls her Moonlight, her mother Sunshine, her brother Sea-foam, and
    her sister Flower.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:12
  text: In the husband's household, the second mother is predicted to censure rather
    than praise the bride, and affinal kin are predicted to call her Brush-wood, Sledge
    of Rags, Flight of Stairs, and Scare-crow.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:13
  text: The bride is told she will wish she had ascended as steam, risen as smoke,
    or vanished as sparks, yet she cannot return like a bird to its nest, die like
    leaves, perish as sparks, or vanish like smoke.
  category: other
  evidence_refs:
