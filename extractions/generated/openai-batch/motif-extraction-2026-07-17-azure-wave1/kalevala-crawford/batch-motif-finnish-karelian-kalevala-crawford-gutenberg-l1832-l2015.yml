canonical_text:
  quote: ''
  summary: Wainamoinen clears a forest, spares a birch for birds, and an eagle from
    heaven burns the remaining trees while the birch survives. Wainamoinen sows seven
    barley grains in ash-enriched soil, invokes the earth-mother and Ukko for fertility
    and rain, and Ukko sends clouds and rain so the barley grows. A cuckoo rests in
    the spared birch, and Wainamoinen asks it to sing for forest growth, barley ripening,
    Northland's richness, and Kalevala's joy. The passage then begins Rune III by
    describing Wainamoinen as a famous wisdom-singer whose reputation reaches Youkahainen,
    a young Lapland minstrel.
  language: English
  quote_policy: summarized
