  summary: Wainamoinen and Ilmarinen set out to investigate a fallen heavenly fire.
    They cross a river, meet Ilmatar, and hear her account of the Fire-child's destructive
    descent, its burning of people and land, its entry into the waters, and its containment
    through a chain of fish swallowing one another.
  language: English
