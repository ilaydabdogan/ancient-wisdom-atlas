canonical_text:
  quote: ''
  summary: Ilmarinen brings a golden and silver bride-image to Wainamoinen, who rejects
    it and publicly warns against choosing or bowing to such metal images. Ilmarinen
    lays aside the image, journeys north to Pohyola/Sariola to seek Louhi's younger
    daughter, reports the death of the former Bride of Beauty in Tuonela/Manala, and
    is refused by Louhi. He then approaches the daughter directly; a speaking babe
    warns against him, and the daughter refuses him. Ilmarinen angrily seizes the
    maiden, places her in his sledge, and drives away while she weeps and threatens
    to break the sledge if not freed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Ilmarinen brings a virgin or image to Wainola/Kalevala and asks Wainamoinen
    to make the maiden suitable for his declining years.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Wainamoinen identifies the maiden as a bride of molten gold and silver, rejects
    her for himself and his people, and says he will never wed an image or metal maiden.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wainamoinen calls his people together and tells every child of Northland never
    to bow before an image of molten gold and silver or choose a bride created from
    metal.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Ilmarinen lays aside the golden image, harnesses his horse to a birch-wood
    sledge, and travels north toward Pohyola to woo the second daughter of the Northland.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Louhi asks Ilmarinen how her child, the Bride of Beauty, is living; Ilmarinen
    answers that the Maiden of the Rainbow sleeps in death in Tuonela/Manala and asks
    for Louhi's youngest maiden.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Louhi refuses to give her youngest daughter to Ilmarinen and says she would
    sooner give the maiden to cataract, whirlpool, the river of Manala, or the waters
    of Tuoni.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Ilmarinen enters the inner court-room where the maiden sits and asks her to
    come to his cottage, describing domestic tasks formerly done there by her sister.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A babe lying on the floor tells Ilmarinen to leave and warns the maiden not
    to welcome him, describing him with wolf-teeth, fox-claws, bear-claws, and a hungry
    dagger.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The daughter refuses to follow Ilmarinen, calls him an unworthy suitor, accuses
    him of slaying the Bride of Beauty, and says she deserves a better husband and
    home.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: Ilmarinen becomes angry, seizes the trembling maiden, takes her from Louhi's
    court to his sledge, wraps her in fur-robes, and drives homeward while holding
    her.
  category: action
  evidence_refs:
  - ev:9
- id: obs:11
  text: The abducted maiden weeps, asks to be left to sink and perish near lowland
    berries and water-border herbs, and threatens to break the sledge and throw away
    the fur-robes if Ilmarinen does not free her.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Ilmarinen answers that his snow-sledge is hooped with iron and therefore the
    maiden will not break it to fragments.
  category: object
  evidence_refs:
  - ev:9
