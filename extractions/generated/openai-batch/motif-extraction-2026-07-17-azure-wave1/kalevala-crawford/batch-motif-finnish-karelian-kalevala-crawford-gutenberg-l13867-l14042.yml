canonical_text:
  quote: ''
  summary: Pohyola's daughter says farewell to her family, homestead, animals, waters,
    fields, forests, and childhood places as she leaves Sariola with her husband Ilmarinen.
    She imagines a future return in which parents are buried and people no longer
    recognize her, though animals and landmarks may. A children's chorus laments that
    a bird of evil has taken the maiden. Ilmarinen then drives her homeward in a snow-sledge
    toward Wainola and his forge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker announces parting from her father's firesides, brother's hearth-stone,
    sister's chambers, mother's dwelling, and the surrounding swamps, valleys, mountains,
    lakes, rivers, shores, fields, forests, and birch-tree.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says she leaves childhood friends and journeys southward with
    her husband toward Night and Winter over ice-grown northern seas.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: The speaker imagines a future visit in which her mother would not hear her
    and her father would not see her because she would be calling and weeping at their
    graves.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The speaker imagines returning to Sariola and receiving no welcome except
    perhaps from osiers by a fence and a landmark she planted as a small child.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The speaker says her mother's cattle, father's horses, and brother's dogs
    may know and welcome her, while the people will not know her even though fords,
    rivers, and fish-nets remain unchanged.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The speaker gives farewell greetings to the homestead, halls, portals, gardens,
    fields, groves, berries, meadows, fences, lakelets, islands, streams, hills, valleys,
    trees, grasses, barley, and childhood scenes.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The narrator identifies the departing woman as Pohyola's daughter and says
    she leaves her native fields and darksome Sariola with her husband Ilmarinen,
    famous son of Kalevala.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The youth and children sing that a bird of evil came from the forest, stole
    away their virgin, won the Maid of Beauty, took their fairest flower and mermaid,
    and won her with youth, beauty, and keys of ancient wisdom.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: The children's chorus says buckets, fish-poles, matting, halls, copper goblets,
    and pitcher handles will now be idle, unswept, unburnished, or dark after the
    maiden's departure.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Ilmarinen, called the happy bridegroom, hastens homeward with the daughter
    of the hostess of Pohyola in a fast snow-sledge pulled by a steed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: The sledge journey passes Northland waters, Honey-inlet, and Sandy Mountain,
    lasts through a third day, and ends as the blacksmith's furnace, Ilmarinen's dwelling,
    smoke, Wainola, and the suitor's forge and smithy appear.
  category: sequence
  evidence_refs:
  - ev:8
