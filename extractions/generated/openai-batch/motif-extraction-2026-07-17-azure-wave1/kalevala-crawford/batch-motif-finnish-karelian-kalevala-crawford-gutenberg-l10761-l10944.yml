canonical_text:
  quote: ''
  summary: An eagle enters a maiden's castle, seizes the Maid of Beauty, and carries
    her away. The hostess of Pohyola questions a young child about how he learned
    of the maiden; he reports seeing her grinding, dyeing, and weaving. The hostess
    laments that her daughter did not conceal her beauty and says she had planned
    hidden workrooms away from suitors. The child replies that a maiden cannot be
    kept hidden on land or water. Wainamoinen returns home as a rejected old suitor
    and issues an admonition against old men competing with younger men in wooing.
    The next rune opens with songs of Ilmarinen's marriage to the Maiden of the Rainbow
    and preparations for a large wedding feast in Pohyola/Sariola under Louhi's orders.
  language: English
  quote_policy: summarized
