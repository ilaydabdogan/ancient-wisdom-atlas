canonical_text:
  quote: ''
  summary: A speaker threatens an evil being with banishment to remote Northland,
    a fiery whirlpool, and Manala beyond Death-river. Wainamoinen then tells old Wipunen
    that he will remain inside Wipunen's body and work a forge there until he obtains
    lost incantations. Wipunen opens his store of ancient knowledge and sings origins
    of creation, celestial bodies, and wisdom with such force that heavenly bodies
    and waters stop to listen.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A speaker threatens to banish the addressee to Northland, Lapland, and the
    dead plains of Pohyola, described as sunless, moonless, starless, lifeless, and
    dark.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A speaker threatens to send the addressee to the cataract of Rutya, a fire-emitting
    whirlpool with foam and boiling waters.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: A speaker threatens to drive the addressee to Tuoni's coal-black river, the
    stream of Mana, and Manala, where return is barred by nine brother-rams, nine
    brother-bulls, nine brother-stallions, and Death-river set with iron netting and
    copper threads.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Evil Hisi is said to have a charger with crimson mane, tail, and foretop;
    fire comes from its nostrils, its hoofs are iron, and its legs are steel and copper.
  category: object
  evidence_refs:
  - ev:4
- id: obs:5
  text: The speaker offers Lempo's snow-shoes, Hisi's elm-wood shoes, and Piru's staff
    for a journey into Hisi's courts and castles and to the woods and fields of Juutas.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: The speaker commands a thing of evil, monster, plague of Northland, fiend
    of Sariola, and hound without a master to leave the speaker's body before dawn
    and before the Moon withdraws.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker threatens to send eagles' talons and vultures' beaks to devour
    the evil body and to hurl its skeleton to Hisi.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The speaker says cruel Lempo left the speaker's vitals more quickly when commanded
    and when the speaker called on Ukko and the Creator.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: Wainamoinen tells old Wipunen that he is satisfied to remain in Wipunen's
    old and spacious caverns, using Wipunen's tissues, heart, spleen, liver, and blood
    as food and drink.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: Wainamoinen says he will set his forge and bellows deeper in Wipunen's vitals
    and swing a hammer on Wipunen's heart, lungs, and liver until he learns Wipunen's
    incantations, wisdom-sayings, and lost words.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Wainamoinen says the words must never be hidden and the earth must never lose
    this wisdom even if the wisdom-singers perish.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: Old Wipunen, called a wise magician and ancient prophet, opens a store of
    knowledge containing old-time incantations, primeval songs, ancient wit, and wisdom.
  category: action
  evidence_refs:
  - ev:9
- id: obs:13
  text: Wipunen sings the oldest folk-songs, the origin of witchcraft, Earth and its
    beginning, the first creations, and the source of good and evil.
  category: action
  evidence_refs:
  - ev:9
- id: obs:14
  text: Wipunen sings that, by the will of Ukko and command of the Creator, air was
    divided, water came from ether, earth arose from water, and vegetation, fish,
    fowl, man, and hero came from earth.
  category: action
  evidence_refs:
  - ev:10
- id: obs:15
  text: Wipunen sings how the Moon was created, the Sun was set in heaven, the colors
    of the rainbow arose, the ether's crystal pillars originated, and the skies were
    sprinkled with stars.
  category: action
  evidence_refs:
  - ev:11
- id: obs:16
  text: Wipunen's song is described as miraculous, concordant, wise, numerous, and
    swift as serpents' tongues; distant hills re-echo it.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:17
  text: Wipunen sings for three days and through the nights while stars listen, the
    Moon stands still, waves fall, tides cease rising, rivers stop, the Rutya waterfall
    stops, and Jordan and the Wuoksen cease flowing.
  category: sequence
  evidence_refs:
  - ev:12
