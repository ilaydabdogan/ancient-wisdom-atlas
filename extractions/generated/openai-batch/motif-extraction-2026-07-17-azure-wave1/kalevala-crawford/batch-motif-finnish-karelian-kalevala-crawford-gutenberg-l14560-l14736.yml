canonical_text:
  quote: ''
  summary: The passage praises the wedding bridegroom, the bride's childhood companion,
    and the assembled guests. Wainamoinen then leaves in his magic copper sledge while
    singing charms, but the sledge is ruined. He asks whether anyone will go to Tuoni/Manala
    to obtain Tuoni's magic auger, but both young and old decline the dangerous journey.
    Wainamoinen himself goes to Deathland, crosses its dark stream, retrieves the
    auger, sings a forest into being, fashions a new magic sledge, harnesses his steed,
    and returns home to Kalevala.
  language: English
  quote_policy: summarized
