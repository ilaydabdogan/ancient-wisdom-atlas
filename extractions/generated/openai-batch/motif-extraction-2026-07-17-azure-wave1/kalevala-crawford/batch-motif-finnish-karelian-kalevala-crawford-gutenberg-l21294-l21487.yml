canonical_text:
  quote: ''
  summary: Louhi refuses to divide the Sampo with the heroes from Wainola. Wainamoinen
    threatens to take it by force, then uses magic harp-playing and singing to silence
    and put Northland to sleep. The heroes open the mountain stronghold, loosen the
    rooted Sampo with the help of an ox and plow, hide it in their war-ship, and sail
    away, intending to conceal it on a remote watery, forested place.
  language: English
  quote_policy: summarized
