canonical_text:
  quote: Death is a mystery and must always remain such.
  summary: 'The passage is a scholarly summary of proposed layers in the Gilgamesh
    Epic: the twelfth tablet is described as a later didactic addition about the fate
    of the dead; several episodes are listed as possible components of the epic tradition;
    and four main currents are said to flow together in the old Babylonian form, including
    Enkidu traditions, Gilgamesh traditions, nature myths, didactic tales, and their
    combination. The passage also assigns several episodes to Enkidu and Gilgamesh,
    interprets a solar nature myth and seasonal waning, and describes Enkidu as an
    older prototype whose traits are transferred to Gilgamesh.'
  language: English
  quote_policy: quoted
