canonical_text:
  quote: ''
  summary: The passage interprets Gilgamesh's search for renewal of life as a quest
    for immortality, links the Deluge episode with divine favor and seasonal rainy
    imagery, notes independent Sumerian and Akkadian deluge traditions, summarizes
    the episode of the rejuvenating plant stolen by a serpent, and describes the twelfth
    tablet's teaching that there is no escape from the netherworld.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gilgamesh's search for renewal of life is described as man's longing for eternal
    life, with the sun-god's waning power and winter used as images of aging and death.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: A favorite of the gods is said to have escaped a destructive deluge in which
    all mankind perished, and Gilgamesh seeks him to learn the secret of eternal life.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Utnapishtim is described as a human survivor of the Deluge who enjoys immortal
    life among the gods and tells Gilgamesh the story of universal destruction.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage states that only those singled out by the special favor of the
    gods can live forever at the distant source of the streams; the rest of mankind
    must face death.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Deluge story is associated with the eleventh tablet and the eleventh month,
    the month of rain curse, while Gilgamesh's rejection of Ishtar is associated with
    the sixth tablet and the sixth month.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage reports that Sumerian and Akkadian deluge stories exist without
    reference or connection to Gilgamesh.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Utnapishtim tells Gilgamesh of a magic plant growing in deep water that can
    restore old age to youth, and Gilgamesh finds and plucks it.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: Gilgamesh intends to take the plant back to Erech for general benefit, but
    while he bathes in a cool cistern a serpent snatches the plant, leaving his purpose
    unachieved.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The twelfth tablet is described as teaching that there is no escape from the
    netherworld after life ends, and that burial and care of the dead can secure only
    a relatively comfortable rest.
  category: other
  evidence_refs:
  - ev:8
- id: obs:10
  text: Gilgamesh invokes Enkidu's shade, which rises from the lower world and gives
    a discouraging reply to Gilgamesh's request to tell the law of the earth.
  category: action
  evidence_refs:
  - ev:9
  - ev:10
