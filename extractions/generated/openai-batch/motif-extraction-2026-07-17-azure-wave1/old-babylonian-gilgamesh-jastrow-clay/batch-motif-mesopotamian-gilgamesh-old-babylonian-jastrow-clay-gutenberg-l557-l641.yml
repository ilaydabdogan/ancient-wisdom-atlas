canonical_text:
  quote: ''
  summary: 'The passage summarizes preparations for Gilgamesh/Gish and Enkidu''s expedition
    against Huwawa of the cedar forest: weapons are forged, the elders of Erech warn
    Gilgamesh, Gilgamesh seeks Shamash''s favor, Enkidu is urged to lead because he
    knows the road, and rites involving water and libation are prescribed before the
    expedition begins. The passage then discusses Old Babylonian and Assyrian forms
    of the names Gish/Gilgamesh, Enkidu, and Huwawa/Hubaba, arguing that Huwawa is
    West Semitic and that the cedar forest likely points westward, especially toward
    Lebanon or the Amanus range.'
  language: English
  quote_policy: summarized
