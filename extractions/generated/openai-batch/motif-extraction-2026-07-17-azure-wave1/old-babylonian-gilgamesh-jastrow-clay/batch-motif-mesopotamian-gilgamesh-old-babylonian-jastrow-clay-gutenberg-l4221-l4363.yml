canonical_text:
  quote: ''
  summary: The passage is a scholarly commentary arguing that sabitum should be understood
    as an epithet for the seashore woman whom Gilgamesh reaches in his wanderings,
    namely an innkeeper or public woman. It interprets her speech as an invitation
    for Gilgamesh to stay with her rather than seek life elsewhere, and explicitly
    compares this invitation to the harimtu's temptation of Enkidu. The passage also
    discusses the Sumerian Sal Gestinna, the female wine-woman, and then gives technical
    corrections to Langdon's edition of the Pennsylvania Tablet.
  language: English
  quote_policy: summarized
