canonical_text:
  quote: ''
  summary: 'The passage describes physical features, editions, and likely provenance
    of two Old Babylonian tablets, then summarizes their contents: the Pennsylvania
    tablet concerns Gilgamesh and Enkidu meeting, conflicting, and reconciling, while
    the Yale tablet concerns preparations for an encounter with Huwawa, guardian of
    the cedar forest. It also summarizes Gilgamesh''s two dreams and Ninsun''s interpretations,
    which identify the dream figures and objects as foreshadowing Enkidu''s arrival.'
  language: English
  quote_policy: summarized
