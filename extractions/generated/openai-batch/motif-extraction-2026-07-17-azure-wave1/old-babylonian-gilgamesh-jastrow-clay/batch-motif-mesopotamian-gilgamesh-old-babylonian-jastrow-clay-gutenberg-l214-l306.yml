canonical_text:
  quote: ''
  summary: The passage is a scholarly introduction arguing that the Gilgamesh Epic
    and related Mesopotamian tales were given didactic meanings by temple-linked literary
    schools. It discusses lessons attached to the Deluge story, the twelfth tablet's
    concern with the fate and care of the dead, Sumerian evidence for Ishtar's descent
    and release, fragmentary Sumerian Gilgamesh episodes involving weapons, Humbaba/Huwawa,
    Erech, Enkidu, and Ishtar, and cautious claims about Sumerian and Akkadian literary
    relationships.
  language: English
  quote_policy: summarized
