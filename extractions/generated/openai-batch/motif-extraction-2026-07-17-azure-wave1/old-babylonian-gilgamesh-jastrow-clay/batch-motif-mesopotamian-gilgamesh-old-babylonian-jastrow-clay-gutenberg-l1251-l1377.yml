canonical_text:
  quote: ''
  summary: 'The passage summarizes and analyzes the Enkidu episode: Enkidu is described
    as a hairy animal-man living with animals; a hunter and his father plan to use
    a woman to draw him away from animal life; the woman captivates and transforms
    him; later textual additions connect him with Gilgamesh; and the Pennsylvania
    tablet preserves a version in which the woman clothes and instructs Enkidu, leads
    him to sheepfolds, introduces bread and wine, and he becomes a guardian of flocks.'
  language: English
  quote_policy: summarized
