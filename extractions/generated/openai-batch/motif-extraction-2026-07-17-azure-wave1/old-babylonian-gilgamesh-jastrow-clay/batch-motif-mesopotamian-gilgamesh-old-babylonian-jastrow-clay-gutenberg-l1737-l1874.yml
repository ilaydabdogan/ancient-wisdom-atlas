  summary: The passage compares the close association of Enkidu and Gilgamesh with
    the widespread Heavenly Twins or twin-companion motif, while emphasizing limits
    to that comparison. It then discusses literary differences between Old Babylonian
    and Assyrian versions of the Gilgamesh Epic, including variant names, independent
    recension, and differences in the presentation of Gilgamesh's dreams that foreshadow
    Enkidu.
