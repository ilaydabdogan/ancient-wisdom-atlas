canonical_text:
  quote: ''
  summary: 'A sequence of editorial notes compares or explains motifs and details
    connected with the Old Babylonian Gilgamesh material: Enkidu as a primitive-man
    figure, Gilgamesh as builder and judge, hero wandering in darkness, Deluge and
    creation-water myths, Ishtar''s lower-world mission, flood-survivor names, the
    Gilgamesh-Enkidu twin-brother motif, comparative companion pairs, primeval pairs,
    and a dream-mediated encounter between Gilgamesh and Enkidu.'
