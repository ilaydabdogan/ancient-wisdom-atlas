  summary: Scholarly notes discuss the pronunciation and etymology of Gilgamesh’s
    name, a proposed connection of the name with an axe, visual depictions of Gilgamesh
    and Enkidu on cylinder seals, Enkidu’s actions and role in relation to Gilgamesh,
    Enkidu’s field-born and clay-creation associations, and a cautious analogy between
    the Enkidu episode and Adam-and-Eve traditions.
