  summary: A transliterated Old Babylonian Gilgamesh passage recounts dGis/Gilgamesh
    telling dreams to his mother, who interprets dream objects as a coming counterpart;
    Enkidu’s separation from animal life through the harimtu’s guidance, clothing,
    food, beer, and city entry; a fragmentary report concerning marriage custom and
    Gilgamesh; Enkidu’s blocking of Gilgamesh’s way in Uruk; their wrestling; and
    Enkidu’s acknowledgment of Gilgamesh’s divine birth and kingship.
  language: Akkadian transliteration
  quote_policy: summarized
