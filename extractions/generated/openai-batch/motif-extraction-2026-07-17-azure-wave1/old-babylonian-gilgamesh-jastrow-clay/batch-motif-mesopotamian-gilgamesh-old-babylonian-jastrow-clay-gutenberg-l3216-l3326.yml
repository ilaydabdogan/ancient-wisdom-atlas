canonical_text:
  quote: ''
  summary: The passage is commentary on damaged lines of the Pennsylvania tablet.
    It reconstructs an episode in which Gish/Gilgamesh goes at night toward the goddess
    Ishhara in a family house, Enkidu blocks him at the street and gate, and the two
    heroes fight, with Gish worsted. The commentary compares the episode and details
    such as Enkidu's hair, the gate, and Gilgamesh's kneeling with Assyrian-version
    passages and seal-cylinder imagery, while stressing that the meaning of the episode
    remains unclear.
  language: English
  quote_policy: summarized
