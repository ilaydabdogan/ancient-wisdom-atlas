canonical_text:
  quote: ''
  summary: Gish reports two dreams to his all-knowing mother, who interprets them
    as foretelling a man associated with him. Enkidu, formerly living with animals,
    cohabits with a courtesan, accepts her counsel, is clothed, led toward human society,
    taught to eat food and drink wine, groomed and anointed, and becomes a protector
    of shepherds. He enters Erech, is compared with Gish, becomes his rival, and blocks
    Gish's path in a fragmentary marriage-related scene.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Gish tells his mother that he dreamed a heavenly object of Anu fell upon him,
    grew too heavy for him, drew the land of Erech around it, and was carried by him
    to her.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Gish's mother interprets the first dream as a person like Gish, born in the
    field and reared by the mountain, whom Gish will see, rejoice over, spare, and
    lead to her.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Gish reports a second dream in which an axe or likeness appears in the streets
    of Erech; he rejoices over it, loves and embraces it, and regards it as his brother.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Gish's mother says that the man whom Gish embraced in the dream is to be associated
    with him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Enkidu cohabits with the woman for six days and seven nights and forgets the
    place where he was born.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman addresses Enkidu as godlike, questions why he roams with cattle,
    invites him to Erech and Eanna where Gish is, and Enkidu accepts her counsel.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: The woman clothes Enkidu with a garment, keeps another garment on herself,
    takes his hand, and brings him to a fertile meadow and sheepfolds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage describes Enkidu's earlier habits as eating herbs with gazelles,
    drinking water with cattle, being happy with water beings, and sucking the milk
    of cattle.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:9
  text: Enkidu had not known food or wine; the woman instructs him to eat food and
    drink wine, and he eats, drinks seven goblets, becomes glad, and his face shines.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Enkidu's body hair is removed, he is anointed with oil, he puts on a garment,
    and he becomes manlike.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Enkidu takes a weapon, attacks and overcomes lions, and becomes the protector
    of shepherds so that they can rest at night.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: In a fragmentary scene, a man approaches and speaks to Enkidu about family
    home, city duties, Gish's marriage act, a legitimate wife, divine decree, and
    fate; the hero's face grows pale.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: Enkidu and the courtesan enter Erech; people gather around him, compare his
    form and strength to Gish, note his cattle-milk habit, and the heroes rejoice.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: Enkidu becomes a leader and rival to Gish, and in a fragmentary continuation
    he stands in the streets and blocks Gish's path.
  category: action
  evidence_refs:
  - ev:11
  - ev:12
