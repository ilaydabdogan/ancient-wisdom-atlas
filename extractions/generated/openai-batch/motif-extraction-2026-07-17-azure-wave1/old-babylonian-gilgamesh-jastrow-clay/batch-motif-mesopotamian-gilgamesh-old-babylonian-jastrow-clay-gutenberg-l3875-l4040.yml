canonical_text:
  quote: ''
  summary: Fragmentary passage in which Gish kneels at the rampart of Erech before
    Shamash, asks for protection and safe return, speaks of an untrodden road, receives
    weapons, and is counseled by elders. The elders advise provisioning, Enkidu’s
    guidance toward Huwawa’s forest, divine help from Shamash and Lugal-banda, and
    water-libations. Enkidu reassures Gish, and they proceed on the road to Huwawa.
    The following commentary notes restorations and parallels with the Assyrian version
    of the Huwawa episode.
