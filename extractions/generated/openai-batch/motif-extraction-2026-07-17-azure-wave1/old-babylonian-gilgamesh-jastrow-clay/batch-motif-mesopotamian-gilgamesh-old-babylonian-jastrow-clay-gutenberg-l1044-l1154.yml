canonical_text:
  quote: ''
  summary: 'A scholarly introduction argues that several exploits later shared with
    or assigned to Gilgamesh originally belonged to Enkidu: the Huwawa expedition,
    the bull episode, and the killing of lions. It cites Enkidu’s knowledge of the
    forest road, his dream revelations, his action against the bull and insult to
    Ishtar, his punishment, and the Pennsylvania tablet’s description of the two heroes
    as alike, born in the same place, and as brothers. It also notes dreams interpreted
    by Gilgamesh’s mother as foretelling Enkidu and the future close union of the
    two heroes.'
  language: English
  quote_policy: summarized
