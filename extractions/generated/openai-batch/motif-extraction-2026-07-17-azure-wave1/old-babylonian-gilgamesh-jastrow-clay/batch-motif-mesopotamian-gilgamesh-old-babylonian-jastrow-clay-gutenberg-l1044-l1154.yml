  - ev:5
  - ev:8
  confidence: medium
  cautions: The passage is a scholarly discussion of textual development, not a continuous
    mythic narration.
- id: motif:2
  label: resemblance and brotherhood of heroes
  taxonomy_refs:
  - sibling_pair
  basis: The passage explicitly says the Pennsylvania tablet describes the two heroes
    as alike, born in the same place, and as brothers, and calls this a resemblance
    motif.
  evidence_refs:
