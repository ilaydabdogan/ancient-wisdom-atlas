  summary: A scholarly discussion compares the Old Babylonian Pennsylvania tablet
    with the Assyrian version. It summarizes missing or parallel scenes involving
    Ninsun, Gilgamesh, Enkidu, the woman who leads Enkidu away from animal life and
    instructs him in civilization, the Eanna temple description, the encounter and
    reconciliation of Enkidu and Gilgamesh, and the later joint campaign against Huwawa.
  language: English
  quote_policy: summarized
