canonical_text:
  quote: ''
  summary: The passage is a scholarly interpretation of roles and episodes in the
    Gilgamesh tradition. It presents Enkidu as an older heroic figure and bull-slayer,
    identifies Gilgamesh as conqueror and wall-builder of Erech as well as a harsh
    ruler, summarizes Ishtar's wooing and rejection by Gilgamesh, and interprets Gilgamesh's
    sickness and later wanderings as a seasonal solar nature myth moving from spring
    through winter darkness toward renewed spring light.
  language: English
  quote_policy: summarized
