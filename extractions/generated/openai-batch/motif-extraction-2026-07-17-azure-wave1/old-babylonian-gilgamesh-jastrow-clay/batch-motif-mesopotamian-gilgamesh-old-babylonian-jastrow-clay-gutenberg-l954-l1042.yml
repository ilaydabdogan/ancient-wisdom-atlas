canonical_text:
  quote: ''
  summary: A scholarly passage compares seal-cylinder images and tablet passages about
    Gilgamesh and Enkidu. It describes the two heroes as visually alike, with Enkidu
    sometimes marked by animal hoofs and bison horns, identifies cylinder combat scenes
    as the Gilgamesh-Enkidu fight before friendship, argues that Enkidu is the stronger
    counterpart whose traits were transferred to Gilgamesh, and summarizes warnings
    before the Huwawa undertaking in which Enkidu is advised to go before Gilgamesh
    because he knows the roads to the cedar forest.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Seal-cylinder representations are said to show Gilgamesh and Enkidu as bearded,
    similarly arranged in hair and face, with Gilgamesh generally a little taller
    than Enkidu.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Enkidu is commonly, though not always, shown with animal hoofs and bison horns,
    which the passage says mark the period when he lived with animals and like an
    animal.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A cylinder identified as Ward No. 199 is described as showing two nearly duplicate
    figures, one slightly taller, in conflict with each other.
  category: object
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage identifies the Ward No. 199 conflict scene as the fight between
    Gilgamesh and Enkidu before they form a friendship.
  category: relationship
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:5
  text: The fragmentary fight is described as furious; Gilgamesh is worsted, and the
    victor comforts him by saying he is destined for royal authority rather than merely
    extraordinary physical strength.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Another cylinder, No. 173, is described as showing Gilgamesh holding his counterpart
    by the legs; the passage treats this as another aspect of the fight with Enkidu.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: The passage states that the Gilgamesh Epic is composite, that Enkidu was originally
    an independent figure, and that Gilgamesh is depicted as Enkidu's counterpart
    or reflection with traits of physical power transferred from Enkidu.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: In the encounter summarized here, Gilgamesh meets Enkidu on the highway after
    leaving the house associated with Ishhara; Enkidu blocks the path, prevents re-entry,
    and the two attack one another like oxen.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: In the same encounter, the two heroes grapple, and Enkidu forces Gilgamesh
    to the ground.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: In the Huwawa episode as summarized, elders, Enkidu, and workmen warn Gilgamesh
    against the undertaking because he is young and does not know what he proposes
    to do.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The elders advise that Enkidu should go before Gilgamesh because he knows
    the roads to the cedar forest and is skilled in battle.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Gilgamesh is said to invite Enkidu to visit his mother Ninsun for counsel.
  category: action
  evidence_refs:
  - ev:10
