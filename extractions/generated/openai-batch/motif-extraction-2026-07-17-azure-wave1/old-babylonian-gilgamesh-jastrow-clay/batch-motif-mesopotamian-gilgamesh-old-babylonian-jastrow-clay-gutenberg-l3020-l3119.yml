canonical_text:
  quote: ''
  summary: 'The commentary discusses a broken section of the Pennsylvania Tablet,
    cautiously reconstructing an encounter involving Enkidu, Gish/Gilgamesh or another
    man, and a woman. Enkidu is presented as a primitive-stage figure who approaches
    Erech, becomes hostile toward Gish or the man, and is met by a civilizing speech
    about human destiny: home, work, resources, marriage, and monogamy, all framed
    as divinely decreed and fated from birth.'
  language: English
  quote_policy: summarized
