canonical_text:
  quote: ''
  summary: The passage argues that Gish and Gish-bil/bl-ga-mesh are substantially
    identical descriptive epithets for Gilgamesh, formed through folk etymology and
    name-play to characterize him as the original or father of heroes. It compares
    this kind of name-play to examples in Genesis and to an Arabic epithet for Alexander.
    It also describes Gilgamesh as a foreign-looking name, links the Epic’s portrayal
    of the hero as a conqueror of Erech to an invasion tradition, and notes foreign
    or Sumerianized names in mythical dynasties.
  language: English
  quote_policy: summarized
