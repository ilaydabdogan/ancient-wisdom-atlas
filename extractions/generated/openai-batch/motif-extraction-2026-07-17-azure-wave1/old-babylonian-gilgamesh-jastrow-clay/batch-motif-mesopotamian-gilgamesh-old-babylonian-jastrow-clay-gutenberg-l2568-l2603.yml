canonical_text:
  quote: ''
  summary: Enkidu approaches Gish, meets him in the district plaza, blocks the gate
    with his foot, and prevents him from entering. Gish and Enkidu seize each other
    and fight like oxen, damaging the threshold and wall. Gish’s wrath is then quieted.
    Enkidu addresses Gish, saying that his mother Ninsun bore him as a unique one,
    exalted him above men, and that Enlil decreed kingship over men for him. The excerpt
    ends with a tablet colophon.
