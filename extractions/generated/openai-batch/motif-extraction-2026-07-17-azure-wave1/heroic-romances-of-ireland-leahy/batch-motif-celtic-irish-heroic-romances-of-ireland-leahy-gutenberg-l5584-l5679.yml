canonical_text:
  quote: ''
  summary: Cuchulain and Ferdia repeatedly cease combat at evening, give their weapons
    to charioteers, embrace and exchange three kisses, share nearby camp arrangements,
    and receive treatment. Cuchulain sends healing materials or charms across the
    ford to Ferdia, while Ferdia sends half of his food and drink to Cuchulain. The
    next day they choose spears, shields, chariots, and horses for renewed combat,
    wound each other severely until evening, and stop after Cuchulain calls for peace
    rather than an unending struggle like that of the Fomorians. On the following
    morning Cuchulain notices a dark, changed look on Ferdia, who denies fear.
  language: English
  quote_policy: summarized
