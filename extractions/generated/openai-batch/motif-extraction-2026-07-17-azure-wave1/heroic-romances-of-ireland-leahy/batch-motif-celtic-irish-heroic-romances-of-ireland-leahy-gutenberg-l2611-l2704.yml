canonical_text:
  quote: ''
  summary: The introduction describes the manuscript transmission and composite structure
    of the romance called the “Sick-bed of Cuchulain,” also partly known as the “Jealousy
    of Emer.” It distinguishes an “Antiquarian” form, which includes the cause of
    Cuchulain’s illness and Laeg’s journey to Fairyland to test a message about fairy
    healing, from a “Literary” form, which begins with Cuchulain being roused from
    his sick-bed, retells Laeg’s Fairyland journey, and supplies the conclusion involving
    a fairy lady who gives up her lover to a rival. The introduction also notes an
    inserted account of Lugaid Red-Stripes’ election and a Bull Feast prophecy.
  language: English
  quote_policy: summarized
