canonical_text:
  quote: ''
  summary: Cuchulain is awakened by a terrifying cry from the north, arms himself,
    and follows it with Laeg. At a ford he encounters an uncanny chariot with a red
    woman, a giant-like male companion, a one-legged horse, and a cow. After Cuchulain
    challenges the cow-driving, the woman gives strange names, claims satirical power,
    sings an insulting song, vanishes with the whole company, and appears as a black
    bird. She foretells evil for Cuchulain, identifies herself as guardian of his
    Bringer of Death, and says the cow has come from the Under-world Country of Croghan
    to breed with the Dun Bull of Cualgne, after which the Raid of Cualgne will begin.
    Cuchulain replies that the raid will increase his fame and that he will return
    alive.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Cuchulain sleeps at Dun Imrid, hears a terrifying cry from the north, falls
    from his couch, and goes out without his arms until his wife brings his apparel
    and weapons.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Laeg arrives in Cuchulain's harnessed chariot and says he too was stirred
