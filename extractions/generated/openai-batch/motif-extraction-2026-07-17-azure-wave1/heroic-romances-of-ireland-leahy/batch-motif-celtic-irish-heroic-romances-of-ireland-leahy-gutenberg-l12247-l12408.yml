  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Cuchulain sees a black bird on a bough and recognizes that the woman's shape
    has passed into the bird; the woman declares that the region will bear a tale
    and name from her deeds.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The woman tells Cuchulain that evil is fated for him because of his deed and
