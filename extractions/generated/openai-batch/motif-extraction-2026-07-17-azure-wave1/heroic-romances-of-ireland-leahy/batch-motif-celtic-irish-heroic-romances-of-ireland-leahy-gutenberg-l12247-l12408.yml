- id: obs:3
  text: At the Ford of the Double Wonder, another chariot approaches from Coolgarry,
    drawn by a one-legged chestnut horse whose body is pierced by the chariot pole.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: A red woman sits in the chariot with red eyebrows and a crimson cloak, while
    a large male companion in red, carrying a forked hazel staff, drives a cow before
    him.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Cuchulain accuses the woman and man of wrongfully driving the cow; he says
    the cattle of Ulster are his to guard, and the woman challenges his right to judge
    the matter.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The woman and man answer Cuchulain with long strange names, after which Cuchulain
