canonical_text:
  quote: ''
  summary: The passage describes the ornate hall and inner chamber of Ailill and Queen
    Maev, the reception of Fraech and his company, a chess game played on a precious
    luminous board, and the calling of Fraech's harpers. The harpers carry richly
    decorated instruments whose serpent, bird, and hound figures move as the strings
    are played. Their music causes twelve of Ailill and Medb's people to die from
    sorrow. The text then explains the three Chants of Uaithne—Sorrow, Joy, and Sleep—as
    noble brothers born to Boand from the Harp of the Dagda, with a prophecy that
    listeners may die by their art. After the music ceases, Fergus praises it, and
    Fraech orders food divided while Lothar cuts the meat with a sword.
  language: English
  quote_policy: summarized
