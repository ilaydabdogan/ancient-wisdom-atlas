canonical_text:
  quote: ''
  summary: Etain repeatedly attends an appointed tryst meant to help the sick Ailill,
    but a man resembling Ailill appears instead. The man identifies himself as Mider
    of Bri Leith, claims to have been Etain's former husband, names sorcery and spells
    as the cause of their separation, and invites her to his marvellous land. Etain
    refuses to abandon Eochaid unless Eochaid asks it of her. Mider states that he
    caused and removed Ailill's desire so that Etain's honor would not be harmed.
    Ailill is cured, and Eochaid thanks Etain. Later Eochaid sees a strange warrior
    at Tara who identifies himself as Mider and asks to play chess, producing a costly
    silver-and-gold chessboard.
  language: English
  quote_policy: summarized
