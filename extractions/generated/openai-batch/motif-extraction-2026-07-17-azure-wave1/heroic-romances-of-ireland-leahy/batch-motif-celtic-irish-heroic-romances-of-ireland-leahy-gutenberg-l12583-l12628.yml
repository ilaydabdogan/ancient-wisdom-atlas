canonical_text:
  quote: ''
  summary: 'In a dialogue, the woman later identified as the Morrigan threatens Cuchulain
    with animal forms during a future combat at a ford: an eel to entangle his feet,
    a grey wolf to wound him, and a white red-eared heifer accompanied by one hundred
    cows near a lake. Cuchulain answers each threat with a counter-threat of injury
    and withholds healing or help if she does not leave him. They separate; Cuchulain
    returns to Dun Imrid, and the Morrigan goes with her cow to the fairy mound of
    Cruachan. The passage states that the tale is a prelude to the Tain bo Cualnge.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The woman describes Cuchulain as being in combat at a ford against a man equal
    to him in strength, victories, feats, fierceness, endurance, nobility, bravery,
    and greatness.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The woman says she will be an eel and draw a noose around Cuchulain's feet
    in the ford, making the war unequal for him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Cuchulain swears that he will break the woman against a green stone of the
    ford and says she will have no healing from him if she does not leave him.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The woman says she will be a grey wolf against Cuchulain and strip a stripe
    from him from his right side or hand to his left; a footnote says the translated
    word for the strip is doubtful.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Cuchulain says he will beat the woman away with a spear until either her left
    or right eye bursts from her head, and again denies healing if she does not leave
    him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The woman says she will be a white heifer with red ears, go into a lake near
    the ford where Cuchulain fights his equal, and be followed by one hundred white
    red-eared cows; she adds that truth of men will be tested and that Cuchulain's
    head will be taken.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:7
  text: Cuchulain says he will cast at the woman with a sling so as to break one of
    her legs, and says she will have no help from him if she does not leave him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'The two separate: Cuchulain goes back to Dun Imrid, and the Morrigan goes
    with her cow to the fairy mound of Cruachan.'
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage states that this tale is a prelude to the Tain bo Cualnge; a note
    reports an alternate version in which the departing female figure is called the
    Badb.
  category: other
  evidence_refs:
  - ev:7
