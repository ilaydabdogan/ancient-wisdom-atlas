canonical_text:
  quote: ''
  summary: Bricriu and Ailill mac Mata shame the Ulster heroes over a failed expedition
    and the wounding of three heroes by one man. The Ulstermen and Connacht allies
    storm the castle, defeat its defenders, slay many warriors and named leaders,
    and carry off Flidais, women, treasures, garments, and cattle. The passage explains
    the presence and heroic status of the Gamanrad. Flidais goes to Fergus by decree
    of Ailill and Medb, and her cows sustain the men of Ireland during the Cattle
    Raid of Cualnge. Later notices describe Flidais with Fergus, Fergus receiving
    lordship, the deaths of Flidais and Fergus, and the tale’s status as a prelude
    to the Tain bo Cualnge.
  language: English
  quote_policy: summarized
