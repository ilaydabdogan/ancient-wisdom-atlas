canonical_text:
  quote: ''
  summary: Eochaid Airem, king of Tara, surveys the plain of Breg from the heights
    of Tara on a summer day and sees an unknown, richly armed young warrior. The warrior
    identifies himself as Mider of Bri Leith and asks to play fidchell with Eochaid,
    displaying a precious board and proposing stakes. After a manuscript gap, the
    passage describes earth, gravel, and stones placed on a bog, yokes connected with
    oxen, people of the Mounds carrying yokes, a causeway over the moor of Lamrach,
    an explanation of Eochaid's name, and the first yoking of oxen in Ireland.
  language: Old Irish with English interlinear translation
  quote_policy: summarized
