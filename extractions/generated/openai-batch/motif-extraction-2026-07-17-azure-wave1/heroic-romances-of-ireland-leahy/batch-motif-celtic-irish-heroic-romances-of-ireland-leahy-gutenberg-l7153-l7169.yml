canonical_text:
  quote: ''
  summary: 'Editorial notes state that a quatrain has a literal translation elsewhere
    and is absent from the Leinster version. A note on the line “A great oak-tree”
    reports a Rawlinson manuscript addition: after Fergus plucks up the oak-tree,
    another account says Curoi mac Dari brought the oak and arrived where only Lugaid
    son of Curoi and Cetin Pauci represented Munster; Curoi then single-handedly carried
    off half of the Boar from the northern half of Ireland. The editor presents this
    as a survival of the Munster account of the Heroic Age, possibly partly preserved
    in tales of Finn mac Cumhail.'
