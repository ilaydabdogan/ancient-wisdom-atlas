canonical_text:
  quote: ''
  summary: 'Seven daughters of Regamon help Mani Morgor and the sons of Maev remove
    herds of cattle, swine, and sheep. Regamon pursues the raiders and defeats Morgor''s
    men, while the maidens report the danger to Maev. Ailill, Maev, Fergus, Connaught
    warriors, and Ulster exiles come to the Ford, where Ailill''s sons have made thorn-bough
    hurdles. A truce follows: the youths and maidens are pardoned, the cattle remain
    with Regamon, the maidens remain in Connaught with Maev''s sons, and Regamon gives
    cows as dower. The passage identifies the tale as Táin bó Regamon, sung before
    the Cualgne Raid.'
  language: English
  quote_policy: summarized
