canonical_text:
  quote: ''
  summary: The passage praises Cuchulain, has Liban ask him to recount his deeds,
    and gives his account of a battle against foes linked with Stream-Yeogan and Manannan.
    After spending a month with Fand, Cuchulain arranges a tryst with her. Emer learns
    of it, comes armed with fifty women, and confronts Cuchulain and Fand while Cuchulain
    and Laeg play chess. Cuchulain promises to protect Fand and argues with Emer.
    Emer laments her dishonour, Cuchulain praises Fand, and then reassures Emer. Fand
    says she must go and sings a lament of departure, yielding Cuchulain to Emer while
    still longing for him.
  language: English
  quote_policy: summarized
