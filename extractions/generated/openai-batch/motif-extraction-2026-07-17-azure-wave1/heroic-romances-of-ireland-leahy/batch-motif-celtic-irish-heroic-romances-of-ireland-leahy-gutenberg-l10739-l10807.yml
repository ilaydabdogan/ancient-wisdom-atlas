canonical_text:
  quote: ''
  summary: Supernatural visitors promise treasure and give Corp Lee the Gray foreknowledge
    of a Connaught cattle raid, urging him to meet the raiders at the appointed hour.
    The promised gifts appear at Croghan, prompting Orlam and other Connaught men
    to ride to Dartaid's home, take her with the gathered cattle, and depart. Corp
    Lee attacks them; most Connaught nobles die, Dartaid is slain, and Orlam escapes
    with cattle. The passage explains a regional and tale-name derived from Dartaid
    and frames the tale as a prelude to the Cualgne Raid.
