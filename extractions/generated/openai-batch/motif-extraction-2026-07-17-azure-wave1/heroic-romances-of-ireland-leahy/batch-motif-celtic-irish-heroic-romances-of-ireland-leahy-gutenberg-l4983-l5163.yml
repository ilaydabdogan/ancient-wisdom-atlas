canonical_text:
  quote: ''
  summary: Fergus visits Cuchulain to warn him that Ferdia, Cuchulain's friend, companion,
    fellow pupil, and equal, is coming to fight him. Cuchulain laments the duel but
    refuses to yield. Fergus praises Ferdia's strength and urges vigilance. Ferdia
    later tells his followers of Maev's terms binding him to fight either six champions
    or Cuchulain, and his camp mourns because one or both of the two champions are
    expected to die. At midnight Ferdia wakes, orders his charioteer to harness the
    horses, rejects the charioteer's warning, and prepares to go to the ford.
  language: English
  quote_policy: summarized
