  summary: The passage consists of translator’s notes and a literal rendering of a
    poem about Etain. The poem places Etain at an elf-mound west of Alba and on the
    shore of the Bay of Cichmaine, says she cured a king’s eye from a well, says she
    was drunk in a heavy draught by the wife of Etar, predicts wars and losses connected
    with her, and identifies her as a standard of fair women. Notes mark several renderings
    as uncertain.
