canonical_text:
  quote: ''
  summary: Flidais, wife of Ailill Finn, loves Fergus and sends messengers to him.
    Fergus consults Ailill of Connaught and Maev, then goes with companions to Ailill
    Finn’s burg. Ailill Finn refuses him hospitality and a gift of cows because Flidais
    loves him. Fergus challenges him to combat at a ford; Dubhtach fights and both
    men are wounded. Shields are used to protect the wounded, and Flidais throws her
    cloak over the three men and later tends them. Fergus’s men flee; Ailill Finn
    kills many, survivors report to Ailill and Medb, who bring troops. Ailill Finn
    refuses conference, and the castle is stormed for a week with heavy Connaught
    losses.
  language: English
  quote_policy: summarized
