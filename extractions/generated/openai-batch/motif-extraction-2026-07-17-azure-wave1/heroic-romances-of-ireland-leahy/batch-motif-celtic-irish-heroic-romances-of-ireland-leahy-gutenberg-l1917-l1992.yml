canonical_text:
  quote: ''
  summary: The passage opens with a verse about earthwork, labor, oxen, cleared rushes
    and stones, and grief as a price. In the prose narrative, Mider arrives at Tara
    on the appointed night after Eochaid has fortified the palace with armies. Mider
    demands Etain as the fulfillment of Eochaid's promise. Etain states that she will
    not go unless Eochaid resigns her. Eochaid refuses to resign her but permits Mider
    to take her in his arms; Mider carries her through the skylight. The hosts see
    two swans circling Tara and going toward the elf-mound of Femun. Eochaid pursues
    with an army, digs up elf-mounds, fights Mider's host, is deceived by sixty women
    shaped like Etain, and eventually recovers Etain after she identifies herself.
  language: English
  quote_policy: summarized
