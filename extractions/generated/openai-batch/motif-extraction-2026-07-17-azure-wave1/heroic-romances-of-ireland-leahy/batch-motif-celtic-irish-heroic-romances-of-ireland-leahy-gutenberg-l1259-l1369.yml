canonical_text:
  quote: ''
  summary: Eochaid courts Etain, who identifies herself as coming from a fairy mound,
    pays her bride-price, and brings her to Tara. At the Tara Feast around Samhain,
    Ailill Anglonnach gazes at Etain and develops desire for his brother's wife. After
    the feast he falls into a wasting sickness, which a physician diagnoses as caused
    by envy or love. Eochaid leaves on a royal progress and asks Etain to care for
    Ailill and arrange his memorial if he dies. Etain visits Ailill and asks what
    ailment binds him; Ailill replies in song that he takes no joy in the harp and
    leaves milk untasted.
  language: English
  quote_policy: summarized
