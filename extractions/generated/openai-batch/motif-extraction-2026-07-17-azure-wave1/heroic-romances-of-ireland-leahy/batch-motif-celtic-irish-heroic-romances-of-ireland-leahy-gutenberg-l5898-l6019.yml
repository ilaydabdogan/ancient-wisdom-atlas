canonical_text:
  quote: ''
  summary: In a combat at the ford, Ferdia wounds Cuchulain severely. Cuchulain asks
    Laeg for the Gae-Bulg, a barbed weapon cast with the foot from the stream. Cuchulain
    uses spear-thrusts and the Gae-Bulg to mortally wound Ferdia. Ferdia reproaches
    him and dies. Cuchulain carries Ferdia’s body to the north side of the ford, becomes
    faint with grief, and is urged by Laeg to rise because the men of Erin are approaching.
    Cuchulain rejects triumph and begins to lament Ferdia.
  language: English
  quote_policy: summarized
