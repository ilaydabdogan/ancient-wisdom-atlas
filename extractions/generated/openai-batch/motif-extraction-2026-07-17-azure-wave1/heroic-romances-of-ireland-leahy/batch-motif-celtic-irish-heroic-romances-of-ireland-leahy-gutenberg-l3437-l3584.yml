    it, and that all things in the land are good.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The described land is a fairy dwelling where no evil dwells and no one can
    speak a lie, and it is associated with a king called Brown Labra.
  category: setting
  evidence_refs:
