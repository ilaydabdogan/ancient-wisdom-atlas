canonical_text:
  quote: ''
  summary: Laeg describes a good fairy land and its landmarks to Cuchulain. Cuchulain
    goes with Liban to Labraid's island, is welcomed by Labraid, Fand, and the women
    there, surveys a vast hostile army, and fights its leaders. Speaking ravens reveal
    Druid secrets but are mocked and driven off. Cuchulain kills Eochaid Juil, thirty-three
    others, and Senach the Unearthly; Labraid then routs the armies. Laeg warns that
    Cuchulain's heat must be cooled in three vats of water. Fand sings of Cuchulain's
    return, praising his car, appearance, weapons, and battle-fury.
  language: English
  quote_policy: summarized
literal_observations:
