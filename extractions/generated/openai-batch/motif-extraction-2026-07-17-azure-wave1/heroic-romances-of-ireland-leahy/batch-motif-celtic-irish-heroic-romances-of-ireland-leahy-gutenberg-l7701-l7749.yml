  summary: The passage gives a literal translation of Liban's welcome to Cuchulain,
    an editorial note on Cuchulain's omitted battle account, and a literal rendering
    in which Cuchulain describes throwing a spear into the host of Eogan the Stream,
    being followed by a white army associated with Manannan Mac Lir, fighting many
    opponents alone, and hearing Echaid Juil groan. A final note states that the third
    verse is underlain by the idea of battle with sea-waves.
