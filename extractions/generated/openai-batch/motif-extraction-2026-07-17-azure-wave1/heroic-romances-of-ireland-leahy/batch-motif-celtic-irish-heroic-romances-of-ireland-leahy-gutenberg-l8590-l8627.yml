canonical_text:
  quote: ''
  summary: The passage closes a note identifying Banba as a name of Ireland, then
    opens the preface to Volume II. It describes shorter Irish tales, the “lesser
    Tains,” as customary preludes to the Great Tain, lists preserved examples, identifies
    five included in the volume, and notes their textual treatment. It says the last
    four tales are short remscela, or preludes, to the Great Tain. It also notes that
    the end of the Tain bo Flidais may preserve a different account of the end of
    the war of Cualgne, in which Cuchulain is defeated and Connaught gains his land
    for its allies.
