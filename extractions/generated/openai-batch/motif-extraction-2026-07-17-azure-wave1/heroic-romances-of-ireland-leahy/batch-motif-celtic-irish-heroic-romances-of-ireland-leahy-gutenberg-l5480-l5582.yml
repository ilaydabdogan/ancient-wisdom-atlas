canonical_text:
  quote: ''
  summary: Cuchulain warns Ferdia that Findabar has lured many men to death and reminds
    him of an oath and their former friendship. He recalls their shared martial life
    with Scathach, Uathach, and Aife. Ferdia rejects the appeal and asks what weapons
    they should use. Because Ferdia first reached the Ford, Cuchulain grants him choice
    of weapons. They first fight with casting weapons from dawn to midday without
    drawing blood, then with casting-spears from midday to evening, when each wounds
    the other and draws blood.
  language: English
  quote_policy: summarized
