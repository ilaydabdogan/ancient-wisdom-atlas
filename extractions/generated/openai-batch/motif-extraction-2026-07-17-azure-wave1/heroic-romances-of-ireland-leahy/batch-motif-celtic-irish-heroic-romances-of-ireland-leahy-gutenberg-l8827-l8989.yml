canonical_text:
  quote: ''
  summary: Fraech hears of a maid's love and is advised to seek aid and gifts from
    his fairy kin. He goes to Boand, his mother's sister, who provides splendid garments,
    shields, and other equipment. Fraech and a richly adorned retinue with horses,
    hounds, trumpeters, jesters, and harp-players travel to Croghan. A watchman reports
    their extraordinary splendor and fragrance, and describes Fraech's athletic play
    with a spear and hounds. The youths hunt game near Croghan, Fraech is identified
    to Ailill and Maev, and he is welcomed into a palace described with chambers,
    fire, yew, bronze, and brass fittings.
  language: English
  quote_policy: summarized
