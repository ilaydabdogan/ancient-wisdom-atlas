canonical_text:
  quote: "“do not look like pieces of patchwork”"
  summary: The preface argues that extant Irish romances should not be treated merely
    as inaccurate survivals of pre-Christian Druidic tales. It presents them as Christian-era
    literary works shaped by older traditions, with possible but uncertain classical
    learning, and discusses textual variation, especially in the case of the “Courtship
    of Etain.”
  language: English
  quote_policy: quoted
