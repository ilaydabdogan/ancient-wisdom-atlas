  summary: The preface explains the editorial arrangement of the two-volume collection,
    especially the treatment of several Irish Táin or cattle-foray texts, their relation
    as fore-tales to the Cualnge war cycle, the use of verse renderings with literal
    prose translations, the manuscript authorities for the romances, the printed and
    manuscript sources used, and scholarly assistance received for difficult translations.
