canonical_text:
  quote: Practically the tale consists of two quite separate parts.
  summary: 'The passage is an editorial introduction to Tain Bo Fraich. It summarizes
    the tale as a two-part Irish romance: Fraech courts Finnabar at the court of Ailill
    and Maev, and later undertakes a distant expedition to recover stolen cattle and
    his wife. The introduction also discusses manuscript witnesses, dating, literary
    style, comparison with other fore-tales and the Etain story, and Fraech''s later
    death by Cuchulain.'
  language: English
  quote_policy: quoted
