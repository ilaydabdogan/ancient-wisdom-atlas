canonical_text:
  quote: ''
  summary: Etain, wife of Mider, is transformed by Fuamnach and a druid into a butterfly,
    blown through Erin, sheltered by Angus Mac O'c, expelled again, swallowed in milk
    by Etar's wife, reborn as Etar's daughter, raised with maidens, and addressed
    in a mounted stranger's song that recalls and prophesies events concerning her.
  language: English
  quote_policy: summarized
