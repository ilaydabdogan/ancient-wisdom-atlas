canonical_text:
  quote: ''
  summary: Conall agrees to undertake a raid. The raiders reach a castle where a snake
    attacks Conall and coils around his waist, but the castle is plundered, a woman
    and her three sons are freed from prison, and jewels are taken. The serpent later
    loosens from Conall without harming him. The party travels north, finds cattle,
    and drives them onward. Bicne dies beneath the driven cattle, and several place-names
    are explained through his death and through cattle horns shed near Benchor. Fraech
    returns home with children and cattle, then later joins the Raid of Cualgne after
    summons by Ailill and Maev.
  language: English
  quote_policy: summarized
