canonical_text:
  quote: ''
  summary: Fráech learns from his mother that his cows, wife, and three sons have
    been stolen and taken toward the mountain of Elpa, with three cows among the Picts.
    Despite warnings, he sets out because he has pledged to bring his cows to Ailill
    and Medb for the Cattle Spoil of Cualnge. With companions and Conall Cernach he
    travels overseas to Elpa, receives information and aid from local women of Irish
    or Ulster connection, attacks a serpent-guarded fort, rescues his wife and sons,
    plunders treasure, releases the serpent unharmed, recovers remaining cows among
    the Picts, and returns before joining Ailill and Medb.
  language: English
  quote_policy: summarized
