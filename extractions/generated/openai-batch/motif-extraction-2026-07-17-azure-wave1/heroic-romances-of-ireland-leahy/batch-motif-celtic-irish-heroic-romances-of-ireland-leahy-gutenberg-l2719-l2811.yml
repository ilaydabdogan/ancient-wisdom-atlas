canonical_text:
  quote: ''
  summary: The passage introduces the annual Samhain festival of the men of Ulster
    on the Plain of Murthemne, including feasting, games, and public accounts of combat.
    Warriors use severed tongue tips and swords as truth markers for their boasts.
    During a festival delay caused by the absence of Fergus and Conall, beautiful
    birds appear over a lake. The women of Ulster desire the birds, Leborcham petitions
    Cuchulain, and Cuchulain, with Laeg driving his chariot, strikes the birds down
    and distributes them. His wife Ethne Inguba is initially left without a pair,
    but Cuchulain promises her the most beautiful birds in future.
  language: English
  quote_policy: summarized
