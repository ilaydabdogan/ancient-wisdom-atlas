canonical_text:
  quote: women of the fairies have come upon me, and that they have destroyed my strength
  summary: Liban tells Labraid that Laeg has come from Cuchulain and that Cuchulain
    will join Labraid's hosts. Labraid welcomes Laeg and sends him back with Liban.
    Laeg reports to Cuchulain at Emain, and Cuchulain is strengthened. An editorial
    note marks a break and a shift between two versions of the tale. Cuchulain then
    sends Laeg to Emer with news that fairy women have destroyed his strength and
    asks her to come to him. Laeg exhorts Cuchulain to rise. Emer rebukes Laeg and
    the men of Ulster for failing to seek a cure, sings of the journeys Cuchulain
    would have made to heal others, and then goes to Cuchulain's chamber to reproach
    him for lying sick for a woman's love.
  language: English
  quote_policy: quoted
