canonical_text:
  quote: ''
  summary: A Rawlinson manuscript addition says Ferloga received horses but not the
    serenade. A literal translation of a final poem addresses Connaught, mentions
    division of the Boar of Mac Datho, fighting over Ailbe the dog, names many heroes
    and war figures, describes Cethern fighting alone at a ford for six hours, and
    closes with images of champions, destruction, hostages, and sepulchres. Editorial
    notes connect Cuchulain with Bodb as evidence for a war-god interpretation and
    discuss Lugaid as 'son of three dogs.'
  language: English
  quote_policy: summarized
