canonical_text:
  quote: ''
  summary: Ailill, while asleep, sees a young man and woman who name themselves Victory
    and Defeat and direct him to send Orlam to take Dartaid's cattle, promising equipment.
    The same pair appear to Corp Liath under names meaning Gathering of Hosts and
    Destruction and warn him that Connaught princes will come for the cows. Orlam
    goes to Dartaid, she agrees to leave with him and her cattle, and Corp Liath meets
    the party in battle. Most of the Connaught youths and Dartaid are killed, while
    Orlam and eight others escape with the cows. The place is named for Dartaid, and
    the tale is identified as a prelude to the Tain bo Cualnge.
  language: English
  quote_policy: summarized
