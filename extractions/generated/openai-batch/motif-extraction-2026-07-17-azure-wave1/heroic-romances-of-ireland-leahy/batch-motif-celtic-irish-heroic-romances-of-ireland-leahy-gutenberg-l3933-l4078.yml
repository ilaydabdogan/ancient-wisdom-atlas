canonical_text:
  quote: ''
  summary: At an Ulster feast in Feidlimid's house, a child cries out from within
    the womb of Feidlimid's pregnant wife. Cathbad the Druid interprets the cry, foretells
    that the child will be a beautiful girl named Deirdre, and prophesies ruin, exile,
    death, and grief for Ulster because of her. Young men call for her death, but
    Conor orders her to be reared for him as his future wife. Deirdre is secluded
    from men while she grows up. In winter she sees a black raven drinking calf's
    blood on snow and says she will love only a man with hair black as the raven,
    cheeks red as blood, and body white as snow. Levorcham identifies that man as
    Naisi, son of Usnach, and Deirdre says she will not be well until she sees him.
  language: English
  quote_policy: summarized
