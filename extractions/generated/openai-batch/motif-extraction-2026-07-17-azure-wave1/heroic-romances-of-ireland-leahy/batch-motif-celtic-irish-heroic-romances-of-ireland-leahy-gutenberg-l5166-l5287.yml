canonical_text:
  quote: ''
  summary: Ferdia arrives at the ford before full daylight, has his servant arrange
    cushions and skins from the chariot, and sleeps. Cuchulain waits until daylight
    so that his early rising cannot be interpreted as fear, then has his chariot yoked
    and advances. Supernatural beings cry around him as part of their battle custom,
    increasing dread of him. Ferdia's servant hears and describes Cuchulain's noisy
    approach, wakes Ferdia, praises the approaching champion, and is rebuked by Ferdia,
    who cites Ailill and Maev's prophecy and the promised fee for killing Cuchulain.
  language: English
  quote_policy: summarized
