canonical_text:
  quote: ''
  summary: Cuchulain encounters two linked birds over a lake, ignores warnings, wounds
    one after failed sling-casts, and the birds go beneath the lake. He then sleeps
    at a stone pillar and sees two women whip him in a vision, after which he becomes
    speechless and remains on a sick-bed for a year. At the end of the year, a mysterious
    man named Angus son of Aed Abra comes to the sick-room and sings that Aed Abra's
    daughters, Fand, and Liban are connected with Cuchulain's cure and with a summons
    on Samhain. After the messenger disappears, Cuchulain speaks, recounts his vision,
    and Conor tells him to return to the pillar.
  language: English
  quote_policy: summarized
