canonical_text:
  quote: ''
  summary: Fairy women depart while wailing over Fraech, and the passage identifies
    this as the first hearing of the Ban-Shee Wail. Fraech returns to the dun, where
    Maev and Ailill make peace with him. During the banquet, Fraech arranges for a
    salmon from the riverbank to be brought to Finnabar because a ring is inside it.
    Ailill then demands that Finnabar produce the ring and threatens her life. The
    ring is served on a broiled salmon, and Ailill admits that he had thrown it into
    the river. Fraech explains that he saw a salmon catch the ring, seized the fish,
    and had the ring restored through Finnabar.
  language: English
