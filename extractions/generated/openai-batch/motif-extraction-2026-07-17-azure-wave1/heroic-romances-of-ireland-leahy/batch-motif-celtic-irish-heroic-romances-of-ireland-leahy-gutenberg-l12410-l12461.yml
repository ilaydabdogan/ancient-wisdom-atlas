canonical_text:
  quote: ''
  summary: In a verse dialogue, a woman later identified as Morreegan/Morrigan, the
    Great Battle Queen, threatens to hinder Cuchulain during future ford-combat against
    a matched hero by taking the forms of an eel, a wolf, and a white heifer with
    red ears accompanied by similar cows. Cuchulain answers each threatened form with
    a countermeasure. Morreegan departs with her cow to Rath Croghan and then to her
    Under-World Country, while Cuchulain returns to his place.
  language: English
