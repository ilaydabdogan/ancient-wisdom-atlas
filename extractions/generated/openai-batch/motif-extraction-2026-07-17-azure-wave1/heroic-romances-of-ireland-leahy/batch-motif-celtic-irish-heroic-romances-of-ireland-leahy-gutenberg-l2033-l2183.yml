canonical_text:
  quote: Mac Datho had among his possessions a hound which was the guardian of all
    Leinster; the name of the hound was Ailbe
  summary: Mac Datho, king in Leinster, owns the famed hound Ailbe. Rival embassies
    from Connaught and Ulster ask for the hound and offer rich payment. Mac Datho
    fears that refusing either side will bring war, and his wife advises him to promise
    the hound to both. He separately tells each embassy that their ruler shall receive
    Ailbe and invites each side to come with full company.
  language: English
