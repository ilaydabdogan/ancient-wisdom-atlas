  summary: The passage summarizes and compares versions of the Flidais cattle story.
    It describes Bricriu inducing Fergus to approach Ailill the Fair under an ambassadorial
    guise with a secret aim of carrying off Flidais, the hospitality scene and duel,
    divergent endings in the L.U. and Glenn Masain versions, and editorial claims
    about a supernatural cow or herd, Flidais as a supernatural being, and related
    Coir Annam entries about cows, does, milk, and fairy power.
