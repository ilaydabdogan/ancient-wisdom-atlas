canonical_text:
  quote: ''
  summary: 'Mani directs that messengers and maidens should move the cattle and seek
    help. The maidens report the sons'' distress to Ailill and Medb at Cruachan, and
    a relief force goes to Ath Briuin. The sons of Ailill block a ford with white-thorn
    and black-thorn hurdles against Regamon and his people, giving rise to a place-name.
    A treaty follows: Regamon receives restitution of the herd, the maidens remain
    with the sons of Ailill and Medb, and seven times twenty milch-cows are given
    as dowry and for support at the assembly connected with the Tain bo Cualnge. The
    passage names the tale as the Tain bo Regamon and calls it a prelude to the Tain
    bo Cualnge.'
  language: English
  quote_policy: summarized
