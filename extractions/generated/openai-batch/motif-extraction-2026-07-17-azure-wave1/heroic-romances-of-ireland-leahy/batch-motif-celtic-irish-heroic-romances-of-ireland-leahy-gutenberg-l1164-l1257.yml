canonical_text:
  quote: ''
  summary: The passage introduces Eochaid Airemm as supreme king of Ireland, names
    his lineage and vassal rulers, and states that the men of Ireland will not attend
    the Festival of Tara while he remains without a worthy wife. Eochaid sends searchers
    throughout Ireland, who find Etain daughter of Etar. Eochaid sees Etain at a spring
    near Bri Leith, richly adorned and washing her hair, and she is described as surpassingly
    beautiful and seemingly from the fairy mounds.
  language: English
  quote_policy: summarized
