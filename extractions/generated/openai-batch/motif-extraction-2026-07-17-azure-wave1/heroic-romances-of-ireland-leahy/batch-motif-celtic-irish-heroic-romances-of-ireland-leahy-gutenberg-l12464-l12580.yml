canonical_text:
  quote: Then he saw that she had become a black bird upon a branch near to him.
  summary: Cuchulain is awakened at Dun Imrid by a terrifying cry from the north.
    With Laeg he follows the sound and encounters an uncanny chariot carrying a red
    woman, accompanied by a red-cloaked man driving a cow. After a dispute over the
    cow and strange names, Cuchulain threatens the woman with his spear. The chariot
    party disappears, and the woman appears as a black bird. She declares that she
    guards Cuchulain's death, says the cow came from the fairy-mound of Cruachan to
    breed with the Black Bull of Cualnge, and links Cuchulain's remaining life and
    the coming Tain bo Cualnge to the calf in the cow.
  language: English
  quote_policy: quoted
