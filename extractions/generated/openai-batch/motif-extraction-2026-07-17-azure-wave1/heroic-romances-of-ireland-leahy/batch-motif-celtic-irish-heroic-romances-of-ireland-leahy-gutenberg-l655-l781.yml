  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Cuchulain is quoted as saying that no skill indeed to boast is his.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The bards are said to sing of wars and women's lament, but also to restrain
