canonical_text:
  quote: ''
  summary: A verse introduction argues that Irish heroic tales should be read without
    modern magical embellishment, describes old lore preserved in books and by poets,
    personifies Learning as revived by Irish hands, praises Irish bards for themes
    of love, war, mercy, music, nature, Fairy Land, and capable women, and states
    that the ancient tales are retold without addition or removal.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The speaker says it is difficult to win a modern audience for Ireland's old
    heroic lore, whose speech is only faintly heard amid modern noise.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tales are described as having slept in silence; ancient tomes were read
    by few, and even keepers of the knowledge thought the living music dead.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Some people are said to try to save the lore from death by adding modern arts,
    rhymes, magic breath, morbid magic dreams, mystic gleams, and a characterization
    of the Celt.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The passage mentions grassy mounds haunted by fairies, dim forms of gods in
    ancient tales, and later insertion of Druid spells.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: The speaker states that no tale should need a magic dress or modern art to
    give it life, and that each tale should speak for itself if it deserves to live.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: Learning is personified as having fled the western world because of warrior
    bands and then being raised again by Irish hands, with her banner unfurled.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ireland is said to have borne and reared the eldest children of Romance where
    Learning's laws were revered and aided Art's advance.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: The poets are said to have known Druid creeds but to have sung of love, heroes'
    deeds, kingly pomp, and cheerful jest rather than resting their thoughts on the
    creeds.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage says the poets often sang of war, praised chiefs of high courage,
    taught pity, and produced accents that taught chivalry to knighthood.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: The heroes are described as praising a conquered foe, opposing friends for
