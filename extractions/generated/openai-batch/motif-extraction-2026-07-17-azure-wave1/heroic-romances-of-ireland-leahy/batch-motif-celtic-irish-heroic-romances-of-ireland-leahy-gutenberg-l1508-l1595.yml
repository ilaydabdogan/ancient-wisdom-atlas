    her with her women, and carries her away with Crochen the Ruddy; Mider approaches
    in a hideous form.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The wives of the men of Ireland cry out, and the horses of Ireland are loosed
    to pursue Mider, though the pursuers do not know whether he has gone into the
    air or into the earth.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Mider travels west to the plain of Croghan, tells Crochen that her name will
    remain over the plain, and stays nine days feasting in the Fairy Mound of Croghan
    among allied dwellers.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mider says his own dwelling lies eastward, nearer the rising-place of the
