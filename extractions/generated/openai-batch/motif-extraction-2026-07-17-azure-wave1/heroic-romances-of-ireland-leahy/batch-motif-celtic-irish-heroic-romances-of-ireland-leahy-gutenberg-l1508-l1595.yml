canonical_text:
  quote: ''
  summary: After Ailill is cured and Eochaid approves Etain's conduct, Mider comes
    to a gathering at Fremain, finds Etain, and carries her away with Crochen. Mider
    passes through Croghan and then takes Etain to Bri Leith. Eochaid searches unsuccessfully
    for a year. His Druid Dalan uses yew wands, ogham, and wisdom to locate Etain
    in the fairy mound of Bri Leith. Eochaid and the men of Ireland destroy the fairy
    dwelling and bring Etain back. The passage closes with Eochaid's later death by
    fire, Etain's descendants, and the later retaliation of the fairy host and Mider
    against Conary.
  language: English
  quote_policy: summarized
