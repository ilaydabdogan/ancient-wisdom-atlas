  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: Eochaid sends horsemen, wizards, road officers, and boundary couriers to search
    Ireland for his wife, and he himself searches for a year without finding useful
    news.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Dalan the Druid goes west to a mountain later called Slieve Dalan, remains
    there overnight, makes three yew wands, writes ogham on them, and by wisdom and
    ogham learns that Etain is in the fairy mound of Bri Leith and that Mider has
    taken her there.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: Dalan tells Eochaid that loss of his wife has brought evil, shame, and misfortune,
    and advises him to assemble Ireland's warriors, destroy the palace at Bri Leith,
