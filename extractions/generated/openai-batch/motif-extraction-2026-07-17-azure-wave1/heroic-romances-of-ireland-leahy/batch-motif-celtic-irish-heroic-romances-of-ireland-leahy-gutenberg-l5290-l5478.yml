canonical_text:
  quote: ''
  summary: Cuchulain arrives at the ford in a richly described war chariot drawn by
    two swift horses. Ferdia waits on the south side and Cuchulain halts on the north.
    The two warriors exchange greetings, reproaches, memories of former training and
    friendship, and verse taunts predicting blood, wounds, drowning, death, and dishonor.
    Cuchulain warns Ferdia that Ailill and Maev have led him into a doomed fight and
    refers to gifts, armor, and Findabar as inducements.
  language: English
  quote_policy: summarized
