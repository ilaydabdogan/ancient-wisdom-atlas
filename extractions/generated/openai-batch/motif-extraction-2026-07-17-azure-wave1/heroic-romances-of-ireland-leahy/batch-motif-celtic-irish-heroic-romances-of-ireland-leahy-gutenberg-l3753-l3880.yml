canonical_text:
  quote: ''
  summary: Fand, threatened by Emer and the women of Ulster and feeling betrayed by
    Cuchulain, sees Manannan arrive unseen by others. She recalls her former marriage
    to Manannan, chooses to depart with him, and leaves Cuchulain. Cuchulain becomes
    violently distraught and withdraws to Tara Luachra. Emer reports his condition
    to Conor, whose learned men and Druids restrain him and give him, and Emer, drinks
    of forgetfulness. Manannan shakes his cloak between Cuchulain and Fand so that
    they will never meet again.
  language: English
  quote_policy: summarized
