canonical_text:
  quote: For kine and for brides
  summary: Ailill and Maev plan to obtain Regamon's cattle as tribute to provision
    future war-hosts. Because their seven sons love Regamon's seven daughters, Maev
    proposes sending the sons. The sons depart with armed support; Mingar, sent as
    a scout, confronts three of the maidens at springs of water, asks their aid, identifies
    himself, and says the party has come for cattle and brides. The maidens warn of
    resistance but indicate willingness to help and inform their sisters.
  language: English
  quote_policy: quoted
