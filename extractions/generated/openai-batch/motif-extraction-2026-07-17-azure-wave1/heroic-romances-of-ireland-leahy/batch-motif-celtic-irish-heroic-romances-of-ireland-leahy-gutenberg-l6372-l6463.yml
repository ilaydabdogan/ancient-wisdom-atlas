  summary: A scholarly note compares the Y.B.L. and Leinster versions of the Fer Diad/Cuchulain
    combat episode, argues that the short older fight-section is probably fragmentary,
    and highlights motifs of Ferdiad being goaded into combat, warrior adornment before
    battle, and Cuchulain visiting Emer on the eve of the struggle. A footnote compares
    the Irish pre-battle beautification pattern with another Ulster-cycle text and
    with Herodotus on Leonidas' comrades.
