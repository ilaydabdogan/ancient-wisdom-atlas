canonical_text:
  quote: ''
  summary: Fraech is introduced as a beautiful but short-lived hero with Connaught
    and Sid lineage. His mother Befind gives him white-eared cattle from the Sid,
    and Findabair, daughter of Ailill and Medb, loves him because of his renown. Preparing
    to approach her, Fraech obtains splendid clothing, weapons, horses, hounds, and
    entertainers from Boand. His company travels to Cruachan, where a watchman marvels
    at them. Their arrival draws a fatal crowd, and their hounds perform feats of
    hunting before Fraech and his retinue sit before the chief rath.
  language: English
  quote_policy: summarized
