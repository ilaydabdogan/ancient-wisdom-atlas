canonical_text:
  quote: ''
  summary: Eocho Bec of Cliu receives counsel and lavish horses and equipment from
    a woman of Sid Cuillne before visiting Ailill and Medb. Ailill requests milking-cows
    for the sustenance of the men of Ireland, Eocho agrees to a cattle contribution,
    and on the homeward journey Eocho's company meets the sons of Glaschu in a fatal
    combat involving royal youths of Munster.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eocho Bec, son of Corpre and king of Cliu, dwells in the Dun of Cuillne with
    forty fosterlings, all sons of kings of Munster, and has forty milch-cows for
    their sustenance.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Ailill and Medb send messengers asking Eocho to come to a conference, and
    Eocho says he will go.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: While asleep one night, Eocho sees a woman and a young man; the woman says
    they dwell in Sid Cuillne and have come to give him counsel.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The woman says her counsel will bring Eocho honour and renown, a stately troop,
    and foreign horses; she names fifty horsemen as the suitable number for him.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The woman promises fifty black horses with gold and silver bridles, fifty
    sets of equipment of the Side, and the participation of all Eocho's foster-children,
    explaining that they help him because he defends their country and soil.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: In the morning, Eocho's people see the promised horses and equipment at the
    castle gate, including black horses, gold and silver gear, silver breeches, gold-edged
    garments, white horses with red ears and purple-red tails and manes, brass foot-chains,
    and white-bronze whips with gold end pieces.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Eocho prepares for the journey to Cruachan Ai; his troop is described as splendid,
    and he is welcomed and feasted there by Ailill and Medb for three days and nights.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Ailill says he invited Eocho to seek a gift of milking-kine for feeding the
    men of Ireland during the bringing of the cattle from Cualgne; after explaining
    his own cattle obligations, Eocho agrees to provide one cow from each farmer under
    his lordship when Ailill promises future aid.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: On the homeward journey, Eocho's company meets the sons of Glaschu from Irross
    Donnan; the groups fight, forty sons of kings around Eocho fall, and the news
    leads to the death in sorrow of four times twenty kings' sons among the youths
    of Munster.
  category: action
  evidence_refs:
  - ev:7
