canonical_text:
  quote: ''
  summary: Eochaid takes sovereignty over Erin and summons the Festival of Tara, but
    the men of Ireland refuse until he has a queen. Messengers find Etain, daughter
    of Etar, and she is brought to him as wife. Ailill Anguba becomes sick from love
    for Etain; a physician names love as one of the fatal pangs beyond leechcraft.
    Etain tends Ailill, he recovers, and she arranges a tryst beyond the fort. Ailill
    sleeps through the appointed hour, while Etain meets a man whose form resembles
    Ailill. Ailill then prepares to keep watch with fire and water.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Eochaid Airemon takes sovereignty over Erin, and the kings of the five provinces
    are described as obedient vassals.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: Eochaid has royal forts, including Fremain in Meath and Fremain in Tethba;
    the Tethba stronghold is especially pleasing to him.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:3
  text: A year after obtaining sovereignty, Eochaid commands the men of Ireland to
    come to Tara for a festival where taxes and imposts are to be adjusted for five
    years.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The men of Ireland answer that they will not hold the Festival of Tara for
    Eochaid until he finds a queen, because no queen stands beside him when he assumes
    the kingdom.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Eochaid sends messengers through the five provinces to seek the fairest woman
    or girl in Erin, with the condition that she has not previously been wife to a
    man of the land.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Etain, daughter of Etar, is found at the Bay of Cichmany and brought to Eochaid's
    palace as a fitting wife because of her form, beauty, descent, brilliancy, youth,
    and renown.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: Ailill Anguba is listed among the sons of Finn son of Findloga, alongside
    Eochaid Fedlech and Eochaid Airemm.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Ailill Anguba becomes seized with love for Etain at the Festival of Tara after
    gazing at her following her marriage to Eochaid.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: 'Ailill''s longing becomes a sickness that he conceals from shame; Fachtna
    the physician says the sickness is one of two fatal pangs not healable by leechcraft:
    envy or love.'
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Eochaid leaves Etain near Ailill while he goes on royal progress, so that
    she may perform Ailill's last rites if he dies, including grave-digging, keening,
    and cattle victims.
  category: action
  evidence_refs:
  - ev:5
- id: obs:11
  text: Etain visits Ailill daily in the sick house, and his sickness is eased by
    her presence while he gazes at her.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Etain asks Ailill the cause of his sickness; Ailill says it comes from love
    for her, and she says he could have been healed earlier had the cause been known.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:13
  text: Etain tends Ailill by fomenting his head, giving him food, and pouring water
    over his hands; after three weeks he is whole.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:14
  text: Ailill says the completion of his cure remains; Etain appoints a tryst for
    the next day on a hill beyond the fort, saying the act will not be done in the
    lawful monarch's dwelling.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ailill sleeps through the appointed tryst hour and does not wake until the
    third hour of the day.
  category: action
  evidence_refs:
  - ev:8
- id: obs:16
  text: Etain goes to the tryst and sees a man whose form is like Ailill's; he laments
    the weakness caused by sickness and gives answers fitting for Ailill.
  category: action
  evidence_refs:
  - ev:8
- id: obs:17
  text: When Ailill awakens, he grieves that sleep prevented him from coming to Etain
    and thinks his chance of being healed has gone.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:18
  text: Etain says there is another morrow; that night Ailill keeps watch with a great
    fire before him and water beside him to put upon his eyes.
  category: action
  evidence_refs:
  - ev:9
