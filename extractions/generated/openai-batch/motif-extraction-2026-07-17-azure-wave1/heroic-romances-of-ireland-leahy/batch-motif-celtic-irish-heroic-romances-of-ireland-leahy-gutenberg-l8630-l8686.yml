canonical_text:
  quote: ''
  summary: A verse introduction describes an old Irish court setting in which audiences
    gathered to hear tales of Cuchulain and other lighter stories before a chief bard.
    It lists episodes involving Maev, Ailill, Regamon, Darla, Fergus, divine and magical
    beings, a guardian snake, Fraech, Finnabar, cattle, swine, a rowan, water, and
    a ring. The passage then reflects on Irish prose tale-telling, ballad forms in
    other lands, and the translator’s decision to render the tales in English ballad
    verse while preserving their spirit.
  language: English
