canonical_text:
  quote: ''
  summary: Ferdia allows Cuchulain to choose weapons, and Cuchulain chooses the Feat
    of the Ford. The two champions fight fiercely at the ford; Cuchulain repeatedly
    leaps onto Ferdia's shield to strike him, while Ferdia throws him off. Laeg taunts
    Cuchulain, after which Cuchulain leaps again and undergoes a fearsome battle-transfiguration
    with hero-light around his head. The combat becomes so close and violent that
    weapons and shields break, supernatural beings scream, the river is driven from
    its bed, horses panic, and camp followers flee.
  language: English
  quote_policy: summarized
