canonical_text:
  quote: ''
  summary: Eocho Bec of Clew is summoned by Maev and Ailill. In sleep he receives
    a fairy woman's counsel and a promise of splendid horses and equipment, which
    appear at dawn. He rides to Croghan with his foster-sons, feasts with Maev and
    Ailill, and agrees to send cattle as tribute for Ailill's campaign. On the return
    journey the sons of Glaschu attack and kill Eocho and his foster-children. Ailill
    later receives a sleep-vision from figures named Conquest and Defeat; the fairy
    woman tells him that Dartaid's cattle can be won by sending his son Orlam, loved
    by Dartaid, with forty young Connaught nobles.
  language: English
  quote_policy: summarized
