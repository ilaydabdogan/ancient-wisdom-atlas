  summary: The introduction identifies manuscript sources for The Raid for Dartaid's
    Cattle, explains how variants from the Yellow Book of Lecan are represented, notes
    a Book of the Dun Cow fragment, and characterizes the tale as a simple example
    of fairy vengeance. It also notes similarities between the troop's appearance
    and descriptions in two other Irish tales, mentions the tale's Munster connection,
    and identifies Orlam as the hero at the end of the tale and as one of Cuchulain's
    earliest victims in the Tain bo Cualgne.
