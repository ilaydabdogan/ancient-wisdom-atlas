canonical_text:
  quote: ''
  summary: Ailill challenges Fraech to swim, discovers Findabar's ring in Fraech's
    purse, and throws it into the flood. Fraech recovers it through a salmon, fetches
    rowan branches at Ailill's request, is attacked by the dragon guarding the rowan,
    receives his sword from Findabar, and kills the monster. Wounded, he is ordered
    a healing bath, then is taken to his fairy/Sid kin and returns the next morning
    healed and accompanied by fifty fairies.
  language: English
  quote_policy: summarized
