canonical_text:
  quote: ''
  summary: Cuchulain and Ferdia exchange verses about shame, friendship, Maev's role,
    and the sorrow of fighting a comrade. They choose heavy swords and shields for
    the day's combat, wound each other severely, cease in the evening, and part sorrowfully.
    The next morning Ferdia comes alone to the Ford of Combat, expecting the decisive
    fall of one or both warriors, arms himself elaborately against the Gae-Bulg, and
    displays newly invented feats. Cuchulain observes this, asks Laeg to spur him
    with reproach or praise as needed, arms himself, displays feats of his own, and
    asks Ferdia what weapons they will use.
  language: English
  quote_policy: summarized
