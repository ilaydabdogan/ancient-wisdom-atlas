canonical_text:
  quote: ''
  summary: A woman is carried off through or over the skylight of a house. After the
    resulting disgrace, two swans are seen around Tara. A road is taken toward the
    elfmound at Femun. Echaid goes with a troop of the men of Ireland to the elfmound,
    glossed as the elfmound of the fair-haired women. The men of Ireland counsel digging
    up each elfmound so that the wife should come back from them; the manuscript is
    fragmentary at this point.
