    and summarizes part of that version: Bricriu reproaches Fergus at a feast, seeks
    bounty from Ailill the Fair, hears of Flidais and her marvellous milk-giving cow,
    praises Flidais and the cow, and carries Flidais''s message of love to Fergus.'
