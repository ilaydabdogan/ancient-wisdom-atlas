canonical_text:
  quote: ''
  summary: Conall Cernach challenges others for renown, receives no challenger from
    Connaught, consumes the enormous tail of the Boar, and gives Connaught only the
    two fore-legs. The small share causes a violent fight between Connaught and Ulster.
    The battle moves from the house to the court and beyond, where Fergus uproots
    an oak. Mac Datho releases the hound to see which side it will favor; it joins
    Ulster, attacks the fleeing Connaughtmen, and is killed by Ferloga, charioteer
    of Ailill and Maev. The passage explains place names connected with the hound.
    Ferloga then seizes Conor, obtains a boon in exchange for sparing him, requires
    Ulster women to sing to him, and later returns to Connaught with two of Conor's
    horses. A concluding song commemorates the conflict and named warriors.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Conall calls for men to contend with him for renown; no man of Connaught challenges
    him, and a wall of shields is raised around him because of hostile casts.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Conall takes the end of the Boar's tail in his mouth and consumes the whole
    tail, which is described as a full load for nine men.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Conall gives the men of Connaught only the two fore-legs of the Boar; they
    judge the share small, and the men of Connaught and Ulster rush at each other.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The fighting inside the house heaps bodies as high as the side-walls, and
    blood flows under the doors; the blood on the floor is described as enough to
    drive a mill.
  category: action
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:5
  text: The hosts break out into the outer court, and Fergus uproots a great oak-tree
    before the battle continues outside.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Mac Datho leads the hound by a leash to release it between the two armies
    in order to see which side the hound will join.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The hound joins the men of Ulster and rushes upon the defeated Connaughtmen
    as they flee.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The hound seizes the poles of the chariot carrying Ailill and Maev; Ferloga
    strikes the hound so that its body is cast aside while its head remains on the
    chariot poles.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The narrative explains the names of the plain of Ailbe and the Ford of the
    Hound's Head by reference to the hound Ailbe and the fall of the hound's head
    from the chariot.
  category: other
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:10
  text: Ferloga falls into the heather, springs behind Conor in his chariot, seizes
    him by the head, and claims a boon in exchange for giving him his life.
  category: action
  evidence_refs:
  - ev:6
- id: obs:11
  text: Ferloga's boon is to be taken to Emain Macha and to have the widows and growing
    maidens of Ulster serenade him at each ninth hour with a song naming him as darling.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The women are forced to perform the song because they fear Conor's wrath;
    after a year Ferloga crosses into Connaught and takes two of Conor's horses with
    golden reins.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:13
  text: A concluding song recounts the Boar's division, the poor Connaught share,
    the struggle for the Ailbe Hound, many named warriors, Fergus with an oak and
    cloak, Cethern holding a ford, and the battle's losses.
  category: speech
  evidence_refs:
  - ev:8
