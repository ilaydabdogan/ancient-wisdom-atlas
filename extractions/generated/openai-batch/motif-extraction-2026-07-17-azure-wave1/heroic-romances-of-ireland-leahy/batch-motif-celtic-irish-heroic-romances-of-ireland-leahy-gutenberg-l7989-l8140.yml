  summary: The passage gives an editorial note on variant figures, then presents a
    literal translation of the “Lament of Deirdre.” The speaker mourns Naisi and the
    other sons of Usnach, contrasts present court pleasures with remembered food,
    fire, music, and companionship, describes Naisi’s tomb, poisoned death, beauty,
    clothing, and arms, blames Conor and Fergus, and declares sleepless grief and
    an approaching early grave.
