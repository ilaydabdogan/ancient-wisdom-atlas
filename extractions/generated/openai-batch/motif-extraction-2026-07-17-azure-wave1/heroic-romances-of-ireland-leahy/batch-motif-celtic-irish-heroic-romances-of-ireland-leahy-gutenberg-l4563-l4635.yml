canonical_text:
  quote: ''
  summary: After the sons of Usnach have been slain, Deirdre remains in Conor's household
    for a year without laughter or lifted spirits. Conor then commands that she be
    sent to Eogan, whom some accounts name as Naisi's killer. In a chariot between
    Eogan and Conor, Deirdre shows hatred toward both men; after Conor compares her
    look to that of a ewe between two rams, she leaps from the chariot, strikes her
    head against rocks, and dies. The passage then gives a genealogical account of
    Magach, Cathbad, Carbre, Rossa, Cathbad's daughters, Conall, the sons of Usnach,
    and Cuchulain, ending by naming the tale as the Third of Griefs.
  language: English
  quote_policy: summarized
