canonical_text:
  quote: ''
  summary: The passage gives a translated poem attributed to Cathbad about Deirdre.
    The poem addresses Deirdre as a destructive cause for Ulster, links her with sorrow,
    exile, violated safeguard, wounds, slaying, wrath against the king of Ulster,
    her grave, and lasting renown. Editorial notes discuss the epithet ingen fial,
    Deirdre's concealment by Conor, and variants in the Book of Leinster, Egerton,
    and Glenn Masain traditions.
