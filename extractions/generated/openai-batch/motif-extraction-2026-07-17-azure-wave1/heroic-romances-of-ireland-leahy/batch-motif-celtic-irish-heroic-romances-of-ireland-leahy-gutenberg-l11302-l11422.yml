canonical_text:
  quote: ''
  summary: Regamon of Connaught possesses many cattle and seven daughters. The seven
    sons of Ailill and Medb love the daughters. Ailill, Medb, and Fergus counsel that
    the sons should go to Regamon to obtain cattle for feeding the men of Ireland.
    The sons set out with heroes, encounter Regamon’s daughters at water-springs and
    a well, and arrange for the maidens to help them take cattle, swine, and sheep
    away secretly. Regamon, absent at a conference, receives news and pursues; his
    host overtakes Mani Morgor and defeats him.
  language: English
  quote_policy: summarized
