canonical_text:
  quote: ''
  summary: Mider comes to Eochaid, complains of hardship, and challenges him to a
    game of chess with a self-chosen stake. After Eochaid loses, Mider asks for an
    embrace and kiss from Etain; Eochaid postpones fulfillment for one month. The
    passage then reports Mider's prior unsuccessful wooing of Etain and gives his
    song inviting the fair-haired woman to a marvellous land described through beauty,
    abundance, sweet streams, intoxicating drink, blemishless people, invisibility
    to others, freedom from sin, gold, pork, ale, and new milk.
  language: English translation with Old Irish text
  quote_policy: summarized
