canonical_text:
  quote: ''
  summary: Fraech learns that his cattle, wife, and children have been taken to distant
    lands. Against his mother's warning he gathers men, gains Conall Cernach as an
    ally, travels overseas to the Alps, receives guidance from two women of Irish
    or Ulster connection, and learns of a castle guarded by a serpent. An insider
    plans to leave the portal open for an attack, but warns that the serpent and a
    serpent host remain the chief obstacle.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Fraech's cattle have been stolen; his wife, children, and cattle are said
    to be hidden in the southern Alps, while three of his kine have been carried by
    Picts to Alba.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Fraech's mother advises him to stay home, warning that the recovery attempt
    may cost his life and offering to replace the lost cattle.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Fraech refuses his mother's advice and states that he is bound by oath or
    guest-obligation to ride in a cattle war connected with Ailill and Maev.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Fraech chooses three times nine men for the expedition and travels with a
    hawk and a hound.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: At Ben Barchi, Fraech meets Conall Cernach, tells him of the stolen goods,
    asks for aid, and Conall joins the expedition.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fraech, Conall, and the company pass over the ocean and through several named
    regions until they reach the Alps.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: A woman herding sheep on the Alps says her mother came from Ireland, calls
    herself kin to the Irishmen, and describes the land as grim and associated with
    raids for captives, women, and cattle.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: The same woman identifies the latest spoil as Fraech's kine, wife, and three
    children, says his wife is where the king dwells, and points out the cattle grazing
    nearby.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:9
  text: The first woman says she lacks strength but can guide them, and directs Fraech
    and Conall to a second woman with the herd, described as Irish-sprung and Ulster-reared.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The second woman welcomes them, hears that the cattle and lady in the towers
    are theirs, and warns that the men of the stronghold obey that lady.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: The second woman states that the greatest danger is the serpent guarding the
    Liss at the gate.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:12
  text: When Conall is identified, the second woman embraces him and says prophecies
    declare that he will sack the stronghold and bring it ruin.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: The second woman plans to leave the castle portal open during the evening
    milking and tells them to enter while the inhabitants sleep, but warns that the
    serpent and a serpent host may foil the plan.
  category: sequence
  evidence_refs:
  - ev:10
