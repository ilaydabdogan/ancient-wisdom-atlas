canonical_text:
  quote: ''
  summary: Ailill confesses a destructive love-sickness for Etain, who is Eocho Fedlech's
    bride and queen. Etain first offers to bring him another woman, then, seeing his
    sickness, tends him and arranges a dawn tryst outside the fort to heal him. Ailill
    repeatedly sleeps through the appointed hour while a man in Ailill's likeness
    comes to Etain. The man reveals himself as Mider of Bri Leith, claims to have
    been Etain's former husband before sorcery separated them, asks her to come with
    him, and says he caused Ailill's love and prevented Ailill from reaching the tryst.
  language: English
  quote_policy: summarized
