canonical_text:
  quote: ''
  summary: After Ailill and Medb regret their attack on Fraech, Ailill orders a healing
    bath for him. Fraech's musicians play deadly plaintive music, and women wash him.
    A supernatural lament is heard from women on Cruachan, identified as mourning
    Fraech, the darling of the king of the Shee. Fraech recognizes the cry of his
    mother and the women of Boand, is taken by them to the Sid of Cruachan, and returns
    the next day whole and unblemished with fairy women around him. Ailill and Medb
    make peace with him. At a feast, Fraech arranges for a salmon containing Ailill's
    ring to be brought to Findabair. Ailill demands the ring from Findabair and threatens
    her life if she cannot return it; she sends her maid to fetch it.
  language: English
  quote_policy: summarized
