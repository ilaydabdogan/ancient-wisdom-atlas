canonical_text:
  quote: ''
  summary: The passage opens the tale of the Driving of the Cattle of Flidais. Flidais,
    wife of Ailill Fair-haired, desires Fergus and sends messengers to him. Fergus
    seeks advice from Ailill of Connaught and Maev, then goes with companions to Ailill
    Fair-haired to request cattle and support. Ailill refuses Fergus because of Flidais's
    love for him. Fergus challenges combat at a ford; several warriors are wounded,
    Flidais protects them with her cloak and later tends them. Ailill Fair-haired
    kills many of Fergus's companions, prompting Ailill of Connaught and Maev to march
    with an army. A parley is attempted, and the wounded are carried out on litters.
  language: English
  quote_policy: summarized
