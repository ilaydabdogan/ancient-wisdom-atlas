canonical_text:
  quote: ''
  summary: A gold ring connected with Find-abair and Fraech is revealed on a honey-dressed
    broiled salmon. Ailill admits that he threw the ring into the Dark Pool after
    finding it in Fraech's purse. Fraech recounts that a salmon swallowed the ring
    after it was thrown into the water, that he caught the salmon, and that this is
    the salmon now on the dish. Find-abair pledges herself to Fraech, while Ailill
    and Medb condition their marriage on Fraech joining the cattle raid with his cows
    and returning with them.
  language: English
  quote_policy: summarized
