canonical_text:
  quote: '"In Mag Mell, the Plain of Delight"'
  summary: 'Liban, the woman in a green mantle, brings Cuchulain a message from Fand:
    Fand has been released by Manannan and loves Cuchulain, while Labraid offers her
    in exchange for one day of Cuchulain''s battle service. Cuchulain sends Laeg with
    Liban to learn the land. Laeg is carried under Liban''s protection, crosses a
    lake in a bronze skiff to an island palace, is welcomed by many women and by Fand,
    and hears of Labraid''s approach and coming warfare. Labraid rejects boasting
    and speaks anxiously of Eochaid Juil''s hosts.'
  language: English
  quote_policy: quoted
