canonical_text:
  quote: Wake from sleep! rise up, joyful and sound!
  summary: A female speaker urges Cuchulain to wake from debilitating slumber. Cuchulain
    rises and meets Liban, who tries to bring him into a fairy hill and describes
    Labra/Labraid’s realm. Cuchulain refuses to go at a woman’s call, so Laeg goes
    with Liban, meets Fand, and returns with a report of the otherworld palace, its
    rulers, trees, well, inexhaustible ale, and a golden-haired lady.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: A female speaker addresses Cuchulain as the hero of Ulster and urges him to
    wake, rise, and look on Conor, the Ulstermen, and their battle array.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speaker says Cuchulain’s long slumber is harmful and compares it with
