canonical_text:
  quote: ''
  summary: Deirdre laments the deaths of Naisi, Ardan, and Ainnle, the sons of Usnach,
    praises their heroic qualities, recalls her love for Naisi, blames guile and a
    dishonored pledge for their deaths, and seeks a place beside Naisi in the tomb.
    After the lament, she sits in the tomb and kisses Naisi before burial. Cathbad
    curses Emain Macha because of the treachery. Fergus, finding his pledge dishonored,
    joins Cormac and Dubhtach in battle against Conor's household; Emain Macha is
    burned, the rebels go to Connaught, and raids between Connaught and Ulster continue
    for years.
  language: English
  quote_policy: summarized
