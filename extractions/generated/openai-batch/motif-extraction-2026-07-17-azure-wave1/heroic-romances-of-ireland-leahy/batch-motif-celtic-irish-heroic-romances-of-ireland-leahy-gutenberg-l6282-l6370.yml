canonical_text:
  quote: ''
  summary: A special editorial note discusses the critical study of the “Combat at
    the Ford” episode and the textual history of the Táin bó Cuailnge. It describes
    two major manuscript-version groupings, summarizes Professor Heinrich Zimmer’s
    theory of an eleventh-century compiler and common source, notes a proposed identification
    of that compiler with Flann of Monasterboice, discusses linguistic arguments for
    older textual elements, and cautions against overconfident dating because of compilation,
    later scribal activity, incomplete manuscripts, and possible alteration of the
    Book of Leinster version.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The note presents the translated episode as a famous example of Irish literature
    and as a case that raises critical problems for literary-historical study.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: 'The passage distinguishes two markedly different versions of the Táin bó
    Cuailnge: an older version represented by Leabhar na h-Uidhri and the Yellow Book
    of Lecan, and a younger version represented by the Book of Leinster.'
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports Zimmer’s conclusion that the source behind Leabhar na
    h-Uidhri and the Yellow Book of Lecan combined several descriptions of the “War,”
    including one represented by the Book of Leinster version.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The compiler is described as more interested in historical and antiquarian
    matters than literary finish, with a preference for archaic and mythical elements
    and with interpolations of historical and antiquarian learning.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: Zimmer is said to have proposed that the compiler was Flann, Abbot of Monasterboice,
    who died in 1047 and was regarded as a major representative of Irish learning.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage says Zimmer’s identification of the compiler has been challenged,
    while his main thesis about the textual relationship remains unshaken.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage asserts, with qualifications, that the common source of Leabhar
    na h-Uidhri and the Yellow Book of Lecan goes back to the early eleventh century
    and used texts similar to those in the Book of Leinster.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: The passage states that linguistic analysis supports the possibility that
    some elements used in the eleventh-century harmony are as old as the earliest
    Irish glosses and may date to the eighth or seventh century.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says the Leabhar na h-Uidhri–Yellow Book of Lecan version of the
    Táin contains many such old elements and may, in the main, be treated as an eighth-century
    text.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The author cautions that these conclusions do not prove that every portion
    of the Leabhar na h-Uidhri–Yellow Book of Lecan version goes back to the eighth
    century or that every portion of the Book of Leinster version predates the common
    source.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: 'The passage notes that both relevant manuscripts are imperfect: the Yellow
    Book of Lecan at the opening and Leabhar na h-Uidhri at the close of the tale.'
  category: object
  evidence_refs:
  - ev:9
- id: obs:12
  text: For the “Combat at the Ford” episode, the older redaction is described as
