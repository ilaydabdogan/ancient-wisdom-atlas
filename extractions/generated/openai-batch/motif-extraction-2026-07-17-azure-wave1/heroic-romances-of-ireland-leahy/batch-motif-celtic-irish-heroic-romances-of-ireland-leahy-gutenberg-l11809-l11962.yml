canonical_text:
  quote: ''
  summary: The passage narrates an assault on the castle of Ailill the Fair-Haired,
    mocking speeches about defeated Ulster champions, the storming and sack of the
    castle by Ulster and Connaught forces, the deaths of Ailill and his defenders,
    the seizure of captives and goods, and Flidais going with Fergus as his future
    wife. It ends by explaining that milk from Flidais's cows later sustained the
    host during the Cualgne cattle raid.
  language: English
  quote_policy: summarized
