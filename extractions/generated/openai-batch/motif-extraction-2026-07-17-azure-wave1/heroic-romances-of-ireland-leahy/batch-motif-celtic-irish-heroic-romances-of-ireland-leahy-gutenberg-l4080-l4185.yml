canonical_text:
  quote: ''
  summary: Naisi and the sons of Usnach are described as exceptional warriors whose
    musical cry causes abundance and joy. Deirdre meets Naisi, presses him to take
    her despite his fear of Cathbad's prophecy, and the sons of Usnach decide to leave
    Ulster with her. They wander in Ireland, are pursued by Conor, are driven to Alba,
    serve the king there, and hide Deirdre from being seen. The king of Alba's steward
    urges that Naisi be killed and Deirdre taken for the king; secret wooing and dangerous
    missions follow. Deirdre warns Naisi of a plot by the men of Alba, and the party
    flees to a sea island. Men of Ulster then advise Conor to recall the sons under
    protection so that the fated slaying may occur in their own land.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Naisi is alone on the rampart of Emain and sends out a musical warrior-cry.
  category: action
  evidence_refs:
  - ev:1
