canonical_text:
  quote: ''
  summary: Fraech and his company are welcomed by Ailill and Medb into a richly adorned
    hall. The passage describes the hall, a jeweled chess-board, food preparation,
    harp music linked to Uaithne the Dagda's harp and the three musical strains, Lothur's
    skilled division of meat, a three-day chess game between Fraech and Medb, delayed
    hospitality remedied with feasting, and Fraech's continued stay and hunting near
    the dun.
  language: English
  quote_policy: summarized
