canonical_text:
  quote: ''
  summary: A note explains the passage as treating the sons of Usnach as men fated
    because of Cathbad's prophecy. The sons agree to return if Fergus, Dubhtach, and
    Cormac serve as sureties, and they cross the sea. Conor delays Fergus by an ale-feast
    and arranges for Eogan and Conor's warriors to kill the sons before they come
    before the king. At Emain, Eogan spears Naisi; Fiacha, Fergus' son, tries to shield
    him, and Naisi is slain through Fiacha's body. Deirdre is taken bound to Conor.
    Fergus, Dubhtach, and Cormac retaliate, Emain is burned, and the avengers go into
    exile in Connaught, raiding Ulster for sixteen years. Deirdre lives in Conor's
    household for a year in grief, speaks laments remembering Naisi and his brothers,
    and rejects Conor's attempt to soothe her.
  language: English
  quote_policy: summarized
