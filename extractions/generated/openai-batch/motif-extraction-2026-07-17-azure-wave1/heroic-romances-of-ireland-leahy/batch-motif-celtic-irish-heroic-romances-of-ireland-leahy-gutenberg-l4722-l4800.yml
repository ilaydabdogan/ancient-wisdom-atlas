  summary: 'The passage is an editorial introduction and synopsis. It discusses Ferdia’s
    motives and character in the Combat at the Ford, the chivalric tone of the dialogue
    between Ferdia and Cuchulain, Laeg’s contrasting exultation, and the background
    to the War of Cualnge: Maev attacks Ulster, most Ulster warriors are disabled
    by a curse, Cuchulain alone remains active with supernatural aid, and Maev makes
    a compact to send one champion per day against him.'
