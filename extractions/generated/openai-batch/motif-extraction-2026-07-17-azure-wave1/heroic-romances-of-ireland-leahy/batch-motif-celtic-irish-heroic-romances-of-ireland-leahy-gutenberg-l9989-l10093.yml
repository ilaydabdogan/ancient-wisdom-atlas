canonical_text:
  quote: ''
  summary: Fraech meets the king’s daughter by the stream and asks whether she will
    elope; she refuses elopement but says she loves him and gives him a ring as a
    token. Ailill and Medb fear the match, demand an excessive dowry and war-aid,
    and then plan a way to kill Fraech without appearing to violate hospitality. At
    the river, Ailill throws the ring into the water; a salmon catches it and Fraech
    catches the salmon. Ailill then sends Fraech for rowan berries; when Fraech goes
    again into the water, a serpent or monster seizes him. Find-abair brings him a
    sword despite Ailill’s attack with a spear, and Fraech kills and beheads the monster.
    The passage ends with an explanation of the place-name Dub-lind Fraech.
  language: English
  quote_policy: summarized
