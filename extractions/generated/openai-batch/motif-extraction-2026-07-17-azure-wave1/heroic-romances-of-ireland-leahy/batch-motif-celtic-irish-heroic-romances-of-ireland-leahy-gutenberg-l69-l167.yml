  summary: The preface argues that ancient Irish literature deserves literary attention.
    It presents Irish literature as preserving ancient European legends and as a link
    between classical antiquity and emerging modern European literatures. It discusses
    possible or asserted influence on Welsh, early Breton, and early French literary
    traditions, including the form of Aucassin and Nicolete and early French poetic
    technique.
