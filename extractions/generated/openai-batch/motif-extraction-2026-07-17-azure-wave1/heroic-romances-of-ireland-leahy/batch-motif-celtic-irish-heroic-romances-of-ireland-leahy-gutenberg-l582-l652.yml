canonical_text:
  quote: ''
  summary: Leahy compares versions of the Irish tales known as the "Sick-bed" and
    "Etain," emphasizing love-story, supernatural, Fairyland, and re-birth elements
    in the Etain tradition. He then discusses the "Combat at the Ford" from the Tain
    be Cuailnge as an old Irish account of a struggle between two friends, and places
    the collected material chronologically before several later European literary
    traditions.
  language: English
