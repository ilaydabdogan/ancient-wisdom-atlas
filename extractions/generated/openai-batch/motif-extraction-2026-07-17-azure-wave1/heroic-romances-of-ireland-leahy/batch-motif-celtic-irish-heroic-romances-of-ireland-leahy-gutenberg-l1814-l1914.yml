canonical_text:
  quote: ''
  summary: Mider challenges Eochaid to chess for stakes. After losing initial games,
    Mider and his fairy host perform large public works demanded by Eochaid, including
    land-clearing and a causeway over Lamrach; the episode also explains the Irish
    custom of yoking oxen at the neck and Eochaid's name. Mider later wins a chess
    game with an open-ended stake and demands to hold and kiss Etain. A retrospective
    explanation says Mider had been wooing Etain and had deliberately allowed Eochaid
    to win earlier games in order to place him in debt.
  language: English
  quote_policy: summarized
