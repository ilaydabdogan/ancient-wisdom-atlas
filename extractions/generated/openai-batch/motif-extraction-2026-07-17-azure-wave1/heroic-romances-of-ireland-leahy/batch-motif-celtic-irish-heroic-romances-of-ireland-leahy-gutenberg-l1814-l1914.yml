- id: obs:4
  text: 'Instead of Mider''s offered gifts, Eochaid demands services benefiting his
    realm: clearing rocks and stones from Meath, removing rushes around Tethba, cutting
    the forest of Breg, and building a causeway across the bog of Lamrach.'
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: After sunset, Eochaid's steward sees Mider, the fairy host, and fairy oxen
    working at the Lamrach causeway while earth, gravel, and stones are poured into
