  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: The fairy-folk place the yoke on the shoulders of the oxen rather than over
    their foreheads; Eochaid later adopts this practice, and the passage gives this
    as the origin of his name Eochaid Airemm, or Eochaid the Ploughman, and of the
    Irish custom.
  category: sequence
  evidence_refs:
  - ev:4
