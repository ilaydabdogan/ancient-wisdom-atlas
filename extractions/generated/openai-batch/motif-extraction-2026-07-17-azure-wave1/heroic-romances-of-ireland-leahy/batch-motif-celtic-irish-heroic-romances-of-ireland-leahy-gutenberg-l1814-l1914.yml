  text: Mider sets out a chessboard and calls on Eochaid to play; Eochaid refuses
    unless they play for a stake.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Mider offers fifty dark-grey, blood-red-headed steeds as his stake.
  category: object
  evidence_refs:
