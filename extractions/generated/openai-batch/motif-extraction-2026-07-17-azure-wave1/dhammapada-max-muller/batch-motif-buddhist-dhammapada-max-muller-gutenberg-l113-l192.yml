- id: motif:2
  label: ethical consequence follows thought and action
  taxonomy_refs:
  - wisdom
  basis: The passage states that what one is results from thought and that pain or
    happiness follows evil or pure thought, with later verses connecting evil or good
    work to suffering or happiness.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: high
  cautions: The extraction uses the passage's language of consequence and does not
    add doctrinal terms not present in the passage.
- id: motif:3
  label: hatred overcome by love
  taxonomy_refs:
  - wisdom
  basis: The passage explicitly says hatred does not cease by hatred and ceases by
    love, in the context of not harbouring grievance-thoughts.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: This is a gnomic ethical formulation rather than a narrative episode.
- id: motif:4
  label: disciplined resistance to the tempter
  taxonomy_refs:
  - wisdom
  basis: Mara, identified as the tempter, overthrows the uncontrolled pleasure-seeker
