  quote: ''
  summary: The passage teaches that thought or mind is difficult to hold, guard, and
    direct. It compares mental discipline to straightening an arrow, taming a flighty
    mind, and making thought firm like a fortress. It describes Mara as a tempter
    whose dominion and bonds are escaped or attacked through knowledge. It contrasts
    the fragile mortal body with the consequences of wrongly or well-directed mind.
  language: English
