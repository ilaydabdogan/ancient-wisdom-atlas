canonical_text:
  quote: ''
  summary: The passage teaches the eightfold way as the unsurpassed path to purification,
    knowledge, and Nirvana. It emphasizes self-effort, restraint of body, speech,
    and mind, insight into impermanence and suffering, cutting away lust and self-love,
    and awareness that death can seize a distracted person despite family or possessions.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The eightfold way, the four words or truths, passionlessness, and the person
    who has eyes to see are each presented as best in their category.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that this way is the only one leading to the purifying
    of intelligence, while everything else is called the deceit of Mara.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: Going on this way is said to make an end of pain, and the way is said to have
    been preached after the speaker understood the removal of thorns.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Individuals must make their own effort; Tathagatas are described as preachers,
    and the thoughtful who enter the way are freed from Mara's bondage.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Seeing that created things perish, that created things are grief and pain,
    and that forms are unreal is said to make a person passive in pain and to lead
    to purity.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: A young and strong but slothful person with weak will and thought is said
    never to find the way to knowledge.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:7
  text: A person is instructed to watch speech, restrain mind, avoid bodily wrong,
    and keep the three roads of action clear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Zeal is said to gain knowledge, while lack of zeal is said to lose knowledge;
    this is described as a double path of gain and loss.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:9
  text: The Bhikshus are told to cut down the whole forest of lust, not merely one
    tree, including its undergrowth, in order to be free.
  category: action
  evidence_refs:
  - ev:4
- id: obs:10
  text: Even the smallest love of man toward women is said to keep the mind in bondage,
    like a calf that drinks milk is bound to its mother.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:11
  text: The hearer is instructed to cut out love of self like an autumn lotus, cherish
    the road of peace, and recognize that Nirvana has been shown by Sugata.
  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: A fool imagines dwelling in one place through the rain, winter, and summer,
    and does not think of death.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Death is described as coming and carrying off a distracted man praised for
