  quote: ''
  summary: The passage gives ethical instruction on avoiding evil, repeating good
    deeds, and understanding that deeds ripen into pain or happiness. It uses similes
    of a water-pot filled drop by drop, a merchant avoiding a dangerous road, poison,
    and dust thrown against the wind. It states that beings are reborn or go to hell,
    heaven, or Nirvana according to conduct and freedom from desire, and that no place
    in sky, sea, or mountain cleft frees one from an evil deed or death.
