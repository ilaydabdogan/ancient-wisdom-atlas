canonical_text:
  quote: ''
  summary: 'The passage gives aphoristic instructions on happiness: living without
    hatred, ailments, greed, or ownership; abandoning victory and defeat; recognizing
    passion, hatred, hunger, and the body as painful; identifying rest and Nirvana
    as highest happiness; tasting solitude, tranquillity, and the law; avoiding fools
    and following the wise.'
  language: English
  quote_policy: summarized
