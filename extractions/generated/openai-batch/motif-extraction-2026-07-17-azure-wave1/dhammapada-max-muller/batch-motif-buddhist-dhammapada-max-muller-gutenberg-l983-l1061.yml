canonical_text:
  quote: ''
  summary: The passage warns a person near death to prepare through effort and wisdom,
    describes impurity and ignorance as taints to be removed, contrasts unrestrained
    and modest conduct, lists destructive actions, uses images for passion, hatred,
    folly, and greed, and concludes that outward acts do not make a true Samana while
    the awakened are free from vanity and unshaken.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person is compared to a sear leaf; messengers of death are near, the person
    stands at the door of departure, and has no provision for a journey.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressed person is told to make himself an island, work hard, and be
    wise; when impurities are blown away and guilt is removed, he will enter the heavenly
    world of the elect and will not enter birth and decay again.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: A wise man is instructed to remove impurities of the self gradually, as a
    smith removes impurities from silver.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: An impurity that springs from iron destroys the iron; similarly, a transgressor's
    own works lead him to the evil path.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Several taints are named, including non-repetition, non-repair, sloth, thoughtlessness,
    bad conduct, greediness, evil ways, and ignorance; mendicants are told to throw
    off ignorance and become taintless.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Life is described as easy for a shameless mischief-maker and hard for a modest,
    pure, disinterested, quiet, spotless, intelligent person.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: Destroying life, speaking untruth, taking what is not given, going to another
    man's wife, and drinking intoxicating liquors are said to dig up one's own root;
    greediness and vice can bring long grief.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: Fretting about food and drink given to others prevents rest by day and night,
    while destroying that feeling and taking it out by the root brings rest by day
    and night.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Passion is compared to fire, hatred to a shark, folly to a snare, and greed
    to a torrent; a person notices others' faults easily and hides his own.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage states that there is no path through the air, that a man is not
    a Samana by outward acts, that Tathagatas are free from vanity, that no creatures
    are eternal, and that the awakened are never shaken.
  category: speech
  evidence_refs:
  - ev:7
