canonical_text:
  quote: ''
  summary: The passage gives instructions and definitions for the Bhikshu and the
    Brahmana/Arhat. It emphasizes non-identification, kindness, meditation, knowledge,
    restraint, cutting passions and fetters, self-discipline, non-retaliation, inner
    truth over birth or outward ascetic marks, and liberation described as Nirvana,
    the quiet place, the other shore, the unmade, and the end of suffering.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A Bhikshu is described as one who does not identify with name and form and
    does not grieve over what is gone.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: A Bhikshu who acts with kindness and is calm in the doctrine of Buddha is
    said to reach Nirvana, described as a quiet place, cessation of natural desires,
    and happiness.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:5
- id: obs:3
  text: The Bhikshu is instructed to empty a boat, cut off passion and hatred, and
    thereby go to Nirvana.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Bhikshu is told to cut off, leave, and rise above five things; one who
    escapes five fetters is called saved from the flood.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Bhikshu is warned to meditate, avoid heedlessness and pleasure-directed
    thought, and not fall into a state where he swallows an iron ball in hell and
    burns in pain.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:6
  text: Knowledge and meditation are presented as mutually necessary, and one who
    has both is near Nirvana.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
