    delight when seeing the law clearly.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:8
  text: Considering the origin and destruction of the bodily elements leads to happiness
    and joy belonging to those who know the immortal Nirvana.
  category: sequence
  evidence_refs:
  - ev:3
