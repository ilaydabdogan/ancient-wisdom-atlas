canonical_text:
  quote: ''
  summary: Didactic verses contrast the fool, the wise person, the Bhikshu-disciple,
    and the Arhat. The passage teaches that foolishness is marked by ignorance of
    the law, delusive possession, bad companionship, evil action, pride, and desire
    for status. Wisdom is marked by receptivity to instruction, virtuous friendship,
    self-discipline, serenity, renunciation, crossing beyond death, freedom from attachment,
    and the completed journey of the Arhat.
  language: English
  quote_policy: summarized
