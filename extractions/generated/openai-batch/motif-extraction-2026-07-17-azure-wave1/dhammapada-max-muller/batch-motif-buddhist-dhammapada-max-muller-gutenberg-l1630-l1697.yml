  quote: ''
  summary: A sequence of verses defines the true Brahmana as a nonviolent, truthful,
    tolerant, desireless, unattached, awakened sage. The passage uses images of a
    mustard seed falling from a needle, brightness like the moon, traversal of a miry
    road to the other shore, freedom from bondage, knowledge of beings' destruction
    and return, and vision of heaven and hell and former abodes.
  language: English
