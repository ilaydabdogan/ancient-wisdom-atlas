  quote: ''
  summary: Chapter II verses 21-32 praise earnestness as the path to Nirvana and oppose
    it to thoughtlessness, vanity, lust, and death. The passage presents wise or meditative
    practitioners attaining Nirvana, making an unoverwhelmed island, keeping earnestness
    as a jewel, climbing heights of wisdom, advancing like a racer, and burning fetters
    like fire. It cites Maghavan (Indra) as having risen to lordship of the gods by
    earnestness and describes a Bhikshu as close to Nirvana.
