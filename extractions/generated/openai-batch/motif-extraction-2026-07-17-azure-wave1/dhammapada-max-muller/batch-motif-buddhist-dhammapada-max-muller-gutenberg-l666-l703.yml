canonical_text:
  quote: ''
  summary: The passage admonishes people in a burning and darkened world to seek light,
    describes the body as wounded, frail, corrupt, and destined for death, contrasts
    destroyed royal chariots and bodies with enduring virtue, compares ignorance in
    old age to an ox, recounts seeing the maker of the tabernacle after many births
    so that it will not be built again, and compares undisciplined old age to old
    herons in a fishless lake and broken bows.
  language: English
