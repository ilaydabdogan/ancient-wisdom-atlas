canonical_text:
  quote: ''
  summary: Verses warn that vanity and attachment to pleasure lead away from meditation
    and produce grief, fear, loss, and fetters. They praise virtue, intelligence,
    justice, truth, and desire for Nirvana, describe such a person as carried upward
    by the stream, and compare good works receiving a departed doer of good to relatives
    greeting a returning friend.
  language: English
  quote_policy: summarized
