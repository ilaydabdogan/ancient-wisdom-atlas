canonical_text:
  quote: '"Look upon the world as a bubble, look upon it as a mirage"'
  summary: The passage exhorts avoidance of evil, false doctrine, thoughtlessness,
    worldly attachment, violence, blame, and lust. It contrasts fools immersed in
    the world with the wise and awakened, who see the world as insubstantial, conquer
    Mara, take refuge in Buddha, the Law, and the Church, understand the four holy
    truths and eightfold way, and are delivered from pain and sorrow.
  language: English
  quote_policy: quoted
