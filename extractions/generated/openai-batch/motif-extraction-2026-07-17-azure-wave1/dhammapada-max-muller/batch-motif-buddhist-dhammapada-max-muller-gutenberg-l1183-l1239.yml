  summary: A sequence of didactic verses contrasts lesser and greater pleasures, harm
    and hatred, negligent and watchful conduct, the true Brahmana, Gotama’s wakeful
    disciples, monastic and worldly hardship, social respect for virtue, the visibility
    of good people, and solitary self-subduing practice.
