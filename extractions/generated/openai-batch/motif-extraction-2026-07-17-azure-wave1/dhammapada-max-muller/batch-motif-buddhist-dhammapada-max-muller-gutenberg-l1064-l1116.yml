canonical_text:
  quote: ''
  summary: A sequence of verses defines true justice, learning, eldership, respectability,
    renunciation, mendicancy, sagehood, and nobility by ethical discernment, restraint,
    compassion, and freedom from desire rather than by violence, talk, age, appearance,
    tonsure, alms-begging, silence, or external practices alone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man is not called just when he settles a matter by violence; the just person
    distinguishes right and wrong and leads by law and equity.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man is not called learned because he talks much; patience and freedom from
    hatred and fear are named as marks of the learned person.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A supporter of the law is not defined by much talking but by seeing the law
    bodily and not neglecting it, even after learning little.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: A man is not an elder merely because of grey hair or age; truth, virtue, love,
    restraint, moderation, freedom from impurity, and wisdom define an elder.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: An envious, greedy, dishonest man is not made respectable by much talking
    or beauty of complexion; respectability is linked to destroying these traits at
    the root, freedom from hatred, and wisdom.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:6
  text: Tonsure does not make an undisciplined false speaker a Samana; one called
    Samana quiets evil, whether small or large.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: A Bhikshu is not defined simply by asking others for alms; the passage links
    the Bhikshu to adopting the whole law, chastity, knowledge, and passing through
    the world above good and evil.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Muni is not defined merely by silence if foolish and ignorant; the wise
    Muni takes the balance, chooses good, avoids evil, and weighs both sides.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: A man is not called Ariya because he injures living creatures; he is called
    Ariya because he has pity on all living creatures.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:10
  text: The passage says release is not earned only by discipline, vows, learning,
    trance, or sleeping alone, and warns the Bhikshu not to be confident before attaining
    the extinction of desires.
  category: speech
  evidence_refs:
  - ev:9
