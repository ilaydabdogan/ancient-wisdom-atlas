    of purpose, mind, and person.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: A person who deals with sense objects without loving or hating them, making
    them serve a free soul, comes to tranquility and peace.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The mind that follows sense appearances is compared to a ship whose helm of
