- id: obs:2
  text: A person who abandons desires, is not dejected in sorrows or overjoyed in
    joys, and dwells outside passion, fear, and anger is described as having attained
    Yog and as Muni, Sage, and Recluse.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage compares withdrawal of the five senses under the spirit's protection
    to a tortoise drawing its four feet under its shield.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Sense objects are said to solicit the senses, and even a governed mind may
    experience sense-storms that threaten self-control.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage gives a sequence in which pondering sense objects leads to attraction,
