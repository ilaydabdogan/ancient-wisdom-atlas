canonical_text:
  quote: ''
  summary: 'Krishna instructs the addressed prince on the marks of the self-governed
    sage: abandonment of desire, steadiness amid joy and sorrow, withdrawal of the
    senses, mastery over attraction and passion, tranquility, wisdom, and final attainment
    of the state of Brahm and Nirvana with the Gods.'
  language: English
  quote_policy: summarized
