canonical_text:
  quote: ''
  summary: Krishna classifies pleasure according to the three Qualities, describes
    duties arising from nature, teaches that one’s own work performed as worship leads
    to perfection, and presents disciplined devotion as leading to oneness with Brahm
    and refuge in Krishna. He instructs Arjuna to act, restricts the teaching to the
    faithful, promises merit to teachers, readers, and hearers, and Arjuna replies
    that his ignorance and doubt are gone.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Pleasure is divided into good pleasure that is bitter at first but later sweet
    like Amrit, Rajas pleasure that begins sweet but ends bitter like poison, and
    Tamas pleasure that springs from sloth, sin, and foolishness and bewilders the
    soul.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Nothing on earth or among the gods is said to live without being bound by
    the three Qualities framed by Nature.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The work of Brahmans, Kshatriyas, Vaisyas, and Sudras is said to be fixed
    by Qualities planted in each, and each group is assigned characteristic virtues
    or tasks.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: A person who diligently and contentedly performs allotted work is said to
    attain perfection through worship wrought by work of the source of all living
    things.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says one’s own work is better than another’s even if faulty, that
    one should not abandon natural duty, and that every work has blame as every flame
    is wrapped in smoke.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The one who has a pure heart, self-control, solitude, spare diet, tamed body,
    speech, and will, meditation, and freedom from passions is said to grow to oneness
    with Brahm, sorrow no more, love all beings equally, and attain and enter Krishna.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Krishna tells Arjuna to do all deeds for him, renounce for him, sacrifice
    heart, mind, and will to him, live in faith, and thereby vanquish dangers by grace.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Krishna says that if Arjuna relies on himself and says he will not fight,
    that purpose will be vain because his qualities and nature will spur him to war.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: A Master is said to live in the hearts of men and to make their deeds dance
    by subtle pulling strings; trusting this Master leads to uttermost repose and
    the Eternal Place.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: Krishna describes the teaching as the Truth of Truths and a mystery more hidden
    than any secret mystery, then tells Arjuna to meditate and act as he wills.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Krishna calls Arjuna precious and beloved, tells him to give his heart, adore,
    serve, and cling to Krishna, and promises that Arjuna will come to him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: Krishna tells Arjuna to let go rites and written duties, fly to Krishna alone,
    make Krishna his single refuge, and be freed from sins.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: The teaching is to be hidden from those without faith, worship, desire for
    wisdom, or those who mock, but taught among Krishna’s lovers as a divinest and
    wisest speech.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: One who teaches the speech in faith and honor is said to come to Brahma, one
    who reads the converse piously is said to have paid Krishna sacrifice, and one
    who hears faithfully is said after death to rise to blessed regions free of flesh.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:15
  text: Arjuna answers that trouble and ignorance are gone, light has come by Krishna’s
    favor, doubt has fled, and he will act according to Krishna’s word.
  category: speech
  evidence_refs:
  - ev:9
