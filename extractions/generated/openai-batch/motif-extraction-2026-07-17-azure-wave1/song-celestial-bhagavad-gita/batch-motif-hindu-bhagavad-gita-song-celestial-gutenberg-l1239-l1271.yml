canonical_text:
  quote: No heart that holds one right desire / Treadeth the road of loss!
  summary: 'Krishna tells Arjuna that one who fails while desiring righteousness is
    not lost: after death he reaches the Region of the Just, is born anew in a favorable
    or rarely Yogin household, resumes prior spiritual progress, and through continued
    Yogic striving over successive births reaches a farther path. Krishna urges Arjuna
    to be a Yogi and says the best Yogi worships him inwardly.'
  language: English
  quote_policy: quoted
