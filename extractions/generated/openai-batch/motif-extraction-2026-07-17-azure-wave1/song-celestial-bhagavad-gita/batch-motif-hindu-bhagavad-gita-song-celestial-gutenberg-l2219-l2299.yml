canonical_text:
  quote: ''
  summary: 'Arjuna asks Krishna whether worship of God as revealed or worship of the
    unrevealed, unbodied divine is the better way. Krishna answers that both devoted
    worshippers come to him, but the path to the Unmanifest is difficult for embodied
    humans. He gives a graded path of devotion, service, refuge, and renunciation,
    promises to lift the devoted soul from life''s ocean of distress and death, and
    describes the qualities of the devotee he loves: compassion, self-mastery, equanimity,
    detachment, steadiness, and single-hearted faith.'
  language: English
  quote_policy: summarized
