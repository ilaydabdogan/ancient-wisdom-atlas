canonical_text:
  quote: Men call the Aswattha,--the Banyan-tree,-- / Which hath its boughs beneath,
    its roots above,-- / The ever-holy tree.
  summary: Krishna teaches about the inverted holy Aswattha tree, the binding roots
    of sense-life and action, detachment as an axe that cuts those roots, the no-return
    divine rest, the Spirit entering and leaving embodied life, Krishna as source
    of cosmic light and vital force, and the Supreme beyond divided and undivided
    being.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Krishna describes the Aswattha, or Banyan-tree, as an ever-holy tree with
    boughs beneath, roots above, and leaves likened to hymns that whisper truth.
  category: object
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tree's branches are described as shooting to heaven and sinking to earth,
    while its hanging rootlets seek the soil; the passage relates these roots and
    branches to human deeds, qualities, sense-temptations, and binding actions.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The teaching says that, if the Tree were known well, an axe of sharp Detachment
    would be whetted to cleave its clinging roots and lay the Aswattha of sense-life
    low.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those who break from passion, dreams, and bonds to flesh, while worshipping
    the Highest, pass to an eternal world and behold a light from which they do not
    return.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The undying Spirit is said to set forth from Krishna, take form, draw senses
    and intellect to itself, enter or quit flesh, and gather these as wind gathers
    scents.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Unenlightened ones do not perceive the Spirit as it comes, goes, or takes
    pleasure in form; those with eyes to see and holy souls striving thereto perceive
    it in themselves.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: Krishna says the glory of suns, the beams of moons, the loveliness of fire,
    living force in clay, sap in plants, vital warmth, and breath-fed bodily nourishment
    come from him.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: 'Being is described as twofold: Divided and Undivided; above both is the Highest,
    Lord, Eternal, Sovereign, First, who fills and sustains all worlds and is called
    Purushottama.'
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:9
  text: Krishna says that knowing him in this way is knowing all, and that the declared
    sacred secret mystery gives wisdom and release from works in bliss.
  category: speech
  evidence_refs:
  - ev:8
