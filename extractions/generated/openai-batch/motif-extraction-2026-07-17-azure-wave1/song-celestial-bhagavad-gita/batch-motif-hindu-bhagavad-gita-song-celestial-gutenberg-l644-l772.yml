canonical_text:
  quote: ''
  summary: Arjuna asks why Krishna urges him toward battle if meditation is superior
    to action. Krishna replies that two paths, works and meditation, are ultimately
    one; no one can avoid action, and one should perform prescribed duty without attachment.
    Krishna describes sacrifice as instituted with mankind by Prajapati, sustaining
    reciprocal exchange with the gods and the cycle of food, rain, toil, and Brahma.
    He teaches that exemplary action maintains world order, that Nature's qualities
    perform actions, and that Arjuna should fight without desire for gain. Arjuna
    then asks what force drives a person unwillingly toward evil.
  language: English
  quote_policy: summarized
