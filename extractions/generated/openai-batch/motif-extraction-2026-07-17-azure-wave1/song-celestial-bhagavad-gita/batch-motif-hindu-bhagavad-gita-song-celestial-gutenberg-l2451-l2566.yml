canonical_text:
  quote: ''
  summary: Krishna teaches Arjuna about supreme wisdom, the universe as womb, divine
    seeding of beings, the three qualities of Nature, the postmortem outcomes linked
    to those qualities, and the way a person passes beyond them through equanimity
    and devotion to attain Krishna/Brahma and immortality.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Krishna says he will disclose an ultimate wisdom by which his saints have
    reached perfectness and are not born again or changed at cosmic cycles.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The universe is described as a womb in which Krishna plants the seed of all
    lives, bringing birth to all beings; Brahma conceives or mothers mortal forms,
    and Krishna fathers by sending seed.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Sattwan, Rajas, and Tamas are named as three qualities of Nature that bind
    the changeless Spirit in changeful flesh in different ways.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage associates Knowledge shining in the Body with Soothfastness, longing
    and unrest with Passion, and darkness, dullness, sloth, and stupor with Ignorance.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:5
  text: A departing soul fixed in Soothfastness goes to a perfect pure place; one
    departing in Impulse enters a world of spirits tied to works; one dying in hardened
    Ignorance is born anew in an unlighted womb.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The fruits of the three qualities are differentiated as sweetness and truth,
    pain and toil, and deeper darkness; souls of the first rise higher, those of the
    second take a middle place, and darkened souls sink to lower deeps.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When a living person perceives that the Qualities are the only actors and
    knows what rules beyond them, that person comes near to Krishna.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Soul that passes beyond the Three Qualities overcomes Birth, Death, Sorrow,
    and Age and drinks the undying wine of Amrit.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Arjuna asks Krishna for the signs, way of life, and safe path of one who has
    gone beyond the Three Modes.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Krishna describes the one beyond the qualities as equanimous toward goodness,
    passion, and ignorance, alike toward grief and joy, clod, marble, gold, praise,
    dispraise, honor, dishonor, friends, and foes.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:11
  text: Krishna says such a person, adoring him with single fervent faith, passes
    beyond the Qualities, conforms to Brahma, attains Krishna, and shares what Krishna
    calls his Amrit, immortality, and felicity.
  category: relationship
  evidence_refs:
  - ev:11
  - ev:12
