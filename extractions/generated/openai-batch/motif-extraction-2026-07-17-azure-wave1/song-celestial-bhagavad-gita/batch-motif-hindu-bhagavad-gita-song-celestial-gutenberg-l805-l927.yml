canonical_text:
  quote: ''
  summary: Krishna tells Arjuna that an ancient deathless Yoga was transmitted through
    Vivaswata, Manu, Ikshwaku, and royal Rishis, then became dim and is now being
    declared again. Arjuna questions how Krishna could have taught an earlier solar
    figure. Krishna answers by describing repeated births, divine manifestation when
    righteousness declines, liberation through knowing his births and works, desireless
    action, and many forms of sacrifice ultimately identified with Brahm.
  language: English
  quote_policy: summarized
