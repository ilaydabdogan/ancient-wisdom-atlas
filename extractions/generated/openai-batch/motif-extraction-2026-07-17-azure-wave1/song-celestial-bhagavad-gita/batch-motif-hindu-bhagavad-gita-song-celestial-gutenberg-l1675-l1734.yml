canonical_text:
  quote: ''
  summary: Krishna tells Arjuna that the gods and Rishis do not know his nature, that
    he is unborn and undying, and that human qualities, cosmic ancestors, and living
    races arise from him. He describes devoted wise people who know him as the source
    of all, cleave to him, and receive from him a mind that draws them to him; he
    dwells within them and dispels ignorance with wisdom's lamp. Arjuna praises Krishna
    as Parabrahm, eternal creator, Lord of Gods, and King of the Universe, then asks
    how to know Krishna's forms and manifestations and says he cannot hear enough
    of such words.
  language: English
  quote_policy: summarized
