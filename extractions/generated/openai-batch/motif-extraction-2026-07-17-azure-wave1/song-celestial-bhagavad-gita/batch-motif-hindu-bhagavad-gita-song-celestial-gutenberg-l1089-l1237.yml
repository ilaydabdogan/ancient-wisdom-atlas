canonical_text:
  quote: ''
  summary: Krishna teaches Arjuna that true renunciation and yoga involve rightful
    action without seeking gain, self-governance, disciplined meditation, moderation,
    sense-restraint, equanimity, and devotion that leads to peace, Nirvana, and unity
    with Brahma. Arjuna questions whether the restless heart can be controlled and
    asks what becomes of one who has faith but fails in the striving.
  language: English
  quote_policy: summarized
