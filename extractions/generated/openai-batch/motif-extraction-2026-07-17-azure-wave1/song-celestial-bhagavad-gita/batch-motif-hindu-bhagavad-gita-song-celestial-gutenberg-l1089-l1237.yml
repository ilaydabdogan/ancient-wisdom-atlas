  category: object
  evidence_refs:
  - ev:5
- id: obs:11
  text: The peaceful yogic state is described as placid mind, Self contemplating self,
    joy beyond the senses, and a state not shaken by grave grief.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:12
  text: The practice requires persistent effort, shaking off longings, shutting the
    doorways of the senses, and repeatedly bringing the wavering heart back under
