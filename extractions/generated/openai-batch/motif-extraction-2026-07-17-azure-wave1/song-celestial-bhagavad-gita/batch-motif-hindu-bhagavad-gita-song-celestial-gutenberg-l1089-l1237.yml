  category: setting
  evidence_refs:
  - ev:3
- id: obs:7
  text: The meditation instructions include fixing the mind on The One, restraining
    heart and senses, holding body, neck, and head immovable, placing the gaze at
    the nose-end, remaining fearless, observing the Brahmacharya vow, and musing on
    Krishna.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Krishna says the controlled and devoted Yogi comes to a peace beyond, identified
    as Krishna's peace and high Nirvana.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: Krishna rejects excessive fasting, feasting, sleep, and vigils, and describes
