canonical_text:
  quote: ''
  summary: 'The dedication and preface characterize the Bhagavad-Gita as a wisdom-bearing
    dialogue between Krishna and Prince Arjun/Arjuna. The preface identifies it as
    an episode in the Mahabharata, describes its authority and philosophical content,
    notes reported parallels with New Testament teachings and uncertainty over its
    date, and summarizes the frame scene: Arjuna speaks with Krishna, the Supreme
    Deity disguised as a charioteer, in a war-chariot between the armies of the Kauravas
    and Pandavas before battle.'
