  quote: I make and I unmake this Universe
  summary: Krishna teaches Arjuna about knowledge of himself, his lower and higher
    nature, his role as source and support of the universe, the veil that hides him,
    the kinds of mortals who know or fail to know him, worship of lower gods, freedom
    from opposites, and refuge from birth and death through devotion to him.
  language: English
