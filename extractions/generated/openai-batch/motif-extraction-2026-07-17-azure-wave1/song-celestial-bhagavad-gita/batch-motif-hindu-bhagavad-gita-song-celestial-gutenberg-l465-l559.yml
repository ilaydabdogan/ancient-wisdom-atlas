  summary: A speaker exhorts Arjuna, a Kshattriya warrior, to perform lawful battle
    without fear, balancing pleasure and pain, gain and loss, victory and defeat.
    The speaker then distinguishes Sankhya from a deeper teaching of Yog, criticizes
    reward-seeking ritual reliance on the Vedas, commends action without attachment
    to fruits, and praises equability, devotion, meditation, and release from bodily
    bonds. Arjuna asks Kesava how to recognize one with a steadfast heart in holy
    meditation.
