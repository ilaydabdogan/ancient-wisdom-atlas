  quote: ''
  summary: Krishna discloses a hidden kingly knowledge to Arjuna, describes his relation
    to the universe as its source, sustainer, and cyclic re-emanator, contrasts ignorance
    and devotion, identifies himself with sacrificial and cosmic realities, explains
    temporary heavenly rewards and other postmortem destinations, accepts simple offerings
    made in faith, and promises that all who turn to him can reach his highest rest.
  language: English
  quote_policy: summarized
