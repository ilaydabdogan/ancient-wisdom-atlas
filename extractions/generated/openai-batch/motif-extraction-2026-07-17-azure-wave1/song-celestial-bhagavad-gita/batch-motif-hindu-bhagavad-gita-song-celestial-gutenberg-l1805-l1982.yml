  quote: ''
  summary: Arjuna asks Krishna to reveal his full divine form. Krishna grants him
    divine sight and manifests a vast universal form containing gods, beings, worlds,
    and cosmic powers. Sanjaya narrates the vision, and Arjuna describes the form
    as countless, radiant, all-encompassing, worshipped by divine beings, and terrifying
    enough to make the worlds quake and Arjuna lose strength.
  language: English
  quote_policy: summarized
