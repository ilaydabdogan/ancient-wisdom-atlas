  summary: Arjuna asks Krishna about worshippers who abandon scriptural ordinance
    but keep faith. Krishna answers by classifying faith, worship, penance, food,
    sacrifice, religious discipline, and gifts according to Sattwan, Rajas, and Tamas,
    ending with the chapter title on the threefold kinds of faith.
  language: English
