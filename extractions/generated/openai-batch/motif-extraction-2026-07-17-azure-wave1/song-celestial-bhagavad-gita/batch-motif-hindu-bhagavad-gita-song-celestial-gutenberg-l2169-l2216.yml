canonical_text:
  quote: The secret countenance of Me, revealed by mystic spell, / Shining, and wonderful,
    and vast, majestic, manifold
  summary: After Arjuna has seen Krishna's vast and terrifying divine manifestation,
    Krishna explains that the vision was granted uniquely because of love and not
    through ritual, scripture, penance, or gifts. Krishna resumes his familiar human
    charioteer form, calming Arjuna. Krishna then says the vision is dreaded and desired
    by gods, and that he is truly known, seen, and entered through service, faith,
    surrender, and love.
  language: English
  quote_policy: quoted
