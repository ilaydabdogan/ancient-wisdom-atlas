canonical_text:
  quote: ''
  summary: Arjuna asks Krishna about Life, Soul, and knowledge. Krishna explains the
    body as Kshetra, the field, and the Soul as Kshetrajna, the knower of the field.
    He lists the constituents of embodied life and the virtues he calls true wisdom,
    then describes the uncreated Para-Brahm as all-pervading, sustaining, ending,
    and recreating worlds. He teaches that Nature and Spirit are beginningless, that
    their bond produces embodied birth, and that knowledge of Purusha and the distinction
    between Matter and Spirit leads beyond death and toward Life.
  language: English
  quote_policy: summarized
