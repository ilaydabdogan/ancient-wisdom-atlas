canonical_text:
  quote: ''
  summary: The speaker teaches that offerings and actions are comprehended through
    knowledge; the sacrifice of Knowledge is superior to material gifts, because value
    lies in intention and service. Truth is learned through reverence, search, and
    teachers who see Truth. Truth is described as a ship carrying even a wrong-doer
    across transgression, and Knowledge as a flame that burns works' dross to ash.
    The faithful self-mastered seeker gains higher peace, while doubters lack peace
    and hope. The speaker commands Arjuna/Son of Bharata to cut doubt with the sword
    of wisdom and arise for the field.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Offerings are said to be spread and accepted in the sight of Brahma, and the
    addressee is told that all proceed by act.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The sacrifice paid by Knowledge is said to be better than great gifts of wealth,
    because the worth of gifts lies in the mind that gives and the will that serves.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: Knowledge or Truth is said to be gained by reverence, strong search, and humble
    heed of those who see and teach Truth.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Knowing Truth is said to end the heart's error and show all things subdued
    to the addressee as the addressee is to the speaker.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Even if the addressee were the worst wrong-doer, the fair ship of Truth is
    said to bear him safe and dry across the sea of his transgressions.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: A kindled flame is compared to a force that feeds on fuel until it becomes
    ash; likewise the flame of Knowledge wastes works' dross away.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Knowledge is called a purifier that the seeker will find in himself after
    becoming perfect.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: A believing soul that masters itself, cleaves to Truth, and possesses knowledge
    comes to higher peace and uttermost repose.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: The untaught, those without full faith, and those who fear or doubt are said
    to have no peace, hope, or happiness here or elsewhere.
  category: attribute
  evidence_refs:
  - ev:5
