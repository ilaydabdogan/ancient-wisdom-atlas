canonical_text:
  quote: ''
  summary: Arjuna asks Krishna to define Brahma, Adhyatman, Karma, Adhibhuta, Adhidaiva,
    Adhiyajna, and how good men find Krishna at death. Krishna answers by identifying
    himself with these divine terms, teaches that the state of meditation at death
    determines the soul's destination, describes disciplined death-meditation with
    OM, contrasts rebirth with returnless attainment of himself, explains cosmic cycles
    of Brahma's day and night, and concludes that this wisdom brings the Yogi to perfect
    peace.
  language: English
  quote_policy: summarized
