  summary: Arjuna asks Krishna to distinguish Sannyas and Tyaga. Krishna teaches that
    true renunciation gives up attachment and the fruits of action while still performing
    prescribed works. He explains action through five necessary factors and classifies
    knowledge, action, doers, intellect, and steadfastness by three qualities.
