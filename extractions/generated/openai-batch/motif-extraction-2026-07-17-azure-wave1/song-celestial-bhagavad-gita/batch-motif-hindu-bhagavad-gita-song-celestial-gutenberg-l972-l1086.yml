canonical_text:
  quote: ''
  summary: Arjuna asks Krishna whether ceasing from works or serving through work
    is better. Krishna answers that both lead to bliss, but holy action without attachment
    is better. He describes the true renouncer, the unity of Sankhya and Yoga, action
    without selfhood or desire for fruits, the sage in the nine-gated town, wisdom
    as light dispelling ignorance, equal vision toward all beings, equanimity, mastery
    of senses and breath, deliverance, and knowledge of Krishna as God revealed and
    unrevealed, Lord of Worlds and lover of all that lives.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: 'Arjuna asks Krishna to state plainly which is better: surcease of works or
    service through work.'
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Krishna says both ceasing from works and doing works in holiness conduct to
    supreme bliss, but working piously without refraining is the better way.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The true renouncer is described as seeking nothing, rejecting nothing, remaining
    firm against the opposites, and breaking lightly from deed while doing.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Krishna says Sankhya and Yoga are spoken of as two by new scholars, while
    wise men know that one rightly held gives the fruit of both; Sankhyans and Yogins
    reach the same high rest.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: A self-ruled and pure-hearted Yogayukt, lost in the common life of all that
    lives, goes straight to Brahm and is not touched by the taint of deeds.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The knower of truth thinks 'Nought of myself I do' during ordinary sensory
    and bodily acts, attributing them to the sense-world acting with senses.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: One who acts in thought of Brahm, detached from the end of action and content
    with action, is said to be unstained by the sense-world like a lotus-leaf by waters.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:8
  text: Yogins let selfhood go and toil with life, heart, mind, and five senses toward
    release; votaries renouncing the fruit of deeds gain endless peace, while those
    seeking fruit are fastened down.
  category: action
  evidence_refs:
  - ev:3
- id: obs:9
  text: The embodied sage is said to sit godlike in the town with nine gateways, neither
    doing nor causing deeds.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:10
  text: The Lord of the world is said not to make work, passion for work, lust for
    fruit, or to take on any person's good or evil deeds; a person's own self pushes
    toward these.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:11
  text: For those whose soul-darkness is chased by light, Truth shines like a Sun
    of Wisdom, and illuminated souls take a road with no turning back, with sins flung
    off by faith.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: The wise seer regards the Brahman with scrolls, the cow, the elephant, the
    unclean dog, and the Outcast eating dog’s meat as all one.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:13
  text: Those fixed on Unity overcome the world here; they are said to be in Brahma,
    and Brahma in Unity.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:14
  text: Krishna instructs not to be over-glad at joy or over-sad at grief, but to
