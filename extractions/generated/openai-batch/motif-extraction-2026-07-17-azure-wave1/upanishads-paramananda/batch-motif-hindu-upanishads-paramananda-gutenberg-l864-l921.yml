canonical_text:
  quote: ''
  summary: 'The passage presents the three-fold Nachiketa fire and its heaven-leading
    effect, explains fire as cosmic revealer and inner life-force, describes Yama
    teaching Nachiketas and naming the fire-sacrifice after him, and then turns to
    Nachiketas''s third boon: knowledge of what happens after death. Yama says even
    the Devas doubted this subtle matter and urges Nachiketas to choose another boon,
    but Nachiketas insists that no teacher equals Death and no other boon equals this
    knowledge.'
  language: English
  quote_policy: summarized
