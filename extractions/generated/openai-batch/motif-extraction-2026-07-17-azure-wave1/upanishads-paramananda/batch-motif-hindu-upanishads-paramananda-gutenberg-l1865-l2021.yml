canonical_text:
  quote: This ancient Aswattha tree has its root above and branches below.
  summary: The passage presents Brahman or the Supreme as the root and foundation
    of all worlds, describes the universe as arising and vibrating in Prana, says
    cosmic powers act from fear of Him, teaches that knowledge before bodily dissolution
    frees one from re-embodiment, compares modes of seeing Him in oneself and in heavenly
    realms, distinguishes the Atman from the senses, outlines a hierarchy beyond the
    senses to Purusha, and describes yoga as the stilling and holding back of the
    senses for supersensuous realization.
  language: English
  quote_policy: quoted
