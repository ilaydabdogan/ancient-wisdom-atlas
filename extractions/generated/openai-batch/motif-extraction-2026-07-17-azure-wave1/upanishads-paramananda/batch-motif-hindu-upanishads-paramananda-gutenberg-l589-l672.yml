canonical_text:
  quote: O Agni (Bright Being)! Lead us to blessedness by the good path.
  summary: The passage closes the Isa-Vasya-Upanishad with a prayer to Agni, then
    explains the Upanishad as teaching knowledge of the all-pervading deity, unity
    of Self and God, liberation through Self-knowledge, and the ocean-drop analogy
    for union with the Whole. It then introduces the Katha-Upanishad as a Vedic text
    centered on a dialogue between Nachiketas and the Ruler of Death concerning the
    Hereafter, followed by a peace chant for teacher and taught.
  language: English
  quote_policy: quoted
