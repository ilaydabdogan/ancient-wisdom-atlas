canonical_text:
  quote: '"This victory is ours. This glory is ours."'
  summary: Brahman wins a victory for the Devas, who become proud and claim the victory
    as their own. Brahman appears before them as an unknown mystery. Agni and Vayu
    each claim universal power but fail to affect a straw placed by Brahman. Indra
    approaches; the mysterious form disappears, and he sees Uma, golden-hued daughter
    of Haimavat, who is presented in the commentary as a personal form through which
    the Absolute gives knowledge.
