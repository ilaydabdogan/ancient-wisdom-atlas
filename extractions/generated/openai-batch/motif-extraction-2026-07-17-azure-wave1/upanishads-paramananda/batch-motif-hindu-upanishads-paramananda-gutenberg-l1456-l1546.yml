canonical_text:
  quote: ''
  summary: The passage presents instruction attributed to Yama on discriminating from
    sense experience toward the subtle Self and Supreme Self. It teaches control of
    speech, mind, intellect, and individual intelligence, urges the seeker to approach
    illumined teachers, describes the path as difficult and razor-sharp, and says
    that knowledge of the eternal, formless reality allows escape from death. It closes
    by praising hearing or devotional recitation of the Nachiketas story and the secret
    of immortality.
  language: English
