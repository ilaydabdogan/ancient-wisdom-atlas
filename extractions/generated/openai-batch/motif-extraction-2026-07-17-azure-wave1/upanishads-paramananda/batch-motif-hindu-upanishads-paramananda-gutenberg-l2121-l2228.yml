canonical_text:
  quote: ''
  summary: 'Kena-Upanishad Part First presents a disciple asking a Master what directs
    mind, life-force, speech, eye, and ear. The teacher answers that Brahman is the
    inner source behind sensory and mental faculties: the ear of the ear, mind of
    the mind, speech of speech, life of life, and eye of eye. The passage says Brahman
    is beyond ordinary perception, speech, thought, and ordinary worship, yet enables
    seeing, hearing, thinking, speaking, and breathing. The accompanying commentary
    contrasts sense-bound knowledge with purified or superconscious knowledge and
    says transcendence of senses and mortal desires leads to immortality.'
  language: English
  quote_policy: summarized
