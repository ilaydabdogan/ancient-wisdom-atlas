canonical_text:
  quote: ''
  summary: The passage describes the human body as a city of eleven gates inhabited
    and ruled by the unborn Self. It presents the Atman/Brahman as dwelling in many
    cosmic and ritual locations, governing breath, remaining awake while others sleep,
    and being the one inner Self in all beings. It states that some individual souls
    enter wombs or immovable forms after death according to deeds and knowledge. It
    uses fire, air, and sun similes to explain how the one Self appears in many forms
    without being defiled, and concludes with the light of the Self by which all other
    lights shine.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The human body is described as a city of the Unborn with eleven gates, and
    the Atman/Self is described as ruler dwelling in that city.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: Thinking on Him and realizing the Supreme Spirit through meditation is said
    to remove grief and lead to liberation.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The same divine referent is described as dwelling as the sun in heaven, air
    in space, fire on the altar, guest in the house, in man, in sacrifice, in ether,
    and in beings born in water, earth, sacrifice, and mountains.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Atman sends incoming Prana upward and outgoing breath downward, and the
    senses worship the Atman seated in the center, identified as the heart.
  category: action
  evidence_refs:
  - ev:3
- id: obs:5
  text: Mortal life is said not to depend on incoming and outgoing breath alone, but
    on another principle on which both breaths depend.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The speaker addresses Gautama, also identified as Nachiketas, and announces
    a declaration of the secret of eternal Brahman and what happens to the Self after
    death.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some individual souls enter wombs to be embodied, while others enter immovable
    forms, according to deeds and knowledge.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: A Being remains awake while all sleep, grants desires, is pure, is Brahman,
    is immortal, and is the support on which all worlds rest.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Atman within living beings is described as one while becoming various
    according to the forms it enters, like fire and air; it also exists outside those
    forms.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The one inner Self of all living beings is said not to be defiled by the misery
    of the world, just as the sun is not defiled by external impurities seen by the
    eyes.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:11
  text: The wise who perceive the one Self seated within their own Self are said to
    attain eternal bliss and eternal peace.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: The sun, moon, stars, lightning, and fire are said not to shine there; when
    He shines, everything shines after Him, and by His light all is lighted.
  category: attribute
  evidence_refs:
  - ev:9
