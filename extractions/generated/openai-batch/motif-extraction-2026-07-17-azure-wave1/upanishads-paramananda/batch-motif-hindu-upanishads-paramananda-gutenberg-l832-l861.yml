  summary: Yama teaches Nachiketas a fire-sacrifice associated with reaching heaven
    and endless worlds. Nachiketas repeats the teaching correctly, and Yama grants
    that the fire-sacrifice will be named after him and gives him a many-coloured
    garland. The passage then states that one who performs the Nachiketa fire-sacrifice
    three times, joined with mother, father, and teacher, and fulfilling three duties,
    crosses birth and death and attains eternal peace.
