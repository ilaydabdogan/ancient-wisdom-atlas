canonical_text:
  quote: ''
  summary: Part Fourth I-XIII describes the senses as directed outward, the wise seeker
    turning inward to perceive the Atman, the ignorant pursuing external pleasures
    and falling under death, the Atman as the condition of perception in waking and
    dream, and the Purusha/Self as lord of past and future dwelling in the heart.
    It also presents images of the Self before water, in the elements and cave of
    the heart, Aditi with Prana, hidden fire in two sticks like a foetus in the womb,
    the sun's rising and setting depending on That, non-difference of visible and
    invisible, and the thumb-sized Purusha like a smokeless light.
  language: English
  quote_policy: summarized
