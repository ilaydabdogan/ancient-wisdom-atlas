canonical_text:
  quote: ''
  summary: A didactic passage describes the Self or Atman as unborn, deathless, subtle,
    great, indwelling in the heart, and all-pervading. It says the Self is neither
    slayer nor slain, cannot be perceived by ordinary senses, and is realized by those
    whose desire, grief, mind, senses, and body are disciplined. The wise distinguish
    body and Soul and do not grieve or fear death or loss.
  language: English
  quote_policy: summarized
