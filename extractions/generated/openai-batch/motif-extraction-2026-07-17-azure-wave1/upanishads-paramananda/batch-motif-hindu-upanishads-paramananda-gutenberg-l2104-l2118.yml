canonical_text:
  quote: May there be no separation from the Brahman.
  summary: A peace chant opening the Kena-Upanishad asks that the speaker’s limbs,
    life-force, senses, and strength increase in vigor; affirms that all is Brahman;
    prays that neither the speaker nor Brahman deny the other; asks for no separation
    from Brahman; and asks that Upanishadic virtues be manifest in the speaker devoted
    to the Atman. The chant closes with repeated peace.
