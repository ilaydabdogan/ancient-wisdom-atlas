canonical_text:
  quote: '"It is Brahman. It is through the victory of Brahman that ye are victorious."'
  summary: Uma tells Indra that the mysterious form is Brahman and that the Devas'
    victory belongs to Brahman. Agni, Vayu, and Indra are said to excel because they
    came nearer to Brahman, with Indra preeminent. Brahman is described as appearing
    and disappearing like lightning. The passage then teaches that the mind approaches
    and remembers Brahman, that Brahman is worshipped as Tadvanam, and that the knower
    reaches the highest abode of Brahman. The closing sections frame the Upanishad
    as instruction about Brahman, grounded in discipline, truth, and Vedic teaching,
    and describe Brahman as the source beyond ordinary perception.
  language: English
  quote_policy: quoted
