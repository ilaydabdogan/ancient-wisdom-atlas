canonical_text:
  quote: ''
  summary: 'The passage opens the first part of the Katha Upanishad narrative: Vahasrava
    performs a sacrifice and gives away depleted cows; his son Nachiketas questions
    the adequacy of the gift and is angrily promised to Death. Nachiketas goes to
    Yama''s abode, waits three nights without food or drink, is received as a Brahmana
    guest, and receives three boons. His first boon concerns reconciliation with his
    father; his second asks Death to teach the fire-sacrifice leading to heaven.'
  language: English
  quote_policy: summarized
