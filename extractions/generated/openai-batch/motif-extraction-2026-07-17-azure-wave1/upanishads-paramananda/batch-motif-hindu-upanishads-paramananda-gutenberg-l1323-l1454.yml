canonical_text:
  quote: Know the Atman (Self) as the lord of the chariot, and the body as the chariot.
  summary: The passage teaches that higher and lower self dwell in the heart as light
    and shadow; describes Nachiketa fire-sacrifice as a bridge and Brahman as the
    fearless other shore; develops a chariot allegory in which Atman, body, intellect,
    mind, senses, and sense objects are mapped to traveler, vehicle, driver, reins,
    horses, and roads; and states that disciplined discrimination leads beyond rebirth
    toward the highest goal and a hierarchy beyond senses, mind, intellect, Atman,
    Unmanifested, and Purusha.
  language: English
  quote_policy: quoted
