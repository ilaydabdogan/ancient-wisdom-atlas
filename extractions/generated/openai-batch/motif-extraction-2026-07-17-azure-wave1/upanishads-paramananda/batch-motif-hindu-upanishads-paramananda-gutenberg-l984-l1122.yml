  quote: ''
  summary: Yama instructs Nachiketas on the distinction between the good and the pleasant,
    the contrast between wisdom and ignorance, the danger of worldly delusion, and
    the need for an illumined teacher to know the Atman. The passage praises Nachiketas
    for rejecting temptations, describes ignorant people as blind led by blind, gives
    an example of silent teaching under a banyan tree, and briefly refers to the Nachiketa
    fire sacrifice performed with perishable things to attain the eternal.
  language: English
