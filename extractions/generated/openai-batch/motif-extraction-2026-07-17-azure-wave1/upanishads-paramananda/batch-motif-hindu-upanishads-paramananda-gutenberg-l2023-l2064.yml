canonical_text:
  quote: ''
  summary: The passage teaches that when desires and heart-ties cease, the mortal
    becomes immortal and attains Brahman. It describes a hundred and one heart-nerves,
    one leading upward through the head to immortality and others leading to different
    worlds. Commentary explains that the desireless mind departs upward through the
    crown, while desireful tendencies lead downward. The inner Self or Purusha is
    described as thumb-sized and seated in the heart; one should draw Him out from
    the body and know Him as pure and deathless.
  language: English
  quote_policy: summarized
