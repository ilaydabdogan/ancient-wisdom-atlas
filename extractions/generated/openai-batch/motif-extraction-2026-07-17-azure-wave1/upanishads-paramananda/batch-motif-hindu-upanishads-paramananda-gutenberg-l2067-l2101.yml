    and death, and attained Brahman. It adds a peace chant invoking the Supreme Being
    for protection, strength, illumination, and absence of enmity, then introduces
    the Kena-Upanishad and describes its analytical purpose of leading thought from
    gross to subtle and toward identity with God-Consciousness.
