  summary: Footnotes explain a cubit and the term translated “Lord.” In Deuteronomy
    4:1–35, Israel is urged to keep Yahweh’s statutes, remember Horeb, teach descendants,
    avoid images and celestial worship, and remain faithful to the covenant. The passage
    recalls divine speech from fire at the mountain, the writing of the ten commandments
    on stone tablets, deliverance from Egypt, warning of destruction and scattering
