canonical_text:
  quote: ''
  summary: The passage prescribes Passover in Abib, the eating of unleavened bread,
    the Feast of Weeks, and the Feast of Booths at the place Yahweh chooses. It requires
    offerings according to blessing, communal rejoicing including dependents and vulnerable
    residents, annual male appearance before Yahweh, just courts, and avoidance of
    Asherah trees and sacred stones beside Yahweh’s altar.
  language: English
