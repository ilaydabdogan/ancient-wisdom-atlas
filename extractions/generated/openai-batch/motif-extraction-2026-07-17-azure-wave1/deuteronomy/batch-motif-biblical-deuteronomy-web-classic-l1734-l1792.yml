candidate_motifs:
- id: motif:1
  label: Covenant renewal before the deity
  taxonomy_refs:
  - covenant
  basis: The passage centers on Israel standing before Yahweh to enter a covenant
    and oath in Moab, mediated by Moses and including present and absent participants.
  evidence_refs:
  - ev:1
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage is legal-covenantal rather than a narrative myth episode,
    though it contains narrative recollection and symbolic language.
- id: motif:2
  label: Divine judgment for covenant abandonment
  taxonomy_refs:
  - divine_judgment
  - covenant
  basis: Turning to other gods and abandoning the covenant brings Yahweh’s anger,
    written curses, personal punishment, land desolation, and exile.
  evidence_refs:
  - ev:11
  - ev:13
  - ev:17
  - ev:18
  confidence: high
  cautions: The judgment is framed within Deuteronomic covenant law, not as an isolated
    mythic punishment tale.
- id: motif:3
  label: Devastated land as visible sign of divine anger
  taxonomy_refs:
  - divine_judgment
  basis: Future observers see plagues, sicknesses, sulfur, salt, burning, and an unproductive
    land, and interpret this as the result of Yahweh’s anger over covenant abandonment.
  evidence_refs:
  - ev:14
  - ev:15
  - ev:16
  - ev:17
  confidence: high
  cautions: The imagery is predictive and explanatory within the covenant discourse.
- id: motif:4
  label: Poisonous root of apostasy
  taxonomy_refs: []
  basis: The passage uses the image of a root producing bitter poison for a person,
    family, or tribe whose heart turns from Yahweh to other gods.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: This is a compact metaphor within a warning, not an extended botanical
    myth.
- id: motif:5
  label: Divine secrets and revealed law
  taxonomy_refs:
  - wisdom
  basis: The closing statement distinguishes secret things belonging to Yahweh from
    revealed things belonging to Israel and its children for obedience to the law.
  evidence_refs:
  - ev:19
  confidence: medium
  cautions: The passage does not narrate acquisition of hidden knowledge; association
    with wisdom is thematic and should be reviewed.
