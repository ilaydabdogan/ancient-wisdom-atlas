  summary: Moses recounts Yahweh’s covenant with Israel in Moab, recalls Egypt, wilderness
    preservation, and victories east of the Jordan, summons all social groups to enter
    the covenant and oath, warns against turning to other gods, describes curses and
    land desolation for covenant abandonment, and distinguishes secret things belonging
    to Yahweh from revealed law belonging to Israel and its children.
  language: English
  quote_policy: summarized
