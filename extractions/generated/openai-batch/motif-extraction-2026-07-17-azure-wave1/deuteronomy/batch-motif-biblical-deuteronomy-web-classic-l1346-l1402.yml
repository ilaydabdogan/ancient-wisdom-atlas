canonical_text:
  quote: ''
  summary: The passage gives regulations for entry into Yahweh’s assembly, recalls
    Ammonite and Moabite refusal of bread and water and the hiring of Balaam, distinguishes
    Edomites and Egyptians, prescribes purity and sanitation for a military camp because
    Yahweh walks there, protects escaped servants, restricts prostitution-related
    offerings, regulates interest, vows, and limited eating from a neighbor’s vineyard
    or grain field.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Persons emasculated by crushing or cutting, persons born of a forbidden union,
    and Ammonites or Moabites are barred from entering Yahweh’s assembly under stated
    generational limits.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The stated reason for excluding Ammonites and Moabites is that they did not
    meet Israel with bread and water on the way from Egypt and hired Balaam son of
    Beor from Pethor of Mesopotamia to curse Israel.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Yahweh did not listen to Balaam and turned the curse into a blessing because
    Yahweh loved the addressed people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The addressees are told not to abhor an Edomite because he is their brother,
    nor an Egyptian because they lived as foreigners in his land; children of the
    third generation born to them may enter Yahweh’s assembly.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: When camping against enemies, the people must keep from every evil thing;
    a man unclean because of something happening at night must stay outside the camp,
    bathe in water at evening, and return after sundown.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: The camp must have an outside place for relieving oneself and a trowel among
    the weapons to dig and cover excrement.
  category: object
  evidence_refs:
  - ev:5
- id: obs:7
  text: Yahweh walks in the middle of the camp to deliver the people and give up their
    enemies; therefore the camp must be holy so that Yahweh does not see an unclean
    thing and turn away.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:8
  text: A servant who escapes from his master to the addressees must not be delivered
    back, may dwell among them in a chosen place within one of their gates, and must
    not be oppressed.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Israelite prostitution is prohibited, and the hire or wages of prostitution
    must not be brought into the house of Yahweh for any vow because they are called
    an abomination to Yahweh.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Interest must not be charged to a brother on money, food, or anything lent
    on interest; interest may be charged to a foreigner, with blessing promised in
    the land to be possessed.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: A vow to Yahweh must be paid without slackness; refraining from making a vow
    is not sin, but what has gone out from the lips and been promised with the mouth
    must be done.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: A person entering a neighbor’s vineyard may eat grapes to satisfaction but
    may not put any in a container; a person entering a neighbor’s standing grain
    may pluck ears by hand but may not use a sickle.
  category: action
  evidence_refs:
  - ev:10
