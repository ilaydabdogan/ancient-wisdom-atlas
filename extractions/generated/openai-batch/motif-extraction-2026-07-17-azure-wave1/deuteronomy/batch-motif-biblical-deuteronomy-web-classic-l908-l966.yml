canonical_text:
  quote: ''
  summary: Chapter 14 identifies the addressees as Yahweh’s children and chosen holy
    people, prohibits certain mourning practices, classifies foods as clean or unclean,
    and regulates annual and triennial tithes for worship, rejoicing, and support
    of the Levite, foreigner, fatherless, and widow.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The addressees are called children of Yahweh their God, a holy people chosen
    by Yahweh as his own possession.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The addressees are forbidden to cut themselves or make baldness between their
    eyes for the dead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Permitted land animals include named domestic and wild animals and, more generally,
    animals that part the hoof, have the hoof split in two, and chew the cud.
  category: object
  evidence_refs:
  - ev:2
- id: obs:4
  text: Camel, hare, rabbit, and pig are designated unclean, and the addressees are
    forbidden to eat pig meat or touch such carcasses.
  category: object
  evidence_refs:
  - ev:2
- id: obs:5
  text: Aquatic creatures with fins and scales may be eaten, while those without fins
    and scales are unclean.
  category: object
  evidence_refs:
  - ev:3
- id: obs:6
  text: Clean birds may be eaten, but a list of birds and all winged creeping things
    are prohibited as unclean.
  category: object
  evidence_refs:
  - ev:4
- id: obs:7
  text: The addressees may not eat anything that dies of itself, though it may be
    given or sold to a foreigner; they are also forbidden to boil a young goat in
    its mother’s milk.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: The addressees must tithe the yearly increase from the field and eat the tithe
    of grain, new wine, oil, and firstborn herd and flock before Yahweh at the place
    he chooses for his name.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: If the chosen place is too far away, the tithe may be converted into money,
    carried to the chosen place, exchanged for desired food and drink, and consumed
    there with rejoicing by the household.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Levite within the gates must not be forsaken because he has no portion
    or inheritance with the addressees.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
  text: Every three years the whole tithe of increase is to be stored within the gates
    so that the Levite, foreigner, fatherless, and widow may eat and be satisfied,
    with Yahweh’s blessing promised on the work of the addressees’ hands.
  category: sequence
  evidence_refs:
  - ev:9
