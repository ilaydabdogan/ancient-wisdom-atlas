candidate_motifs:
- id: motif:1
  label: Restoration of lost property and aid to fallen animals
  taxonomy_refs: []
  basis: The passage repeatedly commands returning a brother’s lost animal or item
    and helping fallen animals by the way.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a legal-ethical pattern rather than a narrative mythic motif.
- id: motif:2
  label: Boundary maintenance through prohibited crossings and mixtures
  taxonomy_refs: []
  basis: The passage prohibits cross-sex clothing, mixed seed, mixed plowing animals,
    mixed wool-linen fabric, and a forbidden father’s-wife relation.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:12
  confidence: medium
  cautions: The broader boundary-maintenance label is interpretive; the text itself
    presents discrete commandments.
- id: motif:3
  label: Release of the mother bird with blessing of long life
  taxonomy_refs: []
  basis: The hen is to be let go while the young may be taken, and the passage links
    this to welfare and prolonged days.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: No external bird-symbol interpretation is supplied by the passage.
- id: motif:4
  label: Prevention of bloodguilt on the house
  taxonomy_refs: []
  basis: The roof railing is required so the builder does not bring blood on the house
    if someone falls.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage frames the act as preventive household responsibility, not
    as a narrative omen.
- id: motif:5
  label: Public adjudication through signs at the city gate
  taxonomy_refs: []
  basis: The parents bring tokens before the elders at the gate; the cloth is spread
    before the elders, who then act against the accuser.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The motif label abstracts a legal procedure from the passage.
- id: motif:6
  label: Removal of evil from the community through sanctioned penalties
  taxonomy_refs: []
  basis: Several penalty cases conclude with formulas about removing evil from among
    the people or from Israel.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The penalties are human legal actions in the passage; no direct supernatural
    punishment is narrated.
- id: motif:7
  label: Sexual offense outcomes distinguished by status, setting, and consent markers
  taxonomy_refs: []
  basis: The passage distinguishes married, betrothed, and unbetrothed women, and
    city versus field settings, with different penalties and explanations.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: This is a legal classification pattern; modern legal or ethical categories
    should not be imported beyond the passage wording.
- id: motif:8
  label: Monetary penalties tied to marriage, reputation, and sexual violation
  taxonomy_refs: []
  basis: A false accuser pays one hundred shekels to the young woman’s father, and
