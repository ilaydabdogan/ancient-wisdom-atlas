canonical_text:
  quote: ''
  summary: Deuteronomy 22 presents laws on returning lost animals and goods, helping
    fallen animals, clothing and mixture prohibitions, treatment of a mother bird
    and young, roof safety, cloak fringes, adjudication of accusations about virginity,
    penalties for adultery and sexual offenses according to status and setting, and
    a prohibition involving a father’s wife.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who sees a brother’s ox or sheep go astray must not hide from them
    but must bring them back; if the owner is not near or known, the animal is kept
    until restored.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same restoration rule is applied to a donkey, a garment, and every lost
    thing found; a fallen donkey or ox by the way must be helped up.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Women are prohibited from wearing men’s clothing, and men from wearing women’s
    clothing; the text calls such acts an abomination to Yahweh.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If a bird’s nest is found with a hen sitting on young or eggs, the hen must
    be let go, while the young may be taken, with welfare and length of days stated
    as the result.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A builder of a new house must make a railing around the roof to avoid bringing
    blood on the house if someone falls.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: The passage prohibits sowing a vineyard with two kinds of seed, plowing with
    an ox and donkey together, and wearing wool and linen woven together; it also
    commands fringes on the four corners of the cloak.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: If a husband accuses his wife of lacking tokens of virginity, her father and
    mother bring the tokens to the elders at the city gate and spread the cloth before
    them.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the accusation is judged false, the elders chastise the man, fine him
    one hundred shekels of silver payable to the young woman’s father, and the wife
    may not be put away all his days.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: If the accusation is true and tokens are not found, the young woman is brought
    to the door of her father’s house and stoned by the men of her city, with the
    stated purpose of removing evil.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: A man found lying with a married woman and the woman both die; the passage
    states this removes evil from Israel.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: If a man lies with a betrothed virgin in the city, both are brought to the
    city gate and stoned, with reasons given for each party.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: If a man forces a betrothed woman in the field, only the man dies; the woman
    is said to have no sin worthy of death because she cried and no one saved her.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: If a man grabs and lies with an unbetrothed virgin and they are found, he
    pays her father fifty shekels of silver, she becomes his wife, and he may not
    put her away.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:14
  text: A man is prohibited from taking his father’s wife and from uncovering his
    father’s skirt.
  category: action
  evidence_refs:
  - ev:12
