canonical_text:
  quote: ''
  summary: The passage recalls Yahweh speaking from heaven and from fire, loving the
    fathers, choosing their offspring, bringing Israel out of Egypt, driving out stronger
    nations, and giving land as an inheritance. It commands Israel to keep statutes
    and commandments for well-being and long life in the land. Moses then sets apart
    three refuge cities beyond the Jordan and introduces the law, testimonies, statutes,
    and ordinances spoken to Israel, with a geographical recap of Amorite lands taken
    east of the Jordan.
  language: English
