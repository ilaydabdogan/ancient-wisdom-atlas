canonical_text:
  quote: ''
  summary: The passage gives laws for priests and Levites, including their lack of
    land inheritance, their portions from offerings, and equal portions for a Levite
    who comes to the chosen place. It prohibits Israel from imitating the nations
    through child-through-fire rites, divination, sorcery, spirit consultation, and
    necromancy. It then promises a prophet from among the people, commands Israel
    to listen to that prophet, and gives penalties and a fulfillment test for presumptuous
    or false prophecy.
  language: English
