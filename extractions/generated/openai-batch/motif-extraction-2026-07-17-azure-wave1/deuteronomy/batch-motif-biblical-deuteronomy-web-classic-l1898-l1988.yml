canonical_text:
  quote: ''
  summary: 'The passage presents the Song of Moses: heaven and earth are summoned
    to hear; Yahweh is praised as just Rock, father, maker, and sole God; Israel/Jacob/Jeshurun
    is remembered as found and nourished in the wilderness but later corrupt and idolatrous;
    Yahweh announces judgment by fire, arrows, hunger, animals, sword, terror, and
    scattering; rival gods are mocked; Yahweh declares power to kill, make alive,
    wound, and heal; vengeance and atonement for land and people are promised; Moses
    and Joshua recite the song to Israel.'
  language: English
  quote_policy: summarized
