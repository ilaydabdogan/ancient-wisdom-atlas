candidate_motifs:
- id: motif:1
  label: Covenant-like song of accusation, witness, judgment, and restoration
  taxonomy_refs:
  - covenant
  - divine_judgment
  basis: The song summons heaven and earth as hearers, recounts Yahweh’s care for
    his people, accuses them of abandoning and provoking him, announces punishments,
    and ends with vengeance and atonement for land and people.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  - ev:8
  - ev:15
  confidence: medium
  cautions: The passage itself does not use the word covenant in the supplied lines,
    so the covenant classification rests on the pattern of relationship, breach, witness-like
    address, sanctions, and restoration.
- id: motif:2
  label: Divine parent and unfaithful children
  taxonomy_refs:
  - divine_parent_child
  basis: Yahweh is called father, maker, and the one who gave birth, while the people
    are called corrupt or faithless children and sons and daughters who provoke him.
  evidence_refs:
  - ev:2
  - ev:6
  - ev:7
  confidence: high
  cautions: The motif is expressed through familial language applied to the people
    collectively rather than through a narrative of an individual divine child.
- id: motif:3
  label: Wilderness nurture by a protecting deity
  taxonomy_refs: []
  basis: Yahweh finds Jacob in desert wilderness, surrounds and keeps him, bears him
    like an eagle with young, leads him alone, and gives rich food and drink.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: No direct available taxonomy family exactly matches this nurture pattern,
    so taxonomy references are left empty.
- id: motif:4
  label: Idolatry provoking divine jealousy and reciprocal provocation
  taxonomy_refs:
  - divine_judgment
  basis: The people provoke Yahweh with strange gods and demons; Yahweh says he will
    move them to jealousy with those who are not a people and anger them with a foolish
    nation.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage frames the action theologically; the extraction records only
    the internal logic of the song.
- id: motif:5
  label: Cosmic fire of divine anger
  taxonomy_refs:
  - divine_judgment
  - world_destroying_fire
  basis: Yahweh’s anger is figured as fire burning to lowest Sheol, devouring the
    earth’s increase, and igniting mountain foundations.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The fire is described as vast and cosmic in reach, but the passage does
    not narrate a completed destruction of the world.
- id: motif:6
  label: Divine warrior vengeance with sword and arrows
  taxonomy_refs:
  - divine_judgment
  basis: Yahweh says he will spend arrows, sharpen a glittering sword, grasp it in
    judgment, repay adversaries, and make arrows drunk with blood.
  evidence_refs:
  - ev:8
  - ev:14
  confidence: high
  cautions: The imagery is poetic speech within a song, not a prose battle scene.
- id: motif:7
  label: Sovereign power over death, life, wounding, and healing
  taxonomy_refs:
  - divine_judgment
  basis: Yahweh declares there is no god with him and says, “I kill and I make alive.
    I wound and I heal.”
  evidence_refs:
  - ev:13
  confidence: high
  cautions: Although the language includes making alive, the passage does not explicitly
    narrate resurrection of a dead individual.
- id: motif:8
  label: Wisdom through ancestral memory
  taxonomy_refs:
  - wisdom
  basis: The people are instructed to remember days of old, consider many generations,
    and ask fathers and elders who will tell them.
  evidence_refs:
  - ev:17
  confidence: high
  cautions: The motif appears as exhortation within the song rather than as a separate
    wisdom tale.
- id: motif:9
  label: Poisoned vine and serpent-venom drink
  taxonomy_refs:
  - serpent
  basis: The enemies’ vine, grapes, clusters, and wine are described as poisonous,
    bitter, and as venom of serpents and asps.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The serpent element is metaphorical imagery for poison in the passage.
