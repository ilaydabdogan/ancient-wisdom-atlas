candidate_motifs:
- id: motif:1
  label: covenant obedience with blessing and curse
  taxonomy_refs:
  - covenant
  basis: The passage repeatedly ties love, service, commandment-keeping, and listening
    to blessing, land, rain, and prolonged days, while disobedience and other-god
    worship bring curse, drought, and loss.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:8
  - ev:9
  - ev:12
  - ev:15
  confidence: high
  cautions: The passage itself uses commandment and blessing/curse language; broader
    covenant classification is based on the supplied taxonomy term.
- id: motif:2
  label: divine judgment by overwhelming sea, swallowing earth, and withheld rain
  taxonomy_refs:
  - divine_judgment
  basis: Remembered destruction at the Red Sea, the earth swallowing Dathan and Abiram,
    and threatened drought for apostasy all present harmful natural forces as consequences
    of Yahweh’s action or anger.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:8
  confidence: high
  cautions: The passage does not frame these as a single named motif; the grouping
    is analytic at the passage level.
- id: motif:3
  label: fertile promised land under divine care
  taxonomy_refs:
  - covenant
  - sacred_exchange
  basis: The land is sworn to the fathers, described as flowing with milk and honey,
    watered by rain from the sky, watched by Yahweh, and made productive when the
    audience listens and serves.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The “sacred_exchange” reference is cautious because the passage’s own
    idiom is conditional obedience rather than an explicit exchange formula.
- id: motif:4
  label: sacred words internalized, worn, taught, and inscribed
  taxonomy_refs:
  - covenant
  - wisdom
  basis: The words are to be placed in heart and soul, bound on hand and between eyes,
    taught to children, and written on house doorposts and gates.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The “wisdom” taxonomy link is broad; the passage emphasizes commandments
    and ordinances more than a general wisdom tradition.
- id: motif:5
  label: territory claimed through crossing and foot-treading under divine protection
  taxonomy_refs:
  - covenant
  basis: The audience is to pass over the Jordan, possess the land Yahweh gives, receive
    all places where the foot treads, and be protected by fear and dread placed on
    the land.
  evidence_refs:
  - ev:11
  - ev:14
  confidence: medium
  cautions: The passage gives a concrete territorial promise; further classification
    beyond covenant is not supplied by the text.
- id: motif:6
  label: paired blessing and curse on two mountains
  taxonomy_refs:
  - covenant
  - duality
  basis: The passage sets blessing and curse before the audience and assigns the blessing
    to Mount Gerizim and the curse to Mount Ebal.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: high
  cautions: The duality is explicit in the paired blessing/curse and paired mountains;
    no additional opposition symbolism is inferred.
