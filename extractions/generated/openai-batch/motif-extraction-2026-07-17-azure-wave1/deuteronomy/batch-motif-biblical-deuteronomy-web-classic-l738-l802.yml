canonical_text:
  quote: "“Behold, I set before you today a blessing and a curse”"
  summary: The passage commands love and obedience to Yahweh, recalls witnessed acts
    in Egypt, the Red Sea, the wilderness, and the swallowing of Dathan and Abiram,
    describes the promised land as rain-fed and divinely watched, sets out conditional
    rain or drought according to obedience or apostasy, commands the teaching and
    inscription of the words, promises territorial possession, and instructs that
    blessing and curse be placed on Mount Gerizim and Mount Ebal when the people enter
    the land.
  language: English
  quote_policy: quoted
