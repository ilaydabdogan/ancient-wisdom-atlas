canonical_text:
  quote: This is the blessing with which Moses the man of God blessed the children
    of Israel before his death.
  summary: The passage includes footnotes on Deuteronomy 32, then presents Moses’
    final blessing over Israel. The blessing recalls Yahweh’s manifestation from mountains
    with a fiery law, names blessings for tribes, describes priestly service, protected
    dwelling, fertile land, animal-like martial strength, divine protection, enemy
    defeat, and Israel’s security.
  language: English
  quote_policy: quoted
