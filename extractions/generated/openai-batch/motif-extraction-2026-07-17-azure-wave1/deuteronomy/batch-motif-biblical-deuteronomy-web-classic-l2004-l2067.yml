candidate_motifs:
- id: motif:1
  label: final covenantal blessing before death
  taxonomy_refs:
  - covenant
  basis: Moses blesses Israel before death; the blessing invokes law as inheritance,
    covenant observance by Levi, and tribal blessings within the gathered people.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: high
  cautions: The passage is a blessing speech rather than a narrative covenant-making
    scene.
- id: motif:2
  label: divine manifestation from sacred mountains with fiery law
  taxonomy_refs:
  - cosmic_mountain
  basis: Yahweh comes from Sinai, rises from Seir, shines from Mount Paran, arrives
    with holy ones, and bears a fiery law; later peoples are called to a mountain
    for sacrifice.
  evidence_refs:
  - ev:3
  - ev:8
  confidence: medium
  cautions: The passage names mountains and divine appearance, but does not explicitly
    describe a world-axis mountain.
- id: motif:3
  label: divine kingship among gathered tribes
  taxonomy_refs:
  - royal_legitimacy
  basis: God is described as king in Jeshurun when heads of the people and all tribes
    of Israel are gathered.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The kingship is divine and communal; no human royal succession is described.
- id: motif:4
  label: divine warrior protector defeating enemies
  taxonomy_refs:
  - divine_judgment
  basis: Yahweh helps against adversaries, strikes opponents, thrusts enemies out,
    commands destruction, and is described as Israel’s shield and sword while enemies
    submit.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:12
  confidence: high
  cautions: The passage frames enemy defeat as blessing and protection rather than
    narrating a battle.
- id: motif:5
  label: beloved protected by the deity
  taxonomy_refs:
  - divine_beloved
  basis: Benjamin is called the beloved of Yahweh and is described as dwelling safely,
    covered all day, and dwelling between Yahweh’s shoulders.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The motif is localized to one tribal blessing.
- id: motif:6
  label: priestly sacrifice and instruction
  taxonomy_refs:
  - sacrifice
  - wisdom
  basis: Levi teaches ordinances and law and offers incense and whole burnt offerings;
    Zebulun and Issachar offer sacrifices of righteousness at the mountain.
  evidence_refs:
  - ev:5
  - ev:8
  confidence: high
  cautions: The passage lists cultic functions within blessings and does not describe
    a full ritual sequence.
- id: motif:7
  label: cosmic and terrestrial abundance blessing
  taxonomy_refs: []
  basis: Joseph’s land is blessed by heavens, dew, deep, sun, moon, ancient mountains,
    everlasting hills, earth’s fullness, and the bush-dwelling one; Israel later dwells
    in grain, new wine, and dew.
  evidence_refs:
  - ev:7
  - ev:12
  confidence: high
  cautions: No available taxonomy reference precisely matches this fertility-abundance
    pattern.
- id: motif:8
  label: animal emblems of martial power
  taxonomy_refs: []
  basis: Joseph has wild ox horns that push peoples, Gad is a lioness that tears arm
