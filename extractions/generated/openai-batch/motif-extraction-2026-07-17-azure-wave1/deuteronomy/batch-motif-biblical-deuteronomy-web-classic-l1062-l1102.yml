canonical_text:
  quote: ''
  summary: The passage gives laws about acceptable sacrifice, investigation and punishment
    of covenant transgression through worship of other gods or heavenly bodies, referral
    of difficult judgments to priests and a judge at Yahweh’s chosen place, and rules
    for a future Israelite king chosen by Yahweh and bound to read and keep the law.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Sacrificing to Yahweh an ox or sheep with a defect or anything evil is prohibited
    and called an abomination.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A man or woman within the gates who transgresses Yahweh’s covenant by serving
    other gods or worshiping the sun, moon, or stars is to be investigated diligently.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: If the accusation is confirmed, the offender is brought to the gates and stoned
    to death; two or three witnesses are required, and the witnesses act first before
    all the people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: Difficult legal matters are to be taken to the place Yahweh chooses, where
    the Levitical priests and the judge give a verdict that must be followed.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person who presumptuously refuses to listen to the priest ministering before
    Yahweh or to the judge is to die, and the people are to hear and fear.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: When the people dwell in the land and seek a king like surrounding nations,
    they must set over themselves the king whom Yahweh chooses, from among their brothers,
    not a foreigner.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: The king must not multiply horses, cause the people to return to Egypt for
    horses, multiply wives, or greatly multiply silver and gold.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: When seated on the throne, the king is to write a copy of the law in a book
    from what is before the Levitical priests, keep it with him, read it throughout
    life, fear Yahweh, keep the statutes, avoid pride above his brothers, and not
    turn aside from the commandment.
  category: sequence
  evidence_refs:
  - ev:6
