canonical_text:
  quote: ''
  summary: Yahweh commands the first-person speaker to cut replacement stone tablets,
    ascend the mountain, and make a wooden ark. Yahweh rewrites the ten commandments,
    the tablets are placed in the ark, Israel travels, Aaron dies and Eleazar succeeds
    him, and Levi is set apart to bear the ark and minister. The speaker recalls forty
    days and nights on the mountain, Yahweh sparing the people from destruction, and
    a command to lead them to the sworn land. Israel is exhorted to fear, love, serve,
    and obey Yahweh, to circumcise the heart, to love the foreigner, and to remember
    the growth from seventy persons in Egypt to a multitude like the stars.
