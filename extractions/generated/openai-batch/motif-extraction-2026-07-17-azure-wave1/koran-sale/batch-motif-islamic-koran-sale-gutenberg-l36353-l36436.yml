canonical_text:
  quote: ''
  summary: 'Sale''s notes on Qur''an chapter LXVI discuss alternative occasions for
    the chapter: a report about Mohammed vowing not to eat honey, and the more received
    report about Mohammed, Mary, Hafsa, and an oath not to touch Mary again. The notes
    also discuss divine allowance for oath-expiation or exceptions, Hafsa''s disclosure
    of a secret to Ayesha, God''s revelation of the disclosure, Gabriel''s direction
    to restore Hafsa, and later traditions about Mary''s death and burial.'
  language: English
  quote_policy: summarized
