  summary: 'The passage describes Islamic prayer practice in Sale''s commentary: five
    daily prayer times, their alleged authorization through Muhammad''s night journey
    to heaven, public calls from mosque steeples, prayer forms and postures, orientation
    toward Mecca, emphasis on inward devotion, modest dress before God, and the exclusion
    of women from public prayer with the main group described.'
