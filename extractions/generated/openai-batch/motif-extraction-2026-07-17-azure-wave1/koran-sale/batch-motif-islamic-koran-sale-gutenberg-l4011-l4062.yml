canonical_text:
  quote: ''
  summary: The passage describes beliefs about examination and torment in the grave,
    Jewish parallels to grave punishment, objections and doctrinal answers concerning
    perception and bodily restoration, and the soul's interval between death and resurrection,
    including angelic conveyance of believers and classifications of faithful souls.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A corpse is described as pressed by the earth and gnawed or stung until the
    resurrection by ninety-nine seven-headed dragons; a variant says sins become venomous
    beasts such as dragons, scorpions, and serpents, with some readers taking this
    figuratively.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The examination of the sepulchre is reported as founded on a tradition of
    Mohammed and hinted at in the Koran; orthodox Mohammedans are said to make graves
    hollow so the deceased can sit up during angelic examination, while the Mtazalites
    reject the doctrine.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: A Jewish account is summarized in which the angel of death sits on the grave,
    the soul reenters the body and raises it, the departed person is examined, and
    the angel strikes the body with a chain half iron and half fire until it returns
    to the grave as dust and ashes.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage reports objections that cries of the examined dead are not heard
    and that some bodies are burned, eaten, or otherwise consumed; the answer given
    is that events beyond the grave are imperceptible to living people and that any
    body part capable of understanding the angels' questions may be restored to life.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: The soul is said to be separated from the body by the angel of death, gently
    for the good and violently for the wicked, and then to enter Al Berzakh, the interval
    between death and resurrection.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: If the departed person was a believer, two angels meet the soul and convey
    it to heaven so that its place may be assigned according to merit and degree.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The souls of the faithful are divided into prophets, whose souls enter paradise
    immediately; martyrs, whose spirits rest in the crops of green birds eating and
    drinking in paradise; and other believers, whose pre-resurrection state is variously
    described, including remaining near sepulchres with freedom to travel.
  category: sequence
  evidence_refs:
  - ev:7
