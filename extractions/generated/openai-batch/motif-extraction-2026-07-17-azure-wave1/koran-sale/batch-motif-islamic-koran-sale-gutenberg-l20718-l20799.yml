canonical_text:
  quote: ''
  summary: Joseph's brothers plead for Benjamin's release, but Joseph refuses to take
    a substitute. The elder brother remains in Egypt because of a solemn promise to
    Jacob. The brothers return to Jacob, who grieves Joseph, loses or weakens his
    sight from mourning, and sends them back to seek Joseph and Benjamin without despairing
    of God's mercy. In Egypt they plead famine and poverty. Joseph reveals himself,
    forgives them, and sends his inner garment to restore Jacob's sight. Jacob perceives
    Joseph's smell before the garment arrives; the messenger places it on his face
    and his sight returns. The brothers seek pardon, and Jacob's household later enters
    Egypt in security.
  language: English
  quote_policy: summarized
