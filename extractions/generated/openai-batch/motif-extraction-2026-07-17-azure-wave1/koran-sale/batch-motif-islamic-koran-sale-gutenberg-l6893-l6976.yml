  quote: ''
  summary: 'The passage discusses rules and interpretations concerning division of
    war spoils: biblical and Jewish precedents, a parallel between disputes over booty
    at Bedr and among David''s soldiers, the Koranic fifth reserved from booty for
    God, the apostle, kin, orphans, the poor, and the traveler, later juristic interpretations
    of that fifth, a tradition about Mohammed distributing shares among related families,
    and rules for immovable captured property.'
