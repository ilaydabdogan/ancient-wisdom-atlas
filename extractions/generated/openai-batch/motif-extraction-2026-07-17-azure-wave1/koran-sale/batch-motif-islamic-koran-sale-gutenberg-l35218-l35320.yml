  summary: The passage contrasts the companions of the left hand, who receive burning
    winds, scalding or boiling water, smoke, Zakkum fruit, and hell fire, with those
    near God and the companions of the right hand, who receive rest, mercy, a garden,
    and peace. It affirms gathering for judgment, answers denial of resurrection with
    appeals to creation, seed, grain, water, and fire, describes the Koran as a revelation
    preserved in a book touched only by the clean, and presents a deathbed challenge
    concerning the soul's return.
