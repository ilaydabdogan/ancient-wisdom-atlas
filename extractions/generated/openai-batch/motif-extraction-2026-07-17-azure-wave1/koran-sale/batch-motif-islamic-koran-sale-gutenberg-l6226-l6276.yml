canonical_text:
  quote: These things were observed by the old Arabs in honour of their false gods
  summary: 'The passage explains several pre-Islamic Arabian animal categories and
    restrictions: Bahra, Sba, Wasla, and Hmi. It describes rules about milk, flesh,
    offspring, slit ears, animals turned loose, sacrifice or sparing of male offspring,
    gender-restricted use, and a stallion camel freed from labour. It concludes that
    these practices honored false gods, were treated as divinely instituted, and are
    condemned in the Koran as impious superstitions.'
