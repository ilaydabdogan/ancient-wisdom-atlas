canonical_text:
  quote: ''
  summary: Joseph's brothers come to him for provisions; Joseph recognizes them but
    they do not recognize him. He requires them to bring their brother Benjamin for
    future grain, secretly has their payment placed back in their sacks, and the brothers
    return to Jacob to ask permission. Jacob expresses distrust because of Joseph's
    earlier loss, invokes God as guardian, requires an oath by God before sending
    Benjamin, and advises the sons to enter by different gates while affirming that
    God's decree and judgment cannot be avoided. Sale's notes add explanatory material
    about Joseph's wise governance during famine, exchange of goods for grain, and
    a commentarial detail in which Simeon remains as pledge.
  language: English
  quote_policy: summarized
