canonical_text:
  quote: ''
  summary: A prophet announces that the ark, containing tranquility from the Lord
    and relics of the families of Moses and Aaron, will be the sign of Talut's kingdom
    and will be brought by angels. Talut leads soldiers and tests them by a river;
    only a few pass the test. The faithful remnant prays for patience and victory
    against Jalut, and David slays Jalut. God gives David kingdom and wisdom. The
    passage then reflects on divine signs, apostles, Jesus son of Mary, the holy spirit,
    and later disputes among those who followed the apostles.
  language: English
  quote_policy: summarized
