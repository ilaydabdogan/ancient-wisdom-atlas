literal_observations:
- id: obs:1
  text: The passage opens by naming 'the infallible' and asking what will make the
    addressee understand it; the translator's note identifies the term as an epithet
    of the day of judgment.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tribes of Thamud and Ad denied the terrifying day; Thamud were destroyed
    by a terrible noise, and Ad by a roaring furious wind lasting seven nights and
    eight days.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The people of Ad are described as lying prostrate like the roots of hollow
    palm-trees, with none remaining visible.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pharaoh, those before him, and the overthrown cities are said to have sinned,
    disobeyed the apostle of their Lord, and received abundant chastisement.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: When the water of the deluge rose, the speaker says 'we carried you' in an
    ark that swam on it, making the event a memorial.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: At one trumpet blast, the earth is moved, the mountains are dashed in pieces,
    the judgment hour comes, and the heavens split and fall in pieces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Angels are described as being on the sides of the heavens, and eight bear
    the throne of the Lord above them on that day.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: People are presented before God's judgment-seat, and none of their secret
    actions are hidden.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: The person whose book is delivered into his right hand invites others to read
    it, says he expected his account, and receives a pleasing life in a lofty garden
    with near fruits and food and drink.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:10
  text: The person whose book is delivered into his left hand wishes he had not received
    or known the account, says death should have ended him, and says his riches and
    power have passed from him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: God commands the keepers of hell to bind the left-hand recipient, cast him
    into hell to be burned, and place him in a chain seventy cubits long.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: The reason given for the punishment is that the condemned person did not believe
    in God and did not care to feed the poor; he has no friend and no food except
    the corruption flowing from the damned.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The passage swears by what is seen and unseen that the discourse is that of
