  quote: ''
  summary: Chapter LXIX names the inevitable day of judgment, recalls destroyed peoples
    and the deluge ark, describes cosmic upheaval at the trumpet blast, presents judgment
    by books delivered to the right or left hand, contrasts garden reward with hell
    punishment, and affirms the discourse as revelation from God rather than poetry
    or soothsaying.
