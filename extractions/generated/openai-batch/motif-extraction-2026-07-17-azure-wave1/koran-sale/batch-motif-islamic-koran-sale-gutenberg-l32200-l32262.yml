canonical_text:
  quote: ''
  summary: A believing man among Pharaoh's people warns his people that earthly power
    cannot protect them from God's punishment, recalls former peoples and Joseph's
    signs, describes judgment, hell, and paradise, and invites them to God. Pharaoh
    orders Haman to build a tower to reach the tracts of heaven and view the God of
    Moses, but his stratagem ends in loss. The believer commits his affair to God,
    is delivered, and Pharaoh's people are encompassed by punishment. Notes compare
    the speech to Gamaliel and report a commentary tradition about the believer fleeing
    to a mountain and being guarded by wild beasts.
  language: English
  quote_policy: summarized
