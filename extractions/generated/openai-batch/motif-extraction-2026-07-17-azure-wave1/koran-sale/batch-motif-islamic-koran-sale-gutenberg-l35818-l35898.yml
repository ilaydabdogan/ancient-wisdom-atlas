  quote: ''
  summary: The passage opens Chapter LX, titled “She Who Is Tried,” and addresses
    true believers. It warns them not to take hostile unbelievers as friends, cites
    Abraham and those with him as an excellent example of renouncing idolatrous people,
    distinguishes just treatment of non-hostile outsiders from forbidden alliance
    with those who fought and expelled believers, and gives rules for testing believing
    women who come as refugees and for handling marriages and dowers across the religious
    boundary.
  language: English
  quote_policy: summarized
