  summary: The passage includes editorial notes, including a tradition that Dhu'lkefl
    cared for a hundred Israelites fleeing slaughter and a conjectural link to Obadiah.
    In the main text, God expels and curses Eblis until judgment. Eblis asks for respite
    until resurrection, receives respite until a determined time, and vows to seduce
    all except God's chosen servants. God declares that hell will be filled with Eblis
    and his followers. The closing address tells the Meccans that no reward is asked
    for the preaching, and describes the Koran as an admonition to all creatures whose
    truth will be known after a season.
