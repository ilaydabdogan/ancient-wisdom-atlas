canonical_text:
  quote: ''
  summary: 'The passage includes translator notes on earlier material concerning Shoaib,
    the Midianites, false weights and measures, Sodom and Gomorrah, and imagery of
    being mown down. The main translated passage states that unjust peoples harmed
    themselves, that their invoked gods did not help them when God''s decree came,
    and that God''s punishment of unjust cities is severe. It describes the Last Day
    as an assembly where witness is borne, speech and intercession occur only by God''s
    permission, and people are divided into miserable and happy groups: the miserable
    are cast into hell fire, while the happy enter paradise. It then warns against
    ancestral worship, recalls Moses receiving the book of the law and disputes over
    it, notes doubt about the Koran, and commands steadfastness, avoidance of injustice,
    regular prayer, good works, patience, and trust that God preserves the reward
    of the righteous.'
  language: English
  quote_policy: summarized
