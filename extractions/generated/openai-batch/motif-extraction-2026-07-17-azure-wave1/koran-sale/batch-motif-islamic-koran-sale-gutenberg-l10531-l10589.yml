canonical_text:
  quote: ''
  summary: 'The passage recounts Abraham asking God to show how the dead will be raised.
    God instructs him to divide four birds, place parts on mountains, call them, and
    see them come swiftly. The passage then gives moral similitudes about almsgiving:
    sincere giving is multiplied like grain or a watered garden, while giving followed
    by reproach, mischief, or ostentation is likened to rain-washed flint and to a
    fruitful garden destroyed by fiery wind. Notes elaborate the bird episode, compare
    it to Abraham''s bird sacrifice in Genesis, and explain the almsgiving images.'
