literal_observations:
- id: obs:1
  text: The passage reports that Maundeville said Mahomet commanded that a man should
    have two, three, or four wives, while Muslims of his time allegedly took more
    wives and concubines according to their ability to maintain them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: If a woman is divorced before consummation, she is said not to have to wait
    a specified time, and the man is said to owe only one half of her dower.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: A divorced woman with a young child is said to suckle the child until two
    years old, while the father maintains her; a widow is also said to have to nurse
    and wait four months and ten days before remarriage.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The author states that these divorce, widowhood, and nursing rules are copied
    from Jewish rules, which require a divorced woman or widow to wait ninety days
    before marrying again and require maintenance for a nursing woman for two years
    from the child's birth.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage says that early Islamic rules severely punished whoredom by imprisonment
    until death, and later Sonna rules ordained stoning for an adulteress and scourging
    plus banishment for an unmarried woman guilty of fornication.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: 'A female slave convicted of adultery is said to receive half the punishment
    of a free woman: fifty stripes and six months'' banishment, but not death.'
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Four witnesses are said to be expressly required to convict a woman of adultery
    in a capital case, and the commentators are said to require those witnesses to
    be men.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: A man who falsely accuses a reputable woman of whoredom and cannot support
    the charge with the required number of witnesses is said to receive eighty stripes
    and to have his future testimony invalidated.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: Fornication in either sex is said to be punished by one hundred stripes according
    to the Koranic sentence described here.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: If a husband accuses his wife of infidelity without sufficient evidence, he
    may swear four times that it is true and on a fifth occasion invoke God's vengeance
    if false; the wife may avoid punishment by taking corresponding oaths and imprecation,
    though the marriage should be dissolved.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The author states that many of the preceding Koranic decisions agree with
    Jewish decisions and cites Mosaic law prescribing death for adultery involving
    a married woman or a betrothed virgin and the man who debauched them.
  category: relationship
  evidence_refs:
  - ev:11
