  text: If such people withdraw, do not fight, and offer peace, the believers are
    told that God does not allow taking or killing them.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Another group is described as seeking confidence with both the believers and
    their own people; if they do not withdraw, offer peace, and restrain their hands
    from war, the believers are told to take and kill them wherever found.
  category: relationship
  evidence_refs:
  - ev:4
