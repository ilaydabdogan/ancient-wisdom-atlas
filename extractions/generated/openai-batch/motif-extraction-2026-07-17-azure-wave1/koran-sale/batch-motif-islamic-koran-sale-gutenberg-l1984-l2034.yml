canonical_text:
  quote: ''
  summary: 'The passage describes the development of Arabic script by named scribes,
    then summarizes valued Arab accomplishments: eloquence, arms and horsemanship,
    and hospitality. It emphasizes oratory and poetry as socially honored arts, with
    poetry preserving lineage, tribal rights, heroic memory, and language, and being
    consulted for instruction and disputed matters. A tribe publicly celebrates the
    rise of an admired poet with congratulations, entertainments, women in nuptial
    ornaments, singing, and timbrels.'
