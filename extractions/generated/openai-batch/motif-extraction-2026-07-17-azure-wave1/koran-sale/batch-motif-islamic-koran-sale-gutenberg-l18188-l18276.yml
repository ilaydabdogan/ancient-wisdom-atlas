canonical_text:
  quote: Do ye expect any other should befall us, than one of the two most excellent
    things; either victory or martyrdom?
  summary: 'The passage addresses an opposing or hypocritical group: it contrasts
    victory or martyrdom with divine punishment, rejects unwilling pious contributions
    from unbelievers, describes wealth and children as a worldly punishment for them,
    depicts them as fearing and seeking refuge, criticizes complaints over alms, prescribes
    eligible alms recipients, and answers an insult against the prophet.'
