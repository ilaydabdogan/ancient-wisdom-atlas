canonical_text:
  quote: ''
  summary: The passage recounts David judging a dispute presented by two adversaries
    and then repenting after perceiving a divine trial; David is forgiven and commanded
    to judge truthfully. It states that creation is not vain, warns of judgment, and
    says a blessed book was sent to Mohammed. Solomon is described as an excellent
    servant; he is distracted by horses, later tested by a counterfeit body on his
    throne, prays for forgiveness and a unique kingdom, and receives command over
    wind and devils. Job cries to God after Satan afflicts him, receives a healing
    fountain from the earth, has his family restored, is instructed concerning an
    oath involving rods and his wife, and is praised as patient. Abraham, Isaac, and
    Jacob are remembered as prudent servants.
  language: English
  quote_policy: summarized
