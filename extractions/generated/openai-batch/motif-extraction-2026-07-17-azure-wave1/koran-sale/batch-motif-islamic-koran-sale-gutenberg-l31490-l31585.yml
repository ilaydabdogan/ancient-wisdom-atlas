candidate_motifs:
- id: motif:1
  label: trial followed by repentance and divine forgiveness
  taxonomy_refs:
  - divine_judgment
  basis: David perceives the parable as a trial, asks pardon, bows, repents, and is
    forgiven; Solomon is also tried and turns to God; Job is tested through affliction
    and praised as patient.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:7
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage frames several trials, but their narrative details differ;
    this motif label groups them by repeated trial-and-return language.
- id: motif:2
  label: truthful kingship under divine authority
  taxonomy_refs:
  - royal_legitimacy
  basis: David is appointed sovereign prince and told to judge with truth; Solomon
    prays for a unique kingdom and receives command over wind and devils as a divine
    gift.
  evidence_refs:
  - ev:3
  - ev:7
  - ev:8
  confidence: high
  cautions: Royal authority is explicit for David and Solomon, but the passage also
    subordinates that authority to divine command.
- id: motif:3
  label: moral recompense and day of account
  taxonomy_refs:
  - divine_judgment
  basis: The passage warns against erring from God's way because of the day of account,
    says creation is not vain, threatens hellfire for unbelievers, and contrasts the
    treatment of good workers with the corrupt.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: This is a doctrinal motif in the passage rather than an extended narrative
    episode.
- id: motif:4
  label: destruction or offering of prized animals after neglected devotion
  taxonomy_refs:
  - sacrifice
  basis: Solomon says he loved earthly good above remembrance of his Lord while viewing
    horses until sunset, then cuts off their legs and necks; the source note explains
    that he killed them as an offering to God after neglecting prayer.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
  cautions: The sacrificial interpretation comes from the source note, while the main
    translated passage states the cutting/killing action without explicitly calling
    it an offering.
- id: motif:5
  label: command over wind and spirits
  taxonomy_refs:
  - royal_legitimacy
  basis: After Solomon asks for a unique kingdom, the wind is subjected to him and
    devils are placed under him as builders, pearl divers, and chained captives.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The available taxonomy has no exact separate family for mastery of winds
    or spirits; royal_legitimacy is used because the powers are attached to Solomon's
    unique kingdom.
- id: motif:6
  label: healing water from the struck earth
  taxonomy_refs: []
  basis: Job is commanded to strike the earth with his foot, and a fountain springs
    up for washing, refreshment, and drinking after his affliction.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The symbol taxonomy supports water, but the provided motif-family list
    has no exact healing-fountain motif.
- id: motif:7
  label: restoration after affliction
  taxonomy_refs: []
  basis: Job suffers calamity and pain attributed to Satan, receives the fountain,
    and has his family restored with as many more through divine mercy.
  evidence_refs:
  - ev:9
