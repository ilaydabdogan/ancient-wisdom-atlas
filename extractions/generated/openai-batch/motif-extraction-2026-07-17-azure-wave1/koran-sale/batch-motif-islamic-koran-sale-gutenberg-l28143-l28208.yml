canonical_text:
  quote: ''
  summary: Moses reaches maturity and receives wisdom and knowledge from God. In the
    city he intervenes in a fight, kills an enemy of his party, repents, and is forgiven
    by God. After a second quarrel and a warning that the magistrates intend to kill
    him, he flees the city, prays for deliverance and guidance, journeys toward Madian,
    and at the well helps two women water their sheep before praying again for divine
    good.
  language: English
  quote_policy: summarized
