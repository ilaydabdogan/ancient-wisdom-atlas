canonical_text:
  quote: ''
  summary: A divine book is said to speak truthfully concerning human deeds. Believers
    who did good works are led by their Lord into mercy, while unbelievers are confronted
    over rejecting signs, doubting the hour of judgment, mocking, and being deceived
    by worldly life. Their evil deeds appear to them, they are forgotten as they forgot
    the meeting of that day, and their abode is hell fire with no deliverer. The passage
    closes with praise of God as Lord of heaven, earth, and all creatures, mighty
    and wise.
