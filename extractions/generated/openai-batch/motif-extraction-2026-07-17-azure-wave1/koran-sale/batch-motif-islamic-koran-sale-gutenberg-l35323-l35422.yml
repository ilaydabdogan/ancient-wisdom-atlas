canonical_text:
  quote: ''
  summary: The passage opens Chapter LVII by declaring God's universal praise, sovereignty
    over heaven and earth, power to give life and death, creation of the heavens and
    earth in six days, ascent to the throne, knowledge of all movements between heaven
    and earth, and alternation of night and day. It urges belief, covenant fidelity,
    almsgiving, contribution, fighting for the faith, and lending an acceptable loan
    to God. It then presents an eschatological scene in which believing men and women
    have light before them and at their right hands and receive tidings of gardens
    with rivers, while hypocritical men and women seek to borrow light, are separated
    by a wall and gate, and are assigned to hell fire along with unbelievers. The
    passage also warns believers against hardened hearts, states that God quickens
    the dead earth, and contrasts rewarded believers with unbelievers who become companions
    of hell.
  language: English
  quote_policy: summarized
