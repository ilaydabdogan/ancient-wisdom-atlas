  summary: The passage recounts Pharaoh threatening believers, Moses leading God's
    servants by night, Pharaoh's forces pursuing them, the sea dividing when Moses
    strikes it with his rod, Moses and his followers being delivered, and the pursuers
    being drowned. It then shifts to Abraham questioning his father and people about
    idol worship, declaring devotion to the Lord who creates, guides, nourishes, heals,
    causes death and restoration to life, and asking for wisdom, righteousness, forgiveness,
    and safety on the day of resurrection and judgment.
