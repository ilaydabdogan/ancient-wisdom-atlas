canonical_text:
  quote: ''
  summary: The passage opens Chapter XII, Joseph, with a revelation frame. Joseph
    tells Jacob of a dream in which eleven stars, the sun, and the moon make obeisance
    to him. Jacob warns him not to disclose the vision to his brothers and says God
    will choose him and teach him the interpretation of dark sayings. Joseph's brothers
    resent the greater affection shown to Joseph and his brother, propose killing
    or removing Joseph, and one brother advises instead that he be thrown into a well
    for travellers to find. The brothers ask Jacob to send Joseph with them; Jacob
    fears a wolf may devour him, and they deny such a danger would be credible given
    their number.
  language: English
