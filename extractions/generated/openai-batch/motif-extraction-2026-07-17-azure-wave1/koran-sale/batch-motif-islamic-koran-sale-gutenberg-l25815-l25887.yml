canonical_text:
  quote: ''
  summary: The passage asserts that God is truth and that invoked powers besides God
    are vanity. It describes God sending water that greens the earth, subjecting earth
    and ships to human service, holding the heaven from falling, giving life, causing
    death, and raising humans at the resurrection. It says rites are appointed for
    religious communities and that God will judge disputes on the day of resurrection.
    It warns unbelievers of hellfire, gives a parable in which idols cannot create
    or recover anything from a fly, states that God chooses messengers from angels
    and men, and exhorts true believers to worship, prostrate, fight for the religion,
    follow the religion of Abraham, pray, give alms, and adhere to God. Sale’s notes
    explain the falling of heaven at the last day, the fly parable, and angelic messengers.
  language: English
  quote_policy: summarized
