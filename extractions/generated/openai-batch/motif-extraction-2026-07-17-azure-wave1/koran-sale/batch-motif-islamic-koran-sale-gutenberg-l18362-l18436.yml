- id: obs:3
  text: Commentators report that fifteen men plotted to kill Mohammed on his return
    from Tabc by pushing him from his camel into a precipice at night over al Akaba;
    Hodheifa heard camels and arms, gave the alarm, and the conspirators fled. An
    alternative interpretation is that the design was a plot to expel Mohammed from
    Medina.
  category: sequence
  evidence_refs:
  - ev:3
