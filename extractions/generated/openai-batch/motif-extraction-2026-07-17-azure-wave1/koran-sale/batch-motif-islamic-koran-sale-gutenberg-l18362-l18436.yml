canonical_text:
  quote: ''
  summary: The passage combines translator notes and Qur'anic text concerning those
    condemned for derision, refusal of expeditionary duty, and unbelief. Notes describe
    incidents involving al Jalls, a reported plot against Mohammed on return from
    Tabc, Medina's material benefit from Mohammed's presence, and Thalaba's request
    for riches followed by refusal of alms. The Qur'anic portion condemns those who
    mock almsgivers, declares divine refusal of forgiveness for unbelievers, warns
    stay-behinds from Tabc that hell is hotter than the worldly heat they cite, excludes
    them from future fighting with the apostle, forbids funeral prayer over them,
    and describes riches, children, and sealed hearts as signs or instruments of judgment.
  language: English
  quote_policy: summarized
