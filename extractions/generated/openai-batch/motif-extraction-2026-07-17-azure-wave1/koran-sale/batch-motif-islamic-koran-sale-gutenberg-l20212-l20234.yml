canonical_text:
  quote: Good news! this is a youth.
  summary: A group carries Joseph away and sets him at the bottom of a well, after
    which God sends him a revelation. The group returns to Jacob with a false report
    that a wolf devoured Joseph and presents a garment stained with false blood. Travellers
    later find Joseph while drawing water, conceal him, and sell him cheaply. An Egyptian
    buyer tells his wife to treat Joseph honorably and considers adopting him; God
    establishes Joseph and teaches him the interpretation of dark sayings.
  language: English
