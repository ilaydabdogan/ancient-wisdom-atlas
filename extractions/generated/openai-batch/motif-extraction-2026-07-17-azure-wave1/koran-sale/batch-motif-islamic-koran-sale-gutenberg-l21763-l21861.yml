canonical_text:
  quote: ''
  summary: The opening of Chapter XVI announces that God’s decree will come, describes
    angels descending with revelation to chosen servants, asserts divine creation
    and provision through animals, rain, crops, celestial bodies, the sea, mountains,
    rivers, paths, and stars, contrasts God with created and lifeless idols, and warns
    that unbelievers and misleaders will bear burdens on the day of resurrection.
    An embedded note recounts punitive deaths or afflictions of named Koreish opponents
    after Gabriel’s intervention, and another note identifies a man who challenged
    resurrection with a rotten bone.
  language: English
  quote_policy: summarized
