  quote: ''
  summary: 'The passage warns that cities rejecting apostles and neglecting covenant
    are subject to divine punishment. It then recounts Moses being sent with signs
    to Pharaoh: his rod becomes a visible serpent, his hand appears white, Pharaoh''s
    chiefs accuse him of magic, magicians are summoned, their enchantment is overcome
    when Moses'' rod swallows their false serpent-rods, and the magicians prostrate
    and profess belief in the Lord of Moses and Aaron.'
