canonical_text:
  quote: ''
  summary: 'The passage includes a note explaining the story of a heifer: an orphan
    inherits a cow-calf, an angel tests or guides him in the marketplace, the Israelites
    later buy the heifer at a high price after a murder case, and a dead man is revived
    by contact with part of the sacrificed animal so that he names his killer. The
    passage then warns against corrupting the book of the law, false claims about
    limited punishment in hell, and partial obedience to covenant obligations. It
    contrasts companions of hell with companions of paradise, recalls covenants with
    the children of Israel, rebukes killing and dispossession, and mentions Moses,
    later apostles, Jesus son of Mary, and the holy spirit.'
  language: English
  quote_policy: summarized
