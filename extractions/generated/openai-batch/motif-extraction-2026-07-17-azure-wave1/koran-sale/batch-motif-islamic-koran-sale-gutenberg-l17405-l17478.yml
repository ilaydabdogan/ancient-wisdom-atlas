  quote: ''
  summary: The passage combines notes on a Meccan council against Mohammed, including
    the devil appearing as an old man of Najd, with Quranic verses on God as patron,
    the distribution of spoils, the Battle of Bedr, divinely managed perceptions of
    enemy numbers, and exhortations to believers to stand firm, remember God, obey
    God and the apostle, and persevere.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The Meccans, after hearing of Mohammed's league with people of Medina, held
    a council about what to do with him; the devil is said to have attended in the
    likeness of an old man of Najd.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Within the council, Abu'lbakhtari proposed imprisoning Mohammed, Heshm Ebn
    Amru proposed banishing him, and Abu Jahl proposed killing him; the devil rejected
    the first two proposals, and the killing proposal was approved.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The conspiracy was revealed to Mohammed, who was miraculously assisted to
    deceive the conspirators and escape; the same note connects this to the later
    battle of Bedr.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The notes describe exclusion from Mecca and the temple, mention Koreish guardianship
    of the Caaba, and describe people going around the Caaba naked while whistling
    and clapping or making noise to disturb Mohammed at prayer.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:5
  text: The notes describe material support for Meccan military expeditions, including
    camels killed for provisions, caravan goods used for support, and hired Arab auxiliaries.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: God is described as patron and helper.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:7
  text: A fifth part of any spoils is said to belong to God, the apostle, the apostle's
    kindred, orphans, the poor, and the traveller; this is tied to belief and the
    day when two armies met.
  category: object
  evidence_refs:
  - ev:6
- id: obs:8
  text: The believers and their enemies are described as positioned on opposite sides
    of a valley with the caravan below, and the battle is said to have occurred without
    prior appointment so that God might accomplish what was decreed.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:9
  text: The passage says that perishing and living would occur after demonstrative
    evidence, and that God hears and knows.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: The Lord caused the enemy to appear few in number to Mohammed in sleep; the
    passage says that if the enemy had appeared numerous, the believers would have
    been disheartened and disputed.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: When the armies met, God caused the enemy to appear few to the believers and
    diminished the believers' numbers in the enemies' eyes, in order to accomplish
    the decreed matter.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: True believers are instructed to stand firm when meeting a party of infidels,
    remember God frequently, obey God and the apostle, avoid refractory behavior,
    and persevere with patience.
  category: speech
  evidence_refs:
  - ev:10
