  quote: ''
  summary: The passage teaches that death occurs only by God's permission and according
    to what is written in a determining book. It contrasts reward in the present world
    with reward in the world to come, recalls prophets and troops who persevered and
    prayed for forgiveness and help, warns believers against obeying infidels, and
    describes God as helper, judge, and sender of dread into unbelievers. It then
    interprets a battle reversal, flight, pardon, and affliction as a divine trial
    connected with disobedience, desire for spoils, and the apostle's call to return.
  language: English
