    promises a better life to come and a pleasing reward, recalls divine care when
    he was an orphan, guidance when he was wandering in error, and enrichment when
    he was needy, and concludes with commands not to oppress the orphan, not to repulse
    the beggar, and to declare the Lord's goodness.
