canonical_text:
  quote: "“cause a table to descend unto us from heaven”"
  summary: Followers ask to eat from the heavenly table so their hearts may rest,
    they may know Jesus has spoken truth, and they may be witnesses. Jesus prays for
    a table to descend from heaven as a festival, sign, and provision. God promises
    it but warns of severe punishment for later disbelief. The passage then presents
    a last-day questioning of Jesus about whether he taught people to take him and
    his mother as gods beside God; Jesus denies this and says he taught only worship
    of God. Truthful speakers receive gardens with flowing rivers. Translator/commentarial
    notes elaborate the table miracle, its foods, repeated descent, healing effects,
    possible parable interpretation, punitive transformation into swine, and a comparison
    with Christian Sunday observance and the Last Supper/Eucharist.
  language: English
  quote_policy: quoted
