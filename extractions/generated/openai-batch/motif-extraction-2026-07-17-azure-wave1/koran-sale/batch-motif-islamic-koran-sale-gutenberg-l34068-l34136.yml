canonical_text:
  quote: Verily the true believers are brethren; wherefore reconcile your brethren.
  summary: The passage instructs believers to defer to God and the apostle, lower
    their voices before the prophet, wait respectfully outside the inner apartments,
    verify reports before acting, reconcile contending believers with justice, avoid
    mockery, defamation, suspicion, and backbiting, recognize humanity as created
    from male and female and distributed into nations and tribes, and distinguish
    outward profession from faith entering the heart.
  language: English
  quote_policy: quoted
