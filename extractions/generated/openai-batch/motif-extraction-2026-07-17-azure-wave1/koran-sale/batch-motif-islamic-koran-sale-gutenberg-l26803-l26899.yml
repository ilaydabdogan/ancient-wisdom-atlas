  quote: ''
  summary: 'The opening of Chapter XXV states that God revealed the Forkan to his
    servant as a preacher to all creatures, asserts God’s sole sovereignty and creative
    power, rejects other worshipped beings as powerless, answers accusations that
    the Koran is forged or ancient fables, and depicts judgment: burning fire for
    rejecters, an eternal garden for the pious, an assembly of worshippers and worshipped
    beings, descent of angels, heaven split by clouds, and the unjust person’s regret.'
  language: English
  quote_policy: summarized
