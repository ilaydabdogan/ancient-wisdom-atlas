  quote: THE Greeks have been overcome by the Persians
  summary: 'The passage opens Chapter XXX, titled “The Greeks,” with the initial letters
    A. L. M. and states that the Greeks have been overcome by the Persians. Sale’s
    note explains this as a famous prophecy: after a Persian victory, opponents of
    Mohammed took encouragement from the Persians’ success, but the text was understood
    to foretell that the defeated Greeks would prevail within a few years. The note
    then gives exegetical and historical accounts of the prophecy’s alleged fulfillment,
    including a wager by Abu Becr with Obba Ebn Khalf and later Greek victories over
    Persia.'
