canonical_text:
  quote: Which, therefore, of your LORD'S benefits will ye ungratefully deny?
  summary: The passage presents the Merciful God as teacher of the Koran and speech,
    creator of man and genii, disposer of cosmic order, earth, seas, and living provision.
    It repeatedly addresses men and genii with a refrain about denying divine benefits.
    It then turns to judgment at the last day, punishment of the wicked in hell and
    boiling water, and reward for those who dread God's tribunal in two gardens with
    trees, fountains, fruits, couches, and companions.
