canonical_text:
  quote: ''
  summary: The passage opens Chapter XXVII by describing the Koran as signs, guidance,
    and good tidings for believers, while warning unbelievers in the life to come
    of punishment and loss. It recalls Moses perceiving fire, hearing a divine voice,
    casting down a rod that moves like a serpent, and receiving a white-hand sign
    for Pharaoh and his people, who reject the signs as sorcery. It then says David
    and Solomon received knowledge; Solomon inherits David, knows the speech of birds,
    commands armies of genii, men, and birds, understands an ant warning its community,
    prays in gratitude, notices the absence of the lapwing, and receives from it news
    of a woman ruling Saba with a magnificent throne.
  language: English
  quote_policy: summarized
