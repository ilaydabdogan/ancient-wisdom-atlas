canonical_text:
  quote: ''
  summary: 'The passage recounts episodes from the sixth and seventh years of the
    Hejra: Mohammed travels toward Mecca with followers, is blocked by the Koreish,
    receives an oath of fealty, and concludes a ten-year truce. An ambassador reports
    the intense veneration of Mohammed by his companions. Mohammed then sends letters
    to foreign rulers inviting them to his religion; the Persian king Khosr rejects
    and tears the letter, after which Mohammed predicts divine destruction of his
    kingdom and reports a revelation of Khosr''s death. Badhn of Yaman converts after
    receiving confirmation. Heraclius is said to receive the letter respectfully,
    and the Ethiopian king is also mentioned as a recipient.'
  language: English
  quote_policy: summarized
