canonical_text:
  quote: ''
  summary: The passage states that the timing of the final day is known only to God,
    though signs of its approach are listed as lesser and greater. Lesser signs include
    decay of faith, social reversals, unrest, war, distress, tribute refusal, and
    expansion of Medina. Greater signs include the sun rising in the west, an earth-rising
    composite beast that marks believers and unbelievers, war with the Greeks and
    a miraculous capture of Constantinople, and the coming of Antichrist/al Dajjl.
  language: English
