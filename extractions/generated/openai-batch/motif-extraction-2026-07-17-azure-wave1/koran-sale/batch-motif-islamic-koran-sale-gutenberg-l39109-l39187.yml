canonical_text:
  quote: GOD himself undertook the protection of both.
  summary: The passage contains Sale's notes around the chapter entitled The Elephant.
    It describes a name or apartment of hell, then recounts Abraha's attempted attack
    on Mecca and the Caaba after a rival church at Sanaa was defiled. The account
    says Abraha's elephant refused to advance, birds carrying stones killed his men,
    a flood swept away bodies and survivors, and Abraha died of bodily corruption.
    The passage also reports later discussion comparing or debating this episode with
    the defeat of Brennus at Delphi and Cambyses's punishment after wounding the Apis
    bull.
  language: English
  quote_policy: quoted
