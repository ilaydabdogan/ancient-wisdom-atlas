candidate_motifs:
- id: motif:1
  label: Divine protection of a threatened sanctuary
  taxonomy_refs:
  - divine_judgment
  basis: The passage says God protected Mecca and the temple when Abraha approached
    and the invading host was destroyed through the elephant's refusal, birds' stones,
    flood, and later deaths.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: This is extracted from Sale's note and reported tradition around the chapter,
    not only from the Qur'anic verses themselves.
- id: motif:2
  label: Animal refuses to cross toward a sacred target
  taxonomy_refs: []
  basis: Mahmd the elephant repeatedly refuses to advance toward Mecca while moving
    in other directions.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The sacred-boundary function is inferred from narrative placement; the
    passage literally reports the elephant's refusal.
- id: motif:3
  label: Birds as agents of punishment carrying stones
  taxonomy_refs:
  - divine_judgment
  basis: Birds arrive carrying stones and kill Abraha's men by dropping them on their
    heads.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage presents this as part of the tradition explaining the chapter;
    no broader bird taxonomy is supplied.
- id: motif:4
  label: Punitive flood after hostile attack
  taxonomy_refs:
  - divine_judgment
  basis: After the stone attack, God sends a flood that sweeps bodies and some survivors
    into the sea.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: Although a flood appears, the passage does not describe renewal, so the
    flood_and_renewal taxonomy is not assigned.
- id: motif:5
  label: No escape from divine missile or delayed punishment
  taxonomy_refs:
  - divine_judgment
  basis: Abu Yacsm escapes the battlefield but a bird follows him to Ethiopia and
    kills him with a stone after he reports the destruction.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: This episode is introduced with 'It is said,' marking it as a reported
    variant or tradition.
- id: motif:6
  label: Punishment for profanation or violence against worship
  taxonomy_refs:
  - divine_judgment
  basis: The narrative centers on defilement of a church, a vow to destroy the Caaba,
    and the destruction of the attacking army; the passage's later comparisons also
    discuss divine punishment of sacrilege and profanation.
  evidence_refs:
  - ev:3
  - ev:5
  - ev:8
  - ev:12
  - ev:13
  confidence: medium
  cautions: The profanation of the Sanaa church and the intended attack on the Caaba
    involve different parties; the motif is strongest in the passage's commentary
    on sacrilege.
- id: motif:7
  label: Destructive and unextinguished hell
  taxonomy_refs:
  - divine_judgment
  basis: A brief note describes an infernal place that breaks what enters it and is
    not extinguished.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: This note appears as a short adjacent fragment and is not part of the
    main Elephant narrative.
comparison_claims:
- id: claim:1
  claim: The passage reports that Marracci treated Brennus's strange defeat while
    attacking Apollo's temple at Delphi as a parallel instance to the Abraha story.
  claim_level: same_function
  target: Brennus's defeat at the temple of Apollo at Delphi
  evidence_refs:
  - ev:11
  counter_evidence_refs:
  - ev:11
  confidence: medium
  limitations: The comparison is attributed to Marracci, and the same report says
    he judged the Abraha story to be either fable or the work of evil spirits; this
    does not establish historical contact or common inheritance.
- id: claim:2
  claim: The passage juxtaposes the Abraha narrative with Prideaux's favorable framing
    of Brennus's overthrow as divine vengeance on sacrilegious attackers of a temple.
  claim_level: same_function
  target: Prideaux's account of divine vengeance against Brennus and his army at Delphi
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The claim is a later commentator's analogy about divine punishment
    for sacrilege, not a claim made by the Qur'anic text.
- id: claim:3
  claim: The passage presents Cambyses's death after wounding the Apis bull as another
    example used to discuss heavenly punishment for profaning a mode of worship.
  claim_level: same_function
  target: Cambyses, the Apis bull, and punishment for profanation of Egyptian worship
  evidence_refs:
  - ev:13
  counter_evidence_refs: []
  confidence: medium
  limitations: The analogy concerns a general function of punishment for profanation;
    it does not imply shared narrative origin with the Abraha account.
