canonical_text:
  quote: ''
  summary: The passage opens Chapter XLVIII, “The Victory.” God is said to grant the
    apostle a manifest victory, forgiveness, completion of favor, right guidance,
    and glorious assistance. God sends tranquility into believers’ hearts, promises
    gardens with rivers to faithful men and women, and threatens hypocrites, idolaters,
    and unbelievers with anger, curse, hell, and burning fire. The apostle is sent
    as witness, bearer of good tidings, and denouncer of threats. Those who swear
    fealty to him are described as swearing fealty to God, with God’s hand over their
    hands. Desert Arabs who stayed behind offer excuses and seek pardon, but the passage
    says their speech does not match their hearts and excludes them from following
    for spoil.
  language: English
  quote_policy: summarized
