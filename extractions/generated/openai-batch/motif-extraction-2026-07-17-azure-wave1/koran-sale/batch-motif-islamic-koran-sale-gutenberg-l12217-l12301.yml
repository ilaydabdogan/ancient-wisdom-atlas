- id: obs:3
  text: Orphans are to receive their substance when they come of age; the addressees
    are forbidden to exchange bad property for good or to add the orphans' substance
    to their own.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If equity toward female orphans is feared, the addressees are directed toward
