canonical_text:
  quote: ''
  summary: Chapter IV opens by addressing men to fear the Lord who created humanity
    from one man and his wife, and to respect women or wombs. It then gives commands
    about orphans' property, equitable marriage and dowry, care for those weak of
    understanding, witnesses when property is delivered, inheritance shares for men,
    women, children, and parents, and a warning that unjust consumers of orphans'
    possessions will swallow fire and burn in flames.
  language: English
  quote_policy: summarized
