canonical_text:
  quote: ''
  summary: Chapter 52 opens with oaths by Sinai, a written book, the visited house,
    heaven, and ocean, then announces unavoidable divine punishment. It describes
    an eschatological day when heaven and mountains are disturbed, deniers are thrust
    into hellfire, and the pious receive gardens, food, drink, companions, offspring,
    and divine deliverance. The prophet is told to admonish, answer accusations, challenge
    opponents to produce a comparable discourse, and wait patiently while praising
    the Lord.
  language: English
  quote_policy: summarized
