  summary: The passage recounts traditions about Ahmed Ebn Hanbal's birth, learning,
    punishment over the createdness of the Koran, death, funeral attendance, and reported
    conversions. It then describes Hanbalite unrest, defines heretical sects, narrates
    the rise of doctrinal controversies, gives a comparative count of sect divisions
    among religions, and identifies the Kharejites as an early heresy that revolted
    from Ali.
