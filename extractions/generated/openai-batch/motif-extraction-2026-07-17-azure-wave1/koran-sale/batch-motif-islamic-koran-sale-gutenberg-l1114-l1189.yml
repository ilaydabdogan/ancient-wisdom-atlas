  summary: 'The passage first corrects claims about Muhammad''s tomb, then summarizes
    traditions concerning the tribes of Ad and Thamud: Ad''s genealogy, Shedd''s city
    and garden of Irem, Colabah''s reported encounter with the hidden city, Hud''s
    mission to the idolatrous Adites, their destruction by a divinely sent wind after
    drought, surviving groups, reports of giant stature, and the beginning of the
    Thamud/Saleh account.'
