candidate_motifs:
- id: motif:1
  label: Kingship lost and restored through a signet
  taxonomy_refs:
  - royal_legitimacy
  basis: Solomon's kingdom depends on a signet; when Sakhar obtains it he possesses
    the kingdom, and Solomon recovers rule after the ring is found in a fish.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage presents this in a translator's note as an expository fable
    rather than as the main Qur'anic verse text.
- id: motif:2
  label: Shapeshifting impostor usurps authority
  taxonomy_refs:
  - shapeshifter
  basis: Sakhar comes in Solomon's shape, sits on the throne in a borrowed form, and
    alters the law.
  evidence_refs:
