  quote: ask it of them from behind a curtain
  summary: The passage contains commentary on marital dismissal, dower, slaves, and
    women associated with the prophet, followed by verses regulating the prophet's
    wives and household. The prophet may arrange or restore turns among his wives,
    but is then restricted from taking or exchanging further wives except slaves.
    Believers are instructed to enter the prophet's houses only by permission, leave
    after eating, ask his wives from behind a curtain, avoid troubling the apostle,
    and never marry his wives after him. God is described as knowing hearts, observing
    all things, and knowing what is concealed or divulged.
