canonical_text:
  quote: The division of the spoils belongeth unto GOD and the apostle.
  summary: The passage opens Sura VIII, “The Spoils,” and states that disputed spoils
    belong for division to God and the apostle. Believers are urged to fear God, reconcile,
    obey, pray, give alms, and trust in the Lord. The text recalls believers’ reluctance
    and dispute when brought forth from home, God’s promise concerning one of two
    parties, and God’s purpose to establish truth and destroy falsehood. Editorial
    notes connect the chapter with disputes over booty after the battle of Bedr and
    a reported request by Saad Ebn Abi Wakks for a captured sword.
  language: English
  quote_policy: summarized
