  summary: The passage describes nations receiving apostles, rejecting them, and being
    destroyed at their appointed time; Moses and Aaron are sent to Pharaoh and rejected;
    Moses receives the book of the law; the son of Mary and his mother are made a
    sign and placed in an elevated, secure, watered abode; apostles are commanded
    to eat good things and act righteously; religion is declared one though people
    split into sects; righteous believers fear their Lord, give alms, and anticipate
    return to him; a truthful book is with God, while negligent and affluent people
    continue in wrongdoing until punishment makes them cry for help.
