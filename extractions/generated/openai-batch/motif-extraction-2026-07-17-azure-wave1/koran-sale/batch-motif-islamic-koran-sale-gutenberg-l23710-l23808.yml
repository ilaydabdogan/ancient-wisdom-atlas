canonical_text:
  quote: ''
  summary: The passage and notes identify Dhu'lkarnein, the “two-horned,” with several
    possible rulers, often Alexander. In the narrative, Dhu'lkarnein journeys to the
    place of the sunset, where he finds a black muddy spring and a people subject
    to his judgment; then to the place of sunrise, where he finds people without shelter
    from the sun; then northward between two mountains, where a people ask him to
    build a barrier against Gog and Magog. He refuses tribute, asks for labor, and
    orders iron and molten brass to form a strong wall.
