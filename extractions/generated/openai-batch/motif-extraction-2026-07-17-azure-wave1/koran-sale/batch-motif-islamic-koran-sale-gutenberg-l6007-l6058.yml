canonical_text:
  quote: ''
  summary: The passage discusses prohibitions related to wine, gaming, and images.
    It describes al Meisar as a pagan Arab practice of casting lots with marked and
    blank arrows over a killed and divided camel, whose flesh was distributed to the
    poor. The passage states that the practice was forbidden because it produced quarrels
    and resentment. It then reports that commentators extend the ban to games of chance,
    while chess is conditionally allowed because it depends on skill, though carved
    chess pieces are connected by some commentators with prohibited images.
  language: English
