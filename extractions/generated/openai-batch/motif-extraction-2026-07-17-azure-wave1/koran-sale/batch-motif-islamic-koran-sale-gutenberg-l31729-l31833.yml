  summary: The passage opens Chapter XXXIX, presenting the book as a truthful revelation
    from God and urging pure worship of God alone. It rejects patrons or divine offspring,
    describes God as creator and ruler of the heavens, earth, celestial cycles, human
    origin, cattle, and embryonic formation. It warns that each soul bears its own
    burden and will return to God for judgment. It contrasts ungrateful idolatry with
    prayer, patience, knowledge, and obedience. It depicts hell as fire above and
    below, paradise as high apartments with rivers beneath, and water from heaven
    producing vegetation that later withers and crumbles as instruction.
