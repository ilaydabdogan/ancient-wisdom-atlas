  summary: The passage praises God as creator of heaven and earth, describes angels
    as winged messengers, warns against deception by Satan and unbelief, contrasts
    punishment with reward, compares the revival of dead earth by wind and cloud to
    resurrection, describes human creation and decreed lifespans, contrasts fresh
    and salt seas, names the ordered alternation of night and day and courses of sun
