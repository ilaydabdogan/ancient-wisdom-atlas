  quote: PRAISE be to GOD, the LORD of all creatures;
  summary: The passage presents Chapter I as a Meccan prayer beginning in God’s name.
    The prayer praises God as merciful lord and king of the day of judgment, declares
    worship and dependence on God, and asks to be directed in the right way rather
    than the way of those under anger or astray. Sale’s notes explain the chapter’s
    devotional use, the phrase translated as lord of all creatures/worlds, and common
    and alternate interpretations of the final petition.
