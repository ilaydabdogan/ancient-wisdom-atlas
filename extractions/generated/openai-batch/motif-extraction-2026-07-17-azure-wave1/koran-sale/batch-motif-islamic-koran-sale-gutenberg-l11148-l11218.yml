    The note lists variant substitutes, later return-and-comfort episodes, parallels
    in early Christian sectarian and apocryphal traditions, and a Barnabas account
    involving angelic ascent, Judas's resemblance to Jesus, grief as divine punishment,
    and Mohammed as a future corrector of the mistaken belief.
