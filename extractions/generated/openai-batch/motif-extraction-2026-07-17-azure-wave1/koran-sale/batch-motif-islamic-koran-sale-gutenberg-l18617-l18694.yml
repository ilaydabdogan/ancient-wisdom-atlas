  summary: The passage contrasts people awaiting God's decree, a harmful temple built
    to divide believers, and a temple founded on piety where men seek purification.
    It compares a foundation built on fear of God with a foundation on an eroding
    bank that collapses into hellfire. It then states that God has purchased believers'
    souls and substance in exchange for paradise, on condition that they fight for
    God's cause. Sale's notes identify historical persons and mosques, including the
    mosque of Koba and a rival mosque said to have been demolished and burned.
