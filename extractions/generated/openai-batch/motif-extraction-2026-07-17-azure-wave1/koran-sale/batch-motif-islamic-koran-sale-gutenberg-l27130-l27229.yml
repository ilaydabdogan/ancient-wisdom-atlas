candidate_motifs:
- id: motif:1
  label: Reluctant messenger commissioned with divine aid
  taxonomy_refs: []
  basis: Moses is called to Pharaoh, voices fears of accusation, speech difficulty,
    and death, asks for Aaron, and receives divine assurance and signs.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage gives the commission and reluctance but does not narrate the
    earlier origin of Moses' prophetic status beyond this exchange.
- id: motif:2
  label: Liberation demand before an oppressive ruler
  taxonomy_refs: []
  basis: Moses and Aaron are sent to Pharaoh to demand the release of the children
    of Israel, whom Moses says Pharaoh has enslaved.
  evidence_refs:
  - ev:4
  - ev:6
  confidence: high
  cautions: No liberation or escape is completed within this passage.
- id: motif:3
  label: Serpent sign overcoming false serpents
  taxonomy_refs:
  - serpent
  basis: Moses' rod becomes a visible serpent and later swallows what the magicians
    falsely made appear changed into serpents.
  evidence_refs:
  - ev:8
  - ev:11
  confidence: high
  cautions: The passage distinguishes Moses' sign from the magicians' false appearances;
    it does not elaborate a broader serpent mythology.
- id: motif:4
  label: Contest between divine sign and court magicians
  taxonomy_refs: []
  basis: Pharaoh gathers skilful magicians to oppose Moses; they cast ropes and rods,
    but Moses' rod overcomes their display.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage calls the magicians' effects false appearances but does not
    describe their techniques beyond ropes and rods.
- id: motif:5
  label: Wisdom bestowed with apostolic appointment
  taxonomy_refs:
  - wisdom
  basis: Moses says the Lord bestowed wisdom on him and appointed him one of his apostles.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: Only a brief statement of bestowed wisdom appears; the passage does not
    define the content of that wisdom.
- id: motif:6
  label: Conversion of rival specialists after witnessing a sign
  taxonomy_refs: []
  basis: After Moses' rod swallows the magicians' false appearances, the magicians
    prostrate and profess belief in the Lord of Moses and Aaron.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The subsequent outcome of the magicians is not narrated in the supplied
    range.
- id: motif:7
  label: Natural fertility presented as a divine sign
  taxonomy_refs: []
  basis: The passage asks the audience to behold the earth and the many noble species
    of vegetables caused to spring up in it, calling this a sign.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage mentions vegetation generally, not a specific sacred tree
