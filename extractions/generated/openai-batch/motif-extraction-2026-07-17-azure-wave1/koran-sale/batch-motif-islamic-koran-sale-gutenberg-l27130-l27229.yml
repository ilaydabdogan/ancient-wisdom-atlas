canonical_text:
  quote: And he cast down his rod, and behold, it became a visible serpent
  summary: The passage opens Chapter XXVI, describes signs and admonition rejected
    by unbelievers, and recounts Moses being called by God to go with Aaron to Pharaoh.
    Moses fears accusation, speech difficulty, and death, but is assured divine support.
    Moses and Aaron demand the release of the children of Israel. Pharaoh recalls
    Moses' upbringing and past deed, questions the identity of the Lord, threatens
    imprisonment, and calls Moses' signs magic. Moses' rod becomes a serpent and his
    hand appears white. Pharaoh's court gathers magicians; their ropes and rods are
    overcome when Moses' rod swallows their false appearances, after which the magicians
    prostrate and profess belief in the Lord of Moses and Aaron. Pharaoh rebukes them
    for believing without his permission.
  language: English
  quote_policy: quoted
