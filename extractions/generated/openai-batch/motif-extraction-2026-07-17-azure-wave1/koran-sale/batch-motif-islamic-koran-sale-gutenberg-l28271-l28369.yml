canonical_text:
  quote: ''
  summary: The passage recounts Moses bringing signs that are rejected as sorcery;
    Pharaoh ordering Haman to build a brick tower so he may ascend to the God of Moses;
    Pharaoh and his forces being judged, cast into the sea, cursed, and associated
    with hell fire. It then describes the book of law given to Moses, the Prophet
    addressed as a divinely instructed warner, objections to revelation and demands
    for Moses-like miracles, believers from earlier scripture affirming the recitation,
    Meccan fear of expulsion answered by the image of a secure asylum, destroyed cities
    after apostolic warning, and the contrast between present-life provisions and
    resurrection judgment.
  language: English
  quote_policy: summarized
