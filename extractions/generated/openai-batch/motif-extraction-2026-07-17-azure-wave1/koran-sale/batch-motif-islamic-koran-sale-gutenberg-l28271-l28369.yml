candidate_motifs:
- id: motif:1
  label: Hostile tower-ascent toward heaven
  taxonomy_refs:
  - ascent
  basis: Pharaoh orders a high tower so he may ascend to the God of Moses; the note
    expands this into Pharaoh ascending the tower before its demolition.
  evidence_refs:
  - ev:2
  - ev:6
  confidence: high
  cautions: The ascent is portrayed as hostile and impious, not as a salvific or initiatory
    ascent; the expanded demolition episode is from Sale's cited note rather than
    the translated verse text alone.
- id: motif:2
  label: Divine judgment on unjust ruler and forces
  taxonomy_refs:
  - divine_judgment
  basis: Pharaoh and his forces are described as unjust, cast into the sea, cursed,
    linked to hell fire, and rejected on the day of resurrection.
  evidence_refs:
