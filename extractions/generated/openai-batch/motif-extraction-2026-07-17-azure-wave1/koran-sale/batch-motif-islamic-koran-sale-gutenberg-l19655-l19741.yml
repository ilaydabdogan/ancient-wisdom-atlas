canonical_text:
  quote: O earth, swallow up thy waters, and thou, O heaven, withhold thy rain.
  summary: 'The passage recounts the end of the flood: the waters are withdrawn, the
    ark rests on Al Judi, and the ungodly are dismissed. Noah asks about his son,
    but God rejects the plea, saying the son is not of Noah''s family in the relevant
    sense; Noah seeks forgiveness. Noah is then told to descend from the ark with
    peace and blessings for some, while others will later receive punishment. The
    account is described as a revealed secret history. The passage then begins the
    account of Hud, sent to the tribe of Ad to call them away from idols and intercessors.
    Sale''s notes add geographic and comparative traditions about Al Judi/Gordyan
    mountains and ark relics.'
  language: English
  quote_policy: quoted
