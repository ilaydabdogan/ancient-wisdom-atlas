canonical_text:
  quote: ''
  summary: In a post-battle setting, the passage says God sent security as soft sleep
    to some believers while others were troubled and doubtful. It frames deaths as
    decreed by God and as a test of what is hidden in hearts, mentions Satan causing
    some to slip at Ohod but God forgiving them, warns believers not to speak as unbelievers
    do about deaths in travel or war, promises mercy and gathering to God for those
    who die or are slain in defense of God's religion, instructs Mohammed to forgive,
    consult, and trust God, and warns that defrauders will bring what they defrauded
    on the day of resurrection when every soul is repaid.
  language: English
