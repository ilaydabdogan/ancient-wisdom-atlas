  quote: I will cause thee to die, and I will take thee up unto me
  summary: God addresses Jesus, promises death or taking up, deliverance from unbelievers,
    superiority for followers until resurrection, and final judgment. The passage
    contrasts punishment for infidels with reward for believers, likens Jesus to Adam’s
