canonical_text:
  quote: ''
  summary: 'The passage summarizes several pre- and post-Islamic Arab polities and
    tribes: Ghassan, Hira, Jorham, Quraysh/Koreish, Khozah, Kenda, and the Khalifs.
    It describes foundations, displacements, dynastic succession, client relationships
    to Persia and Rome, custody of the Caaba, and one tradition in which the Jorhamites
    are destroyed by an inundation.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The kingdom of Ghassan is said to have been founded by people of the tribe
    of Azd who settled in Syria Damascena near a water called Ghassan and took their
    name from it.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: The founders of Ghassan are said to have driven out the Dajaamian Arabs of
    the tribe of Salh, who previously possessed the country.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Ghassan is described as lasting hundreds of years, with five princes named
    Hareth/Aretas, and as a Christian tribe whose last king Jabalah changed religious
    allegiance and retired to Constantinople.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: The kingdom of Hira is said to have been founded by Malec in Chaldea or Irak,
    and after three descents its throne came by marriage to the Lakhmians, also called
    the Mondars.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Hira is said to have ended when al Mondar al Maghrr lost his life and crown
    by the arms of Khaled Ebn al Wald during the Khalifat of Abubecr.
  category: action
  evidence_refs:
  - ev:2
- id: obs:6
  text: The princes of Hira are described as protected by the kings of Persia and
    acting as their lieutenants over the Arabs of Irak; this is explicitly compared
    with the kings of Ghassan serving the Roman emperors over Arabs of Syria.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:7
  text: Jorham son of Kahtan is said to have reigned in Hejaz, where his descendants
    kept the throne until the time of Ismael.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:8
  text: One account says Kidar, a son of Ismael, received the crown when his Jorhamite
    uncles resigned it to him; another says Ismael's descendants expelled the Jorhamites.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:9
  text: In the alternative account, the Jorhamites retired to Johainah and were eventually
    destroyed by an inundation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: After the expulsion of the Jorhamites, Hejaz is described as being divided
    among heads of tribes rather than ruled for many centuries by one prince.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:11
  text: At Mecca, an aristocracy is said to have prevailed, with chief management
    in the tribe of Koreish, especially after that tribe obtained custody of the Caaba
    from Khozah.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:12
  text: The passage mentions additional lesser tribal states, especially Kenda, and
