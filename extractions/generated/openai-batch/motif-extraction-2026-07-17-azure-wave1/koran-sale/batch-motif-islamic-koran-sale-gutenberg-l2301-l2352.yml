  quote: ''
  summary: The passage describes Arabia as a setting for various Christian heresies
    and sects, including beliefs about bodily resurrection and claims that some groups
    worshipped or deified the Virgin Mary. It states that Mohammed used such Marian
    deification to attack the Trinity, incorporated notions from sects that had taken
    refuge in Arabia, initially adopted Jewish doctrines and customs to gain Jewish
    support, later came into severe conflict with Jewish communities, and benefited
    from the weakened Roman and Persian empires.
