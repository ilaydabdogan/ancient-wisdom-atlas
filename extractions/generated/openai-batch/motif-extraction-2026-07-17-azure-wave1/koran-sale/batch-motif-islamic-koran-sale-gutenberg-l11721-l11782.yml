canonical_text:
  quote: ''
  summary: The passage exhorts believers to give alms, restrain anger, forgive, repent,
    and seek divine pardon, promising pardon and gardens with rivers. It recalls punishments
    of those who rejected apostles, presents the book as guidance, interprets battle
    wounds and alternating victories as divine testing, links perseverance and fighting
    in God's cause with entrance to paradise, and states that Muhammad is an apostle
    like earlier deceased apostles, so his death should not cause believers to turn
    back. Sale's notes add exempla involving Hasan forgiving a slave, the battles
    of Ohod and Bedr, and Ans Ebn al Nadar fighting after a report that Muhammad had
    been slain.
  language: English
  quote_policy: summarized
