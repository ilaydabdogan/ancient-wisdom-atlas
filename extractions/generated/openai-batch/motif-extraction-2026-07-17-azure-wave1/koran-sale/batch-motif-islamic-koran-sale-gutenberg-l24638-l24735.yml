canonical_text:
  quote: ''
  summary: Moses returns angrily to his people after his absence and confronts them
    about breaking their promise. They explain that ornaments of gold and silver were
    cast into a fire and that al Smeri produced a lowing calf which some called their
    god and Moses' god. Aaron says he warned them and feared causing division. Al
    Smeri says he cast dust from the messenger of God's footsteps into the molten
    calf. Moses announces al Smeri's punishment, orders the calf burned, pulverized,
    and scattered in the sea, then the passage turns to divine knowledge, guilt on
    the day of resurrection, the sounding of the trumpet, the leveling of mountains,
    and mankind following the angelic caller to judgment.
  language: English
  quote_policy: summarized
