canonical_text:
  quote: GOD hath not given a man two hearts within him
  summary: The opening of Chapter XXXIII, titled "The Confederates" and revealed at
    Medina, addresses the Prophet with commands to fear God, refuse obedience to unbelievers
    and hypocrites, follow revelation, and trust God. It rejects certain kinship fictions
    concerning wives treated as mothers and adopted sons treated as natural sons,
    directs that adopted sons be called by their natural fathers, distinguishes mistaken
    error from intentional wrong, and defines the Prophet, his wives, blood relatives,
    believers, and the Mohajerin within a divinely ordered kinship framework. The
    notes connect the chapter with the war of the ditch and explain old Arab customs
    concerning divorce formulas and adoption.
  language: English
  quote_policy: quoted
