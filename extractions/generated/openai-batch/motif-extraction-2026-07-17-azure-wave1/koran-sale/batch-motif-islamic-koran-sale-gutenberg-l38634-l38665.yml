canonical_text:
  quote: ''
  summary: The chapter swears by night, day, and the creator of male and female, then
    contrasts different human endeavors. The obedient and God-fearing are led toward
    happiness, while the covetous worldly denier is led toward misery and hellfire.
    Divine direction and both present and future life belong to God. The passage warns
    of fierce fire for the most wretched and promises removal from it and future satisfaction
    for the one who avoids idolatry and rebellion and gives alms for the sake of the
    Lord.
