- id: motif:5
  label: Punishment from above, below, and social violence
  taxonomy_refs:
  - divine_judgment
  basis: God is said to be able to send punishment from above, from underfoot, or
    through dissension and mutual violence; notes connect above and below punishments
    with flood, destruction, drowning, and earth-swallowing examples.
  evidence_refs:
  - ev:6
  - ev:19
  - ev:20
  confidence: high
  cautions: The translator’s notes provide examples; the main passage itself states
    the modes of punishment without narrating those examples.
- id: motif:6
  label: Rejection of false gods through celestial observation
  taxonomy_refs:
  - wisdom
  basis: Abraham questions images as gods, is shown the kingdom of heaven and earth,
