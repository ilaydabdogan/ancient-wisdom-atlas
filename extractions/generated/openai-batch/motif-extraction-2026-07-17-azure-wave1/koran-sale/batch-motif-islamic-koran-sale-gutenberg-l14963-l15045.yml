candidate_motifs:
- id: motif:1
  label: Divine judgment and accounting after death
  taxonomy_refs:
  - divine_judgment
  basis: The passage states that after death people return to God, that judgment belongs
    to him, that he is quick in taking account, and that condemned souls receive punishment.
  evidence_refs:
  - ev:4
  - ev:8
  - ev:9
  confidence: high
  cautions: The extraction names only the motif family supported by the passage; it
    does not infer details beyond the stated return, judgment, accounting, and punishment.
- id: motif:2
  label: Return and assembly before God
  taxonomy_refs:
  - return
  - resurrection
  basis: People are said to return to God after the appointed term, and the passage
    says God is the one before whom they will be assembled on the day of the trumpet.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:11
  - ev:13
  confidence: medium
  cautions: The passage explicitly mentions return, assembly, and trumpet, but this
    excerpt does not narrate a full resurrection sequence.
- id: motif:3
  label: Angelic guardians and agents of death
  taxonomy_refs:
  - afterlife_journey_map
  basis: Guardian angels watch over people until messengers cause death, followed
    by return to God for judgment.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:17
  confidence: medium
  cautions: The passage gives death and return elements but does not provide a detailed
    map of stages in the afterlife journey.
- id: motif:4
  label: Deliverance from danger after supplication
  taxonomy_refs:
  - sacred_exchange
  basis: Those in the darkness of land and sea call on God privately and promise thankfulness
    if delivered; God delivers them, but they afterward give him companions.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The promise of thankfulness is explicit, but the passage emphasizes failure
