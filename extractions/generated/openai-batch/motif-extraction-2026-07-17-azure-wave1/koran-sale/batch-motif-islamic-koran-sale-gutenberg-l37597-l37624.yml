canonical_text:
  quote: ''
  summary: 'Sale''s notes relate a story in which Hasan and Hosein fall sick; Ali,
    Ftema, and Fidda vow a three-day fast to God if the children recover, then give
    each day''s bread to a poor man, an orphan, and a captive, drinking only water.
    Gabriel descends with the chapter and announces God''s praise of Mohammed''s family.
    Additional notes gloss paradise imagery: no need of light or absence of heat and
    cold, ginger-flavored fountain water, and gently flowing water.'
  language: English
  quote_policy: summarized
