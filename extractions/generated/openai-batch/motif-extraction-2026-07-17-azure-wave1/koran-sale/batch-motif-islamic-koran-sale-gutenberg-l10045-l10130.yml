  label: sacred mountain as site of recognition, instruction, and prayer
  taxonomy_refs: []
  basis: Arafat and al Masher al haram are described as mountains tied to pilgrimage
    movement, Adam's reunion with his wife, Abraham's ritual recognition after Gabriel's
    instruction, and Mohammed's shining-faced prayer.
  evidence_refs:
  - ev:2
