  label: ritual compensation and sacred offering
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: The notes list fasting, feeding poor people, or sacrificing a sheep as compensatory
    acts; the verses also describe a man selling his soul for God's pleasure and almsgiving
