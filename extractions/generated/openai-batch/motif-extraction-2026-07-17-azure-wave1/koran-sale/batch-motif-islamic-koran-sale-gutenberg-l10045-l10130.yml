- id: motif:2
  label: prophetic revelation judging human dispute
  taxonomy_refs:
  - wisdom
  basis: Humanity is described as originally one faith, after which God sends prophets
    and scripture to judge disagreements and guide believers to truth.
  evidence_refs:
