canonical_text:
  quote: ''
  summary: The passage opens Chapter IX, titled the Declaration of Immunity, with
    a declaration from God and his apostle to idolaters with whom a league had been
    made. It grants four months of secure movement, warns that God cannot be weakened,
    announces divine and apostolic separation from idolaters on the day of the greater
    pilgrimage, urges repentance, and threatens painful punishment for unbelief. The
    notes explain the missing opening formula, interpretations of the declaration,
    the pilgrimage date, and Ali’s public promulgation of the chapter and four related
    commands.
  language: English
  quote_policy: summarized
