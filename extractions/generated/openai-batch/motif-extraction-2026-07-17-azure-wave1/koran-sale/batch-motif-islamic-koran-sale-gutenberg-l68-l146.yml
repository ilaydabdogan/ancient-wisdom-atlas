canonical_text:
  quote: ''
  summary: George Sale dedicates his English translation of the Koran to Lord Carteret.
    He argues that Mohammed, though rejected by Christians as claiming a divine mission
    and using imposture to establish a new religion, should be considered alongside
    other ancient lawgivers because he gave the Arabs laws and a religion centered
    on one God and opposition to idolatry. Sale contrasts Mohammed with Moses and
    Jesus, whose laws he says came from Heaven, and compares him more closely with
    Minos and Numa. He frames knowledge of laws and constitutions as useful learning
    and asks Carteret to receive the work favorably.
  language: English
