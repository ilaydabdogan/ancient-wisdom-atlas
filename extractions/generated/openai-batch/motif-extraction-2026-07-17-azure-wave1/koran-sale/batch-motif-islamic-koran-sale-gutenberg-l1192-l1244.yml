canonical_text:
  quote: ''
  summary: 'The passage recounts traditions concerning ancient Arabian tribes. It
    describes Saleh and the people of Thamud: a demanded miracle of a pregnant she-camel
    emerging from a rock, the killing of the camel, divine destruction by earthquake
    and heavenly noise, and the survival of Saleh and his followers. It then notes
    rock-cut habitations associated with Thamud, frames such destructions as Qur''anic
    examples of divine judgment, and summarizes traditions about Tasm, Jads, Jorham,
    Noah''s ark survivors, and Amalek.'
  language: English
  quote_policy: summarized
