canonical_text:
  quote: ''
  summary: The passage commands the prophetic speaker to warn deniers, disclaim control
    over divine treasures, secrets, angelic status, or hastened punishment, and follow
    revelation alone. It instructs him not to exclude humble believers who call on
    their Lord, announces divine mercy for repentance, rejects worship of false deities,
    and states that judgment belongs only to God. Translator notes connect the exclusion
    command with reports about the Koreish or Meccan elites and poor believers.
  language: English
