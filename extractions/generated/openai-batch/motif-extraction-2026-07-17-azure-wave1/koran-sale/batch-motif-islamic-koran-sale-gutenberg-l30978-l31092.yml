canonical_text:
  quote: ''
  summary: The passage opens with oaths by ordered heavenly beings and states God's
    oneness and cosmic lordship. It describes the lower heaven adorned with stars
    and guarded from rebellious devils, then addresses mockers who deny resurrection.
    A trumpet blast raises the dead for judgment; the unjust, their comrades, and
    their idols are sent toward hell and brought before a tribunal, where seduced
    and seducers dispute. The passage contrasts this punishment with the provision
    of God's sincere servants in paradise, including fruits, gardens, couches, a non-inebriating
    cup from a limpid fountain, and paradisal companions. One blessed person looks
    down and sees a former skeptical friend in hell, crediting God's grace for deliverance.
  language: English
  quote_policy: summarized
