literal_observations:
- id: obs:1
  text: A note says intercalating a month every second or third year to align lunar
    and solar years, reportedly learned by Arabs from Jews, is declared unlawful because
    it fixed pilgrimage and Ramadan to specific seasons.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note describes an idolatrous Arab practice of avoiding a sacred month by
    observing a profane month in its place, such as transferring Moharram to Safar.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: A note names Jonda Ebn Awf as the first man said to have practiced this sacred-month
    transfer.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: A note says Jonda publicly proclaimed to pilgrims that their gods had allowed
    Moharram to be profane, and the next year said the gods had ordered it to be kept
    sacred.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: A note identifies the expedition as the expedition of Tabc, between Medina
    and Damascus, undertaken by Mohammed against the Greeks with an army of thirty
    thousand men in the ninth year of the Hejra.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:6
