canonical_text:
  quote: ''
  summary: The passage opens Chapter VII by describing a book sent down as admonition,
    warning against other guides, and recalling destroyed cities. It announces divine
    accounting and just weighing of actions, then recounts the creation and forming
    of humankind, the command that angels worship Adam, Eblis's refusal, expulsion,
    respite until resurrection, and vow to mislead humans. Adam and his wife dwell
    in paradise with a prohibition concerning one tree; Satan deceives them, they
    taste the tree, their nakedness appears, they cover themselves with leaves, confess
    wrongdoing, and are sent down to earth, where they will live, die, and be raised.
    The passage closes by addressing the children of Adam concerning apparel and the
    superior clothing of piety.
  language: English
  quote_policy: summarized
