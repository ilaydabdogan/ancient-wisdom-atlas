- id: motif:3
  label: Pride based on contrasting substances
  taxonomy_refs:
  - duality
  basis: Eblis contrasts his creation from fire with Adam's creation from clay and
    uses the contrast to claim superiority.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The duality taxonomy is applied only to the explicit fire/clay contrast,
    not to a broader metaphysical dualism.
- id: motif:4
  label: Deceptive approach to the forbidden tree
  taxonomy_refs:
  - forbidden_knowledge
  - trickster_boundary
  basis: Adam and his wife are forbidden to approach a tree; Satan presents an alternative
    explanation involving angels and immortality, swears he counsels rightly, and
    causes them to fall through deceit.
  evidence_refs:
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage names a forbidden tree and hidden nakedness, but it does not
    explicitly call the tree a tree of knowledge; there is no serpent in this passage.
- id: motif:5
  label: Expulsion or descent from paradise to earth
  taxonomy_refs:
  - departure
  basis: Eblis is told to get down from paradise; Adam and his wife are later told
    to get down to an earthly dwelling-place with provision for a season.
  evidence_refs:
  - ev:8
  - ev:15
  confidence: high
  cautions: The taxonomy label 'departure' is used for the literal commands to get
