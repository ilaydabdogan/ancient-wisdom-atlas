- id: motif:2
  label: Creation of Adam and refusal of a commanded worship
  taxonomy_refs: []
  basis: God creates and forms humans, commands angels to worship Adam, and Eblis
    refuses while citing fire and clay as grounds for superiority.
  evidence_refs:
  - ev:6
  - ev:7
