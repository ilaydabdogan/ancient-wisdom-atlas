  summary: The passage opens Chapter VI by praising God as creator of heaven, earth,
    darkness, light, and humans from clay. It says unbelievers reject signs, mock
    truth, demand an angel, and would still reject a tangible written book. It recalls
    earlier prosperous generations destroyed for sins, says mocked apostles were vindicated
