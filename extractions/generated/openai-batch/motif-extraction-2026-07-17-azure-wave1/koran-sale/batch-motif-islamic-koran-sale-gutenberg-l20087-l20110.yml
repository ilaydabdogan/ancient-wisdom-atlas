canonical_text:
  quote: ''
  summary: The passage contrasts a few delivered, virtuous people from earlier generations
    with unjust people who followed worldly delights. It states that the Lord does
    not destroy cities unjustly while their inhabitants behave uprightly. It says
    the Lord could have made all people one religion, but they continue to differ
    except those receiving mercy, and that the Lord's word will fill hell with genii
    and men. It presents histories of apostles as truth, admonition, and warning that
    confirm the addressed recipient's heart, tells unbelievers and believers to act
    and wait, and concludes that God knows what is secret in heaven and earth, that
    all matters return to him, and that worship and trust are due to him.
  language: English
