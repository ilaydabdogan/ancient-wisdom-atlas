canonical_text:
  quote: ''
  summary: 'The passage includes editorial notes on intervals between prophets and
    Israelite wilderness traditions, then relates the story of the two sons of Adam:
    their offerings, Cain’s threat, Abel’s refusal to retaliate, Cain’s killing of
    Abel, and God’s sending of a raven to show how to hide the brother’s shame. It
    then states a command to the children of Israel equating unjust killing of one
    soul with killing all mankind and saving one soul with saving all mankind, followed
    by warnings, punishments, and an exception for repentance.'
