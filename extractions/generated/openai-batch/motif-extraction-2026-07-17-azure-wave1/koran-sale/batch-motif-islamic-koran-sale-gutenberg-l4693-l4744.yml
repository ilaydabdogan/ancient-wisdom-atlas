canonical_text:
  quote: ''
  summary: The passage describes punished believers being delivered from hell through
    marks left by prayer, divine mercy, and intercession; some are restored to life
    and washed in a river of life in paradise. It then compares these details with
    Jewish and Magian teachings about seven hells, angelic oversight, proportionate
    punishments, eventual deliverance, and various torments. It closes by introducing
    a wall or partition imagined between paradise and hell.
