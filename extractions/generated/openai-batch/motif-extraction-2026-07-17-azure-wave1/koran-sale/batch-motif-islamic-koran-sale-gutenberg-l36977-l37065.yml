    punishment comes. Noah reports that repeated public and private admonitions only
    increased their refusal. He urges repentance and describes divine gifts of rain,
    wealth, children, gardens, rivers, cosmic order, human creation from earth, burial,
    and resurrection. The people follow leaders and named gods/idols, are said to
