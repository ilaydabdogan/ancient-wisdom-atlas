  summary: 'The passage describes pre-Islamic Arabian practices involving divided
    offerings for idols and God, asymmetrical restitution and water management, Mohammed''s
    rejection of idolatry, Arabian star and planet worship connected with weather
    and rain, planetary temples including Beit Ghomdan, tribal celestial cults, Abu
    Cabsha''s advocacy of Sirius worship, and the worship of three female-named angelic
    intelligences: Allat, al Uzza, and Manah.'
