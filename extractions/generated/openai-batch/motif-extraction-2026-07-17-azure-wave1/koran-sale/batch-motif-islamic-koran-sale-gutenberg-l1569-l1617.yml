literal_observations:
- id: obs:1
  text: Fruits or offerings were divided into one part for idols and another for God,
    with restitution made only when the idol's portion fell into God's portion, not
    when God's portion fell into the idol's.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When water from the idol's grounds overflowed onto God's part, it was dammed
    back; when water flowed the other way, it was allowed to continue, with the explanation
    that the idols needed what was God's but God needed nothing.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: If the offering intended for God was better than the offering intended for
    an idol, an exchange was made; the reverse exchange was not made.
  category: action
  evidence_refs:
  - ev:1
