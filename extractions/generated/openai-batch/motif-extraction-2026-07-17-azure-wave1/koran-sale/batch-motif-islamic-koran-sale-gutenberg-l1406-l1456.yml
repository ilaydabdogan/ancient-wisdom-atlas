  summary: 'The passage gives a historical account of Arabian ruling families and
    political independence: Karmatian disruption at Mecca, dynastic descent claims
    in Yaman, Mecca, and Medina, succession customs, partial Ottoman coastal conquest,
    and the Arabs'' reputed long preservation of liberty against Assyrian, Median,
    Persian, Cambyses, and Alexander.'
