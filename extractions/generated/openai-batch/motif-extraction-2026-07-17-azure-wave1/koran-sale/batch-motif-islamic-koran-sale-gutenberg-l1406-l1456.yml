literal_observations:
- id: obs:1
  text: The Karmatians are described as a new sect holding much of the country, committing
    outrages and disorders in Mecca, and receiving tribute from the Khalifs so that
    pilgrimage could be performed.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Yaman is said to have been governed by the house of Thabateba, descended from
    Ali, the son-in-law of Mohammed; descendants or claimed descendants of Ali are
    said to have reigned in Yaman and Egypt by the tenth century.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: The present reigning family in Yaman is described as probably the family of
    Ayub, with a branch that reigned there in the thirteenth century and retained
    the titles Khalf and Imam.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: The crown of Yaman is described as not descending regularly from father to
    son; the prince of royal blood most favored by the great ones, or with the strongest
    interest, usually succeeds.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: The governors of Mecca and Medina are described as always of the race of Mohammed,
    as having thrown off subjection to the Khalifs, and as belonging to four principal
    families descended from Hassan the son of Ali.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The kings of Yaman and the princes of Mecca and Medina are described as absolutely
    independent and not subject to the Turk.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: Wars among Arabian princes are said to have allowed Selim I and Soliman to
    take control of the Red Sea coasts of Arabia and part of Yaman, though their successors
    retained little except the port of Jodda.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: The Arabs are said to have preserved their liberty with little interruption
    from the Deluge, and attempts by great armies, including Assyrian or Median imperial
    efforts, are described as unsuccessful.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:9
  text: Persian monarchs are described as friends of the Arabs and recipients of an
    annual present of frankincense, but unable to make them tributary; Cambyses is
    said to have asked their leave to pass, and Alexander is said not to have alarmed
    them greatly.
  category: relationship
  evidence_refs:
  - ev:9
