canonical_text:
  quote: verily that wherewith ye are threatened is certainly true; and the last judgment
    will surely come.
  summary: The passage opens with oaths by dispersing winds, rain-bearing clouds,
    swift ships, and distributing angels, then affirms the certainty of the threatened
    last judgment. It contrasts cursed liars, who will be burned in hell fire, with
    the pious, who dwell among gardens and fountains and practice prayer, repentance,
    and charity. It then presents signs in earth, self, heaven, and sustenance, followed
    by the story of Abraham receiving unknown honored guests who refuse food, allay
    his fear, and announce a wise youth to his old barren wife. The guests say they
    are sent against a wicked people with marked stones of baked clay; believers are
    removed, one Muslim family is found, and the city is overthrown as a sign. The
    passage closes by mentioning Moses sent to Pharaoh with manifest power and Pharaoh
    rejecting him as a sorcerer or madman.
  language: English
  quote_policy: quoted
