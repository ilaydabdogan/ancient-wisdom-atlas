canonical_text:
  quote: ''
  summary: The passage recounts God’s covenant with the children of Israel, the appointment
    of twelve leaders, conditional promises of forgiveness and gardens with flowing
    rivers, and punishments for covenant-breaking among Israelites and Christians.
    It presents the apostle and revealed book as guidance from darkness into light,
    rejects claims that God is Christ or that Jews and Christians are God’s children
    and beloved, and recalls Moses commanding his people to enter the holy land. The
    people fear the gigantic inhabitants and refuse; two God-fearing men urge trust
    and entry through the gate, but the refusal leads to God forbidding the land to
    them for forty years of wandering.
  language: English
  quote_policy: summarized
