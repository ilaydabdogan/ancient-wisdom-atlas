  summary: The passage narrates Joseph receiving wisdom and knowledge, resisting the
    woman of the household, being accused and vindicated by the evidence of a torn
    garment, becoming the subject of city gossip and a banquet scene with knives,
    choosing prison over the crime urged on him, being imprisoned despite signs of
    innocence, and encountering two royal servants whose dreams he is asked to interpret.
    Joseph attributes his knowledge to God and teaches monotheism to his fellow prisoners.
