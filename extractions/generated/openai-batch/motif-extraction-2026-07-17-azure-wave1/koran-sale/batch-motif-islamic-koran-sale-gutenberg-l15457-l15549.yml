canonical_text:
  quote: ''
  summary: The passage addresses genii and men about messengers who warned them of
    a day of meeting and judgment. It states that people testify against themselves,
    that God recompenses deeds and can destroy and replace communities, and that the
    ungodly will not prosper. It condemns Meccan/idolatrous practices of assigning
    produce and cattle to God and idols, slaying children, imposing food and animal
    taboos, and falsely attributing such rules to God. It contrasts these practices
    with God's production of gardens and cattle for human use and commands moderation,
    payment of due, and avoidance of Satan's steps.
  language: English
  quote_policy: summarized
