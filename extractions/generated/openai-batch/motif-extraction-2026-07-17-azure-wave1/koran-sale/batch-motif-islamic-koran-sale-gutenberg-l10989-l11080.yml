canonical_text:
  quote: ''
  summary: The passage recounts Mary being accepted by God and cared for by Zacharias,
    who finds divinely provided provisions with her. Zacharias prays for offspring
    and receives an angelic announcement of John despite his old age and his wife's
    barrenness, with a three-day sign of speechlessness except by gesture. Mary is
    chosen and purified; an unseen history describes rods cast by disputants over
    her care. Angels announce to Mary that she will bear Christ Jesus, the Word from
    God; she questions how this can occur without male contact, and the angel replies
    that God creates by decree. Jesus is described as speaking in the cradle, receiving
    scripture and wisdom, becoming an apostle to Israel, performing signs by God's
    permission, confirming prior law, and commanding service to God.
  language: English
  quote_policy: summarized
