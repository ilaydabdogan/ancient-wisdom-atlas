canonical_text:
  quote: ''
  summary: The passage surveys Islamic theological positions on divine power, human
    will, and moral accountability. It presents mediating formulas between compulsion
    and free liberty, cautions against excessive inquiry into divine action, compares
    free-will and necessitarian schools, and describes Asharian teaching on the fate
    of a believer who dies guilty of mortal sin, including pardon, prophetic intercession,
    punishment, paradise, and deliverance from hell fire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Named authorities describe human actions in relation to God's power, man's
    created power and will, or a compound of divine and human power.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: One formulation states that when man intends obedience or disobedience, God
    creates the corresponding action, so that action proceeds from God's power and
    man's acquisition.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says the intention of the mind is God's work and warns that the
    dispute may lead either to removing precepts or to positing an independent agent
    besides God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: A recommended formula says there is neither compulsion nor free liberty, but
    a way between the two; man's power and will are created by God, while merit or
    guilt is imputed to man.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The postscript names Kadarians as those who allow free will and Jabarians
    as those who make man a necessary agent; it also says the Kadarian view approaches
    that of many Christians and Jews.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: The Sonnite position is described as affirming that man has power and will
    to choose good and evil and can know reward or punishment, while still depending
    on God's power and will.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: The Asharians teach that an unrepentant believer guilty of mortal sin has
    his sentence left with God, who may pardon him, accept prophetic intercession,
    or punish him proportionately and then admit him to paradise.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage says a believer with faith in his heart of the weight of an ant
    shall be delivered from hell fire and will not remain forever in hell with infidels.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The mortal-sin doctrine described is called generally orthodox and diametrically
    opposite to that of the Mtazalites.
  category: relationship
  evidence_refs:
  - ev:5
