  summary: The passage describes reported Sabian prayer orientation, pilgrimage, reverence
    for Mecca and Egyptian pyramids, sacrifices, scriptures, baptismal practice, and
    toleration under Mohammed. It then describes Arab idolatry as worship of stars,
    planets, angels, images, and subordinate deities while acknowledging one supreme
    God, and notes a Greek identification of Arab divine names with Bacchus and Urania.
    It closes with a reported dedication formula to God and a description of offerings
    divided between God and idols.
