  summary: 'The passage recounts a sequence of prophetic warnings and rejections:
    an unnamed prior people are destroyed after accusing a messenger; the Thamud reject
    Saleh, demand a sign, receive a she-camel with an apportioned water arrangement,
    slay her, and are punished; the people of Lot reject Lot, threaten expulsion,
    and are destroyed by a shower of stones after Lot and most of his family are delivered;
    the inhabitants of the wood are introduced as another people who accuse messengers,
    with Shoaib beginning a warning speech.'
