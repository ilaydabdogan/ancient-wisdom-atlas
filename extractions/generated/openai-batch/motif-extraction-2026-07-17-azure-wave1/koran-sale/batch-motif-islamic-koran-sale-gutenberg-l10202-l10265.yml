  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage forbids taking back what has been given to wives except under
    the stated concern that the couple cannot observe God's ordinances.
  category: action
  evidence_refs:
  - ev:6
- id: obs:8
