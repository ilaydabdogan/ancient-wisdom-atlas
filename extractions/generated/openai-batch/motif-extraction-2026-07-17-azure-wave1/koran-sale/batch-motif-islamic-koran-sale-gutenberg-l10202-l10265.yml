canonical_text:
  quote: ''
  summary: The passage gives rules about oaths, vows of abstinence from wives, divorce,
    waiting periods for divorced women, disclosure of pregnancy, reconciliation, compensation
    or redemption in divorce, and restrictions after a third divorce. It repeatedly
    frames these rules as ordinances of God, who hears, knows, forgives, and may punish
    intentional assent in oaths.
  language: English
  quote_policy: summarized
