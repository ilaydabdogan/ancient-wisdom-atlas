- id: obs:3
  text: Those who vow abstinence from their wives are allowed a four-month waiting
    period; if they return from the vow, God is described as gracious and merciful,
    and if they resolve on divorce, God is described as hearing and knowing.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Divorced women are instructed to wait until they have had three courses and
    not to conceal what God has created in their wombs.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage states reciprocal just conduct between women and husbands, while
    also stating that men have superiority over women.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The passage permits divorce twice, after which wives are to be retained with
