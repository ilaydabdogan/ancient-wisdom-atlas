  text: The Khrejites are described as those who depart or revolt from the lawful
    prince established by public consent; the first so called were twelve thousand
    men who revolted from Ali after fighting under him at Seffein.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The same group was also called Mohakkemites or Judiciarians because they objected
