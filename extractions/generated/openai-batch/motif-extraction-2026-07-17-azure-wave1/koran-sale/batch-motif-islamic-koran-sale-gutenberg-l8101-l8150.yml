    while judgment in that case belonged only to God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: The Khrejites held that an Imam or prince need not be of Koreish or a freeman
    if he was just, pious, and qualified; they also held that a truth-forsaking Imam
    might be killed or deposed and that no Imam was absolutely necessary in the world.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: They charged Ali with sin for leaving an affair to the judgment of men and
    declared him guilty of infidelity, cursing him on that account.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: In the 38th year of the Hejra, Ali destroyed the persistent rebels, given
