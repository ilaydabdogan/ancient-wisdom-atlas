canonical_text:
  quote: Do men imagine that it shall be sufficient for them to say, We believe; will
    they not be proved?
  summary: The passage opens Chapter XXIX by declaring that professed belief will
    be tested, that God distinguishes the sincere from liars, and that evil, unbelief,
    and hypocrisy will be judged. It commands kindness to parents while forbidding
    obedience to pressure to associate others with God. It promises reward and paradise
    to believers who work righteousness. It recalls Noah, the deluge, and deliverance
    in the ark; Abraham’s preaching against idols; the rejection of prophets by earlier
    nations; God’s production and restoration of creatures; resurrection, judgment,
    mercy, punishment, and the impossibility of escaping God.
  language: English
  quote_policy: quoted
