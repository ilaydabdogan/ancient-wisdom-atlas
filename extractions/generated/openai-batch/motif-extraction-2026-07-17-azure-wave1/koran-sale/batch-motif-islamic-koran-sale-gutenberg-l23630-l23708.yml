  cautions: The passage itself frames the episode as instruction in wisdom; broader
    quest terminology is a classification rather than a quoted label.
- id: motif:2
  label: Forbidden questioning before revelation of meaning
  taxonomy_refs:
  - initiation
  - forbidden_knowledge
  - wisdom
  basis: The guide warns Moses that he cannot bear knowledge he does not comprehend
    and requires him not to ask about events until their meaning is declared.
  evidence_refs:
