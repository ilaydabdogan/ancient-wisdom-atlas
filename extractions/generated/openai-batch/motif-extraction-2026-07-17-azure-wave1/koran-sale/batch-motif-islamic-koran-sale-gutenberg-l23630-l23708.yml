canonical_text:
  quote: ''
  summary: Moses and his servant return to a rock after the fish takes its way into
    the sea, where they find a divinely taught servant. Moses asks to follow him for
    instruction, but is warned not to question what he cannot yet comprehend. The
    guide damages a ship, kills a youth, and repairs a wall in a city that refused
    them food. After Moses repeatedly objects, the guide explains that the ship was
    protected from a king, the youth was to be replaced for believing parents by a
    better child, and the wall preserved treasure for orphans until maturity. Included
    notes identify the guide as al Khedr and report traditions about his immortality
    and associations with Phineas, Elias, and St. George. The passage then begins
    an account of Dhu'lkarnein.
  language: English
  quote_policy: summarized
