canonical_text:
  quote: ''
  summary: 'The passage opens with universal praise of God and admonishes believers
    not to say what they do not do. It commends those who fight in ordered ranks,
    recalls Moses being injured by his people, and recounts Jesus son of Mary confirming
    the prior law and announcing a later apostle named Ahmed. Opponents reject evident
    miracles as sorcery and seek to extinguish God''s light, but God will perfect
    it and exalt the religion of truth. Believers are offered a saving ''merchandise'':
    belief in God and his apostle and defense of God''s religion with wealth and persons,
    followed by forgiveness, gardens with rivers, divine assistance, and victory.
    The passage closes by urging believers to be assistants of God as Jesus''s apostles
    were, and by stating that believers were strengthened over their enemies.'
  language: English
  quote_policy: summarized
