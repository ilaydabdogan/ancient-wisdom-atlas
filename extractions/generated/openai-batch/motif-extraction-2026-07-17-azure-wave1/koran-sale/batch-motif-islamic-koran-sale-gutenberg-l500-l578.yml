canonical_text:
  quote: ''
  summary: 'In a prefatory address to the reader, the translator argues for the usefulness
    of publishing an English version of the Koran while describing it polemically
    as a forgery and imposture. He notes the wide spread of Mohammed''s law and says
    it was not propagated by the sword alone. He criticizes earlier translations and
    Roman Catholic refutations, asserts that Protestants are best placed to oppose
    the Koran, and lays out rules for attempts to convert Mohammedans, adapted from
    Bishop Kidder''s rules for converting Jews: avoid compulsion, avoid doctrines
    against common sense, avoid weak arguments and harsh language, and do not abandon
    articles of Christian faith. He says he has tried to speak of Mohammed and the
    Koran with common decency rather than abuse.'
  language: English
  quote_policy: summarized
