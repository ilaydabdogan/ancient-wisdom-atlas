  summary: The passage combines Sale's explanatory notes on the Battle of Bedr/Badr
    with translated Qur'anic instructions about treacherous leagues, military preparation,
    peace, divine support, faithful perseverance, and captives. The notes recount
    Abu Jahl's insistence on proceeding to Bedr, a reported devilish instigation in
    the likeness of Sorka Ebn Malec, angelic assistance to the Moslems, and an interpretation
    concerning the examination of the sepulchre after death.
