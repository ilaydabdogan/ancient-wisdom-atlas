    trusting God, and warning of replacement. It then states that Hud and his believers
    were delivered while Ad rejected signs and received a curse. The passage then
    introduces Saleh sent to Thamud, his call to worship God, the people's doubt and
    attachment to ancestral worship, and Saleh's presentation of the she-camel of
    God as a sign that must not be harmed.
