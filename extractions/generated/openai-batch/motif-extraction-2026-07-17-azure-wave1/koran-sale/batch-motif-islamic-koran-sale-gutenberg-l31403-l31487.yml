  summary: The passage opens Sura 38 with an oath by the admonitory Koran, describes
    unbelievers rejecting a warner and the oneness of God, cites earlier peoples who
    accused messengers and received divine vengeance, announces a single trumpet blast
    and day of account, and recalls David as a strong, repentant servant whose praise
    is joined by mountains and birds and whose kingdom, wisdom, and eloquence are
    established. It begins the story of two adversaries who enter David's upper apartment
    by climbing over a wall; a note identifies them as angels in human form and compares
    the episode to Nathan's parable to David.
