  quote: ''
  summary: The chapter condemns hypocrites who outwardly profess belief while being
    described as liars, oath-users, enemies, and people without understanding. It
    rejects their chance of forgiveness when they disdainfully turn from the apostle’s
    intercession, describes their attempts to deny support to refugees in Medina,
    and exhorts true believers to remember God and give alms before death, since no
    respite is granted when the appointed time arrives.
