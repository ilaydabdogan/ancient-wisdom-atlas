  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: A variant account adds Sadaka Bint al Mokhtr as a joint conspirator and says
    the young one fled to a mountain named Kra, cried three times, and was received
    into an opening rock.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Sleh tells the people that catching the young one might give hope of avoiding
    divine vengeance, but they are unable to do so.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The threatened people defy vengeance because they trust in strong dwellings
    hewn in the rocks.
  category: attribute
  evidence_refs:
