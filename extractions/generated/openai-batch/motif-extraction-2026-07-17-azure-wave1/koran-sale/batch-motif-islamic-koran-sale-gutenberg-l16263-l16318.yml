  text: An extraordinary camel frightens other cattle from their pasture.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A rich woman, Oneiza Omm Ganem, offers one of her four daughters to Kedr if
    he kills the camel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Kedr chooses one daughter and, with eight other men, hamstrings and kills
