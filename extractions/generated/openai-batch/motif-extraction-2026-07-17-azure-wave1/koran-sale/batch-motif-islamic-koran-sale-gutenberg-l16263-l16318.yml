  text: Sleh is said to warn that faces will turn yellow, red, and black over three
    days, with God's vengeance on the fourth day; God delivers Sleh by sending him
    into Palestine.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:9
  text: Muhammad passes by Hejr, forbids his army to draw or use the water there,
    muffles his face, warns them not to enter the houses of the wicked men, and leaves
    the valley quickly.
  category: sequence
  evidence_refs:
  - ev:5
