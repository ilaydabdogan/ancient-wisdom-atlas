canonical_text:
  quote: ''
  summary: Joseph, still in prison, refuses immediate release until the king inquires
    into the women who cut their hands. The women and the nobleman's wife acknowledge
    Joseph's innocence, and the wife confesses her solicitation. Joseph attributes
    the disclosure to truth and divine knowledge, while also admitting human moral
    frailty before God's mercy. The king then appoints Joseph to trusted service,
    and Joseph asks to oversee the land's storehouses. The passage concludes by affirming
    divine reward in this life and the next. Sale's notes add commentarial traditions
    about Joseph's public vindication, Gabriel's rebuke, Joseph's linguistic wisdom
    before the king, his appointment as Wazir, and later allegorical readings of Joseph
    and Zoleikha's love.
  language: English
  quote_policy: summarized
