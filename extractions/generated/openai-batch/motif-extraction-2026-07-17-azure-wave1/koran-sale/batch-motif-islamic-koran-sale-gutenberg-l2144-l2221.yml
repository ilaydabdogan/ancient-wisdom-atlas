canonical_text:
  quote: ''
  summary: 'The passage gives Sale''s account of ancient Arabians before Mohammed:
    alleged desert raiding and its Ismaelite justification, strict in-group honesty,
    cultivated knowledge of genealogy, star-based weather prediction, and dream interpretation,
    plus a description of lunar mansions, astral weather attribution, and Mohammed''s
    condemnation of attributing rain directly to stars rather than to God''s ordering
    of seasons.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage characterizes Arabs of the desert as inclined to war, bloodshed,
    cruelty, rapine, and lasting malice, and reports a physician claim connecting
    this temperament to eating camel's flesh.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that frequent robberies on merchants and travellers made
    the name of an Arab infamous in Europe.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says these robbers excused themselves by referring to Ismael,
    whom Abraham expelled and whom God gave open plains and deserts as patrimony,
    with permission to take what he could find there.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The passage says they preferred to describe plunder by saying they had 'gained'
    something rather than 'robbed' someone.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage contrasts outside raiding with strict honesty within their camp
    and toward people accepted as friends.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: 'The passage lists three sciences cultivated by Arabians before Mohammedism:
    genealogy and history, star-based weather prediction, and interpretation of dreams.'
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage states that their knowledge of stars came from long experience
    rather than formal astronomical rules.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: The passage compares Arabians and Indians as focusing chiefly on fixed stars,
    while saying other nations' observations were almost confined to planets; it also
    contrasts Greek and Chaldean planetary worship with Indian fixed-star worship.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Anw, or houses of the moon, are described as twenty-eight divisions of
    the zodiac through which the moon passes nightly, whose risings and settings were
    used to predict weather.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says Arabs came to ascribe divine power to stars and to say rain
    was from a particular star.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: The passage says Mohammed condemned and forbade the old sense of saying rain
    came from a star, except where the statement meant that God had ordered seasons
    so that weather coincided with lunar mansions or star risings and settings.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage summarizes old Arabian astronomy as observation of star influence
    on weather and star-naming, connected with a pastoral life spent in open plains,
    and says star names often alluded to cattle and flocks.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:13
  text: The passage identifies the period before Mohammed as the ancient Arabians'
    'time of ignorance.'
  category: sequence
  evidence_refs:
  - ev:9
