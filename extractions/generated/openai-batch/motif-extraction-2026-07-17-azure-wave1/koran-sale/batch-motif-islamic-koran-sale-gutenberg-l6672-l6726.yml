  summary: 'Sale’s commentary discusses legal penalties associated with the Koran:
    severe treatment of involuntary manslaughter, Jewish city-of-refuge rules as a
    comparison, theft punished by cutting off the hand with a value threshold in the
    Sonna, and the law of retaliation for bodily injuries as compared with Mosaic
    and Roman legal traditions. The passage emphasizes that retaliation is often commuted
    to a fine or interpreted as proportionate judicial punishment rather than literal
    mutilation.'
