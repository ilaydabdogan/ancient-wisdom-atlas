- id: obs:7
  text: God is said to cause night to succeed day and day to succeed night, and to
    hear and see.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: A translator note recounts that Mohammed, while reading chapter 53, uttered
    words attributed to the devil about high and beauteous damsels whose intercession
    was hoped for; the Koreish rejoiced and joined in adoration, and Gabriel later
    informed Mohammed of the error.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The same note reports that more intelligent and accurate persons reject the
