canonical_text:
  quote: 'On that day the kingdom shall be GOD''S: he shall judge between them.'
  summary: The passage contrasts believers and disbelievers, states that Satan may
    suggest error during prophetic reading but God nullifies it and confirms divine
    signs, describes sudden judgment with gardens for believers and punishment for
    disbelievers, promises provision to those who fled for God's religion and died
    or were slain, permits proportional vengeance with divine aid, and invokes the
    alternation of night and day. Translator notes recount a contested anecdote about
    Mohammed's recitation, the devil's interpolated words about goddesses, Gabriel's
    correction, and alternative interpretations rejecting the anecdote.
  language: English
  quote_policy: quoted
literal_observations:
