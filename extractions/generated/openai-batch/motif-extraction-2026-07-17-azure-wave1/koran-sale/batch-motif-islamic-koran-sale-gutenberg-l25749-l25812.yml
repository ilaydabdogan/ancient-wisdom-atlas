  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage says that whenever earlier apostles or prophets read, Satan suggested
    some error, but God made Satan's suggestion void and confirmed divine signs.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Satan's suggestion is described as a permitted temptation for people with
    infirm or hardened hearts, while those given knowledge recognize the book as truth
    from their Lord and are directed to the right way.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: Infidels are said to continue doubting until sudden judgment or a grievous
    day; God will judge, assigning believers to gardens of pleasure and disbelievers
    to shameful punishment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Those who fled their country for God's true religion and then were slain or
    died are promised excellent provision and a pleasing introduction by God.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A person who takes vengeance equal to the injury done and is then unjustly
