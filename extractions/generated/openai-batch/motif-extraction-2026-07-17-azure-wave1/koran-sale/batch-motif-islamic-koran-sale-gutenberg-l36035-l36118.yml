  summary: Chapter LXII praises God; describes an apostle raised among the illiterate
    Arabians to recite signs, purify, and teach scripture and wisdom; compares those
    charged with the law but not observing it to an ass loaded with books; warns Jewish
    followers about death and divine accounting; and instructs believers to leave
    commerce for the Friday assembly prayer, then return to lawful provision while
    remembering God. Translator notes explain Friday assembly practice and relate
    a caravan incident during Mohammed's preaching.
