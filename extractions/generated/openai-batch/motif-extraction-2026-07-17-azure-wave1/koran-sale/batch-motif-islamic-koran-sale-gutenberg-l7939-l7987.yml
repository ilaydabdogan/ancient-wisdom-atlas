  summary: The passage describes several Islamic theological sects, especially the
    Moshabbehites and Kermians/Mojassemians, as attributing corporeal or anthropomorphic
    qualities to God. It reports examples of human-form theophany, bodily members,
    divine touch, ascent and descent, and parallels or alleged borrowings from Jewish
    anthropomorphic descriptions of God, including weeping over Noah's flood and lamenting
    the ruined temple. It ends by introducing the Jabarians as opponents of the Kadarians
    who deny human free agency.
