canonical_text:
  quote: ''
  summary: 'The passage describes rites associated with the pilgrimage to Mecca: animal
    sacrifice at Mina, distribution of meat, shaving and nail-cutting, renewed visit
    to the Caaba, and several rites said to derive from pre-Islamic Arab practice.
    It also summarizes Sale’s comments on Mohammed’s alteration and retention of older
    rites, interpretations of circumambulation, and comparisons with other ritual
    traditions.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the tenth of Dhu'lhajja, pilgrims slay animal victims in the valley of
    Mina; the passage specifies permitted animals and says part is eaten by the pilgrims
    and friends while the rest is given to the poor.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: After the sacrifices, pilgrims shave their heads, cut their nails, bury the
    cuttings in the same place, and the pilgrimage is regarded as completed, though
    they again visit the Caaba to take leave.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that many of the ceremonies were observed by pagan Arabs
    before Mohammed, especially compassing the Caaba, running between Saf and Merw,
    and throwing stones in Mina.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says Mohammed confirmed older rites with alterations, including
    ordering pilgrims to be clothed when compassing the Caaba, whereas earlier practice
    is described as naked performance interpreted as casting off sins or signs of
    disobedience toward God.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: The passage reports an interpretation that such rites are arbitrary commands
    meant to try human obedience, rather than acts with intrinsic worth.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: One cited writer explains procession around the Caaba as imitating the purity
    and circular motion of heavenly bodies.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: Reland is cited as noting that Romans were ordered by Numa to use circular
    motion in adoration of the gods, with explanations connected to cosmic motion,
    completeness of prayer, or Egyptian wheel hieroglyphics.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says Mohammed allowed pilgrimage to the Meccan temple and directed
    prayers toward it while transferring devotions from idols to the true God and
    changing circumstances judged scandalous.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: A footnote reports Maimonides’ claim that worship of Mercury involved throwing
    stones and worship of Chemosh involved making the head bare and wearing unsewn
    garments.
  category: speech
  evidence_refs:
  - ev:9
