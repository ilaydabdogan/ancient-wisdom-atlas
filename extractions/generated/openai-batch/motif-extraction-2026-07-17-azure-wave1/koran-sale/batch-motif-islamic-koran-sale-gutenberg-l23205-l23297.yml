canonical_text:
  quote: ''
  summary: 'The opening of Chapter XVIII praises God for sending down the Koran as
    a straight rule, warns unbelievers and those who claim God has offspring, describes
    earthly adornment as a trial that will be reduced to dust, and begins the account
    of the companions of the cave: believing young men flee from their people and
    their deities into a cave, are made to sleep there for many years, and are later
    awakened. Sale''s notes identify the cave story with the Seven Sleepers tradition
    and discuss variant interpretations of Al Rakim.'
  language: English
  quote_policy: summarized
