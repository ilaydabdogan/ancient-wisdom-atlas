comparison_claims:
- id: claim:1
  claim: The commentary explicitly presents the Abrahamic offered-son episode as a
    tradition in which Muslim opinion identifies the son as Ismael rather than Isaac.
  claim_level: same_motif
  target: Isaac-offering variant of the Abrahamic sacrifice tradition
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The passage reports the exegetical preference and contrast but does
    not provide the full alternate Isaac narrative.
- id: claim:2
  claim: The commentary links Ismael and Abd'allah through the shared status of being
    'offered in sacrifice,' with Abd'allah's case resolved by substitutionary ransom.
  claim_level: same_function
  target: Abd'allah redemption by one hundred camels
  evidence_refs:
  - ev:2
  counter_evidence_refs: []
  confidence: high
  limitations: The link is reported through a saying and explanatory tradition in
    the commentary, not through a separate Quranic narrative in the quoted section.
- id: claim:3
  claim: The commentary reports a tradition that the Abrahamic ransom animal was the
    same ram previously sacrificed by Abel, while also preserving a variant that it
    was a wild goat.
  claim_level: same_motif
  target: Abel's sacrificial ram tradition
  evidence_refs:
  - ev:4
  counter_evidence_refs:
  - ev:4
  confidence: medium
  limitations: The passage itself flags the tradition as one among alternatives and
    does not resolve the variant identification.
- id: claim:4
  claim: The commentary notes that the prophet associated with Ilysin is variously
    identified or confounded with al Khedr, Phineas, Edris, or Enoch in reported traditions.
  claim_level: same_function
  target: al Khedr / Phineas / Edris-Enoch identification traditions
  evidence_refs:
  - ev:5
  counter_evidence_refs:
  - ev:5
  confidence: medium
  limitations: The passage gives multiple inconsistent identifications and does not
    establish a single stable equivalence.
- id: claim:5
  claim: 'The passage itself repeats the lot-casting pattern in two contexts: Abd''allah''s
    selection for a vowed sacrifice and Jonas''s condemnation aboard ship.'
  claim_level: same_function
  target: lot-casting as selection for sacrificial or punitive exposure
  evidence_refs:
  - ev:2
  - ev:8
  counter_evidence_refs: []
  confidence: medium
  limitations: The two lot-casting episodes occur in different narrative frames, one
    in commentary about Abd'allah and one in the Quranic Jonas narrative.
