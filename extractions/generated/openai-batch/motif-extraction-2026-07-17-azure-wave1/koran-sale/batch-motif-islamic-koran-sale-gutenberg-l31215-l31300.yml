candidate_motifs:
- id: motif:1
  label: Commanded sacrifice of a son and substituted ransom
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Abraham receives a divine command in visions, attempts to sacrifice his son,
    is prevented from harming him, and a noble victim serves as ransom.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage segment supplies these details mainly through Sale's commentary
    and notes rather than through the full surrounding Quranic text.
- id: motif:2
  label: Vowed human sacrifice redeemed by animal substitute
  taxonomy_refs:
  - sacrifice
  - sacred_exchange
  basis: Abd'almotalleb vows to sacrifice one son, the lot falls on Abd'allah, and
    he is redeemed by one hundred camels.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: This is a reported tradition in the commentary, not part of the quoted
    Quranic verses in this passage segment.
- id: motif:3
  label: Prophetic warning rejected and followed by divine punishment
  taxonomy_refs:
  - divine_judgment
  basis: Ilysin's people reject his warning and are threatened with punishment, while
    Lot's people are destroyed after Lot and his family are delivered.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The Ilysin and Lot examples are separate narrative units joined by the
    chapter's sequence of prophetic exempla.
- id: motif:4
  label: Deliverance of the righteous with an excluded household member
  taxonomy_refs:
  - divine_judgment
  basis: Lot's family is delivered except for his wife, who remains behind and perishes
    with the condemned.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The available taxonomy has no exact family for the excluded spouse; divine
    judgment is the closest supported reference.
- id: motif:5
  label: Flight by ship, lot condemnation, and swallowing by fish
  taxonomy_refs:
  - departure
  - ark_vessel
  - hero_descent
  basis: Jonas flees into a loaded ship, lots are cast, he is condemned, and a fish
    swallows him.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The ship is a vessel but not an ark, and the 'hero_descent' classification
    is interpretive because the passage literally describes fish-belly confinement
    rather than an explicit underworld descent.
- id: motif:6
  label: Rescue and return after praise of God
  taxonomy_refs:
  - return
  - resurrection
  basis: Jonas praises God and therefore is not left in the fish until the day of
    resurrection; he is cast onto shore and later resumes a mission to a large people.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage mentions the day of resurrection as a counterfactual time
