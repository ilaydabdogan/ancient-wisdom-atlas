  quote: '"transported his servant by night, from the sacred temple of Mecca to the
    farther temple of Jerusalem"'
  summary: The passage opens Chapter XVII, The Night Journey, praising God for transporting
    his servant by night from Mecca's sacred temple to Jerusalem's farther temple
    to show signs. Sale's notes identify this with Mohammed's night journey, including
    transport through the seven heavens to God's presence and return the same night,
    while noting disagreement over whether the event was bodily or visionary. The
    passage then says God gave Moses the law as direction for the children of Israel,
    invokes the posterity of those carried in the ark with Noah, foretells two evils
    by the children of Israel, and describes punishment, restoration, and a later
    punishment involving enemies entering the temple.
