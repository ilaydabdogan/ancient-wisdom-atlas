  summary: The passage contrasts believers with impious transgressors, describes gardens
    for the righteous and hell fire for transgressors, warns of punishment in this
    world and the next, recalls the law given to Moses and guidance for the children
    of Israel, announces judgment on the day of resurrection, points to destroyed
    former generations and rain reviving parched land as signs, and reports disbelievers
    asking when the decision will occur. A translator note gives alternate interpretations
    of a line, including a meeting of Moses and Mohammed in the sixth heaven during
    Mohammed's night journey.
