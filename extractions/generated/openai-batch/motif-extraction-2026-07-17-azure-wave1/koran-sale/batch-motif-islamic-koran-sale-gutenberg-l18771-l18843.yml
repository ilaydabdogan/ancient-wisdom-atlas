canonical_text:
  quote: ''
  summary: The passage exhorts believers to fear God, remain loyal to the apostle,
    accept hardship in defense of religion, and trust that their deeds and contributions
    are recorded for divine recompense. It allows some believers to remain behind
    for religious study and teaching, commands struggle against nearby infidels, contrasts
    believers whose faith increases when revelation descends with doubters whose doubt
    increases, and closes by describing the apostle as compassionate and God as the
    trusted Lord of the magnificent throne. Sale's notes add explanations and an anecdote
    about Abu Khaithama leaving garden comforts to join the army.
