canonical_text:
  quote: And they remained in their cave three hundred years, and nine years over.
  summary: A group sleeps in a cave under divine protection, with their dog at the
    cave mouth. They are awakened, debate how long they stayed, and send one member
    to the city for food while fearing discovery and coercion. Their people later
    learn of the event, dispute the matter, and propose a building or chapel over
    them. The passage emphasizes that God best knows their number, duration, and the
    secrets of heaven and earth.
  language: English
