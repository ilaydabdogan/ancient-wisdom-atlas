  summary: The passage opens Chapter 43 by describing the Arabic Koran as written
    in an original book kept with God and full of wisdom. It recounts mocked prophets
    and destroyed peoples, describes God as creator and provider through earth, paths,
    rain, ships, and cattle, links rain reviving dead land with emergence from graves,
    rejects claims that God has offspring or female angels, criticizes inherited religion
    used against preachers, recalls Abraham’s rejection of his people’s gods, and
    reports Meccan rejection of the truth as sorcery.
