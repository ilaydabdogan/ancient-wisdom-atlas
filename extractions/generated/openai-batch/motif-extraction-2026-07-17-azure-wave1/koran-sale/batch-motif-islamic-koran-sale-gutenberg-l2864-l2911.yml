  summary: The passage describes, in Sale's commentary, Mohammed first presenting
    his role as preaching and admonishing without compulsion, enduring persecution,
    and withdrawing to Medina. It then describes a shift, after gaining support in
    Medina, to claimed divine permission for armed defense and later attack, followed
    by reflections on armed prophets, conversion by the sword, and a contrast with
    Christianity's early spread under persecution.
