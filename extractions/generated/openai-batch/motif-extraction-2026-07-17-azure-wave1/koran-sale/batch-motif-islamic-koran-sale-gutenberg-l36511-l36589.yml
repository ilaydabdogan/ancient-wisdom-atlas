canonical_text:
  quote: ''
  summary: The passage praises God as sovereign creator of death, life, the heavens,
    earth, provision, and human faculties. It describes ordered heavens, heavenly
    lamps directed against devils, hell for unbelievers who rejected warners, pardon
    for secret fear of the Lord, divine knowledge of inner thoughts, resurrection
    and gathering to God, warnings of earth-swallowing and overwhelming wind, birds
    sustained in flight, a contrast between misdirected and upright walking, and a
    final question about who can restore running water if it is swallowed by the earth.
  language: English
  quote_policy: summarized
