candidate_motifs:
- id: motif:1
  label: divine judgment with bodily testimony
  taxonomy_refs:
  - divine_judgment
  basis: False accusers are threatened with punishment, and their own tongues, hands,
    and feet testify against them when God renders their due.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage states judgment and testimony plainly; broader mythic classification
    should remain passage-level and not imply a narrative beyond the text.
- id: motif:2
  label: vindication of the slandered innocent
  taxonomy_refs:
  - divine_judgment
  basis: Good women and men are cleared from calumnies, and a note says Ayesha is
    cleared by these verses, alongside other figures whom God cleared by extraordinary
    testimonies.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The verse itself gives the general clearing of the good; the named comparative
    examples come from translator notes attributed to commentators.
- id: motif:3
  label: forgiveness and benevolence linked to divine pardon
  taxonomy_refs:
  - sacred_exchange
  basis: The wealthy are told to forgive and continue giving to needy kin and refugees,
    immediately followed by the question of whether they desire God's pardon.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The text does not formulate a transactional ritual; the sacred-exchange
    label is a cautious abstraction from the ethical linkage.
- id: motif:4
  label: regulated thresholds of private space and body
  taxonomy_refs: []
  basis: The passage regulates entry into houses through permission and greeting,
    and regulates gaze, veiling, ornaments, and bodily display.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:9
  confidence: medium
  cautions: This is an ethical-legal pattern rather than a developed mythic episode;
    no available taxonomy reference directly matches it.
- id: motif:5
  label: redemption by written instrument
  taxonomy_refs:
  - sacred_exchange
  basis: Slaves who desire redemption by payment are to receive a written instrument
    if good is known in them, and wealth given by God is to be shared with them.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The motif is legal and social in form; the sacred-exchange taxonomy is
    only partially applicable because divine wealth frames the transaction.
