canonical_text:
  quote: One day their own tongues shall bear witness against them, and their hands,
    and their feet, concerning that which they have done.
  summary: The passage commands believers to forgive and continue benevolence toward
    needy kin and religious refugees, warns false accusers of modest believing women
    of divine punishment and bodily testimony, gives rules for entering houses and
    for modest conduct, instructs marriage and chastity, and addresses written redemption
    for slaves and protection of maid-servants from coerced prostitution. Translator
    notes connect some verses to Abu Becr, Mestah, Ayesha, and commentarial examples
    of God clearing accused figures.
  language: English
  quote_policy: quoted
