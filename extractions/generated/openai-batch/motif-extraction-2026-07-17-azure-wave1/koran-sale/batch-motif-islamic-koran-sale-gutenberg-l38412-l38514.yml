canonical_text:
  quote: ''
  summary: The passage opens with oaths by daybreak, ten nights, double and single,
    and the approaching night. It recalls how the Lord dealt with Ad/Irem, Thamud,
    and Pharaoh after insolence and corruption. It criticizes humans who interpret
    prosperity and affliction as honor or contempt while neglecting orphans, the poor,
    and vulnerable inheritance. It then depicts an eschatological scene in which the
    earth is ground to dust, the Lord and ranked angels come, hell is brought near,
    humans remember their deeds too late, and the tranquil soul is invited to return
    to the Lord and enter paradise.
  language: English
