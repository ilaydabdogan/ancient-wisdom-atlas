canonical_text:
  quote: ''
  summary: The passage opens Chapter XXXII, declaring the revealed book to be truth
    from the Lord. It describes God creating the heavens and earth, ascending the
    throne, governing all things, forming humanity from clay and seed, breathing spirit
    into human beings, and granting senses and understanding. It addresses denial
    of resurrection, the angel of death, return to God, judgment of the wicked, filling
    hell with genii and men, and the practices and hidden reward of believers. The
    included notes also recount secret knowledge known to God and a story involving
    Solomon, a man, wind-borne travel to India, and the angel of death.
  language: English
  quote_policy: summarized
