  summary: The passage presents the wise book as guidance and mercy for the righteous,
    contrasts believers with a man who buys frivolous tales and turns away from divine
    signs, promises gardens of pleasure to righteous believers, describes God as creator
    of heaven and earth with stabilizing mountains, rain, beasts, and vegetation,
    and recalls wisdom given to Lokmn, including admonitions to thank God, reject
    partners to God, and be grateful to parents before final judgment.
