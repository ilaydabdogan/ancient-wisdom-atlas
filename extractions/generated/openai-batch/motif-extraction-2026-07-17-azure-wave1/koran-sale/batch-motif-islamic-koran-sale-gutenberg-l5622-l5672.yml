canonical_text:
  quote: ''
  summary: 'The passage describes the Caaba and its surrounding enclosures, oratories,
    the Zemzem well, lamps, minarets, and the wider sacred territory of Mecca. It
    states that within the Harm certain acts are forbidden, including attacking an
    enemy, hunting, fowling, and cutting a branch. It then reports Muslim traditions
    about the antiquity of the Caaba: Adam, after expulsion from paradise, asked God
    for a building like the heavenly house he had seen, and God set a representation
    of that house in Mecca beneath its celestial original. Footnotes mention traditions
    about sacred pigeons connected with a cave refuge and about the heavenly house
    being taken back to heaven at the Flood.'
  language: English
  quote_policy: summarized
