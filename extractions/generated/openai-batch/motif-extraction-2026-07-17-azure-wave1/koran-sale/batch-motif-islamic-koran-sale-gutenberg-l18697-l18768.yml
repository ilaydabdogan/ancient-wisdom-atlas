  summary: The passage promises paradise to penitent and observant believers; forbids
    the prophet and believers to pray for idolaters once their hell-status is known;
    cites Abraham withdrawing from his father after learning he was an enemy of God;
    affirms God's knowledge, sovereignty over heaven and earth, and power over life
    and death; and describes divine reconciliation with the prophet's followers and
    with three men left behind after distress and repentance. The included notes explain
    proposed occasions and the hardship of the expedition to Tabuc.
