  summary: The passage combines translator commentary and Qur'anic ethical instruction.
    It notes Jewish opposition to Mohammed and punishment, gives explanatory anecdotes
    about Adam and about Mohammed, Sawda, and an escaped captive, explains bird omens
    and metaphorical phrases, and then presents commands concerning the life to come,
    exclusive worship of God, kindness to parents, charity to kin, poor, and travellers,
    moderation in spending, divine provision, prohibitions against child-killing,
    fornication, and unjust killing, and regulated satisfaction for homicide.
  language: English
