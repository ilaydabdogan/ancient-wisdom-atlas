canonical_text:
  quote: ''
  summary: 'The passage recounts Moses returning angrily to his people after the calf
    episode, his confrontation with Aaron, his prayer for forgiveness, divine judgment
    and mercy, the tablets, the choosing of seventy men for the mountain, and divine
    statements about punishment, mercy, and the illiterate prophet. It then recalls
    traditions of Moses’ people: truthful guidance among them, division into twelve
    tribes, water from the rock, clouds, manna and quails, a command to enter a city
    humbly, punishment for changing the command, and a Sabbath trial at a sea-city
    in which warners are delivered and transgressors punished.'
