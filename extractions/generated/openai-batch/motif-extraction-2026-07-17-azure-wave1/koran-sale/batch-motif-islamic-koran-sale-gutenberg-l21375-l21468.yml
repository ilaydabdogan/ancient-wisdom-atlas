canonical_text:
  quote: ''
  summary: The passage describes God as creator and provider through water, fruits,
    ships, rivers, celestial bodies, and time. Abraham prays for a secure land, for
    his descendants to avoid idols, for offspring settled near the holy house in an
    unfruitful valley, for prayer, gratitude, and forgiveness. Translator notes identify
    the land with Mecca and the valley descendants with Ismael and his posterity,
    and mention Zemzem and the Caaba. The passage then warns that punishment of the
    ungodly is deferred until a day of judgment, when an angel calls, the unjust plead
    for respite, former destroyed peoples serve as examples, the earth and heavens
    are changed, people come from graves, and the wicked are fettered and burned while
    God takes account.
  language: English
  quote_policy: summarized
