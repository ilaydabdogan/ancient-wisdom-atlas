canonical_text:
  quote: ''
  summary: Shoaib is sent to Madiant and exhorts the people to worship God alone,
    use full measure and just weight, avoid corruption, and stop obstructing and threatening
    others. Proud chiefs threaten Shoaib and his followers with expulsion or forced
    return to their religion. Shoaib refuses, trusts God, and asks God to judge. The
    unbelieving chiefs warn that Shoaib's followers will perish, but a storm from
    heaven strikes the rejecters, who are found dead in their dwellings. The passage
    then generalizes that cities receiving prophets are tested with adversity and
    prosperity before sudden divine vengeance.
  language: English
  quote_policy: summarized
