canonical_text:
  quote: ''
  summary: The passage recounts part of Noah's flood narrative. When water issues
    from the oven, God commands Noah to load the ark with animal pairs, his family
    except those already sentenced to destruction, and the believers. Noah invokes
    God's name as the ark moves and stops. The ark rides amid waves; Noah calls to
    a separated son, who refuses boarding and seeks refuge on a mountain. Noah says
    there is no security from God's decree except divine mercy, and a wave separates
    them, drowning the son. The accompanying notes discuss interpretations of the
    oven, animal pairs, saved persons, ark motion, ark dimensions and stories, and
    parallels or comparisons in rabbinic, Persian, Jewish/Christian, Mosaic, and Eastern
    Christian traditions.
  language: English
