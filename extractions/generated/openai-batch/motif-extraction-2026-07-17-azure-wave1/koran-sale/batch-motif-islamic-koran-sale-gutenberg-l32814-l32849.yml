  summary: The passage describes condemned people beholding punishment and hell fire,
    lacking protectors or refuge on the day of resurrection, and desiring return.
    It states that the preacher's duty is only to preach, describes human responses
    to mercy and evil, affirms God's sovereignty over heaven, earth, creation, offspring,
    and childlessness, and describes modes of divine speech through revelation, veil,
    or messenger. The revealed book is called a light that directs servants to the
    right way, and all things return to God.
