  summary: Jacob's sons enter the city under his command; Joseph receives Benjamin,
    reveals himself privately to him, places the prince's cup in Benjamin's sack,
    and arranges a theft accusation and search. The brothers accept a bondman penalty
    for the one in whose sack the cup is found, allowing Benjamin to be retained by
    a stratagem described as enabled by God. The notes explain the cup, differing
    theft laws, and traditions about earlier accusations of theft against Joseph.
