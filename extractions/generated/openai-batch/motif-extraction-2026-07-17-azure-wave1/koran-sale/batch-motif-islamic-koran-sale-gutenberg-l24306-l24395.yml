  summary: The passage opens Chapter XX with an address about the Koran as admonition
    from the creator and then begins the history of Moses. Moses sees fire, approaches
    it, is called by God in the sacred valley Towa, receives commands about worship
    and the coming Hour, is given miraculous signs involving his rod and hand, and
    is sent to Pharaoh. Moses asks for aid from his brother Aaron, and God grants
    the request.
