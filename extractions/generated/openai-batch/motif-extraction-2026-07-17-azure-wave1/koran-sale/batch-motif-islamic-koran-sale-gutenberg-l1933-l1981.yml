canonical_text:
  quote: ''
  summary: 'The passage presents an antiquarian account of the Arabic language: its
    ancient origin after or at Babel, its dialects, its relation to Syriac and Hebrew,
    and the status of the Koreish dialect as the language of the Koran. It attributes
    the refinement of the Koreish dialect to the Caaba and Mecca as a regional religious
    and social center, then summarizes claims about the late spread of writing, early
    scripts, and the development of Arabic characters.'
