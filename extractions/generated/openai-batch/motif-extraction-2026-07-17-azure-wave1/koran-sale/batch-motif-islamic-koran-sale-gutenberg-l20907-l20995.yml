canonical_text:
  quote: ''
  summary: Chapter XIII, entitled “Thunder,” opens by asserting the truth of the sent-down
    book, describes God’s ordering of heaven, earth, celestial bodies, terrain, water,
    vegetation, night and day, rebukes denial of resurrection, warns of collars and
    hell fire for unbelievers, states divine knowledge and angelic watching over humans,
    presents lightning, thunder, clouds, and thunderbolts as under God’s power, rejects
    idols as ineffective, and concludes that all in heaven and earth worship God and
    that God is the sole creator.
  language: English
  quote_policy: summarized
