literal_observations:
- id: obs:1
  text: The commentators say the sons of Jacob abused and beat Joseph in the field,
    and that Judah prevented them from killing him by invoking their promise to cast
    him into a well instead.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Joseph's brothers lower him into the well, bind him, remove his inner garment
    to stain it with blood, mock him with the eleven stars, sun, and moon, and let
    him fall to the bottom.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: At the bottom of the well, Joseph stands weeping on a stone, and Gabriel comes
    to him with a revelation.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: The commentary says Joseph was seventeen and compares his early divine communication
    with that of John the Baptist and Jesus.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The commentators say Gabriel clothed Joseph in the well with a silk garment
    of paradise that had earlier been given to Abraham and later kept by Jacob in
    an amulet around Joseph's neck.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Jacob suspects deception because the garment brought to him is bloody but
    not torn.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: A caravan traveling from Midian to Egypt rests near the well, and a water-drawer
