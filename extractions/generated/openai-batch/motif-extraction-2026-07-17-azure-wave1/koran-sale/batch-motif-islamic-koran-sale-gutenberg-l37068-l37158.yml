canonical_text:
  quote: ''
  summary: Chapter LXXII reports that a company of genii heard the Koran, judged it
    an admirable discourse leading to right direction, and professed belief in the
    Lord without associating other gods. The genii describe divisions among themselves,
    failed attempts to listen in heaven because of angelic guards and flames, warnings
    of hellfire for those who swerve, promised rain for those who follow truth, exclusive
    worship of God, the servant of God invoking him while genii crowd near, and the
    apostle's limited role as publisher of divine revelation. The closing verses state
    that God alone knows futurity and discloses secrets only to a favored apostle
    guarded by angels.
  language: English
  quote_policy: summarized
