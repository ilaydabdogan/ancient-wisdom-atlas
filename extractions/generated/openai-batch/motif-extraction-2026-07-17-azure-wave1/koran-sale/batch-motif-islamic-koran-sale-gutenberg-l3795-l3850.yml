  quote: ''
  summary: 'The passage describes Islamic beliefs about angels: their purity, fiery
    creation, lack of eating, drinking, sex, and reproduction, and their offices of
    worship, praise, intercession, recording human actions, and carrying God’s throne.
    It names Gabriel, Michael, Azral, and Israfil with specific offices, mentions
    guardian angels assigned to each person, compares these doctrines with Jewish
    and Persian angelologies, and recounts the fall of Eblis/Azazil for refusing homage
    to Adam.'
