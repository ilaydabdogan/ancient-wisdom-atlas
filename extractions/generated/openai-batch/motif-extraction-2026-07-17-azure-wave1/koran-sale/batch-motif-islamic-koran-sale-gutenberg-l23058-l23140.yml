  summary: The passage contains Sale's notes on intercession, death and resurrection,
    Muhammad's departure and refuge, the cleansing of idols in Mecca, and the question
    of the spirit or soul. The translated verses report demands for miraculous proof,
    including water, gardens, a falling heaven, divine or angelic witnesses, gold,
