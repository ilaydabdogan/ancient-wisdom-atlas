canonical_text:
  quote: ''
  summary: The passage opens Chapter XXVIII as a truthful account of Moses and Pharaoh.
    Pharaoh oppresses a weakened group in Egypt by killing male children and sparing
    females. God intends to favor the weakened, defeat Pharaoh, Haman, and their forces,
    and directs Moses' mother to suckle him and cast him into the river if afraid,
    promising his return and apostleship. Moses is placed in an ark, taken up by Pharaoh's
    family, spared by Pharaoh's wife, watched by his sister, refuses other nurses,
    and is restored to his mother.
  language: English
