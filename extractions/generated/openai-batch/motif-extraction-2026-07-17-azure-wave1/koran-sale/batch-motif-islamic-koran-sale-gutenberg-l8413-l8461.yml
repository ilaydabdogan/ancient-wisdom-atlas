canonical_text:
  quote: ''
  summary: The passage recounts the career and death of Hakem Ebn Hashem, called al
    Mokanna, who claimed prophecy and divine indwelling, used a veil or gilded mask,
    staged an apparent moon rising from a well, gathered followers, resisted the caliph's
    army in a fortress, killed his household and companions with poisoned wine, burned
    their bodies and goods, destroyed himself, and left followers expecting his soul
    to return in another form.
