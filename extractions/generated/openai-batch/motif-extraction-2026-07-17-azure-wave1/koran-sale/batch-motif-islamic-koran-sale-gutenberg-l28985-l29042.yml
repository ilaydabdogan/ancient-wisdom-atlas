canonical_text:
  quote: ''
  summary: The passage presents divine signs in creation, human diversity, sleep,
    provision, lightning, rain, the reviving of dead earth, and the stability of heaven
    and earth. It states that God will call humans out of the earth, that God creates
    and restores life, rejects associating partners with God through a comparison
    from human ownership, commands adherence to true religion and prayer, criticizes
    sectarian division, and describes people calling on the Lord in adversity but
    associating other deities after mercy.
  language: English
  quote_policy: summarized
