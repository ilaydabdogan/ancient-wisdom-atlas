canonical_text:
  quote: ''
  summary: The passage opens with oaths by angelic beings who take souls, carry commands,
    usher the righteous, and govern affairs. It describes trumpet blasts, resurrection,
    fear on the day of return, and the skeptics' question about being raised after
    becoming bones. It recalls Moses being sent to Pharaoh, Moses showing the sign
    of the rod becoming a serpent, Pharaoh's denial and self-exaltation, and God's
    punishment of him. It then describes God's construction of heaven, ordering of
    night and light, spreading of earth, production of water and pasture, and establishment
    of mountains. The passage concludes with the great day of judgment, hell and paradise
    as outcomes, and the declaration that knowledge of the Last Hour belongs to God
    while the addressee is only a warner.
  language: English
  quote_policy: summarized
