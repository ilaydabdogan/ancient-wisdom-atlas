canonical_text:
  quote: ''
  summary: The passage gives rules for honoring covenants with faithful idolaters,
    fighting those whose protected months have elapsed or who violate oaths, granting
    safe-conduct to an idolater who seeks to hear God's word, and distinguishing proper
    temple visitation and religious merit. It promises divine punishment of enemies,
    victory and healing for believers, hell fire for infidelity, and gardens for believers
    who fled and devoted their substance and persons. It warns believers not to prefer
    kin, wealth, trade, or dwellings over God, his apostle, and religion, and recalls
    the battle of Honein where numbers did not help and retreat followed.
  language: English
  quote_policy: summarized
literal_observations:
