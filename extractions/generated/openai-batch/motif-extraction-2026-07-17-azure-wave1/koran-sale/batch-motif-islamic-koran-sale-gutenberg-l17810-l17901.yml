- id: obs:2
  text: After the months in which attack is not allowed have passed, the addressed
    believers are commanded to kill, capture, besiege, and lie in wait for idolaters,
    but to dismiss them freely if they repent, pray at appointed times, and pay legal
    alms.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: If an idolater demands protection, the addressee is commanded to grant protection
    so that he may hear the word of God and then reach a place of security.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Those with whom a league was made at the holy temple are excepted so long
