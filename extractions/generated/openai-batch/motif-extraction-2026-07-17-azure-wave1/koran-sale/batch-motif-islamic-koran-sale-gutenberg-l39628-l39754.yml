  - ev:8
  - ev:18
  confidence: medium
  cautions: The passage is an index, so it does not narrate the ascent episodes in
    full.
- id: motif:2
  label: Afterlife reward and punishment
  taxonomy_refs:
  - divine_judgment
  - afterlife_journey_map
  basis: Believers are assigned reward and sentence, the blessed have future happiness,
    and unbelievers or the damned receive collars and drink in the life to come.
  evidence_refs:
  - ev:9
  - ev:10
  - ev:22
  confidence: high
  cautions: Specific geography of the afterlife is only lightly represented by the
    index entries.
- id: motif:3
  label: Revival through a sacrificed animal
  taxonomy_refs:
  - resurrection
  - sacrifice
  - death_rebirth
  basis: A dead body is raised to life by a part of the sacrificed cow.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The causal sequence is compressed into an index entry.
- id: motif:4
  label: Sibling killing after sacrifices
