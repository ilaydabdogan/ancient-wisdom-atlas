canonical_text:
  quote: ''
  summary: The passage describes divine judgment against idolaters and rejecters of
    signs, the failure of imagined divine companions to protect them, the threat of
    hell fire, the sending of messengers with tidings and threats, destruction of
    former unjust cities after warning, and the beginning of Moses' journey with Joshua
    to the meeting of the two seas where their fish is forgotten and enters the sea.
    Notes explain the journey as Moses' search for al Khedr and give interpretive
    traditions about the fish.
  language: English
