canonical_text:
  quote: ''
  summary: The passage summarizes several reported Muslim opinions about the whereabouts
    and condition of souls after death, including souls near graves, with Adam in
    the lowest heaven, in wells, in the resurrection trumpet, as white birds under
    God's throne, or confined in Sajn. It then describes debates about resurrection
    and the received view that body and soul will be raised, with the incorruptible
    al Ajb bone serving as the seed of bodily renewal through a divinely sent rain.
    It also notes Jewish parallels concerning souls under the throne and the bone
    Luz renewed by dew.
  language: English
  quote_policy: summarized
