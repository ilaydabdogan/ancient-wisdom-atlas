canonical_text:
  quote: ''
  summary: 'The passage describes oaths and alliances connected with Mohammed''s supporters
    from Medina: an oath of renunciation and obedience, the sending of Masb Ebn Omair
    to instruct converts, the spread of Islam in Medina, a later night meeting at
    al Akaba where Medinan supporters offer protection, Mohammed''s reciprocal pledge,
    the promise of Paradise to those killed in his cause, the appointment of twelve
    representatives, and the author''s claim that before this second oath Mohammed''s
    religion spread by persuasion rather than compulsion.'
