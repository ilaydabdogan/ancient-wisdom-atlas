canonical_text:
  quote: ''
  summary: 'The passage describes elements of the final judgment: a body blames the
    soul for its actions; God answers with a parable of a blind man and a lame man
    jointly punished for taking fruit from a garden; witnesses will testify against
    denial; the trial is described as swift; each person receives a written account
    of deeds; and a vast balance held by Gabriel weighs all things, with its scales
    over paradise and hell.'
  language: English
