  summary: The passage recalls several righteous figures and divine responses to supplication,
    including deliverance from affliction, the granting of John to Zacharias, and
    Mary and her son as a sign. It then turns to religious unity and accountability,
    the opening for Gog and Magog, punishment of idolaters in hell, protection and
    felicity for the rewarded, the rolling up of the heavens and resurrection, the
    inheritance of the earth by the righteous, and Mohammed's proclamation of one
    God and appeal for divine judgment.
