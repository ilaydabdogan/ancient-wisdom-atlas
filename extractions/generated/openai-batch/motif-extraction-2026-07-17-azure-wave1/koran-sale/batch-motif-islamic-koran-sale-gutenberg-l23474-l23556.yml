canonical_text:
  quote: ''
  summary: The passage contains an admonitory garden episode in which a companion
    urges acknowledgment of God's will and warns that God can destroy a garden or
    make its water inaccessible; the garden owner's possessions are destroyed and
    he regrets associating another deity with the Lord. It then gives a similitude
    of present life as rain-fed vegetation that becomes dry stubble, contrasts wealth
    and children with lasting good works, describes an eschatological gathering and
    accounting by a book of deeds, and recalls the command to the angels to worship
    Adam, with Eblis refusing as one of the genii and being identified as an enemy
    with his offspring.
  language: English
  quote_policy: summarized
