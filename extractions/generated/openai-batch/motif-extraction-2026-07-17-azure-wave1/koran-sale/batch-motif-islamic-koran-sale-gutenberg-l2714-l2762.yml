canonical_text:
  quote: ''
  summary: 'The passage narrates early events in Mohammed''s mission: followers flee
    to Ethiopia and receive protection from the Najshi; Hamza and Omar convert; the
    Koreish make a written covenant of social exclusion against the Hashemites and
    family of al Motalleb; Mohammed reports that God has shown disapproval by sending
    a worm to destroy the covenant text except God''s name, after which the covenant
    is annulled; Abu Tleb and Khadjah die in what is called the year of mourning,
    and Koreish hostility increases.'
  language: English
  quote_policy: summarized
