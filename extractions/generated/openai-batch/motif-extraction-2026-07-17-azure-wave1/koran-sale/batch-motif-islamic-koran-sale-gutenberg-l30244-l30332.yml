canonical_text:
  quote: ''
  summary: The passage recounts Solomon's death being disclosed when an earth-creature
    gnaws his staff and his body falls, revealing to the genii that they did not know
    hidden things. It then recounts the descendants of Saba, who had two fruitful
    gardens and safe travel between nearby cities, but turned aside from command,
    were punished by the inundation of al Arem, had their gardens changed to bitter
    growth, requested longer journeys, and were dispersed. Sale's notes add explanatory
    traditions about Solomon, the temple, the worm, the dam or reservoir of Saba,
    and the later dispersal of Sabaean tribes.
  language: English
  quote_policy: summarized
