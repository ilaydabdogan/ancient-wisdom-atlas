canonical_text:
  quote: Enter, O people of Pharaoh, into a most severe torment.
  summary: The passage describes punishment in hell fire, disputes among condemned
    unbelievers, an appeal to the keepers of hell, divine judgment on the last hour,
    aid for apostles and believers, Mosaic guidance given to Israel, instruction to
    the prophet, and signs of God in creation, night, and day.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: The people of Pharaoh are exposed to hell fire morning and evening and are
    ordered, when the hour of judgment comes, to enter severe torment.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Condemned infidels dispute in hell fire; the weak say they followed the arrogant
    and ask whether the arrogant can relieve them from any part of the fire.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those described as arrogant answer that all are doomed to suffer there because
    God has judged between his servants.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those in the fire ask the keepers of hell to call on their Lord to ease the
    punishment for one day.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The keepers of hell ask whether apostles had come with evident proofs; after
    the condemned answer yes, the keepers say to call on God, but the calling of unbelievers
    is vain.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: God promises assistance to apostles and believers in present life and on the
    day when witnesses stand forth.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: On that day, excuses of unbelievers do not avail them; a curse and a wretched
    abode attend them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: Moses is given direction, and the book of the law is left as an inheritance
    to the children of Israel as direction and admonition.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: The prophet is instructed to bear insults with patience, ask pardon, and celebrate
    the Lord’s praise in evening and morning.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:10
  text: Those who impugn God’s signs without revealed proof are described as having
    pride in their breasts and as not attaining their desire.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The creation of heaven and earth is said to be greater than the creation of
    man, and blind and seeing are not held equal, nor are righteous believers and
    evildoers.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The last hour is said surely to come; the Lord says to call upon him and that
    those who proudly disdain his service will enter hell with ignominy.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:13
  text: God is said to appoint night for rest and day for light, and is identified
    as Lord, Creator of all things, and the only God.
  category: attribute
  evidence_refs:
  - ev:9
