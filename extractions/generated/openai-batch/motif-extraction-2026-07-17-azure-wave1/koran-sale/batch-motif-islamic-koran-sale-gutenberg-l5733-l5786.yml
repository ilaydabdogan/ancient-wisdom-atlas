literal_observations:
- id: obs:1
  text: A stone kept for twenty-two years was sent back after it failed to draw pilgrims
    away from Mecca; its devotees were told it was not the true stone, but it was
    said to be proven genuine by its ability to swim on water.
  category: sequence
  evidence_refs:
  - ev:1
