  text: A stone in Abraham's place is said to show Abraham's footsteps and to have
    been stood on by him when he built the Caaba.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: One tradition says the stone served Abraham as a scaffold that rose and fell
    by itself; another says he stood on it while the wife of Ismael washed his head.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: The stone in Abraham's place is enclosed in an iron chest; pilgrims drink
    Zemzem water there and are ordered to pray at it, and temple officers hid it when
    the Karmatians took the other stone.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The well of Zemzem is on the east side of the Caaba and is covered with a
    small building and cupola.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:6
  text: The Zemzem spring is identified as the spring that gushed out for Ismael's
    relief while Hagar wandered with him in the desert.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:7
  text: The name Zemzem is explained either from Hagar's call meaning "Stay, stay"
