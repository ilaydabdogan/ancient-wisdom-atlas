canonical_text:
  quote: ''
  summary: 'The passage describes sacred objects and practices connected with the
    Meccan temple: a returned stone whose authenticity is associated with floating
    on water; the stone in Abraham''s place with alleged footprints and ritual use;
    the well of Zemzem as a holy spring connected with Hagar and Ismael; the obligation
    of pilgrimage; and the ritual clothing and restrictions observed by pilgrims entering
    the sacred territory.'
  language: English
