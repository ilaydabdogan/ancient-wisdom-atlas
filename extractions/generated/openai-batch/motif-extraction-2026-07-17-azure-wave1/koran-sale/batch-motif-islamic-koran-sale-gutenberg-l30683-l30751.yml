canonical_text:
  quote: ''
  summary: The opening of Chapter XXXVI, Y. S., swears by the instructive Koran, identifies
    the addressee as one of God's messengers sent to show the right way and warn a
    negligent people, describes many as unable to believe or see because of yokes,
    bars, and darkness, promises mercy and reward to the one who follows admonition
    and fears the Merciful in secret, states that God will restore the dead and record
    works and footsteps in a plain register, and introduces the inhabitants of Antioch
    as an example involving apostles of Jesus. Sale's notes add explanations and narrative
    commentary about the mysterious letters, Mohammed's escape from assassins, and
    a story of disciples sent to Antioch.
  language: English
  quote_policy: summarized
