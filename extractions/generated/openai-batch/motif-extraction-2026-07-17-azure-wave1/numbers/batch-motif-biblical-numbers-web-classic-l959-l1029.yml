canonical_text:
  quote: ''
  summary: The people complain; Yahweh’s fire burns among them until Moses intercedes.
    The people crave meat and remember Egypt’s foods while despising manna. Moses
    protests that the burden of the people is too heavy. Yahweh appoints seventy elders
    to share Moses’s Spirit and burden, and some prophesy. Yahweh promises excessive
    meat, sends quails by a wind from the sea, and then strikes the people with a
    plague while they eat. Place names explain the fire and the burial of those who
    lusted.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The people complain in Yahweh’s hearing; Yahweh’s anger burns, and Yahweh’s
    fire burns among them and consumes some of the camp outskirts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The people cry to Moses; Moses prays to Yahweh, and the fire abates.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The place is named Taberah because Yahweh’s fire burned among the people there.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:4
  text: The mixed multitude lusts exceedingly, and the children of Israel weep, ask
    for meat, remember foods eaten in Egypt, and complain that only manna is present.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: Manna is described as like coriander seed and bdellium in appearance; the
    people gather, grind, beat, boil, and make cakes from it, and it falls with dew
    at night.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Moses hears the people weeping by families, is displeased, and tells Yahweh
    that the burden of the people is too heavy for him alone; he asks to be killed
    rather than see his wretchedness.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Yahweh instructs Moses to gather seventy elders at the Tent of Meeting and
    says he will put some of the Spirit on Moses upon them so they can bear the people’s
    burden with him.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: Yahweh tells Moses that the people will eat meat for a whole month until it
    becomes loathsome, because they rejected Yahweh and wished they had not come out
    of Egypt.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: Yahweh comes down in the cloud, speaks to Moses, takes of the Spirit on him,
    puts it on the seventy elders, and the elders prophesy once.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: Eldad and Medad remain in the camp, receive the Spirit, and prophesy there;
    after a report, Joshua asks Moses to forbid them, but Moses says he wishes all
    Yahweh’s people were prophets.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: A wind from Yahweh brings quails from the sea and lets them fall around the
    camp; the people gather them through the day, night, and next day, and spread
    them around the camp.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: While the meat is still between the people’s teeth, Yahweh strikes them with
