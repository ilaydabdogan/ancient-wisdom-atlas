canonical_text:
  quote: ''
  summary: The passage introduces the rebellion of Korah, Dathan, Abiram, On, and
    two hundred fifty leaders against Moses and Aaron. Moses proposes a censer-and-incense
    test before Yahweh. Dathan and Abiram refuse Moses’ summons. Yahweh’s glory appears,
    the congregation is warned to separate from the rebels’ tents, the earth opens
    and swallows the accused households and goods alive into Sheol, divine fire consumes
    the two hundred fifty incense offerers, and Eleazar retrieves their bronze censers
    to be made into an altar covering and sign.
