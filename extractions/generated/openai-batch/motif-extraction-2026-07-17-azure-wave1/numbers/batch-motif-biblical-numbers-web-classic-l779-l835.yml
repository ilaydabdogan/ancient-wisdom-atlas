  quote: ''
  summary: The range begins with a footnote defining a shekel. Chapter 8 reports Yahweh
    instructing Moses about Aaron lighting seven lamps before the lamp stand, describes
    the beaten-gold lamp stand made according to the pattern shown to Moses, and gives
    commands for cleansing, presenting, offering, separating, and assigning the Levites
    for service in the Tent of Meeting. Moses, Aaron, and the congregation carry out
    the commands, and age limits for Levite service are stated.
