canonical_text:
  quote: ''
  summary: After a plague, Yahweh commands Moses and Eleazar to take a census of Israelite
    men twenty years old and upward who are able to go to war. The passage lists Israelite
    families and tribal counts. In the Reubenite genealogy it recalls Dathan, Abiram,
    Korah, and their company, who rebelled and were destroyed when the earth swallowed
    them and fire devoured two hundred fifty men; the sons of Korah did not die. The
    passage also notes deaths in Judah’s line and names daughters in the lines of
    Zelophehad and Asher.
  language: English
  quote_policy: summarized
