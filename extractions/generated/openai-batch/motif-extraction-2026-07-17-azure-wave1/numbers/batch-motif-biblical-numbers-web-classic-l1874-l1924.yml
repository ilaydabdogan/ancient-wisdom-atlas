canonical_text:
  quote: ''
  summary: Balaam, seeing that Yahweh favors blessing Israel, turns from divination,
    looks toward Israel, and speaks oracles under the Spirit of God. He blesses Israel
    with images of flourishing waters and trees, royal exaltation, animal strength,
    and protection from curse. Balak angrily dismisses him for blessing instead of
    cursing. Balaam replies that he can only speak Yahweh’s word, then gives further
    oracles about a future star and scepter from Jacob, Israel’s dominion, and the
    destruction, captivity, or affliction of several neighboring peoples. Balaam and
    Balak then depart.
  language: English
  quote_policy: summarized
