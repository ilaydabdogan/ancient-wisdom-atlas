canonical_text:
  quote: ''
  summary: A footnote defines the cubit. In Numbers 36, leaders from the Gilead-Manasseh-Joseph
    lineage ask Moses and Israelite princes about the inheritance of Zelophehad’s
    daughters, fearing that marriage into another tribe would transfer land from their
    ancestral tribe. Moses, speaking according to Yahweh’s command, rules that the
    daughters may marry whom they choose, but only within their father’s tribal family,
    so tribal inheritances do not move between tribes. The daughters obey by marrying
    their father’s brothers’ sons, and their inheritance remains in Manasseh. The
    chapter closes by identifying these as commandments and ordinances given by Yahweh
    through Moses in the plains of Moab by the Jordan at Jericho.
  language: English
  quote_policy: summarized
