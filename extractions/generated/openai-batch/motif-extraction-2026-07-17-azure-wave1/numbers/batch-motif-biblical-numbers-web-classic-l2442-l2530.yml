canonical_text:
  quote: ''
  summary: A footnote explains the weight of shekels. In Numbers 32, the children
    of Reuben and Gad ask Moses, Eleazar, and the leaders for the livestock-suitable
    lands of Jazer and Gilead east of the Jordan. Moses warns that refusing to cross
    may discourage Israel as the earlier generation did at Kadesh Barnea, provoking
    Yahweh's anger and wilderness wandering. Reuben and Gad propose to leave families
    and livestock in fortified cities while their armed men cross before Israel until
    all receive their inheritance. Moses accepts on condition that they pass over
    armed before Yahweh; if they fail, they sin and will lose the eastern possession.
    Moses then assigns Gilead and former Amorite kingdoms to Gad, Reuben, and the
    half-tribe of Manasseh, after which cities are built, taken, and renamed.
  language: English
  quote_policy: summarized
