canonical_text:
  quote: ''
  summary: The line range opens with a footnote on the Hebrew term rendered “God”
    at Numbers 6:7, then begins Numbers 7. After Moses has set up, anointed, and sanctified
    the tabernacle and altar, Israelite tribal princes bring wagons and oxen before
    Yahweh. Yahweh instructs Moses to accept these for the Tent of Meeting service
    and assign them to Levite groups according to their duties. The passage then describes
    daily offerings by tribal princes for the dedication of the altar, listing offerings
    for the first through sixth days and beginning the seventh day with Elishama of
    Ephraim.
