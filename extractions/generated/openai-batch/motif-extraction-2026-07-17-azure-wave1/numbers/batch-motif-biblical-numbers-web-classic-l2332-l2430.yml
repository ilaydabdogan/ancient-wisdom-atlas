canonical_text:
  quote: ''
  summary: Yahweh commands Moses to avenge Israel on Midian before Moses is gathered
    to his people. Moses sends twelve thousand armed men with Phinehas, sanctuary
    vessels, and alarm trumpets. Israel defeats Midian, kills males, kings, and Balaam,
    takes captives and plunder, and burns cities and encampments. Moses rebukes the
    officers over the surviving women, orders further killing and captivity distinctions,
    and commands purification outside the camp. Eleazar gives rules for purifying
    materials by fire and water. Yahweh commands the plunder to be counted, divided,
    and apportioned as tribute to Eleazar and the Levites. Officers later report that
    none of the men of war is missing.
  language: English
  quote_policy: summarized
