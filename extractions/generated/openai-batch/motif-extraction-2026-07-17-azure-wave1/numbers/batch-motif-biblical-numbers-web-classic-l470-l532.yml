canonical_text:
  quote: ''
  summary: Yahweh gives Moses instructions for removing ritually unclean persons from
    the camp, for confession and restitution with priestly portions, and for a priestly
    jealousy ritual in which a suspected wife is set before Yahweh, given an oath,
    and made to drink water mixed with tabernacle dust and written curses, with different
    outcomes for guilt or cleanness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Yahweh commands that persons with leprosy, discharges, or corpse-related uncleanness
    be put outside the camp so that the camp where he dwells is not defiled.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The children of Israel put the specified unclean persons outside the camp
    as Yahweh spoke to Moses.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: A guilty man or woman is instructed to confess the sin and make full restitution,
    adding a fifth part, to the person wronged.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If there is no kinsman to receive restitution, the restitution belongs to
    Yahweh and is the priest’s, in addition to a ram of atonement.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: Heave offerings and holy things presented by the children of Israel to the
    priest are assigned to the priest.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: The jealousy law addresses a case where a wife is suspected of hidden sexual
    unfaithfulness without witness or being taken in the act, and a spirit of jealousy
    comes on her husband.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The husband is instructed to bring his wife to the priest with one tenth of
    an ephah of barley meal, without oil or frankincense, as a jealousy and memorial
    meal offering.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The priest sets the woman before Yahweh and prepares holy water in an earthen
    vessel with dust from the floor of the tabernacle.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The priest lets the woman’s hair go loose, places the memorial meal offering
    in her hands, and holds the water of bitterness that brings a curse.
  category: action
  evidence_refs:
  - ev:5
- id: obs:10
  text: The priest administers an oath that distinguishes the condition of no adultery
    from the condition of going astray and being defiled.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: The oath of cursing names Yahweh and describes the woman’s body swelling and
    thigh falling away if the curse applies; the woman answers, “Amen, Amen.”
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: The priest writes the curses in a book, wipes them into the water of bitterness,
    and makes the woman drink the water.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The priest takes the jealousy meal offering from the woman, waves it before
    Yahweh, brings it to the altar, and burns a memorial handful before making the
    woman drink the water.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:14
  text: If the woman is defiled, the water becomes bitter in her and produces the
