canonical_text:
  quote: ''
  summary: The passage first gives footnotes defining terms from chapter 11, including
    place-name meanings and measures. Chapter 12 narrates Miriam and Aaron speaking
    against Moses because of his Cushite wife and questioning whether Yahweh has spoken
    only with Moses. Yahweh summons Moses, Aaron, and Miriam to the Tent of Meeting,
    descends in a pillar of cloud, and declares Moses uniquely faithful and directly
    addressed. Yahweh’s anger burns; after the cloud departs, Miriam is leprous. Aaron
    pleads with Moses, Moses asks Yahweh to heal her, and Yahweh orders Miriam shut
    outside the camp for seven days before being brought in again. The people wait
    for her before traveling from Hazeroth to the wilderness of Paran.
  language: English
  quote_policy: summarized
