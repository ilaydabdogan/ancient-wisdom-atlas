canonical_text:
  quote: ''
  summary: The daughters of Zelophehad petition Moses, Eleazar, the princes, and the
    congregation for inheritance because their father died without sons. Moses brings
    their case before Yahweh, who rules that their claim is right and gives a broader
    inheritance ordinance. Yahweh then tells Moses to ascend Mount Abarim, see the
    land, and afterward be gathered to his people because of the earlier rebellion
    at the waters of Meribah. Moses asks Yahweh to appoint a leader for the congregation.
    Yahweh designates Joshua son of Nun, commands Moses to lay his hand on him, set
    him before Eleazar and the congregation, give him authority, and have Eleazar
    inquire by the Urim. Moses obeys and commissions Joshua publicly.
  language: English
  quote_policy: summarized
