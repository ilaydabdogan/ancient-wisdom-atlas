canonical_text:
  quote: ''
  summary: In Numbers 20, Israel stays at Kadesh in the wilderness of Zin, where Miriam
    dies and the congregation lacks water. The people quarrel with Moses and Aaron.
    Yahweh instructs Moses to take the rod and speak to the rock so it will provide
    water, but Moses strikes the rock twice; water comes out abundantly. Yahweh judges
    Moses and Aaron for failing to sanctify him before Israel and says they will not
    bring the assembly into the given land. Moses then requests passage through Edom,
    but Edom refuses and comes out against Israel, so Israel turns away. At Mount
    Hor, Yahweh commands that Aaron be brought up, stripped of his garments, and succeeded
    by Eleazar. Aaron dies on the mountain, and Israel mourns him thirty days.
  language: English
  quote_policy: summarized
