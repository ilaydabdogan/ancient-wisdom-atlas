candidate_motifs:
- id: motif:1
  label: collective rebellion at the threshold of promised land
  taxonomy_refs:
  - covenant
  basis: The congregation rejects the land, proposes return to Egypt, and is described
    as rebelling against Yahweh despite the land promise sworn to the fathers.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  confidence: medium
  cautions: The passage frames the issue through Yahweh’s oath and command, but the
    supplied taxonomy does not include a more specific 'promised land refusal' category.
- id: motif:2
  label: intercessor averts total destruction
  taxonomy_refs: []
  basis: Yahweh threatens pestilence and disinheritance, while Moses pleads for pardon
    on the basis of Yahweh’s reputation and loving kindness; Yahweh then says he has
    pardoned according to Moses’ word.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: The pardon does not remove all punishment; the adult generation remains
    under judgment.
- id: motif:3
  label: divine judgment through wilderness exclusion
  taxonomy_refs:
  - divine_judgment
  basis: Yahweh decrees that the adult complainers will die in the wilderness and
    not see the sworn land, while the children will wander forty years before entry.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: This is a legal-prophetic judgment scene within the narrative rather than
    a standalone mythic destruction episode.
- id: motif:4
  label: faithful remnant spared from collective punishment
  taxonomy_refs:
  - divine_judgment
  - covenant
  basis: Caleb is singled out as fully following Yahweh, Joshua and Caleb survive
    among the spies, and Caleb’s offspring are promised possession of the land.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: high
  cautions: The text names Caleb explicitly in the promise and names both Joshua and
    Caleb as survivors; their roles are related but not identical in this passage.
- id: motif:5
  label: day-for-year punitive wandering
  taxonomy_refs:
  - divine_judgment
  basis: Yahweh assigns forty years of wilderness wandering according to the forty
    days spent spying out the land, one year for each day.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The numerical correspondence is explicit, but wider symbolic meanings
    of forty are not supplied by this passage alone.
- id: motif:6
  label: proposed return to Egypt as rejection of the journey
  taxonomy_refs:
  - return
  basis: The congregation says it would be better to return to Egypt and proposes
    choosing a leader for that return.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage presents the proposed return negatively as rebellion; it is
    not a completed return narrative.
- id: motif:7
  label: divine guidance and presence by cloud and fire
  taxonomy_refs: []
  basis: Moses says Yahweh is among the people, with a cloud over them and pillars
    of cloud and fire before them by day and night.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The image is invoked in Moses’ speech rather than narrated as an action
    in this immediate scene.
- id: motif:8
  label: attempted ascent after judgment
  taxonomy_refs:
  - ascent
  basis: After hearing the judgment and mourning, the people go up to the top of the
    mountain saying they will go to the promised place because they have sinned.
  evidence_refs:
  - ev:10
  confidence: low
  cautions: The passage excerpt ends before the outcome of the attempted ascent; the
    ascent motif is literal and only partially represented here.
