canonical_text:
  quote: "“a land which flows with milk and honey”"
  summary: After the spies’ report, the Israelite congregation weeps, complains against
    Moses and Aaron, and proposes returning to Egypt. Joshua and Caleb urge trust
    in Yahweh and describe the land as good. The congregation threatens violence,
    Yahweh’s glory appears, and Yahweh threatens pestilence and disinheritance. Moses
    intercedes, appealing to Yahweh’s reputation among the nations and to Yahweh’s
    mercy. Yahweh pardons but decrees that the adult complainers will die in the wilderness,
    that the children will wander forty years and later enter the land, and that Caleb
    and Joshua will survive. The men who brought the evil report die by plague, the
    people mourn, and they begin an attempted ascent toward the promised place despite
    Moses’ warning.
  language: English
  quote_policy: quoted
