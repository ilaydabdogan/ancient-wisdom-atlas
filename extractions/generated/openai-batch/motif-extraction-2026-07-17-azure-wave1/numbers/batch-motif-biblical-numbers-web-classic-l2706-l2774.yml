canonical_text:
  quote: ''
  summary: Yahweh speaks to Moses in the plains of Moab and commands Israel to give
    cities and pasture lands to the Levites. Six of these cities are designated as
    cities of refuge for an unwitting killer. The passage distinguishes murder from
    accidental killing, assigns roles to the avenger of blood and the congregation,
    requires the manslayer to remain in the refuge city until the high priest’s death,
    regulates witnesses and ransom, and states that shed blood pollutes the land where
    Yahweh dwells among Israel.
  language: English
  quote_policy: summarized
