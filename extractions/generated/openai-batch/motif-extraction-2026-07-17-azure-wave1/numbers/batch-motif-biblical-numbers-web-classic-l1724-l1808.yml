candidate_motifs:
- id: motif:1
  label: Hired curse against a blessed people
  taxonomy_refs:
  - sacred_exchange
  basis: Balak sends envoys with rewards and later promises honor so Balaam will curse
    Israel, while God says the people are blessed and must not be cursed.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not narrate a completed payment; it presents the offered
    reward and requested curse.
- id: motif:2
  label: Seer constrained to speak only divine words
  taxonomy_refs: []
  basis: Balaam repeatedly states or is told that he must act and speak only according
    to the word of Yahweh/God or the angel’s instruction.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:9
  - ev:10
  confidence: high
  cautions: The term “seer” is inferred from Balaam’s function in the passage; the
    passage’s explicit emphasis is on speech constraint.
- id: motif:3
  label: Divine adversary blocks a journey
  taxonomy_refs:
  - divine_judgment
  basis: God’s anger burns when Balaam goes, and Yahweh’s angel stands in the way
    as an adversary because Balaam’s way is perverse.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: high
  cautions: The judgment functions as obstruction and warning rather than final punishment.
- id: motif:4
  label: Animal perceives hidden divine danger and receives speech
  taxonomy_refs: []
  basis: The donkey sees Yahweh’s angel before Balaam does, turns away three times,
