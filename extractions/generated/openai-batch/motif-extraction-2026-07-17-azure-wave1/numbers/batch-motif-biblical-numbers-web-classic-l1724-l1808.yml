canonical_text:
  quote: ''
  summary: A footnote explains the name Hormah as “destruction.” In Numbers 22:1-40,
    Israel camps in the plains of Moab. Balak king of Moab fears Israel and sends
    for Balaam to curse them. Balaam consults Yahweh/God, is forbidden to curse a
    blessed people, later receives conditional permission to go while speaking only
    God’s word, and travels on his donkey. Yahweh’s angel blocks the road; the donkey
    sees the angel, avoids him three times, is struck, and is given speech. Balaam’s
    eyes are opened, he sees the angel, confesses, and is again told to speak only
    the given word. Balaam reaches Balak, states his speech is constrained by God,
    and Balak sacrifices cattle and sheep.
  language: English
  quote_policy: summarized
