canonical_text:
  quote: ''
  summary: 'The passage gives brief footnotes from the previous chapter, then presents
    laws for a Nazirite vow: abstention from grape products, uncut hair, avoidance
    of corpse defilement, procedures after accidental defilement, offerings at completion,
    shaving and burning the hair of separation, and later permission to drink wine.
    It concludes with the priestly blessing over Israel and the placing of Yahweh’s
    name on the people.'
  language: English
  quote_policy: summarized
