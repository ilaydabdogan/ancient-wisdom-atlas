candidate_motifs:
- id: motif:1
  label: Conditional battle vow before divine deliverance
  taxonomy_refs:
  - sacred_exchange
  basis: Israel vows to Yahweh that if the enemy is delivered into its hand, Israel
    will utterly destroy their cities; Yahweh then listens and delivers the Canaanites.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The passage presents a vow and fulfillment, but it does not describe a
    formal covenant or sacrificial rite.
- id: motif:2
  label: Communal complaint followed by divine punishment
  taxonomy_refs:
  - divine_judgment
  basis: The people speak against God and Moses in the wilderness, and Yahweh sends
    venomous snakes that kill many Israelites.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: high
  cautions: The extraction stays at the narrative level and does not infer theological
    meaning beyond the stated sequence.
- id: motif:3
  label: Serpent as both affliction and healing sign
  taxonomy_refs:
  - serpent
  basis: Venomous serpents bite and kill the people, while a bronze serpent placed
    on a pole becomes the object that bitten people look at and live.
  evidence_refs:
  - ev:6
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage states the life-preserving effect of looking at the bronze
    serpent but does not explain the mechanism.
- id: motif:4
  label: Intercessory leader mediates relief after confession
  taxonomy_refs: []
  basis: The people confess wrongdoing and ask Moses to pray; Moses prays, and Yahweh
