  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: No external typological or later interpretive comparison is included.
- id: motif:5
  label: Water provision and well song in the wilderness
  taxonomy_refs:
  - water
  basis: At Beer, Yahweh promises to give water, and Israel sings to a well said to
    have been dug by leaders with scepter and poles.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage gives a brief song and itinerary notice rather than a detailed
    miracle narrative.
- id: motif:6
  label: Divinely assured victory over opposing kings and possession of land
  taxonomy_refs:
  - divine_judgment
  basis: Yahweh delivers the Canaanites at Hormah and later tells Moses not to fear
    Og because Og, his people, and land are delivered; Israel defeats enemies and
    possesses land.
  evidence_refs:
  - ev:3
  - ev:16
  - ev:19
  - ev:20
  confidence: medium
  cautions: Sihon’s defeat is narrated alongside divine-delivered victories, but the
    immediate verses on Sihon do not include a direct divine speech.
- id: motif:7
  label: Conquest imagined as devouring fire
  taxonomy_refs:
  - fire
  basis: The proverb says that fire and flame go out from Heshbon and the city of
    Sihon and devour Ar of Moab.
  evidence_refs:
