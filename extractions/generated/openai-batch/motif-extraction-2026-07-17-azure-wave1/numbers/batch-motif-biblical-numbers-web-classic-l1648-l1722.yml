  quote: ''
  summary: A footnote explains the meaning of Meribah. Numbers 21 recounts Israel’s
    conflict with the Canaanite king of Arad, a vow to Yahweh, destruction of Canaanite
    cities, discouragement in the wilderness, divine punishment by venomous snakes,
    Moses’ bronze serpent on a pole as a healing sign, itinerary notices including
    Beer and a well song, negotiations and war with Sihon, a proverb about Heshbon
    and Moab, and further victories at Jazer and against Og of Bashan.
  language: English
  quote_policy: summarized
