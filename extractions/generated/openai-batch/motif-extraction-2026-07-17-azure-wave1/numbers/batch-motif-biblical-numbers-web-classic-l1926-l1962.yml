canonical_text:
  quote: ''
  summary: Israel stays at Shittim and becomes involved with Moabite women and the
    worship of Baal Peor. Yahweh’s anger leads to commands for punishment and a plague.
    Phinehas kills an Israelite man and a Midianite woman, after which the plague
    stops. Yahweh grants Phinehas a covenant of peace and everlasting priesthood,
    then commands action against the Midianites for deception in the matter of Peor.
  language: English
