canonical_text:
  quote: ''
  summary: Yahweh commands Moses that Israel keep the Passover at its appointed time.
    Men made unclean by a dead body ask about exclusion, and Yahweh gives a provision
    for keeping Passover in the second month for those unclean or on a far journey,
    while warning that a clean non-traveler who fails to keep it is cut off. A foreigner
    living among Israel may keep Passover under the same statute. The tabernacle is
    covered by a cloud, with an appearance of fire by night; Israel encamps or travels
    according to the cloud and Yahweh’s command.
  language: English
  quote_policy: summarized
