canonical_text:
  quote: he shall not break his word
  summary: Numbers 30 states rules for vows and oaths made to Yahweh. A man’s vow
    stands. A young woman’s vow in her father’s house may stand or be voided depending
    on her father’s response. A married woman’s vow may stand or be voided depending
    on her husband’s response. A widow’s or divorced woman’s vow stands. The passage
    closes by identifying these as Yahweh’s statutes concerning husband and wife,
    father and daughter.
  language: English
  quote_policy: quoted
