  summary: Yahweh assigns Aaron, his sons, and the Levites responsibilities around
    the sanctuary and Tent of Meeting; restricts unauthorized approach; grants priestly
    and Levitical portions from offerings and tithes; defines firstborn redemption
    and sacrifice rules; and commands the Levites to offer a tithe of the tithe.
  language: English
  quote_policy: summarized
