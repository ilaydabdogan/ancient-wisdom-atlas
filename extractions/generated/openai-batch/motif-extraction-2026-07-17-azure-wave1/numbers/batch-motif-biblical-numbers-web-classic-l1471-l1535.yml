  text: Yahweh tells Aaron that Aaron, his sons, and his fathers’ house will bear
    responsibility for the iniquity of the sanctuary and priesthood.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The tribe of Levi is to be brought near and joined to Aaron to minister to
    him, while Aaron and his sons remain before the Tent of the Testimony.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:3
  text: The Levites are assigned duties for the Tent but are forbidden to come near
    the sanctuary vessels and altar, with death named as the consequence.
  category: action
  evidence_refs:
  - ev:1
- id: obs:4
  text: Aaron and his sons are to perform the duty of the sanctuary and altar so that
    wrath will not come again on the children of Israel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:5
  text: Yahweh describes the Levites as a gift to Aaron, dedicated to Yahweh for the
    service of the Tent of Meeting.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:6
  text: The service of the priesthood is given as a gift to Aaron and his sons, and
    a stranger who comes near is to be put to death.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:7
  text: Yahweh gives Aaron the command of the wave offerings and holy things of the
    children of Israel as a perpetual portion for Aaron and his sons by reason of
    the anointing.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:8
  text: Certain most holy offerings, including meal, sin, and trespass offerings,
    are to be eaten by every male among Aaron’s sons and are holy to them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:9
  text: Wave offerings are also given to Aaron, his sons, and his daughters, and everyone
    clean in Aaron’s house may eat them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:10
  text: The best oil, vintage, grain, first fruits, first-ripe fruits, and everything
    devoted in Israel are assigned to Aaron.
  category: object
  evidence_refs:
  - ev:3
- id: obs:11
  text: Everything that opens the womb and is offered to Yahweh is assigned to Aaron,
    but firstborn humans and firstborn unclean animals must be redeemed.
  category: action
  evidence_refs:
  - ev:4
- id: obs:12
  text: The firstborn of cow, sheep, and goat are not to be redeemed; their blood
    is sprinkled on the altar and their fat burned as an offering by fire, while their
    meat belongs to Aaron.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:13
  text: All wave offerings of holy things are given to Aaron, his sons, and his daughters
