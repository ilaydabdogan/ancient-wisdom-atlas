  quote: ''
  summary: 'Yahweh instructs Moses to command Israel concerning recurring offerings:
    daily burnt offerings, additional Sabbath and monthly offerings, Passover and
    Unleavened Bread offerings, and First Fruits/Feast of Weeks offerings. The prescriptions
    specify animals, meal and drink offerings, holy convocations, cessation from regular
    work, and sin offerings for atonement.'
