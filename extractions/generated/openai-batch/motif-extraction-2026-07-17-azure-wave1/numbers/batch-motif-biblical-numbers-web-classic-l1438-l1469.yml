    before the covenant. The rod belonging to the man Yahweh chooses will bud. Aaron’s
    rod for Levi sprouts, blossoms, and bears ripe almonds; it is then kept before
    the covenant as a token against rebellion, while the Israelites fear death near
    Yahweh’s tabernacle.
