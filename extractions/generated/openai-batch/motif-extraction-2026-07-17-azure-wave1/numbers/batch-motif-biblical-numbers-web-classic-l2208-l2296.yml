  summary: Footnotes define ephah and hin measurements. Chapter 29 gives instructions
    for seventh-month holy convocations, trumpet blowing, abstention from regular
    work, affliction of souls on the tenth day, a seven-day feast beginning on the
    fifteenth day, an eighth-day solemn assembly, and repeated burnt, meal, drink,
    sin, and peace offerings to Yahweh. Moses then tells the children of Israel what
    Yahweh commanded him.
