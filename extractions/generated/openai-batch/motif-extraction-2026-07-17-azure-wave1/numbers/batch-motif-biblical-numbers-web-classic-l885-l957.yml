canonical_text:
  quote: ''
  summary: Yahweh instructs Moses to make two silver trumpets for summoning the congregation,
    directing camp movement, marking war, feasts, months, and offerings. The cloud
    lifts from the tabernacle and Israel departs Sinai in ordered tribal formation.
    Moses asks Hobab to accompany the people as a wilderness guide. The ark of Yahweh’s
    covenant goes before the people to seek a resting place, while the cloud remains
    over them by day; Moses speaks invocations when the ark moves and rests.
  language: English
  quote_policy: summarized
