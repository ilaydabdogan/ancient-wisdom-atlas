canonical_text:
  quote: ''
  summary: The passage opens with an oath by the wise Koran and presents a divine
    revelation to warn a heedless people. It describes unbelievers as obstructed by
    chains, barriers, and a veil; affirms that God quickens the dead and records deeds;
    recounts a city that rejects sent messengers and a believing man who enters Paradise
    before a destructive shout; presents signs in revived earth, created pairs, celestial
    cycles, and the Ark; and depicts the final blast, resurrection from graves, judgment,
    Paradise, separation of sinners, Satan as foe, and Hell's heat.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage invokes the wise Koran and says the addressed figure is among
    the Sent Ones, on a right path, with a revelation meant to warn a heedless people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who will not believe are described with chains reaching the chin, forced-up
    heads, barriers before and behind them, and a veil that prevents sight.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: The warning is said to affect only one who follows the monition and fears
    the God of mercy in secret, who is given tidings of pardon and noble recompense.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: God says that He will quicken the dead and write down both the works people
    send before them and the traces they leave behind in a clear Book of decrees.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: A city receives two Sent Ones, strengthened by a third, but the people accuse
    them of lying and threaten stoning and grievous punishment.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: A man runs from the end of the city, urges his people to follow the Sent Ones,
    argues against taking other gods, and professes belief in his Lord.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The believing man is told to enter Paradise and wishes his people knew how
    gracious God had been to him; afterward a single shout from Gabriel extinguishes
    the people.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: The passage says many earlier generations have been destroyed and that all
    will be gathered together and set before God.
  category: sequence
  evidence_refs:
