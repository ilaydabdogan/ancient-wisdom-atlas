canonical_text:
  quote: ''
  summary: The passage includes translator notes on related Jewish traditions, divine
    names, and interpretive glosses, followed by the opening of Sura XLVI. The sura
    presents the Book as revelation from God, affirms creation of heaven and earth
    in truth for a fixed term, challenges invoked beings beside God to show creative
    power, and states that such beings will fail and disown their worshippers at the
    final assembly. It answers accusations of sorcery and fabrication, describes the
    speaker as one who follows revelation and warns openly, presents the Koran as
    confirming the Book of Moses, promises Paradise to steadfast believers, enjoins
    kindness to parents, includes a prayer of gratitude by a mature person, describes
    a child who rejects resurrection from the grave, and concludes with judgment according
    to works.
  language: English
  quote_policy: summarized
