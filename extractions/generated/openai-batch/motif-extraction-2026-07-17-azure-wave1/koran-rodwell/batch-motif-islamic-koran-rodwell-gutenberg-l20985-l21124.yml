  quote: ''
  summary: The passage includes admonitions against returning to error after guidance,
    warnings of divine knowledge, testing, punishment, and recompense, a call for
    believers to obey and expend for God's cause, and the opening of Sura III, where
    God sends down the Book confirming earlier scriptures, distinguishes clear and
    figurative signs, warns rejecters by the example of Pharaoh, recalls a battle
    sign, and contrasts worldly pleasures with gardens, rivers, acceptance with God,
    and protection from fire.
