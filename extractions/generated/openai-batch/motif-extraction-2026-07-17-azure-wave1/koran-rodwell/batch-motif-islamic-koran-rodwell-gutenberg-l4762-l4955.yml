candidate_motifs:
- id: motif:1
  label: Judgment day resurrection and summons
  taxonomy_refs:
  - resurrection
  - divine_judgment
  basis: The passage describes the Hour, people emerging from graves, the summoner,
    the distressful day, Hell, written deeds, and the reward of the pious.
  evidence_refs:
  - ev:2
  - ev:8
  confidence: high
  cautions: The passage gives eschatological images rather than a detailed itinerary
    of the afterlife.
- id: motif:2
  label: Flood deliverance on a vessel
  taxonomy_refs:
  - flood_and_renewal
  - ark_vessel
  basis: Noah's rejection is followed by heavenly and earthly waters meeting and Noah
    being carried on a vessel of planks and nails.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The excerpt emphasizes warning and recompense more than renewal after
    the flood.
- id: motif:3
  label: Rejected warner and punitive exempla
  taxonomy_refs:
  - divine_judgment
  - wisdom
  basis: Multiple communities reject warnings or miracles and then receive divinely
    sent punishments; the refrain says the Koran is made easy for warning.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: This is a recurring rhetorical pattern in the passage, not a single isolated
    narrative episode.
- id: motif:4
  label: Trial animal and violation of sacred apportionment
  taxonomy_refs:
  - sacred_exchange
  basis: The she-camel is sent as a proof, water is divided by turns between her and
    the people, and the violation comes when she is hamstrung.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The available taxonomy does not contain a precise she-camel or trial-animal
    category; 'sacred_exchange' is only an approximate fit because the passage concerns
    divided access to water.
- id: motif:5
  label: Guarded celestial boundary and stolen heavenly word
  taxonomy_refs:
