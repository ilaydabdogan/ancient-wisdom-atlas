canonical_text:
  quote: ''
  summary: The passage contains a translator note on Houris and wives in Paradise,
    Sura LIV recounting the approaching Hour, the cleft moon, resurrection from graves,
    rejected warnings, exemplary punishments of the peoples of Noah, Ad, Thamud, Lot,
    and Pharaoh, final judgment, divine decree, written records of deeds, and the
    reward of the pious in gardens and rivers. It then begins Sura XXXVII with angels
    ranged in praise, celestial protection against demons, stars and flame guarding
    the lower heaven, and human creation from clay.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A translator note says promises of the Houris of Paradise occur chiefly in
    earlier Meccan suras and that later passages more often speak of the faithfuls'
    wives accompanying them into gardens of bliss.
  category: other
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Hour is described as having approached, and the moon is described as cleft.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: When people see a miracle, they turn aside and call it well-devised magic.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: On a day of summons, people come forth from graves with downcast eyes and
    hasten to the summoner; the infidels call it a distressful day.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The people of Noah reject Noah, call him demoniac, and Noah cries to his Lord
    for aid.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: Heaven releases torrential water, the earth breaks forth with springs, and
    Noah is borne on a vessel made of planks and nails.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Adites reject the truth and are struck by a roaring wind that tears men
    away like uprooted palm stumps.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:8
  text: The Thamud reject a single human warner, are given a she-camel as a proof,
    receive divided water turns, and a comrade hamstrings the camel.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: After the she-camel is hamstrung, a single shout is sent against the Thamud,
    leaving them like dry sticks of fold-builders.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The people of Lot reject his warning; a stone-charged wind is sent against
    them, while Lot's family is delivered at daybreak.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: The people of Pharaoh receive threatenings and treat miracles as impostures,
    after which they are seized.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:12
  text: The wicked are described as dragged into the fire on their faces and told
    to taste the touch of Hell.
  category: action
  evidence_refs:
  - ev:8
- id: obs:13
  text: All things are said to have been created after a fixed decree, and every small
    and great action is written in Books.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:14
  text: The pious are described as dwelling among gardens and rivers in the seat of
    truth before the potent King.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:15
  text: Angels are described as ranged in order for praise, repelling demons, and
    reciting warning.
  category: action
  evidence_refs:
  - ev:10
- id: obs:16
  text: The lower heaven is adorned with stars that guard against rebellious Satan;
    if one steals a word by stealth, a glistening flame pursues him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: Humans are said to have been created from coarse clay.
  category: attribute
  evidence_refs:
  - ev:10
