comparison_claims:
- id: claim:1
  claim: A translator footnote links the Koranic image of gardens and rivers for the
    pious with Talmudic descriptions of multiple Gardens, rivers, and trees in Paradise.
  claim_level: same_motif
  target: Talmudic descriptions of Paradise gardens, rivers, and trees noted by Rodwell
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides only the translator's comparative note and bibliographic
    reference; it does not quote the Talmudic material.
- id: claim:2
  claim: A translator footnote directs the reader to other suras for the she-camel
    and divided-water episode, supporting an intra-Quranic recurrence of the same
    narrative motif.
  claim_level: same_motif
  target: Other Quranic accounts of the she-camel and water division in Sura xxvi.155
    and Sura vii.71 as cited in the note
  evidence_refs:
  - ev:11
  counter_evidence_refs: []
  confidence: high
  limitations: The cross-referenced passages are not included in the supplied excerpt,
    so only the existence of the internal reference is recorded.
