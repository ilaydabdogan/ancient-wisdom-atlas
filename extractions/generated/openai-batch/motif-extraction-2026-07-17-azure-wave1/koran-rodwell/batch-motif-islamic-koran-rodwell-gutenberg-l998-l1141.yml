  text: The opening prayer praises Allah as merciful and compassionate, maker of the
    three worlds, and king of the day of Fate.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: The speakers declare that they worship Allah alone, ask aid from Allah alone,
    and request guidance to the straight path rather than paths of hate or deviation.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Sura XCVI begins with a command to recite in the name of the Lord who created
    and who created man from clots of blood.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The Lord is described as beneficent and as teaching the use of the pen and
    teaching humankind what it did not know.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: Man is described as insolent because he sees himself possessed of riches,
    and all are said to return to the Lord.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: An unnamed figure is described as holding back a servant of God when the servant
    prays.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The passage asks whether the obstructing figure has followed true Guidance
    or enjoined Piety, or whether he has treated the truth as a lie and turned his
    back.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage states that God sees, and threatens that if the obstructing figure
    does not desist, God will seize him by the lying sinful forelock.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: The obstructing figure is told to summon his associates, while the divine
    speaker says the guards of Hell will also be summoned.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: The final injunction tells the addressee not to obey the obstructing figure,
    but to adore and draw near to God.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: A translator note states that the opening formula is of Jewish origin, was
