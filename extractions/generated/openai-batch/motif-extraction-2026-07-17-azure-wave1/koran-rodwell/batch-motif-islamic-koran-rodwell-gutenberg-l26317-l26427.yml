  summary: The passage contrasts communities in their response to believers, depicts
    some Christians recognizing revelation with tears, states divine reward and punishment,
    gives commands about lawful food, oaths, intoxicants, games of chance, pilgrimage
    hunting, offerings, the Caaba, inquiry, ancestral custom, guidance, return to
    God, and testament witnesses.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage says Jews and those who join other gods with God are most intense
    in hatred of believers, while those who say they are Christians are nearest in
    affection because some are priests and monks and are free from pride.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: When some hear what has been sent down to the Apostle, their eyes overflow
    with tears, they recognize truth, profess belief, and ask to be written among
    those who bear witness.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: They ask God to bring them into Paradise with the Just.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: God rewards these words with gardens beneath which rivers flow, where they
    abide forever; those who disbelieve and treat signs as lies are inmates of Hell-fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Believers are told not to forbid wholesome foods God has allowed, to eat lawful
    and wholesome food, and to fear God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: A mistaken word in oaths is not punished, but a serious oath has expiation
    by feeding ten poor persons, clothing them, setting free a captive, or fasting
    three days if unable.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: Wine, games of chance, statues, and divining arrows are called an abomination
    of Satan's work and are to be avoided.
  category: object
  evidence_refs:
  - ev:4
- id: obs:8
  text: Satan is said to seek hatred and strife among believers through wine and games
    of chance and to turn them from remembrance of God and prayer.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The Apostle is described as bound to deliver or preach a plain announcement.
  category: attribute
  evidence_refs:
  - ev:4
  - ev:7
- id: obs:10
  text: God will test believers with game they can take with hands or lances, so that
    God may know who fears him in secret; transgressors are warned of grievous chastisement.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: Believers are forbidden to kill game while on pilgrimage; intentional killing
    requires compensation in domestic animals of equal value brought as an offering
    to the Caaba, or feeding the poor, or fasting.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: Fishing in the sea and eating fish are lawful as provision, but hunting by
    land is unlawful while on pilgrimage.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: God appointed the Caaba, the sacred house, as a station for mankind, along
    with the sacred month, the offering, and its ornaments.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:14
  text: The passage states that God knows what is in the heavens and on earth, knows
    what is brought to light and concealed, is severe in punishing, and is Forgiving
    and Merciful.
  category: attribute
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:15
  text: The evil and the good are not to be valued alike, even if abundance of evil
    pleases the listener.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Believers are told not to ask about things which, if told, might pain them;
    if asked after the Koran has been sent down, they will be declared, and God will
    pardon.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:17
  text: The passage says God has not ordained anything concerning Bahira, Saba, Wasila,
    or Hami; unbelievers have invented a lie against God.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:18
  text: When called to what God sent down and to the Apostle, some answer that the
    faith found among their fathers is sufficient, though the passage says their fathers
    knew nothing and had no guidance.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:19
  text: Believers are told to take heed to themselves; one who errs will not hurt
    them when they have guidance, and all return to God, who will tell them what they
    have done.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: When death draws near at the making of a testament, two witnesses are required;
    if doubted, they swear by God not to take a bribe or conceal testimony.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:21
  text: If two witnesses are shown to have lied, two others nearest in blood stand
    in their place and swear that their witness is truer and not untrue.
  category: sequence
  evidence_refs:
  - ev:10
