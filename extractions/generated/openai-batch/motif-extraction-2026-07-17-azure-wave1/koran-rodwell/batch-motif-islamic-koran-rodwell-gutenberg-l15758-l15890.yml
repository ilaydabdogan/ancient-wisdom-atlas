canonical_text:
  quote: ''
  summary: The passage asserts that God alone is the true Lord, creator, guide, giver
    of life and death, owner of heaven and earth, witness over all works, and judge
    at the return and Resurrection. It describes the Koran as from God, confirming
    earlier revelation and serving as warning, healing, guidance, and mercy. It contrasts
    believers and deniers, recalls apostles sent to every people, warns of punishment
    and rightful decision, promises good tidings to the friends of God, presents night
    and day as signs, and denies that God has begotten children.
  language: English
  quote_policy: summarized
