- id: claim:1
  claim: Within this passage, the Moses sea episode and the Noah ark episode share
    a narrative function in which a faithful group is rescued while opponents are
    drowned.
  claim_level: same_function
  target: Moses sea crossing and Noah ark rescue within the passage
  evidence_refs:
  - ev:6
  - ev:10
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal comparison within the supplied passage only; it
    makes no claim about historical contact or external textual dependence.
- id: claim:2
  claim: The Moses and Noah units both present an opposed messenger whose rejected
    warning is followed by divine rescue of believers and destruction of opponents.
  claim_level: same_motif
  target: opposed messenger and rescue-destruction pattern in the Moses and Noah units
  evidence_refs:
  - ev:5
  - ev:6
  - ev:9
  - ev:10
  counter_evidence_refs: []
  confidence: medium
  limitations: The Moses unit includes a royal court and sea crossing, while the Noah
    unit includes preaching, threatened stoning, and an ark; the claim is limited
    to their shared passage-level pattern.
- id: claim:3
  claim: The staff-serpent sign and the magicians' ropes and rods are compared within
    the contest by their shared use as cast-down objects, but Moses' rod is given
    the superior function of swallowing the others' wonders.
  claim_level: visual_similarity
  target: Moses' staff or rod and the magicians' ropes and rods
  evidence_refs:
  - ev:2
  - ev:3
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not describe the magicians' ropes and rods as serpents
    in this translation; the comparison is limited to the objects and their contest
    function.
