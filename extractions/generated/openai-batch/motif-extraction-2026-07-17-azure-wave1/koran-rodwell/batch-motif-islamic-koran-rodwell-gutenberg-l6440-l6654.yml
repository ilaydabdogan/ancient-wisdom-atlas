canonical_text:
  quote: ''
  summary: The passage recounts Moses before Pharaoh, the staff-serpent and white-hand
    signs, the contest with Pharaoh's magicians, the night departure of Moses' people,
    the parting of the sea and drowning of pursuers. It then presents Abraham questioning
    idol worship, praising God as creator, guide, healer, life-giver, and judge, and
    describing the raised mankind, Paradise, Hell, and regret of the astray. It concludes
    with Noah's warning to his people, their rejection, and the rescue of Noah and
    believers in the ark while the rest are drowned.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Moses identifies the Lord as Lord of the heavens, earth, what is between them,
    the ancestors, and the East and West.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Pharaoh calls Moses possessed and threatens imprisonment if Moses takes any
    god beside Pharaoh.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Moses offers a proof, throws down his staff, and it appears as a serpent;
    he also draws out his hand and it appears white to the beholders.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Pharaoh describes Moses to the nobles as a cunning sorcerer who wants to drive
    them from their land by sorcery.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The nobles advise Pharaoh to delay Moses and Aaron and send summoners to gather
    cunning magicians from the cities.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The magicians are assembled at a set time on a solemn day, ask Pharaoh about
    reward, and receive a promise of reward and nearness to Pharaoh.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The magicians cast down ropes and rods, invoke Pharaoh's might, and Moses'
    rod swallows their wonders.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The magicians fall down in worship and profess belief in the Lord of the Worlds,
    the Lord of Moses and Aaron.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: Pharaoh accuses the converted magicians of following a master who taught them
    magic and threatens crosswise amputation and crucifixion.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: The converted magicians say the threat cannot harm them, because they will
    return to their Lord and hope for forgiveness as first believers.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:11
  text: Moses receives an order to go forth by night with God's servants because they
    will be pursued; Pharaoh sends summoners through the cities, and Egyptians follow
    at sunrise.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:12
  text: When Moses' companions fear being overtaken, Moses says his Lord is with him
    and will guide him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Moses is ordered to strike the sea with his rod; the sea splits, each part
    becoming like a huge mountain; Moses and those with him are saved, and the others
    are drowned.
  category: action
  evidence_refs:
  - ev:6
- id: obs:14
  text: Abraham asks his father and people what they worship, and they answer that
    they worship idols as their fathers did.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Abraham says the idols are his foes, unlike the Lord of the Worlds, who created
    him, guides him, feeds and gives him drink, heals him when sick, causes him to
    die and quickens him, and may forgive him on the day of reckoning.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:16
  text: Abraham prays for wisdom, a good name among posterity, inheritance of the
    garden of delight, forgiveness for his father, and freedom from shame on the day
    mankind is raised.
  category: speech
  evidence_refs:
  - ev:7
  - ev:8
- id: obs:17
  text: The judgment scene says wealth and children will not avail except for one
    who comes to God with a sound heart; Paradise is brought near the pious and Hell
    is opened for those astray.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:18
  text: Those cast into Hell include seducers, the seduced, and the host of Eblis;
    they admit error, lack intercessor or caring friend, and wish they could return
    and believe.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:19
  text: Noah tells his people that he is a faithful apostle, asks them to fear God
    and obey him, and says he seeks no reward except from the Lord of the Worlds.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:20
  text: Noah's people object that only the meanest follow him and threaten that he
