candidate_motifs:
- id: motif:1
  label: staff transformed into serpent as divine proof
  taxonomy_refs:
  - serpent
  basis: Moses offers a proof, throws down his staff, and it becomes an undoubted
    serpent.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage presents the transformation as a sign in a prophetic dispute;
    broader serpent symbolism is not elaborated here.
- id: motif:2
  label: true sign overcomes magical wonders
  taxonomy_refs: []
  basis: Pharaoh's magicians cast ropes and rods, but Moses' rod swallows their wonders,
    after which the magicians worship and believe.
  evidence_refs:
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage labels the magicians' wonders as cheating, but does not describe
    their visual form in detail.
- id: motif:3
  label: guided night departure under pursuit
  taxonomy_refs:
  - departure
  basis: Moses receives an order to go forth by night because his group will be pursued,
    and he assures his companions that the Lord will guide him.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The taxonomy reference is broad; the passage is specifically an escape
    under divine instruction.
- id: motif:4
  label: divided water as deliverance and judgment
  taxonomy_refs:
  - divine_judgment
  basis: The sea divides after Moses strikes it with his rod; Moses' group is saved
    and the pursuers are drowned.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage emphasizes rescue, drowning, and a sign; it does not explicitly
    use the phrase divine judgment in this scene.
- id: motif:5
  label: death, quickening, resurrection, and reckoning
  taxonomy_refs:
  - resurrection
  - divine_judgment
  basis: Abraham speaks of the Lord causing him to die and quicken him, forgiving
    on the day of reckoning, and the day when mankind is raised up.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage combines personal quickening language with collective eschatological
    judgment.
- id: motif:6
  label: powerless idols contrasted with divine lordship
  taxonomy_refs:
  - wisdom
  basis: Abraham asks whether idols can hear, help, or harm, and contrasts them with
    the Lord who creates, guides, provides, heals, gives life, and forgives.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The wisdom reference is interpretive and broad; the literal passage is
    an anti-idol argument.
- id: motif:7
  label: ark rescue of the faithful and drowning of opponents
  taxonomy_refs:
  - ark_vessel
  - flood_and_renewal
  - divine_judgment
  basis: Noah and those with him are saved in the fully laden ark, and the rest are
    drowned after Noah's people reject him.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: high
  cautions: The passage mentions the ark and drowning but does not narrate flood details
    beyond the rescue and drowning.
- id: motif:8
  label: rejected apostle warns without reward
  taxonomy_refs: []
  basis: Noah calls himself a faithful apostle, asks for obedience and no reward from
