canonical_text:
  quote: ''
  summary: The passage praises believers who pray, give alms, restrain appetites,
    keep trusts and covenants, and will inherit paradise. It describes human creation
    from clay through bodily stages, death, resurrection, seven heavens, and divine
    provision through water, gardens, the Sinai tree, cattle, and ships. It recounts
    Noah’s preaching, rejection, ark-building, rescue of pairs and family, and drowning
    of the wicked. It then describes later apostles rejected by peoples who deny resurrection,
    followed by punitive destruction. Moses and Aaron are sent to Pharaoh and rejected;
    Moses receives the Book. The Son of Mary and his mother are made a sign and given
    a lofty watered refuge. The passage closes by affirming one religion, condemning
    sectarian division, and describing those who fear their Lord and return to him,
    with a truthful book and no unjust burden on any soul.
  language: English
  quote_policy: summarized
