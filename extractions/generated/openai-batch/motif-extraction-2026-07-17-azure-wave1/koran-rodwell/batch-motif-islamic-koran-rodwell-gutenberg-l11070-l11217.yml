candidate_motifs:
- id: motif:1
  label: Hidden wisdom behind troubling acts
  taxonomy_refs:
  - wisdom
  basis: The companion’s damaging of a ship, killing of a youth, and repair of a wall
    are challenged by Moses but later explained as having protective or merciful purposes
    and as not done by the companion’s own will.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage does not name the companion in the supplied text; interpretation
    is limited to the explicit explanation given.
- id: motif:2
  label: Trial of patience during instruction
  taxonomy_refs:
  - initiation
  - wisdom
  basis: Moses is told not to ask questions until an account is given, repeatedly
    fails to wait patiently, and reaches a parting point after the third objection.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The passage frames the episodes as a test of patience and understanding,
    but does not explicitly call it an initiation.
- id: motif:3
  label: Empowered ruler’s world-ranging journey
  taxonomy_refs:
  - culture_hero
  basis: Dhoulkarnain’s power is established on earth, he is given routes, and he
    travels to the setting sun, rising sun, and the region between two mountains.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The classification as culture-hero is based on his public ordering and
    protection functions; the passage identifies him by name but does not use that
    taxonomy.
- id: motif:4
  label: Protective boundary against destructive peoples
  taxonomy_refs: []
  basis: Dhoulkarnain builds a barrier of iron and brass between a vulnerable people
    and Gog and Magog, who cannot scale or dig through it.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: No supplied taxonomy family directly names a boundary-wall motif; no external
    comparison is asserted.
- id: motif:5
  label: Impermanent apocalyptic barrier
  taxonomy_refs:
  - divine_judgment
  basis: The barrier is called a mercy from the Lord, but it will be turned to dust
    when the Lord’s promise comes, followed by surging movement, trumpet blast, and
    gathering.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not specify all events beyond the barrier’s destruction,
    trumpet blast, and gathering.
- id: motif:6
  label: Final judgment with Hell and Paradise
  taxonomy_refs:
  - divine_judgment
  - resurrection
  basis: The passage describes Hell for infidels, the day of resurrection, and gardens
    of Paradise for those who believe and do right.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage gives destinations and moral criteria but not a detailed afterlife
    journey map.
- id: motif:7
  label: Inexhaustible divine speech
  taxonomy_refs:
  - wisdom
  basis: The sea-as-ink image states that the sea would fail before the words of the
