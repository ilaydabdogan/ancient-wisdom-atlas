  quote: ''
  summary: The passage recounts Moses traveling with an unnamed companion whose troubling
    actions are later explained as merciful or protective acts done by divine command.
    It then recounts Dhoulkarnain’s journeys to the west, east, and between two mountains,
    where he builds an iron-and-brass barrier against Gog and Magog. The passage closes
    with eschatological judgment, Hell for unbelievers, Paradise for believers, the
    inexhaustibility of the Lord’s words, and a declaration of monotheistic worship.
