canonical_text:
  quote: ''
  summary: The passage warns that none can protect people from God, describes just
    balances on the day of resurrection, recalls revelations and warnings given to
    earlier figures, and recounts episodes involving Abraham, Lot, Noah, David, Solomon,
    Job, Ismael, Edris, Dhoulkefl, Dhoulnoun, Zacharias, and the maiden with her son.
    It emphasizes divine warning, judgment, rescue, wisdom, mercy, and the unity of
    religion before God.
