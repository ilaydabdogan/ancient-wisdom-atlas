candidate_motifs:
- id: motif:1
  label: hardened heart contrasted with obedient creation
  taxonomy_refs: []
  basis: Human hearts are described as harder than rocks, while rocks yield water
    or sink in fear of God.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives a moral image but does not explicitly name a broader
    mythic motif.
- id: motif:2
  label: corruption, concealment, and rejection of revelation
  taxonomy_refs: []
  basis: The passage describes hearing and perverting God’s word, hiding revelation,
    corruptly writing the Book, selling it, and casting the Book behind backs.
  evidence_refs:
  - ev:2
  - ev:10
  confidence: high
  cautions: No external textual comparison is asserted.
- id: motif:3
  label: covenant and covenant-breaking
  taxonomy_refs:
  - covenant
  basis: God enters covenants with the children of Israel, commands obligations, and
    the addressed group is accused of violating them by turning away, bloodshed, expulsion,
    and rebellion.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:10
  confidence: high
  cautions: The extraction is limited to the covenant scenes present in this passage.
- id: motif:4
  label: divine judgment through fire, Paradise, resurrection torment, and punishment
  taxonomy_refs:
  - divine_judgment
  - resurrection
  basis: The passage contrasts sinners abiding in fire with believers in Paradise
    and mentions shame in this life, resurrection torment, and punishment that long
    life cannot avoid.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:8
  - ev:9
  confidence: high
  cautions: Afterlife geography is only partly described in this passage.
- id: motif:5
  label: idolatrous calf internalized in the heart
  taxonomy_refs: []
  basis: The addressed group is said to have taken the calf as God in Moses’ absence
    and to have been made to drink the calf into their hearts.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage does not describe the making of the calf, only its adoption
    and internalized image.
- id: motif:6
  label: mountain uplifted over covenant recipients
  taxonomy_refs:
  - covenant
  basis: At the acceptance of the covenant, the mountain is uplifted over the people
    while they are commanded to take firm hold and hearken.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Although a mountain appears, the passage does not present it as a cosmic
    mountain or world center.
- id: motif:7
  label: angelic mediation of descending revelation
  taxonomy_refs: []
  basis: Gabriel is said to cause the Koran to descend on the heart by God’s leave
    as confirmation, guidance, and good tidings.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage names Gabriel and Michael but only describes Gabriel’s mediating
    action.
- id: motif:8
  label: desire for long life cannot avert judgment
  taxonomy_refs:
  - divine_judgment
  basis: The passage says some desire to be kept alive a thousand years, but preservation
    alive will not reprieve anyone from punishment.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage frames the long-life desire polemically; it is not a full
    immortality quest narrative.
