canonical_text:
  quote: ''
  summary: The passage addresses hardness of heart, alteration or rejection of divine
    revelation, covenant obligations and covenant-breaking among the children of Israel,
    contrasting punishment in fire with Paradise. It recalls Moses, Jesus, the Holy
    Spirit, Gabriel, Michael, the calf episode, the uplifted mountain, and the Koran
    as confirming earlier revelations.
  language: English
  quote_policy: summarized
literal_observations:
