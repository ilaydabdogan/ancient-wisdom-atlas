candidate_motifs:
- id: motif:1
  label: Afterlife judgment with Fire, security, and paradise
  taxonomy_refs:
  - divine_judgment
  basis: The passage assigns Fire to enemies of God, promises paradise to believers,
    contrasts being cast into Fire with security on the day of resurrection, and describes
    divine accounting and punishment.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:7
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage is doctrinal and exhortative rather than a continuous narrative
    of judgment scenes.
- id: motif:2
  label: Reviving rain as sign of resurrection
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: Rain revives drooping earth, and the passage explicitly says the one who
    gives it life will give life to the dead.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage uses the revived earth as an argumentative sign; it does not
    narrate an individual resurrection event.
- id: motif:3
  label: Revelatory book as guide and healing wisdom
  taxonomy_refs:
  - wisdom
  basis: The Koran is called a glorious book and divine missive, and it is described
    as a guide and medicine for believers.
  evidence_refs:
  - ev:8
  - ev:9
  - ev:18
  confidence: high
  cautions: The taxonomy connection is to the book's wisdom and healing function,
    not to a personified wisdom figure.
- id: motif:4
  label: Cosmic and bodily signs point to the creator
  taxonomy_refs: []
  basis: Night, day, sun, moon, revived earth, signs in countries and selves, heavens
    and earth, human creation, and beasts are all presented as signs.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:15
  - ev:18
  confidence: high
  cautions: No more specific supplied taxonomy family exactly matches this signs pattern.
- id: motif:5
  label: Good and evil distinguished, evil repelled by better action
  taxonomy_refs:
  - duality
  basis: The passage states that good and evil are not the same and commands turning
    away evil by what is better, transforming enmity into warm friendship.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: This is primarily an ethical instruction; its status as a mythology motif
    is interpretive.
- id: motif:6
  label: Temptation by Satan and refuge in God
  taxonomy_refs: []
  basis: The passage names enticement from Satan and commands taking refuge in God,
    who is Hearing and Knowing.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The passage gives a brief instruction, not an extended temptation narrative.
- id: motif:7
  label: Continuity and dispute around earlier revelation
  taxonomy_refs:
  - wisdom
  basis: The passage says the message resembles what was said to earlier apostles
    and mentions Moses receiving the Book, followed by disputes and doubts.
  evidence_refs:
