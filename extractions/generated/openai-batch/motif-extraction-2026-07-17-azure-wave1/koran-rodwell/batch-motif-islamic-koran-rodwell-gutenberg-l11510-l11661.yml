  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Those who disown God's signs are contrasted as being cast into the Fire, while
    another figure comes forth secure on the day of resurrection; God's eye is said
    to be on all deeds.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:11
  text: The Koran is described as a glorious book, protected from falsehood, and as
    a missive sent down from the Wise and Praiseworthy One.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:12
  text: The passage discusses an objection to a Koran in a foreign tongue, then says
