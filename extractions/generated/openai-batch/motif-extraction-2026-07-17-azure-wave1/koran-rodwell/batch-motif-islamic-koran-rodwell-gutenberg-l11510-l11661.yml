  text: The angels identify themselves as guardians in this life and the next and
    describe the promised state as hospitality from a Gracious and Merciful One.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage states that good and evil are not to be treated alike and commands
    turning away evil by what is better, so that an enemy may become like a warm friend.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: If an enticement from Satan entices the addressee, the addressee is commanded
    to take refuge in God.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Night, day, sun, and moon are named among God's signs; the passage forbids
    adoration of the sun or moon and commands adoration of God who created them.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: Those who are with the Lord celebrate God's praises night and day without
    ceasing.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The earth is seen drooping, then rain is sent down upon it, after which it
