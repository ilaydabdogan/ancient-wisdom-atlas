  text: Unbelievers ask their Lord to show them the Djinn and men who led them astray
    so that they may put them under their feet and humble them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those who say that their Lord is God and go straight to Him receive descending
    angels who tell them not to fear or grieve and to rejoice in the promised paradise.
  category: sequence
  evidence_refs:
  - ev:2
