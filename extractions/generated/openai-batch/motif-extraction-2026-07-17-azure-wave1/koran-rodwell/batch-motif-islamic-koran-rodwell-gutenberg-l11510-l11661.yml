canonical_text:
  quote: ''
  summary: The passage contrasts enemies of God, who receive the Fire, with believers
    who receive angelic reassurance and promised paradise. It instructs turning away
    evil with what is better, seeking refuge in God from Satan, and worshipping God
    rather than the sun or moon. It presents night, day, sun, moon, rain-revived earth,
    human creation, animals, and signs in lands and selves as signs of God. It describes
    the Koran as a glorious book, guide, medicine, and missive from God; mentions
    earlier apostles and Moses' Book; and affirms divine knowledge of the Hour, judgment,
    resurrection, and human accountability.
  language: English
  quote_policy: summarized
