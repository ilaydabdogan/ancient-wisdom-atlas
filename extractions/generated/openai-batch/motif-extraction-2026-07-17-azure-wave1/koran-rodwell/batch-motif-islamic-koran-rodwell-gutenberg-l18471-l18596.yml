    hidden and manifest things.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:12
  text: Each person is said to have a succession of angels before and behind him who
    watch by God’s command.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: Lightning is said to shine for fear and hope, and laden clouds are brought
    up.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Thunder is said to utter God’s praise, and angels also praise God for awe
