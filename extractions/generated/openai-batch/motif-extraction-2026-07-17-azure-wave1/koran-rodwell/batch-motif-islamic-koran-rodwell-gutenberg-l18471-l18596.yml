canonical_text:
  quote: ''
  summary: The passage first reports a translator note on pre-Islamic Arabian allotment
    of produce between God and idols. It then presents Sura XIII, describing divine
    signs in the ordered heavens and earth, mountains, rivers, fruits, night and day,
    varied crops watered by the same water, denial of resurrection, punishment and
    mercy, divine knowledge, angelic guardians, lightning, clouds, thunder praising
    God, bolts striking by divine will, the ineffectiveness of other deities, universal
    bowing to God, rain and molten metal imagery comparing truth and falsehood, rewards
    and reckoning, and the qualities and afterlife recompense of those who keep God’s
    compact.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The translator note says idolatrous Arabs set apart one part of their fields
    for the Supreme God and another for inferior gods represented by idols.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The note says fruit transferred from the idols’ portion to God’s portion was
    restored to the idols, while fruit transferred from God’s portion to the idols’
    portion was left with the idols.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:3
  text: The note states that the idols’ portion was reserved for priests.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: The sura opens by identifying the recited material as signs of the Book and
    as truth sent down from the Lord, while saying most people will not believe.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: God is described as raising the heavens without visible pillars, mounting
    the throne, and imposing laws on the sun and moon so that each travels to an appointed
    goal.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: God is described as outstretching the earth, placing firm mountains and rivers
    on it, making two kinds of every fruit, and causing night to enshroud day.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: Adjacent portions of earth are described as producing grapes, corn, and palm
    trees, all watered by the same water but differing in excellence as food.
  category: setting
  evidence_refs:
  - ev:6
- id: obs:8
  text: Unbelievers are represented as questioning whether they will be restored in
    a new creation after becoming dust.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Those who disbelieve are said to have collars on their necks and to abide
    in the fire.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: The addressed messenger is called a warner, and the passage says every people
    has its guide.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:11
