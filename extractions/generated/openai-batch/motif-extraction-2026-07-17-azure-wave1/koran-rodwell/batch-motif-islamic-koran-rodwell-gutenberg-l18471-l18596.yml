candidate_motifs:
- id: motif:1
  label: Allotted offerings to God and idols
  taxonomy_refs:
  - sacred_exchange
  basis: The translator note describes field portions assigned to the Supreme God
    and to idols, with produce handled according to ritualized allocation and ultimately
    reserved for priests.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: medium
  cautions: This material is in a translator note, not in the quoted sura passage
    itself; the taxonomy link is broad.
- id: motif:2
  label: Creation ordered as signs for reflection
  taxonomy_refs: []
  basis: God orders the heavens, sun, moon, earth, mountains, rivers, fruits, night,
    day, and varied crops, and the passage repeatedly calls these signs for reflection
    or understanding.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:6
  confidence: high
  cautions: No specific available taxonomy family directly names general cosmic ordering
    as signs.
- id: motif:3
  label: Restoration after becoming dust
  taxonomy_refs:
  - resurrection
  basis: The passage cites the objection that people who have become dust could be
    restored in a new creation.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage presents the question in the mouths of unbelievers; the broader
    passage implies rejection of their disbelief.
- id: motif:4
  label: Punishment, reckoning, and contrasted afterlife destinations
  taxonomy_refs:
  - divine_judgment
  - resurrection
  basis: Unbelievers are assigned collars, fire, evil reckoning, Hell, and a wretched
    bed, while those who respond and keep the compact receive excellent reward and
    Gardens of Eden.
  evidence_refs:
  - ev:7
  - ev:16
  - ev:19
  confidence: high
  cautions: The passage excerpt ends mid-sentence after angels entering at every portal,
    so the Eden scene is incomplete.
- id: motif:5
  label: Covenant or compact with God
  taxonomy_refs:
  - covenant
  basis: The passage praises those who fulfill their pledge to God, do not break their
    compact, and join what God has commanded to be joined.
  evidence_refs:
  - ev:18
  confidence: high
  cautions: The passage does not specify the full contents of the compact beyond the
    listed practices.
- id: motif:6
  label: Insight versus blindness and light versus darkness
  taxonomy_refs:
  - wisdom
  - duality
  basis: The passage contrasts the one who knows the revealed truth with the blind,
    and asks whether blind and seeing or darkness and light can be held equal.
  evidence_refs:
  - ev:14
  - ev:17
  confidence: medium
  cautions: The taxonomy assignment is interpretive but grounded in explicit paired
    contrasts and the phrase 'men of insight.'
- id: motif:7
  label: Cosmic praise and compulsory worship
  taxonomy_refs: []
  basis: Thunder, angels, all in the heavens and earth, and even shadows are described
    as praising or bowing to God.
  evidence_refs:
  - ev:11
  - ev:13
  confidence: high
  cautions: No available taxonomy family directly names universal cosmic worship.
- id: motif:8
  label: Ineffective prayer to false deities
  taxonomy_refs: []
