literal_observations:
- id: obs:1
  text: A translator note says Abraham drove Satan away with stones when Satan would
    have hindered him from sacrificing Ismael; the note connects this with throwing
    stones during pilgrimage at Mina, near three small pillars marking the apparition
    site.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A translator note cites Jewish texts that speak of seven dwellings, houses,
    or gates of Hell.
  category: other
  evidence_refs:
  - ev:2
- id: obs:3
  text: Zachariah privately calls upon his Lord, mentions his weakened bones, old
    age, barren wife, and fears for his kindred, and asks for a successor and heir
    from the family of Jacob.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:4
  text: Zachariah is told that he will have a son named John, a name said to have
    been given to none before him; when he questions how this can happen, the Lord
    answers that it is easy because Zachariah was created when he was nothing.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:5
  text: Zachariah asks for a sign and is told that for three nights he will not speak
    to people though healthy; he then comes from the sanctuary and signals to his
    people to praise morning and evening.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:6
  text: John is told to receive the Book with purpose of heart, is given wisdom as
    a child, and is described as merciful, pure, pious, dutiful to his parents, and
    not proud or rebellious.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:7
  text: Peace is pronounced on John on the day of his birth, the day of his death,
    and the day when he is raised to life.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: Mary goes apart from her family eastward, takes a veil to shroud herself,
    and receives a spirit who appears before her in the form of a perfect man.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Mary seeks refuge from the appearing figure; he says he is a messenger of
    her Lord and announces a holy son. Mary asks how she can have a son when no man
    has touched her and she is not unchaste.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: The messenger says the birth is easy for the Lord and that the son will be
    a sign to mankind and a mercy, because the matter has been decreed.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Mary conceives, retires to a far-off place, and the throes of birth come upon
    her by the trunk of a palm; she wishes she had died and been forgotten.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A voice from below tells Mary not to grieve, says a streamlet has been provided
    at her feet, tells her to shake the palm trunk so that fresh ripe dates fall,
    and instructs her to eat, drink, be cheerful, and vow not to speak that day.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Mary returns to her people bearing the babe; they accuse her of having done
    a strange thing and refer to her father and mother as not wicked or unchaste.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: Mary points toward the babe; when the people ask how they can speak with an
    infant in the cradle, the infant speaks, identifies himself as servant of God,
    says he has been given the Book and made a prophet, and says he is blessed and
    commanded to prayer and almsgiving.
  category: speech
  evidence_refs:
