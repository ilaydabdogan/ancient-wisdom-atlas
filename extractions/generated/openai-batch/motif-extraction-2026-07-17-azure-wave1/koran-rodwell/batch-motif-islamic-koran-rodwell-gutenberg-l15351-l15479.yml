canonical_text:
  quote: ''
  summary: The passage begins with editorial notes, including a report about Nodhar
    Ibn El Hareth reciting a Persian heroic romance to the Koreisch. The main Qur'anic
    excerpt opens Sura XLII by presenting God as revealer, creator, owner of heaven
    and earth, judge, and provider. Muhammad receives an Arabic Koran to warn the
    mother city and surrounding people of the Day of Gathering, Paradise, flame, the
    Hour, and divine judgment. The passage names Noah, Abraham, Moses, and Jesus as
    earlier recipients of the same prescribed faith and commands against sectarian
    division. It contrasts believers who do right with impious disputers whose works
    bring consequences.
