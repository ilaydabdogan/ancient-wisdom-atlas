canonical_text:
  quote: ''
  summary: The passage gives an exhortation about truthful witness, then describes
    God assembling the Apostles and questioning them. God recalls favors granted to
    Jesus son of Mary, including strengthening by the Holy Spirit, instruction in
    scripture and wisdom, miracles performed by divine leave, and protection from
    unbelieving opponents. The Apostles profess belief and ask for a furnished table
    from heaven; Jesus prays for it as a sign, festival, and nourishment, and God
    grants it with a warning against later disbelief. God questions Jesus about whether
    he told humanity to take him and Mary as gods; Jesus denies this and affirms that
    he taught only worship of God. The passage concludes with reward for the truthful
    in gardens with rivers and with God's sovereignty over heaven and earth.
  language: English
  quote_policy: summarized
