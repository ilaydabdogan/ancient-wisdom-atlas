candidate_motifs:
- id: motif:1
  label: Ancestral covenantal bequest of monotheistic surrender
  taxonomy_refs:
  - covenant
  basis: Abraham and Jacob transmit a chosen religion to their children, and Jacob’s
    sons affirm worship of the one God and surrender to Him.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage uses the language of chosen religion and inheritance, not
    the explicit word covenant in this translation.
- id: motif:2
  label: Sacred orientation toward a ritual center
  taxonomy_refs:
  - world_center
  basis: The passage discusses the qibla, says East and West belong to God, and repeatedly
    commands the apostle and believers to turn their faces toward the sacred Mosque
    wherever they are.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: medium
  cautions: The sacred Mosque functions as a ritual direction in the passage; a broader
    world-center interpretation is inferential and should be reviewed.
- id: motif:3
  label: Community as witness before mankind
  taxonomy_refs:
  - covenant
  - divine_judgment
  basis: The community is made a central people to be witnesses regarding mankind,
    while the apostle is a witness regarding the community.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage states a witness role but does not narrate a judgment scene
    in detail.
- id: motif:4
  label: Ritual change as test of allegiance
  taxonomy_refs:
  - initiation
  basis: The former qibla is said to have been appointed to distinguish those who
    follow the apostle from those who turn back; the change is described as difficult
    except for those guided by God.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The motif resembles a test or initiation pattern, but the passage frames
    it specifically as obedience to the apostle and divine guidance.
- id: motif:5
  label: Revelation as purification and wisdom instruction
  taxonomy_refs:
  - wisdom
  basis: The apostle is sent to rehearse signs, purify the community, instruct them
    in the Book and wisdom, and teach what they did not know.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No caution beyond the passage-level scope.
- id: motif:6
  label: Reciprocal remembrance between God and believers
  taxonomy_refs:
  - sacred_exchange
  basis: The passage states that if believers remember God, God will remember them,
    and it commands thanksgiving and avoidance of ingratitude.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The exchange is devotional remembrance rather than a material transaction.
- id: motif:7
  label: Trial through deprivation and patient return to God
  taxonomy_refs:
  - return
  - divine_judgment
  basis: Believers are tested with fear, hunger, and losses; the patient respond by
    saying they belong to God and shall return to Him and receive blessings, mercy,
    and guidance.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The return is theological and devotional; the passage does not provide
    a detailed afterlife journey map.
- id: motif:8
  label: Slain on God’s path as living beyond death
  taxonomy_refs:
  - resurrection
  basis: The passage commands that those slain on God’s path not be called dead, saying
    instead that they are living though the hearers do not understand.
  evidence_refs:
  - ev:10
  confidence: medium
  cautions: The passage asserts life after being slain but does not narrate resurrection
    mechanics or timing.
- id: motif:9
  label: Pilgrimage circuit around sacred monuments
  taxonomy_refs:
  - world_center
  basis: Safa and Marwah are called monuments of God, and pilgrims or visitors to
    the temple may go round them both.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The passage gives a ritual action and sacred places but does not describe
    a full pilgrimage itinerary or cosmological map.
- id: motif:10
  label: Concealment of revelation and divine curse
  taxonomy_refs:
  - divine_judgment
  basis: Those who conceal clear proof or guidance are cursed, while those who turn,
    amend, and make truth known are met by divine mercy; persistent infidels receive
