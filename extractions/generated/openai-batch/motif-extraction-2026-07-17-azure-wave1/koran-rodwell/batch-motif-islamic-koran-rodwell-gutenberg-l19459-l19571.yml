literal_observations:
- id: obs:1
  text: During the night of the fast, the addressed believers are permitted marital
    relations and eating and drinking until dawn; they are then instructed to fast
    until night and not approach wives while passing time in mosques.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage calls these restrictions bounds set by God and says God makes
    signs clear so that people may fear Him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The addressed audience is told not to consume wealth vainly or present it
    to judges in order to consume other men's wealth unjustly.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: New moons are described as fixed periods for human service and for the Pilgrimage.
  category: object
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says piety is not entering houses from the back, but fearing God
    and entering houses by their doors.
  category: action
  evidence_refs:
  - ev:3
- id: obs:6
  text: Fighting is permitted against those who fight the addressed group, while initiating
    attack is called injustice.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: The sacred Mosque is protected from attack unless opponents attack there first;
    desistance by opponents is answered with cessation of hostility except against
    the wicked.
  category: sequence
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:8
  text: The sacred month and sacred precincts are described as under the safeguard
    of reprisals.
  category: setting
  evidence_refs:
  - ev:5
- id: obs:9
  text: The audience is told to give freely for God's cause, avoid self-ruin, and
    do good.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Pilgrimage and Visitation are to be completed; if blocked by foes, an
    offering is to be sent, and heads are not to be shaved until the offering reaches
    the place of sacrifice.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: For sickness, head ailment, or lack of an offering, the passage gives compensatory
    practices involving fasting, alms, or offerings, including three days during Pilgrimage
    and seven after return.
  category: sequence
  evidence_refs:
  - ev:6
  - ev:7
- id: obs:12
  text: During the known months of Pilgrimage, pilgrims are instructed to abstain
    from women, transgression, and wrangling; the best provision is identified as
    fear of God.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: Pilgrims are instructed to move from Arafat, remember God near the holy monument,
    pass on with the people, and ask God's pardon.
  category: action
  evidence_refs:
  - ev:8
- id: obs:14
  text: After completing holy rites, the audience is told to remember God intensely;
    two prayers are contrasted, one asking only for a portion in this world and another
    asking good in this world and the next and protection from the fire.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:15
  text: One man is described as persuasive in speech and as taking God to witness
    his heart, yet opposing the addressee and spreading disorder that lays waste fields
    and flocks.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:16
  text: When this disorder-making man is told to fear God, pride in sin seizes him,
    and Hell is named as his destination.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:17
  text: Another man is described as selling his very self out of desire to please
    God.
  category: action
  evidence_refs:
  - ev:12
- id: obs:18
  text: Believers are told to enter completely into the true religion and not follow
