  quote_or_summary: New moons are fixed periods for human service and Pilgrimage;
    piety is fear of God and entering houses by their doors, not by the back.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:4
  type: summary
  locator: 19478-19487
  quote_or_summary: Rules for fighting those who fight the community, not attacking
    first, expelling those who expelled them, and avoiding attack at the sacred Mosque
    unless attacked there.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:5
  type: summary
  locator: 19489-19493
  quote_or_summary: Fighting continues until civil discord ceases and worship is God's;
    sacred month and sacred precincts are under reprisal safeguards.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:6
  type: summary
  locator: 19495-19504
  quote_or_summary: Instruction to give for God's cause, avoid ruin, complete Pilgrimage
    and Visitation, send an offering if hemmed in, delay shaving until sacrifice,
    and use fasting, alms, or offering for sickness or head ailment.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:7
  type: summary
  locator: 19505-19513
  quote_or_summary: 'Further pilgrimage rules: offering requirements, three days of
    fasting during Pilgrimage and seven after return if no offering is available,
    known pilgrimage months, abstention from women, transgression, and wrangling,
    and fear of God as best provision.'
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:8
  type: summary
  locator: 19515-19521
  quote_or_summary: Pilgrims may seek increase from the Lord, move swiftly from Arafat,
    remember God near the holy monument, pass where the people pass, and ask God's
    pardon.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:9
  type: summary
  locator: 19523-19535
  quote_or_summary: After holy rites, remember God intensely; prayers are contrasted
    for this world only versus good in this world and the next and protection from
    fire; God reckons swiftly; people are gathered to God.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:10
  type: summary
  locator: 19537-19544
  quote_or_summary: A man impresses with speech about present life and invokes God
    as witness, yet opposes the addressee and spreads disorder, laying waste fields
    and flocks.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:11
  type: summary
  locator: 19546-19548
  quote_or_summary: When told to fear God, the disorder-making man is seized by pride
    in sin and is assigned Hell as a wretched couch.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:12
  type: summary
  locator: 19550-19552
  quote_or_summary: Another man sells his very self out of desire to please God, and
    God is good to His servants.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:13
  type: summary
  locator: 19554-19556
  quote_or_summary: Believers are told to enter completely into true religion and
    not follow Satan's steps, because he is their declared enemy.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:14
  type: summary
  locator: 19558-19562
  quote_or_summary: If people lapse after clear signs have come, they are to know
    that God is Mighty and Wise.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:15
  type: summary
  locator: 19564-19566
  quote_or_summary: God is described as coming overshadowed with clouds, with the
    angels also, when doom is sealed and all things return to God.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; summarized evidence.
- id: ev:16
  type: summary
  locator: 19568-19571
  quote_or_summary: The Children of Israel received many clear signs; altering God's
    boon after receiving it brings severe punishment; unbelieving mockers are contrasted
    with God-fearers on the day of resurrection.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
