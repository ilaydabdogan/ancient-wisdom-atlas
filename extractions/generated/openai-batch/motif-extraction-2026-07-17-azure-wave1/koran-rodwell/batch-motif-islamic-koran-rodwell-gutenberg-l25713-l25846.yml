canonical_text:
  quote: ''
  summary: The passage exhorts the people of Medina, desert Arabs, and believers not
    to abandon God's Apostle, presents hardship, almsgiving, and travel in God's cause
    as recorded good works rewarded by God, directs that not all believers should
    march to war because some must learn and warn their people, commands rigor against
    neighboring infidels, describes revelation as increasing believers' faith while
    increasing the doubt of those with diseased hearts, and closes with the Apostle's
    compassion and trust in God, possessor of the Glorious Throne. The notes add historical
    and exegetical comments on the sura, battles, persons, and traditions.
  language: English
  quote_policy: summarized
