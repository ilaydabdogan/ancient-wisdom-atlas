canonical_text:
  quote: ''
  summary: The passage presents God as creator, sustainer, giver of death and life,
    and final judge. It urges reflection on creation, former peoples, natural signs,
    and human dependence; commands worship, prayer, monotheism, and almsgiving; rejects
    partner-gods; and describes resurrection, separation at the Hour, reward for believers,
    and torment or loss for unbelievers.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: God is said to have created the heavens, the earth, and what lies between
    them for a serious end and a fixed term.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The audience is asked to journey through the land and observe the end of earlier
    peoples who were stronger, cultivated and inhabited the land, received apostles
    with proofs, and wronged themselves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage states that evil was the end of evil-doers because they treated
    God's signs as lies and mocked them.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: God is said to bring creation forth, cause it to return again, and bring people
    back to Him.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: On the arrival of the Hour, the guilty are struck dumb, have no intercessors
    among the gods they joined with God, deny those gods, and people are separated
    from one another.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: Those who believed and did right are described as enjoying themselves in a
    flowery mead, while those who disbelieved and denied the signs and next life are
    given over to torment.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: The audience is instructed to glorify God in the evening and morning, and
    praise is assigned to Him in heaven and earth at twilight and noon.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: God is said to bring the living out of the dead and the dead out of the living,
    to quicken the dead earth, and to bring people forth in the same way.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Human creation from dust, the creation of wives from the same species, love
    and tenderness between spouses, variety of tongues and colour, sleep, and seeking
    God's bounties are listed as signs.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Lightning is shown as a source of awe and hope, and rain is sent from heaven
    to give life to the dead earth.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: Heaven and earth are said to stand firm at God's bidding, and one summons
    will bring people out of the earth.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: The passage rejects partner-gods through an analogy about slaves not sharing
    equally in what has been bestowed, and it asks whether any mandate supports what
    people join with God.
  category: speech
  evidence_refs:
  - ev:10
  - ev:12
- id: obs:13
  text: The audience is commanded to set its face toward the God-made faith, turn
    to God, fear Him, observe prayer, avoid joining gods with God, and avoid splitting
    religion into sects.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: When evil touches people they call on their Lord, but after tasting mercy
    some join other gods with Him; people rejoice in mercy and despair at evil, while
    God gives supplies fully or sparingly as He pleases.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: Kin, the poor, and the wayfarer are to receive their due; usury receives no
    increase from God, while alms given while seeking God's face are doubled.
  category: action
  evidence_refs:
  - ev:13
- id: obs:16
  text: God is said to have created people, fed them, to cause them to die, and to
    make them alive; companion-gods are said to be unable to do these things.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:17
  text: Destruction has appeared by land and sea because of what human hands have
    wrought, so that people may taste some fruit of their deeds and turn to God.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:18
  text: Before an unavoidable day, people are warned to face the right faith; on that
    day they are parted in two, with unbelief upon unbelievers and reward and couches
    of repose for the righteous.
  category: sequence
  evidence_refs:
  - ev:16
