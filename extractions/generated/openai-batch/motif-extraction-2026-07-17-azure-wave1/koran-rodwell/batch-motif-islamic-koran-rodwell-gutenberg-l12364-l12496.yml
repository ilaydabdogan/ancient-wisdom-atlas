candidate_motifs:
- id: motif:1
  label: Return to creator and resurrection from earth
  taxonomy_refs:
  - resurrection
  basis: The passage repeatedly says God brings creation forth and returns it, brings
    people back to Him, quickens dead earth, summons people out of the earth, and
    will make people alive after death.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:9
  - ev:14
  confidence: high
  cautions: The passage asserts resurrection directly; no additional journey geography
    is supplied.
- id: motif:2
  label: Final divine judgment with separation of righteous and guilty
  taxonomy_refs:
  - divine_judgment
  basis: 'The Hour brings separation: the guilty are silenced and lack intercessors,
    believers are placed in delight, deniers are assigned torment, and a later day
    parts people in two with reward for the righteous.'
  evidence_refs:
  - ev:4
  - ev:16
  confidence: high
  cautions: The passage gives outcomes but not a detailed tribunal scene.
- id: motif:3
  label: Dead earth revived as a sign of life after death
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The dead earth is quickened and rain gives it life; the passage explicitly
    connects this revival with people being brought forth.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: high
  cautions: This is a natural sign used for resurrection; it is not a dying-and-returning
    deity narrative.
- id: motif:4
  label: Ruins or fate of former peoples as moral warning
  taxonomy_refs:
  - divine_judgment
  - wisdom
  basis: The audience is twice told to journey through the land and see the end of
    previous peoples, especially those who denied signs or joined other gods with
    God.
  evidence_refs:
  - ev:2
  - ev:15
  confidence: medium
  cautions: The passage does not name the former peoples or describe their destruction
    in detail.
- id: motif:5
  label: Signs in creation for reflection and understanding
  taxonomy_refs:
  - wisdom
  basis: Creation, human origin, spouses, love, diversity of tongues and colour, sleep,
    lightning, rain, and the stability of heaven and earth are repeatedly called signs
    for those who reflect, hearken, understand, or believe.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:8
  - ev:9
  confidence: high
  cautions: The motif is discursive and didactic rather than a narrative episode.
- id: motif:6
  label: Almsgiving rewarded with divine increase
  taxonomy_refs:
  - sacred_exchange
  basis: The passage contrasts usury, which has no increase from God, with alms given
    while seeking God's face, which are doubled.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The taxonomy label is broader than the passage; the passage frames the
    exchange specifically as ethical giving and divine recompense.
- id: motif:7
  label: Failed intercession and powerless partner-gods
  taxonomy_refs:
  - divine_judgment
  basis: At the Hour, the joined gods provide no intercessors and are denied; elsewhere
    the companion-gods are said to be unable to create, feed, cause death, or make
    alive.
  evidence_refs:
  - ev:4
  - ev:12
  - ev:14
  confidence: high
  cautions: The passage is polemical and monotheistic; it does not narrate an independent
    myth of the partner-gods.
