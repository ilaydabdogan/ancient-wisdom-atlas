  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Satan whispers to Adam and his wife in order to show them their hidden nakedness,
    and says the tree was forbidden only to prevent them from becoming angels or immortals.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Satan swears that he counsels them aright, beguiles them by deceits, and after
    they taste the tree their nakedness appears; they begin sewing garden leaves upon
    themselves.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: Their Lord calls to them about the forbidden tree and Satan as declared enemy;
