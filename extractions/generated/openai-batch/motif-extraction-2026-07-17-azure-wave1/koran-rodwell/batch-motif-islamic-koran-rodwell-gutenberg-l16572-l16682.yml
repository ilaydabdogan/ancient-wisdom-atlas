  summary: The passage recounts a divine command to a banished figure, Adam and his
    wife dwelling in Paradise with a prohibition concerning a tree, Satan's deception
    leading to their nakedness and descent to earth, and later admonitions to the
    children of Adam. It also describes moral commandments, messengers who rehearse
    divine signs, appointed times for nations, resurrection and judgment, the Fire
    for deniers, Paradise with rivers for believers, and dialogue between the inmates
    of Paradise and the Fire.
  language: English
