literal_observations:
- id: obs:1
  text: A speaker commands a scorned and banished one to go forth and declares that
    hell will be filled with that figure and all who follow him.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Adam and his wife are told to dwell in Paradise, eat freely, and not approach
