    forgiveness and pity.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: They are told to get down, to be enemies to one another, and to dwell on earth
    for a season; on earth they will live and die, and from it they will be taken
    forth.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: The children of Adam are told that raiment has been sent down to hide nakedness
    and that the raiment of piety is best.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:8
  text: The children of Adam are warned not to let Satan trouble them as he drove
    their parents from the Garden; Satan and his comrades see humans from where humans
    do not see them.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:9
  text: The passage rejects attributing filthy deeds to God's command and enjoins
    what is right, sincere religion, proper apparel at mosques, moderation in eating
    and drinking, and prohibitions against open or secret filthy actions, iniquity,
    unjust violence, unauthorized association with God, and speaking of God without
    knowledge.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: Every nation is said to have a set time that cannot be delayed or advanced
    when it comes.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: Apostles from among the children of Adam are said to rehearse divine signs;
