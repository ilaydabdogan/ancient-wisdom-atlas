  quote: ''
  summary: The passage gives instructions and warnings on almsgiving, usury, debt
    documentation, testimony, pledges, divine ownership, divine reckoning, faith in
    God and His messengers, and prayer for mercy, forgiveness, protection, and victory.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Guidance is said not to be Muhammad's affair; God guides whom He pleases,
    and alms given seeking God's face are repaid without wrong.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Some poor persons are described as constrained by fighting for God's cause,
    unable to seek riches abroad, modest enough to be mistaken for rich, and not importunate
    in asking.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those who give substance in alms by night and day, privately and publicly,
    are promised reward with their Lord and freedom from fear and grief.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those who consume usury are said to rise in the resurrection like one infected
    by Satan's touch; God is said to have allowed selling and forbidden usury.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: A person who abstains after warning is granted pardon for the past, while
    those who return to usury are assigned to the fire forever.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:6
  text: God is said to bring usury to nothing and to increase alms; believers who
    do right, pray, and pay the legal impost are promised reward and freedom from
    fear and grief.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Believers are commanded to abandon remaining usury; refusal is framed as war
    from God and His apostle, while repentance preserves the principal without wronging
    or being wronged.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:8
  text: If a debtor has difficulty paying, delay is prescribed until ease; remitting
    the debt as alms is described as better.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: A day is announced when people return to God and every soul is rewarded according
    to its desert without injustice.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Debt contracts at fixed dates are to be written down by a notary; the debtor
    dictates, or a friend dictates for one who is foolish, weak, or unable; witnesses
    are required.
  category: action
  evidence_refs:
  - ev:8
- id: obs:11
  text: On a journey without a notary, pledges are to be taken; one entrusted must
    restore the trust, and evidence is not to be refused.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: Whatever is in the heavens and earth is said to belong to God; what is disclosed
    or concealed in minds is reckoned by God, who forgives or punishes whom He pleases.
  category: relationship
  evidence_refs:
  - ev:10
- id: obs:13
  text: The apostle and the faithful are described as believing in God, His angels,
    His books, and His apostles, making no distinction between His apostles, and saying
    that they have heard and obeyed.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:14
  text: God is said not to burden any soul beyond its power; the speakers pray not
    to be punished for forgetfulness or sin, not to bear an unbearable load, and to
    receive forgiveness, pity, protection, and victory.
  category: speech
  evidence_refs:
  - ev:12
