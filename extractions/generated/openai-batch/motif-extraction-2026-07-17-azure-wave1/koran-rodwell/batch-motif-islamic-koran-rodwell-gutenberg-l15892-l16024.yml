  category: sequence
  evidence_refs:
  - ev:2
- id: obs:4
  text: After Noah, apostles are sent to their peoples with credentials, but the peoples
    do not believe what they had previously denied.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: Moses and Aaron are sent to Pharaoh and his nobles with signs, and the truth
    they bring is called clear sorcery.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
