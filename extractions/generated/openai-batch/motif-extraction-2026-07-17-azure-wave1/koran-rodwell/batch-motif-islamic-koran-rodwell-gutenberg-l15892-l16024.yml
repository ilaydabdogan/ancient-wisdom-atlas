  category: relationship
  evidence_refs:
  - ev:6
- id: obs:9
  text: Moses tells his people to trust in God if they are Muslims, and they pray
    not to be abandoned to trial from an unjust people and to be delivered by mercy.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:10
  text: A revelation commands Moses and Aaron to provide houses for their people in
    Egypt, make a Kebla in their houses, observe prayer, and proclaim good tidings
    to believers.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: Moses prays concerning Pharaoh and his nobles' splendour and riches, asks
    that their riches be confounded and hearts hardened, and receives the answer that
    the prayer of both is heard.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: The children of Israel are led through the sea, while Pharaoh and his hosts
    pursue them in hostile eagerness until drowning overtakes Pharaoh.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: When drowning overtakes him, Pharaoh professes belief in the God of the children
