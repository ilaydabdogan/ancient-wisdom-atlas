  quote: ''
  summary: The passage recounts Noah's warning, rejection, rescue in the ark, and
    the drowning of deniers; a sequence of later apostles; Moses and Aaron confronting
    Pharaoh, his nobles, and magicians; the trust and prayers of Moses' people; the
    sea crossing, Pharaoh's drowning and preserved body as a sign; the settlement
    and later disputes of the children of Israel; the deliverance of the people of
    Jonas after belief; and final exhortations to worship God alone and heed truth.
  language: English
  quote_policy: summarized
