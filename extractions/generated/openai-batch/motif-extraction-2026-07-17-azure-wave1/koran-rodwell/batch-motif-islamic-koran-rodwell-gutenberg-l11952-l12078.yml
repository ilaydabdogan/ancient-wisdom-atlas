canonical_text:
  quote: ''
  summary: 'The passage warns those who plot mischief that God may punish unexpectedly,
    depicts all created beings and angels prostrating before God, rejects worship
    of associates and idols, criticizes the attribution of daughters to God, describes
    delayed judgment and fire, recalls apostles and the revealed Book, and presents
    natural and social provisions as signs: rain reviving dead earth, milk, fruits,
    the bee and its healing fluid, human birth and old age, spouses and descendants,
    parables of unequal figures, the Last Hour, birds held aloft, and tents and animal
    products for dwelling and travel.'
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those who have plotted mischief are warned that God may make the earth cleave
    under them, bring unexpected chastisement, seize them in their movements, or afflict
    them with a slowly wasting scourge.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Created things are described as turning their shadows right and left and prostrating
    before God; moving things and angels also prostrate and obey.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage reports a divine command not to take two gods, asserting one God,
    divine ownership of heaven and earth, and unceasing service due to God.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: People in distress turn to God for help, but after relief some join associates
    with their Lord and set apart shares of bounty for idols.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The passage says some people ascribe daughters to God while they themselves
    react with sadness and shame when a daughter is born to them, even considering
    whether to bury her in the dust.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:6
  text: God is said to delay punishment until an appointed term, after which people
    cannot delay or advance it; fire is said to await those who lie about their lot.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Apostles were sent to earlier nations; Satan is said to have prepared their
    work for them; the Book is sent down to clarify disputes and serve as guidance
    and mercy for believers.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:8
  text: Water sent down from heaven gives life to the earth after it has been dead.
  category: action
  evidence_refs:
  - ev:6
- id: obs:9
  text: Cattle provide pure milk between dregs and blood; palm and vine provide wine
    and healthful nutriment.
  category: object
  evidence_refs:
  - ev:6
- id: obs:10
  text: The Lord teaches the bee to make houses in mountains, trees, and human-built
    hives, to feed on fruits, and to follow the Lord’s paths; a fluid of varying hues
    from the bee yields medicine for humans.
  category: action
  evidence_refs:
  - ev:7
- id: obs:11
  text: Humans are created by God, later taken to God, and some are carried into old
    age when previous knowledge is no longer known.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: God gives differing supplies of life, wives, sons, grandsons, and good things;
    the passage criticizes failure to share abundance with slaves and worship of beings
    unable to provide food.
  category: relationship
  evidence_refs:
  - ev:8
- id: obs:13
  text: 'Two comparisons are set forth: an owned slave with no power is contrasted
