candidate_motifs:
- id: motif:1
  label: divinely beloved replacement community
  taxonomy_refs:
  - divine_beloved
  basis: The passage states that if some believers desert the religion, God will raise
    a people loved by Him and loving Him, who contend in God’s cause.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The passage gives an exhortational scenario rather than a developed narrative
    of replacement.
- id: motif:2
  label: bounded sacred allegiance
  taxonomy_refs: []
  basis: The passage defines proper protection and friendship around God, the Apostle,
    and believers, while warning against alliances with scoffers and unbelievers.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: No specific taxonomy reference is supplied for alliance-boundary motifs.
- id: motif:3
  label: punitive animal transformation under divine curse
  taxonomy_refs:
  - divine_judgment
  basis: Those under God’s curse and anger are said to include some changed into apes
    and swine.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The transformation is imposed as divine punishment; it is not presented
    as voluntary shapeshifting.
- id: motif:4
  label: divine quenching of war fire
  taxonomy_refs:
  - divine_judgment
  basis: The passage says that whenever they kindle a beacon fire for war, God quenches
    it, while also placing enmity and hatred until Resurrection.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The war-fire image is brief and embedded in polemical admonition.
- id: motif:5
  label: covenant obedience brings forgiveness and abundance
  taxonomy_refs:
  - covenant
  - sacred_exchange
  basis: The People of the Book are promised removal of sins, gardens, and good things
    if they believe, fear God, and observe the Law, the Evangel, and what was sent
    down.
  evidence_refs:
  - ev:8
  - ev:10
  confidence: medium
  cautions: The term covenant is explicit elsewhere in the passage for Israel; the
    conditional reward in this scene is closely related but not itself labeled covenant
    in the wording.
- id: motif:6
  label: prophetic proclamation under divine protection
  taxonomy_refs:
  - wisdom
  basis: The Apostle is commanded to proclaim all revelation from his Lord and is
    promised protection from evil men.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The wisdom taxonomy link is broad, based on revelation/proclamation rather
    than a wisdom quest.
- id: motif:7
  label: covenant people reject and kill messengers
  taxonomy_refs:
  - covenant
  - divine_judgment
  basis: The passage recalls God accepting the covenant of the children of Israel,
    sending Apostles, and those Apostles being treated as liars or slain, followed
    by blindness and deafness.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage summarizes a repeated pattern rather than narrating a single
    messenger episode.
- id: motif:8
  label: afterlife reward and punishment by divine judgment
  taxonomy_refs:
  - divine_judgment
  - resurrection
  basis: The passage contrasts gardens of delight and freedom from fear or grief with
    exclusion from the Garden, the Fire as abode, grievous chastisement, and torment,
    in relation to belief and action.
  evidence_refs:
  - ev:8
  - ev:11
  - ev:13
  - ev:14
  - ev:17
  confidence: high
  cautions: The passage mentions the last day and Resurrection but does not describe
    a journey through the afterlife.
- id: motif:9
  label: prophetic curse for rebellion
  taxonomy_refs:
  - divine_judgment
  basis: Unbelieving children of Israel are said to be cursed by the tongue of David
    and Jesus because of rebellion and transgression.
  evidence_refs:
  - ev:16
  confidence: high
  cautions: The exact curse episode is not narrated in detail here.
- id: motif:10
  label: exclusive worship of the one God against elevated figures
  taxonomy_refs: []
  basis: The Messiah is represented as directing worship to God alone, while claims
    about God being the Messiah or the third of three are rejected and linked to chastisement.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  confidence: high
  cautions: No supplied taxonomy reference directly covers monotheistic correction
    or polemic against divine association.
comparison_claims:
- id: claim:1
  claim: 'The passage explicitly uses earlier scriptural figures and communities as
    admonitory precedents: the Law, the Evangel, the children of Israel, David, Jesus,
    and Mary are invoked while addressing the People of the Book and the present believers.'
  claim_level: same_function
  target: scriptural admonition involving Israelite and Christian figures within the
    passage’s own intertextual frame
  evidence_refs:
  - ev:8
  - ev:10
  - ev:12
  - ev:13
  - ev:15
  - ev:16
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an internal comparison supported by names and references in
    the passage; it does not establish a specific source relationship beyond the passage’s
    own claims.
- id: claim:2
  claim: The covenant-with-Israel scene and the conditional call to observe Law, Evangel,
    and revelation perform a shared covenantal warning-and-reward function.
  claim_level: same_function
  target: covenant obedience and covenant breach pattern
  evidence_refs:
  - ev:8
  - ev:10
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage explicitly names covenant only for the children of Israel;
    applying the same function to the wider People of the Book is a cautious structural
    comparison.
