  summary: The passage exhorts believers to loyalty to God, the Apostle, and the faithful;
    warns against making allies of scoffers and unbelievers; addresses the People
    of the Book concerning belief, law, covenant, and conduct; recounts divine curse,
    anger, punitive transformation, prophetic rejection, and afterlife reward or punishment;
    and discusses claims about the Messiah, Mary, and God’s unity.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: If believers desert God’s religion, God will raise up another people who are
    loved by Him and who love Him.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The believers’ protector is identified as God, His Apostle, and believing
    worshippers who pray, give obligatory alms, and bow in worship.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:3
  text: Believers are told not to take as friends those among prior scripture-recipients
    who scoff at their religion, nor unbelievers who deride the call to prayer.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:4
  text: A group under God’s curse and anger is described as having some of them changed
    into apes and swine.
  category: action
  evidence_refs:
  - ev:5
- id: obs:5
  text: Some people are said to come to the believers saying they believe, while entering
    and leaving as unbelievers and concealing things known to God.
  category: action
  evidence_refs:
  - ev:6
- id: obs:6
  text: The passage reports a saying attributed to the Jews that God’s hand is chained,
    and replies that their hands will be chained, that they are cursed for the saying,
    and that God’s hands are outstretched.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:7
  text: God is said to put enmity and hatred among them until the day of Resurrection
    and to quench every beacon fire they kindle for war.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: If the People of the Book believe, fear God, and observe the Law, the Evangel,
    and what was sent down from their Lord, sins will be put away and they will enter
    gardens of delight and receive good things.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: The Apostle is commanded to proclaim all that has been sent down from his
    Lord, with assurance that God will protect him from evil men.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Those who believe, including Jews, Sabeites, and Christians, are promised
    freedom from fear and grief if they believe in God and the last day and do what
    is right.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:11
  text: God accepted the covenant of the children of Israel and sent Apostles to them;
    some Apostles were treated as liars and some were slain.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:12
  text: The Messiah is represented as telling the children of Israel to worship God,
    his Lord and their Lord.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:13
  text: Joining other gods with God is said to result in the Garden being forbidden
    and the Fire becoming the person’s abode.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: The Messiah, Son of Mary, is described as an Apostle; Mary is described as
    just; both are said to have eaten food.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:15
  text: Unbelieving children of Israel are said to have been cursed by the tongue
