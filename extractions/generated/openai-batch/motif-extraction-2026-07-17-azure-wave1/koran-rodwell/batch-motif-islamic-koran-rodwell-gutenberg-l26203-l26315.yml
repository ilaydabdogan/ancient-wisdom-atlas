  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 26274-26281
  quote_or_summary: God accepted the covenant of the children of Israel and sent Apostles;
    some were treated as liars and some slain. The people became blind and deaf, God
    turned to them, and many again became blind and deaf.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
  locator: lines 26282-26287
  quote_or_summary: Claims that God is the Messiah are rejected; the Messiah is quoted
    telling the children of Israel to worship God, his Lord and their Lord; associating
    other gods with God bars the Garden and leads to the Fire.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 26288-26293
  quote_or_summary: Claims that God is the third of three are rejected; one God is
