  quote: from date leaves and tablets of white stone, and from the breasts of men
  summary: The dedication is followed by a preface explaining Rodwell's rationale
    for arranging the Suras chronologically. The passage summarizes an account of
    the collection, custody, standardization, and arrangement of the Koranic text
    after Muhammad's death, naming Abu Bekr, Omar, Zaid, Haphsa, Othman, Hodzeifa,
    and others. It describes variant readings, Othman's standard recension, the burning
    of previous copies, and the translator's judgment that Zaid's non-intervention
    shows honesty while lacking historical criticism.
