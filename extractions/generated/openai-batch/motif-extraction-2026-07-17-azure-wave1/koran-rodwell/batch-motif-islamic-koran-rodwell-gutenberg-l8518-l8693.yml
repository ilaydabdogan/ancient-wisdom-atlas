canonical_text:
  quote: ''
  summary: The passage describes the sudden coming of the Hour, the reversal of ordinary
    friendships, the welcome of God-fearing believers into Paradise, and the permanent
    torment of the wicked in Hell, including their appeal to Malec. It affirms divine
    knowledge, divine sovereignty, angelic recording of secrets, rejection of divine
    offspring, and return to God. The beginning of Sura Djinn then reports a company
    of djinn hearing the Koran, believing in it, rejecting association with God, describing
    prior false speech and human refuge-seeking among djinn, and recounting guarded
    heavens with flaming darts that prevent illicit listening.
  language: English
  quote_policy: summarized
