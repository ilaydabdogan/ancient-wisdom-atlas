  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:5
  type: summary
  locator: lines 16334-16335
  quote_or_summary: If the addressed messenger is treated as an impostor, apostles
    before him were also treated as impostors; all things return to God.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:6
  type: summary
  locator: lines 16337-16338
  quote_or_summary: Humans are warned not to let present life deceive them and not
    to let the Deceiver deceive them about God.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:7
  type: quote
  locator: lines 16340-16341
  quote_or_summary: "“Satan is your foe” and calls followers “that they may become
    inmates of the flame.”"
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short excerpt.
- id: ev:8
  type: summary
  locator: lines 16343-16345
  quote_or_summary: Unbelievers receive terrible punishment; believers and doers of
    good works receive mercy and a great reward.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:9
  type: summary
  locator: lines 16347-16350
  quote_or_summary: The passage contrasts one whose evil deeds seem good with one
    who sees rightly, and says God guides and misleads whom He will.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:10
  type: quote
  locator: lines 16352-16355
  quote_or_summary: Winds raise clouds, dead land receives life, and “So shall be
    the resurrection.”
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short excerpt.
- id: ev:11
  type: summary
  locator: lines 16356-16359
  quote_or_summary: The good word rises to God; the righteous deed is exalted; evil
    plotters face severe punishment and vain plots.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:12
  type: summary
  locator: lines 16361-16365
  quote_or_summary: God created humans from dust, then life-germs, then two sexes;
    conception, birth, and age occur with God’s knowledge and according to the Book.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:13
  type: summary
  locator: lines 16366-16370
  quote_or_summary: Two seas differ, one fresh and one salt; both yield fish and ornaments,
    and ships cleave their waters for God’s bounties.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:14
  type: summary
  locator: lines 16371-16375
  quote_or_summary: God makes night enter day and day enter night, regulates sun and
    moon, and the gods called beside Him lack power over a date-stone husk.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:15
  type: summary
  locator: lines 16377-16380
  quote_or_summary: Invoked gods do not hear or answer, and on the day of resurrection
    they will disown being joined with God.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:16
  type: summary
  locator: lines 16381-16386
  quote_or_summary: Humans are poor and need God; God is rich and could sweep humans
    away and bring a new creation.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:17
  type: summary
  locator: lines 16388-16393
  quote_or_summary: No soul bears another’s burden; even near kin cannot carry it;
    prayer and purification are mentioned, and final gathering is unto God.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:18
  type: summary
  locator: lines 16395-16401
  quote_or_summary: Blind and seeing, darkness and light, shade and hot wind, living
    and dead are contrasted; those in graves cannot be made to hearken.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:19
  type: summary
  locator: lines 16403-16404
  quote_or_summary: The addressed messenger is sent with truth as bearer of good tidings
    and warner; every people has had a warner.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:20
  type: summary
  locator: lines 16406-16409
  quote_or_summary: Earlier peoples treated apostles as liars despite proofs, Scriptures,
    and an enlightening Book.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:21
  type: summary
  locator: lines 16410-16410
  quote_or_summary: God says He chastised the unbelievers and refers to the greatness
    of His vengeance.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:22
  type: summary
  locator: lines 16412-16417
  quote_or_summary: Water from heaven produces varied fruits; mountains, humans, reptiles,
    and animals have varied hues; knowledgeable servants fear God.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:23
  type: summary
  locator: lines 16419-16424
  quote_or_summary: Those who recite the Book, pray, and give alms may hope for imperishable
    commerce; God will pay and increase them.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source metadata; short summary.
- id: ev:24
  type: summary
  locator: lines 16426-16428
  quote_or_summary: The revealed Book is described as the truth, confirmatory of previous
