    transfer of one soul’s burden to another, and points to final gathering and chastisement
    of unbelievers.
  evidence_refs:
  - ev:8
  - ev:17
  - ev:21
  confidence: high
  cautions: The passage states judgment themes explicitly; the extraction does not
    identify a detailed afterlife geography beyond flame and gathering.
- id: motif:2
  label: Resurrection figured by revival of dead earth
  taxonomy_refs:
  - resurrection
