canonical_text:
  quote: ''
  summary: The passage begins with translator notes on Saba, Yemenite trade, and earlier
    accusations about Muhammad, then presents Sura XXXV, “The Creator, or The Angels.”
    The sura praises God as maker of heaven and earth, describes angels as winged
    envoys, warns humans against deception by Satan and powerless invoked deities,
    contrasts believers and unbelievers, presents natural signs such as rain reviving
    dead earth, the two seas, day and night, and varied mountains and creatures, and
    affirms resurrection, final gathering, reward, punishment, prophetic warning,
    and the revealed Book’s confirmation of previous Scriptures.
  language: English
  quote_policy: summarized
