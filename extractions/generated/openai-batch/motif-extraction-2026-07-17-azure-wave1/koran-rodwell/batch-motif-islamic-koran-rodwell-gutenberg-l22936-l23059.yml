canonical_text:
  quote: ''
  summary: The passage warns hypocrites, unbelievers, and those who divide belief
    in God from belief in the apostles; contrasts punishment with repentance and reward;
    recalls demands and covenant violations associated with Moses and the People of
    the Book; denies that Jesus was slain or crucified and says God took him up; lists
    earlier prophets who received revelation; and states that God and angels witness
    the revelation sent down to the addressee.
  language: English
  quote_policy: summarized
