candidate_motifs:
- id: motif:1
  label: Divine judgment with punishment and reward
  taxonomy_refs:
  - divine_judgment
  basis: The passage repeatedly contrasts divine punishment for hypocrites, infidels,
    and wrongdoers with reward for the faithful, and names judgment on the day of
    resurrection.
  evidence_refs:
  - ev:4
  - ev:6
  - ev:8
  - ev:17
  - ev:21
  confidence: high
  cautions: The extraction identifies a broad motif family; the passage presents doctrinal
    warnings rather than a single narrative episode.
- id: motif:2
  label: Covenant made, commanded, and broken
  taxonomy_refs:
  - covenant
  basis: The passage says a strict covenant was received, associates it with the uplifted
    mountain, gate entry, and Sabbath command, and later states that the covenant
    was broken.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage summarizes remembered covenant episodes rather than narrating
    them in full.
- id: motif:3
  label: Ascent or being taken up to God
  taxonomy_refs:
  - ascent
  basis: After denying that Jesus was really slain, the passage states that God took
    him up to Himself.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The passage gives a concise doctrinal statement and does not describe
    the mechanics or route of ascent.
- id: motif:4
  label: Resurrection-day witness and accountability
  taxonomy_refs:
  - resurrection
  - divine_judgment
  basis: The passage names the day of resurrection as a time of judgment and says
    Jesus will be a witness against the People of the Book on that day.
  evidence_refs:
  - ev:4
  - ev:15
  confidence: high
  cautions: Resurrection is referenced in relation to judgment and witness; no extended
    afterlife journey is described.
- id: motif:5
  label: Heavenly scripture and repeated prophetic revelation
  taxonomy_refs:
  - wisdom
  basis: The People of the Book ask for a Book from Heaven, and the passage later
    lists revelations to the addressee and to earlier prophets, including Psalms to
    David.
  evidence_refs:
  - ev:9
  - ev:18
  - ev:20
  confidence: medium
  cautions: The available taxonomy lacks a specific revelation/scripture motif; the
    assignment to wisdom is approximate and should be reviewed.
- id: motif:6
  label: Idol worship after signs
  taxonomy_refs: []
  basis: The passage says the calf was taken as an object of worship after clear tokens
    had come to the group.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: No available taxonomy reference directly corresponds to this motif in
    the supplied list.
- id: motif:7
  label: Divine fire as punishment
  taxonomy_refs:
  - divine_judgment
  basis: The passage describes a fire-storm taking hold after the demand to see God
    and places hypocrites in the lowest abyss of the fire.
  evidence_refs:
  - ev:6
  - ev:9
  confidence: medium
  cautions: Although fire appears as an image of punishment, the available motif taxonomy
    does not include a general punitive-fire category apart from divine judgment.
comparison_claims:
- id: claim:1
  claim: The passage explicitly compares the request made of the addressee for a Book
    from Heaven with an earlier, greater request made of Moses to show God plainly.
  claim_level: same_function
  target: Mosaic request for direct divine manifestation compared with request for
    heavenly scripture
  evidence_refs:
  - ev:9
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal textual comparison made by the passage; it does
    not by itself establish historical contact or external parallel development.
- id: claim:2
  claim: The passage presents the revelation sent to the addressee as functionally
