canonical_text:
  quote: ''
  summary: The passage presents scenes of final judgment, punishment, garden reward,
    warnings from created signs, examples of earlier peoples punished for excess,
    human testing through wealth, the crushing judgment day, the return of the tranquil
    soul to Paradise, bodily resurrection, cosmic signs, self-witness, death, and
    divine power to quicken the dead.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: On the day that shall overshadow, some faces are downcast, travailing, worn,
    burned by scorching fire, made to drink from a fiercely boiling fountain, and
    given Darih as food that neither fattens nor satisfies hunger.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:14
- id: obs:2
  text: On the same day, other faces are joyous and well pleased with past labours
    in a lofty garden containing no vain discourse, a gushing fountain, raised couches,
    placed goblets, ordered cushions, and spread carpets.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The addressees are directed to look at clouds, heaven, mountains, and earth
    as created, upraised, rooted, and outspread.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The addressee is told to warn only and is said to have no authority over those
    addressed; whoever turns back and disbelieves will be punished, and all will return
    to God for reckoning.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: The Daybreak passage opens with oaths by daybreak, ten nights, double and
    single, and the night as it pursues its course.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: Ad at Irem, Themoud, and Pharaoh are named as examples of those with whom
    the Lord dealt after they committed excesses and multiplied wickedness; the Lord
    let loose chastisement on them and is described as standing on a watch tower.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Man is described as interpreting divine bounty as honour and limited gifts
    as divine disdain, while the addressed people fail to honour the orphan, fail
    to urge feeding the poor, devour inheritances greedily, and love riches greatly.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: When the earth is crushed, the Lord comes, angels stand rank on rank, Hell
    is moved up, man remembers and regrets not having prepared, and God is said to
    punish and bind uniquely on that day.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:9
  text: A soul at rest is addressed and commanded to return to its Lord pleased and
    pleasing, to enter among God's servants, and to enter Paradise.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Resurrection passage states that bones can be reunited and even fingertips
    replaced, while denial is followed by signs including a dazzled eye, darkened
    moon, sun and moon together, the cry for a place to flee, and the declaration
    that there is no refuge except with the Lord.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:11
  text: On that day man is told all that he has done first and last and is described
    as an eyewitness against himself, even if he puts forth a plea.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:12
  text: A parenthetical address tells the recipient not to move the tongue in haste
    to master the revelation and says that collecting, reciting, and making it clear
    belong to the speaking divine plurality.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:13
  text: Faces on that day are described as beaming while looking toward their Lord,
    while other faces are dismal; the passage then describes the soul coming into
    the throat, a cry for a charm, the sensed time of departure, and the person being
    driven to the Lord.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:14
  text: Human origin is described as an embryo, then thick blood formed and fashioned
    by God, and made into twain, male and female; the passage asks whether God is
    powerful enough to quicken the dead.
  category: sequence
  evidence_refs:
  - ev:13
