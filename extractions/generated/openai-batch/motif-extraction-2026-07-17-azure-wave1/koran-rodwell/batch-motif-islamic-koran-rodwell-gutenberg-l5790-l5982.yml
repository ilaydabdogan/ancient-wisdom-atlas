canonical_text:
  quote: ''
  summary: 'The passage closes one sura with scenes of judgment, Hell, Paradise, destroyed
    generations, creation without weariness, ritual praise, and resurrection from
    graves. It then opens Sura XX with divine sovereignty, the sending of the Koran
    as warning, and the story of Moses: he sees a fire, is called in the holy valley,
    receives signs of the staff-serpent and white hand, is sent to Pharaoh, asks for
    Aaron as helper, and is reminded of his preservation as an infant in an ark on
    the water and later trials.'
  language: English
  quote_policy: summarized
