  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:6
  type: summary
  locator: lines 10116-10117
  quote_or_summary: The instructions are called part of the wisdom revealed by the
    Lord; setting up another god with God leads to being cast into Hell.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:7
  type: summary
  locator: lines 10119-10120
  quote_or_summary: The passage challenges the claim that God gave sons to the addressees
    and took daughters from among the angels, calling it a dreadful saying.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:8
  type: summary
  locator: lines 10130-10132
  quote_or_summary: The seven heavens, the earth, and all within them praise God,
    though their utterances are not understood by humans.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:9
  type: summary
  locator: lines 10134-10140
  quote_or_summary: When the Koran is recited, a dark veil is placed between the reciter
    and unbelievers in the life to come; coverings are placed over their hearts and
    heaviness in their ears, and they flee when the One Lord is named.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:10
  type: summary
  locator: lines 10142-10149
  quote_or_summary: The wicked whisper that the audience follows an enchanted man
    and ask whether they will be raised as a new creation after becoming bones and
    dust.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:11
  type: summary
  locator: lines 10151-10155
  quote_or_summary: The reply says resurrection would occur even if they were stones,
    iron, or something harder, because the one who created them at first will bring
    them back.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:12
  type: summary
  locator: lines 10156-10157
  quote_or_summary: On that day God will call people forth; they will answer by praising
    Him and think they had tarried only a little while.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:13
  type: quote
  locator: lines 10159-10160
  quote_or_summary: '"Satan would stir up strifes among them, for Satan is man''s
    avowed foe."'
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; short quotation.
- id: ev:14
  type: summary
  locator: lines 10165-10166
  quote_or_summary: God has full knowledge of the heavens and earth, has given higher
    gifts to some prophets than to others, and gave the Psalter to David.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:15
  type: summary
  locator: lines 10168-10173
  quote_or_summary: Those invoked as gods beside God cannot relieve trouble; they
    themselves desire union or nearness with their Lord and hope for mercy while fearing
    chastisement.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:16
  type: summary
  locator: lines 10175-10176
  quote_or_summary: No city will avoid destruction before the day of Resurrection
    or grievous chastisement; this is written in the Book.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:17
  type: summary
  locator: lines 10178-10181
  quote_or_summary: Miracles were not sent because earlier peoples treated them as
    lies; Themoud received the she-camel before their eyes and maltreated her; miracles
    are sent to strike terror.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:18
  type: summary
  locator: lines 10183-10186
  quote_or_summary: The Lord is said to be round about mankind; a shown vision and
    the cursed tree of the Koran are ordained for dispute, and terror increases wickedness.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:19
  type: summary
  locator: lines 10188-10190
  quote_or_summary: The angels are commanded to prostrate before Adam; all prostrate
    except Eblis, who asks whether he should bow before one created of clay.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:20
  type: summary
  locator: lines 10192-10193
  quote_or_summary: Eblis says Adam has been honored above him and asks for respite
    until the day of Resurrection, promising to destroy Adam's offspring except a
    few.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:21
  type: summary
  locator: lines 10195-10200
  quote_or_summary: Eblis is told to begone; Hell will be recompense for those who
    follow him, and he may entice by voice, horsemen, footmen, partnership in riches
    and children, and promises that are deceitful.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:22
  type: quote
  locator: lines 10202-10203
  quote_or_summary: '"As to my servants, no power over them shalt thou have; And thy
    Lord will be their sufficient guardian."'
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; short quotation.
- id: ev:23
  type: summary
  locator: lines 10205-10210
  quote_or_summary: God speeds ships on the sea for people to seek His abundance;
    during misfortune at sea only God remains, and after He brings people safely to
    dry land they distance themselves from Him.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:24
  type: summary
  locator: lines 10212-10214
  quote_or_summary: The addressees are warned that God may cleave the sides of the
    earth or send a whirlwind charged with sands, leaving them with no protector.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; concise summary.
- id: ev:25
  type: summary
  locator: lines 10125-10129
  quote_or_summary: If there were other gods with God, they would seek occasion against
    the occupant of the throne; God is exalted above such claims.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
