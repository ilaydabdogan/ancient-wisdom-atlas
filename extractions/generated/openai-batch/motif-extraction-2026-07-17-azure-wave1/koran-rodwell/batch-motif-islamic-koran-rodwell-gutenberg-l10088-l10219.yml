candidate_motifs:
- id: motif:1
  label: revealed wisdom law with covenant accountability
  taxonomy_refs:
  - wisdom
  - covenant
  basis: The passage presents moral commands as part of wisdom revealed by the Lord
    and states that covenant, hearing, sight, and heart will be enquired of.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage is didactic and legal rather than narrative; motif labeling
    should remain tied to the revealed-instruction pattern.
- id: motif:2
  label: divine judgment through Hell, chastisement, and destruction
  taxonomy_refs:
  - divine_judgment
  basis: Warnings include Hell for associating other gods, chastisement or destruction
    of cities before Resurrection, and possible earth-cleaving or sand whirlwind.
  evidence_refs:
  - ev:6
  - ev:16
  - ev:21
  - ev:24
  confidence: high
  cautions: Judgment appears in several warnings rather than in one continuous judgment
    scene.
- id: motif:3
  label: resurrection after bones and dust
  taxonomy_refs:
  - resurrection
  basis: Opponents ask whether bones and dust can be raised as a new creation; the
    reply says the first creator will bring them back and that God will call people
    forth on that day.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage argues for resurrection but gives little descriptive detail
    of the afterlife journey.
- id: motif:4
  label: veil over unbelieving perception
  taxonomy_refs:
  - forbidden_knowledge
  basis: A dark veil, coverings over hearts, and heaviness in ears prevent unbelievers
    from understanding the recitation.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The taxonomy ref is approximate; the passage describes blocked understanding
    rather than a quest for forbidden knowledge.
- id: motif:5
  label: rebellious adversary refuses honor to clay-created human
  taxonomy_refs:
  - trickster_boundary
  basis: Eblis refuses to prostrate before Adam, objects to Adam's clay creation,
    and becomes an enticer who makes deceitful promises.
  evidence_refs:
  - ev:19
  - ev:20
  - ev:21
  - ev:22
  confidence: medium
  cautions: The passage portrays Eblis primarily as adversary and deceiver; 'trickster_boundary'
    is a broad comparative category and requires review.
- id: motif:6
  label: miracle sign rejected by an earlier people
  taxonomy_refs:
  - divine_judgment
  basis: The passage says peoples of old treated miracles as lies and cites Themoud
    receiving and maltreating the she-camel.
  evidence_refs:
  - ev:17
  confidence: medium
  cautions: The passage gives only a compressed allusion to the Themoud episode.
- id: motif:7
  label: sea peril, divine rescue, and human ingratitude
  taxonomy_refs:
  - water
  basis: God speeds ships in the sea, remains present when misfortune at sea occurs,
    brings people safe to dry land, and then they distance themselves from Him.
  evidence_refs:
  - ev:23
  confidence: medium
  cautions: Available taxonomy includes water as a symbol rather than a motif family;
    no ark or flood pattern is stated.
- id: motif:8
  label: denial of divine offspring
  taxonomy_refs:
  - divine_parent_child
  basis: The passage rejects the saying that the Lord has prepared sons for humans
    and taken daughters from among the angels.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The motif is framed polemically as a rejected claim, not as an affirmed
    divine parent-child relation.
