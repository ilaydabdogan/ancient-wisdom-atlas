canonical_text:
  quote: ''
  summary: The passage gives moral injunctions, affirms divine provision and accountability,
    rejects other gods and divine offspring, describes universal praise of God, states
    that unbelievers are veiled from understanding the recitation, argues for resurrection
    after death, recalls prophets and rejected signs, narrates Eblis refusing to prostrate
    before Adam and receiving limited permission to tempt humans, and describes God
    saving people at sea while warning of further judgment.
  language: English
  quote_policy: summarized
