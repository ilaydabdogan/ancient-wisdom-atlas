canonical_text:
  quote: ''
  summary: A believing speaker warns his people to follow the right way, contrasts
    the passing present life with the abiding life to come, and rejects being invited
    to deny God. The passage describes God preserving him, the punishment of Pharaoh's
    people, disputes and pleas among those in Hell, divine support for apostles and
    believers, Moses and the Book as guidance, commands to patience and worship, signs
    of creation and human formation, the certainty of the Hour, and the punishment
    of deniers with fire, chains, and entry into Hell.
  language: English
  quote_policy: summarized
