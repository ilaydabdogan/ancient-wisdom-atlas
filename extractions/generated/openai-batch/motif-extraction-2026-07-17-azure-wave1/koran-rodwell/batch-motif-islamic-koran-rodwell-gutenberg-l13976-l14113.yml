- id: motif:1
  label: Divine judgment with differentiated recompense
  taxonomy_refs:
  - divine_judgment
  basis: The passage repeatedly states recompense for evil and right action, God judging
    between servants, the day when witnesses stand, failed pleas of evil-doers, and
    final placement in paradise or Hell.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  - ev:5
  - ev:7
  confidence: high
  cautions: This is an evidence-based motif label for the passage; it does not establish
    historical comparison to any external text.
- id: motif:2
  label: Afterlife return and final abodes
  taxonomy_refs:
  - afterlife_journey_map
  - return
  basis: The speaker says return is unto God; the passage describes the life to come,
    paradise, exposure to fire, requests from Hell's inmates, and entrance through
    Hell's portals.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:7
  confidence: medium
  cautions: The passage gives destinations and conditions rather than a detailed itinerary
    or mapped journey.
- id: motif:3
  label: Resurrectional certainty of the Hour and divine power over life and death
  taxonomy_refs:
  - resurrection
  basis: The Hour is declared certain; God gives life and death; the condemned are
    to know the truth hereafter and are brought back to God.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The excerpt emphasizes the Hour and afterlife accountability; it does
    not provide a detailed bodily resurrection scene.
- id: motif:4
  label: Preservation of the faithful witness
  taxonomy_refs: []
  basis: The believing speaker commits his case to God and is preserved from planned
    evils, while opponents are encompassed by punishment; God also promises to succour
    apostles and believers.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:4
  confidence: high
  cautions: The passage does not narrate the details of the plot or the manner of
    preservation.
- id: motif:5
  label: Revelation as guidance and contested signs
  taxonomy_refs:
  - wisdom
  basis: Moses receives guidance, the children of Israel inherit the Book as guidance
    and warning, apostles come with tokens, and deniers cavil at signs and reject
    the Book and message.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:6
  - ev:7
  confidence: medium
  cautions: The taxonomy ref 'wisdom' is used broadly for guidance and understanding;
    the passage does not personify Wisdom.
- id: motif:6
  label: Moral and cosmic dualities
  taxonomy_refs:
  - duality
  basis: The passage contrasts present and future life, salvation and fire, blind
    and seeing, evil doers and believers, and night and day.
  evidence_refs:
  - ev:1
  - ev:5
  confidence: medium
  cautions: These are didactic contrasts within the passage, not a myth of paired
    beings or sacred twins.
- id: motif:7
  label: Infernal bondage and punitive fire
  taxonomy_refs:
  - divine_judgment
  basis: Deniers are described with collars and chains, dragged into Hell, burned
    in fire, and ordered through the portals of Hell to abide forever.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: Although fire is prominent, the passage depicts infernal punishment rather
    than world-destroying fire.
- id: motif:8
  label: Creation by divine command and ordered provision
  taxonomy_refs: []
  basis: God is described as creator of all things, maker of night and day, giver
