  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  - ev:9
  confidence: high
  cautions: Judgment appears across several sections of the passage; the exact groups
    differ by section.
- id: motif:4
  label: Righteous charity rewarded with Paradise
  taxonomy_refs:
  - sacred_exchange
  basis: The just feed the poor, orphan, and captive for God's sake while seeking
    no human recompense, and God delivers and rewards them with Paradise.
  evidence_refs:
  - ev:5
  - ev:6
  confidence: medium
