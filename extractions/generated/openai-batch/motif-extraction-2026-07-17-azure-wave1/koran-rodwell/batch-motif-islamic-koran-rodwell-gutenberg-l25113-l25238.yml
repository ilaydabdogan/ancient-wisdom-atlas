canonical_text:
  quote: ''
  summary: The passage gives instructions to believers about deference to God and
    the Apostle, reconciliation among warring believers, avoidance of mockery, suspicion,
    spying, and backbiting, and the equality of peoples and tribes before God. It
    distinguishes outward profession of Islam from inward faith. It then begins Sura
    IX with a declaration of immunity from obligations toward certain polytheist treaty
    partners, while preserving treaties with those who have remained faithful, and
    gives commands about conflict, conversion, asylum, and safety after the sacred
    months.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An Apostle of God is said to be among the addressed community, and the passage
    warns that following the community's wishes in many matters would lead to guilt.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:2
  text: God is described as making faith beloved in believers' hearts and making unbelief,
    wickedness, and disobedience hateful to them.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:3
  text: If two bodies of the faithful are at war, the addressed believers are instructed
    to make peace between them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: If one faithful party wrongs another, the community is instructed to fight
    the wronging party until it returns to the precepts of God, then to make peace
    with fairness and impartiality.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: The faithful are called brethren, and the community is instructed to make
    peace between brethren and fear God.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: Believing men and women are told not to laugh one another to scorn, defame
    one another, or call one another by nicknames.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:7
  text: Believers are told to avoid frequent suspicions, not to pry, and not to traduce
    one another in absence.
  category: action
  evidence_refs:
  - ev:5
- id: obs:8
  text: Backbiting is expressed through the image of someone eating the flesh of a
    dead brother, which the hearers are said to loathe.
  category: object
  evidence_refs:
  - ev:5
- id: obs:9
  text: Human beings are said to have been created from a male and a female and divided
    into peoples and tribes so that they might know one another.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:10
  text: The most honored person in the sight of God is identified as the one who fears
    Him most.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:11
  text: The Arabs of the desert say, 'We believe,' but are told to say instead, 'We
    profess Islam,' because faith has not yet entered their hearts.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: True believers are described as those who believe in God and His Apostle without
    later doubt and who contend with their substance and persons on the path of God.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:13
  text: God is said to know whatever is in the heavens and on the earth, the secrets
    of both, and what people do.
  category: attribute
  evidence_refs:
  - ev:9
- id: obs:14
  text: At the beginning of Sura IX, an immunity from God and His Apostle is announced
    concerning polytheist Arabs with whom the believers are in league.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:15
  text: Those addressed are told to go at large in the land for four months, while
    being warned that they cannot weaken God and that unbelievers will be put to shame.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:16
  text: A proclamation on the day of the greater pilgrimage declares that God and
    His Apostle are free from engagement with votaries of other gods, while inviting
    turning to God and warning of grievous punishment for unbelief.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:17
  text: The declaration does not concern polytheists who have remained faithful to
    their treaty and not aided anyone against the believers; their engagement is to
    be observed for the whole treaty term.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:18
  text: When the sacred months have passed, the passage commands fighting, seizing,
    besieging, and ambushing those who join other gods with God, unless they convert,
    observe prayer, and pay obligatory alms.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:19
  text: If a person among those who join gods with God asks asylum, the addressed
    figure is to grant asylum so that the person may hear the Word of God and then
    reach a place of safety.
  category: action
  evidence_refs:
  - ev:14
- id: obs:20
  text: The passage asks how polytheists can be in league with God and His Apostle
    except those with whom a league was made at the sacred temple, and it commands
    faithfulness to them so long as they are true.
  category: relationship
  evidence_refs:
  - ev:15
