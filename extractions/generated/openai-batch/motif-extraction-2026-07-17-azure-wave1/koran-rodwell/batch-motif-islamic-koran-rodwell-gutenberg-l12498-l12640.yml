candidate_motifs:
- id: motif:1
  label: Rain revives dead earth as sign of resurrection
  taxonomy_refs:
  - resurrection
  basis: The passage links rain and divine mercy to earth being quickened after death
    and explicitly states that the same God will quicken the dead.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: The passage frames the revived earth as evidence for resurrection; it
    is not an extended afterlife journey narrative.
- id: motif:2
  label: Divine judgment at the Hour
  taxonomy_refs:
  - divine_judgment
  basis: The guilty are punished, the wicked face the day of Resurrection, their plea
    does not avail, and delayed chastisement will arrive without being averted.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  - ev:13
  confidence: high
  cautions: The passage gives declarations and brief scenes rather than a detailed
    judgment-court narrative.
- id: motif:3
  label: Revelatory wisdom and parables
  taxonomy_refs:
  - wisdom
  basis: The Koran is described as containing every kind of parable, and the opening
    of Sura XI describes a book whose verses are established in wisdom and clearly
    set forth.
  evidence_refs:
  - ev:9
  - ev:10
  confidence: medium
  cautions: This is a scriptural characterization of wisdom rather than a narrative
    quest for wisdom.
- id: motif:4
  label: Primordial waters beneath the divine throne
  taxonomy_refs: []
  basis: The passage says God made the heavens and earth in six days and that his
    throne had stood upon the waters.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage mentions waters and the throne but does not narrate a chaos
    battle or a detailed creation-from-water episode, so no specific motif-family
    taxonomy is assigned.
- id: motif:5
  label: Human life cycle from weakness to strength and decline
  taxonomy_refs: []
  basis: God creates humans in weakness, then strength, then weakness and grey hairs.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The motif is stated as a theological observation rather than developed
    as a narrative pattern.
comparison_claims:
- id: claim:1
  claim: A translator's note explicitly links the Qur'anic association of God as sender
    of rain with resurrection to a Talmudic application in which the sender of rain
    is associated with the divine command that causes the dead to arise.
  claim_level: same_function
  target: Talmudic tradition cited as Taanith (init.) on rain and the raising of the
    dead
  evidence_refs:
  - ev:4
  - ev:15
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage provides only the translator's brief note and no full Talmudic
    quotation; it supports a cautious functional comparison, not a claim of direct
    historical contact.
