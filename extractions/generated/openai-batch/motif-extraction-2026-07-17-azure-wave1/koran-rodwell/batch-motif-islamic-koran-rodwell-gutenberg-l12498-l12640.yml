canonical_text:
  quote: ''
  summary: The passage presents winds, clouds, rain, ships, revived earth, human life
    stages, prophetic warnings, rejection by unbelievers, the Hour and Resurrection,
    divine judgment, scriptural parables, and instruction to Muhammad to be patient.
    It then opens Sura XI with a wise book, worship of God alone, divine knowledge
    of what humans conceal, providence for all creatures, creation of heavens and
    earth in six days, the throne upon waters, resurrection denied as sorcery, deferred
    chastisement, and human despair when mercy is removed.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: God sends winds as glad tidings of rain, lets people taste mercy, and enables
    ships to sail at his command so that people may seek bounty and give thanks.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apostles were sent to earlier peoples with clear proofs; the faithful were
    succoured and the guilty were punished.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: God raises and spreads clouds, breaks them up, and rain comes from them; those
    receiving rain are filled with joy after despair.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says God quickens the earth after its death and will also quicken
    the dead.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: If a blast makes the harvest yellow, people become ungrateful afterward.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Muhammad is told he cannot make the dead or deaf hear, nor guide the blind
    out of error, except that believers in the signs will hear.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: God creates humans in weakness, then gives strength, then weakness and grey
    hairs.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: On the Hour, the wicked swear they waited only an hour, while those given
    knowledge and faith say the waiting lasted until the day of Resurrection.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: On that day the plea of the wicked does not avail, and they are not again
    invited to seek acceptance with God.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: The Koran is described as setting before people every kind of parable, yet
    infidels dismiss a verse as vain speech; God is said to seal the hearts of those
    without knowledge.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:11
  text: Muhammad is instructed to bear patiently because the promise of God is true
    and not to be unsettled by those without firm belief.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: Sura XI begins by describing a book whose verses are established in wisdom
    and clearly set forth; the speaker comes with warnings and announcements and calls
    people to worship God alone and seek pardon.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:13
  text: People are described as trying to hide from God by folding up their breasts
    and enshrouding themselves in garments, but God knows what they conceal and show.
  category: action
  evidence_refs:
  - ev:11
- id: obs:14
  text: Every moving thing on earth depends on God for nourishment, and God knows
    its haunts and final resting place, all recorded in a clear Book.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:15
  text: God made the heavens and the earth in six days; his throne had stood upon
    the waters, and the creation is linked to testing who excels in works.
  category: action
  evidence_refs:
  - ev:12
- id: obs:16
  text: When resurrection after death is announced, infidels call it pure sorcery;
    when chastisement is deferred, they question what keeps it back, but the passage
    says it will enclose them.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:17
  text: If God lets man taste mercy and then deprives him of it, man becomes despairing
    and ungrateful.
  category: sequence
  evidence_refs:
  - ev:14
