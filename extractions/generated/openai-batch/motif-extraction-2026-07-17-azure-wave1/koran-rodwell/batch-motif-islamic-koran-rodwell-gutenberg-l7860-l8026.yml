canonical_text:
  quote: ''
  summary: 'The passage describes the punishment and disputation of people in Hell,
    then presents a warning proclamation and a creation episode: God makes man of
    clay, commands the angels to prostrate, Eblis refuses because he claims superiority
    as a being created of fire, is cursed and respited until an appointed time, vows
    to seduce humans except God’s sincere servants, and is told that Hell will be
    filled with him and his followers.'
  language: English
  quote_policy: summarized
