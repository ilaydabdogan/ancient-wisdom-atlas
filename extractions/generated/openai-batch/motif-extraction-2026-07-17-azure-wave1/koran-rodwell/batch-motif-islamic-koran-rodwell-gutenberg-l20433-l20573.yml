canonical_text:
  quote: ''
  summary: The passage contains the close of one sura and the openings of Sura LXII
    and Sura VIII in Rodwell's translation, with translator notes. It speaks of divine
    permission, obedience to God and the apostle, family and wealth as trials, almsgiving
    as a loan to God, the apostle sent to teach the Book and wisdom, a comparison
    of failed law-bearers to an ass carrying books, death and return to divine accounting,
    Friday assembly prayer and distraction by commerce, the allocation of spoils,
    and divine aid through angels in a military crisis.
  language: English
  quote_policy: summarized
