  text: The audience is commanded to obey God and the apostle; the apostle is described
    as charged only with plain preaching, and the faithful are told to trust God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:3
  text: Wives and children are described as an enemy for believers, while wealth and
    children are described as a trial; pardon, lenience, and divine mercy are also
