  category: relationship
  evidence_refs:
  - ev:3
- id: obs:4
  text: The audience is told to fear God, hear, obey, give alms, and lend God a generous
    loan; doubling and forgiveness are promised in return.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: God is described as knowing both the Hidden and the Manifest and as Mighty
