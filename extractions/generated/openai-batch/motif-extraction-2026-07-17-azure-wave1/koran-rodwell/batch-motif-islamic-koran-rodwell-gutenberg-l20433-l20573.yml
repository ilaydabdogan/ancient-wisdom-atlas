  text: All that is in the heavens and on the earth is said to praise God, who is
    called King, Holy, Mighty, and Wise.
  category: setting
  evidence_refs:
  - ev:7
- id: obs:7
  text: An apostle from among the pagan Arabs is said to have been sent to rehearse
    God's signs, purify them, and teach them the Book and wisdom after manifest error.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: Those on whom the burden of the law was laid but who would not bear it are
    likened to an ass carrying a load of books.
  category: object
  evidence_refs:
  - ev:8
- id: obs:9
  text: Jews are addressed and challenged to wish for death if they are truthful about
    being God's friends; the text says death will meet those who flee it and that
    they will be returned to the knower of secret and open things, who will tell them
    their actions.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Believers are summoned to prayer on the day of the Assembly, told to leave
    traffic for God's commemoration, then after prayer to disperse and seek God's
    bounties while remembering God.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: Some people, on seeing merchandise or sport, are said to disperse after it
    and leave the apostle standing alone.
  category: action
  evidence_refs:
  - ev:10
- id: obs:12
  text: A translator note identifies the Assembly day as Friday and adds that it is
