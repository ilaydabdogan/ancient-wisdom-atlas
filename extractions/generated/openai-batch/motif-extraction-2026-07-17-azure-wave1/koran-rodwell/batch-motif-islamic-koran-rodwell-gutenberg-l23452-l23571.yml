  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Some among the faithful are said to have made good what they promised to God;
    some have fulfilled their course, and others await fulfillment without changing.
  category: action
  evidence_refs:
  - ev:6
- id: obs:13
  text: God is said to reward the faithful for faithfulness, punish the hypocrites
