- id: motif:5
  label: Reward and punishment according to fidelity
  taxonomy_refs:
  - divine_judgment
  basis: The passage repeatedly states outcomes of reward, punishment, forgiveness,
    torment, doubled chastisement, doubled reward, and recompense according to faithfulness,
    obedience, or disobedience.
  evidence_refs:
  - ev:1
  - ev:7
  - ev:10
  - ev:12
  - ev:13
  confidence: high
  cautions: The extraction stays at the level of judgment and recompense; it does
    not add eschatological details absent from the passage.
- id: motif:6
  label: Choice between present life and the next-life home
  taxonomy_refs: []
  basis: The Prophet’s wives are offered either present life and honorable dismissal
    or God, His Apostle, and a home in the next life with great reward for virtue.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: Although the passage mentions the next life, it does not describe an afterlife
