canonical_text:
  quote: ''
  summary: The passage recalls God’s covenant with prophets, describes the battle
    against the confederates and the contrast between faithful believers and hypocritical
    or disaffected people, presents God’s Apostle as a noble pattern, recounts divine
    victory and inheritance after enemies are driven back, instructs the Prophet’s
    wives on choosing the next life, obedience, modest conduct, and household purity,
    and concludes with promises of forgiveness and recompense for faithful men and
    women and submission to God’s and the Apostle’s decree.
  language: English
  quote_policy: summarized
