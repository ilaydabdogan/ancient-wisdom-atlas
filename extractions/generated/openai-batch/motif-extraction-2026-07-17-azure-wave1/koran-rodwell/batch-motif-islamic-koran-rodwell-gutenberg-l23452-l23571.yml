- id: motif:1
  label: Covenant with prophets and accountability
  taxonomy_refs:
  - covenant
  - divine_judgment
  basis: The passage states that God formed a strict covenant with the prophets and
    will question truthful people while preparing torment for unbelievers.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is an extraction from the passage’s explicit covenant and judgment
    language, not a broader reconstruction of prophetic covenant traditions.
- id: motif:2
  label: Divine aid to a besieged faithful community
  taxonomy_refs: []
  basis: During the assault by armies, God sends a blast and unseen hosts; later God
    is said to have sufficed the faithful in the fight and driven back the infidels.
  evidence_refs:
  - ev:2
  - ev:7
  confidence: high
  cautions: No specific taxonomy family for divine battle aid is supplied, so taxonomy
    references are left empty.
- id: motif:3
  label: Trial under threat reveals faithfulness and hypocrisy
  taxonomy_refs: []
  basis: The faithful are tried and later increase in faith, while disaffected or
    hypocritical people seek flight, cause hindrances, and fight little.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The passage gives a moral and communal contrast; no claim is made here
