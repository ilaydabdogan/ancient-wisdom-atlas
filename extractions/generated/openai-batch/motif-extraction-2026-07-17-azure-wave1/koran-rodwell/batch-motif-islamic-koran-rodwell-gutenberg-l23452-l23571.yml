  text: Believers are told to remember when armies came against them and God sent
    a blast and unseen hosts against those armies.
  category: action
  evidence_refs:
  - ev:2
- id: obs:4
  text: The believers are described as assailed from above and below, with distracted
    eyes, hearts rising into throats, and strong quaking.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: The disaffected and diseased of heart say that God and His Apostle made them
