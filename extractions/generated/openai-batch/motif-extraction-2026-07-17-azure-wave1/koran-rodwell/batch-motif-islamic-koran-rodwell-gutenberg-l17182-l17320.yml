  quote: ''
  summary: The passage warns against inherited association of other gods with God,
    recounts a man who received divine signs but abandoned them and was seduced by
    Satan, contrasts guidance and error, describes the unknowable sudden Hour, presents
    Muhammad as a plain warner, recalls creation from a single person and spouse followed
    by human ingratitude after the gift of a child, criticizes powerless invoked beings,
    and commands refuge in God, Qur'an listening, remembrance, praise, and prostration.
  language: English
