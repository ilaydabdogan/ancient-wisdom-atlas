candidate_motifs:
- id: motif:1
  label: Rejection of divine signs followed by judgment
  taxonomy_refs:
  - divine_judgment
  - wisdom
  basis: The passage repeatedly describes divine signs made clear, denied, or abandoned,
    and links denial with self-injury, loss, Hell, gradual downfall, and recompense.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage frames signs doctrinally; the taxonomy label captures a broad
    motif family rather than a single narrative episode.
- id: motif:2
  label: Fall after receiving sacred knowledge or signs
  taxonomy_refs:
  - wisdom
  - departure
  basis: An unnamed figure receives signs, departs from them, is followed by Satan,
    follows lust, and loses the possible exaltation associated with those signs.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: medium
  cautions: The taxonomy reference to departure is literal here but not necessarily
    the full mythic departure motif.
- id: motif:3
  label: Sudden eschatological Hour known only to God
  taxonomy_refs:
  - divine_judgment
  basis: The Hour's timing is said to be known only to God and to come suddenly as
    a burden of the heavens and the earth.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The passage does not narrate the Hour's events, only its hidden timing
    and sudden arrival.
- id: motif:4
  label: Origin couple, child-gift, and failed gratitude
  taxonomy_refs:
  - sacred_exchange
  - covenant
  basis: The couple pray for a perfect child and promise thankfulness; after God gives
    the child, they join partners with Him.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The promise of thankfulness resembles a votive exchange, but the passage
    does not call it a covenant.
- id: motif:5
  label: Powerless false gods contrasted with creator God
  taxonomy_refs:
  - divine_judgment
  basis: Beings called on beside God are described as created, unable to create or
    help, and unable to answer summons, while God sends the Book and protects the
    righteous.
  evidence_refs:
  - ev:12
  - ev:13
  confidence: medium
  cautions: This is primarily polemical theology; the motif label is broad.
- id: motif:6
  label: Temptation dispelled by remembrance of God
  taxonomy_refs:
  - wisdom
  basis: When Satanic stirrings or a phantom touch those who fear God, they remember
    Him and then see clearly.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: No extended temptation narrative is given; the motif is expressed as instruction
    and general description.
- id: motif:7
  label: Revealed Book as guidance and mercy
  taxonomy_refs:
  - wisdom
  basis: The Koran is described as proof, guidance, and mercy; listeners are instructed
    to hear it silently and remember God.
  evidence_refs:
  - ev:15
  - ev:16
  confidence: high
  cautions: This is a revelatory-instructional pattern rather than a narrative myth
    episode.
