canonical_text:
  quote: ''
  summary: The passage rebukes wealthy exemption-seekers and hypocrites, distinguishes
    corrupt and sincere groups, describes alms, repentance, competing mosques, divine
    judgment, Paradise and Hell, a contract in which God buys the faithful persons
    and substance for Paradise, Abraham’s disavowal of his father when shown to be
    an enemy to God, and God’s turning in mercy to the Prophet, the helpers, refugees,
    and three who were left behind.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Wealthy people who ask for exemption are blamed; they are pleased to remain
    with those who stay behind, and God has set a seal upon their hearts.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the addressees return, the exemption-seekers will offer excuses; the
    response given is that the excuses are not to be believed because God has informed
    the believers about them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The passage says God and His Apostle will behold people’s doings, and that
    people will be brought back to the one who knows hidden and manifest things.
  category: sequence
  evidence_refs:
  - ev:1
  - ev:6
- id: obs:4
  text: Some people adjure the believers to withdraw from them; the passage instructs
    withdrawal and says their dwelling shall be Hell in recompense.
  category: action
  evidence_refs:
  - ev:2
- id: obs:5
  text: The Arabs of the desert are described generally as strong in unbelief and
    dissimulation, while some among them believe in God and the last day and treat
    alms as an approach to God and the Apostle’s prayers.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:6
  text: The first Mohadjers, the Ansars, and those who follow their noble conduct
    are described as pleasing God and being pleased with Him; gardens with rivers
    under their trees are made ready for them.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Some people around the addressees and in Medina are described as hypocrites;
    God knows them though Muhammad does not, and they are assigned chastisements.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:8
  text: Others acknowledge faults and have mixed a right action with a wrong action;
    the passage says God may turn to them and is forgiving and merciful.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The Apostle is instructed to take alms from people’s substance so that they
    may be cleansed and purified, and to pray for them because his prayers assure
    their minds.
  category: action
  evidence_refs:
  - ev:6
- id: obs:10
  text: The passage says God accepts repentance from servants and accepts alms.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:11
  text: Some have built a mosque for mischief, infidelity, disuniting the faithful,
    and expectation of one who had warred against God and His Apostle; they swear
    their aim was only good, but God witnesses that they lie.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: The Apostle is told never to set foot in that mosque; another mosque, founded
    from its first day in piety, is said to be more worthy for him to enter, and contains
    men who aspire to purity.
  category: action
  evidence_refs:
  - ev:7
- id: obs:13
  text: The passage contrasts a building founded on fear of God and desire to please
    Him with a building founded on the brink of an undermined bank washed away by
    torrents, rushing with its builder into the fire of Hell.
  category: object
  evidence_refs:
  - ev:8
- id: obs:14
  text: God is said to have bought the persons and substance of the faithful on condition
    of Paradise in return; they fight, slay, and are slain on the path of God.
  category: relationship
  evidence_refs:
  - ev:9
- id: obs:15
  text: The passage names the Law, the Evangel, and the Koran as places where this
    promise is pledged.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The faithful are characterized as turning to God, serving, praising, fasting,
    bowing, prostrating, enjoining what is just, forbidding evil, and keeping God’s
    bounds.
  category: attribute
  evidence_refs:
  - ev:10
- id: obs:17
  text: The prophet and the faithful are told not to pray for forgiveness for those
    who associate other beings with God after it has been made clear that they are
    inmates of Hell, even if they are kin.
  category: action
  evidence_refs:
  - ev:10
- id: obs:18
  text: Abraham had asked forgiveness for his father because of a promise, but when
    it was shown that his father was an enemy to God, Abraham declared himself clear
    of him.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:19
  text: God is described as possessing the kingdom of the heavens and earth, making
    alive and killing, and being the only patron or helper.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:20
  text: God turned toward the Prophet, the Mohadjers, and the Ansars who followed
    him in the hour of distress, and also toward three who had been left behind.
  category: sequence
  evidence_refs:
  - ev:11
  - ev:12
- id: obs:21
  text: For the three left behind, the spacious earth became too strait, their souls
    became straitened, and they recognized no refuge from God except unto Himself
    before God turned to them.
  category: sequence
  evidence_refs:
  - ev:12
