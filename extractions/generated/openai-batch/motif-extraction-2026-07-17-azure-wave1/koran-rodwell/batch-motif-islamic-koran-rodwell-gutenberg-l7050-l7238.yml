canonical_text:
  quote: ''
  summary: The passage recounts Eblis refusing to bow to man, receiving expulsion
    and respite, and vowing to beguile humans except sincere servants. It contrasts
    Hell and the pious in gardens and fountains, narrates Abraham’s guests announcing
    a sage son and a mission against Lot’s people, describes Lot’s family being commanded
    to depart by night before the city is overturned and stoned, mentions punishments
    of El Aika and Hedjr, and ends with instructions to Muhammad to proclaim, forgive,
    praise, and worship.
  language: English
  quote_policy: summarized
