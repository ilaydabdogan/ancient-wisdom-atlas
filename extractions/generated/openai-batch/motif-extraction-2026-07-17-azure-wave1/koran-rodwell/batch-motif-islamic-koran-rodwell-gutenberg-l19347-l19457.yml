  text: The creation of the heavens and earth, alternation of night and day, ships
    at sea, rain from heaven reviving the earth, cattle, winds, and clouds are called
    signs for those who understand.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: Some men take idols along with God and love them, while the faithful are said
    to have stronger love for God.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: At chastisement, those who had followers disavow their followers, ties between
