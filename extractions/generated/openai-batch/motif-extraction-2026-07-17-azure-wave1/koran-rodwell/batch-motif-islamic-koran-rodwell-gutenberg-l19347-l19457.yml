    in turn.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The followers remain unable to come forth from the fire.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: Men are told to eat what is lawful and good on earth and not to follow Satan’s
    steps; Satan is called an avowed enemy who enjoins evil, wickedness, and false
    claims about God.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: Some people reject what God has sent down by saying they follow the usages
