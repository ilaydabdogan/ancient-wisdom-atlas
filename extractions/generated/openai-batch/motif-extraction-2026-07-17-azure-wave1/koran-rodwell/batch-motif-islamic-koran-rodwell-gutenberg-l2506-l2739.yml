  summary: The passage contains several short Meccan suras and surrounding notes.
    It describes divine reward and punishment, the preserved heavenly tablet, the
    Day of the Blow, the Earthquake, the Cleaving, and the Folded Up. Repeated scenes
    portray cosmic disruption, disclosure of deeds, weighing or recording of actions,
    resurrection imagery, Hell-fire, Paradise, divine sovereignty, and a trusted messenger
    who gives warning.
