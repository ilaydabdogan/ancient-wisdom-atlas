canonical_text:
  quote: ''
  summary: The passage exhorts the addressed messenger and believers to follow revelation,
    avoid idolatry, refrain from reviling other cultic objects, trust God as judge,
    observe food consecrated by God's name, and reject satanic suggestions. It contrasts
    divine guidance with misguidance through imagery of life, light, darkness, an
    opened or constricted breast, and ascent into the heavens. It describes a future
    gathering of Djinn and humans, their self-witness, recompense by deeds, the fire
    as an abode for wrongdoers, and a promised outcome in which the ungodly do not
    prosper.
  language: English
  quote_policy: summarized
