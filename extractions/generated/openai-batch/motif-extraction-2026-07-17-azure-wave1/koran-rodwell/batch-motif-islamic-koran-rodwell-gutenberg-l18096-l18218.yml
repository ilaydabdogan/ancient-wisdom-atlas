candidate_motifs:
- id: motif:1
  label: divine judgment according to deeds
  taxonomy_refs:
  - divine_judgment
  basis: The passage describes God as judge, a future gathering, testimony against
    oneself, the fire as abode, and grades of recompense according to deeds.
  evidence_refs:
  - ev:8
  - ev:17
  - ev:18
  - ev:19
  confidence: high
  cautions: The passage is theological and exhortative rather than a narrative trial
    scene with detailed procedure.
- id: motif:2
  label: afterlife recompense and contrasting abodes
  taxonomy_refs:
  - divine_judgment
  basis: The passage contrasts a dwelling of peace with the Lord and the fire as an
    abode, both connected to recompense or judgment.
  evidence_refs:
  - ev:16
  - ev:17
  - ev:19
  confidence: high
  cautions: The available taxonomy lacks a general 'afterlife abode' category; 'divine_judgment'
    is the closest supported family.
- id: motif:3
  label: deceptive adversaries opposing prophets
  taxonomy_refs:
  - trickster_boundary
  basis: Satans among humans and Djinn are described as enemies to every prophet and
    as exchanging deceptive discourse to mislead.
  evidence_refs:
  - ev:7
  - ev:11
  confidence: medium
  cautions: The passage frames these figures as demonic adversaries rather than comic
    or culture-crossing tricksters; the taxonomy reference is only approximate.
- id: motif:4
  label: death-like state transformed into life and light
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: A figure described as dead is quickened and given light, then contrasted
    with one remaining in darkness.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The wording may function as a moral or spiritual metaphor rather than
    a literal resurrection episode.
- id: motif:5
  label: sacred speech over food
  taxonomy_refs:
  - sacred_exchange
  basis: The passage instructs eating only what has the name of God pronounced over
    it and treats the absence of the divine name as a transgression.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: This is a ritual/legal instruction; 'sacred_exchange' is an approximate
    motif family for consecrated consumption and divine naming.
- id: motif:6
  label: ascent image used for constriction and misguidance
  taxonomy_refs:
  - ascent
  basis: The misled person's straitened breast is compared to mounting into the very
    heavens.
  evidence_refs:
  - ev:15
  confidence: low
  cautions: The ascent is a simile of distress, not a journey narrative or successful
    ascent.
- id: motif:7
  label: divine replacement or succession of peoples
  taxonomy_refs:
  - death_rebirth
  basis: God is said to be able to destroy the addressees and cause others to succeed
    them, as they were raised from the offspring of other people.
  evidence_refs:
  - ev:20
  confidence: low
  cautions: This is a collective warning about succession, not a developed death-and-rebirth
    myth.
- id: motif:8
  label: revealed wisdom as criterion
  taxonomy_refs:
  - wisdom
  basis: The distinguishing Book sent down from the Lord is treated as truth, and
    the Lord's words are described as perfect in truth and justice.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: medium
  cautions: The passage emphasizes revelation and judgment more than a personified
    wisdom figure or quest for wisdom.
