  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; short quotation used.
- id: ev:4
  type: summary
  locator: lines 3905-3907
  quote_or_summary: The blessed recline on couches arranged in rows and are wedded
    to damsels with large dark eyes.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: lines 3908-3912
  quote_or_summary: Believers whose offspring follow them in faith are reunited with
    offspring, and every person is pledged to God for actions and desert.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: summary
  locator: lines 3913-3920
  quote_or_summary: The blessed receive abundant fruits and desired flesh, pass a
    cup that causes no sinful talk, and are served by youths beautiful as embedded
    pearls.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:7
  type: summary
  locator: lines 3921-3930
  quote_or_summary: The blessed question one another and recall past care for their
    families, saying God was kind, preserved them from torment, and had been called
    upon as Beneficent and Merciful.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: lines 3931-3941
  quote_or_summary: The addressed figure is told to warn; opponents call him poet,
    soothsayer, possessed, or claim he forged the Koran, and are challenged to produce
    a discourse like it.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: lines 3942-3958
  quote_or_summary: Rhetorical questions ask whether opponents created themselves,
    created heavens and earth, hold the Lord's treasures, rule supreme, have a ladder
    for hearing angels, or know secret things.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: quote
  locator: lines 3963-3965
  quote_or_summary: If they saw "a fragment of the heaven falling down," they would
    say it was "only a dense cloud."
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; short quotation used.
- id: ev:11
  type: summary
  locator: lines 3966-3973
  quote_or_summary: They are left until the day when they swoon away, when their snares
    will not avail and they will not be helped; another punishment is also mentioned
    for evildoers.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:12
  type: summary
  locator: lines 3974-3978
  quote_or_summary: The addressed figure is told to wait patiently for the Lord's
    judgment, is said to be in the divine eye, and is told to praise the Lord when
    rising, by night, and when stars set.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:13
  type: summary
