  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:18
  type: summary
  locator: lines 4040-4056
  quote_or_summary: The people of the right hand are amid thornless sidrahs, fruit-clad
    talh trees, extended shade, flowing waters, abundant unfailing and unforbidden
    fruits, and lofty couches.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:19
  type: summary
  locator: lines 4057-4066
  quote_or_summary: The Houris are created in a rare creation, made ever virgins,
