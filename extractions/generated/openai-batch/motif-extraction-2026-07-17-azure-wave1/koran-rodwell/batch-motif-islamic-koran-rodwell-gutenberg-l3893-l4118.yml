canonical_text:
  quote: ''
  summary: The passage contrasts punishment for evildoers with reward for those who
    fear God, describes paradisal gardens, couches, food, drink, spouses, youths,
    and reunited offspring, then addresses accusations against the messenger and warns
    of a day of judgment. It continues with the sudden coming of the inevitable day,
    cosmic upheaval, division of humanity into right hand, left hand, and foremost
    groups, reward for the foremost and right-hand people, and punishment for the
    left-hand people, including scalding water, smoke, the tree Ez-zakkoum, boiling
    water, and resurrection after death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A rebuke asks whether the punishment is magic or unseen, and the condemned
    are told to burn in it whether patiently or impatiently, receiving the reward
    of their deeds.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those who have feared God are described as dwelling amid gardens and delights
    and as preserved by their Lord from the pain of hell-fire.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: The blessed are invited to eat and drink in healthy enjoyment as recompense
    for their deeds.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The blessed recline on couches arranged in rows and are wedded to damsels
    with large dark eyes.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Believers whose offspring followed them in faith are reunited with those offspring,
    and every person is pledged to God for actions and their desert.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: The blessed receive abundant fruits and desired flesh, pass among themselves
    a cup that produces no sinful or frivolous speech, and are served by beautiful
    youths likened to embedded pearls.
  category: object
  evidence_refs:
  - ev:6
- id: obs:7
  text: The blessed speak with one another and recall former concern about their families,
    saying God was kind to them and preserved them from torment because they had called
    upon him.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: The addressed figure is commanded to warn and is denied to be either a soothsayer
    or possessed; opponents are represented as calling him a poet or claiming he forged
    the Koran.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: A series of rhetorical questions challenges whether the opponents were self-created,
    created the heavens and earth, hold the Lord's treasures, rule supreme, or have
    a ladder for hearing the angels.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: If the opponents saw a fragment of heaven falling, they would call it a dense
    cloud.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: The addressed figure is told to leave the opponents until they face the day
    when they swoon away, when their snares will not help them.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: The addressed figure is told to wait patiently for the Lord's judgment, to
    praise the Lord when rising, in the night-season, and when the stars are setting.
  category: action
  evidence_refs:
  - ev:12
- id: obs:13
  text: The inevitable day comes suddenly; it abases and exalts.
  category: sequence
  evidence_refs:
  - ev:13
- id: obs:14
  text: At the coming day, the earth is shaken, mountains crumble, become scattered
    dust, and people are divided into three bands.
  category: sequence
  evidence_refs:
  - ev:14
- id: obs:15
  text: The three groups are named as the people of the right hand, the people of
    the left hand, and the foremost, with the foremost brought near to God.
  category: relationship
  evidence_refs:
  - ev:15
- id: obs:16
  text: The foremost are in gardens of delight, reclining face to face on inwrought
    couches, served by youths with goblets, ewers, and flowing wine that does not
    cause headache or loss of sense.
  category: setting
  evidence_refs:
  - ev:16
- id: obs:17
  text: The foremost receive fruits, bird flesh, and Houris with large dark eyes like
    hidden pearls, as recompense for past labours, and hear only the cry of peace.
  category: object
  evidence_refs:
  - ev:17
- id: obs:18
  text: The people of the right hand are placed amid thornless sidrahs, fruit-clad
    talh trees, extended shade, flowing waters, abundant fruits, and lofty couches.
  category: setting
  evidence_refs:
  - ev:18
- id: obs:19
  text: The Houris are said to be specially created, made ever virgins, dear to their
    spouses, and of equal age with them for the people of the right hand.
  category: attribute
  evidence_refs:
  - ev:19
- id: obs:20
  text: The people of the left hand are amid pestilential winds, scalding water, and
    the shadow of black smoke that is not cool and is horrid to behold.
  category: setting
  evidence_refs:
  - ev:20
- id: obs:21
  text: The people of the left hand had worldly goods, persisted in heinous sin, and
    questioned whether they and their forefathers would be raised after becoming dust
    and bones.
  category: speech
  evidence_refs:
  - ev:21
- id: obs:22
  text: The former and latter are to be gathered for a known day.
  category: sequence
  evidence_refs:
  - ev:22
- id: obs:23
  text: The erring and gainsaying are told they will eat from the tree Ez-zakkoum,
    fill their bellies with it, drink boiling water like thirsty camels, and that
    this will be their repast on the day of reckoning.
  category: action
  evidence_refs:
  - ev:23
- id: obs:24
  text: The passage ends this excerpt by asserting creation of the hearers and asking
    whether they will credit the speaker.
  category: speech
  evidence_refs:
