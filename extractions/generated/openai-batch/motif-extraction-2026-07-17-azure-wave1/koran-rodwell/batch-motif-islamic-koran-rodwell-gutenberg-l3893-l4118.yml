candidate_motifs:
- id: motif:1
  label: Deeds repaid by eschatological reward or punishment
  taxonomy_refs:
  - divine_judgment
  basis: The passage repeatedly says people receive recompense or reward for deeds
    and presents the day of reckoning with distinct outcomes for the blessed and the
    condemned.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:17
  - ev:23
  confidence: high
  cautions: The extraction names a broad motif family; the passage itself supplies
    the judgment and recompense language.
- id: motif:2
  label: Paradisal banquet and garden reward
  taxonomy_refs:
  - afterlife_journey_map
  basis: The rewarded are placed in gardens with couches, fruits, flesh, cups, wine,
    attendants, spouses, flowing water, shade, and peace.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:6
  - ev:16
  - ev:17
  - ev:18
  - ev:19
  confidence: high
  cautions: The taxonomy reference is broader than the banquet imagery and is used
    because the passage maps differentiated afterlife states.
- id: motif:3
  label: Family reunion after judgment
  taxonomy_refs:
  - afterlife_journey_map
  basis: Believers whose offspring follow them in faith are reunited with their offspring
    without defrauding them of their works.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage gives a concise doctrinal statement rather than an extended
    narrative scene.
- id: motif:4
  label: Threefold sorting of humanity on the last day
  taxonomy_refs:
  - afterlife_journey_map
  - divine_judgment
  basis: 'At the inevitable day, humanity is divided into three bands: right hand,
    left hand, and foremost, with contrasting destinies.'
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  - ev:16
  - ev:18
  - ev:20
  confidence: high
  cautions: The motif is classificatory and eschatological, not a journey narrative
    in the narrow sense.
- id: motif:5
  label: Cosmic upheaval before judgment
  taxonomy_refs:
  - chaos
  basis: The coming day is marked by a shaking earth and mountains crumbling into
    scattered dust.
  evidence_refs:
  - ev:13
  - ev:14
  confidence: medium
  cautions: The available taxonomy lacks a specific eschatological upheaval family;
    'chaos' is an approximate high-level reference.
- id: motif:6
  label: Resurrection after bones and dust
  taxonomy_refs:
  - resurrection
  basis: The left-hand people question whether they and their ancestors will be raised
    after death, dust, and bones; the answer states that former and latter will be
    gathered for a known day.
  evidence_refs:
  - ev:21
  - ev:22
  confidence: high
  cautions: The passage presents resurrection as a polemical answer to denial rather
    than as a narrated revivification scene.
- id: motif:7
  label: Infernal repast of bitter tree and boiling water
  taxonomy_refs:
  - divine_judgment
  basis: The erring and gainsaying are told they will eat from the tree Ez-zakkoum,
    fill their bellies, and drink boiling water like thirsty camels on the day of
    reckoning.
  evidence_refs:
  - ev:23
  confidence: high
  cautions: The motif is confined to the punishment scene in this excerpt.
- id: motif:8
  label: Heavenly access by ladder as challenged claim
  taxonomy_refs:
  - ascent
  basis: A rhetorical question asks whether the opponents have a ladder by which to
    hear the angels and demands clear proof from anyone who heard them.
  evidence_refs:
  - ev:9
  confidence: low
  cautions: The passage does not narrate an ascent; it mentions a ladder only as a
    rhetorical challenge.
- id: motif:9
  label: Accused messenger vindicated by divine warning
  taxonomy_refs:
  - wisdom
  basis: The addressed figure is accused of being a poet, soothsayer, possessed, or
    a forger, but is commanded to warn, answer, wait, and praise the Lord while judgment
    approaches.
  evidence_refs:
  - ev:8
  - ev:11
  - ev:12
  confidence: medium
  cautions: The available taxonomy has no direct 'prophetic rejection' category; 'wisdom'
    is only a broad fit for revealed discourse and warning.
comparison_claims:
- id: claim:1
  claim: Within this excerpt, the close of Sura LII and the opening of Sura LVI use
    a similar contrast between blessed garden reward and punishment for rejecters
    or evildoers.
  claim_level: same_function
  target: Intra-passage contrastive afterlife reward-punishment pattern
  evidence_refs:
  - ev:1
  - ev:2
  - ev:6
  - ev:16
  - ev:18
  - ev:20
  - ev:23
  counter_evidence_refs: []
  confidence: high
  limitations: This is an internal structural comparison only; it does not assert
    historical contact or comparison with another tradition.
- id: claim:2
  claim: The right-hand, left-hand, and foremost groups in Sura LVI function as an
    explicit afterlife classification that parallels the broader rewarded-versus-punished
    contrast already present in the preceding Sura LII excerpt.
  claim_level: same_function
  target: Rewarded and punished eschatological classes within the same passage range
  evidence_refs:
  - ev:2
  - ev:11
  - ev:14
  - ev:15
  - ev:18
  - ev:20
  counter_evidence_refs: []
  confidence: medium
  limitations: The Sura LVI scheme is threefold, while the preceding contrast is primarily
