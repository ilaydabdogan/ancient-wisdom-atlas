  quote_or_summary: 'Sura LVI begins: the inevitable day comes suddenly, is not treated
    as a lie, and both abases and exalts.'
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:14
  type: summary
  locator: lines 3998-4005
  quote_or_summary: The earth is shaken, mountains crumble and become scattered dust,
    and people are divided into three bands.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:15
  type: summary
  locator: lines 4006-4014
  quote_or_summary: The people of the right hand are called happy, the people of the
    left hand wretched, and the foremost are brought near to God.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:16
  type: summary
  locator: lines 4015-4028
  quote_or_summary: The foremost are in gardens of delight, among former and latter
    generations, reclining face to face on inwrought couches while youths serve goblets,
    ewers, and wine without headache or loss of sense.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:17
  type: summary
  locator: lines 4029-4039
  quote_or_summary: They receive pleasing fruits, desired bird flesh, Houris like
    hidden pearls, recompense for past labours, and hear no vain discourse but only
