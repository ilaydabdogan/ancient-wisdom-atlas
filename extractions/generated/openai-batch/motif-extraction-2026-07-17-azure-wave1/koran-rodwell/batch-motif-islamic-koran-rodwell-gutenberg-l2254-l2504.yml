canonical_text:
  quote: ''
  summary: The passage contains several Meccan suras and translator notes. It includes
    a rebuke for neglecting a blind seeker, descriptions of the Koran as a warning,
    human creation and resurrection, divine provision through rain and plants, judgment
    imagery with a trumpet-blast and divided faces, warnings about fire, oaths by
    natural and sacred places, human loss except for the righteous, and a scene of
    believers tormented by masters of a fiery trench.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A figure frowns and turns away because a blind man comes to him, while he
    gives attention to a wealthy man and neglects an earnest fearful seeker.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The Koran is described as a warning written on honoured, exalted, purified
    pages by the hands of honoured and righteous Scribes.
  category: object
  evidence_refs:
  - ev:2
- id: obs:3
  text: God is said to create man from moist germs, fashion him, make an easy passage
    from the womb, cause death and burial, and later raise him to life when God pleases.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage tells man to look at his food and attributes rain, cleft earth,
    grain, grapes, herbs, olive, palm, gardens, fruits, and herbage to divine action
    for people and cattle.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: At the stunning trumpet-blast, a man flees from brother, parents, wife, and
    children, and faces are divided between radiant joyous faces and dusty blackened
    faces.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: The Most High is described as creating, balancing, fixing destinies, guiding,
    bringing forth pasture, and reducing it to dusky stubble.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: Warning is said to benefit one who fears God, while the most reprobate turns
    aside and is exposed to a terrible fire in which he neither dies nor lives.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A purified person remembers the Lord's name and prays; the life to come is
    described as better and more enduring than present life; the teaching is said
    to be in the Books of Abraham and Moses.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: An oath is made by the fig, the olive, Mount Sinai, and an inviolate soil;
    man is said to be created in goodliest fabric and then brought low except those
    who believe and do right.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:10
  text: An oath by the declining day states that man's lot is amid destruction except
    for those who believe, do right, and enjoin truth and steadfastness.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: An oath by the star-bespangled heaven, the promised Day, the witness, and
    the witnessed precedes a curse on masters of a fuel-fed trench who sat around
    and witnessed what they inflicted on believers.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: A translator note identifies the rebuked incident with Muhammad, the blind
    Abdallah Ibn Omm Maktum, and Walid, and says Muhammad later repented and treated
    Abdallah with respect.
  category: relationship
  evidence_refs:
  - ev:12
