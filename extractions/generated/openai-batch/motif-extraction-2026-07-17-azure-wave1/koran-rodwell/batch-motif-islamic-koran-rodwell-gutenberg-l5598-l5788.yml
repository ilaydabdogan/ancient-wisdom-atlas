  locator: 5646-5650
  quote_or_summary: On that day, master and servant cannot aid one another, except
    those on whom God has mercy.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:9
  type: summary
  locator: 5652-5660
  quote_or_summary: The tree of Ez-Zakkoum is the sinner's food and boils in the belly
    like dregs of oil and scalding water.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:10
  type: summary
  locator: 5662-5670
  quote_or_summary: The sinner is ordered seized, dragged into the mid-fire, and tormented
    with boiling water poured on his head, with a command to taste what he doubted.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:11
  type: summary
  locator: 5672-5682
  quote_or_summary: The pious are secure amid gardens and fountains, clothed in silk
    and rich robes, facing one another, wed to large-eyed virgins, and calling for
    every kind of fruit.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:12
  type: summary
  locator: 5684-5688
  quote_or_summary: After their first death, the pious taste death no more, are kept
    from Hell's pains, and receive the Lord's bounty.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:13
  type: summary
  locator: 5690-5694
  quote_or_summary: The Koran is made easy in the listener's own tongue so that people
    may take warning; the listener is told to wait.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:14
  type: summary
  locator: 5734-5746
  quote_or_summary: In Sura Kaf, infidels marvel that one of themselves brings warnings,
    question return after death and dust, while God knows what the earth consumes
    and has a Book in which account is kept.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:15
  type: summary
  locator: 5748-5756
  quote_or_summary: The passage points to the heaven above, its flawless decking,
    the spread earth, mountains, and varied plants as insight and admonition.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:16
  type: summary
  locator: 5758-5768
  quote_or_summary: Rain from Heaven causes gardens, grain, and tall palms to grow,
    nourishes humans, and gives life to a dead country; the passage adds, 'So also
    shall be the resurrection.'
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:17
  type: summary
  locator: 5770-5777
  quote_or_summary: The people of Noah, Rass, Themoud, Ad, Pharaoh, Lot's brethren,
    forest-dwellers, and Tobba's people rejected prophets, and the menaces were inflicted.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:18
  type: summary
  locator: 5779-5781
  quote_or_summary: God asks whether the first creation wearied him, while doubters
    remain uncertain about a new creation.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:19
  type: quote
  locator: 5783-5785
  quote_or_summary: '"We created man: and we know what his soul whispereth to him,
    and we are closer to him than his neck-vein."'
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:20
  type: summary
  locator: 5787-5793
  quote_or_summary: Two angels take account, one at the right hand and one at the
    left; every word has a watcher ready to note it down.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:21
  type: summary
  locator: 5795-5806
  quote_or_summary: Death's stupor comes, a trumpet blast marks the threatened day,
    every soul comes with an urging angel and a witnessing angel, and the veil is
    removed so sight becomes sharp.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
- id: ev:22
  type: summary
  locator: 5808-5816
  quote_or_summary: God commands that every infidel, hardened one, hinderer of good,
    transgressor, doubter, and one who sets up other gods be cast into fierce torment.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: public_domain
