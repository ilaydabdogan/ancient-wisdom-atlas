canonical_text:
  quote: '"Be not distressed; verily, God is with us."'
  summary: The passage condemns manipulation of sacred months, exhorts believers to
    march and contend on the Way of God, recalls divine aid to the Prophet and his
    companion in the cave, criticizes excuse-makers and hypocrites, describes rejected
    offerings and ordained alms, and warns opponents of God and His Apostle of chastisement
    and Hell.
  language: English
