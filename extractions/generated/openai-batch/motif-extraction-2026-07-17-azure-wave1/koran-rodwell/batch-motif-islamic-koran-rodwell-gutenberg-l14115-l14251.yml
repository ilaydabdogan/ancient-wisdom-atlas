canonical_text:
  quote: ''
  summary: 'The passage closes one section by recalling former powerful peoples who
    rejected apostolic signs and were overtaken by divine vengeance. It then opens
    Sura XXVIII with the story of Moses and Pharaoh: Pharaoh oppresses a portion of
    his people and kills male children; God intends to favor the oppressed. Moses’
    mother is told by revelation to nurse him and, if afraid, launch him on the sea,
    with a promise that he will be restored and made an apostle. Pharaoh’s household
    takes him up, Pharaoh’s wife argues against killing him, Moses’ sister watches
    and helps restore him to his mother, and Moses later receives wisdom. As an adult,
    Moses kills an enemy while aiding a man of his own people, repents, is forgiven,
    faces renewed danger, and is warned that nobles intend to kill him.'
  language: English
  quote_policy: summarized
