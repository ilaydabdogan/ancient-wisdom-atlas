- id: ev:14
  type: summary
  locator: 13505-13512
  quote_or_summary: Joseph interprets the dream as seven years of sowing and storing
    grain, seven grievous years consuming the stores, and then a year of rain and
    grape pressing.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source text.
- id: ev:15
  type: summary
  locator: 13513-13516
  quote_or_summary: When the King orders Joseph brought, Joseph tells the messenger
