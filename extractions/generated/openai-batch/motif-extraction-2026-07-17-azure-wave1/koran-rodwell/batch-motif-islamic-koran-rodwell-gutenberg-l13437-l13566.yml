  quote: ''
  summary: 'A section of the Joseph narrative: Joseph resists the Prince''s wife and
    is imprisoned; he interprets the dreams of two fellow prisoners and later the
    King''s dream of cattle and ears of grain; his innocence is publicly acknowledged;
    he is appointed over the granaries; his brothers later come to him for provisions
    without recognizing him.'
