  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source text.
- id: ev:18
  type: summary
  locator: 13535-13541
  quote_or_summary: Joseph is established in the land; his brothers come to him, and
