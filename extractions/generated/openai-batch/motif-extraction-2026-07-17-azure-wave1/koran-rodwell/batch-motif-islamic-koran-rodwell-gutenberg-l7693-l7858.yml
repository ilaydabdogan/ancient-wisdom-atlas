  text: Earlier generations are said to have been destroyed after crying for mercy
    when escape was no longer possible.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Opponents marvel that a warner has come from among themselves and call him
    a sorcerer and liar.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage names previous peoples and groups, including the people of Noah,
    Ad, Pharaoh, Themoud, the people of Lot, and dwellers in the forest, as having
    treated prophets or apostles as false.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: A single trumpet blast is presented as an awaited event that will not be delayed.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: David is described as a servant of God, strong of hand, penitent, and aided
    by mountains and birds in praise.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:7
  text: David is given an established kingdom, wisdom, and skill in clear decisions.
  category: attribute
  evidence_refs:
  - ev:7
