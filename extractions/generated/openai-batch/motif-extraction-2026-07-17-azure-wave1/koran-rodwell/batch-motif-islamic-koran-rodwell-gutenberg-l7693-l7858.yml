candidate_motifs:
- id: motif:1
  label: Rejection of the warner followed by retribution
  taxonomy_refs:
  - divine_judgment
  basis: The passage links rejection of warnings by present opponents and earlier
    peoples with destruction, retribution, the day of reckoning, fire, and a wretched
    home.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  - ev:12
  - ev:24
  confidence: high
  cautions: The passage presents this as theological warning rather than a detailed
    narrative of a single judgment event.
- id: motif:2
  label: Righteous ruler tested through judgment
  taxonomy_refs:
  - wisdom
  - royal_legitimacy
  - divine_judgment
  basis: David is given kingdom and wisdom, asked to judge the ewe dispute, recognizes
    a divine test, repents, is forgiven, and is appointed vicegerent commanded to
    judge with truth.
  evidence_refs:
  - ev:7
  - ev:8
  - ev:9
  - ev:10
  - ev:11
  confidence: high
  cautions: The passage does not spell out the underlying sin beyond David perceiving
    that he had been tried.
- id: motif:3
  label: Nonhuman creation joins a holy ruler in praise
  taxonomy_refs:
  - mountain
  basis: Mountains and birds are described as joining or flocking to David in lauds
    at set times.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: Only mountains match the supplied symbol taxonomy; the broader motif label
    is inferred from the literal praise scene.
- id: motif:4
  label: Penitent king receives dominion over natural and supernatural forces
  taxonomy_refs:
  - royal_legitimacy
  basis: Solomon repents after trials and receives unique dominion, including command
    over wind and Satans.
  evidence_refs:
  - ev:16
  - ev:17
  confidence: high
  cautions: The exact meaning of the phantom on the throne is not explained in the
    supplied passage.
- id: motif:5
  label: Afflicted righteous sufferer restored through divine command
  taxonomy_refs:
  - death_rebirth
  basis: Job suffers disease and pain attributed to Satan, receives cooling water,
    restored family, and is praised as patient.
  evidence_refs:
  - ev:18
  - ev:19
  - ev:20
  confidence: medium
  cautions: 'The taxonomy reference is approximate: restoration from affliction resembles
    renewal, but the passage does not narrate literal death and rebirth.'
- id: motif:6
  label: Life-giving or healing water after a foot-stamp
  taxonomy_refs:
  - water
  basis: Job is told to stamp with his foot, and the resulting cool substance is for
    washing and drinking.
  evidence_refs:
  - ev:19
  confidence: high
  cautions: The passage does not explicitly name a spring, only the function of the
