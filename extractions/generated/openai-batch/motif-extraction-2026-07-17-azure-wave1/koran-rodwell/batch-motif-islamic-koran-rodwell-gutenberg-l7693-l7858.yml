    him, and ask him to judge between them truthfully.
  category: action
  evidence_refs:
  - ev:8
- id: obs:9
  text: One pleader says his brother has ninety-nine ewes while he has one ewe and
    has over-persuaded him in the dispute.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: David judges that the many-ewe owner wronged the one-ewe owner, then perceives
    that he has been tried, asks pardon, bows, and repents.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:11
  text: David is forgiven and addressed as a vicegerent upon earth who must judge
    between people with truth and not follow passions.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage denies that heaven and earth were created for nothing and contrasts
    believers and doers of right with those who propagate evil.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: A blessed Book is said to have been sent down so that people may meditate
    on its verses and those with understanding may remember it.
  category: object
  evidence_refs:
  - ev:13
- id: obs:14
  text: Solomon is given to David and is described as an excellent servant who turned
    Godward.
  category: relationship
  evidence_refs:
  - ev:14
- id: obs:15
  text: Chargers are displayed before Solomon at eventide; he states that he loved
