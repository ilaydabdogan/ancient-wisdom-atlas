canonical_text:
  quote: ''
  summary: The passage recounts earlier peoples who rejected prophets, warns of destruction
    and afterlife punishment for unbelief, describes final judgment dialogues, contrasts
    punishment with gardens for believers, gives tree similitudes for good and evil
    words, lists divine favors in creation, and presents Abraham’s prayer for a secure
    land, protection from idols, offspring settled near the holy house, prayer, provision,
    and forgiveness.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage names earlier peoples, including the people of Noah, Ad, Themoud,
    and later groups known to God, as recipients of prophets with proofs.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The earlier recipients reject the prophetic message and express doubt about
    what the prophets bid them to accept.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: The prophets answer by identifying God as maker of the heavens and the earth
    and as one who calls people so that He may pardon sins and respite them until
    an appointed time.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The opponents describe the prophets as men like themselves, say they would
    turn them away from ancestral worship, and demand clear proof.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The apostles state that special proof can come only by God’s leave and say
    that the faithful should trust in God and endure harm with constancy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The unbelievers threaten to drive the apostles from the land or make them
    return to the unbelievers’ religion.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: The Lord reveals that the wicked will be destroyed and that the addressed
    recipients will dwell in the land after them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: The proud rebellious one is described as perishing, facing Hell, drinking
    tainted water with difficulty, being assailed by Death without dying, and seeing
    grievous torment.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:9
  text: The works of those who do not believe in their Lord are likened to ashes scattered
    by wind on a stormy day.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: All mankind is described as coming forth before God, where weak followers
    ask powerful leaders to relieve them of part of God’s vengeance.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:11
  text: After doom has been given, Satan says that God promised truth, while he deceived
    people, had no power over them, and only called them when they answered.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:12
  text: Those who believed and did right are brought into gardens beneath which rivers
    flow, remain there forever by their Lord’s permission, and receive the greeting
