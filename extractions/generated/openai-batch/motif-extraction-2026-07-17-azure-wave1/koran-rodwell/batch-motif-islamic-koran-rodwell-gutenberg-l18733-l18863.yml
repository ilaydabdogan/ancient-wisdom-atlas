candidate_motifs:
- id: motif:1
  label: Divine judgment with fire for unbelievers and gardens for believers
  taxonomy_refs:
  - divine_judgment
  basis: The passage repeatedly associates unbelief with chastisement and fire, including
    fire fueled by men and stones and final fire, while associating belief and right
    action with gardens, rivers, fruit, purity, and abiding security.
  evidence_refs:
  - ev:1
  - ev:6
  - ev:15
  confidence: high
  cautions: The passage presents these as theological outcomes, not as a comparative
    cross-tradition claim.
- id: motif:2
  label: Death, restoration to life, and return to God
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: 'A clear sequence is stated: people were dead, God gave life, God will cause
    death, God will restore life, and people will return to Him.'
  evidence_refs:
  - ev:8
  confidence: high
  cautions: The record should not infer details of an afterlife journey beyond the
    stated return and recompense.
- id: motif:3
  label: Covenant violation and disorder on earth
  taxonomy_refs:
  - covenant
  basis: The wicked are specifically described as violating God's covenant after its
    establishment and acting disorderly on earth.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage does not specify the contents of the covenant in this excerpt.
- id: motif:4
  label: Wisdom displayed through naming knowledge
  taxonomy_refs:
  - wisdom
  basis: God teaches Adam the names of all things, the angels acknowledge limited
    knowledge, and Adam demonstrates the names before them.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage grounds Adam's knowledge in divine teaching rather than independent
    acquisition.
- id: motif:5
  label: Prohibited tree, transgression, and banishment from the Garden
  taxonomy_refs: []
  basis: Adam and his wife are told not to approach a particular tree in the Garden;
    Satan makes them slip, and they are banished to earth for a time.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: Although a forbidden tree is present, this excerpt does not call it a
    tree of knowledge or state that knowledge is gained from it.
- id: motif:6
  label: Descent or departure from the Garden to earthly dwelling
  taxonomy_refs:
  - departure
  basis: After the slip, the command 'Get ye down' is issued, and earth is assigned
    as dwelling-place and provision for a time.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The departure is a banishment/descent rather than an explicitly heroic
    departure.
- id: motif:7
  label: Guidance and error figured as light, darkness, and parable
  taxonomy_refs:
  - duality
  basis: The passage contrasts guidance with error and uses images of light removed,
    darkness, lightning, and parables that guide many and mislead many.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:7
  confidence: medium
  cautions: The duality taxonomy is broad; the passage's primary terms are guidance/error,
    belief/unbelief, and light/darkness.
