    ritual setting is described in the main verses.
- id: motif:2
  label: Resurrection of decayed bones
  taxonomy_refs:
  - resurrection
  basis: A caviller asks who will give life to rotten bones, and the response says
    the one who first created them will give them life.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: The motif is presented as argument and reply, not as a narrative of an
    individual resurrection.
- id: motif:3
  label: Creation and re-creation by divine command
  taxonomy_refs:
  - resurrection
  basis: The creator of the heavens and earth is said able to create their like, and
    the command 'BE' makes a thing be; return to God follows.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The available taxonomy lacks a specific 'creative word' family, so resurrection
    is the closest supported reference.
- id: motif:4
  label: Fire from the green tree
  taxonomy_refs: []
  basis: The passage states that fire is given out of the green tree and people kindle
