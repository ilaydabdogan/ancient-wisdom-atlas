canonical_text:
  quote: His command when He willeth aught, is but to say to it, BE, and IT IS.
  summary: The passage describes eschatological judgment in which mouths are sealed
    while hands and feet testify, divine power to blind or transform, aging, the Koran
    as warning rather than poetry, created animals subjected for human use, rejection
    of powerless gods, human skepticism about resurrection from rotten bones, and
    a reply grounding resurrection in first creation, fire from the green tree, creation
    of heavens and earth, and the command 'Be.' Translator notes compare bodily testimony
    with Rabbinic passages. The passage then begins Sura XLIII, presenting the Arabic
    Koran as a transcript of an archetypal Book, recalling rejected prophets and destroyed
    earlier nations, describing God as creator of earth, routes, rain that revives
    dead land, pairs, ships, and beasts, and rejecting claims that God has offspring.
  language: English
  quote_policy: quoted
