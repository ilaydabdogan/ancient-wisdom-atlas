  summary: The passage presents revelation as a sign, mercy, and warning; answers
    demands for signs by saying signs belong to God; warns rejecters of sudden punishment
    and Hell; describes death, return to God, and reward for believers in gardens
    with rivers; points to divine providence in animals, creation, celestial order,
    rain, and revived earth; contrasts shipboard sincerity with relapse after deliverance;
    mentions a safe precinct; and opens Sura Lokman with the wise Book as guidance
    and mercy for the righteous. Translator notes gloss idols, migration/refuge, animals
    not carrying food, and the safe precinct at Mecca.
