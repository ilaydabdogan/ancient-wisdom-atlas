candidate_motifs:
- id: motif:1
  label: Righteous youths depart from an opposing community into a cave refuge
  taxonomy_refs:
  - departure
  basis: The youths separate from their people and what they worship, then betake
    themselves to the cave seeking divine mercy.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage frames the action as pious separation and refuge; it does
    not describe a broader journey beyond the cave.
- id: motif:2
  label: Miraculous long sleep followed by awakening as a sign of the Hour
  taxonomy_refs:
  - resurrection
  - death_rebirth
  basis: God causes the youths to remain insensible in the cave for many years, awakens
    them, and makes their adventure known so people may learn that God's promise and
    the Hour are true.
  evidence_refs:
  - ev:5
  - ev:13
  - ev:17
  confidence: high
  cautions: The passage describes sleep and awakening, not explicit death; the resurrection
    connection is supported by the passage's own reference to the Hour.
- id: motif:3
  label: Divine knowledge exceeds human reckoning
  taxonomy_refs:
  - wisdom
  basis: The youths cannot determine how long they have tarried, people differ about
    their number, and the passage repeatedly says God best knows the number and duration.
  evidence_refs:
  - ev:11
  - ev:15
  - ev:17
  confidence: high
  cautions: The motif is epistemic and theological rather than a narrative action
    pattern.
- id: motif:4
  label: Eschatological divine judgment of offenders and the righteous
  taxonomy_refs:
  - divine_judgment
  basis: The passage contrasts punishment prepared for offenders with gardens, rivers,
    adornments, and thrones promised to believers who do right.
  evidence_refs:
  - ev:18
  - ev:19
  confidence: high
  cautions: The passage gives outcome imagery but does not narrate a judgment scene
    in procedural detail.
- id: motif:5
  label: Revelation as warning and reward announcement
  taxonomy_refs:
  - wisdom
  basis: The Book is described as sent down by God, made direct, and given to warn
    of woe and announce reward to faithful people who do right.
  evidence_refs:
  - ev:1
  confidence: medium
  cautions: The taxonomy reference to wisdom is broad; the passage's literal emphasis
    is revelation, warning, and guidance.
