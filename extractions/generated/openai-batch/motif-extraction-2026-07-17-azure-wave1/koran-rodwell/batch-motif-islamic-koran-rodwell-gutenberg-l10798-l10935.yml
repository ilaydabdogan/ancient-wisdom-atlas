canonical_text:
  quote: ''
  summary: The passage opens Sura XVIII, "The Cave." It praises God for sending down
    the Book, warns deniers and those who say God has begotten a son, and introduces
    the youths of the Cave and Al Rakim. The youths withdraw from their people, pray
    for mercy, sleep in the cave for many years, and are later awakened. Their story
    becomes known as a sign concerning God's promise and the coming Hour. The passage
    also gives admonitions about saying "If God will," divine knowledge, patience
    with worshippers, punishment for offenders, and reward for believers in gardens
    with rivers.
  language: English
  quote_policy: summarized
