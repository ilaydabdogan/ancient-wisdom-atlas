canonical_text:
  quote: ''
  summary: The passage contrasts impatient and patient persons, warns against preferring
    present life over the next world, defends the revealed Koran, describes judgment
    before God with witnesses, and contrasts Fire with Paradise. It then recounts
    Noah’s mission to his people, their rejection and mockery, God’s command to build
    the Ark, the loading of pairs, family, and believers, the flood waters, and the
    drowning of Noah’s son after he refuses to embark.
  language: English
  quote_policy: summarized
