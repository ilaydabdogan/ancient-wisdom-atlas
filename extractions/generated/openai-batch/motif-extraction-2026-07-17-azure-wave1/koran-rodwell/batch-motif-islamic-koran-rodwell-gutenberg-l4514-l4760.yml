canonical_text:
  quote: ''
  summary: The passage describes traits of the prayerful and charitable, their belief
    in judgment, and their promised dwelling in gardens; it contrasts unbelievers
    who will rise from graves in disgrace. Sura LV praises the Merciful God as teacher,
    creator, cosmic ruler, and judge; it depicts cosmic order, paired seas, creation
    of humans and djinn, apocalyptic judgment, punishment in Hell and boiling water,
    and gardens with trees, fruit, fountains, couches, and untouched companions for
    those who fear their Lord.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A group is described as constant at prayers, giving a stated portion of their
    substance to those who ask and those ashamed to beg, affirming judgment-day, fearing
    their Lord's chastisement, controlling desires, keeping trusts, witnessing uprightly,
    and observing prayer times.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: Those with the listed traits are said to dwell with honors amid gardens.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Unbelievers are depicted running around the addressed figure in bands and
    wishing to enter a garden of delights, but they are denied this expectation.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: A threatened day is described when people come quickly out of their graves,
    compared to men rallying to a standard, with downcast eyes and disgrace covering
    them.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: God is said to have taught the Koran, created man, taught articulate speech,
    set times for the sun and moon, made plants and trees bend in adoration, raised
    heaven, appointed the balance, and prepared the earth for living tribes.
  category: action
  evidence_refs:
  - ev:5
  - ev:6
- id: obs:6
  text: The passage says man was created from clay like that of a potter and the djinn
    from pure fire.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:7
  text: God is described as Lord of the East and West; he lets loose two seas that
    meet while a barrier prevents them from overpassing; pearls are brought up from
    them; ships at sea are likened to mountains.
  category: setting
  evidence_refs:
  - ev:8
  - ev:9
