  text: Men and djinn are addressed as subject to judgment and are told they cannot
    overpass the bounds of the heavens and earth except by divine leave.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:10
  text: A bright flash of fire and molten brass are said to be hurled at men and djinn,
    and they cannot defend themselves from it.
  category: action
  evidence_refs:
  - ev:12
- id: obs:11
  text: The heaven is described as being cleft asunder and becoming rose red like
    stained leather.
  category: setting
  evidence_refs:
  - ev:13
- id: obs:12
  text: Sinners are identified by tokens, seized by their forelocks and feet, told
