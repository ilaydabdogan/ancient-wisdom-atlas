canonical_text:
  quote: ''
  summary: The passage contrasts divine reward for believing men and women with punishment
    for hypocrites, associators, and unbelievers; presents Muhammad as God’s witness,
    herald, and warner; treats the pledge to Muhammad as a pledge to God; discusses
    absent desert Arabs, battle, obedience, and exemptions; recalls the pledge under
    the tree, divine peace, victory, and booty; describes restraint in the valley
    of Mecca and delayed punishment because hidden believers might be harmed; affirms
    a dream of secure entry into the sacred Mosque; and depicts Muhammad’s companions
    in prayer, marked by prostration and compared to a growing seed.
  language: English
  quote_policy: summarized
