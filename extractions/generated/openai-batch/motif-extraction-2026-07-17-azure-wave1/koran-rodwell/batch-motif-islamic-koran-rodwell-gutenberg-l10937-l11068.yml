  quote: ''
  summary: The passage gives a parable of two men and two gardens, contrasts worldly
    wealth with lasting good works, describes final judgment and the record of deeds,
    recalls Eblis refusing the command to prostrate before Adam, warns against false
    patrons and rejection of guidance, and begins the account of Moses traveling with
    his servant to the confluence of two seas and meeting a divinely instructed servant.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A parable is set forth about two men; one is given two grape-vine gardens
    surrounded by palms, with cornfields between them.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: The gardens yield fruit without failing, and a river flows in their midst.
  category: object
  evidence_refs:
  - ev:1
- id: obs:3
  text: The garden owner boasts to his companion that he has more wealth and a mightier
    family.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: The garden owner says he does not think the garden will perish, does not think
    the Hour will come, and expects a better exchange if returned to his Lord.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:5
  text: The companion questions the garden owner's belief in the one who created him
    from dust, then from the germs of life, and fashioned him a man.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:6
  text: The companion affirms God as his Lord and says he will associate no other
    being with his Lord.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:7
  text: The companion says the garden owner should have entered the garden saying
    that what God wills occurs and that there is no power except in God.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:8
  text: The companion says God may give him better than the garden and may send heavenly
    bolts upon it or make its water sink beyond reach.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:9
  text: The garden owner's fruits are encompassed by destruction, and his vines fall
    down on their trellises.
  category: action
  evidence_refs:
  - ev:3
- id: obs:10
  text: After the destruction, the garden owner turns down the palms of his hands
    over what he spent and regrets having joined another god to his Lord.
  category: action
  evidence_refs:
  - ev:3
- id: obs:11
  text: The present life is compared to water sent from Heaven; the herb of the Earth
    is mingled with it, then becomes dry stubble scattered by winds.
  category: other
  evidence_refs:
  - ev:4
- id: obs:12
  text: Wealth and children are called the adornment of the present life, while lasting
    good works are said to be better in recompense and hope.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:13
  text: A day is described when the mountains pass away, the Earth is seen as a level
    plain, and mankind is gathered with no one left out.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:14
  text: Those gathered are set before the Lord in ranks and told that they have come
    as they were created at first.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:15
  text: Each person has a book put into his hand; the wicked are alarmed that the
    book leaves neither small nor great thing unnoted, and they find their deeds present.
  category: object
  evidence_refs:
  - ev:5
- id: obs:16
  text: The angels are commanded to prostrate before Adam; all do so except Eblis,
    who is described as of the Djinn and as revolting from his Lord's behest.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:17
  text: People are warned against taking Eblis and his offspring as patrons rather
    than God, and they are called enemies.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:18
  text: Those who joined companions with God are told to call on them; the companions
    do not answer, and a valley of perdition is placed between them.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: The wicked see the fire, foresee that they will be flung into it, and find
    no escape.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:20
  text: The passage says the Koran has presented similitudes of every kind, but man
    is often a caviller.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:21
  text: Some people are described as having veils over their hearts and heaviness
    in their ears, preventing understanding and guidance.
  category: attribute
  evidence_refs:
  - ev:8
- id: obs:22
  text: Moses says to his servant that he will not stop until he reaches the confluence
    of the two seas, even if he journeys for years.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:23
  text: At the confluence, Moses and his servant forget their fish, and it takes its
    way into the sea; later the servant says Satan made him forget to mention it.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:24
  text: Moses identifies the event of the fish as what they were seeking, and the
    two return retracing their footsteps.
  category: action
  evidence_refs:
  - ev:9
- id: obs:25
  text: Moses and his servant find one of God's servants who has received mercy and
    knowledge; Moses asks to follow him for guidance.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:26
  text: The divinely instructed servant tells Moses that Moses cannot be patient with
    him in matters whose meaning he does not comprehend.
  category: speech
  evidence_refs:
