candidate_motifs:
- id: motif:1
  label: Prosperity tested by pride and sudden ruin
  taxonomy_refs:
  - divine_judgment
  basis: The garden owner boasts in wealth, doubts the Hour, and his fruitful property
    is destroyed after the companion warns that God may bring ruin upon it.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage presents the episode explicitly as a parable and does not
    identify historical persons.
- id: motif:2
  label: Worldly life as brief vegetation cycle
  taxonomy_refs:
  - seasonal_cycle
  basis: The present life is likened to water from Heaven producing herb that soon
    becomes dry stubble scattered by winds.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The image uses plant growth and decay, but it is a moral similitude rather
    than a ritual or calendrical seasonal-cycle narrative.
- id: motif:3
  label: Final judgment with cosmic leveling and comprehensive record
  taxonomy_refs:
  - divine_judgment
  - resurrection
  basis: The mountains pass away, the Earth is leveled, all mankind is gathered, and
    each person receives a book containing every deed.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The passage emphasizes gathering and judgment; resurrection is inferred
    from coming before God as at first creation and from the broader judgment scene
    within the passage.
- id: motif:4
  label: Rebellious supernatural adversary and false patronage
  taxonomy_refs: []
  basis: Eblis refuses the command to prostrate before Adam, is described as of the
    Djinn, and people are warned not to take him and his offspring as patrons rather
    than God.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No supplied taxonomy family precisely matches this motif without adding
