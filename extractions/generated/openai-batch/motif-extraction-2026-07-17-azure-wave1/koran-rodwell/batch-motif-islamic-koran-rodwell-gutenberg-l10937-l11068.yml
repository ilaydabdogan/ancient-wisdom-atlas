- id: motif:6
  label: Rejected warning followed by fixed-time destruction
  taxonomy_refs:
  - divine_judgment
  basis: The passage says Sent Ones announce and warn, describes people rejecting
    signs, and recalls cities destroyed after warning when they became impious.
  evidence_refs:
  - ev:8
