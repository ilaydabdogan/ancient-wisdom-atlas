canonical_text:
  quote: ''
  summary: The passage recounts Moses fleeing an unjust people, traveling to Madian,
    helping two women water their flock, entering a service-and-marriage agreement
    with their father, receiving divine signs at a fire on a mountain, requesting
    Aaron as helper, confronting Pharaoh, and the destruction and afterlife condemnation
    of Pharaoh and his hosts. It then connects Moses' Law, later warning, contested
    signs, and belief by earlier scripture recipients.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Moses leaves in fear, prays for deliverance from an unjust people, and journeys
    toward Madian while asking his Lord to direct him on an even path.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: At the water of Madian, Moses finds men watering and two women keeping back
    their flock because their father is very aged.
  category: setting
  evidence_refs:
  - ev:2
- id: obs:3
  text: Moses waters for the two women, then withdraws to the shade and prays that
    he needs the good God has brought him.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: One of the women comes bashfully to invite Moses to her father, who offers
    wages for the watering; after hearing Moses' story, the father says Moses has
    escaped from an unjust people.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: One daughter recommends hiring Moses because he is strong and trusty.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The father offers to marry one of his two daughters to Moses if Moses serves
    eight years, with an optional ten-year term, and Moses accepts with God as witness.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:7
  text: After Moses fulfills the term and travels with his family, he perceives a
    fire on a mountain side and tells his family to wait while he seeks tidings or
    a brand for warmth.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:8
  text: A Voice calls to Moses from the bush at the right side of the valley in the
    sacred hollow and identifies itself as God, the Lord of the Worlds.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Moses is commanded to throw down his rod; when it moves as though it were
    a serpent, he flees and is then told to draw near and not fear.
  category: action
  evidence_refs:
  - ev:7
- id: obs:10
  text: Moses is told to put his hand into his bosom; it comes out white but unharmed,
    and the rod and hand are described as two signs from his Lord to Pharaoh and his
    nobles.
  category: object
  evidence_refs:
  - ev:8
- id: obs:11
  text: Moses says he has slain one of Pharaoh's people and fears being slain; he
    asks that his brother Aaron, clearer of speech, be sent as a helper.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:12
  text: God promises to strengthen Moses with Aaron, give both of them power, and
    grant victory to them and their followers.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: When Moses brings signs, opponents describe them as a magical device and claim
    not to have heard anything like them among their forefathers.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: Pharaoh claims that his nobles have no god known to him except himself, and
    orders Haman to make bricks and build a tower so that Pharaoh may mount up to
    the God of Moses.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Pharaoh and his hosts behave proudly and unjustly, are seized and cast into
    the sea, and are associated with hellfire, curse, shame, and the day of Resurrection.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:16
  text: After destroying former generations, God gives Moses the book of the Law as
    enlightenment, guidance, and mercy.
  category: object
  evidence_refs:
  - ev:13
- id: obs:17
  text: The addressed recipient is told he was not present at Sinai or among Madian,
    but is sent as a warner by the mercy of his Lord.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:18
  text: Opponents ask why powers like those given to Moses have not been given, call
    two works sorcery, and are challenged to bring a better guiding Book from God.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:19
  text: Recipients of earlier scriptures believe in the recited message, say it is
    truth from their Lord, and are promised a double reward for patience, repelling
    evil with good, almsgiving, and withdrawing from light discourse.
  category: sequence
  evidence_refs:
  - ev:16
