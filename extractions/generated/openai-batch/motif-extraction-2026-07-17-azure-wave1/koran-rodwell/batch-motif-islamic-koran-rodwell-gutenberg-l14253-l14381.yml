candidate_motifs:
- id: motif:1
  label: Fugitive's guided departure to refuge
  taxonomy_refs:
  - departure
  basis: Moses leaves in fear, prays for deliverance, and seeks divine direction toward
    Madian.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives a departure and journey, but does not elaborate a full
    exile cycle beyond this segment.
- id: motif:2
  label: Aid at water leading to household alliance
  taxonomy_refs:
  - sacred_exchange
  basis: Moses helps the women water their flock, is invited for wages, and enters
    a service arrangement connected with marriage.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:4
  - ev:5
  confidence: medium
  cautions: The exchange is explicitly social and contractual; its sacred quality
    is limited to God being named as witness.
- id: motif:3
  label: Service-for-marriage agreement under divine witness
  taxonomy_refs:
  - covenant
  - sacred_exchange
  basis: The father proposes marriage to one daughter for eight or ten years of service,
    Moses accepts, and God is witness of what they say.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The passage does not call the agreement a covenant; the taxonomy link
    is based on the witnessed binding agreement.
- id: motif:4
  label: Divine commissioning at fire on mountain
  taxonomy_refs:
  - initiation
  basis: Moses approaches the fire, hears the divine Voice, is reassured, receives
    signs, and is directed toward Pharaoh and his nobles.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: high
  cautions: The passage presents a commission with signs; broader initiation structure
    is inferred only at a motif-family level.
- id: motif:5
  label: Rod becomes serpent as divine sign
  taxonomy_refs:
  - serpent
  basis: Moses throws down his rod and sees it move as though it were a serpent, causing
    him to flee before reassurance.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The passage says the rod moved as though it were a serpent; it does not
    further describe the serpent.
- id: motif:6
  label: Brother as mission-helper
  taxonomy_refs:
  - sibling_pair
  basis: Moses asks for his brother Aaron, clearer in speech, to be sent with him
    as help, and God promises to strengthen Moses' arm with his brother.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage emphasizes assistance and speech, not twinship or rivalry.
- id: motif:7
  label: Proud ruler seeks a heavenward tower
  taxonomy_refs:
  - ascent
  basis: Pharaoh orders Haman to build a tower so he may mount up to the God of Moses
    while declaring Moses a liar.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The ascent is intended or claimed by Pharaoh; the passage does not narrate
    an actual ascent.
- id: motif:8
  label: Divine judgment by sea and afterlife shame
  taxonomy_refs:
  - divine_judgment
  - resurrection
  basis: Pharaoh and his hosts are seized, cast into the sea, associated with hellfire,
    cursed in this world, and shamed on the day of Resurrection.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The judgment is directed at Pharaoh and hosts within this passage; broader
    eschatological doctrine is not expanded here.
- id: motif:9
  label: Guiding scripture as mercy and warning
  taxonomy_refs:
  - wisdom
  basis: The book of the Law is given to Moses for enlightenment, guidance, and mercy;
    the later word comes so people may be warned.
  evidence_refs:
  - ev:13
  - ev:14
  - ev:15
  confidence: high
  cautions: The taxonomy reference is broad; the passage uses guidance, warning, and
    reflection language rather than a named wisdom genre.
comparison_claims:
- id: claim:1
  claim: The passage itself places Moses' Law and the later recited message in a shared
    function as divine guidance and warning.
  claim_level: same_function
  target: Moses' book of the Law and the later recited message/Book in the passage
  evidence_refs:
  - ev:13
  - ev:15
  - ev:16
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage does not provide a systematic comparison of the texts;
    it links them through guidance language, belief by earlier scripture recipients,
    and the challenge to bring a better guiding Book.
- id: claim:2
  claim: The passage explicitly compares demanded powers for the addressed warner
    with powers given to Moses, making Moses' signs a benchmark for contested prophetic
    validation.
  claim_level: same_function
  target: Moses' signs and requested similar powers for the later warner
  evidence_refs:
  - ev:8
  - ev:10
  - ev:15
  counter_evidence_refs: []
  confidence: medium
  limitations: The comparison is limited to the passage's polemical context; it does
    not list which powers are being demanded beyond reference to those given to Moses.
