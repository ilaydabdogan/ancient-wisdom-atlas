canonical_text:
  quote: ''
  summary: The passage warns believers not to affront Moses, states that God cleared
    and esteemed him, exhorts believers to fear God and speak rightly, describes the
    Faith as a burden offered to the heavens, earth, and mountains but undertaken
    by man, and contrasts divine punishment for hypocrites and associators with mercy
    toward believers. It then includes translator notes and begins Sura LXIII, where
    hypocrites falsely testify, use faith as a cloak, are described with images of
    sealed hearts and leaning timbers, and refuse the Apostle's request for pardon
    on their behalf.
  language: English
  quote_policy: summarized
