canonical_text:
  quote: ''
  summary: The passage presents natural phenomena and created order as signs of God;
    contrasts believers with those who mock or reject the signs; describes revelation,
    divine law, Israelite reception of Book, Wisdom, and Prophecy; affirms resurrection
    and judgment by recorded deeds; depicts nations kneeling before their books; and
    opens Sura XVI with divine doom, angelic descent with the Spirit, creation of
    heaven and earth, and creation of man from a moist germ.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The succession of night and day, a heavenly supply that gives life to dead
    earth, and the change of winds are described as signs for a discerning people.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: A lying sinner hears God's signs recited, persists in proud disdain, and turns
    signs into ridicule; punishment and Hell are described for such people.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: God is said to have subjected the sea so ships may traverse it, people may
    seek bounty, and people may be thankful.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: All that is in the heavens and on the earth is said to be subjected to people
    and to contain signs for those who reflect.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:5
  text: Believers are told to pardon those who do not hope for the days of God, and
    individual right or evil action is said to return to the benefit or hurt of the
    doer.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:6
  text: The children of Israel are described as having received the Book, Wisdom,
    Prophecy, good things, privilege above peoples, and clear sanctions; their later
    disputes are to be judged on the day of resurrection.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:7
  text: The addressed figure is set over a divine law and told to follow it; the Book
    is described as insight, guidance, and mercy for those firm in faith.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: God is said to have created the heavens and the earth in truth so that every
    person may be rewarded according to what they have wrought.
  category: action
  evidence_refs:
  - ev:7
- id: obs:9
  text: One who has made a god of his passions is described as having ears and heart
    sealed and sight covered by a veil.
  category: attribute
  evidence_refs:
  - ev:7
- id: obs:10
  text: Some deny an afterlife by saying there is only present life and that time
    destroys them; when signs are recited, they demand that their fathers be brought
    back.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:11
  text: God is said to give life, cause death, and assemble people on the day of resurrection.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:12
  text: On the day when the Hour arrives, every nation is seen kneeling and summoned
    to its own book, and people are repaid according to what they have wrought.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The Book is said to speak with truth because what people have done has been
    written in it.
  category: object
  evidence_refs:
  - ev:9
- id: obs:14
  text: Believers who wrought righteousness are caused to enter their Lord's mercy,
    while infidels are confronted for scorning signs and are assigned an abode in
    the fire with no helper.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:15
  text: At the opening of Sura XVI, the doom of God is said to come to pass; God is
