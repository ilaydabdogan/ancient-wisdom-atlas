candidate_motifs:
- id: motif:1
  label: Natural phenomena as divine signs for discernment
  taxonomy_refs:
  - wisdom
  basis: The passage identifies night and day, heavenly supply reviving earth, winds,
    the sea, ships, and the heavens and earth as signs for discernment or reflection.
  evidence_refs:
  - ev:1
  - ev:3
  confidence: high
  cautions: The taxonomy reference is broad; the passage frames these as signs rather
    than as a narrative wisdom quest.
- id: motif:2
  label: Revival after death and resurrection
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The text describes dead earth being given life and explicitly states that
    God gives life, causes death, and assembles people on the day of resurrection.
  evidence_refs:
  - ev:1
  - ev:8
  confidence: high
  cautions: The revived earth and human resurrection occur in the same passage, but
    the passage does not spell out a detailed analogy between them.
- id: motif:3
  label: Divine judgment according to recorded deeds
  taxonomy_refs:
  - divine_judgment
  - resurrection
  basis: People are to return to their Lord, disputes are judged on the day of resurrection,
    nations are summoned to their books, and recompense is according to deeds written
    in a truthful Book.
  evidence_refs:
  - ev:4
  - ev:5
  - ev:7
  - ev:9
  confidence: high
  cautions: No external judgment tradition is asserted; extraction is limited to the
    passage.
- id: motif:4
  label: Revealed book, wisdom, and law as guidance
  taxonomy_refs:
  - wisdom
  basis: The children of Israel receive Book, Wisdom, and Prophecy; the addressed
