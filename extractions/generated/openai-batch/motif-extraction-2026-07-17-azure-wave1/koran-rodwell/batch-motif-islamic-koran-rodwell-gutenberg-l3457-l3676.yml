canonical_text:
  quote: ''
  summary: The passage contains Sura LXXXIII, warning those who cheat in measure that
    they will be raised for judgment, contrasting the written registers and afterlife
    fates of the wicked and the righteous; and part of Sura LXIX, recalling destroyed
    peoples and the Flood, describing cosmic upheaval, the presentation of judgment-books
    in the right or left hand, reward in a lofty garden, punishment in Hell, and the
    Koran as a warning and truth from the Lord.
  language: English, with a Latin line at the opening
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Those who stint the measure are condemned for exacting full measure from others
    while diminishing what they mete or weigh, and are asked whether they think they
    will be raised for a great day before the Lord of the worlds.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The register of the wicked is placed in Sidjin and described as a distinctly
    written book; deniers of the signs and judgment are veiled from their Lord and
    burned in Hell-fire.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The register of the righteous is placed in Illiyoun, described as a distinctly
    written book attested by angels; the righteous dwell among delights, recline on
    couches, drink sealed wine mixed with Tasnim, and drink from a fount.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sinners laugh at the faithful, wink, jest, and call them erring; later the
    faithful laugh at the infidels while reclining on couches and beholding them recompensed.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:5
  text: Themoud and Ad are said to have treated the day of Terrors as a lie and were
    destroyed respectively by crashing thunderbolts and by a roaring furious blast
    lasting seven nights and eight days.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:6
  text: Pharaoh, earlier peoples, and overthrown cities sinned and disobeyed a sent
    one of their Lord, resulting in accumulated chastisement.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: When the Flood rose high, the addressed group is said to have been borne in
    the Ark so that the event might serve as a warning to be retained.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:8
  text: At one trumpet blast, the earth and mountains are upheaved and crushed, the
    heaven cleaves, angels stand on its sides, and eight bear the throne of the Lord.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: On the judgment day, people are brought before God and no hidden deeds remain
    hidden; one receiving his book in his right hand rejoices and enters a pleasing
    life in a lofty garden with food and drink.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:10
  text: One receiving his book in his left hand wishes he had not received it or known
    his reckoning, says wealth and power have perished, and is commanded to be seized,
    chained, burned, and thrust into a seventy-cubit chain.
  category: sequence
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:11
  text: The punished left-hand recipient is said to have not believed in God and not
    been careful to feed the poor; he has no friend and no food except corrupt sores.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:12
  text: The passage states that the recited message is the word of an honoured apostle,
    not a poet or soothsayer, and is a missive from the Lord of the worlds; it also
    states conditionally that if Muhammad had fabricated sayings, God would have seized
    him and cut through the vein of his neck.
  category: speech
  evidence_refs:
  - ev:12
