candidate_motifs:
- id: motif:1
  label: Divine judgment and final accounting
  taxonomy_refs:
  - divine_judgment
  basis: The passage repeatedly states that judgment belongs to God, that souls return
    to Him, that every soul is consigned according to works, and that a trumpet day
    belongs to His kingdom.
  evidence_refs:
  - ev:6
  - ev:9
  - ev:12
  - ev:16
  - ev:18
  - ev:19
  confidence: high
  cautions: The passage emphasizes judgment and accounting; it does not give a detailed
    narrative of the judgment scene.
- id: motif:2
  label: Soul-taking at night and at death
  taxonomy_refs: []
  basis: God takes souls at night and awakens people until their set life-term, while
    guardians watch and messengers take the soul at death before return to God.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage gives a sequence of taking, awakening, death, and return,
    but not a detailed geography of the soul's journey.
- id: motif:3
  label: Divine omniscience and hidden record
  taxonomy_refs:
  - wisdom
  basis: God alone has the keys of secret things, knows unseen and seen, and all details
    of land, sea, falling leaves, hidden grains, and living or dry things are noted
    in a distinct writing.
  evidence_refs:
  - ev:10
  - ev:19
  confidence: medium
  cautions: The taxonomy link to wisdom is broad; the immediate emphasis is divine
    knowledge rather than a wisdom quest.
- id: motif:4
  label: Mercy after repentance
  taxonomy_refs: []
  basis: The Lord is said to have laid down a law of mercy by which one who commits
    a fault through ignorance and then turns and amends receives gracious mercy.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: This is a doctrinal mercy-and-repentance pattern rather than a developed
    narrative motif.
- id: motif:5
  label: Rescue from darkness followed by renewed ingratitude
  taxonomy_refs: []
  basis: People cry to God from the darkness of land and sea, vow thankfulness, are
    rescued by God, and afterward give Him companions.
  evidence_refs:
  - ev:13
  confidence: high
  cautions: The passage presents the pattern as admonitory speech, not as a named
    mythic episode.
- id: motif:6
  label: Demonic bewilderment opposed by true guidance
  taxonomy_refs:
  - trickster_boundary
  basis: The text compares turning back after guidance to a man in the desert spell-bound
    by Satans while companions call him toward true guidance.
  evidence_refs:
  - ev:17
  confidence: medium
  cautions: The taxonomy reference is tentative because the passage features demonic
    misdirection rather than a full trickster narrative.
- id: motif:7
  label: Creation by divine word
  taxonomy_refs: []
  basis: God creates the heavens and the earth in truth, and when He says to a thing,
    'Be,' it is.
  evidence_refs:
  - ev:19
  confidence: high
  cautions: The available taxonomy list does not include a direct creation-by-word
    motif family.
- id: motif:8
  label: Patriarch rejects images and receives cosmic disclosure
  taxonomy_refs:
  - wisdom
  basis: Abraham rebukes Azar for taking images as gods and is shown the kingdom of
    the heavens and earth to be established in knowledge.
  evidence_refs:
  - ev:20
  confidence: medium
  cautions: The wisdom taxonomy link is limited to the passage's statement that Abraham
    is established in knowledge; the passage excerpt does not narrate the later development
    of Abraham's reasoning.
