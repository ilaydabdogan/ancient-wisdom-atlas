canonical_text:
  quote: ''
  summary: The passage warns against rejecting God's signs, emphasizes God's exclusive
    power over judgment, secret knowledge, rescue, death, and creation, describes
    the taking and return of souls, contrasts divine guidance with demonic bewilderment,
    and introduces Abraham's rebuke of Azar for treating images as gods before Abraham
    is shown the kingdom of heaven and earth.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An impious people is described as cut off, followed by praise of God as Lord
    of the Worlds.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: God is said to be able to take away hearing and sight and set a seal upon
    hearts, with no other god able to restore them.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The passage says punishment from God may come suddenly or foreseen, and asks
    whether any perish except the impious.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:4
  text: Sent Ones are described as heralds of good news and warners; believers who
    amend have no fear or sorrow, while those who treat signs as false are punished.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:5
  text: The commanded speaker denies possessing God's treasures, knowing secret things,
    or being an angel, and says he follows only what is revealed to him.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:6
  text: Those who dread being gathered to their Lord are to be warned that they have
    no patron or intercessor except Him.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The speaker is told not to thrust away people who call on their Lord morning
    and evening and crave to behold His face.
  category: action
  evidence_refs:
  - ev:7
- id: obs:8
  text: 'A law of mercy is stated: one who commits a fault through ignorance and then
    turns and amends will find the Lord gracious and merciful.'
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: The speaker is forbidden to worship those called upon beside God and says
    judgment belongs only to God.
  category: speech
  evidence_refs:
  - ev:9
