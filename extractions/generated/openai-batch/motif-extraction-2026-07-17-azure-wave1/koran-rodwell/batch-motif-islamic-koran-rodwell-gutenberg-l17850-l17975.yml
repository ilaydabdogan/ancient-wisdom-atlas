    their return.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: God sends guardians to watch over servants until death, when messengers take
    the soul and the person is returned to God for judgment and account.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:13
  text: God rescues people from the darkness of land and sea and from every strait,
    though they later give Him companions.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: God has power to send punishment from above, from beneath the feet, or through
    discord and mutual violence.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: The speaker is instructed to withdraw from people who cavil at God's signs
