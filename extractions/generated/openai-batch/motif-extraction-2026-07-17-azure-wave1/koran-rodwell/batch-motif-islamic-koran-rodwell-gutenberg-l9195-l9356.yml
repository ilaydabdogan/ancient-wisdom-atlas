canonical_text:
  quote: ''
  summary: The supplied lines include translator notes followed by the opening of
    Sura XXI, “The Prophets.” The sura depicts a people whose reckoning is near but
    who mock new warnings and accuse the addressed messenger of sorcery, dreams, forgery,
    and poetry. It presents God as the knower, creator, sole deity, sovereign of the
    throne, sender of mortal apostles, destroyer of transgressors, and giver of cosmic
    order. It describes obedient angels, the destruction of guilty cities, the separation
    of heaven and earth, life given through water, stabilizing mountains, celestial
    cycles, universal death, testing with good and evil, return to God, and sudden
    hellfire for scoffers.
