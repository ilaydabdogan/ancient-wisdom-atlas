candidate_motifs:
- id: motif:1
  label: Communal apostasy followed by rebuke and divine judgment
  taxonomy_refs:
  - divine_judgment
  - covenant
  basis: The calf is taken as a god; Moses returns in anger, and those who took the
    calf are threatened with divine wrath and shame, while repentance remains possible.
  evidence_refs:
  - ev:1
  - ev:2
  confidence: high
  cautions: The passage does not narrate the making of the calf, only the aftermath
    and judgment.
- id: motif:2
  label: Intercession after communal trial
  taxonomy_refs:
  - divine_judgment
  basis: Moses asks forgiveness for himself and his brother, and later intercedes
    after the earthquake overtakes the seventy men, asking that all not be destroyed
    for the acts of foolish ones.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage frames the appeal as prayer to the Lord rather than a formal
    legal mediation scene.
- id: motif:3
  label: Sacred writing as guidance and mercy
  taxonomy_refs:
  - wisdom
  - covenant
  basis: The tables' writing is said to contain guidance and mercy, and later the
    inherited Book and Scripture covenant guide truth-speaking, prayer, and righteousness.
  evidence_refs:
  - ev:2
  - ev:9
  confidence: high
  cautions: The passage does not detail the contents of the tables or Book beyond
    their moral and covenantal function.
- id: motif:4
  label: Selected representatives overtaken by theophanic disaster
  taxonomy_refs:
  - divine_judgment
  - initiation
  basis: Seventy men are chosen for an appointed meeting, are overtaken by an earthquake,
    and Moses calls the event a divine trial involving misguidance and guidance.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The initiation label is approximate; the passage explicitly calls it a
    trial but does not describe an initiation rite.
- id: motif:5
  label: Miraculous wilderness provision
  taxonomy_refs: []
  basis: The Israelites receive water from a rock, twelve fountains corresponding
    to their groups, cloud shade, manna, and quails.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: No available motif-family taxonomy exactly matches miraculous provision;
    water is recorded separately as a symbol.
- id: motif:6
  label: Ordered twelvefold tribal provision
  taxonomy_refs: []
  basis: The Israelites are divided into twelve tribes, and twelve fountains emerge
    so that each group knows its drinking place.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage presents the number and order literally; broader numerological
    interpretation is not supplied.
- id: motif:7
  label: Ritualized entry with forgiveness word
  taxonomy_refs:
  - covenant
  - sacred_exchange
  basis: The people are told to dwell in a city, eat, say a forgiveness word, and
    enter the gate with prostrations; pardon and increase are promised, but altering
    the word brings wrath.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The sacred-exchange taxonomy is tentative because the passage frames the
    act as obedience and pardon, not a negotiated exchange.
- id: motif:8
  label: Sabbath trial and punitive metamorphosis
  taxonomy_refs:
  - divine_judgment
  - shapeshifter
  basis: The sea-city inhabitants are tested by fish appearing on the Sabbath; wrongdoers
    are punished, and persistent offenders are told to become scouted apes.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The shapeshifter reference is approximate because the transformation is
    punitive and commanded, not voluntary shape-changing.
- id: motif:9
  label: Testing by good and evil things to prompt return
  taxonomy_refs:
  - divine_judgment
  basis: The people are divided across the earth and tested by good things and evil
    things so that they might return.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage states the testing function directly but gives limited detail
