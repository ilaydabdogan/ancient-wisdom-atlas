  text: Moses asks the Lord to forgive him and his brother and bring them into divine
    mercy.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: Those who took the calf as a god are said to receive wrath from their Lord
    and shame in present life, while those who repent and believe after evil are promised
    lenience and mercy.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:5
  text: When Moses' anger is stilled, he takes up the tables, whose writing contains
    guidance and mercy for those who dread their Lord.
  category: object
  evidence_refs:
  - ev:2
- id: obs:6
  text: Moses chooses seventy men for an appointed meeting, and an earthquake overtakes
    them.
  category: action
  evidence_refs:
  - ev:3
- id: obs:7
  text: Moses interprets the event as a divine trial and asks for forgiveness, mercy,
    and good in this world and the world to come.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:8
  text: The divine response states that chastisement and mercy are assigned by divine
    will, and that mercy is written for those who fear God, pay alms, believe in signs,
    and follow the Apostle.
  category: speech
  evidence_refs:
  - ev:3
  - ev:4
- id: obs:9
  text: The Apostle is described as the unlettered Prophet found described in the
