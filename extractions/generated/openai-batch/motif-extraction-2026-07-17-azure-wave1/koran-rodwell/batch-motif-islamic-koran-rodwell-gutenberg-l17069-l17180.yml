canonical_text:
  quote: ''
  summary: The passage recounts Moses returning angrily to his people after the calf
    episode, interceding for himself and his brother, receiving tablets of guidance,
    selecting seventy men for an appointed meeting overtaken by an earthquake, and
    addressing divine mercy and chastisement. It then describes the unlettered Prophet,
    Mosaic-Israelite divisions and wilderness provisions, a gate-forgiveness command,
    a Sabbath trial at a city by the sea ending in punishment, the inheritance of
    the Book and covenant obligations, a mount shaken over the people, and the primordial
    witness of Adam's descendants to God's lordship.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Moses returns to his people in anger, rebukes them for what they did after
    his departure, throws down the tables, and seizes his brother by the head.
  category: action
  evidence_refs:
  - ev:1
