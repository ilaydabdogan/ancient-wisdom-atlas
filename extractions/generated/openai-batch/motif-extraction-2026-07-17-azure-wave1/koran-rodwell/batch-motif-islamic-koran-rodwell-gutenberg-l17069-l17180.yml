    impure things, eases burdens and yokes, and is accompanied by a sent-down light.
  category: attribute
  evidence_refs:
  - ev:4
- id: obs:10
  text: A proclamation addresses all people, presenting the speaker as God's apostle
    and calling them to believe in God and follow the unlettered Prophet.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:11
  text: Among the people of Moses there is said to be a number who guide others with
    truth and practice right according to it.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:12
  text: The Israelites are divided into twelve tribes, and when the people ask Moses
    for drink, he is told to strike the rock with his staff; twelve fountains gush
    forth and each group knows its drinking place.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:13
  text: Clouds overshadow the Israelites, and manna and quails are sent down to them
    as good things supplied to them.
  category: object
  evidence_refs:
  - ev:6
- id: obs:14
  text: The people are told to dwell in a city, eat freely, say a word of forgiveness,
    and enter the gate with prostrations so that offences may be pardoned.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:15
  text: Ungodly ones change the commanded word, and wrath from Heaven is sent upon
    them for wrongdoing.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:16
  text: A city by the sea is described where inhabitants break the Sabbath; fish appear
