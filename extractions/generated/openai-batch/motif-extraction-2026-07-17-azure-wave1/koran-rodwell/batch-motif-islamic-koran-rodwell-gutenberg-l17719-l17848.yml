canonical_text:
  quote: ''
  summary: The passage commands reflection on the fate of earlier deniers, proclaims
    God as owner, creator, nourisher, witness, guide, and judge, rejects companion-gods,
    describes the revelation of the Koran as warning, depicts the gathering and punishment
    of deniers on the Resurrection Day or Hour, compares Muhammad’s rejection with
    earlier apostles’ rejection, mentions a hypothetical opening into the earth or
    ladder into heaven for obtaining a sign, states that animals and birds are communities
    gathered to their Lord, and recounts former nations ignoring warnings before sudden
    divine seizure.
  language: English
  quote_policy: summarized
