canonical_text:
  quote: ''
  summary: The passage states that certain prohibitions were placed upon the Jews,
    affirms divine mercy for those who repent, presents Abraham as an obedient monotheistic
    religious leader chosen and guided by God, instructs the addressee to follow Abraham's
    religion, describes the Sabbath as connected to disputes to be judged by God on
    the day of resurrection, commands wise and kindly summons to God's way, limits
    reprisals and praises patience, and begins Sura XXX by announcing the defeat and
    future victory of the Greeks under God's promise and aid.
