canonical_text:
  quote: ''
  summary: The passage contains Sura LI and the opening of Sura LII in Rodwell's English
    translation. It announces coming judgment through oaths by cosmic and sacred objects,
    contrasts punishment by fire with gardens and fountains for the God-fearing, recounts
    Abraham's honored guests and the announced son, describes punitive missions against
    wicked peoples, recalls Moses and Pharaoh and earlier destroyed peoples, states
    that heaven and earth were created and things made in pairs, and opens Sura LII
    with an oath by the Mountain and a vision of cosmic upheaval and Hellfire.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: The passage begins Sura LI with oaths by scattering clouds or winds, load-bearing
    and swift moving agents, and those who apportion by command, followed by an assertion
    that judgment will come.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Liars and those who ask when the day of judgment will occur are said to be
    tormented at the fire and told to taste the torment they had challenged.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: The God-fearing are described as dwelling amid gardens and fountains, having
    slept little at night, prayed at dawn for pardon, and given wealth to suppliants
    and outcasts.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:4
  text: Earth, human selves, and heaven are described as containing signs, sustenance,
    and what has been promised.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Abraham receives honored guests who greet him with peace; he brings a fatted
    calf and sets it before them.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Abraham fears the guests, but they tell him not to fear and announce a wise
    son.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Abraham's wife reacts with an outcry, smites her face, and says she is old
    and barren; the guests reply that this is what her Lord has said.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:8
  text: The messengers say they are sent to a wicked people to hurl stones of clay
    destined by the Lord for people guilty of excesses.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: Believers are brought forth from the city, but only one Muslim family is found
    there, and signs are left for those who dread chastisement.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Moses is sent to Pharaoh with manifest power; Pharaoh rejects him as a sorcerer
    or possessed, and Pharaoh and his hosts are cast into the sea.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: Ad are destroyed by a desolating blast that turns what it touches to dust.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:12
  text: Themoud rebel against their Lord's command and are taken by a tempest while
    watching its coming.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:13
  text: The people of Noah are described as destroyed before the other examples because
    they were impious.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:14
  text: Heaven is described as built and expanded, earth as spread out like a carpet,
    and everything as created in pairs.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:15
  text: The speaker commands people to flee to God, warns against setting another
    god with God, and says Djinn and men were created to worship God.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:16
  text: Sura LII opens with oaths by the Mountain, a written book on an outspread
    roll, a frequented fane, a lofty vault, and a swollen sea.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:17
