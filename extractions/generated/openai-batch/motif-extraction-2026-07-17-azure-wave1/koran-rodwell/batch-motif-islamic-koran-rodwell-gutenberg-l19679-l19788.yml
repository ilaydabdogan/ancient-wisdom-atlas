canonical_text:
  quote: God said to them, "Die:" then He restored them to life
  summary: 'The passage gives regulations concerning divorce, nursing, widow waiting
    periods, marriage proposals, dowry, maintenance, prayer, and provision. It then
    presents exempla and exhortations: a multitude who fled death are killed and restored
    by God; believers are called to fight and to make a goodly loan to God; the children
    of Israel ask a prophet for a king after Moses; Saul is appointed by God and confirmed
    by the Ark; Saul tests his forces at a river; a faithful small group faces Goliath;
    David slays Goliath and receives kingship and wisdom from God.'
  language: English
