  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; short excerpt used.
- id: ev:3
  type: summary
  locator: 12777-12780
  quote_or_summary: Noah is told that the son is not of his family in this matter
    and is warned not to ask about what he does not know.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:4
  type: summary
  locator: 12781-12784
  quote_or_summary: Noah turns to his Lord, asks not to request what he does not know,
    and seeks forgiveness and mercy.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:5
  type: summary
  locator: 12785-12789
  quote_or_summary: Noah is told to debark with peace and blessings on him and future
    peoples from those with him; unbelieving peoples are warned of later punishment.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:6
  type: quote
  locator: 12794-12796
  quote_or_summary: '"And unto Ad we sent their Brother HOUD"; he says, "O my people,
    worship God."'
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; short excerpt used.
- id: ev:7
  type: summary
  locator: 12797-12803
  quote_or_summary: Houd asks no recompense, urges pardon and turning to God, and
    promises copious rains and increased strength if they turn from evil.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:8
  type: summary
  locator: 12804-12808
  quote_or_summary: Ad tell Houd he has brought no proofs, refuse to abandon their
    gods, and suggest some gods have smitten him with evil.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:9
  type: summary
  locator: 12809-12817
  quote_or_summary: Houd calls God and the people to witness, challenges their conspiracy,
