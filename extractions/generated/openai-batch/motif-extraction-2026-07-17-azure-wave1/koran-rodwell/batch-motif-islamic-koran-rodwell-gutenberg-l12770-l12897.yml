canonical_text:
  quote: ''
  summary: The passage recounts the close of Noah's flood, including the abating waters,
    the Ark resting on Al-Djoudi, Noah's plea concerning his son, and Noah's ordered
    disembarkation with peace and blessing. It then presents the missions of Houd
    to Ad and Saleh to Themoud, each involving a call to worship God, rejection by
    the people, rescue of the faithful, and punishment of the rejecting community.
    The passage also recounts messengers visiting Abraham with peace and glad tidings
    of Isaac and Jacob, Abraham's plea for the people of Lot, and the messengers'
    later arrival at Lot's house, where Lot fears for his guests before his people
    rush toward him.
  language: English
  quote_policy: summarized
