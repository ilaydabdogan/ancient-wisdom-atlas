    turn back.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:10
  type: summary
  locator: 12818-12825
  quote_or_summary: When doom comes, Houd and those with like faith are rescued by
    mercy; Ad are described as rejecting signs, following proud persons, being cursed,
    and being cast far away.
  source_text_path: texts/public-domain/islamic/project-gutenberg/koran-rodwell.md
  rights_note: Public domain source; summarized.
- id: ev:11
  type: quote
  locator: 12826-12829
  quote_or_summary: '"And unto Themoud we sent their Brother Saleh"; he says to worship
    God, who raised them from the earth and gave them dwelling there.'
