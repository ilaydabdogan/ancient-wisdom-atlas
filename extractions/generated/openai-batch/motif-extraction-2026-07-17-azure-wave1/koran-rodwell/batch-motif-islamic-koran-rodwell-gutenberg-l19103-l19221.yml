  category: action
  evidence_refs:
  - ev:6
- id: obs:12
  text: The passage reports claims that only Jews or Christians will enter Paradise
    and answers by asking for proof.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:13
  text: Those who set their face Godward with resignation and do what is right are
