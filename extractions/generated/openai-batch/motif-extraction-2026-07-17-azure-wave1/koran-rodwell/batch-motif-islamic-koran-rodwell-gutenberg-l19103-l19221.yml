  quote: ''
  summary: The passage rejects sorcery associated with Satans and Harut and Marut,
    instructs believers in speech and worship, addresses disputes with People of the
    Book, affirms divine sovereignty and judgment, and recounts Abraham and Ismael
    founding and purifying the Holy House while praying for a future apostle to teach
    the Book and Wisdom.
  language: English
