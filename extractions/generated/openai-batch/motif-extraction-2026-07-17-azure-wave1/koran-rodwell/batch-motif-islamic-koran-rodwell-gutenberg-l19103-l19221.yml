literal_observations:
- id: obs:1
  text: The passage says people followed what the Satans read in Solomon's reign,
    while denying that Solomon was unbelieving and stating that the Satans were unbelieving.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: Sorcery is described as taught to men and as connected with what was revealed
    to the two angels, Harut and Marut, at Babel.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Harut and Marut are said not to teach anyone until warning that they are only
    a temptation and telling the hearer not to be an unbeliever.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:4
  text: Men learn from the two how to cause division between man and wife, but the
    passage states that no harm occurs except by God's leave.
  category: relationship
  evidence_refs:
  - ev:1
- id: obs:5
  text: Believers are instructed not to say “Raina” to the apostle, but to say “Ondhorna”
    and attend.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: The passage says some among the People of the Book and the idolaters do not
    desire good to be sent down to the believers from their Lord, while God shows
    special mercy to whom He wills.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:7
  text: Canceled or forgotten verses are said to be replaced by a better verse or
    its like.
  category: sequence
  evidence_refs:
  - ev:4
