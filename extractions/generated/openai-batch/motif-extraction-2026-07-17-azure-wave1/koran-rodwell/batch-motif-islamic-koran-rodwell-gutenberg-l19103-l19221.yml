candidate_motifs:
- id: motif:1
  label: Forbidden or dangerous knowledge taught under warning
  taxonomy_refs:
  - forbidden_knowledge
  basis: Sorcery is taught through Satans and Harut and Marut; the angels warn that
    they are a temptation, and the learned art harms rather than profits.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage frames the knowledge as a temptation and harmful art, but
    does not narrate a theft of knowledge.
- id: motif:2
  label: Divine judgment with no ransom or intercession
  taxonomy_refs:
  - divine_judgment
  basis: God judges disputes on the resurrection day; the Children of Israel are warned
    of a day without ransom or intercession; unbelievers are driven to the Fire.
  evidence_refs:
  - ev:7
  - ev:11
  - ev:14
  confidence: high
  cautions: The passage emphasizes judgment and punishment but does not give a detailed
    afterlife journey.
- id: motif:3
  label: Covenant after fulfilled testing
  taxonomy_refs:
  - covenant
  basis: Abraham fulfills divine commands, is made an Imm to mankind, and receives
    a statement about God's covenant excluding evildoers.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage gives a compressed account of the trial and covenant rather
    than a full narrative cycle.
- id: motif:4
  label: Sacred sanctuary founded and purified as ritual center
  taxonomy_refs:
  - world_center
  basis: The Holy House is appointed as a resort and safe retreat; Abraham's station
    becomes a prayer place; Abraham and Ismael purify the House and raise its foundations
    for ritual devotion.
  evidence_refs:
  - ev:13
  - ev:15
  confidence: medium
  cautions: The passage marks the House as a ritual center, but it does not explicitly
    call it the world's center.
- id: motif:5
  label: Transmission of Book and Wisdom through an apostolic teacher
  taxonomy_refs:
  - wisdom
  basis: Abraham and Ismael pray for an apostle who will rehearse God's signs, teach
    the Book and Wisdom, and purify the people.
  evidence_refs:
  - ev:15
  confidence: high
  cautions: The motif is expressed as a prayer for future teaching, not as a completed
    teaching episode within this passage.
- id: motif:6
  label: Divine creation by command
  taxonomy_refs: []
  basis: God is described as the sole maker of the Heavens and Earth who decrees a
    thing by saying “Be,” and it is.
  evidence_refs:
  - ev:9
