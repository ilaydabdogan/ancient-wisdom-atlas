canonical_text:
  quote: ''
  summary: The passage describes a partition called Al Araf between Paradise and the
    Fire, where men recognize others by tokens and address the inhabitants of both
    realms. The inmates of the Fire request water and refreshment from Paradise but
    are refused. The passage then speaks of the Book, belated recognition of prophetic
    truth, divine creation and cosmic ordering, prayer, the earth’s order, rain reviving
    dead land as a sign of bringing forth the dead, and successive prophetic episodes
    involving Noah, Houd to Ad, and Saleh to Themoud, including rejection by proud
    chiefs, deliverance of some, punishment of rejectors, and the she-camel of God
    as a sign.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A partition and wall called Al Araf stand between groups; men on the wall
    know all by their tokens, greet the inmates of Paradise, and long to enter it.
  category: setting
  evidence_refs:
  - ev:1
- id: obs:2
  text: When the men on Al Araf look toward the inmates of the Fire, they ask their
    Lord not to place them with the offending people.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Those on Al Araf address people they know by tokens, saying that their amassings
    and pride have not helped them, and then say to enter Paradise without fear or
    grief.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:4
  text: The inmates of the Fire ask the inmates of Paradise to pour upon them water
    or refreshments given by God; the reply says God has forbidden both to unbelievers.
  category: speech
  evidence_refs:
  - ev:2
- id: obs:5
  text: The passage says that those who made religion sport and pastime and denied
    the signs will be forgotten, and that the Book has been explained with knowledge
    as guidance and mercy for believers.
  category: speech
  evidence_refs:
  - ev:2
  - ev:3
- id: obs:6
  text: When the interpretation comes, those formerly oblivious of it acknowledge
    that the prophets brought truth and ask whether an intercessor or a return is
    possible; the passage says they have ruined themselves and their devised deities
    have fled.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:7
  text: God is described as creating the heavens and the earth in six days, mounting
    the throne, covering day with night, and subjecting the sun, moon, and stars to
    laws by His behest.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: The passage instructs people to call on the Lord with lowliness and in secret,
    not to commit disorders on the earth after it has been ordered, and to call on
    Him with fear and longing desire.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:9
  text: God sends winds, laden clouds, and water to dead land, causing fruits to grow;
    the passage states that in this way God will bring forth the dead, and contrasts
    rich and bad soil.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:10
  text: Noah is sent to his people, calls them to worship God alone, and warns of
    the chastisement of a great day; the chiefs say he is in palpable error, and Noah
    answers that he is a messenger and counsellor.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:11
  text: Noah’s people treat him as a liar; Noah and those with him are delivered in
    the ark, while those who charge the signs with falsehood are drowned.
  category: action
  evidence_refs:
  - ev:8
- id: obs:12
  text: Houd is sent to Ad, calls them to worship God alone, and is called unsound
    of mind and an impostor by unbelieving chiefs; he answers that he is an Apostle
    and faithful counsellor.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:13
  text: Houd reminds Ad that they succeeded the people of Noah and were increased
    in tallness; when they demand the threatened punishment, he says vengeance and
    wrath will come from the Lord, and the passage later says Houd and those on his
    side are delivered while rejectors are cut off.
  category: sequence
  evidence_refs:
  - ev:9
  - ev:10
- id: obs:14
  text: Saleh is sent to Themoud, calls them to worship God alone, and presents the
    she-camel of God as a sign; he tells them to let her pasture on God’s earth and
    not harm her.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: Themoud are said to have been made successors to the Adites and to build castles
    on plains and hew houses in hills; they are told not to lay the earth waste with
    licentious deeds.
  category: setting
  evidence_refs:
  - ev:11
- id: obs:16
  text: Proud chiefs among Saleh’s people question weak believers about whether Saleh
    was sent by his Lord; the weak believers affirm belief, and the proud men reject
    what they believe.
  category: relationship
  evidence_refs:
  - ev:12
