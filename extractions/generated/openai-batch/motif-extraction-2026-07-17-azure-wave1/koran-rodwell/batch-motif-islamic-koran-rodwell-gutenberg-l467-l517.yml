canonical_text:
  quote: ''
  summary: Rodwell explains the chronological and thematic arrangement of Suras in
    his translation, citing earlier scholars and traditions. He characterizes early
    Suras as poetic, fragmentary, inward, concerned with truth, mental struggle, natural
    images, Heaven, Hell, judgment, and opposition at Mecca. He then describes a shift
    toward didactic, historical, disputational, legal, and martial tones in later
    and Medinan Suras, especially as Muhammad is represented as public warner, missionary,
    Apostle, legislator, and warrior.
  language: English
  quote_policy: summarized
