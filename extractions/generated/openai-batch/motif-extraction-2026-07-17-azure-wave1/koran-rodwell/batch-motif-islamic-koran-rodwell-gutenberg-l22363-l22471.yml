  summary: The passage gives divinely framed rules for inheritance, protection of
    orphans and the poor, sexual wrongdoing, repentance, treatment of wives, dowries,
    prohibited marriages, and marriage with enslaved believing women. It contrasts
    obedience to God and His prophet with rebellion, assigning gardens with flowing
    rivers to the obedient and fire or grievous torment to wrongdoers and rebels.
  language: English
