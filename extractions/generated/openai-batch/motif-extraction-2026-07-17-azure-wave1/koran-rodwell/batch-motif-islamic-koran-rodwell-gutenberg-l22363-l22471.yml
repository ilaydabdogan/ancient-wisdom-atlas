    siblings, and distant relations, with bequests and debts paid first.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:5
  text: The inheritance rules are called the law, ordinance, or precepts of God, and
    God is described as Knowing, Wise, and Gracious.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:6
  text: Those who obey God and His prophet are promised entry into gardens beneath
    whose shades rivers flow, where they abide forever.
  category: action
  evidence_refs:
  - ev:4
- id: obs:7
  text: Those who rebel against God and His apostle and break His bounds are placed
    in fire forever and receive shameful torment.
  category: action
  evidence_refs:
  - ev:4
- id: obs:8
  text: Women accused of whoredom require four witnesses; if the witnesses testify,
    the women are to be shut in houses until death releases them or God makes another
    way.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:9
  text: Two men who commit the same crime are to be punished, but if they turn and
    amend they are to be left alone.
  category: sequence
  evidence_refs:
  - ev:5
- id: obs:10
  text: Repentance is accepted for those who do evil ignorantly and turn speedily,
    but not for those who wait until death is close or who die unbelievers.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:11
  text: Believers are forbidden to inherit wives against their will or hinder them
    from marrying in order to recover part of a dowry.
  category: action
  evidence_refs:
  - ev:7
- id: obs:12
  text: Spouses are told not to reclaim a large gift through slander or manifest wrong
    after a strict bond of union has been received.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Marriage is forbidden with specified close relatives, foster relations, in-laws,
