canonical_text:
  quote: ''
  summary: The passage contrasts rejection of divine signs with belief and good works,
    describes God’s creation and governance of the cosmos, presents Lokman’s wisdom
    counsel to his son, warns against idolatry, arrogance, ancestral error, and Satanic
    deception, and emphasizes divine knowledge, judgment, resurrection, and human
    uncertainty about the Hour, the future, and death.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A man buys an idle tale in ignorance, misleads others from the way of God,
    turns it to scorn, and is assigned shameful punishment.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: When divine signs are rehearsed to the same type of rejecter, he turns away
    disdainfully as if he did not hear, and an afflictive punishment is announced.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those who believe and work good works are said to dwell forever in gardens
    of delight according to God’s true promise.
  category: setting
  evidence_refs:
  - ev:3
- id: obs:4
  text: God is described as creating the heavens without visible pillars, setting
    mountains on the earth, scattering animals, sending rain, and causing noble plants
    to grow.
  category: action
  evidence_refs:
  - ev:4
- id: obs:5
  text: Wisdom is bestowed upon Lokman, and he is taught thankfulness to God.
  category: action
  evidence_refs:
  - ev:5
- id: obs:6
  text: Lokman warns his son not to join other gods with God, calling such joining
    a great impiety.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:7
  text: The passage commands gratitude to God and parents, mentions the mother’s weakness
    in carrying the child and a two-year weaning, and limits obedience to parents
    if they urge association of others with God.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:8
  text: Lokman says God will bring everything to light even if it is the weight of
    a mustard seed hidden in a rock, in the heavens, or in the earth.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:9
  text: Lokman tells his son to observe prayer, enjoin right, forbid wrong, and be
    patient under what befalls him.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:10
  text: Lokman tells his son not to distort his face at people, not to walk loftily,
    to keep a moderate pace, and to lower his voice.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:11
  text: Some people dispute about God without knowledge, guidance, or an illuminating
    Book, and when told to follow what God sent down, they say they will follow the
    religion of their fathers.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Satan is described as bidding such people to the torment of the flame.
  category: action
  evidence_refs:
  - ev:11
- id: obs:13
  text: One who turns his face toward God in self-surrender and does good is said
    to have laid hold of a sure handle.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:14
  text: Unbelievers return to God, who will tell them their deeds and knows the secrets
    of the breast; they receive temporary provision before stern punishment.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:15
  text: The passage says that if all earthly trees became pens and the sea were increased
    into seven seas of ink, God’s words would not be exhausted.
  category: object
  evidence_refs:
  - ev:14
- id: obs:16
  text: Human creation and quickening hereafter are described as no more difficult
    for God than those of a single individual.
  category: attribute
  evidence_refs:
  - ev:15
- id: obs:17
  text: God causes night to enter day and day to enter night, and subjects the sun
    and moon to appointed courses.
  category: action
  evidence_refs:
  - ev:16
- id: obs:18
  text: Ships move on the sea through God’s favor, and when waves cover people like
    dark shadows they call upon God sincerely; after safe landing, some hesitate between
    two opinions.
  category: sequence
  evidence_refs:
  - ev:17
- id: obs:19
  text: The passage warns of a day when a father will not atone for a son, nor a son
    for a father.
  category: relationship
  evidence_refs:
  - ev:18
- id: obs:20
  text: God is said to possess knowledge of the Hour, to send rain, to know what is
    in the wombs, while no soul knows what it will gain tomorrow or in what land it
    will die.
  category: attribute
  evidence_refs:
  - ev:19
- id: obs:21
  text: A translator’s note says nothing certain is known about Lokman and reports
    an opinion identifying him with the Greek Aesop.
  category: other
  evidence_refs:
  - ev:20
