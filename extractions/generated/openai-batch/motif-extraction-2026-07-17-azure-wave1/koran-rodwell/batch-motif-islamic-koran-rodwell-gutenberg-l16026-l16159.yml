canonical_text:
  quote: ''
  summary: The passage exhorts perseverance until God's judgment, includes translator
    notes comparing some traditions with rabbinic and related sources, then opens
    Sura Saba. It declares God's dominion and knowledge, affirms the coming Hour,
    reward, punishment, and resurrection, recounts divine gifts to David and Solomon,
    describes Solomon's control over wind and Djinn labor, narrates Solomon's death
    being revealed when a creature gnaws his staff, and presents Saba as a blessed
    but ungrateful people punished by a flood, altered gardens, scattering, and following
    Eblis except for a faithful remnant.
  language: English
  quote_policy: summarized
