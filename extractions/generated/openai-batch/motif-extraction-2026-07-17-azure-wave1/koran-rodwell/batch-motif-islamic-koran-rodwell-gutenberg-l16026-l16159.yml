candidate_motifs:
- id: motif:1
  label: Divine judgment with reward and punishment
  taxonomy_refs:
  - divine_judgment
  basis: The passage affirms God's judgment, the coming Hour, reward for right action,
    and painful punishment for those opposing the signs.
  evidence_refs:
  - ev:1
  - ev:3
  - ev:4
  confidence: high
  cautions: This is a direct theological theme in the passage rather than a narrative
    episode alone.
- id: motif:2
  label: Restoration after bodily destruction
  taxonomy_refs:
  - resurrection
  basis: Unbelievers mock the claim that when people are torn and rent to pieces they
    will be restored in a new form.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: The statement is framed through opponents' reported speech, but the surrounding
    passage affirms the next life and the Hour.
- id: motif:3
  label: Divinely granted royal power over nature and craft
  taxonomy_refs:
  - royal_legitimacy
  - wisdom
  basis: David receives responsive nature and softened iron; Solomon receives wind,
    molten brass, and Djinn labor by divine will.
  evidence_refs:
  - ev:6
  - ev:7
  - ev:8
  confidence: medium
  cautions: The taxonomy labels are approximate; the passage emphasizes divine boon
    and righteous work more explicitly than political legitimacy as such.
- id: motif:4
  label: Supernatural workers constrained by a holy ruler
  taxonomy_refs: []
  basis: Djinn work in Solomon's presence by the will of his Lord, make structures
    and vessels, and face flame if they swerve from the command.
  evidence_refs:
  - ev:7
  - ev:8
  confidence: high
  cautions: No external comparison is asserted in the main passage.
- id: motif:5
  label: Hidden death revealed by a small creature
  taxonomy_refs:
  - wisdom
  basis: Solomon's corpse remains supported by a staff until a reptile gnaws it, revealing
    his death and exposing the Djinn's lack of knowledge of the unseen.
  evidence_refs:
  - ev:9
  confidence: medium
  cautions: The available taxonomy has no exact category for the hidden-death episode;
    'wisdom' is used only because the scene concerns knowledge and ignorance of the
    unseen.
- id: motif:6
  label: Blessed land ruined after ingratitude
  taxonomy_refs:
  - sacred_exchange
  basis: Saba is given gardens and supplies with an injunction to give thanks, but
    after turning aside and acting unjustly, they are punished.
  evidence_refs:
  - ev:10
  - ev:11
  - ev:12
  - ev:13
  confidence: medium
  cautions: The passage does not use covenantal language; the motif is inferred from
    provision, gratitude, ingratitude, and recompense.
- id: motif:7
  label: Punitive flood and transformed landscape
  taxonomy_refs:
  - flood_and_renewal
  basis: A flood is sent upon Saba, and their fertile gardens are transformed into
    gardens of bitter fruit, tamarisk, and a few jujube trees.
  evidence_refs:
  - ev:11
  - ev:12
  confidence: medium
  cautions: The available motif family includes renewal, but this passage emphasizes
    punishment and alteration, not explicit renewal.
- id: motif:8
  label: Scattering after rejection of ordered travel
  taxonomy_refs:
  - departure
  basis: Saba rejects the arranged pattern of easy stages, asks for longer distances,
    and is scattered utterly.
  evidence_refs:
  - ev:13
  confidence: low
  cautions: The taxonomy fit is weak; the passage describes dispersal more than a
    chosen heroic departure.
- id: motif:9
  label: Adversarial following and faithful remnant
  taxonomy_refs:
  - duality
  basis: Most of the people follow Eblis, while a remnant of the faithful does not.
  evidence_refs:
  - ev:14
  confidence: medium
  cautions: The passage gives only a brief statement and does not narrate Eblis's
    action in detail.
