  quote: ''
  summary: The passage closes an admonition concerning the Hypocrites of Medina, warning
    believers not to let wealth or children distract them from God and urging giving
    before death. It then begins Sura XXIV, Light, with legal and moral instructions
    on sexual misconduct, accusations, witnesses, oath procedures between spouses,
    communal response to calumny, avoidance of Satan’s steps, continued charity, divine
    forgiveness, and final judgment in which bodily members testify.
