  summary: The passage describes an imminent day of severing or severance marked by
    cosmic disruption, assembly, divine recompense, punishment of deniers, and reward
    of the god-fearing. It also presents creation and natural order as signs, describes
    a trumpet-blast, opened heavens, moving mountains, Hell, a blissful abode, and
    a final warning that people will see their deeds.
