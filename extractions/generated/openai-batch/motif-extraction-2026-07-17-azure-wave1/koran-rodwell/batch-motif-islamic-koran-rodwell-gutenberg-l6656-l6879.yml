candidate_motifs:
- id: motif:1
  label: Rejected apostle followed by communal punishment
  taxonomy_refs:
  - divine_judgment
  basis: Four communities are said to reject apostles or treat them as liars, after
    which each is destroyed or overtaken by chastisement.
  evidence_refs:
  - ev:1
  - ev:2
  - ev:3
  - ev:4
  confidence: high
  cautions: The extraction identifies a repeated internal pattern; it does not infer
    historical relationship beyond the passage.
- id: motif:2
  label: Judgment only after warning
  taxonomy_refs:
  - divine_judgment
  basis: The passage explicitly states that no city was destroyed without first having
    warners and admonition.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The motif is formulated from a doctrinal statement in the passage rather
    than a single narrative episode.
- id: motif:3
  label: Demanded sign-animal violated by the community
  taxonomy_refs: []
  basis: The Themoudites ask for a sign; Saleh gives the she-camel with a drinking
    arrangement and a warning not to harm her; they hamstring her and are punished.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: No available taxonomy family exactly matches the she-camel sign; no broader
    animal-sacrifice interpretation is asserted.
- id: motif:4
  label: Deliverance of a righteous household before destructive rain
  taxonomy_refs:
  - divine_judgment
  basis: Lot prays for deliverance, his family is saved except one tarrier, and the
    remaining people are destroyed by rain.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: Although rain is a destructive water image, the passage does not describe
    a flood or renewal cycle.
- id: motif:5
  label: Revelation descends through a faithful spirit into the heart
  taxonomy_refs:
  - wisdom
  basis: The Book comes down from the Lord through the faithful spirit upon the addressee's
    heart in clear Arabic so that he may become a warner.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The taxonomy reference to wisdom is broad; the passage itself frames the
    event as revelation and warning.
- id: motif:6
  label: True revelation distinguished from satanic and poetic speech
  taxonomy_refs: []
  basis: The passage denies that Satans were sent down with the Koran, says Satan
    descends on lying wicked persons, and describes poets as followed by the erring.
  evidence_refs:
  - ev:7
  - ev:9
  confidence: medium
  cautions: The passage supports an internal contrast but does not supply a named
    external motif family.
- id: motif:7
  label: Just measure and balance as sacred obligation
  taxonomy_refs:
  - sacred_exchange
  basis: Shoaib commands the people to fill the measure, weigh with exact balance,
    and not defraud others, within a prophetic warning scene ending in chastisement.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The taxonomy reference is based on the passage's exchange language; it
    is not a ritual exchange episode.
