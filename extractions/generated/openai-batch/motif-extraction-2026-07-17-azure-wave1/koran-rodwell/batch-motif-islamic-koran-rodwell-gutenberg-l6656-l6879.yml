canonical_text:
  quote: ''
  summary: 'The passage presents a sequence of rejected apostles and punished peoples:
    Houd and the Adites, Saleh and the Themoudites with the she-camel sign, Lot and
    his people, and Shoaib and the dwellers in the forest of Madian. It then describes
    the Koran as sent down from the Lord through the faithful spirit, affirms prior
    warning before destruction, commands the addressed warner to worship God and warn
    kin, and contrasts the Koran with satanic and poetic false speech.'
  language: English
  quote_policy: summarized
