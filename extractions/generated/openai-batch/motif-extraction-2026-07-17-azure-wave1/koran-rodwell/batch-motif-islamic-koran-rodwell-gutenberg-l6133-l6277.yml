  quote: ''
  summary: The passage recounts the aftermath of the calf episode involving Aaron
    and Samiri, announces the destruction of the false god and the uniqueness of God,
    describes resurrection judgment with trumpet, gathering, burden, flattened mountains,
    summoner, and restricted intercession, then retells Adam's covenant, the angels'
    worship, Eblis' refusal, Satan's temptation by the tree of Eternity, Adam and
    his wife eating and covering their nakedness, Adam's later guidance, descent from
    the garden, and warnings about rejecting divine signs. It closes with exhortations
    to praise, prayer, patience, and awaiting the end.
  language: English
