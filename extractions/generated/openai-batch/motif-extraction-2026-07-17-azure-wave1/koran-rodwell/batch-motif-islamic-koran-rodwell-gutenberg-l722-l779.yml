  summary: A translator's preface section evaluates proposed Gnostic, Ebionite, Essene,
    Sabeite, Jewish, Christian, and scriptural influences on Muhammad and the Koran.
    It discusses the doctrine that Jesus was not crucified but miraculously taken
    from earth, compares this with Enoch and Elijah, notes ritual and phraseological
    parallels, and mentions judgment/resurrection cry imagery.
  language: English
