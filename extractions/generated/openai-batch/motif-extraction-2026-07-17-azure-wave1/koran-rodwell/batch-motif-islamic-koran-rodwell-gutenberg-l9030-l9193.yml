  category: setting
  evidence_refs:
  - ev:2
- id: obs:4
  text: The apostle is said not to ask remuneration from the opponents and to bid
    them to the right path, while those who disbelieve in the life to come wander
    from it.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:5
  text: God is described as giving hearing, sight, and heart; causing humans to be
    born on earth; gathering them to Himself; making alive and killing; and governing
    the change of night and day.
  category: attribute
  evidence_refs:
  - ev:3
