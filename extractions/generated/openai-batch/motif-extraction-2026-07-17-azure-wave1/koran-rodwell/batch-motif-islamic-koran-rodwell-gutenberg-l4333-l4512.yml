candidate_motifs:
- id: motif:1
  label: Individual accountability and exact recompense
  taxonomy_refs:
  - divine_judgment
  basis: The passage states that no soul bears another's burden, each person is reckoned
    by effort, efforts are revealed, and exact recompense follows.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: The passage states the accountability doctrine directly; taxonomy assignment
    is a broad motif-family placement.
- id: motif:2
  label: Divine resurrection or second creation
  taxonomy_refs:
  - resurrection
  basis: God is said to cause death and life and to possess the second creation.
  evidence_refs:
  - ev:3
  confidence: high
  cautions: The passage does not narrate the resurrection process, only states divine
    power over it.
- id: motif:3
  label: Destruction of earlier wicked peoples as warning
  taxonomy_refs:
  - divine_judgment
  basis: Several earlier peoples and cities are named as destroyed by God before the
    warning of the approaching day.
  evidence_refs:
  - ev:4
  - ev:5
  confidence: high
  cautions: The passage lists the destructions but gives few details of each event.
- id: motif:4
  label: Continuity of warners
  taxonomy_refs:
  - wisdom
  basis: The warning figure is called one of the warners of old, connecting the present
    warning to earlier warning figures.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The taxonomy reference is general; the passage does not specify the older
    warners by name in this line.
- id: motif:5
  label: Heavenly ascents to God
  taxonomy_refs:
  - ascent
  basis: God is master of ascents by which the angels and the spirit ascend to him
    in a day of fifty thousand years.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: The passage describes angelic ascent, not a human ascent narrative.
- id: motif:6
  label: Cosmic dissolution on the judgment day
  taxonomy_refs:
  - divine_judgment
  - chaos
  basis: The approaching day is marked by heavens becoming molten brass and mountains
    becoming like flocks of wool.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The imagery is brief and tied to judgment; no full cosmogonic cycle is
    narrated.
- id: motif:7
  label: Rejected ransom at judgment
  taxonomy_refs:
  - divine_judgment
  basis: The wicked person would offer children, spouse, brother, kindred, and all
    on earth as ransom, but the text rejects this.
  evidence_refs:
  - ev:11
  confidence: high
  cautions: This is a judgment-scene motif rather than a completed exchange or sacrifice.
- id: motif:8
  label: Punishing fire claims the one who turns away and hoards
  taxonomy_refs:
  - divine_judgment
  basis: Fire is personified as claiming the person who turned back, went away, amassed,
    and hoarded.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The fire punishes the sinner; the passage does not present a world-destroying
    fire.
- id: motif:9
  label: Heavenly boundary tree with death-register leaves
  taxonomy_refs:
  - sacred_tree_axis
  - world_center
  basis: Translator notes describe the Lote-Tree of the extremity at the highest heavenly
    boundary, with leaves bearing human names and falling to indicate deaths.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: This motif is extracted from translator notes within the passage rather
    than from the main quoted verses in this range.
- id: motif:10
  label: Faithful pledge of Abraham
  taxonomy_refs:
  - covenant
  basis: Abraham is named as faithful to his pledge in the context of earlier pages
    and moral accountability.
  evidence_refs:
  - ev:2
  confidence: medium
  cautions: Only a brief reference to Abraham's pledge is present; no covenant episode
    is narrated.
