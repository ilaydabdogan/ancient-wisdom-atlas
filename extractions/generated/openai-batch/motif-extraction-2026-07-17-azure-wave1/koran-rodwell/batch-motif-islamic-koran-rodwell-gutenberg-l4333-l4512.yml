canonical_text:
  quote: ''
  summary: The passage presents mercy for lesser faults, individual accountability,
    recompense according to effort, divine power over creation, death, life, and a
    second creation, destruction of earlier peoples, warning of a near but divinely
    timed day, and a command to worship. Translator notes include the Lote-Tree/Sidrah
    at the heavenly extremity and a comparison to a refrain in another sura. The opening
    of Sura LXX describes a requested punishment, divine ascents by which angels and
    the spirit ascend, cosmic disruption on the approaching day, failed ransom by
    kin, and fire claiming the one who turns away and hoards.
  language: English
  quote_policy: summarized
