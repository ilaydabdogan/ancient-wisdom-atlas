- id: motif:7
  label: Failed ascent by tower toward heaven
  taxonomy_refs:
  - ascent
  basis: Pharaoh commands Haman to build a tower so he may reach the avenues of heaven
    and mount to the God of Moses, but the artifice ends in ruin.
  evidence_refs:
  - ev:14
  confidence: high
  cautions: The ascent is aspirational and architectural rather than an accomplished
