candidate_motifs:
- id: motif:1
  label: Final divine judgment with recompense
  taxonomy_refs:
  - divine_judgment
  basis: The passage repeatedly describes a final gathering or day of meeting in which
    every soul is recompensed, God judges with truth, and evil-doers lack an effective
    intercessor.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  confidence: high
  cautions: This is a passage-level motif identification based on repeated judgment
    language; it does not specify a detailed afterlife itinerary.
- id: motif:2
  label: Resurrection from graves
  taxonomy_refs:
  - resurrection
  basis: The passage states that on the day of meeting people will come forth from
    their graves and be exposed before God.
  evidence_refs:
  - ev:6
  confidence: high
  cautions: The passage gives a compact judgment scene rather than an extended resurrection
    narrative.
- id: motif:3
  label: Double death and double life
  taxonomy_refs:
  - death_rebirth
  - resurrection
  basis: The infidels say that God has given them death twice and life twice, and
    they ask whether escape is possible.
  evidence_refs:
  - ev:4
  confidence: medium
  cautions: The wording supports a death-life cycle, but the passage does not fully
    explain the sequence; human review should confirm the taxonomy assignment.
- id: motif:4
  label: Heavenly intercession for the faithful
  taxonomy_refs:
  - divine_judgment
  basis: Throne-bearing and throne-encircling beings pray for forgiveness, protection
    from hell, and entrance into Gardens of Eden for believers.
  evidence_refs:
  - ev:3
  confidence: medium
  cautions: The passage includes intercessory prayer, but elsewhere in the passage
    denies an effective intercessor for evil-doers; this motif is limited to prayer
    on behalf of believers.
- id: motif:5
  label: Rejected messenger and punishment of former peoples
  taxonomy_refs:
  - divine_judgment
  basis: Earlier nations reject apostles with proofs, scheme against them, and are
    seized by God in punishment; the same pattern is invoked as warning in the Moses-Pharaoh
    episode.
  evidence_refs:
  - ev:2
  - ev:7
  - ev:11
  confidence: high
  cautions: This identifies a recurring warning-punishment pattern inside the passage
    rather than a claim about historical transmission.
- id: motif:6
  label: Concealed righteous counselor in the tyrant’s household
  taxonomy_refs:
  - wisdom
  basis: A hidden believer from Pharaoh’s family counsels against killing Moses and
    reasons from proofs, consequences, and earlier examples.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: medium
  cautions: The available taxonomy only broadly supports this under wisdom; the passage
