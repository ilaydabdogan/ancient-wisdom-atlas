candidate_motifs:
- id: motif:1
  label: Final accountability and divine judgment
  taxonomy_refs:
  - divine_judgment
  basis: The passage speaks of a coming day without trafficking, friendship, or intercession;
    unbelievers are assigned to fire; the unjust have no helpers; righteous almsgivers
    receive reward without fear or grief.
  evidence_refs:
  - ev:2
  - ev:4
  - ev:8
  - ev:12
  confidence: high
  cautions: The passage emphasizes moral exhortation and judgment; detailed afterlife
    geography is not described in this excerpt.
- id: motif:2
  label: Demonstrations of resurrection and power over death
  taxonomy_refs:
  - resurrection
  basis: God is presented as making alive and causing death, reviving a man after
    one hundred years, restoring an ass's bones with flesh, and causing cut birds
    to return when called.
  evidence_refs:
  - ev:5
  - ev:6
  - ev:7
  confidence: high
  cautions: The bird episode is framed as reassurance and demonstration, not as a
    sacrifice in this passage.
- id: motif:3
  label: Moral duality of light and darkness
  taxonomy_refs:
  - duality
  basis: Believers under God's patronage are brought from darkness into light, while
    unbelievers under Thagout are brought from light into darkness.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage gives a moral and religious contrast, not a cosmological dualism
    between equal powers.
- id: motif:4
  label: Sacred exchange through almsgiving
  taxonomy_refs:
  - sacred_exchange
  basis: Almsgiving and spending for God's cause are linked to reward, multiplication,
    removal of sins, and divine knowledge of vows and donations.
  evidence_refs:
  - ev:2
  - ev:8
  - ev:9
  - ev:10
  - ev:12
  confidence: high
  cautions: The passage treats alms as pious obligation and moral action; the exchange
    is not commercial and includes warnings against reproach, injury, and display.
- id: motif:5
  label: Wisdom as divine gift
  taxonomy_refs:
  - wisdom
  basis: Wisdom is explicitly said to be given by God to whom he wills, and whoever
    receives it has received much good.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: No extended wisdom narrative is included; the motif is stated doctrinally.
- id: motif:6
  label: Divine signs validating power and guidance
  taxonomy_refs: []
  basis: The passage repeatedly mentions manifest or clear signs and presents resurrection
