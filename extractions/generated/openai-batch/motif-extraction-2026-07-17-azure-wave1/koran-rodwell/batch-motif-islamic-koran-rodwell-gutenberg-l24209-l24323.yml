canonical_text:
  quote: ''
  summary: A translator note compares respectful address to the Apostle with Talmudic
    rules for honoring a rabbi. Sura LVIII then presents God hearing a woman’s plea
    about her husband, rules about a repudiation formula and expiation, warnings against
    opposing God and the Apostle, divine knowledge of secret talk, resurrection and
    judgment, ethical instructions for private counsel and assemblies, almsgiving
    before private conference, condemnation of false allegiances, Satan’s mastery
    over those who forget God, and the contrast between Satan’s party and God’s party,
    whose members are strengthened and brought into gardens with flowing rivers.
  language: English
  quote_policy: summarized
