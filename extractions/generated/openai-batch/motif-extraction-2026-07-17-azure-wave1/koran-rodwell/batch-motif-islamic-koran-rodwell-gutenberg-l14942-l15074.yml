candidate_motifs:
- id: motif:1
  label: Resurrection accountability and second birth
  taxonomy_refs:
  - resurrection
  basis: The passage repeatedly names the day of Resurrection, return to God, and
    a second birth by which created beings are born again.
  evidence_refs:
  - ev:1
  - ev:4
  - ev:6
  confidence: high
  cautions: The passage states the doctrine briefly and does not narrate an individual
    afterlife journey.
- id: motif:2
  label: Flood judgment and rescue in a vessel
  taxonomy_refs:
  - flood_and_renewal
  - ark_vessel
  basis: Noah’s people are overtaken by the flood, while Noah and those in the vessel
    are rescued and made a sign.
  evidence_refs:
  - ev:2
  confidence: high
  cautions: Renewal after the flood is not elaborated in this excerpt; the passage
    emphasizes judgment, rescue, and sign.
- id: motif:3
  label: Divine judgment upon rejecting communities
  taxonomy_refs:
  - divine_judgment
  basis: Several communities or figures are described as rejecting messengers or proofs
    and then receiving divine punishments, including flood, fire as threatened fate,
    city destruction, earthquake, wind, cry, cleaved earth, and drowning.
  evidence_refs:
  - ev:2
  - ev:5
  - ev:7
  - ev:9
  - ev:10
  - ev:11
  - ev:12
  confidence: high
  cautions: The passage gives compressed examples rather than extended narratives
    for every named people.
- id: motif:4
  label: Deliverance of a faithful figure from fire
  taxonomy_refs: []
  basis: Abraham’s people call for him to be slain or burned, and the passage says
    God saves him from the fire.
  evidence_refs:
  - ev:5
  confidence: high
  cautions: No available taxonomy reference exactly matches this fire-deliverance
    episode; it should not be conflated with world-destroying fire.
- id: motif:5
  label: Righteous remnant saved while a city is destroyed
  taxonomy_refs:
  - divine_judgment
  basis: The messengers announce the destruction of an evil city while saying that
    Lot and his family will be saved, except his wife.
  evidence_refs:
  - ev:8
  - ev:9
  confidence: high
  cautions: The passage does not name the city in this excerpt and gives no extended
    account of the mode of urban destruction beyond heavenly vengeance.
- id: motif:6
  label: False guardians as frail refuge
