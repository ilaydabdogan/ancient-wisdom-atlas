canonical_text:
  quote: ''
  summary: The passage presents accountability at the Resurrection, recounts Noah’s
    flood and rescue in a vessel, Abraham’s preaching against idols and rescue from
    fire, Lot’s warning and the destruction of a city while his family is saved except
    his wife, Shoaib’s rejected warning to Madian, the ruin of earlier peoples and
    opponents of Moses, a spider-house similitude for false guardians, and instructions
    about reciting revelation, prayer, and disputing kindly with the People of the
    Book.
  language: English
  quote_policy: summarized
