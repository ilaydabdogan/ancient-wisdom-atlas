scenes:
- id: scene:1
  label: Purification command
  summary: Believers are instructed to purify themselves with water when possible
    and with clean sand when water is unavailable, with the stated purpose of purification
    and divine favour rather than burden.
  figure_refs:
  - fig:1
  - fig:2
  symbol_refs:
  - sym:1
  - sym:2
  evidence_refs:
  - ev:1
- id: scene:2
