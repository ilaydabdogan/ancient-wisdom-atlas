canonical_text:
  quote: ''
  summary: The passage gives rules for purification, recalls divine covenants and
    obligations, contrasts pardon and reward with punishment, addresses Jews and Christians
    as people of Scripture, rejects claims about the Messiah and divine sonship, recounts
    Moses and the Israelites at the holy land with the resulting forty years of wandering,
    and concludes with the story of the two sons of Adam, including an accepted and
    rejected offering, fratricide, a raven showing burial, and repentance.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: When believers are unclean they are told to purify themselves; if water is
    unavailable because of sickness, travel, retirement, or contact with women, they
    are told to use clean sand on face and hands.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: The passage states that God does not desire to burden the believers but to
    purify them and complete His favour upon them.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:3
  text: Believers are told to remember God's covenant with them, associated with the
    response that they heard and would obey.
  category: relationship
  evidence_refs:
  - ev:2
- id: obs:4
  text: Believers are commanded to stand as righteous witnesses for God and not to
    let ill-will prevent upright action.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:5
  text: Those who believe and act rightly are promised pardon and a great reward,
    while infidels who treat signs as lies are associated with Hell fire.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:6
  text: God is said to have restrained the hands of certain people who intended to
    stretch them against the believers.
  category: action
  evidence_refs:
  - ev:5
- id: obs:7
  text: God accepted a covenant from the children of Israel and raised twelve leaders
    among them.
  category: relationship
  evidence_refs:
  - ev:6
- id: obs:8
  text: The covenant with the children of Israel includes prayer, alms, belief in
    and help for apostles, and lending God a liberal loan, with promised removal of
    evil deeds and entry into gardens beneath which rivers flow.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:9
  text: Breaking the covenant is followed by curse, hardening of hearts, shifting
    words of Scripture, forgetting part of what was taught, and deceit, though a few
    are excepted.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:10
  text: Those who say they are Christians are also described as having accepted a
    covenant and then forgotten part of what they were taught; enmity and hatred are
    stirred among them until the day of Resurrection.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:11
  text: An Apostle is described as coming to the people of the Scriptures to clarify
    what had been concealed, and a light and clear Book are said to come from God.
  category: action
  evidence_refs:
  - ev:9
- id: obs:12
  text: The Book is described as guiding followers to paths of peace, bringing them
    from darkness to light, and guiding them to the straight path.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:13
  text: The passage rejects the statement that God is the Messiah son of Mary and
    asserts God's power over the Messiah, his mother, and all on earth.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:14
  text: The passage rejects the claim by Jews and Christians that they are sons of
    God and His beloved, saying they are created humans subject to pardon or chastisement.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:15
  text: The Apostle is described as a bearer of good tidings and a warner who has
    come after a cessation of apostles.
  category: attribute
  evidence_refs:
  - ev:12
- id: obs:16
  text: Moses tells his people to remember God's goodness in appointing prophets and
    kings among them and giving them unprecedented gifts.
  category: speech
  evidence_refs:
  - ev:13
- id: obs:17
  text: Moses commands his people to enter the holy land destined for them and not
    turn back.
  category: speech
  evidence_refs:
  - ev:14
- id: obs:18
  text: The people say that men of might are in the land and that they cannot enter
    until those inhabitants depart.
  category: speech
  evidence_refs:
  - ev:15
- id: obs:19
  text: Two men who fear their Lord and have received God's grace tell the people
    to enter through the gate and trust in God.
  category: speech
  evidence_refs:
  - ev:16
- id: obs:20
  text: The people refuse to enter while the inhabitants remain and tell Moses and
    his Lord to go fight while they sit.
  category: speech
  evidence_refs:
  - ev:17
- id: obs:21
  text: Moses says he has mastery only over himself and his brother and asks God to
    distinguish between them and the ungodly people.
  category: speech
  evidence_refs:
  - ev:18
- id: obs:22
  text: The land is forbidden to the people for forty years, during which they wander
    in the earth perplexed.
  category: sequence
  evidence_refs:
  - ev:19
- id: obs:23
  text: The story of the sons of Adam includes two offerings, one accepted and one
    not accepted.
  category: sequence
  evidence_refs:
  - ev:20
- id: obs:24
  text: The one whose offering was not accepted threatens to slay the other; the other
    replies that God accepts only from those who fear Him.
  category: speech
  evidence_refs:
  - ev:20
- id: obs:25
  text: The threatened brother says he will not stretch out his hand to slay the aggressor,
    because he fears God.
  category: speech
  evidence_refs:
  - ev:21
- id: obs:26
  text: The threatened brother says he would rather the aggressor bear both his sin
    and the aggressor's own sin and become an inmate of the Fire.
  category: speech
  evidence_refs:
  - ev:22
- id: obs:27
  text: The aggressor's passion leads him to slay his brother, and he becomes one
    of those who perish.
  category: action
  evidence_refs:
  - ev:23
- id: obs:28
  text: God sends a raven scratching on the ground to show the killer how to hide
    his brother's wrong, after which the killer laments and becomes repentant.
  category: sequence
  evidence_refs:
  - ev:24
