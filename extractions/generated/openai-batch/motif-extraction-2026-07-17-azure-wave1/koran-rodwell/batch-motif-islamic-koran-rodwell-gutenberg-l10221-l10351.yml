canonical_text:
  quote: ''
  summary: The passage warns of divine drowning for thanklessness, affirms human honor
    and provision, describes future judgment with books and blindness, recounts pressures
    on the apostle and commands prayer, presents the Koran as healing, addresses questions
    about the Spirit and the inimitability of the Koran, reports demands for miraculous
    signs, answers objections to a human apostle, depicts resurrection and Hell, recalls
    Moses, Pharaoh, signs, drowning, Israel’s settlement, and concludes with gradual
    recitation of the Koran and worshipful response from those previously given knowledge.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A divine warning says people could be returned to sea, struck by a storm blast,
    drowned for thanklessness, and left without a helper against the divine speaker.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:2
  text: The children of Adam are described as honored, carried by land and sea, provided
    with good food, and endowed beyond many creatures.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:3
  text: A future day is described when all men will be summoned with their leaders,
    and some will receive their book in the right hand and read it without being wronged.
  category: sequence
  evidence_refs:
  - ev:3
- id: obs:4
  text: One who is blind in the present life is said to be blind in the hereafter
    and to wander further from the way.
  category: attribute
  evidence_refs:
  - ev:3
- id: obs:5
  text: Opponents are said to have nearly beguiled the addressee from the revelation
    and nearly caused him to invent something else in the divine name.
  category: action
  evidence_refs:
  - ev:4
- id: obs:6
  text: If the addressee had leaned toward the opponents, he would have tasted woe
    in life and death and found no helper against the divine speaker.
  category: sequence
  evidence_refs:
  - ev:4
- id: obs:7
  text: Opponents are said to have nearly driven the addressee out of the land; the
    passage says this belongs to an unchanged divine way with earlier apostles.
  category: relationship
  evidence_refs:
  - ev:4
- id: obs:8
  text: The addressee is commanded to observe prayer from sunset into night, the daybreak
    reading, and additional night watching, with the possibility of being raised to
    a glorious station.
  category: action
  evidence_refs:
  - ev:5
- id: obs:9
  text: The addressee is instructed to ask the Lord for a perfect entry, a perfect
    forthcoming, and a helping power from the divine presence.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:10
  text: The passage declares that truth has come and falsehood has vanished, and says
    that the Koran is sent down as healing and mercy to the faithful but adds to the
    ruin of the wicked.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:11
  text: When asked about the Spirit, the addressee is instructed to say that the Spirit
    proceeds at the Lord’s command and that only a little knowledge has been given.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:12
  text: The passage says that men and Djinn assembled together could not produce the
    like of the Koran, even if they helped one another.
  category: relationship
  evidence_refs:
  - ev:7
- id: obs:13
  text: Objectors demand signs including a fountain from the earth, a garden with
    rivers, falling pieces of heaven, God and angels as vouchers, a house of gold,
    ascent into Heaven, and a readable book sent down.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:14
  text: The addressee is instructed to answer the miracle demands by praising the
    Lord and identifying himself as no more than a man and an apostle.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:15
  text: Some people object that God has sent a man as an apostle; the reply says an
    angel-apostle would have been sent if angels walked the earth as its familiars.
  category: speech
  evidence_refs:
  - ev:9
- id: obs:16
  text: The passage says that those whom God misleads will be gathered on the day
    of resurrection on their faces, blind, dumb, and deaf, with Hell as their abode
    and its fire rekindled.
  category: sequence
  evidence_refs:
  - ev:10
- id: obs:17
  text: The unbelievers question whether bones and dust will be raised as a new creation,
    and the passage answers by referring to God’s creation of the heavens and earth.
  category: speech
  evidence_refs:
  - ev:10
  - ev:11
- id: obs:18
  text: The passage says that if people held the treasures of the Lord’s mercy, they
    would refrain from spending them because man is covetous.
  category: attribute
  evidence_refs:
  - ev:11
- id: obs:19
  text: Moses is said to have been given nine clear signs; Pharaoh calls Moses enchanted,
    and Moses says the signs were sent by the Lord of the heavens and earth.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:20
  text: Pharaoh seeks to drive Moses and his people out of the land, after which the
    divine speaker drowns Pharaoh and all his followers.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:21
  text: After Pharaoh’s death, the children of Israel are told to dwell in the land,
    and a later promise is linked to bringing both parties together to judgment.
  category: sequence
  evidence_refs:
  - ev:12
- id: obs:22
  text: The Koran is described as sent down in truth, divided into sections, recited
    slowly, and sent down piecemeal.
  category: object
  evidence_refs:
  - ev:13
- id: obs:23
  text: Those previously given knowledge fall on their faces worshipping and weeping
    when the Koran is recited, and their humility increases.
  category: action
  evidence_refs:
  - ev:14
