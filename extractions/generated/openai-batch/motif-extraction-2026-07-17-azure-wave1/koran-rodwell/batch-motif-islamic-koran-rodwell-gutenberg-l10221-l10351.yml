candidate_motifs:
- id: motif:1
  label: Divine reckoning with books and differentiated fates
  taxonomy_refs:
  - divine_judgment
  basis: The passage describes a future summons, books received and read, non-wronging,
    and later resurrection punishment in Hell.
  evidence_refs:
  - ev:3
  - ev:10
  confidence: high
  cautions: The passage gives selected details of judgment rather than a full afterlife
    itinerary.
- id: motif:2
  label: Resurrection as new creation after bones and dust
  taxonomy_refs:
  - resurrection
  basis: The deniers ask whether bones and dust will be raised as a new creation,
    and the reply appeals to God’s creation of the heavens and earth.
  evidence_refs:
  - ev:10
  - ev:11
  confidence: high
  cautions: The resurrection statement is polemical and theological rather than a
    narrative of an individual rising.
- id: motif:3
  label: Rejected apostle pressured to alter revelation and leave the land
  taxonomy_refs: []
  basis: The apostle is nearly beguiled from revelation and nearly driven from the
    land, and this is linked to an unchanged pattern with earlier apostles.
  evidence_refs:
  - ev:4
  confidence: high
  cautions: The passage does not narrate a completed expulsion in this section.
- id: motif:4
  label: Miracle demands as tests of apostolic legitimacy
  taxonomy_refs:
  - ascent
  basis: Objectors demand fountains, rivers, falling heaven, God and angels, a gold
    house, ascent into Heaven, and a readable book; the apostle responds by emphasizing
    his human apostolic status.
  evidence_refs:
  - ev:8
  confidence: medium
  cautions: The ascent element is a demanded proof, not an accomplished ascent; other
    demanded signs have no supplied taxonomy reference.
- id: motif:5
  label: Inimitable and healing revelation
  taxonomy_refs:
  - wisdom
  basis: The Koran is described as healing and mercy to the faithful, containing similitudes,
    and impossible for assembled men and Djinn to imitate.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: medium
  cautions: The taxonomy link to wisdom is broad; the passage frames the issue primarily
    as revelation and proof.
- id: motif:6
  label: Pharaoh’s rejection answered by drowning judgment
  taxonomy_refs:
  - divine_judgment
  basis: Pharaoh rejects Moses, seeks expulsion, and is drowned with all his followers
    after Moses’ signs.
  evidence_refs:
  - ev:12
  confidence: high
  cautions: The passage recounts the event briefly and does not elaborate the full
    Exodus narrative.
- id: motif:7
  label: Night devotion and hoped-for exalted station
  taxonomy_refs: []
  basis: The addressee is commanded to pray at set times and keep night vigil, with
    the possibility that the Lord will raise him to a glorious station.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: The nature of the glorious station is not explained in the passage.
comparison_claims:
- id: claim:1
  claim: The passage explicitly presents the threatened expulsion of the addressee
    as part of an unchanged divine pattern already applied to earlier apostles.
  claim_level: same_function
  target: previously sent apostles in the same scriptural discourse
  evidence_refs:
  - ev:4
  counter_evidence_refs: []
  confidence: high
  limitations: The earlier apostles are not individually named in that specific statement.
- id: claim:2
  claim: The Moses-Pharaoh episode functions within the passage as an internal precedent
    for prophetic signs, rejection by a ruler, attempted expulsion, and divine drowning
    judgment.
  claim_level: same_function
  target: Moses and Pharaoh narrative within the passage and the Children of Israel
    tradition
  evidence_refs:
  - ev:12
  counter_evidence_refs: []
  confidence: medium
  limitations: The passage juxtaposes this episode with broader apostolic themes but
    does not explicitly state that every element parallels the addressee’s situation.
