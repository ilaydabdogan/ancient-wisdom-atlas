candidate_motifs:
- id: motif:1
  label: Divine provision and protection
  taxonomy_refs: []
  basis: The passage presents God as providing shade, mountain shelters, and protective
    garments for heat and war.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: This is a compact providence theme rather than a developed narrative episode.
- id: motif:2
  label: Divine judgment with witnesses and recompense
  taxonomy_refs:
  - divine_judgment
  basis: Future witnesses, rejected excuses, torment, added punishment, every soul's
    pleading and repayment, and chastisement of the thankless city all support a judgment
    pattern.
  evidence_refs:
  - ev:3
  - ev:4
  - ev:7
  - ev:12
  - ev:13
  - ev:14
  confidence: high
  cautions: The passage contains several judgment statements rather than one continuous
    judgment narrative.
- id: motif:3
  label: Covenant fidelity and oath-breaking
  taxonomy_refs:
  - covenant
  basis: The passage explicitly commands fidelity to the covenant of God, forbids
    breaking pledged oaths, warns against oath fraud, and condemns bartering the covenant
    for a mean price.
  evidence_refs:
  - ev:6
  - ev:7
  confidence: high
  cautions: The covenant is treated as moral-religious obligation; no separate covenant-making
    ceremony is narrated here.
- id: motif:4
  label: Resurrection-day clarification and individual accounting
  taxonomy_refs:
  - resurrection
  - divine_judgment
  basis: The passage names the day of resurrection as the time when disputed matters
    are clarified and describes every soul pleading and being repaid according to
    deeds.
  evidence_refs:
  - ev:6
  - ev:12
  confidence: high
  cautions: No detailed afterlife geography or journey is described.
- id: motif:5
  label: Revealed guidance and truth-bearing spirit
  taxonomy_refs:
  - wisdom
  basis: The Book is described as clarifying everything, guidance, mercy, and glad
    tidings; the Holy Spirit brings it down with truth; the Koran is contrasted with
    a foreign-tongued alleged teacher.
  evidence_refs:
  - ev:4
  - ev:9
  - ev:10
  confidence: medium
  cautions: The taxonomy label 'wisdom' is broad; the passage emphasizes revelation
    and guidance more specifically.
- id: motif:6
  label: Trial, exile, endurance, and divine mercy
  taxonomy_refs: []
  basis: Those who fled their country after trials, fought, and endured with patience
    are promised the Lord's forgiveness and grace.
  evidence_refs:
  - ev:12
  confidence: medium
  cautions: The passage gives a brief statement rather than a full departure-and-return
    story.
- id: motif:7
  label: Moral law expressed through lawful and forbidden foods
  taxonomy_refs: []
  basis: The passage distinguishes lawful and good food from specified forbidden foods
    and warns against falsely inventing divine legal categories.
  evidence_refs:
