canonical_text:
  quote: ''
  summary: The passage contrasts punishment for disbelievers with eternal garden reward
    for believers, commands fair judgment and obedience to God, the apostle, and authorities,
    condemns hypocritical resort to Thagout and Satanic misguidance, presents the
    apostle as a required judge and intercessory petitioner, urges preparedness and
    fighting on God's path including defense of the oppressed, contrasts the path
    of God with the path of Thagout, emphasizes the smallness of present life and
    inevitability of death, and instructs believers to consider the Koran and report
    public tidings to proper authorities.
  language: English
  quote_policy: summarized
