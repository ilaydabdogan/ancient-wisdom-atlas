candidate_motifs:
- id: motif:1
  label: Afterlife judgment with fire punishment and garden reward
  taxonomy_refs:
  - divine_judgment
  basis: The passage states that disbelievers will be cast into fire with renewed
    skins for torment, while believers and right-doers will enter eternal gardens
    with rivers and shade.
  evidence_refs:
  - ev:1
  confidence: high
  cautions: The passage gives afterlife destinations but does not narrate a full journey
    or trial scene.
- id: motif:2
  label: Apostolic judgment and full submission
  taxonomy_refs: []
  basis: Believers are commanded to obey God and the apostle, refer disputes to God
    and the apostle, and accept the apostle as judge without inner difficulty.
  evidence_refs:
  - ev:2
  - ev:4
  confidence: high
  cautions: No separate mythic trial narrative is described; the motif is legal-communal
    and revelatory in this passage.
- id: motif:3
  label: 'Two opposed paths: God versus Thagout and Satan'
  taxonomy_refs:
  - duality
  basis: The passage contrasts the path of God with the path of Thagout, links unbelievers
    with Thagout, and names Satan as one who misleads and has friends whose craft
    is powerless.
  evidence_refs:
  - ev:3
  - ev:7
  confidence: high
  cautions: The opposition is theological and ethical; no cosmological origin story
    for the opposing powers is given here.
- id: motif:4
  label: Exchange of present life for the life to come in sacred struggle
  taxonomy_refs:
  - sacred_exchange
  - sacrifice
  basis: The passage explicitly describes fighters on God's path as those who barter
    present life for the life to come and promises reward whether they are slain or
    victorious.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage is about commanded fighting; the 'sacrifice' taxonomy is applicable
    only in the broad sense of risking or losing life, not a ritual offering.
- id: motif:5
  label: Divine deliverer requested for the oppressed
  taxonomy_refs: []
  basis: The weak among men, women, and children pray to be brought out of an oppressive
    city and ask God to give them a champion and defender.
  evidence_refs:
  - ev:7
  confidence: medium
  cautions: The passage records a request for a champion and defender but does not
    narrate the arrival or deeds of such a figure.
- id: motif:6
  label: Inevitable death despite fortified refuge
  taxonomy_refs: []
  basis: The passage says death will overtake people wherever they are, even in lofty
    towers.
  evidence_refs:
  - ev:9
  confidence: high
  cautions: This is a didactic statement rather than a developed narrative episode.
- id: motif:7
  label: Revelation as internally consistent divine wisdom
  taxonomy_refs:
  - wisdom
  basis: The passage asks people to consider the Koran and states that if it were
    from someone other than God they would find many contradictions.
  evidence_refs:
  - ev:11
  confidence: medium
  cautions: The taxonomy fit is limited to divine instruction and discernment; the
    passage does not personify Wisdom or narrate a wisdom quest.
