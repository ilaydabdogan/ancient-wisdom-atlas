canonical_text:
  quote: ''
  summary: The passage recounts signs shown to Pharaoh and denied, then episodes involving
    David and Solomon’s divinely granted knowledge, Solomon’s communication with birds
    and ants, the lapwing’s report about Saba, Solomon’s letter to the woman ruler
    of Saba, the transport and disguise of her throne, her recognition and submission
    after seeing a glass palace, followed by the mission of Saleh to Themoud, a plot
    against him and divine destruction of the plotters, and Lot’s rebuke of his people.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: A person who has done amiss is described as able afterward to exchange evil
    for good, with God described as forgiving and merciful.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: A commanded hand is to be put into the bosom and come forth white but unharmed,
    as one of nine signs to Pharaoh and his people.
  category: action
  evidence_refs:
  - ev:1
- id: obs:3
  text: Signs wrought in plain sight are called magic, and are denied despite inward
    recognition; the passage points to the end of corrupt doers.
  category: sequence
  evidence_refs:
  - ev:1
- id: obs:4
  text: Knowledge is given to David and Solomon, and Solomon is described as David’s
    heir in knowledge and as taught the speech of birds.
  category: attribute
  evidence_refs:
  - ev:2
- id: obs:5
  text: Solomon’s hosts consist of Djinn, men, and birds, gathered and marched in
    bands.
  category: relationship
  evidence_refs:
  - ev:3
- id: obs:6
  text: At the Valley of Ants, an ant tells the ants to enter their dwellings so Solomon
    and his army will not crush them unknowingly.
  category: speech
  evidence_refs:
  - ev:3
- id: obs:7
  text: Solomon smiles at the ant’s words and prays to be stirred up to thankfulness,
    righteousness, and inclusion among righteous servants.
  category: action
  evidence_refs:
  - ev:3
- id: obs:8
  text: Solomon reviews the birds, notices the lapwing is absent, and threatens chastisement
    or slaughter unless it brings a clear excuse.
  category: action
  evidence_refs:
  - ev:4
- id: obs:9
  text: The lapwing reports from Saba that a woman reigns there, is gifted with everything,
    has a splendid throne, and that she and her people worship the sun instead of
    God.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:10
  text: Solomon sends his letter to the woman ruler and instructs that it be thrown
    down to them while awaiting their answer.
  category: action
  evidence_refs:
  - ev:4
  - ev:5
- id: obs:11
  text: The woman ruler consults her nobles about the letter; they state their strength
    and valour but leave command to her.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:12
  text: The woman ruler says kings spoil cities and abase powerful people when they
    enter them, and she chooses to send a gift and await the envoys’ return.
  category: speech
  evidence_refs:
  - ev:5
- id: obs:13
  text: Solomon rejects the gift or riches, says God’s gift to him is better, and
    threatens to come with forces that cannot be withstood.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:14
  text: Solomon asks who will bring the woman ruler’s throne before her people come
    submitting; an Efreet offers to bring it before Solomon rises, and one with knowledge
    of Scripture brings it in the twinkling of an eye.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:15
  text: When Solomon sees the throne set before him, he describes it as a favour of
    his Lord and a test of whether he will be thankful or unthankful.
  category: speech
  evidence_refs:
  - ev:6
- id: obs:16
  text: Solomon orders the throne altered so that the woman ruler will not know it,
    as a test of whether she has guidance.
  category: action
  evidence_refs:
  - ev:7
- id: obs:17
  text: When the woman ruler is asked whether the altered throne is like hers, she
    answers that it is as though it were the same.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:18
  text: The woman ruler sees the palace, thinks it is a lake of water, bares her legs,
    and is told it is a palace paved with glass.
  category: sequence
  evidence_refs:
  - ev:7
- id: obs:19
  text: The woman ruler declares that she has sinned against her own soul and resigns
    herself with Solomon to God, the Lord of the Worlds.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:20
  text: Saleh is sent to Themoud with the command to serve God, but the people become
    disputing groups.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:21
  text: Saleh asks his people why they hasten toward evil rather than seeking pardon
    from God; they say they augur ill concerning him and his companions, and he answers
    that their omens depend on God and that they are on trial.
  category: speech
  evidence_refs:
  - ev:8
- id: obs:22
  text: Nine persons in the city commit excesses and swear to attack Saleh and his
    family by night and deny witnessing the destruction of his family.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:23
  text: The plotters devise a device, God devises a device, and the plotters and their
    people are destroyed; their houses are left empty ruins, while those who believed
    and feared are delivered.
  category: sequence
  evidence_refs:
  - ev:9
- id: obs:24
  text: Lot rebukes his people for proceeding to filthiness and coming with lust to
    men rather than women, calling them ignorant.
  category: speech
  evidence_refs:
  - ev:10
