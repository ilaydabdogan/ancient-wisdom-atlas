canonical_text:
  quote: ''
  summary: The passage identifies Jesus as son of Mary while denying that God begets
    a son; warns of judgment; recounts Abraham’s appeal to his father against worship
    of powerless gods and Satan; commemorates Moses, Aaron, Ismael, Edris, and other
    chosen prophets; contrasts neglectful successors with repentant believers promised
    the Garden; affirms divine sovereignty, resurrection, gathering, descent to Hell,
    deliverance of the God-fearing, punishment of the wicked, and the disavowal of
    false gods.
  language: English
  quote_policy: summarized
