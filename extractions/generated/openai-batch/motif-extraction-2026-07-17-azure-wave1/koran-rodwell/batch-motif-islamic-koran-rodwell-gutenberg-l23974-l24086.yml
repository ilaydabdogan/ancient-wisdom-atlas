canonical_text:
  quote: God is the LIGHT of the Heavens and of the Earth.
  summary: The passage gives commands about entering houses, modesty, marriage, manumission,
    and obedience; presents God’s light through a lamp, glass, and blessed olive-tree
    parable; contrasts believers and infidels through images of light, mirage, and
    deep-sea darkness; describes worship, divine recompense, cosmic praise, weather,
    animals created from water, and judgment before God and the Apostle.
  language: English
  quote_policy: quoted
literal_observations:
- id: obs:1
  text: Believers are told not to enter houses other than their own until they have
    asked leave and saluted the inmates; if no one is present or they are told to
    go back, they are not to enter, while uninhabited houses may be entered for needs.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: Believing men are told to restrain their eyes and observe continence; believing
    women are told to restrain their eyes, observe continence, cover their bosoms
    with veils, and limit the display of ornaments to specified people.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: The community is told to marry single persons and good servants and handmaidens;
    those without a match are told to remain continent; eligible slaves desiring manumission
    are to receive deeds and support; female slaves are not to be forced into sin.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says that clear signs, an example from earlier people, and a caution
    for the God-fearing have been sent down.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: God’s light is described through a parable of a niche, lamp, glass like a
    shining star, a blessed olive tree, oil that almost shines without fire, and light
    upon light.
  category: object
  evidence_refs:
  - ev:5
- id: obs:6
  text: In temples where God’s name is remembered, men praise Him morning and evening
    and are not distracted by merchandise or traffic from remembrance, prayer, alms,
    and fear of a coming day.
  category: action
  evidence_refs:
  - ev:6
- id: obs:7
  text: The works of infidels are compared to a vapour in a plain that a thirsty person
    thinks is water, but when he reaches it he finds nothing and finds God present
    to pay his account.
  category: object
  evidence_refs:
  - ev:7
- id: obs:8
  text: The works or state of infidels are also compared to darkness on the deep sea,
    covered by waves, further waves, and clouds, so that a person can hardly see his
    own hand.
  category: setting
  evidence_refs:
  - ev:8
- id: obs:9
  text: All in the heavens and earth, including birds spreading their wings, are said
    to praise God; every creature knows its prayer and praise; the kingdom of the
    heavens and earth belongs to God and return is to God.
  category: action
  evidence_refs:
  - ev:9
- id: obs:10
  text: God is described as driving, gathering, and piling clouds; bringing rain from
    them; sending clouds like mountains charged with hail; directing hail as He wills;
    and producing lightning bright enough almost to take sight away.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: God causes day and night to alternate and has created every animal from water,
    with some moving on the belly, some on two feet, and some on four feet.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:12
  text: Some people say they believe in God and the Apostle and obey, but then turn
    back or withdraw when summoned for judgment; believers answer that they have heard
    and obeyed.
  category: speech
  evidence_refs:
  - ev:12
- id: obs:13
  text: A solemn oath to march forth is rejected as less valuable than obedience,
    and God is described as aware of what people do.
  category: speech
  evidence_refs:
  - ev:13
