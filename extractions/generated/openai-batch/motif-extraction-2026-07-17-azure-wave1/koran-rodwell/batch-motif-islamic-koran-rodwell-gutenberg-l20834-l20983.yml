    from Syria to Mecca, and Abu Sofian sent to Mecca for armed assistance.
  category: action
  evidence_refs:
  - ev:1
- id: obs:2
  text: A note explains a miracle at Bedr in which gravelstones and sand were cast
    into the eyes of the Meccans, with God identified as the caster.
  category: action
  evidence_refs:
  - ev:2
- id: obs:3
  text: Notes refer to Gabriel being sent to Muhammad with a promise of victory and
    to angels fighting for the Muslims.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The sura states that God will make the works of those who disbelieve and prevent
    others from God's way miscarry.
  category: action
  evidence_refs:
  - ev:4
