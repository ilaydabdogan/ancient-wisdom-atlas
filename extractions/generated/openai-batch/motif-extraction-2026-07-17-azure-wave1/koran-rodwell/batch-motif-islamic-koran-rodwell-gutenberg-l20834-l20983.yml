candidate_motifs:
- id: motif:1
  label: Divine judgment separating believers and unbelievers
  taxonomy_refs:
  - divine_judgment
  - duality
  basis: The passage repeatedly contrasts believers and unbelievers through cancelled
    sins versus failed works, protection versus no protector, Paradise versus fire,
    and guidance versus sealed hearts.
  evidence_refs:
  - ev:4
  - ev:7
  - ev:8
  - ev:9
  - ev:11
  confidence: high
  cautions: This is a passage-level thematic motif, not a claim about historical origin.
- id: motif:2
  label: Afterlife reward and punishment landscape
  taxonomy_refs:
  - afterlife_journey_map
  - divine_judgment
  basis: The text pictures Gardens and Paradise with flowing rivers, fruit, and pleasant
    drinks, contrasted with everlasting fire and boiling water.
  evidence_refs:
  - ev:6
  - ev:8
  confidence: medium
  cautions: The passage gives destinations and imagery, but it does not narrate an
    actual journey through the afterlife.
- id: motif:3
  label: Eschatological Hour arriving suddenly
  taxonomy_refs:
  - divine_judgment
  - resurrection
  basis: The passage asks what infidels await except the sudden coming of the Hour
    and says its signs have already come.
  evidence_refs:
  - ev:10
  confidence: high
  cautions: The passage does not elaborate a full resurrection sequence in this excerpt.
- id: motif:4
  label: Destruction of former peoples as warning
  taxonomy_refs:
  - divine_judgment
  basis: The passage instructs opponents to consider the fate of earlier peoples and
    stronger cities that God destroyed.
  evidence_refs:
  - ev:7
  confidence: high
  cautions: The earlier peoples and cities are not named in this excerpt.
- id: motif:5
  label: Divinely aided battle
  taxonomy_refs:
  - divine_judgment
  basis: The notes describe God's casting of gravelstones and sand into Meccan eyes,
    Gabriel's promise of victory, and angels fighting for Muslims; the sura also frames
    combat as a divine proving.
  evidence_refs:
  - ev:2
  - ev:3
  - ev:5
  confidence: medium
  cautions: Part of the evidence comes from translator's notes on Bedr rather than
    from the sura text in this excerpt.
- id: motif:6
  label: Sealed heart and blocked perception
  taxonomy_refs:
  - wisdom
  - duality
  basis: The passage says some hearts are sealed, asks whether locks are upon hearts,
    and describes God making certain people deaf and blind.
  evidence_refs:
  - ev:9
  - ev:11
  confidence: high
  cautions: The extracted motif is based on metaphoric bodily imagery in translation.
- id: motif:7
  label: Reciprocal divine aid for human loyalty
  taxonomy_refs:
  - sacred_exchange
  basis: The passage says, 'if ye help God, God will help you,' and promises firm
    feet to believers.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The passage does not explicitly describe a formal covenant or ritual exchange.
- id: motif:8
  label: Release or ransom after battle
  taxonomy_refs:
  - sacred_exchange
  basis: After combat and fettering captives, the passage permits either free dismissal
    or ransom until war lays down its burdens.
  evidence_refs:
  - ev:5
  confidence: medium
  cautions: This is a legal-war instruction with possible motif relevance; it should
    not be overread as a mythic ransom pattern without comparison.
