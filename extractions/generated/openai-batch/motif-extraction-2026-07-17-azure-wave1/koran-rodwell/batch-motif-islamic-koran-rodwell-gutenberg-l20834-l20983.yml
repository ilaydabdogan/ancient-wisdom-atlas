canonical_text:
  quote: ''
  summary: The passage contains translator's notes on the Battle of Bedr, including
    a caravan, Meccan succour, angelic aid, Gabriel's promise, and a miracle of gravelstones
    and sand. It then gives Sura XLVII, in which God contrasts unbelievers and believers,
    commands combat and treatment of captives, promises guidance and Paradise to those
    who believe and fight for God's cause, warns by the destruction of earlier peoples
    and cities, depicts Paradise with rivers and the fire with boiling water, speaks
    of sealed or locked hearts, warns of the sudden Hour, and rebukes those who resist
    a revelation commanding war.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
