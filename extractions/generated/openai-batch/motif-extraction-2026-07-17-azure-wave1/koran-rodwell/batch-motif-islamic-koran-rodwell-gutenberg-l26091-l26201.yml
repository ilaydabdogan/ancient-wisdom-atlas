canonical_text:
  quote: ''
  summary: The passage gives legal and moral ordinances concerning killing, disorder,
    theft, repentance, judgment, and relations with other communities. It describes
    God as sovereign judge, refers to resurrection and Fire, instructs the Apostle
    to judge with equity by what God has sent down, and presents the Towrat, Evangel,
    and Koran as revealed guidance connected by confirmation and judgment.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: An ordinance to the children of Israel equates slaying one person, except
    in specified cases, with slaying all mankind, and saving one life with saving
    all mankind alive.
  category: speech
  evidence_refs:
  - ev:1
- id: obs:2
  text: Apostles came with proofs of their mission, after which many committed excesses
    in the land.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Those who war against God and his Apostle and commit disorders on earth are
    assigned severe worldly punishments and torment in the next world, with an exception
    for those who repent before capture.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: Believers are told to fear God, desire union with Him, and contend earnestly
    on His path so that they may attain happiness.
  category: speech
  evidence_refs:
  - ev:4
- id: obs:5
  text: Infidels are said to have no accepted ransom from torment on the day of resurrection
    and to be unable to come forth from the Fire.
  category: attribute
  evidence_refs:
  - ev:5
- id: obs:6
  text: A male or female thief is assigned hand-cutting as recompense and warning,
    while one who turns to God and amends after wickedness is met by God as forgiving
    and merciful.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: God is described as possessing sovereignty over the heavens and earth, chastising
    and forgiving whom He wills, and having power over all things.
  category: attribute
  evidence_refs:
  - ev:6
- id: obs:8
  text: The Apostle is told not to be vexed by people who profess belief outwardly
    while not believing inwardly, and by Jews described as listeners to falsehood
    who shift words of the law from their places.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:9
  text: When disputants have recourse to the Apostle, he is told either to judge between
    them or withdraw, and if he judges, to judge with equity.
  category: action
  evidence_refs:
  - ev:8
- id: obs:10
  text: The Law or Towrat is said to have been sent down with guidance and light;
    prophets, doctors, and teachers judged by the Book of God as keepers and witnesses.
  category: object
  evidence_refs:
  - ev:9
- id: obs:11
  text: A retaliatory legal formula is given as life for life, eye for eye, nose for
    nose, ear for ear, tooth for tooth, and retaliation for wounds; compromising it
    as alms is said to expiate sin.
  category: speech
  evidence_refs:
  - ev:10
- id: obs:12
  text: Jesus, son of Mary, is said to follow in the prophets' footsteps, confirming
    the preceding Law, and to receive the Evangel with guidance and light.
  category: sequence
  evidence_refs:
  - ev:11
- id: obs:13
  text: The Koran is said to be sent down with truth, confirming previous Scriptures
    and acting as their safeguard; the addressee is told to judge by what God has
    sent down.
  category: object
  evidence_refs:
  - ev:12
- id: obs:14
  text: Different groups are said to have been given a rule and a beaten track, to
    be tested by what they have been given, and to return to God, who will tell them
    about their disputes.
  category: relationship
  evidence_refs:
  - ev:13
- id: obs:15
  text: Believers are told not to take Jews or Christians as friends; people diseased
    at heart are described as going to them out of fear of a change of fortune, and
    later coming to ruin.
  category: sequence
  evidence_refs:
  - ev:15
