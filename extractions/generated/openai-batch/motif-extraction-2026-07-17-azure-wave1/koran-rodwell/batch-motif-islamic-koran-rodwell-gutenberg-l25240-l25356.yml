canonical_text:
  quote: ''
  summary: The passage addresses believers regarding opponents who break oaths, reject
    faith, or associate partners with God; commands fighting under specified conditions;
    distinguishes true believers from ritual service alone; promises divine mercy,
    gardens, and reward to those who believe, flee, and strive; recalls divine aid
    at Honein; restricts access to the sacred Temple; critiques Jews, Christians,
    teachers, and monks for attributed doctrines and abuses; presents God's light
    and guidance as prevailing; warns hoarders of gold and silver of fiery punishment;
    and states that twelve months, including four sacred months, are established with
    God since creation.
  language: English
  quote_policy: summarized
literal_observations:
- id: obs:1
  text: Opponents are described as disregarding ties of blood or faith, pleasing with
    their mouths while their hearts are averse, selling God's signs for a low price,
    and turning others aside from God's way.
  category: attribute
  evidence_refs:
  - ev:1
- id: obs:2
  text: If opponents turn to God, observe prayer, and pay the impost, they are called
    brethren in religion; if they break oaths after alliance and revile the religion,
    believers are told to battle the ring-leaders of infidelity.
  category: sequence
  evidence_refs:
  - ev:2
- id: obs:3
  text: Believers are urged to fight Meccans who broke oaths, sought to expel the
    Apostle, and attacked first; God is said to chastise, shame, and grant victory
    by believers' hands.
  category: action
  evidence_refs:
  - ev:3
- id: obs:4
  text: The passage says only those who believe in God and the last day, observe prayer,
    pay legal alms, and dread none but God should visit the temples of God.
  category: setting
  evidence_refs:
  - ev:4
- id: obs:5
  text: Giving drink to pilgrims and visiting the sacred temple are contrasted with
    believing in God and the last day and fighting in God's way; the groups are said
    not to be equal before God.
  category: relationship
  evidence_refs:
  - ev:5
- id: obs:6
  text: Those who have believed, fled their homes, and striven with their substance
    and persons on God's path are promised mercy, good pleasure, gardens with lasting
    pleasure, and abiding reward.
  category: sequence
  evidence_refs:
  - ev:6
- id: obs:7
  text: Believers are told not to make fathers or brethren their friends if those
    relatives love unbelief above faith, and are warned not to prefer family, wealth,
    merchandise, and dwellings over God, the Apostle, and efforts on God's path.
  category: speech
  evidence_refs:
  - ev:7
- id: obs:8
  text: At Honein, believers are described as priding themselves on their numbers,
    finding those numbers useless, experiencing the earth as too narrow, and fleeing;
    God then sends a spirit of repose on the Apostle and faithful, sends unseen hosts,
    and punishes the Infidels.
  category: sequence
  evidence_refs:
  - ev:8
- id: obs:9
  text: Those who join gods with God are called unclean and are barred from approaching
    the sacred Temple after that year; God is said able to enrich the believers if
    they fear want.
  category: setting
  evidence_refs:
  - ev:9
- id: obs:10
  text: The passage commands war against certain people given the Scriptures until
    they pay tribute out of hand and are humbled.
  category: action
  evidence_refs:
  - ev:10
- id: obs:11
  text: The passage attributes to Jews the saying that Ezra is a son of God and to
    Christians the saying that the Messiah is a son of God, and says these sayings
    resemble those of infidels of old.
  category: speech
  evidence_refs:
  - ev:11
- id: obs:12
  text: Teachers, monks, and the Messiah son of Mary are described as being taken
    for lords beside God, although worship of one God only is commanded.
  category: relationship
  evidence_refs:
  - ev:12
- id: obs:13
  text: Opponents are said to desire to put out God's light with their mouths, while
    God desires to perfect His light and has sent His Apostle with guidance and a
    religion of truth to make it victorious over every other religion.
  category: action
  evidence_refs:
  - ev:13
- id: obs:14
  text: Many teachers and monks are said to devour people's substance in vanity and
    turn them from God's way; those who treasure gold and silver without spending
    it in God's way are warned of grievous torment.
  category: action
  evidence_refs:
  - ev:14
- id: obs:15
  text: On a day of punishment, hoarded treasures are heated in hell fire and used
    to brand foreheads, sides, and backs; the punished are told to taste what they
    treasured.
  category: sequence
  evidence_refs:
  - ev:15
- id: obs:16
  text: The passage states that the number of months with God is twelve according
    to God's book since the creation of the heavens and the earth, and that four of
    these months are sacred.
  category: other
  evidence_refs:
  - ev:16
