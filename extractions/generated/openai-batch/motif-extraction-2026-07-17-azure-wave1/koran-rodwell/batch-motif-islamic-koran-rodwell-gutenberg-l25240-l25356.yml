  limitations: The passage does not identify the earlier infidels or provide the earlier
    saying beyond asserting resemblance.
- id: claim:2
  claim: The passage contrasts ritual services connected with pilgrimage and the sacred
    temple with belief in God and the last day joined to fighting in God's way, and
    says the two are not equal before God.
  claim_level: same_function
  target: ritual service and temple visitation compared with faith and striving in
    God's way
  evidence_refs:
  - ev:5
  counter_evidence_refs: []
  confidence: medium
  limitations: This is an internal evaluative comparison rather than evidence for
    historical contact or shared motif transmission.
