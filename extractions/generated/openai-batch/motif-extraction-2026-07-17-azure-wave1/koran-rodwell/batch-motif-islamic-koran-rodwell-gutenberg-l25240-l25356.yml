candidate_motifs:
- id: motif:1
  label: Broken covenant or oath followed by sanctioned conflict
  taxonomy_refs:
  - covenant
  basis: The passage describes alliance, oaths, and their breach, then gives instructions
    to fight ring-leaders or Meccans who broke oaths and attacked first.
  evidence_refs:
  - ev:2
  - ev:3
  confidence: high
  cautions: The passage concerns legal-religious warfare and treaty breach; broader
    mythic covenant comparison should be reviewed by a human.
- id: motif:2
  label: Divine judgment through reward and punishment
  taxonomy_refs:
  - divine_judgment
  basis: God grants victory and punishment, promises mercy, gardens, and lasting reward
    to believers who strive, and warns hoarders of torment through fire-heated treasures.
  evidence_refs:
  - ev:3
  - ev:6
  - ev:8
  - ev:15
  confidence: high
  cautions: The passage combines temporal victory, afterlife reward, and punitive
    imagery; these should not be collapsed without context.
- id: motif:3
  label: Faithful departure and striving on the divine path
  taxonomy_refs:
  - departure
  basis: The passage names believers who have fled their homes and striven with substance
    and persons on God's path as highest in grade with God.
  evidence_refs:
  - ev:6
  confidence: medium
  cautions: The text states flight from home and striving but does not narrate an
    extended journey episode in this excerpt.
- id: motif:4
  label: Divine aid in battle by unseen forces
  taxonomy_refs: []
  basis: At Honein, after believers flee, God sends repose on the Apostle and faithful
    and sends unseen hosts, followed by punishment of the Infidels.
  evidence_refs:
  - ev:8
  confidence: high
  cautions: No supplied taxonomy reference directly names unseen battle hosts; motif
    label is passage-derived.
- id: motif:5
  label: Divine light opposed by hostile speech
  taxonomy_refs:
  - wisdom
  basis: The passage says opponents wish to put out God's light with their mouths,
    while God perfects His light and sends guidance and a religion of truth through
    the Apostle.
  evidence_refs:
  - ev:13
  confidence: medium
  cautions: The link to the supplied wisdom motif family is interpretive because the
    passage says guidance and truth rather than explicitly naming wisdom.
- id: motif:6
  label: Sacred time ordered from creation
  taxonomy_refs:
  - seasonal_cycle
  basis: The passage states that twelve months are fixed with God since the creation
    of the heavens and earth and that four are sacred.
  evidence_refs:
  - ev:16
  confidence: medium
  cautions: The passage concerns a sacred calendar rather than an explicit seasonal
    myth; taxonomy fit is approximate.
