canonical_text:
  quote: ''
  summary: The passage addresses believers after a military reverse. It describes
    God’s prior promise and aid, the believers’ failure, dispute, flight, and forgiveness;
    the Prophet’s call and gentle counsel; divine testing of hearts; Satan’s role
    in causing failure and fear; warnings about speech concerning death in travel
    and war; divine sovereignty over life and death; resurrection judgment; the apostle’s
    teaching role; the distinction between faithful and hypocrites; the honored state
    of those slain on God’s path; renewed trust when warned of Meccan forces; and
    the eventual separation of bad from good.
  language: English
  quote_policy: summarized
